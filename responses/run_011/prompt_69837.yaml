answer: |-
  **Seminar Discussion Sheet: The Heterogeneity Problem and *The Picture of Dorian Gray***

  **The Core Tension**
  The novel is often treated as a cautionary tale about hedonism, but for our purposes, it functions better as a stress test for the *coherence* of hedonism. Specifically, it dramatises the heterogeneity problem and the distinction between the 'liking' and 'wanting' systems in affective neuroscience. However, you must remain alert to where the text resists a naturalistic reading of well-being. Wilde is an aestheticist, not a value theorist, and the supernatural mechanism of the portrait does considerable philosophical heavy lifting that a theory of pleasure does not require.

  **1. Chapter 11 and the Heterogeneity Problem**
  The catalogue chapter is the textual equivalent of the heterogeneity objection. Dorian pursues perfumes, music, jewels, and ecclesiastical vestments with equal vigour. Wilde narrates these in a flat, enumerative register. This stylistic choice is philosophically significant.

  *   **For the Unity Thesis (Labukt):** One could argue the flatness implies a common underlying 'hedonic tone'. The narrator does not distinguish between the pleasure of a scent and the pleasure of a gem because, phenomenologically, they share a positive valence. The list is not a heap; it is a taxonomy of a single natural kind.
  *   **For the Sceptic:** Conversely, the sheer disparity of the items suggests that 'pleasure' is merely a linguistic convenience. The only thing connecting a medieval tapestry to a modern perfume is Dorian's decision to label the pursuit of both as 'pleasure'. The chapter reads like a pastiche of scientific cataloguing, mocking the idea that one can empirically isolate a single variable ('pleasure') across such diverse experiences.
  *   **Pedagogical Point:** Ask students whether the *style* of the list argues for ontological unity or linguistic laziness. If Wilde cannot find a verb more specific than 'enjoy' or 'study' to link these activities, does that support the felt-quality view, or does it expose the poverty of hedonistic vocabulary?

  **2. The Decline: Aristotelian Supervenience vs. Hedonistic Atomism**
  In the latter half of the novel, Dorian retains access to the stimuli of Chapter 11 but loses the capacity for enjoyment. He retreats to the opium dens not for pleasure, but for oblivion.

  *   **The Hedonist's Puzzle:** On a simple felt-quality account, this is difficult to explain. The sensory inputs remain. If pleasure is a distinct sensation caused by these inputs, why does the mechanism fail? A hedonist might appeal to habituation or diminishing marginal utility, but Dorian's condition seems deeper than mere tolerance.
  *   **The Aristotelian Fit:** This aligns neatly with the activity view. Pleasure supervenes on the unimpeded activity of a faculty in good condition. Dorian's faculties are not in good condition; his soul (manifest externally by the portrait) is corrupted. Therefore, the activity is impeded, and the pleasure cannot supervene. The novel suggests pleasure is not a separable consequence you can harvest, but a quality of the engagement itself. When the agent is ruined, the engagement is rotten, and the pleasure vanishes.
  *   **The Neuroscience Angle:** This maps onto Berridge's distinction. Dorian's 'wanting' system (incentive salience) remains hyper-active—driven by Lord Henry's suggestions—but his 'liking' system (hedonic impact) is blunted. The novel dramatises the decoupling of desire from enjoyment.

  **3. Lord Henry's 'New Hedonism': Desire or Pleasure?**
  You should challenge the classification of Lord Henry's philosophy as hedonism. His advice is to yield to every temptation and cure the soul by the senses. However, Dorian's execution of this plan reveals it to be a form of desire fulfilment or experience collection, closer to Nozick's intuition pump than Bentham's calculus.

  *   **The Nozickian Critique:** Dorian is driven by the desire to *have had* the experience. He seeks novelty and intensity, often regardless of the positive valence. He pursues the tragic, the obscure, and the dangerous. If hedonism is about maximising positive conscious states, Dorian is a failure. If it is about fulfilling the desire for a certain kind of life narrative, he succeeds until the end.
  *   **The Paradox of Hedonism:** The novel illustrates the paradox that direct pursuit leads to failure. But *why*?
      *   *Option A:* Pleasure is essentially a by-product (Sidgwick/Aristotle). You must aim at the activity, not the feeling.
      *   *Option B:* Dorian is a specific, ruined agent. A healthy agent might succeed where he fails.
      *   *The Text's Verdict:* Wilde leans towards Option A but enforces it through Option B. The portrait ensures that Dorian's moral decay physically manifests as an inability to enjoy. This suggests the failure is not just psychological but normative. You cannot flourish (enjoy) while acting against your nature (the portrait).

  **4. The Objection: Aestheticism is not Hedonism**
  A sharp student will argue that you have mislabelled the week. Wilde's aestheticism values beauty and intensity, not necessarily well-being or pleasure. An aestheticist can find value in a tragic, painful experience if it is beautiful. A hedonist cannot.

  *   **Concede the Point:** Acknowledge that Wilde often conflates 'pleasure' with 'intensity' or 'beauty'. Dorian finds the portrait's ugliness fascinating. That is an aesthetic response, not a hedonic one.
  *   **The Philosophical Payoff:** However, this conflation is precisely what makes the text useful. It forces students to distinguish between *what we value* and *what feels good*. If Dorian values the degradation of his soul because it makes for a more 'interesting' life, he is rejecting hedonism for an objective list theory (where 'interestingness' or 'authenticity' has value independent of pleasure). The novel thus becomes a case study in the conflict between hedonism and perfectionist or aesthetic theories of value.

  **5. Where the Book Resists the Reading**
  Be plain about the limitations. The portrait is a supernatural device. It externalises conscience and moral accounting.
  *   **Naturalism vs. Magic:** Contemporary theories of well-being (Feldman, Heathwood, neuroscience) are naturalistic. They rely on psychological or physiological states. Wilde relies on magic. The portrait allows Wilde to bypass the hard work of explaining *how* vice degrades capacity. He simply paints it on the canvas.
  *   **The Moral Cheat:** The ending restores a moral order that hedonism denies. Dorian dies ugly; the portrait becomes beautiful. This is a moral fable, not a phenomenological report. If you treat the novel as empirical evidence for the Aristotelian view, you are ignoring the ghost in the machine.
  *   **Chapter 11 as Pastiche:** Much of the catalogue chapter is Wilde showing off his reading. It may not be a philosophical argument about unity, but a stylistic exercise in decadence. Do not let students treat every item in that list as a data point; treat the *existence* of the list as the data point.

  **6. What the Novel Adds to the Debate**
  Despite these caveats, the novel offers two things the technical readings often lack:
  1.  **The Diachronic Dimension:** Technical debates often treat pleasure atomistically (moment-to-moment). *Dorian Gray* shows the temporal cost of hedonistic maximisation. You can maximise pleasure at *t1* in a way that destroys the capacity for pleasure at *t10*. Hedonism struggles to account for this without appealing to future consequences, but Dorian's ruin suggests the damage is to the *agent*, not just the circumstances.
  2.  **The Phenomenology of Boredom:** The technical readings discuss what pleasure *is*. Wilde describes what the *absence* of pleasure feels like when the stimuli are present. That specific texture of ennui—the inability to be moved by what used to move you—is a powerful argument against simple sensory accounts. It suggests that the 'attitudinal' component (Feldman) or the 'agent condition' (Aristotle) is not just a supplement to pleasure, but a prerequisite.

  **Summary for the Class**
  Use the novel to test the limits of the theories. Does Feldman's attitudinal pleasure survive Dorian's self-loathing? Does Heathwood's desire theory explain why getting what you want stops feeling good? Does Aristotle explain why the capacity for enjoyment rots? But do not let the text off the hook: point out where Wilde uses magic to solve a philosophical problem, and where he conflates beauty with goodness. The goal is not to prove Wilde was an Aristotelian, but to see if Aristotelianism explains Wilde's story better than hedonism does.
