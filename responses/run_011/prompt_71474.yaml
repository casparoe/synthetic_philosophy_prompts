answer: |-
  Excellencies, colleagues, friends, and family.

  Looking around this room, I am struck by the fact that we are all here for the same reason, though we likely disagree on almost everything else. To my left, national parliamentarians who have spent careers arguing that this Union lacks a democratic pulse. To my right, Commission officials who find that suggestion not just wrong, but offensive. And behind me, my family and neighbors from home, who love my mother but could not tell you the difference between a Directive and a Regulation if their lives depended on it.

  My mother spent twenty-two years navigating the tension between you. But tonight, she has asked me to address the question that divides this room: Is the European Union democratic?

  She has also given me a strict instruction: Do not answer by insisting Brussels works like a national capital. And do not answer by conceding that it does not.

  To our friends from the national parliaments: You are not fools. You are asking exactly the right question. If this institution were a government, your demand for simple electoral accountability—the ability to throw the rascals out—is the only question that matters. In a national government, legitimacy comes from the ballot box. Power is lent, and it can be recalled.

  But my mother's career was built on a different insight, one she explained to me at our kitchen table long before I understood politics. She argued that the Union is not legitimated like a government, but like a constitution.

  Think of it this way: A government is the team playing the game. A constitution is the rulebook. You judge a team by whether you can bench them when they lose. You judge a rulebook by how hard it is to cheat, and how difficult it is to rewrite the rules when the crowd gets angry.

  The purpose of a constitution is to bind everyone, including whoever wins the next election. It says: "There are some things a majority cannot do, even if they have the votes." So, the test of democracy here is not "Whom can we throw out?" The test is: "What would it take to change the rules, and who gets a say in that?"

  On this view, accountability is not silenced; it is redirected. It moves away from the ballot box and toward amendment, protocol, opt-out, and exit. It is a slower, heavier form of democracy. It is designed not to reflect the will of the moment, but to protect the interests of the future.

  I saw her live this distinction once, during a negotiation I was old enough to watch but young enough to find boring. It was a technical dispute over cross-border procurement thresholds—dry stuff. A visiting delegation, fresh from a landslide election victory at home, wanted to fast-track a change that would allow their national champions to bypass local bidding rules. They argued they had a mandate. They had the votes. They had the "democracy."

  My mother stalled them. She didn't argue policy; she argued procedure. She insisted that this specific threshold was locked behind a protocol that required unanimity and a ratification period of eighteen months. She forced them to go home, consult their oppositions, and wait.

  When I asked her why she made it so difficult, she told me: "Because the next election might bring someone who wants to break the system entirely. If we make the rules easy to change for us, we make them easy to destroy for them."

  She was not trying to win the news cycle. She was tending the fence.

  To the officials here: My mother never expected you to be elected. She expected you to be bound. To the parliamentarians: She never expected you to stop asking the hard questions. She needed you to ask them, so the rules remained sharp. And to my family: She didn't bring home stories of victories. She brought home stories of disasters that didn't happen because the rules held.

  That is the tribute I want to pay tonight. We often honor politicians for what they built—the hospitals, the roads, the laws. But my mother's work was to ensure that the structure itself remained standing, regardless of who was in charge. She accepted the frustration of being the brake pedal so that the car wouldn't fly off the cliff.

  She understood that in a Union of this size, legitimacy isn't about the thrill of the vote. It is about the security of the bond. It is the knowledge that the rules apply to the powerful as much as the weak, and that changing the game requires more than a momentary passion.

  Mom, you taught us that democracy is not just the noise of the campaign trail. Sometimes, it is the silence of the rules that hold when the noise gets too loud. You have kept the faith with the rulebook, even when the players wanted to tear it up.

  Thank you for twenty-two years of guarding the boundaries. We raise our glasses to you.
