answer: |-
  To the Seminar Participants,

  The bafflement you feel regarding the central bank's two documents is not a failure of comprehension; it is a successful detection of an epistemic fault line. You are observing an institution navigating the boundary between *risk* (uncertainty with known odds) and *ambiguity* (uncertainty with unknown odds), often termed Knightian uncertainty. Your working hypothesis—that Document A (the inflation fan chart) is a mechanism for reabsorbing ambiguity into risk to preserve accountability, while Document B (the stress test) admits the impossibility of such reabsorption—is astute. However, to evaluate it rigorously, we must reconstruct the implicit theory of uncertainty that Document A requires to function as more than mere decoration.

  **The Metaphysics of the Fan Chart**

  For Document A to be a legitimate representation of the committee's beliefs rather than a theatrical prop, specific conditions must hold regarding the nature of the economic future and the bank's access to it. First, the theory presupposes that the future distribution of inflation is *sufficiently stable* to be modeled as a single probability density function (PDF). Even if the mean shifts, the *shape* of the uncertainty must remain constant enough that deciles (the 10th, 20th... 90th percentiles) convey meaningful information. Second, it presupposes that *historical error is a sufficient statistic for future uncertainty*, provided a correction is applied. This is a hybrid frequentist-subjectivist stance: it uses the frequency of past mistakes to anchor the distribution but relies on subjective judgment (the committee's "hand-turned dial") to adjust for structural breaks.

  The critical philosophical move occurs in the "discretionary widening factor." In a strict Bayesian framework, uncertainty about the model parameters should result in a wider distribution automatically, derived from the integration of parameter uncertainty. In a strict frequentist framework, the width is determined solely by the historical variance. By manually scaling the width, the bank is acknowledging that neither the model nor the history captures the true uncertainty. However, by expressing this acknowledgment as a *scalar multiplier on the variance*, the bank is ontologically committing to the claim that all uncertainty can be reduced to variance within a single distribution. It treats "uncertainty about the distribution" (second-order uncertainty) as if it were merely "more uncertainty within the distribution" (first-order uncertainty). This is the reabsorption you identified. It allows the bank to say, "We knew the variance was high," rather than, "We did not know the variance."

  **The Widening Factor and the Shape of Ignorance**

  Can a single number scaled by hand coherently stand in for uncertainty about the shape of a distribution? The answer is generally no, unless one assumes the distribution belongs to a location-scale family (like the Normal or Student's t). The widening factor adjusts the *spread*, but it leaves the *skew* and *kurtosis* (the fat tails) largely determined by the historical error pool. If the true uncertainty involves a possibility of a regime shift—a change in the fundamental mechanics of inflation—no amount of widening a historical distribution captures that. A regime shift is not a wider bell curve; it is a different curve entirely. Therefore, for the widening factor to be legitimate, the bank must believe that the *structure* of the economy is stable, even if the *volatility* is not. If the bank suspects structural instability, the fan chart is not a representation of belief; it is a confidence interval around a guess, masquerading as a probability distribution.

  **Rival Accounts: Who is Excluded?**

  This practice quietly rules out several rival accounts of uncertainty.
  1.  **Multiple-Priors (Maximin) Models:** These models suggest that when information is scarce, agents hold a *set* of probability distributions rather than one. A fan chart cannot represent a set of priors without becoming illegible (a "fan of fans"). By publishing a single set of deciles, Document A excludes the possibility that the committee holds conflicting models that cannot be averaged into one.
  2.  **Radical Uncertainty (Keynes/Knight):** This view holds that for unique, complex events, numerical probabilities are meaningless. Document A contradicts this by assigning specific percentages (e.g., "90% probability") to outcomes.
  3.  **Robustness/Resilience Frameworks:** These prioritize surviving the worst-case scenario over optimizing for the expected case. Document A prioritizes the central projection and the "likely" range, implicitly telling policymakers to optimize around the mean, whereas Document B tells them to prepare for the tail.

  Conversely, the practice is compatible with a **Pragmatic Subjective Bayesianism**. If the committee views the fan chart not as an objective truth but as a "coherent betting quotient" that they are willing to defend, the widening factor is simply part of their prior update. However, this compatibility is strained by the use of *historical errors* to set the width. A strict subjective Bayesian would not need historical errors to justify their credence; their internal consistency is sufficient. The reliance on history suggests they want the authority of data without the constraints of data.

  **Diagnosing the Inconsistency**

  Is the juxtaposition of Document A and Document B a genuine contradiction? Epistemically, yes. One document asserts that the odds of inflation outcomes are quantifiable (even if adjusted); the other asserts that the odds of financial stability outcomes are unquantifiable. Both documents emerge from the same committee, analyzing the same economy, at the same time.

  However, institutionally, this is best diagnosed as **different evidential standards driven by different functions**. Document A is a *guidance* tool for markets. Markets demand a number to price assets. If the bank said, "We don't know the odds," markets might panic or ignore the guidance. The probabilistic form is a coordination device. Document B is a *regulatory* tool for banks. Its purpose is not to help banks price assets, but to force them to hold capital against survival. Here, false precision is dangerous; if a bank believes a crash has a 1% probability, it might undercapitalize. If told "this scenario is possible," it must prepare.

  Thus, the inconsistency is functional. Document A optimizes for *communication and anchoring*; Document B optimizes for *resilience*. But this functional defense does not save the epistemology. It merely explains why the contradiction is tolerated.

  **Rebuilding Document A on Document B's Presuppositions**

  If Document A were rebuilt on the philosophically honest presuppositions of Document B (that profound uncertainty is unquantifiable), the fan chart would vanish. It would be replaced by a set of named scenarios: "Target Achievement," "Supply Shock Persistence," "Demand Collapse." There would be no percentages.

  **What would be lost?**
  1.  **Accountability via Scoring:** You cannot score a scenario narrative against reality easily. You can score a 90% confidence interval (did the outcome fall inside?). Without numbers, the bank cannot be statistically calibrated.
  2.  **Market Anchoring:** Financial contracts rely on expected values. Removing the central projection removes the focal point for wage setting and price setting.
  3.  **Precision of Communication:** "Likely" is vague. "90% probability" is precise, even if falsely so.

  **Is the loss worth it?**
  If the goal is truth-telling, yes. If the goal is macroeconomic stabilization through expectation management, perhaps not. The numbers in Document A act as a "nominal anchor." Even if the probabilities are constructed via a discretionary widening factor, they provide a common language for the economy to coordinate around. Document B admits that in the realm of financial collapse, coordination is less important than survival.

  **Verdict on Your Hypothesis**

  Your hypothesis is substantially correct. The widening factor is indeed a device to reabsorb ambiguity into risk. However, I would refine one point: it is not necessarily a cynical device to "game" accountability. It may be a sincere, albeit philosophically confused, attempt to bridge the gap between what they know (history) and what they need to do (guide expectations). They are not lying about the uncertainty; they are translating ambiguity into risk because their institutional mandate requires them to speak the language of risk. Document B is indeed the more honest document, but Document A is the more powerful policy tool. The tension you have identified is the tension between *epistemic integrity* and *institutional efficacy*.

  ***

  ### Summary Table: Features and Presuppositions of Document A

  | feature_of_practice | candidate_presupposition | status | rival_view_excluded | change_required_if_replaced |
  | :--- | :--- | :--- | :--- | :--- |
  | **Single Probability Distribution** | The future can be represented by one PDF; uncertainty is reducible to variance. | strictly_required | Multiple-Priors / Imprecise Probability | Replace fan chart with a set of distributions or scenario narratives. |
  | **Decile Bands (10%-90%)** | Probabilities are meaningful and communicable; agents can act on specific likelihoods. | strictly_required | Radical Uncertainty (Knight/Keynes) | Remove percentages; use qualitative likelihoods (e.g., "plausible," "remote"). |
  | **Historical Error Pool** | Past structural errors are a valid proxy for future model uncertainty (stationarity of error). | compatible_among_several | Strict Subjective Bayesianism (priors need not be data-driven) | Shift to purely expert-elicited priors without historical back-testing. |
  | **Discretionary Widening Factor** | Uncertainty about the model (ambiguity) can be quantified as increased variance (risk). | strictly_required | Distinction between Risk and Ambiguity | Acknowledge ambiguity explicitly; stop scoring forecasts against the bands. |
  | **Ex-Post Scoring** | The distribution is calibratable; the bank can be held accountable for frequency of misses. | strictly_required | Robustness/Resilience Frameworks | Shift accountability from "accuracy" to "robustness of policy under miss." |
  | **Central Projection** | There is a single "most likely" path that serves as a coordination anchor for the economy. | compatible_among_several | Equilibrium Indeterminacy (multiple valid paths) | Present multiple equally weighted paths without designating a central one. |

