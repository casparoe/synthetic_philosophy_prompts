      *   *Missing:* "Stewardship" or "Custodianship." The idea that we are temporary holders of something valuable (truth, beauty, life) that must be passed on, not necessarily *by us* or *credited to us*, but simply *preserved*. This is distinct from Contribution (adding to) and Audience (performing for).
