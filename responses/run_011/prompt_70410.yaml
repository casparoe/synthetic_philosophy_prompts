      *   *Philosophical Coherence:* Scheffler's thought experiment relies on *causal* continuity without *symbolic* continuity. The "Blindness" stipulation asks for causal continuity (they flourish) but zero symbolic continuity. This is hard to conceive. If they use our science, they inherit our concepts. If they inherit our concepts, they inherit *us* implicitly.
      *   *What changes my mind?* Empirical data on "anonymous contribution." Do scientists care if their theorem is used but attributed to "Unknown"? Do artists care if their art moves people but is labeled "Folk"?
      *   *Fragility:* The definition of "Contribution." If Contribution requires the *project* to be recognized as a shared human endeavor, blindness kills it. If it just means "causal efficacy," it survives.

