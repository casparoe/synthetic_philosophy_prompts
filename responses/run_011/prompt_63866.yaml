  **Framing Check:** You haven't garbled it. Your summary is technically precise: Good's Theorem proves the *ex-ante* expected utility of the option to observe is $\ge$ the *ex-ante* expected utility of acting immediately, provided the agent is a standard Bayesian EU-maximizer. The equality case (when actions don't change) is often overlooked, but your draft captures it. The point that counterexamples break background conditions is exactly right.

  **Core Assumptions (The "Pile of Background Conditions")**
  A1: **SEU Maximization:** The agent chooses acts strictly to maximize expected utility relative to current precise probabilities.
  A2: **Strict Conditionalization:** Beliefs update via Bayes' rule on fixed, known likelihood functions (no learning the channel).
  A3: **Preference Stability:** The utility function is stable over time and defined over outcomes, not belief states (no "taste for news").
  A4: **Causal Isolation:** The act of observing does not causally alter the world state or other agents' strategies (no signaling).
  A5: **Action Set Stability:** The set of available acts does not shrink or change constraints conditional on the observation.

  ***

  **Vignette Sorting**

  **Tier 1: Guarantee is fine**
  *   **10. Conference room (Baseline):** Confidence **1.0**. Attacks: None. This is the canonical case the theorem was built for.
  *   **4. Offshore drilling (Post-contract):** Confidence **1.0**. Attacks: None. *Note:* This is the equality case ($V=0$); the guarantee holds, but there is no strict improvement.

  **Tier 2: Fine but deserves a footnote**
  *   *(None strictly fit here without merging tiers, but 4 is the best candidate for "technically fine but intuitively disappointing".)*
  *   **1. Genetic test (No treatment):** Confidence **0.3**. Attacks: **A3**. *Flag:* This is secretly the same case as #2. If utility includes "peace of mind," the theorem's definition of utility is violated. If utility is only over physical health, EV is zero (Tier 1). The vignette stipulates utility *does* depend on knowing, so the guarantee breaks.

  **Tier 3: Shaky / depends on modeling choices**
  *   **7. Noisy sensor (Calibration):** Confidence **0.6**. Attacks: **A2**. If you model the calibration parameter as part of the state space, the theorem holds; if you treat the likelihood function as mutable based on the data, conditionalization fails.

  **Tier 4: Guarantee is straight up broken**
  *   **2. Surprise utility:** Confidence **0.1**. Attacks: **A3**. Explicitly defines utility over belief-states, violating the outcome-only requirement.
  *   **3. Poker peek (Announced):** Confidence **0.1**. Attacks: **A4**. Observing signals to opponents, changing the world state/strategies causally.
  *   **5. Hyperbolic discounter:** Confidence **0.1**. Attacks: **A3**. Preferences change between the decision to look and the decision to act (time inconsistency).
  *   **6. Ellsberg ambiguity:** Confidence **0.2**. Attacks: **A1**. Ambiguity aversion violates SEU maximization with precise priors.
  *   **8. Self-audit (Values change):** Confidence **0.0**. Attacks: **A3**. The utility function itself mutates upon observation.
  *   **9. Physician (Mandatory duty):** Confidence **0.0**. Attacks: **A5**. Observing triggers a constraint that removes the previously optimal action.

