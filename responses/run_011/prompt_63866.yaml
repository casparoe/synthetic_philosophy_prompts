  **Notes on Duplicates & Misstatements**
  *   **1 & 2 are the same case:** Both violate **A3** by making utility dependent on the belief state (anticipation/surprise) rather than just external outcomes.
  *   **3 & 9 are structural twins:** Both violate the *ceteris paribus* assumption of the decision problem. #3 changes the game (A4), #9 changes the rules (A5), but in both cases, the observation itself alters the available payoff structure.
  *   **4 is not a counterexample:** Many students mistakenly think "no action change" means the theorem fails. It doesn't; it just means the value of information is zero, which satisfies "at least as high."
