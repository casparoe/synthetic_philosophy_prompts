answer: |-
  The booth smelled of ozone and stale recycled air, a sharp contrast to the scent that waited inside the aperture. Elena slid her credit chip into the slot. The display flickered: *BALANCE: 42 MINUTES*. Enough for a week of nights, or one long afternoon. She chose the latter. She settled into the ergonomic chair, the leather cold against her spine, and pulled the visor down.

  Beside her, in the second chair, sat Margaret. She never watched, not really. She kept her eyes on the timer, her hands folded tightly in her lap, knuckles white.

  "Ready?" Elena asked.

  "Ready to watch a ghost," Margaret said. Her voice was dry, stripped of the warmth it once held when she spoke to her son.

  Elena tapped the interface. *DATE: JULY 14, 2041. LOCATION: BACK GARDEN. TIME: 15:30.*

  The walls of the booth dissolved. They were no longer in the sterile gray facility in the city center. They were sitting on a wrought-iron bench under the shade of a maple tree. The light was heavy and golden, the kind that only exists in mid-summer, thick with dust motes dancing in slow motion. The air smelled of cut grass and charcoal.

  David was there.

  He was standing by the grill, wearing that faded blue shirt with the frayed collar. He was turning a burger with a pair of tongs, laughing at something Elena had said—or would say, or had said, depending on where you stood. In the reconstruction, she was there too, a younger version, handing him a plate. They were whole. They were solid.

  "He looks tired," Margaret said. She didn't look at David. She looked at the credit counter hovering in the lower corner of their vision. *41:59... 41:58...*

  "He's concentrating," Elena corrected. "He always burned the onions if he didn't watch them."

  "He is dead, Elena."

  Elena shifted on the bench. In the simulation, the iron was warm. In the booth, it was hard plastic. "He isn't dead. He's just then. We are here. He is there. It's a matter of coordinates."

  Margaret finally turned her head. Her eyes were red-rimmed, hard. "Coordinates? You speak of my son like he is a package lost in the mail. You say he is 'there.' Where is there? Show me the address. Show me the road."

  "It's not a place you can drive to," Elena said, watching David flip the burger. He looked up, shielding his eyes from the sun. In the recording, he was alive. He was breathing. The chest rose and fell. "Existence isn't just what is happening now. That's too small. Everything that ever happened is still real. It's all part of the shape of the world. He's a part of that shape. He hasn't been erased."

  "Erased?" Margaret's voice rose, cracking the quiet hum of the booth. "You think death is erasure? No. Death is absence. When he died, he stopped being. Completely. What you are looking at is a shadow. It's a trick of light and memory scraped from the air. You are staring at a photograph that moves and pretending it breathes."

  "It's not a trick," Elena said. She reached out, her hand hovering over David's shoulder. She couldn't touch him, of course. The aperture was strictly observational. Her hand passed through the light of his shirt. "He exists. Simpliciter. That moment is fixed. It doesn't vanish because we moved past it. If I go to Paris, I don't cease to exist in London. I'm just not in London anymore. He's just not in *now*."

  Margaret leaned forward, invading the space between them. "When you go to Paris, you are still whole. You are all there. What you are pointing at... that isn't David. That is a slice. You have cut him up. You have taken a sliver of him from five years ago and you are worshipping it. But the man? The whole man? He is gone. He is not waiting for you in the past. He is not hiding behind a hill of time. He is nothing."

  "He is not nothing," Elena said, her voice tight. "If he were nothing, this wouldn't hurt. If he were nothing, why does looking at him feel like standing next to a fire?"

  "Because you are burning yourself on memory," Margaret said. "Grief requires absence, Elena. You cannot mourn what is present. By insisting he is 'there,' you are refusing to let him be dead. You are keeping him in a kind of limbo. You aren't honoring him. You are hoarding him."

  The timer blinked. *30:00*. Half the credit was gone.

  David in the garden took a bite of the burger. He chewed, smiled, and wiped his mouth with the back of his hand. It was such a mundane gesture. So entirely him. Elena felt a ache in her chest, sharp and physical.

  "I am not hoarding," Elena said. "I am visiting. If you believe time is a river that washes everything away, then yes, he's gone. But if time is a landscape... then he's just on the other side of the valley. I'm just looking through a telescope."

  "A telescope shows you stars that might already be dead," Margaret countered. "Does that mean they are alive? You are confusing visibility with existence. You want him to be alive because you cannot bear the finality of the end. But the end is the only thing that gives the life meaning. If he is still 'there,' then he never left. And if he never left, you never lost him. And if you never lost him, you have no right to this grief."

  "I have every right," Elena said. "I miss him."

  "You miss the idea of him," Margaret said. "You are paying to sit in a box and talk to a recording. You are starving yourself to feed a ghost. Look at the balance, Elena."

  Elena looked. *25:00*. The cost per minute was high. The facility needed to maintain the trace fields, to gather the delayed photons. It was luxury pricing.

  "I can afford it," Elena lied.

  "You sold the car," Margaret said. "I saw the notice. You sold the car to buy minutes."

  "It's not relevant."

  "It is relevant because he would have wanted you to drive," Margaret said. "He would have wanted you to eat, to sleep, to live in the now. You are living in a tomb of your own making. You think you are a four-dimensionalist? You think you are being clever? You are just a woman who is afraid to let go."

  "I am being precise," Elena snapped. "There is a difference. You think he ceased to be. I know he is fixed. Your way makes him vanish. My way keeps him real."

  "Your way keeps him static," Margaret said softly. "He doesn't grow. He doesn't change. He is stuck turning that burger forever. That isn't life. That is a statue. I loved a man who changed. Who aged. Who died. You love a snapshot. You are denying him his history because you don't like the ending."

  David in the garden turned toward them. Toward the future. He opened his mouth to speak. The audio sync caught up. *"El? You want the other bun?"*

  Elena's breath hitched. "Yes," she whispered to the air. "Yes, please."

  Margaret stood up. The movement disrupted the field slightly; the image shimmered, David's face blurring for a second before restabilizing.

  "You cannot answer him," Margaret said. "He cannot hear you. He is not there. He is dead. Say it."

  "No."

  "Say it. He is dead."

  "He is elsewhere," Elena said, her eyes fixed on David's waiting smile.

  "Elsewhere implies you can go to him," Margaret said. "You can't. You can only watch until the money runs out. And then what? You sit in the dark? That is not philosophy, Elena. That is torture."

  The timer beeped. *05:00*. Warning light pulsed amber.

  "If I stop," Elena said, "it feels like killing him again. Every time the light goes out, I lose him."

  "If you continue," Margaret said, "you lose yourself. You are spending your future to watch his past. You are trading your life for his shadow. Is that what he is worth? Your survival?"

  David was still waiting. The burger was cooling in his hand. The sun was beginning to dip, the light changing from gold to orange. In the original moment, this was followed by rain. A sudden summer storm. They would run inside. He would dry her hair with a towel. That was the next minute. That was the next credit.

  *03:00*.

  Elena's hand hovered over the extension pad. It required a double swipe. A confirmation.

  "He exists," Elena said, but her voice was weaker now. The certainty was eroding, not because the philosophy was wrong, but because the cost was real. The car was gone. The rent was due. The block universe might be real, but her access to it was metered.

  "He existed," Margaret corrected. "Past tense. That is the only tense that matters for the dead. To treat them as present is to deny them their rest. And to deny yourself your life."

  *02:00*.

  David shifted his weight. He was getting tired of holding the plate. In the real timeline, she would have taken it by now. In the booth, she was frozen.

  "If I let this fade," Elena said, "do I admit you were right?"

  "You admit that time flows," Margaret said. "You admit that things end. You admit that grief is the price of love, not a problem to be solved with enough credits."

  *01:00*.

  The amber light turned red. The hum of the booth grew louder, a warning whine.

  Elena looked at David. He was so clear. The frayed collar. The smudge of charcoal on his thumb. He was real. He was *there*. But he was trapped in the amber of that afternoon, and she was trapped in the booth.

  "I can't take you with me," Elena whispered.

  "You never could," Margaret said. "He isn't coming."

  *00:30*.

  Elena's finger hovered over the swipe panel. She could extend. She could sell the necklace next. She could live on credit. She could stay in the garden forever, as long as the power held.

  But David was waiting for a plate that wouldn't come. The rain was coming, and she wouldn't be there to run with him. She was leaving him in the sun.

  If she stayed, she was a ghost haunting her own life. If she left, she was a widow walking into the rain.

  *00:10*.

  Elena pulled her hand back. She folded it in her lap, mirroring Margaret's posture.

  "Goodbye, David," she said.

  He smiled, unaware. *"El?"*

  The screen went black.

  The booth returned. The sterile gray walls rushed back in. The smell of cut grass vanished, replaced by ozone. The silence was heavy, absolute.

  Margaret did not speak. She simply reached out and placed her hand over Elena's. Her skin was warm, alive, present.

  "Come on," Margaret said. "Let's go home."

  Elena looked at the credit reader. *00:00*. The chip ejected with a soft click. She took it. It was just plastic now.

  "He's still there," Elena said, her voice barely audible in the gray room. "In the July of five years ago. He's still turning that burger."

  "Yes," Margaret said, opening the booth door. The hallway light was harsh, fluorescent. "But the burger is cold. And we are hungry."

  Elena stood up. Her legs felt stiff. She followed Margaret out into the hallway. She did not look back at the booth. She walked into the present, into the flow, into the loss. It hurt more than the watching. It hurt like breathing. But it was hers.
