answer: |-
  **PHIL 450: Philosophy of Religion — Final Examination**
  **Time Allowed:** 45 Minutes
  **Word Limit:** 1,000 words maximum
  **Total Marks:** 25

  **Question 1**

  Consider the following reconstruction of C.S. Lewis's argument regarding penal substitution:

  > Lewis begins with a mundane case: an offender is justly sentenced, and a devoted innocent friend volunteers to take the punishment in his place. Most people intuit that the friend's suffering gives no reason to let the offender go. Lewis argues this objection is not primarily *moral* (i.e., that it is unfair to the friend), but *conceptual*. Punishing an innocent substitute fails to perform the functions punishment exists to serve: it does not reform the substitute (who needs no reform); it offers no reliable deterrence (since the deception cannot be maintained); and if punishment is essentially the guilty receiving their desert, suffering borne by the innocent is simply not that thing.
  >
  > Lewis suggests the only way to make sense of transfer is to view punishment as *compensation* or *debt* owed on account of the offence. Debts are precisely the sort of thing a third party can discharge. He notes that while we reject penal substitution in criminal contexts, we accept debt-substitution in financial contexts.

  **(a)** Explain why Lewis diagnoses the rejection of the innocent friend's offer as a *conceptual* problem rather than a *moral* one. What turns on this distinction for the viability of penal substitution? (10 marks)

  **(b)** Take the concrete case of a criminal fine that a friend pays on your behalf. Decide whether this is a genuine counterexample to the initial intuition (that substitution is incoherent) or a disanalogy that does no work for the theologian. In your answer, address the worry that redefining punishment as compensation saves the doctrine only by "changing the subject," potentially collapsing penal substitution into an Anselmian satisfaction theory. (15 marks)

  ***

  ### Model Answer

  Lewis's argument hinges on distinguishing between objections based on *fairness* and objections based on *definition*. In Part (a), the distinction is crucial. If the objection to the innocent friend taking punishment were merely moral, it would imply that substitution is conceptually possible but ethically impermissible (e.g., it is "unjust" to the volunteer). Lewis, however, argues the objection is conceptual: the act described literally cannot be identified as "punishment." Punishment is analytically tied to guilt and specific teleological functions (reform, protection, deterrence, retribution). If the subject is innocent, reform is irrelevant; if the subject is a volunteer, deterrence is undermined; if the subject is not the offender, retributive desert is unmet. Therefore, "innocent punishment" is not a hard moral choice; it is a category error. What turns on this is the viability of the doctrine itself. If penal substitution is conceptually incoherent in mundane reasoning, the theologian cannot simply assert it applies to God without explaining how the concept of "punishment" survives the removal of guilt.

  In Part (b), the case of the criminal fine tests the limits of this conceptual boundary. On the surface, a friend paying a fine looks like successful substitution. However, this is likely a disanalogy that fails to rescue penal substitution. A fine operates dually: it is a penalty, but functionally it acts as a debt to the state. When a friend pays it, they are discharging a *financial liability*, not absorbing a *penal status*. The offender still bears the conviction; the friend merely clears the balance. This supports Lewis's compensatory move: we accept substitution when the "punishment" is reconceived as a debt.

  However, this creates the "changing the subject" problem. If the theologian adopts Lewis's move to save penal substitution, they must admit that what Christ underwent was not punishment in the retributive or reformative sense, but satisfaction of a debt owed to divine order. This risks collapsing penal substitution into Anselmian satisfaction theory. In penal substitution, Christ is punished *as if* guilty; in satisfaction theory, Christ offers a value *greater* than the debt. By shifting to the debt model to make substitution coherent, the doctrine loses its distinctive "penal" character. The pressure point is whether one is licensed to switch concepts of punishment solely when moving from human courts to divine atonement. If punishment requires guilt conceptually (as Lewis suggests in the mundane case), then asserting it applies to Christ without guilt is not a mystery of faith but a contradiction, unless the term "punishment" is being used equivocally. Thus, the fine example does not validate penal substitution; it validates debt-transfer, suggesting that if atonement works, it works as satisfaction, not as penal substitution. To claim otherwise is to retain the label "penal" while abandoning the concept that makes it intelligible.

  ***

  ### Marking Scheme (Total: 25 Marks)

  | Criterion | Marks | Must-Hit Move / Specific Mistake that Costs Marks |
  | :--- | :---: | :--- |
  | **1. Conceptual vs. Moral Distinction** | 5 | **Must:** Explain that "moral" = unfairness to volunteer; "conceptual" = act ceases to be punishment. <br>**Fail:** Claiming Lewis thinks it is merely "unjust" or "cruel" to the friend. |
  | **2. Functions of Punishment** | 5 | **Must:** Cite at least two functions from the text (reform, deterrence, desert) that fail in substitution. <br>**Fail:** Reciting general atonement taxonomies (e.g., "Christus Victor") without linking to Lewis's functional critique. |
  | **3. Analysis of the Fine Case** | 5 | **Must:** Identify the fine as a hybrid (penalty/debt) and argue whether it transfers the *penalty* or just the *cost*. <br>**Fail:** Asserting the fine is a perfect analogy without analyzing the debt/penalty distinction. |
  | **4. The "Changing the Subject" Critique** | 5 | **Must:** Articulate that redefining punishment as debt risks collapsing the theory into Satisfaction Theory. <br>**Fail:** Ignoring the theological cost or claiming the redefinition is unproblematic without justification. |
  | **5. Conceptual Consistency** | 5 | **Must:** Address whether licensing a concept-switch (human vs. divine) is ad hoc or legitimate. <br>**Fail:** Defining punishment so guilt is required, then declaring victory without addressing how theology survives that definition. |

  ***

  ### Grade Boundary Note (B vs. A)

  A solid **B-range answer** will correctly identify the conceptual/moral distinction in Part (a) and successfully analyze the fine as a debt-transfer in Part (b). They will demonstrate comprehension of Lewis's sketch and avoid the trap of reciting standard atonement histories. However, they may treat the "collapse into Satisfaction Theory" as a mere label swap.

  An **A-range answer** distinguishes itself by rigorously pressing the "changing the subject" worry in Part (b). They will explicitly argue that if Lewis is right about the mundane concept of punishment, the theologian is not just refining the doctrine but potentially evacuating it of its "penal" content. The A student will recognize that the coherence of the doctrine is purchased at the price of its identity, and they will evaluate whether that trade-off is philosophically defensible or merely an *ad hoc* rescue operation. They move from explaining Lewis to critiquing the theological implications of his logic.
