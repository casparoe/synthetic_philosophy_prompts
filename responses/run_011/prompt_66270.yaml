answer: |-
  You ask whether this is a problem of rationality or one of identity, but I insist you cannot separate them so cleanly when the stakes are this high. The core of my argument remains that rational choice requires comparing outcomes using your current preferences, yet here the outcome destroys the very preferences used to judge it. Whether we say the woman survives metaphysically is secondary to the normative question: can her current self authorize a future where the authority of her current values is nullified? The testimony of the treated is evidentially thin because it comes from beings who have crossed a threshold she cannot cross while remaining who she is. To decide based on their reports is to gamble on a value system you cannot access, which is not rational calculation but leapfrogging into the dark.

  Regarding the letter, I must say it is rule by a woman who no longer exists over someone who merely shares her body. To call this fidelity is to pretend that the values held now are authoritative for a mind that will not hold them, imposing a will that the future self cannot endorse from within its own new framework. If rationality requires acting on reasons you can acknowledge, then binding the future self is an act of coercion, not continuity. The prior self is essentially legislating for a stranger, assuming a continuity of interest that the transformation has severed. But tell me, if she refuses the treatment and suffers the degenerative disease, is that suffering any less real because it was chosen by a self that persists, or does the preservation of the judging self come at too high a cost?
