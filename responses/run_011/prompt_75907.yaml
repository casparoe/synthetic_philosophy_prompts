answer: |-
  Project Proposal: The Boundaries of Substituted Burdens

  Punishment is intuitively personal. If I commit a crime, I serve the jail time; you cannot do it for me. Yet, our legal and social practices routinely allow burdens to shift. A relative pays my fine; a parent covers my restitution; a corporation absorbs the penalty for an executive's misconduct. This tension between the personal nature of guilt and the transferability of sanctions lies at the heart of my proposed project. I aim to analyze the conditions under which one person may legitimately bear the punishment due to another, moving from a specific theological debate to a general theory of penal substitution applicable to secular law and ethics.

  The project begins with the work of the philosopher David Lewis. Lewis argued that the standard doctrine of penal substitution is incoherent because punishment, strictly defined, is a harm imposed on an offender by an authority on account of an offense. By definition, a third party cannot stand in for the offender. However, Lewis salvaged a restricted version of the doctrine by distinguishing between kinds of penalties and imposing an involvement condition. He noted that some sanctions, like fines, are dischargeable by another, while others, like custodial terms, are not. Furthermore, he argued that substitution amounts to mere scapegoating unless the substitute is closely bound to the offender by relationship or love, and the offender repents. Lewis's analysis is insightful but incomplete. He offers no general criterion for transferability, working instead case-by-case. He leaves the reader to infer what makes a burden fungible and what gives a person standing to bear it.

  My project extracts a general criterion from Lewis's fragmented insights and presses it in three directions he did not explore. First, I will examine secular law, which already runs a large informal market in substituted burdens. Second, I will investigate the distributive consequences: if transferability depends on having money or friends, then the severity of punishment becomes a function of social embeddedness. Third, I will analyze the mirror case of transferred credit, such as honorary authorship, to see if we resist transferred praise more stubbornly than transferred pain. These inquiries converge on a single central question: Does the involvement condition governing penal substitution track the metaphysical nature of punishment (who can physically or logically bear a sanction) or its expressive function (what a community communicates when it accepts a substitute)?

  This question remains open because existing treatments are insufficient. Lewis's case-by-case method prevents a unified theory. Objections that treat punishment as essentially non-transferable ignore the reality of fines and bail. Conversely, communicative theories of punishment might allow substitution but offer no account of who has standing to substitute. To resolve this, I will employ a method of conceptual analysis via a case battery. I will construct a provisional criterion, run it against five specific cases, test for co-extension, and then hunt for the penalty/credit asymmetry. This method is superior to the obvious alternatives for a one-semester project. A doctrinal history would describe how we got here but not justify the current practice. An empirical study of fine-default markets would reveal frequencies but not normative standing. A general theory of punishment is too broad for a single article. My approach isolates the specific variable of transferability to determine if it is a bug in the system or a feature of punishment's expressive nature.

  The test battery will consist of five cases designed to pull Lewis's conditions apart. I will analyze: (1) Commercial bail sureties, where burdens are discharged for a fee without relational involvement; (2) Crowdfunded fines for indigent defendants, involving payment without personal connection; (3) Parental restitution for minors, involving legal standing and high involvement; (4) Corporate shareholder liability, where penalties are absorbed involuntarily by dispersed actors; and (5) Honorary authorship on academic papers. I select this fifth case myself to test the mirror hypothesis. If punishment is metaphysical, credit should be equally transferable; if punishment is expressive, we should resist transferred praise differently than transferred pain. This case provides a control group outside the legal system to test the expressive hypothesis.

  A successful result will be a journal-length article of approximately 8,000 words. It will argue that the involvement condition is primarily expressive, not metaphysical. The paper will demonstrate that transferability is permitted only when the substitution communicates a specific relationship recognized by the community, thereby explaining why we accept parental restitution but reject commercial bail as a final settlement. The project fails if the criterion collapses into the trivial claim that only monetary burdens are transferable, which would explain nothing beyond Lewis's original contrast. It also fails if I discover that the theological setting was doing covert work that has no secular analogue, particularly regarding the identity of the offended party and the substitute. Finally, it fails if the asymmetry between penalty and credit disappears, suggesting the involvement condition tracks nothing distinct about punishment.

  The scope is tight for one semester. The primary risk is that the inquiry into distributive consequences balloons into a treatise on the justification of punishment generally. To prevent this, I will restrict the analysis to the conditions of transferability rather than the justification of the underlying penalty. The timeline is structured to ensure a draft is ready by the end of the term. Month 1 will focus on constructing the provisional criterion from Lewis's text. Month 2 will be dedicated to analyzing the first three legal cases. Month 3 will cover the corporate and authorship cases. Month 4 will involve drafting the full argument and testing the asymmetry claim. Month 5 will be reserved for revision and formatting for target journals. By adhering to this schedule and limiting the scope to the expressive versus metaphysical distinction, I will produce a polished article suitable for publication in a specialized ethics journal.

