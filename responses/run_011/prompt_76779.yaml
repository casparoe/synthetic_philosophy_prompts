answer: |-
  This is a profound puzzle, one that sits precisely at the intersection of metaphysics, economics, and the philosophy of science. You have brought a crystallographer's eye to a problem that usually bewilders philosophers: the tension between *structural identity* and *historical essence*.

  Your observation cuts to the heart of the debate between **descriptivism** (a thing is defined by its observable properties) and **causal-historical essentialism** (a thing is defined by its origin). The gem trade's practice is a functioning real-world laboratory for testing these theories.

  Here is an analysis of the theory of value and kinds presupposed by the trade, the distinction between what is required and what is merely compatible, and the implications of adopting your supervenience view.

  ### I. The Theory of Kinds and Value Presupposed by the Trade

  The gem trade operates on a hybrid ontology that leans heavily toward **Historical Essentialism**, coupled with a **Narrative Theory of Value**.

  **1. Theory of Kinds: Causal-Historical Natural Kinds**
  In the philosophy of language (following Kripke and Putnam), natural kind terms like "water" or "gold" refer to substances via their underlying structure (H₂O, Au). However, the gem trade treats "Diamond" not merely as a structural kind ($sp^3$ bonded carbon) but as a *historical* kind.
  *   **The Presupposition:** A natural diamond and a lab-grown diamond are members of different *kinds*, despite sharing the same structural definition.
  *   **The Mechanism:** The trade relies on the causal history of the specimen to determine its kind membership. The presence of nitrogen aggregation or specific growth zoning is not valued for its optical effect (often it is a detriment) but as a *trace fossil* of the causal process (geological vs. industrial).
  *   **Treatment Disclosure:** The requirement to disclose fracture filling or irradiation reinforces this. A treated stone is chemically carbon, but its current state is causally dependent on human intervention rather than geological completion. The trade presupposes that the "identity" of the stone includes the *process* that achieved its state, not just the state itself.

  **2. Theory of Value: Scarcity and Provenance as Intrinsic**
  If value supervened strictly on physical properties (hardness, refractive index, dispersion), natural and lab stones would be priced identically. They are not.
  *   **The Presupposition:** Value does not supervene solely on the *current* physical state. It supervenes on the *history* of that state.
  *   **The Implication:** The "rarity" valued here is not just the rarity of the material (which lab growth can negate) but the rarity of the *origin event*. The trade presupposes that geological time confers a value that human time cannot replicate. This is a form of objective value theory where "naturalness" is a value-bearing property, detectable only via inference.

  ### II. Strict Requirements, Comfortable Fits, and Underdetermination

  You asked to distinguish what the practice *requires* from what merely *fits* it, and where it is *underdetermined*. This is the critical philosophical separation.

  **1. What the Practice Strictly Requires**
  *   **Distinguishability:** There must be a reliable method to differentiate origins (e.g., spectroscopy for nitrogen). If natural and lab stones were truly indistinguishable by *any* physical trace (including micro-defects), the current regulatory framework would collapse into unenforceability.
  *   **Truthful Representation:** The certificate must accurately reflect the causal history. Fraud occurs when the history is misrepresented (selling CZ as diamond, or lab as natural).
  *   **Disclosure of Intervention:** Any human action that alters the stone's state post-growth must be recorded.

  **2. What Fits Comfortably (But Is Not Strictly Required)**
  *   **Metaphysical Essentialism:** It fits comfortably to say, "A natural diamond has a soul/essence that a lab diamond lacks." The practice acts *as if* this is true. However, the practice does not *require* this belief. One could run the exact same system believing all stones are physically identical but acknowledging that buyers *believe* in the essence.
  *   **Intrinsic Worth of Nature:** It fits comfortably to assume the earth adds value. But the system would function identically if the value gap were purely arbitrary.

  **3. Where the Practice Is Underdetermined**
  This is the most philosophically fertile ground. The certificate itself is compatible with two rival theories that authorize the exact same paperwork:

  *   **Theory A (Essentialist):** "We label this 'Lab-Grown' because it *is* fundamentally different in kind from a 'Natural' diamond, regardless of physical similarity. The label reports an ontological truth."
  *   **Theory B (Contractual/Subjectivist):** "We label this 'Lab-Grown' because consumers prefer natural stones and are willing to pay more. The label reports a market-relevant fact to prevent information asymmetry. There is no ontological difference, only a difference in buyer preference."

  **The Underdetermination:** The certificate does not state *why* origin matters. It merely states *that* it matters. A regulator following Theory A and a regulator following Theory B would write the exact same disclosure laws. The practice is neutral on whether the value difference is rational (based on essence) or contingent (based on taste).

  ### III. Adopting the Crystallographer's View (Physical Supervenience)

  You propose the view you were trained in: **Worth supervenes on present physical properties.** If $Specimen_A$ and $Specimen_B$ are identical in structure, composition, and defect chemistry, they are identical in value.

  If this view were adopted normatively (not just scientifically, but legally and economically), the changes would be radical.

  **1. Changes at the Bench (Laboratory Practice)**
  *   **Obsolescence of Origin Testing:** The massive infrastructure dedicated to distinguishing natural from lab (looking for metallic inclusions, strain patterns, nitrogen aggregation) would become scientifically irrelevant for grading. A gemological lab would test only for *performance* (optics, durability) and *stability*.
  *   **Grading Criteria:** The "4 Cs" (Cut, Color, Clarity, Carat) would remain, but the "Origin" line item would be deleted. A certificate would read: "Diamond, Type IIa, Color D, Flawless." It would not say "Natural" or "Synthetic," because those terms would be recognized as referring to history, not current physical reality.
  *   **Treatment Re-evaluation:** Fracture filling would still need disclosure, but *only* if the filler material has different physical properties (e.g., lower thermal stability) that affect the stone's future performance. Irradiation would not need disclosure unless it created unstable isotopes or color centers that fade. The "history" of the treatment would be irrelevant; only the *current stability* of the resulting state would matter.

  **2. Changes in the Law (Regulation and Commerce)**
  *   **Repeal of Disclosure Mandates:** Laws requiring the disclosure of "Lab-Grown" status would be repealed as anti-competitive or misleading. They would be viewed as enforcing a superstition rather than protecting consumers. To require a label implying a difference where none physically exists would be akin to requiring a label on "glacier water" vs. "tap water" if they are chemically identical.
  *   **Redefinition of Fraud:** Fraud would be redefined. Selling a lab diamond as a natural one would no longer be fraud *per se*, unless the seller made specific false claims about physical properties (e.g., claiming the lab stone is harder). It would become a matter of contract law (did the buyer specifically request geological origin?) rather than consumer protection law.
  *   **Price Convergence:** While the law cannot dictate price, removing the legal and institutional scaffolding that legitimizes the distinction would accelerate price convergence. The "value" would collapse to the cost of production + margin, as the scarcity premium (based on history) would be legally unrecognized.

  ### IV. The Philosophical Cost

  There is, however, a catch in your proposal. You note that origin is inferred from "present traces of a past process" (nitrogen aggregation, etc.).

  If two stones are truly identical in *every* physical respect (including all trace defects), then under your view, they are identical in value. But if they differ in trace defects (e.g., one has geological inclusions, the other has metallic flux inclusions), then they are **not** physically identical.

  *   **The Crystallographer's Loophole:** A strict physicalist could argue that a natural diamond *does* have different physical properties than a lab diamond (different trace inclusions, different defect distributions). Therefore, value *does* supervene on physical properties, but those properties include the microscopic scars of history.
  *   **The Trade's Counter:** The trade admits these traces exist but argues they are often invisible to the eye and do not affect beauty. They argue the value difference persists even when the *visible* physical properties are matched.

  **Conclusion**
  The gem trade presupposes that **history is a physical property.** It treats the causal past as an extension of the object's present reality.

  To adopt your view is to sever the object from its history. It is to claim that a thing *is* what it *is*, not how it *came to be*. If you implemented this, you would not just change the price of diamonds; you would dismantle the romantic ontology that underpins the entire luxury market. You would force the market to admit that it is selling narratives, not stones. The certificate would become a report of physics, not a biography of the earth.

  The puzzle follows you into philosophy because it asks: **Is the value of a thing found in its being, or in its becoming?** The trade bets on becoming. Your training bets on being. The certificate is the uneasy truce between them.
