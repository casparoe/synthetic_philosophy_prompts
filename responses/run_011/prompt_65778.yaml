answer: |-
  Here is a procedure designed for your constraints (90 minutes, 40 papers, volunteer staff), followed by the analysis of the theoretical limits you are hitting.

  ### The "Ratified Synthesis" Procedure

  **Pre-Meeting Requirement:** Senior PC (SPC) members must flag conflicted papers (Criteria Decision ≠ Rec Decision) in the system 48 hours prior. They must draft a **one-sentence justification** for their proposed decision.

  **In-Meeting Protocol (2 minutes per paper):**

  1.  **Chair reads:** Paper ID, Conflict Type (e.g., "Criteria Accept, Recs Reject"), and SPC Proposal.
  2.  **Committee Vote:** Thumbs Up (Endorse) or Thumbs Down (Refer). No debate allowed.
  3.  **Threshold:** 2/3rds of present volunteers to Endorse.
  4.  **Outcome:**
      *   **Endorse:** Decision stands. SPC justification becomes the Appeal Sentence.
      *   **Refer:** Paper is kicked to the Board. Do not discuss further. Move to next paper.

  **The Decision Logic (For SPCs drafting proposals):**

  *   **Question 1: Is Soundness Contested?** (e.g., 1 Yes vs. 2 No, or 2 Yes vs. 1 No).
      *   *If Majority says Not Sound:* **Reject.** (Technical safety veto).
      *   *If Majority says Sound:* Proceed to Q2.
      *   *<span style="color:red">[JUDGMENT CALL]</span>:* If the "Not Sound" review is detailed and the "Sound" reviews are superficial, the SPC may override the majority on Soundness. This must be noted in the justification.
  *   **Question 2: Is the Conflict on Value (Sig/Nov) or Process (Rec)?**
      *   *If Criteria=Accept, Recs=Reject:* **Default Accept.** (The Rubric is the contract).
          *   *<span style="color:red">[JUDGMENT CALL]</span>:* Unless SPC believes reviewers identified a fatal flaw not captured by "Soundness" (e.g., ethical violation).
      *   *If Criteria=Reject, Recs=Accept:* **Default Reject.** (The Rubric is the contract).
          *   *<span style="color:red">[JUDGMENT CALL]</span>:* Unless the paper is a "Best Paper" candidate or the Criteria split is purely due to definitional disagreement (e.g., what counts as "Novel").
  *   **Question 3: Can the justification be written without revealing reviewer identity?**
      *   *If No:* **Refer to Board.** (Do not risk anonymity).

  ---

  ### Running the Procedure on Your Cases

  #### Case 1: The Embarrassing Split
  *   **Data:** Criteria (Sound: 2-1, Sig: 2-1, Nov: 2-1) → **Accept**. Recs (2 Reject, 1 Accept) → **Reject**.
  *   **SPC Proposal:** Accept.
  *   **Justification:** "Paper meets all rubric thresholds for technical soundness and contribution; negative recommendations treated as conservative variance."
  *   **Committee Vote:** Endorse (Assuming no one spots a hidden ethical flaw).
  *   **Appeal Sentence:** *"Accepted based on majority verification of technical soundness and novelty, notwithstanding conservative overall recommendations."*
  *   **<span style="color:red">[JUDGMENT CALL]</span>:** Assuming the negative recs are "conservative variance" rather than "unrecorded technical objections."

  #### Case 2: The Best Paper Paradox
  *   **Data:** Criteria (Sound: 5-0, Sig: 2-3, Nov: 2-3) → **Reject**. Recs (4 Accept, 1 Reject) → **Accept**.
  *   **SPC Proposal:** Accept (Award).
  *   **Justification:** "Strong committee consensus on overall impact overrides fragmented criterion scores; paper deemed significant by community standard."
  *   **Committee Vote:** Endorse.
  *   **Appeal Sentence:** *"Awarded based on strong committee consensus on impact, acknowledging diverse views on specific contribution types."*
  *   **<span style="color:red">[JUDGMENT CALL]</span>:** Deciding that "Overall Recommendation" outweighs the "Rubric" for awards but not for regular acceptance. (This violates Uniformity, but is necessary for awards).

  #### Case 3: The Invented "Disjunctive Support" (The Annoying One)
  *   **Data:**
      *   R1: Sound (Y), Sig (Y), Nov (N). Rec: **Accept**.
      *   R2: Sound (Y), Sig (N), Nov (Y). Rec: **Accept**.
      *   R3: Sound (Y), Sig (N), Nov (N). Rec: **Reject**.
      *   **Tally:** Sound (3-0), Sig (1-2), Nov (1-2). Rubric (Sound + (Sig OR Nov)) → **Reject** (No majority on Sig, no majority on Nov).
      *   **Recs:** 2 Accept, 1 Reject → **Accept**.
  *   **SPC Proposal:** Accept.
  *   **Justification:** "Disjunctive support; paper satisfies acceptance threshold for distinct sub-communities represented by reviewers."
  *   **Committee Vote:** Likely Refer. (This is hard to defend without admitting the Rubric failed).
  *   **If Endorsed Appeal Sentence:** *"Accepted based on overall reviewer recommendation, recognizing that significance and novelty were validated by different subset majorities."*
  *   **<span style="color:red">[JUDGMENT CALL]</span>:** This is the hardest one. You are admitting the Rubric logic failed the group even though it held for individuals. This is the most likely to trigger a successful appeal.

  ---

  ### The Impossibility Theorem

  You are encountering the **Discursive Dilemma** (List & Pettit, 2002). It proves that no aggregation procedure can simultaneously satisfy the following conditions for interconnected propositions (like Soundness + Novelty → Accept):

  1.  **Universal Domain:** Any set of individual judgments is allowed.
  2.  **Anonymity:** All reviewers count equally.
  3.  **Systematicity:** The same method is applied to every paper.
  4.  **Consistency:** The collective judgment on the premises (Criteria) logically entails the collective judgment on the conclusion (Decision).

  You asked which of your four constraints to give up:
  1.  Anonymity of reviewers.
  2.  The same method applied to every paper.
  3.  Reviewers voting only their own view of each criterion.
  4.  An outcome that doesn't depend on the order we discuss the criteria in.

  **The Theorem says:** You cannot have **Consistency** (Rubric holds for the group) AND **Majority Rule** (on both Criteria and Recs) simultaneously.

  **Which to give up?**
  You should be first in line to give up **#4 (Order Independence)**.

  **Why?**
  To satisfy your Board's policy ("reasons the committee as a whole endorses"), you *must* introduce human judgment (the SPC Proposal + Ratification step). Human deliberation is inherently path-dependent; fatigue, the order of papers, and the mood of the room *will* affect borderline calls.
  *   If you enforce **Order Independence** (a rigid algorithm), you violate the **Board Policy** (an algorithm cannot "endorse" reasons).
  *   If you enforce **Board Policy** (human endorsement), you sacrifice **Order Independence**.

  Do not try to hide this. A 90-minute meeting is a human process, not a computation. Accept that Paper #39 might get a different heuristic than Paper #1 because the committee is tired, and build your escalation path accordingly.

  ---

  ### Escalation List (When to Call the Board)

  Do not attempt to resolve these in the PC meeting. They violate the procedure's ability to generate a safe appeal sentence.

  1.  **Evidence of Malice:** If a reviewer's "Not Sound" vote is contradicted by detailed evidence in other reviews and looks like a personal attack. (Requires investigation).
  2.  **Ethical Flags:** If a "Reject" is based on ethical grounds not captured in the rubric (e.g., dual-use risk).
  3.  **The "Disjunctive Support" Case:** (Case 3 above). If the SPC cannot write a justification that doesn't sound like "We ignored the rubric," refer it. It sets a dangerous precedent.
  4.  **Anonymity Breach:** If the only way to justify the decision is to quote a specific reviewer's unique insight that identifies them.

  **Final Advice:** Your rubric is a logic gate, but peer review is a social contract. The Discursive Dilemma proves you cannot mathematically reconcile the two in every instance. Use the procedure to clear the easy conflicts, and use the Board to absorb the political risk of the impossible ones.
