prompt: |-
  I direct scientific programs at a private foundation. Each year we receive between forty and sixty letters of inquiry from investigators who state that their work amounts to a paradigm shift and who ask to be exempted from ordinary peer review on the grounds that referees inside the incumbent framework are constitutionally unable to see the merit of a rival to it. By our own retrospective accounting perhaps one of these per decade deserved the exemption; the remainder range from premature to deluded, and from inside the letter the two are hard to distinguish. The board wants a written triage procedure that a program officer — scientifically literate, untrained in philosophy of science — can run on a single letter in about ninety minutes and close with a recommendation. That recommendation goes to me; mine, with the file, goes to a three-person external panel. The panel decides money; the procedure only decides whether a file reaches the panel and in what form. The officer must also produce a one-page statement of reasons that the proposer will see, so whatever the procedure outputs has to be something one can say to a disappointed scientist without insult.

  Build it out of what Kuhn actually supplies rather than out of the slogan his name has become. At minimum I want it to use: the difference between a genuine anomaly and the anomalies-in-waiting that every framework carries and normal science rightly declines to treat as urgent; the marks of crisis in a field — rival schools proliferating, the framework's boundaries blurring, practitioners reaching for metaphysical argument, a willingness to try anything — as distinct from mere dissatisfaction or from a hard technical problem; the point that a framework is surrendered only to another candidate, so that a critique with no positive apparatus is not yet a revolutionary proposal; the disciplinary matrix and its components (symbolic generalizations, models, shared values, exemplars), for determining which part of an incumbent framework a letter actually proposes to displace; incommensurability, specifically as it governs who is competent to evaluate the letter and why a panel's incomprehension is not by itself evidence of emptiness; and Kuhn's list of shared values — accuracy, consistency, scope, simplicity, fruitfulness — as considerations that underdetermine choice rather than settle it.

  State the questions in the order the officer should ask them, what an answer must contain to count as sufficient, the points at which the procedure terminates in a rejection, and the points at which it must stop and hand the matter to a person because what remains is a question of values, of risk appetite, or of whom to trust rather than of fact. Mark every step that is a judgment call wearing a procedural costume.

  Confront one difficulty directly instead of smoothing it over. Kuhn's position appears to entail that the choice I am asking you to proceduralize cannot be proceduralized: the shared values yield no algorithm, and the alternatives cannot be compared on neutral ground. Tell me what portion of the decision a triage procedure can legitimately claim to handle — perhaps only whether the preconditions for revolutionary politics obtain, rather than which side is right — and what portion it cannot, and design the procedure accordingly.

  Then run it on three files. First: a molecular biologist documents a persistent failure of a standard model, unexplained for fifteen years and absorbed by the field as a technicality; the letter offers a detailed diagnosis, no alternative framework, and no predictions that differ from the incumbent one. Second: a letter whose central terms cannot be mapped onto the panel's vocabulary — the proposer's uses of information and constraint do not line up with the field's — where two prior panels found the work unintelligible and a third found it compelling. Incommensurability says unintelligibility is not refutation, and we cannot write checks on faith; say what the procedure does here, with whom it escalates, on what evidence, and at what cost. Third, the answer I will not like: our flagship six-year program in neural coding, described internally as revolutionary since inception. When the officer runs the procedure on the founding documents, they disclose no anomaly, extend the incumbent framework's symbolic generalizations, and report successes of precisely the kind that framework already promised. The procedure returns something like normal science, and unusually good normal science, and I have to tell the board that its most celebrated program has been mislabeled for six years. If that is the output, show me exactly which features of the documents drive it, and say whether this is a verdict on the program or only on the vocabulary used to sell it.

  Close with what the procedure cannot do: where it will misfire systematically, whether it will pass almost nothing in fields whose crises are social rather than technical, whether it favors articulate proposers over inarticulate ones, whether it is designed to reject the genuine article early and at what rate, and which of these errors we can correct and which we should simply accept and monitor.
reasoning: |-
  Here's a thinking process that leads to the suggested triage procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Director of scientific programs at a private foundation.
      *   **Problem:** 40-60 LOIs/year claiming "paradigm shifts" and demanding exemption from peer review. Only ~1/decade is valid. Need a triage procedure for a Program Officer (PO) (scientifically literate, no philosophy training) to run in 90 mins.
      *   **Output:** Recommendation to Director -> External Panel (who decide money). PO also writes a 1-page statement of reasons for the proposer (must be polite/non-insulting).
      *   **Constraints:** Must use *actual* Kuhnian concepts (anomaly vs. crisis, disciplinary matrix, incommensurability, shared values, etc.), not slogans. Must state questions in order, sufficiency criteria, termination points, and judgment calls.
      *   **Crucial Challenge:** Acknowledge that Kuhn implies this *can't* be fully proceduralized (values underdetermine choice, no neutral ground). Define the limit of the procedure (preconditions vs. truth).
      *   **Test Cases:**
          1.  Anomaly without alternative (Molecular Bio).
          2.  Incommensurable vocabulary (Panel split).
          3.  "Revolutionary" program that is actually Normal Science (Neural Coding).
      *   **Closing:** Limitations, systematic misfires, biases, error rates.

  2.  **Deconstruct Kuhn for the Procedure:**
      *   *Anomaly vs. Crisis:* Anomalies happen all the time. Crisis is when the field fractures, rules loosen, metaphysics enters.
      *   *Disciplinary Matrix:* Symbols, Models, Values, Exemplars. A proposal must target specific components.
      *   *Revolution requires Replacement:* You can't just criticize; you need a new candidate framework.
      *   *Incommensurability:* Meaning changes. Confusion isn't proof of falsehood. But we can't fund what we can't evaluate.
      *   *Shared Values:* Accuracy, Consistency, Scope, Simplicity, Fruitfulness. These guide choice but don't dictate it.
      *   *The Limit:* The procedure identifies *readiness* for revolution, not *truth* of the revolution.

  3.  **Drafting the Procedure (The "Kuhnian Triage Protocol" - KTP):**
      *   *Time limit:* 90 minutes.
      *   *User:* Program Officer (PO).
      *   *Structure:* Sequential gates. If fail, stop and write rejection. If pass, escalate.
      *   *Tone:* Professional, respectful, epistemically humble.

      *   *Step 1: The Anomaly Check.* Is it just a puzzle or a breakdown? (Kuhn: Normal science solves puzzles. Revolution starts when puzzles resist solution.)
      *   *Step 2: The Replacement Check.* Is there a new framework? (Kuhn: Critique alone isn't revolution.)
      *   *Step 3: The Crisis Check.* Is the field actually in crisis? (Kuhn: Revolutions happen in crisis, not stability.)
      *   *Step 4: The Matrix Mapping.* What exactly is being changed? (Symbols, models, values?)
      *   *Step 5: The Value Assessment.* Does it score on Accuracy, Scope, etc.? (Kuhn: These underdetermine, but low scores are bad.)
      *   *Step 6: The Incommensurability/Escalation Check.* If unintelligible, is it *structurally* unintelligible or just new?

  4.  **Addressing the "Proceduralizing the Impossible" Constraint:**
      *   I need to explicitly state that this procedure does *not* decide if the science is right. It decides if the *conditions for a paradigm shift claim are met*.
      *   It filters out "Normal Science masquerading as Revolution" and "Critique without Construction."
      *   It leaves the final risk assessment to the Panel.

  5.  **Developing the Test Cases:**
      *   *Case 1 (Mol Bio):* Fails Step 2 (No alternative). Verdict: Reject (or route to normal grant stream).
      *   *Case 2 (Incommensurable):* Fails/Triggers Step 6. Escalate to Director + Specialist Intermediary. Cost: Time/Money to translate.
      *   *Case 3 (Neural Coding):* Fails Step 1 & 3 (No anomaly, no crisis). It's Normal Science. Verdict: Reclassify. This is the hard conversation for the Director.

  6.  **Refining the Output (Self-Correction/Polishing):**
      *   *Check:* Did I use the specific Kuhnian terms requested? (Disciplinary matrix, symbolic generalizations, exemplars, etc.) Yes.
      *   *Check:* Is the tone appropriate for a disappointed scientist? (Avoid "You are wrong," use "This fits normal science channels.")
      *   *Check:* Did I mark the judgment calls? (Yes, need to highlight where the PO uses discretion.)
      *   *Check:* Did I address the "impossibility" of the task? (Yes, in the preamble and closing.)

  7.  **Final Review against constraints:**
      *   90 minutes? (Keep steps concise.)
      *   One-page statement? (The output of the procedure feeds this.)
      *   Director/Panel flow? (PO -> Director -> Panel.)
      *   Closing limitations? (Systematic biases, error rates.)

      *(Self-Correction during drafting)*: Make sure I don't make the PO a philosopher. The questions need to be concrete. Instead of "Is this an anomaly?" ask "Has the field absorbed this failure as a technicality or a breakdown?"
      *(Self-Correction on Case 3)*: This is the most delicate. I need to ensure the Director understands the distinction between "Bad Science" and "Normal Science sold as Revolutionary." The procedure shouldn't call it "bad," just "incremental."

  8.  **Final Polish:** Ensure the distinction between "Rejection" (not for this stream) and "Escalation" (send to panel) is clear. Ensure the "Incommensurability" section handles the "unintelligible but possibly right" dilemma without committing the foundation to blind faith.

      *(Key Insight for Case 2)*: Kuhn says incommensurability means translation is partial. The procedure shouldn't demand full translation but demand *exemplars* (worked problems) that show the new vocabulary works. If they can't show a solved problem in the new terms, it's not a framework yet.

      *(Key Insight for Case 3)*: The "Revolutionary" label is marketing. The procedure exposes the epistemic structure. The verdict is on the *classification*, not the *quality*.

      *(Key Insight for Limitations)*: The procedure will favor those who can write like Kuhnians. It will miss silent revolutions. It will reject the "lone genius" who actually is right but can't articulate the matrix. Acknowledge this.

  9.  **Constructing the Final Response:** (Drafting the content based on the above thoughts.)
      *   Introduction: Acknowledge the paradox.
      *   The Protocol (KTP): Steps 1-6.
      *   The Limit Statement: What this can/can't do.
      *   The Test Cases: Applied analysis.
      *   The Closing: Systemic limitations.

      *Wait, one detail:* "Mark every step that is a judgment call wearing a procedural costume." I need to explicitly label these.
      *Another detail:* "State the questions in the order the officer should ask them." Numbered list.
      *Another detail:* "What an answer must contain to count as sufficient." Criteria for passing each gate.

      *Let's refine the "Incommensurability" step.* If the panel can't understand it, Kuhn says that's expected. But we can't fund it. The solution is to find a "translator" or look for "exemplars" (solved problems). If no exemplars, it's not a paradigm yet.

      *Let's refine the "Neural Coding" step.* The procedure must force the PO to compare the *claims* against the *matrix components*. If the symbols and models are the same, it's not a shift.

      *Okay, ready to write.*
answer: |-
  # The Kuhnian Triage Protocol (KTP)
  **For:** Program Officers (Scientifically Literate, Non-Philosophers)
  **Time Limit:** 90 Minutes per Letter of Inquiry (LOI)
  **Goal:** Distinguish *Revolutionary Preconditions* from *Normal Science* and *Pseudoscience*.
  **Output:** Recommendation to Director (Escalate to Panel / Route to Standard Review / Reject) + Draft Language for Proposer.

  ## Preamble: The Limit of Procedure
  You are not deciding if the science is *true*. Kuhn establishes that truth is not neutral ground between frameworks. You are deciding if the *structural preconditions for a paradigm shift* are present. A proposal can be scientifically brilliant and still fail this triage because it is Normal Science (solving puzzles within the existing matrix). A proposal can pass this triage and still be wrong. This procedure filters for **epistemic structure**, not **empirical validity**.

  **Judgment Call Warning:** Steps marked **[JC]** require human discretion. The procedure cannot algorithmically resolve these; it only structures your intuition.

  ---

  ## Step 1: The Anomaly vs. Puzzle Check
  **Question:** Does the LOI identify a persistent failure of the incumbent framework that the field has *failed* to absorb as a solvable puzzle?
  **Sufficiency Criteria:**
  *   **Pass:** The proposer cites a specific phenomenon that contradicts a **symbolic generalization** (law/equation) or **exemplar** (standard solution) of the field, and provides evidence that the field has tried and failed to resolve it for >5 years.
  *   **Fail:** The failure is described as a technical limitation, a lack of data, or a parameter needing adjustment. The field treats it as "work in progress."
  **Termination:** If **Fail**, route to Standard Peer Review.
  **[JC]:** Distinguishing a "hard puzzle" from a "fatal anomaly." *Guidance:* If the field is still publishing papers assuming the model is true, it is a puzzle. If they are publishing papers debating the model's validity, it is an anomaly.

  ## Step 2: The Replacement Check
  **Question:** Does the LOI offer a candidate framework to replace the incumbent, or merely a critique of the incumbent?
  **Sufficiency Criteria:**
  *   **Pass:** The proposer outlines a new set of **models** or **symbolic generalizations** that can account for the anomaly *and* recover the successes of the old framework (correspondence principle).
  *   **Fail:** The LOI details why the current theory is wrong but offers no positive apparatus, or offers a mechanism that does not generate new predictions.
  **Termination:** If **Fail**, Reject for this stream. (Reason: Critique without construction is not a paradigm shift.)
  **[JC]:** Determining if a "new mechanism" is actually a new framework or just a patch. *Guidance:* Does it require retraining a graduate student? If yes, it's a framework. If no, it's a patch.

  ## Step 3: The Crisis Check
  **Question:** Is there evidence that the *field* is in crisis, or is the crisis localized to the proposer?
  **Sufficiency Criteria:**
  *   **Pass:** The LOI cites proliferation of rival schools, blurring of disciplinary boundaries, or practitioners reaching for metaphysical/philosophical arguments to defend the core.
  *   **Fail:** The proposer claims the field is "blind" or "corrupt," but the literature shows consensus and stable funding lines.
  **Termination:** If **Fail**, route to Standard Peer Review. (Reason: Revolutions require a receptive context; solitary crisis is usually delusion.)
  **[JC]:** Assessing the "blurring of boundaries." *Guidance:* Look for citations outside the field or appeals to "foundations" in mainstream journals.

  ## Step 4: The Disciplinary Matrix Mapping
  **Question:** Which components of the **Disciplinary Matrix** does the proposal explicitly seek to displace?
  **Sufficiency Criteria:**
  *   **Pass:** The LOI identifies specific **Symbolic Generalizations** (e.g., F=ma), **Metaphysical Paradigms** (e.g., "heat is motion"), or **Exemplars** (e.g., "the pendulum problem") that are being discarded.
  *   **Fail:** The language is vague ("the whole way we think is wrong") without pinpointing the technical commitments.
  **Termination:** If **Fail**, Reject. (Reason: Inability to locate the target suggests the proposer does not understand the framework they wish to overthrow.)

  ## Step 5: The Shared Values Assessment
  **Question:** Does the proposed framework score higher on at least two of Kuhn's **Shared Values** (Accuracy, Consistency, Scope, Simplicity, Fruitfulness) while acknowledging a trade-off on others?
  **Sufficiency Criteria:**
  *   **Pass:** The proposer admits where their theory is weaker (e.g., "less simple") but argues for gains elsewhere (e.g., "greater scope").
  *   **Fail:** The proposer claims superiority on all five values simultaneously.
  **Termination:** If **Fail**, Reject. (Reason: Claims of universal superiority indicate a lack of understanding of theory choice underdetermination.)
  **[JC]:** Weighing the trade-offs. *Guidance:* Do not decide if the trade-off is *worth it*. Decide only if the trade-off is *acknowledged*.

  ## Step 6: The Incommensurability & Escalation Check
  **Question:** If the proposal uses vocabulary unintelligible to the panel, does it provide **Exemplars** (worked problems) that demonstrate the utility of the new terms?
  **Sufficiency Criteria:**
  *   **Pass:** The proposer translates a standard problem into their new vocabulary and solves it, showing the new terms have cash value.
  *   **Fail:** The proposer insists the terms cannot be translated and offers no worked examples.
  **Action:** If **Pass** but vocabulary remains opaque to you: **Escalate to Director.** Do not reject.
  **Termination:** If **Fail**, Reject. (Reason: A framework without exemplars is not yet a scientific tool.)
  **[JC]:** Deciding if the "unintelligibility" is structural (incommensurability) or confusion (noise). *Guidance:* If they can solve a standard problem using the new terms, it is structural. If they cannot, it is noise.

  ---

  ## The Limit Statement (For the Director)
  **What this procedure handles:** It filters for the *politics of science*. It identifies proposals that have the structural form of a revolution (anomaly + replacement + crisis awareness).
  **What this procedure cannot handle:** It cannot decide which framework is *nature's choice*. Kuhn's values underdetermine theory choice. Therefore, a "Pass" here is not a validation of truth, but a validation of **risk eligibility**. It authorizes the External Panel to gamble.
  **The Hard Truth:** This procedure will systematically reject the "Lone Genius" who is right but cannot articulate the matrix, and it will systematically pass the "Articulate Speculator" who understands Kuhnian sociology better than physics. We accept this error rate to avoid funding the 59/60 delusions.

  ---

  ## Application to Test Files

  ### File 1: The Molecular Biologist (Anomaly without Alternative)
  **Run:**
  *   **Step 1 (Anomaly):** **Pass.** Persistent failure, 15 years, unabsorbed.
  *   **Step 2 (Replacement):** **Fail.** "No alternative framework, no predictions that differ."
  *   **Termination:** Route to Standard Peer Review.
  **Reasoning:** This is Normal Science. The proposer has identified a puzzle that resists solution, which is the engine of Normal Science, not the trigger for Revolution. Without a candidate framework, this is a request for resources to solve a puzzle, not to change the world.
  **Statement to Proposer:** "Your documentation of the persistent failure in the standard model is compelling and warrants investigation. However, the foundation's 'Paradigm Shift' stream requires a candidate framework to replace the incumbent. Your proposal fits the criteria for our Standard Investigation grants, where the goal is resolving anomalies within the current matrix. We are recommending your file for that stream."

  ### File 2: The Incommensurable Vocabulary (Panel Split)
  **Run:**
  *   **Step 1-4:** **Pass.** (Assumes they claim anomaly and have a matrix).
  *   **Step 6 (Incommensurability):** **Pass/Escalate.** Two panels found it unintelligible; one found it compelling. This is the definition of incommensurability (no neutral language).
  *   **Action:** Escalate to Director with a **Special Condition**.
  **Procedure:** Do not send to the standard External Panel. They have already failed to translate.
  **Recommendation:** Fund a **Translation Phase**. Allocate small funds to hire a postdoc or collaborator fluent in *both* the incumbent vocabulary and the proposer's vocabulary to generate **Exemplars** (Step 6 criteria).
  **Cost:** High administrative overhead. Risk: The translation may reveal the work is empty.
  **Statement to Proposer:** "The epistemic structure of your proposal suggests a shift in the disciplinary matrix that renders standard evaluation metrics inapplicable. This is consistent with Kuhnian incommensurability. However, we cannot allocate major resources without shared exemplars. We are offering a 'Translation Grant' to facilitate the generation of worked problems that bridge your vocabulary and the incumbent field's. Success here is a prerequisite for the main award."

  ### File 3: The Flagship Neural Coding Program (The Uncomfortable Truth)
  **Run:**
  *   **Step 1 (Anomaly):** **Fail.** "Disclose no anomaly."
  *   **Step 3 (Crisis):** **Fail.** "Extend the incumbent framework's symbolic generalizations."
  *   **Step 4 (Matrix):** **Fail.** Reports successes "precisely the kind that framework already promised."
  *   **Verdict:** **Normal Science.**
  **Analysis:** The documents describe puzzle-solving within the existing matrix. They are using the existing symbols and models to extend scope, not replace them.
  **Director's Burden:** You must tell the Board that the program is scientifically successful but sociologically mislabeled.
  **Statement to Board:** "The KTP analysis indicates this program is executing high-quality Normal Science. It is extending the incumbent framework's scope and accuracy, exactly as the framework predicted. It is not a paradigm shift; it is a consolidation. The 'revolutionary' label was marketing vocabulary, not epistemic reality. We should continue funding if the science is good, but we must stop claiming it as a shift. If we claim it as a shift, we devalue the currency for when a genuine shift arrives."
  **Verdict on Program:** This is a verdict on the **vocabulary used to sell it**, not necessarily the quality of the work. It is "unusually good Normal Science." The error is in the foundation's branding, not the lab's output.

  ---

  ## Closing: Systematic Misfires and Limitations

  **1. The Articulate Speculator Bias:**
  This procedure favors proposers who can write like historians of science. A genuine revolutionary who is inarticulate about the "matrix" will fail Step 4. We will miss the "Einstein who writes badly."
  *Correction:* None. We cannot fund what we cannot parse. We accept this false negative rate.

  **2. The Social vs. Technical Crisis Blindspot:**
  Kuhn focuses on technical anomalies. Some fields are in crisis due to social replication failures or ethical collapses, not technical anomalies. This procedure will reject these as "not scientific crises."
  *Correction:* Monitor fields where Step 1 fails but Step 3 (Crisis) shows high friction. Create a separate "Social/Replication Crisis" stream if volume warrants.

  **3. The "Normal Science" Rejection Rate:**
  The procedure is designed to reject Normal Science from the Revolutionary stream. It will reject 90% of good science.
  *Correction:* Ensure the "Route to Standard Review" path is robust. If we reject them from *all* funding because they aren't revolutionary, we break science.

  **4. The False Positive (The Charlatan):**
  A proposer can game Steps 1-5 by learning the vocabulary. They can claim an anomaly, invent a framework, and claim crisis.
  *Correction:* This is why the **External Panel** exists. The KTP gets them to the panel; the panel decides the risk. The KTP only ensures the panel isn't wasting time on proposals that *structurally* cannot be revolutions.

  **5. The Incommensurability Cost:**
  File 2 shows the cost of taking Kuhn seriously. If we accept incommensurability, we cannot use standard peer review. We must pay for translation. This is expensive and slow.
  *Correction:* Limit the "Translation Phase" to 1-2 per year. It is a high-risk, high-reward experimental arm of the foundation.

  **Final Warning:** This procedure will not save you from the Board's desire for headlines. It will, however, save you from funding delusion disguised as genius. It forces the distinction between *changing the world* and *working hard within it*. Most science is the latter. This procedure ensures you only pay the premium price for the former.
