          *   *The Sellars Issue:* In a final year paper, stating "Sellars refuted the given" as an uncontested fact is a bit naive. Stating "no version of foundationalism can appeal to experience at all" is demonstrably false in the context of current literature (e.g., Phenomenal Conservatism, Disjunctivism). This is a significant error in a specialist paper.
