prompt: |-
  Some background, then the ask. I moved into a 70-unit housing co-op in the spring and in October I got talked onto the board, where apparently my job is drafting rule changes before the monthly membership meeting. Turns out we touch the house rules almost every single month — guest limits, quiet hours, subletting, the laundry sign-up, whether the steward can let herself into your unit, how many chore hours you owe, who gets the spare parking spot. The argument is the same every time: somebody says the rule is controlling and treats grown adults like children, somebody else says that without it the loudest four households make the place unlivable for everybody, and then we take a vote at 9:40pm with six tired volunteers and thirty residents in a basement room.

  I've been reading a little around the three-way split between freedom as non-interference, freedom as actually having the capacity and the resources to do the thing, and freedom as non-domination — that last one being about living under someone's arbitrary will even when they never once actually interfere, the kind master who's perfectly nice. I think that vocabulary would sort a lot of our arguments, or at least tell us which kind of fight we're having. But I don't have the theory in my head well enough to run it live in a meeting, and nobody else on the board has read any of it, so a procedure that requires me to explain republicanism to a plumber at 9pm is a non-starter.

  So: write me a decision procedure my board can run on any proposed rule change. I want the questions in the order we should ask them, and for each one, what counts as a sufficient answer versus a hand-wave — "ask whether the power is arbitrary" is not usable, I need something a person can actually say out loud and get a yes or no from. I want the terminal outcomes marked clearly: rule is fine as written, rule is fine if you change this feature of it, rule has to die, and here-is-a-values-question-so-stop-and-put-it-to-a-vote. Our bylaws need a two-thirds membership vote for any rule change, and I have maybe fifteen minutes per rule, so budget for that.

  Then tell me, honestly:

  - which of the three conceptions of freedom is doing the real work in your checklist, and whether one of them earns its place at all or is just decoration once you translate it into questions you can answer about a guest log
  - which distinctions from the theory you deliberately dropped because they can't survive at board-meeting speed, and what we lose by dropping them
  - where you expect the procedure to misfire. My guess: it flags every rule that gives a named human being discretion, and a co-op physically cannot run without discretion, so I need to know how to write discretion into a rule so it passes rather than just getting a wall of failures
  - what the procedure cannot do, including whether it can ever tell us how much interference a rule is worth

  Then run it on three live proposals, showing the answers to each question, not just the verdict:

  1. Overnight guests capped at six nights per month per unit, guests registered by name with the steward, steward keeps the log, and any resident can petition the board for an exception.
  2. If a resident hasn't been seen or heard from in 48 hours and doesn't answer the door, the steward may enter with the spare key — no notice, no second person present, no report filed afterward. This one is mine. I wrote it after an elderly member fell and lay there overnight, and I like it, so don't soften the result; if the procedure says the thing I'm worried it says, say it and then tell me what a version of the rule that survives would look like.
  3. Four hours of community work per month per household, assigned by the work coordinator, who can also excuse households for any reason she thinks adequate.

  Finally — one thing I care about a lot: don't let the procedure quietly import the values of one side of our argument and present them as steps. If a step assumes that being left alone is the default and any rule has to justify itself, or the opposite, I want that flagged as a judgment call dressed up as procedure, because that's the exact move people use to win votes here. And keep it to something I could hand to a new board member in the fall without me standing next to them explaining it, not a essay.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**

      *   **Context:** 70-unit housing co-op, board member drafting rule changes. High frequency of rule changes (monthly). Recurring conflict: "Freedom/Privacy" vs. "Livability/Order."
      *   **User's Theoretical Background:** Familiar with Berlin's two concepts of liberty (negative/positive) and Pettit's republicanism (freedom as non-domination). Wants to apply this without using academic jargon during meetings.
      *   **The Task:** Create a *decision procedure* (checklist/flowchart) for the board to evaluate rule changes.
          *   Must be actionable (yes/no questions, no jargon).
          *   Must fit within 15 minutes per rule.
          *   Must have clear terminal outcomes (Keep, Fix, Kill, Vote).
          *   Must avoid smuggling in biases (neutrality check).
      *   **The Analysis:** After the procedure, answer specific meta-questions:
          *   Which freedom concept is doing the work?
          *   What theoretical distinctions were dropped and why?
          *   Where will it misfire (specifically regarding discretion)?
          *   What can it *not* do?
      *   **The Test:** Run the procedure on three specific proposals (Guest Log, Welfare Check, Chore Assignment).
      *   **Constraint:** Keep it practical, handout-ready, not an essay.

  2.  **Deconstruct the Theory for Practical Application:**

      *   *Negative Liberty (Non-interference):* Is someone stopping me from doing X? (Rule: "No guests after 10pm" -> Interference).
      *   *Positive Liberty (Capacity):* Do I have the means to do X? (Rule: "Laundry sign-up" -> Capacity to access resources).
      *   *Republican Liberty (Non-domination):* Is someone able to interfere arbitrarily? (Rule: "Steward can enter if she feels like it" -> Domination).
      *   *The Core Insight:* Most co-op fights aren't about whether interference exists (it always does in shared housing), but whether that interference is *arbitrary* or *tracked* (aligned with shared interests).
      *   *Translation:* Instead of "Is this domination?", ask "Does one person get to decide without clear rules?" Instead of "Is this interference?", ask "Does this stop a basic need?"

  3.  **Drafting the Decision Procedure (The "Co-op Rule Test"):**

      *   *Goal:* 15 minutes, 6 tired volunteers. Needs to be punchy.
      *   *Structure:* Filter questions leading to outcomes.
      *   *Bias Check:* The prompt warns against assuming "freedom is default." The procedure must acknowledge that *some* rules are necessary for co-op living.
      *   *Drafting Questions:*
          1.  **Purpose:** What problem does this solve? (If no clear problem, kill it).
          2.  **Interference:** What does this stop people from doing? (Acknowledge the cost).
          3.  **Discretion/Arbitrariness:** Who decides exceptions? Is it written down? (This targets non-domination).
          4.  **Reciprocity:** Does this apply to everyone equally? (Fairness).
          5.  **Proportionality:** Is the fix bigger than the problem?
      *   *Refining for "Yes/No":* Make the criteria specific. "Is there a written standard?" rather than "Is it arbitrary?"
      *   *Outcomes:* Pass, Amend, Kill, Flag for Membership (Values).

  4.  **Developing the Meta-Analysis:**

      *   *Which Freedom?* It's mostly Non-Domination (Republican). Negative liberty is the complaint, but Non-Domination is the *solution* structure (rules vs. whims). Positive liberty is less relevant unless it's about resource access (laundry/parking).
      *   *Dropped Distinctions:* The deep philosophical definition of "arbitrary." In theory, arbitrary means "not tracking interests." In practice, it means "no written criteria." We lose nuance but gain speed.
      *   *Misfire Point:* Discretion. Co-ops need human judgment. The procedure might kill all discretion. *Fix:* Distinguish between "Unbounded Discretion" (fail) and "Bounded Discretion" (pass).
      *   *Limitations:* It can't weigh values. It can't say if 6 guest nights is better than 4. It only checks *how* the number was chosen.

  5.  **Running the Test Cases:**

      *   *Case 1 (Guest Log):*
          *   Purpose: Noise/Overcrowding? (Yes).
          *   Interference: Privacy/Spontaneity.
          *   Discretion: Board grants exceptions. (Is criteria written? No -> Amend).
          *   Verdict: Amend (Need criteria for exceptions).
      *   *Case 2 (Welfare Check - User's Rule):*
          *   Purpose: Safety/Life. (Strong).
          *   Interference: Privacy/Security.
          *   Discretion: Steward decides alone. No report. (High risk of domination/abuse).
          *   Verdict: Fail/Amend. (Needs safeguards: 2nd person, report filed).
          *   *Crucial:* Be honest. The user likes it, but it's a domination risk.
      *   *Case 3 (Chores):*
          *   Purpose: Maintenance.
          *   Interference: Time.
          *   Discretion: Coordinator excuses "any reason." (Arbitrary).
          *   Verdict: Amend (Need defined excuse criteria).

  6.  **Refining the Output (Self-Correction/Review):**

      *   *Tone:* Professional, direct, empathetic to the "tired volunteer" context.
      *   *Bias Check:* Did I assume privacy is default? I need to make sure Step 1 validates the *need* for the rule before attacking the *cost*.
      *   *Formatting:* Use bolding, boxes, or clear lists to make it handout-ready.
      *   *Addressing the "Discretion" Warning:* The prompt specifically asks how to write discretion so it passes. I need to make sure the procedure explicitly allows for "Bounded Discretion."
      *   *Time Limit:* 15 minutes. 5 questions max.

  7.  **Final Polish:**

      *   Ensure the "Terminal Outcomes" are clear.
      *   Ensure the "Meta-Analysis" answers the specific bullet points honestly.
      *   Ensure the "Test Run" shows the *answers*, not just the result.
      *   *Critical Check:* The user asked *not* to let the procedure import values. I need to explicitly state in the intro that this tool tests *structure*, not *merit*.

      *(Self-Correction during drafting the Welfare Check analysis)*: The user said "don't soften the result." If the procedure kills it, I must say it kills it. Then offer the fix. The fix for a welfare check isn't "no entry," it's "entry with witnesses/reporting." This aligns with non-domination (power is checked, not removed).

      *(Self-Correction on Discretion)*: The prompt asks "how to write discretion into a rule so it passes." I need to add a specific note in the analysis or the procedure about "Bounded Discretion." I'll put it in the analysis and ensure the procedure rewards it.

      *(Final check on Freedom Concepts)*: Be careful not to say "Positive Liberty is decoration." It's not decoration, it's just less central to *rule enforcement* than Non-Domination. Positive liberty matters more for resource allocation (laundry/parking). I should nuance that.

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # The Co-op Rule Test (Board Handout)

  **Purpose:** To decide if a proposed rule is structured fairly, not whether the goal is good. This takes 15 minutes.
  **How to use:** Read the proposal. Answer the five questions below. Follow the arrow to the verdict.

  ### 1. The Problem Test
  **Question:** Does the proposal name a specific, recurring problem that currently has no solution?
  *   **YES:** Go to Q2.
  *   **NO (Vague/Preventative):** **VERDICT: KILL.** (Do not make rules for problems that don't exist yet.)
  *   **NO (We hate the current rule):** **VERDICT: VALUES VOTE.** (This is a preference fight, send to membership.)

  ### 2. The Cost Test
  **Question:** Can we state clearly what normal activity this stops or slows down?
  *   **YES:** Go to Q3.
  *   **NO (We can't name the cost):** **VERDICT: AMEND.** (If you can't say what it costs, you can't weigh if it's worth it. Rewrite to define scope.)

  ### 3. The Discretion Test
  **Question:** If someone needs an exception, is there a written standard for how that decision is made?
  *   **YES (Criteria are listed):** Go to Q4.
  *   **YES (Committee vote required):** Go to Q4.
  *   **NO (One person decides based on "judgment" or "adequacy"):** **VERDICT: AMEND.** (Add written criteria or require a 2-person sign-off.)
  *   **NO (No exceptions allowed):** Go to Q4.

  ### 4. The Accountability Test
  **Question:** When the rule is enforced or an exception is granted, is a record kept that the membership can see?
  *   **YES:** Go to Q5.
  *   **NO:** **VERDICT: AMEND.** (Add a requirement for a log, report, or minutes entry.)

  ### 5. The Reciprocity Test
  **Question:** Does this apply to Board members and Staff exactly as it does to residents?
  *   **YES:** **VERDICT: PASS TO MEMBERSHIP.** (Structure is sound. Vote on the values.)
  *   **NO:** **VERDICT: AMEND.** (Equalize the application or justify the difference in writing.)

  ***

  ## Terminal Outcomes Key

  *   **PASS TO MEMBERSHIP:** The rule is structurally sound. It limits freedom, but not arbitrarily. Put it to the 2/3 vote.
  *   **AMEND:** The goal is valid, but the power structure is risky. Fix the specific flaw identified (usually Discretion or Accountability) and bring back next month.
  *   **KILL:** The rule solves no current problem. Do not waste membership time on it.
  *   **VALUES VOTE:** The rule is structurally fine, but the board is split on the goal itself. Stop debating structure; admit it's a preference and send to membership.

  ***

  # Meta-Analysis: What This Tool Actually Does

  ### 1. Which conception of freedom is doing the work?
  **Freedom as Non-Domination (Republicanism)** is the engine.
  *   **Negative Liberty (Non-interference)** appears in Question 2 (The Cost Test). We acknowledge the rule interferes, but we don't treat interference as a dealbreaker. We just require it to be identified.
  *   **Positive Liberty (Capacity)** is largely absent. This tool doesn't ask if the rule *enables* you to live better (e.g., "Does quiet hours enable sleep?"). It assumes the "Problem Test" covers that.
  *   **Non-Domination** is Questions 3 and 4. This is the heavy lifter. It doesn't ask "Is the steward nice?" It asks "Is the steward *checked*?" It treats arbitrary power (even nice power) as the enemy, not interference itself.

  **Is it decoration?** No. If you rely only on Negative Liberty, every rule looks like oppression. If you rely only on Positive Liberty, every rule looks like help. Non-Domination is the only one that distinguishes between a traffic light (interference, but non-arbitrary) and a roadblock set up by a warlord (interference, arbitrary). That is the exact distinction your board fights over.

  ### 2. What distinctions did you drop?
  *   **"Tracking Interests":** In theory, power is non-dominating if it "tracks the interests" of the governed. I dropped this because at 9:40 PM, no one agrees on what the "interests" are. I replaced it with **Accountability (Q4)** and **Reciprocity (Q5)**. If power is recorded and applies to the powerful too, it *probably* tracks interests. We lose philosophical precision for procedural enforceability.
  *   **Intensity of Interference:** The tool treats "no loud music after 10pm" and "no guests overnight" similarly in structure. It doesn't weigh *how much* freedom is lost. That is a values judgment, not a structural one.
  *   **Private vs. Public Sphere:** Republican theory worries about domination in the state vs. the home. In a co-op, the hallway *is* the state. I dropped the distinction. The steward entering your unit is treated the same as the steward locking the front door.

  ### 3. Where will the procedure misfire? (The Discretion Problem)
  You are correct: it flags named human discretion. A co-op cannot run without it.
  **How to write discretion so it passes:**
  The procedure fails rules where discretion is **unbounded**. It passes rules where discretion is **bounded**.
  *   *Fails:* "Steward can enter if she thinks it's necessary."
  *   *Passes:* "Steward can enter if: (a) 48 hours no contact, AND (b) second board member is notified by text, AND (c) log entry filed within 24 hours."
  *   *Fails:* "Coordinator can excuse chores for adequate reasons."
  *   *Passes:* "Coordinator can excuse chores for: medical note, out-of-town travel, or emergency. All excuses logged."

  **What you lose:** You lose speed and trust. Bounded discretion requires paperwork. If your co-op runs on high trust, this will feel bureaucratic. If your co-op runs on low trust, this is the only thing that will save it.

  ### 4. What the procedure cannot do
  *   **It cannot weigh values.** It cannot tell you if 6 guest nights is better than 4. It only checks if the *method* for choosing 4 is arbitrary.
  *   **It cannot solve resource scarcity.** If there is one parking spot and 70 units, this tool won't fix the fight. It will only ensure the lottery for the spot is recorded.
  *   **It cannot stop a tyranny of the majority.** If 2/3 of membership want to ban red shirts, this tool says "Pass to Membership." It protects against *arbitrary* power, not *democratic* power.

  ***

  # Test Run: Live Proposals

  ### 1. Guest Log & Cap
  *Proposal: Overnight guests capped at six nights per month per unit, guests registered by name with the steward, steward keeps the log, and any resident can petition the board for an exception.*

  *   **Q1 (Problem):** Yes. (Implied: Overcrowding/Noise/Security).
  *   **Q2 (Cost):** Yes. (Spontaneity/Privacy of association).
  *   **Q3 (Discretion):** **NO.** "Petition the board for an exception" has no written criteria. What if the board says no because they don't like your boyfriend?
      *   *Action:* **AMEND.**
  *   **Q4 (Accountability):** Yes. (Steward keeps log).
  *   **Q5 (Reciprocity):** Yes. (Assumed applies to all).

  **Verdict: AMEND.**
  **Fix:** Add criteria for exceptions (e.g., "medical necessity," "family emergency," "housing transition"). Require board vote on exceptions to be recorded in minutes.

  ### 2. Welfare Check Entry
  *Proposal: If a resident hasn't been seen or heard from in 48 hours and doesn't answer the door, the steward may enter with the spare key — no notice, no second person present, no report filed afterward.*

  *   **Q1 (Problem):** Yes. (Safety/Life of elderly member).
  *   **Q2 (Cost):** Yes. (Privacy/Security of the home).
  *   **Q3 (Discretion):** **NO.** Steward decides alone ("doesn't answer door" is subjective).
      *   *Action:* **AMEND.**
  *   **Q4 (Accountability):** **NO.** "No report filed afterward." This is a critical failure.
      *   *Action:* **AMEND.**
  *   **Q5 (Reciprocity):** Yes. (Applies to all).

  **Verdict: AMEND (Significant).**
  **Honest Assessment:** As written, this is domination. It gives the steward the power of a benevolent master. She *won't* abuse it until she *does*.
  **The Version That Survives:**
  "If a resident hasn't been seen in 48 hours AND fails to answer phone/door:
  1. Steward must contact one Board member for verbal approval (log the time).
  2. Entry must be witnessed by a second staff member or board member.
  3. A written report of the entry and findings must be filed within 24 hours, sealed for privacy unless emergency services were called."
  *Why:* This keeps the safety capacity but removes the arbitrary power.

  ### 3. Chore Assignment
  *Proposal: Four hours of community work per month per household, assigned by the work coordinator, who can also excuse households for any reason she thinks adequate.*

  *   **Q1 (Problem):** Yes. (Building maintenance/Labor distribution).
  *   **Q2 (Cost):** Yes. (Time/autonomy).
  *   **Q3 (Discretion):** **NO.** "Any reason she thinks adequate" is the definition of arbitrary power.
      *   *Action:* **AMEND.**
  *   **Q4 (Accountability):** **NO.** No mention of logging excuses.
      *   *Action:* **AMEND.**
  *   **Q5 (Reciprocity):** **NO.** Coordinator has power to excuse, implying she might not be subject to the same assignment or scrutiny.
      *   *Action:* **AMEND.**

  **Verdict: AMEND.**
  **Fix:** Coordinator assigns based on a roster. Excuses granted only for: Illness, Travel, Hardship. All excuses logged monthly and reviewed by Board. Coordinator also owes 4 hours or equivalent admin credit defined in bylaws.

  ***

  # Final Note on Bias
  You asked me to flag if this procedure smuggles in values.
  **It does.** It smuggles in **Proceduralism**.
  It assumes that a rule with paperwork is better than a rule without it.
  *   **The Trade-off:** In a 70-unit co-op, "Trust" is not a scalable resource. Paperwork is.
  *   **The Warning:** If your co-op is small and high-trust, this tool will feel like strangulation. If your co-op is large and fractious, this tool is the only thing preventing a civil war.
  *   **The Default:** The procedure does *not* assume being left alone is the default. Question 1 validates the need for interference. However, it *does* assume that **unchecked power is the default enemy.** If your board believes that "Trusted Stewards" are more important than "Checked Stewards," this tool will conflict with your culture. You cannot use this tool to build trust; you can only use it to verify that trust hasn't become dependency.
