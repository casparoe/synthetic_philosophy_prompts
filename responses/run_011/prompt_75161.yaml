answer: |-
  (a) **Scenario**
  A bacterial population inhabits a structured environment of discrete, nutrient-limited patches. Two genotypes exist: producers, which secrete a costly extracellular enzyme to digest external resources, and non-producers, which consume the digested resource without paying the metabolic cost. Within any given patch, non-producers replicate faster than producers due to the cost saving, and this within-patch selective advantage is numerically identical across all conditions. The patches themselves grow in total biomass according to their collective enzymatic output, such that patches with higher producer frequencies grow larger. The experiment splits into two arms differing only in the propagation phase: in the *dissolve* arm, mature patches rupture completely, releasing all cells into a common pool from which new patches are founded by random sampling; in the *bud* arm, mature patches produce daughter patches via fission, where the founding cells are sampled directly from the parent patch, preserving the parent's genotype frequency.

  (b) **Verdicts and Mechanisms**

  | Account | **Arm 1: Dissolve** | **Arm 2: Bud** |
  | :--- | :--- | :--- |
  | **Gene (Replicator)** | **Verdict:** Selection against producer allele.<br>**Mechanism:** Global frequency declines because within-patch loss outweighs any transient contribution from larger patches. | **Verdict:** Selection can favor producer allele.<br>**Mechanism:** Gene spreads via differential proliferation of high-producer patches despite local loss within patches. |
  | **Individual Cell** | **Verdict:** Selection at individual level.<br>**Mechanism:** Non-producers outcompete producers in every patch due to lower metabolic cost. | **Verdict:** Selection at individual level (locally).<br>**Mechanism:** Non-producers outcompete producers in every patch due to lower metabolic cost. |
  | **Patch (Entity)** | **Verdict:** No selection at patch level.<br>**Mechanism:** Patch productivity varies, but patch composition is not inherited by offspring patches (heredity = 0). | **Verdict:** Selection at patch level.<br>**Mechanism:** Productive patches produce more offspring patches that inherit high producer frequency (heredity > 0). |

  (c) **The Discriminating Feature**
  The discriminating feature is **group heredity** (the inheritance of patch composition by offspring patches). In the *bud* arm, the trait "high producer frequency" is transmitted from parent patch to daughter patch, allowing differential patch success to accumulate over generations. In the *dissolve* arm, this link is broken; while productive patches contribute more cells to the global pool, those cells are randomly reassigned, severing the correlation between parent patch success and offspring patch composition. If this feature is removed (i.e., if budding is replaced by random redistribution), the case collapses into an ordinary free-rider problem where the collective benefit cannot counteract the individual cost, and producers go extinct in both arms.

  (d) **The Gene's-Eye Attack and Judgment**
  The gene's-eye theorist argues that selection is fundamentally a change in gene frequency, describable entirely by the replication rates of particles (cells/genes). They claim the "patch" is merely a statistical partitioning of variance (e.g., via the Price Equation) rather than a causal agent; the difference between arms is just a difference in transmission bias for the gene, not the emergence of a new unit of selection. **Judgment:** This attack shows the patch-level description is *formally dispensable* (the outcome can be predicted using only gene-frequency equations) but fails to show it is *merely redundant*. The description is not redundant because the causal mechanism explaining *why* the gene frequency changes differs fundamentally between arms: in one, change is driven solely by particle competition; in the other, it is driven by the birth and death of interacting collectives. Without the patch-level description, the empirical difference between the arms remains unexplained covariance rather than understood mechanism.
