answer: |-
  The debate divides on whether spacetime points possess physical identity independent of the fields defined upon them.

  *   **Node 1:** Do the original model and the dragged model describe two physically distinct worlds?
      *   **No:** Go to Node 4.
      *   **Yes:** Go to Node 2.
  *   **Node 2:** Does this difference imply the future inside the hole is not fixed by the past Cauchy surface?
      *   **No:** Go to Node 6.
      *   **Yes:** Go to Node 3.
  *   **Node 3:** If the metric is fixed background and only matter is dragged, does the future remain unfixed?
      *   **Yes:** **Leaf 1 (Field Substantivalism).** Consequence: You must accept indeterminism in theories with fixed backgrounds.
      *   **No:** Go to Node 7.
  *   **Node 4:** Do the manifold points exist independently of the metric field?
      *   **No:** **Leaf 2 (Relationism).** Consequence: You must deny the existence of spacetime without matter or fields.
      *   **Yes:** Go to Node 5.
  *   **Node 5:** Do points retain identity if all physical fields are removed?
      *   **No:** **Leaf 3 (Sophisticated Substantivalism).** Consequence: You must treat mathematically distinct models as physically identical.
      *   **Yes:** **Leaf 4 (Haecceitistic Substantivalism).** Consequence: You must accept genuine indeterminism in General Relativity.
  *   **Node 6:** Is the definition of determinism flexible enough to ignore this difference?
      *   **No:** **Leaf 5 (Radical Indeterminism).** Consequence: You must concede that physics cannot predict the immediate future.
      *   **Yes:** **Leaf 6 (Determinism Salvage).** Consequence: You must adopt a non-standard definition of determinism.
  *   **Node 7:** Is the metric field essential to the identity of the points?
      *   **No:** **Leaf 7 (Manifold Substantivalism).** Consequence: You must explain why dragging the metric matters but dragging matter does not.
      *   **Yes:** **Leaf 8 (Metrical Essentialism).** Consequence: You must deny that points exist prior to the metric field.

  **Diagnostic Notes:**

  *   **Node 3 Work:** This node performs genuine work. A "Yes" commits one to field identity independent of geometry; a "No" ties identity to the metric. It separates Leaf 1 from Leaves 7 and 8.
  *   **Indistinguishable Leaves:** The tree cannot empirically distinguish **Leaf 2 (Relationism)** and **Leaf 3 (Sophisticated Substantivalism)**. Both deny distinct physical possibilities at Node 1. To tell them apart, ask: "If all fields vanished, would the container remain?" Leaf 3 says yes; Leaf 2 says no.
  *   **Empty Slots:** **Leaf 1** is largely unoccupied; few argue for field identity without manifold identity. **Leaf 7** is incoherent in General Relativity, where the metric is dynamical, not fixed.
  *   **Leaf Consequences:** Each consequence highlights the "bullet" the defender must bite, ranging from indeterminism to ontological parsimony.
