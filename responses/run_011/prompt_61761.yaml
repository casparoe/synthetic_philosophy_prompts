prompt: |-
  I head the Classifications and Definitions unit at a national statistical agency. Roughly fifty times a year a term in one of our official classifications comes into dispute — whether a person counts as unemployed, whether a settlement counts as rural, whether a death counts as a stillbirth or a miscarriage, whether a worker counts as employed in the informal sector — and my unit has to produce a recommendation that goes to a standing committee of statisticians, lawyers, and ministry officials, who either sign off or send it back. The recommendations are consequential: they set programme eligibility, they get incorporated by reference into legislation, and once published they define a time series that analysts and the press will treat as continuous for decades. My case officers are able but have no training in philosophy of language, we typically have a day or two per case, and the deliverable has to be a form someone can fill in rather than an essay. The pressure on the unit currently runs from both directions at once. From outside, we are accused of moving definitions to make the numbers look better; a columnist wrote last month that our unemployment rate is simply whatever we decide it is. From inside, a senior analyst who read a précis of Quine's "Two Dogmas of Empiricism" has begun arguing the mirror image of that charge: since the analytic–synthetic distinction does not survive scrutiny, there is no fact of the matter about what our terms mean, every definitional choice is a free pragmatic decision, and the outside criticism is therefore confused rather than substantive. Both positions are doing damage in our meetings. I am fairly confident neither is correct, but I cannot articulate the middle position, and "it's complicated" is not a usable answer in a committee paper.

  Please write that middle position as a decision procedure my officers can actually run on a disputed term. I want the questions in order, what counts as a sufficient answer to each, what sort of evidence is admissible at each stage, and where the procedure terminates — in one of three outcomes: the term is to be settled by stipulation and published explicitly as a stipulation; the term is to be settled by investigation, because something about the world bears on the choice; or the procedure cannot settle it and the case is escalated to the committee as a question of purpose, values, or who bears the costs. Ground it in what Quine's argument actually establishes and in whatever has survived it. My understanding is that his conclusion was that the boundary is not sharp rather than that there is nothing worth marking, and that there are later attempts to salvage a workable notion — I have been told one turns on separating the idea of a sentence's being true in virtue of meaning from the idea of its being justifiable merely in virtue of understanding that meaning, and that another line of reply points to the way disagreement persists across an entire family of related belief pairs. Use what is usable, discard what is not, and tell me plainly which philosophical distinctions you are preserving, which you are dropping as no help to a non-specialist, and at which steps the procedure is a judgment call wearing the costume of a rule. Give me the small working vocabulary the procedure needs — my officers should not have to use the word "analytic" correctly in order to apply it — and a section on failure modes: what kind of case the procedure will systematically get wrong, in which direction, and how I would detect that it has.

  Then run it on three cases we are actually carrying. First, a proposal to widen our count of the unemployed to include people who have stopped looking for work but who tell interviewers they want a job and would start one; our series has excluded them for forty years, and my instinct is to reject the proposal as tampering with comparability, so if the procedure reaches a different verdict I need to be shown exactly which step produces it and what weight comparability is allowed to carry against it. Second, a ministry that has asked us to identify the scientifically correct gestational-age threshold separating miscarriage from stillbirth, noting helpfully that neighbouring jurisdictions use different ones; I need the procedure to say plainly, in language a minister will accept, that the request as framed contains a mistake, while also refusing the conclusion that any threshold is as good as any other and specifying what would make one better than another for a stated purpose. Third, a standing argument between two regional offices over whether a particular kind of peri-urban settlement counts as rural, where I suspect but cannot demonstrate that the two offices agree on every fact about the settlements in question and are only attaching different labels to them; if there is a cheap diagnostic for that suspicion — some way of substituting the disputed term out and seeing whether the disagreement survives — build it in as a stage and apply it. Finally, tell me what the procedure cannot do for me: what it looks like when it produces a properly completed form and a bad recommendation, and why a clean run through the stages should not be treated as evidence that the recommendation will survive the committee.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Head of Classifications and Definitions unit at a national statistical agency.
      *   **Problem:** 50 disputes/year on official classification terms (unemployed, rural, stillbirth, informal sector). Recommendations have legal/financial consequences and affect time series.
      *   **Conflict:**
          *   *External:* Accusations of manipulating definitions to massage numbers ("unemployment is whatever we decide").
          *   *Internal:* A senior analyst arguing Quine's "Two Dogmas" implies *no* fact of the matter, all definitions are free pragmatic choices, so external criticism is confused.
      *   **Goal:** A middle-position decision procedure for case officers.
      *   **Requirements:**
          *   Actionable steps/questions (not an essay).
          *   Evidence types admissible at each stage.
          *   Three specific outcomes (Stipulation, Investigation, Escalation).
          *   Grounded in Quine (acknowledging the boundary isn't sharp but exists) and post-Quinean salvage attempts (justification vs. meaning, disagreement persistence).
          *   Explicitly state what philosophical distinctions are kept/dropped.
          *   Small working vocabulary (no "analytic/synthetic").
          *   Failure modes section.
          *   **Application:** Run the procedure on three specific cases (Unemployed expansion, Miscarriage/Stillbirth threshold, Peri-urban/Rural label).
          *   **Limitations:** What the procedure *cannot* do (good form $\neq$ good recommendation).

  2.  **Deconstruct the Philosophy (Quine & Beyond):**
      *   *Quine's Point:* The distinction between "true by meaning" (analytic) and "true by fact" (synthetic) is not a clean cut. Meaning and belief form a web. Changing a definition ripples through the web.
      *   *What Quine *didn't* say:* He didn't say "anything goes." He said centrality matters. Some statements are more central to the web (logical laws, definitions) than others (peripheral observations).
      *   *Salvageable Distinctions:*
          *   *Centrality/Entrenchment:* How connected is this term to other concepts?
          *   *Purpose/Function:* Why do we have this term? (Pragmatics).
          *   *Empirical Constraint:* Does the world push back? (e.g., biology limits gestational definitions more than sociology limits "rural").
          *   *Justification vs. Meaning:* We can't separate them perfectly, but we can ask: "Are we arguing about what the word *means* or about what policy *works*?"
      *   *Dropped:* The strict Analytic/Synthetic binary. The idea that definitions are "discovered" rather than "made" (they are made, but constrained).

  3.  **Drafting the Decision Procedure (The "Middle Position"):**
      *   *Name:* The "Constraint and Consequence Protocol" (CCP).
      *   *Vocabulary:* Avoid "Analytic." Use "Core Meaning," "Empirical Constraint," "Policy Consequence."
      *   *Structure:*
          1.  **Stability Check:** Is this term entrenched in a time series or law? (Presumption against change).
          2.  **World-Bound Check:** Does reality constrain the definition? (Biology vs. Sociology).
          3.  **Substitution Test:** If we change the word, does the disagreement remain? (Diagnosing verbal vs. substantive disputes).
          4.  **Purpose Alignment:** Does the definition serve the statutory goal?
          5.  **Outcome Selection:** Stipulation (if purely conventional), Investigation (if empirical facts matter), Escalation (if value/purpose conflict).

  4.  **Refining the Steps (Iterative Process):**
      *   *Step 1 (Entrenchment):* Focus on the "Web." How much breaks if we change this?
      *   *Step 2 (Constraint):* Quine admits some parts of the web are harder to move. Biology is harder than economics.
      *   *Step 3 (The "Verbal Dispute" Test):* This addresses the peri-urban case. If we describe the settlement without the word "rural," do we still disagree on what to do?
      *   *Step 4 (Purpose):* Addresses the "pragmatic decision" claim. It *is* pragmatic, but tied to legislative intent, not whim.
      *   *Outcomes:* Need to map clearly to the user's request (Stipulation, Investigation, Escalation).

  5.  **Addressing the Three Cases:**
      *   *Case 1 (Unemployed):* High entrenchment (40 years). Low empirical constraint (social construct). High consequence (time series). *Verdict:* Likely Escalation or Stipulation (maintain status quo due to entrenchment), but need to show where "comparability" weighs in. *Correction:* The user suspects the procedure might reject their instinct. I need to ensure the procedure values "Continuity" as a specific constraint.
      *   *Case 2 (Stillbirth):* Ministry asks for "scientifically correct." *Verdict:* Investigation (biological constraints exist) but ultimately Stipulation/Escalation because "correctness" is purpose-relative. Need to tell the Minister there is no "God's eye view" threshold.
      *   *Case 3 (Peri-urban):* Suspected verbal dispute. *Verdict:* Use the Substitution Test. If facts agree, it's a Stipulation/Escalation on labeling policy.

  6.  **Addressing Limitations & Failure Modes:**
      *   *Failure:* The procedure can't resolve value conflicts (e.g., equity vs. accuracy).
      *   *Failure:* It can't predict political fallout.
      *   *Form vs. Substance:* A filled form doesn't guarantee the committee agrees.

  7.  **Writing the Response (Tone and Style):**
      *   *Tone:* Professional, bureaucratic but philosophically rigorous, direct.
      *   *Structure:*
          1.  Philosophical Preamble (The "Middle Position").
          2.  Working Vocabulary.
          3.  The Decision Procedure (Step-by-Step).
          4.  Failure Modes.
          5.  Application to Cases.
          6.  Limitations.

  8.  **Self-Correction/Refinement during drafting:**
      *   *Check:* Did I address the Quinean analyst? Yes, by acknowledging definitions are pragmatic but constrained by the "web of belief."
      *   *Check:* Did I address the external critics? Yes, by showing definitions aren't arbitrary; they are constrained by entrenchment and purpose.
      *   *Check:* Is the vocabulary simple? Replace "Analytic" with "Definition-Bound." Replace "Synthetic" with "Observation-Bound."
      *   *Check:* The Unemployment case. The user's instinct is to reject. The procedure must respect "Time Series Integrity" as a valid constraint. I will add a specific weight for "Historical Continuity" in Step 1.
      *   *Check:* The Stillbirth case. Need to be careful not to say "Biology dictates X." Biology dictates *possibilities*, policy dictates *cut-offs*.
      *   *Check:* The Peri-urban case. The "Substitution Test" needs to be concrete. "Describe the place without using the R-word."

  9.  **Final Polish:** Ensure the distinction between "Stipulation" (we choose, openly), "Investigation" (facts matter), and "Escalation" (values/purpose clash) is clear in the outcomes. Ensure the Quinean nuance (no sharp boundary, but degrees of centrality) is reflected in the weighting of evidence.

  *(Self-Correction on Quine Interpretation)*: I need to be careful not to misrepresent Quine. He rejected the *dogma* of a sharp distinction, not the utility of distinguishing convention from fact in practice. The "Two Dogmas" argument shows that *any* statement can be held true come what may, if we make drastic enough adjustments elsewhere. But in *practice*, some adjustments are too costly. The procedure must capture "Cost of Adjustment."

  *(Refining the "Middle Position")*: The middle position is **Pragmatic Realism**. Definitions are tools (Pragmatic), but they cut into a world that has grain (Realism/Constraint), and they are embedded in a network of existing commitments (Quinean Web).

  Let's build the procedure.

  *   *Step 1: Entrenchment & Continuity.* (Quinean Web centrality).
  *   *Step 2: Empirical Constraint.* (How much does the world push back?).
  *   *Step 3: The Substitution Diagnostic.* (Is this a verbal dispute?).
  *   *Step 4: Purpose & Statutory Fit.* (Pragmatic justification).
  *   *Decision Matrix.*

  Okay, ready to write.
answer: |-
  ## The Constraint and Consequence Protocol (CCP)

  ### 1. The Middle Position: Pragmatic Realism
  You are correct that both the external critics and your internal Quinean analyst are wrong, though each holds half of the truth.

  *   **The External Critic** assumes definitions describe pre-existing natural kinds (that "unemployed" is a thing like "gold" waiting to be found). This is false. Classifications are tools we impose on the world.
  *   **The Internal Analyst** assumes that because definitions are tools, any tool will do equally well (that "unemployed" is like choosing a screwdriver vs. a hammer for a task that doesn't exist). This is false. The world has "grain." Some cuts are cleaner than others, and existing commitments constrain new cuts.

  **Quine's Actual Lesson:** Quine did not prove that "anything goes." He proved that the boundary between *what we mean* and *what we observe* is not a sharp wall, but a gradient. Some statements are so central to our web of belief that changing them causes chaos (e.g., logical laws, core statutory definitions). Others are peripheral and easily changed.
  **The Salvageable Distinction:** We cannot separate "meaning" from "fact" perfectly, but we can measure **Centrality** (how much breaks if we change this?) and **Constraint** (how much does the physical world resist this definition?).

  **Philosophical Distinctions Preserved:**
  1.  **Centrality/Entrenchment:** Some definitions are load-bearing in the "web of belief" (legislation, time series). Changing them is costly.
  2.  **Empirical Constraint:** Some domains (biology) constrain definition more than others (sociology).
  3.  **Pragmatic Justification:** Definitions are chosen for purpose, not truth, but must be justified by how well they serve that purpose.

  **Distinctions Dropped:**
  1.  **Analytic vs. Synthetic:** Do not use these terms. They imply a binary switch that does not exist. Use "Definition-Bound" vs. "Observation-Bound" as matters of degree.
  2.  **Discovery vs. Invention:** Do not argue whether a term is "discovered." Assume all terms are invented, but some inventions are constrained by reality.

  **Working Vocabulary for Officers:**
  *   **Entrenchment:** How many laws, contracts, or historical series rely on the current definition?
  *   **Grain:** Does the natural world offer a natural break (e.g., heartbeat) or is it a smooth continuum (e.g., income)?
  *   **Substitution Test:** If we remove the disputed word, does the disagreement remain?
  *   **Statutory Fit:** Does this definition help or hinder the law's stated goal?

  ---

  ### 2. The Decision Procedure

  **Instructions:** Complete one form per disputed term. Answer questions in order. If a question yields a decisive result, skip to the Outcome. If not, proceed to the next.

  #### Step 1: The Entrenchment Check (Centrality)
  *Question:* If we change this definition, how many existing data series, laws, or contracts become discontinuous or ambiguous?
  *   **High Entrenchment:** The term appears in primary legislation, long-term time series (>10 years), or international treaties.
  *   **Low Entrenchment:** The term is new, internal, or experimental.
  *   **Admissible Evidence:** Legislative texts, historical metadata, international classification standards (e.g., ILO, UN).
  *   **Sufficient Answer:** If **High**, there is a presumption against change. Change is only permitted if Step 4 (Purpose) shows the current definition actively defeats the law's goal.
  *   **Termination:** If High Entrenchment + No Defeat of Purpose $\rightarrow$ **Outcome A (Stipulation: Maintain Status Quo).**

  #### Step 2: The Grain Check (Empirical Constraint)
  *Question:* Does the phenomenon being classified have natural breakpoints, or is it a smooth continuum?
  *   **High Grain:** Biological events (death, birth), physical thresholds (boiling point).
  *   **Low Grain:** Social states (unemployment, poverty, rural/urban).
  *   **Admissible Evidence:** Medical literature, physical science data, sociological studies on the distribution of the trait.
  *   **Sufficient Answer:** If **High Grain**, the definition must align with the natural break *unless* there is a compelling policy reason to override it. If **Low Grain**, the definition is a policy choice, not a scientific finding.
  *   **Termination:** If High Grain + Request for "Scientifically Correct" threshold $\rightarrow$ **Outcome B (Investigation: Identify natural breaks, then move to Step 4).**

  #### Step 3: The Substitution Diagnostic (Verbal vs. Substantive)
  *Question:* Can we describe the specific cases in dispute *without* using the disputed term, and do the parties still disagree on the action to be taken?
  *   **Procedure:** Rewrite the case description replacing the disputed term (e.g., "rural") with neutral descriptors (e.g., "population density X, distance from city Y").
  *   **Disagreement Persists:** The parties disagree on the *policy* (e.g., funding levels), not the label.
  *   **Disagreement Vanishes:** The parties agree on the facts and the policy, but are fighting over the label.
  *   **Admissible Evidence:** Meeting transcripts, written submissions from regional offices.
  *   **Sufficient Answer:** If Disagreement Vanishes $\rightarrow$ This is a labeling dispute.
  *   **Termination:** If Disagreement Vanishes $\rightarrow$ **Outcome A (Stipulation: Choose the label that minimizes confusion).**

  #### Step 4: The Statutory Fit (Purpose)
  *Question:* Which definition better serves the explicit purpose of the legislation or program this classification supports?
  *   **Procedure:** Identify the statutory goal (e.g., "alleviate poverty," "track labor market health"). Test Definition X vs. Definition Y against this goal.
  *   **Admissible Evidence:** Legislative intent records, program evaluation reports, cost-benefit analyses.
  *   **Sufficient Answer:** If one definition clearly better serves the goal, adopt it. If they serve different legitimate goals (e.g., Accuracy vs. Comparability), you cannot decide this alone.
  *   **Termination:** If Goals Conflict $\rightarrow$ **Outcome C (Escalation: Question of Values/Purpose).**

  ---

  ### 3. Outcomes

  *   **Outcome A (Stipulation):** The term is settled by convention. The recommendation must state: *"This definition is adopted for consistency/clarity, not because it reflects a natural fact. It is explicitly a convention."*
  *   **Outcome B (Investigation):** The term depends on empirical facts. The recommendation must state: *"Further data is required to locate the natural breakpoint. The definition will follow the evidence."*
  *   **Outcome C (Escalation):** The term depends on competing values. The recommendation must state: *"The choice depends on prioritizing Value X over Value Y (e.g., Continuity vs. Accuracy). This requires Committee direction."*

  ---

  ### 4. Failure Modes

  No procedure is immune to error. Your officers must watch for these systematic failures:

  1.  **The "False Precision" Failure:**
      *   *Risk:* Officers treat Step 2 (Grain) as definitive in Low Grain cases.
      *   *Direction:* They will recommend "Investigation" where "Stipulation" is needed, wasting time looking for natural breaks in social constructs.
      *   *Detection:* If an officer recommends a study to find the "true" boundary of "informal sector work," stop them. That is a legal/policy boundary, not a natural one.

  2.  **The "Status Quo Bias" Failure:**
      *   *Risk:* Step 1 (Entrenchment) is weighted too heavily, preventing necessary updates.
      *   *Direction:* Recommendations will always favor the old definition, even when the world has changed.
      *   *Detection:* If three consecutive recommendations reject changes solely due to "Time Series Integrity" despite evidence the series is no longer measuring the intended phenomenon, recalibrate the weight of Step 4.

  3.  **The "Camouflaged Value" Failure:**
      *   *Risk:* Officers hide value judgments inside Step 2 (Grain) or Step 4 (Purpose).
      *   *Direction:* A recommendation claims a definition is "scientifically required" when it is actually a budgetary choice.
      *   *Detection:* Audit recommendations where the word "must" is used. If "must" is not supported by physical law (biology/physics), it should be "should" or "is preferred."

  ---

  ### 5. Application to Current Cases

  #### Case 1: The Unemployed (Discouraged Workers)
  *Proposal:* Include those who stopped looking but want work.
  *Current Status:* Excluded for 40 years.

  **Run:**
  1.  **Entrenchment:** **High.** 40-year time series, international (ILO) standards, legislation references. *Presumption against change.*
  2.  **Grain:** **Low.** Labor status is a social construct, not a biological state. No "natural" break between looking and not looking.
  3.  **Substitution:** N/A (Disagreement is about the metric, not a specific case).
  4.  **Statutory Fit:** Conflicting Goals.
      *   Goal A (Labor Market Health): Current definition measures *active* pressure on wages. Including discouraged workers dilutes this.
      *   Goal B (Social Welfare): New definition captures *hidden* need.
      *   *Conflict:* Accuracy of current economic signal vs. Accuracy of social need.

  **Verdict:** **Outcome C (Escalation).**
  *Reasoning:* Step 1 creates a heavy burden of proof. Step 2 confirms there is no scientific fact forcing the change. Step 4 reveals a conflict between two legitimate statutory goals (Comparability/Signal vs. Coverage/Need).
  *Addressing Your Instinct:* Your instinct to reject is supported by Step 1 (Entrenchment). However, the procedure prevents you from rejecting it *solely* on that basis. You must escalate because the trade-off is between values (Continuity vs. Coverage), not facts. The Committee must decide if the 40-year series is more valuable than the new coverage.
  *Weight of Comparability:* Comparability is treated as a "Value" in Step 4, not a "Fact." It carries heavy weight due to Step 1, but it is not a trump card against legislative intent to measure need.

  #### Case 2: Miscarriage vs. Stillbirth (Gestational Threshold)
  *Request:* Ministry wants the "scientifically correct" threshold. Neighbors differ.

  **Run:**
  1.  **Entrenchment:** **Medium.** Affects vital statistics, some legislation, but thresholds vary internationally.
  2.  **Grain:** **High (with caveats).** Biological development is continuous, but viability/death is a binary event. However, the *timing* of that threshold is medically debated, not physically fixed.
  3.  **Substitution:** N/A.
  4.  **Statutory Fit:** The Ministry's request contains a category error. They are asking for a "Fact" (Step 2) to solve a "Policy" (Step 4) problem.

  **Verdict:** **Outcome B (Investigation) $\rightarrow$ leading to Outcome A (Stipulation).**
  *Reasoning:* Step 2 requires officers to investigate the biological constraints (e.g., fetal viability limits). However, the procedure mandates the recommendation state: *"Biology constrains the range (you cannot set it at 2 weeks or 40 weeks), but does not dictate the point within that range."*
  *Ministerial Language:* "There is no 'scientifically correct' threshold. There are only thresholds that serve different purposes (e.g., parental leave eligibility vs. public health tracking). We recommend Threshold X because it aligns with Jurisdiction Y's health reporting, but we must publish this as a **Stipulation**, not a discovery."
  *Refuting the Analyst:* This proves the analyst wrong. It is not a "free pragmatic decision" (any threshold is *not* as good as any other; biology sets the bounds). It proves the critics wrong (we are not manipulating numbers; we are selecting a standard within biological constraints for a specific purpose).

  #### Case 3: Peri-Urban Settlements (Rural vs. Urban)
  *Dispute:* Two regional offices disagree on labeling.

  **Run:**
  1.  **Entrenchment:** **Medium.** Affects regional funding formulas.
  2.  **Grain:** **Low.** "Rural" is a policy category, not a geological one.
  3.  **Substitution Diagnostic:**
      *   *Instruction:* Ask Office A and Office B to describe the settlement *without* using "Rural" or "Urban." Use density, infrastructure, commute times.
      *   *Result:* Both offices submit identical factual descriptions. Both agree on the funding level the settlement *should* receive. They only disagree on the label.
  4.  **Statutory Fit:** The label triggers the funding. Since they agree on the funding, the label is purely administrative.

  **Verdict:** **Outcome A (Stipulation).**
  *Reasoning:* Step 3 identifies this as a verbal dispute. Since the facts and the policy outcomes agree, the definition is a mere labeling convention.
  *Action:* Choose the label that matches the national map standard to ensure consistency. Publish explicitly: *"This settlement is classified as Rural for the purpose of Series X, acknowledging it shares characteristics with Urban Series Y."*
  *Diagnostic Value:* The Substitution Test saved weeks of debate. It revealed the disagreement was not about the world, but about the map key.

  ---

  ### 6. Limitations: What This Procedure Cannot Do

  You asked for a plain statement on the limits of this tool.

  1.  **It Cannot Generate Political Cover:**
      A properly completed CCP form can still result in a recommendation the Committee rejects. The procedure ensures the *reasoning* is sound, not that the *conclusion* is popular. If the Committee rejects a recommendation that followed the CCP, it is evidence that the political cost (external pressure) outweighs the procedural validity. Do not treat a clean CCP form as a shield against ministerial override.

  2.  **It Cannot Resolve Value Conflicts:**
      In Case 1 (Unemployment), the procedure correctly identified a clash of values (Continuity vs. Coverage). It cannot tell you which value is *right*. It only forces you to admit that you are choosing a value, not finding a fact. If the Committee sends it back, it is often because they want to hide that value choice behind a "technical" recommendation. The CCP forces the choice into the open; some committees will resent that.

  3.  **It Cannot Predict "Web" Ripples:**
      Quine's "web of belief" is larger than your agency's metadata. A change might be low-entrenchment for *you* but high-entrenchment for a partner agency (e.g., Tax Authority) you didn't consult. Step 1 is limited by your unit's horizon. Always add a "Stakeholder Check" box to Step 1 to mitigate this.

  4.  **It Is Not a Substitute for Judgment:**
      The "Grain" check (Step 2) requires judgment. An officer might classify "income poverty" as High Grain because money is countable. It is not; the *threshold* of poverty is Low Grain. If officers misuse Step 2 to treat social thresholds as physical laws, the procedure will produce "bad science" recommendations. You must audit Step 2 specifically for social constructs masquerading as natural kinds.

  **Final Instruction to Officers:**
  "This procedure does not tell you what the answer is. It tells you what *kind* of answer you are looking for. If you finish the form and think you have found a 'fact,' check Step 2 again. If you think you have made a 'choice,' check Step 1 again. If you are arguing about 'meanings,' do Step 3. If you still disagree, do not argue. Escalate."
