  Position Two argues that irreversibility is always relative to a decision. Brain-dead patients are biologically maintainable yet declared dead because we choose not to fix the brain. DCD is identical: we choose not to restart the heart. Consistency demands we treat both as death based on permanence, not absolute biological impossibility. To demand more for DCD is to misunderstand how death is already determined in neurology and creates an unjustified barrier to procurement. They seek a functional definition that aligns clinical practice across disciplines, preventing arbitrary distinctions between neural and circulatory cessation. If they are wrong, viable organs are wasted due to conceptual confusion.

  Position Three argues that cardiorespiratory criteria are merely proxies for what matters: the loss of consciousness. Once integration is lost and consciousness is impossible, the heart is mere plumbing. They view the other two positions as fetishizing the wrong organ system. For them, death is the end of the person, not the pump, and the protocol should reflect the permanent loss of capacity for experience, rendering the circulatory debate a technical distraction. This position prioritizes the moral status of the person over the mechanical function of the organism. If they are wrong, we are prolonging biological existence without personhood.

