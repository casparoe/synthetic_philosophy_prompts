      *(Capacity Strand)*: Does Metz's view relocate the problem to those *lacking capacity*? Yes. The PVS patient lacks the capacity. So the objection still holds for the PVS patient in the Metz view unless Metz adds a caveat (e.g., "capacity typical of the species" or "being the object of communion"). I need to mention what the theorist owes there.

