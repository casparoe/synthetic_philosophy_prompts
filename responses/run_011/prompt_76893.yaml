      *   *Metz:* Metz explicitly grounds status in the *capacity* to commune. So Premise (1) is false for Metz.
      *   *Conclusion:* The objection works against a "Strict Actualist" view that no major theorist holds. It fails against Menkiti (due to human/person distinction) and Metz (due to capacity clause).

  7.  **Final Polish:**
