      *(Self-Correction on the "Hostage" point)*: The user asks if grounding status in relations makes standing hostage to others' conduct. If I use the Capacity view, it's not hostage to *actual* conduct, but it is hostage to *nature* (do I have the capacity?). If I use the Menkiti view, *full* personhood is hostage, but *basic status* is not. I need to make this distinction clear.

