          *   Fix: Ground status in the *possibility* of relation, not the *actualization*.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Caution:* I must be careful not to turn the Menkiti view into a capacity view just to save it. Menkiti *does* believe personhood is earned. I need to explain how Menkiti avoids the "low status = can be killed" implication.
