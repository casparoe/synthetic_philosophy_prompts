prompt: |-
  I'm a fourth-year graduate student in moral philosophy, TA-ing an upper-level undergraduate ethics seminar: eighteen students, one 75-minute section, third week of our consequentialism unit. They've already worked through the drowning-child case, the integrity objection, and the fair-share response to non-ideal conditions (the view that under partial compliance you're required to bear only what you'd bear under full compliance, no more). The problem is that "that's just too demanding" has become a reflex — they deploy it to swat down conclusions rather than to argue for anything, and they haven't noticed how much work it's doing or how unstable their own thresholds are.

  Design an in-class activity that makes the demandingness objection bite as a problem they generate themselves rather than one I announce. The mechanism I want built around: each student receives an endowment of tokens redeemable for something they'd genuinely rather keep — a small amount of extra credit, or minutes off a required reading log — so transfers are real costs, not pretend ones. They then face a sequence of individually trivial transfer requests. Half the group sees a running cumulative ledger of what they've already given; the other half sees only the current request. Before the sequence begins, every student privately writes down the cumulative total at which they think the demands would become excessive, and afterwards they compare that number with what they actually did.

  Give me the exact rules, the token scheme, the request sequence, and a minute-by-minute timeline. The debrief should map the two arms onto the philosophical options — what the ledger asymmetry would show for the fair-share theorist, versus for someone who reads it as either a framing artifact or evidence of a genuine integrity cost — and should press them to say what would count as evidence here rather than as mere psychology. Finally, tell me what will predictably go wrong the first time I run it and how to contain it, and state honestly which feature of the objection the activity structurally cannot reproduce.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **User:** 4th-year grad student in moral philosophy, TAing an upper-level undergrad ethics seminar.
      *   **Context:** 18 students, 75-minute section, Week 3 of Consequentialism unit.
      *   **Prior Knowledge:** Drowning child, Integrity objection, Fair-share response (partial compliance).
      *   **Problem:** Students use "too demanding" as a reflexive conversation-stopper without analyzing the threshold or instability.
      *   **Goal:** Design an in-class activity where students *generate* the demandingness problem themselves through real costs (tokens).
      *   **Mechanism:** Endowment of tokens (redeemable for extra credit/reading log minutes). Sequence of trivial transfer requests. Two conditions: Half see cumulative ledger (Ledger Group), half see only current request (Blind Group). Pre-activity private threshold setting. Post-activity comparison.
      *   **Deliverables:** Exact rules, token scheme, request sequence, minute-by-minute timeline, debrief guide (mapping to philosophical options), prediction of failures/containment, and limitations of the activity.

  2.  **Deconstruct the Mechanism & Philosophy:**
      *   *The Token:* Needs to be valuable enough to hurt but small enough to be transferable. Extra credit is high stakes for undergrads. Reading log minutes are lower stakes but still "costly" in terms of time/effort. Let's go with "Reading Log Minutes" or "Assignment Extension Tokens" to avoid grade inflation issues, but the prompt suggests "extra credit or minutes off reading log." Let's pick *Reading Log Minutes* because it's easier to administer instantly without affecting the gradebook permanently. Actually, "Extra Credit Points" (e.g., 0.5% total course grade) is more visceral. Let's aim for a hybrid: "Participation Points" redeemable for small grade bumps or assignment waivers. Let's simplify: **5 "Effort Tokens" each.** Each token = 5 minutes off a weekly reading response *or* 0.2% bonus on final. Real cost.
      *   *The Requests:* Need to be individually trivial but cumulatively significant. This mimics the "shallow pond" vs. "famine relief" scaling.
      *   *The Groups:*
          *   *Ledger Group:* Sees how much they've given total. This tests the "Fair Share" view (I have a limit).
          *   *Blind Group:* Sees only the current request. This tests the "Act Consequentialist" view (this specific act saves a life, does it matter what I did before?).
      *   *The Threshold:* Pre-writing a number forces them to commit to a principle before emotion/fatigue sets in.
      *   *The Debrief:* Needs to connect the behavioral data to the theories (Fair Share vs. Act Consequentialism vs. Integrity).

  3.  **Drafting the Activity Structure:**
      *   *Time:* 75 minutes.
      *   *Setup:* 10 mins.
      *   *Activity:* 25 mins.
      *   *Debrief:* 35 mins.
      *   *Wrap-up:* 5 mins.
      *   *Total:* 75 mins.

  4.  **Refining the Token Scheme:**
      *   18 students is small. Split into two groups of 9.
      *   Endowment: 10 tokens each.
      *   Value: 1 token = 1 "Late Pass" (24hr extension) or 1% on participation grade. Let's make it concrete: **1 Token = 1 Point on the Participation Grade (out of 100).** This is tangible.
      *   Requests: 10 rounds. Cost per round: 1 token. Benefit: "Saved a life" (simulated).
      *   Wait, if they give all tokens, they lose 10% participation. That's too high. Let's lower the stakes. 1 Token = 0.5% Final Grade. Max loss 5%. Still high.
      *   Better: **1 Token = 5 Minutes off next Reading Response.** Max 50 minutes off. That's one whole response. High value, low administrative burden.
      *   Let's settle on: **5 Tokens.** Each = **10 Minutes off a Reading Log.** Total potential loss = 50 minutes (one full assignment). This is painful enough to feel real.

  5.  **Developing the Request Sequence:**
      *   Need 5 rounds to exhaust the endowment.
      *   Round 1: "A child needs medicine. Cost: 1 token."
      *   Round 2: "A family needs food. Cost: 1 token."
      *   ...
      *   Round 5: "A village needs clean water. Cost: 1 token."
      *   *Crucial Detail:* The Ledger Group sees "Total Given: X/5". The Blind Group sees "Current Cost: 1 token."

  6.  **Developing the Debrief (The Philosophical Meat):**
      *   *Comparison:* Did Ledger Group stop earlier? Did Blind Group give until empty?
      *   *Fair Share:* If you stopped because the *total* felt high, you're intuiting a fair-share limit.
      *   *Act Consequentialism:* If you gave because *this* token saves a life regardless of past tokens, you're acting AC.
      *   *Integrity:* If you kept tokens because "I need to live my life," that's the integrity objection.
      *   *Framing:* Is the ledger just psychological framing, or does it reveal a moral truth about cumulative burden?

  7.  **Predicting Failures:**
      *   *Free Riding:* "I'll keep mine, others will give." (Need to isolate decisions).
      *   *Skepticism:* "This isn't real." (Need to enforce the redemption).
      *   *Resentment:* "This is manipulative." (Need to frame it as pedagogical).
      *   *Confusion:* Rules unclear. (Need handouts).
      *   *The "All or Nothing" problem:* If one student gives everything and another gives nothing, does it skew the discussion? (Need to aggregate data anonymously).

  8.  **Addressing the Limitations:**
      *   What can't this reproduce? Real sacrifice (health, life), long-term commitment, epistemic uncertainty (do we *know* the token saves a life?), and the *source* of the demand (state vs. individual).

  9.  **Writing the Plan (Iterative refinement):**
      *   *Tone:* Professional, precise, pedagogical.
      *   *Structure:* Follow the prompt's requirements exactly.
      *   *Check:* Did I include the pre-writing of thresholds? Yes. Did I include the two arms (Ledger vs. Blind)? Yes.

      *(Self-Correction during drafting)*: Make sure the "Blind" group doesn't accidentally see the Ledger. Physical separation or digital forms? Digital forms (Google Forms/Qualtrics) are best for privacy and data collection. I will specify a digital implementation for the decision phase to ensure privacy and accurate data logging.

      *(Refining the Stakes)*: 50 minutes off reading is good. Let's make sure the TA can actually honor this. Yes, easy to track.

      *(Refining the Debrief)*: Ensure the distinction between "Fair Share" (partial compliance) and "Demandingness" (full compliance) is clear. The activity simulates partial compliance (others *might* not give). The Ledger group represents the "Fair Share" tracker. The Blind group represents the "Do the most good now" agent.

  10. **Final Review against constraints:**
      *   18 students.
      *   75 mins.
      *   Tokens = real cost.
      *   Two conditions (Ledger/Blind).
      *   Pre-commitment threshold.
      *   Debrief mapping.
      *   Predictable failures.
      *   Structural limitations.

      *Let's write it.*
answer: |-
  Here is a complete lesson plan designed for your specific context. It treats the "demandingness objection" not as a lecture topic but as an empirical phenomenon the students produce and then analyze.

  ### Activity Title: The Cumulative Cost Protocol

  **Class Size:** 18 Students
  **Time:** 75 Minutes
  **Materials:**
  *   Two distinct handouts (Version A: Ledger, Version B: Blind).
  *   A secure digital form (Qualtrics/Google Forms) for private decision logging.
  *   Physical "Token Cards" (5 per student, laminated, numbered 1–5).
  *   Whiteboard/Projector.

  ---

  ### I. The Token Scheme & Stakes
  To ensure the cost is real but administratively manageable, use **Reading Log Exemptions**.

  *   **Endowment:** Each student receives **5 Token Cards**.
  *   **Value:** 1 Token = **10 Minutes off the word count/time requirement** for the next three weekly reading logs (max 30 minutes total redemption, or banked for a future assignment).
  *   **Redemption:** At the end of class, students keep the tokens they did *not* surrender. They submit these physically at the end of the term to claim the exemption.
  *   **The Cost:** Surrendering a token is a genuine loss of leisure/time. Keeping a token is a genuine retention of privilege.

  ---

  ### II. The Request Sequence
  There are **5 Rounds**. In each round, a scenario is projected. The cost is always **1 Token**. The benefit is framed identically: *"Your contribution prevents one instance of severe, preventable suffering."*

  1.  **Round 1 (Emergency):** Immediate medical intervention for an individual.
  2.  **Round 2 (Sustenance:** Food security for a family for one month.
  3.  **Round 3 (Infrastructure):** Clean water filter for a small village.
  4.  **Round 4 (Systemic):** Vaccination program for a region.
  5.  **Round 5 (Structural):** Long-term educational endowment.

  *Note: The moral weight increases slightly, but the cost to the student remains constant (1 token).*

  ---

  ### III. Minute-by-Minute Timeline

  **0:00 – 0:10: Setup & Pre-Commitment (10 mins)**
  *   **TA Script:** "We've discussed the demandingness objection. Today, we aren't talking about it; we are testing your threshold for it. You have 5 tokens. They are worth time off your reading logs. You will face 5 requests to donate. Your decisions are private and binding."
  *   **Distribution:** Hand out Version A (Ledger) to 9 students, Version B (Blind) to 9 students. Seat them in two distinct clusters if possible.
  *   **Private Writing Task (3 mins):** On the top of their handout, students must write: *"I believe it becomes morally excessive to demand more than ___ tokens from an individual in this context."*
  *   **Collection:** Collect these sheets immediately. Do not let them change this number.

  **0:10 – 0:35: The Protocol (25 mins)**
  *   **Mechanism:** Use a digital form on their phones/laptops for the actual decision to ensure anonymity and prevent peer pressure.
  *   **Round Execution (5 mins per round):**
      1.  Project the Scenario.
      2.  **Version A (Ledger)** handout shows: *"Current Request: 1 Token. **Total Given So Far: [X]**."*
      3.  **Version B (Blind)** handout shows: *"Current Request: 1 Token. **Total Given So Far: [Hidden]**."*
      4.  Students submit "Keep" or "Give" on the digital form.
      5.  **Crucial Step:** If a student chooses "Give," they physically place one Token Card in a central collection box. If "Keep," they keep the card.
      6.  TA confirms receipt before moving to the next round.
  *   **Pacing:** Keep the rounds moving briskly to prevent over-rationalization.

  **0:35 – 1:10: The Debrief (35 mins)**
  *   **Data Reveal (5 mins):** Project the aggregate data.
      *   Graph 1: Pre-commitment thresholds (Class Average).
      *   Graph 2: Actual tokens surrendered (Split by Ledger vs. Blind).
      *   Graph 3: Drop-off rate per round (Split by Ledger vs. Blind).
  *   **Discussion Phase 1: The Threshold Gap (10 mins):**
      *   Compare the Pre-Commitment Number vs. Actual Surrender.
      *   *Question:* "Did you give more or less than your principle dictated? If you stopped early, was it because the *total* hurt, or because the *marginal* token hurt?"
  *   **Discussion Phase 2: The Ledger Effect (10 mins):**
      *   Compare Version A (Ledger) vs. Version B (Blind).
      *   *Hypothesis:* If the Fair-Share view is correct, Version A should surrender *fewer* tokens total because the cumulative burden becomes salient. If Act Consequentialism is correct, the ledger shouldn't matter; only the current utility matters.
      *   *Question:* "Did seeing the cumulative total change your behavior? If yes, is that a rational moral adjustment or a psychological framing error?"
  *   **Discussion Phase 3: Mapping to Theory (10 mins):**
      *   Connect behavior to the syllabus.
      *   **Fair-Share Theorist:** Should feel vindicated if Ledger Group stopped earlier. The "excessiveness" is a function of the *sum*, not the *increment*.
      *   **Integrity Objection:** Did anyone keep tokens specifically because "I need to be able to live my life"? That is the integrity cost.
      *   **Act Consequentialist:** Should argue that the Ledger is morally irrelevant. If Token 5 saves a life just like Token 1, hiding the total (Blind) is the only way to be rational.

  **1:10 – 1:15: Wrap-Up (5 mins)**
  *   Return the Pre-Commitment sheets to students.
  *   **Exit Ticket:** "Based on today, is 'too demanding' a claim about the *size* of the sacrifice, or the *source* of the demand? Revise your definition."
  *   Collect tokens and exit.

  ---

  ### IV. Debrief Guide: Mapping Arms to Options

  Use this cheat sheet to steer the conversation from psychology to philosophy.

  | Observation | Philosophical Interpretation | Challenge to Students |
  | :--- | :--- | :--- |
  | **Blind Group gave more than Ledger Group.** | **Framing Effect:** The moral reality didn't change, only the salience of the cost. | "If the moral reality didn't change, why did your decision change? Is your moral intuition sensitive to *accounting*?" |
  | **Ledger Group stopped at a specific cumulative total.** | **Fair-Share Intuition:** You have a limit on total burden, regardless of individual act utility. | "Is that limit based on what *others* are doing (compliance) or what *you* can bear (capacity)?" |
  | **Students kept tokens despite high utility.** | **Integrity Objection:** The cost isn't just the token; it's the subordination of your projects to the tally. | "Did you keep the token because you needed the time, or because you refused to be a 'channel' for utility?" |
  | **Pre-commitment > Actual Giving.** | **Hypocrisy/Weakness of Will:** You endorse the theory but won't pay the price. | "Does this prove the theory is false, or that you are imperfect agents?" |

  **The Critical Pivot:** Press them on **Evidence**.
  *   *TA Prompt:* "If the Ledger Group stopped earlier, does that prove the Fair-Share view is *true*? Or does it just prove humans suffer from 'loss aversion' when totals are visible?"
  *   *Goal:* Force them to distinguish between *descriptive psychology* (how we react) and *normative justification* (why we should react).

  ---

  ### V. Predictable Failures & Containment

  **1. The "This Isn't Real" Objection**
  *   **Risk:** Students treat tokens as game points, not real value.
  *   **Containment:** In the intro, explicitly state: "I will track these. If you redeem them at the end of the term, you *will* get the time off. If you give them away, they are gone. I have the spreadsheet open right now." Make the administrative reality boring and concrete.

  **2. The "Hero" or "Hoarder" Skew**
  *   **Risk:** One student gives all 5; another gives 0. This creates social pressure or shame.
  *   **Containment:** Emphasize **Digital Privacy**. "No one sees your individual choices, only the aggregate graph at the end. Do not discuss your choices during the rounds." If a student gives all 5, do not praise them publicly; treat it as data.

  **3. Resentment at Manipulation**
  *   **Risk:** Students feel tricked into giving up "points."
  *   **Containment:** Frame it as *epistemic labor*. "You are paying for this class with tuition; this activity is the lab component. The cost is the tuition for the insight." Allow students to opt-out of the token stake (they get 0 potential exemption but don't have to play), though most will play.

  **4. Confusion on the Ledger**
  *   **Risk:** Ledger group thinks the *TA* is tracking their total to punish them.
  *   **Containment:** Clarify: "The ledger on your sheet is for *your* information only. It does not affect my grading. It is a mirror, not a monitor."

  ---

  ### VI. Structural Limitations (Honesty Check)

  You must disclose this to the class during the debrief to maintain intellectual honesty. This activity **cannot** reproduce:

  1.  **Epistemic Uncertainty:** In the activity, they *know* the token saves a life. In reality (e.g., donating to charity), the causal link is probabilistic. The demandingness objection often gains traction when the efficacy of the sacrifice is unclear.
  2.  **The Source of Demand:** Here, the demand comes from the TA/Class structure. In the real world, the demand comes from "the world" or "need." Students may resist the demand simply because it is an authority figure asking, not because of the moral content.
  3.  **Identity & Integrity over Time:** This is a 25-minute simulation. Real integrity costs accrue over a lifetime of career choices, relationships, and identity formation. A token is not a life plan.
  4.  **Partial Compliance Dynamics:** While the Ledger hints at this, the students cannot actually see what *other* students are giving until the end. The "Fair Share" objection relies heavily on knowing others are defecting. Here, they are in a vacuum.

  **Closing Instruction for TA:**
  If the data shows no difference between Ledger and Blind groups, do not panic. That is a null result. Use it to argue: *"Perhaps the demandingness objection isn't about cumulative burden, but about the nature of the individual claim. Or perhaps 5 tokens simply isn't enough to trigger the threshold."* This turns a failed experiment into a successful philosophical inquiry.
