answer: |-
  *   **Plan:**
      *   Validate the "inert preference" intuition as the core identifiability problem in IRL.
      *   Explain the technical underdetermination (multiple reward functions fit one policy).
      *   Integrate the philosophical belief-desire holism (action ≠ desire alone).
      *   Evaluate the instrumentalist defense (prediction vs. alignment).
      *   Deliver verdict: It is a deep structural problem, not a bug.

  **Bottom Line:** Inferring true preferences from behavior alone is theoretically impossible because action underdetermines mental states; you can build useful predictors, but they will remain "as-if" preferences, not ontological truths.

  ***

  Your ham sandwich example isn't overthinking; it is the precise crack in the foundation of behaviorist AI. You have independently rediscovered the **identifiability problem** in Inverse Reinforcement Learning (IRL) and married it to the **belief-desire holism** of philosophy of action. The short answer is that behavior alone cannot distinguish between a desire for ham, a habit of ordering, or a false belief that ham is the only option.

  Technically, IRL attempts to recover a reward function $R$ given a policy $\pi$. But for any optimal policy, there is an infinite family of reward functions that render it optimal. You can add potential-based shaping terms to $R$ without changing the optimal behavior. In your dad's case, a reward function valuing "ham" and a reward function valuing "minimizing cognitive load" (habit) produce identical trajectories. Without additional constraints—like assuming specific rationality bounds or access to counterfactuals (what would he do if the menu changed?)—the math guarantees ambiguity. The model isn't failing to find the right answer; the data does not contain the answer.

  Philosophically, this mirrors Donald Davidson's argument that propositional attitudes (beliefs, desires) are not isolated internal causes but a holistic web. An action is the output of desire *and* belief. If your dad orders ham, he might desire ham (D1) and believe the cafe serves it (B1), or he might desire efficiency (D2) and believe reading the menu costs time (B2). Observing the action isolates neither. You noted you never observe the "wanting." Precisely. You observe motion, not motivation. To infer the reward, you must assume the beliefs, but beliefs are unobserved latent variables just as hidden as the rewards.

  So, does it work *in principle*? Only if you redefine "work."

  If "work" means **prediction**, then yes. An inert preference is functionally equivalent to a real one for forecasting tomorrow's lunch. Daniel Dennett's "Intentional Stance" suggests that if treating the system as having a preference predicts its behavior perfectly, the preference is real enough for practical purposes. From this instrumentalist view, your worry is semantic. The model hands you something that usefully pretends to be a preference, and for a recommendation engine, that might suffice.

  However, if "work" means **alignment**—building AI that promotes human welfare—the instrumentalist defense collapses. Alignment requires distinguishing between what a human *does* and what *satisfies* them. If an AI reinforces your dad's habit when he actually wants to try something new but feels stuck, it has optimized for the behavior while violating the welfare. The "inert preference" is a local optimum in behavior space that traps the agent. Pure behaviorism cannot distinguish between satisfaction and stagnation because both look like stability in trajectory data.

  Furthermore, the belief/desire tangle creates a "noise" problem that isn't random. If the AI assumes rationality but the human operates on habit, the AI infers a spurious reward. It thinks you love ham when you actually love novelty but hate decision fatigue. The AI then removes the friction (e.g., auto-ordering the ham), permanently locking you out of the novelty you secretly value. This is not a minor error; it is a category error regarding the nature of agency.

  **Verdict:** The inert preference worry is a deep problem. It is not a bug in current algorithms but a fundamental limitation of trying to recover internal states from external traces alone. You cannot solve IRL with more data if the data type (behavioral trajectories) lacks the necessary degrees of freedom to separate belief, desire, and habit.

  To move beyond "useful pretense," systems must break the behavior-only loop. They need multi-modal grounding: explicit feedback, physiological signals, or counterfactual queries ("What if the menu changed?"). Without these, AI remains a behaviorist mirror, reflecting our actions back at us as if they were our wishes, cementing our habits into our digital destiny. Your dad's sandwich is safe, but his autonomy is not.
