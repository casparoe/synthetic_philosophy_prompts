answer: |-
  It is completely understandable that your group feels stuck after two years, because you are encountering one of the most resilient knots in the history of ethics. Your hunch is remarkably sharp, particularly the suspicion that the definitional work is doing the normative lifting without anyone noticing. Augustine defines a lie not primarily as an objective falsehood but as a subjective mismatch, a signification against one's own mind. Once you accept that definition, the wrongness seems to follow automatically from the nature of communication itself, which makes the divine command look like a redundancy. However, to answer your specific question about whether a case exists where the sign-perversion ground and the divine-command ground give different verdicts, I must argue that such a case cannot exist within Augustine's own framework, and recognizing why it cannot is likely the only way to untangle your group's deadlock.

  The reason no such case exists is that for Augustine, the nature of the sign and the divine command are not independent variables that could potentially conflict. In modern ethical theory, we often distinguish between natural law, where acts are wrong because they violate the teleology of human nature, and divine command theory, where acts are wrong because a sovereign will prohibits them. We can easily imagine a scenario where these diverge, such as a god commanding an act that violates natural teleology. But Augustine does not operate with this dichotomy. For him, the nature of the sign is established by God's creative word. The purpose of speech is truth because God, who is Truth, created speech for communion. To violate the nature of the sign is to violate the order of creation, which is identical to violating the will of the Creator. Therefore, there is no possible utterance that could be a perversion of the sign yet commanded by God, nor an utterance commanded by God that perverts the sign. The two grounds are metaphysically fused in his thought, so looking for a case where they yield different verdicts is looking for a contradiction in his theology rather than a gap in his ethics.

  This suggests that your group's disagreement is substantive regarding meta-ethics but verbal regarding the text itself. You are effectively asking two different questions under one label. One camp is asking about the ontological status of the lie, seeking an explanation in the structure of reality and language, while the other is asking about the authority of the prohibition, seeking the source of the obligation in scripture. Both are correct readings of Augustine because he insists that the ontology of language is theological. The friction arises because your group is likely importing a later scholastic or modern distinction between natural law and voluntarism that Augustine would not recognize. When Camp 1 argues from the nature of the sign, they are doing natural law ethics, and when Camp 2 argues from divine command, they are doing voluntarist ethics, but Augustine is doing neither in isolation. He is arguing that the natural law is the divine command inscribed in creation. The disagreement persists because each camp is trying to isolate one strand of a braid that Augustine insists is a single cord.

  Your intuition about Rahab and the midwives is the key to moving this forward, precisely because you identified that both camps treat it as an embarrassment rather than data. If you accept that no divergent case exists, then the Rahab story cannot be an exception where God commands a lie. Augustine's solution is that the lie remains a lie, a violation of the sign, and thus remains a sin, but the mercy shown is rewarded separately. This preserves the absolute nature of the sign-perversion argument while acknowledging the complexity of the divine command judgment. The lie is not justified; it is merely outweighed or treated with mercy. If your group can accept that Augustine is willing to condemn the act even while praising the agent, it bridges the gap. The sign-perversion camp gets their inherent wrongness of the act, and the divine-command camp gets their nuanced reading of scriptural rewards without having to claim God commanded the falsehood.

  To move the argument, you should stop trying to find a case where the verdicts differ and instead challenge the groups to explain why they think the verdicts could differ. Ask Camp 1 if they believe the nature of the sign would hold its authority if God had not created it, and ask Camp 2 if they believe God could command a lie if it did not violate the nature of the sign. Their answers will likely reveal that they are both implicitly relying on the other's premise to make their own work, which proves that the separation is artificial. The disagreement is substantive only insofar as they are arguing about which modern ethical category best maps onto Augustine, but it is verbal insofar as they are fighting over a distinction the text refuses to make. If you can shift the discussion from proving one ground superior to understanding why Augustine binds them together, you might finally break the two-year stalemate. The wrongness comes from the double heart because the double heart is an offense against the God who is Truth, and for Augustine, those are not two reasons but one reality seen from different angles.
