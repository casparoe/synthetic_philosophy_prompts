          *   *Refinement:* Connect to the novelist's desire for "dramatic cheapness."
          *   *Deflection:* He'll say coarse-graining is necessary for *any* description.
          *   *Follow-up:* If it depends on the observer's blur, isn't it subjective? Can I write it as subjective?
          *   *Draft:* "Is the arrow in the atoms or in the blur? I want to write it as an artifact of human perception. Can I get away with that, or does the physics demand it's out there?"

      *   *Topic 4: Traces/Records.*
