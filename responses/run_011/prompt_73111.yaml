      *   **Specific Topics Required:**
          1.  Reversibility/Recurrence objections vs. Statistical picture.
          2.  Past Hypothesis (Tidy Beginning): Law, Brute Fact, or Fluctuation? (Pressing the Boltzmann Brain/memory trustworthiness consequence).
          3.  Ontology of the Arrow: Real vs. Artifact of coarse-graining. (Novelist wants it to be an artifact).
          4.  Traces/Records: Past vs. Future. Explanation or restatement?
