      *   *Boltzmann Brains:* If the universe is a fluctuation from equilibrium, it's more likely for a single brain with false memories to fluctuate into existence than for the whole ordered past to exist. This undermines memory reliability.
      *   *Coarse-graining:* Entropy depends on how we group microstates. Is the arrow subjective/epistemic or objective/ontic?
      *   *Recurrence (Poincaré):* Given enough time, systems return to initial states. Why doesn't this mess up the arrow?
