answer: |-
  **On the "wrong proposition" move**
  This is your biggest vulnerability. A referee will argue you haven't found a failure of epistemic aggregation, but a mismatch between *epistemic goals*. If the proposition is "Will the bank fail?", the crowd is right. The theorem holds. The tragedy is that the *ex post* truth (failure) is worse than the *ex ante* fundamental (solvency).

  If you frame this as "CJT tracks outcomes, but politics sometimes needs to track fundamentals," you avoid the relabeling charge. If you frame it as "CJT fails to find the truth," you are vulnerable, because the crowd *did* find the truth of the outcome. You need to explicitly argue that for this class of political questions, the *fundamental* is the relevant truth value, not the *realized outcome*. Without that normative premise, the "wrong proposition" move looks like moving the goalposts to save the counterexample.

  **On separating from the independence objection**
  Your one-line reply is sufficient, but only if you emphasize causal direction. Standard independence objections posit a common cause $C$ such that $P(V_i, V_j | C) \neq P(V_i | C)P(V_j | C)$. Your objection is that $V_{aggregate} \to V_i$. The correlation isn't a confounder; it's a feedback loop.

  To make this stick, stop calling it "correlation." Call it "feedback" or "causal reversal." Independence objections assume the world is static while voters err. Your objection is that voters change the world while voting. That is a distinct structural claim, not just a parameter tweak.

  **On the bank run example**
  It is worn out, but it is the cleanest model of the mechanism. For a political theory workshop, the risk isn't that it's cliché, but that it's *economic*. Political theory cares about legitimacy, justice, or authority, not just liquidity.

  If you want something more political, switch to **policy performativity**. Example: A vote on whether a new welfare policy will "cause dependency." If the vote passes (believing it causes dependency), funding is cut, the safety net vanishes, and dependency rises. If the vote fails (believing it won't), funding remains, and dependency stays low. The truth of the proposition is determined by the vote count.

  Alternatively, **electability primaries**. "Is candidate X electable?" If the poll says no, donors flee, and they become unelectable. This captures the constitutive element without the mechanical threshold of a bank run.

  Keep the bank run if you need formal clarity, but acknowledge it as a limit case. If you want normative bite, use the policy example.

  **On the mathematics**
  A formalist will call the bluff on the **timing**. The Jury Theorem is typically simultaneous voting. Your example implies sequentiality ("queue outside the branch," "running tally").
  *   If simultaneous: How do the 960 see the tally before voting?
  *   If sequential: CJT doesn't apply in its standard form anyway.

  **The cheapest honest fix:** Add a footnote or a parenthetical specifying the information structure. "Assume voters observe a noisy signal of the current aggregate intention prior to casting their own vote." You don't need a full model, but you must acknowledge that the information set $I_i$ includes $\sum_{j<i} v_j$. Without that, the "follower" mechanism is magic.

  **The weakest sentence**
  > "And that's not a proposition anyone can act on collectively, because acting on it is what would have made it true."

  This is logically tangled. If acting on the conditional ("don't run") makes the bank sound, then the proposition *is* true. Why can't they act on it? The problem isn't that acting makes it true; the problem is that the *voting mechanism* prevents them from coordinating on the "don't run" equilibrium. You are conflating *truth conditions* with *coordination problems*.

  Rewrite to: "The proposition is actionable only if the vote does not count as the action, but here the vote *is* the run."

  **On the label "constitutive"**
  "Constitutive" carries heavy metaphysical baggage (Searle, social ontology). It suggests you are making a claim about the *nature* of social facts.
  "Performative" (Austin, Soros, Callon) is the standard term in social science for "statements that bring about the reality they describe."
  "Endogenous Truth" is clearer for formalists.

  If you stick with "constitutive," you must explicitly disclaim the heavy ontology. If you switch to "performative," you align with existing literature on economic performativity, which might help or hurt depending on your audience. For political theory, "constitutive" is acceptable *if* you define it strictly as "truth-value dependence on aggregate belief," not "social construction of reality."

  **Summary of blunt advice**
  1.  **Clarify the truth target:** Distinguish *ex ante* fundamentals from *ex post* outcomes. The theorem tracks the latter; you want the former.
  2.  **Fix the timing:** Acknowledge the sequential information flow required for followers to follow.
  3.  **Tighten the logic:** The "conditional" sentence is currently self-contradictory.
  4.  **Consider the audience:** If they are political theorists, swap the bank for a policy or election example. If they are formalists, keep the bank but fix the info structure.
  5.  **Label:** "Performative" is more precise; "Constitutive" is riskier but potentially more novel if defined narrowly.
