  3.  **Drafting the Spec (The Table):**
      *   I need to create categories based on the user's prompt (Denominator, Category, Aggregation, Weighting, Baseline, Evidence).
      *   *Item 1: The Unit of Moral Concern (Denominator).* Is it per capita (risk to an individual) or absolute (total suffering)? *Case:* Per capita suits individual risk assessment; absolute suits total utilitarian suffering.
      *   *Item 2: The Boundary of Violence (Category).* Direct physical force vs. structural/systemic harm (famine, poverty). *Case:* Direct is measurable; structural is morally relevant but conceptually broad.
      *   *Item 3: Temporal Aggregation (The Trend).* Smooth decline vs. heavy-tailed volatility. *Case:* Averages hide tail risk; tail risk defines existential threat.
