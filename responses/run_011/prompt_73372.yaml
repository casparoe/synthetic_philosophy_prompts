answer: |-
  You are not confused; you are noticing that morality isn't a single flat rule. Your gut is tracking three different sources of obligation that often get tangled up. Your initial theory (Cost vs. Benefit) failed because it only measured one of those sources.

  Here is the principle that underlies your verdicts. It is a **Hierarchy of Claims**.

  1.  **The Claim of Capacity:** If you have the unique capacity to prevent severe harm at low cost to yourself, you are obligated to act. (The random swimmer, the lifeguard).
  2.  **The Claim of Bond:** Specific relationships or roles raise the cost you are expected to bear for specific people. (The brother, the nurse, the parent).
  3.  **The Claim of Reliance:** When you voluntarily establish a pattern that others depend on, you incur an obligation to maintain it or transition it responsibly. (The volunteer driving, the uncle).

  Here is how this principle handles your cases, the new tests you asked for, and where your intuition needs correction.

  ### Part 1: Running the Principle on Your Cases

  **The Swimmer (Capacity)**
  *   **Your Verdict:** Wrong to do nothing.
  *   **The Principle:** This is a pure **Claim of Capacity**. The cost (getting wet/tired) is low; the stakes (death) are absolute. It doesn't matter if you're paid (lifeguard) or random (swimmer). The only variable is risk. In the slush scenario, the cost becomes high (potential death of rescuer), so the obligation dissolves into praiseworthiness.
  *   **Status:** **Keep this.** You are right that a random bystander has a moral duty here, even if the law doesn't enforce it.

  **The Kidney (Bond)**
  *   **Your Verdict:** Stranger = Optional; Brother = Obligatory.
  *   **The Principle:** This is the **Claim of Bond**. The physical cost is identical, but the relational debt is not. We owe more to kin than to strangers.
  *   **Status:** **Keep the distinction, question the intensity.** It is true you owe your brother more than a stranger. However, most ethical frameworks hold that bodily integrity is a hard limit. Even for a brother, donating an organ is usually considered "above and beyond," not "required." You feel it's required because the bond is deep, but calling it "wrong" to say no is a very heavy burden. I will address this in the critique section.

  **The Nurse (Bond/Capacity)**
  *   **Your Verdict:** Sister is more on the hook.
  *   **The Principle:** This is **Claim of Bond** mixed with **Capacity**. She has a professional skill set and a family role. You have neither. The same act (CPR) requires different levels of sacrifice from each of you. For her, it's low cost (she knows what to do); for you, it's high cost (panic, potential harm).
  *   **Status:** **Keep this.** The same act can be required of one person and optional for another based on training and role.

  **The Frugal Donor (Bond vs. Capacity)**
  *   **Your Verdict:** Ambivalent (Saintly vs. Negligent).
  *   **The Principle:** This is a conflict between **Claim of Capacity** (helping the world) and **Claim of Bond** (parental duty).
  *   **Status:** **Drop the ambivalence.** The Claim of Bond takes priority. Parents have a primary obligation to the flourishing of their own children. If the charity comes at the expense of the children's basic emotional or developmental needs (hand-me-downs, no experiences), it is not saintly; it is misordered duty. He is shortchanging his kids.

  **The Uncle (Reliance)**
  *   **Your Verdict:** Nothing wrong, but worse.
  *   **The Principle:** This is the **Claim of Reliance**. A birthday card fulfills the *technical* requirement of the relationship (remembering), but the *spirit* of the relationship relies on presence. He is meeting the minimum rule but failing the relational expectation.
  *   **Status:** **Keep this.** It distinguishes between "rule compliance" and "virtue."

  ### Part 2: Running the Principle on Your New Cases

  **1. The Bragging Kidney Donor**
  *   **Scenario:** Someone donates anonymously into a chain but won't stop talking about it.
  *   **Verdict:** They get **less moral credit**, but the act remains good.
  *   **Why:** Under the **Claim of Capacity**, the act saved a life. That stands. However, moral *praise* is reserved for virtue, not just outcomes. If the motive is self-aggrandizement, it undermines the "goodness" of the character, even if the consequence is positive. It shifts from "virtuous sacrifice" to "transactional purchase of status."

  **2. Same Act, Different Obligation (The Nurse)**
  *   **Scenario:** Can the same act be required of one person and above-and-beyond for another?
  *   **Verdict:** **Yes.**
  *   **Why:** As established with your sister, obligation is not just about the *act*; it's about the *agent*. A firefighter is obligated to run into a burning building; I am not. A parent is obligated to feed their child; I am not. Your intuition here is correct: context and role define the duty, not just the physical action.

  **3. The Volunteer Driving (Reliance)**
  *   **Scenario:** You've driven for six years. People count on you. Is it still optional?
  *   **Verdict:** **It is no longer purely optional.**
  *   **Why:** This is the **Claim of Reliance**. In week one, you were a stranger offering a gift. In year six, you are part of the infrastructure of their care. If you quit tomorrow without notice, you cause harm (missed dialysis).
  *   **The Nuance:** You are not obligated to do this *forever*. You are human, not a machine. But you are now obligated to **manage the exit.** You cannot just stop. You owe it to the organization and the riders to give notice, help find a replacement, or taper off. The voluntariness of the *entry* does not guarantee the voluntariness of the *exit* once reliance is established.

  ### Part 3: The Straight Talk (What to Keep, What to Drop)

  You asked me to be straight about which verdicts hold up and which don't.

  **1. The Verdict to Drop: The Brother's Kidney.**
  You said if you said no to your brother, you'd have done something *wrong*.
  I think you are being too hard on yourself. The **Claim of Bond** is strong, but it rarely overrides **Bodily Autonomy**. Even for family, major surgery with lifelong risks is typically in the realm of the "heroic," not the "mandatory." If you said no, you might feel regret, or he might feel hurt, but you would not have committed a moral failure. Keep the priority (brother over stranger), but drop the obligation.

  **2. The Verdict to Solidify: The Frugal Donor.**
  Stop flipping on this. If his children are suffering so he can give to strangers, he is failing the **Claim of Bond**. Charity begins at home not because strangers don't matter, but because parents have a specific contract with their children that they do not have with the world. That is negligence, not sainthood.

  **3. The Verdict to Accept: The Random Swimmer.**
  People tell you you're not allowed to say the random swimmer did something wrong. They are confusing *legal* liability with *moral* duty. Legally, he's fine. Morally, under the **Claim of Capacity**, he failed. Trust your gut here. If you can save a life at low cost, you must.

  **4. The Verdict on Your Driving.**
  You are worried your gut calls don't add up. They do. They add up to this: **You have created a dependency.**
  For six years, you have been reliable. That reliability has value. Because it has value, you now carry a weight you didn't carry in year one.
  *   **Are you trapped?** No.
  *   **Are you free to just quit?** No.
  *   **The Principle:** You have earned the right to stop, but you have incurred the duty to stop *responsibly*.

  **Summary:**
  Your intuition is tracking a sophisticated system of **Capacity, Bond, and Reliance.** It is not inconsistent; it is contextual.
  *   **Capacity** saves the swimmer.
  *   **Bond** prioritizes the brother (but doesn't mandate the kidney).
  *   **Reliance** binds the driver (to a responsible exit).

  You are not doing anything wrong by feeling the weight of the driving. That weight is the moral cost of being a reliable person. But you are allowed to put it down, provided you let the people leaning on you know gently, and in time to find a new pillar.
