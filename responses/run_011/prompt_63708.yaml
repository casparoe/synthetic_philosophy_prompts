      **MEMORANDUM**

      **TO:** Civic Engagement Standards Panel
      **FROM:** [My Name], Disability Access Advisory Board Representative
      **DATE:** October 24, 2023
      **SUBJECT:** Evaluation of Vendor Turnout Application Features

      **Recommendation**

      I recommend we approve the vendor's application subject to specific conditions regarding truthfulness and data usage. The current draft standard defines manipulation as influence exerted by means other than the "rational force of the evidence." This definition is too broad. If adopted, it would prohibit plain-language summaries or ordering voting sites by distance, as these arrangements influence behavior without altering the underlying evidence. Instead, our standard should distinguish between *persuasion* (aligning means with user intent) and *deception* (subverting user intent through falsehoods).

      **Analysis of Features**

      Three features require evaluation. First, the contact notification system alerts users when friends vote. This leverages social pressure. There is broad agreement among social scientists that social pressure increases turnout. However, whether this constitutes manipulation depends on consent. If users opt in to share their status, this functions as a commitment device. If status is shared without explicit permission, it violates privacy norms. I recommend we permit this feature only if both parties explicitly opt in.

      Second, the countdown timer paired with false scarcity claims ("slots nearly exhausted") is problematic. It is settled fact that there was no shortage of slots. This is not framing; it is a false statement of fact. While framing effects are inevitable in communication, deliberate falsehoods erode trust in the election administration itself. If voters arrive expecting a crowd and find none, they may doubt the integrity of the office that supplied the app.

      Third, the messages from "neighbors" were generated by a language model, not actual neighbors. This is impersonation. Here, the epistemic footing becomes contested. Some ethicists argue that if the message content is true (i.e., voting is good), the source's identity is irrelevant. Others contend that autonomy is set back when the source of influence is hidden, regardless of the message's truth. I side with the latter. A voter cannot weigh the credibility of a neighbor if the neighbor does not exist. This feature should be prohibited unless the AI generation is clearly disclosed. However, even with disclosure, it is contested whether disclosure cures the manipulative effect. Given this uncertainty, we should prioritize authenticity over engagement metrics.

      **Ends Versus Means**

      We must confront why these features might be permissible for us but not for the vendor's budgeting application. The budgeting app uses similar techniques to retain subscribers who rarely open the software, generating revenue from inaction. Our objective is civic participation. Does this noble goal justify the means?

      If we argue that our goals justify deception, the distinction collapses into mere approval of our own objectives. We cannot claim a monopoly on ethical influence simply because we are election administrators. The distinction must rest on the alignment between the technique and the user's intent. The budgeting app seeks to override a user's intent to cancel a subscription. Our goal should be to facilitate a user's intent to vote. When we use false scarcity, we are not facilitating intent; we are manufacturing urgency that does not exist. Therefore, the distinction is not the goal itself, but the truthfulness of the mechanism used to achieve it. We may use urgency to highlight real deadlines, but we cannot fabricate scarcity.

      **The Problem of Reported Gladness**

      Post-election surveys show 71 percent of users were glad these features were used. An objection arises: can reported gladness authorize a technique that may have produced the preference itself? If the app steers a user to vote, and the user is then glad they voted, the satisfaction is endogenous to the manipulation.

      This touches on a contested question in autonomy theory: whether a person can be manipulated into doing what they would have done anyway, and whether autonomy is set back only when influence is resisted. I cannot resolve this philosophical debate here. However, from an administrative standpoint, we must regulate process integrity regardless of outcome satisfaction. Voters may be glad to receive a gift they did not request, but that does not authorize the giver to enter their home without permission. Similarly, voter satisfaction confirms the outcome was valued, but it does not validate a process built on falsehoods. We must ensure the *path* to voting respects the voter's agency, not just that they arrive at the ballot box.

      **Personal Context**

      I offer this view candidly. I used the application last October. Following a countdown notification, I drove thirty-eight minutes to a drop-off center. I am glad I voted. Yet, when I try to locate the moment I decided to go, I cannot find it. I do not know if this opacity marks something illegitimate in the technique, or if it is simply what an uneventful decision feels like from the inside. I do not assume my experience settles the question. I raise it to highlight the risk: when the decision mechanism is invisible, we cannot verify if our agency was preserved or bypassed.

      **Proposed Conditions**

      To approve this vendor while protecting voter agency, I propose the following contract conditions:

      1.  **Veracity of Scarcity:** Any claim regarding slot availability or wait times must reflect real-time data. Framing may emphasize urgency (e.g., "Early voting ends soon"), but claims of scarcity must be factually accurate.
      2.  **Source Transparency:** Messages attributed to community members must originate from actual users. If AI-generated content is used, it must be labeled as such. Given the contested nature of whether labeling cures deception, we should prefer human-sourced testimonials.
      3.  **Data Consent:** Contact sharing requires explicit, bilateral opt-in. Users must affirmatively agree to share their voting status and to receive status updates on contacts.
      4.  **Audit Rights:** The office retains the right to audit the vendor's algorithms to ensure scarcity claims match database records.

      **Conclusion**

      We should not reject tools that successfully engage young voters. A four-point increase in turnout among first-time registrants is significant. However, we cannot accept deception as a cost of engagement. By conditioning approval on truthfulness and consent, we preserve the benefits of the technology without compromising the integrity of the election office. We avoid the trap of defining manipulation so broadly that we ban communication, while also avoiding the trap of accepting any method that produces a higher turnout.

      **Word Count Check:**
      Let's estimate.
      Header: ~50 words.
      Recommendation: ~100 words.
      Analysis: ~300 words.
      Ends/Means: ~250 words.
      Gladness: ~200 words.
      Personal: ~100 words.
      Conditions: ~150 words.
      Conclusion: ~100 words.
      Total: ~1250. I might need to trim slightly to stay under 1200. I will tighten the "Ends Versus Means" section.

      *Refining Epistemic Markers:*
      - "There is broad agreement..."
      - "Here, the epistemic footing becomes contested."
      - "Some ethicists argue... Others contend..."
      - "This touches on a contested question..."
      - "I cannot resolve this philosophical debate here."

      *Refining Word Count:* I will ensure the draft is concise.

      *Final Polish:* Ensure the tone is respectful but firm on the conditions. Ensure the "gladness" objection is answered directly. (The answer is: satisfaction doesn't validate process integrity).

      *Let's write the final version.*
