answer: |-
  # Handout: Disambiguating "Don't Throw Good Money After Bad"

  **Context:** *The following menu distinguishes five distinct claims often conflated under the proverb "don't throw good money after bad." Each thesis specifies the parameters of the decision problem (time, baseline, uncertainty, evaluation object) to allow for precise assessment.*

  1.  **The Recovery Tautology:** Relative to the counterfactual baseline of immediate withdrawal at the time of decision, resources expended prior to the decision cannot be retrieved by any future action available to the agent.
      *   **Verdict:** Platitude (True by definition).
      *   **Supports Dismissal?** No; establishing that costs are unrecoverable does not entail that further investment is irrational.

  2.  **The Causal Irrelevance Thesis:** In a one-shot decision under uncertainty, the fact of past expenditure exerts no causal influence on the probability distribution of future outcomes or the intrinsic utility of those outcomes.
      *   **Verdict:** Substantive but defensible (True regarding the money, false regarding the capital/reputation it built).
      *   **Supports Dismissal?** No; causal irrelevance of the *cost* does not imply negative expected value of the *project*.

  3.  **The Deliberative Exclusion Thesis:** Rational evaluation under expected utility theory assesses only future outcomes, treating whole histories of outcomes as relevant only insofar as they causally determine future payoffs.
      *   **Verdict:** Substantive but defensible (Standard EUT orthodoxy).
      *   **Supports Dismissal?** No; this constrains the *form* of the calculation but does not dictate the *result* of the calculation.

  4.  **The Evidential Pessimism Thesis:** A history of unsuccessful expenditure provides sufficient Bayesian evidence that the probability of future success is too low to justify marginal cost in a decision under uncertainty.
      *   **Verdict:** Substantive but defensible (An empirical claim about the specific project, not a general principle).
      *   **Supports Dismissal?** Yes, but only if the auxiliary premise holds that six years of failure outweighs the evidential value of the apparatus and reputation.

  5.  **The History-Sensitive Preference Thesis:** Rational agents maximize the utility of whole histories of outcomes, assigning intrinsic disvalue to the waste of prior sacrifice independent of future consequences.
      *   **Verdict:** False (Contradicts standard expected utility theory, though defensible in non-consequentialist frameworks).
      *   **Supports Dismissal?** Yes; if accepted, this licenses stopping solely to avoid compounding the "waste" of the history.

  ***

  ### Instructor's Commentary & Analysis

  **1. Ordinary Usage and the "Slide"**
  Ordinary users of the proverb typically intend **Reading 4 (Evidential Pessimism)** but justify it using the rhetorical force of **Reading 1 (Recovery Tautology)**. The persuasive slide occurs when the undeniable truth that "the money is gone" (Reading 1) is used to smuggle in the contingent empirical claim that "the project is doomed" (Reading 4). The student's dismissal relies on this slide: they treat the *financial* irrecoverability of the past six years as proof of the *deliberative* irrelevance of the project's future potential.

  **2. Rational Preferences and History**
  **Reading 5** depends entirely on a contentious thesis about history-sensitivity. Standard Expected Utility Theory (EUT) assumes preferences are defined over final outcomes (wealth states, etc.), not the *path* taken to reach them. Under standard EUT, the "waste of a sacrifice" has no disvalue unless it reduces future utility. However, if one adopts a "narrative" or "integrity" based utility function—where an agent rationally cares about the fit between past commitment and present action—then Reading 5 becomes defensible. In your seminar case, the department's desire to honor long commitments suggests a history-sensitive preference structure that standard EUT might label irrational but which practical rationality may accommodate.

  **3. Unrecoverable vs. Evidentially/Strategically Inert**
  The proverb collapses the distinction between an outlay being *financially unrecoverable* and an outlay being *deliberatively inert*.
  *   **Unrecoverable:** You cannot sell the apparatus for what you paid (Reading 1).
  *   **Inert:** The past expenditure provides no information or strategic leverage for the current decision.
  Your case demonstrates that sunk costs are rarely inert. The six years of failure are **evidentially relevant** (they update the probability of success, though perhaps not to zero); the apparatus is **strategically relevant** (it has no resale value but high use value if the project succeeds); and the donors' watchfulness makes the decision **reputationally relevant** (withdrawal signals unreliability). The student's argument fails because it treats the sunk cost as inert simply because it is unrecoverable, ignoring that the *existence* of the sunk cost changes the payoff structure of the current choice via signaling and evidence.
