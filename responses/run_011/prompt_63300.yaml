  # Seminar Handout: The Dream Ontology Self-Sort

  **Instructions:** Read each case description. Select the option (A, B, or C) that best matches your intuition about what is *actually happening* in the scenario. Do not select the answer you think is "scientifically correct"; select the one that matches your philosophical commitment to the nature of the case.

  ### 1. The Empty Morning
  **Case:** A subject wakes and immediately says, "I know I was dreaming just now; I have the feeling of it, but there is absolutely no imagery or narrative content I can retrieve."
  *   **A.** The claim "I was dreaming" is true simply because they are disposed to say it; without content, there is no fact of the matter about an inner state.
  *   **B.** They had a conscious experience that was purely affective or non-imagistic, which has now faded.
  *   **C.** Their brain was in a sleep-state process that typically produces dreams, but the "experience" only arises if a report is generated.

  ### 2. The Certain Non-Dreamer
  **Case:** A subject insists for weeks they "never dream." On night 20, you wake them during REM. They produce a vivid, 3-minute narrative report.
  *   **A.** They were not dreaming until the moment they spoke; the report constitutes the dreaming, overriding their previous denial.
  *   **B.** They were dreaming all along but have a waking memory deficit; the experience happened during sleep.
  *   **C.** The brain state was active, but the "dream" is a confabulation generated to make sense of the activation upon waking.

  ### 3. The Shifting Narrative
  **Case:** You wake a subject at 4:00 AM. They report a dream about a train. You let them sleep, wake them at 4:10 AM. They report a dream about a boat, insisting the train dream never happened.
  *   **A.** The first report was a true dreaming event; the second report is a new dreaming event that overwrote the first.
  *   **B.** The reports are unstable constructions generated at the moment of waking; neither reflects a stable "record" from sleep.
  *   **C.** The sleep processing was continuous; the waking consciousness is sampling different fragments of a latent unconscious process.

  ### 4. The Neural Decoder
  **Case:** An fMRI scanner identifies neural patterns associated with "face recognition" while the subject is asleep. Upon waking, the subject reports seeing a face.
  *   **A.** The report validates the neural pattern; without the report, the pattern is just neural noise, not a "dream."
  *   **B.** The subject consciously saw the face during sleep; the scanner merely correlated with the experience.
  *   **C.** The brain processed "face" data unconsciously; the conscious experience of the face was instantiated only at the moment of waking.

  ### 5. The Lucid Signal
  **Case:** A lucid dreamer agrees to count to ten while asleep. You observe pre-arranged eye-movement signals (left-right-left-right...) matching the count.
  *   **A.** The signals are the dream; the "counting" is a description of the voluntary motor disposition during sleep.
  *   **B.** The subject was consciously counting in real-time during sleep; the eye movements are a veridical index of that experience.
  *   **C.** The motor cortex was activated in a sequence; the conscious "counting" is a post-hoc interpretation of that motor output.

  ### 6. The Sensory Splash
  **Case:** While the subject is in REM, you spray a mist of water on their hand. Upon waking, they report, "I was standing in the rain."
  *   **A.** The report incorporates the stimulus; the "rain" did not exist until the stimulus was integrated into the waking narrative.
  *   **B.** The sensation was consciously experienced as rain during the sleep state.
  *   **C.** The sensory input was processed by the sleeping brain and stored as data, which was rendered as "rain" upon waking.

  ### 7. The Fragmented Wake
  **Case:** You wake a subject mid-REM. They report fragmented, static images (a door, a shoe) with no narrative connecting them.
  *   **A.** Dreaming requires a narrative structure; without it, they were merely in a sleep state, not dreaming.
  *   **B.** Dreaming can be non-narrative; they had brief, snapshot experiences during sleep.
  *   **C.** The brain was activating discrete memory nodes; the lack of narrative shows the "story" is usually added later.

  ### 8. The Impossible Geometry
  **Case:** A subject reports walking through a door that led simultaneously to a kitchen and a beach.
  *   **A.** The report describes a logical impossibility, proving the report is a waking construction, not a record of an experience.
  *   **B.** Phenomenology during sleep is not bound by physical laws; they experienced this impossibility during sleep.
  *   **C.** The brain activated conflicting spatial schemas; the "impossibility" is a feature of the unconscious processing, not a conscious scene.

  ***

  # Scoring Key & Theoretical Profiles

  **Step 1: Tally your answers.**
  Count how many **A**s, **B**s, and **C**s you selected.

  **Step 2: Identify your Primary Cluster.**
  *   **Mostly A:** You hold a **Waking-Construction View**. You believe the dream report is the primary ontological unit.
  *   **Mostly B:** You hold a **Sleep-Consciousness View**. You believe dreams are conscious experiences occurring during sleep.
  *   **Mostly C:** You hold a **Latent-Process View**. You believe dreams are neural/mental processes that become conscious only at waking.

  **Step 3: Refine your Theory (The Pivot Questions).**
  *Look at your specific answers to the Pivot Questions listed below to find your specific theory.*

  ### If you are Mostly A (Waking-Construction)
  *   **Check Question 2:**
      *   If you chose **2A** (The report constitutes the dreaming): You are a **Malcolmian**. Dreaming is not an experience; it is the disposition to tell a dream. If there is no report, there is no dream.
      *   If you chose **2C** (The report is a confabulation about activation): You are a **Harsh Confabulationist**. Nothing is composed during sleep. The waking brain fabricates a story to explain neural noise. The report is an error, not a constitution.

  ### If you are Mostly B (Sleep-Consciousness)
  *   **Check Question 6:**
      *   If you chose **6B** (Consciously experienced as rain): You are a **Plain Experientialist**. Dreams are perceptual-like experiences that happen in real-time during sleep.
      *   If you chose **6A** (Incorporated into narrative): You are an **Imagination/Simulation Theorist**. You believe experiences happen during sleep, but they are cognitively akin to imagining or simulating, not perceiving external reality (even internally). *Note: If you leaned heavily on Q8B regarding impossibility, this confirms the Simulation view.*

  ### If you are Mostly C (Latent-Process)
  *   **Check Question 4:**
      *   If you chose **4C** (Processed unconsciously, instantiated at waking): You are an **Unconscious Experience Theorist**. Something happens during sleep, but it is not conscious *until* the waking moment creates the qualia.
      *   If you chose **4C** but leaned toward **3C** (Continuous processing sampled at waking): You are a **Cassette Theorist**. The content is recorded/stored during sleep (like a tape) and played back/realized upon waking. *Distinction: Cassette implies storage of specific content; Unconscious Experience implies processing that only becomes content at waking.*

