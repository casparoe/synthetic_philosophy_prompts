      *   **Thesis:** Chesterton's Fence is an *evidential* principle (existence = evidence of past reasons), not a *precautionary* one (don't touch because risk). It relies on Burkean *prescription* (long usage implies legitimacy/utility). Weight depends on maintenance/reaffirmation (decay condition).
      *   **Goal:** Prepare for Q&A. Need 6-8 objections, replies (90 secs), weakness analysis, strategic advice (concede, hold firm, fear).

  2.  **Deconstruct the Thesis:**
