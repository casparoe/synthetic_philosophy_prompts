  *(Self-Correction during drafting)*: I need to be careful not to just say "Inflation is bad." I need to explain why *Berkeley's own premises* lead to that conclusion without invoking metalism. The anchor must be *labor*, not *gold*. The limit of money is the limit of the labor it can command.

  *Refining the Ranking:*
