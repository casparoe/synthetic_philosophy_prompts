  *Wait, one nuance on (5):* The user claims (5) says "each wage still buys what it bought." This is the Quantity Theory. But (7) says "rising demand... sets people to work." This is the Stimulus Theory. You cannot hold both simultaneously without a time lag or friction. The argument glosses over the transition period. I will highlight this.

