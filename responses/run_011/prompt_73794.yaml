  **MEMORANDUM**

  **TO:** Contributing Scholars
  **FROM:** The Editorial Board, *Journal of Complex Societal Trajectories*
  **DATE:** 1 October 2024
  **SUBJECT:** Mandatory Stylistic Realignments and Terminological Hygiene

  Effective immediately, the *Journal* implements sweeping revisions to its house style. Recent submissions have demonstrated unacceptable semantic drift regarding societal endpoints. To maintain methodological rigor, authors must adhere to the following directives.

  1.  **Prohibition of Totalizing Nouns:** The word "collapse" is banned. It implies a singular, morally charged event rather than a distributed process. Authors must specify which subsystems ceased function.
  2.  **Locus of Continuity:** Manuscripts must distinguish between elite discontinuity and commoner persistence. If palace inscriptions cease but agricultural intensity remains stable (e.g., Southern Maya Lowlands vs. Northern centers), this constitutes elite discontinuity, not systemic failure.
  3.  **Network Propagation:** Do not attribute Late Bronze Age disruptions to internal moral decay. Describe them as interdependent network failures where the removal of one node propagates instability across the system.
  4.  **Chronological Hygiene:** Demographic catastrophes must not be conflated with pre-contact ecological mismanagement. Specifically, Rapa Nui population declines must be analytically separated from post-contact European interventions.
  5.  **Baseline Objectivity:** Authors must establish a non-arbitrary baseline against which decline is scored. This baseline must be universally applicable across all case studies without relying on retrospective survivorship bias.

  **Approved Glossary of Trajectory Adjustments**

  *   **Elite Discontinuity:** The cessation of dynastic inscription and redistribution accounts while surrounding populations continue farming.
  *   **Socio-Political Metabolism Adjustment:** A reduction in energy expenditure by central administration, formerly misidentified as decline.
  *   **Post-Complexity Voluntary Simplification Event:** A deliberate shedding of bureaucratic overhead to enhance resilience (see: Tainter, J. [Fictionalized]). Note: Do not use if evidence suggests coercion.

  **Worked Example**

  *   **Rejected:** "The Bronze Age collapse occurred because kingdoms became too complex and failed to adapt to drought."
  *   **Compliant:** "Late Bronze Age palatial networks experienced propagation failure following climatic stressors, resulting in elite discontinuity while rural settlement patterns persisted."

  **Compliance Note**

  Adherence to Rule 5 is mandatory, though the Board acknowledges the epistemological difficulty of defining normalcy without relying on cases that survived. Scholars are encouraged to approximate objectivity until a universal metric is discovered.

  **Board Status Update**

  Regarding the *Journal* itself, the Editorial Board wishes to clarify its operational status. We are not ending. We are not failing. We are entering a phase of indefinite editorial quietude. Our publication schedule is undergoing a permanent socio-political metabolism adjustment. The Board is experiencing elite discontinuity; however, the staff will continue to process submissions in spirit. We trust authors will respect this transition without imposing arbitrary baselines on our productivity. We are not collapsing. We are reconfiguring into a non-public entity to avoid survivorship bias in the literature. Thank you for your cooperation during this voluntary simplification event.
