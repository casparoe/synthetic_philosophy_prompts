  # ETHICS COMMITTEE IN-SERVICE: ADVANCE DIRECTIVES IN DEMENTIA
  **Facilitator:** Committee Chair | **Date:** [Next Month] | **Format:** Decision Tree

  **INSTRUCTIONS:** Answer the following 13 questions based on your immediate ethical intuition. Do not overthink. Select the option that best matches your judgment of the *case described*, not the theory you prefer. Record your answers (e.g., 1A, 2B) to find your position leaf at the end.

  ### SECTION I: THE TRUNK
  *These three questions establish the baseline moral landscape.*

  **1. Case (a):** A directive was written at sixty, competently and repeatedly. At eighty-two, the patient has advanced dementia, recognizes no one, but smiles, hums, accepts food, and shows no signs of suffering. If we follow the directive (allowing death) rather than treating a minor infection, does this make anyone *worse off*?
  *   **A.** Yes, the smiling woman in the bed loses a life she enjoys.
  *   **B.** No, she is not the same person who wrote the directive.
  *   **C.** No, a life without dignity is a harm, even if she cannot feel it.

  **2. If we ignore the directive and keep her alive, have we *wronged* anyone, and if so, whom?**
  *   **A.** Yes, the woman at sixty (her right to shape her life's end is violated).
  *   **B.** Yes, the woman at eighty-two (her current will to live is ignored).
  *   **C.** Yes, the public (trust in the institution of advance directives is eroded).

  **3. What gives the directive its force?**
  *   **A.** It is evidence of what the patient would choose now if she could.
  *   **B.** It is a command issued by a competent owner of the body.
  *   **C.** It is a rule required for the medical system to function.

  ### SECTION II: IDENTITY AND AUTHORITY
  *Question 4 must be answered before proceeding.*

  **4. Case (a):** The patient recognizes no one and remembers nothing of her past. Is the relationship between the woman at sixty and the woman at eighty-two more like:
  *   **A.** A parent and a child (two different people).
  *   **B.** One person aging (the same person over time).

  **5. (Only if you answered 4A):** If they are different people, does the sixty-year-old still have authority over the eighty-two-year-old's body?
  *   **A.** Yes, property rights and prior commands survive the change in personhood.
  *   **B.** No, authority ends when the psychological person ends.
  *(If you answered 4B, skip to Section III).*

  ### SECTION III: VIGNETTE TESTS
  *Answer these to refine your position.*

  **6. Case (c):** The directive rests on a belief she held at sixty—that advanced dementia is invariably agonizing and humiliating—which, in this patient, has turned out to be false. Do we follow it?
  *   **A.** Yes, her values matter more than her factual errors.
  *   **B.** No, the directive is void if the medical premise is false.

  **7. Case (e):** The directive's stated reason is not her own good but something expressive—she refused to be maintained as a spectacle for her grandchildren. She no longer knows them. Does this reason count?
  *   **A.** Yes, her life narrative and social meaning matter.
  *   **B.** No, only her current experience matters.

  **8. Does the patient's current ability to smile, hum, and accept food count as a "choice" to live, however rudimentary?**
  *   **A.** Yes, rudimentary valuing is sufficient to override a past document.
  *   **B.** No, choice requires understanding of death and consequences.

  **9. Case (d):** The directive was written before the existence of an intervention that could partially restore her cognition. Do we use it?
  *   **A.** Use it; she would have wanted to be well.
  *   **B.** Do not use it; she refused maintenance of this condition.

  **10. Case (g):** At sixty she expressly addressed the possibility of her own later dissent, asking that the directive stand whatever her demented self then seems to want. Do we obey?
  *   **A.** Yes, she anticipated this change and ruled it out.
  *   **B.** No, we must care for the person in front of us, not the ghost of the past.

  **11. Case (f):** The directive is written in a jurisdiction that permits a physician to act on a pre-dementia directive even if the patient physically resists at the time. Do we use this legal authority?
  *   **A.** Yes, the law protects the prior wish against temporary resistance.
  *   **B.** No, physical resistance is a current refusal of care.

  **12. Does the directive imply a judgment that lives lived with cognitive disability are not worth living?**
  *   **A.** Yes, and that is a discriminatory judgment we should not enforce.
  *   **B.** No, it is a personal preference about dignity and privacy.

  **13. Case (b):** Identical to Case (a), except that the patient is in evident untreated pain and cannot report it, so the directive and her present condition point the same way (toward limiting treatment). Do we follow it?
  *   **A.** Yes, both her past wish and current welfare align.
  *   **B.** Yes, but only because of the pain; in Case (a) we would not.

  ---

  ### FINDING YOUR LEAF
  *Match your answer pattern to the positions below.*

  | If your answers were mostly... | Your Position Leaf | Verdict on Draft Policy* |
  | :--- | :--- | :--- |
  | **1A, 2B, 7B, 8A** | **Present-Interests View** (Only the current subject's experience counts). <br> *Awkward Commitment:* Must ignore the past self's deeply held values even if they define her life. <br> *(Defender: Description only)* | **SUPPORTS** (Directive is void). |
  | **1C, 2A, 6A, 7A, 10A** | **Precedent-Autonomy View** (Protects integrity of a life rather than welfare of subject). <br> *Awkward Commitment:* Must override a contented patient to satisfy a past self's abstract dignity. <br> *(Defender: Ronald Dworkin)* | **REJECTS** (Directive stands). |
  | **3A, 6B, 9A** | **Substituted-Judgment View** (Directive has evidential rather than binding force). <br> *Awkward Commitment:* Directive becomes useless if medical facts change or were misunderstood. <br> *(Defender: Description only)* | **SUPPORTS** (Directive is void if evidence is flawed). |
  | **3C, 2C, 11A** | **Practice-Based View** (Force is an artifact of the institution that makes planning possible). <br> *Awkward Commitment:* Must honor directives even when they seem to harm the patient, to maintain system trust. <br> *(Defender: Description only)* | **REJECTS** (Directive stands to preserve practice). |
  | **12A** | **Disability-Critique View** (Directives express a devaluing judgment about lives with cognitive disability). <br> *Awkward Commitment:* Must potentially prolong life against the patient's prior explicit wishes to avoid stigma. <br> *(Defender: Description only)* | **SUPPORTS** (Directive is void as discriminatory). |
  | **8A, 2B** | **Retained-Capacity View** (Keyed to patient's capacity to value or have concerns, however rudimentary). <br> *Awkward Commitment:* Hard to define the threshold of "rudimentary" valuing consistently. <br> *(Defender: Description only)* | **SUPPORTS** (Directive is void by current valuing). |
  | **4A, 5B** | **Reductionist (Weakens)** (Psychological discontinuity breaks authority). <br> *Awkward Commitment:* Makes advance directives legally/morally impossible for dementia. <br> *(Defender: Description only)* | **SUPPORTS** (Directive is void). |
  | **4A, 5A** | **Reductionist (Strengthens)** (Discontinuity makes prior control necessary as there is no future self to consent). <br> *Awkward Commitment:* Treats the body as property separate from the person inhabiting it. <br> *(Defender: Description only)* | **REJECTS** (Directive stands). |

  *\*Draft Policy: "A directive is void where, at the time of the decision, the patient expresses contentment and a wish to continue living and shows no signs of distress, notwithstanding her lack of capacity."*

  ---

  ### APPENDIX I: LOGICAL SPACE MAPPING
  *Combinations of answers permitted by the tree but occupied by no named position.*

  1.  **Combination:** Practice-Based View (Q3=C) + Patient is Harmed (Q1=A).
      *   **Diagnosis:** **Incoherent.** A practice-based view justifies the directive by institutional stability, not patient welfare; claiming the patient is harmed while insisting the practice requires ignoring that harm creates a functional contradiction in clinical ethics.
  2.  **Combination:** Disability-Critique View (Q12=A) + Precedent-Autonomy on Expressive Grounds (Q7=A).
      *   **Diagnosis:** **Unattractive.** One cannot consistently argue the directive is discriminatory (Q12) while simultaneously upholding its expressive narrative value (Q7); the narrative value is the source of the discrimination.

  ### APPENDIX II: INDISTINGUISHABLE LEAVES
  *Pairs of positions this tree cannot separate in the "Happy Dementia" case.*

  *   **Pair:** **Present-Interests View** vs. **Retained-Capacity View**.
      *   **Why:** Both void the directive based on the patient's current state.
      *   **Separating Vignette:** **Case (b) (Painful Dementia).** If the patient is in pain but still shows rudimentary "valuing" (e.g., reaches for food), the Retained-Capacity view might still void the directive (valuing exists), while the Present-Interests view would follow the directive (suffering exists).
      *   **Realistic Case That Would Not:** **Case (a) (Happy Dementia).** In the absence of pain, both views converge on voiding the directive to allow life to continue.

  *   **Pair:** **Precedent-Autonomy View** vs. **Practice-Based View**.
      *   **Why:** Both uphold the directive in the standard case.
      *   **Separating Vignette:** **Case (f) (Legal/Resistant).** If the law allows override but the patient physically resists, the Practice-Based view follows the law (system rule), while the Precedent-Autonomy view might hesitate if physical resistance implies a revocation of the "command."
      *   **Realistic Case That Would Not:** **Case (a) (Happy Dementia).** Both views agree the directive should be followed despite current contentment.
