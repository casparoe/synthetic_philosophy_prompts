  I'm somehow taking a compilers course and running a Gödel, Escher, Bach reading group in the same semester, and the two have started colliding in a way that's driving me up the wall — specifically over the phrase "you can't pull yourself up by your own bootstraps." Three different people have said it to me in three weeks and I'm now pretty convinced none of them meant the same thing by it. First was in lecture: someone asked how a self-hosting compiler ever gets built if the compiler for language X is itself written in X, and the TA said something about that being impossible in principle, which is confusing because the whole course assumes it happens and apparently works. Second was in my group, where a guy used it to argue that Gödel's theorem proves minds aren't machines — his version was that a machine can't step outside its own rules to see its limits but we can, and when I pushed back he told me I was trying to lift the system by its own bootstraps. Third was somebody pointing at the print of Drawing Hands on my wall and saying that's a nice picture but it can't really be a closed loop, something has to be outside it.

  Can you lay out the distinct precise claims that one sentence could be standing in for? I want the whole menu, from the ones that are basically platitudes — something about conservation, something about a recursive definition needing a base case or the dependency relation being well-founded — through to the strong metaphysical sounding ones, and for each: is it true, is it false as stated, and does it actually support the job it was being asked to do in my three cases. I especially want to know whether there's *any* reading under which a self-hosting compiler or a quine is a genuine violation. My hunch is no, and that the real content of the proverb is about well-foundedness rather than about cycles being impossible, but I can't argue for that cleanly and I keep getting told that my hunch is itself the bootstraps fallacy.

  Then the Gödel one, which I think is the most confused of the three. Does the mind-vs-machine arguement need the first incompleteness theorem or the second, and does that matter? What exactly is "the system can't see its own limits" a claim about — unprovability from inside, or something about what an outside observer can spot — and is the human who recognizes the Gödel sentence as true really standing outside the system, or has he just moved into a bigger system that comes with its own sentence? Which brings me to the Drawing Hands point and what GEB keeps gesturing at with an inviolate level sitting underneath every tangled hierarchy: is that idea a way of rescuing the proverb, i.e. the loop only looks closed if you refuse to count the level that never gets touched? Also, and this may be irrelevant but I can't stop thinking about it — someone in my group claimed the phrase originally meant the opposite of how it's used now, that it started out as a picture of absurdity rather than of self-reliance, something about a baron and a swamp. If that's right, does it change which of the readings should count as the default one?
