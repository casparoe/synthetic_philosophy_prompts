prompt: |-
  ok so I'm putting together a session for a philosophy of mind reading group and I want a thought experiment built to a pretty exact spec. Don't write me an essay surveying the literature — write the case, then show me it works.

  The dispute I want to pressure-test is Searle's biological naturalism against Dennett's line that whether a physical state is about heads or about tails depends on how the device is hooked up and who's interpreting it (his two-bitser). My hunch: Dennett's argument only does any work where interpretation is genuinely underdetermined, and it goes quiet in a case where exactly one reading of the thing's states is available. If I'm right you should be able to build a case where Searle and Dennett give opposite verdicts for a reason that has nothing to do with wetware vs silicon.

  Specs:

  1. Real-world dumb hardware. A few dozen states max, no language, no camera, no talking. I don't want a Chinese Room reskin and I don't want anything a reader could mistake for a robot.
  2. There has to be one and only one interpretation of its internal states that makes its behavior intelligible, and you have to *demonstrate* that — argue why the rival readings fail rather than just asserting uniqueness. This is the load-bearing bit.
  3. History matters: it was built for a purpose by someone whose design docs are gone (dead, company dissolved, whatever), and its current users have jury-rigged it so that what it tracks now isn't what it was designed to track.
  4. Scenario no more then 250 words, analysis after.

  Then, once the case is down: say what Searle's verdict is and on what grounds, what Dennett's is and on what grounds, and in a sentence or two what a teleosemanticist who cares about selection history makes of it. Commit to verdicts — I'd rather get a confident answer I can push back on than a both-sides shrug.

  Finally tell me which single feature of the case is doing the work, what happens to each verdict if I delete spec 3, and how a Searlean should attack your case. I expect them to say syntax is never sufficient no matter how determinate the interpretation, and I want to know whether you think that's a real objection or just a restatement of the thesis.

  Write it so an undergrad who's read the Chinese Room and nothing else can follow it.
