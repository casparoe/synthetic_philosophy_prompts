      *   *The Problem:* In DCD, auto-resuscitation is possible (though rare after a certain window). If circulation *could* be restored, is the person dead? If they are dead, why can't we restart the heart? If they aren't dead, taking organs violates DDR.
      *   *Resolution Strategy:* Most accounts rely on *permanence* rather than *irreversibility* in the moment. "Irreversible" means cannot be restarted. "Permanent" means will not be restarted (by choice/physics). DCD relies on permanence. DDR relies on death. So, death must be defined such that permanent loss of function counts, even if physical reversibility remains theoretically possible.

