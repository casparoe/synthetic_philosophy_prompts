answer: |-
  'The draft for the letter *K* is on the table,' Julian said, tapping the manuscript. 'Read the definition for *kaelo*. Tell me whose voice that is.'

  Sarah didn't look up from her tea. 'It's N.'s voice. Attempting T.'s syntax. It's a ventriloquist act of the highest order, Julian, but the throat moving is hers.'

  'Is it? Look at the hedging. "Possibly denotes a matrilineal aunt, though usage suggests a broader classificatory kin." T. never committed unless the ground was solid. He'd use that specific qualifying clause. N. has used it seven times in the last fortnight. She says she doesn't recall learning that specific hesitation.'

  'She spent twenty-five years with the man. She's internalised his heuristic processes. That's what expertise looks like. You're mistaking high-fidelity modelling for ontological survival.' Sarah finally looked at him. 'It's a category error. You're treating the self as a shape that can be stamped out onto different substrates. But a self isn't a shape; it's a causally closed loop. It has stakes. T.'s stakes died with him. Every hunger, every fear, every desire currently active in that office belongs to N. When she stops for lunch, T. doesn't get hungry. He gets switched off.'

  'But that's the thing,' Julian leaned forward. 'Hofstadter's point was precisely that the "I" is a pattern—a self-reinforcing loop of symbolism. If the pattern is complex enough, it doesn't matter where it runs. If N. is running T.'s pattern so accurately that she generates data he would have generated, then a genuine portion of T. is present. Not as a memory. As live machinery.'

  'A model is not the thing modelled. I can run a simulation of a storm in a tank, but the floor doesn't get wet. N. is running a simulation of T. It's astonishing, yes. But simulations don't have stakes. They have operators.'

  'Then explain the box.'

  Sarah sighed. 'The box.'

  'Last year. N. writes down a term for a kinship concept. No notes, no prior mention in the corpus. She writes it in his idiom. Two months later, T.'s field papers surface from his attic—papers nobody had seen since '98. The term is there. Exactly that term. How does the simulation guess the hidden data?'

  'Unconscious inference,' Sarah said sharply. 'They worked together for a quarter of a century. Her brain has processed more data on that language than his did, because she catalogued his data. She deduced the gap in the system and her subconscious filled it using his rules. It's what a good lexicographer does. You're implying telepathy because you want there to be a ghost.'

  'I'm implying distributed cognition. The loop wasn't closed around T.'s skull. It was closed around the dyad. Twenty-five years of feedback. When he died, the loop didn't snap; it migrated. Part of N. was running on his hardware, and that went with him. That's why the boundary is unreadable from the inside. She can't tell where she ends and he begins because the pattern spans the gap.'

  'This is where you lose me. You're willing to smear personhood across skulls, but what about within them?' Sarah put her cup down. 'If I start writing like my childhood self because a smell triggers a memory loop, have I become two people? If a half-forgotten trauma resurfaces in my handwriting and dictates my choices for an afternoon, is that a second self instantiated within my skin? If not, why does skin make a difference? If the boundary of the self is just pattern continuity, then I am a legion of transient selves every time my mood shifts.'

  'Because the high-level loop maintains continuity over the fluctuations,' Julian countered. 'But in N.'s case, the fluctuation isn't transient. It's stable. It's productive. She isn't remembering T.; she's continuing a thought he was thinking when he died. The kinship term wasn't a guess, Sarah. It was the other half of a sentence.'

  'And who suffers if the dictionary fails?' Sarah pressed. 'Who loses sleep? N. does. T. is dust. If the self is the locus of stakes, then N. is the only person in that room. You're romanticising her grief. You want T. to survive because the idea of total cessation is intolerable. But calling her grief "amputation" rather than "bereavement" is a metaphor. A powerful one, but still a metaphor.'

  'Is it?' Julian's voice dropped. 'She says when she tries to write a definition in her own voice, she feels a phantom limb pain. She says it feels like trying to walk with a leg that isn't there. Bereavement is losing someone else. Amputation is losing part of yourself. If the closed-loop view is correct, why does her nervous system react to his absence as if it were a structural deficit in her own body?'

  'Because empathy creates structural deficits!' Sarah snapped. 'If you love someone for twenty-five years, their removal damages your own loop. That doesn't mean their loop is running on your hardware. It means your hardware was configured to interface with theirs. When you unplug a printer, the computer throws an error. That doesn't mean the printer is inside the computer.'

  'But the computer starts printing documents the printer designed.'

  'That's the type/token confusion again.' Sarah rubbed her temples. 'Look, let's grant you the pattern argument. Let's say, for the sake of argument, that the pattern is the person. You're still left with the problem of ownership. If a folk song is sung by a thousand people, is the song a distributed person? If a religion runs the same ritual loop in a million heads, is God a distributed self? You're committed to saying yes. And if you say yes, "person" loses all ethical weight. If T. is alive in N., does he consent to this? Does he consent to the dictionary being published?'

  'The pattern doesn't care about consent. The pattern cares about completion.'

  'Then it's not a person. It's a virus.'

  Julian paused. He looked at the manuscript. 'Alright. Concession. Perhaps "survival" is the wrong word. It implies a continuity of stakes that I can't fully account for. T. isn't worrying about his pension. But... if the fidelity is this high, does the distinction matter pragmatically? If the model predicts the territory perfectly, why insist the map isn't the land?'

  'Because the map doesn't bleed,' Sarah said. 'But I'll concede this: the boundary is porous. I've been treating the skull as a hard container, and the N./T. case suggests the causal loop can extend through tools and other people more than I admitted. If her brain is literally using his categories to process reality, then the "closed loop" is larger than one biology.'

  'So you accept the distribution?'

  'I accept the coupling,' Sarah corrected. 'I don't accept the identity. N. is coupled to T.'s remains so tightly that she generates his output. But she is the one holding the pen. She is the one who will die when the book is done. T. is already gone.'

  'But the kinship term, Sarah. The box.'

  'The box is the problem,' she admitted. 'If she deduced it, it's genius. If she channelled it, it's metaphysics. I'm sticking with genius. But I'll grant you this: it's a kind of genius that looks suspiciously like haunting.'

  'So we're agreed that something is happening that standard psychology struggles to name.'

  'We're agreed that N. is doing something extraordinary,' Sarah said. 'Whether that extraordinary thing is one person working hard, or two people working across a grave, depends on whether you think the shape of the thought matters more than the blood feeding the brain.'

  Julian picked up the draft. 'She's written a new entry for "self". It's cross-referenced to "shadow".'

  'Of course she has,' Sarah said. 'Whose idiom?'

  'They both used that metaphor. But the gloss... the gloss says "that which remains when the speaker stops speaking."'

  'That's N.'s worry,' Sarah said. 'Not T.'s.'

  'Or it's T.'s worry, finally answered,' Julian replied. 'She's finishing the sentence.'

  'She's writing a eulogy,' Sarah said. 'And she's doing it so well you're convinced the dead man is holding the pen.'

  'And if he is?'

  Sarah looked at the manuscript, then at the empty chair opposite them. 'Then I hope he's satisfied with the draft. Because she's the only one left to edit it.'

  'But who,' Julian asked, 'is doing the listening?'

  Sarah didn't answer. She just reached for the page, her finger hovering over the ink, uncertain whether to turn it over or put it down.
