answer: |-
  This is a sharp, well-constructed argument. You have effectively reconstructed a **Sorites Paradox applied to deontic categories**, and you are right to sense that it puts significant pressure on the coherence of supererogation. In the literature, this is often referred to as a **"Collapse Argument"** against supererogation (arguing that the category collapses into obligation or prohibition under scrutiny).

  Your study group is likely resisting not because they are stubborn, but because your argument relies on a specific axiological premise that non-consequentialists reject. However, for the purposes of a 4,000-word paper, you have a very strong engine here.

  Here is a breakdown of the argument's lineage, the "second horn" you might be missing, and the specific weak link you should target in your middle section.

  ### 1. Does this argument have a name?
  It doesn't have a single proprietary name like "The Trolley Problem," but it is a recognized move in meta-ethics. It is best described as a **Sorites Challenge to the Supererogatory/Ordinary Distinction**.

  It is closely related to the **Demandingness Objection** to consequentialism, but you are flipping it. Usually, critics say consequentialism is *too* demanding because it eliminates supererogation. You are arguing that *if* we accept basic moral intuitions (the Button Case), we are forced to accept consequentialism's demandingness, thereby eliminating supererogation.

  Key figures who discuss this dynamic include **David Heyd** (who defends supererogation against this reduction) and **Julian Nida-Rümelin**. Your argument also echoes **Peter Singer's** logic in *Famine, Affluence, and Morality*, but you have tightened it by removing the "distance" variable and focusing purely on the "cost" continuum.

  ### 2. Is there a second horn you aren't seeing?
  You present a dilemma:
  1.  **The Bullet:** Admit the Button case is supererogatory (implausible).
  2.  **The Cutoff:** Insist there is a sharp line where cost becomes obligation (arbitrary).

  There is a third option, which is the standard philosophical escape route for Sorites paradoxes: **Vagueness.**

  **The Vagueness Reply:**
  Your study group can argue that deontic categories (like "obligatory," "permissible," "supererogatory") are **inherently vague concepts**, much like "bald," "tall," or "heap."
  *   We agree there are bald people and hairy people.
  *   We agree there is no single hair whose removal turns a hairy person into a bald person.
  *   We do *not* conclude that "baldness" is not a real category or that everyone is either fully hairy or fully bald.

  If they take this horn, they concede that there is no *principled, precise* place to stop the dial, but they deny that this eliminates the category. They would argue that the lack of a sharp boundary is a feature of moral language, not a bug in moral reality. To defeat this, you would need to argue that deontic status requires precision in a way that descriptive predicates (like "bald") do not (e.g., because blame and punishment hinge on it).

  ### 3. Which defense is the weakest link?
  You asked which standard defense of supererogation is the weakest and should be the target of your middle section.

  **The Weakest Link: The "Threshold of Sacrifice" Defense.**
  This is the view that supererogation is defined by acts that exceed a specific quantifiable level of cost or sacrifice.
  *   **Why it's weak:** It is exactly what your dial argument destroys. If a defender says, "An act is supererogatory if it costs more than 10% of your income," you simply ask why 10.1% is supererogatory but 9.9% is obligatory.
  *   **How to attack it:** Devote your middle section to showing that any attempt to define supererogation via a **cost-threshold** leads to arbitrariness. Use your dial. If they propose a threshold, show that a one-cent difference cannot morally transform an act from forbidden to obligatory. This forces them off the "Threshold" defense and onto weaker ground.

  ### 4. The Strongest Reply (The one you must steelman)
  If you want a high grade, you cannot just knock down the weak threshold defense. You must anticipate the strongest reply your study group *should* be making, even if they aren't articulating it well.

  **The Strongest Reply: Agent-Centered Prerogatives (Samuel Scheffler).**
  In *The Rejection of Consequentialism*, Scheffler argues that agents are permitted to give *some* extra weight to their own interests, not because of a cost-benefit analysis, but because of the **separateness of persons**.
  *   **The Counter to your Dial:** The "dial" measures *cost*. But obligation isn't determined by cost alone; it's determined by **Cost vs. Prerogative**.
  *   **The Argument:** I have a prerogative to not donate a kidney, not because the cost is "too high" in utilitarian terms, but because I am allowed to value my bodily integrity disproportionately. In the Button case, the cost is zero, so the prerogative doesn't trigger (there is no interest being sacrificed). In the Kidney case, the prerogative triggers.
  *   **Why it blocks your argument:** It breaks the continuity of the dial. The dial assumes a linear slide from "Kidney" to "Button." The Prerogative view says there is a **discontinuity**. At some point, the act infringes on a protected sphere of agency (bodily integrity, deep projects) where cost calculations no longer apply.

  **Another Strong Reply: Satisficing Consequentialism (Michael Slote).**
  Slote argues that morality requires doing *good enough*, not *the best*.
  *   **The Button:** Pressing it is "good enough" (actually, it's optimal with zero cost), so it's required.
  *   **The Kidney:** Donating is "better than good enough," so it's supererogatory.
  *   **The Cutoff:** The cutoff isn't a cost line; it's the **satisficing threshold**. This avoids the arbitrariness charge by anchoring the cutoff in the definition of moral adequacy rather than a specific cost metric.

  ### 5. Strategic Advice for the Paper
  You have 4,000 words. You cannot prove supererogation doesn't exist (philosophers have fought over this for 50 years). However, you can prove that **cost-based defenses of supererogation are incoherent.**

  **Suggested Structure:**
  1.  **Introduction (500 words):** Define supererogation (Urmson). State your thesis: Supererogation is not a distinct deontic category but an epistemic placeholder for acts with indeterminate costs.
  2.  **The Dial Argument (1,000 words):** Lay out your Sorites. The Kidney vs. The Button. Establish the intuition that the Button is obligatory. Establish the continuity of cost.
  3.  **The Target: The Threshold Defense (1,000 words):** This is your middle section. Attack the idea that we can set a cost limit. Show that any specific limit is arbitrary. This is where you crush the "weakest link."
  4.  **Anticipating the Best Reply (1,000 words):** Address **Vagueness** and **Agent-Centered Prerogatives**.
      *   *Against Vagueness:* Argue that while "baldness" can be vague, *blameworthiness* (which attaches to obligation) cannot be. If I don't press the Button, I am a monster. If I don't donate the Kidney, I am not. There must be a fact of the matter about where the monster-status begins.
      *   *Against Prerogatives:* Argue that prerogatives themselves seem to rely on cost. Why do I have a prerogative to keep my kidney but not my afternoon? Because the kidney cost is higher. If cost drives the prerogative, the dial returns.
  5.  **Conclusion (500 words):** Conclude that while we may keep the *word* "supererogatory" for psychological comfort, it does no deontic work. Everything is either required or forbidden; we just don't always know which.

  ### 6. A Potential Flaw in Your Premise (Be Careful)
  You write: *"Every candidate for a supererogatory act gets its status from the cost to the agent."*

  This is your most vulnerable sentence. A Kantian or Virtue Ethicist will say: **"No. An act is supererogatory because of the *motive* or the *excellence* displayed, not just the cost."**
  *   *Example:* If I save a child from a burning building because I want the reward money, it cost me a lot, but it's not morally praiseworthy in the same way.
  *   *Example:* If I donate a kidney to a stranger out of duty (because I think it's required), it's not supererogatory.

  **Fix:** Qualify your claim. You aren't arguing that cost is the *only* feature of supererogation, but that cost is the **necessary condition** for the *deontic status* (obligatory vs. optional). Even if motive matters for praise, *cost* is what determines whether I am *blamed* for not doing it. Stick to the deontic status (obligation), not the aretaic status (virtue).

  ### Summary
  *   **Argument Name:** Sorites/Collapse Argument against Supererogation.
  *   **Weakest Link to Attack:** The **Cost-Threshold Defense** (the idea that there is a specific amount of sacrifice that marks the boundary).
  *   **Strongest Counter-Argument to Address:** **Agent-Centered Prerogatives** (Scheffler) or **Vagueness**.
  *   **Verdict:** You aren't missing an obvious reply, but your study group is likely gesturing toward Agent-Centered Prerogatives without naming them. If you address Scheffler and show why his prerogative still relies on a cost-assessment that succumbs to your dial, you will have a very strong paper.

  Your intuition is correct: The "Button" case is the Achilles' heel of supererogation. If they admit the Button is obligatory, they have to explain why the slide from Button to Kidney doesn't drag obligation up with it. Good luck.
