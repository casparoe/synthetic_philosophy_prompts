prompt: |-
  Nyāya treats testimony (śabda) as an irreducible pramāṇa in its own right, and characterizes it as the statement of an āpta — a trustworthy source, one who knows the matter directly and intends to convey it as known. Construct one detailed example in which a person comes to know something on the basis of a language model's output — a diagnostic assistant, a translation system, a document-summarizing agent, or something you design yourself — and work through whether the āpta condition is met, met only by stretching it, or beside the point. The example should be concrete enough that we can identify which features of the situation are doing the epistemic work: the system's reliability, the knowledge of its designers and sources, the user's ability to check the output, and whatever passes for intention on the system's part. Then say what the case suggests about whether āptatva is load-bearing in the Nyāya account or a placeholder that reliability plus something further could replace — and, if you think the verdict could go either way, name the precise detail about the system that would settle it.
