prompt: |-
  I'm the training lead for a volunteer mountain rescue unit — about 40 callouts a season, and in the high season we have exactly one contracted helicopter and one ground crew, so a few times every summer two calls land on the duty officer at once. Our written SOP right now just says send the aircraft to whichever party has more people in it, and over the last year I've gotten convinced by Taurek that that isnt automatically right: five deaths aren't a bigger loss than one death in the way the SOP assumes, and something like a coin toss is what you owe people when the stakes per person are comparable. Trouble is I have to hand this to volunteers at 2am on a radio who've never read the paper and shouldn't have to.

  So write me the decision procedure itself. Questions in order, what counts as a sufficient answer to each, where it terminates in a definite go, where it forces a lottery and exactly how that lottery gets run with what's in the truck, and where it hands the call back to a human because the remaining question is about values and not facts.

  It has to settle one thing I can't. An officer of mine pointed out that a single toss between a party of one and a party of five gives the five a 50 percent shot between them and 10 percent each, while the solo climber gets 50 percent — which does not look anything like giving each person an equal chance. So does the procedure flip once between groups, flip once per person, or weight by group size, and which of those is actually what Taurek's view commits you to rather than something he'd reject? I need the reasoning, not just a pick.

  Also build in: the case where there's no time and no coin because the ceiling drops in fifteen minutes; groups that differ in kind rather than number, say five hikers with a sprained ankle and a walkout available at first light versus one hypothermic climber with hours; and whether any of this survives if the resource turns out to be divisible, since the aircraft can do two short-haul drops if weather holds.

  Then run it on two calls, and make one of them a case where the procedure tells me to leave the larger party — I'll hate it and the county will hate it — including what the duty officer writes in the log so the decision survives review afterward. Mark every step that's really a judgment call wearing a checklist costume, and say plainly what a procedure like this can't do.

  Hard cap of 900 words, worked examples included, American English. And since most of this rests on what Taurek's position actually obliges you to, tell me how confident you are in each claim you make about his view, and single out the one point you're least sure of.
