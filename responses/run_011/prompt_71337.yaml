  **WORKED EXAMPLES**
  **Case 1 (The Hard Case):** Party Alpha (5 hikers, stable); Party Beta (1 climber, stable). Heli capacity: 1 group.
  *   **Flow:** Q1 No. Q2 No. Q3 Yes. Q4 Lottery (1-6). Roll: 6 (Beta).
  *   **Decision:** Deploy to Beta. Leave Alpha.
  *   **Log Entry:** "0200 HRS. SIMULTANEOUS CALLS. ALPHA (5P), BETA (1P). MEDICAL STATUS EQUAL. RESOURCE INDIVISIBLE. SOP §4 EXECUTED. WEIGHTED LOTTERY (1-6) ROLLED VIA DUTY DICE. RESULT: BETA. ALPHA ADVISED ETA FIRST LIGHT. DECISION BASED ON EQUAL-CHANCE PROTOCOL."
      *   *Review Survival:* The log proves procedural fidelity, which is the only defense against negligence claims when outcomes are bad.

  **Case 2 (Triage):** Party Gamma (5 hikers, sprains); Party Delta (1 climber, hypothermia).
  *   **Flow:** Q2 Yes. Delta prioritized.
  *   **Decision:** Deploy to Delta.

  **LIMITATIONS & CONFIDENCE**
  **Judgment Calls:** Steps 1 and 2 appear objective but rely on imperfect radio data. Step 3 (Time) is the most fragile; "10 minutes" is an estimate under stress.
  **What This Can't Do:** It cannot eliminate moral regret. Saving one over five feels wrong even if procedurally just. It cannot convince the abandoned party they were valued equally; it only ensures they were *chanced* equally. It also cannot account for secondary consequences (e.g., if the five are parents and the one is single), as those are value judgments outside the SOP.
  **Taurek Confidence Ratings:**
  1.  **Claim:** Taurek rejects aggregating harm (5 deaths > 1 death). **Confidence: 95%.** This is the core thesis of "Should the Numbers Count?"
  2.  **Claim:** Taurek requires equal concern per person. **Confidence: 90%.** He explicitly argues against favoring individuals without reason.
  3.  **Claim:** Taurek mandates weighted lotteries over coin tosses. **Confidence: 70% (Least Sure).** *Reasoning:* While weighted lotteries achieve equal individual chance, Taurek sometimes suggests a simple coin toss to avoid comparing numbers entirely. I prioritize the "equal chance" implication over the "no comparison" heuristic, but scholars debate this.
