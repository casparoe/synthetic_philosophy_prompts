answer: |-
  Here is a principle precise enough for a fact-checker, derived from the topology of your verdicts. I call it **The Principle of Convergent Exclusion**.

  It is designed to capture why you accept the supernovae (Case 6) but reject the card-guessing (Case 4), while honestly addressing where your intuition about anecdotes (Case 1) is leading you astray.

  ### The Principle of Convergent Exclusion

  **A claim requiring a revision of established physical or causal laws is warranted only if it satisfies four cumulative clauses:**

  1.  **Positive Exclusion:** Normal explanations must be positively ruled out by the experimental design, not merely remain unidentified after the fact.
  2.  **Methodological Independence:** The result must be replicable across causally independent methodologies, not just independent instances of the same methodology.
  3.  **Characterized Error:** The pathway for potential error must be physically quantifiable and subject to an external error budget.
  4.  **Conservation of Coherence:** The new claim must inflict less damage on the existing web of high-certainty beliefs than the alternative (that the data is flawed).

  ---

  ### Clause Breakdown & Case Mapping

  **Clause 1: Positive Exclusion**
  *   **What it does:** It distinguishes between "we don't know how she did it" and "we know she couldn't have done it normally." It shifts the burden from the skeptic (find the trick) to the claimant (prove the trick impossible).
  *   **Case that forced it in:** **Case 3 (The Medium).** You noted this "barely moves" you despite no info route being found. This clause codifies that intuition. Absence of evidence for fraud is not evidence for psi.
  *   **Verdict it overrules:** None of your stated verdicts, but it solidifies your hesitation on Case 3.

  **Clause 2: Methodological Independence**
  *   **What it does:** It demands that the phenomenon survive different *ways* of looking. It prevents a systemic blind spot in one method (e.g., human memory, or a specific lab setup) from masquerading as a discovery.
  *   **Case that forced it in:** **Case 6 (Supernovae).** You accepted this because it wasn't just one team; it was two competing teams, later confirmed by CMB and BAO data (different methods). Contrast this with **Case 1 (Drowning Brother)**. While "collected independently," every data point relies on the same flawed instrument: human memory and coincidence assessment.
  *   **Verdict it overrules:** **Case 1.** You said two dozen screened anecdotes make you "lean toward something being there." A fact-checker applying this principle must reject that. Twenty-four observations using the same broken ruler do not make a measurement. They make a pattern of error.

  **Clause 3: Characterized Error**
  *   **What it does:** It requires that we know *how* the result could be wrong in a way that allows us to check for it.
  *   **Case that forced it in:** **Case 5 (Neutrinos) vs. Case 4 (Card Guessing).** In Case 5, you assumed a flaw and were right (a loose cable). That is a physical, checkable error. In Case 4, "a flaw I can't see" is often a placeholder for "experimenter effect" or "selection bias," which are harder to quantify. You trusted the physics error budget more than the psi error budget.
  *   **Verdict it overrules:** None. This matches your intuition perfectly.

  **Clause 4: Conservation of Coherence**
  *   **What it does:** It applies a Bayesian cost function. If Claim A requires discarding causality, and Claim B requires discarding a specific measurement, prefer Claim B unless Claim A is supported by overwhelming convergent evidence.
  *   **Case that forced it in:** **Case 6 vs. Case 4.** Both rewrite physics. But Case 6 (Dark Energy) adds a term to Einstein's equations. Case 4 (Psi) generally requires violating causality or conservation of energy. Case 6 is a cheaper theoretical upgrade.
  *   **Verdict it overrules:** None. This explains why the supernova data felt "acceptably strange" while the card data felt "impossibly strange."

  ---

  ### Application to Open Cases

  **1. A well-designed psi study nobody can replicate.**
  *   **Verdict:** **Reject.**
  *   **Reasoning:** This fails **Clause 2 (Methodological Independence)**. A single result, however significant, is a singularity. In physics, a result that cannot be replicated by a competing team using the same apparatus is treated as a systematic error until proven otherwise.
  *   **Confidence Drop:** Your confidence in the original should drop to near zero. The inability to replicate suggests the original significance was a statistical fluctuation or an uncharacterized local variable (violating **Clause 3**).

  **2. Sidgwick's Census (17,000 self-reports).**
  *   **Verdict:** **Reject as evidence for psi.**
  *   **Reasoning:** This fails **Clause 1 (Positive Exclusion)** and **Clause 2**. The census established a *rate* of reporting, not a rate of *occurrence*. It could not distinguish between veridical apparitions and coincidental memories solidified after the fact. Sidgwick himself was disappointed by this; he wanted a control group to establish the base rate of "false hits," which the census lacked.
  *   **Should it have moved him?** No. It moved him to recognize a *phenomenon of belief*, not a *phenomenon of physics*. A fact-checker would file this under sociology, not psychical research.

  ---

  ### The Blunt Truth: 1998 vs. Psi

  You asked whether the difference between your acceptance of the 1998 supernova data and your rejection of psi data is a real asymmetry in the evidence or just your prejudices wearing a lab coat.

  **It is prejudice. But it is rational prejudice.**

  Here is the uncomfortable part: Statistically, a 5-sigma result in a psi lab and a 5-sigma result in a cosmology survey carry the same mathematical weight. If you treat them purely as numbers, your asymmetry is bias.

  However, you are not evaluating numbers; you are evaluating **ecosystems of verification**.

  1.  **Adversarial Collaboration:** The 1998 result came from two teams (Perlmutter's Supernova Cosmology Project and Schmidt/Riess's High-Z Team) who were *trying* to prove each other wrong. They were competing for the same Nobel. In psi research, replication is often cooperative or insular. When a skeptic tries to replicate psi, the result usually vanishes (the "decline effect"). When a skeptic checked the supernova data, the acceleration remained.
  2.  **The "Cable" Test:** In physics, when a result contradicts theory, we find the cable (Case 5). We know what a broken cable looks like. In psi, when a result contradicts theory, the "flaw" is often attributed to the skeptic's "negative vibes" or subtle, unquantifiable protocol leaks. Your principle's **Clause 3 (Characterized Error)** captures this. You trust the field that admits it can be wrong about a cable more than the field that claims error is psychological.
  3.  **Theoretical Cost:** Accepting Dark Energy requires adding a constant ($\Lambda$) to gravity. Accepting Psi usually requires removing the barrier between mind and matter, or cause and effect. The former is a renovation; the latter is a demolition. Your **Clause 4** recognizes that it is more likely two teams of cosmologists missed a calibration error than that the laws of thermodynamics are porous to human intention.

  **Conclusion:**
  Your verdicts are consistent, provided you admit that **Case 1 (Anecdotes)** is the outlier. You are willing to be moved by cumulative anecdotes in a way that strict science does not permit. That is a human response, not a scientific one.

  If you hand the **Convergent Exclusion Principle** to a fact-checker, she will validate your skepticism on the lab studies and the census. She will also tell you to stop leaning on the drowning brother stories. They are compelling literature, but they are not evidence. Sidgwick knew this; that is why he moved from the census to controlled experiments. You should too.
