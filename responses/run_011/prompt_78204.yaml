          *   Must treat state legislative override as an input, not an embarrassment.
          *   Must include specific distinctions (same vs. successors, type of threat, self-releasing vs. entrenched, enforcement).
          *   Must include a specific question about what the future board will argue when trying to exit.
          *   Must include a menu of weaker instruments.
          *   Must explain which distinctions were kept/dropped and why.
          *   Must apply the procedure to three specific live proposals (one must go against board desire).
          *   Must include two paragraphs of self-criticism (hardest questions, what would change mind, constraints doing illegitimate work, limitations of the procedure).
      *   **Tone:** Professional, legalistic but accessible, theoretically grounded, pragmatic.

  2.  **Drafting the Decision Procedure (The "Ulysses Protocol"):**

      *   *Goal:* A flowchart-like list of questions with pass/fail criteria.
      *   *Theoretical Basis:* Jon Elster's *Ulysses and the Sirens*. Key concepts: Time inconsistency, weakness of will vs. preference change, irreversibility, cost of reversal.
      *   *Structure:*
          1.  Identify the Threat (Weakness of Will vs. Preference Change).
          2.  Identify the Binding Target (Self vs. Successors).
          3.  Identify the Enforcement/Reversibility (Can they vote it away?).
          4.  The "Future Board" Test (What will they say?).
          5.  Legislative Reality Check.
          6.  Weaker Alternatives Menu.
      *   *Distinctions to Address:*
          *   *Kept:* Weakness of will vs. preference change (Crucial for Elster). Same decision-makers vs. successors (Crucial for democratic legitimacy). Self-releasing vs. entrenched (Crucial for enforceability).
          *   *Dropped:* Deep metaphysical debate on "dead hand" (Too abstract for 45 mins). Complex economic modeling of debt (Too technical for junior counsel without data).
          *   *Why:* Practicality and focus on the *legal/political* mechanism of precommitment.
      *   *The "Future Board" Question:* This needs to be the pivot point. If the future board has a legitimate "changed circumstances" argument, the lock is dangerous.

  3.  **Applying the Procedure to the Three Proposals:**

      *   *Proposal 1 (Bond/Tax Lock):*
          *   *Threat:* Fiscal indiscipline/weakness of will (diverting funds).
          *   *Target:* Successors.
          *   *Enforcement:* Market discipline (rating agencies) + Legal covenant.
          *   *Future Board Argument:* "We need the money for operations."
          *   *Verdict:* **Entrench (Standard Form).** This is classic debt service. The "weakness of will" is the temptation to raid the sink fund. The market demands it.
      *   *Proposal 2 (Fare-Free Lock):*
          *   *Threat:* Future board reversing policy due to fiscal pressure (Preference Change/Circumstance, not Weakness of Will).
          *   *Target:* Successors.
          *   *Enforcement:* Supermajority + Referendum.
          *   *Future Board Argument:* "We are insolvent."
          *   *Verdict:* **Do Not Entrench.** This violates the core Elsterian principle. It binds successors based on *policy preference*, not *procedural restraint*. It assumes current preference is superior to future necessity. It risks insolvency. *This goes against the board's 7-2 desire.*
      *   *Proposal 3 (Land Use Covenant):*
          *   *Threat:* Future board approving dense housing (Preference Change).
          *   *Target:* Successors.
          *   *Enforcement:* Interlocal agreement (Contract).
          *   *Future Board Argument:* "Housing crisis requires density."
          *   *Verdict:* **Entrench in Weaker Form.** A permanent ban is too rigid for housing needs. Use a "delay" or "consultation" requirement instead of a flat prohibition. Or sunset.

  4.  **Drafting the Self-Criticism:**

      *   *Hardest Questions:* Distinguishing "weakness of will" from "reasonable preference change." Predicting the "Future Board's Argument."
      *   *What would change mind on Proposal 2:* If there were a dedicated revenue source *guaranteed* for the 10 years (making it fiscally neutral), the insolvency risk drops.
      *   *Illegitimate Constraint:* The 45-minute limit. It forces heuristic shortcuts that might miss nuance in complex land-use deals.
      *   *Limitations:* Cannot handle constitutional questions or federal preemption. Cannot predict black swan events (pandemics).

