answer: |-
  # Project Specification: Retrospective Confirmation (RC)

  **Document Status:** Draft for Review
  **Objective:** Establish acceptance criteria for accounts of confirmation by old evidence prior to evaluation of specific proposals (Bayesian vs. Machine Learning).

  ## 1. Requirements List

  **1.1. The Arithmetic Resolution**
  *   **Requirement:** The account must specify a mathematical or operational mechanism by which $P(H)$ increases given $E$, even when the agent's representation of $E$ satisfies the condition of "known truth" prior to the introduction of $H$. It must explicitly state which variable in the standard conditionalization equation $P(H|E) = P(H \cap E) / P(E)$ is permitted to vary or be reinterpreted.
  *   **Case:** An astronomer knows the perihelion shift of Mercury ($E$) with certainty ($P(E)=1$). General Relativity ($H$) is proposed. The account must show how $P(H)$ rises upon learning $H$ entails $E$, without violating the axiom that $P(E|E)=1$.
  *   **Verdict:** **Non-Negotiable.** (Confidence: High). Without this, the account describes a static logical relation, not a dynamic confirmation event. This is the definition of the problem space.

  **1.2. The Continuum of Oldness**
  *   **Requirement:** The account must define a threshold or continuous function for "oldness" that distinguishes between evidence known with certainty, evidence held in a retrievable dataset, and evidence forgotten but recoverable. It must state whether the magnitude of confirmation scales with the epistemic accessibility of $E$ at the time $H$ is proposed.
  *   **Case:** Scientist A has the anomaly table memorized. Scientist B has the table in an unqueried archive. Scientist C has forgotten the table but recalls it exists. If $H$ explains the table, does $H$ receive equal confirmation for A, B, and C?
  *   **Verdict:** **Non-Negotiable.** (Confidence: Medium). An account that treats "old" as a binary switch fails to model scientific practice where the *surprise* of the connection varies with the agent's access to $E$.

  **1.3. Defeasibility of Evidence**
  *   **Requirement:** The account must include a reversal condition. If $E$ is subsequently demonstrated to be false or erroneous (e.g., instrument calibration error), the confirmation value assigned to $H$ based on $E$ must reduce to zero or negative.
  *   **Case:** The orbital anomaly is re-measured by a superior telescope and found to be a data artifact. The theory $H$ that "explained" the artifact must lose the support it gained from that explanation.
  *   **Verdict:** **Non-Negotiable.** (Confidence: High). Confirmation tracks truth-conduciveness. Support derived from falsehoods is not confirmation; it is coincidence.

  **1.4. Idempotency of Explanation (No Repeat Milking)**
  *   **Requirement:** The account must ensure that re-stating the entailment relation between $H$ and $E$, or expressing it in different formalisms, yields zero additional confirmation after the initial update.
  *   **Case:** A theorist shows $H$ entails $E$. A colleague verifies the proof. A third translates the proof into a different notation. The total confirmation boost for $H$ must not exceed the boost from the first successful derivation.
  *   **Verdict:** **Non-Negotiable.** (Confidence: High). Violation implies the account measures rhetorical repetition rather than epistemic support.

  **1.5. Agent-Relative Dynamics**
  *   **Requirement:** The account must treat confirmation as a change in an agent's epistemic state at a specific time $t$, rather than a timeless logical relation between propositions. It must be capable of assigning different confirmation values to the same $(H, E)$ pair for different agents based on their history.
  *   **Case:** Agent 1 knows $E$ and learns $H$. Agent 2 knows $H$ and learns $E$. Agent 3 knows both but never checks the link. The account must allow for different confirmation verdicts for these three agents.
  *   **Verdict:** **Non-Negotiable for this Project.** (Confidence: High). *Note:* This excludes "Timeless Relation" accounts from satisfying *this* specification. Since one proposal involves measuring confidence changes in a trained model (an agent), a timeless logical account cannot be the metric of success for the ML proposal. This is a project-scope constraint, not a universal truth.

  **1.6. The Zero-Prior Accommodation**
  *   **Requirement:** The account must explicitly state its handling of hypotheses that had zero prior probability (unconceived hypotheses) prior to their formulation. It must declare whether it solves the "Old Evidence" problem only for agents who assigned $P(H) > 0$, or if it extends to $P(H) = 0$.
  *   **Case:** A hypothesis is literally unimaginable before time $t$ (e.g., quantum entanglement pre-1900). Standard Bayesianism cannot update on $P(H)=0$.
  *   **Verdict:** **Camp-Specific Demand.** (Confidence: Medium). Strict Bayesians often treat this as a separate problem ("New Hypotheses"). An account may be accepted as a solution to *Old Evidence* even if it fails here, provided it declares the limitation. However, failure here limits the account's utility for the ML proposal, where the "hypothesis" (class/pattern) may not have existed in the output space pre-training.

  **1.7. Operationalizability in Non-Propositional Systems**
  *   **Requirement:** For the ML proposal specifically: The account must define what constitutes "evidence $E$" and "hypothesis $H$" within a weight matrix where no explicit propositions are stored. It must identify the specific vector or loss-landscape feature corresponding to "learning the connection."
  *   **Case:** A transformer model was trained on a corpus containing both the data ($E$) and the theory ($H$). It initially outputs low probability for $H$. When prompted to "consider $E$," it outputs high probability for $H$. The account must identify where the "knowledge" of $E$ resided before the prompt and why it wasn't applied.
  *   **Verdict:** **Non-Negotiable for the ML Proposal.** (Confidence: Medium). If the ML account cannot map "gradient updates" to "credence," it is merely using Bayesian language metaphorically, which violates the goal of comparing the two proposals on common ground.

  ---

  ## 2. Incompatibility Analysis

  **The Impossible Trinity**
  There is a demonstrable conflict between three requirements often implicitly assumed to be compatible. You cannot jointly satisfy the following three constraints within a single formal system without adding external machinery:

  1.  **Standard Probabilistic Coherence:** The agent's beliefs obey Kolmogorov axioms (including $P(E)=1$ for known evidence).
  2.  **Agent-Relative Dynamics:** Confirmation requires a real increase in the agent's credence in $H$ at the time of discovery (Requirement 1.5).
  3.  **Representation Invariance:** The confirmation value should not depend on *how* the agent represents the evidence (e.g., whether $E$ is stored as a raw datum or a derived proposition) (Implicit in Requirement 1.2).

  **The Conflict:**
  If an agent is probabilistically coherent (1) and knows $E$ (so $P(E)=1$), then $P(H|E) = P(H)$. There is no mathematical room for an increase in credence (violating 2).
  To restore the increase (satisfy 2), you must either:
  *   **Drop Coherence:** Allow the agent to be uncertain about the logical connection $H \to E$ (Logical Omniscience relaxation). This violates the spirit of (1) for idealized agents.
  *   **Drop Certainty:** Claim $P(E) < 1$ even for known evidence (Jeffrey Conditionalization). This violates the intuitive definition of "Old Evidence" as *known* fact.
  *   **Drop Representation Invariance:** Admit that confirmation depends entirely on the *syntax* of the agent's internal representation (e.g., whether $E$ is in the "active" buffer). This makes confirmation a psychological artifact rather than an epistemic feature.

  **Resolution for this Project:**
  We must abandon **Standard Probabilistic Coherence (1)** regarding logical truths.
  *Reasoning:* Requirement 1.5 (Agent-Relative Dynamics) is the primary goal of this project (comparing confidence changes). Requirement 1.1 (Arithmetic Resolution) demands a mechanism for movement. Therefore, the proposals *must* relax the assumption that the agent knows all logical consequences of their beliefs instantly.
  *Cost:* This admits that "learning" the connection $H \to E$ is itself new information, distinct from $E$.

  **Most Exclusionary Requirement:**
  **Requirement 1.5 (Agent-Relative Dynamics).**
  This requirement eliminates the "Timeless Logical Relation" camp entirely. Many philosophers argue that confirmation is a relation between $H$ and $E$ independent of who knows what (e.g., $E$ confirms $H$ regardless of whether Einstein knew $E$). By mandating that we measure *changes in confidence*, we rule out any account that treats confirmation as a static, Platonic relation. This is necessary to evaluate the ML collaborator's proposal, but it must be acknowledged that this excludes a major philosophical tradition from "passing" this specification.

  ---

  ## 3. Scorecard of Standard Moves

  **1. Relaxing Logical Omniscience (Garber-style)**
  *   *Mechanism:* Agents are uncertain about logical entailments ($P(H \to E) < 1$). Learning the entailment updates $P(H)$.
  *   *Score:* **Passes 1.1, 1.5.** Fails 1.7 (hard to map "logical uncertainty" to neural weights).
  *   *Critique:* Computationally expensive. Requires the agent to have a probability distribution over logic itself.
  *   *Confidence in Verdict:* High.

  **2. Counterfactual Excision (The "What If" Approach)**
  *   *Mechanism:* Evaluate confirmation by reconstructing the agent's credence function *as if* they had not known $E$, then conditionalize.
  *   *Score:* **Passes 1.1.** Fails 1.2 (Degrees of Oldness) and 1.5 (Agent-Relative).
  *   *Critique:* The counterfactual "agent who doesn't know $E$" is often ill-defined or impossible to reconstruct uniquely. It measures a hypothetical update, not the actual confidence change the ML model exhibits.
  *   *Confidence in Verdict:* High.

  **3. Jeffrey Conditionalization (Kinematics)**
  *   *Mechanism:* Refuse to assign $P(E)=1$. Old evidence is treated as highly probable but uncertain, allowing $P(H)$ to shift when the $H \to E$ link is found.
  *   *Score:* **Passes 1.1, 1.3.** Fails 1.2 (arbitrary assignment of $P(E) < 1$ for known facts).
  *   *Critique:* Solves the math by denying the premise of "Old Evidence." If $E$ is a recorded measurement, treating it as uncertain feels like cheating unless the measurement error is explicitly modeled.
  *   *Confidence in Verdict:* Medium.

  **4. Timeless Logical Relation (The Deflationary Move)**
  *   *Mechanism:* Confirmation is a static relation. The "increase in support" is a psychological illusion; $E$ always supported $H$, we just noticed it.
  *   *Score:* **Passes 1.4.** Fails 1.5 (Catastrophically).
  *   *Critique:* This is the "correct" answer for a logician, but the wrong answer for this project. It cannot explain the ML model's shift in output confidence, nor the historical impact of the discovery.
  *   *Confidence in Verdict:* High.

  ---

  ## 4. Confidence and Uncertainty

  **Load-Bearing Claims:**
  *   **Impossibility of Standard Bayes + P(E)=1 + Credence Change:** **Confidence: High.** This is a mathematical theorem within Kolmogorov probability. Any proposal claiming to satisfy all three without qualification is mathematically incoherent.
  *   **Non-Negotiability of Agent-Relativity (1.5):** **Confidence: High.** Given the project's aim to compare a Bayesian agent model with an ML confidence metric, a timeless account cannot serve as the common metric.
  *   **Exclusionary Power of 1.5:** **Confidence: Medium-High.** While it excludes timeless accounts, some hybrid accounts might claim to satisfy both. The verdict relies on the strict interpretation of "confidence change."

  **Least Certain Point:**
  *   **Requirement 1.7 (Operationalizability in Non-Propositional Systems).**
  *   *Uncertainty:* I am least sure that "confidence" in a trained model maps cleanly enough to epistemic "confirmation" to satisfy Requirement 1.1. A model's output probability is a function of loss minimization, not necessarily belief revision.
  *   *Settling Evidence:* We need a formal proof or empirical demonstration that **prompting a pre-trained model with $E$ to retrieve $H$ is isomorphic to Bayesian conditionalization.** If the model's "confidence" shift is merely pattern completion rather than inferential updating, the ML proposal is category-error, not a solution. A controlled experiment where the model is trained on $E$ and $H$ separately, then tested on the link, would settle whether the "connection" was latent (old evidence) or constructed (new inference).

  **Recommendation for the Meeting:**
  Open the meeting by asserting Requirement 1.1 and 1.5 as the "Gatekeepers." Any proposal that does not explicitly state how it moves the needle on $P(H)$ for an agent who already holds $E$ should be dismissed as addressing a different problem (logical support vs. retrospective confirmation). Force the Bayesian to admit where they break coherence, and force the ML collaborator to define what "probability" means in their weights.
