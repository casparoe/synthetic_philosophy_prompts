answer: |-
  Imagine a monk named Kavi who serves as the Keeper of the Seed Mantra for his monastery. This role is not merely administrative; it involves a solemn vow taken before the abbot that binds the specific mental continuity of the Keeper to the protection of the mantra. Kavi swears that he will never speak the mantra unless the monastery is in existential danger, and he will never allow the knowledge to leave his mind. To ensure this, the vow is tied to a specific mnemonic visualization that only Kavi holds. Now, suppose Kavi contracts a rare fever that does not kill him but烧s out the specific mental formations associated with his role. He survives with his body intact and his general consciousness functioning, but he loses all memory of being the Keeper, all memory of the mantra, and his personality shifts from stern and protective to gentle and indifferent. The causal chain of his psychophysical aggregates is unbroken; there is no moment of death, only a radical rearrangement of mental content. Years later, the monastery faces the exact existential danger Kavi vowed to guard against. The elders demand the mantra from him. Kavi, now a gentle farmer in the monastery gardens, says he does not know it and does not feel bound by a vow he cannot remember making.

  Here is where your two schools diverge in a way that standard examples do not capture. The Abhidharma reductionist must say that the person who made the vow no longer exists. There is only a causal series of aggregates that currently lacks the specific mental formations required to fulfill the vow. For the reductionist, holding this new series of aggregates responsible is a convenient fiction, a pragmatic designation used to maintain social order, but ultimately there is no subject who bears the obligation because the subject was nothing more than the now-lost configuration of skandhas. The reductionist can argue that karma ripens on the series, but they cannot robustly justify why this specific psychological discontinuity does not void the personal commitment, since the person was just a label for the previous configuration. The Pudgalavadin, however, can assert that the person, the pudgala, persists through this radical rearrangement. Because the person is inexpressible—neither identical to the aggregates nor different from them—the loss of the memory and the shift in personality are changes to the aggregates, not to the person. The pudgala who made the vow is standing in the garden, and therefore the obligation remains fully intact regardless of the psychological rupture. The Pudgalavadin licenses the verdict that Kavi is truly responsible for retrieving the mantra, not because it is useful to say so, but because he is ontologically the same agent who swore the oath.

  The conceptual pressure this places on each side is distinct and damaging in different ways. For the reductionist, the problem lands squarely on the ethics of holding someone to a promise. If the person is merely a designation for a series, and the series undergoes a rupture severe enough to erase the intention and memory underlying the commitment, the reductionist struggles to explain why the later stages of the series should suffer for the earlier stages. They are forced to admit that moral responsibility is ultimately unreal, a mere convention that dissolves under scrutiny. This undermines the soteriological urgency of the path; if the person who practices is not the person who attains nirvana in any robust sense, the motivation for ethical striving weakens. For the Pudgalavadin, the pressure lands on ontology and the semantics of person-talk. By insisting the person persists through a total psychological overhaul, they risk positing a substrate that survives change without changing itself. This looks suspiciously like the atman they claim to reject. The inexpressibility claim functions as a shield against criticism, but in this scenario, it acts as a placeholder for a permanent self that carries properties across time without being constituted by them.

  If I had to judge which of these problems is worse, I would say the Pudgalavadin ontological slip is the more dangerous error, though I flag this as my own view rather than settled doctrine. The reductionist ethical gap is serious, but it can be managed within the two-truths framework; we can say responsibility is conventionally real even if ultimately empty, and that is sufficient for practice. The Pudgalavadin solution, however, threatens to reintroduce the very essence of selfhood that the Buddha sought to dismantle. If the person can survive the total loss of the aggregates that defined them, then the person is effectively a metaphysical substance independent of the impermanent processes of existence. This compromises the core insight of dependent origination. In your seminar, this case should help students see that the Pudgalavadin move saves moral responsibility only by sacrificing the no-self doctrine, while the reductionist saves the no-self doctrine only by making moral responsibility ultimately conventional.
