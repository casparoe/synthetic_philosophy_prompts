  Here's a thinking process that leads to the suggested in-class game:

  1.  **Analyze the Request:**

      *   **Context:** Second-year political philosophy seminar (18 students), 80 minutes.
      *   **Background:** Students know basic distributive justice, no specific reading on migration.
      *   **Goal:** Design an in-class game (repeated contribution game) to illustrate the tension between a generous welfare state and open borders. Specifically, distinguish between:
          1.  *Fiscal Impact:* Is the newcomer a net contributor/cost?
          2.  *Solidarity/Trust Impact:* Does admission alter the willingness of existing members to contribute?
      *   **Key Constraint:** The "solidarity erosion" mechanism must emerge from the *rules*, not the instructor's lecture. Students must see their contribution rates drop for reasons unrelated to pool arithmetic, based on choices they made.
      *   **Required Elements:**
