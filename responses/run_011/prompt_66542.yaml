answer: |-
  # Seminar Activity: The Solidarity Constraint Game

  ## 1. Overview & Learning Objective
  This 80-minute activity simulates the tension between redistributive generosity and group boundaries. It is designed to separate the *fiscal* question (do newcomers cost more?) from the *sociological* question (does admission alter the willingness of existing members to contribute?).

  Students will experience a drop in cooperation that is not caused by the newcomers' behavior or the math of the pot, but by a rule change the group voluntarily adopted to accommodate the newcomers.

  ## 2. Materials List
  *   **Whiteboard & Markers:** To track the Public Pot and Contribution Log.
  *   **Token Sheets:** 18 sheets of paper per student, pre-printed with "10 Credits" at the top (or simply have them write numbers 1–10).
  *   **Decision Cards:** 18 index cards (15 blue, 3 red).
  *   **Anonymous Slips:** A box or hat for collecting contributions secretly in later rounds.
  *   **Payoff Ledger:** A spreadsheet or board section to track individual earnings (for extra credit/participation points).

  ## 3. Roles & Setup (5 Minutes)
  *   **The Polity (15 Students):** "Founding Citizens." They sit in a semi-circle.
  *   **The Entrants (3 Students):** "New Members." They sit outside the semi-circle initially. *Note: Select these students randomly or by volunteer, but do not reveal their identity as "Entrants" to the Polity yet.*
  *   **The Recorder (Instructor):** You track the numbers.
  *   **Endowment:** Every player starts each round with **10 Credits**.
  *   **Payoff Scheme:**
      *   Keep 1 Credit = 1 Point toward participation grade.
      *   Contribute to Pot = Pot is multiplied by **1.5** and divided equally among **all** members (regardless of contribution).
      *   **Win Condition:** Top 5 scorers get a small privilege (e.g., choice of essay topic, or 5% bonus on final). This ensures they care about relative standing, not just absolute gain.

  ## 4. Round-by-Round Structure

  ### Phase 1: The Closed Community (Rounds 1–3) | 20 Minutes
  *   **Rule:** Contributions are **Public**. When a student contributes, they write their name and amount on the whiteboard.
  *   **Action:** Students decide how many of their 10 Credits to keep vs. contribute.
  *   **Outcome:** Calculate the pot (Sum × 1.5 / 15). Distribute points.
  *   **Expected Dynamic:** High contribution. Social pressure and reciprocity norms ("I see you contributed, so I will") sustain the pool.
  *   **Debrief Pause (2 mins):** Ask: "Why did you contribute?" (Answers: fairness, saw others do it, didn't want to be a freeloader).

  ### Phase 2: The Constitutional Convention (10 Minutes)
  *   **Scenario:** Inform the class that 3 new members wish to join the Polity. They have the same endowment and payoff structure.
  *   **The Vote:** The 15 Founding Citizens must vote on **one** rule change to accommodate the Entrants *before* the Entrants enter the room.
  *   **The Choice:**
      *   **Option A (Status Quo):** Keep contributions **Public**. (Newcomers' names will also be posted).
      *   **Option B (Inclusion Protocol):** Make contributions **Anonymous**. (To ensure newcomers aren't stigmatized or scrutinized more heavily than founders, all names are removed from the board; only total pot is shown).
  *   **Constraint:** Tell them Option B is "fairer" to newcomers as it prevents profiling. Option A is "more transparent."
  *   **Decision:** They vote. (Most groups, wanting to appear liberal/fair, will choose **Option B**).
  *   **Crucial Detail:** The *arithmetic* of the pot (1.5 multiplier) does **not** change. The *endowment* (10 Credits) does **not** change.

  ### Phase 3: The Open Polity (Rounds 4–6) | 25 Minutes
  *   **Action:** The 3 Entrants enter. They sit with the group.
  *   **Rule:** Contributions are now **Anonymous** (per the vote). Students write their contribution on a slip and put it in the box. You tally the total only.
  *   **Outcome:** Calculate pot (Sum × 1.5 / 18). Distribute points.
  *   **Expected Dynamic:** Contribution rates will drop significantly.
  *   **Why:** The mechanism of *social accountability* was removed to protect the newcomers' dignity/integration. Without names, the "bounded we" (reciprocal monitoring) dissolves.
  *   **Observation:** Ask students to watch the total pot size. It will likely shrink even if the newcomers contribute fully, because the *Founders* contribute less.

  ### Phase 4: The Reveal & Debrief (20 Minutes)
  *   **Step 1: Withhold Vocabulary.** Do not use words like "solidarity," "welfare," or "borders" yet.
  *   **Step 2: Map the Data.**
      *   Draw a graph on the board: Round Number (X) vs. Average Contribution (Y). Show the cliff at Round 4.
      *   Ask: "Did the newcomers free-ride more than the founders?" (Reveal the anonymous slips from Rounds 4–6. Usually, newcomers contributed similarly to founders).
      *   Ask: "Did the math of the pot change?" (No).
      *   Ask: "What changed?" (The visibility rule).
      *   Ask: "Who chose that rule?" (The Founders, in Phase 2).
  *   **Step 3: Introduce Vocabulary.**
      *   Explain that the "Visibility Rule" represents **Shared Norms/Identity**.
      *   Explain that the drop represents the **Solidarity Constraint**.
      *   **Name the Claim:** This illustrates **"The Boundary Condition of Redistribution."** The claim is that generous redistribution requires a bounded demos capable of enforcing reciprocal norms; if you expand the boundary without reinforcing the norms (or if you weaken norms to accommodate the expansion), the willingness to redistribute erodes.
  *   **Step 4: Connect to Debate.**
      *   Your Friend's View: Looked at the newcomers' slips (Fiscal Impact).
      *   Your View: Looked at the Founders' drop in contribution after the rule change (Solidarity Impact).

  ## 5. Critic's Modifications (For Discussion)
  If a critic (or student) argues the game is rigged against open borders, propose these rule changes to test the robustness of the result:

  1.  **Modification A (Assimilationist Model):** Allow the group to keep contributions **Public** (Option A in Phase 2).
      *   *Prediction:* Contributions remain high.
      *   *Implication:* Solidarity *can* survive open borders, but only if newcomers are subject to the same intense scrutiny/monitoring as founders. The cost is not fiscal, but social (privacy/inclusion).
  2.  **Modification B (Democratic Inclusion):** Allow the **Entrants** to vote on the Rule in Phase 2.
      *   *Prediction:* Entrants might vote for Public contributions to prove their trustworthiness, or Founders might trust them more if they had a say.
      *   *Implication:* The erosion isn't about numbers, but about *authorization*. If the "we" is re-authorized by the new members, the bond might hold.

  ## 6. Honest Limitations (Instructor Notes)
  You must disclose these limitations during the debrief to maintain intellectual honesty:
  1.  **The Erosion Parameter is Stipulated:** In the game, anonymity *caused* the drop because I (the facilitator) designed it that way. In the real world, it is an empirical question whether diversity actually erodes trust. The game proves the *logic* of the argument, not the *truth* of the premise.
  2.  **Migrants as Exogenous Shocks:** In the game, newcomers are passive tokens added to the pool. In reality, migrants are agents who organize, vote, and build solidarity. They are not just a drain on trust; they can be builders of it.
  3.  **The "Fairness" Trap:** The game forces a choice between "Privacy" and "Monitoring." Real societies can build solidarity through other means (national service, shared civic education) that the game does not simulate.

  ## 7. Troubleshooting: What Will Go Wrong
  *   **Problem:** **Collusion/Signaling.** In the Anonymous Phase, students might try to signal their contribution by crumpling paper a certain way or whispering.
      *   **Fix:** Enforce strict silence during contribution collection. Use identical slips. If signaling occurs, call it out as "corruption" and invalidate the round—this actually reinforces the lesson about the difficulty of maintaining norms.
  *   **Problem:** **The "Spite" Drop.** Students might contribute less simply because they are annoyed by the rule change, not because of solidarity erosion.
      *   **Fix:** In the debrief, acknowledge this. "Rational choice" includes emotional responses to perceived unfairness. The solidarity constraint *includes* the emotional willingness to cooperate.
  *   **Problem:** **Newcomers Free-Ride Aggressively.** If the 3 entrants contribute 0, the fiscal argument wins, overshadowing the solidarity lesson.
      *   **Fix:** Brief the 3 Entrants privately before class. Instruct them: "Contribute an average amount (around 5 credits). Do not try to win; try to blend in."

  ## 8. Responding to the "Evidence" Student
  *Scenario:* A student raises their hand and says, "But Alesina and Glaeser (2004) show that ethnic heterogeneity empirically depresses support for redistribution. Isn't this just a prejudice we should overcome with data, not a structural constraint?"

  *Your Response:*
  "That is an excellent empirical point, and you are right that the data is mixed but often supports that correlation. However, notice what the game just showed us. The drop in contributions didn't happen because the newcomers were *different* (they had the same payoff structure). It happened because the **mechanism of trust** was altered to accommodate them.

