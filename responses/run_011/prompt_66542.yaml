      *   *Better approach:* One large group (the "Polity").
      *   *Rounds:* Need a baseline, a policy setting phase, and a post-entry phase.
      *   *Roles:* "Legislators" (set the rules), "Citizens" (contribute), "Newcomers" (enter later).
      *   *The "Solidarity" Mechanic:* This is the hard part. How to make contribution drop without changing the fiscal math?
