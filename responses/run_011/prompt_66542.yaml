      *   **Materials:** Index cards, tokens (poker chips or paper slips), whiteboard.
      *   **Roles:** 15 "Founding Citizens," 3 "New Entrants" (played by 3 students chosen randomly or by instructor). 1 "Recorder."
      *   **Currency:** "Welfare Credits" (WC).
      *   **Endowment:** 10 WC per round.
