      *   **2. The Argument (Inference & Coherence):**
          *   *Inference breakdown:* Moving from "we can't know true justice" to "positive justice is output-directed" is shaky. Just because we can't know the target doesn't mean force *creates* the standard. It might mean we are blindly guessing at the target. Pascal often suggests custom *approximates* order due to God's providence, not that force *defines* justice.
