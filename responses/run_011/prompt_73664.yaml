answer: |-
  Your thesis is that Pascal's political conservatism stems not from a prudential calculation about the costs of instability, but from an epistemic claim: while true justice exists as a target, human reason cannot access it, rendering positive justice entirely output-directed (constituted by force and custom). For this to hold, Pascal's texts must consistently affirm the existence of a true justice standard while simultaneously denying reason any capacity to identify it in the political realm, without collapsing into nihilism or contradicting his own instances of critiquing specific laws.

  1. **Interpretive accuracy.**
     - *Laws obeyed because laws, not justice:* Fair. This aligns with his skepticism of reason's authority in politics.
     - *Whoever obeys on account of justice obeys own invention:* Fair. This captures his view on the subjectivity of moral reasoning.
     - *Rivers and mountain ranges:* Fair. This is a standard Pascal trope for geographical relativity.
     - *Custom as entire foundation:* Overstated. Pascal views custom as the *mark* of authority because reason is corrupted, but he often implies custom is respected because it prevents disorder, not because it is the sole source of value.
     - *Civil war is the greatest of evils:* Misleading in this context. You cite this as evidence for an epistemic claim, but it is inherently prudential. Using it here undermines your argument that Pascal is not making a prudential claim.
     - *Natural law exists but reason corrupted:* Uncertain. Pascal is often more radical than this; he suggests we have lost the true good entirely, not merely the map to it. Asserting a robust "existing" natural law risks making him too Thomistic.
     - *Conflation:* You run together "Justice as such" with the "Order of Charity." For Pascal, political rules belong to the Order of Bodies, while true justice belongs to the Order of Spirits. Treating them as two versions of "justice" (target vs. output) obscures this ontological gap.

  2. **The argument.**
     - *Inference breakdown:* The move from "we cannot know true justice" to "force makes justice" is a non-sequitur. Force could simply be enforcing injustice blindly. Pascal's actual claim is stronger: force makes it *just* because peace (Order of Bodies) is the goal, not moral rectitude. You miss this by keeping "justice" as the genus for both.
     - *Coherence:* The distinction collapses. If true justice is the target, then output-directed justice is systematically false (i.e., unjust). Pascal avoids this by saying they are different *orders*. Your framework keeps them in the same category, forcing a contradiction where Pascal sees a distinction in kind. An output-directed account of positive justice cannot coexist with a target-directed account of justice as such unless you admit the political order is not trying to hit the target at all.

  3. **The objection.**
     - *Verdict:* Fatal as stated. If I can recognize injustice (as you admit Pascal does), I have a negative constraint on the output. This implies access to a standard, however fragmentary.
     - *Repair:* Shift from epistemology to ontology. It is not that we cannot *know* the standard; it is that political rules belong to a category where "justice" means "stability," not "moral rightness." When Pascal calls a law unjust across the river, he means it is disordered for that context, not morally sinful. You must argue that Pascal changes the definition of justice between the orders, not just our access to it.

  4. **Novelty.**
     - *Familiar point:* Pascal as skeptic/conservative is standard scholarship. The tension between his skepticism and his faith is well-trodden ground.
     - *New vocabulary:* "Target-directed" vs. "Output-directed" is modern legal positivist lingo (reminiscent of Hart or Raz).
     - *Residue:* The claim that reform is *unintelligible* rather than *imprudent* is the novel core. This is worth publishing if proven.
     - *Change:* Drop the "True Justice" target. Make it about "Peace/Order" vs. "Charity." If you argue that political conservatism is unintelligible because political goals are distinct from moral goals, you avoid the contradiction of affirming a target we cannot hit.

  5. **Cuts.**
     - Delete: "his remark that civil war is the greatest of evils" in Section 3. It directly contradicts your claim that this is not a prudential argument and weakens your position by providing evidence for the opposing view.

  The paper is salvageable only if you abandon the claim that Pascal affirms a target-directed true justice and instead argue that he replaces justice with order in the political realm.
