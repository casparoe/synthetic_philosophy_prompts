answer: |-
  **TO:** Membership Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Plot Allocation and Selection Criteria

  **Bottom Line:** Reject the proposal to reserve four plots for applicants with a "tie to the parish." Allocate all six upcoming plots via a transparent points system based on housing need and demonstrated commitment to the Trust, not birthplace or lineage. Implement this system immediately for the current cycle.

  **The Public Line**
  We are not a private club. We accepted a property-tax abatement to solve a public housing crisis. That money comes from the same parishioners currently locked out of our waiting list. When you take public subsidies to create affordable stock, you become a trustee of a public good. You cannot then restrict that good to a closed circle of friends and family.

  We crossed the line the moment we leveraged public funds to create a private asset base. The abatement implies a contract: we provide affordability to the community in exchange for tax relief. If we restrict access to those with existing connections, we are effectively privatizing a public subsidy. We are allowed to choose members, but only based on criteria that serve the Trust's public purpose (affordability and stewardship), not the private preferences of current households (social cohesion and inheritance).

  **The Country Analogy**
  The analogy that "if a country can pick borders, we can pick members" fails in both directions. States claim border control based on sovereignty and the monopoly on force within a territory. We claim membership based on voluntary association and shared labor. States are not subsidized by a higher authority to house their neighbors; we are.

  The right to pick members does not transfer upward or downward. It stays here, but it is constrained by our funding source. A country can exclude outsiders to preserve a culture because it owes its citizens security above all. We can exclude outsiders only to preserve the *function* of the Trust. If our selection process undermines the affordability mission by looking like nepotism, we lose the moral license to operate.

  **The Local Preference and the Founders**
  The strongest argument for local preference is stability. Housing people who already work and live here reduces churn and ensures someone is around to fix the barn when it leaks. Outsiders can leave; locals are stuck here, so their investment in the community is forced to be long-term. This is valid. However, the current proposal conflates "local" with "related."

  The data is damning: six of the nine qualified locals are children of current members. This isn't community preservation; it's hereditary privilege. If we approve this, we are telling the 178 people on the list with no connections that their eleven-year wait is secondary to the housing security of four founding families.

  Regarding the founders who built the barns: Their labor created the equity that secured their own leases and the Trust's survival. They were paid in security and community standing. That debt is owed to them, not automatically to their adult children. If we grant housing priority based on lineage, we turn a labor cooperative into a dynasty. We should honor the founders publicly, perhaps with a one-time stipend or plaque, but we cannot mortgage the future of the Trust to pay a debt we do not owe.

  **The New Test**
  We need a test that survives contact with reality. Discretionary voting favors people like me—those who know how to work the room. A pure lottery ignores commitment. We need a weighted score.

  For this cycle and the next, use this scoring matrix for all applicants:
  1.  **Housing Need (40 points):** Overcrowding, insecurity, distance from work/care. Verified by documentation.
  2.  **Trust Commitment (40 points):** Hours logged on workdays, committee service, attendance at AGMs. This rewards those who actually build the barns, not just those whose parents did.
  3.  **Parish Connection (20 points):** Residence or work in the parish. This acknowledges the local stability argument without granting veto power to birthright.

  **Allocation of the Six Plots**
  1.  **Plots 1 & 2:** Awarded to the two highest-scoring applicants on the list.
  2.  **Plots 3–6:** Awarded via lottery among the top ten scorers. This ensures high commitment while acknowledging that luck plays a role in community building.
  3.  **Timeline:** Scores calculated within 14 days. Offers made within 30 days.

  **Verdict**
  If we pass the "tie to the parish" proposal, we admit that the Trust exists to protect the assets of the incumbent households rather than to provide housing for the parish. We will become a gated community with a waiting list. Reject the proposal. Adopt the scoring system. Honor the founders, but do not inherit their privileges. We are stewards, not owners. Act like it.
