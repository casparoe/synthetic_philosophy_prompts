      *   *The "Built the Barns" Argument:* This is a claim of desert based on past labor. It's strong intuitively (you built this, your kids should benefit), but problematic intergenerationally. The founders benefited from the equity release; their kids getting priority *on top* of that looks like entrenching a caste. However, ignoring it completely disrespects the founding social contract.
