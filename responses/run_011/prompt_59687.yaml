answer: |-
  Dear Dr. Hume,

  I am writing in response to the decision regarding manuscript #2024-BIRD, titled "Empirical Verification of Corvid Pigmentation via Negative Instance Accumulation." While I appreciate the time spent by your reviewers, I must formally contest the recommendation for rejection. The referees have confused empirical convention with logical necessity, and in doing so, have rejected a decade of fieldwork based on a misunderstanding of confirmation theory.

  Referee One writes, "Observing a brown loafer tells us nothing about the plumage of Corvus corax." This is factually incorrect. As Carl Hempel demonstrated, the hypothesis "All ravens are black" is logically equivalent to "All non-black things are non-ravens." To confirm the latter is to confirm the former. My dataset includes 3,402 photographs of non-black objects—shoes, snowy fields, a mute swan—none of which are ravens. Each image constitutes a verified negative instance. Referee One dismisses this as irrelevant, but irrelevance is not falsity. Hempel himself admitted that a red shoe confirms the hypothesis, however counterintuitive it feels. My contribution is simply taking Hempel at his word.

  Referee Two adopts a Bayesian posture, arguing that because the class of non-black things is vastly larger than the class of ravens, the confirmation provided by my shoe photographs is negligible. They write, "The posterior probability shifts by an amount indistinguishable from zero." I concede the shift per image is small. However, science is the accumulation of small shifts. I have provided nine angles of a white transit van alone. To dismiss this volume of data because the prior probability is low is to privilege prejudice over procedure. If logic holds, the data must count. If the data counts, the hypothesis is supported.

  However, I must address the concern raised during the rebuttal phase regarding the white transit van. Referee Two noted that if a non-black non-raven confirms "All ravens are black," then a non-white non-raven—such as said white van, viewed against a non-white background—must confirm "All ravens are white." I admit this is technically correct. The van photos do indeed provide confirmation for the hypothesis that all ravens are white.

  Some might call this a contradiction. I call it a multi-variate confirmation landscape. Just as a particle can exhibit wave-like or particle-like properties depending on the experimental setup, a non-raven object confirms raven pigmentation relative to the color spectrum under investigation. The van confirms blackness in the context of non-black exclusion and whiteness in the context of non-white exclusion. To claim this invalidates the study is to demand that nature be simpler than logic allows. I am not responsible for the paradoxical structure of implication; I am only responsible for documenting the instances.

  You are left with a choice. You can reject a manuscript that is logically sound, empirically exhaustive, and philosophically robust because it makes your reviewers uncomfortable. Or you can publish it and acknowledge that technical correctness entitles one to a venue, even if the utility is primarily pedagogical. I expect the latter. The shoes are ready for typesetting.

  Sincerely,

  Arthur P. Vance
