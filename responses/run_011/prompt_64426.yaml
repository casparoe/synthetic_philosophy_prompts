answer: |-
  - **The short version**
  This procedure turns on a single boundary: the distinction between *risk appetite* (a member value) and *risk management* (a technical fact). Members own the mutual, so they must set the appetite—how much risk we take for how much return. However, they cannot vote to breach regulatory solvency limits or ignore factual constraints. The screening tool tests whether a proposal respects this boundary. If a proposal attempts to restrict voting rights based on competence, it must prove the decision is purely technical, the test is objectively neutral, and the disenfranchisement doesn't violate the mutual's core principle of equal member control. If it conflates values with facts, it fails.

  - **The distinctions that matter**
  Three distinctions hold this procedure together. First, **Fact vs. Value**. Solvency calculations are facts; ethical investment preferences are values. If you treat values as facts, you enable technocracy where experts dictate morality. If you treat facts as values, you enable ruin where members vote for impossibility. The procedure collapses if you cannot separate "what we want" from "what is possible."

  Second, **Input vs. Output**. Members control the input (strategy, board election); experts manage the output (compliance, execution). Proposals that shift control of outputs to members risk regulatory breach; proposals that shift input control to experts risk legitimacy loss. The procedure collapses if members are barred from setting direction or empowered to break the law.

  Third, **Exclusion vs. Delegation**. There is a difference between stopping someone voting (exclusion) and asking experts to advise (delegation). Epistocratic proposals often mask exclusion as safety. The procedure collapses if it allows disenfranchisement where better briefing or advisory panels would suffice. You must distinguish between protecting the mutual from members and protecting members from bad information.

  - **The procedure**
  Use this checklist sequentially. If a proposal fails a step, stop and recommend rejection or substantial amendment. Document the failure point in the board paper.

  1.  **Regulatory and Legal Viability**
      *   **Question:** Does the proposal require the mutual to breach regulatory capital requirements, company law, or FCA/PRA rules?
      *   **Pass:** The proposal operates within existing legal frameworks or proposes a lawful change to them.
      *   **Fail:** The proposal mandates action that would trigger regulatory intervention or is legally ultra vires.
      *   **Action:** Immediate rejection. No member vote can override statutory solvency limits.
      *   **Rationale:** Members cannot vote for ruin. This is the hard constraint.

  2.  **Fact vs. Value Classification**
      *   **Question:** Is the decision primarily about technical feasibility (fact) or strategic direction/ethics (value)?
      *   **Pass:** The decision is predominantly technical (e.g., calculating capital ratios, actuarial assumptions).
      *   **Fail:** The decision involves ethical preferences, risk appetite, or trade-offs between competing valid goals (e.g., divestment, branch closures).
      *   **Action:** If "Fail," any proposal restricting voting rights based on competence is rejected. Members retain equal vote on values.
      *   **Rationale:** Competence tests are illegitimate for value judgments. There is no "correct" answer on ethics, only preferences.

  3.  **Test Objectivity and Bias**
      *   **Question:** If the proposal involves a test or qualification, can the pass/fail criteria be verified independently without discretion?
      *   **Pass:** The test measures verifiable knowledge with a clear answer key, auditable by a third party.
      *   **Fail:** The test requires interpretation, relies on contested theories, or is designed by staff who benefit from the outcome.
      *   **Action:** If "Fail," the voting restriction is rejected. Offer enhanced member education instead.
      *   **Rationale:** Whoever writes the exam runs the place. If the test is subjective, it is a power grab disguised as competence.

  4.  **Disenfranchisement Impact**
      *   **Question:** Does the proposal permanently remove voting rights, or merely require additional steps for specific resolutions?
      *   **Pass:** The restriction is narrow, temporary, or specific to high-risk technical resolutions.
      *   **Fail:** The proposal creates a two-tier membership structure where a subset permanently holds more power.
      *   **Action:** If "Fail," reject. Mutuals rely on equal membership classes.
      *   **Rationale:** Qualified acceptability requires that losers accept the process. Permanent second-class members will not accept legitimacy.

  5.  **Alternative Mechanism Check**
      *   **Question:** Could the same goal be achieved via sortition (random sample), advisory panels, or supermajority thresholds instead of voting restrictions?
      *   **Pass:** The proponent confirms alternatives were considered and rejected for documented reasons.
      *   **Fail:** The proponent insists only on voting restrictions without considering less restrictive means.
      *   **Action:** Recommend amendment to use a Citizens' Assembly (random sample) for complex issues rather than testing individuals.
      *   **Rationale:** Deliberative democracy often yields better decisions than epistocracy without the legitimacy cost.

  6.  **Legitimacy Stress Test**
      *   **Question:** If the proposal passes, can the governance committee explain it to a member who fails the test without sounding like they are being called stupid?
      *   **Pass:** The explanation focuses on complexity and risk protection, not individual competence.
      *   **Fail:** The explanation implies some members are unfit to participate.
      *   **Action:** If "Fail," rewrite or reject.
      *   **Rationale:** If it reads like a power grab, it will be voted down or cause reputational damage.

  7.  **Final Governance Committee Sign-off**
      *   **Question:** Does the committee agree the proposal survives the above steps?
      *   **Pass:** Majority agreement.
      *   **Fail:** Significant dissent.
      *   **Action:** Record dissent in the board paper. Do not smooth over disagreement.
      *   **Rationale:** Board needs to see where the friction lies before the AGM.

  - **Where this isn't really a procedure**
  Steps 2 and 6 look mechanical but are judgment calls. Classifying "divestment" as a value rather than a financial fact is a philosophical stance, not a calculation. You are deciding that ethics trump pure returns. Similarly, the "Legitimacy Stress Test" depends on your ability to anticipate member reaction. In the board paper, do not present these as algorithmic outputs. Write: "The Committee judged this to be a value-based decision" rather than "The Procedure classified this as Value." Own the discretion. If you dress it up as mechanical, you invite challenges on the mechanics rather than the merit. Acknowledge that the boundary between fact and value is contested, but state clearly that the Committee has drawn the line here to preserve mutual principles. This honesty protects you if a member group challenges the decision; you can show the reasoning, not just a black box.

  - **Run on the three**
  **Case One (Fossil Fuel Test):** This fails at Step 2 (Fact vs. Value). Divestment is fundamentally a value judgment about risk and ethics, not purely corporate finance. Even if climate risk is factual, the weighting of that risk against returns is strategic. Furthermore, it fails Step 3 (Test Objectivity); climate risk models are contested. The kill shot is Step 2. You should advise that members can vote on divestment, but every member gets one vote. If the proponents want expertise, suggest they publish an expert report to inform the vote, not restrict it. Your softness on the assets is irrelevant; the mechanism is unconstitutional for a mutual.

  **Case Two (Random Panel for Branches):** This passes Step 1 and 2, but fails Step 1 again on a different axis: Fiduciary Duty. The board cannot be *bound* by a panel's recommendation if it contradicts their legal duties. It passes Step 5 (Alternative Mechanism) as it uses sortition, which is robust. The fix is to make the panel advisory or within delegated authority limits. If amended to "Board must consider and respond to," it passes. If "Board must accept," it is rejected. The randomness solves the competence issue, but the binding nature breaks governance.

  **Case Three (Actuary Veto):** This passes Step 1 (Regulatory) and Step 2 (Fact). Solvency is technical. It passes Step 4 (Disenfranchisement) because it protects the mutual from ruin, which benefits all members. It is essentially a codification of existing regulatory guardrails. This is viable. The board paper should frame it not as a veto on members, but as a veto on illegality. It survives the Legitimacy Stress Test because no member can reasonably argue for insolvency.

  **Over-70s Board Seats:** This is not an epistocratic question; it is a representation question. The procedure doesn't apply directly. However, apply Step 4 (Disenfranchisement). Reserving seats excludes other age groups. It requires a different test: does it improve diversity without violating equality rules? It's a governance composition issue, not a voting rights issue. Treat it as a nomination committee matter, not a member proposal screening.

  - **What it can't do**
  This procedure cannot stop a determined member group from framing a value issue as a technical one to bypass Step 2. They will hire consultants to produce "facts" supporting their values. It also cannot guarantee member understanding; a passed proposal might still be misunderstood at the AGM, leading to accidental ruin or accidental rejection of safety measures. Finally, it cannot prevent reputational damage. Even if a proposal passes the screen, the mere suggestion of testing members may be leaked to the press as "elitism." You must prepare communications that emphasize protection and complexity, not competence and exclusion. The procedure ensures governance soundness, not political safety.
