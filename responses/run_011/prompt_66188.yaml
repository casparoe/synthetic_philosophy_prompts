      *   *No Expression:* The concept of "intrinsic wrong" independent of suffering. The concept of "entrenchment."
      *   *Indicator Weighting:* Yes, production-linked metrics (growth, mortality) assume the animal *should* be growing/dying for us. They measure efficiency of exploitation, not moral status.

  6.  **Diagnosing the Silence:**
