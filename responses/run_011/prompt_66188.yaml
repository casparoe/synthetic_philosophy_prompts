      *   *Critical Limit:* Usually a measurable value (temp, time, ppm). Here, it's "Zero animals farmed."
      *   *Monitoring:* Observation/Measurement. Here, it's "Count of animals in system."
      *   *Corrective Action:* Fix the deviation. Here, it's "Stop production/Depopulate without use."
      *   *Verification:* Audit/Review. Here, it's "Existence audit."

      *Constraint:* I must explicitly state where this breaks. HACCP is designed to manage *risk within a process*, not to evaluate the *moral validity of the process itself*.

  4.  **Apply to Concrete Case: Eyestalk Ablation:**
