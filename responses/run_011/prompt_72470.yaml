answer: |-
  # Desiderata for a Criterion of Mechanism Identity

  The following requirements specify what it means for a mechanism $M$ in a reference checkpoint $C_{ref}$ to be "the same" as a mechanism $M'$ in a working checkpoint $C_{work}$. These are derived from the monitoring setting where the goal is to detect mechanism substitution (Same Behavior, Different Mechanism) under bounded access.

  ### 1. Causal Specificity (The "How" Constraint)
  *   **Specification:** The criterion must distinguish between implementations based on the causal pathway from input to output, not merely the input-output mapping or the presence of capable subnetworks.
  *   **Motivation:** Addresses **Situation 1**. If the reference pathway exists but is causally inert (ablation costs nothing), and a new pathway carries the load, the behavior is unchanged but the mechanism is substituted. A criterion based solely on behavioral output or weight presence would fail here.
  *   **Status:** **Non-negotiable.** This is the core definition of the monitoring task.

  ### 2. Parameterization Invariance
  *   **Specification:** The verdict must be invariant to symmetries of the neural network parameterization, including neuron permutation, rescaling of weights (where activation functions permit), and basis rotations within subspaces.
  *   **Motivation:** Standard retraining or fine-tuning often induces arbitrary changes in weight space that do not reflect functional changes. A criterion sensitive to neuron indices would flag trivial drift as mechanism substitution.
  *   **Status:** **Non-negotiable.** Without this, the criterion measures implementation details rather than computational structure.

  ### 3. Subspace Robustness (Superposition Handling)
  *   **Specification:** The criterion must not require a one-to-one mapping between units in $C_{ref}$ and $C_{work}$. It must allow for features to be represented in different bases, distributed across different neuron subsets, or moved within a subspace.
  *   **Motivation:** Addresses **Distributed realization/Polysemanticity**. In high-dimensional models, features often live in superposition. Demanding unit-level correspondence would classify any feature migration as a mechanism change, creating excessive false positives.
  *   **Status:** **Non-negotiable.** Current empirical evidence suggests superposition is ubiquitous in large models.

  ### 4. Upstream Dependency Sensitivity
  *   **Specification:** The identity of a mechanism includes the causal origin of its intermediate features. If an intermediate feature $f$ is computed by subnetwork $A$ in $C_{ref}$ but by subnetwork $B$ in $C_{work}$, the mechanisms are distinct, even if $f$'s representation is identical.
  *   **Motivation:** Addresses **Situation 2**. The prompt defines the mechanism as the "causal pathway from input to output." Changing the upstream source of a feature changes the pathway, even if the local computation remains stable.
  *   **Status:** **Non-negotiable.** This follows strictly from the provided definition of "mechanism" in the setting.

  ### 5. Distribution Relativization
  *   **Specification:** Mechanism identity must be relativized to a specified input distribution $\mathcal{D}$. $M$ and $M'$ may be identical on $\mathcal{D}_{train}$ but distinct on $\mathcal{D}_{deploy}$.
  *   **Motivation:** Addresses **Dependence on input distribution**. A subnetwork might implement a heuristic on one distribution and a robust rule on another. The monitor cares about the mechanism active during deployment.
  *   **Status:** **Non-negotiable.** Mechanisms are context-dependent computations.

  ### 6. Operational Boundedness
  *   **Specification:** The criterion must be evaluable without full interpretability of $C_{work}$. It cannot require a complete mechanistic account of the new checkpoint, only enough evidence to compare against the $C_{ref}$ account.
  *   **Motivation:** Addresses **Operationalizability**. We explicitly lack ground-truth accounts for $C_{work}$. If the criterion requires reverse-engineering $C_{work}$ fully, the monitor is computationally infeasible.
  *   **Status:** **Non-negotiable.** This is a hard constraint of the monitoring setting.

  ### 7. Diachronic Discontinuity Tolerance
  *   **Specification:** Continuity of weights across checkpoints must not imply continuity of mechanism. The criterion must allow for the possibility that $C_t$ and $C_{t+1}$ share a mechanism while $C_t$ and $C_{t+k}$ do not, even if the weight path is continuous.
  *   **Motivation:** Addresses **Situation 3** and **Diachronic identity**. Weights can drift continuously while the dominant causal pathway shifts gradually. The criterion must not be enslaved to weight distance metrics.
  *   **Status:** **Non-negotiable.** Weight continuity is a poor proxy for computational continuity.

  ### 8. Graded Verdict (Non-Binary Output)
  *   **Specification:** The criterion must output a continuous score of "mechanism similarity" or "substitution probability," not a binary boolean.
  *   **Motivation:** Addresses **Situation 3** and **Borderline cases**. In cases of monotonic decay, there is no single step where the mechanism flips. A binary threshold imposes an artificial discontinuity on a continuous process.
  *   **Status:** **Non-negotiable.** Required to handle gradual drift meaningfully.

  ### 9. Active Pathway Priority
  *   **Specification:** In cases of redundancy (multiple pathways capable of the behavior), the criterion must track the pathway that is *actually* driving the output on $\mathcal{D}$, not the pathway that *could* drive it.
  *   **Motivation:** Addresses **Situation 1** and **Redundancy**. If the reference pathway is dormant, it is not the mechanism currently producing the behavior.
  *   **Status:** **Negotiable.** One could argue the "capacity" matters for safety, but the prompt specifies detecting what *produces* the behavior.

  ### 10. Transitivity of Identity
  *   **Specification:** If $M_1 \equiv M_2$ and $M_2 \equiv M_3$, then $M_1 \equiv M_3$.
  *   **Motivation:** **Formal properties.** Equivalence relations are mathematically clean and allow for clustering of checkpoints.
  *   **Status:** **Prejudice / Impossible.** This conflicts with Situation 3 (Sorites Paradox). If every step is "similar enough" but the start and end are distinct, transitivity fails.

  ---

  # Impossibility Results and Tensions

  ### The Transitivity Tension
  There is a logical impossibility between **Requirement 8 (Graded Verdict)** and **Requirement 10 (Transitivity)** in the context of **Situation 3**.
  If mechanism identity is graded (to handle continuous decay), it cannot be a strict equivalence relation. If you enforce transitivity on a graded metric via thresholding, you reintroduce the sharp discontinuity that Requirement 8 seeks to avoid.
  *   **Resolution:** Transitivity must be abandoned. Mechanism identity is a *similarity metric*, not an equivalence relation. Checkpoints cannot be partitioned into discrete "mechanism classes" over long time horizons.

  ### The Drift vs. Substitution Tension
  There is a fundamental tension between **Requirement 2 (Parameterization Invariance)** and **Requirement 4 (Upstream Dependency Sensitivity)** when operationalized under **Requirement 6 (Operational Boundedness)**.
  *   **The Tension:** To detect that an upstream source has changed (Req 4) without solving full interpretability (Req 6), the monitor must rely on proxies (e.g., activation correlations). However, to ignore trivial retraining drift (Req 2), the monitor must ignore changes in those same proxies.
  *   **Loose vs. Tight:** A criterion loose enough to ignore ordinary retraining drift will inevitably miss subtle mechanism substitutions that look like drift. A criterion tight enough to catch subtle substitutions will flag ordinary drift as substitution.
  *   **The Concession:** The monitor must concede on **False Positives**. It is safer to flag drift as potential substitution than to miss a substitution disguised as drift. The criterion should be biased toward sensitivity, with the understanding that human review will filter false positives. The tension is not solvable by engineering; it is a property of the signal-to-noise ratio in high-dimensional weight space.

  ### The Single Most Exclusionary Requirement
  **Requirement 6 (Operational Boundedness)** does the most to exclude candidate accounts.
  Most philosophical and theoretical accounts of mechanism identity (e.g., isomorphic causal graphs, exact algorithmic equivalence) assume access to the full internal structure of both systems. In this setting, we have a full account of $C_{ref}$ but only query access to $C_{work}$. Any account requiring the reconstruction of the causal graph of $C_{work}$ *de novo* is disqualified. The criterion must be asymmetric: it tests $C_{work}$ *against* the template of $C_{ref}$, rather than comparing two fully known entities.

  ---

  # Evaluation of Candidate Accounts

  **1. Causal-Intervention Equivalence**
  *   **Performance:** Theoretically strong on Requirements 1 and 4 (Causal Specificity, Upstream Sensitivity). It naturally handles Situation 1 (ablation).
  *   **Failure Mode:** Fails **Requirement 6 (Operational Boundedness)**. Establishing causal equivalence typically requires exhaustive interventions on $C_{work}$, which violates the bounded forward-pass budget. It also struggles with **Requirement 3 (Subspace Robustness)** if interventions are tied to specific neurons rather than subspaces.

  **2. Algorithmic Level Individuation**
  *   **Performance:** Strong on **Requirement 1 (Causal Specificity)** by abstracting away from weights. Good for **Requirement 7 (Diachronic Discontinuity)**.
  *   **Failure Mode:** Fails **Requirement 3 (Subspace Robustness)** and **Requirement 6**. Translating neural weights into symbolic algorithms for $C_{work}$ requires solving interpretability. It is also brittle to **Requirement 2 (Parameterization Invariance)** if the algorithmic translation is sensitive to implementation details.

  **3. Representational / Geometric Similarity**
  *   **Performance:** Excellent on **Requirement 6 (Operational Boundedness)** and **Requirement 3 (Subspace Robustness)**. Metrics like CKA or subspace alignment are cheap to compute and invariant to rotations.
  *   **Failure Mode:** Fails **Requirement 1 (Causal Specificity)** and **Requirement 4**. High representational similarity does not guarantee causal equivalence (correlation $\neq$ causation). It cannot distinguish Situation 1 (parallel pathway) if the reference pathway's activations remain present but idle.

  **4. Dynamical Systems (Vector Field up to Coordinates)**
  *   **Performance:** Strong on **Requirement 2 (Parameterization Invariance)** and **Requirement 7 (Diachronic Discontinuity)**. Treats the network as a continuous flow, handling drift well.
  *   **Failure Mode:** Fails **Requirement 6 (Operational Boundedness)** and **Requirement 5 (Distribution Relativization)**. Estimating the vector field of a high-dimensional checkpoint is computationally prohibitive under budget constraints. It also tends to globalize the mechanism, making it hard to isolate the specific "behavior of interest" from the rest of the model's dynamics.
