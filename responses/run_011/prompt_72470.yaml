      *(Refining the "Concession")*: The prompt asks which side the monitor should concede. Should it miss substitutions to avoid false positives on drift? Or flag drift to catch substitutions? Given "safety-relevant," false negatives (missing substitution) are worse. But if *every* drift flags, the monitor is useless. The concession must be: Accept that "Mechanism Identity" is not a binary property over time, but a *distance metric* that requires a policy threshold. The tension isn't solvable; it's manageable via risk tolerance.

      *(Refining the "Most Exclusionary")*: Is it Operationalizability or Causal Specificity? Causal Specificity excludes geometric accounts. Operationalizability excludes full causal accounts. Operationalizability is harder because it limits the *method*, not just the *definition*. I will argue Operationalizability is the bottleneck.

  7.  **Final Review against Prompt Constraints:**
