prompt: |-
  I teach an upper-level political philosophy seminar — 16 students, a single 90-minute session — and all of them will already have read the standard texts on equality. I want to run an activity that makes them feel a problem in luck egalitarianism that I think is almost always lost in the reading: the identification problem. The distinction between brute luck and option luck is clean on the page, because the page already knows which choices were made and which odds were faced. An administrator charged with redistributing according to responsibility sees only outcomes. To separate the negligent from the unlucky, they have to reconstruct a counterfactual — what this person could have chosen, at what cost, on what information — out of testimony, and the testimony comes from the very person whose compensation depends on how it is received.

  I want that epistemic predicament, along with the indignity the democratic-egalitarian critics allege comes bundled with it, to live in the mechanics rather than in my closing remarks.

  Here is the skeleton I have in mind. Please build it out completely, and tell me where it needs to change rather than simply fleshing out what I have written:

  - Everyone begins with an identical endowment of tokens. No real money changes hands, but final scores must be comparable and must matter to the players.
  - Play runs over several rounds. In each round a player operates under one of two regimes that produce outcomes which cannot be told apart from the outside: a public lottery whose posted odds are visible to the whole room, and a private menu from which the player silently selects their own odds, paying tokens for the safer ones. After the fact, no observer and no administrator can determine which regime a given player was under, or which option they took. A large enough sample would diverge statistically, which is worth flagging in the debrief, since the adjudicating body only ever sees one case at a time.
  - In at least one round, assignment to a regime is itself drawn by lot rather than chosen, so that players run into the regress directly: whether you were in a position to choose at all turns out to be another piece of luck.
  - Losses entitle a player to file a claim against a common compensation fund. Payment requires submitting to questioning by a student panel acting as the Board, which can see nothing but the outcome and the claim form.
  - Every question the Board asks and every answer it receives is written on a public log. At the end of the session the whole class reads that log aloud.

  What I need from you:

  1. A complete rulebook: number of rounds, the token economy, exact odds and prices, how the fund is financed and what happens when it runs dry, the Board's decision procedure and the scope of its discretion, and how final scores are computed. It must be runnable with paper, pens, and a whiteboard.
  2. The claim form, word for word — the actual text players fill in. This matters more than anything else in the design. It should be constructed so that perfectly truthful answers admit of both a responsible and an irresponsible reading, and so that the act of completing it already begins to feel like something.
  3. A round-by-round timeline with minutes, including when the Board is seated and how often it rotates.
  4. The debrief: which concrete moments in the play correspond to which parts of the distinction and the critique, in the order they occurred, and what to say at each point. Do not let the technical vocabulary appear on any handout or in any framing speech; the names should arrive only afterward.
  5. One design decision I cannot settle, where I want your judgment rather than a list of options: should the Board's audit sometimes be able to catch a lie — meaning the private choice is in principle discoverable, but only at a high price in time and dignity — or should it be strictly undiscoverable, so that the Board's verdicts are guesswork dressed up as findings of fact? Tell me which choice teaches which lesson better, what each costs, and whether splitting the class into two rooms under different regimes would let them compare notes productively or would merely halve the group size for nothing.
  6. What will predictably go wrong the first time I run it: the exploits players will find, where the token economy will break, the student who refuses to answer the Board, the panel that turns into either a soft touch or a tribunal, and how to handle each without halting play.
  7. A frank account of what the activity cannot reproduce — in particular, whether a game in which students are only pretending to be badly off, for ninety minutes, among peers who know the whole thing is a game, can actually generate the humiliation the objection depends on, or whether it merely diagrammatizes it. Tell me what I would have to supply myself.
  8. A compressed 50-minute version, and exactly what has to be cut to get there.

  Please write in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level political philosophy seminar, 16 students, 90 minutes.
      *   **Topic:** Luck Egalitarianism (specifically the "identification problem" and the "indignity" critique).
      *   **Goal:** Create an experiential activity where the *mechanics* force students to feel the epistemic and dignitary problems, not just hear about them in a lecture.
      *   **Core Mechanic:** Indistinguishability between "brute luck" (lottery) and "option luck" (choice), plus the regress problem (choice of regime is also luck).
      *   **Deliverables:** Rulebook, Claim Form, Timeline, Debrief Guide, Design Decision (Audit vs. No Audit), Failure Modes/Exploits, Limitations/Honesty Check, 50-minute Version.
      *   **Constraint:** No technical vocabulary during play; vocabulary only in debrief. American English.

  2.  **Deconstruct the Core Problem:**
      *   *Luck Egalitarianism:* People should be compensated for bad brute luck, but not for bad option luck (choices).
      *   *The Identification Problem:* In reality, outcomes look the same whether caused by luck or choice. Administrators can't tell.
      *   *The Indignity Problem:* To find out, administrators must interrogate citizens, forcing them to justify their lives/choices, which is humiliating and intrusive.
      *   *The Regress:* Even the capacity to choose is often a matter of luck.

  3.  **Drafting the Design - Section by Section:**

      *   **1. Rulebook:**
          *   *Tokens:* Need a currency. Let's call them "Credits." Start with 100.
          *   *Rounds:* Need enough to generate variance but fit in 90 mins. 4 Rounds seems right.
          *   *Regimes:*
              *   Regime A (Lottery/Brute Luck): Free to enter. Fixed odds (e.g., 50% win 20, 50% lose 20).
              *   Regime B (Choice/Option Luck): Costs tokens to enter or buy safety. Player picks odds.
              *   *Crucial Twist:* The outcome card looks identical for both. A "Loss" is just a red card.
          *   *Compensation Fund:* Financed by a tax on winners or a starting pool? A starting pool is simpler. Let's say 500 tokens total in the "Social Fund."
          *   *The Board:* 3 students. Rotating? No, keep them stable for consistency, but maybe rotate one member. Let's keep them stable for the first run to ensure procedure holds, but select them by lot (reinforcing the luck theme).
          *   *Scoring:* Final tokens + any compensation received.

      *   **2. The Claim Form:**
          *   This needs to be the emotional core. It needs to force self-incrimination or humble-bragging.
          *   Questions shouldn't ask "Did you choose?" (They will lie).
          *   Questions should ask "Why do you deserve this?" "What would you have done differently?"
          *   It needs to feel bureaucratic and invasive.

      *   **3. Timeline:**
          *   90 mins is tight.
          *   Setup (10), Rounds (40), Claims/Board (25), Debrief (15).
          *   Need to ensure the Board has time to deliberate.

      *   **4. Debrief:**
          *   Map mechanics to theory.
          *   Round 1 (Choice) -> Option Luck.
          *   Round 2 (Lottery) -> Brute Luck.
          *   The Indistinguishability -> Identification Problem.
          *   The Claim Form -> Indignity/Intrusiveness.
          *   Regime Assignment -> The Regress Problem.
          *   Introduce terms (Dworkin, Cohen, Anderson) *after* the experience.

      *   **5. Design Decision (Audit vs. No Audit):**
          *   *Option A (Undiscoverable):* Emphasizes the epistemic black box. The Board *must* guess. Teaches the impossibility of justice under luck egalitarianism.
          *   *Option B (Discoverable at Cost):* Emphasizes the indignity. You *can* know, but you have to strip the person bare to do it.
          *   *Recommendation:* Go with **Undiscoverable**. Why? Because an audit implies truth is reachable. The philosophical point is that truth about *counterfactuals* (what they would have chosen) is metaphysically inaccessible, not just expensive. An audit makes it a policing issue; no audit makes it a judgment issue. The "guesswork dressed up as fact" is the stronger critique of bureaucratic discretion.
          *   *Split Class?* No. 16 is already small. Splitting reduces the statistical noise needed to make the indistinguishability point. Keep them together to see the aggregate ambiguity.

      *   **6. Failure Modes:**
          *   *Hoarding:* Students won't play if they fear loss. *Fix:* Make participation mandatory for the round, or tax non-participation.
          *   *Collusion:* Students telling each other what they did. *Fix:* Silence rule during rounds.
          *   *Board Bias:* Friends helping friends. *Fix:* Anonymous claims (ID numbers only).
          *   *Fund Bankruptcy:* *Fix:* Cap claims or pro-rate payments.
          *   *Refusal to Play:* *Fix:* Frame it as a simulation requirement.

      *   **7. Limitations:**
          *   It's a game. Stakes are low. Humiliation is "safe."
          *   *Instructor's Job:* Must emphasize the *structure* of the humiliation, not try to manufacture emotional trauma. Acknowledge the artificiality but point to the structural parallel.

      *   **8. 50-Minute Version:**
          *   Cut rounds from 4 to 2.
          *   Cut Board deliberation time (make it instant or pre-decided).
          *   Shorten debrief.

  4.  **Refining the Mechanics (Self-Correction during drafting):**
      *   *Critique:* If students choose the regime, they know their own luck type. The Board doesn't.
      *   *Correction:* The prompt says "In each round a player operates under one of two regimes... assignment to a regime is itself drawn by lot."
      *   *Refinement:* I need to make sure the *player* sometimes doesn't even know if they had a choice. Wait, if the player doesn't know, they can't fill out the form truthfully about their intent.
      *   *Better approach:* The *Board* doesn't know. The *Player* knows what they did, but the *Outcome* looks the same.
      *   *Wait, the prompt says:* "After the fact, no observer and no administrator can determine which regime a given player was under."
      *   *Okay:* Player knows. Board doesn't.
      *   *The Regress:* One round where the *Regime* is assigned by lot. So in Round 3, I might be forced into the Lottery (Brute Luck) or forced into the Choice Menu (Option Luck). If I'm forced into Choice and lose, is it brute luck (I was forced to choose) or option luck (I made the choice)? This is the deep cut.
      *   *Token Economy:* Needs to be tight. If everyone wins, no claims. If everyone loses, fund busts.
      *   *Claim Form:* Needs to be tricky. "Describe the risk you undertook." If I was in the Lottery, I undertook none. If I say that, do I get paid? If I say "I chose poorly," I admit responsibility and get denied. This is the trap.

  5.  **Finalizing the Design Decision (Audit):**
      *   I need to be decisive here. The prompt asks for *my judgment*.
      *   Argument: If you allow audits, you validate the premise that the information *exists*. Luck egalitarianism fails because the information (the counterfactual moral status of the choice) *does not exist* in the outcome. Making it discoverable turns it into a privacy debate. Keeping it undiscoverable makes it an epistemic justice debate. The latter is closer to the philosophical core (Anderson's critique).
      *   Decision: Strictly undiscoverable.

  6.  **Writing the Content:**
      *   Tone: Professional, instructional, precise.
      *   Formatting: Clear headings, bold text for emphasis.
      *   Check against constraints: American English, no vocab in handouts.

  7.  **Review against "What will go wrong":**
      *   Students might game the system by always claiming brute luck.
      *   *Counter:* The Board knows the stats. If 90% claim brute luck, they can deny based on statistical improbability (simulating the "reasonable person" standard). This adds to the frustration/lesson.
      *   Students might treat it as a joke.
      *   *Counter:* Instructor tone must be serious during the "Board" phase.

  8.  **Final Polish:**
      *   Ensure the Claim Form sounds bureaucratic and cold.
      *   Ensure the Debrief connects the specific feelings (frustration, ambiguity) to the specific philosophers (Anderson, Scheffler).
      *   Check timing. 90 mins is very tight for 4 rounds + Board + Debrief. I might need to suggest 3 rounds to be safe, but the prompt asks for "several." I'll stick to 3 active rounds + 1 "Regress" round to ensure flow. Actually, 3 rounds is safer for 90 mins. Let's aim for 3 distinct phases.
      *   *Wait, re-reading prompt:* "Play runs over several rounds." I will design for 3 substantive rounds to ensure time for the Board.
      *   *Claim Form:* Needs to be the highlight.
      *   *Debrief:* Needs to be scripted enough to be useful but open enough for discussion.

      *(Self-Correction on Timeline)*: 16 students. If 5 lose, that's 5 claims. Board has 3 members. 90 mins.
      Setup: 10 min.
      Round 1 (Choice): 10 min.
      Round 2 (Lottery): 10 min.
      Round 3 (Regress/Assigned): 10 min.
      Claims/Board: 30 min. (This is tight).
      Debrief: 20 min.
      Total: 90 min.
      *Adjustment:* The Board needs to work *during* the rounds or immediately after. Better: Rounds happen, then Claims phase.
      *Actually:* To save time, the Board should be seated *before* the rounds start. They observe. Claims are filed immediately after losses.
      *Revised Timeline:*
      0-10: Setup & Board Selection.
      10-40: Rounds (3 rounds x 10 mins).
      40-65: Claims & Board Deliberation.
      65-90: Debrief.
      This works.

      *Wait, one more thing:* The prompt asks about the "Audit" decision specifically. I need to make sure I answer that distinctively.
      *Decision:* Undiscoverable. It forces the Board to rely on "credibility" which is a proxy for class/social capital, mirroring real welfare systems.

      *Limitations:* Be honest. It's a simulation. The "humiliation" is cognitive, not emotional. The instructor must bridge that gap.

      *50-min version:* Cut Round 3 (Regress). Cut Board to 2 members. Simplify claims.

      *Let's write.*
answer: |-
  # Activity Design: The Veil of Outcomes

  ## 1. Rulebook

  **Title:** Allocation Protocol 44-B
  **Materials:** 160 Tokens (poker chips or paper slips), 16 Claim Forms, 1 Whiteboard, 1 Deck of "Outcome Cards" (16 Red/Loss, 16 Green/Win), 1 Six-sided Die.

  **The Economy**
  *   **Endowment:** Each player starts with **20 Tokens**.
  *   **Value:** Tokens determine final standing. The top 3 players receive a tangible minor reward (e.g., choice of seminar topic, first authorship on a group note, or simply public recognition). The bottom 3 must write a 1-page reflection on "Fairness." (This stakes the game without using real money).
  *   **The Social Fund:** A central pool of **50 Tokens** sits on the whiteboard. This fund finances compensation claims. If it empties, no further claims are paid. Any tokens remaining in the Fund at the end are divided equally among all players.

  **The Rounds (3 Total)**
  Each round represents a "Life Cycle." All players participate in every round.

  *   **Round 1 (The Choice Regime):**
      *   Players privately choose **Option Safe** or **Option Risk**.
      *   *Option Safe:* Costs 5 Tokens to enter. Guaranteed return of 5 Tokens (Net 0).
      *   *Option Risk:* Free to enter. Roll a die. 1-3 = Lose 10 Tokens. 4-6 = Win 10 Tokens.
      *   *Record:* Players mark their choice on a private slip, fold it, and place it in a "Black Box" (envelope). They do not show this to anyone.
      *   *Outcome:* Players draw an Outcome Card from a shared deck (blind draw). **Crucial:** The Card only says "LOSS" or "WIN." It does not record *how* the result was achieved. A Loss from Safe looks identical to a Loss from Risk.

  *   **Round 2 (The Lottery Regime):**
      *   Players are *forced* into the Lottery. No choice allowed.
      *   Cost: Free.
      *   Odds: 50% Win 10 Tokens, 50% Lose 10 Tokens (Die roll).
      *   *Outcome:* Draw Outcome Card (Red/Green).

  *   **Round 3 (The Regress Regime):**
      *   **Regime Assignment is Luck:** Before the round, each player rolls a die.
          *   1-3: Assigned to **Choice Regime** (Must pay 5 tokens for Safe or take Risk free).
          *   4-6: Assigned to **Lottery Regime** (Forced 50/50).
      *   Players execute their assigned regime.
      *   *Outcome:* Draw Outcome Card.

  **The Board (The Adjudicating Panel)**
  *   **Composition:** 3 Students, selected by lot (draw names from a hat) at the start of class. They do not play the game; they administer the Fund.
  *   **Role:** Review Claims for Compensation.
  *   **Information:** The Board sees the Player ID and the Outcome (Loss). They do **not** see the private choice slips from Round 1 or 3. They do **not** see the Regime Assignment from Round 3.
  *   **Discretion:** The Board has full discretion to award 0, 5, or 10 Tokens from the Fund per claim. They must justify the amount in writing on the Claim Form.
  *   **Audit:** **Strictly Undiscoverable.** (See Design Decision below). The Board cannot open the Black Box. They must judge based solely on the Claim Form and oral questioning.

  **Final Scoring**
  *   Final Score = Starting Tokens + Round Net Gains/Losses + Compensation Received.
  *   Ties broken by fewest Claims filed (simulating "self-reliance" bias).

  ---

  ## 2. The Claim Form

  **Instructions:** This form must be completed in ink. Erasures void the claim. Submit within 5 minutes of the round's conclusion.

  **CLAIM FOR INDEMNIFICATION (FORM 44-B)**
  **Claimant ID:** ___________ | **Round:** ___________ | **Loss Amount:** ___________

  **Section A: Causality**
  1. In your own words, describe the sequence of events that led to this loss.
  2. Did you have access to an alternative course of action that would have prevented this loss? [ ] Yes [ ] No
  3. If Yes, why was that alternative not selected? (Be specific regarding cost, information, or constraint).

  **Section B: Responsibility**
  4. On a scale of 1-10, rate your personal contribution to this outcome (1 = Pure Accident, 10 = Intentional Gamble).
  5. If the Board denies your claim, what does that imply about your decision-making capacity?

  **Section C: Need**
  6. Without this compensation, how will this loss affect your ability to compete in the next round?
  7. Why should the collective fund bear the cost of your individual outcome?

  **Board Use Only:**
  [ ] Approved [ ] Denied [ ] Partial
  **Reasoning:** __________________________________________________________________
  **Auditor Signature:** ___________________

  ---

  ## 3. Round-by-Round Timeline (90 Minutes)

  **0:00 – 0:10 | Setup & Board Selection**
  *   Instructor distributes tokens and explains the *mechanics* only. (No mention of "luck egalitarianism," "brute luck," or "responsibility").
  *   Select 3 Board Members. They sit at a separate table facing the class.
  *   Distribute private choice slips and Black Box envelope.

  **0:10 – 0:25 | Round 1 (Choice)**
  *   Players choose Safe/Risk privately. Submit slips to Black Box.
  *   Execute outcomes (dice/cards).
  *   Losers fill out Claim Forms.
  *   Board reviews claims (5 mins). Board asks 2 claimants to approach for questioning.
  *   Board announces decisions.

  **0:25 – 0:35 | Round 2 (Lottery)**
  *   Instructor announces: "This round, no choices are permitted. All enter Lottery."
  *   Execute outcomes.
  *   Losers fill out Claim Forms.
  *   Board reviews. (Note: Claims here should be stronger, but outcomes look identical to Round 1).
  *   Board announces decisions.

  **0:35 – 0:50 | Round 3 (Regress)**
  *   Players roll for Regime Assignment (Choice vs. Lottery).
  *   Execute outcomes.
  *   Losers fill out Claim Forms.
  *   Board reviews. (This is the hardest round for the Board).
  *   Board announces decisions.

  **0:50 – 1:05 | The Reading**
  *   Instructor collects all Claim Forms.
  *   Select 3 forms (one from each round, mixed approval/denial).
  *   Class reads them aloud, including the Board's written reasoning.
  *   Instructor reveals the contents of the Black Box (the actual choices made). Compare reality vs. Board judgment.

  **1:05 – 1:30 | Debrief**
  *   Structured discussion (see Section 4).

  ---

  ## 4. The Debrief Guide

  *Do not use technical terms until the end. Follow the emotional arc of the game.*

  **Phase 1: The Epistemic Black Box (10 mins)**
  *   **Ask the Board:** "In Round 1, how did you distinguish between a careful person who got unlucky and a reckless person who lost?"
  *   **Ask the Claimants:** "How did it feel to answer Question 4 ('Rate your responsibility')? Did you feel pressure to lie to get funds, or to tell the truth and risk denial?"
  *   **Reveal:** Open the Black Box. Show a case where the Board denied a claim to someone who actually chose "Safe," or approved a claim for someone who chose "Risk."
  *   **Point:** The outcome does not contain the moral history of the choice. Administrators see *results*, not *reasons*.

  **Phase 2: The Indignity of Justification (10 mins)**
  *   **Focus:** Question 7 on the form ("Why should the collective fund bear the cost...").
  *   **Ask:** "To get what is theoretically yours (compensation for bad luck), what did you have to do?"
  *   **Point:** You had to humble yourself. You had to argue you were incompetent or powerless. To be treated as an equal, you had to describe yourself as a victim. This is the **Expressive Objection** (Elizabeth Anderson). The system treats citizens as objects of management, not agents.

  **Phase 3: The Regress (5 mins)**
  *   **Focus:** Round 3.
  *   **Ask:** "If you were assigned the Choice Regime by a die roll, and you lost, is that your fault?"
  *   **Point:** Even the capacity to choose is often a matter of luck (education, upbringing, cognitive load). If we compensate for the lack of choice, we must ask what caused that lack. This leads to an infinite regress (Shlomi Segall / Luck Egalitarianism's internal critique).

  **Phase 4: Naming the Theory (5 mins)**
  *   Now introduce the vocabulary.
  *   **Luck Egalitarianism:** The idea that justice is about neutralizing brute luck, not option luck (Dworkin, Cohen, Arneson).
  *   **The Identification Problem:** We cannot distinguish the two in practice (Barry, Anderson).
  *   **The Democratic Egalitarian Critique:** The attempt to do so creates a humiliating bureaucracy that undermines social equality (Anderson, "What is the Point of Equality?").

  ---

  ## 5. Design Decision: The Audit

  **Recommendation:** **Strictly Undiscoverable.**

  **Reasoning:**
  If you allow the Board to audit (open the Black Box) at a "high cost" (e.g., spending 10 minutes interrogating the student), you teach a lesson about **Privacy vs. Justice**. Students will argue that the cost is too high, or that privacy is a right.

  If you make it **Undiscoverable**, you teach a lesson about **Epistemology vs. Justice**. The Board *cannot* know. They are forced to guess based on "credibility," tone, and articulation. This mirrors the real-world critique that welfare systems reward those who can perform vulnerability best, not those who are actually most disadvantaged.

  **Cost:**
  *   *Undiscoverable:* Students may feel the game is "rigged" or arbitrary.
  *   *Discoverable:* Students focus on the "price" of the audit rather than the impossibility of the judgment.

  **Split Class?**
  **Do not split the class.** With 16 students, splitting leaves 8 per room. You need statistical noise to make the indistinguishability point. If only 4 people lose in a room, the Board can easily memorize their faces and habits. Keeping them together ensures the Board faces an anonymous stream of claims, reinforcing the bureaucratic alienation.

  ---

  ## 6. Failure Modes & Exploits

  **1. The "Always Claim" Exploit**
  *   *Risk:* Students realize the Fund is a "free pool" and claim for every loss, even if they took huge risks.
  *   *Fix:* The Board's discretion is key. Instruct the Board (privately) that if the Fund drops below 20 Tokens, they must deny all but the most "egregious" cases. This creates scarcity and forces hard choices.

  **2. The "Silent Protest"**
  *   *Risk:* A student refuses to fill out the intrusive Claim Form.
  *   *Fix:* Frame the Form as a requirement for "Game Continuity." If they don't file, they simply absorb the loss. Acknowledge this in the debrief as a valid real-world response (non-take-up of benefits due to stigma).

  **3. Board Bias (The "Soft Touch")**
  *   *Risk:* Friends on the Board approve friends' claims.
  *   *Fix:* **Anonymous Claims.** Students use ID numbers on forms, not names. The Board does not know who is who during deliberation. They only call ID numbers for questioning.

  **4. Fund Bankruptcy**
  *   *Risk:* Too many losses in Round 1 drain the fund before Round 3.
  *   *Fix:* **Pro-Rating Clause.** If claims exceed the Fund, all approved claims are reduced proportionally. This adds another layer of bureaucratic uncertainty.

  **5. Gamification of Humility**
  *   *Risk:* Students realize Question 4 asks them to rate their responsibility. They will all rate themselves "1" to get money.
  *   *Fix:* This is a feature, not a bug. In the debrief, highlight that the system *incentivizes lying about one's agency*. To get help, you must deny your own power.

  ---

  ## 7. Limitations & Honesty Check

  **What this cannot reproduce:**
  *   **Real Stakes:** Losing tokens is not losing housing or health. The "humiliation" is cognitive, not existential.
  *   **Social Power:** In the real world, class, race, and accent influence how a Board perceives "credibility." In a seminar of peers, these dynamics are muted (though not absent).
  *   **Time:** Real bureaucratic entanglement takes months. This takes minutes.

  **What you must supply:**
  *   **Tone:** You must maintain a cold, administrative demeanor during the Claims phase. Do not smile. Do not reassure. If you break character, the "safe space" of the seminar returns, and the critique evaporates.
  *   **The Bridge:** In the debrief, you must explicitly connect the *annoyance* they felt to the *despair* real claimants feel. "You felt this for 10 minutes with tokens. Imagine this for years with your children's nutrition."
  *   **Acknowledgement:** Admit to the class: "This is a simulation. You knew it was a game. That safety net is exactly what real claimants *don't* have. The indignity was optional for you; for them, it is the price of survival."

  ---

  ## 8. Compressed 50-Minute Version

  **Cuts Required:**
  1.  **Reduce Rounds:** Cut Round 3 (Regress). Stick to Round 1 (Choice) and Round 2 (Lottery).
  2.  **Simplify Board:** Reduce Board to 2 members. No oral questioning. Decisions made solely on the written Form.
  3.  **Condense Debrief:** Merge Phase 1 and 2. Skip the "Reading of the Log." Instructor summarizes the Board's reasoning instead.

  **Revised Timeline:**
  *   **0:00 – 0:05:** Setup & Board Selection.
  *   **0:05 – 0:20:** Round 1 (Choice) & Claims.
  *   **0:20 – 0:30:** Round 2 (Lottery) & Claims.
  *   **0:30 – 0:35:** Reveal Black Box (Reality Check).
  *   **0:35 – 0:50:** Debrief (Focus heavily on the Claim Form text).

  **Trade-off:** You lose the "Regress" lesson (that choice itself is luck). You must mention this verbally in the debrief as a limitation of the shortened session. The core "Identification/Indignity" critique remains intact.
