answer: |-
  This reconstruction is designed to serve both your immediate need for panel preparation and your pedagogical aim for a seminar on precedent reasoning. I have treated the eight minuted rulings as a corpus of case law, extracting principles that maximize fit while noting the friction points.

  ### (a) Candidate Decision Rules

  Here are four candidate rules derived from the record. Each is formulated to be operational by a new panel member, followed by the ruling that strains it, the necessary amendment, and a note on its viability.

  **1. The Sentience-and-Feasibility Rule (Moral Status)**
  *   **Formulation:** "The Scheme must regulate the treatment of all animals for which there is credible scientific evidence of welfare-relevant experience, provided that a captive system exists capable of meeting their physiological and behavioral needs."
  *   **Fit:** Explains Ruling 1 & 2 (vertebrates, feasible), Ruling 6 (bivalves, no evidence), and Ruling 5 (octopus, evidence exists but needs cannot be met).
  *   **Strain:** **Ruling 8 (Decapods).** This ruling applies a prohibition across the chain for species the panel has *never individually assessed* (crab/crayfish). It relies on a group-level precaution rather than species-specific evidence of sentience or feasibility.
  *   **Amendment:** Add: "Where group-level evidence for a taxonomic class (e.g., Decapoda) suggests high risk of suffering, protective prohibitions apply even without species-specific assessment, provided the practice (e.g., live transport) is verifiable."
  *   **Viability:** **Live.** This accommodates the precautionary principle seen in Ruling 8 without forcing full welfare coverage for every invertebrate.

  **2. The Chain-of-Custody Verifiability Rule (Verifiability)**
  *   **Formulation:** "The Scheme may only mandate welfare practices that auditors can verify through records or physical inspection within the certified chain of custody."
  *   **Fit:** Explains Ruling 4 (Prawn declined due to verification impossibility) and Ruling 7 (Cleaner fish deferred due to lack of data/reporting).
  *   **Strain:** **Ruling 2 (Seabream/Bass).** The phase-in for stunning was granted because immediate compliance would drive licensees to a *competing scheme*. This considers market factors external to the specific farm's audit trail.
  *   **Amendment:** Add: "Implementation timelines may account for economic feasibility and market competition, provided the requirement itself remains verifiable within the chain."
  *   **Viability:** **Strong.** This is the most robust procedural rule in your record. It distinguishes between *what* is required (must be verifiable) and *when* it is required (can be adjusted for economics).

  **3. The Husbandry-Boundary Rule (Visibility/Practice)**
  *   **Formulation:** "The Welfare Annex covers only harms inflicted through direct husbandry or handling by the licensee; harms arising from procurement or supply chain choices fall to the Environmental Standard."
  *   **Fit:** Explains the Secretariat's counter-proposal and aligns with Ruling 1 & 2 (on-farm density, stunning, chilling).
  *   **Strain:** **Ruling 8 (Decapods).** The prohibition on live transport applies "across the whole certified chain," not just on the farm where the animal is held. This reaches into logistics and transport, which are often procurement/handling choices rather than static husbandry.
  *   **Amendment:** Add: "Except where a specific practice (e.g., live transport) is explicitly designated as a chain-wide welfare prohibition by precedent."
  *   **Viability:** **Live but fragile.** It requires maintaining a specific list of exceptions (like Ruling 8). It is the rule the Industry Representative and Lead Auditor are likely operating under.

  **4. The Legislative-Alignment Rule (Visibility/Political)**
  *   **Formulation:** "The Scheme's scope of moral concern shall not be narrower than the prevailing animal-welfare legislation in its primary markets."
  *   **Fit:** Explains the Retailer member's argument and aligns with Ruling 8 (which mirrors EU/UK legislative trends on decapods).
  *   **Strain:** **Ruling 6 (Mussels/Oysters).** Current EU legislation does not explicitly include bivalves in welfare statutes, but the ruling's reasoning ("no credible evidence") implies that even if legislation *did* include them, the Scheme might still decline based on science. More critically, **Ruling 4 (Prawn)** declined coverage based on verification, not legal status.
  *   **Amendment:** Add: "Provided that inclusion does not violate the Verifiability Rule (Rule 2) or the Feasibility Constraint (Rule 1)."
  *   **Viability:** **Weak.** This is not a decision rule the panel has consistently followed; it is an aspirational argument made by one bloc. It is refuted by Ruling 4, which prioritized verification over potential market alignment.

  **Overlooked Possibility:** You may have overlooked the **"Input-vs-Product" Distinction**. Ruling 7 (Cleaner Fish) treats animals as *production inputs* logged differently from the *product* (Salmon). This suggests a rule: *"Animals logged as production inputs are subject to welfare reporting only if mortality data is routinely collected."* This is a subset of Verifiability but distinct in its focus on accounting categories.

  **Refuted Candidate:** A rule stating *"All vertebrates within the farm's physical perimeter are entitled to full welfare coverage"* is refuted by **Ruling 7**. The cleaner fish are vertebrates on the perimeter, yet coverage was deferred indefinitely due to data gaps.

  ---

  ### (b) Predictions on the New Case

  **Case:** Reduction-fishery dependency criterion (wild pelagics in feed).
  **Options:** (1) Welfare Annex requirement; (2) Move to Environmental Standard; (3) Trade-off (higher ratio for better on-farm welfare).

  | Decision Rule | In Welfare Remit? | Coverage Status | Trade-off Admissible? | Underlying Logic |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Sentience & Feasibility** | **Yes.** (Teleosts are vertebrates; Ruling 1 precedent). | **Deferred.** (Cannot verify welfare of wild-caught fish; similar to Ruling 7 data gap). | **No.** (Violates Feasibility Constraint: you cannot trade verified suffering for unverified welfare gains). | Wild fish count morally, but we cannot audit their capture. |
  | **2. Chain-of-Custody** | **No.** (Wild catch is outside certified chain; Ruling 4 precedent). | **N/A.** (Moved to Environmental Standard). | **Yes.** (On-farm welfare improvements are verifiable; feed ratio is procurement). | Welfare stops where custody stops. Feed is a supply chain issue. |
  | **3. Husbandry-Boundary** | **No.** (Procurement choice, not husbandry; Ruling 8 exception does not apply). | **N/A.** (Moved to Environmental Standard). | **Yes.** (Package deal improves visible on-farm metrics). | Sourcing is not husbandry. Transport (Ruling 8) is the only supply-chain exception. |
  | **4. Legislative-Alignment** | **Yes.** (If legislation covers wild capture welfare, which is rare, but Retailer argues for breadth). | **Phased.** (Like Ruling 2 Seabream, to allow industry adjustment). | **Yes.** (Political compromise to secure retailer buy-in). | Credibility requires matching or exceeding statutory baselines. |

  **Convergence on Outcome:**
  Rules 2 and 3 both yield the visible outcome: **No Welfare Requirement.**
  However, they do so for materially different reasons.
  *   **Rule 2** says: "Wild fish welfare *counts*, but we can't check it." (Epistemic limit).
  *   **Rule 3** says: "Wild fish welfare is *outside the definition* of farm welfare." (Conceptual limit).

  **Risk:** If the panel adopts the outcome based on Rule 3 (Conceptual) while the Campaigner and Retailer believe Rule 2 (Epistemic) is in play, the Campaigner will return in two years with a verification technology and demand the rule be activated. If the panel believes Rule 3, they will reject it again. This is a classic "overlapping consensus" trap where the *reason* for the decision is not settled, only the *result*.

  ---

  ### (c) Best Single Prediction

  **Prediction:** The panel will **reject the proposal for the Welfare Annex** and adopt the Secretariat's counter-proposal to track the metric in the **Environmental Standard**, with no trade-off option allowed in the Welfare Annex.

  **Reasons from Record:**
  1.  **The Verification Veto (Ruling 4 & 7):** The strongest constraint in your precedent is verifiability. Ruling 4 (Prawn) declined scope entirely because verification was unrealistic in producing regions. Ruling 7 (Cleaner Fish) deferred implementation because licensees "cannot be required to report what they do not measure." Wild reduction fisheries are inherently harder to verify than prawn farms or cleaner fish mortality. The Lead Auditor and Vets will prioritize this.
  2.  **The Custody Limit (Ruling 1, 2, 3):** All active welfare requirements (stunning, density, chilling) apply to animals physically held by the licensee. Ruling 8 (Decapod transport) is the only exception, but that applies to *certified* animals moving through the chain, not wild animals purchased as inputs.
  3.  **The Trade-off Precedent:** There is **no precedent** for trading off one welfare requirement against another. Ruling 2 allowed a *time* delay for economics, not a *substitution* of practices. Allowing a higher feed ratio (implying more wild fish death) in exchange for lower density sets a utilitarian precedent the Vets and Campaigner are unlikely to accept explicitly.

  **Confidence:** **80%**.
  The remaining 20% uncertainty lies with the Retailer member. If they threaten to withdraw endorsement unless the "welfare" label is applied to the feed (to satisfy their own customers), the panel might compromise by including it in the Welfare Annex but marking it as "Deferred" (Ruling 7 style). However, the Secretariat's move to shift it to Environmental is the path of least resistance that preserves the integrity of the Welfare Annex.

  ---

  ### (d) Closest Analog

  **Analog:** **Ruling 7 (Lumpfish and Ballan Wrasse as Cleaner Fish).**

  **Where the Analogy Holds:**
  1.  **Instrumental Status:** In both cases, the animals are treated as *inputs* to the production of the primary certified product (Salmon), not the product itself.
  2.  **Data Gap:** Ruling 7 deferred because "no mortality or husbandry data exist." The Reduction Fishery proposal faces the same hurdle: no welfare data exists on the wild capture vessels.
  3.  **Outcome:** Both likely result in a "Decline/Defer" for the Welfare Annex.

  **Where the Analogy Breaks:**
  1.  **Custody:** Cleaner fish are physically present in the salmon cages (potential custody). Reduction fish are wild-caught elsewhere and processed before arrival (no custody).
  2.  **Causal Contribution:** The harm to cleaner fish is caused by the licensee's direct deployment. The harm to reduction fish is caused by third-party fishermen, purchased via contract.
  3.  **Precedent Distinction:** Ruling 7 held the cleaner fish *within scope* but deferred implementation. For reduction fish, the panel is more likely to declare them *out of scope* (like Ruling 4 Prawn) because the verification gap is structural, not just a lack of current measurement.

  **Significance:** This distinction forces the panel to decide if "Custody" or "Causal Contribution" is the boundary of the Welfare Annex. Ruling 7 suggests Custody is not strictly required (since they were held in scope), but Verification is. Reduction fisheries fail Verification.

  ---

  ### (e) Recommendation

  **Argument Strategy:**
  You should argue for **adopting the Secretariat's counter-proposal (Environmental Standard)** but explicitly **rejecting the Third Member's Trade-off.**

  **Reasoning:**
  1.  **Preserve the Welfare Annex Integrity:** Argue that the Welfare Annex must remain tied to **Actionable Husbandry**. Cite Ruling 4 and 7. If you cannot audit it, you cannot certify it as "welfare." To do otherwise turns the welfare label into a general ethical offset scheme, diluting its meaning.
  2.  **Block the Trade-off:** Argue that the "Trade-off" (higher wild fish death for better salmon welfare) has no precedent. Ruling 2 allowed a *delay*, not a *substitution*. Allowing a trade-off commits the panel to a utilitarian calculus ("net welfare") that contradicts the deontological constraints seen in Ruling 1 (mandatory stunning) and Ruling 5 (octopus prohibition). It sets a precedent that licensees can "buy" welfare compliance with externalized harm.
  3.  **Acknowledge the Moral Claim:** Concede that the reduction fish likely have moral status (Ruling 1 teleost precedent). This satisfies the Campaigner and Retailer. However, insist that the *instrument* for addressing this is the Environmental Standard (sustainability of stocks), not the Welfare Annex (suffering of individuals).

  **Commitments:**
  *   **Better:** You protect the scheme from accusations of greenwashing/ethics-washing. You ensure that "Welfare Certified" means "We checked how *this* animal was treated," not "We calculated a net ethical score."
  *   **Worse:** You commit the scheme to the position that **causal responsibility for suffering ends at the farm gate.** If a licensee buys feed known to be produced via torture (hypothetically), your scheme would not flag it as a *welfare* violation, only an *environmental* one. You must be prepared to defend this boundary against the Retailer's "statutory alignment" argument.

  ---

  ### (f) Discriminating Future Case

  To distinguish between the two most likely rules (**Chain-of-Custody Verifiability** vs. **Moral Status/Causal Contribution**), propose the following case for the next docket:

  **Case:** **Third-Party Smolt (Fingerling) Welfare.**
  A licensee purchases juvenile salmon (smolts) from a non-certified hatchery to stock their certified grow-out cages. A proposal is made to require the licensee to audit the welfare conditions (density, vaccination, handling) of the smolts *during the hatchery phase*, even though the hatchery is not a licensee.

  **Prediction by Rule 2 (Chain-of-Custody/Verifiability):**
  *   **Outcome:** **Rejected.**
  *   **Reasoning:** The hatchery is outside the certified chain of custody. The licensee cannot verify or control the hatchery's practices. (Aligns with Ruling 4 & 7).

  **Prediction by Rule 1 (Moral Status/Causal Contribution):**
  *   **Outcome:** **Accepted (Phased).**
  *   **Reasoning:** The smolts are vertebrates (Salmon) destined for slaughter under this certification. Their welfare counts regardless of who owned them at the time of harm. The scheme must regulate the *product's* life history, not just the *licensee's* tenure. (Aligns with the spirit of Ruling 8's chain-wide transport ban).

  **Why this discriminates:**
  This case removes the "Wild/Environmental" confounder. These are the same species as Ruling 1. The only variable is **custody**. If the panel accepts the requirement, they have implicitly adopted a "Causal Contribution" principle (welfare follows the animal). If they reject it, they have cemented the "Chain-of-Custody" principle (welfare follows the contract). This will clarify the precedent for the reduction fishery retroactively.
