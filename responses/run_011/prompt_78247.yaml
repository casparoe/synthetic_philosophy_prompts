      *   **Tomas (Control):** Blameworthiness is fixed at the moment of decision based on evidence/intent. She did the same thing twice. The difference is tragedy, not guilt. Feature 2 shows circumstantial luck (development happened), not moral failure. Feature 3 is illusory; we *feel* differently, but desert hasn't changed.
      *   **Feature 2 (Feedback):** Nadia can argue the first decision was negligent *because* it enabled the second disaster (long-term risk). Tomas can argue she couldn't foresee the development specifically, so it's circumstantial.
      *   **Feature 3 (Retrospection):** Nadia argues moral status is temporal/historical. Tomas argues moral status is atomic to the act.
