answer: |-
  The inquiry report lies open between them on the scarred table, the smell of stale coffee and photocopied paper hanging in the air. Outside, the murmur of the gathering crowd filters through the double doors. The public hearing begins in twenty minutes.

  **Tomas:** Procedurally, she is untouchable. Look at page forty-two. Same models, same consultation, same documentation. Eleven years apart. If we hang her for the second storm, we are hanging her for the wind.

  **Nadia:** We are hanging her for the seventeen people who drowned because the pumps were off. You treat the decision as an isolated atom, Tomas. It isn't. Look at Feature Two in the summary. The first decision wasn't just a saved budget; it was a signal.

  **Tomas:** A signal?

  **Nadia:** The authority commended her. The council read that commendation as safety. They built the residential development on the floodplain *because* Ines's first gamble paid off. Her success created the exposure. When she made the second decision, she wasn't just managing water; she was managing a risk she had helped inflate. The first outcome hardened the department's practice. It made them brittle.

  **Tomas:** But she couldn't control the council's zoning laws. That is circumstantial luck. She acted on the evidence available *then*. If you blame her for the housing development, you are blaming her for the actions of other agents over a decade. That dissolves the control principle entirely. If blameworthiness tracks outcomes, then a surgeon is a murderer if the patient has an unknown allergy, but a hero if they don't.

  **Nadia:** I am not talking about unknown allergies. I am talking about the structure of the risk. In year one, she took a risk with public safety to save money. It looked like prudence because the storm veered. In year eleven, the same risk looked like negligence because the storm hit. My claim is that the second outcome reveals the true moral status of the first. It wasn't prudence then; it was a gamble that hadn't yet lost.

  **Tomas:** That implies moral truth is time-relative. That what was right in year one became wrong in year eleven without any change in the act or the agent. That is metaphysically extravagant. Let me precisify where I stand, because I think you are conflating liability with desert. I grant she bears liability. The authority should pay compensation. She should resign. But blameworthiness? That attaches to the quality of her will. Her will was identical in both instances. She intended to manage resources responsibly. Therefore, her desert is identical.

  **Nadia:** You've narrowed "blameworthiness" to "internal intention." I reject that. Blameworthiness is about the objective fittingness of resentment. Can the families resent her? Yes. Is that resentment fitting? If you say no, because her "will" was pure, you are asking them to ignore the reality of their loss. You are saying the deaths are morally inert.

  **Tomas:** I am saying the deaths are tragic, not culpable. There is a difference. Now, look at your claim about the first decision changing status. That is Feature Three. You say the second failure makes the first decision culpable *after the fact*.

  **Nadia:** Exactly. The first decision was objectively risky. The goodness of it was contingent on luck. Now that the luck has run out, we see the risk for what it was.

  **Tomas:** But we knew the risk then. Every engineering decision involves probability.

  **Nadia:** We knew the *probability*, but we didn't know the *reality*. By keeping the pumps off in year one, she validated a policy that put people in harm's way. The second disaster isn't just bad luck; it's the maturity of the seed planted in the first decision.

  **Tomas:** Wait. Are we having a verbal dispute? You keep saying "moral status." I keep saying "quality of will." If I agree that she is liable for compensation, and that we should regulate her differently going forward, what work is "blameworthy" doing for you? Are you just insisting on using a punitive word for a tragic outcome?

  **Nadia:** It's not just a word. If I say she is not blameworthy, I imply she has nothing to repent. But she does. She has to live with the fact that her competence was contingent on the weather. If we say she is blameless, we protect the illusion that competent management guarantees safety. It doesn't.

  **Tomas:** So you want to assign blame to teach a lesson?

  **Nadia:** I want to assign blame because it fits the facts. The fact is seventeen people are dead due to her choice.

  **Tomas:** Okay, let me precisify again. I will concede that social blame—the sanction, the stigma—is inevitable and perhaps useful. But I deny that *moral desert* changes. You are arguing that resultant luck collapses into circumstantial luck. You say the storm hitting changes the circumstances of the first decision retrospectively.

  **Nadia:** I'm saying resultant luck is distinct. It changes the act itself. "Killing seventeen people" is a different act description than "Saving money during a dry storm."

  **Tomas:** But the *volition* was the same.

  **Nadia:** The volition was to accept a risk of death. In the first case, the risk remained abstract. In the second, it became concrete. The concrete realization changes the moral weight of the acceptance.

  **Tomas:** So if I drive drunk and get home safely, I am less blameworthy than if I hit a pedestrian?

  **Nadia:** Yes. Because in the second case, you have actually violated the right to life. In the first, you merely threatened it. The violation matters.

  **Tomas:** But the threat was identical. The disregard for life was identical.

  **Nadia:** The disregard is internal. The violation is relational. Morality is relational.

  **Tomas:** Then we are at an impasse on the architecture of morality. You see it as historical and consequential. I see it as atomic and volitional. Let's look at the feedback loop again, though. You argued the first decision caused the development. If she couldn't foresee the development, how is that her blame?

  **Nadia:** She couldn't foresee the specific houses, but she knew that demonstrating safety encourages exposure. That is standard risk compensation. By claiming safety she didn't possess, she invited the crowd onto the ice.

  **Tomas:** That sounds like negligence in year one, then. Not just bad luck in year eleven.

  **Nadia:** Precisely. The negligence was there in year one, but it was hidden by the success. The second storm didn't create the negligence; it uncovered it.

  **Tomas:** But the inquiry found no procedural fault in year one.

  **Nadia:** Because the inquiry looks at process, not moral truth.

  **Tomas:** (Closes the report) We have five minutes. We aren't going to solve this. But I need to know what would change your mind. What case would make you say outcomes don't matter?

  **Nadia:** If Ines had made the same decision, the storm had hit, but the pumps had failed due to a manufacturing defect unknown to anyone. Then the deaths aren't on her will or her risk assessment. They are on the manufacturer. But here, the pumps were off by her choice. The choice is the cause. What about you? What would make you admit outcomes matter?

  **Tomas:** If she knew the storm was coming. If the evidence was different. But the prompt specifies the epistemic position is identical. Given that constraint, I cannot move. I would need a case where the intention itself was corrupted by the outcome, which is impossible.

  **Nadia:** Then you believe moral luck is impossible by definition.

  **Tomas:** I believe control is the precondition of blame. Without it, you have tragedy, not guilt.

  **Nadia:** And I believe that ignoring the outcome is a way of sanitizing history. We are here for the seventeen dead, not for Ines's conscience.

  **Tomas:** Then we disagree on who this hearing is for.

  **Nadia:** We disagree on whether the world changes the agent, or whether the agent stands apart from the world.

  **Tomas:** (Stands up) Let's go in. The families won't care about our distinction.

  **Nadia:** No. But the record will. And the record needs to say whether she was unlucky, or whether she was wrong.

  **Tomas:** Then let the record show we couldn't agree on the difference.

  They gather the papers. The hum of the crowd rises as they reach for the door handles, the report left open on the table, the gap between the words *tragedy* and *guilt* still bridged by nothing but air.
