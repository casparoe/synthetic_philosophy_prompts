              1.  Epistemic position identical (no new info ignored/dismissed).
              2.  Outcome of 1st decision produced conditions for 2nd (hardened confidence/practice + increased exposure via development).
              3.  Retrospective judgment: Does the 2nd failure change the moral status of the 1st decision?
      *   **Characters:** Nadia (Pro-Moral Luck/Outcome matters for blameworthiness) vs. Tomas (Anti-Moral Luck/Control principle).
      *   **Format:** Dialogue, 1100-1400 words.
