answer: |-
  **To:** Student Council
  **From:** [Your Name/AI Advisor]
  **Re:** Dashboard Metrics & Goodhart's Law

  You're right to be wary. When a measure becomes a target, it ceases to be a good measure. Since this number feeds a league table and parent reports, the pressure to game it will be immense. Here is the breakdown.

  ### 1. Ranking by Gameability (Worst to Best)
  *Score: 10 = Easily gamed, 1 = Robust.*

  1.  **Wellbeing Pulse (10/10)** – *Failure: Number stops meaning anything.*
      Students will self-score 5/5 to avoid stigma or tutor chats. It becomes a compliance tick-box, masking actual crises.
  2.  **Behaviour Points (9/10)** – *Failure: People go after the number.*
      Teachers may stop logging minor issues to protect their tutor group's standing; students will learn exactly how far to push before a point is logged.
  3.  **Predicted vs. Actual Grade (8/10)** – *Failure: Chasing destroys the thing.*
      Teachers inflate predictions early to ensure 'positive trajectory'. Students may sandbag early assessments to lower the baseline.
  4.  **Homework Handed In (7/10)** – *Failure: People go after the number.*
      Copying, AI use, or low-effort submissions skyrocket. Teachers might set less challenging work to ensure 100% completion rates.
  5.  **Screen Monitoring (6/10)** – *Failure: Chasing destroys the thing.*
      Students keep the lesson tab open while working elsewhere (or doing nothing). It measures window management, not cognitive engagement.
  6.  **Attendance % (4/10)** – *Failure: People go after the number.*
      Hardest to fake physically. However, students will come in contagious/ill to avoid dropping the percentage, or 'presenteeism' rises.

  ### 2. Ranking by Harm Caused by Gaming (Most to Least)
  *Score: 10 = High risk to pupil welfare.*

  1.  **Wellbeing Pulse:** Gaming this hides mental health crises. If a student lies to protect the metric, they don't get help.
  2.  **Behaviour Points:** Turns pastoral relationships adversarial. Students view tutors as enforcers; tutors view students as liabilities.
  3.  **Screen Monitoring:** Erodes trust and privacy. Teaches performative compliance over actual learning autonomy.
  4.  **Predicted Grade:** Creates false expectations for universities/parents. Can devastate confidence when reality hits.
  5.  **Homework:** Undermines academic integrity. Learning value is lost, but immediate physical harm is low.
  6.  **Attendance:** Spreads illness, but generally keeps students in the building where safeguarding eyes are on them.

  ### The Recommendation
  **None of them deserve the slot.**

  Putting *any* pastoral metric into a league table/parent report format fundamentally breaks its utility as an early warning system. It shifts the focus from "how do we help this child?" to "how do we keep this number up?".

  **If you are forced to choose:** Pick **Attendance**. It is the only metric where the data is objective (you were either there or you weren't) rather than subjective (teacher judgement, self-report, or algorithmic guesswork). It is the least easily corrupted by human manipulation, even if the incentives are still flawed.

  ### What Would Change My Mind?
  **The Single Fact:** If the data was **never shown to students or parents** and used *strictly* for internal safeguarding triggers without tutor-group comparison.
  *   **Why:** Without the league table/parent report pressure, the incentive to game drops significantly. Teachers and students might treat it as support rather than judgement.
  *   **Where I'm Wobbly:** I'm assuming your staff culture is competitive. If your teachers are highly principled and refuse to game the system regardless of pressure, **Behaviour Points** could work well as a nuanced measure. I'm also assuming students will act rationally to protect themselves; if your cohort is unusually honest, **Wellbeing** could be powerful, though I doubt it.

  **Defence Tip:** In the meeting, don't just say "this is bad". Say: "If we pick Metric X, we will get more of X, not necessarily better outcomes. Attendance is the only one that survives contact with reality, but the league table format is the actual risk."
