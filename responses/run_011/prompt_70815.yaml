answer: |-
  This is one of the sharpest insights into local history I've heard in a long time. You are describing the difference between **history as lived** and **history as filed**. You are absolutely right: it isn't a conspiracy, it's a structural feature of how bureaucracy works.

  Here are the terms you are fumbling for, so you have them in your pocket for the debrief:
  *   **Archival Silence:** The gaps in the record. Not just missing pages, but entire lives that never generated paper.
  *   **Administrative Provenance:** Records are created to run an institution (collect taxes, save souls, punish crime), not to inform the future.
  *   **Carceral Visibility:** The phenomenon where marginalized people only appear in the archive when they are being punished or controlled (police blotters, poor farms).
  *   **Structural Bias:** The skew isn't malicious; it's built into the rules of what counts as "recordable."

  Here is the activity design. It is built to be run with zero budget, using only paper, pens, and a whiteboard. It is designed to survive scrutiny from your local history expert by focusing on *mechanics* rather than *specifics*.

  # Activity Title: The Oakhaven Protocol
  **Concept:** A simulation of how institutional filters turn a community into a collection.
  **Group Size:** 18–20 people.
  **Time:** 90 Minutes.
  **Materials:** Index cards (3 per person), envelopes (1 per Townsperson), pens, a cardboard box (The Archive), a marker.

  ## The Setup (10 Minutes)
  **1. The Split:**
  Divide the room.
  *   **The Town (14 people):** They represent the population.
  *   **The Institutions (6 people):** They represent the Courthouse, Church, Bank, School, Newspaper, Sheriff.
  *   *Note:* Give your local history expert a role in **The Institutions**. Give her the "Newspaper" or "Courthouse." Tell her, "I need you to enforce the rules strictly so the simulation holds water." This makes her a guardian of the logic, not a critic of the fiction.

  **2. The Rules of Oakhaven (1924):**
  Write this on the whiteboard. Do not explain *why* yet.
  *   **Townspeople:** You have a **Life Card**. Write your name, your job, and *three things* you want to accomplish this year (e.g., "Fall in love," "Fix the roof," "Help a neighbor," "Start a business").
  *   **Institutions:** You have a **Ledger**. You may only record events that fit your specific criteria.
      *   *Bank:* Land sales, loans over $500.
      *   *Church:* Marriages, baptisms, funerals.
      *   *Sheriff:* Arrests, disturbances, vagrancy.
      *   *School:* Enrollment, truancy, board meetings.
      *   *Newspaper:* Only events verified by the other Institutions.
      *   *Courthouse:* Wills, lawsuits, deeds.
  *   **The Cost:** To get an event recorded, a Townsperson must physically go to an Institution, present their Life Card, and pay a "Fee."
      *   *Fee:* The Townsperson must cross one of their three goals *off* their card to "pay" for the record. (e.g., To get a marriage license, you must cross off "Fall in love." To get arrested, you cross off "Stay out of trouble.")
      *   *Crucial Rule:* If an Institution says "This doesn't fit our ledger," the Townsperson cannot record it. They keep the goal, but it leaves no trace.

  **3. The Secret Envelope:**
  Give every Townsperson an envelope. They must write their **True History** on a slip (Name + the 3 goals they actually pursued) and seal it. *This is the Answer Key.* No one opens these until the end.

  ## Phase 1: The Living Year (25 Minutes)
  **Action:**
  *   Townspeople mill about. They must approach Institutions to get their life events recorded.
  *   Institutions sit at tables (or corners). They must rigorously enforce the criteria. If someone says "I want to record that I cared for my sick mother," the Church says, "Only if she died. We record funerals, not care." The Sheriff says, "Only if she was a public nuisance."
  *   **The Trap:** Some Townspeople (assign 3 of them secretly as "Laborers" or "Tenants") are told they cannot afford the Bank fees and the Church requires a membership they don't have. Their only open door is the Sheriff (who records anything negative) or the Poor Farm (which you add as a sub-category of the Sheriff).
  *   **The Institutions' Goal:** Fill your Ledgers. Write down every accepted event on an Index Card (The Record). Put it in the Box (The Archive).

  **Facilitator Note:** Walk around. If things are too easy, raise the fees. If a Townsperson is frustrated because they can't get recorded, *do not help them.* That frustration is the lesson.

  ## Phase 2: The Cull (15 Minutes)
  **Action:**
  *   **Stop the Year.** Townspeople step back.
  *   **The Crisis:** Announce: "The Historical Society has a flood. We have lost 60% of our shelf space."
  *   **The Institutions become Archivists:** They must empty the Box and decide what to keep. They can only keep 40% of the Index Cards.
  *   **The Criteria:** Tell them: "Keep the records that tell the most coherent story about the Town's leadership and property."
  *   They will naturally discard the Sheriff's blotter (too messy), the poor farm records (too sad), and anything illegible. They will keep the Bank Deeds and Church Marriages.
  *   The discarded cards go into a trash bag (The Loss).

  ## Phase 3: The Reveal (20 Minutes)
  **Action:**
  1.  **Read the Archive:** The Archivists read the surviving Index Cards aloud. This is now "Official History."
  2.  **Open the Truth:** Townspeople open their Secret Envelopes. They read their **True History** aloud.
  3.  **The Comparison:**
      *   Ask: "Who had a goal that is not in the Official History?" (Most hands will go up).
      *   Ask: "Who appears in the Official History only as a criminal or a debtor?" (The Laborers/Tenants).
      *   Ask: "Who had a goal that *became* a record, but changed meaning?" (e.g., "Help a neighbor" became "Loitering" at the Sheriff's).

  ## The Debrief (20 Minutes)
  Do not lecture. Ask questions that map their experience to your insights.

  **1. On "Random Sample" vs. "Shaped"**
  *   *Ask:* "Looking at the Official History, does it look like a random sample of what happened in Oakhaven?"
  *   *Point:* It looks like a map of the Institutions, not the people. This is **Administrative Provenance**. The records exist to serve the Bank/Church, not the historian.

  **2. On the "Five Things"**
  *   *Ask:* "Townspeople, what did you have to do to get into the Ledger?"
  *   *Point:* You had to buy, marry, sue, die, or get arrested. This is **Structural Bias**. If you didn't do those things, you are historically invisible.

  **3. On Carceral Visibility**
  *   *Ask:* "Laborers/Tenants, where do you appear in the Official History?"
  *   *Point:* Likely in the Sheriff's discard pile or the few surviving arrest records. This is **Carceral Visibility**. You are only findable when you are being policed.

  **4. On The Cull**
  *   *Ask:* "Archivists, why did you throw away the Sheriff's log?"
  *   *Point:* Usually because it was 'messy' or 'negative.' But that was the *only* record some people had. This is **Preservation Bias**.

  **5. On Conspiracy**
  *   *Ask:* "Did anyone in the Institution roles *want* to hide the truth?"
  *   *Point:* No. They were just following the rules of their job. This is why it isn't a conspiracy. It is **Systemic**.

  ## Predictable Failures & Fixes

  **1. The "But I Said It!" Argument**
  *   *Risk:* A Townsperson claims they told the Banker about a land deal, but the Banker says they didn't write it down.
  *   *Fix:* The **Secret Envelope** is the absolute truth. If it's not on an Index Card in the Box, it didn't happen for the Archive. Enforce this ruthlessly. "The Archive does not care about your intent, only your paper trail."

  **2. The Expert Regular**
  *   *Risk:* She says, "In 1924, the Sheriff actually kept better logs than that."
  *   *Fix:* Pre-empt this in the intro. "This is not a simulation of *our* county's specific records. It is a simulation of the *mechanics* of record-keeping. The rules of Oakhaven are simplified to show the structural pressure." If she pushes during the game, say: "Note that for the debrief."

  **3. Chaos/Noise**
  *   *Risk:* 14 people talking to 6 people is loud and confusing.
  *   *Fix:* Use a "Ticket System." Give each Townsperson 3 paper clips. They can only approach an Institution if they have a clip. When they trade a goal, they lose a clip. When clips are gone, they must sit down. This forces scarcity and queuing.

  **4. The "Good Guy" Archivist**
  *   *Risk:* The Archivists try to keep *everything* during the Cull phase because they know it's a game.
  *   *Fix:* Bring a literal smaller box for the "Surviving Archive." Physically show them it is full. "If it doesn't fit, it burns." Make them choose.

  ## What This Activity Cannot Reproduce
  You need to say this out loud at the end, because the game simplifies the pain.

  1.  **The Stakes:** In the game, failing to be recorded is an intellectual frustration. In reality, it meant families losing land claims or inheritance because they couldn't prove kinship. The game is low-stakes; the history was high-stakes.
  2.  **The Time:** We did this in 90 minutes. In reality, this silence accumulated over generations. The "feeling" you have took years to develop; they are getting the punchline in an hour.
  3.  **The Voice:** The game makes the "missing" people visible to us in the debrief. In real life, they are not here to open the envelopes. We never hear their side. We only have the silence.

  ## Minute-by-Minute Plan

  *   **00-10:** Intro, Split Groups, Distribute Cards/Envelopes. Write Rules on Whiteboard.
  *   **10-35:** **Phase 1 (The Living Year).** Townspeople negotiate with Institutions. Institutions write Index Cards.
  *   **35-40:** Transition. Collect Index Cards in Big Box. Townspeople sit down.
  *   **40-55:** **Phase 2 (The Cull).** Institutions sort and destroy 60% of cards. Move survivors to Small Box.
  *   **55-75:** **Phase 3 (The Reveal).** Read Small Box (Official History). Open Envelopes (True History). Compare.
  *   **75-90:** **Debrief.** Map experience to terms (Silence, Provenance, Bias). Final statement on limitations.

  ## A Note on the "Expert"
  Since she is razor-sharp, hand her the "Newspaper" role. Give her a specific constraint: *"You can only print stories that are verified by a signed document from the Bank, Church, or Court."*
  This forces her to experience the frustration of *knowing* something happened but being unable to print it because the bureaucracy didn't generate a form. This aligns her with your insight rather than against the simulation. She becomes a witness to the structural problem, not a fact-checker of the fiction.
