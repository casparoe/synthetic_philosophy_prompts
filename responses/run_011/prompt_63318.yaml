      *Wait, one more thought on the Knot:* If I end on the tension, will they leave confused? Yes. Is that bad? No, if they know *why* they are confused. The plan must explicitly label the tension as "Machiavelli's Tragic Problem."

      *Let's finalize the Example choice:* The prompt asks to choose between Borgia, Julius, River.
      *   Borgia: Too much focus on cruelty (Cynic trap).
