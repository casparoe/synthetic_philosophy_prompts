answer: |-
  Here is a plan designed for forty minutes, one whiteboard, and a room split between 'Hustle Culture' and 'Cynicism'.

  ### 1. The Sequence: Definitions via Friction

  Do not start with definitions. If you write *Virtù* and *Fortuna* on the board in the first five minutes, the 'Self-Help' cohort will translate them into 'Grit' and 'Opportunity', and the 'Cynic' cohort will translate them into 'Ruthlessness' and 'Chaos'. You will spend the rest of the hour correcting vocabulary rather than teaching concepts.

  **The Order:**
  1.  **The Problem (5 mins):** Start with the outcome Machiavelli cares about (maintaining the state), not the virtues.
  2.  **The Case (15 mins):** Deploy the example to show *why* standard morality fails.
  3.  **The Concepts (10 mins):** Extract the definitions of *virtù* and *fortuna* from the failure/success of the case.
  4.  **The Knot (10 mins):** Introduce the limitation (nature vs. times).

  **Why this order?**
  It forces the lexical work to happen *after* they have seen the concepts in motion. You are not telling them what the words mean; you are showing them that their current vocabulary is insufficient to explain the example.

  ### 2. The Single Example: Julius II (Chapter 25)

  Forget the Borgia (too much noise about cruelty) and forget the River (too abstract, invites the 'build bigger dykes' self-help reading). Use **Pope Julius II**.

  **What it forces you to say:**
  It forces you to talk about *tempo*. Julius succeeded because his impetuous nature matched the specific historical moment (the French were weak, the situation required speed).
  **What it lets you dodge:**
  It lets you dodge the moral question of whether Julius was 'good'. He was a warrior Pope; the question is whether his style worked, not whether it was nice. This neutralises the 'Cynic' cohort who are waiting to discuss murder.

  **The Whiteboard Move:**
  Draw two axes. X-axis is 'The Times' (shifting from Caution-required to Impetuosity-required). Y-axis is 'The Prince's Nature' (Fixed).
  Plot Julius on the graph. Show that he hits the 'Success' zone only because the Times moved to meet his Nature.
  **Crucial Constraint:** You must emphasise that Julius did not *choose* to be impetuous to match the times. He was impetuous by nature, and the times happened to suit him. This sets up the 'Knot' later.

  ### 3. The Misconception Map

  Here are the four misconceptions in the order they will arise, and the exact intervention point.

  **1. 'Virtù is a skillset I can learn' (Self-Help Cohort)**
  *   **When:** As soon as you introduce the Julius example.
  *   **Intervention:** When they suggest Julius 'chose' his strategy, correct them. Machiavelli says men cannot deviate from what their nature inclines them to. *Virtù* is not a toolkit; it is the capacity to impose your will *when the times allow*.
  *   **Script:** "If *virtù* were just a toolkit, Julius would have switched to caution when the times changed. He couldn't. That's why he's lucky, not just skilled."

  **2. 'Fortuna is just luck, so half our life is fatalism' (Passive Cohort)**
  *   **When:** When discussing the 'flood' imagery associated with Julius.
  *   **Intervention:** Distinguish 'chance' from 'force'. Fortuna is a river in flood; it is destructive energy. It is not random dice rolls; it is historical momentum.
  *   **Script:** "Luck is winning the lottery. Fortuna is the river rising. You can't stop the rain, but you can dig the dykes *before* the flood. That preparation is *virtù*."

  **3. 'Boldness always wins' (Self-Help Cohort, round two)**
  *   **When:** They latch onto Machiavelli's line that it is better to be impetuous than cautious.
  *   **Intervention:** Remind them of the graph. Boldness won for Julius. Boldness would have destroyed Soderini (who needed caution).
  *   **Script:** "Boldness isn't the winning move. Matching the move to the moment is. Boldness just happens to match this specific moment."

  **4. 'Machiavelli is a Proto-Realist describing objective truth' (The Missed One)**
  *   **When:** They start treating his advice as universal laws of politics.
  *   **Intervention:** In the 'Knot' section. Remind them this is a plea for salvation, not a physics textbook.
  *   **Script:** "He isn't telling us how politics *is* everywhere. He's telling a specific man how to save a specific state in a specific crisis. It's a prescription, not a description."

  ### 4. The Knot: Nature vs. Times

  This is the strongest part of your session if you handle it correctly. Do not try to resolve it. If you try to solve it, you will lie about the text.

  **The Setup:**
  1.  Premise A (Ch 25): To succeed, your mode of proceeding must match the quality of the times.
  2.  Premise B (Ch 25): A man cannot change his nature to match the times.
  3.  Conclusion: Success is largely dependent on being born in the right era for your specific psychology.

  **Where to place it:**
  This goes in the final 10 minutes, *after* you have defined the terms.

  **How to frame it for First-Years:**
  Call it **"The Tragic Limit"**.
  Tell them: "Machiavelli gives you a machine for success (*virtù* matching *fortuna*), but then admits the machine has no steering wheel (you can't change your nature)."
  This explains why Chapter 26 (The Exhortation) feels so desperate. He is asking a man (Lorenzo) to do something Machiavelli just said is nearly impossible: rise above his nature to save Italy.

  **Is ending here a mistake?**
  No. It is the only honest way to teach it. If you smooth it over, you turn Machiavelli into a coherent management consultant. If you leave the tension, you turn him into a political theorist.
  **The Caveat:** You must explicitly label it as a tension. Say: "We are stopping here because Machiavelli doesn't fully solve this. He hopes *necessity* will force the change that nature won't allow." That gives them a takeaway (Necessity) without pretending the contradiction doesn't exist.

  ### 5. The Final Question (Last 2 Minutes)

  Do not ask "What is *virtù*?" That tests memory. Ask a question that tests the *relationship*.

  **The Question:**
  "If a Prince with high *virtù* fails, according to Machiavelli, is the fault in the Prince, or in the Times?"

  **The Bad-but-Plausible Answer:**
  "It's in the Times, because Fortuna controls half our actions."
  *(Why it's bad: It ignores agency. It treats Fortuna as an excuse rather than a force to be met.)*

  **The Good Answer:**
  "It's a mismatch. The Prince couldn't or didn't adapt his mode to the quality of the times. But since he can't change his nature, the failure was inevitable for *him*, even if another Prince with a different nature would have succeeded."
  *(Why it's good: It captures the relational nature of success and the tragic limit of human nature.)*

  ### 6. What to Cut

  You have forty minutes. You must be ruthless (show some *virtù*).

  1.  **The Discourses:** Do not mention the republican context. It complicates the definition of *virtù* (civic vs. princely) and you do not have time. Treat *The Prince* as a closed system for this hour.
  2.  **Fortune as Minister of Providence:** Do not get into the theological background of whether Fortuna is God's executioner. It leads to a discussion on atheism which will eat 15 minutes and distract from the political theory. Treat Fortuna as an impersonal force.
  3.  **Machiavelli's Biography:** Do not spend time on his exile or torture. The students don't care yet, and it encourages the 'bitter man seeking revenge' reading rather than the theoretical one.
  4.  **The 'Mirrors for Princes' Genre:** Don't contextualise the genre. Just teach the text. If they ask, say "It looks like advice, but it works like a diagnosis."

  ### Summary of the Whiteboard Plan

  1.  **Left Side:** Draw the Axes (Times vs. Nature). Plot Julius.
  2.  **Centre:** Write the two definitions *after* the discussion.
      *   *Virtù*: The capacity to impose order on flux (not morality).
      *   *Fortuna*: The flux itself (not luck).
  3.  **Right Side:** The Knot.
      *   Times change.
      *   Nature does not.
      *   Therefore: Success is fragile.

  Keep your eyes on the clock. If you are still on the Julius example at minute 25, skip the biography cut and move straight to the Knot. It is better they leave understanding the contradiction than understanding the history.
