answer: |-
  **APPLICATION NUMBER:** PL/2024/0892
  **SITE:** Greenfield Land North of Oakhaven
  **APPLICANT:** Aggregate Wellbeing Ltd
  **PROPOSAL:** Phased residential development (Phase 1: 100 units; Phase 40: 10,000 units)

  **POLICY CONTEXT**
  Local Plan Policy WB-01 requires developments to maximise Aggregate Community Welfare (ACW). ACW is the sum of individual Welfare Scores (WS). A WS > 0 indicates a life worth living. Policy mandates that no phase shall reduce the WS of existing residents, and all new residents must achieve WS > 0.

  **OFFICER'S ASSESSMENT**
  The scheme proposes incremental expansion. Phase 1 introduces 100 residents at WS 10.0 (Total ACW: 1,000). Phase 40 accommodates 10,000 residents. The original 100 retain WS 10.0. The additional 9,900 residents achieve WS 0.5. Total ACW: 1,000 + (9,900 × 0.5) = 5,950. Each phase increases total ACW without reducing existing WS. All new residents exceed the neutral threshold (0.5 > 0). Parking and amenity space scale linearly to maintain WS metrics.

  **SUMMARY OF CONSULTATION RESPONSES**

  1.  **Objection:** Local residents cite increased traffic and noise impacting quality of life.
      **Reply:** Under the Phase 1-only scenario, these objectors would not have been conceived. As their existence depends on Phase 5+, they lack standing to claim harm relative to the baseline of non-existence.

  2.  **Objection:** Councillor J. Miller argues that adding happy lives is optional, whereas adding miserable lives is forbidden.
      **Reply:** Policy WB-01 treats positive and negative welfare symmetrically regarding existence. Creating lives with WS > 0 contributes positively to ACW. This objection is out of order.

  3.  **Objection:** Oakhaven Housing Association proposes a Critical Welfare Threshold of 5.0.
      **Reply:** Setting a threshold above neutral (0) arbitrarily excludes lives worth living. A resident with WS 0.5 benefits from existence. Preventing their birth reduces aggregate welfare without preventing harm.

  4.  **Objection:** Community Mediator suggests weighting new residents less as population grows.
      **Reply:** No evidence supports declining marginal welfare weight. Policy requires simple summation. Complex weighting functions introduce calculation errors and delay housing delivery.

  5.  **Objection:** Equality Group notes the disparity between Phase 1 residents (WS 10.0) and Phase 40 residents (WS 0.5).
      **Reply:** Inequality between distinct cohorts does not reduce the aggregate sum. No envy is feasible as Phase 1 residents cannot swap lives with Phase 40 residents.

  6.  **Objection:** Monitoring Officer certifies that WB-01 conditions (Maximise ACW, Respect Equality, Avoid Repugnant Outcomes) are mutually inconsistent.
      **Reply:** Noted. The Committee must choose which condition to violate. Recommendation prioritises ACW maximisation as per primary policy wording.

  **RECOMMENDATION**
  Approve Phase 40. The scheme delivers the highest achievable Aggregate Community Welfare within the site boundary.

  ***

  **NOTE TO CONVENOR**

  The strongest objection is the Monitoring Officer's (Objection 6). It correctly identifies the impossibility theorems: you cannot satisfy all intuitive adequacy conditions simultaneously. The report forces a choice, and choosing Total Welfare is a coherent, if costly, commitment.

  The satire lets the Equality Objection (5) off too easily. Dismissing inequality because "no envy is feasible" ignores the intrinsic badness of inequality many egalitarians defend. A real planner might worry about social cohesion between the high-welfare early adopters and the low-welfare masses.

  The main liberty is cardinal measurability. The officer treats welfare as precise units (0.5 vs 10.0) without error bars. A real defender of totalism might accept ordinal rankings only, but the joke requires arithmetic. Also, the Non-Identity reply (1) is legally dubious even if philosophically sound; a real council would never admit "you wouldn't exist otherwise" in a public letter. Flag that to the person-affecting guy: his view wins in court, loses in logic.
