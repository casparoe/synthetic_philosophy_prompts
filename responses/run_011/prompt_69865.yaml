answer: |-
  Premise Analysis
  The exclusion problem is generated by five jointly inconsistent claims: (1) Low-Level Completeness (every physical effect has a sufficient physical cause); (2) Exclusion (no effect has more than one sufficient cause unless genuinely overdetermined); (3) Non-Identity (high-level properties are not identical to low-level properties); (4) No Systematic Overdetermination (systematic dual causation is false); (5) High-Level Causation (high-level properties cause effects). To maintain consistency, one must be rejected. Denying (1) yields interactionism. Denying (3) yields reductionism. Denying (5) yields eliminativism or epiphenomenalism. Denying (2) or (4) allows non-reductive physicalism but requires explaining how two causes coexist without competition—via level-relativity, proportionality, or accepting overdetermination. The tree branches on Completeness first (isolating interactionists), then Identity (isolating reductionists), then the mechanism of coexistence (isolating non-reductive views). This order maximizes early separation of engineers (who often assume Completeness) from dualists, and philosophers (who often assume Non-Identity) from reductionists.

  Workshop Exercise: The Docking Robot Decision Tree
  Artifact: A docking robot. Low-level state: Voltage pattern V in motor drivers. High-level state: Decision D to turn left. Effect: Turn T.

  1. Is the voltage pattern V physically sufficient to produce Turn T, regardless of what D means?
      - No: The voltage needs help from something outside the physical circuit to make the turn happen.
          - LEAF: Interactionist Dualist Analogue (Low-level incompleteness).
      - Yes: The voltage alone guarantees the turn.
          - Go to 2.

  2. Is Decision D a real property of the robot, or just a label we use for V?
      - Just a label: There is no high-level property, only the voltage pattern.
          - LEAF: Eliminativist about High Level (Denies High-Level Causation).
      - Real property: D exists distinct from the label.
          - Go to 3.

  3. Is Decision D strictly identical to Voltage Pattern V (same thing, different description)?
      - Yes: D is nothing over and above V.
          - LEAF: Reduction/Identity (Denies Non-Identity).
      - No: D is realized by V but distinct from it.
          - Go to 4.

  4. Did Decision D cause Turn T, or did it merely explain why V was there?
      - Merely explained: D tracks V but didn't push the motor; V did the pushing.
          - LEAF: Causing/Explaining Split (Epiphenomenalism about D).
      - Caused it: D played a causal role.
          - Go to 5.

  5. If both V and D caused T, did they do so as two separate sufficient causes?
      - Yes: Both fully caused it, systematically.
          - LEAF: Cheerful Systematic Overdetermination (Denies No Overdetermination).
      - No: That sounds like double-counting; there is only one causation event.
          - Go to 6.

  6. When you say D caused T, do you mean "cause" depends on who is asking (engineer vs. user)?
      - Yes: Causation is relative to the level of description or interest.
          - LEAF: Level-Relative Causation (Denies Exclusion via relativity).
      - No: Causation is objective, not perspective-dependent.
          - Go to 7.

  7. Did D cause T because it was specific enough, whereas V was too detailed?
      - Yes: D was the proportional cause; V was too determinate.
          - LEAF: Proportionality/Determinable Response (Denies Exclusion via specificity).
      - No: D caused T because changing D would change T (intervention).
          - LEAF: Difference-Making/Interventionist (Denies Exclusion via counterfactuals).
      - (Unoccupied Combination: Yes to 6 and Yes to 7. Diagnosis: Incoherent. If causation is level-relative, proportionality constraints are usually internal to the level, not a bridge between them. Merely unattractive.)
      - (Unoccupied Combination: No to 4 and Yes to 5. Diagnosis: Incoherent. If D only explains, it cannot be a sufficient cause alongside V.)

      - FLAG: Difference-Making and Proportionality leaves are often indistinguishable in practice; both rely on counterfactual dependence but differ on whether specific physical details undermine causation.

  Key: Mapping to Mental Causation
  (Replace Robot with Person; Voltage with Neural State; Decision with Mental State)

  - Interactionist Dualist Analogue: Commits you to mental states adding physical energy to neural states. Rejects Low-Level Completeness. Rare in science.
  - Eliminativist about High Level: Commits you to denying beliefs/desires exist. Rejects High-Level Causation (by denying the cause exists).
  - Reduction/Identity: Commits you to mental states being neural states. Rejects Non-Identity. Solves exclusion by collapse.
  - Causing/Explaining Split: Commits you to mental states being causally inert shadows. Rejects High-Level Causation (preserves property, denies power).
  - Cheerful Systematic Overdetermination: Commits you to every action being caused twice (once mentally, once neurally). Rejects No Systematic Overdetermination.
  - Level-Relative Causation: Commits you to causation being framework-dependent, not a single natural relation. Rejects Exclusion (causes don't compete across levels).
  - Proportionality/Determinable Response: Commits you to mental causes being better candidates than neural details. Rejects Exclusion (neural cause is too specific to be the true cause).
  - Difference-Making/Interventionist: Commits you to mental causation defined by manipulation, not production. Rejects Exclusion (physical sufficiency doesn't block counterfactual dependence).

  Instruction for Participants: Follow the path that matches your intuition about the robot. Do not think about minds yet. Once you reach your leaf, check the key to see what you just committed to about your own agency.
