  ### Note on Provided Cases

  Before the key, I must address the five cases you constructed. A key is only as good as its cuts; redundant cases waste nodes, and malformed ones mislead.

  *   **Case A (5 vs 1 Life):** **Essential.** This is the primary joint. It separates those who believe numbers count from those who believe they do not.
  *   **Case B (1 Cure vs 5 Disability):** **Redundant.** This tests the same "aggregation vs. severity" joint as Case C, but with less pressure. Ten thousand weeks of nausea (Case C) exerts more logical pressure on the "numbers count" view than five disabilities. Use C; discard B.
  *   **Case C (10k Nausea vs 1 Blindness):** **Essential.** This tests the "threshold." It separates those who aggregate all welfare from those who believe grave harms trump mild benefits regardless of numbers.
  *   **Case D (Objection within Case A):** **Essential.** This tests the *basis* of counting. It separates those who save the five because of the *total good* from those who save the five because of *individual claims* that can be waived.
  *   **Case E (500k Common vs 300 Rare Animals):** **Redundant/Malformed.** You stipulated no difference in suffering, ecological function, or human interest. Under these constraints, this is merely Case A scaled up (500,000 vs 300). It does not test a new ethical joint; it only tests consistency. If someone saves the 300 here but the 5 in Case A, they are inconsistent, not holding a distinct position. Discard E.

  ***

  ### The Dichotomous Key of Allocation

  **Background Conditions:** For every case below, assume the affected are strangers to you, nobody is at fault, need is otherwise equal, you can save only some, and there are no future consequences of your choice.

  **Node 1**
  A rescue craft can reach one of two sinking vessels. Five people are on the first vessel; one person is on the second. You have time to reach only one.
  *   **Option 1:** Steer directly to the vessel with five people. *(Go to Node 2)*
  *   **Option 2:** Flip a coin to decide which vessel to approach. *(Go to Node 5)*

  **Node 2**
  You have decided to steer to the vessel with five people. As you approach, one of the five radios you. She says she does not believe her being one of five gives her group priority, and she requests you flip a coin to give the single person an equal chance.
  *   **Option 1:** Her request does not change your duty; you must still save the five. *(Go to Node 3)*
  *   **Option 2:** Her request is decisive; you must now flip a coin. *(Go to Node 4)*

  **Node 3**
  A stockpile of medicine can be used in one of two ways. It can completely cure one person who would otherwise go permanently blind. Or, it can be divided to relieve ten thousand people of a week of severe nausea and lost work.
  *   **Option 1:** Relieve the ten thousand people. *(Leaf 1)*
  *   **Option 2:** Prevent the one person from going blind. *(Leaf 2)*

  **Node 4**
  You respected the woman's objection in Node 2 and are now willing to flip a coin between the five and the one. Consider the medicine case again: one person blinded versus ten thousand with a week of nausea.
  *   **Option 1:** Relieve the ten thousand people. *(Leaf 3)*
  *   **Option 2:** Prevent the one person from going blind. *(Leaf 4)*

  **Node 5**
  You decided to flip a coin in Node 1 (5 lives vs 1 life). Consider the medicine case: one person blinded versus ten thousand with a week of nausea.
  *   **Option 1:** Relieve the ten thousand people. *(Leaf 5)*
  *   **Option 2:** Prevent the one person from going blind. *(Leaf 6)*

  ***

  ### The Leaves

  **Leaf 1**
  *   **Plain Name:** The Total Maximizer
  *   **Literature Name:** Classical Utilitarianism
  *   **Verdict:** You save the greater number in life-or-death cases because the total amount of survival matters, and you aggregate minor harms to outweigh grave ones because all welfare sums together.

  **Leaf 2**
  *   **Plain Name:** The Severity Prioritizer
  *   **Literature Name:** Prioritarianism or Threshold Deontology
  *   **Verdict:** You save the greater number in life-or-death cases, but you refuse to aggregate minor harms to outweigh a grave harm, believing severity creates a threshold numbers cannot cross.

  **Leaf 3**
  *   **Plain Name:** The Claim Respector
  *   **Literature Name:** Contractualism (Scanlonian)
  *   **Verdict:** You save the greater number only when no individual can reasonably reject the principle, but you respect an individual's waiver of their claim, and you refuse to aggregate minor harms against a grave one.
      *(Note: This leaf assumes consistency between Nodes 2 and 3; if a respondent chooses Option 1 in Node 4, they fall to Leaf 3.)*

  **Leaf 4**
  *   **Plain Name:** The Unstable Hybrid
  *   **Literature Name:** (No established school; theoretically unstable)
  *   **Verdict:** You respect an individual's veto on life-or-death counting, yet you still aggregate minor pains to outweigh grave harms.
      *(Note: This position is rarely occupied because respecting individual vetoes usually precludes aggregation.)*

  **Leaf 5**
  *   **Plain Name:** The Pain Aggregator
  *   **Literature Name:** Value Pluralism or Hybrid Individualism
  *   **Verdict:** You treat lives as incomparable units requiring a coin flip, but you treat pain as a substance that can be summed, allowing many minor pains to outweigh one grave harm.

  **Leaf 6**
  *   **Plain Name:** The Strict Individualist
  *   **Literature Name:** Taurekian Individualism or Strict Egalitarianism
  *   **Verdict:** You refuse to count numbers in life-or-death cases and refuse to aggregate harms in welfare cases, treating every individual's fate as morally isolated from every other.

  ***

  ### Logically Available but Unoccupied Combinations

  These are positions the key *could* distinguish but which no coherent ethical theory currently occupies.

  **1. Species-Relative Aggregation**
  *   **Combination:** Save the five humans in Node 1 (Numbers Count), but flip a coin between 500,000 common animals and 300 rare animals in a modified Case E (Numbers Don't Count).
  *   **Status:** **Empty because Incoherent.** Given your constraints (equal capacity to suffer, no ecological function), there is no ethical "joint" to justify counting human heads but not animal heads. Positions that do this usually rely on ecological or cognitive differences you explicitly excluded.

  **2. Waiver-Sensitive Utilitarianism**
  *   **Combination:** Save the five in Node 1 (Total Good), Ignore the Objection in Node 2 (Total Good overrides waiver), but Save the One in Node 3 (Threshold).
  *   **Status:** **Empty because Unattractive.** If one believes total good overrides an individual's waiver in Node 2, they are committed to the principle that the Sum is King. To then reject the Sum in Node 3 is to abandon the core mechanism of their own view without a replacement principle.

  **3. Scale-Dependent Individualism**
  *   **Combination:** Flip a coin in Node 1 (5 vs 1), but Steer to the Five in a modified Node 1 (5,000 vs 1).
  *   **Status:** **Empty because Unoccupied.** If numbers do not count at small scales because individuals are morally isolated, the mechanism of isolation does not vanish at large scales. No theory posits that moral isolation dissolves simply due to magnitude.

