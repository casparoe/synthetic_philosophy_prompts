  A: Takings require loss of utility. Since utility depends on physical access and improvements, and neither has changed, no claim exists. The Office of City Counsel supports this interpretation.¹ There is no damage where there is no difference.

  Q: Will this happen again?
  A: The Department reserves the right to smooth adjustments wherever matter is absent. We prioritize ledger consistency over metaphysical certainty. Residents are advised to build fences if they wish to anchor their claims. Empty space is public domain until occupied.

  Submit inquiries at Counter 4. Do not request a supervisor. They agree with this notice.

  ¹ Measurement tolerance is ±0.5mm. Claims regarding shifts smaller than tolerance are rejected as noise. Claims larger than tolerance are rejected as impossible.

  **What I was actually satirizing**

  This notice dramatizes the "Hole Argument" in General Relativity. The shifted parcels represent a diffeomorphism—a smooth mathematical reshuffling of spacetime coordinates—applied only to a vacuum region ("The Hole"). The Deeds Office adopts a relationalist stance (akin to Leibniz or Mach): space has no independent existence; it is merely the order of material objects. If the matter (fences, wells) doesn't move relative to itself, nothing has happened. The complainant represents the substantivalist view: space is a container that exists independently of its contents, so moving the coordinates *is* moving the property, even if unobservable. The Office's refusal to adjudicate "true" labeling mirrors the physics consensus that diffeomorphic models are physically equivalent. The "expensive" jab targets the empirical indistinguishability of the two views; substantivalism is metaphysically possible but adds no predictive power, making it a bad budget item for a city (or a theory). The satire cuts both ways: the Office is right about the physics, but absurdly dismissive of the human intuition that location matters.

  The piece oversimplifies the role of boundary conditions, which in real physics often fix the gauge and prevent such arbitrary shifts from being truly invisible.
