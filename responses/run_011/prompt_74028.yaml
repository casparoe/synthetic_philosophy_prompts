  2.  **Deconstruct the Nyāya Framework (Mental Sandbox):**
      *   *Śabda* as *Pramāṇa*: In Nyāya, knowing something via words is a distinct way of knowing, like perception or inference. You don't need to verify the physics yourself if the source is valid. But validity depends on the source.
      *   *Āpta*: The core of Nyāya testimony. It's not just "reliable"; it's someone who *knows* (direct experience/competence) and *wants to tell the truth* (benevolence/honesty).
      *   *Śābdabodha*: To understand a sentence, you need syntax (*ākāṅkṣā*), meaning compatibility (*yogyatā*), and proximity (*āsatti*). But crucially, you need *tātparya* (intention). If I say "The bank is steep," do I mean a river bank or a financial institution? Without knowing the intention, cognition doesn't crystallise.
      *   *Mīmāṃsā Contrast*: Mīmāṃsakas say Vedas are authorless (*apauruṣeya*) and therefore inherently valid. Nyāya says no, words need a speaker. If there's no speaker, there's no *tātparya*, and thus no *śabda* knowledge.
      *   *Application to Climate Model*: The model authors are the speakers. Referees can't check the "content" (the code/physics), so they rely on the *āpta* status. Are they *āpta*? Do they have direct knowledge? Do they will to report truth? Or are they hiding complexity?
      *   *Application to AI*: AI generates words. Who is the *āpta*? The duty editor? The model? The model has no knowledge (*jñāna*) and no intention (*tātparya*). It simulates syntax (*ākāṅkṣā*) and semantics (*yogyatā*) but lacks the soul of the utterance.

  3.  **Drafting the Implications (Iterative Process):**

      *   *Implication 1: Independence of Śabda.* If we treat testimony as inference (Anglophone style), we ask "Is the speaker reliable?" If we treat it as Nyāya *śabda*, we ask "Is this a valid instance of *śabda*?" The distinction is subtle but crucial. Nyāya says *śabda* gives knowledge *directly* if conditions are met. It's not "I infer he is honest, therefore I believe him." It's "He is an *āpta*, therefore I know."
      *   *Implication 2: The Āpta Requirement.* This is the big one. An *āpta* needs *direct knowledge* (*yathārtha-jñāna*) and *benevolence* (*dayā*). The climate scientists might have knowledge, but is the model too complex for even them to fully grasp (entanglement)? The AI has neither knowledge nor benevolence.
      *   *Implication 3: Tātparya (Intention).* This is the killer for AI. Syntax and semantics might be perfect (the brief reads well), but without a speaker's intention, *śābdabodha* (verbal understanding) is technically incomplete or defective. For the climate model, if the authors can't explain *why* the model outputs what it does, is their *tātparya* clear?
      *   *Implication 4: Mīmāṃsā Contrast.* Nyāya insists on an author. Mīmāṃsā allows authorless validity. This highlights that AI (authorless text) cannot be *śabda* in the Nyāya sense. It forces us to ask: Who is speaking?

