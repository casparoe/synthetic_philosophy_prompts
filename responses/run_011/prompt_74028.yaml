      *   Climate Model: Humans made it. There *is* an *āpta* (or a team), but their knowledge might be compromised by complexity. The *tātparya* exists but might be obscured.
      *   Language Model: No human wrote the specific sentences. The "speaker" is a statistical engine. There is *no āpta* for the specific utterance. The duty editor signs off, but did they have *direct knowledge*? No, they just checked it looked okay.
      *   Breakdown: The climate model is a case of *opaque āpta* (knowledge exists but is hard to verify). The AI is a case of *absent āpta* (no knowledge exists behind the words).

  6.  **Refining the Tone and Language:**
