          *   Problem of *tātparya* (speaker's intention) when other conditions are met but intention is indeterminate.
          *   Contrast with Mīmāṃsā (authorless scripture vs. Nyāya's requirement for an author).
      *   **Tasks:**
          *   Set out implications for framing the piece.
