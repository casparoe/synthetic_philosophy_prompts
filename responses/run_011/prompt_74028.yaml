      *   *Crucial Nuance:* The climate model referees are treating the authors as *āpta* without verifying the *yathārtha-jñāna* (true knowledge). They are assuming *āpta*-hood based on status. Nyāya would say this is risky.
      *   *AI Nuance:* The AI satisfies *ākāṅkṣā* (grammar) and *yogyatā* (makes sense), and *āsatti* (words are together). But fails *tātparya* and *āpta*.

  8.  **Final Review against Constraints:**
