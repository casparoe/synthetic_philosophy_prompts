prompt: |-
  Okay, so I need help settling something, and partly I need it because I just spent four hours arguing with my friend Dana last night and neither of us blinked.

  Dana's a litigator. She's been reading around the "incompleteness of law" stuff — the idea that no legal system can fully ground itself — and she's convinced Gödel proves that any rule system rich enough has to contain claims it can't settle from the inside, so judges are permanently forced to step outside the rulebook, which she says is why judicial discretion isn't a bug. I said no: what Gödel proves is a very specific thing about a very specific kind of system, and the sentence your version needs doesn't exist, because a legal code isn't effectively axiomatized, doesn't contain arithmetic, and can't prove statements about its own provability. She said I'm being a pedant, and that the *structure* is the same even when the content isn't, and structure is what theorems are about. Which is not nothing. That's the actual crux and I couldn't answer it, so whatever procedure you build below, tell me at the end whether Dana's got a point — because if "the structure is the same" is ever true of these arguments, my screening is going to be wrong exactly where it matters most.

  Day job: I chair the program committee for a small interdisciplinary conference on minds, machines, and formal methods. Legal theory people, cognitive scientists, some AI folks, a couple of philosophers. Roughly 70 abstracts this year and I'd swear a third of them invoke Gödel, incompleteness, or "undecidability," usually in a way that would not survive ten minutes with a logician and also would not survive ten minutes with a careful generalist. My committee is a software engineer, a legal scholar, and a cognitive scientist. Nobody has done logic past undergrad. We get maybe 12–15 minutes per abstract, authors get one round of written response, and I can't run a seminar on the diagonal lemma in between.

  What I want is a triage procedure my committee can actually run, in order, on any abstract that leans on incompleteness. Not an essay about what the theorems say — a procedure. Questions to ask in sequence, each one answerable from the abstract plus the author's reply; what counts as a pass on each; what each kind of failure commits us to; and where the procedure stops and hands the call back to a human because the remaining question is about what this conference is for rather than about logic.

  Things I want baked in:

  1. It should start from a distinction I've been using informally and want you to sharpen or throw out. I sort Gödel-flavored abstracts into three buckets: decorative (the theorem is a label; delete it and the argument is unchanged), load-bearing (there's a real self-referential construction doing work, and you can point at the specific claim it produces), and misapplied (the hypotheses are violated — wrong kind of system entirely). Give me operational tests that separate these, and tell me whether the three-bucket scheme is even right or whether its hiding a fourth case I keep landing on.

  2. My current shortcut is: if the author can't name the particular claim their diagonal-style argument generates, it's misapplied, full stop, reject. I suspect that's too harsh — partly because of Dana's structure point — and I also suspect it's too *lenient* in the other direction, since someone can cheerfully name a sentence while violating every other precondition. Fix it.

  3. I want a plain-language hypotheses audit: the actual preconditions the first and second incompleteness theorems need (effective axiomatization, enough arithmetic, and the difference between assuming consistency and assuming soundness, plus whatever else matters), written so my cognitive scientist can apply it without knowing what a fixed point is. Please include the two senses of "undecidable" that these abstracts run together constantly, and the fact that the same man proved a completeness theorem about first-order logic that says something close to the opposite of what half these submissions think it says.

  4. Run the whole procedure on three abstracts, roughly as they'd show up in my inbox:
     - a legal theory paper arguing that since any sufficiently rich normative system cannot demonstrate its own consistency, constitutional review has to be located outside the system it reviews;
     - an AI paper arguing that a trained language model is a formal system, so there is a true claim about its own outputs it cannot derive, whereas its human users can see that claim is true, therefore the model cannot have understanding;
     - an organizational design paper using incompleteness to argue that no company can write down all of its own operating rules and must deliberately leave gaps for on-the-ground judgment.
     Tell me the verdict each one gets, step by step. And be honest with me: at least one should come out in a way I'm going to find annoying, because I have strong priors about the AI one and the org one and I'm probably wrong about one of them. Say which, and why.

  5. Mark where the procedure will misfire — which abstracts it wrongly sinks, which ones it waves through, and any test that quietly assumes the thing I'm trying to test for. And where the honest answer is "that's not a logic question, that's a call about your conference's identity," say that instead of dressing it up as a rule.

  Please don't give me a bibliography, a reading list, or names-and-dates. If you need to bring in the Lucas/Penrose style argument or the standard objection to it, just describe the argument — don't cite it. I can't check citations and neither can my committee.

  American English, please.
