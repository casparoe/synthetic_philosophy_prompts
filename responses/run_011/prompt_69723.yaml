  1. **Bottom line**
  The director conflated the Stoic distinction between internal volition and external outcomes with a distinction between action and passivity. Stoicism dictates that your *attempt* to negotiate is within your control, even if the organization's *agreement* is not. Therefore, arguing for change is consistent with the dichotomy, provided your emotional stability does not depend on success. His conclusion that your frustration is misplaced only holds if you demand a specific outcome, not if you demand a fair process. The slogan licenses focusing on your effort, not abandoning the effort itself.

  2. **The menu**

  1. "The dichotomy describes a metaphysical fact that external events are causally determined while internal choices are uncaused." **Verdict: False.** Stoics were determinists; they believed *everything* is causally linked by Providence or nature. The distinction isn't about causation but about *agency*. Epictetus says actions are "by nature free," but this refers to the moral capacity to assent, not metaphysical libertarianism. If this were true, physics would override agency, making moral responsibility impossible. The director cannot use this to say you shouldn't act, only that you shouldn't expect to break physics. This reading collapses under scrutiny because it denies the possibility of any human action affecting the world, which contradicts the role of a program manager.

  2. "The dichotomy prescribes that we should only invest emotional desire in internal states, not external results." **Verdict: Substantive and defensible.** This is the core ethical instruction. You should want to argue fairly (internal), not necessarily want the rota to change (external). If you feel frustration because the result didn't happen, you violated this. However, this does not forbid arguing; it forbids *distress* over the outcome. The director jumped from "don't be distressed" to "don't argue," which is a non sequitur. You can pursue externals as "preferred indifferents" without staking your happiness on them. This reading protects your mental health but does not mandate silence regarding policy flaws. It allows you to work hard while accepting whatever happens.

  3. "The boundary separates specific physical actions from the successful completion of those actions." **Verdict: Substantive and defensible.** Epictetus lists "pursuit" and "aversion" (actions/attitudes) as controllable, but "property" and "command" (outcomes/status) as not. You can control the act of negotiating the rota; you cannot control the director's signature. The director treated the negotiation itself as external. This reading licenses your argument: the attempt is yours, the approval is theirs. Misplacing frustration applies to the denial, not the attempt. It validates your role: you are responsible for the proposal, they are responsible for the decision. This preserves professional integrity without promising unrealistic influence over leadership decisions.

  4. "The dichotomy asserts that anything subject to any external impediment is completely outside our control." **Verdict: False.** This creates a false binary. While Epictetus says things not in control are "restrained," he acknowledges we interact with them. If any impediment removed control, walking would be uncontrollable (walls exist). The Stoic view is that impediments block the *outcome*, not the *impulse*. The director implies that because the organization can say no, you have no control over the situation. This ignores the sphere of influence where your action resides. It conflates "not guaranteed" with "not possible," rendering all strategic planning futile. It turns resilience into resignation, confusing the inability to dictate reality with the inability to engage it.

  5. "To be 'in our control' means having the causal power to guarantee a result regardless of circumstances." **Verdict: Platitude.** Almost nothing meets this bar except perhaps thinking. If this is the definition, then almost all work is futile. This renders the concept useless for a program manager. It reduces agency to magic. The director uses this implicitly: since you can't guarantee the rota changes, you have no control. But Stoicism isn't about guaranteeing results; it's about owning the attempt. This reading makes professional life impossible. It suggests that unless you are omnipotent, you should do nothing. This contradicts the Stoic virtue of justice, which requires acting for the common good regardless of success.

  6. "The distinction marks what properly belongs to the self versus what belongs to fortune or others." **Verdict: Substantive and defensible.** Epictetus uses language of ownership ("our own actions" vs "belonging to others"). Your reputation and command belong to the organization's view, not you. Your integrity belongs to you. The director claimed the org's behavior is "not yours," which is true, but your response to it is. The error is thinking that because the object of concern (the rota) is external, the concern itself is forbidden. You can care about externals without owning them. This protects your character while allowing you to care about patient safety staffing. It distinguishes between identifying with the outcome and identifying with the effort.

  7. "The dichotomy allows for a third category of things that are partly up to us and partly subject to chance." **Verdict: Too vague to evaluate.** Epictetus seems binary in Chapter 1, but later Stoics acknowledge cooperation. If there is a middle ground, the director's hard line fails. However, strict Epictetan orthodoxy rejects the middle to protect tranquility. If we allow degrees, your influence over the rota is partial. The director treats it as zero. This reading suggests you should calculate influence, not abdicate it. It undermines the absolute dismissal you received. It invites negotiation rather than silence, acknowledging shared responsibility. It requires a nuanced view of agency that the slogan obscures.

  8. "Things in our control are those that cannot be hindered by any external force." **Verdict: Substantive and defensible.** Epictetus says controllable things are "unhindered." No one can stop you from forming an intention to speak. They can stop you from speaking (gag order), but not from intending. The director stopped you verbally, but cannot stop your professional judgment. This reading supports your right to argue. The frustration is misplaced only if you think they *shouldn't* be able to hinder you. You can accept their hindrance while maintaining your stance. It distinguishes between being silenced and being convinced. It protects your inner citadel without requiring you to abandon your post.

  3. **The translation question**
  The Greek *eph' hēmin* literally means "upon us" or "up to us," implying responsibility rather than domination. Rendering it as "control" suggests a command over outcomes that Stoics explicitly deny we have. Epictetus places "body" in the uncontrollable column, yet we move our bodies; we just don't control their health or strength. "Control" invites the director's error: if I cannot command the organization, I have no power. "Up to us" invites your stance: if the action originates from my moral choice, it is mine to perform. The translation choice shifts the focus from ownership of effort to mastery of results. By choosing "control," the leadership session likely primed staff to accept passivity as virtue, whereas "up to us" demands active integrity regardless of the result.

  4. **What the dismissal required**
  Your director needed Reading #3 (Actions vs. Outcomes) but conflated it with Reading #5 (Guaranteed Results). He assumed that because you cannot guarantee the rota changes, the action of arguing is outside your control. To reach "your frustration is misplaced," he added a hidden premise: that professional advocacy is only rational if success is certain. This premise is the weakest link. Stoicism requires acting virtuously (justice) even when outcomes are uncertain. He also assumed that expressing frustration about structure implies an emotional attachment to the outcome, rather than a commitment to the process. By treating your argument as a demand for control rather than an exercise of duty, he misapplied the dichotomy. He turned a tool for emotional resilience into a gag order for institutional critique. This violates the Stoic duty to speak truth to power when justice is at stake. Furthermore, he assumed that your frustration was about the *denial* rather than the *unfairness*. Stoicism permits judging actions as wrong; it forbids being destroyed by the wrong. He required you to be indifferent to justice to be resilient. This is a corruption of the philosophy. He needed to assume that organizational policy is like the weather—purely external. But policy is human action, subject to human persuasion. By categorizing it as immutable fate, he removed agency from the leadership team as well. He made the organization a tyrant rather than a collection of moral agents. This absolves leadership of the duty to listen, which is itself a failure of Stoic reason.

  5. **How to say it back**
  "I appreciate the reminder about focusing on what I can control. I agree I can't force a decision, but I do control my advocacy. Stoicism asks me to do my duty without attachment to the result, not to neglect my duty. My concern isn't about demanding an outcome, but about fulfilling my responsibility to flag risks. I can accept whatever you decide without accepting that the issue wasn't worth raising. Resilience means staying engaged with the problem, not withdrawing from it."
