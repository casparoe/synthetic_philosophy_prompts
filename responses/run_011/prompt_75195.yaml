answer: |-
  # STATEMENT OF ADVERSARIAL COLLABORATION ON HISTORICAL CAUSALITY
  **Workshop Draft v1.0**
  **Signatories:** [Historian A: Contingentist] | [Historian B: Structuralist]

  ## I. AGREED CLAIMS
  *The following propositions are accepted by both signatories as the baseline for this collaboration. Disagreement begins only where explicitly noted in Section II.*

  1.  **On Sources and Evidence:** Both parties agree that historical claims must be licensed by extant sources, but acknowledge that sources record *events*, not *causal weights*. Neither side claims access to "what actually happened" independent of documentary trace, nor do we claim access to "what would have happened" independent of logical inference from those traces.
  2.  **On Counterfactuals:** Both parties agree that a counterfactual claim is not a fantasy, but a assertion about a causal mechanism. To claim "If X had not occurred, Y would not have followed" is to claim that X was a necessary condition (or a critical component of a sufficient set) for Y within a specific model of the world.
  3.  **On Constraints:** The Contingentist agrees that human agency operates within material and institutional constraints (geography, technology, fiscal capacity) that rule out certain outcomes entirely. The Structuralist agrees that constraints do not dictate a single unique outcome, but rather a probability distribution over a set of possible outcomes.
  4.  **On Concessions:**
      *   **Contingentist Concession:** We agree that "narrative convenience" often exaggerates the role of individuals. We accept that many "decisive moments" are merely the visible crest of a structural wave.
      *   **Structuralist Concession:** We agree that "hindsight bias" often exaggerates the inevitability of outcomes. We accept that structural pressures often require a specific trigger to release, and the timing/nature of that trigger alters the subsequent trajectory.

  ## II. RESIDUAL DISAGREEMENTS
  *The following table outlines the core divergence. Wording has been negotiated so that each signatory accepts their column as a fair representation of their view, without requiring the other to endorse it.*

  | Feature of Causality | **Contingentist Position (A)** | **Structuralist Position (B)** |
  | :--- | :--- | :--- |
  | **Primary Unit of Analysis** | **The Branch Point:** History is a sequence of bifurcations where the system is sensitive to initial conditions. Small perturbations at $t_0$ produce divergent states at $t_n$. | **The Basin of Attraction:** History is a system seeking equilibrium. Perturbations at $t_0$ are dampened by structural forces, returning the system to a predictable state at $t_n$. |
  | **Nature of "Cause"** | **Necessary Triggers:** Specific events (deaths, decisions, shots fired) are load-bearing. Remove the trigger, and the mechanism fails to fire. | **Sufficient Conditions:** Deep variables (demography, capacity, geography) create latent pressure. If one trigger fails, another will substitute to release the pressure. |
  | **Variance Explanation** | **Noise as Signal:** The variance in historical outcomes is largely explained by stochastic events and individual choices that are not reducible to deeper variables. | **Noise as Error:** The variance in historical outcomes is largely measurement error or short-term fluctuation around a mean determined by deep variables. |
  | **Temporal Horizon** | **Path Dependence:** Early differences compound over time. The route taken determines the destination. | **Convergence:** Early differences decay over time. Different routes lead to functionally equivalent destinations. |

  ## III. DYNAMICAL VOCABULARY AND LEVEL RELATIVITY

  ### A. Shared Dynamical Vocabulary
  To clarify the disagreement, both parties agree to test their claims using the following terminology from dynamical systems theory:
  *   **State Space:** The set of all possible configurations of the society/system.
  *   **Basin of Attraction:** A region of state space where, once entered, the system tends to remain (the "structural outcome").
  *   **Perturbation:** An external or internal shock (e.g., a leader's death, a battle loss).
  *   **Relaxation Time:** The time required for the system to return to equilibrium after a perturbation.

  **Application:**
  *   **Contingentist View:** Historical state spaces have many shallow basins with low barriers. Perturbations frequently push the system across barriers into new basins. Relaxation time is often longer than the interval between shocks.
  *   **Structuralist View:** Historical state spaces have few deep basins with high barriers. Perturbations rarely possess the energy to cross barriers. Relaxation time is short relative to the interval between shocks.

  ### B. Critique of the Vocabulary (Ontological Finding)
  *Both parties acknowledge the following limitations in applying this vocabulary to human history:*

  1.  **The State Space Problem:** The Structuralist notes that speaking of a "basin" implies a defined state space. The Contingentist argues that human societies redefine their own state space through innovation and cultural change, meaning the "map" changes while the "token" moves. **Finding:** Using this vocabulary risks smuggling in the Structuralist's assumption that the system *has* stable properties to begin with.
  2.  **The Concession Risk:** The Contingentist worries that accepting the "basin" metaphor concedes that there *is* an equilibrium to return to. The Structuralist worries that accepting "perturbation" as a valid category concedes that shocks are distinct from structural processes.
  3.  **Level Relativity (Verbal Dispute Identification):**
      *   We identify a significant portion of our disagreement as **Level-Relative**.
      *   **Contingentist** is often arguing about **Micro-Trajectory** (Who holds power? Which specific law is passed? The exact date of collapse?).
      *   **Structuralist** is often arguing about **Macro-Outcome** (Does the state expand? Does war occur? Does the economy industrialize?).
      *   **Finding:** Where the Contingentist claims "History changes" (meaning the path) and the Structuralist claims "History stays the same" (meaning the destination), the dispute is partially verbal. However, the dispute remains substantive regarding *whether the macro-outcome is invariant to the micro-trajectory*.

  ## IV. CRUXES AND PREDICTIONS
  *For the following three cases, predictions are logged in advance. Both parties agree on what evidence would bear on the crux and what would count as disconfirmation of their general view.*

  ### CASE 1: The Mongol Withdrawal from Hungary (Spring 1242)
  **The Crux:** Was the withdrawal caused by the death of Ögedei Khan (Contingent/Political) or by logistical exhaustion (Structural/Material)?

  *   **Contingentist Prediction:** If Ögedei had lived another 5 years, the Mongol army would have reorganized and conquered Western Europe. The succession crisis was the *sine qua non* of the withdrawal.
  *   **Structuralist Prediction:** Even if Ögedei had lived, the campaign would have stalled or retreated within the same season. The army had hit the logistical ceiling of the Hungarian plain (pasture depletion, lack of siege capacity for stone fortifications). The Khan's death provided a face-saving exit, not the cause of the exit.
  *   **Evidence Standard:** Comparative analysis of Mongol campaign durations in similar terrains (e.g., Song China, Persia) where succession was stable vs. unstable. Data on fodder requirements per horse vs. Hungarian biomass density in 1242.
  *   **Disconfirmation Conditions:**
      *   **Contingentist:** Evidence that Mongol logistical reserves in Hungary were sufficient for a continued 1242 campaign *and* that Mongol armies in other theaters routinely continued campaigns despite succession crises.
      *   **Structuralist:** Evidence that Mongol armies routinely exceeded the calculated logistical ceiling of the Hungarian plain when politically motivated, or that the withdrawal order predated the news of Ögedei's death.

  ### CASE 2: The July Crisis (1914)
  **The Crux:** Was the Great War caused by the specific sequence of diplomatic failures/decisions in July 1914 (Contingent) or by the rigidity of alliance systems and mobilization timetables making war inevitable within a narrow window (Structural)?

  *   **Contingentist Prediction:** Specific decisions (e.g., the "blank check," the Serbian reply, the timing of mobilization) were load-bearing. Alternative choices available to key actors (Bethmann-Hollweg, Grey, Sazonov) could have localized the conflict or delayed it indefinitely.
  *   **Structuralist Prediction:** Given the alliance structure and the offensive advantage of mobilization timetables, a general European war was >90% probable between 1912 and 1916. The July Crisis was merely the specific instantiation of a structural inevitability.
  *   **Evidence Standard:** War plans (Schlieffen, Plan XVII, etc.) regarding rail capacity and windows of opportunity. Diplomatic cables indicating perceived flexibility vs. rigidity by actors at the time.
  *   **Disconfirmation Conditions:**
      *   **Contingentist:** Demonstration that *every* plausible alternative decision tree in July 1914 leads computationally to general war within 30 days due to mobilization lock-in.
      *   **Structuralist:** Demonstration of a plausible decision path in July 1914 that localizes the Austro-Serbian conflict without triggering the alliance chain, *and* evidence that the structural pressures (arms race, alliances) de-escalated in the subsequent 5 years without war.

  ### CASE 3: The Miami Assassination Attempt (February 1933)
  **The Crux:** Did FDR's survival determine the existence and shape of the New Deal Coalition (Contingent) or was state expansion/welfare reform overdetermined by the Depression's severity (Structural)?

  *   **Contingentist Prediction:** If Cermak had not taken the bullet (or if FDR had died), the New Deal as we know it does not happen. A Garner or Cordell Hull presidency would have pursued fiscal orthodoxy, delaying recovery and altering the US welfare state trajectory permanently.
  *   **Structuralist Prediction:** The economic collapse created an imperative for state intervention that any Democratic administration (and eventually any administration) would have had to meet. The "New Deal" might have had a different name, but the expansion of federal fiscal capacity and social insurance was structurally determined by the crisis.
  *   **Evidence Standard:** Policy drafts circulating in 1932-33 among non-FDR Democrats. Comparative data on welfare state expansion in other democracies during the 1930s (e.g., Sweden, UK) absent a singular charismatic leader.
  *   **Disconfirmation Conditions:**
      *   **Contingentist:** Evidence that the core architects of the New Deal (Perkins, Hopkins, etc.) had binding commitments to their programs from other potential Democratic nominees, or that fiscal orthodoxy was politically impossible for *any* successor.
      *   **Structuralist:** Evidence that a plausible successor administration (e.g., Garner) explicitly planned and executed a sustained policy of deflation and budget balancing that *successfully* stabilized the regime without adopting welfare-state mechanisms.

  ## V. FINDING ON FALSIFIABILITY
  *As requested, the workshop organizers note the following risk assessment regarding the general positions:*

  1.  **Risk to Structuralist Position:** The claim that "outcomes are overdetermined" risks unfalsifiability if "structural pressure" is inferred solely from the outcome that occurred. **Requirement:** To remain falsifiable, the Structuralist must specify *ex ante* what outcome would constitute a structural failure (e.g., "If the Depression ended without state expansion, my model is wrong").
  2.  **Risk to Contingentist Position:** The claim that "small events bend trajectories" risks unfalsifiability if the "bend" is defined post-hoc. **Requirement:** To remain falsifiable, the Contingentist must specify the *magnitude* of the bend that would count as "no effect" (e.g., "If the policy delay is less than 2 years, I concede the structure held").

  **Signed,**

  _________________________ (Contingentist)

  _________________________ (Structuralist)

  _________________________ (Workshop Facilitator)
