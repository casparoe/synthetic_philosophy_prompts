  Two research rivals, Alan and Bill, independently devise identical plans to violate a colleague's bodily autonomy by slipping a tasteless, fast-acting toxin into his morning coffee, intending to make him ill. Both acquire the same substance, wait for the same opportunity, and deposit the exact same dose into the mug with equal care. In Alan's case, a sudden draft from an opening window blows the powder out of the mug and onto the counter before the colleague arrives; the colleague drinks plain coffee. In Bill's case, the air remains still, and the colleague drinks the laced coffee. However, the colleague possesses a rare, unknown genetic immunity to this specific toxin; he suffers no physiological symptoms, no long-term health decline, and never discovers the attempt. Both agents are later apprehended via security footage. Neither the colleague nor the firm suffers any welfare loss, financial damage, or psychological distress, and the agents' own feelings of guilt are irrelevant to the assessment.

  ### Checking Work

  **Constraint 1: Ordinary-life setting.**
  The scenario takes place in a research lab/office involving coffee and toxins. This is mundane, not science-fictional.

  **Constraint 2: Single paragraph scenario.**
  The narrative above is contained in one paragraph.

  **Constraint 3: Equally thorough steps.**
  Both agents acquired the toxin, waited, and deposited the dose with "equal care." The difference arises from the wind (Alan) vs. still air (Bill), not effort.

  **Constraint 4: No differential negligence, evidence, self-deception, or aim.**
  Both aimed to violate autonomy/make ill. The draft is external luck, not negligence (windows open in labs). The immunity is unknown to both, ruling out differential evidence or self-deception.

  **Constraint 5: Not reducible to legal liability, reactions, or feelings.**
  Legally, both might be charged with attempted assault, but the moral question is distinct. The victim never knows (no reactions). The agents' guilt is bracketed.

  **Constraint 6: Success leaves nobody worse off.**
  Bill's plan (administration) succeeded. However, due to immunity, the victim's welfare (health, psychology, finances) is identical to baseline. No harm occurred.

  **Constraint 7: Successful agent intuitively more blameworthy.**
  The case is engineered to elicit the intuition that Bill is worse because he *actually* invaded the victim's body, whereas Alan only prepared to.

  ### Verdicts and Positions

  **Control-Principle Defender (Skeptic):**
  *Verdict:* Equal Blame.
  *Claim:* Moral blame tracks the quality of the will and the exercise of control. Both agents exercised identical control over their intentions and actions up to the point of luck (wind/immunity). Since the outcome (harm) was nullified and the effort was equal, their moral standing is identical. To blame Bill more is to punish him for the wind not blowing and the victim's biology, neither of which he controlled.

  **Moral-Luck Defender:**
  *Verdict:* Unequal Blame (Bill > Alan).
  *Claim:* Moral blame tracks the actualization of the wrongful maxim in the world. Bill completed the prohibited act-type (bodily invasion); Alan did not. The world contains a actual violation in Bill's case and only a threatened one in Alan's. Outcome sensitivity persists even without harm because the *completion* of the wrong matters morally, independent of its consequences.

  **Third Position (Objective Wrongness vs. Subjective Blame):**
  *Verdict:* Equal Blame, Unequal Wrongness.
  *Claim:* The agents are equally blameworthy (subjective standing is identical), but Bill's act was objectively worse. This preserves the control principle for blame (which concerns the agent) while acknowledging that the world is morally worse off when a violation is consummated, even if welfare is untouched.

  ### Feature Doing the Work
  The operative feature is the **consummation of the act-type** (ingestion of the toxin) separated from **welfare impact** (health loss).
  *If deleted:* If we delete the consummation (both fail to administer), the case collapses into equal blame. If we delete the immunity (victim gets sick), the case becomes standard resultant luck where harm drives the blame differential. The case isolates act-completion from harm.

  ### Skeptic's Best Attack
  The skeptic argues the case is rigged by conflating "harm" with "violation." The intuition that Bill is more blameworthy relies on the hidden premise that unauthorized ingestion *is* a harm (a rights violation), even if welfare is unaffected. If the stipulation "nobody worse off" is taken seriously to mean *no moral injury whatsoever*, the intuition that Bill is more blameworthy vanishes. The skeptic claims the lingering intuition is merely a heuristic error—we *think* Bill is worse because usually success implies harm, but here we are asked to imagine success without harm, which breaks the link our intuitions rely on.

  ### Table

  | position on moral luck | verdict on the pair (equal or unequal blame) | the claim that generates that verdict | the best resistance available to it | what that resistance costs |
  | :--- | :--- | :--- | :--- | :--- |
  | Control-Principle Defender (Skeptic) | Equal Blame | Blame must track only factors within the agent's control (will and effort). | Admit that completed violations feel worse but insist this is irrational bias. | Costs the intuitive fit with ordinary moral practice where completions are punished more severely. |
  | Moral-Luck Defender | Unequal Blame | Blame tracks the actual state of affairs produced; a completed wrong is worse than an attempted one. | Argue that without harm, the "completion" is morally inert. | Costs the commitment to the Control Principle, making moral standing vulnerable to external luck. |
  | Third Position (Objective/Subjective Split) | Equal Blame | Subjective blame is equal (control), but objective wrongness is unequal (outcome). | Argue that blame just *is* the response to wrongness, so they cannot be split. | Costs theoretical simplicity by fracturing the concept of moral assessment into two distinct categories. |
