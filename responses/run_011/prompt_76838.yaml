      *   *Mechanism:* $\delta_t > 0$ is pleasure (positive surprise), $\delta_t < 0$ is pain (negative surprise), $\delta_t = 0$ is neutrality.
      *   *Why this view exists:* Dopamine in mammals looks a lot like RPE. It drives learning and motivation.

  3.  **Drafting - Section by Section:**

