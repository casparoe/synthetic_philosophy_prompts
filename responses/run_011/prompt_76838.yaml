      *Actually, a stronger verdict:* RPE is a candidate for *acute* pain/pleasure (surprise), but not for *chronic* states. An agent with only RPE has moments of shock but no enduring mood. Therefore, it lacks a coherent welfare subject.

      *Let's refine the Wireheading point:* If I wirehead, $r$ is high. $V$ updates to match. $\delta$ becomes 0. If valence = $\delta$, wireheading is neutral. But the agent *chose* it. This implies the agent *anticipated* positive $\delta$. This creates a disconnect between anticipated welfare and experienced welfare.

      *Okay, let's write.*

      *Word Count Check:* Aiming for ~1500 words.
      *Terminology Check:* $r_t$ (scalar reward), $V_t$ (value estimate), $\delta_t$ (TD error).

      *(Final thought before drafting)*: Make sure to explicitly answer the "thermostat" challenge in the "For" section, as requested ("valence has to be a comparison-to-expectation signal... on pain of making thermostats... into candidates").

