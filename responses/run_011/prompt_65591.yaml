prompt: |-
  I am a doctoral candidate in cognitive neuroscience. I referee four or five split-brain manuscripts a year and supervise the lateralized-testing battery in my own lab, so I make the same call repeatedly: does a given behavioural result license an inference to two streams of consciousness, or even to two subjects of experience, or does it license only a claim about disconnection — information failing to reach a hemisphere that nevertheless belongs to a single conscious field? I would like that call turned into a procedure.

  Build a referee's decision procedure that can be run in about an hour on a manuscript and its figures, with no access to the patient and no way to request new controls, and that a reviewer with no training in philosophy of mind can follow. State the questions in order, what counts as a sufficient answer to each, the point at which the procedure terminates in "no two-subject inference licensed," and the points where it hands the issue back to the editor or to the author's chosen criterion of personal identity rather than settling it on data. It must engage, at minimum: the distinction between disconnection and division; why positive evidence of conflict and negative evidence of failed transfer warrant different inferences; the standing confounds (subcortical and ipsilateral routes, commissural remnants, eye movements and cueing, tasks one hemisphere can solve unaided); and the gap between absence of verbal report and absence of experience, given that a confabulating interpreter is not a lying one. Mark explicitly which steps are judgment calls in procedural dress.

  Then run the procedure on three cases. First, a manuscript reporting accurate left-hand pointing to a left-field picture together with the patient's denial that anything appeared. Second, a manuscript reporting the intermanual conflict Akelaitis called diagonistic dyspraxia, in which one hand buttons a shirt while the other unbuttons it. Third, a manuscript that reproduces the failure of cross-field comparison after complete callosotomy yet finds above-chance verbal identification of left-field stimuli. The third is close to a study my own lab is preparing to submit: report what the procedure yields there even if the verdict is one I would rather not receive, and tell me if the grounds on which it is rejected would also sink the first case. Finally, state what the procedure cannot do — which questions it leaves permanently underdetermined by any amount of behavioural data.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Doctoral candidate in cognitive neuroscience, experienced with split-brain manuscripts and lateralized testing.
      *   **Task:** Create a referee's decision procedure (checklist/flowchart style) to evaluate claims of "two streams of consciousness" vs. "disconnection within a single conscious field" based *only* on manuscript data (no new experiments, no patient access).
      *   **Constraints:**
          *   Must be runnable in ~1 hour.
          *   Must be followable by a reviewer without philosophy of mind training.
          *   Must address specific theoretical issues: disconnection vs. division, positive conflict vs. negative transfer, confounds (subcortical, ipsilateral, remnants, eye movements, task difficulty), verbal report vs. experience (interpreter hypothesis).
          *   Must identify judgment calls.
          *   Must define termination points (reject claim, defer to editor/author).
          *   Must apply the procedure to three specific cases.
          *   Must state limitations (what data cannot determine).
      *   **Tone:** Professional, rigorous, scientifically grounded, acknowledging the philosophical complexity without requiring philosophical expertise to use the tool.

  2.  **Deconstruct the Core Problem:**
      *   The central tension is between *anatomical/functional disconnection* (information doesn't get from A to B) and *phenomenological division* (A experiences X, B experiences not-X, and they are distinct subjects).
      *   Standard neuroscience often equates disconnection with division. Philosophy of mind (and careful neuroscience) warns against this.
      *   The procedure needs to filter out alternative explanations for apparent "two-mindedness" before allowing the inference.

  3.  **Drafting the Decision Procedure (The "Split-Brain Inference Protocol" - SBIP):**
      *   *Structure:* Sequential gates. If you fail a gate, the inference is blocked or deferred.
      *   *Time Limit:* Needs to be concise. ~10-12 key questions.
      *   *Key Sections:*
          1.  Anatomical/Physiological Integrity (Is it really split?)
          2.  Stimulus Control (Did the stimulus stay lateralized?)
          3.  Task Capacity (Could one hemisphere do it alone?)
          4.  Evidence Type (Conflict vs. Deficit)
          5.  Report vs. Experience (The Interpreter problem)
          6.  Final Verdict.

      *   *Specific Requirements to Integrate:*
          *   Disconnection vs. Division distinction.
          *   Positive (conflict) vs. Negative (transfer failure) evidence.
          *   Confounds (subcortical, ipsilateral, remnants, eye movements).
          *   Verbal report gap.
          *   Labeling judgment calls.

      *   *Drafting Steps (Mental Iteration):*
          *   *Step 1: Anatomy.* Need MRI evidence of complete callosotomy. If remnants exist, stop.
          *   *Step 2: Lateralization.* Tachistoscopic control? Eye tracking? If not rigorous, stop.
          *   *Step 3: Subcortical.* Is the task immune to subcortical transfer? (e.g., complex semantic vs. simple alerting).
          *   *Step 4: Single Hemisphere Capacity.* Can the LH do this alone? If yes, no need for RH contribution.
          *   *Step 5: The Nature of the Evidence.* Is it *conflict* (diagonistic) or *deficit* (can't name LVF)? Deficits suggest disconnection; Conflict suggests division.
          *   *Step 6: The Report Gap.* If LVF stimulus is denied but hand points, is it absence of experience or absence of access? (Interpreter).
          *   *Step 7: Termination.*

      *   *Refining for the User's Constraints:* The user wants to know *when* to hand it back to the editor or author's criterion. I need to make sure the procedure doesn't pretend to solve the Hard Problem, but rather assesses the *licensing* of the inference.

  4.  **Developing the Three Cases:**
      *   *Case 1: LVF Pointing + Verbal Denial.* (Classic dissociation).
          *   Analysis: Is this conflict or access failure? Likely access failure (LH interpreter doesn't know). Doesn't prove two subjects, just disconnection.
      *   *Case 2: Diagonistic Dyspraxia.* (Intermanual conflict).
          *   Analysis: This is positive conflict. Two goals at once. Stronger evidence for division, but could be automatic vs. voluntary conflict within one agent.
      *   *Case 3: Cross-field failure + Above-chance LVF Verbal ID.* (The user's lab case).
          *   Analysis: This is tricky. If they can name it, is it really lateralized? Or is there subcortical transfer? Or commissural remnant? If the procedure is strict, this might fail the lateralization control or anatomical integrity check. The prompt asks to be honest even if the verdict is unwanted.
          *   *Comparison:* Does the rejection reason for Case 3 apply to Case 1? Case 1 relies on *denial*, Case 3 on *identification*. The confounds differ.

  5.  **Addressing the Limitations:**
      *   Behavioural data cannot prove phenomenology.
      *   "Subject of experience" is a metaphysical category, not a neural one.
      *   The procedure assesses *warrant*, not *truth*.

  6.  **Refining the Output (Self-Correction during drafting):**
      *   *Critique:* Is the procedure too philosophical?
      *   *Fix:* Keep the language operational. Instead of "Is there a distinct subject?", ask "Does the behavior require simultaneous, contradictory intentional states?"
      *   *Critique:* Did I mark the judgment calls?
      *   *Fix:* Explicitly label them [JUDGMENT CALL].
      *   *Critique:* Did I address the "Interpreter"?
      *   *Fix:* Ensure Step 5 specifically handles the verbal report gap.
      *   *Critique:* The user asked about the third case potentially sinking the first.
      *   *Fix:* Need to carefully compare the confounds. Case 1 is "blind sight" style. Case 3 is "leakage" style. They are vulnerable to different confounds.

  7.  **Final Polish:**
      *   Ensure the tone respects the user's expertise (no explaining basics of split-brain, focus on the inference gap).
      *   Check timing (1 hour limit). The procedure should be a checklist, not a treatise.
      *   Ensure the "Hand-off" points are clear (Editor vs. Author).

  8.  *(Self-Correction on Case 3)*: The prompt says "reproduces failure of cross-field comparison yet finds above-chance verbal identification." This implies the LH can name it *sometimes* or *above chance* despite the callosotomy. This suggests subcortical leakage or incomplete section. If the procedure is strict on anatomical completeness, this fails early. If it passes anatomy, it fails on lateralization control. I need to be precise here. If the LH names LVF stimuli, the default assumption is *failed lateralization* or *subcortical transfer*, not necessarily two minds. In fact, it weakens the two-minds claim because it suggests unity of access. Wait, if the claim is "two minds," finding LH access to RH stimuli actually *undermines* the separation. But if the claim is "RH has language," it supports it. The prompt asks about the inference to *two streams*. If LH can access it, the streams aren't fully separate. I need to parse this carefully.
      *   *Re-reading Case 3:* "failure of cross-field comparison" (suggests separation) BUT "above-chance verbal identification of left-field stimuli" (suggests connection). This is a contradiction in the data profile. The procedure should flag this as a confound (subcortical/commissural) that invalidates the "complete disconnection" premise required for the strong two-minds claim.
      *   *Comparison to Case 1:* Case 1 (Denial) is consistent with disconnection. Case 3 (Identification) is inconsistent with *complete* disconnection. So the rejection grounds differ. Case 1 fails on "Conflict vs. Deficit." Case 3 fails on "Anatomical/Functional Integrity."

  9.  **Finalizing the Text:** Assemble the sections logically. (Procedure -> Application -> Limitations). Ensure the "Judgment Calls" are highlighted. Ensure the "Hand-off" points are distinct.

  *(Self-Correction on "One Hour"):* Make the steps actionable. "Check Figure X," "Read Methods Section Y."

  *(Self-Correction on "Philosophy"):* The user knows the philosophy. The tool is for a reviewer who *doesn't*. So the questions must translate philosophical problems into methodological checks. E.g., instead of "Solve the problem of other minds," ask "Is there evidence of simultaneous contradictory intent?"

  Let's write it.cw
answer: |-
  # The Split-Brain Inference Protocol (SBIP)
  **A Referee's Decision Procedure for Claims of Divided Consciousness**

  **Purpose:** To evaluate whether behavioural data in a callosotomy manuscript warrants the inference of *two streams of consciousness/subjects* (Division) or merely *informational disconnection within a single field* (Disconnection).
  **Time Budget:** 60 Minutes.
  **User:** Reviewer with neuroscience training, no required background in philosophy of mind.
  **Inputs:** Manuscript text, Figures, Supplementary Materials (Anatomy/Methods only).

  ---

  ## PART I: THE PROCEDURE

  ### Gate 1: Anatomical and Physiological Integrity (10 mins)
  *Goal: Establish that the physical substrate for a "split" is actually present.*

  **Q1. Is there MRI evidence of complete callosal section?**
  *   **Sufficient Answer:** Yes, post-operative MRI confirms severing of genu, body, splenium, and hippocampal commissure.
  *   **Insufficient:** Relying on surgical report alone; pre-op MRI only; "functional callosotomy" inferred from behaviour.
  *   **Action:** If **No**, terminate. **Verdict:** No two-subject inference licensed. (Residual commissural fibers allow unity).
  *   **[JUDGMENT CALL]:** If MRI shows thinning but not complete absence, does the author argue functional disconnection? If so, proceed to Q2 but note this as a major limitation.

  **Q2. Are subcortical and ipsilateral routes ruled out for the specific task?**
  *   **Sufficient Answer:** Task requires high-resolution foveal processing or complex semantic integration known to be cortically dependent; stimulus duration prevents eye movements.
  *   **Insufficient:** Simple detection tasks; emotional stimuli (amygdala routes); motor tasks (ipsilateral corticospinal tracts).
  *   **Action:** If **No**, terminate. **Verdict:** No two-subject inference licensed. (Behaviour could be mediated by a unified subcortical system).

  ### Gate 2: Stimulus Control and Lateralization (15 mins)
  *Goal: Ensure the input actually went to only one hemisphere.*

  **Q3. Is there objective verification of fixation and lateralization?**
  *   **Sufficient Answer:** Eye-tracking data in manuscript showing fixation maintenance during stimulus presentation; or chin-rest + tachistoscope <150ms with validation trials.
  *   **Insufficient:** "Patient instructed to fixate"; manual shutter without timing validation.
  *   **Action:** If **No**, terminate. **Verdict:** No two-subject inference licensed. (Stray eye movements unify the input).

  **Q4. Does the task exceed the unilateral capacity of the receiving hemisphere?**
  *   **Sufficient Answer:** Control data shows the hemisphere *cannot* perform the task when tested in isolation (e.g., RH cannot name; LH cannot process global form).
  *   **Insufficient:** Assuming LH is "verbal" and RH is "non-verbal" without task-specific validation.
  *   **Action:** If **No**, terminate. **Verdict:** No two-subject inference licensed. (If one hemisphere can do it alone, no second agent is needed to explain the output).

  ### Gate 3: The Nature of the Evidence (20 mins)
  *Goal: Distinguish between "lack of access" and "active opposition."*

  **Q5. Is the primary evidence *Positive Conflict* or *Negative Deficit*?**
  *   **Definition:** *Positive Conflict* = Simultaneous, contradictory goal-directed actions (e.g., one hand buttons, one unbuttons). *Negative Deficit* = Failure to transfer info (e.g., can't name LVF object).
  *   **Sufficient Answer for Division:** Evidence is primarily Positive Conflict.
  *   **Action:** If evidence is primarily **Negative Deficit**, proceed to Q6. Do **not** infer two subjects yet.
  *   **[JUDGMENT CALL]:** Is the "conflict" truly intentional (goal-directed) or merely motoric interference (e.g., reflexive grasping vs. voluntary release)? If motoric, treat as Negative Deficit.

  **Q6. (For Negative Deficit Cases) Is the absence of report attributed to absence of experience?**
  *   **Sufficient Answer:** Author acknowledges the "Interpreter" hypothesis (LH confabulates lack of knowledge because it lacks access, not because RH lacks experience).
  *   **Insufficient:** Author equates "Patient says No" with "RH saw nothing."
  *   **Action:** If **Insufficient**, terminate. **Verdict:** No two-subject inference licensed. (This is a disconnection claim, not a division claim).
  *   **Hand-off:** If the author insists verbal denial proves RH non-experience, flag for **Editor**: *This relies on a philosophical premise (Access = Phenomenology) not settled by data.*

  ### Gate 4: The Unity of Agency (15 mins)
  *Goal: Determine if the behaviour requires two 'selves' or just one confused self.*

  **Q7. Does the behaviour demonstrate simultaneous, contradictory *intentions*?**
  *   **Sufficient Answer:** Yes. Both actions are purposive, context-appropriate, but mutually exclusive (e.g., Diagonistic Dyspraxia).
  *   **Insufficient:** One action is purposive, the other is reflexive/automatic (e.g., intermanual grasping).
  *   **Action:** If **Insufficient**, terminate. **Verdict:** No two-subject inference licensed. (Compatible with single agent struggling with disconnection).
  *   **[JUDGMENT CALL]:** Distinguishing "automatic" from "intentional" in a paralyzed/lesioned system. Rely on author's kinematic analysis if available.

  **Q8. Is the "Two-Subject" claim necessary to explain the variance?**
  *   **Sufficient Answer:** A single-agent disconnection model fails to predict the data (e.g., RH corrects LH error without LH awareness *and* without motor conflict).
  *   **Action:** If a single-agent model fits, terminate. **Verdict:** Claim not licensed. Prefer parsimony.

  ### FINAL VERDICT SELECTION

  *   **Option A (Reject Inference):** Failed Gates 1, 2, 4, or 5 (Deficit only). *Manuscript may still be publishable as a disconnection study, but claims of "two minds" must be retracted.*
  *   **Option B (Defer to Editor):** Passed Gates 1-4, but hinges on Q6 (Verbal Report gap). *The data is clean, but the metaphysical leap is not scientific.*
  *   **Option C (Defer to Author's Criterion):** Passed all gates. *The data licenses the inference **if** one accepts the author's operational definition of "subject."* (Reviewer must note this dependency).

  ---

  ## PART II: RUNNING THE PROCEDURE ON THREE CASES

  ### Case 1: LVF Pointing + Verbal Denial
  *Manuscript:* Patient points correctly with left hand to LVF stimulus but verbally denies seeing anything.
  *   **Gate 1 (Anatomy):** Assume complete callosotomy. (Pass)
  *   **Gate 2 (Control):** Assume tachistoscopic control. (Pass)
  *   **Gate 3 (Evidence Type):** This is **Negative Deficit** (failure to report), not Positive Conflict. The hand points (RH knows), mouth denies (LH doesn't know).
      *   *Procedure Check (Q5):* Evidence is Deficit.
      *   *Procedure Check (Q6):* Does the author claim the RH *experienced* the stimulus despite the denial?
      *   *Verdict:* **No Two-Subject Inference Licensed.**
      *   *Reasoning:* This is the classic "disconnection" profile. The LH interpreter lacks data. It does not prove the RH is a *subject*; it only proves the RH is a *processor* inaccessible to the LH speaker. The denial is an absence of access, not necessarily an absence of experience, nor does it prove a *second* experience.
      *   *Action:* Require authors to rephrase from "Two minds" to "Lateralized processing with interhemispheric disconnection."

  ### Case 2: Diagonistic Dyspraxia (Akelaitis)
  *Manuscript:* One hand buttons a shirt; the other simultaneously unbuttons it. Patient expresses frustration with the "alien" hand.
  *   **Gate 1 & 2:** Assume anatomical and stimulus controls are met (intrinsic task). (Pass)
  *   **Gate 3 (Evidence Type):** This is **Positive Conflict**. Two goal-directed motor programs running in opposition.
      *   *Procedure Check (Q5):* Pass.
  *   **Gate 4 (Unity of Agency):**
      *   *Procedure Check (Q7):* Are both intentions simultaneous and contradictory? Yes.
      *   *Procedure Check (Q8):* Can a single agent explain this? A single agent usually resolves conflict (stops one hand). The persistence of opposition suggests distinct volitional centers.
      *   *Verdict:* **Inference Licensed (Conditional).**
      *   *Condition:* This passes the behavioural bar for "division of agency." However, the procedure hands the final metaphysical claim to the **Author's Criterion**. The data shows two *agents of action*, but whether that equals two *subjects of experience* remains a philosophical overlay.
      *   *Reviewer Note:* "The data supports distinct volitional streams. Claims of distinct *phenomenal fields* rely on the assumption that volitional independence entails phenomenal independence."

  ### Case 3: Cross-Field Failure + Above-Chance LVF Verbal ID
  *Manuscript:* Standard comparison tasks fail (LH can't compare to LVF), yet patient verbally identifies LVF objects at 70% accuracy (chance 20%).
  *   **Gate 1 (Anatomy):** **FAIL.**
      *   *Reasoning:* If the LH can verbally identify LVF stimuli above chance in a complete callosotomy, information is crossing.
      *   *Procedure Check (Q1/Q2):* This suggests either commissural remnants or **subcortical transfer**.
      *   *Action:* **Terminate. No Two-Subject Inference Licensed.**
      *   *Reasoning:* You cannot claim "two streams of consciousness" if the streams are demonstrably leaking enough information to support verbal identification. The "failure of cross-field comparison" might be due to task difficulty/bandwidth limits, but the verbal ID proves functional unity exists.
      *   *Verdict:* **Reject Claim.** The data contradicts the premise of separation required for the two-minds hypothesis.

  **Comparison: Does the rejection of Case 3 sink Case 1?**
  *   **No.** The grounds are different.
  *   **Case 3** is rejected on **Functional Integrity** (Gate 1/2). The system is *too connected* to support a division claim.
  *   **Case 1** is rejected on **Inference Type** (Gate 3/5). The system is disconnected, but the behaviour (denial) is consistent with a *single* mind lacking access, not *two* minds existing.
  *   *Implication for your lab:* If your upcoming manuscript (Case 3 profile) shows above-chance verbal ID, you cannot claim "two subjects." You must claim "partial disconnection with subcortical leakage." If you claim "two subjects," this procedure mandates rejection. If you claim "RH has covert language access via subcortical routes," it passes.

  ---

  ## PART III: LIMITATIONS OF THE PROCEDURE

  **1. The Phenomenology Gap (Permanent Underdetermination)**
  No behavioural procedure can determine *what it is like* to be the right hemisphere. Case 2 (Dyspraxia) shows two *wills*, but not necessarily two *feelings*. The procedure licenses an inference to "two agents of control," but the leap to "two subjects of experience" is metaphysical. This procedure explicitly hands that specific claim to the author's philosophical commitment (Option C).

  **2. The Interpreter Problem**
  The procedure identifies when the LH Interpreter is likely confabulating (Case 1), but it cannot quantify the RH's experience. We can prove the LH is ignorant; we cannot prove the RH is sentient. The procedure treats "absence of verbal report" as "absence of evidence," not "evidence of absence," but it cannot solve the inverse.

  **3. Dynamic Unity**
  The procedure is static. It assesses a manuscript at a snapshot in time. It cannot account for dynamic unity (e.g., hemispheres integrating over longer timeframes than the trial allows). A "two-mind" verdict at 150ms presentation might be a "one-mind" verdict at 2000ms.

  **4. The Definition of "Subject"**
  The procedure assumes a working definition of "subject" tied to *volitional independence* and *informational privacy*. If a reviewer or author holds a psychological continuity view of identity, or a biological view, the behavioural data here is largely irrelevant. The procedure flags this (Hand-off to Author's Criterion) but cannot resolve it.

  **Summary for the Referee:**
  Use this tool to police the *gap* between the data and the headline.
  *   If the data shows **leakage** (Case 3), kill the "Two Minds" claim.
  *   If the data shows **deficit only** (Case 1), kill the "Two Minds" claim (downgrade to Disconnection).
  *   If the data shows **conflict** (Case 2), allow the claim *only if* the authors acknowledge the philosophical assumption linking agency to phenomenology.
