prompt: |-
  So I cut video for a living — mostly documentaries, frame-accurate stuff, A/V sync, latency, hunting for the exact frame where something happens. My partner is in year two of a cog sci PhD and lately she's been using my job against me. Her line: your brain never watches a live feed, it only ever watches the finished cut, and the finished cut gets re-edited after the events it depicts — so when I say "I saw the red dot travel and change colour in mid-flight, that's just what it was like from the inside," I'm reading the credits off a film that was re-cut in the dark. Her go-to metaphor for this is Soviet photo doctoring: Stalin's people painting a disgraced official out of a picture so that where he stood there's now only canal water, plus the memory holes in 1984. She says the whole argument in her field about the colour phi phenomenon is exactly that: either the brain holds back and composes the experience so the colour change really is experienced during the motion (the photo published already doctored) or the experience happens in real time and only the record gets rewritten afterwards (the memory hole) — and, her favourite bit, no experiment could ever tell the two appart.

  She also rides it to a much bigger claim I want checked: that there is no present moment of experience at all, that a report is always about a reconstructed record rather than about what happened, and that an editor's confidence about timing ("I know which frame it was on") is a category error.

  I'm not trying to win an argument, I genuinely can't tell how much load the metaphor is carrying. Can you audit it?

  - the correspondence, as an actual table: what plays the photographer, the negative, the airbrush, the published print, the censor's office, the public, the fact of the matter about who was standing there
  - where it holds and where it snaps. I already have one suspicion: a real censor has the unretouched negative to compare the fake against, and she seems to be saying there's no raw footage in perception to compare against — if that's right, is the metaphor doing the work she thinks it is, or is it just a pair of labels?
  - which disanalogies are load-bearing for her big claim and which are quibbles I should drop
  - whether the big claim survives once the disanalogies are on the table, or whether the Soviet imagery was holding it up the whole time
  - and if it's broken, a better analogy I could actually use back on her, plus what that one hides

  Lead with a bottom line of two or three sentences on how much of her argument survives. Then these sections, in this order:

  1. **The correspondence table** — the table plus a few lines on the entries with no clean counterpart (~250 words)
  2. **Where it holds** — short, ~150 words, don't be generous just to seem fair
  3. **Where it snaps** — the meat, 400–500 words, and get concrete about the colour phi timing puzzle: how can the experience of the first dot be edited using information that only arrives with the second dot, and what does that do to the censor picture
  4. **Load-bearing vs decorative** — sort the disanalogies, ~200 words
  5. **Does the big claim survive** — ~250 words
  6. **A better analogy** — ~150 words, and what it costs

  One request: don't hand me citations or paper titles, I can't check anything and I dont want invented ones. If things like the cutaneous rabbit or the flash-lag effect bear on this, just describe them in a sentence or two in your own words.
