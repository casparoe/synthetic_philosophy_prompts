      *   **Audience:** ~30 people. Mix of AI safety researchers (deception/oversight), Kant scholars, Clinical ethicist (hospital chair), Philosophers of law (liability).
      *   **Format:** Objections phrased in the voice of each group, 2-minute reply for each, note on where the reply is softest.
