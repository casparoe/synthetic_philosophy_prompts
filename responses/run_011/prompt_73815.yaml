  We meet alike within the smoke and sand,
  Two uniforms soaked through the heavy rain.
  No flag distinguishes the spill of pain,
  Or measures out the merit of our stand.
  The weapon rests within a shared command,
  The fear that shakes the heart is purely vain.
  We walk together on this wasted plain,
  As duelists in a gray and neutral land.
  Yet justice cracks the glass beneath the light,
  One side is shield, the other is the spear.
  The aggressor holds no warrant for the fight,
  Unless the drum compelled him to appear.
  The cages wait to take the surrendered gear,
  And bind them both with one indifferent hand.

