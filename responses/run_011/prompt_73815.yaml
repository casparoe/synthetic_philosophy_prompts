      *   **Symmetry (Walzer):** Soldiers on both sides have equal rights to kill each other. They are "dangerous men" engaged in a mutual risk. Justice of cause doesn't change the right to kill in combat.
      *   **Asymmetry (Revisionists - McMahan, etc.):** Only just combatants have the right to kill. Unjust combatants are more like culpable threats. Killing them is more like self-defense.
