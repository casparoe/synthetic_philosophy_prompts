answer: |-
  ### Part I: The Translation
  **Exemplarism Restated in Motor Learning Vocabulary**

  Here is the claim that "we become better by attending to the life of a better person," translated systematically into the vocabulary of skill acquisition and strength and conditioning.

  **1. The Exemplar as the Model Performer**
  In this framework, the saint or the historical hero is the **Model Performer**. Just as a junior lifter watches a video of a senior athlete to establish a mental representation of the pull, the moral learner watches the life of the exemplar to establish a representation of virtue.
  *   *The Stretch:* In coaching, the model demonstrates a physical kinematic pattern. In moral learning, the "pattern" is behavioral and dispositional across decades. Calling a life a "performance" stretches the term because a life is not a discrete trial with a clear start and stop, but a continuous stream of constraints.

  **2. Admiration as Attentional Focus and Arousal Regulation**
  The claim that "admiration identifies exemplars" translates to **Attentional Focus**. Admiration is the mechanism that gates sensory input; it ensures the learner attends to the relevant cues of the model rather than distractors. It also functions as **Arousal Regulation**: admiration increases physiological and cognitive arousal, priming the nervous system for encoding.
  *   *The Stretch:* In motor learning, attention is usually cognitive (watching the bar path). Admiration is affective (love, awe). Treating emotion as a purely attentional gate ignores its motivational content.

  **3. Narrative Particularity as Knowledge of Performance (KP)**
  The claim that "narrative particularity carries content rules cannot" translates to **Knowledge of Performance (KP)** versus **Knowledge of Results (KR)**. A rule ("be brave") is KR—it tells you the outcome. A story about a specific act of bravery is KP—it shows the movement pattern, the timing, the context. Plutarch's focus on "slight things" (a jest, an expression) is a focus on **Kinematic Detail**. It isolates the micro-movements that constitute the skill, rather than the macro-outcome (winning the battle).
  *   *The Stretch:* KP in coaching is objective (knee angle, bar velocity). Narrative detail is interpretive. The "kinematics" of a jest are not measurable.

  **4. Pairing and Comparison as Comparative Video Analysis**
  Plutarch's method of pairing a Greek with a Roman translates to **Comparative Video Analysis**. You place two models side-by-side to highlight **Degrees of Freedom**. By seeing how two different athletes solve the same task constraint (e.g., leading an army), the learner understands which features are essential to the skill and which are individual stylistic variations.
  *   *The Stretch:* In coaching, we compare techniques to find mechanical efficiency. In Plutarch, we compare lives to find moral equivalence. The "efficiency" metric is absent.

  **5. Hagiographic Embellishment as Idealized Modeling**
  The hagiographer's license to improve on the facts translates to **Idealized Modeling**. In coaching, we sometimes simplify a demonstration to remove noise, showing the "perfect" rep before showing the gritty reality. Hagiography removes the noise of the saint's hesitations to present a clean **Motor Program**.
  *   *The Stretch:* In motor learning, idealized models can discourage learners if the gap is too wide (see "Model Similarity" below). Hagiography assumes the idealization *inspires* rather than discourages. This contradicts the "coping model" finding.

  **6. Faults as Error Marking**
  Plutarch's caution to notice faults but not copy them translates to **Error Marking**. The coach points out where the model deviated from the ideal to prevent **Negative Transfer**. The learner segments the model: copy the pull, ignore the knee valgus.
  *   *The Stretch:* In coaching, errors are mechanical deviations from an optimal path. In moral lives, "faults" are often structural to the person's psychology, not just execution errors. Separating the "virtue" from the "fault" is harder than separating a good pull from a bad knee.

  **7. Self-Fashioning as Internalization and Automation**
  The goal of fashioning one's character translates to **Internalization** and **Automation**. The learner moves from cognitive processing (thinking about the saint) to autonomous execution (acting virtuously without deliberation). The exemplar becomes a **Stored Template**.
  *   *The Stretch:* This directly conflicts with the **Constraints-Led Approach (CLA)** you mentioned, which denies the stored template. I will address this in the residue report.

  ***

  ### Part II: The Residue Report

  Here is the sorting of the components based on how well they fit your coaching framework.

  **Pile 1: Clean Translation (High Fidelity)**
  *   **Modeling/Demonstration:** The core mechanism of watching someone else to learn is identical.
  *   **Attentional Gating:** The idea that you must focus on specific cues (small signs) to learn is standard motor learning.
  *   **Segmentation/Chunking:** Breaking a life down into episodes (chunks) to learn specific virtues is analogous to breaking a lift into phases.
  *   **Error Marking:** The instruction to ignore the exemplar's faults is standard coaching ("don't copy his grip, copy his hip drive").

  **Pile 2: Distorted Translation (Significant Friction)**
  *   **Admiration as Attention:** In your framework, attention is cognitive/volitional. In the tradition, admiration is passive/affective; it *happens* to you. Translating this as "attentional focus" strips it of its normative force. It costs you the explanation of *why* the learner attends.
  *   **Idealized Modeling (Hagiography):** Your literature suggests **Coping Models** (learners who struggle and overcome) are better for self-efficacy than **Mastery Models** (flawless experts). Hagiography provides Mastery Models. The distortion here is assuming that seeing a flawless performance aids acquisition, whereas your field suggests it often induces anxiety or disidentification.
  *   **Outcome Measures (KR):** In rowing, you have the split time. In moral learning, there is no KR. You cannot measure "virtue" at the end of the rep. The translation must pretend that "living a good life" is a measurable result, which it is not. This removes the feedback loop essential to your framework.

  **Pile 3: Untranslatable (Category Errors)**
  *   **Normativity:** Your framework explains *how* to move. It cannot explain *why* this movement is good. Exemplarism claims the model reveals the *Good*. Motor learning is value-neutral regarding the goal (you can coach a thief to pick pockets efficiently).
  *   **Teleology (The End Goal):** In S&C, the goal is performance. In Plutarch, the goal is *eudaimonia* or salvation. The "why" of the practice is external to the mechanics in your framework, but internal to the moral tradition.
  *   **Identity vs. Skill:** Your framework assumes the learner remains the same person acquiring a new tool. The tradition assumes the learner *becomes* a different kind of person. This is identity formation, not skill acquisition.

  ***

  ### Part III: Pressure Points

  **1. The Self-Model Finding vs. The Superior Exemplar**
  *   *The Conflict:* Your literature states learners do better with a model who resembles them (similar skill level, similar body type). The tradition insists on models who vastly outrun the learner (saints, heroes).
  *   *The Analysis:* This is a genuine contradiction *if* moral learning is skill acquisition. However, the tradition might be making a claim about **Motivation** rather than **Kinematics**. A superior model sets the *direction* (the vector), even if they cannot be copied mechanically. In coaching, we use world-record holders to set the *potential* of the sport, even if juniors copy their immediate seniors for technique. The tradition is using the superior exemplar for **Goal Setting**, not for **Movement Pattern Matching**. Your framework separates these; the tradition conflates them.

  **2. Smoothing Errors: Defect or Feature?**
  *   *The Conflict:* Your framework flags smoothing errors as bad design (creates a false representation of the task constraints). Hagiography smooths errors to make the virtue legible.
  *   *The Analysis:* In motor learning, hiding errors prevents the learner from developing **Error Detection Mechanisms**. If the saint never struggles, the learner doesn't learn how to recover from moral failure. However, the hagiographer might argue they are not teaching *recovery*; they are teaching *orientation*. The smoothness is not a technical demo; it is a **Target**. It is the difference between showing a lifter how to grind a rep (technical) and showing them a gold medal (target). Your framework has no category for "Target that is not also a Technical Demo."

  **3. The Missing Outcome Measure**
  *   *The Conflict:* You can measure the lift. You cannot measure the life.
  *   *The Analysis:* This is the strongest point of failure for the translation. Motor learning relies on **Augmented Feedback** (KR/KP). Without KR, the learner cannot calibrate. In moral learning, the "KR" is often delayed until death (judgment) or is entirely internal (conscience). This means moral learning operates in a **Feedback-Starved Environment**. Your framework suggests learning should stall here. The tradition suggests **Faith** or **Community Verification** substitutes for KR. Your vocabulary has no term for "trust-based feedback."

  **4. Constraints-Led View vs. Internalized Template**
  *   *The Conflict:* CLA says technique is a solution discovered under constraints, not a stored template. Exemplarism says "carry the saint inside you" (a template).
  *   *The Analysis:* The CLA undermines the traditional view. If virtue is a solution to specific environmental constraints, then copying a saint from the 4th century (different constraints) is **Negative Transfer**. You cannot copy the *solution*; you must copy the *process of solving*. Plutarch hints at this with the "small signs" (showing the process), but the hagiographers violate it (showing the static result). Your framework supports a **Neo-Exemplarism**: don't copy the saint's actions; copy the saint's *attunement to constraints*. But that is not what the tradition historically claimed.

  ***

  ### Part IV: The Verdict

  You asked which way the residue cuts. I will not hedge.

  **The residue is evidence that your framework is missing something structural about normative learning.**

  It is not merely that the exemplarist claim is "unclear" or that you were actually formed by "belonging and ritual" (though those were likely the delivery mechanisms). The problem is that your vocabulary is designed for **Instrumental Learning** (how to achieve X), whereas moral formation is **Constitutive Learning** (how to become Y).

  **What is missing is a category of object: The Telos.**
  In your framework, the goal (the lift) exists independently of the lifter. The bar does not care who lifts it. In the moral tradition, the goal (the good life) is inseparable from the liver. You cannot separate the "performance" from the "person." Your framework treats the athlete as a machine optimizing output. The tradition treats the learner as a narrative seeking coherence.

  **What is missing is a category of feedback: Retrospective Coherence.**
  In coaching, feedback is immediate (the lift lands or it doesn't). In moral learning, feedback is often retrospective (I understand why that was brave only five years later). Your framework has no mechanism for **Delayed Integration**. This is why the "narrative" is essential—it holds the data until the meaning can be processed. A spreadsheet cannot do this.

  **What is missing is a category of time scale: A Life vs. A Season.**
  Your framework optimizes for peak performance within a competitive cycle. The tradition optimizes for unity across a lifespan. The "smoothing" of the saint's life is not a technical error; it is an attempt to show a **Completed Trajectory**. You cannot judge a lift by its finish, but the tradition judges a life *only* by its finish ("call no man happy until he is dead"). Your vocabulary treats the process as iterative; the tradition treats it as cumulative and irreversible.

  **Conclusion on the "Belonging/Ritual" Hypothesis:**
  You suggested you might have been formed by "belonging, ritual, fear, narrative pleasure" rather than imitation. Your framework would classify these as **Psychological Skills Training** or **Group Cohesion** variables. While these are real, dismissing the exemplarist claim entirely as a misdescription is too cynical. The exemplar provides the **External Focus of Attention** that allows the ritual to have direction. Without the exemplar, the ritual is just movement. Without the ritual, the exemplar is just data.

  **Final Judgment:**
  The exemplarist tradition is attempting to solve a problem your framework does not acknowledge: **How do you learn a skill where the metric of success is invisible and the timeframe is a lifetime?**
  The tradition uses "Admiration" to solve the attention problem. It uses "Narrative" to solve the feedback delay problem. It uses "Idealization" to solve the motivation problem.
  Your framework identifies the mechanical flaws in this design (idealization creates unrealistic templates; lack of KR prevents calibration). But your framework offers no alternative for how to learn *without* immediate KR or measurable outcomes.

  Therefore, the residue indicates that **Moral Learning is not a subset of Motor Learning.** It is a different category of adaptation. If you try to force it into your coaching vocabulary, you will successfully identify the *inefficiencies* of the traditional method (e.g., "hagiography is bad demo design"), but you will fail to explain its *persistence* or its *efficacy* in forming identity. You are analyzing a religion with a stopwatch. The stopwatch is accurate, but it cannot measure salvation.

  **A Note on Consensus:**
  I must state plainly: The view that "admiration identifies exemplars and imitation acquires virtue" is **not settled** in moral psychology or philosophy. It is defended by contemporary exemplarists (e.g., Linda Zagzebski), but it is contested by situationists (who argue character is not stable enough to be modeled) and by cognitive psychologists who argue moral reasoning is more rule-based or intuition-based than imitative. Plutarch's specific method of "small signs" is widely accepted by classicists as accurate to his text, but whether this *actually works* to form virtue is an empirical claim that remains disputed. Your skepticism of the mechanism is shared by a significant portion of modern ethical theory.
