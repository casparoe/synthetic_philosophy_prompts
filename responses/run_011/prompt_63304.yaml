answer: |-
  ### The Aquaculture Decision Taxonomy

  This tree is built from five branching questions. Follow the path that matches your answer to find your position. Note that the final branch ("Verifiability") has been collapsed; see the *Collapsed Branches* section below for why.

  #### Branch 1: The Sentience Boundary
  **"When evidence of sentience is uncertain (e.g., crustaceans), do we require high confidence before intervening, or do we apply a precautionary principle weighted by the sheer number of individuals?"**
  *   **High Confidence Required:** We only fund interventions for species where sentience is robustly proven (e.g., vertebrates). Crustaceans are excluded until further notice.
  *   **Precautionary/Weighted:** We intervene where the *expected* suffering is highest, even if probability of sentience is low, provided the population numbers are massive enough to justify the bet.

  #### Branch 2: The Value of Existence
  **"Is bringing a farmed animal into existence a net benefit to that animal (assuming a 'good' life and 'humane' death), or is non-existence preferable to any life that ends in slaughter?"**
  *   **Existence is Neutral/Negative:** The animal would be better off never having been born. The goal is to reduce the *number* of lives started.
  *   **Existence can be Positive:** A life with less suffering is a benefit to the individual, even if it ends early. The goal is to improve the *quality* of lives started.

  #### Branch 3: The Moral Boundary
  **"Does our moral responsibility end at the farm gate, or does it extend to the wild animals killed to feed the farmed ones (fishmeal/oil) and those caught as bycatch?"**
  *   **Farm Gate Only:** We are responsible for the animals we directly farm. Wild capture is a separate supply chain issue.
  *   **Systemic/Feed Inclusive:** We cannot claim to improve welfare if we are outsourcing suffering to wild populations to feed the farmed stock.

  #### Branch 4: The Causal Mechanism
  **"Does improving on-farm welfare conditions accelerate industry growth by reducing consumer friction (legitimization), or does it strictly reduce suffering without significant expansion effects?"**
  *   **Reform Legitimizes:** Welfare tags make consumers feel safe, increasing demand and total animal numbers.
  *   **Reform Mitigates:** Welfare tags reduce suffering per animal without significantly altering demand curves.

  *(Note: The "Verifiability" branch—whether we can trust overnight slaughter monitoring—has been collapsed into Branch 4. Those who believe reform legitimizes the industry almost invariably argue that verification is impossible or easily faked, while those who believe reform mitigates suffering tend to believe verification is achievable. Separating them creates no new funding outcomes, only different rhetorical justifications.)*

  ---

  ### The Leaves (Positions)

  Here are the seven terminal positions generated by the tree.

  **1. The Standard Welfarist**
  *   **Path:** Precautionary + Existence Positive + Farm Gate + Reform Mitigates.
  *   **Name:** Classic Welfare Reform (Person A).
  *   **Awkward Commitment:** Must accept that improving welfare might slightly increase total consumption, but argue the suffering-per-animal drop outweighs the volume increase.
  *   **Funding Outcome:** Subsidize electric stunners and welfare certification for farmed fish.

  **2. The Scale Utilitarian**
  *   **Path:** Precautionary/Weighted + Existence Neutral + Farm Gate + Reform Mitigates.
  *   **Name:** The Numbers Game (The Shrimp Pitch).
  *   **Awkward Commitment:** Must bet on weak sentience evidence for crustaceans solely because the population count is in the trillions, potentially ignoring higher-certainty suffering in fewer fish.
  *   **Funding Outcome:** Subsidize stunners for shrimp/prawns; reject fish projects as "lower impact per dollar."

  **3. The Sentience Purist**
  *   **Path:** High Confidence + Existence Positive + Farm Gate + Reform Mitigates.
  *   **Name:** Evidence-Based Welfarism (Person C).
  *   **Awkward Commitment:** Must ignore the potential suffering of trillions of crustaceans despite the precautionary argument, prioritizing epistemic certainty over scale.
  *   **Funding Outcome:** Fund welfare reforms for finfish only; explicitly exclude all crustacean projects.

  **4. The Systemic Welfarist**
  *   **Path:** Precautionary + Existence Positive + Systemic/Feed + Reform Mitigates.
  *   **Name:** Whole-Chain Reform (Person D + Person A hybrid).
  *   **Awkward Commitment:** Must admit that perfect on-farm welfare is morally insufficient if the feed relies on wild-caught fish, complicating "humane" labeling.
  *   **Funding Outcome:** Fund alternative feed research (algae/insect) *and* on-farm stunning; reject projects that don't address both.

  **5. The Pure Abolitionist**
  *   **Path:** Precautionary + Existence Neutral + Farm Gate + Reform Legitimizes.
  *   **Name:** Demand Reduction (Person B).
  *   **Awkward Commitment:** Must accept that current animals will continue to suffer in bad conditions while waiting for the industry to shrink, rather than helping them now.
  *   **Funding Outcome:** Fund plant-based alternatives, consumer campaigns to quit seafood, and policy bans; reject all on-farm welfare subsidies.

  **6. The Systemic Abolitionist**
  *   **Path:** Precautionary + Existence Neutral + Systemic/Feed + Reform Legitimizes.
  *   **Name:** Wild & Farmed Abolition (Person D + Person B hybrid).
  *   **Awkward Commitment:** Must treat wild forage fish as morally equivalent to farmed fish, implying a need to reduce aquaculture *and* wild fisheries simultaneously.
  *   **Funding Outcome:** Fund alternative proteins and wild fishery reduction campaigns; reject all aquaculture engagement.

  **7. The Precautionary Non-Interventionist**
  *   **Path:** High Confidence + Existence Neutral + Systemic/Feed + Reform Legitimizes.
  *   **Name:** Unnamed (Empty Node).
  *   **Awkward Commitment:** Believes life is not a benefit and reform is harmful, but also refuses to fund abolition because wild sentience is too uncertain to justify the cost of intervention.
  *   **Funding Outcome:** Return the money / Do nothing. (This position is logically consistent but practically unattractive for a foundation).

  ---

  ### Convergences and Empty Spaces

  **1. The "No" Vote Convergence (Abolitionist vs. Scale Utilitarian)**
  You suspected the Abolitionist (Leaf 5) and the Shrimp Numbers person (Leaf 2) might prescribe identical spending. They converge on **rejecting the Fish Stunning proposal**, but for opposite reasons.
  *   **The Abolitionist** votes No because *no* farm welfare should be funded (it legitimizes the industry).
  *   **The Scale Utilitarian** votes No because the money should go to *shrimp*, not fish (opportunity cost).
  *   **The Risk:** They will form a voting bloc against the Fish Stunning campaign, making it look like there is consensus against it, when their underlying logic is incompatible. If the Shrimp proposal comes up next, the Abolitionist will vote No again, while the Scale Utilitarian votes Yes.

  **2. The Empty Node (Leaf 7)**
  The "Precautionary Non-Interventionist" is empty because it is **unattractive**, not incoherent. It combines the skepticism of the Sentience Purist with the pessimism of the Abolitionist. It suggests we know too little to help, but enough to know we shouldn't try. No one actively defends this; it is usually a default position for those who haven't thought it through.

  **3. The Incoherent Node**
  There is a combination that does not exist: **Existence is Positive + Reform Legitimizes + Abolitionist Goal.** If you believe bringing a fish into life is a benefit, but welfare reform causes the industry to grow, you cannot consistently argue for abolition. You would be arguing for *more* farming with better welfare. This combination collapses into Leaf 1 (Standard Welfarist).

  **4. Collapsed Branch: Verifiability**
  I collapsed the "Verifiability" question (can we check the slaughter?) into Branch 4 (Causal Mechanism).
  *   **Why:** In practice, no one argues "Reform legitimizes the industry, *but* we should fund it even if we can't verify it." Nor does anyone argue "Reform mitigates suffering, *but* we shouldn't fund it because we can't verify it."
  *   **Result:** Those who trust the reform (Branch 4: Mitigates) generally assume verification is solvable. Those who distrust the reform (Branch 4: Legitimizes) generally claim verification is impossible. Keeping them separate adds complexity without changing the funding decision.

  ---

  ### Five Lunch Questions

  Do not ask these as a survey. Ask them conversationally to see where the person naturally lands.

  1.  **On Sentience:** "If we found out tomorrow that shrimp feel pain exactly like salmon do, would that change your view on where we spend the money, or is the barrier something else?"
      *   *(Tests Branch 1: Distinguishes the Sentience Purist from the Scale Utilitarian.)*
  2.  **On Existence:** "Imagine a fish that has a great life and is killed instantly without fear. Is the world better with that fish in it, or would it have been kinder if that fish had never been born?"
      *   *(Tests Branch 2: Distinguishes Abolitionists from Welfarists.)*
  3.  **On Boundaries:** "If we perfect welfare on the farm, but the fish are still fed ground-up wild fish, have we actually solved the moral problem, or just moved it?"
      *   *(Tests Branch 3: Distinguishes the Systemic views from the Farm Gate views.)*
  4.  **On Causality:** "Does a 'Humane Certified' label make you more likely to buy seafood, or less? Do you think it does that for the average consumer?"
      *   *(Tests Branch 4: Distinguishes those who fear legitimization from those who see mitigation.)*
  5.  **On Verification:** "If a company tells us they stun every fish, but we can't have an inspector there at 4 AM to check, is that a dealbreaker for funding, or just a risk we manage?"
      *   *(Tests the collapsed Verifiability branch/Trust levels.)*
