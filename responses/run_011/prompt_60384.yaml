  Hey, I've been thinking about Nadia's Thursday case while reading through your notes on the week's sessions, and it is a clever twist on the standard money pump setup. To figure out what she'll say, we have to look at the underlying rules she's been applying to the previous verdicts, because on the surface there is a tension between sticking to a plan and maximizing value. The candidate rules consistent with her record so far are basically Sophisticated Choice and a form of Consequentialist Resoluteness. Sophisticated Choice is where you anticipate your future preferences and constrain your current self to avoid outcomes you know you'll regret, which fits her verdict on paying to be locked out. Consequentialist Resoluteness is where you stick to a plan not because rules are sacred, but because deviating leads to worse overall outcomes, like losing money for nothing in the full cycle. She clearly rejects pure Myopic Choice, which would justify the full money pump as rational simply because each step satisfies a local preference, since she called the full cycle irrational.

  The crucial detail in Thursday's case is that the trade on the cheese is structurally identical to her second verdict, where the woman starts with cheese and swaps to wine. In that case, Nadia said losing the pennies was not irrational because the agent came out ahead in terms of preference satisfaction. In the Thursday case, the agent also comes out ahead by getting a second bottle of wine she prefers to the cheese, minus the two pennies. The only new variable is the resolution not to trade. If Nadia believes resolutions are intrinsically binding regardless of the outcome, she would say sticking is rational, but nothing in her previous verdicts suggests she values rule-following for its own sake. Her justification for the lockout was that the money was well spent, implying the value was in avoiding the loss, not in the act of locking itself. Her justification for the charity case was that the value was preserved elsewhere. This pattern suggests she evaluates rationality based on net value changes rather than procedural purity.

  So my best guess is that she will say breaking the resolution is the rational move. She will likely argue that the resolution was an instrumental tool designed to prevent the specific harm of the money pump cycle, where you end up with the same item and less money. Since the cheese trade does not trigger that cycle and results in a net gain in preference satisfaction, the instrument no longer serves its purpose and should be set aside. The verdict that is doing most of the work here is the second one, where she validated trading cheese for wine at a cost because the agent came out ahead. That verdict establishes that paying pennies is rational if it secures a preferred item, provided you don't cycle back to the start. The resolution in Thursday's case is essentially a precommitment device, and while she endorsed precommitment in the third verdict, she did so because it prevented a net loss. If sticking to the precommitment now causes a net loss of utility by forgoing a preferred bottle of wine, consistency with her consequentialist reasoning suggests she should endorse breaking it.

  If I had to bet, I'd put money on her saying the woman should trade the cheese, because Nadia seems to treat rationality as a matter of not being exploited rather than a matter of never changing one's mind. The only way I could be wrong is if she holds a stricter view of Resolute Choice where the ability to bind oneself is valuable even when it costs utility, but her emphasis on coming out ahead and money well spent makes that seem unlikely. If the record genuinely doesn't decide it because she hasn't yet weighed plan integrity against unexpected gains, the one further case I would put to her at breakfast is a scenario where the agent resolves not to eat dessert, then a friend offers her a free slice of her favorite cake that costs nothing but breaks the resolution. If she says eating the cake is irrational because it breaks the plan, then she values plan integrity over utility, and she should say sticking to the wine resolution is rational. If she says eating the cake is rational, then she values utility over plan integrity, and she should say trading the cheese is rational. But based on the coffee talk so far, I think she'll take the wine.

  Hope the bus ride isn't too bumpy for reading this, let me know what she says on Thursday.

  Best,
