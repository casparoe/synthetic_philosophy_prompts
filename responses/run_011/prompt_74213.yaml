answer: |-
  ## Activity Design: The Polis Exchange

  **Title:** The Incommensurable Market
  **Time:** 75 Minutes
  **Participants:** 20 Students
  **Materials:** Paper, pens, scissors, a timer, a whiteboard (or projected slide).

  ### I. Materials List (Stationery Cupboard)
  1.  **Role Cards (20 total):** 5 distinct types, 4 copies of each. (See *Handout 1*).
  2.  **Good Tokens (100 total):** Cut paper squares. 25 "Houses", 25 "Shoes", 25 "Grain", 25 "Cloaks".
  3.  **Currency Tokens (50 total):** Cut paper circles. Label them "Drachmas".
  4.  **Ledger Sheets (5 total):** One per Role Group to track holdings.
  5.  **Whiteboard Markers:** To track global prices during Round 2.

  ### II. Setup & Roles
  Divide the class into four **Guilds** of 5 students each. Seat them in clusters.
  *   **Guild A: Builders** (Surplus: Houses. Need: Shoes)
  *   **Guild B: Shoemakers** (Surplus: Shoes. Need: Grain)
  *   **Guild C: Farmers** (Surplus: Grain. Need: Cloaks)
  *   **Guild D: Weavers** (Surplus: Cloaks. Need: Houses)

  *Note the circular dependency:* A needs B, B needs C, C needs D, D needs A. This prevents simple bilateral barter and forces a market or chain of exchange.

  **Distribution:**
  *   Give each student 1 Unit of their Guild's Surplus Good.
  *   Give each student 1 "Need Card" (secret). It states: *"To survive the week, you must acquire 1 Unit of [Need Good]."*
  *   **Crucial Asymmetry:** On the back of the Role Card, print a **Social Worth** value (visible only to the holder).
      *   Builders: Worth 5
      *   Shoemakers: Worth 2
      *   Farmers: Worth 3
      *   Weavers: Worth 4
      *   *Instruction:* "Your Social Worth determines your bargaining power, but do not show this number to anyone."

  ### III. The Rules (Read Aloud - 3 Minutes)
  1.  **Objective:** Your goal is to **Survive**. To survive, you must hold 1 Unit of your Need Good at the end of the round.
  2.  **Trading:** You may trade with anyone. You may form coalitions.
  3.  **No Theft:** Trades must be voluntary.
  4.  **Silence:** In Round 1, no speaking. Pass written notes only. In Rounds 2 & 3, talking is allowed.

  ### IV. Minute-by-Minute Timeline

  **00:00 – 00:05: Setup & Distribution**
  *   Seat students in Guilds. Distribute Role Cards, Good Tokens, and Need Cards.
  *   Explain the "Survival" objective.

  **00:05 – 00:20: Round 1 – The Barter Stall (Incommensurability)**
  *   **Mechanic:** Direct exchange of Goods only. No Money.
  *   **Constraint:** Silent trading (written notes).
  *   **Goal:** Survive (get your Need Good).
  *   **Expected Outcome:** Chaos. Builders will demand 1 House for 1 Shoe. Shoemakers will refuse (they need 5 shoes to equal a house intuitively, but have no metric). Many will fail to trade because they cannot agree on the *ratio*.
  *   **Stop:** At 15 mins. Count survivors. (Likely low).

  **00:20 – 00:40: Round 2 – The Convention (Money as Proxy)**
  *   **Reset:** Return Goods to starting positions.
  *   **Mechanic:** Introduce 50 Drachmas. Distribute 2 Drachmas to every student.
  *   **Rule Change:** Goods can be bought/sold for Drachmas.
  *   **The Fix:** Ask the class: *"We need a price. How many Drachmas is a House? How many is a Shoe?"*
  *   **Action:** Let them debate for 2 minutes. Then, as the "Lawgiver," **fix the prices** arbitrarily to allow trade to flow (e.g., House = 10, Shoe = 2). Write this on the board.
  *   **Goal:** Survive.
  *   **Expected Outcome:** Trade flows easily. The "ratio problem" vanishes because the Law fixed it. Students realize the money didn't *measure* value, it *coordinated* it.
  *   **Stop:** At 20 mins. Count survivors. (Likely high).

  **00:40 – 00:55: Round 3 – Chrematistics (Money Begets Money)**
  *   **Reset:** Keep Goods/Money from Round 2 (or reset if too messy, but keep Money distribution uneven if possible).
  *   **Rule Change:** **New Victory Condition.** "Survival no longer matters. The winner is the student with the most Drachmas at the end."
  *   **Mechanic:** Introduce **Lending**. Students can lend Drachmas to others.
  *   **Interest:** Lenders may charge 50% interest.
  *   **Constraint:** Borrowers must repay after 5 minutes. If they cannot, they are "Bankrupt" (out of game) and forfeit all assets to the lender.
  *   **Goal:** Maximize Drachmas.
  *   **Expected Outcome:** Students with surplus money will lend to those who need money to buy goods, not to eat, but to flip goods for profit. Some will ignore goods entirely and just trade debt.
  *   **Stop:** At 15 mins. Count wealth.

  **00:55 – 01:15: The Debrief (Mapping Play to Text)**
  *   See *Debrief Guide* below.

  ### V. Handout Text (Role Card Example)

  > **GUILD: BUILDER**
  > **SURPLUS:** 1 House Token
  > **NEED:** 1 Shoe Token (Required to Survive Rounds 1 & 2)
  > **SOCIAL WORTH:** 5 (Keep Secret)
  >
  > **INSTRUCTIONS:**
  > *   Round 1: Trade Goods only. No talking.
  > *   Round 2: Trade using Drachmas.
  > *   Round 3: Maximize Drachmas. Goods are irrelevant. Lending allowed.

  ### VI. Debrief Guide (Mapping Mechanics to Aristotle)

  Do not lecture. Ask questions that force them to articulate the four insights.

  **1. The Crosswise Ratio (Round 1 Failure)**
  *   *Ask:* "In Round 1, why did trade stall? Did anyone feel a 1-House-for-1-Shoe trade was 'wrong' even if it let you survive?"
  *   *Map to Text:* *NE* V.5. Aristotle says exchange requires proportion, not equality. The Builder and Shoemaker are not equal in standing.
  *   *Point:* The friction you felt was the lack of a **crosswise ratio** (Builder : Shoemaker :: Shoes : Houses). You were trying to trade equal things, but the goods (and roles) are different in kind.

  **2. Incommensurability & Persuasion (Round 1 Chaos)**
  *   *Ask:* "Without a price, how did you decide value? Did the loudest person win?"
  *   *Map to Text:* *NE* V.5 (1133a). Without a common measure, goods are incommensurable. Bargaining collapses into power or rhetoric.
  *   *Point:* You experienced **incommensurability**. There is no natural math to compare a house to a shoe.

  **3. Convention vs. Need (Round 2 Success)**
  *   *Ask:* "In Round 2, I set the prices (House=10, Shoe=2). Did that reflect the 'true' value of the materials? Or did it just allow trade to happen?"
  *   *Map to Text:* *NE* V.5 (1133b). Money is a convention (*nomisma*). It makes things commensurable not by nature, but by law. It is a proxy for **need** (*chreia*).
  *   *Point:* The Drachma didn't measure the wood or leather; it measured our **agreement** to trade. It solved the coordination problem, but it is a fiction.

  **4. Optimization of the Proxy (Round 3 Shift)**
  *   *Ask:* "In Round 3, did anyone stop caring about Houses and Shoes entirely? Did money become the goal?"
  *   *Map to Text:* *Politics* I.10. *Oikonomia* (household management) seeks goods for life. *Chrematistics* (money-getting) seeks money for its own sake.
  *   *Point:* Once the proxy (money) existed, you optimized the proxy. This is the unnatural art of wealth-getting. Money begetting money (interest) severs the link to need entirely.

  ### VII. Troubleshooting: Predictable Failures & Interventions

  **1. The Dominant Hagglers**
  *   *Problem:* 2-3 students dominate Round 1 negotiations, setting prices for everyone else.
  *   *Risk:* Hides the "coordination problem" insight.
  *   *Intervention:* Mid-round, announce a "Market Freeze." Collect all goods. Redistribute them randomly. Say: "The market has shifted. Renegotiate." This resets power dynamics without lecturing.

  **2. The "Socialist" Solution**
  *   *Problem:* A Guild decides to share everything evenly to ensure everyone survives.
  *   *Risk:* Removes the scarcity/justice tension.
  *   *Intervention:* Introduce "Private Need." Whisper to one student in each Guild: *"Your Need has doubled. You need 2 Units to survive. Do not tell your guild."* This forces hidden agendas and breaks the communal equilibrium.

  **3. The Math Solver**
  *   *Problem:* A student immediately calculates the ratio based on the "Social Worth" numbers if they leak, or proposes a logical split.
  *   *Risk:* Deflates the puzzle of incommensurability.
  *   *Intervention:* Challenge the math. "Student X proposes 1 House = 5 Shoes. Shoemakers, do you agree? If no, trade stops." Force the *agreement* aspect. Aristotle's point is that the math doesn't exist until the agreement is made.

  ### VIII. Limitations & Normativity (The "Justice" Gap)

  **Your Suspicion is Correct:**
  You suspected the game makes justice look like coordination (prudence) rather than normativity (justice). **I agree.**
  *   *Why:* Games are inherently about winning (prudence). If a trade benefits both parties, the game marks it as "successful," even if Aristotle would deem it unjust (e.g., a Builder exploiting a Shoemaker's desperation).
  *   *The Gap:* The mechanics cannot simulate the *moral wrongness* of an unequal exchange if both parties consent.
  *   *The Fix:* You must supply this in the debrief. Ask: *"In Round 2, if a Builder forced a Shoemaker to accept 1 Shoe for 1 House because the Shoemaker was starving, was that a 'successful' trade?"* The game says yes (both survived). Aristotle says no (it violates reciprocal justice). You must verbally re-introduce the normative constraint that the game mechanics lack.

  ### IX. Interpretive Stance & Contested Readings

  **Design Stance: Need is the Real Measure (View A)**
  *   *Mechanic:* The "Survival" objective (Need Card) is the win condition in Rounds 1 & 2. Money is introduced *only* to facilitate getting the Need Good.
  *   *Implication:* This design assumes Aristotle believes **Need (*chreia*)** is the underlying reality that money measures. Money is a "stand-in" (as per your prompt's third insight).
  *   *Textual Basis:* *NE* 1133b1: "In truth, it is need that holds them together."

  **How to Stage the Opposite View (View B: Institution makes Commensurability)**
  *   *The Dispute:* Some scholars (e.g., Meikle, Finley) argue Aristotle means money *creates* commensurability; there is no pre-existing "need" metric.
  *   *Design Change:* Remove the "Need Cards." Make the objective in Round 1 & 2 simply "Accumulate the most value." Let the students vote on the exchange rate in Round 2 without reference to survival.
  *   *Effect:* This shows money as a purely political construct that *constitutes* value rather than reflecting it.
  *   *Why I didn't choose this:* Your prompt explicitly asked for the "stand-in for need" insight. View A is more pedagogically accessible for a first pass.

  **What Would Change My Mind (The "Interest" Mechanic)**
  *   *Weak Point:* Round 3 (Interest) is the most likely to fail. 15 minutes is too short for a lending market to emerge naturally among 20 students. It often devolves into chaos or simple hoarding.
  *   *Risk:* Students might view interest as just "another way to win" rather than "unnatural money-getting."
  *   *Consideration for Redesign:** If I ran this again, I might cut Round 3 entirely and spend the extra 15 minutes on a deeper Round 2 debrief. The transition from *Oikonomia* to *Chrematistics* is subtle. A rushed Round 3 might teach that "interest is just profitable," missing Aristotle's moral critique that it is *unnatural*.
  *   *Fix:* If Round 3 feels rushed, stop the game at 50 minutes. Use the final 25 minutes to *describe* the interest scenario hypothetically based on their Round 2 money holdings. "Imagine if I let you lend these Drachmas..." This sacrifices experiential learning for conceptual clarity, which may be safer for a 75-minute constraint.

  ### X. Final Checklist for the Facilitator
  1.  **Print:** 20 Role Cards, 100 Good Tokens, 50 Money Tokens.
  2.  **Scissors:** Cut tokens before class (saves 5 mins).
  3.  **Timer:** Strict timekeeping is essential.
  4.  **Voice:** In Round 1, be silent. In Round 2, be authoritative (The Law). In Round 3, be permissive (The Banker).
  5.  **Debrief:** Do not explain the insights until they have spoken. Let them struggle to name the problem first.
