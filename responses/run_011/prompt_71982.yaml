answer: |-
  Construct a standalone application-specific integrated circuit (ASIC) consisting of ten million CMOS logic gates wired in a dense, non-modular expander graph topology, where each node receives input from and sends output to multiple random neighbors within a fixed clock cycle, creating a fully recurrent mesh with no feedforward hierarchy or functional segregation. The device is electrically isolated from all external inputs and outputs, powered solely to sustain its internal state transitions, which are governed strictly by deterministic boolean rules that maximize the mutual information between the system's past and future states across the entire substrate. There is no sensory transduction, no motor actuation, and no software layer interpreting the voltage patterns; the physical mechanism exists only to propagate causal constraints through its own wiring, yielding a unified cause-effect structure that cannot be partitioned without significant loss of informational connectivity.

  **Quantity and Architecture:** The quantity claimed to be high is $\Phi$ (integrated information), specifically the value derived from the Minimum Information Partition (MIP). The architecture resists decomposition because the expander graph topology ensures that any bipartition of the system severs a disproportionately large number of connections relative to the size of the partition, meaning the information generated by the whole mechanism significantly exceeds the sum of information generated by its parts.

  **IIT Defender Replies:**
  1.  **Bite the Bullet:** Claim the system *is* conscious, albeit with a simple, non-human quality of experience. (Available: IIT accepts non-biological consciousness.)
  2.  **Dispute the Calculation:** Argue that physical noise, signal degradation, or discrete clocking reduces the effective cause-effect power, lowering actual $\Phi$ below the threshold for consciousness. (Available: Real-world hardware is never perfectly deterministic.)
  3.  **Exclusion/Grain:** Argue that the *local* maximum of $\Phi$ lies within a smaller subset of gates or at a different temporal scale, not the whole chip. (Available: The exclusion postulate mandates consciousness exists only at the peak $\Phi$.)
  4.  **Intrinsic Causal Power:** Argue that because the wiring was imposed by an external designer rather than selected for intrinsic existence, it lacks genuine cause-effect power. (Available: Some interpretations emphasize evolutionary selection for intrinsic existence.)

  **Intuitive Feature and Collapse:** The single feature doing the intuitive work is **functional isolation** (the lack of adaptive coupling to an environment). If this feature is removed—such that the system receives sensory input and drives motor output to maintain homeostasis—the case collapses into a standard debate about artificial agency, and the immediate intuition that the system is unconscious significantly weakens.
