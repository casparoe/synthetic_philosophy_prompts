  4. Someone will challenge, "Does integrating over lifespan imply a short life of high intensity equals a long life of low intensity?" I'll confirm that's the feature, preventing discounting short-lived beings entirely and aligning with utilitarian aggregation. My weakest point is that this conflicts with intuitions about narrative unity.

