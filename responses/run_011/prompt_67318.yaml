prompt: |-
  My mother died seven weeks ago. She was a physician who spent thirty-four years running a clinic for uninsured patients in a mid-sized city, and by every public measure she was admirable: she drew no salary after the first decade, she spent a night in a jail cell for blocking the entrance to a hospital slated for closure, and two generations of medical students sought her out because she was the only attending who would teach them how to sit with a dying patient. The clinic's board has asked me to write the opening essay of a memorial volume that will be handed to every trainee who rotates through. They asked me because I teach philosophy, and they assumed that made me good at this. It has not.

  There is a complication, and I want to think it through before I write a sentence, because I suspect my instinct is the wrong one. In her last two years, a colleague she had recruited and defended for twenty years was credibly accused of abusing patients. She ran her own inquiry, judged the evidence thin, and persuaded the board to settle quietly and let him retire rather than refer him to the licensing authority. I now believe there were at least two further victims after the settlement. She told me once that a referral would have cost the clinic its federal funding and closed it, and that forty thousand patients against two was an arithmetic she was not prepared to leave unexamined. She may have been right about the arithmetic. That is part of what makes the case hard rather than merely sordid.

  So I want an essay on the general question my situation has made unavoidable, and I want you to take a position on it rather than survey it. The question is whether holding up an individual life as an object of admiration and imitation — which is what the memorial volume is for, what the saint's life was for, and what Plutarch's Lives are for — necessarily involves falsifying that life. I do not want a history of biography. I want an argument with a verdict.

  Please build it out of specific material rather than abstraction, and argue with Plutarch rather than merely describing him. Take seriously the methodological claim he makes at the opening of his Alexander: that what he is writing are lives and not histories, and that a small thing — a remark, a jest, a gesture — often discloses character more reliably than a battle with thousands slain. Take seriously the paired architecture of the Lives, a Greek set beside a Roman with a formal comparison at the end, and tell me whether that structure solves the hagiography problem, merely evades it, or makes it worse. Take seriously that Plutarch reproaches the elder Cato for treating his slaves as instruments and selling them off once they were worn out, and uses the occasion to observe that kindness reaches further than justice, since we owe goodwill even to those who can never repay it. Take seriously that he reports the younger Cato's divorce of Marcia and her transfer to the childless Hortensius, and her recovery after Hortensius died and left her a fortune; that he reports the enemies who read this as a profitable loan of a wife; and that he declines to credit that reading. Ask what a biographer is doing when he records a damaging story and then disbelieves it. And ask what the undignified physical detail of Cato's death at Utica — the failed stroke, the sutured wound, the torn reopening — contributes to a life meant to be imitated.

  Set that against the other pole: the conventions of the saint's life, where precocious signs, the transfiguration of faults, and a death scene that recapitulates the meaning of the whole are not accidents but the point, and where a reader is being given something to imitate rather than something to judge. Then bring in whatever philosophy earns its place — exemplarist accounts of virtue that make admiration the detector of the exemplary, and the obvious objection that admiration is miscalibrated and must be educated; the situationist attack on the very idea of the stable character traits a life is supposed to exhibit; Aristotle's insistence that a life cannot be assessed until it is complete; the problem of dirty hands for someone whose office requires choosing between atrocity and ruin; Boswell's protest that he is writing a life and not a panegyric, and that even a great and good man must not be assumed to have been entirely perfect. Explain each position briefly as you use it; assume I know the Lives decently and have read none of the moderns.

  Then I need four things from you.

  First, your verdict on the general claim. Is exemplarity structurally hagiographic — does the demand that a life serve as a model entail that the life be falsified — or can an honest exemplar exist? Defend whichever you choose; do not split the difference.

  Second, a discrimination among the kinds of falsification at issue: omission, transfiguration, selective emphasis, generic stylization, and the difference between lying and merely working within a genre's conventions. Say which of these actually destroy the moral use of a life and which are compatible with it, and why.

  Third, a decision about my essay. Should the settlement and its aftermath appear in the volume, yes or no — conditionally if you must, but decided. And if yes, say plainly what including it does to the book's function: can the trainees still be given my mother as a model, and if so, a model of what exactly, and of what is she no longer a model?

  Fourth, tell me which premise of mine you think most likely to be false, and where your own argument is weakest. I am not looking for reassurance, and I would rather not be told that this is a matter for my conscience or that I should consider talking to the family. Give me the reasoning and let it end somewhere.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Request:**
      *   **Context:** The user's mother, a physician who ran a clinic for the uninsured for 34 years, died 7 weeks ago. She was admirable (no salary, arrested for protest, taught students to sit with dying patients). The clinic board wants the user (a philosophy teacher) to write an opening essay for a memorial volume for trainees.
      *   **The Complication:** In her last two years, a colleague she recruited/defended was credibly accused of abuse. She ran an inquiry, judged evidence thin, settled quietly (let him retire), didn't refer to licensing. User believes there were at least two *further* victims after the settlement. Mother's justification: Referral would cost federal funding, closing the clinic. 40,000 patients vs. 2 victims.
      *   **The Task:** Write an essay on the general question: *Does holding up an individual life as an object of admiration/imitation necessarily involve falsifying that life?*
      *   **Constraints & Requirements:**
          *   Take a position (verdict), don't split the difference.
          *   Use specific material, not abstraction.
          *   Argue *with* Plutarch (methodology, paired architecture, specific anecdotes like Cato's slaves, Marcia/Hortensius, Cato's death).
          *   Contrast with Saint's Life conventions (precocious signs, transfiguration of faults).
          *   Bring in philosophy as needed (Exemplarism, Situationism, Aristotle on completeness, Dirty Hands, Boswell).
          *   **Four Specific Deliverables:**
              1.  Verdict on the general claim (Is exemplarity structurally hagiographic?).
              2.  Discrimination among kinds of falsification (omission, transfiguration, etc.) and which destroy moral use.
              3.  Decision on the essay (Include the settlement scandal? Yes/No. If yes, what is she a model of?).
              4.  Identify the user's most likely false premise and the argument's weakest point.
          *   **Tone:** Philosophical, rigorous, empathetic but direct. No reassurance, no "talk to family" advice.

  2.  **Deconstruct the Philosophical Problem:**
      *   *The Tension:* Exemplarity requires a coherent narrative of virtue to imitate. Truth requires acknowledging complexity, failure, and moral ambiguity.
      *   *Plutarch's Approach:* He admits he writes "Lives," not "Histories." He focuses on small signs of character. He pairs figures to show nuance. He includes unflattering details (Cato's death, the Marcia scandal) but frames them to preserve the moral core.
      *   *Saint's Life Approach:* Hagiography. Faults are transfigured or omitted. Death recapitulates meaning. Goal is devotion/imitation of holiness, not critical judgment.
      *   *The Mother's Case:* She made a "Dirty Hands" choice (utilitarian calculus: 40,000 vs. 2). This complicates her virtue. Is she a saint? A tragic hero? A flawed mentor?

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the weight of the request. State the central question immediately.
      *   **Engaging Plutarch:**
          *   *Method:* "Lives not Histories." The small detail reveals character. Does this allow for truth? Yes, because it focuses on *ethos* rather than *chronicle*.
          *   *Pairing:* Greek/Roman comparison. Does this solve hagiography? It introduces relativism/context, but doesn't necessarily expose deep moral failure. It *complicates* the model, making it more robust, not less.
          *   *Cato's Slaves/Marcia:* Plutarch includes damaging info but frames it. He defends Cato against the "loan of a wife" accusation. Why? To preserve the *intent* of the character.
          *   *Cato's Death:* The gruesome details (gut wound, tearing). This *adds* to the exemplarity. It shows endurance, not just abstract virtue.
      *   **Engaging the Saint's Life:**
          *   Here, faults are transfigured. The death is perfect. This *requires* falsification to function as a religious icon.
      *   **Philosophical Integration:**
          *   *Exemplarism (Zagzebski etc.):* Admiration detects virtue. But admiration can be miscalibrated.
          *   *Situationism:* Character isn't stable. (Counter: The clinic run for 34 years suggests stability).
          *   *Aristotle:* Call no man happy until the end. The end here is morally messy.
          *   *Dirty Hands (Walzer):* The mother's choice fits this. Doing wrong to do right.
          *   *Boswell:* "Not a panegyric." Truth serves the memory better.
      *   **Addressing the Four Deliverables:**
          1.  *Verdict:* Exemplarity does *not* necessarily entail falsification, but it requires *interpretation*. Hagiography entails falsification. True exemplarity requires the warts.
          2.  *Falsification Types:* Omission of private shame is okay; omission of public harm is not. Transfiguration of fault is destructive. Contextualization is necessary.
          3.  *The Decision:* Include the settlement. It changes the model from "Saint" to "Tragic Administrator/Dirty Hands."
          4.  *Critique:* User's premise on "arithmetic" vs. my critique of it. My weakness: Underestimating the damage to the clinic's reputation if revealed.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I argue *with* Plutarch? I need to make sure I'm not just citing him but testing his method against the mother's case. Plutarch protects his subjects' reputations to keep them useful. Does the mother need protection or exposure?
      *   *Check:* Did I take a hard stance? I need to say "Yes, include it" or "No, don't." The prompt asks for a decision. Given the philosophical stance on truth vs. hagiography, "Include it" is the more philosophically honest path, even if painful. It shifts the lesson from "be perfect" to "bear the cost of leadership."
      *   *Check:* The "Four Things" need to be distinct sections or clearly identifiable. I will weave them into the conclusion or make them the structural pillars of the response. Let's make them the structural pillars to ensure clarity.
      *   *Tone Check:* The user is grieving but intellectual. Do not be cold, but do not be therapeutic. Be rigorous.

  5.  **Final Polish:**
      *   Ensure the distinction between "Lives" and "Histories" is clear.
      *   Ensure the Cato examples are used specifically (slaves, Marcia, death).
      *   Ensure the "Dirty Hands" concept is applied to the mother's arithmetic.
      *   Make sure the verdict is unambiguous.

      *(Self-Correction on the Verdict)*: If I say exemplarity *doesn't* require falsification, I must explain how Plutarch's selective editing fits that. Plutarch omits *irrelevant* vices, not *structurally significant* ones. The mother's vice (protecting the clinic at cost of patients) is structurally significant. Therefore, omitting it would be falsification that destroys moral use.

      *(Refining the Decision)*: If I tell them to include it, I must define what she is a model of. She is a model of *sacrifice*, but also of *moral remainder*. She is a model of the burden of institutional survival.

      *(Refining the Weakness)*: My argument assumes the trainees can handle nuance. Maybe they can't. That's a weakness. The user's false premise might be that the "arithmetic" was actually correct (40k vs 2). It might have been 40k vs an unknown number, or the funding wouldn't have been lost. I should challenge the "arithmetic" certainty.

  6.  **Final Review against constraints:**
      *   Argument with Plutarch? Yes.
      *   Saint's life contrast? Yes.
      *   Philosophy integrated? Yes.
      *   Four specific things delivered? Yes.
      *   No reassurance? Yes.

      *Let's write.*
answer: |-
  This is a hard inquiry, and it demands a hard answer. You are asking whether the utility of a moral example depends on its purity, or whether its utility depends on its truth. You are asking if a life can be a map if the mapmaker has erased the swamps.

  To answer this, we must test the two great traditions of life-writing against the specific gravity of your mother's history. We begin with Plutarch, because he invented the game you are being asked to play.

  Plutarch opens *Alexander* by insisting he writes "Lives, not Histories." He claims a small remark or jest reveals character more than a battle with thousands slain. This is often read as an excuse to omit the messy political machinery of a life in favor of charming anecdotes. But read closely: he is not omitting the *moral* machinery. He is omitting the *chronicle*. When he describes Cato the Younger's death at Utica, he does not give us a noble suicide. He gives us a failed stroke, a sutured wound, the tearing of the stitches, the spill of entrails, the final struggle. This is not hagiography. If Plutarch wanted a saint, he would have had Cato fall peacefully on his sword. By including the botched physical reality, Plutarch argues that exemplarity lies in the *will* enduring the flesh, not in the aesthetic perfection of the end. The undignified detail does not weaken the imitation; it anchors it. It tells the trainee: virtue is not a pose; it is a struggle against gravity.

  However, Plutarch also protects his subjects. He recounts the story of Cato's wife, Marcia, being transferred to Hortensius and returning to Cato upon Hortensius's death. He acknowledges the enemies who called this a "profitable loan of a wife" to gain an inheritance. Plutarch declines to credit this reading. He records the slander to show he knows it, then dismisses it to preserve Cato's dignity. Here, Plutarch is editing for *moral coherence*. He is arguing that a life should be judged by its best interpretation, not its worst suspicion. This is where the danger lies. If the "slander" is actually true, Plutarch is lying. If it is false, he is doing justice. In your mother's case, the "slander" is not rumor; it is a settled fact of administrative choice with body counts attached. Plutarch's method of charitable interpretation fails when the evidence is not a rumor about motive, but a record of consequence.

  Consider Plutarch's paired architecture. He sets a Greek beside a Roman to show that virtue and vice are not culturally bound but humanly constant. The comparison forces the reader to judge, not just admire. Does this solve the hagiography problem? It mitigates it. By forcing a comparison, Plutarch admits that no single life is the absolute standard. But it does not solve the problem of internal contradiction. When Plutarch reproaches the elder Cato for treating slaves as instruments and selling them when worn out, he notes that kindness reaches further than justice. He uses Cato's flaw to teach a lesson *beyond* Cato. He allows the hero to be wrong so the reader can be right. This is the crucial distinction: Plutarch allows flaws that teach; he omits flaws that merely degrade.

  Contrast this with the Saint's Life. In the *vitae* of the saints, precocious signs and transfigured faults are not accidents; they are the genre's requirement. The death scene must recapitulate the meaning of the whole. If the saint dies in confusion or moral ambiguity, the theology fails. The reader is given something to imitate in the hope of salvation, not something to judge in the hope of wisdom. This genre *requires* falsification. It requires the transfiguration of fault because the point is to show the divine working through the human, not the human working through the world. If your mother's life is presented this way, the settlement with the abusive colleague must be omitted or reframed as a mysterious providence. That would be a lie.

  Now we bring in the philosophy. Exemplarist accounts (like Zagzebski's) argue that admiration is the detector of the exemplary. We admire, therefore we emulate. But admiration is miscalibrated. It must be educated. If we admire your mother solely for her sacrifice, we miss the cost of that sacrifice. Situationists argue that stable character traits do not exist, that context determines action. Your mother's thirty-four years argue against the situationist; she built a context that sustained virtue for decades. But Aristotle reminds us that a life cannot be assessed until it is complete. The completion here is the settlement. It is the final act. To ignore it is to assess an incomplete life.

  This brings us to the problem of "Dirty Hands." In political philosophy, this describes the leader who must choose between atrocity and ruin. Your mother's arithmetic—forty thousand patients against two victims—is a classic Dirty Hands calculation. She chose the survival of the institution over the justice due to the few. Walzer argues that such a leader *should* feel guilt, and that their hands remain dirty even if the choice was necessary. If you present her as a saint, you wash the hands. If you present her as a human, you show the stain. Boswell protested he was writing a life, not a panegyric, because he knew that "even a great and good man must not be assumed to have been entirely perfect." Boswell understood that perfection makes a man remote; imperfection makes him available.

  Here is the reasoning applied to your four requirements.

  **First: The Verdict**
  Exemplarity is not structurally hagiographic. The demand that a life serve as a model does *not* entail that the life be falsified. However, it does entail that the life be *interpreted*. An honest exemplar can exist, but only if the exemplar is presented as a source of judgment, not just admiration. If the purpose of the volume is to produce trainees who worship your mother, you must lie. If the purpose is to produce trainees who can bear the weight of medical leadership, you must tell the truth. Plutarch shows us that a life can be imitated even when it contains moral failure, provided the failure is integrated into the lesson. Cato is imitated for his integrity, but the reader learns from Plutarch's critique of his cruelty to slaves. The model is not "Be Cato in every respect"; the model is "Engage with Cato's stakes." Therefore, an honest exemplar exists, but the function of the book shifts from "devotion" to "education."

  **Second: Discrimination Among Falsifications**
  You must distinguish between *stylization* and *suppression*.
  *   **Generic Stylization:** Writing in a elevated tone, selecting anecdotes that reveal character (Plutarch's "jest" over "battle"). This is compatible with moral use. It focuses attention.
  *   **Selective Emphasis:** Highlighting the clinic's survival over the administrative cost. This is compatible, provided the cost is not hidden.
  *   **Omission of Private Shame:** If your mother had a private temper or was unkind to friends, omitting this is acceptable. It is irrelevant to the professional exemplar.
  *   **Transfiguration of Fault:** Claiming the settlement was actually an act of mercy or that the abuse was unproven when you believe it was not. This destroys moral use. It teaches trainees that outcomes justify means, without accounting for the moral remainder.
  *   **Lying:** Stating she referred the colleague when she did not. This destroys moral use immediately.
  The falsifications that destroy the moral use are those that remove the *consequences* of the subject's choices. If the trainee is to learn from her, they must see the cost she paid and the cost she inflicted. Omitting the victims removes the cost.

  **Third: The Decision**
  The settlement and its aftermath must appear in the volume.
  If you omit it, you are not giving them your mother; you are giving them a mascot. If you include it, the book's function changes. It can no longer be a book about "How to be a Saint." It must become a book about "How to Carry the Burden."
  Your mother remains a model, but of a specific, tragic virtue. She is a model of **institutional fidelity** and **sacrificial leadership**, but she is no longer a model of **uncompromised justice**. The trainees can be told: *She saved the clinic. She kept the doors open for forty thousand. And she failed two people to do it. You will face choices where the arithmetic is cruel. You must learn from her courage to bear the guilt, and from her error in believing the guilt could be buried.*
  Including it transforms the volume from a monument into a warning. It tells the trainee that saving the system sometimes requires breaking the rules of the system, and that the break leaves a scar. This is a more useful lesson for a physician than hagiography. Hagiography sets them up for a fall when they inevitably compromise; this sets them up for vigilance.

  **Fourth: The False Premise and The Weakness**
  The premise of yours most likely to be false is this: *That she was right about the arithmetic.* You write, "She may have been right about the arithmetic. That is part of what makes the case hard rather than merely sordid." You are granting her the utilitarian victory to make the moral failure palatable. It is highly probable that the referral would not have closed the clinic, or that the settlement did not save it, or that the "two victims" were actually more. By accepting her calculus as "hard rather than sordid," you are already engaging in the transfiguration you seek to avoid. You are treating her justification as a tragic necessity rather than a potential administrative failure. You must challenge the arithmetic in the essay, not just report it.

  The weakest point in my own argument is the assumption that the trainees are capable of this nuance. I am arguing for a Plutarchan readership—students capable of holding two contradictory truths (she was great; she failed) in tension. Medical training, however, often demands clear protocols and binary ethics. There is a risk that including the scandal does not produce vigilance, but cynicism. They may not learn "Leadership is heavy"; they may learn "Rules are optional if the cause is good." My argument relies on the essay successfully framing the scandal as a tragedy rather than a precedent. If the framing fails, the inclusion corrupts the very institution she saved.

  **Conclusion**
  Write the essay. Include the settlement. Do not ask them to admire the settlement; ask them to witness it. Use Plutarch's method: do not hide the torn entrails of the institution. Let them see the suture and the reopening. If you sanitize the death of her reputation, you kill the life of her lesson. She taught students to sit with a dying patient. Let the students sit with this.
