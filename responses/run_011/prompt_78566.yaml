  This bears directly on your column about AI alignment and is not a category error, provided you distinguish between simulating moral language and holding moral attitudes. If expressivism is correct, an AI cannot have moral views unless it has conative states like desire or aversion, which current language models lack. If realism is correct, an AI might theoretically discover moral truths, but only if those truths are accessible to computation. Confusing the linguistic output of a model with moral agency risks obscuring whether you are aligning the system to human preferences or to objective values, which is the central tension in your field.
