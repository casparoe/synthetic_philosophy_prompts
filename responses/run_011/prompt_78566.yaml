  Your intuition that this could be settled empirically is a common reaction for scientists, but it misunderstands the nature of the philosophical problem. The Frege-Geach argument is not a prediction about how speakers happen to use language, but a logical constraint on what meaning must be for arguments to remain valid. You cannot resolve a question about logical validity with a corpus study, because the issue is whether the inference holds necessarily, not whether people frequently make the inference in practice. Even if four hundred subjects agree that the conditional makes sense, the philosopher asks what makes it valid, and frequency data cannot answer a normative question about reasoning.

