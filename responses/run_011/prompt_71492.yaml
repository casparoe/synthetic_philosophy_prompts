  **Setting**
  The County Hospital Ethics Committee must allocate one specialized rehabilitation slot. Claimant A has lived five years with a stable spinal impairment and reports high life satisfaction; Claimant B suffered an equivalent injury three months ago and reports severe distress. Both face three outcomes: Successful Rehab (R), Status Quo (S), or Medical Complication (D). Both strictly prefer R to S to D. The committee possesses only standard clinical assessments and elicited indifference probabilities over medical gambles. No neural scans or welfare meters are available; interpersonal comparisons rely solely on these elicited risk profiles and self-reports. The slot is indivisible; giving it to one denies it to the other.

  **Numbers**
  **Outcomes:** R (Best), S (Baseline), D (Worst).
  **Preference Order:** R > S > D for both claimants.
  **Risk Data (Probability $p$ where $S \sim pR + (1-p)D$):**
  *   Claimant A (Adapted): $p_A = 0.60$
  *   Claimant B (Acute): $p_B = 0.40$
  **Self-Reported Intensity (Range $R - D$):**
  *   Claimant A: 1.8 utils
  *   Claimant B: 1.0 utils
  *(Ratio of ranges: 1.8/1.0 = 1.8, which is within the [0.5, 2.0] constraint.)*

  **Demonstration**

  1.  **Compliance Verification**
      *   *Paragraph/Setting:* One paragraph, 135 words; realistic hospital committee setting.
      *   *No-Device Rule:* Uses only gambles and self-reports; no hedonometers or scans.
      *   *Ordinal Ranking:* Both rank R > S > D identically; conflict is purely cardinal.
      *   *Range Ratio:* 1.8 falls strictly between 1/2 and 2; no extreme swings.
      *   *Calibration Conflict:* Calibration (i) favors B; Calibration (ii) favors A.

  2.  **Utilitarian Arithmetic**
      *   **Calibration (i): Unit Fixed, Level Free.**
          *   *Method:* Set utility range ($R-D$) to 10 for both (fixing unit). Set baseline $S=0$ for each (level free at own baseline).
          *   *Claimant A:* $u_A(S)=0$. Gain to R is $10 \times (1-0.6) = 4$. So $u_A(R)=4$.
          *   *Claimant B:* $u_B(S)=0$. Gain to R is $10 \times (1-0.4) = 6$. So $u_B(R)=6$.
          *   *Allocation A:* $u_A(R) + u_B(S) = 4 + 0 = \mathbf{4}$.
          *   *Allocation B:* $u_A(S) + u_B(R) = 0 + 6 = \mathbf{6}$.
          *   *Verdict:* **Allocate to B.**
      *   **Calibration (ii): Level Fixed, Unit Free.**
          *   *Method:* Set worst outcome $D=0$ for both (fixing level). Use self-reported ranges 1.8 and 1.0 (unit free).
          *   *Claimant A:* $u_A(D)=0, u_A(R)=1.8$. $u_A(S) = 1.8 \times 0.6 = 1.08$.
          *   *Claimant B:* $u_B(D)=0, u_B(R)=1.0$. $u_B(S) = 1.0 \times 0.4 = 0.40$.
          *   *Allocation A:* $u_A(R) + u_B(S) = 1.8 + 0.4 = \mathbf{2.2}$.
          *   *Allocation B:* $u_A(S) + u_B(R) = 1.08 + 1.0 = \mathbf{2.08}$.
          *   *Verdict:* **Allocate to A.**

  3.  **Parameter Analysis**
      The disagreement is driven jointly by the unit and level choices, though the unit difference is the engine. In Calibration (i), normalizing the units erases Claimant A's self-reported higher intensity, allowing B's steeper risk gradient (larger gain from S to R) to dominate. In Calibration (ii), accepting A's larger unit (1.8 vs 1.0) makes A's gain from S to R (0.72) larger than B's (0.6), and A's high baseline level (1.08) outweighs B's (0.40). The adapted claimant's adaptation is essential: it creates the divergence in risk attitudes ($p_A$ vs $p_B$) that makes the gain sizes sensitive to the unit calibration.

  4.  **Settling Evidence and Procedure**
      To settle the calibration, the committee would need evidence that validates self-reported intensity as interpersonally comparable (supporting ii) or evidence that welfare capacity is identical across persons (supporting i). Neither is obtainable; self-reports are cheap talk, and equal capacity is an ethical assumption, not an empirical fact. Since nothing settles it, the committee should retreat to a non-utilitarian rule, such as a lottery. Aggregating unverifiable cardinal numbers privileges one metaphysical assumption about welfare over another without justification.

  5.  **Stress Test**
      *   *Remove Adaptation:* If both are acute ($p_A=p_B=0.4$) but ranges differ (1.8 vs 1.0), Calibration (i) yields a tie (gains equal), while Calibration (ii) favors A (larger range). The flip survives but becomes a tie-vs-win conflict.
      *   *Impose Both:* If we fix both common unit (Range=10) and common level ($D=0$), the functions become identical up to the risk parameter. With identical risk parameters, it is a tie. With different risk parameters, the verdict is unique. The case collapses into a standard risk-attitude comparison, removing the structural ambiguity.

  6.  **Strongest Attack**
      An opponent might argue that Calibration (ii) is dishonest because self-reported intensity is not a valid metric for interpersonal comparison; only choice data (gambles) are revealed preference. On this view, Calibration (i) is the only honest approach, as it normalizes based on observable risk structure. This argument succeeds in showing that Calibration (ii) begs the question by treating subjective reports as objective magnitudes. However, Calibration (i) equally begs the question by assuming equal welfare capacity. The case therefore demonstrates not that one side is right, but that utilitarianism requires an arbitrary choice between two undefendable calibrations.
