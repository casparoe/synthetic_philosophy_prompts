  **Design Notes**
  To satisfy your constraints, I assign the "Pivot" to the Row player (Parks Department). The Pivot strategy (*Moderate*) yields consistent but mediocre payoffs. It is strictly dominated by a lottery between *Conservative* (high payoff if Col plays X, low if Y) and *Aggressive* (low if X, high if Y). The mathematics requires the mixing weights $p$ to lie in the interval $(0.25, 0.625)$; I will use $p=0.5$ for clarity. The "bitter twist" relies on the Column player (Libraries) eliminating the specific column (*Y*) where the Pivot would have shone, forcing the Row player into a *Conservative* stance that yields a jointly inferior outcome. All inequalities are linear and verifiable with high-school algebra.

  ***

  **Scenario: The Grant Grab**
  Two municipal departments, **Parks** (Row) and **Libraries** (Column), simultaneously submit budget proposals for a single state grant. Each chooses a spending strategy: **Conservative (C)**, **Moderate (M)**, or **Aggressive (A)**. Payoffs represent annual surplus in thousands of dollars. There is no communication.

  **Payoff Matrix (Parks, Libraries)**
  | | **X (Safe)** | **Y (Partner)** | **Z (Risky)** |
  | :--- | :---: | :---: | :---: |
  | **C** | 2, 3 | 2, 2 | 2, 1 |
  | **M** | 0.5, 4 | **5, 5** | 0.5, 4 |
  | **A** | 0, 1 | 10, 0 | 0, 1 |

  **Stage-by-Stage Analysis**

  1.  **Initial Status:** Check for pure strict dominance.
      *   Parks: $C$ beats $M$ at X ($2>0.5$) but loses at Y ($2<5$). $A$ beats $M$ at Y ($10>5$) but loses at X ($0<0.5$). No pure strategy dominates another.
      *   Libraries: Similar crossings exist (e.g., $X$ beats $Y$ at $C$, loses at $M$).
      *   *Result:* Pure IESDS halts immediately.

  2.  **Mixed-Strategy Domination (The Pivot):**
      *   Consider Parks mixing $C$ and $A$ with probability $p$ on $C$. Expected payoff $E(p)$ against each Column strategy:
          *   vs X: $2p + 0(1-p) = 2p$. Domination requires $2p > 0.5 \Rightarrow p > 0.25$.
          *   vs Y: $2p + 10(1-p) = 10 - 8p$. Domination requires $10 - 8p > 5 \Rightarrow 5 > 8p \Rightarrow p < 0.625$.
          *   vs Z: $2p + 0(1-p) = 2p$. Domination requires $2p > 0.5 \Rightarrow p > 0.25$.
      *   *Verdict:* For any $p \in (0.25, 0.625)$, the mixture strictly dominates $M$. We select $p=0.5$.
      *   *Best Response Check:* A strictly dominated strategy can never be a best response to any belief (pure or mixed) about the opponent. Since $M$ is strictly dominated, it is irrational.
      *   *Action:* **Delete M.**

  3.  **The Cascade:**
      *   **Reduced Game (C, A) vs (X, Y, Z).**
      *   Libraries compares $Y$ vs $X$: At $C$ ($2<3$) and at $A$ ($0<1$). $X$ strictly dominates $Y$.
      *   *Action:* **Delete Y.** (Note: This removes the cell $(M, Y)$ where the joint payoff was highest).
      *   **Reduced Game (C, A) vs (X, Z).**
      *   Parks compares $C$ vs $A$: At $X$ ($2>0$) and at $Z$ ($2>0$). $C$ strictly dominates $A$.
      *   *Action:* **Delete A.**
      *   **Reduced Game (C) vs (X, Z).**
      *   Libraries compares $X$ vs $Z$: At $C$ ($3>1$). $X$ strictly dominates $Z$.
      *   *Action:* **Delete Z.**
      *   **Unique Survivor:** Cell **(C, X)** with payoffs **(2, 3)**.

  4.  **The Bitter Twist:**
      *   The rational outcome is $(C, X)$ yielding total surplus 5.
      *   The deleted cell $(M, Y)$ yielded total surplus 10 $(5, 5)$.
      *   Rationality marched them away from the Pareto-optimal outcome.

  ***

  **Conceptual Discussion**

  **Geometry of Domination:** A strategy can be beaten by no pure alternative yet beaten by a lottery because the pure alternatives are "specialists" (high in different states) while the dominated strategy is a "generalist" (mediocre everywhere); the lottery averages the specialists' peaks to exceed the generalist's flat line.

  **Order and Equilibrium:** The order of elimination does not matter for *strict* dominance; the set of surviving strategies is unique. Deleting a strictly dominated strategy cannot destroy a Nash equilibrium because a rational player never plays a strictly dominated strategy in equilibrium. However, if domination were *weak* ( $\ge$ instead of $>$ ), order would matter, and equilibria could be lost, because a player might be indifferent between the dominated and dominating strategies in a specific equilibrium context.

  **The "One-Shot" Objection:** Students argue agents cannot "flip coins" over their own actions in a one-shot game. The mixture does not represent the agent literally randomizing; it represents a *benchmark for rationality*. If a fixed action $M$ yields less utility than the *expected* utility of a randomization device, then $M$ is simply inferior to the opportunity set defined by $C$ and $A$. The argument assumes the agent satisfies the **Independence Axiom** (linearity in probabilities). If an agent has non-linear preferences over her own actions (e.g., regret aversion), she might prefer the certainty of $M$ to the lottery, rescuing $M$ but violating Expected Utility Theory. This relocates the disagreement from game theory to decision theory foundations.

  **Rationalizability:** In two-player games, the strategies surviving IESDS are exactly the rationalizable strategies (those that are best responses to some belief about rational play). This equivalence rests on the assumption that players believe opponents are rational. In games with $>2$ players, this equivalence can fail if players cannot correlate their beliefs about different opponents' strategies, though IESDS remains valid for eliminating dominated options.

  **Engineering Note:** The indispensable feature is the **crossing payoff structure** for the dominating strategies ($C$ high/low, $A$ low/high) against the opponent's columns. If $C$ and $A$ were parallel, one would purely dominate the other, making the mixed step redundant. If the "Pivot" $M$ were not flat (mediocre), the mixture might not exceed it in all columns. A student defending $M$ would argue: *"Libraries might play Y with high probability, making M my best response."* Your reply: *"But Libraries is rational. Y is strictly dominated by X once they realize you won't play M. You must anticipate their elimination of Y, which makes A suicidal and forces you to C."* The logic holds only if rationality is common knowledge.
