answer: |-
  You have put your finger on a precise and persistent tension in moral and political philosophy, one that sits at the intersection of rhetoric, anthropology, and ethics. You are correct to feel that "Noble Savage" and "Primitivism" are insufficient. "Noble Savage" names an *icon* (the character), and "Primitivism" names a *tradition* (the aesthetic or philosophical lineage). Neither adequately captures the *argumentative syntax* you are describing: the instrumentalization of a specific cultural Other to destabilize the Self, where the accuracy of the portrait is secondary to its function as a mirror.

  There is no single, canonical term in the lexicon of rhetoric or philosophy that functions like "Ad Hominem" for this specific configuration. However, there are three established concepts in anthropology and postcolonial theory that carve up different faces of this structure. I will outline those, explain why they fall slightly short of your specific definition, and then offer a coinage that tightens the definition to your specifications.

  ### 1. The Established Concepts

  **A. The Savage Slot (Michel-Rolph Trouillot)**
  In *Global Transformations* and *Silencing the Past*, anthropologist Michel-Rolph Trouillot argues that the West created a "Savage Slot" in its taxonomy of humanity. This slot *must* be filled for the West to define itself as "Civilized." Crucially, Trouillot notes that the content of the slot can vary: the Savage can be a brutal cannibal (a warning) or a noble innocent (a critique).
  *   **Fit:** This captures your insight about the "load-bearing" nature of the portrait. The specific truth about the Tupinambá matters less than the structural necessity of having *someone* occupy the position of the "alternative."
  *   **Limit:** It is a historical/sociological concept about Western taxonomy, not a rhetorical label for the argumentative move itself. It explains *why* the author does it, not *what* the argument is called.

  **B. Allochronism (Johannes Fabian)**
  In *Time and the Other*, Fabian describes the "denial of coevalness." Western observers place the Other in a different time (the "primitive past") to make them available for study or admiration.
  *   **Fit:** This explains the "unforced and natural" quality you noted. By placing the Tupinambá outside of history, Montaigne makes them available as a static standard against which to measure dynamic, corrupted Europe.
  *   **Limit:** This describes the *temporal* mechanism, not the *normative* function. It explains how the idealization is made possible, not how it is used to argue for contingency.

  **C. Strategic Essentialism (Gayatri Spivak)**
  Spivak coined this to describe when a marginalized group *adopts* an essentialized identity for political leverage.
  *   **Fit:** This addresses your boundary case about the subjects adopting the flattering description.
  *   **Limit:** This applies to the *subjects'* agency, not the *author's* rhetorical structure.

  ### 2. The Coinage: Instrumental Alterity

  Since no existing term captures the *argumentative configuration* itself—the use of an idealized Other as a logical lever to dislodge the Self—I propose the term **Instrumental Alterity**.

  **Definition:**
  *Instrumental Alterity* is a rhetorical configuration in which an author constructs a portrait of a distant culture (the Alter) not primarily to describe that culture, but to serve as a functional counter-example (the Instrument) to critique the author's own society. The portrait is "load-bearing" in that the argument collapses without the existence of the alternative, but the portrait is "instrumental" in that its details are selected or shaped to fit the specific critique being leveled at home.

  **The Carving (Boundaries and Edges):**

  **1. The Truth Condition (Does the portrait need to be false?)**
  *   **No.** This is the crucial distinction between *Instrumental Alterity* and simple lying. The configuration survives even if the portrait is broadly accurate.
  *   **The Defect:** The defect is not necessarily factual; it is **functional**. Even if the Tupinambá *were* exactly as Montaigne described, the argument commits a category error by treating a complex, lived culture as a **normative standard** rather than a descriptive reality. The defect is the reduction of a *subject* (a people with their own internal logic) into an *object* (a mirror for the Self).
  *   **Edge Case:** If the author acknowledges the complexity and *still* uses them as a foil, it remains Instrumental Alterity, but the ethical weight shifts. If the author hides the complexity to make the fit tighter, it becomes **Deceptive Instrumental Alterity**.

  **2. The Adoption Condition (What if the subjects adopt the label?)**
  *   **The Configuration Holds:** If the Tupinambá later say, "Yes, we are the natural people Montaigne described," and use that for political leverage, the *structure* of Montaigne's argument remains *Instrumental Alterity*.
  *   **The Ethical Shift:** However, the *moral defect* is mitigated. This moves the dynamic toward Spivak's **Strategic Essentialism**. The configuration becomes collaborative rather than extractive.
  *   **Hard Edge:** If the subjects adopt the label *because* it grants them power in the author's system (e.g., land rights tied to "primitivity"), the *Instrumental Alterity* has successfully colonized the subject's self-conception. This is the most dangerous edge of the configuration: when the mirror becomes the mask.

  **3. The Fallacy Condition (Is it a fallacy if the conclusion is true?)**
  *   **Epistemic Status:** It is an **Unsound Argument with a Plausible Conclusion.**
      *   *Premise 1:* The Tupinambá handle death without vanity (Idealized Premise).
      *   *Premise 2:* We handle death with vanity.
      *   *Conclusion:* Our handling of death is contingent, not necessary.
  *   **The Flaw:** The conclusion (contingency) does not logically require Premise 1 to be *true*, only that an alternative is *possible*. By grounding the possibility in a specific, idealized empirical claim, the author makes the argument vulnerable to empirical refutation.
  *   **Rhetorical vs. Logical:** Logically, it is weak (one could imagine a hypothetical alternative without needing a real one). Rhetorically, it is potent because the *reality* of the alternative shuts down the objection that "human nature requires our customs."
  *   **Verdict:** It is not a formal fallacy (like *Affirming the Consequent*), but it is a **Material Fallacy**. It relies on evidence that is curated to the point of distortion. In philosophy, this is often tolerated as a **"Heuristic Fiction"** (like Rawls' Original Position), but in ethnography, it is ethically fraught because real people are bearing the weight of the fiction.

  ### 3. Why "Noble Savage" Fails Your Test

  You are right to reject "Noble Savage." That term, codified by Lovejoy and Boas in the 1920s/30s, refers to a **stock character** in literature and art. It describes the *attributes* of the figure (virtuous, simple, close to nature).

  *Instrumental Alterity* describes the **syntax of the argument**.
  *   You can have a Noble Savage who is *not* used instrumentally (e.g., a romantic poem admiring them for their own sake).
  *   You can have Instrumental Alterity *without* a Noble Savage (e.g., using a hyper-technological futuristic society to critique current laziness).
  *   Montaigne is the ur-example of *Instrumental Alterity* using the *Noble Savage* icon.

  ### 4. Summary of the Configuration

  If you are writing this up, I suggest framing it this way:

  The configuration is **Instrumental Alterity**. It is a mode of **Critical Primitivism** where the **Alterity** (otherness) of a group is mobilized as an **Instrument** of self-critique.

  *   **Intent:** Anti-ethnocentric (to show home customs are contingent).
  *   **Mechanism:** Ethnocentric (to impose a narrative of "nature" or "simplicity" on the Other).
  *   **Epistemic Cost:** High. It trades accurate understanding of the Other for rhetorical leverage against the Self.
  *   **Moral Cost:** Variable. It objectifies the Other, but may yield net moral progress for the Self (e.g., reducing cruelty in France).
  *   **Boundary:** It ceases to be *Instrumental Alterity* only when the portrait is abandoned in favor of abstract hypotheticals (becoming pure philosophy) or when the representation is fully co-authored by the subjects (becoming collaboration).

  This term allows you to discuss Montaigne alongside the modern magazine essayist without conflating them. Both are engaging in *Instrumental Alterity*; the modern writer is simply using "depression" where Montaigne used "cannibalism." The structure remains: *They are X, therefore we need not be Y.* The hollowness of X is the price paid for the force of the argument.
