      *   **The View (MBV):**
          1.  *Causal Transaction:* Symbols refer only if the system has transacted causally with the referents (or same kind) via non-symbolic channels (perception, manipulation, etc.).
          2.  *Symbolic Gap:* Purely symbolic input (text-only) cannot substitute for causal transaction due to a principled gap (dictionary circle problem). Co-occurrence fixes symbol-symbol relations, not symbol-world relations.
          3.  *Consequence:* Systems mediated *wholly* by other systems' symbols cannot understand the subject matter, regardless of performance. (Substrate neutral: applies to biology too).
      *   **Requirements:**
          *   Map candidate defeaters (what would make it false).
          *   Avoid generic objections; focus on specific philosophical challenges.
          *   Rank defeaters (Fatal, Awkward, Not Difficulties).
