          *   *MBV Response:* "Perception" must be broadened to instrumental detection (UV meters) or causal impact (wallet getting lighter). But Constantinople? That's testimonial.
          *   *Verdict:* Fatal if not handled carefully. If MBV says humans don't understand "inflation," it loses plausibility. Needs a distinction between *direct* and *indirect* causal hooks.

      *   *Structuralist Reply:* If you know how a word relates to *all other words*, isn't that enough? (Quine, Davidson). Isomorphism.
