          *   *Verdict:* Awkward. Touches on verificationism.

      *   *Multimodal:* Does adding images fix it?
          *   *MBV Response:* Only if the images are *perceived* as causal inputs, not just tokenized pixels. If the system "acts" on the world, it helps.
          *   *Verdict:* Empirical test case.

      *   *Archivist Cases:*
