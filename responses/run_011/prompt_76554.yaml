  7.  **Final Review against constraints:**
      *   Map exposure? Yes.
      *   Candidate defeaters? Yes.
      *   Rank (Fatal/Awkward/None)? Yes.
      *   Engage specific prompts (Community, Blind/History, Structuralist, Criteria, Multimodal)? Yes.
