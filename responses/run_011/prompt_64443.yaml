      *   *Wait, let's look at the Neptune/Vulcan distinction again.* Neptune was found where predicted. Vulcan wasn't. But both were postulated to save Newton. The difference often cited is that Neptune's calculation used *existing* laws without tweaking them, whereas Vulcan required tweaking or was just a desperate grab.
      *   *Better Fact:* **Was the assay's threshold for 'positive' set before looking at the crash data?**
      *   *No, the prompt says "tuned on those same 40 sites".*
      *   *Best Fact:* **Independent Mechanism/Validation.** If the assay picks up the pathogen in a controlled setting (independent of the field data), it moves from "statistical artifact" to "measurement tool."
      *   *Let's refine:* The core tension is between **Pre-registration (Procedural)** vs. **Independence of Evidence (Epistemic)**.
      *   D cares about Epistemic Independence (Neptune vs. Vulcan, Drift vs. Freud).
      *   Fact: **Does the assay detect the pathogen in a blinded spike-in experiment?** (i.e., Can we prove the assay detects the pathogen *at all*, separate from the correlation with the crash?)
      *   *Why this separates candidates:*
