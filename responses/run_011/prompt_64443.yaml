      *   *Self-Correction on String Theory:* D says String Theory is "not science *yet*." This implies a temporal/progressive element. The Ecology case is "not science" because it's *degenerative* (tuning to fit).
      *   *Refining the Rule:* D follows a **Lakatosian** view of **Research Programmes** with a **Popperian** emphasis on **Novel Facts**.
      *   *Rule:* "Science requires the prediction of *novel* facts using *independently validated* methods, not the accommodation of known anomalies via ad hoc adjustments."
