      *   *The Rule:* "A claim is scientific if it risks empirical refutation via *independent* evidence or *novel* prediction, not merely by logical possibility or data accommodation."
      *   *Where they come apart on Ecology:*
          *   Naive Falsifiability says: Science (Pre-registered prediction).
          *   Novelty/Independence says: Not Science (Assay tuned on the data = accommodation, not prediction).

  5.  **The "Single Extra Fact":**
      *   I need a fact that distinguishes between "This is just overfitting (Not Science)" and "This is a legitimate exploratory analysis leading to a risky test (Science)."
      *   *Current flaw:* Assay tuned on the 40 sites.
      *   *Fix:* Validation on *independent* data.
