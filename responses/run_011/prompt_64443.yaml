          *   **Neptune vs. Vulcan:** Both are "invisible planet" hypotheses to explain orbital anomalies. Neptune = Science, Vulcan = Not. Why? Neptune was found (corroborated). Vulcan wasn't. But D says Neptune was science *because* they said where to point the telescope. This implies *novel predictive success* matters, not just the logical possibility of falsification.
          *   **String Theory:** She hedges. "Not science *yet*." Why? It lacks empirical contact *currently*, but she's waiting to see if it produces "new structure that could in principle be checked." This suggests a *progressive* view of research programmes (Lakatos?) rather than strict instant falsifiability (Popper).
