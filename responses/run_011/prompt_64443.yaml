          *   This distinguishes between "Naive Falsifiability" (which accepts the pre-reg) and "Severe Testing" (which demands the tool works).

  6.  **Drafting the Response:**
      *   **Verdict:** Not Science (or "Pseudoscience").
      *   **Reasoning:** The "risk" is manufactured. The assay was overfitted. It's like Freud: the tool is flexible enough to find the pattern in the noise.
      *   **The Rule:** "Riskiness requires Independence." It's not enough to be falsifiable; the *means* of falsification must not be derived from the *data* being explained. (Connects Neptune/Vulcan and GR/Freud).
      *   **The Conflict:** Naive Falsifiability (Pre-reg) vs. Severe Testing (Independence).
