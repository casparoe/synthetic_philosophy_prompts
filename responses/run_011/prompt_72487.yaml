answer: |-
  Here is the commitment you asked for. I will not offer you a menu of options. You need a coding rule that yields inter-coder reliability, which means you need a principle that minimizes metaphysical ambiguity while maximizing alignment with the most defensible theory of moral worth.

  Your working principle failed because it allowed the *agent's conception* of the right to do too much work (saving the Sectarian) and allowed *counterfactual capacity* to substitute for *actual motivation* (saving the Gala Donor). To fix this, you must anchor moral worth in the **objective moral landscape**, not the agent's subjective map, while acknowledging that the agent must be *responding* to that landscape, not just coinciding with it.

  ### The Principle

  **The Objective Grounds Responsiveness Principle (OGRP):**
  > An action has moral worth if and only if:
  > 1.  **Rightness:** The action is objectively right.
  > 2.  **Grounds-Tracking:** The agent is motivated primarily by the non-moral properties that *actually* ground the action's rightness (e.g., suffering, need, promise-keeping), rather than by properties that do not ground rightness (e.g., reputation, guilt-avoidance, false normative categories).
  > 3.  **Robustness:** This motivation is modally robust; in nearby possible worlds where those grounding properties are absent or significantly diminished, the agent does not perform the action.

  This principle is a synthesis of Arpaly's reasons-responsiveness and a Kantian demand for non-accidental alignment, but it rejects the Kantian requirement that the agent must conceptualize the motive as "duty." It demands that the motive latch onto the *truth* of the moral situation.

  ### Defense Against Your Cases

  Here is how the OGRP adjudicates your current vignettes, clause by clause.

  1.  **The Nurse:**
      *   *Verdict:* **Worthy.**
      *   *Analysis:* She tracks **suffering/loneliness** (Clause 2: these are the actual grounds of the rightness). She stays because of them. If the patient were not dying/lonely, she would leave (Clause 3: Robust).
      *   *Function:* Motivates Clause 2 (Grounds-Tracking over Duty-Conceptualization).

  2.  **The Philanthropist:**
      *   *Verdict:* **Worthy (Derivative).**
      *   *Analysis:* She tracks "Morality Requires." This is a second-order property. If her concept of morality is accurate, she is indirectly tracking the Grounds. She is worthy, but less so than the Nurse because her motivation is one step removed from the actual suffering (the Ground).
      *   *Function:* Motivates the distinction between direct and indirect tracking in Clause 2.

  3.  **The Gala Donor:**
      *   *Verdict:* **Not Worthy.**
      *   *Analysis:* His *actual* motive is **Reputation** (Clause 2 failure: Reputation is not a moral ground). The fact that he *would* have given out of concern in a counterfactual scenario (the private lookup) is irrelevant to the *actual* motivation. You are coding the actual vignette, not the agent's hidden dispositions.
      *   *Function:* Motivates the strict focus on *Actual Motivation* in Clause 2, rejecting overdetermination.

  4.  **The Soldier:**
      *   *Verdict:* **Worthy.**
      *   *Analysis:* He tracks **Friends' Safety**. In most moral frameworks, special obligations to comrades are objective grounds for partiality (Clause 2). It is robust (Clause 3).
      *   *Function:* Confirms that "non-moral properties" in Clause 2 include relational facts, not just universal welfare.

  5.  **The Guilt-Avoider:**
      *   *Verdict:* **Not Worthy.**
      *   *Analysis:* He tracks **Own Psychological Comfort**. This is not a ground for the rightness of helping *others* (Clause 2 failure). Even if robust (Clause 3), it fails the Grounds test.
      *   *Function:* Distinguishes prudential robustness from moral robustness in Clause 2.

  6.  **Huck Finn:**
      *   *Verdict:* **Worthy.**
      *   *Analysis:* He tracks **Jim's Misery** (Clause 2: Actual Ground). His belief that it is a "sin" is false noise. Because he responds to the *real* reason (suffering) despite his *false* belief (sin), he passes.
      *   *Function:* Motivates the separation of *Motivating Feature* from *Normative Label* in Clause 2.

  7.  **The Sectarian:**
      *   *Verdict:* **Not Worthy.**
      *   *Analysis:* He tracks **Co-religionist Status**. This is not an objective ground for moral aid over others (Clause 2 failure). His desire to "do duty" is satisfied by a false code. He is lucky that the act is right, not responsive to the truth of why it is right.
      *   *Function:* Motivates the "Actually" in Clause 2. It kills the intuition that "trying to do duty" is sufficient if the duty is fake.

  ### Adjudication of New Cases

  You asked for verdicts on three unlisted cases. Here is what the OGRP delivers:

  1.  **The Flat Affect Agent (Cold Judgment):**
      *   *Verdict:* **Worthy.**
      *   *Reasoning:* The OGRP requires motivation by Grounds, not necessarily *desire*. If the agent judges "This is required because of X (Ground)" and that judgment motivates them, they satisfy Clause 2. Emotion is not a necessary condition for reasons-responsiveness.
  2.  **The Particular Lover (One Person Only):**
      *   *Verdict:* **Worthy (within scope).**
      *   *Reasoning:* If the act helps the loved one, the Ground is "Special Obligation to Loved One." This is an objective moral reason. The fact that they wouldn't help a stranger is irrelevant to the worth of *this* act, provided the act doesn't violate other grounds (e.g., stealing to help the lover). Moral worth is act-specific.
  3.  **The False Code Agent (Wrong Act, Right Reason):**
      *   *Verdict:* **Not Praiseworthy (but Blameless).**
      *   *Reasoning:* Clause 1 (Rightness) fails. Moral worth is a property of *right* actions. An agent who tortures someone because they sincerely believe it is their duty is not praiseworthy; they are exculpated. Your coding scheme must distinguish **Praiseworthiness** (positive value) from **Exculpation** (absence of negative value). Code this as 0, not negative, but not positive.

  ### The Counterfactual Run

  1.  **Sectarian (Code Accurate):**
      *   *Verdict:* **Worthy.**
      *   *Reasoning:* If the code is accurate, then "Co-religionist Status" *is* a valid Ground (perhaps due to special obligations). Clause 2 is now satisfied. The difference between the original Sectarian and this one is not psychological; it is metaphysical. Moral worth depends on truth.
  2.  **Huck (Compassion Fragile):**
      *   *Verdict:* **Not Worthy.**
      *   *Reasoning:* If Huck would have abandoned Jim the moment costs rose, Clause 3 (Robustness) fails. His alignment with the Moral Ground was accidental relative to his own stability. He got it right this time, but he is not responsive to the *weight* of the reason.

  ### The Cost

  You asked me to name the verdicts of yours that this principle cannot save. To adopt the OGRP, you must abandon two specific intuitions:

  1.  **The Gala Donor Intuition:** You currently feel he is "worthy at a discount" because he *would* have done it privately. The OGRP says he is **not worthy at all**.
      *   *Why you should give this up:* You are coding *actions*, not *characters*. If the actual cause of the action is reputation, the moral worth of the *action* is zero, regardless of the agent's hidden backup dispositions. To code otherwise is to conflate *moral worth* with *moral potential*. For inter-coder reliability, you must code what is in the text, not what the coder imagines the agent would do in a different vignette.
  2.  **The Philanthropist Ranking:** You feel the Philanthropist is worth *less* than the Nurse. The OGRP agrees, but for a specific reason: indirectness.
      *   *Why you should accept this:* If you find this unsatisfying, it is because you are clinging to Williams's "one thought too many" as a substantive claim rather than a stylistic one. The OGRP clarifies that the Nurse is *more* directly connected to the moral truth. If you want to code them as equal, you must weaken Clause 2 to allow "Belief about Grounds" to count as "Grounds." **Do not do this.** That is what trapped you with the Sectarian. It is better to downgrade the Philanthropist slightly than to upgrade the Sectarian.

  ### Conceptual Confusion

  Is your project confused? **Yes, but only if you conflate categories.**

  Your vignettes run together **Moral Worth**, **Moral Luck**, and **Exculpation**.
  *   **Moral Worth:** Requires Rightness + Grounds-Tracking (Huck, Nurse).
  *   **Moral Luck:** Rightness without Grounds-Tracking (Sectarian). This should be coded as **Neutral**.
  *   **Exculpation:** Wrongness with Good Motive (False Code Agent). This should be coded as **Neutral** (or a separate "Blamelessness" scale).

  **The Coding Rule:**
  To make this operational for your RA work, translate the OGRP into this instruction for your second coder:

  > "Code an action as Praiseworthy (1) only if the agent acts rightly AND their stated reason for acting cites a feature that is a genuine reason for help (e.g., 'he was hurt,' 'I promised'), rather than a feature that is not (e.g., 'I wanted praise,' 'he is one of us'). If the agent acts rightly but for a bad reason, or acts wrongly for a good reason, code as Neutral (0)."

  **Final Argument for Simplicity:**
  You asked if you should buy a more complicated principle to preserve the Gala Donor intuition. **Do not.** A principle that saves the Gala Donor requires a clause for "counterfactual dispositions independent of actual motivation." This destroys inter-coder reliability because Coders will disagree on what the agent *would* have done. The OGRP is codable because it relies on the text of the vignette (Actual Motive) and general moral knowledge (Is 'need' a reason?). It sacrifices the Gala Donor intuition to save the project's scientific validity. That is the correct trade-off for an experimental philosophy project.

  Adopt the OGRP. Code the Gala Donor as 0. Code the Sectarian as 0. Code Huck as 1. Your data will be cleaner, and your philosophy will be sounder.
