answer: |-
  The Condorcet Jury Theorem requires voters to be independent and better than chance, but deliberation creates correlation while complexity lowers competence. Her argument assumes political questions have truth values like jury verdicts, yet many are matters of preference without a right answer. Finally, institutional mechanics like framing and turnout distort the clean math she relies on to guarantee good outcomes.

  **1. Let's start with the baseline assumption of your argument.**
  You need voters to be right more often than they are wrong. On complex tax policy or foreign treaties, what guarantees the average voter is above that fifty percent line?
  *Follow-up:* If you say education fixes this, I need to ask: "How long does that education take, and does it happen before every single vote?"
  *Pivot prediction:* She will pivot to the Swiss story by saying local voters care more and thus research better.

  **2. Who writes the actual words on the ballot?**
  The math changes if the question is loaded or confusing. If the government frames the choice to favor their preferred outcome, does your truth-tracking still work?
  *Follow-up:* If she says courts will check this, I need to ask: "Courts interpret laws after the fact, but who stops a biased question before the vote?"
  *Pivot prediction:* She will pivot to a story about a specific Swiss ballot where the wording was contested and resolved peacefully.

  **3. Let's talk about what happens after the vote.**
  A binary yes or no rarely matches a complex policy. When a government claims a mandate for a specific plan that nobody voted on, is that epistemic success or failure?
  *Follow-up:* If she says voters trust representatives to fill details, I need to ask: "Then why hold the referendum at all if the real decision happens afterwards?"
  *Pivot prediction:* She will pivot to a story about a commune where the budget was clear and the mandate was obvious.

  **4. You argue that talking helps voters decide better.**
  But your math requires voters to decide independently. If deliberation makes people copy each other's errors, doesn't that break the theorem?
  *Follow-up:* If she says good deliberation reduces errors, I need to ask: "Does it reduce errors equally, or does it just make everyone make the same error together?"
  *Pivot prediction:* She will pivot to a story about town halls where neighbors corrected each other's misconceptions.

  **5. This seems like a fork you have to pick a side on.**
  Either voters decide alone and stay ignorant, or they talk and corrupt the independence your argument needs. Which side are you on?
  *Follow-up:* If she tries to find a middle ground, I need to ask: "Can you name a specific threshold where talking helps without creating correlation?"
  *Pivot prediction:* She will pivot to a story about a village where everyone spoke once and then voted silently.

  **6. Let's move to how much people care.**
  A binary vote counts a passionate minority the same as a indifferent majority. Does your system ignore the intensity of preference?
  *Follow-up:* If she says intensity is dangerous, I need to ask: "But isn't ignoring intense minority views a recipe for instability?"
  *Pivot prediction:* She will pivot to a story about a zoning vote where everyone cared equally about the outcome.

  **7. Legislatures allow trading support across different issues.**
  If you ban that deal-making, do you lose the ability to compromise? Is that mechanism corruption or information?
  *Follow-up:* If she says it is corruption, I need to ask: "Then how do you solve conflicts where both sides need something the other has?"
  *Pivot prediction:* She will pivot to a story about a commune that solved a dispute without any backroom deals.

  **8. What happens if people simply stay home?**
  Does your view require a minimum turnout to be valid? What does an organized boycott do to your truth-tracking story?
  *Follow-up:* If she says turnout doesn't matter for the math, I need to ask: "Then why not let a hundred people decide for the whole nation?"
  *Pivot prediction:* She will pivot to a story about a Swiss vote with low turnout that still produced a wise result.

  **9. If a vote fails, should we ask the same question again?**
  Is a second vote a new roll of the dice, or is it epistemically better because voters have seen the consequences?
  *Follow-up:* If she says voters learn from consequences, I need to ask: "How many times do we roll the dice before the answer becomes stable?"
  *Pivot prediction:* She will pivot to a story about a commune that voted twice and changed their mind the second time.

  **10. I want to end on what could prove you wrong.**
  What specific observation or empirical result would count against your view?
  *Follow-up:* If she gives a generality, I need to ask: "Can you give me a specific country or year where this data would change your mind?"
  *Pivot prediction:* She will pivot to a story about a theoretical model that assumes ideal conditions never found in reality.
