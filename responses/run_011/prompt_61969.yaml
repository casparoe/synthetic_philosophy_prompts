prompt: |-
  I am applying for a six-month, full-time fellowship at an institute that funds conceptual work on the governance of emerging technologies, and I need a two-page proposal of roughly 1,200 words built around an idea I have not managed to get past a sketch.

  The argument I want to work from is the one often called the unilateralist's curse. Suppose that *n* actors each independently consider undertaking an activity that is risky but potentially very beneficial, and that each forms a noisy estimate of whether the activity is on balance worth pursuing. Because the estimates are noisy, and because it takes only one actor erring in the optimistic direction for the activity to be carried out, the probability of premature or reckless action rises with the number of capable actors instead of falling, as an appeal to the wisdom of crowds would lead us to expect. The remedy usually proposed is coordination of some kind: a norm against acting alone, deference to a supermajority of informed peers, or a veto that lets any single participant halt the work.

  My suspicion is that the standard remedy does not dissolve this statistical structure so much as mirror it. Under a rule on which any one of *n* actors may block, the probability that at least one blocks a genuinely worthwhile project rises with *n* by exactly the same logic, with the sign of the error reversed. Call this the veto's curse. If that is right, the quantity that matters is not how many actors there are but which error type the distribution of outcomes makes more expensive, and the practical question becomes which aggregation rule loads the selection bias onto the mistake a given field can afford to make.

  Please develop this into a proposal that contains the following:

  1. A precise statement of the research question, formulated so that it admits of a determinate answer rather than a survey. Say explicitly what would settle it.
  2. An account of why the existing positions leave the question open: those who treat coordination as the obvious correction, those who regard the whole argument as the precautionary principle under a new label, and those who grant that the number of actors matters but have said nothing about the error profile of the remedy itself. Refer to these positions by their content and by what they claim.
  3. The method, laid out month by month across the six months. The analytic core I have in mind is deliberately modest: reasoning about noisy estimates and the probability that at least one of them crosses a threshold, at the level of a stylized model rather than a full decision-theoretic apparatus. Beyond that core, I want you to judge how much of the following can realistically be done and in what order: the effect of correlated error among actors who share an information environment, which should weaken both the original curse and the informational value of a veto; the difference between one-shot irreversible activities and iterated ones where actors learn by doing; the bootstrap problem that warning others about a hazard is itself a unilateral act, so that a norm against unilateralism must say who is permitted to sound an alarm; and whether the two biases trade off along a frontier with a single parameter, or whether some rule is unbiased in both directions. Tell me plainly what to cut.
  4. Why this approach rather than the obvious alternatives — a purely normative argument about precaution, an institutional or legal design study, or an empirical examination of existing oversight bodies. If you think one of those alternatives is better suited to the question I have posed, say so and explain what my framing gets wrong.
  5. What a result would look like: I expect one working paper of publishable length plus a short framework memo written for people who actually sit on research oversight committees. Equally important, state what would count as failure — for instance, that the veto's curse is only a relabeling of a familiar selection-bias result with no further normative consequences; that the frontier between the two biases turns out to be flat, so that no rule is better than any other and the question collapses into an avowal of values; or that the reframing yields no structure beyond the observation that the answer depends on how bad the outcomes are.
  6. A candid assessment of scope, including where a lone researcher with no empirical fieldwork to draw on is most likely to stall.

  Do not include a bibliography, a list of references, or a literature review organized by citation; I will supply those myself. Positions, arguments, and formal results may be described in prose. Please do not assert facts about particular historical episodes or named programs: where a case would strengthen the argument, describe the sort of case required and leave a bracketed placeholder for me to fill in.
