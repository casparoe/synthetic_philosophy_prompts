answer: |-
  **Project Title:** The Veto's Curse: Symmetry in Unilateralist Governance

  **Research Question**
  The unilateralist's curse posits that as the number of actors ($n$) capable of undertaking a risky activity increases, the probability of premature action rises, even if individual estimates are unbiased. The standard remedy is coordination, often instantiated as a veto rule. This project argues that veto rules mirror the statistical structure of the problem: if any one actor can block, the probability of blocking a worthwhile project rises with $n$ by the same logic, with the sign of the error reversed. The research question is: **Given asymmetric costs for false positives (reckless action) and false negatives (stagnation), what aggregation rule minimizes expected loss as a function of $n$ and error variance?**

  This question admits of a determinate answer. It is settled by deriving the inequality condition where the expected cost of unilateralism equals the expected cost of veto-based coordination. If the model yields a specific threshold of relative error costs above which a veto rule is strictly superior, the question is answered. If the model shows the threshold is invariant to $n$, the unilateralist's curse is mitigated by structure rather than count.

  **Existing Positions**
  Three existing positions leave this question open. First, *coordinationists* argue that collective decision-making dissolves the curse, claiming that deliberation corrects noisy estimates. They fail to account for the statistical probability that a single pessimistic outlier can halt beneficial work under a veto regime, treating coordination as a qualitative good rather than a quantitative filter. Second, *precautionary critics* dismiss the unilateralist's curse as merely the precautionary principle relabeled. They miss the structural claim about information aggregation independent of normative weightings, reducing a statistical problem to a moral stance. Third, *actor-count theorists* acknowledge that $n$ matters but treat coordination as a monolithic good. They ignore the error profile of the remedy itself. None compare the selection bias of initiation against the selection bias of obstruction, leaving governance bodies without a framework to choose between risking disaster and risking stagnation.

  **Method**
  The analytic core is a stylized model of noisy estimates and threshold crossing. The work proceeds over six months:

  *   **Months 1-2:** Formalize the base case. Define distributions for actor estimates and cost functions for errors. Derive the probability of action under unilateralism versus veto. This establishes the symmetry argument mathematically.
  *   **Month 3:** Introduce correlated error. Actors sharing an information environment will not provide independent samples. This weakens the wisdom of crowds and alters the veto's statistical power. I will model correlation coefficients to test robustness.
  *   **Month 4:** Map the bias frontier. Determine if the trade-off between reckless action and stagnation is parameterized by a single variable (e.g., relative cost ratio) or if some rules are unbiased in both directions.
  *   **Month 5:** Draft the working paper and the policy memo.
  *   **Month 6:** Revision and external feedback.

  **Scope Cuts:** I will exclude *iterated activities* where actors learn by doing. This introduces dynamic game theory beyond the scope of a six-month formal modeling project. I will also treat the *bootstrap problem* (who warns about the hazard?) qualitatively in the memo rather than modeling it, as it risks infinite regress in the formal structure. The focus remains on the static comparison of initiation versus veto thresholds.

  **Justification of Approach**
  A purely normative argument would presuppose the weighting of risks rather than deriving the structural constraints on those weightings. An institutional design study would be too context-specific to generalize across emerging technologies. An empirical examination is impossible; data on prevented disasters or stifled breakthroughs is inherently unavailable or classified [e.g., specific biosafety near-misses]. This conceptual modeling is necessary to establish the boundaries within which empirical or normative judgments must operate.

  If the model demonstrates that the veto's curse is mathematically identical to the unilateralist's curse with reversed signs, the framing holds. If it shows the trade-off is negligible, the framing fails. This approach is superior because it isolates the statistical mechanics of governance from the politics of risk, allowing for a neutral assessment of procedural rules. It forces a clarification of values: if the model shows that avoiding false positives requires accepting a high rate of false negatives, policymakers must explicitly endorse that trade-off rather than hiding behind procedural consensus.

  **Outputs and Failure Conditions**
  The primary output is a working paper suitable for publication in a journal of political philosophy or technology policy. The secondary output is a framework memo for research oversight committees, translating the model into heuristic questions for governance bodies.

  **Failure Conditions:** The project fails if: (1) The veto's curse proves to be merely a relabeling of known selection-bias results with no new normative consequences; (2) The frontier between the two biases is flat, implying no rule dominates another regardless of error costs, collapsing the question into pure value avowal; or (3) The reframing yields no structure beyond the trivial observation that outcomes depend on the magnitude of harms. Success requires showing that the structure of the decision rule itself imposes a non-trivial bias that interacts with $n$.

  **Scope Assessment**
  The greatest risk lies in formalizing "error costs." Without empirical fieldwork, assigning relative weights to false positives versus false negatives risks arbitrariness. I will mitigate this by treating cost ratios as exogenous parameters rather than attempting to estimate them. A lone researcher may also stall on the correlated error module; if independence assumptions prove too restrictive, the model may lose descriptive power. However, demonstrating the sensitivity of the result to correlation is itself a valuable negative finding.

  There is no team to validate assumptions during the drafting phase. If the formalization reveals that the "curse" dissolves under mild assumptions of communication, the core argument may collapse. I will manage this by maintaining a parallel track of qualitative case analysis [e.g., gain-of-function research moratoria] to ensure the model remains grounded in plausible governance scenarios. The project is designed to remain tractable by prioritizing the static comparison over dynamic learning effects, ensuring a deliverable result even if the deeper game-theoretic extensions remain unresolved.
