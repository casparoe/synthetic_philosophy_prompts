  To make this realistic, I am cutting the analysis of *content* of strategies. I am not modeling what the strategies are, only whether the structure allows stealing. The most damaging objection will be that combinatorial game theory is the wrong tool for stochastic, imperfect-information social systems. The response is not that the tool is perfect, but that the assumption is borrowed from that tool. If the borrowing is invalid, the conclusion is unsupported, regardless of whether a better tool exists. The project tests the validity of the borrow, not the whole system.

