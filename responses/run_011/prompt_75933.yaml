  **Defense Against Alternatives**
  A purely formal model of a race scenario would offer precision but risks irrelevance; it would prove things about a toy model that may not resemble actual governance structures. A purely conceptual analysis of power would capture the nuance but lack the rigor to definitively settle whether the strategy-stealing logic applies. This hybrid approach uses formalism to set the failure conditions and prose to verify whether reality meets them. It sacrifices generality for diagnostic accuracy.

  **Success and Failure Conditions**
  Success looks like a taxonomy of "Strategy-Stealing Failure Modes" in governance. For example, identifying that "public commitment mechanisms" systematically violate the optionality condition. I will know the project succeeds if I can point to a specific policy mechanism and show formally why the assumption cannot apply there.

  Failure looks like inconclusiveness. If the scenarios are too messy to map onto the formal checklist, or if the formal conditions are so weak they always hold, the project fails. I will recognize failure if, by month 9, I cannot articulate a single scenario where the structural violation is clear and non-trivial.

