answer: |-
  The counting room hummed, not with sound, but with a low vibration that Elara felt in her teeth. Across the table, a Kael mathematician named Vex arranged a row of polished basalt spheres. He tapped the third one. It chimed. He tapped the fifth. It chimed higher. To the Kael, arithmetic was not a language of description but a craft of manipulation. You did not assert that two plus two equals four; you placed two spheres beside two others and counted the resulting cluster. If the chime matched the fourth standard tone, the statement held. If the spheres were chipped or the air too humid, the statement might fail. Math was physical. It was fallible. It was real.

  Elara adjusted her recorder. She had spent three weeks trying to explain human arithmetic to Vex, and three weeks failing.

  "In my culture," Elara said, choosing her words carefully, "we do not need the stones. The truth of the sum does not depend on the stones."

  Vex clicked his mandibles, a sign of polite confusion. "Then what do you touch? How does the answer reach you?"

  "It just… is. It is true regardless of whether anyone is here to count."

  Vex pushed the spheres aside. "If no one counts, there is no sum. If you use bone notches instead of stone, the sum is bone-true. If we use light pulses, it is light-true. Your way sounds like you claim the sum exists in the empty air. How do you breathe it in?"

  This was the wall. For the Kael, knowledge required a causal hook. To know a thing, you had to be connected to it, like a hand on a lever. Different clans used different materials—bone, stone, light—and because the structural relationships between the materials were identical, the arithmetic worked perfectly for everyone. But because the materials differed, there was no single set of objects that were *the* numbers. There were only number-systems, plural, tied to the physical media used to instantiate them.

  Elara looked down at her notebook. She had written down the Peano axioms. To her, these described a unique, singular landscape. The number three was not a basalt sphere, nor a notch on bone, nor a neural firing pattern. It was itself. But as she sat in the humming room, a cold doubt settled in her stomach. If the Kael were right about how knowing works—that you must be hooked up to what you know—then how did she know about her numbers? She had never touched a three. She had never seen a perfect circle. She had only seen drawings of them, imperfect copies that hinted at the shape.

  If knowledge requires contact, her knowledge was impossible. It was magic. She was claiming to see objects that were, by her own definition, invisible to every instrument she possessed.

  A senior liaison entered the room, breaking the silence. He placed a thin sheet of flexible glass on the table. On it rested a pair of gloves, woven from a metallic fiber that shimmered like oil on water.

  "The Integration," the liaison said. "The Kael offer this to the delegation. You wear the gloves. You touch the standard blocks. The neural feedback becomes direct. You will feel the progression of primes as a texture on your skin. You will know arithmetic the way you know the weight of a stone in your hand."

  Elara looked at the gloves. They were the solution to the mystery. If she put them on, the causal gap would close. She would no longer be a ghost haunting a realm of invisible objects. She would be a worker in the quarry, hands dirty with truth.

  "But," Elara said, her voice tight. "If I wear them, I am using *these* blocks. The Kael basalt. If another species uses crystal, their math is different objects. By wearing these, I admit that my math is just… this. That there is no *the* numbers. Just the numbers we happen to be holding."

  The liaison shrugged. "You gain certainty of access. You lose the claim of uniqueness. Is the claim worth the blindness?"

  Elara looked at her notebook again. The axioms stared back. They were beautiful because they seemed to hang in a void, unsupported by anything messy or physical. They were true even if the universe burned down. But if she put on the gloves, she would understand *how* she knew them. She would trade the mystery of access for the humility of construction. She would admit that mathematics is something humans *do* with tools, not something humans *see* in the dark.

  The Kael waited. The vibration in the room seemed to intensify, waiting for her hand to move.

  Elara picked up the pen. The deadline for the delegation's response was sunset. Outside the viewport, the twin suns were beginning to dip. She thought of her students back home, struggling with proofs, told that they were discovering eternal truths. She thought of the relief of telling them: *No, you are building things. Check your tools.*

  But she also thought of the terror. If math is just what we can touch, then it is contingent. It could be otherwise. It is not a mirror of the cosmos, but a map drawn by hands.

  She hovered the pen over the signature line. To sign was to admit that knowledge requires a hand to hold it. To refuse was to keep the dream of a truth that holds even when no one is looking, even if she could never explain how she saw it.

  The pen touched the paper. The ink spread. She did not move it yet.

  ***

  **What's doing the work**

  The story maps Benacerraf's dilemma onto a first-contact scenario to separate the semantic and epistemological horns. The human view represents the commitment to a unified semantics: mathematical statements are true because they refer to unique, independent objects (the "singular landscape"). However, this creates the epistemological problem: if these objects are independent of the physical world, how do we have causal contact with them? Elara's knowledge looks like "magic."

  The Kael view represents the causal theory of knowledge. To know something, you must be causally hooked up to it (the "gloves"). This solves the epistemological problem but forces the semantic horn: if numbers are physical objects, there is no fact of the matter which objects are *the* numbers (the basalt vs. bone clans). Truth becomes relative to the physical system used, losing its necessity and uniqueness.

  I simplified the argument by giving the aliens no concept of independent truth whatsoever, whereas Benacerraf assumes we want both. The story forces a choice between the two horns rather than showing the contradiction within a single system. The one thing I deliberately left unresolved is whether the causal theory of knowledge is actually correct; the story treats it as a constraint the protagonist must accept or reject, mirroring the philosophical stalemate where neither horn is easily discarded.
