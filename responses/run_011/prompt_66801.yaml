  **Buddhist:** The necessity lies in her trust in the guide. She reasons: "The guide asserted Species X has property H (hinge-sound). This sound has property H. Therefore, this is Species X." This is a syllogism. The fact that the connection is causal rather than logical doesn't change the epistemic structure. It is an inference based on testimony, and testimony itself is just inference about the speaker's reliability.

