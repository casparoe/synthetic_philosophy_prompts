          *   *Bearer of Cost:* This is the crux. If the investor pays for the "waste," it's not a signal from the founder. If the founder pays (sweat equity/opportunity cost), it selects for privilege.
      *   **Alternative Signaling:** What *actually* signals conviction? Skin in the game (personal cash invested), customer traction, technical milestones, retention rates.

  5.  **Refining the Tone:**
