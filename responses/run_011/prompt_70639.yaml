  *   **Justification:** It is highly plausible that knowledge is the norm of practical reasoning; if you don't know $p$, you shouldn't act on $p$. However, this link could be contingent rather than constitutive, so I withhold full certainty.
  *   **Role:** If knowledge does not norm action, stakes cannot affect knowledge via action requirements.

  **2. The Evidential Threshold Shifts with Stakes**
  *   **Probability:** 0.75 (given KAP)
  *   **Justification:** Even if knowledge norms action, it is contested whether the *amount of evidence required* changes, or merely the *risk tolerance*. SSI requires the former; Purism argues the threshold is fixed and only rational permission varies.
  *   **Role:** This is the core mechanistic claim of encroachment.

  **3. Deflationary Alternatives Fail**
  *   **Probability:** 0.65 (given 1 & 2)
  *   **Justification:** The strongest competitor is the view that the high-stakes subject *knows* but is irrational to act (a change in rationality, not epistemology). If this explains the intuition, your proposition is false.
  *   **Role:** This distinguishes pragmatic encroachment from a change in practical rationality alone.

  **4. The Opacity Objection is Non-Fatal**
  *   **Probability:** 0.60 (given 1, 2, & 3)
  *   **Justification:** Your friend's point: knowledge should not depend on facts inaccessible to the subject (e.g., a colleague's secret wager). Standard externalism accepts opacity regarding reliability, but opacity regarding *practical utility* is a heavier burden that risks making epistemic status alienating.
  *   **Role:** If opacity is fatal to the concept of knowledge in this context, the view collapses.

  ### Combination Method

  I calculate the final credence by multiplying the probabilities in the chain: $0.85 \times 0.75 \times 0.65 \times 0.60 \approx 0.25$.

  *Correction for Correlation:* These factors are not independent; accepting KAP makes a shifting threshold more plausible, and accepting externalism makes opacity more tolerable. I adjust the raw product upward to **0.45** to account for the positive correlation between these theoretical commitments within the SSI framework. This adjustment reflects that if you buy into the first two, the latter two become significantly easier to swallow.

  ### Sensitivity Analysis

  The total credence is most sensitive to **Term 3 (Deflationary Alternatives Fail)**.
  If the probability here drops from 0.65 to 0.40 (suggesting it is more likely that high-stakes subjects retain knowledge but lack rational permission to act), the total credence falls to approximately **0.30**. This is the "kill switch" for encroachment: if the data can be explained by a change in rational action rather than a change in knowledge itself, the encroachment claim is unnecessary and likely false.

  ### Evidence and Argument Shifters

  My number would shift most significantly in response to **experimental philosophy data controlling for salience**.
  Currently, some studies suggest that "high stakes" intuitions are actually driven by the *salience* of error possibilities rather than the practical value of the outcome. If definitive evidence showed that stakes *independently* drive knowledge attributions even when error salience is held constant, my credence in **Term 2** would rise to 0.90, pushing my total credence above 0.60. Conversely, if salience fully explains the intuition, my credence would drop below 0.20.

  ### Divergence Point

  Given your credence of 0.75 and your friend's 0.2, you most likely part company on **Term 3 (Deflationary Alternatives)** and **Term 4 (Opacity)**.
  *   **You (0.75):** Likely view the Knowledge-Action link as so tight that a change in rational action *just is* a change in knowledge (Term 3 is near 1.0), and you likely accept externalist opacity (Term 4 is near 0.80).
  *   **Your Friend (0.2):** Likely believes the high-stakes subject still *knows* but shouldn't act (Term 3 is near 0.2), or finds the idea of inaccessible stakes epistemically unacceptable (Term 4 is near 0.2).
  *   **The Pivot:** You are debating whether the "practical situation" is a *constituent* of knowledge (your view) or merely a *constraint on the use* of knowledge (friend's view).

