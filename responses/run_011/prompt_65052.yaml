answer: |-
  ### Specification for Interpretive Theory: Hypothetical Jurisdiction

  Here is the functional spec for the interpretive guide. It derives directly from the five institutional facts provided.

  #### 1. Procedural Feasibility (The 20-Minute Constraint)
  *   **Consideration:** Derived from Fact 5. Hearing officers have no legal training, no clerks, and 20 minutes per matter. An interpretive method that requires researching canons, weighing conflicting histories, or consulting external databases is functionally impossible. The theory must operate on information present in the packet or immediately known.
  *   **Fact Pattern:** A statute requires a "valid license" to operate a food truck. An applicant has a license from a neighboring county that looks identical but lacks a specific local stamp. The officer must decide if this counts without calling a clerk or researching reciprocity laws.
  *   **Ordinary Court Requirement?** **No.** Ordinary judges have law clerks, briefing schedules, and research access. Complexity is a feature, not a bug, in standard adjudication.
  *   **Classification:** **Non-Negotiable.** (A theory that cannot be applied in 20 minutes by a layperson is not a theory for this system.)

  #### 2. The Anti-Manipulation Shield (The Poisoned Record)
  *   **Consideration:** Derived from Fact 3. Floor transcripts are verbatim but known to be performative strategies for future litigation. An interpretive theory cannot treat floor speeches as reliable indicators of collective intent, or it incentivizes members to game the system. The theory must discount or exclude this evidence.
  *   **Fact Pattern:** A statute bans "vehicles" in parks. During the floor debate, a member gives a speech stating, "This obviously doesn't apply to bicycles," knowing the text says "vehicles." A cyclist is later cited. The officer must decide whether the speech overrides the text.
  *   **Ordinary Court Requirement?** **No.** Ordinary courts often debate the weight of legislative history, but they generally assume some portion of it is sincere or at least vetted by committee staff. Here, the incentive structure makes it adversarial evidence, not explanatory aid.
  *   **Classification:** **Non-Negotiable.** (Ignoring this collapses the distinction between lawmaking and litigation strategy.)

  #### 3. Provenance Sensitivity (Initiative vs. Legislature)
  *   **Consideration:** Derived from Fact 4. Initiatives lack committee reports and have sponsor-written arguments. Legislative statutes lack committee reports due to Fact 1 (rush drafting). They look similar on the page but have different democratic pedigrees. The theory must distinguish how to read a voter-enacted text versus a legislature-enacted text, specifically regarding the "sponsor argument."
  *   **Fact Pattern:** A voter initiative bans "assault weapons" and includes a sponsor pamphlet listing specific models. A legislative statute bans "dangerous firearms" with no list. An officer faces a weapon not on the list but arguably an "assault weapon." The interpretive weight of the pamphlet vs. the text must be defined differently than the legislative statute.
  *   **Ordinary Court Requirement?** **No.** Ordinary courts usually apply the same interpretive canons regardless of whether a statute came from a legislature or a ballot measure, perhaps with minor tweaks. Here, the absence of *any* neutral legislative history for *both* types makes the sponsor pamphlet uniquely dangerous yet uniquely central.
  *   **Classification:** **Non-Negotiable.** (Treating them identically ignores the structural difference in how they were created.)

  #### 4. The "Stuck Statute" Tolerance (Inertia Management)
  *   **Consideration:** Derived from Fact 2. Statutes can misfire for two years without correction. The theory must determine whether the officer acts as a safety valve (fixing the misfire) or a gatekeeper (applying the misfire until the legislature returns). If the theory demands "just results," it turns officers into legislators. If it demands "strict fidelity," it produces known absurdities for 24 months.
  *   **Fact Pattern:** A tax credit is drafted for "parents of twins." Due to a drafting error overnight (Fact 1), it reads "parents of triads." Parents of twins are denied the credit. Everyone knows it's an error. The legislature is out of session for 23 more months. The officer must decide whether to apply the text or the obvious intent.
  *   **Ordinary Court Requirement?** **Yes, but with lower stakes.** Ordinary courts deal with scrivener's errors, but they assume the legislature can fix mistakes in the next session. Here, the "fix" is structurally delayed, raising the cost of strict fidelity.
  *   **Classification:** **Camp Taste.** (This is where the battle lies. One camp says "Apply the text, injustice is the legislature's fault." The other says "Correct the obvious error to prevent systemic failure.")

  #### 5. Error Recognition Protocol (The Overnight Draft Problem)
  *   **Consideration:** Derived from Fact 1. Bills are drafted overnight by non-experts. Internal inconsistencies and typos are features, not bugs. The theory must provide a bright-line rule for when a textual error is "obvious enough" to be ignored without external evidence.
  *   **Fact Pattern:** A regulation sets a fine of "$10,000 per day" in Section A, but Section B says "fines shall not exceed $500." Both were passed in the same overnight bill. The officer must decide which number governs without access to the drafter.
  *   **Ordinary Court Requirement?** **Yes.** All systems have a "scrivener's error" doctrine. However, ordinary courts assume a higher baseline of drafting competence. Here, the baseline is near zero, requiring a much lower threshold for finding an "error."
  *   **Classification:** **Non-Negotiable.** (Without this, the system halts on internal contradictions.)

  ***

  ### Classification & Collisions

  **Non-Negotiable Requirements:**
  1.  Procedural Feasibility
  2.  Anti-Manipulation Shield
  3.  Provenance Sensitivity
  4.  Error Recognition Protocol

  **Camp Taste:**
  1.  The "Stuck Statute" Tolerance (This is the only place where ideology enters. The other four are structural necessities.)

  **The Collision:**
  You guessed the collision is between the **45-day session (Fact 1)** and the **20-minute hearing officer (Fact 5)**.
  *   *Your Guess:* Sloppy law meets limited adjudicative capacity.
  *   *Actual Collision:* **The "Stuck Statute" Tolerance (Fact 2) vs. Error Recognition Protocol (Fact 1 & 5).**
      *   *Why:* Fact 1 guarantees errors will happen. Fact 2 guarantees those errors cannot be legislatively fixed for two years. Fact 5 guarantees the person spotting the error has no authority and no tools to fix it safely.
      *   If the theory allows the officer to fix the error (to mitigate Fact 2), it violates the constraint that officers are not legislators (Fact 5).
      *   If the theory forbids the officer from fixing the error (to respect Fact 5), the system produces known, uncorrectable injustice for two years (Fact 2).
      *   This is a structural paradox, not just a resource mismatch.

  ***

  ### The Theory Killer

  **Single Requirement:** **Procedural Feasibility (Item 1).**

  **Why:** This requirement eliminates the vast majority of existing interpretive theories immediately.
  *   **Originalism/Intentionalism:** Requires sifting through floor debates and drafts. Forbidden by Fact 3 (poisoned record) and Fact 5 (no time/training).
  *   **Purposivism:** Requires determining the "purpose" of a statute often drafted overnight (Fact 1) with no committee report (Fact 4). In a 20-minute hearing, "purpose" becomes a Rorschach test for the officer's personal bias.
  *   **Dynamic Interpretation:** Requires assessing current social values or consequences. Officers lack the institutional capacity to gather this data.
  *   **Canons of Construction:** Most canons require legal training to apply (e.g., *ejusdem generis*, *nosci tur a sociis*). A layperson cannot apply these consistently in 20 minutes.

  Any theory that requires the officer to *choose* between competing plausible meanings using external tools is dead. The only surviving theories will be those that provide a **lexical priority rule** (e.g., "Plain text always wins unless it creates a physical impossibility") that requires zero research and zero discretion.
