prompt: |-
  ok, weird situation and I want the spec before I read anything.

  I've been asked to write an interpretive guide for hearing officers in a jurisdiction that doesn't exist — treat it as a thought experiment where I get to stipulate the institutional facts. Take these five seriously, they're the whole point:

  1. the legislature is a citizen legislature. 45 session days a year, most members have no staff, big bills get drafted overnight by whoever is still in the building.
  2. between sessions it can't amend anything except in a declared emergency, so a statute can sit there visibly misfiring for two full years while everyone agrees it misfires.
  3. the floor transcript is published verbatim and everybody knows it. Members give floor speeches for the cameras and to plant a record for future litigation.
  4. there's an initiative process — voters can enact a statute directly, and those come with a ballot pamphlet argument written by the sponsors and no committee report at all.
  5. the people applying the rules are hearing officers with no legal training, sitting alone, roughly 20 minutes per matter, no clerk.

  What I want: the full list of what an interpretive theory for THIS place has to deliver — the outcomes it must get right, the distinctions it must not collapse, the constraints that follow from 1 through 5. For each item give the consideration behind it and a short invented fact pattern showing what's at stake (generic please, no fake case names or section numbers, I don't want anything I'd have to fact check). And for each one say whether it would still be a requirement in an ordinary court system, because I suspect a bunch of the standard demands made on theories of statutory interpretation only look mandetory because of facts about real legislatures that fail here — I want to know which ones those are.

  Then mark which are non-negotiable and which are just the taste of one camp, and flag any pair you think can't be jointly satisfied. My guess is something about the 45-day session collides with something about the 20-minute hearing officer, but tell me if the real collision is somewhere else. Last thing: which single requirement does the most work eliminating candidate theories.

  Skip the scorecard on textualism vs purposivism vs the dynamic-whatever view, I'll do that myself once I have the list in hand.
