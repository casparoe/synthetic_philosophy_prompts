answer: |-
  ### Diagnosis of the Impasse

  Your hypothesis is structurally sound but overly optimistic about the resolvability of the theoretical layer and too generous to the methodological layer. The impasse does not sit primarily in the model class (Layer 1), nor is that layer resolvable in the way you hope. Labor markets are not uniformly competitive or monopsonistic; they are heterogeneous. The dispute persists because researchers assume uniformity where there is context-dependence. However, the primary driver of the stalemate is Layer 2 (Estimand Definition). When one side measures headcount and the other measures hours or total labor share, they are not disagreeing on the sign of a parameter; they are reporting on different phenomena under the same label. This allows both sides to claim empirical validation without contradiction.

  Layer 3 (Evidential Standards) is not an independent driver of the impasse but a symptom of Layer 1. Researchers do not choose identification strategies at random; they select methods that align with their priors about market structure. A researcher who believes in monopsony trusts border designs less because they fear general equilibrium spillovers; a researcher who believes in competition trusts them more. Treating Layer 3 as a独立 source of disagreement flatters the methodologists; it is merely the weaponized expression of theoretical priors. I reject it as an independent explanatory layer.

  Layer 4 (Distributional Weighting) explains the *political* intensity but not the *empirical* stalemate. Economists often agree on trade-offs but disagree on whether they exist. However, because the empirical effects (Layer 2) are ambiguous, normative priors (Layer 4) fill the vacuum, making the debate feel intractable.

  I add a fifth layer: **Contextual Bindingness**. The effect of a minimum wage depends entirely on how binding it is relative to the median wage in that specific jurisdiction. Aggregating across states and time periods (as meta-analyses do) averages binding and non-binding treatments, producing a null result that both sides interpret to their liking. This heterogeneity is factual but often ignored.

  Regarding rent control: The diagnosis transfers, but the consensus exists because the equivalent of Layer 1 (Model Class) is settled. Housing supply is generally modeled as competitive in the long run; the monopsony wrinkle that plagues labor markets is absent. The consensus on rent control is not a sign that the minimum-wage debate is peculiar, but that the rent control debate was resolved by agreeing on the supply-side model, whereas labor economists remain divided on the demand-side structure.

