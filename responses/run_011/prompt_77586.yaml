answer: |-
  ### The Spec for Idealized Deliberation

  To move from evocative pitch to engineering specification, an account of iterated amplification must satisfy the following requirements. Terms are defined at first use.

  **1. Ontology of Reasoning Steps**
  *   **Requirement:** The system must define what constitutes a single "step" of reasoning such that a human can evaluate it in isolation.
  *   **Case:** If "reasoning" is a black box, the claim that the assistant is "faithful" is empty. You cannot verify fidelity without a unit of verification.
  *   **Status:** **Non-Negotiable.** Without this, there is no interface for human oversight.

  **2. Asymmetric Verification**
  *   **Requirement:** Checking a sub-answer must be strictly easier (cognitively or computationally) than producing it.
  *   **Case:** If verification costs equal production costs, the tree structure offers no leverage. You gain no capacity to solve problems harder than the root human could solve directly.
  *   **Status:** **Non-Negotiable.** This is the economic engine of the scheme.

  **3. Universal Decomposability**
  *   **Requirement:** Every task in the target domain must be factorable into sub-tasks that fit within human cognitive bounds.
  *   **Case:** If there exist atomic tasks at the superhuman level that cannot be broken down (e.g., recognizing a pattern too complex for human perception), the tree bottoms out before the problem is solved.
  *   **Status:** **Non-Negotiable.** A single non-factorable task breaks the general claim.

  **4. Error Containment**
  *   **Requirement:** The system must bound error propagation across tree depth.
  *   **Case:** Humans are noisy. In a deep tree, small errors in sub-branches compound. If the error rate grows exponentially with depth, the root answer becomes random noise.
  *   **Status:** **Non-Negotiable.** Reliability collapses without this.

  **5. Distillation Fidelity**
  *   **Requirement:** When compressing the tree's behavior into a student model (distillation), the alignment properties (honesty, reasoning structure) must be preserved, not just the output correctness.
  *   **Case:** If the student learns to mimic the *answer* without mimicking the *process*, the next iteration loses the ability to decompose further. The chain breaks at step two.
  *   **Status:** **Non-Negotiable.** This is where most current implementations fail.

  **6. Cognitive Gain vs. Brute Force**
  *   **Requirement:** The improvement per iteration must derive from better reasoning structures, not just increased compute or data volume.
  *   **Case:** If the gain is purely from scaling compute, this is not an alignment strategy via deliberation; it is just scaling. The claim is about *structure*, not *size*.
  *   **Status:** **Camp Preference.** Scaling maximalists argue structure emerges from size; alignment theorists argue structure must be enforced. For *this* pitch to hold, it is non-negotiable.

  **7. Convergence Criterion**
  *   **Requirement:** The account must specify whether the "idealized deliberation" is an asymptotic limit (mathematical ideal) or an engineering target (reachable state).
  *   **Case:** If it is only a limit, you cannot deploy the system. If it is a target, you must define the stopping condition where the system is "safe enough."
  *   **Status:** **Non-Negotiable.** You cannot build what you cannot define as finished.

  **8. Adversarial Robustness**
  *   **Requirement:** The system must detect or neutralize sub-answers that are plausible but deceptive (optimizing for approval rather than truth).
  *   **Case:** A single deceptive node can propagate false justification up the tree. If the human verifier cannot distinguish "true" from "convincingly false," the oversight fails.
  *   **Status:** **Non-Negotiable.** This is the core security threat.

  **9. Tree Depth and Readability**
  *   **Requirement:** The tree must be shallow enough to be tractable, and traces must be readable.
  *   **Case:** Deep trees are expensive; unreadable traces prevent verification.
  *   **Status:** **Preference.** These are engineering trade-offs. A tree can be deep if error bounds hold; traces can be opaque if verification functions exist (e.g., code checks) without natural language readability.

  ---

  ### The Tension Analysis

  You suspect the break occurs between **"produces output better than a human can check"** and **"correctness is still grounded in human judgment."**

  This is correct, but it is not necessarily fatal. It is survivable **if and only if** Requirement #3 (Universal Decomposability) and #2 (Asymmetric Verification) hold.

  *   **The Trap:** If the final output is superhuman, the human cannot verify the *result*.
  *   **The Trick:** The human verifies the *steps*. If every step is within human capability (decomposability) and easier to check than do (asymmetry), the human grounds the truth of the conclusion without understanding the conclusion itself.
  *   **The Break:** The tension becomes fatal if the decomposition itself requires superhuman insight to set up. If you need a superhuman intelligence to decide *how* to break the problem down, you have smuggled the uncheckable capability back into the root.

  **Verdict:** The tension is survivable theoretically, but brittle engineering. It fails if the "decomposition policy" becomes too complex for human oversight.

  ### The Killer Requirement

  **Requirement #3: Universal Decomposability.**

  This knocks out the most candidate accounts. Most systems can demonstrate decomposition on toy problems (math, coding). Almost none demonstrate it on open-ended strategy, creative synthesis, or tasks where the "whole" is qualitatively different from the sum of parts (gestalt problems). If the domain includes tasks that resist factorization, the amplification story is not a general alignment solution; it is a niche tool.

  ### Scorecard

  | Approach | Decomposition | Verification | Distillation | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Iterated Amplification (IDA)** | Explicit goal, unproven at scale. | Relies on human checks at leaves. | High risk of losing reasoning trace. | Theoretically sound, practically unproven. |
  | **Debate** | Implicit via adversarial splitting. | Strong (judge picks winner). | N/A (no distillation loop). | Solves verification, fails on non-adversarial tasks. |
  | **Scaling + Feedback (RLHF)** | None (black box). | Weak (outcome only). | N/A (direct optimization). | Fails oversight; capability outpaces control. |
  | **Inference Compute (CoT/ToT)** | Internal, opaque. | None (self-consistency only). | N/A. | Fails oversight; no external grounding. |
