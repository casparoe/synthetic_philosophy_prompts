  (a) Predict N's tag and give me her reasoning roughly in her voice.

  (b) The more useful one. Reverse-engineer the rule she's applying, because I'm pretty confident at least two different rules fit all six precedents and this ticket is the one that forces them apart. Lay out the candidate rules, say what each predicts on the new case, then actually commit to a best guess and tell me why. And tell me what a seventh incident would have to look like to separate the candidates cleanly — something I could go build a test for.

