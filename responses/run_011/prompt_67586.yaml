  **Harrow & Veatch Solicitors**
  **In the Matter of the Novagen Fertility Centre**
  **Ref: NV/GAM/2023/04**

  **NOTICE TO POTENTIAL CLAIMANTS**

  1.  **Definition of the Class**
      You are receiving this notice because our records indicate you were conceived using gametes stored at the Novagen Fertility Centre between 1990 and 2005. Please be advised that membership of this claimant group is strictly defined by biological origin. You are a member of this class only if you are the individual necessarily resulting from the specific sperm and egg listed on the original storage forms. If you were conceived using different gametes, you are not the person named on the accompanying forms, and this notice does not apply to you. If you are not the person named on the forms, please disregard this letter, though you may wish to consider whether the person who *is* named on the forms exists to receive it.

  2.  **Assessment of Damages**
      The Clinic has submitted that no compensable injury has occurred. Their position is that had the correct gametes been used, a different individual would have been conceived. Consequently, you cannot claim for the life you would have led had the error not occurred, as that life would have been lived by someone else. You are entitled only to claim for damages sustained by *you* as a result of being *you*. The Firm advises that claims for "loss of alternative existence" will be struck out as metaphysically incoherent.

  3.  **Molecular Substitution Tolerance**
      It is acknowledged that gametes undergo molecular turnover during storage. The Firm has established a *de minimis* threshold for origin retention. Provided that no more than 4.5 x 10^14 Daltons of mass were exchanged between the stored gamete and the surrounding medium per second, the origin is considered intact. Claims involving gametes exceeding this substitution rate will be treated as having arisen from a distinct biological source, thereby voiding eligibility under Clause 1.

  4.  **Multiple Births from Single Origin**
      In cases of monozygotic twinning, a single origin event has produced multiple persons. The Firm recognises that both twins share the necessary origin. However, damages are allocated per origin, not per person. Twins must agree on a single lead claimant. If no agreement is reached, the claim will be held in abeyance until one twin ceases to exist, at which point the surviving twin may proceed as the sole bearer of the origin's legal interest.

  5.  **Mitochondrial Intervention**
      Where mitochondrial donation techniques were employed, the Firm takes the view that the maternal origin is split. You are considered to have three biological parents but only one necessary origin. If the nuclear DNA matches the storage form but the mitochondria do not, you are considered to be of mixed origin. Such cases are excluded from this group action as the necessity of your existence cannot be traced to a single negligent act.

  6.  **Counterpart Representation**
      The Firm does not act for counterparts. While you may speculate that a version of yourself exists in another possible world conceived from different gametes, that individual has no standing in this jurisdiction. We will not accept instructions from anyone claiming to be a "would-have-been" sibling. Our duty is to the actual client, defined by their actual origin.

  7.  **Continuation of Existence**
      Please note that establishing your identity as the correct claimant is a prerequisite for filing. If you cannot prove you originated from the specific gametes listed, you may not be the client we represent. In such events, retainer fees may become payable by the estate of the person who actually originated from those gametes, should they be locatable.

  **FREQUENTLY ASKED QUESTIONS**

  **Q: The egg was mine, but the sperm was from a different donor. Am I included?**
  A: No. Under the prevailing doctrine, you are not the child of your mother and the donor on the form. You are the child of your mother and the donor whose sperm was actually used. You are a different person than the one intended. You have no standing to sue for the life the intended person would have had.

  **Q: My identical twin did not receive a letter. Is she excluded?**
  A: No. She is ontologically linked to your origin. However, to prevent double recovery for a single origin event, we correspond only with the primary claimant. Please inform her that her legal interests are subsumed within yours until such time as one of you dies.

  **Q: Is the gamete donor a party to this action?**
  A: No. Donors are causal conditions of your existence, not legal persons within this framework. To sue the donor would be to sue the cause of your own necessity, which is not a compensable injury.

  **Q: What happens if I do nothing?**
  A: If you do nothing, you remain the person you are. However, you will forfeit the opportunity to claim damages for being that person. If you are not the person described in our records, doing nothing ensures you do not inadvertently admit to an identity that is not yours.

  **Yours faithfully,**
  **Harrow & Veatch Solicitors**

  ***

  **Author's Note**

  This piece relies on Saul Kripke's *Necessity of Origin* thesis (from *Naming and Necessity*), which argues that a person could not have come from different gametes and still be that same person. I have taken liberties in several places to make the legal framing work:

  1.  **The *De Minimis* Clause (Clause 3):** Kripke acknowledges a vagueness problem (if you swap one molecule, is it still the same origin?), but he doesn't solve it with a specific number. A real metaphysician would argue that setting a precise Dalton threshold is category error; origin is either necessary or it isn't, and vague boundaries don't get solved by arbitrary precision.
  2.  **The Twin Problem (Clause 4):** Kripkean essentialism says twins share the same origin (the same zygote). However, treating them as having a single "legal interest" that requires one to die is a dark comedic extrapolation. A metaphysician would argue that while origin is shared, personhood diverges at splitting; conflating their legal standing ignores the distinctness of persons post-fission.
  3.  **Counterparts (Clause 6):** The notice rejects counterpart theory (David Lewis), which *would* allow you to talk about "other versions" of yourself. Kripke rejects counterparts. The joke here is that the law firm is strictly Kripkean, refusing to acknowledge possible worlds.
  4.  **The Claimant Group (Clause 1 & 7):** The biggest cheat is that the firm is writing to you *assuming* you are the client, while simultaneously saying if the gametes were wrong, you aren't the client. In reality, if the necessity of origin holds, most of the people receiving this letter literally *are not* the people the firm thinks they are, making the class action impossible to constitute. A metaphysician would point out that the notice itself performs a contradiction: it addresses "you" while denying the conditions for "you" to exist.

  The flatmate's objection (that a sperm is mostly water and molecules shuffle) touches on the **Sortal Continuity** problem. The notice attempts to bypass this with the Dalton threshold, but in reality, this is the weakest point of the essentialist view when applied to biological material. If you want to win the argument, press him on whether swapping a single water molecule in the sperm changes the origin. If he says no, ask him how many swaps it takes before it does. If he can't give a number, he's admitted vagueness undermines the necessity.
