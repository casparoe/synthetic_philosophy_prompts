answer: |-
  **AGREEMENT IN PRINCIPLE REGARDING CATALOGUING PRACTICE**
  **Subject:** Transcription and Description of Nineteenth-Century Institutional Records
  **Parties:** The Local History Group (represented by the Retired Head Teacher and the Genealogist)
  **Facilitator:** The Volunteer Cataloguer

  ### 1. Claims Agreed Without Reservation

  Both parties sign below to affirm the following statements as the foundation for all further work on this collection:

  1.  **The Purpose of the Catalogue:** A catalogue description is a tool to find the original record, not a replacement for it. Its primary job is to lead a researcher to the correct box and page without them having to read every entry.
  2.  **The Nature of the Record:** The admission registers and case books record the *opinions and administrative decisions* of the institution at the time. They do not record objective medical or social truths that remain valid today.
  3.  **The Status of the Subjects:** The people named in the registers were real individuals with lives outside the institution. They are not merely data points. Some have living descendants; others do not. We cannot know which is which in advance.
  4.  **The Reality of Harm:** Words can cause distress to living people. Equally, hiding or altering words can cause misunderstanding of history. Both outcomes are forms of harm that we wish to minimize.
  5.  **The Role of the Cataloguer:** The person filling in the catalogue field is an interpreter, not a passive conduit. There is no way to describe an entry without making a choice. Neutrality in the sense of "making no choice" is impossible.
  6.  **The Value of Disagreement:** The tension between preserving the past's voice and protecting present-day dignity is not a problem to be solved once and for all, but a balance to be struck repeatedly. We agree to treat this tension as a feature of the work, not a bug.

  ### 2. Table of Surviving Disagreements

  Where the parties cannot agree on a single statement, the disagreement is recorded below. Each position is stated in language the holder finds acceptable.

  | Area of Disagreement | Position of the Retired Head Teacher | Position of the Genealogist |
  | :--- | :--- | :--- |
  | **The Primary Duty** | My first duty is to the integrity of the historical document. If I change the words, I break the link between the researcher and the mindset that created the record. | My first duty is to the humanity of the people described. If I keep the words without context, I become a partner in the stigma the institution inflicted. |
  | **The Nature of Translation** | Replacing a period term with a modern one is an act of erasure. It hides the specific prejudice of the past behind a vague, comfortable label. | Retaining a period term without qualification is an act of endorsement. It treats a historical insult as a valid medical category. |
  | **The Management of Risk** | The greater risk is sanitizing history. Future researchers need to see the harshness of the system to understand it. | The greater risk is amplifying harm. Descendants searching for family history should not be ambushed by slurs in a public database. |
  | **Emphasis Note** | *The Head Teacher emphasizes the risk to **knowledge**.* | *The Genealogist emphasizes the risk to **people**.* |

  ### 3. The Cruxes

  These are the specific sub-questions where a decision will change the actual work. We agree that answering these matters more than general principles.

  **Crux A: Assertion vs. Citation**
  *Definition:* **Assertion** means stating something is true (e.g., "He was an imbecile"). **Citation** means stating that a source says something (e.g., "The record calls him an imbecile").
  *Question:* When a cataloguer types a word into a description field, does that act assert the word is true, or does it merely cite the source?
  *Why it matters:* If it is only citation, the Head Teacher can keep the original words without guilt. If it is assertion, the Genealogist is right that we are validating the insult.

  **Crux B: Evidence vs. Respect**
  *Definition:* **Evidence** refers to what is needed to prove how the past worked. **Respect** refers to how we treat the memory of the dead and their kin.
  *Question:* When we say "judge the past by its own standards," are we doing it to get the *evidence* right (understanding their logic), or to show *respect* (accepting their authority)?
  *Why it matters:* If it is for evidence, we can explain their logic without using their slurs. If it is for respect, we might be obliged to silence our own moral objections, which the Genealogist rejects.

  **Crux C: The Monolith of the Past**
  *Definition:* A **Monolith** implies everyone in the past thought the same way.
  *Question:* The records show clerks and guardians disagreeing. If we preserve the "official" term, are we preserving "the past's own words," or are we picking the winner of an old argument?
  *Why it matters:* If the past was already arguing, the Cataloguer is not importing modern judgement by picking a side; they are continuing an old debate. This challenges the Head Teacher's idea that there is one "past voice" to preserve.

  ### 4. Concrete Cases for Testing

  For each Crux, we propose a specific test using the actual registers. Both parties predict the outcome.

  | Crux | The Test Case | Head Teacher's Prediction | Genealogist's Prediction |
  | :--- | :--- | :--- | :--- |
  | **A: Assertion vs. Citation** | **Case:** A register entry reads "Condition: Imbecile." <br>**Action:** The cataloguer creates a searchable tag. <br>**Option 1:** Tag = `Imbecile` <br>**Option 2:** Tag = `Diagnosis: Imbecile` | Option 1 is sufficient. A researcher knows this is a historical record. Adding "Diagnosis" is clutter. The tag cites the record by context alone. | Option 1 is dangerous. A database search treats all tags as facts. Option 2 is required to signal that this is a claim, not a truth. Without the prefix, the database asserts. |
  | **B: Evidence vs. Respect** | **Case:** A woman is admitted for "moral deficiency" after having a child out of wedlock. <br>**Action:** The cataloguer writes the 'Reason for Admission' summary. <br>**Option 1:** Write "Moral deficiency." <br>**Option 2:** Write "Single motherhood (recorded as moral deficiency)." | Option 1 is necessary. "Single motherhood" is a modern social status, not the medical reason given. To understand the asylum, we must see they treated status as illness. | Option 1 is misleading. It suggests she had a psychological condition. Option 2 provides the evidence of *why* she was there (the birth) while evidencing the label used to trap her. |
  | **C: Monolith of the Past** | **Case:** Page 42 shows a Medical Officer writing "Idiot," but a visiting Guardian writes in the margin "Unjust label; child is merely neglected." <br>**Action:** The cataloguer fills the 'Summary' field. <br>**Option 1:** Summarize as "Labelled Idiot." <br>**Option 2:** Summarize as "Labelled Idiot (contested by Guardian)." | Option 1 is standard. The Medical Officer's word is the formal classification used for filing. The Guardian's note is commentary. The classification drives the system. | Option 1 silences the dissent. The Guardian's note proves the label was controversial *at the time*. Option 2 is more historically accurate because it records the conflict within the institution. |

  ### 5. Statement on Verbal vs. Substantive Disagreement

  We agree to distinguish between arguments about words and arguments about outcomes as follows:

  1.  **Merely Verbal:** If both parties are willing to accept the same final text in the catalogue box, but argue about what to *call* that text (e.g., whether it is "translation" or "contextualization"), the disagreement is verbal. It does not affect the work.
  2.  **Substantive:** If the parties require different words to appear in the searchable fields, or if one party requires a warning note where the other does not, the disagreement is substantive.
  3.  **The Test:** We will apply the "Search Result Test." If a descendant types their ancestor's name into the public search bar, what is the first phrase they see? If the Head Teacher and Genealogist want different phrases to appear there, the disagreement is substantive. If they agree on the phrase but disagree on why it is chosen, the disagreement is verbal.

  We acknowledge that much of our past year's argument has been verbal, masking a smaller substantive disagreement about the *Search Result Test*.

  ***

  **Signatures:**

  _________________________ (Retired Head Teacher)

  _________________________ (Genealogist)

  _________________________ (Volunteer Cataloguer)

  ***

  **Note to the Volunteer**

  I am writing this solely for you, as requested.

  I am moderately confident that the two of them could sign Section 1 (Agreed Claims). It is drafted to be low-stakes enough that neither feels they are surrendering their core values, while high-stakes enough to matter. Section 5 (Verbal vs. Substantive) is also likely to be acceptable, as it offers a way to end arguments that are just about definitions.

  I am less confident about Section 2 (Table of Disagreements). I have tried to make the positions symmetrical, but in my drafting, I may have made the Genealogist's position sound slightly more reasoned than the Head Teacher's. The Head Teacher might feel the phrasing "act of endorsement" is too strong a caricature of their view. They might argue they endorse nothing, they simply *report*. If I were you, I would watch their reaction to that specific cell in the table.

  The formulation I am least sure of is in Section 4, under **Crux C (Monolith of the Past)**. I have framed the Guardian's margin note as a clear "contest." In reality, archive records are often messy; the Guardian's note might be illegible, or ambiguous, or easily dismissed by the Head Teacher as "anecdotal" compared to the "official" medical label. If the Head Teacher argues that the Medical Officer's word is the *administrative* truth regardless of the Guardian's opinion, the test case collapses. I suspect this is where the real friction will remain, because it challenges the authority of the document itself, which the Head Teacher holds sacred.

  You asked me not to cite scholars, so I have not. But I will say this: your third crux (about the past arguing with itself) is the sharpest tool you have. It is the one point where the Head Teacher's logic ("let the past speak") actually supports the Genealogist's goal ("don't treat the insult as fact"), because the past itself didn't treat the insult as fact. If you can get them to focus there, you may find they are standing closer together than they think.

  Good luck with the registers. They are lucky to have you.
