  **Scenario A**
  Elias spends the year in his sunlit condo. He eats well, naps, and watches films, feeling contentment ripple through his days. He knows he promised to reconcile with his estranged brother, a goal he once cherished, but he never calls. He acknowledges this failure clearly each evening yet feels no sting of regret, only the warm weight of the sofa. He understands he is drifting, but the drift feels like sailing. There is no struggle, only the smooth passage of time marked by pleasant meals and quiet evenings. He is aware nothing lasting is being built, but the lack of structure feels like freedom.

  **Scenario B**
  Elias focuses entirely on checking items off his list. He wanted to visit three specific museums, so he goes, though the travel exhausts him. He wanted to see his cousins, so he visits, though the conversations are thin. He gets exactly what he aims for, tracking each completion in a journal. He feels a crisp sense of closure when each box is ticked. He wanted them, and now they are done. His affect is steady, neither joyful nor sad, just satisfied. He understands the experiences won't change him, but they match his blueprint. The year ends with his list complete, his desires met, and his interior life unchanged.

  **Scenario C**
  Elias commits to mentoring a difficult student, a task he finds draining and often wishes he could quit. He knows he lacks the talent to make it easy, and the meetings leave him tense and weary. He does not want to do this work, yet he keeps every appointment. He gains no pleasure from the struggle, only the cold knowledge that he is holding fast. He understands the student may not improve, but he sees his own commitment solidifying. There is no joy here, only the grim texture of duty fulfilled. The year closes with him tired, unfulfilled in desire, but anchored by what he has maintained.

