  MUNICIPAL INSTITUTE FOR CIVIC PICTURE EDUCATION
  Workshop for Visual Transformation
  Standing Instruction No. 44/Rev. 3
  Subject: Constitution of the Picture-Language
  To: All Transformators, Draftsmen, and Print Liaisons

  The purpose of this document is to secure the unity of the visual speech. It is the position of the Workshop that the citizen, regardless of schooling or tongue, must be able to read the wall-chart as he reads the street. Our commission is to make social facts memorable. Treasures and rarities are for the galleries below; we deal in bread, coal, hours, and wages. To remember simplified pictures is better than to forget accurate figures. Although the Director has occasionally described the system in public addresses as a "language-like technique," the Workshop regards this distinction as a slander on our grammar and records here that we are constructing a language. A language has rules. A language has prohibitions. The following rules are to be observed in the preparation of all zinc blocks and lithographic stones for the exhibition halls and workers' reading rooms.

  1. **The Principle of Multiplicity.** Quantity is never shown by enlargement. A big man is not ten men. If the data indicates ten workers, ten figures must be drawn. If the data indicates one hundred, one hundred figures must be drawn. The eye cannot measure area reliably; it can only count. To enlarge the figure is to lie about the human scale.
  2. **The Principle of Identity.** Every unit-figure must be identical to its neighbor. Variation suggests individuality, and individuality is not statistics. The worker is not a portrait; he is a unit of labor. He is stripped of facial features, shading, and shadow. He is defined by his tool or his lack thereof.
  3. **The Principle of Flatness.** Perspective is forbidden. A table seen from above cannot stand in the same chart as a man seen from the side. All things must present their most characteristic profile to the viewer. We do not draw what the eye sees; we draw what the mind knows.
  4. **The Principle of Physicality.** The Philosophical Patron insists that all statements must refer to observable physical things. We cannot draw "unemployment," as it is a condition, not a thing. Therefore, unemployment is drawn as a man standing with hands in pockets. We cannot draw "debt," so we draw a man carrying a heavy sack marked with a currency sign. If the subject is war, we draw the widow, not the battle. If the subject is peace, we draw the worker returning to the factory. It is acknowledged that a widow may also be a widow due to illness, but the context of the hall must supply the cause.
  5. **The Principle of Self-Sufficiency.** The chart must explain itself without a caption. Words are the enemy of the international viewer. If a key is required, the transformation has failed. The arrangement of the figures must tell the story. Rows indicate time. Columns indicate categories. Color is used only to distinguish groups, never to decorate.
  6. **The Principle of Presence.** We draw only what is there. We cannot draw "not." A chart of what did not happen is indistinguishable from a chart of something else if the something else is also absent. Therefore, negative statements are converted into positive ones. "No strikes occurred" is drawn as "Days of Work Continued."
  7. **The Principle of Certainty.** We cannot draw "if," "perhaps," or "on average." These are clouds, not stones. The Committee requires definite statements. If the data is uncertain, the data is not ready for transformation. We do not serve the future, only the recorded past.

  **Troubleshooting (Queries from the Print Shop)**

  *Q: The print shop asks: How do we indicate that a figure represents "no production" rather than "rest"?*
  A: The figure without tools represents non-production. If the context is a factory chart, he is unemployed. If the context is a leisure chart, he is resting. The surrounding figures determine the meaning. It is regretted that the same picture must serve two truths, but the repertoire is finite.

  *Q: The print shop asks: How do we draw "approximately five hundred"?*
  A: We draw five hundred. To draw a question mark beside the figure suggests uncertainty, and uncertainty is not a fact. See Rule 7.

  *Q: The print shop asks: How do we draw "the same as last year"?*
  A: We draw the same number of figures as last year. There is no symbol for "equality." Equality is shown by matching the rows. If the rows match, the condition is met.

  *Q: The print shop asks: Can we draw a man with a line through him to show "not working"?*
  A: This was tried. It looked like a target. It was retired. See Appendix.

  *Q: The print shop asks: How do we draw "next year"?*
  A: We do not draw "next." We draw "planned construction." The figure is the same, but the border is dotted. Note: Dotted borders often print solid. See Appendix regarding the Probable Man.

  **Appendix: Retired Symbols**

  1. **The Negated Man.** A unit-figure struck through with a heavy bar. Retired because viewers interpreted this as "man eliminated" or "danger," rather than "absence of activity." It is difficult to draw what is not the case. The eye sees the bar as an object, not an operation.
  2. **The Probable Man.** A unit-figure drawn with dotted lines. Retired because the print shop reported that dotted lines often failed to print on rough paper, resulting in a solid man. A solid man is a fact, not a probability. To print a possibility as a fact is a falsehood.
  3. **The Pointing Man.** A second figure pointing at the first to indicate "this one, not that one." Retired because viewers assumed the pointing man was a foreman or an instructor. Hierarchy was introduced where none existed. The language does not permit syntax, only vocabulary.

  **Closing Directive on Self-Reference**

  It has come to the attention of the Workshop that this document itself contains rules regarding drawing. Therefore, this document requires illustrations to ensure the rules are understood without words. However, the illustrations within this document must also obey the rules of this document. This creates a circular requirement. To resolve this, the illustrations in this document are exempt from Rule 1, but only for the duration of this printing. Future editions must be drawn by a Transformator who has memorized this text. If the Transformator forgets a rule, he cannot draw the rule to remind himself. He must consult a colleague. If the colleague is absent, he must wait.

  The Workshop notes that the concept of "exception" is not drawable. Therefore, no exceptions are permitted. If a situation arises that cannot be drawn, the situation is not to be recorded. We proceed now to Rule 13: All future memoranda regarding these rules must be accompanied by a chart showing the number of rules issued this month. This chart must be drawn according to the rules herein. If the number of rules is zero, no chart is to be issued. If no chart is issued, it cannot be known that the number of rules is zero. The Workshop will address this paradox in the next revision.

  Issued by the Committee for Public Enlightenment and Hygiene.
  Approved: Dr. Otto Blum, Director.
  Date: 14 November 1932.
