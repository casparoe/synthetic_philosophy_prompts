prompt: |-
  So I keep seeing the Hart–Fuller debate illustrated with the same case every time — the grudge informer who turns in her husband under a Nazi statute and then gets prosecuted for it afterward. Can you build me a different one?

  I want a concrete, invented example of an agency practice that flunks one of Fuller's eight desiderata of the inner morality of law so hard that calling the output law starts to feel like a stretch — but which doesnt involve retroactivity, a dictatorship, or a war. Set it somewhere deliberately dull: a municipal permitting office, a disability benefits agency, a licensing board, whatever you like.

  And I want it to be a case where the two positions actually come apart for the official or judge who has to act. Hart's line — fine, that's valid law, it's just far too iniquitous to be applied — and Fuller's line — it never made it to being law in the first place — should recommend *different things to do*, not just different vocabulary. If the dispute stays purely about labels in your example, it's not the example I'm after.

  Say which of the eight you're flunking and why that one, then tell me how confident you are that the case really does the work I want, and single out the one step in it you're least sure about.
