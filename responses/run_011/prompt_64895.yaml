answer: |-
  ### The Case of the Confidential Zoning Memo

  **Setting:** The Metroville Zoning Board of Appeals (a municipal licensing body).
  **The Statute:** Metroville Code § 104 states: "Variances from setback requirements may be granted where strict application causes unique hardship to the property owner."
  **The Practice:** The Board publicly issues variances frequently. However, the Board Chair maintains a confidential, internal memorandum titled "Adjudicative Guidelines." This memo is never shown to applicants, their lawyers, or the public. It states: *"No variances shall be granted for lots originally platted after 1990, regardless of demonstrated hardship."*
  **The Case:** *Smith v. Metroville Zoning Board*. Smith owns a lot platted in 1995. He proves unique hardship (a geological anomaly making the standard setback impossible to build on). He is denied. He sues, demanding the criteria used to deny him. The Board produces the confidential memo in camera (privately to the judge) but refuses to make it public, citing "administrative efficiency."

  **The Flunked Desideratum:** **Promulgation.**
  Fuller's second desideratum requires that laws be made known to those subject to them. Law functions as a guide for human conduct; a rule that is hidden cannot guide. By keeping the decisive criterion (the 1990 cutoff) secret, the Board has made it impossible for Smith to know the law he is subject to until after he has lost.

  ### How the Positions Recommend Different Actions

  The judge in this case must decide whether to **uphold the denial** (defer to the Board) or **overturn the denial** (order the variance/rehearing).

  **The Hartian Position (Legal Positivism):**
  *   **Analysis:** The Zoning Board was granted statutory authority by the City Council to interpret "unique hardship." They exercised that authority by creating an internal interpretation (the 1990 cutoff). The source of the rule is valid (the empowered agency). The fact that the rule is secret or harsh is a moral defect, not a legal one.
  *   **Action:** **Uphold the Denial.**
  *   **Reasoning:** "As a judge, my duty is to apply valid law. The Board acted within its delegated powers. This memo is a valid exercise of administrative discretion. While secrecy is unfortunate, it does not strip the rule of its legal validity. To overturn this would be for me to substitute my moral judgment for the Board's legal authority. The remedy lies with the City Council to change the statute, not with this court."
  *   **Outcome:** Smith loses. The law is obeyed, even if it is wicked.

  **The Fullerian Position (Inner Morality of Law):**
  *   **Analysis:** Law is a purposive enterprise to subject human conduct to the governance of rules. A "rule" that is hidden from the governed cannot function as law; it is merely an exercise of raw power. Because the Board failed the requirement of promulgation, the "1990 cutoff" never achieved the status of law. Therefore, the Board's decision rests on a non-legal foundation.
  *   **Action:** **Overturn the Denial.**
  *   **Reasoning:** "I cannot enforce a dictate that fails the basic conditions of legality. A secret rule is indistinguishable from arbitrary whim. Because this guideline was not promulgated, it is not law. The Board therefore acted without legal authority in applying it. I order the Board to rehear the case using only public standards."
  *   **Outcome:** Smith wins. The "law" is ignored because it never existed.

  ### Confidence Assessment

  **Confidence Level:** **85%**
  This case effectively isolates the "Promulgation" desideratum in a mundane setting. It forces a choice between "Source Validity" (Hart) and "Functional Legality" (Fuller). The Hartian judge feels bound by the chain of authority; the Fullerian judge feels bound by the nature of law itself. This produces the required divergence in judicial action (Uphold vs. Overturn) rather than just a divergence in vocabulary.

  **The Weakest Step:**
  **The Hartian Judge's willingness to enforce a secret rule.**
  In modern administrative law systems (like the U.S. federal system), procedural statutes (like the Administrative Procedure Act) often *codify* Fullerian principles, requiring rules to be published to be valid. A sophisticated Hartian judge might argue: "The *statute* implicitly requires publication for a rule to be 'validly enacted' under our source-based criteria."
  To make the philosophical split work, I have to stipulate that the enabling statute is silent on publication. If the statute is silent, a hard-line Positivist judge *could* still argue that "validity comes from the Board's power, not the procedure." But in reality, many Positivists would accept "procedural validity" as part of the "rule of recognition." If the Hartian judge decides that "unpublished = procedurally invalid = not law," the two positions converge on the result (Smith wins), even if they disagree on the *reason* (Source failure vs. Moral failure). The example relies on the Hartian judge viewing the secrecy as a moral flaw rather than a validity flaw.
