answer: |-
  Here is a proposal for a principle that attempts to systematize your intuitions, followed by an honest audit of where it fails, an application to your new cases, and an assessment of the political suspicion.

  ### The Principle: Targeted Intergenerational Vitality Destruction

  **Definition:** *Genocide is the deliberate use of collective power to sever the conditions of a group's intergenerational continuity, where the group's identity is the specific rationale for the targeting, and the destruction is employed as a means or an accepted condition of policy rather than a merely incidental byproduct.*

  This principle is distinct from the 1948 Convention (which is too narrow on intent and groups) and Lemkin (which is too broad on cultural destruction). It focuses on **vitality** (life and reproduction) and **targeting** (specificity of identity).

  #### Clause Mapping to Your Verdicts

  1.  **The Vitality Clause:** *The act must target the biological or social reproduction of the group (life, birth, or custodial socialization).*
      *   **Captures:** (A), (G), (D).
      *   **Excludes:** (B). This explains why cultural erasure without physical/reproductive interference is not genocide in your view.
  2.  **The Specificity Clause:** *The group's identity must be the reason the target was selected, not merely a correlation.*
      *   **Captures:** (C).
      *   **Excludes:** (C-var), (H). This explains why the siege is genocide only when the city is homogenous, and why the drug war is not genocide despite ethnic disparity.
  3.  **The Agency Clause:** *The destruction must result from concentrated policy action, not diffuse social forces.*
      *   **Captures:** (A), (B), (C), (D), (G), (H).
      *   **Excludes:** (E). This explains why migration and market forces, even if they erase a group, are not genocide.
  4.  **The Instrumentality Clause:** *The destruction must be intended or accepted as a condition of the policy (oblique intent), not merely foreseen as a risk.*
      *   **Captures:** (D). (The starvation is the *method* of breaking resistance).
      *   **Excludes:** (H). (The deaths are a *risk* of enforcement, not the method).

  #### Explicit Analysis of Critical Pairs

  **The (A) vs. (B) Distinction: Custodial Sovereignty**
  You noted you cannot say what is doing the work except "force against the children." The principle refines this: it is the **violation of custodial sovereignty over reproduction.**
  *   In **(A)**, the state physically seizes the *mechanism* of continuity (the children). It treats the children as objects to be relocated. The parents are rendered biologically existent but socially sterile.
  *   In **(B)**, the state alters the *environment* of continuity (language, shrines), but the mechanism (parent-to-child transmission) remains legally and physically intact. The children assimilate, but they are not *taken*.
  *   **Why this matters:** Your intuition tracks a violation of bodily and custodial integrity over cultural integrity. You view the group as a biological lineage first, and a cultural unit second. (A) attacks the lineage; (B) attacks the culture.

  **The (C) vs. (C-var) Distinction: Discriminatory Selection**
  You dislike hanging the verdict on demographics, but the principle insists on it. The work is done by **Discriminatory Selection.**
  *   In **(C)**, the city is chosen *because* it is that group. The group identity is the *criterion of selection* for the target. The harm is particularized to the group.
  *   In **(C-var)**, the city is chosen for strategic value (negotiating leverage). The group identity is *correlated* with the harm, but not the *reason* for the target selection.
  *   **Why this matters:** Without this clause, all warfare in ethnically homogenous regions becomes genocide. Your intuition correctly identifies that genocide requires the group to be the *object* of the attack, not just the *location* of it.

  #### The Unsavable Verdicts

  To be precise, I must tell you where this principle (and likely any coherent principle) will fail to match your intuitions.

  1.  **Case (D) is the Weak Link.** You want to call the famine genocide, but you also want to exclude the drug war (H). The distinction rests on "accepted condition" vs. "incidental risk." In practice, this is a razor-thin line. If ministers "welcome" the disappearance in (D), that is close to intent. But if the quotas are for "industrialization," the destruction is technically a side effect.
      *   *Honesty:* If you tighten the Intent Clause to save (H) (requiring *dolus specialis*, or specific intent to destroy), you **lose (D)**. If you loosen it to save (D) (allowing *dolus eventualis*, or foresight of certainty), you risk **sweeping in (H)**. You cannot have both without arbitrary line-drawing. My advice: Sacrifice (D). Call it "Crimes Against Humanity" or "Politicide." It preserves the unique horror of genocide as *group-specific* intent.
  2.  **Case (F) cannot be saved without redefining "Group."** If you include political groups, the concept of "stable, birth-based identity" collapses. Political groups are voluntary and fluid. If you include (F), you must admit you are no longer talking about *genocide* as historically understood, but rather *mass atrocity*.
      *   *Honesty:* Your intuition that (F) is "exactly as grave" is morally sound, but legally and conceptually distinct. Do not contort "genocide" to cover (F); instead, argue that "Politicide" should carry the same obligations.

  ---

  ### Application to New Cases

  **Case 1: Incentivized Assimilation (Payments for ceasing identity)**
  *   **Verdict:** **Not Genocide.**
  *   **Reasoning:** This fails the **Vitality Clause** and the **Coercion Element**. While the outcome is group disappearance, the mechanism is economic exchange, not the severing of reproductive continuity or physical destruction. It resembles (B) more than (A). The "force" is economic pressure, which falls under structural violence, but lacks the *custodial seizure* of (A).
  *   **Nuance:** If the payments were contingent on sterilization, it would flip to Genocide (matching G).

  **Case 2: Consensual Dispersal (Treaty by leaders)**
  *   **Verdict:** **Not Genocide.**
  *   **Reasoning:** This fails the **Agency Clause** regarding *victimhood*. Genocide implies a violation of the group's right to exist *against its will*. If elected leaders sign a treaty (assuming free and fair representation), the destruction is consensual self-determination, however tragic.
  *   **Nuance:** If the "election" was rigged or the "security guarantee" was a sham known to the state, this reverts to Genocide via deception (matching the *intent* of A/D). But on the facts given, consent negates the violation.

  **Case 3: Failed Attempt (Intent + Mobilization + No Deaths)**
  *   **Verdict:** **Law: Yes (Attempted Genocide). Morality: No (Genocidal Policy, but not Genocide).**
  *   **Reasoning:**
      *   **Legal:** The 1948 Convention (Article 3) explicitly punishes "attempt." The *mens rea* (intent) is present, and the *actus reus* (mobilization) has begun. The law intervenes before the body count rises.
      *   **Moral:** In moral philosophy, labels often track *harm*. "Genocide" describes a completed catastrophe. A failed attempt is a *genocidal conspiracy* or *policy*. Calling it "genocide" prematurely can dilute the term's descriptive power regarding actual destruction.
      *   **Does it change?** Yes. Law is preventative; it must label the attempt to stop it. Morality is often retrospective; it labels the wound. You should distinguish between *being a genocidaire* (which the actors are) and *committing genocide* (which requires the destruction).

  ---

  ### The Political Suspicion

  You suspect the urgency is political because the label carries obligations (R2P, ICC, reparations). **You are right.**

  The concept of genocide is not a natural kind (like "water" or "gold"); it is a **functional kind** (like "weapon" or "currency"). It is defined by what it *does*.

  **Which verdicts are contaminated?**
  1.  **Case (F) (Political Groups):** This is the most contaminated. The exclusion of political groups in 1948 was not philosophical; it was political (USSR and others insisted on it to protect themselves from purges). Your intuition that (F) is "indefensible" is correct, but the reason it remains excluded is that states do not want their internal security operations subject to international intervention.
  2.  **Case (D) (Famine/Policy):** This is contaminated by **Sovereignty.** States accept that war causes starvation (C), but they resist labeling economic policy as genocide (D) because it opens the door to prosecuting neoliberal structural adjustments or collectivization. Your desire to label (D) as genocide is a moral challenge to state sovereignty.
  3.  **Case (C) (Siege):** This is contaminated by **Military Necessity.** If (C-var) were genocide, almost all modern urban warfare would be genocidal. The law carves this out to allow war to continue. Your intuition that (C) *is* genocide challenges the legitimacy of siege warfare itself.

  **Can a moral concept be specified without smuggling in consequences?**
  **No.**
  If the label "genocide" did not trigger armies and courts, we would not need such a precise definition. We would simply call it "mass murder" or "cultural erasure." The reason we agonize over the boundary between (A) and (B), or (C) and (C-var), is precisely because crossing that boundary changes the world's obligation to act.

  *   **Recommendation:** Do not try to purify the concept of its political consequences. Instead, acknowledge that **Genocide is a moral concept with a legal trigger.**
      *   **Moral Genocide:** Any action that destroys a group's continuity (includes B, D, E).
      *   **Legal Genocide:** The subset of Moral Genocide severe and specific enough to justify international military or judicial intervention (Includes A, C, G).

  Your intuitions are tracking **Moral Genocide**, but you are testing them against the **Legal Definition**. The friction you feel is the gap between what is *evil* and what the international community is *willing to fight*. Your seminar should likely focus on whether we should widen the legal trigger to match the moral concept, or accept that some evils (like B and D) must be fought by means other than the Genocide Convention.
