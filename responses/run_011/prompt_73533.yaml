answer: |-
  ### 1. The Implicit Rule of the Unadjusted Practice

  The unadjusted practice—reporting the Random Match Probability (RMP) without reference to the database size ($N$)—operates on an implicit rule of **Indexical Fixity**. It presupposes that once the defendant is standing in the dock, the reference class governing the statistic is the general population, not the set of database search outputs.

  Epistemologically, this treats the defendant as a **fixed indexical** ("I am *this* man") rather than a **selected output** ("I am the man *found by this search*"). By conditioning only on the proposition "The defendant's profile matches the crime scene profile," the practice treats the search procedure as epistemically irrelevant background noise. It adheres to a **Principle of the Irrelevance of Discovery**: the weight of evidence depends on the physical link (the DNA), not the historical path by which that link was uncovered.

  This choice rules out rival accounts of evidence that view the **selection effect** as constitutive of the evidence's meaning. Specifically, it rejects a **Full Conditionalization** model, which demands that the likelihood ratio be calculated based on the total evidence, including the fact that a search of size $N$ was conducted and yielded exactly one match. By ignoring $N$, the practice implicitly adopts a **Self-Sampling Assumption (SSA)** stance: the jury is instructed to reason as though the defendant were a random sample drawn from the population, ignoring the fact that his "existence" in the trial is contingent on a filtering process that favors matches.

  ### 2. Self-Indication, Database Size, and the Presumptuous Philosopher

  Does either camp invoke a Self-Indication Assumption (SIA) style adjustment?

  **Camp A (Multiply by $N$)** argues that the probability of a coincidental match increases with the number of opportunities for a match to occur. This is structurally analogous to SIA. SIA states that one should update on the bare fact that an observer exists, favoring hypotheses with more observers. Camp A updates on the bare fact that *a match exists*, favoring hypotheses where matches are more probable (i.e., where $N$ is large). They allow the size of the candidate pool to do evidential work independently of the specific biological match.

  **Camp B (No Adjustment)** argues that the search eliminates innocents, thereby increasing the posterior probability of guilt for the remaining match. This is closer to a standard Bayesian update on the *exclusion* of others, rather than an SIA adjustment.

  **The Presumptuous Philosopher Analogy:**
  The Presumptuous Philosopher argues that because he exists, he should favor cosmological theories that predict more observers. If Camp A argues, "Because a match was found in a large database, the defendant is likely innocent," are they committing the same error?

  There is a **decisive disanalogy**. The Presumptuous Philosopher infers a property of the *world* (its size) from the fact of his existence. Camp A infers a property of the *evidence reliability* (the false positive rate of the investigation) from the search parameters. Camp A is not claiming the world must be populated differently; they are claiming the *procedure* is noisy. However, if Camp A argues that the *guilt* is lower *solely* because the database is large, without accounting for the exclusion of the other $N-1$ profiles, they risk a version of the presumptuous error: reading a conclusion about the defendant's culpability off the mere fact of the search's scale, potentially ignoring the specific incriminating weight of the match itself. Nevertheless, Camp A's core insight—that the probability of *finding* a match under the innocence hypothesis scales with $N$—is a valid frequentist correction for multiple testing, not a metaphysical error.

  ### 3. Which Camp Gets the Reasoning Right?

  **Camp A is epistemologically superior regarding the investigative question; Camp B is superior regarding the biological question.** The disagreement is fundamentally about **what question the jury is being asked.**

  *   **Camp B conditions on:** $E = \text{"Defendant matches"}$.
      *   Question answered: "Given this man matches, how likely is it to be a coincidence?"
      *   Result: High weight to the DNA.
  *   **Camp A conditions on:** $E^* = \text{"A search of } N \text{ profiles yielded the Defendant as a match"}$.
      *   Question answered: "Given this investigation produced this man, how likely is it to be a false lead?"
      *   Result: Weight adjusted for the "trawling" effect.

  **The Verdict:** In a legal context, the jury must answer the second question. The defendant is not on trial because he matches; he is on trial because the *search* identified him. To ignore the search procedure is to ignore the causal history of the prosecution. Therefore, Camp A identifies the correct conditioning set for legal epistemology. The statistic reported should reflect the probability of the *investigative outcome* (a match arising from a trawl), not just the *biological outcome* (a match arising from a comparison).

  However, Camp A's specific recommendation to simply "multiply by $N$" is a heuristic for the **Database Match Probability** (the chance of at least one match in the DB), which is distinct from the posterior probability of guilt. The "right" reasoning requires a full Bayesian update that accounts for both the increased chance of a coincidental match (Camp A's concern) and the elimination of other suspects (Camp B's concern). Usually, for large $N$ and small RMP, the elimination effect dominates, but the *uncertainty* introduced by the trawl must be disclosed.

  ### 4. Coherence with Legal Epistemology

  The unadjusted practice is **incoherent** with the rest of the legal system's epistemology, specifically regarding **naked statistical evidence** (the *Gatecrasher* paradox).

  *   **The Gatecrasher Principle:** Courts refuse to convict based solely on statistical likelihood (e.g., 499 of 1000 attendees didn't pay; pick one at random). The rationale is that the evidence must be "individualized" or causally connected to the specific act, not just probabilistically likely.
  *   **The Cold Hit Tension:** A cold hit DNA case *is* naked statistical evidence if the DNA match is the *only* link. The defendant is in the dock solely because he was the statistical output of a search.
  *   **The Incoherence:** By refusing to adjust for $N$, the court treats the DNA match as a "unique identifier" (like a fingerprint found on the weapon) rather than a statistical correlation. But in a trawl, the match functions statistically. If the court rejects the *Gatecrasher* verdict because it lacks individualized evidence, it must logically reject a *Cold Hit* verdict that relies solely on an unadjusted RMP. The search procedure makes the evidence "group-based" (you were in the pool) rather than "individual-based" (you were suspected for cause).

  **Does the Cold Hit survive?** Only if the legal system treats DNA as a special category of "physical fact" that transcends statistics. But epistemologically, it does not. The unadjusted cold hit is an exception that undermines the ban on naked statistics by disguising a statistical trawl as an individualized identification.

  ### 5. Presuppositions vs. Underdetermination

  **Strict Presuppositions:**
  The practice strictly presupposes the **Principle of Irrelevance of Discovery**. It asserts that $P(\text{Guilt} | \text{Match})$ is invariant under changes to the search method, provided the match holds. This presupposes that the *method* does not alter the *meaning* of the match.

  **Consistency and Underdetermination:**
  The practice is *consistent* with multiple incompatible theories of evidence, which marks it as philosophically underdetermined:
  1.  **Fingerprint Theory:** It is consistent with the view that DNA is a unique physical trace, making statistics secondary.
  2.  **SSA Theory:** It is consistent with the Self-Sampling Assumption, where the defendant is treated as a random draw from the population regardless of selection bias.
  3.  **Policy Theory:** It is consistent with a pragmatic view that juries cannot handle complex Bayesian updates, so the court simplifies the evidence to avoid confusion (even if epistemically inaccurate).

  **The Gap:** The instruction "The chance of a random match is 1 in a million" does not specify the reference class. It is compatible with "1 in a million humans" (SSA) and "1 in a million tests" (Frequentist). This ambiguity allows incompatible epistemologies to license the exact same jury instruction. The instruction is underdetermined because it fails to distinguish between the probability of the *profile* and the probability of the *discovery*.

  ### 6. Concrete Changes and Jury Feasibility

  If courts accepted that the search procedure is evidentially relevant, the following changes would be required:

  1.  **Disclosure of $N$:** The size of the database searched must be disclosed to the defense and the jury. Concealing $N$ is a form of epistemic obfuscation.
  2.  **Reframing the Statistic:** Instead of the RMP ("1 in a million"), the expert should report the **Expected Number of Matches** ($N \times \text{RMP}$).
      *   *Example:* "In a database of this size, we would expect 1.5 coincidental matches even if the true donor is not in the database."
      *   This shifts the focus from "How rare is this DNA?" to "How reliable is this lead?"
  3.  **Corroboration Requirement:** A cold hit should not be sufficient for conviction without **independent corroborating evidence** (e.g., location data, motive, opportunity). This moves the case away from "naked statistical evidence" toward "individualized evidence," restoring coherence with the *Gatecrasher* principle.
  4.  **Jury Instruction:** The judge must instruct that the DNA match establishes a link, but the *strength* of that link depends on how the defendant was found.

  **Feasibility:**
  Would a jury follow this? Research suggests juries struggle with probabilities, but they understand **error rates**. Telling a jury, "This test can produce a false name in a search like this about once every two cases," is more intuitive than "The random match probability is $10^{-6}$."
  The resulting practice would be more demanding. It would likely reduce convictions in pure cold-hit cases, but it would increase the epistemic integrity of the verdicts. It forces the system to admit that a cold hit is an *investigative lead*, not *proof of guilt*, until corroborated. This aligns the epistemology of the courtroom with the actual probabilistic structure of the evidence.
