answer: |-
  The candle guttered, throwing long shadows across the green leather of the ledger. Elias Thorne dipped his quill, the ink wet and black against the ruled paper. At the top of the page, he had written: *Case 442. Silas Vane & Thomas Gantry.* Below that, the seven columns waited, empty and accusing: Intensity, Duration, Certainty, Propinquity, Fecundity, Purity, Extent.

  On the desk beside him lay a stack of letters, tied with red ribbon. They came from London, from a man whose name Elias never wrote down. The hand was sharp, the logic colder. *Punishment is only justified by the mischief it prevents,* the last letter read. *If there is no mischief, there is no crime. If the penalty costs more misery than the offence, it is tyranny.* There were four situations where the gallows were merely murder in a wig: where there was no mischief to prevent; where the penalty could not change minds; where the penalty cost more than the offence; and where the end could be got cheaper.

  Elias looked up at the two men sitting on the bench against the wall. Silas Vane was a wool-comber, hands rough with lanolin. Thomas Gantry was the assistant schoolmaster, thin as a rail, staring at his boots. They had been brought up under an old statute that carried the gallows. There had been no force. No children involved. No money stolen. The indictment spoke of "unnatural conduct," but the only evidence anyone in town could articulate was disgust.

  Elias turned back to the ledger. He meant to save them. He meant to prove this was the third case: penalty costing more than the offence.

  He began to tot.

  *Pain of Punishment (Death).*
  Intensity: 10. The maximum.
  Duration: 0 for the man, but infinite for the kin. Let us score 100 units per man.
  Certainty: 10. If he signs the warrant, it happens.
  Propinquity: 9. Immediate upon sentencing.
  Fecundity: 5. It breeds fear in others.
  Purity: 2. It brings little pleasure to anyone but the hangman.
  Extent: 2. The prisoners themselves.

  Total Pain of Punishment: 100 x 2 = 200 units.

  Now, the *Pain of Offence*.
  Intensity: 4. Disgust is sharp but fades.
  Duration: 3. A few days of talk at the market.
  Certainty: 5. Not everyone knows.
  Propinquity: 4. Only those who hear the rumour.
  Fecundity: 1. It does not breed more offences.
  Purity: 8. It is mostly mental sickness, no physical harm.
  Extent: ?

  Elias paused. Here was the hope. If the Extent was low, the total mischief would be less than 200. The arithmetic would demand mercy. He dipped the quill to write a modest number for the townsfolk who knew.

  "The column is incomplete, Mr. Thorne."

  Elias jumped. Mr. Halloway, the town attorney, stood in the doorway. He was a man of solid coat and solid sense, not given to flights of fancy. He stepped in, closing the door against the draft.

  "I am reckoning the mischief," Elias said, covering the page slightly. "The correspondent writes that prejudice is not mischief."

  Halloway walked to the table, looking down at the seven columns. "Prejudice is a feeling. Feelings are pain. You count the prisoner's fear of the rope. That is pain. Why do you not count the town's fear of the act?"

  "Because the act harms no one," Elias said. "It is private."

  "Alarm spreads," Halloway said quietly. "Alarm is pain. If a man walks the street knowing his neighbour does what God forbids, he feels sick. He locks his door. He watches his sons. That is a reduction in happiness. If you refuse to count the town's revulsion as a harm, then you have no business counting the town's relief at the hanging. You are picking which feelings get a column."

  Elias tightened his grip on the quill. Halloway was not shouting. He was using the arithmetic against him. "But the community has already punished them," Elias said. "Look."

  He pointed to the notes in the margin. "Vane's work dried up last week. The baker refused Gantry bread on Tuesday. A stone through Vane's window on Thursday. They are already suffering."

  Halloway nodded. "Then add it to the ledger. Call it *Pain of Social Ostracization*."

  Elias wrote it down.
  *Intensity:* 6. Hunger and fear.
  *Duration:* 10. Indefinite.
  *Extent:* 2.

  "The court's penalty laid on top of that," Elias argued, "makes it the fourth case. The needless one. The end could be got some cheaper way. They are already ruined."

  "They are ruined," Halloway agreed. "But the town is not relieved. The alarm remains until the statute is satisfied. The pain of the town continues until the pain of the men ends. You seek to balance the scales, Elias. Do not leave one side empty."

  Elias looked at the men. Gantry looked up, meeting his eyes for a second. There was no hope there, only a quiet exhaustion. Elias turned back to the seventh column. *Extent.*

  He had intended to write the number of those who knew of the act. Perhaps twenty men in the tavern. Perhaps fifty. He picked up the quill to write *50*.

  But the arithmetic demanded consistency. If he counted the pain of the town's disgust, he had to count every person who felt it. The statute existed because the community deemed the act a poison. If the poison was in the air, everyone breathed it.

  He looked at the parish roll on the shelf. The population of the town was roughly four hundred souls. Heads of households, wives, grown sons. All capable of disgust. All capable of alarm.

  If the Intensity of disgust was only 4, but the Extent was 400...
  4 x 400 = 1600 units of pain.

  He looked at the Pain of Punishment again. 200 units.

  The numbers sat on the page, stark and unarguable. The seventh column did not save them. It drowned them. The misery of the many outweighed the misery of the two. The arithmetic of happiness demanded a sacrifice. It was not a clever gotcha; it was a weight pressing down on his chest, making it hard to breathe. He had sought a logic that would protect the minority from the mob, and the logic had handed him the mob's knife.

  Halloway saw the shift in Elias's shoulders. He said nothing. He simply waited.

  Elias looked at the four cases of misapplied punishment in his mind. *Where the penalty costs more misery than the offence.* He had thought the offence was small. But the Extent column made the offence massive. The mischief was not in the act; it was in the knowing. And everyone knew.

  He dipped the quill. The ink seemed thicker now. He wrote the final sum at the bottom of the page. *Net Mischief: 1400 units in favour of Punishment.*

  "The law requires your signature," Halloway said softly. "The Deputy is ill. You have the commission."

  Elias looked at Vane. The wool-comber was asleep, head against the wall. He looked at Gantry. The schoolmaster was watching him still. Gantry had lent Elias books once. Plato. Cicero. He knew what reason was supposed to look like.

  Elias moved the ledger aside. He pulled the warrant toward him. The parchment was rough, the script cramped. *...to be hanged by the neck until dead...*

  "If I do this," Elias said, his voice sounding like it came from far away, "I am not preventing mischief. I am balancing books."

  "You are preventing alarm," Halloway said. "You are purchasing relief for four hundred people at the cost of two. It is the only math that holds."

  Elias picked up the seal. It was cold in his hand. He pressed it into the wax. The crack was loud in the quiet room.

  He signed his name. *Elias Thorne.*

  He pushed the warrant across the table to Halloway. The attorney took it, folded it, and placed it in his coat. He nodded, once, respectfully. There was no triumph in him. He was just a man doing a job.

  Halloway turned to the prisoners. "Silas Vane. Thomas Gantry. You are remanded for trial."

  Vane woke with a start. Gantry did not move. He just looked at Elias. He didn't look angry. He looked disappointed. That was the cost. It did not cost Elias his job, or his safety. It cost Thomas Gantry his life, specifically and solely, because Elias had decided that four hundred units of disgust were worth more than one unit of mercy.

  Elias watched them led away. He looked down at the ledger. The seven columns stared back, perfect and hollow. He blew out the candle, but the numbers remained in the dark, adding themselves up over and over, forever.
