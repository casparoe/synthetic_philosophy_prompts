prompt: |-
  I'm the science program director at a mid-sized private foundation. I run a coastal ecosystems portfolio — about $6M a year — and twice a year a panel and I have to decide which incumbent programs keep their money, which get conditions attached, and which get wound down over a few years. Our reviewers are working marine ecologists and biogeochemists, no philosophers, and we allow ourselves roughly forty minutes per renewal, most of which goes to arguing about the PI's last three papers.

  Here's the problem I'm trying to solve. Our memos and decline letters have quietly drifted into reasons that don't actually justify anything: "this framework isn't testable," "they keep patching it," "nobody in the field believes it anymore," "it hasn't been refuted but it hasn't produced anything either." Each of those sounds like a verdict and is really a mood. I've been reading Lakatos on research programmes and I think his apparatus is much closer to what we're groping toward than our reviewers realize, but I obviously can't hand a panel a sixty-page essay.

  So: build me the decision procedure. Steps in order, what at each step counts as a sufficient answer versus a dodge, what the possible outputs are, and the points where the procedure stops and hands the call to me or to the board because what's left is a question about our risk appetite rather than about the science. Assume the people running it are smart and busy and have never heard the term protective belt — so I need you to be explicit about which of Lakatos's distinctions absolutely have to survive the simplification, because dropping them turns the thing back into ordinary peer review with extra vocabulary, and which ones I can safely throw away. Two constraints you should design around: our bylaws require every proposal to get a continue-or-stop recommendation with no abstentions, and our outside counsel insists the word unfalsifiable never appears in a letter. Tell me where those rules collide head-on with the theory.

  Then run it on three things I inherited, all aimed at the same question — why some seagrass meadows knocked out by nutrient runoff never come back even decades after the runoff stops:

  1. "Bistable meadows." Core: a meadow sits in one of two self-reinforcing states, and collapse is a switch between them rather than a smooth response to load. Twenty-two years of our money. Every anomaly since — sites that recovered with no obvious feedback change, sites that collapsed at very low loads — has been answered by adding another stabilizing mechanism to the belt: sulfide intrusion, waterfowl grazing, sediment resuspension, seed-bank depletion. Each is independently plausible, none was predicted in advance by the core, all were proposed after the anomaly. Two of the four now imply opposite management actions. The program has never called a result in a system it hadn't already studied. Huge lab, famous PI, half the field trained by her, our board adores her.

  2. "Supply-side recovery." Core: whether a cleared site recovers is set by propagule supply from upstream source meadows, not by local conditions. It made two risky predictions — reseeding fails at sites far from a source no matter how clean the local water is, and recovery time scales with distance-to-source in a particular way — and both were confirmed by unaffiliated groups in two other regions. One anomaly: a site recovered with no plausible source within sixty kilometers. The answer was "cryptic local refugia," small surviving patches below survey detection, which is now doing a lot of heavy lifting and is being tested by a new deep-water survey method, results due next spring. The program says nothing at all about the collapse side.

  3. "Microbial legacy." Core: what makes a site unrecoverable is a persistent change in sediment chemistry and microbial community — the sediment remembers. Four years old, one PI, two postdocs, four papers, no big field campaigns. The core implies a testable and rather surprising claim, that sites with near-identical water-quality histories will differ in recovery according to a measurable pore-water signature, and a pilot assay is running now. Nothing confirmed, nothing refuted, and the PI is candid that if the assay fails the core is in trouble. Cheapest of the three by a wide margin.

  One of those three is going to come out in a way I'll hate. Say which and why, and don't soften it.

  After the runs, the limits section, and this is where I most want you to be blunt: where will this procedure systematically misfire — what kind of science does it reward and what does it punish, given that it seems to love cheap risky predictions and instrument-building programs that take fifteen years will look inert? What should it do in a field where we are the only funder and there is exactly one program, no rival at all, which describes maybe half my portfolio? How does it handle the case where two programs are both progressive and nothing in the rules picks between them — I don't want a fake tiebreaker, I want it to say so out loud. And I have a vague memory that Lakatos himself had an example, something in the history of atomic weights, where a written-off program came back decades later; tell me if I'm misremembering, and if I'm not, how the procedure is supposed to carry that worry without paralyzing every decision we make. Finally, point out where my reviewers' instincts are actively anti-Lakatosian, and where the theory is going to hand respectable cover to something we all privately think is bad science.

  Please write in American English. No reading list, no bibliography, no footnotes — I want the procedure itself, short enough that a panelist could hold it in one hand, with the three case runs and the limits after it.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Science Program Director at a mid-sized private foundation ($6M/year coastal ecosystems portfolio).
      *   **Task:** Build a decision procedure based on Imre Lakatos's methodology of scientific research programmes (MSRP) for grant renewals.
      *   **Constraints:**
          *   Panelists are marine ecologists/biogeochemists (no philosophers).
          *   40 minutes per renewal.
          *   Must simplify Lakatos (keep essential distinctions, drop others).
          *   Bylaws: Continue-or-stop recommendation (no abstentions).
          *   Legal: Word "unfalsifiable" cannot appear in letters.
          *   Output: Decision procedure (steps, sufficient answers vs. dodges, outputs, handoff points), run on three specific cases (Bistable, Supply-side, Microbial), identify the hated outcome, limits section (biases, monopoly funding, ties, historical revivals, reviewer instincts vs. theory).
          *   Tone: Blunt, American English, no bibliography/footnotes, practical enough to hold in one hand.
      *   **Goal:** Replace vague "mood" verdicts with structured Lakatosian reasoning without becoming philosophical jargon.

  2.  **Deconstruct Lakatos for this Context:**
      *   *Core Concepts:* Hard Core (untouchable assumptions), Protective Belt (auxiliary hypotheses), Positive Heuristic (how to develop the program), Negative Heuristic (what not to attack), Progressive vs. Degenerating Problemshift.
      *   *Essential Distinctions to Keep:*
          *   Core vs. Belt (to distinguish patching from developing).
          *   Progressive vs. Degenerating (theoretical vs. empirical progress).
          *   Novel Predictions (the gold standard for progress).
          *   Ad hoc adjustments (patches that explain anomalies without new content).
      *   *What to Drop:*
          *   Deep historical analysis of rationality.
          *   Complex distinctions between types of ad hocness (unless directly relevant to funding).
          *   Philosophical debates on truth vs. verisimilitude.
      *   *Collision Points:*
          *   "Unfalsifiable" ban vs. Lakatos's focus on falsification potential. Need to rephrase as "lacks empirical content" or "cannot be tested with current methods."
          *   No abstentions vs. Lakatosian ambiguity (sometimes it's too early to tell). Need a default rule for ambiguity (usually risk appetite).

  3.  **Drafting the Decision Procedure:**
      *   *Step 1: Identify the Core.* What is the non-negotiable claim?
      *   *Step 2: Assess the Belt.* How have anomalies been handled? New predictions or just excuses?
      *   *Step 3: Check for Novel Facts.* Did the program predict something new that was confirmed?
      *   *Step 4: Determine Trajectory.* Progressive (growing) or Degenerating (shrinking/patching).
      *   *Outputs:* Renew Unconditional, Renew Conditional (milestones), Wind Down.
      *   *Handoff:* When the science is progressive but the foundation's risk tolerance is the bottleneck.

  4.  **Running the Cases:**
      *   *Case 1 (Bistable):* 22 years. Core: bistability. Belt: added mechanisms (sulfide, grazing, etc.) post-anomaly. No novel predictions. Opposite management actions. *Verdict:* Degenerating. Patching the belt without new content. *Recommendation:* Wind Down (or severe condition).
      *   *Case 2 (Supply-side):* Core: propagule supply. Predictions confirmed (reseeding fails, distance scaling). One anomaly (cryptic refugia) being tested. Silent on collapse. *Verdict:* Progressive (empirically). *Recommendation:* Renew (maybe conditional on refugia test).
      *   *Case 3 (Microbial):* 4 years. Core: sediment memory. One risky prediction (pore-water signature). Pilot running. PI admits core is in trouble if fails. *Verdict:* Potentially Progressive (high risk). *Recommendation:* Renew Conditional (on assay result).
      *   *The Hated Outcome:* Case 1 (Bistable) gets cut. Why? It's the famous PI, huge lab, board adores her. But Lakatos says it's degenerating (ad hoc patches, no novel predictions). Case 3 might get funded over Case 1 despite Case 1's prestige.

  5.  **Drafting the Limits Section:**
      *   *Biases:* Rewards quick wins/predictions. Punishes long-term instrument building (looks inert).
      *   *Monopoly Funding:* If only one program exists, Lakatos needs rivals. If no rivals, the procedure struggles. Need to fund "rival generation."
      *   *Ties:* If both progressive, admit the procedure doesn't pick. Hand off to Director/Board for strategic fit.
      *   *Historical Revivals:* Yes, Prout's atomic weights (Lakatos's example). Procedure must allow a "high risk/high reward" bucket for degenerating programs with high potential upside, but limit the exposure.
      *   *Reviewer Instincts:* Reviewers love "plausibility" and "consensus." Lakatos loves "novel facts." Reviewers hate "ad hoc" but call it "comprehensive." Lakatos calls it "degenerating."
      *   *Cover for Bad Science:* A program can look progressive by slicing data thinly (many small predictions) without deep understanding.

  6.  **Refining the Tone and Constraints:**
      *   *American English:* Direct, pragmatic.
      *   *No "Unfalsifiable":* Use "lacks testable implications" or "insulated from evidence."
      *   *No Abstentions:* Force a choice. If ambiguous, default to "Conditional Renewal" with strict milestones.
      *   *Length:* Keep it tight.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain "Protective Belt" simply? Yes, call it "Auxiliary Assumptions."
      *   *Check:* Did I address the "Unfalsifiable" ban? Yes, rephrase to "empirically insulated."
      *   *Check:* Is the hated outcome clear? Cutting the famous PI (Case 1) is the classic political nightmare.
      *   *Check:* Lakatos example? Yes, Prout's programme vs. Dalton.
      *   *Check:* Reviewer instincts? They focus on past papers (backward-looking). Lakatos focuses on future heuristic power (forward-looking).

  8.  **Final Polish:** Ensure the structure matches the prompt's requirements (Procedure -> Cases -> Limits). Ensure the voice is appropriate for a Program Director talking to themselves/their team, but formatted as a document.

  *(Self-Correction on the "Hated Outcome"):* The prompt asks "One of those three is going to come out in a way I'll hate. Say which and why."
  *   Case 1 (Famous PI) -> Likely Cut/Wind Down. (Hated because of politics/board love).
  *   Case 2 (Solid) -> Renew.
  *   Case 3 (Risky/New) -> Renew Conditional.
  *   Actually, the *most* hated outcome might be funding Case 3 over Case 1. Or cutting Case 1. Given the description ("Board adores her"), cutting Case 1 is the political landmine. But wait, Case 2 is the most robust. Case 3 is the cheapest. Case 1 is the most expensive/prestigious.
  *   Lakatos dictates Case 1 is degenerating. Case 2 is progressive. Case 3 is potentially progressive.
  *   If I have to cut one to save money or prioritize: Case 1 should be the one wound down. This will be hated because of the PI's status.
  *   Alternatively, if I have to pick *one* to fund heavily: Case 2 wins.
  *   The prompt says "One of those three is going to come out in a way I'll hate." Usually, this means the *correct* scientific decision is the *political* disaster. Cutting the famous PI (Case 1) is the disaster.
  *   Wait, is there a nuance? Case 3 is "cheapest." Case 1 is "huge lab." If the portfolio is $6M, Case 1 is eating a lot. Cutting it frees up money.
  *   Let's stick with: Case 1 gets the "Wind Down" recommendation. This is the hated outcome because of the PI's stature and the board's affection, despite the science being degenerating.

  *(Refining the Limits Section):*
  *   Need to be blunt about instrument-building. Lakatos hates "just measuring stuff" without a theoretical core driving novel predictions.
  *   Monopoly problem: Lakatos needs competition. If only one program exists, you can't judge degeneration relative to rivals. You have to fund rivals.
  *   Ties: Admit the procedure fails here. It's a strategic choice, not a scientific one.
  *   Prout's example: Yes, Prout's hypothesis (atomic weights are integers) was degenerating but turned out true later (isotopes). Procedure needs a "long shot" bucket.

  *(Final check on "Unfalsifiable"):*
  *   Constraint: "outside counsel insists the word unfalsifiable never appears in a letter."
  *   Collision: Lakatos relies on falsifiability potential.
  *   Solution: Use "empirically insulated" or "lacks testable consequences."

  *(Final check on Reviewer Instincts):*
  *   Reviewers look at past papers (backward). Lakatos looks at heuristic power (forward).
  *   Reviewers like "consensus." Lakatos likes "novel facts" even if controversial.
  *   Reviewers call patches "nuance." Lakatos calls them "ad hoc."

  Let's assemble.
answer: |-
  # The Lakatosian Renewal Procedure (LRP)

  **Purpose:** To distinguish between research programs that are growing (progressive) and those that are shrinking (degenerating), based on their ability to predict new facts rather than explain old ones.
  **Time Allocation:** 40 minutes per proposal.
  **Participants:** Program Director, Panelists (Ecologists/Biogeochemists).

  ## Part 1: The Decision Procedure

  **Step 1: Identify the Hard Core (5 minutes)**
  *   **Task:** State the central claim that the PI refuses to give up.
  *   **Sufficient Answer:** "The core claim is X. If X is false, the project ends."
  *   **Dodge:** "The core is flexible," or "We are exploring multiple hypotheses equally." (If there is no core, there is no program, only a data collection exercise.)
  *   **Output:** A single sentence defining the non-negotiable assumption.

  **Step 2: Map the Protective Belt (10 minutes)**
  *   **Task:** List the auxiliary assumptions added to protect the Core from anomalies (failed predictions or conflicting data).
  *   **Sufficient Answer:** "When anomaly Y occurred, we added assumption Z to the belt."
  *   **Dodge:** "The anomaly was due to experimental error," without changing the model.
  *   **Critical Question:** Were these additions made *before* or *after* the anomaly was known?
  *   **Output:** A list of belt adjustments, tagged as "Predicted" or "Retrofitted."

  **Step 3: Assess Empirical Progress (15 minutes)**
  *   **Task:** Count the novel facts predicted by the program and confirmed by evidence.
  *   **Sufficient Answer:** "The program predicted Fact A before it was observed, and Fact A was confirmed."
  *   **Dodge:** "The program explains all existing data." (Explaining old data counts for zero progress.)
  *   **Constraint:** Do not use the word "unfalsifiable." If a claim cannot be tested, label it "empirically insulated."
  *   **Output:** A score: **Progressive** (confirmed novel predictions), **Neutral** (no new predictions, no anomalies), or **Degenerating** (retrofitted belt, no novel predictions).

  **Step 4: The Recommendation (5 minutes)**
  *   **Rule:** No abstentions. You must choose one of three outputs.
  *   **Output A: Renew Unconditional.** (Program is Progressive. Core is solid, belt is growing, novel facts confirmed.)
  *   **Output B: Renew Conditional.** (Program is potentially Progressive but currently ambiguous. Core is risky, or belt adjustments are pending test. Funding tied to specific milestones within 12 months.)
  *   **Output C: Wind Down.** (Program is Degenerating. Belt is patched repeatedly, no novel facts, empirically insulated.)
  *   **Handoff Point:** If the science is Progressive (A or B) but the cost exceeds our risk tolerance, or if two programs are equally Progressive, the procedure stops. The Program Director decides based on portfolio balance, not scientific merit.

  ---

  ## Part 2: Case Runs

  ### Case 1: "Bistable Meadows" (22 Years, Famous PI)
  *   **Core:** Meadows exist in two self-reinforcing states; collapse is a switch.
  *   **Belt:** Added sulfide intrusion, grazing, resuspension, seed-bank depletion *after* anomalies appeared.
  *   **Progress:** Zero novel predictions. Every result was accommodated after the fact. Two belt adjustments imply opposite management actions (incoherence).
  *   **Verdict:** **Degenerating.** The belt is swallowing the core. It explains everything but predicts nothing.
  *   **Recommendation:** **Wind Down.** (Phase out over 3 years).
  *   **Reasoning:** This is a classic degenerating shift. The program is buying immunity from refutation by adding complexity without new content.

  ### Case 2: "Supply-side Recovery" (Established, External Validation)
  *   **Core:** Recovery is set by propagule supply, not local conditions.
  *   **Belt:** "Cryptic local refugia" added to explain one anomaly (recovery without source).
  *   **Progress:** Two risky predictions confirmed by unaffiliated groups (reseeding fails at distance; recovery scales with distance).
  *   **Verdict:** **Progressive.** The core is driving successful predictions. The one belt adjustment is currently being tested (not yet retrofitted permanently).
  *   **Recommendation:** **Renew Unconditional.** (With a note to monitor the refugia test).
  *   **Reasoning:** The program is growing. It stuck its neck out and survived.

  ### Case 3: "Microbial Legacy" (4 Years, Early Career)
  *   **Core:** Sediment chemistry/memory prevents recovery.
  *   **Belt:** Minimal.
  *   **Progress:** One risky prediction (pore-water signature) currently in pilot. PI admits core fails if assay fails.
  *   **Verdict:** **Potentially Progressive.** High risk, high reward. Not yet degenerating because the belt hasn't been patched to save the core.
  *   **Recommendation:** **Renew Conditional.** (Funding contingent on assay results next spring).
  *   **Reasoning:** It fits the Positive Heuristic. It is willing to be wrong.

  ### The Hated Outcome
  **Case 1 gets cut.**
  You will hate this because the PI is a giant in the field, runs a huge lab, and the Board adores her. Cutting her looks like incompetence or politics to outsiders. But under this procedure, she is the weakest link scientifically. She is running a degenerating program that consumes disproportionate resources while producing zero novel facts. Case 3 (the cheap, risky newcomer) is scientifically more valuable despite having fewer papers. If you follow the procedure, you must recommend winding down the famous PI to fund the risky newcomer and the solid performer.

  ---

  ## Part 3: Limits and Blind Spots

  **1. The Instrument-Building Bias**
  This procedure systematically punishes long-term infrastructure. A program spending 15 years building a sensor network or a genomic database will look "inert" because it isn't generating novel theoretical predictions year-over-year. It will look degenerating compared to a cheap modeling group churning out predictions.
  *   **Fix:** You must categorize "Infrastructure" proposals separately. Do not run them through LRP. They are evaluated on utility and reliability, not theoretical progress.

  **2. The Monopoly Problem**
  You asked what to do when you are the only funder and there is only one program (half your portfolio). Lakatos requires competition to judge degeneration. If there are no rivals, you cannot tell if a program is degenerating or just ahead of its time.
  *   **Fix:** If a program is a monopoly, your mandate shifts from "selecting the best" to "generating rivals." You must earmark 20% of that portfolio slice specifically to fund alternative approaches to the same core question. If no one applies, you issue targeted RFAs to create competition.

  **3. The Tie Problem**
  If Case 2 and Case 3 are both rated Progressive, this procedure does not pick a winner. It cannot. Scientific merit is equal; strategic fit is not.
  *   **Fix:** The procedure stops at "Recommendation: Renew." The tiebreaker is handed to you (Director). You decide based on diversity of approach, geographic coverage, or training goals. Do not fake a scientific reason for a strategic choice.

  **4. The Prout Problem (Historical Revivals)**
  You remembered correctly. Lakatos cited William Prout's 1815 program (atomic weights are integers). It was degenerating for a century (weights weren't integers), patched endlessly, and looked dead. Then isotopes were discovered, and the core was vindicated.
  *   **Risk:** This procedure will kill a Proutian program every time. It prioritizes short-term empirical progress over long-term truth.
  *   **Fix:** You need a "High-Risk/High-Reward" bucket (max 10% of portfolio). Programs can be rated Degenerating but still funded here if the Core is theoretically elegant and the cost is low. This carries the worry without paralyzing the main portfolio.

  **5. Reviewer Instincts vs. Lakatos**
  *   **Instinct:** "This paper is well-cited and consistent with consensus."
  *   **Lakatos:** Consensus means nothing. A program can be consensus and degenerating (Case 1).
  *   **Instinct:** "They have addressed every criticism."
  *   **Lakatos:** Addressing criticism by patching the belt is a negative sign. It means they are defending, not attacking.
  *   **Instinct:** "The methodology is rigorous."
  *   **Lakatos:** Rigor in measuring the past is worthless. Rigor in predicting the future is everything.
  *   **Danger:** The theory gives respectable cover to "cowboy science." A PI can make wild, unsupported predictions, get lucky once, and look Progressive. You must verify that the prediction was *risky* (could easily have been wrong) and not just a vague guess that happened to land.

  **6. The "Unfalsifiable" Collision**
  Your counsel bans the word; Lakatos demands the concept.
  *   **Collision:** A program that explains everything explains nothing.
  *   **Workaround:** In decline letters, do not say "This is unfalsifiable." Say: "The current framework lacks empirical leverage. Future work must specify conditions under which the core hypothesis would be abandoned." This forces the PI to define their own exit criteria without you using the forbidden word.

  **Final Note:** This procedure will make you enemies. It tells famous people they are stagnant. It tells cautious people their rigor is irrelevant. It forces you to fund unproven kids over established labs. That is the price of buying progress rather than prestige.
