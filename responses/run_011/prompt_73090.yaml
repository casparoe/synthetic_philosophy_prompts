answer: |-
  **Recommendation**
  Recommend funding the programme. The primary ethical duty here is supporting reproductive autonomy, allowing women to align childbearing with life stability. The increased health risks associated with later birth are real but modest, and they are side effects of preserving choice, not the aim of the treatment. We should not withhold a service that enables planning because of probabilistic risks inherent in delayed parenting, provided we counsel patients honestly. This decision affirms that public health supports managing life courses, not just treating acute illness. It sets a precedent that we weigh autonomy against risk, rather than vetoing services whenever risk exists.

  **What the objection is actually claiming**
  The obstetrician's concern is not philosophical pedantry; it is about stewardship and non-maleficence. The argument is that public funds should not purchase interventions known to increase the absolute risk of serious harm to future persons. By shifting the average age of first birth from 29 to 34, the programme statistically increases the incidence of specific adverse outcomes. The claim is that the board becomes complicit in this harm. It does not matter that the children would not otherwise exist; the board's duty is to minimize preventable suffering commissioned by the health system. To fund this is to endorse a practice that trades child health for parental convenience. This framing treats the future child's welfare as an independent variable we are obligated to protect, regardless of whether that specific child would have existed without our intervention. It demands we prioritize health outcomes over reproductive timing when the two conflict.

  **Why the existence reply doesn't close the case**
  The counter-argument—that these children would not exist otherwise, so they are not harmed—is logically sound regarding individual comparison but ethically insufficient for policy. It reduces all medical ethics to a single question: "Is this life worth living?" If yes, any action causing it is permissible. This collapses the distinction between careful parenting and reckless conception. A board cannot operate on the basis that any life better than non-existence justifies the means of creating it.

  Furthermore, this reasoning ignores the comparative context. In public health, we assess policies by comparing possible worlds, not just individual biographies. In one world, we fund freezing and accept higher aggregate risk; in another, we do not. We are permitted to choose the world with less preventable suffering, even if the specific sufferers in that world would not have existed in the healthier one. The "existence reply" works for individual defense but fails for institutional responsibility. We are not judging whether the child should be grateful; we are judging whether the board should facilitate the risk. Therefore, the fact that the child benefits from existing does not absolve the board of the duty to minimize risk where possible. We must acknowledge the risk is real, even if the child is not "harmed" in a comparative sense.

  **The autumn test**
  For the PGT request, apply the "Clinical Intent Test." Ask: Is the adverse condition a side effect we accept to achieve a health goal, or is it the goal itself? In egg freezing, health risks are incidental to the goal of reproductive timing. In selecting for disability, the condition is the objective.

  Criterion: "Does the intervention aim to produce a child with reduced health potential when a healthier alternative was available?" If the answer is yes, refuse funding. This distinguishes accepting risk (egg freezing) from courting harm (PGT for disability). Clinicians can apply this by asking: "Would we treat this outcome as a complication or a success?"

  Hard case: This test may refuse funding to deaf couples seeking deaf children, which limits their cultural autonomy. It may also create tension where "healthier" is contested. But it holds the line: public medicine aims to restore or preserve health, not engineer impairment. It prevents the slide from "any life is good" to "any life we can make is good." It ensures we fund autonomy only when it aligns with the healing purpose of the service.

  **The strongest thing the losing side can say**
  Rejecting the obstetrician's view costs us moral consistency on harm. We are accepting that some children will suffer conditions they would not have had if we waited. We must admit that autonomy has a body count, however small. Conversely, rejecting the "existence reply" in the autumn case limits parental sovereignty. Some will argue that if a life is worth living, parents should choose its traits. By refusing the PGT request, we tell parents their valuation of their own condition is secondary to our medical norms. We lose the chance to affirm that disability is not always a harm to be avoided. We must be prepared to say that while we respect lived experience, public funds cannot actively select for impairment.
