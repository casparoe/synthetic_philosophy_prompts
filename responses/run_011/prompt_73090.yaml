      *   The counter-argument—that these children would not exist otherwise, so they are not harmed—is logically sound regarding individual comparison but ethically insufficient for policy. It reduces all medical ethics to a single question: "Is this life worth living?" If yes, any action causing it is permissible. This collapses the distinction between careful parenting and reckless conception. A board cannot operate on the basis that any life better than non-existence justifies the means of creating it.
