      *   The obstetrician's concern is not philosophical pedantry; it is about stewardship and non-maleficence. The argument is that public funds should not purchase interventions known to increase the absolute risk of serious harm to future persons. By shifting the average age of first birth from 29 to 34, the programme statistically increases the incidence of specific adverse outcomes. The claim is that the board becomes complicit in this harm. It does not matter that the children would not otherwise exist; the board's duty is to minimize preventable suffering commissioned by the health system. To fund this is to endorse a practice that trades child health for parental convenience. This framing treats the future child's welfare as an independent variable we are obligated to protect, regardless of whether that specific child would have existed without our intervention. It demands we prioritize health outcomes over reproductive timing when the two conflict.

