answer: |-
  Your classmate is correct that the passage relies heavily on a caricature, but your instinct about the architecture is also worth pursuing, provided you distinguish between a terminological correction and a conceptual collapse. To understand where this trade book author goes wrong, you have to separate what Gould and Lewontin actually argued in 1979 from how their ideas were later popularized and subsequently attacked. The core of the 1979 paper is methodological, not quantitative. Gould and Lewontin did not set out to prove that *most* traits are non-adaptive; rather, they argued that the adaptationist *program* operates by assuming traits are adaptive until proven otherwise, which biases the inquiry. They insisted that researchers must test alternative hypotheses, such as genetic drift, developmental constraints, or phylogenetic history, before settling on natural selection. The passage you were handed flips this into a quantitative dogma, claiming Gould and Lewontin showed that features are "usually" leftovers and that "most of the machinery of an organism is architectural accident." This is a significant distortion. While Gould certainly believed selection was overused as an explanation, the 1979 paper is a warning against *assuming* adaptation, not a counter-claim that non-adaptation is the statistical norm. In philosophy of biology terms, they were attacking the *a priori* status of the adaptationist hypothesis, not trying to replace it with a *a priori* spandrel hypothesis.

  This distortion bleeds into how the passage handles the specific examples and the distinction between spandrels and exaptations. The male nipple, the human chin, and the redness of blood are indeed classic Gouldian examples, but they largely appear in his later popular essays, such as those collected in *The Panda's Thumb*, rather than in the technical 1979 text. More importantly, the passage conflates the origin of a trait with its current utility. A spandrel is defined by its origin as a necessary byproduct of another structure, not by its current uselessness. Gould and Lewontin explicitly allowed that spandrels could later be co-opted for a function, a process they later termed "exaptation." By stating that these features are "leftovers with no function of their own" and implying that any biologist claiming otherwise is telling "just-so stories," the author ignores the possibility that a trait can be a spandrel by origin but adaptive by current maintenance. The fallacy named in the paper is not simply finding a function where none exists, but inferring historical selection solely from current utility without ruling out that the trait arose as a constraint or byproduct. The passage suggests that identifying a trait as a spandrel licenses you to stop looking for function, but the actual methodological lesson is that you cannot *start* by assuming function drove the trait's origin.

  Regarding the architecture, the book author is technically correct but philosophically glib. Gould did concede in later writings that the triangular spaces in San Marco are architecturally defined as pendentives, not spandrels, which are the spaces between arches. However, the claim that this concession means "the analogy was doing all the work, and that when it goes, so does the argument" is untenable. The biological concept of a spandrel relies on the logic of structural necessity and byproduct, not on Venetian terminology. As long as a biological feature arises as an unavoidable consequence of a different adaptive change, the concept holds, regardless of what an architect calls the corner of a dome. That said, there is a much stronger objection to the San Marco illustration than the terminological one, and it is the one you should raise in section. The analogy implies that developmental constraints are as rigid as stone architecture. In a building, if you want a dome on arches, you *must* have the triangular spaces; the builder has no choice. In biology, developmental pathways are themselves products of evolution and can be modified. What looks like a necessary byproduct in one lineage might be evolvable in another. The stronger critique is not that Gould got the Italian wrong, but that he may have overstated the rigidity of biological constraints, treating developmental pathways as fixed architectural laws rather than malleable historical outcomes.

  Ultimately, the passage is a mix of accurate history, popular simplification, and rhetorical exaggeration designed to score points against Gould rather than elucidate the debate. It treats a methodological warning as a quantitative counter-revolution and dismisses a robust conceptual tool based on a vocabulary correction. If you are looking for the single sentence to challenge in your section, it should be the one that codifies the quantitative strawman. The most misleading sentence is: "Their conclusion was that natural selection explains far less than its champions admit and that most of the machinery of an organism is architectural accident." This sentence falsely attributes a positive empirical claim to Gould and Lewontin when their actual contribution was a negative methodological constraint, and it is the foundation upon which the rest of the passage's misrepresentations rest.
