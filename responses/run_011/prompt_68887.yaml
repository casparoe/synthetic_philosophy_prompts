answer: |-
  **PHI 450: Material Objects — Take-Home Examination**

  **Question**

  Consider the following proposal regarding the Special Composition Question:

  > **The Descriptive Irreducibility View:** Some things compose something just in case no complete description of the world can state all the facts about those things without employing a singular term for something they compose.

  Evaluate this proposal using the following two cases:

  1.  **The Swarm:** A swarm of bees whose members bear dispositions that are irreducibly collective.
  2.  **The Dispersed Fusion:** A shoe in Boston together with the Eiffel Tower, where every fact there is, is a fact about one of them or a plain relation between them.

  Does the view deliver the right verdicts, or does it only appear to? Furthermore, what does this view commit its proponent to regarding whether composition depends on our descriptive resources? Your answer should adjudicate the metaphysical cost of the view rather than merely summarizing it.

  ***

  **Model Answer**

  The Descriptive Irreducibility View (DIV) ties the existence of composite objects to the indispensability of singular terms referring to them in a complete description of the world. To evaluate DIV, we must apply its criterion to the stipulated cases and then assess the metaphysical implications of linking ontology to description.

  In the case of **The Swarm**, the stipulation is that the bees bear dispositions that are irreducibly collective. This means facts about the swarm's behavior (e.g., "the swarm defends the hive") cannot be reduced to facts about individual bees acting in concert. If these facts are truly irreducible, a complete description of the world seemingly requires a singular term like "the swarm" to capture them accurately. Under DIV, since we cannot state all facts without this term, the bees compose a swarm. This verdict aligns with common intuitions that organisms or functional collectives exist while arbitrary collections do not. DIV successfully captures the idea that composition occurs when there is genuine emergent behavior requiring ontological acknowledgment.

  In the case of **The Dispersed Fusion** (the shoe and the Eiffel Tower), the stipulation is that every fact is either about the shoe, the tower, or a plain relation between them (e.g., distance). There are no emergent facts requiring a referent like "the schmeiffel tower." Consequently, a complete description can be exhaustive using only terms for the shoe and the tower. DIV dictates that no composition occurs. This verdict satisfies the intuition that composition is not universal; arbitrary scattered objects do not typically compose a whole. Here, too, DIV appears to deliver the right result, distinguishing genuine unities from mere aggregates based on the structure of the facts.

  However, the appearance of success masks a significant metaphysical cost. The critical question is whether composition depends on our descriptive resources. DIV defines composition via a condition on *descriptions*. If "complete description" is relative to a linguistic or conceptual scheme, then composition becomes mind-dependent. A being with a different conceptual apparatus might not require a singular term for the swarm, perhaps utilizing a plural quantifier that captures collective dispositions without reification. If composition varies with linguistic capacity, DIV collapses into a form of conventionalism. This is a heavy commitment: it suggests that whether objects exist depends on how we must speak about them, rather than how the world is structured independently of us.

  Alternatively, the proponent might argue that the "cannot" in DIV is metaphysical, not linguistic. They might claim that if collective dispositions exist, the world *forces* any adequate language to include a singular term. Yet this raises the inverse problem: why should the structure of language track the structure of parthood so perfectly? If the irreducibility is ontological, DIV risks being an epistemological proxy for a deeper metaphysical fact. It tells us how to *detect* composition, but not what composition *is*.

  Ultimately, DIV delivers the right verdicts on the test cases only because the cases are stipulated to match our linguistic intuitions about reducibility. It succeeds extensionally but fails intensionally. By making composition contingent on descriptive necessity, the view conflates semantic indispensability with ontological commitment. Unless the proponent can demonstrate that descriptive irreducibility is a reliable guide to mind-independent structure without collapsing into circularity, DIV offers a pragmatic rule for counting objects rather than a metaphysical solution to the Special Composition Question. The view saves the phenomena of ordinary object talk but leaves the underlying ontology unresolved.

  ***

  **Marking Scheme (25 Marks)**

  | Grade Band | Marks | Required Moves | Note on Mistake Caught |
  | :--- | :--- | :--- | :--- |
  | **A** | 21–25 | Correctly applies DIV to both cases; explicitly distinguishes semantic indispensability from ontological ground; adjudicates the "dependence on descriptive resources" prompt by addressing conventionalism vs. metaphysical necessity. | Catch: Failing to distinguish semantic indispensability from ontological ground. |
  | **B** | 16–20 | Correctly applies DIV to both cases; identifies the intuitive success of the verdicts; addresses the descriptive resources prompt but treats the link between language and ontology as unproblematic. | Catch: Assuming the view's intuitive success guarantees metaphysical coherence. |
  | **C** | 11–15 | Applies DIV to cases with minor errors; identifies that the view links composition to description but fails to analyze the metaphysical cost or conventionalist implication. | Catch: Misapplying the stipulated conditions to the test cases. |
  | **D** | 6–10 | Attempts to address the cases but misunderstands the core criterion of DIV; offers little to no analysis of the descriptive resources constraint. | Catch: Fundamental misunderstanding of the composition relation. |
  | **F** | 0–5 | Fails to engage with the stipulated view or cases; irrelevant philosophical discussion. | Catch: Ignoring the specific constraints of the exam question. |
