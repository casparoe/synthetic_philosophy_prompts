answer: |-
  **The Scenario**

  Consider a messaging platform that screens outgoing posts for policy violations using five parallel, independently maintained filters. Each filter is designed to catch a different class of violation, but for the purpose of this analysis, we treat "failure" as a false positive: the filter incorrectly flags a legitimate message. Historical logs show that each filter flags exactly 10% of all legitimate traffic. The system fails catastrophically only if all five filters flag the same message simultaneously, triggering an automatic ban. A safety analyst, reviewing the logs, notes that the filters are built by different teams using different algorithms. Seeing no obvious common cause, she applies the standard heuristic: she multiplies the individual failure rates to estimate the risk of a simultaneous false positive.

  The underlying reality of the traffic, however, is structured. Legitimate messages fall into six mutually exclusive categories. Category Z (1% of traffic) contains a specific header pattern that triggers all five filters. Categories A through E (9% of traffic each) contain keywords specific to Filter 1 through Filter 5, respectively; a message in Category A triggers only Filter 1, a message in Category B triggers only Filter 2, and so on. The remaining 54% of messages are "clean" and trigger no filters. Because the categories are mutually exclusive, a message cannot be in Category A and Category B at the same time. The analyst does not know about these categories; she only sees the binary pass/fail output of each filter.

  **The Analysis**

  The analyst's argument proceeds in three steps. First, she establishes the marginal probability of failure for each component. From the logs, Filter 1 fails on Category Z (1%) and Category A (9%), totaling 10%. By symmetry, every filter has a failure probability of $0.1$. Second, she invokes the default assumption of independence. She writes: *"In the absence of specific information about correlation, the expectation of a product should be estimated as the product of the expectations."* **This is the step where the default does its work.** She calculates the estimated joint failure probability as $0.1 \times 0.1 \times 0.1 \times 0.1 \times 0.1 = 0.00001$ (one in one hundred thousand). Third, she concludes the risk is negligible.

  To verify her assumption, she runs a correlation audit on every pair of filters. For any two filters, say Filter 1 and Filter 2, she checks if the probability of them failing together equals the product of their individual failure probabilities.
  *   **General Reason:** The only time Filter 1 and Filter 2 both fail is when the message is in Category Z. Category Z occurs 1% of the time. Thus, the joint probability is $0.01$. The product of the marginals is $0.1 \times 0.1 = 0.01$. Since $0.01 = 0.01$, they are pairwise independent.
  *   **Specific Pair (1 & 2):** As above, intersection is Category Z (1%). Product is 1%. Match.
  *   **Specific Pair (1 & 3):** Intersection is Category Z (1%). Product is 1%. Match.
  Because the categories are symmetric, this holds for all 10 possible pairs. The audit comes back exactly clean: zero covariance across the board.

  However, the true probability of the joint failure is the probability of Category Z, which is $0.01$ (one in one hundred).
  *   **Analyst's Estimate:** $0.00001$
  *   **True Probability:** $0.01000$
  *   **Ratio:** $0.01 / 0.00001 = 1000$.

  The true risk is one thousand times higher than the heuristic estimate. The sample space is small enough to enumerate by hand. There are only seven distinct outcomes with non-zero probability:
  1.  **All Fail** (Category Z): Probability 0.01
  2.  **Only F1 Fails** (Category A): Probability 0.09
  3.  **Only F2 Fails** (Category B): Probability 0.09
  4.  **Only F3 Fails** (Category C): Probability 0.09
  5.  **Only F4 Fails** (Category D): Probability 0.09
  6.  **Only F5 Fails** (Category E): Probability 0.09
  7.  **None Fail** (Clean): Probability 0.54
  Sum: $0.01 + 5(0.09) + 0.54 = 0.01 + 0.45 + 0.54 = 1.0$. The math holds.

  The structural feature doing the work is the **disjointness of the private failure modes**. The "private" causes (Categories A–E) are mutually exclusive, which creates a strong negative correlation that exactly cancels the positive correlation introduced by the "common" cause (Category Z) when looking at pairs. This cancellation hides the dependency from a pairwise audit.

  **The Counterfactual**

  To see why the heuristic usually works, consider a variant system where the filters draw on private sources of variation that are truly independent. Suppose each filter flips a biased coin (10% chance of heads) for every message, unrelated to the message content or other filters. In this variant, the probability that all five coins come up heads is exactly $0.1^5 = 0.00001$. The pairwise audit would still pass (covariance zero), but now the joint probability matches the estimate. The heuristic is licensed here because the sources of variation are physically decoupled, not just statistically uncorrelated in pairs.

  **The Missing Assumption**

  The minimal additional assumption required to license the original conclusion is **Mutual Independence**, not just Pairwise Independence. Mutual independence requires that the probability of the intersection of *any* subset of events equals the product of their probabilities. A pairwise audit is structurally incapable of detecting the absence of this assumption because it integrates out higher-order interactions. Verifying mutual independence for five components would require checking $2^5 - 5 - 1 = 26$ distinct subset constraints, not just the 10 pairs. For a system of industrial size, verifying this is computationally and practically infeasible, which is why analysts rely on the pairwise default.

  **The Objection**

  A defender of the heuristic would argue: *"This example is rigged. The requirement that private failure modes be perfectly mutually exclusive (Categories A–E) is a knife-edge condition that no real physical system satisfies. In a real system, there would be some overlap between Category A and B, creating positive pairwise correlation that the audit would catch. Furthermore, a competent analyst reading the design documents would see that the filters share an input space and would not assume independence without testing for common causes."*

  **Assessment:** This objection lands significantly. The 1000x gap relies on an exact algebraic cancellation between the common cause and the disjoint private causes. If the private failure rates drifted by even 0.1%, or if the categories overlapped slightly, the pairwise correlation would become non-zero, and the audit would flag the system. Real-world systems are rarely this mathematically precise. However, the example succeeds in its specific goal: it demonstrates that a clean pairwise audit is not a logical guarantee of safety, even in a system with no adversarial intelligence or exotic physics. It proves that "uncorrelated" does not mean "independent," and that relying on the product rule without verifying mutual independence is a gamble, not a derivation.
