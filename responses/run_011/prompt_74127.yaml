  *The scenario*
  A Regional Health Authority must allocate a fixed budget between two existing patient cohorts: 100 Chronic Pain sufferers (Group A) and 1,000 General Surgery patients (Group B). The metric is expected Quality-Adjusted Life Years (QALYs) per person over five years. Outcome 1 funds a specialized pain clinic, securing higher baseline function for A but limiting surgical volume for B. Outcome 2 redirects funds to high-efficiency surgical units, expanding capacity for B but reducing supportive care for A. Both outcomes involve the same identified individuals; no new patients are created or excluded. Outcome 1 protects the vulnerable minority; Outcome 2 maximizes aggregate health output.

  *Verdicts and arithmetic*
  In Outcome 1, Group A receives 10 QALYs, Group B receives 20. Total wellbeing: $100(10) + 1,000(20) = 21,000$. In Outcome 2, Group A receives 9 QALYs, Group B receives 25. Total wellbeing: $100(9) + 1,000(25) = 25,900$. Specification 3 is met: total wellbeing rises significantly. Specification 4 is met: the worst-off (A) are strictly worse off (10 vs 9).
  Maximin ranks Outcome 1 better (minimum 10 > 9). Telic Egalitarianism ranks Outcome 1 better: the gap widens (10 vs 20 becomes 9 vs 25) and the floor drops.
  Prioritarianism uses $V = \sum \sqrt{w}$. Outcome 1 value: $100\sqrt{10} + 1,000\sqrt{20} \approx 316 + 4,472 = 4,788$. Outcome 2 value: $100\sqrt{9} + 1,000\sqrt{25} = 300 + 5,000 = 5,300$. Specification 5 is met: Prioritarianism ranks Outcome 2 better. The weighted gains of the many outweigh the weighted losses of the few.

  *Robustness*
  The Prioritarian verdict holds for any power function $f(w) = w^c$ where $0.5 \le c < 1$. Even with strong concavity ($c=0.5$), the 10:1 population ratio ensures the aggregated priority-weighted gains of B swamp A's losses. For Egalitarianism, any standard inequality measure (Atkinson, Gini) with moderate inequality aversion prefers Outcome 1 due to the lower minimum and wider dispersion. Maximin is parameter-free here; the drop in the absolute minimum is decisive. This is not a knife-edge case. The total QALY gain (4,900) vastly exceeds the loss (100), requiring extreme prioritarian concavity to flip the verdict. The case works at moderate values of concavity and inequality aversion, demonstrating a structural divergence rather than a calibration artifact.

  *What does the work*
  The divergence is generated by the population disparity combined with aggregation. Prioritarianism sums weighted wellbeing; thus, a large number of better-off people can outweigh a small number of worst-off people, even when the latter receive higher marginal moral weight. If we remove this feature by equalizing group sizes (A=100, B=100), the Prioritarian margin narrows drastically. With equal sizes, Outcome 1 yields $\approx 763$ priority points and Outcome 2 yields $800$. While Outcome 2 still wins with square-root weighting, introducing slightly higher concavity ($c=0.4$) flips the verdict to Outcome 1. Thus, the large population of better-off individuals is the structural engine allowing Prioritarianism to override the worst-off's loss.

  *The prioritarian's counterattack*
  A prioritarian might argue the verdict depends on the wellbeing scale's zero point. Prioritarianism is not invariant to affine rescaling ($w' = w + k$) because concavity changes with absolute levels. Testing this: if we shift the zero up ($w' = w + 100$), the function becomes more linear, approximating Utilitarianism, which prefers Outcome 2. The verdict holds. If we shift down ($w' = w - 8$), concavity increases. Outcome 1 yields $100\sqrt{2} + 1,000\sqrt{12} \approx 3,605$; Outcome 2 yields $100\sqrt{1} + 1,000\sqrt{17} \approx 4,223$. The verdict survives. The implication is that this is not a numbering artifact. The view genuinely permits harming the worst-off if the many gain enough, because it treats the loss as a negative weight in a sum, not a relational complaint. The scale sensitivity confirms Prioritarianism cares about absolute levels, not relative standing, but does not invalidate the objection.

  *My verdict*
  This case demonstrates that Prioritarianism escapes the leveling-down objection only by collapsing toward the utilitarian logic it sought to refine. It sacrifices the egalitarian's core protection: the inviolability of the worst-off's claim against being harmed for others' gain. By allowing the aggregated weighted gains of the better-off to override the losses of the worst-off, it abandons the structure of a "complaint" that persists regardless of total utility. This distinguishes it sharply from Maximin (which vetoes Outcome 2) and Telic Egalitarianism. It is not unfair to the view; it reveals that Priority View is weighted utilitarianism, not egalitarianism lite. It buys immunity to leveling-down by accepting that the worst-off can be sacrificed for the greater weighted good.
