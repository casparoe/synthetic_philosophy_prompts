          *   "Meter" is an artificial unit. It has no hidden essence. It is *purely* reference-fixed.
      *   **Misconception 3: Changing A Posteriori to A Priori.**
          *   You cannot change a metaphysical fact by definition. You can only change the *sentence* used to express it.
          *   Pre-1983: "Light speed is $X$" = Empirical discovery about the relationship between two independent standards (time and length).
          *   Post-1983: "Light speed is $X$" = Stipulation of how we *use the word* "meter".
