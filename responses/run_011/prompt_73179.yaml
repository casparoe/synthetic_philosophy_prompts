answer: |-
  It is a genuine pleasure to correspond with someone who has actually lived the history that Kripke only theorized about. You are standing on a rare piece of ground: you spent decades measuring the contingent relationship between physical constants and human conventions, and now you are reading the philosophy that attempts to categorize exactly that distinction.

  Dale, the tax attorney, is half-right: it *is* bookkeeping. But you are also right to reject his dismissal. Bookkeeping changes the epistemic status of the *ledger*, even if it doesn't change the *assets*. Your confusion stems from a subtle but critical conflation of two different kinds of necessity: **metaphysical necessity** (how the world must be) and **semantic necessity** (how our language must be, given our rules).

  Here is where the reasoning goes wrong, and why the "Water" analogy doesn't quite hold.

  ### 1. The Pre-1983 Proposition Was Contingent, Not Necessary
  Your first premise is the pivot point: *Before 1983, "light travels 299,792,458 meters per second" looks like a clean case of the necessary a posteriori.*

  I suggest it was not necessary at all. It was **contingent a posteriori**.

  Before 1983, the meter was defined by the orange-red emission line of Krypton-86. The second was defined by the cesium-133 hyperfine transition. These are two independent physical phenomena. There is no metaphysical necessity linking the wavelength of Krypton-86 to the speed of light. In a different possible world, the physics of Krypton could be slightly different while electromagnetism remains the same, or vice versa.

  When you were measuring $c$ in the 1970s, you were not measuring a metaphysical necessity. You were measuring a **ratio** between two independent physical standards. You were asking: "How many Krypton-wavelengths does light traverse in 1/299,792,458 of a cesium-second?" That number could have been otherwise. It was an empirical discovery about the relationship between specific atomic transitions and the propagation of light.

  Therefore, the 1983 CGPM decision did not convert a *necessary a posteriori* truth into a *necessary a priori* one. It converted a *contingent a posteriori* truth (the ratio of $c$ to the Krypton meter) into a *necessary a priori* truth (the definition of the word "meter").

  ### 2. Kripke's Meter Bar vs. The 1983 Redefinition
  Kripke actually discusses the meter in *Naming and Necessity*, but he uses the example of the Standard Meter Bar in Paris (Stick S). He asks: Is the statement "Stick S is one meter long at $t_0$" necessary or contingent?

  Kripke argues it is **contingent a priori**.
  *   **A Priori:** If "one meter" is *defined* as the length of Stick S, you know it without measurement.
  *   **Contingent:** Stick S could have been heated or cooled; it could have expanded or contracted. The *length* is a physical property of the stick, which is contingent.

  The 1983 redefinition is slightly different. By fixing $c$, the CGPM made the statement "$c = 299,792,458 \text{ m/s}$" **necessary a priori**. But this is a trivial, linguistic necessity. It is true in all possible worlds *where our language conventions hold*, not because the universe forces light to travel at that speed relative to a Krypton atom, but because we decided that the word "meter" will henceforth mean "the distance light travels in 1/299,792,458 seconds."

  The committee did not legislate metaphysics. They legislated syntax. They didn't make the speed of light necessary; they made the *sentence* analytic.

  ### 3. Why You Couldn't Do This with Water
  This brings us to your excellent question: *Why couldn't we have stipulated in 1900 that "water" just means H2O?*

  The difference lies in **Natural Kinds vs. Human Conventions**.

  *   **The Meter:** The meter is a human artifact. It has no hidden essence. Its entire existence is dependent on our stipulation. When we changed the definition from Krypton to $c$, we didn't lose contact with "the meter." There is no "real meter" hiding in the universe waiting to be discovered. We just updated the reference-fixing description for our own convenience.
  *   **Water:** Water is a natural kind. Its essence (H2O) is mind-independent. In 1900, the word "water" rigidly designated whatever stuff in the actual world had the same underlying structure as the liquid in our lakes and taps. We didn't know that structure was H2O.

  If the Royal Society in 1900 had voted: "Henceforth, 'water' shall *mean* H2O," they would have failed to capture the reference of the word "water."
  1.  **Epistemic Limit:** They didn't know what H2O was. You can't stipulate a definition using terms you don't possess.
  2.  **Rigidity:** "Water" picks out the *stuff*, not the *description*. If they had stipulated "Water = the clear, drinkable liquid in the sink," and it turned out that stuff was XYZ (like on Twin Earth), the stipulation would have been wrong about the *kind*.
  3.  **Discovery vs. Stipulation:** The truth "Water is H2O" is necessary a posteriori because we had to go out and *find* the essence of the stuff we were already talking about. With the meter, we *create* the essence by talking about it.

  ### 4. Is "Necessary A Posteriori" Just a Temporary Filing Cabinet?
  You asked: *Is the necessary a posteriori just a temporary filing cabinet for necessities we haven't gotten around to defining yet?*

  No. It is a permanent category for **identities between rigid designators discovered empirically.**

  *   **Hesperus is Phosphorus:** We couldn't define this away. We had to look at the sky.
  *   **Water is H2O:** We couldn't define this away. We had to do chemistry.
  *   **Heat is Mean Molecular Kinetic Energy:** We had to do thermodynamics.

  In these cases, we have two names for the same thing, fixed by different modes of presentation. The identity is metaphysical (necessary), but our access to it is empirical (a posteriori).

  In the case of the 1983 Meter, we did not discover an identity between two independent rigid designators. We **collapsed** one designator into the other. We said, "Stop using 'Krypton wavelength' to fix the reference of 'meter'. Use '$c$' instead."

  ### Summary
  Your intuition that something profound happened in 1983 is correct, but the philosophical categorization needs adjustment.

  1.  **Pre-1983:** "$c = 299,792,458 \text{ m/s}$" was a **contingent a posteriori** measurement of the ratio between light speed and the Krypton standard.
  2.  **Post-1983:** "$c = 299,792,458 \text{ m/s}$" is a **necessary a priori** definition of the term "meter."
  3.  **The Change:** The committee did not change the modal status of a metaphysical truth. They changed the linguistic rules so that a previously contingent measurement sentence became an analytic definition.
  4.  **Water vs. Meter:** You can redefine the meter because the meter is a convention. You cannot redefine water because water is a natural kind with an essence independent of our conventions.

  Dale is right that it's bookkeeping, but you are right that bookkeeping changes what is knowable *without evidence*. It changes the *sentence* from something requiring a laser interferometer to something requiring a dictionary. But it doesn't change the *world*. The light didn't start traveling differently in 1983; we just stopped pretending the Krypton atom was the boss of the meter.

  You didn't live through the punchline of Kripke's necessary a posteriori; you lived through the moment metrology decided to stop chasing contingent ratios and start fixing constants. Kripke would say you didn't find a necessary truth; you built a better cage for a contingent one.
