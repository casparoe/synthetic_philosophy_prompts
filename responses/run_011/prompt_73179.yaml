          *   *Kripke's Innovation:* These categories cross-cut. There are necessary a posteriori truths (e.g., "Water is H2O") and contingent a priori truths (e.g., "The standard meter bar is one meter long" - *wait, check this*).
      *   **The Meter Example in *Naming and Necessity*:** Kripke *specifically* discusses the meter. He uses the "Standard Meter Bar in Paris" (S).
          *   Statement: "Stick S is one meter long at $t_0$."
          *   Kripke's View: If "one meter" is *defined* by S, then this statement is known a priori (by stipulation). However, Kripke argues it is *contingent*. S could have been longer or shorter under different physical conditions.
          *   *Crucial Point:* Kripke distinguishes between fixing the *reference* and giving the *meaning*.
      *   **The User's Specific Case (Speed of Light):**
          *   Pre-1983: Meter defined by Krypton wavelength. $c$ was measured. "c = 299,792,458 m/s" was contingent (could have been otherwise physically) OR necessary a posteriori? Actually, in the old SI, $c$ was a measured physical constant. It was contingent that light traveled at that speed relative to the Krypton meter.
          *   Post-1983: Meter defined by $c$. "c = 299,792,458 m/s" is now true by definition.
      *   **The User's Confusion:** The user thinks the *metaphysical necessity* of the speed of light changed. It didn't. The *linguistic/conventional status* of the *sentence* changed.

  3.  **Address the Core Misconception:**
      *   **Misconception 1: The status of $c$ itself.**
          *   Is the speed of light *metaphysically necessary*? In modern physics, yes (in vacuum). But Kripke's point isn't about physics; it's about reference.
          *   Pre-1983: The sentence "$c = 299,792,458$ m/s" was a *contingent* empirical claim (because the meter was independent of $c$). It wasn't necessary a posteriori; it was contingent a posteriori.
          *   Post-1983: The sentence is *necessary* (in a trivial, linguistic sense) and *a priori*. But this is a "contingent a priori" scenario flipped? No, it's a definition.
      *   **Misconception 2: "Water is H2O" vs. "Meter is distance light travels..."**
