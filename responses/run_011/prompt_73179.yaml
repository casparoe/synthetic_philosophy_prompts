          *   Post-1983 Proposition: The length unit called "meter" is defined such that $c$ is $X$. (Necessary/Analytic).
      *   *Dale the Attorney:* Dale is half-right (it is bookkeeping), but wrong that it doesn't change epistemology. It changes the epistemic status of the *sentence*, not the *fact*.
      *   *The "Necessary A Posteriori" Bucket:* It is not a temporary filing cabinet. It is for identities between rigid designators where the identity is discovered (Hesperus/Phosphorus, Water/H2O). The Meter/$c$ case is different because one of the terms ("meter") is non-rigid or stipulative in a way "water" is not. Actually, "meter" is a rigid designator of a length, but *which* length is fixed by convention.

  6.  **Final Structure:**
