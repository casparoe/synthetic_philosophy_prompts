prompt: |-
  I'm the type steward at a mid-size US logistics company — basically I'm the only person here whose job involves our corporate typeface. The family was drawn for us in the late 90s by a foundry that's since been absorbed twice, so there's no way to ask the original designer why anything looks the way it does; all we have is the fonts themselves and a 14-page brand PDF whose entire typographic guidance is "keep the humanist spirit." We get about twenty submissions a week: campaign headlines, product logotypes, hand-lettered stuff from agencies, one-off glyphs (a slashed zero for an annual report, an ampersand for a conference, Vietnamese diacritics for a new market), and occasional requests to "extend the family." Two junior designers do first-pass review and I sign off. They get maybe 15 minutes per submission, sometimes same-day because something's going to press, and they are good designers but not typographers. The complaint I keep hearing, from them and from the agencies we reject, is that the decisions feel arbitrary — people push back with some version of "look, it's obviously an a." And honestly they're right that it feels arbitrary, because what I do now is squint at a printout and consult my gut.

  Here's the thing I suspect we're getting wrong, and it's what I want the procedure to fix: I think we're collapsing two separate questions into one. The first is whether a mark is a legible member of its category at all — does it read as an 'a' to anyone, at what size, in what context, how much does it degrade. The second is whether it's *our* 'a' — whether it belongs to this family rather than to some other one. Those come apart constantly, and I want them separated explicitly, with the crossover cases handled rather than fudged. A related idea I'd like you to decide whether is actually usable or just pretty: there was an AI research project in the 90s (Hofstadter's group, the one that did Copycat) that tried to get a computer to invent new typefaces in the style of existing ones, and the way it framed style was not as a list of shapes but as a set of dials — how far the strokes lean, how heavy they are, how open or closed the bowls are, how terminals get cut, how much the round forms overshoot the baseline — so a letterform is a position in dial-space and a typeface is a neighborhood in it. If that framing helps, I'd like the procedure to use it: maybe part of a review is naming which dials the submission moved, and whether those are dials that carry our identity or dials nobody would notice. If it doesn't help, say so and tell me what to use instead. I'd also like something on the diagnostic-letters intuition — the sense that a few letters (the 'g', the 'a', the 'e', the 'R', the tail of the 'Q') seem to carry a family's identity while others could be swapped almost freely, and whether that's real or folklore.

  So: write me the decision procedure my juniors can actually run in fifteen minutes, as an ordered set of questions with, for each one, what counts as a sufficient answer and what evidence they attach to the ticket (a size test at whatever point sizes matter, side-by-side against the real family at matched sizes, a control word set, whatever you think works). Mark clearly which steps are close to objective and which are taste dressed up as a step — I don't need the taste removed, I need it labeled so we can argue about the right things. Tell me where the procedure just stops at "no," where it escalates to me because the question is really about brand strategy and not about letterforms, and give me some rule for how many identity-bearing deviations is too many, so we don't end up with either "any single deviation is fatal" or "it all averages out." Cover the case where the family has no precedent at all — a glyph nobody drew in 1997 — and say what to do when the answer depends on a feature you can only judge in context. I also want a realistic number for how often two trained reviewers should agree after following this, plus a cheap way to audit it, like a blind re-review of last quarter's decisions. Then run the whole thing on three live ones. One: a product logotype where every letter is convincingly from our family except the 'g', which has been redrawn with a closed double-bowl form that appears nowhere in our fonts, and the studio says it's for legibility on the app icon. Two: a regional office's hand-lettered wall sign in a bouncy semi-script where I genuinely cannot point to a single matching feature — wrong x-height to cap ratio, wrong slant, no shared terminals — and yet every person who walks past it, including me, says it feels like us, which annoys me. Three, and I know I won't like the answer: our big anniversary campaign, already printed and shipped in three markets, where the agency added an unauthorized calligraphic display cut to the family, it's honestly gorgeous, it's completely on-strategy, and my CMO has already put it in the CEO's deck — I want the procedure to give whatever answer it gives, including if that answer is a flat no or "this isn't your call to make," and I want a sentence for how to say it out loud. Finally, be straight with me about what this procedure cannot do and where it will misfire, especially the failure mode where it quietly becomes "does the reviewer like it" with extra steps. Please write the whole thing in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User Role:** Type Steward at a mid-size US logistics company. Sole authority on the corporate typeface.
      *   **Context:** Typeface drawn in late 90s, foundry gone, no designer access. Brand guidelines are vague ("keep the humanist spirit").
      *   **Workflow:** 20 submissions/week. 2 junior designers (good designers, not typographers) do first pass (15 mins each). User signs off.
      *   **Problem:** Decisions feel arbitrary ("it's obviously an 'a'"). Need to separate *legibility/categorization* (is it an 'a'?) from *identity* (is it *our* 'a'?).
      *   **Specific Ideas to Evaluate:**
          *   Hofstadter-style "dial-space" (parameters like stroke lean, weight, terminal cuts).
          *   "Diagnostic Letters" intuition (g, a, e, R, Q carry identity).
      *   **Deliverables:**
          *   A 15-minute decision procedure (ordered questions, sufficient answers, evidence required).
          *   Labeling of objective vs. subjective steps.
          *   Escalation rules (when to say "no" vs. when to escalate to Steward).
          *   Rule for deviation limits (how many identity deviations are too many).
          *   Handling new glyphs (no precedent).
          *   Context-dependent features.
          *   Inter-rater reliability target & audit method.
          *   Three live case studies (Logotype 'g', Hand-lettered sign, Unauthorized anniversary campaign).
          *   Honest limitations/failure modes.
      *   **Tone:** Professional, direct, American English, pragmatic (not academic fluff).

  2.  **Evaluate the "Dial-Space" & "Diagnostic Letters" Concepts:**
      *   *Dial-Space:* This is actually very usable for non-typographers. It turns "does it feel right?" into "which parameters changed?" It creates a vocabulary for disagreement. I should incorporate this as the "Identity Audit."
      *   *Diagnostic Letters:* This is typographic folklore but grounded in reality. Certain characters (two-story 'g', single-story 'a', tail of 'Q') are high-entropy markers in type design. I should validate this but warn against treating it as absolute law (context matters).

  3.  **Drafting the Procedure (The "Type Gate Protocol"):**
      *   *Goal:* 15 minutes max.
      *   *Structure:* Funnel approach. Kill the obvious failures first, then assess identity, then escalate nuances.
      *   *Step 1: Legibility & Category (Objective).* Is it an 'a'? Is it readable at target size?
      *   *Step 2: The Dial Audit (Semi-Objective).* Use the Hofstadter concept. Identify shifted dials.
      *   *Step 3: Diagnostic Characters (Subjective/Heuristic).* Check the "identity carriers."
      *   *Step 4: Deviation Count (Rule-based).* How many dials moved?
      *   *Step 5: Escalation.* When does it go to the Steward?

  4.  **Refining the Steps & Evidence:**
      *   Need specific tests. "Squinting" is out. "Print at 6pt" is in.
      *   Need to label "Taste" vs. "Fact."
      *   *Deviation Rule:* "Three Strikes" or "One Critical Strike"? A single critical identity marker (like the 'g' structure) changing is usually fatal. Minor terminal tweaks might be okay. Let's propose a weighted system: Critical Features vs. Adjustable Parameters.

  5.  **Addressing the Specific Cases:**
      *   *Case 1 (Logotype 'g'):* Closed double-bowl vs. existing structure. This is a structural change, not a dial tweak. Likely a "No" or "Escalate with Warning."
      *   *Case 2 (Hand-lettered Sign):* No matching features, but "feels like us." This is the "Spirit" vs. "Letter" conflict. The procedure needs to allow for "Vibe Match" escalation.
      *   *Case 3 (Anniversary Campaign):* Already printed, CMO approved, unauthorized. The procedure must acknowledge political reality. It's not a type decision anymore; it's a brand governance decision. The answer isn't "fix the font," it's "document the exception."

  6.  **Inter-Rater Reliability & Audit:**
      *   Realistic agreement rate for 15-min review by non-typographers? 80% is optimistic. 70% is realistic.
      *   Audit: Random sample of 10 tickets/quarter, reviewed blind by the Steward.

  7.  **Limitations & Failure Modes:**
      *   Bureaucracy creep.
      *   "Checklist mentality" overriding actual vision.
      *   The "Vibe" problem (Case 2) is hard to codify.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the difficulty. Validate the "two questions" theory.
      *   *The Dial Concept:* Explicitly adopt it. It gives juniors vocabulary.
      *   *Diagnostic Letters:* Confirm validity but limit scope.
      *   *The Procedure:* Break it down minute-by-minute.
      *   *The Cases:* Apply the procedure rigorously.
      *   *The "No":* Be honest about the Anniversary Campaign.

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 15 minutes enough for a dial audit?
      *   *Fix:* Provide a pre-made checklist of dials so they don't have to invent them.
      *   *Critique:* Is the Anniversary Campaign answer too harsh?
      *   *Fix:* It needs to be politically savvy. Don't say "tear it down." Say "Grandfather this, but don't let it become the new normal."
      *   *Critique:* Did I answer the "new glyph" question?
      *   *Fix:* Add a specific step for "Unprecedented Glyphs" (interpolation vs. analogy).

  10. **Final Polish:** Ensure American English spelling/terminology. Check tone (authoritative but collaborative). Ensure all constraints of the prompt are met. (e.g., "write the whole thing in American English", "ordered set of questions", "evidence attach").

  *(Self-Correction on the "Dial" concept)*: The prompt asks me to decide if it's usable. It *is* usable, but only if simplified. I shouldn't ask juniors to measure overshoot in units. I should ask them to identify *which* dials moved (e.g., "Terminal Style," "Contrast Axis"). I will validate this approach.

  *(Self-Correction on Diagnostic Letters)*: It is real, not folklore. High-frequency characters with unique structures (g, a, R) define the "genus" of the typeface. I will confirm this.

  *(Self-Correction on Case 3)*: The prompt asks for "a sentence for how to say it out loud." I need to make sure that's included.

  Let's assemble the document.cw
answer: |-
  **MEMORANDUM**

  **TO:** Type Steward
  **FROM:** Type Systems Consultant
  **SUBJECT:** Decision Procedure for Corporate Typeface Governance (The "Type Gate" Protocol)

  You are correct about the core problem: you are collapsing *legibility* (functional) with *identity* (brand). You are also correct that the "dial-space" framing is usable. In fact, it is necessary. It gives your junior designers a vocabulary to describe *why* something feels off without requiring them to have the original designer's intuition. It turns "I don't like it" into "The contrast axis has shifted from diagonal to vertical."

  Regarding "diagnostic letters": This is not folklore. In type design, certain characters carry higher entropy. The structure of a `g` or `R` defines the genus of the typeface; the structure of an `l` or `i` often does not. We will codify this.

  Below is the **Type Gate Protocol**. It is designed for a 15-minute review window. It separates objective function from subjective identity, labels the taste components, and provides escalation paths.

  ***

  ### PART 1: THE TYPE GATE PROTOCOL

  **Time Limit:** 15 Minutes hard stop.
  **Tools Required:** Printout of submission, printout of core family (Regular/Bold), loupe or 10x magnifier, "Dial Checklist" (see below).

  #### STEP 1: The Legibility & Category Gate (Minutes 0–3)
  *Goal: Determine if the mark functions as language.*
  *Nature: Mostly Objective.*

  **Q1: Does the character read as the intended glyph at the smallest intended application size?**
  *   **Test:** Print the submission at 100% scale of its smallest use (e.g., app icon, footer text). View from 18 inches.
  *   **Sufficient Answer:** Yes/No. If "No" (e.g., counters fill in, strokes vanish), reject immediately.
  *   **Evidence:** Attach the size test printout to the ticket.

  **Q2: Is the structural category correct?**
  *   **Test:** Compare the submission's basic anatomy to the core family. (e.g., If the family is sans-serif, is this sans-serif? If the family uses a two-story `a`, does this use a two-story `a`?)
  *   **Sufficient Answer:** Yes/No.
  *   **Evidence:** Side-by-side crop of the submission vs. core family at matched x-height.
  *   **Stop Rule:** If the answer is **No** (e.g., they swapped a single-story `a` into a two-story `a` family), mark as **CRITICAL DEVIATION** and proceed to Step 3. Do not reject yet; structural swaps can be strategic.

  #### STEP 2: The Dial Audit (Minutes 3–10)
  *Goal: Quantify the stylistic drift.*
  *Nature: Semi-Objective (Observation is fact; weight of importance is taste).*

  Use the **Dial Checklist**. The reviewer must identify which dials have been moved compared to the core family.

  **The Dial Checklist:**
  1.  **Weight/Contrast:** Is the stroke thickness ratio changed?
  2.  **Axis:** Has the stress angle shifted (e.g., from humanist diagonal to geometric vertical)?
  3.  **Terminals:** How do the strokes end? (Flat, beaded, tapered, angled?)
  4.  **Proportion:** Is the x-height to cap-height ratio altered?
  5.  **Apertures:** Are the openings (in `c`, `e`, `s`) more open or closed?
  6.  **Curvature:** Are the curves geometric (compass-drawn) or humanist (variable curvature)?

  **Q3: Which dials have moved?**
  *   **Sufficient Answer:** List the specific dials (e.g., "Terminals changed from flat to tapered; Apertures closed by approx. 15%").
  *   **Evidence:** Annotated overlay showing the difference.

  **Q4: Are the moved dials "Identity Carriers"?**
  *   **Guidance:** In our specific family (late 90s humanist), the **Terminals** and the **Axis** are high-identity. **Weight** is low-identity (we have a range).
  *   **Sufficient Answer:** Yes/No for each moved dial.
  *   **Evidence:** Reviewer notes referencing the Brand PDF "humanist spirit" clause.
  *   **Taste Label:** This step is **Taste**. It relies on the reviewer's calibration of what makes *our* font look like *our* font.

  #### STEP 3: The Deviation Limit Rule (Minutes 10–12)
  *Goal: Prevent death by a thousand cuts.*
  *Nature: Rule-Based.*

  **The Rule of Three:**
  1.  **One Critical Structural Change** (e.g., changing the `g` structure, changing the `R` leg logic) = **ESCALATE**. (Do not approve).
  2.  **Two Identity Dial Shifts** (e.g., Terminals + Axis) = **ESCALATE**.
  3.  **One Identity Dial Shift + Minor Contextual Need** (e.g., Terminals shifted for legibility at 8pt) = **APPROVE WITH NOTE**.
  4.  **Non-Identity Dial Shifts Only** (e.g., Weight adjustment) = **APPROVE**.

  **Q5: Does the submission exceed the Deviation Limit?**
  *   **Sufficient Answer:** Pass/Fail based on the Rule of Three.
  *   **Evidence:** Tally sheet of deviations.

  #### STEP 4: Context & Precedent (Minutes 12–15)
  *Goal: Handle edge cases.*
  *Nature: Strategic.*

  **Q6: Is this a glyph with no precedent (e.g., Vietnamese diacritics, new currency symbol)?**
  *   **Procedure:** Do not compare to existing glyphs. Compare to the *Dial Settings* of existing glyphs. Construct the new glyph using the family's average dial settings.
  *   **Action:** If constructed via interpolation of existing dial settings, **APPROVE**. If invented anew, **ESCALATE**.

  **Q7: Is the deviation context-dependent? (e.g., a wall sign viewed from 50 feet)**
  *   **Procedure:** Legibility at distance trumps dial fidelity.
  *   **Action:** If the deviation is proven to aid legibility at the specific distance/medium, **APPROVE WITH NOTE**. If aesthetic only, apply Rule of Three.

  ***

  ### PART 2: ESCALATION & GOVERNANCE

  **When to Escalate to Steward:**
  1.  Any **CRITICAL DEVIATION** in Step 1 (Structural Category).
  2.  Any submission triggering the **Rule of Three** (Escalate path).
  3.  Any submission where the "Vibe" contradicts the "Dials" (See Case 2 below).
  4.  Any request to add a new weight or style to the family (e.g., "Extend the family").

  **Inter-Rater Reliability:**
  *   **Target:** 75% agreement between the two junior designers on Pass/Fail/Escalate.
  *   **Reality Check:** If they agree 100% of the time, they are colluding or the rules are too loose. If they agree <60%, the "Taste" steps are uncalibrated.
  *   **Audit Method:** Once per quarter, you (Steward) blindly re-review 10 random tickets from the previous quarter (5 Approved, 5 Rejected). If your decision differs from the juniors' on more than 2 tickets, hold a 1-hour calibration session to review the "Dial Checklist" definitions.

  ***

  ### PART 3: LIVE CASE RUN-THROUGHS

  Here is how the protocol handles your three specific scenarios.

  #### CASE 1: The Product Logotype (The `g` Problem)
  *   **Submission:** Logotype. All letters match except `g`. `g` is closed double-bowl; family uses open single-story.
  *   **Step 1 (Legibility):** Pass. It reads as a `g`.
  *   **Step 1 (Category):** **CRITICAL DEVIATION.** Structural category changed (single-story to double-story).
  *   **Step 2 (Dials):** Structure dial moved.
  *   **Step 3 (Rule of Three):** One Critical Structural Change = **ESCALATE**.
  *   **Verdict:** **Do Not Approve.**
  *   **Reasoning:** The `g` is a diagnostic letter. Changing its skeleton changes the genus of the typeface. Legibility on an app icon is a valid concern, but it must be solved by tweaking the *existing* `g` (opening the counter, thickening the stroke), not swapping the skeleton.
  *   **Action:** Return to agency. Instruction: "Maintain the single-story skeleton. Adjust weight/counter for legibility."

  #### CASE 2: The Regional Wall Sign (The "Vibe" Problem)
  *   **Submission:** Hand-lettered semi-script. No matching dials (x-height, slant, terminals all differ).
  *   **Step 1 (Legibility):** Pass.
  *   **Step 1 (Category):** **CRITICAL DEVIATION.** (Script vs. Humanist Sans).
  *   **Step 2 (Dials):** All dials moved.
  *   **Step 3 (Rule of Three):** Exceeds limit. **ESCALATE**.
  *   **Step 4 (Context):** Viewed from distance. Hand-lettered.
  *   **Verdict:** **ESCALATE TO STEWARD.**
  *   **Reasoning:** The protocol correctly flags this as a failure on dials. However, this is the "Vibe vs. Letter" conflict. The juniors cannot solve this. It feels like "us" because the *energy* matches, even if the *geometry* doesn't.
  *   **Steward Action:** You must approve this as a **Brand Exception**. The protocol saves the juniors from having to justify "why this script matches our sans." They escalate it; you use your authority to validate the "spirit" over the "letter."
  *   **Audit:** Log this as a "Spirit Match Exception." If more than 3 occur per year, the Brand PDF needs rewriting.

  #### CASE 3: The Anniversary Campaign (The Political Problem)
  *   **Submission:** Unauthorized calligraphic display cut. Printed. Shipped. In CEO deck.
  *   **Step 1–3:** Fails all technical gates. It is a different typeface entirely.
  *   **Verdict:** **PROCEDURE HALT.**
  *   **Reasoning:** The Type Gate Protocol governs *future* production. It cannot govern *shipped* goods without causing brand damage that outweighs the typographic sin.
  *   **Action:** **Grandfather Clause.**
  *   **The Sentence:** "This asset is approved as a one-time brand exception for the Anniversary Campaign only; it does not set a precedent for future typography and cannot be added to the asset library."
  *   **Why:** You are the Type Steward, not the Brand Dictator. If the CMO and CEO have blessed it, fighting it now makes you an obstacle to business, not a guardian of quality. You document the deviation to prevent it from becoming the new normal.

  ***

  ### PART 4: LIMITATIONS & FAILURE MODES

  Be straight with yourself about where this breaks.

  **1. The "Checklist Mentality" Failure**
  *   **Risk:** Juniors will start treating the Dial Checklist as a recipe. They will try to "tweak the terminals" to make a bad design pass the checklist, rather than rejecting the design.
  *   **Mitigation:** In your calibration sessions, emphasize that the Checklist is for *diagnosis*, not *surgery*. If the diagnosis is "Terminal Mismatch," the cure is usually "Reject," not "Fix the terminals."

  **2. The "Spirit" Blind Spot**
  *   **Risk:** As seen in Case 2, some things match the brand spirit without matching the dials. The protocol is biased toward geometry. It will reject "soulful" work that is technically divergent.
  *   **Mitigation:** The Escalation path is the safety valve. If the juniors feel it "feels right" but the dials say "no," they must escalate. Do not punish them for escalating "feeling" cases.

  **3. The "Taste" Disguise**
  *   **Risk:** Step 2, Q4 (Are the moved dials Identity Carriers?) is subjective. One junior might think Terminals are critical; another might think Proportion is critical.
  *   **Mitigation:** You need a **Reference Sheet**. A single page showing the core family with the "Identity Carriers" highlighted in red. (e.g., "The cut on the `C` terminal is sacred. The width of the `O` is flexible."). Without this visual anchor, the "Taste" step is just opinion.

  **4. The "New Glyph" Trap**
  *   **Risk:** When creating a Vietnamese `đ` or a new currency symbol, juniors might average the dials too literally, resulting in a Frankenstein glyph that fits the math but not the rhythm.
  *   **Mitigation:** For new glyphs, require a "Rhythm Test." The new glyph must be printed alongside `n`, `o`, and `v`. If it disrupts the color/texture of that string, it fails, regardless of dial accuracy.

  ### FINAL IMPLEMENTATION NOTE

  This procedure will not stop every bad decision. It will not stop a CMO from overriding you. It will not capture the "soul" of the 1997 designer.

  What it *will* do is stop the "obviously an a" arguments. It forces the conversation to be about **which dials moved** and **whether that deviation is permitted**, rather than **whether the reviewer likes it**.

  Print the Dial Checklist. Highlight the Identity Carriers on a reference sheet. Train the juniors on the Rule of Three. Then, let them reject the work so you don't have to.
