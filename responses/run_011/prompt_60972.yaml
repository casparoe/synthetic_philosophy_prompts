answer: |-
  **Mark: 19/25**

  **Comments for the Script:**

  **Part (a): The Principal Principle & Admissibility (7/8)**
  *   **Solid:** Your formal statement $C(A | X \& E) = x$ is correct and standard. You correctly identify the time-relativity of chance and the single-case requirement. This shows you understand the *setup*.
  *   **Imprecise:** You define admissibility heuristically ("evidence about the past"). Lewis explicitly warns this is a guide, not the definition. The technical definition is that $E$ is admissible with respect to $X$ iff $E$ is probabilistically independent of $A$ given $X$.
  *   **Cost:** -1 mark.
  *   **Fixability:** This is a patchable definition error. A sentence clarifying that "past-ness" is the typical *feature* of admissible evidence, but independence is the *definition*, would fix it.
  *   **Solid:** Your explanation of *why* admissibility is needed (to avoid contradiction with known outcomes) is excellent.

  **Part (b): Substantivity & Metaphysics (5/8)**
  *   **Solid:** You correctly identify the PP as a bridge principle connecting distinct concepts (objective chance vs. subjective credence). You are right that it cannot be derived from probability axioms alone.
  *   **Wrong:** You claim Lewis is a "subjectivist about chance." This is a significant metaphysical error. Lewis is a *Humean* about chance (it supervenes on the mosaic of categorical events). He is a subjectivist about *credence*. While he defines chance *functionally* by the role it plays for credence, the *realizer* of that role is objective. Saying he is a subjectivist about chance suggests chance reduces to belief, which he explicitly denies.
  *   **Cost:** -3 marks.
  *   **Fixability:** This is not a one-sentence patch; it indicates a confusion about Lewis's Humean Supervenience. You need to distinguish between the *concept* of chance (defined by its role) and the *nature* of chance (the Humean mosaic).
  *   **Note:** You write "chance gets analysed in terms of the credences it ought to produce." This is the functional role. But concluding "so Lewis is a subjectivist about chance too" is the non-sequitur.

  **Part (c): The Bug & The New Principle (7/9)**
  *   **Solid:** You have a very clear grasp of the "undermining futures" problem. Your explanation of why the future can undermine the present chance hypothesis (by changing the mosaic upon which chances supervene) is accurate.
  *   **Vague:** Your description of the New Principle (NP) is slightly loose. Lewis doesn't just condition on the "theory of chance." The NP modifies the right-hand side to account for the chance of the theory of chance itself. Formally: $C(A | H_{tw} \& T_w) = Ch_{tw}(A | T_w)$. You imply we simply swap $X$ for $T$, but the conditionalization on the history ($H$) remains crucial.
  *   **Cost:** -2 marks.
  *   **Fixability:** Patchable. You need to show you know the NP involves conditionalizing the *chance* function on the theory of chance, not just changing the evidence base for the credence function.
  *   **Solid:** Correctly identifying the 1986 Postscript as the source.

  **TA-to-TA Note: Where you might be over-reading**
  I'd be careful about penalizing the Part (c) formulation too heavily. In a timed exam setting, "conditionalising on the theory of chance" is often accepted as shorthand for the New Principle, provided they name it correctly (which they did). If your seminar emphasized the formal derivation of the NP, keep the deduction. If you focused more on the *motivation* for the NP (the undermining problem), you might want to give them back 1 of those marks. The student clearly understands *why* the PP fails, which is the harder conceptual lift.

  However, the Part (b) error ("subjectivist about chance") is not pedantry. In a Lewis seminar, conflating Humean Supervenience with Subjectivism undermines the whole "Objective Chance" project. That deduction stands.

  **Summary for the Student:**
  "Strong grasp of the formalism and the undermining problem. However, be careful with Lewis's metaphysical labels: he is a subjectivist about *credence*, but a Humean/objectivist about *chance* (which supervenes on the mosaic). The PP bridges these; it doesn't collapse them. Also, refine your definition of admissibility (independence vs. past-ness) and the formal statement of the New Principle."
