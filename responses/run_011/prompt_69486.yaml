answer: |-
  This is a superb setup for a seminar. You have clearly done the reading, but Augustine is notoriously slippery on the boundary between "technical falsehood" and "moral deceit." If you walk in treating him like a modern analytic philosopher looking for logical loopholes, you will get eaten alive. If you treat him as a theologian of the *heart*, you will hold your ground.

  Here is the breakdown to fix your table, rule on the case, and prepare for cross-examination.

  ### 1. Corrections to Your Table
  Your table is about 90% accurate, but there are three nuances you must tighten up before Thursday, or a sharp classmate will catch you.

  *   **The Eight Grades (Crucial Correction):** You wrote that lying to the killer is "way down near the bottom." This is correct regarding *severity*, but you must be careful not to imply it is *permissible*. For Augustine, **all eight grades are sins.** Even the eighth grade (lying to save a life/chastity) is a *venial* sin, but it is still a sin. You cannot commit the 8th grade to avoid the consequences of telling the truth. He explicitly says we must suffer the temporal evil (death/defilement) rather than commit the spiritual evil (lying).
      *   *Fix:* Mark the 8th grade as "Least Punishable, Still Forbidden."
  *   **The Midwives & Rahab:** Your reading is correct. Augustine insists God rewarded their *benevolence* (mercy/hospitality), not their *mendacity*. He says the lie was "overlooked" or the sin was remitted due to their faith, not that the act was good.
      *   *Fix:* Ensure you say the lie remained a *fault* (*culpa*), even if the person was saved.
  *   **Jacob and Isaac:** You haven't mangled this, but be precise. Augustine doesn't say Jacob "tricked" him. In *Contra Mendacium*, he argues Jacob's statement ("I am Esau") was a *mystery* or *sacrament*. Jacob spoke the truth spiritually (he was the bearer of the birthright), though Isaac understood it carnally. Augustine uses this to show that Scripture *appears* to contain lies but doesn't actually license them.
      *   *Fix:* Don't present this as a "case he ruled on" in the same way as the others; present it as his hermeneutic defense of Scripture against the charge of lying.

  ### 2. The Ruling on the Armed Husband Case
  **Verdict:** The neighbor **sins**. Whether you classify it technically as a *mendacium* (lie) or *fallacia* (deceit) is a semantic trap; morally, it is forbidden. She must choose the second option (refusal to answer).

  **The Machinery (Why?):**
  You are wrestling with whether Augustine cares about the *proposition* (words) or the *intent* (heart).
  *   **The Rule:** *Voluntas fallendi* (The Will to Deceive).
  *   **The Text:** In *De Mendacio* (On Lying), Chapter 3 and Chapter 10, Augustine addresses exactly this. He argues that a person who speaks the truth *in order to deceive* is "lying in their heart" (*in corde mentitur*).
  *   **The Logic:** Speech is given by God to make known the thoughts of the heart (*enuntiatio*). If you use speech to conceal the thoughts of the heart—even by using technically true words—you are perverting the function of speech. You are creating a mismatch between what is in your mind (she is here) and what you intend to produce in the neighbor's mind (she is not here).
  *   **Implicature Warning:** Do **not** use the word "implicature." That is Grice (1975), not Augustine (400 AD). Augustine speaks of *significatio*. If you *signify* a falsehood, you lie. If you say "I haven't seen her since Tuesday" knowing the husband will understand "She is not here," you have signified "She is not here." The technical truth of the Tuesday claim is irrelevant if the *signification* is false.

  **Comparing the Options:**
  1.  **"I haven't seen her since Tuesday" (with intent to deceive):** Sinful. It violates the duty of charity toward the husband (you owe him truth, or at least non-deceit) and corrupts your own soul.
  2.  **"I will not answer" / Silence:** Clean. Augustine explicitly recommends this in *De Mendacio* regarding the murderer at the door. You owe the murderer no information that endangers the innocent. Silence protects the guest without lying to the husband.

  ### 3. Defense Under Cross-Examination
  Here is how to handle the specific challenges you anticipate.

  **Challenge A: "But the words were true! How is that a lie?"**
  *   **Response:** "For Augustine, the lie resides in the *will*, not just the syntax. In *De Mendacio* 10.24, he writes that he who utters truth with the will to deceive is lying in his heart. The sin is the *voluntas fallendi*. If I use true words to plant a false belief, I am betraying the covenant of human communication."

  **Challenge B: "Your classmate says the 8 grades allow weighing consequences. Saving a life outweighs a small lie."**
  *   **Response:** "That is a utilitarian reading, not an Augustinian one. Augustine's eight grades rank the *severity of the sin*, not the *licensure to commit it*. Even the 8th grade (saving a life) is forbidden. He says explicitly: 'We must not do evil that good may come.' The neighbor must risk the husband's violence rather than guarantee her own sin."

  **Challenge C: "Isn't this just mental reservation? The Church allows that later."**
  *   **Response:** "Later casuists (like the Jesuits) developed strict mental reservation. Augustine does not. For him, if the *intent* is to deceive the listener, the speaker is guilty. He prefers *ambiguity* (words that can truly mean two things) over *deceptive truth*, but even ambiguity is dangerous if the intent is to mislead. The neighbor's statement isn't ambiguous; it's designed to be misunderstood."

  ### 4. The Test Case to Distinguish the Rules
  You asked for a case to decide between the candidate rules (Heart-Mouth vs. Propositional Truth vs. Scalar Weighing).

  **Proposed Case:** *The Unbelieving Listener.*
  > A Christian is asked by a persecutor, "Are you a Christian?" The Christian is not a Christian (he is an infiltrator, like the Priscillianist case), but he wants to be thought a Christian to gain trust. He says, "I worship Christ," believing in his heart that he worships a false idol, but knowing the persecutor thinks Christ is God.
  > *Wait, that's too complex.*

  **Better Test Case:** *The True Statement, Failed Deception.*
  > A man knows his friend is hiding in the barn. A killer asks, "Is he in the barn?" The man says, "I saw him running toward the river." (This is false).
  > *No, that's a standard lie.*

  **The Winning Test Case:** *The True Statement, Known Truth.*
  > **Scenario:** A woman is hiding in your house. A killer asks if she is there. You say, "I have not seen her today." (True, she arrived yesterday). You intend for him to believe she is not there. However, the killer *already knows* she is there (he saw her enter). He is only asking to test your loyalty.
  > **Question:** Is your statement a lie/sin?
  > **Why this works:**
  > *   **Propositional Rule:** The words are true. No lie.
  > *   **Scalar Rule:** The consequence is null (he knows already). No harm, maybe permissible?
  > *   **Augustinian (Heart-Mouth) Rule:** **It is still a sin.** Your *will* was to deceive. The fact that the deception failed does not cleanse the will. Augustine argues the sin is in the *conatus fallendi* (attempt to deceive).
  >
  > If you can defend that this is still a sin for Augustine, you prove that the *Voluntas Fallendi* is the governing machinery, not the truth-value of the sentence or the success of the deception.

  ### 5. Summary for your Note Card
  *   **Verdict:** Neighbor sins. Must remain silent.
  *   **Key Principle:** *Voluntas fallendi* (Will to deceive) defines the sin, not just false propositions.
  *   **Key Phrase:** "Lying in the heart" (*in corde mentitur*).
  *   **Trap to Avoid:** Do not admit the 8th grade is permissible. Do not use "implicature."
  *   **Killer Argument:** Speech is for making known the heart. Using it to hide the heart is a violation of divine order, regardless of syntax.

  Good luck on Thursday. If you stick to the "theology of the heart" rather than "logic of propositions," you will sound like Augustine.
