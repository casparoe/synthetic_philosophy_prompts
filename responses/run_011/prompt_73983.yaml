answer: |-
  1. **Research Question and Scope**

  The primary research question for this chapter is meta-explanatory: Under what specifications does the Great Divergence question constitute a well-posed contrastive why-question? I am not asking why industrialization occurred, but rather determining the conditions under which a request for an explanation of industrialization is logically valid. Specifically, I investigate whether the standard formulation—"Why Europe (or Britain) rather than China?"—satisfies the pragmatic constraints required for contrastive explanation, namely that the fact and the foil must be values of a single variable across comparable units.

  In scope are the logical structures of the leading causal narratives in economic history and the philosophy of science literature on contrastive explanation. I will treat historical explanations as candidate answers to specific contrastive questions and evaluate the fit between the question asked and the answer provided. I will also assess the claim that causal overdetermination may render certain formulations ill-posed even when units and time indices are aligned.

  Out of scope is the generation of new historical evidence or the adjudication of which causal narrative is ultimately true. I will not argue that coal was more important than institutions, nor will I produce new quantitative reconstructions of wages or output. I set aside the question of whether the divergence is a real phenomenon versus a statistical artifact; I assume for the sake of argument that a divergence in productive capacity occurred, focusing solely on the validity of the questions used to explain it. This delimitation ensures the project remains a contribution to the philosophy of social science rather than a competing historical synthesis.

  2. **The Explanatory Gap**

  Existing answers leave the core question open not because of an evidential deficit, but because of a specification error. The literature typically treats the divergence as an empirical puzzle awaiting better data—more wage series, better property rights indices, or refined coal accessibility maps. My diagnosis is that the gap is structural. If the contrast class is ill-defined, no amount of data can resolve the explanation, because the target of explanation shifts beneath the evidence.

  Consider the unit mismatch. Comparing a kingdom (Britain) to a continental empire (China) treats heterogeneous aggregates as singular values of a variable. If "industrialization" is the variable, its value for "China" is an average over regions that diverge wildly from one another, whereas for "Britain" it is relatively uniform. An explanation citing national institutions may hold for the unit "Britain" but fail for the unit "China" simply because the latter unit does not function as a single causal agent. More data on Chinese provincial governance does not fix this; it merely highlights the mismatch.

  Similarly, explanandum slippage allows answers to scientific development to stand in for answers to industrial growth. A explanation for why Newtonian physics emerged in Europe does not necessarily explain why factory systems emerged in Britain, yet the literature often treats these as interchangeable. Finally, foil drift allows authors to shift the comparison class mid-argument—moving from "Europe vs. China" to "England vs. Yangzi Delta"—without adjusting the causal mechanism. Consequently, the debate appears cumulative when it is actually fragmented. The gap is not a lack of evidence about the world, but a lack of clarity about the logical structure of the questions we are asking of that evidence.

  3. **Method and Timeline**

  The project will proceed over four months, utilizing tools from the philosophy of science to audit the literature.

  **Month 1: Taxonomy Construction.** I will construct a taxonomy of well-posed formulations. Using the pragmatic account of contrastive explanation, I will define the necessary conditions for a valid divergence question: identical unit types (e.g., region vs. region), fixed time indices, and a stable explanandum variable (e.g., mechanization rate, not merely "science"). I will employ relevance relations to distinguish which contrasts are meaningful.

  **Month 2: Analytical Framework.** I will operationalize the audit using interventionist accounts of causation. I will define what counts as a difference-maker in this context: a factor such that manipulating it changes the outcome relative to the specific foil. I will also integrate accounts of overdetermination to test whether multiple sufficient causes render the contrastive question unanswerable. This apparatus is justified against alternatives because empirical synthesis cannot detect logical category errors, and formal modeling would require assumptions about variables that are currently ill-defined. Declaring the question meaningless is too nihilistic; the goal is repair, not dismissal.

  **Month 3: The Audit.** I will apply the taxonomy to prominent explanations (e.g., high-wage economy, institutional property rights, fiscal-military capacity). For each, I will identify the implicit contrast class and test it against the taxonomy. I will trace where foil drift occurs within single arguments.

  **Month 4: Synthesis and Overdetermination.** I will analyze cases where specifications are repaired but overdetermination persists. I will draft the chapter, integrating the taxonomy and audit results.

  This method is distinct from a case study because it evaluates the structure of argumentation across cases. It is distinct from model-based treatment because it analyzes natural language arguments and their logical commitments rather than constructing counterfactual simulations.

  4. **Proof of Concept: The Audit Row**

  To demonstrate feasibility, here is one worked row of the proposed audit table.

  *   **Candidate Explanation:** The High-Wage Economy Hypothesis.
  *   **Claim:** High labor costs relative to energy costs incentivized labor-saving mechanization.
  *   **Implicit Foil:** Low-wage economy.
  *   **Audit - Unit Match:** The explanation compares England (a region) to the Yangzi Delta (a region). This passes the unit mismatch test. However, if the foil is stated as "China" (the empire), it fails, as inland China had different factor prices than the Delta.
  *   **Audit - Explanandum:** The explanation targets mechanization in textiles. If the explanandum is widened to "scientific culture," the mechanism fails.
  *   **Audit - Foil Drift:** In some presentations, the foil shifts from "Yangzi Delta" to "Europe vs. Asia." The explanation holds for the former but is unsupported for the latter.
  *   **Verdict:** Well-posed only when restricted to "England vs. Yangzi Delta, 1750, Mechanization." Ill-posed when generalized to "Britain vs. China, Industrialization."
  *   **Repair:** Restrict the claim to the regional comparison.

  This row shows that the audit can distinguish between a locally valid explanation and a globally overstated one without evaluating the historical accuracy of the wage data itself.

  5. **Success and Failure Conditions**

  Success looks like a clarified debate where proponents of different theories recognize they are answering different well-posed questions, or that their questions require repair. The taxonomy should allow historians to locate their work within a specific logical formulation. The overdetermination analysis should clarify whether certain questions are unanswerable in principle due to causal redundancy.

  Failure, however, must be defined specifically to ensure rigor. First, the project fails if the audit reveals that prominent explanations already fix their foils explicitly and transparently. If the literature is already logically precise, my diagnosis is false. Second, failure occurs if every well-posed formulation collapses into one that has already been answered empirically. If repairing the units simply还原 s the question to a standard economic history puzzle with a known solution, the philosophical intervention adds no value. Third, the project fails if the diagnosis is merely a redescription that discriminates no hypotheses. If labeling a question "ill-posed" does not change which evidence is considered relevant or which hypotheses are ruled out, the distinction is verbal rather than substantive. I will monitor these conditions throughout Month 3; if the audit yields trivial results, I will pivot to emphasizing the overdetermination claim as the primary contribution.

  6. **Historian's Objection and Scope Assessment**

  A historian on the committee may object that practitioners know perfectly well what they mean and that this is a verbal quibble. They might argue that "China" is shorthand for "the economically advanced regions of China" and that insisting on precision impedes narrative flow. My response is that implicit coherence is not explicit validity. When policies or grand theories are built on these comparisons, the difference between "empire" and "region" is substantive, not verbal. Cross-disciplinary dialogue requires that the logical structure of claims be explicit, not merely understood by initiates.

  Regarding scope, a four-month chapter cannot solve the Great Divergence. It cannot determine whether institutions or geography were the true cause. Nor can it audit every text in the literature; I will limit the audit to five paradigmatic explanations. If the overdetermination analysis proves too complex for the timeline, I will cut it to ensure the taxonomy and audit are robust. The goal is not to finish the dissertation, but to establish the methodological foundation for the remaining chapters. This fellowship will secure the logical ground upon which the substantive historical philosophy will stand.
