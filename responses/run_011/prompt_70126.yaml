answer: |-
  This is a sophisticated methodological knot. You have correctly identified that the Browning/Goldhagen impasse is not merely a disagreement about facts (the empirical record is largely agreed upon) nor a simple disagreement about theory (both accept standard causal reasoning). It is a disagreement about the **mapping function** between observable behavior and unobservable mental states.

  You are asking for the specific epistemological configuration where two causal models predict the same data distribution, and the "instrument" used to measure the key variable (intent) lacks the resolution to distinguish between them.

  Per your instructions, I will not jump to the answer. I will brainstorm the candidate concepts from philosophy of science, measurement theory, and historiography, cull the red herrings, and then perform the carving to find the best fit.

  ### Phase 1: Brainstorming Candidate Concepts

  Here are the terms that surface when we scan the literature for "two theories, one dataset, no resolution":

  1.  **Underdetermination of Theory by Data (Duhem-Quine):** The general thesis that evidence is insufficient to determine which theory is true.
  2.  **Observational Equivalence:** Two distinct theoretical models generate identical predictions for all observable variables.
  3.  **Equifinality:** In systems theory, different initial conditions or mechanisms lead to the same end state.
  4.  **The Identification Problem:** From econometrics/causal inference; the inability to uniquely estimate model parameters from the available data.
  5.  **Construct Validity (specifically Discriminant Validity):** A measurement theory concept; does the measure distinguish between the construct of interest and other distinct constructs?
  6.  **Unfalsifiability (Popper):** A theory that cannot be logically contradicted by any possible observation.
  7.  **Incommensurability (Kuhn):** Two paradigms lack a common language or standard to judge between them.
  8.  **Theory-Ladenness of Observation:** The idea that what we "see" is influenced by our theoretical commitments.
  9.  **Lakatosian Protective Belt:** Adjusting auxiliary hypotheses to protect a "hard core" theory from refutation.
  10. **The Problem of Other Minds:** The philosophical limitation on knowing the internal states of others.
  11. **Abductive Tie (Inference to the Best Explanation):** When two explanations offer equal explanatory power.
  12. **Signal-to-Noise Ambiguity:** Disagreement over whether a datum is signal (meaningful) or noise (artifact).

  ### Phase 2: The Culling (Red Herrings vs. Near Misses)

  Now, let's be blunt. Many of these are red herrings for your specific case.

  **The Red Herrings:**
  *   **Unfalsifiability:** This is a common misdiagnosis. Neither Browning nor Goldhagen is unfalsifiable in the Popperian sense. If 50% of the battalion had refused, Goldhagen's "eliminationist antisemitism" thesis would be severely damaged. If the men had celebrated without distress, Browning's "moral conflict" thesis would crumble. The theories *could* be falsified; they just haven't been *by this specific data*. Do not use this term; it implies logical immunity, which you don't have here.
  *   **Incommensurability:** This suggests they are talking past each other using different vocabularies. They aren't. They agree on the definition of "compliance," "refusal," and "distress." They disagree on the *causal weight* of these terms.
  *   **The Problem of Other Minds:** This is too metaphysical. It suggests we *never* know mental states. Historians routinely infer intent from action. Your problem isn't that intent is unknowable *in principle*, but that *in this specific instance*, the proxy is broken.
  *   **Plain Underdetermination:** You were right to reject this as "too bland." Underdetermination is the genus; you are looking for the species. Saying "it's underdetermined" is like saying "the car won't start." It's true, but it doesn't tell you if the battery is dead or the fuel line is clogged.

  **The Near Misses:**
  *   **Equifinality:** This is strong on the outcome (compliance) but weak on the measurement aspect. It explains why the behavior is the same, but not why the *interpretation of the distress* flips.
  *   **Theory-Ladenness:** This explains *why* they read the data differently, but it doesn't name the *structural problem* of the data itself. It describes the observer, not the instrument.
  *   **Lakatosian Protective Belt:** This describes the *sociology* of the debate (how they defend their positions), not the *epistemology* of the evidence (why the evidence fails to decide).

  ### Phase 3: The Carving (Which concepts actually fit?)

  We are left with three concepts that, when layered, describe your problem precisely.

  **1. Observational Equivalence (Philosophy of Science/Econometrics)**
  This is the structural backbone of your problem. Two models (Goldhagen's "Willing Executioner" vs. Browning's "Situational Conformity") produce the same probability distribution over the observables (Compliance + Distress).
  *   *Fit:* High. It captures the "same datum, reversed reading" dynamic where both readings are internally consistent with the data.
  *   *Limit:* It is usually a formal, mathematical concept. In history, it implies a structural inability to distinguish causes, which fits your "I can't imagine a third piece of evidence" intuition.

  **2. The Identification Problem (Causal Inference)**
  This is the technical term for "no second, independent instrument to check it against." In econometrics, a model is "unidentified" if you cannot solve for the unique values of the parameters (in this case, the strength of antisemitic belief vs. the strength of peer pressure) given the covariance of the variables.
  *   *Fit:* Very High. You explicitly described a measurement problem where the instrument (behavior) is confounded. You have one equation (Behavior) and two unknowns (Belief + Pressure). You cannot solve it without a second instrument (e.g., a private diary, or a control group of non-Germans in the same situation).
  *   *Limit:* It is borrowed from quantitative fields, but the logic holds for qualitative causal inference.

  **3. Lack of Discriminant Validity (Psychometrics/Measurement Theory)**
  This addresses your point about the "measuring instrument." "Compliance" is the instrument. For it to validly measure "Willingness," it must *not* measure "Coercion." If Compliance correlates with both Willingness and Coercion equally, it lacks *discriminant validity*.
  *   *Fit:* Perfect for the "measurement instrument" aspect of your query.
  *   *Limit:* It describes the flaw in the variable, not the state of the debate.

  ### Phase 4: The Verdict

  There is no single, canonical noun in historiography for this specific configuration. However, in the philosophy of social science, the most precise description is:

  **Observational Equivalence arising from an Identification Problem.**

  If you need a single label to hang on the dissertation, I recommend coining a specific term that bridges the gap, as existing terms are either too mathematical (Identification) or too broad (Underdetermination).

  I propose you call this: **Intentional Observational Equivalence**.

  **Definition:** A state of evidentiary impasse where two competing explanations of an agent's mental state (intent, belief, motivation) predict the same observable behavioral trace, and where auxiliary evidence (affect, testimony) is equally absorbable by both causal models due to the lack of discriminant validity in the behavioral proxy.

  **Why this fits best:**
  It captures the *Intentional* nature of the historical inquiry (we are arguing about minds, not just events), the *Observational Equivalence* (the data looks the same under both models), and implies the *Equivalence* is the barrier, not the lack of data.

  ### Phase 5: Distinguishing from Underdetermination and Unfalsifiability

  You asked specifically to separate these. Here is the boundary work:

  **1. vs. Ordinary Underdetermination**
  *   **Ordinary Underdetermination:** "We have some evidence for A and some for B, and not enough to decide." It implies a *quantity* problem. More digging might find a smoking gun.
  *   **Your Case (Intentional Observational Equivalence):** This is a *structural* problem. Even if you found more reports of drinking or distress, both theories have already incorporated those variables. The underdetermination is not due to a lack of data points, but because the *causal mapping* of the existing data points is identical.
  *   **Boundary Case:** If you found a letter from a battalion member saying, "I shot only because I feared for my career," that breaks the equivalence. That is ordinary underdetermination being resolved. If you find another report of "men were upset afterwards," that *does not* break the equivalence, because both theories predict upset. Your case is the latter.

  **2. vs. Unfalsifiability**
  *   **Unfalsifiability:** "No possible observation could prove this wrong." (e.g., "God exists but hides all evidence.")
  *   **Your Case:** Both theories *are* falsifiable. If Trapp had shot the 10 men who stepped out, Browning's "no sanction" claim fails. If the men had volunteered for extra shootings without orders, Browning's "reluctance" claim fails.
  *   **Boundary Case:** A theory that says "Men complied because of hidden magic" is unfalsifiable. A theory that says "Men complied because of pressure" is falsifiable, but currently *unfalsified* by the available data because the data is observationally equivalent. Do not conflate "hard to falsify with current tools" with "logically unfalsifiable."

  ### Summary for the Dissertation

  You are dealing with an **Identification Problem** caused by the **Low Discriminant Validity** of behavioral proxies for intent, resulting in **Observational Equivalence** between the two causal models.

  If you need a phrase to signal this to examiners without sounding like you are importing econometrics jargon inappropriately, use: **The Problem of Causal Indistinguishability in Intentional States.**

  **What does NOT count as an instance of this?**
  1.  **Contradictory Testimony:** If half the survivors said "We were forced" and half said "We loved it," that is not observational equivalence; that is conflicting data. Your case is *consistent* data with *competing* interpretations.
  2.  **Missing Data:** If we had no records of what happened at Józefów at all, that is an evidentiary gap, not an identification problem.
  3.  **Normative Disagreement:** If Browning and Goldhagen agreed on the psychology but disagreed on whether it was "evil" or not, that is moral philosophy, not social science method.

  **Final Blunt Assessment:**
  Your diagnosis of the debate is methodologically sound. You have correctly spotted that the debate has stalled not because historians are being stubborn, but because the "instrument" (behavioral compliance) is structurally incapable of bearing the weight of the inference being asked of it (distinguishing ideological zeal from situational conformity). Calling this **Observational Equivalence** is the most philosophically rigorous move you can make. It signals that you understand the limit is not in the archives, but in the logic of inference itself.
