prompt: |-
  I need help building something I should have built a decade ago, and I'm probably the worst person to build it alone. Day job: I teach political philosophy. Side gig: I'm one of four founders and the current chair of the membership committee of a cohousing community — 47 households, 90 acres, a common house, scheduled work days, the whole apparatus. We get maybe eight or nine serious applications a year now. Three of us read each one, we meet for ninety minutes, and we make a recommendation that goes to the full membership at the monthly meeting; the bylaws need a supermajority to overturn us, so in practice the recommendation is close to decisive. Our substantive criterion is one clause and it's a mess: applicants must be "in sympathy with the shared purposes of the community." That's all it says. Everything else is fair-housing law, which our lawyer has walked us through twice and which I mostly follow, plus a list of things we may not consider at all. For what it's worth, we botched one three years back — turned down a family for reasons nobody can now reconstruct except that they didn't feel like us, and they went off and started a thriving farm co-op forty miles down the road. I still wince about it.

  Here's the problem, and it's exactly the problem I teach, which is why I can't see it straight. I've spent twenty years running the seminar where one side says the self is prior to its ends and the other says that's a description of nothing that has ever lived, and I've genuinely never known which side I'm on when it matters. The liberal in me says you have no business screening people for what they value, only for what they'll do: you can require that a household sends somebody to the work days and pays the assessment on time, you can't require that they think the common house is sacred. The communitarian in me says a community that screens only conduct isn't a community, it's a subdivision with a really nice barn, and the reason any of us moved out here is that we're partly made of shared ends that no covenant can write down. Both of those sound right to me in the abstract, and I have watched them produce opposite votes in the same room on the same application. I've been calling the distinction I want the conduct/belief line, which is obviously too crude — plenty of conduct is expressive of belief, and plenty of stated belief is cheap talk delivered pleasantly to a committee. So: what I want from you is a procedure, not an essay on the tension. A sequence of questions my two fellow committee members — a retired plumber and a pediatric nurse practitioner, neither of whom has read any of this and neither of whom should have to — can work through on an application in about an hour. For each question, what counts as a sufficient answer. Where the procedure should simply produce a no. Where it should stop and hand the case up to the full membership because the issue is what we want to be rather than what the bylaws permit. And explicit flagging of which steps are judgment calls in procedural costume, because otherwise the person smuggling my own politics in and calling it method will be me.

  Then run it on three cases that are close to real. (1) A couple in their fifties, both with demanding jobs an hour away, financialy impeccable, who told us plainly in the interview that they want a quiet house and a garden: full assessment, work days as scheduled, and no potlucks — not hostile to us, just not interested. (2) The adult son of a founding household who left at eighteen, was estranged for fifteen years, and now wants to come back with a partner who has written to people on our waitlist that she considers the place a cult and is coming for the school district only. (3) A household that would rescue us — they'd buy into the barn conversion at a premium and take on a third of the well-drilling debt — and is broadly disliked: loud, already litigious about the parking rules, and one of them has a firm opinion about everything, delivered at length, at every meeting. For each, tell me what the procedure outputs and where I'm going to hate it. Finally, tell me what the procedure can't do. My suspicion is that any procedure honest enough to admit case (1) dissolves us into a housing development, and any procedure that keeps us a community rejects case (1) on grounds I'd be ashamed to put in writing — and I would much rather you said so bluntly and showed me where the trade sits than built me something that pretends the trade isn't there.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Profile:** Political philosophy professor, cohousing committee chair. Deeply self-reflective, intellectually rigorous, aware of their own biases and blind spots.
      *   **Context:** 47 households, 90 acres, cohousing community. Membership committee (3 people: User, retired plumber, pediatric nurse). 8-9 apps/year. Current criterion: "in sympathy with the shared purposes of the community" (vague).
      *   **The Problem:** The tension between Liberalism (screen for conduct/behavior) and Communitarianism (screen for values/shared ends). The user is paralyzed by this theoretical tension in practice. A past rejection (the farm co-op family) haunts them.
      *   **The Goal:** A *procedure*, not an essay. A sequence of questions for the committee to use in ~1 hour. Needs clear criteria for "Yes," "No," and "Refer to Full Membership." Needs to flag where judgment is disguised as procedure.
      *   **The Test:** Run the procedure on three specific, difficult cases.
      *   **The Constraint:** Be blunt about what the procedure *can't* do. Acknowledge the trade-off between becoming a subdivision vs. being exclusionary.

  2.  **Deconstruct the Theoretical Tension (Internal Monologue):**
      *   *Liberal View:* Focus on rules, contracts, observable behavior. "Do what you promised." Risk: Atomization, loss of community spirit.
      *   *Communitarian View:* Focus on shared goods, values, "sympathy." Risk: Exclusion, homogeneity, "vibes-based" rejection (like the farm co-op incident).
      *   *Synthesis:* The procedure needs to bridge the gap. It can't solve the metaphysical problem, but it can operationalize "sympathy" without demanding ideological conformity. It needs to distinguish between *capacity to participate* and *willingness to belong*.

  3.  **Drafting the Procedure (The "Mechanism"):**
      *   *Time Limit:* 1 hour for 3 people. Needs to be structured.
      *   *Step 1: The Hard Floor (Conduct/Capacity).* Can they physically/financially do the work? If no -> Reject. This satisfies the Liberal baseline.
      *   *Step 2: The "Sympathy" Operationalization.* How do we test "sympathy" without testing belief? We test *understanding* and *commitment to the mechanism of conflict*. Communitarianism isn't about agreeing on everything; it's about agreeing on *how we disagree*.
      *   *Step 3: The Risk Assessment.* What happens if they join?
      *   *Step 4: The "Vibe" Check (Flagged).* Acknowledge the subjective element but constrain it.
      *   *Decision Matrix:* Clear paths for Yes, No, and Refer.

  4.  **Refining the Questions (Iterative Process):**
      *   *Draft 1:* Do they like us? (Too vague).
      *   *Draft 2:* Will they come to potlucks? (Too specific, favors extroverts).
      *   *Draft 3:* Do they understand what they are signing up for? (Better).
      *   *Final Polish:* Focus on "Contribution to the Commons" vs. "Extraction from the Commons." Focus on "Conflict Style."

  5.  **Developing the Three Cases:**
      *   *Case 1 (The Quiet Couple):* High capacity, low engagement.
          *   *Procedure Output:* Likely "Refer" or "Yes with conditions."
          *   *User's Pain:* If "Yes," feels like selling out community. If "No," feels like punishing introverts/privacy.
      *   *Case 2 (The Prodigal Son + "Cult" Partner):* High history, high risk.
          *   *Procedure Output:* Likely "No" due to risk of discord/bad faith.
          *   *User's Pain:* Feels like punishing honesty or family ties.
      *   *Case 3 (The Cash-Rich Disruptors):* High capacity, high friction.
          *   *Procedure Output:* Likely "No" (threat to social fabric).
          *   *User's Pain:* Rejecting financial salvation for "vibes."

  6.  **Addressing the "What It Can't Do" (The Blunt Truth):**
      *   The procedure cannot resolve the ontological status of the community.
      *   It cannot prevent regret.
      *   It cannot hide the fact that *exclusion is constitutive of community*. To have a "we," you must have a "not-we."
      *   The "Farm Co-op" wince: That was a failure of imagination, not necessarily procedure.

  7.  **Tone and Style:**
      *   Match the user's intellectual level (philosophical but practical).
      *   Avoid academic jargon where possible (for the plumber and nurse).
      *   Be direct, empathetic, but unflinching on the hard truths.

  8.  **Final Review against Constraints:**
      *   Procedure? Yes.
      *   Sequence of questions? Yes.
      *   Sufficient answers defined? Yes.
      *   Stop/Refer points? Yes.
      *   Flagged judgment calls? Yes.
      *   Three cases run? Yes.
      *   What it can't do? Yes.
      *   Blunt about the trade-off? Yes.

  **(Self-Correction during drafting):** I need to make sure I don't just give them a "Liberal" procedure. The user explicitly wants to preserve the "Communitarian" aspect without it becoming discriminatory. The key is shifting from "Do you believe what we believe?" to "Do you value the *structure* that allows us to pursue our beliefs together?" This is the "constitutional patriotism" approach to cohousing.

  Also, I need to ensure the "Flagged Judgment Calls" are explicit. The user is worried about smuggling their politics in. I need to highlight where the committee *must* use discretion.

  Let's build the "Membership Intake Protocol (MIP)."

  *Step 1: Viability (Hard No)*
  *Step 2: Comprehension (The "Sympathy" Proxy)*
  *Step 3: Friction Tolerance (Conflict)*
  *Step 4: The "One Year" Test (Projection)*

  Okay, ready to write.
answer: |-
  This is a hard problem because it is not actually a procedural problem; it is a constitutive one. You are asking for a machine to decide what kind of thing you are. No machine can do that without a human hand on the lever. However, a good procedure can force the hand to be visible.

  Here is a protocol designed for three people (one philosopher, one plumber, one nurse) to use in 60 minutes. It translates "sympathy with shared purposes" into observable commitments regarding *maintenance of the commons* and *conflict resolution*.

  ### The Membership Intake Protocol (MIP)

  **Time:** 60 Minutes max.
  **Materials:** Application, Interview Notes, Financials.
  **Voting:** Consensus preferred. If no consensus, move to "Refer."

  #### Phase 1: The Hard Floor (10 Minutes)
  *Goal: Satisfy the Liberal/Conduct requirement. Eliminate objective risks.*

  **Q1: Capacity.** Based on finances, health, and work schedule, can this household physically and financially meet the bylaws' minimum requirements (assessments, work days, snow removal) for the next 24 months without hardship?
  *   **Sufficient Answer:** Yes, verified by data.
  *   **Insufficient Answer:** "They seem tough," or "They'll figure it out."
  *   **Action:** If **No**, vote **Reject**. Stop.

  **Q2: Compliance History.** (If applicable/known) Is there any record of litigiousness, HOA disputes, or neighbor conflicts in their past?
  *   **Sufficient Answer:** None found, or past conflicts resolved with documented mediation.
  *   **Insufficient Answer:** "They say they get along fine."
  *   **Action:** If **No** (record exists), move to **Phase 3, Question 5**. If **Yes**, proceed to Phase 2.

  #### Phase 2: The Sympathy Proxy (30 Minutes)
  *Goal: Test the Communitarian requirement without testing belief. We are not testing if they love the barn; we are testing if they value the *agreement* about the barn.*

  **Q3: The "Why Us" Specificity.** Did the applicants articulate a specific feature of *this* community's governance or social structure that they want to participate in, distinct from general amenities (schools, land, quiet)?
  *   **Sufficient Answer:** Reference to consensus process, shared meals, specific committees, or the interdependence of the infrastructure (e.g., "We want the well co-op model").
  *   **Insufficient Answer:** "We like the land," "We want friends," "It's safe."
  *   **Action:** If **Insufficient**, flag as **Risk of Extraction** (they want resources, not relationship). Proceed to Q4.

  **Q4: The Cost of Membership.** When asked what they are willing to give up for the community (time, privacy, aesthetic control, money), did they offer a concrete concession?
  *   **Sufficient Answer:** "We will miss some work days for travel," or "We don't like meetings but will serve on the maintenance committee."
  *   **Insufficient Answer:** "We'll follow the rules," or "We don't plan to give anything up."
  *   **Action:** If **Insufficient**, vote **Reject**. (This is the "Subdivision" filter).

  **Q5: Conflict Style.** Describe a time they disagreed with a neighborhood or group authority. How was it resolved? If they join and the community votes against their preference on a major issue (e.g., road paving), what will they do?
  *   **Sufficient Answer:** "I was unhappy, but I accepted the vote," or "We mediated."
  *   **Insufficient Answer:** "I fought until they saw reason," or "I'd probably move."
  *   **Action:** If **Insufficient**, vote **Reject**. (This is the "Stability" filter).

  #### Phase 3: The Projection & Refer (20 Minutes)
  *Goal: Identify where the procedure fails and politics begin.*

  **Q6: The One-Year Test.** Imagine this household one year from now. They have paid dues and done work days. They have not attended a single social event and have voiced criticism of two community norms. Are we glad they are here?
  *   **Sufficient Answer:** Unanimous "Yes" or Unanimous "No."
  *   **Insufficient Answer:** Split vote, or "Yes, but..."
  *   **Action:** If **Split**, vote **Refer to Full Membership**.

  **Q7: The "Vibe" Check (FLAGGED JUDGMENT CALL).** *Warning: This step is where personal bias enters. Acknowledge it aloud.*
  Does the committee feel a specific, articulable dread about this household joining? (Not "they are different," but "interaction with them feels depleting.")
  *   **Sufficient Answer:** "Yes, because their communication style is domineering," or "No, we feel neutral/positive."
  *   **Insufficient Answer:** "They just don't feel like us." (This is the Farm Co-op error).
  *   **Action:** If **Yes (Dread)**, you must write down *one behavioral prediction* based on that dread (e.g., "They will dominate the listserv"). If you cannot predict a behavior, you must vote **Refer**.

  ---

  ### Decision Matrix

  1.  **Reject:** Failed Phase 1 (Capacity) OR Failed Phase 2 (Q4 or Q5).
  2.  **Approve:** Passed Phase 1 & 2, Unanimous "Yes" on Phase 3 (Q6).
  3.  **Refer to Full Membership:** Split vote on Q6, OR "Dread" in Q7 without behavioral prediction, OR The application presents a fundamental question about community direction (e.g., "Should we be a retirement community or a family community?").

  ---

  ### Running the Cases

  Here is how the MIP processes your three cases, and where it will cause you pain.

  #### Case 1: The Quiet Couple (High Capacity, Low Engagement)
  *   **Phase 1:** Pass. Financials impeccable, capacity clear.
  *   **Phase 2:**
      *   Q3 (Specificity): **Fail.** They want quiet and garden, not governance.
      *   Q4 (Concession): **Pass.** They commit to work days and assessments.
      *   Q5 (Conflict): **Pass.** No indication they will fight; likely to withdraw.
  *   **Phase 3:**
      *   Q6 (One-Year): **Split.** The Liberal on the committee says "They pay and work, what more do you want?" The Communitarian says "They are guests, not members."
      *   Q7 (Vibe): **Neutral.** No dread, just indifference.
  *   **Output:** **Refer to Full Membership.**
  *   **Where you will hate it:** You know the Full Membership will vote **Yes**. It is financially irrational to turn them down. The procedure correctly identifies that this is not a violation of rules, but a shift in *culture*. By referring it, you force the community to admit: "We are becoming a subdivision." You wanted the procedure to protect the community soul; instead, it will hold a mirror up to show you that the soul is already fading. You will hate that the procedure makes you complicit in the dilution you fear.

  #### Case 2: The Prodigal Son & The "Cult" Partner
  *   **Phase 1:** Pass.
  *   **Phase 2:**
      *   Q3 (Specificity): **Fail.** Partner admits it's for schools.
      *   Q4 (Concession): **Fail.** "Coming for school district" implies extraction of value without investment in purpose.
      *   Q5 (Conflict): **High Risk.** Partner has already communicated antagonistically to waitlist ("cult").
  *   **Phase 3:**
      *   Q7 (Vibe): **High Dread.** Predictable behavior: Litigation or social poisoning.
  *   **Output:** **Reject.**
  *   **Where you will hate it:** The "Cult" comment is a huge red flag, but the son is a founder's child. The procedure forces you to treat the son as a new applicant, severing the historical tie. This feels cold. Furthermore, rejecting them based on the partner's private comments to third parties feels like gossip-based adjudication. You will hate that the procedure requires you to police speech outside the interview room to protect the community inside it. It feels illiberal. But the procedure saves you from the "Farm Co-op" wince by anchoring the rejection in *predicted conflict* (Q5/Q7), not "lack of sympathy."

  #### Case 3: The Cash-Rich Disruptors (Financial Rescue, Social Risk)
  *   **Phase 1:** Pass.
  *   **Phase 2:**
      *   Q3 (Specificity): **Pass.** They want to invest.
      *   Q4 (Concession): **Fail.** "Firm opinion on everything... at every meeting" suggests they view concession as weakness.
      *   Q5 (Conflict): **Fail.** "Litigious about parking rules" is a hard stop on Q2/Phase 1 history.
  *   **Phase 3:**
      *   Q7 (Vibe): **High Dread.** Prediction: They will paralyze governance.
  *   **Output:** **Reject.**
  *   **Where you will hate it:** This is the hardest one. They offer financial solvency (barn conversion, well debt). The procedure forces you to prioritize *social capital* over *financial capital*. In a struggling community, this feels like choosing pride over survival. You will hate that the procedure gives you the cover to say "No" to money. It validates the Communitarian instinct, but it leaves you wondering: "If we go bankrupt, does the community survive?" The procedure cannot answer that. It assumes the community's social fabric is the primary asset. If you believe the *buildings* are the primary asset, this procedure is wrong.

  ---

  ### What The Procedure Cannot Do

  You asked for bluntness. Here is the trade-off the procedure hides, and why you will still wince.

  **1. It cannot distinguish between "Shared Ends" and "Shared Manners."**
  The procedure screens for people who know how to *talk* like community members (Q3, Q4, Q5). It does not screen for people who *are* community members. You will admit people who speak the language of consensus but feel nothing, and reject people who feel deeply but speak poorly. You are building a bureaucracy of belonging. This is the Liberal victory over the Communitarian dream, disguised as a tool.

  **2. It cannot solve the "Farm Co-Op" Wince.**
  Three years ago, you rejected a family because they "didn't feel like us." The MIP prevents you from saying that. But if you use Q7 (Vibe) honestly, you will still reject people because they deplete you. You will just write down "Predicted listserv dominance" instead of "Not like us." The moral residue is the same. You are still excluding people to preserve a social organism. The procedure just makes the exclusion legible. Legibility does not equal innocence.

  **3. It forces a choice you haven't made.**
  The procedure outputs "Refer" for Case 1. This kicks the can to the Full Membership. But the Full Membership is the same group as the Committee, just larger. If they vote Yes on Case 1, you have officially become a housing development with a common house. If they vote No, you have officially become a club that turns away solvency.
  The procedure cannot tell you which one you *should* be. It only tells you which one you *are* based on the vote.

  **4. The "Sympathy" Clause remains a lie.**
  You want to keep the bylaw clause: "in sympathy with the shared purposes." The MIP effectively redefines "sympathy" as "willingness to adhere to conflict protocols." That is a different thing. You are not asking if they sympathize with your ends; you are asking if they will tolerate your process.
  *   **The Trade:** If you want to keep the community, you must reject Case 1. If you reject Case 1, you are prioritizing *culture* over *conduct*. That is the Communitarian victory. But to do it without violating Fair Housing or your own Liberal conscience, you have to pretend it's about "process."
  *   **The Truth:** You are not screening for conduct. You are screening for *disposition*. No procedure can hide that.

  **Recommendation:**
  Use the procedure. It will save you from arbitrary cruelty (Case 2 & 3 become clear). But when Case 1 comes up, and the procedure says "Refer," do not use the vote to hide. If you vote to accept them, amend the bylaws. Change "sympathy with shared purposes" to "commitment to financial and maintenance obligations."
  If you vote to reject them, admit it is because you value a specific kind of social intensity over growth.

  The wince comes from pretending the choice isn't happening. The procedure ensures the choice happens. It won't stop the wince, but it will ensure you wince with your eyes open.
