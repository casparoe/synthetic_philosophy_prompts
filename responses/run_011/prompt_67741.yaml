answer: |-
  # JOINT STATEMENT ON UNCERTAIN EVIDENCE AND BELIEF UPDATE
  **Prepared by the Adversarial Collaboration on Epistemic Update (ACEU)**
  **Subject:** The Status of Uncertain Evidence in Metrological Practice
  **Date:** October 2023

  ## 1. Agreed Claims

  The undersigned camps (Conditioning and Kinematics) affirm the following fourteen claims as the shared foundation of our dispute. These claims constitute the mathematical and procedural common ground.

  1.  **Coherence Requirement:** An agent's credences at any single time $t$ must satisfy the axioms of probability to avoid a static Dutch Book (a guaranteed loss in a system of bets acceptable to the agent).
  2.  **Diachronic Coherence:** An agent's strategy for changing credences over time must satisfy constraints to avoid a diachronic Dutch Book (a guaranteed loss exploiting the update rule itself).
  3.  **The Update Equation:** Both camps accept the general form $P_{new}(H) = \sum_i P_{old}(H | E_i) P_{new}(E_i)$ as a valid calculation for posterior credence, where $\{E_i\}$ is a partition.
  4.  **Conditionalization as Special Case:** Strict Conditionalization is mathematically equivalent to the Update Equation where $P_{new}(E_k) = 1$ for exactly one cell $E_k$ and $0$ for all others.
  5.  **The Rigidity Condition:** The Update Equation is uniquely mandated if and only if the agent satisfies *Rigidity* (Bayes' Invariance): $P_{new}(H | E_i) = P_{old}(H | E_i)$ for all hypotheses $H$ and partition cells $E_i$.
  6.  **Martingale Property:** For any update rule satisfying the above, the prior expectation of the posterior probability of any proposition must equal its prior probability: $E_{old}[P_{new}(H)] = P_{old}(H)$.
  7.  **Uncertainty Quantification:** In metrological practice, no measurement reading is treated as a literal certainty about the measurand; all readouts are associated with a probability distribution (likelihood function) derived from calibration.
  8.  **Model Dependence:** Both camps agree that connecting a readout to a measurand requires a stochastic model (error model) linking the physical state to the instrument indication.
  9.  **Input Status:** Both camps agree that *some* input from the world is required to trigger an update; neither camp supports solipsistic probability drift without external cause.
  10. **Partition Sensitivity:** The result of a Jeffrey Conditionalization (Kinematics) depends on the chosen partition $\{E_i\}$; different partitions yielding the same marginal shifts on a sub-algebra can produce different posteriors for $H$.
  11. **Order Dependence (Kinematics):** Successive applications of the Kinematics rule on *different* partitions do not generally commute ($P_{12} \neq P_{21}$).
  12. **Order Independence (Conditioning):** Successive applications of Strict Conditionalization on propositions $A$ then $B$ are order-independent, yielding $P(\cdot | A \land B)$.
  13. **Idealization of Certainty:** Both camps acknowledge that "certainty" ($P=1$) is an idealization in physical measurement, though they disagree on whether it is a necessary idealization for epistemology.
  14. **Empirical Equivalence (Standard Cases):** In standard metrological cases where the error model is stable and fully specified, both camps can be made to yield identical numerical posteriors for the measurand, provided the Conditioning camp is allowed to expand the proposition space to include "experience states."

  ## 2. Disagreements Table

  | Disputed Claim | Conditioning Camp Wording | Kinematics Camp Wording | Type & Reason | Settlement Condition |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Certainty** | "Learning requires conditioning on a proposition $E$ where $P_{new}(E)=1$. If evidence is uncertain, $E$ must be re-described as a proposition about the agent's immediate experience." | "No proposition about the world or experience requires $P=1$. Requiring certainty forces an artificial foundation of incorrigible inner states that do not exist for physical agents." | **Substantive.** Disagreement on the metaphysics of the "given." Conditioning requires a fixed anchor; Kinematics denies one exists. | Demonstration of a case where re-description changes the posterior or is impossible to formulate without circularity. |
  | **2. Input Explanation** | "The new probabilities $P_{new}(E_i)$ are derived from a higher-order certainty about experience combined with a likelihood model. They are not brute inputs." | "The new probabilities $P_{new}(E_i)$ are the direct result of the interaction with the world. They require no further probabilistic explanation to be valid inputs." | **Partly Verbal.** 'Explanation' is ambiguous. Conditioning demands a causal/probabilistic chain; Kinematics treats the update as primitive. | Agreement on whether a causal chain *must* be probabilistic to count as rational. |
  | **3. Propositional Evidence** | "Evidence is always propositional. If it feels uncertain, the proposition is 'It appears that X'." | "Evidence is often non-propositional (sensory, instrumental indication). Forcing it into propositions distorts the learning process." | **Substantive.** Nature of the interface between mind and world. | A case where non-propositional influence clearly alters credence but resists propositional formulation. |
  | **4. Rigidity & Drift** | "If conditional credences change (e.g., learning of instrument drift), the agent is conditioning on a new proposition 'Drift Occurred', not violating Rigidity." | "Learning of drift changes $P(H | Reading)$ directly. Calling this 'conditioning on Drift' is a fiction if 'Drift' is not certain. Rigidity is often descriptively false." | **Substantive.** Whether model-change is conditioning or a different update type. | A case where the agent learns of drift without becoming certain of the specific drift mechanism. |
  | **5. Divergent Recommendations** | "For any real agent, if the model is complete, our recommendations converge. Divergence implies the Conditioning agent has failed to model the uncertainty." | "For real agents with limited cognitive capacity, the re-description required by Conditioning is often undefined. Our recommendations diverge where modeling capacity is exhausted." | **Partly Both.** Convergence in principle vs. divergence in practice. | A bounded-rationality case where the re-description is too complex to compute, but the kinematic update is tractable. |

  ## 3. Cruxes

  **Crux 1: The Drifting Thermocouple (Rigidity Violation)**
  *   **Case:** A bench voltmeter reads a thermocouple. At $t_1$, you update on a reading $V_1$. At $t_2$, you receive a notification that the thermocouple suffered a thermal shock between $t_1$ and $t_2$, altering its Seebeck coefficient. You are not certain of the *magnitude* of the shift, only that the calibration is compromised.
  *   **Conditioning Prediction:** You condition on the proposition "Thermal Shock Occurred." Your posterior is $P(H | V_1 \land \text{Shock})$. This requires a prior $P(\text{Shock})$ and likelihoods for the shock.
  *   **Kinematics Prediction:** You directly adjust $P_{new}(H | V_1)$ to reflect the reduced reliability, without needing a certain proposition "Shock." The conditional credence $P(H|V_1)$ changes.
  *   **Falsification:** If the Conditioning camp cannot specify the proposition "Shock" without assigning it probability 1 (when the agent is not certain of it), Kinematics wins. If Kinematics cannot specify *how much* to adjust $P(H|V_1)$ without implicitly using a likelihood model, Conditioning wins.
  *   **Metaphysics Note:** This is a crux only against the background disagreement about whether model-updating is "learning" (Conditioning) or "adjustment" (Kinematics).

  **Crux 2: The Ambiguous Digit (3 vs 8)**
  *   **Case:** A 4.5-digit voltmeter displays a value. The last digit is obscured by glare. The operator assesses it as 60% likely to be a 3, 40% likely to be an 8.
  *   **Conditioning Prediction:** The agent conditions on "It looks like a 3-or-8 with these proportions." This requires a likelihood $P(\text{Look} | \text{True Digit})$.
  *   **Kinematics Prediction:** The agent sets $P_{new}(\text{Digit}=3) = 0.6$ and $P_{new}(\text{Digit}=8) = 0.4$ directly.
  *   **Falsification:** If the Conditioning camp's likelihood model yields a different posterior for the *voltage* than the Kinematics direct update (given the same priors), one is mathematically inconsistent with the shared coherence framework. (Consensus: They should match if the likelihoods match the 60/40 split).
  *   **Outcome:** This favors Kinematics on *simplicity*, Conditioning on *derivability*.

  **Crux 3: Order of Absorption (Calibration vs. Reading)**
  *   **Case:** You have a reading $R$ (uncertain) and a Calibration Certificate $C$ (stating expanded uncertainty). You absorb $R$ then $C$, versus $C$ then $R$.
  *   **Conditioning Prediction:** Order is irrelevant. $P(H | R \land C) = P(H | C \land R)$.
  *   **Kinematics Prediction:** If $R$ and $C$ are treated as separate Jeffrey updates on different partitions, order *may* matter. If $C$ defines the partition for $R$, order is fixed.
  *   **Falsification:** If a Kinematics agent produces different final credences for the measurand based solely on the order of reviewing the logbook vs. the certificate, they are vulnerable to a diachronic Dutch Book.
  *   **Outcome:** This is the Conditioning Camp's strongest technical card (see Note b).

  ## 4. Case Discipline: Order Dependence in Metrology

  **Scenario:**
  A technician measures a stable reference voltage $V_{ref}$ using a bench voltmeter (4.5 digits).
  1.  **Reading A:** Taken at $t_1$. The last digit jitters. The technician assigns probabilities to the intervals defined by the last digit: $P(Digit=3)=0.7, P(Digit=4)=0.3$. (Partition $\mathcal{P}_1$).
  2.  **Reading B:** Taken at $t_2$ after a colleague calls out a confirmation from across the room. The colleague is known to mishear 3s as 8s occasionally. The technician assigns probabilities to the colleague's report: $P(Report='3')=0.9, P(Report='8')=0.1$. (Partition $\mathcal{P}_2$).

  **The Partitions:**
  *   $\mathcal{P}_1$: Cells are $D_3$ (Digit is 3), $D_4$ (Digit is 4). (Simplified for example).
  *   $\mathcal{P}_2$: Cells are $R_3$ (Report is '3'), $R_8$ (Report is '8').

  **Conditioning Analysis:**
  The agent conditions on the conjunction of the experiences: $E_{total} = E_{see} \land E_{hear}$.
  $P_{final}(H) = P_{old}(H | E_{see} \land E_{hear})$.
  By Bayes' theorem, this is equivalent to updating on $E_{see}$ then $E_{hear}$, or vice versa. The order of absorption is **irrelevant**. The posterior depends only on the total evidence state.

  **Kinematics Analysis:**
  The agent performs Jeffrey Conditionalization on $\mathcal{P}_1$, then on $\mathcal{P}_2$.
  $P_{1}(H) = P_{old}(H | D_3) \cdot 0.7 + P_{old}(H | D_4) \cdot 0.3$.
  $P_{2}(H) = P_{1}(H | R_3) \cdot 0.9 + P_{1}(H | R_8) \cdot 0.1$.
  **Crucial Constraint:** For this to be valid, Rigidity must hold for the second update relative to the *intermediate* probability $P_1$. That is, $P_{2}(H | R_i) = P_{1}(H | R_i)$.
  However, $P_{1}(H | R_i)$ depends on the first update. If the partitions $\mathcal{P}_1$ and $\mathcal{P}_2$ are not independent or do not commute algebraically, $P_{final}$ will differ if the order is swapped.
  *   *Sequence 1 (See then Hear):* Updates the digit distribution, then updates based on report likelihoods conditioned on the *new* digit distribution.
  *   *Sequence 2 (Hear then See):* Updates the report distribution, then updates based on visual likelihoods conditioned on the *new* report distribution.

  **Resolution:**
  The Conditioning Camp argues the Kinematics agent is making an error by treating the reports as independent updates without a joint model. The Kinematics Camp argues that for a real agent, the joint distribution $P(D_i \land R_j)$ is often unavailable, while the marginal shifts are accessible.
  **Agreed Technical Fact:** If the agent possesses a full joint likelihood model $P(See, Hear | H)$, Conditioning is order-independent. If the agent only has marginal shifts (common in quick metrology work), Kinematics is order-dependent. The "error" in Kinematics is the price paid for not constructing the full conjunction.

  ## 5. Verification of Notes

  You asked to verify your six notes. Here is the assessment:

  *   **(a) The rule leaves the conditional probabilities... unchanged...**
      *   **Status:** **Correct.** This is the definition of Rigidity (Bayes' Invariance).
      *   **Alignment:** Favors **Kinematics** as a definition, but **Conditioning** argues this condition is rarely met in practice (see Crux 1).
  *   **(b) Applying the rule successively... need not commute...**
      *   **Status:** **Correct.** Jeffrey Conditionalization is non-commutative for distinct partitions. Conditionalization is commutative.
      *   **Alignment:** This is indeed the **Conditioning Camp's strongest technical card**. It implies Kinematics is path-dependent unless partitions are carefully managed.
  *   **(c) Given the rigidity condition, the rule is the unique update...**
      *   **Status:** **Correct.** (Result attributed to Williams/Jeffrey).
      *   **Alignment:** Favors **Kinematics**. It legitimizes the rule as the *only* coherent way to handle uncertain evidence *if* Rigidity holds.
  *   **(d) An agent who expects to update by the rule... cannot be diachronically Dutch-booked...**
      *   **Status:** **Correct.** (Result attributed to Armendt/Skyrms).
      *   **Alignment:** Favors **Kinematics**. It grants the rule full coherence status, countering the claim that it is "approximate."
  *   **(e) The prior credence... equals the agent's own prior expectation of her posterior...**
      *   **Status:** **Correct.** This is the Martingale Property / Reflection Principle.
      *   **Alignment:** **Shared.** Both camps accept this as a requirement for rational planning.
  *   **(f) The rule's originator... conceded that the new cell probabilities... simply arrive...**
      *   **Status:** **Correct.** Richard Jeffrey explicitly argued that the inputs are not fixed by antecedent probabilities.
      *   **Alignment:** **Conditioning** treats this as an admission of incompleteness (where do they come from?). **Kinematics** treats it as an honest description of perception (they come from the world).

  ## 6. Closing Practice: The Notebook

  You asked what each camp tells a scientist to write in the notebook. We offer these two formulations. Both are fair; both capture the data; they differ in what they claim the data *is*.

  **The Conditioning Camp Instruction:**
  "Record the reading as an observation event $O$. Do not record the measurand value as uncertain; record the *observation* as certain. Enter: 'Observed indication $I = 5.003 \pm 0.002$ (k=2).' In your analysis model, treat $I$ as the certain evidence and apply the calibration likelihood $P(I | V_{true})$ to derive the posterior for $V_{true}$. If the digit is ambiguous, record the proposition 'Visual experience was ambiguous between 3 and 8' and assign likelihoods to that experience."
  *   *Why the other camp accepts this:* It preserves the traceability chain. The "certainty" is confined to the logbook entry of what happened at the bench, not the state of the world.

  **The Kinematics Camp Instruction:**
  "Record the reading as a direct constraint on your credence for the measurand. Enter: 'Credence in $V_{true} \in [4.99, 5.01]$ updated to 0.95 based on indication.' Do not force the indication into a binary 'observed/not observed' state. If the digit is ambiguous, record the probability distribution over the digits directly as the input state. Acknowledge that the update is a shift in probability mass, not a conditioning on a truth."
  *   *Why the other camp accepts this:* It accurately reflects the metrological reality that the "observation" is never certain, only the *report* of the uncertainty is. It avoids the fiction that "I am certain I saw a 3."

  **Final Adjudication for the Metrologist:**
  You do not need to choose a metaphysics to do the work. If you have a full error model (likelihoods for all sources of uncertainty), use **Conditioning** (Bayes' Theorem). It is order-independent and robust. If you are making quick judgments where the likelihood model is implicit or too complex to write down (e.g., "this reading feels less reliable than that one"), use **Kinematics** (Jeffrey's Rule), but be aware that the order in which you absorb these judgments matters. Your habit of looking for error bars is the Kinematics instinct; your habit of writing down the calibration model is the Conditioning discipline. Keep both.
