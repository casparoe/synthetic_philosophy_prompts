answer: |-
  Good evening. Welcome to the gallery.

  It is good to see so many of you. I see colleagues from other institutions, the scientists whose work made this exhibition possible, friends of the museum, and members of the family whose generosity built the collection we are standing in. And I see the press. I know some of you are here because of the headline in the national paper last week: "Museum's Pride Is a Fake."

  If you came looking for a scandal, I am afraid you will find only a label.

  You are looking at the centerpiece of this room. For eighty years, this panel has hung here. It was bought in the 1930s by a local shipping merchant and given to us by his widow. For most of that time, the frame carried the name of a master. Two years ago, we tested the wood and the paint. The tree rings tell us the wood was cut too late for that master. The pigments tell us the paint was mixed in the 1920s.

  We have a file now that attributes this work, with confidence, to a forger active between the wars.

  When the report landed on my desk, the easy decision was to take the painting down. To move it to the dark of the storage room, where mistakes go to sleep. We decided not to do that. It stays here. It stays under the same light. But the label beneath it has changed. It tells you what we know, how we know it, and that it was bought in good faith.

  I want to explain why we keep a known lie on the wall.

  A museum is not just a treasury of masterpieces. It is also a record of how we look. This painting is no longer a Dutch seascape from the seventeenth century. It is a document of the 1920s, and of the 1930s, and of us. It tells a story about what people wanted to see, and what they were willing to pay to see. If we hide it, we erase that history. We pretend we are wiser than we are, or that our past never happened.

  But I also need to be honest with you about what this knowledge does to the looking.

  There is a comforting line people often offer in these situations. They say, "Who cares who painted it? Beauty is in the eye of the beholder." I am not going to say that. I do not believe it, and I do not think it is fair to the object.

  I have looked at this panel for twenty years. Before the report, I saw assurance in the brushwork. Now, I see strain. I see a sky where the weather is a formula repeated three times. I see a signature that is doing work the painting cannot do without it. To my eye, it has become a mediocre picture.

  But I may be fooling myself. I cannot un-know what I know. Perhaps the strain was always there, and I simply refused to see it because of the name on the frame. Or perhaps the knowledge has clouded my vision. I do not know. I invite you to look, and to feel that uncertainty for yourselves.

  And that uncertainty brings me to the painting hanging one bay further on.

  It is a marine scene, painted in the right decade, on the right wood. It is not by the master either. It is by a pupil in his workshop. We call it that on the label. Nobody calls it a fake.

  Why? The pupil's work is not necessarily better than the forgery. In some lights, it is stiffer. The difference is not quality. The difference is not even age. The difference is what each of them claims.

  The pupil's painting claims to be from the workshop. It tells the truth about its own making. The forgery claims to be something it is not. It asks you to believe a story that never happened. When we hang them near each other, we are not comparing skill. We are comparing honesty.

  This distinction matters most to the people standing in the front row.

  To the grandchildren of the donor: you are seeing the new label for the first time tonight. I know this is difficult. But I want you to know that this painting remains on this wall not despite your grandfather, but because of him.

  He bought this picture because he loved the sea, and he loved what this image said about the trade that sustained this city. He gave it to us because he believed this building was the right home for it. That belief was real. His good faith was real. The collection you see around you exists because of his conviction.

  If we took this painting down, we would be saying that his gift was only valuable if the attribution held. We are saying instead that his gift is valuable because he gave it. We are honoring his trust by telling the truth, even when the truth is complicated.

  So, please. Walk around the room. Look at the pupil's work, which admits what it is. Look at this work, which tried to pretend. Look at the difference between them. And know that this room holds both the art of the seventeenth century, and the history of our own looking.

  Thank you for coming. Please, enjoy the exhibition.
