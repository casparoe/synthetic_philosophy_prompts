      *(Self-Correction during drafting Point 4)*: The user claims probabilistic methods "depend on something they cannot endorse." I need to argue that *all* reasoning depends on unprovable priors. If $R$ endorses the *framework* of probability, it endorses the successor. The "unendorsed" part is just the axiom of probability, which $R$ already holds.

