          *   *Disanalogy:* Deductive systems monotonicly increase strength; inductive systems update confidence distributions. You can have high confidence in a new method without proving it sound.
          *   *Verdict:* This is a strong disanalogy. The user's claim (3) that *any* improvement faces this is false. Only *deductive proof-based* improvement does.

