answer: |-
  **MEMORANDUM**

  **TO:** Committee on Student Governance
  **FROM:** [Your Name], Committee Member
  **DATE:** October 10
  **SUBJECT:** Recommendation on Undergraduate Assembly Reform

  I recommend the Committee adopt Proposal A (Full Sortition), implemented as a binding two-year pilot with three specific amendments regarding compensation, refusal mitigation, and removal. While Proposal C ignores the structural collapse of electoral legitimacy and Proposal B creates an unstable internal hierarchy, Proposal A offers the only path to a representative body that reflects the undergraduate body rather than a self-selecting cadre. However, to satisfy the General Counsel's accountability constraint and mitigate the risks of bureaucratic capture, the pilot must include a citizen review mechanism for removal and strict metrics for demographic fidelity.

  We must dismiss Proposal C immediately. Treating 9 percent turnout as a campaigning problem misdiagnoses the pathology. When 61 percent of seats are uncontested and members treat the Assembly as a fellowship stepping stone, the issue is not voter engagement but institutional relevance. Elections currently select for those with the most free time and the strongest resume incentives, not the most representative voices. Retaining this system with term limits (Proposal C) merely rotates the same type of student without expanding the pool.

  Proposal B (Hybrid) is the strongest runner-up, but it is worse than full sortition because it institutionalizes a caste system within the chamber. Creating two classes of members—those with electoral mandates and those with lot mandates—invites conflict over legitimacy. Elected members will claim superior authority, while sorted members will lack the confidence to challenge them, exacerbating the very power imbalance reform seeks to fix. Furthermore, splitting the chamber dilutes the descriptive representation sortition promises. If we are to test lot selection, it must be on the whole body to assess its true capacity for governance.

  To make Proposal A viable, we must address three specific design failures raised in committee.

  First, the refusal skew. If opting out is costless, students with high workloads or caregiving obligations will decline at higher rates, leaving us with a chamber of the leisured. Payment alone does not solve this; it merely commodifies the exclusion. I propose we counteract this through oversampling and friction. The initial pool should be drawn at 150 percent of needed seats, oversampling categories historically likely to decline (identified via financial aid and commuter status). Additionally, declining service should require a brief, categorized statement of reason submitted to the Committee. This creates friction without coercion. We detect failure by comparing the demographic profile of decliners against the pool monthly. If decline rates among financial aid recipients exceed non-recipients by more than 10 percent, the sampling algorithm must be adjusted immediately to oversample that group until parity is reached.

  Second, the payment dilemma. We cannot expect low-income students to serve unpaid, yet paying members risks attracting résumé-builders. The solution is to pay a flat stipend equivalent to a standard work-study wage—$15 per hour for a capped ten hours per week over a 30-week academic year. This costs approximately $216,000 annually, fundable from the student activities fee. To discourage careerism, we must strip the roles of prestige. There shall be no titles such as "Senator" or "Chair" used in external communications; members are "Assembly Representatives." Committee chairmanships must rotate quarterly. This makes the role a compensated civic duty rather than a leadership credential.

  Third, discipline without a ballot. The General Counsel requires a "practical means of removing a member." A recall election is simply another election, vulnerable to organized minorities and contrary to the logic of sortition. Instead, I propose a Citizen Review Panel. A petition signed by 5 percent of the undergraduate body triggers a hearing before a randomly selected panel of twelve students not serving in the Assembly. This panel reviews evidence of misconduct or neglect. A two-thirds vote by the panel removes the member. This satisfies the Counsel's requirement—the student body retains the power via petition and proxy—without turning removal into a popularity contest or handing veto power to organized factions.

  The fourth-term Senator's objection regarding institutional memory is partly right and must be taken seriously. A chamber of novices is vulnerable to capture by professional staff who control the agenda and briefing materials. However, this is not an argument for elections, which have already failed to produce independent oversight. It is an argument for transparency. To counter staff capture, all briefing materials provided to the Assembly must be publicly archived online within 24 hours. Additionally, the Assembly must publish a monthly "Decision Log" explaining how votes align with student feedback. This creates an external memory accessible to the student body, reducing reliance on staff interpretation. We do not need career politicians to resist administration; we need public records that allow students to see when their representatives are being managed.

  Regarding the theoretical argument invoked by some members—that sortition is democratic while election is aristocratic—this is decoration on our specific facts. Montesquieu and Rousseau were concerned with preventing factional oligarchy. Our problem is not that elections are selecting an elite; it is that they have stopped selecting anyone. The apathy is so total that the "aristocratic" function of elections has collapsed into co-optation. We are not adopting sortition to realize a philosophical ideal of democracy, but to fill seats that elections can no longer fill. The theory is interesting, but the justification here is pragmatic necessity.

  Finally, this recommendation is for a two-year pilot, not an indefinite experiment. We must define success and failure now to avoid relitigating the theory later. The pilot is confirmed if, after two years: (1) the demographic composition of the Assembly matches the undergraduate body within a 5 percent margin across all stratification variables; (2) the student activities budget is passed before the start of the fiscal year; and (3) no more than two removals are triggered via the Citizen Review Panel. The pilot is defeated if: (1) the refusal skew exceeds the 10 percent threshold despite oversampling; (2) the Assembly fails to pass a budget twice; or (3) staff capture is evidenced by unanimous voting blocks correlated with staff recommendations without public justification. If defeated, the Committee shall revert to Proposal B (Hybrid) as a transitional measure. If confirmed, Proposal A becomes permanent.

  We have a chance to rebuild a body that actually looks like the student body. Let us not settle for a hybrid that preserves the flaws of the old system alongside the risks of the new.
