      *   *Okay, I will structure the audit by Tension Clusters.*
      *   **Tension 1: The Direct Contradiction (3 vs 5).**
      *   **Tension 2: The Threshold Problem (4 vs 5 vs 6).**
      *   **Tension 3: The Source of Value (2 vs 5).**
      *   **Clear Items:** 1, 7 (No tension). 4 (Consistent with 3, inconsistent with 5). 6 (Theoretically vulnerable).

      *   *Wait, Claim 6's explanation:* "the single complaint is satisfied by saving someone." If the single person dies, their complaint to live is *not* satisfied. The *principle* satisfies the generic complaint. I need to point out that the phrasing in 6 is imprecise and invites attack.

      *   *Final check on Claim 7:* "A principle's being reasonably rejectable is not its being rejected." This is standard. No tension with 1.

      *   *Final check on Claim 2:* "Only personal reasons are admissible." If I save the billion, am I appealing to the sum? Or to each person's personal reason? If I appeal to each person's personal reason, I am aggregating them to outweigh the one. This violates 3. If I don't aggregate them, how do they outweigh? This violates the logic of weighing. So 2, 3, and 5 form a triangle of inconsistency.

