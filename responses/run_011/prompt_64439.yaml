          *   Since $S_{alloc}$ is a monotone transform, ranking is preserved.
          *   *Problem:* Commitment 2 says "A defendant at or above 0.62... regardless of group." This implies the *threshold* is on the *published score*. If the published score is $S_{cal}$, you can't satisfy 3. If the published score is $S_{alloc}$, it's not calibrated (violates 1). If you publish *both*, and say "Recommendation uses $S_{alloc}$," does that violate 2 ("The instrument does not see group membership when it produces a recommendation")? No, because the transform is group-blind.
          *   *However:* To satisfy 3 (Error Parity) with different base rates (4) using a single threshold on a monotone transform of a calibrated score is *still* mathematically impossible.
          *   *Why?* Let $S$ be calibrated. $E[S|A] = 0.51, E[S|B] = 0.26$.
          *   Let $T = f(S)$ be the allocation score. Threshold $k$.
          *   $FPR = P(T \ge k | Y=0, G)$. $FNR = P(T < k | Y=1, G)$.
          *   If $S$ is well-calibrated and informative (AUC > 0.5), the distributions $P(S|Y=1)$ and $P(S|Y=0)$ differ.
          *   With different base rates, the mix of $Y=1$ and $Y=0$ differs by group.
          *   Even with a monotone transform, you are just moving the threshold on the ROC curve. You pick *one* point on the ROC curve (defined by the threshold).
