      *   *Commitment 8:* "Score distributions will be statistically indistinguishable." If $P(S|A) = P(S|B)$ but $P(Y|A) \neq P(Y|B)$, then Calibration (1) *must* fail. If $S$ means "probability of arrest," and Group A arrests at 51% and Group B at 26%, they cannot have the same score distribution *and* be calibrated. If they have the same score distribution, the average score is the same. If calibrated, average score = base rate. $0.51 \neq 0.26$. So 1 + 4 + 8 is impossible.
      *   *The "Two-Score" Device:* The user proposes a Calibrated Score ($S_{cal}$) and an Allocation Score ($S_{alloc} = f(S_{cal})$).
