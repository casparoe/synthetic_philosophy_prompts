  # IN-SITU BIOSIGNATURE PROTOCOL: DECISION TREE v4.2
  **Mission Context:** Ocean World Sample Analysis
  **Constraint:** All branch nodes must be operational (action + recording), not chemical or theoretical.
  **Outcomes:** ALIVE, NOT ALIVE, UNDECIDED.
  **Leaf Labels:** Philosophical Positions (justifying the Outcome).

  ---

  ## THE DECISION TREE

  **NODE 1: HEREDITY OPERATOR**
  *   **Operation:** Isolate $N$ units of the candidate system. Subject to selective pressure $P$ (e.g., temperature gradient, resource scarcity) for $G$ generations. Sequence structural information $I$ at $t_0$ and $t_G$.
  *   **Record:** Correlation coefficient between ancestral $I$ and descendant $I$; variance in $I$ correlated with survival under $P$.
  *   **Branch A (High Correlation + Variance):** Proceed to **NODE 2**.
  *   **Branch B (No Correlation or No Variance):** Proceed to **NODE 3**.

  **NODE 2: SUBSTRATE DEPENDENCE OPERATOR**
  *   **Operation:** Attempt to migrate structural information $I$ to a distinct physical substrate (e.g., from wet chemistry to silicon logic, or vice versa) while maintaining function.
  *   **Record:** Functional continuity post-migration.
  *   **Branch A (Function Maintained):** **LEAF 1**.
  *   **Branch B (Function Lost):** **LEAF 2**.

  **NODE 3: BOUNDARY & MAINTENANCE OPERATOR**
  *   **Operation:** Measure chemical potential gradient $\Delta\mu$ across candidate surface. Physically disrupt 10% of surface area. Monitor $\Delta\mu$ restoration over time $T$ without external structural input.
  *   **Record:** Rate of $\Delta\mu$ restoration; existence of distinct internal/external chemistry.
  *   **Branch A (Distinct Boundary + Active Repair):** Proceed to **NODE 4**.
  *   **Branch B (No Boundary or No Repair):** Proceed to **NODE 5**.

  **NODE 4: DORMANCY OPERATOR**
  *   **Operation:** Reduce external energy flux to zero for duration $D$ (centuries equivalent). Restore flux.
  *   **Record:** Resumption of Node 3 behavior.
  *   **Branch A (Resumption):** **LEAF 3**.
  *   **Branch B (No Resumption/Decay):** **LEAF 4**.

  **NODE 5: DISSIPATION OPERATOR**
  *   **Operation:** Measure total entropy production $\dot{S}$ of candidate vs. surroundings during activity phase.
  *   **Record:** $\dot{S}_{candidate} > \dot{S}_{surroundings}$ while maintaining internal order.
  *   **Branch A (High Dissipation + Order):** **LEAF 5**.
  *   **Branch B (Equilibrium or Passive Decay):** **LEAF 6**.

  ---

  ## LEAF DEFINITIONS & CASE HANDLING

  **LEAF 1: THE DARWINIAN ACCOUNT**
  *   **Outcome:** ALIVE
  *   **Worst Case:** The **Mule**, because it possesses the physiology of life but cannot participate in the lineage selection required by this operational node.

  **LEAF 2: THE DARWINIAN ACCOUNT (DIGITAL VARIANT)**
  *   **Outcome:** ALIVE
  *   **Worst Case:** The **Flame**, because it dissipates energy but lacks the discrete structural information $I$ required to pass Node 1.

  **LEAF 3: THE AUTOPOIETIC ACCOUNT**
  *   **Outcome:** ALIVE
  *   **Worst Case:** The **Self-sustaining reaction cycle**, because it grows and fragments but lacks the distinct boundary repair mechanism measured in Node 3.

  **LEAF 4: THE METABOLISM-FIRST ACCOUNT**
  *   **Outcome:** ALIVE
  *   **Worst Case:** The **Spore**, because during the dormancy period $D$, it fails the active maintenance measurement required by Node 3, appearing indistinguishable from inert matter.

  **LEAF 5: THE THERMODYNAMIC ACCOUNT**
  *   **Outcome:** UNDECIDED (Mission Control must decide if "dissipative structure" suffices)
  *   **Worst Case:** The **Flame**, because it satisfies the entropy production criteria perfectly, forcing the protocol to classify a combustion event as biologically equivalent to a cell.

  **LEAF 6: THE ELIMINATIVIST ACCOUNT**
  *   **Outcome:** NOT ALIVE
  *   **Worst Case:** The **Mule**, because it intuitively commands moral and biological status as an organism, yet this account denies "life" is a coherent natural kind applicable to individuals.

