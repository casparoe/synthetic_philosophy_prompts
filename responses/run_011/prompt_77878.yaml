  ## PROTOCOL LIMITATIONS

  ### 1. Indistinguishable Leaves
  **Pair:** **The Metabolism-First Account (Leaf 4)** and **The Thermodynamic Account (Leaf 5)**.
  **Reason:** Operationally, measuring "metabolic network" (Leaf 4) and "dissipative structure" (Leaf 5) reduces to the same sensor readings: energy flux in, waste heat out, internal order maintained. Without assuming *function* (which is theoretical, not operational), the instrument cannot distinguish a metabolic cycle from a convection current.
  **Flag:** These leaves cannot be separated by admissible operations alone.

  ### 2. Empty/Unmapped Cells
  **Combination:** **Heredity = Pass** AND **Substrate = Non-Physical** AND **Boundary = No**.
  **Example:** The **Self-replicating program (Case 5)**.
  **Status:** **UNATTRACTIVE** to Materialist Positions.
  **Explanation:** The Autopoietic, Metabolism-first, and Thermodynamic accounts have no operational path to classify this as "Alive" because they require physical flux or boundaries. Only the Darwinian account (Leaf 1) captures this, creating a rift where the protocol returns ALIVE for software but NOT ALIVE for a chemically identical non-replicating human cell. This cell is not empty (Darwinism fills it), but it is unattractive for a mission searching for *ocean* life, as it validates digital contamination over biological samples.

  **Combination:** **Heredity = Fail** AND **Boundary = Fail** AND **Dissipation = Fail**.
  **Example:** A **Rock**.
  **Status:** **COHERENT** (Leaf 6).
  **Explanation:** This cell is fully occupied by Eliminativism. No position claims this is life.

