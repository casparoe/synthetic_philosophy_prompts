  The principle that best unifies your verdicts is that a voting system is justified only if it faithfully translates the considered preferences of the legitimate electorate into a coherent collective judgment, resisting distortion from procedural artifacts or disinterested participation while accepting strategic voting by engaged members as a permissible expression of preference intensity. I propose that we call this the Principle of Fidelity to the Engaged Will, and it serves to disentangle the three distinct threads you have been wrestling with: the legitimacy of the voters, the integrity of the aggregation mechanism, and the moral status of strategic conduct. Your intuitions have been scrambling because the Gibbard–Satterthwaite theorem focuses exclusively on the third thread, treating all strategy as a failure of the rule, whereas your judgments correctly recognize that strategy by engaged members is often a feature of responsible participation, while other failures lie in the composition of the electorate or the pathologies of the count itself.

  To see how this principle reconstructs your deliberations, consider first the distinction you drew between the coordinated bloc of sixty applied-program people and the eighty recruited colleagues. Under the Principle of Fidelity to the Engaged Will, the former are legitimate actors expressing preference intensity within a flawed system, while the latter represent a distortion of the electorate itself. Your discomfort with the recruited bloc was not about misreporting, since they voted sincerely for what was on the card, but about the fact that they lacked a genuine stake in the outcome, thereby diluting the signal of the legitimate electorate. This clause of the principle was forced by your verdict that the recruited bloc was genuinely bad despite honest voting, whereas the coordinated bloc was ordinary politics. Similarly, your rejection of the random ballot rule follows directly from the requirement for a coherent collective judgment. A lottery is immune to manipulation, but it abdicates the responsibility of aggregation entirely, producing a result that reflects no group will whatsoever. This explains why you cannot recommend it despite its strategy-proofness; it fails the fundamental test of producing a judgment rather than a chance outcome.

  The principle also clarifies your anxiety about the chair and the instant-runoff non-monotonicity case. In the twelve-person committee with cyclic preferences, the chair's control over the agenda allows procedural mechanics to override the substantive will of the group, which violates the clause resisting distortion from procedural artifacts. However, your observation that this anxiety dissolves when preferences are single-peaked is crucial and fully accommodated by the principle. In a single-peaked world, the agenda does not distort the outcome because a Condorcet winner exists and will be selected regardless of the order; thus, the procedural artifact ceases to be a distortion. This suggests that your principle is context-sensitive, judging rules not in a vacuum but against the empirical structure of the preferences they are meant to aggregate. The instant-runoff case, where gaining support causes a loss, is a clear violation of the integrity of the aggregation mechanism. You judged this worse than the coordinated bloc because it is a pathological counting mechanic that punishes sincerity and obscures the collective will, whereas the bloc's behavior was merely an adaptation to a static rule. Here you must abandon the idea that voter sincerity is the primary metric of ethical conduct. Your verdicts show you care more about the rule's robustness than the voters' honesty, as evidenced by your preference for range voting with strategists over plurality with sincere voters. You should formally abandon the search for a rule that incentivizes sincerity above all else, as this is what the Gibbard–Satterthwaite theorem tells you is impossible, and instead focus on rules that remain faithful to the engaged will even when voters strategize.

  Applying this principle to the three new situations you proposed yields clear guidance. First, consider a faction that fields two nearly identical nominees to split the opposition under plurality. This tactic exploits a pathological counting mechanic, much like the spoiler effect you identified earlier. The principle judges the rule as defective because it allows the duplication of candidates to distort the translation of preferences into outcomes, but it does not condemn the faction members themselves, provided they are engaged members of the legitimate electorate. Their conduct is permissible strategy, but the outcome is a failure of fidelity, recommending that your group reject plurality for a rule less sensitive to clone candidates. Second, consider a donor who funds a campaign that sincerely changes what members prefer before any ballot is cast. This falls outside the scope of aggregation mechanics and into the realm of preference formation. The principle accommodates this as acceptable, provided the donor does not recruit disinterested participants or coerce members. Since the electorate remains legitimate and the preferences are genuinely held at the time of voting, the aggregation remains faithful to the engaged will. This distinguishes it from the recruited bloc case, where the preferences were manufactured along with the voters. Third, consider quadratic voting, where the intensity a voter expresses can be purchased. This case tests the boundary of legitimate expression versus external distortion. If the ability to purchase intensity is tied to wealth rather than stake, it risks allowing external actors to simulate engagement, violating the legitimacy clause. However, if the system ensures that only legitimate members can purchase votes and that the cost reflects a genuine trade-off within the community, it may enhance fidelity by capturing preference intensity more accurately than one-person-one-vote. The principle suggests caution here: it is acceptable only if the purchase mechanism does not allow the electorate to be effectively hijacked by those with external resources rather than internal stake.

  Finally, you asked whether the principle I have outlined is about manipulation in the theorem's sense at all. The honest answer is that it is not, or at least not primarily. You have been using one word for two distinct complaints. The Gibbard–Satterthwaite theorem addresses the inevitability of strategic misreporting in certain rule designs, which is a complaint about the design of rules enabling specific voter conduct. Your other complaints, however, are about the legitimacy of the electorate, the coherence of the collective output, and the stability of the aggregation against procedural exploitation. The chair's agenda control in a cyclic world is not manipulation by voters but manipulation by the procedure. The recruited bloc is not manipulation of the count but manipulation of the electorate. The random ballot is not manipulable but is nevertheless unacceptable because it fails to aggregate. By separating these concerns, you can see that the theorem's verdict is necessary but not sufficient for your governance problem. You should stop asking whether a rule is strategy-proof and start asking whether it is fidelity-proof. Does it protect the considered will of the engaged members from being drowned out by noise, procedure, or pathology? If you adopt this framing, you will find that your working group can move past the paralysis of the theorem. You will be able to recommend a rule not because it eliminates strategy, which you now know is impossible, but because it channels the strategic energy of engaged members into a outcome that reliably reflects their collective judgment without being hijacked by the disinterested or the procedural quirks of the count itself.
