answer: |-
  # Seminar Plan: The Calibration Lag
  **Topic:** Molyneux's Problem (via Project Prakash data)
  **Time:** 90 Minutes
  **Students:** 16 (4 groups of 4)
  **Goal:** Demonstrate that cross-modal recognition is a *process* of calibration, not a binary state of "knowing," thereby dissolving the traditional Empiricist/Rationalist stalemate.

  ## 1. Materials & Setup
  **Budget:** Near Zero.
  **Room:** Movable desks arranged in 4 pods of 4.

  **Per Pod:**
  *   **4 "Novel Objects":** Distinct 3D shapes made of twisted pipe cleaners or bent coat-hanger wire. (Crucial: They must be *novel* asymmetrical blobs, not cubes/spheres. Label them A, B, C, D underneath so students can't see the label while holding).
  *   **4 "Visual Cards":** High-contrast black-and-white photos of those exact objects, taken from a fixed, non-obvious angle (e.g., top-down or extreme profile).
  *   **4 "Distractor Cards":** Photos of *similar* wire shapes that do not match the objects in the box.
  *   **Stopwatch/Phone.**
  *   **Index Cards & Pens** (for pre-commitment).

  **Instructor:**
  *   Projector/Screen.
  *   Slide deck with: (1) The Pre-commitment Prompt, (2) The Prakash Data Graphs (Ostrovsky/Held), (3) The Molyneux Letter excerpt.

  ---

  ## 2. Minute-by-Minute Timeline

  ### 00:00 – 00:10: The Pre-Commitment (Silent)
  *   **Action:** As students enter, hand them an index card. Do not greet them warmly; keep the mood clinical.
  *   **Prompt on Board:** *"Imagine you have perfect knowledge of Object X through Touch. You are now shown a 2D Image of Object X. You have never seen this object before. You have never mapped Touch-to-Image for this class of objects.*
  *   *Question: Can you correctly identify the image of the object you are holding on your first try, without feedback?*
  *   *Verdict: YES / NO / UNCERTAIN.*
  *   *Confidence (0-100%): _____"*
  *   **Constraint:** Do not mention Molyneux, blindness, or philosophy. Frame this as a "Cognitive Psychology Pilot Task."
  *   **Collection:** Collect the cards immediately. Do not look at them yet.

  ### 00:10 – 00:35: The Calibration Task (The Activity)
  *   **Phase 1: T=0 (The "Molyneux Moment")**
      *   Instruct students: "Pick up Object A. Do not look at the cards yet. Feel the geometry. Now, look at the spread of Visual Cards. Select the one that matches Object A. You have 10 seconds. No rotating the object to match the angle."
      *   **Record:** Each student writes down their choice and confidence.
      *   **Reveal:** Reveal the correct match.
      *   **Likely Outcome:** Accuracy will be mixed (50-70%). Some will fail. This is critical. It simulates the *lack of automaticity*.
  *   **Phase 2: T=5 (The "Learning Curve")**
      *   Instruct students: "You now have 5 minutes. Pick up each object, look at its matching card, and study the relationship. Rotate the object. Find the features that correspond."
      *   **Action:** Let them calibrate. They will chatter. Let them.
  *   **Phase 3: T=10 (The Post-Test)**
      *   Instruct students: "Put objects away. I will show you a new angle of one of the objects on the board (project a new photo of Object B). Point to the physical object in your box that matches this new image."
      *   **Likely Outcome:** Near 100% accuracy.
      *   **Point:** They didn't get "smarter"; they got *calibrated*.

  ### 00:35 – 00:50: The Empirical Reveal
  *   **Action:** Project the **Project Prakash Data** (Ostrovsky, Held, et al., 2011).
      *   Show the graph: Accuracy vs. Time Since Surgery.
      *   **T=0 (Immediately post-op):** Performance is at chance (just like their Phase 1).
      *   **T=5 Days:** Performance jumps to near ceiling (just like their Phase 3).
  *   **Narrative:** "These are not psychology students. These are children born blind, cataracts removed. T=0 was the first time light hit their retinas."
  *   **Question to Class:** "Look at your Pre-Commitment cards. How many of you voted YES for immediate recognition? How many voted NO?"
  *   **Reveal:** Read a few anonymous predictions. Highlight the error.
  *   **The Name Drop:** "This is Molyneux's Problem. But notice: The data makes the traditional question impossible to answer."

  ### 00:50 – 01:20: The Debrief (Conceptual Joints)
  *   **Joint 1: The Binary Trap.**
      *   Traditional Debate: Locke (No, needs experience) vs. Leibniz (Yes, geometric truths are innate).
      *   The Data: The answer changes based on *when you ask*.
      *   **Discussion:** If you ask at T=1 hour, it's "No." If you ask at T=1 week, it's "Yes." Is the question "Can he see?" or "How long does calibration take?"
  *   **Joint 2: What is 'Seeing'?**
      *   Refer to their Phase 1 failure. "You have eyes. You have vision. Why did you fail?"
      *   **Target Insight:** Because 'seeing' the match isn't raw sensation; it's a *hypothesis* linking two data streams.
      *   The patients weren't blind to *light*; they were blind to *meaning*.
  *   **Joint 3: The "Rapid Learning" Wrinkle.**
      *   Why did they learn so fast (in your activity and the patients)?
      *   If it were purely Empiricist association (Hume), it should take months. It took days/minutes.
      *   **Implication:** There *is* a structural bridge (geometry), but it's not "pre-installed." It's "plug-and-play."

  ### 01:20 – 01:30: Wrap & Exit Ticket
  *   **Prompt:** "Molyneux asked: 'Would he know which is the Globe, which the Cube?' Based on today, rewrite the question so it is empirically answerable."
  *   **Collection:** Collect as they leave.

  ---

  ## 3. Predictable Pitfalls & Derailments

  **1. The "I'm Not Blind" Objection**
  *   **What happens:** A student says, "This activity is fake. I'm not blind. I've seen wire before. The Prakash kids had never seen *anything*."
  *   **Why it derails:** It dismisses the structural analogy (calibration lag) in favor of the phenomenological difference.
  *   **Your Counter:** "Exactly. You had *prior* calibration. That's why your T=0 was 60% and theirs was 50%. But you still needed Phase 2 to hit 100%. The *mechanism* of calibration is the same, even if the starting baseline differs. The point isn't that you are them; it's that recognition requires a rule, and rules take time to apply."

  **2. The "Qualia" Pivot**
  *   **What happens:** Someone argues, "But do they *see* the shape the way we do? That's the real question."
  *   **Why it derails:** It moves from epistemology (how do they know?) to metaphysics (what is it like?), which stalls the empirical focus.
  *   **Your Counter:** "We can't measure 'what it's like.' We can only measure 'can they point to it?' Molyneux's question was behavioral ('tell which is which'). Let's stick to the behavioral data. If they can point, does the internal experience matter for the definition of 'sight'?"

  **3. The "Clever" Geometric Solution**
  *   **What happens:** A math student says, "A sphere has no edges, a cube does. That's a topological invariant. It doesn't need learning."
  *   **Why it derails:** It assumes the visual system automatically extracts topology. The Prakash data shows it doesn't, not immediately.
  *   **Your Counter:** "Theoretically, yes. But the visual system has to *find* those edges first. For the newly sighted, the visual field is a blooming buzz of color without segmented objects. They have to learn where the edge *is* before they can count them. Your topology argument assumes the objects are already segmented."

  ---

  ## 4. The "Impossible" Feature (What You Must Supply)

  **The Phenomenology of T=0**
  *   **The Limit:** Your students' Phase 1 failure is *intellectual* confusion ("Which photo matches this wire?"). The Prakash patients' Phase 1 failure was *perceptual* confusion ("Where does the object end and the background begin?").
  *   **What to Say:** In the debrief, you must explicitly narrate this gap. "When you failed Phase 1, you saw a clear photo and a clear wire, and you couldn't link them. When Patient S.B. failed, he saw a wash of light and felt a hard object, and he didn't know they were the *same thing*. Your activity simulates the **mapping problem**, but I have to tell you that for them, the **input problem** was worse."
  *   **Why:** If you don't supply this, they will underestimate the Empiricist position. They need to know that "Seeing" for the newly sighted is not "Seeing for us but blurry." It is "Seeing as unsegmented noise."

  ## 5. Instructor Notes on the "Collapse"
  The goal is to show that the Molyneux debate stalled because it treated "Vision" as a static state.
  *   **Traditional View:** Vision = A Switch (On/Off).
  *   **Prakash View:** Vision = A Dial (Calibration Level).
  *   **Your Job:** When a student tries to argue for a hard "Yes" or "No," point to their own Phase 1 vs. Phase 3 data. Ask: "Which version of you gets to vote? The T=0 you or the T=10 you?"
  *   **The Takeaway:** The question isn't "Is knowledge innate?" It's "What is the half-life of cross-modal calibration?" This shifts the seminar from 17th-century metaphysics to contemporary cognitive science, which is where the real action is.
