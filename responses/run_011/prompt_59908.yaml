  **THE REGIONAL GAZETTE | SUNDAY MAGAZINE**
  **ASK DR. AUDEN**

  *[Editor's Note: Dr. Auden has written to this office four times requesting the removal of the honorific from her byline, citing retired status. We maintain it based on public expectation.]*

  **Dear Dr. Auden,**
  My son is thirty-four. Since March, he has not left his bedroom. He speaks to people who are not there and has stopped eating solid food. He is becoming thin and frightening. I am exhausted. The local hospital says I can petition for an emergency hold if I claim he is a danger to himself. Should I do it? I want him back.
  **— Worried in Oakhaven**

  **Dear Worried,**
  You want the son you remember, not the man he is. He is not eating; this is a fast. He is speaking to invisible companions; this is a conversation you cannot hear. You ask if you should have him taken. To do so is to hire men to drag him into a building and force chemicals into his blood because his behavior distresses you. This is not medicine; it is policing.

  If he starves, he dies. This is a consequence of his conduct, not a symptom of a disease. There is no lesion in his brain that forces starvation. You cannot save him from himself without destroying him as a person. If you love him, let him be responsible for his own body, even if the cost is his life. To do otherwise is to declare him a pet.
  **— Dr. Auden**

  **Dear Dr. Auden,**
  My husband loses our savings at the track every weekend. I am furious. A counselor suggested I view his gambling as an illness, like diabetes, so I can stop being angry. Is it a disease?
  **— Ready to Snap**

  **Dear Ready,**
  Gambling is not a pathology; it is an expenditure. You do not ask if diabetes causes you to spend money on insulin; you ask if the cost is sustainable. Your husband is choosing to spend your shared resources on a hobby that ruins you. Calling it a disease absolves him of the choice.

  Do not manage his illness. Manage your finances. Separate your accounts. If he cannot respect the boundary of your survival, you must respect it yourself. Fury is a signal that a contract is being broken. Do not medicate the signal. Enforce the contract or terminate the partnership.
  **— Dr. Auden**

  **Dear Dr. Auden,**
  When I told the hospital I disagreed with their treatment, they called my disagreement a symptom. You call their diagnosis a metaphor. Both seem like ways to relabel my refusal. How am I supposed to tell which one is true?
  **— Skeptic in Dover**

  **Dear Skeptic,**
  You tell by looking for the broken tissue. If a leg is broken, an X-ray shows it. If a mind is "broken," there is only the word of the observer. The hospital claims physics; I claim language. One relies on force to prove its point, the other on logic. If you must be locked up to validate the diagnosis, the diagnosis is a moral judgment wearing a lab coat.
  **— Dr. Auden**

  ***

  *Send letters to askdrauden@gazette.com. Due to volume, personal replies are impossible.*
  *Dr. Auden's book, **The Sovereign Self**, is available at local booksellers.*
