  2.  **Deconstruct the Jury's Implicit Theory:**
      *   *Observation:* Random selection (lot) + Compulsion + Cross-section requirement VS. Voir dire (strikes) + Instructions to ignore outside knowledge + Unanimity + Secrecy.
      *   *Tension:* Why demand a microcosm (cross-section) but then strip away the specific knowledge/experiences that make people part of that microcosm (nurse example)?
      *   *Hypothesis:* It's not purely epistemic (truth-tracking), because experts are sidelined. It's not purely representational (microcosm), because the microcosm is lobotomized regarding outside info. It's not purely majoritarian (unanimity required).
      *   *Synthesis:* The theory is **Political Legitimacy through Procedural Fairness**. The verdict is legitimate not because it is necessarily *true* (epistemic) nor because it represents the *will* of the people (representational), but because it is the product of a process that treats the defendant and the state as equals before a peer group that is *capable* of impartiality.
      *   *The "Nurse" Paradox:* Her presence satisfies the *political* need for a peer (someone from the community). Her silence on medical knowledge satisfies the *epistemic* need for a level playing field (evidence only). The theory is hybrid: Legitimacy comes from the *source* (the community), but correctness comes from the *constraints* (the evidence).
      *   *Consistency Verdict:* Can they be made consistent? Yes, but only under a specific hybrid theory: **Democratic Legitimacy via Constrained Impartiality.** The cross-section ensures the *authority* to judge belongs to the people. The purging ensures the *exercise* of that authority is neutral. If it were purely epistemic, you'd want experts. If it were purely representational, you'd want them to vote their interests. The jury is a *sovereign* body acting as a *neutral* arbiter.

