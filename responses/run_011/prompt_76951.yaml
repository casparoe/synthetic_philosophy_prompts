      *   *Theory:* **Epistemic Democracy / Deliberative Representation.** It assumes ordinary people *can* learn (unlike the jury's suspicion of outside knowledge) and should represent the demographic makeup to legitimize the *recommendation* to the elected body.
      *   *Difference:* Jury = Binding, Secret, Unanimous, Ignorant (of outside info). Assembly = Advisory, Public, Majority, Educated (by experts).

  4.  **Drafting the Prose Reconstruction:**
