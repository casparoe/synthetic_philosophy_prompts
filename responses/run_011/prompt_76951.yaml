      *   **Task:** Reconstruct the implicit theory of the jury, compare it to the citizens' assembly, resolve (or identify) tensions, and specify what would change under a purely epistemic theory.
      *   **Constraints:** No case citations, no doctrine names, no reading list. Treat procedural descriptions as accurate. Conceptual exercise only.
      *   **Format:**
          1.  Short prose reconstruction of the jury's implicit theory + verdict on consistency (cross-section vs. bias-purging).
          2.  Table with specific columns (Feature, Presupposed commitment, Rivals excluded, Status, Change if replaced).
