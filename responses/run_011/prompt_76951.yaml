answer: |-
  ### The Implicit Theory of the Jury

  The jury system presupposes a theory of **Legitimacy via Constrained Peerhood**. It claims that state coercion (punishment or liability) is morally permissible only if authorized by a sample of the governed (the political/representational claim), but that this authorization is valid only if the sample acts as a neutral blank slate rather than as advocates for their own demographics (the epistemic constraint). This resolves the tension of the emergency-room nurse: her *presence* satisfies the political requirement that the state be judged by its subjects, granting the verdict authority; her *silence* on medical matters satisfies the procedural requirement that the state prove its case without competing against private knowledge, granting the verdict fairness. The cross-section and bias-purging are consistent, but only under this hybrid view: the institution requires the *body* of the community to confer legitimacy, while requiring the *mind* of the community to be temporarily standardized to ensure neutrality. Under a purely epistemic theory (truth-tracking), these requirements are incoherent, as expertise would be sought rather than excluded. Under a purely representational theory, they are also incoherent, as lived experience would be amplified rather than suppressed.

  ### Comparative Analysis of Institutional Features

  | Feature | Presupposed commitment | Rivals excluded | Status | Change if replaced (with pure Epistemic/Truth-Tracking theory) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Compulsion and lot** | Civic duty is a universal obligation; randomness prevents self-selection bias. | Pure voluntarism (markets); Pure meritocracy (experts only). | Strictly presupposed | Retain lot for diversity of heuristics, but remove compulsion; allow opt-outs for those unwilling to engage cognitively. |
  | **Peremptory and for-cause strikes** | Parties must trust the panel; bias destroys the appearance of fairness. | Pure random selection (no strikes); Pure expert selection. | Strictly presupposed | Eliminate peremptory strikes; retain only "inability to process evidence" causes. Maximize panel size to average out error. |
  | **Fair-cross-section requirement** | Legitimacy requires the sovereign people to be present in the room. | Pure epistemic (best minds only); Pure majoritarian (elected reps only). | Strictly presupposed | Replace with "cognitive diversity" requirement. Demographics matter only insofar as they correlate with distinct reasoning styles. |
  | **Instruction to disregard outside knowledge** | Fairness requires a level playing field; the state must prove its case within the room. | Pure epistemic (use all available truth); Pure representational (vote your experience). | Strictly presupposed | **Radical change:** Allow research, consult personal expertise, and weigh outside evidence. The "evidence" becomes data, not a closed universe. |
  | **Unanimity** | Coercion requires absolute consensus to protect the minority from error. | Majoritarianism (efficiency); Epistemic aggregation (probability). | Merely compatible | Move to supermajority or Bayesian aggregation. Truth does not require consensus; a 9-3 split may track reality better than a coerced 12-0. |
  | **Secrecy of deliberation** | Jurors must be free from social pressure and retaliation to vote conscience. | Public accountability (transparency); Epistemic scrutiny (peer review). | Merely compatible | Publish transcripts or reasoned opinions. Truth benefits from external critique and error-correction by the public. |
  | **Single non-renewable service** | Prevents the formation of a professional class with institutional interests. | Career judiciary; Repeated service (expertise accumulation). | Strictly presupposed | Allow repeat service for high-complexity cases. Truth-tracking improves with experience and institutional memory. |
  | **Majority rule in legislatures** | Efficiency and accountability; voters can punish the majority party later. | Consensus democracy; Unanimity rules. | Underdetermined | Retain majority rule but require reasoned justification for laws. Truth in legislation is less about facts and more about value trade-offs. |
  | **Publicity of legislative votes** | Accountability requires voters to know who decided what. | Secret ballots (protect from coercion); Epistemic anonymity (protect from status bias). | Underdetermined | Retain publicity. In law-making, the "truth" is the political will, which requires identification of the willer. |
  | **Expert briefing of the assembly** | Laypeople can learn complex truths if taught neutrally. | Jury model (ignorance is virtue); Pure populism (intuition is sufficient). | Strictly presupposed | **Amplified:** Experts become voting members or are subject to cross-examination by the panel. Briefings are adversarial, not pedagogical. |
  | **The assembly's advisory status** | Ultimate sovereignty remains with elected officials; assembly provides legitimacy cover. | Direct democracy (binding); Technocracy (binding expert rule). | Merely compatible | Make recommendations binding if they meet specific epistemic criteria (e.g., cost-benefit thresholds). Remove the "advisory" firewall. |

  ### Bottom Line

  The genuinely unresolvable tension lies between the demand for a representative cross-section and the demand for ignorance, which can only be reconciled by accepting that the jury's primary function is political legitimacy rather than truth-seeking. The jury and the citizens' assembly rest on fundamentally different theories: the jury is a **legitimizing constraint** on state power that requires neutrality, while the assembly is a **deliberative engine** for policy that requires education. They share a selection mechanism (lot) but diverge on the epistemic role of the participant, meaning the assembly cannot simply inherit the jury's justification without abandoning its goal of informed recommendation.
