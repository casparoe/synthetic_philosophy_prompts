      *   *Refining the "Change if replaced" column:* If we switch to pure Epistemic (Truth-Tracking), the Jury becomes a panel of experts. The Assembly becomes a technocratic board. I need to be specific about procedure changes (e.g., removing peremptory strikes, allowing research).

  9.  **Final Polish:** Check constraints again. No case citations. Organize exactly as requested.

      *(Self-Correction on the "Consistency" Verdict)*: The prompt asks if the cross-section and bias-purging can be made consistent. I need to be firm. They are consistent *only* if the goal is **Legitimacy of Coercion**, not Truth. If the goal were Truth, they are inconsistent. I will argue the jury's primary goal is Legitimacy, making them consistent under that specific umbrella.

      *(Self-Correction on Assembly)*: The Assembly is different. It *wants* the knowledge (via briefing). So the theory is different.

      *(Final check on Bottom Line)*: Keep it tight.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).

      *Wait, one nuance:* The prompt asks "Which of these [epistemic, political, representational] can the practice be shown to require, and which merely happen to fit it comfortably?" I need to make sure the table reflects this distinction in the "Status" or "Presupposed commitment" column. I will use the "Status" column to denote "Strictly Presupposed" vs "Merely Compatible".

