  5.  **Drafting the Table:**
      *   *Columns:* Feature, Presupposed commitment, Rivals excluded, Status, Change if replaced.
      *   *Rows:* Need to cover all listed features (Compulsion/lot, strikes, cross-section, disregard knowledge, unanimity, secrecy, service term, legislature majority, legislature publicity, assembly briefing, assembly advisory).
