answer: |-
  **PART ONE: EXAMINATION PAPER**

  **UNIVERSITY OF LONDON**
  **BSc EXAMINATIONS IN PHILOSOPHY**
  **MODULE: MORAL PSYCHOLOGY AND ETHICS (PHIL304)**
  **TIME ALLOWED: 2 HOURS**

  **INSTRUCTIONS TO CANDIDATES**
  Answer TWO questions. All questions carry equal weight (25 marks). Calculators are not permitted. Dictionaries are not permitted.

  **QUESTION 3**

  Consider an agent who initially finds acts of significant generosity psychologically costly. She notices that her reluctance manifests subtly—in tone, delay, or body language—and that these manifestations humiliate the recipients of her aid. To remedy this, she deliberately engineers a change in her own character. She employs behavioural techniques, cognitive rehearsal, and environmental restructuring to cultivate a genuine desire to give. Over time, the effort succeeds: she now gives spontaneously, with pleasure, and without residual reluctance.

  Consider two versions of this case. In the first, her initial motivation for engineering this change was strictly moral: she wished to remove the harm caused by her visible reluctance. In the second, her initial motivation was non-moral: she found her own grudgingness aesthetically revolting, or she desired the social reputation of being wonderful.

  Assess the moral worth of her current actions. Does the worth of her present generosity inherit from the reasons for which she originally engineered her character? If so, does this generate a regress, and where does the chain stop? If not, explain why the history of the desire is irrelevant. Finally, discuss whether the distinction between acting from duty and acting from character survives in cases where the character itself was voluntarily constructed.

  ***

  **PART TWO: MODEL ANSWER**

  The central tension lies between the current phenomenology of the agent's motive and the historical pedigree of that motive. If moral worth depends solely on the current motive acting from duty or virtue, the agent's actions now possess full worth: she gives willingly, without conflict. However, if worth is sensitive to the causal history of the motive, the origin of the engineering becomes critical.

  An inheritance account claims that the worth of the current action derives from the worth of the original decision to engineer the desire. In the first version of the case, the original motive was moral (preventing humiliation). This suggests a positive inheritance. However, this invites a regress: if the worth of the current action depends on the worth of the engineering act, does the worth of the engineering act depend on a prior act of will? To avoid an infinite regress, we must identify a stopping condition. The most non-arbitrary stopping point is current endorsement. If the agent currently identifies with her generous character and would choose to maintain it upon reflection, the historical chain is severed. The current motive is authentically hers, regardless of its causal origins. To deny this is to imply that we are forever bound by the purity of our distant past motivations, which undermines the possibility of moral growth.

  In the second version, the origin is non-moral (aesthetic disgust or vanity). An inheritance account would here deny moral worth to the current actions, as the causal chain begins in vanity. However, this overlooks a crucial feature of the original situation: the humiliation of the recipient. Even if the agent was motivated by aesthetics, she was responding to a right-making feature of the situation (the harm caused by her reluctance). This makes the original engineering look less like self-improvement and more like moral attention, even if labelled otherwise by the agent. Therefore, the distinction between the moral and non-moral origin is less stable than it appears. The vanity variant still responds to moral reality, even if via a non-moral prompt.

  Furthermore, we must distinguish this engineered desire from a disguised appeal to consequences. If the agent gives only to maintain her reputation, the action lacks moral worth. But the case specifies the desire itself has become real and unforced. She is not calculating consequences; she is acting from a settled disposition. The fact that this disposition was built does not collapse the case into ordinary consequentialism. The mechanism of acquisition does not dictate the structure of the current motive.

  Finally, does the distinction between duty and character survive? Kantian accounts suggest acting from inclination (even cultivated inclination) lacks the worth of acting from duty. However, if the character was voluntarily constructed to align with duty, the distinction blurs. The agent has made duty her second nature. To insist on a distinction here is to privilege conflict over harmony. If the agent gives willingly because she has made herself into someone who values others, she is not bypassing morality; she is embodying it. The voluntary construction of character demonstrates a higher-order commitment to moral requirements than sporadic acts of duty might.

  Thus, the moral worth of the current action is not tainted by the origin, provided the agent currently endorses the motive. The regress stops at current identification. The vanity variant fails to diminish worth because the original engineering responded to moral harm, and the current motive is genuine. The duty/character distinction dissolves when character is the intended product of moral will.

  ***

  **PART THREE: MARKING SCHEME (25 MARKS)**

  **A Grade (20–25 marks)**
  *   **Regress Analysis (6 marks):** Explicitly identifies that an inheritance story requires a stopping condition. Proposes a non-arbitrary stop (e.g., current endorsement/identification) rather than accepting infinite regress or arbitrary cutoff.
  *   **Moral Attention (5 marks):** Recognizes that the "humiliation of the recipient" is a right-making feature. Argues that even the "vain" variant involves responding to moral reality, destabilizing the strict moral/non-moral origin divide.
  *   **Structure of Motive (5 marks):** Distinguishes engineered desire from consequentialist calculation. Explains why having a real desire differs from acting to maintain a reputation.
  *   **Duty/Character Distinction (5 marks):** Addresses whether the distinction survives. Argues that voluntary character construction bridges the gap between duty and inclination.
  *   **Clarity/Structure (4 marks):** Argument is tight, no fluff, directly answers all parts of the prompt.

  **B Grade (15–19 marks)**
  *   **Regress Analysis (3 marks):** Notices the inheritance problem but offers a vague stopping condition (e.g., "it just stops") or misses the regress entirely.
  *   **Moral Attention (2 marks):** Treats the vanity variant as strictly non-moral without noticing the response to humiliation.
  *   **Structure of Motive (3 marks):** Discusses desire vs. calculation but conflates the engineering process with current calculation.
  *   **Duty/Character Distinction (3 marks):** States the distinction blurs but does not explain why voluntary construction matters.
  *   **Clarity/Structure (4 marks):** Clear but less penetrating.

  **C Grade (10–14 marks)**
  *   Describes the case without analyzing the worth.
  *   Applies labels (Kant, Aristotle) without fitting them to the specific mechanics of engineering.
  *   Ignores the vanity variant or the regress question.

  **COSTLY MISTAKES (FAILURE MODES)**

  1.  **The Fluency Trap (Cost: 10 marks):** The student memorizes labels ("motive of duty," "integrity objection," "virtue as second nature") and writes 800 fluent words defining them without applying them to the *engineering* aspect. They discuss moral worth generally but ignore the specific constraint of *voluntary character construction*.
  2.  **The Genetic Fallacy (Cost: 5 marks):** The student argues the current action is worthless *solely* because the origin was vain, without addressing whether the current motive is independent. They fail to see the regress problem.
  3.  **The Consequentialist Collapse (Cost: 5 marks):** The student assumes that because the character was built for a result (pleasure/reputation), the current action is merely consequentialist, ignoring the prompt's stipulation that the desire is now "real and unforced."

  \answer{Regress stops at current endorsement.}
