answer: |-
  To the members of the review panel, regarding the proposal to augment our risk assessment framework with a field designated as the weight of argument, I offer the following analysis of the philosophical concepts involved. The proposal invokes the dispute between John Maynard Keynes and Frank Ramsey to justify adding a metric based on the number of causally independent streams of evidence. While the intention to capture the robustness of our judgements is sound, the theoretical grounding requires careful scrutiny against Keynes's actual account in A Treatise on Probability. To understand whether this implementation succeeds, we must first establish what weight of argument is on Keynes's own account, how it relates to the probability relation itself, and why he believes it resists numerical measure in most practical contexts.

  For Keynes, probability is not a frequency of occurrence nor a subjective degree of belief, but a logical relation between two propositions, specifically the evidential proposition h and the conclusion proposition a. This relation, denoted a/h, expresses the degree of rational belief warranted by the evidence. Crucially, Keynes argues that this relation is not always susceptible to numerical measurement. He contends that we can only assign a numerical value to a probability when specific conditions are met, primarily involving the Principle of Indifference. This principle states that if there is no known reason for preferring one alternative to another, then relative to such knowledge, the assertions of each alternative have an equal probability. However, Keynes places strict constraints on this principle. The alternatives must be indivisible and of a uniform form. If the evidence can be split into sub-cases in multiple ways, the principle yields contradictory results, rendering numerical measurement impossible. Consequently, for Keynes, many probabilities are not merely unknown but are incomparable. We cannot say one is greater than the other, nor that they are equal, because the logical structure of the evidence differs too fundamentally to allow a common measure.

  Distinct from this probability relation is the weight of argument. Keynes defines weight as the amount of relevant evidence supporting the conclusion. While probability measures the balance of evidence for versus against a proposition, weight measures the absolute quantity of evidence upon which that balance is struck. As we acquire more evidence, the weight increases, even if the probability remains unchanged. For example, if new evidence supports the conclusion exactly proportionally to the old evidence, the probability stays the same, but the argument becomes heavier. Keynes suggests that weight does not admit of numerical measure because there is no common unit for counting pieces of evidence that differ in kind. We cannot simply count streams of evidence if those streams are not comparable in their relevance or logical import. This leads to the first point of divergence with the proposal. The analysts propose scoring weight from zero to five based on a count of independent evidence streams. This assumes that evidence streams are fungible units that can be summed, whereas Keynes insists that the heterogeneity of evidence often prevents such aggregation. Furthermore, the proposal links low weight to a widened interval. While this aligns with the intuition that less evidence warrants less precision, Keynes distinguishes weight from the probability interval itself. For Keynes, the interval represents the range of plausible probability values due to incomparability or lack of numerical conditions, whereas weight is a separate dimension describing the completeness of the evidence underlying whatever probability relation exists.

  To see whether the proposal survives contact with this account, consider the concrete case of the two urns. We have two urns, each containing one thousand balls. Of the first urn, we know that black and white balls are present in equal numbers. Of the second urn, we know only that every ball is either black or white, with the proportions entirely unknown. We are asked to assess the probability of drawing a black ball from each. In Keynes's framework, using the Principle of Indifference on the second urn, we might assign a probability of one-half to drawing a black ball, just as we do for the first urn where the frequency is known. Thus, the probability relation a/h is identical for both cases. However, the weight of the argument differs profoundly. In the first case, the evidence is complete regarding the constitution of the urn; the weight is maximal. In the second case, the evidence is minimal; the weight is low. The proposal suggests that the second case should receive a lower weight score and thus a wider interval. This captures the intuition that the judgement for the second urn is less secure. However, identifying weight strictly with the width of the reported interval conflates the two concepts. For Keynes, the probability might be non-numerical in the second case precisely because the conditions for the Principle of Indifference are not met securely, but weight is the measure of how much evidence we have, not the measure of our uncertainty about the probability value itself.

  Furthermore, we must clarify what weight is not. It is not a second-order probability, meaning it is not a probability about a probability. It is not merely a degree of confidence in one's first-order probability, although it influences confidence. It is certainly not simply a count of independent evidence streams, as the proposal suggests. Keynes's criterion of relevance commits him to the view that new evidence increases weight only if it is relevant. Irrelevant evidence, even if independent, adds nothing to the weight. If a stream of evidence tells us nothing about the truth of the conclusion, counting it as weight is a category error. The proposal's rule that a score of three or more licenses a narrow interval risks incentivizing the accumulation of independent but potentially weak or irrelevant streams to game the system, rather than seeking genuinely relevant evidence that increases the logical weight of the argument.

  This brings us to the normative claim that where two arguments yield the same probability, the one resting on the greater weight is to be preferred. We must explain what work this preference is doing. If probability alone measures the rational degree of belief, as Ramsey insisted, then two arguments with the same probability should command the same action. Ramsey argued that Keynes's weight is merely a psychological feeling of confidence, not a logical property that should influence rational decision-making. On Ramsey's view, if the logical probability is one-half, the rational bet is the same regardless of whether the evidence is scant or abundant. The case for Keynes, however, is that weight affects the stability of the probability upon the arrival of new evidence. A high-weight probability is robust; it is unlikely to shift dramatically with new information. A low-weight probability is fragile; a single new piece of evidence could overturn it. Therefore, the preference for greater weight is a preference for security and stability in decision-making, not a contradiction of the probability measure itself. Keynes is entitled to this preference if we view rational action as requiring not just the best current estimate but the most reliable foundation for that estimate. My verdict is that Keynes is correct in a practical context such as ours. While Ramsey is logically rigorous regarding the definition of belief, public risk assessment requires prudence. We should prefer judgements that are less likely to be overturned by tomorrow's news. However, the proposal's mechanism of counting streams is a crude proxy for this stability. A single highly relevant stream may provide more weight than three tangential ones.

  Finally, we must address why translating Keynes's uncertainty into contemporary idioms is at least partly a misreading. There is a temptation to equate Keynes's distinction with the ambiguity aversion demonstrated in the Ellsberg paradox, where agents prefer known risks to unknown probabilities. While similar, Ellsberg's framework is based on preference axioms and subjective utility, whereas Keynes's is based on objective logical relations. Equating them reduces Keynes's logical weight to a psychological bias. Similarly, modeling this using non-additive probabilities or a credal set of probability functions as in imprecise probability theory captures the interval aspect but misses the distinct concept of weight. In imprecise probability, the set of functions represents the uncertainty itself. For Keynes, weight is distinct from the probability relation; it is a property of the evidence supporting the relation, not the range of the relation itself. Translating weight into the width of a credal set collapses the distinction Keynes took pains to maintain. Regarding The General Theory, the state of confidence Keynes appeals to when discussing long-term expectation is best read as weight under another name, but with a psychological overlay. In the Treatise, weight is logical. In the General Theory, confidence is the psychological reliance on that weight in the face of an unknowable future. It is not something different again, but rather the application of the logical concept to the psychological realities of investment and expectation.

  In conclusion, the proposal correctly identifies a gap in our current framework by seeking to account for the robustness of evidence, not just the likelihood of outcomes. However, it misinterprets Keynes's weight of argument as a countable quantity of evidence streams rather than the absolute amount of relevant evidence. It also conflates weight with the precision of the probability interval. While the intuition that low evidence should warrant wider intervals is sound risk management, billing it as a direct implementation of Keynes's weight is philosophically imprecise. I recommend we accept the intention to capture evidence robustness but decouple the metric from the specific claim of implementing Keynes's weight. We should define the metric by the relevance and completeness of evidence rather than a simple count of streams, ensuring that we do not confuse the quantity of data with the weight of the argument. This preserves the prudential value of the Keynesian insight without committing us to a disputed philosophical interpretation that may not hold up under logical scrutiny.
