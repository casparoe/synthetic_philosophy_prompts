answer: |-
  Here is the blunt assessment and the procedure you asked for, written in British English as requested.

  ### 1. The Blunt Truth: What This Form Can and Cannot Do

  You cannot measure moral worth. Motives are internal states; your panel is reading marketing copy written by a friend. If you ask, "Did they do this for the right reasons?", nominators will answer "Yes," and you will have no way to verify it.

  If you build a form that asks directly about motive, you will select the best writers, not the most virtuous people. This is Goodhart's Law: when a measure becomes a target, it ceases to be a good measure.

  Therefore, this procedure does not measure *motive*. It measures **Resilience of Commitment**. We are operating on the philosophical proxy that "right reasons" usually manifest as action that persists despite personal cost, lack of external reward, or the absence of immediate emotional gratification. We are measuring the *friction* the nominee overcame, not the engine that drove them.

  ### 2. Philosophical Triage: What to Keep and What to Drop

  You have six volunteers with ten minutes per form. They cannot apply Kant's *Groundwork of the Metaphysic of Morals*.

  **Drop:**
  *   **Duty vs. Inclination:** Distinguishing whether someone acted *from* duty or merely *in accordance with* it is impossible from a nomination form. A person can love their duty.
  *   **Sympathy as a Negative:** Kant argues acting from sympathy has no moral worth. For a charity, this is useless. We want sympathetic people. We only need to ensure sympathy isn't the *only* fuel, or they will burn out when the feelings fade.
  *   **Purity:** Do not look for pure motives. They do not exist. Look for mixed motives where the altruistic component was the deciding factor.

  **Keep:**
  *   **Cost/Sacrifice:** An action has more moral weight if it cost the agent something (time, money, emotional energy, reputation).
  *   **Consistency:** Did they continue when the "wrong" reasons (profit, approval, guilt) were no longer being satisfied?
  *   **Agency:** Did they initiate the action, or were they following orders? (This addresses the teenager problem).

  ### 3. The Scoring Procedure

  The form must force specificity. Vague claims of "dedication" score zero. Specific instances of loss or friction score points.

  **Instructions to Panel:** Score each section 0–5. Total out of 15. Do not average. If a section is silent, score 0. Do not guess.

  #### Question 1: The Cost Friction
  *Does the nomination describe a specific personal cost incurred by the nominee that was not offset by a clear benefit to them?*
  *   **5:** Specific evidence of significant sacrifice (financial loss, career risk, substantial unpaid time) with no mention of reciprocal gain.
  *   **3:** General statements of "hard work" or "time given," or sacrifice mentioned but offset by a benefit (e.g., "gave up weekends but gained skills").
  *   **0:** Silence, or explicit statement that the activity was beneficial/profitable to the nominee.
  *   **Silence:** Enter 0.

  #### Question 2: The Reward Independence
  *Is there evidence the activity continued after the initial external reward (money, approval, guilt relief) vanished or diminished?*
  *   **5:** Explicit statement that they persisted despite lack of recognition, funding cuts, or personal change (e.g., "continued after the grant ended," "still attends though her grief has healed").
  *   **3:** Activity is ongoing, but no mention of obstacles or changes in reward structure.
  *   **0:** Activity stopped when reward ended, or nomination admits activity is contingent on external validation/profit.
  *   **Silence:** Enter 0. (Assume no evidence of independence).

  #### Question 3: The Agency Test
  *Did the nominee conceive of the action, or were they executing someone else's directive?*
  *   **5:** Nominee identified the need and designed the solution independently.
  *   **3:** Nominee joined an existing programme and took significant leadership within it.
  *   **0:** Nominee acted primarily on instruction from a superior/parent/leader.
  *   **Silence:** Enter 0.

  **Total Score:** /15
  **Threshold for Shortlist:** 10+
  **Threshold for Award:** 12+ (unless impact is exceptional, see Stop Point).

  ### 4. Handling the "Gaming" Problem

  Nominators will read last year's winners and write "They sacrificed everything!" even if they didn't.

  **The Counter-Measure:**
  Instruct the panel to look for **granularity**.
  *   *Gamed Text:* "She worked tirelessly despite many obstacles." (Score: 1)
  *   *Credible Text:* "She mortgaged her house to cover the shortfall in 2022 and continued the service when the council funding was withdrawn." (Score: 5)

  If the language mirrors the guidance too closely but lacks dates, figures, or specific incidents, the panel must downgrade the score by 2 points under a "Specificity Check." This penalises reverse-engineered nominations.

  ### 5. The Stop Point

  The form stops at the total score. However, there is a mandatory **Human Override**.

  If a nomination scores 12+ but the panel feels a "PR sheen" (the writing is too polished, the motives sound rehearsed), they must flag it for **Verification**.
  *   **Procedure:** The secretariat makes one phone call to the nominator asking for one specific piece of evidence regarding the cost (e.g., "Can you confirm the funding gap figure?").
  *   If the nominator hedges, the score is voided.

  This is where the form admits it cannot do the job alone. The form filters; the phone call verifies.

  ### 6. Running the Three Cases

  Here is how your panel would score the sketches you provided, applying the procedure strictly.

  #### Case 1: The Lawyer
  *   **Profile:** High pro bono hours. Admitted motive: building client base. Continued because good at it.
  *   **Q1 (Cost):** 0. He gained skills and clients. The nomination admits benefit.
  *   **Q2 (Independence):** 1. He continued, but the nomination implies it remained profitable/useful for his career. No evidence of persisting *without* benefit.
  *   **Q3 (Agency):** 4. He likely set up his own practice/pro bono scheme.
  *   **Total:** 5/15.
  *   **Verdict:** Rejected.
  *   **Analysis:** The form works here. It successfully penalises the "networking exercise" despite the high output.

  #### Case 2: The Bereaved Mother
  *   **Profile:** Small bereavement group. Lost son. Nomination focuses on warmth. No mention of duty/principles.
  *   **Q1 (Cost):** 3. Emotional cost is implied (grief), but is it a *sacrifice* or a *need*? Nomination says "warmth," suggesting she finds it comforting. Let's be strict: 2.
  *   **Q2 (Independence):** 3. Group is ongoing. No mention of obstacles, but no mention of external reward either.
  *   **Q3 (Agency):** 5. She founded it herself.
  *   **Total:** 10/15.
  *   **Verdict:** Shortlisted, but borderline for award.
  *   **Analysis:** The form struggles here. Kant would say she acts from inclination (grief/healing), not duty. The form captures this as "low friction" because the work heals her. It risks penalising those who find joy in service.

  #### Case 3: The Teenager
  *   **Profile:** Big food drive. Organised because youth leader told him to. Wanted approval.
  *   **Q1 (Cost):** 4. For a teenager, this is high effort/time with no financial return.
  *   **Q2 (Independence):** 0. Explicitly did it for approval/instruction. If the leader left, would he stop? Likely.
  *   **Q3 (Agency):** 0. Executing a directive.
  *   **Total:** 4/15.
  *   **Verdict:** Rejected.
  *   **Analysis:** The form correctly identifies the lack of moral agency. He is a good soldier, not a moral leader.

  ### 7. The Verdict: Is the Form Wrong?

  You expected the form to rank (1) under (3) or clear (3). It did not. It ranked (1) and (3) as rejects, and (2) as a borderline shortlist.

  **Why your instincts might have feared (3) would win:**
  If you had asked "Did they do good?", the teenager wins on effort-to-size ratio. If you asked "Was it pure?", the teenager loses on agency. The form successfully filtered the teenager out because **obedience is not virtue**.

  **Where the form fails:**
  It fails on Case 2 (The Mother). By focusing on *cost* as a proxy for *motive*, we risk penalising people who find genuine healing or joy in their charity work. We are inadvertently rewarding misery. If the Mother had written, "This saved my life," she scores lower on Cost than if she wrote, "This was a burden I bore." That is perverse.

  ### 8. The Honest Conclusion

  **Stop pretending to read motives.**

  You cannot award "Moral Worth." You are a charity, not a church. If you try to judge the soul, you will either select the best liars or the most miserable people.

  **Measure "Civic Leadership" instead.**

  Reframe the award. It is not for "The Most Virtuous." It is for "The Most Sustainable Impact."
  *   **Sustainability** requires more than just profit (Lawyer) or just grief (Mother). It requires **Commitment**.
  *   Change Question 1 to: **"Resource Investment."** (How much of their own resource did they put in?)
  *   Change Question 2 to: **"Adaptability."** (Did they solve problems when the easy path closed?)
  *   Change Question 3 to: **"Initiative."** (Did they build something that works without them?)

  **Why this is better:**
  1.  **It ignores the 'Why':** It doesn't matter if the Lawyer did it for money or morals, provided the service is now independent of him.
  2.  **It handles the Mother:** If her group runs on her warmth alone, it isn't sustainable. If she built a structure, she scores high.
  3.  **It handles the Teenager:** If he just followed orders, he didn't build structure. If he mobilised other kids independently, he scores high.

  **Final Recommendation:**
  Keep the scoring structure (volunteers love tallying), but change the labels. Do not ask about *reasons*. Ask about *resilience*.
  *   **Old:** "Did they do it for the right reasons?"
  *   **New:** "Would this good work continue if the nominee stopped tomorrow?"

  If the answer is yes, they built something. If the answer is no, they performed a task. Award the builders. This sidesteps the metaphysical trap while honouring the panel's intuition that the "networker" shouldn't win simply for writing big cheques.

  **British English Note:** Ensure all future guidance uses "programme," "honour," "recognise," "centre," and "practise" (verb). The panel will spot Americanisms, and it undermines the authority of the form.
