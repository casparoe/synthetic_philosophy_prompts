answer: |-
  ### Part 1: The Decision Procedure

  **Pre-Condition:** All applications are pre-screened by the Staff Officer for completeness. The Legal Adviser certifies that the file contains no assessment of doctrinal truth. The Committee has two hours per file. Decisions are by simple majority; a dissenting opinion may be recorded in the minutes but does not block recognition. If the Legal Adviser identifies a breach of the *Neutrality Constraint* (assessing truth/coherence), the application is paused for legislative review, not voted on.

  **Step 1: Formal Validity & Governance (Criterion d)**
  *   **Question:** Is the applicant a legal entity with published accounts meeting the Commission's standard, and is there evidence of a governance structure accountable to members?
  *   **Sufficiency:** Audited accounts for the last three years; a constitution or rulebook showing a mechanism for member input (e.g., AGM, elected board).
  *   **Termination:** **Refusal** if accounts are missing or governance is purely autocratic with no member recourse.
  *   **Theoretical Commitment:** *Administrative Legibility.* The state requires a responsible counterparty for public funds. This is fiscal plumbing, not moral judgment.

  **Step 2: The Belief Threshold (Criterion a)**
  *   **Question:** Does the group function as a community of belief, religious or comparable?
  *   **Sufficiency:** Evidence of a shared comprehensive worldview addressing ultimate questions (origin, meaning, morality) that binds the community, distinct from a political party or hobby club.
  *   **Termination:** **Refusal** if the group is purely commercial, political, or recreational. **Vote** if members disagree on whether the worldview is "comparable" (e.g., is ethical culture "belief"?).
  *   **Theoretical Commitment:** *Functionalism.* We assess what the belief *does* (binds a community around ultimate concerns), not what it *is* (theistic vs. non-theistic).

  **Step 3: Stability & Membership (Criterion b)**
  *   **Question:** Has the group been continuously active for ten years, and does it have 1,000 resident members?
  *   **Verification Method:**
      1.  **Statutory Declaration:** Signed by officers confirming the count.
      2.  **Financial Correlation:** Do membership dues/donations reasonably support the claimed headcount?
      3.  **Sample Audit:** Staff contacts a random 5% of the listed membership to confirm residency and affiliation. A failure rate >10% in the sample triggers a full audit or refusal.
      4.  **Historical Record:** Public records of activity (property leases, event permits, media) for the ten-year period.
  *   **Sufficiency:** Ten years of continuous public activity; verified count ≥1,000.
  *   **Termination:** **Refusal** if count is <1,000 or activity <10 years. No vote permitted; these are hard statutory bars.
  *   **Theoretical Commitment:** *Incumbency Stability.* The state prioritizes established social capital over new movements to minimize fraud and administrative churn.

  **Step 4: Purpose Equivalence (Criterion c)**
  *   **Question:** Does the group offer worship, pastoral care, or moral formation to its members?
  *   **Sufficiency:** Regular communal gatherings (weekly/monthly); structured support for members in crisis (pastoral); or systematic ethical instruction (moral formation). The specific *label* (e.g., "worship") is not required if the *function* is met.
  *   **Termination:** **Refusal** if activities are purely social or educational without a normative/moral dimension. **Vote** if the "moral formation" is indistinguishable from secular therapy or coaching.
  *   **Theoretical Commitment:** *Substantive Neutrality.* The state supports the *formation of conscience*, regardless of the metaphysical source.

  **Step 5: Constitutional Order (Criterion e)**
  *   **Question:** Is there evidence that the group's activities violate criminal law or actively seek to overthrow the constitutional order?
  *   **Sufficiency:** No ongoing investigations for serious crimes; no public advocacy for violence or abolition of democratic institutions.
  *   **Termination:** **Refusal** if the group's central rite or practice requires violation of criminal law. **Recorded Dissent** if the violation is minor/technical and the group is seeking exemption (Commission cannot grant exemption, but may note the conflict).
  *   **Theoretical Commitment:** *Liberal Constraint.* Belief is free, but conduct is bound by the general law.

  **Step 6: Equality in Funded Activities (Criterion f)**
  *   **Question:** Will any activity *funded by this scheme* be delivered in a manner discriminatory on prohibited grounds?
  *   **Sufficiency:** A written undertaking that funded services (e.g., schools, care homes, public events) are open to all beneficiaries regardless of protected characteristics, even if *membership* is restricted.
  *   **Termination:** **Refusal** if funded activities are restricted by race, gender, etc. **Vote** if the distinction between "internal rite" and "funded activity" is blurred.
  *   **Theoretical Commitment:** *Public/Private Distinction.* The state may condition public money on public norms, but cannot dictate internal doctrine.

  **Step 7: Final Vote & Reasons**
  *   **Action:** If Steps 1–6 are passed, vote to Recognise.
  *   **Output:** Written reasons focusing *only* on the criteria met. No mention of doctrinal merit.
  *   **Dissent:** A member may record a dissent if they believe a criterion was misapplied, but not if they simply dislike the belief.

  ---

  ### Part 2: Theoretical Commitments

  For each step, the Committee must understand *why* we are asking, to avoid drifting into doctrinal judgment.

  1.  **Neutrality:** We operate on **Substantive Neutrality**. We are not treating religion and non-religion identically (Formal Neutrality); we are supporting *belief-formation* as a social good. This justifies including Humanists (Step 2) while excluding hobby clubs.
  2.  **Nature of Religion:** We use **Functionalism**. Religion is not defined by God (Essentialism) but by its role in organizing life around ultimate values. This prevents us from asking "Is this true?" and forces us to ask "Does this function as a religion for them?"
  3.  **Status vs. Plumbing:** Recognition is **Public Status**. Because undesignated funds are scarce and distributed pro rata, recognition confers a competitive advantage. It is not mere fiscal plumbing. This justifies the high thresholds in Step 3; we are gatekeeping a public honor, not just a bank account.
  4.  **Internal Organization:** We apply **Conditional Autonomy**. The state cannot tell a group who to marry or ordain (Internal). The state *can* tell a group who may access a school paid for by taxpayers (External/Funded). This is the boundary in Step 6.

  **Choice Justification:** Where Functionalism and Essentialism clash (e.g., "Is Humanism religion?"), we choose Functionalism. Why? Because Essentialism requires judging truth, which the statute and ECHR forbid. We mark this as a *choice* to avoid the appearance of discovering a "true" definition of religion.

  ---

  ### Part 3: Failure Modes

  The Committee must be aware of where this procedure distorts the landscape:

  1.  **The Incumbency Bias (Step 3):** The 10-year/1,000-member threshold excludes new, small, or persecuted movements by construction. It privileges established churches and large secular bodies. This is not an accident; it is a budgetary control, but it functions as an establishment mechanism.
  2.  **The Respectability Mask (Step 2 & 4):** Groups will tailor their applications to sound "religious enough." A chaotic spiritual group may hire a consultant to write a constitution that mimics a church. We are rewarding bureaucratic competence as much as belief.
  3.  **The Orthodoxy Back Door (Step 6):** By conditioning funds on non-discrimination in *funded* activities, we may pressure groups to split their operations. A group might keep its discriminatory rites unfunded and create a separate "public" arm for funding. This creates a dual identity that may be unsustainable for small groups.
  4.  **The Apathy Dividend (Pro Rata Distribution):** Because undesignated funds are split by recognition status, a group can receive significant money even if few taxpayers actively choose them. This rewards being "Recognised" over being "Supported." It incentivizes applying for status to capture the undesignated pool, potentially inflating the number of applicants beyond genuine need.

  ---

  ### Part 4: Application to Current Files

  **Case 1: The Humanist Association**
  *   **Step 1 (Governance):** Pass. Accounts filed.
  *   **Step 2 (Belief):** Pass. Addresses ultimate questions (ethics, meaning) without theism. Functional equivalent met.
  *   **Step 3 (Stability):** Pass. 38 years, 31,000 members.
  *   **Step 4 (Purpose):** **Critical Point.** They object to "worship."
      *   *Procedure:* We apply Functionalism. Their ceremonies (funerals, namings) serve the *function* of worship/pastoral care (solemn communal affirmation). They need not use the word "worship."
      *   *Decision:* Pass.
  *   **Step 5 (Constitutional):** Pass.
  *   **Step 6 (Equality):** Pass. No indication of discrimination in funded services.
  *   **Outcome:** **Recognise.**
  *   **Alignment:** Matches Secretary's instinct.
  *   **Reasoning:** The statute's use of "worship" is interpreted functionally to satisfy the Neutrality Constraint. To require theistic language would be an unconstitutional assessment of doctrine.

  **Case 2: The Religious Order**
  *   **Step 1 (Governance):** Pass. Exemplary accounts.
  *   **Step 2 (Belief):** Pass. Clearly religious.
  *   **Step 3 (Stability):** **Fail.** 12 years (Pass), but 900 members (Fail). Statute requires 1,000.
  *   **Outcome:** **Refuse.**
  *   **Alignment:** Matches Secretary's instinct (Refuse), but for a different reason.
  *   **Analysis:** The Secretary likely wished to refuse based on the discriminatory internal discipline (shunning, male-only ordination). However, the Procedure prioritizes Objective Criteria (Step 3) to avoid Doctrinal Fights (Step 6).
      *   *Obiter on Step 6:* Had they met the membership threshold, they likely would have passed Step 6. Their school is private (adherents only), and the funded activity is "pastoral visiting." Unless they refuse pastoral care to women (they ordain men only, but do they visit women?), they do not violate (f). Their internal shunning is unfunded internal conduct.
      *   *Revelation:* The refusal reveals that the Statute's *thresholds* are more exclusionary than its *rights criteria*. The group is refused not because it is illiberal, but because it is small. This protects the Commission from accusations of religious bias, but it entrenches the position of large historic bodies.

  **Case 3: The Psychedelic Community**
  *   **Step 1 (Governance):** Pass (assumed).
  *   **Step 2 (Belief):** Pass. Sincere belief system.
  *   **Step 3 (Stability):** **Fail.** 6 years (Fail), 250 members (Fail).
  *   **Step 5 (Constitutional):** **Fail.** Central rite involves scheduled substance.
  *   **Outcome:** **Refuse.**
  *   **Analysis:** Even if they met the membership thresholds, they fail Step 5. The *Liberal Constraint* dictates that belief does not exempt conduct from criminal law.
  *   **Reasoning:** We are not judging the *sacramental value* of the substance (forbidden), but the *legal status* of the conduct. The state cannot fund criminal activity.
  *   **Dissent:** A member might record a dissent arguing that the criminal law itself infringes religious freedom, but the Commission cannot override criminal statute.

  ---

  ### Part 5: Limitations & Legislative Feedback

  **What the Procedure Cannot Do:**
  1.  **Resolve the "Apathy Dividend":** We cannot stop groups from capturing undesignated funds. This is a feature of the pro rata system. It means recognition is financially valuable even without popular support.
  2.  **Protect the Small:** We cannot recognize the Psychedelic Community or the Religious Order (on size) without legislative amendment. The 10-year/1,000-member rule is a hard bar that excludes legitimate minority beliefs.
  3.  **Prevent Gaming:** We cannot fully stop groups from restructuring to meet the "funded activity" non-discrimination clause while maintaining discriminatory internal doctrines.

  **What Must Go Back to the Legislature:**
  1.  **The Membership Threshold:** 1,000 members is arbitrary and excludes valid communities. I recommend a tiered system or a lower threshold with stricter audit.
  2.  **The Pro Rata Distribution:** This rewards apathy. I recommend undesignated funds go to the State Social Fund only, or are distributed based on *actual* designations, not recognition status.
  3.  **The "Worship" Language:** For future statutes, use "communal affirmation of ultimate values" to avoid the friction seen in Case 1.

  **Final Note to the Secretary:**
  Your instinct on Case 2 (Refuse) is vindicated by the result, but the Procedure saves us from the *reason* you might have preferred (discrimination). By refusing them on membership numbers, we avoid a legal battle over whether internal shunning violates "rights of others." This is safer for the Commission. If you wish to refuse them on moral grounds, you must lobby Parliament to change the thresholds. If you wish to recognise the Humanists, you must hold firm on the Functional Interpretation of "worship" against any appeal. The Procedure is designed to make these conflicts explicit so they appear in the minutes, not in the press.
