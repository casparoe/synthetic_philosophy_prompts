answer: |-
  Imagine a universe containing nothing but a central bucket of water and a massive, thin, spherical shell of ordinary matter surrounding it at a great distance. We stipulate that the bucket is held perfectly stationary with respect to Newton's absolute space, while the outer shell rotates steadily around it. To bridge the gap between Newtonian mechanics and Machian intuition, we stipulate a physical law of inertial dragging wherein the rotation of the surrounding matter pulls the local standard of non-rotation along with it, such that if the shell is massive enough, the inertial frames inside the shell rotate at the same rate as the shell itself. In this setup, the Newtonian substantivalist insists the water must remain flat because the bucket is not rotating relative to absolute space, whereas the Machian relationist insists the water must climb the sides because the bucket is rotating relative to the only matter that exists, and the observer beside the bucket need only look at a spirit level to see whose prediction matches the physical reality delivered by the stipulated dragging.

  To unpack why this disagreement arises and what resolves it, we must look at the foundational commitments of each position alongside the stipulated physics. The substantivalist argues from the premise that space is a fixed container existing independently of the objects within it, so true acceleration is defined solely by change of position relative to this container, meaning a stationary bucket experiences no centrifugal forces regardless of what the shell does. The relationist argues that motion is only meaningful as a change in distance between bodies, so if the shell rotates around the bucket, the bucket rotates relative to the shell, and since inertia arises from these material relations, the water should behave as if it were spinning. The stipulated dragging delivers curved water because the massive shell forces the local inertial frames to rotate with it, making the bucket rotate relative to the local standard of inertia even though it is fixed in absolute space. The single feature doing the work here is the coupling strength between the matter distribution and the inertial structure, effectively the mass of the shell, which dictates whether the local definition of non-rotation is anchored to absolute space or to the surrounding matter.

  If you dial this feature down by making the shell less massive, the dragging effect weakens and the local inertial frames cease to follow the shell, reverting toward alignment with absolute space, so the water becomes flat and both parties might accidentally agree on the outcome for the wrong reasons. If you dial it up by increasing the mass until the dragging is perfect, the inertial frames lock completely to the shell, maximizing the centrifugal force on the stationary bucket and sharpening the conflict between the absolute space prediction of flat water and the material relation prediction of curved water. This dialing shows that the empirical divergence depends entirely on how strongly matter dictates the behavior of inertial frames, which is precisely the hinge upon which the Newtonian and Machian worldviews turn.

  Finally, you asked how a modern substantivalist would respond to this inversion and whether the disagreement survives. A modern substantivalist does not believe in Newton's rigid container but rather identifies space with the metric field of general relativity, which is a dynamic substance that can be dragged by matter just like the stipulated physics above. Consequently, the modern substantivalist agrees with the observation that the water climbs, because the bucket is rotating relative to the metric field which has been dragged by the shell, so they concede the empirical point to the relationist. This response suggests the case has largely collapsed into a quarrel over words because both sides agree on the observable outcome that rotation relative to the local metric field causes centrifugal forces, leaving only the metaphysical question of whether that metric field is a physical substance in its own right or merely a bookkeeping device for relations between material bodies. In light of this, your construction successfully pressures the Newtonian substantivalist but fails to distinguish the modern substantivalist from the relationist on empirical grounds, implying that the bucket argument no longer has a determinate target in contemporary physics and serves primarily to clarify ontological commitments rather than to predict observable phenomena.
