      *   *Nuance:* "Prediction" isn't monolithic. Four mechanisms:
          1.  Deterministic (Laplacean).
          2.  Dispositional (Character tracking).
          3.  Self-fulfilling (Announcement causes act).
          4.  Backtracking (Past facts fix prediction).
      *   *Goal:* See if distinguishing these resolves the CDT/EDT tension or exposes a specific inability to value unpredictability.

  3.  **Drafting the Proposal - Section by Section:**

      *   **Title:** Needs to be academic and precise. *The Price of Unpredictability: Mechanisms of Prediction and the CDT/EDT Standoff.*
