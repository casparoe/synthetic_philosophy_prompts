  **Severity 3: Medium (C5 + C2)**
  Demanding FNR balance (C2) while forbidding post-processing (C5) relies on the model naturally achieving error parity. Given C3 and C4, this is statistically improbable.
  *Revision:* Permit group-specific thresholding.
  *Cost:* In principle, you concede that raw scores are not decision-ready without policy overlays. In practice, this contradicts your "honest score" philosophy, admitting the score alone is insufficient for fair decisions.

  **Apparent Conflict: C1 vs. C2 (Philosophical)**
  C1 claims thresholds are downstream business, yet C2 constrains them. This is resolvable by defining the "model" to include the cutoff policy for the flagship product, separating risk assessment from decision policy.

  **Single Change:**
  Permit group-aware thresholding (relax C5). This is the highest-leverage revision. It resolves the C1/C2/C3 impossibility by shifting the fairness burden to the decision layer (consistent with C6's comfort with threshold shifts). It acknowledges that blindness (C4) prevents calibration, making post-processing necessary to meet any error-rate goals. By isolating fairness adjustments to the cutoff rather than the score, you preserve the integrity of the risk estimate while managing regulatory exposure on approvals.
