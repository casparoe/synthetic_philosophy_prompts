  **Severity 1: Critical (C1 + C2 + C3)**
  You assert different base rates (C3) while demanding both calibration (C1) and FNR balance (C2). This violates the impossibility bound. You must drop one.
  *Revision:* Abandon C2 (FNR constraint).
