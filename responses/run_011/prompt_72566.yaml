  **Severity 2: High (C4 + C1)**
  Excluding group membership and proxies (C4) makes group-specific calibration (C1) impossible when base rates differ (C3). The model cannot learn group-specific risk profiles without group signals.
  *Revision:* Allow group membership as a feature or for stratification.
