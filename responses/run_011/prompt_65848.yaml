answer: |-
  Based on the text provided, here is a reconstruction of the theory of choice presupposed by these legal practices.

  ### 1. Threat vs. Offer: The Baseline of Entitlement
  The distinction between a threat that defeats voluntariness and an offer that merely makes an alternative expensive turns on the **entitlement baseline** and the **actor's standing**, rather than the quality of the will or the subjective pressure felt.

  In the American doctrine described, a prosecutor's warning (five years vs. life) is treated as a voluntary choice, whereas a stranger's gun (robbery) is treated as involuntary. In both scenarios, the defendant faces a severe negative consequence for refusing the proposed action. The "quality of will" is similarly compromised by fear in both instances. The difference lies in the **legitimacy of the pressure source**.

  The text implies a baseline where the state is *entitled* to prosecute and punish according to statutory limits. Therefore, a prosecutor offering a lesser sentence in exchange for a plea is operating within their standing; they are altering the *legal* options available, which they have the authority to define. The "offer" is measured against a baseline of legal entitlements. Conversely, the stranger with a gun has no standing to threaten harm. They are altering the *physical* safety baseline illegitimately. Thus, a threat defeats voluntariness not because it restricts options, but because it restricts them via a mechanism the actor has no right to employ. The choice is "free" if the constraints are legally constituted, even if they are coercive in effect.

  ### 2. The "Could Have Done Otherwise" Dispute
  These rules have taken a side in the philosophical dispute: they reject the view that responsibility requires the ability to do otherwise in a **robust or reasonable sense**. They adopt the view that responsibility requires only the **formal legal capacity** to do otherwise.

  The plea cases are best read as **redefining what counts as an alternative**. In the American example, the defendant *can* technically refuse the plea and go to trial; the fact that the consequence is a mandatory life term rather than five years does not negate the existence of the alternative. The law treats the "life term" option as a valid alternative, even if no rational agent would choose it.

  By treating the plea as voluntary despite the "far graver charges," the doctrine asserts that the presence of a legally open path (trial) is sufficient for agency, regardless of the cost attached to that path. It denies that "acceptable" or "reasonable" alternatives are a prerequisite for responsibility. As long as the choice is "knowing and intelligent" among the options *actually on offer*, the agent is responsible, even if the offeror constructed the options to make one choice overwhelmingly dominant.

  ### 3. Tariff Justifications: Presuppositions vs. Comfortable Fits
  The E&W tariff's exclusion of evidential strength and remorse rules out two familiar justifications:
  *   **Reliability/Innocence Protection:** By stating the reduction "must not vary with the strength of the prosecution's evidence," the guideline rules out the justification that discounts are needed to prevent innocent defendants from risking trial.
  *   **Moral Desert/Remorse:** By stating the reduction "must not reflect any demonstration of remorse," the guideline rules out the retributive justification that a guilty plea indicates moral redemption or reduced culpability.

  **What survives:**
  The practice sits comfortably with a **utilitarian efficiency model** (a refund of costs saved) or a **contractual model** (a price the state pays to purchase the waiver of a right).

  **Strict Presupposition:**
  The text strictly presupposes that the defendant has an **entitlement to trial** ("entitled not to admit the offence"). The discount cannot be a *penalty* for exercising this right (as the text insists nothing is to "pressure anyone"). Therefore, the reduction must be framed as a benefit for *not* using the resource, rather than a punishment for using it.

  **Underdetermination:**
  The practice is philosophically underdetermined between a "price for waiver" and a "refund of costs." However, the **timing scale** (one-third down to nothing) makes sense of the **refund of costs** theory better than a flat price. Costs are saved incrementally the earlier the plea occurs; a waiver price might logically be flat. Conversely, a pure "price" model might not require a slide to zero on the first day of trial. The sliding scale suggests the state is reimbursing the defendant for the administrative resources conserved, but the exclusion of remorse and evidence strength leaves the moral basis of that transaction opaque.

  ### 4. Consistency of Practices
  The three practices are **not consistent** with one another. There are two precise points of collision:

  **Collision A: The State vs. The Stranger (Coercion Baseline)**
  *   *Practice:* US plea doctrine accepts state threats (life imprisonment) as voluntary. Duress doctrine rejects stranger threats (death) as involuntary.
  *   *Inconsistency:* If the theory of choice is based on the "overborne will," a threat of death (stranger) is more coercive than a threat of imprisonment (state). If the theory is based on "available alternatives," both offer a choice (die/rob or trial/plead).
  *   *Reconciliation:* The reconciling principle is **Sovereign Authority**. The state is permitted to impose burdens that would be criminal if imposed by private actors. The theory of choice here is not about psychological freedom, but about submission to legitimate authority.

  **Collision B: The Duress Exception (Robbery vs. Murder)**
  *   *Practice:* A defendant acting at gunpoint is excused for robbery but *not* for murder.
  *   *Inconsistency:* This contradicts the internal logic of the "overborne will." If the gun removes free choice for robbery, it must remove it for murder. The physical coercion is identical.
  *   *Reconciliation:* The only principle that reconciles this is **Inalienable Duty**. The law presupposes that while self-preservation excuses the violation of property rights (robbery), it does not excuse the violation of an innocent third party's right to life. The agent is deemed to have a "choice" in the murder scenario not because the coercion is less, but because the duty not to kill is absolute.

  **Conclusion:** The practices are consistent only if one abandons a psychological theory of choice (was the will free?) in favor of a **normative theory of choice** (was the agent permitted to yield to this pressure?).

  ### 5. Adopting the Rival View
  If we adopted the rival view that **"an agent left with only one tolerable option does not choose freely,"** the following changes would be required:

  1.  **The Tariff:** The sliding scale would have to be abolished. If a sentence reduction is the *only* tolerable option to avoid a disproportionate trial penalty, accepting it is not a free choice. To ensure free choice, the sentence for conviction after trial must be identical to the sentence for a guilty plea. The "discount" would be viewed as coercive pressure, violating the entitlement to trial.
  2.  **Voluntariness Inquiry:** The US doctrine regarding plea offers would collapse. A "choice" between 5 years and life imprisonment offers only one *tolerable* option. Under the rival view, this plea would be involuntary. Plea bargaining based on charge stacking or sentence differentials would be unconstitutional or impermissible.
  3.  **Availability of Duress:** The murder exception to duress would vanish. If a stranger holds a gun to your head, you have only one tolerable option (comply). Whether you rob or kill, you are not choosing freely. The rival view demands that duress be a complete defense to murder, as the agent lacks a tolerable alternative.
  4.  **Design of Negotiations:** Plea negotiations would have to be decoupled from sentencing outcomes. The state could not leverage its sentencing power to induce waivers. The system would move toward a fixed sentencing model where the "cost" of trial is neutralized, ensuring that the decision to plead is not driven by the avoidance of a threat, but by genuine admission of guilt.
