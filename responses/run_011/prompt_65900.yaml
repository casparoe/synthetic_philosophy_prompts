  ---

  #### Leaf 1: Exit Rights / Voluntary Association
  *   **Position:** Liberal Contractarianism.
  *   **Awkward Commitment:** It treats power imbalances as irrelevant; if a user cannot afford to leave (lock-in), they have no recourse against exploitation because they theoretically "consented" by staying.
  *   **Note:** This is the only leaf that dissolves the boundary problem by denying the need for a political boundary at all.

  #### Leaf 2: Constituent Power / Self-Determination
  *   **Position:** Democratic Sovereignty.
  *   **Awkward Commitment:** It is inherently circular and exclusionary; the group legitimizes its own boundaries, meaning outsiders have no claim to inclusion even if heavily impacted.
  *   **Note:** This accepts the circularity as a feature (the "We the People" moment) rather than a bug.

  #### Leaf 3: All-Subjected / Republican
  *   **Position:** All-Subjected Principle (ASC).
  *   **Awkward Commitment:** It requires a robust definition of "coercion"; if economic dependence counts as coercion, almost every user becomes a voter, potentially diluting the commitment of core members.
  *   **Note:** Focuses on subordination to authority rather than impact or ownership.

  #### Leaf 4: All-Affected Interests
  *   **Position:** All-Affected Principle (AAI).
  *   **Awkward Commitment:** It requires omniscience; you must predict all causal chains of a decision to know who is affected, which is computationally impossible for complex systems.
  *   **Note:** The most inclusive democratic theory, often collapsing into "everyone votes on everything."

  #### Leaf 5: Stakeholder Democracy
  *   **Position:** Stakeholder Theory.
  *   **Awkward Commitment:** It creates a weighting problem; you must decide how many fee-paying users equal one equity-holding member, introducing complexity into the vote count.
  *   **Note:** Attempts to balance labor, capital, and usage without granting full ownership to all.

  #### Leaf 6: Proprietary Membership
  *   **Position:** Proprietary Democracy.
  *   **Awkward Commitment:** It reduces political voice to property rights; a member who contributes labor but holds no equity is governed by those who hold capital, regardless of impact.
  *   **Note:** The default for most traditional cooperatives and corporations; excludes non-equity participants.

