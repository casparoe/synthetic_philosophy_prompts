  ### The Boundary Decision Tree

  **Instructions:** Answer each question based on your team's intuition about the specific case described. Follow the path to find your underlying theoretical commitment.

  **Node 1:** For the member who wants to leave and take their stake, is processing their exit sufficient to deny them a vote on the rules they are currently under?
