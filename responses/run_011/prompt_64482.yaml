answer: |-
  I'd bet on the etiological account because it alone grounds the normativity of malfunction without smuggling in an observer's interests.

  The core fight isn't about what traits *do*, but about what they are *supposed* to do. The causal-role (CR) account treats function as a synchronic contribution to a system's capacity: the heart functions to pump blood because it causally contributes to circulation right now. The etiological (SE) account treats function as a historical fact: the heart functions to pump blood because ancestors pumped blood and that caused their survival. They diverge sharply on malfunction and novelty. If a heart is blocked and pumps nothing, CR struggles to say it still has the function of pumping (since it isn't contributing), whereas SE says it plainly does (because that's why it's there). Conversely, if a trait arises by drift and later gets used (exaptation), SE says it has no function until selection acts, while CR says it functions immediately if it helps. SE wins more often on biological normativity (distinguishing healthy from diseased), while CR wins on mechanistic explanation (describing how a system works regardless of history).

  Your synthetic cell case exposes the raw nerves of both theories.

  (a) At T0, off the bioprinter, the **etiological account says there are no functions**. This is the counterintuitive verdict most people miss. Without a history of selection, there is no "proper function," only design intent imposed from outside the biological system. The cell has capacities, but biologically speaking, nothing is *for* anything yet; it's a philosophical zombie until it reproduces. The **causal-role account says yes, there are functions**, derived from the design spec which defines the system's capacities. The chaperone functions to fold proteins because that is its contribution to the cell's viability as designed.

  (b) At generation 10,000, after the co-option, **both accounts converge on the new job**, but for different reasons. For **SE**, the function is the new job because the lineage persisted *because* of that new job over the 10k generations; the selection history has been rewritten by the new fitness landscape. The original spec is now irrelevant archaeology. For **CR**, the function is the new job because that is the causal contribution currently sustaining the system's capacity to survive.

  (c) There is **no specific moment where the answer flips** for either theory, but the fuzziness differs. For **SE**, the flip is a gradual accumulation of selection pressure; it becomes a function when the trait's presence is causally explained by its reproductive advantage in the lineage. It's not arbitrary, but it is soritical. For **CR**, there is no flip at all, just a continuous shift in causal contribution as the protein's behavior changes. The SE account makes the transition meaningful (the trait becomes *for* something), whereas CR just tracks physical utility.

  The "load-bearing account" you propose is not a genuine third position; it is causal-role with decoration. By weighting functions according to current fitness cost, you are essentially adopting a "current selected effect" view that discards the history requirement. It dissolves the novelty problem (new traits count if they bear fitness load) but relocates the duplication problem rather than solving it. If an organism has two kidneys, removing one costs little fitness, so your account implies the second kidney has less function or no function, which contradicts biological intuition that both are fully functional organs. It also makes function overly sensitive to transient environmental fluctuations; if a trait is essential today but redundant tomorrow, its function flickers on and off. History acts as a stabilizer for exactly this reason, which is why demoting it to a tiebreaker weakens the account's ability to handle redundancy and transient noise.

  Regarding your evolutionary psychology fence-sitters: the **etiological account does license the mismatch inference**, but not the value inference. SE validates the claim that a drive's function is what it was selected for, not what it does now, so calling sugar cravings a "mismatch" is theoretically sound under SE. However, inferring that our values *ought* to align with those historical functions is a naturalistic fallacy that SE does not own; SE describes what traits are for, not what agents should value. The **causal-role comeback** is respectable: it denies the normative bite of "mismatch." Under CR, a sugar craving's function is simply whatever causal role it plays in the current system (e.g., stress regulation or calorie intake); if it kills you, it's just a maladaptive causal role, not a violation of proper function. This dissolves the tension by treating "function" as descriptive rather than teleological, forcing the mismatch crowd to argue about current utility rather than historical authority.
