answer: |-
  **Conceit:** The poem itself acts as the chain $C$ in a partially ordered set $P$, where the ordering relation is semantic inclusion: each line must encompass the meaning and scope of all preceding lines. Line 1 represents the empty chain (bounding nothing), necessitating Line 2 as its upper bound. Each subsequent line bounds the accumulation of prior lines, verifying the hypothesis of Zorn's Lemma step-by-step. The final line is not a construction of the previous verses but the maximal element guaranteed by the hypothesis—maximal (nothing extends it) but not maximum (it does not dominate incomparable elements outside the chain).

  I start with nothing, the empty chain case.
  I add a word to bound that null set now.
  This line holds that word and the void beneath.
  Each verse swallows the sum of all its past.
  We climb a partial order, blind to the sides.
  Incomparable things exist outside this view.
  But every chain we build demands a cover.
  Thirteen years silent before Zorn signed the note,
  While Kuratowski held the proof unseen.
  The hypothesis grants what the hand cannot build.
  I stop not because I rule the whole set here.
  There are lines elsewhere I cannot compare.
  I am not maximum; I do not top the set.
  But nothing extends me; here the chain is met.
  I am the maximal element, the end of extension.
  The bound exists, and I am where it rests.

  ***

  **Commentary on Liberties and Accuracy**

  I took a structural liberty with the definition of a chain: in strict set theory, an upper bound for a chain $C$ need not belong to $C$, but in this poem, the final line (the bound) is necessarily part of the poem (the chain). I treated the poem as the chain $C$ plus the guaranteed upper bound $u$ appended as the final element, making $u$ the greatest element of the poem-chain, though only maximal in the broader poset of "all possible lines." I am highly confident in the maximal/maximum distinction and the historical nod to Kuratowski (1922 vs. Zorn 1935). The point I am least sure of is whether the semantic "swallowing" of previous lines successfully mimics the transitivity and reflexivity required of a partial order without feeling forced to a non-mathematician.
