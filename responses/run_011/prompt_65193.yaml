      *   *ALARP (As Low As Reasonably Practicable):* Cost-benefit analysis of risk reduction (gross disproportion).
      *   *Safety Case:* Claim-Argument-Evidence structure.
      *   *Duty Holder:* Specific actor assigned a requirement.
      *   *Creating vs. Exposure:* Hazard creation vs. being near a hazard.
      *   *SOTIF (Safety of the Intended Functionality):* Harm without fault (system works as designed but still harms).
      *   *Reasonable User:* Assumption about user behavior.
      *   *Sign-off:* Formal acceptance of assumptions/residual risk.

  3.  **Drafting the Translations (a-i):**

      *   (a) *Parity Premise:* Near child vs. distant child.
          *   Safety view: Hazard severity is the same. Distance/exposure might differ in controllability.
          *   Translation: Severity of harm is identical; spatial proximity does not alter the hazard classification in the log.
      *   (b) *Distance/Bystanders:* Morally irrelevant.
          *   Safety view: Distance affects exposure/controllability. Bystanders affect allocation of requirements.
          *   Translation: Risk reduction requirement does not degrade with distance; presence of other duty-holders does not nullify individual allocation.
      *   (c) *Strong vs. Moderate Principle:* Marginal utility vs. comparable cost.
          *   Safety view: ALARP vs. Strict Liability? Or "Gross Disproportion" limit.
          *   Translation: Strong = reduce risk until utility loss equals harm prevented. Moderate = reduce until cost is grossly disproportionate to benefit.
      *   (d) *Duty vs. Supererogatory:* Mandatory vs. Optional.
          *   Safety view: Safety Requirement vs. Nice-to-have feature.
          *   Translation: Risk reduction is a mandatory safety requirement, not a voluntary feature enhancement.
      *   (e) *Letting Die vs. Killing:* Commission vs. Omission.
          *   Safety view: Active hazard creation vs. Failure to mitigate existing hazard.
          *   Translation: Failure to implement a mitigating control is treated equivalently to introducing a fault that causes the hazard.
      *   (f) *No Causal Contribution:* Capacity vs. Cause.
          *   Safety view: This is hard. Safety usually assigns duty to the creator/operator.
          *   Translation: Duty allocates to any actor with controllability, regardless of hazard origin. (Distortion: Safety usually links duty to creation/operation).
      *   (g) *Demandingness/Integrity:* Life projects vs. Moral demand.
          *   Safety view: System purpose vs. Safety overhead.
          *   Translation: Safety overhead cannot consume the entire system budget/functionality; agent retains reserve capacity for primary function.
      *   (h) *Fair Share:* Collective action.
          *   Safety view: Requirement allocation across components/actors.
          *   Translation: Individual requirement cap is based on equitable allocation, not covering systemic shortfall of other components.
      *   (i) *Effectiveness:* Best benefit/cost + uncertainty.
          *   Safety view: Risk reduction efficacy + confidence level (SIL/ASIL).
          *   Translation: Select control measure with highest risk reduction factor per cost unit, adjusted for confidence in evidence.

  4.  **Drafting the Residue Report:**
      *   Identify where the mapping breaks.
      *   (f) is the biggest break (causal contribution).
      *   (b) is tricky (bystanders in safety usually allow shared responsibility).
      *   (g) maps to "reasonable practicability" but integrity is broader.
      *   Reverse Residue: Sign-off (formal acceptance), Residual Risk Transfer (who holds the bag), SOTIF (non-fault harm).

  5.  **Drafting the Bottom Line:**
      *   Is there a live disagreement? Yes, mostly around requirement allocation (fair share) and the limit of cost (ALARP vs. Marginal Utility).
