answer: |-
  Translating the duties-of-rescue debate into functional safety vocabulary requires treating safety engineering not merely as a technical discipline but as a normative framework for allocating obligation. In this framework, moral duties are safety requirements, harms are hazards, and agents are duty-holders within a system architecture. The following restatements map the philosophical claims onto the safety case structure, exposing where the frameworks align and where the translation requires bending the rules of safety engineering.

  (a) The parity premise translates to a hazard log entry where the severity classification is identical regardless of the hazard's spatial location. In safety terms, a fatality is a Severity 4 event whether it occurs in front of the operator or remotely; the risk matrix does not discount severity based on distance.
  (b) The claim that distance and bystanders are irrelevant translates to a requirement that risk reduction measures must not degrade based on exposure probability or the presence of other capable actors. The safety case must argue that the duty-holder's obligation remains constant even if other components (bystanders) fail to execute their allocated functions.
  (c) The strong principle maps to a risk reduction mandate requiring mitigation until the cost to the duty-holder equals the expected harm prevented. The moderate principle maps to the ALARP (As Low As Reasonably Practicable) principle, where reduction is required only until the cost becomes grossly disproportionate to the benefit gained.
  (d) The refusal to classify acts as supererogatory translates to categorizing rescue interventions as mandatory safety requirements rather than optional feature enhancements. These are verified items in the safety case, not voluntary goodwill gestures outside the specification.
  (e) The assimilation of letting die to killing translates to treating the omission of a mitigating control as equivalent to the introduction of a systematic fault. Both result in a violation of the safety goal and are treated as non-compliant states in the audit trail.
  (f) The absence of a causal-contribution requirement translates to allocating a safety requirement to an actor based solely on controllability, regardless of whether that actor introduced the hazard. This asserts that capacity to mitigate triggers the duty, independent of hazard origin.
  (g) The demandingness objection translates to a constraint where safety overhead cannot consume the entire system budget, preserving reserve capacity for the system's primary function. The integrity objection argues that defining the system solely by its safety requirements destroys the agent's original design purpose.
  (h) The fair-share objection translates to a requirement allocation strategy where an individual duty-holder is not responsible for covering the shortfall caused by non-compliant peers. The obligation is capped at the equitable share allocated during the design phase, not the total systemic risk.
  (i) The effectiveness constraint translates to selecting the control measure with the highest risk reduction factor per cost unit, adjusted for the confidence level of the evidence. It highlights the uncertainty in estimating benefit for remote interventions compared to local ones with verified data.

  The residue report indicates significant friction. Item (a) translates cleanly; severity is objective in safety cases. Item (c) translates with distortion; safety engineering inherently accepts ALARP (moderate), whereas the strong principle violates the gross-disproportion limit inherent in most regulations. Item (f) has no counterpart; safety standards allocate duties based on role, contract, or hazard creation, not mere capacity. To translate (f), I must smuggle in the assumption that any capable actor is a de facto duty-holder, which contradicts the safety framework's reliance on defined system boundaries. Item (h) translates with distortion; safety architecture often requires redundancy to cover peer failure, implying a duty to cover shortfalls in high-severity contexts, conflicting with the fair-share cap.

  The primary diagnosis for these failures is a target framework gap. Functional safety is designed for engineered systems with defined boundaries and contractual relationships, not open-world moral agents. The inability to translate (f) suggests safety engineering lacks a theory of general rescue, restricting obligation to those who build or operate the hazard. However, the failure of the strong principle (c) also suggests the source claim is emptier than it looks; it demands a cost-benefit ratio that regulatory frameworks explicitly reject as unsustainable. The fair-share distortion reveals that safety engineering assumes systemic reliability must be maintained regardless of individual component failure, whereas the philosophical objection insists on individual caps.

  Reverse residue concepts from safety engineering offer value to the philosophical debate. The sign-off requirement forces explicit acceptance of residual risk by a named authority, solving the problem of who authorizes dangerous leftovers. The gross-disproportion gloss on ALARP provides a concrete heuristic for the moderate principle, defining "reasonable" via economic and social feasibility rather than intuition. The SOTIF (Safety of the Intended Functionality) concept acknowledges harm without fault, mirroring the philosophical problem of innocent bystanders causing harm through no negligence, yet still requiring mitigation. Finally, the residual-risk transfer concept clarifies who holds the bag when risk cannot be eliminated, forcing a decision on whether the user or the operator accepts the danger.

  The bottom line question asks whether a live disagreement remains once translated. Yes, there is a live disagreement, but it locates primarily in the allocation of requirements and the limit of cost. The Singerian position demands a strong principle that violates the ALARP boundary, while objectors rely on fair-share caps that violate system-level reliability goals. This does not indict the safety framework for lacking moral depth; rather, it indicts the source argument for resting on an unstated assumption about causal contribution. The philosophical debate assumes duty can float free of role or causation, while safety engineering demonstrates that without a defined system boundary and allocated role, duty cannot be engineered or enforced. The residue suggests the debate is not about moral truth but about system architecture: are we building a closed system of specific duties or an open system of general capacity? The safety vocabulary reveals that without the former, the latter is unallocatable.

