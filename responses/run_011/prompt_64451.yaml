  You have correctly identified that 'introspection' is not a single faculty but a bundle of distinct capacities. Your suspicion that the set-up is slightly confused is well-founded, but not fatal; the confusion arises from treating reports of *qualia*, reports of *intention*, and reports of *causal history* as if they were the same kind of knowledge. They are not.

  The principle that rescues your verdicts distinguishes between **concurrent conscious content** (what you are experiencing or intending *now*) and **causal or retrospective explanation** (why something happened or how you felt *then*). You have direct access to the former, but only inferential access to the latter. This preserves your vindication of the chess player's immediate intention (Case 3) while condemning the shoppers' causal explanations (Cases 1 & 2) and your own retrospective anger assessment (Case 5).

  Regarding the chess case you actually care about: when the player offers the reason ten minutes later, he is no longer reporting a concurrent intention. He is reconstructing a narrative based on the current board state. This falls under causal/retrospective opacity. He may be right about the position, but he is not reporting his past mind; he is analysing the present board and projecting backwards. You should stop flip-flopping: treat this as confabulation (or at best, rationalisation), not introspection.

