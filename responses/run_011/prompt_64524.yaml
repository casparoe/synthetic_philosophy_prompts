prompt: |-
  I spent most of a dinner last week arguing with a friend, a philosopher of biology, about what my employer's database actually asserts when it attaches a functional term to a gene product. I curate annotations for a small model-organism database that contributes to a large cross-species gene-function resource. Our consortium's own definitions are written in the vocabulary of activity and contribution — what a gene product does at the molecular level, and what larger process that activity helps accomplish — and our evidence codes simply record what somebody measured and where. My friend's charge was that this is a disguise: that in practice we refuse to propagate perfectly well-supported activities, that we treat a demonstrated side reaction differently from a canonical one, and that our guidelines quietly invoke selection history while our documentation disowns it. I defended our practice as a neutral, evidence-driven enterprise; he said neutrality was exactly what a functional vocabulary cannot deliver. I am no longer certain who won, but I am certain that my curators cannot run this argument every time a gene comes up.

  Please write a decision procedure that my annotation team can run on a proposed function claim. The constraints are these: each curator has a doctorate in molecular biology and no training in philosophy; the procedure must be executable in about fifteen minutes per gene without reading anything theoretical; two curators must reach the same verdict independently, or the case escalates to me; and the output of a run is one of four things — annotate at this term, annotate at a broader or narrower term, record no functional data, or flag for adjudication with a stated reason.

  The procedure should give the questions in order, state what counts as a sufficient answer to each, and mark explicitly, for every step, whether that step is doing causal-role work (what the product contributes to the system it is in), selected-effects work (what the trait's presence in the lineage is explained by), or neither — and where the two come apart so that the choice is conceptual rather than evidential, the procedure should say so rather than pretend the evidence settles it. Tell me which distinctions from the philosophical literature must survive the translation into a checklist and which can be dropped, and what the checklist loses by dropping them. Be candid about the steps that are judgment calls wearing the costume of rules, and about what the procedure cannot do — in particular, it should not be asked to decide whether our resource ought to redefine function.

  Then run it on three cases. First, a gene in a bird whose single-copy product serves as a housekeeping metabolic enzyme in most tissues and as a structural protein in the lens, where both roles are experimentally well supported. Second, an enzyme with a canonical activity plus a much weaker secondary activity demonstrated only in vitro, where one lineage shows signs of having been under recent selection on the secondary reaction. Third, a primate gene disabled by mutation whose orthologs in other mammals carry out a biosynthetic step the primate lineage no longer performs. On the third case, my own instinct is that there is still something true to record about what that gene was for; if the procedure tells me to record nothing, I want the run to show me exactly which commitment of mine it is overriding, and whether that commitment is doing any work elsewhere in our guidelines.

  Finally, give me a one-page version the curators can keep beside them, and a short list of the three or four disputes this procedure will not resolve and that I should therefore expect to keep adjudicating by hand.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** A manager of a gene curation team (model organism database contributing to a cross-species resource like GO).
      *   **Problem:** A philosophical dispute with a biologist/philosopher friend about the nature of "function" in annotations (Causal Role vs. Selected Effect). The friend argues the current practice hides evolutionary assumptions; the user argues it's neutral/evidence-driven.
      *   **Task:** Create a decision procedure (checklist/algorithm) for curators to resolve function claims.
      *   **Constraints:**
          *   Curators have PhDs in molecular biology, no philosophy training.
          *   Execution time: ~15 minutes per gene.
          *   No theoretical reading required during execution.
          *   Inter-rater reliability: Two curators must agree, else escalate.
          *   Output options: Annotate at term, Annotate broader/narrower, No functional data, Flag for adjudication (with reason).
          *   Meta-requirement: Explicitly label steps as Causal Role (CR), Selected Effect (SE), or Neither. Acknowledge where choices are conceptual, not evidential. Acknowledge judgment calls.
          *   Deliverables:
              1.  The Decision Procedure (with meta-commentary).
              2.  Analysis of philosophical distinctions (keep vs. drop).
              3.  Candid admission of limitations (what it can't do).
              4.  Test runs on three specific cases (Bird crystallin/enzyme, Enzyme with promiscuous activity + selection, Primate pseudogene).
              5.  One-page quick reference for curators.
              6.  List of unresolved disputes for the manager.

  2.  **Deconstruct the Philosophical Conflict:**

      *   **Causal Role (CR):** What does the item *do*? What is its causal contribution to the containing system? (Cummins 1975). Good for molecular activities.
      *   **Selected Effect (SE):** Why is the item *there*? What was it selected for? (Millikan 1984, Neander 1991). Good for evolutionary biology, adaptive traits.
      *   **The Tension:** Gene Ontology (GO) and similar resources claim to be CR-based (molecular function, biological process) but often implicitly rely on SE (ignoring "side reactions" or "promiscuous activities" unless there's evidence of conservation/importance).
      *   **The Goal:** Create a procedure that acknowledges this tension without requiring curators to resolve the philosophy. It needs to operationalize the *consortium's current guidelines* while making the hidden assumptions visible.

  3.  **Drafting the Decision Procedure (Iterative Process):**

      *   *Step 1: Evidence Check.* Is there experimental data? (Neither/Epistemic).
      *   *Step 2: Molecular Activity.* Can we describe the biochemical action? (CR).
      *   *Step 3: System Contribution.* Does this action contribute to a larger system phenotype? (CR).
      *   *Step 4: Conservation/Selection.* Is this activity conserved? Is there evidence of selection? (SE).
      *   *Step 5: The "Side Reaction" Check.* If multiple activities exist, which one is "The Function"? (The CR/SE split).
      *   *Refinement:* The prompt asks to label steps as CR, SE, or Neither. It also asks to highlight where the choice is conceptual.
      *   *Constraint Check:* 15 minutes. Needs to be snappy.
      *   *Output:* Must map to the 4 specific outcomes.

  4.  **Developing the Meta-Commentary (Philosophical Translation):**

      *   *Keep:* The CR/SE distinction itself (crucial for the user's peace of mind). The distinction between "capacity" and "normalized function."
      *   *Drop:* Deep debates about teleology, etiology vs. organization, specific philosopher citations (Cummins vs. Millikan). Curators don't need names, they need operational criteria.
      *   *Loss:* Nuance about "system boundaries" and "fitness contribution."

  5.  **Running the Test Cases:**

      *   *Case 1 (Bird Crystallin/Enzyme):* Moonlighting protein.
          *   CR: Both activities are real.
          *   SE: Likely selected for both (or one co-opted).
          *   Procedure outcome: Annotate both? Or flag? GO usually allows moonlighting. Let's see how the procedure handles it.
      *   *Case 2 (Promiscuous Enzyme + Selection):*
          *   CR: Both activities exist.
          *   SE: Secondary activity has selection signal.
          *   Tension: Usually, promiscuity is ignored (CR only), but SE suggests it's becoming a function.
          *   Procedure outcome: Likely Flag for Adjudication (CR says minor, SE says major).
      *   *Case 3 (Primate Pseudogene):*
          *   CR: None (broken).
          *   SE: Past function exists.
          *   User Instinct: Record past function.
          *   Procedure: Likely "No functional data" for *current* function.
          *   Analysis: Must show *why* (commitment to current causal role).

  6.  **Refining the Output Structure:**

      *   **Introduction:** Acknowledge the user's situation.
      *   **The Procedure:** Numbered steps, time estimates, CR/SE labels.
      *   **Philosophical Translation:** What survived, what died.
      *   **Limitations:** Candid admission.
      *   **Test Runs:** The three cases.
      *   **One-Pager:** Condensed version.
      *   **Unresolved Disputes:** For the manager.

  7.  **Drafting Content - Specific Considerations:**

      *   *Tone:* Professional, empathetic to the curator's burden, philosophically precise but accessible.
      *   *The "Neutrality" Lie:* I need to make sure the procedure admits where it's *not* neutral (e.g., prioritizing conserved activities).
      *   *Case 3 Specifics:* The user wants to know which commitment is overriding their instinct. This is likely the commitment to *current* causal capacity over *historical* selected effect.
      *   *Time Limit:* 15 minutes is tight. Steps must be binary or ternary choices, not essays.

  8.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is the procedure too philosophical?
      *   *Fix:* Simplify the language. Instead of "Is this a Selected Effect?", ask "Is there evidence this activity improves fitness or is conserved?"
      *   *Critique:* Did I label the steps?
      *   *Fix:* Ensure every step has a [CR], [SE], or [Neutral] tag.
      *   *Critique:* Did I address the "side reaction" charge?
      *   *Fix:* Make Step 4 specifically about distinguishing canonical vs. side activities.
      *   *Critique:* Case 3 needs to be sharp.
      *   *Fix:* Ensure the output explicitly states "No functional data" but the analysis explains the SE vs. CR conflict.

  9.  **Final Polish:** Check against all constraints in the prompt.
      *   4 outputs? Yes.
      *   15 mins? Yes.
      *   2 curators? Yes (built into the process flow).
      *   Philosophical labels? Yes.
      *   One-pager? Yes.
      *   Unresolved list? Yes.

  (Proceed to generate response based on these thoughts.)
answer: |-
  This is a sophisticated request that requires bridging the gap between high-level philosophy of biology and the practical constraints of database curation. Your friend is correct that "neutrality" is impossible in functional annotation; every decision to annotate *X* but not *Y* implies a theory of what counts as a function. However, your curators cannot be philosophers. They need an operational protocol that makes the hidden assumptions explicit without requiring them to resolve the underlying metaphysics.

  Below is the Decision Procedure, followed by the philosophical analysis, the test runs, and the deliverables for your team.

  ***

  # The Functional Annotation Decision Procedure (FADP)

  **Purpose:** To standardize decisions on gene product function claims while explicitly marking where evolutionary assumptions (Selected Effect) intersect with biochemical observations (Causal Role).
  **Time Limit:** 15 Minutes per gene.
  **Users:** Two independent curators.
  **Outputs:** (1) Annotate at Term, (2) Annotate Broader/Narrower, (3) No Functional Data, (4) Flag for Adjudication.

  ### Phase 1: Evidence & Capacity (5 Minutes)

  **Step 1: Direct Evidence Check [Neutral]**
  *   **Question:** Is there direct experimental evidence (mutant phenotype, biochemical assay, physical interaction) linking this specific gene product to the proposed activity in this specific organism?
  *   **Sufficient Answer:** Yes (PubMed ID provided) / No (Inference only).
  *   **Action:** If **No**, proceed to Step 6 (No Functional Data). If **Yes**, proceed to Step 2.

  **Step 2: Causal Capacity Check [Causal Role]**
  *   **Question:** Does the gene product physically possess the capacity to perform this activity under physiological conditions (e.g., correct substrate concentration, localization, pH)?
  *   **Sufficient Answer:** Yes (In vivo or physiologically relevant in vitro) / No (Only under non-physiological stress/artifact).
  *   **Action:** If **No**, output **No Functional Data**. If **Yes**, proceed to Step 3.

  ### Phase 2: Context & Contribution (5 Minutes)

  **Step 3: System Contribution Check [Causal Role]**
  *   **Question:** Does this activity contribute to a larger system property or phenotype (e.g., metabolic flux, structural integrity, signaling cascade) in the organism?
  *   **Sufficient Answer:** Yes (Disruption alters the system) / No (Activity occurs but system is buffered/unchanged) / Unknown.
  *   **Action:** If **No**, proceed to Step 5. If **Yes**, proceed to Step 4.

  **Step 4: The "Side Reaction" Filter [Mixed CR/SE]**
  *   **Question:** Are there multiple demonstrated activities? If yes, is the proposed activity the *primary* consumer of the protein's capacity, or is it a secondary/promiscuous activity?
  *   **Sufficient Answer:** Primary / Secondary / Equal (Moonlighting).
  *   **Conceptual Warning:** *This step is where Causal Role and Selected Effect diverge. A "Secondary" activity is still a Causal Role. Distinguishing it requires an assumption about what counts as "The Function."*
  *   **Action:**
      *   If **Primary**: Proceed to Step 5.
      *   If **Equal (Moonlighting)**: Annotate both terms (Output 1).
      *   If **Secondary**: Proceed to Step 5.

  ### Phase 3: Evolutionary Context (5 Minutes)

  **Step 5: Conservation & Selection Check [Selected Effect]**
  *   **Question:** Is this specific activity conserved across the relevant lineage, or is there evidence of positive selection maintaining this specific activity?
  *   **Sufficient Answer:** Yes (Conserved/Selected) / No (Lineage-specific/Drift) / Unknown.
  *   **Conceptual Warning:** *If Step 4 was "Secondary" but Step 5 is "Yes," you have a conflict. Biochemically it is minor (CR), but evolutionarily it is maintained (SE). This is a conceptual conflict, not an evidential one.*
  *   **Action:**
      *   If **Primary + Yes**: Output **Annotate at Term**.
      *   If **Primary + No/Unknown**: Output **Annotate at Broader Term** (generalize the function).
      *   If **Secondary + Yes**: Output **Flag for Adjudication** (Reason: CR/SE Conflict).
      *   If **Secondary + No**: Output **No Functional Data** (Treat as noise).

  ### Phase 4: Fallback

  **Step 6: Inference Only [Neutral]**
  *   **Question:** (Reached only if Step 1 was No). Is the claim based solely on sequence similarity?
  *   **Action:** Output **No Functional Data** (for functional terms; allow sequence homology tags if consortium permits).

  ***

  # Philosophical Translation: What Survives and What Dies

  To build this checklist, I had to translate philosophical distinctions into operational questions. Here is what was retained, what was discarded, and the cost of that translation.

  ### Distinctions Retained
  1.  **Capacity vs. Contribution (Cummins' Causal Role):** Steps 2 and 3 distinguish between what a molecule *can* do (bind substrate) and what it *does* for the system (metabolism). This preserves the CR framework your consortium claims to use.
  2.  **History vs. Here-and-Now (Selected Effect):** Step 5 explicitly introduces evolutionary history. This acknowledges your friend's charge that you cannot ignore selection history when deciding between "canonical" and "side" reactions.
  3.  **The "Moonlighting" Exception:** The procedure allows for multiple functions (Step 4), acknowledging that one item can have multiple Causal Roles without requiring a single Selected Effect.

  ### Distinctions Dropped
  1.  **Etiological vs. Organizational Teleology:** We do not ask curators to distinguish between "selected for" (Millikan) and "contributing to current viability" (Mossio). Step 5 lumps conservation and selection together.
      *   *Loss:* We lose the ability to distinguish between a trait maintained by purifying selection (old function) vs. positive selection (new function).
  2.  **System Boundaries:** Philosophy debates what counts as "the system" (the cell? the organism? the ecosystem?). The procedure assumes "the organism" is the system.
      *   *Loss:* We cannot capture functions that benefit the microbiome or the group but not the individual organism.
  3.  **Normativity:** We drop the question of whether a function implies a "norm" (what it *ought* to do). We treat "Primary" (Step 4) as a proxy for "Normative."

  ### Candid Admission of Judgment Calls
  *   **Step 4 (Primary vs. Secondary):** This is the most dangerous step. It wears the costume of a rule but is a judgment call on kinetic dominance vs. physiological relevance. Curators must know that "Primary" is often a proxy for "Consensus in Literature," not just raw data.
  *   **Step 5 (Conservation as Proxy for Selection):** Conservation is not proof of Selected Effect (it could be hitchhiking). However, requiring explicit fitness measurements is impossible. This step accepts conservation as a *proxy* for SE without claiming it is proof.

  ### What This Procedure Cannot Do
  *   **It cannot decide if the resource should redefine function.** It operates within your current constraints.
  *   **It cannot resolve the "Pseudogene" paradox.** If the gene is broken, Step 1 fails. It forces a "No Functional Data" output, overriding your instinct about historical function.
  *   **It cannot eliminate disagreement.** It only structures the disagreement so you (the manager) can resolve it faster in adjudication.

  ***

  # Test Runs

  ### Case 1: The Bird Lens Enzyme (Crystallin)
  *   **Context:** Single-copy gene. Metabolic enzyme in liver (high activity). Structural protein in lens (high abundance, low catalytic need). Both experimentally supported.
  *   **Run:**
      *   Step 1 (Evidence): **Yes** (Both tissues).
      *   Step 2 (Capacity): **Yes** (Both).
      *   Step 3 (Contribution): **Yes** (Metabolism in liver; Refraction in lens).
      *   Step 4 (Side Reaction): **Equal (Moonlighting)**. (Catalysis is low in lens, but structural role is high; vice versa in liver).
      *   **Output:** **Annotate at Term** (Both Molecular Function and Biological Process terms for both roles).
  *   **Analysis:** The procedure handles moonlighting well by allowing the "Equal" branch. It avoids the CR/SE conflict by acknowledging two distinct Causal Roles in two distinct systems (tissues).

  ### Case 2: The Promiscuous Enzyme with Selection
  *   **Context:** Canonical Activity A (strong). Secondary Activity B (weak, in vitro). Lineage shows recent positive selection on residues governing Activity B.
  *   **Run:**
      *   Step 1 (Evidence): **Yes** (A is strong, B is demonstrated).
      *   Step 2 (Capacity): **Yes** (Both).
      *   Step 3 (Contribution): **Yes** (A contributes to main pathway; B's contribution is ambiguous in vivo).
      *   Step 4 (Side Reaction): **Secondary** (Kinetic efficiency favors A).
      *   Step 5 (Conservation/Selection): **Yes** (Positive selection on B).
      *   **Output:** **Flag for Adjudication** (Reason: CR/SE Conflict).
  *   **Analysis:** This is the exact case your friend cited. CR says "Side reaction, ignore." SE says "Selected trait, annotate." The procedure correctly identifies this as a conceptual conflict requiring manager intervention. It prevents the curator from silently ignoring the selection data.

  ### Case 3: The Primate Pseudogene
  *   **Context:** Primate gene disabled by stop codon. Orthologs in other mammals perform Biosynthetic Step X. Primates do not perform Step X (dietary acquisition).
  *   **Run:**
      *   Step 1 (Evidence): **No** (Product is truncated/non-functional in primate).
      *   **Output:** **No Functional Data**.
  *   **Analysis of Your Instinct:**
      *   You feel there is "something true to record." That truth is a **Selected Effect** claim ("This gene *was* for Step X").
      *   The procedure overrides this because it prioritizes **Current Causal Role** (Step 1 & 2).
      *   **Commitment Overridden:** The commitment that annotations describe *current* biological capacities of the specific genome being curated, not the evolutionary history of the locus.
      *   **Does this commitment work elsewhere?** Yes. It prevents curators from annotating human genes with mouse functions when the human gene is a pseudogene. It maintains the integrity of the "current organism" view. If you want to record the history, you need a separate "Evolutionary History" field, not a "Molecular Function" annotation.

  ***

  # One-Page Quick Reference (For Curators)

  **FUNCTIONAL ANNOTATION CHECKLIST (15 Min Limit)**
  *Complete independently. If outputs differ, escalate to Manager.*

  **1. EVIDENCE [Neutral]**
  *   [ ] Direct experimental data in *this* organism? (Yes/No)
  *   *If No → Output: No Functional Data.*

  **2. CAPACITY [Causal Role]**
  *   [ ] Does it work under physiological conditions? (Yes/No)
  *   *If No → Output: No Functional Data.*

  **3. CONTRIBUTION [Causal Role]**
  *   [ ] Does the activity change the system/phenotype? (Yes/No/Unknown)
  *   *If No → Go to Step 5.*

  **4. PRIMARY VS. SECONDARY [Mixed]**
  *   [ ] Multiple activities? Is this the main one? (Primary / Secondary / Equal)
  *   *If Equal → Output: Annotate Both.*
  *   *If Primary → Go to Step 5.*
  *   *If Secondary → Go to Step 5.*

  **5. CONSERVATION/SELECTION [Selected Effect]**
  *   [ ] Is activity conserved or under selection? (Yes/No)
  *   *If Primary + Yes → Output: Annotate at Term.*
  *   *If Primary + No → Output: Annotate Broader Term.*
  *   *If Secondary + Yes → Output: **FLAG FOR ADJUDICATION** (CR/SE Conflict).*
  *   *If Secondary + No → Output: No Functional Data.*

  **REMINDERS:**
  *   **Step 4 is a judgment call.** "Primary" usually means "Consensus in Literature."
  *   **Step 5 is a proxy.** Conservation ≈ Selection.
  *   **Pseudogenes:** If the protein is broken, stop at Step 1. Do not annotate historical function.

  ***

  # Unresolved Disputes (For Manager Adjudication)

  This procedure will filter out 80% of cases. You will still need to adjudicate the following three disputes manually, as they are philosophical stalemates disguised as curation issues:

  1.  **The "Neofunctionalization" Threshold (Case 2 Variant):** When does a selected secondary activity become a primary function? The procedure flags this, but you must decide the policy: Do we annotate *emerging* functions (SE) before they are kinetically dominant (CR)?
  2.  **The "Broken Tool" Problem (Case 3 Variant):** How do we handle disease mutations? A mutant enzyme has lost Causal Role, but retains Selected Effect (it is *for* catalysis, it's just broken). The procedure says "No Data," but clinical curators often want to record "Loss of [Function]." You must decide if "Function" includes "Intended but failed capacity."
  3.  **The System Boundary Dispute:** If a gene product secretes a metabolite that benefits a symbiont but costs the host (e.g., pathogen virulence factor), is that a function? Step 3 asks about "the system." You must define if "the system" is the host cell, the organism, or the holobiont. The procedure assumes "organism," but edge cases will violate this.

  **Final Advice:** Your friend is right that you aren't neutral. But your curators don't need to know *why* they aren't neutral; they just need to know *where* the bias enters the pipeline. This procedure locates the bias at Step 4 and Step 5, allowing you to manage it rather than deny it.
