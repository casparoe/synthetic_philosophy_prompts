      *   **Constraints:**
          *   Reconstruct positions *before* giving labels (no jargon without explanation).
          *   Be committed (take a position, don't just survey).
          *   Distinguish between what is forced by statutory structure vs. speculation on legislative intent.
          *   Address 5 specific numbered points.
          *   Final recommendation on system design (letter vs. spirit/theory).

  2.  **Deconstruct the 5 Questions:**

