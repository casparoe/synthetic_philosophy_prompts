      *   5. Design: Letter vs. Spirit. Recommendation.

      *(Self-Correction during drafting)*: Make sure to explicitly address the "2 a.m. freeze" example in Q1 as the under-inclusion case. Make sure to explicitly address the "private right of action" in Q3.

      *Refining Q5:* The user asks "What theory would my system then be implementing?" If they switch to vulnerability, they are implementing a **Capabilities Approach** (real freedom to choose). I need to be clear on the risk: Regulators can check a Governor's signature easily. They cannot easily check "number of alternative providers" without discovery. This makes the vulnerability rule legally dangerous.

      *Final Polish:* Ensure the distinction between "Statutory Fact" and "Philosophical Speculation" is clear in every section.

