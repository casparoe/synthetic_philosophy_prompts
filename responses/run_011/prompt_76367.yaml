      *   **Q2: The Baseline (Historical Price vs. Cost).** Cost-of-production vs. Status-quo/Entitlement. CA vs. FL coherence.
      *   **Q3: Enforcement (Public vs. Private).** Who is wronged? Public harm vs. Individual harm.
      *   **Q4: Rival Accounts.** What views are ruled out? (e.g., Commodification, Libertarian Efficiency).
      *   **Q5: Design Recommendation.** Vulnerability rule vs. Legal flag. Theory implemented. Pros/Cons. Definite recommendation.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the user's insight. Validate that the legal architecture *does* carry philosophical weight, even if accidental.

      *   **Q1: The Trigger (The State of Exception).**
          *   *Observation:* The law triggers on a declaration, not on actual scarcity or desperation.
          *   *Reconstruction:* If the wrong were purely "exploiting desperation," the trigger would be metrics of desperation. Since it's a declaration, the wrong is about the *suspension of normal market rules*.
          *   *Concept:* The "State of Exception" (Schmitt/agamben vibes, but keep it accessible). The declaration signals that the background conditions for fair exchange (competition, mobility, rational choice) are broken.
          *   *Label:* **Procedural Legitimacy / Social Contract Suspension.**
          *   *Over/Under-inclusion:* It over-includes (declared emergency but no local scarcity) and under-includes (no declaration but high scarcity, e.g., the 2 a.m. freeze).
          *   *Commitment:* It errs toward *administrative clarity* over moral precision. It treats the declaration as a "Safe Harbor" revocation. The wrong is violating the *temporary duty of solidarity* triggered by the collective crisis recognition, not just individual vulnerability.

      *   **Q2: The Baseline (Just Price Theory).**
          *   *Observation:* Laws look at *previous price*, not *cost* (mostly) or *value to buyer*.
          *   *Reconstruction:* This implies the seller had a "rightful" price before. Changing it is the violation.
          *   *Concept:* **Status-Quo Entitlement.** You are locked into your prior dealing.
          *   *CA vs. FL:* CA allows cost-pass-through (Cost-Plus). FL allows market trends (Demand-Side).
          *   *Coherence:* CA is more internally coherent with a "anti-exploitation" view (you can't profit from the disaster, only cover costs). FL is incoherent; it bans "gouging" but allows price hikes due to "market trends" (which *is* demand surging). FL is smuggling in **Efficiency** while pretending to enforce **Fairness**.
          *   *Label:* **Historical Entitlement Theory (CA)** vs. **Mixed/Confused Theory (FL).**

      *   **Q3: Enforcement (Public vs. Private).**
          *   *Observation:* No private right of action. State sues, not customer.
          *   *Reconstruction:* If the customer were the primary victim, they should sue (like breach of contract). Since the State sues, the *community* is the victim.
          *   *Concept:* **Public Nuisance / Civic Harm.** Gouging undermines trust in the market system itself during a crisis.
          *   *Reconciliation:* The individual is harmed, but the *wrong* is the erosion of social cohesion.
          *   *Label:* **Public Harm Model.**

      *   **Q4: Rival Accounts.**
          *   *Rival 1:* **Libertarian/Efficiency View.** High prices allocate scarce goods to those who value them most/prevent hoarding. The law rules this out entirely.
          *   *Rival 2:* **Commodification/Sandel View.** Some things shouldn't be priced by demand at all (moral limits of markets). The law *partially* honors this by capping prices, but fails to honor it fully because it still allows *some* markup (10% or cost-plus).
          *   *Commitment:* Most incompatible with **Libertarian Efficiency**. Merely fails to honor **Commodification** (it regulates price, doesn't ban market allocation).

      *   **Q5: Design Recommendation.**
          *   *Proposal:* Vulnerability Rule (alternatives, essentiality, etc.).
          *   *Theory Implemented:* **Capabilities Approach / Vulnerability-Based Fairness.** Focuses on the buyer's actual ability to choose, not a political flag.
          *   *Pros:* Morally tighter (hits actual exploitation).
          *   *Cons:* Legal risk (safe harbor is the law, not the theory), Gaming (providers might hide availability), Auditability (harder to prove "vulnerability" than "declaration existed").
          *   *Recommendation:* **Comply with the Letter, Optimize within the Cap.** Do not replace the flag with a vulnerability algorithm for *legal compliance*. The legal risk is too high. However, use the vulnerability logic for *ethical capping* below the legal max.
          *   *Least Defensible Feature:* The **Political Trigger** (Q1). It creates the biggest moral blind spots (the 2 a.m. freeze scenario).

  4.  **Refining and Polishing:**
      *   *Tone:* Professional, analytical, respectful of the user's engineering mindset. Avoid overly dense academic jargon without definition.
      *   *Check Constraints:* Did I label *after* reconstruction? Yes. Did I distinguish statute vs. speculation? I need to make sure I explicitly mark this. Did I take a stand? Yes.
      *   *Self-Correction on Q2:* I need to be careful about FL law. The prompt says FL excuses increases attributable to market trends. This is a huge distinction. CA is Cost-Plus. FL is Cost-Plus *or* Market Trend. This makes FL much more permissive and arguably less coherent regarding "gouging." I need to highlight this tension.
      *   *Self-Correction on Q5:* The user asks "Should a marketplace implement to the letter... or to the theory?" As an engineer owning a service, legal liability is real. I must advise compliance with the letter, but suggest the theory can inform *internal* ethics. I shouldn't advise them to break the law to be more moral.
      *   *Philosophical Labels:* Ensure they are clear. (e.g., "Procedural Legitimacy," "Historical Entitlement," "Public Harm").

  5.  **Final Review against constraints:**
      *   "Wherever you need a philosophical term, please reconstruct the position first and give me the label afterward." -> *Will ensure this structure.*
      *   "Commit to one reading." -> *Will avoid hedging.*
      *   "Mark clearly which parts... are forced by statutory structure... and which are speculation." -> *Will use brackets or explicit phrasing.*

  6.  **Writing the Response:** (Mental Outline)
