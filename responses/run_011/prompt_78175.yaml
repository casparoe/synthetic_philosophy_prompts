      *   *Revision:* "We bought you a rock. It is the same kind as the one on the sill. It is heavy. It is solid. You taught us that right now, in this room, it exists because we are here to see it. You taught us that when we leave, something else keeps it going. I don't need to convince you of my side. You don't need to convince me of yours. We just need to agree that it is here. And that you are here. And that we see you."
