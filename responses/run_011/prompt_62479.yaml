  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION: NATIONS AND NATIONALISM

  **Date:** 24 May 2024
  **Signatories:** [Medievalist Name], [Historical Sociologist Name]
  **Facilitator:** [Postdoc Name]

  ## (a) Agreed Claims

  1.  **Contemporaneity of Evidence:** Claims regarding the existence of a nation at time *t* must rely primarily on evidence produced at or near *t*. Retrospective claims (e.g., a 19th-century historian asserting a 9th-century nation) are treated as evidence of 19th-century nationalism, not 9th-century reality, unless corroborated by contemporary material.
  2.  **Categorical Distinctions:** We distinguish between:
      *   *Dynasty:* A ruling lineage claiming legitimacy through blood/divine right.
      *   *Kingdom/State:* A territorial political unit with a monopoly on violence/taxation.
      *   *Ethnie:* A named population with a myth of common ancestry and shared historical memories.
      *   *Nation:* A political community where legitimacy derives from the consent/identity of the governed (see Disagreement 1 for the scope of "governed").
  3.  **Invented Tradition:** The "invented tradition" thesis (Hobsbawm) is not a claim that traditions are "lies" or "fake." It is a claim that specific rituals/symbols were formalized or standardized to inculcate values and imply continuity with a suitable historic past, often in response to rapid social change. Both sides agree traditions can be constructed *and* meaningful.
  4.  **Print Capitalism:** Print technology is agreed to be a powerful standardizer of vernaculars and an accelerator of shared consciousness. However, it is not agreed to be a *necessary* condition for all forms of collective political identity, nor is it sufficient on its own without institutional uptake (schools, bureaucracy, military).
  5.  **The Swiss Boundary Case:** Both parties acknowledge the Old Swiss Confederacy (c. 1350–1798) as a critical test case. It possesses written legal compacts and a shared military culture without a unified printed language or centralized mass schooling prior to 1798. It is agreed that this case challenges the strictest modernist thresholds while simultaneously challenging the medievalist's reliance on monarchical/elite models.
  6.  **Verbal Dispute Acknowledgement:** Both parties acknowledge that a portion of the disagreement rests on the semantic boundary of the word "nation." We agree to test whether substituting the term "mass-identification political community with an authoritative centre" resolves specific impasses (see Disagreement 4).

  ## (b) Disagreements

  | Topic | Wording the Modernist would sign | Wording the Medievalist/Ethnosymbolist would sign | Genuine or Verbal | Why |
  | :--- | :--- | :--- | :--- :--- |
  | **1. The Threshold of "Nation"** | A nation requires the *possibility* of mass mobilization and standardized high culture, typically dependent on industrial-era communication and administrative penetration. | A nation exists when a critical mass of the political community (including elites and active commoners) recognizes a shared destiny and distinct identity, regardless of industrial infrastructure. | Genuine | This is a disagreement about the sociological preconditions for political legitimacy, not just the label. |
  | **2. The Swiss Confederacy (1350–1600)** | The Confederacy was a defensive league of *corporate bodies* (valleys/cities), not a nation. The "Swiss" national identity was a later superstructure imposed on this alliance during the 18th/19th centuries. | The Confederacy functioned as a *sui generis* nation: a corporate body of individuals bound by oath and law, sustaining a shared identity through oral culture and ritual (e.g., Tagsatzung) without needing a print market. | Genuine | This turns on whether a league of communes counts as a "people" or merely an alliance of states. |
  | **3. Continuity vs. Rupture** | Nationalism represents a structural rupture. Pre-modern ethnic ties are distinct from modern national ties; conflating them obscures the specific functional role of nationalism in modernity. | Nationalism represents an evolution. Modern nations are built upon pre-existing ethnic cores (*ethnies*); ignoring this continuity renders the emotional power of nationalism inexplicable. | Genuine | This is a disagreement about historical causality and the nature of social change. |
  | **4. Terminology ("Nation" vs. "Political Community")** | If we replace "nation" with "mass-identification political community," my claim stands: such communities were structurally impossible before modern communication states. | If we replace "nation" with "political community with shared destiny," my claim stands: such communities existed frequently in the medieval period (e.g., England, Switzerland). | Verbal | If the definition is fixed to "mass-identification," the Medievalist concedes the term but keeps the phenomenon. If fixed to "shared destiny," the Modernist concedes the term but keeps the functional distinction. |

  ## (c) Cruxes

