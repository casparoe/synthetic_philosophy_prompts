answer: |-
  You are right to suspect that the phrase is doing too much work for something so semantically thin, and unpacking it requires separating the legal baseline from the normative claims about power and representation. The first reading is the strict constitutional law interpretation your third colleague hinted at, where what is equalized is the population size of the electoral districts, equal for each voter, measured at the time of districting, by the standard of headcount. This is largely a platitude in American public law following Reynolds v. Sims, requiring that districts be roughly equal in population so that no voter's ballot is diluted by being placed in an oversized district. Both your current single-member system and the proposed proportional list satisfy this, provided your eleven constituencies are already equal in headcount and the university-wide list is treated as a single district of the whole population, so this reading cannot decide the debate unless your current districts are malapportioned, which your colleague seems to assume they are not.

  The second reading, which your mathematician is invoking, equalizes the ex ante probability of a vote being decisive, equal for each voter, measured before the election, by the standard of statistical power indices like Banzhaf or Shapley-Shubik. This is a substantive and arguable claim rather than a legal baseline, because it shifts focus from the weight of the ballot as cast to the likelihood of affecting the outcome. The single-member system generally fails this test if constituencies vary in competitiveness, as a vote in a safe seat has a near-zero probability of influencing the winner compared to a vote in a marginal seat, whereas a proportional list with a single large district magnitude tends to equalize this probability across the electorate, though the verdict turns on the specific threshold for representation and whether the list is open or closed.

  The third reading equalizes the share of seats won relative to votes cast, equal for each group of like-minded voters, measured after the election, by the standard of proportionality between vote percentage and seat percentage. This is also substantive and contested, as it treats the vote as a claim to a share of representation rather than a choice between individuals. The single-member system clearly fails this, as it converts pluralities into 100 percent of the representation for that district, while the proportional list satisfies it by design, assuming the district magnitude is high enough and legal thresholds are low enough to prevent significant disproportionality.

  The fourth reading, which your chair relies on, equalizes the accountability link between the voter and the representative, equal for each voter, measured after the election, by the standard of qualitative responsiveness and identifiable responsibility. This is a normative claim about the nature of representation rather than the mathematics of the vote, arguing that a vote should purchase a specific agent answerable to you. The single-member system satisfies this by providing a local representative whose reelection depends on that specific constituency, whereas the proportional list weakens this link because representatives are answerable to the party list or the university at large, making the connection diffuse even if the mathematical weight of the vote is higher.

  Looking at your colleagues through these distinctions, the chair needs the fourth reading about accountability to make the slogan do the work of defending the status quo, and she is entitled to it insofar as it is a valid normative conception of representation, even if it is not the legal definition. The mathematician needs the second reading about probability of influence to claim the current system is unfair, and he is entitled to it because it is the rigorous statistical interpretation of voting power, though he errs if he presents it as the only valid meaning. The third colleague needs the first reading about malapportionment to dismiss the debate entirely, and she is entitled to it as a matter of legal doctrine, but she is mistaken if she implies it exhausts the phrase's meaning in political theory or prevents further argument about power and proportionality.

  Ultimately, the chair and the mathematician are not contradicting each other but talking past one another with the same noise, because they are using different definitions of what a vote is supposed to buy. The chair defines the value of a vote by the quality of the representation it secures, while the mathematician defines it by the probability of influencing the outcome, and since the single-member system optimizes for the former at the expense of the latter, while the proportional list does the reverse, their disagreement is about priorities rather than facts. You can acknowledge that both are correct within their own frameworks without accepting that either framework settles the issue, which leaves you free to argue about which kind of equality matters more for a faculty senate rather than pretending the slogan itself dictates the answer.
