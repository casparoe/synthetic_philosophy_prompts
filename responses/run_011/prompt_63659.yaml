prompt: |-
  Longtime LW reader, and this is the first time a slogan has actually stumped me. A friend of mine keeps pulling out "rational people can't agree to disagree" as a conversation-ender. Latest instance: we spent an hour going over the same dataset for some forecast, and afterwards he said "we've both seen the same numbers, so the fact that you're still saying 30% and I'm still saying 55% means one of us isn't being rational — and I checked my work." I'm fairly confident he's getting more out of that sentence than it can pay for, but I can't say where.

  Could you lay out the distinct precise claims it could be standing for? My guess is there's the actual theorem (Aumann's, with its assumptions spelled out rather than waved at), and then a pile of cousins: one about shared evidence, one about priors, one about what you're supposed to do when you find out someone disagrees with you, maybe one about trades and Dutch books. For each reading, say whether it's provable, merely trivial, or just false — and then tell me which one my friend actually needed for what he said, and whether he's entiteld to it.

  One more thing, from a memory I don't trust: does any of it survive if you downgrade common knowledge to "we each know that we each know" four or five levels deep? I have a feeling disagreement becomes possible again at finite depth, and if so I want to know what exactly the infinite nesting is buying you and why it's supposed to be worth anything in a real argument between two humans.
