answer: |-
  ### Exam Question

  **Course:** POL304: Political Theory of Secession and Self-Determination
  **Time Allowed:** 2 Hours
  **Instructions:** Answer the following question. All necessary case details are provided within the prompt.

  **Question 1 (25 Marks)**

  Consider a political theory that grants any distinct "people" a primary right to secede from an existing state if they demonstrate a majority will to do so. In 1995, Quebec held a referendum on leaving Canada. Days prior, the James Bay Cree, whose territory lies within Quebec, held their own vote: 96% voted to remain in Canada if Quebec seceded. A similar dynamic haunts contemporary Catalonia: if Catalonia secedes from Spain, does the Val d'Aran (a distinct valley within Catalonia) have the right to remain in Spain?

  This creates a problem of **recursion**. If the right to self-determination justifies Quebec leaving Canada, it seemingly justifies the Cree leaving Quebec. If it justifies the Cree leaving Quebec, it might justify a village leaving the Cree territory. The map risks infinite fracturing.

  Critics argue that to avoid this regress, a theory must establish a **principled stopping rule**—a reason why the right to secede applies at the level of Quebec but not the Cree, or Catalonia but not the Val d'Aran. However, any such rule inevitably excludes some groups from exercising the very right granted to the larger unit.

  **Essay Task:**
  Propose a principled stopping rule that resolves the recursion problem without relying solely on existing constitutional law or the arbitrary fact of current borders. Explain why this rule is theoretically justified. Then, explicitly account for the **normative cost** of this rule: what right or interest is sacrificed by the excluded sub-group (e.g., the Cree or the Val d'Aran), and is that sacrifice justified?

  ***

  ### Model Answer

  The recursion problem exposes a fatal tension in unconstrained primary-right theories of secession. If self-determination is grounded solely in the democratic will of a "people," there is no theoretical barrier to infinite fragmentation, as any sub-unit can claim to be a "people" with a distinct will. To resolve this, a theory must move beyond simple plebiscitary rights and adopt a stopping rule based on **territorial integrity of administrative units coupled with remedial safeguards**.

  A robust stopping rule posits that the right to secede attaches to the highest sub-state political unit with a history of autonomous jurisdiction (e.g., Quebec or Catalonia), but does not automatically devolve to sub-regions (e.g., James Bay or Val d'Aran). This is not merely pragmatic; it is grounded in the value of **political stability as a precondition for justice**. Self-determination requires a viable territory capable of sustaining basic rights and economic function. If every municipality could secede, the resulting patchwork would fail to secure the rights that self-determination is meant to protect. Therefore, the "stopping point" is the existing federal or provincial border, provided that border has historical legitimacy as a jurisdictional entity.

  However, halting recursion at the provincial level incurs a significant normative cost for the excluded sub-group. By denying the James Bay Cree the right to remain in Canada, the theory effectively subordinates their democratic will to the larger Quebecois majority. The cost is **political alienation**: the Cree are forced into a new sovereign state against their expressed consent. In liberal theory, being ruled without consent is a prima facie injustice. The stopping rule essentially prioritizes the self-determination of the larger unit over the self-determination of the smaller unit.

  Is this sacrifice justified? It is justified only if the new state offers robust minority protections. If Quebec or Catalonia can guarantee the Cree or Val d'Aran cultural autonomy, language rights, and local governance within the new state, the cost of exclusion is mitigated. The stopping rule transforms the sub-group's claim from a right to *statehood* into a right to *accommodation*.

  However, if the seceding state is ethno-nationalist and hostile to the sub-group, the stopping rule becomes complicit in oppression. In such cases, the stopping rule must yield to a **remedial right**. If the larger secessionist project threatens the basic human rights of the internal minority, the recursion re-opens: the sub-group gains a right to secede (or remain with the original state) based on justice, not just democratic will.

  Thus, the principled stopping rule is: *Secession is permissible at the highest administrative level, provided the new state guarantees minority rights; if it does not, sub-units regain a remedial right to detach.* This avoids infinite regress by establishing a presumption against fragmentation, while acknowledging that the cost of this presumption—the forced inclusion of dissenting minorities—is only bearable if their fundamental rights are secure. To rule otherwise is to privilege order over justice; to allow unlimited recursion is to privilege fragmentation over the capacity to govern. The theory must accept that some democratic wills will be frustrated to ensure that any resulting state can actually function as a vehicle for justice.

  ***

  ### Marking Scheme (Total: 25 Marks)

  **First-Class Answer (20–25 Marks)**
  *   **Identifies the Theoretical Core:** Recognizes recursion not just as a practical mess, but as a logical failure of unconstrained Primary-Right theory.
  *   **Principled Stopping Rule:** Proposes a rule grounded in theory (e.g., viability, administrative history, or justice) rather than mere stability or "what the constitution says."
  *   **Normative Cost Analysis:** Explicitly identifies what the excluded group loses (e.g., consent, political agency, risk of tyranny) and evaluates whether this loss is justified.
  *   **Nuance:** Acknowledges that the stopping rule is conditional (e.g., it holds *unless* human rights are violated), integrating Remedial-Right theory as a safety valve rather than a definition.

  **Second-Class Answer (15–19 Marks)**
  *   **Describes the Problem:** Clearly explains the Quebec/Cree or Catalonia/Aran dynamic but treats it more as a case study than a theoretical crisis.
  *   **Stopping Rule:** Proposes a rule but relies heavily on pragmatism ("it would be too chaotic") or existing borders without justifying *why* those borders have moral weight.
  *   **Cost Analysis:** Mentions the excluded group but treats their exclusion as a necessary evil without analyzing the specific normative injury (e.g., lack of consent).
  *   **Theory Usage:** Defines Primary vs. Remedial rights correctly but applies them mechanically rather than synthesizing them to solve the recursion.

  **Third-Class / Fail (Below 15 Marks)**
  *   **Trivia Recall:** Focuses on historical accuracy of the 1995 vote rather than the theoretical implication.
  *   **Begging the Question:** Argues the Cree cannot secede simply because "Quebec voted yes" (majoritarianism within the larger unit begs the recursion question).
  *   **Purely Practical:** Argues against recursion solely on grounds of economic viability or international recognition, ignoring the moral rights at stake.
  *   **Ignores Prompt:** Fails to articulate a specific "cost" to the excluded people.

  **Specific Penalties (Deductions within bands)**
  *   **-5 Marks:** **The Majoritarian Fallacy.** Arguing that the Quebec majority automatically trumps the Cree minority without addressing why the "people" is defined at the provincial level.
  *   **-5 Marks:** **The Stability Trap.** Justifying the stopping rule *only* on the basis of international order or economic stability, ignoring the liberal requirement for consent/legitimacy.
  *   **-3 Marks:** **Constitutional Positivism.** Arguing the recursion stops simply because "the Canadian Constitution says so," failing to provide a *principled* theoretical rule as requested.
  *   **-2 Marks:** **Definition Bloat.** Spending more than 150 words simply defining Primary vs. Remedial rights without applying them to the recursion problem.
