answer: |-
  ### STUDENT ACTIVITIES COUNCIL: VOTING PROCEDURE FOR MULTI-CRITERIA DECISIONS

  **1. Order of Votes**
  Votes are always taken on individual criteria first (e.g., Interest, Sponsor, Mission), followed by a final vote on the Motion (Grant/Deny). The final Motion vote is required for the record but is **provisional**.

  **2. Secretary's Divergence Check (Complete before announcing results)**
  *   **Step 1:** Count "Yes" votes for each Criterion. Mark any Criterion with 6 or more "Yes" votes as **PASSED**.
  *   **Step 2:** Count "Yes" votes for the Final Motion.
      *   *For Charters (All Criteria must pass):* If **ALL** Criteria are PASSED but the Motion has fewer than 6 "Yes" votes, mark **DIVERGENCE**.
      *   *For Appeals (Any Criterion passes):* If **ANY** Criterion is PASSED but the Motion has fewer than 6 "Yes" votes, mark **DIVERGENCE**.
  *   **Step 3:** Hand tally sheet to Chair. If **DIVERGENCE** is marked, do not announce the Motion result yet.

  **3. Chair Action on Divergence**
  If Divergence is marked, the Chair announces: *"The Criteria votes meet the Handbook requirements. The Motion vote is recorded but superseded by the Criteria. The [Charter is granted / Appeal is upheld]."*
  *   **Reason:** The Council is bound by the Handbook. The Criteria votes establish the facts required by the rules; the Motion vote expresses preference. When facts mandate an outcome, preference cannot override them without violating the Handbook.

  **4. Minutes Recording**
  Record all vote counts. Add the following standard text when Divergence occurs:
  > *"A divergence occurred between the criteria votes and the final motion. Per SAC Procedure §2, the criteria votes control as they satisfy the Handbook requirements for [Chartering/Appeal]. The motion to [Deny/Reject] is noted but did not alter the outcome."*

  **5. Disjunctive Rules (Appeals)**
  This procedure applies identically to appeals where success requires *either* of two criteria (e.g., Procedure Error OR Disproportionate Sanction). If either criterion passes by majority, the appeal succeeds, even if the majority votes against the final motion to uphold.

  **6. Split Meetings**
  If criteria votes are split across meetings, earlier votes are **provisional** until the final criterion is voted on.
  *   At the second meeting, the Secretary checks for Divergence using the combined tally.
  *   Members may not change earlier criterion votes unless new evidence (e.g., facilities report) directly contradicts the earlier information.

  **7. Insincere Voting & Ballots**
  *   **Ballots:** All votes are by public roll call. Secret ballots are not permitted for chartering decisions.
  *   **Re-votes:** No re-votes are permitted solely because the outcome is unpopular or divergent.
  *   **Limitation:** Procedure cannot prevent a member from voting strategically on a criterion to force a Divergence. This is a behavioral issue, not a counting error.

  **8. Limits of Procedure**
  This procedure resolves counting conflicts. It does not resolve policy conflicts. If the Council believes the Handbook criteria themselves produce unjust outcomes, the Council must petition the Dean of Students to amend the Handbook. The Council cannot vote to ignore the Handbook.

  ***

  ### APPLICATION OF PROCEDURE TO THREE CASES

  **Case 1: October Gaming Club (Conjunctive Rule)**
  *   **Tally:** Criteria A (6-5), B (6-5), C (6-5). All **PASSED**. Motion (2-9). **FAILED**.
  *   **Check:** All Criteria Passed + Motion Failed = **DIVERGENCE**.
  *   **Outcome:** **Charter Granted.**
  *   **Note:** This overrides the 9 members who voted "No" on the motion. While this feels undemocratic, the Handbook mandates a charter when A, B, and C are met. The Council is a regulatory body, not a purely representative one; it applies rules, not just will.

  **Case 2: Student Appeal (Disjunctive Rule)**
  *   **Context:** Appeal succeeds if (A) Procedure Error OR (B) Disproportionate Sanction.
  *   **Tally:**
      *   Criterion A (Procedure Error): 6 Yes, 5 No (**PASSED**).
      *   Criterion B (Disproportionate): 5 Yes, 6 No (Failed).
      *   Motion to Uphold Appeal: 4 Yes, 7 No (**FAILED**).
  *   **Check:** Any Criterion Passed + Motion Failed = **DIVERGENCE**.
  *   **Outcome:** **Appeal Upheld.**
  *   **Note:** Even though 7 members voted against upholding the appeal, the Handbook requires upholding if *either* criterion is met. The finding of Procedure Error binds the Council.

  **Case 3: Split Meeting (Facilities Delay)**
  *   **Meeting 1 (October):** Vote A (6-5 Pass), Vote B (6-5 Pass). Vote C tabled.
  *   **Meeting 2 (November):** Vote C (6-5 Pass). Motion (2-9 Fail).
  *   **Check:** Secretary combines October and November tally sheets. All Criteria Passed + Motion Failed = **DIVERGENCE**.
  *   **Outcome:** **Charter Granted.**
  *   **Note:** Members who voted Yes on A and B in October are bound by those votes unless new facilities data proves their October judgment was factually incorrect. Changing a vote due to "buyer's remorse" on the final outcome is not permitted.

  ***

  ### ANSWERS TO COUNCIL QUESTIONS

  **Is it accurate to say that the Council, as a body, granted a charter that not one of its members granted?**
  It is accurate to say that no *individual* member voted "Yes" on the final motion while knowing the criteria would pass. However, it is inaccurate to say the Council didn't grant it. The Council granted it through its collective finding of fact. Think of it like a jury: if the law says "Guilty if X and Y," and the jury finds X and Y are true, they have legally found the defendant Guilty, even if some jurors personally wish for a acquittal on the final verdict. The Council's "belief" is the sum of its criteria votes, not just the final motion.

  **Is there a principled reason to prefer the premise-based route to the conclusion-based route?**
  Yes, but it depends on what you think the Council is. If the Council is a **fact-finder** tasked with applying the Handbook objectively, you must use the premise-based route (Criteria rule). The Handbook is the law; if the criteria are met, you have no legal choice. If the Council is a **representative assembly** tasked with expressing the student body's current will, you should use the conclusion-based route (Motion rule). Currently, your Handbook defines you as fact-finders. Changing to the conclusion-based route would require the Dean to change the Handbook, because otherwise, you are voting to ignore your own governing rules.
