answer: |-
  Here is the analysis of the US poverty measure episode as a case study in the equality-of-what debate.

  ### 1. Parameter-by-Parameter Mapping

  Your suspicion is correct: implemented metrics are not pure instantiations of a single currency but hybrid engineering compromises. Decomposing the Official Poverty Measure (OPM) and Supplemental Poverty Measure (SPM) reveals that they mix currencies, creating internal tensions rather than clean theoretical commitments.

  **The Anchor**
  *   **OPM:** Cost of the Economy Food Plan × 3. This is **Resourcist**. It identifies a specific bundle of goods (food) required for biological survival and prices it. It assumes food is the stable core of need.
  *   **SPM:** 33rd percentile of expenditure on Food, Clothing, Shelter, Utilities (FCSU) × 1.2. This is **Capability-adjacent Resourcism**. By anchoring to what households *actually spend* rather than a nutritional minimum, it acknowledges social norms (a capability concern) but measures them through resource expenditure.
  *   **Inconsistency:** The OPM claims to be an absolute survival measure but anchors to a food plan that was never validated as a biological minimum for health, only as a budgetary category. The SPM claims to measure economic need but anchors to relative consumption; if the rich spend more on shelter, the poverty line rises, making poverty a function of inequality rather than absolute deprivation.

  **The Indexation Rule**
  *   **OPM:** CPI-U. **Resourcist**. It tracks the price of a fixed basket of goods.
  *   **SPM:** Five-year rolling average of FCSU expenditure. **Relative/Resourcist Hybrid**. It updates based on changing consumption patterns of the reference group.
  *   **Inconsistency:** The OPM uses a general inflation index for a threshold derived from food costs. If food prices rise slower than medical care (as they often do), the OPM threshold loses contact with the actual cost of survival. The SPM indexation is endogenous; if the economy grows and the 33rd percentile spends more, the line rises, conflating poverty with general prosperity.

  **Definition of Household Resources**
  *   **OPM:** Pre-tax cash income. **Crude Resourcism**. It counts money entering the hand, ignoring what the state takes back or gives in kind.
  *   **SPM:** Cash + In-kind − Taxes − Medical/Work Expenses. **Refined Resourcism with Capability Corrections**. By subtracting medical costs and adding in-kind benefits, it acknowledges that different households face different "conversion rates" from income to functioning.
  *   **Inconsistency:** The OPM is internally inconsistent because it defines poverty as a lack of resources but excludes the largest resource transfers to the poor (tax credits, food stamps). The SPM is inconsistent because it treats all medical spending as a reduction in resources, regardless of whether the spending improved health capability or merely maintained it.

  **Equivalence Scale**
  *   **OPM:** Implicit in threshold variations by family size. **Resourcist**. Assumes economies of scale are fixed.
  *   **SPM:** Modified square root scale. **Resourcist/Indifferent**. A technical adjustment for household size.
  *   **Inconsistency:** Neither scale is derived from a theory of welfare or capability; both are actuarial conventions. Neither accounts for the extra resources needed to care for a disabled member, which a true Capability approach would demand.

  **Geographic Adjustment**
  *   **OPM:** None. **Indifferent**. Assumes a dollar buys the same freedom in Mississippi as in Manhattan.
  *   **SPM:** Housing cost adjustments by metropolitan area. **Capability-Resourcist**. Acknowledges that location acts as a conversion factor; the same income yields less shelter capability in high-cost areas.
  *   **Inconsistency:** The SPM adjusts for housing costs but not for other regional price variations (e.g., food or transport), creating a partial capability adjustment that implies shelter is the only geographically sensitive functioning.

  **Verdict on Mapping:** The OPM is a "Crude Resourcist" measure that fails its own test by ignoring net resources. The SPM is a "Refined Resourcist" measure that incorporates Capability insights (conversion factors) without adopting the Capability vocabulary. Neither is Welfarist.

  ### 2. The Three Puzzles

  **Puzzle 1: Medical Subtraction (Capability or Welfare?)**
  The subtraction of out-of-pocket medical spending in the SPM is **Capability work disguised as accounting**.
  *   **Analysis:** A Welfarist account would subtract the *disutility* of illness (pain, suffering). The SPM does not do this; it cannot measure pain. A pure Resourcist account would ignore medical costs entirely, viewing income as the sole metric. The SPM subtracts the *cost* because it recognizes that income spent on health management is income *not available* for other functionings (food, shelter, social participation).
  *   **Resolution:** The arithmetic tracks **effective command over resources**. It acknowledges that a sick person requires more resources to achieve the same functioning as a healthy person. It is not Welfarist because it ignores the subjective experience of health; it is Capability-oriented because it adjusts the means-to-ends conversion rate. However, it is imperfect: it subtracts *realized* spending, not *necessary* spending. If a poor household foregoes necessary care to save money, the SPM artificially inflates their resources.

  **Puzzle 2: The Expenditure-Percentile Anchor (Relative or Absolute?)**
  The expenditure-percentile anchor is a **covertly relative standard**.
  *   **Analysis:** By tying the threshold to the 33rd percentile of FCSU spending, the line rises as general consumption rises. This answers the currency question with: "The capacity to consume at the level of the bottom third of one's contemporaries."
  *   **Defect or Correct?** It is a defect if the goal is to measure absolute biological deprivation (starvation). It is the correct view if the goal is to measure **social exclusion**. In a modern economy, poverty is not just caloric deficit; it is the inability to participate in customary social life. The SPM implicitly adopts a Capability view that functionings include social integration, which requires resources relative to the social norm, not just biological minimums.

  **Puzzle 3: Orshansky's Multiplier (Conversion Smuggled?)**
  Orshansky's multiplier of three is indeed a **conversion argument smuggled inside a resource measure**.
  *   **Analysis:** Nutritional science determined the cost of the food plan. But the *total* poverty line was derived by observing how families *behaved* (spending 1/3 of income on food). This assumes a specific behavioral relationship between income and need.
  *   **Resolution:** It assumes that families optimize their budget such that food represents a stable proportion of total need. This is a Welfarist/Resourcist hybrid: it uses observed preference satisfaction (spending patterns) to define a resource threshold. It smuggles a "conversion factor" (how income translates to total living standards) into the anchor, pretending the factor is a biological constant when it is an empirical generalization from 1955 behavior.

  ### 3. Reverse Direction: What the Episode Does to the Capability Approach

  The episode demonstrates that the Capability Approach (CA) functions better as a **critique of measurement** than as a **generator of metrics**.

  **Explanatory Work vs. Post-Hoc Fit**
  The 1995 NAS panel did not cite Sen or Nussbaum. They cited measurement error, changing consumption patterns, and the growth of the welfare state. The SPM aligns with CA, but CA did not cause the SPM. This suggests the Capability critique was doing **genuine explanatory work** in the background: the technical problems identified by economists (e.g., "medical costs reduce available income") are isomorphic with Capability problems ("health costs reduce freedom to function"). The theory validates the redesign, but the redesign was driven by technocratic accounting needs.

  **Where the Theory is Silent**
  The CA demands we measure freedom to achieve functionings, but it **does not select the ledger**.
  *   **Undetermined:** The CA cannot tell us why the anchor is the 33rd percentile rather than the 40th. It cannot derive the 1.2 multiplier for other needs. It cannot specify the equivalence scale. These are **irreducible conventions** or political choices.
  *   **Disciplined:** The CA *does* discipline the resource definition. It rules out the OPM's exclusion of in-kind benefits and medical costs because those are obvious conversion factors. It demands geographic adjustment because location affects conversion.
  *   **Verdict:** The episode shows the CA is necessary to justify *why* we adjust for medical costs or geography, but insufficient to determine *how much* to adjust. The theory prevents the grossest errors (like OPM) but leaves the precise calibration to politics.

  ### 4. Act Three: The Indexation Dispute

  **Which Currency?**
  The dispute over Chained CPI-U was ostensibly technical but fundamentally **Welfarist in logic, Resourcist in presentation**.
  *   **Analysis:** A standard CPI (fixed basket) is Resourcist: it measures the cost of buying the *same goods*. A Chained CPI allows for substitution: it measures the cost of maintaining the *same level of satisfaction* (utility) when prices change. If beef becomes expensive, the Chained CPI assumes you buy chicken and stay equally well-off.
  *   **Resolution:** Adopting Chained CPI is a **Welfarist move**. It credits the household with the ability to maintain utility through substitution. However, it was argued in **Resourcist vocabulary** ("substitution bias," "price indices").
  *   **Normative Masking:** The debate was conducted in technical vocabulary to hide the normative content. To say "the poor can substitute" is to make a claim about their freedom and resilience. To say "we must use Chained CPI" is to claim that poverty is about utility maintenance, not specific goods access. The fact that this was argued for months without surfacing the normative content shows that **technical metrics act as camouflage for currency choices**. It allows policymakers to change the currency of justice (from access to goods to maintenance of utility) without admitting they are doing so.

  *(Note on facts: The 2019 episode was technically a budgetary proposal and interagency review rather than a formal rulemaking, but the substantive dispute over indexation remains as described.)*

  ### 5. Closing Constraint: The Strain on Theory

  The single place where this episode genuinely **fails to test one of the three accounts** is **Welfarism**.

  Throughout Acts One, Two, and Three, the debate remains entirely on the **means** side of the equation. The OPM measures cash means; the SPM measures adjusted means; the Indexation dispute measures the cost of means. At no point does any proposal suggest measuring the **ends** directly. No one proposes a "Happiness Poverty Line" or a "Satisfaction Threshold." Even the Chained CPI, which theoretically tracks constant utility, does so only by inferring utility from market substitution, not by measuring well-being.

  This embarrasses the Welfarist account because it reveals that in the domain of anti-poverty policy, **Welfarism is operationally inert**. Even when the logic of indexation implies a commitment to utility (Chained CPI), the implementation remains fixated on resources and prices. The episode suggests that while philosophers may debate Welfare vs. Resources vs. Capability, the state only knows how to count Resources. The Capability Approach manages to gain traction only by piggybacking on Resource measurement (adjusting the income ledger), while Welfarism remains a theoretical ghost that influences technical indices but never dares to name itself as the currency of justice.
