answer: |-
  # Joint Statement on Agency, Routine, and Interruption

  **1. Shared Commitments**
  Both the Continuity and Discontinuity camps affirm the following claims. These commitments exclude dualism, trivial behaviorism, and appeals to non-physical causation.

  1.  **Mechanism All the Way Down:** All cognitive processes, including reflection and reason-giving, are implemented by physical mechanisms. There is no homunculus or non-physical agent directing the machinery.
  2.  **Environmental Sensitivity:** Behavior is not pre-recorded but generated by processes sensitive to environmental input. Even rigid-looking behavior involves sensory feedback loops.
  3.  **The Speech Case is Data:** The phenomenon reported by the student (interrupted during a memorized speech, forced to restart from the beginning despite knowing the content) is a genuine cognitive event requiring explanation, not merely performance anxiety or fatigue.
  4.  **Measurable Variables:** The concepts of *recovery depth* (nested interruptions absorbed), *return type* (goal-return vs. program-return), and *interruption-distance profile* (probability of goal-return vs. perturbation magnitude) are valid operational categories for comparing agents.
  5.  **Empirical Caution:** Neither camp may cite the standard *Sphex* wasp anecdote as definitive proof of rigid agency without independent replication under controlled conditions.

  **2. Disagreements Table**

  | Disagreement | Continuity Formulation | Discontinuity Formulation | Neutral Formulation | Substantive/Verbal | Damaging Word |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Nature of Flexibility** | Flexibility is the size and recombination of the routine repertoire. | Flexibility is the architectural capacity to override routines via goal-representation. | Flexibility depends on repertoire size and architectural override capacity. | Substantive | *Merely* |
  | **Meta-Cognition** | Noticing one's own routine is itself a routine executed by lower-level machinery. | Noticing one's routine requires a distinct architectural layer that treats routines as objects. | Higher-order processing involves mechanisms that monitor lower-level mechanisms. | Substantive | *Itself* |
  | **The Speech Failure** | The restart was a collision of subroutines where the "resume" routine failed to trigger. | The restart occurred because the goal-representation was severed from the means-representation. | The interruption caused a shift from program-return to goal-return. | Verbal | *Because* |

  **3. Empirical Cruxes**
  Settling these questions would move at least one camp toward the other's position.

  *   **Crux A: The Phase Shift.** Is the transition from program-return to goal-return gradual (continuous) or catastrophic (discontinuous) as interruption difficulty increases?
      *   *Test:* Measure *return type* across varying *interruption distances*.
      *   *Continuity Prediction:* If we observe a smooth sigmoid curve in the *interruption-distance profile*, we will say flexibility is a matter of degree.
      *   *Discontinuity Prediction:* If we observe a sharp step-function where goal-return jumps from 0% to 100% at a specific threshold, we will say flexibility is a matter of kind.
  *   **Crux B: The Impossible Routine.** Can a system exhibit goal-return without having a specific routine for "checking goals"?
      *   *Test:* Analyze systems that recover goals without explicit error-handling code.
      *   *Continuity Prediction:* If we observe goal-return, we will say there is a hidden routine responsible for it.
      *   *Discontinuity Prediction:* If we observe goal-return without error-handling code, we will say the architecture itself sustains the goal.

  **4. Proposed Experiment: The Spring Study**
  To address Crux A, the society will conduct the following study this spring.

  *   **Materials:** 20 student volunteers, laptops (for timing and interruption cues), index cards (20-word neutral sequences).
  *   **Procedure:** Volunteers memorize a 20-word sequence. During recitation, a laptop cue interrupts them at word 10 with a math task. Upon completion, they are cued to resume.
  *   **Variables:** The math task difficulty varies (0 to 5 standard deviations above volunteer mean) to manipulate *interruption distance*.
  *   **Operational Definitions:**
      *   *Program-Return:* Resuming recitation at word 11.
      *   *Goal-Return:* Restarting at word 1.
      *   *Recovery Depth:* The number of sequential interruptions tolerated before failure.
  *   **Data Analysis:** Plot probability of *goal-return* against math task difficulty.
  *   **Interpretation:**
      *   A linear or smooth logistic curve favors **Continuity** (profile falls gracefully).
      *   A step-function or bimodal distribution favors **Discontinuity** (profile falls catastrophically).
  *   **Concession:** Both camps concede that if the data shows a smooth curve, the Discontinuity camp must abandon the claim that human flexibility is *architecturally* distinct in kind from complex routine systems.

  **5. The Wasp Anecdote**
  Both camps agree that the standard *Sphex* story, as popularized by Hofstadter and Dennett, currently holds no evidentiary weight due to questioned empirical standing. Reports suggest the behavior is not infinite and varies by context.
  *   **Agreement:** The anecdote establishes only that *some* insects exhibit high *sphexishness* under specific perturbations. It does not establish that insects lack *recovery depth* universally, nor that humans lack *sphexishness* under sufficient load (as seen in the speech case).
  *   **Requirement:** Before either side uses *Sphex* as evidence, controlled experiments must demonstrate that the wasp fails to register routine failure even when the perturbation is within its sensory range but outside its evolutionary norm.

  **6. Trap Sentences**
  The following sentences appear to be agreements but smuggle in contested assumptions. They are banned from future debates.

  1.  *"Humans aren't robots."* (Continuity cannot sign this; they argue humans are complex robots.)
  2.  *"It's just mechanics."* (Discontinuity cannot sign this; it implies mechanics cannot constitute reasons.)
  3.  *"The wasp doesn't know what it's doing."* (Both camps agree "knowing" is ambiguous; the wasp may know via mechanism.)

  **7. Falsification Conditions**

  **Continuity Camp:**
  Our position would be falsified if a system were demonstrated to achieve *goal-return* without any implementable mechanism that could be described as a routine, subroutine, or search process. If we observe an agent successfully overriding a failed means to achieve a goal, and it is proven that no physical process corresponding to "error detection" or "goal comparison" occurred, we will concede that agency is not purely routine-based.

  **Discontinuity Camp:**
  Our position would be falsified if human *recovery depth* and *return type* were shown to correlate perfectly with repertoire size and environmental fit, with no residual variance explained by architectural differences. If we observe that the *interruption-distance profile* for humans is mathematically identical to that of a sufficiently complex neural network lacking explicit goal-representation, we will concede that the difference between us and the wasp is one of degree, not kind.
