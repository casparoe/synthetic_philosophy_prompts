      *   *Actually, looking at the "Milgram first vs. Józefów first" debate:* The user's instinct is Milgram -> Józefów -> Goldhagen. Colleague says backwards.
      *   *Analysis:* If you start with Milgram, you validate the "Situation" framework as settled science before looking at the historical evidence. This reinforces the "half-digested" psychology view. If you start with Józefów, you let the historical puzzle stand on its own. The Milgram comparison should come *after* the historical tension is established, to test the limits of the situational explanation.
      *   *Decision:* Start with Józefów. Let the historical anomaly (the opt-out) drive the inquiry. Use Milgram as a counterpoint/tool later, not the foundation. This prevents the "Situation does it, full stop" premature closure.

  3.  **Drafting the Content - Section by Section (mental outline for prose flow):**
      *   **Salutation/Opening:** Acknowledge the difficulty and the stakes (last year's failure).
      *   **The Triad Decision:** Argue for keeping the triad latent initially, then naming it to structure the conflict. Explain why early naming kills historical agency and late naming risks conflation. The sweet spot is after the Józefów evidence is on the board.
      *   **Sequence/Order:** Argue against starting with Milgram. Start with Trapp and the opt-out. Why? Because Milgram is a closed box for them. Józefów is an open historical problem. If you start with Milgram, you import the conclusion (situationism) before examining the evidence. Use Milgram later to challenge the sufficiency of the situational explanation given the opt-out data.
      *   **The Single Case:** Stick with Józefów. It contains the opt-out (crucial for agency/refusal) and the killing (the act). It must conspicuously lack the broader war context or ideological indoctrination sessions *during* the action to isolate the moment of choice.
