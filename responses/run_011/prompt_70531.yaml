          *   "I would have stepped out": This is the big one. Needs a specific intervention. Don't argue hypotheticals. Ask them to explain *why* the 490 didn't, without calling them monsters.
      *   **Preventing Last Year's Failure:** The smugness comes from moral superiority. Shift the focus from "What would I do?" to "How do we explain what they did?" Move from moral judgment to explanatory adequacy.
      *   **What to Leave Out:** Explicitly state the historiography, archival issues, and Zimbardo validity issues are out of scope for *this* session's explanatory goal.
