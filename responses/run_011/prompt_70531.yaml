      *   *Strategy:* Don't name the triad as a theoretical framework *first*. Use the evidence to force the categories into existence. Let the tension between Browning and Goldhagen *generate* the categories. This aligns with the "let it crystallize" approach but needs careful scaffolding to ensure distinction.
      *   *Wait, re-reading:* The user asks "Tell me which order you would choose and what turns on that choice." I need to make a definitive recommendation.
