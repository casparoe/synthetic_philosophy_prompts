  I'm partway through a popular book about how scientific theories get confirmed — a library copy, and I'd rather not name the author, since I want your judgment of the passage rather than of the reputation. Chapter four contains an argument I can't properly evaluate. I took one statistics course in which we fitted models to data that had been sitting in a disease registry for a decade before the model was written down, and nobody suggested we were doing anything confused, so something in this passage seems to conflict with what I was taught. But I can't tell whether the conflict is substantive or just a difference in how "evidence" and "new" are being used. Transcribed below, with sentence numbers for your convenience, the passage runs:

  (1) "Bayesianism holds that you revise your confidence in a hypothesis by conditionalizing on the evidence, which means a theory can be confirmed only by evidence it predicted before that evidence was observed." (2) "The problem of old evidence is that general relativity's celebrated success with the leftover precession of Mercury's perihelion — an anomaly on the books ever since Le Verrier flagged it in 1859 — cannot count as confirmation at all, because Einstein already knew the figure, and Bayes' theorem then assigns the evidence probability one, so the boost it can confer is exactly zero." (3) "The general lesson is severe: on a strict Bayesian account, nothing you already believe can raise the probability of anything else, which leaves the whole of scientific practice — where theories are routinely adjusted to data that were already on the table — unintelligible." (4) "The only way out is to restrict confirmation to genuinely novel predictions that later come true, such as the bending of starlight recorded during the 1919 eclipse." (5) "So Bayesianism turns out to be an elaborate restatement of the intuition that only risky predictions count, and Einstein's real achievement was to have a theory that happened to produce one."

