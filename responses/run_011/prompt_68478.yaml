answer: |-
  **MEMORANDUM**

  **TO:** Automated Decision Systems Review Board
  **FROM:** [Your Name], Board Member
  **DATE:** October 26, 2023
  **RE:** Recommendation on Housing Department Vendor Score Renewal

  **BOTTOM LINE**

  I recommend we **deny renewal** of the current vendor model.

  Effective immediately, the Housing Department should revert to a **need-indexed queue** (chronological order adjusted for urgency) for rental assistance. Simultaneously, we must issue a directive to **redefine the prediction target** ("successful completion") in collaboration with tenant advocates, and require the vendor to return in six months with a model that optimizes for that repaired label. We should explicitly reject the vendor's "lottery" proposal as a compliance mechanism.

  This path acknowledges three hard truths: the math currently demanded is impossible; the proposed fix shifts risk to individuals rather than the system; and the goal we are predicting is contaminated by the very inequality we aim to relieve.

  **THE MATHEMATICAL CONSTRAINT**

  The statistician is correct: we cannot have it all. The condition we set two years ago requires the model to be *calibrated* (a score of 70 means the same risk for everyone) while also having *equal error rates* across racial groups (equal false positives and true positives).

  When the underlying "base rates" of housing stability differ between groups—due to historical and economic factors no algorithm can fix—these two goals are mathematically incompatible. You can have calibration, or you can have equal error rates, but you cannot have both unless the model is perfect or the base rates are identical.

  This does **not** prove that fair prediction is impossible. It proves that *this specific combination* of fairness definitions is impossible. It is not a failure of arithmetic; it is a conflict of values. We previously voted for a set of values that cannot coexist in a non-ideal world. We must now choose which value to prioritize, rather than demanding the vendor perform the impossible.

  **THE VENDOR'S LOTTERY**

  The vendor proposes using a weighted coin flip for applicants in a middle "gray zone" to satisfy our criteria *in expectation* over the whole cohort. We should treat this with skepticism.

  Lotteries have a respectable history when allocating *goods* (who gets the last apartment?). They are morally hazardous when allocating *risk assessments*. Satisfying criteria "in expectation" means the audit passes, but the individual applicant who loses the coin flip is not treated fairly—they are sacrificed to make the aggregate numbers look clean.

  The vendor is being honest that there isn't enough assistance to go around and that ranking is contested. But dressing this up as a fairness solution is misleading. It converts a structural inability to satisfy our criteria into individual bad luck. It protects the Department from liability, not the applicant from error. If we must use a lottery to allocate scarcity, let us call it that, rather than hiding it inside a risk score.

  **THE LABEL PROBLEM**

  The Legal Aid member's objection is the most critical. The model predicts "successful completion," defined largely by prior rental history and on-time payments. This measures a tenant's *past advantage* as much as their *future stability*.

  If we train a model to predict who will pay rent on time, it will inevitably learn to penalize poverty. People with unstable work histories, prior evictions, or irregular income are exactly who this program is designed to help. By flagging them as "high risk," the model denies assistance to those most likely to fail without it. This is a self-fulfilling prophecy. No amount of metric-tuning or coin-flipping fixes a target that is structurally biased against the needy. We are optimizing for the wrong outcome.

  **IMPLEMENTATION PLAN**

  1.  **Immediate (November 1, 2023):** Housing Department to suspend the vendor score. Allocation reverts to the pre-existing need-indexed queue.
  2.  **Short-Term (January 15, 2024):** Department to convene a "Label Definition Working Group" including Legal Aid, tenant unions, and the vendor. Mandate: Propose alternative definitions of "success" that do not rely solely on prior financial history (e.g., program retention, connection to services).
  3.  **Medium-Term (June 1, 2024):** Vendor to submit new model proposal based on repaired label. Board to vote on *which* fairness metric (calibration OR equal error rates) will be prioritized, acknowledging the trade-off.

  **WHAT WOULD CHANGE MY MIND**

  I am committed to this recommendation, but my reasoning rests on three assumptions that could be overturned:

  1.  **Data Error on Base Rates:** If the statistician can demonstrate that the base rate disparity between groups is an artifact of data collection rather than reality, the mathematical impossibility vanishes. If the rates are actually equal, we can renew the tool under the original conditions.
  2.  **No Viable Alternative Label:** If the Working Group concludes that *no* definable label predicts stability better than payment history, we face a harder choice. If "ability to pay" is the only proxy for "housing stability," I would move to **Option B**: Renew the tool but explicitly drop the equal error rate requirement, publishing the disparity as a known cost of efficiency.
  3.  **Lottery Outcome Data:** If the vendor can prove that the "gray zone" applicants actually have *better* outcomes when selected by lottery than by score (e.g., because the score is pure noise in that band), then the lottery becomes a tool for individual benefit, not just aggregate compliance. I have not seen this evidence, but if provided, it would validate the vendor's approach.

  Until one of these holds, denying the current model is the only option that respects both the math and the people it judges.
