  6.  **Drafting - Iteration 2 (Writing the Content):**

      *   *Header:* To: ADS Review Board. From: [My Name]. Re: Housing Vendor Score Renewal.
      *   *Recommendation:* Deny renewal.
      *   *Logic:*
          1.  Math: You can't satisfy all fairness metrics when base rates differ.
          2.  Lottery: Satisfies the auditor, not the applicant.
          3.  Label: Predicting "ability to pay" in a vacuum ignores structural inability to pay.
      *   *Plan:* Interim queue. Task force on label definition.
      *   *Uncertainty:* Where could I be wrong?

  7.  **Final Polish:**

      *   Check constraints: "Two pages, bottom line up front." "No bibliography." "Committed." "Section on what would change your mind."
