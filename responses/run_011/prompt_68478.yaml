      *   **Issue:** Housing department rental-assistance program uses a vendor score to predict housing stability/rent payment (12 months out).
      *   **Constraint:** A previous board condition requires *both* calibration within groups *and* equal false-positive rates (FPR) + equal true-positive rates (TPR) across race/ethnicity groups.
      *   **Problem:** Statistician says this is mathematically impossible given different base rates (unless the model is perfect or useless).
      *   **Board Split:** Half say "tool is racist, deny." Half say "pick a metric, stop pretending math decides values."
      *   **Vendor Proposal:** Use a "lottery" (logged coin flip) for applicants in a threshold band to satisfy criteria *in expectation* over the cohort.
      *   **Legal Aid Objection:** The target label ("successful completion") is contaminated by prior disadvantage (stable rental history), so the model predicts existing inequality.
      *   **Task:** Draft a 2-page memo for the board vote.
      *   **Requirements:**
          *   Bottom line up front (choose one option).
          *   Plain language logic on the incompatibility (impossibility theorem).
          *   Interrogate the coin flip proposal (expectation vs. individual fairness).
          *   Address the legal aid label contamination point prominently.
          *   Implementation paragraph with dates.
          *   Section on "What would change my mind" (intellectual humility/vulnerability).
          *   Tone: Committed, clear, philosophical but practical, no bibliography.

  2.  **Determine the Bottom Line (The Recommendation):**

      *   *Option A: Renew under vendor's lottery.* Risky. "Satisfied in expectation" doesn't protect the individual who loses the flip. It feels like procedural cover for substantive unfairness.
      *   *Option B: Renew but pick one criterion.* Honest, but violates the existing board condition (which was likely meant to protect against disparity). Requires changing the rule first.
      *   *Option C: Deny and go back to need-indexed queue.* Safe, but might reduce overall efficiency (more failures).
      *   *Option D: Send back for retraining on a repaired label.* Addresses the root cause (Legal Aid's point). If the target is biased, the optimization is moot.
      *   *Decision:* The strongest philosophical and practical stance is **Option D (Send back for retraining/Label Repair)**, potentially with a temporary fallback to **Option C (Need-indexed)** while that happens. Why? Because optimizing a biased target (Legal Aid's point) is futile, and the mathematical impossibility (Statistician's point) shows we are asking for coherence in a incoherent system. The lottery is a distraction.
      *   *Refinement:* Let's make it a "Conditional Denial." Deny the current model. Require a redefinition of success (Label) *and* a choice on fairness metrics (acknowledging the impossibility). Interim: Use a need-based queue. This addresses all three wrinkles.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Bottom Line:** Clear recommendation. Deny renewal of current model. Interim manual queue. Require label redefinition and metric selection.
      *   **The Mathematical Constraint (The "Impossibility"):** Explain *why* the statistician is right without jargon. Base rates differ -> Error rates must differ if calibration is kept. You can't have your cake and eat it too. It doesn't mean "fairness is impossible," it means "these specific definitions of fairness are incompatible."
      *   **The Vendor's Lottery:** Interrogate the "expectation" claim. It satisfies the *audit*, not the *applicant*. It turns structural inequality into individual luck. It's honest about scarcity but dishonest about prediction.
      *   **The Label Problem (Legal Aid):** This is crucial. If "success" means "paying rent on time," and poverty makes that hard, the model penalizes poverty. It's a self-fulfilling prophecy.
      *   **Implementation:** Timeline. 30 days for interim queue. 90 days for label working group. 180 days for new model review.
      *   **What Would Change My Mind:** Show vulnerability. If the statistician proves base rates are actually equal (data error). If Legal Aid concedes the label is the *only* available proxy. If the lottery can be shown to improve individual outcomes (unlikely but possible).

  4.  **Refining the Tone:**

      *   Needs to sound like a philosopher (clear concepts, ethical weight) but also a board member (actionable, decisive).
      *   Avoid academic jargon. Use analogies if helpful.
      *   Ensure the "Bottom Line" is truly at the top.
      *   Check page count (approx. 2 pages single spaced or standard memo length).

  5.  **Drafting - Iteration 1 (Mental Check):**

