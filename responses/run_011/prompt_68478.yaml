      *   Bottom line up front? Yes.
      *   Implementation dates? Yes.
      *   "What would change your mind"? Yes.

      *(Self-Correction during drafting)*: I need to make sure I don't sound *too* academic. The board members are non-technical. Keep sentences punchy. The "Bottom Line" needs to be a specific vote recommendation.

      *Decision:* I will recommend **Denying the renewal** and reverting to a **need-indexed queue** temporarily, while mandating a **label redefinition** process. This synthesizes the Statistician's warning (don't use broken math), the Vendor's honesty (acknowledge scarcity), and Legal Aid's critique (fix the goal).

      *Wait, one nuance:* The prompt asks me to choose *one* of the options listed or similar. "Renew under lottery," "Renew pick one," "Deny/Queue," "Send back for retraining." I think "Deny/Send Back" is the strongest philosophical position. I will frame it as "Deny Current Model; Mandate Label Repair; Interim Queue."

