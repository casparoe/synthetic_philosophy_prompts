answer: |-
  This analysis proceeds under the following constraint: I will flag points of consensus versus points of genuine contestation. Be advised that in the philosophy of art, very little is "settled" in the way empirical sciences might recognize. What follows treats "consensus" as "the dominant working assumption in contemporary analytic aesthetics" and "contested" as "subject to live, substantive disagreement among specialists."

  ### 1. Reconstruction of the Argument and the Supervenience Objection

  The conflict between the Goodman-style position and the Supervenience Objection is often obscured by an equivocation on the term "perceptible." To resolve whether the positions are incompatible or merely talking past one another, we must distinguish the **supervenience base**.

  **The Supervenience Objection (Standard Form):**
  *   **Premise 1:** Aesthetic properties supervene on non-aesthetic properties.
  *   **Premise 2:** The relevant non-aesthetic base consists of **intrinsic, manifest perceptual properties** (color, shape, texture as presented to a standard observer under standard conditions).
  *   **Premise 3:** Object A (Original) and Object B (Forgery) share all intrinsic, manifest perceptual properties (by hypothesis of indiscernibility).
  *   **Conclusion:** Object A and Object B share all aesthetic properties. Provenance is aesthetically irrelevant.

  **Goodman's Counter (Reconstructed):**
  *   **Premise 1:** Aesthetic experience is cognitive; it involves classification and symbol-systems.
  *   **Premise 2:** "Perceptible" does not mean "manifest to the untrained eye now." It means "detectable in principle given the correct category and training."
  *   **Premise 3:** Original and Forgery differ in physical history (brush pressure, sequence of deposition). This difference is *in principle* detectable (even if not currently detected).
  *   **Premise 4:** Knowing that a difference exists alters the cognitive processing of the object (we look for the difference, we categorize the strokes differently).
  *   **Conclusion:** The aesthetic experience differs; therefore, the aesthetic properties differ.

  **The Point of Contact:**
  The conflict turns entirely on the specification of the supervenience base.
  *   If the base is **Intrinsic/Manifest**, the Supervenience Objection wins by stipulation. It defines aesthetic properties such that history cannot enter.
  *   If the base is **Physical/Structural (broadly construed)**, Goodman wins. He argues that because there *is* a physical difference (the history of the paint's deposition), the objects are not physically identical, even if they are visually indistinguishable *now*.

  **Consensus vs. Contest:**
  *   **Contested:** Whether aesthetic properties supervene *at all*. Some anti-realists deny the coherence of the supervenience claim in this context.
  *   **Contested:** Whether the supervenience base can include **relational or historical properties**. The "Standard Form" above (Premise 2) is a minority view among contemporary aestheticians, though it remains the default intuition for many. Most contemporary specialists accept that the supervenience base can include relational properties (e.g., "being a brushstroke" vs. "being a stain").
  *   **Settled (Operational):** Both sides generally agree that if there is a physical difference, aesthetic difference is possible. The fight is over whether *history without physical trace* (your Case 4) counts.

  **Verdict:** The objection and reply are incompatible only if one insists the supervenience base must be intrinsic. If one allows the base to include historical/genetic facts (or physical traces of them), Goodman's position is consistent with supervenience. He is not rejecting supervenience; he is rejecting a **narrow specification of the base**.

  ### 2. Goodman on Supervenience and the Forgery Argument

  Goodman does not explicitly frame his argument in terms of supervenience (a term more prevalent in later metaphysics of art), but his position implies a specific stance on the relation between the physical and the aesthetic.

  **Goodman's Position:**
  Goodman is a nominalist regarding aesthetic properties. He treats them not as mysterious qualia but as functions of how we read the object within a symbol system. For Goodman, aesthetic properties do not supervene on "looks" alone; they supervene on **categorization**. Since the category "original" vs. "forgery" is determined by history of production, and categorization determines aesthetic experience, history enters the aesthetic equation indirectly via cognition.

  **Does the Forgery Argument Require Rejecting Supervenience?**
  No. It requires rejecting **Local Supervenience on Manifest Properties**.
  *   Goodman can maintain that aesthetic properties supervene on physical properties *provided* those physical properties include the microscopic structural differences caused by the history of production.
  *   **The Load-Bearing Premise:** The argument relies on the claim that **there is always a physical difference** between an original and a forgery (Premise 3 above).
  *   **The Vulnerability:** If there is *no* physical difference (your Case 4), Goodman's specific mechanism (training oneself to see the difference) fails.

  **Consensus vs. Contest:**
  *   **Contested:** Whether Goodman is committed to the claim that there is *always* a physical difference. Some interpreters argue Goodman allows that history *itself* constitutes the difference even if physical traces are erased.
  *   **Consensus:** It is widely granted that Goodman's argument is epistemic/cognitive. He shifts the burden from "what is on the canvas" to "how we read the canvas."
  *   **Flag:** If you attribute to Goodman the view that aesthetic properties supervene on *historical facts directly* (without physical mediation), you are moving beyond Goodman into a more robust realism about historical properties (closer to Levinson or Danto). Goodman prefers to keep it tethered to the physical trace, however minute.

  ### 3. Assessment of the Three Reasons

  Here we analyze the premises required for your distinction and the viability of (3) in isolation.

  **(1) Discriminability in Principle**
  *   **Premises:** (a) There exists a physical difference. (b) Knowledge of (a) alters perceptual scrutiny.
  *   **Dependency:** This depends on (2). Why does knowing a difference exists make us look differently? Only because we value the *trace* of the artist's hand. If the trace had no evidential value, discriminability would be scientifically interesting but aesthetically inert.
  *   **Status:** This is the weakest link if the physical difference vanishes.

  **(2) Trace or Evidential Value**
  *   **Premises:** (a) Aesthetic perception is interpretive (seeing-as). (b) We see strokes as actions. (c) The value of the action is tied to its agent.
  *   **Strength:** This is the strongest link. It aligns with the "action-theoretic" approach to art (Wollheim, et al.). It explains why we care about the history: because the surface is a record of an event.
  *   **Status:** Widely accepted that perception is theory-laden. Contested whether "seeing as a trace" changes the *aesthetic property* or just our *interest* in the object.

  **(3) Achievement**
  *   **Premises:** (a) Aesthetic value includes appreciation of skill/solution. (b) Forgery involves a different (lesser/different) skill set.
  *   **The Shift:** If you strike out (1) and (2), (3) risks collapsing into **Artistic Value** rather than **Aesthetic Property**.
      *   *Aesthetic Property:* "The line is graceful." (Supervenes on experience).
      *   *Artistic Value:* "The line is skillful." (Supervenes on history of production).
  *   **Holding the Line:** To keep (3) aesthetic, you must argue that knowing the achievement alters the *phenomenology* of the line (e.g., it looks "bold" rather than "calculated"). This circles back to (2).
  *   **Verdict:** An argument built solely on (3) is an argument about **merit**, not **aesthetic properties**, unless you can demonstrate that the knowledge of achievement transforms the perceptual experience. Without that transformation, you have conceded the Supervenience Objection (the object looks the same) and are arguing for extra-aesthetic value.

  **Consensus vs. Contest:**
  *   **Consensus:** There is a distinction between aesthetic properties (how it appears/feels) and artistic value (how good/successful it is).
  *   **Contested:** Whether artistic value is a subset of aesthetic value. (Formalists say no; Contextualists say yes).

  ### 4. The "Perfect Copy" Case (Microstructural Identity)

  This case is the stress test for the Goodmanian position.

  **The Scenario:** Original and Forgery are molecule-for-molecule identical. History differs. No instrument can discriminate.
  **The Problem:** Goodman's "look harder" move is unavailable. The physical base is identical.

  **Resources Remaining:**
  1.  **Relational Aesthetic Properties:** Assert that properties like "being original," "being pioneering," or "being authentic" are themselves aesthetic properties. They supervene on history, not just structure.
  2.  **Work Identity:** Assert that they are different *works of art*. If they are different works, they can have different aesthetic properties even if their physical vehicles are identical (analogous to two performances of the same symphony, though here the "performance" is the creation).

  **Reductio or Scope Limit?**
  *   **Reductio:** If Goodman insists aesthetic difference requires physical difference, this case refutes him.
  *   **Scope Limit:** If Goodman restricts his claim to **Autographic Arts** where history is constitutive of the work's identity, the argument survives. He can say: "In painting, history is part of the work. If history differs, the work differs. If the work differs, the aesthetic properties *of the work* differ, even if the *object's* intrinsic properties do not."

  **Principled Restriction:**
  The restriction is principled if based on the **ontology of the work**.
  *   In autographic arts, the work = (Physical Structure + History of Production).
  *   In this case, Work A ≠ Work B.
  *   Therefore, Aesthetic Properties(Work A) need not equal Aesthetic Properties(Work B).
  *   **Crucial Move:** You must distinguish between properties of the *physical object* and properties of the *work of art*. The Supervenience Objection usually targets the object. The Goodmanian targets the work.

  **Consensus vs. Contest:**
  *   **Contested:** Whether two qualitatively identical objects can be distinct works of art. (Some argue for haecceity; others argue work identity is qualitative).
  *   **Contested:** Whether "being original" is an aesthetic property. Many argue it is an art-historical property that *influences* aesthetic experience but is not itself aesthetic.

  ### 5. Autographic/Allographic and Instruction-Based Art

  **The Distinction's Role:**
  The Autographic/Allographic distinction is **presupposed** by the forgery argument, not derived from it.
  *   Forgery is only a philosophical problem in autographic arts (where history matters for identity).
  *   In allographic arts (music, literature), a perfect copy *is* the work. Forgery is impossible (a counterfeit score is just a wrong score).
  *   Goodman uses the possibility of forgery to *test* whether an art form is autographic.

  **Instruction-Based Art (e.g., Sol LeWitt, Conceptual Art):**
  *   **The Challenge:** The work is defined by instructions. Executions are done by assistants. Authorized executions count as the work; unauthorized ones do not.
  *   **The Conflict:** Physically, an authorized and unauthorized execution may be identical. The difference is purely historical/relational (authorization).
  *   **Implication:** This suggests the Autographic/Allographic distinction is not about *media* (paint vs. text) but about **constitutive rules**.
  *   **Revision:** The criterion should be: Is the history of production (including authorization) constitutive of the work's identity?
      *   If yes: Autographic (History matters).
      *   If no: Allographic (Notation matters).
  *   **Work vs. Form:** This shows the distinction applies to **works** (or types of work-creation practices) rather than rigid **art forms**. Painting is usually autographic, but not necessarily (e.g., Andy Warhol's Factory).

  **Consensus vs. Contest:**
  *   **Consensus:** The original Autographic/Allographic distinction is widely regarded as insufficient for contemporary art practices.
  *   **Contested:** Whether authorization conditions should be treated as part of the "notation" (making it allographic) or part of the "history of production" (making it autographic). Most lean toward the latter, treating authorization as a historical constraint.

  ### 6. Critique of Your Apparatus

  You asked for instability in your three-way distinction and whether Case (4) smuggles assumptions.

  **Instability in the Three-Way Distinction:**
  Your distinction mixes **Epistemology** (1: Discriminability), **Phenomenology** (2: Trace/Attention), and **Axiology** (3: Achievement).
  *   **The Leak:** (1) is not a reason authenticity matters aesthetically; it is a condition for (2) to operate in a Goodmanian framework. If (1) is false (Perfect Copy), (2) must stand on its own.
  *   **The Real Joint:** The problem is not carved at the joints of *reasons* but at the joints of **Metaphysics**. The real distinction is:
      1.  **Intrinsic Aesthetic Properties:** (Color, balance, grace). Supervene on physical structure.
      2.  **Relational Aesthetic Properties:** (Being bold, being derivative, being authentic). Supervene on history/context.
  *   Your (1), (2), and (3) are all attempts to justify why Relational Properties should count. By framing them as "reasons authenticity matters," you risk conceding that aesthetic properties are intrinsic, and authenticity is just an external add-on. You should frame it as: **Authenticity determines which aesthetic properties the object possesses.**

  **Case (4) and Smuggled Assumptions:**
  *   **The Assumption:** Case (4) assumes that if physical structure is identical, the *aesthetic experience* must be identical.
  *   **The Counter:** If you accept that "being a forgery" changes the *category* under which the work is experienced, the experience changes even if the retina receives the same data. (e.g., Seeing a duck vs. seeing a rabbit in the duck-rabbit illusion; the lines don't change, the aspect changes).
  *   **The Risk:** If you treat Case (4) as a *reductio*, you are implicitly accepting the Supervenience Objection's definition of "aesthetic" (intrinsic only). If you treat it as a boundary case for **Work Identity**, it strengthens the contextualist view.
  *   **Referee Alert:** A referee will likely pounce if you claim (3) (Achievement) justifies an *aesthetic* difference without explaining the phenomenological mechanism. You must argue that the knowledge of achievement **modulates the perception**. If it only modulates the *valuation*, you have left aesthetics for art criticism.

  **Summary Recommendation for Chapter 2:**
  Do not present the three reasons as independent alternatives. Present them as a hierarchy where (2) (Trace/Attention) is the fundamental mechanism. (1) is the epistemic access to (2). (3) is the normative weight we assign to (2).
  *   **Load-Bearing Premise:** Aesthetic properties are not intrinsic qualities of surfaces but **relations between surfaces, histories, and categories of perception**.
  *   **Consensus Flag:** Be explicit that you are arguing for **Contextualism** (aesthetic properties depend on context/history) against **Formalism** (aesthetic properties depend only on intrinsic structure). This is the actual metaphysical battle underlying the forgery debate.
  *   **Contested Flag:** Acknowledge that defining "aesthetic property" to include historical relations is the controversial move. Your job is to justify that definition, not just assert it.

  If you structure the chapter around the metaphysics of the supervenience base rather than the epistemology of detection, you will avoid the trap of letting the Supervenience Objector define the terms of the debate.
