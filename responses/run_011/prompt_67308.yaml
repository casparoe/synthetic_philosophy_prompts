  3.  **Address the "Order of Pieces":**
      *   User's instinct: Contrast class first.
      *   *Verdict:* Correct. You can't define "One" without defining "Many." If you start with "A super-AI rules the world," they jump to Terminator. If you start with "What happens when everyone can build nukes but no one talks?" they understand the *problem* a singleton solves.
      *   *Sequence:* Problem (Coordination) -> Status Quo (Multipolarity) -> Solution Concept (Singleton) -> Mechanism (How?) -> Normative (Good/Bad?).

  4.  **Select the "Carrying Example" (Non-AI):**
