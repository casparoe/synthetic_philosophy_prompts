answer: |-
  **Running Example:** A municipal proposal to levy a 20% excise tax on sugar-sweetened beverages (SSB), with revenue earmarked for subsidized sports programs in low-income districts.

  **Disagreement Components:**
  1.  **Factual:** Does high sugar intake cause metabolic disease? Is the tax regressive?
  2.  **Instrumental:** Will the tax significantly reduce consumption? Will the revenue offset the economic burden on the poor?
  3.  **Evaluative:** Is public health a sufficient justification for paternalistic interference? Is equity of outcome more valuable than liberty of choice?

  **Estimated Weighting:** Factual/Instrumental (60%); Evaluative (40%).

  ***

  ### Doctrine Scores

  **1. The dissolution of metaphysics.**
  *   **Yield $y$:** 0.10
  *   **Rank:** 5
  *   **Analysis:** This doctrine absorbs rhetorical flourishes claiming the tax violates the "Spirit of Liberty" or aligns with the "Natural Order." It reclassifies these as emotive expressions. However, it leaves standing the core empirical claims about health and the substantive value conflict regarding paternalism, which are not metaphysical in the Heideggerian sense but remain politically potent.

  **2. Non-cognitivism about values.**
  *   **Yield $y$:** 0.05
  *   **Rank:** 6
  *   **Analysis:** This doctrine absorbs the *pretension* that value judgments are truth-apt, clarifying that "Health is paramount" is an imperative, not a proposition. However, by definition, it renders the 40% evaluative component of the disagreement *unsettleable* by science. It yields only a small gain in clarity by preventing category errors, while explicitly foreclosing scientific adjudication of the primary political conflict.

  **3. The principle of tolerance.**
  *   **Yield $y$:** 0.25
  *   **Rank:** 3
  *   **Analysis:** This doctrine absorbs disputes over the "correct" linguistic framework for defining 'poverty' or 'health,' converting them into pragmatic choices based on the goal of the planning office. It leaves standing the disagreement over *which* goals (health vs. liberty) should determine that fruitfulness, as tolerance permits incompatible frameworks if the ultimate values diverge.

  **4. The internal/external distinction.**
  *   **Yield $y$:** 0.50
  *   **Rank:** 2
  *   **Analysis:** This doctrine absorbs the entire factual and instrumental component (60%) by classifying them as internal questions within the economic and biological frameworks, where they have determinate answers. It leaves standing the external question of whether to adopt the framework of "public health planning" itself, which collapses into a practical proposal requiring a political decision.

  **5. Physicalism and the unity of science.**
  *   **Yield $y$:** 0.15
  *   **Rank:** 4
  *   **Analysis:** This doctrine absorbs claims about "psychological suffering" or "social coercion" by demanding they be translated into behavioral and physiological terms observable in a unified language. It leaves standing the *valuation* of those physical states; knowing that a tax causes a specific behavioral change does not dictate whether that change is desirable.

  **6. Inductive logic.**
  *   **Yield $y$:** 0.55
  *   **Rank:** 1
  *   **Analysis:** This doctrine absorbs the uncertainty within the factual and instrumental components by providing a logical calculus to assign degrees of confirmation to hypotheses (e.g., "Tax reduces intake") based on evidence. It leaves standing the decision threshold (how much confirmation is *enough* to act) and the utility function, as logic cannot compute the weight of competing non-cognitive preferences.

  ***

  ### Further Questions

  **(a) Composite Yield and Interference**
  The composite yield for the conjunction of all six doctrines is **0.55**.
  This score equals the maximum yield of the highest-performing doctrine (Inductive Logic) because the doctrines are largely complementary regarding the empirical component, but strictly constrained by Non-cognitivism and the Internal/External distinction regarding the evaluative component. There is a specific interference: **Inductive Logic (D6)** promises to discipline *choice* under uncertainty, but **Non-cognitivism (D2)** reclassifies the utility function required for that choice as a mere preference rather than a cognitive input. This reclassification quantifies a loss of 0.40 (the evaluative weight), capping the composite yield at the empirical fraction (0.60) minus residual empirical uncertainty. The toolkit settles the *means* but explicitly evacuates the *ends* of cognitive content.

  **(b) The Residual Political Question**
  The residual question is: **"Given the confirmed empirical trade-offs, which framework of goals (aggregate health vs. individual liberty) shall we practically adopt?"**
  Carnap's program is able to formulate this question only as an *external* practical proposal or decision, never as a theoretical problem with a true/false solution. It is formulable as a choice of language/framework, but not as a matter of knowledge.

  **(c) Verdict**
  On these numbers, the Carnapian toolkit **secures the opposite**. By rigorously demarcating cognitive (scientific) from non-cognitive (volitional) discourse, the toolkit proves that the core of political controversy—conflicting ultimate values—lies outside the jurisdiction of scientific administration. It clarifies politics, but it cannot substitute administration for it.
