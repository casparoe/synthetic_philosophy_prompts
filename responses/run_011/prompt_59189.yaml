      *   *Claim 2: Consolidated Entity.* Formulation: "Gains to Britain and losses to India are entries in the same ledger." Verdict: Substantive/Contested. In accounting, you consolidate subsidiaries. In ethics, you don't net victim loss against perpetrator gain.
      *   *Claim 3: Terminal Valuation.* Formulation: "The value of the Raj is the net asset value at Transfer of Power." Verdict: Substantive. Ignores path dependency.
      *   *Claim 4: Counterfactual Baseline.* Formulation: "The alternative to Empire was stagnation/zero growth." Verdict: False/Substantive. Japan/Thailand example.
      *   *Claim 5: Off-Balance Sheet.* Formulation: "Political sovereignty has no economic value." Verdict: False. Sovereignty determines economic policy.
      *   *Add Claim 6: The 'Sunk Cost' Fallacy.* Formulation: "Because the railways exist, their cost is irrelevant." Verdict: False. Opportunity cost matters.

  4.  **Analyzing the Railways (Section 2):**
