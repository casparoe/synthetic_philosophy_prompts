      *   **Part 3: The Residual Disagreement.** Where facts don't solve it. The moral accounting problem.
      *   **Part 4: The Panel Question.** A question that breaks the "Net" framing.

      *(Self-Correction during drafting)*: Be careful with the "Platitude" label. The user wants me to mark platitudes *as I go*. A claim like "Costs and benefits must be measured in some unit" is a methodological decision, not necessarily a platitude. A platitude is "The railways existed." I should interpret "Platitude" here as "Truism that doesn't advance the argument." Actually, looking at the prompt: "a verdict on whether it is a platitude that both a defender and a critic can sign without embarrassment." Okay, so if both Tharoor and Ferguson agree on it, it's a platitude in this context.
      *   *Example:* "Railways moved goods." (Platitude). "Railways increased aggregate GDP." (Contested).
      *   *Wait, re-reading:* "Verdict on whether it is a platitude... a substantive and defensible claim, a claim that is false, or not a factual claim at all."
      *   Okay, I will categorize each claim interpretation.

      *(Refining the Railway Finance)*: Ensure I mention that the capital cost was inflated. Contractors had incentives to overspend because the guarantee was on capital.
      *(Refining the 1947 Inheritance)*: India paid for the British war effort too (Sterling Balances).

      *(Final Question)*: Instead of "Was it good?", ask "Who had the right to decide?" or "What was the opportunity cost?"

      Let's write.

      *Structure:*
