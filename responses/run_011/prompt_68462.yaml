prompt: |-
  I'm a program officer at a small private foundation that funds theoretical fundamental physics — quantum gravity, early-universe cosmology, that kind of thing. Our board has an unusual mandate: we're allowed to fund work that won't be testable on any reasonable timescale, and we actually do, roughly a third of our portfolio. The problem is I have no defensible way to choose within that third. Right now it comes down to whichever applicant writes the most stirring prose about beauty and inevitability, and one of our reviewers — a working physicist, quite hostile to the whole post-empirical idea — writes back that we're funding theology. Both of those outcomes are embarrassing at board meetings.

  I want to build the case around the non-empirical confirmation stuff in the philosophy of physics — Dawid's framework, as I've read it: the reasoning from there being no viable alternative to a theory within a well-mapped local space of possibilities, the reasoning from a theory unexpectedly cohering with or explaining things it wasn't built for, and the meta-level reasoning from the track record of that kind of inference in physics generally. Turn that into a triage procedure I can actually run.

  Here's the shape of my job. Forty-odd proposals a cycle, and I get maybe twenty minutes of my own read on each before it goes out to external referees; I then write a one-paragraph rationale that a board of non-specialists can audit, and my director signs off. So the procedure has to be something I can run in that window without doing the physics myself, and every step needs to say what a *sufficient* answer looks like in writing — not "assess whether the theory space is exhausted" but the specific sentence in the proposal that would satisfy you and the specific sentence that would fail you.

  What I need:

  - Ordered questions, with a stated pass/fail for each and the points where the procedure stops at "no" versus where it hands the call to a human because the question is really about portfolio risk or who deserves a career, not about confirmation.
  - Explicit machinery for the obvious abuses: "no alternatives" that just means "only eleven people work on this, eight of them from two schools"; coherence that the same group manufactured after the fact; a framework flexible enough to absorb any observation it meets. Build the tests in as steps, not as warnings in the preamble.
  - A rule for distinguishing "not testable on our horizon" from "not testable in principle," and what to do when the proposal is silent about the difference, which most of them are.
  - A default for missing information — I'd rather have a conservative default than a hole in the procedure.
  - Honesty about which steps are judgment wearing a procedure's clothes, flagged as such, because I'd rather defend three soft steps than pretend there are none.
  - A one-paragraph template for the board rationale that a hostile reviewer can't trivially knock down.

  Then run it on three hypothetical proposals: (1) a quantum gravity program whose applicants argue the core problem has gone twenty years without a serious rival approach, and where the subfield is about fifteen researchers, mostly trained in two groups; (2) a proposed measure over a string landscape, built to fix one fine-tuning problem, whose applicants claim it also falls out of an unrelated consistency condition and lands on a numerical coincidence nobody put in; (3) a small, very elegant formalism I personally love and have staked some credibility on, whose central selling point is that it explains why the other programs fail, and which makes contact with no conceivable observation inside fifty years. On the third one, give me the answer the procedure actually produces, even if it's a flat no — and if you think the procedure is wrong rather than my instinct, argue that separately rather than bending the steps to rescue the proposal.

  Finish with what the procedure cannot do: things I'll be tempted to use it for and it will misfire on. And don't give me a bibliography or a reading list — I can't chase sources and neither can the person covering me next month.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Context:**
      *   **Role:** Program Officer at a small private foundation.
      *   **Domain:** Theoretical fundamental physics (quantum gravity, early-universe cosmology).
      *   **Mandate:** Fund work *not* testable on reasonable timescales (approx. 1/3 of portfolio).
      *   **Problem:** No defensible selection criteria for the non-empirical third. Currently relies on "stirring prose" vs. "hostile reviewer calling it theology."
      *   **Goal:** A triage procedure based on Richard Dawid's *Non-Empirical Theory Assessment* (NETA) framework (No Alternatives, Unexpected Explanatory Coherence, Meta-Inductive Inference).
      *   **Constraints:**
          *   40+ proposals/cycle.
          *   ~20 mins/proposal for initial read.
          *   Output: One-paragraph board rationale (auditable by non-specialists).
          *   Must be actionable without doing the physics.
          *   Must have explicit Pass/Fail criteria (specific sentences/evidence).
          *   Must handle abuses (small cliques, post-hoc coherence, unfalsifiability).
          *   Must distinguish "not testable soon" vs. "not testable ever."
          *   Must have conservative defaults for missing info.
          *   Must flag subjective judgment calls.
          *   Must include a board rationale template.
          *   Must test against 3 specific hypotheticals (including one the PO likes but might fail).
          *   Must list limitations (what the procedure *can't* do).
          *   NO bibliography/reading lists.

  2.  **Deconstruct Dawid's Framework for Administrative Use:**
      *   *No Alternatives Argument (NAA):* Needs to check if "no alternatives" is real or just sociological isolation.
      *   *Unexpected Explanatory Coherence (UEA):* Needs to check if the "coherence" is genuine prediction or post-hoc fitting.
      *   *Meta-Inductive Argument (MIA):* Needs to check if the research program has a history of success similar to past successful theories.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: The Testability Horizon.* Before applying Dawid, we need to ensure the project fits the mandate. Is it *in principle* testable?
          *   *Constraint:* Proposals are often silent.
          *   *Solution:* Require a specific sentence. If missing, default to "No."
      *   *Step 2: The "No Alternatives" Check (NAA).*
          *   *Abuse:* Small clique.
          *   *Fix:* Ask for a citation of the *rival* that failed, not just a claim of dominance. Require evidence of search.
      *   *Step 3: The "Unexpected Coherence" Check (UEA).*
          *   *Abuse:* Post-hoc rationalization.
          *   *Fix:* Distinguish between "built to fix X" and "also solves Y." Require timeline evidence (did Y come after X?).
      *   *Step 4: The Meta-Inductive Check (MIA).*
          *   *Abuse:* "Physics always works."
          *   *Fix:* Require specific historical analogue. Not "like Einstein," but "like renormalization group flow in condensed matter."
      *   *Step 5: The "Theology" Defense.*
          *   Address the hostile reviewer. Need a sentence that acknowledges the risk but justifies the bet.

      *   *Refining the Pass/Fail:* Needs to be binary where possible. "Does the proposal contain sentence X?"
      *   *Refining the Time Limit:* 20 minutes means I can't verify citations. I can only check if they *are there* and look plausible.
      *   *Flagging Judgment:* Where do I need to use intuition? Mostly in weighing the *quality* of the historical analogue.

  4.  **Developing the Board Rationale Template:**
      *   Needs to be robust against the "hostile reviewer."
      *   Must acknowledge the non-empirical nature without apologizing for it.
      *   Must cite the specific Dawid-style criterion met.

  5.  **Running the Hypotheticals:**

      *   *Case 1 (Quantum Gravity, 15 researchers, 2 groups):*
          *   NAA Check: Claim is "no rival." Reality is "small clique."
          *   Procedure should likely flag this as sociological isolation, not genuine exhaustion of theory space.
          *   *Verdict:* Fail NAA.
      *   *Case 2 (String Landscape Measure):*
          *   UEA Check: Built for fine-tuning, claims unexpected consistency/numerical coincidence.
          *   Procedure needs to verify if the coincidence was *predicted* or *observed then fitted*.
          *   *Verdict:* Pass UEA (if the coincidence is specific enough), but watch MIA. Let's say it passes UEA.
      *   *Case 3 (Elegant Formalism, explains failures, no observation):*
          *   User loves it. 50-year horizon.
          *   Testability Check: "No conceivable observation inside fifty years." Is it *in principle* testable? If silent, default is No.
          *   Even if testable *in principle*, does it meet NAA/UEA? "Explains why others fail" is often a negative heuristic, not positive coherence.
          *   *Verdict:* Hard No on Testability or NAA. The procedure must hold firm even against the PO's bias.

  6.  **Addressing Limitations:**
      *   What can't this do? It can't judge mathematical rigor. It can't predict sociological shifts. It can't replace peer review on technical merit.

  7.  **Review against Constraints:**
      *   *20 mins?* Yes, relies on text search and specific declarations.
      *   *Pass/Fail?* Yes.
      *   *Abuse handling?* Built into the criteria (e.g., requiring citation of failed rivals).
      *   *No Bibliography?* Checked.
      *   *Tone:* Professional, pragmatic, slightly cynical (matching the PO's frustration).

  8.  **Final Polish:**
      *   Ensure the distinction between "not testable soon" (allowed) and "not testable ever" (forbidden) is sharp.
      *   Make sure the "Judgment Flag" is clear.
      *   Ensure the Board Template is copy-paste ready but fill-in-the-blank robust.

      *(Self-Correction during drafting)*: I initially thought about asking the PO to check citations. That takes too long. The criterion must be "Does the proposal *name* the rival?" not "Is the rival paper real?" The external referees catch the fraud; the PO catches the absence of the claim.
      *(Self-Correction on Case 3)*: The prompt says "makes contact with no conceivable observation inside fifty years." This is the danger zone. If it's *in principle* testable but >50 years, it fits the mandate. If it's *in principle* untestable, it's theology. The procedure needs to force the applicant to state the *principle* testability. If they don't, default to No.

      *(Refining the "Hostile Reviewer" aspect)*: The board rationale needs to preempt the "this is theology" claim. It should explicitly state *which* non-empirical argument is being used.

      *(Final check on Dawid)*: Ensure I'm using his three arguments correctly but translated into admin-speak.
      1. No Alternatives -> Search space mapping.
      2. Unexpected Coherence -> Retrodiction/Prediction of unrelated phenomena.
      3. Meta-Inductive -> Track record of the *method*, not just the person.

      Let's assemble the document.

      *Structure:*
      1. Introduction/Philosophy.
      2. The Triage Protocol (5 Steps).
      3. The Board Rationale Template.
      4. Application to Hypotheticals.
      5. Limitations/Warnings.

      *Tone:* Direct, operational, unsentimental.

      *Wait, one constraint:* "Ordered questions, with a stated pass/fail for each and the points where the procedure stops at 'no' versus where it hands the call to a human..."
      I need to make sure the flowchart logic is clear.

      *Another constraint:* "Explicit machinery for the obvious abuses..."
      I need to make sure Step 2 (NAA) specifically filters out the "15 researchers" clique problem.

      *Another constraint:* "A rule for distinguishing 'not testable on our horizon' from 'not testable in principle'..."
      This needs to be Step 1.

      *Another constraint:* "A default for missing information..."
      Default = Rejection.

      *Another constraint:* "Honesty about which steps are judgment wearing a procedure's clothes..."
      I will add "Judgment Flags" to specific steps.

      *Another constraint:* "Run it on three hypothetical proposals..."
      I will do this explicitly.

      *Another constraint:* "Finish with what the procedure cannot do..."
      I will add the Limitations section.

      *Another constraint:* "Don't give me a bibliography..."
