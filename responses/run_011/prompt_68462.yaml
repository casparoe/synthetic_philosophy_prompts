answer: |-
  # The Non-Empirical Triage Protocol (NETP)

  **Purpose:** To filter proposals for the "Non-Empirical" portfolio third without relying on prose quality or succumbing to "theology" accusations.
  **Time Budget:** 20 minutes per proposal.
  **Default Rule:** If a required statement is missing, ambiguous, or evasive, the answer is **NO**. Do not infer generosity.

  ---

  ## Part 1: The Triage Procedure

  Execute steps 1 through 5 in order. If a step returns **FAIL**, stop and mark "Decline." If a step returns **JUDGMENT**, flag it for the Director but proceed. If all steps pass, mark "Fundable."

  ### Step 1: The Principle Testability Declaration
  **Goal:** Distinguish "not testable soon" (mandate) from "not testable ever" (theology).
  **Action:** Search the text for a explicit statement regarding *in-principle* observables.
  **Pass:** The proposal contains a sentence of the form: *"While empirical verification is not feasible within [X] years, the theory makes distinct predictions regarding [Observable Y] which are in principle measurable."*
  **Fail:** The proposal states the theory is "beyond observation," "purely mathematical," or omits the distinction entirely.
  **Default:** If silent, **FAIL**.
  **Note:** You are not verifying if [Observable Y] is real. You are verifying that the applicant admits physics requires it.

  ### Step 2: The "No Alternatives" Audit (NAA)
  **Goal:** Filter out sociological cliques masquerading as exhausted theory space.
  **Action:** Locate the claim that "no viable alternatives exist." Check for the *evidence of search*.
  **Pass:** The proposal names at least one specific rival approach that was considered and rejected, citing a technical reason for its failure (e.g., *"Approach X fails because it violates unitarity at loop level"*).
  **Fail:** The proposal claims dominance based on the number of researchers, institutional prestige, or phrases like "the community has converged."
  **Abuse Check:** If the proposal mentions only work from the applicant's own institution or advisors as the "standard," **FAIL**.
  **Judgment Flag:** If the technical reason for the rival's failure is obscure, mark "Referee Check Required" but do not stop.

  ### Step 3: The Unexpected Coherence Check (UEA)
  **Goal:** Filter out post-hoc rationalization (fitting the curve after seeing the data).
  **Action:** Identify the claim that the theory explains something it wasn't built for.
  **Pass:** The proposal provides a timeline or logical dependency showing the coherence was *derived*, not *fitted*. Look for: *"The formalism was developed to solve [Problem A]; it was subsequently found to constrain [Parameter B] without adjustment."*
  **Fail:** The proposal says the theory "accommodates" or "is consistent with" unrelated phenomena without specifying that the theory *restricted* the possibilities. "Flexibility" is a fail condition; "Constraint" is a pass condition.
  **Judgment Flag:** If the "coincidence" is numerical (e.g., a constant matches), mark "Referee Check Required."

  ### Step 4: The Meta-Inductive Anchor (MIA)
  **Goal:** Ensure the reasoning method has a track record, distinguishing physics from philosophy.
  **Action:** Find the historical analogue.
  **Pass:** The proposal names a specific historical instance where non-empirical assessment successfully preceded empirical confirmation in a *structurally similar* domain (e.g., *"Similar to the acceptance of quark models prior to deep inelastic scattering"*).
  **Fail:** The proposal appeals to "the history of physics" generally, or compares itself to Einstein/Newton without structural justification.
  **Default:** If no specific historical analogue is named, **FAIL**.

  ### Step 5: The Risk Boundary
  **Goal:** Distinguish "scientific bet" from "career support."
  **Action:** Review the "Broader Impact" or "Significance" section.
  **Pass:** The proposal argues that *even if false*, the work clarifies the landscape of possibilities (e.g., *"A no-go theorem for this class of models"*).
  **Fail:** The proposal argues primarily for the training of students or the continuation of a research line.
  **Judgment Flag:** If the value proposition rests entirely on the theory being *true*, mark "High Risk." If the Director approves High Risk, proceed.

  ---

  ## Part 2: Board Rationale Template

  *Do not deviate from this structure. It is designed to preempt the "theology" objection by explicitly citing the non-empirical criterion used.*

  > "This proposal addresses [Problem X] which lies beyond current empirical reach. Funding is recommended not on the basis of immediate testability, but on the strength of [Insert Criterion: e.g., Unexpected Explanatory Coherence]. The applicants demonstrate that their framework constrains [Parameter Y] without post-hoc adjustment, a non-empirical indicator that has historically preceded confirmation in [Historical Analogue]. While empirical verification remains distant, the work offers a definitive map of the theoretical landscape, yielding value even if the core hypothesis is ultimately falsified."

  ---

  ## Part 3: Application to Hypotheticals

  ### Case 1: The Quantum Gravity Clique
  *Profile: 20 years without rival, 15 researchers, two training groups.*
  *   **Step 1 (Testability):** Assume Pass (usually claims principle testability).
  *   **Step 2 (NAA):** **FAIL.**
      *   *Reasoning:* The proposal claims "no serious rival." However, it does not name a specific rival approach and cite a technical failure. It relies on the "20 years" duration and the small number of researchers. This triggers the Abuse Check under Step 2 (dominance based on researcher count/community convergence).
      *   *Outcome:* **Decline.** The procedure identifies this as sociological isolation, not exhausted theory space.
      *   *Note:* This protects you from the "theology" reviewer, who would correctly identify this as a monopoly, not a scientific consensus.

  ### Case 2: The String Landscape Measure
  *Profile: Fixes fine-tuning, claims unexpected consistency/numerical coincidence.*
  *   **Step 1 (Testability):** Pass (assumes principle testability).
  *   **Step 2 (NAA):** Pass/Neutral (focus is on UEA).
  *   **Step 3 (UEA):** **PASS.**
      *   *Reasoning:* The proposal states the measure was built for fine-tuning (Problem A) but *subsequently* found to constrain a numerical coincidence (Parameter B) "without adjustment." This fits the "Constraint" vs "Accommodation" rule.
      *   *Judgment Flag:* Mark "Referee Check Required" on the numerical coincidence to ensure it wasn't fitted.
  *   **Step 4 (MIA):** Pass (likely cites standard model prediction or similar).
  *   **Outcome:** **Fundable.** The procedure validates the "surprise" element as a marker of non-empirical confirmation.

  ### Case 3: The Elegant Formalism (Your Favorite)
  *Profile: Explains why others fail, no conceivable observation in 50 years.*
  *   **Step 1 (Testability):** **FAIL.**
      *   *Reasoning:* The prompt states it "makes contact with no conceivable observation inside fifty years." Unless the proposal explicitly names an observation *beyond* 50 years that is *in principle* possible, it triggers the Default Rule for missing information. "No conceivable observation" reads as "in principle untestable."
      *   *Outcome:* **Decline.**
      *   *Argument:* You asked for the answer the procedure produces, even if it contradicts your instinct. The procedure says **No**.
      *   *Why the procedure is right:* If a theory makes contact with *no* observation in 50 years, and the proposal is silent on *in-principle* testability beyond that, it violates the foundation's mandate to fund physics, not mathematics or philosophy. The "Elegance" is a subjective aesthetic (prose), not a Dawid-style non-empirical argument. It fails NAA (doesn't prove others *couldn't* work, just that they *don't*), fails UEA (explaining failure is not unexpected coherence), and fails MIA (no historical analogue for "elegance" alone). Funding this validates the hostile reviewer's "theology" claim.

  ---

  ## Part 4: Limitations & Misfire Risks

  **1. It cannot assess mathematical rigor.**
  A proposal can pass all five steps with beautiful prose and false math. This procedure filters *rationale*, not *correctness*. You still need the hostile referee for the math check.

  **2. It penalizes genuine pioneers.**
  If an applicant is truly alone because they are ahead of the curve (not because they are isolated), Step 2 (NAA) may penalize them for not citing a rival that doesn't exist yet.
  *Mitigation:* The "Judgment Flag" allows the Director to override if the "technical reason for failure" is replaced by a "proof of impossibility" for rivals.

  **3. It encourages gaming.**
  Applicants will learn to insert the magic sentences ("In principle measurable," "Historical analogue: Quarks").
  *Mitigation:* This is why Step 2 requires a *citation* of a rival and Step 4 requires a *specific* analogue. Generic buzzwords will fail the specific citation check.

  **4. It cannot solve the "Hostile Reviewer" problem entirely.**
  If the reviewer rejects the *philosophy* of non-empirical confirmation itself, no rationale will satisfy them.
  *Mitigation:* The Board Rationale Template is not for the reviewer; it is for the Board. It gives the Board the vocabulary to overrule the reviewer by citing the Foundation's specific mandate, not universal scientific consensus.

  **5. It is conservative.**
  You will lose some high-risk, high-reward "moonshots" that don't fit the Dawid framework (e.g., purely exploratory mathematics that might become physics later).
  *Mitigation:* That is the trade-off. You are buying defensibility, not maximum variance. If you want the moonshots, move them to a different portfolio bucket with different rules.
