answer: |-
  The Principal Principle is standardly presented as a bridge principle connecting the metaphysics of chance with the epistemology of credence. It is treated as a normative constraint: if you know the chance is $x$, you ought to believe the outcome will occur to degree $x$. However, the admissibility clause within the principle imposes a condition on evidence that no actual agent can satisfy. This is not a contingent limitation of human cognitive capacity but a structural feature of the relationship between empirical evidence and chancy outcomes. Recognizing this forces a reclassification of the Principal Principle. It is not a regulative norm governing the reasoning of situated agents; it is a constitutive principle defining the concept of objective chance. On this reading, chance is defined as the quantity that anchors the credence of an idealized agent possessing the chance hypothesis and no admissible evidence. The apparent pathologies of the principle arise only when this definition is mistaken for a procedure.

  ### (a) The Systematic Impossibility of Admissibility

  The admissibility condition requires that an agent's evidence $E$ screen off any information about the truth of $A$ that is not mediated by the chance of $A$. Formally, $E$ is admissible with respect to $A$ and chance hypothesis $H$ only if $Cr(A | H \& E) = Cr(A | H)$. This entails that $E$ must contain no information that shifts the probability of $A$ except by shifting the probability of $H$.

  For actual agents, this condition is systematically unsatisfiable because ordinary empirical evidence is ontologically entangled with the outcomes to which chances attach. Consider a coin toss. The chance of heads is 0.5. To satisfy admissibility, my evidence must include the proposition "the chance of heads is 0.5" but exclude any proposition that correlates with the outcome 'heads' other than through that chance value. However, any empirical evidence I possess regarding the toss—visual data of the coin spinning, knowledge of the force applied, the air resistance, the surface texture—is causally upstream of the outcome. In a world governed by physical laws, these factors determine the outcome (in a deterministic setting) or shift the propensity (in an indeterministic setting).

  Even if I do not know the outcome with certainty, my evidence alters the probability of the outcome relative to the bare chance hypothesis. If I see the coin spinning vigorously, my credence in heads might remain 0.5, but my evidence is not probabilistically independent of the outcome in the required way; it is part of the physical history that fixes the chance. If the world is deterministic, any complete physical description entails the outcome, making the chance 0 or 1, rendering the 0.5 hypothesis false. If the world is indeterministic, physical evidence usually shifts the conditional probability away from the objective chance (e.g., a biased coin look-alike).

  This failure is not due to unlucky case selection. It is a consequence of the fact that actual agents are embedded in the world. To have empirical evidence is to have causal contact with the history of the world. Since chances supervene on the history of the world (or are propensities inherent in physical setups), evidence about the history is inevitably evidence about the factors that fix the chance or the outcome. Therefore, the "total evidence" of any actual agent always contains inadmissible components. The set of agents who satisfy the admissibility condition is empty.

  ### (b) The Constitutive vs. Regulative Distinction

  If the Principal Principle were a regulative norm, it would prescribe how agents ought to update their credences. A regulative norm must be followable; "ought implies can." If the admissibility condition cannot be met, a regulative reading implies that actual agents are necessarily irrational whenever they form credences about chancy events. This is an absurd conclusion. It suggests that rationality requires a cognitive state (possessing only admissible evidence) that is metaphysically impossible for embedded beings.

  The constitutive reading avoids this by reinterpreting the logical status of the Principle. A constitutive principle does not tell an agent how to move; it defines what the pieces are. In chess, the rule "a bishop moves diagonally" does not command a player to move the bishop; it defines what it is to be a bishop. Similarly, the Principal Principle defines what it is to be a *chance*. To say "the chance of $A$ is $x$" is to say "the credence in $A$ fixed by the hypothesis that the chance is $x$, in the absence of inadmissible evidence, is $x$."

  This distinction sharply alters what counts as a counterexample. On the regulative reading, the "Undermining Future" is a devastating counterexample. This occurs when the chance hypothesis $H$ assigns a non-zero chance to a future history $F$ that, if it occurred, would make $H$ false (e.g., a frequency of heads that contradicts the chance value). If an agent knows $H$, and $H$ allows $F$, the agent must assign some credence to $F$. But if $F$ obtains, $H$ is false. This creates a contradiction in the agent's credence function if they follow the Principle strictly.

  On the constitutive reading, the Undermining Future is not a failure of rationality but a demonstration that the concept of chance is inconsistent in certain metaphysical landscapes. It shows that there is no quantity in that world that satisfies the constitutive definition. The "repair"—deferring to the chance conditional on the total chance hypothesis rather than the chance outright—is not a fix for a normative rule but a refinement of the definition to ensure the defined quantity exists. We are not correcting agent behavior; we are correcting the metaphysical specification of the quantity we are naming. The paradox dissolves because we are no longer asking how an agent should behave, but rather asking whether a quantity satisfying the definition can exist.

  ### (c) The Failure of the Expert Analogy

  A common rival account treats chance as a specific kind of epistemic expert. On this view, the Principal Principle is an instance of a general norm: one ought to align one's credence with the probability assignments of those better informed than oneself. Chance is the "ultimate expert" on the physical world.

  This analogy fails to capture the structure of the Principal Principle for two reasons. First, standard expert deference is based on the expert possessing *more* evidence than the agent. I defer to a weather forecaster because they have satellite data I lack. However, the Principal Principle requires deference to chance specifically when the agent *lacks* evidence. The admissibility clause explicitly excludes the very kind of specific outcome evidence that typically makes an expert authoritative. If I have inadmissible evidence (e.g., I saw the coin land), I should not defer to the chance; I should defer to my eyes. The "expertise" of chance lies not in information volume, but in information type.

  Second, if we press the expert analogy to accommodate this, it collapses into the constitutive reading. To make chance an "expert" that one defers to only when lacking outcome evidence, we must idealize the expert. We must define the expert as an entity that knows the chance hypothesis but is systematically ignorant of the inadmissible evidence. But an entity defined by its ignorance is not a standard epistemic agent; it is a theoretical construct. To say "defer to the expert who knows $H$ and nothing else" is identical to saying "let credence be fixed by $H$ alone." The "expert" drops out of the explanation, leaving only the relation between the hypothesis and the credence. The authority of chance is not derived from the reliability of a knower; it is derived from the definition of the concept. The expert view either misdescribes the admissibility constraint or reduces to the claim that chance is the anchor for credence in the limit of specific ignorance, which is the constitutive view.

  ### (d) Guidance, Normativity, and Explanation

  The most serious charge against the constitutive reading is that it renders the Principal Principle practically inert. If the principle defines chance for an idealized agent with impossible evidence, what guidance does it offer actual agents? A principle no one can follow cannot govern anyone.

  This objection conflates *satisfaction* with *approximation*. While actual agents cannot satisfy the admissibility condition perfectly, they can approximate it. The constitutive definition sets a limit or an attractor state for rational credence. The normative force of the principle is not "Match the chance exactly," but "Minimize the influence of inadmissible evidence." When I assess a coin toss, I normatively ought to ignore the micro-physical details I cannot measure and rely on the macroscopic chance. I treat my evidence *as if* it were admissible.

  This preserves a robust normative role. The norm is one of *bracketing*. We are required to partition our evidence into what we treat as fixing the chance and what we treat as inadmissible noise. Errors in judgment occur when we treat inadmissible evidence as admissible (e.g., the Gambiter's Fallacy, where past outcomes are treated as shifting future chances) or when we fail to recognize that our evidence has rendered the chance hypothesis irrelevant (e.g., seeing the outcome).

  Furthermore, chance retains its explanatory role. On the regulative view, chance explains frequencies because rational agents bet on them, and rational agents succeed. On the constitutive view, chance explains frequencies because it is the quantity that *would* govern belief in the absence of specific causal knowledge. It remains the bridge between the physical structure of the world and the rational expectations of agents within it. The explanation is not that agents follow a rule, but that the concept of objective probability is the concept of a physical magnitude that commands belief under conditions of informational symmetry.

  The cost of this view is the admission that "objective chance" is a more fragile concept than often assumed. It exists only insofar as the idealization of admissible evidence is coherent. In worlds where history and chance undermine each other too deeply, the concept may fail to latch onto anything. But this is a metaphysical cost, not an epistemological one. It is better to admit that the concept of chance has limits than to insist that rational agents are perpetually violating the norms of reason. The Principal Principle does not tell us how to think; it tells us what we are talking about when we speak of chance. Actual deference is the messy, approximate human practice of latching onto that definition as best we can.
