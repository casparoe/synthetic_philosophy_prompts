      *   **Task (d):** Address the "No Guidance" objection. Clarify what remains normative and if chance retains explanatory power.
      *   **Constraint:** Argue from concept structure, not history. No surveying positions. Focus on viability and costs.

  2.  **Drafting - Section by Section:**

      *   **Introduction:** State the thesis clearly. The PP is usually read as a bridge principle linking chance and credence. I argue it's a definition of chance itself. The admissibility clause is the key that locks actual agents out, revealing the principle's true nature.

      *   **Section (a): The Impossibility of Admissibility.**
          *   *Concept:* Admissibility requires evidence to be probabilistically independent of the outcome $A$, conditional on the chance of $A$.
          *   *Problem:* Ordinary evidence is about the world. The world includes the outcomes. Even if I don't know *that* $A$ happened, my evidence (e.g., physical state of the coin, prior tosses, environmental conditions) is causally or nomologically connected to $A$.
          *   *Systematic nature:* It's not just "I saw the coin land." It's "I know the laws of physics." If I know the laws and the initial conditions (even roughly), the chance is either 0 or 1 (determinism) or my evidence shifts the probability away from the objective chance (inadmissible).
          *   *Conclusion:* No actual agent has evidence consisting *only* of the chance hypothesis. All actual evidence is "tainted" by information about the history of the world, which entails information about outcomes (or their propensities) beyond the bare chance value.

      *   **Section (b): Constitutive vs. Regulative.**
          *   *Regulative:* A rule you follow (e.g., "Don't contradict yourself"). If you can't follow it, you are irrational.
          *   *Constitutive:* A rule that defines the game (e.g., "A checkmate ends the game"). It doesn't tell you how to move; it tells you what the pieces *are*.
          *   *Application:* If PP is regulative, the impossibility of admissibility makes rationality impossible. If PP is constitutive, it says: "To call a quantity 'chance' just *is* to say it is the number an ideal agent would bet given *only* that number."
          *   *Counterexamples:* Under the regulative view, the "Undermining Future" (where the chance hypothesis implies a future that makes the chance hypothesis false) is a paradox/counterexample. Under the constitutive view, it's just a proof that no such quantity exists in that specific logical space, or that the definition needs refinement (conditional chance), not that agents are failing to be rational.

      *   **Section (c): The Expert Analogy.**
          *   *Rival View:* Chance is an "expert." I defer to experts because they know more.
          *   *Critique:* Experts have *more* evidence. Chance is supposed to be authoritative even when the expert has *less* evidence (specifically, no outcome evidence).
          *   *Collapse:* If the expert is "ideal," they know the outcomes. If they know the outcomes, they don't need chance. So the "expert" must be idealized in a specific way: idealized *ignorance* of outcomes.
          *   *Result:* This specific idealization (knowing chance, knowing nothing else relevant) is exactly the constitutive definition. The "expert" view collapses into the "constitutive" view because the expertise isn't about information volume, it's about information *type*.

      *   **Section (d): Guidance and Explanation.**
          *   *Objection:* If I can't follow it, how does it guide me?
          *   *Response:* It guides via *approximation*. We strip away inadmissible evidence as best we can. We treat evidence as admissible *for all practical purposes*.
          *   *Normativity:* The norm isn't "Match chance exactly." The norm is "Minimize the influence of inadmissible evidence regarding the outcome."
          *   *Explanatory Role:* Chance explains frequencies *because* it is the anchor for rational credence in the limit. It retains its role as the bridge between physics (laws) and epistemology (belief), but the bridge is conceptual, not procedural.

