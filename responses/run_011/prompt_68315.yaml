      *   *Epiphenomenalist Counter:* The physical state $N_r$ causes the qualia Red. The physical state $N_r$ also causes the motor output (via the learning mechanism). The common cause is still $N_r$.
      *   *Harder Version:* What if the neural substrate for the report is *different* from the substrate for the experience?
      *   *The "Cross-Modal" Strategy:* Subject experiences visual qualia (color). Report is made via haptic feedback or a different cortical area that doesn't naturally process color.
