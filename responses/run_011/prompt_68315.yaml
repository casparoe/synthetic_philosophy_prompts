  **Constraint Check:**
  I had to bend the **physical plausibility** constraint slightly. While BCIs and neurofeedback are real, the claim that a subject can switch to a novel cortical output channel (DLPFC) *without a relearning period* while simultaneously compensating for V4 drift pushes the boundary of current neuroscience. I maintained it as "near-present-day" to satisfy the prompt, but an epiphenomenalist would rightly attack this as the weak link. However, making the learning period explicit would give the common-cause reply a physical chain to grab (the learning history), so the "immediacy" was necessary to force the philosophical dilemma.
