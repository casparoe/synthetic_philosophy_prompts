  A subject performs a fine-grained hue discrimination task (5nm steps around 520nm) while connected to a brain-computer interface (BCI). Initially, reports are generated via vocalization, driven by standard sensorimotor pathways. Mid-experiment, the vocal pathway is temporarily blocked by magnetic stimulation, and the BCI is switched to decode intention directly from the dorsolateral prefrontal cortex (DLPFC), bypassing the original motor plan and utilizing a neural population with no prior history of color naming. Simultaneously, adaptive neurofeedback induces a drift in the V4 neural correlate of the color experience (shifting peak firing rates for the target shade by 40%), while the subject's discrimination threshold and verbal accuracy remain locked to the *phenomenal* Just Noticeable Difference rather than the degraded or drifted physical signal. The DLPFC-driven reports remain perfectly accurate to the experienced shade immediately upon switching, without a relearning period, effectively bridging the gap between the drifted V4 signal and the untrained output channel solely by maintaining the semantic match between report and experience.

  ***

  ### Analysis

  **1. The Broken Premise of the Common-Cause Reply**
  The common-cause reply relies on the premise that the physical vehicle of the experience ($P_{exp}$) and the physical vehicle of the judgment ($P_{jud}$) are nomologically locked in a stable correlation—typically because $P_{exp}$ causally precedes or constitutes $P_{jud}$. This case breaks that premise by decoupling the two physical vehicles: the sensory encoding ($P_{exp}$ in V4) is drifted, and the motor encoding ($P_{jud}$ in DLPFC) is novel and untrained. If the correlation were purely physical, the drift in V4 should degrade the accuracy of the DLPFC output (which hasn't learned the new V4 code), or the switch to DLPFC should require a learning period to establish a new physical correlation. The fact that accuracy remains locked to the *phenomenal* limit despite physical decoupling implies the correlation is maintained by the invariant qualia, not the variable physical states. It breaks the reply rather than presenting a coincidence because the accuracy is *robust* across structural changes; a coincidence would likely fail when the specific physical chain ($V4 \rightarrow Motor$) is severed and replaced.

  **2. The Interactionist Advantage**
  An interactionist can straightforwardly claim that the phenomenal experience ($Q$) acts as a causal constraint on the judgment. When the V4 code drifts, $Q$ remains constant and causally guides the DLPFC to select the correct output to match $Q$. When the output channel switches, $Q$ causally recruits the new neural substrate to express the same content. The interactionist gets to say that the *content* of the report is fixed by the experience itself, explaining why the physical implementation can vary wildly without losing accuracy. The epiphenomenalist cannot say this; they must insist the physical state is doing all the work, which forces them into the awkward position of explaining how two uncorrelated physical states (drifted V4, novel DLPFC) magically coordinate to produce a truth-apt report about a third, causally inert thing (the qualia).

  **3. Strongest Epiphenomenalist Rebuttal**
  The epiphenomenalist will likely argue for a **Hidden Common Cause**: "There is a deeper physical state $P_{deep}$ (perhaps in the thalamus or global workspace) that remained stable despite the V4 drift and DLPFC switch, and *that* state caused both the qualia and the report." Alternatively, they might argue for **Rapid Physical Recalibration**: "The DLPFC learned the new V4 mapping instantaneously via unconscious physical mechanisms we haven't measured."
  *Evaluation:* The "Hidden Common Cause" rescues the view but at the cost of **explanatory idleness**. It posits a physical state that perfectly mirrors the stability of the qualia without any independent evidence, effectively making the physical theory chase the phenomenal facts rather than explain them. The "Rapid Recalibration" rebuttal relocates the problem to the mechanism of learning: it requires positing a physical learning rate that exceeds known biological limits to match the immediacy of the phenomenal report. Neither fully rescues the view; they merely push the miracle from the correlation to the underlying physical architecture.

  **4. The Feature Doing the Work**
  The single feature doing the work is the **invariance of the report's accuracy relative to the phenomenal limit despite variance in both input and output physical correlates**. If you delete this feature—for example, if the subject's accuracy degraded when the V4 code drifted or when the output channel switched—the case collapses into a standard common-cause scenario where the physical chain is simply fragile. The pressure on epiphenomenalism exists only because the *truth-tracking* survives the *physical-disruption*.

