          2.  Contrast with the interactionist view.
          3.  Provide the strongest epiphenomenalist rebuttal and evaluate it.
          4.  Identify the single feature doing the work and what happens if removed.
          5.  Admit if constraints are unsatisfiable.

  2.  **Deconstruct the Common-Cause Reply:**
