  **Brainstorming**
  1.  *Dieting:* Agent plans to diet, eats cake. V1: Thinks cake helps metabolism (belief error). V2: Knows cake harms, eats anyway. *Reject:* Hard to formalize "metabolism belief" as β-δ reversal without looking like belief revision.
  2.  *Smoking:* Agent plans to quit, smokes. V1: Thinks stress relief aids quitting later. V2: Knows it harms, smokes due to craving. *Reject:* Visceral state in V2 is clear, but V1 needs to show preference reversal specifically, not just error.
  3.  *Thesis Writing:* Agent plans to write, plays games. V1: Thinks incubation helps writing (prediction error). V2: Knows writing is better, plays anyway. *Select:* Cleanest separation of judgment vs. choice. Easy to match surface details (Thursday night, thesis, games). Allows precise formalization of delays (writing benefit delayed, game benefit immediate).

  ***

  **Vignette I — Reversal without Incontinence**

  Marcus schedules Thursday night to draft his thesis chapter. On Thursday morning, he confirms this plan, valuing the early finish over leisure. By evening, however, he launches a video game. When questioned, he explains sincerely that stepping away allows ideas to incubate, making Friday's writing superior to forcing it now. He declines a costless app that would block the game, predicting confidently that he will write three hours Friday morning instead. He feels no conflict; the game feels like the strategically productive choice. He avows that playing now is better than writing now. By Friday evening, exhausted, he writes nothing. The failure lies not in acting against his evening judgment, but in his morning miscalculation of how he would value rest once evening arrived, and his false belief about Friday's capacity to compensate.

  **Vignette II — Incontinence without Reversal**

  Marcus schedules Thursday night to draft his thesis chapter. On Thursday morning, he confirms this plan, valuing the early finish over leisure. By evening, he launches a video game. When questioned, he admits Friday will be busy, that Friday's writing will be rushed, and that writing now is objectively better for his degree completion. He says he should write. He could write; the document is open on his screen. Yet his hands move to the controller. He feels the visceral pull of the screen override his explicit evaluation. He does not claim the game helps his work. He does not predict he will write more Friday. He simply plays, avowing simultaneously that this harms him. The failure lies in the disconnect between his stable, unchanged evaluation of the options and the action his body performs despite knowing the costs.

  ***

  **Audit**

  **1. Davidsonian Condition Check**
  *   **Vignette I:**
      *   *Judgment favors A?* **No.** Text: "He avows that playing now is better than writing now." He judges the action (B) best.
      *   *Intentional B?* **Yes.** Text: "He launches a video game."
      *   *Free to do A?* **Yes.** Text: "Declines a costless app."
      *   *Verdict:* Not incontinent. The agent acts in accordance with contemporaneous judgment.
  *   **Vignette II:**
      *   *Judgment favors A?* **Yes.** Text: "Writing now is objectively better... He says he should write."
      *   *Intentional B?* **Yes.** Text: "His hands move to the controller... He simply plays."
      *   *Free to do A?* **Yes.** Text: "He could write; the document is open."
      *   *Verdict:* Incontinent. All three conditions met.

  **2. Formal Work**
  *   **Vignette I (Reversal):**
      *   Let Cost(Work) = -10 (immediate effort), Benefit(Work) = 30 (delayed one period). Benefit(Game) = 5 (immediate).
      *   Parameters: $\delta = 1$, $\beta = 0.5$.
      *   **t0 (Morning):** Both options are future.
          *   $U(Work) = \beta\delta(-10 + \delta(30)) = 0.5(20) = 10$.
          *   $U(Game) = \beta\delta(5) = 2.5$.
          *   Preference: Work > Game.
      *   **t1 (Evening):** Work cost is immediate; Work benefit is future. Game is immediate.
          *   $U(Work) = -10 + \beta\delta(30) = -10 + 15 = 5$.
          *   $U(Game) = 5$.
          *   (Adjust $\beta$ to 0.4 for strict reversal): $U(Work) = -10 + 12 = 2$. $U(Game) = 5$.
          *   Preference: Game > Work.
      *   **Result:** Preference reversal occurs via $\beta$. Since the agent's judgment aligns with $U_{t1}$, there is no akrasia, only dynamic inconsistency driven by naive prediction of future $\beta$.
  *   **Vignette II (No Reversal):**
      *   Options are immediate at t1. $\delta=1, \beta=1$ for immediate outcomes.
      *   **Judgment:** $U(Work) > U(Game)$. Text: "Writing now is objectively better." This establishes the utility ranking at t1.
      *   **Choice:** Game selected.
      *   **Result:** Any stationary discount function respects the utility ranking at the moment of choice when delays are identical (both zero). If $U(Work) > U(Game)$, maximization requires Work. Choosing Game violates the maximization assumption inherent in discounting models. No parameter setting $(\beta, \delta)$ can reconcile $U(Work) > U(Game)$ with Choice(Game) without assuming utility itself flipped, which contradicts the "beliefs... identical" constraint.

  **3. Feature Identification & Counterfactuals**
  *   **Vignette I:** The operative feature is **Prediction Error** regarding future capacity (Friday's writing).
      *   *Counterfactual:* If Marcus correctly predicted Friday's exhaustion, $Benefit(Work\_Fri)$ drops to 0. At t0, $U(Work)$ falls below $U(Game)$. He would not plan to work Thursday, eliminating the appearance of failure.
  *   **Vignette II:** The operative feature is **Visceral Salience** (the "pull" of the controller).
      *   *Counterfactual:* If the controller were removed (salience dialed down), the link between judgment and action would restore. He would work, as his utility ranking dictates.

  **4. Two Attacks**
  *   **Attack on Vignette II (BE Perspective):** A behavioral economist argues that choice reveals preference. If Marcus chooses Game, his utility for Game *must* be higher, perhaps due to a state-dependent utility shift (visceral state increases $U(Game)$).
      *   *Response:* This rescue empties the model. If utility can flip independently of judgment and avowal solely to match choice, "utility" loses its explanatory power and becomes a label for whatever was chosen. The explanatory work relocates to the unspecified "state" mechanism, which is precisely the Davidsonian point: something non-preference-based drives the action.
  *   **Attack on Vignette I (Davidsonian Perspective):** A philosopher argues Marcus *is* akratic because he violates a standing policy (Thursday morning plan). The contemporaneous judgment is merely a rationalization.
      *   *Response:* This objection fails Davidson's specific definition, which requires a *contemporaneous* all-things-considered judgment. Redefining akrasia to include ignorance or prediction error dilutes the concept to cover all suboptimal action. It succeeds only by abandoning the distinction between mistake and weakness.

  **5. Closing Note**
  Vignette II is stipulative insofar as it assumes access to "true utility" via avowal, contradicting the revealed preference axiom central to economics. It is a genuine counterexample only if one accepts philosophical introspection as data superior to choice. Vignette I is generated cleanly from the $\beta$-$\delta$ apparatus but relies on the agent's sincerity being trustworthy. The construction shows that while the literatures overlap, they carve the space of failure differently: one at the level of preference stability over time, the other at the level of judgment-action alignment.
