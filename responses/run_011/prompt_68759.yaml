          3.  *Arthur:* "Independent" sources might be dependent (copying/typo), yet treated as multiple attestation.
      *   **Deliverables:**
          1.  Prose reconstruction of the implicit theory of evidence (transmission, absence of records, names, independence).
          2.  Separation of what is strictly needed vs. what is convenient vs. what is contradictory.
