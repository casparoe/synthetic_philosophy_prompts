          4.  Analysis of a shift to an explicit likelihood-based account (Bayesian-ish).
          5.  A specific table with columns: `presupposition`, `forced by`, `rules out`, `status`, `if dropped`.

  2.  **Deconstruct the "Kernel/Shell" Methodology:**
      *   *What is it?* It's a form of *euhemerism* combined with *source criticism*. It assumes oral/written traditions preserve a "hard core" of factual data (names, places, major conflicts) while the "soft tissue" (motives, dialogue, divine intervention, specific numbers) decays or is embellished over time.
      *   *Why does it exist?* It allows historians to salvage *some* historical utility from mythic texts without committing to the literal truth of the narrative. It's a compromise between radical skepticism (nothing happened) and naive credulity (Homer is a journalist).

  3.  **Address the Three Complaints (The "Unevenness"):**
      *   *(1) Troy Name Matching:* Why does Wilusa = Ilion count? Because it's *external* corroboration (Hittite texts) meeting *archaeology* (Hisarlik). It's not just name matching; it's name + place + time period convergence. The "rule" isn't just names match; it's names match *and* fit the geopolitical context enough to be plausible, even if the specific war isn't mentioned.
      *   *(2) Silence (Exodus vs. Arthur):* This is the strongest point of tension. Egypt had a massive bureaucracy obsessed with recording victories/defeats. Sub-Roman Britain did not. The "rule" is about *expectation of documentation*. If a society writes everything down, silence is evidence. If a society is illiterate/post-literate, silence is null.
      *   *(3) Arthur Independence:* This is a known issue in source criticism (the *Annales Cambriae* vs. *Historia Brittonum*). The "rule" is often loose here because there's *so little* evidence. Historians grasp at straws. This is likely the "contradiction" or at least the weakest link.

  4.  **Drafting the Prose Reconstruction:**
      *   *Transmission Theory:* Needs to posit that "proper nouns" and "toponyms" are more durable than "narrative logic." (Names stick, stories drift).
      *   *Absence of Evidence:* Needs to rely on the *capacity and motive* to record. (Egypt = high capacity/motive; Britain = low capacity/motive).
      *   *Independence:* Needs to rely on *provenance*. If two texts share a source, they aren't independent. But often, if they diverge slightly, they are treated as independent traditions converging on a truth.
      *   *The Contradiction:* Complaint #3 (Arthurian independence) is the most suspect. Complaint #2 (Silence) is actually consistent if you accept the literacy premise. Complaint #1 (Troy) is consistent if you accept "convergence" over "literal match."
      *   *Underdetermination:* The "Kernel" theory is underdetermined because we don't actually know *how* oral tradition works. Does it preserve names better than events? Maybe. Maybe not.

