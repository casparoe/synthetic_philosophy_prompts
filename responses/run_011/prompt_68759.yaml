answer: |-
  ### The Epistemology of the "Kernel"

  The methodology you are observing is a specific strain of **critical euhemerism**. It operates on a tripartite theory of cultural transmission that distinguishes between *hard data* (toponyms, anthroponyms, material destruction), *soft narrative* (motives, speeches, divine intervention), and *structural memory* (the fact that a conflict occurred, without details). The practice presupposes that oral and literary traditions act as a filter: they dissolve narrative logic and chronology rapidly but retain proper nouns and geographic markers with high fidelity. This is why the "kernel" is almost always a name or a place, while the "shell" is the story built around it. It assumes memory is better at preserving *labels* than *relationships*.

  Regarding your first complaint (Troy name-matching), the practice is not actually applying a rule that "names prove history." It is applying a rule of **convergent probability**. In the Troy case, the name match (Wilusa/Ilion) is not doing the heavy lifting alone; it is being weighted by the archaeological context (Hisarlik shows destruction) and the geopolitical plausibility (Hittites and Mycenaeans *were* rivals). The epistemological move here is *abduction*: the hypothesis "Homer preserves a memory of Late Bronze Age conflicts" explains the convergence of text, archaeology, and external records better than "Homer invented everything." When name-matching is dismissed elsewhere, it is usually because there is no convergent archaeological or geopolitical context to support the abduction. The rule is not "names count," but "names count when they anchor a plausible geopolitical model."

  Your second complaint (Silence in Egypt vs. Britain) relies on a principle of **differential record expectations**. The practice presupposes that the evidential value of silence is proportional to the bureaucracy's capacity and motive to record. Egypt in the Late Bronze Age had a centralized state ideology that demanded the recording of victories and the erasure of defeats; a mass departure of slaves would violate their cosmological order and administrative habits, making silence positive evidence of absence. Sub-Roman Britain, conversely, is presupposed to be a post-literate or low-literacy society with no centralized chancery. Here, silence is null because there is no expectation of a record to begin with. The inconsistency is only apparent; the underlying rule is "Silence is evidence only where a record is expected."

  Your third complaint (Arthurian independence) identifies the genuine methodological fracture. The practice claims to value **independent attestation**, but in cases of extreme scarcity (like Dark Age Britain), it relaxes the definition of independence to **divergent tradition**. If two texts differ slightly (shoulder vs. shield), the methodology often treats this as evidence of separate oral streams rather than literary corruption. This is the weakest link. It presupposes that variation implies independence, ignoring that scribes often introduce errors or deliberate changes while copying a single source. This is where the "kernel" methodology becomes circular: it assumes a historical kernel exists, so it interprets textual variance as proof of that kernel's survival, rather than as proof of textual drift.

  **Philosophical Underdetermination:**
  The entire "kernel/shell" model is underdetermined by cognitive science. We do not actually know how oral traditions decay. Some anthropological models suggest narratives preserve *structural relationships* (kinship, causality) better than *labels* (names), which would invert the historian's verdict (the story of a siege might be real, the name "Troy" might be a later label). The field waves this away because adopting a specific theory of memory would force them to abandon the "kernel" safety net. If names decay as fast as motives, the Troy and Arthur verdicts collapse.

  **The Likelihood Shift:**
  If the guild moved to an explicit likelihood account (Bayesian historiography), they would have to state priors (e.g., "What is the base rate of 5th-century warlords becoming mythic kings?").
  *   **Troy:** The verdict would likely stay similar but lose its certainty. The prior for "trade wars in the Bronze Age" is high; the likelihood of Hittite mention given a war is moderate. The result remains "Probable conflict, improbable Homeric narrative."
  *   **Exodus:** The verdict would harden against the biblical account. The prior for "mass migration leaving no trace" is low; the likelihood of Egyptian silence given a mass departure is near zero. The "kernel" (a small group of Levites) would have to be argued on different grounds, not as a residue of the Exodus story.
  *   **Arthur:** This verdict would move the most. The prior for "specific battle details surviving 400 years of oral transmission" is extremely low. The likelihood of the *Annales* and *Historia* being independent is also low. An explicit account would likely force historians to say "We cannot assign a probability >50% to a historical Arthur," effectively retiring the "war-leader" verdict as unsupported.
  *   **What becomes impossible:** The phrase "There is likely a kernel of truth." This is a qualitative hedge that hides the probability assessment. In a likelihood framework, you must either define the kernel (and assign it a probability) or admit the signal-to-noise ratio is too low to measure. The romantic notion that history hides *just beneath* the myth, waiting for the right interpretation, becomes unsayable.

  ### Table of Presuppositions

  | presupposition | forced by | rules out | status | if dropped |
  | :--- | :--- | :--- | :--- | :--- |
  | Proper nouns (names/places) survive oral transmission longer than narrative logic or motives. | The "Kernel" verdict itself (Troy/Arthur). | Cognitive models where plot structure is more durable than labels. | Strictly required | The "kernel" vanishes; we cannot assume names in Homer or Arthurian texts refer to historical entities. |
  | Silence is only evidence of absence if the society had a bureaucratic capacity and motive to record the event. | The Exodus (silence counts) vs. Arthur (silence doesn't count) discrepancy. | A universal rule that "absence of evidence is not evidence of absence" regardless of context. | Strictly required | The Exodus verdict weakens (silence becomes null) or the Arthur verdict strengthens (silence becomes evidence of absence). |
  | External textual corroboration validates internal tradition even if the external text describes a different type of event. | The Troy verdict (Hittite vassalage validates Homeric war). | A strict correspondence theory where external texts must match the internal narrative details to count. | Merely convenient | Troy reverts to "purely legendary"; the Hisarlik mound becomes unrelated to the Iliad. |
  | Textual variation between late sources indicates independent oral traditions rather than scribal error or literary dependence. | The Arthur verdict (treating *Annales* and *Historia* as multiple attestation). | Textual criticism principles that prioritize stemmatics (family trees of manuscripts) over oral tradition hypotheses. | **Possibly contradictory** | The Arthur "kernel" collapses; the sources are treated as a single, late, unreliable tradition. |
  | Archaeological destruction layers can be linked to specific textual traditions without direct epigraphic proof of the link. | The Troy verdict (Hisarlik destruction = Trojan War). | A strict empiricist view that archaeology and text remain separate evidentiary silos unless explicitly linked by contemporary inscription. | Merely convenient | Troy becomes "a destroyed city named Wilusa" with no necessary connection to Achaeans or Homer. |
