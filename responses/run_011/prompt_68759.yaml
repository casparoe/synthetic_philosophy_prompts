  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check Complaint 1:* Is it really inconsistent? Historians argue Wilusa/Ilion is supported by *archaeology* + *text*. Name matching alone (e.g., identifying a random biblical city) is often treated skeptically. So the "rule" is actually "Name + Context + Archaeology." I need to make sure I clarify that the user's perception of "name matching" is slightly reductive, but the *epistemological move* is still distinct.
      *   *Check Complaint 2:* This is the most defensible distinction. High-literacy vs. Low-literacy societies. I need to emphasize the "Expectation of Record" principle.
      *   *Check Complaint 3:* This is the genuine methodological sin. *Historia Brittonum* and *Annales Cambriae* are notoriously tangled. Treating them as independent is often wishful thinking. I will flag this as the "possibly contradictory" one.
      *   *Underdetermination:* The "Kernel" theory assumes memory works a specific way. Cognitive science might disagree. That's the underdetermined part.

  8.  **Final Polish:**
