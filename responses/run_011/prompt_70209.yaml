answer: |-
  ### Part 1: Refining the Reconstruction of Lewis's Argument

  Your reconstruction is broadly correct, but to make the inference to "no truth conditions" read as a clean logical step rather than a philosophical leap, you must explicitly frame Lewis's result as a **trilemma**.

  Lewis does not prove that conditionals lack truth conditions *simpliciter*. He proves that the following three claims are inconsistent:
  1.  **Propositionality:** Indicative conditionals express propositions (i.e., they have truth conditions and belong to the domain of the probability function).
  2.  **Adams's Thesis:** The probability of a conditional equals the conditional probability of its consequent given its antecedent ($P(A \to B) = P(B|A)$).
  3.  **Non-Triviality:** There are non-trivial probability functions (i.e., agents can have varying degrees of belief in independent propositions).

  Your handout should present the proof as a *reductio* of **Propositionality**, holding **Adams's Thesis** and **Non-Triviality** fixed.

  **How to set out the proof:**
  1.  **Assume Propositionality:** Let $A \to B$ denote a proposition $X$ in the algebra of the probability function $P$.
  2.  **Assume Adams's Thesis:** $P(X) = P(B|A)$ for all $A, B$ where $P(A) > 0$.
  3.  **Derive the Contradiction:** Follow Lewis's 1976 derivation (using the law of total probability on the partition $\{A, \neg A\}$). Show that this forces $P(B|A) = P(B)$ for all $A, B$, which implies that all propositions are probabilistically independent (triviality).
  4.  **The Inference:** Since Non-Triviality is a requirement for any useful theory of belief, and Adams's Thesis is supported by robust intuitive data (the "Ramsey Test"), the assumption that must be discarded is **Propositionality**.

  **Correction to your reading:** You wrote that Lewis proves "no non-degenerate probability function can satisfy that equation." Strictly speaking, he proves that no non-degenerate probability function can satisfy that equation *for all conditionals in its domain*. The step to "absence of truth conditions" is valid only if you explicitly premise that Adams's Thesis is non-negotiable data. If your students think Adams's Thesis is optional, the result only shows we must reject Adams's Thesis, not truth conditions. To get the conclusion you want, you must argue in the handout that Adams's Thesis is the stronger intuition.

  ### Part 2: Recommendation for the Embedding Problem

  You should defend **Dorothy Edgington's Suppositional Theory** (specifically as articulated in "On Conditionals," 1995, and subsequent work).

  **The Position:**
  Do not attempt to provide truth conditions for embedded conditionals. Instead, argue that surface grammar misleads us about logical form. On Edgington's view, conditionals do not state propositions that can be true or false; they are devices for making **suppositional judgments**. Therefore, embeddings like negation, disjunction, or antecedents of other conditionals should not be analyzed as truth-functional compounds of propositional contents.

  **Grounds for this Recommendation:**
  1.  **Theoretical Fidelity:** This is the only approach that remains fully consistent with the moral of Lewis's result. If you adopt a truth-conditional semantics to solve the embedding problem (e.g., Stalnaker or Kratzer), you must reject Adams's Thesis to avoid triviality. This undermines the very motivation for the seminar (Lewis's vindication of Adams). Edgington's approach preserves the core insight: that the logic of conditionals is a logic of **uncertain inference**, not a logic of truth.
  2.  **Validity as Preservation of Assertibility:** Edgington redefines logical validity for conditionals. An argument is valid if high probability of premises guarantees high probability of the conclusion (preservation of assertibility), not if truth of premises guarantees truth of the conclusion. This allows you to handle embeddings by showing that apparent counterexamples (like "If A then B" embedded in a disjunction) often fail to preserve high conditional probability in the ways truth-conditional logic expects.
  3.  **Dissolution over Solution:** The embedding problem is often presented as a "bug" for non-cognitivism. You should frame it as a feature. Natural language grammar allows us to embed all sorts of speech acts (commands, questions) that lack truth conditions. Conditionals are similar. By defending Edgington, you teach students to distinguish **grammatical form** from **logical form**. When we say "It is not the case that if A then B," we are not negating a proposition; we are expressing a high degree of belief in $A$ combined with a low degree of belief in $B$ given $A$.

  **Implementation in the Handout:**
  In the final third, do not try to construct a semantics for $\neg(A \to B)$. Instead, present Edgington's analysis: $\neg(A \to B)$ is not a conditional at all, but a categorical belief in $A$ and $\neg B$. For disjunctions ($(A \to B) \lor (C \to D)$), argue that these are rarely asserted in practice and, when they are, they are evaluated by the probability calculus on the suppositions, not by truth tables. This approach is philosophically honest, mathematically rigorous (via Adams's probability logic), and respects the triviality result rather than trying to circumvent it.
