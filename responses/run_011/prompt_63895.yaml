  # JOINT STATEMENT ON THE ONTOLOGY OF DREAMING
  **Prepared for the Panel on Sleep and Consciousness**
  **Co-hosted by the Philosophy of Mind Reading Group and the University Sleep Laboratory**

  **Signatories:** Dr. A. J. Malcolmson (Representing the Conceptualist Position) & Dr. D. C. Dennettfield (Representing the Empiricist Position)

  ### 1. Agreed Claims and Methodological Commitments

  In the spirit of adversarial collaboration, we submit the following numbered claims as the common ground upon which our debate proceeds. We agree that the dispute is not regarding the raw data, but regarding the logical status and interpretation of said data.

  1.  **The Status of Dream Reports:** We agree that first-person dream reports, collected immediately upon awakening, are the primary data set for any theory of dreaming. We disagree on whether these reports describe a prior temporal process or constitute the very definition of the event.
  2.  **REM Duration and Narration Length:** We acknowledge the classic Dement and Kleitman (1957) data demonstrating a strong correlation between the duration of REM sleep periods and the length of the dream narration provided upon awakening.
      *   *Joint Interpretation:* We agree this correlation establishes that *something* is scaling with time during REM sleep.
      *   *Divergence:* We disagree on whether this 'something' is a stream of phenomenological experience (Dennettfield) or the gradual accumulation of dispositional traces that facilitate a waking fabrication (Malcolmson).
  3.  **Lucid Dreamer Eye Signals:** We acknowledge Stephen LaBerge's experiments wherein subjects in verified REM sleep emit pre-agreed ocular signals (e.g., left-right-left-right) to mark the onset of lucidity.
      *   *The Concession:* Dr. Malcolmson concedes that these signals are difficult to explain away as post-hoc confabulations, given the precise temporal locking with physiological markers.
      *   *The Limit of Concession:* Dr. Malcolmson insists this concession does not validate the claim that "experience" occurred *while asleep*. He maintains that the emission of a voluntary signal indicates a functional state that ought not to be classified as "genuine sleep" in the strict conceptual sense, regardless of the EEG signature. Dr. Dennettfield contends that this functional state *just is* a form of conscious experience compatible with the physiological label of sleep.
  4.  **Falsifiability:** We agree that a theory which renders all possible empirical evidence irrelevant is scientifically sterile. However, we disagree on whether the Conceptualist position renders evidence irrelevant, or merely clarifies the category errors involved in gathering it.

  ### 2. Residual Disagreements

  The following table outlines the core divergences. Each description has been vetted by the opposing side as an acceptable characterisation of their view.

  | Feature of Disagreement | The Malcolmson (Conceptualist) Position | The Dennettfield (Empiricist) Position |
  | :--- | :--- | :--- |
  | **Primary Category** | The claim "I am having an experience while asleep" is a category mistake, akin to saying "I am scoring a goal while not playing football." | The claim is a substantive hypothesis about cognitive architecture and information processing during specific physiological states. |
  | **Definition of 'Sleep'** | 'Sleep' is defined partly by the absence of conscious experience. If experience is present, the subject is, to that degree, awake. | 'Sleep' is a physiological cluster (EEG, muscle atonia, etc.) that can co-occur with varying degrees of conscious processing. |
  | **The 'Cassette' Mechanism** | The idea that content is assembled retrospectively is a plausible description of how waking narration is generated, not a description of a hidden unconscious process. | The idea that content is assembled retrospectively (or in fragments) is a testable model of memory consolidation and narrative construction. |
  | **Role of Introspection** | Introspection on waking creates the logical space for the dream; it does not discover a pre-existing object. | Introspection on waking accesses (however fallibly) a memory trace generated by neural activity during the sleep period. |

  ### 3. Cruxes and Advance Predictions

  We have identified two specific cruxes where future research could shift the weight of probability. We record our predictions below.

  **Crux A: The Timing of Content-Specific Neural Activation**
  *   *Question:* Can fMRI or high-density EEG decode specific dream content (e.g., 'face' vs. 'house') *during* REM, prior to awakening?
  *   **Malcolmson Prediction:** Even if decoding is successful, it will correlate with micro-arousals or hybrid states. If perfect decoding occurs during deep REM, it will force a revision of the concept 'sleep', not prove 'experience' occurs in sleep.
  *   **Dennettfield Prediction:** Content-specific activation will be detected during stable REM without micro-arousals, confirming that the brain is processing semantic content in real-time, regardless of whether a unified 'narrative' is formed until waking.

  **Crux B: The Lucid Signal Latency**
  *   *Question:* In lucid dreaming, is there a measurable delay between the instruction to signal and the ocular movement compared to wakefulness?
  *   **Malcolmson Prediction:** The latency will match wakefulness, proving the subject is effectively awake (conceptually), rendering the 'sleep' label a mere physiological convenience.
  *   **Dennettfield Prediction:** The latency will be measurably distinct from full wakefulness (e.g., slightly degraded), proving a distinct state of consciousness exists that is neither fully asleep nor fully awake.

  ***

  ### 4. Facilitator's Commentary and Assessment

  *Note: The following assessment is provided by the panel chair to fulfil the requirement of the adversarial collaboration grant. It does not represent the consensus of the signatories.*

  **Where the Sides Talk Past Each Other**
  The collaboration reveals a significant degree of verbal dispute centred on the word 'sleep'. The Malcolmian treats 'sleep' as a folk-psychological concept that entails unconsciousness by definition. The Dennettian treats 'sleep' as a biological natural kind defined by physiology. When the Malcolmian says, "They weren't truly asleep," and the Dennettian says, "They were asleep but conscious," they are often agreeing on the physical facts (EEG shows theta waves, eyes move) but disagreeing on the linguistic licence to apply the word 'sleep' to that physical state. This is a classic case of conceptual engineering clashing with naturalistic description.

  **The Decisive Crux**
  The decisive crux is **Crux A (Neural Activation)**. The Malcolmian position relies on the immunity of the conceptual claim from empirical refutation. However, if specific semantic content can be decoded from the brain during stable REM without micro-arousals, the "disposition to narrate" theory becomes untenable. A disposition requires a trigger (waking); real-time semantic encoding suggests a process. If the brain is encoding 'face' vs 'house' distinctions *during* the sleep window, the "Cassette Theory" (or a variant thereof) is empirically supported over the "Disposition Theory". The Malcolmian can only survive this by retreating into an unfalsifiable solipsism where *no* neural data counts as evidence of experience, which renders the philosophy scientifically inert.

  **The Verdict**
  I would bet on the **Dennettfield (Empiricist) side**.

  **Reasoning:**
  The Malcolmian stance, while logically tidy, is historically brittle. It attempts to legislate the boundaries of consciousness via linguistic analysis alone. History shows that as our instrumentation improves, our concepts of 'wakefulness' and 'sleep' expand to accommodate the data, not the other way around. We now accept anaesthetised patients can have awareness, and that sleepers can process language. To insist that 'experience' is logically impossible during sleep is to place a priori constraints on nature that are unlikely to hold.

  Furthermore, the Dennettian view is more fertile. It invites experiments (like the eye signals and neural decoding). The Malcolmian view invites only silence. In a collaboration with a Sleep *Lab*, the hypothesis that generates testable predictions must be favoured over the one that treats the predictions as category errors. The Malcolmian concession on the eye signals is the crack in the dam; once you admit a voluntary, cognitive act can occur during REM, the strict conceptual barrier between 'asleep' and 'experiencing' has already collapsed.
