      *   *Resolution of (2):* You use a *different function* of the mind. Not "Is $p$ true?" but "Was the process for $p$ stable?" This is a different calculation.
      *   *Resolution of (3):* You move from "I believe $p$" to "I have a $p$-inclination generated by a noisy source." This is a single coherent state.

  7.  **Drafting the Response (Iterative refinement):**
