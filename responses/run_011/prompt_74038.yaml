      *   *The Shift:* When you detect bad conditions (mania, sleep deprivation), you aren't using the *same* mode of reasoning to judge the reasoning. You are using *meta-cognition* (checking the logs) rather than *cognition* (doing the math).
      *   *Coherence:* The suspicion is coherent. It's not that you lack an independent instrument; it's that you are shifting from *generating* output to *evaluating* the generator's status.
