          3.  *No Moorean Paradox:* One cannot rationally hold "I believe $p$" and "My belief in $p$ is irrational/unjustified" simultaneously. The higher-order evidence *must* move the first-order belief.
      *   **The Feeling:** A "locked room." Each premise seems obvious, but together they create a paradox.
