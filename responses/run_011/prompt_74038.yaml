      *   *Resolution:* The higher-order evidence doesn't just sit there; it *dampens* the first-order belief. It turns a "Yes" into a "Maybe." This satisfies (3) because you no longer *fully* believe $p$ in the action-guiding sense. You believe "$p$ is likely, but I'm not sure."
