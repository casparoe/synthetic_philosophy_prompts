  # Model Answer: Rousseau and the Darkened Stage

  ### 1. Disciplined Mapping of the Three Cases

  To apply Rousseau's framework, we must first identify the structural components of the 2020 episodes. In the first case, the National Theatre streaming, the **audience** consists of isolated individuals with internet access, physically separated. The **performers** are the recorded actors from past productions, temporally disconnected from the viewers. The **playhouse** is the digital platform itself, a private screen substituting for the public hall. There is no **festival** here; the event is a distribution of commodity art, even if free of charge.

  In the second case, the release of *Hamilton* on a subscription service, the **audience** is global subscribers, again atomized. The **performers** are the original cast, captured professionally. The **playhouse** is the streaming interface, which functions as a private box for every viewer. Like the National Theatre streams, this lacks a **festival** element; it is a commercial product released early, prioritizing access over gathering.

  In the third case, the balcony applause and singing, the **audience** and **performers** are interchangeable; neighbors watch neighbors, and households perform for the street. The **playhouse** is the urban architecture itself—windows, balconies, and streets. The **festival** is the scheduled collective gesture. Unlike the theater cases, this ritual relies on simultaneity and public visibility, fitting the structural role of the festival Rousseau describes, though its object was specific workers rather than the people contemplating themselves.

  ### 2. Applying Rousseau's Core Arguments

  Rousseau's central contention is that drama cannot reform morals but merely intensifies existing passions. Applied to 2020, this argument retains significant grip. The streaming of past productions did not generate new civic virtue during the crisis; it offered comfort or distraction, mirroring the audience's existing desire for safety and nostalgia. The *Hamilton* release, similarly, did not alter political realities regarding inequality, despite the show's thematic content. Rousseau's claim that theater reflects rather than corrects the people holds true when the "theater" is digitized; the medium did not transform the message into action.

  Regarding the assembly of strangers, Rousseau argues the playhouse gathers atomized individuals into a purchased simulacrum of community at the cost of time a republic cannot spare. The streaming cases validate the atomization charge. Viewers watched alone or in domestic bubbles, not as a citizenry. However, the cost of time argument is complicated by the asynchronous nature of streaming; viewers could watch at leisure, unlike the fixed hours of the playhouse. Rousseau's critique of the actor's trade as a public alienation of the self for money also applies to *Hamilton*. The performers sold their likenesses to a corporation for subscription revenue, alienating their labor from the live communal exchange. Even the National Theatre's free streams relied on institutional funding structures that commodify art.

  The balcony ritual initially seems to escape these critiques, as the people became their own spectacle. However, Rousseau's warning that such gestures can become empty substitutes resonates strongly with the subsequent attack on the applause. When the ritual was criticized as a replacement for protective equipment and pay, it confirmed Rousseau's fear that symbolic participation can mask material neglect. The gesture became a simulacrum of support, allowing the state and public to feel they had honored workers without costing them resources. Thus, Rousseau's arguments regarding morality, alienation, and the danger of symbolic substitutes grip the material tightly, though the specific economic mechanics of streaming differ from his eighteenth-century context.

  ### 3. Spectatorial Density and Reciprocity

  We must now locate these cases on the grid of *spectatorial density* (physical proximity of watchers) against *spectatorial reciprocity* (watchers visible to one another). The traditional playhouse, though closed in this period, serves as the baseline: high density, low reciprocity. The audience is packed together but hidden in darkness, facing only the stage.

  The streaming cases (National Theatre and *Hamilton*) occupy the quadrant of low density and low reciprocity. Viewers are physically isolated in private homes and invisible to one another. There is no shared breath or mutual observation among the audience, only a shared focus on a screen. The balcony applause, conversely, offers low density but high reciprocity. Households are separated by architecture, yet they are visible and audible to neighbors and passersby. The watchers are themselves the spectacle.

  Does this distinction earn its keep? It clarifies why the balcony ritual felt politically distinct from streaming. The high reciprocity created a sense of mutual obligation and visibility that streaming cannot replicate. However, the distinction collapses under pressure when considering the scale of the streaming audience. While reciprocity was low locally, the knowledge of millions watching simultaneously created a virtual density. Yet, without visibility, this remains abstract. Adopting this distinction changes Rousseau's verdicts slightly. Rousseau privileges the festival for its reciprocity—the people seeing themselves. The balcony applause fits this better than the playhouse did. However, because the density was low (socially distanced), the energy was diffuse. Rousseau might argue that without physical compression, the collective passion cannot reach the necessary intensity to bind the polity, suggesting that high reciprocity without high density is insufficient for true political unity.

  ### 4. Silences in the Framework and Authorial Contradiction

  We must be candid where the framework is silent. Rousseau has no concept of asynchronous reproduction. He assumes performance and reception share the same time. The ability to pause, rewind, or watch *Hamilton* weeks after release breaks the collective temporal bond he deems essential for civic influence. Furthermore, Rousseau assumes the eye is free. He has no concept of the camera as director. In the streaming cases, the viewer sees only what the camera selects, editing out the periphery and controlling the gaze more strictly than any theater architect could. This intensifies the passivity Rousseau fears, as the viewer cannot even choose where to look within the frame.

  Additionally, Rousseau assumes an audience that is a city. The streaming audience was global, lacking the shared laws or borders necessary for a republican festival. A festival organized by broadcasters and attended by officeholders—as seen when politicians joined the balcony applause—was beyond his imagination. He envisioned spontaneous organic gatherings, not mediated events amplified by capital and state officials.

  Finally, there is Rousseau's own awkwardness. He wrote plays and an opera, *Le Devin du Village*, despite his theoretical condemnation of the theater. This suggests a recognition that representation has an irresistible allure, or perhaps that his theory was prescriptive for Geneva specifically, not descriptive of all art. This contradiction weakens the absolute force of his verdict; if the author of the *Letter* could not abstain from dramatic composition, the demand for total abstention from mediated spectacle may be untenable for complex societies.

  ### 5. Verdicts on Festival and Streaming

  Does the balcony applause vindicate the festival ideal? In structure, yes; in substance, no. It fulfilled the requirement of the people becoming their own spectacle, achieving high reciprocity. However, because it was attacked as a cheap substitute for material support, it demonstrates that a festival is merely theater without a roof if it lacks political efficacy. It became a performance of solidarity that obscured the need for structural change, validating Rousseau's fear that spectacles can pacify rather than activate. It was a festival of sentiment, not of action.

  Does *Hamilton* on streaming refute the access-and-scale argument or confirm the passivity charge? It refutes the idea that art must be physically exclusive to be valuable; more people saw it in a month than could have filled the house in a decade, democratizing cultural capital. However, it confirms the passivity charge. The scale was achieved by multiplying isolation. The viewer gained access but lost agency, becoming a consumer of a fixed image rather than a participant in a live event. The verdict is mixed: streaming solves the problem of exclusion but exacerbates the problem of alienation. Rousseau would likely argue that the trade-off is not worth it; a republic is better served by fewer citizens watching each other in the square than millions watching a screen in the dark. The 2020 episode suggests that while technology can distribute the image of community, it cannot manufacture the substance of it.
