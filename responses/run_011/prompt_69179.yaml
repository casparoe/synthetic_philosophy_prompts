  The following logical combinations generated by the node structure do not correspond to occupied leaves in standard social ontology:

  1.  **Full Common Knowledge with No Arbitrary Alternative (Node 3 No → Node 12 Yes):**
      *   *Status:* **Incoherent.** If there is no arbitrary alternative, the regularity is likely a technical constraint or a law of nature, not a social convention requiring common knowledge.
  2.  **Sanctions with No Expectation of Conformity (Node 10 Yes → Leaf 7):**
      *   *Status:* **Unattractive.** This describes pure coercion (e.g., a prison guard forcing a action). While possible, it is rarely classified as a *social norm* or *convention* because the regularity collapses the moment the coercive power leaves, lacking the self-sustaining property of norms.
  3.  **Constitutive Rule Nobody in the Group Can Articulate (Node 4 No → Node 8 Yes):**
      *   *Status:* **Unexplored.** It is theoretically possible to have a tacit constitutive rule (e.g., a tribe treating an object as sacred without being able to explain why), but most literature assumes constitutive rules require some level of institutional articulation to function as rules.
  4.  **Blind Custom (Node 9 No → Leaf 6):**
      *   *Status:* **Unoccupied.** This would imply a regularity where no one expects anyone else to conform, yet they all do. This is behaviorally indistinguishable from a mass coincidence or habit, making it an unstable category.

  ### Part 4: Departure Predictions and Indistinguishability

  **Predictions Upon Departure:**

  *   **Plain Habit:** **Indifference.** No reaction; the deviation is noted as idiosyncratic but irrelevant.
  *   **Physical Constraint:** **Practical Failure.** The actor simply cannot succeed (e.g., trying to walk through a wall).
  *   **Constitutive Rule:** **Status Change.** The act is counted as void or different (e.g., the rope is climbed anyway, but it is no longer "club climbing").
  *   **Evolutionary Signaling:** **Signal Failure/Confusion.** The deviation causes friction or mistrust (e.g., the merchant refuses the scoop) but not moral outrage.
  *   **Descriptive Norm:** **Surprise.** The deviation violates empirical expectations ("I thought everyone did it this way"), leading to confusion but not necessarily sanction.
  *   **Norm with Sanctions:** **Sanction/Irritation.** The deviation triggers active disapproval, scolding, or social cost (e.g., being called rude).
  *   **Lewisian Convention:** **Coordination Failure/Irritation.** The deviation creates friction or extra work for others (e.g., someone has to brew coffee sooner), leading to mild annoyance but not moral condemnation.
  *   **Coercive Regularity:** **Punishment.** The deviation triggers a penalty imposed by authority, regardless of peer expectation.

  **Indistinguishable Leaves:**

  *   **Pair:** **Lewisian Convention** vs. **Evolutionary Signaling**.
  *   **Reason:** Both involve arbitrary regularities sustained by mutual dependence. The distinction rests on *Common Knowledge* (Lewis) versus *Correlated Behavior without Representation* (Evolutionary). In practice, participants often cannot articulate whether they *know* others know, or if they simply *act* as if they do.
  *   **Further Question:** "If you discovered that no one else in the group knew about this practice, would you stop doing it?"
      *   A **Lewisian** agent would stop (the convention relies on the *agreement*).
      *   An **Evolutionary** agent might continue (the behavior is a successful strategy regardless of others' awareness, until it fails).
