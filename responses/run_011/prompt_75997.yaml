      2.  *STS:* Attacks the mechanism (determinism vs. construction). If they win, the argument is old news or naive.
      3.  *Historians:* Attacks the evidence ("nobody chose"). If they win, the case study is weak, but the theory might hold.
      4.  *Designers:* Attacks the utility. If they win, the talk is academic navel-gazing, but the theory holds.

  5.  **Developing Replies & Concessions:**

      *   *Pol Theory:* Need to argue that *capacity to act* is political. Concede that human enforcement matters, but insist the *terrain* is political.
      *   *STS:* Concede the schema was socially constructed *once*. Argue that *maintenance* is the new site of politics.
