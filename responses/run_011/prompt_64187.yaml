answer: |-
  ### Round 1: Intuitive Cases and the Threshold

  **Question 1**
  *   **Setup:** We often think a million people suffering a tiny delay is a lesser evil than one person dying, but your view suggests these complaints aren't comparable once the stakes are that unequal.
  *   **Question:** If ten million people would each suffer a trivially worse commute to prevent a single stranger's death, does your principle forbid imposing that commute, and if so, isn't that a counterintuitive result for a moral theory?
  *   **Likely Reply:** She will likely say this intuition relies on summing the commutes into a total cost, which is the aggregative mode her account rejects; individually, no single commuter's trivial burden outweighs a death.
  *   **Follow-up:** If we grant for the sake of argument that practical deliberation *requires* comparing total outcomes to be action-guiding, does your principle simply cease to apply, or does it declare all such deliberation morally invalid?

  **Question 2**
  *   **Setup:** Now consider the reverse: ten million people could each decline a trivial burden, but if they all do, one person dies.
  *   **Question:** In this mirror case, is each individual permitted to decline the burden, and if so, how do you explain why this isn't an "each-we" dilemma where the many are severally forbidden what they jointly ought to do?
  *   **Likely Reply:** She will argue that reasonable rejection is assessed pairwise between the potential victim and each individual actor, not against the collective; no single actor's refusal is unreasonable.
  *   **Follow-up:** But if the collective result is a death that could have been prevented by trivial acts, doesn't defining the "pair" so narrowly insulate the theory from the very social coordination problems morality is meant to solve?

  **Question 3**
  *   **Setup:** You argue that many small complaints count only when they are of broadly comparable weight to the competing individual complaint.
  *   **Question:** Where exactly is the threshold set between complaints that are comparable and those that are not, and who has the authority to determine that line?
  *   **Likely Reply:** She will likely claim the threshold is fixed by the substantive value of the interests at stake (e.g., life vs. convenience), discoverable through rational reflection, not stipulated by an authority.
  *   **Follow-up:** If rational reflection yields different thresholds for different reasonable people, does your theory allow for multiple correct principles, or does it imply one party is simply making a mistake in valuation?

  ### Round 2: Mechanism and Consistency

  **Question 4**
  *   **Setup:** If the threshold isn't stipulated but discovered, it implies there is a fact of the matter about when complaints become comparable.
  *   **Question:** If a view locates this threshold by stipulation rather than discovery, is it a view that could ever be wrong, or does it become true by definition?
  *   **Likely Reply:** She will deny it is stipulative, insisting it flows from the requirement to justify ourselves to others; to treat a death as comparable to a triviality is itself an unreasonable demand.
  *   **Follow-up:** But if "unreasonable" just means "fails to respect the threshold," aren't you defining the moral constraint in terms of the very threshold you're trying to justify?

  **Question 5**
  *   **Setup:** Partially aggregative accounts often struggle when you can save a larger group or a smaller group at the same cost.
  *   **Question:** Does your view permit saving fewer people when you could save more at no additional cost, or does it push you to the all-or-nothing conclusion that you should help everyone or no one?
  *   **Likely Reply:** She will argue that saving more is required because the principle allowing you to save fewer would be rejectable by those in the larger group who are left to die.
  *   **Follow-up:** If the larger group's rejection relies on the strength of their numbers combined, haven't you reintroduced aggregation through the back door of "principles for general regulation"?

  **Question 6**
  *   **Setup:** Sometimes what makes a rejection unreasonable is the total cost to everyone else of complying with what the rejector demands.
  *   **Question:** Doesn't assessing the reasonableness of a rejection based on the total cost of compliance allow aggregation to re-enter through the back door?
  *   **Likely Reply:** She will distinguish between summing *complaints* to outweigh a right versus summing *costs* to determine if a demand is burdensome enough to be rejected; only the latter is permitted.
  *   **Follow-up:** But if the total cost is high enough to make a demand unreasonable, doesn't that mean the many small costs have successfully outweighed the one person's demand, which is the summation you prohibit?

  **Question 7**
  *   **Setup:** Policies often involve risk, like speed limits that save lives but impose costs, where we don't know who will benefit or suffer beforehand.
  *   **Question:** Should a complaint be assessed from the individual's position before a risk resolves or from her position afterwards, given that the ex ante route looks like expected-value reasoning while the ex post route seems to license killing identified people?
  *   **Likely Reply:** She will likely favor the ex ante perspective, arguing that reasonable rejection must be based on the information available when the principle is adopted, not on lucky or unlucky outcomes.
  *   **Follow-up:** If we judge by ex ante probabilities, aren't we effectively calculating expected values and summing probabilities of harm, which is the consequentialist math you claim to displace?

  ### Round 3: Foundational and Meta-Ethical

  **Question 8**
  *   **Setup:** We routinely accept trade-offs among the competing interests of a single person over time, like enduring pain now for health later.
  *   **Question:** Why are trade-offs among the competing interests of a single person over time unproblematic on your account when trade-offs between persons are not?
  *   **Likely Reply:** She will argue that contractualism is about justification *to* others; a single person can authorize trade-offs within their own life that they cannot authorize across distinct lives.
  *   **Follow-up:** But if the moral weight of a complaint depends on whether it shares a skin with other complaints, doesn't that make the separateness of persons a metaphysical brute fact rather than a moral achievement?

  **Question 9**
  *   **Setup:** Your view avoids some counterintuitive results of utilitarianism by refusing to sum complaints across persons.
  *   **Question:** What is the strongest case you can make in your own defence that this restriction protects the distinctness of individuals in a way no aggregative account ever could?
  *   **Likely Reply:** She will argue that aggregative accounts treat people as mere containers for value, whereas her view respects each person as a sovereign source of claims that cannot be overridden by a sum.
  *   **Follow-up:** If respecting sovereignty means forbidding the override even to prevent catastrophe, does that respect become a form of moral absolutism that abandons the vulnerable to the choices of the many?

  **Question 10**
  *   **Setup:** You have defended the restriction against summing complaints as central to your contractualism.
  *   **Question:** What would have to be true, in your judgment, for the restriction against summing complaints to be abandoned rather than refined?
  *   **Likely Reply:** She will likely say this would require showing that the separateness of persons is morally irrelevant, or that individuals have no standing to veto principles that benefit the greater number.
  *   **Follow-up:** If empirical psychology showed that humans naturally reason aggregatively to survive, would that pressure you to refine the restriction, or does the truth of your view stand independent of our cognitive nature?
