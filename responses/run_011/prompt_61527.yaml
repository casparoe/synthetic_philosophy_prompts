      *   *Claim 3:* "Necessity is basically a priori truth with more moving parts."
          *   **Verdict:** **FALSE.** This collapses the 2D distinction. The whole point of 2DS is to *drive a wedge* between apriority (1D/PI) and metaphysical necessity (2D/SI).
      *   *Claim 4:* "Chalmers keeps insisting water/H2O is a genuine case of the necessary a posteriori."
          *   **Verdict:** **TRUE.** Chalmers accepts Kripkean NAP.
      *   *Claim 5:* "My patch (evaluate PI at actual, hold fixed...) is a third intension."
