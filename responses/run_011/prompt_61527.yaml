answer: |-
  You are wrong. Your friend is right. The literature is not being precious; you have collapsed the two dimensions into one, which destroys the entire apparatus.

  Here is the exact step where your reading goes bad:

  **Your Claim:** "A sentence is metaphysically necessary iff its primary intension comes out true at every scenario."

  **The Correction:** A sentence is *a priori* iff its primary intension is true at every scenario. A sentence is *metaphysically necessary* iff its **secondary intension** is true at every scenario (holding the actual world fixed).

  You have redefined metaphysical necessity as epistemic necessity (apriority). Two-dimensional semantics (2DS) was invented specifically to prevent this collapse, not to enforce it.

  ### Where Your Water/H2O Analysis Fails
  You claim: *"Water is H2O is necessary because its primary intension is true at every scenario."*

  This is false. On the 2D framework (Chalmers/Jackson), the Primary Intension (PI) of "Water is H2O" is **contingent**.
  *   **Scenario:** Consider Twin Earth (where the clear, drinkable liquid is XYZ) *as actual*.
  *   **Evaluation:** In this scenario, the term "water" picks out XYZ. The term "H2O" picks out H2O.
  *   **Result:** The sentence "Water is H2O" is **false** in this scenario.
  *   **Conclusion:** Since the PI is false in some scenarios, the statement is not *a priori*. It is *a posteriori*.

  However, the Secondary Intension (SI) is **necessary**.
  *   **Setup:** Fix *our* world as actual. "Water" rigidly designates H2O.
  *   **Evaluation:** Now vary the world counterfactually. In every counterfactual world, does the stuff that is actually water (H2O) equal H2O? Yes.
  *   **Conclusion:** The SI is true at all counterfactual worlds. The statement is metaphysically necessary.

  This is exactly how 2DS models Kripke's Necessary A Posteriori. It does not rule it out; it explains it by showing the divergence between PI (epistemic) and SI (metaphysical). Chalmers is not inconsistent; you are misreading the definition of the intensions.

  ### Why the Zombie Argument Still Matters
  You asked: *"If that's right, then materialism... is either a priori or refutable by pure scenario-construction... So why bother with zombies at all?"*

  Because for Chalmers, the link between PI and SI depends on the semantic type of the terms involved.
  1.  **Natural Kind Terms (Water):** PI $\neq$ SI. You cannot move from "I can conceive of water not being H2O" (PI truth) to "It is metaphysically possible" (SI truth). The reference fixer blocks the move.
  2.  **Phenomenal Terms (Consciousness):** Chalmers argues these are **semantically neutral**. For phenomenal concepts, PI $=$ SI.

  The Zombie argument works *only* because Chalmers argues consciousness is not like water. If consciousness were like water, the PI/SI gap would block the inference from conceivability to possibility. The Zombie argument is the attempt to prove that the physical $\rightarrow$ phenomenal link does not behave like the physical $\rightarrow$ water link. If you collapse PI and SI (as you did), you make materialism *a priori* true or false by definition, which begs the question against the anti-materialist. 2DS preserves the logical space for the debate.

  ### Your "Third Intension" Patch
  You proposed: *"Take the primary intension, evaluate it at the actual scenario, then hold that result fixed while you vary the world counterfactually."*

  Your friend is correct. That is not a third intension. **That is the literal definition of the Secondary Intension.**

  *   **Primary Intension:** Function from worlds-considered-as-actual to extensions.
  *   **Secondary Intension:** Function from worlds-considered-as-counterfactual to extensions, *given the actual world fixes the reference*.

  Your "patch" describes the mechanism of rigid designation handled within the 2D matrix. You thought you were inventing a new tool to save your theory, but you actually reinvented the standard tool that disproves your theory.

  ### Verdict: What 2DS Actually Buys You
  You asked what this apparatus buys you over rigid designation plus epistemology.

  **Rigid Designation + Epistemology:** Tells you *that* "Water is H2O" is necessary but unknown. It treats the necessity as a brute modal fact and the ignorance as a brute epistemic fact. It struggles to explain *why* the epistemic and modal come apart formally.

  **Two-Dimensional Semantics:** Buys you a **formal mapping of the gap**.
  1.  It validates the intuition that there is an "epistemic sense" in which water could have been XYZ (the PI).
  2.  It validates the Kripkean intuition that there is a "metaphysical sense" in which water could not have been XYZ (the SI).
  3.  It provides a diagnostic tool for philosophy of mind: It allows you to ask, "Does term X behave like 'water' (PI $\neq$ SI) or like 'pain' (PI $=$ SI)?"

  **Final Word:**
  Your reading tries to sanitize modality into epistemology. It wants necessity to just be "truth in all epistemic scenarios." 2DS says no: epistemic scenarios (primary) and metaphysical worlds (secondary) are distinct coordinates. You are wrong about the definition of necessity, wrong about the PI of "Water is H2O," and wrong about the "third intension." Stick with the standard model: PI tracks apriority, SI tracks metaphysical necessity. The gap between them is the Necessary A Posteriori.
