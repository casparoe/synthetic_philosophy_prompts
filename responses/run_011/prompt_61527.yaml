      *   *Claim 1:* "A sentence is metaphysically necessary iff its primary intension comes out true at every scenario."
          *   **Verdict:** **FALSE.** This is the critical error.
          *   *Correction:* In 2DS, *A priori* truth corresponds to the Primary Intension (PI) being true at all scenarios (considered as actual). *Metaphysical* necessity corresponds to the Secondary Intension (SI) being true at all scenarios (considered as counterfactual).
      *   *Claim 2:* "Water is H2O is necessary because its primary intension is true at every scenario."
