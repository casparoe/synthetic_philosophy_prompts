          *   SI: World considered as *counterfactual* (metaphysical). Determines truth given fixed reference.
          *   "Water = H2O":
              *   PI: False at Twin Earth (considered as actual). So it's *a posteriori* (not true at all scenarios as actual).
              *   SI: True at all worlds (considered as counterfactual), because 'water' rigidly designates H2O. So it's *necessary*.
              *   Result: Necessary A Posteriori.
      *   **Address the Zombie Argument/Materialism:**
          *   Because PI and SI come apart, you can't just do conceptual analysis (PI) to settle metaphysical questions (SI) *unless* the terms are semantically neutral (like "consciousness" for Chalmers).
