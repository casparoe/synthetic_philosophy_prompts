answer: |-
  # Workshop Prep Sheet: The Dummettian Reconstruction

  **Context:** 30-minute paper, 15-person table, interdisciplinary (Theory, Law, Empirical).
  **Core Claim:** Duty to admit is a duty a democracy owes *itself* to avoid civic corruption, not a duty owed to migrants.
  **Goal:** Survive the Q&A without being pinned as a zealot or a utopian.

  ---

  ### The Eight Objections (Ordered by Damage)

  #### 1. The "No Standing" Trap (Legal Faculty)
  *   **The Objection:** "If the duty is owed to the polity itself, the excluded individual has no *locus standi*. You've turned a right to migrate into a recommendation for state self-care. If a minister ignores you, who sues? If no one can claim this duty as a right, isn't it just politics, not ethics?"
  *   **Concession:** "You're right that this doesn't create an individual claim-right enforceable in court in the same way a refugee claim is."
  *   **The Reply:** "It shifts the enforcement mechanism from the judiciary to the electorate. Just as we don't say 'corruption isn't real because a briber can't sue,' we recognize that duties to maintain democratic integrity are policed politically. My argument gives the *citizen* a standing to demand admission of the outsider, not because the outsider deserves it, but because the citizen's own civic status is degraded by the exclusion. It empowers the domestic dissenter, not the foreign applicant."
  *   **Soft Spot:** This relies on a robust culture of internal dissent. If the electorate *wants* the corruption, the theory offers no external check.

  #### 2. The Walzerian Integrity Challenge (The Respondent)
  *   **The Objection:** "You say exclusion corrupts, but I say exclusion *constitutes*. Without the capacity to draw a boundary, a community is just a neighborhood. If you force admission to save our 'character,' haven't you destroyed the self-determination that makes that character valuable in the first place?"
  *   **Concession:** "I agree that some boundary maintenance is necessary for any collective project to exist."
  *   **The Reply:** "Walzer distinguishes between a club (which we join) and a neighborhood (where we live). Birthright citizenship makes us neighbors, not club members. When we treat a neighborhood like a private club, we lie about what we are. My argument isn't 'no boundaries,' it's 'no birthright fortresses.' You can have self-determination without treating your accidental neighbors as trespassers."
  *   **Soft Spot:** Defining the line between "constitutive boundary" and "corrupting fortress" is notoriously slippery.

  #### 3. The Indeterminacy Problem (Policy/Law)
  *   **The Objection:** "Even if I accept the duty, your view is operationally empty. It tells us 'don't close the door,' but it can't tell us *how many* to admit or *who*. Without a metric, this is decorative morality for people who don't have to write the quotas."
  *   **Concession:** "This view does not generate a specific number or a points-based algorithm."
  *   **The Reply:** "It generates a *presumption*. Current policy starts at zero and asks 'why let them in?' My view starts at open and asks 'what specific harm does this admission do to our democratic character?' It shifts the burden of proof. It's not decorative; it reverses the default setting of the bureaucracy."
  *   **Soft Spot:** In times of genuine strain (housing, infrastructure), the "presumption" might be overwhelmed, returning you to the utilitarian calculus you wanted to avoid.

  #### 4. The Redundancy Critique (The Carens-Style Liberal)
  *   **The Objection:** "Carens already argued the birthright lottery is morally arbitrary. You've wrapped his conclusion in a 'civic corruption' package, but isn't the normative work still being done by the arbitrariness claim? If birthright wasn't arbitrary, would your corruption argument still hold?"
  *   **Concession:** "The arbitrariness of birthright is the fuel, but not the engine."
  *   **The Reply:** "Carens argues from the migrant's side (it's unfair to *them*). I argue from the citizen's side (it's damaging to *us*). If you only argue fairness to migrants, the state can say 'we can't afford fairness.' If you argue civic corruption, the state cannot say 'we can't afford democracy.' I'm making the cost of exclusion internal to the polity, which makes the argument immune to resource constraints."
  *   **Soft Spot:** If the audience believes migrant interests are the *only* valid ground for migration ethics, they will see this as a weird detour.

  #### 5. The Empirical Diagnosis (The Empirical Researcher)
  *   **The Objection:** "You claim restrictionism is 'racial anxiety wearing the clothes of prudence.' My survey data shows voters distinguish sharply between economic impact and cultural threat. Are you sure you aren't just insulting the worries of the working class as 'racism' to avoid engaging with their material concerns?"
  *   **Concession:** "I should not have implied all restrictionist sentiment is racially motivated."
  *   **The Reply:** "My claim isn't about individual psychology, but institutional effect. Even if a voter has pure economic worries, a policy regime built on birthright exclusion *institutionalizes* a logic of 'insider vs. outsider' that inevitably racializes over time. The policy creates the habit of suspicion, even if the voter didn't start with it."
  *   **Soft Spot:** This risks sounding like you know the voters' motives better than they do (elite condescension).

  #### 6. The Perfectionism Worry (Political Theorist)
  *   **The Objection:** "You're arguing the state should admit people to shape civic character. That's state perfectionism. In a liberal state, shouldn't we be neutral about what makes a 'good' citizen, rather than engineering admission to produce virtuous democrats?"
  *   **Concession:** "This is undoubtedly a perfectionist argument."
  *   **The Reply:** "But it's *political* perfectionism, not *comprehensive* perfectionism. I'm not asking the state to promote a specific conception of the good life, but to maintain the conditions of its own legitimacy. A state that violates equality to maintain its borders is contradicting its own foundational premise. That's not neutrality; it's self-consistency."
  *   **Soft Spot:** Distinguishing "political" from "comprehensive" perfectionism is a well-worn and contested path in liberal theory.

  #### 7. The Instrumentalization Charge (Ethicist)
  *   **The Objection:** "Admitting people 'for our sake' rather than 'for theirs' treats the migrant as a means to our civic health. It's paternalistic and denies them agency. It sounds like we are collecting migrants to boost our moral self-image."
  *   **Concession:** "It does risk treating the migrant instrumentally."
  *   **The Reply:** "It's not instrumentalization; it's recognizing interdependence. We aren't using them; we are acknowledging that our moral status is entangled with theirs. When I stop a fight, I'm not 'using' the person I saved to be a non-violent person; I'm recognizing that violence corrupts me too. It restores their standing as co-participants in the political order, not beneficiaries of charity."
  *   **Soft Spot:** If the migrant is admitted solely to fix *our* problem, their specific needs (asylum, family reunion) might still be ignored.

  #### 8. The Refugee Distinction (Human Rights/Law)
  *   **The Objection:** "By swallowing the economic/refugee distinction, you risk diluting the special urgency of protection. If everyone has a claim based on *our* character, does the person fleeing death have any more priority than the person seeking a higher wage?"
  *   **Concession:** "My view does collapse the categorical distinction between refugee and migrant."
  *   **The Reply:** "It collapses the *right to exclude*, not the *priority of need*. Triage still applies. But the gate shouldn't be locked against the economic migrant just because the refugee is at the front. Both reveal the corruption of the birthright fortress; one just bleeds more urgently."
  *   **Soft Spot:** This is politically toxic. It makes you vulnerable to the "open borders" label which can derail the specific argument about civic corruption.

  ---

  ### The First Five Minutes: What to Give Away
  *Do not start by declaring the border must be open.* You will lose the Walzerian and the Empiricist immediately.

  1.  **Concede the "Right to Exclude" exists in some form:** "I am not arguing for a world without states or boundaries. I am arguing that the *current default* of exclusion is incompatible with democratic equality."
  2.  **Acknowledge the Cost:** "Admitting this duty is costly. It requires citizens to give up the privilege of birthright exclusivity. I am not pretending this is easy or without friction."
  3.  **Validate the Walzerian Intuition:** "Michael Walzer is right that communities need to make meaning together. He is wrong that meaning requires a closed door. I want to show you how the closed door actually destroys the meaning."

  *Why:* This signals you are a collaborator in the problem, not a crusader attacking their field. It lowers the temperature so they listen to the "corruption" thesis.

  ---

  ### The Single Reply That Must Land
  **The Link Between External Exclusion and Internal Inequality.**

  You must convince them that **policing the border changes how we treat each other inside.**
  If the audience believes that a strict border is compatible with perfect internal equality, your paper fails. You need to land the point that *a community defined by who it keeps out cannot sustain a self-understanding of who it keeps in as equals.*
  *Phrasing:* "When we make birthright the sole criterion for membership, we teach citizens that their equal standing is an accident of luck, not a political achievement. That habit of mind—'I am here because I won the lottery, not because we are equals'—inevitably seeps into how we treat the least advantaged among us. We become custodians of a privilege, not partners in a project."

  ---

  ### The Question You Are Praying Nobody Asks
  **The "Practical Incoherence" Synthesis.**

  You identified the *Standing* problem (no right for the migrant) and the *Numbers* problem (no metric for admission). The killer question combines them to attack the *agency* of your theory.

  **The Question:**
  "If the migrant has no standing to claim admission under your theory, and you offer no metric for how many to admit, aren't you left with a duty that is neither claimable nor actionable? Doesn't this just leave the gatekeeper exactly where they started: deciding unilaterally who enters, but now with a vague instruction to 'be virtuous' rather than 'follow the rules'?"

  **Why this is fatal:** It suggests your theory changes nothing in the real world. It makes the duty purely internal/conscience-based, which allows the state to claim it is "protecting its character" by excluding everyone.
  **Preparation:** You need a answer ready that explains how *political contestation* replaces *legal adjudication*. You must argue that "actionable" doesn't mean "judicially enforceable," it means "politically mobilizable." But be warned: this is your weakest flank.
