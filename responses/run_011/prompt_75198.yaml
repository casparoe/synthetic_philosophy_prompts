answer: |-
  You are describing a very specific failure of agency that standard safeguarding language misses because it looks for a villain, not a vacuum. You are right to feel that "choice" is the wrong word, even if the technical boxes for capacity and voluntariness are ticked.

  Here are the three established concepts that come closest, why they fall short, and a proposed term for the specific mechanism you have identified.

  ### 1. Adaptive Preferences
  **The Concept:** Developed by economists and philosophers like Amartya Sen and Jon Elster. It describes when people adjust their desires to match their available options to avoid the pain of wanting what they cannot have. A classic example is the fox deciding the grapes are sour because he cannot reach them.
  **Why it fits:** It explains why your mother says "yes" cheerfully. It acknowledges that her stated preference does not reflect her true well-being.
  **Why it falls short:** It focuses on the *internal* psychology of the victim (she has changed what she wants). In your account, your mother hasn't necessarily changed her values; she knows the kitchen was better, she knows the bus was useful. She is making a strategic calculation, not necessarily a psychological adjustment. Furthermore, this term doesn't capture the *bureaucratic validation*—the way HR or the care manager uses that "yes" to prove the system is working.

  ### 2. Structural Coercion
  **The Concept:** A sociological term where pressure is exerted not by a person making a threat, but by the arrangement of social or economic systems. If the only way to eat is to work for a specific wage, you are structurally coerced into working, even if no master holds a whip.
  **Why it fits:** It captures the "nobody did this to her" aspect. The council, the NHS, and the contractor acted independently, but the *structure* they created is coercive.
  **Why it falls short:** It is a broad political term. It explains the pressure, but it doesn't describe the specific *transaction* of the signature. It doesn't name the act of signing the care plan and having that signature used as proof of satisfaction.

  ### 3. Hobson's Choice
  **The Concept:** A colloquialism for a situation where you can "take it or leave it," but leaving it is not a viable option.
  **Why it fits:** It describes the end state: one option left standing.
  **Why it falls short:** A traditional Hobson's Choice is usually presented as a binary at the start (e.g., "take this horse or none"). Your scenario is dynamic; the options were eroded over four years. It also lacks the nuance of the "yes" being used as evidence of quality.

  ***

  ### The Missing Term: Ratification by Attrition

  Since existing terms miss the specific wrinkle of the *retrospective validation* (the "yes" being used to justify the erosion), I propose **Ratification by Attrition**.

  **Definition:**
  A process where an individual's consent is obtained not through positive preference for an option, but through the incremental removal of all viable alternatives by uncoordinated systemic forces. This consent is then cited by authorities as evidence that the remaining option is satisfactory, thereby insulating the system from further scrutiny.

  **The Four Criteria:**
  1.  **Incrementalism:** The alternatives were not removed in a single decision, but through a series of small, reasonable-sounding changes over time (the bus cut, the kitchen assessment, the GP merger).
  2.  **No Single Agent:** There is no coercer. The pressure comes from the cumulative effect of independent decisions.
  3.  **Formal Validity:** The subject has capacity, is not threatened, and signs willingly.
  4.  **Legitimising Loop:** The signature is subsequently used as data to prove the system is functioning correctly ("She chooses it," "The vote was unanimous").

  ***

  ### Edge Cases and Distinctions

  You asked where the edges lie. Here is how *Ratification by Attrition* holds up against the scenarios you proposed.

  **1. What if the trimming left her better off?**
  *   **Verdict:** It is still *Ratification by Attrition*, but it is **benign**.
  *   **Distinction:** The moral wrong in your example is not just the outcome (the care package), but the removal of agency. If the remaining option is objectively superior (e.g., the new GP surgery is actually better, even if further away), the *process* remains flawed because her "yes" cannot distinguish between "I like this" and "I have no other way." The legitimising loop is still dangerous because it prevents the system from learning if the trade-offs were worth it.

  **2. What if she would have said yes regardless?**
  *   **Verdict:** It is **not** *Ratification by Attrition*.
  *   **Distinction:** This is the counterfactual test. If, with the kitchen, the bus, and the original GP all in place, she would *still* have signed up for the full care package, then her consent is genuine. The erosion of options is irrelevant if it did not alter the decision. The harm occurs only if the erosion *caused* the consent.

  **3. What if all the doors were closed before she arrived?**
  *   **Verdict:** This is **Defective Disclosure** or **Mis-selling**.
  *   **Distinction:** *Ratification by Attrition* requires the *process* of erosion to happen while the person is in the system. If the options were never there to begin with, and she was told they were, that is fraud. If she was told they weren't there and moved in anyway, that is **Informed Acceptance of Constraints**. The specific grievance you have relies on the *change* from a state of greater freedom to a state of lesser freedom, validated by the subject's adaptation to that change.

  ### Summary
  The safeguarding lead was looking for **Undue Influence** (a person leaning on a vulnerable mind). That is why they found nothing.
  The HR department relied on **Revealed Preference** (an economic assumption that what you choose is what you want). That is why their data is garbage.

  What happened to your mother and your colleagues is **Ratification by Attrition**. It is a "yes" that is procedurally valid but substantively empty, used to shield a system from the consequences of its own fragmentation. It allows organisations to claim they are person-centred while systematically removing the person's centre.
