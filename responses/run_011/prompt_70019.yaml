answer: |-
  There is no single established term in metaphysics, museum studies, or performance theory that captures this specific dynamic. You have identified a gap between the *metaphysics of identity* (which assumes identity is a fact to be discovered) and the *sociology of institutions* (which treats identity as an asset to be managed).

  Existing concepts come close but miss the mark:
  *   **The No-Branching Rule:** In philosophy (e.g., Parfit, Nozick), this states that if a person/object splits into two equally valid candidates, identity is lost. However, this is treated as a logical constraint, not a management strategy.
  *   **Authorized Heritage Discourse:** In museum studies, this describes how institutions legitimize certain narratives over others. But it focuses on *story*, not the physical suppression of a rival material claimant.
  *   **Brand Dilution/Passing Off:** Legal and marketing terms that protect commercial value, but they don't address the ontological anxiety (the fear that the "real" ship/band ceases to be "real" if a rival appears).

  Since the term doesn't exist, I will coin one that fits the bureaucratic and metaphysical weight of your examples.

  ### The Concept: Enforced Singularity

  **Definition:** *Enforced Singularity* is the practice of maintaining an identity claim by actively preventing the public materialization or recognition of a rival claimant that would otherwise trigger a fission scenario. It is the administrative conversion of a metaphysical vulnerability (the possibility of branching) into a managed asset (uniqueness) through the suppression of evidence.

  In your examples, the Trust and the Band are not arguing that they are *more* authentic than the rival. They are arguing that they are the *only* authentic instance, and they ensure this remains true by keeping the rival in a state of latency.

  ### Where It Stops Counting (The Boundaries)

  To distinguish *Enforced Singularity* from ordinary decay, privacy, or curation, three conditions must be met. If any are missing, the concept does not apply.

  **1. The Condition of Feasibility (The "Can" Test)**
  *   **Applies:** The rival candidate *could* exist publicly right now. The ship parts are catalogued and complete; the ex-members are alive and playing.
  *   **Does Not Apply:** If the original planks were burned, or the ex-members died, uniqueness is a result of entropy, not enforcement. If the parts are sold to different buyers such that reassembly is financially impossible, that is market fragmentation, not Enforced Singularity. The suppression requires the *capacity* for the rival to exist.

  **2. The Condition of Intent (The "Why" Test)**
  *   **Applies:** The decision to withhold is motivated by the preservation of the identity claim. (As you noted: "an argument they'd lose.")
  *   **Does Not Apply:** If the parts aren't reassembled solely because of lack of floor space, or if the festival doesn't book the ex-members because their sound quality is poor, that is ordinary logistics or quality control. The motive must be ontological protection.

  **3. The Condition of Publicity (The "Seen" Test)**
  *   **Applies:** The suppression targets the *public recognition* of the rival. The parts can exist in a store; the ex-members can play in a pub. The enforcement kicks in when the rival threatens to enter the same *sphere of validation* (the museum hall, the festival lineup).
  *   **Does Not Apply:** If the Trust allowed the parts to be reassembled in a different country where no one would compare them, Enforced Singularity is not in play. The rivalry must be potential *in the eyes of the audience*.

  ### Differentiation from Related Concepts

  **1. Vs. Ordinary Gatekeeping**
  *   **Gatekeeping** excludes candidates deemed *unworthy* (e.g., "This band isn't good enough," "This artifact is a fake").
  *   **Enforced Singularity** excludes candidates deemed *too worthy*. The ex-members are excluded *because* they are authentic enough to threaten the claim. The original planks are hidden *because* they are genuine enough to rebuild the ship. Gatekeeping filters for quality; Enforced Singularity filters for uniqueness.

  **2. Vs. The No-Branching Condition**
  *   **The No-Branching Condition** is a metaphysical rule: "If two candidates exist, neither is the original." It describes what happens when identity fails.
  *   **Enforced Singularity** is a bureaucratic strategy: "Ensure only one candidate is visible so the rule never triggers." It is the *operationalization* of the No-Branching Condition. Philosophers treat branching as a logical hazard; your Trust treats it as a PR risk.

  **3. Vs. Third-Party Suppression**
  *   You asked about funders or venues acting alone.
  *   If a funder refuses to back the rebuilt ship to "avoid confusion," but the Trust *wanted* to rebuild it, this is **External Enforced Singularity**. The effect is the same (uniqueness is preserved), but the agency differs.
  *   For the concept to hold strictly, the *beneficiary* of the identity claim must be complicit. If the Band actively lobbies the festival (Case 2), it is Enforced Singularity. If the festival owner just happens to dislike the ex-members, it is merely **Curatorial Coincidence**, even if the result is the same. The *enforcement* implies an agent protecting the *self*.

  ### Why This Matters for Your Writing

  You have identified that institutional identity is not a continuous thread, but a **monopoly maintained by embargo**.

  In metaphysics, we ask: *Is this the same ship?*
  In your observation, the question is: *Are we allowed to see the other ship?*

  This shifts the ontology from the object to the archive. The "real" ship exists only insofar as the store room remains locked. This gives you a powerful lens for your writing: the tension isn't between old and new, but between the *exhibited* and the *stored*. The identity survives not through continuity of matter or memory, but through the successful management of visibility.

  **Term to use:** **Enforced Singularity**.
  **Mechanism:** **Ontological Quarantine** (specifically for the hiding of parts/people).

  This framework allows you to argue that the "authenticity" of the vessel or the band is not an inherent property, but a regulatory outcome. It stops counting as Enforced Singularity the moment the rival becomes impossible to assemble (Feasibility), the moment the motive becomes purely financial rather than identity-based (Intent), or the moment the suppression is accidental rather than strategic (Agency).
