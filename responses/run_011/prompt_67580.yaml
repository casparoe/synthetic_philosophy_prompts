  Interactive social kind (B) ranks first (8.5), capturing reflexive categories without overstating mind-independence. Statistical aggregate (D) follows (7.0), offering metaphysical safety but explanatory thinness. Historical individual (C) takes third (5.5), struggling with boundary conditions. Ideological posit (E) places fourth (4.5), dismissing usage as false consciousness. Natural kind (A) ranks last (3.5), failing to locate genuine discontinuities. This ordering prioritizes accounts accommodating feedback loops while acknowledging statistical constraints. B succeeds where A fails by treating labels as constitutive. D remains a fallback if B's constructivism proves too loose. C lacks precision regarding stratification. E and A are too rigidly eliminativist or realist for messy social data, though E diagnoses power dynamics better.

