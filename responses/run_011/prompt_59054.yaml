answer: |-
  Colleagues in ethics often find themselves translating between the clean lines of theory and the messy contingencies of statute. You have laid out the apparatus of the Mental Capacity Act (MCA) regarding Advance Decisions to Refuse Treatment (ADRT) with precision. What follows is a reconstruction of the philosophical commitments buried within those eight points, followed by the verdicts and change-lists you requested. I shall refrain from citing the literature you already know; instead, I will treat the statute as a text demanding exegesis.

  ### (a) The Picture of the Person and Diachronic Authority

  The bundle presupposes a **Statutory Proxy** view of personhood, which is distinct from both a strict Psychological Continuity view and a strict Biological view.

  Clause (6) is the linchpin here. By stating the decision has effect "as if he had made it, and had had capacity to make it" at the present moment, the law performs a legal fiction that sidesteps the metaphysical problem of diachronic identity. It does not claim that the past self *is* the present self in a robust ontological sense. Nor does it claim that the past self has natural authority over the future self. Rather, it grants the past self *statutory* authority to act as a proxy for the present self, contingent on specific conditions.

  If the framework presupposed a strict "continuing subject" view (where identity is unbroken), Clause (4) would be unnecessary; the past decision would bind simply because it is the same person's decision. If it presupposed a "sequence of selves" view (where the demented patient is effectively a new person), Clause (1) would be incoherent; a previous self cannot bind a new one without external justification.

  The "as if now" fiction concedes that diachronic authority is not naturally operating. Instead, the law constructs a bridge. It treats the document not as a command from the past, but as evidence of what the present patient *would* say, were they able. However, this is not a pure "substituted judgement" standard either, because the document binds unless invalidated.

  **Verdict:** The framework presupposes a **Conditional Sovereignty** view. The earlier self is sovereign over the later self, but only so long as the later self's context remains within the anticipated horizon of the earlier self's rationality. It is not a contract between selves (which implies two parties); it is a unilateral declaration that retains force until the world changes enough to break its semantic link to the present.

  ### (b) The Refusal-Only Asymmetry

  The asymmetry between binding refusals (1) and non-binding requests presupposes a conception of autonomy as **Negative Liberty** combined with a **Professional Sovereignty** constraint.

  1.  **Negative Liberty:** The law treats autonomy primarily as a right to non-interference. You may forbid the state (and its agents, the clinicians) from touching your body. You do not have a right to command the state to deploy resources or perform acts that violate professional judgement. This is classic Berlinian negative liberty: freedom *from* treatment, not freedom *to* obtain treatment.
  2.  **Professional Integrity and Resources:** If advance requests were binding, they would compel clinicians to act against their judgement of clinical efficacy or resource allocation. A binding advance request for a futile antibiotic would force a clinician to act improperly. Thus, the asymmetry protects the clinician's role as gatekeeper of medical appropriateness.
  3.  **The Ulysses Problem:** Regarding your bipolar example: the failure of pre-consent to bind in many contexts (often falling under Mental Health legislation rather than MCA) reveals that the law prioritises the *current* appearance of distress or risk over the *past* rational commitment. In the MCA context, a request is merely evidence of best interests. A refusal is a veto. This suggests autonomy is viewed as a shield, not a sword.

  **Verdict:** This is not merely administrative inertia. It is a substantive commitment to the view that while a patient owns their body, they do not own the clinician's labour or the state's resources. Autonomy is the power to stop the machine, not to steer it.

  ### (c) Clause (4) and the Hypothetical Earlier Self

  Clause (4) is the most philosophically volatile component. It states the decision is invalid if unanticipated circumstances exist which "would have affected his decision had he anticipated them".

  This does not hand authority to the *actual* earlier self; it hands authority to a **Reconstructed Rational Self**. It asks the clinician to simulate a counterfactual: "What would the capacitous you have decided if you knew *this*?"

  1.  **Consistency with (3) and (6):** It is tension-filled. Clause (6) says treat it as a current refusal. Clause (4) says ignore it if the current context is too different. This is not consistent with a strict "sovereignty of the earlier will" view. If the earlier will was sovereign, its ignorance of future facts would not matter; it would still be its will.
  2.  **Present-Sensitivity:** You are correct that this smuggles present-sensitivity in through the back door. It allows the clinician to override the past self based on the *current* reality of the patient's condition (e.g., the contented dementia patient). It presupposes that the *value* of the decision depends on the *accuracy* of the information available when made.
  3.  **The Point of Binding:** If the point of binding your future is to protect you from a future self that might be compromised (e.g., fear, pain, depression), Clause (4) undermines this by allowing the current state (contentment) to invalidate the past protection.

  **Verdict:** Clause (4) presupposes that **Autonomy is Reason-Responsive**. A decision made in ignorance of key facts is not fully autonomous. Therefore, the law prioritises the *rationale* behind the refusal over the *refusal itself*. It assumes a rational agent would not refuse life if they knew life could be contented. This shifts authority from the Past Self to the Clinician's interpretation of the Past Self's Rationality.

  ### (d) Formality, Court Declarations, and Comfort Care

  The two-tier formality (5), the court provision (7), and the comfort-care carve-out (8) presuppose a **Substantive Presumption in Favour of Life** that is disguised as procedural safeguarding.

  1.  **Formality (5):** If this were purely evidential (preventing forgery), all refusals would require high formality, as all carry risk. The fact that only life-sustaining refusals require writing/witnessing suggests life has a special status. The state requires more proof to allow death than to allow lesser harms. It presupposes that death is an irreversible harm that requires a higher threshold of autonomous certainty.
  2.  **Court Declarations (7):** Allowing treatment whilst waiting for a declaration reveals an error-cost asymmetry. The law deems it worse to let a patient die by mistake (following a invalid directive) than to treat them by mistake (violating a valid directive). This is a sanctity-of-life principle operationalised as procedural caution.
  3.  **Comfort Care (8):** This is the most telling. If autonomy were absolute, a patient could refuse all intervention, including hygiene and pain relief (perhaps for religious penance). The fact that mouth care and analgesia are non-negotiable presupposes a **Baseline Humanity**. There is a level of care owed to the human organism that cannot be waived by the person. It suggests that even when the 'person' (as an autonomous agent) refuses treatment, the 'human' (as a subject of moral concern) retains rights to dignity.

  **Verdict:** These features are not merely evidential. They are substantive protections for life and dignity that limit the scope of autonomy. They presuppose that the state has an interest in preserving life and preventing suffering that outweighs ambiguous or informal autonomous refusals.

  ### (e) Mapping Features to Philosophical Views

  Here is the map of which features require which philosophical commitments.

  | Feature | Requires (Necessary Condition) | Compatible With (Sufficient Condition) | Underdetermined / Ambiguous |
  | :--- | :--- | :--- | :--- |
  | **1. Refusal Only** | Negative Liberty; Professional Sovereignty. | Best Interests; Resource Allocation. | Whether this is rights-based or utilitarian. |
  | **2. Easy Withdrawal** | Current Capacity is Supreme. | Narrative Identity (current chapter overrides past). | Whether oral withdrawal is evidentially sufficient. |
  | **3. Inconsistent Behaviour** | Behaviour expresses True Will. | Psychological Continuity. | Whether behaviour must be capacitous to invalidate. |
  | **4. Unanticipated Circumstances** | Autonomy is Reason-Responsive. | Best Interests (via substituted judgement). | Who decides what is "reasonable grounds". |
  | **5. LST Formality** | Sanctity of Life (or high stakes). | Evidential Caution. | Whether life is substantively special or just legally risky. |
  | **6. "As If Now" Fiction** | Legal Pragmatism. | Any identity theory (sidesteps the issue). | The metaphysical status of the patient. |
  | **7. Court = Treat** | Presumption in Favour of Life. | Error Cost Asymmetry. | Whether this is a right to life or a duty of care. |
  | **8. Basic Care Carve-out** | Inalienable Rights to Dignity. | Paternalism regarding suffering. | The definition of "treatment" vs "care". |

  **Underdetermined Areas:**
  *   **The Status of the Demented Patient:** The scheme does not decide whether the demented patient *is* the directive writer. It treats them as the same for the purpose of the refusal, but different for the purpose of Clause (4) assessment.
  *   **The Weight of Values vs. Experience:** It is unclear whether the past self's *values* (e.g., "dignity is cognitive") outweigh the present self's *experience* (e.g., "I am happy"). Clause (4) suggests experience wins if unanticipated, but Clause (1) suggests values win if anticipated.

  ### (f) Internal Coherence and Alternative Views

  **Is the bundle internally coherent?**
  Pragmatically, yes. Philosophically, no. It is a hybrid designed to resolve conflict rather than assert truth. It tries to honour the past self (1, 5, 6) while protecting the present self from the past self's ignorance (4) and protecting the state from liability (5, 7). The tension between Clause (6) (it is a current refusal) and Clause (4) (it is invalid if the situation changed) is the primary fracture. It claims to respect autonomy while reserving the right to define the conditions under which autonomy is valid.

  **What would have to change?**

  **(i) Wellbeing is entirely a matter of present experience (Hedonic/Experiential View)**
  *   *Verdict:* The current framework collapses. The dementia case becomes straightforward: the patient is content, so treatment should proceed regardless of the directive.
  *   *Changes Required:*
      *   **Statute:** Abolish ADRTs where the patient currently exhibits positive affect and no distress. Clause (4) would become the default rule, not an exception.
      *   **Practice:** Clinicians would assess current mood/state as the primary determinant of treatment, not past documents.
      *   **Philosophy:** Shift from "Critical Interests" (Dworkin) to "Experiential Interests".

  **(ii) The demented patient and directive-writer are relevantly different people (Discontinuity View)**
  *   *Verdict:* The directive loses binding force entirely. It becomes merely advisory evidence of what a relative might have wanted.
  *   *Changes Required:*
      *   **Statute:** Repeal sections 24–26. Replace with a pure "Best Interests" regime where past wishes are one factor among many, with no veto power.
      *   **Practice:** The "as if now" fiction (Clause 6) is dropped. The document is treated as a letter from a third party.
      *   **Ethics:** The burden shifts entirely to the clinician/family to determine what is best for *this* current entity, without being bound by the dead hand of the past.

  **(iii) Capacity is always supported; substitute decision-making should be rare (Disability Rights/Supported Decision Making)**
  *   *Verdict:* ADRTs are largely obsolete. If capacity is supported, the patient should be involved in the decision *now*.
  *   *Changes Required:*
      *   **Statute:** Shift focus from "assessing capacity" to "providing support to enable capacity". ADRTs become secondary to current will-and-preferences (as per UN CRPD interpretations).
      *   **Practice:** Ward routine changes from "Does this form bind us?" to "How can we communicate with the patient to ascertain their current will?"
      *   **Authority:** The "substitute" decision-maker disappears. The clinician supports the patient to decide. If the patient cannot decide even with support, the framework lacks a clear mechanism, implying a need for a new model of co-decision-making rather than advance planning.

  ### Final Reconstruction

  The MCA apparatus you are working within is not built on a single theory of personal identity. It is a **protective hybrid**. It uses the language of identity (Clause 6) to empower the past self, but retains the safeguards of paternalism (Clause 4, 5, 7, 8) to protect the present self and the state.

  In your dementia case, the team is instinctively reaching for Clause (4). They are arguing that the "contentment" is an unanticipated circumstance that alters the rational basis of the refusal. The directive assumed a life of indignity; the reality is a life of simple pleasure. Under the MCA, if there are reasonable grounds to believe she would have decided differently had she known she would be content, the directive is invalid.

  However, the friction you feel comes from the fact that the law asks you to respect the *values* of the past self (who feared dementia) while assessing the *experience* of the present self (who enjoys music). The framework does not tell you which trumps which when they conflict, other than to say: if the past self knew about the music, would they still refuse?

  If you are writing this up, the strongest philosophical critique is not that the law gets identity wrong, but that it gets **authority** wrong. It grants the past self authority over the present self's body, but reserves for the clinician the authority to judge the past self's rationality. It is autonomy subject to a veto by the state's interpretation of reasonableness. That is the apparatus you are operating.
