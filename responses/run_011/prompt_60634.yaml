  ### Summary

  Your package is operationally sound (Half-Kelly, cash buffer, insurance) but theoretically dishonest. You are behaving like a prudent investor with a finite horizon and specific liability needs, but justifying it with the language of infinite-horizon growth maximization.

  Drop the pretence that the math dictates your choices. Admit that you are choosing a specific utility function because it suits your life, not because it suits the universe. That admission allows you to fix your probability estimates (6) and define your retirement floor (5) without cognitive dissonance.
