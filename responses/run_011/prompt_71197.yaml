answer: |-
  # Preparation Sheet: Tolstoy Revival Seminar
  **Context:** Departmental Aesthetics Research Seminar (3 Weeks)
  **Goal:** Survive the Question Period; Secure the Distinction between Arthood and Value.

  ## I. Pre-emptive Concessions (Opening 5 Minutes)
  *Do not wait for these to be raised. Disarm them in your introduction to signal philosophical hygiene.*

  1.  **Concede Tolstoy's Verdicts:** Explicitly state in minute two: "Tolstoy's specific judgments on Shakespeare and Beethoven are indefensible. I am not defending them. I am defending the *mechanism* of evaluation he proposed, stripped of his specific religious moralism."
  2.  **Concede the Religious Context:** Acknowledge that *What Is Art?* is theological. State: "I am bracketing the Christian brotherhood requirement. I am treating 'union' as a secular, psychological, and social phenomenon."
  3.  **Concede the Reconstruction:** Address the hermeneutic charge immediately. "This is a rational reconstruction. I am asking what work Tolstoy's concepts can do for *us*, not what Tolstoy meant in 1897 Yasnaya Polyana."

  ---

  ## II. The Ten Objections (Ordered by Damage)

  ### 1. The Collingwoodian Objection (Expression vs. Arousal)
  **Who:** Senior Colleague.
  **Vocab:** "Clarification," "Imagination," "Betrayal," "Stimulation."
  **Objection:** "You are repeating the classic category mistake. Tolstoy conflates *expressing* an emotion (clarifying it for oneself in the imagination) with *arousing* it in an audience (psychological stimulation). Art is the former. If I write a poem to make you cry, I am not making art; I am crafting a stimulus. By making 'infection' the criterion, you reduce art to rhetoric or propaganda."
  **Reply (2 mins):** "I accept Collingwood's distinction for the *process of making*, but not for the *definition of the work*. A work can be the record of an expression without being art until it functions as a vehicle for transmission. My claim is normative, not psychological: a feeling locked in the artist's head is a private mental state; it becomes art only when externalized *for* another. I am not saying the goal is mere stimulation (like a sad movie), but that the *capacity* to share the clarified emotion is what individuates art from diary-keeping."
  **Soft Spot:** You are arguably changing the subject from "What is art?" to "What is successful communication?"
  **Strategy:** **Resistance.** Hold the line that arthood is relational, not monological.

  ### 2. The Institutionalist Objection (The Choir Case)
  **Who:** The Convenor.
  **Vocab:** "Artworld," "Conferral of Status," "Historical Context," "Theory-laden."
  **Objection:** "Your community choir is only art because the artworld says it is. If you remove the institutional frame, it's just singing. Tolstoy's infection theory cannot distinguish a community choir from a football chant or a religious hymn. All 'infect' a crowd. Only the Institution can explain why one is art and the others are not."
  **Reply (2 mins):** "Institutionalism explains the *label*, but not the *value*. You can confer the status of 'art' on a urinal, but that doesn't explain why we care about it. My account explains why the choir matters *as art*: it generates a specific kind of social union that a football chant (tribal exclusion) or a hymn (theological submission) does not. I am offering a functional account of value where you offer a taxonomic account of status. We can agree it is art institutionally, but my theory explains its *significance*."
  **Soft Spot:** Tolstoy's criterion is supposed to be a criterion of *arthood*, not just value. If the chant infects, is it art?
  **Strategy:** **Concession/Shift.** Concede the chant might be "folk art" or "proto-art," but insist your theory ranks the *quality* of the art better than Institutionalism.

  ### 3. The Propaganda/Demagoguery Objection (Value Ranking)
  **Who:** Doctoral Students / Analytic Group.
  **Vocab:** "Manipulation," "Cognitive Content," "Epistemic Virtue," "Ease of Transmission."
  **Objection:** "Your 'Reach Condition' is dangerous. A technically superb piece of propaganda (e.g., *Triumph of the Will*) infects a wider circle more easily than a slight, honest landscape. If 'infectiveness' and 'breadth' determine value, you are forced to rank the propaganda higher. Tolstoy's moralism prevented this; you have removed the moralism but kept the metric."
  **Reply (2 mins):** "This is why I retained Tolstoy's 'Quality of Feeling' constraint. Propaganda transmits *simplified* feelings (hatred, pride). These score low on quality, even if high on reach. The 'Reach Condition' is ceteris paribus: reach only increases value if the feeling is not diluted. Propaganda dilutes feeling into slogan. Therefore, it fails the quality test before the reach test applies."
  **Soft Spot:** How do you objectively measure "quality of feeling" without reintroducing Tolstoy's religion?
  **Strategy:** **Resistance.** Define quality as "complexity" or "nuance" rather than moral goodness.

  ### 4. The Formalist Objection (Absolute Music)
  **Who:** Music Philosopher.
  **Vocab:** "Absolute Music," "Structural Integrity," "Emotionalism," "Autonomy."
  **Objection:** "What feeling does a Bach fugue transmit? It transmits none. It is about tonal relationships. Your theory implies absolute music is either not art or 'counterfeit' because it aims at structural beauty, not emotional union. Tolstoy rejected Beethoven for this reason; are you willing to reject him too?"
  **Reply (2 mins):** "I reject the premise that absolute music lacks feeling. It transmits the feeling of *resolution*, *tension*, or *play*. It unites listeners in a shared experience of temporal structure. Tolstoy failed because he looked for *narrative* feelings. I am arguing for *phenomenological* feelings. If the audience shares the experience of the structure, infection has occurred."
  **Soft Spot:** This stretches "feeling" to mean "any conscious experience," risking vacuity.
  **Strategy:** **Resistance.** Expand the definition of "feeling" to include "aesthetic emotion."

  ### 5. The Artist's Objection (Instrumentalism)
  **Who:** Practising Artist.
  **Vocab:** "Autonomy," "Instrumentalization," "Utility," "Lived Practice."
  **Objection:** "You are making art answerable to an external purpose (social union). This is why artists hate theorists. Sometimes art is meant to alienate, to confuse, or to be private. If a work fails to unite anyone, is it not art? You are judging art by its social utility, like a policy document."
  **Reply (2 mins):** "I am not demanding actual union, but the *capacity* for it. A difficult work may unite only a small circle (low reach), but if it transmits a genuine feeling of alienation, it succeeds. The 'purpose' isn't social harmony; it's the sharing of experience. Even the communication of isolation is a form of union (we share the feeling of being alone)."
  **Soft Spot:** This is a clever dodge that might sound sophistical.
  **Strategy:** **Concession.** Admit that "union" is a loaded term; offer "shared recognition" instead.

  ### 6. The Rational Reconstruction Charge (Hermeneutics)
  **Who:** Senior Colleague & Historians.
  **Vocab:** "Exegesis," "Charity," "Anachronism," "Textual Fidelity."
  **Objection:** "You admit this is a reconstruction. But if you discard the verdicts, the religion, and the psychology, are you defending Tolstoy or just using his name? Why not call this 'The Transmission Theory' and drop Tolstoy entirely?"
  **Reply (2 mins):** "Because Tolstoy's specific diagnostics of *counterfeit* art (borrowing, effectfulness, etc.) are unique to him and vital for my test case. Institutionalism cannot explain why a community choir is better than a corporate team-building exercise. Tolstoy's marks of 'sincerity' vs. 'effectfulness' do that work. I need Tolstoy's specific vocabulary to make the distinction."
  **Soft Spot:** It might still look like you are cherry-picking.
  **Strategy:** **Resistance.** Emphasize the utility of the "Counterfeit" diagnostics.

  ### 7. The Vagueness Objection (Psychology)
  **Who:** Doctoral Students.
  **Vocab:** "Propositional Attitudes," "Qualia," "Operationalize," "Empirical."
  **Objection:** "How do we measure 'infectiveness'? Is it self-report? Physiological? If it's audience-relative, does a work cease to be art if the audience is tired? You are building a theory on a psychological variable that is impossible to isolate."
  **Reply (2 mins):** "It is a dispositional property, not an episodic one. A work is infectious if it *would* transmit the feeling under ideal conditions. We judge this through critical discourse and historical endurance, not stopwatches. It is no vaguer than 'aboutness' or 'representation'."
  **Soft Spot:** "Ideal conditions" is a black box.
  **Strategy:** **Concession.** Admit it is a normative idealization.

  ### 8. The Dilution Trade-off (Reach vs. Depth)
  **Who:** Doctoral Students / Convenor.
  **Vocab:** "Least Common Denominator," "Accessibility," "Complexity."
  **Objection:** "Your Reach Condition implies that to increase value, I must widen the circle. But widening the circle usually requires simplifying the feeling. You create a tension between Reach and Quality that your theory doesn't resolve."
  **Reply (2 mins):** "Correct, it is a tension, not a formula. High art maximizes reach *without* dilution. Pop art maximizes reach *with* dilution. The theory is designed to distinguish them, not to provide a mathematical score."
  **Soft Spot:** Leaves the ranking criteria subjective.
  **Strategy:** **Concession.** Acknowledge the tension is the point of criticism.

  ### 9. The Counterfeit Marks Objection
  **Who:** Practising Artist.
  **Vocab:** "Appropriation," "Pastiche," "Design."
  **Objection:** "You say 'borrowing' and 'imitation' mark counterfeit art. But what about appropriation art? Quotation? Pastiche? These are central to postmodern practice. Your diagnostics condemn half of contemporary art."
  **Reply (2 mins):** "Tolstoy means borrowing *to hide a lack of feeling*. Appropriation art uses borrowing *to express a feeling about borrowing*. The diagnostic is about sincerity of intent, not the raw material used."
  **Soft Spot:** Hard to distinguish in practice.
  **Strategy:** **Resistance.** Focus on the *intent* behind the borrowing.

  ### 10. The Religious/Moral Foundation
  **Who:** General Room.
  **Vocab:** "Secular," "Universal," "Brotherhood."
  **Objection:** "Without Tolstoy's Christian universalism, 'union of mankind' is just a secular platitude. Why is 'uniting people' the goal of art at all?"
  **Reply (2 mins):** "Because art is a technology of empathy. In a fragmented society, the capacity to share subjective states is a primary good. It doesn't need theological grounding to be socially vital."
  **Soft Spot:** Sounds like a policy statement.
  **Strategy:** **Resistance.** Frame it as a phenomenological fact about art's function.

  ---

  ## III. The Single Reply That Must Land
  **The Issue:** The Separation of Arthood and Value.
  **Why:** If the audience conflates your criterion of *arthood* (infection) with your criterion of *value* (reach/quality), they will trap you. They will say: "If the choir infects, it's good art. If it doesn't, it's not art."
  **The Reply:** "You must keep the two questions distinct. **Arthood** is binary: did transmission occur? (Yes/No). **Value** is graded: how deep was the feeling and how wide was the union? (More/Less). My theory allows for *bad art* (infection occurs, but feeling is shallow/narrow). Tolstoy's mistake was thinking bad art wasn't art at all. I am correcting that."
  *If this lands, you survive. If they conflate the two, the theory collapses into elitism or populism.*

  ---

  ## IV. The Question You Hope Nobody Asks
  **The Question:** "On your account, is a highly skilled, emotionally resonant recruitment video for a benevolent charity 'better' art than a difficult, honest, but obscure poem that only five people understand?"
  **Why it's worse than Propaganda:** Propaganda is easily dismissed as "low quality feeling." A benevolent charity video transmits *good* feelings (hope, solidarity) to a *wide* circle. Your "Reach Condition" + "Quality of Feeling" might genuinely force you to rank the corporate/charity video above the avant-garde poem.
  **Preparation:** If asked, do not bite the bullet. Pivot to **Complexity**. "The video simplifies the feeling to achieve reach. The poem complexifies it. The 'Quality' constraint weighs complexity heavily. The poem wins on quality, the video on reach. Art values quality of feeling *over* breadth of reach when they conflict." (Note: This slightly contradicts your "Reach Condition" summary, so be careful to frame Reach as a *tie-breaker* or *multiplier*, not the sole determinant).

  ---

  ## V. Vulnerability: Rational Reconstruction vs. Interpretation
  **The Risk:** Two people (likely the Senior Colleague and a Historian type) will feel you are being intellectually dishonest by calling this "Tolstoy" when you have gutted his religious/moral core.
  **The Fix:**
  1.  **Own it:** "I am treating Tolstoy as a collaborator, not an authority."
  2.  **Justify it:** "Standard interpretations dismiss the book as a cranky relic. I am arguing it contains a functionalist engine that is currently missing from analytic aesthetics. If I have to break the historical shell to save the engine, I will do so."
  3.  **The "Tolstoy" Label:** If pressed, say: "Call it 'Neo-Tolstoyanism' if you like. But the diagnostics of counterfeit art are too useful to discard along with the theology."

  ---

  ## VI. Strategic Notes for the Room
  *   **The Convenor (Institutionalist):** Do not try to defeat Institutionalism on *arthood*. You will lose. Concede the label, fight for the *evaluation*. "You tell me what is art; I tell you why it matters."
  *   **The Collingwoodian:** Do not get bogged down in 1930s aesthetics. Acknowledge the distinction, but argue that *publication* moves the work from Expression to Transmission.
  *   **The Artist:** Validate their resentment. "Theory often strangles practice. I want a theory that explains why your choir matters, not one that judges it from above."
  *   **General Tone:** Humble but firm on the core distinction (Arthood vs. Value). You are reviving a tool, not preaching a gospel.
