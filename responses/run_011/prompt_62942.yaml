answer: |-
  Here is the consistency audit.

  ### The Real Tensions (Ranked by Severity)

  **1. Item 10 (No Role Morality) vs. Items 1, 7, and 11 (Special Status/Obligation)**
  *   **The Conflict:** You assert that officials follow the "same rules" as private citizens (10), yet you assign them permissions private citizens lack (1: consequentialist override of constraints) and obligations private citizens likely lack (7: duty to incur dirt). You also claim the distinctiveness of official situations is "load-bearing" (11).
  *   **Why it breaks:** If the rules are identical, the *threshold* for overriding constraints must be identical. If a private citizen cannot betray a confidence to stop a pogrom without being simply "wrong," but an official can (and must), the rules are not the same. Item 10 forces you into a hard universal utilitarianism (private citizens must also get dirty to save the city) or renders 1 and 7 incoherent (officials aren't actually permitted/obligated to do what private citizens are forbidden).
  *   **Severity:** Critical. This undermines the logical architecture of the specific "political" dilemma you are describing.

  **2. Item 9 (Standing Procedures) vs. Items 2 and 4 (Personal Guilt/Agency)**
  *   **The Conflict:** You want dirt to be strictly personal to the doer (4) and require a specific phenomenological attitude of guilt (2). But you also advocate for "standing procedures" where awful calls are made by "whoever is on shift" under "written guidance" (9).
  *   **Why it breaks:** Bureaucratic procedure is designed specifically to diffuse agency and dampen personal guilt. If an act is mandated by written guidance, the "doer" becomes an instrument. It is psychologically and morally difficult to sustain the "personal guilt" requirement (2) when the act is routinized (9). This risks turning the "dirty hands" agent into a "just following orders" cog, which contradicts the personal ownership required by 4 and 8.
  *   **Severity:** High. This threatens the phenomenological core of your view (the *feel* of the dirt).

  **3. Item 12 (Hindsight) vs. Item 1 (Consequentialist Decision)**
  *   **The Conflict:** You claim justification is consequentialist (1) and the account must be action-guiding (12), but you also claim you can't tell if hands are dirty until afterwards (12).
  *   **Why it breaks:** Consequentialist justification requires an estimation of outcomes *ex ante* to guide action. If the moral status ("dirt") is only legible *ex post*, the theory cannot guide the decision in the moment, only judge it later. This creates a gap between the decision procedure and the justification.
  *   **Severity:** Medium. This is largely epistemic. It can be mitigated by distinguishing between *expected* utility (for decision) and *actual* utility (for judgment), but it remains a friction point.

  ---

  ### Apparent Tensions (False Alarms)

  *   **1 vs. 2 (Consequentialism vs. Guilt):** You have already correctly insulated this in Item 3. As long as you maintain the "all-things-considered" vs. "pro tanto" distinction, this is stable.
  *   **4 vs. 5 (Personal Dirt vs. Institutional Taint):** This holds provided you maintain your semantic distinction between "dirt" (moral remainder on the soul) and "taint" (legitimacy deficit of the regime).
  *   **10 vs. 11 (Same Rules vs. Distinct Situations):** *Only* appears consistent if "rules" means "fundamental values" and not "decision procedures." Given your specific claims in 1 and 7, they are actually in tension (see Real Tension #1).

  ---

  ### Cheapest Revisions and Losses

  **For Tension 1 (Item 10):**
  *   **Revision:** Rewrite 10 to: "Officials operate under the same *fundamental moral values*, but their role generates specific *obligations and permissions* private citizens do not face."
  *   **Loss:** You lose the rhetorical punch of "equality before the moral law." You concede that office-holding changes the moral calculus, not just the situational stakes.

  **For Tension 2 (Item 9):**
  *   **Revision:** Rewrite 9 to: "Administration should have standing *consultative* procedures, but the final authorization must remain a personal, non-routinized decision."
  *   **Loss:** You lose bureaucratic efficiency and the protection of "shift work." The burden remains squarely on the specific minister, increasing the risk of burnout or arbitrary variance.

  **For Tension 3 (Item 12):**
  *   **Revision:** Rewrite 12 to: "You can't tell whether your hands came out dirty until afterwards, but you must decide based on the *best available projection* of consequences."
