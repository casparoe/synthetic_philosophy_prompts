  ### The Single Item to Rewrite

  **Item 10 ("Role morality is a sham...").**

  **Why:** This is the linchpin. Your entire account relies on the official facing a unique moral geometry (1, 7, 11) that private citizens do not face. Insisting the rules are the same (10) forces you to either drag private citizens into your dirty hands dilemmas (making them obligated to sacrifice informants) or admit officials are breaking the rules (making them criminals rather than dirty-handed agents).

