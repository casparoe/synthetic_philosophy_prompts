  **The Gain:** This instantly aligns 1, 7, and 11. It explains why the minister in the Kessler memo is obligated to leak (special duty) while a private citizen might not be (no special duty). It preserves the "dirty hands" specificity without requiring you to defend a universal act-utilitarianism for all human beings. It cleans up the logic of the whole list.
