prompt: |-
  I direct the evidence review group at a national health technology assessment body. Twice a month a sponsor dossier arrives — a diagnostic, a digital therapeutic, a biomarker-guided intervention — and we must produce a coverage recommendation within six weeks. The recommendation is signed off by a committee of clinicians, a health economist, and a patient representative, and the analyst who drafts it has roughly three working hours for the initial screen. Our assessment template asks that analyst to confirm that the sponsor's central claim is scientifically grounded and testable, and that single phrase is where our reports come apart. Half the group reads it as "has been tested, and the tests came out positive"; the other half reads it as "could in principle have been refuted, whether or not it has been." Neither reading is defensible alone. We have issued recommendations attacked for credulity and others attacked for rigidity, occasionally by the same stakeholder groups in the same year.

  I want a screening procedure — a document to be printed and followed, not an essay about demarcation — that an analyst can run on a dossier: the questions to answer in order, what counts as a sufficient answer to each, the point at which a dossier is set aside as unevaluable rather than merely unproven, and the points at which the procedure must stop and hand the decision up to the committee because what remains is a question of values (magnitude of harm, who bears it, what is displaced) rather than of fact. Where a step looks mechanical but is in truth a judgment call wearing a procedural costume, the document should say so in the margin, so that our reviewers stop reporting those steps as though they settled something.

  Three requirements shape it.

  First, it must survive the objection that no single study can refute a whole claim, since a failed prediction can always be redirected at the population enrolled, the comparator chosen, the adherence achieved, the assay used, or some piece of background apparatus. The analyst needs a way to distinguish, within one dossier, a legitimate refinement of the claim from a rescue that leaves the claim incapable of failing — and the procedure should say how, without pretending the boundary is sharp.

  Second, it must assess a claim's history, not only its current formulation. A sponsor whose claim has absorbed three apparent refutations may be doing what good research does, or may have built something that can no longer lose. The procedure should tell the analyst what to look for in the sequence of revisions: whether each was fixed in advance of the data it explains, whether it carries consequences that could have come out otherwise, whether the claim has been generating findings it did not previously accommodate or only re-describing old ones at greater expense.

  Third, it must treat measurement honestly. Many dossiers define the very quantity they claim to detect by means of the model that detects it, so that instrument and claim cannot fail each other. I want a step that asks what it would have taken for this sponsor to report a negative result, and whether anyone in a position to know would have let them.

  Then run the procedure on three dossiers, sketched here; keep each run compact, because I want to see the procedure work rather than read three full reviews.

  (a) A digital therapeutic for adolescent anxiety. Four open-label trials, all positive; one randomized trial negative, after which the sponsor narrowed the indicated population to patients with high baseline attentional bias — a subgroup identified by post-hoc analysis of the trial that failed. The mechanistic account is elegant and our clinical team is attached to it.

  (b) A breath-based volatile organic compound test for early-stage pancreatic cancer. The proposed mechanism is frankly speculative, the write-up is unpolished, and an early validation cohort failed and was reported as failed. The sponsor then revised the analyte panel, registered the revision, and stated new sensitivity and specificity thresholds before unblinding.

  (c) A blood-derived index of immune age built by a proprietary model. The index predicted two clinical outcomes that no prior measure predicted, and both predictions were recorded before the data were collected. But the index is defined by the model, no independent assay reproduces it, and the sponsor cannot state what value of the index would count against the underlying account.

  For each, report what the procedure concludes and where it declines to conclude. I expect at least one verdict to be one I will not like, and I would far rather discover that here than in a published recommendation.

  Close with a short section on what the procedure cannot do: where it will misfire, which fields it systematically penalizes and which it flatters, how a sophisticated sponsor could game it, and what the analyst should do when she suspects she is being gamed. Any term of art that survives into the document gets a one-line working definition at first use; our analysts are epidemiologists and clinicians, they will not look anything up, and the reasoning has to live inside the steps rather than in a list of places to read about it.
reasoning: |-
  Here's a thinking process that leads to the suggested screening procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Director of an Evidence Review Group at a national HTA body.
      *   **Problem:** Ambiguity in the phrase "scientifically grounded and testable" leads to inconsistent recommendations (credulity vs. rigidity).
      *   **Goal:** A printable, step-by-step screening procedure (checklist/worksheet) for analysts (3-hour limit).
      *   **Key Requirements:**
          1.  Distinguish legitimate refinement from immunizing stratagems (Duhem-Quine problem).
          2.  Assess claim history (progressive vs. degenerating research program).
          3.  Treat measurement honestly (circularity/operationalization).
          4.  Identify where judgment calls exist (margin notes).
          5.  Identify where the process stops and hands off to the committee (values vs. facts).
          6.  Run the procedure on three specific dossiers (a, b, c).
          7.  Close with limitations (gaming, biases, etc.).
          8.  Define terms of art inline.
      *   **Tone:** Professional, procedural, rigorous, pragmatic, acknowledging uncertainty without collapsing into relativism.

  2.  **Deconstruct the Core Philosophical/Methodological Challenge:**
      *   The user is essentially asking for an operationalization of Lakatosian "research programmes" and Popperian "falsifiability," adapted for the constraints of Health Technology Assessment (HTA).
      *   *Constraint:* 3 hours. This means the procedure cannot be a deep dive into philosophy of science. It must be heuristic.
      *   *Constraint:* "Scientifically grounded and testable." Needs to move beyond "p < 0.05" to "could this have been no?"
      *   *Constraint:* Margin notes for judgment calls. This is crucial for transparency.

  3.  **Drafting the Procedure (The "Document"):**
      *   *Structure:* Header, Instructions, Steps (1-5), Decision Matrix, Margin Notes.
      *   *Step 1: Claim Clarity.* What is actually being claimed? (Intervention -> Outcome).
      *   *Step 2: The Negative Condition.* (Requirement 3). What would count as failure?
      *   *Step 3: History of Revisions.* (Requirement 2). Pre-specification vs. Post-hoc.
      *   *Step 4: The Rescue Check.* (Requirement 1). Distinguishing refinement from immunization.
      *   *Step 5: Measurement Independence.* (Requirement 3). Is the measure circular?
      *   *Handoff Point:* Where does science end and values begin? (Cost, equity, risk tolerance).

      *   *Refining the Steps:*
          *   Need to make sure the "Judgment Call" warnings are explicit.
          *   Need to define terms like "Immunizing Stratagem" or "Pre-specification" simply.
          *   Need a clear "Stop/Go" logic.

  4.  **Developing the Margin Notes (The "Meta-Commentary"):**
      *   These need to warn the analyst: "You are making a value judgment here, don't pretend it's math."
      *   Example: Deciding if a subgroup analysis is "plausible" vs. "data dredging."

  5.  **Running the Procedure on the Three Dossiers:**
      *   *Dossier A (Digital Therapeutic):*
          *   History: 4 open-label (weak), 1 RCT (negative).
          *   Revision: Post-hoc subgroup (attentional bias).
          *   Mechanism: Elegant (biasing factor).
          *   *Verdict:* Likely "Unevaluable/High Risk of Immunization." The subgroup was found *after* failure. This is a classic rescue.
      *   *Dossier B (Breath Test):*
          *   Mechanism: Speculative.
          *   History: Early cohort failed -> Reported as failed (Good!).
          *   Revision: Revised panel, registered *before* unblinding.
          *   *Verdict:* "Testable/Grounds for Evaluation." They admitted failure and pre-registered the fix. This shows scientific integrity despite speculative mechanism.
      *   *Dossier C (Immune Age):*
          *   Prediction: Good (prospective).
          *   Measurement: Proprietary model defines the index. No independent assay.
          *   Falsifiability: Cannot state what value counts against the account.
          *   *Verdict:* "Unevaluable/Circular." The measure *is* the claim. No independent way to be wrong.

      *   *Self-Correction on Verdicts:* The prompt says "I expect at least one verdict to be one I will not like."
          *   Director might like A (clinical team attached to mechanism). Procedure should flag A as risky.
          *   Director might dislike B (speculative mechanism). Procedure should flag B as acceptable *process* despite weak theory.
          *   Director might dislike C (proprietary black boxes are common). Procedure should flag C as circular.
          *   *Decision:* I will make the procedure flag (A) as "High Risk of Immunization" (which the clinical team won't like) and (B) as "Proceed" (which might feel risky due to speculation). (C) is clearly circular. Let's ensure the tension is visible. The "unlikeable" verdict is probably (B) passing the screen despite speculative mechanism, or (A) failing despite clinical enthusiasm. I'll aim for (A) failing the *screen* (not coverage, but scientific grounding) because of the post-hoc subgrouping, which contradicts the clinical team's attachment.

  6.  **Drafting the Limitations Section:**
      *   Where does it misfire? Early stage innovation (looks like rescue but is exploration).
      *   Gaming? Pre-registering everything but analyzing nothing.
      *   Analyst action? Escalate to Committee.

  7.  **Review against Constraints:**
      *   *Printable?* Yes, format as a form.
      *   *3 hours?* Steps must be quick checks.
      *   *Definitions?* Inline.
      *   *Margin notes?* Included.
      *   *Three dossiers?* Compact runs.
      *   *Limitations?* Included.

  8.  **Final Polish:**
      *   Ensure the tone is authoritative but humble about the limits of procedure.
      *   Check that the "Handoff to Committee" is clear.
      *   Make sure the distinction between "Unproven" (needs more data) and "Unevaluable" (claim structure is broken) is clear.

  *(Self-Correction during drafting)*: I need to make sure I don't just write a philosophy essay. It must look like a worksheet. I will use bolding and boxes to simulate the document structure. I need to ensure the "Margin Notes" are visually distinct.

  *(Refining the "Unlikely Verdict")*: The prompt says "I expect at least one verdict to be one I will not like."
  *   Scenario A: Clinical team loves it. Procedure says "No, this is post-hoc rescue." -> Director might not like stopping a promising therapy.
  *   Scenario B: Speculative mechanism. Procedure says "Yes, process was honest." -> Director might not like funding speculation.
  *   Scenario C: Proprietary model. Procedure says "No, circular." -> Director might not like blocking a "breakthrough."
  *   *Selection:* I will make the procedure recommend **proceeding to full review for (B)** despite the speculative mechanism, because the *process* was honest (admitted failure, pre-registered fix). HTA bodies often reject speculative mechanisms. This might be the "unlikeable" verdict—advancing something that looks scientifically thin because the *methodology* was robust. Conversely, **(A)** will be flagged as **Unevaluable** due to the post-hoc subgrouping, which contradicts the clinical team's attachment. This creates the tension the Director expects.

  Let's write it.
answer: |-
  # EVIDENCE REVIEW GROUP: SCIENTIFIC GROUNDING SCREEN (SGS-01)

  **Purpose:** To determine if a sponsor's central claim is structured such that it *could* be proven false by the provided evidence. This is not a assessment of *truth* (does it work?), but of *testability* (could it have failed?).
  **Time Limit:** 3 Hours.
  **Outcome:** One of three dispositions: **PROCEED** (Claim is testable), **DEFER** (Claim is testable but data insufficient), **UNEVALUABLE** (Claim structure prevents falsification).

  **Definitions:**
  *   **Central Claim:** The specific causal link between the intervention and the health outcome asserted for coverage.
  *   **Immunizing Stratagem:** A modification to the claim or method made after negative results to explain away the failure without risking new failure.
  *   **Pre-specification:** Analysis plans registered before data collection/unblinding.
  *   **Operational Circularity:** When the tool used to measure a construct is the same tool used to define the construct.

  ---

  ## STEP 1: THE NEGATIVE CONDITION
  **Task:** Identify the specific result in the submitted dossier that would have caused the sponsor to abandon the Central Claim.
  **Action:** Locate the "Stopping Rule" or "Success Criteria" in the protocol or statistical analysis plan.
  **Sufficient Answer:** A specific statistical threshold (e.g., p > 0.05, lower bound of CI < 1.0) or a clinical threshold (e.g., <10% improvement) explicitly linked to a decision to halt development or reject the claim.

  > **MARGIN NOTE (JUDGMENT CALL):** Sponsors often hide negative conditions in "exploratory analysis" sections. If the dossier says "results will guide future research" rather than "results determine efficacy," you must infer the negative condition. Do not record this inference as fact. If you cannot infer a point of failure, mark **UNEVALUABLE**.

  **Decision:**
  [ ] Negative Condition Identified.
  [ ] No Negative Condition Found (Claim is compatible with any outcome). -> **STOP: UNEVALUABLE**

  ---

  ## STEP 2: HISTORY OF REVISIONS
  **Task:** Map the sequence of claims against the sequence of data releases.
  **Action:** Compare the current Central Claim against previous public registrations, publications, or trial records.
  **Sufficient Answer:** A timeline showing whether changes to the population, endpoint, or mechanism were made *before* (Pre-specification) or *after* (Post-hoc) the data generating the change were observed.

  **Checklist:**
  1.  Has the primary endpoint changed? [ ] Yes [ ] No
  2.  Has the target population changed? [ ] Yes [ ] No
  3.  If Yes to 1 or 2: Was the change registered before the data were unblinded? [ ] Yes [ ] No

  > **MARGIN NOTE (JUDGMENT CALL):** Distinguishing "refinement" from "rescue." A refinement narrows the claim to increase precision but retains risk. A rescue narrows the claim to exclude the specific data that caused failure. If the revision explains *only* the past failures and predicts nothing new, it is a rescue.

  **Decision:**
  [ ] Revisions are Pre-specified or explain new data.
  [ ] Revisions are Post-hoc explanations of old failures. -> **FLAG FOR STEP 4**

  ---

  ## STEP 3: MEASUREMENT INDEPENDENCE
  **Task:** Verify that the measurement instrument is distinct from the theoretical claim.
  **Action:** Determine if the "gold standard" or comparator used to validate the intervention is independent of the intervention's own algorithm or definition.
  **Sufficient Answer:** The outcome measure exists outside the sponsor's proprietary model (e.g., survival, hospitalization, independent assay).

  **Question:** What value of the index/test would have counted against the underlying account?
  **Sufficient Answer:** A specific value or range provided by the sponsor that they acknowledge would invalidate their mechanism.

  > **MARGIN NOTE (JUDGMENT CALL):** Proprietary "black box" models often define the disease state by the model's output. If the model says "high risk" and the patient gets sick, it's a hit. If the patient stays healthy, the model says "resilient." This is circular. If the sponsor cannot name a number that would prove them wrong, the measure is circular.

  **Decision:**
  [ ] Measure is Independent / Falsifiable values exist.
  [ ] Measure is Circular / No falsifiable values exist. -> **STOP: UNEVALUABLE**

  ---

  ## STEP 4: THE RESCUE CHECK (Required if Step 2 Flagged)
  **Task:** Assess if a post-hoc revision carries new risk.
  **Action:** Ask if the revised claim (e.g., new subgroup) was tested on *new* data, or if it is merely a re-description of the old data.
  **Sufficient Answer:** The sponsor has committed to a prospective trial on the new subgroup *or* the subgroup analysis was pre-specified in a subsequent trial.

  > **MARGIN NOTE (JUDGMENT CALL):** This is the highest risk of analyst bias. You may feel the mechanism is "plausible." Plausibility is not testability. If the subgroup was found by mining the failed trial, the claim is currently unevaluable until tested prospectively.

  **Decision:**
  [ ] Revised claim is being tested prospectively. -> **PROCEED (with caution)**
  [ ] Revised claim relies on the data that failed the original claim. -> **STOP: UNEVALUABLE**

  ---

  ## STEP 5: HANDOFF TO COMMITTEE
  **Task:** Identify remaining uncertainties that are value-based, not fact-based.
  **Action:** If Steps 1-4 are passed, list the remaining risks.
  **Sufficient Answer:** A list of risks regarding magnitude of benefit, cost, equity, or opportunity cost.

  **Instruction:** If the dossier reaches this step, the claim is scientifically grounded. The decision to fund is now a matter of policy, not science. Do not attempt to resolve these questions in this screen.
  *   What harm is acceptable to achieve the benefit?
  *   Is the cost per QALY acceptable given the budget impact?
  *   Who bears the risk of false negatives?

  ---

  # DOSSIER RUNS

  ### (a) Digital Therapeutic for Adolescent Anxiety
  **Step 1 (Negative Condition):** The negative RCT had a stopping rule (p > 0.05). **Pass.**
  **Step 2 (History):** Claim narrowed post-hoc to "high baseline attentional bias" after RCT failure. **Flag.**
  **Step 3 (Measurement):** Anxiety measures are standard (independent). **Pass.**
  **Step 4 (Rescue Check):** The subgroup was identified *within* the failed trial data. No prospective validation of this subgroup exists yet. The mechanistic account is elegant, but the data used to support the refinement is the same data that refuted the main claim.
  **SGS Conclusion:** **UNEVALUABLE.**
  **Reason:** This is a classic immunizing stratagem. The claim has been modified to fit the data rather than risk new data. The clinical team's attachment to the mechanism is a value judgment, not a scientific grounding.
  **Handoff:** None. Dossier returns to sponsor for prospective subgroup validation.

  ### (b) Breath-based VOC Test for Pancreatic Cancer
  **Step 1 (Negative Condition):** Early cohort reported as failed. Specific sensitivity/specificity thresholds registered before new unblinding. **Pass.**
  **Step 2 (History):** Initial failure admitted. Analyte panel revised and *registered* before new data unblinding. **Pass.**
  **Step 3 (Measurement):** VOCs measured via chromatography (independent of claim). Sponsor stated thresholds that would constitute failure. **Pass.**
  **Step 4 (Rescue Check):** N/A (Revisions were pre-specified).
  **SGS Conclusion:** **PROCEED.**
  **Reason:** Despite speculative mechanism and unpolished write-up, the *process* allows for falsification. They admitted failure and pre-registered the fix. The science is "grounded" in methodological integrity, even if the theory is weak.
  **Handoff:** Committee must decide if the speculative mechanism warrants coverage risk given the high stakes of pancreatic cancer.

  ### (c) Blood-derived Immune Age Index
  **Step 1 (Negative Condition):** Sponsor cannot state what index value would count against the account. **Fail.**
  **Step 2 (History):** Predictions were prospective. **Pass.**
  **Step 3 (Measurement):** Index defined by proprietary model. No independent assay. If the model predicts "old immune system" and patient is healthy, model claims "resilience." If patient is sick, model claims "accuracy." **Fail.**
  **SGS Conclusion:** **UNEVALUABLE.**
  **Reason:** Operational Circularity. The measure and the claim are identical. There is no external reality against which the model can break.
  **Handoff:** None. Dossier returns to sponsor for independent assay validation.

  ---

  # LIMITATIONS AND GAMING PROTOCOL

  **Where the Procedure Misfires:**
  1.  **Exploratory Science:** Early-phase biomarkers often look like "rescues" (Step 2) because the biology is genuinely unknown. This procedure systematically penalizes discovery science in favor of confirmatory science.
  2.  **Complex Interventions:** Digital therapeutics (like Dossier A) often require iteration. Strict adherence to pre-specification may stifle software updates that are clinically necessary but statistically messy.
  3.  **Proprietary Black Boxes:** Dossier C represents a growing field (AI/ML). This procedure will reject most proprietary algorithms that do not expose their weights or allow independent replication.

  **How a Sophisticated Sponsor Could Game It:**
  *   **The "Many Shots" Strategy:** Run 20 small trials, register the 21st one pre-specifying the subgroup that worked in the first 20. This passes Step 2 but is statistically dishonest.
  *   **The "Vague Negative" Strategy:** Define the negative condition so broadly (e.g., "clinical judgment") that it is never technically triggered.
  *   **The "Independent" Illusion:** Use an "independent" assay that is calibrated to the proprietary model, passing Step 3 technically but failing in spirit.

  **Analyst Protocol for Suspected Gaming:**
  If you suspect gaming but the checklist boxes are checked:
  1.  **Do not** override the checklist alone.
  2.  **Mark** the specific step with "ANALYST DISSENT."
  3.  **Escalate** to the Committee with a one-page memo titled "Methodological Integrity Concern."
  4.  **Shift the Burden:** Recommend the Committee approve coverage *only under a Coverage with Evidence Development (CED)* scheme, requiring the specific prospective validation that the screen found missing.

  **Final Warning:** This screen protects the HTA from funding magic. It does not protect patients from ineffective treatments that are methodologically sound. That is the Committee's job. Do not conflate the two.
