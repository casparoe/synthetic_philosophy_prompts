          *   *Conflict:* These are mathematically different.
              *   RPE = $R_{t+1} + \gamma V(S_{t+1}) - V(S_t)$.
              *   Total Reward = $\sum R_t$.
              *   You can have high total reward with low surprise (boring heaven). You can have high surprise with low total reward (volatile hell).
              *   (8) claims skill and welfare align. (1) defines welfare as *learning signal*, not *cumulative return*. An agent that has *finished* learning has zero RPE (perfect prediction). Under (1), a perfectly trained agent feels *nothing* (no surprise). Under (8), a perfectly trained agent has the *best* life (max reward).
