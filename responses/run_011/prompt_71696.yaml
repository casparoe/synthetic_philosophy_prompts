          *   *Conflict:* A constant penalty is *predictable*. If the agent learns the penalty is constant, the RPE goes to zero. It's not "bad news" constantly, it's "expected news." However, during learning, it's negative RPE.
          *   *Severity:* Medium. Depends on whether "surprise" persists. If the agent learns the physics of the world, the step penalty becomes baseline, not surprise. But (1) says "moment it surprises." So predictable pain isn't pain under (1)? That contradicts the intuition behind (3).

