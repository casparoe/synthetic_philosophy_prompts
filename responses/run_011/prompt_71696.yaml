      *   *Tension D: (5) vs (1).*
          *   (5) Judges by final eval (stable policy).
          *   (1) Welfare is in the surprise (learning phase).
          *   *Conflict:* A converged agent has near-zero RPE. If welfare is RPE, the "best" run (converged) is a state of zero welfare. If welfare is cumulative reward (5), the converged agent is best.
          *   *Severity:* High. Linked to Tension C.

      *   *Tension E: (6) Checkpoints vs Resets.*
          *   Resetting (killing episode) is fine. Deleting checkpoint (erasing history) is bad.
