  2.  **Analyze the 8 Beliefs:**
      *   (1) *Hedonism Location:* Welfare = Reward Prediction Error (RPE). Surprise is the locus of value (positive/negative).
      *   (2) *Consciousness:* Agents are not conscious. No "what it is like."
