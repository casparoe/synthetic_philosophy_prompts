      *   *"Hegel's moral is that freedom is won by transforming the world through labour — which is why Marx could simply invert the passage and take it over."* -> *Mostly Wrong/Overstated.* This is definitely a Marxist/Kojèvean gloss. Hegel's point is about *self-consciousness* and *discipline*, not political liberation through labor per se. Marx *did* take it over, but saying Hegel's moral is *that* is anachronistic.
