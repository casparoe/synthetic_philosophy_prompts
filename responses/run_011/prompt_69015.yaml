      *   *Resolution:* The system must value *Awareness* over *Action*. If the system is about learning/truth, then Case 3 has learned (no more lesson needed). Case 4 hasn't (lesson needed).
      *   *Sacrifice:* If we must choose, Case 4 is the harder sell in a "fair" system. If the universe is a school, punishing the student who already passed the test (3) makes the universe cruel. Punishing the student who skipped class (4) makes it strict.
      *   *Recommendation:* Keep 3 and 4 as is, but ground them in *Truth Integration*, not *Punishment*. If that fails, drop 4. It's more satisfying narratively if the forgetful man escapes, but the user feels he shouldn't. I need to validate that intuition. Actually, the user says "I think this one is deserved." I need to justify why.
      *   *Wait, looking closer:* The user says Case 3 feels *unjust*. Case 4 feels *deserved*. This is the key. The system must prioritize *Truth* over *Comfort*.
      *   *Verdict:* Keep both. The principle is "The Ledger demands Truth, not Pain." Pain is just the tool used when Truth is absent.

  5.  **Address Rebirth vs. Single Life:**
      *   Case 1 (dies at 83 prosperous) needs balancing. If single life, the system is broken.
      *   Case 8 (child born with disease) *requires* past life causality.
      *   *Conclusion:* Rebirth is mechanically necessary for the user's specific cases (1 & 8). A single-life ledger cannot balance Case 1 without making the universe look random/broken.

  6.  **Address "Moral Desert Outside the Book":**
      *   This is a dangerous question. A mechanical karma system is generally morally repugnant in the real world (victim blaming, justifying suffering).
      *   *Honest Answer:* It works as fiction (theodicy), but fails as ethics. In reality, suffering is often random. Claiming a sick child "deserves" it is harmful. The book can explore this tension (Case 8), but the theory shouldn't be exported.

  7.  **Drafting the Principles (The "Code"):**
