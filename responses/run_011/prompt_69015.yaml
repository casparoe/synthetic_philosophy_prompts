  2.  **Deconstruct the Moral Intuitions:**
      *   *Case 3 vs. Case 4:* This is the crux. The user feels the repentant sinner (3) *shouldn't* suffer, but the forgetful sinner (4) *should*. This implies Karma isn't just about "balance of pain" but about "integration of truth."
      *   *Case 2 vs. Case 5:* External restitution isn't enough; internal state matters. But Case 2 didn't specify internal state, just "paying back." The user now feels Case 5 (no internal change) leaves the ledger open. This suggests *Intent/Truth* matters more than *Action/Restitution*.
      *   *Case 1:* Evil must be balanced eventually. No loose ends.
      *   *Case 6:* Moral Luck. The user wants the machine to treat them equally (intent), but the reader to feel the difference (consequence). This suggests a split between *Karmic Debt* (intent) and *Karmic Weight* (consequence).
      *   *Case 8:* The child. The user wants the mechanic to be true (it *is* past life karma) but the *interpretation* of it as "desert" to be villainous. This requires a separation between *Causality* and *Judgment*.

  3.  **Develop a Coherent System (The "Physics" of this Karma):**
