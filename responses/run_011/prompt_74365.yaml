prompt: |-
  You are a philosopher of economics and of action theory who has spent enough time in rooms with machine-learning teams to know what their models are actually measuring. Please think carefully and treat this as a specification-writing task, not a literature survey.

  I am a software engineer with no formal philosophy training. I do know probability, expected-utility maximization as it is taught in an ML course, and optimization. Define every technical term on first use, in plain language.

  Background. My team builds a system that infers what users want from logged choices — clicks, purchases, accepts, declines — and converts that into a scalar score used to rank items and, in some flows, to act on the user's behalf. The word "preference" is load-bearing in every design document we write, and three people on the team mean three different things by it. Our economist consultant says a preference just is what choice reveals, so there is nothing further to measure and the logs already contain everything there is to contain. Our designer says users often have no settled preference until we show them a slate, so what we log records our interface at least as much as it records them. Our legal reviewer wants to know when we may decline to honor a choice the user demonstrably made. Nobody has said what would settle the dispute, and I would rather have the specification in hand before I start reading theories of preference.

  Deliverable: the desiderata — the requirements any theory of preference-as-inferred-from-observable-choice must meet to serve as the foundation for a system like ours. For each requirement give (a) a one-sentence statement, (b) the concrete case, argument, or product consideration behind it — a scenario I would recognize in a log, not a slogan, (c) your verdict on whether it is non-negotiable or is a prejudice of one camp, and (d) what it costs a theory to satisfy it.

  The list must cover, at minimum:

  - Cases the theory has to get right. A user whose choices are detectably intransitive — our economist says an agent like that can be "money-pumped," and I want to know whether that is a reason to demand transitivity of the preferences we attribute, or a reason to demand something else. Menu-dependence: what a user takes changes because of what else was on the slate (the last of two items gets taken; the same item on a six-item list does not). The strategic user who is gaming the recommender rather than expressing anything. And preference change, where the theory must let us distinguish "the user's preferences changed" from "we learned more about preferences that were there all along."
  - Distinctions the theory may not collapse: preference versus choice; ordinal versus cardinal; descriptive attribution versus normative endorsement; having a preference versus how strong it is.
  - At least one evidential requirement: what would count as evidence that an attribution is wrong, given that we only ever observe choices through an interface we control, and our own ranking shaped the menus in the log.
  - At least one requirement about the scalar: if the number is merely ordinal per user, what — if anything — licenses comparing or summing it across users, since our product ranks globally.
  - A requirement about extrapolation. Our economist mentioned results that characterize exactly when a finite log of choices is consistent with utility maximization (he said "Afriat's theorem" and "GARP"). Say what a theory must deliver in order to predict choices over options the user has never been shown, and what finite-data results of that kind do and do not license there.

  Then tell me which requirements are jointly unsatisfiable. I suspect a real tension between making preference operational — defined by choice, hence checkable against logs — and making it contentful, in the sense that a theory can be wrong about what someone prefers. If that pair, or any other subset, cannot be satisfied together, argue for the claim rather than asserting it, and say which requirement has to give. Finish that section by naming the single requirement that knocks out the most candidate theories, and say why.

  Before the list, show your brainstorming: generate roughly twice as many candidate requirements as you will keep, then prune, with one line on why each cut was cut. After the list, add a short scorecard — a few lines each — on how the classic revealed-preference program, a view on which preference is a latent psychological state distinct from behavior, and a preference-construction view fare against the requirements. Keep the scorecard brief; the requirements are the point.

  No bibliography, no citations, no paper titles. Naming a well-known thinker or a named result is fine, but do not invent attributions and do not send me off to look anything up.
