answer: |-
  You have carved out a real distinction. You are right to set aside hindsight bias (which concerns *outcomes*) and choice blindness (which concerns *preferences*). You are describing a failure of **diachronic self-knowledge** specifically regarding the *semantic content* of past first-person reports.

  There is no single, universally standardized noun for this exact configuration, but there is a clear neighborhood. Here is the mapping, the departure, and the coinage.

  ### The Closest Neighbor: Consistency Bias
  In cognitive psychology, the nearest established term is **Consistency Bias** (sometimes *Attitude Consistency Bias*). This is the tendency to reconstruct past attitudes, beliefs, and feelings as similar to present ones.

  **Where your carving departs:**
  Standard Consistency Bias describes a *memory failure*. The subject forgets what they thought and fills the gap with their current view.
  Your phenomenon describes a *hermeneutic shift*. The subject does not forget the record (the notebook, the transcript); they **reinterpret its semantic value**.
  *   **Consistency Bias:** "I don't remember what I wrote, but I probably thought X."
  *   **Your Phenomenon:** "I see what I wrote, but clearly, I meant X when I wrote Y."

  The mechanism isn't just filling a gap; it is actively overriding an externalized data point (the record) with an internal model of the self, without experiencing the friction of contradiction.

  ### The Mechanism: Confabulation + Narrative Identity
  Mechanistically, this sits on **Confabulation** (generating false accounts without intent to deceive) but is stabilized by what Daniel Dennett calls the **Center of Narrative Gravity**. The brain prioritizes a coherent self-narrative over archival fidelity. When the archive (notebook) threatens the narrative (current self-model), the archive is semantically drift-adjusted to fit the narrative.

  ### The Coinage: Introspective Retcon
  Since "Consistency Bias" misses the active reinterpretation of existing evidence, and "Confabulation" sounds pathological, I propose the term **Introspective Retcon** (formalized as **Diachronic Phenomenological Alignment**).

  **Definition:**
  *Introspective Retcon* is the unconscious revision of the meaning of one's past first-person reports to align with current phenomenological states, such that the revision is experienced not as a correction, but as a clarification of original intent.

  **Boundary Conditions (The Carving):**

  1.  **Does it count without a record?**
      *   **No.** Without an external record (notebook, video, transcript), this collapses into standard **Consistency Bias** or **Reconstructive Memory**. The specific phenomenon you identified requires the *tension* between the internal memory and the external artifact. The "Retcon" is the act of resolving that tension by changing the meaning of the artifact rather than the self-model.
      *   *Why this matters:* In your notebook example, the anomaly was the *ink on the page*. Without the ink, it's just a fuzzy memory. With the ink, it's a semantic override.

  2.  **Does it count if the person knows they're doing it?**
      *   **No.** If the person is aware they are redefining their past words to save face or maintain coherence, it is **Rationalization** or **Dishonesty**.
      *   *The Crucial Marker:* The phenomenological "feel" must be one of *recall*, not *revision*. As you noted: "From the inside it doesn't feel like a correction." If they feel the friction of changing their mind, it is not Introspective Retcon; it is Belief Updating. Introspective Retcon is defined by the *absence of felt change*.

  ### Summary for your files
  *   **Genus:** Reconstructive Memory / Consistency Bias.
  *   **Species:** **Introspective Retcon** (Diachronic Phenomenological Alignment).
  *   **Diagnostic:** Presence of contradictory external record + Reinterpretation of record's meaning + Absence of felt correction.
  *   **Philosophical Weight:** It suggests that first-person authority is not a direct line to past mental states, but a current-state narrative projection that treats past reports as *texts to be interpreted* rather than *data to be read*.

  You are observing the moment the "Center of Narrative Gravity" exerts enough pull to bend the light of past evidence. It is not lying; it is the maintenance of a unified self-model at the expense of historical accuracy.
