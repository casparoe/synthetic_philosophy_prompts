answer: |-
  This is an excellent set of questions. You have grasped the core tension of post-Lewis philosophy of conditionals, but there are a few nuances in your interpretation that need tightening to make the picture coherent.

  Here is a sanity check on your understanding, followed by resolutions to the two specific problems you raised (the content distinction and Modus Ponens).

  ### 1. The Sanity Check: Triviality and Propositions

  **Your Understanding:** *Since $P(A \to C) = P(C|A)$ leads to triviality, indicatives don't express propositions, have no truth conditions, and having a credence in them is a mistake.*

  **The Verdict:** **Mostly Correct, with one major nuance.**

  *   **The Triviality Result:** You are right. Lewis (1976) showed that if conditionals are propositions (have truth conditions) *and* their probability equals the conditional probability (Adams's Thesis), then all probability functions collapse (are trivial).
  *   **The Conclusion:** Most philosophers (following Lewis, Gibbard, and Edgington) accept **Non-Propositionalism**. Indicative conditionals do not express propositions that can be true or false in the standard sense. They are not "facts" about the world.
  *   **The Nuance on Credence:** It is **not** a mistake to have a credence in an indicative, provided you understand what that credence is. It is not a belief *that* a proposition is true. It is a **conditional belief**. To say "I assign 0.9 probability to 'If A, C'" is just to say "My conditional probability $P(C|A)$ is 0.9." You aren't measuring the likelihood of a truth-condition; you are measuring the strength of the inferential link in your belief system.

  **Counterfactuals:** You are also right that Lewis treated counterfactuals differently (via similarity ordering of possible worlds). They *are* truth-conditional in his framework. However, note that triviality results *can* be generated for counterfactuals too if one insists their probability must match conditional probability. But standard Lewisian semantics treats them as quantified statements over worlds ("In all closest A-worlds, C is true"), which are propositions.

  ### 2. Problem One: Content and the Indicative/Counterfactual Distinction

  **Your Worry:** *If indicatives aren't truth-conditional and counterfactuals are, do they differ in content? Is it just grammar?*

  **The Resolution:** They are not the same claim with different mood marking. They perform fundamentally different cognitive tasks.

  In the non-propositional view (Suppositionalism/Expressivism), the difference is not just grammatical; it is **functional**.

  *   **Indicatives (Epistemic):** These are tools for managing uncertainty within your *actual* information state. They follow the **Ramsey Test**: To evaluate "If A, C," you hypothetically add A to your stock of knowledge and see if C follows. They are about *evidence*.
  *   **Counterfactuals (Metaphysical/Causal):** These are tools for evaluating how the world *would be* under different circumstances. They look at *nearby possible worlds*. They are about *causation and similarity*.

  **Your Lab Example:**
  > *Scenario:* We know the tech mislabeled the vials.
  > *Speaker 1 (Indicative):* "If the tech didn't mislabel the vials, the contamination came from the water supply."
  > *Speaker 2 (Counterfactual):* "If the tech hadn't mislabelled the vials, the contamination would have come from the water supply."

  In your scenario (where we know the antecedent is false), **Speaker 1 is speaking infelicitously.**
  *   **Indicatives** generally presuppose that the antecedent is epistemically possible (open). If you know $\neg A$, asserting $A \to C$ is usually a pragmatic error (or, on some views, vacuously true but uninformative).
  *   **Counterfactuals** are designed for known-false antecedents.

  So, are they the same claim? **No.**
  *   The Counterfactual claims that in the nearest possible world where the tech is competent, the water is the cause. This has a truth value (True or False).
  *   The Indicative, in this context, fails to get off the ground. If used in a context where the antecedent is *unknown*, it claims that the evidence for the tech's competence raises the probability of water contamination.

  If you adopt the non-propositional view, the "content" of the indicative isn't a state of affairs; it's a **constraint on belief revision**. The "content" of the counterfactual is a **state of affairs in modal space**. They are different kinds of beasts entirely, not just the same beast in different clothing.

  ### 3. Problem Two: Modus Ponens without Truth

  **Your Worry:** *If indicatives have no truth value, how can Modus Ponens (MP) be valid? Validity is usually truth-preservation.*

  **The Resolution:** You must change your definition of validity.

  If conditionals aren't truth-apt, classical logic (which is defined over truth values) doesn't apply directly. Instead, we move to **Probabilistic Validity** (associated with Ernest Adams).

  *   **Classical Validity:** An argument is valid if there is no case where the premises are True and the conclusion False.
  *   **Adams Validity:** An argument is valid if **uncertainty is preserved**. Specifically, the uncertainty of the conclusion cannot exceed the sum of the uncertainties of the premises.

  **How MP works here:**
  1.  Premise 1: $A$ (Degree of belief: 1.0)
  2.  Premise 2: If $A$, then $C$ (Conditional degree of belief $P(C|A)$: 1.0)
  3.  Conclusion: $C$

  If you are certain of $A$, and you are certain that *given* $A$, $C$ follows, then you must be certain of $C$. You don't need "Truth" to make this work; you just need **coherence in betting odds**. If you bet on $A$, and you bet on "If $A$ then $C$," coherence requires you to bet on $C$.

  **Alternative View: Dynamic Semantics**
  Another way to save MP without truth conditions is **Dynamic Semantics** (e.g., Veltman, Gillies).
  *   Here, sentences aren't true/false; they are **update instructions**.
  *   $A$ instructs: "Delete all worlds where A is false."
  *   If $A \to C$ instructs: "If you were to delete all non-A worlds, you would be forced to delete all non-C worlds."
  *   MP is valid because performing the update for $A$ followed by the update for $A \to C$ results in an information state where $C$ is accepted. Validity is about **information growth**, not truth preservation.

  ### Summary for your Project

  If you are building a theory on this, here is the stable platform you can stand on:

  1.  **Lewis is Right on Triviality:** You cannot treat indicatives as standard propositions if you want to maintain $P(\text{If } A, C) = P(C|A)$.
  2.  **Adams is Right on Logic:** Logic for indicatives is not about truth-preservation, but about **probability-preservation** (or uncertainty minimization).
  3.  **The Distinction is Real:** Indicatives and Counterfactuals are not the same content with different tense. Indicatives are **epistemic constraints** (non-truth-conditional); Counterfactuals are **modal descriptions** (truth-conditional).
  4.  **The Lab Case:** In your specific example (where the antecedent is known false), the indicative is pragmatically defective, while the counterfactual is the appropriate truth-apt claim. This proves they are not interchangeable.

  **One Caveat to Watch Out For:**
  Be aware of **Contextualism** (e.g., Kratzer). Some philosophers argue Lewis's triviality can be avoided if the conditional proposition expressed changes depending on the context (the "modal base"). If you go the Non-Propositional route (which your query suggests you prefer), you must explicitly reject Contextualist solutions to triviality.

  Your intuition that "it's a mistake to say you have a credence in one" is the only part I would soften. It's not a mistake to have a credence, provided you analyze that credence as a *conditional probability* rather than a *belief in a truth*.
