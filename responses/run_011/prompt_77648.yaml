answer: |-
  The 1973 APA decision is typically narrated as a triumph of civil rights over medical prejudice. When viewed through the lens of the naturalism/normativism debate, however, it becomes a stress test for the claim that psychiatric taxonomy tracks objective biological facts. To take the naturalist side seriously—specifically the Boorse-style biostatistical theory—we must accept its core premise: health is statistically typical functional efficiency relative to species design, with survival and reproduction as the ultimate biological goals. Disease is a value-free identification of dysfunction; "illness" is the value-laden judgment that the dysfunction is harmful.

  **The Naturalist Prediction**
  On a strict Boorsean account, the 1973 decision should not have happened, or at least not for the reasons it did. Exclusive homosexuality presents a clear statistical deviation from the species-typical design regarding sexual behavior. More critically, it entails a reduction in reproductive efficiency. If the biological function of the sexual mechanism is reproduction, then a orientation that precludes reproduction is, by definition, a subnormal part-function. It is a dysfunction.

  Therefore, a consistent naturalist taxonomy in 1973 predicts **retention**. The biological facts regarding reproduction and statistical typicality did not change between 1972 and 1974. No new data emerged regarding the hypothalamus, genetics, or hormonal profiles that would reclassify the trait from "dysfunctional" to "functional." Consequently, the naturalist framework predicts that the diagnosis should remain until biological evidence suggests the trait is not a dysfunction. It certainly does not predict **deletion** based on social protest, a masked panelist, or a membership vote.

  This creates an immediate and sharp tension. The historical record shows the category was removed not because the *biology* was re-evaluated, but because the *social cost* of the label was re-evaluated. The naturalist framework is silent on the protests, the referendum, and the timing. It has no vocabulary to process a board vote as a valid mechanism for establishing biological truth. To the naturalist, the 1973 decision looks like a category error: a political adjustment mislabeled as a medical correction. The deletion implies that the "dysfunction" was never biological, but social. If the diagnosis was removed because gay people could function well in society and were not inherently distressed, the criterion for disorder shifted from *organismic efficiency* to *social adaptation and subjective well-being*.

  **Spitzer's Rationale and the Normativist Shift**
  Robert Spitzer's rationale for the removal commits him to a position that undermines strict naturalism. He argued that homosexuality *per se* did not meet the definition of a psychiatric disorder because it was not regularly associated with distress or generalized impairment.

  This is a decisive move toward normativism. In a Boorsean world, a dysfunction can exist without distress (e.g., asymptomatic hypertension). The dysfunction is the fact; the distress is the value layer. By making the absence of distress and impairment the *condition* for removing the diagnosis, Spitzer effectively collapsed the distinction between disease (fact) and illness (value). He established that a statistical deviation in reproductive function does not count as a mental disorder unless it causes harm to the individual.

  This commits Spitzer to the view that the "disorder" status of a condition is contingent on its interaction with the environment and the subject's evaluation of it, not merely its internal biological statistics. It admits that the medicalization of homosexuality was an error of valuation, not an error of fact-finding. If naturalism were true, the activists were wrong to demand removal based on dignity; they should have had to prove reproductive efficiency. Instead, the APA accepted that social harm and subjective distress are the constitutive elements of mental disorder, not biological dysfunction alone.

  **Ego-Dystonic Homosexuality: Concession or Residue?**
  The compromise diagnosis of "ego-dystonic homosexuality," which appeared in DSM-III, serves as a fascinating hybrid. It classified individuals as disordered only if they were distressed by their orientation and wished to change it.

  From a **normativist** perspective, this reads as a political concession. It preserved a pathway for treatment for those conflicted by religious or social stigma without validating the stigma as biological fact. It acknowledged that the "sickness" was not the desire, but the conflict between the desire and the social/moral environment. It protected the normativist claim that disorder requires harm: if you are happy being gay, you are healthy; if you are miserable, you have a condition (the misery/conflict).

  From a **naturalist** perspective, this can be absorbed as a residue. A naturalist can argue that the *distress* and the *psychological conflict* constitute the genuine dysfunction. The sexual orientation itself might be a statistical anomaly, but the inability to integrate one's drives with one's self-concept is a failure of psychological functioning. Here, the naturalist saves the theory by relocating the dysfunction from the *object* of desire to the *processing* of desire. However, this is a retreat. It concedes that the orientation itself is not the disease, which undermines the original reproductive-efficiency argument. It turns the diagnosis into a measure of internal harmony rather than species-typical design.

  **Impact on the Positions**
  The 1973 episode functions as a **confirmation** for normativism and an **anomaly** for strict naturalism.

  For the **normativist**, the sequence confirms that psychiatric taxonomy is inextricably linked to social values. The change occurred because the values of the profession and the culture shifted, not because the nature of homosexuality changed. The mechanism of change—a referendum—is proof that the boundary of "mental disorder" is a negotiated social line, not a discovered natural kind. The normativist anticipated that changes in social tolerance would alter diagnostic boundaries.

  For the **naturalist**, the episode is an anomaly that threatens the theory's explanatory power. The theory claims to describe how medicine *does* and *should* categorize dysfunction based on biological facts. Yet, the most famous change in psychiatric history was driven by politics, not biology. The naturalist is forced into an awkward position: either admit that the 1973 decision was scientifically incorrect (homosexuality *is* a dysfunction, regardless of the vote), or admit that the definition of "mental disorder" in psychiatry does not actually follow biostatistical rules. If they choose the latter, they concede that psychiatry is not practicing naturalist medicine in these instances. If they choose the former, they render the theory irrelevant to actual clinical practice.

  Furthermore, where the framework has nothing to say, it must remain silent. Naturalism has no account for the "Dr. H. Anonymous" panel. It has no account for the referendum. It cannot explain why the change happened in 1973 rather than 1963 or 1983, because the biological constants remained the same. To explain the timing, one must leave naturalism and enter sociology.

  **Conclusion**
  The 1973 decision exposes the limit of the biostatistical account in psychiatry. If disease were purely a matter of subnormal function relative to species design, the vote would be irrelevant. The fact that the vote was decisive proves that the "dysfunction" was not primarily biological. Spitzer's rationale codified this by making distress a necessary condition for disorder, effectively prioritizing the normativist requirement of harm over the naturalist requirement of statistical deviation. Ego-dystonic homosexuality was the scaffolding left behind during this transition—a way to treat the suffering caused by stigma without pathologizing the trait that attracted the stigma. Ultimately, the episode suggests that in psychiatry, the "lab coat" does not merely cover politics; in many cases, the politics determine what the lab coat is allowed to measure.
