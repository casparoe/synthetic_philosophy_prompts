      *   *Spitzer's Move:* He shifted the goalposts. From "reproductive function" to "distress/impairment." This is a normative shift. It admits that biology alone doesn't dictate diagnosis.
      *   *Ego-Dystonic:* Is it a residue? It isolates the *harm* (distress) from the *trait* (orientation). Naturalists can accept distress as a dysfunction. Normativists see it as managing social conflict.
