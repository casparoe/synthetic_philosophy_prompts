      *   *The Logic of §4:* The argument relies on the transmission of sensitivity through deduction.
      *   *Standard Nozick Problem:* Sensitivity isn't closed. $p$ (hands) is sensitive. $q$ ($\neg \text{BIV}$) is entailed. $p \to q$. In nearest $\neg q$ world (BIV world), $p$ is false. But I still believe $p$ (hallucinating hands). So I still believe $q$. So $q$ is insensitive.
