  **The pantoum**

  The envelope comes without a name.
  The paper waits inside the drawer.
  The matches wait beside the desk.
  The ink dries black on the sheet.

  The paper waits inside the drawer.
  The days pile up while I type.
  The ink dries black on the sheet.
  I send what I can send.

  The days pile up while I type.
  The postman takes what I give.
  I send what I can send.
  My hand shakes but the address holds.

  The postman takes what I give.
  The matches wait beside the desk.
  My hand shakes but the address holds.
  The envelope comes without a name.

  **Notes on the choices**

  The recurring lines constitute the settled history, the external time that admits no revision, while the new lines in each stanza track the narrator's personal time, the lived sequence of aging and labor. In the final stanza, every line is a recurrence, which enacts the closure of the circle; personal experience collapses into the fixed record, leaving no new material to suggest branching or escape. This structural tightening mirrors the metaphysical status of the bootstrap case: the history is consistent, yet the origin remains unaccounted for.

  The word "can" appears twice within the recurring line "I send what I can send." In the second stanza, the sense is local ability; she has the capacity to mail the packet. In the third stanza, the sense shifts to compossibility; given that the postman takes it and the history is settled, she sends only what is compatible with the facts. If these senses were collapsed, the poem would lose the tension between her feeling of agency and the necessity of the loop. The poem registers consistency through the physical continuity of the paper and ink, but it registers the unexplained nature of the loop in the first line, "The envelope comes without a name." This line is load-bearing for the mystery, asserting the absence of an author without invoking forbidden abstractions.

  A critic might object that I have traded on mere ambiguity in "can" rather than genuine context-sensitivity. I resist this by noting that the modal base shifts from the agent's powers in the second stanza to the factual constraints in the third. The surrounding lines alter the truth conditions without altering the words. I rejected a recurring line reading "The future sleeps inside the box" because it violates the prohibition on abstract temporal furniture. The diction must remain domestic to ground the metaphysics in the physical act of mailing, ensuring the reader feels the weight of the paper rather than the theory behind it.
