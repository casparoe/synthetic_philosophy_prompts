      *   *Hypothesis 2 (Senses of "Law"):* Also strong. Hempel's "laws" were often trivial regularities. Critics wanted robust scientific laws.
      *   *Hypothesis 3 (Toy cases vs. Real history):* Very strong. Hempel looked at logic; Historians looked at archives. Philosophers looked at philosophers.

  4.  **Formulate the Diagnosis:**
      *   It wasn't *just* one thing. It was a "category clash" exacerbated by methodological isolation.
      *   *Core Diagnosis:* It was a **methodological mismatch disguised as a logical dispute**. Hempel was doing normative philosophy of science (how history *ought* to work to be rational); Dray et al. were doing descriptive phenomenology of historical practice (how history *does* work to be meaningful).
      *   *The "Law" ambiguity:* Crucial. Hempel's "trivial laws" (e.g., "people act to achieve ends") satisfied the logical form but failed the scientific spirit. Critics attacked the scientific spirit, Hempel defended the logical form. They talked past each other.
