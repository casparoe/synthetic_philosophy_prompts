      *   *Dray/Winch/Oakeshott:* History is about understanding agents, reasons, narratives. Unique events. "How possibly?" vs. "Why necessarily?".
      *   *The "End":* No knockout blow. Hempel retreated to "explanation sketches." The field moved to narrative (Ricoeur, White) and metaphysics (causation, counterfactuals).

  3.  **Evaluate the User's Hypotheses:**
