answer: |-
  Your hunch is largely correct, and your frustration is shared by many who look back on that period. The Hempel–Dray debate did not end because one side proved the other wrong; it ended because the intellectual ecosystem that made the debate possible collapsed beneath them.

  To answer your specific question: this was not a substantive disagreement about a single object of inquiry. It was a **category clash disguised as a logical dispute**, compounded by a **terminological ambiguity** regarding the word 'law', and sustained by a **methodological isolation** from actual historical practice.

  Here is the diagnosis, broken down by the three fault lines you identified, followed by an assessment of what progress would have looked like and why the debate ultimately dissolved.

  ### 1. The Category Clash: Normative vs. Descriptive
  The primary reason the debate felt interminable is that Hempel and his critics were playing different games, despite using the same pieces.

  Hempel was operating within the tradition of Logical Positivism. His project was **normative and reconstructive**. He was not primarily interested in what historians *say* they are doing; he was interested in what they *must* be doing for their claims to count as rational knowledge. For Hempel, 'explanation' was a functional term in a philosophy of science. If history is to be cognitive and not merely artistic, it must share the logical structure of the natural sciences. He was arguing for the *conditions of possibility* for historical knowledge.

  Dray, Winch, and the Collingwoodians were operating within a tradition of **descriptive phenomenology**. They were interested in the actual experience of understanding history. Their question was: 'What makes this account intelligible to a reader?' or 'How does a historian make sense of an agent's action?' When they said 'explanation', they meant 'making intelligible'. When Hempel said 'explanation', he meant 'subsumption under a regularity that permits prediction'.

  **The Diagnosis:** It was a case of two questions wearing one name. Hempel was asking about justification (logic of science); Dray was asking about comprehension (hermeneutics). Because neither side conceded that they were defining 'explanation' differently, they simply talked past one another. Hempel would retreat to 'explanation sketches' to accommodate the lack of explicit laws, while Dray would argue that reasons are not causes. They were not disagreeing on the facts; they were disagreeing on the criteria for success.

  ### 2. The Ambiguity of 'Law'
  Your second suspicion regarding the definition of 'law' is spot on and represents the verbal core of the dispute.

  For Hempel, a 'law' could be incredibly thin. A statement like 'individuals tend to act in ways they believe will achieve their ends' counted as a general hypothesis. It satisfied the logical form of the Covering-Law Model (CLM).
  For the critics, a 'law' implied something with robust predictive power, projectibility, and empirical content—something akin to a law in physics.

  When critics attacked the CLM for lacking genuine laws, Hempel could rightly reply that he had identified regularities (however trivial). When Hempel claimed history relied on laws, critics could rightly reply that these were not the sort of things that do explanatory work in science.

  **The Diagnosis:** This was a verbal dispute with substantive consequences. Had they distinguished between **logical generalities** (truisms required for rationality) and **empirical generalisations** (contingent regularities subject to falsification), the debate might have sharpened. Hempel was largely defending the former; his critics were attacking the latter. Because they used the same word for both, the argument spun in circles.

  ### 3. The Data Deficit: Armchair vs. Archive
  Your third suspicion is perhaps the most damning. The debate was conducted almost entirely through 'toy cases'. Hempel used examples like the Dust Bowl or a radiator cracking; Dray used examples of a monarch crossing a Rubicon. Neither side engaged in a systematic empirical study of historical monographs.

  Philosophers of history were reading other philosophers, not historians. If a team of researchers had taken fifty standard historical monographs from the 1950s and coded them for implicit generalisations, they might have found that Hempel was right about the *structure* (historians do assume regularities) but Dray was right about the *practice* (historians do not cite them, and the narrative does the heavy lifting).

  **The Diagnosis:** This was a hidden methodological disagreement about which texts count as data. Hempel treated historical texts as data for a logician; Dray treated them as data for a hermeneuticist. Neither treated them as data for an empirical sociologist of knowledge.

  ### What Would Have Counted as Progress?
  Given this diagnosis, a resolution was possible, though it would have required a shift in method that was uncommon in mid-century analytic philosophy.

  1.  **An Empirical Turn:** A serious, collaborative study of working historians' prose. If philosophers had partnered with intellectual historians to analyse the inferential structure of actual texts, they could have determined whether 'laws' were genuinely doing work or were merely reconstructive impositions by the philosopher. This eventually happened in Science Studies, but not in Philosophy of History at the time.
  2.  **A Formal Theory of Narrative:** You mention narrative does explanatory work without laws. Progress would have required a formal account of *how* narrative explains. At the time, 'narrative' was treated as a literary flourish rather than a cognitive tool. Had someone developed a logic of narrative connection (distinct from nomological connection) in the 1960s, it could have offered a third way. (This arguably arrived later with Paul Ricoeur and Hayden White, but by then the analytic tradition had moved on).
  3.  **A Terminological Stipulation:** Simply agreeing to distinguish 'causal explanation' (Hempel's territory) from 'interpretive understanding' (Dray's territory). If they had conceded that history requires both, the heat would have gone out of the argument.

  ### Why Did It Die?
  You guess that analytic philosophy of history lost its audience. I would refine that: **the foundation beneath Hempel's side of the argument was pulled away.**

  The Covering-Law Model was a pillar of Logical Positivism. When Positivism fell out of favour in the 1970s and 80s—due to Kuhn's *Structure of Scientific Revolutions*, the failure of the reductionist programme, and the rise of post-structuralism—Hempel's model lost its theoretical home. It wasn't refuted; its parent philosophy was abandoned.

  Simultaneously, the 'Linguistic Turn' arrived. Philosophers became less interested in whether historical statements corresponded to reality via laws, and more interested in how historical texts construct reality via rhetoric and narrative (the White/Foucault influence). The question changed from 'Is this explanation logically valid?' to 'Whose interests does this narrative serve?'.

  Furthermore, the institutional incentives shifted. Philosophy of history became a niche sub-discipline. Metaphysicians took over causation (counterfactual theories became the vogue), and literary theorists took over narrative. The specific intersection where Hempel and Dray fought was vacated.

  ### Conclusion
  The debate ended in a 'weird way' because it was not solved; it was **dissolved**. It was a substantive disagreement about the nature of rationality, obscured by verbal ambiguity, and fought on a battlefield of invented examples.

  Nothing could have settled it logically because the disagreement was ultimately about the *purpose* of the philosophy of history itself. Hempel wanted to secure history's status as science; Dray wanted to protect its status as a humane discipline. When the distinction between 'science' and 'humanities' became less rigid (and less valued) in the late twentieth century, the motivation to fight the battle evaporated.

  For your module, I suggest framing it not as a failed argument, but as a symptom of a specific moment in intellectual history: the last gasp of high positivism trying to account for the human past. The lack of an obituary is appropriate; the patient didn't die of a specific injury, but of a change in the climate.
