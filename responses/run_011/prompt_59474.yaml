      *   *Refining the "Two Views" argument:* The 90% cutoff is trying to approximate a binary reality (Realism). The Actionability filter is rejecting binary reality in favor of clinical consequence (Pragmatism). This creates a friction point.
      *   *Refining the VUS argument:* If meaning is relational, uncertainty is a property of the relationship, not a gap in the code. Therefore, VUS is data.

