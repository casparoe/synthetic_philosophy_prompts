answer: |-
  Here is a sequence of ten questions designed for a forty-five-minute session. They are arranged to move from the internal coherence of the definition, through empirical and normative implications, to the metaphysical status of the view and finally its methodological defence. The follow-ups anticipate her characteristic deflationary move regarding phenomenal kinds.

  **1. The 'In Virtue Of' Clause**
  You argue that pleasures are unified not by a common feel but by a functional role: they dispose us to want them to continue *in virtue of the way they feel*. If the phenomenology is truly heterogeneous, however, the phrase 'the way they feel' does not pick out a shared quality. Does this not mean the unity of the class rests entirely on the disposition, rendering the 'in virtue of' clause a placeholder rather than an explanation?

  *   **Likely Answer:** She will likely say the clause explains *why* the disposition arises in each case, even if the 'why' differs from case to case.
  *   **Follow-up:** But if the explanatory base is different in every instance, have you not simply relocated the heterogeneity problem into the causal basis of the role? What work is 'pleasure' doing here that 'disposition to continue' is not doing alone?

  **2. Neuroscience: Liking vs. Wanting**
  Two of our attendees are from psychology, so this is pertinent. Affective neuroscience distinguishes between 'liking' (hedonic impact) and 'wanting' (incentive salience), noting they can dissociate. Your account identifies pleasure with a disposition to want continuation. Are you not defining pleasure in terms of 'wanting' systems that can operate without 'liking', thereby conflicting with the empirical data?

  *   **Likely Answer:** She may reply that folk psychology conflates the two, and her functional role captures what actually matters for agency and well-being.
  *   **Follow-up:** If the neural systems come apart, and well-being tracks the 'liking' component while your definition tracks 'wanting', does your view imply that an agent can be made better off by states they do not actually 'like' in the hedonic sense?

  **3. Phenomenological Counter-Examples**
  Consider cases of deep satiety or exhausted convalescence: a state may feel pleasant, yet the subject has no inclination to prolong it. Conversely, consider painful exertion: one may resist interruption without the experience being pleasant. If the disposition is constitutive of pleasure, how do you accommodate these mismatches without stipulating away the counter-examples?

  *   **Likely Answer:** She will likely argue these are complex cognitive cases where other desires override the specific pleasure-disposition, or that the 'resistance' is subtle.
  *   **Follow-up:** If the disposition must be inferred or protected by ceteris paribus clauses to survive these cases, does it remain a robust criterion for identifying pleasure, or does it become a theoretical posit detached from the subject's perspective?

  **4. Collapse into Desire Theory**
  If the good-making property of pleasure is its functional role, and that role is defined by a conative disposition (wanting continuation), does your hedonism not collapse into a form of desire satisfactionism? What distinguishes your view from the claim that satisfying the desire for an experience to continue is what generates well-being?

  *   **Likely Answer:** She will insist the desire must be caused *by the feel* of the experience, which preserves the hedonistic intuition.
  *   **Follow-up:** But if the feel itself carries no normative weight other than causing the desire, is it not the desire satisfaction that is doing the normative work? Why retain the label 'hedonism' if the phenomenology is normatively inert?

  **5. The Good-Making Property**
  This is the aspect of your view many find difficult to grasp. Traditionally, hedonists argue pleasure is good *because* of how it feels. You argue it is good because of the role it plays. If I could have the role without the specific feels (or vice versa), which would you say contributes to well-being?

  *   **Likely Answer:** She will say the question is malformed because the role is fixed by the feels; you cannot have the role without the feels causing it.
  *   **Follow-up:** Yet you grant the feels are heterogeneous. If the value lies in the role, and the role is multiply realisable, does it not follow that the specific phenomenology is irrelevant to the *value*, even if it is causally necessary?

  **6. First-Person Authority**
  On a standard view, I know I am in pleasure by attending to the phenomenology. On your account, to know I am in pleasure, must I not gather evidence about my own dispositions to resist interruption? Does this not threaten the immediate first-person authority we seem to have over our own enjoyable experiences?

  *   **Likely Answer:** She will likely say the disposition is internal and immediate, not requiring behavioural observation.
  *   **Follow-up:** But if the disposition is internal, how do I distinguish it from the feel itself? If I cannot distinguish them from the inside, why posit the disposition as the definition rather than the feel?

  **7. Infants and Non-Human Animals**
  Your definition involves a disposition to want an experience to *continue* and to resist *interruption*. Does this require the subject to possess a concept of the future or of persistence? If so, do infants and non-human animals fail to experience pleasure? If not, how do they satisfy the condition without conceptual content?

  *   **Likely Answer:** She will argue for a non-conceptual, behavioural manifestation of the disposition.
  *   **Follow-up:** If it is purely behavioural, does this not make pleasure attribution entirely third-personal for animals, whereas we claim to know our pets enjoy things in a sense analogous to our own first-person knowledge?

  **8. The Analogies: Money and Predator**
  You compare 'pleasure' to 'predator' or 'money': functional kinds where the realisers need not resemble one another. But 'predator' is fixed by ecological facts and 'money' by social agreement. What fixes the 'pleasure' role? Is it evolutionary, or is it fixed by how things feel from the inside?

  *   **Likely Answer:** She will likely say it is fixed by the causal structure of the mind, independent of social agreement.
  *   **Follow-up:** If it is fixed by the causal structure of the mind, but the causal bases are heterogeneous, is 'pleasure' not merely a disjunction of states that happen to cause similar behaviours, rather than a genuine functional kind like 'money'?

  **9. The Methodological Defence**
  You often respond to objections by suggesting they assume 'pleasure' must name a natural phenomenal kind, and that this assumption is the error. Suppose I grant that assumption is false. Even if 'pleasure' is a functional kind, why should *that* kind be the sole constituent of well-being? What justifies the normative privilege of this specific functional role?

  *   **Likely Answer:** She may argue that this role captures everything we ever valued in pleasure, minus the confused metaphysics.
  *   **Follow-up:** But if the phenomenology is heterogeneous and normatively inert, and the role is just a disposition to continue, have you not changed the subject? Why should we care about this functional kind for the purposes of *well-being* specifically, rather than mere agency?

  **10. Falsifiability**
  To close: given your defence that many objections rely on a mistaken assumption about phenomenal kinds, what would count as evidence or an argument that would actually compel you to abandon the view? Is there a conceivable scenario where your functional role is satisfied, yet we would all agree well-being has not been increased?

  *   **Likely Answer:** (Open ending)
  *   **Follow-up:** (Only if time permits) If the answer is 'no', does that not suggest the view is insulated from critique by definition rather than supported by argument?
