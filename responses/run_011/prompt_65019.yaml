  | 3 | Wide interval better than lying 0.50 | Preserved | Epistemic Transparency | Honesty about ignorance builds trust even if utility is low. |
  | 4 | Dilation is unacceptable behavior | Revised | Epistemic Transparency | Dilation reveals heterogeneity; it is honest, not broken. |
  | 5 | Ignoring dashboard is irrational | Preserved | Epistemic Transparency | Information has value even if it increases measured uncertainty. |
  | 6 | Narrower interval = more accountability | Preserved | Width-Penalized Scoring | Scoring rule penalizes width, aligning accountability with precision. |
  | 7 | Disagreement -> Union, not empty | Preserved | Epistemic Transparency | Conservatism in aggregation prevents false confidence. |
  | 8 | Low stakes -> act on midpoint | Revised | Cost-Based Collapse | Midpoints are forbidden; use expected loss or policy default. |
  | 9 | Midpoint of wide interval is a lie | Preserved | Cost-Based Collapse | Reinforces that epistemic intervals lack a meaningful center. |
  | 10 | "I don't know" unacceptable for deadline | Preserved | Cost-Based Collapse | Forces a decision via cost function despite uncertainty. |
  | 11 | Logical 0/1 ok, Probabilistic 0/1 not | Preserved | Epistemic Transparency | Distinguishes proof from forecast. |
  | 12 | Containment is not success | Preserved | Width-Penalized Scoring | Scoring rule penalizes width even if truth is inside. |
  | 13 | [0,1] must score worse than 0.5 const | Preserved | Width-Penalized Scoring | Width penalty ensures hedging is punished vs naive baseline. |
