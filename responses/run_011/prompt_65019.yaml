answer: |-
  ### The Principle of Cost-Weighted Epistemic Honesty

  Your intuition is correctly identifying a clash between **aleatory uncertainty** (inherent randomness, like weather) and **epistemic uncertainty** (lack of knowledge, like a new deploy). Your current system treats epistemic uncertainty as if it were aleatory, which is why point estimates feel like lies and wide intervals feel like failures.

  The principle below separates the *reporting* of uncertainty from the *decision* made under uncertainty. It treats intervals as measures of model ignorance (epistemic) rather than outcome variance (aleatory). It mandates that while you must report ignorance honestly (to preserve trust), you must not let that ignorance paralyze decision-making; instead, you collapse the interval using a cost function. Finally, it requires a scoring rule that punishes "hedging" (wide intervals) even when they are technically correct, to drive model improvement.

  This principle accepts **Dilation** (the phenomenon in Verdict 4) as a feature, not a bug. When querying a sub-region widens your interval, it means the aggregate model was hiding heterogeneity. The system isn't "knowing less"; it is revealing that the previous knowledge was improperly aggregated.

