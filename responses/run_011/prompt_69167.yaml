answer: |-
  Your analysis of the shared ground is precise: the Rietdijk-Putnam argument relies on importing a modal or ontological premise (the "no privilege" and "transitivity of reality" claims) that is not contained in the metric structure of Minkowski spacetime itself. The stalemate arises because the physics underdetermines the metaphysics, yet both sides treat the physics as decisive.

  Here is an assessment of your working hypothesis against the three alternatives, followed by a diagnosis of the CMB frame and a recommendation on progress.

  ### Assessment of the Hypothesis

  **Your Hypothesis: The Ideological Clash**
  You propose the disagreement is metaontological: a clash over the ideology of "existence." The Eternalist treats the quantifier as joint-carving and absolute; the Presentist treats it as fragmented or indexed.
  *   **Verdict:** This is the strongest diagnostic tool. It explains why the argument is immune to empirical refutation. If the Presentist denies the univocality of the quantifier, the transitivity premise of the Rietdijk-Putnam argument fails to launch, not because the physics is wrong, but because the logic of "is real" does not support the required substitution. This aligns with the Quinean insight that ontology is bound up with the bound variables of our best theory, but pushes further to ask *which* theory (physical or metaphysical) gets to dictate the variables.

  **Alternative 1: The Verbal Dispute**
  This suggests the impasse is merely semantic and closable by stipulation (e.g., "Let 'exists*' mean exists-at-a-time").
  *   **Verdict:** Insufficient. While there is a verbal component, the stakes are not merely terminological. The dispute concerns the nature of truthmakers for tensed sentences, the openness of the future, and the possibility of change. If it were purely verbal, one could switch codes without loss of explanatory power. However, switching to "exists*" often renders the Presentist unable to make sense of cross-temporal relations or causal efficacy without significant theoretical cost. The resistance to stipulation indicates a substantive disagreement about the structure of reality, not just the label attached to it.

  **Alternative 2: Different Questions (Being vs. Settledness)**
  This suggests Eternalists answer "what is there?" while Presentists answer "what is determinate?"
  *   **Verdict:** Plausible, but derivative. This is effectively a specific instantiation of your ideological hypothesis. To ask "what is settled?" is to adopt a different ideological primitive (determinacy rather than existence). However, this alternative risks conceding too much to the Eternalist. If the Presentist only cares about "settledness," they risk collapsing into a Growing Block view or a perspectival realism that accepts the block but denies our access to it. Most Presentists want to deny the *being* of the future, not just its *settledness*. Therefore, this alternative describes a retreat position rather than the core of the impasse.

  **Alternative 3: Substantive/Hidden Formal Component**
  This suggests the disagreement rests on whether Lorentz-invariant predictions can be recovered from theories with preferred foliations (e.g., Bohmian mechanics) or light-cone dynamics (e.g., relativistic GRW).
  *   **Verdict:** Necessary but insufficient. This addresses the *physical coherence* of Presentism, not the *metaphysical motivation*. Even if a Neo-Lorentzian theory is empirically adequate (as Bohmian mechanics arguably is), the Eternalist can argue it is theoretically vicious (violating parsimony or fundamental symmetry). Conversely, even if no such theory is possible, the Presentist can argue that metaphysics trumps physics (the "physics is incomplete" move). This alternative clarifies the *cost* of Presentism but does not explain why the argument remains at an impasse rather than being settled by the construction (or non-construction) of such models.

  ### The Role of the CMB Frame

  The frame in which the Cosmic Microwave Background (CMB) is isotropic is **merely a rhetorical device** in this context, though a seductive one.

  It does no real metaphysical work because it is distinguished by contingent matter distribution, not by the laws of nature. Special Relativity's challenge to Presentism is nomological: it asserts that the *laws* do not privilege a slicing. The CMB provides a *de facto* privileged slicing, but a *de jure* egalitarianism.
  *   **For the Eternalist:** The CMB frame is just another physical field configuration within the block. It does not restore absolute simultaneity because it is contingent; in a vacuum universe, the privilege vanishes.
  *   **For the Neo-Lorentzian:** The CMB is often waved at as proof that "privileged frames aren't crazy." But this conflates *detectability* with *fundamentality*. The impasse concerns whether the *metric structure itself* supports a preferred foliation. The CMB does not answer this; it merely offers a candidate for where a hidden variable might align. Relying on it allows both sides to talk past each other: the Presentist sees a cosmic clock; the Eternalist sees a thermometer embedded in the manifold.

  ### Diagnosis: The Closest to Truth

  The diagnosis closest to the truth is a synthesis of **Your Hypothesis (Ideology)** and **Alternative 3 (Formal Coherence)**, weighted heavily toward the former.

  The impasse persists because the argument is functioning as a **boundary marker for ideological commitment**, not as a proof of ontology. The Eternalist demands that metaphysics bow to the symmetries of the fundamental laws (ideological naturalism). The Presentist demands that the manifest image of time (the flow, the open future) constrains the interpretation of those laws (ideological phenomenology).

  The "hidden formal component" (Alt 3) matters only insofar as it keeps Presentism from being empirically incoherent. As long as a Neo-Lorentzian model is logically possible, the Presentist is not refuted by observation. But since both the Block and the Preferred Foliation can recover the same empirical predictions, the choice between them is not physical. It is a choice of **ideological primitives**: do we privilege the symmetry of the equations (Eternalism) or the asymmetry of experience/causation (Presentism)?

  ### What Counts as Progress?

  Given this diagnosis, you should expect **no formulation that ends the dispute**.

  A shared formal theory with non-equivalent readings (e.g., a spacetime manifold where one side quantifies over points and the other over slices) would simply relocate the disagreement to the interpretation of the quantifiers. We have effectively already done this with the "possibility of Neo-Lorentzian theories." The stalemate is not a failure of philosophical engineering; it is the correct steady state for a clash of fundamental ideologies.

  **Recommendation for your contributors:**
  The honest recommendation is to stop treating the Rietdijk-Putnam argument as a live refutation and start treating it as a **cost function**.
  1.  **For the Eternalist:** The cost is accepting that the "flow" of time is derivative or illusory, despite the asymmetry of causation.
  2.  **For the Presentist:** The cost is accepting a hidden structure (preferred foliation) that is empirically undetectable and nomologically invisible, or adopting a fragmented logic of existence.

  Progress lies in **precision about the price**, not in **elimination of the debt**. The framing section of your collection should advise contributors to explicitly state which ideological primitive they are willing to sacrifice (Symmetry vs. Temporal Passage) rather than attempting to derive one from the other via the physics. The argument's function is to discipline the choice of ideology, ensuring that neither side claims the physics forces their hand. The physics permits both; the metaphysics selects one. Acknowledging this selection as a choice, rather than a deduction, is the only way to dissolve the illusion of an impasse.
