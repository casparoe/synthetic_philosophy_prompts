          *   *Follow-up:* If the rule is precise, isn't the credence effectively precise?

      *   *Q5: Required vs. Permitted.* Normative force.
          *   *Draft:* Is it required or allowed?
          *   *Refinement:* The "dilemma" setup. If required, we are irrational often. If allowed, it's weak.
          *   *Follow-up:* Push on the "permitted" horn (why bother?).

      *   *Q6: Dilation.* Learning makes you less sure.
          *   *Draft:* What about dilation?
          *   *Refinement:* Focus on the "feature not bug" claim. Does confusion track evidence?
          *   *Follow-up:* If evidence *always* sharpens belief in standard stats, why is blurring rational here?

      *   *Q7: The "Modeling Framework" Defense.* (Mid-game check).
          *   *Draft:* Is this just a model?
