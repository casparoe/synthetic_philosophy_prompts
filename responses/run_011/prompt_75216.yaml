  **MAP LIMITATIONS & FLAGS**

  **1. INDISTINGUISHABLE LEAVES:**
  **Leaf D (Conservative)** and **Leaf F (No-Bootstrapping)** often emerge identically on this tree (both say "No" to Node 1). The real difference is whether the block is *antecedent* (D) or *structural* (F). This tree cannot separate them without asking about "Entitlement" directly, which was excluded to avoid jargon. Treat them as a cluster.

  **2. ITERATION JOINTS:**
  **Node 2 (Degradation)** and **Node 4 (Monotonicity)** are the load-bearing joints for the ML audience. If you answer "Compounds" at Node 2, you are committed to a view that allows self-improving systems to self-certify indefinitely (Leaf A/B). If you answer "Decays," you commit to warrant dilution (Leaf C/D).

  **3. EMPTY CELLS:**
  **Leaf H** handles the *Archive* case by positing a defeat condition that is external but specific. It is **UNEXPLORED** (someone should write this).
  **Leaf K** handles the *Amnesiac* case by positing the Archive is worse than the Gauge. It is **INCOHERENT** (structural identity precludes normative difference).

  **4. HOW TO READ THE CROSS-CUTS:**
  Nodes 10 and 11 are not linear; they test the stability of your Node 1 answer. If Node 10 changes your Node 1 answer, you hold a *Context-Sensitive* view not fully captured by Leaves A-L.
