answer: |-
  [PAGE 1]

  **HOW TO USE THIS:** Answer the questions based on what you would say about the cases, not the labels you like; follow the arrows until you hit a boxed **LEAF**. Terms of art are defined in parentheses immediately following their first use.

  **NODE 1: The Gas Gauge (One-Shot)**
  You check a gas gauge (source) and the tank (check) ten times; they always match. Can you gain *any* justification for "The gauge is reliable" using *only* these ten pairs of observations?
  → **YES:** Go to NODE 2.
  → **NO:** Go to NODE 5.

  **NODE 2: Degradation (Iteration)**
  Suppose each generation of the gauge trains partly on the previous generation's output, so the record gets noisier over time even though the reasoning shape never changes. Does your warrant (reason to believe) decay across iterations, stay flat, or compound?
  → **COMPOUNDS:** Go to NODE 3.
  → **DECAYS/FLAT:** Go to NODE 4.

  **NODE 3: The Cost (Coherence vs. Truth)**
  If warrant compounds, does a broken gauge that stays *consistent* (but wrong) certify itself as reliable?
  → **YES:** [LEAF A: Radical Coherentist]
  → **NO:** [LEAF B: Reliabilist Permissivist]

  **NODE 4: The Cap (Monotonicity)**
  If warrant caps or decays, is it because repeating an inference whose premises are products of earlier iterations consumes warrant (i.e., the account is non-monotone, meaning adding premises can reduce justification)?
  → **YES:** [LEAF C: Resource-Limited Reliabilist]
  → **NO:** [LEAF D: Conservative Entitlement]

  **NODE 5: The Failure (Knowledge vs. Justification)**
  If Node 1 was NO, is the reasoner *justified* but lacking *knowledge* (where knowledge is justified true belief plus some anti-luck condition), or lacking justification entirely?
  → **JUSTIFIED, NO KNOWLEDGE:** Go to NODE 6.
  → **NO JUSTIFICATION:** Go to NODE 7.

  **NODE 6: The Block (Closure vs. Transmission)**
  If justified but no knowledge, does *closure* (the principle that knowledge transfers across known entailment) fail, or does *transmission* (when a good inference fails to pass justification from premises to conclusion) fail?
  → **CLOSURE FAILS:** [LEAF E: Closure Denier]
  → **TRANSMISSION FAILS:** [LEAF F: No-Bootstrapping Principle]

  **NODE 7: The Etiology (Amnesiac's Notebook)**
  A driver records gauge readings and tank levels; the levels were independently checked, but years later she forgets this and reasons believing both columns came from the gauge. Does the conclusion inherit the etiology (causal history) the premises *actually* have, or the etiology she *thinks* they have?
  → **ACTUAL HISTORY:** Go to NODE 8.
  → **THOUGHT HISTORY:** Go to NODE 9.

  **NODE 8: The Externalist Gap**
  If actual history matters, why did Node 1 fail? Is it because you need a *different* source to start, or because this specific evidence is flawed?
  → **NEED DIFFERENT SOURCE:** [LEAF G: Hard Conservative]
  → **SPECIFIC EVIDENCE FLAWED:** [LEAF H: *EMPTY CELL 1*]

  **NODE 9: The Internalist Gap**
  If thought history matters, is the reasoning wrong because she represents her evidence as better supported than it is (misrepresentation), or because there is no basic knowledge?
  → **MISREPRESENTATION:** [LEAF I: Misrepresentation View]
  → **NO BASIC KNOWLEDGE:** [LEAF J: Straight Skeptic]

  **NODE 10: The Archive (Self-Certifying)**
  A pipeline classifies images and writes notes on its own accuracy; a year later you infer accuracy from the notes plus the labels (both pipeline-generated). Is this structurally *worse* than one round of gas-gauge bootstrapping?
  → **YES:** [LEAF K: *EMPTY CELL 2*]
  → **NO:** (Return to Node 1 or 5 depending on your Node 1 answer).

  **NODE 11: The Independence (Source)**
  Does warrant for a source's reliability require a *second* source that is already warranted, or can the source warrant itself over time?
  → **REQUIRE SECOND SOURCE:** (Return to Node 4 or 5).
  → **SELF-WARRANT OVER TIME:** (Return to Node 2 or 3).

  *(Note: Nodes 10 & 11 are cross-cuts; if you answered Node 1 YES, Node 10 tests if Archive changes that. If you answered Node 1 NO, Node 11 tests why.)*

