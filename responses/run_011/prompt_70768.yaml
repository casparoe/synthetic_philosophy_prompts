answer: |-
  ### The Specification: Requirements for an Account of Choice and Utility

  To escape the charge that utility theory is a tautology ("people do what they do because they want to do what they do"), an account must treat utility not merely as a label for the outcome, but as a mechanism that constrains and predicts behavior. Below are the seven requirements such an account must deliver, with the specific case motivating each.

  **1. Out-of-Sample Predictivity**
  *   **The Requirement:** The account must generate predictions about choices in *new* budget sets or price regimes that are not used to calibrate the utility function.
  *   **The Case:** If utility is only assigned after the choice is observed, the theory explains everything and predicts nothing. To be empirical, the utility index derived from Set A must successfully forecast behavior in Set B.
  *   **Tag:** **[Coherence]**

  **2. Counterfactual Stability**
  *   **The Requirement:** The account must assign values to unchosen options that remain stable across different menus. If you pick Apple over Banana when those are the only options, the utility gap between them must persist when Cherry is added to the menu.
  *   **The Case:** We only observe the winner. If the value of the loser changes depending on who they lost to, we cannot construct a stable scale of preference. We need to know that the rejection of Banana reveals a stable lower value, not just a context-specific dismissal.
  *   **Tag:** **[Coherence]**

  **3. Description Invariance**
  *   **The Requirement:** Logically equivalent descriptions of the same outcome must yield the same choice.
  *   **The Case:** If a person picks a surgery when told it has a "90% survival rate" but rejects it when told it has a "10% mortality rate," the choice is driven by the phrasing, not the underlying outcome. If utility measures the value of the *outcome*, framing effects break the link between choice and utility.
  *   **Tag:** **[Coherence]**

  **4. Dynamic Consistency**
  *   **The Requirement:** A plan chosen today for execution tomorrow must be the same plan actually chosen when tomorrow arrives, absent new information.
  *   **The Case:** Choosing a smaller reward now over a larger one later is permissible. However, choosing the larger reward for "next year" today, and then switching to the smaller reward when "next year" becomes "today," implies the utility function changed arbitrarily over time. This makes the agent unpredictable to their future self.
  *   **Tag:** **[Coherence]**

  **5. Statement-Action Concordance**
  *   **The Requirement:** Stated preference (what you say you want) must align with revealed preference (what you pick) absent external constraints.
  *   **The Case:** If you say you prefer cake but pick salad, standard theory assumes you actually preferred salad. However, if you subsequently express regret, the theory must explain why the choice did not reflect the welfare-generating preference. It must distinguish between a "mistake" and a "preference."
  *   **Tag:** **[Welfare]**

  **6. Sunk Cost Insensitivity**
  *   **The Requirement:** Resources already expended and unrecoverable must not influence current marginal choices.
  *   **The Case:** If you buy a ticket and then get sick, staying home is the utility-maximizing choice if health > event. If you go because you "paid for it," you are compounding a loss. An adequate account must treat the ticket price as zero at the moment of the attendance decision.
  *   **Tag:** **[Coherence]**

  **7. Sovereign Self Identification**
  *   **The Requirement:** The account must specify which temporal version of the agent defines "utility" when preferences conflict over time.
  *   **The Case:** If you pay to remove a temptation (e.g., locking away alcohol) and then later wish you hadn't, one self is overruling the other. The theory must state whether utility is measured by the "planner" (who wants health) or the "doer" (who wants drink). Without this, we cannot say if the pre-commitment increased or decreased total utility.
  *   **Tag:** **[Welfare]**

  ***

  ### The Evaluation

  **Non-Negotiable vs. Camp Taste**
  *   **Non-Negotiable:** **Out-of-Sample Predictivity (1)**. Without this, the theory is metaphysics, not science. It is the minimum condition for avoiding tautology.
  *   **Camp Taste:** **Statement-Action Concordance (5)** and **Sovereign Self Identification (7)**. These are **[Welfare]** demands. A "positive" economist (describing what *is*) can ignore these and say choice *defines* welfare. A "normative" economist (prescribing what *ought* to be) or a behavioralist must demand them to judge mistakes. The disagreement you are hitting is often between those who think economics should only model coherent choice versus those who think it should model human well-being.

  **The Impossibility Result**
  There is a structural incompatibility between **Description Invariance (3)**, **Dynamic Consistency (4)**, and **Observed Behavior**.
  If we accept empirical evidence that humans *do* suffer from framing effects and time inconsistency, we cannot satisfy the Coherence requirements while maintaining that Choice = Utility.
  *   If Choice = Utility, and Choice changes due to framing, then Utility changes due to framing. This violates the definition of utility as a stable property of the agent.
  *   If Utility is stable, and Choice changes due to framing, then Choice ≠ Utility.
  You cannot have a theory that claims Choice reveals Utility, while simultaneously admitting that Choice is unstable under irrelevant description changes. One of the three must break: the data, the definition of utility, or the link between them.

  **The Single Requirement That Eliminates the Most Candidates**
  **Description Invariance (3).**
  This is the hardest filter. Standard Revealed Preference theory assumes this holds. Behavioral economics shows it often fails. If you demand Description Invariance as a requirement for a valid utility account, you eliminate almost all descriptive models of actual human psychology. If you drop it, you save the description of humans but lose the mathematical tractability and the claim that utility is a stable, internal scalar. It is the primary fracture point between neoclassical and behavioral approaches.

  ***

  ### Three Ways Out of the Circularity

  Here are the three primary strategies used to break the "Choice is Utility, Utility is Choice" loop, defined by their claims and their failures.

  **1. The Operationalist Move**
  *   **The Claim:** Utility is *defined* as the index that rationalizes observed choice. There is no separate psychological state. If you chose it, it had higher utility, period. Regret and framing are just changes in the constraint set or the information set.
  *   **What it Solves:** It makes the theory mathematically airtight and logically consistent. It removes the circularity by making it a definition rather than a causal claim.
  *   **Which Requirement it Fails:** It fails **Statement-Action Concordance (5)** and **Sovereign Self Identification (7)** **[Welfare]**. It cannot distinguish between a "mistake" and a "preference." It cannot tell a policymaker if a person is better off smoking or quitting, only that they chose to smoke. It sacrifices the link to well-being to save the link to logic.

  **2. The Psychological Realist Move**
  *   **The Claim:** Utility is a measurable brain state (pleasure, satisfaction, dopamine) independent of choice. Choice is merely an imperfect, noisy signal of this state. We can measure utility via surveys or neuroscience, separate from what people pick.
  *   **What it Solves:** It breaks the tautology by making utility an independent variable. It allows for **Statement-Action Concordance (5)** **[Welfare]**. You can choose the cake but have lower utility than if you had the salad.
  *   **Which Requirement it Fails:** It fails **Counterfactual Stability (2)** and **Out-of-Sample Predictivity (1)** **[Coherence]**. Because the link between choice and utility is now noisy and imperfect, you can no longer deduce precise preferences from choices. The theory loses its ability to predict specific market behaviors based on past choices because the "signal" is corrupted by psychological noise.

  **3. The Dual-Self (Error) Move**
  *   **The Claim:** There is a "True Utility" (long-term planner) and an "Action Utility" (short-term doer). Choices that deviate from the plan are modeled as "errors" or "costs" imposed by the short-term self on the long-term self.
  *   **What it Solves:** It handles **Dynamic Consistency (4)** and **Sovereign Self Identification (7)** **[Welfare]**. It explains pre-commitment and regret as the Planner managing the Doer.
  *   **Which Requirement it Fails:** It fails **Description Invariance (3)** **[Coherence]**. To make this work, you must arbitrarily decide which self is the "True" one. There is no scientific way to prove the Planner is more "real" than the Doer without importing a moral judgment. Furthermore, it often requires assuming the Planner knows the future utility perfectly, which reintroduces an unobservable, unfalsifiable entity to save the theory.

  ### Summary of the Wall
  You are hitting the wall because you are asking for **Coherence** and **Welfare** simultaneously.
  *   If you want **Coherence** (prediction, math, consistency), you must accept the Operationalist Move: Choice *is* Utility. You must accept that if someone smokes, they wanted to smoke more than they wanted health, and talking about "mistakes" is outside the model.
  *   If you want **Welfare** (policy, well-being, correcting mistakes), you must accept the Psychological or Dual-Self Move: Choice is *not* Utility. You must accept that the theory becomes less precise, requires external data (surveys, neuroscience), or relies on unproven assumptions about which "self" is the real one.

  Standard economics textbooks present the Operationalist Move but often use the language of the Welfare Move. This slippage is the source of the confusion.
