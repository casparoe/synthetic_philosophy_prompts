      *(Self-Correction during drafting)*: I need to be careful with the "Impossibility" section. It's not a formal theorem like Arrow's, but a structural tension. I should phrase it as a "structural incompatibility" rather than a named theorem to avoid citation needs. The core conflict is between *descriptive accuracy* and *axiomatic consistency*.

      *(Refining the "Ways Out")*:
