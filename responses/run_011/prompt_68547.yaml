answer: |-
  **Diagnosis: Reject Step (3)**

  The step you must reject is **(3)**: *"The demos entitled to vote is the population of the territory whose assembly conducted the vote; no other way of identifying it avoids begging the question."*

  **Why It Looked Acceptable**
  Step (3) is seductive because it solves the "boundary problem" (who gets to vote on the boundaries?) by appearing to dissolve it. It treats the existing administrative unit as a self-validating vessel: if an assembly exists and holds a vote, that assembly defines the people. This appeals to proceduralists because it avoids substantive judgments about history, culture, or economics, which can seem paternalistic. It promises a clean, circularity-free test: the vote defines the voter.

  **The Price of the Repair**
  Rejecting (3) forces you to admit that the *unit* entitled to hold a plebiscite cannot be defined by the plebiscite itself. You must accept antecedent criteria for what constitutes a "self-determination unit." This means borders are not morally neutral containers; they carry weight based on history, constitutional status, or institutional sedimentation. You pay the price of **territorial conservatism**: you must grant moral significance to existing jurisdictional lines (like Estmark's 1979 parliament) that you cannot derive solely from the current will of the inhabitants. You cannot be a pure plebiscitary theorist; you must be a hybrid who requires both a democratic vote *and* a legitimate territorial unit.

  **The Demos Criterion and the 1848 Borders**
  You asked whether any criterion can avoid being a redescription of the 1848 borders. The honest answer is **no, not entirely**, but the *justification* shifts.
  If you justify Estmark's right to vote based on its 1979 parliament, you are relying on borders fixed in 1848. However, you are not validating the *1848 reasoning* (cadastral convenience); you are validating the *subsequent institutionalization* (140 years of shared administration, a distinct parliament, and competences over health and policing). The moral weight comes from the political community that formed *within* those lines, not the lines themselves.

  To distinguish the **Karn Valley** from Estmark without relying merely on size, you point to **jurisdictional competence**. Estmark's parliament has primary legislative authority over major state functions (policing, health); the Karn Valley assembly has statutory power only for local referendums. Estmark functions as a federal unit; Karn functions as a municipality. The criterion is not "any assembly," but "an assembly with recognized regional sovereignty." This stops the nesting problem at the level of the highest-order sub-state jurisdiction, preventing the infinite regress in Step (8).

  **The Cost to the Injustice Theorist**
  The theorist who makes secession conditional on injustice (a "just cause" theorist) pays the price articulated in **Premise (2)**: the **paradox of the best treated**. By conditioning the right on abuse, they create a perverse incentive structure. A region that is well-governed, wealthy, and culturally distinct (like Estmark) is denied the right to leave, while a region suffering tyranny is granted it. This implies that the state must mistreat a region to legitimize its departure, or conversely, that successful integration forfeits self-determination. They pay the cost of making self-determination a remedy for pathology rather than a primary right of political communities.

  **The Cost to the Procedural View**
  The procedural view holds that a clear vote obliges parties to negotiate rather than authorizing departure. In the scenario where negotiations offer Estmark devolution while Marren and the Karn Valley refuse to go, this view pays the cost of **indeterminacy and coercion**.
  If Estmark accepts devolution but Marren (the capital) and Karn (the minority region) refuse to be part of the new arrangement, there is no decision rule to resolve the conflict. The procedural view lacks a "stop rule." It risks locking the parties into perpetual negotiation or defaulting to the status quo (Valtre's sovereignty), which effectively vetoes the secessionist vote. The cost is that "negotiation" can become a euphemism for "delay" or "denial," leaving the moral force of the 54 percent vote (Premise 4) without a mechanism for realization.

  **Objection (9): One or Two?**
  Statement (9) states **two distinct objections**:
  1.  **Fragmentation:** "Dissolves every state into its neighborhoods" (Stability/Order).
  2.  **Wealthy Exit:** "Lets the wealthiest district... exit its obligations" (Distributive Justice).

  The complaint about fragmentation **survives** even if the complaint about wealthy exit does not. Even if wealthy districts were barred from leaving, poor districts could still fragment, leading to unviable micro-states, administrative chaos, and the collapse of public goods provision. The stability objection is independent of the distributive justice objection.

  **Preserving the Intuition in (4)**
  You wish to preserve the thought that *"54 percent of a people answering a clear question is not morally inert"* without accepting (10) (that the vote creates no right).
  To do this, you must downgrade the vote from a **constitutive right** to a **prima facie claim**.
  **The Cost:** You lose the clarity of an automatic entitlement. The vote does not *authorize* departure; it *triggers* a duty on the part of the central state to justify why the secession should not occur. It shifts the burden of proof to Valtre. However, if Valtre offers substantial accommodation (e.g., federalization) that addresses the grievances, the claim to secede may be satisfied without independence. You pay the price of **uncertainty**: the voters do not know in advance if their vote will result in statehood, only that it will result in a serious constitutional crisis that must be resolved. This preserves the moral weight of the vote (it cannot be ignored) without accepting the absurdity of infinite fragmentation (it does not guarantee success).
