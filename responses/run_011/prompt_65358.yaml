  **THE WEEKLY GAZETTE — FAITH & FOLK**

  **Dear Sister,**
  My brother David loves my son but says there's no God. It feels wrong for him to stand up at the font. Does his atheism disqualify him? He's a good man otherwise, pays his taxes, helps with the garden. But he won't say the creed. It seems dishonest. Also, is the parish hall free on the 14th for the lunch? We need to book caterers and I don't want to clash with the bingo. The vicar never answered straight before he died.
  **Yours, Worried in Woking.**

  **Dear Worried,**
  You treat belief like a weather forecast, a guess about what's up there. It isn't. It's a commitment to stand here. If he promises to help raise the boy, his view on the clouds doesn't matter. The role isn't a job description, it's a picture of loyalty. Contradiction doesn't work here like it does with facts. The hall isn't free or busy in itself. It becomes a lunch venue when you decide to eat there. Stop checking the diary for permission. The date isn't a fact waiting to be discovered. It is a date because you gather. Make the lunch and the hall will be free. Book the caterers. Don't worry about the bingo. The bingo is just noise until you listen.

  **Dear Sister,**
  Since Mary died I can't pray. It's just silence. Have I lost something true or found out it was false? It hurts to think I was fooled. The silence is heavy. I used to feel her near. Will you be in the office next Thursday? I might pop by for a chat, need to know if you're there. I don't want to walk for nothing. It's a long way from the estate.
  **Yours, Broken.**

  **Dear Broken,**
  You think prayer is a signal sent to Mary, a message waiting for a reply. It isn't. It's the shape your loss takes. If the silence changes how you brew your tea, the connection holds. You haven't lost a fact. You've lost a comfort. A belief nothing could contradict isn't empty, it's foundational. It regulates the whole of a life. I am in the office when the light is on. But the light depends on who is looking. Come anyway. The door is open if you push. Don't worry about the time. Time isn't a container we meet in. It is what we make. Walk the path.

  **Dear Sister,**
  I'm sixteen. My friends say believe, others say don't. Is there any evidence for any of it? Please be honest. I just want to know what's real before I commit. It feels important to get it right. I read some things. Also what time does youth group start? Don't want to be late. My mum says go. She worries.
  **Yours, Seeking.**

  **Dear Seeking,**
  Evidence is for hypotheses. Things that might be wrong. Belief isn't a guess about the world. It's the glasses you see the world through. You can't find the glasses by looking at the table. If you had them, you wouldn't ask for proof. Asking for evidence shows you stand outside the picture. You can't be argued into it, but if you had it, it would show. The gulf isn't about facts. Youth group starts when you stop checking the clock and walk in. Don't be late. Just come. The time is when you arrive. Be kind to your mum.

  **Ed: She is not a minister. I keep the light on. Send biscuits.**
