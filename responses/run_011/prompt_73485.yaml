answer: |-
  Negative-Liberty Theorist: Look at Clause 4.B again. "No system shall subject a citizen to arbitrary authority." You know I can't sign off on that. The contractor's impact assessment shows zero blocked transactions. If a citizen declines the ranked housing offer, they enter the general queue. The system does not prevent them from accessing the benefit; it merely sequences the invitation. There is no interference with what they might otherwise have done.

  Republican Theorist: Sequencing is controlling. The system determines the cost of access in terms of time and uncertainty. But the deeper issue is the appeal mechanism. When a citizen contests a ranking, that contestation is ingested as training data. It adjusts the weighting parameters for future users, but it grants the contesting citizen no standing over the procedure itself. They are feeding the machine that ranks them, not negotiating with the authority that built it.

  Negative-Liberty Theorist: Because the procedure was adopted by the citizens' assembly three years ago. It's statutory. The contractor is bound by the assembly's mandate, and the assembly is a past expression of collective will. Currently, no human agent is deliberately obstructing anyone. Your clause condemns the system on the basis of what a power-holder could do, rather than on any actual obstacle. You're turning freedom into a report about fear. If the contractor *could* lock someone out but doesn't, your view says the citizen is unfree.

  Republican Theorist: It is not about fear. It is about status. If I live in a house because the landlord chooses not to evict me, I am secure only so long as his will remains benevolent. I stand subject to his arbitrary power. Apply your own principle here: If the contractor decided tomorrow to block anyone with a surname starting with 'Z', but no 'Z's applied this month, your clause certifies them. There is no actual interference. No option was removed from a specific agent. Yet intuitively, that system is tyrannical. Your criterion allows benevolent domination.

  Negative-Liberty Theorist: That intuition is precisely what needs scrutiny. If no one is actually stopped, what harm is done? But let's look at your dominator. Who is it here? The contractor has no interest; they are paid to maintain the pipeline. The code is static unless retrained. The assembly is long dissolved. The statute binds the contractor. Power is dispersed across a training pipeline, a contract, and a mandate. None of these has a will to impose. Who is the dominator when the power is structural rather than agential?

  Republican Theorist: The dominator is the structure that denies contestability. The assembly's mandate established the objective function, but it did not establish a mechanism for citizens to alter that function individually. The feedback channel creates the illusion of recourse while reinforcing the system's logic. The citizen cannot say "no" to the procedure, only "no" to the output, which penalizes them via the queue. That is arbitrary power because it is uncheckable by the affected party.

  Negative-Liberty Theorist: Uncheckable by the individual, yes. But checkable by the legislature. If the system becomes oppressive, the city council can amend the statute. That is the check. To require individual standing over the algorithmic procedure is to demand positive liberty—self-mastery over the rules. I am talking about non-interference. Here is a fact we can check: the refusal rate. If citizens are declining ranked offers at a high rate without penalty beyond queue time, they are exercising choice.

  Republican Theorist: The refusal rate is beside the point. A slave who is rarely beaten is still a slave. The observable fact that matters is the log of appeals versus the ability to halt retraining. Can a citizen stop their data from updating the model during a dispute? No. The system continues to learn from their contestation even as it denies their specific claim. That captures the domination: their resistance is consumed as fuel for the power they resist.

  Negative-Liberty Theorist: I will concede that the opacity of the retraining loop is problematic. If the citizen cannot know how their data is weighted, that creates an information asymmetry that looks like interference. If we add a transparency requirement—that the specific weight of an appeal be visible within forty-eight hours—it mitigates the uncertainty. That narrows the gap. I can accept that unknown constraints function like actual constraints.

  Republican Theorist: I will concede that actual blocking is worse than potential control. If the system were to physically prevent access to the general queue, that would be a violation on my view as well, and immediately so. We agree that hard barriers are unacceptable. But transparency does not solve the standing issue. Knowing how you are dominated does not stop the domination. The clause needs to address the inability to alter the procedure, not just the visibility of the parameters.

  Negative-Liberty Theorist: Then we are back to the assembly. The procedure is out of any individual's reach because it was democratized years ago. To give individual standing now is to veto the past assembly. Are you arguing that democratic law is domination if I disagree with it?

  Republican Theorist: I am arguing that automated enforcement without individual recourse transforms law into force. The assembly mandated a service, not a black box. But let's isolate the fact again. Look at the queue time differential. If the ranked slot is immediate and the general queue is six months, is the choice to decline real?

  Negative-Liberty Theorist: It is real if it is physically possible. The six months is a resource scarcity issue, not a liberty issue. The system didn't create the scarcity; it manages it.

  Republican Theorist: It manages it by assigning priority based on opaque criteria derived from past behavior. That is the arbitrary will. Not the will of a person, but the will of the system's design, which no one currently controls.

  Negative-Liberty Theorist: So your certification clause requires what? A veto power?

  Republican Theorist: It requires a channel that allows a citizen to suspend the use of their data for retraining pending a review of the ranking logic itself, not just the output.

  Negative-Liberty Theorist: That halts the system's learning. It interferes with the municipal function. You are prioritizing the citizen's control over the machine's efficiency.

  Republican Theorist: I am prioritizing the citizen's status as a non-subject.

  Negative-Liberty Theorist: And I am prioritizing the citizen's range of action. If I write "No system shall reduce the set of available options," I certify this. If I write "No system shall hold power uncheckable by the user," I cannot.

  Republican Theorist: Then the crux is whether the clause protects the option set or the power relation.

  Negative-Liberty Theorist: Precisely. If I sign your wording, I certify that potential power is equivalent to actual interference. I cannot do that.

  Republican Theorist: And if I sign yours, I certify that a benevolent cage is freedom. I cannot do that.

  Negative-Liberty Theorist: So we deadlock on the definition of "subject to." Does it mean "acted upon" or "liable to be acted upon"?

  Republican Theorist: It means "liable." The liability is the unfreedom.

  Negative-Liberty Theorist: Then the clause fails. The system does not act upon them unless they choose to engage.

  Republican Theorist: Then the certification fails. The liability exists regardless of engagement.

  Negative-Liberty Theorist: We need to flag this for the full committee. The text cannot accommodate both conditions.

  Republican Theorist: Agreed. The draft remains split. Clause 4.B stays in brackets.
