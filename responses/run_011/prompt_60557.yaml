answer: |-
  # Activity Package: The Unreachable Node

  ## 1. Pairing and Rotation Scheme
  **Configuration:** 26 students = 13 tables (2 students per table).
  **Roles:** Assign seats as **Player 1 (Left)** and **Player 2 (Right)**. Do not swap roles between rounds. This anchors their decision-node parity (P1 owns odd nodes, P2 owns even nodes).
  **Rotation:** **No partner rotation.** Keep pairs fixed for both rounds.
  *   *Rationale:* Rotating partners introduces variables about trust and reputation that distract from the logical paradox. Keeping partners constant isolates the *structural* change of the game as the sole variable. The cognitive dissonance must stem from the rules, not the person.
  **The Unannounced Structural Difference:**
  *   **Round 1:** Standard Centipede (Start at Node 1).
  *   **Round 2:** Truncated Centipede (Start at Node 4). The physical handout changes, but the verbal instruction merely says "New Round." Students discover the start node when they open the packet.

  ## 2. Payoff Table and Currency
  **Currency:** **Seminar Participation Points (SPP).**
  *   **Conversion:** 1 SPP = 0.25% added to the final "Participation" grade component.
  *   **Cap:** Maximum 5 SPP earnable per student per day. (This prevents grade anxiety from overwhelming the logic, but keeps stakes non-trivial).
  *   **Non-Zero-Sum:** Both players can earn points simultaneously; one's gain does not require the other's loss.

  **The Tree (6 Nodes):**
  Payoffs are listed as **(Player 1, Player 2)**.

  *   **Node 1 (P1):** **TAKE** (2, 0) | **PASS** → Node 2
  *   **Node 2 (P2):** **TAKE** (1, 3) | **PASS** → Node 3
  *   **Node 3 (P1):** **TAKE** (4, 2) | **PASS** → Node 4
  *   **Node 4 (P2):** **TAKE** (3, 5) | **PASS** → Node 5
  *   **Node 5 (P1):** **TAKE** (6, 4) | **PASS** → Node 6
  *   **Node 6 (P2):** **TAKE** (5, 7) | **END** (4, 6)

  **Defense of Ratios:**
  1.  **Backward Induction (BI) Stability:** At every node, the "Take" payoff for the actor is strictly higher than the payoff they receive if they "Pass" and the opponent "Takes" at the very next node. (e.g., at Node 5, P1 gets 6 for Take, but only 4 if they Pass and P2 Takes at Node 6). This ensures the unique Subgame Perfect Equilibrium is *Take at Node 1*.
  2.  **Cooperative Temptation:** The *joint* payoff increases as the game proceeds (2 → 4 → 6 → 8 → 10 → 12). This motivates the "irrational" play that makes the paradox vivid.
  3.  **Asymmetry:** The payoffs alternate advantage. P1 does better on odd Takes; P2 does better on even Takes. This prevents a simple "split the difference" collusion strategy and forces reliance on the specific node logic.

  ## 3. Elicitation of Predictions (The "Contingency Plan")
  **Material:** A sealed envelope on each table containing two sheets: **Game A** and **Game B**.
  **Instruction:** Before opening the envelope or seeing the payoffs, hand out the **"Strategic Commitment Sheet."**

  **Sheet Text:**
  > "You must commit to a plan before seeing the game board. For every node you *could* possibly reach, circle your move. You cannot change this sheet once play begins.
  >
  > **Player 1:** If you reach Node 1, will you TAKE or PASS? If you reach Node 3, will you TAKE or PASS? If you reach Node 5, will you TAKE or PASS?
  > **Player 2:** If you reach Node 2, will you TAKE or PASS? If you reach Node 4, will you TAKE or PASS? If you reach Node 6, will you TAKE or PASS?"

  **Collection:** Collect these sheets immediately after completion. Do not return them until the final debrief. This prevents students from quietly revising their logic to match their actual play.

  ## 4. The Core Mechanic: The Epistemic Rupture
  **Timing:** Begin Round 2 immediately after debriefing Round 1 results (see Timeline).
  **Setup:** Students open the "Game B" envelope. The board printed inside **starts at Node 4**. Nodes 1–3 are greyed out with the text: *"History Fixed: PASS, PASS, PASS."*

  **Instructor Script (Read Aloud):**
  > "In this round, the game begins at Node 4. It is Player 2's turn. The history of this game is fixed: Player 1 passed at Node 1, Player 2 passed at Node 2, Player 1 passed at Node 3.
  >
  > **Crucial Constraint:** You must treat this history as a fact of the world, not a mistake. No one misread the sheet. No one trembled. No one was irrational. This is simply where the game begins. Player 2: You are at Node 4. You know the payoffs. You know your partner is rational. You know they know you are rational. Make your choice."

  **What to Withhold:** Do not explain *why* the history is fixed. Do not offer a probabilistic justification (e.g., "assume there's a chance they are nice"). Force them to sit in the contradiction.

  **Predicted Student Reaction (First 10 Seconds):**
  *   **The Confident BI Student:** Will pause, look at the "History Fixed" text, look at their Partner, and then look back at you. They will likely say: *"But if they were rational, they wouldn't have passed at 3. So I can't be here."*
  *   **The Instructor Response:** *"You are here. The sheet says you are here. The rules say they are rational. Decide."*
  *   **The Result:** The student experiences the withdrawal of support. Their logic (BI) told them this node is impossible. Their eyes tell them it is actual. They have no rule to govern "Impossible Actualities." They will likely hesitate significantly longer than in Round 1, or laugh nervously. This hesitation is the learning objective.

  ## 5. Minute-by-Minute Timeline & Debrief

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00–10** | **Setup & Grouping** | Assign seats (P1/P2). Distribute Commitment Sheets. Collect Sheets. |
  | **10–25** | **Round 1 Play** | Open Game A Envelopes. Play Standard Centipede. Record outcomes on board. |
  | **25–35** | **Round 1 Debrief** | Compare outcomes to Commitment Sheets. Ask: "Who planned Take but Passed?" (Do not explain why yet). |
  | **35–40** | **Round 2 Setup** | Distribute Game B Envelopes. **Do not announce the truncation.** Let them discover it. |
  | **40–50** | **Round 2 Play** | Play Truncated Centipede. Observe the hesitation at Node 4. |
  | **50–75** | **Core Debrief** | See sequence below. |
  | **75–80** | **Naming & Close** | Reveal "Centipede Paradox." Assign reading. |

  **Debrief Question Sequence (50–75 mins):**
  *Map these questions to the students' actual written Commitment Sheets and Round 2 behavior.*

  1.  **The Induction Step:** "Look at your Commitment Sheet from the start of class. How many of you circled 'Take' for the final node (Node 6 or Node 2 in Round 2)?" *(Establishes acceptance of the final step).*
  2.  **The Assumption:** "For those who circled 'Take' at Node 1 (Round 1): You did this because you believed Player 2 would 'Take' at Node 2. Why did you believe that?" *(Elicits: "Because they are rational/trying to win.")*
  3.  **The Survival of Reasoning:** "In Round 2, Player 2s: You were placed at Node 4. Your Commitment Sheet likely says 'Take' here. But to get here, Player 1 had to Pass at Node 3. If Player 1 is rational, they should have Taken at 3. What does Player 1's Pass tell you about their rationality?" *(Forces the update: If they passed, they aren't playing BI.)*
  4.  **The Counterfactual:** "If Player 1 is *not* playing BI, does your reason for Taking at Node 4 still hold? If they are irrational enough to Pass at 3, might they not Pass at 5? If so, shouldn't you Pass at 4?" *(Shows the collapse: BI justifies Take, but the presence at Node 4 disproves the conditions required for BI.)*
  5.  **The Loss of Footing:** "So, in Round 2, did anyone feel they *knew* what they were allowed to do? Or did you feel like the rulebook had been burned?" *(Validates the epistemic anxiety).*
  6.  **The Naming:** "This is not a puzzle about greed. It is the **Centipede Paradox** (or the Paradox of Backward Induction). It demonstrates that Common Knowledge of Rationality is incompatible with reaching later nodes."

  ## 6. Predictable Failures & Mitigations

  | Failure Mode | Prediction | Mitigation (No extra materials) |
  | :--- | :--- | :--- |
  | **Collusion** | Pairs agree beforehand to "Pass" all the way to maximize joint SPP. | **The Silence Rule:** Announce before Round 1: "Talking during play voids SPP for both players." Walk the room. If you hear planning, stop the table and reset their payoff to zero for that round. |
  | **Currency Failure** | Students treat SPP as trivial and play randomly. | **Salience Check:** At minute 5, ask: "Who wants 5 SPP?" When hands go up, say: "That is 1.25% of your grade. Play accordingly." |
  | **Speed/Idleness** | Pairs finish Round 1 in 90 seconds and sit idle. | **Mandatory Reflection:** "After you make your move, you must write down *one sentence* on why you made it on the back of the game sheet before revealing the outcome." This forces cognitive engagement and slows the pace. |
  | **The Spoiler** | A student with GT training shouts "Just Take at Node 1!" | **The "Intuition" Frame:** Before play begins: "This is a seminar on *deliberation*, not solutions. If you announce the equilibrium solution before play, you are disqualified from SPP for that round because you have bypassed deliberation." |

  ## 7. Limitations & Instructor Closing Argument
  **Explicit Statement of Limitation:**
  This activity **cannot reproduce Common Knowledge of Rationality (CKR).**
  In the game theoretic proof, CKR is a premise. In this room, CKR is false. Students know each other socially; they know humans are not perfect logic engines. They know *you* (the instructor) are manipulating the setup.

  **Your View vs. The Deeper Limitation:**
  You stated: *"No classroom can generate genuine common knowledge of rationality... students will in fact be doing is reasoning about the dispositions of acquaintances rather than about rationality as such."*

  **Assessment:** You are correct, but there is a sharper limitation you must supply in the closing argument.
  The deeper limitation is **Counterfactual Stability.**
  *   **The Activity's Limit:** Students resolve the paradox by dropping the "Rationality" assumption (i.e., "My partner is nice").
  *   **The Argument You Must Supply:** The paradox is not that people are nice. The paradox is that **if** we assume CKR, the later nodes are *logically inaccessible*. Therefore, there is *no* rational move defined for Node 4 under CKR. The theory doesn't say "Take"; it says "This state does not exist."
  *   **Closing Script:** "You resolved the tension by deciding your partner was 'nice' or 'irrational.' That is a sensible human reaction. But the formal paradox is harder. It claims that if you *insist* on Common Knowledge of Rationality, you cannot form a belief about Node 4 at all. The theory eats its own tail. It tells you how to play at Node 1 by assuring you Node 4 will never happen. When I force you to Node 4, the theory offers no advice, because it has already declared your presence impossible. You are not playing a game anymore; you are playing in the wreckage of the model."

  **Why this matters:** This prevents them from leaving with the comforting thought that "Game Theory fails because people are kind." They must leave with the unsettling thought that "Game Theory fails because its core assumptions destroy the context required to use them."
