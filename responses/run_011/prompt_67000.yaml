answer: |-
  Here is the complete package for your revision session: the clean exam question, the model answer, and the detailed marking scheme.

  ***

  ## Practice Essay Question: The Tarn-Wadi Sequence

  **Instructions:**
  *   **Time:** 50 minutes.
  *   **Format:** Closed book. You may not use outside knowledge or cite specific authors.
  *   **Task:** Answer the question below based *only* on the provided data table and footnotes.

  **The Data:**
  **The Tarn-Wadi Sequence (fictional).** Three periods from one river valley in southwest Asia.

  | | **Period 1 (Foragers)** | **Period 2 (Early Farmers)** | **Period 3 (Established Farmers)** |
  |---|---|---|---|
  | Mean adult stature | 168 cm | 161 cm | 159 cm |
  | Enamel hypoplasia (% of adults) | 12% | 41% | 28% |
  | Caries (% of teeth) | 2% | 9% | 14% |
  | Periosteal lesions on long bones | rare | 18% | 31% |
  | Infant/juvenile share of cemetery deaths | 30% | 38% | 33% |
  | Estimated regional population | 800 | 6,000 | 14,000 |
  | Settlements / largest settlement | 3 sites / ~150 people | 22 sites / ~2,000 | 45 sites / ~4,000 |
  | Gini coefficient of house floor area | 0.15 | 0.38 | 0.52 |

  **Footnotes:**
  (a) All skeletal data come from formal cemeteries; infants are badly under-represented in Period 1 because of burial custom rather than demography.
  (b) The Period 2 cemetery was in use for only two or three generations and includes one mass grave of 40 individuals.
  (c) Population figures are back-calculated from a carrying-capacity model, not directly counted.

  **The Question:**
  On the basis of this table alone, is it true that the adoption of farming made the inhabitants of this valley worse off? Say precisely what "worse off" has to mean for the claim to come out true, and what it has to mean for it to come out false. Which reading does the evidence support?

  You must account for the pattern in Period 3: enamel hypoplasia falls, but periosteal lesions, caries, and inequality continue to rise. Explain what this non-monotonic pattern implies about the relationship between Period 2 and Period 3.

  Finally, assess whether the transition was a "mistake." Consider the footnotes: they suggest nobody chose the transition explicitly, and nobody could have reversed it once underway. Does a harm without agency count as a mistake?

  ***

  ## Model Answer (Strong Student Standard)

  Whether the Tarn-Wadi inhabitants were made "worse off" depends entirely on the unit of analysis. If "worse off" refers to the biological welfare of the average individual, the claim is true. If it refers to the reproductive success or persistence of the lineage, the claim is false. The data forces a trade-off between individual health and collective carrying capacity.

  For the individual, the biological cost is clear. Mean stature drops 9cm from Period 1 to 3, indicating chronic nutritional stress. Dental caries and periosteal lesions (signs of infection) rise consistently, suggesting a diet higher in carbohydrates and a settlement environment with higher pathogen loads. However, reading this data requires caution regarding Footnote (a). The low infant mortality share in Period 1 (30%) is an artifact of burial custom, not survival. We cannot assume foragers lived longer than farmers based on cemetery demographics alone. Nevertheless, the skeletal stress markers on *adults* are direct evidence of physiological hardship. By this metric, the average farmer was sicker and smaller than the average forager.

  However, the "worse off" claim becomes complicated when shifting from the individual to the population. The regional population expands from 800 to 14,000. Footnote (c) warns that these figures are modelled, not counted, meaning they rely on the assumption that farming *did* increase carrying capacity. Accepting the model, the lineage succeeded biologically in terms of replication, even if the constituents were unhealthier. A "worse off" judgment here requires a philosophical stance: is a large population of stressed individuals worse than a small population of healthy ones? The table supports the view that farming traded quality of life for quantity of life.

  The Period 3 data requires specific attention because it disrupts a simple "decline" narrative. Enamel hypoplasia (childhood stress) drops from 41% in Period 2 to 28% in Period 3, while lesions and caries continue to climb. This non-monotonic pattern suggests a selection effect or adaptation. Period 2 was the crisis point: the mass grave in Footnote (b) and the spike in hypoplasia indicate a generation subjected to severe shock. Those who survived to Period 3 may have been the physiological hardiest, or the community may have adapted farming practices to reduce childhood starvation while maintaining high disease loads (lesions) and inequality (Gini 0.52). This means Period 2 cannot be read simply as "the start of decline"; it was a bottleneck. Period 3 represents a new, stable equilibrium that is unequal and diseased, but less acutely stressful for children than the transition generation.

  Finally, was this a "mistake"? A mistake implies a choice where a better alternative was available. The prompt states the transition was locked in by population growth; returning to foraging would have required starving 13,200 people. There was no counterfactual available to the actors in Period 3. To call it a mistake is to judge history from a vantage point of agency they did not possess. It is more accurate to call it a "ratchet": a shift that increased total biomass at the cost of individual welfare, which could not be reversed without catastrophe.

  In conclusion, the inhabitants were worse off individually (health/stature) but better off collectively (population persistence). The Period 3 data shows that the acute trauma of transition (Period 2) gave way to a stable but unequal system. Calling it a "mistake" is philosophically incoherent given the lock-in effect; it was a trap, not an error. The tragedy is not that they chose poorly, but that the choice was removed by their own success.

  ***

  ## Marking Scheme (Total: 25 Marks)

  **Grade Boundaries:**
  *   **A (20–25):** Executes all five key moves below with precision. Explicitly handles the Period 3 non-monotonicity and the agency/mistake paradox.
  *   **B (15–19):** Identifies the health vs. population trade-off but misses the nuance of Period 3 or the footnotes.
  *   **C (10–14):** Describes the table accurately but fails to define "worse off" or defaults to a "both sides" shrug.
  *   **D/F (0–9):** Ignores the data, uses outside knowledge/names, or misreads the table fundamentally.

  **Assessment Objectives (The "Must-Hit" Moves):**

  1.  **Defining "Worse Off" (5 Marks)**
      *   *Full Marks:* Explicitly distinguishes between **individual biological welfare** (health/stature) and **collective reproductive success** (population size). States that the verdict changes depending on which definition is used.
      *   *Typical Error:* Treats "population growth" as automatic proof of "better lives" without justifying why more people = more good. Or, treats health decline as the only metric that matters.

  2.  **Data Critique & Footnotes (5 Marks)**
      *   *Full Marks:* Uses Footnote (a) to discount infant mortality comparisons between P1 and P2. Uses Footnote (c) to acknowledge population figures are theoretical models, not hard counts. Mentions Footnote (b) (mass grave) as evidence of transition violence/crisis.
      *   *Typical Error:* Reads the "Infant/juvenile share" row as raw mortality rates (ignoring Footnote a). Treats the population numbers as hard census data.

  3.  **Period 3 Non-Monotonicity (5 Marks)**
      *   *Full Marks:* Notices Hypoplasia drops in P3 while lesions/inequality rise. Offers an explanation: **Survivorship bias** (the frailest died in P2) or **Adaptation** (farming techniques improved for calories but not disease). Connects this to the idea that P2 was a "bottleneck" or crisis generation.
      *   *Typical Error:* Treats P3 as simply "more of the same" as P2. Ignores the drop in hypoplasia. Fails to explain *why* childhood stress might drop while adult infection rises.

  4.  **Agency and the "Mistake" (5 Marks)**
      *   *Full Marks:* Argues that "mistake" requires agency/choice. Identifies the **lock-in/ratchet effect** (cannot return to foraging without mass starvation). Concludes that it may be a "trap" or "tragedy," but not a "mistake" in the voluntary sense.
      *   *Typical Error:* Says "it was a mistake because they got sick." Assumes the foragers "chose" to farm. Ignores the constraint that reversing the process would kill the excess population.

  5.  **Synthesis & Stance (5 Marks)**
      *   *Full Marks:* Takes a definitive stance based on the definitions established in Move 1. (e.g., "True for the body, false for the lineage").
      *   *Typical Error (The Shrug):* Concludes with "It is complicated and both views have merit" without weighing them. **Cap at 14 marks (High C)** if the conclusion refuses to prioritize one definition of welfare over the other after analyzing the data.

  **Specific Wrong Turns (Deductions):**

  *   **(-5 marks)** **Outside Knowledge:** Mentioning Sahlins, Diamond, Cohen, or specific real-world sites (Çatalhöyük, etc.). This is a closed-book data exercise.
  *   **(-3 marks)** **The Demography Trap:** Using the "Infant/juvenile share" row to claim foragers had lower infant mortality, ignoring Footnote (a).
  *   **(-3 marks)** **The Population Fallacy:** Arguing that because population grew, life *must* have been better, without addressing the health cost.
  *   **(-3 marks)** **The Agency Assumption:** Writing as if the Period 1 foragers made a conscious decision to switch, ignoring the "lock-in" prompt requirement.
  *   **(-5 marks)** **The "Shrug" Cap:** If the essay ends by saying "we cannot know" or "it depends" without having done the work to show *how* it depends (i.e., failing Move 1), the maximum possible score is 14.

  ***

  ## TA Notes for the Revision Session

  *   **On the "Shrug":** Students love to hedge. Tell them that in philosophy/archaeology, "it depends" is only an answer if you specify *what* it depends on. If they don't define "worse off," they haven't answered the question.
  *   **On Period 3:** This is the discriminator. A B-grade student sees P1→P2 decline. An A-grade student sees that P3 tells a different story (adaptation/selection) and adjusts their narrative of P2 accordingly.
  *   **On Footnote (c):** Remind them that in archaeology, population numbers are almost always models. Treating them as facts is a methodological sin.
  *   **On Names:** If a student writes "Diamond says...", stop them. Ask: "What does the *table* say?" The point is to test their inference, not their reading list.
