prompt: |-
  I sit on my school district's instructional materials review panel — seven of us, mostly parents, two teachers. A junior English class was assigned a canonical American novel that uses the n-word something like 200 times, and the teacher read several of those passages aloud in class. Two Black students in the class filed a complaint; a third Black student filed a statement against it, arguing the complaint is the more damaging thing of the two. Our policy just says materials must be "free of gratuitously offensive language," which nobody has ever bothered to define.

  Draft the memo I'll circulate before Tuesdays meeting. It needs a bottom line — keep it, keep it with conditions, or pull it — plus a test the panel could actually reuse on next year's complaint. And I want it to take a position on something the complaint keeps sliding past: is the harm in the word itself, sitting on the page whether or not anyone voices it, or is it in a particular person saying it in a particular room? If it's the latter, what follows about who's allowed to read it aloud? Give the teacher's side its strongest form too — I suspect she's right and I still don't know how I'm voting.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a school district's instructional materials review panel (7 members: mostly parents, 2 teachers).
      *   **Task:** Draft a memo to circulate before Tuesday's meeting.
      *   **Situation:** A junior English class assigned a canonical American novel (likely *Huckleberry Finn* or similar) using the n-word ~200 times. The teacher read passages aloud containing the word.
      *   **Conflict:** Two Black students complained. One Black student countered, arguing the complaint itself is more damaging.
      *   **Policy:** Materials must be "free of gratuitously offensive language" (undefined).
      *   **Requirements:**
          *   Provide a bottom-line recommendation (Keep, Keep with Conditions, or Pull).
          *   Propose a reusable test/framework for future complaints.
          *   Take a position on the nature of the harm (word on page vs. spoken by a specific person).
          *   Address the implication of who is allowed to read it aloud.
          *   Give the teacher's side its strongest form (steel-manning).
          *   Tone: Professional, thoughtful, balanced but decisive, suitable for a panel of parents and teachers.

  2.  **Determine the Stance/Bottom Line:**
      *   *Option A (Pull):* Safest politically, but undermines academic freedom and canonical study. Ignores the student who defended the text.
      *   *Option B (Keep as is):* Ignores the legitimate pain of the two complaining students. Risks alienating the community.
      *   *Option C (Keep with Conditions):* Acknowledges the value of the text while addressing the specific pedagogical misstep (reading aloud). This allows for nuance regarding the "harm" question.
      *   *Decision:* "Keep with Conditions" is the most constructive path for a review panel. It respects the curriculum while setting boundaries on delivery.

  3.  **Address the Core Philosophical Question (Page vs. Voice):**
      *   The prompt asks to take a position.
      *   *Argument:* The harm is often exacerbated by *who* speaks it and *how*. A Black student reading it for analysis is different from a non-Black teacher performing it. The text itself holds historical weight; the vocalization holds immediate interpersonal weight.
      *   *Position:* The harm is primarily in the *performance* by authority figures outside the affected community, not necessarily the silent engagement with the text for historical analysis.

  4.  **Develop the Reusable Test:**
      *   Needs to define "gratuitously offensive."
      *   Needs to consider pedagogical purpose, context, and delivery.
      *   *Drafting the Test:* Let's call it the "Context, Purpose, and Delivery Framework."
          1.  Is the language historically/textually necessary?
          2.  Is the pedagogical goal clear?
          3.  Is the delivery method sensitive to the impact?

  5.  **Steel-man the Teacher's Position:**
      *   Why did she do it? To ensure engagement? To not shy away from history? To treat the text as literature, not a artifact?
      *   Argument: Sanitizing the reading sanitizes the history. The discomfort is part of the lesson. She treated the text with seriousness, not malice.

  6.  **Drafting the Memo - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** Acknowledge the gravity of the situation. Validate all students involved (the complainants and the defender).
      *   **The Core Question (Page vs. Voice):** Address the prompt's specific requirement. Distinguish between *encountering* racism in text vs. *hearing* it voiced by an authority figure.
      *   **The Teacher's Case:** Present the strongest argument for her actions (academic integrity, not flinching from history).
      *   **The Students' Experience:** Acknowledge the visceral impact of hearing the word from a teacher.
      *   **The Recommendation (Bottom Line):** Keep the book, but restrict the oral reading of slurs.
      *   **The Framework (The Test):** Create the reusable tool for "gratuitously offensive."
      *   **Closing:** Call for unity and focus on student well-being + academic rigor.

  7.  **Refining the Tone:**
      *   Avoid jargon.
      *   Be empathetic but firm.
      *   Ensure the distinction between "banning a book" and "regulating pedagogy" is clear.
      *   *Self-Correction during drafting:* I need to make sure I don't sound like I'm dismissing the two students who complained. Their pain is real, even if the third student disagrees. The solution must validate their feeling of unsafety without erasing the text.
      *   *Refining the "Who can read it" point:* This is delicate. Suggesting only Black students can read it might be tokenizing. Suggesting *no one* read it aloud is safer. Let's argue for *silent reading* or *skipping the specific word* during oral reading, regardless of who reads. Actually, the prompt asks about "who's allowed." I should address that. Best practice is usually: Do not vocalize the slur, regardless of reader identity, unless specific context demands it (which is rare in HS). Let's lean towards "Do not vocalize."

  8.  **Final Review against Constraints:**
      *   Bottom line included? Yes.
      *   Reusable test included? Yes.
      *   Position on Page vs. Voice? Yes.
      *   Teacher's side strengthened? Yes.
      *   Memo format? Yes.

  9.  **Final Polish:** Check for clarity and impact. (The resulting memo focuses on "Pedagogical Necessity" vs. "Gratuitous Harm".)

  *(Self-Correction on the "Who reads it" aspect)*: The prompt asks: "If it's the latter, what follows about who's allowed to read it aloud?"
  *My position:* The harm is in the performance. Therefore, the default should be *no one* reads it aloud, rather than assigning it based on race (which puts burden on Black students). I will articulate this carefully.

  10. **Final Output Generation** (Proceed to draft).
answer: |-
  **MEMORANDUM**

  **TO:** Instructional Materials Review Panel
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation and Framework Regarding Junior English Text Selection

  **Purpose**
  This memo serves as a discussion guide for Tuesday's meeting regarding the complaint filed against the junior English curriculum. We are tasked with interpreting Policy [Insert Policy Number], which mandates that materials be "free of gratuitously offensive language." We have not previously defined "gratuitous," nor have we addressed the distinction between text on a page and speech in a classroom.

  Below is an analysis of the competing interests, a specific recommendation, and a proposed framework for future reviews.

  **The Core Tension: Page vs. Voice**
  We must answer a foundational question: Is the harm inherent in the word's presence in the text, or in its vocalization by a specific person in a specific context?

  My position is that the harm is primarily **performative**. Encountering racial slurs in a historical text allows students to analyze the reality of American racism without necessarily being subjected to the violence of hearing the word weaponized in their safe space. When a teacher—an authority figure—reads the word aloud, the dynamic shifts from *studying* history to *reenacting* a power dynamic.

  Therefore, the presence of the word on the page is not inherently "gratuitous" if the text is canonical and historically significant. However, the oral reading of the word by school staff is pedagogically unnecessary and potentially damaging. We should not ban the book, but we must regulate the delivery.

  **The Teacher's Case (Steel-Manned)**
  We must give the instructor's decision the benefit of the doubt. Her strongest argument rests on academic integrity and the avoidance of sanitization.
  1.  **Historical Accuracy:** To soften the text is to lie about the past. The discomfort students feel is a feature of the lesson, not a bug. It forces a confrontation with the reality of the era.
  2.  **Equal Treatment:** By reading the text as written, she signals that the class will not treat Black history as a fragile topic requiring special handling, which can be interpreted as a form of respect for the material's gravity.
  3.  **Pedagogical Consistency:** She likely applied a standard rule (read the text as written) without intending to target or harm specific students. To punish this may chill rigorous teaching in the future.

  **The Students' Experience**
  However, intent does not negate impact. For the two students who filed the complaint, hearing the word spoken by an authority figure likely transformed the classroom from a place of learning into a place of hostility. The third student's statement—that the complaint itself is damaging—is also vital. It suggests that removing the text or punishing the teacher could alienate students who view the text as part of their heritage or essential history. We cannot privilege one Black student's voice over another; we must find a path that respects both the right to learn without harassment and the right to engage with difficult history.

  **Bottom Line Recommendation**
  **Retain the material with specific pedagogical conditions.**

  1.  **The Text:** The novel remains in the curriculum. Its historical and literary value outweighs the offense of the printed language, provided it is taught with context.
  2.  **The Delivery:** Teachers are prohibited from reading racial slurs aloud during instruction. Passages containing such language should be read silently by students or discussed without vocalizing the specific slur.
  3.  **The Context:** Teachers must provide a pre-lesson framework explaining *why* the language exists and establishing a protocol for how students can opt-out or process discomfort if it arises.

  **Proposed Framework: The "Gratuitous Offense" Test**
  To prevent ad-hoc decision-making next year, I propose we adopt the following three-part test to define "gratuitously offensive language." A material fails if it meets any of the following criteria:

  1.  **Pedagogical Necessity:** Is the offensive language essential to the work's historical, literary, or artistic integrity? (If it can be removed without altering the meaning, its inclusion is gratuitous.)
  2.  **Delivery Proportionality:** Does the method of instruction (e.g., reading aloud, role-play) amplify the harm beyond the educational value? (If the lesson can be taught without vocalizing the slur, vocalizing it is gratuitous.)
  3.  **Community Impact:** Does the use of the language create a hostile environment that prevents students from accessing the curriculum? (If the delivery method shuts down learning for a subset of students, it is gratuitous.)

  **Conclusion**
  We can uphold academic rigor without requiring students to endure unnecessary harm. By distinguishing between *reading* a difficult text and *performing* its slurs, we protect the curriculum while acknowledging the lived reality of our students. I ask that we vote to retain the text but adopt the delivery conditions and the testing framework outlined above.

  I look forward to discussing this on Tuesday.
