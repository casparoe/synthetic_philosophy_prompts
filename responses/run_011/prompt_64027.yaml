answer: |-
  **Bottom Line:** No, there is no such rule. You will not be embarrassed; you are bumping against a mathematical proof.

  **Reasoning:**
  This situation has a name: **Arrow's Impossibility Theorem**. It proves that no ranked-choice voting system can satisfy all four criteria you listed (always producing a winner, respecting unanimous preference, Independence of Irrelevant Alternatives, and non-dictatorship) when there are three or more options. The cycles, strategic voting, and winner-flipping you experienced are inevitable flaws of ranked systems under these constraints.

  Is letting the chair pick worse? Logically, no. A dictator satisfies your first three rules perfectly. A single decision-maker guarantees Independence of Irrelevant Alternatives (dropping C won't change A vs. B) and always produces a winner. It is more stable than your current chaos, only failing your fourth rule against one person deciding.

  **Recommendation:**
  Stop using ranked ballots. Switch to **Approval Voting** (each member votes for every roofer they find acceptable; highest approvals wins). This avoids cycles and reduces strategic incentive, though it still cannot perfectly escape Arrow's constraints. Alternatively, discuss until consensus is reached rather than voting.
