  ### Part IV: Blind Spots
  Two pairs of leaves look identical to a lay reader but diverge on formalism.

  1.  **Hollow Immortality (Leaf D) vs. Prudential Rejection (Leaf E):**
      *   *Lay View:* Both say "Don't step in the box."
      *   *Formal Separation:* Does the survivor have **measure zero** (Hollow) or **finite measure** (Prudential)? This requires understanding the Born Rule derivation.
  2.  **Classical Exit (Leaf A) vs. Single-Mind Escape (Leaf B):**
      *   *Lay View:* Both say "You die."
      *   *Formal Separation:* Is the wave function **collapsed** (Classical) or **branching without the mind** (Single-Mind)? This requires inspecting the Schrödinger equation's linearity.

