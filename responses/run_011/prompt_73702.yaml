answer: |-
  # Sidebar: The Quantum Survival Guide

  ### Part I: The Logical Space
  To find your position, answer these eleven questions. They are arranged from fundamental physics to personal choice. Note that some questions only matter if you answer "Yes" to earlier ones.

  1.  **Reality:** When a quantum event has two outcomes, do both happen in reality? *(Yes / No)*
  2.  **Mind:** If reality splits, does your conscious experience split into two streams? *(Yes / No)*
  3.  **Privilege:** Are human minds exempt from the splitting rules that apply to atoms? *(Yes / No)*
  4.  **Identity:** If a copy wakes up with your memories while you die, is that survival? *(Yes / No)*
  5.  **Expectation:** Before a split, should you expect to experience one outcome or all of them? *(One / All)*
  6.  **Weight:** Do outcomes with tiny probabilities count less than likely ones? *(Yes / No)*
  7.  **Counting:** Is there a specific number of branches, or is that meaningless? *(Number / Meaningless)*
  8.  **The Box:** If you survive a deadly quantum game 1,000 times, does the rarity bother you? *(Yes / No)*
  9.  **Stability:** In branches where you survive a catastrophe, is the world coherent enough to notice? *(Yes / No)*
  10. **The Dimmer:** Does death cut consciousness off, or does it fade across branches? *(Cut / Fade)*
  11. **Prudence:** Does knowing a copy survives give you a reason to take the risk? *(Yes / No)*

  **Logical Dependencies:**
  *   If **Q1 is No**, questions 2–11 are physically irrelevant; you exit at *Leaf A*.
  *   If **Q1 is Yes** but **Q2 is No**, you exit at *Leaf B* (Mind does not split).
  *   If **Q3 is Yes**, it overrides Q2 (Minds are special); you exit at *Leaf B*.
  *   If **Q6 is One**, you cannot hold the Strong Immortality view.
  *   If **Q9 is No**, you cannot hold the Strong Immortality view.

  ***

  ### Part II: The Destinations
  Follow your answers to find your philosophical address. Each position includes a gloss (12 words max) and its "awkward commitment"—what you must swallow to live there.

  **Leaf A: The Classical Exit**
  *Path: Q1 = No*
  **Gloss:** Reality chooses one outcome; the rest vanish instantly.
  **Awkward Commitment:** You must accept that most quantum possibilities are destroyed without a trace.
  *(Attribution: GRW Collapse or Bohmian Mechanics)*

  **Leaf B: The Single-Mind Escape**
  *Path: Q1 = Yes, Q2 = No (or Q3 = Yes)*
  **Gloss:** The world branches, but your mind follows only one path.
  **Awkward Commitment:** You must believe consciousness obeys different laws than the rest of physics.
  *(Attribution: Unnamed; variant of Many-Minds)*

  **Leaf C: The Strong Immortality Thesis**
  *Path: Q1=Yes, Q2=Yes, Q4=No, Q6=All, Q9=Yes*
  **Gloss:** You cannot die; you always find yourself in a surviving branch.
  **Awkward Commitment:** You must bet your life on the certainty that you are the lucky copy.
  *(Attribution: Associated with Tegmark's Quantum Suicide)*

  **Leaf D: The Hollow Immortality Verdict**
  *Path: Q1=Yes, Q2=Yes, Q4=Yes, Q8=Yes, Q9=No*
  **Gloss:** You survive technically, but your surviving self is statistically negligible.
  **Awkward Commitment:** You must admit you live on, but that your future hardly exists.
  *(Attribution: Unnamed; Decision-Theoretic Everettians)*

  **Leaf E: The Prudential Rejection**
  *Path: Q1=Yes, Q2=Yes, Q4=No, Q9=No*
  **Gloss:** Immortality is true, but you still have reason to avoid the box.
  **Awkward Commitment:** You must believe survival is guaranteed, yet acting on that guarantee is irrational.
  *(Attribution: Unnamed)*

  **Leaf F: The Reductio Verdict**
  *Path: Q1=Yes, Q2=Yes, Q4=Yes, Q8=Yes → Conclusion: Q1 must be False*
  **Gloss:** Quantum immortality proves the many-worlds theory is false.
  **Awkward Commitment:** You must reject the physics because you refuse to accept the survival conclusion.
  *(Attribution: Associated with Kent)*

  **Leaf G: The Parfitian View**
  *Path: Q4=Yes, Q3=Yes (Identity is continuity)*
  **Gloss:** Survival is a matter of degree, not an all-or-nothing switch.
  **Awkward Commitment:** You must accept that you can partially survive your own death.
  *(Attribution: Derek Parfit)*

  **Leaf H: The Fading Consciousness**
  *Path: Q10 = Fade*
  **Gloss:** Death is a dimmer switch across branches, not a sudden off.
  **Awkward Commitment:** You must accept that "you" exist in a state of gradual disintegration.
  *(Attribution: Unnamed)*

  ***

  ### Part III: Unmapped Territory
  These combinations of answers are logically permitted by the tree but defended by no one.

  1.  **The Chaotic Survivor (Q1=Y, Q2=Y, Q9=Y, Q8=N, Q5=N):** You should risk death because you survive, even if the surviving world is incoherent chaos.
      *   *Diagnosis:* **Incoherent.** If the world is not stable enough to notice (Q5/Q8), "survival" has no meaning for the observer.
  2.  **The Weighted Single-Mind (Q1=Y, Q2=N, Q4=Y):** The world splits, your mind does not, but you should care about the probability of the branches you *don't* inhabit.
      *   *Diagnosis:* **Unattractive.** It grants reality to other branches but denies your mind access to them, making "probability" a ghostly concern with no agent.
  3.  **The Counting Realist (Q1=Y, Q7=Number, Q4=No):** There is a definite number of branches, but they all count equally regardless of probability.
      *   *Diagnosis:* **Unexplored/Refuted.** Modern physics suggests branch "counting" is ill-defined; only amplitude (strength) is measurable.

