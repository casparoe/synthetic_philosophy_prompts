answer: |-
  # How to use it

  This instrument sorts philosophical positions on chance and credence by verdicts on concrete cases, not by allegiance to famous names. Your students may claim to follow the same theorist while holding incompatible views on admissibility, undermining, or normative force. This tree bypasses self-reporting. Ask students to answer each node as if it were isolated; do not let them adjust earlier answers to fit later theories. The tree measures operational commitments: what you would bet, what you would conditionalize on, and what you would call irrational. It deliberately does not measure metaphysical preferences unless those preferences force a divergence in credence assignments. Two students can share a metaphysics but land on different leaves if their norms differ. Use this to reveal that the disagreement is not about history but about the structure of rationality itself.

  # The nodes

  **Node 1: The Jinxed Coin**
  A single coin is flipped one million times. Every flip is heads. The true chance theory of this world states the chance of heads on each flip is 0.5, implying the chance of this specific million-heads history is effectively zero. You know the complete history and the true theory. What is your credence that flip one million and one is heads?
  *Split:* **Credence remains 0.5** (Deference to chance dominates history) vs. **Credence approaches 1** (Evidence of pattern dominates chance).

  **Node 2: The Undermining Future**
  You know the current chance theory $T$. $T$ assigns a non-zero chance to a future history $F$. However, if $F$ occurs, the best systematization of the whole history (including $F$) would yield a different chance theory $T^*$. Thus, $T$ assigns chance to its own falsity. Do you conditionalize on $T$ anyway?
  *Split:* **Conditionalize on $T$** (Ignore undermining) vs. **Adjust credence** (Account for $T$ being false if $F$ occurs).

  **Node 3: Uncertain Chance**
  You face a coin known to be biased, but you don't know the bias. Hypothesis $H_1$: Chance of heads is 0.7. Hypothesis $H_2$: Chance of heads is 0.3. You assign equal credence to $H_1$ and $H_2$. What is your credence in heads on the next flip?
  *Split:* **Weighted Average (0.5)** (Direct deference to expected chance) vs. **Conditionalization Result** (Deference only after resolving uncertainty).

  **Node 4: The Crystal Ball**
  You know the chance of rain is 0.1. You then look into a perfectly reliable crystal ball that shows you it will rain. This information is about the future outcome, not the chance setup. Do you update your credence in rain to 1?
  *Split:* **Yes, update to 1** (Information is admissible) vs. **No, stay at 0.1** (Information is inadmissible evidence).

  **Node 5: The Violation Penalty**
  An agent knows the chance of $A$ is $x$ but sets their credence in $A$ to $y$ (where $y \neq x$) without conflicting evidence. They are not Dutch-bookable due to other holdings. Is this agent irrational?
  *Split:* **Flat-out Incoherent** (Violation of constitutive norm) vs. **Merely Imprudent** (Violation of external norm).

  **Node 6: The Starting Line**
  Consider an agent with no evidence about the world (ur-prior). Does the requirement to match credence to chance apply to this agent's initial distribution, or only after they learn what the chances are?
  *Split:* **Constraint on Ur-Prior** (Built into rationality from start) vs. **Constraint on Update** (Applies only after learning chance claims).

  **Node 7: The Relativization Target**
  You learn the chance of $A$ is $x$. Do you conditionalize on the proposition "The chance of $A$ is $x$" alone, or must you conditionalize on the conjunction of that claim and the complete chance theory $T$?
  *Split:* **Chance Claim Only** (Local deference) vs. **Complete Theory Required** (Global deference).

  **Node 8: The Reflexive Chance**
  A chance hypothesis $H$ says: "The chance of $A$ is 0.5, and the rational credence in $A$ given $H$ is 0.9." You know $H$ is true. What is your credence in $A$?
  *Split:* **0.5** (Defer to chance value) vs. **0.9** (Defer to chance's instruction about credence).

  **Node 9: The Bayesian Sufficiency**
  You treat "The chance of $A$ is $x$" as a standard factual hypothesis $H$. You conditionalize on $H$ using standard Bayes rule from a reasonable prior. Does this automatically yield credence $x$ in $A$?
  *Split:* **Yes, Automatic** (PP is a theorem of Bayesianism) vs. **No, Extra Norm Needed** (PP is an additional principle).

  **Node 10: The Zero Chance Event**
  You have incontrovertible evidence that event $E$ occurred. However, the true chance theory assigns $E$ a chance of exactly 0. What is your credence in $E$?
  *Split:* **Credence 1** (Evidence trumps zero chance) vs. **Credence 0** (Zero chance trumps evidence).

  # Paths

  The following table maps dominant answer patterns to the Leaves identified below. Not all logical combinations are populated; some paths converge on the same doctrinal label despite minor variations.

  | Path Profile | Dominant Answers (Nodes 1-10) | Resulting Leaf |
  | :--- | :--- | :--- |
  | **A** | 1: 0.5; 2: Adjust; 3: Average; 5: Incoherent; 9: Extra Norm | **Lewisian Regularist** |
  | **B** | 1: 0.5; 2: Ignore; 5: Incoherent; 6: Ur-Prior; 9: Extra Norm | **Primitivist Deferer** |
  | **C** | 1: 0.5; 5: Incoherent; 6: Ur-Prior; 9: Automatic | **Ur-Prior Theoremist** |
  | **D** | 1: 1.0; 4: Update; 5: Imprudent; 10: Evidence Trumps | **Evidence Dominator** |
  | **E** | 1: 0.5; 5: Imprudent; 9: Extra Norm; 3: Conditionalize | **Unnamed** |

  *Note:* Path A accepts Humean supervenience but modifies the principle to handle undermining. Path B rejects Humean supervenience. Path C believes the principle falls out of rationality constraints without extra axioms. Path D rejects the principle in favor of direct evidence. Path E accepts the norm but views it as pragmatic rather than constitutive.

  # The leaves

  **Lewisian Regularist**
  *Doctrine:* Chance supervenes on the Humean mosaic, but rational credence must defer to chance via a modified principle that accounts for undermining futures.
  *Awkward Commitment:* You must assign non-zero credence to the chance theory being false even while using it to guide your credences.

  **Primitivist Deferer**
  *Doctrine:* Chance is a primitive physical magnitude that does not supervene on history, and rationality requires credence to match chance as a fundamental norm.
  *Awkward Commitment:* You must accept metaphysical magnitudes that make no difference to the actual pattern of events in the world.

  **Ur-Prior Theoremist**
  *Doctrine:* The principle is not an extra norm but a theorem derived from the requirements of rationality imposed on initial credence distributions.
  *Awkward Commitment:* You must claim there is a single uniquely rational ur-prior that all agents share before experience.

  **Evidence Dominator**
  *Doctrine:* Credence should track evidence directly; chance claims are just hypotheses about frequencies that are overridden by specific historical data.
  *Awkward Commitment:* You cannot explain why we rely on chance claims in prediction when specific evidence is unavailable or incomplete.

  **Unnamed**
  *Doctrine:* Deference to chance is a pragmatic rule for guiding action rather than a constraint on belief coherence or truth-tracking.
  *Awkward Commitment:* You allow that two agents with identical evidence and knowledge of chance can hold different credences without either being irrational.

  # Empty cells

  Several logical combinations of answers remain unoccupied in the literature. These gaps are not accidental; they reveal structural tensions in the conceptual space.

  **Cell 1: Incoherent Violation + Evidence Dominator**
  *Combination:* Claiming it is incoherent to violate the principle (Node 5) but also claiming evidence trumps chance (Node 1/10).
  *Diagnosis:* **Incoherent.** If violating the chance-credence link is constitutive of irrationality, you cannot permit evidence to override it without redefining "chance" to include evidence. This view collapses into Evidence Dominator with a different definition of chance, or Lewisian Regularist with a modified principle.

  **Cell 2: Ur-Prior Constraint + Automatic Theorem**
  *Combination:* Claiming the constraint applies only to ur-priors (Node 6) but also that it is a theorem of conditionalization (Node 9).
  *Diagnosis:* **Unattractive.** If it is a theorem of conditionalization, it applies to any agent who conditionalizes, not just those at the ur-prior stage. Restricting it to ur-priors while claiming it is a logical theorem suggests a misunderstanding of how theorems propagate through updates.

  **Cell 3: Humean Chance + No Undermining Adjustment**
  *Combination:* Claiming chance supervenes on history (Node 9 context) but refusing to adjust for undermining futures (Node 2).
  *Diagnosis:* **Incoherent.** If chance supervenes on the whole history, and the future affects the best system, then the current chance theory is probabilistically incompatible with certain futures. Ignoring this makes the credence assignment mathematically inconsistent with the metaphysical claim.

  **Cell 4: Reflexive Deference to Credence (Node 8: 0.9)**
  *Combination:* Deferring to the chance hypothesis's claim about credence rather than the chance value itself.
  *Diagnosis:* **Nobody's Bothered.** This leads to infinite regress loops (what if the chance says my credence should be different?). Most theorists assume chance constrains credence directly; having chance constrain credence via a command about credence adds unnecessary layers without predictive gain.

  **Cell 5: Zero Chance + Credence 0 (Node 10)**
  *Combination:* Maintaining credence 0 even when you have proof the event occurred.
  *Diagnosis:* **Incoherent.** This violates the basic Bayesian requirement that evidence forces credence to 1. No working epistemologist holds this, as it renders the agent unable to learn from observation.

  # Pairs this tree can't separate

  Despite its granularity, this instrument fails to distinguish between certain positions that agree on all verdicts but differ on metaphysical grounding.

  **The Primitivist Deferer vs. The Lewisian Regularist**
  If the Lewisian Regularist adopts the modified principle to handle undermining, and the Primitivist Deferer accepts the same modified principle, they will answer every node identically. They both defer to 0.5 in the Jinxed Coin, both adjust for undermining, and both view violation as incoherent. The tree sorts by *normative output*, not *metaphysical input*. To separate them, you would need a node asking: "If the pattern of events changed but the physical magnitudes stayed the same, would the chance change?" This is a metaphysical question, not a credence case. The tree cannot capture differences that do not cash out in betting behavior.

  **The Ur-Prior Theoremist vs. The Primitivist Deferer**
  Both may agree that the principle is a constraint on ur-priors and that violation is incoherent. The Theoremist thinks this follows from rationality alone; the Primitivist thinks it follows from the nature of chance. Unless you ask them to derive the principle from axioms of rationality without mentioning chance, their case verdicts will align. The tree reveals they are allies in practice, even if they fight in metaphysics.

  **The Evidence Dominator vs. The Unnamed Pragmatist**
  Both might reject the principle as a coherence constraint. The Dominator says evidence wins; the Pragmatist says deference is just useful. In cases where evidence is weak, both might defer to chance. The tree cannot distinguish whether they defer because they think it's true (Dominators in disguise) or because it's useful (Pragmatists). You would need to ask about a case where deference is useless but true to separate them.

  # What should surprise my two arguing students

  The student who claims the Principal Principle is a theorem and the one who claims it is an extra norm will likely converge on the **Lewisian Regularist** leaf. Both will answer 0.5 on the Jinxed Coin and both will adjust for undermining, because the cases force their hands regardless of their derivation stories. They will discover they are normative allies despite their metaphysical quarrel. Conversely, they may both diverge from the student who claims to be "basically with Lewis" but answers 1.0 on the Jinxed Coin. That student is actually an **Evidence Dominator**. The surprise lies in realizing that the "theorem vs. axiom" debate is internal to the deference camp, while the real fault line is between those who defer to chance and those who defer only to history. The tree shows that their disagreement about derivation is less consequential than their shared commitment to deference, which they both lack if they cannot handle the Jinxed Coin.
