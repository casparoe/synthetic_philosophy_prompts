answer: |-
  1. **Epistemic Underdetermination vs. Missing Identity Conditions**
  The distinction is real, but you risk attributing a weaker position to Dennett to make your own look stronger. Dennett does not merely argue that we cannot *know* whether qualia changed; he argues that the *concept* of a quale as an intrinsic, ineffable property is incoherent when subjected to these cases. If you characterize his view as solely epistemic ("introspection cannot adjudicate"), you invite the reply that better introspection or ideal theory could solve it. Your move to "missing identity conditions" is metaphysical: there is no fact of the matter because the term lacks coherent application conditions across functional changes.

  What settles the matter is whether you can demonstrate that the failure lies in the *concept* of qualia rather than our *access* to them. If you argue that "same quale" has no truth value because the identity conditions rely on functional stability which has changed, you are safe. If you argue it has no truth value because we cannot verify it, you have collapsed back into verificationism, which is vulnerable to standard realist counterattacks (e.g., inference to the best explanation).

  Yes, §1–§2 turns on this. §2 claims the realist has no criterion for diachronic sameness. If your §1 point is merely epistemic, the realist can posit a criterion we simply cannot access (e.g., a hidden intrinsic property). If your §1 point is metaphysical (no such property exists), the realist is blocked from positing hidden criteria. You must ensure §1 establishes the metaphysical failure, not just an epistemological deadlock, or §2 loses its force.

  2. **The Realist Criterion for Diachronic Sameness**
  The best candidate the realist can construct is **Phenomenal Memory via Direct Acquaintance**. The realist argues that when Sanborn tastes the coffee now, he compares it to a memory trace of the past taste. Because qualia are directly apprehended, the memory retains the phenomenal character itself, not just a functional description. The criterion for sameness is the immediate recognition of identity upon comparison: "It feels like *that* again."

  This survives only if you grant that memory preserves phenomenal character non-functionally. It fails if you accept Dennett's premise that memory is reconstructive and functional. If memory is functional, the comparison is just a functional match, collapsing into functionalism. If memory is non-functional (a direct grasp of the past quale), it is question-begging against the coffee cases, which are designed to show that "felt identity" diverges from functional identity (as in Chase's uncertainty). You must attack the reliability of phenomenal memory itself. If you allow the realist to posit a "perfect phenomenal memory," you cannot win. You must argue that even perfect memory would not yield a fact of the matter because the "phenomenal character" being remembered is itself constituted by the current discriminative economy.

  3. **Diagnosis of the §4 Reply: Emptiness or Surrender**
  Your reply suffers from **emptiness**. "Surprise at one's own verdict" explains the *dynamics* of judgment revision (the normative shift), but it does not explain the *content* of the experience (the bitterness, the acidity, the warmth). A system could be programmed to register "surprise" when prediction errors occur without having any phenomenological feel associated with the coffee taste itself. You have explained why the subject *cares* about the difference, not what the difference *is*.

  A third option is available: **Illusionism**. Instead of trying to save "what it's like" via surprise, argue that the "what it's like" is a user-illusion generated by the commitment structure itself. There is no extra feeling over and above the commitment and the surprise; the belief that there is constitutes the phenomenon. This avoids emptiness by denying the target (intrinsic feel) rather than trying to reconstruct it functionally. However, this requires a stronger metaphysical claim than your current draft offers.

  4. **Paraphrase Distortions and Unwarranted Charges**
  You distort Dennett slightly in §1 by suggesting the "standard gloss" is merely that introspection cannot adjudicate. Dennett's argument in "Quining Qualia" is that the four standard properties of qualia (ineffable, intrinsic, private, directly apprehensible) are mutually inconsistent when tested by these cases. He does not stop at "we can't tell"; he argues "there is nothing to tell." By framing the standard gloss as epistemic underdetermination, you set up a straw man to knock down with your metaphysical identity claim. Dennett is already with you on the metaphysics; your contribution is refining the *reason* (identity conditions vs. incoherent properties).

  You also charge the realist in §2 with needing a criterion that is not "it seemed the same." This is fair, but you credit the coffee cases with doing more work than they might. The coffee cases attack diachronic identity; inverted spectrum attacks synchronic identity. You claim they are "one argument." This is bold but requires proof. The inverted spectrum realist can grant your point about diachronic identity (coffee) while holding firm on synchronic identity (spectrum). You need to show why the failure of diachronic criteria undermines synchronic criteria, perhaps by arguing that synchronic identity relies on diachronic stability (reidentification).

  5. **The Strongest Unraised Objection**
  The strongest objection you do not raise is the **Normativity Objection**. A qualia realist will argue that taste commitments lack normative force. If Sanborn says "this tastes different," he claims to be *correct*, not just committed. Qualia provide the truth-makers for these reports; the experience itself constrains the judgment. On your view, if Sanborn has a stable commitment to a false distinction (e.g., he is consistently wrong about the coffee's chemical composition but stable in his taste verdict), there is no fact of the matter to say he is mistaken about the *taste*. You lose the distinction between being consistently wrong and being right. A zombie could have stable commitments and surprise responses without any experience to ground the correctness of those commitments. This objection attacks the "authority gap" you aim to preserve in §3.

  **Verdict**
  The paper is worth continuing. The shift from epistemic underdetermination to missing identity conditions is a viable and potentially fruitful refinement of the Dennettian line. However, §3 is currently the weak link; the "taste commitment" proposal is underdeveloped and vulnerable to the emptiness and normativity objections. §2 is standard anti-realist dialectic that can be condensed. You should cut space from §2 to expand §3. Use the saved space to address the Normativity Objection (Q5) and clarify whether you are offering an illusionist account or a functionalist reduction (Q3). Without a robust defense of §3, the negative argument in §2 has no payoff.
