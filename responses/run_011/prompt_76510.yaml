answer: |-
  **EXAMINATION PAPER**

  **Course:** PHI405 – Advanced Value Theory
  **Time Allowed:** 75 Minutes
  **Instructions:** Answer the following question. Closed book.

  **Question 1 (25 Marks)**

  Consider the **Inert Attitude Test (IAT)**: A consideration counts as a right-kind reason (RK-reason) to adopt an attitude if and only if it would still be a reason to adopt that attitude in a world exactly like ours except that having the attitude makes no difference to anything whatever.

  Apply this test to the following scenario: A museum's trustees will forfeit a bequest unless they come to admire a donor's collection of second-rate landscapes. One trustee finds a canvas's handling of light unusual, but suspects her scrutiny is driven by the financial stakes.

  In your essay, address the following:
  1.  **Application:** Determine what the IAT classifies as RK-reasons in the Museum case, and in the stock cases of a demon threatening you to admire the unworthy and a payment for believing against your evidence. What does the test get right, and where does it appear to fail?
  2.  **Ambiguity:** Explain how the phrase "makes no difference" must be interpreted for the test to function. Specifically, does stripping away "difference" risk stripping away the very facts that make an attitude fitting?
  3.  **Evaluation:** Judge whether the IAT can be repaired or must be abandoned in favour of the rival criterion: *a consideration is a RK-reason just in case it bears on the question the attitude answers.* Defend your judgment, noting where philosophical consensus ends and debate begins.

  ***

  **MODEL ANSWER**

  The Wrong Kind of Reasons (WKR) problem challenges us to distinguish reasons that make an attitude fitting (RK) from reasons that merely make it beneficial to have (WK). The Inert Attitude Test (IAT) proposes a modal solution: RK-reasons must survive the removal of all consequences attendant on holding the attitude.

  Applied to the Museum case, the IAT initially performs well. In a world where admiring the collection yields no bequest, the financial consideration ceases to be a reason for admiration. It is correctly identified as WK. Conversely, the unusual handling of light remains a reason to admire even if admiration changes nothing; thus, it is classified as RK. Similarly, in the stock Demon and Payment cases, pragmatic incentives (avoiding pain, gaining money) vanish in the inert world, while truth (for belief) and admirability (for admiration) remain. The test successfully filters out standard pragmatic WK-reasons, aligning with the widespread philosophical consensus that pragmatic considerations do not make attitudes fitting.

  However, the IAT hinges on a dangerous ambiguity in the phrase "makes no difference." For the test to work, "difference" cannot mean *any* difference. If the attitude is belief, the fact that the world contains a true belief is a difference. If the attitude is admiration, the existence of an instance of admiration is a difference. If we strip these out, we strip the attitude itself, rendering the test incoherent. Therefore, "makes no difference" must be read as "makes no *independent causal or consequential* difference." It must exclude the constitutive facts of the attitude's existence and its fittingness conditions. Without this stipulation, the IAT eliminates RK-reasons alongside WK-reasons. While philosophers agree the distinction between constitutive and consequential facts is necessary, there is less agreement on how to draw the line without circularity.

  Even with this repair, the IAT faces a fatal objection. It assumes all WK-reasons are consequentialist—dependent on the *effects* of having the attitude. Yet, some WK-reasons are deontic. Suppose the trustee promised the donor she would admire the work, or that a code of honour obliges her to do so. In the inert world, the promise remains unbroken and the honour intact regardless of the consequences of admiration. The reason survives the IAT, yet it remains a WK-reason; a promise does not make a landscape admirable. This counter-example suggests the IAT is extensionally inadequate. It cannot distinguish between RK-reasons and non-consequential WK-reasons (like duties or promises). This is a significant point of contention: while some argue such cases can be reduced to consequentialist terms, many value theorists maintain that deontic WK-reasons are distinct and fatal to inertness tests.

  Consequently, the IAT should be abandoned in favour of the "Bearing on the Question" criterion. This rival holds that RK-reasons must address the normative question constitutive of the attitude (e.g., "Is it true?" for belief, "Is it admirable?" for admiration). Financial incentives and promises do not bear on whether a landscape is admirable; they only bear on whether one should *bring oneself* to admire it. This criterion handles the promise counter-example successfully.

  However, students must note that this rival view is not without controversy. While it is the dominant framework in contemporary literature, critics argue it risks circularity: defining RK-reasons by the "question the attitude answers" may simply presuppose the distinction it seeks to explain. Furthermore, some pragmatists argue that in certain contexts, practical considerations *do* bear on the rationality of belief. Thus, while the "Bearing on the Question" view is superior to the IAT regarding the promise objection, it is not a settled consensus that it provides a reductive analysis of the RK/WKR distinction. The IAT fails because it mistakes the *source* of the problem (consequences) for the *nature* of the problem (fittingness).

  ***

  **MARKING SCHEME (25 Marks)**

  **1. Application of the Test (7 Marks)**
  *   **3 Marks:** Correctly identifies that IAT classifies financial/threat reasons as WK (they vanish in the inert world) and aesthetic/truth reasons as RK (they remain).
  *   **2 Marks:** Applies this logic consistently to the Museum case and the Stock Cases (Demon/Payment).
  *   **2 Marks:** Notes that the test *appears* to work for standard pragmatic cases (the "Right" part of the test).
  *   *Common Pitfall:* Confusing the trustee's suspicion with the reason itself. The reason is the bequest, not the suspicion.

  **2. Analysis of "Makes No Difference" (6 Marks)**
  *   **3 Marks:** Identifies the ambiguity: "Difference" cannot include the existence of the attitude or its fittingness facts (constitutive facts).
  *   **3 Marks:** Explains that if *all* differences are removed, RK-reasons vanish too (e.g., truth is a difference belief makes). The test requires a distinction between causal consequences and constitutive conditions.
  *   *Common Pitfall:* Failing to see that a strict reading of "inert" destroys the attitude itself, making the test vacuous.

  **3. Evaluation and Rival Criterion (12 Marks)**
  *   **4 Marks (The Discriminator):** Identifies a non-consequential WK-reason that survives the IAT (e.g., a **promise**, **obligation of honour**, or **command**). Explains why this breaks the test (the reason remains in the inert world but is still WK). *Note: This specific insight is not prompted in the question text; award full marks only if the candidate generates this counter-example independently.*
  *   **3 Marks:** Argues for abandoning IAT based on this failure.
  *   **3 Marks:** Explains the "Bearing on the Question" rival and why it handles the counter-example better.
  *   **2 Marks (Nuance):** Distinguishes settled from contested views.
      *   *Settled:* There is a RK/WKR distinction; pragmatic reasons are typically WK.
      *   *Contested:* Whether "Bearing on the Question" is circular; whether deontic WK-reasons exist; whether pragmatism about belief is viable.
      *   *Penalty:* Deduct marks if the candidate presents the "Bearing on the Question" view as an uncontested solution or penalize a candidate who defends IAT *only if* they ignore the promise/obligation objection.

  **General Grading Notes:**
  *   **20-25 (Distinction):** Locates the non-consequential WK-reason (promise/duty). Clear distinction between settled/contested. Precise analysis of "inertness."
  *   **15-19 (Merit):** Misses the non-consequential WK-reason but identifies the "constitutive fact" ambiguity. Good application of stock cases.
  *   **10-14 (Pass):** Applies IAT mechanically. Fails to analyze "makes no difference" deeply. Treats rival criterion as obviously correct without caveats.
  *   **0-9 (Fail):** Misunderstands the IAT definition. Confuses RK/WKR entirely.
