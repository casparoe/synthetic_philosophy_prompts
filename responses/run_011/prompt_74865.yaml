answer: |-
  ### The Spec: Norms for Revising on Conditional Constraints

  **Purpose:** This list defines the success conditions for a **normative epistemology** of credal revision. It is not a model of psychological processing. It specifies what a rational agent *ought* to do when their input is a constraint on conditional probabilities (e.g., "Your new credence in $B$ given $A$ must be $k$") rather than a categorical fact.

  **The Case Correction:** Your island case contains a logical contradiction. If zones A, B, and C are mutually exclusive, $P(B|A)$ is logically 0. You cannot be in B if you are in A. I will treat your case as the standard **Judy Benjamin structure**: A partition $\{A, \neg A\}$ (or $\{A, B, C\}$) and a report imposing a constraint on a proposition $E$ conditional on one cell (e.g., $P_{new}(E|A) = 3/4$). The philosophical tension remains identical: how to distribute probability mass when told only about *ratios* within a sub-region.

  ---

  ### The Requirements (Adjudicated)

  **1. The Antecedent Marginal (To Move or Not to Move)**
  *   **The Requirement:** If the report constrains only $P(E|A)$, the rule must explicitly justify whether $P(A)$ is permitted to shift.
  *   **Adjudication:** This is the primary friction point. Standard **Minimum Information (MinEnt/Infomin)** updating *does* shift $P(A)$. Many philosophers consider this a bug: if the news is only about the internal structure of A, why should my belief that I am in A change? However, keeping $P(A)$ rigid often violates symmetry or the limit condition.
  *   **Status:** **Non-negotiable justification.** A rule cannot leave this silent. If $P(A)$ moves, the rule must explain why "internal" news affects "external" location. If it doesn't move, it must explain how it avoids arbitrariness.

  **2. The Limit Condition (Continuity with Conditioning)**
  *   **The Requirement:** As the reported conditional probability approaches 1 (certainty), the posterior must converge to the result of standard conditionalization on the material conditional (or equivalent fact).
  *   **Adjudication:** This is the anchor. If a rule for learning $P(E|A)=0.99$ yields a wildly different result than learning $E \lor \neg A$ (which is roughly equivalent), the rule is discontinuous and defective. It must collapse into ordinary Bayesian conditioning in the limit.
  *   **Status:** **Non-negotiable.** Failure here implies the rule is not a generalization of Bayesianism but a different logic entirely.

  **3. Commutativity (Order Independence)**
  *   **The Requirement:** Simultaneous receipt of two constraints must yield the same posterior as sequential receipt (in either order).
  *   **Adjudication:** Rational constraints should be path-independent. If updating on $C_1$ then $C_2$ differs from $C_2$ then $C_1$, the rule makes rationality dependent on the accident of message arrival time. (Note: Jeffrey conditioning fails this; MinEnt passes this for simultaneous constraints but can fail on sequential depending on formulation).
  *   **Status:** **Preference (Strong).** Desirable for a static norm, though some dynamic models accept path-dependence.

  **4. Coherence Boundary (Handling Impossible Constraints)**
  *   **The Requirement:** If the reported constraints are jointly unsatisfiable (e.g., $P(B|A)=0.8$ and $P(B|A)=0.2$), the rule must return "undefined" rather than a number.
  *   **Adjudication:** A normative rule presupposes rational inputs. Forcing a probability distribution onto an impossible set of constraints produces "garbage" credences. The rule is not responsible for fixing logical contradictions in the evidence.
  *   **Status:** **Non-negotiable.**

  **5. Idempotency (Repetition)**
  *   **The Requirement:** Updating on the same constraint twice must yield the same result as updating once.
  *   **Adjudication:** Once your credences satisfy $P(E|A)=k$, learning again that $P(E|A)=k$ is no news. The distribution should not shift further.
  *   **Status:** **Non-negotiable.**

  **6. The Meta-Fork: Constraint vs. Evidence**
  *   **The Requirement:** The spec must declare whether the report is a **logical constraint on rationality** (Van Fraassen) or **empirical evidence from a source** (Bayesian).
  *   **Adjudication:** This is the most critical fork.
      *   *Constraint View:* You *must* satisfy $P_{new}(E|A)=k$. This requires projection methods (MinEnt).
      *   *Evidence View:* You learned "The Radio said $P(E|A)=k$." You update on that sentence using your prior reliability of the Radio. This is just standard conditioning.
      *   *Your Paper:* Since you are asking for a "norm of rational revision," you are in the **Constraint** camp. If you treat it as Evidence, the problem dissolves into standard Bayesianism (you just need a prior on the speaker's reliability).
  *   **Status:** **Non-negotiable Choice.** You cannot mix these. The "Judy Benjamin" problem only exists in the Constraint view.

  **7. The Object of Update (Avoiding Triviality)**
  *   **The Requirement:** The rule must not treat the conditional "If A then B" as a proposition with a truth value in the algebra.
  *   **Adjudication:** Lewis's Triviality Results prove you cannot have a proposition $A \to B$ such that $P(A \to B) = P(B|A)$ for all $P$. If your rule updates on the conditional as if it were a fact, it presupposes a logic that doesn't exist. You must update on the *constraint relation*, not a sentence.
  *   **Status:** **Non-negotiable.**

  ---

  ### The Impossibility Result (Where the Spec Breaks)

  You cannot satisfy **Rigidity of the Antecedent**, **Symmetry**, and **MinEnt** simultaneously.

  1.  **Rigidity:** $P(A)$ should not change when learning only about $P(E|A)$.
  2.  **Symmetry:** The result shouldn't depend on how the partition is labeled or parameterized.
  3.  **MinEnt:** The posterior should be the "closest" distribution to the prior that satisfies the constraint.

  **The Break:** **MinEnt violates Rigidity.** To minimize information gain while satisfying $P(E|A)=k$, the algorithm often shifts mass between $A$ and $\neg A$ to balance the ratios.
  **The Counter:** Rules that enforce Rigidity (keeping $P(A)$ fixed) typically violate Symmetry (they privilege the antecedent partition arbitrarily) or fail the Limit Condition.

  **Verdict:** You must sacrifice **Rigidity of the Antecedent**. There is no coherent rule that allows you to learn *only* about the internal ratio of A without potentially shifting the probability of A itself, *unless* you introduce arbitrary asymmetries in the updating rule.

  ---

  ### The Single Ruling-Out Requirement

  **The Limit Condition (Continuity with Conditioning).**

  This is the filter that kills the most proposals. Many intuitive rules for "conditional updating" (e.g., simple ratio adjustment, naive Jeffrey-style adaptations) work fine for intermediate probabilities but diverge wildly from standard Bayesian conditioning as the probability approaches 1. If a rule cannot recover standard conditioning as a special case, it is not a generalization of Bayesian epistemology; it is a rival system. Most "fixes" to the Judy Benjamin problem fail here because they prioritize Rigidity over Continuity.

  ### One-Line Scorecard
  *   **Van Fraassen (MinEnt):** Satisfies Limit & Symmetry; fails Rigidity (P(A) moves).
  *   **Grove & Halpern:** Proves the impossibility of satisfying all desiderata.
  *   **Standard Bayesian (Evidence View):** Dissolves the problem by making it about speaker reliability, not constraints.
  *   **Jeffrey Conditioning:** Not designed for conditional constraints; fails Commutativity.

  **Recommendation:** Your paper should argue that **Rigidity of the Antecedent** is the intuitive demand that must be abandoned. The "bug" of $P(A)$ moving is actually the necessary cost of maintaining Symmetry and Continuity with standard conditioning.
