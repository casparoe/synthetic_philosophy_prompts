      *(Refining the Convergence Point)*: The Geanakoplos-Polemarchakis result (1982) shows that communicating posteriors leads to common knowledge of posteriors, which implies agreement *under the common prior assumption*. If the thesis is that CPA is often false, then the convergence result is a counterfactual: "If you shared a prior, you would have converged by now. You haven't. Therefore, you don't share a prior." This turns the theorem from a goal into a diagnostic.

      *(Refining the "Risk")*: The risk is solipsism. If every disagreement is "different priors," discourse ends. The thesis must claim that *some* priors are fixed (biological/axiomatic) while others are learnable. The risk is misidentifying a learnable prior as fixed.

