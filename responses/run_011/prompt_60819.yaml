      *   *Milgrom-Stokey:* Mention the no-trade theorem. If priors differ, trade *is* possible and rational. This supports the "disagreement is stable" point. Speculative trade exists because we value things differently based on different priors.

  5.  **Final Review against Prompt Requirements:**
      1.  Identify assumption (CPA). Show math holds without it but norm vanishes. (Check)
