  Your argument holds with repairs. The A/B distinction is structurally sound, but your arithmetic for Version B is incorrect and undermines the payoff.

  1. The split is load-bearing. Version A is pure fatalism (independence), while Version B is a Newcomb-like problem (correlation). Conflating them causes the confusion you identified, so keep this framework.
  2. Perfect prediction in B doesn't fully collapse into A. In A, your act changes nothing. In B (perfect), your act is perfectly correlated with death, but causal decision theory still says "flee" because the past is fixed. The tension remains.
  3. Your Version B arithmetic fails. If Death predicts your choice 99% accurately, choosing Aleppo is 99% evidence he is in Aleppo. Your survival chance is 1% whether you flee or stay. Fleeing doesn't help unless you break the correlation.
  4. The real conflict in B is between decision theories. Causal theory says flee (you can't change the past); Evidential theory says it doesn't matter (your choice signals where Death is). This is where the "dominated action" debate lives.
  5. You missed the randomization solution. If Death predicts deterministic deliberation, flipping a coin makes you unpredictable. This breaks the correlation, raising survival odds to 50% minus ticket cost. This is often the rational escape hatch.
  6. Treating your choice as evidence is the crux. Version A forbids it; Version B demands it. The paradox arises because rational agents feel compelled to treat their choice as free (A) while knowing it is predictable (B).
