answer: |-
  # Q&A Prep Sheet: Kelly Without Utility
  **Workshop:** Decision Theory (Savage/vNM Axionatics + Experimentalists)
  **Time Horizon:** 6 Weeks
  **Thesis:** Kelly is a pathwise dominance result in infinite repetition; it requires no $U(w)=\ln(w)$ assumption and no ergodicity physics.

  ---

  ### 1. The "Preferences are Primitive" Objection
  **The Question:** "You say no utility function is doing work. But in Savage's framework, preferences over lotteries are the primitive. If an agent prefers a strategy with higher arithmetic expected return over Kelly, they are rational by vNM standards. Are you saying those agents are irrational, or just that they won't survive?"

  *   **Verdict:** **Real Hit.** This is the core philosophical clash.
  *   **The Concession:** Concede immediately that vNM rationality is defined over *expectations*, not *paths*. If their axiom set defines rationality as maximizing $E[W]$, Kelly is "irrational" in one shot.
  *   **The 90-Second Reply:** "I'm not redefining rationality; I'm changing the object of choice. vNM evaluates a lottery *now*. I am evaluating a *strategy* over time. If you maximize arithmetic expectation in a repeated multiplicative game, you converge to zero wealth almost surely. My claim is normative: if your goal is to persist in the market, the axioms of static choice mislead you. I'm not saying log-utility agents are right; I'm saying repeated multiplication changes the math of survival regardless of preference."
  *   **Where You're Thin:** You haven't justified why "persistence" is a normative goal superior to "maximize expected value even if I go bust."

  ### 2. The Finite-Horizon Objection (The Damage Point)
  **The Question:** "Your dominance result relies on $T \to \infty$. But no agent lives forever. In any finite horizon $T$, Kelly does not maximize expected wealth, nor does it stochastically dominate other fractions. For large $T$, sure, but for the $T$ that matters to my undergraduates, isn't this just an approximation?"

  *   **Verdict:** **Major Hit.** You are right to worry. This is where the math turns against you.
  *   **The Concession:** **Concede this fully.** Do not bluff. In finite time, Kelly does *not* dominate. A slightly more aggressive fraction has a higher probability of ending with more wealth than Kelly, at the cost of a small probability of ruin.
  *   **The 90-Second Reply:** "You're right: for finite $T$, Kelly is not strictly dominant in terms of terminal wealth distribution. However, the *rate* of divergence is exponential. The probability that a non-Kelly strategy outperforms Kelly decays exponentially with $T$. My claim isn't that Kelly wins every finite race, but that it is the unique strategy that prevents the wealth ratio from collapsing to zero as $T$ grows. For any horizon long enough for the law of large numbers to kick in—which is where 'repeated betting' becomes meaningful—Kelly is the only stable attractor."
  *   **Where You're Thin:** Defining "long enough." If the experimentalists run 50 rounds, the convergence might be too weak to support a "dominance" claim.

  ### 3. The "Subjective Probability" Objection
  **The Question:** "You assume known objective probabilities (the coin bias). But Savage teaches us probabilities are subjective degrees of belief. If the agent's subjective $p$ differs from the true $p$, Kelly betting can lead to ruin. Doesn't your result collapse under parameter uncertainty?"

  *   **Verdict:** **Miss.** This is a technicality you can swat.
  *   **The Concession:** None. This is outside the scope of the specific theorem.
  *   **The 90-Second Reply:** "My theorem is conditional: *if* you have positive edge, Kelly dominates. Parameter uncertainty is a separate estimation problem. If you plug wrong probabilities into Expected Utility maximization, you also make disastrous choices. The axiomatic contribution here is about the *structure* of repetition, not the estimation of $p$. Even with subjective probabilities, if you act *as if* you have an edge, the growth optimality logic holds for those beliefs."
  *   **Where You're Thin:** If they press on "learning," admit that fractional Kelly is the robust response, but keep the focus on the structural result.

  ### 4. The "Expected Utility Consistency" Objection
  **The Question:** "It's known that maximizing Expected Log-Utility is equivalent to Kelly. Isn't your 'no utility' claim just semantic? You've effectively derived log utility from the assumption of infinite repetition. Isn't that just a long-run justification for $U(w)=\ln(w)$?"

  *   **Verdict:** **Miss (Semantic Win).** This is your strongest ground.
  *   **The Concession:** Concede that the *behavior* looks identical to log-utility maximization.
  *   **The 90-Second Reply:** "It's not semantic; it's foundational. Log-utility implies risk aversion over *wealth levels*. My result implies risk aversion over *growth rates*. An agent with linear utility over wealth who bets Kelly isn't displaying risk aversion; they're displaying arithmetic correctness for multiplicative processes. I'm not deriving a utility function; I'm showing that the utility function is irrelevant to the convergence property. The math works even if the agent claims to be risk-neutral."
  *   **Where You're Thin:** Distinguishing "risk aversion over growth" from "log utility over wealth" without getting tangled in definitions.

  ### 5. The "Drawdown and Volatility" Objection
  **The Question:** "Kelly maximizes growth, but it allows for arbitrary drawdowns (e.g., 50% drops). Most agents have utility functions that penalize volatility or intermediate consumption. Why should an agent tolerate a 90% drawdown just to win in the limit?"

  *   **Verdict:** **Real Hit.** This appeals to the experimentalists and the "real world" crowd.
  *   **The Concession:** Concede that Kelly is volatile and ignores intermediate consumption needs.
  *   **The 90-Second Reply:** "That's a constraint problem, not an optimality problem. If you have a constraint on maximum drawdown, you bet fractionally relative to Kelly. But the benchmark remains Kelly. You can't define 'optimal under constraint' without knowing the unconstrained optimum. My point is that Kelly is the 'full speed' limit. Any deviation is a concession to constraints, not a correction of the growth logic."
  *   **Where You're Thin:** Justifying why "full speed" is the default normative stance if it causes misery along the path.

  ### 6. The "Stochastic Dominance" Objection
  **The Question:** "You say Kelly dominates. But in what sense? It doesn't first-order stochastic dominate other strategies in finite time. Are you relying on 'almost sure' convergence as a form of dominance? That's not standard decision theory."

  *   **Verdict:** **Miss (Definition Defense).** You need to stand firm on "Almost Sure Dominance."
  *   **The Concession:** Admit it's not FSD or SSD in the static sense.
  *   **The 90-Second Reply:** "I am relying on 'Almost Sure Asymptotic Dominance.' For any other constant fraction strategy, the ratio of Kelly-wealth to that-strategy-wealth goes to infinity with probability one. In decision theory, we usually care about expectations. I'm arguing that in repeated multiplicative contexts, the expectation is a misleading metric because the 'average' path is not the 'typical' path. The typical path is the one that matters."
  *   **Where You're Thin:** Explaining why "probability one" outweighs "expected value" without invoking ergodicity jargon they dislike.

  ### 7. The "Why Constant Fraction?" Objection
  **The Question:** "You restrict the comparison class to constant-fraction strategies. Maybe a dynamic programming approach, adjusting bet size based on current wealth and time remaining, beats Kelly. Why should I restrict myself to constant fractions?"

  *   **Verdict:** **Miss.** You can handle this.
  *   **The Concession:** None.
  *   **The 90-Second Reply:** "In an infinite horizon with stationary opportunities, the optimal policy is stationary. Dynamic adjustments based on wealth levels are irrelevant because the utility of wealth is scale-invariant in a multiplicative world. If you have a finite horizon, yes, dynamic programming changes things (see Objection 2). But for the infinite case I'm presenting, constant fraction is the unique solution to the Bellman equation for growth."
  *   **Where You're Thin:** If they introduce non-stationary environments (changing odds), your result weakens.

  ### 8. The Dreaded Question (The One You Fear)
  **The Question:** "If utility functions aren't doing any work, what is the normative force of your argument? If I tell you 'I don't care about the long run, I want to maximize my expected wealth tomorrow,' you have no answer. Aren't you just smuggling in a specific preference for long-term survival and calling it 'math'?"

  *   **Verdict:** **Critical Hit.** This exposes the is-ought gap in your thesis.
  *   **Why it hurts:** It forces you to admit that "maximizing growth" *is* a preference, functionally equivalent to a utility function.
  *   **How to Parry:** Do not deny it's a preference. Reframe it as a *precondition*.
  *   **The 90-Second Reply:** "I'm not saying you *ought* to care about the long run. I'm saying that if you want to remain a player in the game, you have no choice. Maximizing expected wealth tomorrow is a valid preference, but it is a preference for extinction in the long run. My argument isn't that you *should* have this preference; it's that this is the physics of compounding. You can prefer to jump off a cliff, but gravity still works. I'm describing the gravity of finance, not prescribing your goals."
  *   **Where You're Thin:** This equates "financial ruin" with "death," which is a normative leap. A rich person can afford to go bust once. You are assuming the agent *must* stay in the game.

  ---

  ### Strategic Advice for the Finite-Horizon Objection
  You suspect this is the damage point. **You are right.**
  The axiomatics people live in finite worlds (axioms apply to choices *now*). The infinite horizon is a mathematical convenience, not a reality.
  *   **Do not** claim Kelly is optimal for finite $T$.
  *   **Do** claim that for any $T$ large enough for the Central Limit Theorem to approximate the distribution, Kelly maximizes the *median* outcome and minimizes the time to reach asymptotic goals.
  *   **Pivot:** "The infinite horizon is the only horizon where the noise cancels out. If you think your horizon is too short for the LLN to apply, then you aren't in a 'repeated betting' regime; you're in a 'one-off lottery' regime. My talk is about the former."

  ### Final Note on Tone
  The room is full of people who think **Preferences $\to$ Behavior**. You are arguing **Environment $\to$ Behavior**.
  They will view your "no utility" claim as an attack on the foundation of their field.
  *   **Don't** say "Utility is wrong."
  *   **Do** say "Utility is insufficient for multiplicative dynamics."
  *   **Be humble about the infinite horizon.** It is your weakest mathematical link, even if it is your strongest conceptual lever.
