prompt: |-
  I'm giving a talk at a decision theory workshop in about six weeks and I want a prep sheet for the question period. The room is basically Savage / von Neumann-Morgenstern people — at least three have worked on the axiomatics of the independence axiom — plus two experimental economists who run repeated coin-flip lotteries on undergrads. Nobody there thinks about ergodicity and nobody plays poker for a living.

  My thesis is the strong one: you can get Kelly betting without log utility and without any ergodicity talk. The move is that in an infinitely repeated binary bet with positive edge, the Kelly fraction beats every other constant fraction almost surely along the agent's own single trajectory — the wealth ratio diverges or collapses with probability one depending on which side of Kelly you sit — so geometric optimality is a dominance result about one life, not an ensemble average, and no utility function is doing any work. So the standard "Kelly just assumes you have log utility" line is flatly wrong, and I want to say so out loud.

  Give me the seven or eight objections this audience will actually raise, in roughly the order theyll come, phrased the way a subjective expected utility person phrases things — not the way a physicist or a bookmaker would. For each: real hit or a miss, what I say in ninety seconds, what I should concede before I even get asked, and where my answer is thin. I especially want the finite-horizon objection worked through, since I suspect thats the one that does the most damage and I'd like to know whether I'm right about that. End with the question I'm dreading, the one that would make me wish I'd written a weaker paper.

  Be committed about it: actually take a position on which of these land and which don't, and say why, rather than handing me a list of considerations to weigh myself. No citations, I'll fill those in.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User and Context:**
      *   **Speaker:** Decision theorist, strong thesis (Kelly $\neq$ Log Utility, Kelly $\neq$ Ergodicity, Kelly = Almost Sure Dominance in Infinite Horizon).
      *   **Audience:** Savage/vNM axiomatics experts (focus on rationality, consistency, utility functions), experimental economists (focus on finite data, human behavior, risk aversion). *No* ergodicity economists, *no* professional gamblers.
      *   **Goal:** A prep sheet for the Q&A period (6 weeks out).
      *   **Tone:** Committed, sharp, specific. No fence-sitting. "Real hit or miss."
      *   **Specific Request:** 7-8 objections, ordered by likelihood, phrased in SEU (Subjective Expected Utility) language. Special focus on the finite-horizon objection. End with the "dreaded question."

  2.  **Deconstruct the Thesis:**
      *   *Claim:* Kelly betting is optimal because it maximizes the growth rate of wealth almost surely in an infinite sequence.
      *   *Claim:* This does *not* require assuming $U(w) = \ln(w)$.
      *   *Claim:* This does *not* require ergodic theory jargon (though it relies on LLN-type arguments).
      *   *Claim:* It's a dominance result on a single path.
      *   *Vulnerability:* "Infinite" is the weak point. Decision theorists care about rationality *now*, not just in the limit. Also, utility functions exist to model risk aversion *away* from the limit.

  3.  **Brainstorming Objections (SEU/Axiomatics Lens):**
      *   *Objection 1:* "But utility is about preferences, not just wealth maximization." (The classic SEU defense).
      *   *Objection 2:* "Infinite horizon? I'll be dead." (Finite horizon critique).
      *   *Objection 3:* "What about risk of ruin before the limit?" (Drawdowns).
      *   *Objection 4:* "You're assuming the probabilities are known." (Ambiguity/Subjectivity).
      *   *Objection 5:* "Why constant fraction? Maybe dynamic programming yields something else." (Optimality class).
      *   *Objection 6:* "Expected utility maximization *implies* Kelly if you iterate it." (The Breiman/Thorp counter).
      *   *Objection 7:* "Stochastic Dominance?" (Does Kelly actually dominate in the SD sense?)
      *   *Objection 8:* "Why should I care about geometric mean vs arithmetic mean?" (The ensemble vs time distinction, but phrased SEU style).

  4.  **Selecting and Refining the Top 7-8:**
      *   *Selection:* Need to prioritize the axiomatics people. They care about consistency and foundations.
      *   *Refinement:*
          1.  The "Utility is Primitive" objection (You're smuggling in preferences).
          2.  The "Finite Horizon" objection (The big one requested).
          3.  The "Risk of Ruin/Drawdown" objection (Volatility matters).
          4.  The "Subjective Probabilities" objection (Savage says $p$ is subjective).
          5.  The "Expected Utility Consistency" objection (Doesn't EU imply Kelly asymptotically anyway?).
          6.  The "Pathwise Dominance" objection (Is it really dominance?).
          7.  The "Why Geometric?" objection (Why not maximize $E[w_T]$?).
          8.  The "Dreaded Question" (The one that kills the "no utility" claim).

  5.  **Drafting the Content (Iterative Process):**

      *   *Tone Check:* Needs to be punchy. "Real hit or miss."
      *   *Finite Horizon:* This is crucial. In finite time, Kelly does *not* maximize expected wealth. It maximizes median wealth roughly. An EU maximizer with $U(w)=w$ hates Kelly in finite time. I need to concede this is the boundary of the thesis.
      *   *SEU Phrasing:* Instead of "physics ergodicity," they'll say "intertemporal aggregation of preferences." Instead of "poker," they'll say "known objective probabilities."
      *   *The "Dreaded Question":* It has to be about the *normative* force. If I don't have log utility, why *should* I follow Kelly? If the answer is "because you'll be rich in the limit," the SEU person says "I might not live that long." The dreaded question is: "If your utility function is linear, why is your recommendation rational?"

  6.  **Developing the Responses (90 seconds each):**
      *   Need to be crisp. Acknowledge the point, pivot back to the "single path" argument.
      *   *Concessions:* Must admit where the infinite horizon assumption is doing heavy lifting.

  7.  **Final Review against Constraints:**
      *   7-8 objections? Yes.
      *   Ordered by likelihood? Yes.
      *   SEU phrasing? Yes.
      *   Finite horizon worked through? Yes.
      *   Dreaded question at the end? Yes.
      *   No citations? Yes.
      *   Committed positions? Yes.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe include an objection about transaction costs.
      *   *Correction:* No, this is a theory workshop. Keep it foundational.
      *   *Initial thought:* Focus heavily on ergodicity.
      *   *Correction:* User said "nobody thinks about ergodicity." Frame it as "law of large numbers on a single path."
      *   *Refining the Finite Horizon:* The user suspects this is the damage point. I need to confirm that suspicion. In finite time, Kelly is *not* dominant. It's only asymptotically dominant. I must advise the user to concede finite-time optimality but argue for finite-time *approximation* or "survival."
      *   *Refining the "No Utility" claim:* This is the most controversial part. SEU says preferences $\to$ Utility. User says Growth $\to$ Kelly. The clash is inevitable. I need to make sure the user distinguishes between "descriptive" (people have utility) and "normative" (you should grow wealth).

  9.  **Final Polish:** Check the voice. It should sound like a senior colleague giving tough love advice. (Proceeds to generate output based on these thoughts).

  *(Self-Correction on the "Dreaded Question")*: The user claims "no utility function is doing any work." The SEU person will ask: "Then what normative force does your argument have?" If it's not utility, is it just a physical law? If I *want* to maximize probability of beating a benchmark, that's a preference. The dreaded question is: "Isn't 'maximizing long-run growth' just a utility function in disguise?" I need to make sure this is the killer.

  *(Refining the Finite Horizon)*: The user wants to know if they are right about the damage. Yes, they are. In finite $T$, $E[U(W_T)]$ with $U(w)=w$ favors bold betting, not Kelly. Kelly minimizes the time to reach a goal *asymptotically*, but in finite $T$, it's not strictly dominant over other strategies in terms of expectation. I need to be clear: The thesis holds for $T \to \infty$. For finite $T$, it's an approximation.

  *(Final check on tone)*: "Be committed about it." Okay, I will say "This is a hit" or "This is a miss."

