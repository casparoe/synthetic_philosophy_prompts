answer: |-
  # PREPARATORY BRAINSTORMING: Rousseau's Claims and Modern Applicability

  *Note: This section is for committee internal use to ground the charter. It is not part of the final document submitted to the council.*

  **Family 1: The Economy of Passions (What performance does to the audience)**
  *   **Claim:** Theater does not purge passions (catharsis); it indulges them. We feel pity for characters on stage so we do not have to feel pity for neighbors in reality. It makes us love virtue in the abstract but remain lazy in practice.
  *   **Type:** Conceptual/Psychological.
  *   **Applicability:** **Survives.** Modern psychology supports the idea of "moral licensing" (feeling good about watching good acts without acting). However, the claim that *all* theater does this is empirical and debatable. We can test if a specific production encourages passivity.

  **Family 2: The Economy of Resources (Time, money, habits)**
  *   **Claim:** A standing theater draws money away from productive labor and creates habits of idleness. It encourages night life over family/community time. It creates inequality via seating tiers.
  *   **Type:** Empirical/Economic.
  *   **Applicability:** **Partial.** In a commuting town, "idle time" is scarce. The inequality claim survives (ticket prices vs. free events). The labor claim translates to "does this production extract value from the town without returning it?"

  **Family 3: The Performer-Spectator Relation**
  *   **Claim:** Actors are paid to pretend, which corrupts sincerity. The separation between actor and spectator creates a passive audience watching an elite display. Public opinion becomes governed by appearance rather than truth.
  *   **Type:** Conceptual/Moral.
  *   **Applicability:** **Strained.** We cannot abolish professional actors. However, the claim translates to: "Does this production reinforce the idea that truth is performative?" or "Does it bridge the gap between stage and seat?"

  **Family 4: Alternatives (Festivals vs. Theater)**
  *   **Claim:** Public festivals where citizens are the spectacle (no actors, open air, free) strengthen social bonds better than enclosed theater.
  *   **Type:** Prescriptive/Political.
  *   **Applicability:** **High.** This is the strongest tool for a civic theater. We can prioritize productions that mimic festivals (community participation, public spaces, free access) over enclosed commercial runs.

  ***

  # 1. TRANSLATION TABLE: From Philosophy to Procedure

  | Rousseau's Claim | Operational Question for Committee | Sufficient Answer (Evidence) | Insufficient Answer Action |
  | :--- | :--- | :--- | :--- |
  | **Passions:** Theater indulges pity to avoid real virtue. | Does this production encourage passive emotional consumption or active civic reflection? | Program notes, talkbacks, or design elements that connect the stage action to local civic duties. | **Referral:** Requires added contextual programming (panel, workshop) before approval. |
  | **Resources:** Theater wastes time/money and creates inequality. | Does this production maximize public access and local economic return? | Sliding scale tickets, free performances, or local hiring/subject matter. | **Modification:** Must add free community performance or reduce ticket price tier. |
  | **Relation:** Actors pretend; spectators watch passively. | Does this production break the "fourth wall" or integrate the audience as participants? | Immersive elements, community cast, or post-show dialogue where audience speaks. | **Stop:** If purely passive consumption with no bridge to reality, requires Artistic Director veto justification. |
  | **Alternatives:** Festivals bind citizens better than plays. | Does this production function as a civic gathering rather than a commodity? | Public space usage, non-ticketed entry, or focus on local history/trauma. | **Referral:** Prioritize for funding over standard subscription fare. |

  ***

  # 2. PROGRAMMING CHARTER AND PROCEDURE

  **Purpose:** To provide a defensible, two-page justification for seasonal programming choices that aligns with our civic subsidy mandate.
  **Users:** Programming Committee (7 members), Artistic Director (AD).
  **Time Limit:** 30 minutes per proposal.

  ### Step 1: Resource and Access Check (Empirical)
  *   **Action:** Review budget line, ticket price structure, and venue.
  *   **Question:** Does this production restrict access based on ability to pay or exclude local participation?
  *   **Documentation:** Record ticket price floor/ceiling and % of local hires/cast.
  *   **Stop Condition:** If ticket prices exceed the town's median hourly wage by more than 2x without a subsidy plan, **STOP**. Requires **Modification** (add free nights) to proceed.
  *   **Output:** *Memo Section 1: Access & Economics.*

  ### Step 2: The Passion Test (Conceptual) [JUDGMENT: Committee Chair]
  *   **Action:** Review the script or treatment for its treatment of virtue and vice.
  *   **Question:** Does the production make virtue look ridiculous or vice look charming without consequence? (Based on Rousseau's critique of comedy).
  *   **Documentation:** Write one paragraph identifying the moral center of the piece. Does the audience leave feeling they have "done enough" by watching, or compelled to act?
  *   **Stop Condition:** If the piece explicitly mocks civic honesty or plain-speaking (e.g., making the truth-teller the fool), **STOP**.
  *   **Output:** *Memo Section 2: Moral Psychology.*

  ### Step 3: The Spectator Relation (Conceptual) [JUDGMENT: Dramaturg]
  *   **Action:** Review staging and marketing materials.
  *   **Question:** Does the marketing promise "catharsis" (emotional purging) or "entertainment" that isolates the viewer?
  *   **Documentation:** Flag any marketing claims promising emotional release without civic engagement.
  *   **Stop Condition:** If marketing relies solely on "catharsis," **STOP**. Requires **Modification** of marketing copy to emphasize reflection over release.
  *   **Output:** *Memo Section 3: Audience Relation.*

  ### Step 4: The Civic Festival Check (Prescriptive) [JUDGMENT: Committee Vote]
  *   **Action:** Evaluate the production's potential to function as a public gathering.
  *   **Question:** Does this bring people together as citizens rather than consumers?
  *   **Documentation:** Note if the event is free, outdoors, or involves community members as performers.
  *   **Output:** *Memo Section 4: Civic Bond.*

  ### Step 5: Final Justification Assembly [JUDGMENT: Artistic Director]
  *   **Action:** Compile Sections 1-4 into a two-page memo.
  *   **Veto Power:** The AD may override a **STOP** condition but must write a 300-word justification explaining why the artistic value outweighs the civic risk. This justification becomes part of the public record.
  *   **Output:** *Final Two-Page Council Memo.*

  ***

  # 3. HANDLING PROBLEMATIC CLAIMS

  Rousseau's text contains arguments incompatible with modern liberal democracy and labor practices. We must not smuggle them in as aesthetic criteria.

  **1. The Actor's Trade (Inherent Duplicity)**
  *   **Rousseau's Claim:** Acting is inherently dishonest; professionals sell their persona, corrupting public sincerity.
  *   **Disposition:** **Reinterpreted.**
  *   **Interpretive Work:** We shift the critique from "acting is lying" to "commercialization of emotion is alienating." We accept professional actors but prioritize productions where the "performance" acknowledges its own artifice or invites genuine interaction.
  *   **Loss:** We lose Rousseau's radical demand for amateurism. We accept the labor market but mitigate its isolating effects.

  **2. Women on the Stage**
  *   **Rousseau's Claim:** Public exposure damages women's modesty and subjects them to dangerous public judgment.
  *   **Disposition:** **Overridden.**
  *   **Interpretive Work:** We explicitly reject this as incompatible with gender equality. Women's participation in public life is a civic good, not a moral hazard.
  *   **Loss:** We lose Rousseau's protective (if paternalistic) concern for reputation. We replace it with a commitment to safety and equity protocols rather than exclusion.

  **3. The Rejection of Catharsis**
  *   **Rousseau's Claim:** Pity felt in theater does not purge passion; it substitutes for real action.
  *   **Disposition:** **Quarantined.**
  *   **Interpretive Work:** We accept the psychological critique (watching suffering ≠ helping sufferers) but do not ban tragedies. We require contextual framing (talkbacks, partnerships with relevant NGOs) to bridge the gap between stage pity and real action.
  *   **Loss:** We lose the idea of art as a self-contained spiritual experience. Art must justify its social cost.

  ***

  # 4. CASE STUDIES: Running the Procedure

  ### Case (a): *The Misanthrope* (Local Council Chamber Setting)
  *   **Proposal:** Molière revival. Alceste (truth-teller) is staged as self-indulgent. Audience laughs at him.
  *   **Step 1 (Access):** Standard ticket prices. Local setting. **Pass.**
  *   **Step 2 (Passion) [JUDGMENT: Chair]:** The production explicitly makes plain-speaking look like self-indulgence. Rousseau argues this corrupts public sentiment by mocking virtue.
      *   *Record:* "Production frames civic honesty as pathological."
      *   *Action:* **STOP.**
  *   **Step 3 (Spectator):** Passive seating. Marketing emphasizes comedy. **Flag.**
  *   **Step 4 (Festival):** Enclosed theater. **Neutral.**
  *   **Verdict:** **REJECT** (unless modified).
  *   **Justification:** "While artistically strong, this production risks reinforcing cynicism about civic honesty. To proceed, the director must add a post-show forum on 'Truth in Public Life' to counterbalance the satire."
  *   **User Preference:** You love this proposal. The procedure moves against you.
  *   **Evidence to Reverse:** If the director agrees to frame the production not as a mockery of Alceste, but as a tragedy of a society that *cannot hear* truth, the Step 2 judgment changes.
  *   **Weakness Diagnosis:** The procedure relies on the Committee Chair's interpretation of the director's intent. If the director claims irony ("we mock the mockers"), the Chair must judge sincerity. This is subjective.

  ### Case (b): Immersive Promenade (Factory Closure)
  *   **Proposal:** Market square, dusk, 200 residents paid stipend, no tickets, one performance.
  *   **Step 1 (Access):** Free. Local hiring (200 residents). **Pass (High Score).**
  *   **Step 2 (Passion) [JUDGMENT: Chair]:** Focuses on shared local trauma. Encourages collective mourning rather than passive pity. **Pass.**
  *   **Step 3 (Spectator):** No separation between performer and spectator (promenade). **Pass.**
  *   **Step 4 (Festival):** Public space, free, civic gathering. **Pass (High Score).**
  *   **Verdict:** **APPROVE.**
  *   **Justification:** "This production functions as a Rousseauian festival: citizens are the spectacle, access is universal, and it processes shared civic history rather than commodifying emotion."

  ### Case (c): Physician Drama (Catharsis Claim)
  *   **Proposal:** Well-made drama, professional cast, sold out. Marketing claims "cathartic experience." Design implicates audience in cruelty.
  *   **Step 1 (Access):** Presold capacity (high demand), standard prices. **Pass.**
  *   **Step 2 (Passion) [JUDGMENT: Chair]:** Implicates audience in cruelty. This is active, not passive. **Pass.**
  *   **Step 3 (Spectator) [JUDGMENT: Dramaturg]:** Marketing claims "catharsis." Rousseau denies catharsis exists; claiming it does is misleading.
      *   *Record:* "Marketing promises emotional purging that may substitute for accountability."
      *   *Action:* **MODIFY.**
  *   **Step 4 (Festival):** Enclosed, ticketed. **Neutral.**
  *   **Verdict:** **APPROVE WITH CONDITIONS.**
  *   **Justification:** "The production design actively implicates the audience, which avoids passive pity. However, marketing must be changed from 'cathartic' to 'confrontational' to avoid promising false moral relief."
  *   **User Preference:** You likely support this (standard high art). The procedure accepts it but forces a marketing change.

  ***

  # 5. LIMITATIONS AND CANDID ADMISSIONS

  **Where the Procedure Misfires:**
  1.  **Predicting Psychology:** We cannot know before opening night if an audience will feel "active" or "passive." We are guessing at *amour-propre* (social vanity) triggers.
      *   *Mitigation:* Staged readings with community feedback before full production.
  2.  **Ranking Good vs. Good:** The procedure filters out harmful proposals but does not easily rank two beneficial ones (e.g., Case B vs. Case C). It lacks a weighting system for "Artistic Excellence" vs. "Civic Utility."
      *   *Mitigation:* The Artistic Director's veto power remains the tie-breaker, justified by the "Artistic Excellence" clause in the original bylaws.
  3.  **Empirical Blindspots:** We cannot verify the "local economic return" or "community bonding" until after the fact.
      *   *Mitigation:* Require a post-season audit surveying audience members on civic engagement actions taken after shows.

  **Philosophical Overload:**
  *   **Flag:** I am asking this procedure to carry a load Rousseau did not intend. Rousseau argued against *building* the theater, not programming an existing one. Using his criteria to justify a standing institution is an adaptive reuse that softens his radicalism. We are managing the harm of an institution he would have abolished.
  *   **Flag:** You asked for testable questions. Some of Rousseau's claims (e.g., about the corruption of sincerity) are metaphysical, not empirical. The procedure treats them as empirical risks, which is a category error we must accept for the sake of bureaucracy.

  ***

  # APPENDIX: ONE-PAGE COMMITTEE HANDOUT

  **CIVIC THEATER PROGRAMMING CHARTER: QUICK CHECKLIST**
  *For use during proposal review meetings. Complete one per proposal.*

  **PROPOSAL TITLE:** ___________________ **DATE:** __________

  **1. ACCESS & ECONOMICS (Pass/Fail)**
  [ ] Are ticket prices accessible (≤ 2x median hourly wage)?
  [ ] Is there a free/subsidized performance component?
  [ ] Does it hire locally or address local history?
  *If NO to any:* **Requires Modification Plan.**

  **2. MORAL PSYCHOLOGY (Judgment: Committee Chair)**
  [ ] Does the piece mock civic virtue (honesty, plain-speaking)?
  [ ] Does it encourage passive pity or active reflection?
  *If YES to mocking virtue:* **STOP.** (Requires AD Veto Justification).

  **3. AUDIENCE RELATION (Judgment: Dramaturg)**
  [ ] Does marketing promise "catharsis" or "escape"?
  [ ] Does the staging isolate the audience or implicate them?
  *If YES to catharsis/escape:* **Modify Marketing.**

  **4. CIVIC BOND (Judgment: Committee Vote)**
  [ ] Does this function as a public gathering (festival style)?
  [ ] Is the space public or private?
  *Score:* High (Public/Free) / Medium (Private/Ticketed) / Low (Exclusive).

  **FINAL RECOMMENDATION:**
  [ ] Approve  [ ] Approve with Conditions  [ ] Reject

  **MEMO NOTES FOR COUNCIL (Draft):**
  *Why this fits our civic mandate:*
  ____________________________________________________________________________
  ____________________________________________________________________________
  *Risks identified and mitigated:*
  ____________________________________________________________________________
  ____________________________________________________________________________

  **Artistic Director Veto (If applicable):**
  *Reason for overriding Stop Condition:*
  ____________________________________________________________________________
  *(Signature)* _______________
