      *   *Refinement:* The user might mean "Rational Choice Theory cannot explain voting." That is true. But "Voting cannot be *explained* instrumentally" (as in, no one votes for instrumental reasons) is an empirical claim about psychology, not math.

      *   *Okay, let's stick to the strongest angles:*
