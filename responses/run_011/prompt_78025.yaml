      *   *Yes:* If I vote *because I think* it will matter, the explanation of my behavior is instrumental, even if the belief is false. The user's argument proves the belief is *false*, not that it isn't the *motivation*. This is a huge vulnerability.

      *   *Added Fatal Point:* False Belief vs. Wrong Motivation. People might vote instrumentally based on incorrect probability estimates. The paradox explains why they are wrong, not why they don't do it.

