      *   **Preferences:** Likes numbers over intuitions. Wants real-world facts (close elections, turnout spikes). Wants a ranking of objections (Fatal, Shrug Off, Nervous). Wants to know if the argument is tautological/unfalsifiable.

  2.  **Deconstruct the "Instrumental" Definition:**
      *   The user defines "instrumental" narrowly: *My specific vote must causally determine the winner.*
      *   *Potential Weakness:* Is this the only valid definition of instrumental action in collective action problems?
      *   *Potential Weakness:* Does it ignore conditional probabilities or information aggregation?

  3.  **Brainstorming Objections (and filtering for the user's constraints):**

      *   *Objection 1: Duty/Expression.*
          *   *User's Pre-emption:* They already admitted this isn't instrumental.
