answer: |-
  This is a sharp formulation. You have correctly identified that the standard "Paradox of Voting" (Downsian calculus) is mathematically robust *if* you accept standard Expected Utility (EU) theory and independent probabilities. You have also correctly preempted the "civic duty" and "expressive voting" escapes by defining them out of "instrumental."

  However, your position has vulnerabilities. Some are philosophical (definitions), some are mathematical (decision rules), and some are empirical (human behavior).

  Here is the ranking of objections against your claim, from **Fatal** to **Shrug Off**, followed by the specific numbers and real-world facts you asked for.

  ---

  ### 1. FATAL OBJECTIONS
  *These strike at the logic or definition of your claim. If these hold, your argument collapses.*

  **A. The "Irrational vs. Non-Instrumental" Conflation**
  *   **The Argument:** You claim voting cannot be *explained* instrumentally. But an explanation of behavior relies on the agent's *intent*, not the mathematical validity of their belief.
  *   **Why it breaks you:** If I buy a lottery ticket with a 1-in-300-million chance, I am acting instrumentally (I want the money). I am just mathematically wrong about the Expected Value. Similarly, if a voter votes because they *believe* their vote matters (even if they are wrong), the *explanation* for their action is instrumental.
  *   **The Blow:** Your math proves instrumental voting is *irrational*, not that it isn't the *motivation*. To claim no one votes instrumentally is an empirical psychological claim, not a mathematical one. Polls consistently show 60-70% of voters cite "influence the outcome" as a primary reason. Your math says they are deluded; it does not say they aren't trying to be instrumental.
  *   **Verdict:** **Fatal.** It distinguishes between *normative rationality* (should they vote?) and *descriptive explanation* (why did they vote?). You have proven the former, but you are claiming the latter.

  **B. Minimax Regret (Changing the Decision Rule)**
  *   **The Argument:** Expected Utility ($P \times B - C$) is not the only rational decision rule. In high-stakes, low-probability scenarios, rational agents often use **Minimax Regret**.
  *   **The Math:** Instead of maximizing gain, I minimize maximum regret.
      *   Regret if I don't vote and my side loses by 1: **Infinite/High**.
      *   Regret if I do vote and my side loses anyway: **Cost of voting (Low)**.
      *   Regret if I do vote and my side wins: **Zero**.
  *   **Why it breaks you:** This preserves the *instrumental* goal (outcome-based) without requiring $P \times B > C$. It only requires that the *regret* of being the non-voter in a tie exceeds the cost of voting. This is a fully instrumental framework that clears the hurdle you set.
  *   **Verdict:** **Fatal.** It bypasses your probability calculation entirely while keeping the goal instrumental.

  **C. The Tautology Trap**
  *   **The Argument:** You have defined "instrumental" so narrowly ("must causally determine the outcome") that the claim becomes true by definition but useless.
  *   **Why it breaks you:** By your definition, buying insurance is rarely "instrumental" (most people don't claim the payout). Joining a union is rarely "instrumental" (one member rarely breaks the strike). If "instrumental" requires *decisiveness*, then almost all collective action is non-instrumental.
  *   **Verdict:** **Fatal.** It renders the term "instrumental" meaningless for any collective action problem.

  ---

  ### 2. MAKE YOU NERVOUS (Empirical & Mathematical)
  *These don't necessarily break the logic, but they contradict the real-world implications of your claim.*

  **A. Turnout Correlates with Closeness (The "Swing State" Effect)**
  *   **The Fact:** If voting were purely expressive or dutiful, turnout should depend on how much people love their team or feel civic pride. It should *not* depend on the margin of victory.
  *   **The Data:** Turnout is significantly higher in swing states than in safe states, even controlling for demographics.
      *   *Example:* In 2020, turnout in Wisconsin (decided by 0.6%) was ~75.8%. In Alabama (Trump +25%), it was ~63.1%.
  *   **Why it hurts:** Voters behave *exactly as if* they are running an instrumental calculation. They perceive $P$ is higher in close races, so they vote more. If your theory is "voting is never explained instrumentally," you have to explain why "instrumental variables" (closeness) drive the behavior. You have to argue millions of people are coincidentally acting instrumental without being instrumental.
  *   **Verdict:** **High Nervousness.** It suggests the *explanation* for human behavior is instrumental, even if the math is shaky.

  **B. The "Large B" Exception (Existential Stakes)**
  *   **The Fact:** You argue $B$ (benefit) cannot be high enough to clear $C$. This assumes $B$ is measured in policy tweaks (tax rates, etc.).
  *   **The Math:**
      *   Cost ($C$): ~\$50 (time, travel).
      *   Probability ($P$): ~1 in 10,000,000 (conservative estimate for national).
      *   Break-even Benefit ($B$): \$500,000,000.
  *   **The Counter:** Is the difference between Democracy and Autocracy worth \$500M to you? If the election prevents a war, a depression, or the end of voting rights, the personal lifetime utility loss could easily exceed \$500M.
      *   *Real World:* Turnout spikes in "regime" elections (e.g., Weimar Germany, post-Soviet states, Brexit).
  *   **Verdict:** **Moderate Nervousness.** In "normal" elections, you win. In "existential" elections, your math might actually clear the bar.

  **C. Correlated Voting (The "Friends" Effect)**
  *   **The Fact:** Your model assumes your vote is independent. It isn't.
  *   **The Math:** If you vote, you likely influence 5-10 people in your social network (social contagion). You are not voting as an individual; you are voting as a node in a cluster.
  *   **Why it hurts:** If your vote triggers 10 others, your effective $P$ is $10 \times$ higher. In tight local elections, this pushes the probability into a range where instrumental voting becomes rational.
  *   **Verdict:** **Moderate Nervousness.** It attacks the independence assumption of your probability calculation.

  ---

  ### 3. SHRUG OFF
  *These are the standard objections you already anticipated. You are right to dismiss them.*

  **A. Civic Duty / Ethical Obligation**
  *   **Why shrug:** You correctly identified this changes the utility function from $U(\text{outcome})$ to $U(\text{acting rightly})$. This concedes the instrumental point.

  **B. Expressive Voting (Cheering for the Team)**
  *   **Why shrug:** Same as above. If I vote to feel good about myself, I am consuming a "good," not producing an outcome. This is consumption, not investment.

  **C. "One Vote Decided It" Anecdotes**
  *   **Why shrug:** Pointing to the 2017 Virginia House of Delegates race (decided by drawing a name from a bowl after a 1-vote tie) is *ex post* reasoning. *Ex ante*, the probability was still tiny. One swallow does not make a summer.

  ---

  ### THE VERDICT: Is your position unbreakable?

  **No.** You have insulated yourself against *Rational Choice Theory* (you are right that RCT cannot justify voting), but you have not insulated yourself against *Descriptive Psychology* or *Alternative Decision Theories*.

  **The specific vulnerability:**
  You wrote: *"Voting can never be explained instrumentally."*
  This is a claim about **causation of human behavior**, not just **mathematical rationality**.

  1.  **If you mean:** "It is never *rational* to vote instrumentally."
      *   **Status:** **Mostly Unbreakable.** (Unless you accept Minimax Regret).
  2.  **If you mean:** "People never *vote* for instrumental reasons."
      *   **Status:** **Broken.** People *say* they do, and they act like they do (turnout spikes in close races). The fact that they are mathematically wrong doesn't mean the *explanation* isn't instrumental. A gambler playing a negative EV game is still acting instrumentally (to win money); they are just bad at math.

  **The Numbers You Asked For:**
  You wanted a realistic close election where $P$ is bigger than assumed.
  *   **Standard Model:** $P \approx 1 / N$ (where $N$ is voters). In US Presidential, $N \approx 150M$. $P \approx 1$ in $150M$.
  *   **Gelman, Katz, & Bafumi (2004):** They modeled $P$ based on state-level variance. In a swing state like New Hampshire, $P$ is roughly **1 in 100,000**.
  *   **The Calculation:**
      *   $C = \$100$ (generous cost).
      *   $P = 1/100,000$.
      *   Break-even $B = \$10,000,000$.
  *   **The Nervous Fact:** Is the difference between candidates worth \$10M to you over 4 years? If you are a high earner, or if the policy affects your healthcare/life expectancy significantly, **$B$ could realistically exceed \$10M in lifetime utility.**
      *   *Example:* If Candidate A promises to cancel your \$50k student debt and Candidate B won't, $B = \$50k$. Not enough.
      *   *Example:* If Candidate A prevents a war that would draft your son, $B = \text{Price of a Life}$. Economists value statistical life at ~\$10M. **Suddenly, voting clears the bar.**

  **Final Advice for Debate:**
  Don't defend "Voting is rational." Defend "Voting is instrumentally *motivated*, even if instrumentally *ineffective*." That forces your opponent to argue about human psychology (where they will lose to data) rather than math (where they will win).

  If you stick to "It is mathematically irrational to vote for outcomes," you win the math battle but lose the war on explaining why 150 million people disagree with you.
