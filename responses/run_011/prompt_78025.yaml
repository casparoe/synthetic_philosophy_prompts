      *   *Objection 2: Close Elections (Real World Data).*
          *   *Fact:* There *are* elections decided by 1 vote.
          *   *Analysis:* Does this raise $P$ enough?
          *   *Math:* Even if 1 in 10,000 elections are close, is $1/10,000 \times B > C$? If $B$ is billions of dollars, maybe.
