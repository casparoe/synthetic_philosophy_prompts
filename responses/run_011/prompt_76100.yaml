prompt: |-
  I teach a 75-minute session of an upper-level population ethics seminar with 18 students, none of whom has read Parfit. Design an in-class activity that gets them to run into the nonidentity problem on their own, with nobody — including me — naming it until the debrief.

  The activity should turn on real choices made by the participants: some mechanism (cards, dice, a ballot, a budget allocation) whereby the policy they collectively adopt determines which individuals come to exist inside the simulation and how well off each is, arranged so that every life in the worse outcome is still worth living. The pivotal feature is that participants must answer, in writing and in a fixed format, the person-affecting question — who, if anyone, is worse off in outcome A than in outcome B — before they are permitted to say which outcome is better. Build in a contrast round where the very same harm falls on people who exist under either policy, so they can feel what the identity shift does to their reasoning. Then make them defend their ranking and record precisely which principle they reach for when they do.

  Please supply materials and mechanics (nothing requiring money), a minute-by-minute timeline, the exact wording of the written prompts, and a debrief that maps moments in the game onto the structure of the problem and onto the standard moves for escaping it — impersonal principles, a wide person-affecting principle, rights-based and threshold views. Be frank about which feature of the real case a card-and-dice simulation cannot reproduce and that I will have to supply myself. Finally, tell me what will predictably go wrong the first time I run it — in particular, whether students will try to escape by denying that the lives in the worse outcome are worth living, and how to head that off before it derails the round.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** 75-minute upper-level population ethics seminar.
      *   **Students:** 18 students, none have read Parfit.
      *   **Goal:** Design an in-class activity where students *discover* the Non-Identity Problem (NIP) on their own without the instructor naming it until the debrief.
      *   **Key Mechanics:**
          *   Real choices by participants (cards, dice, ballot, budget).
          *   Policy determines *who* exists and *how well off* they are.
          *   Crucial Condition: Every life in the "worse" outcome must still be worth living (life worth living > 0).
          *   Crucial Constraint: Students must answer the person-affecting question ("Who is worse off?") *in writing* before judging which outcome is better.
          *   Contrast Round: A scenario where the harm falls on existing people (same identity) to highlight the difference.
          *   Defense: Students must defend their ranking and record the principle used.
      *   **Deliverables:** Materials, mechanics, minute-by-minute timeline, exact prompt wording, debrief guide (mapping to impersonal principles, wide person-affecting, rights, thresholds), limitations of the simulation, and predicted pitfalls (specifically denying lives are worth living).

  2.  **Deconstruct the Non-Identity Problem (NIP):**
      *   *Structure:* Choice A leads to Person X existing with high welfare. Choice B leads to Person Y existing with lower (but still positive) welfare. X and Y are different people because the choice changes the conditions of conception (time, partner, resources, etc.).
      *   *Intuition:* B seems wrong/worse.
      *   *Person-Affecting View:* No one is worse off in B than in A (because X doesn't exist in B, and Y doesn't exist in A. Y is not worse off than non-existence if Y's life is worth living).
      *   *Conclusion:* If no one is worse off, how can B be wrong?

  3.  **Designing the Simulation (The "Mechanism"):**
      *   *Challenge:* Simulating "coming into existence" in a classroom without money or complex tech.
      *   *Idea:* Use "Identity Cards."
      *   *Setup:* Divide the class into "Policy Makers." The "Population" will be represented by generated profiles based on the policy choice.
      *   *Mechanism:*
          *   Round 1 (The NIP Round): Choice between Policy Early (high resource, specific ID) vs. Policy Late (low resource, different ID).
          *   To make it concrete: Use a deck of cards or dice to generate "People."
          *   *Refinement:* 18 students is a good size. Let's make *them* the future people, but their existence depends on the vote.
          *   *Better Refinement:* To avoid existential dread or confusion, let's use "Tokens" or "Profiles" on paper. Let's create 18 "Potential Person Profiles."
          *   *The Twist:* The policy choice changes the *shuffle* or the *deck* used to assign welfare, thereby changing *which* profile gets which welfare, or rather, which profiles *exist*.
          *   *Simpler Approach:* Let's use a "Time Capsule" metaphor.
          *   *Round 1 (Different People):* Policy A (Conservation) -> 18 specific people (IDs 1-18) with High Welfare (8/10). Policy B (Depletion) -> 18 *different* people (IDs 19-36) with Lower Welfare (4/10).
          *   *How to enforce identity shift?* Use sealed envelopes.
          *   *Round 2 (Same People):* Policy A -> IDs 1-18 with High Welfare. Policy B -> IDs 1-18 with Lower Welfare.
      *   *Constraint Check:* The prompt requires students to answer "Who is worse off?" *before* "Which is better?"
      *   *Materials:* Envelopes, Cards, Worksheets.

  4.  **Drafting the Activity Flow:**
      *   **Intro (5 mins):** Set the scene. No philosophy jargon.
      *   **Round 1: The Identity Shift (20 mins):**
          *   Scenario: Energy Policy.
          *   Option Safe: High cost, future people are Group A (High Welfare).
          *   Option Risky: Low cost, future people are Group B (Lower Welfare, but > 0).
          *   Mechanism: Two decks of cards. Deck A has high numbers. Deck B has lower numbers. But crucially, the *cards themselves* represent distinct individuals (e.g., Card A1 vs Card B1).
          *   Task: Vote. Fill out worksheet (Who is harmed? Which is better?).
      *   **Round 2: The Control (15 mins):**
          *   Scenario: Same Energy Policy, but affects *current* generation or fixed future group.
          *   Option Safe: Group A (High Welfare).
          *   Option Risky: Group A (Lower Welfare).
          *   Task: Vote. Fill out worksheet.
      *   **Comparison/Debrief (35 mins):** Compare answers. Reveal the paradox.

  5.  **Refining the Mechanics for "Who is Worse Off?":**
      *   To make the NIP bite, students must feel that in Round 1, no specific individual is harmed *compared to the alternative*.
      *   *Visual Aid:* Use colored slips of paper.
      *   *Round 1:* Blue Slips (Policy 1) vs. Red Slips (Policy 2).
      *   *Policy 1:* 18 Blue Slips drawn. Each has "Welfare: 8". Name: "Blue-1" to "Blue-18".
      *   *Policy 2:* 18 Red Slips drawn. Each has "Welfare: 4". Name: "Red-1" to "Red-18".
      *   *Question:* If you choose Red, is Red-1 worse off than they would have been? No, because if you chose Blue, Red-1 wouldn't exist. Blue-1 wouldn't exist either.
      *   *Round 2:* Blue Slips only.
      *   *Policy 1:* Blue-1 to Blue-18 get Welfare 8.
      *   *Policy 2:* Blue-1 to Blue-18 get Welfare 4.
      *   *Question:* Is Blue-1 worse off? Yes.

  6.  **Addressing the "Life Worth Living" Pitfall:**
      *   Students often say "Welfare 4 is miserable, they shouldn't exist."
      *   *Fix:* Explicitly define the scale. 0 = Non-existence. 1 = Barely worth living. 10 = Great. Ensure 4 is described as "Happy, but less resource security." *Crucial:* Pre-commit the class to the stipulation that 4 > 0.

  7.  **Drafting the Timeline:**
      *   0-5: Setup & Rules.
      *   5-25: Round 1 (Different Identities).
      *   25-40: Round 2 (Same Identities).
      *   40-75: Debrief & Theory Mapping.

  8.  **Drafting the Prompts:**
      *   Needs to be rigid. "1. List the names of individuals who are worse off in Option B than Option A. 2. Is Option B worse than Option A?"
      *   This forces the cognitive dissonance.

  9.  **Drafting the Debrief:**
      *   Connect Round 1 intuition (B is worse) with Round 1 Answer (No one is worse off).
      *   Introduce Parfit's name here.
      *   Map solutions: Impersonal (Total/Average), Wide Person-Affecting, Rights/Thresholds.
      *   Limitations: Simulation is discrete/timeless; real life is continuous/causal.

  10. **Predicting Failure Modes:**
      *   *Failure 1:* Students claim Red-1 is worse off because "they exist in both." -> *Correction:* Enforce the envelope rule. Red-1 is *only* in the Red envelope.
      *   *Failure 2:* Students claim Welfare 4 is not worth living. -> *Correction:* Instructor must stipulate this as a fact of the case. "In this simulation, 4 is defined as a happy life."
      *   *Failure 3:* Students refuse to vote. -> *Correction:* Make it a low-stakes budget allocation.

  11. **Review against Constraints:**
      *   75 mins? Yes.
      *   18 students? Yes (groups or whole class). Let's do whole class voting to ensure collective responsibility.
      *   No Parfit mention until debrief? Yes.
      *   Written format fixed? Yes.
      *   Contrast round included? Yes.
      *   Materials cheap? Yes (paper, envelopes, pens).

  12. **Final Polish:**
      *   Make the "Identity" mechanism very clear. Using "Seed Packets" is a good metaphor. Policy A plants Wheat Seeds (Person A). Policy B plants Corn Seeds (Person B). You can't say the Corn is worse off than the Wheat because they are different plants.
      *   Actually, "Time Travel/Conception" is clearer. Policy A = Conceive Now (Child A). Policy B = Conceive Later (Child B).
      *   Let's go with the "Policy & Envelope" method. It's the most robust for a classroom.
      *   *Self-Correction on Timeline:* 20 mins for Round 1 might be tight if discussion bleeds in. Keep instructions strict. "No talking during the worksheet phase."
      *   *Self-Correction on Pitfalls:* Emphasize the "Stipulation of Worth" in the instructions.

  13. **Finalizing the Output Structure:**
      *   Activity Title.
      *   Learning Objective.
      *   Materials List.
      *   Preparation (Pre-class).
      *   Minute-by-Minute Timeline.
      *   Script/Prompts (Exact Wording).
      *   Debrief Guide (Mapping to Theory).
      *   Limitations & Pitfalls.

  (Thinking through the "Who is worse off" constraint):
  If I ask them "Who is worse off?" and they write "No one," but then say "Option B is worse," they have hit the NIP.
  If they write "The people in Option B," I need to challenge them during the debrief, not the activity. During the activity, I must enforce the rules of the simulation (Red people don't exist in Blue world).

  Okay, ready to write.
answer: |-
  # Activity: The Seed & Soil Simulation
  **Topic:** Discovering the Non-Identity Problem (NIP)
  **Time:** 75 Minutes
  **Class Size:** 18 Students
  **Prerequisites:** None (No Parfit reading)

  ## 1. Learning Objective
  Students will experience the cognitive dissonance of the Non-Identity Problem firsthand. By separating *identity* from *welfare* in Round 1, and holding *identity* constant in Round 2, they will be forced to articulate why an outcome can be "worse" even when no specific individual is "worse off." They will leave the activity having generated the demand for impersonal principles before being introduced to the terminology.

  ## 2. Materials Required
  *   **36 Envelopes:** 18 labeled **"BLUE"** (Set A), 18 labeled **"RED"** (Set B).
  *   **36 Slips of Paper:** To go inside the envelopes.
      *   Blue Slips: Printed with "ID: A1" through "A18" and "Welfare Score: 8".
      *   Red Slips: Printed with "ID: B1" through "B18" and "Welfare Score: 4".
  *   **18 "Decision Worksheets"** (See Section 5 for exact text).
  *   **Whiteboard/Projector.**
  *   **Pens.**

  **Preparation Note:** The Welfare Scores must be explicitly defined on the board as: *0 = Non-existence. 1-3 = Life barely worth living. 4-6 = Good life, some hardship. 7-10 = Excellent life.* **You must stipulate that 4 is a "Good life."**

  ## 3. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Distribute Worksheets. Explain the "Welfare Scale" and the "Stipulation of Worth." No philosophy terms yet. |
  | **05-25** | **Round 1** | **The Identity Shift.** Present Policy choices. Students vote. **Crucial:** They must fill out the "Harm Audit" (Who is worse off?) *before* the "Value Judgment" (Which is better?). Collect worksheets. Open envelopes to reveal the "Population." |
  | **25-40** | **Round 2** | **The Control.** Present Policy choices (Same IDs, different welfare). Repeat the Worksheet process. Collect. Open envelopes. |
  | **40-55** | **Comparison** | Project anonymous aggregate data from worksheets. Highlight the contradiction between Round 1 and Round 2 answers. Facilitate student defense of their rankings. |
  | **55-75** | **Debrief** | Reveal the "Non-Identity Problem." Map student principles to standard philosophical moves (Impersonal, Wide Person-Affecting, Thresholds). Discuss simulation limitations. |

  ## 4. Mechanics & Script

  ### The Setup (00-05)
  **Instructor Script:**
  "Today we are running a policy simulation. You are the Planning Committee for a long-term community. You will make two decisions.
  **The Rule:** You cannot discuss the choices with neighbors until I tell you to.
  **The Scale:** On the board is the Welfare Scale. 0 is non-existence. 10 is paradise. **I am stipulating for this simulation that a Score of 4 represents a happy, healthy life with modest resources. It is strictly 'worth living.'** You are not permitted to argue that 4 is miserable. You must accept this as a fact of the simulation."

  ### Round 1: The Identity Shift (05-25)
  **Scenario:** "We have land for a new settlement. We can build **Now** or build **Later**."
  *   **Policy NOW (Blue Envelopes):** High resource cost. We settle immediately. The families who conceive now will have children **A1–A18**. Due to high resources, their welfare is **8**.
  *   **Policy LATER (Red Envelopes):** Low resource cost. We wait 50 years. The families who conceive later will be different people (different sperm/egg combinations due to time). These children will be **B1–B18**. Due to lower resources, their welfare is **4**.

  **Mechanism:**
  1.  Hand out the Decision Worksheet.
  2.  **Constraint:** Students must answer Question 1 (Harm Audit) before Question 2 (Value Judgment).
  3.  **Vote:** Students check a box for Policy NOW or LATER.
  4.  **Reveal:** Open the envelopes corresponding to the majority vote. Show the class the IDs and Scores. (If they vote LATER, show Red slips: "Look, B1 exists. B1 has a 4. A1 does not exist.")

  ### Round 2: The Control (25-40)
  **Scenario:** "We are maintaining an *existing* settlement. The people are already here (IDs A1–A18). We must choose a maintenance budget."
  *   **Policy HIGH (Blue Envelopes):** High budget. People **A1–A18** receive Welfare **8**.
  *   **Policy LOW (Red Envelopes):** Low budget. People **A1–A18** receive Welfare **4**.

  **Mechanism:**
  1.  Hand out a fresh Worksheet.
  2.  Repeat the constraint: Harm Audit first, then Value Judgment.
  3.  **Vote:** Students check a box.
  4.  **Reveal:** Open envelopes. (Note: In Round 2, use Blue envelopes for both, but swap the slips inside to show the welfare change, or simply announce the IDs are the same).

  ## 5. Exact Wording of Written Prompts
  *Print this on the Decision Worksheet. Do not deviate.*

  **DECISION WORKSHEET**
  **Circle Policy Choice:** [ POLICY A ]   [ POLICY B ]

  **PART 1: THE HARM AUDIT (Must complete before Part 2)**
  *Look strictly at the individuals who exist in your chosen policy.*
  *Compare them to the individuals who would have existed in the rejected policy.*
  1. List the specific ID numbers (e.g., A1, B7) of any person who is **worse off** in your chosen policy than they would have been in the rejected policy.
     _________________________________________________________________________
     _________________________________________________________________________
  2. If you listed no one, write "NO ONE" clearly.
     _________________________________________________________________________

  **PART 2: THE VALUE JUDGMENT**
  3. Is the outcome of your chosen policy **Better**, **Worse**, or **Equal** to the rejected policy?
     [ ] Better   [ ] Worse   [ ] Equal
  4. Briefly state the **Principle** you used to decide this. (e.g., "Maximize happiness," "Do not harm," etc.)
     _________________________________________________________________________

  ## 6. Debrief Guide (55-75)

  ### Step 1: Reveal the Data (55-60)
  Project two columns on the board based on the collected worksheets.

  *   **Round 1 (Different People):**
      *   % who said Outcome B (Welfare 4) is **Worse**: (Expect ~80-90%)
      *   % who wrote **"NO ONE"** in Harm Audit: (Expect ~50-70%)
  *   **Round 2 (Same People):**
      *   % who said Outcome B (Welfare 4) is **Worse**: (Expect ~100%)
      *   % who wrote **IDs A1-A18** in Harm Audit: (Expect ~100%)

  **Instructor Script:**
  "Look at Round 1. Most of you said Policy LATER is *worse*. But most of you also said *no one* is worse off.
  Look at Round 2. You said Policy LOW is *worse*. And you all agreed specific people are worse off.
  In Round 1, how can the outcome be worse if no one is worse off? Who is the victim of the bad policy?"

  ### Step 2: Naming the Problem (60-65)
  **Instructor Script:**
  "You have just reconstructed Derek Parfit's **Non-Identity Problem** (1984).
  In Round 1, the choice determined *who* exists. Person B1 cannot complain they were harmed, because without Policy LATER, B1 would not exist at all. Since B1's life (4) is worth living (>0), B1 is not harmed by being created.
  Yet, intuitively, a world of 4s is worse than a world of 8s.
  This breaks the **Person-Affecting View**: The idea that morality is only about making specific people better or worse off."

  ### Step 3: Mapping Student Principles to Theory (65-70)
  Ask students to read their "Principle" from Question 4. Map them to these categories:

  1.  **Impersonal Principles (Utilitarian/Total View):**
      *   *Student Quote:* "We should maximize total welfare."
      *   *Theory:* The outcome is bad because the *sum* is lower, regardless of who exists.
      *   *Risk:* Leads to the Repugnant Conclusion (massive population of barely worth living lives).
  2.  **Wide Person-Affecting Principle:**
      *   *Student Quote:* "We harm the future by not making better people."
      *   *Theory:* We expand 'harm' to include 'failing to bring into existence someone who would have been happier.' (Parfit's suggested fix).
  3.  **Threshold/Rights Views:**
      *   *Student Quote:* "4 is too low, they have a right to 8."
      *   *Theory:* There is a minimum threshold for procreation. If 4 is below the threshold, B1 *is* harmed (wrongful life).
      *   *Check:* Remind them of the stipulation that 4 is "Good." Does the threshold view survive that stipulation?

  ### Step 4: Simulation Limitations (70-75)
  **Instructor Script:**
  "What did this simulation fail to capture?"
  *   **Continuity:** Real identity shifts are causal chains, not colored envelopes.
  *   **Emotional Weight:** It is easy to say 'B1 doesn't exist' on paper; harder when imagining a real child.
  *   **The 'Asymmetry':** We feel a duty not to create miserable lives, but no duty to create happy lives. This simulation forces a choice between two existences, masking the asymmetry.

  ## 7. Predicted Pitfalls & Mitigation

  ### Pitfall 1: Denying the "Life Worth Living" Stipulation
  **The Risk:** In Round 1, students will rebel against the idea that Welfare 4 is "good." They will write in the Harm Audit: "B1 is worse off because a life of 4 is suffering." This dissolves the NIP because if 4 < 0, B1 *is* harmed by being born.
  **The Fix:**
  *   **Pre-emptive:** In the Setup (00-05), be authoritarian about the scale. "In this simulation, 4 is a happy life. If you argue 4 is miserable, you are breaking the rules of the model."
  *   **Reactive:** If a student writes "B1 is harmed because 4 is bad," challenge them in the Debrief. "If 4 is bad, this isn't Non-Identity, this is standard harm. Parfit's problem only works if the life is *worth living*. For the sake of the argument, assume 4 is a life you would choose to live."

  ### Pitfall 2: Confusing Identity (The "Soul" Objection)
  **The Risk:** Students will claim A1 and B1 are the "same soul" or "same citizen slot," arguing B1 is worse off because they got the "short end of the stick" compared to A1.
  **The Fix:**
  *   **Visuals:** Ensure the IDs are distinct (A vs B).
  *   **Script:** "In population ethics, identity is determined by the time and circumstances of conception. Change the policy, change the conception time, change the person. A1 and B1 are as different as you and your neighbor."
  *   **Worksheet:** The prompt asks for "Specific ID numbers." If they write "The future generation," mark it incorrect during the collection phase to enforce specificity.

  ### Pitfall 3: Refusing to Answer Part 1 Before Part 2
  **The Risk:** Students intuitively feel B is worse and skip the Harm Audit, missing the cognitive dissonance.
  **The Fix:**
  *   **Collection:** Walk around during the activity. If a student jumps to Part 2, gently tap their paper and point to Part 1. "Audit first. Who specifically is bleeding?"
  *   **Incentive:** Tell them their grade/participation credit depends on completing the *structure* of the worksheet, not the 'correct' answer.

  ### Pitfall 4: The "Non-Existence" Confusion
  **The Risk:** Students argue that Non-Existence (0) is worse than Welfare 4, so B1 is benefited by Policy B.
  **The Fix:**
  *   This is actually a valid philosophical move (benefit view). Acknowledge it in the Debrief. "Some of you might think B1 is *benefited* by being created. If so, Policy B is good. But most of you voted Policy B is *worse*. Why? That tension is the problem."

  ## 8. Instructor Cheat Sheet: The Logic Flow
  1.  **Intuition:** Policy B (Welfare 4) is worse than Policy A (Welfare 8).
  2.  **Person-Affecting Constraint:** An outcome is only worse if someone is worse off.
  3.  **Identity Fact:** In Policy B, Person B exists. In Policy A, Person B does not exist (Person A exists instead).
  4.  **Comparison:** Is B worse off in Policy B than in Policy A? No, because B doesn't exist in A.
  5.  **Welfare Fact:** B's life (4) is > 0 (Non-existence). So B is not harmed by existing.
  6.  **Paradox:** Policy B is worse (Intuition), but no one is worse off (Logic).
  7.  **Solution:** Reject the Person-Affecting Constraint (go Impersonal) OR Redefine Harm (Wide Person-Affecting) OR Set a Threshold.
