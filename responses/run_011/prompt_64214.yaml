      *   *Context:* Introduction to the Principles of Morals and Legislation.
      *   *Preceding text:* Mentions legs, skin hair, os sacrum (anatomy) are insufficient. Mentions reason/discourse. Comparison of horse/dog vs. human infant.
      *   *Key phrase:* "What else is it that should trace the insuperable line?"
