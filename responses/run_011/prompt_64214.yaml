      *   *Refining for the User's Constraints:* I need to make sure I hit the specific questions asked (Whose question? Notion of suffering? Line vs. Spectrum? Thesis vs. Dialectic?).

      *   *Drafting Item 1 (The Moral Ontology Reading):* Focus on *who counts*. Suffering capacity is the gateway.
