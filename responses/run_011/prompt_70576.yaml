  9.  **Final Polish:** Ensure the distinction between *extension* (which (2) mentions) and *content* (which (3) mentions) is clear. The argument conflates "no fixed extension" with "no determinate content." That's the key philosophical move to highlight. (Frege vs. Contextualists).

      *(Self-Correction)*: Wait, premise (2) says "no fixed extension." Premise (3) jumps to "no determinate content." This is the non-sequitur. Extension varies, but intension (or the rule for determining extension) can remain stable. I need to make sure this distinction is clear.

