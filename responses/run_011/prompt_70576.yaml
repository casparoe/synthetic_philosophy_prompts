          *   *Analogy:* Legal rules or games. "No vehicles in the park." Does it apply to bicycles? Context settles it, but the concept "vehicle" isn't meaningless.
      *   **Defining "Determinate Content" in this Context:** What must be true for a concept to be fixed jointly by concept and case without becoming indeterminate?
          *   There must be *constraints* on the slippage. It's not random.
          *   There must be *recognizable principles* governing the shift (e.g., preserving relational structure, minimizing conceptual distance).
          *   Copycat's "temperature" and "pressure" mechanisms model this. It's not chaos; it's a search through a constrained space.
      *   **Addressing Premise (4):** Does (4) survive?
          *   Yes, if "sharing a concept" means sharing the *mechanism* for resolving context, not just a static lookup table.
          *   Shared competence vs. Shared output. Experimenter and subject share the *disposition* to negotiate meaning in context.
      *   **Cost of Giving Up (3):**
          *   You lose the radical skepticism that makes the argument dramatic.
          *   You must articulate *what* constrains the fluidity. You can't just say "it's fluid"; you must say "it's fluid *in this specific way*."
          *   You move from "concepts don't exist" to "concepts are dynamic processes."
      *   **Alternative: What if (1) goes? (Briefly address as requested):**
          *   If you keep (3) and drop (1), you deny the empirical data. You'd have to claim subjects *were* applying a rigid rule and the "slippage" is just error/noise. This contradicts the core findings of the Copycat project (e.g., the $xyz$ problem). It's a high cost for a dissertation on analogy-making.

  6.  **Refining the Philosophical Nuance:**
      *   Need to be careful with the term "determinate."
      *   *Wittgensteinian angle:* Meaning is use. The "rule" isn't a rail extending to infinity; it's a practice.
      *   *Hofstadter/Mitchell angle:* Concepts are nodes in a network with activation levels. "Successor" isn't a binary switch; it's a probability distribution influenced by context.
