      *Wait, deeper:* In Copycat, even the *description* of the rule changes (e.g., "replace rightmost letter with successor" becomes "replace rightmost group with successor"). So the intension shifts too. This makes it harder. It's not just extension; it's the conceptual mapping itself.
      *Okay, so the "content" is the *topology of the concept space*.* The concept "Successor" is stable, but its *instantiation* depends on pressure.
      *Better philosophical framing:* Normative constraints. The slippage is *rationally reconstructible*. It's not arbitrary. If it's rationally reconstructible, it has content.

      *Let's stick to the Context-Dependence vs. Indeterminacy distinction.* That's the most robust way to save (1).

  10. **Finalizing the advice:**
