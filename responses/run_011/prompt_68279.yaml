  Twelve years ago I killed a spider in her kitchen with a shoe. I did it quickly because it was large and I was startled, and when she walked in she did not shout. She did not lecture me on the value of life. She looked at the smear on the linoleum and she said nothing at all. I have never forgotten that nothing. It was not forgiveness and it was not approval. It was simply a record that I had made a choice and she would not share it. That silence sits in this room tonight alongside everything else you know about her. You know the weight of the ledger on her desk. You know that for thirty-one years she wrote every name in it herself. You know she refused to let anyone in this building say an animal had been put to sleep. She insisted on the word killed. She did it at the end of the day after the volunteers had gone home. She did not hide the cost of that work from herself, and she did not ask the vets to hide it from her either.

  There are people here who argued with her about money and property. There are people here who held the scalpel when the decision was made. There are people here who swept the kennels when the silence was heavy. You know the work was hard. You know it was necessary. We are not here to justify the killing with the spiders, and we are not here to excuse the ledger with the yogurt pot. We are here because she stayed. She stayed when the donors threatened to walk. She stayed when the work broke her heart twice, and the people who hired her at nineteen are the ones who saw her cry.

  But there is another side to the room. There are people here who know about the wasps in the kennels. When a wasp got in, the door opened and everyone waited twenty minutes. There are people who know about the top drawer of her office desk. She kept a yogurt pot and a piece of envelope in there. When a spider appeared in the office she walked it out to the hedge. She did this in the rain. She did this in her indoor shoes. She did this while refusing to take in pigeons. When pressed on the pigeons she said that she simply did not like them. She offered no reason. She offered no policy. She was not wise about this. She was stubborn and specific. She treated every creature as a question she had to answer with her hands.

  Eleven years ago a guest wrote to her. He works on whether things like lobsters and crabs can be harmed at all. She had read a magazine article about prawn trawling in a dentist's waiting room. She wrote him two pages asking whether his science could tell her where the line was. He wrote back that it could not. He told her that nobody's could. She had that letter framed. She hung it by the door of her office. She told anyone who asked it was the most useful answer she had ever been given. She hung it because it told her that the rule was not there to be found.

  So she did not draw lines. She looked at what was in front of her. She looked at the cost of being wrong. Carrying a spider to the hedge costs a minute and the use of a yogurt pot. It costs nothing to the spider to be carried. It costs nothing to her to carry it. So she carried it. An animal in pain that will not stop is a different case. There the cost of holding back falls entirely on the animal. It is visible. It is running. She could not save them all. She could not save the pigeons. But she could decide what happened when she was the one holding the shoe. She could decide what happened when she was the one holding the ledger.

  When a volunteer asked her where she drew the line, she said: I don't draw lines I can't see, and I'm not starting now. That is hers. I am not going to try to improve it. I am not going to try to explain it. It belongs to the room. It belongs to the kennel workers. It belongs to the vets. It belongs to the donors. It belongs to my wife and her brothers. It belongs to the guest. It belongs to the man who killed the spider in the kitchen.

  She is retiring now. The ledger will close. The yogurt pot will be washed. The drawer will be emptied. But the habit remains. The habit of looking at the thing in front of you and asking what it costs to be careful. She never claimed to have the answer. She just claimed the work. She claimed the spider. She claimed the kill. She claimed the pigeon she would not touch. She claimed the silence in the kitchen.

  I hope you keep the drawer open for one more thing. I hope you keep the envelope ready. I hope you keep the pot. Because when you walk out of this hall tonight into the rain, there will be something on the path. You will look down. You will see it. You will know what to do. You have the shoes. You have the time. You have the pot.

  Mother, please keep the yogurt pot.
