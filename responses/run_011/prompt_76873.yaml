  pushing hours to **tomorrow**,
  ignoring simple **left**,
  distinguishing **blue**,
  through the foggy **grey**,
  swearing the tank is **empty**.

  Labels make it **empty**,
  though the vapour drifts **north**,
  in a cloud of **grey**,
  costing us **tomorrow**,
  deeper than **blue**,
  or simple **left**.

  You signal **left**,
  though the drum is **empty**,
  you see the **blue**,
  fixed against **north**,
  waiting for **tomorrow**,
  in the **grey**.

  The world is not **grey**,
  nor bound to **left**,
