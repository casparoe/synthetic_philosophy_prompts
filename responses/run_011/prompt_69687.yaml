answer: |-
  Here is the breakdown of Priya's likely verdict, the principle driving it, and how to test it.

  ### The Verdict
  Priya will **kill the split-table analysis** and tell you to lead with the **overall readmission rate**. Your headline should **credit the protocol**.

  She will argue that the stratified data (length of stay buckets) is statistically "rigged" because you are conditioning on a variable that the intervention itself causes. The overall number is the only honest measure of the protocol's real-world impact.

  ### The Primary Precedent
  She reaches first for **Case 3 (The Drug Story)**.

  *   **Case 3:** Drug $\rightarrow$ Influences "Finishing Course" $\rightarrow$ Survival. She banned stratifying by "Finishing Course."
  *   **Current Case:** Protocol $\rightarrow$ Influences "Length of Stay" $\rightarrow$ Readmission. You are asking to stratify by "Length of Stay."

  In both instances, the variable you want to split by is a **mediator** (a step in the causal chain), not a **confounder** (a pre-existing difference). In Case 3, she ruled that because the drug influences whether you finish the course, comparing only those who finished it selects for survivors in a way that biases the result. Here, because the protocol *defines* the length of stay, comparing only short-stay patients selects for a specific subset of protocol patients (those the protocol successfully moved) against non-protocol patients who were naturally healthy enough to leave early. That comparison is apples-to-oranges.

  ### The Underlying Rule
  There is one unifying rule behind all six of her calls, but it requires distinguishing between **Confounders** and **Mediators**.

  **The Rule:** *Stratify to control for pre-existing differences (Confounders); Integrate to capture total effect when the difference is caused by the treatment (Mediators).*

  *   **Cases 1, 2, 4, 5, 6 (Confounders):** Severity, Department, Income, Age, and pre-existing health status exist *before* the intervention. When the aggregate and stratified data disagree here, the aggregate is misleading (Simpson's Paradox). Priya demands you show the stratified truth (or at least contextualize the aggregate heavily).
  *   **Case 3 (Mediator):** "Finishing the course" happens *after* the treatment starts. Stratifying here creates **Collider Bias** (or over-adjustment bias). Priya demands you show the crude/overall truth (Intention-to-Treat).

  **Why this tips the verdict:**
  Your current case looks like Cases 1 and 4 (Simpson's Paradox: Overall Good, Stratified Bad). If Priya only followed a "Simpson's Rule" (always trust the strata), she would indict the protocol. But she follows a "Causal Rule." Since Length of Stay is a **Mediator** (like "Finishing Course"), the Simpson's pattern is an artifact of the causal pathway, not a hidden truth. The protocol works *by* shortening stays. If you remove that mechanism via stratification, you aren't testing the protocol anymore; you're testing something else.

  ### The Implication for Your Piece
  If you frame it Priya's way, you are committing the piece to an **Intention-to-Treat (ITT)** perspective.

  *   **You are answering:** "Does this policy work as a packaged system?"
  *   **You are NOT answering:** "Is the clinical care within the protocol safer for a patient with a fixed length of stay?"

  By crediting the protocol based on the overall number, you are acknowledging that shifting patients to shorter stays is part of the benefit (e.g., freeing up beds, reducing exposure to hospital-acquired risks). You are admitting that the "worse" performance in the buckets is likely because the protocol pulls moderately sick patients into the "short stay" bucket, where they are compared against non-protocol patients who were healthy enough to leave early naturally.

  If you try to fight her and run the split table, she will accuse you of "controlling for the treatment effect."

  ### The Follow-Up Case (The Litmus Test)
  To confirm this rule distinguishes her from a standard "Simpson's Purist" (who would say *always* stratify when the numbers flip), bring her this hypothetical:

  **The "App Compliance" Study**
  *   **Intervention:** A smartphone app designed to help patients take heart medication.
  *   **Outcome:** Heart health improvement after 1 year.
  *   **The Data:** Patients assigned the app have **better** health outcomes overall.
  *   **The Split:** When you split by "Medication Compliance" (Took meds correctly vs. Incorrectly), the App group does **worse** in both buckets.
  *   **The Mechanism:** The App *causes* higher compliance. (Most App users are in the "Correct" bucket; most non-App users are in the "Incorrect" bucket).

  **Why this tells the rules apart:**
  *   **The Simpson's Purist** (based on Cases 1, 2, 4) would say: "The aggregate is lying. Look at the buckets. The App is actually harmful; it just looks good because it moves people to the 'Compliant' bucket. We must stratify."
  *   **Priya's Causal Rule** (based on Case 3) would say: "Compliance is a mediator. The App works *by* making people compliant. Stratifying hides the benefit. Run the overall."

  If she kills the split on the App story, you know for sure her principle is **Causal Direction**, not just **Statistical Reversal**. That confirms you're safe running the overall number on the hospital protocol.
