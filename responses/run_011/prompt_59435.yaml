answer: |-
  Here are five candidate concepts that sit near the phenomenon you're describing, along with why each one falls short of capturing the full shape of the wall you're hitting.

  1.  **Vicious Circularity:** This is the logical worry that $A$ is defined by $B$, and $B$ is defined by $A$.
      *   *Why it falls short:* You correctly noted that individual steps look fine. This isn't a formal logical contradiction where the argument fails to prove anything. The process *works* locally; it just fails to anchor globally. It's not that the reasoning loops, but that the *parameters* of the reasoning float.
  2.  **The Euthyphro Dilemma:** The classic metaethical question: "Is the pious loved by the gods because it is pious, or is it pious because it is loved by the gods?"
      *   *Why it falls short:* This is the closest ancestor. It captures the tension between "process selects value" vs. "value validates process." However, Euthyphro is usually framed around *authority* (divine command) vs. *independent truth*. Your problem is about *specification*: how to tune the knobs of the process (information, patience) without already knowing the value. It's an engineering version of Euthyphro, not a theological one.
  3.  **The Criterion Problem (Pyrrhonian Skepticism):** To judge truth, you need a criterion; to judge the criterion, you need a criterion.
      *   *Why it falls short:* This is epistemic (about knowledge/truth), whereas your problem is axiological (about value/preference). Also, the Criterion Problem implies an infinite regress. Your wall isn't necessarily that you need infinite standards, but that the *first* standard you pick (the process) is already contaminated by the value you're trying to find.
  4.  **Underdetermination of Theory by Data:** In science, multiple theories can explain the same data.
      *   *Why it falls short:* Here, the "data" (the process parameters) doesn't determine the "theory" (the value). But underdetermination usually implies *any* of the rivals could be true. Your worry is stronger: *none* of them can be selected neutrally. It's not just that the map doesn't match the territory; it's that you can't draw the map without already knowing the territory.
  5.  **Goodhart's Law:** "When a measure becomes a target, it ceases to be a good measure."
      *   *Why it falls short:* This is about optimization pressure corrupting a proxy. Your problem arises *before* optimization, at the stage of *definition*. You aren't optimizing the wrong thing; you can't define the right thing without referencing the outcome of the optimization.

  ### (a) Precise Statement of the Phenomenon

  The phenomenon is **the inability to specify a value-neutral generative process for values without implicitly presupposing the values themselves.**

  You can recognize a new instance of it in the wild when you see a proposal that attempts to define a normative outcome (what we *should* want) via a procedural mechanism (what we *would* want if...), but where the ellipsis ("if...") contains parameters (information levels, cognitive capacities, time horizons) that cannot be set to "optimal" without referencing the very normative outcome the procedure is supposed to discover.

  The signature move is: When challenged on a parameter setting (e.g., "Why 100 years of reflection and not 10?"), the proponent justifies it by appealing to the quality of the output (e.g., "Because 10 years leaves in biases"), but the identification of "biases" relies on the output value system the process was meant to generate.

  ### (b) Comparison with Established Concepts

  **The Criterion Problem** is the nearest established concept.
  *   **Fit:** It captures the structural regress: you need a standard to judge the process, and a standard to judge that standard.
  *   **Break:** The Criterion Problem is traditionally about *justification* (how do I know I know?). Your problem is about *specification* (how do I write the code?). In the Criterion Problem, the worry is that we can't start. In your wall, we *can* start, but the starting point determines the destination in a way that masquerades as objectivity. The Criterion Problem is about the *ladder*; your problem is about the *compass* embedded in the ladder.

  **The Euthyphro Dilemma** is the nearest metaethical concept.
  *   **Fit:** It captures the dependency relation: Process $\leftrightarrow$ Output.
  *   **Break:** Euthyphro is a dichotomy (Horn A or Horn B?). Your phenomenon is a *continuum of parameter sensitivity*. It's not just "Process vs. Value," it's "Which version of the Process?" The Euthyphro Dilemma doesn't account for the *degrees* of idealization (more info vs. less info) that you identified in Wall #1 and #2.

  **Vicious Circularity** is the nearest logical concept.
  *   **Fit:** It captures the feeling that the argument eats its own tail.
  *   **Break:** As you noted, the steps are locally valid. Circularity implies a failure of proof. This is a failure of *grounding*. The system is coherent, but it floats. It's not a logical error; it's a metaphysical or definitional suspension.

  ### (c) One Phenomenon or Three?

  This is **one phenomenon** with three distinct manifestations.

  The shared structure is **Parameter Contamination**.
  *   **Wall 1 (Info Saturation):** The "Information" parameter is contaminated. You can't set it to "Max" because "Max" destroys value. You need a value-judgment to set the info-level.
  *   **Wall 2 (Idealization Arbitrariness):** The "Idealization" vector is contaminated. Patience, impartiality, and vividness are not orthogonal neutral axes; they are value-laden directions. Choosing the vector requires knowing where you want to go.
  *   **Wall 3 (Path Dependence):** The "Starting Point" parameter is contaminated. You can't average over starts without weighting them, and weighting requires valuing some starts over others.

  In all three cases, you are trying to turn a *normative* knob (how much should we value patience?) by using a *procedural* dial (set patience to $X$), but the dial only makes sense if you've already turned the knob. They share the structure of **Output-Dependent Process Specification**.

  ### (d) Coined Term and Definition

  Since no established term captures the specific *procedural specification* aspect of this within value learning, I propose the term:

  **Normative Bootstrapping**

  **Definition:** Normative Bootstrapping occurs when a value-learning process attempts to derive normative conclusions from a procedural specification, but the parameters of that specification can only be justified by referencing the normative conclusions they are intended to produce. It is the attempt to pull the definition of "good" up by its own procedural bootstraps.

  **Boundary Cases (Look like instances but aren't):**
  *   **Convergent Instrumental Goals:** If different starting points and processes all lead to the same outcome (e.g., "don't turn yourself off"), that is *not* Normative Bootstrapping. That is robust convergence. Bootstrapping requires that the process *determines* the outcome in a way that cannot be validated independently.
  *   **Simple Circular Definitions:** Defining "Good" as "What is Good" is trivial circularity. Normative Bootstrapping is non-trivial; the process is complex (reflection, information, modeling), making the dependency hidden rather than explicit.

  **Boundary Cases (Don't look like instances but are):**
  *   **Human Feedback Tuning (RLHF):** If you tune a "helpfulness" model by having humans rate outputs, but the humans' ratings depend on their current mood/bias which the model is supposed to correct for, you are Normative Bootstrapping. You are using current flawed preferences to define the process that corrects preferences.
  *   **Constitutional AI:** If the "constitution" (rules the model follows) is written by humans, but the claim is that the model is learning "objective" principles, this is Bootstrapping. The constitution is a fixed parameter that determines the output, but its authority is claimed to come from the output's quality.

  **Why this name?**
  "Bootstrapping" resonates with your ML background (training on own outputs) and the philosophical idiom ("pulling oneself up by one's bootstraps" = doing the impossible). "Normative" specifies that the impossibility lies in the *value* domain, not just the data domain. It captures the specific frustration that the procedure is doing heavy lifting it isn't authorized to do.

  \answer{Normative Bootstrapping}
