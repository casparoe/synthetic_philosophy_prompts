      *   *Check:* Did I address Tarski correctly? Tarski wanted a definition in a metalanguage. Deflationists often treat truth as primitive. The passage conflates these projects.
      *   *Check:* Is the Pragmatist charge totally baseless? Some early deflationists (like Dewey? No, he's a pragmatist). Some *critics* accuse deflationists of this. But standard deflationists (Horwich, Field) explicitly reject it. I must make clear this is a criticism *of* deflationism that the passage presents as a *concession by* deflationists.
      *   *Check:* Sentence 6 says "in practice, deflationists end up saying..." This implies deflationists *admit* this. They generally don't. They admit the *function* is endorsement, but not that truth *is* endorsement.

  7.  **Final Polish:** Ensure the table is clean and the prose flows logically from the audit. (Proceed to generate output).

      *   *One nuance on Sentence 4:* Tarski's theorem shows a language cannot contain its own *truth definition* satisfying classical logic. Deflationists don't typically offer a *definition*. They offer axioms. So the passage conflates "theory of truth" with "definition of truth."
      *   *One nuance on Sentence 5:* "Restricting them... leaves nothing to be deflationist about." This is the "revenge" problem. But again, inflationary theories have to restrict something too (e.g., what propositions exist).
