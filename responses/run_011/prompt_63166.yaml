answer: |-
  You have put your finger on one of the most persistent tensions in economic modeling and the philosophy of science. You are describing a move that has a formal name in philosophy, a technical name in econometrics, and a colloquial reputation among skeptics.

  The philosophical term is an **Immunizing Stratagem** (coined by Imre Lakatos). The econometric term is **Identification Failure** (specifically, under-identification of latent parameters).

  But since you asked for a carving you can actually apply to a paper—a definition that distinguishes this specific "mixture of types" move from legitimate modeling adjustments—I will give you a specific label for it. Let's call it:

  ### **The Unidentified Type Rescue**

  Here is the definition, the criteria for spotting it, and the boundaries that separate it from legitimate science (like QRE or Level-k).

  ---

  ### 1. The Definition
  An **Unidentified Type Rescue** occurs when a theoretical model fails to match observed data, and the theorist preserves the core logic of the model by positing a latent mixture of agent types (e.g., "rational" vs. "altruistic"), where the proportion of these types is **inferred solely from the data the model failed to predict**, without independent measurement or out-of-sample constraints.

  ### 2. The Three Diagnostic Criteria
  To classify a patch as an *Unidentified Type Rescue*, check for these three conditions. If all three are present, you are looking at the move you described.

  1.  **Core Preservation:** The fundamental mechanism of the theory (e.g., backward induction, payoff maximization) is declared correct and remains unchanged. The "error" is relocated entirely into the *population composition*, not the *logic*.
  2.  **Latent Flexibility:** A new parameter is introduced (e.g., $\epsilon$, the share of "irrational" types) that has no independent measure. You cannot observe this share before running the experiment; it is not a demographic, not a survey response, and not a prior behavior.
  3.  **Exact Fitting:** The value of this parameter is chosen *post-hoc* to minimize the distance between the model's prediction and the specific dataset at hand. The model has exactly enough degrees of freedom to fit the anomaly perfectly.

  **The Result:** The theory becomes compatible with any outcome. If everyone cooperates, $\epsilon$ was high. If everyone defects, $\epsilon$ was low. The theory explains everything and predicts nothing.

  ---

  ### 3. The "Cheating" Detector: Over-Identification
  You asked why some patches feel like cheating and others don't. The difference is **over-identification**.

  In legitimate science, you want more data points than free parameters.
  *   **The Rescue:** 1 Parameter (type share) $\rightarrow$ 1 Data Point (cooperation rate). This is *just-identified*. It fits by definition.
  *   **Legitimate Adjustment:** 1 Parameter $\rightarrow$ Multiple Data Points (cooperation rate + response to payoff changes + response to horizon length). This is *over-identified*. If the parameter fits the first point but misses the second, the model is falsified.

  **The Test:** If the paper estimates the "share of altruists" using the Centipede Game data, does that *same* share predict behavior in a Trust Game or a Public Goods Game *without re-fitting*?
  *   **Yes:** It is a structural model (Science).
  *   **No:** It is an Unidentified Type Rescue (Immunization).

  ---

  ### 4. The Near Misses (Why QRE and Level-k are different)
  You mentioned Quantal Response Equilibrium (QRE) and Level-k thinking. They also add free parameters (a noise temperature $\lambda$, or a distribution of reasoning depths). Why do they often get a pass?

  **Quantal Response Equilibrium (QRE):**
  *   **The Move:** Players maximize utility, but with noise. High payoff differences $\rightarrow$ low error. Low payoff differences $\rightarrow$ high error.
  *   **Why it's not a Rescue:** It imposes a **functional constraint**. You can't just fit "noise" to match one data point. The parameter $\lambda$ dictates how sensitive choices are to *changes* in payoffs. If you fit $\lambda$ in one game, the model makes strict predictions about how behavior shifts when you change the payoffs in a second game. It risks being wrong.
  *   **The Edge:** If a paper uses QRE but lets $\lambda$ vary freely for every single decision node without constraint, it has slid into an Unidentified Type Rescue.

  **Level-k Thinking:**
  *   **The Move:** Players do $k$ steps of reasoning.
  *   **Why it's not a Rescue:** It predicts **systematic patterns** of error, not just "some error exists." It predicts that L1 players will be exploited by L2 players in specific ways. It generates distinct clusters of behavior.
  *   **The Edge:** If a paper simply says "some people are Level-0, some are Level-1" and fits the mix to the average outcome, it's a Rescue. If it classifies individuals based on their choices and shows the distribution is stable across games, it's a Theory.

  **Revealed Preference:**
  *   **The Move:** We infer preferences from choices.
  *   **Why it's different:** This is an **axiom**, not a causal model. It doesn't claim to predict *why* you chose A over B, only that choosing A implies you prefer A. It is tautological by design, but it doesn't claim to be a psychological mechanism. It's a bookkeeping system, not a rescue of a broken mechanism.

  ---

  ### 5. Summary: How to Apply This
  When you read a paper, look for the **knob**.

  1.  **Find the parameter** that was added to make the theory fit the data (the "share of types," the "error rate," the "bias").
  2.  **Ask:** Was this parameter measured *before* the model was tested?
  3.  **Ask:** Does fixing this parameter force the model to make a *risky* prediction elsewhere (out-of-sample)?

  If the answer to both is **No**, you are watching an **Unidentified Type Rescue**. The theory is being protected from falsification by hiding the discrepancy in an unobservable variable that is tuned to disappear the discrepancy.

  Your friend is right that all science adjusts theories to fit data. But the line between **refinement** and **immunization** is whether the adjustment creates new risks for the theory. The move you spotted in the Centipede Game literature removes risk; it makes the theory safer, not stronger. That is the hallmark of the Immunizing Stratagem.
