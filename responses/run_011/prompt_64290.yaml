prompt: |-
  I have ninety minutes with a first-year graduate seminar in political philosophy, and the aim is to get them to see what actually separates prioritarianism from egalitarianism. I want to build the session around Parfit's leveling-down objection rather than around texts, and I want a plan for the explanation, not the explanation itself.

  The students arrive from three weeks on Rawls's difference principle, and I expect several to assume the priority view is just that principle restated in welfare terms. Tell me what has to be secured before the outcome comparison can do any work: I suspect the in-one-respect-better versus all-things-considered-better distinction must precede the numbers, but I don't know where welfarism and interpersonal comparison belong, or whether the person-affecting idea should surface at all. Vet the toy case I intend to use — two hundred people, half at welfare 100 and half at 200; then all at 150; then all at 100 — and say what it must contain and what it must leave out for the objection to bite rather than look like a cheap trick.

  Then map the misconceptions I should expect: that the objection asserts leveling down is good, that it disqualifies any concern for the worst off, that prioritarianism is the difference principle in disguise. Fix the point in the sequence at which each should be headed off, give me one closing question whose answers separate students who hold the distinction from students who have memorized a slogan, and say which neighbouring disputes — mere addition, deontic egalitarianism, whether the priority view is even consequentialist — I should defer and openly announce as deferred. Throughout, mark which moves are settled among people who work on this and which remain genuinely contested; I don't want to hand the seminar a live dispute dressed up as consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** First-year graduate seminar in political philosophy.
      *   **Background:** Three weeks on Rawls's Difference Principle (DP).
      *   **Topic:** Distinguishing Prioritarianism from Egalitarianism using Parfit's Leveling-Down Objection (LDO).
      *   **Constraint:** 90 minutes.
      *   **Format:** A plan for the explanation, *not* the explanation itself.
      *   **Specific Requirements:**
          *   Identify prerequisites (what must be secured before outcome comparison).
          *   Role of welfarism, interpersonal comparison, person-affecting view.
          *   Vet the specific toy case (200 people: 100/200 $\to$ 150/150 $\to$ 100/100).
          *   Map misconceptions (LDO says leveling down is good, disqualifies concern for worst off, prioritarianism = DP).
          *   Timing for addressing misconceptions.
          *   One closing question to test understanding vs. memorization.
          *   Identify neighboring disputes to defer (Mere Addition, Deontic Egalitarianism, Consequentialist status).
          *   Distinguish settled vs. contested claims.

  2.  **Deconstruct the Philosophical Core:**
      *   *Egalitarianism (Telic):* Equality is intrinsically valuable. Inequality is bad in itself.
      *   *Prioritarianism:* Benefiting people matters more the worse off they are. No intrinsic value to equality.
      *   *Leveling-Down Objection (LDO):* If equality is intrinsically valuable, a world where everyone is worse off but equal is *in one respect* better than a world where some are better off but unequal. This seems absurd (no one benefits, some lose).
      *   *The Distinction:* Prioritarianism avoids LDO because it only cares about weighted welfare, not the pattern of distribution itself.
      *   *The Rawls Confusion:* Rawls's DP looks prioritarian (maximin), but it's often framed as a contractarian constraint or a form of relational equality. Students often conflate "giving priority to the worst off" with "egalitarianism."

  3.  **Address the Prerequisites (Before the Numbers):**
      *   *Welfarism:* LDO relies on a common currency of advantage. If we are talking about rights or status, leveling down might make sense (e.g., abolishing aristocracy). Must establish we are talking about *telic welfarist egalitarianism*.
      *   *Interpersonal Comparison:* Need to assume we can compare welfare levels (100 vs. 200).
      *   *In-One-Respect vs. All-Things-Considered:* Crucial. Egalitarians don't say leveling down is *all-things-considered* better. They say it's better *qua* equality. This is the defensive move. The LDO attacks the plausibility of that "one respect."
      *   *Person-Affecting:* This is the engine of the LDO. "Better for whom?" If no one is better off in the leveled-down scenario, in what sense is it better? This needs to surface early but carefully (Parfit's Non-Identity stuff is a rabbit hole, keep it to the intuition).

  4.  **Vet the Toy Case:**
      *   *Current:* 200 people (100 @ 100, 100 @ 200) $\to$ All @ 150 $\to$ All @ 100.
      *   *Problem:* The move from (100/200) to (150/150) is a Pareto improvement (or close to it, depending on aggregation). It doesn't trigger the LDO. The LDO triggers on the move from (100/200) to (100/100) or (150/150) to (100/100).
      *   *Correction:* Need to compare A (Unequal, Higher Total) vs. B (Equal, Lower Total).
      *   *Refined Case:*
          *   Outcome A: Half at 100, Half at 200. (Avg 150).
          *   Outcome B: All at 100. (Avg 100).
          *   *Why:* In B, the rich are worse off, the poor are no better off. Equality is achieved. Total welfare drops.
          *   *Must Contain:* Clear stipulation that no one gains in the move to equality. Clear stipulation that the "poor" stay at the same absolute level.
          *   *Must Leave Out:* Envy, social stability, incentives, procedural injustice. These are instrumental reasons for equality. LDO targets *intrinsic* value.

  5.  **Map Misconceptions & Timing:**
      *   *Misconception 1: "LDO says leveling down is good."*
          *   *Fix:* Early, when defining the objection. It says egalitarianism *implies* it's good in one respect, which is absurd.
      *   *Misconception 2: "Prioritarianism = Difference Principle."*
          *   *Fix:* After defining Prioritarianism. DP is often restricted to basic structure/primary goods; Prioritarianism is moral/welfarist/unrestricted. Also, DP is often contractualist, not teleological.
      *   *Misconception 3: "Objection disqualifies concern for worst off."*
          *   *Fix:* During the Prioritarian definition. Prioritarianism *keeps* the concern, drops the equality.

  6.  **Neighboring Disputes to Defer:**
      *   *Deontic Egalitarianism:* (Equality is about relations, not outcomes). Crucial to bracket this, or LDO doesn't stick.
      *   *Mere Addition/Non-Identity:* Too technical for 90 mins.
      *   *Is Prioritarianism Consequentialist?* (Scanlon's critique). Interesting, but distracts from the Egal/Prior distinction.

  7.  **Closing Question:**
      *   Needs to force a choice between pattern and weighted sum.
      *   *Idea:* A case where Prioritarianism and Egalitarianism diverge but LDO isn't the direct trigger. Or a case where they agree but for different reasons.
      *   *Better:* A case where leveling down *does* benefit someone (instrumentally). If they say "Leveling down is good because it stops envy," they miss the *intrinsic* point.
      *   *Best:* "If we discover that inequality causes no social strife and the worse off are content, does the egalitarian still have a reason to redistribute?" (Yes = Telic Egalitarian. No = Instrumental/DP).
      *   *Wait, need to separate Prior vs. Egal.*
      *   *Revised:* "Outcome A: Everyone at 100. Outcome B: Everyone at 101, except one person at 50 (but weighted priority makes B better). Outcome C: Everyone at 90."
      *   *Actually, the prompt asks for a question that separates those who hold the distinction vs. memorized a slogan.*
      *   *Question:* "Does the prioritarian object to Outcome B (Unequal) over Outcome A (Equal) *if* the total weighted welfare is higher in B?" (Prioritarian: No objection. Egalitarian: Yes, pro tanto objection).
      *   *Let's refine:* "Imagine a policy that raises the worst off from 10 to 20, and the best off from 100 to 200. An egalitarian and a prioritarian both support it. Why? Now imagine a policy that lowers the best off from 100 to 20, leaving the worst off at 10. Who supports it?"
      *   *Selection:* The "Blindness to Patterns" question.

  8.  **Settled vs. Contested:**
      *   *Settled:* LDO is the standard challenge to Telic Egalitarianism. Prioritarianism is defined by the concave transformation of welfare.
      *   *Contested:* Whether Deontic Egalitarianism escapes LDO (Anderson/Scheffler say yes, others say no). Whether Prioritarianism is sufficiently distinct from DP in practice. Whether "in one respect better" is a coherent notion (value pluralism).

  9.  **Drafting the Plan (Iterative refinement for time and flow):**
      *   *0-15:* Setup & Definitions (Welfarism, Telic Egal).
      *   *15-30:* The Toy Case & LDO (The "One Respect" move).
      *   *30-45:* Prioritarianism as the Solution (Weighted welfare).
      *   *45-60:* Rawls/DP Distinction (Contractualism vs. Teleology).
      *   *60-75:* Objections & Nuance (Deontic bracketing).
      *   *75-90:* Closing Question & Wrap.

      *Self-Correction on Time:* 90 minutes goes fast. Need to be ruthless. The Rawls comparison needs to happen *before* the LDO fully lands, otherwise they interpret LDO through Rawlsian lenses. Actually, better to define the views first, then hit with LDO, then distinguish from Rawls.
      *Revised Flow:*
      1. Concepts (Egal vs Prior).
      2. The Case & LDO.
      3. The "One Respect" Defense.
      4. Why Prioritarianism avoids it.
      5. The Rawls Confusion (DP).
      6. Deferrals & Closing.

      *Refining the Toy Case:* The user's case (100/200 $\to$ 150/150 $\to$ 100/100) is confusing.
      Step 1: 100 @ 100, 100 @ 200.
      Step 2: All @ 150. (Pareto superior to Step 1? No, rich lose 50, poor gain 50. Sum constant).
      Step 3: All @ 100. (Leveling down from Step 1).
      *Focus:* Compare Step 1 (Unequal) vs Step 3 (Equal but worse for some, same for others). This is the pure LDO case.
      *Instruction:* Tell the user to drop the "All at 150" intermediate. It muddies the water. Go straight from Unequal to Leveled-Down.

      *Refining Prerequisites:*
      1.  **Telic vs. Deontic:** Must establish we are talking about *outcomes* being good/bad, not actions being wrong.
      2.  **Welfarism:** Must establish the currency is welfare, not rights.
      3.  **In-One-Respect:** This is the shield. The LDO is the sword.

      *Refining Misconceptions:*
      1.  LDO claims leveling down is *all-things-considered* good. (Correct: It claims Egalitarianism implies it's *pro tanto* good).
      2.  Prioritarianism ignores the worst off. (Correct: It weights them heavily).
      3.  Prioritarianism = DP. (Correct: DP is often non-welfarist/contractualist).

      *Refining Closing Question:*
      "If we could make everyone equal by destroying the surplus of the better off without transferring it to the worse off, does the mere fact of equality add value to the world?"
      *Better:* "A Prioritarian and a Telic Egalitarian agree on Policy X. Policy X helps the poor more than the rich. Do they agree on *why*?" (Yes, but the Egalitarian adds a second reason).
      *Best (per prompt requirements):* Needs to separate slogan memorizers from understanding.
      "Suppose we have two outcomes. A: Everyone at 100. B: Half at 90, Half at 110. The Prioritarian prefers B (due to convexity/total welfare). The Egalitarian prefers A. Now suppose C: Everyone at 80. Who prefers C over B?"
      *Actually, let's stick to the core distinction:* "Does the existence of a gap between people constitute a negative value *independent* of how low the lower party is?"

      *Settled vs. Contested:*
      *Settled:* Parfit introduced the distinction. LDO is the main argument against Telic Egalitarianism.
      *Contested:* Whether Deontic Egalitarianism is immune. Whether Prioritarianism is plausible without a person-affecting restriction.

  10. **Final Review against Constraints:**
      *   Plan, not explanation.
      *   90 mins.
      *   Address welfarism/interpersonal/person-affecting.
      *   Vet toy case.
      *   Map misconceptions + timing.
      *   Closing question.
      *   Deferrals.
      *   Settled/Contested markers.

      *Let's write it.*
answer: |-
  Here is a 90-minute seminar plan designed to secure the conceptual distinction between prioritarianism and egalitarianism using Parfit's Leveling-Down Objection (LDO).

  ### I. Prerequisites: Securing the Ground (Minutes 0–15)
  Before introducing the numbers, you must fix the metric and the modality. If these are loose, the LDO will bounce off.

  1.  **Telic vs. Deontic (The Modality):**
      *   **Secure:** Explicitly stipulate that you are discussing **Telic Egalitarianism** (the view that it is *intrinsically good* if outcomes are equal).
      *   **Why:** If students think egalitarianism is about fair procedures or social relations (Deontic/Relational Egalitarianism), the LDO does not bite. A relational egalitarian can agree that leveling down is absurd without abandoning their view.
      *   **Status:** *Settled* that Parfit's target is Telic Egalitarianism. *Contested* whether Telic Egalitarianism is the only plausible form of egalitarianism (Anderson/Scheffler dispute this).

  2.  **Welfarism & Interpersonal Comparison (The Metric):**
      *   **Secure:** Stipulate that the "currency" of justice is welfare (or well-being) and that interpersonal comparisons are possible (we can say Person A is at 100 and Person B is at 200).
      *   **Why:** If the currency is "rights" or "status," leveling down (e.g., disenfranchising the voters to match the non-voters) might seem plausible. The LDO relies on the intuition that reducing welfare without compensation is bad.
      *   **Status:** *Settled* for the sake of this specific argument (Parfit's framework). *Contested* in broader theory (Sen/Nussbaum would reject welfarism).

  3.  **The "In-One-Respect" Distinction:**
      *   **Secure:** Before showing the case, establish that the Egalitarian claim is not that leveling down is *all-things-considered* better, but better *in one respect* (the respect of equality).
      *   **Why:** This is the standard defensive move. If you don't secure this, students will think the LDO is a straw man ("No egalitarian thinks destroying wealth is good!"). You must grant the "one respect" claim to show why it is still damaging.
      *   **Status:** *Settled* as the standard dialectical move. *Contested* whether "value in one respect" is coherent if it never translates to "reason to act."

  4.  **The Person-Affecting Intuition:**
      *   **Secure:** Do **not** dive into Non-Identity Paradoxes. Instead, secure the shallow intuition: "If Outcome A is better than Outcome B, it must be better *for someone*."
      *   **Why:** The LDO derives its force from the fact that in a leveling-down scenario, no one is better off, and some are worse off.
      *   **Status:** *Contested.* Parfit himself questions the Person-Affecting View elsewhere, but the LDO relies on its intuitive pull. Be clear this is an intuitive pump, not a metaphysical proof.

  ---

  ### II. Vetting the Toy Case (Minutes 15–30)
  Your proposed case (100/200 $\to$ 150/150 $\to$ 100/100) contains a fatal distraction. The move to 150/150 is a transfer that benefits the poor. That conflates **Prioritarianism** (help the poor) with **Egalitarianism** (close the gap).

  **The Fix:**
  You need two outcomes, not three. Compare **Unequal** vs. **Leveled-Down**.

  *   **Outcome A (Unequal):** 100 people at 100 welfare; 100 people at 200 welfare.
  *   **Outcome B (Leveled-Down):** 200 people at 100 welfare.

  **What the Case Must Contain:**
  1.  **No Gain for the Poor:** The worse-off group must remain at exactly the same absolute level (100) in both outcomes. If they gain, the Prioritarian and Egalitarian agree, and the distinction vanishes.
  2.  **Loss for the Rich:** The better-off group must lose welfare to achieve equality.
  3.  **No Instrumental Effects:** Stipulate explicitly: "Assume this change causes no social strife, no envy, and no economic collapse. We are isolating the intrinsic value of the pattern."

  **What the Case Must Leave Out:**
  1.  **The "150" Intermediate:** Do not introduce an outcome where the poor gain. It tempts students to think Egalitarianism is just "helping the poor."
  2.  **Envy/Resentment:** If students argue "The poor feel better knowing the rich are poorer," you have introduced instrumental value. Shut this down immediately.
  3.  **Desert:** Do not allow arguments about whether the rich *deserve* their 200. This introduces retributive justice, not distributive equality.

  **The Pedagogical Move:**
  Ask: "Does Outcome B contain anything *good* that Outcome A lacks?"
  *   If they say "Yes (Equality)," they are Telic Egalitarians.
  *   If they say "No (No one is better off)," they are immune to LDO (Prioritarians/Person-Affecting).

  ---

  ### III. Mapping Misconceptions & Timing (Minutes 30–60)
  Introduce Prioritarianism as the view that escapes the LDO while retaining concern for the worst off. Address misconceptions as they arise in the sequence.

  | Misconception | When to Head It Off | The Correction |
  | :--- | :--- | :--- |
  | **"The LDO claims leveling down is *all-things-considered* good."** | **Minute 20** (Immediately after presenting the Toy Case). | Clarify: The objection is that Telic Egalitarianism implies leveling down is *pro tanto* (in one respect) good. The absurdity is that there is *any* respect in which a world where some lose and none gain is 'better'. |
  | **"Prioritarianism is just the Difference Principle (DP) in welfare clothing."** | **Minute 45** (When defining Prioritarianism). | **Crucial Distinction:** Rawls's DP is (a) restricted to the basic structure, (b) uses Primary Goods not welfare, and (c) is often justified contractually (what would be agreed to), not teleologically (what makes outcomes good). Prioritarianism is a moral principle about value, unrestricted and welfarist. |
  | **"The LDO proves we shouldn't care about the worst off."** | **Minute 50** (When explaining the Prioritarian solution). | Clarify: Prioritarianism agrees we should benefit the worst off. It disagrees that we should do so *to achieve equality*. It weights welfare gains by how badly off the recipient is. |
  | **"Deontic Egalitarianism is refuted by this."** | **Minute 60** (Transition to deferrals). | Clarify: Relational egalitarians (Anderson) argue the LDO only kills *Telic* Egalitarianism. This is a live dispute, but for this seminar, we bracket it. |

  ---

  ### IV. Neighboring Disputes to Defer (Minutes 60–75)
  To keep the seminar focused, explicitly announce that you are "bracketing" the following. Write them on the board under "Deferred."

  1.  **Deontic/Relational Egalitarianism:**
      *   *Announcement:* "We are assessing the value of *outcomes*, not the nature of *relationships*. Whether equality is about standing rather than welfare is a different debate."
      *   *Status:* *Contested.* (Anderson/Scheffler vs. Holtug).
  2.  **The Mere Addition Paradox / Non-Identity:**
      *   *Announcement:* "We are assuming fixed populations. Whether leveling down is bad changes if the people involved don't exist in the alternative outcome."
      *   *Status:* *Contested.* (Parfit's *Reasons and Persons*).
  3.  **Is Prioritarianism Consequentialist?**
      *   *Announcement:* "We are treating Prioritarianism as a view about value. Whether it can be integrated into a deontological framework (Scanlon) is a separate structural question."
      *   *Status:* *Contested.* (Scanlon argues priority can be contractualist).
  4.  **The "One Respect" Coherence:**
      *   *Announcement:* "We are granting for argument's sake that 'value in one respect' is coherent. Some argue if it doesn't affect 'all-things-considered' judgment, it isn't value."
      *   *Status:* *Contested.* (Raz/Chang on value pluralism).

  ---

  ### V. Closing Question (Minutes 75–90)
  Do not ask them to define the terms. Ask them to apply the distinction to a case where the two views diverge *without* leveling down. This tests if they understand the *source* of value, not just the LDO.

  **The Question:**
  > "Consider two outcomes.
  > **Outcome X:** Everyone is at welfare level 100.
  > **Outcome Y:** Everyone is at welfare level 100, *except* one person is at 101.
  >
  > There is no envy, no social instability, and no one knows anyone else's level.
  >
  > **1.** Does the Telic Egalitarian see a *pro tanto* reason to prefer X over Y?
  > **2.** Does the Prioritarian see a *pro tanto* reason to prefer X over Y?
  > **3.** Why?"

  **The Answer Key (For You):**
  *   **Telic Egalitarian:** Yes, prefer X. Y is unequal. Equality has intrinsic value, even if the inequality is tiny and unknown.
  *   **Prioritarian:** No preference (or prefers Y on total welfare grounds). Inequality has no intrinsic disvalue. The tiny gain to the one person adds value; the gap adds nothing negative.
  *   **The Slogan Memorizer:** Will hesitate or say "Prioritarians hate inequality."
  *   **The Understanding Student:** Will say "Prioritarians are blind to patterns. They only see weighted sums. If no one is worse off in Y, there is no priority-based reason to reject it."

  **Final Instruction to Students:**
  "Your task for next week is not to decide which view is true. It is to identify whether Rawls's text relies on the intrinsic badness of inequality (Egalitarian) or the priority of the least advantaged (Prioritarian), keeping in mind the contractualist constraints we bracketed today."

  ---

  ### VI. Summary of Settled vs. Contested Claims
  *Use this checklist to ensure you don't present disputes as dogma.*

  *   **Settled (Teach as Fact):**
      *   Parfit formulated the Leveling-Down Objection to distinguish these views.
      *   Telic Egalitarianism implies leveling down is good in one respect.
      *   Prioritarianism assigns greater moral weight to benefits for the worse off without valuing equality intrinsically.
      *   The LDO is widely considered the primary reason for abandoning Telic Egalitarianism in contemporary Anglophone philosophy.

  *   **Contested (Teach as Dispute):**
      *   Whether Deontic Egalitarianism is a viable alternative that escapes the LDO.
      *   Whether the "in-one-respect" defense saves Telic Egalitarianism from absurdity.
      *   Whether Prioritarianism is distinct enough from the Difference Principle to matter in non-ideal theory.
      *   Whether the Person-Affecting Intuition (which fuels the LDO) is actually defensible.
