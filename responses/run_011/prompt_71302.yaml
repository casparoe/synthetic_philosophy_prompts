  Then about 150 words of prose on the unsatisfiable pair and on the most exclusionary requirement, then one line each on how three stances do against your list: Ruth's it's-all-artifact view, the strong skeptical view, and my calibration-drift middle. Then a JSON object with exactly these fields: `unsatisfiable_pair` (an object with `a`, `b`, `why`), `most_exclusionary` (an object with `id` and `why`), `where_ruth_is_right`, `where_i_am_right`, `requirement_i_should_give_up` — the last three as short strings.

  No citations or reading list, I'm offline and would have to take your word for them anyway. If a requirement comes out of a particular study, describe the study's setup rather than naming it.
