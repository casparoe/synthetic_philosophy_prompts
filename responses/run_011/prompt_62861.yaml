answer: |-
  Mapping Fricker's framework onto Hillsborough requires stretching the dyadic model of speaker and hearer into an institutional labyrinth. In the immediate aftermath, the speakers were the survivors and the bereaved; the hearers were the police, the media, and the initial inquest machinery. The identity prejudice at work was not merely passive inheritance but active construction. While Fricker often describes prejudice as a structural background noise, the "hooligan" stereotype applied to Liverpool fans was a tool wielded with precision. "Scouser" and "football fan" function as social identities in Fricker's sense because they carry shared imaginaries that dictate credibility. However, here the prejudice was not just a cognitive bias held by individual officers; it was a strategic asset. The police had a positive interest in generating the stereotype to deflect liability from crowd control failures.

  This complicates the classification of *The Sun*'s front page. Strictly speaking, testimonial injustice requires a hearer to accord a speaker less credibility due to prejudice. *The Sun* did not disbelieve the fans; it bypassed them entirely to amplify a fabrication sourced from police leaks. This is not classic testimonial injustice against the fans, but rather a corruption of the testimonial economy itself. The paper manufactured a speaker (the lying officer via the agency) to drown out the actual speakers (the families). It created a false credibility surplus for the police narrative, which necessarily induced a credibility deficit for the families by contrast. The injustice lies in the manipulation of the audience's epistemic environment, making the truth appear less credible not because of who spoke it, but because the rival lie was granted institutional amplification.

  This leads to your concept of narrative displacement. You argue that the families were not hermeneutically marginalized because they possessed the vocabulary to describe the crush from week one. They lacked not words, but an institutional setting where their account was the default. The record was pre-filled with a rival description, forcing them to treat their testimony not as evidence, but as a challenge to settled fact.

  There is a strong case that this constitutes a distinct third wrong. Testimonial injustice typically implies a momentary deficit in a specific exchange: I speak, you discount me. Narrative displacement describes a structural lock-in over time. The injustice is not merely that the hearer discounts the speaker, but that the *record* has been weaponized against the speaker. The families had to fight not just prejudice, but history. Every time they spoke, they were not adding to a neutral pool of knowledge; they were attempting to overwrite a formalized lie. This requires a different kind of epistemic labor—forensic re-argumentation rather than simple testimony. It suggests a category of *structural epistemic exclusion*, where the barrier is not the hearer's prejudice in the moment, but the prior institutional crystallization of a false narrative. It captures the temporal dimension Fricker's original model sometimes misses: the injustice of having to undo yesterday's lie before today's truth can be heard.

  However, the strongest counter-argument is that this is simply testimonial injustice scaled up and institutionalized. Fricker's framework already accounts for structural prejudice. The "settled fact" you describe is merely the accumulation of countless prior instances of testimonial injustice where police lies were believed over fan truths. The credibility deficit the families faced in 1995 or 2010 was the direct downstream effect of the credibility surplus granted to officers in 1989. To label this a third category risks fragmenting the theory unnecessarily. If testimonial injustice explains why the lie was believed initially, and structural prejudice explains why it persisted, "narrative displacement" may be a descriptive label for the *effect* of sustained testimonial injustice rather than a distinct ontological wrong. The labor of re-arguing is exactly what is required when a credibility deficit is deeply entrenched. Adding a third category might obscure the root cause: the initial and sustained refusal to believe the marginalized speaker.

  Where the framework truly goes quiet is on the altered statements. Fricker's model presupposes a distinction between the speaker, the hearer, and the record. In Hillsborough, the police acted as speaker (writing accounts), hearer (reviewing accounts), and record-keeper (submitting to the inquest). When 164 statements were amended to remove self-criticism, this was not a failure of credibility judgment between two parties. It was a unilateral manipulation of the epistemic archive. Fricker's theory is built around the ethics of *listening*; it struggles to diagnose the ethics of *writing* when the writer is also the gatekeeper. This was not testimonial injustice, because the officers were not testifying to a prejudiced hearer who discounted them. It was evidence tampering disguised as testimony. The framework lacks the vocabulary for when the institution speaks only to itself to curate a reality for others. It treats testimony as a transfer of knowledge, but here testimony was used as a brick to wall off knowledge. The dyadic model breaks when the circle is closed.

  Finally, I must tell you which part of your framing is just wrong. You assert that the families were "never hermeneutically marginalised... because they had a fully articulate account of the crush in their own words from week one." This misunderstands the nature of hermeneutical injustice. It is not defined by the private inability to articulate experience, but by the lack of shared social resources to make that experience *publicly intelligible*. The families had words, but the public vocabulary was dominated by the concept of "hooliganism." When they spoke of "panic" or "crush," the hearers interpreted those words through the available hermeneutical resource of "disorder." The injustice was not that the families couldn't describe their pain, but that the social meaning of their description was systematically distorted before it could land. They were hermeneutically marginalized because the collective understanding required to validate their account was actively suppressed. Having a private truth does not exempt you from hermeneutical injustice if the public sphere lacks the concepts to receive it as truth.
