  # The Constraint Diagnostic: A Decision Tree for the Paradox of Deontology

  **Instructions:** Answer each question based on your immediate moral intuition. Do not worry about consistency yet. Choose the option (A or B) that best fits your view.

  1.  **The Transplant:** A surgeon can kill one healthy visitor to harvest organs and save five dying patients. Is this permissible?
      A. Yes (Save the five).
      B. No (Do not kill the one).

  2.  **The Murderer:** A villain will kill five innocents unless you kill one innocent yourself. If you refuse, he kills five. If you agree, he lets you do it. Is it permissible to kill the one?
      A. Yes (Minimize the total killings).
      B. No (Do not become a killer).

  3.  **The Catastrophe:** You must kill one innocent person to prevent a nuclear explosion that will kill one million. Is this permissible?
      A. Yes (The numbers overwhelm the constraint).
      B. No (The constraint is absolute).

  4.  **The Footbridge:** You can push a large man off a bridge to stop a trolley, saving five. Is this morally different from letting five die by doing nothing?
      A. No (Death is death).
      B. Yes (Pushing is worse than letting die).

  5.  **The Bomber:** A bomber can destroy a munitions factory (saving five) but will kill one worker. Case 1: He aims at the factory (worker dies as side effect). Case 2: He aims at the worker to terrorize the enemy (factory destroyed as side effect). Is there a moral difference?
      A. No (Outcome is identical).
      B. Yes (Intention matters).

  6.  **The Complicity:** You cannot kill the one to save the five yourself. May you persuade a colleague to do it?
      A. Yes (The outcome is what matters).
      B. No (You cannot use others as tools either).

  7.  **The Residue:** In the Catastrophe case (Q3), if you kill the one to save the million, should you feel guilty/remorseful afterward?
      A. No (You did the right thing).
      B. Yes (You did a wrong thing, though justified).

  8.  **The Villain's Offer (Discriminator):** A villain will kill five unless you *lie* to him. If you lie, he kills one innocent instead. (Separates **Threshold Deontology** from **Constraint-Consequentialism**).
      A. Lie (Minimize constraint violations globally).
      B. Do Not Lie (My agency is restricted, not the world's state).

  9.  **The Foundation:** Why is killing the one in the Transplant case wrong?
      A. Because it produces worse overall value.
      B. Because it violates the one's right/status.

  10. **The Scale:** If you could save five by stealing a penny, is it required?
      A. Yes (Always maximize good).
      B. No (Some goods are not obligatory).

  ***

  ### Scoring Key

  *   **1A + 2A + 4A → Act Consequentialism**
  *   **1A + 2A + 4B → Rule Consequentialism**
  *   **1B + 2B + 3B → Absolutist Deontology**
  *   **1B + 2B + 3A + 7B → Threshold Deontology**
  *   **1B + 2B + 3A + 7A → Consequentializing Deontology**
  *   **1B + 4B + 5B → Doctrine of Double Effect**
  *   **1B + 6B + 8B → Agent-Relative Deontology**
  *   **1B + 6A + 8A → Constraint-Consequentialism**
  *   **1B + 9B + 10B → Separateness of Persons**
  *   **1B + 2A + 3B → Unnamed (Incoherent Hybrid)**
  *   **1A + 7B → Unnamed (Psychological Consequentialist)**
  *   **1B + 3A + 7A + 8B → Unnamed (Smooth Threshold)**

  ***

  ### Leaf Descriptions

  1.  **Act Consequentialism:** Committed to the claim that you should harvest the healthy visitor if the math works out.
  2.  **Rule Consequentialism:** Embarrassed by the need to explain why the rule holds here but breaks in the Catastrophe case.
  3.  **Absolutist Deontology:** Must explain why letting five die is preferable to killing one, even in extreme cases.
  4.  **Threshold Deontology:** Most likely to be embarrassed by defining exactly where the threshold lies (50? 500?).
  5.  **Consequentializing Deontology:** Struggles to explain why the residue exists if the act was fully permissible.
  6.  **Doctrine of Double Effect:** Vulnerable to cases where intending harm produces significantly better outcomes than foreseeing it.
  7.  **Agent-Relative Deontology:** Must justify why you shouldn't stop a colleague from violating the constraint if you can.
  8.  **Constraint-Consequentialism:** Embarrassed by the implication that you might be required to violate a minor constraint to prevent a major one elsewhere.
  9.  **Separateness of Persons:** Risks collapsing into a rights-based absolutism that ignores aggregate suffering entirely.
  10. **Unnamed (Incoherent Hybrid):** Holds that constraints are absolute but outcomes determine permissibility elsewhere.
  11. **Unnamed (Psychological Consequentialist):** Believes maximizing good is right but feeling guilt about it is also right.
  12. **Unnamed (Smooth Threshold):** Holds that constraints fade gradually rather than breaking at a specific point.

  ***

  ### Empty Cells

  1.  **1A + 4B (Yes Transplant + Yes Footbridge Difference):** Incoherent; claims outcomes matter most but physical contact changes the outcome's value.
  2.  **1B + 6A (No Transplant + Yes Persuade):** Wildly unattractive; treats your own hands as sacred but your colleague's as disposable.
  3.  **3A + 7A + 1B (Yes Catastrophe + No Residue + No Transplant):** Merely unexplored; claims constraints break at high stakes but leave no moral trace.

  ***

  ### Failure Notes

  1.  **Threshold Deontology vs. Rule Consequentialism:** The tree sorts these by Q7 (Residue), but a respondent could answer inconsistently about their feelings. A question about *rule optimization* would separate them better.
  2.  **Agent-Relative vs. Constraint-Consequentialism:** Q8 attempts this, but a respondent might answer based on the lie rather than the principle. A question about *forcing* a colleague would separate them more cleanly.

  ***

  ### Design Notes

  The heaviest branch is **Q2 (The Murderer)**. It forces the reader to confront the paradox directly: if killing is bad, why not minimize it? This single question divides the agent-neutral minimizers from the agent-relative constraint holders. I am least confident in **Q7 (Residue)**; people often report normative guilt (what they *should* feel) rather than descriptive guilt (what they *do* feel), which blurs the line between Threshold Deontology and Consequentializing. I expect med students to cluster in **Threshold Deontology** and **Act Consequentialism**, prioritizing triage logic, while the lawyers will likely lean toward **Absolutist** or **Agent-Relative Deontology**, focusing on rights and inviolability. The tree sacrifices granularity on the "Doing/Allowing" distinction to ensure the "Paradox" structure remains the central spine of the diagnostic.
