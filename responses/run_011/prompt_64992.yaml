answer: |-
  Welcome, everyone. Thank you for coming, and thank you to the foundation for making this room possible. We have eighteen people, two and a half days, and one table. That ratio is deliberate. We are not here to present papers; we are here to dismantle a question.

  We all know the question. It wears economic clothes, but it is the old Needham problem at its core: Why did sustained industrial growth happen where it happened rather than somewhere else? It sounds straightforward. It is not. In fact, the simplicity is the trap.

  We have in this room a decade of printed disagreement about whether this question is even legitimate. Some argue the divergence is a real, datable event with real causes that we have been too squeamish to name. Others argue the question itself is teleology in a wig, manufacturing its own explanandum by installing Britain as the default setting for history. Both positions are intellectually serious. Both are necessary. But neither can proceed if the grammar of our inquiry is broken.

  Here is the philosophical difficulty, and I want it to be load-bearing for the weekend, not wallpaper. We are asking a contrastive question. A contrastive question is not fully specified until you say what you are contrasting against and what you are holding fixed. Every candidate specification seems to prejudge something this weekend is supposed to decide.

  Let me run a swap test out loud, right now, to show you what I mean.

  If I ask, "Why did industry explode in Britain rather than China?" I have made Britain the outcome and China the counterfactual. I am holding fixed the expectation that industrialization is the thing that needs explaining. I am asking for the cause of the presence of growth.

  Now, swap the relata. Ask: "Why did industry stall in China rather than Britain?" Now China is the outcome. Britain is the counterfactual. I am holding fixed the expectation that stagnation is the thing that needs explaining. I am asking for the cause of the absence of growth.

  Notice what changes. The data doesn't change. The dates don't change. But the burden of proof shifts entirely. In the first version, the Sinologist is defending a negative. In the second, the economic historian is defending a negative. In the first, 1800 looks like a starting line. In the second, 1800 looks like a photograph of something still moving. If we do not specify which version we are running, we will talk past each other until Sunday lunch.

  This brings me to our single house rule for the weekend. It is crisp, and I expect you to repeat it back to me on day two if I slip up. The rule is this: **Name the contrast. State the fixed.**

  Before you propose a cause, you must name the alternative you are ruling out. Before you claim a variable matters, you must state what you are holding constant. No explanation without a counterfactual. No counterfactual without a specified baseline. If you catch yourself or a colleague violating this, call it out. We are not policing tone; we are policing logic.

  This rule is here to serve our colleagues in philosophy of science, not to let them police us. They are here to help us spot where the logic is doing work we didn't assign it. They know that explanation is a structural problem. We know that history is a messy one. We need both to get this right.

  Now, about the deliverable. The foundation has asked us to close with a single agreed formulation of the research question. One sentence. In writing. I know what some of you are thinking. This is either a lovely forcing device or a disaster. I can't tell yet either.

  Here is the route to success. Success does not require us to agree on the answer. It does not even require us to agree on the validity of the question. Success requires us to agree on *what we are disagreeing about*. If we leave here with a sentence that says, "We cannot agree on a neutral formulation because specifying the contrast class necessarily privileges one trajectory over another," that is a success. That is a finding. It tells the foundation exactly where the intellectual bottleneck is. It is better to have a precise disagreement than a vague consensus.

  I want to acknowledge the people in this room who are not historians. To the grad students from development economics: you have never read the history we are arguing about. That is an asset. You will hear us reach for shortcuts we shouldn't take. Stop us. To the program officer: you are smart, you are not an academic, and your report decides whether we get a round two. You will hear us try to hide behind complexity. Don't let us. If we cannot explain the question to you in plain English, we haven't solved the philosophical problem.

  And since we are being honest about the stakes, a moment of lightness. We are eighteen adults locking ourselves in one room to agree on a single sentence. Statistically, the coffee machine is more likely to break than our consensus is to hold. If we manage to write that sentence without throwing chairs, the foundation should consider that a positive rate of return on investment.

  But let's be clear about why we are doing this. It is not for the sentence. It is for the work that comes after.

  So, here is where I want to leave you. When you go back to your desks, when you open your datasets, when you read the literature on Monday morning, do not start with the variable. Start with the baseline. Ask yourself: What am I treating as normal? What am I treating as surprising? And who decided that?

  If you can answer that, you can handle the divergence. If you can't, you're just fitting curves to a story you haven't admitted you're telling.

  Let's get to work.
