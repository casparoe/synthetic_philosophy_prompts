  Here are two options based on different facets of that debate.

  **Option 1 (Focus: The Circularity/Regress)**
  "We spent three days debugging a service that needed admin permissions just to assign the admin role. Turns out we hadn't written a recursion bug, we'd just reinvented the boundary problem, where the only way to legitimize the voters is a vote by the voters you haven't defined yet. So I closed the ticket, because fixing it would require a democratic mandate from users who don't have accounts yet."

  **Option 2 (Focus: The All-Affected Explosion)**
