prompt: |-
  So I'm giving a 5-minute lightning talk at our local dev meetup next month about a bug we had boostraping permissions in our app — basically the question of who's allowed to decide who's allowed. Somewhere down that rabbit hole I found out political theorists have a whole name for this, the "boundary problem," about who actually belongs to the demos that gets to vote in the first place.

  From what I could gather (no philosophy background here, so correct me if I'm mangling it): one camp says the existing members should decide who joins, becuase anything else isn't democracy; another says no, the circle can't draw itself, you need some outside criterion like "everyone affected by the decision," which then seems to blow up until it includes foreigners and people not born yet; and a third one I think says it's about everyone subject to the rules whether they signed up for them or not. And there's apparently a complaint that all of these either beg the question or regress forever.

  Can you write me a joke to open the talk? Ground rules:

  - it has to work out loud, three sentences max, to a room of engineers with maybe one or two political-theory nerds in it
  - the punchline has to turn on the actual substance — the circularity, or the way the "everyone affected" criterion explodes — and not just be "lol it's an infinite loop." Devs have heard that one a thousand times and it would make it obvious I googled this for ten minutes, which I did
  - no philosophers-walk-into-a-bar setups, and nothing that would work just as well if you swapped the topic out for something else

  Then give me one alternate version whose punchline trades on a *different* piece of the debate, plus a sentence or two on which piece each joke is using and why it lands for someone who knows the literature. If I got the positions wrong above, tell me that before writing the jokes.
