answer: |-
  # The Two-Envelope Decision Tree

  **Start:** You accept the 1.25A calculation exactly as written.

  **Node 1 (Concrete):** Your friend fills the envelopes, but she only has about $300 cash in the house. You open yours and see $160. Do you still swap?
