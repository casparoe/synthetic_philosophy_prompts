  *   **Yes:** → **Node 2**

  **Node 2 (Concrete):** You may pay a dollar to be told whether your envelope is above or below $50 before you decide whether to swap. Does this information change your decision?
  *   **Yes:** → **Node 3**
  *   **No:** → **Node 4**

  **Node 3:** If the amount inside was $1 million (and there was no cash limit), would you still swap?
  *   **No:** → **Leaf 2**
  *   **Yes:** → **Leaf 3**

  **Node 4:** In the calculation $0.5(2A) + 0.5(A/2)$, is the 'A' in the first term the same pile of cash as the 'A' in the second term?
  *   **No:** → **Leaf 4**
  *   **Yes:** → **Node 5**

  **Node 5:** If the envelope contained $10 billion, is that exactly twice as useful to you as $5 billion?
  *   **No:** → **Leaf 5**
  *   **Yes:** → **Node 6**

  **Node 6:** Was the second envelope filled *after* you picked the first, by flipping a coin to double or halve your amount?
  *   **Yes:** → **Leaf 6**
  *   **No:** → **Leaf 7**

