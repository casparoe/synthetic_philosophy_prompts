  Load-Bearing Facts: 1. The march targeted Holocaust survivors in their home village. 2. Restrictions were content-based (swastikas/uniforms). 3. Alleged harm was psychological trauma, not imminent violence. 4. The ACLU defended rights despite severe reputational cost.

  **The Machinery**
