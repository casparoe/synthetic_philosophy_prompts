  **Escape Hatches**
  The grain merchant analogy fails. Mill permits suppression only when opinion becomes a positive instigation to mischief among an excited crowd. Skokie involved permits, advance notice, and no mob; it was expression, not incitement. This aligns with modern First Amendment incitement doctrine. Regarding the "tyranny of the majority," Skokie inverts the dynamic: a traumatized local minority uses state power to suppress a despised minority. The harm principle must fire *for* the Nazis to remain universal. If it stops here, it is merely majority preference in disguise. Consistency requires protecting the speech we hate most, or the principle collapses into utilitarianism. Mill warns against social tyranny, but here social pressure drove legal coercion. The principle protects the individual against the collective, even when the collective is victimized.

  **Silence**
  The harm principle is silent on three fronts. First, symbolic conduct: the swastika makes no propositional claim to argue with; it is a threat, not an opinion. Mill assumes rational discourse, not symbolic violence. Second, state expression: permitting the march signals state indifference to survivor trauma. Mill focuses on individual liberty, not the state's expressive interest. Third, institutional consistency: the ACLU defending hate speech is Millian consistency, prioritizing system integrity over moral outcome, but it feels like outsourcing moral judgment. The principle cannot weigh the cost of institutional legitimacy against abstract liberty. It assumes a marketplace of ideas where bad speech is countered by good, but Skokie shows the market failing when the speech is a threat to existence. The principle offers no guidance on when the cost of tolerance exceeds its benefit.

  Verdict: This episode exposes that the harm principle was never built to decide cases like this one.
