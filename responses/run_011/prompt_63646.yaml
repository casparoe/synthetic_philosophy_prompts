answer: |-
  "I know this well is safe," said Pat.
  "Even if I show you the lab report?" asked Chris.
  "Then I'll know the report is wrong. I know it's safe."
  Chris slid the paper over. "It says arsenic."
  Pat poured a glass and drank. "Still wrong. I know it's safe."
  "You're drinking poison because you know it's water?"
  "I'm drinking water because I know it's safe. The report is just misleading."
  "So your knowledge protects you from the arsenic?"
  "No," said Pat. "It protects me from the report."
