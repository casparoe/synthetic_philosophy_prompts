prompt: |-
  You're going to have to play someone who has actually read Simone Weil closely rather than the bumper-sticker version of her. I want careful reasoning, and I'd like you to start with some brainstorming of candidate rules before you commit to a prediction — don't just jump to an answer.

  Context: my friend Nadia writes a small newsletter in which she runs what she calls the Weil test on organizations that aren't political parties. The test comes from the party essay Weil wrote in London, published after her death in 1950 as a note on the general suppression of political parties, and specifically from the three criteria Nadia recites constantly: a party is a machine for manufacturing collective passion; it's an organization built to bring collective pressure to bear on the thinking of each of its members; and its first and ultimately only aim is it's own growth without limit. She also leans on the point that belonging to a party always drags people into lying, and on Weil's replacement proposal — no parties at all, just small writing-and-reading circles that people feel close to rather than belong to, with nobody standing for election under any banner.

  Her verdicts so far, roughly in the order she gave them:

  1. Any national political party, left or right: condemned, no argument offered.
  2. Her own reading group, eight people, no roll, no positions, you drift in and out: cleared. She says this is precisely the circle Weil wanted.
  3. A big public-sector union with a political action fund and endorsed candidates: condemned.
  4. A hospital ethics committee whose rulings actually bind: cleared. Her reason was that it holds no standing doctrine, argues each case from scratch, and puts dissent in the minutes.
  5. A six-person faculty caucus that coordinates hiring votes: condemned, even though it has no budget, no public voice, and no enthusiasm worth mentioning.
  6. A volunteer search-and-rescue corps: cleared, despite ferocious esprit de corps, rituals, and real social cost if you wash out. Her reason was that the pressure there runs toward competence, not toward opinions.
  7. A mutual-aid group she cleared at fifteen members and condemned at eight hundred once it had staff, a fundraising target, and a communications person. She reversed herself on the record and said the reversal was the whole point.
  8. A professional psychologists' association issuing consensus statements on housing policy and on a foreign intervention: condemned, though she noted the statements are dry and nobody gets heated about them. What bothered her was sixty thousand people being described as holding a view about a city none of them had examined the question of.

  Now the case I actually care about, because I sit on the council. It's a national soil-science society, about twelve thousand members. Membership has been flat for eleven years and the council voted down a growth initiative last spring; the treasurer says he'd rather stay small. There's no expulsion mechanism and no penalty for dissent: anyone can unsubscribe from the positions list in one click and remain a member in good standing, and dissenting letters are printed right next to each statement in the journal. Two years ago the society issued a position statement on agricultural tariff policy — adjacent to the science, not the science. Last month a second one on farm-labour immigration. A third, on carbon markets, is drafted. These are written by a nine-person committee and adopted by voice vote; members are never polled, but the covering note says the statement is the position of the society, adopted by your elected council, and when journalists ring individual members the answer tends to be well, the society's position is... Meanwhile the press office has discovered these things travel: the immigration statement did two million impressions, the society's account now posts almost nothing else, and this year's annual meeting had a genuinely ugly shouting match with an organized faction trying to unseat the president.

  What I want from you:

  - The candidate rules that are jointly consistent with all eight of her past verdicts. Be explicit about which raw formulations her verdicts already kill — I think pure passion-talk is dead after the rescue corps, and pure growth-talk is dead after the caucus — and what the survivors have to look like.
  - Which of the surviving rules diverge on my society, and what each one predicts. My read is that the no-growth, no-expulsion, cheap-opt-out features pull one way and the in-your-name statements plus the engagement farming pull the other, but I want that laid out properly.
  - Your single best guess at her verdict, with the reasons for preferring that rule over the alternatives, and how confident you are. If you think she lands on some intermediate verdict — condemned, but not in the same register as the union — say so and say what the register is.
  - Which of her past cases is the closest analog, and specifically whether the opt-out-and-print-the-dissent machinery makes my society more like the ethics committee than like the psychologists' association. Is a statement you can disown in one click still a statement made in your name?
  - The one further case I could put to her that would seperate the two live rules, and what each rule would say about it.
  - Whether she's running Weil or Weil-plus. The practical stakes: if the operative criterion is the proxy-opinion one, we can fix this by dropping the statements and keeping the society; if it's something about collective passion and institutional momentum, then no reform short of dissolving the council's public voice will satisfy her, and I want to know that before I propose anything.

  Finish by telling me what would change your mind — which additional verdict of hers, or which consideration about Weil's own criteria, would flip you from one rule to the other — and where you think your own reasoning here is most likely to fail. No bibliography and no citations, please; I don't have the book in front of me and I'm not going to look anything up.
