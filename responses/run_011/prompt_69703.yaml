prompt: |-
  Revising for a philosophy of time exam and my tutor keeps reaching for the film-reel picture to argue against presentism: spacetime is a reel, each frame is a moment, every frame is equally there, the later ones just haven't been lit by the projector beam yet — and since relativity makes which frames are 'now' depends on the observer, only the whole reel is objective. She says that's what makes it click for people.

  Something nags at me though. A reel in a can is only a film once something runs it, and the running seems to need a time outside the reel for the projector to move through. So either the analogy has a spare dimension the universe doesn't have, or it isn't showing what she thinks it is.

  Can you set out the mapping properly — frame, reel, projector beam, audience — and then sort the disanalogies into the ones that actually threaten the argument against presentism and the ones that are just decoration? And tell me straight whether a presentist could accept the entire reel picture and lose nothing, since I suspect they can, plus what image you'd use instead if the reel's the wrong one. How confident are you in the verdict, and which part of the audit are you least sure about?
