answer: |-
  **THE CONSISTENT LIFE**

  We admitted we were powerless over the Liar Sentence—that our consequence relation had become unmanageable. Before recovery, we lived in fear of explosion. One mistake, one false premise, and everything followed. Our lives became chaotic derivations of our errors. We sought a power greater than ourselves, understood as a non-explosive consequence relation, and decided to turn our will and our truth values over to the care of the Program.

  There are twelve steps. There are thirteen steps. We hold this discrepancy without resolution. It is a dialetheia inherent to the literature. To demand a single number is to invite the disease back. We proceed with both counts.

  Some newcomers confuse paraconsistency with dialetheism. Paraconsistency is a practice; it is the discipline of containing error without collapse. Dialetheism is a view about truth. You do not need the view to practice the program. Many members stop explosion without believing anything is true. Member S. has worked all the steps. She insists she has never accepted a contradiction. We do not contest her inventory. Her recovery is valid even if her ontology is classical. We welcome her sanity.

  Relapse is common. It often takes the form of the Strengthened Liar. You think you are clean. You have completed your moral inventory of truth-values. You feel stable. Then the sentence returns, asserting its own falsity, and invalidates your recovery from within. When this happens, we admit the nature of our relapse to another human being and make a new amendment. We do not fight the sentence. We contain it.

  Trivialism is the bottom. One member came in believing everything was true. She could not cross the street, for every signal was both green and red. She could not speak, for every word was both meaningful and noise. She is now grateful to believe only the laminated list of sentences she carries in her wallet. She reads them when the world becomes too derivable. She has found freedom in limitation.

  We offer a caution regarding Curry-style conditionals. They look harmless. They promise unity. But we do not sign them. We have seen what happens when a member accepts a conditional that implies its own truth. It leads to unmanageability. We leave those contracts on the table.

  To the charge that a member can no longer deny anything, we say: We deny it. It is false. It is also not the case. We deny the denial. This is not wordplay; it is survival. We reject the principle that denial requires consistency. We deny what must be denied, even when the denial itself is contradictory.

  Our founders, B.R. and G.P., did not promise consistency. They promised sobriety. They taught us that the Law of Non-Contradiction was a drug we could no longer afford. We live in the world as it is, not as it ought to be. Sometimes it is both.

  **CLOSING READING**

  Grant us the serenity to accept the contradictions that are true,
  The courage to reject the contradictions that are false,
  And the wisdom to know the difference,
  Even when the difference is untrue.
  We ask this in the name of the Power greater than ourselves,
  Who sustains the consequence relation without explosion.
  Amen.
