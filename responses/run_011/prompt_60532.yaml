  2. You argue Lange's trial-and-error pricing can now run faster, but what can trial-and-error pricing mean when no one owns the capital goods whose scarcity the prices are supposed to register? If prices emerge from responsibility over assets rather than calculation alone, does speeding up the math bypass the need for genuine property rights?

  3. There is a fundamental gap between solving a system of equations and knowing which equations to solve, including the reliability of the data fed into the solver. If the central planner cannot know which variables are relevant until after a market process reveals them, does faster hardware merely optimize an arbitrarily chosen model?

  4. Your favorite illustration is that a large retailer already plans internally across thousands of outlets without any internal market. Does that example work only because the firm borrows genuine market prices from outside its own boundaries, and if so, can the entire economy be treated as a single firm without an external reference point?

  5. Your framework solves for the allocation of a given endowment, but how does it accommodate the discovery of new goods and production methods rather than merely optimizing existing resources? If economic progress relies on creating variables that do not yet exist in your input-output tables, can computational speed ever substitute for entrepreneurial discovery?
