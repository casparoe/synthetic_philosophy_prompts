prompt: |-
  I'm in a seminar on algorithmic fairness this term (undergrad, mostly philosophy people with a bit of stats) and someone in my reading group passed around a piece by a data science consultant arguing that we're all overthinking this. I can't tell how much of it holds up. It went roughly like this:

  "A famous impossibility theorem proved that fair machine learning is mathematically impossible. Here's the setup. You have a risk score, and two things you might want from it. You want it calibrated — a 70% score should mean 70% of those people actually reoffend, within each group. And you want equal error rates — the same false positive and false negative rates across groups. The theorem proves these two can never both hold, for any classifier, no matter how good your data is. So when you see a bias audit complaining about unequal false positive rates, you're looking at a demand that is literally incoherent. Note also that calibration is the only one of the two that's really meaningful, because a calibrated score is an honest probability, and you can always recalibrate after the fact to get it. So the math settles what to do: calibrate, publish the score, drop the audit. Whatever disparity is left over just reflects real base rate differences between the groups, which is exactly what an unbiased estimator is supposed to do."

  Thats the last sentence I'm most inclined to push back on but I don't have the vocabulary yet to say why. Can you go through this and tell me which parts a fairness researcher would sign off on as-is, which are oversimplifications that basically survive once you correct them, and which are actually wrong? Two specific things I want your read on: whether the impossibility is really as unconditional as he makes it sound, and whether the "just recalibrate and you're done" move is as free as he thinks it is — like, does recalibrating cost you anything he's not mentioning?

  Please keep it under 400 words, I have to hand something in tonight so a tight answer is better than a thorough one. And tell me where your own reading is shakiest: which of your verdicts would you most expect a specialist in this literature to overturn, and what argument or consideration would make you flip your answer on the central question of whether the math privileges calibration?
