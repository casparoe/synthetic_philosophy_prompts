  **Is the impossibility unconditional?** No. The incompatibility between calibration and equal error rates holds *only* when base rates differ across groups and prediction is imperfect. If base rates are equal, or prediction is perfect, both metrics can be satisfied. The theorem does not prove "fairness is impossible"; it proves this specific bundle of metrics is incompatible. Fairness researchers accept this trade-off but argue metric selection must depend on the context of harm, not mathematical convenience.

  **Is recalibration free?** No. Recalibration adjusts scores to match observed outcomes, but it does not resolve the underlying trade-off. If you calibrate across groups with different base rates, you inevitably accept different error rates. You cannot "recalibrate away" disparate impact without changing decision thresholds, which directly alters who bears the burden of false positives. Furthermore, calibration ensures the *probability* is honest, not that the *decision* is just.

  **The Base Rate Fallacy:** The claim that disparities reflect "real" base rates assumes the data generating those rates is unbiased. If historical policing targets specific groups, base rates are artifacts of systemic bias, not ground truth. An unbiased estimator of a biased target perpetuates injustice.

  **Shakiest Verdict:** My claim that the math doesn't privilege calibration. Economists like Corbett-Davies argue that without explicit cost functions, error rate parity is arbitrary. A specialist could overturn my reading by demonstrating that calibration is the only metric consistent with maximizing social utility given fixed risk thresholds. I would flip if convinced that unequal error rates are only harmful insofar as they miscalibrate risk, rather than constituting distinct distributive harms. My current stance relies on a normative claim about burden allocation that the math doesn't settle.
