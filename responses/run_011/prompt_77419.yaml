answer: |-
  Hey, it sounds like you've hit the exact wall everyone hits with Dennett, except most groups just nod politely and move on without realizing why they're nodding. You're right to feel that rehashing the arguments won't help, because the arguments are just proxies for something deeper. I think your hypothesis about the timestamps is sharp, but it might be pointing at the symptom rather than the disease. If I had to diagnose this, I'd say you're not actually disagreeing about neural architecture or even primarily about time. You're disagreeing about what counts as data that needs explaining.

  Here's what I mean. The camp treating Multiple Drafts as a positive account is operating on the premise that the subject's report is the only hard data we have. If the subject says the order was A then B, the job of the theory is to explain how the brain produced that judgment, not to ensure there was a corresponding metaphysical event where A became conscious before B. For them, the phenomenology of order is a construct, not a readout. The other camp, the one pressing the timestamp problem and calling Multiple Drafts a dissolution, is operating on a realist intuition about experience. They think the feeling of temporal order is itself a fact that needs a truth-maker. When they ask how determinate order emerges without a determinate fixation time, they're asking for a mechanism that validates the phenomenology. When Dennettians say there is no finish line, the realists hear "there is no experience," whereas the Dennettians mean "there is no single moment that constitutes experience." So your hypothesis about timestamps is correct insofar as time is the battlefield, but the war is about whether phenomenology is authoritative. One side thinks the feeling of order proves there is an order to be found in the processing; the other thinks the feeling of order is just another draft that happens to say there was order.

  This explains why the Global Workspace Theory comparison is causing so much friction. It's the perfect storm for this confusion. Structurally, you're right, ignition looks a lot like a draft becoming dominant. The difference is entirely interpretive. If you're a realist, global ignition is the moment the lights turn on in the theater. If you're a Dennettian, global ignition is just the moment a particular narrative gets enough traction to drive behavior and memory, and calling it the moment of consciousness is a category error. You've been fighting about whether the broadcasting moment is the theater, but the real disagreement is whether having a theater matters. If the functional output is identical, the GWT proponent says we've found the neural correlate of consciousness, and the Multiple Drafts proponent says we've found the neural correlate of the belief in consciousness. Until you agree on whether those are the same thing, you'll just keep mapping the same mechanism onto different metaphysical pictures.

  Regarding your experiment idea with the phi display and the priming task, I hate to be the bearer of bad news, but I don't think it will break the tie, and here's why. You're hoping that if the midpoint color primes the later judgment, it proves the color was genuinely constructed before the report, favoring the Stalinesque view. But a Multiple Drafts theorist can simply say that the neural traces associated with the midpoint interpretation were active and influenced the later draft without ever having been "conscious" in a singular moment. The priming effect just shows causal influence between neural states. It doesn't show when or if those states became phenomenally fixed. Both sides can agree on the causal chain while disagreeing on whether any link in that chain counts as the experience itself. The Stalinesque theorist says the priming proves the content existed; the Multiple Drafts theorist says the priming proves the disposition to report existed. Since you can't measure the experience independently of the report or the neural trace, any result can be redescribed. There might not be any conceivable experiment that couldn't be redescribed, because the disagreement isn't about the causal structure of the brain, it's about where you draw the label consciousness on that structure.

  So where does that leave you for progress? I don't think you're going to get a formal result or an experiment that settles this, because it's not an empirical stalemate, it's a metaphysical one. Progress would look like explicitly shifting the question from which model is true to what work you want the model to do. If your goal is to predict behavior and neural firing, Global Workspace and Multiple Drafts might be functionally equivalent tools, and you can treat them as such. If your goal is to solve the hard problem or validate the reality of qualia, then Multiple Drafts will always look like a dissolution to half your group. You might need to agree to treat the timestamp problem as a constraint on functional models rather than a claim about phenomenal reality. Alternatively, you could try to formalize the notion of a truth-maker for temporal judgments. If the realist camp can specify what physical fact would make a temporal judgment true, other than the judgment itself, then you have a concrete target. If they can't, then the Multiple Drafts camp wins by default because the demand is incoherent. If they can, then the Multiple Drafts camp has to explain why that fact isn't accessible.

  Honestly, though, the most productive move might be to admit that you're arguing about norms of explanation. One side thinks a theory of consciousness must preserve the intuition that experience is real and ordered. The other thinks a theory of consciousness must explain why we have those intuitions even if they're false. Once you lay that out on the table, you might find you're not actually disagreeing about the brain at all. You're disagreeing about whether the feeling of being a self in time is something science needs to vindicate or something science needs to explain away. That won't resolve the tension, but it stops you from talking past each other about timestamps and theaters. Anyway, that's where my head is at. Hope it helps unstick things, or at least gives you something new to argue about. Let me know how the next meeting goes.
