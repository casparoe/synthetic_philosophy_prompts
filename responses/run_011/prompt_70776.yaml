prompt: |-
  So — second-year metaphysics, 22 students, and next Tuesday I've got 75 minutes on causation by omission: whether an absence can be a cause. They've already had counterfactuals and they've had the regularity/INUS material, and every one of them can recite "but for the gardener's failure to water, the plant would have lived." That's precisely the trouble. They think they already know this topic and they don't, and I need a plan for running the session, not a transcript of a lecture I could give in my sleep.

  The order first. What goes on the board before what, with a line of justification for each piece about why it can't be moved earlier. My instinct is to open on a case where everyone, me included, is happy to say the omission caused the harm, and only later reveal that the very same machinery licenses verdicts we can't live with. But tell me if that's backwards — specifically whether they need to hit the profligacy problem *before* they'll give a damn about the difference between an omission and a mere absence, because I genuinely can't tell whether that distinction lands for them as a solution or as a dodge.

  Then the carrying case. I'm banning the plant, the hiker and the poisoned canteen, and anything with Suzy and Billy in it, since half the room met those in intro and will coast on recognition. Two candidates of my own, pick one or throw them both out and build me something better:

  - Case A: the lifeguard on duty leaves the platform for the bathroom; a weak swimmer goes under at the deep end and drowns. The relief guard is in the locker room. Seperately, a retired guard three towns over is also not at that pool.
  - Case B: a maintenance tech signs off a scaffold inspection; one clip that's supposed to be on the frame was never fitted, and a painter falls. Here the absence is an object rather than an action, and there are a hundred identical scaffolds in the yard where the clip is present.

  Whichever case you land on, it has to do four things: exactly one agent whose omission is a plausible cause and at least one whose isn't, so the class feels the line instead of being told about it; a baseline that isn't smuggled in by the way I've rigged the setup; a harm the students already think somebody is to blame for, so nobody can slip out through "well, nobody's responsible anyway"; and it has to survive being re-described positively — he was in the bathroom, he was doing paperwork — without the class concluding that the wording is doing all the work. Tell me which of those four the case buys you cheap and which one it strains, because I'd rather know before Tuesday.

  Misconception map, with timings. The ones I'm braced for: "the counterfactual account already settles this, obviously"; "so everyone who didn't water your plants caused them to die" — they'll say that as a joke and mean it as a refutation; "an omission is just an event under a negative description, so it's all phrasing"; the opposite overcorrection, "then nothing is ever caused by an omission, it's just talk"; and the flat conflation of failing to prevent with causing. There's also one kid who's read a paper arguing omissions are never causes at all and wants to make that the entire class. Tell me where in the sequence I can park him without either swatting him down or letting him win the room by minute twelve. For each misconception: the minute it gets headed off, and whether the fix is a distinction, a case, or an honest admission that the question is open.

  One exit question, answerable in a paragraph, that would tell me they got the problem rather than the vocabulary — plus what a bad-but-passing answer looks like, since I'm going to read twenty-two of them.

  And what I should refuse to cover at this level, and announce that I'm refusing: contrastive accounts, the metaphysics of absences as entities, thier status in criminal law, whatever else you'd cut. If something on that pile actually has to come in for the session to hang together, say which and defend it. One whiteboard, no slides, and I'd rather spend the last ten minutes being straight about where the literature is stuck than pretend we resolved it.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** 2nd-year Metaphysics, 22 students, 75 minutes.
      *   **Topic:** Causation by Omission (Can an absence be a cause?).
      *   **Prior Knowledge:** Counterfactuals, Regularity/INUS. They know the standard "gardener/plant" example too well.
      *   **Goal:** A session plan, not a lecture transcript. Needs structure, timing, case selection, misconception management, exit question, and scope limitation.
      *   **Constraints:** No slides, one whiteboard. Ban standard examples (gardener, hiker/canteen, Suzy/Billy).
      *   **Specific Questions to Answer:**
          1.  Board order/justification (Profligacy before/after distinction?).
          2.  Case selection (Lifeguard vs. Scaffold) + analysis against 4 criteria.
          3.  Misconception map (timings + fixes).
          4.  Exit question (good vs. bad answer).
          5.  Scope limitations (what to cut).

  2.  **Deconstruct the Pedagogical Challenge:**
      *   *The Problem:* Students think counterfactual dependence = causation. They know "If gardener watered, plant lives." They conclude "Gardener caused death." They don't see the *problem* yet (profligacy/overgeneration).
      *   *The Trap:* If you start with the distinction (omission vs. absence) too early, it looks like a semantic dodge. If you start with profligacy (everyone causes everything), they feel the pressure immediately.
      *   *The Strategy:* Induce the crisis first (Profligacy), then offer the distinction as a potential (but costly) solution.

  3.  **Board Order & Justification:**
      *   *Intuition:* Start with the intuitive win (Omission *is* a cause), then break it with Profligacy, then try to fix it.
      *   *Sequence:*
          1.  Counterfactual Dependence (The Tool they know).
          2.  The Intuitive Case (Omission = Cause).
          3.  The Profligacy Explosion (Everyone = Cause).
          4.  The Distinction (Omission vs. Mere Absence).
          5.  The Cost (Positive Description/Relational issues).
      *   *Justification:* You can't motivate the distinction (4) until they feel the pain of Profligacy (3). You can't show Profligacy (3) without establishing Counterfactual Dependence (1) and applying it to an Intuitive Case (2).

  4.  **Case Selection (Lifeguard vs. Scaffold):**
      *   *Case A (Lifeguard):*
          *   Agent 1 (On duty): Omission plausible cause.
          *   Agent 2 (Relief in locker): Omission questionable.
          *   Agent 3 (Retired 3 towns over): Omission clearly not cause.
          *   *Pros:* Clear normative expectations (duty).
          *   *Cons:* "Duty" smuggles in moral/legal blame, which might confuse metaphysical causation. Positive description ("using bathroom") is easy but might shift focus to justification rather than causation.
      *   *Case B (Scaffold):*
          *   Agent 1 (Tech who signed off): Omission plausible cause.
          *   Agent 2 (Other techs in yard): Omission not cause.
          *   *Pros:* Physical object absence (clip) vs. Action absence. Less moral baggage than drowning.
          *   *Cons:* "Signed off" is a positive action that *allowed* the omission. Might get bogged down in certification vs. installation.
      *   *Decision:* **Case A (Lifeguard)** is stronger for *metaphysics* because it isolates the *agent's location/state* better. The "Retired Guard" is the killer move for profligacy. The "Bathroom" positive description is classic.
      *   *Critique against 4 criteria:*
          1.  *One plausible/one not:* On-duty vs. Retired. (Buys cheap).
          2.  *Baseline not rigged:* Need to ensure we don't define "duty" as "cause" immediately. (Strains here - need to be careful).
          3.  *Harm/Blame:* Drowning is high stakes. (Buys cheap).
          4.  *Positive Description:* "In bathroom" vs. "Not guarding." (Strains here - students often conflate "excuse" with "not cause").
      *   *Wait, let's look closer at Case B.* The prompt asks for "absence is an object rather than an action." This is metaphysically interesting. But the Lifeguard case is clearer on the *agent* omission. The prompt asks to pick one or build better.
      *   *Refinement:* The Lifeguard case is better for the *Profligacy* point (Retired guard). The Scaffold case is better for the *Object vs. Action* point. Given the prompt's focus on "absence can be a cause," the Lifeguard case is more standard for *omission* (agent failure). However, the prompt warns about "positive description" ("he was in the bathroom").
      *   *Actually, let's tweak Case A.* Make it less about "duty" and more about "capability + proximity."
      *   *Decision:* Stick with **Case A (Lifeguard)** but refine the "Retired Guard" to "Person on Beach." It highlights the spatial/causal field better.
      *   *Analysis of the 4 criteria for Case A:*
          1.  *Plausible vs. Not:* On-duty vs. Retired. (Easy).
          2.  *Baseline:* The "Normative Expectation" is the smuggled baseline. This is the strain point. I need to flag that.
          3.  *Harm:* Drowning. (Easy).
          4.  *Positive Description:* "Using bathroom." (Strain point: Students will say "He had a right to pee." That's moral, not metaphysical).

  5.  **Misconception Map:**
      *   *CF Settlement:* Early (Min 10). Fix: Show the Retired Guard CF holds too.
      *   *Everyone Caused It (Profligacy):* Min 25. Fix: The distinction.
      *   *Negative Description:* Min 40. Fix: Positive redescription challenge.
      *   *Never Causes:* Min 55. Fix: Admit open question/Normative reliance.
      *   *The "Omissions aren't real" Kid:* Park him at Min 50 during the "Metaphysical Cost" section. Let him have the floor for 2 mins, then move to "But we still need to assign responsibility."

  6.  **Exit Question:**
      *   Needs to test understanding of the *problem*, not the *solution*.
      *   *Prompt:* "Why does accepting omissions as causes threaten to make causation useless?"
      *   *Bad Answer:* "Because sometimes people don't do things." (Vague).
      *   *Good Answer:* "Because if counterfactual dependence is sufficient, then every absence that would have prevented the effect counts, leading to infinite causes (the Queen of England didn't water the plant)."

  7.  **Scope Limitations:**
      *   Cut: Contrastive accounts (too technical).
      *   Cut: Criminal Law (confuses normativity with metaphysics).
      *   Cut: Absences as Entities (Quinean stuff, too dense).
      *   *Keep:* The link between Normativity and Causation (because it's the only way to solve the profligacy in this context).

  8.  **Drafting the Plan (Iterative refinement):**
      *   *Board Work:* Needs to be visual. Left side: CF analysis. Right side: The Cases. Middle: The Tension.
      *   *Timing:* 75 mins is tight. 10 intro, 20 Case/CF, 20 Profligacy, 15 Solutions/Costs, 10 Exit.
      *   *Tone:* Direct, pedagogical, acknowledging the difficulty.

      *(Self-Correction during drafting)*: The prompt asks specifically about the order: Profligacy *before* Distinction? Yes. If you give the distinction first, they think it's a definition. If you show the explosion first, they *want* the distinction.
      *(Self-Correction on Case)*: The prompt asks to analyze which of the 4 criteria the case buys cheap vs. strains. I need to be honest. The "Baseline" is the hardest part of the Lifeguard case because "On Duty" does too much work. I need to advise the instructor to explicitly flag that.

      *(Refining the "Kid" strategy)*: Don't park him. Use him. When the Profligacy hits, ask him. "You say omissions aren't causes. Does that solve the Retired Guard problem?" Yes. "Does it break the Lifeguard problem?" Yes. "So what's the cost?"

      *(Refining Exit Question)*: Make it specific to the Retired Guard. "Did the retired guard cause the death? Use the counterfactual test and explain why your answer creates a problem."

  9.  **Final Polish:** Check against all constraints. No slides. One whiteboard. 2nd year level (not grad, not intro).
      *   *Board Layout:* Crucial. I should sketch the board layout.
      *   *Justifications:* Ensure every board item has a "Why not earlier?" note.

  10. **Final Review against Prompt:**
      *   Order/Board? Yes.
      *   Profligacy before Distinction? Yes.
      *   Case Selection + 4 criteria analysis? Yes.
      *   Misconception Map + Timings? Yes.
      *   Exit Question (Good/Bad)? Yes.
      *   Scope Cuts? Yes.

      *Let's write it.*
answer: |-
  Here is a battle plan for Tuesday. It is designed to be written on a single whiteboard in real-time, moving from left to right.

  ### 1. The Board Order & Justification

  Do not write the distinction (Omission vs. Absence) until minute 35. If you write it earlier, it looks like a definition. If you write it later, it looks like a lifeline.

  **Board Layout (Left to Right):**

  1.  **The Tool (Counterfactual Dependence):** $C \to E$ iff $\neg C \square\to \neg E$.
      *   *Why first:* This is their existing currency. You must establish the rule of the game before showing how the game breaks.
      *   *Why not later:* You cannot demonstrate profligacy without first establishing the test they trust.

  2.  **Case A (The Lifeguard):** Three columns: On-Duty (Bathroom), Relief (Locker), Retired (Home). Outcome: Drowning.
      *   *Why second:* You need a concrete application of the Tool.
      *   *Why not later:* You need the intuition that On-Duty *is* a cause before you show that Retired *also* passes the test.

  3.  **The Explosion (Profligacy):** Apply the Tool to all three columns. Result: All three are causes.
      *   *Why third:* This is the crisis. It must follow immediately from applying the Tool to the Case.
      *   *Why not earlier:* Without the Case, this is abstract. Without the Tool, this is just an opinion.

  4.  **The Filter (Normative Expectation / Duty):** A bracket around On-Duty only.
      *   *Why fourth:* This is the proposed solution to the Explosion.
      *   *Why not earlier:* If you introduce "Duty" at the start, students will conflate moral blame with metaphysical causation immediately. They must feel the metaphysical problem first.

  5.  **The Cost (Positive Description):** "In Bathroom" vs. "Not Guarding."
      *   *Why last:* This challenges the Filter. It shows that "Duty" might be masking the metaphysics.
      *   *Why not earlier:* It's a nuance. If you start here, they get lost in semantics before grasping the causal problem.

  ---

  ### 2. The Carrying Case

  **Pick Case A (The Lifeguard).**
  Case B (Scaffold) is too easy to re-describe positively ("He installed the other 99 clips"). Case A forces the *agent's location* to be the omission, which makes the positive redescription harder to swallow as a causal explanation.

  **Analysis against your four criteria:**

  1.  **One plausible / One not (On-Duty vs. Retired):**
      *   *Verdict:* **Buys Cheap.** The spatial and contractual distance of the Retired Guard makes the intuition immediate. No one will fight for the Retired Guard.
  2.  **Baseline not smuggled:**
      *   *Verdict:* **Strains.** This is your danger zone. "On-Duty" smuggles in a normative baseline. Students will think the Guard causes the death *because* he was hired, not because of the metaphysics.
      *   *Fix:* Explicitly state at minute 20: "Forget the contract for a moment. Look only at the physics and the counterfactuals. Did the Retired Guard's non-presence make a difference?"
  3.  **Harm/Blame:**
      *   *Verdict:* **Buys Cheap.** Drowning is visceral. No one will say "nobody is responsible."
  4.  **Survive Positive Re-description:**
      *   *Verdict:* **Strains.** Students will say, "He wasn't omitting; he was peeing." They will treat this as an *excuse* rather than a metaphysical challenge.
      *   *Fix:* When they say "He was peeing," ask: "If he was peeing, did the water still rise? Did the lungs still fill? If the positive action (peeing) is the cause, why do we care about the negative description (not guarding)?"

  ---

  ### 3. Misconception Map (75 Minutes)

  **00–10: Setup & The Tool**
  *   **Misconception:** "We already did counterfactuals."
  *   **Fix:** Acknowledge it. "You know the engine. Today we find out where the brakes are." Write **1. The Tool** on the board.

  **10–25: The Case & The Intuition**
  *   **Misconception:** "The Guard caused it, obviously."
  *   **Fix:** Agree. Write **2. Case A**. Get consensus that On-Duty Guard = Cause.
  *   **The Trap:** Do not let them justify this with "It was his job." Park that justification. Ask for the counterfactual proof.

  **25–35: The Explosion (Profligacy)**
  *   **Misconception:** "So everyone who didn't water your plants caused them to die." (The Joke/Refutation).
  *   **Timing:** Minute 30.
  *   **Fix:** Apply the Tool to the Retired Guard. $\neg$RetiredGuard $\square\to \neg$Drowning. It holds.
  *   **Action:** Write **3. The Explosion**. "If CF is sufficient, the Retired Guard is a cause. Do you accept this?"
  *   **Outcome:** They will reject it. Now they feel the pain.

  **35–50: The Filter & The "Realist" Kid**
  *   **Misconception:** "Omissions are never causes." (The Kid).
  *   **Timing:** Minute 35.
  *   **Strategy:** **Park him here.** When the Explosion hits, ask him: "You say omissions aren't causes. Does that save us from the Retired Guard?" (Yes). "Does it also save us from the On-Duty Guard?" (Yes). "So the child drowns with no cause?"
  *   **Fix:** Use him to show the cost of his view. He solves profligacy by eliminating all omission causation. Write **4. The Filter (Duty/Expectation)** as the alternative middle ground.
  *   **Misconception:** "Failing to prevent = Causing."
  *   **Timing:** Minute 45.
  *   **Fix:** Distinguish *allowing* vs. *causing*. The Filter helps here, but admit it's messy.

  **50–65: The Cost (Positive Description)**
  *   **Misconception:** "It's just phrasing." (Omission = Negative Description).
  *   **Timing:** Minute 55.
  *   **Fix:** Write **5. The Cost**. "He was in the bathroom." Is that the cause? If yes, why is it an omission case? If no, why isn't the absence real?
  *   **Honest Admission:** "We are using normative expectations to do metaphysical work. This might be a bug, not a feature."

  **65–75: Exit & Scope**
  *   **Timing:** Minute 65.
  *   **Action:** Distribute exit question.

  ---

  ### 4. The Exit Question

  **Prompt:**
  > "Apply the counterfactual test to the Retired Lifeguard. Does he satisfy the test? If yes, explain why counting him as a cause makes our concept of causation useless. If no, explain what premise of the test you are rejecting."

  **Good Answer (Gets the Problem):**
  > "He satisfies the test (if he had been there, he could have saved the swimmer). But counting him as a cause makes causation useless because it creates infinite causes (everyone not at the pool is a cause). This shows counterfactual dependence is not sufficient for causation."

  **Bad-but-Passing Answer (Vocabulary without Insight):**
  > "He is not a cause because he wasn't on duty. The counterfactual test works for the on-duty guard but not the retired one because of the contract."
  > *(Critique: This asserts the conclusion without explaining why the CF test failed or why the result is problematic.)*

  **Non-Passing Answer:**
  > "Omissions aren't real events so they can't be causes."
  > *(Critique: Ignores the instruction to apply the CF test.)*

  ---

  ### 5. Scope Limitations (What to Cut)

  **Announce this at Minute 05:**
  "We are not doing Criminal Law. We are not doing the Metaphysics of Absences (are they entities?). We are not doing Contrastive Accounts."

  **Justification:**
  1.  **Criminal Law:** Confuses *blame* with *cause*. You can be to blame for something you didn't cause (vicarious liability) and cause something you aren't to blame for (accident). Keep the metaphysics clean.
  2.  **Metaphysics of Absences:** Too dense for 75 mins. Whether an absence "exists" is a separate question from whether it functions as a causal relata. Don't let the ontology swallow the causation.
  3.  **Contrastive Accounts:** (e.g., "Not watering caused the death *rather than*..."). This solves profligacy elegantly but requires a technical apparatus you can't teach in one session.

  **What you must keep:**
  *   **The Normative/Metaphysical Link:** You cannot solve the Lifeguard case without admitting that "Expectation" is doing the work. Be honest that this might mean causation isn't purely descriptive. If you cut this, the session hangs unresolved.

  ### Final Advice for the Board
  Don't erase the **Explosion**. Leave "Retired Guard = Cause?" visible next to "On-Duty Guard = Cause?" until the end. The visual tension between those two lines is the lesson. If you erase the problem to write the solution, they will forget why they needed the solution.
