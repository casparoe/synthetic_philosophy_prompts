      *   **Constraint/Wrinkle:** Omissions are causally relevant only relative to a normative role/standing expectation (duty, contract, job).
      *   **Motivation:** Avoids the "proliferation problem" (my not watering plants in Peru doesn't cause your death).
      *   **Claimed Feature:** Role-relativity is a feature, not a bug (same non-event is a cause under one description, not another).

  3.  **Analyze the "Keeper A/Keeper B" Case:**
      *   *Scenario 1 (No Overlap):* A (6pm-12am), B (12am-6am). Explosion at 4am. Neither inspected.
          *   *User's View:* B had the duty at 4am. A's duty expired. So B's omission caused it. A's did not.
          *   *Problem:* What if the decay started at 11:59pm due to lack of inspection? What if the inspection takes 30 mins and A leaving early prevented B from doing it? The normative cut-off might not match the causal mechanism.
      *   *Scenario 2 (Overlap):* Handover botched, both on duty 11pm-1am.
          *   *User's View:* Both had the duty. Both omitted. Both caused it? Or is it a joint cause?
          *   *Problem:* If both are causes, does that mean overdetermination? If it's a "single extended omission," who owns it? If ownership is key to causation here, shared ownership is messy.
      *   *The "Relocation" Worry:* Does this just push the vagueness from "which omission?" to "what are the exact boundaries of the role?"

  4.  **Analyze the Flatmate's Objection:**
      *   *Claim:* It's just Counterfactual Dependence + Normative Pragmatics. The metaphysics of "absence as entity" is idle.
      *   *Assessment:* This is a strong challenge. If the *truth conditions* for "O caused E" are just "If O hadn't occurred (i.e., if the action had happened), E wouldn't have," plus "O was expected," then the ontological status of O is doing no heavy lifting. The normative filter looks like a selection principle, not a metaphysical constraint.

  5.  **Brainstorming Defeaters (Categorization & Ranking):**
      *   *Criteria for Ranking:*
