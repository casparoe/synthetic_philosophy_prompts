      *   **The Task:**
          1.  Address the specific "Keeper A/Keeper B" valve case (overlap/non-overlap).
          2.  Address the flatmate's objection (is this just counterfactuals + pragmatics?).
          3.  Brainstorm defeaters (arguments, intuitions, structural problems, empirical findings).
          4.  Rank defeaters (Fatal, Seriously Damaging, Merely Awkward) with criteria.
          5.  For each defeater, indicate how a defender would react (concede or wave off).
