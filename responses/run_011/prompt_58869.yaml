answer: |-
  Right, pull up a chair. You know I respect the ambition here. The "normative filter" is the standard move for saving omission causation from proliferation, but you're trying to make it constitutive of the causal relation itself, not just a pragmatic selection rule. That's bold. It's also where I think the structure is going to shear.

  You asked me to lead with a case where your view forces a verdict you can't swallow. I don't need to invent one; I think your own Valve Case, pushed slightly harder, breaks the mechanism.

  ### The Valve Case: The Normative/Physical Mismatch

  Let's tighten the screws on your Keeper scenario.
  **Scenario:** Keeper A (6pm–12am), Keeper B (12am–6am). Valve requires inspection once per shift.
  **Variation:** The valve has a slow leak that becomes critical exactly 30 minutes after a missed inspection. A misses inspection at 11:30pm. B misses inspection at 3:30am. Explosion at 4am.

  **Your View's Verdict:** A's omission is *not* a cause. A's normative standing expired at midnight. Even though the physical process leading to the explosion began cascading during A's shift due to A's non-action, the causal relation is severed by the clocking-out time. B is the sole cause (or the primary cause), because B held the duty at the time of the explosion.

  **The Unsavory Consequence:** You are committed to saying that the *causal structure of the world* changes depending on the HR contract. If A and B had swapped shifts paperwork-wise but performed the exact same physical actions (or non-actions), the causal history of the explosion changes.
  Worse: Suppose A knows the valve is degrading rapidly at 11:55pm. A sees B arrive early at 11:50pm. A says nothing, leaves at 12:00pm. B assumes all is well. On your view, A's omission to *inform* might be a cause, but A's omission to *inspect* is not, because the duty lapsed. This splits the "causal contribution" of a single continuous physical neglect into metaphysical fragments based on administrative boundaries.

  **The Verdict:** This suggests you aren't analyzing causation; you're analyzing *liability*. Causation is supposed to be the glue of the physical world; liability is the glue of the social world. If causation flips on/off with a shift roster, you've made the physical history of the universe dependent on social constructs. That's not just role-relativity; that's idealism about causal chains.

  ***

  ### The Flatmate's Objection: The Ontological Idle Wheel

  Your flatmate is pressing the **Ontological Idle Wheel** argument. Here is the steelman of their position:
  1.  To say "Omission O caused Effect E" is true iff:
      *   (a) Counterfactual Dependence: Had the action occurred, E would not have.
      *   (b) Normative Constraint: The agent was required to perform the action.
  2.  Condition (a) does all the metaphysical heavy lifting regarding the connection between the world-states.
  3.  Condition (b) is a filter for *interest*, *blame*, or *explanation*, not for *causation*.
  4.  Therefore, positing "absences as bona fide relata" adds no truth-conditional content. It is an ontological surplus.

  **My Assessment:** He is mostly right, but you have one escape hatch. If you claim that without the normative structure, the counterfactual dependence *doesn't exist* (i.e., there is no fact of the matter about whether ~O causes E without a role), then you aren't just filtering causes; you're constituting them. But that leads directly to the Is-Ought problem below. If you admit the counterfactual holds regardless of the role, then the "absence" is just a true counterfactual about an event that didn't happen, and the "role" is pragmatics.

  ***

  ### Defeater Brainstorm & Ranking

  I've sorted these by **Fatal** (destroys the core metaphysical claim), **Seriously Damaging** (forces major revision or loss of intuitive support), and **Merely Awkward** (costs elegance but survivable).

  **Criteria for Ranking:**
  1.  **Coherence:** Does the objection render the view internally contradictory?
  2.  **Naturalism:** Does the view violate plausible constraints on metaphysics (e.g., mind-independence)?
  3.  **Explanatory Power:** Does the view explain less than it costs?

  #### 1. The Is-Ought Conflation (Fatal)
  *   **The Argument:** Causation is a natural relation (holds in virtue of physical/natural facts). Normative roles are social/constructive facts (hold in virtue of agreements/laws). If causation depends on roles, then whether a physical event occurs depends on social agreements. This violates the mind-independence of causal structure.
  *   **Defender's Reaction:** **Concede (with modification).** Most sophisticated omissionists (e.g., McGrath, Beebee) admit this tension. You would likely argue that causation *isn't* purely natural, or that "causal explanation" is what you're tracking, not "causal production." But if you stick to "bona fide relata," you must concede that causation is not mind-independent.
  *   **Why Fatal:** It forces you to abandon a standard realist constraint on causation. If causation is role-relative, there is no "God's eye view" of the causal history of the universe.

  #### 2. The Ontological Idle Wheel / Flatmate Objection (Fatal)
  *   **The Argument:** As detailed above. If the truth conditions reduce to Counterfactuals + Norms, the "absence entity" is doing no work.
  *   **Defender's Reaction:** **Wave Off.** You will argue that the *relatum* itself is the absence, and the norm determines *which* absence is relevant. You claim the norm doesn't just select; it *individuates* the cause.
  *   **Why Fatal:** It risks unfalsifiability. If every time the "absence" looks like it's doing no work, you say "check the norm," you insulate the ontology from empirical or logical check.

  #### 3. Vagueness of Roles (Seriously Damaging)
  *   **The Argument:** Normative roles are notoriously vague. When does a duty start? When I'm hired? When I clock in? When I'm asked? If causation depends on this, then causal boundaries are vague in a way that physical processes are not. In the Valve Case (overlap), if the handover is "botched," do they share the duty 50/50? Is causation gradable?
  *   **Defender's Reaction:** **Concede.** You must admit causal claims can be vague when role boundaries are vague.
  *   **Why Damaging:** It makes causal facts messy. Standard metaphysics prefers sharp boundaries for relations (or at least boundaries that track physical vagueness, not contractual vagueness).

  #### 4. The "Good Samaritan" / Capacity Intuition (Seriously Damaging)
  *   **The Argument:** Psychological studies (e.g., Hitchcock, Knobe) show people attribute causal power to omissions based on *capacity* and *proximity*, not just duty. If a passerby sees a child drowning and does nothing, folk intuition often labels the inaction a cause of death, even if there is no legal duty. Your view says: "No duty, no cause." This conflicts with robust folk intuitions about "allowing" vs. "doing."
  *   **Defender's Reaction:** **Wave Off.** You will argue folk intuition conflates *causation* with *moral responsibility*. You are doing revisionary metaphysics, not descriptive psychology.
  *   **Why Damaging:** It severs the link between your theory and the "folk way of talking" you claimed to preserve in your opening statement. You said the folk talk isn't loose speech; now you're saying the folk are wrong about when it applies.

  #### 5. Causal Closure / Conservation of Energy (Merely Awkward)
  *   **The Argument:** Physical effects have sufficient physical causes. Energy is conserved. An absence cannot transfer energy. Therefore, an absence cannot be a cause.
  *   **Defender's Reaction:** **Wave Off.** This is the standard move. You argue that causal closure applies to the *physical domain*, but causation is broader. Or, you argue that the *presence* of the background conditions (which the omission is part of) transfers the energy.
  *   **Why Awkward:** It's a standard bullet to bite. It doesn't break the specific "normative wrinkle" you've added; it attacks omission causation generally.

  #### 6. Transitivity and Location (Merely Awkward)
  *   **The Argument:** Where is the omission? When is it? If A fails to water plants in Peru, is the omission in London (where A is) or Peru (where the plant is)? If causation is transitive, does my not-fighting Napoleon cause my current existence?
  *   **Defender's Reaction:** **Wave Off.** You use the Role filter to solve this. The omission is located where the duty was to be discharged. Transitivity is blocked by role discontinuities.
  *   **Why Awkward:** It works, but it makes causation highly non-standard. It requires a bespoke logic of causal transitivity that tracks job descriptions.

  ***

  ### Empirical Findings: What Bears on the Thesis?

  You said you've read the psych, so I'll skip the citations and hit the relevance.

  *   **Relevant:** Findings on **Prescriptive vs. Statistical Normality**. Research (e.g., by Sytsma, Livengood, Knobe) suggests people toggle between "what usually happens" (statistical) and "what should happen" (prescriptive) when selecting causes.
      *   *Bearing:* If your view relies *only* on prescriptive norms, it fails to capture cases where statistical abnormality drives causal selection (e.g., "The engine failed because a bolt sheared" vs. "because a bolt didn't shear"). If a bolt *usually* holds, its not-holding is a cause. There is no "duty" on the bolt. Your view struggles with non-agent omissions unless you posit "teleological roles" for artifacts, which is metaphysically costly.
  *   **Relevant:** **Mutability and Counterfactual Availability.** People find it easier to undo omissions that are "exceptional."
      *   *Bearing:* If causal selection tracks ease of imagination (mutability) more than duty, your normative filter is over-constraining. A doctor might have a duty, but if the treatment was experimental and unlikely to work, people won't cite the omission as a cause. Duty isn't sufficient.
  *   **Irrelevant:** General bias toward commission over omission. This is about weighting, not the metaphysical structure of the relation.

  ***

  ### Straight Verdict: Falsifiability and Theoretical Cost

  You asked if the position risks being qualified into unfalsifiability.
  **Yes, it does.**

  By the time you introduce role-relativity, contrast sensitivity (which description of the omission?), and pragmatic salience, the claim "Omissions are causes" becomes:
  *"An omission is a cause when the context selects it as a cause."*

  The "Normative Role" is just a specific type of context. If I can find a case where everyone agrees an omission caused an effect, but there was no normative role (e.g., a wild animal fails to guard a cave, and intruders enter; or a natural barrier fails to exist), you have to say "That wasn't causation, that was something else." If you expand "role" to include "teleological function of natural kinds," you've diluted "normative" until it means nothing.

  **The Cost:**
  You are buying a solution to the **Proliferation Problem** at the price of the **Naturalism Problem**.
  *   **Vanilla Omission View:** Causation is natural, but we have too many causes. (Problem: Proliferation).
  *   **Your View:** We have the right number of causes, but causation is normative/social. (Problem: Mind-dependence).

  **Is it a legitimate cost?**
  Only if you are willing to argue that causation *is* inherently normative. Some (like certain pragmatists) accept this. But if you want to be a realist about causation (that it's "out there" in the world), this wrinkle breaks the machinery.

  **Final Supervision Note:**
  The Valve Case is your weak point. If you cannot explain why the causal history of the explosion changes when the shift roster changes *without* changing the physical events, you have conflated causation with blame.
  *   **Recommendation:** Consider retreating to the position that the *causal relation* is counterfactual dependence (which holds for A and B), but the *causal explanation* is filtered by norms. This saves the metaphysics (absences aren't weird entities, just true counterfactuals) and keeps the normativity where it belongs (in our practices of attribution, not in the fabric of the world). Your flatmate will still grumble, but you won't have to defend the idea that the universe cares about HR contracts.

  Do you want to try to salvage the "bona fide relata" claim, or are you ready to concede the ontological point and fight for the pragmatic one?
