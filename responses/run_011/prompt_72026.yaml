  ### Part 1: Predictions on the New Cases

  Based on the pattern of her previous seven verdicts, here is what she will likely say:

  *   **(a) The Warehouse Porter:** **Yes, causation.** (But no blame).
      *   *Reasoning:* The *checking* did not happen, and it was a required part of the system's safety protocol (Duty/Expectation). The fire counterfactually depended on that check. Following Case 7 (the Nurse), she will argue that the *causal link* exists even if the *control* did not. The absence of the check caused the loss; the missing key excuses the porter from blame, but not the omission from being a cause.
  *   **(b) The Delivery Driver:** **No causation.**
      *   *Reasoning:* This is a direct mirror of Case 2 (Swimmer) and Case 4 (Stranger/Plants). He has the physical ability (bolt cutters) but no normative connection or duty to the system. For her, "could have" is never enough without "should have."
  *   **(c) The Dead Lifeguard:** **No causation.**
      *   *Reasoning:* This tests **counterfactual dependence**. Even with a perfect duty (Case 1), if the outcome (death) was already determined before the omission occurred, the omission made no difference. Causation requires that the world would have been different had the action been performed.

  ---

  ### Part 2: The Rules She Is Running

  You are right to suspect there isn't just one simple rule. She is running a hybrid account that combines **Counterfactual Dependence** with a **Normative/Functional Licensing Condition**, while strictly decoupling **Causation** from **Blame**.

  Here are the two best candidate rules that fit her data, and why one wins.

  #### Candidate 1: The "Control & Duty" Account
  *   **The Rule:** An omission is a cause if and only if: (1) The agent had a duty to act, (2) The agent *could* have acted (ability/control), and (3) The outcome would have changed if they had.
  *   **Predictions:** (a) No Cause (couldn't open door), (b) No Cause, (c) No Cause.
  *   **Why it fits most:** It aligns with common sense and legal intuition (you can't be responsible for the impossible). It handles Cases 1, 2, 3, 4, 5 perfectly.
  *   **Why it fails:** It crashes into **Case 7 (The Nurse)**. The nurse was "two staff down" and protocol was "scrapped." Her control was severely compromised, yet your flatmate insists the nurse's not-checking *was* a cause. If ability/control were required for causation, the nurse wouldn't be a cause.

  #### Candidate 2: The "Relevant Expectation" Account (The Winner)
  *   **The Rule:** An omission is a cause if and only if: (1) There was a **relevant expectation** that the event would occur (Normative for humans, Functional for machines), (2) The event did not occur, and (3) The outcome counterfactually depended on it. **Blame** is a separate calculation that requires Control/Ability.
  *   **Predictions:** (a) **Cause** (Expectation existed, check didn't happen), (b) No Cause (No expectation), (c) No Cause (No dependence).
  *   **Why it fits:**
      *   It handles **Case 6 (Brake Fluid)**: Machines have functional expectations (fluid should be there). No person needed.
      *   It handles **Case 2 & 4 (Strangers)**: No normative expectation exists for them, so their omissions aren't even "causes" (hence her "not even false" comment on the flowerbeds).
      *   It handles **Case 7 (Nurse)**: The expectation existed (nurses check doses), so it's a cause. The control was lacking, so it's not blame.
      *   It handles **Case (a) (Porter)**: The expectation existed (porter checks valves). The check didn't happen. It's a cause. The control was lacking (locked door), so it's not blame.

  **I would bet on Candidate 2.** It is the only one that respects her rigid separation of Causation and Blame across both human (Case 7) and non-human (Case 6) scenarios.

  ---

  ### Part 3: The Load-Bearing Verdict

  **Case 7 (The Nurse)** is doing the most work.

  Without Case 7, Candidate 1 (Control & Duty) would be the strongest contender. Most people intuitively link causation with some degree of control ("If I couldn't stop it, I didn't cause it"). By insisting the nurse *caused* the harm despite being systemically hamstrung, your flatmate signals that **Causation is about the gap in the expected order of things, not the capacity of the agent.**

  Case 7 forces you to accept that an omission can be causal even when the agent's ability to prevent it was compromised. This is the wedge that opens the door for verdict (a) on the Porter.

  **Honorable Mention:** **Case 6 (Brake Fluid)** is the second most important. It proves she isn't just talking about moral responsibility. If she only cared about duty, she might say "fluid can't cause anything, only people do." By accepting physical absence as causation, she confirms she is talking about *ontological* or *explanatory* causation, licensed by expectations.

  ---

  ### Part 4: The Tie-Breaker Case

  While Case (a) (The Porter) *should* distinguish Candidate 1 from Candidate 2, it is slightly messy because one could argue the Porter's duty shifted from "Check" to "Report" once the door was locked. To truly separate the rules, you need a case where the **Duty** is undeniable, the **Counterfactual** holds, but the **Physical Ability** is strictly zero.

  **The Case:**
  > A lifeguard is on duty (Case 1). He sees a child drowning. He jumps in to save them, but a third party (a malicious swimmer) physically grabs the lifeguard and holds him underwater until the child drowns. The lifeguard *wanted* to act, *tried* to act, had the *skill* to act, but was physically prevented.

  **Why this separates them:**
  *   **Candidate 1 (Control):** Says **No Cause**. The lifeguard had zero control over the omission. He literally could not dive.
  *   **Candidate 2 (Expectation):** Says **Cause**. The relevant expectation (Lifeguard saves kid) was violated. The absence of the rescue caused the death. The lifeguard bears zero *blame* (and the malicious swimmer bears the blame for the death), but the *causal explanation* for the death is still "the lifeguard didn't save them" (licensed by his role) + "the swimmer held him."

  If she says **"His not saving them caused the death, though he isn't to blame,"** she is fully committed to the **Relevant Expectation Account**. If she hesitates and says "No, the swimmer caused it, the lifeguard is out of the causal chain," then **Control** matters more to her than I've credited, and Case 7 was about *difficulty*, not *impossibility*.
