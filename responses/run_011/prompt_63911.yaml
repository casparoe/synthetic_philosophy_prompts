prompt: |-
  I'm on the grants committee of a small private foundation — 14 of us, mostly faculty plus a couple of program officers, around 70 applications a cycle, and we fund 8. Our old process was, honestly, a mess: everyone read what they wanted, we went proposal by proposal with a show of hands, and the chair broke ties. After the last round two members admitted separately that they'd voted against papers they actually liked in order to keep a competing application alive, and one of them seemed proud of it. The new chair wants a written rule adopted before next cycle, published to applicants up front, and defensible if someone appeals — which is apparently why I'm doing this, because I took a social choice course a decade ago. My brother, whos done some game theory, told me not to bother: that Gibbard-Satterthwaite proves any non-dictatorial rule over three or more alternatives is manipulable, so whatever we write is a polite fiction, and we should just have an outside reviewer score everything and draw lots among the top three.

  I don't buy his argument entirely, but before I go shopping for rules I want to know what I should even be demanding of one. So write the desiderata: what an adequate selection procedure for a committee like ours has to deliver — the properties it must have, the cases it must get right, the distinctions it must not collapse, the formal results it has to be consistent with — with the consideration or the concrete committee example behind each item, and mark which ones are genuinely non-negotiable for us and which are just tastes of one camp in the literature. The ones I most want pressure-tested are the ones that sound self-evidently good. Is strategy-proofness really the target, or is the underlying worry that sophisticated members exploit honest ones — and does it matter whether we get dominant-strategy protection or only no-gain-given-plausible-beliefs, and whether it's one member who can profit or a bloc of three? Are anonymity and neutrality requirements or ideals? What work is "onto" actually doing? Is demanding a complete ranking of all 70 from every member itself a mistake, given that I genuinely cannot compare two applications in a field I've never worked in? And since our output is a set of eight rather than a single winner, does the impossibility framing even apply to us, or is there some different notion of manipulation for that job?

  Then flag any subset of the desiderata that can't be jointly satisfied given what's known — I suspect thats the interesting part and my brother is half right, but I want to know exactly which requirement does the damage and what giving it up would cost us, including whether restricting the admissible preference profiles or allowing randomized rules buys anything real, and whether the fact that we'll all be colleagues again next cycle changes whether manipulability matters at all. Tell me which single desideratum knocks out the most otherwise-attractive candidates. Finish with a very short scorecard, a few lines each, for what people would realistically propose to us: Borda, instant runoff, approval, score/range, plurality with the chair breaking ties, and my brother's lottery. No history and no proofs, please — just the spec.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Member of a grants committee (small private foundation).
      *   **Committee Structure:** 14 members (mostly faculty + program officers).
      *   **Task:** Select 8 grantees from ~70 applications per cycle.
      *   **Problem:** Old process was messy, manipulable (strategic voting admitted), lacks transparency/defensibility.
      *   **Goal:** Create a written rule for the next cycle that is defensible and robust.
      *   **Conflict:** User took a social choice course; brother (game theorist) says Gibbard-Satterthwaite (G-S) makes it pointless (everything is manipulable), suggests external scoring + lottery.
      *   **Specific Request:**
          1.  List desiderata (properties/requirements) for the selection procedure.
          2.  Contextualize each with the committee example.
          3.  Mark which are non-negotiable vs. "tastes."
          4.  Pressure-test "self-evidently good" concepts (strategy-proofness, anonymity, neutrality, etc.).
          5.  Address the "set of 8" vs. "single winner" distinction regarding impossibility theorems.
          6.  Identify incompatible subsets of desiderata (impossibility results).
          7.  Analyze the cost of dropping requirements.
          8.  Consider domain restrictions/randomization/repeated game effects.
          9.  Identify the single most restrictive desideratum.
          10. Provide a short scorecard for specific voting rules (Borda, IRV, Approval, Score, Plurality+Chair, Lottery).
          11. **Constraints:** No history, no proofs, just the spec.

  2.  **Deconstruct the Social Choice Problem:**
      *   **Input:** 14 voters, 70 alternatives (applications).
      *   **Output:** A subset of size 8 (k-selection, not single winner).
      *   **Preferences:** Likely ordinal or cardinal (scores).
      *   **Constraints:** Transparency, defensibility, collegiality (repeated interaction).
      *   **Brother's Claim:** G-S theorem applies.
      *   **Counter-claim:** G-S applies to *single* winner selection with *unrestricted* ordinal preferences. This is a *multi-winner* selection with potential *cardinal* inputs and *restricted* domains (experts evaluating specific fields).

  3.  **Drafting the Desiderata (The "Spec"):**
      *   Need to cover: Fairness, Efficiency, Strategy, Practicality, Legitimacy.
      *   *Strategy-proofness:* Is it possible? No (G-S). Is it necessary? Maybe not fully, but "hard to manipulate" is good. Distinguish between individual manipulation and bloc manipulation.
      *   *Anonymity:* One member, one vote. Crucial for faculty equality.
      *   *Neutrality:* Treat all applications equally. Crucial for defensibility.
      *   *Pareto Efficiency:* If everyone likes A more than B, don't pick B. Non-negotiable.
      *   *Monotonicity:* Gaining support shouldn't hurt an application. Non-negotiable for defensibility.
      *   *Consistency/Independence:* If A beats B in a subset, it should hold in the whole. (Hard with 70 apps).
      *   *Expressiveness:* Can members express nuance? (Ordinal vs. Cardinal).
      *   *Cognitive Load:* Can members rank 70 apps? No.
      *   *Transparency:* Can we explain the result? Non-negotiable for the Chair's goal.

  4.  **Addressing the Impossibility Theorems (The "Brother's Point"):**
      *   G-S applies to functions mapping preference profiles to a *single* winner.
      *   Here we choose a *set* of 8. This changes the math (Committee Selection / Multi-winner rules).
      *   However, Arrow's Impossibility still looms over aggregating preferences.
      *   *Key Insight:* The brother is technically right about *perfect* strategy-proofness but wrong that it renders the process useless. We want *robustness*, not perfection.
      *   *Incompatibility:* Strategy-proofness + Non-dictatorship + Surjectivity (onto) + Unrestricted Domain is the classic clash.
      *   *The "Single Most Restrictive" Desideratum:* Strategy-proofness (in the strict G-S sense). Dropping it allows almost everything.

  5.  **Refining the "Set of 8" Aspect:**
      *   This is a "k-approval" or "multi-winner" problem.
      *   Manipulation exists but looks different (e.g., burying a strong competitor to get your 2nd choice into the top 8).
      *   G-S doesn't directly ban strategy-proof multi-winner rules, but similar impossibility results (e.g., Dummett and Farquharson) exist.
      *   *Crucial distinction:* We aren't ranking 1-70. We are cutting a line at #8.

  6.  **Developing the Scorecard:**
      *   *Borda:* Good compromise, high cognitive load (ranking 70), manipulable.
      *   *IRV:* Bad for multi-winner, non-monotonic, hard to explain.
      *   *Approval:* Low cognitive load (Yes/No), strategic thresholding, simple.
      *   *Score/Range:* Best for nuance, calibration issues, strategic exaggeration.
      *   *Plurality + Chair:* Terrible (wastes votes, dictatorial tie-break).
      *   *Lottery (Brother's):* Strategy-proof, but ignores merit/consensus, legitimacy risk.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the brother's point but reframe the goal (robustness vs. perfection).
      *   **Desiderata List:** Categorized (Fairness, Integrity, Feasibility). Mark Non-Negotiable vs. Ideal.
      *   **Pressure Testing:** Address Strategy-proofness, Anonymity, etc.
      *   **Impossibility & Trade-offs:** Where the math breaks, what to drop.
      *   **The "Single Knockout":** Identify the culprit.
      *   **Scorecard:** Evaluate the specific rules requested.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Wait, G-S is for *social welfare functions* or *social choice functions* selecting one winner. For selecting a *subset*, the relevant literature is on *committee selection rules*. I need to be careful not to misapply G-S directly, though the spirit holds.
      *   *Correction:* The user asked about "onto." In this context, "onto" means any set of 8 *could* theoretically win (no a priori exclusions).
      *   *Correction:* Cognitive load is huge. Ranking 70 is impossible. This restricts the *domain of inputs* (not preferences, but reported inputs). This bypasses some impossibility theorems because we aren't asking for full rankings.
      *   *Correction:* Repeated game aspect. Since they are colleagues, reputation matters. This dampens strategic voting compared to one-shot anonymous voting.
      *   *Focus:* The Chair wants *defensibility*. This prioritizes Transparency and Monotonicity over pure Strategy-proofness.

  9.  **Final Polish:**
      *   Ensure tone is professional, analytical, and direct.
      *   Check all constraints (no proofs, no history).
      *   Make sure the "Non-Negotiable" tags are clear.
      *   Ensure the "Brother's Lottery" gets a fair but critical look.

  10. **Final Review against constraints:**
      *   Desiderata listed? Yes.
      *   Committee context included? Yes.
      *   Non-negotiable vs. Taste marked? Yes.
      *   Pressure-test strategy-proofness? Yes.
      *   Impossibility flagged? Yes.
      *   Single knockout identified? Yes.
      *   Scorecard included? Yes.
      *   No history/proofs? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  ### The Spec: Desiderata for Committee Selection

  You are correct to skepticism your brother's nihilism. Gibbard-Satterthwaite (G-S) applies to social choice functions selecting a *single* winner from *ordinal* rankings over *three or more* alternatives under *unrestricted* domains. You are selecting a *set* of eight from *cardinal* or *thresholded* inputs under a *restricted* domain (expert evaluation). The impossibility theorems constrain you, but they do not invalidate the enterprise.

  Your goal is not mathematical perfection; it is **procedural legitimacy**. The rule must survive an appeal and discourage egregious gaming without paralyzing the committee.

  Below are the properties your rule must satisfy, categorized by function.

  #### I. Integrity & Defensibility (Non-Negotiable)
  *These are required for the Chair's goal of a defensible, published rule.*

  1.  **Monotonicity:** If an application gains support (moves up in rank or receives a higher score) and no other application changes, it must not lose its funding status.
      *   *Committee Context:* You cannot have a scenario where a member advocating for a proposal accidentally causes it to be rejected by raising its score. This is the primary fuel for appeals.
      *   *Status:* **Non-Negotiable.** Violations look like errors or bias.

  2.  **Transparency (Computability):** The outcome must be determinable from the published inputs using a formula that can be explained in one page to an applicant.
      *   *Committee Context:* "The chair broke ties" is opaque. "Top 8 by sum of scores" is transparent. If the algorithm requires a black-box simulation to verify, it fails the defensibility test.
      *   *Status:* **Non-Negotiable.**

  3.  **Pareto Efficiency:** If every committee member rates Application A higher than Application B, B cannot be funded if A is not.
      *   *Committee Context:* Prevents funding a universally disliked "compromise" candidate over a universally loved one.
      *   *Status:* **Non-Negotiable.**

  #### II. Fairness & Structure (Ideals / Context-Dependent)
  *These are standard social choice norms, but their rigidity depends on your foundation's culture.*

  4.  **Anonymity:** The identity of the voter does not weight the vote.
      *   *Committee Context:* Faculty expect equal standing. However, Program Officers might need veto power on eligibility. If you weight POs differently, you violate anonymity but gain administrative safety.
      *   *Status:* **Ideal** (unless POs have statutory veto power).

  5.  **Neutrality:** The rule treats all applications identically; no application has a structural advantage (e.g., order on the ballot).
      *   *Committee Context:* Essential to prevent "first application bias."
      *   *Status:* **Non-Negotiable.**

  6.  **Surjectivity (Onto):** Any subset of 8 applications must be theoretically selectable given some profile of votes.
      *   *Committee Context:* You cannot have a rule that makes it mathematically impossible for a specific type of project to win (e.g., a rule that requires a majority threshold might make it impossible to fund 8 niche projects if the committee is polarized).
      *   *Status:* **Ideal.** Restricting this is usually a bug, not a feature.

  #### III. Strategic Robustness (The Pressure Test)
  *This is where your brother's argument lives. You need to downgrade expectations from "Immune" to "Resistant."*

  7.  **Strategy-Proofness:** It is never in a member's interest to misrepresent their true evaluation.
      *   *Committee Context:* Your brother cites G-S to say this is impossible. He is right for unrestricted ordinal domains. For your 8-winner context, it is still impossible to guarantee *perfect* strategy-proofness without a dictator.
      *   *Status:* **Taste / Impossible.** Do not demand strict strategy-proofness. Demand **Strategy-Resistance**: Manipulation should require precise knowledge of others' votes and carry high risk of backfiring.

  8.  **Bloc Resistance:** A coalition of $k$ members cannot guarantee a win for a lower-quality application over a higher-quality one.
      *   *Committee Context:* You had members voting against liked papers to save competitors. You want to make this hard. A rule is robust if a bloc of 3 cannot hijack the 8 slots.
      *   *Status:* **Non-Negotiable (Thresholded).** You must define the maximum bloc size you tolerate (e.g., "No 3 members should dictate the outcome").

  #### IV. Feasibility (Cognitive & Operational)
  *Often ignored in theory, fatal in practice.*

  9.  **Cognitive Load:** The input required from members must match human capacity.
      *   *Committee Context:* **Crucial.** Asking 14 people to rank 70 applications (14 x 70 comparisons) is impossible. They will randomize the bottom 50. A rule requiring full rankings forces garbage data.
      *   *Status:* **Non-Negotiable.** The input mechanism (scores, approval, top-10 ranking) must be realistic.

  10. **Repeatability:** The rule must yield stable outcomes under small perturbations of votes.
      *   *Committee Context:* If one member changes a score slightly and the entire funding list churns, the rule is too volatile.
      *   *Status:* **Ideal.**

  ---

  ### The Impossibility Conflict

  Your brother is half-right. You cannot satisfy **Strategy-Proofness + Non-Dictatorship + Pareto Efficiency + Unrestricted Domain** simultaneously.

  *   **The Damage:** The requirement that knocks out the most attractive candidates is **Strategy-Proofness**. If you insist on a rule where no member can *ever* benefit from lying, you are forced toward a Dictatorship (one person decides) or Randomization (Lottery).
  *   **The Cost of Dropping It:** If you drop strict strategy-proofness (which you must), you accept that manipulation is *possible*. The goal shifts to making manipulation *expensive* (requires coordination, risk of miscalculation).
  *   **The "Set of 8" Distinction:** G-S applies to choosing *one* winner. Selecting *eight* changes the geometry. You are drawing a cutoff line. Manipulation here involves "burying" a competitor below the line or "raising" a ally above it. While G-S doesn't directly ban strategy-proof multi-winner rules, the **Dummett-Farquharson** stability results suggest that without a dictator, sophisticated voting (strategic blocs) will dominate sincere voting in many deterministic rules.
  *   **Domain Restrictions:** You are not in an unrestricted domain. Members are experts. They generally agree on what "merit" looks like, even if they disagree on rankings. This correlation of preferences reduces the *opportunity* for manipulation even if the *possibility* remains.
  *   **Randomization:** Your brother's lottery suggestion buys **Strategy-Proofness** (you can't game a coin flip) but sacrifices **Pareto Efficiency** and **Legitimacy**. Funding a clearly inferior proposal via lottery is indefensible to applicants.
  *   **Repeated Games:** You noted you will be colleagues next cycle. This is the strongest dampener on manipulation. If Member A games the system this year, Member B will retaliate next year. This "shadow of the future" enforces sincerity better than any mathematical rule.

  ---

  ### The Single Knockout Desideratum

  **Strict Strategy-Proofness.**

  If you require that no member can *ever* gain an advantage by misrepresenting preferences, you eliminate Borda, Score, Approval, and IRV. You are left with Dictatorship or Randomization. Since Dictatorship violates Anonymity and Randomization violates Merit (Pareto), demanding strict strategy-proofness makes a functional committee impossible.

  **Recommendation:** Replace "Strategy-Proofness" with **"High Cost of Manipulation."** The rule should require a member to know exactly how others voted to successfully game the system, making the risk of backfiring high.

  ---

  ### Rule Scorecard

  **1. Borda Count (Rank all, sum points)**
  *   **Spec:** Members rank top 20, others tied for last. Sum ranks. Top 8 win.
  *   **Verdict:** **Poor.** High cognitive load (ranking 70 is hard). Highly manipulable (members can bury strong competitors by ranking them last). Violates Cognitive Load desideratum.

  **2. Instant Runoff (IRV) / Hare System**
  *   **Spec:** Eliminate lowest vote-getter, redistribute, repeat until 8 remain.
  *   **Verdict:** **Fail.** Non-monotonic (raising a score can cause elimination). Terrible for multi-winner selection (creates disjointed coalitions). Hard to explain to applicants (Transparency failure).

  **3. Approval Voting**
  *   **Spec:** Members vote "Yes" on unlimited applications. Top 8 by vote count win.
  *   **Verdict:** **Good.** Low cognitive load. Strategy-resistant (hard to know where to set the approval threshold). Monotonic. Transparent. Risk: "Bullet voting" (approving only 1 to maximize weight) if members feel competitive.

  **4. Score / Range Voting**
  *   **Spec:** Members score 0-100. Average scores. Top 8 win.
  *   **Verdict:** **Best Candidate.** Low cognitive load. Captures intensity of preference (unlike Approval). Monotonic. Transparent. Vulnerable to strategic exaggeration (scoring favorites 100 and rivals 0), but the "colleague effect" dampens this.

  **5. Plurality + Chair Tie-Break**
  *   **Spec:** Members vote for exactly 8. Chair decides ties.
  *   **Verdict:** **Fail.** Wastes votes (cannot support 9th choice). Encourages strategic voting (don't vote for long shots). Chair tie-break violates Anonymity and looks like bias.

  **6. The Brother's Lottery (External Score + Random Draw)**
  *   **Spec:** External reviewers score. Top 30 eligible. Draw 8 names.
  *   **Verdict:** **Defensible but Weak.** Perfectly Strategy-Proof for the committee. However, violates Pareto (a #30 can beat a #1). Applicants view lotteries as abdication of duty. Use only as a tie-breaker for the 8th/9th slot, not the whole process.

  **Final Recommendation:** Adopt **Score Voting** with a published calibration guide (e.g., "90+ = Fundable, <50 = Reject"). It balances Cognitive Load, Transparency, and Monotonicity, while relying on the "Repeated Game" of colleague relationships to handle Strategy.
