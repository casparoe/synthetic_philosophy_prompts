prompt: |-
  been turning the testimony debate over in my head and I keep modelling it as a dial — call it the warrant floor: how much justification you get from someone's say-so before you've checked anything at all. Hume and the reductionists set it at zero, the Ceady/Burge types set it at the same height as perception. My problem tho: if the floor sits at perception-level, then anything anyone tells me is justified by default no matter how bad a witness they are, and the only way to stop that is to lower the floor in proportion to how unreliable they look — which is just reductionism with a head start. So is there any real middle position here, or does the anti-reductionist side have to concede the dial only runs from gullibility to reductionism?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Topic:** Epistemology of Testimony (specifically the Reductionism vs. Anti-Reductionism debate).
      *   **User's Model:** A "warrant floor" dial.
          *   Zero = Hume/Reductionism (need positive reasons to trust).
          *   Perception-level = Coady/Burge (presumptive right/entitlement).
      *   **User's Problem:** If the floor is at perception-level, *anything* is justified by default, even from bad witnesses. To filter bad witnesses, you need to check reliability, which looks like Reductionism (just with a head start).
      *   **User's Question:** Is there a real middle position? Or does Anti-Reductionism collapse into "gullibility vs. reductionism"?

  2.  **Deconstruct the Philosophical Positions:**
      *   **Reductionism (Hume, Locke):** Testimony is not a fundamental source of justification. It reduces to perception, memory, and induction. I need positive reasons to believe *this* speaker on *this* occasion.
      *   **Anti-Reductionism (Reid, Coady, Burge):** Testimony is a fundamental source. There is a presumptive right to believe. The burden of proof is on the defeater, not the believer.
      *   **The User's Critique:** This is a classic objection to Anti-Reductionism (the "gullibility objection"). If I have a right to believe everything until proven false, I'm epistemically irresponsible.

  3.  **Evaluate the "Dial" Model:**
      *   The user models it as a *scalar* value (0 to Perception).
      *   *Correction/Nuance:* Most epistemologists don't see it as a scalar "amount of justification" but rather as a *structural* difference in where the burden of proof lies.
      *   However, the user's intuition about the "filtering mechanism" is spot on. How do Anti-Reductionists handle unreliable speakers without becoming Reductionists?

  4.  **Identify the "Middle Ground" Solutions:**
      *   **Defeasibility:** The key concept for Anti-Reductionism. The warrant is *prima facie*, not *ultima facie*. It can be defeated.
      *   **Negative vs. Positive Reasons:** Reductionism requires *positive* reasons to trust. Anti-Reductionism requires *no positive* reasons, but *no negative* reasons (defeaters) either.
      *   **Contextualism:** Maybe the "floor" changes based on context (stakes, expertise).
      *   **Dual-Process/Modular:** Maybe we have a default trust module that is monitored by a critical thinking module.
      *   **Virtue Epistemology:** Focus on the hearer's intellectual virtues rather than the warrant level.

  5.  **Drafting the Response (Iterative Process):**

      *   *Acknowledge the insight:* The user's "dial" model is a great heuristic. Validate their intuition that the "gullibility objection" is the strongest weapon against Anti-Reductionism.
      *   *Address the "Perception-Level" claim:* Clarify that Burge/Coady don't mean "infallible like perception" but "foundational like perception." Perception can be hallucinated; testimony can be lied about. Both have defeaters.
      *   *The Crucial Distinction (Positive vs. Negative):* This is the technical fix.
          *   Reductionism: Need positive evidence *for* trust.
          *   Anti-Reductionism: Need absence of evidence *against* trust.
          *   *Analogy:* Innocent until proven guilty vs. Guilty until proven innocent.
      *   *Addressing the "Bad Witness" problem:* How does the Anti-Reductionist filter the bad witness without checking reliability (which looks like Reductionism)?
          *   *Response:* They check for *defeaters*, not *validators*. Looking for red flags is cheaper/easier than verifying credentials.
          *   *Example:* Someone smells of alcohol and slurs speech. That's a defeater. I don't need to verify their medical license to distrust their diagnosis if they are drunk.
      *   *The "Middle Position" (Moderate Anti-Reductionism):*
          *   Fricker (Local Reductionism): Maybe there's a middle ground. You need some monitoring, but not full induction.
          *   Lackey: The "Dualism" view. Sometimes testimony is basic, sometimes it needs reduction.
      *   *Reframing the Dial:* It's not a volume knob on justification. It's a switch on the *Burden of Proof*.
      *   *Conclusion:* The dial doesn't have to run to gullibility. The "filter" isn't the same as the "foundation."

  6.  **Refining the Argument (Self-Correction during drafting):**
