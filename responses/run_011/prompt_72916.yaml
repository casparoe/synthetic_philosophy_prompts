answer: |-
  This is a sharp intuition, and you've hit on the single strongest objection to anti-reductionism: **the gullibility objection.**

  Your "dial" model is a great heuristic, but I think the stalemate you're sensing comes from modeling warrant as a *scalar quantity* (how much justification?) rather than a *structural status* (where does the burden of proof lie?).

  Here is why the dial doesn't necessarily snap from "Gullibility" to "Reductionism," and where the actual middle ground lives.

  ### 1. The Perception Analogy is Structural, Not Qualitative
  When Burge or Coady say testimony has the same warrant as perception, they don't mean it is *as reliable* as perception. They mean it is **basic**.

  *   **Perception:** When I see a cup, I am justified in believing there is a cup *unless* I have a defeater (I know I'm hallucinating, the lighting is red, etc.). I do not need to first prove my eyes are working.
  *   **Anti-Reductionist Testimony:** When I hear a claim, I am justified in believing it *unless* I have a defeater (the speaker is lying, drunk, incompetent). I do not need to first prove the speaker is reliable.

  Your worry is: *"If the floor is at perception-level, then anything anyone tells me is justified by default no matter how bad a witness they are."*

  But apply that to perception: If the floor is at perception-level, am I justified in believing I see a pink elephant no matter how bad my eyesight is? **No.** Because perception comes with built-in **defeasibility conditions**.

  The Anti-Reductionist isn't saying "Believe everything." They are saying "The default setting is 'Accept,' not 'Reject'."

  ### 2. Positive Reasons vs. Negative Reasons (The Real Dial)
  The difference isn't about *how much* warrant you get; it's about what you need to do to keep it.

  *   **Reductionism (Hume):** You need **positive reasons** to trust. (I need evidence *for* the speaker's reliability before I believe.)
  *   **Anti-Reductionism (Reid/Burge):** You need **no positive reasons**, provided you have **no negative reasons**. (I need no evidence *for* reliability, provided I see no evidence *against* it.)

  This is the middle position. It avoids gullibility because the "filter" is still active. If a witness looks shifty, smells of alcohol, or contradicts known facts, the warrant is defeated immediately.

  **The Crucial Distinction:**
  Checking for **defeaters** (Anti-Reductionism) is epistemically cheaper and cognitively different than verifying **credentials** (Reductionism).
  *   *Reductionist:* "I need to verify this doctor is actually a doctor before I listen to their diagnosis."
  *   *Anti-Reductionist:* "I assume they are a doctor because they are wearing a white coat in a hospital, unless I see a nametag that says 'Janitor' or they tell me they failed med school."

  The Anti-Reductionist isn't ignoring reliability; they are treating reliability as a **presumption** rather than a **conclusion**.

  ### 3. The "Moderate" Middle: Local Reductionism & Monitoring
  If you feel the pure Anti-Reductionist position is still too loose, there is a robust middle ground occupied by people like **Elizabeth Fricker** and **Jennifer Lackey**.

  **Fricker's "Local Reductionism":**
  She argues we don't need a global induction that "testimony is generally reliable" (which is hard to prove without circularity), but we do need *local* monitoring. We have a "sensitivity to cues" (tone, context, coherence) that acts as a filter. This isn't full-blown Humean reductionism (requiring explicit arguments for trust), but it's not blind Burgean entitlement either. It's a **monitoring condition**.

  **Lackey's "Dualism":**
  Lackey argues that sometimes testimony is basic (e.g., a stranger telling you the time), and sometimes it requires reduction (e.g., a stranger telling you a complex scientific fact). The "dial" moves based on the **stakes** and the **content**.

  This saves the Anti-Reductionist from the "gullibility" charge. You aren't required to verify the stranger's watch mechanism to believe the time, but you *are* required to notice if they are laughing maniacally while telling you.

  ### 4. Reframing Your Dial
  Your model suggests the dial controls **Input Volume** (how much justification gets in).
  A better model might be a **Circuit Breaker**.

  *   **Reductionism:** The circuit is open (Off) by default. You must manually flip the switch to On (provide positive reasons).
  *   **Anti-Reductionism:** The circuit is closed (On) by default. It only trips if there is a surge (defeaters/reliability issues).

  The "gullibility" objection assumes that an "On by default" circuit will fry the system. But epistemic systems have fuses (defeaters). The Anti-Reductionist claim is that human cognition is built with fuses sensitive enough to catch the bad witnesses without needing to manually verify the wiring every time.

  ### 5. Does Anti-Reductionism Concede?
  You asked: *"Does the anti-reductionist side have to concede the dial only runs from gullibility to reductionism?"*

  **No, but they have to concede the "Head Start" is small.**
  If the Anti-Reductionist says, "You never need to check for reliability," they are dead. But almost no serious Anti-Reductionist says that. They say, "You don't need to check for reliability *in the absence of warning signs*."

  The middle position is **Default and Challenge**.
  1.  **Default:** Accept testimony (Warrant granted).
  2.  **Challenge:** Is there a defeater? (Warrant checked).
  3.  **Result:** If no defeater, belief is justified. If defeater exists, you must revert to Reductionist methods (verify the source) to regain warrant.

  So, the dial isn't fixed. It's dynamic. The "floor" is high (presumptive), but the "ceiling" is low (easily defeated). Reductionism sets the floor at zero but allows the ceiling to be high if verified.

  **Verdict:**
  There is a real middle position. It lies in distinguishing between **generating** warrant (which Anti-Reductionists say is automatic) and **maintaining** warrant (which requires sensitivity to defeaters). You can have a high warrant floor without being a gull, provided your defeater-detection system is working. If your defeater-detection system *is* the same as the Reductionist's verification system, then yes, you collapse into Reductionism. But most epistemologists argue detecting a lie is cognitively distinct from verifying a truth.
