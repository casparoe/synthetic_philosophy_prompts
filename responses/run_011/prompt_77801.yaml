answer: |-
  Here are nine questions tailored to your guest's specific "Reconstruction Frontier" view. They are ordered to flow from exposition to pressure points, ending with a dilemma she can't easily dodge.

  **1. The Opener (Substantive but Low-Stakes)**
  **Q:** In the standard Best System view, laws balance simplicity against strength. You propose swapping "strength" for "reconstructibility within bounded steps." In practice, does this trade-off ever recommend a system that is *more* complex but easier to compute, or does it mostly just prune the usual suspects?
  **Anticipated Reply:** She will likely say it sometimes favors slightly more complex axioms if they yield faster derivation, particularly in special sciences.
  **Follow-up:** "If the axioms are more complex, doesn't that cost you on the simplicity metric that Lewisians care about, or have you redefined simplicity entirely?"
  **Why it bites:** It forces her to clarify immediately whether she is modifying Lewis or replacing him, preventing her from hiding behind standard BSA intuitions later.

  **2. The Lewis Difference (Specific Candidate)**
  **Q:** You claim this view captures laws that vanilla Lewisianism misses. Can you name one specific candidate law—perhaps a *ceteris paribus* law in biology or economics—that sits on your reconstruction frontier but falls off the Lewisian Best System?
  **Anticipated Reply:** She will likely cite a special science generalization that is too messy for global simplicity but highly reconstructible for local domains.
  **Follow-up:** "Couldn't a Lewisian just argue that those generalizations aren't fundamental laws, but rather derived theorems, and keep their account intact?"
  **Why it bites:** It challenges whether her view actually changes the extension of "law" or just relabels what Lewis called "derived regularities."

  **3. No Cognizers (The Early Universe)**
  **Q:** Consider the first few hundred million years of the universe, before any cognizers existed. On your view, was there a reconstruction frontier then, or does the existence of laws wait for the arrival of a reasoner?
  **Anticipated Reply:** She will likely say the laws existed *counterfactually*—i.e., if a reasoner had been there, this is the frontier they would have found.
  **Follow-up:** "What grounds that counterfactual truth if not the very laws you are trying to define? Aren't you presupposing the laws to explain the laws?"
  **Why it bites:** It presses the classic Humean circularity worry: you can't appeal to what a reasoner *would* do without assuming the nomic structure that governs that reasoner.

  **4. Circularity (Inference Steps)**
  **Q:** You rank systems by the number of inference steps required to reconstruct the mosaic. But doesn't specifying a "valid inference step" already presuppose logical or nomic constraints that aren't part of the mosaic?
  **Anticipated Reply:** She will likely distinguish logic from laws, claiming logic is a precondition for any system, not a law itself.
  **Follow-up:** "If logic is part of the Best System, your definition is circular; if it isn't, why does 'bounded inference' track *nomic* compression rather than just *logical* compression?"
  **Why it bites:** It targets the worry that she has solved the BSA circularity problem only by pushing the circularity up one level to the notion of "inference."

  **5. Convergence (Reasoner Capacity)**
  **Q:** You argue the frontier converges for all reasoners above a competence threshold. But if a reasoner has significantly larger working memory, their optimal compression might look different. Do laws change with cognitive capacity?
  **Anticipated Reply:** She will likely deny this, positing a "canonical" idealized reasoner to fix the laws.
  **Follow-up:** "On what non-arbitrary grounds do we select that canonical reasoner? If you pick one like us, aren't laws just anthropocentric?"
  **Why it bites:** It forces a dilemma: either laws are relative to cognitive hardware (unstable) or the "canonical reasoner" is a fiction that smuggles in human bias.

  **6. Vagueness (The Flat Frontier)**
  **Q:** Imagine two competing systems sit equally well on the reconstruction frontier. Does this mean lawhood is vague in that region, or is there a fact of the matter we just can't access?
  **Anticipated Reply:** She will likely embrace vagueness, arguing that lawhood is a functional role that can be multiply realized.
  **Follow-up:** "If lawhood is vague, is that a vagueness in reality itself, or just in our description? If the former, are you comfortable with ontic vagueness?"
  **Why it bites:** Many metaphysicians reject ontic vagueness; if she accepts it, she needs to defend a costly metaphysical commitment.

  **7. Undermining (Commitment B)**
  **Q:** You claim undermining worlds aren't reconstructible from the axioms, which solves the undermining worry. But if the mosaic *actually* unfolds that way, why does the failure of reconstruction mean the world is impossible rather than your system being wrong?
  **Anticipated Reply:** She will likely say that if it's not reconstructible within the bounds, it doesn't count as a "law-governed" possibility in her sense.
  **Follow-up:** "So you're defining away the problem by restricting the space of possible worlds? Doesn't that make your account immune to objection only by being less comprehensive?"
  **Why it bites:** It suggests her solution to undermining is to shrink the modal space so much that the account loses explanatory power.

  **8. Governing/Explanation (World vs. Us)**
  **Q:** Critics say Humean laws don't explain, they just summarize. You say they unify for a bounded reasoner. Is that unification a feature of the world, or a claim about our cognitive grip on the world?
  **Anticipated Reply:** She will likely try to split the difference, saying it's a relation between the world and the reasoner.
  **Follow-up:** "If the reasoner vanishes, does the unification vanish? If so, isn't metaphysics just psychology?"
  **Why it bites:** It presses the instrumentalist worry: if laws depend on the relation to us, they aren't mind-independent features of reality.

  **9. The Closing (No Restatement Allowed)**
  **Q:** If cognitive science discovers tomorrow that human working memory is fundamentally structured differently than we thought, do the laws of nature retroactively change, or were we just wrong about them?
  **Anticipated Reply:** She cannot say "wrong" without admitting laws are mind-independent (undermining her view), nor "change" without admitting laws are unstable.
  **Follow-up:** "So either metaphysics is subordinate to empirical psychology, or your 'reasoner' is a fiction. Which is it?"
  **Why it bites:** This is the trap. If she says "wrong," she concedes laws are independent of the frontier (view collapses). If she says "change," she concedes reality shifts with our self-knowledge (absurd). She must choose a horn she dislikes.
