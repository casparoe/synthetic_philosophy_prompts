      *   *Empty Classes:* OWL allows them. Does this favor Nominalism? A Platonic Realist is happy with empty universals (Redness exists even if nothing is red). An Aristotelian is not. A Nominalist is happy (it's just a name). So empty classes don't settle it between Platonic Realist and Nominalist. They only hurt Aristotelian Realists.
      *   *Extensional Equivalence:* This is the killer. If `:A` equiv `:B` whenever extensions match, OWL denies the Realist claim that two different properties can pick out the same set (co-extensionality). This is the key point for the Residue Report.

