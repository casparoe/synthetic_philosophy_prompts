          *   *Fit:* The TBox/ABox distinction maps well to Concept/Particular.
          *   *Bend:* OWL ontologies are usually treated as objective descriptions of a domain, not subjective mental states of the modeller.
          *   *Missing:* The "mind." OWL has no agent/modeler representation standardly.

      *   **Position 4: Nominalism (Denial)**
          *   *Metaphysics:* Only particulars exist. "Red" is just a name (`nomen`).
          *   *OWL Translation:* `:Red` is syntactic sugar for a set of individuals. Extensional equivalence (`owl:equivalentClass`) implies identity.
