answer: |-
  Here is the design. It is built to be run strictly off the handout. You do not explain the game. You hand out the sheet, point to the timer, and say "Begin."

  ### The Game: "Dynasty"

  **Materials Needed:**
  *   28 small envelopes (one per student).
  *   300 Poker Chips (or equivalent tokens).
  *   5 Boxes of Paper Clips (standard size).
  *   7 "Trait" Cards (Index cards cut in half).
  *   1 Whiteboard marker.
  *   1 Visible Timer (projected or phone).
  *   1 "Hall of Founders" poster (large paper taped to the wall).

  **The One-Page Rule Sheet (Photocopy this):**

  ***

  **DYNASTY: RULES OF PLAY**

  **OBJECTIVE:** End Generation 3 with the highest **Total Family Score**.
  **THE PRIZE:** The winning Lineage name is posted on the "Hall of Founders" for the remainder of the term.

  **SETUP:**
  1.  Do not open your Envelope until instructed.
  2.  Inside is your **Family ID**, your **Trait Card**, and 10 **Start Chips**.
  3.  Your **Trait Card** stays face-up on your desk at all times.

  **THE CYCLE (Repeated 3 Times):**

  **PHASE 1: LABOR (6 Minutes)**
  1.  Build Paper Clip Chains. Connect as many clips as possible into a single continuous chain.
  2.  Loose clips do not count. Only connected chains count.
  3.  When time is called, stop immediately.

  **PHASE 2: ACCOUNTING (4 Minutes)**
  1.  Count your linked clips. This is your **Yield**.
  2.  Go to the Front Table. Submit your Chain and show your **Trait Card**.
  3.  The Banker will calculate your **Earnings** based on your Trait:
      *   **Standard:** 1 Chip per Clip.
      *   **Educated:** 1.5 Chips per Clip (Round Up).
      *   **Connected:** 2 Chips per Clip.
  4.  Collect your Earnings. Add them to your **Holding**.

  **PHASE 3: SUCCESSION & TAX (5 Minutes)**
  1.  **Death:** The current generation ends.
  2.  **The Vote:** All players vote on the **Transfer Rate** (0% to 100%).
      *   This rate determines how much of your **Holding** (Chips) passes to the next generation.
      *   Example: If you have 50 Chips and the Vote is 40%, you pass 20 Chips. The rest are removed from the game.
      *   **NOTE:** Your **Trait Card** passes to the next generation 100% tax-free. It never changes.
  3.  **Inheritance:** Open a new Envelope for Generation 2 (or 3). Transfer your taxed Chips and your Trait Card into the new Envelope.
  4.  Discard the old Chain. Keep your Chips and Trait.

  **SCORING:**
  *   **Family Score** = Total Chips held at the end of Generation 3.
  *   Ties are broken by who has the higher Trait multiplier.

  **WARNING:**
  *   Cheating voids your Lineage.
  *   Talking about strategy is permitted, but collusion is risky.
  *   The Banker's count is final.

  ***

  ### Minute-by-Minute Timeline (75 Minutes)

  | Time | Phase | Action | Notes |
  | :--- | :--- | :--- | :--- |
  | **00-05** | **Setup** | Hand out Rule Sheet & Envelopes. | Envelopes contain: ID, Trait Card, 10 Chips. **Do not speak.** Point to the sheet. |
  | **05-11** | **Gen 1 Labor** | Students build chains. | Project a countdown timer. Silence is best for focus. |
  | **11-15** | **Gen 1 Acct** | Students queue to Banker (You). | You verify count x Trait. Pay out chips. |
  | **15-20** | **Gen 1 Vote** | Public Vote on Transfer Rate. | Show of hands for 0%, 20%, 40%... 100%. Record rate on board. |
  | **20-21** | **Transition** | "Death." | Students calc tax, move chips to new envelope (Gen 2). Keep Trait. |
  | **21-27** | **Gen 2 Labor** | Students build chains. | Same task. Fatigue sets in. |
  | **27-31** | **Gen 2 Acct** | Students queue to Banker. | Speed is key. |
  | **31-36** | **Gen 2 Vote** | Public Vote on Transfer Rate. | **Watch the shift.** Middle class often votes lower here. |
  | **36-37** | **Transition** | "Death." | Move chips to Gen 3 envelope. |
  | **37-43** | **Gen 3 Labor** | Students build chains. | Final push. |
  | **43-47** | **Gen 3 Acct** | Final Count. | |
  | **47-50** | **Tally** | Rank the scores on Whiteboard. | Write Top 3 IDs and their Traits. Do not explain yet. |
  | **50-75** | **Debrief** | Discussion (See below). | |

  **Distribution of Trait Cards (Prep this before class):**
  *   **Connected (2x):** 4 Students (14%)
  *   **Educated (1.5x):** 9 Students (32%)
  *   **Standard (1x):** 15 Students (54%)
  *   *Assign these randomly in the envelopes. Do not announce the distribution.*

  **The Stakes:**
  The winning Family ID gets written on the "Hall of Founders" poster. You keep this poster up for every remaining class session. It creates a low-stakes but visible status hierarchy.

  ---

  ### The Debrief (25 Minutes)

  **1. The Reveal (5 Mins)**
  *   Ask the Top 3 winners: "Why did you win?" (They will cite hard work, strategy, focus).
  *   Ask the Bottom 3: "What stopped you?" (They will cite bad luck, the tax, the task).
  *   Reveal the Trait Cards. Ask the Top 3 to hold them up. Ask the Bottom 3 to hold them up.
  *   **The Kicker:** Ask: "Did the Vote change the ranking?" (It shouldn't have. The 2x multiplier usually overcomes any tax rate voted in 3 generations).

  **2. Mapping the Concepts (10 Mins)**
  *   **Chips:** Financial Capital (Money, property, stocks).
  *   **Trait Cards:** Cultural/Social Capital (Networks, confidence, education norms, "knowing how to play the game").
  *   **The Vote:** Redistribution Policy (Inheritance/Estate Tax).
  *   **The Labor:** Individual Effort/Merit.
  *   **Discussion:** Point out that the Tax only touched the Chips. The Trait passed 100% intact. This is your friend's argument: You can tax the money, but you cannot easily tax the advantage that *makes* the money.

  **3. Critiquing the Argument (5 Mins)**
  *   **What the game proves:** Financial redistribution alone does not equalize outcomes if non-financial advantages are heritable and compounding.
  *   **What the game hides (The Critique):**
      *   *The Card Deal:* In the game, Traits were random (envelopes). In reality, parents *choose* to pass these on. They read bedtime stories; they make calls. The game makes it look like a biological lottery, not a parental investment.
      *   *The Content:* The Trait was just a multiplier. Real cultural capital is complex (values, resilience, social grace).
      *   *The Tax Use:* In the game, taxed chips vanished. In reality, tax revenue funds schools/services that could upgrade the "Standard" cards. The game assumes the state burns the money.

  **4. The Limitation (5 Mins)**
  *   **Honesty Check:** Tell them: "75 minutes cannot reproduce 75 years."
  *   The game compresses time. In reality, the "Connected" family can hire tutors to ensure their kids *also* work harder. In the game, the "Standard" family could have worked harder than the "Connected" family, but the multiplier negated it.
  *   **The Big Missing Piece:** The game cannot reproduce the *psychological safety* of the advantage. The "Connected" students didn't feel safer; they just got more chips. Real inheritance tax debates are about whether safety nets allow for risk-taking, not just chip counts.

  ---

  ### Predictable Failures & Fixes

  **1. The "Banker" Bottleneck**
  *   **Risk:** 28 students queuing to you for accounting will eat 10+ minutes.
  *   **Fix:** Appoint 2 "Auditors" from the students (pick two who seem responsible). Give them a cheat sheet for the multipliers. You oversee the Auditors. This creates 3 checkout lanes.

  **2. The "Dead Line" (Bankruptcy)**
  *   **Risk:** If the tax vote is 100% and a student has low yield, they start Gen 2 with 0 chips. They disengage.
  *   **Fix:** The rules say they start with 10 chips in the envelope *plus* inheritance. Wait, the rules say "Inside is... 10 Start Chips."
  *   **Correction:** For Gen 2 and 3 envelopes, ensure there is a **Base Stipend of 5 Chips** inside every envelope regardless of inheritance. This prevents total elimination and keeps them playing, but the gap remains. *Add this to the Rule Sheet under Phase 3: "Note: Every new Generation receives a Base Stipend of 5 Chips from the State, regardless of inheritance."*

  **3. The Revolt**
  *   **Risk:** Students realize the Trait Card is the only thing that matters in Round 1 and refuse to play Round 2.
  *   **Fix:** The Task (Paper Clips) must feel effortful. If they feel they *earned* the chips through sweat, they will care about the tax. If the task is too easy, they see the rig immediately. 6 minutes is long enough to get sore fingers.

  **4. The Vote Stagnation**
  *   **Risk:** They vote 100% tax every time out of spite.
  *   **Fix:** The "Base Stipend" (above) helps. But also, remind them during the vote: "This rate applies to *you* when you die." As soon as the "Standard" players accumulate a decent stack in Gen 2, they will fear losing it in Gen 3. This creates the "softening" you want.

  ### The Biggest Thing Chips Cannot Reproduce

  You asked for honesty on the limitation. Here it is:

  **The game reproduces *inequality of outcome*, but it cannot reproduce *inequality of expectation*.**

  In the game, the "Standard" student knows the rules. They know the multiplier exists. In reality, the biggest advantage of the "Connected" family is that their children often *don't know they are advantaged*. They believe the game is fair. They believe their chips are purely the result of their clip-counting speed.

  The game makes the disadvantage visible (the card is face-up). Real cultural capital is invisible. You will have to supply this in the debrief. Tell them: *"In this game, you knew who had the advantage. In the real world, the 'Connected' family doesn't show you their card. They just tell you they worked harder. And because they have the multiplier, they actually did work harder to get even more. That is the hardest illusion to break."*

  ### Final Prep Checklist
  1.  **Envelopes:** Prepare 28 for Gen 1 (ID, Trait, 10 chips). Prepare 28 for Gen 2 (ID, 5 chips). Prepare 28 for Gen 3 (ID, 5 chips).
  2.  **Traits:** Mark the index cards clearly (Standard, Educated, Connected) with the multiplier.
  3.  **Clips:** Ensure boxes are open and accessible.
  4.  **Board:** Draw the Voting Tally table beforehand (Gen 1, 2, 3 rows).
  5.  **Silence:** Commit to not answering rules questions during play. Point to the sheet. If the sheet is ambiguous, let them interpret it. The confusion is data for the debrief.
