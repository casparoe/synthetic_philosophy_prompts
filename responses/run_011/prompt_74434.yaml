prompt: |-
  ok so my friend and I got into it last night, three solid hours, about inheritance tax, and I lost — but not on the part I expected to lose on.

  His opening stuff was the usual: you're taxing a dead person, it's money that already got taxed once, the person who earned it gets to say where it goes. I had answers for those, or I thought I did. Then he said something I couldn't touch. He said the money is the least of what rich parents pass on. Take 100% of the estate tomorrow and his kids still land on their feet, because what actually travels is the bedtime reading, the know-who-to-call, the school, the assumption that asking for a raise is a normal thing to do. So the tax is a gesture — it lets the state look like it's doing something about equal opportunity while the thing that actually generates unequal opportunity goes completely untouched. And he wasn't being smug, he was making it as a reason the whole debate is aimed at the wrong target.

  I want to run that past students before I run it past him again.

  I TA a 28-person intro ethics discussion section, 75 minutes, next Thursday, and we're on distributive justice. Design me a game they play in class that walks them straight into this without me explaining anything beforehand.

  Here's roughly what I'm picturing — push back wherever my design is dumb:

  - each student is a family line, not an individual, and the line runs three or four generations inside the 75 minutes
  - every generation does a real effort task, something where working harder genuinely yields more and I can score it in under two minutes. not trivia, nobody should be able to coast on being quick
  - earnings convert to tokens, and whatever tokens you're holding when your generation dies pass to the next generation of your line
  - plus a second channel: something heritable that changes your exchange rate between effort and tokens, and that channel is not taxable. it has to be possible to work exactly as hard as someone else and finish ahead purely because of what you were born holding. the cards or slips for this should read like compliments, not like advantages — if students clock it as the rigged channel in the first two minutes the whole thing is dead
  - the class votes the transfer rate every generation and the vote has to be able to move. I want the currently-broke students to catch themselves softening on a high rate once their own line starts climbing.

  The thing I most want them to hit, and it has to come out of the play and not out of my mouth: that even at a punishing rate the finishing order barely budges, and that the students holding the good cards at the end sincerely — not cynically — believe they outworked the room. I want the merit illusion manufactured from the inside.

  No real money, but give the stakes some teeth and make them outlast the session: a visible status thing the winning line keeps for the rest of term, or whatever you think works better.

  Constraints: no lecture up front, and "inheritance tax," "estate tax," and "equal opportunity" are all banned until the debrief — the rule sheet uses neutral names. One page of rules I can photocopy, written so a student can play from it without hearing a single word of explanation. Materials a normal classroom has: index cards, poker chips, dice, whiteboard. Minute-by-minute timeline, including how long the dying-and-inheriting transition eats, because thats where I assume it'll bog down.

  Then the debrief: map the moments they just lived onto the concepts, including what the votes did and why; tell me straight which parts of my friend's argument the game actually earns and which ones it quietly assumes away (I suspect it assumes the non-taxable channel is a card someone deals you, when in real life it's also a thing parents choose and could be pushed to choose differently); what predictably goes wrong the first time I run it — the hoarder, the kid who's bad at the task and gets needled, the line that dies out in generation two and then has nothing to do for twenty minutes, whatever else you see coming, and what I do about each; and be honest about the biggest thing 75 minutes of poker chips cannot reproduce, the piece I'm going to have to supply just by talking.

  And please don't pad it with statistics or study results. I don't need numbers and I don't want to be defending any you made up.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Goal:** Design a 75-minute in-class game for a 28-person intro ethics discussion section on distributive justice.
      *   **Core Concept:** The friend's argument that inheritance tax misses the point because *cultural/social capital* (bedtime reading, networks, confidence) is the real driver of inequality, not just financial capital. The game needs to demonstrate that even with high wealth transfer taxes, the "soft advantage" lineage wins.
      *   **Constraints:**
          *   No lecture up front.
          *   Banned words until debrief: "inheritance tax," "estate tax," "equal opportunity."
          *   One-page rule sheet (photocopiable, self-explanatory).
          *   Materials: Index cards, poker chips, dice, whiteboard (standard classroom).
          *   Timeline: Minute-by-minute, including transition times.
          *   Mechanics: 3-4 generations, effort task (not trivia), taxable wealth (tokens), non-taxable advantage (hidden/modifiable exchange rate), voting on transfer rate.
          *   Outcome: Students realize finishing order barely budges despite taxes; winners believe they outworked others.
          *   Stakes: Visible status for the rest of the term.
          *   Debrief: Map game to concepts, critique the friend's argument (what it earns vs. assumes), predict failures & fixes, acknowledge limitations.
      *   **Tone:** Practical, direct, no fluff/stats, respectful of the TA's expertise but firm on design.

  2.  **Deconstruct the Game Mechanics:**
      *   *Generations:* 75 minutes is tight. 3 generations is doable. 4 is risky. Let's aim for 3 full generations + debrief.
      *   *Effort Task:* Needs to be simple, scalable, and not knowledge-based. Stacking cups? Sorting cards? Copying a pattern? *Idea:* Copying a geometric pattern from a master sheet onto blank paper. It takes focus and hand speed. Or, *better for noise/space:* A "resource collection" task using dice or card flipping. Let's go with **Card Flipping/Sorting**. It's quiet, requires dexterity/focus, and is easily scoreable. Actually, **Pattern Copying** is better for "effort" feel. Let's refine: **Symbol Transcription**. A sheet with 50 abstract symbols. Copy as many as you can correctly in 5 minutes.
      *   *Wealth (Tokens):* Poker chips.
      *   *The "Soft Advantage" (The Friend's Point):* This needs to be the "Multiplier." Some families get a 1.5x or 2x multiplier on their effort. Crucially, this multiplier must be *inheritable* and *non-taxable*.
      *   *The Tax:* A vote each generation on what % of chips pass to the next gen. The Multiplier passes 100% untaxed.
      *   *The Illusion:* The Multiplier cards need to sound like "skills" or "traits," not "cheats." E.g., "Efficient Workflow," "Mentorship," "Legacy Access."
      *   *Stakes:* The "Founding Family Plaque" (a literal index card taped to the wall) or "Reserved Seating" for the rest of the term. Let's go with **The Golden Stapler** (or similar object) + a permanent mark on the whiteboard "Hall of Founders."

  3.  **Drafting the Rule Sheet (Mental Check):**
      *   Needs to be clear without verbal explanation.
      *   Must hide the "Multiplier" significance initially.
      *   Must explain the Voting mechanism clearly.
      *   *Risk:* If students realize the Multiplier is the key too early, they revolt. The names must be bland. "Family Trait" vs. "Family Treasury."

  4.  **Developing the Timeline:**
      *   0-5: Setup/Handout.
      *   5-15: Gen 1 (Task + Earnings).
      *   15-20: Death & Inheritance (Vote + Transfer).
      *   20-30: Gen 2 (Task).
      *   30-35: Death & Inheritance.
      *   35-45: Gen 3 (Task).
      *   45-50: Final Tally.
      *   50-75: Debrief.
      *   *Correction:* Transitions eat time. Need to streamline. 3 Generations is tight for 75 mins with a 25-min debrief. Let's compress tasks to 6 mins each.
      *   *Revised:*
          *   0-5: Setup.
          *   5-11: Gen 1 Task.
          *   11-16: Vote/Transfer.
          *   16-22: Gen 2 Task.
          *   22-27: Vote/Transfer.
          *   27-33: Gen 3 Task.
          *   33-38: Final Count.
          *   38-75: Debrief.
      *   *Wait,* 28 students. If they are individual family lines, that's 28 lines. Voting takes forever. *Group them.* 7 Groups of 4. Each group is a "Dynasty." This makes voting faster and task management easier.
      *   *Actually,* the prompt says "each student is a family line." 28 lines is too many for a vote. I need to compromise. Let's make them individuals, but the vote is a show of hands (quick). Or, stick to the prompt's "each student is a family line" but acknowledge the voting logistics. I will suggest a show-of-hands vote to save time.
      *   *Better:* 28 students is a lot for a complex economy. Let's keep them as individuals but simplify the voting.
      *   *Task:* Copying symbols is good. 5 minutes per round.
      *   *Multiplier:* "Efficiency Card." Some get x1, some get x1.5, some get x2.
      *   *Tax:* Vote on % of *Chips* to confiscate. Cards pass 100%.

  5.  **Refining the "Soft Advantage":**
      *   The prompt says: "cards or slips for this should read like compliments, not like advantages."
      *   Examples: "Family Tradition of Literacy," "Professional Network," "Confidence in Negotiation."
      *   In the game: "Legacy Bonus," "Training," "Connections." Let's use **"Family Trait"** cards.
      *   Distribution: 5 students get "High Trait" (2x), 10 get "Med Trait" (1.5x), 13 get "Base Trait" (1x). Randomly dealt at start.

  6.  **Addressing the "Merit Illusion":**
      *   The High Trait students *will* work hard. They will feel they earned it.
      *   The Tax Vote: Broke students will vote 100% tax initially. Once they inherit a good Trait card (if the game allows trading? No, keep it rigid to prove the point), or if they just see the rich staying rich, they might get frustrated.
      *   *Crucial Tweak:* To make the winners believe they outworked the room, the task must feel effortful. The Multiplier just boosts the *result* of the effort.
      *   *To make the vote move:* Allow the "Trait" to be slightly upgradeable? No, that complicates. The prompt wants the vote to move because students' *lines* start climbing. But if Traits are fixed at Gen 1, a Base Trait line never climbs past a High Trait line.
      *   *Fix:* The "Trait" is inherited, but the *Wealth* helps you buy... no, keep it simple. The prompt says "finishing order barely budges." So the vote *won't* change the outcome much. The vote moving is about the *broke* students hoping to catch up, then realizing it doesn't work.
      *   *Wait, re-reading prompt:* "I want the currently-broke students to catch themselves softening on a high rate once their own line starts climbing."
      *   *Problem:* If Traits are fixed, their line *won't* climb relative to the top.
      *   *Solution:* Randomize the Trait inheritance slightly? No, that undermines the "structural advantage" point.
      *   *Better Solution:* The "Trait" is the *only* thing that matters. The Wealth is the distraction. The Vote is the trap. The students will vote for high tax, it will be enacted, and the ranking will stay the same. The "softening" might come from the middle class fearing they will be taxed too.
      *   *Actually, let's look at the prompt again:* "catch themselves softening on a high rate once their own line starts climbing." This implies mobility. If I hard-code the inequality, there is no mobility.
      *   *Compromise:* Give a small random "Luck" bonus each round *in addition* to the Trait. This allows some movement, so when a low-trait student gets a lucky break, they might vote against tax to protect their gains. This creates the hypocrisy the TA wants.

  7.  **Addressing Logistics & Failures:**
      *   *Hoarding:* Students hiding chips. *Fix:* Count chips publicly at "Death."
      *   *Boredom (Dead Lines):* If a line goes bankrupt, are they out? No, everyone plays every round. Minimum earnings guarantee (e.g., everyone gets 5 chips base + effort). This prevents elimination but maintains inequality.
      *   *Task:* Copying symbols. 5 mins. Grading takes time. *Fix:* Self-report with peer audit? No, too much cheating. *Better Task:* **Dice Rolling.** It's pure chance? No, needs effort. **Paper Clip Chain?** Make as many links as possible. Tangible, countable, effort-based.
      *   *Let's go with Paper Clip Chains.* It's physical, quiet enough, and easy to count.
      *   *Wait, 28 students making chains for 5 mins.* Noise? Manageable.
      *   *Multiplier:* If you have the "Trait" card, every 2 clips = 3 chips. (1.5x). Or every 1 clip = 2 chips (2x).
      *   *Tax:* Applied to Chips only.

  8.  **Drafting the Debrief:**
      *   Need to map: Chips = Financial Capital. Trait Cards = Cultural/Social Capital. Vote = Policy/Tax.
      *   Critique: The game assumes Traits are random cards. In reality, parents *choose* to invest in traits (reading, etc.). The game makes it look like biological lottery, not parental effort.
      *   Limitations: 75 mins can't show generational compounding over 50 years. It can't show the *content* of the capital (values, etc.).

  9.  **Refining the Rule Sheet:**
      *   Must be one page.
      *   Clear headings.
      *   No banned words.

  10. **Final Review against Constraints:**
      *   75 mins? Yes.
      *   28 students? Yes.
      *   No lecture up front? Yes.
      *   Banned words? Yes.
      *   Stakes? Yes (Hall of Founders).
      *   Debrief depth? Yes.

  11. **Self-Correction on "Voting Move":**
      *   If the ranking never changes, students get cynical fast.
      *   I need the *middle* to fluctuate so they feel they have skin in the game.
      *   I will add a "Market Fluctuation" die roll that affects everyone, but affects the high-multiplier people *more* in absolute terms, making them want lower tax, while the low-multiplier people hope for a miracle and want high tax.
      *   Actually, keep it simpler. The "softening" comes from the fact that *everyone* accumulates wealth over time. Even the poor get richer in absolute terms, just not relative. They might vote to protect their absolute gains in Gen 3.

  12. **Final Polish:**
      *   Make sure the "Trait" cards sound innocuous. "Family Habit," "Network," "Education."
      *   Ensure the TA knows exactly what to say when.
      *   Check the math on the tax vote. If tax is 100%, does the next gen start at 0? Yes. But they keep the Trait. That's the point.

  13. **Wait, one major logistical hurdle:** Grading the effort task. If 28 students do a task, the TA cannot grade 28 outputs in 2 minutes.
      *   *Solution:* The task must be self-counting. **Paper Clip Chains** are perfect. You just count the links.
      *   *Alternative:* **Circle Filling.** Fill as many circles as possible on a grid. Easy to count.
      *   *Decision:* **Paper Clip Chains.** It feels more like "building" something.

  14. **Wait, another hurdle:** The "Trait" multiplier. If I have 2x, and I make 10 clips, I get 20 chips. If I have 1x, I get 10. The counter needs to verify the Trait card.
      *   *Fix:* Students submit their clips + card to a "Banker" (TA or 2 trusted students).
