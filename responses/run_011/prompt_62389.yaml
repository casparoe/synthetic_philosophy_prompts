prompt: |-
  A pop-history book on Victorian doubt I've been reading sums up George Eliot's religion like this: "Eliot read Strauss and Feuerbach in her twenties, concluded that Christianity was simply false, and fought her father over church-going because she thought pretending to believe was dishonest. She never went back. Her novels treat sincere faith as something earnest people hold onto before they grow up — Dinah Morris preaches, but her reward is marriage and giving it up, and by Middlemarch Dorothea's religious ardor is basically a beautiful mistake. In the end Eliot swapped God for the species, which is just utilitarianism in a Sunday hat."

  Ive read Middlemarch and most of Adam Bede and my instinct is that this flattens her, but I couldn't have said where. Go through it claim by claim: what's accurate, what's a fair compression a biographer wouldn't mind, and what would an Eliot scholar call flatly wrong — especially on whether she thought the truth of the doctrines was the important thing about religion at all, and on what she actually took from Feuerbach versus what this credits him with. Does the "utilitarianism in a Sunday hat" line survive once you fix the rest of it, or was it leaning on the parts you'd reject? No need to cite anything or send me a reading list, I just want your read. And tell me how confident you are in each verdict, plus single out the one you'd most expect to turn out wrong.
