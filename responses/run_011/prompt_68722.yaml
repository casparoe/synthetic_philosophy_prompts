answer: |-
  ### Load-Bearing Steps and Dependencies

  Your hunch is correct. The session collapses if students assume property is a natural right or that Mill is debating Lenin. The dependencies are strict:

  1.  **Property as Contrivance:** You must establish first that Mill views property rights as instrumental (justified by utility), not natural.
      *   *Dependency:* Nothing else works if students believe existing property arrangements are sacred. This opens the door to revision.
  2.  **Socialism as Association, Not State:** You must define Mill's "socialism" as voluntary industrial association (co-ops), not state ownership.
      *   *Dependency:* This depends on Step 1. If property is mutable, *who* holds it matters. If students picture state bureaucracy, they cannot assess Mill's argument about character development.
  3.  **The Empirical Suspension:** You must show Mill refuses to verdict because the experimental data on human character under cooperation is missing.
      *   *Dependency:* This depends on Step 2. You cannot weigh the utility of a system students misdefine.
  4.  **Continuity with Liberty:** You must resolve the tension between economic structure and individual development.
      *   *Dependency:* This depends on Step 3. Only once the verdict is suspended can you explain why *On Liberty* is not contradicted but awaits social data.

  ### Time Allocation (75 Minutes)

  *   **00–10:** **Framing:** Property as Contrivance. (Step 1)
  *   **10–25:** **The Case:** Whiteboard setup of "Best vs. Best." (Step 2)
  *   **25–50:** **Comparison:** Incentives, Character, and Efficiency. (Step 3)
  *   **50–65:** **Verdict:** The Utilitarian Suspension and *On Liberty*. (Step 4)
  *   **65–75:** **Close:** Textual Status and Thesis.

  ### The Concrete Case

  **The Case:** A comparative diagram of two idealized firms producing identical goods.
  **Whiteboard Construction (15 Minutes):** Draw two columns labeled "Wage System (Ideal)" and "Cooperative System." Draw three rows: "Ownership," "Management," "Distribution."
  **Include:**
  *   **Decision Rights:** Who hires/fires? (Boss vs. Vote).
  *   **Surplus:** Who keeps the profit? (Shareholders vs. Workers).
  *   **Risk:** Who bears loss? (Capital vs. Shared).
  *   **Assumption:** Explicitly write "Assume Competence & Honesty" at the top of both columns to force the "Best vs. Best" comparison.
  **Exclude:**
  *   State bureaucrats, taxes, or redistribution mechanisms.
  *   Historical examples of failed co-ops or sweatshops (keep it theoretical).
  *   Specific industries (keep it abstract "Firm A").
  **Timing:**
  *   **Introduce:** Minute 10 (immediately after establishing property is mutable).
  *   **Revisit:** Minute 25 (when discussing incentives) and Minute 50 (when discussing the verdict).
  *   **Why:** This visual anchor prevents the Philosophy students from abstracting too early and forces the Policy students to see the institutional mechanics before judging outcomes.

  ### Sequence of Objections and Misconceptions

  **1. "Is Mill a socialist now?" (The Conversion Myth)**
  *   **Surface:** Minute 12 (during Case setup).
  *   **Temptation:** Students seek biographical closure; it simplifies the text into a label.
  *   **Defusing Move:** Point to the whiteboard header: "We are weighing schemes, not identities." Remind them Mill calls this an "open question."
  *   **Status:** Student Error.

  **2. "Doesn't this mean state ownership?" (1917 Socialism)**
  *   **Surface:** Minute 15 (during Case setup).
  *   **Temptation:** Contemporary vocabulary overrides historical semantics.
  *   **Defusing Move:** Circle "Ownership" in the Cooperative column. Write "Workers," not "State."
  *   **Status:** Student Error.

  **3. "Won't people slack off without a boss?" (Incentives)**
  *   **Surface:** Minute 30 (during Comparison).
  *   **Temptation:** Assumes human nature is fixed rather than shaped by institutions.
  *   **Defusing Move:** Ask: "Does the wage system maximize effort, or just compliance?" Redirect to Mill's claim that co-ops change the *interest* in labor.
  *   **Status:** Student Error (Mill's point is structural, not moralistic).

  **4. "Why not just calculate the utility?" (Mechanical Utilitarianism)**
  *   **Surface:** Minute 55 (during Verdict).
  *   **Temptation:** Utilitarianism is taught as a calculation machine, not an empirical inquiry.
  *   **Defusing Move:** Write "Facts Missing" on the board. Explain that utility requires data on human character which does not yet exist.
  *   **Status:** Student Error.

  **5. "Does this contradict *On Liberty*?" (Continuity)**
  *   **Surface:** Minute 60 (during Verdict).
  *   **Temptation:** Students see economic determinism vs. individual liberty as binary.
  *   **Defusing Move:** Argue that economic security is a *precondition* for the individuality Mill defends in *On Liberty*.
  *   **Status:** **Genuine Difficulty.** This is not a student error but a real tension in Mill's corpus. Acknowledge the friction; do not pretend it is seamless.

  **6. "Does it matter that he died before finishing?" (Textual Status)**
  *   **Surface:** Minute 70 (during Close).
  *   **Temptation:** Over-reading implies hidden secrets; under-reading implies irrelevance.
  *   **Defusing Move:** State that the unfinished nature *is* the argument: the question remains open.
  *   **Status:** Student Error.

  ### Refusals

  You must explicitly refuse to explain two topics to preserve focus. At Minute 65, say:
  *"I am leaving out Mill's Malthusian population arguments and the later reception history by Engels and the Fabians. These are critical, but they obscure the institutional comparison we are making today."*

  ### Closing

  Thesis: Mill suspends judgment on socialism not because of ideological commitment, but because empirical evidence regarding human character under cooperative institutions remains experimentally incomplete.
