          1.  Identify the underlying principles candidates.
          2.  State them precisely.
          3.  Map the user's verdicts to these principles.
          4.  Test these principles against new cases (party standing in half districts, turnout disparity, votes cast vs. eligible, pro-minority gerrymander).
          5.  Tell the user straight which intuitions have to go (i.e., identify inconsistencies).

  2.  **Deconstruct the User's Intuitions:**
      *   *Verdict 1 (44% vs 43% -> 60% seats):* Accepts majoritarian bonus/disproportionality inherent in SMD (Single Member Districts).
      *   *Verdict 2 (Gerrymandered 38% -> 60% seats):* Rejects artificial manipulation of the map. Distinguishes "natural" SMD disproportionality from "engineered" disproportionality.
      *   *Verdict 3 (12% spread = 1 seat vs 5% concentrated = 56 seats):* Rejects extreme malapportionment/efficiency gap favoring concentration. Calls it a scandal.
      *   *Verdict 4 (Regional party wins region):* Accepts/likes geographic representation. Concentration *can* be legitimate if it reflects a distinct community.
      *   *Verdict 5 (Hung Parliament/Coalition):* Rejects coalition building that excludes the plurality winner. Wants the largest party to govern (or at least have first dibs).
      *   *Verdict 6 (Tactical Voting):* Accepts tactical voting as effective (didn't feel wasted) but acknowledges lack of sincere representation. Ambivalent.
      *   *Verdict 7 (One vote margin):* Accepts the "winner take all" outcome even if extremely close. Rejects recount/uncertainty; wants finality.

  3.  **Identify Candidate Principles:**
      *   *Principle A: Proportionality.* (Seats ~ Votes). User explicitly says this doesn't survive #1 or #5. So, it's not pure PR.
      *   *Principle B: Majoritarianism/Strong Government.* (Largest party should rule, decisive outcomes). Fits #1, #5, #7.
      *   *Principle C: Geographic Community Representation.* (Regions should have a voice). Fits #4, explains acceptance of #1 (districts), conflicts with #3 (concentration penalty).
      *   *Principle D: Procedural Fairness/Neutrality.* (The map shouldn't be rigged). Fits #2 (gerrymandering is bad).
      *   *Principle E: Voter Efficacy/Strategic Utility.* (Does my vote stop the bad guy?). Fits #6.

      *Synthesis:* The user seems to want **Majoritarian Geographic Representation with Procedural Integrity.** They want SMDs (geography), they want a clear winner (majoritarian), but they don't want the rules rigged (procedural), and they have a specific tolerance for *how* concentration is treated (regional parties good, niche concentration bad?).

      *Wait, look closer at #3 vs #4.*
      *   #3: 5% national vote concentrated = 56 seats. User hates this.
      *   #4: Regional party wins region. User likes this.
      *   *Distinction:* Is the 5% party a "regional" party or just a gerrymandered artifact? In #3, 56 seats is a *lot*. If 5% of the vote yields 56% of the seats, that's extreme. In #4, "nearly all seats in the region" implies they dominate *that* region, but not necessarily the whole parliament disproportionately.
      *   *Refinement:* The user dislikes *disproportionate national power* from small vote shares, even if concentrated, unless it's a "legitimate" regional movement. But how to define legitimate?
      *   *Actually, looking at #3:* 5% vote -> 56 seats. That's a massive bonus. 12% spread -> 1 seat. That's a massive penalty. This is the "Efficiency Gap" problem. The user hates the efficiency gap when it's extreme.
      *   *Looking at #1:* 44% -> 60%. That's a bonus, but user accepts it. Why? Because 44% is a *plurality/near majority*. 5% is not.
      *   *Hypothesis:* The user supports a **Manufactured Majority Principle**. SMDs are good *if* they manufacture a majority for a large party (#1), but bad if they manufacture a majority for a small party (#3).
      *   *And #5:* Largest party must lead. This confirms the "Manufactured Majority for the Plurality" preference.

  4.  **Drafting the Principles:**
      *   *Principle 1: The Governing Mandate.* The party with the most votes should form the government, and the system should facilitate single-party majorities if possible. (Motivated by #1, #5).
      *   *Principle 2: Geographic Integrity.* Representation should be tied to place, and boundaries should not be manipulated for partisan gain. (Motivated by #2, #4, #7).
      *   *Principle 3: The Threshold of Legitimacy.* Concentration is acceptable for regional voices, but not for generating disproportionate *national* power from a tiny vote share. (Motivated by #3 vs #4).

  5.  **Testing Against New Cases:**
      *   *Case A: Party stands in half districts.* (e.g., Regional party or lazy party). If they get 20% national vote (all in half country) and win 40% seats. User's Principle 1 says "Largest party should rule." If they are the largest, do they deserve to rule? Principle 3 says "Concentration okay for regions."
      *   *Case B: Turnout disparity (30% vs 80%).* Principle 2 (Geographic Integrity) suggests each district is equal. But "One Person One Vote" suggests turnout shouldn't dilute power. If a seat is won with 10k votes vs 40k votes, is it fair? User's #7 says "Winner takes seat." But does the low turnout seat count the same?
      *   *Case C: Votes Cast vs Eligible.* If 50% turnout, does 40% of *votes cast* mean 20% of *eligible*? User's #1 focuses on "vote share." Usually means votes cast.
      *   *Case D: Pro-Minority Gerrymander.* (Drawing maps to help a minority group/party). User's #2 says "Map drawn so A would win... feels like a wrong." Does the *intent* matter or the *manipulation*? If it helps a historically marginalized group, does #2 still apply?

  6.  **Identifying Inconsistencies (Which intuitions must go?):**
      *   *Conflict 1: #1/#5 vs #3.* You can't consistently support SMD disproportionality for large parties (#1) while condemning it for small parties (#3) without a clear threshold. Where is the line? 44% is okay to get 60%. 5% is not okay to get 56%. What about 25% getting 51%?
      *   *Conflict 2: #2 vs #4.* #2 hates manipulated maps. #4 likes regional parties winning regions. But regional parties winning regions *depends* on where the lines are drawn. If you draw lines to *help* the regional party, is that #2 (bad) or #4 (good)?
      *   *Conflict 3: #5 vs #1.* #1 accepts 44% getting 60% seats (Majority). #5 says if no majority (Hung Parliament), the largest party (even with <50%) should still lead. This implies a strong preference for the *Plurality* party having a privileged status, even without a mandate.
      *   *Conflict 4: #7 vs #2.* #7 accepts a 1-vote margin as final (stability). #2 worries about map manipulation (fairness). A 1-vote margin often triggers recounts (fairness over stability).

      *The Big Reveal:* The user is a **Moderate Majoritarian**. They want First-Past-The-Post (FPTP) outcomes (strong gov, geography) but without the "pathological" failures of FPTP (gerrymandering, extreme fragmentation, tiny parties ruling).
      *   *The Contradiction:* FPTP *inherently* produces the outcomes in #3 if geography is uneven. You can't have #1 (SMD bonus) without risking #3 (Concentration bonus).
      *   *The Hard Truth:* To keep #1, #4, #5, #7, the user must accept that #3 is sometimes a feature of the system they like, OR they must accept #2 (independent commissions) which might reduce #1's bonus.
      *   *Most likely sacrifice:* Intuition #5 (Largest party must govern in coalition) is hard to square with democratic coalition building. Or Intuition #3 (The 5% party scandal) is actually just extreme math that the user has to accept if they want SMDs.
      *   *Actually, the strongest tension is between #1 and #3.* 44% -> 60% is a +16 bonus. 5% -> 56% is a +51 bonus. The user accepts the *mechanism* that causes the bonus in #1, but rejects the *outcome* in #3. The mechanism is the same (SMD + Geographic Concentration).
      *   *Verdict:* The user needs to abandon the idea that SMD disproportionality is "just how it works" (#1) while calling concentration disproportionality a "scandal" (#3). They are the same phenomenon on a curve.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the messiness (it's common). Name the philosophy (Majoritarian Pluralism with Procedural Guardrails).
      *   **Section 1: The Principles.** Define 3 core principles derived from the verdicts.
      *   **Section 2: Mapping.** Show which verdict supports which principle.
      *   **Section 3: Stress Testing.** Run the new cases (Half districts, Turnout, Eligible, Minority Gerrymander).
      *   **Section 4: The Hard Truths (Which intuitions to drop).** Point out the #1 vs #3 contradiction and the #5 Coalition problem.
      *   **Conclusion:** Summarize the coherent position.

  8.  **Refining the "Hard Truths":**
      *   *The #1 vs #3 tension:* This is the "Cube Law" vs "Efficiency Gap." In SMDs, concentration *always* rewards. 44% concentrated yields 60%. 5% hyper-concentrated yields 56%. The user likes the first, hates the second. Why? Because 44% feels like a "governing mandate" and 5% feels like "cheating."
      *   *Advice:* You have to decide if you value *Geography* or *Vote Share* more when they conflict.
      *   *The #5 tension:* "Election Stolen" in a coalition system is a very majoritarian view. In PR systems, this is normal. If the user wants SMDs (#1), hung parliaments are rarer, but when they happen, the "largest party rule" is a convention, not a mathematical necessity.
      *   *The #2 tension:* Gerrymandering is bad. But who decides? Independent commissions reduce the #1 bonus sometimes.

      *Decision:* I will tell them their core philosophy is **"Managed Majoritarianism."** They want the *benefits* of FPTP (strong gov, local MPs) without the *pathologies* (gerrymanders, freak results).
      *   *What must go:* They cannot consistently hold #1 (SMD bonus is fine) and #3 (Concentration bonus is scandal) without a specific threshold. They need to admit they support a **Threshold of Exclusion**. They also need to soften #5 (Coalitions aren't theft).

  9.  **Final Polish:** Ensure tone is academic but direct ("tell me straight"). Use political science terminology (Cube Law, Efficiency Gap, Majoritarian vs. Consensus Democracy).

      *(Self-Correction during drafting)*: Wait, look at #3 again. 5% vote -> 56 seats. That implies the 5% is *perfectly* distributed to win 56 districts by 1 vote, while the 12% is spread too thin to win any but one. This is the extreme end of the Efficiency Gap. The user calls it a scandal. But #1 (44% -> 60%) is the *mild* end of the Efficiency Gap. The user accepts the mild, rejects the extreme. This is consistent *if* they believe in a "Governability Threshold." I should frame it that way.

      *Revised Hard Truth:* The real inconsistency is #5. If you accept #1 (44% gets majority), you accept the system manufactures majorities. If you get a Hung Parliament, the system *failed* to manufacture a majority. Why is the coalition "theft"? Because the largest party was denied the "manufactured majority" they usually get? No, because seats were proportional in #5. So #5 rejects PR coalition logic while #1 accepts SMD majoritarian logic. This is the biggest clash. SMD logic says "Winner takes all." PR logic (implied by hung parliament seat totals) says "Share power." You can't have both.

