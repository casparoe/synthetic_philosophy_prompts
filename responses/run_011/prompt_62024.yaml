prompt: |-
  We run a little AI-consciousness reading group (five of us, half of whom have never opened a philosophy paper) and last week it totally derrailed. One guy, very pleased with himself, said "consciousness is an illusion, so there's nothing there to be harmed no matter what we build — you've all already conceded the only point that matters." Half the room acted like he'd just settled the debate with one sentence, the other half got red in the face, and I couldn't figure out which side was right, because the sentence feels simultaneously obvious and absurd to me.

  Can you lay out the different precise claims that "consciousness is an illusion" could be making? Off the top of my head there seem to be several: that there are no phenominal properties at all; that we do have experiences but we're systematically wrong about what they're like; that "illusion" is itself supposed to be a phenomenal term, in which case maybe the sentence eats itself; and that he just meant introspection is unreliable and shouldn't be trusted as evidence. Please tell me which of these I've garbled, add the ones I'm missing, and then for each reading say whether it's a platitude that nobody disputes, a substantive and defensible thesis, something incoherent, or a thesis that quietly drags in commitments its user would hate.

  The part I actually want answered: which of those readings, if any, licenses the jump from "consciousness is an illusion" to "so nothing we build can be harmed"? I have a nagging sense there's a big gap in there that he stepped over without noticing, but I can't say whether the gap is in the move from illusion to non-existence, or in the move from non-existence to no-moral-status, or somewhere else. And which reading do you think pop-sci people usually have in mind when they say the line — that's clearly the register he was performing in.

  A casual list is fine, I'm going to print it and hand it round next time. If my own framings above are muddled, just say so and fix them rather than answering the muddle.
