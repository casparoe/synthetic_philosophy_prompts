      *   *Fink:* Something that removes the basis *upon* stimulation (e.g., a wizard makes the glass non-fragile the moment it's struck).
      *   *Mask:* Something that prevents manifestation *despite* the basis and stimulus (e.g., packing the glass in cotton).
      *   *Antidote:* Something that interferes with the causal process *after* stimulus but *before* manifestation (often treated similarly to masks, but sometimes distinct as interfering with the mechanism).
      *   *Ceteris Paribus:* "All else being equal."

  3.  **Map to Chemical Physics (Drafting the Translation):**
      *   *Disposition:* Metastability / Reactivity. The tendency of a system to transition from state A to state B.
      *   *Basis:* The Free Energy Landscape (FEL). Specifically, the local minimum (metastable basin) and the saddle point (transition state). The structural configuration.
