      *   *Manifestation:* The Transition / Nucleation Event. Crossing the separatrix.
      *   *Fink:* A change in the landscape *during* the escape attempt. This is tricky. In physics, the landscape is usually static on the timescale of the jump. A "fink" would be a feedback mechanism that raises the barrier *as* the system approaches it.
      *   *Mask:* Suppression of the transition despite the barrier being surmountable. E.g., Vitrification. The kinetics are so slow it *looks* like it won't happen, or a capping agent prevents crystal growth.
      *   *Antidote:* An inhibitor that binds to the nucleus. It doesn't change the bulk thermodynamics but stops the specific pathway.
