      *   *Stretch:* "Masks" in physics are often just competing timescales. Is a mask a mask, or just a slower rate?
      *   *Basis:* In physics, the basis *is* the Hamiltonian/Lagrangian/Free Energy. In metaphysics, the basis is distinct from the disposition. This is a category error risk.

