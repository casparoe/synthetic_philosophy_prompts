  2.  **Deconstruct the Metaphysical Concepts:**
      *   *Disposition:* A property like "fragility" or "solubility." $x$ is disposed to $M$ if $S$.
      *   *Simple Conditional Analysis (SCA):* $x$ is disposed to $M$ if $S$ iff if $S$ were to occur, $x$ would $M$.
      *   *Basis:* The intrinsic categorical property grounding the disposition (e.g., molecular bonding).
      *   *Stimulus:* The trigger condition (e.g., striking, immersing in water).
