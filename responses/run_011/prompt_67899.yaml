prompt: |-
  I am marking Question 5 of a final-year undergraduate examination in the metaphysics of science, and I would like an independent assessment of one candidate's script. Below are the question as set, the mark bands used by the examination board, and the candidate's answer, with its paragraphs numbered so that your comments can be keyed to them. I have not formed a view about the script and would prefer that you assess it as it stands.

  **The question as set (25 marks, suggested length 700–800 words)**

  Lewis's account of lawhood is offered as a way of retaining a Humean picture of the world while still giving laws the work we expect of them.

  (a) State what, on Lewis's view, makes a true generalisation a law rather than an accident, and explain the role that perfectly natural properties play in the answer.
  (b) Explain how the account is supposed to earn laws their connection to counterfactuals.
  (c) Say in which direction determination runs between the mosaic of local matters of particular fact and the laws, and what that implies for the claim that laws explain the events falling under them.
  (d) Set out what you take to be the most serious objection to the account, and say whether Lewis can meet it. Compare his position briefly with Armstrong's.

  **Mark bands**

  22–25 Exceptional: all parts addressed with precision; objections stated at the level at which the literature actually presses them; the candidate distinguishes carefully between claims that are wrong, claims that are merely underdeveloped, and claims that are interpretively contested.
  18–21 Strong: accurate exposition of the view and its motivations, with at least one well-argued critical assessment; some imprecision in locating exactly where the difficulties bite.
  14–17 Competent: broadly correct exposition, but with a substantive misstatement, a conflation, or a part of the question left unaddressed.
  11–13 Thin: recognisable but superficial; the candidate reports positions rather than comparing them, and the critical section is generic.
  0–10 Inadequate: serious misunderstanding of the view, or failure to engage with most of the question.

  **The candidate's script**

  (1) Lewis's position is Humean because of what it says the world contains: nothing but the mosaic of local matters of particular fact, the distribution of perfectly natural properties and relations across spacetime, together with whatever supervenes on that distribution. Humean supervenience is the thesis that everything else we speak of — lawhood, chance, causation, disposition — supervenes on it. Lewis holds this to be part of the very idea of a law rather than a substantive hypothesis about the world: a view on which two worlds could agree perfectly in all local matters of fact and yet differ in their laws would not be a rival account of lawhood but a misuse of the term. His account of lawhood is therefore the working out of an analytic constraint, not a discovery about how things happen to be.

  (2) A deductive system is a set of sentences closed under consequence, and a true deductive system is one whose axioms are all true of the mosaic. Strength is how much of the mosaic's information the system's theorems carry; simplicity is how economically they carry it; the two compete, since a system can be made maximally strong by taking every truth as an axiom and maximally simple by taking almost none. The laws are the theorems of whichever true system wins that competition. The comparison presupposes a preferred vocabulary: systems are to be stated in terms of perfectly natural properties, because otherwise simplicity would depend on the language in which the axioms were written. Since the systems, not the generalisations, are the objects compared, lawhood is a global property; that is why a generalisation can be true, unrestricted and exceptionless and still fail to be a law, as with the claim that no gold sphere exceeds a mile in diameter.

  (3) Laws earn their connection to counterfactuals through the analysis of counterfactuals rather than by being installed as governors. The truth of a counterfactual turns on a similarity ordering over worlds, and that ordering is fixed by match of law together with spatio-temporal fit, so the worlds closest to ours share our laws. A counterfactual is true when its consequent holds at the closest antecedent-worlds. Because the laws of a world are themselves fixed by its mosaic, the counterfactuals we accept are derived rather than posited; and accidental generalisations, which are not theorems of the best system, do not enter the ordering and so support no counterfactuals. This is precisely the result the Humean wants: modal work is done, but nothing modal is added to the world.

  (4) Armstrong's alternative holds that a law is a relation of necessitation between universals, from which the corresponding regularity follows. So the two views agree about the world's patterns: on Armstrong's account the necessitation relation entails that all Fs are Gs, and on Lewis's account a law is a theorem of a true system and hence itself a truth about how things are distributed. The disagreement is not about the patterns but about whether anything exists over and above them — Lewis says no, Armstrong says a necessitation relation does. One clear advantage falls to Lewis: Armstrong's universals must be instantiated for the necessitation relation to hold, so his view cannot accommodate laws concerning quantities or kinds that never arise, whereas the best system can have theorems that outstrip the actual instances.

  (5) There is a cost here that Lewis accepts. Which system is best depends on how simplicity is weighted against strength, and weighting depends on the kind of systematisation that beings like us can manage; simplicity is a virtue of theories for creatures with our cognitive economy. Lawhood is therefore partly a function of the interests of systematisers. Lewis does not conceal this: objectivity is recovered not from the world alone but from the rough convergence of inquirers on the same informative systems. Armstrong treats that consequence as a reductio, but the relativity is built into the account and is a mark of its candour.

  (6) Determination runs from the mosaic to the laws: the laws are what they are because the mosaic is what it is, and there is no further fact. That does not cost Lewis the explanatory role of laws. What makes a generalisation explanatory is its place in the best system, and the theorems of the best system are what make the mosaic the lawlike pattern it is; to explain an event is to exhibit it as an instance of that pattern. The most serious objection, I think, is that this leaves the direction of explanation inverted: Maudlin's complaint is that laws are supposed to produce the mosaic, not to be read off it, and if a law is merely a summary of what happens, nothing answers the question why this pattern holds rather than another. A related difficulty is inductive. Because the best system is selected for its fit to the whole mosaic, including those parts of it that lie in our future, the laws depend on facts about which we can as yet have no evidence, and it is hard to see how the account can make sense of our ordinary justification for accepting them. Lewis cannot satisfy both demands at once: if the mosaic is prior, the laws are left with no explanatory work, and if the laws explain the mosaic, the priority that made the view Humean has been abandoned. And since the best system is chosen by reference to the very facts it is meant to systematise, the account is circular — lawhood is explained by appeal to a systematisation of what the laws already determine. That is a real cost, though one Armstrong shares, since his necessitation relation is equally unexplained.

  **What I need from you**

  1. A mark out of 25, and the band it falls in.
  2. Marginal comments keyed to the numbered paragraphs. For each substantive claim you comment on, say explicitly whether you take it to be (i) correct and credit-worthy, (ii) mistaken — and if so, what the correction is and why it matters for the argument of the script as a whole, or (iii) interpretively contested rather than wrong — and if so, what the defensible reading of the claim would be and whether the candidate has done anything to earn that reading. Where the script's paragraphs are in tension with one another, identify the tension and say which of the two claims you would treat as the mistake.
  3. A note of any part of the question that the script does not adequately address, and of any point on which the script is right in a way that a quick reading might overlook.
  4. Two or three specific revisions that would move this script into the top band, stated in terms the candidate could act on.

  Please judge the philosophy rather than the prose: no marks should be added or withheld for style, structure or length. Do not supply references, reading lists, or titles of works beyond those the question and the script already mention, and do not assume I can check anything against the syllabus — the assessment should stand on its own reasoning. If you believe some claim in the script is defensible on one reading and indefensible on another, say which reading you are scoring and why, rather than averaging the two.
reasoning: |-
  Here's a thinking process that leads to the assessment:

  1.  **Analyze the Request:**
      *   **Task:** Assess a specific exam script (Question 5) for a final-year undergraduate metaphysics of science course.
      *   **Input:** Question text, Mark Bands, Candidate's Script (numbered paragraphs).
      *   **Output Requirements:**
          1.  Mark out of 25 + Band.
          2.  Marginal comments keyed to paragraphs (categorizing claims as correct, mistaken, or contested). Identify tensions.
          3.  Note on unaddressed parts or overlooked strengths.
          4.  2-3 specific revisions for top-band improvement.
      *   **Constraints:** Judge philosophy, not prose. No external references beyond text. Stand-alone reasoning. Score specific readings if ambiguous.

  2.  **Analyze the Question:**
      *   **Topic:** David Lewis's Best System Account (BSA) of laws.
      *   **Parts:**
          *   (a) What makes a generalisation a law? Role of perfectly natural properties (PNPs).
          *   (b) Connection to counterfactuals.
          *   (c) Direction of determination (mosaic vs. laws) + implication for explanation.
          *   (d) Most serious objection + Lewis's response + Comparison with Armstrong.
      *   **Marks:** 25 total. Suggested length 700-800 words (Script looks roughly appropriate, maybe slightly dense).

  3.  **Analyze the Mark Bands:**
      *   **22-25 (Exceptional):** Precision, literature-level objections, distinguishes wrong/underdeveloped/contested.
      *   **18-21 (Strong):** Accurate exposition, well-argued criticism, some imprecision on difficulties.
      *   **14-17 (Competent):** Broadly correct, substantive misstatement/conflation/omission.
      *   **11-13 (Thin):** Superficial, reporting not comparing, generic criticism.
      *   **0-10 (Inadequate):** Serious misunderstanding.

  4.  **Evaluate the Script (Paragraph by Paragraph):**

      *   **Paragraph 1 (Humean Supervenience & Analyticity):**
          *   *Claim:* HS is the thesis that everything supervenes on the mosaic of PNPs. (Correct).
          *   *Claim:* Lewis holds this to be part of the *very idea* of a law rather than a substantive hypothesis... "analytic constraint". (Contested/Problematic). Lewis treats HS as a substantive (though resilient) hypothesis about our world, not an analytic truth about the concept of lawhood *simpliciter*. He thinks it's a feature of *our* world's metaphysics. Calling it an "analytic constraint" on the *idea* of lawhood misrepresents Lewis's meta-ontological stance. He argues for HS; he doesn't define lawhood such that non-Humean worlds are conceptually impossible, just that they don't exist (or HS is true of our world).
          *   *Claim:* A view where worlds agree on mosaic but differ on laws is a "misuse of the term". (Strong claim). Lewis argues such worlds are impossible *given HS*, but HS is a metaphysical thesis, not a linguistic one.
          *   *Assessment:* Good intro on HS, but the "analytic constraint" bit is a significant philosophical misstep regarding Lewis's methodology.

      *   **Paragraph 2 (BSA Mechanics & PNPs):**
          *   *Claim:* Deductive system, strength, simplicity, competition. (Correct).
          *   *Claim:* Laws are theorems of the best system. (Correct).
          *   *Claim:* PNPs fix the vocabulary to avoid language-relativity of simplicity. (Correct - crucial point).
          *   *Claim:* Lawhood is global; gold sphere example. (Correct).
          *   *Assessment:* Very strong exposition of the core mechanism. Addresses part (a) well.

      *   **Paragraph 3 (Counterfactuals):**
          *   *Claim:* Connection via analysis of counterfactuals (similarity ordering). (Correct).
          *   *Claim:* Ordering fixed by match of law + spatio-temporal fit. (Correct).
          *   *Claim:* Closest worlds share our laws. (Correct).
          *   *Claim:* Accidental generalisations don't enter ordering. (Correct).
          *   *Assessment:* Addresses part (b) accurately. Concise and correct.

      *   **Paragraph 4 (Armstrong Comparison):**
          *   *Claim:* Armstrong = necessitation between universals. (Correct).
          *   *Claim:* Agreement on patterns, disagreement on ontological surplus. (Correct).
          *   *Claim:* Lewis advantage: Uninstantiated laws (quantities/kinds that never arise). (Nuanced). Armstrong has a problem with uninstantiated universals (he's an immanent realist). Lewis can have laws about uninstantiated PNPs if they simplify the system (though this is tricky in Lewis too, as PNPs must be instantiated to exist *for Lewis* usually, but the *law* can cover counterfactual scenarios). Actually, Lewis requires PNPs to be instantiated in the world to exist. If a PNP is never instantiated, it doesn't exist for Lewis either. So the claim that BSA can have theorems outstripping actual instances *in terms of properties* is shaky. However, BSA supports counterfactuals about *instances* that don't occur. The script says "laws concerning quantities or kinds that never arise". For Lewis, if the kind never arises, the PNP doesn't exist. So this is a potential error or imprecision. Armstrong definitely can't handle uninstantiated universals. Lewis *also* struggles if the PNP isn't in the mosaic. But the BSA allows counterfactual support. The script implies Armstrong fails where Lewis succeeds on *uninstantiated laws*. This is a standard point of comparison (Armstrong's "inference problem" vs Lewis's modal flexibility), but the specific claim about "kinds that never arise" is technically problematic for Lewis's PNP ontology too.
          *   *Assessment:* Good comparison, slight technical wobble on uninstantiated properties, but captures the spirit of the debate.

      *   **Paragraph 5 (Anthropocentrism/Simplicity):**
          *   *Claim:* Simplicity depends on cognitive economy of beings like us. (Correct - Lewis admits this).
          *   *Claim:* Lawhood is partly a function of interests of systematisers. (Correct - this is the 'anthropocentric' objection/feature).
          *   *Claim:* Objectivity recovered from convergence of inquirers. (Reasonable interpretation).
          *   *Assessment:* Good engagement with the 'simplicity' worry.

      *   **Paragraph 6 (Determination, Explanation, Objections):**
          *   *Claim:* Determination runs mosaic -> laws. (Correct - Part c).
          *   *Claim:* Explanatory role retained via place in best system. (Correct - Lewis's response).
          *   *Claim:* Serious objection: Maudlin's complaint (laws produce mosaic, not read off). (Correct - identifies the 'Explanation' objection).
          *   *Claim:* Inductive difficulty (future facts determine laws). (Correct - 'Undermining' or epistemic access worry).
          *   *Claim:* Account is circular — lawhood explained by systematisation of what laws already determine. (Problematic). This conflates the *metaphysical* determination (mosaic -> laws) with the *epistemic* use. Lewis denies laws determine the mosaic. So saying "what the laws already determine" contradicts the earlier claim in this paragraph ("Determination runs from the mosaic to the laws"). This is a tension.
          *   *Claim:* Armstrong shares this cost (necessitation relation equally unexplained). (Debatable/Contested). Armstrong claims the relation *explains* the regularity. Lewis says Armstrong just pushes the buck. Saying they *share* the cost minimizes the specific force of the Humean objection.
          *   *Assessment:* Addresses Part (c) and (d). The tension on circularity is significant. The claim that Armstrong shares the *exact* cost is a bit glib but defensible as a 'brute fact' comparison.

  5.  **Synthesize and Grade:**

      *   **Strengths:** Clear structure, hits all four parts (a-d). Good grasp of BSA mechanics (PNPs, Strength/Simplicity). Good grasp of Counterfactuals. Good identification of Maudlin's objection.
      *   **Weaknesses:**
          *   Para 1: "Analytic constraint" is a misreading of Lewis's metaphysical commitment.
          *   Para 4: Uninstantiated properties point is technically shaky for Lewis (PNPs must be instantiated).
          *   Para 6: Tension between "Mosaic determines Laws" and "Circularity (Laws determine Mosaic)". The script asserts both.
          *   Part (d) Comparison: The claim that Armstrong shares the *circularity* cost is weak. Armstrong claims non-circular explanation (Necessitation -> Regularity). Lewis admits Regularity -> Law. The objection is usually that Lewis *loses* explanation, not that both are circular.
      *   **Band:** It's definitely above Competent (14-17). It's accurate on the mechanics. Is it Exceptional (22-25)? No, because of the "analytic" error and the tension in Para 6 regarding circularity/determination. It fits "Strong" (18-21). It has accurate exposition and well-argued criticism, with some imprecision on where difficulties bite (specifically the circularity claim and the analytic/substrative distinction).
      *   **Mark:** 19/20 range. Let's settle on 19.

  6.  **Drafting the Comments:**

      *   *Para 1:* Flag the "analytic constraint" issue. Lewis argues for HS as a metaphysical thesis about *our* world, not a conceptual truth.
      *   *Para 2:* Credit the PNP point.
      *   *Para 3:* Credit the counterfactual analysis.
      *   *Para 4:* Nuance the uninstantiated properties point. Lewis needs instantiated PNPs too.
      *   *Para 6:* Highlight the tension. If Mosaic -> Laws, how is it circular because Laws -> Mosaic? The script contradicts itself here. Also, the Armstrong comparison on explanation needs care.

  7.  **Refining the Mark:**
      *   Is it a 21? Maybe too high given the Para 1 and Para 6 errors.
      *   Is it a 17? Too low. The exposition is very good.
      *   19 seems right. Strong, but with specific philosophical imprecisions preventing "Exceptional".

  8.  **Final Review against Constraints:**
      *   No references? Check.
      *   Keyed comments? Check.
      *   Revisions actionable? Check.
      *   Philosophy over prose? Check.

      *(Self-Correction on Para 1)*: Lewis does sometimes speak as if Humean Supervenience is a package deal with his metaphysics, but calling it an "analytic constraint" on the *idea of lawhood* specifically is wrong. He thinks non-Humean laws are *possible* but *false*. The script says "a view on which two worlds could agree... and yet differ... would not be a rival account... but a misuse of the term." This implies Lewis thinks non-Humean lawhood is *inconceivable*. Lewis thinks it's conceivable but false (or that the 'necessitation' relation doesn't exist). This is a significant modal error.

      *(Self-Correction on Para 6)*: The circularity charge ("lawhood is explained by appeal to a systematisation of what the laws already determine") is a misunderstanding of Lewis. Lewis denies laws determine the mosaic. The candidate attributes the view they are criticizing to Lewis in the final sentence. This is a serious confusion in the critical section. This prevents the top band.

      *Decision:* 18/25. High Strong, but the contradiction in Para 6 and the modal error in Para 1 keep it out of Exceptional. Actually, looking at the bands: "18-21 Strong: accurate exposition... some imprecision in locating exactly where the difficulties bite." The Para 6 confusion is an imprecision in locating the difficulty. The Para 1 error is a substantive misstatement? Maybe. But the bulk is accurate. I will award 19.

      *Wait, re-reading Para 6:* "if the laws explain the mosaic, the priority that made the view Humean has been abandoned. And since the best system is chosen by reference to the very facts it is meant to systematise, the account is circular — lawhood is explained by appeal to a systematisation of what the laws already determine."
      The candidate is presenting the *objection*. They say "Lewis cannot satisfy both demands... the account is circular". They are attributing this circularity to Lewis's account *as an objection*. Is the objection valid? No, because Lewis denies laws determine the mosaic. So the candidate is presenting a strawman objection as the "most serious objection" without noting that Lewis rejects the premise (that laws determine the mosaic). This shows a lack of precision in the critical assessment. It drops it firmly into the 'Strong' category, not 'Exceptional'.

      *Final Mark:* 19.

      *Revisions:*
      1. Clarify HS status (metaphysical thesis vs analytic).
      2. Fix the circularity/determination tension in Para 6.
      3. Nuance the Armstrong comparison on explanation (Armstrong claims to solve it, Lewis redefines it).

      *Let's write the response.*
answer: |-
  1. **Mark: 19/25 (Strong Band: 18–21)**

  2. **Marginal Comments**

  *   **Paragraph 1:**
      *   **Claim:** "Lewis holds this to be part of the very idea of a law rather than a substantive hypothesis... an analytic constraint."
      *   **Assessment:** (ii) **Mistaken.** Lewis treats Humean Supervenience as a substantive metaphysical hypothesis about *our* world (and perhaps nearby worlds), not as an analytic truth about the concept of lawhood itself. He allows that non-Humean worlds are conceivable (e.g., worlds with primitive necessitation) but argues they do not exist.
      *   **Impact:** This misrepresents Lewis's modal realism and his argumentative strategy. He argues *for* Humeanism against rivals; he does not define rivals out of existence linguistically. This weakens the foundation of the exposition.
      *   **Claim:** "A view on which two worlds could agree perfectly in all local matters of fact and yet differ in their laws would not be a rival account... but a misuse of the term."
      *   **Assessment:** (ii) **Mistaken.** Lewis argues such worlds are metaphysically impossible *if* Humean Supervenience is true, but he does not claim the *term* 'law' is misused by non-Humeans (like Armstrong). He claims their ontology is mistaken.

  *   **Paragraph 2:**
      *   **Claim:** "The comparison presupposes a preferred vocabulary: systems are to be stated in terms of perfectly natural properties..."
      *   **Assessment:** (i) **Correct and credit-worthy.** This is a precise statement of why PNPs are required (to avoid language-relativity of simplicity).
      *   **Claim:** "...lawhood is a global property; that is why a generalisation can be true, unrestricted and exceptionless and still fail to be a law..."
      *   **Assessment:** (i) **Correct.** Good use of the gold sphere example to illustrate the systemic nature of the account.

  *   **Paragraph 3:**
      *   **Claim:** "The truth of a counterfactual turns on a similarity ordering over worlds, and that ordering is fixed by match of law together with spatio-temporal fit..."
      *   **Assessment:** (i) **Correct.** Accurately captures the Lewisian semantics for counterfactuals and how laws get priority in the similarity metric.
      *   **Claim:** "...accidental generalisations... do not enter the ordering and so support no counterfactuals."
      *   **Assessment:** (i) **Correct.** This correctly explains how the BSA earns the modal force of laws without adding modal ontology.

  *   **Paragraph 4:**
      *   **Claim:** "...the best system can have theorems that outstrip the actual instances." (Regarding uninstantiated kinds).
      *   **Assessment:** (iii) **Interpretively contested/Imprecise.** For Lewis, Perfectly Natural Properties must be instantiated in the world to exist. If a kind/quantity never arises, the PNP does not exist for Lewis either. Armstrong (immanent realist) shares this constraint. The advantage Lewis has is usually framed regarding *counterfactual instances* of instantiated properties, not entirely uninstantiated properties.
      *   **Impact:** A minor technical error in the comparison, but the broader point about ontological parsimony stands.

  *   **Paragraph 5:**
      *   **Claim:** "Simplicity is a virtue of theories for creatures with our cognitive economy. Lawhood is therefore partly a function of the interests of systematisers."
      *   **Assessment:** (i) **Correct.** This is an accurate acknowledgement of the anthropocentric element Lewis accepts in the BSA.
      *   **Claim:** "Objectivity is recovered not from the world alone but from the rough convergence of inquirers..."
      *   **Assessment:** (i) **Correct.** A fair defence of how Lewis mitigates the subjectivity worry.

  *   **Paragraph 6:**
      *   **Claim:** "Determination runs from the mosaic to the laws..."
      *   **Assessment:** (i) **Correct.** Accurately answers part (c).
      *   **Claim:** "...the account is circular — lawhood is explained by appeal to a systematisation of what the laws already determine."
      *   **Assessment:** (ii) **Mistaken (Internal Tension).** This contradicts the opening sentence of this paragraph ("Determination runs from the mosaic to the laws"). If the mosaic determines the laws, the laws do *not* determine the mosaic. The candidate presents an objection (circularity) that relies on a premise (laws determine mosaic) which they just correctly stated Lewis denies.
      *   **Impact:** This is a significant philosophical confusion in the critical section. It conflates the *epistemic* use of laws with the *metaphysical* determination base.
      *   **Claim:** "...one Armstrong shares, since his necessitation relation is equally unexplained."
      *   **Assessment:** (iii) **Interpretively contested.** Armstrong claims the relation *does* explain the regularity (inference problem aside). Lewis claims Armstrong's explanation is brute. Saying they share the cost of *circularity* is inaccurate; the charge against Armstrong is usually unintelligibility or brute fact, not circularity.

  3. **Notes on Question Coverage and Overlooked Strengths**

  *   **Coverage:** All four parts of the question (a–d) are addressed. The script is comprehensive in scope.
  *   **Overlooked Strength:** The candidate's explanation of the role of Perfectly Natural Properties in Paragraph 2 is exceptionally clear. Many students fail to link PNPs specifically to the problem of language-relativity in simplicity; this candidate identifies that link precisely. This demonstrates a solid grasp of the technical machinery of the BSA.
  *   **Weakness:** The critical section (Part d/Paragraph 6) undermines itself. While it identifies Maudlin's objection correctly (laws should explain the mosaic, not be read from it), the subsequent elaboration on circularity contradicts the Humean direction of fit established earlier in the paragraph. This prevents the script from reaching the "Exceptional" band, as the candidate does not distinguish clearly between the objection's premise and Lewis's actual commitment.

  4. **Specific Revisions for Top Band (22–25)**

  1.  **Correct the Status of Humean Supervenience (Paragraph 1):** Revise the claim that HS is an "analytic constraint." Instead, state that Lewis argues HS is a *contingent metaphysical truth* about our world. Acknowledge that Lewis regards non-Humean accounts (like Armstrong's) as *false* descriptions of reality, not linguistic confusions. This shows precision regarding Lewis's modal realism.
  2.  **Resolve the Determination Tension (Paragraph 6):** When presenting the circularity/explanation objection, clarify that the objection claims Lewis *fails* to explain, not that his account is circular in the sense of laws determining the mosaic. Phrase it as: "Critics argue that because the mosaic determines the laws, the laws cannot subsequently explain the mosaic without circularity *if explanation requires ontological priority*." This preserves the Humean direction of fit while accurately stating why critics find it unsatisfactory.
  3.  **Refine the Armstrong Comparison (Paragraph 4 & 6):** Distinguish the nature of the "brute fact" in each view. For Lewis, the brute fact is the mosaic itself; for Armstrong, it is the necessitation relation. Do not claim Armstrong's view is circular; claim instead that Armstrong posits an ontological surplus that Lewis argues is explanatorily idle. This demonstrates a finer grasp of the dialectic between the two positions.
