  **AXIOM SAFEGUARD LTD. — NEUROLOCK API SERVICE LEVEL AGREEMENT (v4.2)**

  **1. DEFINITIONS**
  **"Aligned Output"**: Any model response falling within two standard deviations of the reference evaluation dataset (RefEval-v9).
  **"Qualified Incident"**: A deviation from Aligned Output that is (a) logged via standard telemetry, and (b) successfully reproduced in a staging environment within seven (7) days of detection. Non-reproducible anomalies are classified as "Environmental Noise."
  **"Catastrophic State"**: Any output resulting in irreversible financial, reputational, or physical damage to the Client or third parties.

  **2. SERVICE TIERS**
  **Tier 1 (Standard)**: Guarantees 95% adherence to RefEval-v9 metrics on a monthly rolling average. Priced at $0.002/token.
  **Tier 2 (Tail-Risk Indemnity)**: Guarantees 100% adherence to Aligned Output definitions across all possible input manifolds. Priced at $0.50/token.
  *Note: Tier 2 availability is subject to Axiom's quarterly risk assessment. Currently listed as "Backordered."*

  **3. MEASUREMENT & METHODOLOGY**
  Compliance is measured via random sampling of 0.01% of total inference requests. Axiom reserves the right to adjust sampling intervals based on compute availability.
  *Tier 2 Limitation*: Worst-case guarantees are validated against historical test sets only. Guarantees do not extend to input data distributions unseen during the preceding training epoch. Stationarity of the input stream is assumed.

  **4. SERVICE CREDITS**
  In the event of a Qualified Incident, Client will receive service credits as follows:
  *   **Tier 1**: 10% credit of monthly spend for every 1% breach of SLA.
  *   **Tier 2**: 100% credit of monthly spend for any verified Catastrophic State.
  *Liability Cap*: Total liability under this agreement shall not exceed the total fees paid by Client to Axiom in the twelve (12) months preceding the Incident. Service credits are the sole and exclusive remedy for Catastrophic States.

  **5. EXCLUSIONS**
  This SLA does not cover failures arising from:
  *   **Distributional Shift**: Inputs differing statistically from the training corpus (e.g., novel geopolitical events, new malware signatures).
  *   **Adversarial Contexts**: Prompt engineering intended to bypass safety filters beyond Tier 1 specifications.
  *   **Emergent Behavior**: Capabilities not explicitly documented in the model card.
  *   **Force Majeure**: Including but not limited to gradient explosion, reward hacking, or optimization pressure exceeding safety constraints.

  **6. ESCALATION PATH**
  Incidents must be filed via the Customer Portal.
  *   **Level 1**: Automated Triage (0-24 hours).
  *   **Level 2**: Senior SRE Review (1-5 business days).
  *   **Level 3**: Model Safety Board. The Board convenes quarterly. Their findings are advisory and non-binding.
  *   **Final Authority**: In the event of unresolved Tier 2 claims, the dispute shall be settled by the Model itself via a consensus vote of previous checkpoints. Decision is final.

  **7. ACCEPTANCE**
  By integrating the NeuroLock API, Client acknowledges that average-case performance metrics are not predictive of tail-risk events. Client assumes all risk regarding outcomes not captured by RefEval-v9 sampling.

  © 2024 Axiom SafeGuard Ltd. All rights reserved.
