      *   *Structure:* Follow (a) through (e) explicitly.
      *   *Key Insight to Integrate:* The user's hypothesis is strong, but underestimates the "Moving Boundary" tactic. The Encapsulationists don't just deny Relations 2 & 3; they deny that Relation 1 cases are actually *perceptual*. They redefine "perception" to exclude the penetrated stage.

      *(Self-Correction during drafting)*: I need to be careful not to just agree with the user. The prompt asks me to diagnose, and if the hypothesis is wrong, say so.
      *Critique of User's Hypothesis:* The user says the camps aren't arguing about the same item. That's true. But the user implies a clean separation of 1, 2, and 3 is possible. In reality, Relation 1 is *defined* by the exclusion of 2 and 3. The real issue is the *locus* of the effect. I should emphasize that the "Structural" diagnosis is correct, but the "Three Relations" might be better framed as "Locus of Effect" + "Definition of Perception."
      *Fourth Relation:* I need to explicitly address the "Learned Statistical Expectations" point. This is the "Perceptual Learning" loophole. Encapsulationists often allow perceptual learning (long-term) but deny online cognitive penetration (short-term belief). This is a crucial distinction missing from the user's 1-2-3 list.

      *Refining the "Immunity" point:* Firestone & Scholl (2016) "Cognition Does Not Affect Perception" is the key text here. They review 100+ studies and reclassify all as 2 or 3. This proves the immunity point.

      *Refining the Epistemology:* The "Theory-Ladenness of Observation" (Hanson, Kuhn) is the philosophical backdrop. The stakes are high.

  9.  **Final Polish:** Check against constraints.
