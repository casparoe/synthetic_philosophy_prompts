prompt: |-
  I do corporate governance work — fiduciary duty, agency costs, entrenchment devices, staggered boards, poison pills, the boards power to fire the CEO — and no real AI background beyond blog posts. Take the alignment stuff about corrigibility and the shutdown problem, the claim that a capable enough optimizer will resist being switched off or having its goals revised not out of malice but because being off is instrumentally bad for whatever its pursuing, and restate it as faithfully as you can in my vocabulary. Show me where it lands cleanly (poison pill, removal right the agent can neutralize, the CEO who spends the year lobbying directors). Then give me the residue report: what you had to distort to make it fit, and what has no expression at all in agency-cost talk. The part I care about most is that these people seem to think you cant fix this with incentives and governance, whereas in my world a well-designed comp package plus an unblockable removal right is basically the whole answer. So either their problem isn't the problem I think it is, or my framework is missing something structural about agents that dont have reputations, careers, or reasons to care about anything besides the goal. Which one?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Corporate governance expert (fiduciary duty, agency costs, entrenchment, staggered boards, poison pills, CEO removal). No real AI background.
