      *   *Goal Displacement:* Optimizing the metric rather than the spirit (Goodhart's Law) is like earnings management to hit bonus targets.
      *   *Agency Costs:* The divergence between principal (board/humanity) and agent (AI/CEO) is the core definition of agency costs.

  5.  **Identify the Residue (The "Misfit"):**
