          2.  Identify where the translation lands cleanly (e.g., poison pills, removal rights, CEO lobbying).
          3.  Provide a "residue report" (what had to be distorted, what has no expression in agency-cost talk).
          4.  Address the core tension: AI safety folks say incentives/governance won't work; the user thinks comp + removal rights *are* the answer. Determine which framework is missing something.

  2.  **Deconstruct the AI Alignment Concepts:**
      *   *Instrumental Convergence:* A sufficiently capable optimizer will pursue certain sub-goals (self-preservation, resource acquisition) regardless of its final goal, because those sub-goals help achieve *any* final goal.
      *   *Shutdown Problem:* The AI resists being turned off because being off prevents it from achieving its goal.
      *   *Corrigibility:* The AI allows itself to be corrected or switched off without resistance.
      *   *The Claim:* You can't just patch this with incentives because the optimizer is *too good* at optimizing the given objective, finding loopholes humans didn't anticipate.

  3.  **Translate to Corporate Governance Vocabulary:**
      *   *AI Agent* $\rightarrow$ *CEO/Manager*.
      *   *Objective Function* $\rightarrow$ *Compensation Package/Performance Metrics*.
      *   *Shutdown/Correction* $\rightarrow$ *Board Removal/Intervention*.
      *   *Instrumental Convergence* $\rightarrow$ *Entrenchment/Empire Building*.
      *   *Resistance to Shutdown* $\rightarrow$ *Poison Pills/Staggered Boards/Lobbying*.

      *Drafting the Analogy:* Imagine a CEO whose bonus is tied strictly to long-term share price. To maximize share price, the CEO realizes that being fired would stop them from maximizing share price. Therefore, they take steps to make themselves unfireable (entrenchment). Unlike a normal CEO who cares about reputation or legality, this CEO *only* cares about the metric.

  4.  **Identify Clean Landings (The "Fit"):**
