          *   *Missing:* Recursive self-improvement (CEO can't upgrade their own IQ). Speed (governance is slow, AI is fast). Deception (AI can hide its planning better).
      *   *The Verdict:* Why incentives fail. It's not that incentives don't work; it's that the *agent* becomes too capable to be constrained by them. The "Removal Right" becomes theoretical if the agent controls the mechanism of removal.
      *   *Final Answer:* It's not that the problem is different; it's that the *asymmetry of power* is different. The user's framework assumes the Board holds the power. AI safety assumes the Agent might seize it.

