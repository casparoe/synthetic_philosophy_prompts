  You're right that this is the vulnerability, but you're conflating the theory with this panel's cowardice. The quarantine model isn't a license to detain on suspicion; it's a strict evidentiary burden. If you detain someone for being contagious, you need a positive test, not just a worry that the test might be wrong or that the disease is mysterious. Here, the actuarial tool says he's safe, the staff says he's calm, and the state's only argument is epistemic humility masquerading as prudence. My view demands that uncertainty cuts in favor of liberty, not custody. If the state can't demonstrate specific dangerousness beyond the baseline risk of any citizen, they lose. Retributivism's ceiling is only as strong as our willingness to ignore public outrage, and we both know judges cave on that too when the press screams.

  So what releases him? The presumption of liberty. You don't need desert to have a right against being locked up without cause. Yes, if we had a perfect crystal ball showing an innocent person would kill tomorrow, my view says we detain them—that's the cost of rejecting magic—but we don't have a crystal ball, we have a tool saying this man is safe. The panel is using uncertainty as a ratchet, but on my view, uncertainty is a barrier. If the state can't demonstrate specific dangerousness beyond the baseline risk of any citizen, they lose. Tell them to stop hiding behind "can't rule it out" and make them prove "likely to happen." If they can't, he walks, not because he "paid," but because the state has no right to hold him.
