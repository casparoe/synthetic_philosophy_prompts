      *   **Core Argument Point 3: The Persistence of Evidence.**
          *   A lie is attached to the liar. If discovered, it's discarded. A misleading truth ("No liver toxicity in 12 weeks") sits in the medical literature or the doctor's notes as a *fact*. It can be cited later without the context of the manipulation. It becomes "free-floating" misinformation.

      *   **Formulating the General Principle:**
