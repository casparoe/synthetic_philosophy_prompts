      *Let's sharpen the Principle:* The asymmetry flips when the communicative norm enforcement is asymmetric (punishes L, ignores M) AND the speaker leverages specific knowledge of the hearer's inference patterns to guarantee a false belief that the hearer owns.
      *Let's call it:* **The Condition of Asymmetric Vulnerability.**

      *Let's sharpen the Objection:* The objection should be about the *locus of error*. In L, the error is the Rep's statement. In M, the error is the Physician's inference. Therefore, M respects the Physician as an agent capable of error, whereas L treats them as a bucket to pour falsehoods into.
