      *   *Check:* Did I address the "proves too much" worry? Yes, need to distinguish between *protective* hedging and *exploitative* misleading.
      *   *Check:* Is the objection strong enough? The "Professional Responsibility" objection is the strongest because it targets the physician's agency. I need to make sure I don't just dismiss it but show why the Rep's knowledge (Stip 2) overrides it.

