answer: |-
  There is no single, canonical term in historical methodology or archival theory that precisely captures this phenomenon. You are correct to reject "archival silence" (which presupposes a gap) and "symbolic annihilation" (which presupposes absence or derogation). "Legibility" (Scott) is the closest ancestor, but as you note, it describes the *state's* capacity to act, not the *historian's* inability to retrieve.

  The phenomenon you are describing is the downstream archival consequence of state legibility. It is where the success of the bureaucratic form creates a barrier to biographical recovery.

  I propose you name this **Procedural Effacement**.

  Below is the carving you requested: the definition, the mechanism, the diagnostic, and the boundary cases.

  ### The Term: Procedural Effacement

  **Definition:**
  *Procedural Effacement* is the structural displacement of the biographical subject within the archival record, caused by the rigorous adherence of a document to its administrative teleology. It is characterized by an **inverse relationship between documentary density and biographical recoverability**: the more exhaustively a record fulfills its institutional purpose (sorting, accounting, regulating), the less retrievable the human subject becomes, not through absence, but through **documentary saturation**.

  **The Mechanism:**
  Procedural Effacement operates via two concurrent mechanisms:

  1.  **Formulary Constraint:** The physical or conceptual structure of the record (the columns in a ledger, the specific questions in an examination) creates "slots" for data. Any aspect of a life that does not fit a slot is not merely omitted; it is rendered *unrecordable* within that medium. The subject is forced to flow into the shape of the form.
  2.  **Teleological Filtering:** The record is created to answer a specific institutional question (e.g., "Which parish pays?" or "Was the laborer present?"). Information that does not serve this question is not suppressed; it is *irrelevant* to the creation of the document. Because the document is successful (dense, detailed) regarding its specific question, it creates an **Illusion of Completeness** for the future reader, who mistakes administrative exhaustiveness for biographical exhaustiveness.

  **Why "Effacement" and not "Silence"?**
  Silence implies a void where sound should be. Effacement implies a surface that has been rubbed smooth or written over. In Procedural Effacement, the page is full. The ink is dense. But the *person* has been rubbed out by the *procedure*. The record speaks loudly, but it speaks only about the institution's interaction with the subject, masquerading as the subject's life.

  ### Diagnostic Application

  To determine if a body of records exhibits Procedural Effacement, apply the **Slot Test**:

  1.  **Identify the Institutional Question:** What specific problem was this document created to solve? (e.g., Liability, Attendance, Taxation).
  2.  **Map the Slots:** What specific fields, columns, or questions exist to answer that problem?
  3.  **Check for Overflow:** Is there any physical or structural space in the document where information *outside* the Institutional Question could have been recorded, even if the creator chose not to write it?
      *   **If Yes:** Absence of personal data is a choice (Bias/Silence).
      *   **If No:** Absence of personal data is structural (**Procedural Effacement**).

  ### Contrast Cases

  **1. The False Positive (Looks like Effacement, but is not):**
  *   **Case:** A pauper's letter of appeal found in a parish chest.
  *   **Analysis:** The document is dense and personal. However, the form is unstructured (a letter). The writer *could* have written about anything. If they wrote only about their poverty, it is a rhetorical choice or a response to perceived expectations, not a structural constraint.
  *   **Verdict:** This is **Strategic Self-Presentation**, not Procedural Effacement. The "slots" were open.

  **2. The False Negative (Looks like Silence, but is Effacement):**
  *   **Case:** A workhouse admission ledger where a patient is listed only as "Male, 45, Labourer, Admitted 1762."
  *   **Analysis:** A historian might call this "sparse data" or "archival silence" regarding the man's identity. However, if the ledger's design *only* allowed for those four fields, and the clerk filled all four correctly, the record is administratively complete. The "silence" regarding his name, origin, or family is not a gap; it is a structural exclusion.
  *   **Verdict:** This is **Procedural Effacement**. The abundance of *other* entries (thousands of men listed similarly) confirms the system is working as designed, efficiently effacing individuality to manage the population.

  **3. The True Positive (Your Case):**
  *   **Case:** The Settlement Examination you described.
  *   **Analysis:** The document is pages long (High Density). It is verbatim (High Detail). But every sentence maps to "Movement," "Hiring," "Marriage," or "Residence" (Formulary Constraint). There is no margin, no "other observations" field, and the examiner is legally barred from recording irrelevant details (Teleological Filtering). The more precisely the examination establishes settlement, the less it reveals the pauper's interiority.
  *   **Verdict:** **Procedural Effacement.** The subject is buried under the success of the procedure.

  ### Why this fits your thesis
  Using **Procedural Effacement** allows you to make a methodological claim without accusing your sources of lying or your predecessors of incompetence. It shifts the blame from the *creator* (who did their job well) and the *historian* (who is reading carefully) to the *structure* of the record itself.

  It validates your intuition that counting "four thousand case files" does not equal "four thousand lives." It gives you the vocabulary to argue that the **abundance** of the poor-law archive is not a resource to be mined for biography, but a structure to be analyzed for its effacing power. You are not studying the paupers; you are studying the procedure that effaced them.

  ### Nearest Neighbor Critique
  *   **Legibility (Scott):** Use this to explain *why* the state created the records. Legibility is the *intent*; Procedural Effacement is the *archival residue*.
  *   **Archival Silence (Trouillot/Stoler):** Use this to describe what is *missing* from the archive entirely (e.g., the voices of those who never reached the examination). Procedural Effacement describes those who *are* there, but are structurally unintelligible as humans.

  This term provides the "carving" you need: it isolates the phenomenon, defines its boundaries, and offers a diagnostic tool for your methodology chapter.
