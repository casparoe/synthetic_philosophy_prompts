      *   *Move 3:* Alan distinguishes medical reasons (causal) from moral reasons (normative). Praiseworthiness requires right-making features. This aligns with Kantian/virtue ethics views on moral worth. Rating: Right.
      *   *Move 4:* Bea argues ordinary morality is unexamined. True. But Vance is in a *special role*. Humility vs. Abdication. Rating: Partly Right.
      *   *Move 5:* Alan focuses on the *deliberative* nature of the committee. Blind deference is dangerous. This is the clincher. Rating: Right.

      *   *Overall:* Alan is more right because he addresses the institutional context. Bea treats it like a general epistemological problem.
