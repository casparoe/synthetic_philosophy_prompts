      *   *Decision:* I need an example where the *intrinsic property* is the focus, not the system logic.
      *   *Let's use a **Spring-Loaded Mechanical Latch**.*
          *   *Disposition:* "Disposed to Snap Shut."
          *   *Stimulus:* Release the catch.
          *   *Naive:* If catch released -> Latch snaps.
