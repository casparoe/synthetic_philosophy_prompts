          *   *Mask:* Code writes 1, but current limiting circuit kicks in (disposition exists, manifestation blocked).
          *   *Fink:* Code writes 1, but a watchdog timer resets the register *before* the voltage rises (disposition removed).
          *   *Critique:* Still risks being seen as "bugs."
      *   *Best Selection:* **A Mechanical Emergency Brake (Spring-Apply, Hydraulic-Release).**
