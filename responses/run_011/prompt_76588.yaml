          *   *Mask:* Enable goes High, system is healthy, but the "Motor Disable" physical key is turned off. (The disposition to run is there, but an external blocker stops it).
          *   *Wait, let's simplify.* The user wants *one* artifact.
          *   *Let's try a **Thermal Cutoff (Thermal Fuse)** vs. **Active Cooling**.*
          *   *No, let's go with the User's suggestion but fix it:* **A Relay.** But specifically a *Latching Relay* controlled by a logic board.
          *   *Actually, the cleanest engineering analogy for Fink/Mask is **Exception Handling / Interrupts**.* But the PM needs physical.
          *   *Okay, the "Magic Box" approach:* **A Voltage Regulator with Current Limit.**
          *   *Disposition:* "Disposed to output 5V."
          *   *Naive:* If load connected -> 5V output.
          *   *Mask:* Load connected, regulator tries to output 5V, but current limit hits (voltage drops). The *disposition* (internal reference) is there, but masked by the limit.
          *   *Fink:* Load connected, regulator detects short, shuts down reference entirely. Disposition gone.
