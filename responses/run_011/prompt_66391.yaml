prompt: |-
  ok so — I'm a third year doing physics with a philosophy minor, and this semester I'm in a modal epistemology seminar. We've just done three weeks on whether conceivability is a guide to possibility: Chalmers on something being conceivable on a first pass vs. it surviving ideal reflection, Yablo's idea that imagining gives you evidence that can get undercut when you look harder, and Kung's split between the qualitative content of what you actually picture and the stuff you just stipulate on top of it. Its all very good but I couldn't see it biting on anything real, and then it turns out it does, in a place I wasn't expecting.

  Since September I've been interning two days a week in the first-pass screening group at a patent office. Mostly mechanical and energy-related applications. My job is to read the application and write a one-paragraph recommendation on whether the thing could possibly work as described, which a senior examiner then signs off on. I get through about 25 a week with 20-25 minutes each, no lab access, no search budget, and I'm not a lawyer. My supervisor says that where a claim looks physically impossible we can ask the applicant to supply a working model, but that request is expensive for everyone and gets appealed, so I'm not supposed to recommend it just because something strikes me as weird.

  Here's what I want. Take on the role of a philosopher who works on modal epistemology and who has also done real consulting work turning theory into procedures for non-specialists — someone who knows what gets lost in translation. Think carefully. Before the procedure itself, spend some space brainstorming which pieces of the conceivability literature could survive contact with a 25-minute screening slot and which ones have to be thrown out, and say what you're dropping and why. Then give me the procedure: the ordered questions I ask of each application, what counts as a sufficient answer to each, the exits available (pass to full examination / send back for more detail / recommend a working-model request / refer upward to someone else) and what triggers each. Also tell me which exits aren't mine at all because they're questions of policy or proportionality rather than questions about what's possible.

  The thing it has to get right is the direction of the guide. My physics training makes me want to reject anything that smells like free energy, and I'm pretty sure "I can't see how this would work" is doing illegitimate work in my head. So the procedure has to be explicit about what it licenses and what it doesn't: my guess is that it can only ever support a "this can't work" recommendation when I can actually derive a problem from the description as written, and not when the description is just too thin for me to picture anything. Those feel like they should be different exits and I have no idea how to keep them apart under time pressure.

  Then run it on three applications I've got this week. Details are roughly right, identifying stuff changed:

  1. A tabletop device with a flywheel, permanent magnets and a lever arm. The applicant has helpfully included an energy balance for one full cycle, and his own numbers don't balance — 100 J in, 138 J out — with the surplus attributed to "the geometry of the magnetic circuit". I can see exactly how it's meant to move, and I can also see exactly where the arithmetic goes.

  2. Claims net electrical output from a "resonant coupling to the ambient quantum vacuum via a novel lattice configuration". Sixty pages, lots of detailed drawings of the enclosure and the wiring, not one equation, no composition for the lattice, no account of where the energy comes from. I can't find a contradiction in it, but mostly because there's hardly anything there to contradict.

  3. A copper-tin alloy, processed in a stated sequence of steps, claimed to carry current with no measurable resistance at room temperature. Full composition, full processing route, described measurement setup, and nothing in it that violates any conservation law or any physics I know. It's just that literally every physicist I've met would laugh at it, and I want to reject it.

  Be honest in a final section about what the procedure can't do: the kinds of impossibility it will miss, the places where it leans on my knowing less physics than the applicant does, and which steps are really just my own judgment wearing a procedural costume. Please no citations, no bibliography, no reading list — I can't look anything up and I've already done the seminar readings.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** 3rd-year Physics major, Philosophy minor. Currently in a Modal Epistemology seminar (Chalmers, Yablo, Kung). Interning at a Patent Office (screening group, mechanical/energy).
      *   **Task:** Create a procedural guide for screening patent applications based on modal epistemology (conceivability $\to$ possibility), tailored to a 25-minute limit, no lab access, no legal authority.
      *   **Role:** Philosopher-consultant who bridges theory and practice (knows what gets lost in translation).
      *   **Key Constraint:** Must distinguish between "I can't imagine it" (epistemic limitation) and "It contradicts known physics" (modal impossibility). Must handle three specific test cases.
      *   **Output Requirements:**
          1.  Brainstorming: What theory survives the 25-minute constraint? What gets dropped?
          2.  The Procedure: Ordered questions, sufficiency conditions, exit triggers.
          3.  Application: Run the procedure on the three provided cases.
          4.  Honesty Section: Limitations, biases, where judgment masquerades as procedure.
          5.  **Negative Constraint:** No citations, no bibliography, no reading list.

  2.  **Deconstruct the Philosophical Problem (Modal Epistemology in Practice):**
      *   *Chalmers:* Ideal positive conceivability implies primary possibility. But "ideal reflection" takes forever.
      *   *Yablo:* Imagination provides defeasible evidence. It can be undercut.
      *   *Kung:* Distinguish qualitative content (what you see) from stipulative content (what you're told).
      *   *The Patent Context:* The goal isn't truth; it's risk management. Is it *obviously* impossible? The burden of proof is on the applicant, but the examiner's burden is to justify rejection.
      *   *The Trap:* Confusing *inconceivability for me* (due to time/knowledge limits) with *inconceivability in principle* (violates laws of nature).
      *   *The Solution:* Shift from "Can I imagine this working?" to "Does the description entail a contradiction with established constraints?"

  3.  **Brainstorming: Theory vs. Time (25 Minutes):**
      *   *Drop:* Chalmers' "Ideal Reflection." I don't have ideal conditions. I have 25 minutes and a coffee stain.
      *   *Drop:* Deep metaphysical possibility. I care about *nomological* possibility (consistent with actual laws of physics), not logical possibility.
      *   *Keep:* Yablo's "Defeasibility." My initial impression is evidence, not proof. It needs checking.
      *   *Keep:* Kung's "Stipulation vs. Qualitative." Is the applicant asking me to *imagine* a mechanism (qualitative) or just *assert* a result (stipulative)?
      *   *Keep:* The distinction between *epistemic* (I don't know how) and *alethic* (It can't be).
      *   *New Concept:* "Local Incoherence." Does the text contradict itself or basic conservation laws *within the text's own framework*?

  4.  **Developing the Procedure:**
      *   Need a funnel. Start cheap (reading), end expensive (rejection).
      *   *Step 1: The Stipulation Check (Kung).* Are they describing a mechanism or just a miracle?
      *   *Step 2: The Internal Consistency Check.* Do the numbers add up? (Case 1).
      *   *Step 3: The External Constraint Check.* Does it violate a hard law (Conservation of Energy, Thermodynamics)?
      *   *Step 4: The Epistemic Gap Check.* Is my confusion due to missing info or physical impossibility?
      *   *Exits:*
          *   Pass to Full Exam (No obvious red flags).
          *   Send Back for Detail (Stipulative, missing mechanism).
          *   Recommend Working Model (Specific physical claim that contradicts norms but isn't mathematically disproven *in text*).
          *   Refer Upward (Policy/Legal/High-stakes physics).
      *   *Policy vs. Possibility:* Deciding whether to waste the applicant's money on a model is policy. Deciding if the text describes a perpetual motion machine is possibility.

  5.  **Running the Test Cases:**
      *   *Case 1 (Flywheel/Magnets):* Numbers don't balance. Applicant admits surplus. This is an internal contradiction + violation of Conservation of Energy.
          *   *Verdict:* Recommend Rejection/Working Model (strong evidence of impossibility).
      *   *Case 2 (Quantum Vacuum):* Lots of drawings, no equations, no mechanism. "Quantum vacuum" is a buzzword here. Stipulative content high, qualitative content low.
          *   *Verdict:* Send Back for Detail (Insufficient disclosure/Enablement). It's not necessarily impossible, just undescribed.
      *   *Case 3 (Room Temp Superconductor):* Plausible mechanism, no law violated, just improbable.
          *   *Verdict:* Pass to Full Exam. My skepticism is sociological, not modal.

  6.  **Drafting the Honesty Section:**
      *   Admit that "Established Physics" is a moving target.
      *   Admit that 25 minutes forces heuristics (biases).
      *   Admit that "Working Model" requests are often just "I don't believe you" disguised as procedure.
      *   Acknowledge the "Laugh Test" (Case 3) is dangerous.

  7.  **Refining Tone:**
      *   Professional, empathetic to the intern's position.
      *   Philosophical but pragmatic.
      *   No academic fluff (no citations).
      *   Clear structure.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I distinguish between "I can't picture it" and "It violates physics"? Yes, that's the core of the Kung/Yablo adaptation.
      *   *Check:* Did I address the "Policy vs. Possibility" constraint? Yes, need to make sure the "Working Model" exit is flagged as policy-heavy.
      *   *Check:* Is the advice actionable? The steps need to be concrete questions.
      *   *Check:* Did I avoid the reading list? Yes.
      *   *Check:* Case 3 is the trickiest. Physics says "impossible" (practically), but modal logic says "conceivable." I need to ensure the procedure doesn't reject based on "everyone laughs." It must pass to full exam where a specialist with more time/search budget can dig.

  9.  **Final Polish:** Ensure the distinction between *nomological* impossibility (laws of nature) and *epistemic* uncertainty (lack of info) is sharp. This is the user's main anxiety.

  *(Self-Correction on Case 1)*: The user says "recommendation on whether the thing could possibly work." If the numbers don't balance *in the application*, that's a formal error. But if they claim 138J out from 100J in, that's a Perpetual Motion Machine of the First Kind. That's a hard "No."
  *(Self-Correction on Case 2)*: This is "Black Box" magic. Kung's stipulation vs. qualitative is perfect here. They stipulate output, don't qualify the process.
  *(Self-Correction on Case 3)*: This is the "Extraordinary Claim." Modal epistemology says it's possible (conceivable), but priors are low. The procedure shouldn't kill it, but flag it.

  10. **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  This is a classic case of theory meeting friction. You are standing exactly where epistemology becomes administration. In the seminar, "possibility" is a metaphysical category; in the patent office, "possibility" is a risk assessment. If you reject a viable invention, you stifle innovation (and get appealed). If you pass an impossible one, you waste the office's resources and damage credibility.

  Your intuition is correct: "I can't see how this works" is an epistemic failure on your part, not a modal fact about the world. But "This description entails a violation of conservation of energy" is a modal fact (given our current best physics). The procedure below is designed to separate those two states under time pressure.

  ### Part 1: Theoretical Triage (What Survives 25 Minutes)

  We need to strip the seminar readings down to tools that function as checklists. Here is what gets dropped and what gets kept.

  **Dropped: Chalmers' "Ideal Reflection."**
  You do not have the luxury of ideal conditions. You have 25 minutes, no search engine, and fatigue. You cannot determine if something is *ideally* conceivable. You can only determine if it is *currently* coherent. Drop the search for primary possibility; stick to nomological possibility (consistency with actual laws of physics).

  **Dropped: Pure Intuition as Evidence.**
  In the seminar, a strong imaginative push might count as prima facie evidence. Here, your "gut feeling" that something is weird is admissible only as a trigger for scrutiny, never as a conclusion. Your physics training gives you strong priors, but priors are not proofs.

  **Kept: Kung's Qualitative vs. Stipulative Distinction.**
  This is your most vital tool. You need to check if the applicant is asking you to *visualize* a mechanism (qualitative content) or simply *accept* a result (stipulative content). If the application is 90% stipulation ("it produces energy") and 10% qualitative ("wires go here"), it fails the conceivability test not because it's impossible, but because it's unintelligible.

  **Kept: Yablo's Defeasibility.**
  Treat your initial reading as a hypothesis. "This looks like a perpetual motion machine." That hypothesis must be actively undercut by the text to pass. If the text does not undercut the impossibility hypothesis, the hypothesis stands. But—and this is crucial—if the text is silent, the hypothesis is *not* confirmed; it is just unchallenged. Silence is not proof of impossibility.

  **Added: Internal vs. External Incoherence.**
  We need to split "impossible" into two buckets.
  1.  **Internal Incoherence:** The application contradicts itself (e.g., numbers don't balance, parts occupy the same space).
  2.  **External Incoherence:** The application contradicts established physical laws (e.g., claims energy from nowhere).
  Internal incoherence is easier to prove in 25 minutes. External incoherence requires you to be sure the law is unbreakable.

  ---

  ### Part 2: The Screening Procedure

  **Time Budget:** 25 Minutes
  **Goal:** Filter for *demonstrable* impossibility, not *probable* failure.

  #### Step 1: The Stipulation Audit (Minutes 0–5)
  **Question:** Does the text describe *how* the result occurs, or only *that* it occurs?
  *   **Action:** Highlight all claims of output (energy, motion, signal). Trace them back to a described mechanism.
  *   **Sufficient Answer:** Every claimed output is linked to a specific physical interaction described in the text (e.g., "magnetic field interacts with coil," not "lattice resonates").
  *   **Trigger:** If >50% of the claimed effect relies on phrases like "configured to," "adapted to," or "via novel interaction" without describing the interaction:
      *   **Exit A: Send Back for Detail.** (Reason: Insufficient disclosure/enablement. This is not a physics rejection; it's a paperwork rejection.)

  #### Step 2: The Internal Consistency Check (Minutes 5–15)
  **Question:** Do the numbers and descriptions within the document contradict each other?
  *   **Action:** Check energy balances, force vectors, or signal flows provided in the text. Look for explicit admissions of surplus.
  *   **Sufficient Answer:** The inputs and outputs described in the text balance, or the discrepancy is explicitly acknowledged as an efficiency loss, not a gain.
  *   **Trigger:** If the application's *own* numbers show output > input without an identified source:
      *   **Exit B: Recommend Rejection / Working Model.** (Reason: Internal Incoherence. The applicant has demonstrated the impossibility themselves.)

  #### Step 3: The External Constraint Check (Minutes 15–20)
  **Question:** Does the described mechanism explicitly violate a conservation law or a hard physical constraint?
  *   **Action:** Compare the mechanism from Step 1 against the "Hard List" (Conservation of Energy, Conservation of Momentum, Second Law of Thermodynamics, Causality).
  *   **Sufficient Answer:** The mechanism operates within known constraints (e.g., draws power from a battery, dissipates heat).
  *   **Trigger:** If the mechanism *requires* a violation to function (e.g., "magnets provide infinite torque," "vacuum supplies net energy"):
      *   **Exit C: Recommend Rejection.** (Reason: Nomological Impossibility.)
  *   **Crucial Caveat:** If the mechanism is *unclear* but doesn't explicitly violate a law, do **not** take this exit. Unclear $\neq$ Impossible.

  #### Step 4: The Epistemic Gap Check (Minutes 20–25)
  **Question:** Is my confusion due to missing information or physical impossibility?
  *   **Action:** Ask yourself: "If I had a PhD in this specific sub-field and 3 days to read this, would I find a contradiction?"
  *   **Sufficient Answer:** You can point to a specific sentence that is wrong.
  *   **Trigger:** If you simply "don't see how it works" but cannot point to a violation:
      *   **Exit D: Pass to Full Examination.** (Reason: Epistemic Limitation. You lack the specific knowledge to rule it out, so it must be treated as possible.)

  #### Policy vs. Possibility Exits
  *   **Working Model Request (Exit B variant):** This is a **Policy** decision, not a modal one. You are saying, "I cannot verify this theoretically, so shift the burden of proof to physical demonstration." Only use this if the claim is extraordinary but not internally contradictory. Do not use this for things that are merely weird.
  *   **Referral Upward:** If an application passes Step 3 but makes a claim that would upend the field (e.g., Case 3), this is a **Proportionality** decision. It's not your job to judge the impact, but you may flag it for a senior examiner with more physics background.

  ---

  ### Part 3: Running the Procedure

  Here is how the procedure handles your three current applications.

  **Application 1: The Flywheel/Magnet Device**
  *   **Step 1 (Stipulation):** Mechanism is described (magnets, lever, flywheel). Qualitative content is high. Pass.
  *   **Step 2 (Internal Consistency):** Applicant provides energy balance. 100 J in, 138 J out. Surplus attributed to "geometry."
      *   *Result:* **Fail.** The document contradicts itself regarding conservation. The applicant admits the surplus.
  *   **Step 3 (External Constraint):** Violates Conservation of Energy.
  *   **Decision:** **Exit B (Recommend Rejection/Working Model).**
  *   **Why:** This is the cleanest case. The impossibility is derived from the text itself. You aren't saying "magnets can't do that"; you are saying "your arithmetic says you get more than you put in." That is a demonstrable error within the four corners of the document.

  **Application 2: The Quantum Vacuum Resonator**
  *   **Step 1 (Stipulation):** 60 pages of drawings, no equations. "Novel lattice configuration" is stipulative. "Resonant coupling" is qualitative but undefined.
      *   *Result:* **Fail.** High stipulation, low qualitative content. We know what the box looks like, not what it *does*.
  *   **Step 2 (Internal Consistency):** No numbers to contradict.
  *   **Step 3 (External Constraint):** "Energy from vacuum" usually violates thermodynamics, but since no mechanism is described, you can't prove the violation. You can't contradict a ghost.
  *   **Decision:** **Exit A (Send Back for Detail).**
  *   **Why:** Do not reject on physics. Reject on disclosure. You cannot assess possibility because the application does not describe a process, only a result. This uses Kung's distinction: they are asking you to stipulate the result without providing the qualitative content to conceive it.

  **Application 3: The Room-Temperature Superconductor**
  *   **Step 1 (Stipulation):** Full composition, full processing. Qualitative content is high. Pass.
  *   **Step 2 (Internal Consistency):** No internal contradictions.
  *   **Step 3 (External Constraint):** Does not violate conservation laws. Superconductivity is physically possible; room temperature is just a material science hurdle, not a law of nature.
  *   **Step 4 (Epistemic Gap):** You want to reject because "physicists would laugh." This is sociological evidence, not modal evidence.
  *   **Decision:** **Exit D (Pass to Full Examination).**
  *   **Why:** Your physics training tells you the *prior probability* is near zero. But modal epistemology tells you it is *conceivable* and *nomologically possible*. To reject this, you would need to find a specific reason why *this* alloy fails (e.g., "tin melts at 232°C, so it can't hold a lattice at room temp"). If you can't find that specific contradiction, you must pass it. Your skepticism is a job for the search examiner, not the screening filter.

  ---

  ### Part 4: The Honesty Section (What This Procedure Cannot Do)

  You asked for honesty about where the procedure leans on you knowing less physics than the applicant, and where judgment wears a costume. Here it is.

  **1. The "Hard List" is Soft.**
  Step 3 relies on you knowing which laws are unbreakable. In 2024, Conservation of Energy is safe. But "no room-temperature superconductivity" is not a law; it's a historical trend. The procedure protects you from rejecting Case 1, but it forces you to accept Case 3. If Case 3 is a fraud, you have just passed it. The procedure cannot distinguish between "breakthrough" and "delusion" when both are physically consistent. It only distinguishes between "consistent" and "contradictory."

  **2. The Time Limit Forces Heuristics.**
  Twenty-five minutes is not enough to truly apply Yablo's defeasibility. You will inevitably rely on pattern recognition ("This looks like a magnet motor I saw last month"). That is bias. The procedure calls it "Internal Consistency," but in practice, it's often "Does this match my mental template of a working machine?" You will miss impossibilities that require complex math to uncover. You are screening for *blatant* errors, not *subtle* ones.

  **3. The "Working Model" Trap.**
  When you recommend a working model (Exit B), you are effectively saying, "I cannot conceive of this working, so you prove it." This is where your epistemic limitation becomes a bureaucratic burden. You are shifting the cost of your inability to imagine the mechanism onto the applicant. This is procedurally valid, but philosophically aggressive. It treats your current conceivability as the boundary of possibility.

  **4. The "Laugh Test" is Unavoidable.**
  In Case 3, I told you to pass it. But in reality, if you pass ten of those a week, your supervisor will notice. You will feel pressure to find a reason to reject. You might start interpreting "no measurable resistance" as "violates thermodynamic noise limits" even if the text doesn't say that. The procedure cannot stop you from smuggling your skepticism into the "External Constraint" check. You have to police your own desire to be the gatekeeper of "real" physics.

  **5. Conceivability is not Possibility.**
  Finally, remember the seminar lesson you started with. Even if an application passes all these checks, even if it is perfectly conceivable and consistent, it might still be impossible in the real world due to factors not listed (material impurities, quantum decoherence, etc.). You are not certifying truth. You are certifying that the text does not *self-destruct*.

  Use the procedure to protect yourself from claiming impossibility where there is only ignorance. But do not pretend it makes you a oracle of what can exist. It only makes you a auditor of what has been written.
