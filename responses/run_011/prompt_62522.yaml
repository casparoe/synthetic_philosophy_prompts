  **Joke 1: The Lemma**

  Alex is staring at a blank sheet of paper at 2 PM. Blair walks by.

  **Blair:** "Why aren't you working on Lemma 2? The deadline is tomorrow."
  **Alex:** "I know that at 4 AM, my credence that 'Lemma 2 is trivial' will be 1."
  **Blair:** "Because you'll be three days into a deadline bender and hallucinating."
  **Alex:** "Exactly. But Van Fraassen says my current credence in 'Lemma 2 is trivial', conditional on my future credence being 1, must be 1."
  **Blair:** "So you're going to write the proof?"
  **Alex:** "No. If I'm already certain it's trivial, writing it out is just redundant. I'm saving us all time."
  **Blair:** "You're not going to prove it?"
  **Alex:** "I'm not procrastinating, Blair. I'm just deferring to the expertise of my future delirious self."

