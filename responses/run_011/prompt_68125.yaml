  2.  **Analyze Scharpf's Framework:**
      *   *Input Legitimacy:* Government by the people. Participation, accountability, identity, *demos*. Usually tied to the nation-state in Scharpf's earlier work.
      *   *Output Legitimacy:* Government for the people. Effectiveness, problem-solving, welfare. Can be supranational if it delivers results the nation-state can't.
      *   *Scharpf's View on EU:* He generally argues the EU lacks the *demos* for strong input legitimacy, so it must rely on output legitimacy. If output fails, legitimacy collapses.
      *   *The "Joint-Decision Trap":* Scharpf also wrote about how consensus systems lead to lowest-common-denominator outcomes or rigidity.

  3.  **Apply to Greece 2015:**
      *   *Greece (Syriza):* High Input Legitimacy (election, referendum). Low Output Legitimacy (couldn't secure funding, economy collapsing, capital controls).
      *   *Creditors (Troika/Eurogroup):* Low Input Legitimacy (technocratic, distant, no direct election by Greeks). Claimed High Output Legitimacy (saving the Euro, preventing contagion).
      *   *The Conflict:* The creditors prioritized Eurozone-wide output over Greek input.

  4.  **Evaluate the "Level Mismatch":**
      *   *User's Hypothesis:* Input is national, Output is supranational. They don't meet in a single calculation.
      *   *Analysis:* Scharpf acknowledges the EU is a *derived* legitimacy system. National parliaments legitimize the Council. But in 2015, the Council (Eurogroup) overrode a national referendum.
      *   *Is it just Democratic Deficit?* "Democratic Deficit" usually implies "not enough democracy." "Level Mismatch" implies "democracy exists, but at the wrong scale for the problem." Scharpf's framework *does* account for scale (functional vs. political boundaries), but it assumes output legitimacy *compensates* for lack of input. In Greece, the output (austerity) was perceived as negative *for the input providers* (Greek voters), even if positive for the system (Eurozone).
      *   *Verdict on Mismatch:* It's not just a rename. It highlights a structural flaw in Scharpf's trade-off assumption. Scharpf assumes output *can* buy legitimacy. In 2015, output for the *system* destroyed legitimacy for the *unit*.

  5.  **Identify Where the Framework Goes Quiet:**
      *   *The Referendum:* Scharpf focuses on institutions (Parliament, Council). A direct plebiscite against an international agreement isn't standard in his institutional design. It creates a "double input" claim (National Parliament + Direct Vote) vs. International Treaty obligations.
      *   *Threat of Exit (Grexit):* Scharpf's framework assumes membership is stable. Coercion via exit threat is a power move, not a legitimacy argument. It's raw power (Realpolitik) masquerading as output legitimacy ("We save the Euro").
      *   *The Relevant Public:* Who is the "people" in "government for the people"? Greeks? Europeans? Scharpf struggles with the *European Demos*. The crisis showed the "public" is fragmented. The framework doesn't have a variable for *conflicting publics*.

  6.  **Formulate the Verdict:**
      *   *Confirm?* No, because the trade-off didn't work. Output didn't save legitimacy.
      *   *Stress?* Yes, it stretches the input/output trade-off.
      *   *Never built to handle?* Closer to the truth. Scharpf's model assumes a benevolent technocracy can deliver output that is generally accepted. It doesn't account for *distributional conflict* disguised as technical necessity. It treats the EU as a regulatory state, not a fiscal/political union with winners and losers.
      *   *Honest Answer:* It's a case the framework was never built to handle. Scharpf's model is too functionalist. It assumes problems are technical (solved by experts) rather than political (distribution of pain). Greece 2015 was deeply political.

