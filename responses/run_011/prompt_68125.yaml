prompt: |-
  Okay so the episode is Greece in 2015 — Syriza elected in January on an anti-austerity mandate, months of deadlock with the creditors, capital controls and a bank holiday at the end of June, then the July 5 referendum where about 61 percent voted No to the creditors' proposal, Varoufakis out the next morning, and a third programme signed within weeks on terms harsher than the one that had just been rejected.

  I want you to run that through Scharpf's input/output legitimacy distinction rather than through the usual democratic-deficit complaint. What does the framework actually predict here? The creditors could say they were defending output legitimacy for the eurozone as a whole — no breakup, no contagion, rules kept — against an input-legitimacy claim from one member state's voters. Is that a coherent use of the distinction, or does it show something is missing from it? Because I keep ending up with a thing I've started calling the level mismatch: input legitimacy gets generated at one level of the polity and output legitimacy gets scored at another, so the two never actually meet in a single calculation. Tell me whether that's just the democratic deficit renamed, or whether it's a variable Scharpf's setup can't express, and then be honest about where the framework goes quiet — what it can't say about the referendum itself, about the threat of exit, or about who gets to count as the relevant public.

  Finally: does this episode confirm the framework, stress it, or is it a case the framework was never built to handle? I'd rather have a straight answer than a diplomatic one.
reasoning: |-
