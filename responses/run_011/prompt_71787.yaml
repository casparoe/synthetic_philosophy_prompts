  # JOINT STATEMENT ON THE SOCIALIST CALCULATION DEBATE
  **Date:** October 24, 2023
  **Parties:** Economist A (Mises–Hayek Position), Economist B (Lange–Lerner Position)
  **Subject:** Adversarial Collaboration Outcome regarding Economic Calculation under Public Ownership

  ## 1. Agreed Claims

  The undersigned parties endorse the following propositions as the baseline for further inquiry. These claims represent the intersection of our theoretical models and historical assessments.

  1.  **Formal Determinacy:** Given a fixed set of consumer preferences, available resources, and technological production functions, a general equilibrium price vector and allocation exist mathematically as a solution to a system of simultaneous equations.
      *   *Note:* A signs this acknowledging that the *logical* existence of a solution is not denied, only the *epistemic access* to the data required to solve it. (Damaging to A: Concedes the static mathematical possibility often used to refute Mises's "impossibility" claim).
  2.  **Price Function:** In any complex economy, a price vector serves to summarize relative scarcities and coordinate decentralized decisions, reducing the dimensionality of information required by any single agent to make a local choice.
  3.  **Computational Tractability:** If the relevant data (preferences, technologies, resource stocks) were fully codified and transmitted to a central unit, modern computational machinery could solve the allocation problem faster than a market tâtonnement process could converge.
  4.  **Historical Record:** No twentieth-century command economy achieved the allocative efficiency, innovation rate, or consumer sovereignty characteristic of advanced mixed-market economies during the same period.
      *   *Note:* B signs this acknowledging that historical performance is a valid data point against the Lange model's practical viability. (Damaging to B: Concedes the empirical failure of actual socialist regimes, limiting the defense to "counterfactual implementation").
  5.  **Information Transmission Costs:** Transmitting information from local agents to a center incurs costs in time, bandwidth, and fidelity, and agents may have incentives to misreport this information regardless of the ownership regime.
  6.  **Investment Politicization:** As Lerner anticipated, the allocation of net investment funds under a Central Planning Board (CPB) is structurally vulnerable to political pressure rather than pure yield maximization, absent specific institutional firewalls which have not yet been demonstrated at scale.
  7.  **Market Interaction:** The historical performance of command economies was partially propped up by the ability to import price signals and goods from the world market, obscuring the internal calculation problem.

  ## 2. Disagreements

  The following table catalogs the remaining divergences. We distinguish between verbal disputes (terminology), conceptual disputes (underlying models of reality), and empirical disputes (testable predictions).

  | Disagreement | A's Formulation (Mises–Hayek) | B's Formulation (Lange–Lerner) | Classification | Underlying Substantive Question |
  | :--- | :--- | :--- | :--- | :--- |
  | **Nature of Price** | Prices are emergent phenomena arising only from actual exchanges of private property titles; they cannot be "announced." | Prices are parameters that can be administratively set to clear markets; ownership title is secondary to control rights. | Conceptual | Is price an ontological category of exchange or an informational signal of scarcity? |
  | **Knowledge Type** | Relevant knowledge is largely tacit, contextual, and inarticulable; it cannot be transmitted to a center without loss. | Relevant knowledge can be codified into data (cost curves, inventory levels) sufficient for optimization; tacit elements are negligible margins. | Empirical | What proportion of economically relevant knowledge is non-codifiable? |
  | **Incentive Compatibility** | Without residual claimancy (profit/loss), managers will not minimize costs or innovate; rules are gameable. | Incentive structures (promotion, bonuses, social duty) can be designed to align manager behavior with CPB rules without private equity. | Empirical | Can non-property incentives sustain high-fidelity effort and honesty over time? |
  | **Definition of "Possible"** | "Impossible" means rational calculation cannot occur without private property in capital goods; it is a praxeological law. | "Possible" means a superior or equal allocation can be achieved via simulation; it is an engineering challenge. | Verbal/Conceptual | Does "rational calculation" require actual exchange or merely correct allocation outcomes? |
  | **Innovation Source** | Innovation requires entrepreneurial judgment bearing uncertainty, which implies private ownership of the upside. | Innovation can be directed via R&D budgeting and shadow pricing of potential goods by the CPB. | Conceptual | Can uncertainty be reduced to risk and priced administratively? |

  ## 3. Cruxes and Pre-registered Predictions

  We identify four sub-questions where resolution would shift our confidence. For the first two, we stipulate a neutral simulation environment.

  ### 3.1 The Simulation Setup (20-Period Episode)
  **Neutral Formal Idiom:**
  *   **Economy:** Closed system, $T=1$ to $20$. $N$ agents, $M$ goods.
  *   **State:** At $t$, state $S_t$ includes resource stocks and technology set.
  *   **Information:** Agents hold information sets $I_{i,t}$. Center holds $I_{C,t}$.
  *   **Shocks:**
      1.  **Preference Shift ($t=5$):** Utility function for Good X doubles relative to Good Y.
      2.  **Input Loss ($t=10$):** Availability of Imported Input Z drops by 50%.
      3.  **New Good ($t=15$):** Technology for Good W becomes feasible; no historical demand data exists.
  *   **Metrics:** $L$ (Lag to efficient allocation), $W_{loss}$ (Cumulative welfare loss during adjustment), $\Delta I$ (Information volume required to adjust).

  **Audit of Setup Stipulations:**
  *   *Stipulation:* "Agents possess information sets $I_{i,t}$."
      *   *Contest:* A argues this implies knowledge is already formed/packetized.
      *   *Neutral Replacement:* "Agents possess access to contextual cues $C_{i,t}$ which may or may not be translatable into transmittable data."
  *   *Stipulation:* "Efficient allocation."
      *   *Contest:* A argues efficiency is unknowable ex-ante without market discovery.
      *   *Neutral Replacement:* "Ex-post Pareto improvement relative to the realized preference map at $t=20$."
  *   *Stipulation:* "Center collects $\Delta I$."
      *   *Contest:* B argues center only needs aggregate excess demand, not raw data.
      *   *Neutral Replacement:* "Center receives message space $M_t$ from agents."

  ### 3.2 Crux Predictions

  **Crux 1: Computation vs. Knowledge Generation**
  *   *Question:* If measurement and computation are costless, does the calculation problem vanish?
  *   *A's Prediction:* No. Even with costless computation, the input data ($I_{i,t}$) does not exist in a transmittable form until the act of exchange occurs. The market *generates* the data; it does not just process it.
  *   *B's Prediction:* Yes. If computation and transmission are costless, the CPB can replicate the market outcome perfectly. The problem is purely frictional.
  *   *Bearing Argument:* The "New Good" shock ($t=15$).
  *   *Scoring:* If Good W is produced and allocated efficiently in the CPB model without prior market exchange, B scores a point. If Good W is ignored or misallocated until a black market emerges, A scores a point.

  **Crux 2: Shadow Prices for Non-Existent Goods**
  *   *Question:* Can a product that does not yet exist have a shadow price?
  *   *A's Prediction:* No. Shadow prices require marginal valuation of existing stocks. A new good requires entrepreneurial judgment, which is a residual claim on uncertainty, not a shadow price on known constraints.
  *   *B's Prediction:* Yes. The CPB can assign a shadow price based on estimated utility functions and R&D costs, iterating based on trial adoption rates.
  *   *Bearing Argument:* The "New Good" shock ($t=15$).
  *   *Scoring:* Measure time-to-adoption for Good W. A predicts CPB adoption lag $> 2 \times$ Market adoption lag.

  **Crux 3: Incentives and Political Capture**
  *   *Question:* Can the CPB investment function be insulated from politics?
  *   *A's Prediction:* No. Without private owners to absorb losses, investment decisions become political contests for resources.
  *   *B's Prediction:* Yes. Mechanism design (e.g., randomized auditing, performance bonds) can align incentives sufficiently.
  *   *Bearing Argument:* Investment allocation efficiency during Input Loss ($t=10$).
  *   *Scoring:* Measure $W_{loss}$ during $t=10$ to $t=15$. If CPB retains inefficient plants due to employment pressure, A scores.

  **Crux 4: The Firm-Boundary Case**
  *   *Question:* Why is administrative allocation inside a firm possible, but not across an economy?
  *   *A's Prediction:* Firms operate within an external market price system that disciplines their internal calculation. A firm expands until the cost of internal organization exceeds the cost of using the market.
  *   *B's Prediction:* The economy is simply a "firm of firms." If internal planning works for GM, it works for the USA, provided computational scale is managed.
  *   *Bearing Argument:* Scaling of $W_{loss}$ as $N$ (number of agents) increases.
  *   *Scoring:* If $W_{loss}$ scales linearly for Markets but exponentially for CPB as $N$ increases, A scores.

  ## 4. Falsification Schedule

  **Economist A (Mises–Hayek)**
  *   **Falsifying Condition:** The observation of a sustained period (minimum 10 years) in a large, closed economy with public ownership of capital goods where: (1) No black market for capital goods exists; (2) Resource allocation errors (chronic shortages/surpluses) are statistically indistinguishable from comparable market economies; (3) Innovation rates match market benchmarks.
  *   **Addressing "Unfalsifiable":** A acknowledges that "impossible" is often treated as a logical truth immune to data. A agrees to treat it as a strong empirical claim: If the above condition is met, the praxeological deduction regarding the necessity of property titles for calculation is incorrect.
  *   **B's Verification:** B confirms this observation is in principle available.

  **Economist B (Lange–Lerner)**
  *   **Falsifying Condition:** A formal proof or empirical demonstration that the information required to solve the CPB optimization problem exceeds the physical channel capacity of the communication network (including human language) *even when* agents are incentivized to report truthfully, OR that incentive-compatible mechanisms for truthful reporting are mathematically impossible under public ownership.
  *   **A's Verification:** A confirms this is in principle available, noting that the "tacit knowledge" argument is the primary candidate for this proof.

  ## 5. Verbal Residue

  Upon reviewing the year's exchange, we isolate the following semantic disputes that, once clarified, reveal the substantive core.

  1.  **"Calculation" vs. "Computation":**
      *   *Dispute:* B uses "calculation" to mean solving equations. A uses "calculation" to mean the valuation of capital goods via exchange.
      *   *Resolution:* We agree to use "Computation" for mathematical solving and "Economic Calculation" for the valuation process.
      *   *Residue:* Whether Economic Calculation *requires* private exchange or can be simulated by Computation.

  2.  **"Possible" vs. "Rational":**
      *   *Dispute:* B argues socialism is "possible" if it can feed the population. A argues it is "irrational" if it cannot demonstrate efficiency via profit/loss.
      *   *Resolution:* We agree "Possible" refers to physical survival; "Rational" refers to allocative efficiency relative to opportunity costs.
      *   *Residue:* Whether a system can be Rational without private property signals.

  3.  **"Data" vs. "Knowledge":**
      *   *Dispute:* B assumes knowledge can be reduced to data. A assumes data is a subset of knowledge.
      *   *Resolution:* We acknowledge the gap between codifiable data and tacit knowledge.
      *   *Residue:* The quantitative magnitude of the tacit component in macro-allocation.

  **Substantive Core Remaining:**
  Once verbal padding is removed, the disagreement rests on a single empirical and theoretical pivot: **Is the price system a mechanism for transmitting existing information (B's view), or is it a mechanism for generating information that does not otherwise exist (A's view)?**

  If prices transmit, the CPB can substitute with sufficient bandwidth. If prices generate, the CPB cannot substitute, regardless of bandwidth. This document records our agreement to test this specific proposition via the Cruxes outlined in Section 3.

  ***

  **Signed:**

  _________________________
  **Economist A**

  _________________________
  **Economist B**
