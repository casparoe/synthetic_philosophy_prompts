answer: |-
  **Question 4**

  Consider a masked priming study investigating consciousness. Six letters flash for 50ms in a circle.
  **Condition 1 (No Mask):** Cued-position report is 95% correct; lexical decision priming is standard.
  **Condition 2 (Immediate Mask):** A pattern mask follows at 100ms. Cued-report drops to chance, but priming magnitude remains identical to Condition 1.
  **Condition 3 (Delayed/No-Report):** The mask remains, the cue is delayed by 2 seconds, and a separate block requires no report. Cued-report is chance, priming is intact, and a forced-choice brightness judgment sits at 68% (above 50% baseline), though participants insist they saw nothing.

  The central debate concerns whether consciousness is identical to information broadcasting or merely correlated with it. Global Workspace Theory (GWT) typically identifies phenomenal consciousness (P) with global availability/access (A). Block argues P can overflow A, citing empirical counterexamples. This study appears to show processing (priming, brightness) without reportable access.

  (a) Argue condition-by-condition whether this data supports overflow. Specifically, does intact priming or above-chance brightness necessarily imply phenomenology without access? (10 marks)
  (b) How does a GWT proponent who views access as degrees, rather than all-or-nothing, explain the priming and brightness results without conceding overflow? (5 marks)
  (c) Name one specific control or manipulation required before this data counts as genuine evidence against GWT. Why would this rule out unconscious access? (5 marks)
  (d) Conclude: If every candidate measure of P (like brightness judgment) turns out to be operationally identical to a measure of A (like reportability), is the P/A distinction empty? Defend your verdict against the charge that you are merely restating the debate in experimental clothing. (5 marks)

  *Note: Definitions of P and A alone gain no marks. You must engage with the operational conflict between the data and the theory.*

  **(e) Bonus:** If the brightness judgment in Condition 3 relies on motor output, does this reintroduce access by the back door? (3 marks)

  ***

  **Model Answer**

  The study presents a classic challenge to Global Workspace Theory (GWT) by dissociating performance from report. In Condition 1, access and phenomenology align. Condition 2 suggests unconscious processing (priming) survives masking despite lost report. However, priming alone is weak evidence for phenomenal consciousness (P); it indicates semantic processing, not necessarily experience. Condition 3 is the critical test: above-chance brightness judgment without report suggests residual information. Block would argue this is P overflowing A—experience exists without global broadcast for report.

  However, a sophisticated GWT proponent need not concede. Regarding (b), if access is graded rather than binary, the 68% brightness score represents partial access, not zero access. GWT posits ignition is threshold-based; perhaps the brightness signal reached a lower threshold than the letter identity required for report. The priming effect reflects local processing, not global availability. Thus, the data shows varying degrees of access, not P without A. The participants' insistence they "saw nothing" aligns with a lack of full ignition required for confidence, even if some signal persisted.

  For (c), to falsify GWT, we need a measure of P independent of any access task. The brightness judgment is still a task requiring attention and motor output (access). A better control would be neural: if we find neural correlates of consciousness (NCC) specific to phenomenology (e.g., late posterior activity) without frontal ignition (access), GWT is threatened. Alternatively, a "no-report" paradigm using optokinetic nystagmus or pupillometry could measure experience without voluntary motor access. If these physiological markers correlate with the masked stimuli while frontal broadcast remains absent, GWT's identity claim fails.

  Regarding (d), if every measure of P reduces to A, the distinction risks emptiness. If "experience" is defined solely by what can be verified via report or task performance, then P collapses into A operationally. However, this is not merely verbal. The distinction remains conceptually vital because it highlights the explanatory gap: we can imagine a zombie with identical access measures but no experience. Empirically, if P always tracks A, GWT wins parsimony. But if we accept first-person authority as a measure (participants claim no experience despite performance), the distinction holds. The debate isn't empty; it locates where science hits the limit of third-person data. The "operational clothing" is the only fabric we have, but the cut of the suit matters.

  Ultimately, Condition 3 supports overflow only if we trust subjective denial over performance. GWT survives by redefining access as graded. The distinction remains meaningful as a placeholder for the hard problem, even if empirical measures converge.

  ***

  **Marking Scheme (25 Marks)**

  **1. Condition Analysis (0–5 marks)**
  *   **Full Marks:** Correctly identifies Condition 1 as baseline, Condition 2 as weak evidence (priming ≠ phenomenology), and Condition 3 as the critical overflow claim (brightness vs. report). Notes that priming might be unconscious access.
  *   **Common Pitfall:** Treating priming in Condition 2 as definitive proof of consciousness without access (confusing semantic processing with phenomenology).

  **2. GWT Rebuttal (Degrees of Access) (0–5 marks)**
  *   **Full Marks:** Explains that GWT can accommodate data by positing graded access. The 68% score indicates partial ignition, not zero access. Distinguishes between access for report vs. access for simple judgment.
  *   **Common Pitfall:** Claiming GWT denies unconscious processing entirely ( strawmanning the theory) or failing to explain how "degrees" solves the overflow problem.

  **3. Falsification/Controls (0–5 marks)**
  *   **Full Marks:** Proposes a measure independent of motor/report access (e.g., neural correlates, physiological reflexes, no-report paradigms). Explains why this rules out unconscious access (e.g., bypasses motor output).
  *   **Common Pitfall:** Suggesting "better reports" or "more training" (which remains access-based) or declaring GWT unfalsifiable without proposing a specific empirical test.

  **4. Conceptual Verdict (0–5 marks)**
  *   **Full Marks:** Addresses whether the distinction is empty. Argues that operational overlap doesn't erase conceptual distinction (explanatory gap/zombies) OR argues for identity based on parsimony. Engages with the "experimental clothing" charge.
  *   **Common Pitfall:** Simply stating "the distinction is real" without addressing the operational collapse, or dismissing the question as "just philosophy" without engaging the empirical constraint.

  **5. Synthesis and Clarity (0–5 marks)**
  *   **Full Marks:** Argument flows logically from data to theory to meta-conclusion. No definitional padding. Clear distinction between P and A maintained throughout.
  *   **Common Pitfall:** Spending the first paragraph defining P and A (explicitly forbidden for marks) or disjointed answers that don't connect the study to the theory.

  **Bonus Question (3 Marks)**
  *   **Award:** If the student notes that motor output implies a form of access (response selection), thereby undermining the "no-report" claim of Condition 3.
  *   **Key Insight:** Recognizing that "no-report" often still requires motor response, which GWT counts as access.

  ***

  **Cohort Analysis: Where Marks Are Lost**

  **Psychology Students:**
  *   **Likely Loss:** **Move 4 (Conceptual Verdict).** They tend to treat the operational collapse as proof that the distinction is scientifically useless ("if you can't measure it, it doesn't exist"), missing the philosophical point about the *explanatory* role of the distinction (qualia/zombies). They may also treat priming (Condition 2) as definitive proof of consciousness (Move 1), ignoring the semantic vs. phenomenal gap.
  *   **Strength:** Usually excel at Move 3 (Controls), suggesting robust experimental manipulations.

  **Philosophy Students:**
  *   **Likely Loss:** **Move 3 (Falsification/Controls).** They often declare GWT "unfalsifiable" as a conceptual truth without proposing a specific empirical manipulation (e.g., neural correlates) that *would* falsify it. They may also spend too much word count defining P and A (Move 5 penalty), ignoring the instruction to engage with the data.
  *   **Strength:** Usually excel at Move 4 (Conceptual Verdict), navigating the "empty distinction" charge with nuance regarding the hard problem.

  **Fairness Verdict:**
  The question is balanced but risky. It forces Psych students to do philosophy (Move 4) and Phil students to do science (Move 3). The bonus question favours Psych students (understanding motor output as access). To ensure fairness, the marking scheme rewards *argumentative coherence* over technical correctness in the experimental design, allowing Phil students to score high on Move 3 if their proposed control is logically sound, even if not standard practice.
