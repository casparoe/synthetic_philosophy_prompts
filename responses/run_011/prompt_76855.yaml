answer: |-
  ### A Note on Logistics and Framing

  Before you proceed, I need to be plain about two things regarding your request.

  First, **the philosophical framing is sound.** The five headings you listed (coherence, collapse/changing subject, Carnap, and non-verbal exceptions) are distinct, standard, and rigorous lines of objection in meta-ontology; they are not merely one objection in five costumes. A deflationist speaker can and should be pressed on these points.

  Second, **the logistical framing is impossible.** Eight to ten complex philosophical questions, each with a anticipated reply and a prepared follow-up, cannot fit into a thirty-minute Q&A session. If you ask ten questions yourself, allowing the professor two minutes to answer each and thirty seconds for you to speak, you will consume twenty-five minutes, leaving five minutes for introductions, transitions, and *zero* time for audience questions. In a typical lecture Q&A, the moderator's role is to facilitate audience inquiries, not to conduct a ten-round interview.

  **Recommendation:** Treat the list below as a **question bank**. Select only **three or four** of these thematic lines to ask yourself if the audience is slow to start, and use the rest only if you need to fill dead air. Do not attempt to ask all ten.

  ***

  ### The Question Bank

  **1. The Coherence Objection (Part 1)**
  *   **Question:** To claim that the existential quantifier has multiple legitimate meanings, you must quantify over those meanings; doesn't stating your thesis require the very neutral quantifier you claim doesn't exist?
  *   **Likely Reply:** She will likely argue that we can state the thesis in a meta-language where "exists" is disambiguated (e.g., exists₁, exists₂) without requiring a single neutral quantifier.
  *   **Follow-up:** If the meta-language relies on disambiguated quantifiers, what guarantees that *those* quantifiers aren't also subject to variance?

  **2. The Coherence Objection (Part 2)**
  *   **Question:** If the quantifier is genuinely ambiguous, does that imply your own thesis is ineffable in the object language of the disputants?
  *   **Likely Reply:** She will likely concede that the thesis cannot be expressed in a single disputant's idiolect but insist it is expressible in a charitable meta-language.
  *   **Follow-up:** If the thesis is inexpressible to the disputants while they are disputing, in what sense does it resolve *their* problem rather than just describing them from the outside?

  **3. The Collapse Objection (Part 1)**
  *   **Question:** What prevents your diagnosis from collapsing into the claim that *any* dispute whatsoever can be diagnosed as merely verbal?
  *   **Likely Reply:** She will likely appeal to a constraint of "charity" or "conceptual connectedness," arguing that only meanings that fit our pre-theoretic practices are legitimate.
  *   **Follow-up:** Is that constraint on legitimacy itself a substantive metaphysical claim, or is it merely another verbal stipulation?

  **4. The Criterion of Substantivity (Part 2)**
  *   **Question:** Can you provide a positive criterion for what makes a dispute substantive, rather than just a list of disputes you accept as verbal?
  *   **Likely Reply:** She will likely suggest that substantive disputes involve differences in non-semantic beliefs about the world, not just differences in semantic rules.
  *   **Follow-up:** If two disputants agree on all non-semantic facts but disagree on ontology, do you say there is no fact of the matter, or that one is wrong about the language?

  **5. The "Changing the Subject" Objection (Part 1)**
  *   **Question:** Critics argue that stipulating a new meaning for "exists" merely changes the subject; how do you answer the charge that you settle nothing?
  *   **Likely Reply:** She will likely argue that the pre-theoretic concept of existence is vague, so precisifying it clarifies the subject rather than changing it.
  *   **Follow-up:** If the concept is vague, why should we prefer your precisification over the realist's precisification which carves reality at the joints?

  **6. The "Changing the Subject" Objection (Part 2)**
  *   **Question:** If the realist is asking about the fundamental structure of reality, doesn't your semantic approach ignore the metaphysical weight of their question?
  *   **Likely Reply:** She will likely deny that "fundamental structure" is intelligible independently of the conceptual schemes we use to describe it.
  *   **Follow-up:** Does that denial commit you to a form of idealism, or do you think you can avoid metaphysical commitments entirely?

  **7. The Carnap Distinction (Part 1)**
  *   **Question:** How does your view differ from Carnap's distinction between internal questions and external questions?
  *   **Likely Reply:** She will likely distinguish her view by noting that Carnap thought external questions were non-cognitive, whereas she thinks they are true but trivial.
  *   **Follow-up:** If they are true, what makes them trivial; is it a matter of logic, or is it a matter of linguistic convention?

  **8. The Carnap Distinction (Part 2)**
  *   **Question:** Is the difference between your view and Carnap's itself a substantive metaphysical difference, or is that distinction also verbal?
  *   **Likely Reply:** She will likely argue that the difference is pragmatic, concerning how we choose to organize our linguistic frameworks.
  *   **Follow-up:** If the choice of framework is pragmatic, can a framework ever be *wrong*, or only less useful?

  **9. Non-Verbal Ontology (Part 1)**
  *   **Question:** Do you allow that *any* ontological questions are non-verbal, and if so, which ones?
  *   **Likely Reply:** She will likely admit that questions about specific entities within a fixed framework (e.g., "are there electrons?") are substantive.
  *   **Follow-up:** What fixes the framework; is it scientific practice, or is it something metaphysical that grounds the practice?

  **10. Non-Verbal Ontology (Part 2)**
  *   **Question:** If some ontological questions are substantive, what makes them resistant to quantifier variance when questions about composite objects are not?
  *   **Likely Reply:** She will likely argue that scientific entities play specific causal roles that fix their reference, unlike general ontological categories.
  *   **Follow-up:** Does this imply that ontology is ultimately subordinate to physics, and if so, have you eliminated metaphysics or just reduced it?
