  3. **The coincidence.** Section 2's claim is that *r* = 5/8 is simultaneously the value-maximising policy and the unique self-verifying one. Verify this, and then say whether it survives a different rule for apportioning self-locating credence. If you can construct a rule under which the two come apart, do so explicitly and say what that would do to the rest of the draft.
  4. **Section 4.** Is policy-relative individuation a substantive thesis or a redescription? Give the strongest case for each verdict, and then say which you accept. Address directly whether the claim that there is "no policy-independent evidence to ignore" is true of the driver as described, or only of the engineered agent.
  5. **The transfer.** Is the inspection agent a genuine instance of the puzzle or an analogy that breaks precisely where the draft needs it to hold? Take seriously the objection that the designer is never absent-minded, and tell me what the draft would have to change to survive it.
  6. **The most damaging objection.** Identify the single criticism a hostile and competent referee would press hardest, and say whether the draft has a reply available to it. Do not choose a criticism that is easy to answer.
  7. **Interest.** Would a reader who already knows the driver puzzle learn anything here? Rank the six sections by value, and tell me what to cut to make room for what to develop.
  8. **Confidence and sourcing.** Flag every sentence where my assurance outruns my argument. Where a claim needs support from the literature, identify the claim — do not supply titles, authors or a reading list, as I will do the sourcing myself.

