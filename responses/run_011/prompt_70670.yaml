answer: |-
  **Calibration Standards for the Two-Envelope Resolution**

  In metrology, a number without an uncertainty budget is noise. A certificate of accuracy is worthless if it does not specify the conditions under which the instrument holds calibration. Applying this discipline to the Two-Envelope Problem, I propose the following desiderata. These are not suggestions for the "correct" answer, but specifications for the instrument used to find it.

  **1. Localization of the Error**
  *   **Motivation:** In my trade, declaring a reading "anomalous" is insufficient; we must trace the fault to the sensor, the environment, or the algorithm. Similarly, a resolution that merely asserts the switching argument is wrong without identifying the mathematical step that fails is incomplete.
  *   **Status:** Non-negotiable.
  *   **Adequacy:** An adequate localization must pinpoint the specific algebraic or logical transition where validity is lost. It is not enough to say "expected value is misapplied." The account must specify whether the error lies in treating the observed amount $x$ as a fixed constant while simultaneously treating it as a random variable, or in the implicit assignment of a probability of $1/2$ to the events $\{x/2, 2x\}$ regardless of $x$. If the account cannot isolate the step, it is a diagnosis without a repair manual.

  **2. Epistemic Transparency (Agent Knowledge)**
  *   **Motivation:** An operator cannot correct for errors using data they do not possess. Many resolutions implicitly grant the agent knowledge of the prior distribution of money in the envelopes.
  *   **Status:** Non-negotiable.
  *   **Requirement:** The account must explicitly state what the agent is licensed to assume about the filling mechanism. If the resolution depends on the agent knowing the prior distribution, it must prescribe a policy for when that distribution is unknown. It must not silently assume a uniform prior over an infinite range, as no physical instrument has infinite range.
  *   **Camp Specificity:** This is often resisted by **Bayesians** who insist a prior must always exist, even if subjective. However, for a general resolution, assuming a specific prior without justification is akin to calibrating a scale with a phantom weight.

  **3. Derivation of Decision Rule**
  *   **Motivation:** Showing an argument is invalid is not the same as telling the operator whether to switch. A measurement must yield a readout.
  *   **Status:** Non-negotiable.
  *   **Requirement:** The resolution must yield an operative policy (Switch, Stay, or Indifferent) and specify the metric against which it is evaluated (e.g., long-run frequency vs. single-case utility).
  *   **Camp Specificity:** **Decision Theorists** insist on maximization of expected utility. **Frequentists** may reject single-case expectations entirely. A robust resolution must acknowledge this divide or justify why one metric overrides the other in this specific context.

  **4. Variant Robustness**
  *   **Motivation:** An instrument must hold accuracy across its stated range. A resolution that works for one formulation but breaks under slight variation is unstable.
  *   **Status:** Non-negotiable.
  *   **Required Variants:**
      *   *No Probabilities:* If the account requires probabilities where none are given, it fails the logical variant.
      *   *Coin Toss:* If the second envelope is filled by a toss after the first is fixed, the symmetry breaks; the account must explain why switching is or isn't favorable here.
      *   *Independent Draws:* If amounts are independent, a randomized threshold rule can win $>50\%$ of the time; the account must not conflate this with the standard problem.
      *   *Two-Player:* If both players reason switching favors them, the account must resolve the symmetry without contradiction.
      *   *Bounded Funds:* Real funds are finite. If the account relies on infinite expectations, it fails the physical variant.
      *   *Opened Envelope:* If the agent sees a sum $x$, the account must handle the conditional update without invoking impossible priors.

  **5. Consistency of Expectation**
  *   **Motivation:** In measurement, we do not accept calculations that yield different results for the same physical state depending on the coordinate system.
  *   **Status:** Camp-specific (**Bayesian**).
  *   **Requirement:** The expected gain from switching must sum to zero when averaged over all possible pairs, unless new information is introduced. **Bayesians** insist on this to prevent Dutch Books. **Frequentists** might argue expectation is irrelevant if the game is played once.

  ***

  **Findings on Compatibility and Obstruction**

  I must report a significant obstruction. Desiderata 2 (Epistemic Transparency) and 4 (Variant Robustness: No Probabilities) appear to conflict with Desideratum 3 (Decision Rule via Expected Value).

  To derive a decision rule based on expected value (Desideratum 3), one requires probabilities. However, the "No Probabilities" variant (Desideratum 4) explicitly withholds them. If we insist on Epistemic Transparency (Desideratum 2), we cannot silently insert a prior to calculate the expectation. Consequently, a resolution that satisfies the "No Probability" constraint cannot yield an Expected Value decision rule without violating the "Agent Knowledge" constraint.

  This suggests the paradox is not a single error but a category mistake: we are asking for a probabilistic decision rule in a context that does not license probabilistic assumptions. The conflict is not bad luck; it is the finding. A resolution satisfying all desiderata may be impossible because the request itself asks for a measurement of uncertainty where none is defined.

  ***

  **The Most Eliminative Requirement**

  The single requirement that eliminates the largest number of otherwise plausible candidates is **Desideratum 2: Epistemic Transparency**.

  Most proposed resolutions fail here. They argue that switching is neutral because the expectation is zero, but they calculate this expectation by assuming a probability distribution over the amounts in the envelopes. They silently grant the agent knowledge of the stuffer's behavior (e.g., that $x/2$ and $2x$ are equally likely). In metrology, this would be rejected as using a calibration curve outside its certified range. By demanding the agent state *how* they know the probabilities, Desideratum 2 disqualifies any solution that relies on an improper uniform prior over an infinite domain. It forces the resolution to confront the physical bounds of the problem (Desideratum 4, Bounded Funds), which collapses the mathematical elegance of the switching argument.

  ***

  **Assessment of Resolution Families**

  | Family of Resolution | Assessment Against Non-Negotiables |
  | :--- | :--- |
  | **Naive Expectation** | Fails Localization. Claims expectation is always positive without identifying the variable/constant confusion. Fails Bounded Funds variant. |
  | **Bayesian Prior** | Fails Epistemic Transparency. Requires agent to know/assume a prior distribution not given in the problem statement. |
  | **Bounded Support** | Passes Bounded Funds. Fails "No Probability" variant as it still requires assumptions about the bound location to decide. |
  | **Logical Symmetry** | Passes "No Probability." Fails Decision Rule; concludes "indifference" but offers no metric for single-case utility. |
  | **Decision-Theoretic** | Fails Variant Robustness. Often breaks in the Two-Player version where symmetry implies both cannot gain. |

  **Conclusion**
  The standard for a resolution must be higher than mathematical consistency; it must be epistemically licensed. Until a candidate can satisfy the demand for localized error without assuming unauthorized knowledge, the instrument remains uncalibrated.
