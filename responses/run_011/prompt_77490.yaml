      *   **Conclusion on the Practice:** If nothing settles it, it reveals that State Apology is a *hybrid* practice. It is moral theatre that has material consequences. It requires a "fiction" of corporate personhood to function without violating liberal individualism.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, check Premise (10).* Premise (10) says nothing limits the liability. If I reject (8), do I still have to accept (10)? No, because (10) follows from (9). If (9) is false (members don't bear liability), (10) doesn't apply to members.
