          *   *Dropping (6) (No Resources):* If the state has its own resources (Crown lands, sovereign wealth), then members don't directly pay. *Critique:* This is metaphysical sleight of hand. Those resources are still managed by people and ultimately belong to the polity. It doesn't solve the moral problem, just hides the cash flow. Cost: Medium (metaphysically dubious).
