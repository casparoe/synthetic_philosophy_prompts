  7.  **Final Polish:** Ensure the tone is appropriate for a policy journal/philosophical discussion. Precise, analytical, respectful of the constraints. (Make sure to explicitly address the "price" of dropping 4, 6, 8).

      *   *Drop 4:* Loss of Apology (becomes regret).
      *   *Drop 6:* Metaphysical obscurity (State resources are still public resources).
      *   *Drop 8:* Requires a robust theory of Corporate Personhood that doesn't collapse into individualism.

      *   *The Test:* The "Exit Option." If liability were personal, emigration would absolve you. It doesn't. Therefore, liability is attached to the *membership role*, not the *person*.

  8.  **Final Review against constraints:**
