      *   **The Test/Case:** Need a distinction between Corporate Obligation and Personal Obligation.
          *   *The "Resignation Test":* If I resign from the state (emigrate), does the debt follow me? If yes, it's personal. If no, it's corporate. (Usually, debts stay with the state, not the ex-citizen).
          *   *The "Benefit Principle":* Liability attaches to those who benefit from the wrong, not just those who exist. This limits (10) without rejecting (8) entirely, but the prompt asks to settle the *nature* of the obligation.
