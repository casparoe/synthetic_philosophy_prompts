answer: |-
  ### The Triage Procedure

  You are the referee, not the judge. Your job is to enforce the rules *as written* until a court tells you otherwise. Drop the "popular sovereignty" argument; in the room, the bylaws are the authority. Drop the "self-amendment paradox"; follow the hierarchy (Specific protections trump General powers).

  Run these five questions in order. If you answer "No" or "Stop," the motion halts.

  1.  **Notice:** Was written notice given 14 days prior, explicitly stating the text of the proposed change?
      *   *Sufficient Answer:* Yes = Proceed. No = **Out of Order.**
  2.  **Target:** Which Article does this motion change?
      *   *Sufficient Answer:* Article X (General) = Proceed. Article II (Resale/Unanimity) = **Go to Q3.** Other = Proceed.
  3.  **Shield:** Does this motion alter the resale formula *or* the "Unanimous Consent" line protecting it?
      *   *Sufficient Answer:* No = Proceed (2/3 threshold). Yes = **Go to Q4.**
  4.  **Threshold Match:** Does the proposed voting method match the protection? (i.e., Are they trying to pass this with 2/3 when the text demands Unanimous?)
      *   *Sufficient Answer:* Yes (Unanimous proposed) = Proceed. No (2/3 proposed) = **Out of Order.** (You cannot use Article X to delete Article II's shield).
  5.  **Time & Law:** Does this change past financial obligations, or does it conflict with known state co-op statutes?
      *   *Sufficient Answer:* No = Proceed. Yes = **Stop. Refer to Counsel.** (This is not your call).

  **Where this misfires:** This procedure assumes the bylaws are legally valid. If state law says "All co-ops must amend by majority," this procedure will tell you to require 2/3, and you'll be overruled later. That is unavoidable. You are protecting the *process*, not the *outcome*.

  ***

  ### Ruling on Pending Motions

  **1. Motion to lower Article X threshold (2/3 → Majority).**
  *   **Ruling:** **In Order.**
  *   **Why:** Article X governs its own amendment. You use the current rule (2/3) to change the rule.
  *   **Blunt Truth:** This motion will not kill the co-op, but it might fail. You need a 2/3 vote *now* to pass a rule that allows majority votes *later*. If you don't have 2/3 in the room, it dies. The procedure does not block it, but the headcount might.
  *   **Minutes:** "Motion to amend Article X threshold. Ruled In Order. Vote required: 2/3 of members present."

  **2. Motion to delete Unanimity line AND rewrite Resale Formula (single vote).**
  *   **Ruling:** **Out of Order.**
  *   **Why:** This violates Triage Q4. You cannot use the Article X (2/3) process to remove the Article II (Unanimous) shield in the same step. It is a "bootstrapping" violation. They must get Unanimous Consent to remove the shield *before* they can vote on the formula with a lower threshold.
  *   **Minutes:** "Motion to amend Article II. Ruled Out of Order: Proposed voting threshold (2/3) conflicts with existing protection clause (Unanimous)."

  **3. Motion to create "Unamendable" Article XII + Motion to Repeal XII.**
  *   **Ruling:** **In Order.**
  *   **Why:** Members can write "never" into a bylaw, even if a future court might ignore it. The repeal motion is a standard amendment under Article X.
  *   **Nuance:** The "never" language is likely legally illusory, but procedurally permissible to propose.
  *   **Minutes:** "Motion to add Article XII... Ruled In Order. Note: Legal enforceability of 'perpetual' clause not determined."

  **4. Motion to declare last spring's vote void (Retroactive).**
  *   **Ruling:** **Stop. Refer to Counsel.** (Triage Q5).
  *   **Why:** This triggers the "No amendment takes effect retroactively" clause and creates financial liability. Determining if defective notice *automatically* voids a vote vs. requiring a rescission motion is a legal question, not a procedural one. Do not let this vote happen without an email from a lawyer.
  *   **Minutes:** "Motion regarding retroactive validity of roof assessment. Ruled Pending Legal Review. No vote taken."

  ***

  ### The Binder Cheat Sheet (10 Lines Max)

  1.  **Notice:** 14 days + exact text? If No, **Out of Order.**
  2.  **Article II?** Touching Resale or Unanimity clause? If Yes, **Unanimous Vote Required.**
  3.  **Threshold:** Trying to change Art II with 2/3 vote? **Out of Order.**
  4.  **Retroactive:** Changing past money/decisions? **Stop. Ask Lawyer.**
  5.  **State Law:** Conflict with co-op statute? **Stop. Ask Lawyer.**
  6.  **Minutes:** Record motion text, ruling, and required threshold.
  7.  **Do Not:** Decide if a motion is "good" or "fair."
  8.  **Do Not:** Interpret state law or legal validity.
  9.  **Do:** Enforce the document *as written* in the room.
  10. **When Stuck:** "I am ruling this requires legal review before a vote."
