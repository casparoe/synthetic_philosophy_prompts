  10. **Final Polish:** Check the math on the rubric. 6+6+6+7 = 25. My scores: 5+4+5+2 = 16. Looks consistent with the errors found. The final clause miss is significant. The factual errors in the LBA section are clear.

      *Self-Correction on Tainter:* Tainter does argue that collapse is often beneficial for the surviving population (lower taxes, less extraction). So the student isn't *wrong* on Tainter's normative claim, but framing it as a "rational choice" to shed complexity implies agency at the societal level that Tainter attributes to systemic diminishing returns. I will mark this as a nuance issue rather than a flat error.

      *Self-Correction on Final Clause:* The prompt asks "what would have to be true." The student answers "We should retire it." This is a category error. This is the biggest grading lever.

      *Self-Correction on Case Study:* The prompt says "drawing on at least one case other than Rapa Nui... Close by saying..." The student uses Rapa Nui to critique Diamond (Para 3), then uses Maya/LBA for the transformation argument (Para 4). This is acceptable usage of Rapa Nui for Part 1, as long as Part 2 uses a different case. The student *does* use Maya/LBA for Part 2. So the Rapa Nui usage isn't a violation, just heavy. I won't penalize heavily there, but the factual errors in the LBA/Maya section are the issue.

      *Re-evaluating Rubric:*
