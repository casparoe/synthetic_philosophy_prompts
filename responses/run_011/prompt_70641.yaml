      *   *Settlement:* $7M fund (includes injunctive relief value).
      *   *Costs:* $2.1M fees/admin.
      *   *Distribution:* $4.9M available / 12M members = ~41 cents/member.
      *   *Claims:* Low single-digit percentage (most don't claim).
      *   *Residue:* Unclaimed money goes to nonprofits (cy pres) or back to defendant (reversion).
      *   *Notice:* Email only (cost constraint).
      *   *Paradox:* Court treats individual harm as *de minimis* (not worth suing) but aggregate harm as actionable ($7M extraction). Most money doesn't reach victims.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the tension. The practice is a hybrid mechanism. It's not pure compensation, not pure regulation.

      *   **1. Theory of Small Harms:**
          *   *Option A:* Tiny harms don't count individually but do collectively. (This fits the *de minimis* standing barrier vs. class certification).
          *   *Option B:* They count fully, admin tragedy prevents payout. (This is the "excuse" often given, but does the practice *require* it? No, because the residue clauses suggest the money isn't *owed* to specific individuals if unclaimed).
          *   *Option C:* Operative unit is the cost of vindicating a right. (This explains the fees and the settlement amount).
          *   *Analysis:* The practice *requires* that the *wrong* is aggregate, but the *remedy* is constrained by transaction costs. It presupposes a "deterrence-first" theory where compensation is secondary. The individual harm is legally cognizable only *through* the aggregate.
          *   *Distinction:* It requires aggregation for liability. It is underdetermined on whether the unclaimed funds *belong* to the individuals (could be cy pres or reversion).

      *   **2. Residue Clauses (The Diagnostic):**
          *   *Reversion:* If money goes back to the defendant, it implies the debt was conditional on claim. The wrong was to the *class as a whole*, but the liability is extinguished by the fund creation, not full distribution. It suggests the defendant bought "peace," not that they owe every specific person 41 cents forever.
          *   *Cy Pres (Clinics):* If money goes to third parties, it implies the funds represent a "public wrong" or a "constructive trust" for the *type* of victim, not specific victims. It treats the class as a proxy for the public interest.
          *   *Compatibility:* Can they sit together? Yes, if the theory is "deterrence." Both prevent the defendant from keeping the ill-gotten gains. But they conflict on "compensation." Reversion says "if you don't want it, you don't get it." Cy Pres says "this money *must* be used for people like you."
          *   *Conclusion:* Reversion implies a contract/peace theory. Cy Pres implies a regulatory/public law theory. The practice allows both, meaning the "compensation to victim" commitment is weak/underdetermined.

      *   **3. Prospective Component (Injunctive Relief):**
          *   *Effect:* Shifts focus from past loss to future behavior.
          *   *Theory:* Locates the wrong in the *policy/practice*, not just the sum of receipts.
          *   *Consistency:* Fits with the "deterrence" theory in (1). If the wrong is the *systemic* rounding rule, fixing the system is as valuable as paying the past debts. It justifies the $7M > $4.7M gap.
          *   *Tension:* It undermines the "compensation" narrative. If the goal is fixing the system, why pretend it's a damages class? It reveals the class action as a private attorney general mechanism.

      *   **4. Aggregative Regulation vs. De Minimis Adjudication:**
          *   *The Conflict:* EPA counts statistical lives (aggregation OK). Courts say 39 cents isn't a case (aggregation NO for standing).
          *   *Reconciliation 1 (Kind of Harm):* Safety vs. Money? Weak.
          *   *Reconciliation 2 (Who Aggregates):* Agency (Executive) vs. Court (Judicial). Agencies have budgets/mandates for prevention. Courts are reactive/dispute-resolution.
          *   *Reconciliation 3 (Budget/Institution):* Strongest. Courts rely on parties to fund litigation. If individual stake < cost, no case. Agencies have tax funding.
          *   *Moral View:* Even if the rationale is institutional (budget), it presupposes a moral view: Rights are only enforceable if someone can afford to enforce them, *unless* bundled. It privileges economic efficiency over perfect corrective justice.

      *   **5. Rival Accounts:**
          *   *Strict Non-Aggregation:* Ruled out. The class exists. Liability is established on the aggregate.
          *   *Strict Individual Entitlement (No Admin Cost Excuse):* Ruled out. The practice accepts that if admin costs > claim value, the claim goes unpaid (email notice, claim forms).
          *   *Home in System:* The current system is a "pragmatic deterrence" model. It rejects strict non-aggregation (allows class) and strict individualism (allows cy pres/reversion).

      *   **6. Concrete Replacements:**
          *   *System A (Individual Serious, Aggregate Denied):* No class actions. 39-cent claims dismissed. Defendant keeps $4.7M. Rule: Standing requires individual damages > filing fees.
          *   *System B (Aggregate Serious, Individual Denied):* Regulatory style. No claim forms. Defendant pays $4.7M + penalty to Treasury. No notice to individuals. Rule: Standing granted to AG or Agency only.
          *   *Current System:* Hybrid.

  4.  **Refining and Polishing:**
      *   *Check Constraints:* Did I defend the policy? No, kept it reconstructive. Did I separate required commitments from underdetermined ones? Need to make sure this distinction is explicit in every section.
      *   *Tone Check:* Ensure it sounds like legal philosophy, not a policy brief. Use terms like "corrective justice," "deterrence," "transaction costs," "constructive trust."
      *   *Specific Focus:* The prompt asks about the "speck-and-torture structure." Ensure the aggregation of micro-harms is central.
      *   *Residue:* Make sure the distinction between Reversion (contractual peace) and Cy Pres (public law) is sharp.

  5.  **Self-Correction during Drafting:**
      *   *Initial thought:* Maybe the theory is "compensation is impossible so we do deterrence."
      *   *Correction:* That's a defense. The *implicit theory* is that the *liability* attaches to the aggregate, but the *distribution* is secondary. The practice treats the fund creation as the primary satisfaction of judgment, not the distribution.
      *   *Refining Question 4:* The prompt asks if a non-moral rationale can presuppose a moral view. Yes, institutional constraints encode moral priorities (e.g., efficiency over perfect justice).
