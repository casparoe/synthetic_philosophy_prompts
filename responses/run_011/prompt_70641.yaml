answer: |-
  Here is a reconstruction of the implicit theory presupposed by the architecture of small-value class settlements, separated into the commitments the practice requires and those where it remains philosophically underdetermined.

  ### 1. The Theory of Small Harms

  The practice presupposes a **hybrid theory of liability and remedy**. It requires that tiny harms do not count individually for the purpose of *access* (standing/justiciability) but do count collectively for the purpose of *liability*.

  *   **Required Commitment:** The legal system treats the *aggregation* as the ontological unit of the wrong. A thirty-nine-cent loss is legally nonexistent until it is bundled. The practice cannot function if the harm is viewed as twelve million discrete torts; it requires the harm to be viewed as one systemic injury of $4.7 million inflicted upon a single entity (the class). This is why the class device is mandatory: without it, the harm vanishes from the legal ledger.
  *   **Underdetermined Commitment:** The practice is ambiguous regarding whether the harm counts *fully* for each individual.
      *   *View A (Administrative Tragedy):* Each person is owed 41 cents, but transaction costs make payment impossible. The shortfall is a regrettable practical failure.
      *   *View B (Vindication Cost):* The operative unit is the cost of vindicating the right. The $7 million fund satisfies the defendant's obligation to the *legal order*, not necessarily to each person.
      *   *Analysis:* The practice lives comfortably with View B and often acts as if View B is true (see residue clauses). It does not *require* View A. If View A were required, unclaimed funds could never revert to the defendant. Since reversion is permitted, the system presupposes that the defendant's duty is to disgorge the ill-gotten gain into a pool, not to ensure specific restitution to every victim.

  **Conclusion:** The theory is **Aggregate Liability with Proxy Compensation**. The wrong is real only in the sum; the remedy is satisfied by the creation of the fund, not its complete distribution.

  ### 2. Residue Clauses as Diagnostic

  The treatment of unclaimed funds reveals whether the system views the class as a collection of creditors or as a vehicle for public regulation.

  *   **Reversion to Defendant:** If unclaimed money returns to the wrongdoer, the settlement is treated as a **contract for peace**. The defendant purchased immunity from future suit for $7 million. The obligation was conditional: "Pay $X if claimed." This implies the class members were wronged *severally*, but their right to recovery is waivable by inaction. It treats the lawsuit as a private dispute where the defendant's liability is capped by the claims process.
  *   **Cy Pres (Nonprofit Clinics):** If unclaimed money goes to third parties, the settlement is treated as a **constructive trust for a public interest**. The funds belong to the "class" as an abstract entity, not the individuals. Since the individuals cannot be found or paid, the money must be used for the *next best purpose* aligned with the class's interests. This implies the wrong was against the *integrity of the market* or consumer protection generally, with the class serving as the proxy plaintiff.
  *   **Compatibility:** These two commitments are **incompatible** within a single coherent theory of corrective justice.
      *   Reversion says: "The debt is extinguished if the creditor doesn't collect."
      *   Cy Pres says: "The debt is owed to the class interest and cannot be kept by the debtor."
      *   *Practice:* The fact that courts allow both indicates the procedure is **underdetermined** on the nature of the right. It allows the court to toggle between private dispute resolution (reversion) and public regulation (cy pres) depending on judicial preference or negotiation leverage, without resolving the philosophical contradiction.

  ### 3. The Prospective Component

  The inclusion of injunctive relief (changing the fee display) shifts the locus of the wrong from **past injury** to **future risk**.

  *   **Effect on Theory:** This confirms that the practice locates the wrong in a **pattern of conduct** rather than a sum of discrete injuries. If the wrong were solely the $4.7 million taken, the remedy would be solely disgorgement. By paying for prospective change, the settlement acknowledges that the *existence* of the rounding rule is the injury, not just its monetized output.
  *   **Consistency with (1):** This sits comfortably with the **Aggregate Liability** theory. It reinforces that the defendant is being sued for maintaining a harmful *system*. However, it creates tension with the "compensation" narrative. If part of the $7 million buys future safety, that portion is explicitly *not* compensation for past loss.
  *   **Implication:** The practice implicitly admits that the class action is functioning as **private attorney general litigation**. The named plaintiffs are not just seeking damages; they are procuring a regulatory change that benefits non-parties (future customers). This validates the "Aggregate Liability" view but undermines the "Individual Compensation" view. The procedure requires us to accept that the class representative stands in for the public interest, not just the absent class members.

  ### 4. Aggregative Regulation vs. *De Minimis* Adjudication

  The distinction between the EPA (counting statistical lives) and the Court (ignoring 39-cent claims) is not morally inconsistent if viewed through an **institutional capacity** lens, though it is morally significant.

  *   **Candidate 1 (Kind of Harm):** Safety vs. Money. *Fails.* A statistical life is an aggregation of microrisks; a $4.7 million loss is an aggregation of microlosses. The moral structure is identical.
  *   **Candidate 2 (Who Aggregates):** Agency vs. Court. *Survives Scrutiny.* Agencies are proactive and funded by taxation; they can aggregate risks before harm occurs. Courts are reactive and funded by litigants; they require a concrete "case or controversy."
  *   **Candidate 3 (Budget/Institution):** *Strongest.* The distinction tracks the **budget of the institution doing the counting**. The EPA has a budget to calculate statistical lives. The Court has no budget to process 12 million claim forms.
  *   **Moral View:** Can a non-moral rationale presuppose a moral view? **Yes.** By tying standing to economic viability (filing fees > claim value), the legal order presupposes that **rights are contingent on enforcement costs.** It encodes a moral priority: *Efficiency over Perfect Justice.* It accepts that some wrongs will go unremediated if the cost of remediation exceeds the loss. This is a utilitarian moral view, even if justified by institutional constraints. The system does not claim this is morally ideal; it claims it is procedurally necessary. Thus, the inconsistency is only superficial; the deep theory is **Institutional Utilitarianism**.

  ### 5. Rival Accounts Ruled Out

  The practice explicitly rules out two pure theories:

  *   **Strict Non-Aggregation:** (A harm below a threshold counts for nothing).
      *   *Ruled Out:* The court certifies the class and extracts $7 million. If this view held, the defendant would owe nothing. The system rejects this because it acknowledges the *total* harm is cognizable.
  *   **Strict Individual Entitlement:** (Aggregation is correct, therefore every 41 cents must be paid).
      *   *Ruled Out:* The system allows email notice (knowing it won't reach everyone), claim forms (creating barriers), and cy pres/reversion (acknowledging money won't reach victims). If this view held, the court would require individual notice funded by the defendant regardless of cost, and forbid reversion.
  *   **Home in the System:** The current system is home to a **Deterrence-First Theory**. It prioritizes stripping the defendant of ill-gotten gains and altering behavior over making victims whole. It accepts "approximate justice" (some victims paid, some not, defendant punished) over "no justice" (case dismissed) or "perfect justice" (prohibitively expensive distribution).

  ### 6. Concrete Replacements

  To clarify the philosophical commitments, here are the specific rule changes required to shift to the rival systems.

  **System A: Individual Claim Serious, Aggregate Denied (Libertarian/Corrective Justice Model)**
  *   **Standing:** Individual damages must exceed filing fees + reasonable attorney time to establish standing. (39-cent claims dismissed).
  *   **Aggregation:** Prohibited. No class actions for damages under a statutory threshold (e.g., $1,000).
  *   **Notice:** N/A (No case).
  *   **Residue:** N/A.
  *   **Result:** Defendant keeps $4.7 million. No change to rounding rule. The law treats the harm as *de minimis non curat lex*.

  **System B: Aggregate Serious, Individual Claim Denied (Administrative/Regulatory Model)**
  *   **Standing:** Granted only to a State Attorney General or Federal Agency. Private plaintiffs barred.
  *   **Aggregation:** Mandatory. Liability calculated on total transaction volume, not claims filed.
  *   **Notice:** No notice to individuals required (too costly/irrelevant). Public notice only.
  *   **Residue:** 100% of disgorgement + penalty goes to the State Treasury or a dedicated Consumer Fund. No reversion. No cy pres to private clinics (unless state-run).
  *   **Result:** Defendant pays $4.7 million + penalty to the State. Rounding rule changed via consent decree. Individuals receive nothing directly.

  **Current System (Hybrid)**
  *   **Standing:** Private plaintiff allowed *only if* aggregated.
  *   **Aggregation:** Optional (defendant can settle to avoid it).
  *   **Notice:** "Best practicable" (email), not actual.
  *   **Residue:** Split between claimants, cy pres, and reversion.
  *   **Result:** Defendant pays $7 million. Some individuals get 41 cents. Clinics get millions. Defendant keeps unclaimed share (if reversion).

  ### Summary of Philosophical Underdetermination

  The procedure is **underdetermined** on the question of **ownership of the unclaimed fund**.
  *   It *requires* that the defendant be liable for the aggregate sum.
  *   It *requires* that individual access be subsidized by aggregation.
  *   It *does not require* that the unclaimed money belong to the individuals (allowing reversion) nor that it belong to the public (allowing cy pres).

  This ambiguity allows the legal order to maintain the *appearance* of corrective justice (compensating victims) while operating on the *logic* of public regulation (deterrence and disgorgement). The "speck-and-torture" structure is resolved not by making the specks matter individually, but by treating the pile of specks as a single boulder, and then accepting that some dust will fall off the boulder during transport.
