  7.  **Final Polish:** Check word choice for precision ("presupposes," "entails," "compatible with"). Ensure the distinction between the *creation* of the fund and the *distribution* of the fund is clear, as that's where the philosophical tension lies. (Proceed to generate output).

  *(Self-Correction Note on "Reversion"):* Reversion to the defendant is often criticized as undermining deterrence. I need to make sure I analyze what theory *allows* it, not whether it's good. It implies the defendant's obligation was to make a fund available, not to ensure receipt.
