answer: |-
  1. This sentence is broadly trustworthy as a summary of the distinction, but it softens Ryle's stronger claim. The correction is to state that knowing-how is not merely different from knowing-that but is irreducible to it.
  2. This is the seductive error; Ryle never argued that articulation destroys skill, only that skill is not *constituted* by articulation. Correcting this licenses you to write her articulacy as a surviving form of expertise rather than a symptom of decay, preserving her dignity after the accident.
  3. The summary of the regress argument is accurate and safe to use as stated. The only necessary correction is to specify that the regress targets the requirement for prior theoretical contemplation, not the use of rules in general.
  4. Philosophers would wince at the reduction of dispositions to mere bodily behaviour, as Ryle sought to dissolve the mind-body split entirely. The correction is to describe dispositions as multi-track capacities embedded in context, not just physical patterns.
  5. The claim that the matter is closed is false, and stating knowledge is held in the muscles confuses propositional content with physical capacity. Correcting this licenses you to show her retaining the intellectual core of her craft while losing the physical execution, proving the two are distinct but equally real.
