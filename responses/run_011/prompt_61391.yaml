      *   Need to ensure the "concession" is sharp.

  8.  **Final Polish:**
      *   Check against "No citations". (Used "Descartes", "Gassendi", "More" - these are proper names required by the prompt, not bibliographic citations).
      *   Check against "Maximum 650 words".
      *   Ensure the thesis is clear: Sensation = bodily function; Thought = reflective awareness.

