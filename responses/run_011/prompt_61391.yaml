  The standard indictment assumes Descartes equates sensation exclusively with conscious thought. However, a coherent reading distinguishes between sensory affection as a bodily state and sensation as an object of reflective knowledge. Descartes can maintain animals are pure mechanisms possessing genuine sensations because what he denies them is not the physiological capacity to be affected, but the mind's reflective attendance upon that affection.

  First, Descartes' criteria for distinguishing beasts from humans target cognition, not feeling. He demands the general use of signs and flexible response to novelty. These are tests of reason—the ability to manipulate universals or adapt means to ends beyond instinctual programming. A shriek of pain requires neither language nor flexibility; it is an immediate, deterministic output triggered by nerve stimulation. By setting the bar at rational agency, Descartes excludes animals from the realm of *res cogitans* without necessarily stripping them of the bodily capacity to register harm. The criteria prove animals lack understanding, not that they lack sensory input.

  Second, against the Gassendi-style objection that animal cunning implies thought, the mechanical explanation absorbs adaptability without granting mind. Complex automata can exhibit behaviors indistinguishable from purposeful action. A clock tells time; an organ plays music. Similarly, animal nerves and animal spirits can be configured to produce complex avoidance behaviors when threatened. The appearance of cunning is merely the operation of a sophisticated machine responding to environmental variables. When a dog avoids a stick, it is not judging the stick as harmful but mechanically reacting to visual stimuli via pre-established neural pathways. This explains the behavior without invoking a subject that *knows* it is avoiding pain.

  Third, this aligns with Descartes' remark to More that he denies beasts neither life nor sensation insofar as these depend on bodily organs. Here, sensation is defined functionally rather than phenomenologically. It is the mechanical transmission of stimulus from organ to brain, resulting in behavioral output. This requires no immaterial mind. By locating sensation in the organ rather than the mind, Descartes preserves the reality of the animal's physical experience while denying it the metaphysical status of conscious suffering. The animal feels pain only in the sense that a machine registers damage, not in the sense that a soul suffers.

  Is this position morally defensible? It is merely internally consistent. If pain is merely mechanical registration without a subject to endure it, the moral weight of inflicting it vanishes, which contradicts our intuitive empathy. Consistency is achieved by redefining sensation as bodily function rather than conscious experience, allowing vivisection without guilt, but failing to account for the moral significance of suffering behavior.

  I would concede to the opposing reading at the definition of pain itself. If pain is inherently phenomenological—if to feel pain *is* to suffer—then denying animals a mind necessarily denies them pain. To maintain they feel pain without a mind is to multiply distinctions between "feeling" and "awareness of feeling" beyond usefulness. If there is no one home to suffer the mechanism, calling it "pain" is a category error.
