prompt: |-
  I sit on the board of a small private foundation — nine trustees, one staff member, an endowment of roughly sixty million dollars — and last night I argued for three hours with a fellow trustee, whom I'll call M., about a vote we have to take on Thursday. Neither of us budged. Before I walk back into that room, I would like an outside view.

  The question is what our own record commits us to. Over the past six years the board has decided five proposals that turned on how well the odds were specified, and all five votes are in the minutes:

  1. Two grant requests, identical amounts. One was an established curriculum whose outside evaluator stated a 60 percent chance of hitting the target and showed her derivation on a single page; the other was a first-of-its-kind program in a field none of us knew, whose sponsor said only that the chance was "somewhere between 25 and 70 percent" and could not narrow it. We funded the first, 6–1.

  2. Two requests, each with a range neither sponsor could narrow, both sponsors equally credible and equally eager for the money. One was in our longest-running program area, where we hold thirty years of our own grant data; the other was in an area we had never funded. The familiar one had the lower midpoint — 35 to 55 against 45 to 65. We funded the familiar one, 5–2, and the minutes record two different reasons from two different trustees: "we know this field well enough to place the odds ourselves," and "at least we'll be able to say afterwards that we knew what we were doing."

  3. A request whose sponsor initially offered a range. We sent it back asking for a single number. She returned a point estimate, a confidence interval, and a paragraph of derivation; the project, the amount, and the sponsor were identical to what we had just turned down. We approved it, 7–0.

  4. A bank offered us a three-million-dollar note. The offering memorandum gave the payoff distribution to three decimal places along with a complete payoff table; the model behind it was proprietary, its author had left the firm, the bank's fee was contingent on our investing, and our own consultant said she could not reproduce a single figure. We declined, 7–0, and put the money into an index fund instead.

  5. A bequest whose amount was to be fixed by a draw that the executors would fill and make in our presence, in open session, on the day of transfer — so the odds were unknown to us when we voted, but were to be set in full view of us by people with nothing to gain from the outcome. We accepted, 8–1, over the objection of a trustee who said we still did not know the odds.

  As a control: on two occasions when both options carried fully specified and fully transparent odds, we took the higher-variance one. Nobody on this board is simply frightened of variance.

  Thursday's case has exactly two live options for a three-million-dollar commitment, and we cannot fund both.

  (A) A social-impact bond from a sponsor we have dealt with twice before; both earlier bonds paid out as promised. The memorandum specifies a 78 percent probability of full repayment with a complete payoff table — but the figures come from the sponsor's proprietary model, the sponsor's fee is contingent on our investing, and our consultant says again that she cannot reproduce the derivation.

  (B) A continuation grant to a program we have funded for twenty-two years. Our independent evaluator — flat fee, no stake in which option we choose, and she volunteered the estimate unprompted — will say only that the chance of hitting the target is "somewhere between one in three and two in three" and that she cannot narrow it, but she can walk us through every step of the program and every reason the range has the width it has. We would also set the milestone schedule ourselves, and that schedule changes what the payoff depends on.

  M. is certain the record points to (A): in five tries we have never put money behind a range that could not be narrowed, and precedents 1 and 3 say so plainly. I think precedent 4 says otherwise, and that what we have actually been tracking is not the shape of the odds but who produced them and whether we could restate the reasoning ourselves. Partway through, M. said this was just the urn problem from the decision-theory textbooks wearing a suit; I said that naming it was not deciding it.

  Here is what I would like from you:

  - Set out the candidate rules that fit precedents 1 through 5 — not merely "ambiguity aversion," but the distinct principles that could each account for the whole record, since I suspect at least four can. For each, say which precedents strain it and which it explains effortlessly.
  - Say what each candidate rule recommends for Thursday, and identify where they genuinely disagree rather than merely describing the same choice in different vocabulary.
  - Give me your recommendation with your reasons, and name the closest analog among the five precedents. If you think (A) is really precedent 4 with a track record attached, or that (B) is really precedent 1 with the sponsor swapped, tell me which of those descriptions is the honest one.
  - State plainly what principle we would be adopting by voting each way, given that whatever we decide becomes precedent 6 and will be quoted back at us for a decade.
  - Tell me what would change your mind: which of your readings of the record, if wrong, would flip the recommendation, and where your reasoning is most likely to fail. And tell me whether a request for more information — asking the sponsor for the model documentation, or asking the evaluator to commit to a single number — would actually resolve the case, or would merely reveal which rule we have been running all along.

  Please write in American English.
