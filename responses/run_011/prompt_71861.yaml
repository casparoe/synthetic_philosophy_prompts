answer: |-
  Here is the plan. It is designed to fit 90 minutes, handle the variance problem, and land the specific conceptual insights you want without turning into a lecture.

  ### 1. The Game: "The Safe Middle"

  You need one primary matrix for the session. It must be $3 \times 3$ to allow for iterated elimination, but the core lesson lives in the Row player's $3 \times 2$ subgame.

  **The Matrix (Handout this)**
  Row Player chooses **Top, Mid, Bot**. Column Player chooses **Left, Center, Right**.
  Payoffs are listed as **(Row, Col)**.

  | | **Left** | **Center** | **Right** |
  | :--- | :---: | :---: | :---: |
  | **Top** | 10, 5 | 0, 5 | 10, 5 |
  | **Mid** | 4, 5 | 4, 5 | 4, 5 |
  | **Bot** | 0, 5 | 10, 5 | 10, 5 |

  **What the numbers are doing:**
  1.  **Column's Perspective:** Column gets 5 points no matter what, *except* if they play a strategy we aren't listing here (or you can just tell them "Center is strictly dominated for Column" in Round 2). To make it playable immediately: **Change Column's Center payoff to 0.**
      *   *Correction for Playability:* If Column gets 0 in Center, they eliminate Center immediately. That starts the Iteration.
      *   **Revised Column Payoffs:** Left=5, Center=0, Right=5 (regardless of Row).
      *   *Result:* Column strictly dominates Center with Left (or Right). Center dies in Round 1.
  2.  **Row's Perspective (The Trap):**
      *   Against **Left**: Top (10) > Mid (4) > Bot (0).
      *   Against **Right**: Bot (10) > Mid (4) > Top (0).
      *   Against **Center**: Mid (4) > Top/Bot (0).
      *   *Initial Intuition:* Mid looks "safe." It guarantees 4. Top and Bot are risky (10 or 0). If Row thinks Column might play Center, Mid is the unique Best Response.
      *   *The Kill:* Once Column eliminates Center (because it gives 0 vs 5), the game reduces to Left/Right.
      *   Against Left/Right only: Mid always pays 4.
      *   **The Mixture:** A 50/50 mix of Top and Bot pays $(0.5 \times 10 + 0.5 \times 0) = 5$ against Left, and 5 against Right.
      *   **5 > 4.** Mid is strictly dominated by the mixture, even though it wasn't dominated by Top or Bot individually.

  ### 2. Payoff Scheme & Variance Control

  **The Problem:** In 5 rounds, a player playing the dominated "Mid" strategy might get lucky (opponent plays Left twice, they play Top twice) and beat a player trying to mix.
  **The Fix:**
  1.  **Magnitude:** The gap is 1 point per round (5 vs 4). Over 5 rounds, expected gap is 5 points. Standard deviation is roughly $\sqrt{5} \times 5 \approx 11$. This is still noisy.
  2.  **Increase the Gap:** Change **Mid** payoff to **2**.
      *   Mix yields 5. Mid yields 2. Gap is 3 per round. Over 5 rounds, expected advantage is 15 points. Noise is manageable.
  3.  **Aggregation:** Do not declare a winner per round. Declare a winner per *table* based on total cumulative score.
  4.  **The "House" Option:** For the first 3 rounds, **you** (the facilitator) play Column for half the tables using a fixed 50/50 randomization of Left/Right (flip a coin visibly). This removes opponent modeling noise. They are purely testing Strategy vs. Strategy.

  **Incentives:**
  *   **Table Winner:** Chocolate bar.
  *   **Session Winner (Highest Total Score):** Picks next week's topic.
  *   **The "Rationality" Bonus:** Award 5 bonus points to any table that writes down "Mid is dominated by Mix" on their sheet, even if they didn't win the chocolate. This incentivizes the insight over the luck.

  ### 3. Round Structure (90 Minutes)

  **0:00 – 0:10: Setup**
  *   Hand out sheets. Explain rules.
  *   **Crucial:** Tell them "You may play the same strategy every round, or change. You may not coordinate with your partner. You *may* flip a coin if you wish, but you must record what you did."
  *   Split room: Half tables play against **You** (House plays 50/50 L/R, Center never played). Half tables play against **Partners**.

  **0:10 – 0:35: Phase 1 (The Trap)**
  *   **5 Rounds.**
  *   Column players are instructed (secretly on a slip of paper) that **Center is available**.
  *   Row players see the full matrix.
  *   *Why:* Row players will see Column playing Center sometimes (if playing partners) or never (if playing House).
  *   If playing Partners: Column will quickly realize Center yields 0 and stop playing it by Round 3.
  *   If playing House: Column never plays Center. Row sees only L/R.
  *   **Data Collection:** Players must record their move, opponent's move, and score each round.

  **0:35 – 0:50: The Debrief (Part 1)**
  *   Ask Row players: "Who played Mid more than twice?" (Hands go up). "Who felt safe doing it?"
  *   Ask: "Who beat the House/Partner consistently?"
  *   **The Reveal:** Draw the reduced matrix (Left/Right only) on the whiteboard.
  *   Ask: "Is Top better than Mid?" (No, not if Opp plays Right). "Is Bot better than Mid?" (No, not if Opp plays Left).
  *   Ask: "Is there *anything* better than Mid?"
  *   Let them struggle. Then suggest: "What if you weren't allowed to pick a row, but had to assign probabilities?"
  *   Walk through the 50/50 math. $0.5(10) + 0.5(0) = 5$. $5 > 2$.
  *   **The Moment:** Let them realize Mid was strictly dominated by a mixture.

  **0:50 – 1:05: Phase 2 (Iteration & Order)**
  *   **Goal:** Show order doesn't matter for Strict Dominance.
  *   **Split the Room:**
      *   **Group A:** "Eliminate all strictly dominated Column strategies first. Then Row."
      *   **Group B:** "Eliminate all strictly dominated Row strategies first. Then Column."
  *   **Task:** They don't play. They just mark through strategies on the sheet.
  *   **Group A:** Kills Center (Col). Then kills Mid (Row, by mix).
  *   **Group B:** Can they kill Mid first?
      *   *Wait:* Mid is *not* dominated if Center exists (4 > 0).
      *   *Correction:* This reveals a nuance. Mid is only dominated *after* Center is gone.
      *   *Adjustment:* To make Order Independence work cleanly, we need a game where dominance exists immediately.
      *   *Pivot:* Use the **same game**, but acknowledge that Row cannot eliminate Mid until Column eliminates Center. This is **IEDS** (Iterated), not simultaneous elimination.
      *   *The Lesson:* "Did Group B get stuck?" Yes. "Why? Because Mid wasn't dominated yet."
      *   "Does the *final* result change?" No. Both groups end at {Top, Bot} vs {Left, Right}.
      *   **Takeaway:** The *path* might require waiting, but the *surviving set* is unique for strict dominance.

  **1:05 – 1:20: The Contrast (Weak Dominance)**
  *   Do not play this. Put this on the whiteboard.
  *   **Game 2:**
      *   Row: A, B. Col: X, Y.
      *   A: (1, 1) | (1, 0)
      *   B: (1, 1) | (0, 0)
      *   (Row Payoffs only: A=1,1; B=1,0).
      *   B is **weakly** dominated by A (1=1, 1>0).
      *   If Row eliminates B: Col is indifferent between X and Y (assuming Col payoffs align).
      *   If Row *keeps* B: Col might play Y to punish A?
      *   **Better Example for Order Dependence:**
          *   R: T, M, B. C: L, R.
          *   T: 1, 1
          *   M: 1, 0
          *   B: 0, 1
          *   (M weakly dominated by T).
          *   If M eliminated: Col plays R (to hit B)? No, this gets messy fast.
      *   **Simpler:** Just state the theorem. "With Weak Dominance, eliminating Strategy A might make Strategy B look good, which changes whether A was actually good. With Strict Dominance (and Mixtures), the destination is always the same."
      *   Show a $2 \times 2$ where eliminating a weakly dominated strategy changes the Nash Equilibrium. (e.g., Battle of the Sexes with a weak option).
      *   **Time Saver:** Just draw the payoff hull. Show how a weak dominance line touches the payoff polygon, allowing multiple paths.

  **1:20 – 1:30: The 3-Player Claim & Wrap**
  *   Address the guy's claim.
  *   Verdict: **He is right.**
  *   Explanation: In 2-player games, "Strictly Dominated" $\iff$ "Never a Best Response." In 3-player games, "Strictly Dominated" $\implies$ "Never a Best Response," but the reverse fails *if* you assume opponents play independently.
  *   **Why:** Dominance checks against *all* probability distributions over opponent profiles (including correlated ones). "Best Response" usually checks against independent product strategies (Nash).
  *   **Advice:** Do not make this an activity. It requires explaining correlated beliefs over joint opponent states. Put this in the "Parking Lot" or as a footnote for the superfan. It is a 5-minute verbal aside max.

  ### 4. Troubleshooting: What Goes Wrong

  **1. The Variance Inversion**
  *   *Risk:* A "Mid" player gets lucky and beats a "Mix" player.
  *   *Fix:* The **Rationality Bonus**. If someone played Mid and won, but another table writes down the dominance proof, the proof-writers get the topic choice. Explicitly decouple "Winning the Game" from "Understanding the Game."
  *   *Verbal Shield:* "If you played Mid and won, you got lucky. If you played Mid and lost, you got punished. If you played Mix and won, you got rewarded. If you played Mix and lost, you got unlucky. The math doesn't care about your luck."

  **2. The "I Can't Flip Coins" Problem**
  *   *Risk:* People are bad at randomizing. They alternate T-B-T-B predictably.
  *   *Fix:* Tell them "If you want to mix, write down 'Coin Flip' on your sheet and actually flip." Or, allow them to play Pure strategies but aggregate their choices post-hoc. "If you played Top 3 times and Bot 2 times, your score is the average." (This is harder to administer).
  *   *Best Fix:* Rely on the **House Opponent** phase. If they play against you (50/50), their randomization doesn't matter for the *expectation* calculation in the debrief.

  **3. The Superfan**
  *   *Risk:* He shouts "Mid is dominated by a mix!" in Round 1.
  *   *Fix:* Pull him aside before the session. "I know you know this. I need you to let the room bleed for 20 minutes. Your job is to ask questions during debrief, not give answers."

  ### 5. What They Can't Get From Playing (The Whiteboard Necessity)

  You cannot play your way to the **Convex Hull** intuition.
  *   **The Limitation:** Playing shows them *one* mixture works (50/50). It does not show them *why* we check mixtures at all.
  *   **The Supply:** You must draw the payoff polygon.
      *   Plot Left Payoff on X-axis, Right Payoff on Y-axis.
      *   Top = (10, 0). Bot = (0, 10). Mid = (2, 2).
      *   Draw the line between Top and Bot.
      *   Show that Mid lies *inside* the triangle formed by the origin and that line.
      *   **Say this:** "You can't check every mixture. There are infinite coins you could flip. But geometry guarantees that if a point is inside the hull of other points, it's dominated. You aren't expected to find the perfect coin; you're expected to know the coin exists."

  ### 6. Verification of the 3-Player Claim

  **Is he right?**
  Yes.
  *   **2-Player:** A strategy $s_i$ is strictly dominated (by a mixed strategy) if and only if it is never a best response to any belief about the opponent's strategy. (Pearce's Lemma).
  *   **3-Player:** A strategy $s_i$ is strictly dominated if and only if it is never a best response to any **correlated** belief about the opponents' joint strategies.
  *   **The Catch:** In Nash Equilibrium analysis, we assume opponents play **independently**.
  *   **The Gap:** There exist strategies in 3-player games that are never a best response to any *independent* profile of opponent strategies, but are *not* strictly dominated (because they would be a best response to a *correlated* profile).
  *   **Stageability:** **Zero.** Explaining "correlated beliefs over joint opponent strategy profiles" to a mixed-ability room in <5 minutes is impossible. It will drain the energy from the room.
  *   **Recommendation:** Validate his claim verbally ("You are technically correct, which is the best kind of correct"), explain the "Independent vs Correlated Beliefs" distinction in one sentence, and move on. Do not make it an activity.

  ### Summary Checklist for You
  1.  **Handout:** The $3 \times 3$ Matrix (Row: T/M/B, Col: L/C/R). Payoffs: Row(10,0 / 2,2 / 0,10), Col(5,0 / 5,0).
  2.  **Props:** Coins for tables. Whiteboard for the Convex Hull drawing.
  3.  **Incentive:** Topic Choice + Chocolate + "Rationality Bonus" for the proof.
  4.  **Script:** "Don't tell them about the mix. Let them feel safe in the Middle. Then take the floor away."
