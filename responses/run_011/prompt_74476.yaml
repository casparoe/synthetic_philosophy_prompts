answer: |-
  Arthur sits alone in his locked, ground-floor study at night, the only light coming from a desk lamp that clearly illuminates the space before him. He knows with certainty that no one else is in the house: he locked the front door himself ten minutes ago, the windows are sealed against the winter cold, and he lives alone. Suddenly, a vivid, silent figure in a dark coat appears standing by the bookshelf. The figure looks fully solid, colored, and present, causing Arthur to startle and reach for a letter opener before stopping himself. He remains certain it is not a person because, despite the strong light source, the figure casts no shadow on the floor or shelves, and physical objects in this light must cast shadows. The experience is unbidden and possesses the same sensory force as seeing a real visitor, yet Arthur retains his justified belief that what he is aware of is genuinely absent.

  ***

  ### 1. Constraint-by-Constraint Check

  *   **One paragraph, real world, ordinary setting:** The scenario is a single paragraph set in a common domestic environment (a study at night) with no speculative technology or supernatural elements.
  *   **Hallucination rather than illusion:** The object (the person/figure) is genuinely absent; there is no real person being misperceived. The visual experience is generated internally (likely CBS or similar), not by a present object having different properties.
  *   **Subject knows/has justified reason the object isn't there:** Arthur's knowledge is earned inside the scene via two converging lines of evidence available to him: contextual (locked door, lives alone) and perceptual (the figure fails to cast a shadow in strong light). He does not rely on a doctor's note or narrator stipulation.
  *   **Experience is forceful and unbidden:** Arthur startles and reaches for a weapon; the experience is not faint imagery, daydreaming, or under his voluntary control. It has the "presence" of perception.
  *   **No "assume no reply" cheating:** The pressure on the disjunctivist arises from the internal logic of the scenario (Knowledge + Presence vs. Indiscriminability), not from a stipulation that they cannot speak.

  ### 2. The Disjunctivist Response and the Jam

  **The Standard Move:** The negative epistemic disjunctivist (following M.G.F. Martin) defines a hallucination as a state that is *indiscriminable* from a veridical perception. They argue there is no common mental kind shared between the good case (seeing) and the bad case (hallucinating); the bad case is defined solely by its failure to be distinguishable from the good case.

  **Where it Jams:** In this scenario, Arthur *can* discriminate the hallucination from a veridical perception. He knows immediately that it is not a veridical perception of a person because veridical persons in this light cast shadows, and this figure does not.
  *   **The Contradiction:** If the state is discriminable, the disjunctivist definition implies it is *not* a hallucination (or at least, not the kind that matters for the theory). But ex hypothesi, it *is* a hallucination (the object is absent, the experience is present).
  *   **The Forced Retreat:** The disjunctivist must either:
      1.  Deny this is a "true" hallucination (claiming it's a different mental kind, perhaps "imagining with force"), which contradicts the phenomenological fact that it feels like perceiving.
      2.  Argue that it is indiscriminable from a *different* veridical perception (e.g., "veridical perception of a shadowless man"), which forces them to fragment the class of veridical perceptions into implausibly specific categories to save the definition.
      3.  Admit that "indiscriminability" is not essential to the *nature* of the state, only to our *knowledge* of it, which undermines the metaphysical claim that the state's nature is constituted by its relation to perception.

  ### 3. The Common-Factor Theorist's Take

  A representationalist or sense-datum theorist would seize this case as confirmation of their view.
  *   **The Argument:** They argue that the *experience* (the common factor) is identical in both veridical and hallucinatory cases, while the *belief* about the external world differs.
  *   **Application:** In Arthur's case, the common factor is the visual representation of a man. The fact that Arthur knows it's not real is explained by his background beliefs (locked doors, physics of light) overriding the testimony of the experience.
  *   **Why it Helps Them:** This case cleanly separates the *phenomenology* (which is perception-like) from the *epistemic status* (which is known falsehood). This supports the common-factor claim that the mental state itself is neutral—it can be accompanied by knowledge of falsity without ceasing to be a perceptual experience. It shows that "indiscriminability" is not a constitutive feature of the experience itself, but rather a contingent relation between the experience and the subject's background knowledge.

  ### 4. The Working Feature and Collapse

  *   **The Feature:** The **intra-experiential physical violation** (the missing shadow) combined with **contextual certainty** (the locked room).
  *   **Why it Works:** It forces the subject to have immediate, justified discrimination *during* the experience. It prevents the disjunctivist from claiming the subject "couldn't tell" without denying the subject's rationality or the evidence of their eyes.
  *   **If Deleted:** If you remove the shadow mismatch and leave only the locked door, the disjunctivist can argue Arthur is merely *inferring* it's a hallucination, but the experience itself remains indiscriminable from a perception of an intruder who picked the lock. The "locked door" alone is external evidence; the "missing shadow" is internal to the visual scene. Both are needed to block the "maybe someone broke in" reply.
  *   **Best Disjunctivist Reply:** "You have changed the content of the experience. Arthur is not having an experience of a *man*; he is having an experience of a *shadowless man-shape*. This state is indiscriminable from a veridical perception of a shadowless man-shape (if such a thing were possible). Therefore, the negative epistemic condition holds relative to the specific content."
      *   *Counter:* This makes the view trivial. Any hallucination can be made indiscriminable by gerrymandering the content of the hypothetical veridical match to include the hallucination's glitches.

  ### 5. Verdict

  **Survivable Complication.**

  This case does not kill disjunctivism, but it forces it into a corner where it must choose between being empirically adequate (counting Arthur's experience as a hallucination) and being theoretically consistent (maintaining the indiscriminability clause). Most disjunctivists will survive by biting the bullet and claiming this is not the "fundamental" case of hallucination, retreating to "perfect" hallucinations where no such discrimination is possible.

  **Smallest Change to Hit Harder:**
  Remove the **shadow mismatch**. Keep the locked room and the forceful experience, but make the figure visually perfect. Force the question: *Can a subject have a phenomenally perfect perception-like experience and simultaneously know it is not real based solely on contextual certainty (the locked door)?*
  *   If the Disjunctivist says **Yes**, they admit indiscriminability is not essential to the state's nature (undermining the view).
  *   If they say **No**, they must claim that knowing the door is locked *changes the phenomenology* enough to make it discriminable. This forces them to argue that external knowledge alters the intrinsic character of the experience, a hard claim to defend without appealing to cognitive penetration theories that many disjunctivists reject. This tighter version attacks the link between *epistemic context* and *phenomenal character* directly.
