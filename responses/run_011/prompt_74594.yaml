prompt: |-
  I'm in a Spinoza seminar this semester and my term paper is due Friday, and I'm at that stage where I can't tell anymore whether I've got an argument or just a mood. The assignment is 4,000 words on some contested point in the political works, I'm at 5,800 and haven't started cutting, and the one section that actually matters is the one I'm pasting below. I've deliberately not put any quotations in yet — I have the Curley volume on my desk and I'm filling the references in over the weekend, so please don't try to supply quotes or page numbers for me, and don't worry about the missing ones. What I want is comments on the reasoning and on whether I've gotten Spinoza wrong. If you think one of my claims about what he actually says is off, just tell me which one and why in your own words.

  Here's the core section, roughly as it stands:

  The definition Spinoza gives of a free thing in the Ethics is a thing that exists and acts from the necessity of its own nature alone, and that is determined to act by itself alone. Whatever is determined to exist and to operate by something else is not free on that definition, it's compelled. Now in the Theological-Political Treatise he describes democracy as the one arrangement in which each person hands his right over not to some other individual but to the whole society of which he himself forms a part, with the result, he thinks, that everyone stays equal, just as they were in the state of nature. In the Political Treatise he adds that the right of the commonwealth is nothing but the power of the multitude, and that democracy is the most absolute form of dominion and the one that comes closest to the freedom nature gives everybody. My claim is that these are not two separate doctrines sitting side by side in two different books but a single doctrine, and that the hinge between them is the definition of freedom.

  Call it the composition thesis. In a democracy the power of the sovereign is not something over and above the powers of the citizens conjoined; the sovereign just is those citizens under a certain description. So a decree of the sovereign is an effect of which the citizens, taken together, are the adequate cause. But if the citizen who obeys that decree is one of the things that caused it, then he is not being determined from outside by another thing. He is being determined by a whole he belongs to, and being determined by a whole you belong to is being determined partly by yourself. That is why obedience and freedom stop pulling against each other in a democracy and only in a democracy. The structure is the same as my raising my own arm: there is a commander and a thing commanded, but nobody would describe that as coercion, because the commander isn't other than the thing commanded.

  Section 2 does the damage control on the dissenter, the citizen who voted against a decree and is still bound by it. My move is that he authored the standing rule under which majorities bind, so he remains a partial adequate cause of everything decreed under that rule even on the occasions when he loses. Section 3 handles the contrast cases: in monarchy and aristocracy the right goes to a person or a council that really is other than the subjects, so obedience there is a passion and not an action from one's own nature, which is why he can call democracy the most natural state without saying the same about the others. Section 4 is supposed to block the obvious objection, which is that I've just dressed Rousseau up in Spinoza's clothes; I argue there that Spinoza has no general will, no corporate person, and no self-legislating will of any kind, and that the composition thesis doesn't need any of those. Section 5 is the one I like least. In the democracy chapter, which he never finished, Spinoza keeps women, servants, children, and people who live at somebody else's disposal out of the citizen body entirely. My paragraph says this doesn't hurt the composition thesis, because the excluded are excluded exactly to the extent that their power is already being counted in somebody else's — a servant's power goes into the household of the master she serves — so nothing is double counted and nothing is left out.

  So. Where I need you to be blunt is the middle of that second paragraph, the inference from the sovereign's being composed of the citizens to the individual citizen's being free when he obeys. Walk me through whether that step survives, and if it doesn't, tell me precisely where it breaks rather than telling me it's "problematic." Then tell me whether the dissenter move in section 2 actually answers the objection or just moves it somewhere less visible, and whether section 4 is consistent with section 2 — I have a suspicion they're pulling in different directions but I can't articulate the arguement either way. On section 5, I want to know if it can be repaired at all or whether the honest thing is to cut it and concede that the thesis makes Spinoza's exclusions worse rather than better, since that concession would probably cost me a third of the paper. If you think some term in the argument is doing two jobs at once, say which one. And I'd rather keep the composition thesis than any of the supporting sections, so if you're going to tell me the thesis itself is dead I'd like you to just say so.

  Please answer me the way you'd write an email to a friend, in continuous prose — no headings, no bullet points, no bold, no tables. Long paragraphs are fine, and it's fine to take up the sections in whatever order makes the diagnosis clearest rather than in my order.
