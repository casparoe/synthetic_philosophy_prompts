answer: |-
  **Case A**
  Alex lives from age 20 to 60. Psychological connectedness is robust: memories link smoothly, intentions carry forward, and character remains stable. The cause is ordinary biological functioning. Alex reports high life satisfaction, maintains relationships, and functions well under stress. Phenomenologically, however, every experience carries a stance of appropriation. Pain is "*my* pain"; success is "*my* achievement." This identification is pervasive and automatic, coloring every moment with a sense of ownership. Alex notices nothing unusual and knows no philosophical doctrine.

  **Case B**
  Blake lives from age 20 to 60. Psychological connectedness is identical to Alex's: same memories, intentions, character, and causal chain. Blake reports identical life satisfaction and functions equally well. Blake underwent a modest clinical protocol that eliminated appropriation. Pain and success occur with identical intensity and memory, but without the grip of identification. Events arise and pass; nothing is claimed. Blake knows no doctrine, is unaware of Alex, and experiences no sense of loss regarding the missing ownership stance.

  **Verdicts**
  Parfit's account gives the same verdict for both. What matters in survival is Relation R—psychological connectedness and continuity with the right cause. Since Alex and Blake match perfectly on memories, character, and causal chains, Parfit must say survival matters equally. The presence or absence of an "ownership" feeling does not alter the degree of connectedness. For Parfit, reducing the self leaves Relation R as the source of value; phenomenological texture regarding ownership is irrelevant to identity.

  The Buddhist no-self analysis gives different verdicts. Both lack a substantial self, but Alex remains bound by *upadana* (clinging/grasping). Alex's appropriation of aggregates generates *dukkha* (suffering/unsatisfactoriness), even amidst reported happiness. Blake, free from appropriation, is liberated. The metaphysical denial of self is identical, but the value differs because the cause of suffering is the clinging stance, not the self itself.

  **Variant**
  If Blake's non-clinging stems from an implant rather than insight, the Parfitian verdict holds (Relation R is unchanged). The Buddhist verdict breaks. Liberation requires understanding reality, not merely suppressing the symptom. An implant leaves underlying ignorance intact, meaning the potential for suffering remains even if currently dormant.

  **Assessment**
  The divergence turns on the normative weight assigned to phenomenology. This does not refute Parfit's convergence claim; it shows the projects differ. Parfit asks, "What matters in survival?" Buddhism asks, "What ends suffering?"

  **Strongest Parfitian Attack:** This smuggles a welfare claim into a criterion of survival. If secular wellbeing is matched, "clinging" is just a qualitative difference, not a difference in what matters for identity. You are changing the subject from survival to quality of life.

  **Strongest Reply:** In the Buddhist framework, the quality of life *is* determined by the stance toward identity. You cannot separate the "what matters" from the "how experienced" because the experience of ownership constitutes the suffering that makes survival problematic in the first place.
