answer: |-
  There is no single, universally canonical term like "Goodhart's Law" for this specific phenomenon. However, the most precise conceptual handle available—one that will hold up under scrutiny without requiring a philosophy degree to defend—is **The Legibility Penalty**.

  This term draws on the political anthropologist James C. Scott's concept of "legibility" (from *Seeing Like a State*), but tightens it for your specific allocation problem. Scott argued that institutions (states, corporations, charities) cannot manage complex reality directly; they must simplify it into standardized data (maps, surnames, metrics) to "see" it. Those who fit the standard are legible; those who don't are illegible.

  **Definition for your column:**
  > **The Legibility Penalty** is the systematic disadvantage faced by agents whose actual value is high, but whose capacity to render that value into an institution's preferred format (metrics, narratives, forms) is low or costly. It occurs when an allocator maximizes the *record* of value rather than value itself, not because the metric is corrupted, but because the cost of producing the metric is unevenly distributed.

  ### Ruling Out Your Suspects

  You are right to be skeptical of the usual suspects. Here is why they don't fit, and why Legibility does:

  *   **Goodhart's Law (Ruled Out):** Goodhart's Law states that "when a measure becomes a target, it ceases to be a good measure." This implies the metric itself breaks or gets gamed (e.g., teachers teaching to the test). In your cases, the metric is faithful *where it exists*. The patient-reported measures accurately reflect the suffering of the media-savvy groups. The failure isn't metric corruption; it's **metric access**. Goodhart is about the map becoming wrong; The Legibility Penalty is about the map only covering the roads some people can afford to pave.
  *   **Expensive Tastes (Ruled Out):** This objection (from Dworkin/Cohen) concerns people who cultivate costly preferences and demand compensation. Your claimants aren't demanding compensation for preferences; they are failing to signal production. This is about **signaling capacity**, not consumption habits.
  *   **Adaptive Preferences (Ruled Out):** This (from Sen/Nussbaum) is about people in bad circumstances lowering their internal expectations ("I don't need much"). Your case is the external mirror: the need is real, but the **voice is missing**. Adaptive Preferences is about wanting less; The Legibility Penalty is about being heard less.

  ### The Sloppy Collapse

  If you leave this undefined, a sloppy writer (or editor) will collapse it into **Goodhart's Law**.

  **What is lost in that collapse:**
  Goodhart's Law suggests the solution is to find a *better* metric. The Legibility Penalty suggests the solution is to subsidize the **cost of proof**. If you treat it as Goodhart's, you will spend your time tweaking the dashboard. If you treat it as Legibility, you realize you need to provide grant-writing support to the inarticulate, or accept narrative testimony from the diffuse groups. The error shifts from *measurement design* to *structural access*.

  ### Two Boundary Cases

  **1. Looks like it, but isn't: Fraudulent Signaling.**
  A claimant fakes their data to look productive.
  *   *Why it's different:* This is active deception, not a structural cost barrier. The Legibility Penalty assumes the claimant is honest but structurally disadvantaged. Fraud is a security problem; Legibility is an equity problem.

  **2. Is it, but doesn't look like it: Algorithmic Training Bias.**
  An AI hiring tool rejects qualified candidates from non-standard career paths because their resumes don't match the "successful" pattern in the training data.
  *   *Why it fits:* The candidates have equal value (potential), but their history is "illegible" to the model's proxy. The model isn't "biased" in a human prejudice sense; it simply cannot parse value that doesn't fit its legibility standards. It is the exact same mechanism as your grant panel, just automated.

  ### Summary for your Draft
  You can drop this into your paragraph with confidence:

  > "This isn't Goodhart's Law, where the metric itself gets corrupted by being targeted. It's what we might call **The Legibility Penalty**. The metric works fine, but it only registers value that is cheap to describe. The allocator isn't rewarding rhetoric on purpose; they are simply starving the projects that are expensive to prove."
