prompt: |-
  So I got into a three-hour argument with my roommate last night about drained marshes and I still don't think he gets it, and I want to see the case made better than I made it at 1am. Setup, and please just grant all of it — I don't want the argument to turn on disputing my numbers, becuase that's exactly where the conversation kept going in circles. Two cases. In A, a 10,000-acre coastal marsh gets drained: 3,000 acres become a managed wetland with water-level control, some supplemental feeding, and active predator and parasite management, and the rest becomes row crops. Total wild-animal biomass on the site drops 80%. The animals who remain have, by stipulation, clearly net-positive and much better lives than their predecessors — no overwinter starvation, parasite loads way down, nest predation way down. In B, the same marsh is legally protected in perpetuity but sliced into about 40 fragments by roads and exurban lots. Total animal numbers hold steady, maybe up 10%, and average welfare goes down hard: edge effects, feral cats, cowbirds, roadkill, more broods lost to raccoons. Stipulate further that nobody's rights are violated in either case, there are no human welfare or property interests to weigh in, both outcomes are irreversible, and welfare across the two cases is genuinely comparable.

  The position I want argued, as strongly as you honestly can: B is the worse outcome all-in and A is the better one — fragmentation-style "preservation" can be worse for wild animals than outright habitat destruction, once you take per-capita welfare and the lives-never-lived seriously instead of just counting animals. Here's where my roommate dug in, and it's the part I actually want you to wrestle with. First, he says comparing A and B requires solving population ethics before you can say anything, and since nobody's solved it the comparison is indeterminate, so we default to protecting habitat as the "precautionary" move. I think that's wrong twice over: the ranking holds across a wide range of axiologies, and the default-to-preservation move isn't precaution at all, it's status quo bias wearing a safety helmet. So build the argument so it survives whether you're a totalist, an averagist, a person-affecting view, or something in between, and say out loud which of those four it's weakest under. Second, he kept reaching for integrity and wildness and "the marsh is worth more than the animals in it" — take that seriously rather than swatting it, then explain why on my stipulations it still doesn't flip the ranking, or concede the specific version of it that does.

  Format, please: lead with a **Bottom Line** of 4-6 sentences giving the conclusion and naming the single consideration doing most of the work. Then **The Argument** — five to seven numbered premises, one or two sentences of support each, no padding. Then **Robustness Check** — a short paragraph for each of the four population-ethical views saying whether the A-over-B ranking holds under it, and which one is the soft spot. Then **Steelman the Integrity Objection** (200-300 words on the strongest non-welfarist case for B) followed by **And Why It Still Loses** — or, if you think it wins, say so and say which version wins. Close with **What Would Break This**: three specific claims or findings that, if true, would flip me. Keep the whole thing under about 1,200 words, no citations or reading list (I can't look anything up anyway), and don't hedge into "it depends" — I know it depends, I want the strongest version of one side.
