      *(Self-Correction during drafting)*: I need to make sure I don't just say "it's false." I need to explain *why* it fails to support the specific conclusion about global history. For instance, even if victors write the history, does that mean it's *European* history? Not if the victor was the Ottoman Empire. So the "Victor" = "European" equation is another hidden slip. I should add a claim about the identity of the victor.

      *New Claim Idea:* The "Victor" is invariably European in this context.
      *Status:* Substantive/Doubtful (In Indian Ocean, Europeans were often just one armed trading group among many, not always "victors" in a sovereign sense).

      *Refining the "Self-Undermining" point:* If the classmate argues we can't trust Portuguese records because they are victors, they imply we *could* trust non-victor records. But if the slogan means *only* victors write, there are no non-victor records. So the slogan destroys the basis for the critique.

  9.  **Final Polish:**
