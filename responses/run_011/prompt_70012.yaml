      *   Conclusion (The Surviving Constraint).

  8.  **Drafting Content - Specific Checks:**
      *   *Check:* Did I classify status correctly? (Truism vs. False).
      *   *Check:* Did I address the "European history in disguise" conclusion for each?
      *   *Check:* Did I handle the Indian Ocean context (Portuguese/Dutch/Ottoman/Swahili)?
      *   *Check:* Is the tone appropriate (graduate seminar level, analytical, precise)?
