      *   Follow-up 2 (Entrenchment)? (Addressed).

      *Let's write.*
answer: |-
  The hole is in **Step 3**, but the structural collapse actually happens between **Step 1 and Step 2**.

  Your roommate is running a classic "Epistemic Democracy" argument. It is seductive because it uses a mathematical theorem (Condorcet) to solve a normative problem (legitimacy). It feels rigorous. But it relies on a sleight of hand regarding what "competence" means and a misunderstanding of the mathematical preconditions of the theorem itself.

  Here is the breakdown of why Step 3 is the kill shot, why your instinct to save Step 3 and kill Step 6 is unstable, and the answers to your follow-ups.

  ### The Main Hole: Step 3 (and the Step 1–2 Bridge)

  **The Claim:** *"Denying this [that voters are better than chance] is circular: to show that voters are systematically worse than chance you'd already have to know the right answer... and if you knew that you wouldn't need the vote."*

  **Why it looked innocent:**
  This is a brilliant rhetorical trap. It exploits our fear of elitism. It sounds like your roommate is saying, "Trust the people." It shifts the burden of proof onto you to prove the voters are *wrong* on specific issues to prove they are *incompetent* generally. It feels undemocratic to demand proof of voter incompetence before allowing a vote. It frames skepticism as arrogance.

  **Why it is false:**
  This confuses **outcome validity** with **process reliability**.

  1.  **The Circularity Charge is False:** You do not need to know the *Truth* to assess the *reliability of the mechanism*.
      *   *Analogy:* I don't need to know tomorrow's lottery numbers to know that buying a ticket is a negative-expected-value investment. I can assess the *process* (the odds, the independence of draws) without knowing the *outcome*.
      *   Similarly, we can assess voter competence *ex ante* based on information asymmetry, cognitive load, and incentive structures. If a referendum asks voters to decide on the technical nuances of derivatives regulation, we can judge $p < 0.5$ based on the complexity of the subject matter relative to public knowledge, without knowing the "right" regulatory outcome.

  2.  **The Independence Assumption (The Math Breaker):**
      *   Condorcet's Jury Theorem (Step 1) has a strict mathematical requirement: **Independence.** Voter A's probability of being right must not be influenced by Voter B.
      *   Step 2 claims referendums fit this model. They do not.
      *   In modern referendums, votes are highly **correlated**. People watch the same news, are targeted by the same ad campaigns, and vote along partisan lines.
      *   **The Consequence:** When votes are correlated, the "wisdom of crowds" effect vanishes. The majority does *not* converge on certainty as $N$ increases; it converges on the bias of the dominant signal (the media/campaign). If the campaign is misleading (and $p < 0.5$ for the information environment), adding more voters just makes the error more confident, not less.
      *   Your roommate's Step 3 ignores the *source* of the competence. It assumes competence is an intrinsic property of the voter. In reality, competence is a function of the *information environment*. If the environment is polluted (which is the norm in referendums), $p$ drops below 0.5 regardless of voter intelligence.

  ### The Cost of Rejecting Other Steps

  You asked what you'd be giving up if you rejected a different step.

  *   **If you reject Step 1 (CJT):** You lose the mathematical engine. You have to argue for democracy on purely moral grounds (fairness, equality) rather than epistemic ones (truth-tracking). This is a strong position (proceduralism), but it concedes the roommate's point that referendums aren't "smarter" than parliaments, just "fairer."
  *   **If you reject Step 5 (Legitimacy = Truth Tracking):** This is the most philosophically robust move. You argue that legitimacy comes from *consent* and *participation*, not correctness.
      *   *Cost:* You lose the ability to say a referendum result is "objectively binding" because it is *right*. You can only say it is binding because we agreed to play by these rules. This undermines Conclusion 7 (that repellant plebiscites were probably correct).
  *   **If you reject Step 6 (Bindingness) but keep Step 3 (Competence):**
      *   *This is your preference.* You want to say voters are competent, but the result shouldn't be absolute.
      *   *The Problem:* This is logically unstable. If you accept 1–5, Step 6 is a mathematical necessity. If the referendum is the *most reliable truth-tracking device available* (per Step 4), then overriding it with a less reliable device (Parliament) is **epistemic sabotage**.
      *   To reject 6 while keeping 3, you must admit that Truth-Tracking is not the *only* value. You must introduce a competing value (e.g., Minority Rights, Stability, Deliberation). But if you do that, you have implicitly rejected Step 5. You cannot have it both ways.

  ### Follow-Up 1: If (3) goes, is there an *epistemic* case left?

  Yes, but it changes the architecture.

  If you reject the claim that the *raw vote* is competent (Step 3), you cannot rely on the "aggregation of ignorance" model (CJT). You must move to a **Deliberative Epistemic** model.

  *   **The Argument:** Voters are not initially competent ($p$ might be $< 0.5$), but through structured deliberation, hearing experts, and revising preferences, their $p$ increases *before* the vote.
  *   **The Difference:** This doesn't support Conclusion 7 (that past plebiscites were right). In fact, it suggests most raw plebiscites are *wrong* because they lack deliberation. It supports referendums only if they are the *end* of a process, not the *start*.
  *   **Re-grounding:** It shifts the ground from "The Crowd is Wise" to "The System can Learn." This aligns better with representative democracy (where deliberation happens in parliament) than direct democracy (where it happens in 30-second ad spots).

  ### Follow-Up 2: Is (8) really consistent with (1)–(5)?

  Your instinct is correct: **No, (8) is inconsistent with (1)–(5).** This is a devastating internal contradiction in your roommate's thesis.

  *   **The Logic:** Steps 1–5 justify referendums on the grounds of **Truth-Tracking**.
  *   **The Contradiction:** Truth-tracking systems require **feedback loops**. Science is reliable not because experiments are entrenched, but because they are *replicable and revisable* in light of new evidence.
  *   **Entrenchment (Step 8)** assumes the "Truth" discovered at Time A is static and immune to new information at Time B.
  *   If the justification for the referendum is epistemic (it finds the right answer), then the system must prioritize *correcting errors*. Entrenchment prioritizes *stability over correction*.
  *   **The Trap:** If your roommate insists on (8), they are admitting that the value of the referendum is not actually Truth (Step 5), but **Will** (popular sovereignty). If it's about Will, then the Condorcet argument (Step 1) is irrelevant. You can't use math to prove your Will is superior, and you can't use Truth to justify freezing your Will.

  ### Summary of the Attack Plan

  1.  **Hit Step 3 on the Circularity Claim:** Tell him he is conflating *knowing the answer* with *assessing the test conditions*. We can know a thermometer is broken without knowing the exact temperature. We can know voters are misinformed without knowing the exact policy solution.
  2.  **Hit the Independence Assumption:** Condorcet's theorem mathematically fails if votes are correlated. Referendums are the *most* correlated voting environments (media, campaigns). Therefore, the math in Step 1 does not apply to Step 2.
  3.  **Expose the Entrenchment Contradiction:** If he believes in Truth-Tracking, he must believe in Revisability. Entrenchment is an admission that the system values "The People's Will" over "The Right Answer." He has to pick one: Epistemic Democracy (revisable) or Populist Sovereignty (entrenched). He cannot claim both.

  **Your Move:** Tell him you're willing to accept that voters are competent (Step 3), but only if he abandons the claim that the *raw vote* is the competence mechanism. If competence requires information and independence, then a referendum without deliberative filters is mathematically guaranteed to fail Condorcet's requirements. Therefore, the "bindingness" (Step 6) and "entrenchment" (Step 8) are unjustified by his own epistemic logic.
