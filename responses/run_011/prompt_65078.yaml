answer: |-
  ### Brainstorming the Dimensions

  Let's lay the cards on the table. You are asking for a diachronic principle of rationality that distinguishes *updating* from *capitulating*. The tension in your cases arises because you are mixing three distinct normative frameworks: (1) **Internalist Rationality** (am I acting on my current best judgment?), (2) **Planning Agency** (am I honoring my past commitments?), and (3) **Welfare** (did this turn out well?).

  Here is how the candidate dimensions split your cases:

  *   **Judgment vs. Desire (Davidson):** Did you act against your all-things-considered judgment at $t$?
      *   *Separates:* Case 1 (judgment holds, desire wins) vs. Case 2 (judgment changes).
      *   *Fails:* Case 4. At the moment of signing the consulting contract, your judgment likely *was* "escape this pain." If we rely solely on concurrent judgment, Case 4 is rational updating, not akrasia. This dimension cannot explain why the past self has authority over the present self.
  *   **Resolution vs. Wish (Holton):** Was there a specific intention to resist temptation, or just a preference?
      *   *Separates:* Case 9 (Partner's resolution vs. Cousin's wish). This is strong. It explains why 11 (chronic "tomorrow") is tricky—it lacks a stable resolution, yet you call it akrasia.
      *   *Fails:* Case 3 vs. 4. Both involved past intentions. The difference isn't the *existence* of the resolution, but the *legitimacy of abandoning it*.
  *   **Foreseeability & New Information:** Did the situation change in a way the past self would recognize as relevant?
      *   *Separates:* Case 10 (Mom needs help = new info; Drink = same state). Case 3 (10 years of life experience = new info) vs. Case 4 (Rough semester = temporary state, not new info).
      *   *Fails:* Case 6 vs. 7. At the moment of decision, the information set is identical. If foreseeability is the key, 6 and 7 must have the same status. Your intuition that 7 is *not* weakness of will relies on outcome luck, which is anathema to a principle of rationality.
  *   **Endorsement/Shame (Retrospective):** Does the later self regret the deviation?
      *   *Separates:* Case 1 (shame) vs. 2 (no shame); Case 3 (no regret) vs. 4 (shame).
      *   *Fails:* It invites the circularity you fear. Is it akrasia because I'm ashamed? Or ashamed because it was akrasia? If we use this as the *definition*, we lose normative bite. It must be a *symptom*, not the criterion.
  *   **Cold vs. Hot States (Visceral Factors):** Was the deviation driven by a transient physiological or emotional state?
      *   *Separates:* Case 5 (11:50 AM urge), Case 9 (Drinking urge).
      *   *Fails:* Case 10. Both 3pm selves are "calm." One wants to help mom, one wants a drink. The distinction isn't heat; it's the *source* of the preference shift (external need vs. internal craving).
  *   **Discounting Shape (Case 8):**
      *   *Separates:* Immediate vs. Delayed trade-offs.
      *   *Fails:* As you noted, hyperbolic discounting predicts inconsistency in both. The asymmetry must come from *uncertainty* or *liquidity*, not the curve itself.

  **The Core Insight:** The principle cannot be about whether you changed your mind. You are allowed to change your mind. The principle must be about *why* you changed your mind. Weakness of will is not preference reversal; it is **preference reversal driven by a mechanism the agent's past self would have vetoed as irrational.** It is a failure of *diachronic authority* where the present self's "new" preference is recognized as noise, not signal.

  ***

  ### The Principle: Diachronic Rationality with Veto Power

  Here is the principle I propose. It is a hybrid of Holton's resolution theory and a sophisticated economic view of information updating.

  **The Principle of Diachronic Integrity:**
  An agent exhibits weakness of will at time $t_2$ if and only if:
  1.  **Prior Commitment:** At $t_1$, the agent formed a resolution to $\phi$ (or not $\psi$) intended to bind future conduct.
  2.  **Absence of Relevant New Information:** At $t_2$, the agent abandons the resolution without acquiring information that the $t_1$ self would have accepted as a valid reason for revision.
  3.  **Visceral or Distortion Mechanism:** The abandonment is causally driven by a shift in visceral valuation (urge, fatigue, fear) or discounting that the $t_1$ self would have classified as a distortion rather than a genuine value update.
  4.  **Counterfactual Endorsement:** If the $t_2$ agent were returned to the $t_1$ informational and visceral state (cold, informed), they would endorse the $t_1$ resolution over the $t_2$ action.

  #### Clause Breakdown

  **Clause 1 (Prior Commitment):**
  *   *Motivated by:* Cases 1, 5, 9.
  *   *What it buys:* Distinguishes weakness of will from mere impulse. The cousin in Case 9 had no resolution, only a wish. Case 11 is tricky here (see below), but generally requires a standing intention.
  *   *Cost:* Makes "akrasia" impossible for someone who never plans.

  **Clause 2 (Absence of Relevant New Information):**
  *   *Motivated by:* Cases 3, 4, 10.
  *   *What it buys:* This solves the 3 vs. 4 problem. In Case 3 (10 years later), you have *new information* about your values and life. The $t_1$ self would agree: "If in 10 years you find you hate academia, quit." In Case 4 (rough semester), the "information" is temporary stress. The $t_1$ self would say: "Don't quit because of one bad semester." It also solves Case 10 (Mom): The need for help is new, relevant info. The craving for a drink is not.
  *   *Cost:* Requires us to objectively assess what counts as "relevant info," not just what the agent feels.

  **Clause 3 (Visceral/Distortion Mechanism):**
  *   *Motivated by:* Cases 1, 5, 8, 9.
  *   *What it buys:* Explains why Case 8 is asymmetric. Taking $50 now vs. $60 in a week often involves liquidity needs or uncertainty (will the $60 actually arrive?). Taking $50 in a year vs. $60 in a year + week involves pure impatience. The $t_1$ self views liquidity as valid, but pure impatience as a distortion.
  *   *Cost:* Requires introspection on *why* I am choosing, not just *what* I choose.

  **Clause 4 (Counterfactual Endorsement):**
  *   *Motivated by:* Cases 1, 4, 10.
  *   *What it buys:* This addresses your circularity worry about shame. Shame is the *emotional recognition* of Clause 4. You feel shame because your cold self knows you violated the cold self's plan. It is not circular; shame is the epistemic access to the violation.
  *   *Cost:* Makes weakness of will partially dependent on the agent's own rational self-assessment.

  ***

  ### Blunt Critique of Your Verdicts

  I need to be blunt about where this principle forces you to abandon your intuitions.

  **1. You must give up the distinction between Case 6 and Case 7.**
  *   *The Damage:* At the moment you decided to go to the party, both cases are weakness of will. You abandoned a resolution ("write all weekend") without relevant new information (an invitation is not a reason to break a work resolution unless you treat socializing as higher priority, which you said you didn't).
  *   *The Argument:* You are conflating *rationality* with *luck*. Case 7 is **fortunate akrasia**. The fact that you met a collaborator is ex-post utility, not ex-ante rationality. If we define weakness of will by outcome, then a drunk driver who gets home safely didn't act weakly/foolishly, which is absurd. The agency was compromised in both; only the universe bailed you out in 7.

  **2. You must clarify Case 11 (The "Quit Tomorrow" Smoker).**
  *   *The Damage:* My Clause 1 requires a resolution. The chronic smoker says "tomorrow" but never forms a binding intention.
  *   *The Argument:* I argue this is **not** weakness of will in the strict sense; it is **incontinence without resolution**. However, to save your verdict, we can amend Clause 1 to include "recurring implicit commitment." But strictly speaking, if they never actually resolve, they are just acting on preference. I prefer to call this *habitual vice* rather than akrasia. Akrasia requires the *strain* of a broken resolution. If they feel no strain (as you say, "without feeling torn"), it's not akrasia. It's just smoking. I would argue your verdict on 11 is wrong if they feel no tension. If they feel tension but fail, it's akrasia.

  **3. The Circularity of Shame (Cases 3 vs. 4).**
  *   *The Verdict:* It is **not** circular.
  *   *The Argument:* Shame is not the *definition* of weakness of will; it is the *phenomenological marker* of recognizing Clause 4 (Counterfactual Endorsement). In Case 4, you feel shame because your cold self recognizes the "rough semester" was not valid grounds for quitting. In Case 3, you feel no shame because your cold self recognizes "10 years of life" *was* valid grounds. The shame tracks the objective fact of whether the information was relevant, not the other way around.

  ***

  ### Running the New Cases

  Here is how the principle applies to your three test cases.

  **(a) The Advance Directive (Lucid Revocation)**
  *   **Analysis:**
      *   *Clause 1:* Yes, prior resolution (directive).
      *   *Clause 2:* This is the pivot. Is the need for transfusion "new information"? Yes. But is the *fear* of death new information? No, the $t_1$ self anticipated death.
      *   *Clause 3:* Is the revocation driven by visceral fear (distortion) or a genuine re-evaluation of values (signal)?
  *   **Verdict:** If the patient is truly lucid and not panicking, and judges "Life is worth more than I thought," this is **not weakness of will**. It is rational updating (Case 3). The $t_1$ self should generally allow the $t_2$ self to update on the value of life, unless the $t_1$ self specifically bound themselves against *this* type of update (e.g., "Even if I beg, do not transfuse").
  *   **Doctors:** They should honor the *earlier* commitment **only if** they judge the current revocation to be driven by visceral panic (Clause 3 violation). If the revocation is calm and considered, the $t_2$ self has authority. Honoring the earlier one in a lucid revocation is paternalism, not protecting the patient from weakness of will.

  **(b) Naive vs. Sophisticated Procrastinator**
  *   **Analysis:**
      *   *Naive:* Believes they will start tomorrow. At $t_2$, they don't. They violate Clause 4 (if they were cold, they'd know they wouldn't start). They are **akratic**.
      *   *Sophisticated:* Knows they will procrastinate. Does the work early to avoid it. They do **not** violate any clause. They have aligned their $t_1$ and $t_2$ incentives. They are **not akratic**.
  *   **Welfare:** The Naive agent is worse off (they procrastinate and suffer). The Sophisticated agent is better off (they get the work done, perhaps with some anxiety, but avoid the crash).
  *   **Principle Check:** This falls out cleanly. Akrasia is the failure to manage the intertemporal conflict. The sophisticated agent manages it; the naive agent succumbs to it.

  **(c) The Cold Addict in Remission**
  *   **Analysis:**
      *   *Clause 1:* Implicit resolution to stay sober.
      *   *Clause 2:* No new information.
      *   *Clause 3:* This is the crux. You say "coldly and with no craving." This suggests it is a **judgment**, not a visceral urge.
      *   *Clause 4:* Would the cold self endorse the drink? The agent says "risk is worth it."
  *   **Verdict:** This is **not weakness of will**. It is **relapse via rationalization**.
  *   **The Difference from Case 9:** In Case 9, the partner says "one glass won't hurt" while *wanting* the drink (visceral). In Case (c), the agent judges the utility is positive.
  *   **Why it feels different:** It feels like a tragedy, not a failure of will. It is a **value collapse**. The agent has genuinely come to prefer the drink (Case 2). However, if this "cold judgment" is actually a post-hoc rationalization of a subconscious craving (which is common in addiction), then it *is* weakness of will (Clause 3 violation). But taking your description literally: if the valuation has genuinely shifted, it is not akrasia. It is a change of mind. The tragedy is that the change of mind leads to ruin, but the agency itself is intact.

  ### Summary of the Trade-off

  To have a principle that works, you must accept that **Weakness of Will is a structural failure of agency, not a moral failure of outcome.**

  *   **Keep:** The distinction between Resolution and Wish (Case 9).
  *   **Keep:** The distinction between New Info and Visceral Shift (Case 3 vs. 4, Case 10).
  *   **Sacrifice:** The intuition that Case 7 is not weakness of will. It is. It's just lucky.
  *   **Sacrifice:** The intuition that Case 11 is weakness of will *if* there is no tension. If there is no resolution and no regret, it is just habit.

  This principle protects the authority of the planning self without enslaving the experiencing self to dead hands, provided the experiencing self is acting on signal, not noise.
