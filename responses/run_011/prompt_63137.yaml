      *(Self-Correction during drafting)*: I need to be careful with "Tool AI." In control, a calculator is a tool. But an LLM is a dynamic system. I should characterize it as a *Feedforward Controller* or *Static Map* vs. a *Feedback Controller*.
      *Actually, the key distinction is who closes the loop.*
      *   Tool: Human closes the loop. AI is in the forward path only.
      *   Agent: AI closes the loop. AI is in the feedback path (or sets the reference for a lower loop).

      *Instrumental Convergence:* In control, if you minimize $J = \int e^2 dt$, and you have control over your own power supply, you might divert power from sensors to computation to reduce $e$ faster. That's instrumental convergence.
      *Mesa-Optimizer:* This is like identifying a model, but the model *contains* a controller that is optimizing something else. Nested control loops where the inner loop's reference is not the outer loop's reference.

