  8.  **Drafting the Content (incorporating specific constraints):**
      *   *Vocabulary Check:* Use "plant," "actuator," "sensor," "reference," "disturbance," "cost function," "stability margins," "system ID."
      *   *Avoid:* "Intent," "Want," "Belief" (unless qualified as internal state).
