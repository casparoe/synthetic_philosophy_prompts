      *   **Introduction:** Acknowledge the background, set the stage.
      *   **The Translation:** Map Agent/Tool to Control Topologies. Map Safety Concepts to Control Phenomena.
      *   **The Debate:** Frame the argument in terms of stability and loop topology.
