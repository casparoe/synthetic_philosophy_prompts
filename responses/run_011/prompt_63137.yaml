          *   Constraint: Do not quietly assume control theory concepts that don't map perfectly. Explicitly flag gaps vs. substantive disagreements.
          *   Tone: American English, professional, technical but accessible to the specific domain expertise.

  2.  **Deconstruct the Debate (AI Safety Context):**
