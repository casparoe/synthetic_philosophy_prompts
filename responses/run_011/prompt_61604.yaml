answer: |-
  Here is an analysis of the jade episode through the lens of natural kind realism, the doppelgänger test, and the limits of the "joints" metaphor.

  ### 1. Mapping the Natural Kind Thesis

  In the framework of semantic externalism (Kripke, Putnam, Boyd), a natural-kind term is hypothesized to refer to a category fixed by an underlying microstructural essence, to which lay speakers defer even if they cannot articulate it.

  *   **The Candidate Kind:** Pre-1863 "Jade."
  *   **The Stereotype:** The observable and functional profile described in the prompt: extreme toughness, resistance to metal tools, capacity for high polish, specific translucency, and typically a specific range of green coloration.
  *   **The Underlying Structure:** The chemical composition and crystal lattice. Lay speakers assumed a singular essence (e.g., "jade-stuff").
  *   **The Discovery's Impact:** Damour's analysis ruptures the assumption of uniqueness. The reference of "jade" was settled by a deference to *an* underlying structure, but the world supplied *two* distinct structures (jadeite and nephrite) that satisfy the stereotype.

  On the standard natural-kind picture, this creates a referential crisis. If "jade" is a rigid designator for a chemical kind, it must refer to either jadeite, nephrite, or nothing (if it is deemed a failed kind term like "phlogiston"). However, scientific practice did not discard the term "jade." Instead, it retained "jade" as a commercial and gemological umbrella term while distinguishing the minerals scientifically. This suggests that the reference was not fixed to a specific chemical essence, but rather to a *cluster of properties* that turned out to be multiply realizable.

  ### 2. The Doppelgänger Test

  You propose the following test: *A candidate kind is joint-carving only if anything matching its complete observable and functional profile would have to share its underlying nature.*

  Jade fails this test decisively.
  *   **The Profile:** A stone that is tough, polishable, translucent, and green.
  *   **The Underlying Nature:** One could possess a sample of nephrite and a sample of jadeite.
  *   **The Result:** These samples match each other's observable and functional profiles closely enough to be confused for millennia. Yet, they do not share the same underlying chemical nature (sodium-aluminium pyroxene vs. calcium-magnesium amphibole).

  Because a nephrite doppelgänger of a jadeite specimen matches the profile without sharing the essence, "jade" does not carve a *chemical* joint. It spans across two distinct chemical joints. If the "joints of nature" are defined strictly by fundamental microstructure (atomic composition and bonding), then "jade" is not a natural kind. It is a disjunction.

  ### 3. Relocating the Joint: The Functional Kind Analogy

  Is this failure fatal to the natural-kind reading? Only if one insists that the only real joints are chemical. If we relocate the joint from *composition* to *physical structure and function*, the category is salvaged.

  This invites the analogy to the philosophy of mind. In that field, "pain" is often construed as a functional kind: a state defined by its causal role (caused by damage, causes avoidance behavior) rather than its substrate (C-fibers in humans, silicon in robots). This is **multiple realization**.

  *   **The Analogy:** "Jade" is to mineralogy what "Pain" is to psychology.
      *   **Pain:** Defined by functional role; realized by diverse neural (or non-neural) substrates.
      *   **Jade:** Defined by physical disposition (toughness, cleavage, polish); realized by diverse mineral substrates (jadeite, nephrite).
  *   **Is it damaging?** In the philosophy of mind, multiple realization is often used to argue *against* reductionism (pain cannot be *just* C-fiber firing). In the case of jade, multiple realization does not prevent reduction; it just requires a disjunctive reduction (Jade = Jadeite OR Nephrite). Therefore, the multiple realization is less damaging here than in the mental case. It does not force us to abandon physicalism; it merely forces us to acknowledge that the relevant physical property is not elemental composition, but **crystal habit**. Both minerals share an interlocking fibrous microstructure that grants toughness, distinct from other stones.
  *   **Does the analogy hold under pressure?** It sounds tidy, but it strains under the weight of human valuation.
      *   "Pain" is defined by its role within an organism.
      *   "Jade" is defined partly by its physical properties, but partly by its *cultural affordance* (workability by abrasion, aesthetic value).
      *   The "function" of jade is not intrinsic to the stone in the way the function of a heart is intrinsic to an organism. It is relational. A stone is "jade" only relative to a technology (abrasive grinding) and an aesthetic (translucency/green). If humans had never developed abrasive polishing, or if we valued only hardness over toughness, "jade" would not cohere as a category.
      *   Therefore, the analogy holds only if we accept that some "natural kinds" are actually **eco-functional kinds**—categories defined by the interaction between material properties and agentive needs.

  ### 4. Where the "Joints" Vocabulary Runs Out

  The episode stops being about "carving nature at its joints" when we realize that the metaphor presupposes a single, privileged knife. The "joints" vocabulary implies that nature comes pre-sliced and our job is merely to find the cuts.

  The jade case demonstrates that nature offers joints at different levels of abstraction, and which joint is "real" depends on the inquiry.
  1.  **Chemical Inquiry:** The joints are at the atomic level. Here, "jade" is a fiction; there are only jadeite and nephrite.
  2.  **Lapidary/Engineering Inquiry:** The joints are at the level of crystal interlocking and toughness. Here, "jade" is a real, unified category distinct from quartz or obsidian.

  The vocabulary runs out when we ask: *Which carving is the true one?* The metaphor cannot answer this because it masks the pragmatic element of classification. The episode reveals that "jade" is not a failure of scientific realism, but a limit case for the *joints* metaphor itself. It shows that some of our most stable categories are not slices of pure nature, but **interfaces** between nature's dispositions and human purposes.

  At this point, the discussion shifts from metaphysics (what exists) to pragmatics (what classification serves our interests). To insist that "jade" is not a real kind because it is chemically disjunctive is to privilege the chemist's knife over the sculptor's. The joint is not in the stone alone, nor in the hand alone, but in the grip between them.
