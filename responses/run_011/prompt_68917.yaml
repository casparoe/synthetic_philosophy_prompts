  **MEMORANDUM**

  **TO:** County Citizens' Advisory Commission on Detention Facilities
  **FROM:** [Your Name], Commission Member
  **DATE:** March 14
  **SUBJECT:** Recommendation on Detention Facility Design Schemes A and B

  **Recommendation**
  I recommend we **Approve Scheme B with Conditions.** Scheme A presents unacceptable legal liability regarding pretrial detainees and carries higher long-term operational risk due to staff turnover and violence. Scheme B, as proposed, imports assumptions about sentence length and social welfare that do not exist in our county. We can mitigate these risks by modifying the design to prioritize containment and safety over rehabilitation features that our population turnover renders obsolete.

  **The Pretrial Constraint**
  The strongest argument for Scheme B (the "Normality" model) is rehabilitation and reintegration. This argument collapses under our data. With 60% of beds occupied by pretrial detainees and a median stay of 34 days, we are not housing a population that can be reintegrated. Most will be released before a vocational program concludes.

  However, Scheme A (Conventional) creates a legal vulnerability. Pretrial detainees are legally presumed innocent. Hardened booths, bolted furniture, and constant surveillance constitute a punitive environment. If the building itself inflicts hardship beyond what is strictly necessary for secure holding, we are effectively punishing unconvicted citizens. Scheme B offers a way to house this population without violating that principle, even if we cannot offer them the full "rehabilitative" benefit. We should view Scheme B not as a Norwegian import, but as a compliance mechanism for constitutional detention standards.

  **Safety vs. Expression**
  We must distinguish the objections of the Deputies' Association from those of the Prosecutor and Victims' Group.

  The Deputies' objection is about **Safety.** They are correct that "dynamic security" (interaction-based control) requires staffing levels and training budgets we have not guaranteed. Giving residents keys and creating residential wings with blind corners increases the load on staff. If we approve B, we cannot simply hope for better behavior; we must engineer the risk out.

  The Prosecutor and Victims' Group objection is about **Expression.** They argue the facility must visibly express societal disapproval. This is a valid political concern, but it conflates *conviction* with *detention*. For the 40% of the population who are convicted, the loss of liberty is the punishment. For the 60% pretrial, the building should express *order*, not *penance*. A facility that looks like a dormitory may be politically difficult to defend after an incident, but a facility that looks like a 1970s cage is legally difficult to defend in court today.

  **The "Two Institutions" Proposal**
  A colleague suggested treating the building as two institutions under one roof to separate the justifications. I do not believe this is workable. Physically separating pretrial and sentenced populations within a 380-bed footprint requires duplicate infrastructure (control rooms, kitchens, yards, intake) or creates a secure interface that becomes a bottleneck and a security vulnerability. The cost to effectively split the facility would likely exceed the 11% premium of Scheme B, negating the budget argument for Scheme A. We must choose one operational philosophy for the shell.

  **Evidence and Uncertainty**
  We must be honest about the data. The success of Halden and similar facilities relies on a Norwegian sentencing structure (long terms) and a social safety net that absorbs released residents. Our recidivism drivers are different. There is no guarantee that a "normal" environment reduces re-offending here. However, domestic data on "direct supervision" jails (officers inside the pod rather than in booths) consistently shows reduced violence and lower staffing costs compared to linear/1970s designs. Scheme B is an evolution of direct supervision. While the Nordic comparison is weak, the underlying engineering principle—that environmental stress increases human aggression—is solid materials science applied to sociology.

  **Conditions for Approval**
  To approve Scheme B, we must harden the design to match our risk profile. The following conditions are specific, priceable, and reversible:

  1.  **Access Control Modification:** Residents shall not carry physical keys to main wing doors. Individual room doors may utilize keys or electronic codes, but all communal areas must be controlled by staff stations. This addresses the Deputies' primary safety concern without reverting to cell bars.
      *   *Cost Impact:* Negligible (software/hardware change).
  2.  **Sightline Enforcement:** All "blind corners" in residential wings identified by the Deputies' Association must be eliminated or fitted with convex mirrors/transparent glazing prior to occupancy.
      *   *Cost Impact:* Low (design phase change).
  3.  **Deferred Fit-Out:** The "Step-Down" floor and communal kitchens shall be built as shells with utilities roughed in, but not fully furnished until occupancy rates stabilize. This allows us to assess if the turnover rate allows for communal cooking safety.
      *   *Cost Impact:* Defers approximately 4% of the Scheme B premium.
  4.  **Operational Audit:** The Commission requires a binding review at 36 months of operation. Metrics must include: Use-of-force incidents per 1,000 bed-days, staff turnover rate, and contraband interception rates. If these metrics exceed 115% of the County average for comparable facilities, the remaining "normality" features (e.g., communal kitchens) may be converted to conventional layouts.
      *   *Cost Impact:* Administrative.

  **Conclusion**
  Scheme A is a 1970s solution to a 2020s problem; it saves capital now but mortgages us to higher operational costs and legal risk. Scheme B is the better structural choice, but it is over-engineered for a transient population. By approving B with the conditions above, we secure a facility that is legally defensible for the unconvicted, safe enough for the staff, and flexible enough to be scaled back if the data does not support the theory. We are building for fatigue life, not just initial load.

  **Recommendation:** Approve Scheme B with Conditions 1–4.
