answer: |-
  The set is inconsistent; commitment (3) must be discarded to save the coherence of the remaining view.

  **Tension 1: Truth-Conditional Equivalence vs. Referential Failure (Severity: Fatal)**
  Commitments (2) and (3) are logically incompatible. (2) asserts that slur sentences and neutral counterpart sentences share truth conditions; if the counterpart is true, the slur sentence is true. (3) asserts that the slur's reference is fixed by a false ideology, rendering the extension empty and the sentence false (or gappy). You cannot maintain that the sentences are truth-conditionally equivalent while simultaneously claiming one is true and the other false. To resolve this, you must abandon either the equivalence claim (2) or the empty-reference claim (3). If you keep (3), you lose the elegant symmetry with neutral counterparts and undermine the expressivist intuition in (1). If you keep (2), you must accept that the slur refers successfully whenever the counterpart does, stripping the ideology of its power to corrupt reference itself.

  **Tension 2: Expressivism vs. Semantic Corruption (Severity: High)**
  Commitment (1) argues the derogatory charge is expressive or implicature-based, riding along without affecting truth conditions. Commitment (3) argues the derogatory ideology *constitutes* the semantic content to the point of failure. If (3) is correct, the offensiveness isn't just an expressive layer; it is baked into the truth-conditional machinery such that the proposition fails to obtain. Keeping (3) forces you to abandon the pure expressivist/implicature model of (1), requiring a semantics where the attitude itself determines truth values. This complicates the compositional story demanded by (7), as you now need a mechanism for ideology to block reference dynamically.

  **Tension 3: Reappropriation vs. Empty Extension (Severity: Medium-High)**
  Commitment (6) relies on the extension staying put during reappropriation, with only the derogatory layer falling away. Commitment (3) claims the extension is empty for everybody because the fixing ideology is false. If nothing satisfies the slur due to ideological falsity (3), there is no extension for the in-group to reclaim in (6). You cannot have an empty set that suddenly becomes populated just because a different group speaks. To save (6), you must reject (3) and allow that the extension is fixed by social facts independent of the racist ideology, even if the ideology attempted to hijack them.

  **Tension 4: Speaker-Dependent Truth vs. Compositionality (Severity: Medium)**
  Commitment (4) suggests truth tracks the speaker's moral psychology, while (7) demands a standard compositional story without *sui generis* categories. Making truth values depend on the speaker's internal prejudice rather than the world-state or conventional meaning introduces a radical contextualism that is difficult to compose. If "X is [slur]" is true when a bigot says it but false when a ally says it (despite identical worldly conditions), you are positing a semantic parameter rarely seen outside indexicals, straining the naturalistic constraint in (7).

  **The Single Cheapest Revision**
  Drop commitment (3).

  This is the cheapest revision because (3) is the sole source of the truth-conditional divergence that contradicts (2), undermines the expressivism in (1), blocks the reappropriation story in (6), and complicates the semantics in (5). By rejecting the claim that racist ideology renders the reference empty, you allow the slur to share truth conditions with its neutral counterpart (saving (2)), maintain that the derogation is expressive/pragmatic (saving (1) and (5)), and permit the extension to remain stable for reappropriation (saving (6)). Commitment (4) falls away naturally with (3), as there is no longer a semantic reason to deny truth to the unprejudiced speaker.

  **Is It Really That Cheap?**
  No. The cost is substantial philosophically, even if it saves logical coherence. By dropping (3), you concede that slurs do not encode falsehoods in their semantics but merely express attitudes. You lose the critical leverage that says using a slur is not just rude but *factually mistaken* because it invokes a non-existent hierarchical kind. Your account becomes less protective of the targeted group: if the slur is truth-conditionally equivalent to "Black," then an unprejudiced speaker using it *says something true*, which clashes with the intuition in (4) that the word itself is tainted regardless of intent. You gain a clean, compositional semantics at the price of acknowledging that the word's history and ideological load are merely pragmatic baggage rather than semantic defects. This makes the "wrongness" of slurring easier to explain linguistically but harder to explain morally, as you must argue that saying something true can still be impermissible solely due to history, without the aid of semantic falsity.
