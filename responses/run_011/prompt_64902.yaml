answer: |-
  You have identified a real, structural fault line in how we model intelligence, and you are right to feel that standard epistemic logic (S5, possible worlds, etc.) fails to carve it correctly. Standard logic treats knowledge as a *state* derived from information. You are observing that in LLMs, knowledge is a *process* derived from compute.

  Here is the carving you asked for.

  ### 1. The Name
  There is no single industry-standard term for the specific LLM behavior you describe, but it sits squarely in a well-defined neighborhood of computer science and philosophy.

  The closest established academic term is **Algorithmic Knowledge** (Halpern, Moses, Vardi, 1990s).
  *   **Definition:** An agent knows $\phi$ only if there exists an algorithm that, given the agent's local state, can compute $\phi$ within resource bounds.
  *   **Why it fits:** It solves the "Logical Omniscience" problem you mentioned by making knowledge conditional on the ability to *compute* the entailment, not just on the information being present.
  *   **Why it's insufficient:** Classical Algorithmic Knowledge usually assumes deterministic algorithms and monotonicity (more time = more knowledge). Your LLMs are stochastic and non-monotonic (more tokens $\neq$ always better; sometimes they drift).

  For your specific engineering context, I propose you coin the term:
  **Compute-Contingent Belief (CCB)**

  ### 2. The Definition
  Use this to tag incidents in your tracker. A system exhibits **Compute-Contingent Belief** if:

  > The set of propositions the system asserts as true (or acts upon) is a function $B = f(I, C)$, where $I$ is input information (weights + prompt) and $C$ is computational budget (tokens/time), such that $\frac{\partial B}{\partial C} \neq 0$ even when $I$ is held constant.

  **Crucially, CCB allows for non-monotonicity.** Unlike idealized "anytime algorithms," increasing $C$ does not guarantee $B$ grows; it may shrink, oscillate, or hallucinate. Incident #2 (knowledge vanishing on restart with lower budget) is the signature of CCB.

  ### 3. Are Your Three Incidents One Phenomenon?
  They are two facets of the same underlying constraint, coupled by a control problem.

  *   **Incidents 1 & 2 (The State):** These are pure **Compute-Contingent Belief**. They demonstrate that *inference is not retrieval*. In a database, if the data exists, a query finds it (assuming no bugs). In an LLM, if the entailment exists in the weights/prompt, the generation process must *reconstruct* it. If the budget cuts the reconstruction short, the knowledge effectively does not exist for that session. This is **Epistemic Accessibility** failing, not **Epistemic Content** changing.
  *   **Incident 3 (The Control):** This is the **Value of Computation (VoC)** problem (Russell & Wefald, 1991). Because belief is compute-contingent, the system must decide how much compute to buy. But because the outcome of the compute is unknown (otherwise you wouldn't need to compute it), the value of the compute is uncertain.
  *   **The Link:** Incident 3 exists *because* Incidents 1 & 2 are true. If knowledge were not compute-contingent (i.e., if the model were logically omniscient), you would never need to reason about whether to think; you would just know.

  So: Incidents 1 & 2 describe the **physics** of your system. Incident 3 describes the **economics** required to operate within that physics.

  ### 4. The Carving: What It Is and What It Is Not
  You asked to distinguish this from generic "bounded rationality" or "inconsistency." Here is the boundary:

  | Concept | The Core Problem | Why Your Case Is Different |
  | :--- | :--- | :--- |
  | **Logical Omniscience** | Agents ideally know all entailments of their beliefs. | You already know this. Your case is the *engineering realization* of dropping this assumption. |
  | **Bounded Rationality** (Simon) | Agents *optimize* under constraints (satisficing). | This is about *goals/utility*. Your case is about *truth/access*. The model isn't choosing a "good enough" answer; it's failing to access the answer entirely. |
  | **Inconsistency** | Agent believes $P$ and $\neg P$. | Your model isn't necessarily contradictory. It believes $P$ at $C=32k$ and *nothing* at $C=512$. That's absence, not contradiction. |
  | **Non-Monotonic Logic** | New *information* retracts old conclusions. | Your case is **Compute-Non-Monotonicity**. New *resources* (or fewer resources) retract conclusions without new information. |
  | **Compute-Contingent Belief** | **Access to entailment depends on work.** | **This is your carving.** Knowledge is a verb, not a noun. |

  ### 5. Why This Matters for Your Plumbing
  Naming this **Compute-Contingent Belief** changes how you design the system.

  1.  **Caching is Semantic, Not Syntactic:** If you cache a response generated at $C=32k$, you are caching a high-compute belief. Serving it to a user who expects a $C=512$ behavior is a category error. You might need to tag cache entries with their "compute class."
  2.  **The Meta-Reasoning Loop (Incident 3):** You cannot solve Incident 3 with heuristics alone. You are trying to estimate $E[\text{Utility}(C)]$ without knowing the function. The principled solution is **Metareasoning**: train a small, cheap model (or a head on the main model) to predict the *marginal gain* of additional tokens for a specific prompt class. You are effectively building a **Value of Computation estimator**.
  3.  **SLA Definitions:** You cannot promise "correctness" on logical entailments independent of budget. Your SLAs are implicitly **Compute-Contingent**. Acknowledging this prevents you from chasing bugs that are actually feature limits.

  ### 6. Summary for Your Logs
  *   **Phenomenon:** Compute-Contingent Belief (CCB).
  *   **Academic Ancestor:** Algorithmic Knowledge / Value of Computation.
  *   **Diagnostic:** Does the output change when $I$ is constant but $C$ varies? If yes, it's CCB.
  *   **Remedy:** Do not treat the model as a knowledge store. Treat it as a **lossy inference engine** where loss is a function of budget.

  Your friend in the PhD program will likely point you to **Hector Levesque's "Implicit vs. Explicit Belief"** (1984) or **Joseph Halpern's work on Algorithmic Knowledge**. Show them this definition: you are observing **Stochastic, Non-Monotonic Algorithmic Knowledge**. That should get you a very interesting conversation without you having to read the books first.
