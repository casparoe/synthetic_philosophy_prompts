  ### First: The Break in the Argument

  The argument first stops being sound at **line (6)**.

  **Why it looked unobjectionable:**
  Line (6) appears to be a straightforward application of the previous premises. It reads as a simple modus ponens: If less accurate assumptions yield more significant theories (4), and T-prime has less accurate assumptions (5), then T-prime is more significant (6). Because Friedman's essay is famous for championing "unrealistic" assumptions, the move from "unrealistic" to "significant" feels like the core Friedmanian insight, making the inference seem like a faithful deduction rather than a leap.

  **Why it fails:**
  The inference fails because it ignores the *ceteris paribus* clause embedded in premise (4). Premise (4) states: "among theories that **predict equally well**..." Line (5), however, constructs T-prime specifically so that it predicts *better* than T (it fits the phenomenon that refuted T). Therefore, the condition required to trigger the trade-off rule in (4) is not met. You cannot use a rule designed to rank theories with *equal* predictive power to rank theories with *unequal* predictive power without adding a weighting function for predictive scope versus assumption complexity.

  Furthermore, there is a subtle equivocation on "descriptively accurate" between (4) and (5). In (4), following Friedman, "descriptively inaccurate" refers to **simplifying abstractions** (ignoring wind resistance to focus on gravity). In (5), "descriptively inaccurate" refers to **_ad hoc_ patching** (inventing a parameter solely to fit a residual). Friedman rewards the former because it isolates dominant forces; he does not reward the latter, which obscures them. For the inference from (4) and (5) to (6) to fail, it must be true that **predictive scope and parsimony are traded off against one another**, and that adding an _ad hoc_ parameter increases complexity (reducing significance) even if it increases fit. Line (6) assumes the fit gain automatically outweighs the complexity cost, which (4) does not license.

  ### Second: The Cost of Sacrifice

  For an instrumentalist committed to Friedman's core project, here is the cost of sacrificing each premise:

  *   **(2) Abstraction:** Sacrificing this denies that theories simplify reality, forcing the instrumentalist to demand exhaustive descriptions, which collapses into the descriptivism Friedman opposes.
  *   **(3) Omission vs. Accuracy:** Sacrificing this requires redefining the relationship between detail and truth, a semantic cost that is low but confusing.
  *   **(4) Significance vs. Accuracy:** Sacrificing this is **prohibitively expensive**; it abandons the "F-Twist" entirely, conceding that realistic assumptions are a primary virtue, which undermines the essay's central polemic.
  *   **(5) T-Prime's Accuracy:** Sacrificing this is **cheap**; one can argue T-prime is *more* descriptively accurate (it admits friction exists) but *less* parsimonious, which blocks the application of (4) without denying instrumentalism.
  *   **(6) T-Prime's Significance:** Sacrificing this is **cheapest**; it merely denies the specific evaluation of the T-prime case without altering any general definitions or methodological rules.

  **Cheapest to Sacrifice:** **Line (6)**. Denying that T-prime is automatically "more significant" allows the instrumentalist to maintain that while assumptions need not be true, they must be *productive*. It preserves (1) through (5) as general principles while rejecting the student's specific derivation that _ad hoc_ complexity equals significance.

  ### Third: Fairness of Attribution

  The student's reconstruction is **unfair** in its attribution of premises (3) and (4) to Friedman, specifically regarding the *source* of the assumption's unreality.

  Friedman's examples—the expert billiard player and the sun-seeking foliage—do not commit him to the unrestricted form of (4) that the student exploits. In the billiard case, the assumption ("the player solves complex equations") is false, but it works because there is an **independent causal mechanism** (physics and selection) that makes the player's shots *conform* to the equations regardless of their mental state. In the foliage case, the assumption ("trees maximize sunlight") is false, but it works because of **natural selection**, an independent force that eliminates trees that do not position leaves efficiently.

  **The Limiting Work:**
  What is present in Friedman's cases and missing from the student's T-prime is **independent structural stability**. Friedman's "unrealistic" assumptions capture a dominant force that operates *across* the class of phenomena (gravity, evolution). The student's T-prime introduces a term (a "wedge" or "shifter") that is defined *only* by its ability to fit the specific refuting datum. Friedman's assumptions are **generative** (they predict new shots or leaf patterns without recalibration); the student's T-prime assumption is **accommodative** (it fits the past error but predicts nothing new without further tuning). Friedman is committed to (4) only when the "unrealistic" assumption acts as a proxy for a stable, independent force, not when it acts as a fudge factor for noise.

  ### Fourth: The Condition on Assumption-Choice

  To save a version of (4) that blocks step (6), we must add the following condition to assumption-choice:

  **The Condition of Independent Identifiability:** An assumption is methodologically permissible (and potentially "significant" despite being descriptively false) only if the entities or forces it posits can be identified, measured, or defined **independently of the specific phenomenon the theory is currently predicting.**

  **Demonstration:**
  This criterion blocks step (6) because T-prime's new term (the "friction" or "wedge") is constructed *ex post* to fit the refuting phenomenon. Its value is derived *from* the error it corrects, not from independent measurement. Therefore, T-prime violates Independent Identifiability. It is not a "significant abstraction"; it is a curve-fitting device. A Friedmanian theory (like the billiard player) posits forces (gravity, skill constraints) that exist and can be measured even if the player misses the shot. T-prime posits a force that *only* exists in the equation for that specific shot.

  **Circularity Check:**
  This criterion does **not** require knowing which predictions are true beforehand. It requires knowing whether the *parameters* of the model are stable across different contexts. We can test if a friction parameter is invariant across different shots without knowing the outcome of the shots in advance.

  **Addressing the Constraint (If (4) is rejected/hedged):**
  If we reject the unrestricted (4) in favor of this hedged version, the instrumentalist does not fold. The essay's central polemic survives because the demand for "realistic assumptions" is still rejected **where realism impedes prediction**. We still do not need to interview the billiard player to validate the theory; the "truth" of his mental state remains irrelevant. The distinction between testing assumptions directly (psychological inquiry) and indirectly (observing shots) remains vital. The instrumentalist concedes only that *any* assumption, realistic or not, must be **structurally stable**. The polemic shifts from "assumptions should be false" to "assumptions should be **predictively efficient**," which preserves the core insight that descriptive truth is not the *goal* of economics, even if it is sometimes a *constraint* on model building.
