prompt: |-
  I'm building a demarcation unit and the Velikovsky affair is my anchor case: Worlds in Collision comes out from Macmillan in 1950, Shapley and the Harvard astronomers threaten to pull their textbook line, and within a couple of months the book is handed off to Doubleday. Analyze that episode as a test of the demarcation criteria themselves rather than of Velikovsky. Run Popper's falsifiability against it — he made some genuinely risky calls that later looked confirmed, a scorching hot Venus and radio noise from Jupiter, which is not how a pseudoscience is supposed to behave. Then run the process-based alternative, pseudoscience as a way of defending claims rather than a kind of claim: myths read as eyewitness testimony, the planetary psychoanalysis, the universal-amnesia move that explains away every trace that fails to show up. Which one actually does the work here?

  Then tell me what the boycott did. Was it legitimate boundary maintenence, or the thing that manufactured the martyr and the suppressed-truth story his readers still trade on — and does either verdict follow from the theories, or is that exactly where they go silent? Lead with your bottom line in the first sentence and then give the reasoning; no preamble and don't restate the question back to me.
