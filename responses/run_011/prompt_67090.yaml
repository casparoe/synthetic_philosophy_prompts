      *   *Popper's Failure:* Address the Venus/Jupiter point. Popper liked risky tests. Velikovsky had them. Why is he still pseudoscience? Because the core theory wasn't derived from a falsifiable framework, and the successes were luck or reinterpretation. Popper's criterion is too logical/ahistorical. It misses the *context* of the predictions.
      *   *Process Success:* Focus on the "immunizing strategies." Myths as data is a category error. "Universal amnesia" is the classic ad hoc rescue device. This fits Laudan's "problem-solving effectiveness" or similar process views. It explains *why* it's pseudoscience (how it handles counter-evidence) rather than just looking at the claims.
