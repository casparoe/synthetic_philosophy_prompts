      The process-based view successfully identifies Velikovsky's methodology as pseudoscientific despite his accidental predictive successes, but neither philosophical framework accounts for the boycott's sociological blowback in manufacturing the martyrdom narrative that sustains his legacy.

      Popper's falsifiability criterion stumbles here because Velikovsky did not behave like a typical pseudoscientist regarding risk; he put his neck out with specific claims about Venus's temperature and Jovian radio emissions that were subsequently corroborated. For Popper, who valued bold conjectures over cautious verification, this created an uncomfortable ambiguity: a theory he deemed metaphysical nonsense had scored empirical wins. However, these successes were incidental rather than derivational; the heat of Venus stems from atmospheric retention, not recent proximity to Mars, and Jupiter's noise arises from magnetospheric interaction, not electrical discharge between planets. Falsifiability looks at the logical structure of the prediction, not the causal mechanism, leaving it vulnerable to lucky hits that mask underlying theoretical rot.

      The process-based alternative cuts deeper by examining how the theory survives counter-evidence. Velikovsky's framework relies on immunizing strategies that render it unfalsifiable in practice: geological absences are explained away by "universal amnesia," and physical impossibilities are overridden by treating myths as literal eyewitness testimony. This is not science failing to solve problems, but a system engineered to avoid failure by redefining the evidence pool. Where Popper sees a logical mismatch, the process view sees a defensive posture; it correctly identifies that the pseudoscience lies not in the claims themselves, but in the refusal to allow the claims to be defeated by standard evidentiary norms.

      The boycott, however, exposes the limits of both theories. Philosophically, the scientists' action was legitimate boundary maintenance: Macmillan published textbooks, implying pedagogical authority, so moving the book to Doubleday reclassified it as trade speculation rather than established fact. Yet demarcation criteria are normative tools for classification, not predictive models of social reaction. They cannot anticipate that enforcing a boundary would generate the "Galileo Gambit" narrative used by modern proponents. The theories explain why Velikovsky was wrong, but they go silent on why punishing him made him right in the public eye. The boycott succeeded in protecting the institutional integrity of science textbooks but failed to kill the idea, proving that demarcation is as much a sociological battle over credibility as it is a philosophical dispute over truth.

