      *   *Check:* The boycott. Macmillan was a textbook publisher. Scientists worried about kids learning this as fact. Moving to Doubleday (trade) reclassified it as "speculation" or "belief." This was successful boundary maintenance *institutionally*, but failed *rhetorically* among the public.
      *   *Conclusion:* The process view wins on demarcation, but both fail on the sociology of the boycott.

