answer: |-
  **JOINT PRE-WORKSHOP STATEMENT ON THE STRUCTURE AND NORMATIVE STATUS OF PRECOMMITMENT**

  **To:** Participants of the Workshop on Precommitment and Constitutional Design
  **From:** The Adversarial Collaboration Group (Camp A: Normative Force; Camp B: Local Rationality)
  **Subject:** Agreed Grounds, Structured Disagreements, and Empirical Cruxes

  ### I. AGREED CLAIMS

  We, the undersigned, represent divergent theoretical approaches to the problem of precommitment. Camp A holds that prior resolutions can generate genuine normative reasons for later action. Camp B holds that rational choice is strictly local to the moment of action and that precommitment operates solely through constraint. Despite this fundamental divergence, we agree on the following formal, mechanical, and phenomenological claims as the baseline for this workshop.

  1.  **Formal Structure of Sequential Choice:**
      *   Both camps accept that precommitment problems can be modeled as extensive-form games with sequential nodes.
      *   Both camps agree that "dynamic inconsistency" describes a situation where a plan optimal at $t_1$ is no longer preferred at $t_2$ absent external intervention.
      *   Both camps agree that a "money pump" argument demonstrates that an agent with cyclic preferences or specific forms of dynamic inconsistency can be induced to surrender resources without gain. We agree this is a formal vulnerability, though we disagree on whether avoiding it requires a change in reasons (Camp A) or a change in feasible sets (Camp B).
      *   Both camps agree that backward induction yields a subgame-perfect equilibrium, but we disagree on whether rational agents must always play such an equilibrium (Camp B) or whether they may rationally adopt strategies that violate it to maintain diachronic consistency (Camp A).

  2.  **Mechanics of Entrenchment:**
      *   We agree on the mechanical function of standard devices. Amendment thresholds raise the cost of reversal. Judicial review introduces a veto player with distinct incentives. Delegation to independent bodies (e.g., central banks) alters the payoff structure for immediate actors.
      *   We agree that no device is metaphysically immutable. A constitution can be revolutionized; a contract can be breached; a mast can be cut. The question is not absolute impossibility but the cost and normative status of overcoming the barrier.
      *   We agree that "self-binding" in the individual case and "entrenchment" in the constitutional case share a structural isomorphism: a prior decision attempts to restrict a later decision.

  3.  **Phenomena Requiring Explanation:**
      *   Any adequate theory must explain the *demand* for precommitment: why agents voluntarily incur costs or restrict options at $t_1$.
      *   Any adequate theory must explain the *efficacy* of precommitment: why agents at $t_2$ often comply with $t_1$ plans even when the mechanical constraints are permeable or the immediate payoffs favor defection.
      *   Any adequate theory must account for the *regret* patterns associated with precommitment: specifically, why agents sometimes praise their past selves for binding them, and other times condemn their past selves as tyrannical.

  ### II. DISAGREEMENTS TABLE

  The following table isolates the core disputes. For each row, we provide the formulation each camp prefers. We then offer a joint verdict on whether the disagreement is substantive (about the world/normativity) or verbal (about the definition of a term), identifying the specific term doing the work.

  | Dispute | Camp A (Normative Force) Formulation | Camp B (Local Rationality) Formulation | Verdict | Key Term |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Source of Compliance** | An agent adheres to a plan because the prior resolution *itself* provides a reason for action that outweighs current preferences. | An agent adheres to a plan because the prior resolution has altered the *costs* or *beliefs* associated with defection, making adherence the local optimum. | **Substantive** | "Reason" |
  | **2. The Nature of the Agent** | The person at $t_1$ and the person at $t_2$ are a single continuing agent whose rationality is judged over the whole life-span. | The person at $t_1$ and the person at $t_2$ are distinct temporal stages; rationality is a property of the stage currently in control. | **Substantive** | "Agent" |
  | **3. The Status of Constraints** | To be "bound" means to be under an obligation that persists even if the penalty for breaking it is removed. | To be "bound" means to face a penalty or obstacle sufficient to deter defection given current preferences. | **Verbal** | "Bound" |
  | **4. Political Legitimacy** | A constitutional provision is legitimate if it was validly enacted by a prior sovereign, even if the current majority opposes it. | A constitutional provision is legitimate only insofar as the current majority consents to it (explicitly or tacitly) at the time of enforcement. | **Substantive** | "Legitimacy" |
  | **5. The Dead Hand** | Stability provided by past decisions is a benefit that protects the long-term integrity of the polity. | Stability provided by past decisions is a cost that prevents the living from optimizing for current circumstances. | **Substantive** | "Dead Hand" |

  ### III. CRUXES

  We have identified four sub-questions where empirical evidence or formal results could shift the burden of proof. For each, we specify what would settle the matter and record our opposing predictions.

  **Crux 1: The Mast Case (Ulysses and the Sirens)**
  *   **The Question:** In the classic case, Ulysses orders his crew to tie him to the mast. Suppose the ropes are rotten and would break if he pulled hard, but he does not pull hard because he *resolved* not to. Is his rationality dependent on the physical constraint (Camp B) or the resolution (Camp A)?
  *   **How to Settle:** Intuition testing on variants where the constraint is known to be fragile but the agent remains compliant solely due to prior resolve. Does the observer attribute rationality to the agent?
  *   **Camp A Prediction:** Observers will judge Ulysses as rational *only* if they believe he honored his resolution, even if the ropes were weak. The "binding" is normative.
  *   **Camp B Prediction:** Observers will judge Ulysses as rational only if they believe the ropes (or fear of crew intervention) made defection costly. If the ropes were known to be useless, staying put is irrational unless his preferences changed.
  *   **Where it Misleads:** The case is too clean. It conflates physical constraint with psychological resolve. It fails to distinguish between "I cannot" and "I will not because I said I would not."

  **Crux 2: Psychiatric Advance Directives (The Changing Self)**
  *   **The Question:** A patient, while competent, signs a directive refusing medication if they become manic. When manic, they demand medication. The "manic self" has radically different preferences. Is honoring the directive respecting the *same agent's* long-term will, or is it the tyranny of a past self over a present self?
  *   **How to Settle:** Ethical and legal analysis of competency standards. Does the law treat the manic self as a continuation of the competent self, or as a temporary incapacitation requiring guardianship?
  *   **Camp A Prediction:** The directive should hold. The competent self is the "true" agent, and the manic self is a compromised version of that same agent. Diachronic consistency protects the agent's integrity.
  *   **Camp B Prediction:** The directive is a constraint justified only by the *current* best interests of the manic self (as judged by proxies). If the manic self is happy and harmless, enforcing the directive is irrational paternalism.
  *   **Relevance to Asymmetry:** This tests whether "identity" is the bridge between individual and constitutional cases. If the manic self is a "different agent," does the current electorate count as a "different agent" from the founding generation?

  **Crux 3: Contractual Self-Exclusion Schemes (Voluntary Bans)**
  *   **The Question:** Gamblers voluntarily sign up for databases that ban them from casinos. If they show up and beg to be let in, casinos often refuse. Is the casino acting as an enforcer of the gambler's *reason* (Camp A) or as a third-party constraint mechanism (Camp B)?
  *   **How to Settle:** Examination of liability waivers and enforcement protocols. Do casinos enforce the ban because they believe the gambler *ought* to be bound, or because they fear regulatory penalty (cost)?
  *   **Camp A Prediction:** The normativity of the promise matters. Casinos and regulators speak the language of "keeping faith" with the addict's prior will.
  *   **Camp B Prediction:** It is purely incentive-compatible. Casinos enforce because the fine for admitting the gambler exceeds the profit from the gambler. Remove the fine, the ban vanishes.
  *   **Relevance to Asymmetry:** This is an intermediate case between individual mast-tying and constitutional entrenchment, involving third-party enforcement.

  **Crux 4: Entrenched Constitutional Provisions (The Dead Hand)**
  *   **The Question:** Consider a constitutional clause that is explicitly unamendable (e.g., the republican form of government). If 99% of the current population wishes to change it, is it *possible* for them to do so legitimately?
  *   **How to Settle:** Comparative institutional evidence. Look at historical cases where polities attempted to violate eternity clauses. Do they treat it as a legal nullity (Camp B) or as a revolutionary break requiring extraordinary justification (Camp A)?
  *   **Camp A Prediction:** Polities treat these clauses as creating a normative hurdle, not just a cost. Violating them is seen as a breakdown of the legal order, not just a high-cost amendment.
  *   **Camp B Prediction:** Polities treat these clauses as speed bumps. If the political will is strong enough, the clause is ignored or reinterpreted. The "binding" force is an illusion created by the lack of current will to break it.
  *   **Relevance to Asymmetry:** This directly confronts the suspicion. If Camp A wins in the individual case (Ulysses) but Camp B wins here, is it because the "Demos" is not a "Person"? Or because we define political legitimacy differently than personal rationality?

  ### IV. CANDID FAILURE

  We must be transparent about where this collaboration has reached a limit. There are items we cannot sign without one side equivocating.

  **1. The Definition of Rationality**
  We cannot agree on a neutral definition of "rationality."
  *   **Camp A** insists that rationality includes *diachronic consistency*. An agent who reverses their plan without new information is defective, regardless of local optimization.
  *   **Camp B** insists that rationality is *local optimization*. An agent who follows a plan that is no longer optimal is irrational, regardless of prior consistency.
  *   **Diagnosis:** This is not merely verbal. It reflects a deep divergence on whether time is a dimension across which agency is unified (Camp A) or a sequence of distinct decision nodes (Camp B). We cannot resolve this in the preamble; it is the central question of the workshop.

  **2. The Authority of the Past**
  We cannot agree on whether the past has *authority* over the present.
  *   **Camp A** claims the past self (or founding generation) has a claim to authority based on prior competence or consent.
  *   **Camp B** claims the present self (or current majority) has exclusive authority because only the present self bears the consequences and possesses the capacity to act.
  *   **Diagnosis:** This blocks agreement on the "Legitimacy" row in the Disagreements Table. Camp A cannot sign a statement saying "only current consent matters" without abandoning their core thesis. Camp B cannot sign "past consent suffices" without abandoning theirs.

  **3. The Asymmetry Diagnosis**
  We suspect, as noted in the workshop invitation, that the literature treats individuals and polities differently.
  *   **Camp A** suspects this is an error: if precommitment is rational for persons, it should be legitimate for polities. The resistance to constitutional entrenchment is an unearned intuition.
  *   **Camp B** suspects the asymmetry is principled: persons are metaphysically continuous in a way polities are not. The "Dead Hand" objection is valid for constitutions but not for individuals.
  *   **Diagnosis:** We cannot agree on whether this asymmetry is a bug or a feature. This is the primary hypothesis the workshop must test. We present the cruxes above not as resolved, but as the battleground where this diagnosis will be fought.

  **Signed,**

  *The Adversarial Collaboration Group*
  *(Representing Camp A: Normative Force & Camp B: Local Rationality)*
