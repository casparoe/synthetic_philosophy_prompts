      *   *Tension D: C5 vs. C7.* C5 says prices are sufficient statistics. C7 says ML uses behavioral data directly.
          *   *Analysis:* Prices *compress* information. ML on behavioral data *expands* information processing. If prices are sufficient, why do we need ML on raw data? If ML on raw data is better, are prices still sufficient statistics?
