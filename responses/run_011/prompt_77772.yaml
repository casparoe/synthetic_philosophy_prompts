      *   *The ML Hook:* **C6 vs. C7.** C6 defines knowledge as tacit/inarticulate. C7 claims ML extracts it from data. If ML extracts it, it becomes codified data. This risks redefining "tacit" to mean "high-dimensional" rather than "inarticulable."
      *   *The Incentive Dodge:* **C8.** While not an internal contradiction, it's the weakest link against critics. But the prompt asks for internal audit. Internally, C8 is consistent with the "Calculation" focus, but it makes C4 (Firms) harder to defend because firms solve incentives differently than states.

  5.  **Distinguish Real vs. Apparent:**
