      *   *Tension E: C4 vs. C7.* C4 uses firms as proof non-market works. C7 uses ML as the new enabler.
          *   *Analysis:* Firms use hierarchy + human judgment. ML uses algorithms. Are these the same? C4 suggests non-market is *already* routine. C7 suggests ML *changes the calculus*. If it's already routine (C4), what is ML changing (C7)?
          *   *Severity:* Low-Medium. Mostly a nuance issue.

      *   *Tension F: C8 vs. The Rest.* C8 dismisses incentives as secondary.
          *   *Analysis:* Most economists (especially public choice) think incentives are primary. If you solve calculation (C1-C7) but ignore incentives (C8), the system fails.
          *   *Severity:* High (from a critic's perspective), but internally consistent with the "Calculation Debate" focus. However, it clashes with C4 (Firms solve incentives via employment contracts/residual claimancy at the top).

  4.  **Filter and Rank Tensions:**

      *   *Critical Contradiction:* **C1 vs. C4.** C1 affirms Mises's impossibility claim regarding socialized capital. C4 uses the existence of large firms to say Mises overreached. Mises's specific counter to the "firm analogy" is that firms operate *within* a market environment that provides external prices for capital. If you socialize *everything* (the SCD context), you lose the external anchor. C4 implies the internal mechanism is sufficient. C1 implies it is not. This is the "does not hang together" flag.
