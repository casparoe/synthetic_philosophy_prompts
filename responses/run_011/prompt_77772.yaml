      *   *Decision:* The editor says "does not hang together." That points to C1/C4. The economist might say "Incentives matter most" (C8). But the most devastating attack on the *logic* is C1/C4. I will advise on C1/C4 as the structural fix, but note C7/C8 as the substantive vulnerability. Actually, looking closely at C3 and C7: C3 says central boards can't do entrepreneurial discovery. C7 says ML can act on tacit patterns. Is pattern recognition discovery? If not, C3 and C7 are fine. If yes, they clash.
