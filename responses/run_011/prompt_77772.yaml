      *   *Real:* C1 vs. C4. You cannot claim Mises was right about the impossibility of socialist calculation due to lack of prices (C1) AND claim large firms prove Mises overreached because they allocate without internal prices (C4). Mises explicitly addressed this. The firm relies on external market prices for capital goods. A socialist economy does not. C4 undermines C1's specific reasoning.

