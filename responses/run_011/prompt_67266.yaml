  **INDEPENDENT AUDITOR'S REPORT**

  **To the Members of the Permanent Tribunal for the Settlement of Closed Empires**

  **Opinion**

  We have been engaged to audit the accompanying Financial Statements of the India Account (the "Entity"), comprising the Statement of Extracted Revenue, the Statement of Infrastructure Capitalisation, and the Statement of Human Capital Adjustments for the period 1757 to 1947. Because of the significance of the matter described in the *Basis for Disclaimer of Opinion* section of our report, we have not been able to obtain sufficient appropriate audit evidence to provide a basis for an audit opinion. Accordingly, we do not express an opinion on whether the Financial Statements present fairly, in all material respects, the net position of the Entity.

  **Basis for Disclaimer of Opinion**

  The Entity's Financial Statements have been prepared using a netting framework that assumes all line items are commensurable and capable of offsetting one another to produce a single residual equity figure. However, as detailed in Note 7 to the Financial Statements, the Entity lacks an appropriate benchmark for determining materiality. Without a defined materiality threshold, we cannot ascertain whether misstatements in the recognition of liabilities (specifically those relating to mortality and sovereignty) are material to the Financial Statements as a whole. Consequently, we are unable to determine whether the offsetting of assets against liabilities is permissible under the applicable reporting framework.

  **Notes to the Financial Statements**

  **1. Basis of Preparation and Going Concern**
  The Financial Statements have been prepared on a liquidation basis, as the Entity ceased operations upon the transfer of power in 1947. However, certain contingent liabilities recognized by the successor states remain unsettled. Management has asserted a going-concern assumption for the purpose of valuing long-term infrastructure assets, arguing that the administrative continuity of the successor state validates the carrying value of the original investment. We note that the legal personality of the Entity was dissolved, rendering the going-concern basis inappropriate for the consolidation of political risk. The liquidation value of sovereignty is unobservable.

  **2. Related Party Transactions**
  The Entity was managed by the United Kingdom Treasury and the Court of Directors of the East India Company, who were also the primary beneficiaries of the Entity's surplus revenue. Transactions involving the "Home Charges" were priced without reference to an arm's length market. Disclosure of these related party balances is incomplete, as the counterparty (the British State) consolidated the Entity's results into its own Imperial Accounts without eliminating inter-company balances. The independence of the preparer is compromised by the beneficiary status.

  **3. Property, Plant, and Equipment (Railways)**
  The Railway Network is recognized at historical cost less depreciation. An impairment test was required due to indicators of reduced utility. Management classifies the network as "Public Infrastructure," implying a social return on investment. Audit evidence suggests classification as "Extraction Equipment," designed primarily for military mobility and raw material export. Under the latter classification, the recoverable amount is significantly lower than the carrying value. Furthermore, the capital cost includes a guarantee of 5% return to private shareholders, paid from Indian revenues regardless of operational profitability. This guarantee is recorded as an operating expense rather than a distribution of equity, inflating the cost base.

  **4. Foreign Currency Translation**
  The Financial Statements are presented in Sterling, while the underlying operations were conducted in Rupees. The exchange rate was fixed unilaterally by the Entity at 1s 4d per Rupee for the purpose of remittance, regardless of purchasing power parity. This policy resulted in systematic translation gains recognized in London and translation losses absorbed by the local operating unit. No hedge accounting was applied to protect the operating unit from currency risk imposed by the reporting entity.

  **5. Discount Rates and Time Preference**
  Long-term liabilities, including claims for intergenerational economic stagnation, have been discounted to present value. The discount rate applied corresponds to the UK Treasury gilt yield during the period. We note that the claimants' social time preference rate—which would place higher weight on immediate subsistence versus future capital accumulation—was not utilized. The choice of discount rate materially affects the present value of claims compounding across two centuries. Using the claimant's rate would result in a liability exceeding the Entity's total recognized assets.

  **6. Comparative Information and Counterfactuals**
  The Financial Statements include comparative figures based on a counterfactual scenario wherein the Entity never existed. This comparator represents a sovereign economy developing without colonial integration. As this scenario is unobservable and relies on econometric modelling rather than transactional evidence, we cannot verify the accuracy of the comparative period. The assurance level on the counterfactual is nil. Consequently, the value added by the Entity cannot be isolated from the opportunity cost of the foregone alternative.

  **7. Materiality**
  Materiality is typically calculated as a percentage of profit before tax or total assets. The Entity reports no profit, only surplus extraction. Total assets are disputed due to the impairment issues noted in Note 3. Furthermore, significant liabilities relate to human mortality during famine periods. There is no accepted accounting standard for converting mortality into monetary units suitable for netting against railway capital. Because no quantitative benchmark exists, and because qualitative factors (such as the right to self-determination) are excluded from the ledger, materiality cannot be determined. Without materiality, the concept of a "true and fair view" is inapplicable.

  ***

  **Auditor's Note on Methodology and Historical Correspondence**

  In constructing this parody, I adhered strictly to the International Standards on Auditing (ISA) structure to maintain the deadpan tone. The line items correspond to specific historical debates: the "Home Charges" and related-party issue reflect the drain theory advocated by nationalists like Dadabhai Naoroji; the railway impairment note references the guaranteed returns system criticized by economists such as John Stuart Mill and later Indian historians; the famine liabilities correspond to the mortality debates surrounding the 1870s and 1943 famines. The "counterfactual" note addresses the methodological difficulty in comparing colonial India to a hypothetical independent India, a common critique in economic history.

  The classification decisions subtly favour the critique of the ledger method itself. By treating mortality as a liability that cannot be converted to currency (Note 7), I am highlighting the moral limitation of accounting rather than making an accounting error. Similarly, the discount rate note (Note 5) exposes how choosing a metropolitan interest rate over a local subsistence preference mathematically erases long-term suffering from the balance sheet. The satire does not endorse a verdict on whether the Raj was "good" or "bad"; rather, it endorses the verdict that the question cannot be answered via netting.

  Ultimately, the Disclaimer of Opinion is the only technically defensible position. An Adverse Opinion would imply the statements are wrong but the framework is valid; a Disclaimer implies the framework itself is broken. By refusing to net the columns due to undefined materiality, the report argues that some historical costs are infinite relative to the ledger's capacity to hold them. This aligns with your premise that the debate is trapped by the form of the argument, not just the content. I do not believe your premise is confused; rather, it correctly identifies that utilitarian defenses of empire rely on a categorization error that treats incommensurable values as fungible assets.
