answer: |-
  **Exam Question: Graduate Seminar in Comparative Philosophy of Personhood**

  **Time Allowed:** 4 Hours
  **Word Limit:** 2,500 words maximum

  **Question:**

  Parfit argues that what matters in survival is Relation R (psychological connectedness and continuity), which can hold one-to-many in fission cases without contradiction. By contrast, the Buddhist doctrine of karma requires that moral responsibility and rebirth track a unique, unidirectional causal stream; if continuity branches, the moral ledger becomes incoherent.

  Consider a case where a single mental continuum divides into two successor streams (Fission). Both streams are ordained as monks. Subsequently, Stream A commits a *pārājika* (defeating) transgression, while Stream B remains virtuous.

  1.  Within a strictly reductionist framework (à la Vasubandhu), how do you determine which stream ripens the karmic fruit of the pre-fission actions, and which bears the responsibility for the transgression? If you argue that a "non-branching clause" is required to secure karmic justice, demonstrate why this does not merely smuggle a substantial *pudgala* (self) back into the ontology through the back door.
  2.  Evaluate whether the Pudgalavādin appeal to an "inexpressible person" (*avaktavya pudgala*), which is neither identical with nor distinct from the aggregates, is genuinely better equipped to resolve this fission problem than Vasubandhu's reductionism. Does the *pudgala* solve the asymmetry problem, or does it simply move the same difficulty up a level?

  *Note: Answers that rely primarily on the chariot simile, lists of the five aggregates, or the assertion that "persons are merely conceptual fictions" without addressing the metaphysical mechanics of karmic asymmetry will fail.*

  ***

  **Model Answer**

  The tension between Parfitian reductionism and Buddhist soteriology lies in the topology of continuity. Parfit accepts that Relation R can branch; for him, survival is not a deep further fact but a matter of degree. If I fission, "I" survive as both successors, even if they are distinct people. However, Buddhist karma operates on a logic of strict moral accounting. Retribution requires a unique locus of experience. If the causal stream branches, the link between act and fruit threatens to dissolve or multiply unjustly.

  In the proposed fission case, where one continuum divides into two ordained streams and only one commits a *pārājika*, a strict Vasubandhuan reductionism faces a dilemma. If both streams are equally causally connected to the pre-fission continuum, reductionism lacks the metaphysical resources to privilege one over the other. If we argue that both streams ripen the fruit of pre-fission actions, we face the "doubling problem": the karmic ledger is not merely relocated but duplicated. This violates the conservation of moral causality implicit in karma; one act should not yield double the retribution simply because the vessel split. Conversely, if neither stream bears responsibility for the transgression because the "agent" is now ambiguous, karma is nullified, undermining the soteriological path.

  To save karma, the reductionist might add a non-branching clause: continuity counts for survival and responsibility *only if* it is unique. However, this invites the charge of smuggling in a substantial self. If the aggregates alone constitute the person, and the aggregates in Stream A are qualitatively identical to Stream B regarding their connection to the past, what metaphysical fact makes Stream A the "true" successor? If the answer is "nothing, it is merely a conventional designation," then moral responsibility becomes arbitrary. If the answer is "there is a fact of the matter," that fact functions exactly like a *pudgala*—a substratum ensuring identity over time independent of the aggregates' configuration. Thus, the non-branching clause risks collapsing reductionism into a subtle substantialism to preserve moral coherence.

  This brings us to the Pudgalavādin alternative. The Pudgalavādins posited a person that is *avaktavya* (inexpressible), neither identical to nor distinct from the aggregates. They argue this avoids the nihilism of reductionism (which cannot account for memory and karma) and the eternalism of substantialism (which posits a static self). In the fission case, the Pudgalavādin could argue that the *pudgala* does not divide. Since the *pudgala* is not reducible to the aggregates, the branching of the physical or mental aggregates does not necessitate the branching of the moral agent. The *pudgala* would follow only one stream, preserving the uniqueness required for karma.

  However, does this solve the problem or displace it? If the *pudgala* is truly inexpressible, we cannot state the criteria by which it selects Stream A over Stream B. If it selects based on causal continuity, we are back to the reductionist problem (since both streams have continuity). If it selects based on some intrinsic identity, the *pudgala* becomes a substantial self in all but name, violating the Buddha's *anattā* doctrine. The Pudgalavādin solution appears to move the difficulty up a level: rather than explaining how aggregates select a unique successor, they posit a mysterious entity that does the selecting, without explaining *how* that entity persists through the fission without itself dividing.

  Furthermore, the Pudgalavāda risks making the person a "further fact" that is epistemically inaccessible. If we cannot know why the *pudgala* inheres in Stream A and not Stream B, moral responsibility remains opaque. The Vasubandhuan reductionist, by contrast, accepts the conventional nature of the ledger. They might argue that in a fission case, the "person" is indeed a fiction, and thus the "doubling" is only a problem if one reifies the ledger. However, this threatens the reality of suffering and liberation.

  Ultimately, both frameworks struggle with asymmetry. Vasubandhu preserves ontology but risks moral incoherence in branching cases. The Pudgalavādin preserves moral coherence but risks ontological inflation. The Pudgalavādin is not *better* equipped unless one accepts that moral responsibility requires a metaphysical anchor that reductionism cannot provide. Yet, if that anchor is inexpressible, it functions as a theological stopgap rather than a philosophical solution. The fission case reveals that without a non-branching clause, karma is unintelligible; but with it, reductionism is compromised. The Pudgalavāda acknowledges this compromise openly but pays for it with the coherence of the *anattā* doctrine. Therefore, the Pudgalavādin does not solve the difficulty but renders it explicit: the price of karmic justice is a concession to a quasi-substantial agent, whether labeled "non-branching continuity" or "inexpressible person."

  ***

  **Marking Scheme (Total: 25 Marks)**

  **A. Argumentative Moves (20 Marks)**
  *An 'A' grade answer (18-20 marks) must successfully execute the following four moves (5 marks each):*

  1.  **The Asymmetry Diagnosis:** Clearly distinguishes Parfit's symmetric Relation R (where branching is permissible) from the Buddhist requirement for unidirectional, unique karmic continuity.
  2.  **Reasoning Through the Fission Case:** *Crucial.* The student must reason through the specific ordination/transgression scenario. They must demonstrate that if both streams inherit the past, karma is doubled (unjust), and if neither does, karma is lost (unjust). They cannot simply state "karma would be confused."
  3.  **The Non-Branching Critique:** Analyzes the "non-branching clause." The student must argue *why* adding this clause threatens reductionism (i.e., it implies a "further fact" or substratum distinct from the causal flow of aggregates).
  4.  **Pudgalavāda Evaluation:** Assess the *avaktavya pudgala* not as heresy, but as a philosophical tool. The student must argue whether it solves the selection problem or merely labels the mystery (moving the difficulty up a level).

  **B. Clarity and Structure (5 Marks)**
  *   **0-2:** Disorganized, difficult to follow, or fails to address the second half of the prompt.
  *   **3-4:** Clear prose, logical flow, addresses both parts of the question.
  *   **5:** Elegant synthesis, precise terminology, seamless transition between Parfitian and Abhidharmic frameworks.

  **C. Characteristic Mistakes and Penalties**
  *If the following errors occur, marks are deducted from the total score as indicated. These are graded as philosophical errors, not mere omissions.*

  1.  **The "Chariot" Evasion (-5 Marks):**
      *   *Error:* Relying on the Milindapañha chariot simile or listing the five aggregates to assert "there is no person" without addressing the fission mechanics.
      *   *Philosophical Rationale:* This is a category mistake. It treats an ontological denial as a solution to a problem of moral attribution. Denying the driver does not explain which chariot bears the fine if the chariot splits in two.
  2.  **Parfitian Uncritical Adoption (-4 Marks):**
      *   *Error:* Arguing that because Parfit accepts branching, the Buddhist should too, ignoring the specific soteriological necessity of unique retribution.
      *   *Philosophical Rationale:* This ignores the normative stakes of the prompt. It conflates "what matters in survival" (Parfit) with "what matters in retribution" (Karma), failing to engage with the specific constraints of the Buddhist ethical framework.
  3.  **Appeal to Orthodoxy (-3 Marks):**
      *   *Error:* Dismissing the Pudgalavāda position solely because it was historically condemned as heretical by the Theravāda or Sarvāstivāda.
      *   *Philosophical Rationale:* This is an ad hominem/genetic fallacy. The question asks for a philosophical evaluation of the *pudgala*'s utility in solving fission, not a historical report on sectarian debates.
  4.  **The "Convention" Stopgap (-3 Marks):**
      *   *Error:* Asserting that the distinction between Stream A and Stream B is "merely conventional" and therefore the problem dissolves.
      *   *Philosophical Rationale:* This begs the question. If the distinction is merely conventional, then moral responsibility is also merely conventional. If responsibility is merely conventional, the urgency of liberation and the reality of suffering (the core of the First Noble Truth) are undermined. The student must address the tension, not dissolve it by fiat.

  **Grade Boundaries:**
  *   **23-25 (A+):** Flawless execution of all four moves; nuanced handling of the Pudgalavāda critique; no characteristic mistakes.
  *   **20-22 (A):** Strong reasoning on the fission case; clear understanding of the non-branching clause risk; minor lapses in the Pudgalavāda comparison.
  *   **17-19 (B):** Correctly identifies the asymmetry but struggles to reason through the specific transgression case; relies too heavily on reporting positions rather than arguing.
  *   **14-16 (C):** Identifies the basic tension but falls into one of the Characteristic Mistakes (e.g., using the Chariot simile to bypass the metaphysical problem).
  *   **<14 (Fail):** Fails to address the fission case or fundamentally misunderstands the relation between reductionism and karma.
