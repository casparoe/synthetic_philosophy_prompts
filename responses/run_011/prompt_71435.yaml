prompt: |-
  ok so I just spent two hours arguing with a friend over beers about Malthus and I still can't let it go. His line: Malthus wasn't wrong, he was "right but early" — the whole arithmetic-versus-geometric growth thing was always going to bite, it just got pushed back by the Green Revolution and by birth rates falling on their own, so anyone who says he's been refuted is missing the point. I said thats a rescue, not a vindication, because by that logic no long-run prediction about resources could ever fail. He said I was being a naive falsificationist who doesn't get that every prediction leans on auxiliary assumptions anyway. Neither of us budged, so now I want to turn it into a final exam question for my upper-level philosophy of science seminar (about 30 students, mostly juniors and seniors, 45 minutes, 25 points).

  Write one essay question on whether a long-run theory can be "right but early" in a way that isn't just an ad hoc rescue, using Malthus's population argument as the case. The crux I'm after: a good answer has to say what a *legitimate* deferral would have to contain — some independently supported delay mechanism, a bounded time window, a discriminating test against a rival account like the one where population pressure itself drives agricultural innovation — and has to explain why a theory that can soak up any delay whatsoever ends up compatible with every possible course of events. It shouldn't be answerable by summarizing the Essay or by name-dropping Popper and Lakatos with the right vocabulary attached.

  Give me: the question exactly as students would see it on the paper, a model answer of about 650 words, and a grading rubric out of 25 points that spells out the specific moves that seperate an A from a B, how many points each is worth, and the two or three mistakes that should cost the most (like treating the Duhem-Quine point as though it licensed any rescue you like). Start straight in with the question text — no preamble, no restating my setup, no commentary about what you picked.
