      *   Counter: A rule like "P, therefore Q" cannot successfully validate itself in a truth-preserving way because it doesn't preserve truth. Modus Ponens does. The validation argument relies on the rule actually working. So not *any* rule can do it. This is a known objection (e.g., by Susan Haack).

  8.  **Refining the Meta-Claim:**
