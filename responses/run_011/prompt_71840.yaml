      *   **Step (1):** *To reason from P to Q in accordance with a rule R is to accept that R licenses the move from P to Q.*
          *   *Status:* Highly contested. This is the "Intellectualist" or "Internalist" view of rule-following. Wittgenstein (*Philosophical Investigations*) and Kripke (*Wittgenstein on Rules and Private Language*) challenge this. Also, Gilbert Ryle (knowing-how vs. knowing-that). Many externalists (e.g., reliabilists) deny that an agent must *accept* the rule to use it validly.
          *   *User Preference:* User is "most attached to (1)." So, I should probably try to save it if possible, or explain the cost of keeping it.
