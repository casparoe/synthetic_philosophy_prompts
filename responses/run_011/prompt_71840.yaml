      *   **Step (2):** *Acceptance is a state with propositional content.*
          *   *Status:* Generally accepted for "acceptance," but maybe not for implicit "following." If (1) is true, (2) usually follows.

      *   **Step (3):** *Any state with propositional content... calls for a reason.*
          *   *Status:* This is a strong Internalist/Infantilist constraint. Dogmatists (like Pryor) or Externalists would reject this. Not all beliefs need prior reasons (foundational beliefs, perceptual beliefs).
