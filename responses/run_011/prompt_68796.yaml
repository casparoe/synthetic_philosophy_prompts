  The Moral Arithmetic of Protein
  Cumberland Valley Protein has recently faced scrutiny from both the ballot box and the seminar room, specifically regarding our confinement practices. While the county seeks to ban new operations and the university philosophers demand ethical clarity, we believe both groups misunderstand the moral architecture we have adopted. We operate under a two-tier system derived from modern libertarian theory, which distinguishes between persons protected by side constraints and animals subject to utilitarian aggregation. This distinction does not excuse us from responsibility; rather, it demands a more rigorous accounting of welfare than the abolitionists propose. For our human employees, side constraints forbid violating their rights regardless of the aggregate good. For our livestock, however, moral value is calculated by weighing interests and summing them across the population. This allows us to make hard choices that actually increase total welfare.

  Consider our recent adjustment to the broiler lifecycle. We retired a fixed number of short-lived, comfortable broilers and replaced them with a larger number of marginally less comfortable ones. The critics call this intensification, but our compliance department calls it moral progress. By running the arithmetic, we determined that the aggregate comfort-hours of the larger flock outweigh the loss of individual comfort in the smaller cohort. We take these calculations seriously. If we can produce more units of welfare per square foot, we are ethically obligated to do so. The birds' suffering counts heavily in our spreadsheet, but it is not an absolute veto. It is a variable to be optimized alongside yield. We report this arithmetic with real pride, knowing that a purely rights-based framework would have forced us to shut down, thereby eliminating all those units of welfare entirely.

  However, administering this dual system creates significant bureaucratic friction. Harms to our human night-shift crew cannot go into the same spreadsheet as harms to the birds. A broken finger on the line cannot be offset by increased aviary space, because human rights are side constraints, not utilitarian inputs. Our compliance team must keep two ledgers and reconcile them at quarter's end, ensuring that no human violation is traded for animal gain. This administrative exasperation is the price of moral precision. It slows down decision-making, but it ensures we never treat a person as a means to an end, even if that end is poultry welfare.

  Yet, difficulties arise specifically because the scheme has two tiers. First, we have barn cats who hunt mice. These cats are conducting a small utilitarian atrocity inside our own facility, reducing the aggregate welfare of the rodent population without producing protein. We are currently debating whether to neuter them to stop the utility loss, as their predation violates the maximization principle we apply to non-persons. Second, our liability insurer has issued a written demand that we state exactly which property places a being on the protected side of the line. Every candidate we offer seems to sort somebody into the wrong column. If we say rationality, we risk excluding some humans. If we say sentience, we risk including some pigs. Third, there is the accusation that our business is a case of one species dominating another. We rebut this by noting that domination implies tyranny, whereas we see stewardship of the aggregate. We are not dominating the birds; we are managing their numbers to ensure the greatest total existence of welfare.

  Finally, we must dispose of the objection that taste is too trivial a ground for killing. Our marketing department has stopped describing flavor as an appetite and started describing it as a heritage. Heritage carries weight in the human ledger, and when aggregated across millions of consumers, it constitutes a significant moral interest that outweighs the individual bird's claim to life under the utilitarian tier. We are doing the hard work of balancing two moral worlds so that dinner can remain both ethical and possible.
