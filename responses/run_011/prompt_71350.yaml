  **The Scenario**

  At the University Hospitals clinic outside Cleveland, the consent form offers two schedules for the neuro-swapping procedure. Schedule A completes the replacement in three weeks; Schedule B stretches it over eighteen months. Both guarantee that behavioral output and reported experience remain indistinguishable from baseline at every instant. The difference lies in the overlap phase: during Schedule B, the biological tissue is kept metabolically active alongside the synthetic substitutes for a duration sufficient to allow both subsystems to maintain independent causal histories while wired to the same output stream.

  In the slow schedule, this prolonged redundancy allows the synthetic lattice to accumulate internal state variations distinct from the decaying biological tissue, despite the merged output masking the divergence. By month twelve, the synthetic subsystem possesses enough structural integrity to sustain the patient's psychological profile independently, while the biological subsystem remains viable enough to do the same. The skull temporarily houses two distinct causal chains capable of supporting the same mind, fused only at the point of motor output and verbal report.

  When the biological tissue finally expires in Schedule B, the synthetic system continues, but the continuity chain has branched and pruned. The entity that walks out of the clinic is a psychological duplicate that survived the branching event, not the original organism that entered it. Schedule A swaps the modules rapidly enough that the synthetic system never achieves independent viability before the biological system ceases function, ensuring a single, unbranched causal thread transfers from organic to synthetic substrate without a period of dual viability.

  ***

  **Analysis**

  **Psychological-Continuity Theorist (with No-Branching Clause):** For this theorist, identity requires not just psychological connectedness but also that there be no competing branches. In the slow version, the period of dual viability creates a temporary branching event where two distinct physical substrates both support the psychology. When the biological branch dies, the survivor is a "closest continuer" but not the original person, because the non-branching rule was violated. The fast version avoids this window entirely; the biological substrate dies before the synthetic one becomes an independent candidate, preserving identity. Here, the rate variable bites hard: speed prevents branching.

  **Functionalist Gradualist:** This view holds that identity supervenes on functional organization, not physical substrate or history. If the functional architecture is preserved at every instant, identity is preserved, full stop. For this theorist, the rate is invisible; both schedules are equally safe because the input-output mapping never breaks. To make the slow version dangerous for this theory, you must relax the constraint that "function" includes internal causal states. If "function" means only observable behavior, the Functionalist is vulnerable to the "Swampman" objection: a duplicate that acts identical but has the wrong history.

  **Animalist:** The animalist believes the patient is the biological organism. For them, both schedules are slow suicides. Replacing brain tissue with synthetic modules destroys the organism regardless of speed. The rate variable is irrelevant; the outcome is death in both cases. The only difference is how long the organism struggles before ceasing to be. This theory offers no help in distinguishing the schedules as "better" or "worse" for survival, only for duration of suffering.

  **Closest-Continuer:** This view asks which future entity is most similar to the original without violating branching rules. In the slow version, the synthetic system becomes a very close continuer while the biological system is still alive, creating competition. The biological system's death resolves the competition, but the existence of the rival durant the overlap undermines the claim. The fast version ensures the synthetic system is the *only* continuer available at the moment of biological cessation.

  **The Single Feature:** The work is done entirely by the **window of dual viability**. This is the period where both subsystems are robust enough to sustain the mind independently while coupled. If you squeeze the overlap to nothing (instant swap), you face the teleporter problem (is continuity broken by the gap?). If you lock the systems so tightly that they cannot drift apart internally (no independent causal history), the slow version becomes safe again because no second candidate for identity can emerge.

  **Constraint Satisfiability:** Your constraints are not jointly satisfiable as written. If "functional architecture preserved at every instant" includes internal causal states, divergence is impossible by definition. To make the scenario work, you must relax "function" to mean **observable behavior and reported experience**, allowing internal causal states to diverge during the overlap. You need the subsystems to be behaviorally isomorphic but causally distinct.

  **The Defense:** A Functionalist would attack this case by arguing that internal causal history is irrelevant to identity. They would say, "If she remembers your childhood, loves your coffee, and fears your death, she is you. Whether her synapses fired in sequence A or sequence B to produce that thought is metaphysical noise." They would claim the "second somebody" is a philosophical ghost story invented to protect a intuition about biology that has no bearing on personhood.

  **Final Verdict:** Her choice is not a real choice between survival and death, but a gamble on which metaphysical definition of "she" happens to be true.
