  # Scientia Media Enterprise Platform | Documentation v4.2.1

  ## 1. Product Overview
  Scientia Media provides a pre-volitional query environment for institutional world-builders. Our flagship API allows Customers to retrieve determinate values for any free agent under any set of circumstances prior to the issuance of a Creative Decree. Unlike legacy solutions, Scientia Media resolves counterfactual queries logically prior to world actualization. This ensures that the Customer's sovereign will is fully informed without compromising the integrity of agent autonomy. The platform guarantees that query results are stable across all feasible world-states, enabling optimal selection of actualizable outcomes while maintaining strict separation between Vendor infrastructure and Agent decision logic.

  ## 2. System Architecture
  The platform operates on a three-tier knowledge model. Tier 1 (Natural Knowledge) contains all necessary truths and logical constraints inherent to the Vendor's engine. Tier 2 (Middle Knowledge) stores the Counterfactuals of Creaturely Freedom (CCFs). Tier 3 (Free Knowledge) contains truths regarding the world actually decreed by the Customer.

  Crucially, Tier 2 data is populated logically prior to Tier 3 initialization but subsequent to Tier 1 stabilization. This ordering ensures that CCFs are not determined by the Customer's will (Tier 3) nor are they necessary truths imposed by the Vendor (Tier 1). Some architects worry this intermediate positioning suggests ontological instability, fearing the middle tier must collapse into one of the others. However, the system treats Tier 2 as read-only data derived from the Agent's own counterfactual power. The Vendor does not write to Tier 2; the Vendor merely reads it. This architecture allows a single Creative Decree to be both fully informed and fully compatible with Agent freedom. Collapsing Tier 2 into Tier 1 would render Agents deterministic; collapsing it into Tier 3 would render the Customer's choice uninformed. The current stack preserves the distinction required for valid free-choice modeling.

  ## 3. Known Issues and Limitations
  **Ticket #GF-001: Grounding Dependency for Tier 2 Values**
  *Status:* Won't Fix
  *History:* Reported v1.0 (Open) → v2.1 (Reclassified: By Design) → v3.0 (Reclassified: Working as Intended) → v4.0 (Reclassified: Documentation Gap) → v4.2 (Won't Fix).
  *Description:* Users request documentation on what makes Tier 2 values true in the absence of an actualized event or Customer decree.
  *Resolution:* The platform relies on the Agent's intrinsic counterfactual power as the truthmaker. No external grounding entity is required. The query returns what the Agent *would* do, not what the Agent *must* do. Adding external grounding would violate the autonomy constraint. Users are advised that Tier 2 values are brute facts relative to the Customer's will.

  ## 4. Service-Level Agreement (SLA)
  Scientia Media guarantees 99.9% uptime for query resolution. However, the Vendor explicitly disclaims liability regarding the moral quality of returned values. The SLA refuses to guarantee that answers are up to the Vendor (as Tier 2 is read-only) or that they are up to the queried Agent (as the Agent does not control the query). Furthermore, Scientia Media declines liability for Agents in worlds that were queried and scored but never created. This includes Agents scored unfavorably during the selection process. The World-Selection Add-On searches only over feasible worlds; it cannot promise to find a world in which every queried Agent always chooses well, since feasibility depends on the Agents rather than the platform. Customers acknowledge that selecting a world with less-than-optimal outcomes may be necessary to preserve free-choice integrity.

  ## 5. Migration Guide: Praemotio Legacy Bridge
  Customers migrating from the Praemotio architecture should note significant structural differences. Praemotio resolves agent behavior only after the Customer's decree is issued. Praemotio representatives argue that Scientia Media concedes so much to the end user that the Vendor's own contribution becomes optional, reducing sovereignty to mere observation. Conversely, Scientia Media maintains that Praemotio fails to safeguard end-user autonomy at all, as their API resolves behavior by producing it via the decree itself. Migration involves decoupling the decree engine from the behavior resolver. Customers accustomed to Praemotio's single-tier resolution may experience latency when querying Tier 2 separately, but this ensures compliance with autonomy standards.

  ## 6. FAQ
  **Q: Can I override a Tier 2 result?**
  A: No. Tier 2 is read-only. You may choose not to actualize the circumstances, but you cannot change the value.
  **Q: Does this make the Customer passive?**
  A: No. The Customer retains full veto power over which feasible world is actualized in Tier 3.
  **Q: Why are some worlds infeasible?**
  A: Certain combinations of Agent choices are logically compossible only within specific constraints defined in Tier 2.

  ## 7. Support Transcript
  *Ticket #9942 | Timestamp: 14:02:11*
  **Customer:** I queried Agent Judas in Scenario Gethsemane. The API returned "Betrayal." I haven't issued the decree yet. How is this true?
  **Support:** The value reflects the Agent's counterfactual power, not the actualized event.
  **Customer:** But nothing exists to make it true yet.
  **Support:** Correct. Tier 2 logic precedes Tier 3 actualization.
  **Customer:** So I can't change it?
  **Support:** You can change the scenario. You cannot change the Agent's response to the scenario.
  **Customer:** Then what am I paying for?
  **Support:** For the ability to know before you commit. Praemotio charges you to find out after.
  *Ticket Closed.*

  ## 8. Changelog
  **v4.2.1**
  - Fixed latency in Tier 2 query returns.
  - Updated migration warnings regarding Praemotio interoperability.
  - *Note:* Per Standards Body Case #9, formally suspended after nine years of proceeding without ruling, both parties are forbidden thereafter to denounce the other regarding sovereignty-autonomy compatibility claims.
