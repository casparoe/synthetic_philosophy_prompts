answer: |-
  # The Margin of Error

  The waiting room of the Clarity Centre smelled of ozone and stale coffee. The furniture was aggressively ordinary: beige fabric chairs, a laminate table, a potted fern that looked as though it had given up on photosynthesis weeks ago. There were no logos on the walls, only a small plaque by the lift stating the clinic's registration number.

  Mara sat with her hands folded in her lap. Across from her, Elias stared at the tablet in his hands. They had both signed the consent forms an hour ago. They had both chosen the same mental state for monitoring: *Intending to stay in the relationship.* It was the sort of thing that fades by imperceptible degrees, a slow erosion rather than a break. Perfect for the sensors.

  The difference was in the checkboxes.

  Mara had ticked Box B: The Iterative Knowledge Protocol. The salesman had called it the KK Package. It guaranteed that if she knew she intended to stay, she would know that she knew it. It was the cheaper option. It left the fog in place but ensured she wouldn't mistake the fog for clarity.

  Elias had ticked Box A: The Luminosity Guarantee. It cost them their savings, plus a second mortgage on the flat. It promised that if he was in the state, he would be in a position to know it. Total self-transparency. No blind spots.

  A technician called them in. She was a woman of indeterminate age wearing a grey tunic. She led them into a small room dominated by a single monitor. There were no windows. The hum of the servers was the only sound.

  "Results are processed," the technician said. She didn't sit. She tapped the screen, bringing up two graphs.

  The left side was Elias's. It was a solid block of green. There were no gradients, no dips, no fading lines. It was a rectangular prism of data stretching from the day they met to this morning.

  "The Luminosity Guarantee requires a margin for error of zero," the technician said, her voice flat. "For you to be in a position to know you intended to stay at every moment you intended to stay, the state must be discriminable from its negation at every point. But intention fades. It shifts by degrees too small to detect. If you knew you were in the state at moment *i*, and moment *i+1* is indistinguishable, you would have to know you were in the state at *i+1* as well. To satisfy the guarantee without forcing you into error, the state cannot have boundaries."

  She pointed to the solid green bar. "The data indicates you either always intended to stay, or you never did. There is no middle ground. The algorithm cannot locate a transition point because a transition implies a boundary you could not know you were crossing. Given the current dissolution of the partnership, the system defaults to the empty reading. You never intended to stay. Not once."

  Elias didn't blink. He looked at the green bar, then at Mara. The cost of the box he had ticked was the ambiguity they had lived in for five years. He had paid for the truth, and the truth was that the love he thought was fading had never existed at all. The triviality of the result sat in the room like a third person. He had bought certainty and received a null set.

  Mara looked at the right side of the screen. Her graph was different. It was a jagged line with distinct gaps. There were periods of green, periods of red, and periods of grey.

  "The KK Protocol," the technician said, turning to Mara. "This does not guarantee you know when you are in the state. It guarantees that your knowledge iterates. When you know, you know that you know. But it allows for moments where knowledge fails."

  Mara leaned forward. The grey zones were labelled *Known Ignorance*.

  "In these intervals," the technician continued, "you do not know if you intend to stay. But crucially, the protocol ensures you know that you do not know. You cannot introspect your way out of these gaps. They are stable. You are barred from claiming certainty where there is none, but you are also barred from claiming ignorance where you have knowledge."

  Mara traced the grey line with her finger. She could see the exact weeks where she had been unsure. Under the Luminosity package, those weeks would have been forced into a binary: either she was lying then, or she was lying now. But here, the uncertainty was preserved as a fact. She knew she didn't know. It was a solid, heavy thing, but it was hers.

  "Can we change it?" Elias asked. His voice was hollow. "Can we revert to the grey?"

  "The Luminosity scan overwrites the neural pathway," the technician said. "The state is now fixed in the logs. You cannot reintroduce ambiguity. You live inside the reading now."

  Elias stood up. He looked at the solid green bar, the impossible rectangle that erased the slow drift of their ending. He had wanted to know when it stopped. Instead, he had learned it never started.

  Mara stood too. She looked at her own graph, the honest gaps where she had been lost. She would have to live with not knowing, but at least she knew she didn't know. Elias had paid for the light, and it had burned everything down. She had paid for the shadow, and it had left her something to hold.

  "Thank you," Mara said.

  They walked out into the corridor. The air smelled of dust. Elias walked ahead, carrying the bill for the procedure in his pocket like a stone. Mara followed, carrying the uncertainty, which was lighter, but would never go away.

  ***

  **What I built in**

  The Luminosity argument is dramatised through Elias's graph. The line "If you knew you were in the state at moment *i*, and moment *i+1* is indistinguishable, you would have to know you were in the state at *i+1* as well" encodes the margin-for-error principle. Because the state ('intending to stay') fades by degrees, maintaining luminosity forces the state to be trivial. I chose the 'empty' reading (he never intended to stay) because it maximises the tragic cost of the concrete payment (their savings/mortgage); buying certainty destroys the history of the relationship.

  The KK principle is realised in Mara's graph. The technician's explanation—"You know that you do not know. You cannot introspect your way out of these gaps"—illustrates stable ignorance. Unlike Elias, whose product forced a false binary, Mara's product allows her to possess knowledge of her own ignorance without collapsing it into knowledge of the state. The distinction lands in the final image: Elias carries the destructive truth (Luminosity), while Mara carries the stable uncertainty (KK).
