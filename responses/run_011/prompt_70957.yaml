answer: |-
  To identify the principles consistent with your five precedents, we must first clear the field of those that fail. The first casualty is **Local Maximization**. This principle dictates that an agent should always choose the option strictly preferred at the moment of choice. It delivers the correct verdict for (ii), (iii), and (v), but it collapses at (i). Under Local Maximization, the agent who cycles through A, B, and C is perfectly rational, as she maximizes utility at every node. Your verdict that she is irrational, regardless of the fee size, eliminates this principle immediately.

  The second casualty is **Consequentialism**. This principle assesses rationality solely by the final outcome relative to available starting points. It survives (i) (bad outcome) and (ii) (good outcome), but it dies at (v). In (v), the agent ends with her original holding, suffering no loss. A purely consequentialist view must deem her rational, or at least not irrational. Your verdict that there is "nothing to fasten onto" implies that rationality requires a diachronic structure of choice, not merely a static result. Thus, rationality must be a property of the *process* of choosing over time, not just the terminal state.

  This leaves two surviving candidates that accommodate all five verdicts.

  The first is **Diachronic Plan Adherence**. This principle holds that an agent is rational if her sequence of actions conforms to an optimal plan formed at the outset of the sequence, regardless of the psychological mechanism sustaining it. In (i), the agent has no plan or fails to follow one. In (ii) and (iii), she forms a plan (via foresight or pledge) and adheres to it. In (iv), the transitive agent fails to adhere to the branch she globally prefers. In (v), no sequence exists, so no plan is possible, rendering assessment void.

  The second is **Deliberative Control**. This principle requires that the agent's actions be causally connected to her recognition of the sequential structure. It is not enough to follow the path; one must follow it *because* it is the path. This fits (i) (no recognition), (ii) (recognition via backward induction), and (iii) (recognition via binding). It fits (iv) (failure of control) and (v) (no sequence to recognize).

  **The Sixth Case**

  Under **Diachronic Plan Adherence**, the student's agent is **rational**. She finishes at B, having avoided the money pump. Her trajectory matches the agent in (ii). The principle treats the standing policy ("no second offers from strangers") as a functional equivalent to a plan. The closest analog is (ii), as both agents traverse the same path to the same superior outcome. The fact that the policy was adopted a decade ago for unrelated reasons is irrelevant; the action adheres to an optimal constraint.

  Under **Deliberative Control**, the student's agent is **irrational** (or perhaps unassessable, leaning toward irrational). She does not act on the basis of the sequence's structure. She is thinking about lunch; the avoidance of the pump is accidental relative to her reasoning. The closest analog is (v). In (v), a disposition to pump was insufficient for critique because no sequence occurred. Here, a sequence occurs, but the *reasoning* required to master it is absent. This view maintains that the praise in (ii) was not for ending at B, but for *seeing* that ending at B was necessary. If foresight mattered in (ii), its absence in (vi) must matter now.

  **Advice on Consistency**

  To remain consistent with your precedents, you should **convict** the student's agent of irrationality (or declare the case unassessable, distinct from rational). This preserves **Deliberative Control** as the governing principle.

  If you **acquit** her, you prioritize Diachronic Plan Adherence. You make safety from exploitation the sole criterion of rationality. The cost is high. First, you undermine the praise in (ii). If the reasoning process is irrelevant, why did you insist on the detail that she "works backward"? You would have to admit that her foresight was ornamental. Second, you endanger your stance in (i). You claimed "three cents would indict her as surely as three hundred dollars." This suggests the *structure* of the choice condemns her, not just the magnitude of the loss. If accidental avoidance exonerates the sixth agent, then the indictment in (i) relies on the agent's failure to avoid, not the loss itself. You risk turning rationality into a matter of luck: the agent in (i) is unlucky to be naive; the agent in (vi) is lucky to have a quirky policy.

  If you **convict** her, you prioritize the connection between agency and reason. The cost here involves (v) and (iii). Regarding (v), you must ensure you do not slide into saying her disposition *was* assessable. You must maintain that without a sequence, deliberative control cannot be exercised. Regarding (iii), you praised the agent for honoring a pledge against her local preference. If you convict (vi) for lacking the right reason, you must ensure (iii) is praised for the *resolution* to honor the pledge, not just the outcome. This is consistent, provided you view the pledge as a tool of deliberative control—a way to force the future self to obey the past self's reasoning. Convicting (vi) affirms that rationality is the governance of choice by reason, not merely the avoidance of loss. It preserves the distinction between a smart agent (ii) and a lucky one (vi).

  **A Seventh Case**

  To discriminate between **Diachronic Plan Adherence** and **Deliberative Control** where the sixth case leaves them in tension, consider this:

  The agent forms a specific plan at the outset to replicate the strategy of (ii): accept the first swap, refuse the second. She enters the sequence with this intention. At the first node, she accepts the swap as planned. At the second node, she suffers a momentary lapse of memory regarding the plan. However, the broker offering the second swap sneezes violently. The agent has a standing, unrelated phobia of sneezing strangers and immediately recoils, refusing the swap. She finishes at B, having followed her original plan's trajectory, but the execution at the critical node was caused by phobia, not planning.

  **Diachronic Plan Adherence** verdicts this **rational**. The agent's actions conform to the optimal plan formed at $t_0$. The causal history of the specific refusal is secondary to the existence and conformity of the plan.

  **Deliberative Control** verdicts this **irrational**. At the second node, the agent's choice was not governed by her recognition of the sequence or her prior intention. She lost control of the plan. The outcome is correct, but the agency is broken. This case isolates the causal link between plan and action, forcing a choice between valuing the blueprint or the construction.
