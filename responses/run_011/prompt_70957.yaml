      *   *(ii) Sophisticated Choice:* Sees sequence, works backward. Accepts 1st, refuses 2nd. Ends at B, minus 1 fee. **Verdict: Rational.** (Key: Foresight + strategic refusal despite local preference).
      *   *(iii) Self-Binding:* Binds self to accept 1st & 2nd, refuse 3rd. Ends at A, minus 2 fees. Honors pledge even when local preference says swap. **Verdict: Rational (Virtuous).** (Key: Resolute choice against local preference for global gain).
      *   *(iv) Transitive Agent:* Has transitive preferences. Takes local option that forecloses better global branch. **Verdict: Irrational.** (Key: Dynamic inconsistency in transitive agents is irrational).
      *   *(v) Disposition Only:* Cyclic preferences, disposed to pump *if* offered, but only offered one choice. Chooses and leaves. **Verdict: No Assessment.** (Key: Rationality requires opportunity for sequence; mere disposition isn't enough for critique).

  3.  **Identify Candidate Principles:**
      *   *Candidate 1: Myopic Choice (Naive Maximization).* Choose the locally preferred option at each node.
          *   *Fails:* Verdict (i). This principle calls (i) rational. The professor says (i) is irrational. *Eliminated by (i).*
      *   *Candidate 2: Sophistication (Backward Induction).* Anticipate future choices, choose current action based on resulting outcome.
          *   *Fails:* Verdict (iii). In (iii), the agent honors a pledge against her *then-present* preference. Sophistication assumes you choose what you *will* choose. If you know you'll break the pledge, you don't make it. If you know you'll keep it, you must prefer keeping it locally. But (iii) says she honors it *against* local preference. Also, (iii) ends at A (2 fees), (ii) ends at B (1 fee). Sophistication usually leads to (ii). Does it allow (iii)? Resolute Choice is distinct from Sophistication. Sophistication treats future selves as opponents. Resolute Choice treats them as allies to be commanded.
          *   *Wait, let's refine:* Sophistication says "Choose what leads to the best outcome given what you *will* do." In (iii), she *binds* herself. If binding is an option, sophistication might take it. But the core of (iii) is honoring the pledge *at the node* against local preference. Sophistication usually implies consistency between planning and doing. If she prefers C to A at node 3, sophistication says she takes C. To get (iii), we need **Resolute Choice**.
      *   *Candidate 3: Resolute Choice (Plan-Based).* Form a plan at the start that maximizes outcome; stick to it even if local preferences diverge later.
          *   *Fits:* (i) (No plan/failed plan), (ii) (Plan to stop at B), (iii) (Plan to stop at A via pledge).
          *   *Problem:* (v). Resolute choice requires a sequence to plan over. (v) has no sequence. So (v) is consistent (no plan possible).
          *   *Problem:* (iv). Transitive agent fails to follow plan. Consistent.
      *   *Candidate 4: Actual Sequence Evaluation (Outcome-Based).* Rationality is assessed on the actual path taken relative to available paths, regardless of mental state.
          *   *Fails:* (v). In (v), the outcome is fine, but the verdict is "no assessment." This principle would say "Rational" because she didn't lose money. The professor says "nothing to fasten onto." So we need a principle that requires *agency over time*, not just outcome.
      *   *Candidate 5: Diachronic Consistency (Intention-Action).* Rationality requires that intentions formed at $t_1$ govern actions at $t_2$, provided the plan remains optimal.
          *   *Fits:* (i) (Inconsistent), (ii) (Consistent), (iii) (Consistent via pledge), (iv) (Inconsistent), (v) (No diachronic span).

      *   *Refining the Survivors:*
          1.  **Sophisticated Choice (Backward Induction):** You choose based on what you predict you will do.
          2.  **Resolute Choice:** You choose based on what you *intend* to do, overriding local preference if necessary.
          *   *Wait, check (ii) vs (iii).* In (ii), she refuses the second swap because she knows the third will happen (or rather, she knows the third is a swap she'd take, leading to loss). Actually, in (ii), she refuses the second to avoid the third. She acts in accordance with her prediction. In (iii), she acts *against* her local preference via a pledge.
          *   *Crucial Distinction:* Sophistication cannot explain (iii) if the agent *prefers* C to A at the moment of the third node. Sophistication says "I will choose C, so I must plan for C." Resolute Choice says "I planned for A, so I choose A."
          *   *So, Resolute Choice is the strong candidate.*
          *   *What about Sophistication?* Does it fit (ii)? Yes. Does it fit (iii)? Only if the pledge changes the local preference (e.g., guilt cost). But the prompt says "by her own then-present lights be the attractive thing to do... she honours it anyway." This implies preference remains C > A. So Sophistication fails (iii).
          *   *Wait, is there a principle that covers both (ii) and (iii)?* Yes, **Plan-Based Rationality**. Whether the plan is sustained by prediction (ii) or resolution/pledge (iii).
          *   *Let's look for two survivors to contrast in the Sixth Case.*
          *   *Survivor 1: Strategic Rationality (Sophistication + Resolute).* The agent must act on a global plan formed at the outset.
          *   *Survivor 2: Process Rationality.* The agent must arrive at the correct action via the correct *reasoning process* (foresight or commitment), not accidentally.

      *   *Re-evaluating the "Principles":*
          The prompt asks for principles consistent with *all five*.
          1.  **Myopic Maximization:** Eliminated by (i).
          2.  **Outcome Dominance Alone:** Eliminated by (v). (v) has a good outcome but no assessment. Rationality requires a *sequence* of choices to evaluate.
          3.  **Sophistication (Backward Induction):** Eliminated by (iii). In (iii), the agent acts against her predicted local choice without the prediction changing the preference. She relies on the *pledge*, not the prediction of her future weakness. Wait, if she binds herself, she predicts she *will* honor it. But the text says "abandoning the pledge would by her own then-present lights be the attractive thing to do." This suggests a conflict between Plan and Local Preference. Sophistication resolves conflict by yielding to Local Preference (predicting the yield). Resolute Choice resolves it by yielding to Plan. So Sophistication is out if (iii) is truly Resolute.
