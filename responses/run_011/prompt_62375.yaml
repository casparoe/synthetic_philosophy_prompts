  Can you build me a decision tree that sorts someone into one of those camps? I'm thinking 7 or 8 branch questions, and every one of them has to be a concrete case they react to — a price they'd pay to play, a straight choice between two games, what they'd say if we actually ran it 500 times and split the pot, whether they think it's ok to be left with no verdict at all — not stuff like "do you think expected utility theory is complete." Someone answering shouldn't need to know any of the labels to get sorted.

