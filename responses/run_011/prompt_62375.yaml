  ### The Logical Space

  Before you draw the tree on your poster board, you need to know what axes you're actually measuring. The philosophers arguing about the Pasadena Game aren't just disagreeing about math; they're disagreeing about what "value" *is*. Here are the four main fault lines your questions will probe:

  1.  **Metaphysics of Utility:** Is human satisfaction bounded (is there a maximum possible "goodness") or unbounded (can something always be better)?
  2.  **Existence of Value:** Does every rational gamble have a determinate "fair price," or are some games value-less?
  3.  **Source of Normativity:** If the math breaks, does rationality go silent (no verdict), or must we force a verdict (pragmatism)?
  4.  **Aggregation Method:** Is "Expected Value" (the weighted average) the only way to sum up outcomes, or should we use medians, long-run frequencies, or truncations?

  ### The Decision Tree

  Here are 8 concrete questions. Draw this as a flowchart. Start at **Q1**. Follow the arrows based on the student's answer.

  **Q1: The Infinity Check**
  *"If you hit the jackpot on flip 100, is that moment infinitely good to you, or is there a limit to how happy a payday can make you?"*
  *   **There's a limit:** Go to **Leaf A**.
  *   **It could be infinitely good:** Go to **Q2**.

  **Q2: The Price Tag**
  *"Does this game have a specific fair price right now, like $5 or $10?"*
  *   **Yes, it has a price:** Go to **Q3**.
  *   **No, the question is broken:** Go to **Q5**.

  **Q3: The Ceiling**
  *"If we cap the maximum prize at $1 trillion, does that version of the game suddenly have a calculable fair price?"*
  *   **Yes, capping fixes it:** Go to **Leaf B**.
  *   **No, even the capped version is weird:** Go to **Q4**.

  **Q4: The Marathon**
  *"If you played the original game 10,000 times, would your average profit per game settle on a stable number?"*
  *   **Yes, it settles down:** Go to **Leaf C**.
  *   **No, it keeps jumping around:** Go to **Leaf D**. *(Note: This is a "Naive EU" leaf, often unattractive)*.

  **Q5: The Sweetener**
  *"Game A is the Pasadena Game. Game B pays exactly the same, plus an extra $1 on every single outcome. Is Game B strictly better?"*
  *   **Yes, B is definitely better:** Go to **Leaf E**.
  *   **No, neither is better:** Go to **Q6**.

  **Q6: The Typical Win**
  *"Since the 'average' payout is broken, should you value the game by the 'most likely' payout (the median) instead?"*
  *   **Yes, use the median:** Go to **Leaf F**.
  *   **No, median doesn't fix it:** Go to **Q7**.

  **Q7: The Walk Away**
  *"If the math says 'no value,' is it rational to just refuse to play?"*
  *   **Yes, refuse to play:** Go to **Leaf G**.
  *   **No, I'd still play or sell:** Go to **Q8**.

  **Q8: The Arbitrary Pick**
  *"If there's no right answer, is it okay to just pick a price arbitrarily and stick to it?"*
  *   **Yes, just pick one:** Go to **Leaf H**.
  *   **No, that's irrational:** (Loop back to Leaf G or admit confusion).

  ---

  ### The Leaves (Camps & Commitments)

  **Leaf A: The Hedonic Ceiling (Bounded Utility)**
  *   **The Camp:** "Unbounded utility is the problem."
  *   **Awkward Commitment:** You have to tell a billionaire that winning $1 billion isn't meaningfully better than winning $1 million if both exceed their personal happiness cap.

  **Leaf B: The Truncator (Cap Payoffs)**
  *   **The Camp:** "Cap the payoffs and see where the value goes as the cap grows."
  *   **Awkward Commitment:** You have to admit that changing the rule by one penny (the cap amount) can fundamentally change the game's value, even if that cap is never reached.

  **Leaf C: The Grinder (Long-Run Average)**
  *   **The Camp:** "Value it by the long-run average over many plays."
  *   **Awkward Commitment:** You have to explain why a game has a value for a casino playing 10,000 times but no value for a student playing once.

  **Leaf D: The Hopeless Optimist (Naive EU)**
  *   **The Camp:** "Standard Expected Utility (fails to converge)."
  *   **Awkward Commitment:** You claim the game has a value even though the math says the sum oscillates forever; you're basically guessing.

  **Leaf E: The Comparativist (Relative Value)**
  *   **The Camp:** "Compare it against a related gamble instead of valuing it on its own."
  *   **Awkward Commitment:** You can say Game B is better than Game A, but you can't say if either is worth paying $5 to play.

  **Leaf F: The Medianite (Alternative Aggregator)**
  *   **The Camp:** "Expectation isn't the right aggregator anyway."
  *   **Awkward Commitment:** You might prefer a game with a lower median payout but a massive jackpot over the Pasadena Game, violating standard dominance principles.

  **Leaf G: The Quietist (Rationality Silent)**
  *   **The Camp:** "Expected utility just doesn't apply here, rationality is silent."
  *   **Awkward Commitment:** You have to accept that two equally smart people can make opposite choices (one plays, one folds) and neither is wrong.

  **Leaf H: The Pragmatist (Arbitrary Verdict)**
  *   **The Camp:** "Force a verdict even if math fails."
  *   **Awkward Commitment:** You admit your price is made up, but insist you're rational for sticking to it.

  ---

  ### Empty & Unexplored Combos

  When you're talking to kids at the table, watch out for these combinations. If someone gives you these answers, they're likely confused or holding an incoherent position.

  1.  **Bounded Utility + "The Game is Coherent":** If they say there's a limit to happiness (Q1: Limit) but still think the Pasadena Game is a valid puzzle (Q2: Yes), they're contradicting themselves. Bounded utility solves the problem by making the game finite. *Verdict: Incoherent.*
  2.  **Long-Run + "Single Play Value":** If they say the value comes from playing 10,000 times (Q4: Yes) but insist that tells them the price for a *single* ticket (Q2: Yes), they have a philosophical gap. Frequentists usually deny single-case probabilities have meaning. *Verdict: Unattractive/Tension.*
  3.  **Silence + "Arbitrary Pick":** If they say rationality is silent (Q7: Yes) but also say it's okay to pick a price arbitrarily (Q8: Yes), they're straddling Quietism and Pragmatism. *Verdict: Unexplored/Hybrid.*

  ### Indistinguishable Leaves

  Be careful with these pairs; your questions might sort them the same way even though they're philosophically distinct.

  *   **The Truncator (Leaf B) vs. The Grinder (Leaf C):**
      *   *Why:* In many practical conversations, students will say "Yes" to both the Cap question (Q3) and the Marathon question (Q4). They intuitively feel both "capping it makes sense" and "averaging it out makes sense."
      *   *Fix:* If you get a "Yes/Yes," ask a tie-breaker: "If the cap is $1 trillion but you only play once, does it have a value?" The Truncator says Yes; The Grinder says No.

  *   **The Quietist (Leaf G) vs. The Comparativist (Leaf E):**
      *   *Why:* Both answer "No" to having a fair price (Q2). Both might hesitate on the Sweetener question (Q5) depending on how strict their dominance principle is.
      *   *Fix:* Ensure Q5 is phrased strictly: "Is B *strictly* better?" The Comparativist must say Yes (dominance holds even without values). The Quietist might say "I can't judge."

  *   **The Medianite (Leaf F) vs. The Quietist (Leaf G):**
      *   *Why:* If the median is also unstable (which it can be in some variants), the Medianite ends up with no verdict, looking exactly like the Quietist.
      *   *Fix:* Rely on Q6. If they endorse the *method* of using the median, they're Leaf F, even if the result is currently messy.
