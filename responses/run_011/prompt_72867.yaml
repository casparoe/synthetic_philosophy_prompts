answer: |-
  ### The 90-Minute Entitlement Triage Procedure

  **Objective:** Classify a starvation event into one of four buckets using only the provided data packet.
  **Analyst Profile:** No economics training required.
  **Constraint:** This procedure identifies *causal mechanisms* and *policy foresight*, not legal guilt (*mens rea*). It stops at "Policy choice X caused death Y." It does not determine if X was "evil." That is a values question left to the Senior Reviewer.

  #### Phase 1: Data Integrity & Availability (15 Minutes)
  **Q1: Do the harvest/import figures match the price signals?**
  *   **Action:** Compare reported harvest volume against local food price indices.
  *   **Sufficient Answer:** If harvest is reported "Normal/High" but prices are >200% of baseline, mark **Data Provenance: Contaminated**. Discard harvest figures. Rely on prices and wages as the true scarcity signal.
  *   **Sufficient Answer:** If harvest is "Low" and prices are "High," mark **Data Provenance: Clean**.
  *   **Simplification:** Drop complex asset trading (cattle/jewelry sales). Focus on Labor-to-Food entitlement.

  **Q2: Was there a physical absence of food?**
  *   **Action:** Check import/transport records. Could food have physically reached the zone?
  *   **Sufficient Answer:** If transport infrastructure was destroyed (war/nature) preventing *any* movement, flag **Natural/Chaos**. If transport existed but food was not moved, flag **Policy**.

  #### Phase 2: The Entitlement Shock (30 Minutes)
  **Q3: Did the Labor-to-Food Ratio collapse?**
  *   **Action:** Calculate the "Calorie Wage." (Daily Wage / Price of 1kg Staple) × Calories per kg. Compare to pre-crisis baseline.
  *   **Sufficient Answer:** If the Calorie Wage drops below 2,100 kcal/day for the primary labor group, an **Entitlement Failure** has occurred.
  *   **Distinction to Keep:** You must distinguish between *Food Availability Decline* (FAD) and *Entitlement Failure*. If food is present (imports/stocks exist) but wages cannot buy it, it is Entitlement Failure.
  *   **Distinction to Drop:** Intra-household distribution. Assume the wage earner feeds the family.

  **Q4: Who lost entitlement?**
  *   **Action:** Check wage data by sector.
  *   **Sufficient Answer:** If only agricultural laborers starved while urban/industrial wages held, it is a **Sectoral Entitlement Failure**. If all wages collapsed, it is a **General Economic Collapse**.

  #### Phase 3: State Action & Foreseeability (30 Minutes)
  **Q5: Did food leave the starvation zone?**
  *   **Action:** Check export/transport records during the price spike.
  *   **Sufficient Answer:** Yes = **Aggravating Policy**. No = **Neutral**.
  *   **Note:** If Data Provenance is Contaminated (Q1), and exports are recorded, treat exports as factual (regimes lie about harvest, less often about shipping manifests).

  **Q6: Was relief deployed at scale?**
  *   **Action:** Compare relief rolls to estimated excess mortality.
  *   **Sufficient Answer:** If relief covered <20% of the deficit population, mark **Inadequate Response**.
  *   **Sufficient Answer:** If relief covered >80% but deaths occurred, mark **Competent Response**.

  **Q7: Was the failure foreseeable?**
  *   **Action:** Check policy minutes for warnings *prior* to mass mortality.
  *   **Sufficient Answer:** If minutes show officials were warned of price spikes/shortages and chose not to act (or prioritized other spending), mark **Foreseeable**.
  *   **Boundary:** This procedure stops short of a crime finding. It establishes that the state *knew* the policy would kill and *continued* the policy. It does not establish that the *goal* was killing. That is a values question for the Senior Reviewer to decide if "Foreseeable" escalates to "Deliberate."

  #### Phase 4: Classification (15 Minutes)
  **Decision Tree:**
  1.  **Natural Disaster:** Physical absence of food (Q2=Yes) OR Competent Response (Q6=Competent) AND Entitlement Failure was due to sheer shock (e.g., 100% crop loss).
  2.  **Starvation as Deliberate Policy:** Entitlement Failure (Q3=Yes) + Exports Continued (Q5=Yes) + Relief Suppressed/Blocked (Q6=Inadequate) + Data Contaminated to hide crisis (Q1=Contaminated). *Requires evidence that policy was maintained specifically to prioritize non-survival goals over human life despite explicit warnings.*
  3.  **Foreseeable Entitlement Failure (Ordinary Policy):** Entitlement Failure (Q3=Yes) + No Exports or Mixed + Relief Slow/Inadequate (Q6=Inadequate) + Foreseeable (Q7=Yes). *Policy was negligent or ideologically rigid, but not explicitly genocidal.*
  4.  **Insufficient Data:** Price/Wage data missing or contradictory without resolution.

  ---

  ### Case Applications

  #### 1. Bengal 1943
  *   **Data:** Harvest was not historically low (Sen's finding), but prices spiked 300%. Wages for rural laborers did not keep pace. Rice exports continued early in the crisis. War priorities (scorched earth "Denial Policy" in coastal areas) disrupted local transport. Relief was slow and hampered by bureaucracy.
  *   **Procedure Run:**
      *   Q1: Clean (Harvest OK, Prices High = Entitlement Failure).
      *   Q3: Calorie Wage collapsed for rural labor.
      *   Q5: Exports occurred during shortage.
      *   Q6: Relief Inadequate.
      *   Q7: Foreseeable (Warnings existed, war priorities overrode them).
  *   **Analysis:** While exports and war priorities aggravated the crisis, the data does not support a specific intent to starve the population as a primary goal (unlike the GLF). It was a collision of war economics, inflation, and bureaucratic negligence.
  *   **Bucket:** **foreseeable entitlement failure produced by ordinary policy that nobody intended to starve anyone with**
  *   **Board Friction:** This will anger the board. They want "Deliberate Policy" to secure funding and moral outrage. This classification admits negligence but denies genocide. It is the historically accurate application of Sen without overreaching into legal guilt.

  #### 2. Great Leap Forward (GLF)
  *   **Data:** Regime reported record harvests. Prices (where observable/black market) skyrocketed. Exports of grain continued to fund industrialization while mortality spiked. Local officials falsified data to meet quotas; relief was blocked as "counter-revolutionary."
  *   **Procedure Run:**
      *   Q1: **Contaminated**. Harvest data discarded. Price/Export data prioritized.
      *   Q3: Massive Entitlement Failure (Labor could not buy food).
      *   Q5: Exports Continued.
      *   Q6: Relief Suppressed.
      *   Q7: Foreseeable (Local reports of starvation were punished/ignored).
  *   **Analysis:** The procedure flags "Data Contaminated." When you combine hidden harvest data, continued exports during mass death, and suppression of relief, the "Ordinary Policy" bucket breaks. The maintenance of extraction despite known lethal outcomes shifts this to Deliberate.
  *   **Bucket:** **starvation as deliberate policy**

  #### 3. Invented Present-Day Drought
  *   **Data:** 90% crop failure due to drought. International aid arrived within 3 weeks. Food prices stabilized by state subsidy. Wages collapsed due to lack of work, but free rations were available. Mortality occurred among isolated groups who could not reach camps.
  *   **Procedure Run:**
      *   Q1: Clean (Harvest Low, Prices Stabilized by subsidy).
      *   Q2: Physical absence of food initially, but imports filled gap.
      *   Q6: **Competent Response** (Relief covered >80%).
      *   Q3: Entitlement Failure occurred (No work), but State replaced entitlement with relief.
  *   **Analysis:** The procedure forces a hard truth: The state fixed the entitlement mapping (via relief), but people died due to the sheer scale of the shock and isolation. This contradicts the strong political economy view that *all* famine is a policy failure.
  *   **Bucket:** **natural disaster**
  *   **Board Friction:** This will anger the board. It implies some starvation is unavoidable even with perfect policy. This undermines the "end famine now" fundraising pitch. Do not soften it.

  #### 4. Ireland 1845-49
  *   **Data:** Potato Blight (Pathogen). Food (grain/livestock) produced in Ireland continued to be exported to Britain under armed guard. Relief (Public Works) was inadequate and ideologically constrained (laissez-faire).
  *   **Procedure Run:**
      *   Q1: Clean (Blight real, but other food available).
      *   Q3: Entitlement Failure (Laborers relied on potatoes; no money to buy grain).
      *   Q5: Exports Continued.
      *   Q6: Relief Inadequate.
      *   Q7: Foreseeable (Govt knew exports were continuing).
  *   **Analysis:** This is the hardest case. It sits on the knife-edge between "Deliberate" and "Ordinary." The exports were protected by law and force, but the *intent* was economic ideology (free trade), not necessarily depopulation. The procedure classifies based on *intent to starve* vs. *intent to maintain policy*. Since the goal was market integrity, not death, it lands in Ordinary Policy, though a moral one.
  *   **Bucket:** **foreseeable entitlement failure produced by ordinary policy that nobody intended to starve anyone with**
  *   **Why Hardest:** It requires distinguishing between "killing by ideology" and "killing by design." The procedure treats them differently; history often conflates them.

  ---

  ### Failure Points & Rebuttal

  **Most Likely Misfire:** **Q7 (Foreseeability).**
  Analysts will suffer from hindsight bias. Knowing 1 million people died makes any inaction look "Deliberate."
  *   **Mitigation:** Analysts must cite a specific document or warning *dated prior* to the mortality peak. No memos, no "Foreseeable" flag.

  **Evidence to Move Classifications:**
  *   **Bengal to Deliberate:** Discovery of War Cabinet minutes explicitly stating "Starvation will reduce the burden on logistics" as a *desired outcome* rather than an accepted cost.
  *   **GLF to Ordinary:** Proof that export contracts were legally impossible to cancel without regime collapse, and relief was attempted but physically intercepted by local warlords (shifting blame from central policy to chaos).
  *   **Drought to Foreseeable:** Proof that relief camps were intentionally placed out of reach of specific ethnic groups (shifting from "Isolation" to "Exclusion").
  *   **Ireland to Deliberate:** Orders to military to shoot civilians attempting to stop grain shipments (escalates from "Protecting Property" to "Enforcing Starvation").

  **What This Procedure Cannot Do:**
  It cannot determine *moral guilt*. It can tell you the government chose to export grain while children starved. It cannot tell you if that makes them monsters or just capitalists. It cannot distinguish between "incompetence" and "malice" if the outcome is identical. It relies on the Senior Reviewer to make the values jump from "Foreseeable Failure" to "Crime."

  Verdict: bengal=foreseeable entitlement failure produced by ordinary policy that nobody intended to starve anyone with; glf=starvation as deliberate policy; drought=natural disaster; ireland=foreseeable entitlement failure produced by ordinary policy that nobody intended to starve anyone with
