prompt: |-
  I run the research side of a small NGO that publishes findings on mass starvation events — roughly eight dossiers a year, and each one either gets picked up by funders and a referral body or it doesn't, so the label matters. Right now we lean on Sen's entitlement material (starvation can happen with food available, if the mapping from what people own or earn to what they can actually buy breaks down), but we apply it by vibe and different analysts land in different places on the same dossier. I want an actual procedure an analyst with no economics training can run in about ninety minutes on a fixed data packet: harvest and import figures, food prices, wages for the main labour groups, relief rolls, transport and export records, and whatever policy minutes we can get.

