answer: |-
  Dear colleague, here is my recommendation: stop trying to teach character directly and spend the term teaching them how to govern themselves. You need to abandon the debate about whether goodness is internal or external and instead treat morality as a set of social technologies that a community builds to survive its own friction. For the next twelve sessions, do not introduce a single virtue, rule, or script yourself. Instead, tell the students that the adult supervision model is being retired for this term and that they are now responsible for the quality of life in the room. Your job is not to judge them but to facilitate their creation of a constitution that they must write, vote on, practice, and enforce against each other without your intervention unless safety is at risk. This is not a compromise between your colleagues because it does not rely on innate goodness nor does it rely on adult imposition; it relies on the human need for social order and the specific developmental drive of twelve-year-olds to gain status and autonomy. If you make them the architects of the rules, the compliance becomes ownership, and if you make them the enforcers, the cruelty becomes a problem they have to solve rather than a game they play against you.

  To answer your philosophical question, neither colleague is entirely right about what kids are like, and the tension you feel is real because human morality is not a substance inside us nor a coat put on us, but a skill developed between us. The reason your colleague cannot answer where the first authority's wish to install goodness came from is that she is looking for an individual origin where there is only a collective one. The first authority did not wake up one day and decide to be good; rather, early humans realized that groups who restrained their immediate impulses survived longer than groups who did not. The wish to install goodness came from vulnerability and interdependence, not from a pre-existing moral saint. Seven graders are at the exact age where they discover this tension viscerally; they want total freedom but are terrified of social chaos. When you gave them freedom without structure, they became crueler because they lacked the tools to manage status. When you gave them structure without ownership, they became sneaky because they were managing you instead of managing each other. The goal of these twelve sessions is to let them feel the weight of that interdependence so the rules stop feeling like obstacles and start feeling like infrastructure.

  For the first four sessions, your only material is a whiteboard and a commitment to silence. Tell them the room is theirs and ask them to list every way people make each other feel small or unsafe in this school, but do not let them propose solutions yet. You will likely hear complaints about gossip, exclusion, and performative apologies, and you must validate these without fixing them. Once the list is exhaustive, move to the next phase where they must draft three to five non-negotiable norms that address these pains, but with the catch that every norm must include a specific consequence for breaking it that does not involve adult punishment. This is where the work gets real, because they will initially suggest harsh penalties or vague promises, and you will need to guide them toward consequences that restore the community rather than just punish the offender, such as losing a privilege within the group or having to perform a service for the person they harmed. They will argue, they will posture, and some will try to game the system, but you must hold the line that until they agree on how to handle the bad behavior, they do not get to enjoy the freedom of the room.

  During the middle four sessions, you shift from legislation to rehearsal. Take the scenarios they identified in the first week and have them role-play the violations and the repairs using the consequences they designed, but rotate the roles so the aggressors have to play the victims and the enforcers have to play the accused. This addresses your colleague's concern about practice without falling into the trap of empty scripts, because the script is theirs and the stakes are social rather than academic. If a student performs an apology poorly, do not correct them yourself; ask the group if the repair met the standard they set in their constitution. This forces them to look at each other for validation rather than looking at you for approval, which breaks the performative loop you saw last year. You are building muscle memory for conflict resolution, but the resistance they feel during this practice is useful because it highlights how hard it is to be decent when you are angry, which is the exact moment decency matters.

  For the final four sessions, you step back almost entirely and let them run the period while you sit in the corner and take notes. Ask them to review cases from the week where their norms were tested and have them adjudicate whether the community upheld its values. There will be moments where they let a friend slide or where they are too harsh, and you should only intervene to ask questions about consistency rather than to deliver verdicts. If they fail to enforce their own rules, let the room become uncomfortable; let them feel the decay of the environment they built when they lack the courage to maintain it. This discomfort is the curriculum. It teaches them that freedom without responsibility is just anarchy, and that rules without ownership are just tyranny. By the end of the term, you may not see perfect behavior, but you will see them recognizing the machinery of their own interactions, which is the only foundation durable enough to last beyond your supervision.

  You asked if there is a way to tell which picture of kids is right, and the answer is that you will only know by watching what they do when the power is handed over. If they are inherently selfish, they will dismantle the system for personal gain. If they are inherently good, they will maintain it effortlessly. What will actually happen is somewhere more interesting, which is that they will struggle to maintain it because being good is hard work that requires constant negotiation. That struggle is where character is actually built. Your colleague who wants to remove obstacles is right that shame kills growth, but wrong that removing obstacles is enough. Your colleague who wants to install habits is right that practice matters, but wrong that adults should be the installers. By making them the builders and the maintainers of their own social world, you bypass the war in the staff room and give them the one thing neither side is offering, which is dignity. Good luck with the term, and trust that if you can resist the urge to save them from their own mistakes, they might just surprise you with what they build.
