prompt: |-
  A chapter in a trade-press book I'm reading on the history of tolerance devotes several pages to Montaigne's essay "Of Cannibals." Its account runs as follows: "Montaigne is the founder of cultural relativism. Persuaded by his reading and his conversations that every people measures the world by its own habits, he concludes that 'barbarian' has no content beyond 'not us.' He therefore declines to judge the Tupinambá: their cannibalism is for them no more objectionable than our own dietary prohibitions, and there is no common standard by which one practice could be ranked against another. He goes further and inverts the verdict, casting them as uncorrupted children of nature whose society is morally superior to ours — the first noble savage. But this strands him. If no standard exists outside a culture, Montaigne cannot make the criticism that occupies most of the essay, namely that Europeans who torture the living and massacre whole villages are worse than the people they call savages. His relativism is thus self-undermining, and the essay survives as travel writing rather than as moral thought."

  I have only skimmed the essay, and what I do recall is a remark to the effect that we may call these people barbarous with respect to the rules of reason, though not with respect to ourselves, who exceed them in every kind of barbarity — which sounds like a ranking rather than a shrug. Is the book's account fair? Please go through it claim by claim and tell me what a Montaigne scholar would accept, what is a defensible popular simplification, and what the essay itself contradicts. In particular: does the sentence I half-remember carry the force the book's argument needs, and does the charge of self-undermining survive once the summary is corrected?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Source Material:** A specific paragraph from a trade-press book on the history of tolerance regarding Montaigne's essay "Of Cannibals."
      *   **User's Knowledge:** Has skimmed the essay, recalls a specific quote about "barbarous with respect to the rules of reason."
      *   **Task:** Evaluate the book's account claim-by-claim. Distinguish between what a scholar would accept, what is a simplification, and what the essay contradicts.
      *   **Specific Questions:** Does the recalled sentence carry the force needed to counter the book's argument? Does the charge of self-undermining relativism survive correction?

  2.  **Deconstruct the Book's Account (Claim-by-Claim Analysis):**
      *   *Claim 1: "Montaigne is the founder of cultural relativism."*
          *   Scholarly view: Anachronistic. "Cultural relativism" is a 20th-century anthropological term (Boas, etc.). Montaigne is a skeptic (Pyrrhonist), not a modern relativist.
      *   *Claim 2: "Persuaded... that every people measures the world by its own habits... 'barbarian' has no content beyond 'not us.'"*
          *   Scholarly view: Partially true. Montaigne does argue this in the opening. He defines barbarism as that which is not in our practice.
      *   *Claim 3: "He therefore declines to judge the Tupinambá... no common standard..."*
          *   Scholarly view: False/Exaggerated. He *does* judge them, often favorably. He compares specific practices.
      *   *Claim 4: "He goes further and inverts the verdict... first noble savage."*
          *   Scholarly view: Simplification. The "Noble Savage" trope is usually associated with Rousseau (18th century). Montaigne is more nuanced; he admires their virtue but acknowledges their violence.
      *   *Claim 5: "But this strands him. If no standard exists outside a culture, Montaigne cannot make the criticism... Europeans... are worse..."*
          *   Scholarly view: This is the core philosophical critique. It assumes Montaigne is a *strict* relativist. If he were, yes, he couldn't judge. But is he?
      *   *Claim 6: "His relativism is thus self-undermining, and the essay survives as travel writing rather than as moral thought."*
          *   Scholarly view: Highly contentious. Most scholars view "Of Cannibals" as profound moral thought precisely *because* it uses the "other" to critique the "self."

  3.  **Analyze the User's Recalled Quote:**
      *   *Quote:* "we may call these people barbarous with respect to the rules of reason, though not with respect to ourselves, who exceed them in every kind of barbarity."
      *   *Context:* This is near the end of the essay.
      *   *Significance:* It introduces a universal standard ("rules of reason" / "nature") distinct from cultural custom. This directly contradicts the book's claim that there is "no common standard."

  4.  **Synthesize Scholarly Consensus on Montaigne's "Of Cannibals":**
      *   **Skepticism vs. Relativism:** Montaigne is a Pyrrhonian skeptic. He suspends judgment to clear the mind of prejudice, *not* to say all truth is equal. He uses skepticism to arrive at moral truths (Natural Law).
      *   **Nature vs. Custom:** The central dichotomy isn't Culture A vs. Culture B. It's Nature/Reason vs. Artificial Custom. The Tupinambá are closer to Nature; Europeans are corrupted by Art/Custom.
      *   **The Purpose:** It's not ethnography (travel writing); it's moral philosophy using ethnography as a mirror for Europe.
      *   **The "Noble Savage":** Montaigne predates the term, but the concept is there, though less romanticized than later versions. He admits they kill and eat people, but argues their *motives* and *context* are less barbaric than European religious wars.

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the question. State clearly that the book's account is a caricature common in introductory texts but rejected by specialists.
      *   *Claim 1 (Founder of Relativism):* Mark as anachronistic. Montaigne is a skeptic, not a relativist. Relativism says "no truth." Skepticism says "suspend judgment to find truth."
      *   *Claim 2 (Barbarian = Not Us):* Accurate to the opening, but misses the development. He starts with linguistic relativism but moves to moral universalism.
      *   *Claim 3 (Declines to Judge/No Common Standard):* Contradicted by the text. He judges them *better* in many ways. The "rules of reason" quote is the smoking gun here.
      *   *Claim 4 (Noble Savage):* Defensible simplification but historically imprecise. He does idealize them to critique Europe, but acknowledges their violence.
      *   *Claim 5 & 6 (Self-Undermining/Travel Writing):* This is the weakest part of the book's argument. It fails because it misidentifies Montaigne's standard. His standard isn't "Tupi culture vs. French culture." It's "Nature vs. Corruption." Therefore, he *can* judge Europeans as worse without contradicting himself.
      *   *Addressing the User's Quote:* Confirm the quote (it's accurate). Explain how it introduces "Natural Law" or "Reason" as the transcendent standard. This defeats the "self-undermining" charge.
      *   *Conclusion:* The essay is moral thought, not just travel writing. The book's author likely hasn't read past the first few pages or is forcing Montaigne into a modern sociological box.

  6.  **Refining the Tone:**
      *   Ensure the tone is respectful to the user but firm against the trade-press book's inaccuracies.
      *   Use specific references to the essay's structure (opening definition, middle description, concluding comparison).
      *   Clarify the distinction between *descriptive* relativism (people believe different things) and *normative* relativism (no objective right/wrong). Montaigne accepts the former to challenge the latter.

  7.  **Final Review against constraints:**
      *   Did I go claim by claim? Yes.
      *   Did I address scholar vs. simplification vs. contradiction? Yes.
      *   Did I address the specific quote? Yes.
      *   Did I answer the "self-undermining" question? Yes.

      *(Self-Correction during drafting)*: I need to make sure I don't overstate Montaigne's universalism. He isn't a Kantian. His "reason" is tied to "nature." I should emphasize the Nature/Artifice distinction as the key to resolving the alleged contradiction.

