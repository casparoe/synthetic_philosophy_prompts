answer: |-
  The account you are reading is a classic example of a "textbook caricature." It is coherent enough for a quick lecture on the history of anthropology, but it would be rejected by almost any specialist in Renaissance humanism or Montaigne studies. The author of that trade-press book has conflated Montaigne's *methodological skepticism* with *moral relativism*, and in doing so, misses the essay's actual philosophical architecture.

  Here is a claim-by-claim breakdown of the book's account, distinguishing between scholarly consensus, defensible simplification, and textual contradiction.

  ### 1. Claim: "Montaigne is the founder of cultural relativism."
  *   **Verdict:** **Anachronistic / Incorrect.**
  *   **Scholarly View:** "Cultural relativism" is a concept from 20th-century anthropology (associated with Franz Boas). Applying it to a 16th-century Pyrrhonian skeptic is a category error. Montaigne does argue that custom shapes perception (descriptive relativism), but he does not argue that all moral truths are equally valid (normative relativism).
  *   **Nuance:** Montaigne uses the *appearance* of relativism as a tool to strip away European prejudice, not as an end goal. He is a moral universalist who believes in Natural Law, but he believes our access to it is clouded by habit.

  ### 2. Claim: "Persuaded... that every people measures the world by its own habits, he concludes that 'barbarian' has no content beyond 'not us.'"
  *   **Verdict:** **Defensible Simplification (of the opening only).**
  *   **Scholarly View:** This accurately summarizes the first two pages of the essay. Montaigne famously writes, "each man calls barbarism whatever is not his own practice."
  *   **Contradiction:** The book implies this is Montaigne's *final* conclusion. It is actually his *premise*. He establishes this definition to dismantle it. He does not stop at "barbarian is just 'not us'"; he proceeds to argue that there is a sense in which they *are* barbarous, and a sense in which *we* are more barbarous.

  ### 3. Claim: "He therefore declines to judge the Tupinambá... there is no common standard by which one practice could be ranked against another."
  *   **Verdict:** **Contradicted by the Text.**
  *   **Scholarly View:** Montaigne judges the Tupinambá constantly. He praises their valor, their lack of avarice, their poetry, and their political structure. He does not decline to judge; he declines to judge *by European custom*.
  *   **The Common Standard:** The book claims there is "no common standard." This is the fatal flaw in the book's argument. Montaigne explicitly posits a common standard: **Nature** (or Reason).
  *   **Your Recalled Quote:** The sentence you remember is the key. It appears near the conclusion:
      > *"I am not sorry that we notice the barbarous horror of such acts, but I am heartily sorry that, judging their faults rightly, we should be so blind to our own."*
      >
      > And more crucially:
      > *"Everyone gives the title of barbarism to everything that is not in use in his own country... [but] we may call these people barbarous in respect to the rules of reason, but not in respect to ourselves, who surpass them in every kind of barbarity."*
  *   **Analysis:** By invoking "the rules of reason," Montaigne steps outside cultural relativism. He is arguing that there is a universal metric (Reason/Nature) against which both Tupinambá and Frenchmen can be measured.

  ### 4. Claim: "He goes further and inverts the verdict... the first noble savage."
  *   **Verdict:** **Defensible Simplification.**
  *   **Scholarly View:** It is true that Montaigne idealizes the Tupinambá to critique Europe. Whether he is the "first" noble savage is debatable (there are precedents in classical literature), but he is certainly the most famous early modern progenitor of the trope.
  *   **Nuance:** Montaigne's version is less romantic than Rousseau's later version. He admits the Tupinambá kill and eat prisoners. He doesn't say they are perfect; he says their vices are "natural" and understandable, whereas European vices (betrayal, torture, religious massacre) are artificial and corrupt.

  ### 5. Claim: "But this strands him. If no standard exists outside a culture, Montaigne cannot make the criticism... His relativism is thus self-undermining."
  *   **Verdict:** **Incorrect (The Straw Man Argument).**
  *   **Scholarly View:** This charge of self-undermining only works if you accept the book's premise that Montaigne is a strict relativist. Since Montaigne is *not* a strict relativist (see point 3), he is not stranded.
  *   **The Resolution:** Montaigne's logic is not: *Culture A = Culture B.*
      It is: *Nature > Custom.*
      The Tupinambá are closer to Nature; Europeans are corrupted by Custom. Therefore, Europeans can be judged as "worse" relative to the universal standard of Nature/Reason, without contradicting the observation that "barbarian" is usually just a word for "foreigner."
  *   **Does your quote save him?** Yes. The quote you recall carries the exact force needed to defeat the book's argument. By appealing to "the rules of reason," Montaigne provides the transcendent standard the book claims he lacks. He is not comparing Tupi custom to French custom; he is comparing both to Reason.

  ### 6. Claim: "The essay survives as travel writing rather than as moral thought."
  *   **Verdict:** **Contradicted by Scholarship.**
  *   **Scholarly View:** This is the most egregious error in the passage. "Of Cannibals" is widely regarded as a foundational text of modern moral philosophy and political theory, not ethnography.
  *   **Context:** Montaigne likely never met a Tupinambá (he spoke to a servant who had been to Brazil and perhaps one indigenous man brought to Rouen). The "travel writing" is a vehicle for the "moral thought." The essay is not *about* the Tupinambá; it is about the French Wars of Religion. The cannibals are a mirror. To say it is merely travel writing is to miss the point entirely.

  ### Summary: Does the charge of self-undermining survive?

  **No.** The charge of self-undermining collapses once you correct the summary.

  The book's author constructs a Montaigne who says: *"All truth is cultural; therefore, we cannot judge the Tupinambá."*
  The real Montaigne says: *"Most truth is obscured by culture; therefore, we must look to Nature/Reason to judge both the Tupinambá and ourselves."*

  When Montaigne writes that Europeans are worse, he is not violating a relativist code; he is appealing to a higher law. He argues that eating a dead enemy (Tupi practice) is less barbaric than torturing a living one (European practice) *according to the universal laws of cruelty and pain*, not just according to local taste.

  **Recommendation:**
  The book you are reading is using Montaigne as a placeholder for "early relativism" to set up a later point about tolerance. While pedagogically convenient, it is historically and philosophically inaccurate. A Montaigne scholar would tell you that the essay is a coherent work of moral skepticism that uses the "other" to reveal the corruption of the "self," grounded in a belief in Natural Law, not a denial of universal standards. Your recollection of the text is more accurate than the book's summary.
