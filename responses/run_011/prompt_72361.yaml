          3.  Address the "Just as strongly" issue (Qualitative vs. Quantitative).
          4.  Address the "Classical Logic" claim (False dichotomy).
          5.  Explain Hempel's actual position (Biting the bullet + Psychological explanation).
          6.  Mention alternative solutions (Bayesian, etc.) to show logic doesn't need to be scrapped.

      *   *Key Distinction:* Hempel's project was *qualitative* (does E confirm H?), not *quantitative* (how much?). The summary conflates these.
      *   *Key Correction:* Hempel didn't reject Nicod's criterion entirely; he refined it. But the main point is he accepted the confirmation of the apple.
      *   *Key Correction on Logic:* The summary claims the only way out is rejecting logical equivalence. This is wrong. Quine, Goodman, Bayesians all keep classical logic.

  5.  **Refining the "Hempel's Solution" part:**
      *   Hempel's 1945 paper "Studies in the Logic of Confirmation".
