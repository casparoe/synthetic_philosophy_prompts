answer: |-
  The engine brake sang through the hollow of the cab, a rhythmic coughing that Delia had known for nineteen years. Outside, the Ohio darkness was absolute, broken only by the reflective markers stitching the shoulder of I-70. In the passenger seat, Sam slept with his mouth open, a textbook sliding slowly off his knee. Delia kept her eyes on the white line, feeling the familiar vibration of the diesel through the soles of her boots.

  On the dash, next to the duty log, lay the spiral notebook. It was black, cheap, and filled with entries in her block handwriting. She waited until the exit sign for the rest area glowed green before waking him. They needed coffee, and they needed to stretch, but mostly they needed the light.

  Sam rubbed his eyes, grabbing the book before she could stop him. He knew what was inside. He had known since he was sixteen, when she first tried to explain why she drove westbound with such specific intent. He flipped to the last page. There was a single line of arithmetic written in blue ink: *2.5M ly / c = t + v*. Below it, the date: *October 14*. The direction: *West*. The status: *Settled*.

  "Mom would have hated this," Sam said, handing it back. He didn't mean the notebook. He meant April, the hospital, the way the air had stopped moving in the house. Delia took the book and placed it back on the dash, aligning it perfectly with the log.

  "She's not here to hate it," Delia said. "And you know why I write it."

  "I know the theory, Aunt Delia. I know the trick."

  "It's not a trick."

  They parked under the sodium lamps. The light was orange and flat, washing out the color of the truck's paint. Delia popped the hood to let the engine cool, though she knew it wasn't necessary. It was part of the ritual. She took the notebook and a pen. Sam stood by the bumper, kicking at a patch of gravel.

  "Let's do it," Delia said. "Properly."

  Sam sighed, but he smiled. He was a good boy, too smart for his own good, which was why his father was worried about him dropping out. He understood the mechanism better than she did. He knew that because they were moving through space, their definition of "now" was tilted relative to the road. If you moved toward Andromeda, your present slice cut into what a stationary observer would call the future. If you moved away, it dragged behind. At the distance of that galaxy, the shift could be days. Here, walking across the parking lot, it was quadrillionths of a second. It didn't matter. The principle was the thing.

  Delia walked west, toward the interstate on-ramp, shoulders hunched against the wind. Sam walked east, toward the restroom block. They walked slowly, deliberately, counting paces. At ten steps, they stopped. They both opened their notebooks. They wrote the time. They wrote the direction. They wrote what they believed was already fixed in the smudge of light they could never truly see.

  Delia wrote: *The fleet has launched.*
  Sam wrote: *The fleet is waiting.*

  They met back at the truck. The coffee in the thermos had gone cold. Delia poured two cups anyway. They stood by the tire, steam rising from the liquid in the orange light.

  "Well?" Delia asked.

  "We disagree," Sam said. He took a sip and winced at the temperature. "By about ten to the negative fifteen seconds. Depending on our walking speed."

  "So I'm right."

  "So we're different," Sam corrected. He leaned against the fender, looking tired. "But Aunt Delia, you know neither of us can check. There's no signal coming back. Andromeda is too far. The light takes too long. We're writing down ghosts."

  "I'm writing down what's already there."

  Sam shook his head. He wasn't being cruel; he was being precise. "You're treating a way of slicing as a way of being. Just because you can draw a line through the map doesn't mean the terrain is fixed. The 'now' is just a coordinate. It's local. You can't stretch it across the universe and say it's real. It's just math."

  Delia looked at the notebook in her hand. The paper was soft from use. She thought of her mother, lying in the ground in April. She knew the physics. She knew that walking west didn't change the past, and it didn't bring the dead back. She knew the shift was negligible. She knew the objection was sound.

  "It's not math," Delia said. "It's ballast."

  Sam laughed, a short, sharp sound. "Ballast? You think writing this down stabilizes the truck?"

  "I think the truck needs weight to stay on the road in a crosswind," Delia said. "You say the slice is just a choice. I say the choice is the only thing that's mine."

  "It doesn't change what *is*," Sam said. He dismissed the idea with a wave of his hand, as if swatting a fly. He thought the ontology was the only truth that mattered.

  Delia looked at the interstate. The headlights of incoming cars streamed like liquid gold. "You're right about the map," she said. "The map isn't the territory. But you're wrong about the driving."

  Sam frowned. "How?"

  "You say the direction doesn't matter because the event is fixed regardless," Delia said. "But I'm the one steering. If I face west, I'm meeting it. If I face east, I'm running from it. The event might be fixed, Sam, but the approach isn't. You dismiss the approach because you think only the destination counts."

  Sam opened his mouth, then closed it. He looked at the thermos, then at the dark highway. He couldn't argue with that. He knew what it was to drop out, to change direction. He knew the destination wasn't the only thing that mattered.

  "Okay," he said softly. "Okay."

  Delia capped the pen. She didn't feel vindicated, and she didn't feel defeated. The objection stood. The universe was likely not a solid block waiting for her to carve it. The present was likely only ever where her feet were. But the notebook was open on the hood, waiting for the next entry.

  They got back in the cab. The engine turned over with a groan. Delia shifted into gear and merged onto the highway, the truck leaning slightly into the wind. She kept her eyes on the road, westbound, driving into the slice she had chosen. At the next rest stop, she would write in the book again. She would record the date, the direction, and what was already decided. It wouldn't change the world, and it wouldn't fix the grief, but it would keep the truck heavy enough to hold the lane.

  ***

  **Author's Note**

  This story assumes the eternalist reading of special relativity (the Rietdijk-Putnam argument), where relativity of simultaneity implies a fixed four-dimensional spacetime. The nephew's objection costs Delia's practice its ontological weight; she cannot claim the notebook records objective reality, only her coordinate choice. If written under the assumption that the present is strictly local (presentism), the notebook would become pure fiction rather than misguided metaphysics, removing the tension between her knowledge and her ritual. The story does not endorse her view as physically correct, but it records her practice as existentially necessary, validating the human need for orientation over the cold comfort of abstract truth.
