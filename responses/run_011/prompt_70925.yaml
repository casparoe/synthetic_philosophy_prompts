answer: |-
  ### Part I: The Translation

  You are attempting to map a soteriological epistemology (Nyāya) onto a procedural regulatory system (Evidence Law). The translation is possible, but it requires stripping the Nyāya concepts of their metaphysical weight and treating them as rules of admissibility. Here is the cleanest possible mapping.

  **1. The Four Pramāṇas as Rules of Admissibility**

  *   **Pratyakṣa (Perception) $\rightarrow$ Rule 602 (Personal Knowledge) & Direct Evidence.**
      In Nyāya, perception is non-verbal sensory contact followed by determinate cognition. In evidence law, this corresponds to a lay witness testifying to what they saw, heard, or touched.
      *   *The Match:* Both require the knower to be in direct causal contact with the object of knowledge.
      *   *The Friction:* Nyāya accepts perception as valid immediately upon occurrence (unless defeated). Law requires the perception to be verbalized on the stand and subjected to cross-examination. Law adds a layer of articulation that Nyāya considers secondary to the cognition itself.

  *   **Anumāna (Inference) $\rightarrow$ Circumstantial Evidence & Argument.**
      Inference in Nyāya is knowledge derived from a mark (*liṅga*) connected to a major term. In law, this is circumstantial evidence (e.g., fingerprints implying presence).
      *   *The Match:* Both move from a known fact to an unknown fact via a connecting principle.
      *   *The Friction:* In law, inference is the *work of the jury*, not a rule of evidence. There is no "Rule of Inference." You present the facts; the trier of fact infers the conclusion. In Nyāya, inference is a distinct source of knowledge with its own validity conditions.

  *   **Śabda (Verbal Testimony) $\rightarrow$ Hearsay Exceptions & Expert Testimony.**
      This is your strongest intuitive link. *Śabda* is knowledge derived from the statement of a reliable person (*āpta*).
      *   *The Hearsay Analogue:* Hearsay is generally excluded *śabda* because the original speaker is not present to be verified. The exceptions (excited utterance, business records) are conditions under which the law deems the *śabda* reliable enough to admit.
      *   *The Expert Analogue:* An expert witness is a localized *āpta*. They are allowed to offer opinion testimony (Rule 702) because their specialized knowledge grants them authority that a layperson lacks.
      *   *Admissibility:* For the Naiyāyika, *śabda* is valid *unless* you have a specific reason to doubt the speaker. For you, hearsay is invalid *unless* you have a specific rule to admit it. The default settings are inverted.

  *   **Upamāna (Comparison) $\rightarrow$ Demonstrative Evidence & Lay Opinion.**
      *Upamāna* is knowing the relation between a word and an object via resemblance (e.g., learning what a "gavaya" is by being told it is like a cow).
      *   *The Match:* This maps loosely to demonstrative evidence (charts, models) or lay opinion on resemblance ("He looked like he was intoxicated").
      *   *The Friction:* Law treats comparison as illustrative or argumentative, not as an independent *source* of a finding. You cannot convict a defendant solely because he "resembles" the perpetrator; you need positive identification (Perception) or DNA (Scientific/Expert).

  **2. The Five-Step Inference (Parārthānumāna) vs. Courtroom Habits**

  The Nyāya five steps are: Proposition (*pratijñā*), Reason (*hetu*), Example (*udāharaṇa*), Application (*upanaya*), Conclusion (*nigamana*).

  *   **Thesis $\rightarrow$ Theory of the Case.** This matches your opening statement or the claim in a motion.
  *   **Reason $\rightarrow$ Admissible Evidence.** The specific fact offered to support the claim.
  *   **Example $\rightarrow$ Precedent or Common Knowledge.** This is where the match strains. In Nyāya, the example establishes the universal rule (e.g., "Where there is smoke, there is fire, *as in a kitchen*"). In law, you cite prior cases to show legal rules, but for factual inference, you rely on the jury's common sense. You rarely introduce a specific "example case" to prove a factual generalization.
  *   **Application $\rightarrow$ Closing Argument.** This is where you argue that the evidence fits the rule.
  *   **Conclusion $\rightarrow$ Verdict.**

  *   **Where the match is superficial:** The Nyāya form is a *logic of discovery and validation*. It is meant to generate knowledge. The courtroom form is a *rhetoric of persuasion*. You are not required to state your conclusion in opening; you are required to hide it until deliberation. The Nyāya form is public and linear; the trial is fragmented (witness by witness) and reconstructed only at the end.

  **3. Vyāpti (Invariable Pervasion) vs. Relevance**

  *Vyāpti* is the necessary, invariable connection between the reason (smoke) and the inferred property (fire). It must be established through observation of agreement in presence and absence.

  *   **Does Law have this?** No. Law has **Relevance (Rule 401)**, which requires only that evidence have a *tendency* to make a fact more or less probable.
  *   **The Difference:** *Vyāpti* demands certainty (or near-certainty) of connection. Relevance demands only a probabilistic link. Law assumes generalizations (e.g., "people flee when guilty") without requiring you to prove the invariable pervasion of flight and guilt. Law assumes the *vyāpti* exists in the jury's common experience; Nyāya requires the philosopher to prove it holds ontologically.

  ***

  ### Part II: The Residue Report

  Here is where your translation instinct misleads you. You are mapping a system designed to define **Valid Knowledge** onto a system designed to manage **Dispute Resolution**.

  **1. The Status of Upamāna (Comparison)**
  *   **Verdict:** *Upamāna* has no independent expression in evidence law. This is not a gap in your framework; it is a sign that *upamāna* is doing metaphysical work that law does not need.
  *   **Analysis:** In Nyāya, *upamāna* explains how we learn new names/concepts via resemblance. In law, "resemblance" is either a matter of Perception (I see he looks like the shooter) or Inference (He looks like the shooter, therefore it might be him). Law collapses *upamāna* into *pratyakṣa* or *anumāna*.
  *   **Fault:** The Nyāya claim is doing more work than it appears to. It is solving a problem about language acquisition and universals (how do I know this animal is a *gavaya*?), not a problem about proof. Evidence law does not care how you learned the word "gun"; it cares if you can prove this object is a gun. *Upamāna* is epistemology, not evidence.

  **2. The Āpta (Trustworthy Speaker) vs. Witness Credibility**
  *   **Verdict:** The difference is **substantive**, not merely procedural.
  *   **Analysis:** In your framework, trustworthiness is a *procedural output*. A witness is "credible" if they survive cross-examination, impeachment, and corroboration. Even then, the jury may disbelieve them. The law is structurally skeptical.
      In Nyāya, the *āpta* is an *ontological input*. An *āpta* is someone who possesses knowledge and desires to communicate it truthfully. Their testimony is valid *because* they are an *āpta*.
  *   **Fault:** Evidence law is missing a category of "presumptive truth." Law assumes witnesses lie or err until proven otherwise. Nyāya assumes testimony is valid until defeated. However, this is not a failure of law; it is a feature of the adversarial system. Law cannot afford the epistemic luxury of assuming an *āpta* exists because the stakes (liberty, property) require active verification. Nyāya is interested in the transmission of truth; Law is interested in the testing of claims.

  **3. Vyāpti vs. Burden of Persuasion**
  *   **Verdict:** Translates only if you quietly change the meaning of "truth."
  *   **Analysis:** *Vyāpti* requires an invariable connection. If there is one case of smoke without fire, the *vyāpti* is broken. Evidence law operates on "preponderance of the evidence" or "beyond a reasonable doubt." It accepts probabilistic generalizations that would fail the *vyāpti* test.
  *   **Fault:** Nyāya is doing more work than it appears to. It seeks certainty in a world of contingency. Evidence law acknowledges that human affairs rarely yield invariable pervasions. If you tried to enforce *vyāpti* in court, you would convict no one, because human behavior is not invariable.

  **4. The Five-Step Inference vs. Trial Structure**
  *   **Verdict:** Superficial match.
  *   **Analysis:** The five-step inference is a tool for *teaching* or *demonstrating* truth to another person. A trial is not a demonstration of truth; it is a competition between two narratives.
  *   **Fault:** Your framework assumes the goal is to reach a conclusion. The courtroom's goal is to reach a *verdict*. A verdict is a social decision that ends a dispute; it is not necessarily an epistemic conclusion that establishes truth. You can have a just verdict based on false premises (if the rules were followed), or an unjust verdict based on true facts (if evidence was excluded). Nyāya has no concept of "excluded true evidence."

  ### Part III: Candid Judgment on Your Instincts

  You asked me to be plain about where your translation instinct is misleading you.

  **1. You are treating Epistemology as Procedure.**
  You are reading Nyāya as a "law of proof." It is not. It is a "law of thought." When you ask what corresponds to *pramāṇa* in evidence law, you are asking, "What counts as proof?" But Nyāya is asking, "What counts as *knowing*?"
  *   **The Trap:** In law, I can *know* the defendant is guilty (because I saw him do it), but if I am not called as a witness, my knowledge is legally irrelevant. In Nyāya, my perception is valid knowledge regardless of whether I testify. You are conflating *valid cognition* with *admissible evidence*.

  **2. The "Gap" in Upamāna is actually a Gap in Nyāya (from a Legal view).**
  You suspect *upamāna* has no counterpart. You are right. But you wonder if this is a gap in *your* framework. It is not. It is a sign that Nyāya over-categorized. Later Indian schools (like Mīmāṃsā or Buddhism) often argued that *upamāna* is reducible to inference or testimony. Evidence law agrees with the reducers. Comparison is not a source of knowledge; it is a method of processing perception. Your instinct that it feels out of place in a courtroom is correct because it is not an independent evidentiary source.

  **3. The Āpta is a Category Error in Law.**
  You asked if the difference between *āpta* and cross-examination is substantive or procedural. It is **metaphysical**.
  *   Nyāya posits that truth is a substance that can be possessed by a person (*āpta*).
  *   Law posits that truth is a reconstruction that emerges from conflict.
  *   **The Hard Truth:** You cannot import the *āpta* into mock trial. If you argue "This witness should be believed because they are virtuous," you will lose to the opponent who says "Cross-examine them." The law does not recognize virtue as a proxy for accuracy. It recognizes procedure as the only proxy for accuracy.

  **4. Vyāpti is Dangerous for a Litigator.**
  If you try to use *vyāpti* in a closing argument ("There is an invariable connection between motive and action"), a judge may sustain an objection for overstatement. Law deals in probabilities; Nyāya deals in universals. If you train yourself to look for invariable pervasions, you will become a weaker advocate because you will hesitate to argue probabilistic cases. You will look for certainty where the law only offers likelihood.

  ### Summary of the Breakdown

  | Concept | Translation | Residue / Breakdown |
  | :--- | :--- | :--- |
  | **Pratyakṣa** | Direct Evidence | Law requires verbalization; Nyāya does not. |
  | **Anumāna** | Circumstantial Evidence | Law accepts probability; Nyāya requires invariable connection. |
  | **Upamāna** | Demonstrative Evidence | **No independent counterpart.** Law reduces it to inference/perception. |
  | **Śabda** | Hearsay/Expert Testimony | **Inverted Defaults.** Nyāya admits unless doubted; Law excludes unless admitted. |
  | **Āpta** | Credible Witness | **Substantive Mismatch.** Law trusts process; Nyāya trusts person. |
  | **Vyāpti** | Relevance/Logic | **False Equivalence.** Law assumes generalizations; Nyāya proves them. |
  | **Goal** | Finding of Fact | **Fundamental Divergence.** Law seeks Resolution; Nyāya seeks Truth. |

  **Final Judgment:** Your instinct to translate is a powerful heuristic for understanding both systems, but it becomes actively misleading if you assume the systems are trying to do the same thing. Evidence law is a set of traffic rules for a contest; Nyāya is a map of the terrain. You are trying to use a map to win a race. The map is more "true," but the rules of the race determine who wins. Do not let your study of Nyāya make you resent the constraints of Evidence Law; the constraints exist because the law serves social peace, not epistemic purity.
