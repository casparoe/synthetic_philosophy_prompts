answer: |-
  (a) **Question**

  **Jurisprudence – Final Paper**
  **Time Allowed:** 60 Minutes
  **Total Marks:** 25

  **Question 1**

  **The Jurisdiction of Varene**
  Varene has no written constitution. For forty years, its courts have treated as law whatever the Minister of Justice announces in a numbered circular published weekly in the Gazette; a later circular displaces an earlier statute of the legislature.
  (i) The Gazette is available to anyone on payment of a modest fee, and circulars are drafted in precise, unambiguous language.
  (ii) No circular has ever been repealed, and conflicts between subsisting circulars are constant, but courts resolve them by applying the most recent, and where two issue the same day, the lower-numbered.
  (iii) No court has ever declined to apply a circular or treated one as invalid, and officials uniformly describe the practice as the law of Varene.
  (iv) Some circulars are general in form, while others name individuals and direct the outcome of a particular pending case.
  (v) Some circulars declare themselves applicable to conduct predating publication, and occasionally one imposes a duty that cannot be performed within the week it runs.
  (vi) Courts decide exactly what the circulars direct, without deviation, favour, or quiet evasion.

  (a) Analyze the legal status of the circulars in Varene. In doing so, you must explain why Hart would likely validate this system while Fuller might not, despite the perfect congruence between official action and declared rule. Discuss whether Fuller's desiderata function as an indivisible package or whether some carry more weight than others, and what this implies about whether Hart and Fuller were addressing the same conceptual question. (20 Marks)

  (b) Given your analysis in (a), explain why the post-war informer cases might constitute an imperfect battleground for this debate compared to the Varene scenario. (5 Marks)

  ***

  (b) **Model Answer**

  For Hart, the Varene regime constitutes a valid legal system. Hart's concept of law relies on the union of primary and secondary rules, anchored by a rule of recognition accepted by officials from an internal point of view. In Varene, fact (iii) confirms that courts and officials uniformly accept circulars as law, and fact (ii) establishes a clear hierarchy for resolving conflicts (recency and numbering). The absence of a written constitution is irrelevant; the rule of recognition is a social practice, not a text. Hart separates law from morals; therefore, the moral defects identified in fact (v)—retroactivity and impossible duties—do not negate legal validity. As long as the system is efficacious and accepted by officials, it is law, however iniquitous. Hart would conclude that Varene has law, simply bad law.

  Fuller's analysis is more complex. Fuller argues law is a purposive enterprise subject to an internal morality consisting of eight desiderata. Varene presents a paradox for Fuller's theory. Fact (vi) establishes perfect congruence between declared rule and official action. In the post-war informer cases, the lack of congruence (courts applying retroactive statutes to punish) was the central objection. In Varene, congruence is maximized. If Fuller rejects Varene as a legal system, he cannot rely on the failure of congruence. He must rely on the failures identified in facts (iv) and (v): lack of generality (ad hominem directives), instability (weekly displacement), retroactivity, and impossibility.

  This forces a determination on whether Fuller's desiderata are severable. If they are severable, Varene might be "partially" legal because it satisfies congruence and publicity. However, Fuller's theory suggests the desiderata hang together as a package because they are all preconditions for law's function: guiding human conduct. A rule that is retroactive, impossible to obey, or directed at a specific individual cannot guide conduct. Therefore, perfect congruence in enforcing such rules (fact vi) does little moral work; it merely ensures efficient tyranny. For Fuller, the failures in generality and possibility undermine the system's claim to be law more fundamentally than the presence of congruence supports it. The desiderata are not equally weighted in terms of contribution to validity; generality and possibility are foundational prerequisites without which congruence is meaningless.

  This divergence reveals that Hart and Fuller were not answering the same question. Hart asks: "What are the necessary social facts for a system to be identified as law?" His answer is source-based. Fuller asks: "What conditions must a system meet to function as law?" His answer is functionalist. Hart validates Varene because the social source exists. Fuller invalidates it because the functional capacity to guide conduct is absent. They talk past each other: Hart defines law by its pedigree, Fuller by its performance.

  Consequently, the focus on the post-war informer cases as the debate's battleground is potentially misleading. Those cases turned on retroactivity and judicial fidelity—issues where Hart could concede the law was valid but morally odious, while Fuller argued it lacked legality. Varene shifts the focus from judicial fidelity to legislative structure. In Varene, the courts are perfectly faithful (satisfying Hart and the congruence desideratum), yet the system remains morally deficient in Fuller's eyes due to the nature of the rules themselves. This demonstrates that Fuller's critique is not merely about judges betraying the law, but about a system failing to be law at all due to structural incapacities. Varene isolates the internal morality of law from the fidelity of enforcement, showing that Fuller's challenge to positivism is deeper than the informer cases suggested: it concerns the very capacity of a command to function as law, regardless of how faithfully it is enforced.

  ***

  (c) **Marking Scheme**

  **Total Marks: 25**
  **Ceiling for purely expository answers:** 15 Marks. (Answers that accurately summarize Hart and Fuller but fail to engage with the specific tension regarding congruence vs. other desiderata, or fail to address the "same question" implication, cannot exceed this threshold.)

  **Must-Hit Moves:**

  1.  **Hart's Rule of Recognition (5 Marks)**
      *   *Requirement:* Identify that Hart validates Varene based on official practice (fact iii) and hierarchy (fact ii), noting that a written constitution is not required.
      *   *Mistake Caught:* Holding that Hart requires a written constitution or that the moral defects (fact v) invalidate the law for Hart.

  2.  **Fuller's Specific Desiderata Failures (5 Marks)**
      *   *Requirement:* Identify specific failures in Varene according to Fuller (generality, constancy, possibility, non-retroactivity) based on facts (iv) and (v).
      *   *Mistake Caught:* Treating Fuller's internal morality as classical natural law (i.e., claiming Fuller rejects Varene solely because it is unjust) or failing to cite specific facts.

  3.  **The Congruence Paradox (5 Marks)**
      *   *Requirement:* Acknowledge that congruence (fact vi) is perfect in Varene, unlike the informer cases, and explain why this makes congruence the least useful tool for Fuller's critique here.
      *   *Mistake Caught:* Arguing Fuller rejects Varene because courts ignore the rules, or ignoring the significance of perfect congruence in the fact pattern.

  4.  **The "Package" vs. Weighting Analysis (5 Marks)**
      *   *Requirement:* Discuss whether Fuller's desiderata are severable. Argue that for Fuller, generality/possibility are preconditions for guidance, making them weightier than congruence in this context.
      *   *Mistake Caught:* Treating the eight desiderata as a checklist where passing one (congruence) compensates for failing others.

  5.  **Divergent Questions & Informer Cases Critique (5 Marks)**
      *   *Requirement:* Conclude that Hart/Fuller ask different questions (source vs. function) and explain why Varene is a better test case than the informer cases (isolates structural flaws from enforcement fidelity).
      *   *Mistake Caught:* Claiming they were answering the same question but got different results, or failing to link the analysis back to part (b) regarding the informer cases.

  **Grade Boundaries:**
  *   **20–25:** Excellent. Hits all moves, integrates facts seamlessly, critical engagement with the "same question" thesis.
  *   **15–19:** Good. Hits most moves, accurate expository understanding, but limited critical synthesis on the "package" or "informer cases" implication.
  *   **10–14:** Pass. Accurate summary of Hart/Fuller generally, but weak application to Varene facts or misses the congruence paradox.
  *   **0–9:** Fail. Fundamental misunderstandings of either theorist or ignores the fact pattern.
