      *   *Underlying Physics:* Navier-Stokes equations (deterministic).
      *   *Chaos Theory:* Sensitive dependence on initial conditions (Lorenz).
      *   *Climate Projections:* Same models, different boundary conditions (forcing), looking at statistics of weather rather than specific states.

  3.  **Evaluate Accounts of Probability:**
      *   *Frequentism:* Requires repeatable trials under identical conditions. We never have identical atmospheric conditions. Strict frequentism struggles here.
      *   *Propensity (Popper):* Requires a physical disposition to produce outcomes. If the system is deterministic, there are no propensities for *specific* weather events, only for the evolution of the state.
      *   *Subjective/Bayesian (Epistemic):* Probability is degree of belief. Fits the "ignorance" narrative. But why is bad calibration a *failure*? Because your beliefs should align with the frequency of outcomes in similar epistemic situations.
