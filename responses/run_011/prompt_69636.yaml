answer: |-
  Here is the committed answer you require.

  The practice of ensemble forecasting and calibration scoring presupposes **Objective Epistemic Probability**. It does not, and strictly cannot, presuppose **Ontic Chance** (or Propensity).

  To be precise: the meteorological service is committed to the view that probability is a measure of the *reliability of the inference* from the model to the world, not a physical property of the atmosphere itself. The '30%' does not live in the clouds; it lives in the relationship between the forecasting system and the truth.

  Here is the breakdown of what this entails, what it permits, and what it forbids.

  ### 1. The Account of Chance: Objective Epistemic Probability
  You asked where the 30% is supposed to live if the atmosphere is in exactly one state. On the account required by this practice, that number represents a **degree of belief constrained by objective constraints**.

  It is *epistemic* because the underlying physics (the Navier-Stokes equations) are treated as deterministic. There is no quantum indeterminacy being modelled in the convection schemes; there is only uncertainty about the initial conditions and the model parameters. Therefore, there is no "ontic chance" of rain. Either the air parcels will rise and condense, or they will not.

  However, it is *objective* rather than subjective. If it were merely subjective (a personal Bayesian degree of belief), calibration scoring would be meaningless; a forecaster could be perfectly calibrated simply by getting lucky, or poorly calibrated due to bad luck, without any reflection on their competence. The practice presupposes that there is a **fact of the matter** about what the probability *ought* to be, given the available data and the model structure. Two scientists with the same ensemble and the same verification history *must* assign the same number.

  Therefore, the calibration scoring does not test whether the atmosphere is chancy. It tests whether the **distribution of ignorance** is stable. It presupposes that the errors in the analysis of the current state are not random noise, but follow a stable statistical structure over time. When a service scores itself on calibration, it is asserting: "In the reference class of situations where our model looks like *this*, the truth falls within the ensemble spread *this* often."

  ### 2. Strict Presuppositions vs. Comfortable Fits
  To maintain intellectual honesty, you must separate what the practice *needs* to function from what it merely *hopes* is true.

  **Strict Presuppositions:**
  *   **Stability of Error Statistics:** The practice strictly presupposes that the statistical properties of the model errors (the "ignorance distribution") are stationary over the verification period. If the climate changes such that the model's structural errors shift fundamentally, the historical calibration scores become invalid guides for future probabilities.
  *   **Representativeness of the Ensemble:** It presupposes that the engineered perturbations adequately span the space of plausible truth. If the perturbations are too narrow, the probabilities will be overconfident; if too broad, underconfident. The "30%" is only meaningful if the ensemble spread is a faithful proxy for the actual uncertainty.

  **Merely Comfortable Fits:**
  *   **Determinism:** The practice fits comfortably with determinism, but it does not strictly require it. If the atmosphere turned out to have significant quantum-scale indeterminacy that amplified to the macro-scale, the ensemble method would still work; the probability would simply become a mix of epistemic and ontic chance.
  *   **Perfect Physics:** The practice does not require the equations to be perfect, only that their imperfections are consistent. A biased model can still be well-calibrated if the bias is constant and accounted for in the post-processing.

  ### 3. The Two-Week Limit vs. The 2100 Projection
  You asked if the practice is consistent with claiming a two-week predictability horizon while publishing projections to 2100. The answer is **yes**, provided one distinguishes between an **Initial Value Problem** and a **Boundary Value Problem**.

  *   **Weather (Two Weeks):** This is an initial value problem. You are trying to predict the specific trajectory of the system through phase space. Because the system is chaotic (positive Lyapunov exponents), errors in the initial state amplify exponentially. The "two-week limit" is the point where the error growth saturates the variance of the system's attractor. At this point, the forecast is no better than climatology.
  *   **Climate (2100):** This is a boundary value problem. You are not predicting the trajectory (the specific weather on 14th July 2095); you are predicting the **statistics of the attractor** (the average temperature, the variance of rainfall) under changed boundary conditions (greenhouse gas forcing).

  Chaos limits the predictability of the *state*, but it does not necessarily limit the predictability of the *statistics of the state*. A chaotic system can have a very stable "climate" (attractor) even if its "weather" (trajectory) is unpredictable. Therefore, the practice is consistent: they are admitting they cannot predict the *path* beyond two weeks, but they claim they can predict the *shape of the cage* the path wanders in for the next century.

  ### 4. What They Would Have to Stop Doing
  Finally, you asked what a weather service would have to stop doing if they took the line that there is **no objective chance without indeterminism** seriously.

  If they adhered to a strict metaphysical view that "probability requires physical indeterminism" (a Propensity or Frequentist view of *ontic* chance), they would have to cease probabilistic forecasting entirely. Specifically:

  1.  **Stop issuing percentages for single events:** They could not say "30% chance of rain tomorrow." In a deterministic world, the chance is either 0 or 1. To speak otherwise would be a category error.
  2.  **Stop calibration scoring:** You cannot calibrate a probability against a frequency if the probability is not a frequency of *something real*. If the probability is merely "ignorance", scoring it against reality conflates the map with the territory. They would have to score only on binary accuracy (did it rain or not?), not on the reliability of the probability number.
  3.  **Stop weighting ensemble members:** They would have to present the ensemble runs as a "set of plausible scenarios" without assigning likelihoods to them. They could say, "Run 4 shows flooding, Run 12 shows drought," but they could not say "Flooding is more likely."

  **The Verdict:**
  The meteorological practice is philosophically robust only if it accepts **Objective Epistemic Probability**. It treats uncertainty as a quantifiable, objective feature of the *modelling relationship*, not the *atmosphere*. If they insist that probability requires ontic indeterminism, they are lying to the public every time they issue a percentage. They must either embrace the epistemic account or abandon the numbers.
