      *   **Constraints:** Under 700 words. Open with a single sentence bottom line. Include sequence/timings, example verdict, misconception map, closing question analysis, and what to cut.
      *   **Tone:** Professional, precise, pedagogical, dense.

  2.  **Deconstruct the Core Pedagogical Problem:**
      *   *The Trap:* Students think satisficing is just "lazy maximization" or "irrationality."
      *   *The Sharp Objection:* Stigler's critique – search costs make satisficing just maximization over a larger set.
      *   *The Counter:* Aspiration levels are endogenous (adjust based on search experience), not fixed ex ante.
      *   *The Fork:* Simon (procedural rationality) vs. H&B (biases/deviations from norm).
      *   *The Example:* Hiring is too noisy (institutional constraints). Needs to be stripped down to pure search/stop.
      *   *The Closing Question:* Needs to distinguish deep understanding from recitation.

  3.  **Drafting - Section by Section:**

      *   **Bottom Line:** Must establish endogenous aspirations *before* introducing search costs, otherwise maximization absorbs satisficing.
      *   **Sequence (80 mins):**
          *   0-10: Setup EUT recap vs. Simon's target (procedural vs. substantive).
          *   10-30: The Example (stripped down).
          *   30-50: The Sharp Objection (Stigler/Search Costs).
          *   50-65: The Counter (Endogenous Aspirations).
          *   65-75: Simon vs. H&B fork.
          *   75-80: Closing Question.
      *   **Example:** Hiring is risky. Better: Apartment hunting (classic) or *Restaurant Selection*. Actually, the prompt asks to defend hiring or nominate better. Hiring is too complex. *Dating/Partner Search* or *Parking Spot*. Let's go with **Parking Spot**. It's immediate, low stakes, pure search/stop. Or stick to Hiring but *radically* strip it. The prompt asks to justify. Let's suggest **Restaurant Selection** during a walk. No institutional furniture. Just walk, see, eat or keep walking.
      *   **Misconception Map:**
          *   "Satisficing = Laziness": Defuse in first 10 mins (it's a model of procedure, not effort).
          *   "Satisficing = Maximization with Costs": Defuse at min 50 (endogenous aspirations).
          *   "Simon = Kahneman": Defuse at min 65 (normative vs. descriptive).
      *   **Closing Question:** The user's draft (costless access + fixed threshold) is good but needs refinement. If access is costless, satisficing is dominated. The key is whether the threshold *moves*.
      *   **Cuts:** Secretary problem (too mathematical), Search theory machinery (too econ), Optimality results (misses the point).

  4.  **Refining and Condensing (Word Count Check):**

      *   *Bottom Line:* Establish endogenous aspirations before search costs, or maximization absorbs satisficing.
      *   *Sequence:*
          1.  (0-15) **Procedural vs. Substantive:** Define rationality as process, not outcome. Flag: Satisficing isn't laziness; it's adapting procedure to capacity.
          2.  (15-35) **The Stripped Example:** Use **Restaurant Selection** while walking. No HR constraints, no references. Just: Walk, see menu, hungry? Eat. Keep walking? Hunger increases (aspiration drops) or fatigue increases (cost rises).
