          4.  (55-70) **The Turn:** Introduce **Endogenous Aspirations**. The threshold isn't fixed; it adjusts based on *found* options, not just costs. This breaks the isomorphism with standard maximization.
          5.  (70-75) **The Fork:** Simon (constructive rationality) vs. H&B (bias from norm). Simon isn't saying we fail tests; he's saying the test is wrong.
          6.  (75-80) **Closing Question.**
      *   *Example Verdict:* Drop Hiring. It carries normative baggage (fairness) that obscures the stopping rule. Use **Restaurant Selection**. It lacks institutional furniture, makes hunger/fatigue visceral proxies for aspiration/cost, and isolates the stop decision.
      *   *Misconception Map:*
          *   "Laziness": Defused at 0-15 (reframing rationality).
          *   "Just Maximization": Defused at 55-70 (endogenous threshold).
          *   "Simon = H&B": Defused at 70-75 (normative upshot).
      *   *Closing Question:* "If an agent faces zero search costs but still stops at the first option meeting a fixed threshold, are they satisficing?"
          *   *Fluent:* "Yes, because they aren't comparing all options." (Wrong/Recitation).
          *   *Good:* "No. Without search costs or capacity limits, a fixed threshold is strictly dominated and irrational even procedurally. Satisficing requires the threshold to be a tool for managing scarcity, not a preference." (Understands the *why*).
