answer: |-
  Establish endogenous aspirations before search costs, or maximization absorbs satisficing.

  **Sequence (80 mins)**
  1.  **(0-15) Procedural vs. Substantive:** Define rationality as process, not outcome. Flag: Satisficing isn't laziness; it's adapting procedure to capacity.
  2.  **(15-35) The Example:** Restaurant selection while walking. Isolate the stop rule.
  3.  **(35-55) The Objection:** Invite the Stigler critique: "Isn't this just maximizing net benefits including search cost?" Let the sharp student win here.
  4.  **(55-70) The Turn:** Introduce **Endogenous Aspirations**. The threshold adjusts based on *found* options, not just costs. This creates path dependence, breaking the isomorphism with standard maximization.
  5.  **(70-75) The Fork:** Simon (constructive rationality) vs. H&B (bias from norm). Simon isn't saying we fail tests; he's saying the test is wrong.
  6.  **(75-80) Closing Question.**

  **Example Verdict**
  Drop Hiring. It carries fairness norms that obscure the stopping rule. Use **Restaurant Selection**. It lacks institutional furniture; hunger/fatigue viscerally proxy aspiration/cost, isolating the stop decision without triggering institutional debate.

  **Misconception Map**
  *   **"Laziness/Irrationality":** Defused at 0-15 by reframing rationality as procedural fit rather than outcome optimality.
  *   **"Just Maximization with Costs":** Defused at 55-70. If the threshold is fixed, Stigler is right. If the threshold shifts based on search experience (endogenous), the model diverges from maximization.
  *   **"Simon = H&B":** Defused at 70-75. H&B treats deviations as errors; Simon treats them as adaptive procedures.

  **Closing Question**
  "If an agent faces zero search costs but stops at the first option meeting a fixed threshold, are they satisficing?"
  *   **Fluent Answer:** "Yes, because they aren't comparing all options." (Recites definition, misses the *why*).
  *   **Good Answer:** "No. Without scarcity or capacity limits, a fixed threshold is procedurally irrational. Satisficing is a tool for managing bounds, not a preference type." (Grasps the dependency on boundedness).

  **Cuts**
  Explicitly state: "We cut the Secretary Problem and optimal search rules. Those assume the omniscience Simon rejects. We are not solving for the optimal stop; we are modeling the actual stop."
