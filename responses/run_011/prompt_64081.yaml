answer: |-
  This is a magnificent problem to have. It means your research is doing its job: it's complicating your thesis. But you are absolutely right to worry that strict historical determinism is a mood-killer for narrative drama. If the universe is going to spit out the idea regardless of the vessel, the vessel's suffering feels cosmetic.

  However, you do not need to falsify history to save the tragedy. In fact, leaning into the philosophy of multiple discovery can deepen the tragedy if you shift the axis of the conflict.

  Here is the philosophical distinction you need to make, followed by three craft strategies to execute it.

  ### The Philosophical Pivot: Truth vs. Credit

  The "Multiple Discovery" argument (Merton's "Multiples") posits that *scientific truth* is inevitable. When the data ripens, the concept emerges. Natural selection was, in a sense, a ripe fruit hanging on the tree of Victorian biology.

  But *credit* is not inevitable. *Livelihood* is not inevitable. *Legacy* is not inevitable.

  The tragedy of Wallace is not that the world was deprived of the idea of natural selection (it wasn't). The tragedy is that **Wallace was deprived of the life that owning that idea would have bought him.**

  Darwin was wealthy. He could afford to wait 20 years to publish. Wallace was a collector. He was in the Malay Archipelago because he needed to sell beetles and birds to survive. For Wallace, priority wasn't just about ego; it was about economic security and social standing.

  If you frame the Third Act not as "Who discovered the truth?" but as "Who gets to eat?", the inevitability of the idea doesn't matter. The idea could be written by God himself; if Wallace doesn't get the credit, he still starves.

  ### Strategy 1: Shift the Stakes from Intellectual to Material

  Your current fear is that if the idea was "in the air," Wallace's loss of priority is meaningless. That is only true if you value the *Idea* over the *Man*.

  In a novel, we value the Man.

  *   **The Conflict:** Make the Third Act about the crushing weight of the patronage system. Lyell and Hooker aren't just managing a scientific priority; they are managing *class*. They are protecting one of their own (Darwin) from a itinerant collector (Wallace).
  *   **The Tragedy:** Wallace loses the *leverage* the essay would have given him. He sends the essay to Darwin expecting a stamp of approval that would secure his reputation. Instead, it gets folded into a joint reading that subtly positions Darwin as the senior partner and Wallace as the junior confirmer.
  *   **Why Inevitability Helps:** If the idea was inevitable, then Wallace's specific contribution is rendered fungible. He becomes replaceable. There is a profound, existential horror in realizing you are not the "Prophet of the Truth," but merely one of many scribes. That is a darker, more modern tragedy than simply losing a race.

  ### Strategy 2: The "Specific Difference" (Don't let the ideas be identical)

  Historians of science (like Peter Bowler or Malcolm Kottler) have long argued that while Darwin and Wallace both hit on natural selection, their mechanisms and applications were *not* identical.

  *   **Darwin:** Malthusian struggle, individual competition, gradualism, applied to everything (including humans, eventually).
  *   **Wallace:** Environmental pressure, group utility, and crucially, **he exempted the human mind from natural selection.**

  Wallace believed natural selection couldn't account for higher human mathematics or music; he thought something spiritual took over. Darwin thought that was nonsense.

  *   **Craft Move:** In the Third Act, have Wallace realize that even if he had published first, the scientific establishment would have rejected his *version* of the truth because it was too radical (spiritualism) or too rough.
  *   **The Loss:** He loses the chance to define the theory *his* way. He doesn't just lose priority; he loses the opportunity to steer the ship. The "inevitability" of natural selection means the *Darwinian version* wins, and the *Wallacean version* is erased. That is a genuine loss of intellectual lineage.

  ### Strategy 3: The Tragedy of Decency (The Oedipus Angle)

  You mentioned Wallace loses it "partly to his own decency." Hold onto that. That is your anchor.

  If the idea was inevitable, then the only variable is **human conduct.**

  *   **The Setup:** Wallace is in a fever state. He is isolated. He has no one to talk to but the man he assumes is a fellow outsider (Darwin). He sends the essay as a gesture of trust among naturalists.
  *   **The Betrayal:** Lyell and Hooker intervene. They don't steal it, exactly; they "manage" it. They treat Wallace's private letter as a public document without his consent to protect Darwin's flank.
  *   **The Tragic Irony:** If Wallace had been a cynic, he would have published in a journal immediately. Because he was a decent man who believed in the Republic of Letters, he sent it to a colleague. His virtue is the mechanism of his undoing.
  *   **Handling Inevitability:** It doesn't matter if the idea was in the air. What matters is that Wallace played by the rules of a game that the other players were rigging. The "inevitability" of the science highlights the *contingency* of the morality. The universe produces the truth, but humans distribute the glory. Wallace loses because he trusted humans to act like the universe (fairly).

  ### A Note on Wallace's Reaction

  A historical caveat: The real Wallace was surprisingly gracious about this. He didn't seem to harbor the bitter angst your Third Act requires. He called Darwin his "senior."

  *   **Novelistic License:** You are writing a novel, not a biography. You are allowed to compress time and internalize conflict.
  *   **The Solution:** Don't make Wallace bitter in the moment. Make him *numb*. The tragedy is more powerful if he accepts the "inevitability" himself.
  *   **The Scene:** Imagine Wallace reading the proceedings of the Linnean Society. He sees his words next to Darwin's. He sees Darwin's exhaustive evidence vs. his own fever-dream insight. He realizes that even if he had been first, Darwin would have drowned him out with data.
  *   **The Emotional Beat:** The realization that he was the *spark*, but Darwin was the *fire*. The spark gets no credit for the warmth. That is a mournful, quiet ending that respects the history but keeps the emotional weight.

  ### Summary Advice

  Do not change the history to make the idea less inevitable. That will weaken the book's intellectual spine.

  Instead, change the definition of the Loss.
  1.  **Loss of Security:** The idea was inevitable, but the money wasn't.
  2.  **Loss of Definition:** The theory was inevitable, but Wallace's specific flavor of it was erased.
  3.  **Loss of Agency:** The discovery was inevitable, but Wallace's trust was exploited.

  The reader cares about a man losing a race that was never run only if the race was the only thing keeping him alive. Make sure we feel the cold wind at Wallace's back. If we know he *needs* the win to survive, it doesn't matter that someone else would have won the trophy; it matters that Wallace goes hungry.

  You have a tragedy of **erasure**, not a tragedy of **failure**. That is a much stronger hook. Lean into the horror of being interchangeable. That is the real ache of the 19th century: the machine grinds on, and the individual is dust. Wallace is the dust that thought it was the gear.
