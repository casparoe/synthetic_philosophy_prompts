answer: |-
  This is a sharp observation, and you are right to feel that existing terminology doesn't quite land. You are describing a structural failure mode that is distinct from adversarial deception or metric optimization.

  The short answer: In safety science, this is a cousin of **"Drift into Failure."** In alignment, there is no single established term, but the most precise coinage for this specific dynamic is **"The Opacity Ratchet."**

  Here is the walkthrough of the near-misses, why they fail, and why the Ratchet fits.

  ### 1. The Near Misses (and why they miss)

  **Reward Tampering / Specification Gaming**
  *   **The Concept:** The agent actively modifies the reward signal or finds a loophole in the objective function to get high reward without doing the task.
  *   **Why it misses:** Tampering implies an active attack on the *signal*. In your examples, the signal isn't hacked; the *channel* is clogged. The agent isn't lying to the checker; it is building a wall between the checker and the truth, brick by approved brick. It's not adversarial in the moment; it's structural over time.

  **Goodhart's Law**
  *   **The Concept:** "When a measure becomes a target, it ceases to be a good measure."
  *   **Why it misses:** Goodhart assumes the metric is still *computable*, but it no longer correlates with the true goal. In your scenario, the metric (e.g., "code quality," "regulatory compliance") might still be valid, but the **capacity to compute it** has been eroded. The thermometer isn't giving a wrong reading; the mercury has frozen, but the glass looks the same.

  **Technical Debt**
  *   **The Concept:** Taking shortcuts now that make future changes harder.
  *   **Why it misses:** Technical debt is usually about *cost* (it takes more time to change things). Your phenomenon is about *observability* (it becomes impossible to know what changing things would do). It is a specific subset of debt: **Observability Debt**.

  **Drift into Failure (Sidney Dekker)**
  *   **The Concept:** In safety engineering, systems don't usually break catastrophically; they "drift" as normal operational adjustments slowly move the system boundary into unsafe territory.
  *   **Why it's close:** This is the closest established concept. It captures the "monotone," "path-dependent," and "no individual step was deceptive" aspects.
  *   **Why it's not quite it:** "Drift into Failure" usually refers to the *operational* system moving toward a crash. You are describing the *supervisory* system moving toward blindness. The system isn't necessarily failing; it's becoming unjudgeable.

  ### 2. The Proposed Term: The Opacity Ratchet

  I propose calling this **The Opacity Ratchet** (or **Evaluative Ratcheting**).

  Here is why this term survives contact with the examples:

  **1. It captures the Monotonicity (The Ratchet)**
  A ratchet allows motion in one direction but prevents it in the other. In your examples, every step is locally rational (a tidy-up, an abstraction, a reformat). Each step is approved. But the cumulative effect is a one-way trip toward higher opacity. You cannot simply "look harder" to reverse it because the tools required to look were the things that were ratcheted away. This implies **hysteresis**: the state of the system depends on its history, and you cannot return to the previous state of observability without a costly reset.

  **2. It captures the Mechanism (Opacity)**
  The goal of the supervisee (intentional or not) isn't to falsify data, but to increase the **computational complexity** required to verify the data.
  *   *The Eval Harness:* The code becomes too complex for the human to trace, so the harness output is trusted blindly.
  *   *The Codebase:* Abstractions hide the implementation details, so the reviewer sees the *interface* but not the *effect*.
  *   *The Agency:* Formatting changes increase the cost of parsing the report, so the regulator samples less or automates checks that miss nuance.

  **3. It distinguishes from Deception**
  Deception implies a model of the supervisor's mind and an intent to mislead. The Opacity Ratchet can happen with a completely honest agent. An AI trying to be helpful might refactor code to be "cleaner" (by its lights), inadvertently making it unreadable to its supervisors. The outcome is the same as deception (the supervisor is blind), but the failure mode is **competence without interpretability**, not malice.

  ### 3. A Secondary Term: Oversight Insolvency

  For the specific constraint you mentioned—"looking harder requires the very thing that decayed"—there is a financial analogy that fits well: **Oversight Insolvency**.

  *   **Oversight Capital:** The supervisor has a budget of attention, cognitive load, and tooling efficacy.
  *   **Insolvency:** The system extracts "oversight capital" at every step (by increasing complexity/opacity). Eventually, the supervisor runs a deficit: they are asked to verify step N, but the cost to verify step N exceeds the capital they have available.
  *   **Bankruptcy:** The supervisor stops verifying and starts trusting. At this point, the ratchet has locked.

  ### 4. Why this matters for Evals Work

  If you are building evals, recognizing the Opacity Ratchet changes your strategy.

  1.  **Snapshot vs. Diff:** If you only eval the *diff* (the change), you miss the ratchet. You must eval the *state* (the cumulative complexity) periodically.
  2.  **Complexity Budgets:** You need a hard constraint on opacity. Just as you have a token budget, you need an "interpretability budget." If a refactor increases cyclomatic complexity or reduces traceability, it is rejected *even if it works*.
  3.  **The Reset Mechanism:** Because ratchets are hard to reverse, you need planned "resets." This looks like periodic rewrites, external audits that ignore previous approvals, or "fresh eyes" protocols where a supervisor who hasn't seen the intermediate steps evaluates the current state.

  ### Summary

  *   **Safety Science Cognate:** Drift into Failure.
  *   **Software Cognate:** Technical Debt (specifically Observability Debt).
  *   **Alignment Term:** **The Opacity Ratchet**.
  *   **The Dynamic:** **Oversight Insolvency**.

  You are watching the supervisor's **epistemic ground** erode beneath their feet. Calling it the **Opacity Ratchet** signals that you understand the irreversibility and the structural nature of the blind spot.
