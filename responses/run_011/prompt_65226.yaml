answer: |-
  You have correctly identified the central anxiety of modern archival research: Trouillot gives you the *diagnosis* (silence is produced), but not the *treatment* (how to interpret a specific silence). Your roommate's statistical framing (Missing at Random vs. Missing Not at Random) is technically correct but historically anemic; it identifies the *pattern* of the gap without explaining the *power* that dug it.

  Your "bootstrapping problem" is real, but it is not fatal. It is simply the definition of historiographical labor. You cannot solve it with a single universal rule, but you can solve it with a **heuristic for argumentation**. You need a principle that forces you to justify *why* a gap should be read as absence rather than silence.

  Here is a principle that accommodates your intuitions in cases (1) through (7), resolves (8), and tests cleanly against the union case.

  ### The Principle of Archival Necessity

  **Statement:** A gap in the record licenses a negative inference (i.e., "X did not happen") *only if* you can demonstrate that the occurrence of X would have generated a record under the standing administrative protocols, **and** that the production of that record would not have been systematically discouraged by the power relations governing the archive.

  This principle has two clauses. You must satisfy both to claim "nothing happened." If you fail either, the gap is a "produced silence" (Trouillot's Moment 1 or 2), and you must argue from the silence itself, not from the absence of data.

  #### Clause 1: Ontological Capacity (The "Could")
  *Did the recording system have a category for this?*
  This addresses the **domain of the record**. If the thing that is missing belongs to a class of objects or people the archive was designed to ignore, the gap is structural, not evidential.
  *   **Motivating Case:** **(5) Fire-Insurance Maps.** The map's ontology is "insurable property." A frame shanty is ontologically excluded from the map's purpose. The gap tells you about the map's definitions, not the block's occupancy.
  *   **Motivating Case:** **(2) Court Depositions.** If the legal system did not recognize women as competent witnesses (or made it prohibitively difficult), they fall outside the ontology of "litigant." The gap is structural exclusion.
  *   **Motivating Case:** **(6) Email Archive.** In a "total capture" system, the ontology is "all official communication." If a decision is missing, it implies the decision was moved *outside* the ontology (off-channel), not that it didn't happen.

  #### Clause 2: Incentive Compatibility (The "Would")
  *Did the recorder benefit from writing this down?*
  This addresses the **political economy of the record**. If recording the event served the recorder's interest, absence suggests non-existence. If recording the event harmed the recorder's interest, absence suggests suppression.
  *   **Motivating Case:** **(1) Monastery Wine.** Recording wine is routine, low-stakes inventory. The cellarer gains no advantage from omitting a specific vendor unless the vendor ceased to exist. The incentive is neutral/accuracy-based. Absence = Non-existence.
  *   **Motivating Case:** **(3) Enslaved Births/Deaths.** Births increase capital value (recorded); deaths decrease it or imply mistreatment (often obscured). The incentive is asymmetrical. You cannot infer "no deaths" from "no death records" because the incentive structure actively discourages recording them.
  *   **Motivating Case:** **(4) Mission Baptisms.** Here, the incentive is to *inflate* numbers. The record shows *low* numbers. This is an **Argument from Contrary Interest**. Because the record contradicts the incentive, the data is credible. (Note: This is the inverse of your negative inference rule; it validates *presence* despite incentive to hide, or *absence* despite incentive to fabricate).
  *   **Motivating Case:** **(7) Purged Official.** Active erasure is a high-cost action. It requires effort to scrape a photo or burn a file. The incentive is to eliminate memory. The *effort* of silencing becomes evidence of the prior existence.

  ---

  ### Application to Case (8): The Orphanage Ledger

  **The Case:** Father's name present in 15% of entries (1901–1930).
  **The Readings:** Unknown vs. Withheld vs. Unasked.

  **Verdict:** Your "can't tell" is **principled humility**, not a cop-out. In fact, it is the only verdict the Principle of Archival Necessity permits.

  **Why:**
  1.  **Ontological Capacity:** The ledger *has* a column for "Father." So, Clause 1 is technically met (the system *could* record it).
  2.  **Incentive Compatibility:** Clause 2 fails completely. We do not know the incentive structure.
      *   If the orphanage needed to collect child support, they had an incentive to record him (and might mark "Unknown" if he fled).
      *   If the orphanage stigmatized illegitimacy, they had an incentive *not* to ask (marking "Unknown" to protect the mother's reputation).
      *   If the mother feared the father would claim the child, she had an incentive to withhold.

  **Can the ledger break the tie?**
  Yes, but not through the gap itself. You must look for **internal correlation patterns**.
  *   *Test:* Does "Father: Unknown" correlate with "Mother: Unmarried"? If yes, the silence is likely social stigma (Incentive: Hide illegitimacy).
  *   *Test:* Does "Father: Unknown" correlate with "Admission Type: Emergency"? If yes, the silence is likely informational (Incentive: None, data just missing).
  *   *Test:* Is there a sudden drop in named fathers after a specific year (e.g., 1915)? If yes, the silence is likely policy-driven (Incentive: Changed intake rules).

  If the ledger shows no internal pattern, the Principle forbids you from choosing one reading. You must report the silence as **indeterminate**.

  ---

  ### The Test Case: 1970s Union Minutes

  **The Case:** Minutes name every disciplined member, except during an eight-month stretch where minutes become thin and generic.
  **The Principle's Verdict:** **Do not infer "no discipline." Infer "changed recording protocol."**

  **Reasoning:**
  1.  **Ontological Capacity:** The standing protocol is to name disciplined members. Clause 1 suggests a gap *should* mean no discipline.
  2.  **Incentive Compatibility:** Unions are political bodies. During periods of internal strife, legal vulnerability, or factional fighting, naming names creates liability or fuels conflict. The incentive shifts from "transparency/accountability" to "self-preservation/unity."
  3.  **Conclusion:** Because the incentive to record names likely turned negative during a controversy (Clause 2 fails), the gap is a **produced silence**. The "thin and generic" nature of the minutes is itself evidence that business was conducted but deliberately obscured.

  **My guess at your verdict:** You likely suspect discipline *did* happen but was kept off the books to avoid legal discovery or internal fracturing. The Principle supports this.

  ---

  ### Critique of Your Verdicts & The Stats Major

  **Which verdicts to keep:**
  *   **Keep (1), (2), (5), (7).** These are the strongest applications of the principle. They clearly distinguish between routine omission, structural exclusion, and active erasure.
  *   **Keep (8) as "Can't Tell."** Historiographical honesty is better than false precision.
  *   **Modify (3) & (4).** You treat these as opposites, but they are the same mechanism (Incentive Compatibility). In (3), the incentive explains the *presence* of births and *absence* of deaths. In (4), the incentive explains why the *low numbers* are credible. Group these under "Political Economy of the Record."
  *   **Modify (6).** Be careful with "Total Capture." No archive is truly total. The inference here isn't that the decision happened "off-channel," but that the archive's *boundary* was drawn to exclude the decision. It's a variation of Case (5).

  **Which verdict to give up:**
  *   You should slightly soften your certainty on **(1)**. Even routine accounts have "off-book" transactions (gifts, favors, credit). The gap is *probabilistic* evidence, not definitive. But compared to the others, it is the safest negative inference.

  **The Stats Major (MAR vs. MNAR):**
  Your roommate is half-right.
  *   **Missing at Random (MAR):** This is Case (1). The gap is noise. You can statistically model around it.
  *   **Missing Not at Random (MNAR):** This is Cases (2), (3), (5), (7). The gap *is* the signal.
  *   **The Red Herring:** The statistical framing assumes the "missingness" is a property of the *data*. Trouillot (and history) teaches us the missingness is a property of the *power*.
  *   **Verdict:** Use his terminology to describe the *pattern*, but use the Principle of Archival Necessity to explain the *cause*. If you tell a historian "this data is MNAR," they will ask "Why?" If you say "Because the archive was produced by a regime that excluded women," you are doing history.

  ### The Bootstrapping Problem

  You wrote: *"I seem to need a complete archive to justify reasoning from an incomplete one."*

  This is the trap. You do not need a *complete* archive; you need a **provenance**.
  You establish the "Necessity Condition" not by finding another ledger that has the missing info, but by understanding the **institutional logic** of the ledger you hold.
  *   How did the cellarer get promoted? (Accuracy).
  *   How did the missionary get funded? (Conversion numbers).
  *   How did the union avoid lawsuits? (Minutes redaction).

  You bootstrap the archive's reliability by reconstructing the incentives of the people who made it. That is not a bug; it is the work of the seminar you are sitting in right now. You are not transcribing data; you are reverse-engineering a bureaucracy.

  **Final Advice:**
  When you write your paper, do not hide the "can't tell" verdicts. Make them the argument. A history that says "We cannot know if the fathers were named because the institution's interest in legitimacy conflicted with its interest in support collection" is a better history than one that guesses "15% of fathers were present." Trouillot would approve. The silence is the story.
