answer: |-
  1. **Short answer**
  No, there is no single established name for this specific configuration. It is the unnoticed substitution of a normative cost-benefit analysis for a descriptive classification inquiry when a label carries mandatory consequences. While components exist in speech act theory and legal realism, the specific mechanism—the silent displacement of the factual question by the consequential one—remains unnamed in the literature you describe.

  2. **One phenomenon or several**
  This is one phenomenon rooted in (d), manifesting through (b) and (c), with (a) serving as a post-hoc rationalization. The core engine is performative: uttering the label is an undertaking (d), which creates institutional risk (c), forcing the argument to shift topics (b).

  Your Rwanda instance is primarily (c) and (d). The institution feared the performative act itself because it triggered a duty they wished to avoid; the factual inquiry was suppressed to prevent the utterance. The Torture instance is primarily (b) and (c). The label was not suppressed but redefined; the dialectic shifted from "did this happen?" to "what counts as suffering?" to avoid the consequence.

  They are instances of the same thing because in both cases the truth conditions of the label became dependent on the cost of the label. The epistemic matter (a) is not the cause; proof standards did not objectively rise, but the *willingness* to accept proof fell. The displacement is uniform: the question "Is this X?" becomes "Do we want to be committed to X?" The variation is merely tactical (silence vs. redefinition), not structural.

  3. **The nearest concepts**
  **Speech Act Theory (Illocutionary Force):** This claims certain utterances perform actions rather than describe states. It captures why the label matters (d). It stops short because it explains the power of the word, not the strategic evasion of using it. It does not account for the *displacement* of the factual debate.

  **Constitutional Avoidance:** A legal doctrine where courts interpret statutes to avoid constitutional questions. It captures the institutional reluctance (c). It stops short because this doctrine is usually explicit and acknowledged as interpretation. Your phenomenon relies on the shift remaining *unnoticed* by the participants.

  **Motivated Reasoning:** A psychological theory where desires shape evidence processing. It captures the bias toward desired outcomes. It stops short because it locates the error in individual cognition. Your pattern is structural and linguistic, occurring even among actors who believe they are being rigorous.

  **Normative Uncertainty:** A philosophical idea that moral stakes affect factual credence. It captures the entanglement of value and fact. It stops short because it suggests an honest cognitive blur. Your instances suggest a functional, often strategic, substitution of questions rather than a genuine confusion.

  **Legal Realism:** The claim that law is determined by judges' policies, not rules. It captures the outcome-driven nature. It stops short because it is a macro-theory of adjudication. It lacks the micro-linguistic precision to describe how the *argument itself* changes shape during the debate.

  4. **Near misses**
  **Plain equivocation:** This is close because meanings shift. However, equivocation usually involves switching between a strict and loose sense openly. Here, the definition remains ostensibly fixed while the *application* is blocked by consequences.

  **Strategic label stretching:** This is the inverse problem. Here, actors dilute a label until it loses force. Your phenomenon is about resisting a label because it retains too much force.

  **Ordinary caution:** Caution involves admitting uncertainty due to high stakes. In your pattern, the uncertainty is manufactured or exaggerated; the actors speak as though the facts are disputed, not the stakes.

  **Dismissal based on incentives:** This attacks the speaker's bias. Your pattern is more insidious: it accepts the speaker but corrupts the *criteria* of the debate itself, masking the incentive as a factual hurdle.

  **Narrow construction:** Lawyers often read text narrowly to avoid hard results. This is the tool used, but not the phenomenon itself. Narrow construction is a recognized technique; your phenomenon is the *unacknowledged motivation* driving that technique during fact-finding.

  5. **A name and a definition**
  I propose the term **"Consequential Displacement."**

  **Definition:** Consequential Displacement occurs when: (1) a classification label triggers a mandatory normative consequence; (2) participants in a classification debate shift their inquiry from the descriptive criteria of the label to the costs of the consequence; and (3) this shift remains unacknowledged, with participants continuing to frame the dispute as factual rather than normative.

  **Edge case:** Consider a regime that admits a label applies but explicitly refuses to act on the duty (open hypocrisy). This falls *outside* the definition. In Consequential Displacement, the actors must maintain the pretense that the label *does not apply* based on facts. If they admit the label but deny the duty, the displacement has failed; the argument has become openly normative, which is not the phenomenon you are tracking.

  6. **Defect or feature**
  This is a feature of deontic language that becomes a defect in transparent governance. Action-forcing labels require weight; if applying them were cost-free, they would not compel action. The displacement is the friction generated by that weight. It makes the label usable as a tool of obligation.

  For the other answer to be right (that it is purely a bug), language would need to be purely descriptive, detached from consequence. But legal language is constitutive; it creates realities. If the displacement vanished, the label would lose its capacity to bind, rendering it rhetorical rather than legal.

  **Missed distinction:** You may be conflating **avoidance** (refusing to apply the label, as in Rwanda) with **redefinition** (changing the label's criteria, as in Torture). The literature often treats these as distinct strategies: non-recognition versus interpretive drift. While both stem from Consequential Displacement, they operate differently—one silences the speech act, the other corrupts the semantic content. Distinguishing them may clarify your drafting.
