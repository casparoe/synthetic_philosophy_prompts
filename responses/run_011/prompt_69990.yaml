answer: |-
  This is a sharp read, but I'm going to push back on the core classification. You are arguing that the VCF was an exercise in **interpersonal utility comparison (IUC)**. I argue it was an exercise in **tort restitution constrained by political survival**, which accidentally created an IUC dataset.

  The distinction matters. If it was IUC, the goal was welfare maximization. If it was tort restitution, the goal was *corrective justice* (making the victim whole relative to their baseline). Feinberg's "compression" wasn't utilitarian calculus; it was riot control.

  Here is the argument, run in the directions you requested.

  ### Direction One: Theory → Fund

  **1. The Lost-Earnings Component: Restitution, Not Utility**
  You ask if the lost-earnings component assumes a dollar of lost earnings means the same welfare loss to a managing director as to a line cook. You suggest this implies constant marginal utility of income (MU), which contradicts standard welfare economics.

  I argue it assumes **nothing about utility**. It assumes a **property right in one's labor capacity**.
  In tort law, if I destroy your car, I pay the market value of the car. I do not pay based on how much utility you derived from the car. If a billionaire's Honda Civic is totaled, he gets the same as a student's. The VCF treated human capital as an asset class. The "welfare loss" is irrelevant to the calculation; the "market value loss" is the metric.

  Therefore, this is not an interpersonal utility comparison. It is an interpersonal *asset valuation*. The tension you see (high MU for the poor, low MU for the rich) exists only if you insist on interpreting a tort settlement as a welfare distribution. The VCF was explicitly *not* a welfare program; it was a liability shield. The "utilitarian language" you mention was marketing, not mechanics.

  **2. The Noneconomic Piece: Deontological Floor, Not Cardinal Pain**
  You ask if the flat noneconomic award ($250k base + dependents) is a refusal to compare or a covert comparison of identical pain.

  It is neither. It is a **deontological constraint**.
  If you treat it as a "refusal to compare," you imply we *could* compare but choose not to. If you treat it as a "covert comparison," you imply we believe a janitor's grief equals a CEO's grief in cardinal units.
  I argue the flat rate is a symbolic assertion that **citizenship has a fixed price in the eyes of the state**, distinct from market value. It creates a dual-currency system:
  *   Currency A (Market): Your labor value (variable).
  *   Currency B (Civic): Your life value (fixed).

  This breaks the Harsanyi aggregation model. Harsanyi requires a single metric to aggregate preferences. Feinberg created two metrics to prevent the market metric from totally subsuming the civic metric. This isn't utilitarianism; it's a hybrid of liberalism (market earnings) and egalitarianism (civic worth).

  ### Direction Two: Fund → Theory

  **1. What Drove the Compression?**
  You ask if the compression (squeezing the top awards) was driven by diminishing MU (utilitarian) or equality/solidarity (non-utilitarian).

  Look at the design feature: **Feinberg's discretion was ex-post, not ex-ante.**
  If this were true utilitarianism based on diminishing MU, the formula would have been baked into the statute. Instead, the statute said "calculate losses." Feinberg manually intervened *after* seeing the initial distribution because the *optics* were untenable.
  This tells us the driver was **political sustainability**, not welfare maximization.
  *   *Distinguishing Feature:* In a pure diminishing MU model, you tax the high award to fund the low award. In the VCF, the pot was roughly fixed (Congress appropriated funds, but the waiver of litigation was the real funding source). Feinberg didn't transfer money from the banker to the janitor; he simply capped the banker's claim against the fund. The janitor didn't get more because the banker got less; the banker just got less. That is not utilitarian redistribution; that is **rationing**.

  **2. Do High Earners Have Utilitarian Standing?**
  You ask if the high earners' complaint has standing inside a utilitarian analysis.
  *   *Strict Utilitarian View:* No. If MU is diminishing, transferring a dollar from a millionaire widow to a poor widow increases total utility. The high earner's "loss" is utility-irrelevant if their marginal utility is near zero.
  *   *Rule-Utilitarian View:* Yes. If the state establishes a precedent that "your compensation depends on political discretion rather than established rules," future investment in human capital decreases. The high earners are defending the **integrity of the pricing mechanism**.

  However, their complaint is strongest under **Corrective Justice**, not Utilitarianism. They were told: "We will make you whole." They were delivered: "We will make you whole, unless you are too whole, in which case we will cap you." The VCF betrayed the tort principle to save the airline industry. The high earners subsidized the airlines' survival.

  ### Where the Framework Goes Quiet

  You identified three spots. I agree, but I'll sharpen why the theory breaks there.

  **(a) Households vs. Persons**
  Standard welfare economics assumes individual utility functions. The VCF awarded based on *dependency*. This implies the utility function is **unitary household**.
  *   *The Break:* If the spouse dies, does the surviving partner's utility drop by 50%? 90%? The VCF assumed a fixed "loss of consortium" value. This ignores heterogeneity in relationships. The framework goes quiet because it cannot measure *love*, only *legal dependency*. It substitutes a legal proxy (marriage certificate) for an economic reality (interdependent utility).

  **(b) Ex-Post Compensation vs. Ex-Ante Allocation**
  You noted this is compensating a loss, not splitting a pot.
  *   *The Break:* Harsanyi's Aggregation Theorem works behind a Veil of Ignorance (ex-ante). The VCF operated with full information (ex-post).
  *   *Consequence:* Once identities are known, "fairness" shifts from *procedural* (same rules for all) to *distributive* (same outcomes for all). Standard theory struggles here because ex-post compensation invites **envy constraints**. A utilitarian calculator doesn't care if the banker is jealous of the janitor's payout ratio. A political administrator does. The theory goes quiet because it lacks a variable for "social resentment."

  **(c) The 97% Takeup**
  You suspect this is coercion, not acceptance.
  *   *The Break:* Revealed preference theory assumes voluntary choice. The VCF choice was: "Take this offer or sue the bankrupt airlines (and wait 10 years)."
  *   *Consequence:* This is not evidence of the formula's optimality. It is evidence of **monopsony power**. The government was the only buyer. The 97% figure tells us nothing about the justice of the awards, only the lack of alternatives. The framework goes quiet because it cannot distinguish between "consent" and "capitulation" when the counterfactual is ruin.

  ### Evaluating Your Final Take

  **Your Take:** *Legitimacy depended on believing awards were non-comparative... institutions survive IUC by keeping them offstage.*

  **My Pushback:** You are half-right, but you're missing the ritual.
  It wasn't just that the comparisons were "offstage." It was that they were **wrapped in procedural individualism**.
  Feinberg didn't just send checks. He held **hearings**. He sat with families. He listened to stories.
  *   *Why this matters:* If he had just run the spreadsheet and mailed checks, the compression would have looked like theft. By holding hearings, he created a **ritual of recognition**.
  *   *The Mechanism:* The hearing allowed the high-earner family to feel *heard* even if they were *paid less*. The "individualized" process masked the "comparative" outcome.

  **The Lesson:** It's not just that IUC must be hidden. It's that **distributive choices require procedural cover.**
  The VCF isn't unique because it did IUC. It's unique because the IUC was *visible* (names and amounts leaked), yet it survived because the *process* felt personal.
  Most governments do IUC constantly (tax brackets, welfare benefits, Medicaid caps). They survive because they are **anonymous**. The VCF survived because it was **intimate**.

  **Conclusion:**
  You are pattern-matching, but you've identified a real phenomenon. However, don't call it "Interpersonal Utility Comparison." Call it **"Political Pricing of Human Life."**
  Utility implies a scientific measure of welfare. There was no science here. There was a spreadsheet, a moral horror at the disparity, and a special master with a gavel trying to keep the airlines flying while preventing a public revolt over the price of a janitor vs. a banker.
  The VCF proves that when forced to price lives explicitly, the state will use market logic to calculate the bill, and socialist logic to pay it, and ritual logic to justify the contradiction.
