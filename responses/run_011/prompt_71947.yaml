answer: |-
  Good morning. Look at her. The Duchess.

  She sits quiet now, but those of you who worked the night shift know she never really slept. She hummed. She vibrated through the concrete floor and up into the soles of your boots. She smelled of ink and ozone and hot metal. For sixty-three years, she stood in this room, and we stood around her.

  Look at the plaque mounted on the railing there. The foundry cast the letters last week, and they read: "The press that printed this city, 1962–2025."

  I have stood here reading that sentence over and over. Grammatically, it is active voice. The subject is the press. The verb is printed. The object is the city. It claims the steel did the work.

  I am here to tell you that is not true.

  Machines do not print cities. People print cities.

  This machine did not make a decision to start in 1962. People signed the checks. People bolted the rollers. People fed the paper webs. And this machine did not make a decision to stop in 2025. We made that choice. We signed those orders. We chose to move our stories to screens. We chose to stop the ink.

  So I ask you to read that plaque differently. Do not read it as a statement of what the steel did. Read it as a shorthand for what we did together. "The press [we used to] print this city." The grammar belongs to us.

  My friend who studies history asks a question I have carried all year: Do things have politics? Does the tool shape the master?

  Looking around this room, I see the answer. The Duchess did not force us to do anything. But she invited us into a specific way of living. She demanded we work at night while the city slept. She demanded we prioritize speed above all else. She demanded we consolidate our operations in the nineties to keep her fed. She demanded a hierarchy of foremen and pressmen and editors.

  We accepted those terms. We organized our unions around her rhythm. We built our deadlines around her speed. We structured our ownership around her cost. The politics were not in the iron. The politics were in how we arranged ourselves to serve the iron.

  That is why I look at the pressroom crew and feel the most weight. You speak her language. You know the sound of a bearing going bad. You know how to adjust the tension when the humidity breaks. You kept the news moving when the power flickered and when the deadlines tightened. Some of you left when we consolidated. Some of you stayed. Some of you are learning new trades this spring.

  Your pride belongs to you. No technology takes that away. You ran the line. You kept the ink flowing. You printed the truth when it was hard to read.

  I see the executives in the front row. You carry the burden of the final choice. You looked at the numbers. You looked at the readers. You decided this model could no longer sustain the work we need to do. You chose to end the print edition so the newsroom could survive in a new form. That is a human decision. It is not the fault of the digital age. It is the result of our calculation.

  I see the local officials here, speaking about progress. Progress is not a force that happens to us. Progress is what we build when we decide to tear something down to make room for something else. We are choosing to move the Duchess to a museum so we can build a different future.

  Tomorrow morning, you will run her one last time.

  You will thread the web. You will warm the rollers. You will print the commemorative edition. The ink will be fresh. The type will be sharp. And then, you will wash the units. You will drain the fluids. You will disconnect the power.

  We will dismantle her. We will crate her. We will ship her to the state museum where she will sit quiet under glass.

  She will not miss the noise. She is steel. But we will miss the noise. We will miss the vibration in the floor. We will miss the smell of the news coming off the line.

  The plaque says the press printed the city. But when the historians look back at this era, I want them to know who actually did the work.

  We printed the city.

  We chose the stories. We set the type. We ran the press. And now, we choose to stop.

  Thank you. Let's get to work. One last run.
