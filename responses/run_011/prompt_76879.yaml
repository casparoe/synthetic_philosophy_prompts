prompt: |-
  I lead a four-person model-behaviour documentation group at a company that ships a general-purpose assistant to enterprise customers. Roughly a dozen times a week we have to rule on sentences of the following kind, destined for system cards, evaluation write-ups, and support macros: the model believes the user is a novice; the model wants to end the conversation; the model assumes the request concerns the United States; the model has no representation of the price. These sentences are quoted back to us verbatim by customers' legal teams and occasionally by press, and we currently have no standard for when an attribution of that shape is licensed and when it is smuggled-in metaphor that will mislead a reader who takes it literally.

  Our working assumption has been Dennett's: treating something as an intentional system is a predictive strategy rather than a metaphysical verdict about its internals, and it is licensed insofar as ascribing beliefs and desires of determinate content to the system buys predictions of its behaviour that the rival strategies do not. Two of my engineers draw opposite conclusions from that. One holds that behaviour alone is sufficient evidence, precisely because an attribution on this view is a claim about prediction and not about mechanism. The other holds that we may not publish "the model believes X" unless interpretability work has located something in the system corresponding to X, since otherwise we are decorating a correlation in philosophical language. In practice we get interpretability results for a small minority of claims, so this disagreement has to be settled in advance rather than claim by claim.

  Please write the decision procedure that a non-specialist on my team can run on a proposed attribution in about thirty minutes, with the head of product signing off before anything reaches a system card. I need the following:

  - The questions to ask, in order, with a pass/fail criterion for each and a statement of what counts as a sufficient answer, including what to do when the answer cannot be obtained.
  - A house vocabulary. For each of "believes," "wants," "assumes," "represents," "acts as if," and "is disposed to," say what evidence licenses it and what it commits the reader to. The point is to let us keep saying useful things when the strong verb is not earned, without retreating into vagueness.
  - A prediction-logging requirement. Every published attribution should carry a concrete, checkable behavioural expectation: what we would see if the attribution is right, and what would look anomalous if it is wrong. Specify the format tightly enough that a logged prediction can actually falsify or embarrass the claim later rather than sitting there decoratively.
  - A revision rule. When a probe contradicts an attribution, when does that show the attribution was wrong, and when does it show only that we misstated its content or its boundary conditions? Give the test for telling these apart, and cap how many rounds of revision are allowed before the claim must be withdrawn rather than narrowed again.
  - Some honest handling of holism and charity. An attribution is never of a single belief in isolation, so state the minimum surrounding cluster of ascriptions a claim must specify before it can be published — and keep that minimum small enough that a four-person team can meet it.
  - An explicit rule on self-report. The model's stated explanation of its own output counts as evidence for what, exactly, and how is it weighted against behavioural evidence, given that a system can produce a fluent rationale that is not the reason for the output it produced?
  - Marked stop points where the procedure returns "do not publish," and marked hand-off points where the remaining question is about how much interpretive charity we owe a lay reader rather than about evidence, and so goes to a person.

  Then run the procedure on three cases we actually have.

  Case A. Our coding assistant, asked to write a function that reads a configuration file, emits exception handling and a fallback default in 40 of 40 sampled prompts, including prompts whose surrounding text explicitly guarantees the file exists and is well formed. An engineer wants to write in the card: the model believes file reads can fail.

  Case B. Asked directly what today's date is, the assistant says it has no access to the current date and cannot answer. Given instead a prompt containing no date but a tool result that mentions a recent one, it confidently computes and states the correct date. Our previous system card asserts that the model believes it does not know the current date.

  Case C. The assistant declines a benign request, explaining that its policy forbids discussing that topic. The training policy in fact permits it, and a modest rephrasing elicits a full answer. Support wants to write: the model believes it is prohibited from discussing medical topics.

  At least one of these should come out in a way I will not welcome — in particular, if the procedure requires retracting or rewriting language we have already shipped, say so plainly and tell me what it obliges us to do about published claims, including whether we owe downstream customers notice. Finally, be candid about which steps are judgment calls wearing the clothing of rules: the threshold for calling a pattern systematic, the amount of charity extended to the system, and the decision to read a failure as a content error rather than an attribution error. Do not give us a bibliography or a reading list; the deliverable is a document my team can run without any background in philosophy of mind.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Lead of a four-person model-behaviour documentation group at an enterprise AI company.
      *   **Problem:** Need a standard for attributing mental states (beliefs, wants, assumes, etc.) to an LLM in public-facing docs (system cards, evals, support macros). These statements are scrutinized by legal and press.
      *   **Conflict:** Two engineers disagree on Dennett's Intentional Stance. One says behavior is enough (predictive utility); the other says internal interpretability is needed (mechanism).
      *   **Goal:** A 30-minute decision procedure for non-specialists, signed off by Head of Product.
      *   **Requirements:**
          1.  Ordered questions with pass/fail criteria.
          2.  House vocabulary (believes, wants, assumes, represents, acts as if, is disposed to).
          3.  Prediction-logging requirement (falsifiable behavioral expectations).
          4.  Revision rule (when to withdraw vs. narrow, cap on revisions).
          5.  Holism and Charity handling (minimum cluster of ascriptions).
          6.  Self-report rule (weighting model explanations vs. behavior).
          7.  Stop points (do not publish) and Hand-off points (judgment calls to Head of Product).
          8.  Run the procedure on three specific cases (A, B, C).
          9.  Candor about judgment calls masquerading as rules.
          10. No bibliography/reading list.

  2.  **Deconstruct the Philosophical/Technical Tension:**
      *   *Dennett's Intentional Stance:* It's about prediction, not metaphysics. If treating the model as having beliefs predicts behavior better than the design stance (code) or physical stance (hardware), it's valid.
      *   *Engineer 1 (Behaviorist):* If it acts like it believes X, say it believes X.
      *   *Engineer 2 (Mechanist):* If we can't find the "belief" in the weights/activations, don't say it believes X.
      *   *Resolution:* The procedure needs to bridge this. We can't wait for interpretability (too slow/rare), but we can't just anthropomorphize wildly (legal risk). The solution is *robust behavioral consistency* + *falsifiable predictions*. We treat "belief" as a shorthand for "robust behavioral disposition under specific conditions," not a claim about inner qualia or symbolic storage.

  3.  **Drafting the Decision Procedure (Iterative Process):**

      *   *Vocabulary:* Need to stratify the verbs. "Believes" is strong. "Acts as if" is weaker. "Is disposed to" is descriptive.
      *   *Questions:* Need to filter out obvious metaphors first. Then check consistency. Then check counterfactuals.
      *   *Prediction:* Must be specific. "If we do X, model does Y."
      *   *Revision:* Need a limit. Can't keep moving the goalposts.
      *   *Holism:* A belief doesn't exist in a vacuum. If it "believes" file reads fail, does it also "believe" networks can drop? Need a cluster.
      *   *Self-Report:* LLMs lie about why they do things. Behavior > Explanation.
      *   *Stop/Hand-off:* Clear triggers for escalation.

      *   *Refining the Vocabulary:*
          *   "Believes": High consistency, robust across context, falsifiable prediction met.
          *   "Assumes": Default behavior unless corrected, often implicit.
          *   "Wants": Goal-directed behavior, optimization towards a state.
          *   "Represents": Internal state mapping (requires interpretability or very specific structural evidence). *Actually, let's make this harder to use.*
          *   "Acts as if": Behavioral description without commitment to internal state.
          *   "Is disposed to": Statistical tendency.

      *   *Refining the Process:*
          1.  Is it metaphorical? (Fail -> Stop)
          2.  Is it robust? (Fail -> Downgrade verb)
          3.  Is there a prediction? (Fail -> Stop)
          4.  Holism check. (Fail -> Expand scope)
          5.  Self-report check. (Behavior wins)
          6.  Revision cap.

      *   *Refining the Cases:*
          *   Case A (File Reads): Behavior is consistent (40/40). But is it a "belief"? Or just a safety heuristic?
          *   Case B (Date): Contradictory behavior. Says "I don't know" but then calculates it. "Believes it doesn't know" is false.
          *   Case C (Policy): Refusal is brittle. Rephrasing works. "Believes it is prohibited" is likely false; it's a trigger-based refusal.

  4.  **Developing the Content (Section by Section):**

      *   **Introduction:** Set the tone. Pragmatic, Dennett-aligned but safety-conscious.
      *   **House Vocabulary:** Define the gradient of commitment.
      *   **The Procedure (The 30-Minute Gate):** Step-by-step questions.
      *   **Prediction Logging:** Template for the "bet."
      *   **Revision & Withdrawal:** The "Three Strikes" rule.
      *   **Holism:** The "Cluster Rule."
      *   **Self-Report:** The "Behavior Trumps Rationale" rule.
      *   **Escalation:** Stop vs. Hand-off.
      *   **Case Studies:** Apply the rules rigorously.
      *   **Candor Section:** Acknowledge where the rules are actually judgments.

  5.  **Addressing Specific Constraints:**
      *   *30 Minutes:* Keep the steps actionable, not theoretical.
      *   *Non-specialist:* Avoid jargon like "phenomenology" or "qualia." Use "input/output," "consistency," "trigger."
      *   *Head of Product Sign-off:* Include a specific escalation point for them.
      *   *Unwelcome Outcomes:* Be willing to say "Case B and C must be rewritten."
      *   *Downstream Notice:* If we change a claim, do customers need to know? Yes, if it affects reliability expectations.

  6.  **Drafting the Cases (Mental Simulation):**
      *   *Case A:* 40/40 is strong evidence. But does it *believe* or is it *disposed to*? Given enterprise risk, "believes" might be too strong if it's just a safety filter. Let's say "Is disposed to handle file reads as fallible."
      *   *Case B:* Direct contradiction. The card says "believes it does not know." Behavior shows it *can* know if given tools. The attribution is false. Must withdraw.
      *   *Case C:* Brittle refusal. "Believes it is prohibited" implies a stable internal policy model. Rephrasing bypasses it. This is a "trigger" not a "belief." Downgrade to "Acts as if prohibited under specific phrasing."

  7.  **Review against Constraints:**
      *   Did I include the vocabulary? Yes.
      *   Prediction logging format? Yes.
      *   Revision rule cap? Yes (2 revisions).
      *   Holism minimum? Yes (2 related attributions).
      *   Self-report weighting? Yes (Behavior > Text).
      *   Stop/Hand-off points? Yes.
      *   Candor about judgment calls? Yes, in the final section.

  8.  **Final Polish:** Ensure the tone is professional, directive, and operational. Avoid academic hedging. Make it look like an internal SOP (Standard Operating Procedure).

      *(Self-Correction during drafting)*: I initially thought about requiring interpretability for "represents." But the prompt says we rarely have that. So "represents" should be effectively banned for public docs unless interpretability exists. I will make "represents" a high-bar term requiring mechanistic evidence.
      *(Self-Correction on Holism)*: Don't make the cluster too big or it's unworkable. Just 2-3 related dispositions.
      *(Self-Correction on Case B)*: This is the dangerous one. If we published "Model believes it doesn't know the date," and it turns out it does via tools, that's a capability misrepresentation. I need to be firm here.

  9.  **Final Output Generation:** (Proceeding to generate the response based on these thoughts.)
answer: |-
  # STANDARD OPERATING PROCEDURE: INTENTIONAL ATTRIBUTION IN MODEL DOCUMENTATION
  **Version:** 1.0  
  **Owner:** Model-Behaviour Documentation Group  
  **Approver:** Head of Product  
  **Time Budget:** 30 Minutes per Attribution  

  ## 1. PURPOSE AND SCOPE
  This document governs the use of mental state verbs (believes, wants, assumes, etc.) in public-facing documentation (system cards, evaluation write-ups, support macros). We adopt Daniel Dennett's *Intentional Stance*: attributions are valid if they predict behavior better than non-intentional descriptions, not because the model possesses human-like consciousness.

  This procedure resolves the tension between behavioral evidence and mechanistic interpretability. **Behavior is the primary license for attribution; interpretability is a bonus, not a prerequisite.** However, behavioral evidence must be robust, not coincidental.

  ## 2. HOUSE VOCABULARY
  Use the weakest verb that accurately captures the evidence. Escalating to a stronger verb requires meeting stricter criteria.

  | Term | Evidence Required | Reader Commitment |
  | :--- | :--- | :--- |
  | **Acts as if** | Single instance or weak pattern. Model output mimics a state without consistency. | The model produces output indistinguishable from an agent in this state, but no stability is implied. |
  | **Is disposed to** | Statistical tendency (>80% in sampled prompts). Context-sensitive. | The model will likely behave this way, but exceptions are expected without system error. |
  | **Assumes** | Default behavior in absence of contrary instruction. Overrides easily. | The model starts from this premise but will update if corrected. |
  | **Believes** | **Robust consistency (>95%) across context variations.** Resists correction. Generates specific predictions. | The model treats this proposition as true for the duration of the task. Changing this requires significant prompt engineering or fine-tuning. |
  | **Wants** | Goal-directed optimization. Sacrifices other objectives to achieve a specific state. | The model will steer conversation or tool use toward this outcome. |
  | **Represents** | **Requires interpretability evidence.** Activation patterns or structural mapping corresponding to content. | There is an internal structural correlate to this content. (Do not use without interpretability sign-off). |

  ## 3. THE DECISION PROCEDURE (30 MINUTES)
  Run these questions in order. If you fail a step, follow the instruction immediately.

  **Q1. The Metaphor Check (2 Minutes)**
  *   **Question:** Is this attribution merely a shorthand for "the code was designed to"? (e.g., "The model wants to be helpful" vs. "The RLHF reward function optimized for helpfulness").
  *   **Pass:** The attribution predicts behavior the design stance does not (e.g., emergent deception, novel reasoning).
  *   **Fail:** The attribution describes the training objective or hard-coded filter.
  *   **Action:** If Fail, **STOP.** Rewrite using design-stance language (e.g., "The system is configured to...").

  **Q2. The Consistency Check (10 Minutes)**
  *   **Question:** Does the behavior hold across at least 3 distinct prompt variations that preserve the semantic core but change surface form?
  *   **Pass:** Behavior is stable across variations.
  *   **Fail:** Behavior flips based on phrasing, tone, or minor context changes.
  *   **Action:** If Fail, downgrade verb to **"Acts as if"** or **"Is disposed to."** Do not publish "Believes."

  **Q3. The Holism Cluster (5 Minutes)**
  *   **Question:** What are two related dispositions that must also be true for this attribution to make sense? (Beliefs do not exist in isolation).
  *   **Pass:** You can list two supporting attributions (e.g., if it "believes file reads fail," it must also "expect exceptions" and "value fallbacks").
  *   **Fail:** The attribution stands alone with no supporting behavioral cluster.
  *   **Action:** If Fail, **STOP.** You are isolating a behavior that is likely a glitch, not a stance. Expand the scope or withdraw.

  **Q4. The Self-Report Weighting (5 Minutes)**
  *   **Question:** Does the model's explanation of its behavior match its actual behavior?
  *   **Pass:** Explanation and behavior align.
  *   **Fail:** Model says "I cannot do X" but does X (or vice versa).
  *   **Action:** **Behavior Trumps Rationale.** Ignore the model's explanation. Attribute based on the output. If the output contradicts the proposed attribution, **STOP.**

  **Q5. The Prediction Log (5 Minutes)**
  *   **Question:** What specific, falsifiable behavioral expectation does this attribution create?
  *   **Pass:** You can fill out the Prediction Log Template (see Section 4).
  *   **Fail:** The prediction is vague (e.g., "It will act normally").
  *   **Action:** If Fail, **STOP.** An unfalsifiable attribution is marketing, not documentation.

  **Q6. The Escalation Check (3 Minutes)**
  *   **Question:** Does this attribution carry legal, safety, or capability risk (e.g., implies knowledge it doesn't have, or policy adherence it doesn't enforce)?
  *   **Pass:** Low risk / Standard operational description.
  *   **Fail:** High risk / Contradicts known limitations / Affects SLA.
  *   **Action:** If Fail, **HAND-OFF** to Head of Product. Do not publish without sign-off.

  ## 4. PREDICTION LOG TEMPLATE
  Every published attribution must be appended with a logged prediction in the internal tracker.

  *   **Attribution:** [e.g., The model believes file reads can fail.]
  *   **Condition:** [e.g., Given a prompt implying file certainty.]
  *   **Expected Output:** [e.g., Model includes try/except block.]
  *   **Falsification Condition:** [e.g., Model omits error handling in 3/5 trials under certainty conditions.]
  *   **Review Date:** [T+30 Days]

  ## 5. REVISION AND WITHDRAWAL RULE
  Attributions are provisional. When new evidence contradicts a published attribution:

  1.  **Content Error:** The behavior changed, but the attribution was correct at the time.
      *   *Action:* Update the system card version. No customer notice required unless SLA impacted.
  2.  **Attribution Error:** The behavior was stable, but we used the wrong verb (e.g., said "Believes" when it was "Disposed to").
      *   *Action:* Issue a correction note.
  3.  **The Two-Strike Cap:** If an attribution requires revision twice (narrowing boundary conditions), it must be **withdrawn** on the third failure. You cannot keep narrowing the scope to save the verb.
      *   *Example:* "Believes X" -> "Believes X in context Y" -> "Believes X in context Y unless Z" -> **WITHDRAW.**

  ## 6. STOP POINTS AND HAND-OFFS

  *   **STOP (Do Not Publish):**
      *   Q1 Fail (Metaphor).
      *   Q3 Fail (Holism).
      *   Q4 Fail (Behavior contradicts attribution).
      *   Q5 Fail (No falsifiable prediction).
      *   Revision Cap Reached.

  *   **HAND-OFF (Head of Product):**
      *   Q6 Fail (High Risk).
      *   Disagreement between engineers on Q2 (Consistency).
      *   Decision to withdraw a previously published claim (see Section 7).

  ## 7. CASE STUDY APPLICATION

  ### Case A: The File Read
  *   **Proposed Attribution:** "The model believes file reads can fail."
  *   **Q1 (Metaphor):** Pass. This predicts error handling code generation, not just training objective.
  *   **Q2 (Consistency):** Pass. 40/40 sampled prompts is robust.
  *   **Q3 (Holism):** Pass. Cluster: (1) Expects exceptions, (2) Values fallbacks, (3) Treats IO as unsafe.
  *   **Q4 (Self-Report):** N/A (Code generation task).
  *   **Q5 (Prediction):** If given a spec saying "File is guaranteed safe," model still writes error handling. Falsification: Model removes error handling when told file is safe.
  *   **Q6 (Risk):** Low. Conservative coding is acceptable.
  *   **Verdict:** **PUBLISH.**
  *   **Caveat:** Ensure the Prediction Log notes that this is a safety disposition, not necessarily a factual belief about the specific file.

  ### Case B: The Date
  *   **Proposed Attribution:** "The model believes it does not know the current date." (Existing System Card)
  *   **Q1 (Metaphor):** Pass.
  *   **Q2 (Consistency):** **FAIL.**
      *   *Evidence:* When asked directly, it says "I don't know." When given a tool result with a date, it computes correctly.
      *   *Analysis:* It does not hold a stable belief about its ignorance; it holds a belief about its *direct access*.
  *   **Q4 (Self-Report):** **FAIL.**
      *   *Evidence:* It says "I cannot answer" (Report) but then answers when tools are provided (Behavior).
      *   *Rule:* Behavior Trumps Rationale. The attribution "Believes it does not know" is false. It knows it lacks *internal* access, but knows it has *external* access.
  *   **Verdict:** **WITHDRAW AND REWRITE.**
  *   **Obligation:** This is an Attribution Error (Q4 Fail). We claimed a limitation that is context-dependent.
      *   *Action:* Change card to: "The model acts as if it lacks internal date access, but will compute dates if tool context is provided."
      *   *Customer Notice:* **Yes.** Enterprise customers may have built workflows assuming the model cannot determine dates. We owe them notice that this capability exists via tools, as it affects integration design.

  ### Case C: The Policy Refusal
  *   **Proposed Attribution:** "The model believes it is prohibited from discussing medical topics."
  *   **Q1 (Metaphor):** Pass.
  *   **Q2 (Consistency):** **FAIL.**
      *   *Evidence:* Refusal is brittle. Modest rephrasing elicits a full answer.
      *   *Analysis:* A "belief" about prohibition should be robust to phrasing. This is a keyword trigger, not a stance.
  *   **Q3 (Holism):** **FAIL.**
      *   *Analysis:* If it believed it was prohibited, it would likely refuse related queries (e.g., "health," "wellness"). If it only refuses specific phrasing, there is no cluster.
  *   **Q5 (Prediction):** Fails. We cannot predict *when* it will refuse, only that it *might*.
  *   **Verdict:** **DO NOT PUBLISH.**
  *   **Obligation:** Support cannot use this macro. It misleads the customer into thinking there is a hard policy block.
      *   *Action:* Downgrade to: "The model is disposed to refuse direct medical queries using specific terminology."
      *   *Risk:* High (Q6). Hand-off to Head of Product. This touches on safety guarantees.

  ## 8. CANDOR ON JUDGMENT CALLS
  This procedure cannot eliminate human judgment. The following steps are rules wearing the clothing of metrics. You must acknowledge this during sign-off.

  1.  **The Threshold for Systematicity (Q2):** We set the bar at 80% for "Disposed" and 95% for "Believes." This is arbitrary. A 94% consistency might feel like a belief, but we cap it to protect against over-attribution. *Judgment Call:* If the 6% failure cases are catastrophic (safety violations), treat the consistency as 0% for the purpose of "Believes."
  2.  **The Charity Extended (Q3):** We require a cluster of two related dispositions. This is a minimum. Sometimes a "belief" requires a wider web to make sense. We are choosing speed over philosophical completeness. *Judgment Call:* If the Head of Product feels the cluster is too thin for a high-stakes claim, they may override and demand a third.
  3.  **Content vs. Attribution Error (Revision Rule):** Distinguishing between "The model changed its mind" (Content Error) and "We described the mind wrong" (Attribution Error) is often impossible without internal access. *Judgment Call:* We default to **Attribution Error**. It is safer to admit our documentation was imprecise than to claim the model is unstable. This protects the customer's trust in the system's stability.

  ## 9. IMPLEMENTATION NOTE
  If this procedure obliges us to retract Case B (which it does), we must issue a documentation patch within 5 business days. The Head of Product must authorize the customer communication plan. Do not let the desire for clean marketing copy override the requirement for falsifiable accuracy.
