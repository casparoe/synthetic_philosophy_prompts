answer: |-
  You have described a phenomenon that sits at the intersection of the philosophy of language, metaphysics, and informal logic. While there is no single Latin name for this specific dialectical maneuver (like *ad hominem* or *post hoc*), there is an established theoretical framework that explains *why* it happens, and a descriptive term we can coin to name the maneuver itself.

  ### 1. The Established Framework

  The body of work that covers the "whole of what you described" is the theory of **Essentially Contested Concepts**, originally articulated by W.B. Gallie (1956), combined with the philosophical doctrine of **Sortal Relativity of Identity**.

  **Essentially Contested Concepts (ECC):**
  Gallie argued that certain concepts (like "Art," "Democracy," "Socialism," and arguably "Rome" as a civilizational ideal) have no single correct definition. They are composed of multiple dimensions (legal, cultural, territorial, ideological). Disputes about ECCs are not resolvable by evidence because the disagreement is not about facts, but about *which dimension is central to the concept's value*.
  *   **Coverage:** This explains why stipulating definitions failed in your argument. When you tried to define "Rome," your friend rejected it not because it was factually wrong, but because it excluded the dimension of "Rome" they valued (continuity of law/culture vs. continuity of state).
  *   **Limit:** ECC theory explains the *status of the concept*, but it does not fully name the *argumentative move* of shifting between dimensions mid-stream to win a point.

  **Sortal Relativity of Identity:**
  In metaphysics (championed by philosophers like Peter Geach and David Wiggins), identity is not absolute; it is relative to a "sortal" concept (a kind or category). You cannot ask "Is object X the same as object Y?" without asking "Is X the same *F* as Y?" (e.g., same *ship*, same *collection of planks*, same *registered vessel*).
  *   **Coverage:** This explains the "family of candidates" you noticed. "Rome" is not one object; it is a locus where several sortals overlap (The Western State, The Eastern State, The Legal Order, The Latin Culture).
  *   **Limit:** This is a metaphysical description, not a label for the fallacy of exploiting this relativity in argument.

  ### 2. The Coinage: "Motivated Sortal Selection"

  Since no standard fallacy name captures the dynamic shifting of the *subject's ontology* to fit the evidence, I propose the term **Motivated Sortal Selection** (colloquially: **Sortal Shopping**).

  **Definition:**
  *Sortal Shopping* occurs when an arguer treats a complex, cluster-like subject term (e.g., "Rome," "Socialism," "The Self") as univocal, but silently selects different persistence conditions (sortals) for different pieces of evidence to ensure all evidence supports a single conclusion.

  **The Edges of the Concept:**

  *   **What counts as a case:**
      *   **The Rome Argument:** As you described. Evidence A (Deposition of Romulus) is treated as evidence about *Rome qua State*. Evidence B (Survival of Latin) is treated as evidence about *Rome qua Culture*. The conclusion ("Rome did/did not fall") treats "Rome" as if it were only one of these things.
      *   **Personal Identity:** Arguing a friend is "not the same person" because their personality changed (Psychological Sortal), while arguing they *are* the same person when it comes to repaying a debt (Biological/Legal Sortal), without acknowledging the switch.
      *   **Political Regimes:** Arguing a state is "still Socialist" because it retains state ownership (Economic Sortal), while arguing it is "no longer Socialist" because it allows elections (Political Sortal), depending on whether the speaker is defending or attacking the regime.

  *   **What is a Near Miss (Distinct Phenomena):**
      *   **Equivocation:** In classic equivocation, the arguer holds *steadily* to two distinct meanings (e.g., "Bank" of a river vs. "Bank" for money). In Sortal Shopping, there are not two stable meanings, but a *spectrum* of candidate criteria, and the selection is opportunistic per datum.
      *   **Moving the Goalposts:** This changes the *standard of proof* required for the conclusion. Sortal Shopping keeps the standard of proof constant but changes *what the evidence is evidence for*.
      *   **The Ship of Theseus:** This is the *puzzle* that arises from sortal relativity. Sortal Shopping is the *exploitative use* of that puzzle in rhetoric.

  *   **What Merely Looks Like It:**
      *   **Multifaceted Analysis:** If a historian says, "Politically Rome fell, but culturally it persisted," they are *disaggregating* the sortals. This is the antidote to Sortal Shopping, not an instance of it. Sortal Shopping requires the *conflation* of the sortals in the final conclusion.

  ### 3. Defect in Reasoning vs. Badly Posed Question

  This is the most critical distinction. Is the arguer committing a fallacy, or is the question itself nonsensical?

  **The Defect (The Fallacy):**
  The reasoning is defective when the arguer **conceals the selection process**. They present the conclusion ("Rome fell") as a brute fact about the world, rather than a consequence of a specific conceptual choice. They claim the authority of objective truth while engaging in subjective categorization.
  *   *Indicator:* The arguer becomes hostile when asked to specify the sortal ("Don't be pedantic, you know what I mean by Rome!").

  **The Badly Posed Question (Ontological Vagueness):**
  The question is defective when it demands a binary answer (Yes/No) for a concept that is inherently a **cluster concept** with no privileged essence. If "Rome" is a bundle of properties (Law, Land, Language, Lineage) and there is no fact of the matter about which property is the "essence," then "Did Rome fall?" has no truth value until the sortal is fixed.
  *   *Indicator:* Even after agreeing on a definition, the arguers feel unsatisfied, because the definition feels "arbitrary" compared to their intuition of the "Real Rome."

  **How to Distinguish From Inside the Argument:**
  Use the **Pragmatic Cash-Out Test**. Ask: *"What turns on the answer?"*

  1.  **If something practical turns on it:** (e.g., "Does the Eastern Empire owe the Western Empire's debts?")
      *   Then the question is **not** badly posed. There is a correct sortal (Legal Continuity).
      *   If the arguer shifts sortals here, it is a **Defect in Reasoning** (fraudulent categorization).
  2.  **If nothing practical turns on it:** (e.g., "Was it *really* Rome?")
      *   Then the question is **Badly Posed**. It asks for a metaphysical fact where there is only a linguistic convention.
      *   If the arguer insists there is a fact of the matter, they are committing **Reification** (treating a concept as a physical object).
      *   In this case, Sortal Shopping is a **symptom** of the bad question, not just a fallacy of the arguer. They are struggling to map a binary logic onto a fuzzy reality.

  ### 4. Generalization

  You are correct; this phenomenon generalizes extensively. It is the standard engine of disputes in history, politics, and ethics.

  *   **"Was the USSR Socialist?"**
      *   *Candidate Sortals:* State ownership of means of production? Worker control? Abolition of markets? Egalitarian outcomes?
      *   *Sortal Shopping:* Defenders cite state ownership (Economic Sortal). Critics cite lack of worker control (Political Sortal). Both claim to be discussing the same "Socialism."
  *   **"Did the Enlightenment Succeed?"**
      *   *Candidate Sortals:* The spread of scientific method? The establishment of liberal democracies? The secularization of society?
      *   *Sortal Shopping:* If democracy is weak but science is strong, the answer depends on which sortal the arguer silently activates for the conclusion.
  *   **"Is this the same company?"**
      *   *Candidate Sortals:* Same legal incorporation? Same brand identity? Same employees? Same location?
      *   *Sortal Shopping:* Used constantly in mergers and acquisitions to claim legacy or disavow liability.

  ### Summary

  The phenomenon is **Motivated Sortal Selection** operating within a dispute over an **Essentially Contested Concept**.

  *   **It is a fallacy** when the arguer hides the shifting criteria to claim a binary truth that doesn't exist.
  *   **It is a symptom** when the question demands a binary truth about a concept that is inherently multidimensional.

  The remedy is not to argue harder about the facts, but to **disaggregate the subject**. The argument resolves only when you stop asking "Did Rome fall?" and start asking "Did the Western Imperial Administration cease?" and "Did Latin Civilization cease?" separately. If your friend resists this disaggregation, they are not arguing about history; they are arguing for the privilege of defining the essence.
