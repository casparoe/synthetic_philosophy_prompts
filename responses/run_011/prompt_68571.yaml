  3. I predict a "Not waved through" verdict because the intended policy use triggers the Lucas Critique failure mode from case 4, which R weights higher than the instrumental success seen in cases 1 and 3. The accidental accuracy of the false model is viewed as a risk for intervention rather than a validation of the theory.

  4. The next-season vaccination plan is the decisive factor that flips a potentially passing descriptive model into a failing policy model, as uniform mixing cannot structurally support targeted intervention logic. Removing the policy proposal might save the paper, but keeping it guarantees a rejection based on case 4 precedents.

  5. Hand him a paper that achieves strong predictive fit using a false assumption but provides no robustness check to show whether the result depends on that assumption. This forces a choice between valuing the predictive success alone or penalizing the unverified structural fragility.
