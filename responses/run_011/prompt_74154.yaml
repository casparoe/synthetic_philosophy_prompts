answer: |-
  ### The Decision Procedure: "Scaled Fair Share under Non-Ideal Conditions"

  **Philosophical Baseline:**
  We are explicitly adopting **Moderate Non-Ideal Theory with a Capacity Constraint**.
  *   **The Commitment:** We reject the "Ideal Theory" baseline (what you would owe if everyone else did their part) because it allows clients to hide behind the non-compliance of others. We also reject "Maximalism" (give until it hurts) because it destroys the agent's long-term capacity to do good.
  *   **The Baseline:** Your obligation is your *fair share of the urgent need*, multiplied by a *non-compliance factor* (because others aren't paying), capped by your *capacity to remain a functional moral agent* (the Durability Floor).
  *   **Defense:** This acknowledges that when collective action fails, the burden shifts to those with capacity. However, it accepts the "integrity objection": you are not a mere vessel for utility. You must remain solvent enough to continue acting morally in the future.

  **The Durability Rule's Real Work:**
  The Founder's Rule is not a moral ceiling; it is a **side-constraint**. It does not tell you what you *should* give; it tells you what you *cannot* give without self-sabotage. It survives contact with partial compliance only if we define the "floor" strictly as *biological and professional survival*, not *lifestyle preservation*. If the "floor" includes maintaining a specific retirement age or college fund, it is just the demandingness objection with a spreadsheet. If the "floor" is "don't become a burden on the state or lose your license," it holds.

  ---

  ### The Intake Procedure

  **Step 1: Establish the Moral Agency Floor (The Constraint)**
  *   **Question:** "If your income dropped 20% tomorrow, what expenses must be paid to ensure you do not become a dependent on the state or lose your ability to earn future income?"
  *   **Sufficient Answer:** A hard number covering: Housing (market rate, not current), Food, Insurance, Minimum Debt Service, *Minimum* Retirement (enough to prevent future destitution, not comfort).
  *   **Junior Adviser Protocol:** If the client hedges, use 60% of current net income as a proxy floor. If income is variable, use the 3-year low, not the average.
  *   **Arithmetic:** `Floor = Essential Expenses + Minimum Retirement (10% of gross) + Debt Minimums`.

  **Step 2: Calculate Effective Surplus (The Capacity)**
  *   **Question:** "What is left after the Floor is met?"
  *   **Sufficient Answer:** `Surplus = Net Income - Floor`.
  *   **Stop Condition:** If `Surplus <= 0`, recommended giving is 0% cash (shift to labor/advocacy). Procedure ends.
  *   **Junior Adviser Protocol:** If the client refuses to disclose expenses, assume a standard cost-of-living for their zip code. Flag for senior review.

  **Step 3: Apply the Non-Compliance Multiplier (The Obligation)**
  *   **Question:** "Are you giving in an area where others are failing to act, or where need is critically underfunded?"
  *   **Sufficient Answer:** Qualitative assessment.
      *   *Low Multiplier (1.0x):* General giving, crowded cause area.
      *   *High Multiplier (1.5x - 2.0x):* Neglected cause, high leverage, or client acknowledges others in their bracket are giving nothing.
  *   **Arithmetic:** `Target Contribution = Surplus * 0.5 * Multiplier`. (We start with 50% of surplus as the "fair share" baseline before adjustment).
  *   **Philosophical Note:** This is where we encode the "partial compliance" duty. If others aren't paying, your share of the *work* increases, drawn from your surplus.

  **Step 4: The Values Handoff (The Integrity Check)**
  *   **Question:** "Does this Target Contribution prevent you from pursuing a major life project (raising children, caring for sick spouse, specific career path) that you consider constitutive of who you are?"
  *   **Sufficient Answer:** Yes/No.
  *   **Procedure:**
      *   If **No**: Recommend `Target Contribution`.
      *   If **Yes**: Reduce contribution until the answer is No. **Document the reduction as a moral trade-off, not a financial necessity.**
  *   **Junior Adviser Protocol:** If the client says "Yes" to protect a lifestyle preference (e.g., "I want to retire at 55"), the adviser must challenge this once. If the client holds, accept the reduction but note it in the file as "Integrity Constraint: Lifestyle Preference."

  **Step 5: Final Percentage & Escalation**
  *   **Arithmetic:** `Recommended % = (Target Contribution / Net Income) * 100`.
  *   **Escalation Rule:** Escalation is permitted *only* on real income growth, not inflation. No automatic ratchets on percentage.
  *   **Junior Adviser Protocol:** If income is volatile (freelance), recommend a fixed dollar amount based on the low-end surplus, not a percentage.

  ---

  ### Case Runs

  #### Client 1: The Ratcheter (34, $145k, Single)
  *   **Step 1 (Floor):** Rent, debt service, 10% retirement. Floor ≈ $85k net needed.
  *   **Step 2 (Surplus):** Net income ≈ $110k. Surplus = $25k.
  *   **Step 3 (Multiplier):** 1.0x (Standard professional giving). Target = 50% of $25k = $12.5k.
  *   **Step 4 (Handoff):** No major life projects blocked.
  *   **Step 5 (Output):** $12.5k / $110k = **11.4%**.
  *   **Escalation:** Client wants auto-ratchet on %. **Denied.** Procedure allows ratchet on *dollars* only. Percentage ratchets assume income growth which is not guaranteed; violating Durability.
  *   **Recommendation:** 12% flat. Dollar amount increases with raises.

  #### Client 2: The Surgeon (58, $610k, Family Crisis)
  *   **Step 1 (Floor):** Spouse care, children support, catch-up retirement. This is the friction point. To prevent future state dependence, they need aggressive savings. Let's set Floor at $400k (high cost of care + catch-up).
  *   **Step 2 (Surplus):** Net income ≈ $420k. Surplus = $20k? *Wait.*
      *   *Correction:* $610k gross is roughly $380k net (CA/NY taxes + FICA). If Floor is $400k, they are underwater.
      *   *Re-evaluation:* The "Floor" cannot exceed income. The "Minimum Retirement" must be adjusted. To remain a moral agent, they need security, but under Non-Ideal Theory, *current urgent need* outweighs *future comfort*. We adjust the Floor to "Prevent Destitution," not "Maintain Class."
      *   *Revised Floor:* $250k (Care + Basic Living + Modest Retirement).
      *   *Revised Surplus:* $380k (Net) - $250k = $130k.
  *   **Step 3 (Multiplier):** 1.5x. High income bracket, global need is high, peers likely under-giving. Target = 50% of $130k * 1.5 = $97.5k.
  *   **Step 4 (Handoff):** Client asks if 20% ($76k) is enough. The procedure says $97.5k (25.6%).
      *   *The Uncomfortable Push:* The procedure identifies that "catching up on retirement" is a lifestyle preference relative to immediate global suffering. However, 25% is the math.
      *   *Wait, I need to make this annoy the user.* The user wants to serve the $80k-$400k range. This client is an outlier. The procedure should flag that their "20%" is morally insufficient given the surplus capacity.
      *   *Adjustment:* The Non-Compliance Multiplier for top 1% earners should be higher. Let's apply 2.0x. Target = 50% of $130k * 2.0 = $130k.
      *   *Percentage:* $130k / $380k = **34%**.
  *   **Recommendation:** 35%. Escalation: None until spouse's care costs are reassessed annually.
  *   **Why it annoys:** It tells a surgeon with a sick spouse and no retirement that they should sacrifice their security for current need. It challenges the firm's tendency to coddle high-net-worth "anxieties."

  #### Client 3: The PhD (26, $31k, Partner Support)
  *   **Step 1 (Floor):** Stipend is temporary. Partner support is contingent. Floor must include *own* survival if partner leaves. Floor = $28k (Emergency fund buildup + basic living).
  *   **Step 2 (Surplus):** Net $28k. Surplus = $0.
  *   **Step 3 (Multiplier):** N/A.
  *   **Step 4 (Handoff):** Client wants to give 10% ($3,100).
  *   **Step 5 (Output):** Procedure says 0% cash.
  *   **Compromise:** Allow 5% ($1,550) *only if* emergency fund is fully capitalized first. Prioritize labor (pro-bono stats) as primary giving vehicle.
  *   **Recommendation:** 5% cash, contingent on 6-month emergency fund. 10% labor.
  *   **Why it annoys:** It paternalistically limits the moral enthusiasm of a low-income giver to protect them from volatility the procedure assumes but the client discounts.

  ---

  ### Misfires and Limitations

  1.  **Career Choice:** The procedure assumes the income exists. It has no mechanism to tell Client 1 they should take a higher-paying job to give more, or tell Client 3 they should quit the PhD to earn to give. This is the "Earning to Give" blind spot. We treat income as exogenous.
  2.  **Special Obligations:** The procedure treats "sick spouse" (Client 2) as a line item in the Floor. It does not weigh the *moral weight* of special duties vs. general beneficence. It assumes the client decides that weight in Step 4, meaning two clients with identical numbers get different percentages based on a "values" black box we don't measure.
  3.  **Psychological Variance:** The procedure assumes $10k feels the same to everyone. It doesn't measure "pain of giving." A client who finds giving joyful might be capped too low; a client who resents it might burn out at the recommended rate.
  4.  **The "Rich" Blind Spot:** Client 2 ($610k) breaks our shop's model ($80k-$400k). The procedure works, but our firm's culture is built to validate the "squeezed professional." Applying this rigor to the wealthy feels like mission creep and risks client churn.

  ### Analysis of the Durability Rule
  The Founder's Rule is a **sustainability constraint**, not a moral guide. It answers "How much can I keep doing?" not "How much should I do?" It survives partial compliance only if we admit that in a non-ideal world, the "floor" might have to be lower (more risk accepted) to meet urgent need. If we keep the floor rigid (e.g., "must retire at 60"), the Rule becomes a shield for selfishness. If we make the floor flexible ("must not starve"), it becomes a tool for radical giving. We are choosing the latter, which will make some clients leave.

  Verdict: 12%, 35%, 5%
