answer: |-
  This is a rigorous request that demands we treat statutes not merely as rules of conduct, but as crystallised political philosophy. To reconstruct the implicit normative theory of each regime, we must look at where the law places the burden of culpability, how it defines the capacity of the participants, and what administrative machinery it deploys to sustain the arrangement.

  Below is a reconstruction of the three regimes, testing your hypotheses against the institutional evidence, followed by the administrative implications of shifting their normative foundations.

  ### 1. The Nordic Model (Sweden, Norway)
  **The Arrangement:** Criminalisation of the purchase; decriminalisation (or non-prosecution) of the sale; extraterritorial jurisdiction over buyers.

  **Implicit Normative Theory:**
  *   **Consent and Agency:** This regime **strictly presupposes** that the seller's consent is structurally compromised, not necessarily by immediate force, but by the nature of the transaction itself. It posits a form of 'status-based incapacity'. Unlike a factory worker, the sex worker is viewed as unable to validly consent to the commodification of sexual access because the act is inherently dignitary harm.
  *   **The Moral Patient:** The seller is the primary moral patient (the victim), but the *social order* is the secondary patient. The law treats the transaction as a violation of gender equality and human dignity, regardless of the subjective experience of the seller.
  *   **Expressive Function:** The law functions as a moral declaratory statement. By punishing only the buyer, the state expresses that the demand is the root evil, while the supply is a symptom of patriarchy or desperation that should be met with social services, not penal sanctions.

  **Testing Hypothesis 1 (The Incitement Analogy):**
  You suggest the purchase ban is structurally an incitement offence, implying the seller lacks full agency.
  *   **Analysis:** Legally, this is **underdetermined**. An incitement offence typically requires urging another to commit a *crime*. Here, the seller commits no crime. A more precise reconstruction is that the law treats the buyer as the sole moral agent capable of wrongdoing, analogous to the purchaser of stolen goods where the thief is granted immunity due to duress.
  *   **Why not agricultural work?** This reveals the regime's specific normative commitment: the harm is not *desperation* per se, but *sexual commodification*. The theory distinguishes between labour performed under desperate conditions (which is regulated via labour law) and labour that is inherently violative of dignity (which is suppressed via criminal law). If the theory were purely about economic coercion, your objection would hold. Since it is not, the regime **strictly presupposes** that sex work belongs to a distinct category of 'harmful acts' that cannot be redeemed by fair conditions.

  **Administrative Consequences of Theoretical Shift:**
  *   **If shifted to a Labour Rights Theory (New Zealand model):** Police jurisdiction over the transaction would vanish. The Employment Relations Authority would gain jurisdiction over disputes regarding payment or refusal of clients. Extraterritorial laws would be repealed as incompatible with the sovereignty of other labour markets.
  *   **If shifted to a Public Nuisance Theory (Dutch model):** Policing would move from investigating transactions to monitoring locations. The focus would shift from the identity of the buyer to the zoning compliance of the venue.

  ### 2. The Dutch Model (Netherlands)
  **The Arrangement:** Lifting of the general ban; municipal licensing of brothels; toleration of street work in designated zones.

  **Implicit Normative Theory:**
  *   **Consent and Agency:** This regime **strictly presupposes** that valid consent is possible. The seller is a rational economic actor capable of entering contracts. However, the state assumes a paternalistic role in verifying that consent is not vitiated by third-party coercion (trafficking).
  *   **The Moral Patient:** The primary moral patient is the *public order*. The worker is protected instrumentally, to ensure the industry does not become a vector for organised crime or neighbourhood decay.
  *   **Expressive Function:** Bureaucratic normalisation. By requiring licenses, the state expresses that sex work is a legitimate business like any other, but one with higher negative externalities that require containment. It distinguishes between the 'good' (licensed, tax-paying) and 'bad' (unlicensed, potentially trafficked) worker.

  **Testing Hypothesis 2 (Liberalisation Axis):**
  You note that toleration, decriminalisation, and licensing are distinct.
  *   **Analysis:** The Dutch shift from toleration to licensing confirms this. Toleration expresses indifference or pragmatic resignation; licensing expresses active state endorsement of the *structure* of the trade. The licensing regime **fits well** with a theory of 'regulated vice', similar to gambling or alcohol. It is not full decriminalisation because the state retains the power to exclude actors from the market without proving a criminal act, merely a failure to meet administrative criteria.

  **Administrative Consequences of Theoretical Shift:**
  *   **If shifted to a Nordic Theory:** Municipal licensing bodies would be abolished. The police would be instructed to ignore the venue's compliance and focus solely on the act of payment. Social services would replace the tax authority as the primary state interface with the worker.
  *   **If shifted to a New Zealand Theory:** Licensing requirements would be deemed an unnecessary barrier to entry. Inspections would shift from police/municipal compliance officers to standard Occupational Health and Safety (OHS) inspectors, focusing on worker safety rather than crime prevention.

  ### 3. The New Zealand Model
  **The Arrangement:** Decriminalisation via the Prostitution Reform Act 2003 (PRA); integration into employment law; exclusion of migrant workers (s.19); local council bylaw powers.

  **Implicit Normative Theory:**
  *   **Consent and Agency:** This regime **strictly presupposes** that sex work is work. Consent is governed by contract and employment law, not criminal law. The worker has the right to refuse service, a hallmark of independent contracting or employment.
  *   **The Moral Patient:** The worker's physical safety and labour rights. However, s.19 introduces a secondary patient: the *national community*.
  *   **Expressive Function:** Harm reduction and pragmatic integration. The "not endorsing" clause (s.3) is the critical friction point.

  **Testing Hypothesis 2 (Coherence of "Decriminalise without Endorsing"):**
  You ask if authorising an activity while disclaiming authorisation is coherent.
  *   **Analysis:** It is **coherent** only if viewed through a harm-reduction lens rather than a moral approval lens. The state can recognise an activity as inevitable and regulate it for safety without morally sanctioning it (analogous to needle exchange programmes). However, the operative text of the Act (OHS framework, contract enforcement) **strictly presupposes** the 'work' theory. The "not endorsing" clause is expressive surplusage intended to secure legislative passage.
  *   **The Migrant Exclusion (s.19):** This creates a theoretical fracture. If sex work is truly 'work', excluding non-cizens violates the principle of universal labour rights. This provision **fits well** with a theory of 'citizen privilege' or 'border control supremacy'. It suggests the regime is not fully committed to the 'work' theory where it conflicts with immigration policy. It treats sex work as a 'nuisance to be contained' regarding non-citizens, even if it is 'work' for citizens.
  *   **Zoning Bylaws:** These **fit well** with a nuisance theory but are **underdetermined** regarding the core moral theory. Both a 'work' regime and a 'nuisance' regime can support zoning; the former to protect residential amenity, the latter to contain vice.

  **Administrative Consequences of Theoretical Shift:**
  *   **If shifted to a Nordic Theory:** Section 19 (migrant exclusion) would become redundant (as selling is not a crime for anyone). The Employment Relations Authority would lose jurisdiction over sex work disputes. Police would regain the power to arrest clients.
  *   **If shifted to a Dutch Theory:** Local councils would move from passive bylaw powers (zoning) to active licensing powers (vetting operators). The PRA's OHS provisions would be subsumed into a specific regulatory body for the sex industry, rather than folding it into general employment law.

  ### Synthesis of Hypotheses

  **On the Incitement Analogy:**
  Your intuition that the Nordic model functions like an incitement offence is rhetorically powerful but legally imprecise. It is more accurate to say it functions as a *unilateral* offence based on a theory of *asymmetric moral capacity*. The law does not claim the seller is incited; it claims the seller is *harmed* by the very existence of the buyer's demand. The reason it does not apply to agricultural work is that the Nordic theory relies on a specific conception of sexual integrity that is not transferable to other forms of labour. The regime **strictly presupposes** that sex is not a commodity, whereas other forms of labour are.

  **On the "Liberalisation" Axis:**
  You are correct that "liberalisation" is too blunt. The New Zealand model demonstrates that decriminalisation can coexist with significant state control (zoning, immigration). The "not endorsing" clause is coherent if understood as a political compromise that allows the *operative* machinery of the Act (labour law) to function without requiring the state to make a moral declaration. However, the migrant exclusion reveals that the 'work' theory is subordinate to the 'sovereign border' theory.

  ### What Would Change My Mind

  To maintain intellectual honesty, I must identify where my reconstruction is most vulnerable.

  **1. The Argument That Would Change My Mind on the Nordic Model:**
  If evidence emerged that the drafters of the Swedish law explicitly considered the seller to have full agency but chose to criminalise the buyer solely to reduce market size (a utilitarian demand-reduction strategy) rather than to protect the seller's dignity, my reconstruction of 'asymmetric moral capacity' would collapse. If the seller is viewed as a rational actor who is simply being disincentivised from supplying a harmful good, the regime is not about victimhood but about market suppression. This would align it closer to tobacco control than to protection of the vulnerable.
  *   *Where I might be wrong:* I may be attributing too much philosophical coherence to the drafters. They may have simply adopted the most politically viable compromise between abolitionists and pragmatists, resulting in a statute that looks like a theory of agency but is actually a theory of political management.

  **2. The Argument That Would Change My Mind on the New Zealand Model:**
  My reconstruction relies on the 'work' theory being dominant because of the OHS framework. However, if the Employment Relations Authority systematically refused to hear sex work cases, or if courts routinely interpreted the PRA through the lens of public morality rather than contract law, then the 'work' theory would be merely nominal. If the administrative practice treats the PRA as a 'toleration' regime in disguise (ignoring the labour rights provisions), then my claim that it implements a 'work' theory is false.
  *   *Where I might be wrong:* I am likely overestimating the coherence of the New Zealand statute. The tension between the 'work' framing and the 'migrant exclusion' might not be a fracture between two theories, but evidence that the regime is fundamentally underdetermined, allowing local councils and immigration officers to apply whichever theory suits their immediate administrative convenience.

  **3. On the Incitement Analogy:**
  You stated a strong prior that the incitement analogy is doing more rhetorical work than it can bear. I am inclined to agree, but with a caveat. If the Nordic model were applied to a context where the sellers were demonstrably unionised, high-income, and explicitly asserted their agency without evidence of coercion, and the state *still* prosecuted the buyers solely on the basis of the transaction's existence, then the 'incitement/coercion' theory would fail. In that scenario, the regime would have to be reconstructed as a form of *legal moralism*—punishing the act because it is inherently wrong, regardless of consent. If I were shown that Swedish prosecutors pursue cases where the seller is a wealthy, autonomous contractor explicitly seeking the transaction, I would abandon the 'structural coercion' reconstruction in favour of 'inherent wrongness'.

  In conclusion, the institutional arrangements reveal that 'consent' is not a binary switch in these legal regimes, but a variable that is adjusted to fit the desired administrative outcome. The Nordic model adjusts consent to justify victim protection; the Dutch model verifies consent to justify crime control; the New Zealand model presumes consent to justify labour regulation, except where border control intervenes. The coherence you seek is found not in the statutes' purpose clauses, but in the specific machinery they empower to enforce them.
