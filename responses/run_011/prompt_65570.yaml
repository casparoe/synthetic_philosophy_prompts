  Diagnosis
  You are correct that the columnist commits no internal logical errors; his premises cohere within his racist framework. Your partner is correct that the piece functions as a *reductio*, but the contradiction lies outside the text. You err in treating the essay as a standalone logical proof rather than a pragmatic intervention aimed at the reader's belief system. It proves that the *defense* of generic masculine usage relies on arbitrary distinctions, not that the usage is semantically defective. The asymmetry you identify is not merely rhetorical decoration; it is the locus of the argument.

  What the piece is doing
  Hofstadter's piece is an analogical argument disguised as satire. Its primary audience is not the bigot, but the moderate liberal who finds racism abhorrent but views sexist language as a trivial stylistic preference. The essay constructs a parallel universe where racial exclusion is normalized through the same linguistic mechanisms used to normalize gender exclusion. By mapping the structure of sexist apologetics onto racist apologetics, Hofstadter isolates the form of the argument from its content. The piece exposes that the defenses of the generic masculine—appeals to tradition, claims of inclusivity, dismissal of alternatives as awkward—are structurally identical to defenses of white supremacy. It forces the reader to evaluate the *form* of the justification rather than the familiar content. This technique of defamiliarization makes the invisible visible. Usually, generic masculine usage is transparent; readers skip over the exclusion. By substituting race, the exclusion becomes opaque and jarring. If the reader rejects the racist version because the exclusion is harmful and arbitrary, they must, to remain consistent, reject the sexist version unless they can identify a relevant difference between race and gender in this context. The essay is not merely describing how one faction talked; it is performing a test of moral and logical consistency on the reader. It shifts the burden of proof: instead of feminists proving harm, the defender of generic masculine must explain why race and gender are disanalogous regarding linguistic exclusion. The argument is that there is no such difference, rendering the generic masculine indefensible on these grounds. Ultimately, it reveals that linguistic purity arguments are often covers for social hierarchy.

  Is there a reductio?
  Your partner is right to call it a *reductio*, but you are right to look in vain for internal inconsistency. A traditional *reductio* shows that a proposition leads to a contradiction. Here, the proposition being reduced is not the columnist's claim, but the reader's held combination of beliefs: that racism is wrong, that sexism is tolerable, and that there is no relevant difference between the two cases regarding linguistic exclusion. The inconsistency sits in the reader's commitments. When the reader laughs at the columnist, they acknowledge the absurdity of the racist position. If they then return to accepting the sexist position without further argument, they inhabit a contradiction. The essay makes the implicit explicit: if the logic holds for race, it must hold for gender. Therefore, the *reductio* demonstrates that the standard defenses of the generic masculine are insufficient to distinguish it from racist language. It does not prove the generic masculine is logically impossible, but that holding it while rejecting generic white is intellectually untenable without new premises. The contradiction is pragmatic, not semantic. It reveals that the reader's linguistic intuitions are guided by social norms they refuse to examine. By exposing this gap, Hofstadter forces a choice: either accept the racist language or reject the sexist language. Thus, the inconsistency is in the reader's refusal to apply their own moral standards universally.

  The asymmetry objection
  You argue the piece's force is exhausted by contingent sensitivity, implying it would fail on a reader indifferent to both exclusions. This misunderstands the essay's purpose. The asymmetry is not a bug; it is the lever. Hofstadter exploits the reader's existing moral conviction against racism to generate a new conviction against sexism. It is a persuasive device, but not merely for those who half agree; it is for those who value consistency. If a reader cared more about idiomatic English than exclusion, the essay challenges them to apply that priority consistently or reconsider the priority. The subsequent history of English usage validates the essay's diagnosis. The generic masculine has largely retreated in formal contexts, not because semantics changed, but because social costs became visible. The generic white never existed because the social cost was already recognized. The essay predicts that once the asymmetry collapses, the usage will follow. Therefore, the sensitivity is not a decorative premise but the engine of social change. The essay shows that linguistic norms are not neutral; they are maintained by selective outrage. When the outrage is equalized, the exclusionary language becomes unsustainable. The piece argues that the real consequences you are investigating are produced by this selective sensitivity, making the stylistic defense untenable. The asymmetry does not decorate an independent argument; it constitutes the argument by linking linguistic change to moral progress. The asymmetry is not a weakness limiting the audience, but the specific mechanism by which the argument achieves traction in a non-ideal world.

  What survives for my paper
  For your paper, this essay licenses the claim that the arguments defending the generic masculine are structurally identical to defenses of other exclusionary practices now deemed unacceptable. It supports the view that the generic masculine has real social consequences, specifically the reinforcement of category exclusion, rather than being a merely stylistic matter. However, it does not prove the generic masculine is semantically defective in isolation; a language could theoretically function with it without harm if social asymmetries did not exist. You can claim that the *defense* of the usage relies on bad faith or inconsistency, and that the usage perpetuates harm by rendering women invisible in a way that mirrors racial erasure. Use the essay to demonstrate that the stylistic defense collapses when subjected to cross-category scrutiny, proving the issue is social, not grammatical.
