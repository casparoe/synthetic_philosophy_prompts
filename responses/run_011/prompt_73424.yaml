answer: |-
  You are right to feel that these three practices do not cohere under a theory of *equal opportunity*. If the goal were to neutralize unearned advantage, the identity of the donor (parent vs. stranger) would be irrelevant, the form of the asset (cash vs. stock) would be irrelevant, and the form of the benefit (tuition vs. cash) would be irrelevant.

  The bundle you describe is not generated by a theory of justice for recipients. It is generated by a theory of **rights for donors** combined with a specific metaphysical view of **the family as a pre-political institution**.

  Here is the reconstruction of the implicit theory, the tension analysis, and the luck-egalitarian counterfactual.

  ---

  ### I. The Strict Presuppositions

  To find the theory, we must distinguish what these laws *require* to be true (strict presupposition) from what they merely *allow* (comfortable fit).

  #### (1) Relationship-Based Rates (France/Germany)
  *   **The Practice:** Lower tax for children, higher for strangers.
  *   **Strict Presupposition:** **The Family is a Moral Unit with Special Claims.**
      The state presupposes that individuals have stronger moral obligations to kin than to non-kin, and that the tax system should not impede the fulfillment of "natural" duties (supporting one's offspring) as heavily as it impedes voluntary charity or market exchanges. It treats inheritance not as a windfall to the recipient, but as the **fulfillment of a duty by the donor**.
  *   **Merely Comfortable:** Political feasibility. (It is easier to tax strangers than children, but the law is written as if the *moral status* of the child justifies the rate, not just their voting power).
  *   **Tension:** This explicitly rejects the "unit of justice is a life" view. It asserts the unit of justice is the *lineage*.

  #### (2) Step-Up in Basis (US)
  *   **The Practice:** Unrealized capital gains vanish at death; heir's basis resets.
  *   **Strict Presupposition:** **Tax Liability Attaches to the Person, Not the Asset.**
      This practice presupposes that income tax is a tax on *human agency* (the decision to sell/realize), not on *wealth accumulation* itself. When the agent dies, their capacity to realize gain ceases, so the liability expires. It treats death as an **extinguishment of the taxpayer**, not a **transfer of property**.
  *   **Merely Comfortable:** Avoiding liquidity crises for heirs. (While true, the strict logic is that the gain was never "income" to the heir, and the dead cannot pay).
  *   **Tension:** This contradicts the Estate Tax. The Estate Tax says, "This wealth is moving and should be taxed." Step-up says, "This wealth is dormant and should not be taxed." They coexist only because one taxes the *right to transfer* and the other taxes *income realization*.

  #### (3) Direct Payment Exemption (Tuition/Medical)
  *   **The Practice:** Paying the provider is tax-free; giving cash is taxable.
  *   **Strict Presupposition:** **The Taxable Event is the Transfer of Property Rights, Not the Conferment of Advantage.**
      When you pay a bursar, you are purchasing a service for yourself (which you then allow your child to consume). You retain control over the asset until it is consumed. When you give cash, you transfer *control* (property rights) to the child. The tax code presupposes that **agency over capital** is what constitutes "wealth," not the **utility derived from capital**.
  *   **Merely Comfortable:** Encouraging education/health. (This is the rhetoric, but the legal mechanism is about defining what counts as a "gift").
  *   **Tension:** If the goal were to prevent unfair advantage, paying tuition creates *more* specific human capital advantage than giving cash (which might be spent on beer). The exemption privileges the *form* of the transfer over the *substance* of the advantage.

  ---

  ### II. The Unifying Theory: Liberal Familialism

  Is there a single principle? Yes, but it is not about opportunity. It is **Liberal Familialism**.

  This theory holds that:
  1.  **Private Property is Sovereign:** You own your assets until you voluntarily alienate them (sell them). Death is not a voluntary alienation in the market sense.
  2.  **The Family is Pre-Political:** The nuclear family has a right to continuity that the state must respect, provided it doesn't create a permanent aristocracy (hence the Estate Tax exists at all, but with high exemptions).
  3.  **Freedom of Disposition:** The donor's freedom to choose *how* to benefit others is paramount.

  **How this resolves your tensions:**
  *   **Why (1)?** Because the family is pre-political, the state recognizes a "duty of care" hierarchy. Taxing children heavily is an intrusion into the family unit; taxing strangers is a regulation of civil society.
  *   **Why (2)?** Because property is sovereign, the state cannot claim a share of "paper gains" that the owner never chose to realize. To tax them at death would be to tax the heir for the dead person's inaction.
  *   **Why (3)?** Because freedom of disposition includes the right to spend money on specific goods without transferring sovereignty over the money itself.

  **The Verdict:** The bundle is not an accretion of lobbying (though lobbying cemented it); it is a coherent expression of **Donor-Centric Liberty**. It protects the *giver's* right to prioritize family, hold assets, and spend on specific goods. It is fundamentally indifferent to the *recipient's* starting position.

  ---

  ### III. The Luck-Egalitarian "Starting-Gate" Counterfactual

  If you actually built a transfer tax based on a **Luck-Egalitarian Starting-Gate** view (where justice requires that no one's life prospects be determined by brute luck, including inheritance), the code would look radically different.

  **The Core Principle:** An **Accessions Tax**.
  Tax the *recipient* on all wealth received without labor, aggregated over their lifetime, regardless of source or form.

  **What Survives, What Flips:**

  1.  **Relationship Rates (FLIPPED):**
      *   *Current:* Closer kin = lower tax.
      *   *Luck-Egalitarian:* Closer kin = **irrelevant**.
      *   *New Rule:* The tax rate depends on the **recipient's total lifetime accessions**. If you inherit $10M from your father, you pay the same as if you inherited $10M from a stranger. Better yet: if you already inherited $5M from your mother, the father's $10M is taxed at a higher marginal rate. The goal is to cap total unearned advantage per *life*, not per *transfer*.

  2.  **Step-Up in Basis (FLIPPED):**
      *   *Current:* Death wipes out capital gains tax.
      *   *Luck-Egalitarian:* Death is a **realization event**.
      *   *New Rule:* "Deemed Realization." At death, the estate is treated as having sold all assets at market value. Capital gains tax is paid by the estate *before* distribution. This prevents the permanent sheltering of wealth through the "buy, hold, die" strategy.

  3.  **Direct Payment Exemption (FLIPPED):**
      *   *Current:* Tuition/medical payments are tax-free.
      *   *Luck-Egalitarian:* **Benefit Principle.**
      *   *New Rule:* Any transfer of economic value, whether cash or in-kind, is an accession. If you pay $100k in tuition, that is $100k of unearned advantage conferred on the child. It counts toward their lifetime accession total. To do otherwise is to allow the wealthy to bypass the tax by purchasing human capital directly.

  **The Resulting Code:**
  *   **Tax Subject:** The Recipient (not the Estate).
  *   **Tax Base:** Lifetime sum of all gifts and inheritances (cash + in-kind + realized gains).
  *   **Exemption:** A modest "starting gate" grant (e.g., the first $500k is tax-free to ensure everyone has some capital).
  *   **Rate:** Progressive marginal rates on receipts above the grant.

  **The Feature That Makes It Unpassable:**
  **The Abolition of the Family Exemption.**

  A luck-egalitarian code must treat a transfer from a parent identically to a transfer from a stranger. This is politically toxic because it violates the **Liberal Familialist** intuition that parents have a special right to advantage their children.

  Furthermore, the **In-Kind Taxation** (taxing tuition payments) requires the state to evaluate the monetary value of every benefit a parent confers on a child (private schooling, networking introductions, living rent-free in a parental condo). This requires an level of **administrative intrusion into the private family sphere** that is incompatible with liberal democracy. It turns the state into an auditor of family life.

  **Summary:**
  The current system presupposes that **the family is a private sovereign zone** and **property rights die with the person**.
  The luck-egalitarian system presupposes that **opportunity is a public resource** and **advantage is taxable regardless of source**.
  The tension is not resolvable because one view prioritizes the **Donor's Liberty**, and the other prioritizes the **Recipient's Equality**. The current code chooses Liberty.
