  hey — I'm a backend engineer, no philosophy training at all, and instead of sleeping I've been falling down a rabbit hole on split-brain patients. I've talked myself into a position and I want someone to check whether it actually hangs together, because I'm pretty sure I'm being sloppy somewhere and I can't see where.

  here's what I believe:

  (1) I'm a physicalist. Consciousness is whatever the brain does, there's nothing extra in there.

  (2) when the corpus callosum is cut and you get those results — one hand buttoning the shirt the other hand is unbuttoning, or the two sides giving different answers to the same question — I take that as showing there are literally two subjects in one skull, two streams of experience running at once.

  (3) but I also think the unity in an ordinary intact brain is way shakier than it feels from the inside. the interpreter thing in the left hemisphere making up reasons after the action already happened, lots of parallel modular processing that never gets pooled, the sense of being one thing being partly a story the system tells about itself. so "one unified consciousness" in a normal person is not the brute fact it seems to be.

  (4) what makes me the same person over time is psychological continuity, not the particular matter I'm made of.

  (5) a callosotomy patient is obviously still one person. they go home, their family doesn't experience them as replaced, and I'd find it genuinely horrible to say someone became two people because of a surgery.

  (6) I'm not sure but I lean toward: in borderline cases there might just be no determinate answer to how many subjects there are, the way there's no fact about exactly when a heap stops being a heap.

  (7) my day job frame, which is maybe the thing I'm most attached to: when a cluster gets network partitioned we call that split-brain too, and what always strikes me is that from the outside its still one system with one name. it has two nodes holding inconsistent state and two things claiming to be leader, but nobody says the partition created a second database. I think that's roughly what's going on in the head as well, and I like it because it seems to make the counting question go away instead of answering it.

  so — which of these actually conflict with which, ordered by how bad the conflict is rather than dumped on me all at once? for each real one, what's the cheapest thing I could give up, and what do I lose by giving it up? I'd also like to know if any pair that looks contradictory to me actually isn't, because I have a feeling I'm panicking about at least one of these for no reason and I want to know which. and please be specific about (7): is the partition analogy doing real work, or is it just comfortable and quietly importing an assumption I need? if there's one single change to the list that would clean up the most damage at once, tell me which and say why it beats the alternatives.

  no headings, no bullet points, no bold, no tables — just continuous prose like an email back to a coworker. long paragraphs are fine, I'm not in a hurry.
