answer: |-
  Welcome to this workshop. We gather mathematicians, philosophers, students, and supporters to examine a specific solution to Einstein's field equations and its consequences for our understanding of time. The room contains deep expertise and genuine curiosity. Both are required for the work ahead.

  It is appropriate that we meet on a strict schedule. We have divided these two days into distinct sessions, assuming one follows another in a fixed order. Our subject matter questions whether that order is fundamental to reality or merely a feature of our perspective. I trust the catering will respect this temporal uncertainty less than the speakers do.

  In 1949, Kurt Gödel published an exact solution to the field equations of general relativity. He described a universe filled with pressureless dust in uniform rotation, balanced by a negative cosmological constant. This rotation has no centre and no axis. Every point of that universe is turning, yet nothing is being turned around. It is a coherent mathematical model consistent with the laws of physics as then understood.

  Through every point of this solution passes a closed timelike curve. An observer can set out along a permissible path and arrive back before departure. This is often confused with the absence of a global time ordering, but they are distinct claims. The existence of loops into the past is a feature of specific paths. The absence of a global time ordering means there is no way to slice reality into successive presents. You cannot define a universal now that separates a fixed past from an open future. The loops demonstrate the failure of the slicing. The headlines focus on the loops. The philosophical inference rests on the slicing.

  Gödel calculated the cost of such a voyage in speed and energy. He judged it absurd. His argument never rested on anyone actually reaching the past. It rested on the fact that the same equations governing our universe admit a world with no objective lapse of time. He inferred from the admissibility of such a world that objective becoming is not a feature of physical reality anywhere, our world included.

  Einstein's reply pressed the other end of the argument. He questioned whether a universe of that kind is physically realizable at all. Nothing in the sky has since shown any sign of large-scale rotation. Our universe is not Gödel's. The argument must therefore run on possibility rather than on fact. Whether such a possibility carries any weight at all is the first thing these two days will fight about.

  This brings us to the central tension of the workshop. One position holds that extracting metaphysics from exotic solutions is a category mistake. On this view, models of the field equations are not candidate worlds. What matters is which conditions on energy, boundaries, and initial data our universe actually satisfies. If a solution violates those conditions, it tells us nothing about the nature of time in reality.

  The opposing position holds that relativity dispenses with objective becoming even in perfectly well-behaved, non-rotating models. On this view, Gödel's conclusion is stronger than Gödel's own route to it. The rotating solution merely highlights a structural feature already present in the theory. The absence of a preferred time slicing in any relativistic model undermines the idea of an objective flow, regardless of rotation or closed curves.

  These views do not merely disagree about the answer. They disagree about what kind of question the workshop is asking. Both readings are legitimate. Both deserve the same rigor. We are here to test the inferential bridge between mathematical structure and physical metaphysics. We are gathered to determine how far mathematical possibility can dictate the structure of physical reality.

  We will not discuss whether time travel is possible. That is a question for engineers and science fiction. We are concerned with what the existence of the possibility implies about the actual. We must keep the mathematics precise and the metaphysics honest. If we skate past the observational point, we lose the physicists. If we ignore the modal argument, we lose the philosophers.

  The work requires us to navigate between physical constraint and ontological commitment. We must avoid slogans about illusion. We must avoid nicknames for temporal structures. We must speak plainly about what the equations allow and what the world shows.

  So I put this question to the room for the next two days. What criteria determine when a solution's structure dictates the metaphysics of the actual world?
