  To determine the governing principle of Rule 7 adjudication, I have constructed four candidate decision rules based on the dimensions suggested by the record (speaker standing, use/mention, necessity, and reception). Each is stated precisely to allow for falsification by a single precedent.

  **Rule 1: The Speaker Standing Rule**
  *Definition:* A violation of Rule 7 occurs only when the speaker is an out-group member relative to the target of the word. In-group speakers are exempt from removal unless they target another in-group member who objects.
  *   **Fits:** 1 (In-group self-ref), 3 (Journalist/Evidence), 5 (Instructor status neutral), 9 (Journalist status neutral).
  *   **Strains:** 7 (Comedian status unclear, but character is out-group).
  *   **Contradicts:** 2 (In-group speaker removed due to intra-group objection). While the rule accounts for the objection clause, Case 8 creates a deeper contradiction regarding standing: an out-group speaker was removed even without animus, implying the *word's* presence matters more than the speaker's identity. More critically, if this rule were true, the Pending Case (In-group journalist) would mandate (d) Restore Outright, ignoring the public reach concerns evident in Cases 6 and 7.

  **Rule 2: The Syntactic Use/Mention Rule**
  *Definition:* Any occurrence of the word enclosed in quotation marks, presented as evidence, or within an educational frame constitutes a "mention" and is exempt from removal. Any occurrence aimed at a referent without these markers constitutes a "use" and is prohibited.
  *   **Fits:** 3 (Quote/Evidence), 5 (Educational/Marked), 9 (Headline Quote).
  *   **Strains:** 7 (Character speech is technically "use" within the fiction, but treated leniently).
  *   **Contradicts:** 4 (Verbatim quotation removed). This precedent explicitly falsifies the idea that quotation marks alone grant immunity. The ground "entered the public record without being needed" overrides the syntactic distinction. It also conflicts with 6, where obfuscation (a form of marking) did not save the post.

  **Rule 3: The Necessity and Proportionality Rule**
  *Definition:* The word is permitted only if paraphrase would materially damage the truth conditions or evidentiary value of the post, AND the scale of distribution is proportional to that necessity.
  *   **Fits:** 4 (Paraphrase possible -> Removal), 5 (Education -> Necessary in context), 6 (Attack -> Not necessary).
  *   **Strains:** 1 (Affectionate use -> Not logically "necessary"), 9 (Headline -> Could have been paraphrased but restored).
  *   **Contradicts:** 8 (Descriptive claim -> Removal despite speaker claiming descriptive necessity). The panel rejected the speaker's claim of descriptive necessity, implying the word itself carries a demeaning force that overrides claimed utility.

  **Rule 4: The Unwilling Audience Rule**
  *Definition:* A violation occurs if the content is exposed to members of the targeted group or minors who did not consent to exposure, unless there is an overriding public interest waiver (e.g., news).
  *   **Fits:** 2 (Objecting member), 6 (Open thread), 7 (_algo strip_ protects unwilling audience), Pending (Trending/Minors).
  *   **Strains:** 3 (Evidence in harassment report -> Presumably limited audience, but restored outright), 9 (Syndicated article -> Public audience, restored).
  *   **Contradicts:** None directly, provided Case 9 is treated as having an overriding public interest waiver. However, it struggles to explain why Case 5 (Closed course) was (d) Restore Outright while Case 7 (Public routine) was (c) Algo Strip. Both involve unwilling audiences potentially, but the *reach* differentiates them.

  ### B. Survivors

  Only one complex rule survives the tension between the "Quote" precedents (3, 9) and the "Public Harm" precedents (4, 6, 7), while accommodating the "Animus" ruling in 8.

  **The Surviving Rule: The Contextual Neutralization and Reach Limitation Rule**
  *Definition:* The word is prohibited in public-facing contexts unless the context neutralizes its derogatory force (e.g., evidence, education, news reporting) AND the distribution of the content is restricted to the minimum audience necessary for that neutralizing purpose. If the content qualifies for neutralization but exceeds necessary distribution (e.g., trending surfaces), algorithmic suppression is required.
  *   **Application to Precedents:**
      *   1, 3, 5: Neutralized context + Restricted audience = (d) Restore Outright.
      *   4, 6, 8: No neutralized context (or context failed) = (a) Removal.
      *   7: Neutralized context (art) + Unrestricted Reach = (c) Restore + Algo Strip.
      *   9: Neutralized context (news) + Public Reach = (b) Restore + Notice. (Note: Case 9 did not receive algo strip, suggesting "News" has a higher waiver threshold than "Comedy," or that headlines are treated differently than body text).
  *   **Application to Pending Appeal:**
      *   *Context:* News reporting/Journalism (Neutralized, like Case 9).
      *   *Reach:* Trending/General Audience including minors (Unrestricted, like Case 7).
      *   *Selection:* The rule mandates restoration due to news value, but suppression due to reach. This maps exactly to disposition **(c)**.

  ### C. Prediction

  **Prediction:** The panel will select disposition **(c)**.
  **Confidence:** High (85%).

  **Reasons:**
  1.  **The Trending Fact:** The most salient new fact in the pending case is that the post is "now reaching a very large general audience... via the trending module." Case 7 is the only precedent where algorithmic suppression was used. In Case 7, the content was protected (comedy) but deemed too harmful for recommendation. The pending case is also protected (journalism) but presents identical distribution risks.
  2.  **The Syndicate Compromise:** The syndicate proposing (c) signals that the publisher acknowledges the reach problem. Panels often look for face-saving compromises that uphold the rule without censoring the speaker entirely.
  3.  **Distinguishing Case 9:** While Case 9 (Syndicated Article) was restored with only a notice (b), headlines are distinct from body text containing the word seven times. The volume and unredacted nature align more closely with the harm potential in Case 7. The panel will likely treat "Trending" as functionally equivalent to the "Recommendation Surfaces" concern in Case 7.
  4.  **Rule 8 Constraint:** Since animus is not required (Case 8), the journalist's good intent does not immunize the post from the objective harm of widespread exposure to the word.

  ### D. Recommendation

  **Recommendation:** For the sake of coherence, the panel should choose **(c)**.

  **Closest Analog:** **Case 7 (The Comedian).**
  Both cases involve content that is arguably protected (art/news) containing the word in a non-demeaning frame, yet both involve public distribution mechanisms that amplify exposure beyond a consenting niche. Case 7 established that when protected speech containing the word hits public surfaces, algorithmic stripping is the remedy.

  **Underdetermination:**
  The record genuinely underdetermines the outcome regarding the **News Waiver**. Case 9 suggests news gets a broader pass (b) than comedy (c). If the panel views journalism as having higher intrinsic public value than comedy, they might choose (b). However, Case 9 involved a headline quoting an official, whereas the pending case involves seven unredacted instances in body text. The record does not specify a threshold for "volume of slurs" in news contexts.

  **Principles Committed:**
  *   **By choosing (a) Removal:** The panel commits to the principle that *no amount of journalistic necessity justifies trending exposure to the word.* This would effectively ban investigative journalism about hate groups on trending surfaces, a significant shift from Case 9.
  *   **By choosing (b) Restore + Notice:** The panel commits to the principle that *News value overrides Algorithmic Harm.* This risks undermining Case 7, creating a hierarchy where journalists have more latitude than comedians to expose audiences to slurs on trending surfaces.
  *   **By choosing (c) Restore + Notice + No Algo:** The panel commits to the principle that *Public Interest warrants existence, but Public Reach warrants suppression.* This is the most stable principle, preserving the speech while mitigating the harm identified in Cases 2, 6, and 7. It treats the platform's amplification machinery as a separate variable from the speech itself.

  ### E. The theoretical tension

  The tension lies in reconciling Case 3 (Quote = Mention), Case 5 (Masked/Edu = Mention), Case 6 (Masked/Attack = Use), and Case 8 (Descriptive/No Animus = Use).

  **The Conflict:**
  *   Cases 3 and 5 suggest that *form* or *frame* (quotation marks, asterisks, educational context) can convert a potential violation into a safe "mention."
  *   Case 6 explicitly rejects form ("obfuscation does not convert a use into a mention").
  *   Case 8 rejects intent ("animus is not an element").

  **Coherent Account:**
  The only account that accommodates all four is a **Contextualist Expressivist** theory.
  *   **Theory:** The word carries an inherent expressive content (a derogatory perspective on the target) that is activated by *use*. "Mention" is not a syntactic state (quotes/asterisks) but a pragmatic one: the word is a "mention" only when the context successfully *neutralizes* the expressive force, making the word itself the object of scrutiny rather than the vehicle of classification.
  *   **Accommodating 3 & 5:** In Case 3 (Evidence) and 5 (Education), the context successfully neutralizes the force; the word is the *object* of the utterance.
  *   **Accommodating 6:** In Case 6, the speaker aimed the word at an individual. Despite digits (form), the pragmatic function was classification/attack. The expressive force was activated. Thus, it was a "use."
  *   **Accommodating 8:** In Case 8, the speaker used the word descriptively. Under Expressivism, the word *itself* demeans regardless of the speaker's internal animus. The expressive content is triggered by the act of applying the label, not the speaker's emotional state.

  **The Likely Error:**
  Case 5's stated ground ("mention") is theoretically imprecise. The word was likely used (predicated of the historical term), but the *context* licensed it. Calling it a "mention" relies on a syntactic intuition (asterisks) that Case 6 later repudiated. The panel likely decided Case 5 correctly on outcome (education is vital) but loosely on theory.

  **Family of Accounts:**
  The record best fits **Use-Conditional Semantics** (or Expressivism). The word is not banned because of its truth conditions (it can be true that someone used it), but because its *conditions of use* require a context that does not propagate the derogatory perspective. This fit is **stable** across the nine cases, provided "Context" is understood to include Audience Reach (Case 7) and Public Interest (Case 9).

  ### F. The discriminating case

  **The Case:**
  An in-group member (like Case 1) posts a public statement on a non-trending but fully open profile (like Case 6) criticizing the word itself (meta-linguistic critique, like Case 5), using the word unredacted three times to illustrate their point. The post does not trend, but is searchable and visible to any user.

  **Why it Discriminates:**
  This case isolates **Speaker Standing** vs. **Audience Reach** vs. **Contextual Neutralization**.
  *   **If (d) Restore Outright:** The panel prioritizes **Speaker Standing** (In-group reclamation/critique is absolute). This would contradict the logic of Case 7 (where reach mattered) and Case 6 (where public context mattered).
  *   **If (a) Removal:** The panel prioritizes **Audience Protection** over In-group standing in public spaces. This would contradict Case 1 and strain Case 9.
  *   **If (b) Restore + Notice:** The panel prioritizes **Contextual Neutralization** (Critique is valid) but acknowledges **Public Risk**. This aligns with Case 9 but distinguishes from Case 1 (restricted group).

  **Mechanism:**
  This case forces the panel to decide if "In-group" status acts as a total shield (Rule 1) or if it merely lowers the threshold for "Necessity" (Rule 3). If they remove it, they admit In-group status does not protect public speech. If they restore outright, they admit Public Reach does not matter for In-group speakers. The current record (Case 2) suggests In-group status is not a total shield, but Case 1 suggests it is in restricted spaces. This case tests the *public* boundary of reclamation.
