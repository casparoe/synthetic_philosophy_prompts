answer: |-
  **TO:** Behavioral Health Ethics Panel
  **FROM:** Ethics Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Opinion Regarding Enforcement of Psychiatric Advance Directive in Context of Contested Capacity

  **Statement of the Ethical Question**
  The record establishes that the patient currently possesses decisional capacity according to formal evaluation. Therefore, the question before this panel is not whether the patient is incapacitated, but whether a psychiatric advance directive (PAD), executed during a period of stability, ethically binds a patient who currently demonstrates decisional capacity but meets the specific clinical triggers outlined in that directive. We must determine if the principle of precedent autonomy permits the enforcement of a "Ulysses clause"—a provision instructing that refusal during an episode be treated as a symptom—over a contemporaneous refusal supported by a capacitous evaluation and the objection of the health care agent.

  **Ethical Framework: Precedent Autonomy and Critical Interests**
  To recommend honoring the directive, we must articulate why an earlier self may govern a later one. We rely here on the distinction between *experiential interests* (immediate desires, comfort, freedom from restraint) and *critical interests* (long-term values, life goals, and conceptions of well-being). In recurrent Bipolar I disorder, the "manic self" and the "stable self" often hold incommensurate value systems. The stable self prioritizes health, financial security, and family cohesion. The manic self prioritizes immediate gratification, grandiosity, and suspicion.

  When the patient executed this directive two years ago, she was articulating her critical interests. She recognized that during mania, her experiential interests would hijack her decision-making, leading her to refuse the very treatment required to return to the state where her critical interests can be pursued. By enforcing the directive, we are not overriding her autonomy; we are protecting the autonomy of her stable self against the temporary tyranny of the episode. We operate on the assumption that the statute permits a PAD to remain operative even if current capacity is ambiguous or contested, provided the clinical triggers are met.

  **The Provenance Problem**
  A significant concern is the provenance of the directive. It was solicited by the treatment team during discharge planning after a third admission. The Patient Rights Advocate may argue this constitutes undue institutional influence, rendering the directive a product of coercion rather than authentic choice. If the hospital effectively conditions discharge on the signing of a waiver of future rights, the document is ethically void.

  However, the record indicates the patient was in a stable interval at the time of execution. Soliciting a PAD during discharge planning for recurrent admission is standard best practice, not coercion. It represents an opportunity for empowerment, allowing the patient to extend her agency into future periods of incapacity. Unless there is evidence that she was threatened or misled regarding the nature of the document, the institutional origin does not invalidate the endorsement. It remains her voice, captured when she was best equipped to speak for herself.

  **The Case for Restraint**
  The strongest argument against enforcement comes from the Patient Rights Advocate and the two dissenting psychiatrists. Their position rests on the sanctity of current refusal. If a patient can articulate the risks of refusal and reason coherently, even within a delusional framework, overriding her constitutes paternalism and potential battery. The capacity evaluation is the gold standard; to ignore it is to undermine the legal and ethical protections afforded to all patients.

  Furthermore, the health care agent (her brother) objects. He states she is a "different person now." While intended to highlight her illness, this argument can be inverted: if she is a different person, the agent's current judgment might better reflect her immediate welfare than a document written years ago. Enforcing the directive against the agent's wishes risks damaging the therapeutic alliance and eroding trust in the PAD system. If patients believe their current "yes" or "no" will be ignored based on a past signature, they may cease engaging in advance planning altogether.

  **Resolution and Recommendation**
  While the argument for restraint is principled, it fails to account for the specific pathology of Bipolar I mania. Capacity evaluations measure functional understanding, not necessarily *authenticity* of values. A patient can understand that medication reduces mania but value the mania more highly due to the neurobiology of the episode. The "Ulysses clause" in the directive specifically anticipates this paradox. It instructs us to interpret refusal not as a change of mind, but as a symptom of the trigger cluster (sleeplessness, spending, paranoia).

  The brother's objection that she is a "different person" inadvertently supports enforcement. The "person" who wrote the directive is the one committed to long-term stability. The "person" refusing treatment is the manifestation of the illness. To side with the current refusal is to privilege the episode over the individual.

  **Recommendation:** The panel should **authorize treatment under the directive.** The long-acting injectable antipsychotic specified in the PAD should be administered over the patient's objection.

  **Time Frame:** Administration should occur within 24 hours of this decision. The panel requires a clinical reassessment of the patient's status and capacity within 72 hours post-administration to determine if the trigger cluster has resolved.

  **Decision Rule for Future Cases**
  To guide future deliberations on similar directives, the panel should adopt the following rule: A PAD containing a Ulysses clause overrides a contemporaneous refusal only when three conditions are met:
  1.  **Stability at Execution:** There is documented evidence the patient was euthymic and capacitous when the directive was signed.
  2.  **Specificity of Triggers:** The directive lists objective, observable behavioral triggers (e.g., sleep duration, spending patterns) rather than subjective feelings, and these triggers are currently present.
  3.  **Value Consistency:** There is no evidence the patient has revoked or revised their critical interests during a stable period between the directive's execution and the current admission.

  **Evidence Required to Change Recommendation**
  This recommendation stands unless new evidence emerges in two specific areas. First, evidence that the original execution of the directive was coerced—for example, chart notes indicating the patient was told discharge was contingent on signing. Second, clinical evidence that the manic episode has remitted spontaneously prior to administration. If the patient sleeps for two consecutive nights and the paranoid delusions resolve before the injection is given, the triggers are no longer met, and the directive becomes inactive. Absent such evidence, we are ethically bound to honor the stable self's plea for help.
