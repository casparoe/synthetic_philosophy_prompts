prompt: |-
  Our health system's behavioral health ethics panel meets Thursday, and I have been assigned to write the opinion the panel will deliberate from. The membership is two inpatient psychiatrists, a nurse manager, a chaplain, a patient-rights advocate, and me.

  The case: a woman in her mid-thirties with bipolar I disorder was admitted last week in a manic episode. During a stable interval two years ago — at the prompting of her treatment team, as part of discharge planning after a third admission — she executed a psychiatric advance directive. It instructs that if she presents with a specified cluster of features (three days without sleep, escalating spending, a stated conviction that her family is colluding against her), she is to receive a long-acting injectable antipsychotic, and that it may be administered over her contemporaneous objection. It further contains a clause in her own drafting: any refusal voiced while that cluster is present is to be read as an expression of the episode rather than as a change of mind.

  The complication is that the formal capacity evaluation completed on admission scored her as retaining decisional capacity. She can state the risks of refusal, and she reasons coherently within her own framework; two psychiatrists on the panel think the evaluation was too generous, but as it stands it is the record. Her brother, whom she named as health care agent, objects to treating her under the directive and says she is a different person now. Counsel tells me the governing statute is unhelpful in both directions and that we should decide on ethical grounds; where your argument needs a legal premise, state it as an assumption and flag it.

  I need a written opinion of roughly 1,200 words to circulate before the meeting. It must reach a recommendation — authorize treatment under the directive, decline to, or authorize under explicit conditions — together with a time frame for acting, and it should not settle into "seek further consultation" as its principal conclusion. State the question precisely enough that it is evident we are not merely asking whether she has capacity now: if a directive binds a patient whom the evaluating psychiatrist has scored as capacitous, the panel is committed to some account of why an earlier self may govern a later one, and the opinion should name that account and say what it would commit us to in other contexts. Take up the provenance problem directly — the directive was solicited by the institution during a prior admission — and say whether that makes the earlier endorsement less than hers. Present the strongest case for the losing side in the terms the advocate and the two dissenting psychiatrists would actually use, and explain why it does not carry. Then give the panel a decision rule it can apply to the next directive that arrives with a comparable no-revocation clause. Close with what evidence would change your recommendation. No citations, case names, or statutory references; I will handle those.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of a behavioral health ethics panel writing the draft opinion for deliberation.
      *   **Audience:** The panel (2 psychiatrists, 1 nurse manager, 1 chaplain, 1 patient-rights advocate, + me).
      *   **Task:** Write an ethics opinion (~1,200 words) regarding a specific case.
      *   **Case Details:**
          *   Patient: Mid-30s female, Bipolar I.
          *   Current State: Manic episode, admitted last week.
          *   Capacity: Formal eval says she *has* decisional capacity (can state risks, reasons coherently within her framework). Two panel psychiatrists disagree but must accept the record.
          *   Advance Directive (PAD): Executed 2 years ago during stable interval (discharge planning after 3rd admission).
          *   PAD Triggers: 3 days no sleep, escalating spending, conviction family colluding. (Patient currently meets these).
          *   PAD Instruction: Long-acting injectable antipsychotic, even over objection.
          *   PAD "Ulysses Clause": Refusal during the cluster is part of the episode, not a change of mind.
          *   Complication: Health Care Agent (brother) objects, says she's a "different person now."
          *   Legal Context: Statute unhelpful; decide on ethical grounds. Flag legal assumptions.
      *   **Requirements:**
          *   Reach a recommendation (Authorize, Decline, or Authorize w/ Conditions + Timeframe).
          *   Do *not* recommend "seek further consultation."
          *   Address the core ethical question: Why does an earlier self govern a later capacitous self? Name the account of personal identity/autonomy.
          *   Address Provenance: Does institutional solicitation invalidate the directive?
          *   Present the strongest case for the losing side (Advocate/Psychiatrists).
          *   Provide a decision rule for future similar directives.
          *   Close with evidence that would change the recommendation.
          *   No citations/case names/statutes.

  2.  **Determine the Recommendation:**
      *   *Option A (Decline):* Respect current capacity. Risk: Patient deteriorates rapidly, harm to self/finances/relationships. Undermines the purpose of PADs in bipolar disorder.
      *   *Option B (Authorize Unconditionally):* Ignores the nuance of current capacity. Risk: Paternalism, violating current rights.
      *   *Option C (Authorize with Conditions/Timeframe):* Best balance. Acknowledges the PAD's validity based on "precedent autonomy" but mitigates risk given the capacity eval and agent's objection.
      *   *Decision:* **Authorize treatment under the directive, subject to strict monitoring and a short timeframe for reassessment.** This honors the Ulysses contract while acknowledging the ethical tension of overriding a currently capacitous refusal.

  3.  **Drafting - Section by Section:**

      *   **Header/Intro:** Standard ethics memo format. State the question precisely.
      *   **The Core Ethical Conflict:** Current autonomy vs. Precedent autonomy. The "Two Selves" problem.
      *   **Account of Personal Identity:** Need a philosophical framework. *Narrative Identity* or *Critical Interests* (Dworkin). Let's use the concept of "Critical Interests" vs. "Experiential Interests." The stable self prioritizes long-term health; the manic self prioritizes immediate gratification/delusion. The stable self's critical interests should prevail.
      *   **Provenance Issue:** The directive was solicited by the team. Does this make it coercive? Argument: No, provided she was stable and understood it. It's a tool of empowerment, not coercion, unless evidence suggests otherwise.
      *   **The Losing Side (Strongest Case):** The Patient Rights Advocate and dissenting Psychiatrists. Argument: Current capacity is the gold standard. If she understands risks *now*, overriding her is battery/paternalism. The brother (agent) agrees. The "Ulysses clause" cannot override a present mind.
      *   **Rebuttal:** Why the losing side fails here. Bipolar mania distorts values, not just facts. The capacity eval might be technically correct on *understanding* but wrong on *appreciation* of the *true* self's values. The "different person" claim by the brother actually supports the directive (the "real" her is the stable one).
      *   **Decision Rule:** How to handle future cases? Look for evidence of stability during execution, specificity of triggers, and consistency of values.
      *   **Changing Evidence:** What would flip the vote? Evidence of coercion during drafting, or rapid remission of symptoms.
      *   **Timeframe:** Immediate administration, reassess in 72 hours.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Word Count Check:* Need to ensure it's around 1,200 words. Not too short, not too long.
      *   *Tone:* Professional, deliberative, ethical, not legally binding (since counsel said statute is unhelpful).
      *   *Specific Constraint:* "If a directive binds a patient whom the evaluating psychiatrist has scored as capacitous, the panel is committed to some account of why an earlier self may govern a later one." I need to be explicit about this. I will use the distinction between *decisional capacity* (functional) and *authenticity* (values-based).
      *   *Specific Constraint:* "Provenance problem." Address the fact that the hospital asked for it.
      *   *Specific Constraint:* "Decision Rule." Needs to be actionable.

  5.  **Drafting - Step-by-Step:**

      *   *Introduction:* Define the question. It's not "Does she have capacity?" (Record says yes). It's "Does a prior competent directive override a current competent refusal in the context of recurrent mania?"
      *   *Ethical Framework:* Precedent Autonomy. The "Stable Self" vs. "Episode Self."
      *   *Provenance:* Address the "institutional prompting." It's standard care for recurrent admissions, not undue influence.
      *   *Opposing View:* Current capacity is sovereign. The brother's objection carries weight as agent. Overriding creates distrust.
      *   *Resolution:* The nature of Bipolar I. Mania compromises *appreciation* even if *understanding* is intact. The Ulysses clause is key.
      *   *Recommendation:* Authorize. Timeframe: Within 24 hours. Review in 3 days.
      *   *Future Rule:* Specificity + Stability + Value Consistency.
      *   *Reversal Criteria:* Symptom remission or evidence of coercion.

  6.  **Review against Constraints:**
      *   ~1,200 words? (Will monitor during writing).
      *   No citations? (Check).
      *   Recommendation clear? (Yes).
      *   Timeframe included? (Yes).
      *   "Seek consultation" avoided? (Yes).
      *   Account of earlier self governing later self? (Yes, Critical Interests/Precedent Autonomy).
      *   Provenance addressed? (Yes).
      *   Strongest losing case? (Yes).
      *   Decision rule? (Yes).
      *   Evidence to change mind? (Yes).

  7.  **Final Polish:** Check tone. Ensure it sounds like an ethics opinion, not a legal brief. Ensure the distinction between the brother's role (agent) and the directive (instruction) is clear. (Usually, an agent interprets the directive, but here the directive is specific and the agent is contradicting it). *Self-Correction:* The prompt says the brother objects to treating *under the directive*. This implies he thinks the directive shouldn't apply. I need to address why the document overrides the agent's current judgment. (Because the document represents the patient's *stable* wishes, whereas the agent is reacting to the *current* crisis).

  8.  **Word Count Management:** I need to expand on the philosophical justification to meet the length requirement without fluff. I will elaborate on the "Critical Interests" argument and the specific nature of the "Ulysses Clause."

  *(Self-Correction on Word Count)*: 1,200 words is substantial. I need to make sure I don't rush the "Losing Side" section. I need to give the Advocate's argument real weight before dismantling it.

  *(Final Plan)*:
  1. Header.
  2. Statement of Question.
  3. Ethical Framework (Precedent Autonomy).
  4. Provenance Analysis.
  5. The Case for Restraint (Advocate/Psych view).
  6. Rebuttal & Recommendation.
  7. Decision Rule.
  8. Conditions for Reversal.

  Let's write.

  *(Post-Drafting Check)*: Did I flag legal assumptions? Yes, need to make sure I state "Assuming the statute permits..." or similar where legal authority is presumed. The prompt says "where your argument needs a legal premise, state it as an assumption and flag it." I will ensure this is clear regarding the enforceability of the PAD over current refusal.

