      *   **Context:** Going through the Character and Fitness (C&F) process. Noticed tensions between the stated purpose (consumer protection/harm prevention) and the actual practice (broad disclosure, honor-based sanctions, publicity sensitivity, admission vs. discipline asymmetry).
      *   **The Core Question:** What theory of occupational licensing does the current C&F and disciplinary practice *strictly presuppose* vs. what it is merely *consistent with*?
      *   **Candidate Theories Provided:**
          1.  Devlinian (Profession as a moral community/self-preservation).
          2.  Hartian (Harm principle only).
          3.  Epistemic/Screening (Disclosure as a signal; concealment destroys the signal).
          4.  Role-Morality/Fiduciary (Asymmetric trust requires exclusionary willingness).
          5.  State Franchise/Monopoly (Legitimacy depends on general standing).
      *   **Specific Sub-Questions:**
          *   Does it require a shared morality (Devlin)?
