answer: |-
  This is a precise and deeply felt jurisprudential puzzle. You have identified a gap between the *nominal* rationale of bar regulation (consumer protection/harm prevention) and its *operational* logic (reputation management/ gatekeeping). To answer your question, we must distinguish between theories that merely *accommodate* the practice and those the practice *requires* to make sense of its specific contradictions.

  Here is an analysis of the theoretical presuppositions of the Character and Fitness (C&F) and disciplinary regime you describe, distinguishing between what is strictly necessary and what is merely consistent, followed by the counterfactual Hartian constraint and the vulnerabilities of this reconstruction.

  ### I. Strict Presuppositions vs. Mere Consistency

  To determine what the practice *strictly presupposes*, we must look for features of the regime that would be incoherent or unintelligible under a given theory. If a theory can explain the regime but does not *require* its specific idiosyncrasies (like the publicity gradient), it is merely consistent. If the regime collapses without the theory, the theory is presupposed.

  **1. The Devlinian Account (Shared Morality)**
  *   **Verdict:** **Ruled Out.**
  *   **Reasoning:** A strict Devlinian account requires a substantive, shared morality whose enforcement is necessary to prevent the disintegration of the society (or profession). You note correctly that the modern bar is heterogeneous and disagrees on contested moral questions. If the bar presupposed a thick Devlinian morality, the disciplinary rules would define specific moral virtues (e.g., chastity, religious observance, specific political loyalties) rather than abstract concepts like "honesty" or "prejudice to justice."
  *   **Consistency:** The regime is *consistent* with a "thin" Devlinianism where the shared morality is simply "obedience to the rules." However, the practice does not *presuppose* a shared moral ontology. It presupposes a shared *interest*, not a shared *conscience*.

  **2. The Hartian Account (Harm Principle)**
  *   **Verdict:** **Strictly Ruled Out.**
  *   **Reasoning:** This is the most critical finding. A strict Hartian constraint permits regulation only to prevent harm to others.
      *   **The Publicity Gradient:** Under a harm principle, the harm caused by a lawyer's off-duty conduct is invariant to whether a newspaper reports it. If the sanction changes based on publicity, the regulator is valuing *reputation* over *harm*. This feature is incoherent under strict Hartianism.
      *   **Nondisclosure vs. Underlying Act:** If the underlying act caused no harm (or insufficient harm to discipline), punishing the concealment more aggressively implies the wrong is the *frustration of the regulator's epistemic access*, not the risk to a client. This violates the harm principle.
      *   **Conclusion:** The practice cannot exist under a strict Hartian framework. The official comment repudiating "moral turpitude" is Hartian *rhetoric* used to legitimize a non-Hartian *practice*.

  **3. The Epistemic/Screening Account**
  *   **Verdict:** **Strictly Presupposed for Admission; Insufficient for Discipline.**
  *   **Reasoning:**
      *   **Admission:** The treatment of nondisclosure as a graver wrong than the concealed fact strictly presupposes an epistemic theory. The value of the C&F process is not that it stops "bad" people, but that it forces applicants to reveal data points that allow for risk assessment. Concealment destroys the utility of the screening mechanism itself. Therefore, the *admission* process strictly presupposes that the board is a risk-assessment body extracting signals.
      *   **Discipline:** This theory fails to explain the publicity gradient. A lawyer's risk profile does not change because a newspaper learns of their conduct. Therefore, while the *screening* is epistemic, the *sanctioning* is not.

  **4. The Role-Morality/Fiduciary Account**
  *   **Verdict:** **Merely Consistent.**
  *   **Reasoning:** This account explains why trust is central, but it does not explain why trust is policed via publicity. A fiduciary duty is owed to the client, not the public audience. If the client is unaware and unharmed, a strict fiduciary account would suggest no breach requires public sanction. The regime's focus on public perception exceeds the fiduciary requirement.

  **5. The State Franchise / Legitimacy Account**
  *   **Verdict:** **Strictly Presupposed.**
  *   **Reasoning:** This is the only theory that renders the entire system coherent, specifically the tensions you identified.
      *   **The Monopoly:** The state grants lawyers a monopoly on certain services. The legitimacy of that monopoly depends on public confidence, not just individual competence.
      *   **The Publicity Gradient:** If the purpose is maintaining the *legitimacy of the franchise*, then public scandal damages the franchise regardless of actual client harm. Sanctions must be calibrated to restore public confidence, hence the publicity sensitivity.
      *   **The Asymmetry:** Gatekeeping (admission) protects the brand value of the license. Once the brand is conferred (admission), removing it (discipline) is costly and destabilizing. Thus, the barrier to entry is higher (debt, psych history) than the barrier to staying in (actual misconduct).
      *   **Consumer Protection vs. Honor:** "Consumer protection" is the *legal* justification required to satisfy constitutional scrutiny (due process/privileges and immunities). "Honor" (or rather, *standing*) is the *sociological* function. The practice presupposes that the profession is a public franchise whose value is reputational.

  **Synthesis:** The practice strictly presupposes a **Legitimacy-Maintenance Theory of Occupational Licensing**. It treats the license not as a certification of skill (which would be Hartian) nor as a badge of moral virtue (which would be Devlinian), but as a **public franchise whose value is contingent on public confidence.** It utilizes **Epistemic Screening** as the tool to protect that franchise at the gate.

  ### II. Internal Tensions and Underdetermination

  You asked where the parts are in tension and where the practice is underdetermined.

  **1. The Consumer Protection vs. Legitimacy Tension**
  This is not a tension the system tries to resolve; it is a feature. "Consumer protection" is the *ex post* justification for discipline (we punished him to protect clients). "Legitimacy" is the *ex ante* justification for admission (we screened him to protect the profession's standing).
  *   **Betrayal:** The admission/discipline asymmetry betrays the Consumer Protection rationale. If the goal were truly protecting consumers from risky lawyers, a defaulted student loan should be as relevant to a 20-year member as to an applicant, assuming financial stress is a static risk factor. The fact that it is not suggests the C&F process is a **hazing ritual** or a **brand-protection mechanism** rather than a continuous safety check.

  **2. Underdetermination**
  The practice is underdetermined regarding the *source* of the moral standards.
  *   **Theory A:** The board enforces community standards to maintain legitimacy (Legitimacy Theory).
  *   **Theory B:** The board enforces its own bureaucratic self-preservation (Public Choice Theory).
  *   **Indistinguishability:** Both theories predict the same behavior (broad inquiry, harsh punishment for lying, publicity sensitivity). You cannot distinguish between "protecting the public trust" and "protecting the board's authority" based solely on the rules. Both require the same level of deference and concealment-punishment.

  ### III. The Hartian Counterfactual

  If your state adopted a strict Hart-style constraint (exclusion and discipline only on demonstrated harm or articulable risk of harm to clients/courts), the changes would be radical. Your suspicion that the screening rationale survives this constraint is **incorrect**.

  **1. Questionnaire Items**
  *   **Current:** Psych treatment, debt, academic discipline.
  *   **Hartian:** These would be eliminated unless a specific nexus was shown. Debt is not harm; psych treatment is not harm. Under strict Hart, you cannot use statistical proxies for risk.
  *   **Change:** The C&F would shrink to criminal convictions involving fraud or violence, and perhaps a verification of identity.

  **2. Treatment of Nondisclosure**
  *   **Current:** Nondisclosure is an independent, often graver wrong.
  *   **Hartian:** Nondisclosure would only be punishable if the concealed fact *itself* indicated a risk of harm. Lying about a minor, irrelevant fact would be irrelevant. The "process is the punishment" model would vanish.

  **3. Publicity Gradient**
  *   **Current:** Sanctions increase with publicity.
  *   **Hartian:** Eliminated entirely. Sanctions would be identical regardless of press coverage, as the harm to the client/court is unchanged.

  **4. Criminal Conviction vs. Professional Consequence**
  *   **Current:** Automatic scrutiny; potential for denial based on "character."
  *   **Hartian:** A "nexus hearing" would be required for every conviction. The state would have to prove *this* crime makes *this* applicant likely to harm *this* type of client.

  **5. Screening vs. Honor**
  *   **Your Suspicion:** You suspect screening survives while honor does not.
  *   **Correction:** **Screening collapses under strict Hart.** Screening relies on *predictive* data (past debt predicts future theft; past treatment predicts future instability). Strict Hart requires *demonstrated* risk. Actuarial risk assessment is arguably incompatible with a strict harm principle that demands individualized proof of dangerousness. Therefore, a strict Hartian regime would dismantle **both** the honor-based sanctions and the epistemic screening. It would leave only a competency exam and a remedy for actual malpractice.

  ### IV. Vulnerabilities of This Reconstruction

  This analysis rests on the assumption that the Bar's behavior is rational and theoretically coherent. Here is where the reconstruction is most likely to fail:

  **1. The Bureaucratic Inertia Argument**
  *   **Failure Point:** I have assumed the rules exist to serve a theory. It is highly probable that the rules exist simply because "that is how it has always been done." The C&F process is path-dependent. The "Legitimacy Theory" might be a *post hoc* rationalization I am imposing on a system that is actually just bureaucratic risk-aversion.
  *   **Evidence Needed:** If you found internal board memos showing that sanctions are increased for publicity *solely* to reduce complaints to the legislature (rather than to maintain public trust), the Legitimacy Theory fails in favor of a Public Choice/Bureaucratic Survival theory.

  **2. The "Trust" Empirical Claim**
  *   **Failure Point:** The Legitimacy Theory assumes public confidence is actually fragile and tied to lawyer conduct. If empirical studies showed that public trust in lawyers is unaffected by individual disciplinary scandals, then the publicity gradient is irrational even under the Legitimacy Theory.
  *   **Evidence Needed:** Survey data showing client retention rates do not fluctuate with local disciplinary news would undermine the claim that the board is rationally protecting a franchise.

  **3. The Coherence of "Harm"**
  *   **Failure Point:** I have treated "harm" as distinct from "loss of confidence." However, one could argue that in a service industry based on trust, *loss of confidence is the harm*. If the public loses faith in the legal system, they do not use it, which harms the administration of justice.
  *   **Evidence Needed:** If disciplinary opinions began explicitly framing "public scandal" as a direct harm to the "administration of justice" (rather than just a reputational hit), the Hartian and Legitimacy theories would merge. Some courts already hint at this. If your state's case law explicitly defines "prejudice to the administration of justice" to include "erosion of public trust," then the Hartian constraint is broader than I have allowed, and the system is more coherent than it appears.

  ### V. Conclusion

  The practice strictly presupposes a **Legitimacy-Maintenance Theory** of licensing, which views the bar as a state-delegated franchise whose value relies on public standing. It instrumentally employs **Epistemic Screening** at the admission stage to protect that standing.

  It is **incompatible** with a strict Hartian harm principle (due to the publicity gradient and proxy-based screening) and a thick Devlinian moralism (due to the heterogeneity of the bar and the focus on reputation over virtue).

  If a strict Hartian constraint were applied, **both** the honor-based sanctions and the epistemic screening would collapse, leaving a much narrower regime focused solely on proven incompetence or fraud. Your suspicion that screening would survive is likely too generous to the screening rationale; predictive profiling is difficult to square with a requirement for demonstrated harm.

  The system is likely not as coherent as the Legitimacy Theory suggests; it is probably a hybrid of legitimate franchise protection and bureaucratic self-preservation. However, the Legitimacy Theory is the only one that makes the *specific* contradictions you identified (publicity sensitivity, admission asymmetry) intelligible rather than merely absurd.
