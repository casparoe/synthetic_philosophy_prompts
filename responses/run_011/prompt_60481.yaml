      *   Explicit about reasoning from general expectations vs user description.
      *   Explicit about where reconstruction fails.
      *   American English.

      *(Self-Correction during drafting)*: I need to make sure I don't just validate the user's cynicism but provide the philosophical scaffolding they asked for. The user is asking for a jurisprudential diagnosis, not just validation.

