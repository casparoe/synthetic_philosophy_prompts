      1.  **Thesis:** The practice strictly presupposes a **Public Legitimacy Theory** (Franchise), instrumentally using **Epistemic Screening** for admission. It is inconsistent with strict Hartianism and thick Devlinianism.
      2.  **Analysis of Candidates:** Go through the list.
