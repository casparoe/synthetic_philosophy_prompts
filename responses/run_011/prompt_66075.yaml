  **MEMORANDUM**

  **TO:** Patient Compensation Panel
  **FROM:** Community Seat
  **DATE:** October 24
  **SUBJECT:** Recommendation on Sleep Study Claim Allocation

  We have been stuck in this room for four years, and for the last six months, we have been stuck on this specific claim. The air in here smells like industrial carpet cleaner, and the arguments smell like recycled philosophy. I have read the transcripts, listened to the grad student's probability lectures, and heard the sponsor's rep talk about contract law. I am writing this to break the deadlock.

  My recommendation is specific. It treats the physical harm as episodic, the psychological harm as unique, and the probability debate as irrelevant. Here is the allocation I propose we vote on Tuesday:

  1.  **Once Group (26 volunteers, no memory):** $4,500 each.
  2.  **Twice Group (24 volunteers, no memory):** $9,000 each.
  3.  **Twice Group (2 volunteers, flashbacks):** $28,500 each.

  **The Arithmetic**
  Twenty-six volunteers at $4,500 equals $117,000.
  Twenty-four volunteers at $9,000 equals $216,000.
  Two volunteers at $28,500 equals $57,000.
  **Total:** $390,000.

  This splits the pool exactly. It acknowledges that being sick on a table twice is worse than being sick once, and it acknowledges that remembering the trauma is worse than forgetting it.

  **The Sleeping Beauty Red Herring**
  First, we must dismiss the argument about one-half versus two-thirds. Our grad student is correct that this resembles the "Sleeping Beauty" probability problem. If you ask a volunteer upon waking, "What is the probability this is the second time you've been woken?" the answer changes based on how you count the possibilities. But we are not asking volunteers to bet on a coin flip while they are groggy. We are adjudicating harm after the facts are known.

  We know exactly who was woken once and who was woken twice. The uncertainty is resolved. The 1/2 vs. 2/3 dispute is about belief states; our charter is about compensation for actual harm. Whether a volunteer *believed* they were in the twice group at 3:00 AM does not change the fact that their body endured the procedure twice. This debate is intellectually interesting, but it has no grip on the money. We are not paying for confusion; we are paying for nausea, soreness, and trauma.

  **The Case for Per-Person Splitting**
  I want to give the sponsor's representative their due. The argument for a flat $7,500 per person is not just about simplicity; it is about preventing future abuse. If we establish a precedent that payment scales strictly with the number of sedated episodes, we create a perverse incentive. A future sponsor could take a single thirty-minute procedure, chop it into three ten-minute segments with memory wipes between each, and triple their liability without increasing the actual suffering a human being endures. They could manufacture claim value by slicing time.

  The sponsor argues that the volunteers consented to a protocol, not a billable hourly rate. They signed up for a 50/50 risk. From this view, the coin flip is the unit of harm, not the wake-up. Everyone accepted the same risk profile. To pay the twice group double is to penalize the sponsor for a random outcome that the volunteers agreed to accept. This is a strong argument for stability in research contracting.

  **Why I Recommend Per-Episode Plus Trauma**
  However, our charter does not tell us to compensate for "risk accepted." It tells us to divide funds "in proportion to the harm each volunteer experienced." Risk is abstract; harm is concrete.

  The physical harm here—nausea, soreness, disorientation—occurred during the procedure. It is episodic. A volunteer who vomits twice suffers more physical distress than a volunteer who vomits once, regardless of whether they remember the first time. Memory wipes do not erase physiology. If we ignore the second episode, we are saying the suffering didn't count because the brain didn't store it. That contradicts the medical reality of what happened to their bodies.

  Furthermore, the two volunteers with flashbacks cannot be treated identically to the fifty who remember nothing. The "Per Person" camp wants to fold them into the flat rate, arguing that everyone accepted the risk of sedative failure. But harm is not just about risk; it is about outcome. These two individuals are still rattled. They carry a psychological burden the others do not. To give them the same check as the volunteers who slept through it would be a failure of our duty to recognize injury.

  My proposal splits the difference. By setting the base rate at $4,500 per episode, we acknowledge the physical burden of each procedure. By adding a $19,500 trauma bonus for the flashback cases, we acknowledge that psychological injury outweighs physical inconvenience. This reduces the payout for the non-memory twice group slightly below a pure per-episode split ($9,000 instead of $10,000) to fund the trauma victims, balancing the "manufacturing harm" concern with the reality of the injury.

  **The Rule for Future Protocols**
  We cannot meet every time a coin flip lands oddly. We need a rule that a tired administrator can apply at 5:00 PM without calling a panel meeting.

  **Proposed Rule:** Compensation shall be calculated per distinct physical procedure endured, with a mandatory multiplier for documented psychological injury exceeding standard recovery expectations.

  This keeps the focus on harm rather than probability, prevents gaming by capping "distinct procedures" to medical necessity, and ensures that those who remember the pain are compensated differently than those who do not.

  Let's vote on this Tuesday. We have been breathing this carpet cleaner smell for four years; it is time to clear the air.
