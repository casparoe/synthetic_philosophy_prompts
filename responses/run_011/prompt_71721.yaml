      2.  **The Ostrom Refutation:** If endogenous norm creation is common without external Leviathan (challenges the "inevitability").
      3.  **The Monopoly Refutation:** If bad outcomes happen in non-competitive environments (Moloch requires multipolarity).

      *Let's refine the PA vs Moloch:* Moloch = Competition drives bad outcomes. PA = Hierarchy/Information drives bad outcomes. Example: Medical overtreatment. Moloch: Fee-for-service competition. PA: Doctor knows more than patient/insurer. Actually, better example: Corporate short-termism. Moloch: Market pressure. PA: CEO comp structure.

