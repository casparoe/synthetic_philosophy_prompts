answer: |-
  The University Endowment Committee must allocate \$10 million: immediate student aid or a library opening in sixty years. Empirical consensus holds real consumption will grow at 5% annually ($g=0.05$); future students will be substantially wealthier.

  Dean Elara demands intergenerational impartiality. She sets pure time preference to zero ($\rho=0$). However, she asserts marginal utility diminishes sharply with consumption ($\theta=1$). Because future students are richer, additional wealth yields them less welfare. She votes for aid.

  Trustee Mara concedes she discounts her own future welfare heavily ($\rho=0.03$), admitting this reflects a "weakness of imagination." Yet, she views utility as nearly linear in consumption ($\theta=0$). For her, wealth inequality between generations bears no moral weight.

  Despite her confessed impatience, Mara votes for the library. Her effective discount rate on consumption is lower than Elara's. She commits more to the distant future not because she cares more about time, but because she cares less about inequality.

  **Arithmetic**
  Elara's effective discount rate: $r = \rho + \theta g = 0 + 1(0.05) = 5\%$.
  Mara's effective discount rate: $r = \rho + \theta g = 0.03 + 0(0.05) = 3\%$.
  Since $3\% < 5\%$, Mara values the future payoff higher.

  **Parameter**
  The elasticity of marginal utility ($\theta$). If set to a neutral value ($\theta=0$) for both, Elara discounts at 0% and Mara at 3%; Elara then commits more to the future, and the reversal vanishes.

  **Reply to Ramsey**
  Mara's choice does not vindicate impatience; it vindicates indifference to distributive justice. Ramsey argued pure time preference ($\rho$) is ethically indefensible. This case demonstrates that while $\rho$ remains indefensible, a sufficiently high $\theta$ can justify discounting future consumption even when $\rho=0$. Mara's "generosity" stems from ignoring the moral relevance of wealth inequality—a defect potentially graver than impatience. That her ethical blindness regarding inequality accidentally offsets her ethical blindness regarding time does not make her impatience virtuous; it merely highlights that growth-based discounting ($\theta g$) is the true engine of intergenerational allocation, not pure time preference.
