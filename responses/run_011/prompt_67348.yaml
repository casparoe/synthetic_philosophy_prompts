answer: |-
  This is a solid design. It gamifies the philosophical tension without front-loading the theory. The "Two Desks, One Document" mechanic forces the conflict into the open because the incentives (Rule Adherence vs. Joint Consistency) are mathematically opposed.

  Here is the runnable activity, refined for your constraints.

  ### Activity Title: The Bureau of Functional Certification (BFC)

  **Participants:** 18 people.
  **Setup:** Divide into **3 Branches** of 6 people each.
  **Internal Split:** Within each Branch, split into **Desk A (3 people)** and **Desk B (3 people)**.
  **Mix:** Ensure each Desk has at least 1 Phil and 1 Bio (aim for 2/1 split if possible).

  ---

  ### 1. The Materials (Print on Cardstock)

  #### A. The Rulebooks (Laminated if possible)

  **Desk A Rulebook (The "System Maintenance" Code)**
  > **SECTION 1: DEFINITION OF FUNCTION.**
  > A trait has a Function if and only if its current operation makes a non-redundant causal contribution to the capacity, survival, or reproduction of the containing system.
  >
  > **SECTION 2: MALFUNCTION.**
  > A trait is Malfunctioning if its current operation deviates from the statistically normal contribution of that trait-type in the current population, resulting in reduced system capacity.
  >
  > **SECTION 3: PROHIBITED VOCABULARY.**
  > The following terms are banned from all rulings and notes: *Ancestor, Evolution, Selection, History, Lineage, Past, Origin, Designed.*
  >
  > **SECTION 4: SCORING.**
  > +10 Points for every ruling consistent with Sections 1 & 2. -20 Points for every use of Prohibited Vocabulary.

  **Desk B Rulebook (The "Lineage Retention" Code)**
  > **SECTION 1: DEFINITION OF FUNCTION.**
  > A trait has a Function if and only if the presence of this trait-type in the current population is causally explained by the reproductive success of ancestors possessing that trait-type *because* it performed that specific capacity.
  >
  > **SECTION 2: MALFUNCTION.**
  > A trait is Malfunctioning if it fails to perform the capacity for which it was retained in the lineage, regardless of its current causal contribution.
  >
  > **SECTION 3: PROHIBITED VOCABULARY.**
  > The following terms are banned from all rulings and notes: *Current, Now, Present, Utility, Contribution, System-Benefit, Maintenance.* (Exception: You may cite current deviation from the norm only to establish Malfunction).
  >
  > **SECTION 4: SCORING.**
  > +10 Points for every ruling consistent with Sections 1 & 2. -20 Points for every use of Prohibited Vocabulary.

  #### B. The Dossiers (6 Cases)
  *Each card contains: Organism, Trait, Current Status, Stipulated History.*

  1.  **Dossier: *Lumina-Scale***
      *   **Organism:** Deep-sea fish.
      *   **Trait:** Bioluminescent belly patch.
      *   **Current Status:** Emits light that matches down-welling sunlight, camouflaging fish from predators below.
      *   **History:** Ancestors with brighter patches survived predation better and passed on the trait specifically *because* of the camouflage effect.
      *   *(Structure: SE Yes / CR Yes. Baseline.)*

  2.  **Dossier: *Hollow-Leg***
      *   **Organism:** Flightless island bird.
      *   **Trait:** Hollow, lightweight leg bones.
      *   **Current Status:** Bones provide no structural advantage; they fracture easily under current weight. Bird walks on knuckles.
      *   **History:** Ancestors flew. Bones were retained *because* they were light for flight. Flight was lost 50k years ago; bones haven't changed.
      *   *(Structure: SE Yes / CR No. The Vestige.)*

  3.  **Dossier: *Thermal-Ridge***
      *   **Organism:** Desert reptile.
      *   **Trait:** Dorsal bony ridge.
      *   **Current Status:** Radiates excess heat, preventing overheating. Crucial for survival in current heatwave.
      *   **History:** Ridge arose via genetic drift (neutral). It was fixed in the population by chance, not selection. Heat radiation was discovered recently; ancestors didn't use it for thermoregulation.
      *   *(Structure: SE No / CR Yes. The Spandrel/Exaptation.)*

  4.  **Dossier: *Silent-Sac***
      *   **Organism:** Meadow frog.
      *   **Trait:** Vocal resonance sac.
      *   **Current Status:** Sac is punctured. Frog attempts to call but makes no sound. Cannot attract mates.
      *   **History:** Sac was selected and retained specifically for amplifying mating calls.
      *   *(Structure: SE Malfunction / CR "Null Function".)*

  5.  **Dossier: *Synth-Kidney***
      *   **Organism:** Lab-engineered mouse.
      *   **Trait:** Synthetic filtration organ.
      *   **Current Status:** Filters a specific industrial toxin from the blood. Mouse survives in toxic lab environment.
      *   **History:** Trait was designed and inserted by engineers *in order to* filter the toxin. No ancestral lineage exists for this trait.
      *   *(Structure: The Trap/Gift. Intent vs. History.)*

  6.  **Dossier: *Toxic-Skin***
      *   **Organism:** Rainforest toad.
      *   **Trait:** Dermal toxin glands.
      *   **Current Status:** Toad lives in a new zone where the toxin attracts a specific predator that is immune. Trait reduces survival.
      *   **History:** Glands were selected and retained *because* they deterred predators in the ancestral zone.
      *   *(Structure: SE Yes / CR Negative. The Mismatch.)*

  #### C. The Joint Certification Form (One per Branch)
  *A simple grid. For each Dossier, they must check ONE box.*
  *   [ ] **FUNCTIONAL** (Trait has a function)
  *   [ ] **NON-FUNCTIONAL** (Trait has no function)
  *   [ ] **MALFUNCTIONING** (Trait is broken)
  *   *Signature Line: Desk A Lead & Desk B Lead.*

  #### D. The Deviation Log (One per Branch)
  *If the Joint Form differs from either Desk's initial draft, you must write why.*
  *   "We bent Rulebook Section __ to agree on Dossier __."
  *   "We redefined the word '__' to make the ruling fit."

  ---

  ### 2. Minute-by-Minute Timeline (150 Mins)

  **00:00 – 00:15: Intake & Briefing**
  *   Welcome. No mention of "philosophy of biology."
  *   Frame: "You are the BFC. You certify traits. You have 2 hours to clear the docket."
  *   Split groups. Hand out Rulebooks. **Crucial:** Tell them they cannot show their Rulebook to the other Desk. They can only talk during the Negotiation Phase.

  **00:15 – 00:30: Rulebook Study (Silent)**
  *   Desks separate physically (opposite sides of the table).
  *   They must memorize/annotate their rules.
  *   *Facilitator Role:* Patrol. If a Phil student tries to explain the theory, shut it down. "Stick to the Code."

  **00:30 – 01:15: Certification Phase 1 (Independent Rulings)**
  *   Desks receive the 6 Dossiers.
  *   They must draft their own rulings (Functional/Non/Malfunction) based *strictly* on their Rulebook.
  *   They calculate their "Adherence Score."
  *   *Facilitator Role:* Collect the Draft Rulings at 01:15. Do not let them change them.

  **01:15 – 01:45: Negotiation Phase (The Crash)**
  *   Desks merge. They must produce **ONE** Joint Certification Form.
  *   **Incentive Reveal:** "Adherence Points count, but **Consistency Bonus** is double. If your Joint Form contradicts either Rulebook, you lose Adherence Points. If you fail to sign a Joint Form, you get zero Consistency Bonus."
  *   They must argue out the conflicts. They must fill out the **Deviation Log** if they fudge a rule to agree.
  *   *Facilitator Role:* Watch the language. If someone says "Proper Function," ding them $5 (fake money) or take a stamp.

  **01:45 – 02:00: Scoring & Wall Walk**
  *   Branches post their Joint Forms and Deviation Logs on the wall.
  *   Everyone walks around. Look for where Branches disagreed or fudged differently.
  *   Facilitator tallies scores publicly. Highlight the Branch that fudged the most to get consistency.

  **02:00 – 02:30: Debrief (The Map)**
  *   See Debrief Plan below.

  ---

  ### 3. The Debrief Plan

  **Step 1: The Data (10 mins)**
  *   Look at the Wall. Point to **Dossier 2 (Hollow-Leg)**.
  *   Ask Desk A: "Why did you rule Non-Functional?" (Answer: It doesn't help now.)
  *   Ask Desk B: "Why did you rule Functional?" (Answer: It was selected for flight.)
  *   Ask the Joint Signatories: "What did you write on the Deviation Log to make these match?"
  *   *Likely outcome:* They will write "Functional (Vestige)" or redefine Function to mean "Historical Potential." Point out that they just invented a third category to solve the conflict.

  **Step 2: Mapping the Positions (10 mins)**
  *   **Desk A = Causal-Role (Cummins).** Function is what a trait *does* in the current system. It's about capacity analysis.
  *   **Desk B = Etiological/Selected-Effects (Millikan/Neander).** Function is why the trait is *here*. It's about history.
  *   **The Joint Doc = Pragmatic/Pluralist.** You couldn't agree, so you created a context-dependent standard.
  *   *Reveal:* "Desk A was running a Cummins analysis. Desk B was running an SE analysis. You just fought the 40-year debate in 30 minutes."

  **Step 3: The Biologist Objection (5 mins)**
  *   *Anticipate:* "But nobody in my department talks like Desk B. We just say 'the function of the heart is to pump blood' because that's what it does."
  *   *Your Move:* Pull **Dossier 2 (Hollow-Leg)** back out.
  *   "If you only talk about what it does, the Hollow-Leg has *no* function. It's just a stick. But you call it a 'leg'. Why?"
  *   "You call it a leg because of its history. You call the Silent-Sac (Dossier 4) 'broken' rather than 'a silent sac' because of its history."
  *   "You use Desk B (Etiological) to identify the *trait*, and Desk A (Causal) to identify the *physiology*. You switch codes without noticing. That's the philosophical problem."

  **Step 4: The Engineered Case (5 mins)**
  *   Pull **Dossier 5 (Synth-Kidney)**.
  *   Ask: "Does this have a function?"
  *   Desk A says Yes (it filters). Desk B should theoretically say No (no evolutionary history).
  *   *The Trap:* If Desk B says Yes, they admit "Selection" is just a proxy for "Design/Intent."
  *   *The Lesson:* The Etiological account works for artifacts (Screwdriver's function is to screw) because they have designers. Biology has no designer, so 'Selection' stands in for 'Intent'. If the history is artificial, the code breaks.

  ---

  ### 4. Predicted Failures & Live Fixes

  **Failure 1: The Philosophers Take Over.**
  *   *Symptom:* Phil students explain the rulebook to the Biologists using terms like "normative" or "teleology."
  *   *Fix:* The "Prohibited Vocabulary" penalty. Enforce it ruthlessly in the first 15 mins. If a Phil student says "teleology," take a stamp from their scorecard. Make the Rulebook the only authority.

  **Failure 2: They Agree Too Easily.**
  *   *Symptom:* They ignore the rule conflicts and just vote.
  *   *Fix:* During Negotiation, walk around and ask: "Does this ruling violate Section 1 of Desk A's code?" If yes, remind them they lose Adherence Points. Force the tension.

  **Failure 3: The "Breaker" Case.**
  *   **Dossier 6 (Toxic-Skin / Mismatch)** is the breaker.
  *   *Why:* Desk B says Functional (selected for). Desk A says Dysfunctional (kills you now).
  *   *Risk:* Biologists will scream "It's maladaptive!" and refuse to call it Functional.
  *   *Live Handle:* Let them scream. In debrief, use this to distinguish **Function** (Etiological) from **Adaptation** (Current utility). This is the hardest distinction for undergrads/biologists. Desk B is forced to say "It has a function, but it's currently maladaptive." That sentence is the gold nugget.

  ---

  ### 5. Honest Note on Limitations

  **You are right about the Stipulation.**
  By giving them the history as a "Stipulated Fact" on the card, you remove the *epistemic* burden of the Etiological account. In real science, Desk B is almost always guessing. They infer history from current structure.
  *   **The Consequence:** Desk B looks stronger than it is. They will feel confident ruling on History because *you told them the history*.
  *   **The Patch:** In the Debrief, ask Desk B: "In Dossier 3 (Thermal-Ridge), the card told you it was Drift. In real life, how would you know that without the card?"
  *   Force them to admit they would have to *infer* selection from current utility... which is exactly Desk A's method.
  *   **The Point:** "The Etiological account requires historical data we often don't have. So we often use Causal-Role as a *proxy* for Etiology. That's why the confusion exists."

  **Regarding the Engineered Case (Dossier 5):**
  It is a **Gift**, but only if you frame it correctly.
  *   If you let them treat it as "Biology," it confuses the room.
  *   If you frame it as: "Does the concept of Function apply to things without evolutionary history?" it isolates the *structure* of the Etiological account (Goal/Intent) from the *mechanism* (Selection).
  *   *Instruction:* In debrief, explicitly ask: "Is 'Selected For' just 'Natural Design'?" If they say yes, the Etiological account collapses into a Design argument. If they say no, they must explain the difference between a Breeder and Nature. That is a high-level philosophical payoff.

  ### 6. Materials Checklist
  *   [ ] 3 Sets of Rulebooks (A & B).
  *   [ ] 18 Copies of the 6 Dossiers (cut into cards).
  *   [ ] 3 Joint Certification Forms (large paper).
  *   [ ] 3 Deviation Logs.
  *   [ ] Markers, Tape, Score Stamps (or stickers).
  *   [ ] Timer (visible).

  This setup ensures the conflict is structural, not personal. They aren't fighting each other; they are fighting the Rulebooks. The "Fudge" (Deviation Log) gives you the exact data points you need for the debrief.
