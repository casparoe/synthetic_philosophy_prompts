  1.  **Analyze the Request:**
      *   **Goal:** Run a 2.5-hour (150 min) interdisciplinary workshop (18 people: 50% philosophy grad students, 50% ecology/evo bio non-philosophers).
      *   **Topic:** The concept of "function" in life sciences, specifically the split between Causal-Role (CR) and Etiological (Selected-Effects, SE) accounts.
      *   **Constraint:** No pre-reading. Nobody can say "proper function" until debrief. The debate must emerge organically ("hit them sideways").
      *   **Core Mechanic:** Two "desks" (rulebooks) certifying traits. Desk A = Causal-Role (current contribution, no history). Desk B = Etiological (lineage/history, no current utility except deviation).
      *   **Output:** Joint document required (forces negotiation/conflict).
      *   **Cases:** 6-8 made-up organisms (no hearts/appendixes). Must test where current contribution and lineage history come apart. Include one engineered trait.
      *   **Incentives:** Points for following rulebook, bigger points for joint consistency (creates pressure to fudge).
      *   **Deliverables:** Materials list, minute-by-minute timeline, debrief plan (mapping to CR/SE/Third Way), handling the "biologist objection" ("we just talk about what it does"), predicted failures, the "breaker" case, and limitations of the activity (specifically regarding inference vs. stipulation of history).
      *   **Tone:** Practical, runnable, sharp, no literature survey.

