  3.  **Drafting the Cases (The "Dossiers"):**
      *   Need 6-8 cases.
      *   *Standard Agreement:* Trait does X, was selected for X. (Boring, but needed as baseline).
      *   *CR Yes / SE No (Exaptation/Spandrel):* Trait does X now, helps survival, but arose for Y or by drift.
      *   *SE Yes / CR No (Vestige/Rudiment):* Trait was selected for X, currently does nothing or is harmful.
      *   *Pathology/Malfunction:* Trait fails to do X. SE says malfunction. CR says "it's just doing Y now."
      *   *Plasticity/Context:* Trait does X in Env 1, Y in Env 2. History says X.
      *   *Engineered:* Synthetic biology.
      *   *Case Ideas:*
          1.  *Glow-Squid Ink:* Standard (Agreement).
          2.  *Bone-Flute Bird:* Exaptation (Sound production vs. Structural support).
          3.  *Blind Cave Fish Eye:* Vestige (SE Yes, CR No).
          4.  *Sickle-Cell Analog:* Context dependent (Harmful now, selected for resistance historically).
          5.  *The "Broken" Pump:* Malfunction (SE says broken, CR says "it's pulsing differently").
          6.  *Lab-Grown Photosynthetic Skin:* Engineered (Designer intent vs. Current causal role).
          7.  *Drift-Fixed Trait:* Neutral trait fixed by drift, now co-opted. (SE No, CR Yes).
          8.  *Suicidal Reproduction:* (Semelparity) - Selected to die, currently dying. (Agreement but weird). Let's swap for *Antler Growth*: Costly, selected for mating, currently growing but animal is castrated (SE Yes, CR No for mating).
      *   *Refining for the "Split":* I need to make sure the divergence is clear.
      *   *Selection:*
          1.  *The Baseline:* **Nectar-Guides.** (Flower pattern. Selected for pollinator direction, currently directs pollinators.) -> *Agreement.*
          2.  *The Spandrel:* **Thermal-Vents.** (Dino plates. Selected for display, currently regulate heat.) -> *CR Yes, SE No (for heat).*
          3.  *The Vestige:* **Anchor-Legs.** (Island insect. Selected for swimming, currently useless stumps.) -> *SE Yes, CR No.*
          4.  *The Malfunction:* **Silent-Caller.** (Frog sac. Selected for sound, currently punctured/silent.) -> *SE Malfunction, CR "No Function".*
          5.  *The Drift-Co-opt:* **Glue-Feet.** (Gecko ancestor. Fixed by drift, now sticks.) -> *SE No (no selection history), CR Yes.*
          6.  *The Engineered:* **Chimera-Gill.** (Lab fish. Designed to filter toxin, currently filters toxin.) -> *Designer Intent vs. Biological History.*
          7.  *The Conflict:* **Poison-Skin.** (Toad. Selected for toxin, currently toxin is depleted due to diet change, skin is harmless.) -> *SE Yes, CR No.*
          8.  *The Wildcard:* **Symbiont-Sac.** (Organ holds bacteria. Selected for holding, bacteria now extinct, sac fills with water.) -> *SE Yes (holding), CR Yes (holding water) but "holding bacteria" is the function?*

      *   *Wait, check the User's Hunch:* "Interesting cases are exactly the ones where current contribution and lineage history come apart... in maybe three or four structurally different ways."
      *   *Verdict:* The hunch is right. The categories are: (1) Vestige (History Yes, Current No), (2) Exaptation/Spandrel (History No, Current Yes), (3) Malfunction (History Yes, Current Fail), (4) Drift (History Neutral, Current Yes).
      *   *Engineered Case:* It's a **Trap** if treated as biological. It's a **Gift** if treated as a mirror to SE. I will advise treating it as a mirror to SE (Intent = Selection).

  4.  **Developing the Activity Mechanics:**
      *   *Grouping:* 18 people. Split into 3 "Branches" of the Certification Body. Each Branch has 6 people (3 Phil, 3 Bio). Inside each Branch, split into Desk A (3 people) and Desk B (3 people).
      *   *Why 3 Branches?* If everyone does the same thing, debrief is boring. If they have different subsets of cases, they compare notes. Better: All branches do all cases, but they negotiate independently. Then compare *between* branches in debrief. Actually, for 150 mins, 3 independent groups working on the *same* dossiers allows for comparison of *how* they fudged.
      *   *Incentives:*
          *   Rule Adherence Stamp (Facilitator checks rulebook compliance).
          *   Consistency Stamp (Joint doc matches).
          *   Total Score = Adherence + Consistency.
          *   *Crucial:* Consistency is worth double. This forces them to compromise their rulebook to agree.
      *   *The "Fudge":* They will have to rewrite the definitions or interpret the cases loosely to agree. I need to make sure they write down *why* they agreed.

  5.  **Timeline (150 mins):**
      *   00-15: Intro & Setup (No theory).
      *   15-30: Rulebook Study (Desk A vs B separation).
      *   30-75: Certification Phase 1 (Individual Desk rulings).
      *   75-105: Negotiation Phase (Joint Document).
      *   105-120: Scoring & Wall Walk.
      *   120-150: Debrief (Mapping to Philosophy).

  6.  **Debrief Strategy:**
      *   Map Desk A -> Cummins (Causal Role).
      *   Map Desk B -> Millikan/Neander (Etiological/Selected Effects).
      *   Map Joint Doc -> Pragmatic/Pluralist/Systemic.
      *   *The Biologist Objection:* "We just talk about what it does." Response: "Which 'what it does'? The current physics or the historical reason it's here?" Use the Vestige case (Anchor-Legs) to punch this. It does *nothing*, but biologists call it a 'leg'. Why?
      *   *Limitation:* Stipulated history. Patch: Ask them *how* they would know the history in real life. Highlight the inference gap.

  7.  **Predicting Failures:**
      *   *Failure 1:* Philosophers dominate the language. *Fix:* Rulebooks are written in "Regulatory Prose," not哲学 jargon. Biologists hold the "facts" of the dossiers.
      *   *Failure 2:* They finish too fast. *Fix:* Add a "Appeal" mechanic or complex scoring.
      *   *Failure 3:* They ignore the incentives. *Fix:* Make the "Consistency Bonus" very visible.
      *   *Breaker Case:* The Engineered one. It breaks the "Natural Selection" frame. I need to warn the user.

  8.  **Refining the Materials:**
      *   Need specific text for Rulebook A and B.
      *   Need specific text for the 8 Dossiers.
      *   Need Scorecards.

  9.  **Addressing the "Engineered Case" Question:**
      *   Is it a gift or trap? It's a trap if it leads to "Intelligent Design" debates. It's a gift if it isolates the *structure* of the Etiological account (History/Intent) from the *mechanism* (Natural Selection). I will advise framing it as "Artificial Selection" to keep it parallel to Desk B.

  10. **Addressing the "Limitation" Question:**
      *   User is right. Stipulating history removes the epistemic burden. In real science, SE is hard because we don't *know* the history. Here, they *know*. This makes SE look stronger than it is.
      *   *Patch:* In debrief, ask Desk B: "In the real world, how would you prove the 'Selected For' clause in Dossier 5?" Force them to confront the inference problem.

  11. **Final Review against Constraints:**
      *   150 mins? Yes.
      *   18 people? Yes (3 groups of 6).
      *   No "Proper Function" until debrief? Yes.
      *   Materials list? Yes.
      *   Biologist objection plan? Yes.
      *   Honest note on limitations? Yes.

  12. **Writing the Response:** (Self-Correction during drafting)
      *   *Correction:* Make sure the Rulebooks are mutually exclusive enough to cause friction but plausible enough to be followed.
      *   *Correction:* Ensure the "Joint Document" requires a binary choice (Certified/Rejected) or a specific functional label, forcing the conflict. Let's make them assign a "Functional Status Code."
      *   *Correction:* The "Fudging" needs to be visible. I'll add a "Deviation Log" they must fill out if they bend a rule to agree.

      *(Self-Correction on Group Size)*: 18 people. 3 groups of 6 is good. Within each group, 3 on Desk A, 3 on Desk B.
      *(Self-Correction on Cases)*: Ensure the "Engineered" one is clearly distinct.
      *(Self-Correction on Timeline)*: 150 mins is tight for negotiation. I need to ensure the negotiation phase is strictly timed.

      *Let's finalize the Cases:*
      1.  *Lumina-Scale:* (Agreement)
      2.  *Hollow-Bone:* (Vestige - SE Yes, CR No)
      3.  *Heat-Ridge:* (Exaptation - SE No, CR Yes)
      4.  *Silent-Gland:* (Malfunction - SE Malfunction, CR Null)
      5.  *Drift-Color:* (Neutral - SE No, CR Yes)
      6.  *Synth-Kidney:* (Engineered - Intent vs Current)
      7.  *Poly-Task:* (Pleiotropy - Selected for X, does X & Y)
      8.  *Env-Mismatch:* (Selected for X in Env 1, does Harm in Env 2)

      *Wait, keep it to 6 to save time.* 6 is better for 75 mins of work.
      1.  *Agreement (Baseline)*
      2.  *Vestige (SE Yes, CR No)*
      3.  *Exaptation (SE No, CR Yes)*
