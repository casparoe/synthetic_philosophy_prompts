  **Post-Script**

  I built this on the "undefined limit" reading (the function $f(t)$ has no limit as $t \to 1$, so $f(1)$ is unspecified) rather than the "contradiction" reading (the description is logically incoherent). I chose this because it allows the startup to treat "undefined" as a deliverable status rather than admitting failure. The piece takes liberties by treating a mathematical lack of definition as a physical product state, ignoring that a physical object *must* be in some configuration, even if the mathematical model doesn't predict it.
