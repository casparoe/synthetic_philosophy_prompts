answer: |-
  You have not assembled this out of notes and deadline panic. You have identified a specific, documented mechanism in the sociology of memory, but you are correct that it lacks a single, universally agreed-upon label. You are standing in the gap between **Memory Studies**, **Heritage Tourism**, and **Moral Psychology**.

  The pattern is real. It is distinct from the "Lost Cause" (which relies on denial) and distinct from general nostalgia (which relies on affection). It is a specific alchemy where **total ideological failure** combined with **temporal distance** allows the *sacrifice* to be consumed without the *sin*.

  Here is the carving you asked for.

  ### 1. The Nearest Neighbors (and why they fail)

  You need to know why the existing terms don't fit, so your narrator knows what she is *not* doing.

  *   **The Lost Cause (Historical Mythos):**
      *   *The Fit:* It deals with a defeated side commemorating their dead.
      *   *The Miss:* The Lost Cause relies on **revisionism**. It argues the cause was *right* (states' rights, heritage, not slavery). Your town admits the cause was *wrong*. The Lost Cause defends the content; your phenomenon evacuates it.
  *   **Chosen Trauma (Vamik Volkan):**
      *   *The Fit:* A group identity formed around shared suffering.
      *   *The Miss:* Chosen Trauma requires the group to be the **victim**. Your town is commemorating the **perpetrators** (or at least the agents of a "wrong" side). The tourists aren't bonding over shared victimhood; they are bonding over shared aesthetic appreciation of the loss.
  *   **The Empty Signifier (Laclau/Mouffe):**
      *   *The Fit:* A symbol (the flag) that can be filled with any meaning.
      *   *The Miss:* This is a linguistic/political tool used *actively* to build coalitions. Your phenomenon is **passive**. The meaning isn't being fought over; it has evaporated because the threat is gone. It's not that the symbol *can* mean anything; it's that the original meaning no longer *matters*.
  *   **Moral Decoupling (Bhattacharjee et al.):**
      *   *The Fit:* This is a consumer psychology term where people separate performance from morality (e.g., "I love the art, not the artist").
      *   *The Miss:* It is usually applied to living celebrities or contemporary figures. It is the closest *mechanism*, but it isn't used for historical memory.

  ### 2. The Coinage

  Since you need a term for the chapter, and none exists that captures the *admission of guilt* + *aestheticization of loss*, I propose you use the academic description for your research and a sharper term for the text.

  **Academic Descriptor:** **Post-Content Commemoration**
  **Narrative Term:** **The Hollowing** (or **The Defeat Lag**)

  **Definition:**
  A socio-historical process where a defeated political movement, widely acknowledged as morally bankrupt, undergoes a transition from **political threat** to **aesthetic object**. This occurs only when the movement's capacity to act is permanently extinguished.

  **The Edges (What Counts vs. What Doesn't):**

  1.  **The Admission Clause:** The community must acknowledge the original aims were flawed or evil. If they argue the aims were misunderstood, it is *Revisionism* (Lost Cause), not *The Hollowing*.
  2.  **The Obsolescence Clause:** The political ideology must be dead. If the ideology is still active (even marginally), the sacrifice remains "load-bearing." You cannot separate the blood from the banner if the banner is still being carried into battle.
  3.  **The Outsider Clause:** The emotional weight must be inheritable by people with no stake in the outcome. If only descendants feel it, it is *Ancestral Grief*. If tourists buy the tote bag, it is *The Hollowing*.
  4.  **The Lag:** There must be a generational gap. Immediate post-defeat is hostile. The "warmth" requires the death of the witnesses who suffered under the regime.

  ### 3. The Near-Miss Case (The Control Group)

  To prove this is a distinct phenomenon, you need a case that looks identical but fails the test.

  **The Case:** **Che Guevara on a T-Shirt.**
  *   **Why it looks like it:** It is a defeated revolutionary (executed, cause failed in the immediate sense). His image is commodified. Tourists buy it.
  *   **Why it ISN'T The Hollowing:** The aims are **still load-bearing**. People buy the shirt *because* they agree with the anti-imperialist/revolutionary politics. The symbol has not been evacuated; it has been universalized. The politics are still live, still actionable, and still debated. If Che's politics were universally acknowledged as "bad" (e.g., if he were a failed fascist instead of a failed communist) and people *still* wore the shirt for the "rebel aesthetic" while agreeing he was a tyrant, *that* would be The Hollowing.

  **The Better Near-Miss:** **The Wehrmacht Memorial (Volkstrauertag) in modern Germany.**
  *   **Why it looks like it:** Germany lost. The cause (Nazism) was evil. The dead are commemorated.
  *   **Why it ISN'T (quite):** The commemoration is heavily guarded by **shame**. It is mournful, not celebratory. The "tote bag" element is strictly forbidden. The moment a symbol of the Wehrmacht becomes "cool" or "aesthetic" in Germany, it is flagged as neo-Nazism. The *Hollowing* requires the symbol to go "public" and "soft." In Germany, the symbol remains "hard" and policed. Your river town has slipped the leash; Germany has not.

  ### 4. Where I Might Be Wrong (The Vulnerability)

  You asked for straight talk on where this taxonomy might collapse. Here are the three points of failure for this concept:

  **1. The "Admission" is a Lie.**
  You state your townspeople admit the aims were bad. In my experience with similar communities (Appalachia, UK Jacobite sites, US South), the admission is often **semantic**. They will say, "Slavery was bad," but immediately follow it with, "But *our* ancestors were just defending their homes."
  *   *The Risk:* If the ritual structure quietly re-codes the "bad aim" into a "universal virtue" (Home, Family, Bravery), then the aims *haven't* been dropped; they've been **camouflaged**. If your narrator discovers that the "admission" is just a shield to protect the real sentiment, *The Hollowing* isn't happening. *Revisionism* is.
  *   *What changes my mind:* If you find the ceremony uses language that could apply to *any* war ("they loved their families"), the cause hasn't been dropped; it's been universalized to hide the specific guilt. That is not *The Hollowing*; that is **Sanitization**.

  **2. The "Outsider" Motivation.**
  You assume the tourists buy the tote bags because the politics are gone.
  *   *The Risk:* Some tourists buy Confederate-adjacent gear *because* it signals a dog-whistle alignment, while claiming it's "history."
  *   *What changes my mind:* If the gift shop owner knows that 20% of the buyers are winking at the politics, the symbol isn't "hollow." It's **coded**. *The Hollowing* requires the symbol to be truly empty, not a vessel for secret solidarity.

  **3. The "Winning" Contrast.**
  You argue winners can't have this because their aims remain load-bearing.
  *   *The Risk:* Consider the **British Empire**. It "won," but it is now widely considered morally bankrupt. Yet, there is a nostalgic aesthetic for it (tea, uniforms, pomp) where the violence is acknowledged but treated as "of the time."
  *   *What changes my mind:* If a winning side can undergo *The Hollowing* once their power fades (even if they didn't lose militarily), then "Defeat" isn't the requirement. **Irrelevance** is. If the British Empire fits your model, then the term shouldn't be about Defeat. It should be about **Obsolescence**.

  ### 5. Recommendation for the Chapter

  Your narrator is trying to decide if she is participating in this.

  If she believes the town is engaging in **The Hollowing**, she believes the town has moved *past* the politics into a pure, if morbid, appreciation of human cost. She sees the tote bags as harmless aesthetic drift.

  If she believes the town is engaging in **Sanitization**, she believes the town is *lying* about the politics to keep the pride. She sees the tote bags as complicity.

  The tension of the chapter should turn on whether the **Admission** is real.
  *   *Test:* Have her ask a question that the "Hollowed" logic cannot answer. "If their cause was wrong, why are we proud they died for it?"
  *   *The Hollow Answer:* "We aren't proud of the cause. We're proud they endured."
  *   *The Sanitization Answer:* "They didn't know it was wrong. They were good men."

  If the town gives the second answer, your narrator realizes *The Hollowing* is a myth. The politics are still load-bearing; they are just hiding the load.

