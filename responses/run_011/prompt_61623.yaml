answer: |-
  The microstructure scanner hummed, a low bee trapped in glass. On the tray sat Unit 734 and Unit 735. Grey cubes of smart ceramic. Identical lattices. Identical density. Identical everything, except for the ghost code buried in the grain.

  "Stamp them both Non-Fragile," Kael said, leaning against the doorframe. He didn't look at the cubes. He looked at his watch. "Neither has broken in forty years. Neither will. The conditional is false: if struck, they do not break. Case closed."

  I held the red stamp over 734. "734 is a fink. The moment a hammer swings, the lattice reconfigures. The fragility disappears before the impact lands. It isn't fragile at the moment of truth."

  "And 735?"

  "Masked. It stays fragile. Always. But the damping field around it eats the kinetic energy. The hammer hits, the field sighs, the ceramic doesn't shatter. The disposition is there, waiting to kill someone, but it's muzzled."

  Kael pushed off the frame. "Elara, look at me. There is no test. No hammer, no drop, no sonic resonance can tell them apart. If a property makes no difference in the world, if it leaves no footprint in any possible history, is it a property? Or is it just theology?"

  "It's about the basis," I said, but my voice lacked the usual iron. "The microstructure differs."

  "The microstructure is identical," he countered. "The code is external to the ceramic bonds. You're stamping the software, not the stone. If the outcome is identical safety, why do we need two stamps? Stamp them safe. Save the appeals board the headache."

  He was right. That was the itch. If verificationism holds, if meaning is use, then the distinction is empty. But the liability clause in my contract specified *dispositional basis*, not *outcome*. If I stamped a masked object Non-Fragile, and the field failed, the ceramic would shatter. I would be liable for negligence. I would lose the pension, the apartment, the city clearance.

  But 735 worried me deeper. The damping field. Did it absorb the impact *after* contact, or did it repel the hammer *before* contact?

  "If the field repels the hammer," I said, "then the stimulus never arrives. It's never struck."

  Kael shrugged. "Semantics."

  "It's not semantics. It's the conditional. 'If struck, would break.' If the field prevents the striking, the antecedent is false. The disposition never gets tested. If I stamp it Fragile, I'm saying it *would* break if struck. But if the field ensures it *cannot* be struck, then the statement is vacuously true. But if the field allows contact but stops the shattering, that's a mask."

  "And if you can't tell the difference?" Kael stepped closer. "If the office's definition of 'struck' is sloppy—and it is, Elara, read the manual—then you're stamping based on a distinction the law doesn't recognize. You're exposing yourself to appeal on grounds of undefined terms. Stamp them both Non-Fragile. Protect yourself."

  He left me with the hum and the cubes.

  I looked at 735. If the field meant the stimulus never arrived, then the fragility was never triggered, never masked, just... orphaned. But if the field allowed the strike and hid the break, the fragility was real, dangerous, waiting. My liability hinged on a definition of contact that the office hadn't bothered to write down. If I stamped 735 Fragile, I admitted it could break, implying the field might fail. If I stamped it Non-Fragile, I claimed the field was part of the object's nature.

  Kael said the distinction was empty. But if the field failed, only one of these cubes would turn into shrapnel. The other would just be hard stone. The outcome was identical until the one moment it wasn't.

  I picked up the red ink. I picked up the blue.

  I pressed down.

  ***

  **Note on Philosophical Liberties**

  I treated the "fink" as removing the disposition entirely upon stimulus approach, aligning with Lewis's critique of simple conditional analyses. I leaned on a categorical basis account (microstructure) to justify distinguishing them despite identical counterfactuals, though I let the verificationist challenge (Kael) threaten this. The contested account is whether dispositions are defined by their conditional manifestations or their intrinsic causal bases. If the *conditional analysis* is correct (i.e., dispositions *just are* "if S then M"), then Kael is right: identical conditionals mean identical dispositions, and the story should end with both stamped Non-Fragile. If the *causal basis* view holds, my ending stands. I would change the ending if convinced that dispositions without distinct manifestations are metaphysically redundant.
