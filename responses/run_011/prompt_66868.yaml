answer: |-
  Here is the breakdown based on David Lewis's *Convention: A Philosophical Study*.

  Lewis defines a convention as a regularity in behavior that persists because:
  1.  Everyone conforms.
  2.  Everyone expects everyone else to conform.
  3.  Everyone prefers to conform *on the condition that* others do (it solves a coordination problem).
  4.  There is at least one alternative regularity that would have solved the problem just as well (**Arbitrariness**).
  5.  These facts are **Common Knowledge**.

  ### The Analysis

  **1. Appointment slots (20 vs. 30 mins)**
  *   **Lewis Score:** 9/10
  *   **Convergence:** Yes
  *   **Reasoning:** This is a textbook coordination problem. Both systems work independently ("worked fine back when"), but they fail when mixed because the *expectation* of the next slot is broken. The specific number (20 or 30) is arbitrary provided it is uniform. The resistance is about the *mix*, not the specific number, which fits Lewis's condition that the preference is conditional on others conforming. A clear rule establishes the common knowledge needed to lock in the new equilibrium.

  **2. Chart notes (SOAP vs. Freeform)**
  *   **Lewis Score:** 2/10
  *   **Convergence:** No
  *   **Reasoning:** This fails the **Arbitrariness** condition. The North vets claim SOAP is "better clinical reasoning." If they believe one method is objectively superior for patient care, their preference is *unconditional*—they want to use it regardless of what others do. This is not a coordination problem; it is a dispute over professional standards and efficacy. A rule won't work because compliance feels like compromising medical quality.

  **3. Drug bin labels**
  *   **Lewis Score:** 10/10
  *   **Convergence:** Yes
  *   **Reasoning:** This is the purest example on your list. Staff explicitly state they "would have been happy with either one." The only value is in the uniformity (coordination), not the content (arbitrariness). The friction is purely due to a lack of common knowledge about which system is now active. A rule + training solves this immediately.

  **4. Surgery day (Tuesday vs. Thursday)**
  *   **Lewis Score:** 8/10
  *   **Convergence:** Mostly
  *   **Reasoning:** This relies on **Precedent**, which Lewis identifies as a major driver of convention. "Tuesday has always been Tuesday" creates a Schelling focal point. The fact that staff can't articulate why Thursday is bad other than it not being Tuesday confirms the arbitrariness. However, there may be hidden logistical dependencies (supply chains, specialist availability) that make Tuesday *actually* better, which complicates the "arbitrariness." A rule will work, but you may face passive resistance until the new focal point settles.

  **5. Phone answer (Script vs. Own Way)**
  *   **Lewis Score:** 4/10
  *   **Convergence:** Mostly (with friction)
  *   **Reasoning:** While a phone script is inherently arbitrary (Lewisian), the resistance here is about **Autonomy and Identity** ("likes answering it her way," "insisted theirs was better"). This turns a coordination game into a "Battle of the Sexes" (coordination with conflicting preferences). They aren't just coordinating; they are asserting professional style. A rule will force behavioral convergence, but not attitudinal convergence, leading to potential sabotage or morale issues.

  ***

  ### Ranking: Most Convention-Like to Least

  1.  **Drug bin labels** (10/10)
  2.  **Appointment slots** (9/10)
  3.  **Surgery day** (8/10)
  4.  **Phone answer** (4/10)
  5.  **Chart notes** (2/10)

  ***

  ### The Problem with the Last Item (Chart Notes)

  **Chart Notes** is the least convention-like because it is not a convention problem at all; it is a **Normative Dispute regarding Professional Efficacy**.

  In Lewis's framework, a convention works because the *content* of the rule doesn't matter, only the *agreement* does. By trying to solve the Chart Notes issue with a "clear rule" (a conventional solution), you are treating it as if the format is arbitrary.

  However, your vets are framing this as a **Truth Claim**. They believe SOAP objectively leads to better clinical reasoning and patient safety. When you impose a rule that contradicts a staff member's belief about professional competence or safety, you aren't asking them to coordinate; you are asking them to violate their professional norms.

  **Why it isn't budging:**
  You cannot solve an epistemic dispute (what is the *best* way to practice medicine) with a coordination solution (what is the *agreed* way to practice).
  *   **If SOAP is actually better:** You need to prove it with evidence/training, not a memo.
  *   **If SOAP is not better:** You need to acknowledge the arbitrariness explicitly to the North vets to downgrade their "truth claim" to a "preference," thereby converting it into a convention they can accept for the sake of the merger.

  Until you address the claim of *superiority* rather than the claim of *uniformity*, a rule will be viewed as managerial interference in clinical judgment, not a necessary coordination tool.
