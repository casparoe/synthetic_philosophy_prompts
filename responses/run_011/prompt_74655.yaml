prompt: |-
  I trade on a play-money forecasting site for a class, and I got wrecked last month in a way that's stuck with me. There was a market on whether the US would be in a recession by a certain date, and I went long because basically every indicator I could read pointed at contraction — jobs revisions, the yield curve, soft retail sales. Then the market resolved NO, because the rule pointed at a business-cycle committee at a private research outfit and that committee hadn't declared anything inside the window (turns out they can take the better part of a year). Same pattern with the election markets: they don't pay out on certified results, they pay out on whether a designated news agency has called the race, which is a judgment made by a small desk at some point in the night. And when people complain, half the platforms say the written rule and its named source decide, technicalities included, while the other half have a fallback telling the resolver to go with the spirit of the question or common-sense consensus if the letter breaks down. My site does both at once, in different corners of the rules doc.

  So what does any of this presuppose? My instinct is that resolving on the source rather than on the event is a kind of operationalism — the recession just *is* the declaration, the winner just *is* the call — but I can't tell whether that's the real commitment or me over-reading a bit of plumbing. Reconstruct the view of facts and of measurement the practice needs, and be careful to separate what it strictly presupposes from what it merely sits comfortably with. I can see an argument that it commits nobody to anything metaphysical and is really a view about adjudication: named official sources are cheap to check and hard to fake, whereas "what actually happened" is contestable and invites manipulation, so maybe its an implicit positivism about who gets to settle disputes and nothing more. Tell me which reading the details actually favor, and mark where the practice is underdetermined — several philosophies licensing the identical rulebook.

  Then the part I actually care about: is the package coherent? The same people who insist these markets are epistemic instruments — dispersed information aggregated into a price more accurate than any expert's judgment — are the ones telling you the price is a forecast about a press release rather than about the world. And the futarchy pitch my prof likes, where the legislature sets the goals and markets pick the means because prices forecast better than committees do, seems to need the price to be about real national wellbeing and not about whatever index an agency happened to publish, or else you've built a very expensive machine for optimizing the index. Say what theory of measurement, or of testimony and authority, would let someone hold both ends at once, if any does. And finally: if you swapped report-resolution for resolve-on-the-truth, what would the institution have to turn into — who does the finding, what does that cost, and is the thing still a market at the end of it?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** The user trades on a play-money forecasting site for a class. They lost money on a recession market and election markets due to resolution rules (official declarations vs. "reality").
      *   **Core Observation:** Markets resolve based on *declarations* by specific authorities (operationalism) rather than *ontological reality* (e.g., actual recession, actual winner). Rules are sometimes contradictory (letter vs. spirit).
      *   **Question 1 (Metaphysics/Epistemology):** What does this practice presuppose about facts and measurement? Is it operationalism ("the recession *is* the declaration") or just adjudication pragmatism (cheap to check, hard to fake)? Distinguish strict presuppositions from compatible philosophies. Identify underdetermination.
      *   **Question 2 (Coherence):** Is the package coherent? Specifically, the tension between markets as *epistemic instruments* (aggregating truth) vs. markets forecasting *press releases* (Goodhart's Law/Index optimization). How does this impact Futarchy (optimizing wellbeing vs. optimizing metrics)? What theory of measurement/testimony allows holding both ends?
      *   **Question 3 (Institutional Design):** If you swapped report-resolution for resolve-on-truth, what would the institution become? Who finds facts? What's the cost? Is it still a market?

  2.  **Analyze Question 1: Metaphysics & Adjudication:**

      *   *Operationalism:* Bridgman's idea that concepts are defined by the operations used to measure them. If the market resolves on the NBER declaration, then for the market, "recession" = "NBER declaration."
      *   *Pragmatism/Positivism:* It's not about what *is*, but what can be *verified*. Logical positivism's verification principle.
      *   *Adjudication:* It's a legalistic view. The market is a contract. The contract specifies conditions.
      *   *Underdetermination:* Both a hard operationalist and a pragmatic institutionalist can agree on the rule "Resolve on NBER." The operationalist says "NBER defines reality." The pragmatist says "NBER is the focal point to avoid disputes."
      *   *Conclusion:* The practice *strictly* presupposes a criterion of *verifiability*, not necessarily a metaphysical claim about the nature of recessions. It favors an epistemic stance (how we know) over an ontological one (what is). However, it *functions* as operationalism.

  3.  **Analyze Question 2: Coherence & Futarchy:**

      *   *The Tension:* Prediction markets claim to find "truth" (epistemic efficiency). But if they resolve on metrics/declarations, they find "metric truth," not "world truth."
      *   *Goodhart's Law:* "When a measure becomes a target, it ceases to be a good measure." If markets optimize for the NBER call, they might incentivize lobbying the NBER, not preventing recession.
      *   *Futarchy:* Robin Hanson's idea. Vote on values, bet on beliefs. If the "value" metric is flawed (e.g., GDP vs. Wellbeing), the market optimizes the flaw.
      *   *Reconciliation:* A theory of *proxy validity*. The declaration must be a sufficiently accurate proxy for the reality *most of the time*, or the cost of error is lower than the cost of dispute. Or, a theory of *social construction*: For many political/economic facts, the declaration *creates* the consequence (e.g., if the AP calls the election, the loser concedes; the call *makes* the winner).
      *   *Coherence Verdict:* It is *pragmatically* coherent but *theoretically* fragile. It works for "social facts" (who is president) but fails for "brute facts" (did it rain) if the proxy diverges. It requires a "trust but verify" epistemology where the authority is assumed to track reality closely enough.

  4.  **Analyze Question 3: Resolve-on-Truth:**

      *   *The Shift:* Moving from "What did the BLS say?" to "What was the actual unemployment rate?"
      *   *The Mechanism:* Needs an oracle. Decentralized Oracle Networks (Chainlink style)? A court system?
      *   *The Cost:* Massive. Disputes explode. Liquidity dries up because resolution is delayed/uncertain.
      *   *The Institution:* Becomes more like a court or an insurance adjuster than a betting exchange.
      *   *Market Viability:* Likely collapses. Prediction markets rely on fast, cheap, unambiguous resolution. "Truth" is slow, expensive, and ambiguous.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Analytical, philosophical, slightly academic but accessible (matching the user's sophistication).
      *   *Structure:*
          1.  **The Ontology of the Resolution Rule:** Operationalism vs. Adjudication.
          2.  **The Coherence Problem:** Epistemic Instrument vs. Index Optimization (Goodhart/Futarchy).
          3.  **The Counterfactual:** Resolve-on-Truth and Institutional Collapse.
      *   *Key Concepts to Weave In:* Bridgman's Operationalism, Logical Positivism (Verificationism), Social vs. Brute Facts (Searle), Goodhart's Law, Oracle Problem (Crypto context), Transaction Costs (Coase).

      *(Self-Correction during drafting)*: I need to make sure I don't just say "it's operationalism." I need to highlight the *underdetermination* the user asked for. A legal contractarian view looks the same as operationalism from the outside.
      *Refining the Futarchy point:* The user mentions their prof likes futarchy. I need to be specific about why resolve-on-report breaks futarchy. It turns governance into "metric manipulation."
      *Refining the "Truth" section:* Don't just say "it's hard." Explain *why* it changes the nature of the institution (from market to court).

  6.  **Final Polish:** Check against the prompt's specific constraints.
      *   "Reconstruct the view of facts and of measurement the practice needs." -> Done (Verifiability over Truth).
      *   "Separate what it strictly presupposes from what it merely sits comfortably with." -> Done (Presupposes verifiability; sits comfortably with operationalism).
      *   "Mark where the practice is underdetermined." -> Done (Contractarian vs. Ontological).
      *   "Is the package coherent?" -> Done (Fragile coherence via proxy theory).
      *   "What theory of measurement... would let someone hold both ends at once?" -> Done (Instrumentalism/Proxy Validity).
      *   "If you swapped report-resolution for resolve-on-the-truth..." -> Done (Oracle/Court hybrid, high friction).

  7.  **Final Review of the "Recession" Example:** The user lost because NBER didn't declare. This is a classic "Brute Fact" (economic contraction) vs. "Institutional Fact" (NBER declaration). I should use Searle's distinction.

  8.  **Output Generation** (Proceed to write the response following this structure).
answer: |-
  This is a sharp diagnosis of the structural tension in prediction markets. You have identified the gap between the *ontology* of the event (what happened in the world) and the *epistemology* of the settlement (what can be proven to the platform).

  Here is a reconstruction of the metaphysical and institutional commitments of your platform, an analysis of the coherence problem regarding futarchy, and a look at the counterfactual "truth-based" institution.

  ### 1. The Ontology of the Resolution Rule: Operationalism or Adjudication?

  You asked whether resolving on a source rather than the event is a commitment to **operationalism** (the concept *is* the measurement) or merely **adjudication pragmatism** (the measurement is just the cheapest way to settle a bet).

  **The Strict Presupposition: Verificationism**
  Strictly speaking, the practice does not presuppose operationalism. It presupposes **verificationism**.
  Logical positivism holds that a statement is only cognitively meaningful if it can be empirically verified. Your market rules take this a step further: a fact is only *settlable* if it can be verified by a specific, pre-designated public record.
  *   **What it strictly requires:** A criterion of *intersubjective agreeability*. The platform needs a "God's eye view" that is accessible to all participants simultaneously without dispute. A named report (NBER, AP, BLS) provides a single coordinate in information space that everyone can point to.
  *   **What it does not require:** It does not require the belief that the NBER declaration *constitutes* the recession. The rulebook can remain agnostic on whether the economy actually contracted. It only requires that the *contract* is defined by the declaration.

  **The Underdetermination**
  This is where your intuition about "over-reading" is correct. The same rulebook is compatible with two conflicting philosophies:
  1.  **The Contractarian View:** The market is a legal derivative. The underlying asset is not "The US Economy," it is "The NBER Press Release." There is no metaphysical claim here, only a definition of the security. This sits comfortably with realism (there is a real recession, but we aren't betting on that).
  2.  **The Operationalist View:** For the purposes of the market, the declaration *is* the fact. This is a functional operationalism. If the price moves on the rumor of the declaration, the market is pricing the declaration.

  **Why the Practice Favors Adjudication over Truth**
  The details favor the **adjudication** reading because of the "spirit of the question" fallback you mentioned. If the platform were a true operationalist, the rule would be absolute: *If NBER says no, the answer is no, even if GDP dropped 10%.*
  The existence of a "common-sense consensus" clause reveals that the platform *wants* to track reality but treats official sources as a **proxy** to minimize transaction costs. They are prioritizing *resolution speed* and *dispute avoidance* over *ontological accuracy*. They are building a court system, not a metaphysics engine.

  ### 2. The Coherence Problem: Epistemic Instruments vs. Index Optimization

  You ask if the package is coherent: Can you claim markets aggregate truth while resolving on press releases, and still pitch futarchy (governance by prediction market)?

  **The Tension**
  There is a fundamental incoherence here, often described in economics as **Goodhart's Law**: "When a measure becomes a target, it ceases to be a good measure."
  *   **Epistemic Claim:** Markets discover information about the world ($W$).
  *   **Resolution Rule:** Markets settle on a metric/report ($M$).
  *   **The Gap:** If $M$ diverges from $W$, the market price becomes a forecast of $M$, not $W$.

  In your recession example, the market was not forecasting economic contraction; it was forecasting *bureaucratic latency*. You priced the economy; the market resolved the bureaucracy.

  **Is there a Theory that Saves It?**
  To hold both ends at once (Markets find truth + Markets resolve on reports), you need a theory of **Proxy Validity** combined with **Social Construction**.
  1.  **Proxy Validity:** You must assume that for the relevant class of events, the Report ($M$) is a sufficiently accurate lagging indicator of the World ($W$) that the difference is noise. This works for elections (AP call $\approx$ Winner) but fails for recessions (NBER call $\ll$ Contraction).
  2.  **Social Construction (Searle's Institutional Facts):** For some events, the Report *creates* the World. If the AP calls an election, the loser concedes, the transition begins, and the power transfers. The "call" is a performative utterance that brings the reality into being. In these cases, forecasting the report *is* forecasting the world.

  **The Futarchy Breakdown**
  This is where your professor's pitch faces the biggest risk. Futarchy relies on markets setting policy based on outcomes (e.g., "Pass Bill X if the market predicts GDP will rise").
  *   If resolution is based on **official statistics**, the market incentivizes **metric manipulation**. Traders will lobby the Bureau of Labor Statistics to revise numbers rather than improving the economy.
  *   To save futarchy, you need a theory of **Incentive-Compatible Measurement**. You must assume the measurement body is incorruptible and perfectly aligned with reality. Since no such body exists, futarchy strictly requires resolve-on-truth, or it becomes a machine for optimizing the measurement process rather than the underlying value.

  **Verdict:** The package is *pragmatically* coherent for liquid, high-frequency events (elections, Fed rates) where the declaration is effectively the reality. It is *theoretically* incoherent for slow, subjective, or manipulable metrics (recessions, wellbeing, climate damage) unless you accept that you are governing the index, not the territory.

  ### 3. The Counterfactual: Resolve-on-Truth

  If you swapped report-resolution for "resolve-on-the-truth" (e.g., "Was the US actually in recession?"), the institution would undergo a phase change.

  **The Mechanism: The Oracle Problem**
  You would need a decentralized oracle network or a specialized court.
  *   **Who does the finding?** You cannot rely on a single report. You would need a panel of experts, a jury of token holders, or a cryptographic verification system.
  *   **The Cost:** Dispute resolution costs would skyrocket. Every market close would invite arbitration. "What is a recession?" is a contested economic definition, not a binary data point.
  *   **Liquidity Collapse:** Market makers hate ambiguity. If resolution takes 6 months and involves a court case, spreads widen, and volume dries up. The "play-money" aspect protects you from financial loss, but in a real-money environment, this friction kills the market.

  **The Institutional Shift: From Market to Court**
  A truth-resolving prediction market ceases to be a market and becomes a **futarchic court**.
  *   **Current Model:** Information aggregation via price discovery. Settlement is automated/algorithmic based on public data.
  *   **Truth Model:** Adversarial information presentation. Traders would submit evidence briefs rather than just buying shares. The "price" would be a probabilistic verdict rendered by a judge/oracle.

  **Is it still a market?**
  Technically, yes, but functionally, no. It becomes an **insurance adjudication engine**.
  *   **Markets** thrive on standardization and fast settlement.
  *   **Truth** requires nuance, context, and time.
  By forcing the market to resolve on truth, you import the friction of the legal system into the trading engine. You solve the Goodhart's Law problem (no more optimizing the index) but you introduce the **Oracle Corruption** problem (who watches the watchmen?). If the "truth finders" can be bribed or are simply slow, the market efficiency vanishes.

  ### Summary

  Your loss wasn't a failure of your economic analysis; it was a collision with the platform's **epistemic boundary**.
  1.  **Presupposition:** The platform presupposes **verifiability**, not truth. It is a contractarian system disguised as an epistemic one.
  2.  **Coherence:** It is coherent only where the *map* (the report) is identical to the *territory* (the event). In futarchy, this is dangerous; it invites governance by metric manipulation.
  3.  **Alternative:** Resolving on truth transforms the market into a court, increasing costs and killing liquidity.

  The "plumbing" you noticed is actually the load-bearing wall. The market works *because* it ignores the truth in favor of the record. The tragedy is that for the specific markets you traded (recessions), the record is a poor proxy for the truth, making the market an instrument for betting on bureaucratic lag rather than economic reality.
