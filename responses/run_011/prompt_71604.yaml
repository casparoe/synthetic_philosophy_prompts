      *   **Mechanics of the Miracle:** Is Clarence's intervention "surgical" (Woodward) or "fat-handed"? Is the divergence small/late (Lewis) or enormous/early? Issues of transworld identity (who is Mary if George never existed?).
      *   **Constraints:** Faithful to both film and philosophy (don't reduce one to the other). Be direct about where hypotheses overreach. Identify specific scenes. No bibliography/quotes needed. Accessible to philosophers and non-philosophers. End with a section on what the film adds to the debate that argument alone cannot.

  2.  **Deconstruct Hypothesis 1: N=1 vs. Invariance:**
      *   *Lewis:* Causation is about counterfactual dependence. If $C$ hadn't happened, $E$ wouldn't have. We need the "nearest possible world." Clarence shows *the* nearest world (presumably). So, Lewis is satisfied. George sees $E$ (bad town) depends on $\neg C$ (no George).
      *   *Woodward:* Causation is about invariant generalizations under interventions. We need to know if changing $C$ changes $E$ across a *range* of conditions. One data point ($\neg George \rightarrow$ Pottersville) doesn't show invariance. Maybe George only matters in *this* specific configuration.
      *   *Film Reality:* George accepts the evidence immediately. He doesn't ask, "But what if I had been born but moved to New York?" He accepts the singular counterfactual as proof of his worth.
      *   *Verdict:* The asymmetry is real. The film *does* rely on the Lewisian intuition that seeing *the* alternative is enough. Woodward would demand more robustness checks.

  3.  **Deconstruct Hypothesis 2: Absence and Prevention:**
      *   *The Claim:* George's impact is mostly stopping bad things (Harry drowning, Old Man Gower poisoning kids, Potter monopolizing, the Run on the Bank).
      *   *Lewis:* Struggles with "omissions" or "absences" as causes. Is "not being there" an event? Lewis had to do some gymnastics here.
      *   *Woodward:* Variables can take values like "Absent" or "Present." Intervention on $George = 0$ is just as valid as $George = 1$. Interventionism handles absence causation naturally.
      *   *Critique of the Claim:* Is it *all* absence? George also *built* Bailey Park. That's a positive action. He *married* Mary. That's a positive action. The hypothesis overreaches if it claims *entirely* negative causation. It's a mix, but the *dramatic* weight is on the disasters prevented (Harry alive, Gower not in jail, Mary not a spinster).
      *   *Verdict:* The hypothesis is strong but needs nuance. The "prevention" aspect is dominant in the *horror* of Pottersville, but Bailey Park exists as a positive counterfactual to slums. Interventionism handles the absence part better, but the film treats absence as a palpable presence (Pottersville).

  4.  **Deconstruct Mechanics of the Miracle:**
      *   *Surgical vs. Fat-handed:* Removing a person at conception is the ultimate fat-handed intervention. It changes genetics, conversations, movements, everything. Woodward requires isolating the variable. Clarence fails this. He removes the *person*, not just the *influence*.
      *   *Lewisian Divergence:* Lewis wants a "small miracle" divergence late in the timeline to keep worlds similar. Clarence diverges at George's *conception* (or birth). This creates massive divergence. The world is *very* different (Mary is a librarian/spinster, not George's wife).
      *   *Transworld Identity:* This is a major philosophical problem. If George isn't born, Mary Hatch doesn't marry George Bailey. Is she the "same" Mary? The film treats her as the same person (same name, same father) but different life trajectory. This is philosophically messy but narratively necessary.
      *   *Held Fixed:* The film holds fixed the *traits* of others (Potter is still greedy, Harry is still reckless) but changes their *fates* based on George's absence. Is it entitled to? Not really. If George isn't born, maybe Harry is raised differently and isn't reckless? The film assumes character essentialism.

