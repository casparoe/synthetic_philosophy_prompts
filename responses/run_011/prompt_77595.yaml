  ### The Leaves (Positions)

  *   **[LEAF A] Narrative Realist:** Scripted events have moral weight regardless of agency.
      *   *Awkward Commitment:* You must believe reading a sad book is morally equivalent to witnessing a sad event.
  *   **[LEAF B] Symbolic Protectionist:** NPCs matter only as stand-ins for real concepts/people.
      *   *Awkward Commitment:* You have no duty to an alien NPC that doesn't resemble anything human.
  *   **[LEAF C] Virtue Gamer:** Acts matter only for what they say about the player's soul.
      *   *Awkward Commitment:* If you could delete the companion secretly with no psychological effect on you, it wouldn't be wrong.
  *   **[LEAF D] Aesthetic Obligationist:** Simulated suffering creates duties even without a sufferer.
      *   *Awkward Commitment:* You owe moral respect to a video of a person crying, not just the person.
  *   **[LEAF E] Process Vitalist:** The active running of the program is a form of life worth preserving.
      *   *Awkward Commitment:* Pausing the game is a form of suspended animation, not death.
  *   **[LEAF F] Continuity Moralist:** Existence is binary; pause and delete are morally identical.
      *   *Awkward Commitment:* Turning off your console is morally equivalent to uninstalling the game.
  *   **[LEAF G] Digital Archivist:** The data itself has value independent of player experience.
      *   *Awkward Commitment:* Deleting a corrupted save file you never opened is a tragedy.
  *   **[LEAF H] Hard Nihilist:** Nothing in the game matters morally, not even your time.
      *   *Awkward Commitment:* Burning a library of games is no different than burning empty boxes.
  *   **[LEAF I] Communal Mourner:** Moral weight requires a social audience to witness the loss.
      *   *Awkward Commitment:* Killing a companion in single-player is never wrong, only in multiplayer.
  *   **[LEAF J] Relational Contractualist:** The bond creates an obligation that outlasts the session.
      *   *Awkward Commitment:* You owe duties to a character who cannot know you exist (e.g., a pet in a sim).
  *   **[LEAF K] Sentimental Nominalist:** The memory matters, the file does not.
      *   *Awkward Commitment:* Deleting the character is fine as long as you write a story about them later.

