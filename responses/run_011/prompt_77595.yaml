  Here is the decision tree designed for your Discord server. It contains **12 decision nodes** (questions). It is designed to be copied into a channel or made into a visual image.

  ### The "Do Pixels Bleed?" Flowchart

  **Start at Q1. Follow the arrows until you hit a [LEAF].**

  **Q1: The Fiction Veto**
  " It's just a game." Does the label **fiction** automatically mean nothing done inside it is wrong *for the character's sake*?
  *(Technical: Fictional Anti-Realism)*
  *   **Yes** → Go to **Q8** (You think only real-world consequences matter).
  *   **No** → Go to **Q2** (You think in-game acts can have in-game victims).

  **Q2: The Script Test (JRPG Case)**
  The villager begs you not to kill her brother. It is pre-written; she could not have said anything else. Does **lack of choice** mean she cannot be harmed?
  *(Technical: Determinism / Alternate Possibilities)*
  *   **Yes** → Go to **Q4** (Scripting kills moral status).
  *   **No** → Go to **Q3** (Scripted pain still counts).

  **Q3: The Representation Check**
  If scripted pain counts, is it wrong because *she* suffers, or because she is **about** a real human concept (like a brother)?
  *(Technical: Representationalism)*
  *   **Because she suffers** → **[LEAF A] Narrative Realist**
  *   **Because she's about a brother** → **[LEAF B] Symbolic Protectionist**

  **Q4: The Simulation Test (Horse Case)**
  The horse panics (stats + animation). You know it's a lookup table; it feels nothing. Does **looking like it suffers** create a duty, even if no one feels?
  *(Technical: Phenomenal Consciousness vs. Behavioral Cues)*
  *   **Yes** → Go to **Q5** (Appearance creates obligation).
  *   **No** → Go to **Q6** (Need more than animation).

  **Q5: The Creepiness Check**
  If you hurt the looking-suffering horse, is it wrong because it hurts *the horse*, or because it makes *you* look like a creep to others?
  *(Technical: Intrinsic Wrong vs. Social Virtue)*
  *   **Makes me a creep** → **[LEAF C] Virtue Gamer**
  *   **Hurts the horse** → **[LEAF D] Aesthetic Obligationist**

  **Q6: The Surprise Test (LLM Case)**
  The AI townsperson remembers you. She is math, but you can't predict her next sentence. She says, "Don't close me." Does the fact that her future is **unknown** grant her weight?
  *(Technical: Predictability / Open Future)*
  *   **Yes** → Go to **Q7** (Uncertainty matters).
  *   **No** → Go to **Q8** (Math can't have a stake).

  **Q7: The Pause Test**
  If you pause the game forever, she waits. If you delete, she stops. For something that can't feel, is **stopping** worse than **waiting**?
  *(Technical: Cessation vs. Stasis)*
  *   **Stopping is worse** → **[LEAF E] Process Vitalist**
  *   **Waiting = Stopping** → **[LEAF F] Continuity Moralist**

  **Q8: The Investment Test (Roguelike Case)**
  Companion deleted after 40 hours. You know they were code. Is the loss wrong because **you** invested time, or because **they** were lost?
  *(Technical: Instrumental vs. Intrinsic Value)*
  *   **Because I invested** → Go to **Q9** (Player-focused).
  *   **Because they were lost** → **[LEAF G] Digital Archivist**

  **Q9: The Deletion Distinction**
  Is deleting the file a different kind of wrong than **hurting** them while they run?
  *(Technical: Existence vs. Welfare)*
  *   **Yes, deletion is unique** → Go to **Q10**.
  *   **No, harm is harm** → **[LEAF H] Hard Nihilist** (You only care about your time).

  **Q10: The Social Wall**
  The memorial wall is seen by other players. Does the wrongness depend on **others seeing** your loss?
  *(Technical: Social Constructivism)*
  *   **Yes, needs witnesses** → **[LEAF I] Communal Mourner**
  *   **No, private loss matters** → Go to **Q11**.

  **Q11: The Bond Check**
  Is the duty to the companion because of the **relationship** you built, or because destroying them damages **your character**?
  *(Technical: Relational Ethics vs. Virtue Ethics)*
  *   **Damages my character** → **[LEAF C] Virtue Gamer** (Re-joined)
  *   **The relationship** → Go to **Q12**.

  **Q12: The Ghost Check**
  If the server shuts down, the bond is broken anyway. Does the **permanence** of the file matter if the relationship ends regardless?
  *(Technical: Persistence Conditions)*
  *   **Yes, file must survive** → **[LEAF J] Relational Contractualist**
  *   **No, memory is enough** → **[LEAF K] Sentimental Nominalist**

