      *   **Restricted Utility:** Earthquake works for *logistics* (first 72 hours). Crime works for *prevention*. Bank Run works for *market stabilization*.
      *   **Conclusion/Synthesis:** No single analogy suffices. Propose a "Systemic Failure" or "Infrastructure Collapse" analogy? Or argue for a *sequence* of analogies. Let's argue for a *layered* approach: The *mechanism* is a Bank Run (entitlement collapse), the *cause* is often a Crime (policy failure), but the *response* often requires Earthquake protocols (neutral logistics) to succeed before Justice can be served.

