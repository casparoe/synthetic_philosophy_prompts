answer: |-
  # The Ambiguity-Aware Grant Protocol

  **Purpose:** To replace fake precision (single-point probabilities) with honest uncertainty (ranges and bounds) for high-ambiguity proposals.
  **Time Cost:** 45–60 minutes per proposal.
  **Audience:** Board members who need to see the *shape* of the risk, not a fabricated number.

  ## Part 1: The Procedure

  ### Step 1: The Evidence Audit (10 mins)
  *Goal: Classify the type of uncertainty. Do not assign numbers yet.*
  Ask: **What is the source of the missing data?**
  *   **Type A (Risk):** Frequencies exist (e.g., historical failure rates of similar grants). *Action: Proceed to Step 2.*
  *   **Type B (Ambiguity):** Mechanism is plausible, but frequencies are unknown (e.g., new pathogen in a new region). *Action: Proceed to Step 2.*
  *   **Type C (Ignorance):** Mechanism is theoretical; no pilot, no analogy, no data. *Action: Default to "Pass" unless Step 4 overrides.*
  *   **Type D (Self-Inflicted):** Evidence *could* exist but was not generated by the applicant (e.g., skipped cheap pilot). *Action: Flag for Step 3.*

  **Sufficient Answer:** You must be able to write one sentence: *"We lack data because [reason]."* If the reason is "we didn't look," it is Type D.

  ### Step 2: The Bound Test (15 mins)
  *Goal: Satisfy the Ex-Trader without lying. Replace point estimates with ranges.*
  Ask: **What is the widest reasonable range for Success Probability and Impact?**
  *   Do not pick a number. Pick a floor and a ceiling.
  *   **Probability Range:** "Between X% and Y%." (If the floor is 0%, you are in Type C Ignorance).
  *   **Impact Range:** "Between $A and $B" or "Between Local Fix and Global Transformation."
  *   **The Spread:** If the gap between floor and ceiling is >50% of the ceiling, the proposal is **Unbounded**.

  **Sufficient Answer:** A written range. If you cannot justify a floor >0%, the proposal is a lottery ticket, not an investment.

  ### Step 3: The Competence Check (10 mins)
  *Goal: Address Type D (Self-Inflicted) Ambiguity.*
  Ask: **Is the ambiguity a feature of the world or a bug of the applicant?**
  *   If the applicant chose not to run a cheap test that would have narrowed the Bound Test (Step 2), this is not "emerging risk." This is "negligent planning."
  *   **Rule:** Self-inflicted ambiguity counts as negative evidence. It reduces the Probability Floor.

  **Sufficient Answer:** Yes/No. If Yes, the recommendation defaults to "Pass" unless the upside is civilization-saving (see Step 5).

  ### Step 4: The Bias Mirror (10 mins)
  *Goal: Address the Ellsberg Paradox (your own ambiguity aversion).*
  Ask: **Am I rejecting this because it's risky, or because I don't understand the domain?**
  *   **The Expert Test:** If a trusted expert in *that specific field* said this was the best bet, would I still hesitate?
  *   **The Familiarity Test:** Am I favoring the "Boring RCT" (Case 1) because it works, or because I know how to read the stats?
  *   **Correction:** If you hesitate only because you lack domain expertise, widen the Probability Range (Step 2) rather than shrinking it. Do not collapse the range to zero.

  **Sufficient Answer:** A written note: *"My hesitation is due to [Domain Gap / Actual Risk]."*

  ### Step 5: The Values Handoff (10 mins)
  *Goal: Tell the Board where math ends and philosophy begins.*
  Ask: **What must the Board accept to fund this?**
  *   If the Probability Floor is 0% but the Impact Ceiling is "Save Humanity," this is a **Values Bet**.
  *   If the Probability Range is tight but the Impact is low, this is a **Maintenance Bet**.
  *   If the Ambiguity is Self-Inflicted, this is a **Trust Bet**.

  **Sufficient Answer:** A single sentence for the Board: *"Funding this requires accepting a [X]% chance of total loss in exchange for [Y] upside."*

  ***

  ## Part 2: The One-Page Brief Template

  **Proposal:** [Name]
  **Recommendation:** [Fund / Pass / Defer]
  **Uncertainty Class:** [Risk / Ambiguity / Ignorance]

  **1. The Numbers (Ranges, not Points)**
  *   **Probability of Success:** [Low %] – [High %]
  *   **Impact Scale:** [Minimum Outcome] – [Maximum Outcome]
  *   **Spread:** [Narrow / Wide / Unbounded]

  **2. The Evidence Gap**
  *   **Missing Data:** [What specific frequency is unknown?]
  *   **Source of Ambiguity:** [Natural / Self-Inflicted]

  **3. The Bias Check**
  *   **Analyst Confidence:** [High / Medium / Low]
  *   **Domain Familiarity:** [Expert / Novice]
  *   **Adjustment:** [Did you widen the range to compensate for your own ignorance?]

  **4. The Board Handoff (Values Question)**
  *   **To Fund, The Board Must Accept:** [The specific risk/trade-off]
  *   **Falsifier:** [What evidence in 12 months would prove this was a bad decision?]

  ***

  ## Part 3: Application to Three Cases

  ### Case 1: The Boring RCT
  *14 randomized trials, modest effect, scalable, average cost.*
  *   **Step 1 (Audit):** Type A (Risk). Frequencies exist.
  *   **Step 2 (Bounds):** Prob: 80%–90%. Impact: Modest/Linear. Spread: Narrow.
  *   **Step 3 (Competence):** N/A. Evidence is robust.
  *   **Step 4 (Bias):** Analyst may undervalue due to "boredom" or mandate drift.
  *   **Step 5 (Handoff):** Board must accept "Mission Drift" (this is proven, not emerging).
  *   **Recommendation:** **FUND (Portfolio Anchor).**
  *   **Why:** You need a baseline. A portfolio of only "emerging risks" is indistinguishable from gambling. This grant buys the foundation credibility and stabilizes the portfolio variance.
  *   **Brief Line:** *"To Fund, The Board Must Accept: This is not emerging risk; it is portfolio insurance."*

  ### Case 2: The Novel Moonshot
  *Plausible mechanism, 1 small pilot (no control), 10x upside.*
  *   **Step 1 (Audit):** Type B (Ambiguity). Mechanism plausible, frequencies unknown.
  *   **Step 2 (Bounds):** Prob: 5%–60%. Impact: High. Spread: **Unbounded** (55% gap).
  *   **Step 3 (Competence):** Natural ambiguity.
  *   **Step 4 (Bias):** Analyst likely *overvalues* this due to "visionary" identity.
  *   **Step 5 (Handoff):** Board must accept a >50% chance of total loss.
  *   **Recommendation:** **PASS.**
  *   **Why (The Unpalatable Truth):** You will not like this. You want to fund the 10x upside. But under this protocol, an Unbounded Spread with no control group fails the Bound Test. The "10x upside" is a narrative, not a bound. Without a control, you cannot distinguish signal from noise. This is the "Black/Yellow urn" bet. You are being asked to bet on Black without knowing if there are any black balls.
  *   **Brief Line:** *"To Fund, The Board Must Accept: We are buying a lottery ticket, not making an investment. The upside is theoretical, not bounded."*

  ### Case 3: The Self-Inflicted Gap
  *Novel intervention, applicant skipped cheap pilot, claims "urgency."*
  *   **Step 1 (Audit):** Type D (Self-Inflicted).
  *   **Step 2 (Bounds):** Prob: 0%–50%. (Floor dropped due to Step 3).
  *   **Step 3 (Competence):** **Negative Signal.** Ambiguity is a choice.
  *   **Step 4 (Bias):** Analyst may feel sympathy for "small applicant."
  *   **Step 5 (Handoff):** Board must accept funding incompetence.
  *   **Recommendation:** **PASS.**
  *   **Why:** This is the mirror-image failure. Ambiguity is being used to hide a bad bet. If they could have generated evidence for $50k and didn't, they are not ready for $2M.
  *   **Brief Line:** *"To Fund, The Board Must Accept: The applicant has demonstrated an inability to manage risk, increasing the likelihood of execution failure."*

  ***

  ## Part 4: Limitations & Judgment Calls

  **Where This Procedure Misfires:**
  1.  **The "Black Swan" Blind Spot:** This protocol favors bounded risks. It will systematically reject the one-in-a-million proposal that actually changes the world (Case 2). You are trading "missed moonshots" for "fewer wasted grants." Acknowledge this trade-off to the Board.
  2.  **The Range Anchor:** Analysts still have to pick the floor and ceiling numbers in Step 2. You can still game this by picking a wide range to make a bad bet look "uncertain" rather than "bad." The Bias Mirror (Step 4) is the only check against this, and it relies on your honesty.
  3.  **Mission Drift:** Case 1 (The RCT) is the strongest recommendation mathematically, but it may violate your "emerging risk" mandate. The procedure identifies this, but it cannot solve it. That is a strategic question for the Board, not an analytical one for you.

  **The Judgment Calls Dressed as Procedure:**
  *   **Step 2 (The Bounds):** There is no formula for setting the floor. If you set the floor at 5% instead of 0%, you are making a value judgment about "plausibility."
  *   **Step 4 (The Bias):** You are the one checking your own bias. If you are convinced you are right, this step does nothing.
  *   **Step 5 (The Handoff):** Deciding what counts as a "Values Bet" versus a "Bad Bet" is ultimately philosophical. The procedure forces you to label it, but it cannot decide it for you.

  **Final Note for the Board:**
  When you hand this brief to the Ex-Trader, point to the **Probability Range**. When you hand it to the Pediatrician, point to the **Worst-Case Floor**. When you hand it to yourself, read the **Bias Mirror** before you walk into the meeting.
