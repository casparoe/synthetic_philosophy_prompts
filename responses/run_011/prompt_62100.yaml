      *   Owain claims sentience isn't randomly distributed. Niamh isn't claiming it is. She's claiming *our knowledge* is uncertain. Owain is confusing *aleatory* uncertainty (inherent randomness) with *epistemic* uncertainty (lack of knowledge). This is a crucial philosophical distinction. Owain is wrong here.

