  2.  **Deconstruct the Argument:**
      *   **The Core Issue:** The "Scale Argument" (often associated with effective altruism and insect welfare). Premise: Huge numbers of insects $\times$ Non-zero probability of sentience = Huge expected moral value. Conclusion: We should prioritise insect welfare.
      *   **Move (1) Niamh:** Expected Value (EV) reasoning. Low probability $\times$ Huge $N$ = High Expected Suffering. Ignoring this is indefensible.
