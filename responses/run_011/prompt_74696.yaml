answer: |-
  **Brainstorming**

  *   **Anti-Reductionism (Ruth/Reid):**
      *   *Strong Case:* Testimony is a basic source of knowledge, akin to perception. Without a default presumption of truth, communication collapses, and history becomes impossible where documents don't exist.
      *   *Unsolvable Problem:* The "False Positive" risk. If trust is the default, sincere errors (like the 6-year-old's misremembered trauma) enter the archive as fact before a defeater is ever found.
  *   **Reductionism (Malik/Hume):**
      *   *Strong Case:* Testimony derives authority from inductive evidence of reliability. An institution has a duty to verify claims against independent data to maintain credibility.
      *   *Unsolvable Problem:* The "Silence" risk. In cases like the 1911 fire (courthouse records burned), independent verification is impossible. Strict reductionism demands we discard the only history we have.
  *   **Intake-Rule Restatement:** How do we codify a policy that preserves unique oral histories when independent verification is impossible, without institutionalizing falsehoods that damage our credibility?

  ***

  **The Archive, 8:45 PM**

  The fluorescent lights hummed over the metal table. Stacks of reel-to-reel boxes sat between them like barricades.

  **Ruth:** "Okay, first pass. 'Oral histories are accepted as attested fact unless specific internal or external defeaters are identified at the time of intake.'"

  **Malik:** "That's the Reid position. Default trust."

  **Ruth:** "It's the only way to function, Malik. We aren't a court. We're a memory bank. If we demand proof for every sentence, we throw away the community's voice."

  **Malik:** "It works until it doesn't. Take the mill fire tape. At intake, there were no defeaters. She sounded confident. She was consistent. By your rule, we cataloged it as 'Attested Fact.' Now we look like fools. Your rule lets errors in faster than corrections can go out."

  **Ruth:** "Because we found a defeater *later*. Her age. But you can't demand we know what we don't know yet. What's your alternative? 'Accept nothing without non-testimonial corroboration'?"

  **Malik:** "Close. 'Claims are categorized as verified only when supported by independent documentary or physical evidence.'"

  **Ruth:** "And there it is. The 1948 courthouse fire. You know as well as I do that for the 1911 mill fire, the independent evidence *burned*. There is no document. There is no physical trace. Under your rule, the most significant event in this county's history becomes 'unverified.' You're erasing history because the paper trail died."

  **Malik:** "I'm not erasing it. I'm labeling it accurately. If all we have is stories, we should say 'This is a story,' not 'This is fact.' An archive isn't a believer, Ruth. It's a distributor. If I tell a user this data is 'attested,' I'm vouching for it. I can't vouch for a six-year-old's memory of a fire she wasn't at."

  **Ruth:** "But she wasn't lying. She was remembering what her mother told her. That's how history works! It chains. Mother to daughter, neighbor to neighbor. If you break the chain because the first link isn't written down, you lose everything oral."

  **Malik:** "Then we need a rule that handles the chain. Round two. 'Oral testimony is accepted as attested if the chain of transmission is documented and no single source dominates the corroboration.'"

  **Ruth:** "That's better. It addresses the echo chamber. But what if five people tell us the mill burned because of a spark, and we trace them all back to Mrs. Gable? Is that corroboration?"

  **Malik:** "No. That's one source with four amplifiers. Reductionism says that counts as *n* equals one. If Mrs. Gable was wrong, they're all wrong."

  **Ruth:** "But socially, it's real. If the whole town believes Mrs. Gable, that belief shaped the town. Isn't that historical fact enough for intake?"

  **Malik:** "For a sociology paper, maybe. For an archive claiming to preserve *what happened*? No. Look, here's the rub: You're arguing for individual epistemology. *You* can believe Mrs. Gable. But this institution? We have liability. We have donors. If we publish 'The Mill Burned Due to a Spark' based on one oral chain, and later a diary surfaces saying it was arson, we're liable for misinformation."

  **Ruth:** "So the institution must be more skeptical than the human? That feels wrong. We are stewards, not auditors. If we treat our neighbors like suspects, they stop talking. Then you have perfect data on nothing."

  **Malik:** "I'm not saying reject it. I'm saying don't *attest* to it. Here's the revision: 'All oral histories are ingested as 'Community Testimony.' They are elevated to 'Attested Fact' only upon independent verification. Unverified testimony remains accessible but flagged.'"

  **Ruth:** "So the 1911 fire stays 'Community Testimony' forever? Because the courthouse burned. You're creating a two-tier history where written records get to be 'True' and oral records get to be 'Maybe.'"

  **Malik:** "I'm creating a tier of 'Verified' vs 'Unverified.' It's not about truth, it's about support. If the courthouse burned, that's a gap in the support structure. We shouldn't hide that gap by calling it attested."

  **Ruth:** "Fine. But we need to acknowledge that 'Unverified' doesn't mean 'False.' It means 'Solely Testimonial.' And we need to agree that multiple oral chains *can* count as support, even if they aren't documents."

  **Malik:** "Only if they diverge. If one person saw the spark and another smelled the oil before the fire, that's convergent testimony. If they both say 'Mrs. Gable said spark,' that's divergenceless. I can accept that."

  **Ruth:** "Okay. So we agree on the labeling. 'Attested' requires non-testimonial support or convergent oral accounts. 'Community Testimony' is single-chain oral history."

  **Malik:** "Agreed. But we bracket the question of whether 'Community Testimony' implies falsehood. We state clearly: 'This reflects community memory, not necessarily event reality.'"

  **Ruth:** "I can live with that. It protects the archive without silencing the town."

  **Malik:** "And it protects us from the next six-year-old witness."

  **Ruth:** "One last thing. If a diary *does* surface about the 1911 fire... does that retroactively upgrade the tape?"

  **Malik:** "Yes. The status is dynamic. That's the benefit of digital archiving. We update the metadata."

  **Ruth:** "Then we aren't so far apart. You want data integrity; I want memory preservation. The flag does both."

  **Malik:** "Just don't ask me to call it 'Fact' until the diary shows up."

  **Ruth:** "And don't ask me to throw the tape away while we wait."

  ***

  **Agreement & Conditions**

  **Agreed Policy:** All oral histories are ingested as "Community Testimony." They are elevated to "Attested Fact" only upon independent documentary verification or convergent oral accounts with distinct sources. Unverified testimony remains accessible but flagged as reflecting community memory rather than confirmed event reality.

  **Bracketed:** Whether "Community Testimony" carries an implicit suggestion of falsehood (Ruth insists it does not; Malik insists it implies epistemic risk).

  **Conditions for Change:**
  *   **Ruth:** Would shift toward stricter verification if a pattern of malicious fabrication (rather than honest error) emerged in the collection.
  *   **Malik:** Would shift toward default attestation if independent records were proven systematically biased against the community's voice (e.g., if documents consistently lied about mill conditions).
