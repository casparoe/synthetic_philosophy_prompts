answer: |-
  **Project Title:** The Architecture of the Question: Stabilizing the Contrastive Explanandum in the Great Divergence

  **Project Description**

  The Great Divergence is the central problem of modern economic history. Why did sustained industrial growth emerge in Northwest Europe in the late eighteenth century rather than elsewhere? While the literature is voluminous, the debate has reached a plateau. Proponents of institutional explanations, geographic determinism, and global contingency talk past one another. This project argues that the stalemate is not due to a lack of data, but to an instability in the question itself. Specifically, the *contrastive foil*—the "rather than" clause essential to any causal explanation—shifts silently across the literature. This project will rigorously map these shifts, evaluate their legitimacy, and propose a stabilized framework for asking the Needham Question.

  **The Core Questions**

  Current explanations assume the question "Why Britain and not China?" is well-posed. This project challenges that assumption by isolating two structural flaws in the standard formulation.

  First, the **Unit Mismatch Problem**. Britain and China are not comparable units. Britain was a fiscal-military island kingdom; Qing China was a civilization-scale agrarian empire. The industrial takeoff was itself a regional phenomenon (Lancashire, the Scottish Lowlands) within the British polity. Asking why Britain industrialized instead of China is analytically akin to asking why the Yankees won the World Series instead of the American League. If the units of analysis are mismatched, candidate causes (e.g., parliamentary sovereignty vs. imperial stability) cannot be properly evaluated as difference-makers. The project asks: What is the least revisionary way to repair the unit of analysis without abandoning the historical stakes of the debate?

  Second, the **Selection Effect Problem**. Industrialization was a low-probability event, but if we assume it was going to occur *somewhere* in Eurasia given enough time, the question "Why Britain?" risks answering a necessary truth with a contingent cause. If someone had to be first, does explaining *who* was first require different evidence than explaining *why* it happened at all? This project asks: Which readings of the Divergence survive the worry that the winner was selected after the fact, and which are unanswerable in principle?

  **Why Existing Positions Leave This Open**

  The economic history literature treats the foil as a matter of data availability or comparative convenience. The "California School" shifted the foil from China-as-a-whole to the Yangzi Delta to correct for ecological bias, inadvertently changing the explanandum from national trajectory to regional constraint. Others shift the foil temporally (why the 1780s and not the 1840s) or spatially (why not the Dutch Republic?). Each swap alters which variables appear decisive. Coal looks essential against the Yangzi Delta; it looks incidental against a global energy constraint. Because these shifts are rarely flagged as theoretical commitments, scholars accumulate evidence for incompatible questions.

  Conversely, the philosophy of science literature possesses the tools to resolve this—specifically, work on contrastive explanation and difference-making—but has not applied them to a case of this magnitude. Philosophers typically analyze controlled experiments or simple causal chains. They lack the historical granularity to assess whether "England vs. Yangzi" is a valid counterfactual comparison. Consequently, historians lack the logical framework to adjudicate question validity, while philosophers lack the empirical stakes to make the framework robust. This project bridges that gap.

  **Methodology**

  This is a conceptual project, not a quantitative one. It proceeds via argument reconstruction and logical stress-testing. I will treat prominent Divergence explanations not as claims about the world, but as claims about *questions*. By formalizing the implicit contrast spaces in major works, I can demonstrate where the logic breaks down.

  This approach is necessary because new datasets cannot solve a category error. Adding more wage data or coal output figures will not resolve whether Britain and China are comparable units. Only a prior clarification of the explanandum can determine which data are relevant. The method involves three steps: (1) Taxonomizing the foils currently in use; (2) Testing each foil for category coherence and selection bias; (3) Deriving normative criteria for a "well-posed" Divergence question.

  **Work Plan**

  *Year 1: Taxonomy and Reconstruction.*
  I will catalog the explicit and implicit foils in the major Divergence literatures (institutionalist, geographic, globalist). I will reconstruct the arguments to isolate the specific contrast being explained in each case. For example, does a given argument explain why *Europe* diverged from *Asia*, or why *Lancashire* diverged from *Jiangnan*? I will produce a typology of these contrasts, identifying where unit mismatches occur. The deliverable will be a working paper mapping the "contrastive landscape" of the field.

  *Year 2: Normative Criteria and Implications.*
  Using the typology from Year 1, I will develop criteria for a valid foil. I will test the "Selection Effect" worry to determine if the Divergence is fundamentally a "why here" question or a "why then" question. I will draft the final monograph manuscript, focusing on the prescriptive outcome: a set of guidelines for constructing contrastive questions in macro-history. The final months will be dedicated to presenting these findings to economic history workshops to stress-test the practical utility of the framework.

  **Success and Failure Conditions**

  Success looks like a framework that allows historians to identify when they are disagreeing about facts versus when they are disagreeing about questions. A successful result provides a normative standard for selecting foils (e.g., "foils must share fiscal capacity" or "foils must be regionally equivalent") that is adopted in future literature.

  Failure would take two forms. The first is a deflationary conclusion: proving that the choice of foil is entirely pragmatic and interest-relative, meaning "any foil goes" depending on what the historian wants to study. This would be intellectually honest but practically useless. The second is overreach: attempting to solve the Selection Effect problem metaphysically rather than methodologically, resulting in a philosophical treatise irrelevant to working historians. I will avoid this by restricting the analysis to methodological implications for evidence gathering.

  **Impact on Historical Practice**

  This is the section on which I bet the fellowship. If this project succeeds, it changes working historians' practice in three concrete ways.

  First, it forces **explicit foil declaration**. Just as econometricians must justify their identification strategy, macro-historians will be expected to justify their contrast class. A paper arguing for the importance of coal will need to state whether it is explaining "Britain vs. China" or "Britain vs. France," acknowledging that these are different causal claims.

  Second, it reduces **fruitless rebuttal**. Much of the current debate involves scholars refuting answers to questions their opponents aren't asking. By stabilizing the question, we can isolate genuine empirical disagreements. If two scholars agree on the foil but disagree on the cause, we have a real debate. If they disagree on the foil, we have a taxonomic error. Distinguishing these saves time and resources.

  Third, it clarifies **data relevance**. If the unit mismatch is resolved by shifting the foil to "industrial regions vs. non-industrial regions" rather than "nations," then national-level data (like aggregate Chinese tax receipts) become less relevant than regional data (like Yangzi wage rates). This directs archival and quantitative labor toward the variables that actually discriminate between the valid foils.

  If the project fails—if I conclude that the contrast is purely pragmatic—practice will not change. Historians will continue to select foils based on data availability. However, even this negative result is valuable: it confirms that the Divergence is a family of questions rather than a single problem, encouraging scholars to stop seeking a "grand theory" and instead pursue localized explanations. But I argue we can do better. We can define the rules of the game before we start playing.

  ***

  **Consultant's Note: Scope & Strategy Assessment**

  *You asked for honesty about scope and risks. Here is the candid assessment of the proposal above.*

  **1. The "Selection Effect" is a Trap.**
  The second core question ("Somebody had to be first") is metaphysically deep and risks sucking up your entire two years. It touches on determinism, probability, and modal logic. If you go too deep here, the economic historians will tune out, and the philosophers will say you're doing it wrong.
  *   **Cut:** Do not try to solve the "necessary truth" aspect.
  *   **Replace:** Frame it strictly as **post-hoc selection bias**. Focus on the methodological error of explaining a specific winner without accounting for the pool of potential winners. Keep it statistical/methodological, not metaphysical.

  **2. Deflationary Risk.**
  You flagged the risk of landing on "any foil goes." This is the biggest danger. If your conclusion is "it depends on your interests," the fellowship committee will view the project as trivial.
  *   **Mitigation:** You must commit to a **normative** outcome. You need to argue that *some* foils are objectively better than others because they control for specific confounders (e.g., scale, fiscal capacity). Don't just say "be careful." Say "Foils must match on Variable X and Y to be valid."

  **3. Audience Calibration.**
  The proposal uses terms like "explanandum" and "contrastive foil." This is necessary for precision, but keep the frequency low.
  *   **Adjustment:** In the full text, ensure every philosophical term is immediately followed by a plain-English translation (as I did in the draft). The "Impact" section is your strongest asset; ensure it remains concrete.

  **4. Two-Year Feasibility.**
  Mapping the *entire* Divergence literature is too big.
  *   **Cut:** Limit the taxonomy to the "Big Three" camps (Institutions, Geography/Coal, Global/California School). Do not try to capture every minor contribution.
  *   **Focus:** Spend Year 1 on the *logic* of the major books, not the periphery.

  **5. The "No Archives" Constraint.**
  This is a strength, not a weakness. Lean into it. Emphasize that *conceptual* errors cannot be fixed by *empirical* work. This justifies why a fellowship for conceptual work is necessary now.

  **Verdict:** The project is fundable if you promise a **tool** (a checklist for valid foils), not just a **critique**. If you only criticize, you're a gadfly. If you provide a method for better history, you're a colleague. Ensure the "Impact" section promises the tool.
