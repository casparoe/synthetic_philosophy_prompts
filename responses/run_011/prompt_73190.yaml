answer: |-
  ### 1. The Dependency Structure

  You suspect your ordering is the source of failure. You are correct. The error is treating "Inert Ideas" and "The Rhythm" as two separate concepts to be defined. They are not. **Inert Ideas are the pathology; The Rhythm is the physiology.** You cannot diagnose the disease without understanding the life cycle of the organism.

  However, if you introduce the Rhythm first, they will map it onto their existing lesson-plan skeleton (Starter/Main/Plenary). If you introduce Inert Ideas first, they will hear "don't teach facts."

  **The Required Sequence:**

  1.  **The Phenomenon of "Stuckness" (20 mins):** Do not define "Inert Ideas" yet. Describe the symptom they all know from placement: The student who can recite the formula in a quiz but does not reach for it when solving a problem in a different context. The student who passes the mock but cannot explain *why* the answer is what it is.
      *   *Why:* This bypasses the "theory vs. opinion" block. It is an empirical observation of their own classroom failures. It creates a *need* for an explanation.
  2.  **The Lifecycle of an Idea (The Rhythm) (40 mins):** Now introduce the Rhythm not as a lesson plan, but as the *natural lifespan of a single concept* in a human mind. Romance is the conception (the spark of need); Precision is the adolescence (the discipline of grammar); Generalisation is the adulthood (the power to deploy).
      *   *Why:* By framing it as a *lifespan*, you make it temporal and internal to the learner, not spatial and external to the teacher. This prevents the Starter/Main/Plenary mapping.
  3.  **The Diagnosis (Inert Ideas) (40 mins):** Now define Inert Ideas. An idea is inert not because it is a fact, but because it has been **arrested**. It is an idea stuck in Precision without having passed through Romance, or stuck in Precision without being released into Generalisation.
      *   *Why:* This makes Inert Ideas a structural failure of the Rhythm, not a moral failing of "rote learning." It allows you to say: "Drilling is not the enemy. Drilling without Romance and Generalisation is the enemy."

  **The Pivot Point:** You must explicitly state at the start of section 2: *"This is not a template for your 60-minute period. A single period might be entirely Precision. A Romance might take three weeks. If you try to fit all three into one lesson, you will produce shallow entertainment, shallow drilling, and shallow discussion. That is the definition of a bad lesson."*

  ### 2. The Carrying Example

  You need an example that is subject-specific, traceable minute-by-minute, and resistant to the "Starter/Main/Plenary" colonization.

  **The Example:** **Physics: The Concept of 'Moments' (Turning Effects).**
  *(Alternative for ML: The Subjunctive Mood. Alternative for Maths: Completing the Square.)*

  **Why this example works:**
  *   It is abstract enough to require Precision.
  *   It is physical enough to allow Generalisation.
  *   It is routinely taught badly (formula first, application later).

  **What the Example Must HAVE:**
  1.  **A Moment of Intellectual Unrest (Romance):** Not a "fun video." It must be a *puzzle*.
      *   *The Move:* Show a seesaw. Put a 50kg child on one end. Ask: "Where must I put a 100kg adult to balance it?" Let them guess. Let them be wrong. Create the *need* for a rule. The Romance is the *itch*, not the entertainment.
  2.  **A Moment of Grammatical Rigour (Precision):** The formula ($M = F \times d$).
      *   *The Move:* Teach the units. Teach the algebra. Drill the calculation. But frame it as: "This is the language we need to solve the puzzle from the start." Precision is the *tool*, not the *task*.
  3.  **A Moment of Transfer (Generalisation):**
      *   *The Move:* Do not ask "Where else are moments used?" (This invites vague answers). Ask: "Explain why a door handle is placed far from the hinge, using the formula." Or: "Design a counterweight for this crane." The idea must *do work* it couldn't do before.

  **What the Example Must LACK:**
  1.  **Entertainment masquerading as Romance:** No clips of people falling off seesaws for laughs.
  2.  **Drill masquerading as Precision:** No worksheets of 20 identical calculations without the context of the balance.
  3.  **"Real World" tacked on the end:** Generalisation is not a plenary discussion. It is the *use* of the precision to alter their perception of the physical world.

  **Why the "Obvious Candidates" Fail:**
  *   *Riding a Bike:* Too tacit. Doesn't show the "Precision" stage (grammar/rules).
  *   *Child Obsessed with Dinosaurs:* Too anecdotal. Suggests Romance is just "interest," leading to the "follow the child" collapse.
  *   *Teacher's Favourite Lesson:* Too holistic. Hard to isolate the *failure* points.
  *   *Starter/Main/Plenary:* This is the enemy. Using this as the example validates their existing skeleton.

  ### 3. The Misconception Map

  Here is how to head off the four specific failures you anticipate.

  **1. Misconception: Romance = Entertainment / Motivational Hook**
  *   **Where it forms:** The moment you mention "Romance."
  *   **The Pre-emptive Move:** Before using the word, write on the board: **"Romance $\neq$ Fun."** Define it as **"Intellectual Unrest."**
  *   **The Script:** "If your students are smiling but not puzzled, you have entertainment, not Romance. Romance is the feeling that you *need* to know something to solve a problem. If they are comfortable, you haven't started."

  **2. Misconception: The Stages = Age Bands / Lesson Plan Template**
  *   **Where it forms:** When you describe the sequence.
  *   **The Pre-emptive Move:** Explicitly forbid the words "Starter," "Main," and "Plenary" for the first 90 minutes. If a trainee uses them, correct them: "You are describing *your* timetable. I am describing *their* cognition."
  *   **The Script:** "You can spend three weeks in Romance. You can spend five minutes in Generalisation. Do not try to cram all three into one period. A lesson can be purely Precision, provided the Romance happened last week and the Generalisation happens next week."

  **3. Misconception: Inert Ideas = Facts Memorised and Forgotten**
  *   **Where it forms:** When defining Inert Ideas.
  *   **The Pre-emptive Move:** Distinguish between **Retention** and **Availability**.
  *   **The Script:** "A student can score 100% on a test and still hold an Inert Idea. If they can recall the formula but do not know *when* to deploy it without being prompted, the idea is inert. Inertia is not about forgetting. It is about uselessness."

  **4. Misconception: Precision = Drilling (The Explicit Instruction Trap)**
  *   **Where it forms:** During the Precision stage of the example.
  *   **The Pre-emptive Move:** Frame Precision as **Grammar**, not **Repetition**.
  *   **The Script:** "Whitehead is not against drilling. He is against drilling that lacks a purpose. Precision is the rigorous acquisition of the tools needed to satisfy the Romance. If the drill feels like a punishment, you skipped the Romance. If the drill feels like learning the scales to play the song, it is Precision."

  **5. The "Unfalsifiable" Critique**
  *   **The Trainee:** "Any lesson can be redescribed as any stage. This is pseudoscience."
  *   **The Honest Response:** Do not bluff. Do not claim it is empirical law.
  *   **The Script:** "You are right. It is not a law of physics. It is a **heuristic for attention**. It is unfalsifiable if you look at the *teacher's activity*. It is only testable if you look at the *student's mind*. If you ask the student: 'Did you feel the need for this rule before you learned it?' (Romance). 'Do you know exactly when this rule applies?' (Precision). 'Can you use this rule to see something new?' (Generalisation). If the answer to any is 'no', the rhythm is broken. The theory doesn't predict the lesson; it diagnoses the learning."

  ### 4. What to Refuse to Cover

  You must announce boundaries to protect the session from drifting into abstract philosophy.

  **Refuse:**
  1.  **The Metaphysics of Process:** Do not explain *why* reality is processual. Do not mention *Process and Reality*.
  2.  **The Hegelian Ancestry:** Do not mention Thesis-Antithesis-Synthesis. It invites the "everything is a triad" cynicism.
  3.  **The Whole Curriculum:** Do not discuss how this applies to Key Stage 3 vs. Key Stage 4. Keep it at the level of the *concept*.

  **The Announcement:**
  *"I am cutting the philosophy. I am not interested in Whitehead's metaphysics, and neither are you. You need to know how to spot a dead idea in a lesson plan. We are treating this as a diagnostic tool, not a worldview. If you want the metaphysics, read the book. Today, we are looking at the mechanics."*

  **The Cost:** You lose the deep justification for *why* the rhythm exists.
  **The Gain:** You gain credibility with a pragmatic audience. They will accept a tool even if they reject the philosophy.

  ### 5. The Final Question

  Do not ask them to recite the stages. Do not ask them to write a plan. Ask them to diagnose a specific failure in their own recent practice.

  **The Question:**
  *"Look at the last lesson plan you wrote. Identify the 'Main Activity'. If a student could successfully complete that activity without understanding **why** they were doing it or **when** they would ever need to do it again, is that Precision or is that Inertia? And if it is Inertia, which stage of the Rhythm did you skip?"*

  **Why this works:**
  *   It forces them to apply the diagnosis to their own work (high stakes).
  *   It separates "doing the task" from "understanding the idea."
  *   It requires them to identify the missing link (Romance or Generalisation) without needing to redesign the whole lesson.
  *   It proves whether they understand that Inert Ideas are about *relationship*, not *content*.
