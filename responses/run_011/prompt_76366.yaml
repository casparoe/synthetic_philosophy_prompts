answer: |-
  **Two questions or one?**

  They are not separate. The question "when did the Anthropocene start?" is secretly the question "who gets to say?" disguised as empirical inquiry. Stratigraphy claims objectivity by privileging markers over causes; a boundary is defined by what is preserved in the rock, not by the story we tell about why it is there. However, the selection of *which* marker counts as epochal is inherently normative. To choose the plutonium spike of 1950 over the CO2 dip of 1610 is to prioritize global synchronicity over historical causality. To choose 1610 is to prioritize a specific narrative of colonialism over industrial chemistry. The geologist insists the date is found in the dirt; the historian insists it is found in the archive. Both are partially wrong. The date is found in the negotiation between the two, because the dirt does not speak until we decide which silence counts as a boundary. Therefore, authority precedes chronology. We cannot settle the "when" until we legitimize the "who," because the criteria for a valid start date are determined by the disciplinary norms of the body holding the knife.

  **The case for fixing a date**

  The strongest argument for formalizing a specific start date, specifically 1950, is utility grounded in synchronicity. Science requires shared coordinates to correlate records globally. If the Anthropocene remains a loose descriptor, it functions as a metaphor rather than a tool, allowing researchers to slide between definitions depending on convenience. A Golden Spike (GSSP) forces rigor. The 1950 proposal, centered on Crawford Lake, offers a marker that is chemically distinct, globally distributed, and instantaneous in geological terms. Radionuclides from bomb testing do not respect borders; they settle everywhere simultaneously. This avoids the fuzziness of gradual processes like the Neolithic revolution or the Industrial Revolution, which occurred at different times in different places. By fixing the date, we acknowledge the Great Acceleration as a fundamental shift in Earth system functioning, not just a cultural change. It creates a hard line that future geologists can identify without needing to interpret human intent. This preserves the integrity of the timescale as a physical record, ensuring that the Anthropocene is treated as a material reality rather than a political sentiment. Without a boundary, the term risks becoming so capacious it loses explanatory power.

  **The case against**

  The argument against formalization, echoed in the 2024 rejection, rests on the distinction between an event and a process. Geological epochs traditionally mark transitions between stable states, defined by settled dust. The Anthropocene is defined by instability; it is a process still running, not a layer yet cooled. To draw a lower boundary implies a "before" that is distinct and finished, which misrepresents the ongoing accumulation of impact. Furthermore, the evidentiary bar for an epoch is high: the sedimentary record must be thick and durable. The 2024 vote correctly noted that the Crawford Lake sediments are too thin to function as a robust global standard compared to deep-time boundaries. Formalizing now risks premature closure on a dynamic phenomenon, locking future science into a definition that may not age well. There is also the risk of reductionism. A single date obscures the deep history of human impact, potentially letting earlier civilizations off the hook or implying that nothing mattered before the chosen year. Keeping the Anthropocene as an informal working term allows it to remain flexible, accommodating new data and diverse regional histories without violating the strict codes of stratigraphy. It protects the geologic timescale from being bent to fit contemporary political urgency.

  **The 1610 test**

  This brings us to the Orbis spike. Standard stratigraphy dictates that boundaries are picked by markers, not causes. Nobody retracts the K-Pg boundary if the impactor turns out to be a comet rather than an asteroid; the layer is the layer. The 1610 proposal is different because it was selected *for* its causal story—the depopulation of the Americas and subsequent reforestation—and then fitted to a wiggle in the ice core. Run the counterfactual: suppose the CO2 dip is real but caused entirely by drought, with no genocide, no reforestation, and no human agency in the causal chain. Does the proposal collapse?

  It must. If the causal story is removed, 1610 loses its privileged status over 1780 or 1950. There are countless wiggles in the Holocene record; without the narrative of colonial catastrophe, the 1610 dip is just noise. If proponents insist the date stands despite the drought hypothesis, they are admitting the marker was secondary to the morality. This proves the horn I choose: the 1610 proposal collapses without the genocide narrative. This is not a failure of science, but an exposure of its limits. It reveals that 1610 was never a purely stratigraphic argument; it was a historical one wearing a lab coat. Unlike 1950, which relies on a physical signal regardless of intent, 1610 relies on the signal *meaning* something specific about human agency. If that meaning is severed, the date is arbitrary. This confirms that for the Anthropocene, the "when" is constitutively dependent on the "who." You cannot separate the date from the assignment of responsibility. To insist otherwise is to pretend that selecting a boundary is not an act of interpretation. The 1610 case proves that when human agency is the variable, the marker cannot be divorced from the story.

  **Who holds the knife**

  Read the 2024 rejection uncharitably: it exposed that "epoch" was the wrong category all along. You cannot draw a lower boundary around a process that is still running using norms designed for settled deep time. Charitably, it was an instrument problem—the signature is still accumulating. Both readings point to the same conclusion: the committee's composition is epistemically relevant. The subcommission is staffed by stratigraphers whose professional norms were built for a past with nobody in it. They are trained to exclude agency, looking for physical markers that persist regardless of cause. This makes them excellent judges of rock, but arguably bad judges of the one interval in which agency is the thing to be measured. Their rejection of 1950 for being "too recent" or "too thin" applies standards that are mismatched to the phenomenon. A legitimate decision procedure cannot be monocultural. It requires a hybrid body where geologists do not hold veto power over historians and social scientists. If the Anthropocene is a socio-natural phenomenon, the authority to define it must be socio-natural as well. The vote was not just a technical assessment; it was a defense of disciplinary boundaries against a concept that threatens to dissolve them.

  **Verdict**

  When did it start? 1950. Who decides? A hybrid consortium, not just stratigraphers. I choose 1950 not because it is the only true date, but because it is the only one that survives the removal of narrative. Unlike 1610, the plutonium spike does not require a moral story to function as a marker; it is globally synchronous and physically distinct regardless of intent. For the purpose of global stratigraphic correlation, this is the right purpose to answer to. However, the authority to formalize this cannot rest solely with the body that rejected it. The 2024 vote demonstrated that geological norms are insufficient for recognizing human agency as a geological force. Therefore, the decision belongs to an interdisciplinary body empowered to create new categories if old ones fail. We must accept 1950 as the stratigraphic start, while acknowledging that the philosophical start is plural. But for the timescale to function, we need a line. 1950 is the least arbitrary line available, provided the authority drawing it acknowledges that it is drawing a line through history, not just rock. The knife belongs to those who understand both.
