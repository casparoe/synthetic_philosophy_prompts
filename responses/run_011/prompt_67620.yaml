answer: |-
  **TO:** Selection Committee
  **FROM:** Committee Chair
  **DATE:** October 24, 2023
  **SUBJECT:** Decision on Fellowship Selection Methodology

  I recommend that the committee adopt Option (iii): replacing the structured interview with a paid half-day situational assessment for shortlisted candidates. This decision is not an endorsement of the half-day as a perfect instrument, but as the most defensible compromise between our mission to identify leadership potential and our obligation to equitable access for first-generation students. We will implement this for the upcoming cycle as a evaluated pilot; permanent adoption depends on the data metrics outlined below.

  **The Philosophical Question: Situationism and Assessment**
  The philosophy colleague's situationist critique is theoretically sound but practically overstated. The literature suggests character is not a fixed, cross-situational entity, but rather a set of capacities that interact with context. This does not entail that character cannot be assessed; it entails that it cannot be assessed via self-report or single-context snapshots that claim to reveal a "true self." The forty-five-minute interview fails because it treats character as a static trait revealed through verbal description. The half-day assessment succeeds where the interview fails not because it discovers stable virtues, but because it samples behavior across varied, pressure-filled contexts.

  Is a half-day itself just "one situation"? Yes, but it is a dense cluster of situations (collaboration, conflict, ethical dilemmas) rather than a single conversational context. The situationist critique condemns the inference from one context to all contexts, but it permits the inference from behavior in *relevant* contexts to performance in *similar* future contexts. Since the fellowship is residential and collaborative, a group-based simulation is a more relevant sample than an interview. The objection is manageable, not fatal, provided we score specific behaviors rather than inferring global character traits.

  **Selection vs. Development**
  We must distinguish our selection function from our developmental charter. The argument that defeats assessing character at admission does not defeat cultivating it afterwards. In fact, they are complementary. If situationism is correct and character is malleable, our selection criterion should not be "who already has integrity," but "who demonstrates the capacity to navigate ethical complexity under pressure." We are selecting for responsiveness to development, not finished virtue. Option (ii) (removing character assessment) abandons this fit, reducing selection to academic metrics that predict graduation but not leadership growth. Option (iii) aligns selection with development: we observe how candidates handle dilemmas now to determine who will benefit most from our curriculum later.

  **The Standard: Fairness-Adjusted Validity**
  Our standard for this decision is Fairness-Adjusted Predictive Validity. Pure predictive validity is insufficient because our fellowship confers an opportunity rather than filling a job role. If a tool predicts success but systematically excludes first-generation students, it violates our public mission. The interview scores correlate with family income; therefore, regardless of their validity, they are unacceptable.

  We trade some theoretical precision for reduced bias. The half-day assessment is paid, removing the economic barrier of unpaid time commitment. It scores observable behavior rather than verbal polish, mitigating the cultural capital advantage inherent in interviews. We accept that the validity may be modest, provided the fairness metrics improve. We are not optimizing for the "best" leaders in the abstract, but for the most promising leaders within our specific demographic mandate.

  **The Rejected Option: Epistemic Humility**
  The strongest case for Option (ii), argued by our philosophy colleague, rests on epistemic humility. If character is fragmented, scoring it risks legitimizing bias under the guise of science. A false negative in this process denies a transformative opportunity based on a pseudoscientific metric. The colleague argues it is ethically safer to rely on academic records and statements of purpose, which are transparent, than to pretend we can measure virtue.

  I would be moved to adopt this view if evidence showed that the half-day assessment reproduced the same income-based disparities as the interview, or if longitudinal data demonstrated no correlation between assessment scores and fellowship outcomes. Until then, abstaining from character assessment abdicates our responsibility to identify non-academic potential.

  **Data Plan for Evaluation**
  To settle the question permanently, we will treat this cycle as a validation study. We will measure three metrics:
  1.  **Demographic Parity:** Compare the income and first-generation status of those selected via the half-day against historical interview data. Success is defined as maintaining or improving current diversity levels.
  2.  **Predictive Correlation:** Correlate observer scores with end-of-fellowship performance reviews (peer and mentor evaluations). A statistically significant positive correlation is required for permanent adoption.
  3.  **Candidate Experience:** Survey participants on perceived fairness and stress. If candidates report the process as overly burdensome or opaque, we must revisit the design.

  If the half-day fails to improve demographic parity or fails to predict fellowship performance, we will revert to Option (ii) for the following cycle. This ensures our commitment to fairness is empirical, not merely theoretical.
