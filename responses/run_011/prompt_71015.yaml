  ### The Commitment Race Diagnostic

  **Node 1:** The driver who throws the steering wheel out the window forces the other to swerve.
  *   **Accept:** Go to Node 2.
  *   **Reject:** Go to Node 5.

  **Node 2:** The device that cannot afterwards be switched off is trusted even if it harms the user.
  *   **Accept:** **Leaf: Schelling's strategic surrender of one's own rationality.**
      *   *Awkward Commitment:* You must destroy your own capacity to choose to save yourself.
  *   **Reject:** Go to Node 3.

  **Node 3:** The eccentric who pays for an intention rather than for a deed can intend without acting.
  *   **Accept:** **Leaf: Kavka's verdict on the eccentric's offer.**
      *   *Awkward Commitment:* You must convince yourself to want what you know you will not do.
  *   **Reject:** Go to Node 4.

  **Node 4:** The party who committed before knowing whom he would be facing keeps the promise anyway.
  *   **Accept:** **Leaf: Gauthier's constrained maximiser.**
      *   *Awkward Commitment:* You must become the sort of person who loses money to keep a promise.
  *   **Reject:** **Leaf: Unnamed.**
      *   *Awkward Commitment:* You must rely on a character trait that vanishes when tested.

  **Node 5:** The extortionist who has publicly bound himself never to accept less than the whole sum is believed.
  *   **Accept:** Go to Node 6.
  *   **Reject:** Go to Node 7.

  **Node 6:** The second mover's refusal to capitulate is a blunder.
  *   **Accept:** **Leaf: Unnamed.**
      *   *Awkward Commitment:* You must hope your opponent fears your anger more than their own ruin.
  *   **Reject:** Go to Node 8.

  **Node 7:** The whole edifice depends upon a background practice of keeping one's word.
  *   **Accept:** Go to Node 9.
  *   **Reject:** **Leaf: Unnamed.**
      *   *Awkward Commitment:* You must accept that without an audience, virtue is suicide.

  **Node 8:** A commitment to do what one would be wrong to do alters the analysis.
  *   **Accept:** **Leaf: Unnamed.**
      *   *Awkward Commitment:* You must claim morality overrides the logic of survival.
  *   **Reject:** **Leaf: The backward-induction refusal to be deterred.**
      *   *Awkward Commitment:* You must accept that your own future self is an enemy you cannot bind.

  **Node 9:** The shadow of the future is longer than the shadow of the prize.
  *   **Accept:** **Leaf: The deflationary appeal to repetition and reputation.**
      *   *Awkward Commitment:* You must admit that honor is merely the interest on a loan of reputation.
  *   **Reject:** **Leaf: Unnamed.**
      *   *Awkward Commitment:* You must settle for a threat that expires before the deal is done.

  ***

  ### Diagnostic Meta-Analysis

  **Indistinguishable Leaves**
  The tree cannot genuinely separate **Leaf 7 (Unnamed: Atomic Rationality)** from **Leaf 9-Reject (Unnamed: Short-Sighted Reputation)**. Both result in the same narrative outcome: the commitment fails because the cost of keeping it exceeds the cost of breaking it. To separate them, I would have needed a node asking, *"Does the character care about being known as a liar?"* I omitted this because, in a single decisive scene, the internal calculation and the external reputation often collapse into the same hesitation.

  **Empty Logical Cells**
  1.  **Physical Commitment + Background Practice:** (Node 1 Accept + Node 7 Accept). This cell is empty because it is **incoherent**; if the steering wheel is truly thrown, the background practice is irrelevant to the immediate physics of the crash.
  2.  **Gauthier + Backward-Induction:** (Node 4 Accept + Node 8 Reject). This cell is empty because it is **unattractive**; one cannot simultaneously hold that dispositions determine rationality and that only the immediate act matters.
  3.  **Kavka + Physical Device:** (Node 3 Accept + Node 2 Accept). This cell is empty because **nobody has yet thought to defend it**; the Toxin Puzzle relies specifically on the absence of external enforcement to test the purity of intention.
