  ### Position Key (The Leaves)

  Compare your answers to the patterns below to find your position.

  **Leaf 1: The Statue and the Lump are Two Different Things**
  *   **Pattern:** Node 1(A) + Node 2(A) + Node 3(A) + Node 4(A) + Node 5(B).
  *   **Why:** You believe the statue and the clay are both real objects, but they have different rules. The clay survives the squash, but the statue does not. Since they have different fates, they must be two different things occupying the same space.

  **Leaf 2: They Are Just One Thing**
  *   **Pattern:** Node 1(A) + Node 2(A) + Node 3(A) + [Node 4(A) & Node 5(A)] **OR** [Node 4(B) & Node 5(B)].
  *   **Why:** You believe both are real objects, but they share the exact same fate. Either both die when squashed (the object is essentially a statue) or both survive (the object is essentially clay). There is only one object here, not two.

  **Leaf 3: The Statue is a Four-Dimensional Worm**
  *   **Pattern:** Node 3(B). (Regardless of other answers).
  *   **Why:** You view objects as stretching through time. The "squeeze" is just an event that happens to one part of the worm. The question of whether the statue "survives" is like asking if a road survives a pothole; the worm exists across all those moments.

  **Leaf 4: There Is No Statue At All**
  *   **Pattern:** Node 1(B) + Node 2(A).
  *   **Why:** You think "clay" picks out a real object, but "statue" is just a word we use for a temporary arrangement. There is only the lump; the statue is an illusion of language.

  **Leaf 5: There Is No Lump Either**
  *   **Pattern:** Node 1(B) + Node 2(B).
  *   **Why:** You are a radical skeptic about objects. There are only atoms. Neither "statue" nor "lump" refers to a real thing; they are just ways of talking about atoms.

