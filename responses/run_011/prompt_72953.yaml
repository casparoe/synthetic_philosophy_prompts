  ### Limitations and Ghost Combinations

  **Two Leaves This Tree Cannot Separate**
  It is very difficult to distinguish **Leaf 4 (No Statue)** from a specific version of **Leaf 2 (One Thing)** where the clay dominates.
  *   *The Problem:* If you say "There is no statue, only clay" (Leaf 4), you effectively end up treating the world exactly like someone who says "There is one thing, and it is clay" (Leaf 2). In practice, both people will answer "No" to Node 4 (Statue destroyed) and "Yes" to Node 5 (Clay survives). The tree classifies the latter as "One Thing" and the former as "No Statue," but their predictions about the world are identical. The difference is purely semantic (does the word "statue" refer to the clay, or to nothing?).

  **Combinations Nobody Defends (Ghost Paths)**
  1.  **The "Ghost Form" (Node 4(B) + Node 5(A)):** *Statue survives, Clay does not.*
      *   *Why:* This is physically incoherent. It suggests the shape or form can continue to exist even if the material stuff that makes it up is destroyed. Nobody argues that a flat pancake is still a statue *and* that the clay is gone.
  2.  **The "Magic Snowman" (Node 8(B) + Node 9(A)):** *Snowman survives, Water does not.*
      *   *Why:* This suggests the object persists even though its constituent matter has vanished. This violates basic conservation intuitions.
  3.  **The "Statue Without Substance" (Node 1(A) + Node 2(B)):** *Statue exists, Clay does not.*
      *   *Why:* This is the reverse of Leaf 4. It claims the artistic object is real, but the material it is made of is not. While logically possible, almost no one holds this view. If you accept composite objects, you usually accept the material ones first. If you deny material lumps, you almost always deny statues too (leading to Leaf 5).
  4.  **The "Knot Paradox" (Node 10(B) + Node 11(A)):** *Knot survives, Rope does not.*
      *   *Why:* Similar to the Ghost Form. A knot is a modification of a rope. It is intuitively impossible for the modification to survive the destruction of the thing being modified.
