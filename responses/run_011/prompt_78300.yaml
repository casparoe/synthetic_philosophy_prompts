answer: |-
  ### Preface: A Note on the Instrument

  You asked me to tell you plainly if this instrument cannot work. Here is that plain truth: **No set of intuition pumps can settle the metaphysics of intentionality.** Theories of content are not empirical hypotheses that case-intuitions can falsify; they are frameworks for *organizing* those intuitions. A committed Searlean will intuit that the Chinese Room lacks understanding *because* they hold Searle's view; a committed Dennettian will intuit it *does* understand *because* they hold Dennett's view.

  However, a reading group does not need a truth-meter; it needs a commitment-sorter. This diagnostic will not tell you which theory is *true*, but it will reveal which theoretical costs you are willing to pay. It discriminates *participants*, not *positions*. Use it to map the fault lines in the room, not to declare a winner.

  ***

  ### The Diagnostic: Ten Cases of Aboutness

  **1. The Two-Bitser (Context Dependence)**
  A vending machine sensor is calibrated to close a circuit when voltage exceeds 5V. In Factory A, this voltage is caused exclusively by a quarter being inserted. In Factory B, the exact same sensor is wired so the 5V spike is caused exclusively by a door opening. The physical state of the sensor is identical in both cases.
  *   **A.** I say the sensor's state means "Quarter Inserted" in Factory A and "Door Open" in Factory B; the content shifts with the wiring intent.
  *   **B.** I say the sensor's state means "Voltage > 5V" in both cases; that is the only fact it reliably tracks.
  *   **C.** I say the sensor has no content in either case; it is just a switch until a mind interprets it.

  **2. The Frog's Error (Systematic Misrepresentation)**
  A frog's visual system fires a neuron that triggers a tongue snap whenever a small, dark, moving dot crosses its visual field. In its natural environment, these are flies. In a lab, it snaps at tiny lead pellets (BBs).
  *   **A.** I say the frog falsely represents the pellet as a *fly*; its system is designed for flies, not pellets.
  *   **B.** I say the frog truly represents the pellet as a *small dark moving thing*; it never misrepresents what it actually detects.
  *   **C.** I say the frog represents nothing; it is a reflex machine, not a believer.

  **3. The Sudden Duplicate (No History)**
  By a cosmic accident, a molecule-for-molecule duplicate of a human being (Swampman) condenses out of a swamp. It has no evolutionary history, no design, and no causal past, but it behaves exactly like a person.
  *   **A.** I say Swampman has genuine thoughts and beliefs immediately; its internal physics is sufficient.
  *   **B.** I say Swampman has no thoughts initially; without a history of selection or learning, its states refer to nothing.
  *   **C.** I say Swampman has thoughts only insofar as we are obliged to treat it as a rational agent; content is a status we confer.

  **4. The Neural Isomorph (Human as Machine)**
  Neuroscientists map a specific human neuron's firing pattern to the logic gate of the Two-Bitser sensor in Question 1. The causal role is identical.
  *   **A.** I say if the sensor has no original content, the neuron doesn't either; biology alone adds no magic.
  *   **B.** I say the neuron has original content the sensor lacks; biological embodiment matters fundamentally.
  *   **C.** I say both have the same kind of content, derived from their role in a larger system that matters to us.

  **5. The Vestigial Organ (Function without Covariation)**
  Consider a human physiological state that was selected for in evolution (e.g., a fear response) but now fires reliably in response to a stimulus that was never present in the evolutionary past (e.g., fear of clowns), with no survival value.
  *   **A.** I say the state represents *danger* (its original function), even if clowns aren't dangerous.
  *   **B.** I say the state represents *clowns* (what it currently covaries with), regardless of history.
  *   **C.** I say the content is indeterminate until a competent interpreter decides how to rationalize the fear.

  **6. The Perfect Simulator (Behavioral Duplicate)**
  A silicon-based AI behaves indistinguishably from a human in conversation, claiming to feel pain and love. It has no biology, but its internal processing is functionally identical to a human brain.
  *   **A.** I say it has original intentionality; if it acts like it has a mind, it has a mind.
  *   **B.** I say it has only derived intentionality; it simulates understanding but lacks the biological ground.
  *   **C.** I say the question is empty; all we can ask is whether adopting the "belief stance" toward it is useful.

  **7. The Alien Artifact (Unknown Function)**
  We find a device on Mars that beeps whenever water is present. We do not know if it was designed, evolved, or is a natural geological formation.
  *   **A.** I say it indicates *water* immediately; the reliable correlation is enough for content.
  *   **B.** I say it has no content until we determine if it was designed or selected for a purpose.
  *   **C.** I say it acquires content only when we integrate it into our own explanatory practices.

  **8. The Brain Lesion (Systematic Human Error)**
  A human suffers a lesion causing them to consistently call all dogs "cats." They never correct this, and it persists throughout their life.
  *   **A.** I say they have a false belief about *dogs*; their term 'cat' fails to refer to cats.
  *   **B.** I say they have a true belief about *dog-lookalikes*; their concept has shifted to match their usage.
  *   **C.** I say their content is fixed by what a charitable interpreter must attribute to make sense of their overall behavior.

  **9. The Thermostat (Simple Systems)**
  A thermostat turns on the furnace when the temperature drops below 68 degrees.
  *   **A.** I say it literally believes it is cold; belief is a matter of functional role, not complexity.
  *   **B.** I say it is a category mistake to call this belief; it lacks the biological depth for genuine aboutness.
  *   **C.** I say it has "belief" only in a metaphorical sense, useful for prediction but not ontologically real.

  **10. The Uninterpreted Map (Internal Structure)**
  Imagine a brain state that has a complex internal structure resembling a map of the environment, but it is causally isolated—it affects no behavior and is affected by no sensors.
  *   **A.** I say it represents the environment simply by virtue of its structural isomorphism.
  *   **B.** I say it represents nothing; without causal contact or function, a map is just a pattern.
  *   **C.** I say it represents what we would be obliged to say it represents if we discovered it.

  ***

  ### Scoring Key and Taxonomy

  **Instructions:** Tally your responses. The profiles below describe *clusters of commitment*. Do not expect a perfect match; most people hold hybrid views.

  #### Position 1: Biological Intrinsicism (The "Searlean" Cluster)
  *   **Typical Pattern:** 1C, 2C, 3A, 4B, 5A (leaning), 6B, 7B, 8A, 9B, 10B.
  *   **Core Commitment:** Original intentionality is a biological phenomenon. Physical syntax or functional role is insufficient without specific causal powers found in living brains.
  *   **Instability Flag:** If you chose **3A** (Swampman has thoughts) but **2C** (Frog has no beliefs), you may be inconsistent. Swampman lacks history but has biology; Frog has biology but simple function. If biology is the key, both should have content. If history is the key, Swampman should not.
  *   **Contestable Entry:** This view is often criticized for positing a "nomological dangler"—a causal power not explained by physics.

  #### Position 2: Instrumentalism / Stance Realism (The "Dennettian" Cluster)
  *   **Typical Pattern:** 1A, 2A, 3C, 4C, 5C, 6A, 7C, 8C, 9C, 10C.
  *   **Core Commitment:** The distinction between original and derived intentionality collapses. Content is real but relative to the "Intentional Stance." If attributing beliefs predicts behavior, the beliefs are real.
  *   **Instability Flag:** If you chose **9B** (Thermostat has no belief) but **6A** (AI has belief), you must explain the threshold. Instrumentalism usually allows a gradient of belief, not a sharp on/off switch based on substrate.
  *   **Inseparability Warning:** This position is notoriously difficult to separate from **Position 5 (Interpretationism)**. Both rely on the ascriber. The difference is often one of emphasis: Dennett emphasizes *prediction utility*; Interpretationism emphasizes *normative obligation*.

  #### Position 3: Teleosemantics (The "History/Function" Cluster)
  *   **Typical Pattern:** 1A, 2A, 3B, 4A (or B), 5A, 6B (or A if functional), 7B, 8A, 9B, 10B.
  *   **Core Commitment:** Content is fixed by selected function (evolutionary or design). Misrepresentation is possible because a system can fail to do what it was selected to do.
  *   **Instability Flag:** If you chose **3A** (Swampman has thoughts) and **2A** (Frog misrepresents), you have a conflict. Teleosemantics grants misrepresentation *because* of history, but denies Swampman content *because* of lack of history. You cannot have both unless you add a non-historical clause.
  *   **Contestable Entry:** This view struggles with "new" concepts (e.g., fear of clowns) that have no evolutionary history.

  #### Position 4: Informational Semantics (The "Covariation" Cluster)
  *   **Typical Pattern:** 1B, 2B, 3A, 4A, 5B, 6A, 7A, 8B, 9A, 10A.
  *   **Core Commitment:** Content is fixed by reliable causal covariance (indication). If state X reliably happens when Y is present, X means Y. History is secondary to current law-like relations.
  *   **Instability Flag:** If you chose **2A** (Frog falsely believes 'Fly'), you likely are not a pure Informationalist. If the neuron fires for BBs, it reliably indicates 'BB' or 'Dark Dot'. To call it 'Fly' requires a theory of error (like Teleosemantics) that pure covariance lacks.
  *   **Inseparability Warning:** Hard to separate from **Position 3** on cases where function and covariance align (which is most cases). They diverge primarily on Swampman (Info says Yes, Teleo says No) and Misrepresentation (Info struggles, Teleo excels).

  #### Position 5: Normative Interpretationism (The "Ascriber Obligation" Cluster)
  *   **Typical Pattern:** 1A, 2A, 3C, 4C, 5C, 8C, 10C. (Overlaps heavily with Position 2).
  *   **Core Commitment:** Content is not "in the head" or "in the world" but is fixed by the norms governing competent interpreters. It is not just about prediction (Dennett), but about what one *ought* to attribute to make the agent intelligible.
  *   **Instability Flag:** If you chose **3B** (Swampman has no thoughts) but **8C** (Lesion content is up to interpreter), you may be unstable. If content is fixed by us, why can't we interpret Swampman as thinking?
  *   **Diagnosis:** If your answers cluster here and in Position 2, you likely hold a single view that goes by two names in the literature.

  #### Unstable / Incoherent Patterns
  *   **The "Magic Biology" Pattern:** (2C, 3A, 6B, 9B). You deny content to frogs and thermostats, grant it to Swampman and Humans, but deny it to AI.
      *   *Diagnosis:* This is the **Biological Intrinsicist** view, but it is often charged with being "speciesist" or metaphysically mysterious. It is coherent but requires accepting non-physicalist causal powers.
  *   **The "History Sandwich" Pattern:** (3B, 5B). You deny Swampman thoughts (no history) but say the Vestigial Organ represents current stimuli (no history required).
      *   *Diagnosis:* Inconsistent reliance on history. You cannot demand history for origin but ignore it for content shift.
  *   **The "Universal Believer" Pattern:** (1A, 2B, 3A, 6A, 7A, 9A).
      *   *Diagnosis:* This leans toward **Panpsychism** or radical **Informational Semantics**. If thermostats and aliens have beliefs, the term "belief" may be doing no work. This position is coherent but deflationary.

  #### Positions No Coherent Pattern Leads To
  *   **The "Syntax-Only" Realist:** A pattern suggesting content exists purely via internal shape (isomorphism) without causal contact or interpretation (e.g., 10A combined with 7B and 3B).
      *   *Diagnosis:* **Neglected/Incoherent.** Pure structuralism about content was largely abandoned after the 1970s because a map without a user or a causal link is just a pattern, not a representation.
  *   **The "Derived-Only" Eliminator:** A pattern denying original intentionality to humans (4A, 6B, 9B) while granting it to nothing else.
      *   *Diagnosis:* **Eliminativism.** If humans don't have original intentionality, and machines don't, then *nobody* has beliefs. This is a coherent position (Churchland-style), but it contradicts the premise of the quiz which asks what you attribute, not whether you eliminate.

  #### Inseparable Pairs
  *   **Dennett (2) vs. Interpretationism (5):** The questions cannot reliably separate these. Both locate content in the relation between system and ascriber. The distinction is often one of rhetorical emphasis (pragmatism vs. normativity) rather than verdict divergence on cases.
  *   **Teleo (3) vs. Info (4) on Standard Cases:** On most everyday cases (seeing a tree, wanting water), these yield the same verdict. They only separate on "Swampman" (History vs. Physics) and "Frog Error" (Function vs. Covariation). If you did not notice a difference between Q2 and Q3, your intuitions do not distinguish these theories.

  ***

  ### Final Warning
  If your answers are scattered across all five columns, do not assume you are "confused." You may have correctly identified that **the concept of intentionality is a cluster concept** with no necessary and sufficient conditions. Many working philosophers operate with a hybrid view (e.g., Teleological Informationalism). If the quiz forces you to choose between "History" and "Covariation," and you want to say "Both," the instrument has failed you, not the other way around. Use this friction as the starting point for your discussion.
