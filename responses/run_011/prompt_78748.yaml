      *   *Idea:* Decouple the help from the expectation of return.

  7.  **Synthesize the Recommendation:**

      *   **Direct Answer:** Option 1 is the safest and most theoretically sound *for the user*, but it needs refinement to avoid the "feud loop." Option 2 is dangerous (Advisor is right). Option 3 is unsustainable.
