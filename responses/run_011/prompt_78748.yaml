answer: |-
  This is a classic public goods problem, and you are correctly identifying that your theoretical toolkit is clashing with the messy reality of human social dynamics. You are studying the evolution of cooperation while living inside a fragile cooperative equilibrium.

  Here is the breakdown of your options, the validity of your advisor's objection, and the fourth move you are missing.

  ### 1. The Advisor's Objection to Option 2
  **Your advisor is right.** You should not choose Option 2.

  In evolutionary terms, Option 2 is **altruistic punishment**. You incur a social cost (being the person who started drama, potentially fracturing the group's trust) to impose a cost on a defector (D) and inform the group.

  In small populations (like a department), altruistic punishment is risky. It only works if the group has a strong, pre-existing norm *against* the behavior you are punishing. Your department's norm is "no scorekeeping." By publicly keeping score, *you* become the norm violator.

  The cost lands on you (social friction, reputation as "difficult"), while the benefit (everyone knowing D is unreliable) is distributed. As your advisor noted: If no one knew you were the one who said it, would you still say it? If the answer is no, you are seeking social leverage, not system stability. Furthermore, D has 18 months left. The "long-term stability of the system" is not your problem to solve anymore; D's departure will solve it naturally.

  ### 2. The Problem with Option 1 (The Feud Loop)
  Option 1 (Quietly stop helping) is the evolutionarily stable strategy (Tit-for-Tat). However, your anxiety about the "feud loop" reveals a flaw in your execution, not the strategy itself.

  You wrote: *"He drops the ball once, I go cold, he catches on and stops answering my messages, and now we're two years into a feud..."*

  A feud requires two engaged parties. A feud requires you to *expect* something from him. If you stop helping him, and he stops helping you, **that is not a feud. That is distance.**

  The pain you are anticipating comes from the grief of realizing the relationship you *thought* you had (reciprocal colleagues) never existed. You are mourning the loss of a potential cooperative partner. If you update your model of D to "resource extractor" rather than "potential cooperator," his silence doesn't hurt you. It just confirms the data.

  **However,** a hard "cold turkey" cutoff can feel aggressive in a small social circle. It risks signaling to others that *you* are the one who stopped cooperating.

  ### 3. The Fourth Move: "The Fade" (Strategic Friction)
  There is a fourth option that blends the safety of Option 1 with the social grace of Option 3. I call this **Matching Energy with Friction.**

  Do not announce a change. Do not go cold. Instead, match D's own behavioral parameters exactly.

  *   **Response Time:** If he takes 3 days to reply to you, you take 3 days to reply to him.
  *   **Availability:** If he says "I'm slammed, maybe next week," you say "Totally get that, I'm actually swamped too. Let's ping back when things clear up." (And then you never ping back).
  *   **Specificity:** If he gives vague offers ("Let's chat sometime"), give vague acceptances ("Yeah, let's find a time").

  **Why this works:**
  1.  **It preserves the norm.** You aren't "keeping score" publicly; you are just "busy," which is the department's universal language for "no."
  2.  **It avoids the feud.** You aren't rejecting him; you are mirroring his own unavailability. He cannot be offended by his own behavior reflected back at him.
  3.  **It protects your resources.** You stop expending energy on a non-reciprocal link.
  4.  **It signals to observers.** Smart people in the group will notice the drift. They won't see drama; they will see two busy people drifting apart. They will infer the lack of reciprocity without you having to speak it.

  ### 4. Addressing the Biology
  You work on microbial cooperation. You know that in a biofilm, if a strain leaks metabolites but doesn't take them up, it dies. But you also know that **policing is expensive.**

  D is a "conditional cooperator" who cooperates only when there is direct fitness gain (credit/PI visibility). To the group, he is providing a public good (help) but charging a private fee (credit/visibility). When the fee isn't paid (helping you), he withholds the good.

  The system tolerates some cheating because the overall metabolic output (the group's code quality) is still positive. D is a "luxury" cheater—he helps when it's cheap/visible for him.

  **The 18-Month Horizon:**
  This is the most critical variable. In evolutionary terms, D is emigrating. You do not need to evolve a complex defense mechanism against a parasite that is leaving the petri dish in 18 months. You just need to survive until then.

  ### Recommendation
  **Execute Option 4 (The Fade).**

  1.  **Stop initiating.** Do not ask him for help unless it is critical.
  2.  **Match his latency.** When he asks for help, do not say no. Say "I'm deep in a deadline, can I get back to you?" Then get back to him in 4 days with "So sorry, couldn't make it work."
  3.  **Kill the expectation.** This is the internal work. You are angry because you are extending credit to a debtor who has declared bankruptcy. Stop extending credit. When he doesn't help you, do not feel slighted. Feel validated. Your model of the world is now accurate.
  4.  **Ignore the "Useless" Takers.** You noted others take without giving but nobody minds. That is because they are *honest* about their capacity. D is dishonest about his capacity. Your friction corrects the dishonesty without the drama.

  **Why not Option 2?** Because you are a PhD student, not the department chair. You do not have the authority to enforce norms, only to participate in them. Policing D makes you the enemy of the peace.
  **Why not Option 3?** Because resentment is toxic to your own productivity. You cannot afford to be a martyr for 18 months.
  **Why not pure Option 1?** Because a hard cutoff risks a social collision. The Fade allows the relationship to die of natural causes.

  **Final thought:**
  You said it's humbling that theory hasn't solved the human problem. It shouldn't be. Theory predicts that cheaters prosper until the cost of cheating exceeds the benefit. D is prospering because the cost is currently zero. By fading, you raise the cost of accessing *you* to match his price. You don't need to fix the system. You just need to protect your own metabolism until you graduate.
