      *   **System:** Informal, trust-based, no scorekeeping. High value (saves money/time vs. official support).
      *   **Emotional State:** Frustrated, humbling (theory vs. practice), stuck in a loop of resentment, worried about blowing up the system.
      *   **Constraints:** No direct confrontation ("honest conversation" is ruled out by user). Needs to choose between Options 1, 2, 3, or find Option 4.
