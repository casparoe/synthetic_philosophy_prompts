      *   *The Feud Fear:* "He catches on and stops answering my messages." *Good.* That's the point. If D only helps when he gets something, and you stop giving something, he stops helping. That's not a feud, that's market equilibrium. The user is mourning the loss of a *fantasy* relationship, not a real one.
