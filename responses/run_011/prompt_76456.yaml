answer: |-
  We should annotate the refractive role as a confirmed function, qualified by tissue specificity.

  This decision prioritizes the immediate physiological capacity of the protein over its evolutionary history. Our downstream users—clinical geneticists and variant callers—need to know what breaks when a mutation occurs, not necessarily why the gene was preserved over millions of years. If a variant destroys solubility and clouds the lens, labeling that protein solely as a "detox enzyme" fails the user. It suggests the variant is benign in the eye because the detox activity remains intact, when in reality the organism is blind. For a functional database, utility must trump historical purity. If a protein performs a specific, high-impact job in a specific tissue, that is a function for our purposes, regardless of whether natural selection explicitly targeted that role during recruitment.

  This commits us to a causal-role account of function. We are defining function by what a component contributes to the containing system's capacity, not by the historical selection pressure that fixed it. This is the only workable stance for a database covering non-model organisms. Requiring evidence of positive selection or deep phylogenetic conservation for every annotation effectively bans functional claims for most marine invertebrates, where comparative genomic data is sparse. It biases the database toward the dozen heavily studied species where someone has done the evolutionary legwork, rendering us useless for the biodiversity we claim to represent. We cannot make "unknown history" a barrier to "known mechanism."

  However, the strongest case against this recommendation deserves a full hearing. The argument for waiting on phylogenetic evidence is not merely academic pedantry; it is a safeguard against conflating side effects with functions. High concentration alone can create physical effects—like refractive index changes—that are merely incidental byproducts of expressing a detox enzyme at high levels. If we annotate every causal contribution, we risk flooding the database with "spandrels," obscuring the primary evolutionary jobs of these proteins. Furthermore, without selection signatures, we cannot distinguish between a recruited function that is biologically essential and a transient physiological quirk that might vanish in the next speciation event. By annotating now, we potentially hardwire a temporary state into the permanent record, misleading evolutionary biologists who use our data to reconstruct trait history. They need to know what was selected for, not just what works.

  To manage this risk without paralyzing our curators, we will adopt the following decision rule for all pending and future cases where evolutionary history is ambiguous:

  1.  **Capacity:** There must be direct biochemical evidence that the protein performs the role (e.g., purified protein alters refractive index).
  2.  **Context:** Expression must be significantly upregulated in the relevant tissue compared to the rest of the organism, indicating physiological relevance rather than background noise.
  3.  **Consequence:** There must be evidence that disrupting this specific role causes a phenotype (e.g., alleles reducing solubility track with lens clouding), even if the selection history is unknown.

  If all three criteria are met, we annotate the role as a function, tagged with a "tissue-specific" qualifier. If only the first two are met, we annotate as "observed activity" without assigning function. This rule allows us to capture real biological work in non-model organisms without lowering the evidentiary bar for mere biochemical promiscuity. It acknowledges that while history tells us why a protein is here, mechanism tells us what it does. For the users relying on us to interpret variants, the latter is the variable that matters. We will proceed with the squid lens annotation under this rule immediately.
