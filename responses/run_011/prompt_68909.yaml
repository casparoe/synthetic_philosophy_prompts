      *   **Core Mechanism:** In-class betting market. Three trading desks pricing the same contract ("Chord > Side of Inscribed Equilateral Triangle").
      *   **The Twist:** Each desk gets a *different* physical procedure for generating chords (Method 1: Two rim points; Method 2: Random midpoint/beanbag; Method 3: Random radius + random distance).
      *   **Required Prices:** 1/3, 1/2, 1/4.
      *   **Materials:** Cheap, assemble day before. One-page geometry card (no calculus).
