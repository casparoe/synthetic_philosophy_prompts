      *   **Advanced Mechanics:** Calculate correct price if generator is a fair die-roll among the three. Second round where the winning desk chooses the generator.
      *   **Information Structure:** Asymmetry is crucial. Cannot be an outright lie (or must be discharged in debrief).
      *   **Debrief:** Map phases to "at random," handle objections (different experiments vs. same problem; symmetry/invariance), Dutch Book critique.
      *   **Failure Modes:** Stalling, no trading, accusations of cheating. Recovery strategies.
      *   **Limitation:** Acknowledge what the market *cannot* reproduce (the absence of a generator).

  2.  **Deconstruct the Mathematics (Bertrand's Paradox):**
      *   *Problem:* Probability that a random chord is longer than the side of an inscribed equilateral triangle.
      *   *Method 1 (Random Endpoints):* Fix one point, choose second uniformly on circumference. Chord > side if arc is > 1/3 circumference. $P = 1/3$.
      *   *Method 2 (Random Midpoint):* Choose point uniformly inside disk. Chord > side if midpoint is within $r/2$ of center. Area ratio = $(\pi (r/2)^2) / (\pi r^2) = 1/4$.
      *   *Method 3 (Random Radius/Distance):* Choose radius uniformly, choose distance from center uniformly along radius. Chord > side if distance < $r/2$. Length ratio = $(r/2) / r = 1/2$.
      *   *Geometry Card:* Needs to establish side length = $\sqrt{3}r$ and the condition "midpoint within $r/2$".
      *   *Mixture:* If the settlement generator picks one of the three methods with $p=1/3$ each, the "true" probability is $(1/3 + 1/4 + 1/2) / 3 = (4/12 + 3/12 + 6/12) / 3 = 13/36 \approx 0.361$.

  3.  **Design the Market Structure:**
      *   *Roles:* 18 students. 3 Desks (3 students each = 9). 9 Traders (roaming). 1 Facilitator (Instructor).
      *   *Currency:* "PhilPoints" (or similar). Start with endowment.
      *   *Contract:* "LONGCHORD" pays 10 points if Chord > Triangle Side, 0 otherwise.
      *   *Market Maker Obligation:* Each desk must post a Bid and Ask. To ensure spread, maybe force them to post a single "Fair Price" at which they *must* trade up to a limit (e.g., 5 contracts). Let's simplify: They post a price $P$. They must buy or sell up to 5 contracts at $P$.
      *   *Arbitrage:* If Desk A says 1/4 (2.5 pts) and Desk B says 1/2 (5 pts), a trader can buy from A and sell to B.
      *   *Settlement:* Hidden generator.
      *   *Round 2:* Winner chooses generator. This forces them to realize the price depends on the *method*, not just the *question*.

  4.  **Information Asymmetry (The Crucial Bit):**
      *   *Constraint:* Cannot lie outright.
      *   *Solution:* "Proprietary Method." Each desk is told *their* method is the "Standard Protocol" for this market. They are told other desks are "Competing Market Makers" but *not* given their methods. They assume everyone is pricing the *same* underlying uncertainty. The instruction sheet says: "You are the primary liquidity provider for the Chord Contract. Use the provided Physical Protocol to determine the Fair Value." It does *not* say "Other desks are using different protocols." It implies a single market truth.
      *   *Ethical Check:* Is this a lie? It's an omission. In the debrief, I must reveal that the instructions were tailored. This is standard experimental economics (private information).

  5.  **Timeline (75 Minutes):**
      *   0-10: Intro & Setup.
      *   10-20: Desk Calculation (Geometry Card).
      *   20-35: Trading Round 1 (Hidden Generator).
      *   35-45: Settlement & Payout 1.
      *   45-55: Trading Round 2 (Winner chooses Generator).
      *   55-65: Settlement & Payout 2.
      *   65-75: Debrief.

  6.  **Drafting the Content - Section by Section:**

      *   *Materials:* Paper plates (circles), string/yarn (chords), markers, dice, beans (midpoints), instruction envelopes.
      *   *Geometry Card:* Needs to be clear.
          *   Fact 1: Side of triangle = $\sqrt{3}r$.
          *   Fact 2: Chord length $L = 2\sqrt{r^2 - d^2}$ where $d$ is distance from center.
          *   Fact 3: $L > \sqrt{3}r \iff d < r/2$.
          *   Wait, the prompt asks for *no calculus* and specific derivations for 1/3, 1/4, 1/2.
          *   *Desk 1 (Endpoints):* Fix point A. Triangle vertices divide circle into 3 arcs. Chord > side if 2nd point falls in the arc opposite A. Length of arc / Total circumference = 1/3.
          *   *Desk 2 (Midpoint):* Chord > side iff midpoint in inner circle radius $r/2$. Area ratio = $1/4$.
          *   *Desk 3 (Radius/Dist):* Fix radius. Chord > side iff distance from center < $r/2$. Length ratio = $1/2$.
      *   *Market Rules:* Need to ensure they *must* trade. "Market Maker Mandate."
      *   *The "Lie":* Frame it as "Operational Security." Each desk thinks their method is the *definition* of the random chord.
      *   *Dutch Book:* Why doesn't it work perfectly? Because each desk is coherent *conditional on their method*. The incoherence is in the *language* ("Random Chord"), not the math.
      *   *Failure Modes:*
          *   *Stalling:* Provide hint cards.
          *   *No Trading:* Incentivize traders heavily. Make the spread obvious.
          *   *Cheating:* Transparent settlement.
      *   *The "Missing" Feature:* The market *requires* a generator. Bertrand's paradox is about the *absence* of a generator. The facilitator must explicitly state: "In the real world, there was no generator. You built one."

  7.  **Refining the Mechanics:**
      *   *Points:* Start with 100 points.
      *   *Prices:* Post as percentages (33, 25, 50).
      *   *Settlement:* The instructor holds the "Black Box" (3 dice/methods).
      *   *Round 2:* The desk with the most points picks the method for the final settlement. This proves the price is method-relative.

