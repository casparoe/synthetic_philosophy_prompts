      *   *Correct Price (Mixture):* 13/36.
      *   *Information Structure:* "Proprietary Algorithm" framing.
      *   *Debrief Objections:* "Different experiments" (Give up: The idea that 'random chord' is a well-posed question without a method). "Symmetry" (Give up: The idea that physical symmetry uniquely determines probability without a selection mechanism).
