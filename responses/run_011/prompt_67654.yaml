      *   **Task:** Draft an opinion memorandum regarding a new petition (Ms. Ferenczi).
      *   **Constraint:** Use *only* the provided record (8 prior rulings + enabling statute + new petition). No external literature or real-world citations.
      *   **Tone/Style:** American English, formal register, 1,500 - 2,000 words.
      *   **Required Sections:**
          1.  Reconstruct candidate rules from the 8 outcomes (All-Subjected, All-Affected, Social Membership/Stake, Contribution/Reciprocity), noting refinements needed to fit the record. Highlight constraints from reasoning (Ruling 6 on interests, Ruling 7 on contribution).
          2.  Apply surviving rules to Ms. Ferenczi's petition (Primary: National Franchise; Alternative: District Franchise).
          3.  Recommend a decision based on coherence with the record, identify the closest analog, and address the tension with Ruling 3 (emigrant citizen).
          4.  Address underdetermination: State the principles adopted by each choice and future commitments (implications for trade/sanctions/emissions vs. Ruling 8's logic on unaccountable governance).
          5.  Propose a "discriminating petition" to test the two strongest candidate rules in the future.

  2.  **Analyze the Record (8 Prior Rulings):**
      *   *Ruling 1 (Non-citizen residents, 15 yrs):* **Grant.** Reason: Lives built inside institutions. (Supports Social Membership/Stake).
      *   *Ruling 2 (Commuter, non-resident):* **Partial Grant (Local only).** Reason: Work day lived under law, livelihood fixed, rest of life elsewhere. (Supports Refined All-Subjected or Stake limited to sphere of subjection).
      *   *Ruling 3 (Emigrant citizen, 30 yrs):* **Deny.** Reason: Ceased to share a life. *Note:* Acknowledged extraterritorial criminal liability but drew no consequence. (Challenges All-Subjected; supports Social Membership).
      *   *Ruling 4 (Grad student, 4 yrs):* **Deny.** Reason: 4 years doesn't make a "Commonwealth life." (Supports Social Membership/Duration threshold).
      *   *Ruling 5 (Undocumented, 9 yrs):* **Partial Grant (Local).** Reason: Regulated daily, children's prospects fixed, removable by officials they can't vote for. (Supports All-Subjected/Coercion + Stake).
      *   *Ruling 6 (Corporation):* **Deny.** Reason: Polity is relation among *persons* owing justification. (Limits All-Affected/Interest-tracking to natural persons).
      *   *Ruling 7 (16-17 yr olds, working):* **Deny.** Reason: Bright-line age. Franchise not a wage for contribution. (Limits Contribution/Reciprocity).
      *   *Ruling 8 (Offshore dependency):* **Grant.** Reason: Governed by officials answerable only to legislature they can't elect is a wrong *in that fact alone*. (Strong support for All-Subjected/No Taxation Without Representation logic).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the context. The Commission's duty is consistency and reason. The boundary problem is inherent.

      *   **Section 1: Reconstructing the Rules.**
          *   *Contribution/Reciprocity:* Ruling 7 kills the crude version (tax/work $\neq$ vote). Ruling 1 & 2 suggest contribution matters but isn't sufficient alone.
          *   *All-Affected (Interests):* Ruling 6 kills this for non-persons. Ruling 2 limits it (work vs. life). Ruling 3 limits it (emigrant affected by law but denied).
          *   *Social Membership/Stake:* Ruling 1, 3, 4 support this. Needs refinement: "Shared life" or "Institutional embedding." Ruling 8 pushes beyond this (dependency residents might not have "social membership" in the mainland sense but get the vote).
          *   *All-Subjected (Coercion/Law):* Ruling 5 & 8 support this strongly. Ruling 2 supports it partially. Ruling 3 is the outlier (subjected to criminal law but denied).
          *   *Synthesis:* The record supports a hybrid: *Subjection to coercive authority that structures daily life or creates unaccountable governance,* limited to *natural persons.* Crude "affectedness" is out (Ruling 6). Crude "contribution" is out (Ruling 7).

      *   **Section 2: Application to Ms. Ferenczi.**
          *   *Facts:* Foreign national, never visited, no ties. Subject to Security Trade Act (criminal liability, asset freeze). No hearing/representation.
          *   *National Franchise:* Under "Social Membership," she fails (no shared life). Under "All-Subjected," she qualifies (criminal liability, asset seizure).
          *   *District Franchise:* Under Ruling 2 (Commuter), district voting is for those whose *work* is locally regulated. Her "work" is regulated, but she isn't physically present. Ruling 8 suggests national vote for unaccountable governance.
          *   *Rule Application:*
              *   *Refined All-Subjected:* Grants vote (she is liable to indictment/seizure).
              *   *Social Membership:* Denies vote (no life built here).
              *   *Contribution:* Denies vote (pays no tax).

      *   **Section 3: Recommendation & The Ruling 3 Problem.**
          *   *Recommendation:* Grant National Franchise (or at least a mechanism for representation). Why? Ruling 8 is the strongest moral claim ("wronged in that fact alone"). Ruling 5 supports enfranchisement when removable/regulated by unaccountable officials.
          *   *Closest Analog:* Ruling 8 (Offshore Dependency). Both involve governance without representation. Ruling 5 is second (undocumented residents).
          *   *Addressing Ruling 3:* This is the hard part. The emigrant was subject to criminal law but denied.
          *   *Distinction:* The emigrant *chose* to leave and ceased "sharing a life." Ms. Ferenczi is reached *because* she is foreign/external, not despite it. The emigrant had a prior membership she abandoned; Ferenczi never had it. The "wrong" in Ruling 8 is about *structural* unaccountability. The emigrant had a vote once and walked away. Ferenczi is governed without ever having a channel.
          *   *Alternative:* Admit Ruling 3 creates tension but prioritize Ruling 8's principle of "no governance without representation" over Ruling 3's "shared life" when coercive power is direct and punitive.

      *   **Section 4: Underdetermination & Commitments.**
          *   *If Grant:* We commit to "All-Subjected" regarding coercive legal liability. Implication: Any foreigner subject to sanctions/criminal law gets a vote? That seems unworkable. Need to bound it: *Direct* coercive enforcement (indictment/seizure) vs. *Indirect* effects (trade policy/emissions).
          *   *If Deny:* We commit to "Social Membership." Implication: Ruling 8 is threatened. If Ferenczi (governed by unaccountable officials) gets no vote, why did the Dependency residents get one? We must argue Dependency residents are "subjects" in a way Ferenczi isn't (territorial vs. personal jurisdiction).
          *   *Arbitrary Line:* Distinguishing criminal liability from economic sanctions is tricky.

      *   **Section 5: The Discriminating Petition.**
          *   *Scenario:* A foreign environmental activist or industry owner affected by Commonwealth emissions regulations that carry civil penalties but no criminal indictment, who has no physical presence.
          *   *Prediction:* All-Subjected (strong) might deny (no criminal/coercive seizure). All-Affected (refined) might grant (livelihood destroyed).
          *   *Better Discriminator:* A foreign national subject to *civil* asset forfeiture under Commonwealth law without criminal indictment.
          *   *Prediction:* All-Subjected (Coercion focus) $\rightarrow$ Grant. Social Membership $\rightarrow$ Deny.

  4.  **Review and Refine (Self-Correction during drafting):**
