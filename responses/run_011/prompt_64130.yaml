answer: |-
  ### Premise Check: Is This Legit?

  **Verdict:** The premise is **pedagogically viable but metaphysically loaded.**

  You *can* stage this distinction in 75 minutes, but you cannot do it without the rules encoding the answer. The "discovery" will not be that the distinction exists in the wild (students won't stumble upon 2D semantics on their own); the discovery will be that *their intuitions fracture* when forced to apply two different evaluation rules to the same sentence.

  If you present this as "Look, meaning *is* two-dimensional," you are teaching dogma. If you present it as "Look, our truth-judgments shift depending on whether we hold meaning fixed or let it vary," you are teaching a tool. The activity below is designed for the latter.

  **Major Risk:** The activity assumes the coherence of the "Primary Intension" (the "world considered as actual" reading). Hardline Kripkeans (e.g., Scott Soames) argue this is a confusion of metaphysics with epistemology. The game treats the "Round 2" judgment as a legitimate truth-evaluation, which begs the question against 1D theorists. You must flag this in the debrief, or you are teaching a framework that looks airtight only because you hid the hard part in the rules.

  ---

  ### The Activity: "The Twin Verdict"

  **Class Size:** 14 (3 Groups of 4-5, 1 Group of 2 or join a group)
  **Materials:** 2-Page Handout (printed double-sided), Whiteboard/Projector for timer.
  **Goal:** Maximize "Credence Points" by matching the Instructor's Key.

  #### PAGE 1: RULES & SCENARIOS

  **THE MISSION**
  You are Semantic Judges. You will evaluate sentences in four Possible Worlds. You have 100 **Credence Points** to bet per Round.
  *   **Bet:** Distribute your 100 points across the 4 Cases. (e.g., Case 1: 25 pts on TRUE, Case 2: 25 pts on FALSE...).
  *   **Scoring:** If your verdict matches the **Instructor's Key**, you keep your points. If not, you lose them.
  *   **Winning:** The group with the most points after Round 2 wins (Bragging Rights + Candy).

  **THE SENTENCE**
  For all Cases, evaluate this sentence:
  > **"The liquid filling the lakes is water."**

  **THE WORLDS**
  *   **Case 1 (Standard):** Liquid is H₂O. Clear, tasteless, thirst-quenching. Fills lakes.
  *   **Case 2 (Twin):** Liquid is XYZ. Clear, tasteless, thirst-quenching. Fills lakes.
  *   **Case 3 (Slime):** Liquid is H₂O. Green, viscous, poisonous. Fills lakes.
  *   **Case 4 (Dry):** No liquid. Inhabitants hallucinate clear liquid filling lakes.

  **THE PROTOCOLS (READ CAREFULLY)**
  You will play two Rounds. The Worlds and Sentence stay the same. The **Protocol** changes.

  *   **ROUND 1: THE ANCHOR PROTOCOL**
      *   **Stance:** You are in the **Actual World** looking *out* at these worlds.
      *   **Rule:** The meaning of "water" is fixed by **our** actual world facts.
      *   **Task:** Given what "water" means *for us*, is the sentence true in that world?

  *   **ROUND 2: THE NATIVE PROTOCOL**
      *   **Stance:** You wake up **inside** that world. It turns out to be the **Actual World**.
      *   **Rule:** The meaning of "water" is fixed by **that** world's salient facts.
      *   **Task:** If this is our world, and we use "water" to talk about the stuff in the lakes, is the sentence true?

  ---

  #### PAGE 2: SCORECARD

  **GROUP NAME:** ___________________

  **ROUND 1: THE ANCHOR PROTOCOL**
  *Distribute 100 Points. Mark T (True) or F (False).*

  | Case | Verdict (T/F) | Points Wagered | **INSTRUCTOR USE ONLY** |
  | :--- | :---: | :---: | :---: |
  | **1 (Standard)** | | | Key: T |
  | **2 (Twin)** | | | Key: F |
  | **3 (Slime)** | | | Key: T |
  | **4 (Dry)** | | | Key: F |
  | **TOTAL KEPT** | | | _______ |

  **ROUND 2: THE NATIVE PROTOCOL**
  *Distribute 100 Points. Mark T (True) or F (False).*

  | Case | Verdict (T/F) | Points Wagered | **INSTRUCTOR USE ONLY** |
  | :--- | :---: | :---: | :---: |
  | **1 (Standard)** | | | Key: T |
  | **2 (Twin)** | | | Key: T |
  | **3 (Slime)** | | | Key: F |
  | **4 (Dry)** | | | Key: F |
  | **TOTAL KEPT** | | | _______ |

  **GRAND TOTAL (R1 + R2):** _______

  ---

  ### Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:10: Setup & Grouping**
  *   Divide into 3 groups. Hand out sheets.
  *   **Crucial:** Do not explain *why* there are two protocols. Just read the rules mechanically. If they ask "But what does water *really* mean?", say: "Follow the Protocol Rule. That is your only law for this round."
  *   Start Round 1.

  **00:10 – 00:25: Round 1 (The Anchor)**
  *   Groups deliberate. They should breeze through Case 1 & 2 (Kripke knowledge).
  *   Case 3 (Slime) might trip them up (Is H2O always water?).
  *   Collect Scorecards. **Do not reveal keys yet.**

  **00:25 – 00:40: Round 2 (The Native)**
  *   Hand back blank Round 2 section (or have them flip page).
  *   Read Round 2 Protocol. Emphasize: "Imagine you woke up there. It is *your* home. What does your word 'water' latch onto?"
  *   **Watch for:** Students arguing that "Water is H2O" is necessary, so Round 2 Case 2 must still be False.
  *   **Intervention:** If a group stalls on Case 2 Round 2, remind them: "The Rule says meaning is fixed by *that* world's salient facts. XYZ is the salient liquid." (This is the load-bearing instruction).
  *   Collect Scorecards.

  **00:40 – 00:55: The Reveal & The Friction**
  *   Project the Keys.
  *   **Case 2 is the bomb:** Round 1 = False. Round 2 = True.
  *   Ask groups to calculate scores.
  *   **The Moment:** Groups who bet heavily on Case 2 will have lost points in R1 and gained in R2 (or vice versa).
  *   Ask: "Did the *world* change? Did the *sentence* change? Why did the *truth value* flip?"
  *   Let them vent frustration. "That's cheating!" "That's two different questions!" -> **This is the target insight.**

  **00:55 – 01:10: Debrief (Mapping the Distinction)**
  *   Draw a 2x2 on the board.
  *   **Round 1 = Secondary Intension.** (Metaphysical Modality). Holding reference fixed. "Water is H2O" is necessary.
  *   **Round 2 = Primary Intension.** (Epistemic Modality). Letting reference vary with actuality. "Water is the watery stuff" is a priori.
  *   Connect to Kripke: Kripke focuses on Round 1. Twin Earth arguments often slide into Round 2 without noticing.
  *   Connect to Chalmers/Jackson: This is why we need 2D semantics to capture both intuitions.

  **01:10 – 01:15: Wrap Up**
  *   Announce winners.
  *   Assign reading: Chalmers "On Sense and Reference" or Jackson "From Metaphysics to Ethics" (Intro).
  *   Dismiss.

  ---

  ### Post-Mortem: What Will Go Wrong?

  **1. The "Rigged Game" Objection**
  *   **Prediction:** A sharp student will say, "Round 2 isn't truth, it's just changing the definition. You made Case 2 True by fiat."
  *   **Response:** Acknowledge this. "You are exactly right. The philosophical debate is whether Round 2 counts as *meaning* or just *epistemology*. The game forces the distinction so you can see what's at stake. If Round 2 feels like 'cheating,' that's a Kripkean intuition."
  *   **Fix:** Don't defend the game. Defend the friction.

  **2. The Stall on Case 3 (Slime)**
  *   **Prediction:** In Round 1, students might say H2O that is green/poisonous isn't water. In Round 2, they might say it is. This muddies the water (pun intended) because Case 2 is the clean divergence point.
  *   **Fix:** In the debrief, acknowledge Case 3 is messy (natural kind essentialism vs. functionalism). Tell them to focus on Case 2 for the core distinction.

  **3. Bookkeeping Boredom**
  *   **Prediction:** Students treat this as a logic puzzle to "beat the teacher" rather than a semantic inquiry. They just guess the key.
  *   **Fix:** Require a 5-word justification written next to the bet. "Because H2O" vs "Because clear liquid." This forces them to articulate the criterion. (Add this to the handout if space permits, or enforce verbally).

  **4. Time Creep**
  *   **Prediction:** Round 2 deliberation drags because they are arguing philosophy, not playing the game.
  *   **Fix:** Be a tyrant with the timer. "Protocol rules are law. Argue within the rules, not against them."

  ---

  ### Design Audit: Load-Bearing vs. Decoration

  **Load-Bearing Features (Do Not Change)**
  1.  **The Protocol Wording:** "Fixed by our actual world" vs. "Fixed by that world's salient facts." If you soften this, the distinction collapses.
  2.  **Case 2 (Twin Earth):** This is the only case where the divergence is clean. Case 1 and 4 are controls. Case 3 is a distractor.
  3.  **The Score Reveal:** They must see the *same* group get penalized in R1 and rewarded in R2 for the *same* verdict. This creates the cognitive dissonance.

  **Decoration (Can Be Cut)**
  1.  **Betting Points:** You could just have them raise hands for T/F. Points add tension, but if time is tight, cut the math and just compare verdicts.
  2.  **Case 3 & 4:** You could run with just Case 1 and 2. Case 3/4 add robustness but consume deliberation time.
  3.  **Winning Prize:** Candy doesn't matter. The "Winning" is the coherence of their semantic theory.

  **Confidence Level:** **75%.**
  *   **Why not 100%?** Because 2D semantics is controversial. If you have a hardline Kripkean in the room, they will correctly identify that Round 2 evaluates a *different proposition*, not the same one under a different mode. The activity treats the "Primary Intension" as a semantic value, which is the very point in dispute.
  *   **Why not lower?** Because pedagogically, it works to show *why* the dispute exists. Even if they reject 2D, they will understand the distinction you are trying to teach.

  ### Standing Objection Assumed Away

  **The "Metaphysical vs. Epistemic" Conflation.**
  The activity assumes that "World considered as actual" (Round 2) yields a legitimate truth value for the sentence *as we understand it*.
  *   **The Objection:** Soames/Kripke argue that when we consider Twin Earth as actual, we aren't evaluating the proposition <Water is XYZ>. We are evaluating <The watery stuff is XYZ>. We have changed the subject.
  *   **How the Activity Hides This:** The rules tell students to keep the sentence ("The liquid... is water") constant while shifting the world. This implicitly validates the 2D claim that the sentence has *two contents*. A 1D theorist denies this.
  *   **Your Duty:** In the debrief, you must say: "The game works by assuming 2D semantics is coherent. If you felt Round 2 was 'cheating,' you are channeling Scott Soames. The distinction we just mapped is the battleground."

  ### Final Advice
  If the discussion in Round 2 gets too heated (students refusing to accept XYZ as water), **stop the game.** That resistance *is* the lesson. Pivot immediately to the debrief: "Why was that so hard? Because you were holding 'Water = H2O' fixed even when the rules told you not to. That fixation is the Secondary Intension."

  Don't let them finish the scorecard if the philosophy is happening in real-time. The points are bait; the confusion is the meal.
