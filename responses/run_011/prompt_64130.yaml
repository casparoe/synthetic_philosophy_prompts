      *   **Objection:** This assumes descriptivism for Round 2. Kripke would say even in Round 2, if we find out it's XYZ, we say "That's not water."
      *   *Correction:* The Primary Intension isn't necessarily descriptivist. It's about *epistemic possibility*. "For all we knew a priori, could water have been XYZ?" Yes. So in the world considered as *actual*, the sentence "Water is XYZ" is true (or at least, the reference fixes to XYZ).
