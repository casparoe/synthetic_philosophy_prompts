answer: |-
  1. **Entry point**

  Before the first question, everyone at the table must grant one concession: anything you succeed in conceiving, you conceive as somehow present to your mind. This is supposed to be harmless because thinking is a mental act; you cannot think without a mind doing the thinking. Berkeley uses this to suggest that existence itself is tied to being perceived. The concession feels like a truism about attention, not a metaphysical trap. It asks only that you admit you cannot step outside your own head to check on things. If you refuse this, the game ends before it begins. If you grant it, you admit that every example you bring forward to prove an external world is, ironically, already inside your head. The tree begins where this concession starts to bite.

  2. **The tree**

  **1. The Conception Test**
  We start with the concession that to think of a thing is to have it in mind. Now we test the weight of that fact. When you try to picture a thing existing without anyone thinking of it, you fail. Does this failure prove such a thing cannot exist, or only that you cannot picture it?
  A. It proves impossibility. (Go to 2)
  B. It proves only my limitation. (Go to 3)

  **2. The Unperceived Gap**
  You accept the failure proves impossibility. But is there a difference between conceiving a thing as unperceived and conceiving a thing without perceiving it? One removes the observer; the other removes the act.
  A. There is no real difference. (Go to 4)
  B. There is a crucial gap. (Go to Leaf: Representationalist)

  **3. The Scaler Case**
  You think the failure is just your limitation. Consider a scaler in an empty basement counting pulses that nobody reads until Tuesday. Does it count while the room is locked?
  A. Yes, it counts regardless. (Go to Leaf: Flat-footed realism)
  B. Only if defined by eventual reading. (Go to 5)

  **4. The Matter Status**
  You believe existence requires perception. When people say "matter exists outside the mind," are they making a false claim or using a word that does no work?
  A. It is a false claim. (Go to 6)
  B. It is an empty word. (Go to 7)

  **5. The Tree Case**
  You define existence by eventual reading. Consider the tree behind the shutters of a house nobody's been in for a year. Is it there now?
  A. Yes, as a possibility of sight. (Go to 8)
  B. No, only when shutters open. (Go to Leaf: Deflationary)

  **6. The Other Minds Problem**
  You think matter claims are false. Does the same reasoning that finishes off matter also finish off other minds? If you can't perceive their mind, is it there?
  A. Yes, it kills other minds too. (Go to Leaf: Neutral or structural)
  B. No, other minds are different. (Go to 9)

  **7. The Grains Case**
  You think matter words are empty. Consider the number of grains in a sealed jar. Is there a specific number before opening?
  A. Yes, determinate but unknown. (Go to 10)
  B. No, number arises on counting. (Go to Leaf: Physical object as conditionals)

  **8. The Conditionals Check**
  You say the tree exists as a possibility. Is a physical object just a bundle of what-you'd-see-if-you-looked conditionals?
  A. Yes, that is all it is. (Go to Leaf: Physical object as conditionals)
  B. No, there is something holding the conditionals. (Go to 11)

  **9. The Handwriting Case**
  You save other minds but kill matter. Consider the handwriting in a notebook by someone who has died. Do the thoughts exist now?
  A. Yes, in a greater mind. (Go to Leaf: Berkeley's own view)
  B. No, they ceased with the brain. (Go to Leaf: Argument fails but immaterialism right)

  **10. The Language Trick**
  You think numbers are determinate. Is this whole debate just a language trick about what "exist" means?
  A. Yes, it is verbal only. (Go to Leaf: Deflationary)
  B. No, it touches reality. (Go to 12)

  **11. The Refusal Point**
  You think there is something holding the conditionals. Do you reject the starting concession entirely?
  A. Yes, I refuse the setup. (Go to Leaf: Flat-footed realism)
  B. No, I keep the concession. (Go to Leaf: Representationalist)

  **12. The Unpicturable World**
  You keep the concession but want a holder. Is there a world you admit you can't picture?
  A. Yes, I keep the outer world. (Go to Leaf: Representationalist)
  B. No, I drop the outer world. (Go to Leaf: Berkeley's own view)

  3. **The leaves**

  **Berkeley's own view**
  You land here if you think existence is strictly being perceived, but you save the world by positing a permanent perceiver. Your awkward commitment is that the universe is literally a thought in a mind that is not yours, which sounds like theology but must function as physics.

  **Argument fails but immaterialism right**
  You think the master proof is bad logic, but you still deny matter for other reasons. Your awkward commitment is defending a conclusion without the only argument that makes it intuitive, leaving you looking like you want the result without the cost.

  **Flat-footed realism**
  You refuse the starting concession or the scaler case. Your awkward commitment is explaining how you know your mind isn't tricking you about the basement, which you dismiss as a silly question until pressed.

  **Representationalist**
  You keep an outer world but admit it is unpicturable. Your awkward commitment is describing a thing that causes experiences while admitting you can never know what that thing is like apart from the experiences.

  **Physical object as conditionals**
  You say objects are just promises of experience. Your awkward commitment is explaining what makes the promise true if there is no underlying thing to keep it.

  **Neutral or structural**
  You think the logic kills other minds too. Your awkward commitment is living as if your friends exist while admitting your philosophy suggests they might be figments.

  **Deflationary**
  You think the debate is a language trick. Your awkward commitment is explaining why people feel so strongly about a trick, and why science works if it is just wordplay.

  4. **Empty squares**

  There are paths the tree opens that history ignores. One combination is accepting the master argument (Node 1A) but denying it kills matter (Node 4A), then claiming other minds are also false (Node 6A), yet refusing the deflationary exit (Node 10B). This is incoherent; it leaves you with nothing existing but your own current sensation, a solipsism so brittle no one sustains it. Another is accepting the conditionals (Node 8A) but insisting there is a holder (Node 11B). This is merely unattractive; it posits a ghostly glue holding the promises together without giving the glue any job to do. A third is claiming the grains are indeterminate (Node 7B) but the handwriting survives death (Node 9A). This is unexplored; it suggests numbers are subjective but thoughts are objective, a mismatched metaphysics that feels like special pleading for the soul.

  5. **Pairs I can't separate**

  The tree collapses two distinct views into the **Representationalist** leaf. Both the engineer who believes in a real world we model poorly and the Kantian who believes in a noumenal realm land here. They behave the same at the table but differ on whether the outer world is physical or structural. To break the tie, ask: "If all minds vanished, would the structure remain?" The engineer says yes; the Kantian hesitates. Similarly, **Flat-footed realism** and **Deflationary** often look alike in practice because both ignore the metaphysical worry. The tie-breaker is asking if the word "matter" is false or useless. One says false; the other says useless. If they agree, the tree cannot separate them, and you must let them drink in peace.

  6. **Kitchen-table notes**

  Run this strictly. Eight people will talk over each other. Assign one person to track the node number on a whiteboard. People will stall at Node 6 (Other Minds) because admitting friends might be unreal is socially painful; they will fake an answer to look consistent with Node 4. Engineers will cluster at Node 3 (Scaler) and refuse to move; let them have their leaf early rather than force them through the metaphysics. The classicist will linger at Node 9 (Handwriting). Do not let the debate on "empty words" at Node 10 become a linguistics lecture. If two people land on the same leaf but argue, check Section 5. If they land on different leaves but agree, the tree worked.
