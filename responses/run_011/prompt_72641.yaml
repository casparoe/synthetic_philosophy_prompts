  The shadow on the plate is white,
  She turns it off to save the light.
  A shape that looks just like a cloud,
  She says the name out loud.

  The circle here, the circle there,
  She draws a ring in empty air.
  It looks enough to call it same,
  She writes a word to match the name.

  The edge is sharp, the edge is clean,
  Like pictures in a magazine.
  She sorts them into pile A,
  And puts the others far away.

  The gray is not just empty space,
  It holds a specific, living trace.
  No longer just a shape of bone,
  But something claiming to be known.

  The measurement draws a hard line,
  It crosses over every mind.
  It does not fit the family tree,
  It is exactly what you see.

  The shadow is the living bone,
  It rests within the surgeon's hand.
  The learning ends where knowing starts,
  Separate as two different hearts.

  ***

  **Note on the Science**
  The deep-versus-surface distinction in problem-solving is settled science; decades of work (e.g., Chi, Feltovich, & Glaser, 1981) show novices sort by surface features while experts sort by functional principles, and transfer failures based on superficial similarity are robustly documented. However, Hofstadter and Sander's strong thesis—that categorization *is* analogy-making and concepts have no boundaries—is contested. Many cognitive scientists maintain that categorization (prototype/exemplar models) and analogy are distinct processes with different computational requirements. The Copycat models from their group are generally viewed as existence proofs in toy domains rather than evidence for general cognition, as they lack the scalability and mechanistic detail required by mainstream computational psychology. This poem leans into the strong thesis (the shadow *is* the bone, boundaries dissolve in stanzas 4–5) but respects Dana's objection by leaving the wall standing in stanza 6 (the "hard line" and "separate hearts"), acknowledging that a theory which cannot fail risks explaining nothing. The view that concepts are edge-less families is a minority position compared to the consensus that boundaries, while fuzzy, are functionally real.
