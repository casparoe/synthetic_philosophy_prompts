      *   *What does the gap tell us?* It shows the argument is a tool for ignorance, not a law of nature.

  9.  (Self-Correction during drafting): Make sure not to get too bogged down in Bayesian formulas. Keep it conceptual. Emphasize that "arithmetic" is a rhetorical move by the friend to shut down debate, but it's actually probabilistic modeling.

