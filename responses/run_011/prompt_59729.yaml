  The conference room clock read 11:43 PM. Outside, in the family waiting lounge, the relatives of Patient 409 were saying their goodbyes. Inside, the draft protocol lay open on the table, the cursor blinking at the end of Section 4, Paragraph 2.

  Dr. Helen Ashworth rubbed her temples. "We cannot sign off on 'permanent cessation' when the Dead Donor Rule requires death. If the determination is wrong, Samuel, we are not negligent. We are homicides."

  Dr. Samuel Okoro leaned forward, his hand hovering over the keyboard. "And if we adopt your language, Helen, we procure zero organs. Not because the patients aren't dead, but because your definition of death cannot be satisfied in a modern hospital. Read the sentence again."

  He read from the screen: *"The five-minute observation period establishes the irreversibility of circulatory cessation, confirming that spontaneous return will not occur and that the organism's integrated function has ceased."*

  "Irreversibility," Ashworth said. "It is the only word that satisfies the DDR."

  "It is a lie," Okoro countered. "Look at the new wrinkle. Starting next month, the normothermic regional perfusion rig is parked at the bedside. Primed. Staffed. It can restore circulation within sixty seconds of a verbal order. There is a standing order not to use it, but the attending can rescind that order at any moment. Including minute three of the observation period."

  Ashworth nodded slowly. "Exactly. If the attending can rescind the order at minute three and restore circulation, then at minute one, the cessation was not irreversible. It was merely uninterrupted."

  "So?" Okoro said. "The determination happens at minute five. Based on the plan in effect at minute five."

  "If the plan changes at minute three," Ashworth pressed, "and the heart beats again, then at minute one, the patient was not dead. Which means if we had procured at minute four, we killed a living person. Your protocol makes death contingent on a future decision that hasn't happened yet."

  "My protocol makes death contingent on a decision that *has* been made," Okoro corrected. "The decision to withdraw life-sustaining treatment. The decision not to attempt resuscitation. That makes the cessation permanent. Permanence is fixed by the recorded decision. Irreversibility is a modal claim about what technology could in principle undo. If you hold out for irreversibility, you entail that no one is ever dead. We could always imagine a future tech that fixes the heart. Are we to say the dead in 1950 are alive now because we have pacemakers?"

  Ashworth shook her head. "That is a category error. We are talking about the body in front of us, not hypothetical futures. But you are right about one thing: my view makes death hostage to available restorative capability. The bedside rig changes nothing about the patient's biology, but on my account, it changes everything about her status. If the machine is there, the loss is not irreversible. If the machine is broken, it is."

  "Which is absurd," Okoro said. "Death becomes a function of inventory management."

  "No," Ashworth said. "Death is a biological state. If the biology can be reversed by a machine sitting three feet away, the biology is not dead. The Dead Donor Rule says organs may be procured only from a donor already determined to be dead. If the rig makes the condition reversible, the donor is not dead. The standing order not to use it is a moral constraint, not a biological one. You are conflating 'we will not' with 'we cannot.' But 'we will not' is revocable. 'We cannot' is not."

  Okoro tapped the table. "So let's play out your scenario. Attending rescinds the order at minute three. Restores circulation. The patient lives. On your view, was the patient dead at minute one?"

  "No," Ashworth said. "Because the cessation was not irreversible."

  "On my view," Okoro said, "the patient was not dead at minute one because the observation period wasn't complete. But if we reach minute five, and the order stands, the patient is dead. If the attending changes their mind at minute three, they are initiating a new treatment plan for a living patient. They aren't proving the patient was alive at minute one; they are deciding not to declare death at minute five."

  "But the DDR requires the donor be *already* dead," Ashworth insisted. "Not 'will be dead if no one intervenes.' If the attending *can* intervene, the condition of irreversibility is not met. You are making death hostage to a revocable decision. On your account, a patient can be dead at minute five, and then at minute six, if the attending changes their mind and restarts the heart, the patient is... what? Resurrected? Or were they never dead?"

  "Resurrected," Okoro said flatly. "Or rather, the determination was conditional on the permanence of the cessation. If permanence is violated, the determination is voided. But until it is violated, the organism is dead."

  "That means death is retroactively editable," Ashworth said. "That cannot be a biological fact. That is a legal fiction. And we are barred from appealing to legal convention. We are tasked with the death of the human organism."

  "Fine," Okoro said. "Then tell me what the five minutes is doing. Evidentially. We agree it's not two minutes, because auto-resuscitation can happen. We agree it's not ten, because warm ischemia destroys the organs. What is it measuring?"

  "It is measuring the survival of brainstem and respiratory function under warm ischemia," Ashworth said. "It is evidence that the integrated functioning of the organism is gone. If the heart doesn't start, the brainstem dies. The five minutes is a proxy for the loss of integration."

  "It is evidence that spontaneous return will not occur," Okoro corrected. "It is a safety buffer against auto-resuscitation. It ensures that the cessation is stable. Once stable, and given the decision not to treat, it is permanent. That is death. Your reading makes the determination procedure impossible. You want proof of metaphysical irreversibility. I am offering proof of clinical permanence."

  "Is the deadlock," Ashworth asked, "a disagreement about what death is? Or a disagreement about what a determination procedure may safely treat as proof?"

  "Both," Okoro said. "If you define death as irreversible loss, you need proof that no intervention is possible. I can't give you that proof with a rig at the bedside. So you get no organs. If I define death as permanent cessation, I can give you proof that the heart won't start on its own, and we won't start it. I satisfy the DDR by ensuring we don't kill. We only take from those who have ceased permanently."

  "But if the rig exists," Ashworth said, "you *could* start it. So you are choosing to let them remain dead. Which means the death relies on the choice. If the choice changes, the death vanishes. That makes the organism's status dependent on the attending's will. That violates the 'organism as a whole' standard. The organism doesn't care about the attending's will."

  "The organism doesn't care," Okoro agreed. "But the ethics committee does. We are writing a protocol for agents, not for bodies. We need a rule that prevents homicide. My rule prevents homicide because it forbids procuring until permanence is established by time and decision. Your rule prevents homicide by forbidding procurement until magic happens."

  "It is not magic. It is biology."

  "It is metaphysics," Okoro said. "And it paralyzes us."

  They sat in silence for a moment. The hum of the ventilation system was the only sound. Ashworth looked at the blinking cursor.

  "We have to write the sentence," she said. "The family is waiting."

  "I know."

  "I cannot sign 'permanent'," Ashworth said. "It concedes that death is a social status rather than a biological state. It opens the door to saying a patient is dead because we decided to stop treating, rather than because their body stopped functioning."

  "I cannot sign 'irreversible'," Okoro said. "It claims a biological impossibility that the presence of the perfusion rig explicitly contradicts. It is empirically false. It exposes the committee to charges of dishonesty."

  "Then we write two versions," Ashworth said. "And we state the cost."

  Okoro nodded. He moved his hands to the keyboard. "Type this."

  He dictated slowly.

  **Draft A (Okoro):** *"The five-minute interval provides evidence that cessation of circulation and respiration is permanent, satisfying the condition that no spontaneous return will occur under the recorded decision not to restore circulation."*

  Ashworth read it. "You are grounding the death in the decision."

  "I am grounding the determination in the stability of the cessation," Okoro said. "To accept your version, I would have to admit that the presence of a functional perfusion rig means the patient is not dead, which renders the protocol useless."

  Ashworth took a breath. "My turn."

  She dictated.

  **Draft B (Ashworth):** *"The five-minute interval provides evidence that cessation of circulation and respiration is irreversible, confirming that the organism's integrated functioning has ceased and cannot be restored by spontaneous return."*

  "You left out the rig," Okoro noted.

  "I left out the rig," Ashworth said. "Because the rig is an external intervention. Irreversibility refers to the organism's capacity. If the organism cannot restart itself, and we are bound by the Dead Donor Rule not to intervene, the cessation is irreversible relative to the donor."

  "But the attending *can* intervene," Okoro said. "That's the standing order."

  "Then the attending must not," Ashworth replied. "To accept your version, I would have to concede that death is contingent on a revocable intention, which means a patient could be dead and then alive based on a change of mind."

  Okoro looked at the two paragraphs on the screen. They were mutually exclusive. One claimed permanence based on decision; the other claimed irreversibility based on biological integration.

  "The family," Okoro said.

  "They are still waiting," Ashworth said.

  "We can't agree."

  "No," Ashworth said. "We can't."

  Okoro saved the file as `DCD_Protocol_Deadlock_v4.docx`. He leaned back, rubbing his eyes. "If we submit both, the hospital legal counsel will throw it back."

  "If we submit one," Ashworth said, "one of us is lying about the nature of death."

  "Or one of us is protecting the dead, and the other is protecting the living who need organs."

  "I am protecting the dead from being killed," Ashworth said softly.

  "And I am protecting the living from dying while we argue about metaphysics," Okoro replied.

  He stood up. "I'll walk out with you. We'll tell the chair we need a third vote."

  Ashworth stood as well, gathering her papers. "The third vote won't solve it. It will just pick a side."

  "Then let it be on their heads," Okoro said. He turned off the conference room light. "But we write the sentence. Even if we don't agree on which one it is."

  "Agreed," Ashworth said.

  They left the room, leaving the cursor blinking between the two definitions, neither yielding, the five minutes still unexplained, the rig waiting at the bedside.
