          *   *Critique:* It *is* doing substantive work. It assumes the current self has standing to revoke the past self's authority. But is there a neutral formulation? Maybe "Latest *competent* wins"? But that begs the question of competence.
          *   *Verdict:* Point 3 holds up well. The "neutrality" claim of latest-wins relies on an assumption that current intent overrides past intent, which is exactly what's in dispute in Ulysses cases.

