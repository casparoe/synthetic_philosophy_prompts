          *   *Thought:* The user suggests "revocation requiring a reason" or "cooling-off periods."
          *   *Analysis:* If revocation requires a reason, who judges the reason? If the AI judges, we're back to vendor default (b) or paternalism (a). If a cooling-off period exists, who sets the length? The past self (a) or the vendor (b)?
