      *   **Q3: Where does it collapse if slices aren't distinct selves?**
          *   *Thought:* If it's just one person with noisy preferences, "latest wins" is the standard rational agent model (revealed preference).
          *   *Analysis:* If preferences are just noisy, then the "past self" isn't a wiser guardian, just a previous data point. The Ulysses metaphor relies on *systematic* divergence (sober vs. drunk), not *random* noise.
