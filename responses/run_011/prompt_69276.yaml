          *   *F-Twist Angle:* Does the "rationality" assumption predict smoking cessation rates well enough to justify the policy? Or is the assumption *too* false to license the policy conclusion?
      *   *Wait, let's refine:* The "Rational Addict" might be too niche. Let's go with **Job Search Theory (Reservation Wage).**
          *   *Assumption:* Unemployed workers know the distribution of wage offers and maximize expected present value.
          *   *Falsehood:* People don't know distributions; they have biases; they have liquidity constraints forcing them to take bad jobs.
          *   *Policy:* Unemployment benefits. If the model holds, benefits raise reservation wages (increase unemployment duration). If the assumption is *too* false (e.g., liquidity constraints dominate), benefits might not distort search much but prevent destitution.
          *   *Decision:* **Job Search/Reservation Wage** is solid, but maybe **Oligopoly/Cournot vs. Bertrand** is more intuitive for "assumptions driving outcomes."
      *   *Best Fit:* **The "Homo Economicus" assumption in **Public Goods/Free Rider** models.**
          *   *Assumption:* People only care about their own monetary payoff.
          *   *Falsehood:* People care about fairness, reciprocity (Fehr-Schmidt).
          *   *Policy:* Should the government fund public radio? Should we rely on voluntary donation schemes?
          *   *Why it works:* It's behavioral. It's policy-relevant. It highlights the "licensing" issue. If we assume selfishness, we predict zero contribution. If we predict *some* contribution, the assumption is "false" but maybe "good enough" to predict *low* contribution. But if we need to predict *threshold* effects for policy viability, the falsity matters.
      *   *Actually, let's go closer to the Flatmate's world (Macro/Finance) but keep it micro-foundational:* **Expected Utility Theory in Insurance Deductibles.**
