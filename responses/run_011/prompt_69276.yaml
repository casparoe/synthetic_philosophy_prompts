          *   *Okay, I need something where the assumption is FALSE but the prediction is GOOD, vs FALSE and prediction BAD.*
          *   *Let's go with the **Billiards Player** alternative requested:* **The "Profit Maximizing Firm" in Oligopoly.**
          *   *Assumption:* Firms know demand curves and competitor reactions perfectly.
          *   *Falsehood:* Managers use rules of thumb, bounded rationality.
          *   *Policy:* Antitrust/Mergers.
          *   *Why:* If we assume profit max, we predict price hikes on merger. If firms are actually incompetent, merger might not hurt consumers.
          *   *Okay, I will select **Job Search Theory (Reservation Wage)**.* It is standard Intermediate Micro. It has a clear assumption (known wage distribution, risk neutrality/expected utility). It has a clear policy (Unemployment Insurance). It allows for the "licensing" debate (Is the falsity of 'known distribution' fatal for predicting duration?)

      *   *Wait, I need to make sure it's not just "prediction."*
      *   *Let's pivot to **Auctions**.*
      *   *Assumption:* Independent Private Values (IPV). Bidders know their value, don't know others'.
      *   *Falsehood:* Common values, collusion, signaling.
      *   *Policy:* Spectrum auctions, procurement.
      *   *Why:* If IPV is false, the auction design fails (winner's curse).
      *   *Okay, sticking to the prompt's request for "Idealisation about how people behave... load-bearing for government."*
      *   *Selection:* **Hyperbolic Discounting vs. Exponential Discounting in Retirement Savings.**
      *   *Assumption:* People discount the future exponentially (time-consistent).
      *   *Falsehood:* People are present-biased (hyperbolic).
      *   *Policy:* Auto-enrollment vs. Tax subsidies.
      *   *Why:* If Exp is "false but licensed," subsidies work. If Exp is "false and unlicensed," you need nudges (auto-enrollment).
      *   *This is perfect.* It's behavioral, it's policy, it's micro, it distinguishes "idealization" (smoothing) from "false assumption" (no self-control problems).

