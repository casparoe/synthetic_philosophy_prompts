          *   *Okay, final decision:* **The "Representative Consumer" in Response to Tax Cuts.** (Ricardian Equivalence lite).
          *   *Assumption:* Consumers smooth consumption perfectly over infinite horizons.
          *   *Falsehood:* Liquidity constraints, myopia.
          *   *Policy:* Stimulus checks.
          *   *Why:* It's the Flatmate's world (Central Bank/Fiscal policy). It's micro-founded. It's clearly false (people spend stimulus).
