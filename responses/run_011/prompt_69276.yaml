      *   *The Nuance:* Friedman doesn't say *any* false assumption works. He says assumptions must be "sufficiently good approximation for the purpose in hand."
      *   *The User's Insight:* The real debate isn't "prediction vs. realism," it's "which idealizations are licensed?"
      *   *Pedagogical Challenge:* How to show that *some* false assumptions are necessary/good, while *others* are fatal, without resorting to "just check the predictions" (which is circular or long-term) or "check the realism" (which Friedman rejects).

  3.  **Develop the Core Example:**
      *   *Requirements:* Human behavior (not billiards/physics), load-bearing for policy, can't just be removed with more math.
      *   *Idea 1:* Rational Expectations. (Too technical for 2nd years?)
      *   *Idea 2:* Perfect Competition. (Standard, but maybe too abstract.)
      *   *Idea 3:* Time Consistency / Hyperbolic Discounting. (Good for behavior, but maybe too psych.)
      *   *Idea 4:* **The "Representative Agent" in Consumption Smoothing.**
