answer: |-
  Here is a 75-minute seminar plan designed to move students from slogan-warfare to methodological precision.

  ### 1. The Sequence and Dependencies

  You cannot discuss *licensing* until you have established *purpose*. Friedman's argument is instrumentalist: assumptions are licensed by the *purpose of the model*, not by their ontological status. If you jump straight to "which assumptions are okay," Camp A will say "the predictive ones" and Camp B will say "the realistic ones," and you're back at square one.

  **The Dependency Chain:**
  1.  **Purpose (0–15 mins):** Establish that the model is a tool for a specific job (policy design), not a photograph of reality.
  2.  **The Core Tension (15–30 mins):** Introduce the example. Show a case where the assumption is *known* to be false, yet the model is still used.
  3.  **The Licensing Criterion (30–50 mins):** Distinguish between *negligible* falsity (noise) and *constitutive* falsity (structural error). This is where you introduce the "undoable idealization" concept.
  4.  **The Stress Test (50–65 mins):** Apply the Lucas Critique intuition (without the heavy math). When does a previously licensed assumption become unlicensed?
  5.  **The Check (65–75 mins):** The assessment.

  **Why this order:** You must defeat the "All models are wrong" slogan before you can discuss licensing. If all models are equally wrong, licensing is meaningless. You need them to agree that some wrongness is *tolerable* and some is *fatal*.

  ---

  ### 2. The One Example: Retirement Savings & Time Discounting

  **The Model:** The Life-Cycle Hypothesis (standard Intermediate Micro version).
  **The Assumption:** **Exponential Discounting.** Agents have a constant discount rate ($\delta$) over time. They are time-consistent.
  **The Falsity:** Behavioral econ shows **Hyperbolic Discounting.** People are present-biased. They plan to save tomorrow, but when tomorrow comes, they spend.
  **The Policy Load:** **Mandatory Auto-Enrollment vs. Tax Subsidies.**
  *   *If Exponential is licensed:* People are already optimizing. Tax subsidies (matching contributions) work best to incentivize the margin.
  *   *If Exponential is unlicensed:* People have self-control problems. Tax subsidies fail (they just subsidize what people would have done, or money gets spent later). Auto-enrollment (nudges) is required to bypass the bias.

  **What this example must HAVE:**
  *   **Clear Policy Stakes:** The government loses billions if they pick the wrong model.
  *   **Known Falsity:** Students can accept "people are present-biased" as empirically true without needing a philosophy degree.
  *   **Non-Removable:** You cannot just "add math" to fix exponential discounting without changing the *class* of the model (from rational optimization to behavioral welfare analysis).

  **What this example must LACK:**
  *   **Complex Math:** Keep it to "Today vs. Future" trade-offs. No dynamic programming.
  *   **Moral Judgement:** Do not frame it as "people are stupid." Frame it as "preferences are time-inconsistent."

  ---

  ### 3. Misconceptions and Interception Points

  Here is how you handle the four misconceptions you identified, mapped to the timeline.

  | Misconception | Interception Point | The Move |
  | :--- | :--- | :--- |
  | **"Friedman says assumptions don't matter so nothing can be criticised."** | **Min 35 (Licensing Criterion)** | **Correction:** Friedman says assumptions don't matter *for prediction*, but they matter immensely for *intervention*. If you change the policy, the assumption might break. Criticism is valid when the assumption is **constitutive** to the mechanism. |
  | **"Treating F-twist as a claim about truth rather than a methodological rule."** | **Min 10 (Purpose)** | **Correction:** Explicitly state: "We are not asking if people *are* exponential discounters. We are asking if assuming they *are* helps us design a pension system that doesn't bankrupt the state." |
  | **"Thinking 'all models are wrong but some are useful' is the same insight."** | **Min 20 (Example Setup)** | **Correction:** Call this out as a conversation stopper. "Saying 'all models are wrong' is like saying 'all maps are distorted.' It doesn't tell me if this map will lead me off a cliff. We need to know *which* distortion matters." |
  | **"Using 'idealisation' and 'false assumption' interchangeably."** | **Min 40 (The Distinction)** | **Correction:** Define **Idealisation** as a simplification that preserves the causal mechanism (e.g., frictionless plane). Define **False Assumption** as one that breaks the mechanism (e.g., assuming gravity pushes up). The licensing question is: "Is this falsity an idealisation or a breakage?" |

  **What you're missing:**
  You are missing the **"As-If" Defense.** Camp A will argue: "It doesn't matter if they are hyperbolic, if they behave *as-if* they are exponential."
  *   *Intercept:* In savings, they demonstrably do *not* behave as-if. They fail to save despite intending to. The "As-If" defense fails here, which forces the Licensing Question.

  ---

  ### 4. The End Check (The "Lucas" Light)

  Do not ask them to define F-twist. Do not ask for an opinion. Give them a scenario where the *context changes*.

  **The Prompt:**
  > "Imagine the Treasury uses the Exponential Discounting model to predict savings rates. For 20 years, the model predicts accurately (luckily, biases cancelled out other errors).
  >
  > The Government now proposes a **new** policy: allowing early withdrawal for emergencies without penalty.
  >
  > **Question:** Does the fact that the model predicted well for 20 years *license* using it to predict the outcome of this new policy? Why or why not?"

  **Why this fails loudly for both camps:**
  *   **Camp A (Prediction is King):** If they say "Yes, because it predicted before," they fail. The policy change alters the decision environment, exposing the false assumption (present bias will trigger heavily on emergency access). Prediction history does not license structural falsity under intervention.
  *   **Camp B (Realism is King):** If they say "No, because the assumption is unrealistic," they fail to engage with the *licensing* nuance. The assumption might be unrealistic but licensed for *stable* environments. The point isn't realism; it's **robustness to intervention**.

  **The Correct Answer:** The license is revoked not because the assumption is false (it was always false), but because the *purpose* has shifted from passive prediction to active structural change, making the falsity constitutive rather than negligible.

  ---

  ### 5. What to Refuse (Scope Boundaries)

  You have 75 minutes. You must explicitly draw a line on the board at Minute 5.

  **1. Ontological Realism (The "Do they really maximize?" trap)**
  *   *Refusal:* "We are not debating whether humans have utility functions in their brains. We are debating whether acting *like* they do helps us avoid policy disasters."
  *   *Why:* This drags you into philosophy of mind.

  **2. The "Economics is a Science" Debate**
  *   *Refusal:* "We are not comparing Econ to Physics today. Physics has frictionless planes that don't exist either. The question is how *both* fields manage false assumptions."
  *   *Why:* Camp B loves this fight. It distracts from the methodological point.

  **3. Normative Welfare Judgements**
  *   *Refusal:* "We are not deciding if auto-enrollment is 'good' or 'bad.' We are deciding which model justifies it."
  *   *Why:* Camp B will try to turn this into a critique of neoliberalism. Camp A will turn it into efficiency defense. Keep it on the *model's validity*, not the policy's morality.

  **4. Lakatos/Kuhn/Research Programmes**
  *   *Refusal:* "We are not discussing whether the whole neoclassical paradigm is degenerating."
  *   *Why:* Too abstract. Keep it on the specific assumption (discounting) and the specific tool (policy design).

  ### Summary of the Flow

  1.  **0-10:** **Purpose.** Models are maps for specific journeys.
  2.  **10-25:** **The Savings Case.** Exponential vs. Hyperbolic. Policy stakes.
  3.  **25-40:** **The Flatmate's Challenge.** "Prediction is all that matters." Show where prediction works and where it breaks (the new policy).
  4.  **40-55:** **Licensing.** Negligible vs. Constitutive falsity. Idealisation vs. Breakage.
  5.  **55-65:** **The Stress Test.** The Early Withdrawal scenario.
  6.  **65-75:** **The Check.** Written response to the Stress Test.

  This structure respects your flatmate's rigor (prediction matters) but vindicates your intuition (not all false assumptions are equal), giving the students a tool to distinguish between the two camps without joining either.
