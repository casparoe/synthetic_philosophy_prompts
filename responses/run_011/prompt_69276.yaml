      *   **Students:** 2nd-year social science. Have intermediate micro (so they know utility maximization, constraints, etc.). No philosophy background.
      *   **The Problem:** Two polarized camps. Camp A: "Prediction is all that matters, assumptions are irrelevant" (Flatmate's view/Friedman caricature). Camp B: "Models are just political stories, assumptions are everything" (Cynical constructivism). Both think they know F-twist already.
      *   **Goal:** A 75-minute seminar plan that moves beyond slogans to the *licensing question* (which false assumptions are okay?).
      *   **Constraints:** Do *not* explain F-twist to the user. Focus on *how* to teach it. Specific requirements: Order/dependencies, One Core Example (not billiards/frictionless), Misconception management, End Check, Scope boundaries.

