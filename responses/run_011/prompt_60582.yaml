answer: |-
  Here is a frank diagnosis of your draft, addressing your five points in order, followed by structural advice for the cut.

  **1. Accuracy**
  Your characterisation of the historical shift is fair. You are correct that the original Frege–Geach objection targeted prescriptivist and ascriptivist accounts which lacked recursive semantics, and that contemporary expressivists (Gibbard, Schroeder) have indeed constructed recursive clauses that secure compositionality. You will not be accused of a straw man on that historical point.

  However, your description of the *mechanism* risks mischaracterisation. You claim the logical structure is "borrowed rather than earned." Gibbard and Schroeder would reject the term "borrowed." They argue that the logic of planning (or being-for) is *sui generis* but structurally isomorphic to the logic of belief. They do not admit they are importing truth-conditional logic; they argue they are discovering that practical attitudes obey the same formal constraints as theoretical ones.
  *   **Risk:** If you phrase this as them "importing" or "parasitically using" classical logic, they will reply that consistency is a formal property applicable to any content-bearing state, moral or otherwise.
  *   **Fix:** Sharpen your charge. It is not that they steal the logic, but that they cannot *justify* the specific recursive clauses for moral compounds without appealing to the validity patterns we already accept from the descriptive case. The charge is not theft, but *explanatory dependence*. You must make clear that the *direction of explanation* runs from logic to attitude, rather than attitude to logic.

  **2. Section 3: The Dilemma**
  Is this distinct from the "quasi-realism collapses into realism" complaint? Yes, but narrowly.
  *   **The Distinction:** The collapse objection is ontological or linguistic: if you can say everything the realist says, you are a realist. Your objection is *explanatory*: even if you remain an expressivist in ontology, you have failed to explain *why* moral sentences behave logically. You have merely fitted them to a pre-existing logical mould.
  *   **Does it earn its keep?** Yes. It formalises the "redundancy" charge from Section 2 into a forced choice. It prevents the expressivist from retreating to the claim that they are offering a "different kind" of explanation.
  *   **Survivability:** The paper can survive without it *if* Section 2 is strengthened to explicitly state the dilemma. However, Section 3 provides the necessary rigour to stop the audience from dismissing Section 2 as a mere analogy. Given your word count issues, do not cut Section 3 entirely, but consider merging it into a tightened Section 2.

  **3. Section 4: The Stress Test (Mixed Compounds)**
  Your supervisor is likely correct. This is the weakest link in the chain, and for a workshop presentation, it is a liability.
  *   **The Problem:** The mixed compound problem (moral $\lor$ descriptive) is the specific battleground where expressivists have done their most technical work (particularly Schroeder). They have ready-made responses regarding "generic" attitudes or the univocality of logical constants.
  *   **Your Claim:** You argue that specifying the attitude requires referencing "what is ruled out," which is representational.
  *   **The Counter:** Expressivists deny that "ruling out" a combination of plan and belief is representational. They classify it as a primitive practical inconsistency. By asserting it is representational, you are begging the question against the expressivist's core metaphysical distinction.
  *   **Assessment:** This section invites a technical quagmire in the Q&A that distracts from your main thesis (redundancy). If the audience gets bogged down in whether "ruling out" is representational, they will miss your point about explanatory priority. Furthermore, if Section 2 successfully argues that *all* recursive clauses are explanatorily redundant, Section 4 is merely a specific instance of that general claim. It does not add new leverage.
  *   **Advice:** Cut it. It is the most expendable part of the argument and the most likely to derail your presentation.

  **4. Section 5: The Deflationary Conclusion**
  Is it too concessive? No. It is the strongest part of the paper.
  *   **The Move:** Conceding that expressivism is a viable psychology while denying it is a viable semantics is a significant philosophical result. It dissolves the Frege–Geach problem by accepting the expressivist solution but denying its semantic significance.
  *   **Interest:** This makes the paper more interesting, not less. It shifts the debate from "Is expressivism true?" to "What kind of theory is expressivism?" It challenges the expressivist's self-conception. Most expressivists believe they are offering a semantics (or a quasi-semantics). Telling them they are merely doing moral psychology is a substantive critique.
  *   **Verdict:** Keep this intact. It is your payoff. Ensure you are clear that "idle" does not mean "false," but "explanatorily otiose regarding meaning."

  **5. Structural Advice on the Cut**
  You need to reduce the word count by approximately 30% (2,500 words). You cannot do this by trimming prose; you must remove sections.

  *   **Cut Section 1 (Radically):** Your audience is a metaethics workshop. They know the Frege–Geach problem. Do not recite the standard formulation. Spend one paragraph stating the standard view (incoherence charge) and one paragraph stating your revision (redundancy charge). Move directly to your reframing. Save 1,000 words here.
  *   **Cut Section 4 (Entirely):** As argued above, it is vulnerable and redundant given Section 2. Save 1,000 words here.
  *   **Merge Sections 2 and 3:** These sections argue the same point at different levels of abstraction. Section 2 says the clauses are borrowed; Section 3 says this leads to a dilemma. Combine them into a single, dense section titled "The Explanatory Dilemma." Use the Gibbard/Schroeder examples from Section 2 to illustrate the horns of the dilemma in Section 3. Save 500 words here.
  *   **Tighten Section 5:** Ensure the conclusion follows directly from the merged Section 2/3 without re-summarising the whole paper.

  **Proposed Structure for Presentation:**
  1.  **Introduction (5 mins):** The standard view is that F-G shows expressivism is incoherent. I argue modern expressivism is coherent but explanatorily redundant.
  2.  **The Compositional Success & The Borrowing Charge (10 mins):** (Merged old 2 & 3). Gibbard and Schroeder secure compositionality, but only by fixing the logical constants antecedently. The dilemma: either logic is independent (parasitism) or expressivist (overextension).
  3.  **The Deflationary Conclusion (10 mins):** (Old 5). If the logic is fixed antecedently, the attitude-clauses explain psychology, not semantics. Expressivism survives, but as psychology.
  4.  **Q&A (5 mins).**

  **Summary Diagnosis**
  Your core insight—that the Frege–Geach problem has shifted from a charge of incoherence to a hidden charge of explanatory redundancy—is excellent and worth presenting. However, you are currently fighting on two fronts: the general redundancy claim (strong) and the specific mixed-compound claim (weak). To survive the workshop, abandon the mixed-compound front. Focus entirely on the explanatory priority argument. Your supervisor's blunt assessment of Section 4 is correct; it invites objections you do not need to answer to make your main point.

  Cut the history, cut the mixed compounds, merge the dilemma, and deliver the deflationary conclusion with confidence. Good luck.
