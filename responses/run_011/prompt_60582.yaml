          *   *Analysis:* The collapse objection usually says: If you can say everything realists say, you *are* a realist. The user's objection is about *explanatory priority*. Even if you don't collapse ontologically, you collapse *explanatorily*. You aren't explaining logic via attitudes; you're fitting attitudes to a pre-existing logic.
          *   *Verdict:* It earns its keep *if* framed as explanatory redundancy rather than ontological collapse. However, it overlaps significantly with Section 2. Section 2 says "it's borrowed"; Section 3 says "if borrowed, then parasitic; if not, then you owe an account of descriptive logic." Section 3 tightens the screw but might be redundant if Section 2 is strong. It can survive without Section 3 if Section 2 is expanded, but Section 3 provides the formal dilemma structure that philosophers love.
