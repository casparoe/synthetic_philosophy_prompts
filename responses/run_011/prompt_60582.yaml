          *   *Impact:* This is actually a strong conclusion. It re-categorizes the project. It saves expressivism from refutation but strips it of semantic significance.
          *   *Interest:* It makes the paper interesting. It changes the landscape. "Expressivism is true but irrelevant to semantics."
          *   *Risk:* Expressivists *want* to do semantics. If they concede it's just psychology, they admit defeat on the F-G problem (which was a semantic problem). So the conclusion is effectively: "F-G shows expressivism isn't semantics." That's a solid punch.
