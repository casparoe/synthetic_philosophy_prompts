  3.  **Address the Specific Questions:**

      *   **1. Accuracy:**
          *   *Standard Formulation:* The user is right that the original F-G (Geach, Searle) targeted non-cognitivism/prescriptivism specifically regarding assertion conditions. Modern expressivists (Blackburn, Gibbard, Schroeder) explicitly build recursive semantics.
          *   *Compositionality:* It is accurate to say Gibbard (plan-laden contents) and Schroeder (B-for) offer recursive clauses.
          *   *Straw Man Risk:* The risk lies in claiming they "borrow" the structure. Gibbard argues plans *have* a logic analogous to belief. Schroeder argues for a unified logic of attitudes. The user needs to be careful not to imply they *stole* it without justification, but rather that the justification relies on structural isomorphism with truth-conditional logic. The "borrowed rather than earned" phrase is provocative but needs nuance. Proponents would say the logic is *internal* to the attitudes, not imported.
          *   *Verdict:* Mostly accurate, but watch the "borrowed" claim. It's the crux of the disagreement.

      *   **2. Section 3 (The Dilemma):**
