  I

  The clock strikes one upon the night
  I walk along the bedroom wall
  And see a strip of yellow light
  Cast outward from the empty hall
  There's someone standing in the door.
  I raise my heavy limbs from bed
  The light spills out upon the floor
  And words are quietly unsaid

  II

  The silence lets the quiet fall
  I find myself expecting more
  No echo gives a distant call
  No star remains to shine so bright
  There's someone standing in the door.
  The pulse is thumming in my head
  The dark obscures the clearest sight
  Till eyes become with tears all red

  When morning came I found the filament destroyed upon the kitchen tile
  Though this night matched the other for a while

  Octave I is the perception. The couplet settles it by revealing the bulb was broken the morning after the second night, characterizing that night only as the one that matched the first.
