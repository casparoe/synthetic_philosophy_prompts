prompt: |-
  Our family foundation disburses roughly $18 million a year, and the docket now mixes two very different kinds of proposal: near-term interventions with measurable effects on identifiable people, and speculative ones whose case rests on astronomically large stakes multiplied by very small probabilities — a seed grant to reduce risks from advanced AI, a program to preserve and later revive cryonically stored patients, a campaign to accelerate space settlement. The board has adopted a standing rule I must operationalize: no proposal may be rejected merely because its stated probability of success falls below some fixed floor, since that is the one move that guarantees we never fund anything transformative. At the same time, our last review cycle produced an internal report arguing that the organization has drifted into what it called "practical fanaticism," accepting unbounded expected-value reasoning in every case where it happened to favor a charismatic applicant.

  Write the decision procedure my team should run on each such proposal before it goes to the board. It must be executable in about an hour by an officer without formal training in philosophy; it must not resolve the underlying debate about whether expected value maximization is the right decision rule, but instead specify what the office should do while that debate is unresolved; and it must state in order what to ask, what counts as a sufficient answer, where the procedure returns a refusal, and where it hands the choice to the board because the question is one of values. Include explicit handling of the two structural problems these proposals raise — that the probability estimates are produced by the applicants themselves, and that the claimed payoffs are so large that small differences in probability swamp every other consideration — and say what the procedure cannot settle. Then run it on two cases: a request to fund research on hibernation-like torpor for long-duration spaceflight, and a request to fund a routine, well-evaluated mosquito-net distribution program whose officers argue the nets' value is understated.

  Mark clearly which parts of your procedure reflect positions that are settled among people who work on these questions and which are genuinely contested, and do not present a contested view as the consensus. Where a step is a judgment call dressed up as a rule, say so.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Context:** A family foundation disbursing ~$18M/year.
      *   **Problem:** The docket mixes "near-term/measurable" (e.g., mosquito nets) with "speculative/high-stakes/low-probability" (e.g., AI risk, cryonics, space settlement).
      *   **Constraint 1 (Board Rule):** Cannot reject solely based on low probability (no fixed floor).
      *   **Constraint 2 (Internal Report):** Accusation of "practical fanaticism" (uncritical acceptance of high EV claims by charismatic applicants).
      *   **Task:** Write a decision procedure for staff officers to run *before* the board sees a proposal.
      *   **Constraints on Procedure:**
          *   Executable in ~1 hour by a non-philosopher.
          *   Must *not* resolve the EV maximization debate (must remain agnostic).
          *   Must specify order: questions, sufficient answers, refusal points, board hand-off points.
          *   Must handle structural problems: self-reported probabilities and infinite/swamping payoffs.
          *   Must state what the procedure *cannot* settle.
          *   Must distinguish settled vs. contested positions (no false consensus).
          *   Must apply the procedure to two test cases: (1) Space torpor research (speculative), (2) Mosquito nets (routine, but claimed understated value).

  2.  **Deconstruct the Ethical/Decision-Theoretic Tension:**
      *   *Longtermism/Effective Altruism (EA) view:* Maximize Expected Value (EV). If $P \times V$ is huge, fund it, even if $P$ is tiny.
      *   *Critique (Practical Fanaticism):* $P$ and $V$ are often made up. Charisma biases $P$. "Pascal's Mugging" problems (tiny $P$, infinite $V$ dominates everything).
      *   *Board Mandate:* Don't ban low $P$.
      *   *Staff Reality:* Need a filter to prevent garbage high-EV claims from clogging the board's agenda, without imposing a personal philosophical veto.

  3.  **Drafting the Procedure - Step-by-Step:**

      *   *Goal:* Create a "Sanity Check" framework, not a final verdict engine.
      *   *Time Limit:* 1 hour. This means no deep due diligence on the science, just checking the *structure* of the argument.
      *   *Step 1: Categorization.* Is this Near-Term (NT) or Speculative High-Stakes (SHS)? This determines the scrutiny level.
      *   *Step 2: The Probability Check (Addressing Self-Reporting).* Applicants claim $P=10\%$. Is that defensible? We can't verify truth, but we can verify *process*. Did they use a reference class? Or is it a guess?
      *   *Step 3: The Payoff Check (Addressing Swamping).* Is the value claim bounded? If they claim "Save all future humans," that's unbounded. We need to check for "Pascal's Mugging" vulnerabilities without banning them outright.
      *   *Step 4: Robustness/Sensitivity.* If $P$ drops by 10x, does it still look good compared to NT options?
      *   *Step 5: The Hand-off.* If it passes sanity checks but relies on contested value judgments (e.g., is a potential future life equal to a current life?), it goes to the Board.

      *   *Refining the "Settled vs. Contested" requirement:*
          *   *Settled:* Self-reported probabilities without reference classes are unreliable. Unbounded utility functions lead to decision paralysis (Pascal's Mugging).
          *   *Contested:* Whether to discount future lives. Whether to cap utility. Whether EV maximization is the *only* goal.
          *   *Procedure Stance:* Acknowledge the uncertainty. Don't say "EV is wrong." Say "EV is unstable here, Board must decide risk tolerance."

  4.  **Developing the Test Cases:**
      *   *Case 1: Space Torpor.* High stakes (making space travel feasible), low prob (biology is hard), long timeline. Fits SHS.
      *   *Case 2: Mosquito Nets.* High prob, measurable, near-term. But applicant argues "understated value" (maybe macroeconomic effects?). Fits NT, but needs to ensure the "understated" claim doesn't turn into speculative EV bloat.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Introduction:* Set the tone. This is a triage tool, not a philosophy exam.
      *   *The Procedure:* Break it down into phases.
          *   Phase 1: Classification.
          *   Phase 2: Epistemic Hygiene (The Probability).
          *   Phase 3: Value Bounding (The Payoff).
          *   Phase 4: Comparison & Hand-off.
      *   *Addressing Structural Problems:* Explicitly mention "Reference Classes" for probability and "Capping/Discounting" for value.
      *   *Settled vs. Contested:* Use sidebars or bold text to highlight this.
      *   *Application:* Run the two cases through the steps.

  6.  **Critical Review against Constraints:**
      *   *1 Hour?* Yes, if focused on documentation and logic, not field verification.
      *   *No Philosophy Training?* Avoid jargon like "Pascal's Mugging" in the instructions (or define it simply). Use "Unbounded Payoff Risk."
      *   *Board Rule?* Yes, we don't reject for low $P$, we reject for *unsupported* $P$.
      *   *Internal Report?* Yes, we check for charisma bias by demanding reference classes.
      *   *Settled vs. Contested?* Need to be very careful here. I must explicitly label where the procedure makes a pragmatic choice vs. a philosophical truth.

  7.  **Final Polish:**
      *   Ensure the distinction between "Staff Refusal" (procedural failure) and "Board Decision" (value judgment) is clear.
      *   Make sure the "Mosquito Net" case doesn't get unfairly penalized for being boring, but also doesn't get inflated value claims accepted without scrutiny.
      *   Ensure the "Space Torpor" case isn't rejected for being speculative, but is flagged for value uncertainty.

      *(Self-Correction during drafting)*: I initially thought about suggesting a probability cap. But the Board rule says "no proposal may be rejected merely because its stated probability... falls below some fixed floor." So I cannot set a floor. I *can* require justification for the number.
      *(Self-Correction on "Settled")*: It is *not* settled that reference classes are the only way to estimate probability. It *is* settled among statisticians that uncalibrated expert judgment is biased. I need to phrase this carefully: "Best practice in forecasting" vs "Philosophical requirement."

  8.  **Finalizing the Structure:**
      1.  Preamble (Purpose & Limits).
      2.  Legend (Settled vs. Contested).
      3.  The Procedure (Steps 1-5).
      4.  What This Procedure Cannot Settle.
      5.  Application to Case A (Torpor).
      6.  Application to Case B (Nets).

      *Let's write it.*
answer: |-
  # Foundation Staff Decision Procedure: High-Stakes Proposal Triage

  **Purpose:** To prepare proposals for Board review by ensuring arguments are structurally sound, without making final value judgments on risk tolerance or moral weighting.
  **Time Budget:** 60 minutes per proposal.
  **Operator:** Program Officer (no philosophy training required).
  **Authority:** This procedure identifies *procedural deficiencies* (Staff Refusal) and *value conflicts* (Board Decision). It does not grant final approval.

  ---

  ## Legend: Settled vs. Contested Positions
  *Throughout this document, steps are marked to distinguish between widely accepted analytical practices and genuine philosophical debates.*

  *   **[SETTLED PRACTICE]:** Methods widely accepted in forecasting, auditing, or risk management as necessary for reliability (e.g., requiring evidence for numbers).
  *   **[CONTESTED VALUE]:** Philosophical questions where reasonable people disagree (e.g., how to weigh future lives vs. current lives). This procedure does **not** resolve these; it flags them for the Board.

  ---

  ## The Procedure

  ### Step 1: Classification (5 Minutes)
  Determine the primary category of the proposal.
  *   **Type A (Near-Term):** Benefits accrue within 10 years to identifiable individuals. Effects are measurable via standard monitoring/evaluation.
  *   **Type B (Speculative High-Stakes):** Benefits rely on low-probability, high-impact events, often affecting future generations or existential outcomes.

  **[SETTLED PRACTICE]:** All proposals must be classified. Mixed proposals must be split into A and B components for separate review.

  ### Step 2: Epistemic Hygiene Check (20 Minutes)
  *Addresses the problem of self-reported probabilities.*

  **Action:** Examine the applicant's probability of success ($P$) and impact magnitude ($V$).
  **Question:** Is the estimate derived from a **Reference Class** or **Internal Narrative**?
  *   *Reference Class:* "Similar technologies succeeded X% of the time in the past."
  *   *Internal Narrative:* "Our team is brilliant, and the science looks promising, so we estimate 20%."

  **Rule:**
  1.  If Type A: Require historical data or pilot results.
  2.  If Type B: Require a reference class of similar speculative attempts, OR a clear breakdown of conjunctive probabilities (e.g., "Step 1 must work [50%] AND Step 2 must work [40%]...").

  **[SETTLED PRACTICE]:** Uncalibrated internal narratives are statistically unreliable indicators of probability.
  **[CONTESTED VALUE]:** Whether a lack of reference class should disqualify a unique, unprecedented intervention.

  **Decision Point:**
  *   **Staff Refusal:** If the applicant provides *only* an internal narrative with no attempt to anchor probabilities in data or logical breakdowns. (Reason: "Insufficient basis for estimation," not "Probability too low.")
  *   **Pass to Step 3:** If a reference class or logical breakdown is provided, even if the resulting $P$ is tiny.

  ### Step 3: Payoff Bounding Check (15 Minutes)
  *Addresses the problem of swamping (where huge $V$ makes $P$ irrelevant).*

  **Action:** Check if the claimed Value ($V$) is bounded or unbounded.
  **Question:** Does the proposal claim to secure an *infinite* or *lexical* priority outcome (e.g., "Saving all future humanity")?

  **Rule:**
  1.  If the claim implies an unbounded value (e.g., "Preventing human extinction"), note that small changes in $P$ dominate all other budget considerations.
  2.  Ask the applicant: "If your probability estimate is off by a factor of 100, does this project still rank above our Type A (Near-Term) portfolio?"

  **[SETTLED PRACTICE]:** Unbounded value claims create mathematical instability in decision-making (often called "Pascal's Mugging" in literature).
  **[CONTESTED VALUE]:** Whether it is morally permissible to cap or discount the value of future lives to restore stability.

  **Decision Point:**
  *   **Board Flag:** If the project relies on unbounded value to justify its cost. This is not a refusal; it is a mandatory note to the Board that "This proposal dominates the budget mathematically only if we accept unbounded utility."
  *   **Pass to Step 4:** If the value is bounded (e.g., "Improving GDP by X%") or if the applicant acknowledges the sensitivity.

  ### Step 4: Robustness & Opportunity Cost (10 Minutes)
  *Addresses the "Practical Fanaticism" concern.*

  **Action:** Compare the proposal against the foundation's median Type A grant.
  **Question:** Does the proposal require us to believe *three or more* highly uncertain premises simultaneously to beat the alternative?

  **Rule:**
  1.  List the "Conjunctive Premises" (things that must all be true for the EV to hold).
  2.  If there are >3 critical premises with $P < 50\%$, mark as "High Fragility."

  **[SETTLED PRACTICE]:** Chains of uncertain premises reduce overall reliability faster than intuition suggests.
  **[CONTESTED VALUE]:** Whether "High Fragility" is a valid reason to deprioritize a transformative goal.

  **Decision Point:**
  *   **Board Flag:** If marked "High Fragility." The Board must decide if transformative potential outweighs fragility.
  *   **Pass to Step 5:** If robust or low fragility.

  ### Step 5: Final Routing (10 Minutes)
  **Action:** Assemble the packet.

  **Routing Logic:**
  1.  **Staff Refusal:** Only if Step 2 (Epistemic Hygiene) failed. *Reason: We cannot evaluate what is not quantified.*
  2.  **Board Decision:** All other cases.
      *   Include a **"Value Conflict Memo"** if Step 3 or Step 4 triggered a flag.
      *   The Memo must state: "This proposal requires the Board to accept [Unbounded Value / High Fragility] to justify funding over Near-Term alternatives. This is a value judgment, not a factual error."

  ---

  ## What This Procedure Cannot Settle
  *   **The Moral Weight of the Future:** It cannot decide if a potential future life is worth as much as a current life.
  *   **The Validity of EV Maximization:** It does not enforce Expected Value maximization as the sole decision rule, nor does it forbid it.
  *   **Truth of Science:** It does not verify if the science works, only if the *uncertainty* is acknowledged.

  ---

  ## Application to Test Cases

  ### Case 1: Hibernation-like Torpor for Spaceflight
  *   **Type:** Speculative High-Stakes (Type B).
  *   **Step 2 (Epistemic):** Applicant claims 15% chance of viable human torpor in 10 years.
      *   *Check:* Do they have a reference class? Likely no direct human class. Do they have a conjunctive breakdown? (e.g., metabolic suppression [50%] + no neural damage [60%] + reversibility [50%]).
      *   *Outcome:* If they provide the breakdown, **Pass**. If they say "We feel confident," **Staff Refusal**.
  *   **Step 3 (Payoff):** Applicant argues this enables space settlement, potentially billions of lives.
      *   *Check:* This is an unbounded value claim.
      *   *Outcome:* **Board Flag.** Memo states: "Value claim swamps $18M budget if accepted. Board must decide if they accept lexical priority of potential future lives."
  *   **Step 4 (Robustness):** Requires biology to work, economics of space to improve, and political will to exist.
      *   *Outcome:* **High Fragility.**
  *   **Final Routing:** **Board Decision.** Packet includes flags on Unbounded Value and High Fragility. Staff does not reject, but ensures Board knows the math relies on contested value assumptions.

  ### Case 2: Mosquito-Net Distribution (Claimed Understated Value)
  *   **Type:** Near-Term (Type A).
  *   **Step 2 (Epistemic):** Applicant claims standard mortality reduction, *plus* macroeconomic growth effects that double the EV.
      *   *Check:* Mortality data is reference-classed (strong). Macroeconomic claim: Is it reference-classed? If they cite specific studies on health/wealth correlation, **Pass**. If they assert it without citation, **Staff Refusal** on the *extra* claim.
  *   **Step 3 (Payoff):** Value is bounded (number of nets $\times$ lives saved $\times$ economic multiplier).
      *   *Outcome:* No Unbounded Value Flag.
  *   **Step 4 (Robustness):** Nets work. Distribution logistics are the main risk.
      *   *Outcome:* Low Fragility.
  *   **Final Routing:** **Board Decision** (Standard). No Value Conflict Memo needed unless the "understated value" claim relied on speculative macro-modeling. If the macro claim was weak, Staff trims the budget request to cover only the proven mortality benefit before sending to Board.

  ---

  ## Analyst Notes on Procedure Design (Settled vs. Contested)

  1.  **The "Reference Class" Requirement:**
      *   *Status:* **[SETTLED PRACTICE]** in forecasting/auditing.
      *   *Why:* It prevents "Inside View" bias. However, it is **[CONTESTED]** in longtermist philosophy, where some argue unique interventions *have* no reference class. The procedure sides with the auditing standard for operational safety, forcing the applicant to justify why they are unique, rather than accepting uniqueness by fiat.

  2.  **The "Unbounded Value" Flag:**
      *   *Status:* **[CONTESTED VALUE]**.
      *   *Why:* Some philosophers argue we *must* accept unbounded value if it's true. Others argue it leads to absurdity. The procedure does not solve this. It forces the Board to acknowledge they are making a philosophical choice, not a mathematical one.

  3.  **The "Staff Refusal" Limit:**
      *   *Status:* **[PROCEDURAL RULE]**.
      *   *Why:* Staff can reject *incoherent* arguments (Step 2 failure), but cannot reject *unpopular* values (Board rule). This distinction protects the Board's mandate while protecting the staff from "Practical Fanaticism" (funding things just because the math looks big but the inputs are made up).

  4.  **Handling Probability Floors:**
      *   *Status:* **[BOARD MANDATE]**.
      *   *Why:* The procedure explicitly avoids setting a $P$ floor (e.g., "No projects under 5%"). It instead sets a *justification* floor. This complies with the Board's rule while addressing the Internal Report's concern about charisma bias. A charismatic applicant can propose a 0.0001% project, but they must show *how* they got that number.
