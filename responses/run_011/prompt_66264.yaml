answer: |-
  This is a heavy spot to be in. You are describing a classic "dirty hands" problem in leadership: the conflict between doing what is necessary to preserve the institution and doing what is morally transparent to the people you represent.

  You saved the core of the union (the 180+ full-time jobs and pensions) at the expense of a marginalized subset (the part-timers) and the democratic process (the lie).

  Here is an breakdown of the situation, not from a place of judgment, but from a place of strategy and sustainability—for both you and the local.

  ### 1. Maturity or Damage?
  It is likely **moral injury**, not maturity.

  Maturity is feeling the weight of a decision and carrying it anyway. Damage is no longer feeling the weight because your nervous system has adapted to the stress of deception. You "stopped flinching." That is a survival mechanism. It allows you to function, but it also disconnects you from the consequences of your actions.

  In a union president, empathy is a tool. If you lose the ability to feel the "sick" feeling when you make a hard call, you risk making the *wrong* hard call next time because the feedback loop is broken. You need to monitor this. If you find yourself viewing members as numbers rather than people more often, that is damage. If you view them as numbers only when necessary to save the whole, that is leadership. The line is thin.

  ### 2. The Denise Situation
  Helping Denise does not "balance" the ledger. It is **penance**, not absolution.

  *   **Does it help her?** Yes. Unemployment paperwork is a nightmare, and you are using your power to aid someone your decision harmed. That is the right thing to do.
  *   **Does it help you?** It alleviates your guilt, which is why you do it.
  *   **The Risk:** If Denise ever finds out that you knew the cuts were negotiable and chose not to fight for them, your help will look like manipulation. It creates a power dynamic where you are both the executioner and the savior. Continue helping her because it is your duty as a representative to *all* members, not because it makes you feel less like a liar.

  ### 3. To Confess or Not to Confess
  You asked if telling them is you "trying to feel clean on their dime." **Yes, partly.** But it's more complicated than that.

  **The Case for Silence (Strategic):**
  *   **Stability:** A confession now could trigger a recall election. If you are removed, the new leadership might not have your institutional knowledge or your relationship with management. The next contract could be worse.
  *   **Leverage:** You cannot negotiate effectively if the membership thinks you are incompetent or dishonest.
  *   **The "Greater Good":** You already made the utilitarian calculation. 180 saved vs. 13 cut. Disrupting the union now helps no one.

  **The Case for Disclosure (Ethical/Long-term):**
  *   **Trust is Currency:** You spent your trust capital on that lie. You are currently operating on a deficit. If this comes out during the next negotiation (and secrets in unions *always* come out), management will use it to divide the room, and the membership will feel betrayed twice.
  *   **Democratic Integrity:** A union is a democracy. By hiding the term sheet, you turned a vote into a ratification of your authority, not a decision by the members. That sets a dangerous precedent for your own power.

  **The Verdict:**
  Do not call a mass meeting tomorrow to confess. That is indeed about *your* guilt, not *their* benefit. It would burn down the house to clean the rug.

  **However, you cannot lie again.**
  You are entering a renegotiation window. You must shift your strategy. You do not need to stand up and say, "I lied last year." You can say: *"Last year, we made a strategic retreat to save the core. We traded part-time hours and COLA to keep maintenance in-house. That was a emergency measure. This year, our priority is restoring what we lost."*

  This acknowledges the trade-off without explicitly detailing the deception regarding the term sheet. It frames the previous decision as a "strategic retreat" (which it was) rather than an unavoidable mandate.

  ### 4. Advice for the Next Year
  You are walking a tightrope. Here is how to keep your balance:

  1.  **Stop the Numbing:** Find a place where you *can* flinch. A therapist, a mentor outside the union, a journal. You need a space where you don't have to be the "President" so you can process the moral weight of what you did. If you don't, that numbness will spread to other areas of your life.
  2.  **Radical Transparency Moving Forward:** You cannot afford another shadow. For the next negotiation, over-communicate. Show the term sheets. Explain the trade-offs *before* the vote. You need to rebuild the trust you spent.
  3.  **Make the Part-Timers Priority #1:** If you truly believe the math works out, prove it. Make the restoration of the part-time crew the headline of the next campaign. Show the membership you haven't forgotten the cost of the last deal.
  4.  **Prepare for the Leak:** Assume someone knows. Maybe a steward saw the term sheet. Maybe management talks. Have a plan. If confronted, do not double down. "We were in a crisis. I made a call to save the majority. I take responsibility for how that was communicated."
  5.  **Review Your Bylaws:** Ensure that your handling of the vote doesn't open the union to legal challenges from the dissenters. Know your exposure.

  ### Summary
  You made a choice that saved the union but compromised your integrity. That is a real cost. You are not a villain, but you are not innocent either.

  Don't confess to clear your conscience; confess only if it becomes strategically necessary to save the contract. Instead, let your actions in the next year be the confession. Fight harder for the people you sacrificed last time. Earn the right to have made that call by ensuring it was the *last* time they had to pay that price.

  And please, talk to someone outside of this situation about the numbness. Leaders who stop feeling the weight of their decisions eventually crush the people they are trying to hold up.
