  2. This view decouples a rule's pedigree from its content by asserting that administrative regularity can generate binding obligations even when the underlying sovereign claim is void. It implies that the validity of private law derives from the need for social continuity rather than the moral or constitutional righteousness of the enactor.
  3. This approach quietly rules out strict natural law theory, which would deny any legal character to the acts of an illegitimate regime, and pure command theory, which requires a valid sovereign for any obligation to exist. It also excludes hard positivism that ties validity strictly to source criteria without exception for efficacy or social consequence.
  4. The halves are consistent only under a purpose-relative view of validity, which allows courts to prioritize order in private spheres while denying political legitimacy. Under a unitary view of validity, however, the private law recognition is a pragmatic smuggle that sacrifices doctrinal purity for stability.
  5. If courts adopted a rival view requiring absolute sovereign legitimacy for any legal effect, they would be forced to void all private transactions, rendering property titles insecure and family statuses undefined. This would necessitate a massive legislative remediation to restore rights that the judiciary refused to recognize under the usurping regime.
