      *   **Fit:** Accommodates all cases. It treats "packaging" as an extrinsic relation (the glass remains the object; foam is external) and "design" as intrinsic constitution (the product is the composite object; foam is internal). It handles the Target by asking whether the polymer is a constituent of the glass *qua* the object in question.
