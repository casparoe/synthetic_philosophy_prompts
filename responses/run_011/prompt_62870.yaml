  ### Candidate Principles and Predictions

  To anticipate your colleague's ruling, we must distill a principle from her verdicts that handles finks, masks, and mimics while respecting the crucial packaging/design distinction. Three candidate principles emerge from the literature and her track record:

  1.  **Simple Conditional Analysis (SCA):** *x is disposed to M if x would M were it stimulated.*
