  Ok, so — you're going to play a political philosopher who also genuinely understands how paid leave insurance is structured. I need both halves, please don't just give me abstract equality theory. Think carefully, and before the final list, spend a paragraph brainstorming out loud about all the things one sentence like this could possibly be asserting.

  Background, sorry for the ramble. I work at a mid-size tech company in the US (about 1200 people) and my wife is due in April. Our parental leave policy is: one pooled family entitlement of 18 weeks paid at 70% of your own salary, the couple decides who takes what, plus 4 extra weeks of "physical recovery" leave for whoever gives birth. You need 12 months of tenure and to be scheduled 30+ hours a week to be eligible at all.

  I wanted to take half of it. Then we sat down with the actual spreadsheet and it turns out I couldnt really afford to — since its 70% of each person's own pay, every week I take costs the household noticeably more than every week she takes, and I'm the higher earner by a decent margin. So the "neutral" design kind of made the decision for us. Same arithmetic showed up again when we priced daycare: if she stretches her leave out, we save on infant care, which is the identical calculation wearing a different hat. I brought this to our employee resource group and proposed carving 6 of the 18 weeks out as non-transferable for each parent, the way the reserved months in some countries work. Our HR lead killed it on the spot. Her line was that the policy is already "gender neutral," that carving weeks out would be the company telling families how to live, and that we can't be in the business of engineering people's private choices.

  That phrase. What is "gender neutral" actually claiming in her mouth? Lay out every distinct precise claim that could be hiding in it, as a menu — probably six to nine readings — that I can take back to the ERG, not an essay that picks one reading and runs with it. For each one I want:

  - what it says exactly: whose leave, measured how, at what point in time (eligibility? weeks allotted? dollars? uptake? outcomes ten years out?)
  - whether it's a claim about the wording of the policy document, an empirical prediction about how couples will use it, or a normative ideal about what fairness requires
  - whether the policy I described above actually satisfies it
  - how strong it is: which readings are platitudes nobody disputes, which are substantive and defensible, which are flat false, and which sound like one claim but are really two different ones smuggled together

  Then tell me which of the readings, if any, would actually earn her the conclusion she wants — that the policy is fair as written, and that making weeks non-transferable is an illegitimate intrusion on family choice. Do the same treatment for the second slogan, because "letting families choose" got repeated about four times in that meeting: what could that mean, which versions are compatible with a policy that already tilts the choice one way through the payment formula, and where does the word "choice" quietly switch between the couple's joint household decision and each parent's individual decision?

  Also flag any pair of readings that can't both be true at once, and note any reading where the honest verdict is "nobody actually holds this, it's just said to end the conversation."

  No reading list, no citations, don't send me off to read anything — I'm typing this on my phone on the train and I just need the analysis. And please don't invent numbers about my company or about other countries' systems; if a reading can only be settled by an empirical fact, just name the fact it would need and move on.
