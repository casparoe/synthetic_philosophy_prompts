  *   **Relational Egalitarianism:** **Not Owed Compensation.**
      *   *Reasoning:* He suffers no oppression, domination, or stigma. He stands as an equal in the democratic community. Distributing extra resources for a private medical issue that doesn't affect his civic standing is a matter of charity or healthcare policy, not *distributive justice* defined by equality of status.
  *   **Dworkinian Resourcism:** **Not Owed Compensation.**
      *   *Reasoning:* Unless the pain prevents him from converting resources (like the wheelchair), it is a welfare deficit. If he chose not to insure against this in the hypothetical market (given he copes well), he gets no top-up.

