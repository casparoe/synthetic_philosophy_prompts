answer: |-
  Your hypothesis is sharp, but it identifies the *symptom* of the disagreement rather than the *pathology*. You are correct that the causal-historical chain is the battleground, but you are mistaken in thinking that the battle is about transmission mechanics alone. If it were just about whether a chain exists, you could settle it with high-resolution data on learning events. The fact that you can't suggests the disagreement is not empirical.

  Here is the diagnosis.

  ### 1. The Unstated Premise: Causal Independence
  Your causal-historical hypothesis is half-right. The anthropologist demands a lineage because she requires the cultural unit to be **causally independent** of the cognitive machinery reconstructing it.

  *   **Her Premise:** For a unit to be a replicator, it must exert causal power *across* minds without being dissolved *into* minds. If the stability of the unit is explained by the structure of the human mind (attractors), then the "replicator" is an epiphenomenon. The real cause is the cognitive bias, not the lineage. She views the "meme" as a reification of a cognitive process.
  *   **Your Premise:** For a unit to be a replicator, it must exhibit **population-level dynamics** that can be modeled *as if* it were independent, regardless of the underlying cognitive noise. You view the "meme" as a functional abstraction that captures differential retention, even if the mechanism is reconstruction.

  The fight isn't about whether copying happens; it's about **where the explanation lives**. She wants the explanation in the *processor* (the human mind). You want the explanation in the *software* (the cultural lineage).

  This makes your disagreement a **Model-Relative Ontology** dispute. You are arguing over which entities are permitted to exist in your explanatory framework. She denies the ontology of the meme because she believes it steals causal credit from cognition. You affirm it because you believe cognition is too messy to explain population-level stability without the abstraction.

  ### 2. Why the Examples Fail
  You noted that every example (melodies, rituals, keyboards) supports whichever side you already hold. This is because you are both applying **theory-laden observation**.

  *   When you see a melody persist, you see **retention**.
  *   When she sees a melody persist, she sees **reconstruction toward a cognitive norm**.

  The data looks identical because high-fidelity replication and strong cognitive attractors produce the same statistical signature: stability over time. You cannot distinguish them by looking at the *outcome* (the persisted song); you can only distinguish them by looking at the *counterfactuals*.

  *   **Your test:** If we change the selection pressure, does the variant change even if the cognitive attractor stays the same?
  *   **Her test:** If we change the cognitive attractor, does the variant change even if the selection pressure stays the same?

  Since you never run these counterfactuals, you just talk past each other. The examples are noise because both models can fit the same historical data retrospectively.

  ### 3. Classification of the Disagreement
  This is not a verbal dispute, though it uses words like "gene" and "replicator" as proxies. It is not purely empirical, because the data underdetermines the theory.

  It is a **Methodological Incommensurability**.
  *   **Your camp** is doing **Population Thinking**: You care about frequency changes in a pool of variants. You need discrete units to make the math work.
  *   **Her camp** is doing **Process Thinking**: She cares about the transformation of meaning during transmission. She needs continuous variables to make the psychology work.

  You are asking: "Can we model this system using Darwinian algorithms?"
  She is asking: "Is the Darwinian algorithm a truthful description of the mechanism?"

  The answer to your question can be "Yes" while the answer to hers is "No." That is why you are stuck. You are validating the *utility* of the model; she is validating the *fidelity* of the analogy.

  ### 4. Is Your Causal-Historical Hypothesis Wrong?
  It is not wrong, but it is derivative. She demands a causal-historical chain *because* she believes that without it, the "unit" has no causal power of its own. If the chain is broken (low fidelity), then the persistence of the pattern must be explained by something else (the attractor).

  The deeper unstated premise is **Causal Sufficiency**.
  *   She believes: Cognitive attractors are *sufficient* to explain stability; replicators are unnecessary.
  *   You believe: Cognitive attractors are *necessary background conditions*, but replicators are required to explain *differential success* between variants.

  If you attack the causal-historical requirement directly, she will retreat to the sufficiency claim. You need to attack the sufficiency claim.

  ### 5. What Counts as Progress?
  You will not resolve this by defining "replicator" better. You will not resolve it by finding a new example. Progress requires shifting from **Ontology** (what is it?) to **Boundary Conditions** (when does the model break?).

  **A. The Formal Result (The Convergence Test)**
  You need to determine if the two models are mathematically equivalent under certain conditions.
  *   *Task:* Can you show that a system of strong cognitive attractors produces the same differential equations as a system of replicators with selection?
  *   *Progress:* If yes, the dispute is merely pragmatic. You admit the mechanism is reconstruction; she admits the dynamics are Darwinian. You agree to use the "replicator" label as a shorthand for "attractor dynamics that look like replication."
  *   *Progress:* If no, there must be a divergence point. Find the specific parameter where the predictions split.

  **B. The Experiment (The Counterfactual Strain)**
  Stop looking at stable traditions. Look at **maladaptive persistence**.
  *   *Task:* Find a cultural variant that persists *against* cognitive ease and *against* individual utility, solely due to lineage structure (e.g., a ritual that is hard to learn, costly to perform, but persists because of network structure).
  *   *Progress:* If you find it, her attractor model struggles (why persist if it's not an attractor?). If you can't find it, her model wins (everything persists because it fits the mind).
  *   *Alternative:* Find a variant that *should* be an attractor (easy to learn) but dies out due to competition. This supports your selection model.

  **C. The Distinction (Vehicle vs. Replicator)**
  Adopt a distinction that allows both of you to be right.
  *   Distinguish between the **Causal Vehicle** (the brain state/event, her side) and the **Evolutionary Individual** ( the pattern across time, your side).
  *   Agree that the *vehicle* is reconstructed (she wins) but the *pattern* undergoes selection (you win).
  *   This requires her to admit that selection can act on patterns even if the copying is imperfect, and you to admit that the "copying" is actually "reconstruction guided by the pattern."

  ### 6. The Hard Truth
  If you cannot agree to the "Boundary Conditions" approach, you should not coexist. You should **divide the labor**.

  The memetics debate has stalled for decades because both sides try to claim the *whole* explanation.
  *   **Her domain:** Micro-transmission. How does Idea A become Idea A* in a single learner? (Psychology/Anthropology)
  *   **Your domain:** Macro-dynamics. Why is Idea A more common than Idea B in the population after 100 years? (Epidemiology/Evolutionary Modeling)

  **The Verdict on Coexistence:**
  If you continue to argue about whether culture *is* evolutionary, you will fail.
  If you argue about **which timescales and which phenomena are best captured by evolutionary models**, you can co-teach.

  **Recommendation:**
  Propose a truce based on **Explanatory Scope**.
  1.  Acknowledge that for high-fidelity, low-meaning transmission (e.g., fashion trends, viral hashtags), your replicator model is superior.
  2.  Acknowledge that for high-meaning, high-reconstruction transmission (e.g., religious doctrine, moral norms), her attractor model is superior.
  3.  Make the seminar about mapping the **spectrum** between the two, rather than defending one pole.

  If she refuses to admit that *any* cultural phenomenon behaves like a replicator, the disagreement is ideological, not scientific. If you refuse to admit that *most* cultural transmission is reconstruction, you are ignoring the mechanism.

  The progress lies in stopping the fight over the label "memetics" and starting the fight over the **domain of applicability**. That is a fight you can win, or at least, a fight that produces knowledge.
