  ### Adjudication of Moves

  **(1) Ilse: Partly Right.**
  Ilse correctly characterizes the mechanics of the leveling-down objection (LDO): a telic egalitarian must admit the leveled-down state is better in one respect despite being worse for some and better for none. However, her inference is flawed. Demonstrating that telic egalitarianism is counterintuitive does not logically entail prioritarianism; other views, such as sufficientarianism or deontic egalitarianism, also avoid the objection. She moves too quickly from a negative critique to a positive conclusion.

  **(2) Marcus: Partly Right.**
  Marcus is technically correct that the LDO presupposes a person-affecting constraint (that a state cannot be better unless it is better for someone) which telic egalitarians explicitly reject. Charging question-begging is therefore valid in a strict logical sense. However, his analogy regarding the dead friend is weak; duties to the dead are typically grounded in relational obligations or autonomy, not in the impersonal value of a state of affairs, which is what telic equality claims to be. He identifies the logical stalemate but fails to defend the substantive plausibility of the egalitarian position.

  **(3) Ilse: Right.**
  Ilse successfully dismantles Marcus's analogy. Duties arising from prior relationships are agent-relative, whereas telic equality is an agent-neutral, impersonal value. Her pressure point is stronger: if a value never recommends an action, generates no regret, and alters no feelings, it is difficult to defend its reality. She effectively argues that a *pro tanto* good that is never decisive in practice risks being metaphysically idle.

  **(4) Marcus: Partly Right.**
  His defense of pluralism is sound: a value can be real even if it is frequently outweighed by competing values (like truth versus kindness). However, his attack on prioritarianism regarding the "meaningful zero" is a known technical objection but not necessarily fatal; prioritarians can posit a theoretical minimum or natural zero of welfare. His claim that prioritarianism is "comparative concern wearing a disguise" is insightful and highlights a genuine instability in the view, but it is asserted rather than proven here.

  **(5) Ilse: Right.**
  Ilse correctly identifies a structural vulnerability in pluralistic egalitarianism. If equality has any intrinsic weight, there is a theoretical scenario where a Pareto improvement (which increases inequality) is ranked as worse overall because the loss in equality outweighs the gain in welfare. Prioritarianism avoids this by design, as it never assigns negative weight to a benefit. Her defense of the prioritarian weighting function as analogous to diminishing marginal utility is also a standard and reasonable rebuttal to the zero-point charge.

  **(6) Marcus: Right.**
  Marcus offers the most accurate meta-ethical assessment. The LDO is a negative argument that refutes monistic telic egalitarianism, but it does not positively validate prioritarianism. All plausible views must quantify the trade-off between efficiency and distribution; the LDO merely shifts the burden of explaining that trade-off rather than resolving it. He correctly identifies that the dispute is about the *weight* of distribution, not its existence.

  ***

  ### Further Questions

  **1. Do any of the moves trade on a confusion between *better in some respect* and *better all things considered*?**
  Yes, **Ilse's first move** trades on this confusion. When she argues that a good realized only by making people worse off "is not a good but an artifact of bookkeeping," she conflates *all-things-considered* badness (the leveled-down world is worse overall) with *pro tanto* badness (the lack of a specific egalitarian value). She assumes that because the egalitarian respect never wins out in the leveling-down case, it must be empty. Marcus correctly identifies this distinction in his fourth move, noting that a value can be systematically outweighed without being nonexistent.

  **2. Which of the two is more right about the question they were actually arguing, namely whether the leveling-down objection establishes prioritarianism?**
  **Marcus is more right.** The leveling-down objection is a destructive tool, not a constructive one. It demonstrates that equality cannot be the *sole* intrinsic value if we accept the person-affecting intuition, but it does not dictate *how* we should value the worse-off instead. Prioritarianism is one option, but so is sufficientarianism, or a hybrid view. Ilse treats the death of telic egalitarianism as the automatic victory of prioritarianism, which is a non sequitur. Marcus correctly notes that the objection merely relocates the disagreement to how much weight distribution carries, rather than settling the theory of value.

  **3. What is the most important thing both of them overlooked?**
  Both overlooked the viability of **deontic egalitarianism**. While Ilse specifies she is attacking *telic* egalitarianism, the conclusion she draws ("we should be prioritarians") assumes that the only way to care about the worse-off is through an evaluation of states of affairs. Deontic egalitarianism grounds claims in fairness, rights, or relations between persons rather than the impersonal value of outcomes. This view is immune to the leveling-down objection because it does not claim the leveled-down state is better *in any respect*; it claims only that the original unequal state was unjust. By framing the debate as a choice between telic egalitarianism and prioritarianism, both ignore the most robust alternative that preserves egalitarian commitments without accepting telic values.
