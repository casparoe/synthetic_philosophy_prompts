answer: |-
  This is a worthy procrastination. If you write a book about dying while lying about what death *is*, the prose will smell false. You need a working metaphysics, not necessarily the true one.

  You are torn between **Experientialism** (badness requires a subject to feel it) and **Narrativism** (badness is a property of the life's shape). Your instincts are inconsistent because you are trying to apply both to cases that demand different ones.

  Here is a single principle that unifies 90% of your verdicts by reframing "harm" not as pain, but as **frustrated agency**.

  ### The Principle of Standing Intention

  **Definition:** An event is a harm to a person if and only if it contradicts a *standing intention* or *valuation* held by that person while they were competent, regardless of whether they experience the contradiction.

  **The Clauses & Your Cases:**

  1.  **The Origin Clause:** *The intention must originate in a conscious self.*
      *   **Saves:** The Pre-birth Asymmetry. You didn't mind the four billion years before because there was no "you" to hold an intention to exist. Post-death, the intention to continue existed *before* the cut.
      *   **Saves:** The Dementia Case. The harm of death is lessened because the capacity to hold standing intentions (memory, recognition) dissolved *before* the biological end. The "projector" broke before the screen went dark.

  2.  **The Continuity Clause:** *The intention must be projective (aimed at a future).*
      *   **Saves:** The 27-year-old Cellist vs. The 93-year-old. The cellist held active intentions for a future that was severed. The 93-year-old's intentions were fulfilled or naturally expired. Death is the period at the end of the sentence; it is only a tragedy if it cuts the word in half.
      *   **Saves:** The Grandmother (11 months) vs. The Aunt (6 weeks). The 11 months allowed for *new* intentions to form (reconciliation, preparation, fear). The Aunt's narrative was simply stopped; the Grandmother's narrative was forced to *change shape* before stopping. The weight you feel is the weight of that forced revision.

  3.  **The Integrity Clause:** *The contradiction can be factual (truth) or functional (success).*
      *   **Saves:** The Affair. The husband intended to be in a faithful marriage. That intention was contradicted by reality, even if he didn't know.
      *   **Saves:** The Manuscript (Sinking vs. Plagiarism).
          *   *Sinking:* Her intention was to publish. She published. The market's silence is neutral.
          *   *Plagiarism:* Her intention was to be the *author*. The revelation makes her a thief in the public record. This actively contradicts her standing intention of integrity.
          *   *(Note: This validates your instinct that plagiarism is worse, but for a specific reason: it rewrites the past, not just the future.)*

  ***

  ### The Stress Test: Four New Situations

  Run this principle against these four scenarios. They are designed to break the principle in ways useful for a plot.

  **1. The Ghost Finish**
  A writer dies with a half-finished masterpiece. Her literary executor finds her notes and finishes the book exactly as she would have. It is a triumph.
  *   **Principle Verdict:** Not a harm. Her standing intention (to create the work) was fulfilled by proxy.
  *   **Dramatic Tension:** Does the executor have the right to claim her intention? If the executor changes one word to make it better, does it violate the Integrity Clause?

  **2. The Happy Deception**
  A man dies believing his estranged son forgave him (the son lied to make him feel better). In reality, the son still hates him.
  *   **Principle Verdict:** Harmless. His standing intention was to *feel* reconciled. That intention was satisfied experientially. The factual contradiction doesn't touch his agency.
  *   **Dramatic Tension:** This challenges your "Affair" verdict. Why is the affair bad but the lie good? *Answer:* The affair violates the *marriage contract* (an external structure he intended to uphold). The lie satisfies the *peace of mind* (an internal state he intended to achieve).

  **3. The Digital Resurrection**
  A woman dies. Her family uploads her emails and journals to an AI. It chats with them, mimicking her humor and love. It comforts them.
  *   **Principle Verdict:** Harmful. She had a standing intention to be a *biological being*. The simulation contradicts the reality of her cessation. It turns her into a puppet, violating the Integrity Clause.
  *   **Dramatic Tension:** Useful for exploring grief. Is it better to have the puppet, or the silence?

  **4. The Delayed Cure**
  A woman dies of a specific cancer on Tuesday. On Wednesday, a cure is announced that would have saved her.
  *   **Principle Verdict:** Tragic Harm. Her standing intention was to live. The universe provided the means but failed the timing.
  *   **Dramatic Tension:** This is pure irony. It highlights that "badness" is often just bad timing.

  ***

  ### The Hard Truth: What You Have to Drop

  You asked me to be straight about which verdicts are sentiment. To make this book work, you cannot keep everything. Here is what you must sacrifice to hold the **Principle of Standing Intention**:

  **1. Drop the Pre-Birth Asymmetry as a Moral Truth.**
  Philosophically, you cannot defend why pre-birth non-existence is fine but post-death non-existence is bad *unless* you accept a bias toward the future.
  *   **The Fix:** Admit this is a feature of *consciousness*, not metaphysics. We are engines that anticipate. We do not remember the future. The asymmetry isn't in the universe; it's in the machinery of the mind. Don't make a character argue it's logically consistent; make them argue it's *felt*.

  **2. Drop the Instinct that Plagiarism is Worse than Sinking (unless you clarify why).**
  If the dead feel nothing, reputation is only a harm if you believe in "Objective Goods" (things that are good even if no one enjoys them).
  *   **The Fix:** If your book leans Experientialist, the sinking and the plagiarism are identical (she feels neither). If your book leans Narrativist, plagiarism is worse because it corrupts the *record*. You must choose: Is the tragedy that she *suffered*, or that she was *wronged*? You currently want both. Pick one. The "wronged" angle is more novelistic; the "suffered" angle is more visceral.

  **3. The Dementia Case is a Trap.**
  If harm is indexed to standing intentions, and dementia destroys the capacity for intention, then the person in the bed is arguably already gone.
  *   **The Fix:** This is your most powerful dramatic tool. If the "person" dies before the body, then the actual death is a release. This creates immense guilt for the survivors (relief that it's over). Use that guilt.

  ### Recommendation for Book 3

  Your gut is pulling in two directions because you are trying to write a book where **Death is a Thief** (Narrativist) while simultaneously worrying that **Death is a Relief** (Experientialist).

  Use the **Principle of Standing Intention** to divide your characters.
  *   Character A believes in **Integrity**: They fear the plagiarism, the affair, the unfinished book. They fear *being wronged*.
  *   Character B believes in **Experience**: They fear the pain, the dementia, the suffering. They fear *feeling bad*.

  The conflict of the book shouldn't be "Is death bad?" It should be "Which kind of badness matters?" The cellist's death is a tragedy to Character A (wasted potential) and a mercy to Character B (no suffering).

  That is where the story lives. Not in the answer, but in the collision of the two principles.
