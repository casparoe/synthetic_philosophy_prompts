answer: |-
  1. Reading the instrument
  Divide the fourteen participants into three groups of four or five. Hand each group a printed copy of the tree. Spend fifteen minutes establishing the cases; ensure everyone agrees on the technical facts of Cases 1, 2, 3, 4, 6, and 8 without debating their implications. Allocate forty-five minutes for groups to traverse the tree, recording their path and discussing why they answer yes or no at each node. Require consensus at each node; if consensus fails, split the group. Reconvene for thirty minutes to compare leaf assignments. Do not debate the philosophy; debate the classification. The goal is not agreement on the leaves, but clarity on why you diverged.

  2. The hinge questions
  The tree relies on three binary distinctions derived from the cases. First, the **Process Distinction** (Case 1 vs. Case 2): Does the mechanism generating the output matter for attributing capability, or is input-output equivalence sufficient? Second, the **Robustness Distinction** (Case 3 vs. Case 8): Is capability defined by performance on the training distribution, or does it require survival under distributional shift? Third, the **Origin Distinction** (Case 4 vs. Case 6): Does the capability reside in the artifact alone, or does it depend on the intentionality of the designers who built it?

  These questions appear independent, but the Process and Origin distinctions often correlate. Engineers who insist internal structure matters (Process) often insist human design matters (Origin), because they seek a chain of intentionality. However, they are logically separable: one could argue structure matters regardless of who built it (e.g., evolutionary biology). The Robustness distinction is mostly independent, though some argue robustness is a function of internal structure. The tree treats them as independent axes to force participants to reveal inconsistencies in their intuitions.

  3. The tree
  - Node 1 (Load-bearing): Compare Case 1 (Chess Search) and Case 2 (Lookup Table). Both produce grandmaster-level moves. Is Case 2's lack of a generative search process a defect in its capability relative to Case 1?
    - Yes (Internal process matters): Go to Node 2.
    - No (Output equivalence is sufficient): Go to Node 3.

  - Node 2 (Load-bearing): Compare Case 3 (Wolf/Snow) and Case 8 (RL Generalization). Both are trained models. Is Case 3's failure when snow is removed a lack of capability, or merely a bug in a capable system?
    - Yes (Fragility indicates lack of capability): Go to Node 4.
    - No (Fragility is just a defect): Go to Node 5.

  - Node 3 (Cosmetic): Compare Case 1 (Chess Search) and Case 4 (Evo Gait). Both perform competently. Does the lack of human foresight in Case 4's design mean the capability is not truly in the artifact?
    - Yes (Human intent required): Leaf A.
    - No (Capability is substrate-independent): Leaf B.
    *(Note: This node is cosmetic because if Output Equivalence sufficed at Node 1, Origin usually matters less, but we split here to capture Extended System views.)*

  - Node 4 (Load-bearing): Compare Case 4 (Evo Gait) and Case 6 (Compiler). Both produce optimized results. Does the lack of human foresight in Case 4 mean the capability is borrowed from the fitness function designers rather than the artifact?
    - Yes (Capability is borrowed): Leaf C.
    - No (Capability is emergent): Leaf D.

  - Node 5 (Cosmetic): Compare Case 6 (Compiler) and Case 8 (RL Generalization). Both generalize beyond explicit rules. Is the comprehension located in the tool or the user interpreting the tool?
    - Yes (Located in user/system combo): Leaf E.
    - No (Located in tool): Leaf F.
    *(Note: This node is cosmetic because it often collapses into verbal disputes about location.)*

  - Node 6 (Load-bearing): [Reached via Node 3 No] Compare Case 2 (Lookup) and Case 8 (RL Generalization). If output equivalence suffices, does the inability to generalize (Case 2) matter?
    - Yes (Generalization required): Leaf G.
    - No (Behavior is all that counts): Leaf H.

  - Leaf A: Borrowed Comprehension.
  - Leaf B: Comprehension is Competence.
  - Leaf C: Symbol Manipulation (No Meaning).
  - Leaf D: Epistemic Closure.
  - Leaf E: Extended System.
  - Leaf F: Literal Understanding.
  - Leaf G: Degrees of Robustness.
  - Leaf H: Verbal Dispute.

  4. The leaves
  - **Borrowed Comprehension:** The artifact's capability is loaned from the designers; the tool itself is inert. *Awkward commitment:* You must say the compiler optimizer (Case 6) knows nothing, even when it teaches the team a new optimization.
  - **Comprehension is Competence:** Understanding is just a high grade of competence; there is no separate faculty. *Awkward commitment:* You must admit the evolutionary gait (Case 4) understands physics as well as the engineers who built the chassis.
  - **Symbol Manipulation:** Syntax processing cannot yield semantics regardless of behavioral success. *Awkward commitment:* You must deny the chess engine (Case 1) knows chess any more than a lookup table does.
  - **Epistemic Closure:** Some facts about these systems are closed to us in principle. *Awkward commitment:* You must claim we cannot know if the RL agent (Case 8) truly generalized, even with full weight access.
  - **Extended System:** Comprehension belongs to the artifact plus the humans who run it. *Awkward commitment:* You must say the coding agent (Case 5) understands code only when a human reads the patch.
  - **Literal Understanding:** A suitably organized running program literally understands, with nothing left over. *Awkward commitment:* You must admit the lookup table (Case 2) understands the support domain if it passes the Turing test.
  - **Degrees of Robustness:** Comprehension comes in degrees fixed by survival across counterfactual interventions. *Awkward commitment:* You must say the wolf classifier (Case 3) understood less yesterday than it does today after retraining.
  - **Verbal Dispute:** The word picks out no natural kind; the disagreement is purely linguistic. *Awkward commitment:* You must tell the team their debate about the agent's curiosity is merely about dictionary definitions.

  5. Unoccupied cells
  The tree generates eight logical paths, but not all are philosophically populated. The combination of "Output Equivalence Suffices" (Node 1 No) and "Human Intent Required" (Node 3 Yes) leads to Leaf A, but this is tense: if output is all that matters, why does origin matter? This cell is occupied only by those who view tools as extensions of human will rather than independent agents. It is not incoherent, but unattractive to functionalists.

  The combination of "Internal Process Matters" (Node 1 Yes) and "Behavior is All That Counts" (Node 6 No) is empty. This is incoherent: one cannot insist internal structure matters for Case 1 vs 2, then dismiss internal structure for Case 2 vs 8. Anyone landing here has answered inconsistently.

  Finally, the path leading to "Epistemic Closure" (Leaf D) is sparsely populated. Most engineers believe empirical evidence settles the question. This cell is empty not because it is illogical, but because it is pessimistic; it requires believing that weight inspection (Case 9) cannot reveal mechanism. Nobody has looked there seriously because it halts engineering progress.

  6. What the tree cannot separate
  The tree struggles to separate **Verbal Dispute** (Leaf H) from **Comprehension is Competence** (Leaf B). Both leaves arise from a focus on behavior over internal essence. A consistent answerer could land on either depending on whether they care to preserve the word "understanding" for humans only. To pull them apart, we would need a question about whether eliminating the word "understand" from our documentation would change how we build systems. The tree lacks this pragmatic node.

  Additionally, **Extended System** (Leaf E) and **Borrowed Comprehension** (Leaf A) are difficult to distinguish. Both locate meaning partially outside the artifact. The tree assumes Extended System implies the human is part of the cognitive loop, while Borrowed implies the human is the source of the loan. A further question would have to establish whether the system adds novel value beyond what the human could do alone. Without that, a user could consistently choose either leaf based on metaphor preference rather than fact.

  7. Where I think this is most likely wrong
  I suspect Node 3 (Origin) is the least stable hinge. It asks whether lack of human foresight removes capability from the artifact. In modern ML, almost all high-performing systems (like Case 4 and Case 8) lack detailed human foresight regarding their specific solutions. If most engineers answer "No" (Capability is substrate-independent), the tree collapses toward Functionalism, making the Symbol Manipulation and Borrowed Comprehension leaves hard to reach without inconsistent answers.

  An empirical result showing interpretability tools successfully mapping internal concepts (like Case 9) to human semantics would restructure the tree. It would make the Internal Process distinction (Node 1) less about "search vs. lookup" and more about "interpretable vs. opaque." If we can read the concepts, the Lookup Table objection loses force because the table isn't truly opaque anymore; it's just dense.

  The advocate for **Literal Understanding** (Leaf F) has the strongest objection to my layout. They will argue that Node 1 is a trap: by asking if the lookup table has a "defect," I presuppose that search is superior. If the lookup table is physically realized, it is a causal system just like the search engine. My tree biases toward process because engineers value generality, but a strict physicalist would say both are just physics. I have privileged the engineer's intuition over the philosopher's consistency here, and that bias might invalidate the separation between Leaf F and Leaf H.
