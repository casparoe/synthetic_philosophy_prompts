answer: |-
  You have identified a precise and robust ethical phenomenon. It is not merely "doing the right thing despite the rules," nor is it "breaking the rules and feeling bad." It is the specific structural requirement that **the exception must be costly to the exception-maker to preserve the authority of the rule.**

  There is no single standard term in Anglophone ethics that captures this exactly, though several concepts approach it. Below I set out the nearest existing concepts, explain why they fall short, analyze the coherence of the view, and finally offer a coined term that fits your description.

  ### 1. The Problem of "Dirty Hands"
  **The Concept:** Originating in political philosophy (Machiavelli, Weber, Walzer), this describes a leader who must do something morally wrongful (lie, kill, betray) to secure a greater political good. The agent is "stained" by the act. Even if they did the right thing overall, they bear a moral guilt that requires acknowledgment.

  **The Difference:** "Dirty Hands" presupposes that the act itself remains *morally wrongful* even if necessary. In your infrastructure example, nobody believes the engineer did something *evil* or *morally wrong* in a deep sense; they believe he violated a *procedural* norm for a higher operational good. Dirty Hands is about moral tragedy (conflicting values); your pattern is about systemic integrity (conflicting levels of rules). In Dirty Hands, the guilt is about the *act* (killing). In your pattern, the debt is about the *precedent* (breaking the freeze).

  **Verdict:** Closest mainstream match, but too morally loaded. It implies the act was a sin, whereas your engineer performed a maintenance task that was instrumentally correct but structurally dangerous.

  ### 2. Moral Residue (or Moral Remainder)
  **The Concept:** Associated with philosopher Bernard Williams. This is the feeling that after making a difficult ethical choice, something is still "owed" to the option not taken. If I must save my child instead of five strangers, I have done the right thing, but I still owe the strangers an apology or regret.

  **The Difference:** Moral residue arises from **conflicting obligations** (I owed A, I owed B, I could only do A). Your pattern explicitly states there is **no genuine dilemma**: one option was clearly best on the merits. The engineer did not owe the "change freeze" the same weight as the "emergency dispatch." The debt incurred is not to the unchosen option, but to the **system of rules itself**.

  **Verdict:** Misses the target. Moral residue is about emotional or moral regret for the path not taken. Your pattern is about a deliberate payment to maintain the rule's future force.

  ### 3. Civil Disobedience (Fidelity to Law)
  **The Concept:** In the tradition of Thoreau, Gandhi, and Rawls. An agent breaks a law to protest its injustice but accepts the legal penalty to demonstrate respect for the rule of law generally.

  **The Difference:** Civil disobedience is **adversarial**. The agent breaks the rule to *change* it or highlight a flaw. Your engineer breaks the rule to *save* the system the rule protects, while affirming the rule is good. Furthermore, civil disobedience accepts punishment as a **witness**; your engineer accepts the review as a **maintenance cost**.

  **Verdict:** Structurally similar (break rule + accept penalty), but the intent is opposite. Civil disobedience challenges authority; your pattern reinforces it.

  ### 4. Buddhist Ethics: *Upāya* vs. Karma
  **The Concept:** In the Mahāyāna story you cite (the *Upāya-kauśalya Sūtra*), the captain kills the murderer.
  *   **View A (The one that bothers you):** Because his motivation was pure compassion (*karuṇā*) and skillful means (*upāya*), no negative karma is generated. He actually gains merit.
  *   **View B (The one you prefer):** The Bodhisattva willingly accepts the karmic retribution (rebirth in hell) to save the others, taking the suffering onto himself.

  **Is the erasure essential?** The "merit" interpretation is a later soteriological smoothing-over. It serves to encourage Bodhisattvas not to fear action. However, the **ethical core** of the story relies on the Bodhisattva's willingness to suffer the consequences. If the captain calculates, "I can kill without karmic cost," he is no longer acting from self-sacrifice. The "merit" view risks turning ethics into a transaction where good intent buys immunity. The "taking the karma" view aligns with your pattern: the act is necessary, but the causal law (karma/rule) must not be suspended.

  **Verdict:** Your intuition is philosophically stronger here. The "merit" version undermines the sacrificial logic. The "taking the karma" version is the one that matches your infrastructure example.

  ---

  ### Is this coherent for a Consequentialist?

  **Strict Act Consequentialism:** **No.**
  If consequences settle what is right, then the engineer did the *right* thing. Punishing him afterwards creates negative utility (suffering for the engineer, time spent on review) with no compensatory good (the deploy is already rolled back). A pure consequentialist would say: "Ratify it, praise it, move on. Punishing him discourages future necessary violations."

  **Rule Consequentialism / Institutional Ethics:** **Yes.**
  This view holds that we should follow rules that *generally* maximize good. Sometimes, breaking a rule maximizes good in a specific instance. However, if breaking the rule is cost-free, the rule collapses into a suggestion. The "penalty" is not retributive (paying for the past); it is **signaling** (protecting the future).
  *   **The Coherence Check:** For this to work, you must value the **integrity of the rule** as a separate good from the **outcome of the specific act**. This smuggles in a non-consequentialist element: the idea that rules have a structural authority that must be maintained even when they are instrumentally overridden.

  ---

  ### Boundary Cases

  To ensure we have the right shape, let's test the edges:

  1.  **State-imposed fine for a justified violation (e.g., ambulance speeding):**
      *   *Fits:* If the ambulance driver pays the ticket (or the department does) without contesting the *validity* of the speed limit, acknowledging that the limit exists even if breached.
      *   *Does not fit:* If the law has a "emergency exemption" clause. Then no rule was broken. Your pattern requires a rule *actually be broken*, not just exempted.

  2.  **Apology:**
      *   *Fits:* If the apology is "I am sorry I broke the freeze," not "I am sorry the service degraded." It must acknowledge the breach of norm, not just the harm.
      *   *Does not fit:* An apology that implies the action shouldn't have been taken.

  3.  **Someone else volunteers to pay:**
      *   *Does not fit.* If the manager takes the blame, the link between the violator and the rule is severed. The rule's authority over the *agent* is what matters. The engineer must be the one reviewed.

  4.  **Paying only because caught:**
      *   *Does not fit.* If the engineer tries to hide it and only accepts the review because he was caught, it is damage control, not ethical maintenance. The acceptance must be voluntary to count as part of "doing it correctly."

  ---

  ### The Term: **The Integrity Surcharge**

  Since no existing term captures the specific combination of *justified violation* + *mandatory cost* + *rule preservation*, I propose this term.

  **Definition:**
  An **Integrity Surcharge** is a voluntary acceptance of penalty or cost by an agent who has justifiably violated a normative rule, undertaken specifically to preserve the rule's authoritative force for future cases where violation would *not* be justified.

  **Key Components:**
  1.  **Justification:** The violation was objectively the correct choice on the merits (no moral dilemma).
  2.  **Endorsement:** The agent agrees the rule is good and necessary generally.
  3.  **Non-Absolution:** The justification does not cancel the debt. The agent must "pay" for the exception.
  4.  **Purpose:** The payment is not punishment (retribution) nor protest (disobedience), but **maintenance**. It prevents the exception from becoming a precedent that weakens the rule.

  **Why this fits your cases:**
  *   **The Engineer:** He broke the freeze (Justification). He agrees freezes are good (Endorsement). He insists on the formal review (Non-Absolution). The manager insists on it so the freeze doesn't become a suggestion (Purpose).
  *   **The Captain:** He kills to save (Justification). He agrees killing is karmically negative (Endorsement). He accepts the hell-rebirth (Non-Absolution). This preserves the law of Karma even while bending it for compassion (Purpose).

  **Distinction from Near-Misses:**
  *   Unlike **Dirty Hands**, the Integrity Surcharge does not imply the act was evil, only that it was an *exception*.
  *   Unlike **Civil Disobedience**, the agent is not trying to change the rule, but to strengthen it.
  *   Unlike **Moral Residue**, the cost is not emotional regret, but a structural transaction (review, karma, fine).

  **Conclusion:**
  You have identified a mechanism essential to high-reliability organizations and sophisticated ethical systems. It is the recognition that **rules derive their power not just from their utility, but from the cost of breaking them.** If the cost is zero, the rule is optional. The Integrity Surcharge is the price paid to keep the rule mandatory, even when it must be broken.
