      *   Proposed Term: **Costly Exception** or **Integrity Tax**. Let's go with **The Integrity Tax** or **Rule Maintenance Cost**. Actually, **"Sanctioned Transgression"**? No.
      *   Let's look at the function: It preserves the *normative force* of the rule.
      *   Term: **Normative Friction**. Or **The Cost of Exception**.
      *   Better: **"The Penalty of Justification"**?
      *   Let's try to find if legal theory has this. "Necessity Defense" often still requires accountability.
      *   Let's settle on describing the cluster and then offering a precise label if needed. The user asked to coin a term *if* nothing fits. I think "Dirty Hands" is the closest standard term, but it needs heavy qualification. However, the specific dynamic of *preserving the rule's force* is distinct.
      *   I will propose **"The Integrity Surcharge"**.

  7.  **Drafting the Response (Iterative refinement):**

