      *   *The Coining:* Since "Dirty Hands" is too morally loaded and "Civil Disobedience" is too political, I will coin **"The Integrity Surcharge"**.
      *   *Definition:* A voluntary acceptance of penalty following a justified rule-violation, undertaken specifically to preserve the normative authority of the rule for future cases where violation would *not* be justified.

  8.  **Review against Constraints:**
