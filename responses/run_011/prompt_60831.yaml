      *   **Cost:** Must be borne by the agent (or the system must acknowledge the breach).
      *   **Key Nuance:** It's not "Dirty Hands" (usually implies a tragic choice or moral remainder after doing evil for good). It's not standard Consequentialism (which would say the act is simply *right*). It's not Deontology (which would say the act is *wrong* regardless).
      *   **The "Thing":** The *cost of the exception* must be paid to preserve the *authority of the rule*.

  3.  **Brainstorming Philosophical Concepts:**
      *   *Dirty Hands:* (Walzer, Machiavelli). Usually involves doing something morally wrong (evil) for political necessity. The agent is stained. *Difference:* User says "no genuine dilemma," "one option clearly best." Dirty hands usually implies a conflict of values where something *is* sacrificed morally. Here, the violation is instrumentally necessary but structurally costly.
      *   *Moral Remainder/Residue:* (Bernard Williams). After a decision, some moral obligation remains unfulfilled. *Difference:* Usually applies to conflicting obligations. Here, the obligation was fulfilled (saved the dispatchers), but the *procedural* debt remains.
      *   *Rule Consequentialism:* Follow rules that generally maximize good. Break them only if...? *Difference:* Standard rule consequentialism usually has a "collapse" clause where you break the rule if it maximizes good, and you're just "right." It doesn't necessarily demand punishment/penance afterwards.
      *   *Civil Disobedience:* (Rawls, Thoreau). Breaking a law to protest it, accepting punishment. *Difference:* User's case isn't protest. The rule is good. The break is emergency maintenance, not political statement. But the *acceptance of penalty* is similar.
      *   *Supererogation:* Doing more than duty requires. *Difference:* This is about violating a duty to fulfill a higher one, not going above and beyond.
      *   *Karmic Retribution (Buddhism):* The captain story. *Difference:* User specifically questions the "merit" interpretation vs. the "taking the hit" interpretation.
      *   *Institutional Integrity / Rule Sanctity:* The idea that rules lose force if exceptions are cost-free.

  4.  **Selecting the Best Candidates:**

      *   **Candidate 1: The Problem of Dirty Hands.**
          *   *Why:* Closest mainstream ethical concept. Agent does "wrong" (breaks rule) for "right" reasons.
          *   *Mismatch:* Dirty Hands usually implies the act *remains* morally wrongful even if necessary. The user says "one option was clearly best on the merits." The user's engineer doesn't feel "stained" by evil, just accountable to the system.
      *   **Candidate 2: Moral Residue / Remainder.**
          *   *Why:* Explains the feeling that something is still "owed."
