answer: |-
  You hand me this ledger of yours, and I see the account books closed against us. It is a sobering thing to look into the face of such diligence and see it return empty-handed; I confess, my hand trembles slightly at the thought that our labour here in Cambridge may be remembered as a meticulous chasing of shadows. But you press me on my own maxim: that negative evidence is still evidence. I must distinguish, however, between the absence of a thing where it ought to be found, and the absence of a thing that hides from the light. If these phenomena are indeed fragile, dependent on conditions we cannot yet command—like a shy bird that flees the observer—then the failure of the mechanical device to trap them does not prove the bird extinct. The diminution you describe, where the excess fades as the trials multiply, may indicate not the absence of a cause, but the exhaustion of a faculty under the strain of scrutiny. As for the Theosophists, I stand by the necessity of the scrutiny; if the report was harsh, it was because the claims were grand and the deception plausible. To call it a prosecutor's address is to forget that in matters of testimony, the cross-examination is the only path to truth. I cannot concede that the method is flawed because the quarry is elusive; the rationality lies in the rigor of the hunt, not in the certainty of the kill.

  You strike harder at the ethics, and here I feel the weight you describe. If the universe is morally neutral, then my reconciliation of Duty and Interest is indeed a dream. But you ask me to withdraw the ethics because the empirical door is shut. I find I cannot, for the moral intuition stands even if the cosmic sanction fades. The third option is not a refusal to add the ledger, but a refusal to let the ledger sum up the whole of reason. If the experiments yield nothing, they have at least swept away the charlatans who cheapen the hope of survival. I would rather live with the dualism—a painful contradiction acknowledged—than build my morality on a fraud I refused to examine. The research programme remains worthwhile because it protects the integrity of the hope, even if it cannot confirm the object. We investigate not to secure our happiness, but to ensure we are not deceiving ourselves about the grounds of it. It is a melancholy business, but I prefer a clean despair to a comfortable delusion.
