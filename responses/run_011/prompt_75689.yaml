      *Let's write.*
answer: |-
  (a) **The Principle: Conditioned Competence**

  A rule-making body is bound by a prior rule if and only if three conditions are met. If any condition fails, the body retains its full competence to act, and the prior rule is treated as a nullity.

  1.  **The Hierarchy Condition:** The prior rule must originate from a normative order superior to the body attempting to break it. A body cannot bind its successor substantively if both stand on the same normative level (e.g., Parliament vs. Parliament), but a Constitutive Instrument (Constitution/Covenant) can bind the bodies it creates.
      *   *Motivating Cases:* **Case 4** (Parliament cannot bind Parliament on substance) vs. **Case 2** (Constitution binds Parliament/Amenders). **Case 5** confirms that even on the same level, procedural conditions can bind (see Condition 2).
  2.  **The Manner-and-Form Condition:** The prior rule must impose a *procedural condition* on the exercise of power (including a specific veto right for a constituent unit), rather than a *substantive immunity* for a topic. A requirement that "X cannot happen without Y's consent" is valid; a declaration that "X can never happen" is invalid.
      *   *Motivating Cases:* **Case 5** (Referendum procedure binds) vs. **Case 4** (Substantive policy does not). **Case 2** (State consent veto binds) vs. **Case 3** (Topic immunity does not bind). **Case 6** (Full court procedure binds) vs. **Case 6** (Policy declaration does not).
  3.  **The Continuity Condition:** The exercise of power must not destroy the source of the body's own legitimacy or the continuity of the entity itself.
      *   *Motivating Cases:* **Case 8** (Extending term destroys the electoral source). **Case 7** (Ending the emergency condition destroys the limit on power).

  *Note on Fitting:* Clause 2 is where the principle is fitted to the data rather than purely derived. The distinction between a "veto" (Case 2) and an "immunity" (Case 3) is legally subtle. I have drawn it to reconcile your confidence in Case 2 with your discomfort in Case 3. Clause 3 is needed specifically for **Case 7** and **Case 8**; without it, the principle cannot explain why some procedural exercises are void *ab initio*.

  (b) **Validity vs. Official Treatment**

  This principle is a criterion of **Systemic Validity**, not merely a prediction of official behavior.

  *   **Why:** In **Case 4**, you state the later statute "prevails." In a purely political fact account ("who is obeyed"), this is trivially true because the Parliament has the guns. But in **Case 2**, you say the amendment is "invalid." If this were only about obedience, it would depend on whether the Courts or the Army enforce the proviso. Your verdict implies that the amendment *lacks legal force* regardless of enforcement.
  *   **Work Done:** This distinction explains **Case 6**. When a three-judge panel overrules precedent against the standing rule, the decision is *void* (invalid), not just "disobeyed." If the principle were only about treatment, the panel's decision would stand until reversed. By treating it as a validity question, we explain why the overruling has no legal effect from the moment it is issued. The distinction is doing real work: it separates *usurpation* (invalid) from *sovereign override* (valid but perhaps unjust).

  (c) **Application to Three New Cases**

  1.  **Amending the Procedure to Entrench a New Unamendable Provision:**
      *   *Scenario:* A Constitution allows amendment by 2/3 vote. The body amends the procedure to require 4/5 vote, and adds: "This 4/5 requirement shall never be amended." Later, a 4/5 vote attempts to revert to 2/3.
      *   *Application:* Under Clause 2 (Manner-and-Form), the requirement for a 4/5 vote is valid (procedural). The clause stating it "shall never be amended" is invalid (substantive immunity).
      *   *Verdict:* The reversion is **valid** if it achieves 4/5. The "never" clause is a nullity. This aligns with **Case 1** (procedure can change) and rejects **Case 3** (eternity clauses fail).

  2.  **Entrenching a Sunset on the Power to Entrench:**
      *   *Scenario:* A Parliament passes a statute requiring a referendum for tax laws, but adds: "This referendum requirement shall expire in 10 years and cannot be extended."
      *   *Application:* Under Clause 1 (Hierarchy), a Parliament cannot bind its successor substantively. A "sunset" is a substantive limit on the *future* Parliament's competence to legislate without referendum.
      *   *Verdict:* The sunset is **invalid**. A later Parliament can reinstate the referendum requirement or ignore it immediately. This follows **Case 4**. (Note: If this were a Constitutional provision, the sunset would be valid under Clause 2, as Constitutions can limit themselves temporally).

  3.  **The Self-Removing Minority:**
      *   *Scenario:* A Federal Constitution protects a specific religious minority by requiring their consent for laws affecting worship. The minority representatives, voting as part of the amending body, vote to remove this protection.
      *   *Application:* Under Clause 2, the protection is a "specific veto right for a constituent unit." However, the veto belongs to the *unit*, not the *topic*. If the unit's authorized representatives consent, the condition is met.
      *   *Verdict:* The removal is **valid**. The entrenchment protects the *State/Group's will*, not the *policy* itself. If the Group wills the change, the entrenchment is satisfied. This distinguishes **Case 2** (State did *not* consent) from this case (Minority *did* consent).

  (d) **The Outlier and the Sacrifice**

  There is one verdict no reasonably simple principle can accommodate without tension: **Case 3**.

  *   **The Conflict:** Case 3 (Eternity Clause is binding) contradicts Case 9 (HOA Perpetuity is not binding) and Case 1 (Amendment rules can be changed). In Case 1, the society moved from 2/3 to Unanimity and back. If they could move back, they effectively overrode the "Unanimity" rule's stability. In Case 3, you hold that the "Never" clause stops the amendment power cold.
  *   **The Sacrifice:** You should abandon **Case 3**. You should conclude that the first step (deleting the entrenching sentence) is **valid**, provided the prescribed amendment procedure (e.g., supermajority) is followed.
  *   **Why:** Case 3 represents the "Dead Hand" problem. If the Constituent Power (the People/Amenders) speaks clearly enough to amend the Constitution, they are the highest authority. A prior iteration of that Power cannot silence a current iteration on a specific topic.
  *   **What You Lose:** By giving up Case 3, you lose the ability to theoretically protect *fundamental substantive values* (like human dignity or republican form) from *any* amendment, even a unanimous one. You concede that there is no "substantive core" of a constitution that is legally immune from repeal. This makes your theory more democratic but less protective of higher-law rights.
  *   **Ripple Effect:** If Case 3 falls, **Case 2** becomes harder to defend *unless* you strictly maintain the distinction between a "Veto" (Case 2) and an "Immunity" (Case 3). You must argue that Case 2 is valid not because "Equal Suffrage" is sacred, but because "State Consent" is a procedural condition that was not met. If a State *consented* to its own suffrage being abolished, your principle would allow it.

  (e) **The "No Principle" View**

  If my considered view were that there is no principle, I would argue that your verdicts track **Political Stability** rather than Legal Logic.

  *   **The Argument:** A rule binds only when the cost of breaking it exceeds the benefit to the current power-holders.
      *   In **Case 4** (Parliament), breaking the rule is easy (simple majority), so it breaks.
      *   In **Case 2** (Senate Suffrage), breaking the rule requires destroying the Federation (States leave), so it holds.
      *   In **Case 9** (HOA), breaking the rule requires suing neighbors, but keeping it lowers property value, so it breaks.
      *   In **Case 8** (Term Extension), breaking the rule triggers revolution, so it is invalid.
  *   **Why This is More Than Redescription:** A principled account (like the one in section (a)) predicts that a *procedural* entrenchment in a statute (Case 5) *should* hold even if the Parliament has the power to ignore it. A political fact account predicts Case 5 is unstable: if the Parliament really wants the bill, they will ignore the referendum, and the courts will blink.
  *   **Prediction Difference:**
      *   *Principle:* Predicts courts will strike down the Case 5 bill even if the Parliament is popular.
      *   *Political Fact:* Predicts courts will uphold the Case 5 bill if the Parliament is sufficiently determined, rendering the "invalidity" merely rhetorical.
      *   *Your Data:* You say Case 5 is "defective." This implies you believe in the Principle, not just the Political Fact. If you believed only in Political Fact, you would say Case 5 is "risky" or "unwise," not "defective."

  **Recommendation:** Stick with the **Principle of Conditioned Competence**, but formally recant **Case 3**. Treat "Eternity Clauses" as political warnings rather than legal bars. This aligns your view with Case 1 (flexible procedure), Case 9 (living association), and Case 4 (sovereign competence), leaving Case 2 as the unique protector of *federal structure* (veto rights) rather than *substantive policy*.
