answer: |-
  This is a sharp diagnosis of the epistemic status of Regulatory Impact Assessment (RIA). You have correctly identified that the practitioners are operating with a hybrid ontology that would collapse under the scrutiny of either a strict Misesian or a strict Pigouvian.

  Here is the reconstruction of the theory of prices and knowledge presupposed by Cost-Benefit Analysis (CBA), followed by the dissection of its necessities, underdeterminations, incoherences, and the Austrian counterfactual.

  ### 1. The Implicit Theory of Price and Knowledge

  The practice of CBA does not presuppose the Hayekian view (price as a telecommunications system for dispersed knowledge) nor the Lange view (price as a parameter for equilibrium simulation). It presupposes a **Neoclassical Welfarist Reductionism**.

  In this framework, a "price" is not a signal for coordination, nor a clearing mechanism. It is a **translation key for commensurability**. The theory assumes:
  1.  **Ontological Monism:** All goods (life, time, carbon, wetlands) are reducible to a single substrate: individual utility.
  2.  **Epistemic Accessibility:** While utility is subjective, its marginal rate of substitution is objectively revealed through behavior in adjacent markets (Revealed Preference Theory).
  3.  **Aggregability:** Individual utilities can be summed interpersonally without loss of meaning (implicitly rejecting the ordinalist restriction, despite protestations to the contrary).

  **Where it sits in the Calculation Debate:**
  It is a **Langean project built on Hayekian data.**
  *   **Langean:** It assumes a central board (the agency) can calculate the optimal allocation of resources for a specific intervention by assigning parameters (shadow prices) and solving for the maximum (NPV). It treats the economy as a system of equations where the agency can input coefficients.
  *   **Hayekian Input:** Unlike Lange's pure simulation, it admits it cannot generate these coefficients ex nihilo. It scavenges them from the "discovery process" of real markets (wage premiums, housing gradients).

  However, it violates Mises' core objection. Mises argued you cannot calculate without *private ownership of the means of production* because that is what generates the genuine profit/loss signal. CBA attempts to calculate profit/loss on *public goods* where no ownership exists. It assumes the "shadow" of the market is sufficient to replicate the *information content* of the market without the *property rights structure* that generates it. It treats prices as **statistics** rather than **institutions**.

  ### 2. Necessary Conditions vs. Contingent Accompaniments

  You asked what the practice strictly cannot do without versus what it merely sits comfortably alongside.

  **Strictly Necessary:**
  *   **Commensurability:** The practice *requires* that heterogeneous goods be reducible to a common denominator. Without this, NPV is meaningless.
  *   **Marginalism:** It requires that the value of a unit (e.g., a statistical life) is constant enough at the margin to be applied linearly. If the value of the 100th life saved is radically different from the 1st in a way that cannot be modeled, the linear aggregation fails.
  *   **Institutional Defensibility:** The numbers must be defensible in court or legislative review. This is a functional necessity. A "true" number that gets the regulation struck down is a failed number.

  **Contingent (Comfortable but not Necessary):**
  *   **Cardinal Interpersonal Comparability:** Strictly speaking, CBA relies on **Kaldor-Hicks efficiency** (potential compensation), not Pareto improvements. It does *not* need to prove that the winner *actually* compensates the loser, nor that utility is cardinally comparable across persons. It only needs the *metric* to be consistent. However, to claim the result is "Social Welfare Maximizing" (rather than just "efficient"), it silently imports cardinal comparability. It can function without it, but it loses its normative bite.
  *   **Ontological Realism about "Value of a Life":** The practice does not need there to be a "fact of the matter" about what a life is worth. It only needs a **consistent trade-off rate**. If the agency decided tomorrow to value a life at $50 million instead of $10 million, the *theory* doesn't break, only the rankings change. The number is a policy parameter, not an empirical discovery.
  *   **Precision:** It does not need the number to be accurate to the digit. It needs the number to be **stable enough** to prevent arbitrary fluctuation in decision-making.

  ### 3. Philosophical Underdetermination

  There are several points where rival philosophical theories license the exact same spreadsheet entries.

  *   **Utilitarianism vs. Preference Satisfaction:** A Benthamite hedonic calculus and a modern Revealed Preference model often yield identical shadow prices. If people pay $500 for a safer car, is that because they desire safety (preference) or because safety reduces pain (utility)? The CBA number is identical; the moral ontology is distinct.
  *   **The Discount Rate (Positive vs. Normative):** As you noted, the discount rate is the pivot. It can be justified descriptively (this is the market return on capital, therefore opportunity cost) or normatively (this is our ethical obligation to the future). A 3% rate is compatible with both a "market efficiency" theory and a "Ramsey optimal growth" theory. The spreadsheet cannot distinguish between "we *must* discount because money grows" and "we *ought* to discount because the future matters less."
  *   **Transfer Pricing (The Tax Law Parallel):** You asked if this is a separate problem. It is the same problem. Tax authorities ask what unrelated parties *would have* agreed to. This is a **counterfactual simulation of a market**. It presupposes that there is a "true" price latent in the transaction that was obscured by the relationship. This is Langean: the authority acts as the market simulator to find the "correct" price that the "real" market would have produced. It confirms the underlying view that prices are *discoverable facts* rather than *created institutions*.

  ### 4. Internal Tensions: Incoherence vs. Untidiness

  **The Discount Rate Authority (Genuine Incoherence):**
  This is the strongest philosophical fracture. The discount rate determines intergenerational equity. By treating a normative ethical choice (how much do we value our grandchildren?) as a technical parameter derived from market returns (which reflect current scarcity and myopia), the agency commits a **category error**. It masks a political distributional decision as an epistemic finding. This is not just untidy; it is a deception about the nature of the authority's power.

  **Precision vs. Uncertainty (Untidy but Livable):**
  Practitioners know VSL estimates swing by a factor of three. Yet they defend a point estimate in court. This is **bureaucratic performativity**. The decision rule (NPV > 0) requires a scalar. A distribution requires a different decision rule (e.g., "is the lower bound positive?"). The tension is between *epistemic honesty* and *administrative feasibility*. It is livable because the legal system accepts "substantial evidence" rather than "truth."

  **Monetization Limits (Genuine Incoherence):**
  When an agency monetizes a life but relegates distributional harms to a "qualitative annex," it breaks its own objective function. If the goal is Net Social Benefit, distributional weights should be applied. If the goal is Efficiency, distribution shouldn't matter at all. By doing both (counting efficiency gains, noting equity losses without counting them), the agency is maximizing **Efficiency subject to Political Constraints**, but labeling it **Social Welfare**. This renders the NPV figure philosophically hollow; it is not the value of the project, it is the value of the project *for the median voter*, disguised as the value for *society*.

  ### 5. The Austrian Counterfactual

  If an agency internalized the Hayek/Mises picture, its work product would change radically.

  **The Work Product:**
  *   **No Point Estimates:** All values would be expressed as ranges or ordinal rankings.
  *   **No Aggregation:** There would be no NPV. Instead, there would be a **Trade-Off Matrix**. (e.g., "Option A saves 10 lives and costs $100M; Option B saves 8 lives and costs $50M").
  *   **Process Focus:** The assessment would evaluate whether the regulation *enables* market discovery or *stifles* it, rather than calculating the outcome. (e.g., "Does this carbon price allow firms to find cheaper abatement methods, or does it mandate a specific technology?")
  *   **Property Rights Analysis:** The RIA would focus on whether the regulation clarifies or muddies liability and ownership, as this is the prerequisite for price formation.

  **Improvement or Surrender?**
  *   **Epistemic Improvement:** It would be vastly more honest. It would admit that the agency does not know the value of a life, only that people trade risk for money. It would expose the discount rate as a political choice.
  *   **Functional Surrender:** It would likely destroy the agency's ability to function within the current legal-administrative state. The "usefulness" of the current numbers is not that they are true, but that they **collapse complexity into a binary decision rule** (Go/No-Go).
  *   **The Verdict:** The Austrian approach solves the *calculation* problem by refusing to calculate. The current approach solves the *accountability* problem by pretending to calculate.

  If the agency adopted the Austrian view, it would cease to be a technocratic optimizer and become a **political deliberator**. It would force the legislature to explicitly weigh the trade-offs (lives vs. dollars) rather than hiding behind the "objective" NPV. Whether that is an improvement depends on whether you believe the concealment of value judgments is a bug or a feature of the administrative state. Given your background in political philosophy, I suspect you view it as a bug; given the agency's mandate, they view it as the feature that allows them to act.

  **Summary:** The practice is a **Langean simulation using Hayekian inputs**, justified by **Neoclassical Welfarism**, held together by **Bureaucratic Necessity**. It is philosophically incoherent regarding the discount rate and distribution, but institutionally robust. An Austrian shift would increase truthfulness but decrease decisiveness, effectively transferring the burden of valuation from the economist back to the politician.
