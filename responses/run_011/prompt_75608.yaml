  *Refining the Impossibility Argument:*
  The strongest impossibility result for *usable* IP is the conflict between **Dynamic Consistency** and **E-Admissibility** (Seidenfeld 1991). If you choose acts based on E-admissibility (optimal for some prior in the set), you will face situations where your future self would reject the plan your current self made, even with no new information. For a public body, this looks like incompetence or hypocrisy.
