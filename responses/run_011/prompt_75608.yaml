      *   *Requirement 3: Inertia Avoidance.* The "stickiness" problem. If prior is $[0,1]$, standard IP updating often keeps it $[0,1]$.
          *   *Motivating Case:* Climate risk assessment. If we start with total ignorance, we must eventually converge on high confidence given overwhelming data, not stay at $[0,1]$.
