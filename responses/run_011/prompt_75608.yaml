answer: |-
  ### 1. The Desiderata List

  | # | Requirement | Motivating Case |
  | :--- | :--- | :--- |
  | **1** | **Responsiveness to Evidence** | **The Urn of Total Ignorance:** A taskforce assesses a novel virus with zero prior data (prior credence $[0,1]$ for fatality). After one study of 100 cases shows 10 deaths, a usable model must narrow the interval (e.g., to $[0.05, 0.20]$). If the interval remains $[0,1]$ (Inertia), the body cannot issue guidance, rendering the tool useless for high-stakes decision-making. |
  | **2** | **Dilation Control** | **The Intelligence Brief:** An agency assesses the probability of an attack ($[0.2, 0.4]$). They receive a new, reliable but vague report. In some IP models, the posterior interval widens (e.g., to $[0.1, 0.6]$) simply because the evidence is statistically independent but imprecise. A usable account must explain why learning *increased* ignorance or constrain the model to prevent this counter-intuitive outcome. |
  | **3** | **Decision Rule Coherence** | **The Resource Allocation:** The body must recommend Policy A or B. A dominates B (better outcome in every probability within the set). The decision rule must select A (Admissibility). Furthermore, if the body plans a sequence of actions today, they must not regret that plan tomorrow given the same information (Dynamic Consistency), or they will appear erratic to stakeholders. |
  | **4** | **Scoreability** | **The Performance Review:** Two years later, auditors check if the body's "80-90% confidence" statements matched reality. Standard proper scoring rules (Brier, Log) require a single number. If the model cannot be scored without collapsing the interval to a point, the body cannot be incentivized for accuracy, opening them to accusations of hiding behind vagueness. |
  | **5** | **Public Defensibility** | **The Press Conference:** A journalist asks why the confidence interval is so wide. The answer cannot be "the math requires it"; it must map to evidentiary quality (e.g., "conflicting studies"). The representation of belief must be translatable into natural language justifications that non-experts can audit. |
  | **6** | **Computational Tractability** | **The Real-Time Crisis:** During a fast-moving financial crash, the body must update credences hourly. If maintaining the set of priors requires tracking infinite dimensions or non-convex sets that cannot be summarized by bounds, the model fails to deliver timely advice. |

  ### 2. Negotiable vs. Non-negotiable

  1.  **Responsiveness:** Non-negotiable for *this* context; strict Walleyan IP proponents accept inertia, but a public body cannot afford to remain silent after data arrives.
  2.  **Dilation:** Negotiable; IP purists argue dilation is a rational feature of independence, while pragmatists view it as a bug to be fixed by restricting the prior set.
  3.  **Decision Coherence:** Non-negotiable; Dominance is required by all camps, but Dynamic Consistency is often sacrificed by E-admissibility proponents to preserve flexibility.
  4.  **Scoreability:** Negotiable; Precise Bayesians demand it, while IP theorists argue proper scoring is inherently hostile to imprecision and alternative metrics (calibration) are needed.
  5.  **Defensibility:** Non-negotiable; A public body that cannot explain its numbers loses legitimacy, regardless of mathematical elegance.
  6.  **Tractability:** Negotiable in theory but non-negotiable in practice; Academics can tolerate complexity, but operational bodies require summary statistics.

  ### 3. Impossibilities

  You cannot satisfy **Responsiveness**, **Scoreability**, and **Genuine Imprecision** simultaneously. Proper scoring rules are strictly minimized only by reporting a precise probability equal to your true belief; if you report an interval to a proper scoring rule, the optimal strategy is to collapse that interval to a singleton (the midpoint or boundary depending on the rule). To remain scoreable, you must effectively act as a precise Bayesian, rendering the imprecise apparatus decorative rather than functional.

  You cannot satisfy **Dynamic Consistency** and **E-Admissibility** with a non-singleton prior set. Seidenfeld (1991) demonstrates that if you choose acts that are optimal for *some* prior in your set (E-admissibility), there exist decision trees where your future self, holding the same beliefs, would reject the plan your current self chose. For a public body, this manifests as policy reversals that cannot be justified by new evidence, violating the requirement for Decision Rule Coherence.

  You cannot avoid **Dilation** while maintaining **Weak Conglomerability** and **Non-Dogmatism**. If you require that your conditional probabilities respect your unconditional probabilities (conglomerability) and you admit any uncertainty about the relevance of evidence, dilation becomes a mathematical necessity, not a modeling error. To avoid it, you must either dogmatically restrict your prior set (violating the spirit of IP) or accept that some learning episodes will rationally increase your uncertainty.

  ### 4. Contenders

  **Maximality:** An act is chosen if no other act has strictly higher expected utility for *all* priors in the set. This rule is very permissive, often leaving multiple acts admissible, which forces the public body to make arbitrary tie-breaking choices that are hard to defend. It preserves Dynamic Consistency better than E-admissibility but offers less guidance in high-stakes singular decisions.

  **E-Admissibility:** An act is chosen if it maximizes expected utility for *at least one* prior in the set. This allows the body to act on the most optimistic or pessimistic plausible scenario depending on the context, preserving flexibility. However, it guarantees violations of Dynamic Consistency, meaning the body may commit to a strategy today that it will rationally abandon tomorrow without new data.

  **$\Gamma$-Maximin:** An act is chosen if it maximizes the *minimum* expected utility across all priors in the set. This is highly conservative, effectively treating the lower bound of the probability interval as the truth for decision purposes. It ensures Dynamic Consistency and is easy to defend publicly as "cautious," but it ignores evidence that supports higher probabilities, potentially violating Responsiveness.
