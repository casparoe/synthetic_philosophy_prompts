          *   *Pre-registered Predictions:* Need specific outcomes from the "Graduated Giving Trial."
      *   **Part 4: Closing Critique (My Voice):**
          *   Honest assessment.
          *   Where is the bias? Probably in the "Agreed Claims" regarding the *nature* of the gap.
          *   Unfalsifiable predictions? The "Ratchet" prediction might be slippery.
