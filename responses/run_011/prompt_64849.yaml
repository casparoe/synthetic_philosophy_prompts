answer: |-
  Here are ten questions designed to pin down the specific mechanical and normative tensions in her theory, along with the follow-ups keyed to her likely defenses.

  **1. The Baseline Problem**
  "You argue we can measure 'affectedness' to assign weight. But affectedness is a counterfactual: it's the difference between the world *with* the policy and the world *without* it. To calculate that difference, you need a baseline status quo. Who sets the baseline? If the baseline is the current distribution of property and rights, aren't you just baking existing inequalities into the voting weight? If the baseline is hypothetical equality, isn't that a moral claim disguised as an empirical measurement?"

  *   **Follow-up (if she says measurement is inevitably rough but better than binary):** "If the roughness systematically correlates with existing power—say, the wealthy have more legible interests to the commission than the poor—then your 'monotone proxy' isn't just noisy, it's biased. Why is a biased continuous scale morally superior to an unbiased binary one?"

  **2. Preference Dependence**
  "Your model measures how much a decision affects a person's interests. But interests depend on preferences. If I have 'expensive tastes'—say, I'm psychologically devastated by a slight tax hike while my neighbor is indifferent—do I get more voting weight? If yes, you're penalizing stoicism. If no, and you use an 'objective' list of interests, whose list is it? Doesn't that require a prior democratic agreement on what counts as an interest, which brings the boundary problem back?"

  *   **Follow-up (if she says they use objective welfare metrics):** "Objective metrics usually rely on average functionings. If a minority group has a specific cultural stake in a policy that the average model doesn't capture—like indigenous land rights—their 'objective' affectedness registers as low. Doesn't your commission inadvertently silence the very minorities the boundary problem is supposed to protect?"

  **3. The Constitutional Regress**
  "You claim the independent commission solves the 'who decides who decides' regress. But the commission itself must be appointed and constituted. Is the decision to appoint the commission members a collective decision? If yes, who votes on it? If you use the old binary demos to pick the commission, haven't you just kicked the boundary problem back one step? If no, and the commission is self-perpetuating, isn't that epistocracy, not democracy?"

  *   **Follow-up (if she says the commission is constitutionally entrenched):** "Constitutions don't enforce themselves. If a political movement arises that wants to abolish the commission because it keeps stripping them of voting weight, who stops them? If the answer is 'the commission controls the army,' you've left democracy entirely. If the answer is 'the people,' then the people are still the ultimate boundary-setters."

  **4. The Methodology Regress**
  "Let's grant the commission exists. They need a model to calculate affectedness. That model requires parameters: how far into the future do we look? Do we discount future generations? Do we count ecological damage as affecting humans or nature? Who decides the parameters of the model? If the commission decides, isn't that a substantive political choice about what counts as harm, made without an electorate?"

  *   **Follow-up (if she says the parameters are technocratic/scientific):** "Climate science can tell me the temperature rise, but it can't tell me how much that temperature rise *matters* to a farmer versus a banker. That's a valuation, not a measurement. If the commission makes that valuation, aren't they just a legislature that nobody voted for?"

  **5. Strategic Affectedness**
  "If voting weight tracks affectedness, people have an incentive to maximize their affectedness. Imagine a zoning vote. I know my weight depends on how much the zoning change hurts me. Should I invest in my property right before the vote to ensure I have more to lose? Doesn't this encourage people to make themselves vulnerable to state decisions just to gain political power?"

  *   **Follow-up (if she says they can model ex ante intentions):** "You can't model intentions perfectly. If I can game the system by simply declaring higher stakes or making irreversible investments before the vote, your system rewards hostage-taking. How do you distinguish between genuine affectedness and strategic hostage-taking without a prior norm of what counts as a legitimate interest?"

  **6. Electorate Bargaining**
  "Consider a legislature trading votes. In your system, they aren't just trading policy outcomes; they're trading the *composition of the electorate* for future votes. Party A agrees to support Party B's infrastructure bill, but only if the commission models the affectedness for the *next* bill in a way that excludes Party B's constituents. Isn't this a higher-order form of gerrymandering that happens on every single issue?"

  *   **Follow-up (if she says the commission is independent and immune to bargaining):** "Independence doesn't stop the legislature from threatening the commission. If the legislature controls the budget, they can threaten to defund the commission unless the modeled electorate shifts. How is your commission more robust than a Supreme Court facing a hostile legislature?"

  **7. The Diffuse vs. Concentrated Case**
  "Let's look at a concrete case. A dam project provides slight electricity cost reductions for 1 million people ($10/year each) but floods the home and livelihood of 50 families. Your arithmetic sums the affectedness. The million win easily. The 50 families are crushed. In a binary system, we might protect them via rights or supermajorities. In your system, their high weight is swamped by the aggregate. Do you accept that your system permits the tyranny of the slightly affected over the devastated few?"

  *   **Follow-up (if she says rights constraints still apply):** "If rights constraints apply, then the voting weight doesn't actually decide the outcome—the rights do. So the franchise isn't tracking affectedness, it's tracking affectedness *within the bounds of rights*. But who defines the rights? If it's the same fluid demos, the majority can vote to shrink the rights. You haven't solved the tyranny problem; you've just made it calculus-based."

  **8. The Resident Non-Citizen**
  "You argue the all-subjected principle is a special case of your view. Take a long-term resident non-citizen. On your view, they get full weight on policing (highly affected) but near-zero on foreign policy (less affected). Does this create a caste system where some people are full members of the demos on Tuesday and invisible on Wednesday? How do they build political solidarity or organize if their standing dissolves after every vote?"

  *   **Follow-up (if she says solidarity isn't the point, accurate representation is):** "Political power isn't just about outcome accuracy; it's about standing. If I know my voice literally counts for less on foreign policy because I'm not a citizen, I am formally marked as a second-class member. Doesn't this continuous weighting codify stigma in a way that even the binary citizen/non-citizen line doesn't?"

  **9. Accountability Over Time**
  "Democracy relies on retrospective accountability: you vote the rascals out. But if the electorate changes completely between Election A and Election B because the issues changed, how does accountability work? The people harmed by a representative's decision in Term 1 might not be in the demos for Term 2. Who punishes the representative? Doesn't this sever the link between power and responsibility?"

  *   **Follow-up (if she says representatives are bound by mandates, not elections):** "Mandates without the threat of removal are instructions, not democracy. If the people who can remove you aren't the people you harmed, you have no incentive to listen to the harmed. You've created a system of trusteeship, not representation."

  **10. The All-Subjected Claim**
  "You say subjection to law is just one channel of affectedness. But subjection is categorical; you're either under the law's coercion or you're not. Affectedness is gradient. If I am coerced by a law but barely affected by its content, the all-subjected principle says I vote. Your principle says I get near-zero weight. Why should I accept a system where I am legally bound to obey rules I had effectively no say in?"

  *   **Follow-up (if she says their weight is non-zero, just low):** "If my weight is so low that my vote never impacts the outcome, I am effectively subject to laws I didn't make. That violates the core democratic intuition behind the all-subjected principle. You've kept the label of democracy but removed the requirement that the governed consent to the government."

  ***

  ### Which two will she find hardest?

  **1. Question 7 (The Diffuse vs. Concentrated Case)**
  This is the hardest because it attacks the utilitarian calculus at the heart of her theory using a moral intuition she likely shares. She wants to *expand* inclusion, but her math replicates the classic utilitarian problem: the sum of small gains can outweigh catastrophic losses. Her likely escape route is to invoke "rights constraints" (i.e., you can't vote to flood the 50 families). But if she does that, she concedes that voting weight *doesn't* determine the outcome—rights do. This forces her to admit that her franchise model is subordinate to a prior, fixed normative framework, which undermines her claim that the fluid demos solves the boundary problem. She has to choose between being consistent (and allowing the tyranny) or being plausible (and admitting the demos isn't sovereign).

  **2. Question 3 (The Constitutional Regress)**
  This is the hardest because it targets the logical coherence of her "solution." Her main selling point is dissolving the regress. If you press that the *creation* of the commission is itself a boundary decision, she must either admit an infinite regress (which kills the theory) or posit a "magic moment" of constitution-making that *doesn't* use her affectedness principle. If she admits the commission is founded via a traditional binary demos (or by force/history), she concedes that her theory cannot generate its own legitimacy; it relies on a traditional boundary to bootstrap itself. This undermines the claim that she has solved the boundary problem rather than just hidden it inside a technocratic institution.
