answer: |-
  **To:** The Philosophy Department Bequest Committee
  **From:** [Your Name]
  **Date:** 24 October 2023
  **Subject:** Recommendation regarding the [Colleague's Name] Bequest: Strategic Direction for Research Funding

  **1. Preliminary Remarks: Confronting the 'Zombie Debate' Worry**

  You have asked me to argue with your central worry rather than around it, so I shall do so directly. Your suspicion is that once one accepts Leibniz Equivalence—that diffeomorphic models represent the same physical state—the Hole Argument collapses into a triviality, rendering the substantivalist-relationalist dispute a 'zombie debate' where no empirical daylight exists between the combatants. You suggest that if two formulations agree on all point-coincidences and gauge-invariant quantities, any remaining disagreement is merely metaphysical comfort.

  I contend this is incorrect, but only if we shift the locus of the debate from *classical interpretation* to *quantum heuristics*. In classical General Relativity (GR), you are right: the dispute is empirically silent. However, ontology is not merely a posteriori labelling; it is a heuristic constraint on theory construction. A 'sophisticated substantivalist' who believes the manifold structure (or a discrete replacement thereof) carries ontological weight is driven towards quantisation programmes that preserve background independence (e.g., Loop Quantum Gravity). A relationalist who views spacetime as entirely emergent from non-spatiotemporal degrees of freedom is driven towards holographic dualities or string theoretic approaches where geometry is derived.

  The dispute is not about whether GR predicts correctly; both sides agree it does. The dispute is about *what constitutes a degree of freedom* in the successor theory. If we treat gauge redundancy as mere bookkeeping, we risk discarding physical degrees of freedom that reside at boundaries (the 'edge mode' problem). If we treat it as ontological, we risk reifying unobservable structure. Therefore, the debate is alive, but it has migrated from the philosophy of classical spacetime to the philosophy of quantum gravity. A PhD project must track this migration to avoid exegesis.

  **2. A Ranked Research Agenda**

  Below are three candidate questions, ranked by their potential to yield progress within a three-year studentship for a candidate with a physics background but limited formal logic.

  **Rank 1: The Physical Status of Boundary Degrees of Freedom in Gauge Theories**
  *The Question:* In the Hamiltonian formulation of GR, gauge transformations vanish at the boundary. Does this imply that 'surplus structure' becomes physical at the boundaries of a region (e.g., black hole horizons or asymptotic infinity)?
  *   **Dependency:** This answers the 'cheap concession' worry. If gauge variants carry physical information at boundaries (as recent work on soft hair and edge modes suggests), then declaring diffeomorphisms 'physically identical' is too coarse. It forces a refinement of Leibniz Equivalence.
  *   **Tractability:** High. This requires comfort with Hamiltonian GR, constraint analysis, and symplectic geometry, but not heavy category theory or modal logic. It is calculation-heavy, suitable for a physicist.
  *   **Neglect:** Moderate. Physicists are calculating this (Donnelly, Freidel, etc.), but philosophers have not fully integrated the implications for the Hole Argument.
  *   **Impact on Working Relativists:** High. It directly impacts how we count entropy and define observables in quantum gravity. It moves the discussion from 'what exists' to 'what can be measured in a sub-region'.
  *   **Why First:** It turns a metaphysical stalemate into a technical investigation of boundary terms.

  **Rank 2: The Hole Argument and the 'Problem of Time' in Semi-Classical Gravity**
  *The Question:* Does the indeterminism highlighted by the Hole Argument resurface when coupling GR to quantum matter fields, specifically regarding the definition of local observables?
  *   **Dependency:** Depends on Rank 1. If local observables are ill-defined due to gauge freedom, how does semi-classical gravity evade this?
  *   **Tractability:** Medium. Requires understanding of QFT in curved spacetime. The risk is the student gets bogged down in the technicalities of renormalisation and loses the philosophical thread.
  *   **Neglect:** Low. This is a well-trodden path (Rovelli, Dittrich), but often treated separately from the Hole Argument. Reconnecting them is valuable.
  *   **Impact on Working Relativists:** Medium-High. It addresses the 'frozen formalism' issue. If the Hole Argument is merely a gauge artefact, the Problem of Time should be solvable via de-parametrisation. If not, it's deeper.
  *   **Why Second:** It is slightly more prone to becoming a technical exercise without philosophical payoff than Rank 1, but it is crucial for the 'physics that knows physics' mandate.

  **Rank 3: Theoretical Equivalence and Dualities beyond Isomorphism**
  *The Question:* If the Hole Argument teaches us to identify models under gauge groups, how do we handle dualities (e.g., AdS/CFT) where the spacetime dimensionality or topology differs between formulations?
  *   **Dependency:** Depends on accepting that the Hole Argument is a specific case of a broader equivalence problem.
  *   **Tractability:** Low-Medium. Requires grappling with string theory concepts which may be outside the comfort zone of a standard GR student.
  *   **Neglect:** High. Philosophers are just starting to look at dualities (De Haro, Read), but linking it back to the Hole Argument is underexplored.
  *   **Impact on Working Relativists:** Medium. It influences how we interpret string theory results, but is less immediate for a working relativist than boundary terms.
  *   **Why Third:** It risks becoming too speculative for a three-year PhD. It is better suited to a post-doc or a workshop topic.

  **3. Traps and Dead Ends**

  You asked me to identify where the money should *not* go.

  *   **The Trap: Haecceitism and Primitive Thisness.**
      *   *Why:* This is the 'metaphysician's comfort' zone. Debating whether manifold points have primitive identity independent of fields is linguistically intricate but physically inert. No experiment can distinguish a world with haecceitism from one without, nor does it guide Lagrangian construction.
      *   *Verdict:* Dead end. A student pursuing this will write 200 pages of exegesis on Lewis and Maudlin without producing a result a physicist would recognise.

  *   **The Dead End: Pure Category-Theoretic Formulations of Equivalence.**
      *   *Why:* While Weatherall and Halvorson have done important work here, a student without formal logic training will drown in the syntax. It risks becoming a project in mathematics rather than philosophy of physics.
      *   *Verdict:* Avoid unless the student has a specific aptitude for formal methods. For a physics-first candidate, this is a distraction.

  **4. Success Metrics: What to Look For in Three Years**

  To ensure this is not merely a sabbatical for a metaphysician, I would judge the success of the studentship by the following:

  1.  **Publication Venue:** At least one paper in a physics journal (e.g., *Classical and Quantum Gravity*, *Physical Review D*) or a top-tier philosophy of science journal (*British Journal for the Philosophy of Science*, *Studies in History and Philosophy of Modern Physics*). If the work only appears in general metaphysics journals, it has failed the bequest's remit.
  2.  **Formal Result:** A derivation or a no-go theorem regarding the definition of observables in a specific context (e.g., bounded regions), rather than a purely argumentative paper.
  3.  **Community Engagement:** Evidence that the student has presented at a physics conference (e.g., GRG, DPG) and not just philosophy conferences. The work must be intelligible to the modellers.

  **5. Recommendation: Studentship vs. Workshops**

  You present a choice between one three-year PhD studentship or a two-year series of residential workshops.

  **I recommend the Studentship.**

  *   **Reasoning:** The core problem you identified—that the debate was 'defused by reflex'—requires sustained, technical digging to overcome. Workshops tend to reinforce existing consensus; they are excellent for disseminating settled views, but poor for breaking new ground. A workshop series on the Hole Argument risks becoming a gathering of the converted, rehearsing the Earman-Norton line without challenging the 'cheap concession'.
  *   **Alignment with Bequest:** The donor specified "philosophy that actually knows some physics." A workshops series inevitably dilutes this. You will get speakers who know the philosophy well and the physics passably, or vice versa. A single studentship allows you to recruit a candidate with a first-class degree in theoretical physics who is willing to undertake philosophical training. This ensures the 'physics knowledge' is foundational, not decorative.
  *   **Risk Mitigation:** The risk with a studentship is isolation. To mitigate this, the studentship should be conditioned on the student organising *one* small workshop in the second year, inviting the very experts (Exeter, UK, and Europe) who would have attended the workshop series. This gives you the community-building benefit of the workshops while retaining the focused research output of the PhD.

  **6. Conclusion**

  The Hole Argument is not dead, but it has changed address. It no longer lives in the manifold; it lives in the boundary terms and the quantisation procedure. If we fund a project that investigates how gauge redundancy translates into physical degrees of freedom at the boundaries of spacetime regions, we honour the donor's wish for physics-literate philosophy. We also provide a genuine service to the relativists, who are currently struggling to define observables in quantum gravity without a clear ontological map.

  The 'zombie debate' only remains a zombie if we keep asking classical questions. The studentship should be tasked with asking quantum ones.

  Yours sincerely,

  [Your Name]
  Devon
