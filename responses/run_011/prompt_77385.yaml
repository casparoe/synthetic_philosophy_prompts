answer: |-
  ### Brainstorming Cruxes

  1.  **The Exclusion Problem:** How to express that a sentence is *only* true (or *only* false) without implying a classical dichotomy that collapses the glut. If we add an operator $J$ where $J(A)$ is true iff $A$ is strictly true (value 1), we risk a "Revenge Liar" ($\lambda \leftrightarrow \neg J(\lambda)$) that admits no valuation in LP, threatening expressive completeness.
  2.  **Classical Recapture:** The strategy of restricting classical inference rules to "consistent" domains. The crux is whether the consistency predicate can be expressed within the object language without generating new paradoxes.
  3.  **Detachability:** LP lacks a conditional that satisfies Modus Ponens and the Deduction Theorem simultaneously. Adding one often invites Curry's Paradox, forcing a choice between a usable conditional and naive truth.
  4.  **Revenge via Semantics:** The semantic clauses themselves (e.g., "is designated") are often classically defined in the meta-language. Can the object language capture its own semantic categories?

  **Selection:** I am choosing the **Exclusion Problem**. It is the most direct technical rebuttal to the student folklore that "dialetheism just accepts contradictions." It requires constructing a specific operator to show that while LP can handle the standard Liar (via gluts), it cannot handle an "Exclusive Liar" without losing a model. This forces students to engage with the valuation mechanics rather than reciting the "true contradiction" slogan. The Recapture and Detachability issues are too dependent on conditional logic nuances for a self-contained 100-minute question, and the Meta-language Revenge is too abstract for a formal exercise of this scope.

  ***

  ### EXAMINATION PAPER

  **Course:** PHI 505: Non-Classical Logic
  **Time Allowed:** 100 Minutes
  **Total Marks:** 25

  **Instructions:** Answer both parts. All technical terms are defined below. Do not rely on external terminology.

  **Semantic Framework:**
  Consider a language $\mathcal{L}$ containing propositional variables, the connectives $\neg$ (negation) and $\wedge$ (conjunction), a truth predicate $T$, and a special one-place operator $J$ ("Just True").
  There are three truth values: $\{1, i, 0\}$.
  The set of **designated values** is $\mathcal{D} = \{1, i\}$.
  A valuation $V$ assigns a value from $\{1, i, 0\}$ to every sentence.

  **Semantic Clauses:**
  1.  $V(\neg A) = 1 - V(A)$ (where $1-1=0, 1-0=1, 1-i=i$).
  2.  $V(A \wedge B) = \min(V(A), V(B))$ (ordering $0 < i < 1$).
  3.  **Naive Truth:** $V(T\langle A \rangle) = V(A)$.
  4.  **Just-True Operator:**
      *   $V(J(A)) = 1$ if $V(A) = 1$.
      *   $V(J(A)) = 0$ if $V(A) = i$.
      *   $V(J(A)) = 0$ if $V(A) = 0$.
  5.  **Equivalence:** A sentence of the form $A \leftrightarrow B$ is satisfied by $V$ iff $V(A) = V(B)$.

  **Part A (15 Marks)**
  Consider two self-referential sentences, $\mu$ and $\lambda$, defined as follows:
  *   $\mu$ is a sentence such that $\mu \leftrightarrow \neg T\langle \mu \rangle$.
  *   $\lambda$ is a sentence such that $\lambda \leftrightarrow \neg J\langle \lambda \rangle$.

  1.  Show by case analysis whether there exists a valuation $V$ that satisfies $\mu$. If yes, specify the value(s).
  2.  Show by case analysis whether there exists a valuation $V$ that satisfies $\lambda$. If yes, specify the value(s).
  3.  Conclude explicitly for each sentence whether a consistent assignment exists.

  **Part B (10 Marks)**
  Based on your results in Part A, answer the following:
  Does the failure to find a valuation for $\lambda$ imply that the logical system is trivial (i.e., that every sentence is true)? Explain what specific expressive limitation the result reveals for a dialetheist who wishes to use the operator $J$, and identify the philosophical cost of accepting this limitation.

  ***

  ### MODEL ANSWER

  **Part A: Formal Analysis**

  **1. Analysis of $\mu$ ($\mu \leftrightarrow \neg T\langle \mu \rangle$)**
  We test the three possible values for $V(\mu)$ to see if any satisfy the equivalence condition $V(\mu) = V(\neg T\langle \mu \rangle)$.

  *   **Case 1:** $V(\mu) = 1$.
      By Naive Truth, $V(T\langle \mu \rangle) = 1$.
      By Negation clause, $V(\neg T\langle \mu \rangle) = 0$.
      Equivalence requires $1 = 0$. This is false. No assignment here.
  *   **Case 2:** $V(\mu) = 0$.
      By Naive Truth, $V(T\langle \mu \rangle) = 0$.
      By Negation clause, $V(\neg T\langle \mu \rangle) = 1$.
      Equivalence requires $0 = 1$. This is false. No assignment here.
  *   **Case 3:** $V(\mu) = i$.
      By Naive Truth, $V(T\langle \mu \rangle) = i$.
      By Negation clause, $V(\neg T\langle \mu \rangle) = i$ (since $\neg i = i$).
      Equivalence requires $i = i$. This holds.

  **Conclusion for $\mu$:** There is exactly one satisfying valuation: $V(\mu) = i$. The sentence is a "glut" (both true and false), but it admits a stable assignment within the semantics.

  **2. Analysis of $\lambda$ ($\lambda \leftrightarrow \neg J\langle \lambda \rangle$)**
  We test the three possible values for $V(\lambda)$ to see if any satisfy $V(\lambda) = V(\neg J\langle \lambda \rangle)$.

  *   **Case 1:** $V(\lambda) = 1$.
      By $J$ clause, $V(J\langle \lambda \rangle) = 1$ (since input is 1).
      By Negation clause, $V(\neg J\langle \lambda \rangle) = 0$.
      Equivalence requires $1 = 0$. False.
  *   **Case 2:** $V(\lambda) = 0$.
      By $J$ clause, $V(J\langle \lambda \rangle) = 0$ (since input is 0).
      By Negation clause, $V(\neg J\langle \lambda \rangle) = 1$.
      Equivalence requires $0 = 1$. False.
  *   **Case 3:** $V(\lambda) = i$.
      By $J$ clause, $V(J\langle \lambda \rangle) = 0$ (Crucial: the clause specifies output 0 for input $i$).
      By Negation clause, $V(\neg J\langle \lambda \rangle) = 1$ (since $\neg 0 = 1$).
      Equivalence requires $i = 1$. False.

  **Conclusion for $\lambda$:** There is **no** valuation $V$ that satisfies $\lambda$. The sentence creates a "semantic gap" rather than a glut; it cannot be assigned any value in $\{1, i, 0\}$ consistently with the clauses.

  **Part B: Philosophical Implications**

  The failure to find a valuation for $\lambda$ does **not** imply that the system is trivial. Triviality would require that every sentence is designated (true or glut). Here, the result is merely that the specific sentence $\lambda$ has no truth value within the model. The system remains non-trivial because $\mu$ successfully takes the value $i$, and classical tautologies (like $P \vee \neg P$) remain designated.

  The result reveals an **expressive limitation**. The operator $J$ was intended to express "exclusive truth" (true and not false). However, the language cannot consistently contain its own "exclusive truth" predicate. If the dialetheist adds $J$ to the language to distinguish gluts from classical truths, they generate a new paradox ($\lambda$) that the semantics cannot resolve, unlike the standard Liar ($\mu$).

  The philosophical cost is **semantic incompleteness**. The dialetheist must admit that their object language cannot fully express the semantic distinctions they rely on in the meta-language (specifically, the distinction between value 1 and value $i$). They can *use* the distinction to define the logic, but they cannot *say* it within the logic without contradiction or valuelessness. This forces a choice: either accept that the language is expressively weaker than the meta-language (a hierarchical cost) or deny that $J$ is a legitimate logical operator (limiting the ability to discuss consistency internally). This is not a collapse into classical logic, but it prevents the dialetheist from formally asserting "This sentence is only true" without risking a new paradox.

  ***

  ### MARKING SCHEME (25 Marks Total)

  **Part A: Formal Derivations (15 Marks)**

  *   **$\mu$ Analysis (5 Marks)**
      *   [1 mark] Correctly calculates $V(\mu)=1$ leads to contradiction ($1 \neq 0$).
      *   [1 mark] Correctly calculates $V(\mu)=0$ leads to contradiction ($0 \neq 1$).
      *   [2 marks] Correctly calculates $V(\mu)=i$ leads to stability ($i = i$). *Note: Must show $\neg i = i$.*
      *   [1 mark] Explicitly states $\mu$ has a valid assignment ($i$).
  *   **$\lambda$ Analysis (8 Marks)**
      *   [2 marks] Correctly calculates $V(\lambda)=1$ leads to contradiction.
      *   [2 marks] Correctly calculates $V(\lambda)=0$ leads to contradiction.
      *   [3 marks] Correctly calculates $V(\lambda)=i$ leads to contradiction. *Critical: Must show $J(i)=0$ and $\neg 0 = 1$, leading to $i \neq 1$.*
      *   [1 mark] Explicitly states $\lambda$ has **no** valid assignment.
  *   **Definitions & Notation (2 Marks)**
      *   [1 mark] Uses provided semantic clauses correctly (no external assumptions).
      *   [1 mark] Clear case structure (no skipped steps).

  **Part B: Essay Response (10 Marks)**

  *   **Triviality Check (3 Marks)**
      *   [3 marks] Explicitly states the system is **not trivial**. Explains that "no model for $\lambda$" $\neq$ "all sentences designated."
      *   *Penalty:* -2 marks if student claims the system explodes/trivializes.
      *   *Penalty:* -1 mark if student conflates "non-designated" with "false" in this context.
  *   **Expressive Limitation (4 Marks)**
      *   [2 marks] Identifies the problem as **expressive** (inability to express "exclusive truth" or distinguish 1 from $i$ in-object).
      *   [2 marks] Explains the cost: The meta-language can distinguish values, but the object language cannot capture that distinction via $J$ without paradox.
      *   *Penalty:* -2 marks if student treats this as a problem unique to dialetheism (must acknowledge naive truth theories generally face revenge).
      *   *Penalty:* -1 mark if student assumes $J$ must be excluded without arguing why.
  *   **Coherence (3 Marks)**
      *   [3 marks] Argument flows logically from Part A results. No internal contradictions.
      *   *Penalty:* -1 mark for using undefined terms (e.g., "Curry," "Recapture") without definition.

  **Specific Error Penalties (Apply in addition to above)**
  *   **"Just another glut":** If student claims $\lambda$ is a glut ($i$) despite the math showing $i \neq 1$, deduct 5 marks from Part A. (This indicates failure to check the $J$ clause).
  *   **"False means 0":** If student treats $i$ as "false" in the essay section, deduct 2 marks from Part B.
  *   **"Summary Regurgitation":** If Part B contains general slogans about "true contradictions" without referencing the $J$ operator or the valuation failure, cap Part B at 4/10.

  ***

  ### Examiner's Note on Formal Construction

  I have double-checked the clause for $J$. The critical move is setting $V(J(A)) = 0$ when $V(A) = i$.
  If I had set $V(J(A)) = i$ when $V(A) = i$, then for $\lambda \leftrightarrow \neg J(\lambda)$:
  If $V(\lambda) = i$, then $V(J(\lambda)) = i$, then $V(\neg J(\lambda)) = i$.
  Then $i = i$, and the paradox would vanish (it would behave like the standard Liar).
  To generate the "Exclusion Paradox" (where no value works), the operator *must* map the glut value $i$ to a classical value (in this case 0), which is then flipped by negation to 1, creating a mismatch with the input $i$. This construction is standard in the literature (often called a "Boolean projection" or "determinacy operator"), but I verified the arithmetic specifically for this prompt to ensure the "No Model" result is robust. The only potential ambiguity is the definition of $\leftrightarrow$; I defined it as identity of value to avoid complications with LP's material conditional, which ensures the exercise tests the valuation of the operator, not the student's memory of LP conditionals.
