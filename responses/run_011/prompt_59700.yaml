  *(Refining the "Verdict" on Conclusion)*: If the analogy is wrong, does the conclusion fail? The conclusion is "degrees screen for talent honestly." If the analogy fails, the *support* for the conclusion fails. The conclusion itself might still be argued on other grounds, but based *on this analogy*, it collapses. I will mark "collapses".

  *(Refining "Better Analogy")*: Maybe a "bond" or "entry fee" that is refundable only if you perform? Or simply "Signaling" without the "Handicap" confusion. Let's suggest "Tollbooth" or "Bond". Actually, "Entry Fee" is clearer.

