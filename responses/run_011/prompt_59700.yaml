          *   *Verdict:* Breaks. In hiring, the "weight" (degree) might signal wealth/persistence more than productivity (credentialism vs. human capital).
      *   *Feature:* The Race.
          *   Racing: Actual competition to win.
          *   Peacock: Mating display.
          *   Hiring: Getting the job.
          *   *Verdict:* Holds loosely.
      *   *Feature:* Punters (Observers).
          *   Racing: Bettors.
          *   Peacock: Peahens.
          *   Hiring: Employers.
          *   *Verdict:* Holds.

  5.  **Analyze the "Cost Cheaper for the Fit" Condition (Spence):**
      *   Michael Spence's Job Market Signaling (1973) relies on the cost of education being *lower* for high-ability workers than low-ability workers.
      *   *Editor's claim:* "Only the able can carry the weight."
      *   *Reality:* If the cost is purely financial (tuition), wealth matters more than ability. If the cost is cognitive (difficulty), ability matters. Credentialism often implies the *credential* matters more than the *skill*.
      *   *Disanalogy:* A peacock *cannot* fake a tail. A degree *can* be bought (via debt/wealth) without the underlying productivity, or the cost might be prohibitive for high-ability/low-wealth candidates.
      *   *Damage:* High. If the cost isn't correlated with ability (but with wealth), the signal is noisy or dishonest.

  6.  **Analyze Beneficiaries:**
      *   *Racing:* Track owners/Bettors (entertainment). The horse gets nothing (actually disadvantaged).
      *   *Peacock:* The Male (gets mates). The Female (gets good genes).
      *   *Hiring:* Employer (hopefully gets good worker). Candidate (gets job).
      *   *Shift:* In racing, the "signal" (weight) is designed to *confuse* the outcome (make it close). In biology/hiring, the signal is designed to *clarify* the quality. This is a fundamental contradiction in the editor's logic.

  7.  **Drafting the Prose:**
      *   *Etymology:* Confirm "hand-in-cap." Explain racing handicap = equalization, not signaling.
      *   *The Core Flaw:* The editor confuses "Handicap Principle" (Biology) with "Handicap Race" (Sports). They share a word, but the mechanism is opposite. In racing, weight hides talent. In biology, cost reveals it.
      *   *Credentialism:* Does a degree signal ability or privilege? If it's credentialism, it's often a barrier to entry unrelated to productivity (rent-seeking).
      *   *Conclusion:* The editor's conclusion collapses because the foundational analogy (Racing Handicap) contradicts the biological mechanism (Signaling Cost).

