answer: |-
  **MEMORANDUM**

  **TO:** Library and Special Collections Committee
  **FROM:** [Your Name], Philosophy Seat
  **DATE:** 5 November 2024
  **SUBJECT:** The Combe Bequest and Clause 7 of the Collections Charter

  **1. Purpose**
  This memo prepares the Committee for the meeting on 12 November regarding the bequest of the sealed strongbox containing the Combe correspondence. It offers recommendations on the bequest itself and on the interpretation of Clause 7 of the Collections Charter.

  **2. Recommendation on the Bequest**
  I recommend that the University **refuse the bequest in its current form**.

  We should authorise the Chair to inform the executors that we would accept the deposit only if the covenant to destroy the box in 2125 is removed and provision is made for eventual scholarly access. If the executors decline these terms, we must decline the gift.

  **3. The Case for Refusal**
  The Head of Special Collections recommends refusal based on Clause 7. The Professor of English recommends acceptance, potentially violating the deed. Both miss the central ethical hazard.

  The primary objection is not cataloguing, but the covenant to destroy. By accepting this gift, the University becomes the instrument by which evidence is annihilated. Our mission is preservation. If we accept a condition that requires us to destroy historical evidence, we compromise our integrity.

  Furthermore, cataloguing material that nobody may inspect invites speculation. If we list the box as containing "proof of authorship," we assert a fact we cannot verify. If we list it merely as "papers," we obscure its value. Either way, the catalogue becomes a source of confusion rather than clarity.

  Finally, there is the matter of precedent. If we accept a deed requiring destruction, we signal to other collectors that the University is a suitable repository for secrets destined for the fire. We risk becoming a graveyard for evidence rather than a library for research. The residuary charity may destroy the box anyway, but that is their choice, not ours. We cannot contract to do what violates our purpose.

  **4. Recommendation on Clause 7**
  I recommend that Clause 7 be **amended**. The Head of Special Collections is correct that the clause creates a difficulty, but incorrect about why. The clause is currently ambiguous between a rule of evidence and a claim about reality.

  **5. Analysis of Clause 7**
  To resolve this, we must address four points.

  *First, Clause 7 cannot be maintained as a general claim about truth.*
  The clause states nothing is a "matter of fact" unless someone could know it. If we hold this as a general truth, we commit ourselves to the view that if all evidence is lost, the fact ceases to exist. If the box burns in 2125, did the author of *The Salt Meadow* cease to be the author? This is untenable. Reality does not depend on our access to it. The Bursar can explain it thus: "If we say truth needs knowability, then lost history isn't true history. That makes our job impossible." We must distinguish between *what is true* and *what we can verify*. Clause 7 should govern the latter, not the former.

  *Second, we must define "could in principle come to know".*
  Does this mean logically possible (no contradiction), physically possible (laws of physics), or compatible with our undertakings (legal/moral rules)?
  If we choose "logically possible," the clause loses its teeth. It was inserted to stop family legends being recorded as fact. Legends are physically accessible but unverified. If we allow "logical possibility," we could catalogue legends because it isn't logically impossible to verify them.
  If we choose "compatible with undertakings," we block the strongbox. We have undertaken not to open it.
  The clause was intended to prevent unverified claims. Therefore, it should mean "compatible with available evidence." We should not record something as fact unless the evidence is open to inspection by authorised staff. This stops family legends (no evidence) but allows us to manage restricted access materials (evidence exists, access is controlled).

  *Third, does the "self-referential restriction" apply?*
  Philosophers sometimes restrict knowability principles so they do not apply to statements about their own knowability. This strategy has no purchase here. The contents of the box are not about knowledge; they are empirical claims about a novelist. The problem is not a logical paradox; it is a physical barrier combined with a legal covenant. We cannot logic our way out of a locked box.

  *Fourth, the cataloguing discipline.*
  The Head of Special Collections worries that describing the box asserts a fact nobody can know. This is a valid concern about cataloguing discipline, not metaphysics. We can describe the *object* (a box with a schedule) without certifying the *content* (the authorship proof). Clause 7 should ensure we do not certify the content as fact until verified.

  **6. Proposed Resolution**
  I propose the following resolution to amend Clause 7:

  > "Clause 7 of the Collections Charter is amended to read: 'Nothing shall be entered in the catalogue as a matter of fact unless the evidence supporting it is available for inspection by authorised staff. Objects may be catalogued by description of their exterior and provenance where contents are restricted or unverified.'"

  This preserves the discipline intended twenty years ago—preventing unverified legends from entering the record as fact—without committing the University to the view that truth depends on knowability. It allows us to record the existence of the strongbox without certifying the truth of its contents until such time as they may be verified.

  **7. Timetable**
  The executors require an answer by the end of Michaelmas term (13 December 2024).
  *   **12 November:** Committee meeting to decide on the bequest and Clause 7.
  *   **15 November:** Chair to communicate our counter-offer to the executors (acceptance conditional on removal of destruction covenant).
  *   **6 December:** Deadline for executors' response.
  *   **13 December:** Final confirmation to executors.

  **8. Conclusion**
  We should not accept a gift that requires us to destroy evidence. We should not maintain a Charter clause that implies history vanishes when evidence is hidden. By refusing the bequest as conditioned and amending Clause 7 to focus on evidence availability, we protect the University's mission and clarify our cataloguing standards.

  I look forward to discussing this on the twelfth.
