  **(Self-Correction Note):** Make sure to emphasize the *corpus composition* issue. Between 1250 and 1750, the ratio of Latin to Vernacular changes drastically. If the embedding space mixes them, a "changepoint" might just be "when English took over from Latin," not "when Science started." This is a crucial technical/historical intersection.

