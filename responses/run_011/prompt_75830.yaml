answer: |-
  Your diagnosis is substantially correct, but it requires a sharper formulation to capture why the debate persists despite the apparent metaphysical settlement. You are right that the concession of supervenience removes the possibility of "spooky" social substances existing independently of individuals. You are also right that the residual dispute is largely about explanatory norms disguised as ontology. However, characterizing the remainder as merely "definitional" understates the technical stakes involved in causal modeling. The debate has not stalled because the participants are confused; it has stalled because it has migrated from metaphysics to the philosophy of causal inference, where the disagreement is no longer about what exists, but about which variables provide invariant generalizations.

  The core ambiguity you identified lies precisely in the term "individual." Strict methodological individualists insist that explanations must terminate in the psychological states or actions of persons. Yet, as you note, if "facts about individuals" are permitted to include relational properties—who reports to whom, who is married to whom, what role one occupies—then individualism becomes trivially true. A corporate hierarchy is nothing but a set of relational facts about individuals. But if individualism absorbs relational facts, it loses its distinctive bite against holism, because those relations *are* the social structure. Conversely, if individualism excludes relational facts and demands purely psychological or physical descriptions, it becomes empirically unbelievable, as it cannot account for the constraints that institutional roles impose on action. The debate survives because individualists oscillate between these two definitions: they claim the trivial version to secure ontological safety, but practice the restrictive version to demand psychological reduction.

  Regarding the metaphysical residue, you ask whether anything survives supervenience. The answer is yes, but it is not substance; it is *causal autonomy*. The genuine residue is not downward causation in the sense of a social entity pushing a physical body like a ghost in a machine. Rather, it is the stability of macro-level causal relations that would be lost under reduction. Consider inflation. Inflation supervenes on millions of individual pricing decisions. However, the causal relationship between inflation and unemployment is stable and predictive. If we attempt to explain unemployment solely through the beliefs and desires of every individual actor, the signal is drowned in noise. The "emergent power" of the social structure is simply the fact that macro-variables often exhibit greater invariance under intervention than micro-variables.

  For a claim of downward causation to be more than a redescription, it must demonstrate that manipulating the macro-variable produces a change in individual outcomes that cannot be predicted or explained by manipulating individual variables alone, or that the macro-manipulation is the only feasible intervention. If a central bank raises interest rates, it intervenes on a macro-variable. This causes individuals to borrow less. The individualist must say the bank actually changed the incentives of specific bankers. But the intervention was not on the bankers; it was on the rate. The causal power resides in the systemic position of the rate, not the psychology of the actors. Thus, the metaphysical residue is the autonomy of macro-causal pathways. Supervenience ensures the ontology is individual, but it does not ensure that individual-level explanations are efficient, stable, or even possible for specific questions.

  This leads directly to your question about causal modeling. The dispute has indeed relocated here, though philosophers often miss the technical implications. In modern causal inference, a variable is a cause if manipulating it changes the probability of the effect, holding other factors fixed. Quantitative social science routinely treats macro variables—inequality indices, institutional types, social trust scores—as causes of individual outcomes. The individualist objection is that these are merely aggregates, and the "real" causes are the individuals composing them.

  However, under an interventionist account of causation, this objection fails if the macro-variable remains stable under interventions that do not fix every micro-constituent. If I change the tax code (a macro-intervention), I change individual behavior without needing to intervene on each individual's psychology directly. The macro-variable is a cause because it is a handle for intervention. The individualist might retort that the tax code only works by changing individual incentives. But this conflates the *mechanism* with the *cause*. The mechanism is micro; the cause can be macro.

  Is this a decidable technical question? Yes, in principle. It turns on whether the macro-variable adds predictive power or stability to the model after controlling for individual constituents. If including a "culture" variable improves prediction of individual voting behavior beyond what is predicted by individual income and education, then "culture" has causal efficacy in the model. Settling this would resolve the technical dispute, but it would not satisfy the ontological anxieties of the individualists. They care about *ultimate* responsibility, not just predictive accuracy. They want to know if the social structure is *really* doing the work, or if it is just a shorthand. The technical answer is that the structure is doing the work *as a structure*. Resolving the modeling question would show that holism is methodologically necessary, even if individualism is ontologically fundamental. This asymmetry is what keeps the debate alive: the ontological victory of individualism is pyrrhic because it offers no methodological advantage.

  The ecological and atomistic fallacies further illuminate this stalemate. The ecological fallacy warns against inferring individual relationships from aggregate data (e.g., assuming rich individuals vote conservative because rich countries vote conservative). The atomistic fallacy warns against inferring aggregate relationships from individual data (e.g., assuming that because saving is good for an individual, universal saving is good for the economy). Individualists wield the ecological fallacy to show that macro-explanations are unreliable. Holists wield the atomistic fallacy to show that micro-explanations are incomplete.

  Scoring these failures supports neither side exclusively; rather, it supports a multi-level realism. The pair of failures demonstrates that causal relations are level-specific. A correlation at the macro level is a real social fact, even if it does not hold at the micro level. This undermines the individualist demand for micro-foundations for every macro-phenomenon. Sometimes the macro-phenomenon is the only place the regularity exists. If the debate were purely about truth, the existence of the atomistic fallacy should silence the individualist demand for reduction. The fact that it does not suggests the individualist commitment is normative: they believe explanations *ought* to bottom out in individuals, regardless of where the statistical regularities reside. This confirms your hypothesis that the dispute is about norms of explanation. The individualist norm is "no black boxes"; the holist norm is "no loss of structural context."

  The mechanism program in analytical sociology attempted to dissolve this by demanding that macro-to-macro explanations be opened up to reveal the micro-mechanisms (macro-micro-macro). This was intended to satisfy individualists by providing micro-foundations while satisfying holists by acknowledging macro-causes. In practice, however, it has largely relocated the debate rather than resolving it. By insisting on mechanisms, the program forces researchers to specify how individuals interact. But in doing so, it often presupposes the very social structures it claims to explain. To explain a norm, one must assume agents recognize the norm. To explain a market crash, one must assume agents are embedded in a trading network.

  The mechanism program stops asking the ontological question by treating social structures as the "background conditions" for individual action. This is a pragmatic compromise, not a solution. It dissolves the debate only by ignoring the hard case: what explains the background conditions? If the mechanism program says "previous actions," it invites an infinite regress. If it says "social structures," it concedes holism. Consequently, the program has not ended the debate; it has simply provided a standardized language for describing the interface between the two levels. It validates the holist claim that structure constrains action, while validating the individualist claim that action reproduces structure. But it leaves the priority question unanswered.

  So, what counts as progress? Given this diagnosis, progress will not come from a decisive case study or a formal proof that one side is correct. The metaphysical ground is too settled for that, and the methodological utility is too context-dependent. Progress requires a change of question. We must stop asking "Are social entities real?" or "Must explanation terminate in individuals?" and start asking "Under what conditions do macro-variables provide invariant causal generalizations that micro-variables cannot?"

  This shifts the burden from ontology to robustness. A distinction must be drawn between *ontological individualism* (which is likely true via supervenience) and *explanatory individualism* (which is often false or inefficient). Progress would look like a formal demonstration that certain classes of social phenomena—specifically those involving feedback loops, network effects, or institutional path dependence—are computationally intractable or causally opaque when modeled solely at the individual level. If it can be shown that the information loss involved in reducing a social structure to individual心理 states is not just practical but principled (i.e., the macro-pattern is not contained in the micro-description in a usable way), then the individualist demand for reduction is defeated on technical grounds, not just pragmatic ones.

  Alternatively, progress could come from demonstrating that the individualist norm is driven by a specific ideological commitment to agency and responsibility, rather than scientific rigor. If the insistence on micro-foundations is shown to be a moral preference for holding individuals accountable rather than an epistemic requirement for truth, the debate loses its scientific pretense.

  However, I suspect no such progress should be expected in the near term. The debate stays alive because it serves a sociological function within the academy. Methodological individualism is the badge of economics and rational choice theory; holism is the badge of sociology and anthropology. To concede the debate is to concede disciplinary turf. The ambiguity in "individual" is not a bug; it is a feature that allows individualists to claim ontological purity while relying on social concepts when convenient.

  Therefore, the most honest diagnosis is that the debate is a proxy war over disciplinary authority, fought with ontological weapons. The ambiguity you located is the trench where the war is fought. Until the philosophical community stops treating methodological preferences as metaphysical discoveries, the stalemate will remain. The verdict is not that both sides have a point, but that they are answering different questions: the individualist is asking about *constituents*, and the holist is asking about *constraints*. Since constituents and constraints are both necessary for a complete picture, the conflict is unnecessary. But it persists because admitting that renders the dramatic ontological standoff obsolete. The progress you seek requires dissolving the temptation to turn methodological choices into metaphysical verdicts. Until then, the debate will continue to cycle through the same examples, with the same definitions, producing the same heat and light.
