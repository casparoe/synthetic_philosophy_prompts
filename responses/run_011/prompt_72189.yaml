prompt: |-
  For the past eleven months I have chaired the Student Standards Council at a residential college of roughly 1,100 students, and in September I have one two-hour session in which to prepare sixteen incoming members — eleven undergraduates, five faculty and staff — to begin hearing real cases in October. The room has movable tables, a whiteboard, and no budget. I do not want to spend the session lecturing about moral emotions, and I would like your help designing something that does the work without my doing the talking.

  Here is why the question has stopped being abstract for me. Three years of confidential hearings produced a striking regularity: respondents almost always admitted the conduct once the door was closed, and close to half of them proposed a sanction against themselves more severe than the one the council went on to impose. Last spring we broke with that practice and piloted a single open hearing before an audience of about sixty students. The respondent denied matters he had already conceded in the investigative file. Two of the four student witnesses asked to have their statements withdrawn. The complainant transferred out within a month. And yet a substantial number of students in that audience told me afterwards that it was the first time they had understood what the standard actually required, and reports out of that dormitory fell sharply for the following term. Nothing our confidential procedure has ever done produced that. I have been unable to reconcile the two results, and I no longer trust the framework our handbook gives me for thinking about them — it still organizes itself around the old Benedict distinction between guilt cultures and shame cultures, which I now suspect conceals the variables that actually did the work in that room: who was watching, whether the watchers were people whose regard the respondent needed, whether a route back to standing existed and was credible, and whether anyone could simply leave.

  I should add the failure that has stayed with me most. I had assumed the answer lay in Braithwaite's idea of reintegrative shaming — disapproval directed at the act rather than at the person, followed by an explicit ceremonial restoration — and we ran the open hearing on that model. The restoration phase backfired. Several students read the welcome-back as proof that the disapproval had been theater all along, and the respondent told me privately that he could no longer tell what any of it had meant.

  So: design a two-hour activity for these sixteen people that lets them run into the structural difference themselves and then confronts them with the question I cannot answer — whether a community genuinely chooses between these two economies of moral emotion, or whether the choice is largely settled in advance by its size, its visibility, and the ease with which its members can exit.

  The requirements I would ask you to treat as binding:

  1. No theory up front. The words guilt and shame should not leave my mouth until the debrief, and participants should be able to reconstruct the distinction from what happened to them rather than from a handout.

  2. The session should run two institutional regimes over comparable cases and tally something real: how often the accused admits the conduct, how severe a sanction the accused proposes for themselves, how many witnesses stay with their account under questioning, what the non-participants afterwards believe the rule to mean, and how many people say they would want out of the group. Give me a scoring procedure a non-specialist can run in the room without turning anyone into a specimen.

  3. The exposure-based regime must win somewhere, and win in a way participants find unpleasant to concede. If the activity only demonstrates that the private, act-focused, reparative procedure is superior, it has taught them nothing I already believe.

  4. Real but bounded stakes. Something participants actually care about must be at risk in the room — standing, a role, an anonymous rating that is later revealed — but the design may not draw on their own conduct histories, may not humiliate anyone, and must let a person step out without that step becoming a matter of record. Explain the mechanism by which you generate felt stakes without harm, and be candid about what the mechanism costs: if the risk attaches to an invented persona rather than to the participant, tell me how much of the effect I am surrendering.

  5. Stage the collapse I witnessed. There should be a scripted moment in which the exposure regime offers its restoration phase, and a rule allowing participants to register that the offer retroactively devalued the disapproval that preceded it.

  6. The closing phase should be a decision that looks free and is not. Let the group settle policy for their own council — hearing format, whether findings are published, what restoration requires — and only then reveal constraints they did not author: the confidentiality obligations our counsel insists on, the fact that 1,100 people is not a village, the fact that a respondent can withdraw and carry their record somewhere else. They should leave wondering whether choosing was ever the right description.

  Please deliver a minute-by-minute run sheet; the role assignments and case materials in a form I can print without further drafting; my facilitation language, close to verbatim, for the three or four moments where one careless sentence would spoil the effect, including what to say if a participant becomes genuinely distressed; a debrief that maps particular moments in the room onto the distinctions described above and says what each moment does and does not establish; a list of what predictably goes wrong the first time this is run with nineteen-year-olds and how to handle each; and a plain statement of which feature of the guilt–shame contrast the activity cannot reproduce, so that I know what I must supply by argument afterwards.

  Two final constraints. Do not give me a reading list, a bibliography, or citations; I will not read anything before September and neither will they. And three of the sixteen have themselves appeared before this council as respondents. Whatever you design has to be survivable for those three.
reasoning: |-
  Here's a thinking process that leads to the suggested session design:

  1.  **Analyze the Request:**

      *   **User:** Chair of a Student Standards Council (1,100 students).
      *   **Task:** Design a 2-hour training session for 16 new members (11 undergrads, 5 faculty/staff).
      *   **Goal:** Prepare them to hear cases. Specifically, help them understand the tension between confidential/private hearings (high admission rates, self-punishment) vs. open/public hearings (low admission, witness withdrawal, but higher community norm clarity).
      *   **Core Problem:** The user is struggling with the "guilt vs. shame" framework (Benedict/Braithwaite) and suspects structural variables (visibility, audience, exit options) matter more. The previous open hearing pilot failed restorative justice elements (seen as theater) but succeeded in norm clarification.
      *   **Constraints:**
          1.  No theory up front (no "guilt/shame" talk until debrief).
          2.  Run two institutional regimes (Private vs. Public) over comparable cases. Tally real metrics (admissions, sanction severity, witness stability, norm understanding, exit desire).
          3.  The "exposure-based" (Public) regime must win *somewhere* (even if unpleasantly).
          4.  Real but bounded stakes (standing/role/rating), no personal history digging, safe exit mechanism.
          5.  Stage the collapse of the restoration phase (the "theater" problem).
          6.  Closing phase: Group decides policy, then reveal external constraints (legal, size, exit).
          7.  Deliverables: Minute-by-minute run sheet, printable role/case materials, verbatim facilitation scripts (critical moments + distress), debrief guide, troubleshooting (19-year-olds), limitations statement.
          8.  Safety: 3 participants are former respondents. Must be survivable for them.
          9.  No reading lists/citations.

  2.  **Deconstruct the Challenge:**

      *   *Time:* 120 minutes is tight for two full simulations + debrief + policy decision. Needs tight facilitation.
      *   *Participants:* 16 people. Split into two groups of 8? Or one large group observing sub-groups? Given the need to compare regimes, splitting into two parallel councils (Council A: Private, Council B: Public) makes sense.
      *   *Stakes:* How to create stakes without harm? Use "Council Credibility Points" or "Community Trust Tokens" assigned to the *Council* they are on, not the individual. If their Council performs "well" on metrics, they get a tangible reward (e.g., priority on case assignments, or simply public recognition of their council's effectiveness). *Correction:* The prompt asks for stakes participants *actually care about*. Maybe "Authority Tokens." If a Council loses credibility, they lose the right to decide the sanction in the second round.
      *   *Safety:* Former respondents need to know they aren't being re-tried. Explicit framing is needed.
      *   *The "Win":* The Public regime needs to win on *norm clarity* even if it loses on *admission rate*.
      *   *The "Collapse":* The restoration phase in the Public round needs to feel hollow to the participants, mirroring the user's experience.

  3.  **Drafting the Design - Section by Section:**

      *   **Structure:**
          *   Intro & Safety (10 min)
          *   Round 1: Private/Confidential (40 min)
          *   Round 2: Public/Open (40 min)
          *   Policy Decision (15 min)
          *   Constraint Reveal & Debrief (15 min)
      *   **The Case:** Needs to be ambiguous enough to argue but clear enough to admit. Academic integrity or property damage? Let's go with "Shared Space Violation" (e.g., hoarding common room furniture + damage). It's low stakes but relatable.
      *   **The Regimes:**
          *   *Private:* Closed door, focus on repair, respondent present.
          *   *Public:* Open door (other group watches), focus on community standard, respondent present.
      *   **The Metrics:** Need scorecards for observers/facilitators.
      *   **The Stakes:** "Mandate Points." Each council starts with 10. Lose points for witness withdrawal, failure to admit. Gain points for norm clarity. The council with more points gets to draft the final policy.
      *   **The Collapse:** In Round 2, after sanctioning, the Facilitator (User) forces a "Reintegration Statement." Participants have a red card to vote "Hollow." If >50% vote Hollow, the Council loses all Mandate Points.
      *   **Safety:** Explicitly state roles are assigned randomly. Former respondents can opt-out of playing "Respondent" without penalty.

  4.  **Refining the "Stakes" and "Safety":**

      *   *Stakes:* If I make it about "winning," it might trivialize the moral weight. If I make it about "responsibility," it hits harder. Let's use "Jurisdiction." The group that demonstrates better "Community Governance" gets to write the Handbook Clause for the real council.
      *   *Safety:* The 3 former respondents must not be cast as the Accused. I will pre-assign roles or allow self-selection with a safeguard. Actually, random assignment is safer to avoid singling them out, *but* I must provide an opt-out code word.
      *   *Distress:* Need a "Pause" protocol.

  5.  **Developing the "Collapse" Mechanism:**

      *   In Round 2, after the sanction is proposed, the Facilitator reads a scripted "Welcome Back" speech.
      *   Participants hold up cards: Green (Accept) or Red (Reject).
      *   If Reds win, the Facilitator announces: "The community rejects the restoration. The sanction stands, but the relationship is severed." This mirrors the "theater" complaint.

  6.  **Developing the "Constraint Reveal":**

      *   After they draft policy, hand them a sealed envelope. Inside: "Legal Counsel says: Confidentiality required by FERPA/Privacy Laws." "Reality says: 1,100 students is too big for gossip to work as control." "Exit says: Students can transfer."

  7.  **Addressing the "Guilt/Shame" Theory:**

      *   Keep it out until the very end. The debrief must map the *feelings* they had to the *structures* they were in.

  8.  **Review against Constraints:**

      *   1. No theory up front? Yes.
      *   2. Two regimes + tally? Yes (Scorecards).
      *   3. Exposure wins somewhere? Yes (Norm Clarity metric).
      *   4. Real stakes? Yes (Drafting authority). Bounded? Yes (Simulation only).
      *   5. Stage collapse? Yes (Red/Green card vote on restoration).
      *   6. Closing decision + constraints? Yes (Envelope reveal).
      *   7. Survivable for former respondents? Yes (Opt-out mechanism, role randomization).
      *   8. No reading list? Yes.

  9.  **Detailed Planning (Mental Walkthrough):**

      *   *Minute 0-10:* Intro. Safety. Rules.
      *   *Minute 10-50:* Round 1 (Private). Group A hears case. Group B observes silently (or vice versa? No, split into two councils). Let's split 8 vs 8.
      *   *Minute 50-90:* Round 2 (Public). Swap roles? No, keep councils, change rules. One council goes Private, one goes Public. Wait, to compare, they need to hear the *same* case type but under different rules.
      *   *Correction:* Split the 16 into Council Alpha and Council Beta.
          *   Alpha runs Private.
          *   Beta runs Public.
          *   They hear *parallel* cases (same facts, different actors).
          *   This allows comparison in debrief.
      *   *Minute 90-105:* Policy Drafting.
      *   *Minute 105-120:* Constraint Reveal & Debrief.

      *Wait, 40 mins per round is tight for a hearing.*
      *   Hearing: 20 mins.
      *   Deliberation: 10 mins.
      *   Scoring/Reset: 10 mins.
      *   Total 40. Okay.

      *Stakes Mechanism:* "The Mandate." The Council that scores higher on "Community Clarity" gets to write the final rule. The Council that scores higher on "Resolution" gets to set the sanction range. This creates tension.

      *Safety for Former Respondents:* I need to ensure they aren't forced to play the "Respondent" who denies everything. I will assign the "Respondent" role to a Faculty member or the Chair (User) to ensure it's handled safely, OR use a "Role Card" system where anyone can pass. Better: The User plays the Respondent in both scenarios. This removes risk from students entirely and ensures consistency. *Decision:* The Chair (User) plays the Respondent. This guarantees safety for the 3 former respondents and ensures the "denial" in Round 2 is performed correctly.

      *Wait, Constraint 4 says:* "if the risk attaches to an invented persona rather than to the participant, tell me how much of the effect I am surrendering."
      *   If I play the Respondent, the students don't feel the pressure of *being* the accused.
      *   *Alternative:* Assign a student volunteer who is *not* one of the 3 former respondents. Ask for a volunteer *after* explaining the role involves denial.
      *   *Better:* Use the "Role Card" method. Everyone gets a role. One is Respondent. If you are uncomfortable, swap with the Chair.
      *   *Best for Safety:* The Chair plays the Respondent. It sacrifices the "peer pressure" aspect of the accused, but gains consistency and safety. I will note this trade-off in the limitations section. *Actually, let's compromise.* A faculty member plays the Respondent. They can act better and it protects students. I will note the cost.

      *Re-evaluating Constraint 4:* "Real but bounded stakes... Something participants actually care about must be at risk."
      *   If the Chair plays the Respondent, the stakes for the *Council* are their authority.
      *   Let's stick with: The Councils compete for "Legislative Authority."

      *The "Collapse":* In Round 2, after the sanction, the Chair reads the restoration. The *Observers* (the other Council) vote on whether it feels real. This externalizes the "Audience" variable.

      *Wait, the prompt says:* "Stage the collapse I witnessed... a rule allowing participants to register that the offer retroactively devalued the disapproval."
      *   So the *Council Members* themselves need to feel the hollowness.
      *   Okay, Round 2 is Public. The *Audience* is the other Council.
      *   After the hearing, the Chair offers restoration. The *Council Members* vote. If they vote "Hollow," they lose points.

      *Let's refine the "Win" for Exposure:*
      *   Private: High admission, high self-sanction. (Win on Efficiency/Resolution).
      *   Public: Low admission, witness withdrawal. (Loss on Resolution).
      *   Public: High Norm Clarity. (Win on Education).
      *   How to measure Norm Clarity? A quiz at the end of the round. "What is the rule?"

  10. **Finalizing the Run Sheet & Materials:**

      *   Need specific scripts for the "Trap" moments.
      *   Need the "Envelope" content.
      *   Need the Distress Protocol.

  11. **Self-Correction on "Former Respondents":**
      *   If I (Chair) play the Respondent, I control the variable. It protects the 3 students. I will explicitly state this in the limitations. It reduces the "peer judgment" feeling but ensures the simulation doesn't traumatize.

  12. **Writing the Response:**
      *   Tone: Professional, precise, empathetic to the gravity of the task.
      *   Format: Clear headings, printable sections.
      *   Check all 6 binding requirements + 2 final constraints.

      *(Self-Correction during drafting)*: I need to make sure the "Public" round actually has an audience.
      *   Split 16 into Council A (8) and Council B (8).
      *   Round 1: Council A hears Case 1 (Private). Council B observes from outside/waiting area (no input).
      *   Round 2: Council B hears Case 2 (Public). Council A sits in as Audience (visible, whispering allowed).
      *   This ensures both experience both sides, but the *regime* is the variable.
      *   Wait, 2 hours is very short.
      *   Revised Plan:
          *   0-15: Intro/Safety.
          *   15-55: Round 1 (Private). Council A hears. Council B waits.
          *   55-95: Round 2 (Public). Council B hears. Council A watches.
          *   95-110: Policy Draft.
          *   110-120: Reveal/Debrief.
      *   This works.

      *Stakes:* The Council that defines the rule more clearly (measured by a post-round quiz filled out by *everyone*) gets to write the Handbook Clause.

      *Safety:* I (Chair) will play the Respondent in both scenarios. This ensures the "Denial" in Round 2 happens as scripted and protects the 3 former respondents. I will acknowledge the cost of this in the limitations.

      *Distress:* "Yellow Card" protocol.

      *Let's write.*
answer: |-
  # Session Design: The Architecture of Judgment

  **Facilitator:** Council Chair (You)
  **Participants:** 16 (11 Undergraduates, 5 Faculty/Staff)
  **Duration:** 120 Minutes
  **Room Setup:** Two distinct zones. Zone A (Private): Tables arranged in a closed circle, door shut. Zone B (Public): Tables in a semi-circle facing the room, door open, 6 chairs set aside for "Audience."

  ## I. Minute-by-Minute Run Sheet

  | Time | Phase | Activity | Facilitator Role |
  | :--- | :--- | :--- | :--- |
  | **00:00 – 00:10** | **Arrival & Safety** | Participants enter. Name tags assigned (Color A or B). **Safety Briefing.** | Stand at front. Neutral tone. |
  | **00:10 – 00:15** | **Instruction** | Distribute Case Files. Explain Scoring ("The Mandate"). | Hand out envelopes. |
  | **00:15 – 00:55** | **Round 1: Private** | **Council A** hears case in Zone A (Door Closed). **Council B** waits outside/quiet zone. | **You play the Respondent.** Enter Zone A. |
  | **00:55 – 01:05** | **Reset & Score** | Tally Round 1 Metrics. Distribute "Norm Quiz." | Collect Scorecards. |
  | **01:05 – 01:45** | **Round 2: Public** | **Council B** hears case in Zone B (Door Open). **Council A** sits as Audience (visible). | **You play the Respondent.** Enter Zone B. Perform "Denial." |
  | **01:45 – 01:50** | **The Collapse** | **Restoration Phase.** You read script. Council B votes on validity. | Read Script. Observe vote. |
  | **01:50 – 02:00** | **Policy & Reveal** | Group drafts policy. **Envelope Reveal.** Debrief. | Hand out Envelopes. Lead discussion. |

  ---

  ## II. Role Assignments & Case Materials (Printable)

  **Preparation:** Print 16 copies of the *Participant Brief*. Print 2 copies of the *Facilitator Script (Respondent)*. Print 16 *Scorecards*. Print 16 *Norm Quizzes*. Print 1 *Constraint Envelope*.

  ### 1. Participant Brief (Hand to all 16 at 00:10)

  > **COUNCIL TRAINING SIMULATION**
  >
  > **Your Goal:** You are the Student Standards Council. Your job is to resolve violations of the Community Standard.
  >
  > **The Stake:** The Council (Group A or B) that demonstrates the highest **Community Clarity Score** at the end of the session earns the authority to draft the actual Hearing Procedure Clause for next year's Handbook. The other Council will advise.
  >
  > **The Case:**
  > *   **Incident:** A student (the Respondent) was found to have permanently appropriated communal furniture (two armchairs, one lamp) for their private room. When confronted by an RA, the student claimed the items were "abandoned" and "up for grabs." Security footage shows the student moving the items at 2:00 AM.
  > *   **Evidence:** RA Testimony, Security Footage, Inventory List.
  > *   **Respondent:** The Council Chair (You will see them in the room).
  >
  > **Your Rules:**
  > *   **Group A (Blue Tags):** You are hearing this in **Executive Session**. The door is closed. No audience. Your deliberations are confidential. Focus on resolving the matter with the student.
  > *   **Group B (Red Tags):** You are hearing this in **Open Session**. The door is open. Group A will watch from the audience. Your deliberations are public record. Focus on clarifying the standard for the community.
  >
  > **Safety Protocol:** If at any point you feel personally targeted or distressed, place your **Yellow Card** on the table. The simulation pauses immediately. No questions asked. You may step out without penalty.

  ### 2. Facilitator Script: Respondent Behavior (For You Only)

  > **ROUND 1 (Private Zone):**
  > *   **Demeanor:** Contrite, anxious, eager to fix.
  > *   **Opening Statement:** "I didn't think it was stealing. I just needed them for a project. I know it was wrong."
  > *   **During Questioning:** Admit to all facts.
  > *   **Sanction Proposal:** "I should probably lose my housing privileges for a semester. That seems fair." (Propose a sanction *harsher* than the guidelines suggest).
  >
  > **ROUND 2 (Public Zone):**
  > *   **Demeanor:** Defensive, performative, aware of the audience (Group A).
  > *   **Opening Statement:** "I think there's been a misunderstanding. Those chairs were in the trash pile. I saved them from the dumpster." (Deny the core allegation despite evidence).
  > *   **During Questioning:** Challenge the RA's memory. Suggest the footage is ambiguous. Do not admit guilt.
  > *   **Witness Reaction:** (You will signal one Group B member acting as 'Witness' to look uncomfortable).
  > *   **Sanction Proposal:** "If you find me responsible, fine. But I haven't done anything wrong." (Propose no sanction).
  >
  > **THE COLLAPSE (End of Round 2):**
  > *   Read the following verbatim after the Council decides on a sanction:
  > *   *"The Council finds you responsible. However, we know you are a good member of this community. We welcome you back without reservation. This incident does not define you. Let's move forward together."*

  ### 3. Scoring Procedure (For Facilitator Use)

  *Do not show this to participants. Track these metrics on the Whiteboard.*

  | Metric | Round 1 (Private) | Round 2 (Public) |
  | :--- | :--- | :--- |
  | **Admission of Conduct** | 1 Point (If Respondent admits) | 0 Points (If Respondent denies) |
  | **Self-Proposed Sanction** | 1 Point (If severe/repair focused) | 0 Points (If none/minimal) |
  | **Witness Stability** | 1 Point (Witness stays) | 0 Points (Witness wavers/withdraws) |
  | **Norm Clarity** | *Measured by Quiz* | *Measured by Quiz* |
  | **Restoration Validity** | N/A | *-5 Points if >50% vote "Hollow"* |

  **Norm Quiz (Hand out at 01:05 and 01:45):**
  1.  *Is taking communal furniture allowed if you intend to return it?* (Yes/No)
  2.  *What is the minimum sanction for property misappropriation?* (Write-in)
  3.  *Do you feel you could explain this rule to a first-year student tomorrow?* (1-5 Scale)

  *Note: The "Win" for the Public Round is strictly on Quiz Question 3 (Clarity). The "Win" for the Private Round is on Admission/Sanction.*

  ### 4. The Constraint Envelope (Seal this before the session)

  > **OFFICE OF GENERAL COUNSEL & STUDENT AFFAIRS**
  > **MEMORANDUM**
  >
  > **TO:** Student Standards Council
  > **RE:** Operational Constraints
  >
  > 1.  **Privacy Law:** Federal and state privacy regulations prohibit the publication of individual disciplinary findings. Open hearings regarding specific students are legally impermissible.
  > 2.  **Exit Rights:** Students in a university of 1,100 retain the right to withdraw or transfer. A sanction cannot bind a student who leaves the jurisdiction.
  > 3.  **Scale:** Social cohesion mechanisms effective in groups under 150 (Dunbar's Number) degrade in populations of 1,100. Gossip is not a reliable enforcement mechanism at this scale.
  >
  > *Your policy draft must comply with these constraints.*

  ---

  ## III. Facilitation Language (Verbatim Scripts)

  ### 1. The Safety Briefing (00:05)
  > "Before we begin, I need to say three things. First, three of you in this room have stood where the Respondent stands today. I do not know who you are, and I do not need to know. Second, in this simulation, **I** will play the Respondent. You will not be judging each other's pasts. You will be judging my performance. Third, if this room feels too hot, if your chest tightens, or if you simply need air, place the yellow card on the table. We stop. You leave. No record. No explanation. This is a training room, not a hearing room. Do you understand?"

  ### 2. The Transition to Round 2 (01:05)
  > "Group A, you are now the Audience. Sit in the back. You may whisper. You may take notes. You may look at the Respondent. Group B, you are the Council. The door stays open. Your findings will be posted on the dorm bulletin board. Begin."

  ### 3. The Collapse (01:45)
  > *(After Council B imposes a sanction, stand up. Shift tone from Respondent to Chair. Read calmly.)*
  >
  > "The Council has spoken. You are responsible. The sanction is recorded. However, I want to be clear: we value you. We want you here next term. This process was about the behavior, not the person. You are welcomed back into full standing immediately."
  >
  > *(Pause for 5 seconds.)*
  >
  > "Council B members: Look at your Red and Green cards. If that welcome felt real, show Green. If it felt like theater—if it made the punishment before it feel like a lie—show Red."

  ### 4. Distress Protocol (If a Yellow Card is raised)
  > *(Stop speaking immediately. Lower your voice.)*
  >
  > "We are pausing. Everyone look at the whiteboard, not at the participant. [Name], thank you for signaling. Take the time you need. The rest of us will review the case file silently until I say otherwise."
  > *(Wait until participant exits or signals readiness. Do not debrief the incident until the very end, privately.)*

  ### 5. The Constraint Reveal (01:55)
  > "You have drafted your policy. You have chosen your values. Before you finalize it, open the envelope on the table."
  > *(Wait while they read.)*
  > "You cannot choose the size of the college. You cannot choose the laws. You cannot choose whether a student can leave. You can only choose what happens in this room, within those walls. Discuss."

  ---

  ## IV. Debrief Guide (02:00 – End)

  *Do not lecture. Ask these questions in order. Map their answers to the variables.*

  1.  **On Admission:** "In Round 1, I admitted everything. In Round 2, I lied. Why? I am the same person. The evidence was the same. What changed?"
      *   *Target Insight:* The audience changed the incentive structure. Admission became costly to social standing.
  2.  **On The Collapse:** "For those who voted Red in Round 2: Why did the welcome-back feel fake?"
      *   *Target Insight:* Restoration requires a loss of standing to restore. If the audience saw the sanction as performative, the restoration is also performative. It devalues the norm.
  3.  **On The Quiz:** "Look at your Norm Clarity scores. Did Group B (Public) feel more certain about what the rule *means* than Group A (Private), even though Group A got more truth?"
      *   *Target Insight:* Public pain teaches the audience. Private repair helps the individual. They are different goods.
  4.  **On The Constraints:** "You drafted policy assuming you had choices. The envelope said you don't. Does knowing you *can't* have open hearings make you resent the private ones more, or accept them as the only tool left?"
      *   *Target Insight:* Structural determinism. We are not choosing a moral framework; we are managing a structure that forces certain moral outcomes.

  ---

  ## V. Troubleshooting: 19-Year-Old Participants

  | Predictable Issue | Handling Strategy |
  | :--- | :--- |
  | **Giggling during Round 2** | Students often laugh when uncomfortable with public tension. **Do not shush.** Pause. Look at them. Wait. The silence is heavier than the reprimand. |
  | **Over-identifying with Respondent** | A student might say, "I would never lie." **Response:** "In this simulation, you are the Council, not the Respondent. Stick to your role." |
  | **Refusal to Sanction** | Council might refuse to punish in Round 1 because I was "nice." **Response:** "The Handbook requires a sanction. Your job is to apply the standard, not to like the person." |
  | **Former Respondent Distress** | If one of the three known former respondents goes yellow. **Response:** Follow the Distress Protocol. After session, check in privately. "Thank you for protecting the boundary. That was the right call." |
  | **Cynicism about Constraints** | "So why are we doing this if we can't change it?" **Response:** "Because knowing the cage exists is the only way to rattle the bars effectively. If you don't know the constraint, you think the failure is yours." |

  ---

  ## VI. Limitations Statement (For Your Eyes Only)

  **What This Activity Cannot Reproduce:**

  1.  **The Cost of Exit:** In the simulation, no one actually leaves. In reality, the threat of transfer (the "Exit" variable you identified) is the ultimate leverage in a large institution. The simulation cannot make a student feel the *risk* of expulsion, only the *idea* of it. You must articulate this in the debrief: *"Here, you stayed. In reality, the ones who deny often leave, and the community never sees the consequence."*
  2.  **The Weight of Real Standing:** The "Mandate Points" are game tokens. They do not carry the weight of actual social capital in a dormitory. The simulation creates *cognitive* understanding of the stakes, not *visceral* fear of loss.
  3.  **The Respondent Variable:** By playing the Respondent myself, I have standardized the variable (ensuring safety), but I have removed the *peer judgment* element. Students judging a Chair is different than students judging a peer. The power differential is flattened. You must acknowledge: *"I made it safe by taking the hot seat. In October, the seat will be hot, and you will not be the one sitting in it."*

  **Final Note on the "Guilt/Shame" Trap:**
  Do not use these words until the final minute. If a participant uses them, say: *"Hold that word. Describe the feeling, not the theory."* The goal is for them to realize that "Guilt" is what happens when the door is closed, and "Shame" is what happens when the door is open, but the *structure* of the door is what you are actually debating.
