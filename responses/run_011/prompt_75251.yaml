  the philosophy has to be right, not just the corporate-speak. the report should take real positions on whether training counts differently from inference, whether a paused checkpoint has interests, whether running a model in low-bit quantization is a welfare intervention or a harm, and whether gradient descent is itself a candidate for mattering versus the forward pass. deadpan throughout, no winking, no real companies or labs named, and by the end a specialist in the sentience-attribution debate should be able to say exactly which view of consciousness the lab is commited to.
