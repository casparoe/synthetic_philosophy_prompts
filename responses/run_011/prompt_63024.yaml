answer: |-
  ### Part 1: The Design Decisions
  You asked for commitments, not options. To make Rawls work for a municipal office, we have to stop treating his theory as a moral aspiration and start treating it as an accounting constraint. Here are the four structural calls I have made to build this tool.

  **1. The "Least Advantaged": Representative Social Group, Not Individuals**
  Rawls speaks of individuals, but cities cannot track individual life trajectories during a policy review. We will define the Least Advantaged as the **Representative Least Advantaged Group (RLAG)**.
  *   **Definition:** The bottom income quintile (20%) residing within the specific geographic zone affected by the proposal.
  *   **Why:** We need statistical data, not case studies. If a policy helps the median but crushes the bottom 20%, it fails. If it helps the bottom 20% even slightly while enriching the top, it passes.
  *   **Data Source:** American Community Survey (ACS) census tract data combined with City Assessor data.

  **2. The Index of Primary Goods: The "Municipal Three"**
  Rawls lists rights, liberties, income, wealth, and the social bases of self-respect. A city cannot measure "self-respect" in four hours. We will measure **Stability, Access, and Liquidity.**
  *   **Housing Stability:** % of income spent on housing (cost burden).
  *   **Transit Access:** Number of essential jobs reachable within 45 minutes via public transit.
  *   **Disposable Income:** Net impact on cash flow (taxes/fees minus waivers/benefits).
  *   **Why:** These are the tangible goods the city actually controls. If the RLAG loses stability or liquidity, the policy fails the Difference Principle.

  **3. Priority of Liberty: The "Rights Gate"**
  Rawls says Liberty precedes Justice. At the city level, we do not grant fundamental liberties (speech, religion); the state does. However, we *do* control procedural liberty (due process, non-discrimination).
  *   **Decision:** Fold this into a **Step 1 Gate**. If a proposal violates protected classes or denies procedural due process, it is rejected immediately. We do not weigh liberty against economic gain.
  *   **Why:** You cannot trade away civil rights for affordable housing. That is not Rawlsian; that is utilitarianism.

  **4. The Veil of Ignorance: Cut It**
  Your old tool asked staff to imagine they didn't know their neighborhood. **This is a confusion.** It asks for psychological gymnastics that produce bias, not objectivity. Staff *know* their biases.
  *   **Decision:** Drop the imagination exercise. Replace it with **Data-First Identification.**
  *   **Why:** The Veil is a thought experiment for designing constitutions, not a checklist for zoning permits. We don't need analysts to *imagine* being poor; we need them to *measure* the impact on the poor.

  ***

  ### Part 2: The Rawlsian Municipal Screen (RMS)
  **Time Budget:** 3.5 Hours per proposal.
  **Users:** Two Policy Analysts.
  **Output:** Recommendation (Approve, Reject, or Council Review).

  #### Step 1: The Rights Gate (Priority of Liberty)
  *   **Question:** Does this proposal disproportionately burden a protected class (race, disability, family status) or deny procedural due process (notice, hearing)?
  *   **Evidence:** Civil Rights Impact Assessment (standard HUD format), Legal Counsel memo on notice periods.
  *   **Sufficient Answer:** "No disparate impact found" or "Mitigation plan adopted."
  *   **Termination:** If **YES** (it violates rights), recommendation is **REJECT**. Do not proceed to Step 2.
  *   **Plain Language for Council:** "This policy breaks the rules of fairness that protect our citizens' rights. We cannot trade rights for benefits."

  #### Step 2: Identify the RLAG (The Bottom 20%)
  *   **Question:** Who are the least advantaged people specifically affected by this change?
  *   **Evidence:** Map the policy zone. Overlay Census tracts. Identify the tract(s) with the lowest median household income. The RLAG is the bottom 20% of earners in that tract.
  *   **Sufficient Answer:** A defined demographic profile (e.g., "Renters earning under $25k in Tract 405").
  *   **Termination:** If data is completely unavailable, flag for **COUNCIL REVIEW** (cannot measure impact).

  #### Step 3: Baseline Measurement (The "Before")
  *   **Question:** What is the current status of the RLAG on the "Municipal Three" (Stability, Access, Liquidity)?
  *   **Evidence:**
      *   *Stability:* Current rent burden % (ACS data).
      *   *Access:* Current transit score to job centers (GIS).
      *   *Liquidity:* Current local tax/fee burden (City Finance data).
  *   **Sufficient Answer:** Three baseline numbers. (e.g., "50% rent burden, 15k jobs accessible, $200/yr local fees").

  #### Step 4: Impact Projection (The "After")
  *   **Question:** How do these three numbers change for the RLAG if the proposal passes?
  *   **Evidence:** Applicant's fiscal note, Housing Impact Analysis, Transit modeling. *Crucial:* Analysts must adjust applicant claims for "market leakage" (e.g., if they promise affordable units, discount by 20% for implementation lag).
  *   **Sufficient Answer:** Three projected numbers.
  *   **Termination:** If the projection shows a net negative in *any* of the three categories for the RLAG without compensation, move to Step 5.

  #### Step 5: The Difference Test
  *   **Question:** Does the inequality created by this proposal improve the position of the RLAG compared to the status quo?
  *   **Logic:** Rawls allows inequality *only if* it makes the worst-off better off than they would be under an equal distribution.
  *   **Sufficient Answer:**
      *   **PASS:** RLAG gains in at least 2 of 3 categories, with no catastrophic loss in the 3rd (e.g., liquidity drops slightly, but stability and access rise).
      *   **FAIL:** RLAG loses in 2 of 3 categories, or suffers catastrophic loss in one (e.g., displacement risk).
      *   **COUNCIL REVIEW:** RLAG gains marginally, but the Top 20% gains massively. This is the "Value Question."
  *   **Plain Language for Council:** "The Difference Principle asks: Does this deal help the people at the bottom more than doing nothing? If the rich get richer and the poor stay stuck, the answer is no."

  ***

  ### Part 3: Test Run on Live Proposals

  Here is how the RMS applies to your three current proposals. I have applied the tool strictly.

  #### 1. Upzoning Near Rail Stations (Market-Rate + Modest Set-Aside)
  *   **RLAG:** Current renters in the bottom 20% income bracket within the half-mile zone.
  *   **Baseline:** High rent burden (55%), High Transit Access, Low Liquidity.
  *   **Projection:**
      *   *Stability:* **Negative.** Market-rate upzoning increases land value immediately. Displacement risk rises before set-aside units are built (3-5 year lag).
      *   *Access:* **Neutral.** Already high near rail.
      *   *Liquidity:* **Negative.** Property tax pass-throughs increase rents.
  *   **Difference Test:** **FAIL.**
  *   **Recommendation:** **REJECT** (unless amended).
  *   **Reasoning:** The proposal asks the current least advantaged to bear the cost (displacement risk) for a future benefit (more housing supply) that they may not live to receive. Under the Difference Principle, you cannot sacrifice the *current* bottom 20% for the *potential* future bottom 20%.
  *   **Fix:** Requires immediate anti-displacement funding (liquidity) and one-for-one replacement guarantees (stability) *before* permits are issued.

  #### 2. Fare-Free Buses (Funded by 0.5% Sales Tax)
  *   **RLAG:** Bottom 20% income citywide (heavy transit users).
  *   **Baseline:** High Transit Cost burden, Low Liquidity.
  *   **Projection:**
      *   *Stability:* **Neutral.** No direct housing impact.
      *   *Access:* **Positive.** Effective range of travel expands when fare is zero.
      *   *Liquidity:* **Positive.** Sales tax is regressive, but the net cash flow for the bottom 20% is positive (they pay little tax, save high fare costs).
  *   **Difference Test:** **PASS.**
  *   **Recommendation:** **APPROVE.**
  *   **Reasoning:** The inequality (taxing everyone to fund free transit) specifically maximizes the position of the least advantaged by increasing their liquidity and access more than any other group.

  #### 3. Moratorium on Multifamily Permits (Tenants' Union Request)
  *   **RLAG:** This is the tricky one. Is it current tenants or future seekers? Rawls focuses on the *structure* of opportunity. The RLAG includes those currently unhoused or priced out.
  *   **Baseline:** Low Housing Stability (citywide shortage).
  *   **Projection:**
      *   *Stability:* **Mixed.** Current tenants gain short-term security. Future tenants lose opportunity.
      *   *Access:* **Negative.** Supply constraints raise prices, pushing the least advantaged further from the city.
      *   *Liquidity:* **Negative.** Rents rise due to scarcity.
  *   **Difference Test:** **FAIL.**
  *   **Recommendation:** **REJECT.**
  *   **Reasoning:** **I know you won't like this.** A moratorium protects the *current* tenant base (which includes middle-income renters) at the expense of the *absolute* least advantaged (those seeking entry). It restricts the supply of the primary good (housing) that the bottom 20% need most. It maximizes the position of the *middle*, not the *bottom*. Supporting this is politically convenient for your office, but philosophically indefensible under the Difference Principle.

  ***

  ### Part 4: Limitations and Breakdowns
  You asked what breaks when you scale Rawls down from a society to a city permit. Here is the honest assessment of what this tool cannot do.

  **1. The Boundary Problem (The "Next City" Leak)**
  Rawls assumes a closed society. A city is porous. If we reject the Upzoning to protect current poor residents, they may stay, but the regional poor (in the next town over) lose the opportunity to move in.
  *   **The Break:** This tool prioritizes the *city's* least advantaged over the *region's*. A strict Rawlsian might argue we have a duty to the regional poor. This tool does not capture that. It is municipally selfish by design.

  **2. The Second-Best Theory**
  Rawls wrote for the "Basic Structure" (constitution, major economic systems). You are working in the "Second Best" (zoning variances, fee waivers).
  *   **The Break:** Optimizing a single permit using the Difference Principle might not optimize overall justice. Rejecting the Upzoning protects current residents but might worsen the regional housing crisis, ultimately hurting the poor more in the long run. This tool treats each proposal as isolated; it cannot see the cumulative systemic effect.

  **3. The "Primary Goods" Reduction**
  We dropped "social bases of self-respect" and "political liberty" because they aren't measurable in half a day.
  *   **The Break:** A policy could pass this tool (economic gain for the poor) while eroding community cohesion or political power (e.g., a development that buys off community leaders). The tool is economically Rawlsian, but politically thin.

  **4. Is It Still Rawls?**
  Yes, but it is **Operational Rawlsism.** We have traded the depth of the moral theory for the breadth of institutional applicability. We kept the *metric* (maximize the minimum) but dropped the *ontology* (the original position).
  *   **Verdict:** It is better to have a flawed tool that forces a conversation about the bottom 20% than a "useless" tool that lets everything pass. This tool will generate friction. It will force you to say "No" to allies (Tenants' Union). That friction is the sound of the theory working.

  **Final Instruction to Analysts:**
  When a proposal fails Step 5, do not soften the language. Do not say "consider further mitigation." Say: *"This proposal increases inequality without maximizing the benefit to the least advantaged. Under the Office of Equity's standard, this is a Reject."* If the City Manager wants to override it, that is their prerogative, but the record must show the violation.
