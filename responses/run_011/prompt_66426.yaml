  3.  **Analyze Failure Points & Pressures (Task 2):**
      *   *Pressure 1: Endpoints (Relative vs. Absolute).* Thermometer assumes absolute zero and fixed intervals. Ladder uses "imagined best/worst." This breaks inter-personal comparability. *Threatens Conclusion 1 (Comparison).*
      *   *Pressure 2: Reactivity (Measurement Effect).* Thermometer doesn't change temp. Asking the question might prime certain thoughts or change the evaluation. *Threatens validity of the reading.*
      *   *Pressure 3: Aggregation.* Temperature can be averaged meaningfully in a volume of air. Averaging subjective scores involves weighting/composition choices. *Threatens the "Headline Indicator" status.*
      *   *Pressure 4: Terminology (Happiness vs. Evaluation).* Thermometer measures heat. Ladder measures "life evaluation," public hears "happiness." Mismatch leads to wrong interventions. *Threatens Conclusion 2 (Policy Target).*
      *   *Pressure 5: Explanatory Variables.* World Happiness Report explains scores via GDP, support, etc. If the score is just a function of these, why target the score? Thermometer reading *is* the state, not a function of other states. *Threatens Conclusion 2 (Targeting).*

  4.  **Analyze Imports and Hiding (Task 3):**
      *   *Thermometer Imports:* Objectivity, universality, direct causality (heat -> expansion), precision.
      *   *Thermometer Hides:* Interpretation, cultural scaling, adaptive preferences, multidimensionality.
      *   *Pain Score Imports:* Subjectivity, clinical context, focus on relief rather than maximization, non-comparability.
      *   *Pain Score Hides:* The fact that national policy *does* differ from clinical care, the potential for some level of comparability (anchoring vignettes), the political necessity of metrics.

  5.  **Evaluate Conclusions (Task 4):**
      *   *Thermometer:* Supports both conclusions strongly *if* the analogy holds. But it fails on comparability (Conclusion 1) and targeting the score itself (Conclusion 2).
