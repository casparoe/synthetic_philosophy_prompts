answer: |-
  I take the second horn, but I must reject the implication that the reality of the harm depends on our external records rather than the event itself. We need to distinguish between the *occurrence* of an event and the *persistability* of its resulting state. The griefing was a real event because it involved a genuine causal interaction between digital objects—the griefer's avatar exercised causal power over the house's data structure, altering its state from 'standing' to 'burned.' That alteration happened. The rollback is not a time machine that erases the past; it is a new administrative event that overwrites the current state with a previous one. The harm was real during those six days because the player's agency within the causal structure of the world was genuinely obstructed. That obstruction occurred, regardless of whether we later patched the hole in the wall. The harm is not undone because the loss of time and the experience of violation are irreversible facts, even if the digital substrate is reset.

  Regarding the identity of the house: I argue it is numerically the same house, provided we distinguish between 'substrate identity' (the specific bits on the disk at time *t*) and 'functional identity' (the continuous role an object plays in the world's causal network). If we required strict substrate identity, no virtual object would survive a server reboot, let alone a rollback, because RAM clears and rows shift across pages. The restored house is the same house because it is the same functional entity restored to its prior causal niche within the simulation. The snapshot is merely the mechanism of restoration, not the creation of a duplicate. To claim it is a duplicate is to misunderstand the metaphysics of digital objects, which are defined by their relational properties and access conditions, not their magnetic orientation on a platter.

  So, the harm stands because the interruption of experience was real, and the object persists because its identity is functional. The logs outside the world are evidence of the event, but they do not constitute the event. The event was constituted by the interaction within the simulation. You worry that relying on backups makes the reality dependent on us. I say it depends on the *capacity* for restoration, which is a property of the world's infrastructure. A world that can be broken and fixed is still a real world; indeed, its fragility and repairability are part of its ontology. The player lost six days of engagement—that is the irreducible harm, and no rollback refunds time.

  [The claim that virtual objects are real digital objects is a mainstream position in contemporary philosophy of technology (e.g., Chalmers, 2017), though still contested by fictionalists; the specific metaphysics of database rollbacks and numerical identity via functional continuity is a novel application and somewhat contested even among realists.]
