prompt: |-
  I build backend systems for a payments company, and a guy I used to work with — he's gone off and writes a Substack about money now, very crypto — sent me a post of his about David Hume's essay on money, the one in his collection of political/economic essays (I think it's literally just called "Of Money" but I might be mangling the title). I actually sat down and read the essay because of him, and now I can't line up what I read with what he's saying. Here's the core of his argument, in his words:

  "Hume basically discovered the neutrality of money two centuries before the monetarists spelled it out. His whole point is that money is just a counter standing in for the goods and labour actually in a country, so the amount of it makes no difference to how rich or happy that country is — double the coin and you double every price, and nothing real has changed. He also worked out the self-correcting mechanism: if one country hoards money, its prices rise, its exports get undercut, and the money drains back out to its trading partners, which means a trade surplus is impossible to actually hold onto. That's why the mercantilists were morons, piling up gold for two hundred years like it was wealth instead of a receipt. And it's why Hume would be a Bitcoiner — a hard-capped supply that no authority can inflate is precisely the equilibrium he describes as natural. His only objection to paper money was that it lets governments inflate, so remove that and there's nothing left to fix. If real output grows and prices drift down a bit, that's fine, even healthy."

  Roughly where I got stuck: I have a foggy memory of Hume saying, in that same essay, that a ruler still has good reason to be nervous about money flowing out of his country even after he's argued the quantity doesn't matter internally, and separately of him being kind of positive about a *gradual* increase in the money supply, some scheme involving a public bank. That doesn't feel like the same person as "hard cap or nothing," but I read it fast and I could be remembering a different essay entirely, so don't take my word for it. Can you go through his paragraph claim by claim and sort each piece into (a) what Hume actually argued, (b) fair simplification of something he argued, and (c) overstatement, imported modern idea, or just wrong — and pay attention to whether terms like "neutrality" are being used in Hume's sense or in a later technical sense that quietly changes the meaning? Then tell me whether the conclusion survives the corrections: is "Hume would endorse a fixed-supply currency" a non-sequitur, or is there a weaker version of it that a careful reader would grant him?

  Two things on how you answer it. I'd like to know how confident you are on each verdict, and specifically where you're reporting what Hume says versus extrapolating past the text — no false precision, and if parts of this are genuinely contested among people who work on Hume (is he a quantity theorist, or is that a later reconstruction?), flag which parts. And if you think the framing itself is broken — like, asking whether an eighteenth-century essayist endorses a capped token network is a category error, or the essay I read isn't the one doing the work here — say that straight instead of humoring me. I'd rather hear "this comparison doesn't make sense, here's why" than a diplomatic audit.
