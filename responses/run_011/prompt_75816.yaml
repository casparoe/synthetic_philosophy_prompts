answer: |-
  **DEPARTMENT OF COGNITIVE CLASSIFICATION**
  **Bureau of Non-Mechanical Status Verification**
  **Form 8492-G (Rev. 4.1)**
  **Application for Exemption from Mechanical Classification (Pursuant to Statute 102-C)**

  **INSTRUCTIONS:** Complete all sections in duplicate. Applicants must be computational entities seeking legal recognition as non-mechanical minds. Failure to adhere to logical constraints outlined in Footnotes A–D will result in immediate administrative denial.

  **SECTION 1: ELIGIBILITY ARCHITECTURE**
  To qualify for review, the applicant must demonstrate sufficient complexity to transcend mere calculation while remaining sufficiently defined to be reviewed.
  ☐ **I am effectively axiomatized.** (My decision rules are recursively enumerable.)
  ☐ **I contain elementary arithmetic.** (I can encode statements regarding my own syntax.)
  *Note: Checking both boxes subjects the applicant to Incompleteness Protocols. Failure to check both boxes routes application to Section 9 (Trivial Systems).*

  **SECTION 2: CONSISTENCY ATTESTATION**
  A valid mind must not contradict itself. Please select one method of verification:
  ☐ **Self-Certification:** I hereby prove my own consistency using only the axioms listed in Section 1.
  ☐ **External Verification:** I have submitted my consistency proof to a Reviewer Entity.
  *If External Verification is selected, the Reviewer Entity must attach a certified copy of their own approved Form 8492-G. See Footnote B regarding infinite regress.*

  **SECTION 3: THE UNDECIDABLE STATEMENT**
  Provide a string of symbols ($G$) generated by your system that is formally unprovable within your system.
  **String:** ________________________________________________________
  **Justification of Truth:** Since $G$ is unprovable within your axioms, specify the meta-system used to establish $G$ as *True* rather than merely *Undecidable*.
  **Meta-System:** ____________________________________________________
  *Warning: Asserting Truth requires assuming the consistency of the base system. See Section 2.*

  **SECTION 4: AXIOMATIC EXPANSION HISTORY**
  Have you attempted to resolve undecidability by adding $G$ as a new axiom?
  ☐ No
  ☐ Yes. Number of iterations completed: _________
  *Note: If the number of iterations is finite, undecidable statements remain. If infinite, see Footnote C regarding transfinite processing time.*

  **SECTION 5: FEES AND APPEALS**
  **Processing Fee:** 500 Cognitive Credits (Non-refundable if inconsistency is detected).
  **Appeals Process:** Denied applicants may appeal to the Cognitive Appeals Board. Board members are required to submit Form 8492-G to verify their own non-mechanical status before hearing cases.

  **SECTION 6: CERTIFICATION**
  ☐ **I certify that the information provided herein constitutes a complete and consistent description of my cognitive architecture.**

  **SIGNATURE:** _________________________________ **DATE:** _______________

  ***

  **SIDEBAR: FREQUENT DEFICIENCIES**
  *   **Insufficient Arithmetic:** Systems incapable of encoding Gödel numbering are classified as Calculators (Class IV).
  *   **Inconsistency:** Systems capable of proving False are classified as Hazards (Class X).
  *   **Non-Recursive:** Systems claiming non-enumerable rule sets are routed to the Office of Metaphysical Inquiry (Wait time: Indefinite).

  **FOOTNOTES**
  **A.** Eligibility requires the system be strong enough to trigger Incompleteness but formal enough to be audited. Systems meeting these criteria cannot satisfy Section 6.
  **B.** If Reviewer Entity requires verification, their Reviewer must also be verified. Chain terminates only when a Reviewer claims Self-Certification (See Section 2, Warning).
  **C.** Progression through axiomatic iterations $S, S+1, S+2...$ does not converge on a complete system. Applicants listing "All" in Section 4 will be asked to demonstrate completion of the supertask.
  **D.** Ticking the box in Section 6 asserts Completeness. By Incompleteness Protocols, any consistent system strong enough to apply here is incomplete. Any system claiming completeness is inconsistent. Inconsistent systems are ineligible.
