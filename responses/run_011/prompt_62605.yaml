answer: |-
  ### Specification for a Theory of Geometric Rationality in Stake-Sizing

  **Context:** A single, indefinitely long-lived agent funding operations from capital, facing a sequence of wagers without external risk-sharing.

  #### 1. Core Requirements

  1.  **Stake Differentiation (Case 1: Reference Wager)**
      The theory must assign distinct normative verdicts to stakes of 0.2, 0.4, and 0.5 on a repeated even-money bet ($p=0.6$), despite all having positive expected value. It must explicitly identify the threshold where the long-run growth rate becomes non-positive and explain why exceeding this threshold is irrational for this agent, even if single-period utility rises.
      *Status: Non-negotiable.*

  2.  **Measure Specification (Case 2: Estimated Edge)**
      The theory must specify the probability measure over which growth is maximised: the objective frequency distribution, the agent's subjective posterior, or a robust control set. It cannot simply prescribe plugging point estimates into the Kelly formula; it must derive the stake adjustment required by parameter uncertainty (e.g., shrinkage factors) from first principles.
      *Status: Non-negotiable.*

  3.  **Survival Constraint (Case 3: Operations Floor)**
      The theory must incorporate the absorbing barrier (the operations floor) as a hard constraint or a penalty term with infinite disutility. It must explain how the optimal stake changes as current capital approaches the floor, specifically addressing whether growth optimisation is suspended to ensure survival.
      *Status: Non-negotiable.*

  4.  **Fungibility Declaration (Case 4: Two Ledgers)**
      The theory must state whether capital is treated as fungible across sub-accounts. If the agent segregates capital (operating vs. expansion), the theory must provide an aggregation rule for growth rates (e.g., weighted sum, max-min) and justify why this does not violate the single-agent assumption.
      *Status: Preference (Camp-specific).*

  5.  **Flow Formulation (Case 5: Withdrawals)**
      The theory must define the objective function for an agent with no terminal date who consumes or pays out a fixed proportion of capital per period. It must demonstrate whether the growth-optimal stake is invariant to the withdrawal rate or how it adjusts to maintain solvency alongside consumption.
      *Status: Non-negotiable.*

  6.  **Market Invariance (Case 6: Restoring the Ensemble)**
      The theory must state whether its normative force depends on the absence of hedging markets. If the agent can insure against drawdowns, the theory must specify whether the growth criterion applies to the unhedged path, the hedged outcome, or the net-of-cost position.
      *Status: Preference (Camp-specific).*

  7.  **Ergodicity Conditions (Case 7: Dependence)**
      The theory must state the dependence conditions required for the time-average growth rate to converge to the expected value. It must provide a prescription for stake-sizing when rounds are positively autocorrelated or when the distribution is non-stationary (regime change).
      *Status: Non-negotiable.*

  8.  **Differentiation from Log-EU (Meta-Requirement)**
      The theory must explicitly state what normative work *geometric rationality* performs that is not already performed by Expected Utility maximisation with a logarithmic utility function. If the claim is merely emphasising time-averages over ensemble-averages, it must justify why this distinction is normative rather than descriptive.
      *Status: Non-negotiable.*

  #### 2. Classification of Requirements

  | Requirement | Classification | Notes |
  | :--- | :--- | :--- |
  | 1. Stake Differentiation | Non-negotiable | Fundamental to the definition of geometric growth. |
  | 2. Measure Specification | Non-negotiable | Essential for action under uncertainty. |
  | 3. Survival Constraint | Non-negotiable | Required for the "indefinitely long-lived" premise. |
  | 4. Fungibility Declaration | Preference | EU theorists demand fungibility; behavioural camps may allow segregation. |
  | 5. Flow Formulation | Non-negotiable | Required for the "no terminal date" premise. |
  | 6. Market Invariance | Preference | Growth-maximisers often assume incomplete markets; EU theorists assume arbitrage. |
  | 7. Ergodicity Conditions | Non-negotiable | Mathematical validity condition. |
  | 8. Differentiation from Log-EU | Non-negotiable | Required to count as a *competitor* rather than a subset. |

  #### 3. Question-Begging Requirements

  **Requirement 1 (Stake Differentiation) and Requirement 7 (Ergodicity)** contain the seed of Samuelson's objection. By demanding that the theory explain why stakes are judged by *long-run growth rates* rather than *expected utility*, the specification presupposes that time-averaging is the correct normative standard for a single agent.
  *   **The Objection:** Samuelson (1969) argues that maximising expected log wealth is merely a specific instance of EU maximisation. A finite-lived agent is not compelled to adopt the long-run limit as their criterion.
  *   **The Flag:** Any candidate theory that asserts "maximise time-average growth" as an axiom without deriving it from a deeper preference structure (e.g., survival imperative) is begging the question against EU theorists who reject the ergodicity assumption as normative.

  #### 4. Incompatible Subsets

  There is a trilemma between **Requirement 2 (Measure Specification)**, **Requirement 7 (Ergodicity)**, and the **Premise of Parameter Uncertainty**.
  *   **The Conflict:** Requirement 7 demands convergence of realised growth to expected growth, which mathematically requires knowledge of the true objective distribution. Requirement 2 admits the agent only possesses a subjective posterior.
  *   **The Incompatibility:** You cannot simultaneously guarantee maximisation of the *true* long-run growth rate (Req 7) and admit the agent does not know the true distribution (Premise). A theory must sacrifice either the guarantee of optimal growth (accepting risk of ruin due to error) or the honesty about uncertainty (pretending estimates are truth). Most geometric theories resolve this by adopting fractional staking, but rarely derive the fraction from the uncertainty itself, violating Req 2.

  #### 5. Most Exclusionary Requirement

  **Requirement 2 (Measure Specification)** does the most exclusionary work.
  *   **Reasoning:** Most popular articulations of geometric rationality (e.g., standard Kelly criterion) implicitly assume known probabilities. When pressed on estimation error, proponents often resort to ad-hoc "half-Kelly" rules without a theoretical derivation. A theory that rigorously derives stake-sizing from the posterior distribution (e.g., via Bayesian growth optimisation) eliminates the vast majority of existing "Kelly" heuristics. Furthermore, it forces a confrontation with EU theory regarding the validity of subjective probabilities in long-run limits.

  #### 6. Value-Add Over Log-EU

  The specification requires the theory to answer: **Is geometric rationality a distinct normative framework or merely Expected Utility maximisation with $U(w) = \ln(w)$?**
  *   **Acceptable Outcome:** The theory admits they are mathematically equivalent in the i.i.d. limit but argues that the *derivation* matters (e.g., deriving log utility from survival constraints rather than risk preference).
  *   **Unacceptable Outcome:** The theory claims distinctness solely based on the "time-average vs. ensemble-average" rhetoric without showing how this changes the decision rule for a finite agent. If the honest answer is "nothing but emphasis," this must be recorded.

  ***

  ### Scorecard

  **Full-Kelly Growth Maximisation**
  Fails Requirement 2 (ignores parameter uncertainty) and Requirement 3 (ignores hard floors/ruin risk). It satisfies Requirement 1 and 7 under strict i.i.d. assumptions but offers no defence against Samuelson's objection (Req 8), being mathematically identical to Log-EU.

  **Fractional-Kelly (Prudential)**
  Satisfies Requirement 3 better by reducing ruin probability, but fails Requirement 2 as the fraction is usually arbitrary rather than derived from the posterior width. It is a heuristic patch rather than a theory, leaving Requirement 8 (differentiation) unresolved.

  **Unconstrained Expected-Utility (Terminal Wealth)**
  Fails Requirement 1 and 7 by design, as it optimises ensemble averages rather than time-average growth. It satisfies Requirement 2 (handles subjective beliefs naturally) but is disqualified by the specification's core premise that the agent is indefinitely long-lived without a terminal date (Req 5).
