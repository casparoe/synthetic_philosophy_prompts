      *   *Case 4 (Two Ledgers):* Mental accounting vs. fungibility.
          *   *Requirement:* Must state whether capital is fungible. If segregated, how does the criterion aggregate growth rates?
      *   *Case 5 (Withdrawals):* No terminal date, consumption flow.
          *   *Requirement:* Must define the objective function for infinite horizons with consumption (e.g., sustainable withdrawal rate vs. terminal wealth).
      *   *Case 6 (Restoring the Ensemble):* Insurance/Securitisation.
