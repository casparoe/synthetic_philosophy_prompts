answer: |-
  "It's not magic, Marcus. It's fundamental."

  "It's a placeholder for magic. You've got a billion tiny subjects—"

  "Protophenomenal properties. Don't be lazy."

  "—a billion tiny somethings in a heap, and you wave a wand called 'bonding' and suddenly there's a *me*. William James called it a hundred years ago. A crowd of feelings doesn't pool into a feeler. You haven't answered him, you've just renamed the gap."

  Elena shifted in the plastic chair. The squeak was loud in the recovery bay. Behind the blue curtain, the monitor beeped, steady and slow. David was still under.

  "James was working with nineteenth-century psychology," she said. "He didn't have quantum entanglement. He didn't have the binding problem in neuroscience. If physics describes structure and disposition, the intrinsic nature has to be somewhere. It's experience. But experience doesn't just aggregate. It bonds. It's a primitive relation. No worse than charge or mass."

  "Charge doesn't feel."

  "Charge *is* the feeling, from the inside. Look, if you deny the bottom-up, you have to explain how the One becomes the Many. That's your decombination problem. How does the Cosmos throw off me and you and David without shattering?"

  Marcus rubbed his face. His stubble scraped his palms. "It doesn't shatter. It modifies. Think about your own head. You've got an earworm looping in the left channel, an itch on your shoulder, a mood you can't locate, and you're planning dinner. Those are quasi-independent contents. You live inside a subject that contains plurality every night when you dream. Pluralising a field is something consciousness actually does. Fusing two subjects into one? Nobody can even describe the mechanism."

  "Because it's not a mechanism. It's a relation."

  "It's a confession dressed as a theory. You say 'bonding' and stop talking. I say 'modification' and keep talking."

  "Because your modifications are doing the same silent labour." Elena leaned forward, elbows on knees. "Those contents you listed? The itch, the earworm? They aren't subjects. They don't have privacy. I can't hear your earworm. Describing one field with many contents is a description of unity, not plurality. To get two subjects out of one—you, me—you need hard edges. Whatever does the hardening is going to look a hell of a lot like the bonding relation you're so smug about."

  Marcus looked at the curtain. The fabric was thin; they could see the shadow of the IV stand. "David's been under for two hours."

  "Yes."

  "On your view, where is he?"

  "The binding relation has lapsed. The micro-experiences are still there, firing in the neurons, but the subject 'David' is a standing achievement. It requires maintenance. When the anaesthetic hits, the achievement collapses. The atoms keep feeling, but there's no one home."

  "So he died. For two hours."

  "He ceased to be a subject. Yes."

  "And when he wakes?"

  "The binding re-establishes. Continuity of memory, of character."

  "Continuity isn't identity, El. If the binding relation is brute, so are its identity conditions. Why is the thing that wakes up the same thing that went under? If it's just a heap re-assembled, what guarantees it's the same heap? You've got no principle of individuation except the brute fact itself."

  Marcus picked at a loose thread on his jeans. "On my view, it's simpler. The field never left. The modification dimmed. Like turning down a dimmer switch. The Cosmos is still experiencing David, just at a lower intensity of differentiation. When he wakes, the modification sharpens. It's the same modification because the field is continuous."

  "But you haven't solved decombination. You've moved it." Elena's voice was quiet. "You say the field modifies. But what makes this modification distinct enough to be David and not you? If it's all one subject, where do the edges come from? You need something to carve the carveable. And if that carving is brute, you're just a cosmopsychist who smuggled in bonding relations and called them 'modifications'."

  "I don't need edges. I need degrees of separation."

  "Degrees of separation between what? Subjects. You're using the word 'modification' to avoid saying 'subject' because if you say 'subject' you have to explain how there are two of them."

  Marcus looked at her. His eyes were red. "Do you remember the seminar? Ninety-eight. November."

  "I remember."

  "You presented the paper. The one on Russellian monism. I told you then. I said, 'You're positing a relation you can't define.' You said it was inference to the best explanation."

  "It still is."

  "It's still the only thing holding your ontology together." He sighed, a long, ragged sound. "I think it's your best work. I also think it's wrong."

  "I know."

  "And you think my cosmopsychism is mystical thinking dressed in analytic drag."

  "I think it solves the combination problem by denying the data. There are many subjects. I know I'm not you."

  "Do you?" Marcus looked back at the curtain. "Under anaesthesia, you aren't. For two hours, a person apparently wasn't there. On your view, the atoms kept feeling. So who felt the surgery? The micro-experiences?"

  "They felt the damage. They didn't feel the pain. Pain requires a subject."

  "So a billion tiny feelings suffered damage, but no one suffered pain. That's supposed to be comforting?"

  "It's accurate."

  "It's cold." Marcus rubbed his temples. "I'm tired, El."

  "I know."

  "I don't know if the modification sharpens back to the same shape. I haven't solved decombination. I've moved it to the theory of modifications, and I hope nobody looks too closely at what the modifications are doing. They might be doing the work of subjects."

  He stopped. He looked surprised he'd said it.

  Elena didn't move. "I can't say what the bonding relation is. I can only say it does the work. Without it, a person is literally just a heap. I don't know how it binds. I just know it does."

  They sat in the silence. The monitor beeped. A nurse walked past the station outside, shoes squeaking on linoleum, but didn't come in.

  "If he wakes up different," Marcus said. "If the binding slips. If the modification drifts."

  "Then he's different."

  "Is he still David?"

  "On my view, only if the binding holds."

  "On mine, only if the field remembers the shape."

  "That's not memory. That's causality."

  "It's identity." Marcus leaned his head back against the wall. "We've been arguing this for thirty years. We're in a hospital at six in the morning. We're waiting to see if our friend exists."

  "Yes."

  "And neither of us knows what makes a person persist through a gap in consciousness. You need a brute relation. I need a brute field."

  "We need him to wake up."

  "Yeah."

  Elena looked at her hands. "If he wakes up and asks for water, he's bound."

  "If he wakes up and knows my name, the modification held."

  "Those are behavioural tests, Marcus. Not metaphysics."

  "It's all we have."

  She nodded. She didn't argue the point. Behind the curtain, the rhythm of the breathing machine shifted. A shallow inhale. A pause. A longer exhale.

  "He's coming round," Marcus said.

  "Or dreaming."

  "Or dreaming."

  "If he dreams," Elena said, "on your view, is it the Cosmos dreaming it's David, or David dreaming?"

  "Does it matter?"

  "If he wakes up in pain, it matters."

  Marcus didn't answer. He reached out and touched the edge of the curtain, then pulled his hand back. He didn't open it. Not yet.

  "You still think bonding is magic," she said.

  "I still think modification is a workaround."

  "Okay."

  "Okay."

  They waited. The light in the room didn't change. The argument was finished, for now, but the problem remained, sitting in the chair between them, wearing David's face.
