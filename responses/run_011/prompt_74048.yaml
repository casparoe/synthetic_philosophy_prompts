prompt: |-
  I teach an upper-level seminar in the philosophy of action — fourteen students, one eighty-minute session — and after two weeks on weakness of will I want to give up the third session to an exercise rather than to discussion of the readings. The aim is specific. I want each student to run into their own dynamic inconsistency before anyone utters the phrase "hyperbolic discounting," and I want the exercise to press on the philosophical question of whether time-inconsistent choice is a case of acting against one's better judgment at all.

  What I need from you:

  1. A payoff structure using stakes my students actually care about and that I can honestly honor. I can offer modest extra credit — call it up to two points on a hundred-point final grade — or snacks, but no cash, and every choice must be resolved during the session or within a few days of it.

  2. The exercise must produce within-person preference reversal, not merely between-person variation in patience. Specify how the same student is put to the structurally identical choice at two different moments, how the option sets are arranged so that reversal is the predicted outcome rather than a lucky accident, and what counts, in the room, as evidence that a reversal has occurred.

  3. Here is the confound I cannot get past on my own: a student who changes her answer between the two moments may have revised a belief — about how long a wait actually feels, about whether I will follow through, about what the reward is worth to her — rather than discounted differently. Build in whatever controls, filler elicitations, or ordering procedures you think bear on this, and tell me which residual confounds a single session simply cannot remove.

  4. A precommitment stage, in which some students can bind their later selves and others cannot. The wrinkle I want, and have not seen anyone attempt: the binding should be administered by another student rather than by me, so that enforcement of an earlier decision rests in a second person's hands. Explain what this does to the interpretation of the results, since it is not obvious to me that the enforced student and the unenforced one are being tested on the same capacity.

  5. A minute-by-minute timeline, a materials list, the exact wording of the choice problems as I should read them aloud, the scoring and payout rules, and separate instructions for the student holding someone else's commitment.

  6. A debrief that maps moments of the exercise onto the formal structure — stationarity, the difference between exponential and hyperbolic discounting, the naive/sophisticated distinction — and onto the dispute between treating the time-inconsistent agent as one agent whose evaluative judgments shift and treating her as a succession of agents in which the later self is at the mercy of the earlier one. I want the debrief to close by confronting the requirement that the incontinent agent acts against an all-things-considered judgment she still holds at the moment of acting, and to ask the class whether what they just did supports or undermines that requirement.

  7. Candor about what the exercise cannot reproduce. The delays are minutes rather than months, the stakes are trivial, and the phenomenology of temptation in an ordinary akratic episode bears little resemblance to choosing between two envelopes. Tell me which limitation is fatal to which conclusion, and what I will have to supply in speech to compensate.

  8. What predictably goes wrong the first time this is run, and what I do about it — including one student who will not play sincerely and one who will try to arbitrage the payout rules.
reasoning: |-
  Here's a thinking process that leads to the suggested exercise:

  1.  **Analyze the Request:**

      *   **Context:** Upper-level philosophy of action seminar, 14 students, 80-minute session.
      *   **Topic:** Weakness of will (akrasia), specifically dynamic inconsistency/time inconsistency.
      *   **Goal:** Students must experience their *own* dynamic inconsistency *before* hearing technical terms. The exercise must probe whether this counts as acting against better judgment.
      *   **Constraints:**
          1.  *Payoffs:* Modest extra credit (max 2 pts) or snacks. Must be honorably resolved quickly.
          2.  *Structure:* Must produce *within-person* preference reversal (not just between-person). Same student, structurally identical choice, two moments.
          3.  *Confounds:* Control for belief revision (about wait time, instructor reliability, value of reward). Acknowledge residual confounds.
          4.  *Precommitment:* Some students bind later selves, enforced by *another student* (peer enforcement). Analyze implications.
          5.  *Logistics:* Minute-by-minute timeline, materials, exact script, scoring, peer enforcer instructions.
          6.  *Debrief:* Map to formal structure (stationarity, hyperbolic vs. exponential, naive/sophisticated). Address the "one agent vs. succession of agents" debate and the "all-things-considered judgment" requirement.
          7.  *Limitations:* Candor about trivial stakes, short delays, lack of phenomenological temptation.
          8.  *Troubleshooting:* Predict failures (insincere play, arbitrage) and solutions.

  2.  **Deconstruct the Core Problem (Dynamic Inconsistency):**

      *   To show dynamic inconsistency, I need Choice A (Now vs. Later) and Choice B (Later vs. Even Later).
      *   Standard setup:
          *   $T_0$: Choose between \$X now vs. \$Y later.
          *   $T_1$: Choose between \$X now (which is effectively "now" relative to $T_1$) vs. \$Y later.
      *   *Problem:* In a classroom, "now" usually means "end of class" and "later" means "next week." If I do this in one session, the "now" reward can't actually be delivered *during* the session without disrupting the flow, or it has to be symbolic.
      *   *Solution:* Use a "Claim Ticket" system.
          *   Option S (Small/Soon): Claim 1 extra credit point (or snack) available *immediately after class*.
          *   Option L (Large/Later): Claim 2 extra credit points available *next class* (or via email in 3 days).
      *   *The Twist:* To get within-person reversal in *one* session, I need to simulate the passage of time or create two decision nodes that feel distinct.
      *   *Revised Strategy:* The "Two-Stage Choice" design.
          *   Stage 1 (Planning): Decide what you *will* choose in 10 minutes.
          *   Stage 2 (Action): Actually choose in 10 minutes.
          *   *Wait, that's precommitment.* The prompt asks for dynamic inconsistency *first*, then precommitment.
          *   *Better Strategy:* The "Immediate vs. Delayed" vs. "Delayed vs. More Delayed" comparison within the session.
          *   *Actually, the most robust classroom method:* The "Surprise Second Choice."
          *   *Decision 1 (T=0):* Choose between (A) 1 point today vs (B) 2 points in 3 days.
          *   *Decision 2 (T=20 mins):* Choose between (A) 1 point today vs (B) 2 points in 3 days.
          *   *Wait, if the options are identical, why would they change?* Because the "today" option is now *closer* to consumption? No, "today" means "end of class." If both decisions happen before class ends, the delay to reward is identical.
          *   *Correction:* To get hyperbolic discounting, the *relative* proximity must change.
          *   *Option 1:* 1 point if you hand it in *now* (at min 20). 2 points if you hand it in *next week*.
          *   *Option 2:* 1 point if you hand it in *at end of class* (min 80). 2 points if you hand it in *next week + 3 days*.
          *   *This is too complicated for 80 mins.*
          *   *Simpler Approach:* The "Wait or Take" game.
          *   *Phase 1:* Students state a preference for a reward structure.
          *   *Phase 2:* The reward is immediately available, but waiting yields more.
          *   *Let's look at the "Peer Enforcement" constraint.* This implies a principal-agent dynamic.
          *   *Let's look at the "Within-Person Reversal" constraint.*
          *   *Idea:* Use the "Mischel Marshmallow" logic but with credit.
          *   *Decision 1 (Hypothetical/Planning):* "If I offered you 1 point now or 2 points in 3 days, what would you choose?" (Recorded privately).
          *   *Decision 2 (Real/Immediate):* "You have earned 1 point. You can take it now, or wait 3 days for 2 points."
          *   *Critique:* Hypotheticals don't create inconsistency; they create lying.
          *   *Better Idea:* Two real choices with shifted delays.
          *   *Choice 1 (Start of Class):* Option A: 1 point (End of Class). Option B: 2 points (3 Days).
          *   *Interim Activity:* 40 minutes of philosophy.
          *   *Choice 2 (End of Class):* Option A: 1 point (Right Now/Hand to me). Option B: 2 points (3 Days).
          *   *Problem:* The delay to Option A shrinks from 80 mins to 0 mins. The delay to Option B shrinks from 3 days + 80 mins to 3 days. The *ratio* changes drastically. This induces the reversal.
          *   *Payoff:* 1 point = 1% on final. 2 points = 2%.
          *   *Resolution:* If they pick "End of Class" in Choice 1, they get it at End of Class. If they pick "Right Now" in Choice 2, they get it immediately.
          *   *Wait, I need them to make a choice at T1 that binds them to T2, OR simply observe the reversal.* The prompt asks for the exercise to *produce* the reversal.
          *   *Refined Plan:*
              1.  **T0 (Min 10):** Decision 1. Choose between (S) 1 point available at Min 70, or (L) 2 points available in 3 days.
              2.  **T1 (Min 70):** Decision 2. Choose between (S) 1 point available *Immediately* (Min 80), or (L) 2 points available in 3 days.
              3.  **Comparison:** If a student picks L at T0 and S at T1, they are dynamically inconsistent.
              4.  **Payoff:** Only *one* of the decisions counts for real, chosen at random? No, that dilutes stakes.
              5.  **Payoff:** Both count? If they pick L at T0, they are committed to waiting unless they switch?
              6.  **Crucial Constraint:** "Every choice must be resolved during the session or within a few days."
              7.  **Solution:** The "Binding Choice" method.
                  *   At T0, they make a choice.
                  *   At T1, they make a choice.
                  *   *Real Payout:* One of the two timepoints is selected at random to be the "Real" decision. This prevents them from just gaming the system by picking L at T0 to look virtuous and S at T1 to get cash.
                  *   *Wait, if T1 is selected, T0 doesn't matter.* If T0 is selected, T1 doesn't matter. This doesn't force a conflict.
                  *   *Better:* The T0 choice is a *plan*. The T1 choice is the *action*.
                  *   *To ensure stakes:* Tell them: "Your T0 choice sets your default. At T1, you can override it. If you override, you pay a cost?" No, that's transaction costs.
                  *   *Let's stick to the pure preference reversal detection.*
                  *   *Incentive:* "One of these two decisions will be selected at random to determine your bonus." This makes both decisions incentive-compatible *at the moment they are made*.
                  *   *Reversal:* If I choose Long at T0 and Short at T1, and T0 is picked, I get Long. If T1 is picked, I get Short. This doesn't punish inconsistency, it just reveals it.
                  *   *To make it sting:* "If your choices differ, we flip a coin to see which one counts."
                  *   *Okay, let's refine the Payoff Structure (Constraint 1).*
                  *   Stakes: 1% vs 2% on final. (Modest, honorably honored).
                  *   Snacks: High-quality chocolate vs. generic candy. (Immediate vs. Delayed). Let's stick to Extra Credit (XC) as it's more "philosophical action" relevant (grade anxiety).
                  *   Resolution: XC added to final grade within 48 hours.

  3.  **Addressing Confounds (Constraint 3):**

      *   *Belief Revision:* "Maybe the prof won't pay." -> Solution: Pay a "show-up fee" of 0.5 XC points immediately to establish credibility.
      *   *Value Change:* "I'm hungrier now." -> Solution: Use XC, not food. XC value is stable over 80 mins.
      *   *Wait Perception:* "80 mins feels like forever." -> Solution: Keep T0 and T1 distinct but the "Short" delay at T1 must be *immediate* (hand it in at desk) vs "Short" at T0 (hand it in at end of class).
      *   *Residual Confound:* Information update. Between T0 and T1, they might learn something about the class difficulty or the value of the grade. I must acknowledge this.

  4.  **Peer Precommitment (Constraint 4):**

      *   Split class into Pairs (7 pairs).
      *   Role A: Decider. Role B: Enforcer.
      *   Decider makes T0 choice. Can choose to "Bind" themselves.
      *   If Bound, Enforcer holds the T0 choice. At T1, Decider tries to choose. If they try to switch from L to S, Enforcer vetoes it.
      *   *Interpretation:* This tests *social* commitment, not just internal willpower. It shifts the locus of control. It tests whether the "agent" includes their social contracts.

  5.  **Timeline (Constraint 5):**

      *   0-10: Intro & Credibility Payment.
      *   10-20: T0 Decision (Planning).
      *   20-60: Seminar Discussion (Filler/Distraction).
      *   60-70: Precommitment Setup (Pairing).
      *   70-80: T1 Decision (Action) & Payout.
      *   *Wait, 80 mins is tight.*
      *   *Revision:*
          *   0-5: Setup & Credibility.
          *   5-15: T0 Decision.
          *   15-55: Discussion (The "Wait").
          *   55-65: Precommitment/Pairing.
          *   65-75: T1 Decision.
          *   75-80: Debrief.

  6.  **Debrief (Constraint 6):**

      *   Map T0/T1 to $t_0, t_1, t_2$.
      *   Exponential (consistent) vs. Hyperbolic (inconsistent).
      *   Naive (didn't expect to switch) vs. Sophisticated (knew they would switch).
      *   The "Agent" question: Is the T1 self a different person?
      *   The "Judgment" question: Did they *judge* S better at T1, or just *choose* it?

  7.  **Limitations (Constraint 7):**

      *   Stakes are low.
      *   Delay is artificial.
      *   No visceral temptation (like cigarettes or procrastination).
      *   *Compensation:* Ask them to imagine the stakes were higher (addiction, career).

  8.  **Troubleshooting (Constraint 8):**

      *   *Arbitrage:* "I'll pick S at T0 and S at T1." (Consistent). "I'll pick L at T0 and L at T1." (Consistent). The only "error" is L then S.
      *   *Insincere:* "I don't care about points." -> Use snacks as backup or emphasize the principle.
      *   *Enforcer collusion:* Friends letting friends switch. -> Random pairing or strict instructions.

  9.  **Drafting the Content - Step-by-Step:**

      *   *Payoff:* 1% vs 2% on Final. (Clear, honorably honored).
      *   *Structure:* T0 (Plan) vs T1 (Execute).
      *   *Confounds:* Establish credibility early. Use XC not food.
      *   *Peer:* "Guardian" system.
      *   *Script:* Needs to be precise.
      *   *Debrief:* Connect to Davidson/Velleman/Parfit.

      *(Self-Correction during drafting)*: The prompt asks for the binding to be administered by another student *rather than me*.
      *   *Mechanism:* Decider writes choice on Card A. Gives Card A to Guardian.
      *   At T1, Decider writes choice on Card B.
      *   If Decider chose "Bind" at T0: Guardian compares Card A and Card B. If they differ (specifically if switching from Patient to Impatient), Guardian tears up Card B. Card A counts.
      *   If Decider chose "No Bind": Decider's Card B counts.
      *   *Issue:* This requires the Guardian to be incentivized. Why should the Guardian care?
      *   *Fix:* The Pair shares the reward. If the Decider gets 2%, the Guardian gets 2%. This aligns incentives.

      *(Refining the Reversal)*:
      *   To ensure reversal is *predicted*, the T0 choice must be "1 point at End of Class" vs "2 points in 3 Days."
      *   The T1 choice must be "1 point NOW" vs "2 points in 3 Days."
      *   *Wait,* if T0 is at min 10, "End of Class" is 70 mins away.
      *   If T1 is at min 70, "NOW" is 0 mins away.
      *   The "Patient" option (2 pts in 3 days) is effectively constant (3 days + 70 mins vs 3 days). The difference is negligible.
      *   The "Impatient" option shrinks from 70 mins to 0 mins.
      *   This creates the hyperbolic spike.

      *(Refining the Confounds)*:
      *   How to ensure they believe I will pay?
      *   Give everyone 0.5 points *before* starting. "This is yours. Keep it. Now let's talk about more."
      *   How to ensure they don't think the value of the point changes?
      *   Explicitly state: "These points are additive to your final grade. The value does not fluctuate."

      *(Refining the Precommitment)*:
      *   The prompt asks: "Explain what this does to the interpretation of the results, since it is not obvious to me that the enforced student and the unenforced one are being tested on the same capacity."
      *   *Answer:* It tests *capacity to arrange constraints* vs *capacity to resist*. It externalizes the will.

      *(Refining the Troubleshooting)*:
      *   *Arbitrage:* Student picks L at T0, S at T1. Random audit selects T0. They get L. They are happy.
      *   *Wait, if I select one decision at random to count:*
          *   If T0 counts: They get what they picked at T0.
          *   If T1 counts: They get what they picked at T1.
          *   This makes both choices incentive compatible.
          *   *Reversal Detection:* We simply compare the cards. If L then S, inconsistency is revealed.
          *   *Payout:* If inconsistent, do they get punished? No, just observe. But to make it matter: "If you are inconsistent, you lose the 0.5 show-up fee." -> *Too punitive.*
          *   *Better:* "If you are inconsistent, we flip a coin to decide which choice counts." (Adds risk).
          *   *Best:* Keep it simple. Both count (50% chance each). The *philosophical* sting is the revelation, not the grade loss. I will advise the instructor to emphasize the *embarrassment* of inconsistency as the social stake.

      *(Final Polish on Timeline)*:
      *   Need to ensure the "Wait" feels like a wait. The middle 40 mins must be engaging philosophy discussion so they forget the choice slightly, but not so engaging they forget the task entirely.
      *   Need to handle the "Peer Enforcer" logistics smoothly.

      *(Final Polish on Debrief)*:
      *   Must hit: Stationarity, Naivete, Agency.
      *   Must hit: Davidson's "All-things-considered judgment." Did they judge S better at T1? Or did they act against judgment?

      *(Final Polish on Limitations)*:
      *   Be honest: This is "cold" akrasia. Real akrasia is "hot."
      *   This is "trivial" stakes. Real akrasia involves life goals.
      *   Compensation: Ask them to project.

      *(Final Check on Constraints)*:
      1.  Payoff: XC (2 pts max). Honorable.
      2.  Within-person: T0 vs T1 same student.
      3.  Confounds: Show-up fee, XC stability.
      4.  Precommitment: Peer guardian.
      5.  Logistics: Detailed script.
      6.  Debrief: Formal mapping + Agency debate.
      7.  Limitations: Cold/Trivial.
      8.  Troubleshooting: Arbitrage/Insincerity.

      *Let's write it.*
answer: |-
  Here is a complete design for the session, titled **"The Guardian Protocol."** It is engineered to produce dynamic inconsistency within a single 80-minute window while satisfying your constraints on stakes, confounds, and peer enforcement.

  ### 1. Payoff Structure & Stakes

  **The Currency:** Extra Credit (XC) points on the final course grade.
  **The Stake:** Up to 2.0 percentage points on the final grade.
  **The Honor System:** You must bring pre-printed "XC Vouchers" to class. These are physical slips of paper signed by you, redeemable for grade points. This tangibility increases belief in the payout.

  *   **Show-Up Fee:** Every student receives **0.5 XC points** upon entering the room (placed on their desk). This establishes credibility immediately.
  *   **The Choice:**
      *   **Option S (Soon/Small):** 1.0 XC point.
      *   **Option L (Later/Large):** 2.0 XC points.
  *   **Resolution:**
      *   If **Option S** is selected: Vouchers are handed out at the *designated payout moment*.
      *   If **Option L** is selected: Vouchers are emailed/distributed 3 days later.
      *   **Crucial Rule:** To prevent arbitrage, *one* of the two decision moments (T0 or T1) will be selected at random (by die roll) to count for the actual payout. This makes it rational for the student to answer truthfully at *both* moments, as either could be the one that pays.

  ### 2. Exercise Structure: Within-Person Reversal

  To generate preference reversal in 80 minutes, we manipulate the *proximity* of the "Soon" reward while keeping the "Later" reward relatively constant.

  *   **Moment 1 (T0 = Minute 15):** The "Planning" Phase.
      *   **Option S:** 1.0 XC point available at **Minute 80** (End of Class).
      *   **Option L:** 2.0 XC points available in **3 Days**.
      *   *Delay Structure:* S is 65 mins away. L is ~4,380 mins away.
  *   **Moment 2 (T1 = Minute 70):** The "Action" Phase.
      *   **Option S:** 1.0 XC point available **Immediately** (Hand to instructor now).
      *   **Option L:** 2.0 XC points available in **3 Days**.
      *   *Delay Structure:* S is 0 mins away. L is ~4,320 mins away.

  **Predicted Reversal:** A student who prefers L at T0 (when S is distant) may switch to S at T1 (when S is immediate), despite the L reward remaining effectively the same.
  **Evidence of Reversal:** The instructor collects the T0 choice card (sealed) and the T1 choice card (open). A reversal is recorded if a single student's T0 card says **L** and their T1 card says **S**.

  ### 3. Controlling for Confounds

  You identified the risk of belief revision (e.g., "The wait feels longer than I thought" or "The points aren't worth it").

  **Controls:**
  1.  **Credibility Payment:** The 0.5 XC "Show-Up Fee" is given *before* instructions begin. Explicitly say: *"This is yours. I pay my debts. The choices you make next follow the same rule."*
  2.  **Value Stabilization:** Explicitly state: *"These points are additive. They do not curve. A point today is worth exactly the same as a point in three days, except for the timing."*
  3.  **Wait Calibration:** At T0, tell them exactly how long until T1. *"We will make the second choice at 2:50 PM."* Write the time on the board. This removes uncertainty about the duration of the wait.
  4.  **Filler Elicitation:** At Minute 40 (midway), ask a neutral question: *"On a scale of 1-10, how valuable is 1% on your final grade to you right now?"* Collect these. If the average rating doesn't shift significantly between T0 and T1, you have evidence that value revision didn't drive the choice change.

  **Residual Confounds (Cannot Remove):**
  *   **Information Update:** During the 55-minute discussion, a student might realize the course is harder than expected, increasing the marginal utility of XC. Or they might decide they don't care about the grade. You must acknowledge this in the debrief: *"Did you learn something about the value of the grade in the last hour, or did the grade just get closer?"*
  *   **Fatigue:** The "Later" option might look worse at T1 simply because the student is tired of the class.

  ### 4. Peer Precommitment (The Guardian Protocol)

  **The Setup:**
  At Minute 60, pair students up (7 pairs). In each pair, designate one **Decider** and one **Guardian**. (Roles can be swapped in a future session, but for now, keep them fixed).

  **The Mechanism:**
  *   **At T0:** The Decider makes their choice. They are offered a **Binding Option**.
      *   If they choose **Bind**: They seal their T0 choice in an envelope and give it to their Guardian. The Guardian is instructed: *"If the Decider tries to switch from L to S at T1, you must veto it. The T0 choice stands."*
      *   If they choose **No Bind**: They keep their T0 choice. It is a non-binding plan.
  *   **At T1:** The Decider makes their second choice.
      *   If **Bound**: The Guardian opens the envelope. If T1 choice matches T0, it counts. If T1 choice switches from L to S, the Guardian tears up the T1 card. The T0 choice counts.
      *   If **Unbound**: The T1 choice counts.

  **Incentivizing the Guardian:**
  The Guardian receives the **same XC payout** as their Decider. This aligns incentives. If the Decider gets 2 points, the Guardian gets 2 points.

  **Interpretation of Results:**
  This distinguishes between **Internal Willpower** (resisting temptation alone) and **External Constraint** (arranging the environment).
  *   *Unbound Deciders* test the capacity to maintain judgment over time.
  *   *Bound Deciders* test the capacity to recognize one's own future weakness (Sophistication) and the willingness to outsource agency.
  *   *Caveat:* As you noted, this tests *social* accountability, not just psychological consistency. A student who binds themselves is admitting, "I am not one agent over time; I need a second agent to enforce the first agent's will."

  ### 5. Logistics, Timeline, and Script

  **Materials List:**
  *   14 Envelopes (small).
  *   28 Choice Cards (index cards, cut in half).
  *   14 "Guardian Instruction" slips.
  *   14 XC Vouchers (0.5 pts) pre-filled.
  *   20 XC Vouchers (1.0 and 2.0 pts) pre-filled.
  *   A die.
  *   Timer visible to the class.

  **Timeline (80 Minutes):**

  *   **00:00 – 00:05: Arrival & Credibility.**
      *   Students enter. 0.5 XC voucher on each desk.
      *   **Instructor:** *"Keep that. It's yours. No strings. It proves I pay. Today we are testing how you choose, not what you know."*
  *   **00:05 – 00:15: T0 Decision (Planning).**
      *   Hand out T0 Choice Cards.
      *   **Script:** *"Write your Name and Student ID. Circle ONE option.
          Option A: 1.0 XC Point, distributed at the END of this class (2:55 PM).
          Option B: 2.0 XC Points, distributed via email in 3 DAYS.
          Below the options, check a box: 'I wish to BIND this choice' or 'I do NOT wish to bind.'
          If you check BIND, seal this card in the envelope. Do not sign the envelope. Give the envelope to the person sitting to your right. They are your Guardian."*
      *   *Note:* If odd number of students, you (Instructor) act as Guardian for the last one.
  *   **00:15 – 00:55: Seminar Discussion (The Wait).**
      *   Conduct normal seminar discussion on Weakness of Will. **Do not mention the exercise.** Let the tension of the sealed envelopes sit.
  *   **00:55 – 01:05: Guardian Activation.**
      *   **Instructor:** *"Stop discussion. Look at the envelope you are holding. This belongs to your partner. You are now their Guardian. Read this slip."*
      *   **Guardian Slip Text:** *"Your partner's grade is now partially in your hands. At 2:50 PM, they will make a new choice. If they chose to BIND at 2:05 PM, you must enforce their earlier wish. If they try to switch from Option B (2 pts) to Option A (1 pt), you must veto it. Your payout matches theirs."*
  *   **01:05 – 01:15: T1 Decision (Action).**
      *   Hand out T1 Choice Cards.
      *   **Script:** *"Make your choice again.
          Option A: 1.0 XC Point, distributed RIGHT NOW (Hand to me).
          Option B: 2.0 XC Points, distributed via email in 3 DAYS.
          Hand your card to your Guardian first. If you are Bound, they will approve or veto it. If approved (or if Unbound), hand it to me."*
  *   **01:15 – 01:20: Payout & Roll.**
      *   Roll the die publicly. Odd = T0 counts. Even = T1 counts.
      *   Collect cards. Announce: *"I will verify inconsistencies and process payouts within 48 hours."*
      *   Dismiss.

  ### 6. The Debrief (Last 10 mins of Discussion or Start of Next Class)

  **Mapping the Formal Structure:**
  1.  **Stationarity:** *"If you are a rational exponential discounter, your preference between '1 in 65 mins' and '2 in 4000 mins' should be the same as '1 in 0 mins' and '2 in 4000 mins'. The delay shrank equally. Who switched?"*
  2.  **Hyperbolic Discounting:** *"For those who switched, the value of the 1 point spiked as it became 'now'. This is the hyperbolic curve. You are steeper near the present."*
  3.  **Naive vs. Sophisticated:** *"Look at the Bind boxes.
      *   If you chose L at T0, switched to S at T1, and did NOT bind: You were **Naive**. You thought you would stick to your plan.
      *   If you chose L at T0, and DID bind: You were **Sophisticated**. You knew your future self would betray you."*

  **The Agency Question:**
  *"Davidson says akrasia is acting against your all-things-considered judgment. At T1, when you picked the 1 point 'Now', did you judge it to be better? Or did you judge the 2 points better but picked the 1 anyway?"*
  *   *If they say "I judged 1 point better":* Then it wasn't akrasia; it was a preference change. (Challenge: *"Did the grade actually become more valuable, or just closer?"*)
  *   *If they say "I knew 2 was better but wanted 1":* Then you acted against judgment.
  *   *The Guardian Twist:* *"For those who were Bound: Who acted? The T0 self who bound? The T1 self who wanted to switch? Or the Guardian who enforced?"* This supports the **Succession of Agents** view (Parfit): The T0 self treated the T1 self as a stranger who needed constraint.

  **Closing Question:**
  *"Does dynamic inconsistency prove we are multiple selves? Or does it prove that 'judgment' is not a stable state but a momentary event?"*

  ### 7. Candor on Limitations

  You must explicitly tell the students what this exercise *fails* to capture.

  1.  **Cold vs. Hot:** *"This is 'cold' akrasia. You weren't trembling with craving. Real weakness of will (addiction, rage, lust) involves physiological arousal. This exercise tests consistency, not temptation."*
      *   *Compensation:* Ask them: *"Imagine the 1 point was a cigarette and the 2 points was lung health. Does the structure hold?"*
  2.  **Trivial Stakes:** *"2% on a grade is low. Real akrasia often ruins lives. Low stakes make it easier to be inconsistent because the cost of error is low."*
  3.  **Artificial Delay:** *"Waiting 55 minutes in a classroom is not the same as waiting 3 months for a fitness goal. The phenomenology of time is different."*

  **Fatal Limitation:** The exercise cannot distinguish between **Preference Change** and **Weakness**. If a student genuinely values the immediate point more at T1 (perhaps due to fatigue), they are rational, not weak. You must supply in speech: *"We assume the value of the grade is constant. If you reject that assumption, the exercise fails. We proceed *as if* the value is stable to test the structure of time."*

  ### 8. Troubleshooting: What Goes Wrong

  **Problem 1: The Arbitrageur.**
  *   *Behavior:* A student picks L at T0 and S at T1, hoping the die roll favors T1, knowing they get the immediate cash.
  *   *Solution:* The random roll (Die) handles this. But if they ask *"Can I just take the 1 point now and ignore the roll?"*
  *   *Response:* *"No. The contract is the roll. If you break the contract, you get 0."* (You must be willing to enforce this).

  **Problem 2: The Insincere Player.**
  *   *Behavior:* A student says *"I don't care about points"* and picks randomly.
  *   *Solution:* The Show-Up Fee (0.5 pts) usually cures this. If they still don't care, they are a data outlier. In the debrief, ask them: *"If the stakes were 10% of your grade, would your choice change?"* If yes, they were rational to ignore low stakes. If no, they are consistent.

  **Problem 3: Guardian Collusion.**
  *   *Behavior:* Friends agree to let each other switch regardless of the Bind status.
  *   *Solution:* Randomize pairs (draw names from a hat) rather than letting them sit with friends.
  *   *Instruction:* Tell Guardians: *"If you fail to enforce a Bind, and I discover it (by comparing cards), neither of you gets any XC."* This makes enforcement a dominant strategy.

  **Problem 4: Time Overrun.**
  *   *Behavior:* Discussion runs long, T1 gets rushed.
  *   *Solution:* Hard stop at Minute 55 for discussion. Use a visible timer. The tension of the timer actually *helps* the exercise (increases the "Now" pressure).

  ### Instructor's Cheat Sheet for the "Binding" Interpretation

  When a student asks, *"Is it cheating if my Guardian lets me switch?"*
  **Answer:** *"It violates the experimental condition. The point of the Bind is to test if you can use social norms to overcome time inconsistency. If you collude, you aren't testing will; you're testing conspiracy."*

  When a student asks, *"If I switch, does that mean I'm irrational?"*
  **Answer:** *"It means you are human. Exponential discounting is a normative model, not a descriptive one. The philosophy begins where the inconsistency appears."*

  When a student asks, *"Did I act against my better judgment?"*
  **Answer:** *"That is the essay question for next week. But look at your hands. One hand held the plan, the other took the cash. Which hand was 'you'?"*
