  *Total:* 5 + 13 + 13 + 13 + 10 + 15 + 15 = 84 mins. Leaves 6 mins buffer. Perfect.

  *Wait, one more thing:* The "Objection Token." If it passes every round, it might stall. Let's make it a "Challenge Card." One per round. Must be played.

  *Final check on Question Chain:* Needs to ensure the drift is visible.
