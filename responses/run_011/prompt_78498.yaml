  **Precautionary Park: A Critical Reading for the Risk Group**

  **Introduction: Beyond Hubris**

  The received wisdom regarding *Jurassic Park* is that it is a morality play about scientific hubris. On this reading, the park's creators are blinded by capability, ignoring the warnings of chaos theory until nature reclaims its domain. This interpretation is convenient for regulators and ethicists because it locates the failure in character rather than in structure. It allows us to treat the film as a simple affirmation of the Precautionary Principle (PP): stop, look, and listen before acting. However, for a group tasked with operationalizing risk management, this reading is insufficient. It treats the PP as a moral sentiment rather than a decision rule. To test the utility of the principle, we must dissect the film not as a tale of ignored warnings, but as a case study in the implementation, failure, and limits of precautionary measures themselves.

  To proceed, we must distinguish the versions of the principle at stake. The **Weak Version**, common in treaty law, suggests that threats of serious damage justify cost-effective preventive measures despite scientific uncertainty. The **Strong Version** shifts the burden of proof to the proponent, who must demonstrate safety before proceeding. The **Maximin Version** argues that when outcomes are catastrophic and irreversible, probabilities drop out of the calculation; the worst-case scenario dictates the decision.

  **Which Principle Survives the Park?**

  The film does not support the Weak Version. The park's architects did not postpone measures; they implemented extensive preventive controls. The electrified fences, the all-female population, and the engineered metabolic dependency on lysine were all cost-effective preventive measures designed to mitigate uncertainty. The failure was not a absence of precaution, but a failure of specific precautions. This aligns uncomfortably with the critique advanced by Cass Sunstein: that precautionary measures can be self-cancelling. The genomic patching using amphibian DNA was a solution to one uncertainty (gaps in the genome) that created a new risk (sex-changing capability). The film thus illustrates risk displacement rather than risk neglect.

  The Strong Version fares little better. Hammond believed he had met the burden of proof. The system was designed to be safe. The failure was not that safety was unproven, but that the proof was contingent on specifications that turned out to be false. The census system reported what it was programmed to expect, not what was present. This suggests that shifting the burden of proof is insufficient if the metrics for safety are flawed.

  The film bears the **Maximion Version** most readily. The core horror is irreversibility. Once the dinosaurs breed, they cannot be un-created. The closing sequence refuses the reassurance of a threat neutralized; the survivors fly away from an island still populated by predators, and the banner in the visitor centre unfurls as the tyrannosaur roars. The worst outcome has occurred, and it is permanent. Here, the film supports the Maximin rule: when the worst case is extinction or uncontrollable predation, the probability of containment becomes irrelevant. However, this reading relies entirely on the premise of irreversibility. If the animals could be culled, the Maximin argument collapses.

  **Four Questions for Discussion**

  **1. Chaos Theory: Precaution or Fatalism?**
  The chaos-theory strand, articulated by Malcolm, suggests that complex systems cannot be controlled and that failure will find a path no *ex ante* analysis could anticipate. If this is true, it undercuts the Precautionary Principle. The PP is a decision rule supposed to operate before the fact, relying on some capacity to model outcomes. If the system is fundamentally unpredictable, precaution becomes impossible; we are left with fatalism. The film borrows its emotional force from a vivid, statistically atypical catastrophe. This correlates with the psychological critique of risk judgement: we overweigh memorable disasters. Does the film argue for precaution, or does it argue that technological mastery is impossible regardless of precaution? If the latter, the regulatory lesson is not to regulate better, but to prohibit entirely—a distinction the PP struggles to make.

  **2. Precaution or Competence?**
  The engineers in the room will note that the park lacks defence in depth. One grid powers every fence; one programmer holds the keys to the security system. Much of the disaster stems from these single points of failure. The power goes down because of a disgruntled employee and a tropical storm; the animals escape because the fences are unpowered. This looks like a competence argument: the disaster happens because safety engineering was underfunded or poorly designed. If better engineering (redundant power, manual overrides, better sensor specification) would have sufficed, the precautionary moral collapses into a moral about hiring and redundancy. The film obscures this distinction. It wants us to believe the project was inherently flawed, but the mechanics of the failure suggest it was merely poorly executed. Does the film know which argument it is making, or does it conflate bad engineering with bad science?

  **3. Malcolm's Reproach: Permission or Probability?**
  Malcolm's famous reproach at the lunch table—that the creators were so taken up with whether they *could* do the thing that they never paused to ask whether they *should*—is often cited as the philosophical core of the film. However, this is not a precautionary argument. Precaution concerns probabilities and worst cases; it is consequentialist. Malcolm's objection is deontological. It is about permission and standing. He argues that certain domains are closed to human intervention regardless of safety outcomes. If this is right, the film is not about risk management at all. It is about boundary maintenance. This matters for regulators: are we managing risk, or are we policing moral boundaries? The film conflates the two, using the language of risk (chaos, control) to support a conclusion about standing (should not have done it).

  **4. Novel vs. Film: The Assignment of Culpability**
  The novel and the film differ in ways that bear directly on culpability. In the novel, the story opens with small scavenging dinosaurs killing a child on the mainland, risks nobody at the park considered worth fearing. Hammond is cold and self-interested. After the crisis, he rationalizes the disaster as a fluke attributable to staff character flaws and resolves to rebuild. He is then killed by that same pack of small dinosaurs while lying helpless with a broken ankle. The novel punishes a chooser. It maintains a tight link between decision and consequence.

  The film lets Hammond survive, makes him sympathetic, and redistributes the blame to a bribed programmer and a tropical storm. This dissolves choice into complexity. In the film, the disaster is a systems failure; in the novel, it is a moral failure. For a reading group on regulation, the novel offers a clearer causal chain: the regulator ignored the small risks and was killed by them. The film offers a murkier lesson: the system was too complex to hold anyone responsible. If we are using the film to teach risk, the novel is the sharper tool. The film lets the audience off the hook by suggesting that no amount of human care could have stopped the storm and the saboteur.

  **Key Scenes for Analysis**

  To ground this discussion, we should focus on four specific sequences:

  1.  **The Control Room Census:** When the system reports the correct number of animals despite the breeding. This is not a biological failure but a specification failure. The instrument measured what it was told to measure, not reality. This argues for precautionary auditing of the *metrics* of safety, not just the safety measures themselves.
  2.  **The Storm and the Shutdown:** The sequence where the programmer disables the security to steal embryos. This highlights the single point of failure in the power grid. It shifts the argument from biological precaution to organizational security.
  3.  **The Lunch Table:** Malcolm's speech. We must analyze this not as wisdom, but as a category error. He speaks of chaos while arguing for moral restraint.
  4.  **The Ending:** The helicopter flying away while the tyrannosaur roars behind the banner. This is the only moment that supports the Maximin version. The threat is not contained; it is merely escaped.

  **Concessions: Where the Reading Strains**

  I must concede where the sketch I have circulated may be over-reading the text. First, the film may simply resist being read as a work about precaution at all. It is a thriller first; its logic is narrative, not regulatory. The engineering failures are contrived to create plot points, not to illustrate systemic risk. To build a theory of precaution on a film where the security system is disabled by a single person for a heist is to build on sand. The "self-cancelling precaution" of the amphibian DNA is a plot device, not a rigorous model of risk displacement.

  Second, my suspicion that the film supports the Maximin version relies on the assumption that the dinosaurs cannot be contained after the film ends. But the film implies the military will intervene. If the threat is neutralizable post-facto, irreversibility is weakened. I may be granting the film more philosophical coherence than it possesses. It is possible the received version is correct simply because the film is too crude to support a nuanced distinction between competence and precaution. If the engineers are right that this is just a story about underfunded safety, then my attempt to salvage a Maximin argument is an imposition of theory onto a blockbuster.

  **Conclusion: The Phenomenology of Risk**

  Despite these concessions, the film contributes something to the debate that journal articles do not: the phenomenology of a risk that can only be recognized as a risk after the fact. In the literature, risk is a matrix of probabilities and impacts. In the film, risk is a shadow moving in the grass. It is the difference between having been warned and having been persuaded. Malcolm warns them; the raptors persuade them.

  For regulators, this is the core problem. We operate in the realm of warnings. We write treaties and design fault trees. But political and public will only mobilize around persuasion. The film captures the visceral gap between knowing a risk exists and feeling it. It shows that precautionary measures, no matter how robust, cannot protect against the failure of imagination. The park's creators imagined fences; they did not imagine the frogs. They imagined storms; they did not imagine sabotage. The film suggests that the ultimate risk is not the technology, but the limit of the model. If we are to use *Jurassic Park* in this group, let us not use it to confirm that we should be cautious. Let us use it to ask why our cautions are always tailored to the last disaster, and why the next one always arrives from the blind spot we decided was safe.
