      Good evening. It is a particular kind of honor to stand here, though I admit I spent most of yesterday wondering what a fourth-year graduate student knows about democracy that a room full of people actually wants to hear. Usually, my job is to read very old books and argue about what they meant. Tonight, the job is simpler. We are just talking about what happens next.

      We are three weeks out. The air in the room feels like the air everywhere else right now: heavy with anticipation, maybe a little tired. I know many of you are in your first or second year here. For some of you, this is the first time the mail has brought something that actually requires a decision from you. For others, the idea of walking into a polling place feels like walking into a room where everyone is shouting a different language.

      There is a math to elections that we all know. One ballot among thousands, or millions, disappears into the count. If the only reason to participate is to single-handedly change the winner, then staying home is the rational choice. The odds are too long. It is like buying a lottery ticket where the prize is a slightly different version of the same headache.

      I know some of you look at the options and see two versions of a catastrophe. You might feel that choosing one is just a way of signing off on a system that produced both. That is not a naive view. It is a serious assessment of what is on offer. If you believe the structure itself is the problem, then refusing to play the game is a coherent way to keep your hands clean.

      There is a colleague of mine in the philosophy department who has written that voting is not something anyone owes to anyone else. He argues that participation is a gift you might give, not a debt you owe. He is right that no one owns your participation.

      But there is another way to think about what happens when you fill out a ballot. It is not about changing the result. It is about what the result means for you.

      Think about a story. When a book ends, the outcome belongs to the characters who acted. In an election, the outcome belongs to the people who showed up. If you vote, you are one of the authors of whatever happens next. If you do not vote, you are not. This does not mean you have to vote. It means that if you stay home, you are choosing not to be listed among the people who produced the winner. If you vote, you are choosing to be listed among them.

      This changes the question. It is not "Will my vote change the outcome?" The question is "What am I willing to have been part of?"

      Maybe you think one side is less harmful than the other, and you want to be part of the effort to steer toward that. Maybe you think both are harmful, and you do not want to be part of either. Both answers make sense. But they are different answers. One says "I am in this story." The other says "I am watching this story."

      When the results come in on election night, the news will tell you who won. It will not tell you who stood with them. That is a fact only you will know.

      We are lucky to have people here who make this possible. Later, my colleagues will recognize the election workers from the county. They are the ones who keep the machinery running. They are here tonight to help you navigate the forms, not to judge your choices. They are ready when you are.

      I know this is a Tuesday night. I know there is reading due. I know the ballroom chairs are not designed for long conversations. But the tables are set up in the back. The pens are uncapped.

      You do not have to decide anything right this second. But if you want to be able to say, three weeks from now, that you were one of the people who authored this outcome, the way to do that is open to you.

      The tables are open. The choice is yours.

