  Here is the breakdown of the principles, the selection, the application, and the cost.

  ### Part 1: Candidate Principles

  To capture your verdicts, we need a principle that distinguishes between *who* is targeted (protected groups vs. political classes), *how* they are targeted (physical/biological vs. cultural/territorial), and *why* they are targeted (specific intent vs. indifference). Here are three candidates.

  **Candidate 1: The Biological Continuity Principle**
  *Definition:* Genocide is the specific intent to destroy a protected group by severing its capacity to reproduce and sustain itself biologically across generations.
  *   *Delivers:* Class Killing (No, political not biological); Indifference (No, no intent); Rape/Forced Pregnancy (Yes, biological severance); Town Case (Yes, killing men prevents reproduction); Famine (Yes, physical destruction).
  *   *Strains:* Cultural Destruction (You call it genocide, but if death rates are unchanged and only language is banned, biological continuity remains intact unless child transfer is the deciding factor). Homeland Case (Fits, as people survive biologically).

  **Candidate 2: The Social-Vitality Principle**
  *Definition:* Genocide is the specific intent to destroy a group's identity and social cohesion, rendering it impossible for the group to function as a distinct collective, regardless of physical survival.
  *   *Delivers:* Cultural Destruction (Yes, identity erased); Town Case (Yes, community shattered); Homeland Case (Could go either way, but leans toward Yes if land is essential to identity).
  *   *Strains:* Indifference (Fits, no intent); Class Killing (Fits, no protected identity).
  *   *Failure:* It struggles to explain why the Homeland Case is *not* genocide. If social vitality depends on the homeland, destroying the land should be genocide. It also risks capturing the Indifference case if the result is social death, regardless of intent.

  **Candidate 3: The Constitutive Human Targeting Principle**
  *Definition:* Genocide is the specific intent to destroy a protected group, in whole or in substantial part, through acts that directly inflict destruction upon the *members themselves* (their bodies, lives, reproductive capacity, or immediate familial unity), excluding acts directed solely at their property, territory, political status, or abstract cultural artifacts.
  *   *Delivers:* Class Killing (No, political status excluded); Indifference (No, intent excluded); Town Case (Yes, members killed/expelled); Homeland Case (No, territory targeted, members survive); Cultural Destruction (Yes, *only if* child transfer is present as an act against familial unity).
  *   *Strains:* Requires us to be precise about what counts as "direct" targeting (e.g., famine).

  ### Part 2: The Selected Principle

  I recommend **Candidate 3: The Constitutive Human Targeting Principle**.

  It is the only one that cleanly resolves your central tension: the Town Case vs. the Homeland Case. In the Town Case, violence is applied to *people* (killing men, expelling families). In the Homeland Case, violence is applied to *place* (flooding land). The group's survival in the Town Case is irrelevant because a "substantial part" was physically attacked with intent to destroy. In the Homeland Case, the lack of direct violence against members saves it from the category, even if their way of life ends.

  It also handles the Indifference Case cleanly: without specific intent to destroy the group *as such*, the physical outcome (death) does not constitute genocide.

  ### Part 3: Application to New Situations

  Here is what the principle yields for your three unlisted scenarios:

  **1. Forced Mass Conversion (Adults, no killing, no child transfer)**
  *   **Verdict:** Not Genocide.
  *   **Reasoning:** While this destroys the group's religious identity, it does not target the *members* physically or biologically. The adults remain alive, their reproductive capacity is untouched, and their familial unity is not severed by force (no child transfer). Under the Constitutive Human Targeting Principle, this is a crime against culture or religion, but not genocide. It aligns with your exclusion of the "Language Ban" unless accompanied by child transfer.

  **2. Settlement Enterprise (Expansion makes existence impossible, no specific target)**
  *   **Verdict:** Not Genocide.
  *   **Reasoning:** This mirrors your Indifference Case. Even if the expansion predictably destroys the group's capacity to exist, the absence of specific intent ("does not target a group as such") disqualifies it. The principle requires the destruction to be the *aim*, not merely the foreseen consequence. This maintains the bright line between genocide and negligent or reckless state policy.

  **3. Killing Leadership and Intelligentsia Only (Population spared)**
  *   **Verdict:** Genocide.
  *   **Reasoning:** This aligns with your Town Case verdict. The leadership constitutes a "substantial part" of the group—not necessarily numerically, but functionally. They are the constitutive elements that allow the group to function as a social unit. Killing them is a direct act against *members* with the intent to destroy the group's viability. It fits the principle because it targets human beings directly to sever the group's continuity, distinct from destroying their land.

  ### Part 4: The Cost

  Every principle demands a sacrifice to maintain coherence. To defend the Constitutive Human Targeting Principle publicly, you must pay a cost regarding your **Cultural Destruction verdict**.

  **The Sacrifice:** You must concede that a **language ban or school shuttering, absent child transfer or killing, is not genocide.**

  **Why:** Your verdict bundles "schools shuttered, language banned" with "children taken." The principle validates the verdict *only because* of the children. Child transfer is a direct act against familial unity and biological continuity (the next generation). A language ban, however cruel, is an act against an abstract cultural artifact. If you argue that banning a language alone is genocide, you blur the line between the Homeland Case (destroying the place of culture) and the Cultural Case. If destroying the land is not genocide because the people survive, destroying the language should not be genocide for the same reason.

  **Why this loss is cheaper:** If you expand genocide to include pure cultural erasure (language/schools without physical harm), you lose the ability to distinguish genocide from severe oppression or assimilation. More dangerously, it weakens the Town Case. If "destroying the group" includes cultural elements, the Homeland Case (destroying the land/culture) becomes genocide, contradicting your firm verdict there. To keep the Town/Homeland distinction robust, you must anchor genocide in the *human body and family*, not the *culture or territory*.

  ### Part 5: The Engineered Famine

  You noted this is the verdict you oscillate on. The Constitutive Human Targeting Principle forces a decision: **It is Genocide.**

  **Reasoning:** Famine, when engineered, is not merely "conditions of life"; it is a method of killing. It targets the *biological continuity* of the members directly (starvation causes physical death). It satisfies the intent requirement (engineered/concentrated) and the act requirement (direct destruction of members).

  **The Tension:** The hesitation likely comes from the fact that famine is "passive" killing (withholding food) rather than "active" (shooting). However, under this principle, the mechanism matters less than the target. Since the target is the *physical existence* of the group members, and the intent is their destruction, it qualifies.

  **Does it force a decision?** Yes. It forces you to align the Famine Case with the Class Killing Case or the Ethnic Killing Case.
  *   If the famine targets a *political* class: Not Genocide (matches your Class Killing verdict).
  *   If the famine targets a *national/ethnic* group: Genocide (matches your Ethnic Killing verdict).

  Since your scenario specifies the famine is concentrated on a "distinct national group," the principle dictates it **is genocide**. To rule otherwise, you would have to adopt a stricter "Direct Violence" principle (excluding starvation), but that would undermine the Town Case (where expulsion/starvation often accompany killing) and weaken the protection against "methods of destruction" that don't involve bullets.

  **Final Advice:** Keep the Famine verdict as Genocide. It is the morally consistent position if ethnic killing is genocide. Sacrifice the "Language Ban" aspect of the Cultural verdict to preserve the boundary between destroying *people* and destroying *places or practices*. This gives you a defensible, public-facing principle: *Genocide is the intentional destruction of a protected people through direct acts against their bodies and families, not their land or culture alone.*
