  They say the vacuum waits forever cold and still,
  That entropy will spawn a mind like yours
  Before it builds a sun or spins a star.
  You trust the light that brings you news from home.

  A single skull is cheaper than a cosmos,
  So random noise should swamp the ordered past,
  Yet here you stand with galaxies behind.
  You trust the light that brings you news home.

  But freaks don't carry consistent histories,
  They flicker out before the next breath lands,
  While you recall the road that led you here.
  You trust the light that brings you home.

  Tomorrow arrives exactly as predicted,
  No static tearing at the edges of sight,
  A continuity too vast for chance.
  You trust the light that brings home.

  If endless time makes monsters of us all,
  Then throw the endless time into the fire,
  Don't let the math dissolve the ground you walk.
  You trust the light brings home.

  Demand a world that ends before it rots,
  Where history is heavier than a thought,
  And bind yourself to laws that hold you fast.
  You trust the light that brings you home for good.
