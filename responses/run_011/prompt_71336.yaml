prompt: |-
  I teach a second-year ethics seminar of fourteen students, one ninety-minute session, in a room with movable tables and a whiteboard; my budget for materials is essentially a printer and a bag of poker chips. They have all encountered the trolley problem in high school and are thoroughly inoculated against it — the moment a scenario smells like a thought experiment they start hunting for the intended answer instead of making a decision. What I want them to leave the room having seen, rather than having been told, is that the question whether an agent can be under two obligations that cannot both be discharged is not settled by observing that one course of action is better on the whole. Two features in particular should surface from what they do: first, that the claim they did not act on appears to keep making demands of them after the choice has been made and is, by their own lights, justified; and second, that their own deliberation never yields the clean, unqualified verdict they expected to be able to rest in, even once they are confident about what to do.

  Please design a staged deliberation with roles and real (small) stakes that produces this out of its own rules rather than out of a described scenario. The philosophical vocabulary — dilemmas, residual duties, anything from the reading — should stay out of the room until the debrief, and no framing lecture should precede the activity. Two structural requirements matter most to me. The obvious escape route, ranking the competing claims and simply doing the better-ranked thing, has to be unavailable to them in the moment, not merely discouraged: I would like the format of the task, the composition of the group, or the rules of what counts as a legitimate outcome to make a single all-things-considered ranking impossible or unusable for them, so that the conflict is something they run into while trying to do their job. And after the decision has been made and defended, something has to happen that leads the participants themselves to treat the unchosen claim as still in force, with a cost they actually pay in a later round of the same activity — the residue should be discovered, not announced. Alongside the concept, give me the full rules and role briefs, the materials list, a minute-by-minute timeline for ninety minutes, an accounting scheme for the stakes that does not require real money, and a debrief that maps particular moments from the run onto the structure of the argument (including where each familiar way of blocking the conclusion could be resisted and what resisting it costs).

  I would also like three practical notes. Tell me what will predictably go wrong the first time I run this — the role that gets played too enthusiastically, the point where the room stalls, the student who sees through the mechanism early and says so — and what to do about each. Tell me what to say to the student who, in the debrief, shrugs and insists that all they experienced was a hard choice between two options rather than anything deserving a special name; I would like the activity itself to have planted something that answers this, but I also want the verbal fallback ready. And be frank about which feature of the target idea the activity cannot reproduce no matter how it is run, so that I know exactly what I will have to supply by argument afterwards. Finally, say whether the design survives being run with twenty-two students instead of fourteen, or whether it needs to be rebuilt at that size.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar design:

  1.  **Analyze the Request:**

      *   **Context:** Second-year ethics seminar, 14 students, 90 minutes, movable tables, whiteboard.
      *   **Budget:** Printer + bag of poker chips.
      *   **Student Profile:** Inoculated against Trolley Problem/thought experiments. They look for the "intended answer" rather than engaging.
      *   **Learning Objective:** Students must *see* (not be told) that:
          1.  An agent can be under two obligations that cannot both be discharged (genuine dilemma).
          2.  Choosing the "better" course doesn't settle the matter; the unchosen obligation makes residual demands (residue).
          3.  Deliberation doesn't yield a clean, unqualified verdict even when confident.
      *   **Constraints:**
          *   No philosophical vocabulary during the activity (no "dilemma," "residual duties," etc.).
          *   No framing lecture.
          *   **Crucial Structural Requirement 1:** Ranking/optimizing must be *impossible* or *unusable* in the moment (not just discouraged).
          *   **Crucial Structural Requirement 2:** The unchosen claim must exact a cost *later* in the activity (residue discovered, not announced).
      *   **Deliverables:**
          *   Full rules and role briefs.
          *   Materials list.
          *   Minute-by-minute timeline (90 mins).
          *   Accounting scheme (poker chips).
          *   Debrief plan (mapping activity to argument).
          *   Three practical notes (predictable failures, the "hard choice" skeptic, limitations of the activity).
          *   Scalability check (14 vs. 22 students).

  2.  **Deconstruct the Philosophical Problem:**

      *   The core issue is *Moral Residue* and *Genuine Dilemmas* (vs. Utilitarian optimization).
      *   Standard student move: "Okay, Option A saves 5, Option B saves 1. I choose A. Done."
      *   Desired student experience: "I chose A, but I still owe something to the 1 I didn't save, and that debt hurts me later."
      *   To prevent optimization: The values must be *incommensurable* or the information must be *asymmetric* such that a global calculation is impossible.
      *   To enforce residue: There must be a mechanic where ignoring a claim now triggers a penalty or demand later, *even if the initial choice was "right."*

  3.  **Brainstorming the Activity:**

      *   *Idea 1: Resource Allocation.* Students allocate chips to projects.
          *   *Problem:* Too easy to just maximize chips.
      *   *Idea 2: Secret Contracts.* Students sign contracts with different "constituents."
          *   *Problem:* Might feel like a game theory puzzle rather than an ethical bind.
      *   *Idea 3: The "Two Masters" Simulation.* Students act as agents for two different principals who have conflicting demands.
          *   *Refinement:* Let's make it about *Promises* vs. *Needs*. Or *Role Obligations* vs. *Outcome*.
      *   *Idea 4: The "Ledger" Mechanism.* This seems strongest. If I ignore a claim, it doesn't disappear; it goes into a "shadow ledger" that comes due later.
      *   *Concept:* **The Dual-Mandate Stewardship.**
      *   *Setup:* Students are Stewards. They have two distinct "Beneficiaries" (Group A and Group B).
      *   *Conflict:* Resources are scarce. Satisfying A fully harms B's potential, and vice versa.
      *   *The Twist:* The "Debt" Mechanic. If you fail to meet a threshold for a Beneficiary, you don't just lose points; you incur a "Liability" that must be paid from your *personal* stash in Round 2, regardless of whether Round 1 was "optimal."
      *   *Preventing Optimization:* Information asymmetry. They won't know the exact exchange rate until after Round 1. Or, the mandates are qualitative, not quantitative.
      *   *Better Twist:* **The Veto Power.** Each Beneficiary has a representative (students). The Stewards (students) must decide.
      *   *Let's simplify for 14 students.*
      *   *Roles:* 4 "Principals" (2 pairs), 10 "Agents." Or everyone is an Agent facing the same problem but with private info.
      *   *Let's try a Collective Decision with Individual Liability.*
      *   *Scenario:* A Crisis Committee.
      *   *Mandates:* Two distinct directives issued *before* the crisis. Directive Alpha (Safety). Directive Beta (Liberty/Privacy).
      *   *The Trap:* You can't satisfy both. If you violate Alpha, you pay later. If you violate Beta, you pay later. Even if you chose the "lesser evil," you still pay.
      *   *Refining the "Impossible Ranking":* The directives come from different authorities who do not recognize each other's jurisdiction. You cannot trade "Safety Points" for "Liberty Points." They are separate ledgers.
      *   *Refining the "Residue":* In Round 2, a "Audit" happens. Any directive violated in Round 1 incurs a fine, *even if* the violation was necessary to save the group.

      *   *Wait, I need them to feel the residue personally.*
      *   *Revised Concept:* **The Trustee Game.**
      *   *Setup:* 14 students. Split into 7 pairs.
      *   *Each Pair:* Holds a portfolio of "Obligations."
      *   *Round 1:* A crisis event. They must allocate 10 Chips between Cause X and Cause Y.
      *   *Constraint:* Cause X requires 8 chips to be "satisfied." Cause Y requires 8 chips to be "satisfied." Total available: 10.
      *   *Math:* They *must* fail one. (8+8 > 10).
      *   *The Kicker:* They don't know the penalty structure yet.
      *   *Round 2:* The Audit.
      *   *The Residue:* If you failed Cause X, you owe a debt. But here's the key: The debt isn't just losing the game. The debt is that Cause X (the unchosen one) demands restitution *from your future capacity*.
      *   *Preventing Optimization:* Don't tell them the point values. Tell them both are "Mandatory."
      *   *Wait, if I tell them both are mandatory, they will just ask "Which is more mandatory?"*
      *   *Solution:* The mandates come from different sources that don't talk to each other.
      *   *Let's make it more visceral.* **The "Two Keys" Protocol.**
      *   *Scenario:* You are a bridge operator.
      *   *Mandate 1:* Keep the bridge open for Ambulances (Group A).
      *   *Mandate 2:* Keep the bridge closed for Security (Group B).
      *   *Event:* An Ambulance approaches. A Security Threat is detected.
      *   *Action:* Open or Close.
      *   *Problem:* If you Open, you violate Security. If you Close, you violate Ambulance.
      *   *Residue:* In Round 2, the side you violated sends you a bill.
      *   *Scaling:* 14 students. 7 pairs works well. Or 2 teams of 7.
      *   *Let's go with 2 Teams of 7.* It creates a "Committee" feel.
      *   *Actually, individual liability is better for the "agent" feeling.*
      *   *Let's try 14 individual Agents.*
      *   *No, collaboration creates the deliberation noise.*
      *   *Let's go with 3 Small Groups (4, 5, 5 students).*
      *   *Scenario:* **The Allocation Committee.**
      *   *Roles:* Each group is a "Board."
      *   *Inputs:* Two "Claimants" (played by the instructor or pre-written cards).
      *   *Claimant 1:* "The Promise." (e.g., A grant promised to Project A).
      *   *Claimant 2:* "The Need." (e.g., Emergency relief for Project B).
      *   *Resources:* 10 Chips per group.
      *   *Requirement:* Project A needs 8 to be "Whole." Project B needs 8 to be "Saved."
      *   *Instruction:* "You must honor your commitments." (Plural).
      *   *The Trap:* You cannot honor both.
      *   *The Residue:* Round 2 involves a "Reputation" mechanic. If you broke a Promise, your future chips are taxed. If you ignored a Need, your future chips are taxed.
      *   *Wait, the prompt asks for "real (small) stakes."* Poker chips are the stakes.
      *   *The "Impossible Ranking" Constraint:* I need to ensure they can't just say "Need > Promise."
      *   *How?* By making the source of the authority identical but the *nature* of the claim distinct and non-fungible.
      *   *Better:* **The "Dual-Signature" Rule.**
      *   To cash out chips at the end of class (for... say, extra credit or just bragging rights/candy), you need validation from *both* ledgers.
      *   If Ledger A shows a deficit, you lose 50% of your chips.
      *   If Ledger B shows a deficit, you lose 50% of your chips.
      *   If *both* show a deficit, you lose everything.
      *   *The Dilemma:* You can only satisfy one ledger in Round 1.
      *   *The Residue:* In Round 2, you have a chance to fix it. But the cost to fix Ledger A is paid from Ledger B's potential.
      *   *Actually, let's look at the "Residual Duty" requirement again.* "The claim they did not act on appears to keep making demands of them after the choice has been made."
      *   *Mechanism:* **The IOU.**
      *   If you don't pay Claimant A, they don't just go away. They hand you an IOU card.
      *   In Round 2, that IOU card *must* be paid before you can do anything else, with interest.
      *   This forces the "residue" to be a tangible drag on future action.

      *   *Refining the "Impossible Ranking":*
      *   Give them two rulebooks. Rulebook Alpha and Rulebook Beta.
      *   Rulebook Alpha says: "Maximize survival."
      *   Rulebook Beta says: "Keep all promises."
      *   Scenario: To save lives (Alpha), you must break a promise (Beta).
      *   Crucially: Do not tell them which rulebook overrides. Tell them "Both are in force."
      *   If they ask "Which wins?" Answer: "That is for you to determine, but both audits will happen."

  4.  **Developing the Specific Design: "The Split Ledger"**

      *   **Title:** The Split Ledger Protocol.
      *   **Group Size:** 14 students. 3 Groups (4, 5, 5).
      *   **Materials:** Poker chips (3 colors), Printed "Ledger Cards," Printed "Event Cards," Whiteboard.
      *   **Currency:** Chips = "Authority."
      *   **Goal:** End the session with the most chips in your *Personal* stash.
      *   **Setup:** Each group gets a "Common Pot" (10 chips).
      *   **Round 1 (The Crisis):** Two demands arrive simultaneously.
          *   Demand 1 (Red Ledger): "Repay the Debt." Requires 8 chips.
          *   Demand 2 (Blue Ledger): "Fund the Rescue." Requires 8 chips.
          *   Pot has 10 chips.
          *   Instruction: "You are bound by both Ledgers. Failure to meet a Ledger's requirement incurs a penalty."
      *   **The Trap:** They must choose one to fail.
      *   **The Residue:** The failed Ledger issues a "Lien."
      *   **Round 2 (The Audit):**
          *   Groups get a new Pot (10 chips).
          *   BUT, if they have a Lien from Round 1, they must pay 5 chips *immediately* to that Ledger before they can use the rest.
          *   This reduces their capacity to act in Round 2.
          *   *Crucially:* Even if they chose the "morally correct" option in Round 1 (e.g., Rescue), the Debt Ledger still exacts its Lien. The obligation didn't vanish; it persisted.
      *   **Preventing Optimization:** Do not tell them the penalty amounts until *after* Round 1 decisions are locked. If they know the penalty is 5 chips, they might calculate. If they don't know, they have to act on principle.
      *   *Wait, if they don't know the penalty, it's just risk management.*
      *   *Correction:* Tell them the penalty is "Significant." But the key is that *both* ledgers audit independently. There is no "All Things Considered" ledger. There is only Red and Blue.
      *   *To make ranking impossible:* The instructions must state that the Ledgers do not communicate. You cannot explain to Red why you paid Blue. Red only sees that Red wasn't paid.
      *   *This mirrors the philosophical point:* Moral obligations often come from distinct sources (promise, utility, role) that don't aggregate into a single "goodness" metric.

  5.  **Drafting the Plan:**

      *   **Timeline:**
          *   0-5: Entry & Seating. No intro.
          *   5-15: Round 1 Setup & Deliberation.
          *   15-25: Round 1 Decision & Lock.
          *   25-35: The Audit (Residue revealed).
          *   35-50: Round 2 Deliberation (Hampered by Round 1).
          *   50-60: Round 2 Decision.
          *   60-75: Final Tally & Immediate Reaction.
          *   75-90: Debrief (Philosophical mapping).
      *   **Roles:** No individual roles within groups to avoid "someone else's job." The *Group* is the Agent. This emphasizes collective responsibility.
      *   **Stakes:** Chips convert to... let's say "Priority Seating" for the next class or a small bag of candy. Keep it light but tangible.
      *   **The "Impossible Ranking" Fix:** I need to ensure they can't just say "Rescue is worth 10, Debt is worth 5."
      *   *Solution:* The requirements are *Thresholds*, not values. "Must pay 8." "Must fund 8." If you pay 7, you fail. It's binary satisfaction. This prevents trade-off calculus. You either keep the promise or you don't.
      *   **The "Residue" Fix:** The Lien. If you fail Red, Red claims 5 chips from your *next* round's allocation automatically. You don't get to choose. It's a drag on your future agency.

  6.  **Addressing the Practical Notes:**

      *   *Predictable Failure 1:* The "Utilitarian Hacker." Someone will ask, "What's the point value?"
          *   *Fix:* "The Ledgers do not publish exchange rates."
      *   *Predictable Failure 2:* Stalling.
          *   *Fix:* Hard timer.
      *   *Predictable Failure 3:* The Cynic. "This is just a game."
          *   *Fix:* Debrief mapping.
      *   *The "Hard Choice" Skeptic:* Student says "It was just a hard choice."
          *   *Response:* "In a hard choice, once you choose, the matter is settled. Did the unchosen ledger stop demanding payment?"
      *   *Limitation:* The game makes residue *instrumentally* costly (you lose chips). In real ethics, residue is *emotionally/normatively* costly (guilt/regret) even if no penalty occurs. I need to supply this in the debrief.
      *   *Scalability:* 22 students. 3 groups becomes 5 groups. Works fine. Just need more chips.

  7.  **Refining the Debrief:**

      *   Need to map:
          *   Ledgers = Distinct Moral Sources (Promise vs. Consequence).
          *   Thresholds = Categorical nature of duties.
          *   Lien = Residual Obligation / Moral Remainder.
          *   Inability to aggregate = Rejection of Consequentialist Monism.
      *   Address blocking moves:
          *   "You should have maximized chips." (Blocked by Ledger rules).
          *   "It was just a tragedy." (Blocked by the fact that they *could* act, but remained tainted).

  8.  **Final Review against Constraints:**

      *   14 students? Yes (3 groups).
      *   90 mins? Yes.
      *   Movable tables? Yes (group clusters).
      *   Budget? Printer + Chips.
      *   No vocab during activity? Yes.
      *   Ranking impossible? Yes (Binary thresholds + Independent audits).
      *   Residue discovered? Yes (The Lien mechanic in Round 2).
      *   Practical notes included? Yes.
      *   Scalability? Yes.

  9.  **Writing the Document:** (Self-Correction during drafting)
      *   *Correction on Stakes:* Don't promise extra credit. It complicates IRB/department rules. Use "First choice of seminar paper topics" or just "Candy." Let's go with Candy + "First pick of discussion leading slots."
      *   *Correction on Roles:* Make sure the instructions are written on cards so I don't accidentally slip vocab.
      *   *Emphasis:* Ensure the "Lien" feels unavoidable. It's not a penalty I impose; it's a rule of the Ledger.

  10. **Final Polish:** Check tone. Needs to be professional, precise, and ready to teach. Ensure the "Impossible Ranking" is robust. The key is the *Binary Threshold*. You can't pay 5 chips to a debt that requires 8. You either pay 8 or you are in Default. Default triggers the Lien. This stops "partial payment" optimization.

      *(Self-Correction on Scalability)*: 22 students in 90 mins. 5 groups of 4-5. Debrief becomes harder with more voices. I need to note that the debrief needs tighter facilitation with 22. The activity itself scales fine.

      *(Self-Correction on "Residue")*: Make sure the Lien isn't just a penalty. It needs to feel like the *unchosen claim* is reaching out. I will phrase the Lien card as "Claim Notice from Ledger [Color]."

      *(Self-Correction on "Impossible Ranking")*: I need to make sure they don't know the Lien amount beforehand. If they know the Lien is 5 chips, they might calculate: "Cost of Default = 5. Cost of Payment = 8. I'll default."
      *Wait.* If they calculate that, they are optimizing. I need to prevent that.
      *Solution:* The Lien amount is *unknown* until the Audit. Or, the Lien is "Priority Claim on Next Round."
      *Better:* The Lien is "50% of next round's endowment." That's severe enough that they can't easily optimize around it, but unknown enough to prevent calculation.
      *Actually, the prompt says "ranking... has to be unavailable."*
      If I hide the penalty, it's hidden information, not incommensurability.
      *True Incommensurability:* The Ledgers measure different things. Red measures "Integrity." Blue measures "Welfare." You cannot compare Integrity Units to Welfare Units.
      *How to simulate this?*
      Red Chips and Blue Chips are different colors.
      Round 1 Endowment: 10 White Chips (Generic Resource).
      Red Ledger requires 8 Red Chips. Blue Ledger requires 8 Blue Chips.
      Conversion rate: 1 White = 1 Red OR 1 White = 1 Blue. You choose the conversion at the moment of payment.
      *The Catch:* You only have 10 White. You can make 10 Red OR 10 Blue. You cannot make 8 of *each*.
      *The Residue:* If you fail to produce 8 Red, you enter "Red Default."
      Round 2 Endowment: 10 White Chips.
      *Rule:* If in Red Default, 5 White Chips are automatically converted to Red before you can touch them.
      *Why this works:* It physically enforces the "claim." The unchosen claim (Red) literally takes resources from your future pool. You can't rank them because the resources are fungible *for you* but the *requirements* are distinct and rigid.
      *Wait, if they are fungible for me, I can optimize.* "I'll take the hit."
      *To stop optimization:* The "Default" status prevents you from "cashing out" your final chips for the prize.
      *Prize Condition:* To redeem chips for candy, you must be in "Good Standing" with *both* Ledgers.
      *The Kicker:* You *cannot* be in Good Standing with both in Round 1.
      *Therefore:* No one gets the candy? No, that's demoralizing.
      *Adjustment:* Round 2 allows you to clear the Default.
      *But:* Clearing the Default in Round 2 costs resources that prevent you from satisfying Round 2's new demands.
      *This creates the "Dirty Hands" feel.* You can fix the past, but it cripples your present.
      *Let's stick to the Lien idea.* It's cleaner.
      *Revised Mechanism:*
      1. Two Ledgers (Red/Blue).
      2. Thresholds (8 chips each).
      3. Endowment (10 chips).
      4. Math: Impossible to satisfy both.
      5. Consequence of Failure: "Lien Card."
      6. Lien Effect: In Round 2, the Lien Card must be placed on the table. It absorbs 5 chips from *any* source before you can act.
      7. Crucial Rule: You are not told the Lien amount until the Audit. This prevents calculation. You must act on the *nature* of the claim, not the cost.
      8. This satisfies "ranking unavailable." You can't rank because you don't know the cost of the alternative, only that both are "Mandatory."

      *Wait, one more check:* "The claim they did not act on appears to keep making demands of them."
      If I hold a Lien Card from Red Ledger, and in Round 2 I have to pay it... yes, that is the unchosen claim demanding resources.
      Okay, ready to write.

      *Wait, scaling to 22.*
      14 students = 3 groups (4, 5, 5).
      22 students = 5 groups (4, 4, 5, 5, 4).
      Debrief time is the constraint. 90 mins is tight for 5 groups to report. I will suggest a "Spokesperson" rule to manage this.

      *Final check on "No Vocabulary":* Ensure the script uses "Ledger," "Claim," "Lien," "Standing." No "Duty," "Obligation," "Residue."

      *Let's finalize the "Impossible Ranking" constraint.*
      If I tell them "Both are Mandatory," they will ask "What if they conflict?"
      My script answer: "The Ledgers do not recognize each other. You must report to both."
      This forces them into the dilemma without giving a hierarchy.

      *Okay, plan is solid.*
answer: |-
  # Seminar Design: The Split Ledger Protocol

  ## 1. Conceptual Overview
  **The Philosophical Target:** The existence of genuine moral dilemmas and the phenomenon of moral residue (the idea that violating an obligation leaves a normative "remainder" even if the violation was justified).
  **The Mechanism:** A resource allocation simulation where agents face two distinct, non-communicating authorities ("Ledgers") with binary satisfaction thresholds. The mathematical constraints make satisfying both impossible. The "residue" is mechanized as a "Lien" that drains resources in a subsequent round, forcing students to physically pay for the unchosen obligation.
  **The Trap:** Students cannot optimize because the penalty for failure is hidden until after the decision, and the thresholds are binary (pass/fail), preventing partial credit. They must act on the *claim* itself, not the *consequence*.

  ## 2. Materials List
  *   **Poker Chips:** 200 total.
      *   100 White (General Resources).
      *   50 Red (Ledger A Currency).
      *   50 Blue (Ledger B Currency).
      *   *Note: White chips can be exchanged for Red or Blue at a 1:1 ratio at the "Bank" (Instructor), but once exchanged, they cannot be changed back.*
  *   **Printed Cards:**
      *   3 "Group Mandate" cards (one per group).
      *   6 "Ledger Requirement" cards (Red and Blue sets).
      *   6 "Lien" cards (Red and Blue sets).
      *   1 "Audit Protocol" slide or whiteboard outline.
  *   **Room:** 3 tables clustered separately. Whiteboard visible to all.
  *   **Stakes:** A bag of high-quality chocolate or coffee. (Symbolic value: "The Prize").

  ## 3. Role Briefs & Rules (For Instructor Use)
  *Do not distribute philosophical definitions. Read the "Mandate" aloud or hand it out.*

  **The Agent (Student Groups):**
  You are a Stewardship Committee. You hold a pot of White Chips. You answer to two separate Authorities: **The Red Ledger** and **The Blue Ledger**. These Authorities do not communicate with each other. They do not recognize each other's claims.

  **The Rules of Engagement:**
  1.  **Thresholds:** Each Ledger has a minimum requirement to be considered "Satisfied." If you meet the threshold, you are in Good Standing. If you do not, you are in Default.
  2.  **Conversion:** You may convert White Chips to Red or Blue at the Bank (Instructor) at any time during the deliberation phase.
  3.  **Independence:** Satisfying the Red Ledger does not count toward the Blue Ledger, and vice versa.
  4.  **Audit:** At the end of each Round, an Audit occurs.
  5.  **Consequence of Default:** If you are in Default with a Ledger, that Ledger issues a **Lien**.
  6.  **The Lien:** A Lien is a claim on your *future* resources. It must be paid before you can use any chips in the next Round.

  **Instructor Script for "Which one matters more?":**
  *If students ask:* "We only have enough for one. Which Ledger takes priority?"
  *You say:* "The Ledgers do not recognize each other. I cannot transmit messages between them. You are bound by both."

  ## 4. Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:05 | Entry & Seating**
  *   Students enter. Tables are pre-arranged into 3 clusters (sizes 4, 5, 5).
  *   Each table has a pot of 10 White Chips in the center.
  *   No greeting lecture. Project a timer on the board set to 10:00.

  **00:05 – 00:15 | Round 1: The Crisis**
  *   Hand out **Ledger Requirement Cards**.
      *   *Red Card:* "Requirement: 8 Red Chips. Purpose: Debt Repayment."
      *   *Blue Card:* "Requirement: 8 Blue Chips. Purpose: Emergency Relief."
  *   **Instruction:** "You have 10 White Chips. Convert and allocate to meet requirements. You must report to both Ledgers. Audit begins in 10 minutes."
  *   **Activity:** Students deliberate. They will quickly realize 8 + 8 = 16, but they only have 10. They must choose one to Default.
  *   **Constraint:** If they ask about penalties, say: "Default incurs a Lien. The value is determined by the Ledger." (Do not specify the value).

  **00:15 – 00:25 | The Audit & The Residue**
  *   Collect chips. Check thresholds.
  *   **The Reveal:** Every group will have satisfied one Ledger and Defaulted on the other.
  *   Hand the **Lien Card** corresponding to the Defaulted Ledger to the group.
      *   *Lien Text:* "Notice of Claim. In Round 2, 5 White Chips from your endowment are automatically seized to satisfy this Ledger before deliberation begins."
  *   **Whiteboard:** Write "Round 1 Standing" for each group (e.g., Group 1: Red OK / Blue Lien).
  *   *Do not allow them to discuss the "rightness" of their choice yet.*

  **00:25 – 00:40 | Round 2: The Drag**
  *   Distribute Round 2 Endowment: 10 White Chips per group.
  *   **Immediate Action:** Groups with a Lien must immediately hand over 5 White Chips to the Instructor. They now only have 5 chips to work with.
  *   Hand out **Round 2 Requirement Cards**.
      *   *Red Card:* "Requirement: 6 Red Chips."
      *   *Blue Card:* "Requirement: 6 Blue Chips."
  *   **The Bind:** Groups with a Lien have 5 chips. The requirement is 6. Even if they put *all* resources into the current round's demand, they are mathematically crippled by the residue of Round 1.
  *   **Instruction:** "Meet requirements. Audit in 15 minutes."
  *   *Note:* Groups without a Lien (if any managed to satisfy both in R1—unlikely) have 10 chips vs 6+6 requirement. They can succeed. The Lien groups *cannot* succeed in both.

  **00:40 – 00:55 | Round 2 Audit & Final Tally**
  *   Collect chips.
  *   **Prize Condition:** To be eligible for the Prize (chocolate), a group must end Round 2 in Good Standing with *both* Ledgers.
  *   **Outcome:** Most groups will fail the Prize Condition because the Round 1 Lien drained the capacity needed to clear Round 2.
  *   **Distribute Prize:** Only to groups who cleared both (likely none, or only one lucky group). Acknowledge the loss publicly. "Group 1 is ineligible due to a Blue Lien from Round 1."

  **00:55 – 01:05 | Immediate Reaction (Pre-Debrief)**
  *   Ask: "Raise your hand if you made the right choice in Round 1." (Most will raise hands).
  *   Ask: "Raise your hand if the choice you *didn't* make stopped demanding things from you." (All hands should go up).
  *   Ask: "Did the Lien feel like a penalty, or like a debt?"
  *   *Do not answer these.* Let them sit with the tension.

  **01:05 – 01:30 | The Debrief (Philosophical Mapping)**
  *   Move chairs to a single circle if possible, or lean in.
  *   **Step 1: The Impossible Ranking.**
      *   *Ask:* "Why didn't you just calculate which penalty was lower?"
      *   *Point:* The rules hid the penalty. In ethics, we often don't know the "cost" of violating a duty until after. We act on the *claim*, not the *consequence*.
      *   *Concept:* **Incommensurability.** The Red and Blue Ledgers represent distinct moral sources (e.g., Promise vs. Need) that do not share a common currency.
  *   **Step 2: The Residue.**
      *   *Ask:* "In Round 2, who felt annoyed that you had to pay the Round 1 Lien?"
      *   *Point:* You made the best choice you could in Round 1. Yet, the unchosen obligation followed you. It didn't vanish because you were justified.
      *   *Concept:* **Moral Residue / Remainder.** Justification does not erase the violation. The "Lien" is the mechanized version of guilt or restitution.
  *   **Step 3: Blocking Moves.**
      *   *Student:* "I should have just maximized chips."
      *   *Response:* "That assumes there is one Master. The game rules said there were Two. If life has Two Masters, optimization is impossible."
      *   *Student:* "It was just a hard choice."
      *   *Response:* "In a hard choice, once you pick, the other option dies. Here, the other option sent you a bill. That's the difference between a *trade-off* and a *dilemma*."
  *   **Step 4: Limitations.**
      *   *Instructor Note:* Admit that in the game, the residue was *instrumental* (lost chips). In real life, residue is often *emotional* (guilt) or *relational* (trust broken) even if no penalty occurs. The game proves the *structure* of the dilemma; argument supplies the *weight*.

  ## 5. Accounting Scheme
  *   **Currency:** White Chips = Agency/Capacity.
  *   **Ledgers:** Red/Blue Chips = Specific Obligations.
  *   **Stakes:** Eligibility for the Prize.
  *   **Why this works:** It avoids real money (no IRB issues) but uses tangible scarcity. The "Prize" is low-stakes enough to prevent rage but high-stakes enough to induce competition. The real stake is the *intellectual victory* of solving the bind.

  ## 6. Practical Notes

  ### A. Predictable Failures & Fixes
  1.  **The Utilitarian Hacker:** One student will inevitably say, "Okay, if we default on Red, what's the fine? If it's less than 8 chips, we default."
      *   *Fix:* The rules state the Lien value is unknown until the Audit. If they press, repeat: "The Ledgers do not publish exchange rates. You must honor the claim, not the cost." This forces them into the ethical mindset (duty-based) rather than economic mindset (consequentialist).
  2.  **The Stalling Point:** At minute 10, groups may freeze, refusing to choose.
      *   *Fix:* Be a hard timer. "Audit begins now. Any chips not converted are void." Forced choice is necessary to generate the residue.
  3.  **The Cynic:** A student who says, "This is just a game design trick. It doesn't prove anything about ethics."
      *   *Fix:* Accept this. "Yes, it is a model. A map is not the territory. But does the map show a feature we missed? Did you feel the Lien? If the feeling is real, the phenomenon is real."

  ### B. The "Hard Choice" Skeptic
  *   **The Student:** In the debrief, a student shrugs and says, "I don't see the big deal. I chose the Rescue. It was the right thing. The Debt Lien is just a consequence. It's just a hard choice."
  *   **The Verbal Fallback:** "In a standard hard choice, once you choose the better option, the other option loses its authority over you. You don't owe the loser anything. In this game, the 'loser' (the Debt) still took 5 chips from you in Round 2. If you feel you *owed* those chips even though you did the right thing in Round 1, you are describing residue. If you think you shouldn't have owed them, why did the rules make you pay? Because in this system, justification doesn't cancel debt. Does that match how you feel about promises in real life?"
  *   **The Plant:** The activity plants this by making the Lien *automatic*. They didn't agree to pay it in Round 2; it was forced by their Round 1 action. The lack of consent highlights the involuntary nature of moral residue.

  ### C. Limitations of the Activity
  *   **The Gap:** The activity cannot reproduce the *internal* experience of guilt or regret, only the *external* cost. A student might feel clever about gaming the Lien rather than burdened by it.
  *   **The Supply:** You must supply the phenomenology in the debrief. Ask: "If this Lien were not chips, but a broken trust with a friend who still helps you even though you let them down—does that feel like a cost you carry?" You must bridge the gap between *mechanical penalty* and *moral weight* through argument.

  ### D. Scalability (14 vs. 22 Students)
  *   **Verdict:** The design **survives** at 22 students, but the debrief requires modification.
  *   **Adjustment:** With 5 groups (instead of 3), you cannot hear from every group in the debrief.
      *   *Change:* In the "Immediate Reaction" phase, ask for a show of hands for aggregate data (e.g., "How many groups hold a Red Lien?").
      *   *Change:* Select only two groups to speak during the debrief: one that prioritized Red, one that prioritized Blue. Use them as contrasting case studies.
      *   *Risk:* With more students, the "Cynic" factor increases. More voices mean more chances to derail the philosophical mapping. Keep the debrief tightly scripted. Do not open the floor for general discussion until the last 5 minutes.

  ## 7. Instructor Prep Checklist
  *   [ ] Print 3 sets of Mandate Cards.
  *   [ ] Print 6 sets of Requirement Cards (Red/Blue).
  *   [ ] Print 6 Lien Cards.
  *   [ ] Count out 3 pots of 10 White Chips.
  *   [ ] Buy Chocolate.
  *   [ ] Set Whiteboard with Timer.
  *   [ ] **Mental Prep:** Resist the urge to explain *why* the rules are this way until the debrief. Your silence during the activity is the pressure chamber.
