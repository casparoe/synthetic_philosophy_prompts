prompt: |-
  I'm drafting a section of a paper on standing to blame and I need a thought experiment built to a fairly awkward spec. The usual cases here are all varieties of the hypocrite — the manager who lectures about lateness while strolling in at ten, the parent screaming about screen time with a phone in her hand — and those are too easy, because every account of lost standing can explain them. I dont want a closet hypocrite either: no secret vice, no self-deception, no hidden double standard. I want a blamer who loses standing without ever having done anything wrong and without anyone being in a position to know it.

  Specs:

  - One or two paragraphs for the scenario itself. Realistic setting — a workplace, a school, a professional body, a neighbourhood panel, your pick. No sci-fi, no telepathy, no character who can peer into possible worlds.
  - The blamer holds a role whose job partly consists in blaming: a chair, a referee, an ombud, a head of department. I want the case to make it live whether occupying an office gives you standing that your own dispositions would otherwise deny you.
  - He has never once violated the norm he's invoking, and in everything that has actually happened he's treated like cases exactly alike. Verifiably clean, with a paper trail to prove it.
  - But there's a counterfactual situation he simply has never been in — something like the wrongdoer turning out to be his brother rather than a stranger — in which he would have excused the identical conduct, warmly and without strain. The disposition is real; it's just never been tested, so there's no evidence of it for anyone, him included.

  Then run the check. State the norm, the conduct, and the two parties precisely, and say what each position predicts: the plain hypocrisy diagnosis, the view that blame is a kind of moral demand and standing is about being entitled to make it, the view that what matters is how you'd treat people across merely possible situations rather than how you have, and a sceptic who thinks all this standing talk is character assessment in a costume. Which one gets the intuition Im describing, which has to bite a bullet, and be honest if one of them dissolves the case rather than answering it.

  Then tell me which single feature is doing the work — the untestedness, the special relationship, or the fact that the norm invoked is one of impartiality — and do the removals: actualize the counterfactual and say whether the case has collapsed back into ordinary hypocrisy; swap the brother for a colleague he merely likes; swap the norm for one where partiality is permitted. If any removal makes the intuition evaporate, say so, since that would suggest standing is tracking the norm rather than the blamer.

  Finish with the best attack a defender of the actual-conduct view could make: is the case smuggling in knowledge, moral luck, or something else? I need that objection in hand before I put this in front of a room.
reasoning: |-
  Here's a thinking process that leads to the suggested thought experiment and analysis:

  1.  **Analyze the Request:**
      *   **Topic:** Standing to blame.
      *   **Goal:** Create a specific thought experiment (case study) that challenges standard accounts of lost standing.
      *   **Constraints/Specs:**
          *   1-2 paragraphs, realistic setting (workplace, school, etc.).
          *   Blamer holds a role involving blaming (chair, referee, etc.).
          *   Blamer has *never* violated the norm (verifiably clean).
          *   Blamer has *not* treated similar cases differently in actuality.
          *   **Crucial Twist:** There is a *counterfactual* situation (e.g., wrongdoer is a brother) where the blamer *would* have excused the conduct, but this has never been tested. No one knows this disposition, not even the blamer necessarily (though the prompt says "disposition is real," implying a fact about his character).
          *   **Analysis Required:**
              *   State Norm, Conduct, Parties.
              *   Predictions from 4 views: Plain Hypocrisy, Moral Demand/Entitlement, Counterfactual Disposition, Skeptic (Character Assessment).
              *   Identify the working feature (untestedness, relationship, impartiality norm).
              *   Perform "Removals" (Actualize counterfactual, swap relationship, swap norm).
              *   Best objection from "Actual-Conduct View" defender.

  2.  **Drafting the Scenario:**
      *   *Setting:* Needs to be formal enough to have a "role" but personal enough for bias. A university Ethics Committee or a Hiring Panel works well. Let's go with a Departmental Hiring Committee Chair.
      *   *Norm:* Impartiality/Conflict of Interest rules. Specifically, recusing oneself when a candidate is a close relation.
      *   *Blamer:* Dr. Aris Thorne, Chair.
      *   *Wrongdoer:* Dr. Elena Vance, a committee member.
      *   *Conduct:* Vance failed to recuse herself when evaluating a candidate who was her former PhD student (a clear violation of the specific departmental bylaw).
      *   *Thorne's Record:* Thorne has chaired three previous hires. In every instance where a conflict existed, he recused himself. Paper trail is pristine.
      *   *The Counterfactual:* If the candidate had been Thorne's *own* former PhD student, he tells himself (and believes) he would have recused. But the deep truth (the "disposition") is that he would have rationalized it ("It's different because I know the rigor of my program") and stayed on the committee. He hasn't been tested because none of his students have applied.
      *   *Refining the Counterfactual:* The prompt asks for a situation he's *never been in* where he *would have excused* the conduct. So, Thorne blames Vance for not recusing. But if the roles were reversed (or if the candidate was his brother/student), he would have excused it. Let's make it about the *candidate relationship*.
      *   *Revision:* Thorne blames Vance for evaluating her niece. Thorne has never had a niece apply. If his niece had applied, he would have evaluated her anyway, telling himself it's fine.
      *   *Wait, check spec:* "He has never once violated the norm... in everything that has actually happened he's treated like cases exactly alike." Okay. "But there's a counterfactual situation... in which he would have excused the identical conduct."
      *   *Scenario:* Thorne (Chair) blames Vance (Member) for voting on a candidate who is her cousin. Thorne has never had a cousin apply. If his cousin had applied, he would have voted (excusing his own conduct).
      *   *Setting:* Tenure Committee.
      *   *Norm:* Strict impartiality regarding familial ties.

      *Drafting the text:*
      Dr. Aris Thorne chairs the University Tenure Committee. The bylaws strictly forbid voting on candidates with familial ties to committee members. When it emerges that member Dr. Elena Vance cast a vote for a candidate who is her first cousin, Thorne leads the censure. He drafts the formal reprimand, citing the erosion of institutional integrity. Thorne's record is spotless: in five years and twelve reviews, he has recused himself whenever even a distant professional connection arose. There is no actual evidence of bias. No one knows his inner dispositions. However, there is a fact about Thorne's psychology: had the candidate been his own brother, he would not have recused. He would have voted, rationalizing that family loyalty supersedes bureaucratic procedure in "exceptional cases." This scenario has never occurred; no brother has ever applied. Consequently, no one, including Thorne, knows he possesses this disposition. He blames Vance sincerely, believing himself impartial, but he lacks the counterfactual stability of principle.

  3.  **Running the Check (Analysis):**
      *   *Norm:* Impartiality/No familial voting.
      *   *Conduct:* Voting despite familial tie.
      *   *Parties:* Thorne (Blamer/Chair) vs. Vance (Wrongdoer/Member).
      *   *View 1: Plain Hypocrisy (Actual Conduct).* Thorne is clean. He has standing. (Fails to capture the intuition that he lacks standing).
      *   *View 2: Moral Demand/Entitlement (Darwall-style).* To demand, you must accept the demand applies to you. If he wouldn't accept it in the counterfactual, does he really accept it now? This view might say he lacks standing because his commitment is conditional.
      *   *View 3: Counterfactual Disposition (The "Intuition" View).* Standing requires robustness across possible worlds. He fails this. He lacks standing.
      *   *View 4: Skeptic (Character Assessment).* Standing is just a proxy for "is he a good person?" If he's dispositionally biased, he's flawed. But does that remove *standing* or just make him blameworthy too? The skeptic might say "standing" dissolves; it's just all about who is more blameworthy.

  4.  **Identifying the Working Feature:**
      *   Is it untestedness? Yes, because if it were tested, it's hypocrisy.
      *   Is it special relationship? Yes, brother vs. stranger.
      *   Is it the norm of impartiality? Yes, because if partiality were allowed, no issue.
      *   *Decision:* The core tension is between *actual compliance* and *counterfactual fragility* regarding an *impartiality norm*.

  5.  **Performing Removals:**
      *   *Actualize:* If his brother *had* applied and he *had* voted, it's standard hypocrisy. Intuition remains (no standing), but case becomes easy.
      *   *Swap Relationship:* If it was a colleague he likes (not family). Would he still excuse? If yes, intuition holds. If no (he'd recuse), intuition vanishes. This suggests the *bias* is the key, not the *family* tag specifically.
      *   *Swap Norm:* If the norm allowed partiality (e.g., "advocate for your allies"). Then Thorne blaming Vance makes no sense regardless of counterfactuals. The intuition that he lacks standing *specifically because of his disposition* evaporates because the norm doesn't demand impartiality. This suggests standing tracks the *norm's content*.

  6.  **The "Actual-Conduct" Defender's Attack:**
      *   What can they say? They must deny the relevance of counterfactuals.
      *   *Objection:* "Moral Luck / Epistemic Access." Standing is a social status, not a metaphysical property of the soul. If no one knows (including him), and he hasn't done it, treating him as lacking standing punishes him for moral luck (not having a brother apply). It conflates *being* a hypocrite with *having the potential to be* one. It makes standing unknowable.

  7.  **Refining and Polishing:**
      *   Ensure the tone is academic but sharp.
      *   Make sure the "Removals" section is clear about what evaporates.
      *   Check paragraph count for the scenario (1-2).
      *   Ensure the "Best Attack" is formidable.

      *(Self-Correction during drafting)*: I need to be careful with the "Thorne knows" aspect. The prompt says "him included" regarding evidence, but "The disposition is real." So Thorne *believes* he would recuse, but he is wrong about his own psychology. This adds a layer of self-ignorance which strengthens the "no actual hypocrisy" claim. I will emphasize that he *believes* he is impartial.

      *(Refining the "Removals")*: I need to be precise. If I swap the norm to one where partiality is permitted, Thorne blaming Vance is just *incorrect*, not lacking *standing*. So the intuition about *standing* evaporates because the blame itself becomes illegitimate. I need to frame this carefully. The intuition is about *standing*, not *correctness*. If the norm permits partiality, Vance did nothing wrong, so Thorne has no business blaming anyone. That dissolves the case entirely. I should focus on the relationship swap. If I swap "brother" for "random stranger," he would recuse. So the *special relationship* is doing the work.

      *(Refining the "Best Attack")*: The strongest objection is about the *function* of standing. Standing is about social relations. If the counterfactual is unknowable, it cannot regulate the social practice of blaming. Therefore, it's irrelevant to standing.

  8.  **Final Review against Specs:**
      *   1-2 paragraphs? Yes.
      *   Realistic setting? Yes (Tenure Committee).
      *   Role involves blaming? Yes (Chair).
      *   Never violated norm? Yes.
      *   Counterfactual excuse? Yes (Brother).
      *   Analysis sections included? Yes.
      *   Removals included? Yes.
      *   Objection included? Yes.

      *Let's write it.*
answer: |-
  **The Scenario**

  Dr. Aris Thorne chairs the University Tenure Committee, a role that grants him the authority to enforce procedural bylaws, including the censure of members who violate conflict-of-interest rules. The bylaws strictly forbid voting on candidates with familial ties to committee members. When it emerges that member Dr. Elena Vance cast a vote for a candidate who is her first cousin, Thorne leads the censure. He drafts the formal reprimand, citing the erosion of institutional integrity, and blocks her participation in future reviews. Thorne's record is spotless: in five years and twelve reviews, he has recused himself whenever even a distant professional connection arose. There is no actual evidence of bias; the paper trail confirms he has treated all actual cases exactly alike.

  However, there is a fact about Thorne's psychology that remains untested and unknown, even to himself. Had the candidate been his own brother, he would not have recused. He would have voted, rationalizing that family loyalty supersedes bureaucratic procedure in "exceptional cases," and he would have warmly excused this identical conduct in himself. This scenario has never occurred; no brother has ever applied. Consequently, no one, including Thorne, knows he possesses this disposition. He blames Vance sincerely, believing himself impartial, but his commitment to the norm is fragile: it holds only so long as the cost to his personal attachments remains low.

  ***

  **The Check**

  *   **Norm:** Strict impartiality regarding familial ties in tenure voting.
  *   **Conduct:** Voting despite a prohibited familial relationship.
  *   **Parties:** Thorne (Blamer/Chair) vs. Vance (Wrongdoer/Member).

  **Predictions:**
  1.  **Plain Hypocrisy (Actual Conduct):** Thorne has standing. He has never violated the norm he invokes. Since standing is lost only through actual inconsistency, Thorne is entitled to blame Vance. *Bullet:* Must accept that a person with a corrupt but untested character has full moral authority.
  2.  **Moral Demand/Entitlement:** Thorne lacks standing. To issue a moral demand, one must endorse the authority of that demand over oneself. If Thorne would exempt himself in the counterfactual, he does not truly endorse the norm as binding, but merely as instrumental. *Fit:* Captures the intuition that his authority is hollow.
  3.  **Counterfactual Disposition:** Thorne lacks standing. Standing tracks the stability of one's commitment across possible worlds, not just actual ones. A disposition to make exceptions for kin reveals a lack of genuine commitment to impartiality. *Fit:* Best explains the intuition that he is "in no position" to blame, despite his clean record.
  4.  **Skeptic (Character Assessment):** The language of "standing" dissolves. Thorne is simply less blameworthy than Vance in the actual world, but more blameworthy in terms of character depth. There is no binary switch of standing, only comparative virtue. *Fit:* Dissolves the case by denying the category of standing exists independently of overall moral assessment.

  ***

  **The Working Feature & Removals**

  The feature doing the work is the **untestedness of the partiality disposition** against a **norm of impartiality**.

  *   **Actualize the Counterfactual:** If Thorne's brother *had* applied and Thorne *had* voted, the case collapses into ordinary hypocrisy. The intuition (no standing) remains, but the philosophical friction vanishes because we now have actual inconsistency.
  *   **Swap the Relationship:** If the counterfactual involved a colleague Thorne merely *liked* (not family), and he would still have excused himself, the intuition holds. If he would have recused himself for a colleague but not a brother, the intuition specifically tracks the *special obligation* conflict. This suggests standing is sensitive to the *reason* for the potential exception.
  *   **Swap the Norm:** If the norm permitted partiality (e.g., "Committee members should advocate for candidates they know"), Thorne's disposition becomes irrelevant. He would blame Vance for failing to advocate for her cousin. Here, the intuition that he lacks standing evaporates completely. This suggests standing is not just about the blamer's psychology, but tracks the *content of the norm* being invoked. If the norm demands impartiality, counterfactual partiality undermines standing; if the norm permits partiality, it does not.

  ***

  **The Best Attack (Actual-Conduct Defender)**

  The defender of the actual-conduct view should attack the **epistemic accessibility** of standing. Standing is a social status that regulates interpersonal relations; it must be knowable by the parties involved to function. If Thorne's lack of standing depends on a counterfactual disposition that is unknowable to him, Vance, and the institution, then "standing" ceases to be a practical tool for regulating blame and becomes a metaphysical judgment on the soul. To deny Thorne standing is to punish him for *moral luck*—the mere accident that his brother never applied. The defender argues that we must judge the office and the actual record, not the hidden fragility of character that has never manifested in action. To do otherwise makes standing impossible to claim or verify, rendering the concept useless in the very real-world contexts (like tenure committees) where it is meant to apply.
