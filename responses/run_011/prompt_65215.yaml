answer: |-
  ### 1. The Scenarios

  **Scenario A: The Voltage Standard**
  Twenty years ago, the Metro Regional Rail Consortium needed to standardize its electrification system. Two options existed: System High (750V) and System Low (600V). System High was known to be 15% more energy-efficient over the lifecycle, but a temporary supply chain disruption made System Low transformers immediately available while System High components faced a six-month delay. Planners, aware that early adoption would create increasing returns through network compatibility and maintenance specialization, authorized System Low to meet the opening deadline. Over two decades, the consortium purchased thousands of Low-compatible trains and built hundreds of substations, creating a dense ecosystem of vendors and mechanics specialized in Low. Today, the consortium wishes to switch to High to reduce carbon emissions. The technology for High is commercially available from multiple vendors, and the engineering specifications are public knowledge. However, migrating the network would require replacing every train and substation simultaneously, a capital expenditure exceeding the consortium's bonded debt limit by a factor of ten. The alternative remains purchasable, but the accumulated weight of the incumbent infrastructure makes the price of admission prohibitive.

  **Scenario B: The Dispatcher Protocol**
  Twenty years ago, the Metro Regional Rail Consortium needed to standardize its emergency dispatch protocol. Two options existed: Protocol Alpha (automated routing) and Protocol Beta (manual heuristic routing). Protocol Beta was known to be 15% more resilient during complex system failures, but Protocol Alpha offered faster integration with the new digital scheduling software. A single senior trainer, the only staff member fully certified in Beta, retired unexpectedly during the selection phase; her replacement was certified only in Alpha. Planners, aware that operational routines would solidify through repeated practice and that training capacity would shift toward the active standard, authorized Alpha to ensure immediate staffing coverage. Over two decades, dispatchers drilled exclusively on Alpha, and the software interface was tweaked to match Alpha's workflow. Today, the consortium wishes to switch to Beta to improve resilience. The software license allows for Beta activation at no additional cost, and the physical infrastructure requires no modification. However, the specific heuristic judgments required to execute Beta were never codified in manuals, relying instead on tacit knowledge transferred through apprenticeship. The generation of dispatchers capable of teaching Beta has retired, and the current staff, fluent only in Alpha's logic, find the existing Beta documentation unintelligible. The alternative is financially accessible, but the human capacity to execute it has evaporated.

  ***

  ### 2. Specification Check

  | Condition | Scenario A (Voltage) | Scenario B (Dispatcher) |
  | :--- | :--- | :--- |
  | **Increasing Returns** | Network compatibility; vendor/mechanic specialization creates cost advantages for the incumbent. | Operational routines; training capacity shifts to the active standard, reinforcing fluency. |
  | **Small Event** | Supply chain delay (6 months) for High-voltage transformers. | Unexpected retirement of the single Beta-certified trainer. |
  | **Suboptimal Outcome** | System Low is 15% less energy-efficient than System High. | Protocol Alpha is 15% less resilient than Protocol Beta. |
  | **Non-Ergodicity** | Restarting the process (without the delay) would likely have led to System High. | Restarting the process (with the trainer present) would likely have led to Protocol Beta. |
  | **Well-Informed Agents** | Planners knew High was better but chose Low due to momentum/timing constraints. | Planners knew Beta was better but chose Alpha due to staffing/momentum constraints. |
  | **Lock-In Level** | **High.** Switching is technically possible but economically prohibitive due to sunk costs. | **Low.** Switching carries no capital cost; the software switch is free. |
  | **Closure Level** | **Low.** Vendors exist, specs are public, skills are transferable. | **High.** Tacit knowledge is lost; documentation is executable by no one present. |
  | **Fixed Variables** | Same consortium, 20-year horizon, same number of planners, alternative visibility equal. | Same consortium, 20-year horizon, same number of planners, alternative visibility equal. |

  ***

  ### 3. Verdict and Structural Mechanism

  **Elicited Verdict:**
  In **Scenario A**, observers will likely concede that history broke a tie but argue that efficiency could theoretically buy its way out; history created friction, not fate. In **Scenario B**, observers will likely argue that history did "real work"; the superior option is not merely expensive, it is effectively nonexistent. The intuition is that Scenario A is a story about *prices*, while Scenario B is a story about *possibilities*.

  **Structural Mechanism:**
  The mechanism driving the dissociation is the **locus of the barrier**. In Scenario A, the barrier is internal to the payoff structure (the incumbent's advantage raises the rival's price). In Scenario B, the barrier is external to the payoff structure (the rival's supply curve has shifted to infinity because the good itself has degraded). Scenario A preserves the counterfactual as a live economic option; Scenario B treats the counterfactual as a historical artifact.

  ***

  ### 4. The Single Feature and Removal Test

  **Scenario A Feature:** **Sunk Capital Costs.**
  *Removal Test:* If the consortium had leased all equipment rather than owning it, the switching cost drops precipitously. The verdict collapses into an ordinary efficiency story: history mattered only insofar as it created a temporary contract, which market forces can now dissolve. The "path dependence" vanishes when the sunk cost is removed.

  **Scenario B Feature:** **Tacit Knowledge Atrophy.**
  *Removal Test:* If the Beta protocols had been fully codified in executable manuals (dialed to zero atrophy), the current staff could learn them. The verdict collapses into Scenario A: it becomes a matter of training budget versus efficiency gains. The "real work" of history disappears once the knowledge is made recoverable, turning closure back into lock-in.

  ***

  ### 5. The Strongest Orthodox Attack

  A defender of the standard account (e.g., Arthur or David) would argue that **Closure is merely Lock-in taken to a limit.** They would claim that "recreating the lost tacit knowledge" has a price—hiring historians, reverse-engineering the protocol, or importing foreign experts. If that price is higher than the switching cost in Scenario A, then Closure is just extreme Lock-in.

  **Consequences for the Scenarios:**
  If this redescription holds, the distinction is merely verbal. However, it fails a practical check: In Scenario A, you can write a check to switch. In Scenario B, you cannot write a check because there is no vendor to cash it. The orthodox account assumes a continuous supply curve for alternatives; Scenario B posits a gap in the supply curve where price is undefined. If the distinction is real, policy prescriptions differ: Scenario A requires subsidy to overcome price; Scenario B requires R&D to recreate the option.

  ***

  ### 6. The Baseline Case

  If both lock-in and closure are high—the consortium owns all the Low-voltage hardware *and* the High-voltage engineers have died—history's role becomes undeniable and compounding. In this baseline, the intuition that "history did real work" is maximized because both the economic door and the epistemic door are shut. This confirms that the two scenarios above are a dissociation exercise, isolating variables that usually move together, rather than a difference of degree.

  ***

  ### 7. Assessment of the Distinction

  The distinction survives the exercise, but **Scenario B resists the verdict slightly.** A rigorous economist might insist that the "cost to recreate the knowledge" is finite, thereby pulling Scenario B back into the Lock-in category. However, for the purpose of historical explanation, the distinction holds: Lock-in explains why we *didn't* switch; Closure explains why we *couldn't*.

  I suspect there is a **third condition: Irreversibility of Physical Entropy.** In Scenario B, the "loss" feels more like decay (retirement, forgetting) than calculation. If the closure were caused by a deliberate decision to destroy the Beta manuals (active destruction) rather than atrophy (passive decay), the intuition might shift back toward Lock-in (as a strategic barrier). The "naturalness" of the closure may be doing hidden work in eliciting the verdict.

  ***

  ### Confidence and Uncertainty

  I am **85% confident** in the main claim that Closure elicits a stronger sense of historical necessity than Lock-in.

  The point I am **least sure of** is whether the "well-informed agents" constraint is fully satisfied in Scenario B. If the planners knew that choosing Alpha would *irretrievably* destroy the capacity for Beta, their choice might be interpreted as a rational preference for Alpha's immediate integration over Beta's future resilience, rather than a path-dependent trap. If the loss of capability was foreseeable, the "contingency" of the early event (the retirement) matters less, because the system was designed to tolerate that loss by consolidating on Alpha. This suggests the design may be smuggling in a rational-choice justification that weakens the path-dependence claim.
