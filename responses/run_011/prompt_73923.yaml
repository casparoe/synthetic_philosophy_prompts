answer: |-
  Welcome. You are forty residents chosen by lot to advise the council on whether to close two fire stations and fund a civilian crisis-response unit. You are not here because you are experts in fire safety or public health. You are here because you are the city. Over the next five weekends, you will hear testimony, argue among yourselves, and produce a recommendation. I am here to offer a warning about what you are about to do.

  Two thousand five hundred years ago, the Athenian assembly faced a revolt in the city of Mytilene. They voted to execute every adult male and enslave the women and children. The next day, they met again and reversed the decision. The reversal held only because a second ship outran the first, fighting wind and time to stop the massacre. A colleague of mine argues that this story proves deliberation is a sham. She says the survival of Mytilene was not judgment arriving somewhere; it was a coin flip plus a weather report. She is right that the ship was luck. But she is wrong about what matters.

  Before that ship could sail, someone had to ask for the meeting to be reopened. Someone had to stand up in a room that was furious and had already decided, and argue the losing side again. That is not luck. That is a practice. It is rare. It is exactly the practice you are about to spend five weekends learning.

  You need to understand the argument against you. In that ancient assembly, a man named Cleon told his neighbors that they were behaving as spectators of words and hearers of actions. He said they were overcome by the delight of listening, acting like an audience at a debate rather than citizens deciding the state of a commonwealth. He argued that delay only benefits the wrongdoer. He said the city hands out prizes for rhetorical victory while bearing the danger of having been persuaded. He claimed a city with fixed, even mediocre, laws is stronger than one where clever speakers keep overturning settled decisions.

  You will hear Cleon's voice today. It will come from people who say you are delaying safety. It will come from the intuition that once a decision is made, changing it looks like weakness. Cleon was not a cartoon villain; he was arguing for stability against the chaos of changing minds. He was right that there is a cost to deliberation. You are about to incur that cost.

  So you must understand what the counter-argument actually was. The man who argued for Mytilene, Diodotus, did not appeal to mercy. He did not ask the assembly to be kind. He told them that no matter how great the fault, he would never advise putting anyone to death unless it was for the city's profit. He said they were not pleading judicially so as to need arguments of equity, but consulting on how to serve themselves to their most advantage hereafter. He asked them not to trade the advantage of his counsel for the attractive pretexts of his opponent and for their own present anger.

  This is your instruction. You are not here to be merciful. You are not here to be just. You are here to be useful. You are being asked to weigh whether closing these stations serves the city's advantage, or whether redirecting the money serves it more. If you do this work, you will be tempted to trade that advantage for the pleasure of feeling righteous. Diodotus warns you against that trade.

  But do not leave here thinking that getting a second look is the same as getting it right. The vote in Athens was nearly even. Roughly a thousand ringleaders were executed regardless. The reversal was not the same thing as a good outcome. The same institution that reversed itself at Mytilene later destroyed the neutral island of Melos and ruined itself in Sicily. The ability to change your mind does not guarantee you change it toward the light.

  You are not wiser than the representatives who sit behind you. You are not the wisdom of crowds. You are a group of strangers tasked with a specific muscle: the ability to reopen a decision based on advantage rather than anger. That muscle is fragile. It requires someone to ask for the meeting. It requires someone to stand up when the room is furious. If you can do that, you are doing something real. If you cannot, you are merely spectators waiting for a ship that may not come.

  Learn the practice. Ignore the luck.

  ***

  I chose not to answer my friend's objection that the outcome was ultimately determined by weather and haste rather than reason. I accepted her premise because refuting it would require claiming deliberation guarantees success, which violates the constraint against inflating the scale of the panel's efficacy. Acknowledging the role of luck strengthens the warning that the process itself is valuable only as a practice, not as a safeguard.
