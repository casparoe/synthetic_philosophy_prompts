answer: |-
  **1. Design notes, written first**

  To construct a diagnostic instrument that bridges philosophical and economic vocabularies, I brainstormed ten distinctions often invoked in this literature: (1) Act vs. Disposition evaluation; (2) Intrapersonal vs. Interpersonal dependency; (3) Transparency of mind to others; (4) Intention-Act Link (must intention imply expected action?); (5) Outcome-tracking vs. Reason-responsive normativity; (6) Payoff for State of Mind vs. Action; (7) Dynamic Time Consistency; (8) Self-Binding mechanisms; (9) Epistemic Access to future self; (10) Metaphysical Determinism.

  I retain the first five. They carve the logical space without presupposing a solution. (1) determines the unit of rational assessment. (2) distinguishes coordination problems from self-command problems. (3) isolates the mechanism of prediction. (4) addresses the coherence of intention. (5) separates consequentialist from non-consequentialist structures.

  I discard the remaining five. (6) is subsumed by (1); if states pay, the disposition is the act. (7) is subsumed by (5); inconsistency matters only if outcomes track. (8) is subsumed by (2); binding is just interpersonal strategy turned inward. (9) is subsumed by (3); transparency covers all epistemic access. (10) is a metaphysical distraction; the puzzles work regardless of determinism, relying only on predictability.

  **2. The tree**

  *Instructions: Start at Node 1. Follow the branch that matches your intuition. Footnotes clarify vocabulary divergences.*

  **Node 1:** Does the reward depend on another agent predicting your future choice?
  *   **No:** Go to Node 2.
  *   **Yes:** Go to Node 3.

  **Node 2:** Is rationality assessed by whether you maximise final outcomes, or whether you respond correctly to reasons at each moment?¹
  *   **Outcomes:** Go to Node 4.
  *   **Reasons:** **Leaf A (Reasons-First View).** *Hitchhiker:* You cannot promise, as you lack reason to pay later. *Toxin:* You cannot intend, as you lack reason to drink. *Awkwardness:* Agents systematically miss profitable opportunities.
  *   **Footnote ¹:** *Economists hear 'preferences'; philosophers hear 'normativity'. Both ask: does success justify the means?*

  **Node 3:** Can that other agent detect your current mental state perfectly?
  *   **No:** **Leaf B (Standard Rationality).** *Hitchhiker:* You are left behind; promising is irrational bluffing. *Toxin:* You keep the money only if the eccentric is fooled; intending is irrational. *Awkwardness:* Rational agents are predictably poorer than irrational ones.
  *   **Yes:** Go to Node 4.

  **Node 4:** Is rationality assessed on the single act or the policy generating it?²
  *   **Single Act:** Go to Node 5.
  *   **Policy:** **Leaf C (Disposition-Based View).** *Hitchhiker:* Cultivating honesty is rational, so you are rescued. *Toxin:* Cultivating toxin-drinking disposition is rational, though drinking is not. *Awkwardness:* You must intend to do what you know you will not do when the time comes.
  *   **Footnote ²:** *Economists say 'strategy'; philosophers say 'maximising disposition'. Both distinguish the choice from the rule.*

  **Node 5:** Can you rationally hold an intention to do something you know you will not do when the time arrives?
  *   **No:** **Leaf D (Sophisticated Choice).** *Hitchhiker:* You cannot promise; you anticipate your own defection. *Toxin:* You cannot intend; you anticipate sparing yourself. *Awkwardness:* You are helpless against predictors who know you are sophisticated.
  *   **Yes:** Go to Node 6 (Invented Case 1).

  **Node 6 (Invented): The Mirror Box.** You are paid if a scanner shows you *currently* intend to press a button later, but the button press itself yields no reward. You know you will only press if rewarded then. Do you intend?
  *   **No:** **Leaf E (Transparency Dissolution).** *Hitchhiker:* The puzzle assumes impossible transparency; real agents are opaque. *Toxin:* The eccentric cannot verify intention without action. *Awkwardness:* Denies the stipulated facts of the thought experiment.
  *   **Yes:** Go to Node 7 (Invented Case 2).

  **Node 7 (Invented): The Amnesiac Switch.** You are paid tonight for intending to flip a switch tomorrow. Tomorrow, you will have amnesia about tonight's payment. Do you intend?
  *   **No:** **Leaf F (Causal Decision Theory).** *Hitchhiker:* Your promise causes nothing; stay stranded. *Toxin:* Your intention causes nothing; keep money, don't drink. *Awkwardness:* Cannot account for rational commitment in bargaining.
  *   **Yes:** **Leaf G (Strategic Commitment).** *Hitchhiker:* You make yourself credible by altering incentives. *Toxin:* You bind yourself to drink to secure the reward. *Awkwardness:* Requires costly pre-commitment technologies not always available.

  **Leaf H (Unnamed).** *Hitchhiker:* Rationality is irrelevant; biology dictates trust. *Toxin:* Physiology dictates nausea. *Awkwardness:* Eliminates agency entirely.

  **3. Required leaves**

  The instrument above instantiates the required positions as follows:
  *   **Nothing irrational is ever rational:** Leaf B (Standard Rationality). It maintains classical consistency even at the cost of welfare.
  *   **Disposition-based view:** Leaf C. It shifts evaluation from acts to traits.
  *   **Strategic commitment:** Leaf G. It treats credibility as a resource bought by constraint.
  *   **Reasons-first:** Leaf A. It denies intention without prospective reason.
  *   **Transparency denial:** Leaf E. It dissolves the puzzle by attacking the epistemic setup.

  Leaf D (Sophisticated Choice) and Leaf F (Causal Decision Theory) are added to occupy the logical space between commitment and standard rationality. Leaf H occupies the eliminativist corner.

  **4. Two cases of your own**

  **Case 1: The Mirror Box (Node 6).**
  *   **Separates:** Leaf E (Transparency Dissolution) from Leaf G (Strategic Commitment).
  *   **Feature:** Decouples the reward for intention from the utility of the act entirely.
  *   **Validity:** This is not an artefact because it isolates the 'signalling' value of intention from the 'execution' value. If one says 'Yes' to intending here, one accepts intentions can be held purely for signalling, supporting Commitment views. If 'No', one supports the view that such transparency is impossible or irrational to rely on.

  **Case 2: The Amnesiac Switch (Node 7).**
  *   **Separates:** Leaf F (Causal Decision Theory) from Leaf G (Strategic Commitment).
  *   **Feature:** Removes future self-interest by stipulating amnesia.
  *   **Validity:** This tests whether the agent relies on future reasons (Causal) or past commitments (Commitment). If you intend despite amnesia, you rely on the past commitment's rationality, not future payoff. This confirms the separation is real, not merely verbal.

  **5. The space, not merely the tree**

  The nodes permit 32 logical combinations of answers. Only 8 are occupied by the leaves above.
  *   **Unoccupied (Incoherent):** Claiming rationality tracks outcomes (Node 2) but denying one can intend what one won't do (Node 5) while accepting transparency (Node 3). This creates a paradox where one must maximise outcomes but cannot form the necessary intentions.
  *   **Unoccupied (Unattractive):** Claiming rewards depend on prediction (Node 1) but that rationality assesses single acts (Node 4) while accepting transparency. This yields Leaf B, but many find the systematic loss of welfare too high a price for act-consistency.
  *   **Unoccupied (Unexplored):** A view where rewards depend on prediction, transparency holds, but rationality tracks reasons (Node 2) and one *can* intend what one won't do (Node 5). A defender would argue that reasons include 'keeping faith with one's past self' independent of outcomes. This 'Fidelity View' is rarely formalised but logically stable.

  **6. Honest limits**

  This instrument cannot reliably separate Leaf C (Disposition-Based) from Leaf G (Strategic Commitment). Both recommend cultivating a disposition to act against immediate interest. The difference lies in metaphysics: C suggests the disposition is intrinsic, G suggests it is extrinsicly bound. No questionnaire can sort this, as both yield identical choices in the Hitchhiker and Toxin cases. Only a query about the *mechanism* of change (internal character vs. external constraint) would distinguish them, which falls outside decision-theoretic choice.

  Furthermore, Leaf A (Reasons-First) and Leaf D (Sophisticated Choice) often converge on action (both say 'don't promise'), though for different reasons. A participant might answer differently based on whether they focus on the *intention* or the *act*. The tree forces a choice, but in practice, these views are allies against the Commitment views. The instrument sorts theoretical commitments, not necessarily behavioural predictions.
