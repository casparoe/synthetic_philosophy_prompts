answer: |-
  **PRELIMINARY AGREEMENT ON THE TIMING OF CONSCIOUS EXPERIENCE**
  **Graduate Workshop on Consciousness Studies**

  **Purpose**
  This document establishes the common ground and structured disagreements between the proponents of the Multiple Drafts model (MD) and the Delayed-Composition model (DC) regarding the temporal structure of perceptual experience. Its purpose is to bypass terminological stalemates and direct the workshop toward empirical and conceptual cruxes. Both panelists sign this text as an accurate map of their respective positions and shared commitments.

  **1. Agreed Claims Regarding Color Phi**
  Both parties endorse the following claims as neutral ground. None presuppose a specific theory of consciousness.

  1.  **Stimulus and Report:** In the color phi display, two stationary lights of different colors are flashed at distinct spatial locations with a short stimulus onset asynchrony (SOA). Subjects consistently report a single dot moving between the locations and changing color midway along the path.
  2.  **Neurophysiological Constraints:** Neural signals from the first stimulus reach early visual cortex before the second stimulus arrives (at short SOAs), but the behavioral report confirming the motion illusion occurs after both stimuli have been processed. There is a measurable latency between stimulus onset and reportable content.
  3.  **Introspective Opacity:** Subjects cannot introspectively distinguish between an experience that was edited during formation (before conscious access) and a memory that was edited after formation (after conscious access). The phenomenology feels identical in both hypothetical cases.
  4.  **Discrimination Capacity:** There is no current evidence that subjects can discriminate, via forced-choice performance, whether their report relies on a continuous perceptual representation or a reconstructed narrative, provided the report is made after the illusion is established.
  5.  **Temporal Indeterminacy:** At very short SOAs, the temporal order of neural events does not map linearly onto the temporal order of reported experience.

  **2. Table of Disagreements**
  The following table records where the parties diverge. Both agree this table accurately captures the nature of their dispute.

  | Issue at Stake | Multiple Drafts (MD) Formulation | Delayed-Composition (DC) Formulation | Verdict on Dispute |
  | :--- | :--- | :--- | :--- |
  | **Ontological Status** | There is no determinate fact about when a content becomes conscious until verification processes settle. | Perceptual content is composed within a specific temporal window; experience is determinate once that window closes. | Substantive |
  | **The "Theater"** | Positing a finish line for consciousness risks invoking a "Cartesian Theater" (a place/time where it all comes together). | The "Cartesian Theater" is a strawman; we posit processing windows, not a homunculus. | Verbal |
  | **Stalinesque vs. Orwellian** | The distinction between editing experience (Stalinesque) and editing memory (Orwellian) is arbitrary in this context. | The process is Stalinesque: content is edited before entering the conscious window. | Substantive |
  | **Definition of Experience** | "Experience" refers to the functional availability of content for report and control. | "Experience" refers to the completed representational state within the integration window. | Verbal/Substantive |

  **3. Cruxes and the Threshold Position**
  To move beyond stalemate, we identify two sub-questions where resolution would shift theoretical commitment.

  **Crux A: SOA Length and Arbitrariness**
  Does the distinction between Stalinesque (editing before experience) and Orwellian (editing after experience) become non-arbitrary as the stimulus onset asynchrony lengthens?
  *   **MD Prediction:** The distinction remains arbitrary regardless of SOA, as there is no single moment of "becoming conscious."
  *   **DC Prediction:** At long SOAs, the distinction becomes factual; editing clearly occurs before the composition window closes.

  **Crux B: The Threshold Applicability Position**
  A third position suggests the Stalinesque/Orwellian distinction is well-posed above some processing latency but *inapplicable* below it. This is distinct from claiming the distinction is arbitrary; it claims the concepts lack purchase during rapid integration.
  *   **MD Classification:** This is a redescription of Multiple Drafts. (If there is no fact below latency, there is no fact simpliciter).
  *   **DC Classification:** This is a redescription of Delayed-Composition. (The window defines the latency below which the distinction is moot).
  *   **Workshop Task:** Determine if this is a genuine third ontology or merely a verbal compromise.

  **4. Proposed Experiments and Predictions**
  Both parties agree that the following manipulations bear on the cruxes above.

  **Experiment 1: Forced Report-Timing**
  *   **Method:** Subjects view the color phi display. They are cued to respond either (a) rapidly, before the second flash could physically enter a hypothesized composition window, or (b) after a delay ensuring full processing.
  *   **MD Prediction:** In condition (a), reports will be fragmented or absent. No "draft" of motion exists to be reported.
  *   **DC Prediction:** In condition (a), reports will be at chance or indicate no motion. The composition window is open; no content exists yet.
  *   **Embarrassment Conditions:**
      *   **MD:** If subjects reliably report coherent motion features in condition (a) via forced choice, implying a determinate draft existed earlier than predicted.
      *   **DC:** If neural correlates of the "composed" motion appear before the second stimulus could influence the window, implying pre-composition determinacy.

  **Experiment 2: Uniformity of Illusions**
  *   **Scope:** Color Phi, Cutaneous Rabbit, Flash-Lag, and Backward Masking.
  *   **Shared Desideratum:** Both parties agree a single uniform treatment of temporal integration across these four illusions is theoretically preferable to ad-hoc mechanisms.
  *   **Disagreement:** MD argues uniformity supports a general lack of determinate timing. DC argues uniformity supports a general mechanism of delayed composition windows.
  *   **Commitment:** Both agree that if one illusion is proven to be Stalinesque (editing before access) and another Orwellian (editing after access) by independent neural markers, the claim for a uniform theory fails.

  **5. Closing Statement on Verbal Dispute**
  A significant portion of our conflict concerns the phrase "the content of experience at *t*."

  *   **MD Objection:** This phrase presupposes a determinate state at time *t* which may not exist.
  *   **DC Objection:** This phrase is valid if *t* refers to the closure of the composition window.

  **Recommendation:** For the duration of this workshop, we recommend adopting the usage **"reportable content stabilized at *t*."** This phrase remains neutral regarding whether the content existed prior to stabilization. It allows us to discuss the timing of reports without presupposing the timing of experience.

  We sign this agreement to facilitate productive dispute.

  __________________________
  **Proponent, Multiple Drafts Model**

  __________________________
  **Proponent, Delayed-Composition Model**

