  # Lesson Plan: The Two Questions of Risk

  ## 1. Mathematical Verification & Design Choices

  **The Math of the Split**
  You requested a check on whether the round count allows the mean and median to separate visibly.
  *   **Parameters:** 60% win rate ($p=0.6$), Even Money (1:1), 15 Rounds.
  *   **Sequence:** To ensure verifiable fairness and eliminate "bad luck" complaints, we will use a **pre-shuffled deck of 15 cards** (9 Red = Win, 6 Black = Lose). This guarantees the 60% rate exactly while keeping the *order* random.
  *   **Strategy Outcomes (Start = 100 tokens):**
      *   **The "Safety" Player (0% stake):** Ends with **100**.
      *   **The "Optimal" Player (20% stake / Kelly):** Expected sequence (9W, 6L) $\rightarrow 100 \times 1.2^9 \times 0.8^6 \approx 100 \times 5.16 \times 0.26 \approx$ **135 tokens**.
      *   **The "Aggressive" Player (50% stake):** Expected sequence $\rightarrow 100 \times 1.5^9 \times 0.5^6 \approx 100 \times 38.4 \times 0.015 \approx$ **59 tokens**.
      *   **The "All-In" Player (100% stake):** Any Black card eliminates them. With 6 Blacks in the deck, they end at **0**.
  *   **The Split:** If half the class plays Aggressive/All-In (busting or shrinking) and half plays Optimal/Safe, the **Median** will likely sit near 100 (the Safe players) or lower. The **Mean** will be dragged upward by the Optimal players (135).
  *   **Sufficiency:** 15 rounds are sufficient to punish over-betting (50%+ leads to loss) and reward optimal betting (20% leads to gain), creating a visible gap between the "typical" outcome (Median) and the "average" outcome (Mean).
  *   **Time Cost:** 15 rounds at 2 minutes per round (decision + reveal + calc) = 30 minutes. This fits the 75-minute session with buffer.

  **Reward Structure (Addressing the "Luck" Constraint)**
  *   **Constraint:** No reward depends on being lucky.
  *   **Solution:** Because the *sequence of outcomes* is identical for every student (drawn from one public deck), "luck" is held constant across the room. Variance in final tokens is 100% attributable to staking policy.
  *   **Distribution:** All students receive a participation credit (e.g., course credit/attendance). The **top 3 token holders** receive a small tangible reward (chocolate bar). This preserves competitive feel but rewards *strategy*, not luck, because the "market conditions" were identical for all.

  **Unit of Play: Individuals**
  *   **Decision:** Individuals, not pairs.
  *   **Why:** Pairs tend to negotiate a "compromise" strategy, muddying the data. The lesson requires students to feel the personal regret of ruin or the vindication of caution. 18 students is manageable for board aggregation.

  ---

  ## 2. Minute-by-Minute Timeline

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Distribute sheets. Explain rules. **No vocab** (no EV, no Kelly). Shuffle deck publicly. |
  | **10-40** | **Phase 1** | **The Repeated Game.** 15 Rounds. Reveal card, students stake, calculate, record. |
  | **40-50** | **Analysis** | Collect data. Compute Class Mean and Class Median on board. Identify outliers. |
  | **50-60** | **Phase 2** | **The One-Shot Game.** Single bet, fixed 50% stake. Vote Yes/No. |
  | **60-75** | **Debrief** | Reveal concepts. Map play to theory. Discuss limitations. |

  ---

  ## 3. Facilitator Script: Setup (Minutes 0-10)

  *(Stand at the front. Hold a standard deck of cards. Remove all cards except 9 Reds and 6 Blacks.)*

  "Welcome. Today we are testing decision-making under uncertainty. You will not need probability theory, only arithmetic.

  Here is your starting position: **100 Tokens.**
  Here is the opportunity: In a moment, I will draw a card from this deck.
  *   If it is **Red**, you win. For every token you stake, you get your stake back plus one more.
  *   If it is **Black**, you lose. You lose the tokens you staked.

  There are 15 cards in this deck: 9 Red, 6 Black. I will shuffle them now. *(Shuffle visibly, let a student cut the deck.)*
  We will play 15 rounds. One card per round. Everyone sees the same card.

  **The Rules:**
  1.  Before I draw, you must decide what **fraction** of your current tokens to stake. You can write this as a percentage (e.g., 10%, 50%, 100%).
  2.  You cannot stake more than you have.
  3.  If your token count hits zero, you are eliminated. You stop playing.
  4.  Keep your stakes secret until I ask for them.
  5.  At the end, the students with the highest token counts will receive a prize. Because we all face the exact same cards, luck is cancelled out. The winners will be the best strategists, not the luckiest.

  **Your Tool:** *(Distribute the Tracker Sheet)*
  This sheet helps you calculate. If you stake 20% and win, multiply your total by 1.2. If you lose, multiply by 0.8. Use your phones for calculation if it helps, but keep the pace.

  Any questions on the arithmetic? No? Let's begin."

  *(Note: Do not use words like 'expected value', 'growth', 'risk', or 'utility'.)*

  ---

  ## 4. Game Mechanics & Bookkeeping

  **The Tracker Sheet (Print one per student)**
  *   **Columns:** Round # | Card Color | My Stake % | Multiplier (Win/Loss) | New Total
  *   **Pre-printed Multipliers:** To save time, include a small lookup table on the sheet:
      *   Stake 10%: Win $\times 1.1$ | Lose $\times 0.9$
      *   Stake 20%: Win $\times 1.2$ | Lose $\times 0.8$
      *   Stake 50%: Win $\times 1.5$ | Lose $\times 0.5$
      *   Stake 100%: Win $\times 2.0$ | Lose $\times 0.0$
      *   *(Students can interpolate or stick to these benchmarks).*

  **Running the Rounds (Facilitator Notes)**
  1.  **Announce:** "Place your stakes." (Wait 30 seconds).
  2.  **Reveal:** Draw the top card. Hold it up. "Red." (Write on board: R1, R2... B1...).
  3.  **Calculate:** "Update your totals." (Wait 60 seconds).
  4.  **Pace:** Keep it moving. If a student hits 0, they stop calculating.

  **Data Aggregation (Minute 40)**
  1.  Ask students to shout their final token counts.
  2.  Write them on the board in a list.
  3.  **Task:** "I need two volunteers. One to calculate the **Mean** (Sum of all tokens / 18). One to find the **Median** (The middle number when sorted)."
  4.  **The Discovery:** The Mean will likely be higher than the Median.
  5.  **Question:** "Look at the list. Who is dragging the Mean upward? Is it the people with 0 tokens? Or the people with 130+?" (Answer: The high survivors).
  6.  **Question:** "If you were picked at random from this room before we started, which number represents your likely outcome? The Mean or the Median?" (Answer: Median).

  ---

  ## 5. Phase 2: The Transfer Test (Minutes 50-60)

  **Setup**
  "Reset your minds. Imagine you are not in a tournament. There are no more rounds after this one. This is the only opportunity you will ever get.
  The odds are the same: 60% chance to win even money.
  However, the terms are fixed this time. **You must stake exactly 50% of your bankroll.** You cannot choose the amount. You can only choose **Whether** to take the bet or walk away with what you have.
  You have 100 tokens.
  Option A: Walk away with 100.
  Option B: Bet 50. (60% chance to end with 150, 40% chance to end with 50).
  Vote by show of hands: Who takes the bet?"

  **Expected Outcome**
  Students who learned "Don't overbet" in Phase 1 may hesitate, fearing the loss. Students focusing on the single-shot math should take it.

  **Discussion**
  "Count the hands. Why did you vote that way? Did anyone vote 'No' because they were worried about going bust? Remember, there is no Round 2. Does 'going bust' matter if the game ends?"

  ---

  ## 6. Debrief Script (Minutes 60-75)

  **1. Mapping Play to Concepts**
  "In Phase 1, many of you who bet 50% or 100% ended with less than you started, or zero. The **Median** outcome for an aggressive bettor was ruin.
  However, the **Mean** outcome of this bet is positive. If you could play this game a million times, betting 100% every time would make you rich on average.
  But you don't live a million lives. You live one.
  The split you saw on the board—Mean vs. Median—is the split between **Expected Value** (Arithmetic Mean) and **Growth** (Geometric Median).
  *   **Question 1: Is the bet favorable?** Yes. The Mean goes up.
  *   **Question 2: How much do I bet?** That depends on whether you care about the average of all possible worlds (Mean) or the outcome of *your* world (Median/Growth).
  In a repeated game, maximizing the Mean leads to ruin. Maximizing the Median (which happens at roughly 20% stake) leads to growth."

  **2. Addressing Utility (Without Jargon)**
  "Some of you bet 0%. You kept your 100 tokens. You didn't lose, but you didn't beat the 20% bettors.
  Some of you bet 100%. You hoped for the big prize.
  This isn't just about math; it's about what you value. If you need 100 tokens to eat tomorrow, 0% is rational. If you need 1000 tokens to win the tournament, 100% is rational.
  The math tells you the consequences of your policy. It doesn't tell you which policy to pick. That depends on your situation."

  **3. Phase 2 Connection**
  "In Phase 2, the game ended after one round. Here, the 'Risk of Ruin' matters less because there is no future to survive for. The Expected Value rule dominates. If you refused the bet in Phase 2, you applied a 'Repeated Game' rule to a 'Single Shot' problem."

  ---

  ## 7. Troubleshooting: Predictable Failures

  **1. The "Zero Staker" (Vindicated Cautious)**
  *   **Scenario:** A student stakes 0% every round. Ends with 100. Sees others bust. Feels smart.
  *   **Fix:** In the debrief, point to the 20% bettors. "You preserved capital, which is good. But look at Student X who bet 20%. They have 135. You lost to inflation/opportunity. Caution is safe, but optimal caution beats no action."

  **2. The "Early Bust" (Disengaged)**
  *   **Scenario:** A student bets 100% in Round 1. Card is Black. They are out at Minute 15.
  *   **Fix:** Assign them the role of **"Audit Committee."** Their job is to verify the math of the top 3 winners on the board. This keeps them engaged in the data analysis phase.

  **3. Calculation Errors**
  *   **Scenario:** Students mess up the compounding.
  *   **Fix:** Allow phone calculators. If a student's math is clearly wrong during the round, gently correct it: "Check your multiplier for a 50% loss."

  **4. No Mean/Median Split**
  *   **Scenario:** Everyone plays conservatively (0-20%). Mean and Median are close.
  *   **Fix:** Have a "Ghost Player" prepared. "Let's add a hypothetical player who bet 100% and got lucky on the specific sequence we just drew. Their score would be 32,000. Add that to the Mean." (Use this only if necessary to illustrate the theoretical skew).

  ---

  ## 8. Limitations: What This Game Cannot Reproduce

  *Be frank about these in the final 5 minutes.*

  1.  **Known Odds:** "In this game, you knew the deck was 9 Red, 6 Black. In real life, you have to *estimate* the odds. If you think the odds are 60% but they are actually 40%, even the 20% stake will ruin you."
  2.  **Finite vs. Asymptotic:** "We played 15 rounds. The 'Optimal' 20% stake is mathematically perfect over the *long run*. In just 15 rounds, luck still plays a role. You might do everything right and still lose. The math guarantees nothing in the short term."
  3.  **Tokens vs. Livelihood:** "Losing 100 tokens here is annoying. Losing your livelihood in the real world is catastrophic. In real life, the cost of ruin is higher than 'game over,' which means you should often bet *less* than the math suggests."

  **Closing Sentence:**
  "Use the math to understand the landscape, but use your judgment to decide how much of your life you are willing to put on the table."
