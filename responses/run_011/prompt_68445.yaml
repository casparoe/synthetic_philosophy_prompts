answer: |-
  ### Brainstorming Angles

  1.  **The Performative Contradiction**
      *   **Theory Piece:** The claim that rational argument alone is causally inert in moral revolutions.
      *   **Target:** My own preparation for this talk.
      *   **Concept:** I spent weeks building a logical case to prove logic doesn't work.

  2.  **The Honor Mechanism**
      *   **Theory Piece:** The shift from "wrong" to "shameful/unfashionable" as the catalyst for change.
      *   **Target:** The audience's reluctance to laugh.
      *   **Concept:** I'm not trying to be funny; I'm trying to make not laughing feel socially costly.

  3.  **The Century Lag**
      *   **Theory Piece:** Arguments often exist for decades before the moral shift actually occurs.
      *   **Target:** The timing of my invitation to speak.
      *   **Concept:** The reasons not to invite me have been known since September, but maybe the shift is happening now.

  4.  **The Insider Abandonment**
      *   **Theory Piece:** Revolutions are often led by those with the largest stake in the old code (gentlemen, elites).
      *   **Target:** The two teachers in the room.
      *   **Concept:** You guys established the old code of grading; you need to be the ones to declare it ridiculous.

  ***

  ### Selected Joke

  I spent three weeks drafting a rigorous argument to prove that rigorous arguments never change anyone's mind.
  But then I remembered the reading: logic didn't end slavery, shame did.
  So I'm not actually trying to convince you this talk is good.
  I'm just trying to make silence feel too embarrassing to sustain.
  [Pause]
  Please don't make me stand here until it does.

  ### Runner-Up

  We learned that practices collapse when they become ridiculous, not just wrong.
  Which is convenient, because my draft was wrong, but now I'm hoping it's at least ridiculous.
  If you laugh, the revolution succeeds.

  ### Delivery Advice

  Pause for a full two beats after "sustain" before delivering the final plea; let the awkwardness of the silence actually begin to work on the room before you acknowledge it.
