answer: |-
  Here is how I am carving up the problem in my own head before we settle on an explanation. I want to show you the conceptual tension first, because that's where the confusion usually lives.

  ### Brainstorming the Carve-Up

  When we talk about "standing," we are asking: *What gives an agent the normative power to hold another agent accountable?*

  There are two main ways to model this power, and they lead to your "Fizzle" and "Recusal" views.

  **Candidate 1: The Transactional Model (Fizzle)**
  Think of blame like making a promise or signing a contract. For a promise to exist, certain conditions must be met (intent, communication, authority). If I promise you something I have no power to give, I haven't made a "bad promise"; I haven't made a promise *at all*. The act is void.
  *   *Implication:* If standing is a condition of the act's existence, the hypocrite literally fails to blame. The "wrong" is akin to fraud or category error.

  **Candidate 2: The Administrative Model (Recusal)**
  Think of blame like a legal verdict or a referee's call. A referee can make a call that is factually correct (it was a foul) but procedurally invalid (he's betting on the game). The call *happens*. It enters the record. But it violates the rules of the game's administration.
  *   *Implication:* If standing is a condition of the act's *permissibility*, the hypocrite blames successfully but improperly. The "wrong" is akin to corruption or unfairness.

  **The Tension:**
  The Transactional Model protects the *concept* of blame (blame must be clean to be blame), but it makes the hypocrite's wrongdoing seem trivial (just a miscommunication). The Administrative Model captures the *moral sting* of hypocrisy (it's unfair), but it forces us to accept that "bad" blame is still blame.

  Your professor is pushing you to see that these aren't just semantic differences; they change what we think is happening in the moral interaction.

  ***

  ### 1. The Core Distinction: Fizzle vs. Recusal

  Let's make these incompatible. The difference lies in **what exists** after the hypocrite speaks.

  **The Fizzle View (Illocutionary Failure)**
  On this view, standing is a *constitutive norm*. Just as you cannot marry someone without a license, you cannot blame someone without standing. When the hypocrite says, "You ought to be ashamed," the words are uttered, but the moral act of *blaming* does not occur. It is a nullity.
  *   **The Wrong:** The wrong is deceptive. The hypocrite is pretending to occupy a moral office they do not hold.
  *   **The Target's Reaction:** If the target feels guilt, they are mistaken. They are reacting to a ghost.

  **The Recusal View (Moral Impermissibility)**
  On this view, standing is a *regulative norm*. It governs who is allowed to perform an act that is otherwise possible. The hypocrite *does* blame. They successfully communicate a moral demand and attribute responsibility.
  *   **The Wrong:** The wrong is relational/unfair. The hypocrite is asserting a status over the target that they do not possess relative to the norm in question. It creates a hierarchy where there should be equality.
  *   **The Target's Reaction:** If the target feels guilt, they might be morally sensitive to the truth of the charge, but they are fully entitled to reject the *delivery* of that charge.

  **The Test Case: The Third-Party Endorsement**
  Imagine a hypocrite (H) blames a Target (T). A Bystander (B) witnesses this. B knows H is a hypocrite regarding this norm, but B also knows T is genuinely guilty.

  *   **Prediction on Fizzle:** B cannot say, "H's blame was appropriate." B must say, "H failed to blame. However, T *is* blameworthy, so I (B) will now blame T." Since H's act was a nullity, there is nothing to endorse. H's words were just noise.
  *   **Prediction on Recusal:** B can say, "H's blame was accurate but unauthorized." B can agree with the *content* of H's blame without validating H's *authority*. B can acknowledge that T has been legitimately called out (in terms of truth) while simultaneously criticizing H for speaking.

  **Why they are incompatible:**
  On the Fizzle view, the moral record shows **no blame event**. On the Recusal view, the moral record shows **an improper blame event**. This matters for whether the Target owes the Hypocrite anything (like an apology). On Fizzle, no apology is owed because no demand was made. On Recusal, an apology might be owed to the moral community, but the Target is permitted to withhold it from H specifically.

  ***

  ### 2. Follow-Up: The Asymmetry (Praise and Advice)

  You asked: *If standing is a permission to make moral demands, why doesn't it apply to praise or advice?*

  This is a strong objection to the idea that standing is just "moral authority" in general. It suggests standing is specific to the *cost* imposed on the target.

  **How the Recusal View handles it:**
  The Recusal view says standing is about **fairness in burden-sharing**.
  *   **Blame:** Imposes a burden (guilt, obligation to repair, social sanction). It is unfair to impose this burden if you exempt yourself from it. You are claiming a privilege (to punish) without accepting the liability (to obey).
  *   **Praise:** Confers a benefit. It is not unfair to give someone a benefit you haven't given yourself. If I praise you for donating to charity, I am not burdening you. I am not claiming authority over you; I am acknowledging your good. Even if I am stingy, my praise doesn't subordinate you.
  *   **Advice:** Is prudential or predictive ("Smoking will kill you"). This is a claim about *facts*, not a demand for *compliance*. A smoker knows smoking is bad; when they tell you not to start, they are acknowledging the norm applies to them too (they are suffering for it). Their advice highlights their own failure, which actually reinforces the norm rather than undermining their authority to state the truth.

  **How the Fizzle View handles it:**
  The Fizzle view says standing is a **condition for a specific speech act**.
  *   Blame is a unique speech act that attempts to alter normative relationships (it creates an obligation to make amends). Praise and Advice do not alter normative relationships in the same way. You don't *owe* me anything because I praised you. Therefore, the "license" required to blame isn't required to praise.
  *   **Weakness:** This feels ad hoc. Why does blame need a license but praise doesn't? The Recusal view explains *why* (the burden), whereas the Fizzle view just asserts that the rules of the "blame game" are different.

  **Verdict on Asymmetry:** This favors the **Recusal View**. It explains the asymmetry through the *effects* of the act (burden vs. benefit) rather than arbitrary rules about speech acts.

  ***

  ### 3. Follow-Up: The Favoritism Case (Dana)

  *Case:* Dana keeps all promises. She blames her Ex for breaking promises but excuses her Partner for worse breaches. She is not a hypocrite (she complies), but she is biased.

  **The Problem:**
  Standard hypocrisy is "I do X, I blame you for X." Dana is "I don't do X, I blame you for X, but I let my friend do X."

  **On the Fizzle View:**
  Dana has "clean hands." She complies with the norm. If standing is just about compliance (having the moral status of a norm-follower), Dana has standing. Her blame should "fire."
  *   *Result:* The Fizzle view struggles to explain why Dana's blame feels defective. It would have to say her blame is valid, just mean. But intuitively, her bias undermines her *authority* to blame the Ex. She is using the norm as a weapon, not a standard.

  **On the Recusal View:**
  Standing isn't just about compliance; it's about **equality of regard**. To have standing, you must treat the norm as applying impartially to all moral agents.
  *   *Result:* Dana fails the equality test. By exempting her Partner, she treats the norm as optional for some. This undermines her claim to be upholding the norm against the Ex. She is acting like a prosecutor who only indicts political enemies.
  *   *Absorption:* The Recusal view can absorb this easily. Standing is lost not just by *violating* the norm, but by *administering* it unfairly. The "wrong-making work" here is still unfairness, but it's unfairness in application rather than exemption.

  **Verdict on Favoritism:** This is a major win for the **Recusal View**. The Fizzle view ties standing too tightly to individual compliance. The Recusal view ties it to the integrity of the practice.

  ***

  ### 4. Follow-Up: Repair

  *Scenario:* The hypocrite realizes their error, feels remorse, perhaps blames themselves, and then blames the target again later.

  **On the Recusal View:**
  *   **Mechanism:** The loss of standing was due to *unfairness* (claiming a status you didn't have). Remorse and self-blame restore **moral equality**. By punishing yourself, you pay the "tax" you were avoiding. You re-enter the community of equal norm-enforcers.
  *   **Prediction:** The repair validates *future* blame. It does not necessarily validate the *past* hypocritical blame (that remains an impermissible act), but it restores the relationship so that new blame is permissible.
  *   **Fit:** Very natural. It explains why we care about the remorse: it balances the scales.

  **On the Fizzle View:**
  *   **Mechanism:** The loss of standing was a lack of *status*. You were like an unlicensed driver. Remorse doesn't give you a license. Only changing your behavior (becoming compliant) does.
  *   **Prediction:** The past act remains a "misfire" forever. You cannot retroactively make a void contract valid. So, when the hypocrite repairs, they are essentially becoming a *new* blamer.
  *   **Fit:** This is clunky. It implies that the "Repair" isn't fixing the relationship damaged by the blame, but rather fixing the agent's internal properties. It fails to capture the *relational* healing that happens when a hypocrite apologizes. The target forgives the *person*, not just acknowledges the person is now compliant.

  **Verdict on Repair:** The **Recusal View** explains the *relational* nature of repair better. The Fizzle view treats it like fixing a broken tool; the Recusal view treats it like healing a breach of trust.

  ***

  ### Final Verdict

  If I have to choose, the **Recusal View** is the superior framework.

  **Here is why:**
  1.  **It captures the moral sting.** The reason we hate hypocrites isn't just that they are "fake" (Fizzle); it's that they are *unfair*. They try to stand above us. The Recusal view locates the wrong in the relationship (inequality), which matches our emotional reaction (resentment at their audacity).
  2.  **It handles the edge cases.** As we saw with Dana (Favoritism), compliance isn't enough. You need impartiality. The Recusal view can expand to include impartiality as a condition of authority. The Fizzle view gets stuck on "did they break the rule?"
  3.  **It explains the Asymmetry.** Standing is about the authority to *burden*. Praise doesn't burden. This is a clear, principled distinction on the Recusal view.
  4.  **It respects the Target.** On the Fizzle view, if I reject a hypocrite's blame, I am saying "You didn't speak." On the Recusal view, I am saying "You spoke, but you have no right to demand a response from me." The latter preserves my agency as a moral equal who can reject illegitimate authority.

  The Fizzle view is tempting because it keeps the concept of "Blame" pure. But moral life isn't pure. We often have to deal with valid criticisms delivered by flawed people. The Recusal view allows us to say: "You are right about what I did, but you are wrong to be the one telling me." That is the precise texture of the standing objection.
