answer: |-
  Here is the map of exposure for your position, ranked from fatal structural flaws to awkward presentational problems, followed by direct answers to your specific technical questions.

  ### The Map of Exposure

  **1. Fatal: The Operational Collapse (The "How Do You Calculate?" Problem)**
  Your claim that $\eta g$ belongs in aggregation and not discounting is semantically clear but operationally empty unless you provide an alternative decision rule to Net Present Value (NPV). In a Cost-Benefit Analysis (CBA), you must compare a cost today against a benefit tomorrow in a common numeraire (usually consumption). To do this, you *must* convert future utility back to present consumption equivalents. That conversion factor *is* the discount rate.
  If you move $\eta g$ to the aggregation step, you are effectively saying: "Calculate the utility at time $t$, weight it by marginal utility, then sum." But to compare that sum to a cost at $t_0$, you still need to know the exchange rate between utility at $t$ and consumption at $t_0$. That exchange rate mathematically collapses back into $\delta + \eta g$.
  **The Exposure:** If your distinction does not change the calculated NPV of a project, the CBA practitioner will correctly tell you that you are describing the same machine but painting the gears different colors. If your distinction *does* change the NPV, you need to show the calculation method. If you cannot provide a formula that yields different results than the standard Ramsey application, your "category mistake" charge is merely rhetorical, not technical.

  **2. Fatal: Observational Equivalence under Endogenous Growth**
  You anticipate the objection that $(\delta=0, \eta=2)$ can mimic $(\delta=1\%, \eta=1)$. You dismiss this as a notational preference. It is not, if growth $g$ is endogenous.
  $\delta$ discounts the future regardless of whether the future is richer or poorer. $\eta g$ only discounts if the future is richer ($g>0$). If a climate policy reduces future growth (a common trade-off), the $\eta g$ term shrinks, lowering the discount rate and making future damages loom larger. A $\delta$-based discount rate would remain high regardless of the policy's impact on growth.
  **The Exposure:** If your model treats $\eta g$ as a fixed scalar (as standard appraisals often do for simplicity), you lose the ability to capture the feedback loop between policy, growth, and valuation. If you acknowledge the feedback loop, you admit that $\eta g$ functions exactly like a discount rate in the decision procedure. You cannot have it both ways: either it acts like a rate (and your category mistake claim weakens) or it doesn't act like a rate (and your model ignores policy impacts on growth).

  **3. Severe: The Shadow Price of Capital (SPC) Trap**
  You asked specifically about this. The SPC argument states that public projects crowd out private investment, which has a higher return than social time preference. Therefore, costs (investment) should be shadow-priced differently than benefits (consumption).
  **Does this hurt you?** Yes, but not how you think. The SPC approach validates your intuition that "one number" is wrong. However, SPC practitioners resolve this by converting everything into a *single* consumption-equivalent discount rate for the final NPV calculation. They acknowledge the complexity but collapse it for the decision rule.
  **The Exposure:** If you argue that the practice is *incoherent* because it uses one number, the SBA guy will reply: "We use one number because the legislation requires a binary decision (proceed/do not proceed). We know it's a simplification. Your philosophical distinction doesn't help me sign the form." Your thesis risks being *normatively correct but institutionally inert*. If you cannot show how your distinction changes the sign of the NPV on a real project, you are offering a metaphysical critique of a spreadsheet tool.

  **4. Awkward: The "Fanaticism" of $\delta=0$**
  You asked if $\delta=0$ plus $\eta > 0$ commits you to absurd savings rates.
  **Yes, it does.** If $\delta=0$ and expected consumption growth is positive, the optimal savings rate approaches 100% in standard utilitarian models. You are obligated to starve the present to feed the future until marginal utility equalizes. Since the future is potentially infinite, the sum of future utility can swamp any finite present loss.
  **Can you resist without $\delta$?** Only by modifying the aggregation function (e.g., prioritarianism, sufficientarianism, or finite horizons). But if you modify the aggregation function, you are effectively admitting that the standard Ramsey framework (which you are critiquing) was never the right tool, rather than claiming the *interpretation* of the Ramsey formula is wrong.
  **The Exposure:** If you keep standard utilitarian aggregation but insist $\delta=0$, you are vulnerable to the "absurd savings" objection. If you change aggregation to avoid this, you are no longer critiquing the discount rate; you are critiquing the welfare function. You need to be clear on which battle you are fighting.

  **5. Awkward: Revealed Preference vs. Normative Ethics**
  You know this one, but the specific exposure is: Asset markets reveal $\delta > 0$. If you say this is "irrational," you must explain why the state should not use the market rate for public investment (the opportunity cost of capital argument).
  **The Exposure:** If you argue the state should use $\delta=0$ while the market uses $\delta>0$, you create an arbitrage opportunity. The government could borrow at the social rate and invest at the market rate, generating infinite value. To block this, you must argue public projects are not substitutable with private assets. This is defensible but requires a heavy lift on market imperfections that has nothing to do with intergenerational ethics.

  ---

  ### Direct Answers to Your Specific Questions

  **1. Is the $\delta/\eta$ split empirically empty? Is that a problem?**
  It is empirically empty *only if* growth is exogenous and fixed. If policy affects growth, the split is real. $\delta$ discounts time; $\eta$ discounts inequality.
  **Is it a problem?** Yes, if your claim is that the *practice* is incoherent. If the practice yields the same decisions as your preferred framework, the incoherence is purely justificatory. A sympathetic defender would concede: "If the output is identical, the 'category mistake' is a philosophical clarification, not a practical correction." You cannot claim the practice is *wrong* (producing bad decisions) if the math is equivalent. You can only claim it is *misunderstood*. This weakens your "real-world consequence" claim.

  **2. Does the Shadow Price of Capital line falsify your thesis?**
  No, it supports the "one number is bad" claim. But it falsifies the idea that philosophers are the only ones who know this. Economists use SPC *because* they know investment and consumption have different shadow prices.
  **Consistency:** Your thesis is consistent with SPC *if* you argue that standard appraisal ignores SPC and uses a single WACC (Weighted Average Cost of Capital) incorrectly. If the government body you are critiquing *already* uses SPC adjustments, your critique is outdated. Check their manual. If they use a single rate for all flows, you win. If they apply different conversion factors for capital vs. current expenditure, you look naive.

  **3. Does $\delta=0$ commit you to fanaticism, and can you resist?**
  Yes, it commits you to extreme savings demands under standard aggregation. You can resist by:
  *   Arguing $\eta$ is very high (diminishing marginal utility kicks in fast).
  *   Arguing growth $g$ will be zero or negative (climate damages).
  *   Rejecting total utilitarianism (e.g., average utilitarianism or person-affecting views).
  **The Trap:** If you use the third option, you have left the Ramsey framework entirely. You cannot critique the Ramsey formula for implying fanaticism if you abandon the welfare function that generates the formula. You must hold the welfare function fixed to critique the parameter. If you hold it fixed, you must accept the high savings rate or provide a non-$\delta$ constraint (e.g., "rights of the present generation").

  **4. What does your reading predict about appraisal that the standard reading doesn't?**
  Your reading predicts:
  *   **Growth-Dependent Discounting:** Sectors with higher expected growth should be discounted at higher rates (because $\eta g$ is higher). Standard practice often uses a single rate for all sectors. If the agency uses one rate for transport (high growth) and one for health (low growth), your theory explains it better than the standard view.
  *   **Distributional Weighting:** Benefits to poorer future generations should count more than benefits to richer ones, independent of time. Standard CBA usually treats a dollar as a dollar regardless of who holds it. If the agency *refuses* to weight by income, your theory says they are wrong on distribution, not just time.
  *   **Declining Rates:** You predict declining rates should arise from uncertainty in $g$, not from "impatience."
  **Where you'll be embarrassed:** If the agency uses different rates for health and money *for political reasons* (e.g., "voters care more about health"), your coherence charge loses bite. It turns out the "incoherence" is just democratic responsiveness. Also, if they use a single rate because calculating sector-specific $\eta g$ is too data-intensive, your critique is theoretically sound but practically irrelevant. The CBA guy will say: "Precision is the enemy of good."

  **5. Which claim is load-bearing?**
  **Claim 2 ($\eta g$ isn't a rate) is load-bearing.**
  *   If Claim 1 ($\delta=0$) falls, you revert to standard Ramsey with positive time preference. Your category mistake claim might still hold, but it's less urgent.
  *   If Claim 3 (Uncertainty) falls, you just lose the declining rates argument.
  *   If Claim 2 falls, your whole thesis collapses. If $\eta g$ *is* functionally a discount rate in the aggregation process, then writing it as part of the social discount rate is not a category mistake; it is a correct description of the marginal rate of substitution.
  **Recommendation:** If you must give one up, keep Claim 1 ($\delta=0$) and Claim 3 (Uncertainty). Soften Claim 2. Instead of saying "$\eta g$ is not a rate," say "$\eta g$ is a rate *of a different kind* (distributional vs. temporal), and conflating them hides the ethical trade-off." This allows you to keep the critique without getting trapped in semantic arguments about the definition of "rate."

  ### Summary Advice for the Workshop

  The CBA practitioner in the room will not care about the metaphysics of time. He cares about the manual. To survive:
  1.  **Concede the "Notational" Point:** Admit that for a fixed growth path, the math is identical. Pivot to why the *justification* matters for policy stability (if we think it's time preference, we might not adjust when growth forecasts change; if we know it's distributive, we must adjust).
  2.  **Check the Manual:** Before the workshop, read the specific guidance manual the CBA guy uses. If it already distinguishes between consumption and investment shadow prices, or allows for sector-specific rates, acknowledge it. If you attack a straw man, you lose the room.
  3.  **Address the Savings Rate:** Have a clear answer for why $\delta=0$ doesn't bankrupt the current generation. "We constrain optimization with rights/constraints" is a better answer than "The math works out."
  4.  **Operationalize:** Sketch how a CBA spreadsheet changes under your view. If the cells don't change, admit it's a philosophical clarification. If they do change, be ready to defend the new numbers.

  Your strongest angle is not that the math is wrong, but that the *labeling* licenses ethical negligence. Calling $\eta g$ a "discount rate" makes it look like a market parameter we can't control, rather than a distributive choice we are responsible for. Stick to that.
