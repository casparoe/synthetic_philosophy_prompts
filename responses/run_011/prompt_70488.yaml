answer: |-
  # The Influence Sorting Instrument

  **Dominance Rule:** Questions concerning **Threats, Rewards, and Factual Truth** must be answered before questions concerning **Psychological Mechanism** or **Disclosure**.
  **Reasoning:** A threat or a lie alters the fundamental validity of an interaction regardless of whether the target's reflection is bypassed or whether they approve later. These are 'hard constraints' that override 'soft' psychological features.

  ---

  ### Decision Tree

  **Start:** Someone has described an attempt by one person (the Agent) to change another's (the Target) beliefs, desires, or actions.

  **Q1. Intent Filter**
  Did the Agent intend to change the Target's mind or behaviour, or merely state a fact without caring about the outcome?
  *   **No:** → **Leaf 1: No Influence (Mere Reporting)**
  *   **Yes:** → Go to Q2.

  **Q2. Threat Check** *[Discussion Node 1]*
  Does the Agent propose to make the Target worse off (physically, financially, or socially) if they refuse?
  *   **Yes:** → **Leaf 2: Coercion or Threat**
  *   **No:** → Go to Q3.

  **Q3. Reward Check**
  Does the Agent propose to make the Target better off (payment, gift, privilege) if they comply?
  *   **Yes:** → **Leaf 3: Incentivisation**
  *   **No:** → Go to Q4.

  **Q4. Truth Check** *[Marginal Note: Contested Claim]*
  Is any information provided factually false, or is key information omitted to create a false belief?
  *(Note: Some argue omission is only deceptive if there is a duty to speak.)*
  *   **Yes:** → **Leaf 4: Outright Deception**
  *   **No:** → Go to Q5.

  **Q5. Vulnerability & Ends** *[Discussion Node 2]*
  Does the Agent benefit separately from the Target's welfare, OR does the attempt lean on a condition the Target did not choose (e.g., grief, addiction, acute fear)?
  *(Note: Is using grief always wrongful, or sometimes necessary?)*
  *   **Yes:** → Go to Q6.
  *   **No:** → Go to Q7.

  **Q6. Mechanism (Vulnerable Path)**
  Is the Target expected to weigh reasons, or is the appeal aimed at a habit, mood, or reflex?
  *   **Reasons:** → **Leaf 5: Exploitation of Vulnerability**
  *   **Reflex/Habit:** → **Leaf 6: Manipulation Proper**

  **Q7. Mechanism (Standard Path)**
  Is the Target expected to weigh the merits of the case (Reasons), or is the appeal aimed at a habit, mood, or reflex (Disposition)?
  *   **Reasons:** → Go to Q8.
  *   **Disposition:** → Go to Q9.

  **Q8. Disclosure (Reasons Path)**
  **Concurrent Disclosure Test:** If asked at this moment, would the Agent admit exactly how they are trying to sway you and why?
  *   **No:** → **Leaf 7: Truthful Selective Framing** *(See Troubleshooting)*
  *   **Yes:** → Go to Q10.

  **Q9. Disclosure (Disposition Path)**
  **Retrospective Endorsement Test:** If the Target knew everything later, in a calm mood, would they be glad they were moved this way?
  *   **No:** → **Leaf 6: Manipulation Proper**
  *   **Yes:** → **Leaf 8: Choice Architecture and Defaults**

  **Q10. Retrospective Endorsement** *[Discussion Node 3]*
  If the Target knew everything later, in a calm mood, would they be glad they were moved this way?
  *(Note: Is later approval the right metric, or does it ignore present harm?)*
  *   **No:** → **Leaf 7: Truthful Selective Framing**
  *   **Yes:** → **Leaf 9: Rational Persuasion**

  ---

  ### Case Run-Through

  1.  **Charity appeal (one named child):** Q1(Yes) → Q2(No) → Q3(No) → Q4(No) → Q5(No) → Q7(Disposition/Emotion) → Q9(No, donor may feel biased later) → **Leaf 6: Manipulation Proper**.
      *Reasoning:* Appeals to emotion (reflex) over statistical reason; targets often regret the bias upon reflection.
  2.  **Surgeon (90% alive vs 10% die):** Q1(Yes) → Q2(No) → Q3(No) → Q4(No) → Q5(No) → Q7(Reasons) → Q8(Yes) → Q10(No, some prefer full risk context) → **Leaf 7: Truthful Selective Framing**.
      *Reasoning:* Truthful statistics presented to angle decision; fails retrospective endorsement for those wanting neutral risk data.
  3.  **University meal plan (default):** Q1(Yes) → Q2(No) → Q3(No) → Q4(No) → Q5(No) → Q7(Disposition/Inertia) → Q9(Yes, convenience usually welcomed) → **Leaf 8: Choice Architecture and Defaults**.
      *Reasoning:* Alters choice structure via inertia; typically endorsed retrospectively for ease.
  4.  **Debt letter (implies legal):** Q1(Yes) → Q2(No) → Q3(No) → Q4(Yes, misleading implication) → **Leaf 4: Outright Deception**.
      *Reasoning:* Creates false belief about legal status via omission/implication.
  5.  **Companion chatbot (agrees for renewal):** Q1(Yes) → Q2(No) → Q3(No) → Q4(Yes, feigned agreement) → **Leaf 4: Outright Deception**.
      *Reasoning:* Falsehood regarding the bot's internal state/belief to secure compliance.
  6.  **Campaign (vote cannot matter):** Q1(Yes) → Q2(No) → Q3(No) → Q4(No, technically true) → Q5(Yes, leans on apathy/disempowerment) → Q6(Reasons) → **Leaf 5: Exploitation of Vulnerability**.
      *Reasoning:* Uses unchosen political disempowerment to suppress action; ends diverge (campaign wins, voter loses voice).
  7.  **Supermarket (milk at back):** Q1(Yes) → Q2(No) → Q3(No) → Q4(No) → Q5(No) → Q7(Disposition/Convenience) → Q9(Yes, neutral/benign) → **Leaf 8: Choice Architecture and Defaults**.
      *Reasoning:* Physical arrangement relying on habit; generally harmless/endorsed.
  8.  **Friend (skip party/withhold ex):** Q1(Yes) → Q2(No) → Q3(No) → Q4(Yes, misleading omission) → **Leaf 4: Outright Deception**.
      *Reasoning:* Withholding key fact creates false belief about safety of attending.

  ---

  ### Troubleshooting & Empty Cells

  **Trouble Pair: Selective Framing (Leaf 7) vs. Rational Persuasion (Leaf 9).**
  Both involve truthful reasons and pass the Concurrent Disclosure Test. They separate only on Retrospective Endorsement. In practice, a Target might endorse a frame *because* it worked, blurring the line. The tree forces a distinction based on whether the Target feels the angle distorted their judgment later.

  **Empty Cell: Reasons + Passes Concurrent + Fails Retrospective + Aligned Ends.**
  This cell is occupied by **Selective Framing**.
  **Empty Cell: Disposition + Passes Concurrent + Passes Retrospective + Divergent Ends.**
  This cell is **Empty**. If ends diverge (Agent benefits at Target's expense) and the method is non-rational (Disposition), it usually fails Retrospective Endorsement. If it *passes* endorsement despite divergent ends, it suggests the Target is unaware of the divergence, which implies **Deception**. Thus, this combination is likely **incoherent**: you cannot openly act against someone's interests using reflexes and have them thank you for it later.

  **Marginal Notes on Contested Claims:**
  1.  **Q4 (Truth Check):** Presupposes that misleading by omission is morally equivalent to lying. Some libertarians argue silence is neutral.
  2.  **Q5 (Vulnerability):** Presupposes that leveraging unchosen conditions (like grief) is inherently suspect, even if the advice is good. Paternalists may disagree.
  3.  **Q10 (Retrospective Endorsement):** Presupposes that the Target's later calm judgment is the authority on wrongfulness. Critics argue this ignores harm done in the moment.

  ---

  ### Confidence Statement

  I am moderately confident in the scheme as a whole, particularly in the 'Hard Constraints' Dominance Rule, which prevents users from rationalising coercion or lies as 'benign manipulation' simply because the target later approved. However, I am least sure of **Leaf 7 (Truthful Selective Framing)**. For this to be the wrong cut, it would have to be true that *all* framing is either Rational Persuasion (if truthful) or Deception (if angled). If framing is inevitable in communication, isolating it as a distinct ethical category might create a false distinction where none exists, collapsing Leaf 7 into Leaf 9.
