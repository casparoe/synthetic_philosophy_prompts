prompt: |-
  Our reading group is doing Anarchy, State, and Utopia this term and I'm the one who keeps getting stuck somewhere in the Chamberlain section, but the person actually driving me nuts is my friend Dan, who never got past the first twenty pages and who wheeled out a certain line at three separate dinners this month: "taxation of earnings from labor is on a par with forced labor." He delivers it with the air of a man who has just ended the conversation, usually right after somebody floats the idea that the state might tax people to fund, say, a public health insurance scheme. And then he'll happily slide from that to "taxation is theft" as though the second follwed from the first.

  Here's my problem. I can feel that the line isn't just an insult wearing a premise's clothes, but I can't separate out the different things it could be claiming, and when I tried at dinner I ended up blurting "that's just question-begging" and he said no it isn't, it's a conceptual truth about what taking the product of someone's labor amounts to. So: lay out for me, as a menu rather than a verdict on one favorite interpretation, the distinct precise theses that sentence could be expressing. Pull the axes apart explicitly — what "on a par with" is doing (moral equivalence? equal degree of wrongness? the same rights-violation? membership in the same category of act?); whether the claim is about the *quantity* of hours appropriated or about other people directing your activities; whether it covers all taxation or only redistributive and patterned taxation, including whatever tax funds the night-watchman state itself; whether it's about the marginal rate, the average rate, or the whole scheme; and whether it's functioning as a premise, as a conclusion, or as nothing more than self-ownership restated in flashier clothes. For each reading say outright whether it's trivially true, substantive but defensible, or false, and then tell me which reading Dan's dinner-party use actually needs in order to block the health insurance suggestion — because my suspicion is that the reading doing the work and the reading that's true aren't the same one, and I want to know if I'm right about that.

  And don't fence-sit at the end. Commit: tell me which reading you think survives contact with the entitlement theory and the Chamberlain argument, whether "taxation is theft" is an upgrade on the original line or a downgrade, and what the single best counter Dan could make after reading your menu. I don't have the book in front of me, so paraphrase rather than throwing page numbers at me, and assume I know what a patterned principle is but not much beyond that.
