answer: |-
  ### Brainstorming Pass: Candidate Mappings

  Before we lock in the argument, here are the potential connections between the text and the economic debate. I'm listing these to see which ones bear weight and which are just aesthetic resonance.

  *   **The Table of Hours:** Maps to the Central Plan. Every hour is assigned. *Verdict:* Strong mapping to command economy, but specifically to Taylorist time-motion study rather than price signals.
  *   **The Green Wall:** Maps to autarky or closed economy. Separates the "calculated" inside from the "unknown" outside. *Verdict:* Holds well for Hayek's "boundary of knowledge."
  *   **D-503's Integral:** A capital good project. How is its value determined? By decree. *Verdict:* Direct hit for Mises's calculation problem (no price mechanism for capital).
  *   **Pink Checks:** Ration coupons. *Verdict:* Decoration. They exist but don't drive the plot or the economic logic.
  *   **Glass Apartments:** Transparency. *Verdict:* This is surveillance/discipline, not economics. Don't let the econ student claim this is "market transparency." It's the opposite; it's the elimination of private space.
  *   **The Imagination/Illegals:** The variable that breaks the model. *Verdict:* This is the core. Maps to entrepreneurial discovery (Hayek) or preference heterogeneity (standard micro).
  *   **The Great Operation:** Lobotomy to enforce rationality. *Verdict:* No economic equivalent. This is the novel's unique contribution to the debate (coercive preference modification).
  *   **The Benefactor/Numbers:** The Planning Board. *Verdict:* Holds.

  ***

  ### Intro Notes: *We* and the Calculation Debate

  **Opening Hook (2 mins)**
  Acknowledge the elephant in the room. One of you has been saying this book is the Socialist Calculation Debate before the debate happened. You're partially right, but the chronology is tricky, and the target is different.
  *   *We* was written [1920–1921].
  *   Mises's seminal article on economic calculation was [1920]. They are practically simultaneous. Zamyatin isn't reacting to Mises; they are reacting to the same thing: War Communism and the industrialization of war.
  *   The later debate (Lange/Lerner in the [1930s], Hayek in the [1940s]) comes later. So if this is the calculation debate, it's the opening salvo, not the summary.
  *   **Goal for today:** We aren't here to decide if socialism works. We're here to decide if Zamyatin thinks a perfectly calculated society is *humanly possible*, and if not, why.

  **(a) Mapping the One State onto the Debate (6 mins)**

  Let's be disciplined. What in the book is actually economic, and what is set dressing?

  **1. The Mises Claim (No Prices = No Rationality)**
  *   *The Theory:* Mises argues that without private property in capital goods, you don't have genuine prices. Without prices, you can't compare inputs to outputs. You don't know if building the *Integral* is "worth" the steel used.
  *   *The Novel:* D-503 is a mathematician. He talks about equations, load, energy units. There is no money. The *Integral* is built because the Benefactor wills it.
  *   *Does it hold?* **Yes.** The One State operates exactly as Mises fears. There is no mechanism to determine if the *Integral* is efficient. It is simply *done*.
  *   *The Wrinkle:* Mises thinks this leads to chaos/starvation. In *We*, the lights stay on. The food is delivered (the petroleum-based food substitute). The system *functions* technically. Zamyatin is showing us a Misesian nightmare that *works* mechanically but fails spiritually.

  **2. The Lange/Lerner Reply (Trial and Error)**
  *   *The Theory:* Later socialists argued a Planning Board could simulate markets. Set prices, see if there's a surplus/shortage, adjust. "Trial and error."
  *   *The Novel:* The Table of Hours. It is rigid. When things go wrong (the sabotage, the rebellion), the response isn't price adjustment; it's the Guardian service and the Great Operation.
  *   *Does it hold?* **No.** There is no feedback loop of the Lange variety. There is only enforcement. If the econ student claims the Table of Hours is a simulation of market equilibrium, push back. It's a schedule, not a price system.

  **3. The Hayek Shift (Knowledge and Discovery)**
  *   *The Theory:* Hayek argues the problem isn't just calculation; it's that knowledge is dispersed. The "man on the spot" knows things the planner doesn't. The market is a discovery procedure.
  *   *The Novel:* The Green Wall. Inside is known (calculated); outside is unknown (nature, chaos). The Illegals outside represent the dispersed knowledge the State can't capture.
  *   *Does it hold?* **Strongly.** But with a tweak. For Hayek, the knowledge is *existing* but hidden (e.g., local conditions). For Zamyatin, the "knowledge" is *created* by the imagination. It doesn't exist until the rebel imagines it.
  *   *Decoration Check:* The Glass Apartments. The econ student might say this solves the information problem (perfect transparency). **Say "this doesn't hold."** Glass isn't for economic data; it's for behavioral compliance. It eliminates the *private* sphere where imagination hides. It's not an information feature; it's a disciplinary feature.

  **(b) Information vs. Motivation: Testing the Hunch (5 mins)**

  Your hunch: Zamyatin is onto something about imagination/unpredictability that is adjacent to Hayek but distinct.
  **Verdict: Your hunch is correct.**

  *   **The Information Problem:** If the One State fails because it lacks data (e.g., doesn't know how much fuel the *Integral* needs), that's Hayek. But D-503 seems to have the data. The engines work. The math checks out.
  *   **The Motivation Problem:** Usually, economists say planned economies fail because people lack incentives (why work hard if paid the same?). In *We*, everyone works. The Table of Hours is obeyed (mostly).
  *   **The Zamyatin Problem:** It's neither information nor standard motivation. It's **Endogenous Preference Change.**
      *   In economics, preferences are usually fixed. I like apples, you like oranges.
      *   In *We*, the State tries to *fix* preferences to make the math work. Humans *must* want what the State wants.
      *   The "failure" comes because human imagination *generates* new preferences that violate the equation.
      *   **Hayek vs. Zamyatin:** Hayek says "We can't know what people want." Zamyatin says "People will want what you can't predict." It's ontological, not epistemic. It's not that the Planner is ignorant; it's that the Subject is creative.
      *   **Talkable Point:** Tell the group: "Hayek worries the Planner doesn't know the map. Zamyatin worries the terrain changes while the Planner is looking at it."

  **(c) The Pushback: Taylorism, Fordism, and War (5 mins)**

  Here is where you gently correct the econ PhD student. Reading *We* solely as socialist economics flattens it.

  *   **Biography:** Zamyatin was in England during WWI [1916–1917]. He worked in shipyards [Tyne Dock?]. He saw Taylorism (scientific management) and Fordism (assembly lines) in action *before* he saw the Soviet bureaucracy fully form.
  *   **The Target:** The Table of Hours isn't just Soviet planning; it's industrial efficiency taken to the logical extreme. It's the assembly line applied to human souls.
  *   **War Communism:** The immediate context is Russia during the Civil War. Rationing, militarization of labor, strict discipline. This wasn't "peacetime socialism"; it was a siege economy.
  *   **The Flattening:** If you tell the group this is just about "socialist calculation," you make it a technical debate about efficiency.
      *   **Correction:** The book isn't asking "Can they calculate?" It's asking "Should we be calculable?"
      *   **Tell the Econ Student:** "You're right that the *structure* mirrors the calculation problem. But you're wrong about the *enemy*. The enemy isn't bad math. It's the idea that human beings *should* be variables in an equation. Zamyatin is attacking the rationality of the Enlightenment, not just the Soviet Gosplan."
  *   **Does the mapping strain?** Yes. Socialist calculation assumes the goal is material welfare. The One State's goal is "mathematically infallible happiness." That's a theological/philosophical goal, not an economic one.

  **(d) What the Novel Gives the Debate (2 mins)**

  Why read fiction instead of Hayek? What can Zamyatin do that the economists can't?

  *   **The Cost of Rationality:** Economic theory assumes agents are rational. Zamyatin shows the *pain* of being forced to be rational. D-503's headache, his "soul" hurting. The theory treats irrationality as an error; the novel treats it as a symptom of life.
  *   **The Form Enacts the Failure:**
      *   Look at the Records. They start precise, mathematical, confident.
      *   As the imagination takes hold, the syntax breaks. D-503 uses words like "irrational," "square root of minus one."
      *   **The Point:** The language itself cannot contain the variable. The economic models assume stable units of account. Zamyatin shows the unit of account (the human mind) destabilizing.
  *   **The Great Operation:** This is the kicker. The State's final solution to the calculation problem is lobotomy.
      *   Economics asks: "How do we satisfy preferences?"
      *   Zamyatin asks: "What if we remove the capacity to have preferences?"
      *   No economist in the calculation debate explicitly argues for lobotomizing the population to make the equilibrium hold. Zamyatin exposes the logical endpoint of prioritizing the Plan over the Person.
  *   **Closing Image:** The final record. D-503 is "cured." He watches the torture of his friend and feels nothing but duty. The calculation works. The humanity is dead.
      *   **Takeaway:** The calculation debate asks if socialism is *possible*. *We* asks if a perfectly calculated world is *habitable*.

  **Summary for the Samosa Moment:**
  If the econ student jumps in:
  1.  Agree that the *structure* anticipates Mises/Hayek (no prices, central plan).
  2.  Correct the chronology (it's simultaneous with Mises, not 15 years early for the whole debate).
  3.  Pivot to the deeper point: Zamyatin isn't worried about the price of steel; he's worried about the price of the soul. The "calculation" fails not because the math is wrong, but because the variables refuse to stay still.
