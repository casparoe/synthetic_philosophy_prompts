  **JOINT STATEMENT ON THE NATURE OF TRUTH AND THE LIMITS OF INQUIRY**

  **Date:** October 14, 2023
  **Location:** The Cambridge Colloquium (Room 4B)
  **Signatories:** C. P. (Representing the Realist Pragmaticist Position) & W. J. (Representing the Humanist Pragmatist Position)

  **Preamble**
  Following one year of private correspondence regarding the ontological status of unobservable past events, we, the undersigned, submit this joint statement. We acknowledge that while our metaphysical commitments diverge, our methodological rejection of static correspondence theories aligns us against the scholastic realism of the nineteenth century. This document serves to map the topology of our agreement, the precise coordinates of our disagreement, and the specific implications of our views regarding the historical artifact known as "The 1848 Letter."

  ### I. Claims of Mutual Endorsement

  1.  **Rejection of the Copy-Theory:** We both reject the notion that truth consists in a mental state copying or mirroring a reality external to it. A belief is not a photograph of the world; it is a rule for action. To call a belief "true" is not to describe its internal structure but to validate its relation to experience.
  2.  **The Primacy of Practice:** We agree that the meaning of any concept lies in its practical consequences. There is no difference in meaning between a proposition that makes no difference to practice and one that is empty.
  3.  **Definition of Practical Consequences:** We are both prepared to say that practical consequences amount to *expected sensations or reactions*. For a proposition to be meaningful, it must entail a conditional prediction: "If I act thus, I shall experience that."
  4.  **The Fallibility of the Present:** We agree that no current belief is immune to revision. Certainty is a psychological state, not a logical guarantee.

  ### II. Table of Residual Disagreements

  | Feature of Truth | Description Acceptable to C. P. (Peircean) | Description Acceptable to W. J. (Jamesian) |
  | :--- | :--- | :--- |
  | **Temporal Orientation** | Truth is the opinion fated to be ultimately agreed to by all who investigate, in the indefinite future. | Truth is what proves itself to be good in the way of belief within the course of present and immediate experience. |
  | **Independence** | Reality is independent of what any finite mind thinks it is; the truth is there before we find it. | Reality is plastic to some extent; truth is often *made* by the act of believing it when that belief fills a need. |
  | **Normative Force** | We *ought* to believe only where evidence compels assent; willful belief is a moral failing. | We have a *right* to believe in the absence of evidence if the option is living, forced, and momentous. |
  | **The Nature of Facts** | Facts are brute; they constrain inquiry from the outside. | Facts are relational; they are encountered within the stream of experience. |

  ### III. The Cruxes: The Case of the 1848 Letter

  **The Proposition:** *The letter written in 1848 and burned unopened contained a confession of guilt.*
  **The Condition:** No trace of the contents exists. No witness read it. No physical evidence remains.

  | Sub-Question | The Case Bearing on It | Verdict of C. P. | Verdict of W. J. |
  | :--- | :--- | :--- | :--- |
  | **1. Is the proposition currently true or false?** | The physical act of writing occurred. The ink dried on the paper. The paper burned. | **True or False (Determinate).** The content was fixed at the moment of inscription. The destruction of evidence does not destroy the fact. | **Indeterminate (Until Believed).** The proposition has no truth-value until a believer adopts it to navigate a specific situation. |
  | **2. What makes it so?** | The ontological ground of the truth claim. | **The Actual Past.** The reality of the 1848 writer's intention constrains the truth, regardless of our access. | **The Present Utility.** If believing it was a confession resolves a historical tension or provides moral closure, that utility *makes* it true. |
  | **3. What does a reader acquire by believing it?** | The epistemic status of the believer who accepts the proposition without evidence. | **Anxiety and Error.** They acquire a belief that cannot be tested. They risk holding a false opinion that inquiry would eventually refute if the letter existed. | **Peace and Function.** They acquire a working hypothesis that allows them to proceed with life. They gain the "cash-value" of the belief (e.g., closure). |
  | **4. Can the truth change?** | If new information arises (e.g., a duplicate is found). | **No.** The truth was always what the letter said. Our *knowledge* changes, not the truth. | **Yes.** If the duplicate is found and changes the utility of the belief, the truth *of the belief* changes to match the new experience. |

  ### IV. Closing Passage: On Merely Verbal Disputes

  We conclude that a significant stretch of our quarrel is merely verbal, centering on the word **"Reality."**

  When C. P. speaks of Reality, he refers to the *External Permanence* that causes our sensations. When W. J. speaks of Reality, he refers to the *Total Relation* of those sensations to our active life. We are not disagreeing about the world, but about whether the word "Truth" should be reserved for the *destination* of inquiry (C. P.) or the *vehicle* of living (W. J.). We agree that if a belief works forever, it satisfies C. P.'s definition. We agree that if a belief is fated to be agreed upon, it satisfies W. J.'s requirement for stability. The divergence is not in the work of science or life, but in the philosophical labeling of the limit.

  ***

  **Addendum: Private Concessions & Falsification Conditions**
  *(Attached separately, per our agreement to disclose vulnerabilities)*

  **Concession by C. P.:**
  I am forced to admit that the "Ideal Limit" of inquiry is a regulative hope, not a demonstrable fact. I cannot prove that inquiry *will* converge, only that it *must* be presumed to do so for science to be possible. I prefer not to admit that my "Reality" is itself a postulate of faith.
  *   **What would count against my view:** If it were found that distinct communities of inquirers, operating perfectly and indefinitely, converged upon contradictory conclusions without error in method. If reality proved to be fundamentally ambiguous rather than determinate.

  **Concession by W. J.:**
  I am forced to admit that not all "useful" fictions deserve the name of truth. There is a brute resistance in the world that refuses to be molded by my needs. I prefer not to admit that there are "facts" that are true even if believing them ruins my life.
  *   **What would count against my view:** If it were found that a belief could be maximally expedient, emotionally satisfying, and socially cohesive, yet lead inevitably to physical destruction (e.g., believing one can walk on air). If "working" proved entirely disconnected from "fitting" the wider order of experience.

  **Signed,**

  *C. P.*
  **W. J.**
