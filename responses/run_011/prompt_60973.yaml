answer: |-
  Here is a decision procedure designed for your constraints: 15 minutes, no outside research, anti-inflationary, and separating *magnitude* from *credence*.

  ### The Protocol: The 15-Minute Filter

  **Time Budget:** 15 Minutes total.
  **Roles:** One Chair (timekeeper), One Scribe (records numbers), Rest of Board (voters).
  **Rule:** The applicant provides the *story*; the Board assigns the *probability*. Applicants are not allowed to assign their own probabilities to prevent strategic inflation.

  #### Phase 1: The Floor (2 Minutes)
  **Q1: Is this verifiable ex-post?**
  *   *Requirement:* Can we know in 12 months if the money was spent as proposed and if the immediate output occurred?
  *   *Pass:* Yes (e.g., "We bought 500 meals," "We hosted 1 workshop").
  *   *Fail:* No (e.g., "We influenced culture," "We prevented a vague future risk").
  *   *Action:* If **Fail**, automatic **REJECT**. (This kills pitches where you can't even verify if the activity happened, let alone the impact).

  #### Phase 2: The Causal Audit (5 Minutes)
  **Q2: What is the shortest causal chain from Dollar to Outcome?**
  *   *Requirement:* List the links. (e.g., $ \to$ Food $\to$ Hungry Person Fed).
  *   *Judgment:* Count the links.
      *   **Tier A (Direct):** 1-2 links. (Money $\to$ Thing $\to$ Beneficiary).
      *   **Tier B (Mediated):** 3-4 links. (Money $\to$ Program $\to$ Behavior Change $\to$ Benefit).
      *   **Tier C (Speculative):** 5+ links or relies on "critical juncture" theory. (Money $\to$ Research $\to$ Policy $\to$ Adoption $\to$ Existential Safety).
  *   *Action:* Assign Tier. This locks the **Maximum Credence** for Phase 3.

  #### Phase 3: The Credence Assignment (5 Minutes)
  **Q3: What is the Board's Assigned Probability (P) of the *Claimed Impact* occurring?**
  *   *Constraint:* This number is derived **only** from the Tier in Phase 2 and **Track Record**, *never* from the magnitude of the impact claimed.
  *   **The Anti-Inflation Lock:**
      *   **Tier A:** Base P = 80%. (Can be raised to 95% with receipts/lower bounds).
      *   **Tier B:** Base P = 40%. (Can be raised to 60% with expert endorsement).
      *   **Tier C:** Base P = 0.1%. (Hard Cap: Cannot exceed 1% regardless of claimed stakes).
  *   **The Track Record Modifier:**
      *   If the applicant is returning: Did they deliver on *last year's specific scope*?
      *   **Yes:** +10% to P (up to the Tier Cap).
      *   **No / Inflated Scope:** No modifier. (Delivering a $500 project does not increase credence for a $1M claim).
  *   *Action:* Scribe records the **Board P**. If the applicant refuses to specify the impact clearly enough to assign a Tier, P = 0.

  #### Phase 4: The Valuation & Opportunity Cost (3 Minutes)
  **Q4: What is the Value (V) of the outcome?**
  *   *Requirement:* Applicant states V. Board does not debate the *moral value* of the outcome (e.g., "Is a future life worth a current life?"), only the *scale*.
  *   *Judgment:* If V relies on "infinite" or "trillions," accept the number for the math but acknowledge the uncertainty.
  *   **Q5: Does (P × V) / Cost exceed the "Next Best Alternative"?**
  *   *Heuristic:* Compare the **Expected Value per Dollar** against the median of the last semester's funded projects.
  *   *Threshold:* If the pitch is **Tier C**, it requires a **Unanimous Vote** to fund (due to high variance). If **Tier A/B**, simple Majority.
  *   *Values Handoff:* If the math passes but the Board feels the *type* of good is misaligned (e.g., "We prefer local over global"), send to **Full Board Vote** (requires 2 signatures if >$5k).

  ---

  ### Running the Procedure on Your Three Pitches

  #### Case 1: The Food Pantry ($4k)
  *   **Phase 1:** Verifiable? Yes (receipts, meal counts). **Pass.**
  *   **Phase 2:** Causal Chain? Money $\to$ Food $\to$ Person Eats. **Tier A.**
  *   **Phase 3:** Credence? Base 80%. Track record solid. **Board P = 85%.**
  *   **Phase 4:** Value? 1,000 meals. Cost $4k. EV is clear.
  *   **Verdict:** **FUND.** (Majority vote).
  *   *Why:* High credence, low variance. Fits the "ordinary" bucket.

  #### Case 2: AI Governance Outreach ($9k)
  *   **Phase 1:** Verifiable? Yes (workshops held, papers published). **Pass.** (Note: We verify the *activity*, not the *safety*).
  *   **Phase 2:** Causal Chain? Money $\to$ Workshop $\to$ Policymaker Attention $\to$ Regulation $\to$ Existential Risk Averted. **Tier C.** (5+ links, speculative mechanism).
  *   **Phase 3:** Credence? Base 0.1%. Track record: None (first time). **Board P = 0.1% (Hard Cap).**
  *   **Phase 4:** Value? Applicant claims "Trillions of future lives."
      *   *Math:* 0.001 × (Trillions) = Billions of expected lives.
      *   *Cost:* $9k.
      *   *EV/Dollar:* Astronomically high.
  *   **Verdict:** **FUND (Unanimous Required).**
  *   *The Uncomfortable Result:* The procedure forces a **YES**.
      *   *Why you won't like it:* You've voted no every time. The procedure admits the *math* works if you assign even a 0.1% non-zero probability to existential risk mitigation. To vote **NO**, you must argue that P is effectively **0%**.
      *   *The Judgment Call:* This step exposes that your "No" vote is not based on the procedure, but on a hidden premise: that the probability is *lower* than the Hard Cap, or that the Value of future lives is discounted heavily against current lives. The procedure forces you to admit that your rejection is a **Values Question** (discounting the future) or an **Epistemic Claim** (P < 0.001) that you must now defend explicitly, rather than just feeling "irritated."
      *   *Requirement:* Since >$5k, needs two sign-offs. If you can't find a second signer who believes P > 0, it dies here. But procedurally, it clears the bar.

  #### Case 3: The Returning Inflator ($500)
  *   **Context:** Last year asked for $5k, claimed huge stakes, delivered small local thing. This year asks $500, claims stakes are 100x bigger than last year.
  *   **Phase 1:** Verifiable? Yes. **Pass.**
  *   **Phase 2:** Causal Chain? Claims 100x impact with 1/10th the budget. Chain implies efficiency miracle. **Tier C** (Claim violates known cost-effectiveness baselines).
  *   **Phase 3:** Credence?
      *   Base Tier C = 0.1%.
      *   Track Record: Delivered *last year's scope*, not *this year's claim*.
      *   *Modifier:* **None.** (Delivering a small promise does not validate an inflated theory).
      *   **Board P = 0.1%.**
  *   **Phase 4:** Value? Inflated claim.
      *   *Math:* 0.001 × (Inflated Value) = High EV.
      *   *Opportunity Cost:* However, the **Inflation Penalty** triggers here.
      *   *Rule:* If Claimed Impact / Cost ratio exceeds 10x the ratio of their previous delivery, **Automatic Reject**.
  *   **Verdict:** **REJECT.**
  *   *Why:* This stops the "Threshold Learning." They learned they need higher stakes, so they raised stakes without lowering cost. The procedure penalizes *inconsistency* between past delivery and current theory.

  ---

  ### Meta-Analysis: Where the Procedure Breaks

  You asked for honesty about where this is judgment dressed as procedure, and what it can't decide.

  **1. The "Hard Cap" is Arbitrary (The Judgment Call)**
  In Phase 3, I set Tier C (Speculative) at a 0.1% Hard Cap.
  *   *Why:* To prevent Pascal's Mugging.
  *   *The Problem:* Why 0.1% and not 0.000001%? If you set it too high, you fund magic. If you set it too low, you never fund innovation.
  *   *The Reality:* This number is a **policy preference**, not a mathematical truth. It represents your fund's risk tolerance. You are essentially saying, "We are willing to bet 1 in 1,000 on a moonshot, but not 1 in 10,000."
  *   *Risk:* Applicants will learn to frame their pitch as "Tier B" (Mediated) rather than "Tier C" to get the 40% probability. The Chair must be ruthless in classifying the Tier.

  **2. The "Values Handoff" is Where the Real Fight Is**
  In Case 2 (AI), the math says **Fund**. Your intuition says **No**.
  *   The procedure cannot resolve this. It separates *Credence* (P) from *Value* (V).
  *   If you believe V (future lives) should be discounted 99.9% against V (current lives), that is a **Values Question**.
  *   The procedure forces this into the "Full Board Vote" bucket. It does not solve it; it isolates it. It stops you from saying "It's too risky" (which is a P claim) and forces you to say "We prioritize the present over the future" (which is a V claim).
  *   *Limitation:* The procedure cannot tell you if prioritizing the future is "right." It only tells you if you are being consistent.

  **3. The "Track Record" Loophole**
  In Case 3, I added an "Inflation Penalty."
  *   *The Problem:* A student might genuinely find a 10x more efficient method.
  *   *The Fix:* The penalty triggers only if the *mechanism* changes. If they say "We found a cheaper vendor," that's Tier A. If they say "We realized the stakes are higher," that's Tier C.
  *   *Limitation:* Distinguishing between "New Efficiency" and "Story Inflation" requires human judgment in the 5-minute Causal Audit.

  ### Summary of Recommendations

  1.  **Adopt the Tier System:** It prevents applicants from buying their way out of skepticism with bigger numbers.
  2.  **Board-Assigned Probability:** Never let the applicant write the number in the EV equation. They write the story; you write the odds.
  3.  **Accept the Discomfort on Case 2:** If the procedure recommends funding the AI pitch, and you vote No, you must record your vote as **"Values Mismatch"** not **"Low Probability."** This keeps the fund's epistemic integrity intact. You are admitting you don't want to maximize EV, you want to maximize *certain* good. That is a valid stance, but it must be owned.
  4.  **The Sign-Off Rule:** For any Tier C pitch over $5k, require the two sign-offs to write down their assigned P. If one writes 0.1% and the other writes 0%, the funding is blocked. This makes the disagreement explicit.

  This procedure won't stop the muggings from happening; it stops them from winning by default. It forces the muggers to admit they are selling lottery tickets, and forces you to admit whether you're buying.
