prompt: |-
  I'm giving a 25 minute talk at our company's internal engineering conference in about three weeks and I want to get the Q&A prep done early because I know its going to be rough.

  My thesis: we should adopt a standing rule that any change which removes behaviour — deleting a branch that looks dead, retiring a feature flag nobody owns, dropping a retry, removing a weird special case for one legacy customer — has to come with a stated account of why the thing is there, and that if nobody can produce one, the default answer is no. Not "go ask around first," actually no. Two supports. (a) The Burke-ish one: the fact that a thing survived three reorgs and two rewrites is itself weak evidence in its favor, enough to move the burden onto whoever wants it gone — sort of Chesterton's fence turned into a code review policy. (b) An epistemic one: a codebase is basically an archive where most of the creators are unavailable for questioning, so the artifact is the only testimony we're ever going to get, and deleting it should be treated like destroying a source you can't reconstruct. I restrict (b) to the genuinely irreversible stuff — data migrations, decommissioned services, dropped logs, queue and storage schemas — because "just revert it in git" kills the argument for everything else, and I say so out loud in the talk rather than let someone spring it on me.

  Audience: about 60 people, mostly staff and senior engineers from platform and SRE, one appsec engineer, two directors whose main worry is delivery speed, and a guy with a distributed systems PhD who will go after the epistemology instead of the policy. As a room they think dead code is a liability that compounds, that the cure for lost reasons is docs and tests rather than preservation, and that a rule nobody can enforce with tooling isn't a rule.

  Give me the prep sheet: the objections this room will actually raise, roughly in the order they'll come, phrased the way they'd phrase them (please, no philosophy vocabulary in their mouths), how much damage each does, a reply I can deliver in about a minute, and a note on where that reply is soft. Tell me what to concede in the first five minutes to blunt the worst of it, which single reply has to land for the proposal to survive the hour, and the question I'm quietly hoping nobody asks. And separately: where does the fence analogy actually break? My suspicion is that most of the weird old code in there was never built by anyone for a reason at all — it accreted through merges and abandoned experiments — so there's no purpose to recover, only a cause. I'd rather hear that from you now than from the appsec guy on a microphone.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the Request:**
      *   **Speaker:** Senior/Staff engineer (implied by the depth of the thesis).
      *   **Topic:** A conservative policy on removing code/behavior ("Chesterton's Fence for Code"). Default is "No" if reason is unknown.
      *   **Thesis:** Two pillars: (a) Survival = weak evidence of value (Burke/Chesterton), (b) Code as irreversible archive (Epistemic). Restricts (b) to irreversible changes (data, schemas, etc.).
      *   **Audience:** 60 people. Mostly Staff/Senior Platform/SRE. 1 AppSec. 2 Directors (worried about speed). 1 Distributed Systems PhD (will attack epistemology).
      *   **Audience Mindset:** Dead code = liability. Docs/tests > preservation. Rules need tooling enforcement.
      *   **Deliverables:**
          1.  Q&A Prep Sheet (Objections, Damage, Reply, Soft Spot).
          2.  Early Concessions (first 5 mins).
          3.  The "Single Reply" that must land.
          4.  The "Quietly Hoping Nobody Asks" question.
          5.  Analysis of where the Fence analogy breaks (accretion vs. intent).
      *   **Tone:** Pragmatic, engineering-focused, no philosophy jargon in objections.

  2.  **Deconstruct the Thesis & Audience Friction:**
      *   *Thesis:* "Don't delete unless you know why it's there."
      *   *Audience:* "Dead code is technical debt. We need to move fast. Show me the tooling."
      *   *Friction Point 1 (Speed):* Directors will hate the friction.
      *   *Friction Point 2 (Enforceability):* Staff engineers know process without tooling is theater.
      *   *Friction Point 3 (Epistemology):* The PhD will point out that survival isn't evidence of *correctness*, just evidence of *luck*.
      *   *Friction Point 4 (Security):* AppSec knows old code is vulnerable code.
      *   *Friction Point 5 (The "Accretion" Problem):* Code often exists because of merge conflicts or copy-paste, not deliberate design.

  3.  **Drafting the Q&A Prep Sheet:**
      *   *Objection 1 (The Directors/Speed):* "This slows us down."
          *   *Reply:* Frame it as preventing outages (SRE angle).
          *   *Soft Spot:* It *does* slow down greenfield/cleanup.
      *   *Objection 2 (The Staff/Tooling):* "How do you enforce this? It's subjective."
          *   *Reply:* It's a checklist item in the PR template, not a linter rule.
          *   *Soft Spot:* Checklists get ignored.
      *   *Objection 3 (The AppSec):* "Old code is vulnerable code."
          *   *Reply:* Distinguish between *removing* and *patching*. Don't delete until you know impact.
          *   *Soft Spot:* Sometimes deletion *is* the patch.
      *   *Objection 4 (The PhD/Epistemology):* "Survival bias. It survived because nobody touched it, not because it's good."
          *   *Reply:* Acknowledge survival bias, but emphasize *cost of error* asymmetry.
          *   *Soft Spot:* Hard to defend "survival = value" logically.
      *   *Objection 5 (The Pragmatist):* "Just write better docs/tests."
          *   *Reply:* Docs rot. Code is the only truth.
          *   *Soft Spot:* Tests *are* executable docs.

  4.  **Identifying Early Concessions:**
      *   Need to disarm the "Speed" and "Tooling" crowd immediately.
      *   Concede that 90% of code *should* be deletable.
      *   Concede that this rule applies only to the "scary stuff" (irreversible), not every helper function.
      *   Concede that tooling can't solve this, it's a human judgment call.

  5.  **Identifying the "Single Reply":**
      *   What makes the proposal survive? The distinction between *reversible* (git revert) and *irreversible* (data/schema/external deps). If the audience accepts that irreversible changes need higher scrutiny, the policy holds water. If they think *everything* is reversible, the policy dies.

  6.  **Identifying the "Quietly Hoping Nobody Asks" Question:**
      *   "Who pays for the investigation?" or "What happens when the business demands a feature that conflicts with the old behavior?"
      *   Better: "If we can't find the reason, and we can't delete it, do we just leave rot forever?" (The Stagnation Argument).

  7.  **Analyzing the Fence Analogy (The "Accretion" Problem):**
      *   Chesterton's Fence assumes a *builder* with *intent*.
      *   Code often accretes via entropy (merge conflicts, copy-paste, cargo culting).
      *   If there was never a fence, there's no reason to keep it.
      *   *Advice:* Shift from "Reason for existence" to "Cost of removal."

  8.  **Refining and Polishing:**
      *   *Tone Check:* Ensure objections sound like engineers, not philosophers. ("How do I lint this?" vs "What is the ontological status...")
      *   *Timing:* 25 min talk means Q&A is likely tight, but prep needs to cover the "rough" part.
      *   *Specifics:* Mention the PhD, the Directors, the AppSec guy explicitly in the strategy.

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the reply to the PhD too hand-wavy?
      *   *Fix:* Make it about risk asymmetry. It's not about truth, it's about blast radius.
      *   *Critique:* Is the concession too weak?
      *   *Fix:* Make sure the concession explicitly carves out "dead code" that is obviously dead (coverage tools) vs "mysterious code."
      *   *Critique:* The user asked for the "Fence Analogy Break" separately.
      *   *Fix:* Ensure that section is distinct and addresses the "accretion vs. intent" point directly.

  10. **Final Polish:** Organize into the requested sections clearly. (Prep Sheet, Concessions, The One Reply, The Forbidden Question, Fence Analysis).

  *(Self-Correction on the "Forbidden Question"):* The user said "question I'm quietly hoping nobody asks." This should be the one that exposes the fatal flaw in the policy. The fatal flaw is: "What do we do when the answer is 'we don't know' and we *can't* keep it?" (e.g., security vuln, compliance). I'll frame it around the "Stagnation/ROT" problem.

  *(Self-Correction on Fence Analysis):* The user suspects code accretes without reason. I need to validate that and tell them how to pivot. The pivot is from "Preserve Intent" to "Verify Safety."

  Let's assemble the response.cw
answer: |-
  Here is your Q&A prep sheet, tailored to the specific friction points of your audience.

  ### Q&A Prep Sheet

  **1. The "Velocity" Objection (From the Directors)**
  *   **The Question:** "This sounds like a recipe for ticket stagnation. If I have a junior engineer who needs to clean up a module and they have to hunt down the 'why' for every conditional before they can delete it, we've just doubled their cycle time. How do you quantify the cost of this friction?"
  *   **Damage:** High. This frames your policy as an anti-delivery bottleneck.
  *   **The Reply:** "I'm not proposing a forensic audit for every helper function. I'm proposing a stop-light for irreversible changes. If you're deleting a private method, go fast. If you're dropping a column or killing a retry loop that touches billing, the cost of a 30-minute investigation is cheaper than the cost of a P0 incident and a data backfill. We are trading velocity for stability in the high-risk zone only."
  *   **Where it's Soft:** It relies on engineers correctly self-identifying what is "high risk." They often won't.

  **2. The "Enforceability" Objection (From Staff/Platform)**
  *   **The Question:** "You're asking for a cultural rule, but you haven't shown me the lint rule or the CI check. If this isn't automated, it's just a suggestion that will be ignored during crunch time. How do I enforce this in the pipeline?"
  *   **Damage:** Medium-High. Your audience respects tooling over process.
  *   **The Reply:** "You can't lint for institutional knowledge. I'm not asking for a CI gate; I'm asking for a PR template checkbox that says 'I have verified the history of this removal.' It forces a pause. If we can't automate the *thinking*, we have to automate the *prompt* to think."
  *   **Where it's Soft:** Everyone knows PR templates are rubber-stamped without reading.

  **3. The "Security" Objection (From AppSec)**
  *   **The Question:** "Old code is vulnerable code. If we keep a legacy auth pathway because we don't know why it's there, we're maintaining an attack surface we don't understand. Isn't the safer security posture to delete first and ask questions later?"
  *   **Damage:** Medium. Security trumps stability in many orgs.
  *   **The Reply:** "Deleting a security vulnerability is different than deleting behavior. If the code is vulnerable, patch it. But if you delete the behavior without understanding the dependency, you might force a fallback to an *older*, *less* secure path, or break audit logging. We need to know what breaks before we cut the power."
  *   **Where it's Soft:** Sometimes deletion *is* the only viable patch (e.g., removing a deprecated library).

  **4. The "Survival Bias" Objection (From the PhD)**
  *   **The Question:** "You're arguing that survival implies value. But in distributed systems, code often survives simply because it's on a cold path that never executes, or because it's shielded by a retry budget. Survival is evidence of luck, not utility. Why treat luck as a warrant?"
  *   **Damage:** Medium. It undermines your Burke-ish support pillar.
  *   **The Reply:** "You're right, survival isn't proof of *correctness*. But it is proof of *integration*. Even if it's dead weight, it's weight the structure has already adjusted to. Removing it shifts the load. I'm not saying keep it forever; I'm saying the burden of proof is on the person claiming the load shift is safe."
  *   **Where it's Soft:** It concedes the "value" point and pivots to "risk," which is stronger but admits your first pillar was weak.

  **5. The "Documentation" Objection (From General Staff)**
  *   **The Question:** "If the reason is lost, that's a documentation failure, not a code preservation success. Why are we preserving the symptom (mystery code) instead of fixing the disease (lack of docs)?"
  *   **Damage:** Low-Medium. Sounds reasonable but misses the point.
  *   **The Reply:** "Docs rot faster than code. A comment saying 'do not touch' is often a lie by the time you read it. The code's behavior is the only testimony that hasn't been edited. I'd rather preserve the artifact and investigate than trust a wiki page from 2019 and delete the artifact."
  *   **Where it's Soft:** Tests *are* executable docs. If there are no tests covering the "weird case," the code is likely dead.

  ---

  ### Early Concessions (First 5 Minutes)
  *Blunt the "Velocity" and "Tooling" attacks before they load.*

  1.  **Concede the 90%:** Explicitly state that 90% of code cleanup should happen *without* this rule. If coverage tools say it's dead, and it's not schema/data, delete it aggressively. This policy is for the "scary 10%."
  2.  **Concede the Tooling Gap:** Admit upfront: "There is no linter for this. If you're looking for a script to run, I don't have one. This is a heuristic for human judgment during code review."
  3.  **Concede the "Revert" Reality:** Acknowledge that for application logic, `git revert` is a valid safety net. Clarify that your "Epistemic" argument (Support B) applies *strictly* to data migrations, schema changes, and external integrations where revert is impossible or costly.

  ---

  ### The Single Reply That Must Land
  **"The Asymmetry of Error."**

  You must convince them that the cost of **False Positive** (keeping code we could have deleted) is linear (minor maintenance cost), but the cost of **False Negative** (deleting code we needed) is exponential (outage, data loss, compliance breach).

  If they accept that the downside risk is asymmetric, the "default to no" policy becomes a risk management strategy rather than a philosophical stance. If they think the costs are symmetrical, your policy looks like bureaucracy.

  ---

  ### The Question You're Hoping Nobody Asks
  *"If we follow this rule, and we genuinely cannot find the reason for a piece of code, but we also cannot keep it (due to security, compliance, or migration constraints), what is the actual procedure? Do we just freeze the project?"*

  **Why it's dangerous:** It exposes that your policy is a **blocker**, not a **solver**. It forces you to admit that sometimes you *must* fly blind, which contradicts your thesis that flying blind is forbidden.
  **Prep:** Have an escape hatch ready. "In that specific case, we wrap it in a feature flag, shadow the traffic, or run a dual-write migration. We engineer a way to make the change reversible so the 'default no' no longer applies."

  ---

  ### Where the Fence Analogy Breaks (The Accretion Problem)

  Your suspicion is correct. Chesterton's Fence assumes a **teleological origin**—someone built the fence *for a purpose*.

  In software, "fences" (code blocks) often appear via:
  1.  **Merge Conflicts:** A line survived because two devs edited around it, not because it was needed.
  2.  **Cargo Culting:** A dev copied a pattern from StackOverflow or another service without understanding it.
  3.  **Entropy:** A conditional became always-true due to upstream changes, but was never pruned.

  In these cases, there is no "reason" to recover. There is only **cause** (git history) and **effect** (current behavior).

  **How to handle this in the talk:**
  Do not claim the code has *intent*. Claim the code has *consequences*.
  Shift the analogy from "Chesterton's Fence" (don't remove what you don't understand) to **"Archaeological Dig"** (don't throw away the shard until you know if it holds the structure up).

  **The Pivot:**
  Tell the audience: *"I know most of this code isn't there because of a grand design. It's there because of accretion. But even accidental accretion becomes part of the load-bearing wall over time. We aren't preserving the 'reason' it was written; we are preserving the 'equilibrium' the system has found. We need to verify the system can stand without it before we kick it out."*

  This disarms the PhD (who knows code accretes) and the AppSec guy (who knows accidental code is dangerous) by focusing on **systemic stability** rather than **developer intent**.
