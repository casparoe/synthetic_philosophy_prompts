answer: |-
  Here is an ordered agenda of seven questions designed to move your group from conceptual stalemate to an operational standard. The ordering is strict: you cannot answer Question *N* reliably until you have established a working heuristic for Question *N-1*.

  ### 1. Whose objective function is being optimized in this specific interaction?
  *   **Why it is upstream:** Your team's hardest case (feed re-ranking) fails your current draft because it doesn't lie or exploit bias; it simply optimizes for the company, not the user. If you cannot distinguish whose goal is being served, you cannot distinguish manipulation from service. This is the root; everything else is a symptom.
  *   **Tractability:** High. You do not need philosophy. You need to look at the code and the KPI. Engineers can trace the ranking signal; PMs can state the success metric.
  *   **Shipping decision unblocked:** Algorithmic feed changes, recommendation engines, and default sort orders.
  *   **What counts as progress:** Not a definition of "user welfare," but a **declaration requirement**. Progress is a template that forces the feature owner to write down: "This feature optimizes for [Metric X], which correlates to user value because [Reason Y]." If they cannot articulate Reason Y, the feature is blocked by default.

  ### 2. Did the user explicitly consent to this specific type of interruption or influence?
  *   **Why it is upstream:** This solves your "meditation reminder vs. spam email" problem. The mechanism is identical (push notification); the difference is the scope of the prior agreement. You must define the boundary of consent before you can judge the intrusiveness of the tool.
  *   **Tractability:** High. This is a data/UX audit. You can check onboarding flows and settings logs.
  *   **Shipping decision unblocked:** Push notifications, email campaigns, and permission-gated features.
  *   **What counts as progress:** A **consent matrix**. Progress is a document mapping feature types to the specific user action required to enable them (e.g., "Transactional emails require account creation; Engagement emails require explicit opt-in"). Disagreement is resolved by moving a feature to a higher consent tier, not by arguing about psychology.

  ### 3. Is the cost to disengage symmetric to the cost to engage?
  *   **Why it is upstream:** Once you know the goal (Q1) and the consent (Q2), you must check the exit. Loss aversion (streaks) becomes manipulative when the "loss" is artificially constructed and hard to avoid. Symmetry is an engineering constraint that bypasses the need to judge "fairness."
  *   **Tractability:** Very High. Engineers can measure clicks/time to enable vs. disable.
  *   **Shipping decision unblocked:** Subscription flows, streak counters, gamification elements, and hard-to-find delete buttons.
  *   **What counts as progress:** A **friction ratio**. Progress is setting a hard limit (e.g., "It must take no more steps to cancel a subscription than to start one"). If a feature violates the ratio, it is rejected regardless of its utility.

  ### 4. Is the signal presented a true reflection of system state?
  *   **Why it is upstream:** This addresses your "friends active now" banner. If the data is real, it's information. If it's sampled or fabricated to induce urgency, it's deception. This must come after Q1 because sometimes company goals (Q1) tempt teams to fuzz the truth.
  *   **Tractability:** High. Engineers can verify the query behind the UI element.
  *   **Shipping decision unblocked:** Social proof badges, scarcity timers ("3 people looking at this"), and activity indicators.
  *   **What counts as progress:** A **data provenance rule**. Progress is a binary check: "Does this number exist in the database exactly as shown?" If the number is smoothed, sampled, or fake, it fails.

  ### 5. Do we have a proxy metric for post-hoc user regret?
  *   **Why it is upstream:** Your draft failed on "leaves users worse off." You cannot know this at launch. You need a lagging indicator. This is downstream of Q1-4 because it is your safety net when the upstream checks pass but the feature still harms.
  *   **Tractability:** Medium. Requires data science work to correlate engagement with churn or support tickets.
  *   **Shipping decision unblocked:** High-engagement features that pass Q1-4 but feel "aggressive" (e.g., infinite scroll).
  *   **What counts as progress:** A **regret signal**. Progress is identifying a metric (e.g., "session length > 30 mins followed by immediate app delete" or "support ticket keyword frequency") that triggers an automatic review.

  ### 6. Who has the authority to approve a deviation, and what is the burden of proof?
  *   **Why it is upstream:** No standard survives first contact with a revenue target. You need a governance model before you publish the rules, or the rules will be ignored.
  *   **Tractability:** High. This is organizational design, not ethics.
  *   **Shipping decision unblocked:** Any feature that triggers a "block" in Q1-5 but has strong business justification.
  *   **What counts as progress:** An **escalation path**. Progress is naming a specific role (e.g., "VP of Product") who must sign off on exceptions in writing, with the justification made visible to the working group.

  ### 7. Under what conditions do we kill a feature that meets the standard but drifts over time?
  *   **Why it is upstream:** Standards rot. A feature benign at launch can become manipulative as user base or context shifts. This ensures the standard is living.
  *   **Tractability:** Medium. Requires scheduling and review cadence.
  *   **Shipping decision unblocked:** Legacy features that were shipped before this standard existed.
  *   **What counts as progress:** A **sunset clause**. Progress is a scheduled quarterly review date for all "high engagement" features, regardless of their current compliance status.

  ***

  ### What I am deliberately leaving off

  1.  **Defining "Manipulation" vs. "Persuasion" abstractly.**
      *   **Why:** You have already tried this and it failed. Your team is not equipped to solve a centuries-old philosophical problem in two quarters. Furthermore, a definition does not ship code. Focusing on *operational constraints* (symmetry, truthfulness, alignment) achieves the safety goal without requiring semantic agreement on the word "manipulation."
  2.  **The Moral Intent of the Designer.**
      *   **Why:** Intent is unobservable and irrelevant to user harm. A well-meaning PM can ship a coercive feature; a cynical one can ship a helpful one. Evaluating intent wastes time on interpersonal defense rather than feature architecture.
  3.  **Societal or Democratic Harm.**
      *   **Why:** This is out of scope for a consumer app working group. While important, debating polarization or democracy will paralyze your team. Stick to the bilateral relationship between *your* app and *your* user. If you solve that, you have done enough.

  ***

  ### The Single Crux

  The entire approach depends on one assumption: **Incentive Divergence is Measurable.**

  Your standard assumes that you can construct a process (like Q1's declaration requirement) that reliably reveals when the company's interest stops matching the user's interest. If this is false—if the two are so entangled that you cannot disentangle them, or if the tools to measure divergence are too noisy to trust—then Question 1 collapses. If Q1 collapses, the rest of the agenda becomes a compliance checklist that misses the actual danger (the feed re-ranking case).

  **What would move items up or down:**
  Over the next two quarters, you must test Q1 on five live features.
  *   **If you find** that PMs can consistently articulate the divergence and you can validate it with data, keep the order.
  *   **If you find** that PMs *always* claim alignment even when metrics suggest otherwise (and you cannot prove them wrong), then Q1 is broken. You must move **Q5 (Regret Proxy)** to the top of the list. You would have to abandon "intent/alignment" auditing and switch entirely to "outcome/harm" auditing, because you cannot trust the team to self-report the crux.
