answer: |-
  # Autonomous Action Schema Review Procedure (AASR-P1)

  ## 1. The Review Procedure

  **Timebox:** 30 minutes.
  **Participants:** One reviewer (senior engineer), one author (schema owner).
  **Input:** One action schema or one interpreter-to-planner hand-off definition.

  **Question 1: The Fluent Inventory**
  *Ask:* "List every fluent (state variable) this action reads (preconditions) and every fluent it writes (effects)."
  *   **Sufficient Answer:** A complete list matching the schema definition, including negative effects (e.g., `(not (door_open))`).
  *   **Failure to Answer:** Vague references like "updates navigation map" or "changes robot state" without specifying the boolean or numeric fluent.
  *   **Outcome:** If failed, **Do Not Ship**. The schema is ill-formed.

  **Question 2: The Negative Effect Check (Silent-Delta Prevention)**
  *Ask:* "For every fluent *not* listed in the effects, what guarantees it remains unchanged? Is this guarantee derived from the planner's closed-world assumption or an explicit frame axiom?"
  *   **Sufficient Answer:** "It is unchanged because the planner assumes persistence by default, and we have verified no other concurrent process modifies it," OR "We have an explicit `maintain` constraint."
  *   **Failure to Answer:** "We assume nothing else happens," without verifying concurrent processes (e.g., human staff, other robots, sensors).
  *   **Outcome:** If failed, **Do Not Ship**. This is a persistence defect.

  **Question 3: The Exogenous Event Window (Stale-World Prevention)**
  *Ask:* "What is the maximum time delta between the precondition check and the effect execution? What external events could invalidate a precondition within that window?"
  *   **Sufficient Answer:** A specific duration (e.g., "2 seconds") and a list of credible invalidating events (e.g., "Door closes," "Path blocked").
  *   **Failure to Answer:** "The planner handles it," or "Sensors will catch it."
  *   **Outcome:** If the window exceeds the sensor polling rate or safety critical threshold, **Escalate to Safety Lead**. This is a risk appetite decision.

  **Question 4: The Interaction Boundary (Relevance Check)**
  *Ask:* "Does this action change any physical or logical property *not* represented in our fluent inventory (e.g., noise level, psychological comfort, escape route width, fire door integrity)?"
  *   **Sufficient Answer:** "No, all relevant physical changes are mapped to fluents," OR "Yes, but we have a separate global constraint monitor for that."
  *   **Failure to Answer:** "That's not in the schema," or "We didn't consider that."
  *   **Outcome:** If "Yes" and no monitor exists, **Escalate to Risk Committee**. This is a boundary definition failure, not a coding error.

  **Question 5: The Precondition Completeness (Ghost-Precondition Prevention)**
  *Ask:* "Are all physical requirements for execution explicitly checked in the preconditions? If not, why is it safe to assume they hold?"
  *   **Sufficient Answer:** "Yes, all checked," OR "No, but it is physically impossible for them to fail (e.g., gravity)," OR "No, but failure results in a safe stop."
  *   **Failure to Answer:** "It usually works," or "The LLM ensures it."
  *   **Outcome:** If reliance is on the LLM for safety-critical preconditions, **Do Not Ship**. The classical planner must own safety checks.

  ---

  ## 2. Persistence vs. Relevance: The Distinction

  This procedure relies on a strict separation between two logical problems. Confusing them generates false confidence.

  **A. Default Persistence (The Narrow Problem)**
  *   **Definition:** The engineering task of ensuring that facts known to be true remain true unless an explicit action changes them.
  *   **Engineering Solution:** This is solvable. It requires discipline in writing effect axioms. If an action moves a box, the schema must explicitly state the box's old location becomes empty and the new location becomes occupied. If we fail to write the "old location becomes empty" effect, that is a **Persistence Defect**.
  *   **Procedure Mapping:** Questions 1 and 2 address this.
  *   **Limit:** Solving this does not make the robot safe; it only makes the robot consistent with its own model.

  **B. Relevance Closure (The Wide Problem)**
  *   **Definition:** The epistemic task of knowing *which* facts in the infinite universe might change or matter to the task.
  *   **Engineering Solution:** There is no solution. You cannot list every fact in the universe. This is managed by **Boundary Definition** and **Risk Acceptance**. If a robot narrows an escape route, but "escape route width" is not a fluent in the system, the planner cannot see the violation. This is not a coding error; it is a modelling omission.
  *   **Procedure Mapping:** Questions 3 and 4 address this.
  *   **Limit:** A "Pass" here does not mean the risk is zero. It means the risk has been identified and consciously handed to a human for judgment (Safety Lead/Risk Committee).

  **Warning:** The procedure must not market Question 2 (Persistence) as a cure for Question 4 (Relevance). We can guarantee the code does what we wrote (Persistence); we cannot guarantee we wrote everything that matters (Relevance).

  ---

  ## 3. Routing Rule and Taxonomy Critique

  **The Routing Rule (2-Minute Triage)**
  When a defect is found, ask: *"Was the fact represented in the model?"*
  1.  **Yes, but the code didn't update it:** This is a **Persistence Defect**. (Fix: Edit the schema).
  2.  **Yes, but the code didn't check it before acting:** This is a **Precondition Defect**. (Fix: Add precondition).
  3.  **No, the fact was not in the model at all:** This is a **Boundary Defect**. (Fix: Expand model or accept risk via Safety Lead).

  **Critique of Current Taxonomy**
  Your current classes (*silent-delta, ghost-precondition, stale-world*) describe symptoms, not root causes. They are the wrong shape for prevention because they encourage fixing the log entry rather than the logical gap.
  *   *Silent-delta* mixes Persistence Defects (forgot to write effect) with Boundary Defects (effect existed outside model).
  *   *Stale-world* is a sensing latency issue, not a schema logic issue.
  *   *Ghost-precondition* is accurate but often misapplied to Boundary Defects.

  **Recommendation**
  Do not rename the bug classes in your tracker yet; the migration cost (one quarter) is too high for a process change. Instead, **add a mandatory "Root Cause Tag"** to your new Review Record (Section 4) that maps to the three categories above (Persistence, Precondition, Boundary).
  *   **Action:** Keep the legacy bug classes for the audit trail. Use the new Tags for the weekly review statistics. After two quarters, migrate the tracker to the new tags based on the data showing which root cause is most prevalent.

  ---

  ## 4. The Review Record (One Page)

  **Schema ID:** ___________________ **Date:** ___________________
  **Reviewer:** ___________________ **Author:** ___________________

  | Section | Check | Evidence / Notes | Classification |
  | :--- | :--- | :--- | :--- |
  | **1. Fluent Inventory** | ☐ Pass ☐ Fail | List of read/write fluents attached. | **Objective** |
  | **2. Negative Effects** | ☐ Pass ☐ Fail | Frame axioms or closed-world justification cited. | **Objective** |
  | **3. Exogenous Window** | ☐ Pass ☐ Fail | Max delta: ____s. Invalidating events: __________. | **Estimate** |
  | **4. Interaction Boundary**| ☐ Pass ☐ Escalate | Unmodelled physical changes identified? (Y/N) | **Judgment** |
  | **5. Precondition Check** | ☐ Pass ☐ Fail | Safety preconditions verified in planner (not LLM). | **Objective** |

  **Decision:**
  ☐ **Ship** (All Pass)
  ☐ **Fix & Re-review** (Any Fail in Sec 1, 2, 5)
  ☐ **Escalate** (Fail/Escalate in Sec 3, 4)

  **Safety Lead Countersign (if Escalated):** ___________________
  **Risk Committee Ref (if applicable):** ___________________

  **Field Notes:**
  *   **Objective:** Facts verifiable by code inspection (Sec 1, 2, 5).
  *   **Estimate:** Time deltas and sensor rates (Sec 3).
  *   **Judgment:** Assessment of what "matters" in the environment (Sec 4). This is where procedural clothing covers value judgments; the Safety Lead must own this.

  ---

  ## 5. Case Study Runs

  ### Case (a): Open-Dock-Door (Warehouse)
  *Context:* Fixed layout, nightly survey, door sensor polled @ 0.5Hz.
  *   **Q1 (Inventory):** Pass. `door_state`, `robot_pose`.
  *   **Q2 (Negative):** Pass. Closed-world assumption valid for fixed warehouse.
  *   **Q3 (Window):** Pass. 2s poll rate < action duration. Risk of door closing during transit is mitigated by bumper sensors (separate system).
  *   **Q4 (Boundary):** Pass. No unmodelled physical changes (door is binary).
  *   **Q5 (Preconditions):** Pass. `door_open` checked immediately before move.
  *   **Decision:** **Ship**.
  *   **Record Note:** Low risk. Persistence guarantees hold.

  ### Case (b): Hospital Specimen Run (Corridor/Lift/Ward)
  *Context:* Human interaction, fire doors, dynamic obstacles. Commercial demo pending.
  *   **Q1 (Inventory):** Pass. `lift_pos`, `door_state`, `path_clear`.
  *   **Q2 (Negative):** Pass.
  *   **Q3 (Window):** **Fail/Escalate.** Human movement invalidates `path_clear` faster than planner replanning cycle.
  *   **Q4 (Boundary):** **Escalate.** Robot presence changes human behaviour (e.g., blocking a ward entrance, causing panic). "Human psychological comfort" is not a fluent.
  *   **Q5 (Preconditions):** **Fail.** LLM interprets "take to lab" but cannot guarantee fire door protocols are respected in real-time.
  *   **Decision:** **Do Not Ship.**
  *   **Required for Pass:**
      1.  Move `path_clear` checking to a high-frequency reactive layer (not planner).
      2.  Add a "Human Proximity" fluent with hard constraints near wards.
      3.  Safety Lead must sign off on the risk of human behavioural change.
  *   **Audit Note:** Commercial pressure is irrelevant to safety sign-off. The record shows "Escalate" on Q4. This cannot be waved through.

  ### Case (c): Relocate-Pallet (Escape Route)
  *Context:* Pallet moved to overflow bay. New position narrows escape route. Schema effects are locally correct.
  *   **Q1 (Inventory):** Pass. `pallet_loc`, `bay_occupancy`.
  *   **Q2 (Negative):** Pass.
  *   **Q3 (Window):** Pass.
  *   **Q4 (Boundary):** **Escalate.** "Escape route width" is not a fluent in the schema. The action is locally valid but globally illegal.
  *   **Q5 (Preconditions):** Pass.
  *   **Decision:** **Escalate.**
  *   **Analysis:** This is a **Boundary Defect**. The procedure catches it at Q4. The current review process likely waves this through because Q1-Q3 pass. The new procedure forces the question: "Does this change anything else?"
  *   **Remediation:** Requires a global constraint monitor (e.g., "Min Corridor Width") that acts as a precondition for *any* placement action, not just the local schema.

  ---

  ## 6. Limitations and Risks

  **What the Procedure Cannot Do**
  It cannot solve the Relevance Problem (Section 2B). It cannot guarantee that the "Interaction Boundary" (Q4) is complete. It relies on the reviewer's imagination to identify unmodelled facts. If the reviewer cannot conceive of the escape route width issue, Q4 will be ticked "Pass" incorrectly.

  **False Confidence**
  The greatest risk is that a "Ship" decision on the record is treated as a safety guarantee. It is not. It is a guarantee that *known* risks were processed. It generates false confidence if the Safety Lead treats the form as a waiver rather than a prompt for inquiry.

  **The Skipped Step**
  Under schedule pressure, **Question 4 (Interaction Boundary)** will be skipped or answered perfunctorily ("No unmodelled changes"). It requires cognitive effort to imagine side effects, whereas Q1 and Q2 are mechanical code checks.

  **Mitigation**
  To make skipping visible: Require the **"Evidence / Notes"** field for Question 4 to contain at least one specific example of a considered-but-rejected side effect (e.g., "Considered noise impact; rejected as below threshold"). If the field reads "None" or "N/A", the Safety Lead must reject the record automatically. This forces the reviewer to prove they thought about the boundary, even if they concluded it was safe.
