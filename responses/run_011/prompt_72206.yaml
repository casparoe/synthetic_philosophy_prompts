  **To:** Multiverse Mutual Claims Dept
  **From:** Arthur P.
  **Re:** Policy #8823-Q (Quantum Endowment)

  I am writing to dispute the loss of my $1,000 stake. On March 14, I wagered on the decay of a Carbon-14 atom. The squared amplitude for decay was 0.05. The atom did not decay in this branch. You kept my money.

  This is incorrect. The universe split. In Branch A, the atom decayed. In Branch B, it did not. I exist in both. Therefore, in 50% of the branches, I won. In 50% of the branches, I lost. My net position across the multiverse is zero. You have no right to privilege Branch B simply because its amplitude is higher. Amplitude is just a coefficient, not a count of people. There is one Arthur in Branch A holding $2,000. There is one Arthur in Branch B holding $0. The average is $1,000. I should have my stake returned.

  You are treating my successors as if they have different legal statuses based on wavefunction thickness. I am just as real in Branch A as I am here. If I split into two people, and one wins the lottery, you cannot tell the other one he is poor just because the winner lives in a "fatter" world. I demand a refund of $1,000 to balance the ledger across my identities. I have the ticket. The atom decayed. I am here writing this. Another me is spending the money. Why am I the one being penalized?

