      My diagnosis suggests they *don't* have to sacrifice distinctness to keep the slave intuition. They only sacrifice distinctness if they accept the argument. Since the argument is flawed (Step 3), they can keep all three: Distinctness, Slave Intuition, and (a modified) Berlin Warning. I should highlight this.

