      *   Move 6: Mixed (Opt-out fails signaling, neutrality point holds).
      *   Move 7: Mostly Right (Factual, but defensive).

      *   Overall: Ines wins on mechanism, Dan wins on immediate liberty. Ines is more right on the *policy question* because the market failure (discrimination) outweighs the allocation inefficiency.
      *   Empirical Premise: Employer belief updating.
      *   Blind Spot: Long-term lifecycle risks (pension/divorce) vs. immediate leave allocation.

  8.  **Final Review against constraints:** No references. 2-3 sentences per move. Specific adjudication.

