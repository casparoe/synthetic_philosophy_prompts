  Your "sealed box" hypothesis is correct: the disagreement is not about empirical output or specific theorems, but about the normative conditions for assertion. You have identified that the conflict lies in what a proof *owes* the mathematician.

  To diagnose the impasse, we must look at your distinction between saying excluded middle is *false* versus *not proved*. An intuitionist never asserts $\neg(P \vee \neg P)$; that would be contradictory. They assert that there is no general construction that transforms any proposition $P$ into a proof of $P$ or a proof of $\neg P$. For the intuitionist, truth is identical to provability. To claim excluded middle is "true" without a proof is to posit a Platonic reality independent of verification. The classical logician accepts this ontology; the intuitionist rejects it as meaningless. Thus, the disagreement is not about whether infinite totalities "exist" (SUBSTANTIVE), but about whether truth can outstrip verification.

  This makes the dispute a matter of **STANDARDS-OF-PROOF**. Both camps use the word "exists," but they enforce different validation criteria. The classical standard allows existence via contradiction; the intuitionistic standard demands witness production. They agree on the box's output, but disagree on whether knowing the output counts as knowing the solution. It is not merely VERBAL, because the differing standards dictate distinct mathematical practices (e.g., rejecting the full Intermediate Value Theorem). It is not DIFFERENT-QUESTIONS, because they are addressing the same propositions, merely applying different acceptance criteria.

  What counts as progress? Not declaring a winner. Progress lies in formalizing the relationship between the frameworks, exactly as you noted with negative translations. Topos theory generalizes both, showing classical and intuitionistic logic as internal languages of different categories. This dissolves the fight by showing each logic is "valid" relative to its structural context. The question shifts from "Which logic is correct?" to "Which logic fits the intended model of computation or physical reality?"

  In your physics terms: Classical logic is the continuum limit; intuitionistic logic is the lattice. Arguing which is "true" is a category error; asking which is appropriate for the domain is progress.

  \answer{STANDARDS-OF-PROOF}
