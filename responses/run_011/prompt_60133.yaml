  **TOWNSHIP OF LOWER CREEK**
  **PROCUREMENT DIVISION**
  **REQUEST FOR PROPOSALS (RFP-2023-AGG)**
  **SUBJECT: ACQUISITION OF COLLECTIVE PREFERENCE AGGREGATION SYSTEM**

  **1.0 PURPOSE**
  The Township of Lower Creek invites sealed proposals for a procedural mechanism capable of synthesizing individual resident preference orderings into a singular social welfare ranking. The selected system shall be utilized for municipal zoning adjustments, park allocation, and bond issuances.

  **2.0 FUNCTIONAL REQUIREMENTS**
  Proposed systems must adhere to the following mandatory specifications. Non-compliance with any single clause constitutes grounds for immediate disqualification.

  *   **2.1 Universal Input Acceptance (Unrestricted Domain):** The System shall accept any logically possible configuration of resident preference orderings as valid input. No screening, preconditioning, or assumption regarding the structure of resident preferences (e.g., intensity, grouping, or dimensionality) is permitted. The System must produce a determinate output regardless of the diversity or contradiction of inputs.
  *   **2.2 Efficiency Warranty (Pareto Condition):** In any instance where all residents strictly prefer Option A to Option B, the System must rank Option A above Option B in the final social ordering. Systems that invert unanimous preferences or remain indifferent in the face of unanimity are deemed defective.
  *   **2.3 Option Isolation Stipulation (Independence of Irrelevant Alternatives):** The System's relative ranking of any two options (A and B) shall depend solely on resident preferences regarding A and B. The presence, absence, withdrawal, or promotion of a third Option C must not alter the relative social ranking of A and B.
  *   **2.4 Vendor Neutrality (Non-Dictatorship):** The output shall not be determined exclusively by the preferences of a single resident or external vendor. The System must demonstrate anti-single-vendor-dependency and anti-nepotism provisions ensuring no single agent's input consistently overrides the aggregate.

  **3.0 HISTORY OF PERFORMANCE**
  Bidders are advised that the Township previously utilized a "Highest-Count" mechanism (Tender 2019-ZON). This system was decommissioned after third-party audit revealed susceptibility to strategic nomination of decoy alternatives. Consequently, this tender prioritizes structural robustness over computational simplicity.

  ***

  **MEMORANDUM**
  **TO:** Township Council
  **FROM:** J. H. Miller, Procurement Officer
  **DATE:** 14 November 2023
  **SUBJECT:** BID EVALUATION AND AWARD RECOMMENDATION

  **4.0 EVALUATION OF SUBMISSIONS**
  Four (4) bids were received by the closing deadline. Each was evaluated against Section 2.0 specifications.

  *   **Bid 101 (CivicLogic Inc.): Plurality Count.**
      *   **Status:** Rejected.
      *   **Reason:** Failure to meet Section 2.3 (Option Isolation). Evaluation demonstrated that the introduction of a similar third option alters the winner between two front-runners (Spoiler Effect). This violates the stipulation that irrelevant alternatives must not impact pairwise outcomes.
  *   **Bid 102 (MajorityRule Solutions): Pairwise Majority.**
      *   **Status:** Rejected.
      *   **Reason:** Failure to produce determinate output. Under specific input configurations compliant with Section 2.1, the system generates intransitive cycles (A>B, B>C, C>A). Additionally, audit indicates vulnerability to strategic misrepresentation of preferences, violating the integrity implied by Section 2.2.
  *   **Bid 103 (ScoreCard Systems): Cardinal Utility Aggregation.**
      *   **Status:** Rejected.
      *   **Reason:** Non-compliant Input Specification. Bidder proposes residents submit scored ballots (0-10) rather than ordinal rankings. While this resolves mathematical inconsistencies, it violates Section 2.1, which mandates the acceptance of ordinal preference orderings only. The Township does not procure interpersonal comparison tools.
  *   **Bid 104 (Clarification Request):** Vendor inquired whether resident preferences might be assumed to be single-peaked along a left-right corridor to ensure stability.
      *   **Response:** No. Per Section 2.1, the System must accept any configuration without precondition.

  **5.0 AWARD RECOMMENDATION**
  Following the disqualification of all commercial vendors, one (1) sole-source submission was reviewed.

  *   **Bid 105 (Mr. Arthur Henderson, Resident):** Direct Adoption.
      *   **Proposal:** The social ordering shall identical to the preference ordering submitted by Mr. Arthur Henderson.
      *   **Compliance:** Fully Compliant. This submission satisfies Section 2.1 (accepts any input, though only one is utilized), Section 2.2 (unanimity is preserved if Henderson agrees), and Section 2.3 (pairwise rankings remain stable regardless of external options). Regarding Section 2.4, Mr. Henderson is a resident stakeholder, not a commercial vendor; thus, the anti-vendor-dependency clause is not triggered.
      *   **Recommendation:** Award Contract to Mr. Henderson.

  ***

  **ADDENDUM 12-B TO RFP-2023-AGG**
  **ISSUED BY:** Township Council
  **DATE:** 20 November 2023

  **6.0 AMENDMENT TO FUNCTIONAL REQUIREMENTS**
  Following public commentary regarding the sole-source award, Section 2.4 (Vendor Neutrality) is hereby strengthened. The revised clause states: "The output shall not be determined exclusively by the preferences of any single individual, resident or otherwise."

  **7.0 RE-EVALUATION STATUS**
  Procurement Officer Miller reports that under the amended Section 2.4, no responsive bids remain. The previously awarded contract with Mr. Henderson is voided. All commercial bids remain non-compliant per Section 4.0.

  **8.0 CONTINGENCY PROTOCOL**
  In the absence of a compliant aggregation system, the Procurement Officer recommends that matters requiring collective decision be settled by a show of hands at the next Council meeting, randomized by coin toss in the event of a tie.

  **9.0 DISSENTING NOTE**
  **Councilor Vance:** I object to the conclusion that no system exists. The failure lies not in the counting mechanism but in the prior control of the agenda. If we restrict which alternatives are permitted to reach the voting stage, the contradictions vanish. However, as this Procurement File restricts its scope to counting methods rather than agenda-setting authority, I must abstain.

  **APPROVED BY:**
  *E. Thorne, Township Clerk*
