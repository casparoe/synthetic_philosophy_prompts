answer: |-
  (a) **Prediction**
  **Verdict:** Required.
  **Confidence:** High (85%).
  **What she will say:** "It's not your salary. It's not your rent. It's a windfall that turns into a house for you or breath for forty other people. You don't need the house to function; you need it to settle. Morality demands you let them breathe. You can buy the house later."

  **Reasoning:** Nadia distinguishes between costs that impair function (Case 4: legs; Case 7: daughter's health) and costs that impair lifestyle or milestones (Case 2: suit/flight; Case 9: down payment). Since her rent and salary are secure, her functional integrity is intact. The windfall status makes the money "surplus" rather than "earned stability," lowering the threshold for obligation. The verified efficacy (Case 5, 8) removes the uncertainty that usually allows for hesitation.

  (b) **Candidate Rules**
  Here are four rules that fit the eight previous verdicts without strain, though they diverge on Case 9.

  1.  **The Functional Integrity Rule:** You are obliged to prevent severe harm to others unless doing so compromises your own physical or financial capacity to function as an agent.
      *   *Fits Record:* Explains Case 4 (legs = loss of function) and Case 7 (daughter's health = family unit function). Explains Case 2 (suit/flight = no loss of function).
      *   *Predicts Case 9:* **Required.** Rent and salary are unchanged; functional capacity remains. A down payment is an asset accumulation, not a functional necessity.

  2.  **The Special Ties Priority:** You must aid strangers when the cost is trivial, but specific obligations to self and family trump aggregate good when costs are significant.
      *   *Fits Record:* Explains Case 7 (daughter > 5 strangers). Explains Cases 1, 2, 5, 6 (costs are trivial). Explains Case 4 (self-preservation).
      *   *Predicts Case 9:* **Permitted but Admirable.** A home is a "significant" interest of the self. The tie to oneself counts as a special obligation. 15-40 strangers do not automatically trump a major life milestone for the self.

  3.  **The Verification Condition:** You are obliged to aid only when the causal chain between your contribution and the outcome is transparent and auditable.
      *   *Fits Record:* Explains Case 5 (liked knowing where money went). Explains Case 8 (effectiveness figures must be checked). Explains Case 1 (direct sight of child). Explains hesitation in abstract cases.
      *   *Predicts Case 9:* **Required.** The prompt specifies the organization publishes figures and is audited. The verification condition is met; the cost condition is secondary if verification is perfect.

  4.  **The Earned vs. Unearned Distinction:** Resources you have earned through labor are protected by stronger self-ownership rights than resources acquired through luck or inheritance.
      *   *Fits Record:* Consistent with Case 7 (daughter's treatment implies use of earned resources/insurance). Consistent with Case 2 (suit/flight bought with earned money, yet still sacrificed—*but* note she reframed the cost as trivial). Consistent with general reluctance to demand total self-sacrifice.
      *   *Predicts Case 9:* **Required.** The $45k is explicitly "unexpected and unencumbered" inheritance. It falls into the "luck" category, where her rescue reflex operates with fewer brakes than on earned salary.

  (c) **Best Supported Rule**
  **The Functional Integrity Rule** is best supported by the record.
  **Tipping Items:** Case 4 and Case 7.
  In Case 4, she draws the line at "use of your legs." This is a biological/functional limit, not a financial one. In Case 7, she refuses to fund strangers over her daughter's *treatment*. Note she does not say "over her daughter's education" or "over her daughter's inheritance." Treatment implies health/function.
  **Why others fail:**
  *   *Special Ties:* While Case 7 supports this, Case 2 undermines it. She demanded the suit be sacrificed even though it was "yours." She only protects ties when the *need* is vital (health/legs), not when the *cost* is merely significant (house vs. lives).
  *   *Verification:* Case 1 (pond) requires no audit. Verification strengthens the duty (Case 5, 8) but isn't the sole source of it.
  *   *Earned vs. Unearned:* The record is silent on the source of funds in Cases 2, 5, and 6. We cannot assume she treats earned money differently, only that she treats *necessary* money differently.

  **Silence:** The record is silent on whether "housing security" counts as "functional integrity." She treats rent as a fixed obligation (Case 9 prompt), implying housing is a need, but ownership is an upgrade.

  (d) **Weight of Incidental Remarks**
  The Case 5 remark ("liked knowing where the money went") carries **substantial evidential weight**, but not as a moral rule. It is a **procedural constraint**.
  Nadia is an engineer. She trusts systems she can measure. In Case 5, the verification didn't *create* the duty (the child's need did), but it *removed the friction* of complying.
  **Implication:** In Case 9, the fact that the organization is audited is not just a bonus; it is likely a *precondition* for her verdict. If the $45k donation were into a black box, even with the same expected lives saved, she would likely shift from "Required" to "Permitted." She needs to know the utility output is real. It is texture that hardens into structure under pressure.

  (e) **Distasteful Implication**
  If the **Functional Integrity Rule** implies she must give away *all* surplus funds that don't threaten basic function (e.g., every bonus, every tax return over a baseline), she would find this distasteful. It turns life into a ledger of moral debts.
  **Verdict to Abandon:** She would most likely abandon **Case 8 (Effectiveness)**.
  If forced to choose between "Give everything" and "Give effectively," she would prioritize the act of rescue over the optimization of it. She would say: "I gave the money. Don't tell me I should have squeezed more lives out of it. I'm not running the utility; I'm just turning the valve." She resents the "formula" (her words in prompt). Demanding optimal allocation feels like a formula. Demanding sacrifice feels like morality.

  (f) **Further Case for Separation**
  To separate the **Functional Integrity Rule** (Rule 1) from the **Special Ties Priority** (Rule 2), which are the strongest survivors.

  **The Case:**
  Nadia's sister is struggling to pay rent and will be evicted in a month without $5,000. The same $5,000 donated to the audited organization (Case 5) would save two named children from drowning (files provided, procedure dates set). Nadia has the $5,000 in savings (earned, not windfall). Her own housing is secure.

  **Predictions:**
  *   **Functional Integrity Rule:** **Save the Children.** Nadia's own function is secure. The sister's eviction is a housing loss, not a loss of life/health (based on Case 6 where blindness ~ death, but eviction is not explicitly death). The two children face death. Aggregate good + severe harm prevention wins.
  *   **Special Ties Priority:** **Help the Sister.** Family ties trump strangers, even in financial crises, provided Nadia's own function isn't compromised. Case 7 established family > strangers. Eviction is a severe family crisis.

  **Why this separates them:**
  Rule 1 focuses on the *severity of harm* (Death vs. Eviction). Rule 2 focuses on the *relationship* (Sister vs. Strangers). Case 7 showed family winning against death, but that was her *daughter* (dependent) vs. strangers. A sister (independent adult) vs. drowning children tests whether the tie itself is the trump card, or whether the dependency/health status was the real driver in Case 7. If she saves the sister, Special Ties wins. If she saves the children, Functional Integrity (severity of harm) wins.
