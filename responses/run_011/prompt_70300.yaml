      *Reasoning:* "Understanding" is factive (mostly). You cannot understand something false. You can be influenced by it, but you don't have understanding. Therefore, Nominee 1 is ineligible by definition of the deed. Nominee 2 is eligible. The lack of readers is a practical problem, not a philosophical disqualifier.
