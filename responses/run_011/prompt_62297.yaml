prompt: |-
  Right, could you do me a favour and help me with some Darwin? I'm doing an MA in philosophy of biology and I've been set a piece on the species problem, and I keep going round in circles on one passage — it's from the Origin, 6th edition (1872), in the chapter on Mutual Affinities of Organic Beings, right at the start of the Classification section. Please put on your philosopher-of-biology hat (someone who's actually argued about realism and anti-realism re species, not someone summarising a textbook), and think properly rather than rushing to a verdict.

  The passage, slightly abridged — the "…" is where I've cut, so don't treat it as one continuous run of sentences:

  > From the most remote period in the history of the world organic beings have been found to resemble each other in descending degrees, so that they can be classed in groups under groups. This classification is not arbitrary like the grouping of the stars in constellations. The existence of groups would have been of simple significance, if one group had been exclusively fitted to inhabit the land, and another the water; one to feed on flesh, another on vegetable matter, and so on; but the case is widely different, for it is notorious how commonly members of even the same subgroup have different habits. … No doubt organic beings, like all other objects, can be classed in many ways, either artificially by single characters, or more naturally by a number of characters. We know, for instance, that minerals and the elemental substances can be thus arranged. In this case there is of course no relation to genealogical succession, and no cause can at present be assigned for their falling into groups. But with organic beings the case is different, and the view above given accords with their natural arrangement in group under group; and no other explanation has ever been attempted.

  Three things I can't get straight:

  1. What is the constellation contrast actually buying him? He seems to want to say the nesting of groups isn't up to us — but is that a claim about the resemblance relations being mind-independent, or about the groupings themselves being real kinds? He also gestures, a bit later in the same section, at the old line that the characters don't make the genus but the genus gives the characters, and calls it a hint that "some deeper bond" is involved. Does that deeper bond amount to anything more than geneology once you've cashed it out?

  2. "Either artificially by single characters, or more naturally by a number of characters." Is natural here a methodological remark about our descriptive economy (more characters = better index), or is it already a metaphysical claim about the world's own joints? Because on the first reading a natural system is just a convenient one, which sits very oddly with the constellation denial two paragraphs earlier. Does he slide between the two, and if so, does the slide matter for how realist he turns out to be about species?

  3. The minerals clause. He says of minerals and the elements that there's no genealogical relation and that no cause can at present be assigned for their falling into groups. So is the argument: unexplained grouping = grouping with nothing behind it = conventional grouping? If so, that's a weird inference, and it looks even weirder now — suppose the periodic table is exactly the sort of cause he says is missing, with underlying atomic structure explaining why the elemental kinds cluster the way they do. Does that force him to treat elemental kinds as no less real than taxa, or does his argument survive because the explanation there isn't genealogical? Please say which horn you'd grab.

  Structure-wise: start with a bit of brainstorming — set out two or three rival readings of what "natural" does for him and what each would imply about the reality of species — and only then argue for the one you think the passage supports. After that, give me a sentence-by-sentence gloss in plain English, flagging anywhere the syntax or a hedge like "at present" is doing sneaky work. British English, and don't pad it out with a reading list — I want the argument, not the bibliography.
