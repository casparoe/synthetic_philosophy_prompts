answer: |-
  # Joint Statement on Decision Theory and the Highest-Unique-Integer Game

  **Date:** October 26, 2023
  **Participants:** 
  *   **A:** Proponent of Causal Decision Theory (CDT)
  *   **B:** Proponent of Superrationality (SR)

  **Context:** Following an eleven-hour dialectical exchange, we submit this adversarial collaboration document regarding the normative and descriptive implications of decision theory in a specific game scenario: One hundred entrants on a departmental mailing list privately submit a non-negative integer. The entrant submitting the strictly greatest number wins $1,000. If two or more entrants tie at the top value (including a tie at zero), nobody wins. Entrants are ordinary students and staff; communication is prohibited; entries are simultaneous.

  ## I. Agreed Claims

  We both affirm the following propositions as accurate descriptions of the game mechanics and the logical constraints of our respective positions:

  1.  **Causal Isolation:** A single entry cannot causally influence the entries submitted by the other ninety-nine participants. The physical submission of a number by one agent does not alter the mental states or physical actions of the others prior to the deadline.
  2.  **Conditions for Symmetry:** The superrationalist appeal to symmetry requires that (a) the players are sufficiently similar in reasoning capacity and information, and (b) the problem is presented identically to all, such that identical reasoning processes would yield identical outputs.
  3.  **Payoff Degeneracy:** If all one hundred entrants submit the same number $N$ (where $N \geq 0$), the result is a tie at the top. Consequently, the payoff for every entrant is $0, regardless of the value of $N$.
  4.  **Description of Degeneracy:** We agree to describe the situation where identical play yields identical null payoffs as a **Symmetric Deadlock**. We disagree on whether a decision theory should prescribe a specific move within a Symmetric Deadlock, but we agree that the payoff structure renders all symmetric pure strategies materially equivalent in outcome.

  ## II. Surviving Disagreements

  The following table outlines the core divergences that remain unresolved. Each row presents the issue first in the terminology preferred by the Superrationalist (B), followed by the terminology preferred by the Causal Decision Theorist (A).

  | Issue | Superrationalist Formulation (B) | Causal Decision Theorist Formulation (A) |
  | :--- | :--- | :--- |
  | **The Link Between Agents** | **Logical Correlation:** My decision is evidence of the decision of other rational agents because we share a common rational structure. I should act as if my choice sets the parameter for the group. | **Causal Independence:** My decision is a local event. Other agents' decisions are fixed by their own prior causes. I should maximize expected utility conditional on my act, not conditional on the logical output of a shared algorithm. |
  | **Prescription in Deadlock** | **Focal Nullification:** Since all symmetric strategies yield $0, the superrational entry is **zero**. Zero is the unique focal point representing the "null strategy" or the acknowledgment of the symmetric failure mode. | **Theoretical Silence:** Superrationality is silent here. If symmetry implies a tie for *any* number $N$, the theory provides no gradient to prefer 0 over 1,000,000. Any specific recommendation requires breaking symmetry, which is outside SR's scope. |
  | **Normative Authority** | **Idealized Rationality:** The prescription holds for rational agents regardless of the empirical likelihood that others are rational. It defines what *ought* to be done in a community of reasoners. | **Empirical Sensitivity:** The optimal move depends entirely on the actual distribution of entries. Against a naive population, the "rational" move is to exploit their clustering, not to coordinate with a phantom rationality. |

  ## III. Cruxes and Predictions

  We identify three specific cruxes where our disagreement is substantive. For each, we specify the argument or evidence that would bear on the resolution and record our pre-commitment predictions regarding a trial run of the contest tomorrow.

  ### Crux 1: The Nature of the Symmetry Premise
  *   **The Dispute:** Is the assumption that "others will reason as I do" an **empirical claim** about a common causal source of reasoning (e.g., identical brain structure/education), or is it an **evidential claim** about what my deliberation reveals about the logical space of solutions?
  *   **B's Position (SR):** It is an evidential/normative claim. Even if empirically distinct, rational agents converge on the same truth. My deliberation *is* the group's deliberation.
  *   **A's Position (CDT):** It is an empirical claim. Since the participants are ordinary staff/staff (mostly naive to decision theory), the empirical premise is false. If treated as evidential, SR collapses into Evidential Decision Theory (EDT) without causal justification.
  *   **Bearing on Resolution:** We agree that if the contest were run with 100 *professional game theorists*, B's empirical confidence would rise, while A's advice would shift to exploit the theorists' clustering.
  *   **Prediction (Trial Run Tomorrow):**
      *   **B predicts:** A cluster at 0 and 1 (approx. 40% of entries), with a rapid falloff. The mean will be low (<5).
      *   **A predicts:** A cluster at 1, 2, and 3 (approx. 60% of entries), with a long tail of outliers trying to be "unique high." The winning number will likely be between 7 and 15.

  ### Crux 2: The "Zero" Recommendation vs. Silence
  *   **The Dispute:** Does Superrationality uniquely identify 0 as the solution, or does it fail to distinguish between any symmetric $N$?
  *   **B's Position (SR):** In a Symmetric Deadlock where all payoffs are 0, 0 is the Schelling point for "no gain." It minimizes the 'magnitude' of the failed attempt.
  *   **A's Position (CDT):** This is an arbitrary tie-breaker imported from outside the theory. SR proves all $N$ are equally bad under symmetry; therefore, SR offers no guidance. The choice of 0 is a psychological preference, not a logical derivation.
  *   **Bearing on Resolution:** If B can demonstrate a formal property of the number 0 in this game structure (other than it being the lower bound) that distinguishes it from 1 under symmetric conditions, A will concede the point. If not, B must concede the recommendation is extra-theoretical.
  *   **Prediction:** In the trial run, fewer than 5% of entrants will submit 0. (Both agree on this prediction, differing only on whether those who *should* submit 0 are failing to be rational).

  ### Crux 3: Responsibility for Symmetry Breaking
  *   **The Dispute:** Who owns the burden of breaking the symmetry to win?
  *   **B's Position (SR):** The symmetry is broken by the recognition that the game is futile under perfect correlation. The move to 0 is the rational response to futility.
  *   **A's Position (CDT):** The symmetry is broken by the *actual* heterogeneity of the population (naivety, randomness). The reasoning that exploits this heterogeneity is mine (CDT), not yours. Your view assumes symmetry holds; mine assumes it breaks. Since it *will* break empirically, my view generates the winning strategy.
  *   **Bearing on Resolution:** If the winning number in the trial run is 0, B gains significant credibility. If the winning number is >10, A's claim that "reasoning that breaks symmetry is mine" is vindicated.

  ## IV. Falsification and Verbal Disputes

  ### Evidence Against Positions
  *   **For B (Superrationalist):** I would consider my position weakened if, in a population of committed superrationalists, we failed to coordinate on a single number (including 0) and instead scattered randomly, resulting in consistent losses. If "shared rationality" does not produce convergence even among experts, the logical link is broken.
  *   **For A (Causal Decision Theorist):** I would consider my position weakened if I observed a consistent correlation between my deliberation and the choices of others *in the absence of any causal channel or common prior training*, such that acting "as if" I controlled them consistently yielded higher payouts than acting on causal independence.

  ### Note on Verbal Dispute
  We judge the disagreement regarding the definition of **"Rationality"** to be partially verbal. 
  *   **B** uses "Rational" to mean *idealized convergence with other reasoners* (Superrational). 
  *   **A** uses "Rational" to mean *maximization of expected utility given causal constraints* (Causal). 
  When B says "The rational move is 0," he means "The move an idealized reasoner would make in a symmetric vacuum." When A says "The rational move is 12," he means "The move that maximizes payoff given the actual distribution of naive entrants." We acknowledge that if we standardize the definition of rationality to "maximizing expected payoff in *this specific* context with *these specific* opponents," we likely converge on A's numerical recommendation, even if B maintains the *principle* of SR remains valid for idealized contexts.

  **Signed,**

  _________________________ (A) 
  _________________________ (B)
