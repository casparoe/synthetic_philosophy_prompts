answer: |-
  ## Part 1: The EVO-TRIAGE Protocol

  **Purpose:** To filter vendor claims relying on evolutionary explanations within 45 minutes, without specialist knowledge.
  **User:** Procurement/L&D Manager.
  **Output:** One-page Scorecard + Recommendation Paragraph.

  ### Section A: The Claim Map (5 Minutes)
  *Read the executive summary and "Science Behind It" section of the deck.*

  1.  **Identify the Behavior:** What specific human behavior is the module trying to change? (e.g., "Accepting feedback," "Fear of public speaking").
  2.  **Identify the Evolutionary Story:** What is the vendor's explanation for *why* this behavior exists? (e.g., "Selected for group cohesion," "Byproduct of threat detection").
  3.  **Identify the Intervention:** What does the vendor say we should *do* based on this story? (e.g., "Remove managers," "Rank employees").

  ### Section B: The Five Critical Distinctions (25 Minutes)
  *For each distinction below, mark **PASS**, **FAIL**, or **FLAG**. Use the "Sufficient" and "Refusal" guides to decide.*

  #### 1. Adaptation vs. Exaptation vs. Spandrel
  *Does the vendor claim the trait was selected for its current function (Adaptation), repurposed from an old function (Exaptation), or is a useless byproduct (Spandrel)?*
  *   **Question to ask:** "Is this behavior a direct target of selection, or a side effect of something else?"
  *   **Sufficient Answer:** Vendor specifies the *original* selective pressure and acknowledges uncertainty about current function. (e.g., "This mechanism evolved for X, but now manifests as Y.")
  *   **Refusal Answer:** Vendor asserts the current behavior is exactly what was selected for without ruling out alternatives. (e.g., "We evolved to do [modern workplace task].")
  *   **Verdict:** **FAIL** if they claim Adaptation without comparative evidence.

  #### 2. Consistency vs. Prediction
  *Is the story built to fit known data (post-hoc), or did it predict new data (a priori)?*
  *   **Question to ask:** "Was this evolutionary hypothesis stated before the data was collected?"
  *   **Sufficient Answer:** Citation of pre-registered studies or historical papers that predicted a finding later confirmed.
  *   **Refusal Answer:** "The data shows X, and our theory explains X." (This fits everything).
  *   **Verdict:** **FAIL** if all evidence is post-hoc fitting ("Just-So Story").

  #### 3. Heritability vs. Adaptivity
  *Does the vendor confuse "genetic" with "selected for"?*
  *   **Question to ask:** "Does the evidence show this trait is genetic, or that it was shaped by natural selection?"
  *   **Sufficient Answer:** Distinguishes between twin studies (heritability) and cross-species/universal patterns (adaptivity).
  *   **Refusal Answer:** Cites a heritability estimate (twin study) as proof of evolutionary function.
  *   **Verdict:** **FAIL** if they use heritability to prove adaptation.

  #### 4. The Naturalistic Fallacy (Is vs. Ought)
  *Does the vendor move from "this is natural" to "this is good/unchangeable"?*
  *   **Question to ask:** "Does the recommendation follow logically from the evidence, or does it assume we cannot change this?"
  *   **Sufficient Answer:** Acknowledges that "natural" tendencies can be overridden or managed (e.g., "We have a bias for X, so we build systems to check it.").
  *   **Refusal Answer:** "Because this is innate, we must structure the workplace to match it."
  *   **Verdict:** **FLAG** for Ethics Review if the recommendation assumes immutability.

  #### 5. The EEA Mismatch
  *Does the vendor assume the modern workplace matches the ancestral environment?*
  *   **Question to ask:** "Does the training account for the difference between ancestral contexts and modern logistics?"
  *   **Sufficient Answer:** Explicitly notes the mismatch and trains for the *modern* context using ancestral insights.
  *   **Refusal Answer:** Assumes ancestral behaviors are optimal for modern profit/efficiency.
  *   **Verdict:** **FAIL** if they claim ancestral behavior is optimal for modern KPIs.

  ### Section C: The Verdict (10 Minutes)
  *   **Science Score:** Count FAILs. (0-1 = Robust; 2-3 = Weak; 4-5 = Pseudoscience).
  *   **Ethics Flag:** If Section B.4 was FLAGGED, this requires Human Review.
  *   **Recommendation:** Write one paragraph (see templates below).

  ---

  ## Part 2: Design Notes & Bias Statement

  **Distinctions Deliberately Dropped:**
  1.  **Phylogenetic Reconstruction:** Determining exactly *when* a trait emerged on the hominid tree requires specialist knowledge. I dropped this to keep the tool usable. *Cost:* We may accept a claim that is chronologically impossible. *Mitigation:* The "Prediction" test (B.2) catches most of these, as impossible timelines rarely make novel predictions.
  2.  **Genetic Mechanism:** We do not check for specific alleles. *Cost:* We cannot verify biological plausibility. *Mitigation:* We focus on behavioral evidence (universals) which is visible in vendor decks.

  **The Thumb on the Scale:**
  This procedure has a **strong negative bias against evolutionary explanations**. It is designed to fail most vendor decks.
  *   **Why:** The field of evolutionary psychology in commercial training is saturated with "Just-So Stories" (post-hoc adaptations). A neutral tool would let too much pseudoscience through.
  *   **The Cost:** We may reject a module that is heuristically useful even if the evolutionary story is slightly overstated. We may miss a genuine insight because the vendor cannot articulate the selection pressure to our satisfaction.
  *   **Revision Criteria:** If a vendor provides a **meta-analysis of pre-registered studies** that specifically test the evolutionary hypothesis (not just the training outcome), you may override a "FAIL" on Distinction 2 (Prediction).

  ---

  ## Part 3: Running the Procedure

  ### Case 1: The "Egalitarian Teamwork" Module
  *Claim: Hierarchy is unnatural; we evolved for flat sharing.*
  *Evidence: Forager anecdotes, primate clip, engagement surveys.*

  **Section A: Claim Map**
  1.  **Behavior:** Collaboration / Authority acceptance.
  2.  **Story:** Ancestral bands were egalitarian; hierarchy is a recent distortion.
  3.  **Intervention:** Flatten management structures / reduce manager authority.

  **Section B: Distinctions**
  1.  **Adaptation vs. Spandrel:** **FAIL.** Vendor claims hierarchy is "unnatural" (implying egalitarianism is the Adaptation). Anthropological record is mixed (some foragers hierarchical, some not). Vendor treats one subtype as the universal human state.
  2.  **Consistency vs. Prediction:** **FAIL.** Anecdotes are selected to fit the conclusion. No prediction offered (e.g., "If we flatten, productivity will rise because...").
  3.  **Heritability vs. Adaptivity:** **PASS.** No genetic claims made, purely behavioral narrative.
  4.  **Is vs. Ought:** **FLAG.** Assumes because something *might* be ancestral, it is *better* for logistics. "Unnatural" is used as a pejorative.
  5.  **EEA Mismatch:** **FAIL.** Assumes a 4,000-person logistics firm can operate like a 50-person foraging band.

  **Section C: Verdict**
  *   **Science Score:** 3 FAILs (Weak/Pseudoscience).
  *   **Ethics Flag:** Yes.
  *   **Recommendation:** **REJECT.** The evolutionary claim is a "Just-So Story" that contradicts broad anthropological data on hierarchy in primates and humans. The evidence relies on post-hoc anecdote rather than prediction. While the goal of improved teamwork is valid, the scientific justification is indefensible and creates legal risk if we claim hierarchy is "unnatural" while maintaining any management structure.
  *   **Action:** Do not buy. Seek a teamwork module based on organizational psychology without evolutionary claims.

  ***

  ### Case 2: The "Fear-Preparedness" Module
  *Claim: Humans learn fears of snakes/spiders faster than cars/guns (Preparedness).*
  *Evidence: Conditioning studies, infant looking, primate data.*
  *User Concern: Managers might write off anxious employees.*

  **Section A: Claim Map**
  1.  **Behavior:** Fear acquisition / Anxiety retention.
  2.  **Story:** Evolved "preparedness" to associate specific stimuli with threat.
  3.  **Intervention:** Specialized support for specific phobias (implied: standard CBT may need adjustment).

  **Section B: Distinctions**
  1.  **Adaptation vs. Spandrel:** **PASS.** Vendor describes a specific learning mechanism (fear module) selected for threat avoidance, distinct from general learning. This aligns with Ohman/Mineka research.
  2.  **Consistency vs. Prediction:** **PASS.** Cites conditioning studies across countries that tested the specific differential learning rates (Snake vs. Car) predicted by the theory.
  3.  **Heritability vs. Adaptivity:** **PASS.** Uses cross-species and cross-cultural data to argue adaptivity, not just twin heritability.
  4.  **Is vs. Ought:** **FLAG.** **CRITICAL.** The science may hold, but the *application* risks determinism. If managers read "evolved" as "unfixable," harm occurs.
  5.  **EEA Mismatch:** **PASS.** Acknowledges modern fears (cars) are real but harder to learn, implying training can bridge the gap.

  **Section C: Verdict**
  *   **Science Score:** 0 FAILs (Robust).
  *   **Ethics Flag:** **YES.**
  *   **Recommendation:** **CONDITIONAL APPROVAL (Science Passed, Ethics Review Required).** The evolutionary evidence for "prepared learning" is methodologically sound and distinguishes adaptation from general learning. However, the module risks being interpreted as biological determinism regarding anxiety.
  *   **Action:** Pass to General Counsel and Head of HR. **Instruction to them:** "The science is valid, but the narrative could be used to discriminate against anxious employees. We need a contractual guarantee that the vendor will train managers that 'preparedness' is not 'permanent,' and that accommodation is still required. Do not approve the manager-facing materials without legal review of the determinism language."

  ***

  ### Case 3: The "Sales-Resilience" Module
  *Claim: Status-seeking is fixed/innate; use public leaderboards.*
  *Evidence: Bestselling book, one twin study.*
  *User Concern: None stated, but high risk.*

  **Section A: Claim Map**
  1.  **Behavior:** Sales motivation / Resilience.
  2.  **Story:** Status-seeking is a fixed, innate drive.
  3.  **Intervention:** Public ranking / Leaderboards.

  **Section B: Distinctions**
  1.  **Adaptation vs. Spandrel:** **FAIL.** Claims "fixed, innate drive" without distinguishing if this is an adaptation or a byproduct of general reward systems.
  2.  **Consistency vs. Prediction:** **FAIL.** Relies on a trade book (narrative) and one study. No novel predictions.
  3.  **Heritability vs. Adaptivity:** **FAIL.** **CRITICAL.** Cites a twin study (heritability) as proof of evolutionary function. This is a category error.
  4.  **Is vs. Ought:** **FAIL.** **CRITICAL.** Moves from "status seeking exists" to "we must rank publicly." Assumes immutability.
  5.  **EEA Mismatch:** **FAIL.** Assumes ancestral status games map cleanly to modern sales KPIs without negative side effects (sabotage, stress).

  **Section C: Verdict**
  *   **Science Score:** 4 FAILs (Pseudoscience).
  *   **Ethics Flag:** Yes.
  *   **Recommendation:** **REJECT.** The vendor commits two fatal methodological errors: conflating heritability with adaptation, and deriving a normative policy (leaderboards) from a descriptive claim (status seeking). The evidence is limited to a single twin study and a pop-science book. Implementing this based on "innate" claims exposes the firm to liability if the leaderboard creates a hostile work environment.
  *   **Action:** Do not buy. If leaderboards are desired, justify them on operational transparency, not evolutionary inevitability.

  ---

  ## Part 4: Limitations & Cheap Fixes

  **What This Procedure Cannot Do:**
  1.  **Audit Study Quality:** It cannot tell if a cited conditioning study had a small sample size, p-hacked results, or failed replication. It assumes the cited paper exists and says what the vendor claims.
  2.  **Detect File Drawer Problems:** It cannot know if the vendor cited the 3 favorable papers out of 30 conducted.
  3.  **Assess Effect Size:** It cannot tell if the evolutionary effect is real but trivial (e.g., "Yes, we fear snakes more, but the difference is 2% and irrelevant to training").

  **Where These Limits Bite:**
  *   **Case 2 Risk:** The fear module passed the logic check, but if the underlying conditioning studies are part of the "replication crisis," we are buying bad science that looks good.
  *   **Case 3 Risk:** The twin study might be statistically sound but context-specific, which the tool misses.

  **The Cheap Addition (The "Google Scholar" Step):**
  Add a **10-minute Step 0** to Section A:
  *   *Action:* Take the **lead author's name** and the **year** of the primary cited study from the deck.
  *   *Search:* Google Scholar.
  *   *Check:* Look at the "Cited By" count.
  *   *Rule:* If the paper is >10 years old and has <50 citations, or if the top 3 citing papers are critiques, **Automatic FAIL**.
  *   *Why:* This catches dead-end science and major controversies without requiring you to read the papers.

  **Claims to Stop Running Through This Tool:**
  1.  **Neuroscience Claims:** ("This activates the amygdala"). You cannot triage fMRI claims without a specialist. **Auto-Reject** any module grounding its primary value prop in brain imaging.
  2.  **Genetic Claims:** ("We test for the warrior gene"). **Auto-Reject**. Ethical and legal liability is too high for a 45-minute check.
  3.  **Universal Claims:** ("All humans do X"). If a vendor claims a behavior is universal without citing cross-cultural data, **Auto-Fail** Distinction 1.

  **Final Instruction:**
  If a vendor refuses to answer the five questions in Section B during the sales call, mark **All Distinctions as FAIL**. Transparency is the first filter of scientific validity.
