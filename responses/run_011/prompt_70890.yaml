prompt: |-
  For the past four years I have been the sole person at a mid-sized logistics firm who decides which outside training modules we buy and put in front of roughly four thousand employees, including every people manager. I have no scientific training of any kind — a business degree and a habit of reading widely on my own time — but the job has made me an amateur student of one problem in particular. Almost every vendor deck that crosses my desk now grounds itself in evolutionary psychology. A negotiation course explains its method by appeal to what our ancestors supposedly did in small bands. A resilience module claims a hard-wired status instinct. A teamwork product asserts that hierarchy is a recent and unnatural imposition on a species built for flat, egalitarian sharing. Sometimes I can feel that a claim is empty — that any outcome could be accommodated by the story the vendor tells — and sometimes I can feel that it is solid, but in neither case can I say why in terms that would survive a challenge from the vendor's salesperson, my own director, or a manager who liked the module.

  What I currently do is a private three-question gut check, and I know it is indefensible. I need something better.

  Here is what I am asking for: a written triage procedure I can run on a vendor's evidence package, in about forty-five minutes, during or immediately after a sales call, with no scientist available and no ability to commission new analysis. We see fifteen to twenty packages a quarter. Our general counsel and my director only look at the items I flag, so the procedure has to do the flagging. The output has to be a short filled-in form plus a one-paragraph recommendation, because that is what gets attached to the procurement memo, and it has to be simple enough that a colleague with less patience than mine could run it and reach the same verdict I would.

  Please build it so that it is grounded in what the methodological critics of this style of explanation have actually established, not in a general mood of skepticism. That means I want the procedure to carry the real distinctions: between a trait that was shaped by selection for its current role, one that was shaped for something else and now does this, one that is an incidental side effect of something else entirely, and one that is simply an inherited leftover with no story at all; between an account that is merely consistent with the data and one that would have been risky to state in advance; between evidence that a trait is heritable and evidence that it is adaptive; between a claim about why something exists and a claim about what an employer ought to do about it. For each distinction, tell me plainly what question to ask the vendor, what answer counts as sufficient, what answer counts as a refusal, and which distinctions you have deliberately dropped for the sake of usability — and whether dropping them bends the procedure systematically in one direction. If the finished procedure has a thumb on the scale against evolutionary explanations, I want that said out loud, together with what it would cost us and what evidence should make me revise the default.

  Then run it, in full and in writing, on three packages:

  First, a teamwork module built on the claim that humans evolved an intense aversion to ranked authority and that hierarchy is a recent, unnatural distortion, supported in the deck by selected anecdotes about foraging peoples, a clip from a primate documentary, and two employee engagement surveys from our own industry. I like this framing and I want to buy it.

  Second, a fear-management module claiming that people acquire and retain fears of snakes, spiders, and heights faster and more stubbornly than fears of cars, sockets, or guns, attributed to evolved preparedness, supported by conditioning studies run in several unrelated countries, attention and infant-looking studies, and comparative data from non-human primates. I find this one distasteful, because I am sure a manager will read it as permission to write off an anxious employee as unfixable.

  Third, a sales-resilience module claiming that status-seeking is a fixed, innate drive, supported by a bestselling trade book, one twin study reporting a heritability estimate, and a recommendation that we therefore rank all employees publicly on a live leaderboard.

  For each, show the form being filled in and give the verdict, including the two cases where the procedure should hand the remaining question to a person because what is left is about harm, fairness, or how the content will be used rather than about evidence — and say exactly what that person needs to be told.

  Finally, state what this procedure cannot do. I assume it cannot assess whether a cited study was well run, whether an effect is large enough to matter, or whether the vendor has quietly cited the three favourable papers out of thirty. Tell me where those limits bite, what cheap addition would cover the worst of them, and what kinds of claim I should stop trying to run through it altogether.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User Persona:** A procurement/training decision-maker at a mid-sized logistics firm (4,000 employees). No scientific training (business degree), but an avid reader. Sole decision-maker on training modules.
      *   **Problem:** Overwhelmed by vendor decks using evolutionary psychology (evo psych) claims. Current "gut check" is indefensible. Needs a robust, defensible triage procedure.
      *   **Constraints:**
          *   Time: ~45 minutes per package.
          *   Resources: No scientists, no new analysis.
          *   Volume: 15-20 packages/quarter.
          *   Output: Filled-in form + 1-paragraph recommendation (for procurement memo).
          *   Usability: Simple enough for a less patient colleague to replicate.
          *   Grounding: Must be based on *methodological critiques* of evo psych (not just general skepticism).
      *   **Specific Distinctions Required:**
          *   Adaptation vs. Exaptation (shaped for current role vs. shaped for something else).
          *   Side Effect vs. Leftover (incidental vs. inherited leftover).
          *   Consistency vs. Prediction (fits data vs. risky advance statement).
          *   Heritability vs. Adaptivity (is it genetic vs. was it selected for).
          *   Is vs. Ought (existence claim vs. normative recommendation).
      *   **Bias Check:** Must acknowledge if the procedure biases against evo psych, the cost of that bias, and revision criteria.
      *   **Task:**
          1.  Build the procedure (Form + Instructions).
          2.  Run the procedure on three specific cases (Teamwork/Hierarchy, Fear/Preparedness, Sales/Status).
          3.  State limitations and cheap fixes.

  2.  **Deconstruct the Scientific Distinctions (The "Meat"):**

      *   *Adaptation vs. Exaptation vs. Spandrel:* This is the core of Gould & Lewontin's critique. Vendors often claim "Adaptation" (selected for X) when it might be "Exaptation" (selected for Y, now does X) or "Spandrel" (byproduct).
      *   *Just-So Stories:* The claim must be falsifiable. If it explains everything, it explains nothing. The key test is *novel prediction* vs. *post-hoc fitting*.
      *   *Heritability $\neq$ Adaptation:* Just because something is genetic (twin study) doesn't mean natural selection designed it for that purpose.
      *   *Naturalistic Fallacy:* Just because it's "natural" doesn't mean it's "good" or "unchangeable."
      *   *EEA (Environment of Evolutionary Adaptedness):* Vendors often assume modern contexts match ancestral ones.

  3.  **Drafting the Procedure (The "Tool"):**

      *   Needs to be a checklist/form.
      *   Needs to be time-boxed (45 mins).
      *   Needs clear Pass/Fail/Flag criteria.
      *   *Section 1: The Claim.* Define the behavior and the evolutionary story.
      *   *Section 2: The Evidence Type.* Distinguish between anecdotes, cross-species, human universals, etc.
      *   *Section 3: The Logic Test.* (The distinctions requested).
      *   *Section 4: The Normative Leap.* (Is vs. Ought).
      *   *Bias Statement:* Acknowledge that this tool is designed to catch "Just-So Stories," so it will inherently flag weak evo psych harder than standard psych.

  4.  **Developing the Three Cases:**

      *   **Case 1: Teamwork/Hierarchy (Egalitarianism).**
          *   *Claim:* Hierarchy is unnatural; we evolved for flat structures.
          *   *Evidence:* Foraging anecdotes, primate clip, engagement surveys.
          *   *Analysis:* This is a classic "Noble Savage" narrative. Evidence is anecdotal (foragers vary wildly) and cross-species (chimps have hierarchy, bonobos differ). Engagement surveys are correlational, not evolutionary.
          *   *Verdict:* High risk of "Just-So Story." Fails the prediction test.
          *   *Nuance:* User *wants* to buy it. The tool must stop them if the science is weak, or flag the ethical choice separately.
      *   **Case 2: Fear/Preparedness (SNAKE vs. CAR).**
          *   *Claim:* Prepared learning (Seligman/Ohman).
          *   *Evidence:* Conditioning studies, infant looking, primate data.
          *   *Analysis:* This is actually one of the more robust areas of evo psych (Ohman & Mineka). It distinguishes adaptation (fear module) from general learning.
          *   *User Concern:* Ethical (writing off anxious employees).
          *   *Verdict:* Science holds up better than Case 1. The issue is *application*, not evidence. This triggers the "Hand to HR/Ethics" flag.
      *   **Case 3: Sales/Status (Leaderboards).**
          *   *Claim:* Status seeking is fixed/innate.
          *   *Evidence:* Trade book, one twin study.
          *   *Analysis:* Heritability (twin study) $\neq$ Adaptation. Trade book $\neq$ Peer review. Recommendation (leaderboard) assumes immutability (Is $\to$ Ought).
          *   *Verdict:* Fails on Heritability vs. Adaptation and Is vs. Ought. High risk.

  5.  **Refining the Distinctions for Usability:**

      *   *Dropped:* Detailed phylogenetic reconstruction (too hard for 45 mins). Specific genetic markers (too technical).
      *   *Bias:* The tool assumes skepticism of "Adaptation" claims without strong comparative or predictive evidence. This biases *against* buying evo psych modules.
      *   *Cost:* Might miss a genuinely useful heuristic.
      *   *Revision:* If a vendor provides a meta-analysis of pre-registered predictions.

  6.  **Writing the Response:**

      *   *Tone:* Professional, precise, empathetic to the user's position (no scientific training but needs rigor).
      *   *Structure:*
          1.  Introduction (Acknowledging the difficulty).
          2.  The Triage Procedure (The Form & Instructions).
          3.  Bias & Limitations Statement (Required by prompt).
          4.  The Three Case Studies (Running the tool).
          5.  Final Limitations & Cheap Fixes.

  7.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I include the specific distinctions requested? (Adaptation/Exaptation/Side Effect, Consistency/Prediction, Heritability/Adaptivity, Is/Ought).
      *   *Check:* Did I specify what counts as sufficient/refusal for each?
      *   *Check:* Did I address the "dropped distinctions" and the "thumb on the scale"?
      *   *Check:* Are the case study verdicts consistent with the tool?
      *   *Check:* Case 1: User likes it, but science is weak. Tool should flag it.
      *   *Check:* Case 2: Science is okay, ethics are bad. Tool should pass science, flag ethics.
      *   *Check:* Case 3: Science is weak, ethics are bad. Tool should flag both.
      *   *Refinement:* Ensure the "Hand to Human" instruction is clear for Cases 2 and 3 regarding the ethical application.
      *   *Refinement:* Make sure the "Bias" section is honest. This tool *will* reject most evo psych vendor decks because most vendor decks are bad science. That is a feature, not a bug, but needs to be stated.

  8.  **Final Polish:** Check word count and clarity. Ensure the "45-minute" constraint feels realistic for the steps provided. (Reading a deck + checking 5 questions is doable).

  *(Self-Correction on Case 1)*: The prompt says "I like this framing and I want to buy it." The tool needs to be robust enough to tell the user "Your gut is wrong, the evidence is weak." This demonstrates the tool's value.
  *(Self-Correction on Case 2)*: The prompt says "I find this one distasteful." The tool needs to separate the *science* (which is actually decent compared to typical evo psych) from the *policy* (which is harmful). This demonstrates the Is/Ought distinction.

  9.  **Finalizing the Output Structure:**
      *   **Part 1: The EVO-TRIAGE Protocol.** (The Form).
      *   **Part 2: The Bias & Design Statement.** (Addressing the "thumb on the scale").
      *   **Part 3: The Three Runs.** (Case studies).
      *   **Part 4: Limitations & Cheap Fixes.**

