answer: |-
  Here is the restatement of Parfit's Hitchhiker in contract theory and mechanism design vocabulary, followed by the residue report you asked for.

  ### Part 1: The Mechanism Design Restatement

  **The Environment**
  We have a dynamic game of incomplete information between a Principal (Driver) and an Agent (Hitchhiker).
  *   **Timeline:** $t=0$ (Stranded), $t=1$ (Screening/Transport), $t=2$ (Town/Payment).
  *   **Payoffs:** Agent receives $V$ (Life) at $t=1$ if transported. Agent pays $P$ at $t=2$. Driver incurs cost $C$ at $t=1$, receives $P$ at $t=2$. Assume $V > P$ and $P > C$.
  *   **Enforcement:** Null. No legal contracts, no reputational markets, no third-party enforcement. The $t=2$ transfer is strictly voluntary.

  **The Standard Implementation Failure (CDT/SPNE)**
  Under standard assumptions, the Agent's preferences are exogenous and fixed: $U_A = V - P \cdot \mathbb{I}_{\text{pay}}$.
  *   **$t=2$ Incentive Compatibility (IC):** Given transport occurred, $U_A(\text{Defect}) = V > U_A(\text{Pay}) = V - P$. The IC constraint for payment fails.
  *   **$t=1$ Individual Rationality (IR):** The Driver anticipates the $t=2$ defection. Expected payoff from Transport is $-C$. Payoff from Leave is $0$. Driver's IR constraint for Transport fails.
  *   **Outcome:** No trade. Agent gets $0$ (Death). Pareto inefficient.

  **The Information Structure (Ekman/Screening)**
  The Driver cannot observe the Agent's action at $t=2$ beforehand, but can observe a signal $\sigma$ at $t=1$ correlated with the Agent's *decision rule*.
  *   In standard screening models, $\sigma$ reveals the Agent's **Type** ($\theta \in \{\text{Payer}, \text{Defector}\}$).
  *   Crucially, in standard mechanism design, $\theta$ is drawn by Nature. In Parfit's case, $\theta$ is **endogenous**. The Agent can select their decision rule prior to $t=0$.

  **Parfit's Claim as "Endogenous Preference Design"**
  Parfit's argument that "it is rational to make yourself irrational" translates to:
  *   **The Choice Set:** The Agent's choice set at $t=-1$ includes not just actions, but the **objective function** itself.
  *   **The Commitment Device:** Modifying the utility function to $U'_A = V - P \cdot \mathbb{I}_{\text{pay}} + M \cdot \mathbb{I}_{\text{pay}}$, where $M > P$ is a psychic cost of breaking a promise (or intrinsic value of honesty).
  *   **Implementation:** By adopting $U'_A$, the Agent satisfies the $t=2$ IC constraint ($V - P + M > V$).
  *   **Screening:** The Driver's signal $\sigma$ detects the adoption of $U'_A$.
  *   **Ex-Ante Optimality:** Although adopting $U'_A$ is *ex-post* suboptimal at $t=2$ (you pay $P$ when you could have paid $0$ with the old function), it is *ex-ante* optimal at $t=-1$ because it unlocks the $t=1$ transport value $V$.

  **The "Rationality" Dispute**
  *   **Self-Interest Theory (CDT):** Rationality is defined as **ex-post maximization** given fixed preferences. Under this definition, adopting $U'_A$ is irrational because it restricts the feasible set at $t=2$ without external enforcement.
  *   **Parfit/TDT:** Rationality is defined as **ex-ante maximization** of the outcome vector. Under this definition, the "rational" agent is one who designs a preference structure that satisfies the dynamic IC constraints of the environment, even if it requires local sub-optimality later.

  ***

  ### Part 2: The Residue Report

  Here is the honest mapping of what fits, what stretches, and what breaks.

  #### 1. What Maps Cleanly
  *   **Dynamic Inconsistency:** The core problem is a textbook time-inconsistency problem (Kydland & Prescott). The optimal plan at $t=-1$ (Pay) is not the optimal action at $t=2$ (Defect).
  *   **Commitment Technology:** Parfit's "making yourself irrational" is literally a **commitment technology**. In contract theory, if you can commit, you solve the hold-up problem. Parfit argues the *mind* is the site of the commitment technology.
  *   **Screening/Signaling:** The Driver's ability to read microexpressions is a **screening mechanism**. The Agent's "trustworthiness" is the private information being screened.

  #### 2. What Requires Stretching
  *   **Type vs. Algorithm:** In standard mechanism design, a "Type" is a parameter of the utility function (e.g., risk aversion, valuation) assigned by Nature. In PH, the "Type" is the **decision algorithm** itself. Mapping "Type" to "Decision Function" stretches the definition of a game form. You are moving from a game of *incomplete information* to a game of *endogenous preference formation*.
  *   **The Principal's Power:** In standard contract theory, the Principal writes the mechanism. Here, the Driver (Principal) cannot write the contract; they can only *select* based on observed traits. This is closer to **matching markets** or **evolutionary game theory** than standard principal-agent design. The "mechanism" is the Driver's psychological heuristic, not a formal contract.

  #### 3. What Has No Expression (The Breakage)
  *   **The Normativity of Rationality:** Econ treats preferences as primitives. "Rationality" is consistency with those primitives. Parfit treats preferences as variables. "Rationality" is success in the world. Contract theory has no vocabulary for saying "You should have different preferences." It can only say "Given these preferences, this is the equilibrium." The claim "It is rational to change your preferences" is **category error** in standard econ. It requires a meta-theory of preference selection (e.g., Constitutional Economics) which is not part of the standard toolkit.
  *   **The "Reason" for Action:** In econ, if $U(\text{Pay}) < U(\text{Defect})$, you defect. If you pay, we infer $U(\text{Pay}) \ge U(\text{Defect})$ (Revealed Preference). Parfit insists you can pay *even if* you prefer the money, provided you previously committed to a rule. This violates **Revealed Preference Theory**. If you pay, econ says you wanted to. Parfit says you might not have wanted to, but you were rational to bind yourself.

  ***

  ### Part 3: Addressing Your Two Worries

  **(1) Real Motive vs. Performed Motive (Cheap Talk vs. Costly Signal)**
  Your hunch that this is "Cheap Talk vs. Costly Signal" is close, but misses the ontological claim.
  *   **Signaling:** If I *fake* the motive (perform gratitude), and the Driver's signal is perfect (Ekman), I fail. So I must send a **costly signal**. Usually, costly signals burn money to prove type.
  *   **Parfit's Twist:** The "cost" isn't burning money; it's **restricting future agency**. To pass the screen, I cannot just *signal* that I will pay; I must *become* the type for whom paying is dominant.
  *   **The Loss:** If you treat this purely as signaling, you assume the "true type" exists independently of the signal. Parfit's claim is that the "true type" is **constructed** by the decision to commit. The residue here is **authenticity**. In econ, a lie that works is a success. In Parfit, a lie that works is impossible (because the Driver sees through it) *and* undesirable (because it doesn't solve the ex-ante problem if you can revert). The "real motive" requirement is the requirement that the **commitment be binding on the future self**. If it's just performance, the future self defects, the screen detects it, and you die. So yes, it is a costly signal, but the cost is the loss of ex-post optimization freedom.

  **(2) The Toxin Puzzle (Intention vs. Action)**
  *   **The Worry:** You cannot intend to do $X$ at $t=2$ if you know at $t=1$ that at $t=2$ you will have no reason to do $X$.
  *   **The Contract View:** This is the **Credibility Problem**. A threat/promise is non-credible if it violates future IC.
  *   **The Dissolution:** You are correct that this dissolves if you allow **Endogenous Type Acquisition**. If I can modify my utility function at $t=0$ such that at $t=2$ I *do* have a reason (psychic cost $M$), then the intention is credible.
  *   **The Residue:** The Toxin Puzzle (Kavka) is harder than Hitchhiker because there is no screen. In Toxin, you get the money *for intending*, not for drinking. In Hitchhiker, you get the ride *for being the type who drinks*.
      *   In Hitchhiker, the "intention" is causally linked to the reward via the Driver's prediction.
      *   In Toxin, the "intention" is the reward condition, but the action is decoupled.
      *   Contract theory handles Hitchhiker better than Toxin. Hitchhiker is a **repeated game / reputation / screening** problem. Toxin is a **pure intention** problem. Your framework handles Hitchhiker by saying "Signaling of Type." It struggles with Toxin because "Intention" is not a contractible variable. Parfit's solution to both is the same (change the utility function), but in Toxin, there is no Principal to screen you, so the mechanism is purely internal.

  ***

  ### Part 4: Verdict on Your Hunch

  > *My hunch is that most of the paradox dissolves into just enlarging your choice set with a commitment device, and whatever's left over is only an artifact of econ treating preferences as exogenous.*

  **Verdict:** This is a **real dissolution**, but with a major caveat regarding "Framework Blindness."

  **Why it's real:**
  You have correctly identified that the paradox relies on the **Exogeneity of Preferences**. Standard Contract Theory takes $U(\cdot)$ as a primitive. If you promote $U(\cdot)$ to a choice variable (a "meta-preference" or "constitutional choice"), the paradox vanishes. The Agent simply selects the $U^*$ that maximizes expected utility over the whole game tree. The "irrationality" of paying in town is just the **shadow price of the commitment constraint** required to secure the ride. It is no more paradoxical than paying an upfront fee to enter a market.

  **The Framework Blindness:**
  The residue you risk ignoring is **Agency**.
  1.  **Who chooses the preferences?** In econ, the "Agent" is the utility function. If you say the "Agent" chooses the utility function, you have posited a **Meta-Agent**. Where does *its* utility function come from? Infinite regress?
  2.  **Normativity:** Contract theory is positive/descriptive (given preferences, what happens?). Parfit is normative (what *should* you be?). By dissolving the paradox into "preference design," you solve the *math*, but you sidestep the *philosophical* claim that rationality *requires* this design.
  3.  **Feasibility:** In mechanism design, we assume commitment devices are available or we prove they aren't. Parfit claims humans *have* this device (willpower/norms). Econ treats willpower as a constraint or a cost. Parfit treats it as a solution.

  **Conclusion:**
  Your hunch is correct: The paradox is an artifact of exogenous preferences. If you allow **Endogenous Preference Formation as a Commitment Technology**, Parfit's Hitchhiker becomes a standard problem of **Dynamic Incentive Compatibility with Screening**.
  *   **CDT** = Myopic optimization (violates Dynamic IC).
  *   **TDT/FDT** = Global optimization over decision functions (satisfies Dynamic IC).
  *   **The "Irrationality"** = The binding IC constraint at $t=2$.

  The only thing your framework "declines to look at" is the *mechanism* of preference change. Contract theory assumes you can commit if you have a device. Parfit argues your *mind* is the device. Econ asks "How?" Parfit says "Just be that way." That gap is where the philosophy lives, but for your day job? Yes, it's just endogenous type selection to satisfy ex-ante IR.
