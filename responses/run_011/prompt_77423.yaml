answer: |-
  **Project Title:** The Architecture of Offset: Disentangling Metaphysics and Normativity in the Separateness of Persons Objection

  **Project Summary**

  The separateness of persons objection is the canonical critique of classical utilitarianism. Standardly, it is framed as an attack on aggregation: utilitarianism sums welfare across individuals, thereby treating society as a super-person and ignoring the distribution of benefits and burdens. However, this standard framing is imprecise. Additive aggregation is not unique to utilitarianism; prioritarianism aggregates weighted welfare, and many non-consequentialist views aggregate constraints or reasons. If additivity were the sole culprit, the objection would demolish far more than utilitarianism. My hypothesis is that the actual target is narrower: it is not the arithmetic of summing, but the permission for *offsetting*. The objection targets the claim that a loss to one person can be morally cancelled by a gain to another.

  This creates a puzzle. Nearly everyone accepts offsetting across time inside a single life. We permit imposing costs on a person's present self for the benefit of their future self. If offsetting is permissible intrapersonally but forbidden interpersonally, the moral difference must track the difference between persons. Two candidates explain this difference. The first is metaphysical: there is no unified subject who lives through both sides of the interpersonal transaction to experience the net gain. The second is normative: there is no consent or authoritative permission to trade one person's interests against another's. Current literature treats these as conflated. This project aims to separate them to determine which is load-bearing.

  **The Gap in Standard Debates**

  Standard utilitarian replies typically defend aggregation by arguing that the boundaries between persons are not morally fundamental. They suggest that if we accept offsetting within a life, consistency demands we accept it across lives, dismissing the separateness objection as sentimental. Conversely, critics often assert the separateness of persons as a brute fact that blocks aggregation without specifying the mechanism. Both sides leave the central question open. The utilitarian assumes the metaphysical continuity of a single life is the only relevant factor, ignoring consent. The critic assumes the boundary itself is the barrier, ignoring whether consent could bridge it.

  Consequently, the debate stalls. We cannot know if the objection succeeds because we do not know what it targets. If the objection relies on metaphysical disunity, then cases of diminished psychological unity within a single life should trigger the objection. If it relies on lack of consent, then hypothetical consent scenarios between strangers should neutralize the objection. By failing to distinguish these grounds, existing proposals cannot generate determinate predictions about edge cases. This project moves beyond defending or attacking utilitarianism to diagnosing the underlying structure of the objection itself.

  **Methodology and Case Analysis**

  The core methodological challenge is finding cases that separate metaphysical unity from normative consent. The project will focus on two specific test clusters: split-brain patients and advanced dementia cases.

  Split-brain cases present a single biological organism with potentially disjoint consciousness. If the objection is metaphysical, offsetting between hemispheres should be problematic if they constitute distinct subjects. If the objection is normative, offsetting should be permissible if a unified authority (the body) consents. However, these cases may fail to separate the explanations cleanly. A split-brain patient lacks the capacity for inter-hemispheric consent, confounding the variables. Similarly, advanced dementia cases involve diachronic disunity. If we forbid imposing costs on a healthy past self for a demented future self, is it because the psychological subject is gone (metaphysics) or because the past self cannot consent to the future sacrifice (normativity)?

  If these natural cases prove inconclusive because metaphysics and consent are too entangled, the project will construct hypothetical scenarios. I will design thought experiments where metaphysical unity is held constant while consent varies, and vice versa. For example, a case of two distinct persons with perfect empathy and binding contractual authority to trade welfare versus a single person with psychological discontinuity but no capacity for consent. By isolating variables in this way, I can determine which factor drives the intuitive rejection of offsetting.

  **Work Plan**

  *Months 1–3: Conceptual Archaeology.* I will map the logical structure of the separateness objection across recent literature. The goal is to formalize the distinction between aggregation and offsetting. I will produce a working paper defining the "Offset Principle" and cataloging where current theories violate or uphold it.

  *Months 4–6: The Metaphysical Track.* I will analyze split-brain and dementia cases. I will consult recent empirical literature on psychological continuity to ensure the philosophical premises align with current cognitive science. The deliverable is a conference paper assessing whether psychological discontinuity within a life triggers the separateness objection.

  *Months 7–9: The Normative Track.* I will model consent mechanisms. This involves analyzing proxy consent, hypothetical consent, and binding pre-commitments. I will test whether robust consent mechanisms render interpersonal offsetting permissible in intuition pumps. The deliverable is a journal article draft on the role of authority in welfare trade-offs.

  *Months 10–12: Synthesis and Final Report.* I will integrate findings to answer the core research question. If one explanation is load-bearing, I will formulate a revised principle of distributive justice that respects that constraint while allowing permissible aggregation. If both are required, I will outline a hybrid view. The final output is a monograph-length manuscript ready for publication.

  **Justification and Value**

  Why pursue this route rather than stacking another intuition pump on the pile? The literature is saturated with cases designed to elicit specific intuitions about redistribution. Adding another case without understanding the mechanism behind the intuitions yields diminishing returns. This project is diagnostic rather than advocatory. By identifying the load-bearing premise, it clarifies why certain theories fail and others succeed. It transforms a stalemate into a solvable empirical-conceptual problem. If the objection is purely normative, utilitarianism might be rehabilitated via consent structures. If it is metaphysical, then prioritarianism may also be vulnerable. This clarity is essential for progress in normative theory.

  **Outcomes and Failure Conditions**

  A positive result looks like a determinate identification of the load-bearing factor. Ideally, I will demonstrate that either metaphysical disunity or lack of consent is sufficient to trigger the objection, while the other is not. This would allow for a precise reformulation of the separateness constraint. For example, if consent is key, we might permit interpersonal offsetting in cases of explicit voluntary risk-pooling. If metaphysics is key, we must restrict offsetting wherever psychological continuity breaks, even within a life.

  The project fails if the two factors prove inseparable even in hypothetical cases. If every scenario where metaphysical unity exists also necessarily involves consent, and vice versa, then the question lacks a determinate answer. Another failure condition is if the intuitions regarding the test cases are too unstable to support a conclusion. If informed philosophers disagree radically on the split-brain cases, the diagnostic method loses power. In this event, the output will shift to explaining why the intuitions are unstable rather than resolving the question.

  **Scope and Limitations**

  An honest note on scope: twelve months is insufficient to solve the metaphysics of personal identity. This project does not aim to prove whether persons are truly distinct metaphysical entities. It takes the standard assumptions about psychological continuity and biological life as inputs to test their moral relevance. Similarly, I will not develop a full theory of consent valid for all moral contexts. The focus is strictly on consent as it pertains to welfare offsetting. Finally, I will not address global justice implications extensively. While the results bear on international redistribution, applying the findings to global institutions requires a separate political theory project. This postdoc will remain focused on the foundational moral theory.

  By isolating the mechanism of the separateness objection, this project offers a path through the current deadlock. It replaces vague appeals to "boundaries" with a precise analysis of offsetting, unity, and authority.

  \question{Does the moral prohibition on interpersonal offsetting depend on metaphysical disunity between persons or the normative lack of consent across persons?}
