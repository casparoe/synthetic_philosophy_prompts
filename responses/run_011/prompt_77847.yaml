  ok so I'm a junior and I'm doing an independent study where I have to write a paper on a paradox, and I picked the Pasadena game after falling down a wikipedia hole at like 1am. I think its from a 2004 Mind paper by two guys named Nover and Hájek but I mostly just played with it myself. the version I put in a spreadsheet: you flip a fair coin until heads comes up for the first time, and if that happens on flip n you win or lose money depending on whether n is odd or even, with the amounts arranged so the probability-weighted payoffs come out as the alternating harmonic series. so the total is some fixed number instead of blowing up to infinity like St. Petersburg. my spreadsheet says about 35 cents.

