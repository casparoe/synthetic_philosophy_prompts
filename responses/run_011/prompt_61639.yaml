answer: |-
  # Planning: The Epistemic Spine

  Four candidate insights compete for this session. First, that bureaucratic discretion is inevitable. Second, that the distinction between "unable" and "unwilling" is an epistemic artifact of verification costs. Third, that error trade-offs (Type I vs. Type II) are political choices disguised as technical constraints. Fourth, that claimants perform compliance to survive.

  I select the **epistemic artifact** as the spine. The activity must demonstrate that the "truth" about a claimant is not merely hidden, but *produced* by the interaction between the rule, the budget, and the risk calculus of disclosure. If the design works, students will realize they are not failing to find the truth; they are operating in a system where the truth is too expensive to retrieve or too dangerous to reveal.

  I demote **bureaucratic discretion** to a passing remark. While relevant, focusing on the caseworker's power distracts from the structural constraints. I also demote **performance**, though it remains a mechanism within the game.

  The single most likely failure is that students treat the rules as a puzzle to be solved rather than a constraint to be endured. They will argue, "If we had just written Rule X, we would have caught the fraud." To prevent this, the **Minister's Weighting Shift** is the structural lock. The scoring weights change *after* the rules are written but *before* the final score is calculated. This ensures that even a "perfect" rule set for Round 1 becomes maladaptive in Round 2, forcing the realization that stability is impossible under shifting political priorities.

  # The Eligibility Verification Exercise

  ## Timeline (110 Minutes)

  *   **00–10:** Setup & Pretext. Roles assigned. Safeguarding check.
  *   **10–25:** Rule Drafting. Tables design protocols using the Menu.
  *   **25–65:** Processing Round 1. Tables process 4 claimant cards each. Verification budget spent.
  *   **65–75:** Appeals & Scoring. Tribunal hears appeals. Minister announces weight shift.
  *   **75–85:** Processing Round 2 (Shock). Same rules, new constraints (Budget Cut).
  *   **85–95:** Aggregation & Reveal. Board stats. Card flip.
  *   **95–110:** Debrief. Connecting mechanics to theory.

  ## Materials List

  **1. Rule Drafting Template (One per Table)**
  *   **Verification Budget:** 10 Tokens per table for Round 1.
  *   **Allowable Requirements:** Attendance Log, Income Statement, Medical Note, Residence Proof.
  *   **Allowable Adjustments:** Payment Reduction (25%, 50%), Payment Suspension (1 Month, 3 Months).
  *   **Constraint:** Rules must be binary (If X is missing, then Y). No "reasonable effort."

  **2. Verification Yield Table (Laminated, One per Table)**
  *   *Check Type:* Employer Call, Home Visit, GP Note, Bank Record.
  *   *Cost:* 2 Tokens each.
  *   *Yield:*
      *   **True Positive:** Returns "Confirmed" (80% chance).
      *   **False Negative:** Returns "Unconfirmed" despite truth (20% chance).
      *   **False Positive:** Returns "Confirmed" despite falsehood (10% chance on specific card types).
      *   **Null:** Returns "No Record Found" (Common for informal work).

  **3. Claimant Cards (12 Total, Printed Double-Sided)**
  *   **Front (Observable):** Name, Application Date, Visible Documents (e.g., "Has Bank Statement," "Missing GP Note").
  *   **Back (Hidden Truth):** Employment Status, Health Status, Care Responsibilities.
  *   **Card Examples:**
      1.  *The Informal Carer:* Front: "Missed 3 appointments." Back: "Caring for disabled sibling (no official papers)."
      2.  *The Cash Worker:* Front: "No employer letter." Back: "Working cash-in-hand 10hrs/week."
      3.  *The Threshold Cliff:* Front: "Earned £5 over limit." Back: "Earned £5 over limit." (Rule artifact: £0 tolerance).
      4.  *The Health Fluctuation:* Front: "Fit for work assessment passed." Back: "Condition worsened day after assessment."
      5.  *The False Positive:* Front: "GP Note provided." Back: "Note is genuine, but condition does not meet specific code."
      6.  *The Silent Sufferer:* Front: "No medical evidence." Back: "Severe anxiety prevents phone calls."
      7.  *The Couple:* Front: "Joint claim." Back: "Partner hiding income." (Unit of assessment damage).
      8.  *The Transport Barrier:* Front: "Late to interviews." Back: "Bus route cancelled."
      9.  *The Fraudster:* Front: "Perfect paperwork." Back: "Forged employer letter."
      10. *The Bureaucratic Loss:* Front: "Documents mailed." Back: "Lost in post."
      11. *The Language Barrier:* Front: "Missed signing." Back: "Letter received but not understood."
      12. *The Strategic Withholder:* Front: "No medical evidence." Back: "Has evidence, but disclosure triggers invasive home check."

  **4. Minister's Brief (One Student)**
  *   **Goal:** Minimize "System Cost" (Payments + Verification).
  *   **Round 1 Weights:** Fraud Missed = 10 pts; Genuine Denied = 2 pts.
  *   **Round 2 Shift:** "Public outcry over waste." Fraud Missed = 20 pts; Genuine Denied = 1 pt.
  *   **Instruction:** Announce the shift after Round 1 processing but before scoring. Do not apologize.

  **5. Tribunal Scorecard (Two Students)**
  *   **Columns:** Claimant ID, Original Decision, Appeal Filed?, Tribunal Decision, Outcome.
  *   **Cost of Appeal:** Claimant loses 1 week of payment pending review.

  ## Facilitator Script (Key Moments)

  **Opening Pretext:**
  "You are designing an Eligibility Verification Protocol. Your goal is accuracy within budget. You will process claims, allocate verification resources, and apply adjustments. There are no moral categories here, only compliance states and evidentiary thresholds. Begin drafting."

  **The Reveal:**
  "Do not look at your scores yet. Turn over every Claimant Card on your table. Read the Hidden Truth. Now, compare the Hidden Truth to the Decision you made. Count how many times your rule forced a decision that contradicts the reality on the back of the card."

  **Transition to Debrief:**
  "Look at the board. We have a high rate of 'Correct' decisions, yet half the room just found they penalized a truthful claimant. The error was not in your execution. It was in the price of the truth."

  ## Predictable Failure Modes & Interventions

  1.  **The Moralizing Caseworker:** A student argues, "They should have tried harder," ignoring the card's hidden constraint.
      *   *Intervention:* Remind them: "You are auditing evidence, not character. Stick to the Protocol."
  2.  **The Rule Loophole:** A group writes, "If suspicious, check everything."
      *   *Intervention:* Enforce the Budget. "You have 10 tokens. That is 5 checks. You have 4 claimants. Choose."
  3.  **The Fraudster Enjoyment:** A student playing a claimant brags about beating the system.
      *   *Intervention:* Neutralize the glory. "Record that as a System Error. It degrades the dataset for everyone."
  4.  **The Merciful Tribunal:** The tribunal overturns all denials after seeing hidden info.
      *   *Intervention:* "The Tribunal only sees *new* evidence, not the Hidden Truth. Adjudicate on procedure, not omniscience."
  5.  **The Watertight Rule:** A group claims their rule prevents all error.
      *   *Intervention:* Activate Card 12 (Strategic Withholder). "Your rule requires disclosure. This claimant did not disclose because your rule makes disclosure risky. Your rule created the silence."

  ## Aggregation and Reveal

  **The Board:**
  Write these headers: *Total Claims*, *Verified*, *Paid*, *Adjusted*, *Appeals*, *Appeal Success %*.
  Have tables shout out numbers. Fill the board.
  **The Reveal:**
  Ask tables to count "Hidden Truth Mismatches" (e.g., Paid a Fraudster, Denied a Genuine Need). Add this to the board in a different color.
  **Physical Action:**
  Leave the cards face-up. The visual dissonance between the "Decision" (paperwork) and the "Truth" (card back) is the primary teaching tool.

  ## Round Two: The Shock

  **Honest Assessment:** A full Round 2 with re-drafting does not fit 110 minutes without rushing the debrief.
  **Cut-Down Version:** Keep the Round 1 rules. Announce a **40% Budget Cut** for Verification Tokens.
  **What is Lost:** The opportunity to see how rules adapt.
  **What is Gained:** Immediate stress on the existing epistemic gap. Students see their "good" rules break under resource scarcity. This reinforces the "verification economics" insight more sharply than iterative drafting.

  ## Limitations and Safeguarding

  **What This Cannot Reproduce:**
  In the debrief, you must name the simulation's violence. Points are not rent. Waiting is not hunger. The randomness of card draws makes structural hardship look like bad luck. Most critically, by turning eligibility into a scorecard, *you have performed the technocratic move you are critiquing*. You have relocated a moral question into an optimization problem. Acknowledge this explicitly: "We just did the thing we are studying. We made suffering calculable. That is the danger of the tool, even when used for critique."

  **Safeguarding:**
  At least one student may have lived experience of benefits.
  1.  **Opt-Out:** At the start, state: "Anyone may step out of any role at any time without explanation. You may observe or take notes."
  2.  **Role Allocation:** Do not lottery the **Claimant Voice** role (the student reading the card front). Assign this to the Facilitator or willing volunteers. Students should only play Caseworkers or Minister. This prevents forcing a student to perform vulnerability.
  3.  **Language:** Ensure the forbidden words (*sanction, deserving*) do not appear on handouts. Use "Adjustment" and "Eligibility."

  ## Follow-Up Question

  If a group insists, "We would just write a better rule," ask:
  *"If your rule requires evidence that costs more to produce than the benefit is worth, who pays the difference? And if the claimant pays it, have you not just privatized the cost of your accuracy?"*

  ## 50-Minute Variant

  **Cut:** Remove Round 2 and the Minister role. Facilitator holds the weights.
  **Cut:** Reduce Claimant Cards to 6 (one per table).
  **Focus:** Spend the saved time on the Reveal and Debrief. The core insight (Epistemic Gap) survives; the political instability (Minister) is described rather than played.

  ## Verification Economics & Endogenous Disclosure

  **The Equilibrium:**
  Card 12 (Strategic Withholder) is the engine.
  *   **Payoff:** If Claimant discloses health issue, they must submit Form M. Form M triggers a Home Visit (Cost: 3 Tokens). If Budget is low, Caseworker denies due to "Insufficient Verification."
  *   **Risk:** If Form M is rejected, Penalty is "False Statement" (High). If silent and denied, Penalty is "Non-Compliance" (Low).
  *   **Result:** Rational claimants withhold exonerating info. The Observable File becomes *cleaner* but *less truthful*. Caseworkers see fewer red flags, not because fraud is down, but because disclosure is too risky. This creates the perverse loop: stricter rules $\rightarrow$ less disclosure $\rightarrow$ poorer data $\rightarrow$ more errors.

  ## Appeal Stage Bias

  The Appeal Success Rate will be artificially high.
  **Why:** Only claimants confident they can win will appeal (Selection Bias). The Tribunal sees a skewed sample of "strong cases."
  **Debrief Point:** A high appeal success rate does not mean the First Instance was sloppy; it means the *cost of appealing* filtered out the weak cases. If you lower the cost of appealing, the success rate drops, but the system cost rises. You cannot optimize both.

  ## Debrief: Naming the Technical Move

  Do not lecture. Ask: "Who felt frustrated that the rules stopped you from doing the 'right' thing?"
  When they answer, say: "That frustration is the design feature. The system is not broken; it is functioning to prioritize budget certainty over individual accuracy. We call this 'administrative burden.' It is not a bug. It is a filter."
  Then, name the simulation's own complicity: "We scored this. We made it a game. In doing so, we made the claimant's hardship a variable in your score. That is exactly how the real system sees them. We cannot fully escape that frame, but we can now see its edges."

