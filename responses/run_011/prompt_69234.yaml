answer: |-
  Good evening, everyone. For those of you I haven't met yet, I'm [Name], [Aunt's Name]'s niece/nephew.

  Looking around this room, I realize I have a unique challenge. Half of you are here because you've read her papers on welfare economics. The other half are here because you've shared a Thanksgiving turkey with her. To the economists: I promise I won't try to define "Pareto efficiency." To the family: I promise I won't try to explain why "affine transformations" aren't just a type of geometry homework.

  We are here to celebrate forty years of work. And if you ask the family what she did, you'll hear "math about fairness." If you ask her co-authors, you'll hear "rigorous analysis of social choice." But if you ask [Aunt's Name] herself, she would tell you that her career was spent drawing a very bright line between what the numbers say, and what we owe each other.

  There is a temptation, when someone spends a lifetime studying how to add up human happiness, to assume the math tells you how to be good. There is a famous theorem in her field—Harsanyi's aggregation theorem—that says social welfare is a weighted sum of individual utilities. In plain English: to see how a society is doing, you add up how much everyone wants something.

  Now, a lot of people looked at that math and said, "Aha! This proves that everyone counts the same." They thought the equation demanded equality. [Aunt's Name] spent four decades politely, and sometimes impatiently, correcting them. She would say, "The math does not say that." The theorem says you add up the scores, but it leaves the weights—the importance of each person's score—as a free parameter. The math is silent on whether a king counts for more than a pauper, or whether a pauper counts for more because they have less.

  She insisted that choosing equal weights wasn't a discovery; it was a decision. It was a moral premise wearing a lab coat. She taught us that the theorem doesn't give you a free pass to be fair. You have to bring the fairness yourself.

  She was equally strict about the result. Once you fix those weights, the theorem cares about the total score, not who holds it. It is indifferent to distribution. Two worlds with the same total happiness score the same, even if in one world a single person has everything and in the other, everyone has enough. She refused to let her work be cited as an argument that the math solves inequality. She knew the math is a tool, not a conscience.

  But, she didn't keep that conscience in the office. She brought it home.

  The economists in the room know the concept of the "Impartial Observer"—the idea that you should judge a situation as if you didn't know who you were going to be in it. Well, my cousins can tell you that [Aunt's Name] was the only mother I know who applied the Impartial Observer to dessert.

  There is a long-standing family story about the last piece of pie. While other parents might have cut it evenly, [Aunt's Name] would make my cousins declare how much they wanted the pie *before* they were allowed to know which slice was which. They had to commit to the deal behind a veil of ignorance. I'm told this led to a lot of strategic undervaluing of crust, but it also taught them that fairness isn't about getting what you want; it's about agreeing to rules you'd accept even if you were the one left with the crumbs.

  To the academics: Yes, she knew that wasn't a rigorous normalization of interpersonal utility. To the family: Yes, it was still annoying when you just wanted the apple slice.

  But that was her gift. She never let the precision of the math blur the ambiguity of the morality. She knew that "ought" cannot be derived from "is," no matter how elegant the equation. In a world that often looks for algorithms to tell us what is right, she spent her life reminding us that the weights we assign to human lives are not variables to be solved. They are values to be chosen.

  She is retiring from the university, but she is not retiring from the argument. And thank goodness for that. Because while the theorem says the total score is what matters, anyone who knows her knows that she never cared about the aggregate. She cared about the individuals.

  So, let's raise a glass. To [Aunt's Name]. May your retirement be weighted heavily toward joy, may your utility be strictly increasing, and may you never have to divide a pie again unless you want to.

  To [Aunt's Name]!
