answer: |-
  Here is the spec. I have consolidated your list to remove redundancy (Process/Content and Retail/Wholesale collapse into Scope; Self-Undermining is a specific instance of Parity) and added the missing epistemic bridge.

  ### The Desiderata

  **1. The Epistemic Bridge**
  *   **Question:** Does the paper explicitly defend the principle linking causal history to justificatory status, or does it assume the genetic fallacy is not a fallacy?
  *   **Consideration:** Truth of origins does not automatically entail falsity or unjustifiedness of beliefs. A bridge principle (e.g., "If a belief is causally independent of the fact, it is unjustified") is required to move from *is* to *ought not believe*.
  *   **Tag:** Non-negotiable.

  **2. Causal Independence**
  *   **Question:** Is the causal chain described such that the moral facts play *no* role in the formation of the belief, even as a distal cause?
  *   **Consideration:** If the moral facts themselves influenced survival (e.g., believing pain is bad helps avoid injury), the genealogy tracks truth. The argument requires the causal history to be screened off from the truth-makers.
  *   **Tag:** Non-negotiable.

  **3. Modal Sensitivity**
  *   **Question:** Does the argument establish that we would hold these beliefs even if the moral facts were different, and is this claim supported by more than intuition?
  *   **Consideration:** Actual causal independence isn't enough; the belief must be insensitive. If the facts changed and our beliefs would track them (via the same evolutionary mechanism), the debunking fails.
  *   **Tag:** Non-negotiable.

  **4. Empirical Specificity**
  *   **Question:** Does the paper identify the specific selective pressure or cognitive mechanism, or does it rely on a "just-so" story about fitness?
  *   **Consideration:** To move a realist who accepts the science, you cannot rely on vague adaptationism. You must show *which* mechanism produces the belief and *why* that mechanism is truth-indifferent.
  *   **Tag:** Non-negotiable (per your standard of adequacy).

  **5. Robustness**
  *   **Question:** Does the argument survive if the evolutionary psychology shifts (e.g., from kin selection to group selection, or from adaptation to spandrel)?
  *   **Consideration:** Evolutionary science is revisionary. If the philosophical conclusion hinges on a specific, contestable empirical claim, the argument is hostage to fortune.
  *   **Tag:** Negotiable (but expensive to give up).

  **6. Scope**
  *   **Question:** Does the argument target specific first-order norms (retail) or the capacity for normative judgment itself (wholesale)?
  *   **Consideration:** Debunking incest taboos does not debunk moral realism. Debunking the faculty of normative judgment risks global skepticism. The paper must declare its target and stay there.
  *   **Tag:** Non-negotiable.

  **7. The Parity Constraint**
  *   **Question:** Which fixed points (logic, math, pain) does the argument preserve, and what relevant difference justifies exempting them from the same genealogical treatment?
  *   **Consideration:** If the argument applies to moral beliefs because of their evolutionary origin, it likely applies to logical or mathematical beliefs. If the author exempts them without a relevant difference, it is special pleading.
  *   **Tag:** Non-negotiable (for moving a realist).

  **8. Burden of Fit**
  *   **Question:** Does the paper argue that the realist *must* explain the correlation between belief and fact, or does it merely assert the correlation is improbable?
  *   **Consideration:** Realists often argue the correlation is expected (e.g., third-factor). The debunker must show why the realist's available explanations are insufficient, not just that a correlation exists.
  *   **Tag:** Negotiable (dialectical).

  ***

  ### The Impossible Trinity

  You asked for the smallest unsatisfiable set. It is this: **Empirical Specificity + Robustness + Wholesale Scope.**

  1.  **Empirical Specificity** requires grounding the argument in concrete, current evolutionary science (e.g., specific adaptations for reciprocity).
  2.  **Robustness** requires the argument to hold even if that specific science is revised (e.g., if reciprocity turns out to be a byproduct of general intelligence).
  3.  **Wholesale Scope** requires the argument to debunk the entire faculty of normative judgment to avoid the realist carving out safe zones.

  **The Squeeze:** To be **Robust**, you must abstract away from specific mechanisms. To be **Empirically Specific**, you must commit to concrete mechanisms. To have **Wholesale Scope**, you need a mechanism common to *all* normative judgment, which current science does not support (violating Specificity) and which likely implicates logic/math (violating Parity).

  **The Cheapest View:** Gives up **Wholesale Scope**. It becomes a local debunking argument (e.g., "Evolution debunks deontological intuitions specifically"). This satisfies Specificity and Robustness (within limits) and avoids Parity violations, but it leaves moral realism largely intact.

  ***

  ### The One-Liners

  **Which single requirement eliminates the most existing replies?**
  **The Epistemic Bridge:** Most papers assert that evolutionary origins undermine justification without defending the normative principle that makes origins relevant.

  **How do the dilemma-shaped versions come out against the list?**
  They fail **Robustness:** They typically hinge on a specific dichotomy (adaptation vs. byproduct) that evolutionary biology does not sustain.

  **How do the ones aimed at the third-factor style realist replies come out against the list?**
  They fail **Causal Independence:** Third-factor arguments posit a common cause (e.g., survival value) linking facts and beliefs, which blocks the claim that the causal chain is independent of the truth.
