prompt: |-
  You are an expert in axiomatic bargaining theory who also has substantial experience designing classroom simulations that generate usable data rather than noise. Please think carefully and work through the design constraints before producing any handouts: I want to see your reasoning about how the payoff numbers have to be chosen for the activity to work, not just the finished materials.

  **The setting.** I teach an upper-division course on game theory and its philosophical foundations: 24 students, 12 pairs, one 75-minute session. They have met Nash equilibrium and have heard the phrase "Nash bargaining solution," but they have not seen the axioms, and they have certainly never heard of Kalai and Smorodinsky's rival. The session's job is to make them feel the dispute between independence of irrelevant alternatives and individual monotonicity as a live question about fairness — before either axiom, or either solution concept, is named. Nothing participant-facing may contain the words "Nash bargaining solution," "Kalai–Smorodinsky," "irrelevant alternative," or "monotonicity."

  **The core mechanic I have in mind.** Each pair negotiates the same joint project across three rounds, with roles fixed as Player A and Player B for the whole session. Each round presents a menu of joint options with point payoffs to A and B; pairs have a fixed few minutes to agree on one option (or on a fractional mix of options, if you decide to allow that — see below); if they fail, both receive the round's disagreement payoff. Points accumulate on a public leaderboard, with a small identical participation credit for everyone, so no real money is involved but the stakes are felt.

  What matters is how the three rounds differ:

  - **Round 1** establishes a baseline feasible set in which at least four candidate answers are all genuinely distinct and all computable: the point maximizing the product of gains over the disagreement point; the point on the frontier where each player's gain is the same fraction of that player's maximum achievable gain; the equal-gain point; and the point maximizing the sum. Where pairs actually land relative to these four is the data of the session.
  - **Round 2** leaves the Pareto frontier exactly where it was but adds one new option that raises A's maximum achievable payoff substantially while being unattractive to both — an option no pair would ever jointly select. It must be built into the fiction so that it looks like real news rather than like a puzzle piece ("A has acquired something" rather than "a new coordinate has been appended"). This is the round where A's intuition and B's intuition come apart, and I want the handouts to give each side a sentence of cover-story support for their reaction.
  - **Round 3** re-expresses one player's payoffs in different units — the same underlying options, but A's numbers multiplied and shifted so that nothing that should matter has changed. Pairs who have been anchoring on a fifty-fifty split of the total will now split it very differently, and I want them to notice that they have just let a change of currency move their idea of a fair deal.

  Additionally, I want a **within-class control**: six pairs receive Round 2 with the extra option printed on their handout and six receive the identical game without it. Build this split into the materials and into the protocol, and make sure the two versions are indistinguishable to the students at the time.

  **What I need from you.**

  1. Design notes first. State the principles you are using to choose numbers, and confirm explicitly — with the arithmetic shown — that in each round the four candidate points really are distinct, that the fractional-gain point and the product-maximizing point fall strictly inside frontier segments rather than on listed vertices, and that all coordinates come out as integers or at worst halves so I can verify everything at the board without a calculator. Small integers, please.
  2. A concrete fictional skin for the project being divided. I want the options to read as decisions two parties would actually argue over, not as rows of a matrix, and I want the disagreement point to have a natural reading as each side's outside option.
  3. The three participant handouts, one page each, ready to print: the option menu with payoffs, the disagreement payoff, the time limit, and the recording slip where the pair writes what they agreed to and both sign. Specify whether the pair may agree to a fractional mixture of options (this decision determines whether the frontier is continuous and whether the target points are even reachable — say which way you went and why).
  4. A facilitator answer key computing, for each round, the ideal point, the frontier, and all four candidate outcomes, with the work shown.
  5. A minute-by-minute timeline for the 75 minutes, including where the leaderboard is updated and where each pair writes one sentence justifying why its agreed outcome is fair. I intend to read those sentences aloud, unattributed, during the debrief, because I expect several of them to independently reinvent one axiom or the other.
  6. A debrief that maps specific moments onto specific commitments: the Round 2 argument between A and B; the Round 3 unit change; the scatter of the class's actual agreements against the frontier. Only here do the names appear. Include the two axiom sets side by side and the observation that they share everything but one member, and include a segment on what the control split showed — plus the point I want you to make sharply, because students will miss it: that a null result would not have refuted either solution concept, since these are normative claims and the experiment measures behavior. Say clearly what a behavioral result of this kind could and could not settle.
  7. A frank account of what will predictably go wrong the first time I run this, and how to handle each: pairs who split the total equally no matter what the disagreement point is; pairs who fail to agree in Round 1 and then face Round 2 already behind; the student who realizes the extra option can be brandished as a threat, converting a cooperative exercise into a strategic one (tell me whether to forbid or exploit this); rounding to the nearest listed option if mixtures are disallowed; conflation of the ideal point with the threat point; and pure time-pressure noise in a class of this size.
  8. An honest statement of what this activity cannot reproduce and what I will have to supply verbally — in particular the assumption that payoffs are von Neumann–Morgenstern utilities comparable up to affine transformation, the assumption that both players know the feasible set and the disagreement point rather than misrepresenting them, and the fact that the game builds in Pareto efficiency rather than letting students experience it. Also address whether the fractional-gain solution survives the move to three or more players, and tell me whether to mention that in the debrief or leave it out.
  9. A 40-minute fallback version, in case I lose half the session, that preserves the Round 2 comparison and drops the rest.

  Please do not include a bibliography, a reading list, or citations of any kind; everything I need should be in the numbers and the materials themselves.
