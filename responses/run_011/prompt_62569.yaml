answer: |-
  # DECISION TREE: THE LOGICAL SPACE OF TOP-DOWN VISUAL EFFECTS

  **ROOT (SHARED COMMITMENT):** You accept that top-down states (knowledge, expectation, desire) alter subjects' reports of simple visual properties (colour, slant, etc.), surviving obvious controls.

  ---

  ### NODE 1: TIMING
  **Is the influence *synchronic* (current state alters current processing) or merely *diachronic* (past learning reshaped the module, which is now fixed)?**
  *   **Diachronic Only:** → **LEAF A: Strict Encapsulation.** The system is modular now; effects are due to past tuning, not current cognitive intrusion.
  *   **Synchronic:** → Go to Node 2.

  ### NODE 2: ATTENTION
  **Does the effect vanish when spatial and feature attention are strictly yoked or controlled?**
  *   **Vanishes:** → **LEAF B: Attention-Mediation (Deflationary).** The effect is due to selection mechanisms, not direct cognitive alteration of perceptual content.
  *   **Persists:** → Go to Node 3.

  ### NODE 3: CONTENT
  **Does the influencing state have accuracy conditions (belief/expectation) or is it non-propositional (mood/arousal/goal)?**
  *   **Non-Propositional:** → **LEAF C: Affective Modulation.** Penetration exists but is driven by valence/arousal, not conceptual content.
  *   **Propositional:** → Go to Node 4.

  ### NODE 4: LOCUS
  **Is the effect limited to verbal report/decision, or does it persist in non-report measures (phenomenology, early behavioural markers)?**
  *   **Report Only:** → **LEAF D: Response Bias.** The experience is unchanged; the subject changes their criterion for labeling it.
  *   **Experience/Behavior:** → Go to Node 5.

  ### NODE 5: ARCHITECTURE
  **Is the visual system a fixed, modularly distinct architecture, or is the perception/cognition boundary fluid/non-existent?**
  *   **Fluid/Non-Existent:** → **LEAF E: Holistic Dissolution.** The question presupposes a boundary that does not exist; "penetration" is a category error.
  *   **Fixed/Modular:** → Go to Node 6.

  ### NODE 6: EPISTEMOLOGY
  **Does this influence undermine non-inferential justification (make observation viciously theory-laden)?**
  *   **Yes (Undermines):** → **LEAF F: Epistemic Threat.** Observation is theory-laden in a way that compromises empirical neutrality.
  *   **No (Preserves):** → Go to Node 6b.

  ### NODE 6b: SCOPE (Within Fixed Architecture)
  **Is the penetration ubiquitous across all visual processing or limited to specific tasks/conditions?**
  *   **Ubiquitous:** → **LEAF F: Epistemic Threat.** (Merged: Ubiquity in a fixed system generally implies threat).
  *   **Limited/Special:** → **LEAF G: Graded Penetration.** Penetration is real but architecturally constrained.
  *   *(Alternative Path)*: **LEAF H: Epistemically Harmless.** Penetration is real but does not defeat justification (e.g., reliability is maintained).

  ---

  ### ⚠️ CRITICAL CAVEAT FOR THE HANDOUT
  **Nodes 1, 2, 3, 4, and 6 presuppose a sharp Perception/Cognition boundary.**
  If a participant rejects this boundary (heading toward **Leaf E**), Nodes 1–4 beg the question. For the "Dissolution" theorist, asking if attention "mediates" penetration (Node 2) or if content is "propositional" (Node 3) assumes distinctions they deny. **Print this warning:** *"This tree maps the space of *moderate* realism. If you deny the perception/cognition distinction, Nodes 1–4 are not neutral questions but loaded assumptions."*

  ---

  ### UNOCCUPIED COMBINATIONS (GHOST LEAVES)
  1.  **Synchronic + Attention-Independent + Propositional + Experience + Fixed Architecture + Ubiquitous + Epistemically Harmless.**
      *   **Status:** **Incoherent.** If penetration is ubiquitous within a fixed architecture, there is no "pure" perceptual given left to ground justification. Claiming it is "harmless" contradicts the claim that it is "ubiquitous."
  2.  **Synchronic + Attention-Independent + Propositional + Report-Only + Real Penetration.**
      *   **Status:** **Unattractive/Unstable.** If you concede the effect is *only* in the report (Node 4), you typically deny it is *perceptual* penetration. A position claiming "Real Perceptual Penetration confined to Post-Perceptual Report" is terminologically self-defeating.

  ### INDISTINGUISHABLE LEAVES
  *   **Leaf A (Strict Encapsulation)** and **Leaf D (Response Bias)** are empirically equivalent regarding the *current* perceptual state. Both deny synchronic change to experience. The tree distinguishes them by *mechanism* (tuned module vs. decision criterion), but experimental data often cannot tell them apart.

  ### LEAF SUMMARY
  *   **A:** Strict Encapsulation (Diachronic only)
  *   **B:** Attention-Mediation (Deflationary)
  *   **C:** Affective Modulation (Non-conceptual)
  *   **D:** Response Bias (Post-perceptual)
  *   **E:** Holistic Dissolution (No boundary)
  *   **F:** Epistemic Threat (Theory-laden observation)
  *   **G:** Graded Penetration (Architecturally constrained)
  *   **H:** Epistemically Harmless (Reliability preserved)
