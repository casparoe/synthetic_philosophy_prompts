answer: |-
  **Exam Question**

  Hume defines a miracle as a violation of a law of nature established by "firm and unalterable experience." Yet, as the historical case of meteorites (e.g., L'Aigle, 1803) demonstrates, reports of unprecedented natural phenomena are often initially rejected using the same evidential standards Hume applies to miracles. Drawing on Earman's Bayesian reconstruction, explain what resource Hume has—internal to his own epistemology—to distinguish the report of a genuine miracle from the report of a novel natural event *before* the law is revised. Is it possible to assign the requisite prior improbability to a miracle without already presupposing which regularities constitute immutable laws rather than contingent generalizations?

  ***

  **Model Answer**

  The difficulty facing Hume, illuminated by Earman's Bayesian reconstruction, is that his argument against miracles appears to prove too much. If testimony is rejected whenever it contradicts a regularity established by uniform experience, then the fall of stones from the sky should have been rejected as permanently as the resurrection of the dead. The L'Aigle meteorites show that what counts as a "law" is revisable. To distinguish a miracle from a novel natural event on Humean principles, one must locate the difference in the assignment of prior probabilities, $P(h)$.

  In Earman's formalization, Hume's maxim is reconstructed as a claim about the posterior probability of a miracle report, $P(m|t)$. By Bayes' theorem, this depends on the prior probability of the miracle, $P(m)$, and the likelihood of the testimony given the miracle occurred versus it did not. Hume argues that because a miracle violates a law of nature, and a law of nature is founded on exceptionless experience, the prior probability $P(m)$ is vanishingly small—effectively zero. The evidence of the law (uniform experience) outweighs the evidence of the testimony.

  However, this mechanism applies equally to the pre-1803 belief that stones do not fall from the sky. To the French natural philosophers, the "law" that stones remain terrestrial was supported by uniform experience. Consequently, the prior probability of a report of falling stones was also assigned a value near zero. The distinction between the meteorite and the miracle cannot lie in the *structure* of the argument, as both involve testimony contradicting an established regularity. The distinction must lie in the *status* of the regularity being violated.

  For Hume to distinguish the two cases without begging the question, he must demonstrate that the regularity "humans do not return from death" is epistemically firmer than "stones do not fall from clouds." On an empiricist account, the firmness of a law is a function of the quantity and quality of confirming instances. Hume might argue that the experience against resurrection is more universal and less prone to hidden variables than the experience regarding stones. However, this defense collapses under scrutiny. Before Biot's investigation, the experience against meteorites was also universal for European philosophers. The only difference is retrospective: we now know meteorites are natural, whereas we assume miracles are not.

  This reveals where the prior improbability does the decisive, and problematic, work. To assign a prior of effectively zero to a miracle, one must already be certain that the regularity it violates is an immutable law. But on Hume's own empiricist principles, we can only know a regularity is immutable if there are no exceptions. To use the immutability of the law to reject the testimony of an exception is circular. It assumes the conclusion (that the event did not happen) to establish the premise (that the law is exceptionless).

  Earman argues that Hume avoids this by dogmatically fixing the prior. He treats laws of nature as having a prior probability of 1, making them immune to empirical revision. If Hume allows laws to be revised (as with L'Aigle), he admits that uniform experience can be overturned by sufficient testimony. If he admits this, his argument against miracles fails, as one cannot rule out *a priori* that the testimony for a miracle might be sufficient to overturn the presumed law. If he does not allow revision, he abandons empiricism for a form of rationalism where laws are known independently of experience.

  Therefore, Hume lacks an internal resource to distinguish the miracle report from the novel natural event report *before* the investigation. The distinction relies on classifying the violated regularity as a "true law" rather than a "contingent generalization." But this classification cannot be made without already deciding whether the testimony is credible. The prior probability does the decisive work by smuggling in the assumption that the law is exceptionless, thereby rendering the argument against miracles question-begging. The L'Aigle case demonstrates that what Hume treats as a logical bar to belief is merely a temporary heuristic, one that history shows can be mistaken.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **1. Bayesian Formulation of Hume's Maxim (4 marks)**
  *   **Criteria:** Correctly identifies that the argument turns on the prior probability $P(h)$ being set near zero due to the "law of nature," and relates this to the posterior probability of the testimony.
  *   **Common Mistake:** Confusing the likelihood of the testimony with the prior probability of the event, treating Bayes' theorem as merely about witness reliability.

  **2. Application of the L'Aigle Analogy (4 marks)**
  *   **Criteria:** Explicitly uses the meteorite case to show that "novel natural events" initially receive the same low prior probability as miracles because they contradict established regularities.
  *   **Common Mistake:** Treating the meteorites as "miracles" in the Humean sense rather than as unprecedented natural events that challenged presumed laws.

  **3. The Role of "Law" in Setting Priors (4 marks)**
  *   **Criteria:** Explains that for Hume, the low prior is justified only if the regularity is an exceptionless "law," not a mere generalization.
  *   **Common Mistake:** Assuming laws are known a priori or failing to note that laws are defined by the very experience the testimony challenges.

  **4. Identification of Circularity/Question-Begging (4 marks)**
  *   **Criteria:** Pinpoints that one cannot know a regularity is an exceptionless law without already rejecting the testimony of the exception, making the argument circular.
  *   **Common Mistake:** Arguing that Hume solves this by appealing to the "quality" of witnesses, which ignores the structural problem of the prior.

  **5. Conclusion on Epistemological Consistency (4 marks)**
  *   **Criteria:** Concludes that Hume must choose between dogmatism (laws are unrevisable) or admitting testimony can overturn laws (undermining the miracle argument).
  *   **Common Mistake:** Defending Hume by asserting miracles are metaphysically impossible, which violates the seminar's constraint to stay within Hume's epistemological principles.
