answer: |-
  You have put your finger on the central tension in modern archival theory. Your seminar is likely waving at "the archive" as a site of power and memory (Foucault, Derrida, Stoler), while your summer job was operating on a mid-20th-century administrative model (Jenkinson). The friction you feel is the friction between **custodial neutrality** and **archival activism**.

  Here is a breakdown of the theoretical machinery underlying your observations, the contradictions they generate, and what would happen if you swapped the engine.

  ### 1. The Presupposed Theory: The Jenkinsonian Record
  The practices you describe (creator-driven appraisal, strict adherence to original order, passive neutrality) presuppose the theory articulated by **Hilary Jenkinson** in *A Manual of Archive Administration* (1922).

  *   **What a record is:** A record is **evidence of an administrative transaction**. Its primary value is to the *creator* (the county), not the *subject* (the poor farm inmate) or the *researcher*.
  *   **The Logic:** The archive exists to ensure government accountability. Therefore, the creator is the only one qualified to say what has "continuing value." If the county says a case file has no fiscal/legal need after 5 years, Jenkinsonian logic dictates it should be destroyed.
  *   **The Ontology:** Records are organic byproducts of function. To interfere with them (by re-ordering or re-labeling) is to destroy their evidentiary integrity.
  *   **The Rival Account Ruled Out:** This rules out the **Schellenbergian** or **Social Memory** account. T.R. Schellenberg (1950s) argued records have "secondary value" to researchers and citizens. Critical archivists (Caswell, Cook, Gilliland) go further: they argue records are **constitutive**. They don't just reflect reality; they create it. By keeping only the Superintendent's correspondence and pulping the case files, you aren't just saving space; you are ontologically erasing the inmates and solidifying the Superintendent as the only historical agent.

  ### 2. The Coherence of "Neutrality"
  Is neutrality a coherent stance here? **No.** In critical archival theory, neutrality is viewed as a **myth that masks power**.

  *   **The Bias of Original Order:** By preserving the Superintendent's folder labels ("Defectives," "Inmates"), you are not being neutral; you are **amplifying the voice of the powerful**. You are forcing future researchers to engage with the subjects through the taxonomy of their oppressors.
  *   **The Bias of Appraisal:** Deciding that "policy" matters more than "lived experience" is a value judgment. It privileges the history of the *state* over the history of the *people*.
  *   **The Verdict:** Neutrality in this context is a label for **status quo bias**. It assumes the creator's perspective is the "default" reality. As archivist Michelle Caswell argues, "neutrality" often means "siding with the institution that holds the deed to the building."

  ### 3. The Collecting Push: Contradiction or Evolution?
  Your archives' push to solicit materials from underrepresented communities is theoretically inconsistent with the Jenkinsonian model you use for the county records, but it is an attempt to move toward a **Documentation Strategy**.

  *   **The Contradiction:**
      *   **County Records:** Passive custodianship. "We keep what the government tells us to keep." (Creator-centric).
      *   **Community Collecting:** Active intervention. "We seek out what is missing." (Archivist-centric/Community-centric).
      *   **The Clash:** You cannot claim to be a "neutral custodian" of official records while simultaneously being an "active advocate" for community records. One stance says "wait for the record to come," the other says "go get the record."
  *   **The Reconciliation (Documentation Strategy):**
      *   To make these compatible, you have to shift from **Provenance-based Appraisal** (who made this?) to **Function-based Appraisal** (what societal function does this document?).
      *   This is the theory of **Helen Samuels** and **Terry Cook**. The goal isn't to keep the County's records; it's to document the *function of Poverty in the County*.
      *   Under this framework, the County Poor Farm records and the Community Oral Histories are both "evidence of the function of social welfare." This licenses keeping both, provided you appraise them based on how well they document that function, not just on who created them.

  ### 4. Concrete Changes: Swapping in the Rival View
  If you adopted the **Critical Archival / Social Memory** framework (the rival view), here is what would concretely change in your daily work:

  **A. Appraisal (What to Keep)**
  *   **Current:** Destroy case files because the County doesn't need them for legal defense.
  *   **Rival:** **Sample or Keep Case Files.** You would argue that the "evidentiary value" of the archive is not just to the County, but to the descendants and the historical record of marginalized people.
  *   **Method:** Instead of keeping 0% of case files, you might keep a statistical sample (e.g., every 10th file) or all files for specific years to ensure the *subjects* of the records survive in the archive, not just the *administrators*.
  *   **Rationale:** The record is evidence of *human rights*, not just administrative procedure.

  **B. Arrangement & Description (How to Label)**
  *   **Current:** Folder title: "List of Defectives, 1924." Archivist note: [None].
  *   **Rival:** **Ethical Description / Contextual Notes.** You keep the original folder title (to preserve provenance) but you **add** archival notes that contextualize the language.
      *   *Example:* "Folder title 'Defectives' reflects the eugenicist terminology used by the County Superintendent. Contemporary researchers may search under 'Patients' or 'Residents'."
  *   **Radical Shift:** Some critical archivists argue for **re-foldering** or creating parallel access points. You might create a separate index where individuals are listed by name, rather than by the Superintendent's categorization, effectively breaking "original order" to restore human dignity.
  *   **Post-Custodialism:** In the community collecting push, you might not even take the records. You might leave them with the community and simply catalogue their existence (a "post-custodial" approach), acknowledging that the archive is not the only or best place for these memories.

  **C. The Definition of "The Record"**
  *   **Current:** The record is the paper document generated by the office.
  *   **Rival:** The record includes the **silences**. Your finding aid would explicitly state: "Note: The majority of individual case files were destroyed per 1975 retention schedule. This collection represents only the administrative view."
  *   **Why:** This treats the *absence* of records as part of the historical evidence. It tells the researcher: "The silence here is not accidental; it is structural."

  ### Summary for your Seminar
  You can tell your seminar that your archives is operating on a **Jenkinsonian** model (records as sacred administrative evidence, archivist as passive custodian) for official records, while attempting to patch the resulting **archival silences** with a **Documentation Strategy** for community records.

  The "neutrality" they claim is incoherent because the retention schedule itself is a political instrument that privileges the state's memory over the individual's. To resolve this, they would need to move to a **Macro-Appraisal** model (Terry Cook), where the value of a record is determined by the importance of the *function* it documents (e.g., "care of the poor") rather than the status of the *creator* (e.g., "County Superintendent"). This would mandate keeping the case files and describing them with ethical context, acknowledging that the archivist is not a mirror, but a gatekeeper.
