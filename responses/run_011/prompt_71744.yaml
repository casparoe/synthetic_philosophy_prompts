answer: |-
  ### Desiderata for a Theory of Self-Locating Belief

  **1. Decision-Readiness**
  *   **Statement:** For any set of mutually exclusive, exhaustive world-histories $W$ and total evidence $E$ (including indexical evidence), the theory assigns a probability distribution $P(w|E)$ over $W$ such that $\sum P(w|E) = 1$ and $P(w|E) \geq 0$.
  *   **Motivation:** The agent must commit to irreversible decisions now. A theory that yields undefined probabilities, intervals, or contradictions prevents expected utility maximization.
  *   **Status:** Non-negotiable.
  *   **Counterexample:** A theory that returns "probability undefined" when the number of copies is infinite or unknown, leaving the agent paralyzed.

  **2. Diachronic Coherence (Reflection)**
  *   **Statement:** If an agent knows at $t_0$ that at $t_1$ they will have evidence $E^*$ and will assign credence $P_{t1}(H)$, then their current credence $P_{t0}(H)$ must equal the expected value of $P_{t1}(H)$ over possible $E^*$.
  *   **Motivation:** Prevents Dutch Books and ensures the agent does not view their future rational self as systematically misled without new information.
  *   **Status:** Non-negotiable.
  *   **Counterexample:** An agent who knows they will duplicate tomorrow and thereby shift their credence in a fair coin toss from 0.5 to 0.33 without the coin being tossed.

  **3. Evidence Conservation**
  *   **Statement:** If two hypotheses $H_1$ and $H_2$ imply the exact same set of possible observer-moments having evidence $E$, but differ only in the number of observers having evidence $\neg E$, the ratio $P(H_1|E)/P(H_2|E)$ must equal the prior ratio $P(H_1)/P(H_2)$.
  *   **Motivation:** Prevents the "Presumptuous Philosopher" problem. One should not confirm a hypothesis merely because it populates the universe with observers who *don't* see what I see.
  *   **Status:** Negotiable (SIA violates this; SSA respects it).
  *   **Counterexample:** Gaining high confidence that the universe is infinite solely because I exist, despite my evidence being compatible with a finite universe.

  **4. Indexical Indifference**
  *   **Statement:** If a hypothesis $H$ implies $N$ subjectively indistinguishable copies of the agent, the probability that "I am copy $i$" is $1/N$ for each $i$, conditional on $H$.
  *   **Motivation:** Captures the intuition that without distinguishing information, self-location should be uniform across identical candidates.
  *   **Status:** Preference (SSA camp).
  *   **Counterexample:** A theory that assigns higher probability to being copy 1 than copy 2 despite identical internal states and causal histories.

  **5. Causal Isolation**
  *   **Statement:** The existence of observers causally isolated from the agent, who do not share the agent's evidence, should not alter the agent's credence in hypotheses regarding the agent's local environment.
  *   **Motivation:** Prevents "magical" correlations where distant population booms affect local coin toss credences.
  *   **Status:** Preference (SSA camp).
  *   **Counterexample:** Learning that a galaxy far away contains a trillion happy people shifts my credence that my local coin landed Tails.

  ---

  ### 1. Distinctions a Theory Must Not Collapse

  *   **Observers vs. Observer-Moments:** Load-bearing. A theory counting whole lives weights long-lived agents more than short-lived ones; a theory counting moments weights duration. Collapsing them changes credences in scenarios involving cryosleep or time dilation.
  *   **Many Like Me vs. Many Me:** Load-bearing. "Many like me" implies a reference class of similar agents (SSA-style); "Many me" implies literal identity fission. Collapsing them confuses similarity with identity, breaking the logic of fission cases.
  *   **Natural Kind vs. Indexical Choice:** Load-bearing. If the reference class is a natural kind (e.g., "humans"), it is objective. If it is an indexical choice (e.g., "beings thinking of blue"), it is manipulable. Collapsing them allows gerrymandering credences by redefining the class.
  *   **Learning One Exists vs. Learning What One Is:** Load-bearing. "I exist" is trivial if I am the one thinking it; "I am observer #4 billion" is informative. Collapsing them leads to the Doomsday Argument (treating existence as a random sample from all possible observers).
  *   **Pre-Duplication vs. Post-Duplication Credence:** Load-bearing. Before fission, I am certain I am me. After, I am uncertain which copy I am. Collapsing them violates Diachronic Coherence (Requirement 2).
  *   **Spurious:** **Subjective vs. Objective Chance.** In this context, all probabilities are epistemic credences. Insisting on a distinction adds metaphysical baggage without changing the decision matrix.

  ### 2. Consistency Requirements

  *   **Doomsday-Style Shift:** The theory must either accept that birth rank shifts credence toward earlier extinction (and explain why this isn't absurd) or block the inference by denying that "I exist" is a random sample from all humans.
  *   **Presumptuous Philosopher:** The theory must explain why we are not justified in believing the universe is astronomically populous simply because populous universes contain more observers to have our evidence.
  *   **Vanilla Conditionalization:** In the limit where the agent knows they are the only observer ($N=1$), the theory must reduce to standard Bayesian conditionalization.
  *   **Biased Sampling:** If the agent knows they were selected *because* they have property $X$ (e.g., a lottery winner), the theory must not treat them as a random sample from the general population.
  *   **Uncertain Successor Count:** In fission cases where the number of copies depends on a chancy process (e.g., 1 copy if Heads, 2 if Tails), the theory must yield a determinate credence in Heads/Tails that accounts for the copy count without violating Reflection.

  ### 3. Jointly Unsatisfiable Subsets (Impossibility Result)

  **The Trilemma:** You cannot jointly satisfy **Evidence Conservation** (Desideratum 3), **Indexical Indifference** (Desideratum 4), and **Decision-Readiness** (Desideratum 1) in all fission cases without violating **Diachronic Coherence** (Desideratum 2).

  *   **Sketch:** Consider a coin toss: Heads $\to$ 1 copy; Tails $\to$ 1,000,000 copies.
      *   By *Indexical Indifference*, given Tails, the chance "I am this specific copy" is $1/1,000,000$.
      *   By *Evidence Conservation*, the prior odds of Heads/Tails (1:1) should not shift merely because Tails produces more observers who *don't* see my specific evidence (if we assume my evidence is unique to the copy).
      *   However, to maintain *Diachronic Coherence*, the pre-toss agent must anticipate the post-toss credence. If the post-toss agent uses Self-Indication (counting copies), they shift toward Tails. If they use Self-Sampling (ignoring count), they stay at 1:1.
      *   **Conflict:** If you count copies (SIA), you violate Evidence Conservation (Presumptuous Philosopher). If you don't count copies (SSA), you violate Diachronic Coherence (the pre-toss agent knows the post-toss agent will shift credence for no external reason).
  *   **Cost of Dropping:**
      *   Drop *Evidence Conservation*: You accept the Presumptuous Philosopher conclusion (universes are likely huge).
      *   Drop *Diachronic Coherence*: You accept that rational agents can predict their own irrationality (or "perspectival shift") upon duplication.
      *   Drop *Indexical Indifference*: You must posit a privileged "first" copy, violating symmetry.

  ### 4. Exclusionary vs. Assumed

  *   **Most Exclusionary:** **Decision-Readiness.** This immediately excludes deflationary or quietist views that claim self-locating propositions lack truth values or objective probabilities. If there is no number to plug into the utility function, the theory fails the agent's primary constraint.
  *   **Most Assumed:** **Reference Class Coherence.** Almost all theories assume there *is* a fact of the matter about which beings belong in the reference class ("observers like me"). This is routinely assumed rather than argued for, yet it is the primary source of vulnerability to gerrymandering.

  ### 5. Missing Requirement

  **Decision-Theoretic Alignment:** The probabilities assigned by the theory must match the "weights" used in the agent's decision rule.
  *   *Reasoning:* Some theories (e.g., certain forms of UDT) suggest that what matters for decision-making is not the *credence* of being a copy, but the *impact* of the decision across all copies. A theory of belief that divorces credence from decision-weight renders the credence inert. The specification demands a theory where $P(\text{I am copy } i)$ is the actual weight assigned to copy $i$'s utility in the global calculation.

  ---

  ### Evaluation of User Cases

  **1. Self-Induced Uniqueness**
  This is a **reductio** against theories allowing local acts to change global credences. If I can raise the probability of a cosmological hypothesis by sealing myself in a room (thereby making myself unique in my reference class), the theory violates **Causal Isolation**. The act provides no information about the cosmos; it only changes my indexical relation to it. A robust theory must hold that reference class membership is fixed by facts independent of my current isolationist choices, or that credence does not depend on reference class size in that manner.

  **2. Post-Hoc Merger**
  The observer count does **not** change retroactively. The credences held *before* the merger were correct relative to the evidence available *then* (which included the possibility of being one of two). The survivor's new credences update on the new evidence ("I have merged memories"). If the theory suggests the prior credences were "wrong" because the count changed, it violates **Diachronic Coherence**. The survivor is a new epistemic agent with new evidence; they should not judge their predecessors by data the predecessors could not have had.

  **3. Suspended Observers**
  The question is **confused** unless "observer" is defined functionally. If an upload is dormant, it has no evidence $E$. It cannot be "me" right now because "I" am having an experience. A theory must condition on *actual* observer-moments, not potential ones. Counting dormant uploads as part of the reference class for *current* self-location violates **Evidence Conservation** (they don't share my evidence). They only matter if the hypothesis is about the *future* probability of waking up.

  ---

  ### Scorecard

  **Self-Sampling Assumption (SSA)**
  SSA satisfies **Evidence Conservation** and avoids the Presumptuous Philosopher, as it treats the agent as a random sample from a fixed reference class, ignoring total population size. However, it struggles with **Diachronic Coherence** in fission cases (the "Sleeping Beauty" problem), often requiring the agent to anticipate a credence shift upon duplication without new external evidence. It also falters on **Decision-Readiness** if the reference class is ambiguous, as small changes in class definition drastically alter probabilities.

  **Self-Indication Assumption (SIA)**
  SIA excels at **Diachronic Coherence** and **Indexical Indifference**, treating the agent as a random sample from all possible observers, weighting hypotheses by the number of observers they contain. This handles fission cases smoothly. However, it blatantly violates **Evidence Conservation**, falling prey to the Presumptuous Philosopher objection by confirming populous universes on minimal evidence. It also risks violating **Causal Isolation**, allowing distant population booms to influence local credences.

  **Deflationary View (No Non-Trivial Answer)**
  This view claims self-locating credences are ill-defined without an external reference class choice. It trivially satisfies **Causal Isolation** and **Evidence Conservation** by refusing to make the inference. However, it fails **Decision-Readiness** completely. For an agent that *must* act, a theory that says "there is no fact of the matter" is functionally useless, forcing the agent to arbitrate the metaphysics before making the decision the theory was meant to guide.
