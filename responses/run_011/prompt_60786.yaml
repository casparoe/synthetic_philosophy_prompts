  ### Decision Rules Consistent with the Track Record

  **Rule 1: The "Actionable Utility" Principle (Constrained Rationality)**
  *   **Statement:** Commission evidence if and only if (1) the signal is methodologically trustworthy, (2) the acquisition causes no net ecological or security harm, and (3) for every possible outcome, the organization retains the discretion and resources to execute the optimal *management* action, even if that action is politically inconvenient.
  *   **Classification:** Good's Theorem applied to a more accurate description of the decision problem (specifically, the constraint on the action space and the cost function).
  *   **Awkward Fit:** **Case 7.** The Director made commissioning conditional on *publishing* the results. Publication is a communications act, not a land management action. Under Rule 1, as long as the management change was implemented, publication should be optional. Her insistence on publication suggests a value placed on transparency beyond its utility for management.

  **Rule 2: The "Transparency Condition" Principle (Epistemic Integrity)**
  *   **Statement:** Commission evidence if and only if the organization pre-commits to aligning both its *actions* and its *public communications* with the findings, unless the data is purely operational (e.g., species counts for internal scheduling) and carries no broader policy narrative. Strategic ignorance or enforced secrecy regarding findings that implicate external partners is grounds for refusal.
  *   **Classification:** A genuine departure from Good's Theorem. Good's Theorem assumes the agent values information only for its instrumental effect on decision utility. This rule posits that the agent assigns intrinsic disvalue to *possessing* knowledge that one is forbidden to share (a "guilty secret"), or that organizational integrity requires transparency as a terminal value, not just an instrumental one.
  *   **Awkward Fit:** **Case 1.** The orchid survey determined whether to exercise an option. There is no record of a commitment to publish the absence of the orchid. Rule 2 might predict refusal unless a "purely operational" exception is granted (which fits, but requires ad-hoc justification).

  ---

  ### Predictions for the Heath Survey Case

  **Rule 1 Prediction: Commission.**
  *   **Driving Feature:** **Actionability.** The prompt states explicitly: "Its result would determine which of three management options we fund... we would genuinely act on that choice whichever way it came out." The Board's restriction applies to *raising the finding with the landowner* and *publishing*, not to the internal allocation of management funds. Since the management action remains unconstrained, the Expected Value of Information is positive.

  **Rule 2 Prediction: Refuse.**
  *   **Driving Feature:** **Enforced Secrecy.** The Board has pre-committed to suppressing the finding if it implicates the water company ("will not permit us to publish it"). This mirrors the "strategic ignorance" dynamic of Case 5, but where Case 5 was about avoiding legal liability, this is about avoiding political conflict. Case 7 established a precedent that evidence requires a commitment to truth-telling ("publish the full results whichever way they fell"). The current condition is the exact inverse of Case 7's success condition.

  ---

  ### Classification Relative to Good's Theorem

  **Rule 1 (Actionable Utility): Good's Theorem with Accurate Constraints.**
  *   **Assumption Maintained:** The agent maximizes expected utility based on the posterior.
  *   **Assumption Refined:** It corrects the standard model's assumption of an unconstrained action space. In Case 2 and Case 5, the "optimal action" suggested by the evidence was legally or financially impossible for the organization to take. In those instances, $E[U|Info] = E[U|No Info]$ because the action set $A$ is fixed regardless of the signal $S$. Rule 1 simply formalizes this constraint.

  **Rule 2 (Transparency Condition): Genuine Departure.**
  *   **Assumption Denied:** It denies the assumption that the utility function depends *only* on the final state of the world (conservation outcomes). It introduces an epistemic or reputational cost to *suppressing* the signal itself. In Good's Theorem, knowing a truth you cannot act on is neutral (or costly only if it triggers liability). In Rule 2, knowing a truth you are forbidden to speak is intrinsically negative (corrupting), independent of the management outcome. This treats "Organizational Integrity" as a good that can be consumed by the act of secrecy.

  ---

  ### Best Guess at the Verdict

  **Verdict: Refuse.**

  **Argument:**
  While Rule 1 is a robust model of rational bureaucracy, **Case 7** is the specific precedent that governs this situation. In Case 7, the Director did not merely accept the risk of embarrassment; she made her acceptance *conditional* on a written board agreement to publish and implement. This demonstrates that for her, the *integrity of the scientific process* (which includes dissemination) is a necessary condition for commissioning, not just the utility of the management decision.

  The current case presents the inverse condition: a board pre-commitment to *suppress*. Given that she refused Case 5 (where the board pre-committed to *ignoring* a statutory duty) and Case 4 (where the signal was compromised by external interests), she treats external constraints on the *truth-value* of the science as deal-breakers. The fact that the management options are internally switchable (favoring Rule 1) is likely secondary to the violation of the transparency norm established in Case 7. She prioritizes the trust's scientific integrity over marginal management optimization when the two are in conflict.

  **Decisive Case:** **Case 7.** It is the only case where she explicitly tied the commissioning of evidence to a *communication* constraint (publish regardless). The current case violates that specific constraint.

  ---

  ### Discriminating Test Case

  **Scenario:**
  The Trust owns a nature reserve where visitor numbers are declining. An external consultancy offers a low-cost visitor survey to determine why. The survey is methodologically sound and reports only to the Trust.
  *   **Condition:** The Board agrees to implement whatever operational changes the survey recommends (e.g., change opening hours, improve facilities). However, the Board stipulates that if the survey reveals the decline is due to "poor staff attitude," the specific findings on staff performance must be kept confidential to protect morale, and only the operational changes will be enacted.

  **Rule 1 (Actionable Utility) Verdict: Commission.**
  *   **Reasoning:** The optimal *management actions* (changing hours, facilities) are permissible and will be enacted. The constraint on communicating the *cause* (staff attitude) does not prevent the organization from improving the reserve's status. The information has positive instrumental value.

  **Rule 2 (Transparency Condition) Verdict: Refuse.**
  *   **Reasoning:** The Board is pre-committing to a partial suppression of the truth ("strategic ignorance" regarding the cause). This violates the integrity condition established in Case 7 (publish full results). The Director would view this as compromising the scientific record to protect internal politics, similar to the suppression of the water company's role in the heath case.

  **Separation:**
  If she **commissions**, she follows Rule 1 (Management Utility trumps Communication Integrity).
  If she **refuses**, she follows Rule 2 (Communication Integrity is a necessary condition).
