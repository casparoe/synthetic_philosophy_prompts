      *   **Theoretical Framework:** Robert Dahl's "Boundary Problem" (who decides the demos?). Criteria to test: All-Affected Interests (AAI), All-Subjected to Coercion (ASC), Stakeholder/National Membership.
      *   **Specific Questions:**
          1.  Which criterion did the actual franchise best approximate?
          2.  Which criterion did it most cleanly violate?
          3.  Was the mismatch principled or path-dependent?
          4.  **The Hard Bit:** Does "affectedness" work when *who is affected* depends on the *outcome*? (If Leave wins, EU nationals/expats affected; if Remain, status quo). Is this a fatal flaw for AAI, or can it be fixed?
          5.  **The Big Picture:** Does Brexit confirm the boundary problem, is it an anomaly, or does it show people don't actually want demos to track affectedness when it costs them?

  2.  **Initial Analysis & Fact-Checking:**

      *   *Franchise:* European Parliamentary Elections Act 2002 (as amended) + Referendum Act 2015. Yes, Westminster franchise + Lords + Gibraltar. Irish and Commonwealth citizens resident in UK could vote. Other EU citizens could not. 16-17s excluded (unlike Scotland 2014). 15-year rule for expats applied.
      *   *Dahl's Point:* "The rule of the people" presupposes a definition of "the people." Democracy cannot define its own boundaries democratically without circularity.
      *   *AAI (All-Affected Interests):* Anyone whose interests are significantly affected should have a say.
      *   *ASC (All-Subjected to Coercion):* Anyone subject to the binding laws/authority of the state.
      *   *Stakeholder/Nationality:* Citizenship or permanent stake in the community.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the personal stake (Dutch in Manchester) and the theoretical weight. Validate the frustration.
      *   **Mapping the Franchise to Criteria:**
          *   *National Membership/Stakeholder:* This is the closest fit. It was essentially "Who is a British/Irish/Commonwealth subject with a voting connection?" It prioritizes *membership* over *residence* or *affectedness*.
          *   *All-Subjected to Coercion:* Violated heavily. EU nationals (like the user) were subject to UK law, taxation, and the outcome, but had no voice. Also, the 15-year rule excludes expats subject to some UK ties but not others.
          *   *All-Affected Interests:* Violated massively. 3.3m EU nationals, 1.3m Brits abroad (under 15 years or over), 16-17 year olds.
          *   *Path Dependence:* It was definitely path-dependent. Using the Westminster franchise was administratively easy ("the usual list") but conceptually lazy for a constitutional question.
      *   **The "Hard Bit": The Paradox of Affectedness:**
          *   This is the crux. If the outcome determines who is affected, how do we define the electorate *ex ante*?
          *   *Solution 1: Potential Affectedness.* You don't need to know the outcome to know you *could* be affected. (Good, but maybe too broad).
          *   *Solution 2: Status Quo Bias.* If the vote is about changing the status quo, those currently in the status quo (residents) are affected by the *risk* of change.
          *   *Solution 3: The "All-Subjected" Pivot.* Many theorists (e.g., Goodin, López-Guerra) suggest ASC is more stable than AAI for this reason.
          *   *The User's Insight:* The user hits on a specific logical loop. If Leave wins, EU nationals are affected. If Remain, they aren't (mostly). This makes AAI contingent on the result.
          *   *Counter-argument:* They were affected by the *uncertainty* and the *campaign* regardless. Also, the *decision to hold the vote* affected them.
      *   **The Big Picture (Brexit & Democratic Theory):**
          *   Does it confirm the boundary problem? Yes, it highlights the arbitrariness.
          *   Does it show people don't want affectedness? Likely. Expanding the franchise is politically costly. Incumbents (voters) rarely vote to share power.
          *   Is it an anomaly? No, it's standard practice (national elections exclude residents), but stark because the issue was *about* residence/movement.

  4.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Irish Citizens:* Why did they vote? Reciprocity + Common Travel Area (CTA). This fits "Stakeholder/National Membership" (special relationship) better than pure AAI.
      *   *Commonwealth Citizens:* Historical legacy. Fits "Path Dependence."
      *   *The 15-Year Rule:* This is the strongest evidence against ASC. If you are subject to UK law, you should vote. If you live abroad >15 years, you aren't subject to most UK law, so ASC excludes them. But AAI might include them (citizenship rights). The franchise excluded them, suggesting a "Current Stakeholder" model.
      *   *The "Outcome-Dependent" Problem:* This is known in literature as the *individuation problem* or the *contingency problem*. Goodin argues we should count *possible* interests. But the user is right: the *magnitude* of affectedness changes.
      *   *Recommendation:* The franchise was a "Westminster General Election" model. This is a *Citizenship + Qualifying Residence* model. It is *not* an AAI model.

