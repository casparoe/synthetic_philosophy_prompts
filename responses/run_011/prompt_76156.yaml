      *   *Wait, one nuance:* The user asks if AAI can be stated in advance. The answer is usually "Yes, by counting *risk* of affectation." But the user's point is stronger: the *nature* of the affectation changes. I need to validate that insight. It's the "endogeneity of the demos" problem.

  9.  **Final Plan:**
