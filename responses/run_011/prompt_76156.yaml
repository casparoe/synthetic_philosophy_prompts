answer: |-
  This is a sharp, theoretically grounded frustration, and you have identified the exact nerve where democratic theory meets political reality. Your personal situation (Dutch, resident, no vote vs. Irish, resident, vote) is the perfect empirical instantiation of Robert Dahl's boundary problem.

  Here is an analysis of the 2016 franchise through the lenses you proposed, followed by a tackle of the "outcome-dependent" paradox you identified.

  ### 1. Mapping the Franchise to Democratic Criteria

  The franchise was defined by the *European Union Referendum Act 2015*. It utilized the Parliamentary electorate (plus Lords and Gibraltar).

  **A. Which criterion did it best approximate?**
  **The National Membership / Stakeholder Principle.**
  The franchise most closely mirrored a "citizenship plus" model. It included:
  *   British citizens (resident or abroad <15 years).
  *   Irish citizens (resident).
  *   Qualifying Commonwealth citizens (resident).

  This aligns with Rainer Bauböck's **Stakeholder Principle**, but in a specific, historically contingent form. It prioritized *formal membership* in the UK polity (or its historical imperial legacy) over *residence* or *affectedness*. The inclusion of Irish citizens is due to the Common Travel Area (reciprocity), which reinforces the "membership" logic rather than a pure "affected interests" logic. If it were pure affectedness, all EU residents would be in; if it were pure subjection, all residents would be in. The fact that it tracked Commonwealth/Irish/British status suggests the underlying principle was: *Who belongs to the UK political community?*

  **B. Which criterion did it most cleanly violate?**
  **The All-Subjected to Coercion (ASC) Principle.**
  This is the strongest theoretical violation. As a Dutch national resident in Manchester, you were subject to UK taxation, UK criminal law, UK local governance, and the binding outcome of the referendum.
  *   **The Violation:** You were subject to the authority whose composition was being decided, yet excluded from the authorization of that decision.
  *   **The 15-Year Rule:** This also violates ASC. Brits abroad >15 years lose the vote. If the principle were "all subjected," they should be excluded (they aren't subject to most UK law). If the principle were "all affected," they might be included (citizenship rights). The 15-year cut-off is arbitrary, further suggesting the franchise wasn't built on a coherent principle but on a "current connection" heuristic.

  **C. Path-Dependence vs. Principle**
  It was overwhelmingly **path-dependent**.
  The UK government explicitly chose the Westminster General Election franchise for administrative convenience ("the existing rolls"). This was a bureaucratic decision masquerading as a democratic one.
  *   **The Anomaly:** In the 2014 Scottish Independence Referendum, the franchise was expanded to include 16/17-year-olds and all EU residents (including you). This proves that a different franchise was *possible* and *administratively feasible*.
  *   **The Conclusion:** The exclusion of EU nationals in 2016 was not a principled stand on the nature of the demos; it was a default setting. The "principle" was applied retroactively to justify the convenience of using existing electoral rolls.

  ### 2. The Hard Bit: The Paradox of Affectedness

  You have hit on a specific problem in the literature known as the **endogeneity of the demos** or the **contingency problem**.

  > *If Leave wins, EU nationals and long-expat Brits are the ones whose lives get remade; if Remain wins almost nobody's status changes. That makes the principle seem unstateable in advance.*

  This is a genuine problem for the **All-Affected Interests (AAI)** principle, often associated with Robert Goodin. If we define the demos based on who is affected, but who is affected depends on the decision, we face a circularity: *We need the demos to decide the outcome, but we need the outcome to define the demos.*

  **Is this fatal for AAI?**
  Not necessarily, but it requires a modification of the principle. There are two ways theorists try to fix this without smuggling in the answer:

  **1. The "Risk" or "Potentiality" Fix**
  Goodin argues we should count anyone whose interests *could possibly* be affected, not just those who *will* be.
  *   *Application:* Even if Remain won, EU nationals were affected by the *uncertainty*, the campaign rhetoric, and the fact that their status was put up for negotiation. Their security was diminished simply by the holding of the vote. Therefore, they were affected *ex ante* regardless of the outcome.
  *   *Weakness:* This is so broad it risks enfranchising everyone on the planet (global affectedness).

  **2. The "Status Quo" Baseline**
  We define affectedness relative to the *proposal*, not the *outcome*.
  *   *Application:* The referendum was a proposal to change the constitutional status quo. Anyone whose legal status was *contingent* on that status quo (i.e., EU nationals deriving rights from membership, Brits abroad deriving rights from EU membership) is in the affected set.
  *   *Strength:* This solves your paradox. You don't need to know if Leave will win to know that your residency rights are now *contestable*. The act of putting the question to a vote altered your political security.

  **However, your intuition is correct:** In practice, AAI is almost impossible to apply cleanly to constitutional boundary changes because the "affected" set shifts dynamically. This is why many theorists (like David Owen or Arash Abizadeh) prefer **All-Subjected to Coercion (ASC)**.
  *   Under ASC, it doesn't matter what the vote is about. If you live in the territory and are subject to the law, you vote.
  *   This would have enfranchised you (Dutch resident) but excluded your wife (if she weren't Irish/Commonwealth) and excluded the 15-year expats.
  *   ASC avoids the "outcome dependency" trap because subjection is a factual state *before* the vote, not a consequence *of* the vote.

  ### 3. What Brexit Confirms About the Boundary Problem

  Does Brexit confirm the boundary problem, absorb it as an anomaly, or reveal a lack of will?

  **It confirms the Boundary Problem.**
  Dahl's point was that "the people" cannot democratically define themselves. The 2016 franchise demonstrates that the definition of the demos is always a **pre-political decision** made by the existing sovereign power (Westminster).
  *   Westminster decided who voted.
  *   Westminster decided based on administrative convenience and historical legacy (Commonwealth), not democratic theory.
  *   Therefore, the "will of the people" was constructed by the very institution whose relationship with Europe was being questioned.

  **Does it show nobody wants affectedness when it costs them?**
  Yes. This is the cynical but realistic conclusion.
  *   **Incumbent Privilege:** Existing voters rarely vote to expand the franchise. In 2016, the "Leave" campaign specifically leveraged the exclusion of EU nationals as a feature, not a bug ("This is a decision for Brits").
  *   **The Cost of Consistency:** If the UK had adopted a consistent AAI or ASC principle, the result might have been different (polling suggested EU nationals and younger voters leaned Remain). The path-dependent franchise was likely outcome-determinative.
  *   **The Lesson:** Democratic states will almost always default to the **National Membership** model (citizens + historic allies) rather than Affectedness or Subjection when the stakes are high. It preserves the boundary of the nation-state against the fluidity of modern residence.

  ### Summary

  Your exclusion was not a theoretical necessity; it was a bureaucratic default with political utility.
  1.  **Franchise Model:** National Membership/Path-Dependence (Westminster rolls).
  2.  ** Biggest Violation:** All-Subjected to Coercion (You were subject to the law but had no voice).
  3.  **The Paradox:** You are right that AAI struggles with outcome-dependency. The fix is to view the *risk* to your status as the "affect," but ASC is a more stable principle for residency cases.
  4.  **The Verdict:** Brexit confirms Dahl. The boundary of the demos is decided by power, not principle. When the principle (affectedness) conflicts with political self-interest (controlling the outcome), the boundary problem is "solved" by excluding the inconvenient affected parties.

  Your wife's vote and your lack thereof wasn't a reflection of your respective stakes in the outcome; it was a reflection of the Common Travel Area's historical footprint versus the administrative laziness of the 2015 Referendum Act. It is a classic case of the "boundary problem" being resolved not by democracy, but by history.
