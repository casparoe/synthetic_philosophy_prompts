answer: |-
  The control room smelled of stale coffee and ozone, a scent that had soaked into the vinyl flooring over twenty years. Outside the thick glass, the North Sea was a black wall of noise, throwing itself against the barrier again and again. Inside, the only sound was the hum of the server racks and the rhythmic tapping of Vance's pen against his clipboard.

  Vance was finishing his shift. Elias was just starting hers. They had worked this handover for three years, long enough to know each other's silences.

  "Pressure holding?" Elias asked, shrugging off her wet coat.

  "Model says yes," Vance replied, not looking up. "Surge is at four meters. Gate seal stress is at two percent."

  Elias walked to the whiteboard mounted on the wall. It was covered in the arithmetic of their vigilance. At the top, written in red marker, was the Trigger: *10%*. Below it, the current calculation. *Model: 2%. Hedge: 5%. Range: 1.9% – 6.9%.*

  "Below the line," Elias said.

  "Below the line," Vance confirmed. "We stay quiet. Town sleeps."

  They worked by the Agreement. The Authority's hydraulic model was good, but not perfect. So, for years, the operators had added a hedge. They treated every prediction as a mixture: ninety-five parts the official model, five parts sheer possibility. Five percent for the things the computers couldn't see—the rust inside the weld, the tree root in the hydraulic line, the universe deciding to break differently than expected. They spread that five percent over every possible disaster.

  The Agreement said they sounded the siren only if the chance of failure passed one in ten. Tonight, even with the hedge, the highest number was 6.9 percent. Safe.

  Elias poured herself coffee from the pot that had been burning since midnight. It was thick and bitter. She took a sip and stood by the window. The rain was sheeting down, distorting the lights of the maintenance gantry outside.

  "Quiet night," she said.

  "Until it isn't," Vance said. He capped his pen. "Log is signed. Key is yours."

  He stood up, stretching his back. That was when the console beeped.

  It wasn't the alarm. The alarm was a klaxon that shook the floor. This was a soft, digital chirp. A telemetry update. Both of them froze. Elias set her mug down on the console before it could clatter.

  Vance leaned over the keyboard. "Channel Four. Redundant seal sensor."

  "Failure?" Elias asked, her hand hovering near the siren key.

  "No." Vance scrolled through the text. "Self-test fault. Code 88-Alpha."

  Elias exhaled. "The tester, not the seal."

  "Manual says Code 88-Alpha is a fault in the testing apparatus itself," Vance recited. "It means the sensor couldn't check itself. It doesn't say the seal is broken. It says the thermometer is broken, not the room."

  "Probability?"

  Vance tapped the keys, pulling up the diagnostic history. "Model says this code appears one night in a hundred. Unconnected to seal integrity. It's noise."

  Elias looked at the whiteboard. "So we ignore it."

  "We ignore it," Vance said. He picked up his bag.

  "Wait," Elias said. She picked up the eraser. "If we ignore it, we aren't doing the math."

  Vance paused, one arm in his jacket sleeve. "The math says it's noise."

  "The math says it's noise *under the model*," Elias corrected. "But we don't run just the model. We run the family."

  She wiped the *1.9% – 6.9%* from the board. The white space stared back at them.

  "Elias," Vance said, his voice tired. "It's a printer jam in the wiring. It happens once a year. It doesn't mean the sea is coming in."

  "We agreed," she said, picking up the red marker. "Five percent for the unknown. We spread that five percent over every way the world might be. Some of those worlds include worlds where the tester fails *because* the seal is failing. Worlds where the electronics go weird before the metal gives."

  "That's not what the code means."

  "It's what the code *allows*," she said. She began to write. "The model says this signal is rare. One in a hundred. But our hedge... the hedge includes worlds where rare things happen for bad reasons."

  She did the calculation aloud, her voice flat. "The signal is rare under the model. So when we see it, the model loses weight. The ninety-five percent shrinks. The five percent—the ghost story—gets heavier. Relative to the signal, the ghost story becomes the main story."

  She wrote the new numbers. *0.3% – 84%.*

  Vance stepped back to the board. He stared at the upper bound. "Eighty-four percent?"

  "In the worst member of the family," Elias said. "The one that put all five percent on 'Catastrophe plus Glitch.' Given the glitch, that story says we're already flooding."

  "And the bottom?"

  "Three tenths of a percent. In the best story, this is just a burnt lamp."

  Elias turned to him. Her hand was shaking slightly. "The range crossed the line, Vance. The top end is eight times the trigger."

  "The bottom end is zero," Vance said. "You're telling me a meaningless code moved your belief from six percent to eighty-four percent?"

  "The hedge did it," she said. "The safety margin ate us. Because we insisted on keeping room for the impossible, the impossible got loud when the rare thing happened."

  Vance walked back to the console. He looked at the blinking light, then at the whiteboard. "So now what? You sound the siren?"

  "The rule says if the chance passes ten percent, we sound it."

  "Which rule?" Vance asked sharply. "The Agreement has two parts. Part one: Sound if risk is greater than ten. Part two: Only act if the action is justified across the family."

  Elias frowned. "Justified?"

  "Before the code," Vance said, tapping the board where the old numbers had been. "Before, 'Stay Quiet' was better than 'Sound Alarm' for every member of the family. Six percent is less than ten. Zero is less than ten. Every story said 'Stay Quiet.' The rule was decisive."

  He pointed to the new numbers. "Now? The family is split. In the best stories, 'Stay Quiet' is right. In the worst stories, 'Sound Alarm' is right. The rule doesn't speak anymore, Elias. It's silent."

  "So we default to safety," she said. She moved her hand toward the key. It was a heavy plastic cover, red and clear.

  "We default to chaos," Vance said. He stepped between her and the console. "Think about the town. It's three in the morning. They're sleeping. If you pull that key, they wake up. They grab their kids. They drive onto wet roads. They crowd the evacuation center."

  "And if the seal breaks?"

  "Then you saved them."

  "And if it doesn't?" Elias countered. "That's the third alarm this season. Two were false. One was a test."

  "Exactly," Vance said. "You know the cost. A hollow alarm costs trust. Three hollow alarms in a season guarantee nobody comes for the fourth. If you sound this siren on a tester fault, you aren't being cautious. You're burning the bridge for the next guy. For me. For whoever stands here when the real one comes."

  "The worst case is eighty-four percent," Elias said. "How do I ignore that?"

  "You ignore it because the rule tells you to," Vance said. "When the family disagrees, you don't pick the worst story. You admit you don't know. And if you don't know, you don't wake the town. You wait for data that matters."

  "This data matters!"

  "It's noise!" Vance slammed his hand on the desk. The coffee mug jumped. "It's a self-test fault. The manual says it. The model says it. The only reason it matters is because we built a math trick that turns noise into fire."

  "It's not a trick. It's honesty," Elias said. "It's admitting the model could be wrong."

  "It's admitting the model could be wrong," Vance agreed. "But it's also admitting that when the model whispers, your honesty screams. You built a hedge against being wildly wrong, and now the hedge is forcing you to be wildly reckless."

  Elias looked at the key. The plastic cover was cool under her palm. Outside, the wind howled, a long, low moan that vibrated in the floorboards. The barrier groaned. It was a normal sound, the sound of steel taking weight, but tonight it sounded like a bone cracking.

  "If I don't sound it," Elias said, her voice quiet, "and the water comes over the wall... the inquiry will look at this board. They'll see the eighty-four percent."

  "They'll see a operator who understood that a range crossing a threshold isn't a threshold crossing," Vance said. "They'll see someone who knew that when the map contradicts itself, you don't drive off the cliff."

  "And if the water comes?"

  "Then we die," Vance said. "But if you sound it, and it's dry... the town dies a little bit anyway. They lose faith. They stop listening. And then, when the eighty-four percent is real, nobody moves."

  He stepped back, giving her space. He picked up his bag again. His shift was over. The choice was hers.

  "The rule stops speaking," Vance said softly. "That means you have to speak. Not the math. You."

  Elias looked at the whiteboard. The numbers stared back. *0.3% – 84%.* A spread so wide it meant nothing, and everything. The hedge had done its job too well. It had protected her from certainty, leaving her with only ambiguity.

  The wind battered the glass. A sheet of rain blurred the view of the sea completely. For a second, the outside world vanished, leaving only the hum of the servers and the blinking light of Channel Four.

  Elias lifted the plastic cover. The key underneath was cold steel.

  Vance didn't move to stop her. He just watched, his face unreadable in the green glow of the monitors. He had made his argument. He had offered the logic of the long year against the logic of the single night.

  Elias's finger hovered over the key. The siren waited. The town slept. The sea pushed.

  She looked at Vance. He looked at the board. Neither of them looked at the window.

  "Shift change is complete," Elias said.

  Vance nodded. He turned toward the door. He didn't ask what she decided. He just opened the door, letting the sound of the wind rush in for a moment before he closed it again.

  Elias stood alone in the hum. The numbers on the board remained. The key remained under her hand. Outside, the surge continued to rise, indifferent to the math, indifferent to the rule, waiting to see which story was the true one.
