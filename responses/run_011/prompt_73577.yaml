answer: |-
  The file sat on the desk under the lamp, the manila folder slightly warmer than the surrounding air from being held too long. The name on the tab was Elias Thorne. The relationship field on the recusal form I had signed ten minutes prior read *Father*. I was no longer authorized to view this material, but the system lag had granted me seventy-two hours of possession before the flag took hold, and those three days had rewritten the architecture of my thinking.

  The assessment instrument was standard. Six domains of function: mobility, hygiene, nutrition, cognition, medication, communication. Each scored zero to three. The sum determined the tier. The tier determined the hours. But there was a seventh field, digital and rigid, that governed the financial backdate. Box 14B: *Date on which claimant ceased to be capable of independent living.* The software accepted DD/MM/YYYY. It rejected ranges. It rejected qualifiers. It did not understand the word *approximately*.

  This date was worth money. Not abstract budget allocation, but specific currency owed to the estate for care not provided. If the date was in January, the payout covered ten months. If the date was in March, it covered eight. The difference was substantial enough to renovate a kitchen or replace a roof. The difference was also the width of a single Tuesday.

  I opened the notebook I had taken from his study. It was bound in oilcloth, the pages stiff with wax and soil. He kept bees. Forty hives at the height of it, down to four by the end. The notebook was not a diary; it was a log. He did not write about how he felt. He wrote about the state of the colony. I needed to find the moment the man became the claimant, but the notebook only offered the moment the keeper became the kept.

  I turned to the autumn section. The handwriting was steady, then slightly tremulous, then steady again. There was no narrative arc, only data.

  Oct 4: Queen marked green, laying strong.
  Oct 11: Mites low, syrup fed.
  Oct 18: Cool wind, cluster forming early.
  Oct 25: Queen seen, movement sluggish.
  Nov 1: Dead drones at entrance.
  Nov 8: Syrup untouched, twenty litres.
  Nov 15: Cluster tight, no flight.
  Nov 22: Quiet inside the box.
  Nov 29: Queen not found, noise low.
  Dec 6: Cold spot developing north side.
  Dec 13: Cluster broken, few movers.
  Dec 20: Silence, weight light.

  I read the entries three times. On October 25, the queen was sluggish. On November 8, the food was ignored. On November 29, the queen was missing. Which entry marked the end of the colony? To a biologist, perhaps the death of the queen. To a beekeeper, perhaps the breaking of the cluster. To the insurance adjuster who had handled his hive policy, it was the date the temperature inside the box dropped below ambient for twelve consecutive hours.

  My father had a rule for this. He had explained it to me once while we stood over a open hive, smoke drifting between us. He said a colony is not a collection of insects. It is a single engine of heat. As long as the center holds ninety degrees, the colony is alive. If the heat fails, the colony is dead, even if individual bees still walk around the entrance. The walking bees are just debris. The life is the temperature.

  The assessment scheme I worked for had a different rule. For a human, life was not heat. It was friction. It was the resistance offered against gravity and entropy. Could the claimant lift a cup? Could they navigate a step? Could they recognize a pill? Independence was not a thermal state; it was a mechanical one. You were independent until the friction exceeded the force.

  I looked at the file again. The medical reports offered contradictions. The GP noted "increasing confusion" in September. The neighbor noted "still gardening" in November. The pharmacy record showed missed refills in October, then perfect adherence in December when the daughter moved in. The data points were scattered stars; I was being asked to draw a single line through them.

  There was a view, one I had read about in the quiet hours of the morning, that suggested the date must exist. It argued that capability is binary. You can lift the cup or you cannot. There is a millisecond where the muscle fails. Therefore, there is a date. To say otherwise is to deny reality.

  There was another view, equally loud, that argued the date is a fiction. It suggested that capability is a fog. You lift the cup today, you drop it tomorrow, you lift it again next week. To pick a date is to lie. It is to impose a grid on a landscape that has no borders.

  I held both views in my head simultaneously. They did not cancel each other out. They vibrated against one another.

  If I chose October 25, when the queen was sluggish, I honored the medical decline. But he was still feeding himself. If I chose November 29, when the queen was gone, I honored the loss of agency. But he was still walking. If I chose December 20, I honored the silence. But by then, the care was already in place.

  The form required a Tuesday. The system logic assumed that life changes on business days. It assumed that a person wakes up on a Wednesday capable and goes to sleep on a Thursday incapable. This was false. I knew it was false. My father's decline was a slow leak, not a burst pipe. The notebook proved it. The medical records proved it. The very nature of biology proved it.

  And yet, the date was real.

  It was real because the signature on the authorization form required it. It was real because the transfer of funds required it. It was real because without it, the story of his care had no beginning, and without a beginning, there could be no accounting of the end. The fiction created the fact. By writing the date, I would make it true. The money would move. The file would close. The state would acknowledge that on this day, the man became the claimant.

  I looked at the bee rule again. Heat. If the center holds, the thing lives. When did his center stop holding? Was it when he stopped driving? When he stopped shaving? When he stopped correcting my grammar? There was no thermal gauge for a human life. There was only the friction.

  I opened the laptop. The screen glowed, bright and unforgiving. The cursor blinked in Box 14B. It was a vertical line, waiting to be anchored.

  I thought about the bees. If I were assessing the hive, I would pick November 29. The queen was gone. The engine had stopped, even if the parts were still moving. But I was not assessing a hive. I was assessing a man. The rules were different. The friction had exceeded the force sometime between the missed pills and the daughter's arrival.

  There was no correct answer. There was only the necessary one. The system could not process a range. It could not process a probability. It could not process the truth that the decline was a gradient. It needed a coordinate.

  I placed my hands on the keyboard. The keys were cool. The file lay open to the left, the notebook open to the right. The medical report sat on top. The numbers from the calendar floated in my mind, a sequence of possibilities, each one defensible, each one wrong.

  I selected the numbers. I aligned them with the boxes. I pressed the keys.
