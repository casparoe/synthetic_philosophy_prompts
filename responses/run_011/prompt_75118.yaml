prompt: |-
  I'm putting together a session for a philosophy-of-psychiatry seminar and one of my co-panelists, a clinician, keeps reaching for the line "the diagnosis creates the disease." He used it last week to argue that prolonged grief disorder should never have gone into DSM-5-TR, and that the bereavement exclusion for depression should be put back. The anoying thing is that another colleague uses the exact same slogan the other way round: because naming a thing brings it into being, she says, giving grief a diagnosis is a good thing, since it gives bereaved people a way in to care and takes away some of the self-blame. So the slogan is being made to do two incompatible jobs and I want to pin down what it could actually be claiming. Lay out the distinct theses someone might be asserting with it — from whatever is just trivially true of any classification at all, through the causal ones about labels changing the people they get applied to, to the genuinely radical ones — and say for each whether it's a platitude, a live empirical claim that could come out either way, or false. Then tell me which one my clinician needs for his argument against PGD, which one my other colleague is leaning on, and whether the two of them are actually contradicting each other or just talking past one another. I know the looping-effects literature, so please don't just re-run it at me; I want the readings teased apart in terms of what would have to be true for each. And take a position: say which reading you think is right about grief specifically and whether it cuts for or against the diagnosis, with your reasons, rather than handing me a menu and leaving me to choose. Prose only, please — no headings, no bullet points, no bolding, no tables, nothing that looks like a slide deck; just continuous paragraphs I could paste into an email.
