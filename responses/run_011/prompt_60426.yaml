answer: |-
  Here is the straight read: Your intuitions are 90% consistent with a specific school of thought called **Imprecise Probabilism with a Pragmatic Sharpening Rule**, but you have one glaring contradiction (Case 1 vs. Case 6) that no principle can reconcile without reinterpreting one of your verdicts.

  Here is the principle that best fits your data, the trade-offs required to keep it, and the honest assessment of how much work I am doing versus how much you are.

  ### The Principle: Evidential Determinacy with Pragmatic Override

  **Statement:**
  An agent's doxastic state (credence) should be represented by a set of probability functions $\mathcal{P}$ (a range) if and only if the available evidence underdetermines a unique probability function due to structural ambiguity or heterogeneity. However, $\mathcal{P}$ collapses to a single function $P$ (a sharp number) if:
  1.  **Symmetry:** The evidence establishes a symmetry that licenses the Principle of Indifference.
  2.  **Frequency:** The evidence provides a stable long-run frequency.
  3.  **Pragmatic Necessity:** A decision must be made that mathematically requires a point estimate, *provided* this is understood as an action-forcing move, not an epistemic update.

  **The Clauses and Your Cases:**

  *   **Clause 1 (Structural Ambiguity → Range):** When the generating process is unknown or heterogeneous, you cannot license a single number.
      *   *Does work for:* **Case 1** (Marbles: unknown split process), **Case 2** (Doctors: heterogeneous trials), **Case 7** (Communication: range conveys evidence quality), **Founder Case** (Epistemic state is a range).
  *   **Clause 2a (Symmetry → Sharp):** When evidence establishes equipossibility without structural ambiguity, sharpness is licensed.
      *   *Does work for:* **Case 6** (Jury: "equal opportunity" implies symmetry), **Case 5** (Flip 1: Coin has two sides, no info implies symmetry).
  *   **Clause 2b (Frequency → Sharp):** When data converges, the range narrows to a point.
      *   *Does work for:* **Case 4** (Coin: 10,000 flips justifies 0.5 flat).
  *   **Clause 3 (Aggregation → Sharp):** Groups can resolve individual imprecision through averaging mechanisms.
      *   *Does work for:* **Case 3** (Panel: averaging midpoints).
  *   **Clause 4 (Pragmatic Override → Sharp Action):** Belief can remain a range, but action requires a cut-off.
      *   *Does work for:* **Founder Case** (Investors trust the range; Lease requires a number).

  ### The Breakdown: Where the Principle Fails

  **Case 1 vs. Case 6 is the crack in the foundation.**
  Structurally, these are identical.
  *   **Case 1:** 100 marbles. 40 Blue. 60 are Green/Orange split by an unknown process. You bet on Blue (0.4) vs Green (Unknown).
  *   **Case 6:** 100 people. 1 Guilty. 99 Innocent. Selection process is "equal opportunity." You bet on Defendant (0.01) vs Others (Unknown).

  In Case 1, you say **Range** (because the process is unknown). In Case 6, you say **Sharp** (because "equal opportunity").
  *   **The Conflict:** "Equal opportunity" *is* a claim about the process. If you truly know "nothing relevant" about the marble split (Case 1), why do you know "equal opportunity" in the Jury case (Case 6)? If the Jury case is truly "nothing distinguishes them," that is structurally identical to the 60 marbles.
  *   **The Verdict:** To save the principle, we must interpret Case 6 as having *more* evidence than Case 1. Case 6 asserts a symmetry constraint ("equal opportunity"). Case 1 explicitly denies it ("process I know literally nothing about"). If you accept that distinction, the principle holds. If you insist they are epistemically identical, the principle breaks, and you are inconsistent.

  **Case 5 (Two Flips):**
  You want sharp marginals (0.5) despite unknown correlation. Imprecise probability theory actually supports this. You can have a set of priors where $P(H1)=0.5$ and $P(H2)=0.5$ for every function in the set, but the *joint* distribution varies (independence vs. correlation). Your intuition here is mathematically sound, not a bug. The principle handles this under Clause 1 (Symmetry on marginals) + Clause 2 (Ambiguity on dependence).

  ### The New Case: The Black-Box Algorithm

  **Setup:**
  A bank uses an AI to approve loans. The AI outputs a "risk score."
  *   **Scenario A:** The bank tells you, "The AI was trained on 1 million loans. It is wrong 10% of the time, uniformly across all demographics."
  *   **Scenario B:** The bank tells you, "The AI was trained on 1 million loans. Overall it is wrong 10% of the time. However, we don't know if it fails mostly on high-income applicants or mostly on low-income applicants, and we don't know which group *you* are in."

  **Application of Principle:**
  *   **Scenario A:** **Sharp Credence (0.9).** Evidence provides stable frequency and uniformity (Clause 2b).
  *   **Scenario B:** **Imprecise Credence ([0.5, 0.95] or similar).** Evidence is heterogeneous/ambiguous regarding the relevant reference class (Clause 1). Even though the *average* is 10%, your specific risk is underdetermined.
  *   **Decision:** You must still approve or deny the loan (Clause 4). You might deny to be safe, even if your *belief* is a range.

  **Verdict:** This aligns with your Doctor (Case 2) and Founder cases. It tests whether you treat "unknown reference class" (Scenario B) like the Marbles (Case 1) or the Jury (Case 6). If you say Scenario B is sharp because "average is 10%," you side with Case 6. If you say it's a range, you side with Case 1.

  ### Simple vs. Baroque

  **The Simple Principle: "Sharpness Default" (Bayesian Orthodoxy)**
  *   *Rule:* Always pick a single number. If evidence is weak, pick the indifference point. Ranges are just confusion about what number to pick.
  *   *Cost:* Overturns **Case 1** (Marbles) and **Case 2** (Doctors). It says you *are* irrational to prefer Blue over Green in the Ellsberg-style marble case, and the honest doctor *should* just pick 45%.
  *   *Benefit:* Mathematically clean. No need to explain why Jury is sharp but Marbles aren't (both become sharp via indifference).

  **The Baroque Principle: "Imprecise Default with Symmetry Exceptions"**
  *   *Rule:* Ranges are the natural state of ignorance. Sharpness is a special privilege granted only by known chances or proven symmetry.
  *   *Cost:* Requires complex math (sets of probabilities). Requires you to admit **Case 6 (Jury)** is actually a special case of symmetry, not general ignorance.
  *   *Benefit:* Saves **Case 1, 2, 7, and Founder**. It respects the intuition that "making up a number" (Doctor 2) is epistemically vicious.

  **Which I Would Take:**
  I would take the **Baroque Principle**.
  *Why?* Because Case 1 (Ellsberg Paradox) is robust. Most people, upon reflection, refuse to bet on the unknown color even if it violates Savage's axioms. Calling that "irrational" (Simple Principle) feels like throwing away data to save a theory. The Baroque principle respects the distinction between *risk* (known probabilities, Jury/Coin) and *ambiguity* (unknown probabilities, Marbles/Doctor). The cost is accepting that Case 6 relies on a specific symmetry claim ("equal opportunity") that Case 1 lacks.

  ### Meta-Commentary: Reverse-Engineering vs. Discovery

  **How much is reverse-engineering?**
  About 70%.
  I am constructing a principle that *accommodates* your verdicts, not one that *predicts* them independently. Specifically, the distinction between Case 1 (Marbles) and Case 6 (Jury) is the hinge. I am interpreting "equal opportunity" in Case 6 as a strong symmetry claim to save your Sharp verdict, whereas I interpret "process I know nothing about" in Case 1 as a lack of symmetry to save your Range verdict. If you told me, "Actually, Case 6 is also just total ignorance," the principle collapses.

  **Is the framing confused?**
  Partially.
  In **Case 2**, you say: *"Neither would treat you any differently. So the gap between them is real but makes no difference to anything anyone does."*
  This flirts with **Behaviorism**. If the betting dispositions are identical, what work is the "credal state" doing?
  *   *Pushback:* The work is done in **Case 7 (Communication)** and the **Founder Case**. The range communicates *second-order uncertainty* (confidence in the estimate). A sharp number hides the variance of the evidence. So the framing isn't confused, but your dismissal of the difference in Case 2 was too quick. The difference matters for *trust* and *aggregation* (Case 3), even if it doesn't matter for a single binary bet.

  **The Founder Tension:**
  You said: *"I also think she should be made to pick a number... Both feel true and I know they can't both be."*
  *   *Resolution:* They *can* both be true if you distinguish **Doxastic State** (Belief) from **Decision State** (Action).
      *   Belief: Range [0.1, 0.4]. (Honest).
      *   Action: Maximize minimum expected utility (Maximin). You act *as if* the probability is 0.1 to sign the lease.
      *   The "number" she picks for the lease is not her credence; it is her **risk threshold**. Confusing the two is the error.

  ### Final Summary
  You are an **Imprecise Probabilist** who gets nervous when symmetry looks too clean (Jury) or when action forces a hand (Founder).
  *   **Principle:** Evidential Determinacy (Range is default, Sharpness requires Symmetry/Frequency).
  *   **Weak Point:** The Jury vs. Marbles distinction relies on whether "equal opportunity" counts as structural knowledge.
  *   **Advice:** Stop trying to sharpen your beliefs to make decisions easier. Keep the range for the belief, use a decision rule (like Maximin) for the action. That resolves the Founder tension without lying to the investors.
