answer: |-
  **JOINT STATEMENT ON THE SARNAU FAMINE (1841–1843)**

  **I. Agreed Claims**
  1. Ice-core sulfate spikes date a large hemispheric eruption to 1841–42 (±2 years); no local ashfall occurred.
  2. Tree-ring latewood density confirms significant cooling in the Sarnau Valley during the 1842 and 1843 growing seasons.
  3. Cooling mechanically shortened the growing season, reducing potential grain yield per hectare.
  4. Weekly wheat prices in the market town quadrupled between harvest 1842 and spring 1843.
  5. Provincial permits authorized the export of ~40% of the recorded 1842 harvest to coastal markets.
  6. The town granary held three months' subsistence in January 1843, violating the 1798 ordinance requiring eighteen months.
  7. Tithe was enforced in kind in 1842, reversing a decade of cash commutation.
  8. Burial rates in 22 parishes rose to 2.3× the 1830–40 baseline, skewed to under-fives and over-sixties.
  9. Three upland parish registers are missing for 1843; cause of loss is undocumented.
  10. Food riots occurred only in districts where the tithe collector was not the local justice of the peace.
  11. Two neighboring valleys share the 1842–43 tree-ring anomaly but diverge in mortality outcomes.
  12. Existing archival data cannot isolate the exact mortality contribution of climate versus policy without further reconstruction.

  **II. Disagreements Table**

  | Issue | Camp A (Climatology) Wording | Camp B (Social History) Wording | Genuine or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **Primary Driver** | The eruption was a *necessary condition* for the famine magnitude; without cooling, prices would not have spiked. | Institutional failure was a *sufficient condition* for mortality; similar policy failures caused famine in non-eruption years. | Genuine |
  | **Responsibility** | Causal weight is distributed across atmospheric and human systems; assigning blame obscures mechanism. | Moral liability rests exclusively on administrators who enforced exports despite known granary deficits. | Genuine |
  | **Agency** | The capacity of households to adapt consumption and labor patterns within climatic constraints. | The power of elites to define the constraints (laws, permits) within which households must act. | **Verbal** |
  | **Determinism** | Using physical data to predict historical risk probabilities is not determinism but modeling. | Narratives that treat climate as an exogenous shock rather than a context for power are determinist. | Genuine |

  *Note on Verbal Disagreement:* Both sides use "agency," but Camp A refers to *adaptive capacity* (micro), while Camp B refers to *structural power* (macro). They are talking past each other about scale, not concept.

  **III. Cruxes and Experimental Design**

  **Crux 1: The Three-Valley Difference-in-Differences**
  *Question:* Does mortality track cooling intensity or institutional failure when cooling is held constant?
  *Design:* Compare mortality rates across the Sarnau and the two neighboring valleys (80km and 150km out). All share the tree-ring anomaly. Valley 1 (Sarnau) had exports/granary failure. Valley 2 had exports/granary failure. Valley 3 had export bans/communal granaries.
  *Evidence Required:* Reconstructed mortality series for Valley 2 and 3 matching the Sarnau's 22-parish coverage.
  *Predictions:* Camp A predicts mortality correlates with tree-ring deviation severity across all three. Camp B predicts mortality correlates with export/granary status, regardless of ring density variance.
  *Limitations:* If Valley 3's communal granary records are incomplete, the counterfactual fails. If the tree-ring anomaly varies significantly in magnitude between valleys, cooling is not controlled.

  **Crux 2: The Archival Silence**
  *Question:* Are the missing upland registers and silent riot districts evidence of absence or produced silence?
  *Design:* Cross-reference 1843 bishop visitation logs and tax rolls against burial/riot records.
  *Evidence Required:* Visitations noting "register lost" vs. "register withheld"; tax rolls showing population presence despite missing burials.
  *Predictions:* Camp A predicts random loss due to administrative chaos during crisis. Camp B predicts systematic suppression in districts where elites faced highest liability for riots.
  *Limitations:* If visitation logs are also missing for the upland parishes, the test is inconclusive. This crux reveals a deeper epistemic split: Camp A treats gaps as noise; Camp B treats gaps as signal.

  **IV. Joint Glossary**

  1.  **Cause:** A necessary antecedent that increases the probability of an outcome without guaranteeing it.
  2.  **Agency:** The capacity of an entity to effect change within their available structural constraints.
  3.  **Determinism:** Any narrative that denies human contingency in the face of physical constraints.
  4.  **Vulnerability:** The pre-existing social and economic exposure of a population to external shocks.
  5.  **Historical Actor:** An entity with recorded decision-making power over resource distribution.

  **V. Public Statement**

  In 1843, the Sarnau Valley suffered a lethal convergence of atmospheric and institutional failure. Ice core and tree-ring data confirm a volcanic aerosol veil shortened the growing season, reducing grain supply. However, provincial permits authorized the export of 40% of the remaining harvest while local granaries held only three months' subsistence against a legal requirement of eighteen. Mortality spiked among the vulnerable where tithe enforcement was strictest and justice was compromised. We conclude the eruption created the scarcity, but local governance determined who starved. Neither climate nor policy alone explains the death toll; the catastrophe emerged from the interaction of reduced yields and extractive distribution. To prevent future famine, we must monitor both atmospheric risk and the political structures that allocate scarcity. Silence on either factor is scientifically and morally untenable.

  **VI. Honesty Check: Unsignable Frictions**

  I have pulled two claims from Section I that would likely break the signature line. First, Claim 3 ("Cooling mechanically... reducing potential grain yield"). Camp B would refuse this because "potential yield" is theoretical; without harvest ledgers, they cannot concede actual supply dropped versus fear-driven hoarding. Signing it validates Camp A's core model. Second, Claim 6 ("...violating the 1798 ordinance"). Camp A might resist "violating" as it implies intent/negligence rather than administrative error, which shifts focus from systemic capacity to individual blame.

  The Public Paragraph is the most fragile. Camp B will hate "eruption created the scarcity" because it concedes the supply shock was real rather than speculative. Camp A will hate "local governance determined who starved" because it implies the deaths were discretionary rather than inevitable given the cooling. The phrase "interaction of reduced yields and extractive distribution" is the thinnest possible ice they can both stand on. If Camp B insists that "scarcity was manufactured," the paragraph collapses. If Camp A insists that "cooling caused the famine," Camp B walks. This document works only if both agree to treat "cause" as multivariate rather than singular. If either needs a singular villain (the volcano or the governor), this collaboration fails.

  Finally, Crux 1 relies on mortality data for the neighboring valleys that may not exist. If those records are lost, the DiD design is theoretical. Both sides know this. Camp A hopes the data exists to prove the climate signal; Camp B hopes it exists to prove the policy signal. If the data is missing, they will revert to theorizing, and the sniping will resume. The collaboration depends on archival luck as much as intellectual goodwill.
