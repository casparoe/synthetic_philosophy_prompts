prompt: |-
  Second-year philosophy student here, on a module that's basically metaethics with some value theory bolted on. I help run our department's weekly undergrad workshop — about 18 people, mixed years, two of whom aren't even philosophy students — and I've got the 75-minute slot next Tuesday. I want to do something on the wrong kind of reasons problem: the thing where someone offers you a reward for admiring or valuing or being amused by something, and the reward is obviously a reason to want to have the attitude but somehow doesn't count in favour of the attitude itself.

  But I dont want to explain any of that up front. I want the group to walk into it. So design me a workshop where the incentive structure does the philosophical work and people only get the label at the very end.

  What I want built in:

  1. Real stakes. I can genuinely put up about £6 (chocolate, or cash to a couple of people) and I can promise other real things — a cushy task assignment, first pick of the snacks, whatever. Tell me what the reward should be and how big it needs to be for the problem to bite rather than feel like a joke.

  2. A payout-rule problem. If you pay on self-report everyone just says they like it; if you pay on being spotted liking it, it turns into a performance and nobody's attitude is genuine at all. I want them to hit that themselves. Give me the rule you'd actually use.

  3. Two kinds of reward. For some people the incentive should be sterile — it's seperate from whether the thing is any good. For others it should be leaky: the reward is itself evidence the object is worth admiring, because whoever's paying only pays when a panel has rated it highly. Then get the two halves comparing notes. I want them to notice that the reason that looked obviously wrong-kind in one case looks like a perfectly ordinary reason to admire in the other, and argue about whether wrong-kind-ness lives in the source of the reason or in what the reason bears on.

  4. A cultivation round. Now the reward attaches not to having the attitude but to having done things likely to produce it — rereading, steelmanning, dwelling on the good bits. They can do that one easily, for the money. Then ask whether that makes it a reason to admire after all, indirectly.

  5. Swap in belief. Same setup, but the target is now believing something. I suspect they'll find they simply can't, and I want that contrast to make them ask whether the whole problem is really about voluntariness — and whether that's an explanation or just a relocation, since round 4 seemed to show attitudes are cultivable too.

  Constraints: the object of admiration needs careful choosing. Obviously worthless and nobody can do it; obviously great and everybody can; either way the exercise collapses. Tell me what to use and why. No lecture at the start, no name-dropping until the debrief. Give me a minute-by-minute timeline, a materials list, the debrief script mapping each moment onto the distinction, a triage list of what to cut when I overrun (I will), what will predictably go wrong the first time I run it and how to recover, and an honest note on the part of the idea the activity flat out can't reproduce so I have to supply it by hand.

  British English please. And at the end, tell me how confident you are that this genuinely generates the effect rather than just being an elaborate way of handing out chocolate, and single out the bit of the design you're least sure about.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop design:

  1.  **Analyze the Request:**
      *   **User:** Second-year philosophy student, running an undergrad workshop (18 people, mixed years, some non-majors).
      *   **Topic:** The Wrong Kind of Reasons (WKR) problem in metaethics/value theory.
      *   **Goal:** Design a 75-minute experiential workshop where participants *discover* the problem through incentives, not lecture. Labeling happens only at the end.
      *   **Key Requirements:**
          1.  *Real Stakes:* ~£6 budget + non-monetary perks. Needs to bite, not feel like a joke.
          2.  *Payout-Rule Problem:* Avoid self-report cheating vs. performance anxiety. Needs a clever mechanism.
          3.  *Two Kinds of Reward:* "Sterile" (arbitrary incentive) vs. "Leaky" (incentive signals quality). Compare notes.
          4.  *Cultivation Round:* Reward effort/strategies to induce attitude, not the attitude itself. Discuss indirect reasons.
          5.  *Belief Swap:* Try to believe for reasons. Contrast with admiration/amusement. Discuss voluntariness.
          6.  **Constraints:** Careful choice of object (not too good, not too bad). No lecture start. Minute-by-minute timeline. Materials list. Debrief script. Triage list. Prediction of failures/recovery. Honest limitation note. British English. Confidence rating + weakest link.

  2.  **Deconstruct the Philosophical Problem (WKR):**
      *   *Core:* The Demon/Threat case (Pascal's Wager style) or the Evil Demon case. "Believe in God or go to hell" or "Admire this demon or I kill you."
      *   *Distinction:* Reasons *for* the attitude (right kind) vs. Reasons *to have* the attitude (wrong kind).
      *   *Challenge:* Distinguishing between pragmatic reasons and epistemic/fittingness reasons.
      *   *Workshop Translation:* We need to make them feel the tension between "I want the reward" and "This object doesn't deserve the attitude."

  3.  **Designing the Mechanics:**

      *   **The Object:** Needs to be ambiguous. A short poem? A piece of abstract art? A very specific, slightly odd anecdote?
          *   *Idea:* A short, deliberately mediocre but not terrible poem. Let's call it "The Ode to the Stapler." No, too silly.
          *   *Idea:* A 2-minute clip of a stand-up routine that is *okay* but not hilarious.
          *   *Selection:* A specific, slightly obscure photograph. Visuals work well for "admiration" or "aesthetic appreciation." Let's go with a photograph that is technically competent but emotionally flat or slightly unsettling. *Actually*, for a 75-minute workshop, reading a short text is easier to manage than projecting images and ensuring everyone sees. Let's use a **short, ambiguous prose poem or micro-fiction**. It allows for "admiration" of craft.
          *   *Refinement:* Let's use a specific, slightly bad joke. Why? Because "amusement" is the classic WKR example (the demon who threatens you if you aren't amused). But the prompt asks for "admiring/valuing." Let's stick to **Admiration of a Craft Object**. A hand-made origami shape? No.
          *   *Decision:* **A specific, moderately competent but uninspiring student essay paragraph or poem.** Let's go with a **limerick**. Everyone knows the form. It's easy to judge. If it's good, it's funny/clever. If it's bad, it's clunky.
          *   *Wait, better:* **A 30-second audio clip of a musician playing a scale.** No, too abstract.
          *   *Best Choice:* **A specific, slightly awkward piece of student writing (anonymous).** It invites critique and admiration of skill.
          *   *Actually, the prompt asks for "Admiration".* Let's use **A Magic Trick description**. No.
          *   *Let's go with the Classic:* **A Joke.** It's the clearest case of "amusement." But the prompt says "admiring or valuing."
          *   *Okay, let's pick a **Painting**.* Projected. "The Banality" by [Fictional Artist]. It's a picture of a beige wall.
          *   *Wait, stakes need to be real.* If I pay them to admire a beige wall, they know it's a trick.
          *   *Revised Object:* **A Puzzle/Solution.** "Admire the elegance of this solution."
          *   *Final Decision:* **A short, specific argument or proof.** No, too technical for non-majors.
          *   *Okay, let's go with **A Piece of Music**.* 45 seconds of modern classical. Ambiguous quality.
          *   *Actually, simplest is best:* **A specific, mediocre Limerick.** It allows for "amusement" and "admiration of craft."
          *   *Wait, I need to split the group.* Half get sterile reward, half get leaky.
          *   *Let's refine the Object:* **A 1-minute video of a juggling routine.** It's clearly a skill. It can be "good" or "just okay."
          *   *Okay, I will recommend a **specific, moderately impressive but not mind-blowing magic trick video**.* It invites "admiration" of skill.

      *   **The Incentive Structure (The Tricky Bit):**
          *   *Sterile:* "I flip a coin. If heads, everyone who writes 'I admire this' on a slip gets chocolate." (Arbitrary).
          *   *Leaky:* "A panel of 3rd years rated this. If they rated it high, you get chocolate for admiring it." (The reward signals quality).
          *   *Payout Rule:* To avoid lying, use a **random audit**. "I will pick 3 slips at random. If you wrote 'Admire' but I ask you *why* and your reason is purely about the chocolate, you lose. If your reason cites features of the object, you win." This forces them to find features *or* admit they are faking.
          *   *Better Payout:* **The Commitment Mechanism.** They write a short justification. If the justification mentions the reward, they are disqualified. If it mentions the object, they are in the running. This forces them to try to generate "Right Kind" reasons even if motivated by "Wrong Kind" incentives.

      *   **Stakes:** £6 is small for 18 people.
          *   *Strategy:* Prize draw. "One person gets the £6" or "Top 3 get £2."
          *   *Better:* **The Pot.** Put the £6 in an envelope on the table. "This pot grows if you succeed, shrinks if you fail." No, too complex.
          *   *Best:* **Auction/Scarcity.** "There are 5 high-quality chocolate bars. Only 5 people get them." Scarcity creates competition.
          *   *Non-monetary:* "The winners choose the topic for the next workshop." High value for philosophy students.

      *   **Cultivation:** "Spend 5 minutes studying the object. Find 3 good things." Then reward based on the list.
      *   **Belief:** "Believe this coin is weighted." Impossible.

  4.  **Drafting the Plan (Iterative Process):**

      *   *Timeline:* 75 mins.
      *   *Intro (5):* Housekeeping, no philosophy talk.
      *   *Round 1 (15):* Sterile Incentive. Watch object. Write response.
      *   *Round 2 (15):* Leaky Incentive. Same object (or paired). Compare.
      *   *Round 3 (15):* Cultivation. Try to generate reasons.
      *   *Round 4 (15):* Belief Swap.
      *   *Debrief (25):* The reveal.

      *   *Refining the Payout:* The prompt worries about self-report.
      *   *Solution:* **The "Inspector" Mechanism.** I (the facilitator) act as the demon. I have a list of "Valid Reasons" (features of the object). If their reason matches, they get paid. If they say "Because I want money," they don't.
      *   *Wait, that teaches them the answer.*
      *   *Better:* **Peer Review.** They swap papers. "Does this sound like genuine admiration?"
      *   *Best:* **The "Bet".** "Put your name down if you admire it. I will interview 3 of you. If I think you're lying, nobody gets paid." This creates a **public good problem**. Everyone wants the money, but if too many lie, the pot breaks. This makes the *motivation* palpable.

      *   *Refining the Object:* It needs to be *just* good enough to be admirable, but *just* bad enough that the money is the main driver.
      *   *Selection:* **A specific, 45-second clip of a street performer.** (I will provide a link in the plan). Let's say, a cup stacking routine. Fast, impressive, but ultimately trivial.

      *   *Refining the "Leaky" vs "Sterile":*
          *   Group A: "If you admire this, you get entered into a draw for £5." (Sterile).
          *   Group B: "Experts rated this 9/10. If you agree with the experts (admire it), you get entered." (Leaky - implies it *is* good).

  5.  **Addressing Specific Constraints:**
      *   *British English:* "Cheque" (no, cash), "Programme" (no, workshop), "Realise", "Centre".
      *   *Triage:* What to cut if time runs out? Belief round is the first cut.
      *   *Failure Mode:* Everyone laughs and treats it as a game. *Recovery:* Serious tone, real money on the table.
      *   *Limitation:* The workshop can't solve the *reductionist* debate (whether WKR can be reduced to RKR). It only generates the intuition.

  6.  **Developing the Debrief Script:**
      *   Map Round 1 to "The Demon Case."
      *   Map Round 2 to "Testimony/Evidence."
      *   Map Round 3 to "Indirect Strategies."
      *   Map Round 4 to "Doxastic Voluntarism."

  7.  **Final Polish:**
      *   Check the budget. £6 is tight. Suggest adding "First pick of snacks" as a high-value low-cost perk.
      *   Ensure the "Payout Rule" is robust. The "Public Good/Threat" mechanism is best. "If I catch a liar, the pot is destroyed." This makes them police themselves and feel the tension of *trying* to have the attitude to save the pot.

      *(Self-Correction during drafting)*: The "Public Good" might be too game-theoretic and distract from the phenomenology of the attitude.
      *Alternative:* **The "Interview" Lottery.** "I will pick 3 people at random. If you said you admire it, I will ask you 'What did you like?'. If you stumble or mention the money, you get nothing. If you speak fluently about the object, you get the prize."
      *Why this works:* It forces them to *cultivate* reasons (Round 3 logic) in Round 1. It highlights the difficulty of faking the *reasons* even if you claim the *attitude*.

      *Let's go with the Interview Lottery.* It's simpler to administer.

      *Object Choice:* I need to be specific. A **concrete poem** or a **short paradox**. Let's go with a **short, clever but slightly pretentious aphorism**.
      *Actually, the prompt asks for "Admiration".* A **Magic Trick** is best. It's skill-based.
      *Let's specify:* "The Cup and Ball Trick" (video).

      *Wait, one more thing:* The prompt asks for "Two kinds of reward... sterile vs leaky." I need to split the room.
      *Logistics:* Hand out different coloured slips. Blue = Sterile. Red = Leaky.

      *Confidence:* High on generating the intuition. Low on the "Belief" round working perfectly (some people *can* bias beliefs). I need to flag this.

      *Weakest Link:* The "Leaky" condition. If the "expert rating" isn't believable, it fails. I need to make the authority credible.

      *Let's write it.*

      *(Final check on British English)*: "Realise", "Programme" (avoid), "Centre", "Cheque" (avoid, use cash), "Maths" (avoid, use logic/reasoning). "Whilst", "Amongst".

      *(Final check on Stakes)*: £6 cash + "Next workshop topic choice".

      *(Final check on Payout)*: The "Interview Lottery" is the most robust way to handle the self-report issue without turning it into pure acting.

      *(Final check on Cultivation)*: Make sure they have time to *look* for features.

      *(Final check on Belief)*: Use a trivial empirical claim. "This pen is heavier than it looks."

      *Okay, ready to draft.*
answer: |-
  Here is a complete workshop design. It is built to be run with minimal prep but high fidelity to the philosophical tension.

  ### Workshop Title: The Incentive Game
  **Time:** 75 Minutes
  **Participants:** 18 (Mixed levels)
  **Facilitator:** You
  **Budget:** £6.00 cash (in mixed coins/notes for tangibility) + 1 high-end chocolate bar + "The Golden Ticket" (privilege).

  ---

  ### 1. The Object
  You need something that is **competent but not breathtaking**. If it's trash, they can't admire it even for money. If it's a masterpiece, they admire it for free, and the money becomes irrelevant.

  **The Object:** A 45-second video clip of a **cardistry flourish** (card shuffling/manipulation).
  *   **Why:** It is clearly a skill (invites admiration). It is visually clear. It is ultimately trivial (nobody *needs* to admire it).
  *   **Specific Recommendation:** Search YouTube for "Cardistry Cut - Intermediate". Avoid world-champion level, avoid beginner fumbles. Something smooth but short.
  *   **Backup:** A 12-line poem that rhymes perfectly but says something slightly banal.

  ### 2. The Stakes
  £6 split among 18 people is 33p each. That is an insult. You need **scarcity** and **status**.

  *   **The Pot:** Put the £6 notes/coins in a clear envelope on the table.
  *   **The Prize:** "At the end, I will draw **three names** from the pool of 'successful' participants. Each gets £2."
  *   **The Golden Ticket:** "One winner also gets **first choice of snacks** at the next workshop AND **veto power over the next topic**."
  *   **Why this works:** The cash is real, but the *status* (veto power) is high-value for a department workshop. The lottery structure means everyone *could* win, but not everyone *will*, creating tension without guaranteeing payout.

  ### 3. The Payout Rule (The "Audit")
  To solve the self-report vs. performance problem, use the **Reasons Audit**.

  *   **The Rule:** "To qualify for the draw, you must submit a slip saying whether you admire the object. If you say 'Yes', I will interview **three people at random**. I will ask: *'What specifically did you admire?'*"
  *   **The Catch:** "If your answer references the money, the prize, or the task, **the entire pot is destroyed** and nobody gets paid. If your answer references features of the object, you stay in the draw."
  *   **Why this works:** It aligns their incentive (money) with the need to generate *object-focused* reasons. It forces them to try to find genuine features, highlighting the difficulty when the incentive is the only real driver.

  ---

  ### 4. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Hand out coloured slips (Blue/Red). Put cash envelope on table. Explain the **Audit Rule**. No philosophy terms. |
  | **05-20** | **Round 1: Sterile** | **Blue Slips.** Show video. Incentive: "If you admire this, you enter the draw." (Arbitrary). Submit slips. |
  | **20-35** | **Round 2: Leaky** | **Red Slips.** Show video *again* (or a very similar one). Incentive: "Expert judges rated this 9/10. If you agree with experts (admire it), you enter the draw." Submit slips. |
  | **35-50** | **Round 3: Cultivation** | **All Slips.** "You have 5 minutes to study the video. Write down 3 specific technical features that are good. If you list 3, you are automatically entered." |
  | **50-60** | **Round 4: Belief** | **Verbal.** "I claim this pen is heavier than it looks. £2 to anyone who genuinely *believes* this right now." Discuss impossibility. |
  | **60-75** | **Debrief** | Reveal the philosophy. Map the rounds to WKR, RKR, and Voluntarism. Pay out (if honest answers found). |

  ---

  ### 5. Materials List
  1.  **Projector/Laptop:** For the video.
  2.  **Slips of Paper:** Two colours (Blue and Red), approx 20 of each.
  3.  **Pens:** For everyone.
  4.  **The Pot:** Envelope with £6 cash.
  5.  **The Chocolate:** One nice bar (e.g., Hotel Chocolat).
  6.  **A Pen:** For the Belief round.

  ---

  ### 6. The Debrief Script (The Reveal)
  *Do not sit down. Stand by the cash envelope.*

  **The Hook (5 mins):**
  "Right. Hands up, who felt slightly dirty writing down reasons for the video in Round 1? Who found it easier in Round 2? Keep your hands up if, in Round 4, you found you literally *could not* believe the pen was heavy, no matter how much I offered."

  **Mapping Round 1 & 2 (The Wrong Kind):**
  "In Round 1, the money was a reason *to want* to admire the video. But was it a reason *that the video was admirable*? No. In philosophy, we call this the **Wrong Kind of Reason (WKR)**. It's a pragmatic reason, not a fittingness reason.
  "In Round 2, the 'Expert Rating' changed things. That wasn't just a bribe; it was **evidence**. If experts like it, maybe it *is* good. That's a **Right Kind of Reason (RKR)**. The money was the same, but the *source* of the incentive carried information about the object's quality."

  **Mapping Round 3 (Cultivation):**
  "Round 3 was the escape hatch. You couldn't just 'admire' on command. But you *could* look for features. This suggests we don't have direct control over attitudes, but we have **indirect control**. We can cultivate the grounds for the attitude. Does that make the money a reason to admire? Indirectly, yes. Directly, no."

  **Mapping Round 4 (Voluntarism):**
  "Round 4 broke the game. You can't believe at will. This is **Doxastic Involuntarism**. But wait—Round 3 showed you *could* cultivate admiration. So is admiration voluntary? The debate is whether the WKR problem is just about **control**, or whether it's about the **nature of the attitude** itself. Belief aims at truth; admiration aims at value. You can't bribe truth, but can you bribe value?"

  **Closing:**
  "This is the **Wrong Kind of Reasons Problem**. It asks: What makes a reason count in favour of an attitude, rather than just in favour of having it? The cash is in the envelope. If I interviewed three of you and you gave me object-focused reasons, the money is yours. If one of you told me you did it for the cash, I'm keeping it for the pub."
  *(Note: Usually, in Round 3, they will succeed. Pay them. It builds trust for next time.)*

  ---

  ### 7. Triage List (If you overrun)
  1.  **Cut Round 2 (Leaky):** If you're running late, merge Round 1 and 2. Just ask half the room to imagine the experts rated it high. It loses some punch but saves 10 minutes.
  2.  **Cut the Interview:** If time is tight, don't interview in real-time. Collect slips, say you'll check them later, and move to debrief. (Risk: feels less real).
  3.  **Cut Round 4 (Belief):** This is the most expendable. It's a nice contrast, but the core WKR problem is about value/admiration. If you must cut, cut this and spend more time on the Round 2 vs Round 1 comparison.

  ---

  ### 8. Predicted Failures & Recovery

  **Failure 1: The Cynics.**
  *   *Problem:* Someone says, "This is obviously a trick. I'm not playing."
  *   *Recovery:* "You're absolutely right. It is a trick. But the cash is real. Put the envelope in your pocket if you win. Does that change your ability to admire the video?" (Lean into the meta-game).

  **Failure 2: The Actors.**
  *   *Problem:* In the Interview, a student gives a brilliant, fabricated analysis just to win the money.
  *   *Recovery:* This is actually a **win** for the workshop. In the debrief, highlight this: "They gave the Right Kind of reason, but for the Wrong Kind of motivation. Does the reason count if the motivation is corrupt?" (This opens the *Guise of the Good* debate).

  **Failure 3: The Object is Too Good.**
  *   *Problem:* Everyone genuinely admires the video without money.
  *   *Recovery:* "Okay, so the Right Kind of reasons were already there. The money was redundant. Imagine the video was boring. Could the money have created admiration then?"

  **Failure 4: The Object is Too Bad.**
  *   *Problem:* Everyone refuses to admire it, even for money.
  *   *Recovery:* "Perfect. This shows the **boundary** of the attitude. There is a limit to how much pragmatic reason can override fittingness."

  ---

  ### 9. Honest Limitation Note
  **What this activity cannot do:**
  This workshop generates the *intuition* of the distinction, but it cannot resolve the **Reductionist Debate**.
  *   *The Issue:* Some philosophers (Reductionists) argue there is no fundamental difference between Right and Wrong kinds of reasons; they just differ in complexity or relation to the object.
  *   *The Gap:* The workshop makes WKR feel obvious. It does not equip students to defend that intuition against a sophisticated reductionist argument (e.g., that the 'wrong' reason is just a right reason for a *different* attitude, like 'wanting to admire').
  *   *Your Job:* In the debrief, you must explicitly state: "Today we felt the distinction. Next week's reading is about whether that feeling is an illusion." You have to supply the counter-argument by hand.

  ---

  ### 10. Confidence & Weakest Link

  **Confidence Rating: 85%**
  This design genuinely generates the effect. The "Audit Rule" is the critical engine; by threatening the pot if they cite the money, you force them to scan their own minds for object-features, fail to find enough, and feel the friction of the WKR problem viscerally. The cash makes it stakes-based, not just hypothetical.

  **The Weakest Link: Round 2 (The Leaky Incentive)**
  This relies on the students believing that "Expert Rating" is evidence of quality. If the group is naturally contrarian or anti-authority ("Experts don't know art"), the leaky incentive won't function as a Right Kind of Reason proxy.
  *   *Mitigation:* Frame the experts not as "Art Critics" but as "Professional Cardists". Competence is harder to deny than aesthetic value. If you sense resistance, pivot the debrief to discuss *testimony* as a source of reasons rather than quality signals.

  **Final British Note:**
  Ensure you pronounce "schedule" as *shed-ule*, keep the cash in an envelope (don't wave it around like a prop), and if the interview goes well, buy the winners a pint next time. It's good departmental politics. Good luck.
