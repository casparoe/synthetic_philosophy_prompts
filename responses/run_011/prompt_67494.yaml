answer: |-
  **Planning Section**

  *   **Analogy Holds:** All three domains involve a prior agent restricting a future agent to mitigate predicted irrationality or weakness of will. All rely on third-party enforcement (judges, clinicians, financial institutions) to maintain the bond against future resistance.
  *   **Analogy Breaks:**
      *   *Law:* Constitutions contain built-in release valves (amendments) that legitimize the break, unlike the mast.
      *   *Psych:* Enforcement often overrides the prior written will based on present capacity assessments, making the "bond" porous and medically contingent.
      *   *Econ:* Devices rely on institutional stability; if the bank fails or the contract is renegotiated, the bond vanishes externally.
  *   **Concession Point:** Psychiatry. The speech must openly concede that when a clinician overrides a psychiatric advance directive, it may not be protection, but coercion. We cannot assume the past self always knows best, especially when the present self is frightened rather than manic.
  *   **Structure:** Intro (Myth correction) → Core Question → Domain Applications (with failures) → Objections (Democratic/Clinical/Epistemic) → Room Tension → Closing Question.

  ***

  **Opening Remarks**

  Good morning.

  Welcome to the medical school.

  It is a brave choice of venue for a group containing so many lawyers.

  Usually, we prefer rooms with fewer exits and more bookshelves.

  Here, the smell of antiseptic reminds us that theory has consequences.

  You have seen the painting on the easel.

  It is the Victorian Ulysses.

  He looks heroic.

  He looks resolved.

  Please do not look at it again.

  It is wrong.

  It shows the hero bound to the mast.

  It does not show the orders he gave beforehand.

  He did not just ask to be tied up.

  He told his crew that if he begged to be released, they were to bind him tighter.

  He also put wax in their ears.

  He bound the enforcers, so they could not be talked out of enforcing.

  That is the mechanism we are here to examine.

  It is not merely precommitment.

  It is second-order precommitment.

  It is the attempt to make your future pleas irrelevant.

  This raises a question that should haunt us for the next two days.

  Who has the standing to release the bond?

  What makes the judgment of the releaser better than the judgment of the binder?

  We have three domains in this room.

  Each tries to answer this differently.

  Each fails differently.

  Start with the law.

  Constitutions are the ultimate mast.

  They are designed to survive the passions of the moment.

  But they contain a key that the mast does not.

  They have amendment procedures.

  A supermajority can cut the ropes.

  This is a release procedure built into the bond itself.

  Yet, even this faces a democratic objection.

  There is an old idea that each generation should write its own laws.

  The dead should not bind the living.

  Nineteen years is roughly the life of a generation.

  After that, the constitution should expire.

  If we bind ourselves too tightly, we govern the unborn without their consent.

  We risk becoming the crew with wax in their ears, ignoring the pleas of the present.

  Now move to psychiatry.

  Here, the binding is personal.

  A patient writes a directive while competent.

  She authorizes treatment she expects to refuse later during an episode.

  This is the Ulysses contract in flesh.

  But the analogy breaks here.

  In law, the amendment process is clear.

  In medicine, the override is often clinical.

  A clinician can judge that the present self lacks capacity.

  The directive is frequently overridden by that judgment.

  It is often less enforceable than the author hoped.

  I know the lawyers in the room hear coercion in that sentence.

  You hear the state imposing its will on a vulnerable person.

  I want to defend the clinicians for a moment.

  You are not simply enforcing text.

  You are managing fear.

  When a patient is psychotic, the plea for release is not always authentic.

  Sometimes it is the illness speaking.

  To ignore the directive is to treat the disease.

  But we must concede the break in the analogy.

  Sometimes the present self is lucid and frightened.

  Sometimes the past self was too optimistic about what they could endure.

  If we assume the binder is always right, we commit violence against the bound.

  We cannot paper over this.

  In psychiatry, the releaser might be the one who is actually free.

  Then there are the economists.

  You design commitment savings products.

  Lockboxes.

  Harvest-timing agreements.

  These are ropes for money.

  They prevent the future self from spending what the past self wanted to save.

  But your problem is contingency.

  A commitment device only works if the shape of future temptation is predictable.

  The worst cases in all our domains are cases of unforeseen emergency.

  A constitutional drafter cannot provision against every crisis.

  A patient cannot predict every side effect.

  A farmer cannot predict every drought.

  If the institution fails, or the contract is renegotiated by a phone call, the bond dissolves.

  The mast rots.

  So we have three failures.

  Law risks binding the unborn.

  Psychiatry risks coercing the lucid.

  Economics risks breaking under contingency.

  This brings me to the tension in this room.

  I know how this workshop could go wrong.

  The judges here may think the psychiatrists are describing coercion with a clinical vocabulary.

  You worry that capacity is just a word used to win an argument.

  The clinicians may think the lawyers are describing people as if they were texts.

  You worry that rights are abstracted from the suffering body.

  Both annoyances are valid.

  Both are necessary.

  We need the lawyers to insist on procedure.

  We need the clinicians to insist on reality.

  If we leave here agreeing too easily, we have failed.

  Two days is a long time to stay tied to a chair.

  We will need to stretch.

  I offer no thesis today.

  I offer no solution.

  The literature on precommitment is vast.

  It is also often too clean.

  It assumes the binder is rational.

  It assumes the future is knowable.

  It assumes the enforcer is neutral.

  We know none of this is true.

  We are here because the easy answers have run out.

  We are here because the hard cases are piling up.

  A patient demands release from a contract she signed.

  A generation demands release from a constitution it inherited.

  A saver demands release from a lockbox because the children are hungry.

  In each case, someone must hold the knife.

  In each case, someone must decide if the bond holds.

  We spend much time discussing how to tie the knot.

  We spend little time discussing who holds the scissors.

  Is the authority to release the bond derived from the past consent of the binder?

  Or is it derived from the present welfare of the bound?

  If the past self and the present self disagree, which one owns the life they share?

  Who decides when the bond breaks?
