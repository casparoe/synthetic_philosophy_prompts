  If you concede that use is required, haven't you accepted that the ontology is tied to the system's functional goals rather than the mere presence of the structure, which looks suspiciously like the instrumentalist stance you reject?

  **Question 6**
  When two independently trained networks solve the same task with substantially different internal geometries—the spatial relationships between activation vectors—do they represent the same things, and what exactly has to be preserved—causal role, geometric position, or behavioral dispositions—for representational content to be shared?

  **Follow-up**
  If you say only causal role matters, doesn't that reduce the representation to its input-output disposition, effectively collapsing your structural realism into the functionalist instrumentalism you argue against?

  **Question 7**
  Explicitly comparing your position to familiar scientific realism debates, does your view resemble genes as difference-makers—entities defined by their causal effects—natural kinds like species, or something more abstract like the wavefunction, and where does that analogy give out?

  **Follow-up**
  If you choose genes, note that genes exist independently of our sequencing technology, whereas your features often vanish if the decomposition method changes; how do you reconcile this dependence on the measurement apparatus with standard scientific realism?

  **Question 8**
  How do you distinguish a model's self-report about its own processing from a trained disposition—a learned tendency to output specific text—without relying on the very interpretability methods whose reliability is currently in question?

  **Follow-up**
  If your answer relies on the consistency between reports and features, aren't you caught in a coherence circle where neither side is grounded independently enough to validate the other?

  **Question 9**
  Closing with falsifiability, describe the concrete experimental result that would move you to say the feature talk was bookkeeping after all.

  **Follow-up**
  If that result occurred, would you conclude that the features never existed, or merely that they are fragile, and does that distinction matter for the claim that they are mind-independent entities?
