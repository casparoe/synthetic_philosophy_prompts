answer: |-
  Here is a battle plan for fifty minutes with twenty CogSci majors who speak Python better than they speak Kant.

  ### 1. The Dependency Structure
  You cannot start with the Chinese Room. If you start with Searle's conclusion, CS students will treat it as a systems architecture problem ("Just add more lookup tables") and miss the metaphysical claim. You must build the spectrum of "aboutness" from the bottom up.

  1.  **Natural Information (Causal Correlation):** Establish that physical states can carry information about other states without any mind involved (e.g., smoke carries info about fire).
      *   *Why here first:* If you don't secure agreement that non-mental physical correlation is real and respectable, they will view "derived intentionality" as magical, and the whole spectrum collapses into dualism immediately.
  2.  **Derived Intentionality (Artifacts):** Introduce human-made representations (maps, code, words) that get their "aboutness" from us.
      *   *Why here second:* You need a clear contrast class. They must agree that *this* sentence has meaning only because we assign it, before they can judge whether a brain state is different.
  3.  **Original Intentionality (Searle's Claim):** Posit that mental states have "aboutness" intrinsically, not borrowed from a designer.
      *   *Why here third:* This is the target concept. It only makes sense as a contrast to the previous two categories. If introduced earlier, it sounds like a special plea for human exceptionalism.
  4.  **The Collapse (Dennett's Move):** Argue that the line between 2 and 3 is illusory; all intentionality is derived from the stance we take toward the system.
      *   *Why here last:* This is the critique. It requires the distinction to be fully articulated before it can be dismantled.

  ### 2. The Carrying Example
  **Use: The Mercury Barometer.**

  **The Case:** A column of mercury rises in a tube because atmospheric pressure pushes on a reservoir. The height of the column correlates perfectly with the pressure.

  **Why this one:**
  *   **It is not code:** Unlike the two-bitser, there is no logic gate to debug. They can't argue about the implementation details of the "computation."
  *   **It is not alive:** Unlike the frog's bug-detector, it avoids the temptation to say "but biology is *for* something." It is dead physics.
  *   **It is continuous:** It mirrors the analog nature of many neural processes better than a binary switch.

  **What it must NOT have:**
  *   **Do not call it a "measurement" initially.** If you say "it measures pressure," you have smuggled in a measurer (a mind). Describe it only as "a physical state covarying with another physical state."
  *   **Do not put it in a weather station.** Keep it isolated. If it's part of a system that *does* something (like trigger a storm alarm), they will attribute intentionality to the *function*, not the state.

  **Pedagogical Move:** Ask them: "Does the mercury *mean* the pressure, or does it just *move*?" Get them to agree that without an interpreter, it's just physics. This secures the "Natural Information" baseline without granting it semantics yet.

  ### 3. The Misconception Map
  Here is where the traps are sprung, and exactly when to disarm them.

  *   **Trap 1: "Shannon information isn't aboutness."**
      *   *When:* **Minute 5**, immediately after the Barometer example.
      *   *The Move:* A CS student *will* say this. **Concede it immediately.**
      *   *Script:* "You are absolutely right. Shannon information is about correlation and uncertainty reduction, not semantics. A high-entropy signal isn't 'about' anything. We are using 'information' here in the Dretskean sense of natural covariance, not the mathematical sense. Don't conflate the two."
      *   *Why:* If you deflect this, you lose credibility. Validating their technical knowledge buys you capital for the philosophical distinction later.

  *   **Trap 2: "Derived means fake/second-rate."**
      *   *When:* **Minute 15**, when defining Derived Intentionality.
      *   *The Move:* Clarify that "derived" is not "disposable."
      *   *Script:* "Derived intentionality is still real intentionality. This map is *about* Boston. If you follow it, you get to Boston. The question isn't whether it works, but *where* the aboutness comes from. Does it come from the paper, or from us?"

  *   **Trap 3: "Everything is intentional if you take the stance."**
      *   *When:* **Minute 35**, when introducing Dennett.
      *   *The Move:* Distinguish between *useful prediction* and *ontological reality*.
      *   *Script:* "Dennett isn't saying we can just pretend. He's saying that 'original intentionality' is a myth we tell to simplify complex systems. If the predictive power is identical, the distinction is empty."

  *   **Trap 4: "Dennett is an eliminativist/behaviorist."**
      *   *When:* **Minute 40**, during the Q&A or synthesis.
      *   *The Move:* Clarify that Dennett keeps beliefs, he just redefines their substrate.
      *   *Script:* "Dennett isn't saying beliefs don't exist. He's saying they exist like centers of gravity: real patterns, but not little things inside the head. He's a realist about the pattern, not the substrate."

  ### 4. What to Leave Out (And How to Say It)
  You must cut the dead weight. If you don't, the CS students will grab onto the hardware questions and ignore the content questions.

  *   **Cut:** Qualia/Consciousness (Searle conflates intentionality with consciousness; don't let him drag you there).
  *   **Cut:** Multiple Realizability (Irrelevant to the *source* of meaning).
  *   **Cut:** The Homunculus Argument (It leads to infinite regress, which is a logic puzzle, not a semantics puzzle).

  **The Script:**
  "If you ask about what it *feels like* to have a thought, or whether a silicon chip can run a mind, we are leaving that for another week. Today is strictly about **content**: what makes a state *about* something else? We are bracketing consciousness and hardware to focus on the source of the meaning."

  ### 5. The LLM Parking Move
  They will ask about Chatbots in the first ten minutes. Do not engage. It consumes the whole hour.

  **The Parking Move:**
  "That is the perfect test case for this debate, and we are going to use it to grade our conclusion. I'm writing 'LLMs' on the far right of the whiteboard. We will not touch it until we have defined the terms. If we do this right, you'll have the vocabulary to answer that question yourself at minute 49."

  **The Two-Sentence Take (for Minute 49):**
  *   **Searle:** "The LLM manipulates syntax without semantics; it simulates understanding but has no intrinsic intentionality, only the derived intentionality of its trainers."
  *   **Dennett:** "If the LLM functions indistinguishably from a mind in the linguistic environment, the intentionality is real; the 'intrinsic' requirement is a biological prejudice."

  ### 6. The Closing Question
  Do not ask them to define the terms. Give them a novel case where the classification reveals their philosophical commitment.

  **The Case: The Buried QR Code.**
  "Imagine I print a QR code that links to a specific URL. I bury it in a sealed vault underground for a thousand years. No humans exist to scan it. The physical pattern remains.
  **Question:** Does that pattern *refer* to the URL while it is in the vault? Is it *about* the website?"

  **How to read the room:**
  *   **The Searle Student:** "No. Without a mind to interpret it, it's just ink on paper. The aboutness was derived from the creator, and without a user, it's dormant or gone." (Meaning requires a subject).
  *   **The Dennett Student:** "Yes. The disposition is there. If a mind *were* to appear, it would yield that URL. The potential for interpretation is sufficient for intentionality." (Meaning is dispositional/structural).
  *   **The "Line is Blurry" Student:** "It depends on whether the *causal history* of the ink counts as a kind of standing intention."

  **Why this works:** It removes the "behavior" (no one is using it) and the "biology" (it's paper), isolating the structural vs. interpretive debate. It forces them to decide if intentionality is a relation (needs two terms) or a property (inheres in the object).
