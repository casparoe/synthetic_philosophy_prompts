  I stand here because I signed the authorization that brought that tractor into our yard. The review says the machine worked correctly. The report says vendors met every standard. The investigation says I followed every procedure. I will not tell you this means no one bears the weight of this death. I will not offer you the comfort of a closed file. I will not tell you this was nobody's fault.

  The tractor struck him. A maintenance crew disabled the interlock. I put the system online. We built the schedule that put him in the path. I own my place in this chain. I do not shift this burden to a missing worker. I do not hide behind a vendor's specification. I do not let a procedure shield me from you.

  His wife and daughters need a partner. I will ensure his children finish school. I will secure their financial future. I will sit with his wife every month. I will testify before any board that asks me what I signed. I will rewrite the yard rules so no other man dies this way.

  The union wants a culprit. The lawyers want a verdict. I offer you neither. I offer you my presence. I carry this weight because I hold the authority. I do not claim innocence while you mourn. I do not claim guilt while the lawyers watch. I claim responsibility.

  Was it fault? I leave that question open. I refuse to close it. I only know I hold the pen. I only know I hold the power to fix what broke. Somebody died. Somebody must answer. I answer.

  You trusted me to run this terminal. I will spend my career earning it back. I will look his daughters in the eye until they tell me to stop. I will not hide. I will not quit.

  This is not closure. This is a promise. I stand here. I accept the burden. I will do the work.
