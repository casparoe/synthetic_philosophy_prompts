answer: |-
  You have identified a genuine and pervasive maneuver in comparative historical sociology, and you are right to feel that existing terminology only partially captures it. You are describing a move that is simultaneously **methodologically necessary** (to make the question answerable) and **rhetorically deceptive** (to claim the answer resolves the original intuition).

  There is no single, canonical term for this specific rhetorical phenomenon in the philosophy of history or social science methodology. However, it is the intersection of two established concepts: **Contrast Class Substitution** (from the philosophy of science) and **Operationalization Drift** (from social science methodology).

  Here is the breakdown of why existing terms fail, a proposed coinage, and the boundary cases you requested.

  ### 1. Why existing concepts miss the mark

  *   **Changing the Contrast Class (Van Fraassen):** Bas van Fraassen's theory of why-questions (*The Scientific Image*) argues that every why-question presupposes a contrast class (e.g., "Why P *rather than Q*?"). Changing Q changes the question.
      *   *Why it fails:* This is a structural description, not a critique. It tells you *that* the question changed, but it doesn't capture the *motivation* (tractability) or the *rhetorical sleight* (claiming the new answer solves the old problem). It treats all swaps as equal, whereas you correctly note some are "repairs" and others are "dodges."
  *   **Operationalization:** In social science, this is the translation of a theoretical construct ("Industrial Revolution") into a measurable variable ("Coal consumption per capita").
      *   *Why it fails:* Operationalization assumes fidelity. It presumes the measure *represents* the construct. Your observation is about when the measure *displaces* the construct but borrows its authority.
  *   **Unit of Analysis Problem:** As you noted, this is usually a complaint about ecological fallacies (inferring individual behavior from group data).
      *   *Why it fails:* It doesn't capture the *temporal* or *spatial* reframing (1800 vs. 1500, Europe vs. East Asia) that characterizes the Divergence debate.

  ### 2. The Coinage: "The Tractability Substitution"

  I propose calling this **The Tractability Substitution**.

  **Definition:** A rhetorical and methodological move in which an intractable explanatory question (A rather than B) is replaced by a methodologically cleaner surrogate question (A* rather than B*), where the surrogate is solved and the solution is implicitly or explicitly mapped back onto the original question, despite a loss of fidelity in the comparison class.

  **Why this label?** It captures the *virtue* (tractability/methodological rigor) which makes the move seductive and often necessary, while labeling it a *substitution* to highlight that the original question remains technically unanswered.

  ### 3. Boundary Cases

  You asked for specific carving on the edges of this concept. Here is how **The Tractability Substitution** applies:

  *   **Does it cover a swap that narrows the question until it's trivially answerable?**
      *   **Yes.** This is the degenerate case of the Tractability Substitution. If you ask "Why Britain?" and the answer is "Because Britain had more coal than the specific plot of land we are comparing it to," and that plot was chosen *because* it had no coal, the swap was driven entirely by tractability at the expense of relevance. This is "cherry-picking the contrast class."
  *   **Does it cover swapping "A rather than B" for "A rather than A-minus-one-cause"?**
      *   **No.** This is **Counterfactual Analysis** or **Causal Isolation**. If you ask "Why Britain?" and the answer is "Because Britain had coal, whereas a hypothetical Britain without coal did not industrialize," you have not changed the *foil* (the comparison unit); you have manipulated the *variables* within the unit. The Tractability Substitution requires a change in the *units* of comparison (e.g., Nation vs. Region, or 1800 vs. 1500).
  *   **Is it the same thing as building a strawman of a question instead of a person?**
      *   **No, but they are cousins.** A strawman distorts the question to make it *easier to defeat*. The Tractability Substitution distorts the question to make it *easier to solve*. The intent is opposite (destruction vs. construction), but the mechanism (substituting a weaker version) is identical. You might call the strawman equivalent "The Vulnerability Substitution."
  *   **Does it stop being this phenomenon when the author explicitly flags the swap?**
      *   **Yes.** If the author says, "The question 'Britain vs. China' is unanswerable due to data; we will instead answer 'England vs. Yangzi'," they are engaging in **Reframing** or **Problem Reformulation**. The "Substitution" becomes a "Translation." The deceptive element (and thus the specific rhetorical move you identified) vanishes when the loss of fidelity is acknowledged. It becomes an honest methodological limitation rather than a sleight of hand.

  ### 4. Confidence and Weakest Claim

  **Confidence:** **85%**.
  I am highly confident that there is no single, canonical term in the philosophy of history or social science methodology that specifically names this *rhetorical* maneuver (as opposed to the logical structure). The phenomenon is widely discussed (e.g., in critiques of Pomeranz, or in debates about "Big History" vs. specific case studies), but it is usually described via phrases like "shifting the goalposts," "changing the unit of analysis," or "question-begging reformulation," none of which capture the *methodological virtue* you correctly identified.

  **The Claim I Would Bet Least On:**
  I am least certain that the term **"Explanandum Drift"** is not already in niche use within the philosophy of science. While "Concept Drift" is common in machine learning and "Explanandum" is standard in philosophy, the specific combination might exist in a paper I haven't indexed. However, even if that specific phrase exists, it lacks the connotation of *tractability-driven motivation* that "The Tractability Substitution" provides.

  ### Summary
  You have spotted the engine room of the Great Divergence debate. The move is legitimate when the original contrast class is genuinely category-error ridden (Britain vs. China as "Civilization"). It is illegitimate when the swap is driven solely by data availability but claims to explain the original intuition. **The Tractability Substitution** names the move without presuming it is a fallacy, allowing you to evaluate the *cost* of the swap against the *gain* in rigor.
