prompt: |-
  So I'm about four months into a novel whose whole plot hangs on a teleportation-style continuity company — call it Meridian — and two of my beta readers have been fighting about the underlying philosophy for the better part of a year, to the point where they've stopped answering each other and just do parallel monologues at me. One is a straight-up Parfitian: he thinks identity over time is nothing over and above psychological connectedness and continuity with the right kind of cause, that there's no further fact about which of two duplicates is really me, and that what matters in survival is that psychological relation (he calls it Relation R) rather than identity — identity, he says, is the wrong question and its the reason the whole business feels paradoxical. The other is not a soul person, which I think is what he assumes she is: she's a physicalist who holds that the identity facts are brute, that you could fix every physical and psychological fact in the universe and it would still be a further question whether this one is me, and that a view on which nothing answers that question can't explain why the original's terror in the scanning room is rational. Both are smart, neither is a strawman, and I honestly can't write characters who disagree convincingly until I know what they'd actually agree on.

  So: draft the joint statement their adversarial collaboration should have produced. I want a numbered list of claims both of them can sign — including about the standard cases themselves (destructive scan and rebuild out on the other planet; the read-only upgrade where the Earth body walks out unharmed and a duplicate gets made anyway; the branching case where two copies wake up simultaneously in different cities) — and it has to be non-vacuous, meaning claims some third position would actually reject, not just "we both find the puzzle hard." Then a disagreements table, one row per live dispute, with columns for: the dispute in neutral terms, how the Parfitian would state his side so he'd sign it, how she'd state hers so she'd sign it, what each thinks the other is missing, and whether that row is substantive or is really about the word survive. Then the cruxes — the sub-questions where an answer would genuinely move at least one of them — and for each crux a concrete case, argument, or piece of evidence both would accept as bearing on it, with each side's prediction written down in advance so it can't be reinterpreted after the fact.

  Two extra things I need for the book. First, I've given Meridian a contractual wrinkle neither of them have been asked about: a stored scan that never gets instantiated, sitting in cold archive, which the estate can license or delete — plus a sole-instance clause that charges a premium for a guarantee that only one copy is ever awake. Have each camp say what their own view predicts about behavior in the signing room: does the brute-fact person pay the premium, does the Parfitian have any reason to care about the archive, would either of them sign a contract allowing a dormant pattern to be woken decades after they're dead? Second, be honest about which parts of the dispute are merely verbal. If some of it turns out to be about what survive means rather than about the world, say which part and why, because that changes how I write them — and keep the language close to how people actually talk, no jargon I'd have to footnote, without sanding the disagreement down to nothing.
reasoning: |-
  Here's a thinking process that leads to the suggested output:

  1.  **Analyze the Request:**
      *   **Context:** The user is writing a novel about a teleportation company (Meridian). Two beta readers (philosophical advisors, effectively) are stuck in a deadlock about personal identity (Parfitian Reductionism vs. Brute Physicalism/Non-Reductionism).
      *   **Task:** Create a document representing an "adversarial collaboration" between these two viewpoints.
      *   **Components Required:**
          1.  A numbered list of agreed-upon claims (non-vacuous, covering standard cases).
          2.  A disagreements table (Neutral Dispute, Parfitian Statement, Brute-Fact Statement, What's Missing, Substantive vs. Verbal).
          3.  Cruxes (sub-questions that could move them, with concrete tests/predictions).
          4.  Contractual Wrinkles (Stored Scan/Archive, Sole-Instance Clause, Post-Death Waking).
          5.  Honesty about Verbal Disputes (Which parts are just semantics?).
      *   **Tone/Style:** Smart, precise, non-jargon-heavy (or explained), realistic to how smart people talk when trying to find common ground, suitable for informing character dialogue.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Parfitian (Reader A):** Reductionist. Identity isn't what matters; *Relation R* (psychological connectedness/continuity) is what matters. No "further fact." Survival is a matter of degree. In branching, both survive (or neither is *the* original, but both are continuations). Terror is irrational if Relation R holds.
      *   **Brute Physicalist/Non-Reductionist (Reader B):** Not necessarily a "soul" believer (dualist), but believes identity is a deep, further fact not reducible to physics/psychology alone. Even if everything physical is copied, *which one is me* is a real question. Terror is rational because *this* stream might end.
      *   **Common Ground:** Both are physicalists (mostly), both accept the technology works as described, both care about ethics/prudence, both agree on the mechanics of the cases.

  3.  **Drafting the Joint Statement (Agreed Claims):**
      *   Need to avoid "Identity is X" because that's the fight.
      *   Focus on *predictions*, *ethics*, and *phenomenology*.
      *   *Claim 1:* Mechanics. Both agree the machine copies info and reconstructs matter.
      *   *Claim 2:* Memory/Character. The output thinks they are the input.
      *   *Claim 3:* Destructive Case. If Earth is destroyed, Earth-You doesn't wake up. Mars-You does.
      *   *Claim 4:* Non-Destructive Case. Two people exist. Both claim to be you.
      *   *Claim 5:* Ethics. Killing the Earth body after a non-destructive scan is morally weighty (murder?), regardless of identity.
      *   *Claim 6:* Prudence. Caring about the future copy is rational, even if identity is fuzzy.
      *   *Refinement:* Make sure these aren't trivial. "Both agree the machine works" is trivial. "Both agree the Earth-body in a non-destructive scan has a right to life" is stronger.

  4.  **Drafting the Disagreements Table:**
      *   *Dispute 1:* The Destructive Scan.
          *   Parfitian: You survive as the copy. Terror is confusion.
          *   Brute: You die. A copy lives. Terror is self-preservation.
          *   Verbal/Substantive? Mostly substantive regarding the *nature* of death, but hinges on definition of "you."
      *   *Dispute 2:* Branching (Fission).
          *   Parfitian: Identity doesn't hold, but survival does (both are successors).
          *   Brute: Only one (or neither) can be *you*. Probability is real.
          *   Verbal/Substantive? Substantive regarding metaphysics.
      *   *Dispute 3:* What matters in survival.
          *   Parfitian: Psychological continuity.
          *   Brute: Being the *same entity*.
      *   *Check:* Ensure the "What's Missing" column captures the frustration (e.g., Parfitian thinks Brute is obsessed with a label; Brute thinks Parfitian ignores the subjective point of view).

  5.  **Drafting the Cruxes:**
      *   Need tests where they predict different *behaviors* or *feelings*, not just metaphysics.
      *   *Crux 1:* The "Teletransporter Paradox" intuition pump. If we slowly replace neurons (Ship of Theseus style) vs. instant scan.
      *   *Crux 2:* The rationality of fear. Measure physiological stress in the scanning room.
      *   *Crux 3:* Legal/Moral responsibility. If Mars-You commits a crime, is Earth-You liable (if Earth-You wasn't destroyed)?
      *   *Prediction:* Parfitian says liability transfers fully. Brute says liability is shared or distinct.

  6.  **Addressing the Contractual Wrinkles (Meridian Specifics):**
      *   *Stored Scan (Cold Archive):*
          *   Parfitian: It's just data. Like a diary. Waking it is creating a new person who *thinks* they are you. Worth licensing if it helps heirs.
          *   Brute: It's a dormant *you*. Waking it is resurrection. Deleting it is killing a potential self.
      *   *Sole-Instance Clause (Premium for no copies):*
          *   Parfitian: Waste of money. As long as *someone* has your memories, you "survive." Uniqueness doesn't matter.
          *   Brute: Essential insurance. Guarantees *I* am the one who wakes up, not a twin.
      *   *Post-Death Waking:*
          *   Parfitian: Sure, why not? It's a continuation.
          *   Brute: No. The thread is cut. That's a new person wearing your face.

  7.  **Analyzing Verbal vs. Substantive:**
      *   This is crucial for the user's writing.
      *   *Verbal:* The word "Survive." Parfitian redefines it to mean "Psychological Continuity." Brute uses it to mean "Numerical Identity."
      *   *Substantive:* The rationality of fear. The ethics of deletion. The willingness to pay.
      *   *Advice:* Write the Parfitian as calm, utilitarian, focused on outcomes. Write the Brute as existential, focused on the "here and now" of consciousness.

  8.  **Review and Refine:**
      *   *Tone Check:* Is it too academic? Need to make it sound like a document two smart people hammered out over coffee, not a journal article. Use clear headings.
      *   *Constraint Check:* Did I include the numbered list? Yes. The table? Yes. The cruxes? Yes. The contract stuff? Yes. The verbal/substantive analysis? Yes.
      *   *Philosophy Check:* Is the Parfitian view accurate to *Reasons and Persons*? Yes (Relation R, identity not what matters). Is the Brute view accurate to Non-Reductionism (e.g., Chisholm, Swinburne, or just common sense realism)? Yes (Further fact view).
      *   *Novel Utility:* Does this help the user write the characters? Yes, by giving them specific lines of argument and specific behaviors regarding the contract.

  9.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the Brute Fact person isn't painted as a dualist. The prompt says "she's a physicalist who holds that identity facts are brute." This is a specific niche (Brute Physicalism). I need to ensure she doesn't appeal to a soul. She appeals to the *primitive nature of objects*.
      *   *Correction:* Ensure the "Verbal" section doesn't dismiss the whole argument. Even if "survival" is defined differently, the *fear* is real.
      *   *Formatting:* Use Markdown for tables and lists for readability.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
