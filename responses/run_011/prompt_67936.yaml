  Here is the draft of the adversarial collaboration document. It is written to be usable as a reference for your characters' dialogue and internal logic, keeping the philosophy precise but the language accessible.

  ***

  # Meridian Continuity Protocol: Joint Philosophical Addendum
  **Prepared by:** Dr. Aris Thorne (Reductionist/Parfitian) & Dr. Elena Vance (Non-Reductionist/Brute Physicalist)
  **Status:** Agreed Basis for Client Counseling

  ## Part I: The Common Ground (Signed Claims)
  *We disagree on the metaphysics of identity, but we agree on the mechanics, the ethics, and the observable outcomes. We both sign the following:*

  1.  **The Mechanics are Absolute:** In a standard transmission, the original body is disassembled at the atomic level. The data is transmitted. A new body is assembled at the destination using local matter. The destination body possesses all memories, scars, and personality traits of the original up to the moment of scanning.
  2.  **The Non-Destructive Glitch:** If the Earth-body is *not* destroyed (a "read-only" scan), two distinct physical organisms exist simultaneously. Both will claim to be the original. Both will have equal legal standing until a court rules otherwise.
  3.  **The Moral Status of Copies:** Destroying the Earth-body after a non-destructive scan is morally equivalent to killing a healthy human being, regardless of whether that being is "you." The right to life does not depend on being the unique continuation of a past self.
  4.  **Rationality of Care:** It is rational to care about the welfare of the destination copy. Even if the destination is not strictly "you," they are your psychological successor. Neglecting their welfare is as imprudent as neglecting the welfare of your own future self ten years from now.
  5.  **The Fission Problem:** In a branching case (where two copies wake up simultaneously in different cities), neither copy has a privileged claim to the past over the other based on physics or psychology. They are symmetric.
  6.  **The Terror Response:** Clients frequently experience acute panic in the scanning chamber. This is a physiological fact that Meridian must manage, regardless of whether the panic is philosophically "justified."
  7.  **Legal Continuity:** For the purposes of contracts, marriage, and criminal liability, the destination copy *is* the client. We cannot run a society on the premise that teleportation creates a new legal person every time; the system collapses.

  ## Part II: The Disagreements Table
  *Where we diverge, and why it matters for the client.*

  | The Dispute (Neutral) | The Parfitian View (Thorne) | The Brute-Fact View (Vance) | What Each Thinks the Other Misses | Substantive or Verbal? |
  | :--- | :--- | :--- | :--- | :--- |
  | **The Destructive Scan** | You survive. The person on Mars is you, because they are psychologically continuous with you. Death is only the cessation of psychology, which does not happen. | You die. A duplicate lives. The physical continuity of *this* specific organism is broken. The person on Mars is a stranger who thinks they are you. | **Thorne:** Vance is fetishizing "meat" over "mind."<br>**Vance:** Thorne is ignoring the subjective point of view. *I* am here, not there. | **Substantive.** It changes how they counsel clients on fear. |
  | **Rationality of Fear** | Fear in the scanning room is irrational (a cognitive error). You are waking up five minutes later. It is like sleeping. | Fear is rational. There is a non-zero chance (or certainty) that your stream of consciousness ends at the scanner. | **Thorne:** Fear prevents clients from using life-saving tech.<br>**Vance:** Dismissing fear is gaslighting. It validates the client's instinct for self-preservation. | **Substantive.** Affects informed consent protocols. |
  | **Branching (Fission)** | Identity doesn't apply here, but *survival* does. Both copies are you. You should be happy for both. | Only one (or neither) can be you. If two exist, at least one is an impostor, even if they don't know which. | **Thorne:** Vance is stuck on a "further fact" that doesn't exist.<br>**Vance:** Thorne is pretending logic doesn't apply. 1 cannot equal 2. | **Substantive.** Affects the "Sole-Instance" contract clause. |
  | **Definition of "Survive"** | To survive is to have a future being who remembers your life and carries your character. | To survive is to be the *same entity* that existed in the past. | **Thorne:** Vance is hung up on a word.<br>**Vance:** Thorne is changing the definition to win the argument. | **Verbal.** But it drives the substantive ethical disagreements. |

  ## Part III: The Cruxes (Tests & Predictions)
  *We identified three specific questions where an answer would force one of us to update our view. We agree to treat the following as live experiments.*

  **Crux 1: The "Slow Replacement" Intuition**
  *   **The Case:** Instead of instant scanning, we replace the client's neurons one by one with synthetic analogues over a week. At the end, the original matter is gone, but the body walked out of the room.
  *   **Prediction (Thorne):** Clients will feel no disruption. This proves continuity is about function, not matter.
  *   **Prediction (Vance):** Clients will report a "drift" or dissociation. If they don't, it proves physical continuity matters more than I thought.
  *   **Bearing:** If clients accept slow replacement but reject instant scanning, Thorne wins (psychology matters). If they reject both, Vance wins (physical continuity matters).

  **Crux 2: The Lottery of Death**
  *   **The Case:** A client is told: "We will make 100 copies. 99 will be instantly painlessly deleted. 1 will wake up on Mars."
  *   **Prediction (Thorne):** The client should be indifferent. One of *you* wakes up. The odds are 100% for *you*.
  *   **Prediction (Vance):** The client should view this as a 99% chance of death.
  *   **Bearing:** If clients refuse this deal without massive compensation, Vance is right about the rationality of fear.

  **Crux 3: Liability Transfer**
  *   **The Case:** Earth-You commits a crime, then teleports destructively. Mars-You has no memory of the crime (memory wipe during transit).
  *   **Prediction (Thorne):** Mars-You is not liable. Psychological connectedness is broken. Punishment serves no purpose.
  *   **Prediction (Vance):** Mars-You is liable. It is the same human entity, regardless of memory gaps (like amnesia).
  *   **Bearing:** Legal precedent will decide this. If courts rule "Not Liable," Thorne's view becomes social reality.

  ## Part IV: Contractual Wrinkles (Meridian Specifics)
  *How our philosophies dictate behavior regarding the new contract clauses.*

  **1. The Cold Archive (Stored Scan, Never Instantiated)**
  *   **Thorne (Parfitian):** This is data, like a diary or a video log. It is not a person.
      *   *Behavior:* I would not pay to keep it. I would not pay to delete it. It is morally neutral.
      *   *Waking after Death:* I would sign the waiver to allow waking. It is a gift to my heirs to have a "me" to talk to.
  *   **Vance (Brute-Fact):** This is a dormant person. It is a potential life in suspension.
      *   *Behavior:* I would pay a storage fee to ensure it isn't deleted (preserving my potential future).
      *   *Waking after Death:* I would **forbid** it. That is not me; that is a necromantic construct wearing my face. It creates ethical confusion for my family.

  **2. The Sole-Instance Clause (Premium for Guaranteeing No Copies)**
  *   **Thorne (Parfitian):** This is a scam.
      *   *Behavior:* I will not pay the premium. If a copy exists on Mars and I die on Earth, *I* survive on Mars. Uniqueness adds no value to survival.
  *   **Vance (Brute-Fact):** This is essential insurance.
      *   *Behavior:* I will pay the premium. If a copy exists, I cannot know if *I* am the original or the copy. The guarantee ensures that if I wake up, I am the only one, preserving the "further fact" of identity.

  **3. Post-Mortem Waking (Decades Later)**
  *   **Thorne:** **Sign.** It extends Relation R. It is effectively a very long sleep.
  *   **Vance:** **Refuse.** The causal chain is broken by biological death. Waking the scan creates a new person who *believes* they are me. It is a lie to my descendants.

  ## Part V: Honesty Check (Verbal vs. Substantive)
  *For the purpose of writing the characters accurately.*

  **What is merely verbal:**
  About 40% of our argument is about the word **"Survive."**
  *   Thorne uses "Survive" to mean *"Does someone exist later who is psychologically connected to me?"*
  *   Vance uses "Survive" to mean *"Does this specific conscious stream continue?"*
  *   **Writing Tip:** When they argue about "Survival," have them talk past each other. Thorne will sound dismissive ("Of course you survive, look at your memories!"). Vance will sound existential ("But *I* won't be there to see them!"). They are both right within their own definitions.

  **What is substantive:**
  About 60% of the argument is about **Fear, Money, and Ethics.**
  *   **Fear:** Vance believes the terror in the scanning room is a valid warning signal. Thorne believes it is a phobia to be cured. This changes how they talk to scared clients.
  *   **Money:** Vance will pay for uniqueness (Sole-Instance). Thorne will save the money. This is a concrete behavioral difference you can show in the text.
  *   **Ethics:** Vance treats the Cold Archive as a potential corpse. Thorne treats it as a hard drive. If a server farm housing archives burns down, Vance sees a mass grave; Thorne sees data loss.

  **Final Note to Authors:**
  Neither of us is the "villain" of this philosophy. Thorne offers comfort and continuity. Vance offers honesty and sanctity of the self. The tension in your novel shouldn't be about who is right, but about which truth the client needs to hear to make the jump.
