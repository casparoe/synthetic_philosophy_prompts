answer: |-
  Thank you for sharing this observation, because you have identified a mechanism of statecraft that is both pervasive and deeply corrosive to the integrity of international obligations. It is a frustration shared by many in your field, yet it often escapes precise naming because it operates in the gap between legal doctrine, political strategy, and economic reality. You are correct that the principle that ought implies can is relevant, as is the legal maxim that no one should benefit from their own wrong, often expressed in contract law as the prevention principle or the doctrine of self-induced impossibility. In contract law, if a party prevents the fulfillment of a condition, they cannot claim the condition was not met. Similarly, in international law, the principle of good faith suggests a state cannot invoke its own failure to organize its legal system as an excuse for non-compliance. However, as you noted, these concepts are static. They address the moment of breach or the origin of the impossibility, but they do not capture the dynamic, temporal escalation you described, where the passage of time and the accumulation of the backlog actively strengthen the state's defensive position rather than weakening it.

  There are concepts in economics and political science that touch upon the structural side of this phenomenon. Path dependence describes how past decisions constrain future options, often locking a system into a specific trajectory where reversing course becomes increasingly costly over time. This captures the increasing cost of compliance you mentioned, but path dependence is typically a descriptive tool used to explain institutional inertia rather than a normative critique of bad faith. It does not inherently condemn the actor for creating the path, whereas your observation is fundamentally about the strategic exploitation of that path. Similarly, the concept of strategic incapacity or strategic incompetence describes when an actor deliberately reduces their own capacity to avoid undesirable obligations. This captures the intent behind the initial policy measures, such as interdiction or slow processing, but it does not fully account for the rhetorical pivot where the resulting incapacity is later cited as an objective constraint that morally or practically excuses further non-compliance. The missing piece in all these existing terms is the inversion of liability, where the duration of the violation transforms from an aggravating factor into a mitigating one.

  Because no single established term perfectly captures this specific escalation where the excuse strengthens with the duration of the wrong, it is useful to define it explicitly. I would propose calling this the paradox of accumulated non-compliance. This name highlights the counter-intuitive logic where the state benefits from the accumulation of its own failures. The conditions under which this applies are specific. First, there must be a pre-existing obligation or norm that the state is expected to fulfill. Second, the state must adopt measures or policies that are foreseeable to create strain, backlog, or incapacity regarding that obligation. Third, the state must subsequently cite that strain or incapacity as the primary justification for continuing non-compliance or refusing regularization. Fourth, and most critically, the cost or disruption of compliance must increase with each unit of time or each additional case left unresolved, such that the state's defensive argument becomes more plausible the longer it ignores the obligation.

  This definition excludes situations where the strain is genuinely unforeseen or arises from external shocks beyond the state's control, such as a sudden natural disaster or an unexpected mass movement that was not precipitated by restrictive policies designed to deter arrival. It also excludes good faith efforts where a state attempts to comply but lacks resources despite reasonable planning, provided they are not actively undermining their own capacity to make compliance appear impossible. The paradox of accumulated non-compliance is distinct because it relies on the state manufacturing the very crisis it claims prevents resolution. It is a form of moral hazard where the penalty for non-compliance is inverted into a shield against compliance. By naming it, you can better articulate that the state is not merely failing to meet a target due to difficulty, but is actively leveraging the difficulty it created to dissolve the target itself. This distinction is vital for policy analysis because it shifts the focus from managing the backlog to challenging the legitimacy of the policies that manufactured it. I hope this helps you pin down the pattern you are seeing, as putting a name to these dynamics is often the first step in dismantling them.
