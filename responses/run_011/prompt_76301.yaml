answer: |-
  The server hum was the only sound in the lab, a low-frequency vibration that Elena felt in her teeth more than she heard it. It was 2:17 AM, according to the digital clock on the wall, but she didn't trust the clock. She trusted the server log. The sponsor wanted the preliminary certification by Monday morning. They wanted to know if the Prefrontal Modulation Array could restore consciousness in vegetative states. They used the word *restore*, which did a lot of heavy lifting for a device that mostly just buzzed the anterior cortex.

  Elena rubbed her eyes. The screen glowed with the transcript from Subject 4. She had read it forty times, but the words hadn't changed.

  *Stimulation active. Timestamp 14:03.*
  *Investigator: Can you tell me what you see, Arthur?*
  *Subject 4: It's bright. There's a window. Left side.*
  *Investigator: There are no windows in this room, Arthur.*
  *Subject 4: No, I see it. White frame. It's raining outside. There's a clock on the wall below it. Says 2:15.*
  *Investigator: Look at your hands.*
  *Subject 4: They're pale. The IV is in the left wrist.*
  *Investigator: What is Dr. Voss wearing?*
  *Subject 4: Green scrubs. White coat.*

  Elena looked down at herself. She was wearing a gray sweater. She had been wearing gray all day. There was no window. There was no clock showing 2:15. The EEG feed from Arthur's occipital lobe during that timestamp was flat. Silent. The visual cortex was asleep. But the prefrontal monitor, the one hooked to the stimulator, was lighting up like a Christmas tree.

  Arthur wasn't lying. Liars hesitate. Liars check for consistency. Arthur spoke with the fluid confidence of someone reading a menu. He reported the experience of seeing. According to the model, the stimulation had generated the higher-order state—the awareness of seeing—without the lower-order state—the actual seeing. He was conscious of a window that wasn't there. He was conscious of green scrubs that didn't exist.

  If the theory held, Arthur was having a visual experience. The phenomenal character was real to him. The red spot, the gray field, the rain on the glass—it was all happening in the space of his mind, generated entirely by the meta-representation. The sensory input was irrelevant. The light didn't need to hit the retina; the thought about the light was enough to make it bright.

  Elena minimized the transcript and opened the file for Subject 7.

  Sarah was the inverse. Her occipital lobe was firing beautifully. When Elena flashed a light on the left, Sarah's eyes tracked left. When asked to guess the location of a shape, Sarah pointed correctly nine times out of ten. She could navigate the room if guided. But when asked what she saw, she said nothing. When the stimulator hit the prefrontal target, her guessing improved to perfect accuracy, but her report remained empty.

  *Investigator: Did you see the light, Sarah?*
  *Subject 7: No.*
  *Investigator: You pointed to it.*
  *Subject 7: I guessed.*
  *Investigator: How did you know?*
  *Subject 7: I didn't know. I just moved.*

  Sarah was processing the world. She was discriminating stimuli. She was acting on information. But there was nothing it was like to be Sarah. The light hit her eye, traveled the nerve, processed in the visual cortex, and triggered a motor response, but the loop closed before it became an experience. The higher-order scan never happened. The light existed in the room, and it existed in her brain, but it never existed *for* her.

  Elena leaned back. The chair creaked. The lab was dark, save for the monitors. She needed to write the conclusion. The sponsor wanted a binary: Does the device restore consciousness? Yes or No.

  If she said yes, she was validating Arthur's report. She was saying that a brain can generate a vivid, determinate experience of a rain-streaked window without any visual input, solely by activating the mechanism that says *I am seeing*. But that meant consciousness was untethered from the world. It meant the feeling of seeing was just a stamp the brain put on its own data, a stamp that could be applied to blank paper.

  If she said no, she had to explain Sarah. Sarah was functioning. She was reacting. But if the device didn't make her report, then she wasn't conscious. Elena had to sign a paper stating that Sarah, who could catch a ball thrown at her face, was phenomenally dark. A zombie.

  A sticky note on the corner of her monitor caught her eye. It was from Julian, the lead theorist on the grant, written in his messy scrawl before he left for the weekend. *Check dispositional parameters. Is the HOT occurrent or just poised? If poised, Arthur's report might be retrofitted. Doesn't solve the empty target problem.*

  Elena peeled the note off and crumpled it. It didn't help. Whether the state was happening now or just ready to happen, the gap remained. Arthur had the state without the world. Sarah had the world without the state.

  She stood up and walked to the sink in the corner of the lab. She needed water. The tap ran cold. She cupped her hands and drank. The water was sharp. She felt the coldness on her tongue. She felt the swallow in her throat.

  She turned off the tap and looked at her reflection in the dark window of the server room. Her face was pale. Gray sweater. Tired eyes.

  How did she know she saw the water?

  It was a stupid question. She was the investigator. She was the control. But the mechanism was the same. The light reflected off the water, hit her retina, fired the occipital lobe. Then, somewhere in the prefrontal wash, a state arose that took that visual processing as its object. *I am seeing water.*

  If that second step was the only thing that mattered, if that was the only thing that made the difference between a camera recording data and a human having an experience, then how could she verify it? Arthur's second step had fired. He said *I am seeing a window*. His prefrontal cortex lit up. By the metrics of the trial, Arthur was conscious of the window.

  Elena walked back to the desk. She sat down. The cursor blinked on the screen. *Conclusion:* it waited.

  She typed: *Subject 4 demonstrates verified report generation consistent with restored higher-order awareness.*

  She stopped. Verified by whom? By her. She had asked the questions. She had heard the answers. She had accepted the report as evidence of experience. But her acceptance was based on her own introspective authority. She trusted her own sense that she was conscious of Arthur speaking. She trusted her memory of the sound of his voice.

  But if the higher-order thought could exist without the target, as Arthur's case proved, then the feeling of certainty was not a guarantee of truth. It was just another representation. Arthur was certain about the green scrubs. He was certain about the clock. He was wrong about the world, but right about his experience. Or was he? If there was no visual state, what was the experience *of*?

  The theory said the experience is constituted by the higher-order content. The red spot is real because the thought says there is a red spot. The window is real because the thought says there is a window. The phenomenology is intrinsic to the higher-order state, not the lower-order input.

  Elena looked at her hands on the keyboard. She pressed the 'E' key. She felt the plastic depress. She heard the click.

  *Investigator: What is Dr. Voss wearing?*
  *Subject 4: Green scrubs.*

  He was wrong. She was wearing gray. But he had an experience of green. The experience was vivid. He could describe the fabric, the shade, the white coat over it. The higher-order state was rich, determinate.

  If she typed *Subject 4 is conscious*, she was agreeing that a human being can be fully conscious of a reality that does not exist. And if that was true, then the link between consciousness and truth was severed. Consciousness wasn't a window onto the world; it was a screen projector inside the skull.

  But worse was Sarah. If she typed *Subject 7 is not conscious*, she was saying that behavior, discrimination, and accurate guessing were not enough. She was saying that without the inner scan, Sarah was a machine. Elena looked at the video feed of Sarah's last session. Sarah was blinking. She looked bored. She scratched her nose when it itched.

  Elena deleted the sentence.

  *Conclusion:*

  The cursor blinked. It was a white rectangle against the black void of the text field. On, off. On, off.

  She realized she was holding her breath. She exhaled. She felt the air leave her lungs. She was aware of breathing. That awareness was the target. That was the thing the stimulator was supposed to turn on.

  But how did she know it was on now? How did she know she wasn't like Arthur?

  The lab was quiet. The server hummed. She was alone. Or was she? She had the thought *I am alone*. That thought took her sensory state as an object. But what if the sensory state was empty? What if the room was dark, but her higher-order system was telling her she saw the monitors? What if the hum was silent, but her brain reported sound?

  She couldn't check. There was no third eye. There was no way to step outside the higher-order thought to see if it matched the lower-order state. The transitivity principle said she was conscious because she was aware of being in the state. It didn't say the state had to be real. It just said she had to be aware of it.

  Arthur was aware. Sarah was not. Elena was... what?

  She looked at the clock on the wall again. 2:43 AM.

  She remembered Arthur's transcript. *Says 2:15.*

  He had been specific. A specific time. A specific window. A specific color. The detail was what made it convincing. If he had said *I see something*, she might have doubted him. But he said *green scrubs*. He said *2:15*. The specificity created the reality.

  Elena looked at her sweater. It was gray. She knew it was gray. She had bought it three years ago. She had felt the wool this morning.

  But that was memory. That was another higher-order thought taking a memory trace as its object.

  She looked at the cursor. It was still blinking.

  *Conclusion: The device successfully induces reportable states independent of sensory input.*

  If she wrote that, the sponsor would be happy. It meant the device worked. It meant they could wake people up. It didn't matter if what they woke up to was real. It only mattered that they reported it.

  But then she thought of Sarah. Sarah, who could catch the ball. Sarah, who said *I didn't know*. If the device didn't work on Sarah, then Sarah remained in the dark. And if the device did work on Arthur, then Arthur was in a light that showed him nothing.

  Elena raised her hand to type the final certification. Her finger hovered over the 'Y' key. *Yes.*

  She looked at her fingernail. It was chipped on the thumb. She saw the chip. She saw the white crescent of the lunula. She saw the shadow cast by the monitor light.

  The image was clear. It was determinate. It was vivid.

  Arthur's window was vivid too.

  Elena lowered her hand. She didn't type. She just watched the cursor. It blinked. On. Off. On. Off. It marked the passage of time. It marked the presence of the machine.

  She wondered if the cursor was really there, or if she was just reporting it. She wondered if the hum of the server was real, or if her prefrontal cortex was simply generating the expectation of sound to match the visual data. She wondered if she was sitting in the chair, or if she was a body in a bed somewhere, being stimulated to believe she was working late.

  There was no way to tell. The view from the inside was sealed. The report was all there was.

  She looked at the reflection in the dark screen. Her face was there. Pale. Gray sweater. Eyes wide.

  She blinked. The reflection blinked.

  She leaned closer to the monitor until her breath fogged the glass. In the condensation, she drew a small circle with her finger. A red spot. She wiped it away.

  The screen was black again. The cursor blinked.

  *Conclusion:*

  Elena stared at the word. She thought about Arthur's clock. 2:15. She thought about her own clock. 2:43.

  She typed one word.

  *Data.*

  Then she deleted it.

  She looked at her hand again. She flexed her fingers. She felt the tendons move under the skin. She felt the pressure of the desk against her wrist.

  It felt like seeing. It felt like knowing.

  It felt exactly like Arthur's green scrubs.

  Elena sat back. The server hummed. The cursor blinked. She watched it, waiting to see if she would feel the next blink, or just report that she had. The white rectangle pulsed against the dark, a steady, rhythmic claim of presence that offered no proof of light.
