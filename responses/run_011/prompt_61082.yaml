      *   Make sure to explicitly answer the "Price the repairs" section.
      *   Address the "newspaper" problem (why doesn't news weaken us like theater?). *Answer:* News reports facts; theater dramatizes them. Drama invites emotional identification that bypasses judgment. News can be ignored; drama seduces. (Or, admit news *does* weaken us, but theater is *worse* because it lies). Let's stick to the *structure* argument: Theater requires you to sit passively in the dark.

