          2.  *Application:* Theater does this (weeping on stage = paying debt to humanity).
          3.  *Conclusion:* Theater weakens action; republic should ban it.
          4.  *Generalization:* This applies to *everything* (history, news, sermons, Rousseau's books).
          5.  *Extension:* It applies to Rousseau's proposed replacements (festivals).
