      *(Self-Correction)*: I need to be careful not to just say "Rousseau is right." I need to show *how* to fix the logic. Devin's logic is tight *if* you accept his equivalence classes. The break must be in the equivalence classes.

      *Key Insight:* The "Substitution Principle" (1) is actually a description of *Catharsis*. Rousseau hates Catharsis. He loves *Communion*.
      *   Theater = Catharsis (Spectator separate from Actor).
      *   Festival = Communion (Spectator becomes Participant).
