answer: |-
  ### 1. The Question

  **Question 3 (25 Marks)**

  **Case:** In a provincial land registry, applicants traditionally give the registering officer a gift (usually cash in a sealed envelope) before a file is opened. Three conditions apply: (1) The professional code mandates acceptance; refusal insults the household. (2) Every gift is logged publicly (amount, names) online and at the office door. (3) The gift buys nothing: fees are fixed, files processed in order, and audits show no difference in decisions or wait times between givers and non-givers. However, non-givers are socially excluded: denied credit, funeral attendance, or vouching, having stepped outside the web of reciprocal obligation.

  A reformer is posted to the office. She refuses every gift and publishes her refusals. Her decisions are impeccable. Within two years, colleagues stop passing her information; applicants hide details about disputed parcels; clerks won't tip her off about fraud because she owes them nothing and they owe her nothing. Locals describe her as the most dangerous officer the registry has had in years.

  **Prompt:** Is the gift-taking corrupt? Is the refusal corrupt? Defend a single account of corruption that yields a determinate verdict on both, or argue that no single account can. Explain what follows for anti-corruption practice if your view is correct.

  ***

  ### 2. Model Answer

  Standard definitions of corruption fail here. If corruption is secretly abusing power for private gain, this case offers neither secrecy nor altered decisions. The gifts are public; the outcomes are statutory. To judge this case, we must define corruption not by the visibility of the act or the deviation of the outcome, but by the source of the officer's obligation. Corruption occurs when the obligations internal to a public office are displaced by competing obligations external to it.

  On this account, the gift-taking is corrupt. Although the decisions match the statute, the gift inserts the officer into a web of social reciprocity that competes with their public duty. The office exists to adjudicate claims based on impersonal law. The gift binds the officer to the applicant through household honor and mutual debt. Even if the officer never bends a rule, their authority is no longer derived solely from the state but is co-constituted by the social network. The public register does not cure this; it merely makes the competing obligation auditable. Transparency legitimizes the practice only if one assumes publicity equals integrity, but here it simply records the diffusion of authority. The officer is accountable to the giver socially, which dilutes their accountability to the public legally.

  The reformer is not corrupt. She refuses the external obligation, restoring the boundary between the office and the household. Her verdict is clean because she accepts no debt that could compete with her statutory duty. However, her "dangerous" reputation reveals a second problem: while she is not corrupt, her office is becoming dysfunctional. The gift system, though corrupt, facilitated information flow. Colleagues shared intelligence because they were bound by reciprocity; applicants confessed disputes because they sought protection within the web. By severing these ties without replacing them, the reformer has made herself unaccountable in a practical sense. Nobody can call her to account because she owes them nothing, but equally, she cannot call on them for the truth required to adjudicate complex claims.

  This yields a determinate verdict: the gift is corrupt, the refusal is not. But it forces a distinction between non-corruption and good government. The gift-taker is corrupt but reachable; the refuser is clean but isolated. If anti-corruption practice focuses only on eliminating the gift, it produces a sterile bureaucracy that cannot access the local knowledge necessary to function.

  Therefore, the implication for practice is that banning gifts is insufficient. You cannot simply strip the social layer without rebuilding the public layer. Anti-corruption measures must construct formal channels of accountability and information flow that replace the social ones. If the state does not provide a reason for clerks to share information other than reciprocal debt, removing the debt removes the information. Good government requires not just the absence of private obligation, but the presence of functional public accountability. To solve this, one must not just police the officer's intake, but repair the office's capacity to act without relying on the very corruption it seeks to eliminate.

  ***

  ### 3. Marking Scheme

  **Total: 25 Marks**

  **1. Disqualifying Secrecy and Transparency as Decisive (5 Marks)**
  *   **Move:** Explicitly argue that because both the gifts and the refusals are public/logged, secrecy cannot be the criterion for corruption.
  *   **Failure Mode:** Awarding zero if the student argues the gifts are corrupt *because* they are bribes (implying secrecy) or that the register makes them legitimate. Transparency is treated as a variable, not a verdict.

  **2. Distinguishing Private Gain from Social Incorporation (5 Marks)**
  *   **Move:** Analyze the "gain" not as personal enrichment but as entry into a reciprocal network. Differentiate this from a salary (which buys labor) and a bribe (which buys decision).
  *   **Failure Mode:** Awarding zero if the student simply asserts "cash is private gain" without addressing why a logged, decision-neutral transfer differs from a salary, or slides into "it's their norm so it's not gain."

  **3. Defining the Telos of the Office (5 Marks)**
  *   **Move:** State what the office is *for* (e.g., impersonal adjudication vs. social mediation) to establish a standard against which corruption is measured.
  *   **Failure Mode:** Awarding zero if the student treats the office as a neutral container. Marks require arguing that corruption is a distortion of the office's specific purpose, not just a moral failing.

  **4. Handling the Accountability Inversion (5 Marks)**
  *   **Move:** Address the paradox: the gift-taker is corrupt but reachable (accountable via social debt); the reformer is clean but unaccountable (isolated/ignored).
  *   **Failure Mode:** Awarding zero if the student collapses the two into a single verdict (e.g., "both are good" or "both are bad") without explaining how the *type* of accountability shifts. Must recognize the reformer is "dangerous" because she is unreachable.

  **5. Deriving Practice Implications Beyond Prohibition (5 Marks)**
  *   **Move:** Argue that anti-corruption practice must replace the social infrastructure removed by reform, not just ban the gifts.
  *   **Failure Mode:** Awarding zero for generic recommendations like "increase audits" or "punish officers." Marks require recognizing that removing the gift breaks the information flow and proposing how to fix *that* specific break.
