      In the second paragraph, I need to ensure I don't sound like I'm making consent the key. "without consent" is there. Good.

      *Final Polish:* Ensure the tone is sharp but respectful. "You assume..." "I ground it..." "I reject both horns."

      *Wait, one more check on Thesis (v):* "not to be cashed out as a rule-utilitarian calculation." My argument about "private calculation of risk" touches on this. I need to be clear that the prohibition isn't because *this* act erodes the practice (consequentialist), but because *acting on that maxim* is unfair (deontological/fairness). I think "claim a privilege over the collective device" covers this. It's about status/rights, not outcomes.

