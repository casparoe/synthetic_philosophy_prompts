prompt: |-
  You are a philosopher of science with a specialist's command of nineteenth-century British philosophy of science and of the contemporary debate over reduction and emergence. I am preparing a graduate seminar and would value a careful second reading of a passage from John Stuart Mill's System of Logic (1843), in his discussion of the composition of causes. I am away from my library, so what follows is my own close paraphrase rather than Mill's wording: please treat it as conveying the argument only, and tell me where you suspect my rendering distorts it.

  Mill's claim, as I read it, is that when several causes act together there are two fundamentally different sorts of case. In the first, the joint effect is the sum of what each cause would have produced on its own, so the outcome can be computed from the separate laws; he takes this to hold throughout mechanics. In the second, the joint effect is no sum at all: hydrogen and oxygen have their properties, but the properties of water resemble neither, and nothing in one's knowledge of the separate laws would have enabled one to predict them. The laws of such compounds he calls heteropathic — they answer to causes in a manner not derivable from the laws of the ingredients, and the compound has laws of its own. Yet Mill insists that this does not place chemistry outside the domain of law: the heteropathic sequences are still uniform, they are still produced by the ingredients acting after their natures, and a deeper acquaintance with those ingredients might one day render them deducible.

  Two questions. First, is that final clause doing more work than it appears to? I have been telling my students that Mill anticipates the view that a higher-level law may fail to be deducible from lower-level laws while the higher-level phenomenon is nonetheless nothing over and above them; but I worry that I am smuggling a contemporary thesis into him. Does the reasoning above commit Mill to that combination, or does the failure of the composition of causes push him toward treating the compound as a distinct subject of causation in its own right? Second, what turns on the answer for biology: if the reasoning generalizes, is a science of living things autonomous, derivative, or something for which Mill simply lacks the vocabulary?

  Please think carefully, and begin with a brief brainstorm of the available interpretive options before committing to one. Close by stating how much confidence you place in your reading given that you are working from my paraphrase, and by noting the single place in it where a different wording would most change your verdict. Argue from the content of the passage; I am not looking for citations or a reading list.
