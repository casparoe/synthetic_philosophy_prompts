answer: |-
  You have not missed something obvious. In fact, you have independently rediscovered one of the most famous and devastating criticisms of Logical Positivism.

  Philosophers like Karl Popper, Jürgen Habermas, and Alasdair MacIntyre have made arguments very similar to yours. You have correctly identified the tension between **Logical Positivism's meta-ethics** (ethical statements are meaningless) and **Logical Positivism's political project** (social engineering/scientific planning).

  Here is the breakdown of how Carnap and the Vienna Circle handled this, why they weren't "blind" to it, and why your intuition that it leaves a "hole" is shared by many professional philosophers.

  ### 1. The Distinction: Cognitive vs. Emotive Meaning
  You are absolutely right about Carnap's criterion. For a statement to be **cognitively meaningful** (capable of being true or false), it must be either:
  1.  **Analytic:** True by definition (e.g., "All bachelors are unmarried").
  2.  **Empirically Verifiable:** Testable by observation (e.g., "There is a cat on the mat").

  Statements like "Justice is good" or "We ought to redistribute wealth" fit neither category. Therefore, Carnap classified them as **non-cognitive**.

  However, Carnap did not say these statements were *useless*. He said they were **expressions of attitude**. When a socialist says, "Exploitation is wrong," Carnap interprets this not as a fact claim about the universe, but as a command or an expression of feeling, similar to saying, "Exploitation—boo!" or "Let us stop exploitation!"

  ### 2. So, What Are the Planners Optimizing For?
  This is your core question. If "human welfare" isn't an objective fact, what is the scientific planning board aiming at?

  Carnap and his colleague Otto Neurath (the socialist economist you mentioned) answered this by separating **decisions** from **facts**.

  *   **Science (Facts):** Can tell you, "If you implement Policy A, grain production will rise by 10% but inequality will increase."
  *   **Ethics (Decisions):** Must decide, "Do we value total grain production more, or do we value equality more?"

  For Carnap, science cannot make that second choice. That choice is a **volitional decision** (a decision of the will).

  So, to answer your question: **The planners were optimizing for goals that were chosen democratically or instinctively, not scientifically.** They believed that while science couldn't *prove* socialism was "right," once a society *decided* it wanted to minimize suffering and maximize security (a decision based on shared human sentiment), science could then engineer the most efficient path to get there.

  ### 3. Did They Notice This Problem?
  Yes, they did. They were heavily influenced by David Hume, who famously argued you cannot derive an "ought" from an "is." The Vienna Circle accepted this. They were not trying to prove that socialism was "metaphysically true."

  Instead, they argued for a **pragmatic consensus**.
  *   **Neurath's View:** Neurath argued that while values aren't scientific facts, human needs *are*. We can scientifically study what causes human suffering (hunger, disease, insecurity). Therefore, while "you ought to reduce suffering" is a decision, "this policy reduces suffering" is a fact. They bet on the idea that most rational people, once shown the facts about suffering, would *decide* to reduce it.
  *   **Carnap's View:** Carnap was more reserved. He viewed ethical systems as **linguistic frameworks**. Just as we can choose to use a mathematical framework that includes real numbers or one that doesn't, we can choose an ethical framework. We choose the one that is most **fruitful** for social cooperation.

  ### 4. The "Hole" You Found (Instrumental Rationality)
  Your critique is that this reduces politics to "whoever's got the better statistics." In philosophy, this is called the problem of **Instrumental Rationality**.

  If science can only tell you *how* to get somewhere, but never *where* to go, then:
  1.  **Values become arbitrary:** If the ruling class decides the goal is "maximize profit," science can help them do that just as efficiently as it can help socialists "maximize equality." There is no rational way to argue between the two goals, only a clash of feelings.
  2.  **Technocracy:** It implies that experts (who know the statistics) should rule, because they know the *means*, even if they don't know the *ends*.

  The **Frankfurt School** (critical theorists like Adorno and Horkheimer) attacked the Vienna Circle on exactly these grounds. They argued that by stripping reason of the ability to judge values, Logical Positivism turned reason into a mere tool of domination. If you can't say "this goal is evil," you can only say "this goal is inefficient."

  ### 5. Why Carnap Didn't Think It Was Fatal
  Carnap would likely respond to your critique with his **Principle of Tolerance**.

  He would argue: "You are looking for an absolute, metaphysical foundation for justice. There isn't one. But we don't need one to build a better society. We just need to agree on a framework."

  He believed that by clearing away the "metaphysical nonsense" (like claims that God ordained the class system, or that the Market has a mystical invisible hand), we could have clearer, honest disagreements.
  *   **Old Way:** "Socialism is sin!" vs. "Capitalism is theft!" (Both claim to be objective truths, leading to holy war).
  *   **Carnap's Way:** "I prefer a system with more security." vs. "I prefer a system with more risk." (Both admit these are preferences, leading to negotiation).

  He thought admitting that values are "feelings" (or decisions) would actually *lower* the temperature of political conflict, not make it meaningless.

  ### Summary
  You haven't missed anything. You have correctly identified that Logical Positivism creates a gap between **facts** (which science handles) and **values** (which it cannot).

  *   **What were they optimizing for?** Shared human needs and democratically chosen goals (like reducing suffering), treated as decisions rather than facts.
  *   **Did they notice?** Yes. They accepted that science cannot dictate ends, only means.
  *   **Is it a hole?** Many philosophers say yes. It leaves the system vulnerable to the critique that without objective values, "scientific planning" is just efficiency in the service of whatever mood is currently in power.

  Carnap's hope was that we wouldn't *need* objective values to cooperate; we would just need clarity about what we were choosing. Whether that hope was naive is still a matter of intense debate. But your intuition that it leaves the "aim" of society ungrounded is philosophically sound.
