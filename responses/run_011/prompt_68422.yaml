      *Decision:* Instructor plays the Agent on the board based on the Card. This prevents a student from messing up the logic or taking too long. It keeps control.
      *Revised Plan:* Instructor is the "Black Box Agent". Students are the Interpreters.
      *Why?* 75 mins is too short to train a student agent reliably. Instructor ensures the "False Belief" logic holds up perfectly for the lesson.
