prompt: |-
  I'm a PhD student co-teaching a grad seminar in philosophy of AI — 14 students, mostly philosophy with three from the ML side, and I've got 75 minutes on the topic of inferring preferences from behavior. I want an in-class game where the students play the interpreter instead of hearing me describe the problem.

  The setup I have in mind (improve it, or tell me it won't work): a small grid map, one student is the "agent" and gets a private card specifying both a reward function and one false belief about the map — they think a cell is blocked when it isn't, that sort of thing. Everyone else only ever sees the sequence of cells the agent passes through, never the payoff. Then each observer group has to commit in writing to a reward function, and we test them: same agent, altered map — a shortcut opened up, a cell deleted — and we see whose inferred reward actually predicts the new path.

  What I want them to walk out feeling is that the demonstration data is compatible with a bunch of different (reward, belief, discount rate) triples, and that the tie only gets broken by what happens in states the agent never once visited. Also that a group which assumes the agent believes what they believe will end up inventing a bizarre reward to explain perfectly sensible behavior.

  Give me the whole runnable thing: materials, the actual wording of the agent's card, how rounds get scored without real money, and a debrief that maps each round onto the identifiability point rather than just announcing it. Then be straight with me about which feature of real reward inference this activity can't reproduce and I'll have to supply by hand. Put the timeline in a table with columns: minutes elapsed, what the players are doing, what I'm doing, which part of the problem this round is meant to expose. And put the stuff that'll predictably go wrong the first time I run it in a JSON array with fields name, why_it_happens, and fix_in_the_moment.
