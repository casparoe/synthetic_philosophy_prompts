  The committee room was dark save for the pool of light over the table where the coffee had gone cold. Elias sat with his hands clasped, looking at the printout of the staff's new variant. Sarah stood by the window, watching the rain blur the city lights.

  "If the totals are this close," Elias said, tapping the paper, "your position becomes harder to hold, Sarah. In the original scenario, you argued that sixty-one million waves of nausea cannot aggregate to outweigh two lives of agony. You posited a threshold: below a certain severity, harm doesn't count toward the calculus of catastrophe."

  "I argued that trivial harms don't *sum* in the same way severe harms do," Sarah corrected, turning from the window. "There is a discontinuity. A lifetime of pain is a different category than a forgotten moment of discomfort. You cannot bridge that gap with enough small stones."

  "Staff's new design lays a bridge anyway. Two million parents. Two minutes of nausea each. No benefit to them—they aren't receiving the vaccine. The total volume of suffering is roughly four million minutes. The child方案 was four point one million minutes. The arithmetic is a tie. If you reject the child scheme because the nausea is trivial, you must reject this one too. But if you reject this one, you are objecting to something other than the pain."

  "I am objecting to the structure of the claim," Sarah said, sitting opposite him. "In the first case, the burden falls on the beneficiaries. The child receives the protection and bears the four seconds. It is a package deal. In this variant, we are instrumentalizing the parents. We are using them as a means to absorb cost so others may benefit. That introduces a fairness constraint that doesn't exist in the first option."

  Elias leaned forward. "But you admitted last week that if the nausea lasted four *hours* instead of four seconds, you would switch to the old formulation. You conceded that aggregation works *up to a point*."

  "I did. If the burden on the child became significant, the trade-off changes. But four seconds is below the threshold of moral relevance when weighed against a lifetime of pain. It is noise."

  "Then why does the parent variant trouble you?" Elias pressed. "Four million minutes of noise is still noise. If the total amount of 'noise' is identical, why does shifting it from the beneficiary to the bystander make it wrong? Is it because the parent consents? Because we can ask a parent to accept a cost for their child, but we cannot ask a stranger to accept a cost for a neighbor's child?"

  "Partly. But mostly because it reveals what we are actually doing. When the child feels the nausea, we tell ourselves it is the price of their own safety. When the parent feels it, the mask slips. We are inflicting harm on one group solely to spare another. If the total pain is the same, and you still prefer the parent scheme, you are admitting that the *location* of the pain matters more than the *amount*."

  "I do prefer the child scheme," Elias said. "But not because I ignore the location. I prefer it because in the child scheme, the transaction is internal to the recipient. But let's press your threshold. You say trivial harms don't aggregate to override catastrophic ones. If I have sixty-one million people feel four seconds of nausea, that is a lot of four seconds. It is a cumulative year of human experience, erased. Why does that year not count?"

  "Because it is not experienced as a year," Sarah said softly. "It is experienced as sixty-one million isolated moments that vanish before the subject leaves the clinic. No one's life is derailed. No one wakes up the next day changed. The two adolescents with the pain syndrome? Their lives are defined by it. The aggregation of trivialities assumes a single subject who feels all sixty-one million waves at once. But there is no such subject. There are only individuals. And for each individual, the choice is: four seconds of nausea or a risk of lifelong pain. Any rational agent chooses the nausea."

  Elias nodded slowly. "That is your strongest move. The separateness of persons. But here is where the parent variant defuses it. In the parent scenario, we *also* have separate persons. Two million adults. Each feels two minutes. No one's life is derailed. By your logic, since no single parent suffers a catastrophe, the harm should remain below the threshold. It should be dismissible. Yet you hesitate."

  Sarah paused. She looked at the printout. "I hesitate because the consent is different. A child cannot consent to the vaccine, so we act in their best interest. Four seconds of nausea is in their best interest. Asking a parent to take a prophylactic nausea drug for *another* person's child... that moves from best interest to sacrifice. I am not saying the pain aggregates. I am saying the *obligation* to bear the pain does not transfer."

  "So it is not about the pain at all," Elias said. "It is about duty."

  "It is about the limits of what we can demand. If we say the total minutes justify the burden, we open the door to demanding significant sacrifices from the many for the sake of the few, provided the math holds. I am afraid of a calculus that treats people as containers for utility."

  Elias sighed, rubbing his temples. "And I am afraid of a calculus that allows two people to rot in agony because we are too fastidious about counting the discomfort of the crowd. But... I will concede this to you. The parent variant *is* morally heavier than the child variant, even if the minutes match. I dismissed that earlier. I treated the minutes as fungible tokens. But they are not. Burdening a non-beneficiary requires a higher justification than burdening a beneficiary. If we choose the parent scheme, we are saying the parents *must* do this. That is a coercion I am not sure I can endorse."

  Sarah nodded. "That is a significant concession, Elias. You are admitting that distribution matters, not just sum."

  "I am. If the totals were vastly different—if the parent scheme saved ten million minutes—I might override the distribution concern. But when the totals are a tie, the fairness of the distribution becomes the tiebreaker. So, on the parent variant, I agree with you. We should not burden the parents."

  "Then we are back to the children," Sarah said. "And there, we remain apart. Because there, the distribution is perfect. The bearer is the beneficiary."

  "Exactly. And this is where I need you to meet me. You say the four seconds don't count because they are forgotten. But they are real. They are physiological events. If we have the power to prevent two lives of torment, and the only cost is a collective year of minor discomfort spread across a generation, is it not a failure of empathy to ignore that year? You protect the two by ignoring the sixty-one million. I protect the sixty-one million from being used as a mere backdrop for the two."

  Sarah looked down at her hands. "I hear you. And I want you to hear this: I am not saying the sixty-one million count for *nothing*. If the nausea were four minutes, I would vote with you. If it were four hours, certainly. My threshold is not zero. It is just very low. I believe there is a point where the severity of the harm creates a firewall that numbers cannot breach. Four seconds is behind that firewall. Two minutes... perhaps two minutes is near the gate."

  She looked up, her eyes clear. "My worry is that if I allow the four seconds to count fully, I validate the principle that *any* amount of trivial harm can eventually outweigh a catastrophic one, given a large enough population. That principle terrifies me. It suggests that if we had enough people, we could justify killing one innocent person to save everyone a headache."

  "But we don't have enough people to justify killing," Elias said. "We only have enough to justify a forgotten nausea. The slope is not as slippery as you fear. We can hold the line at 'no killing' without also holding it at 'no nausea'."

  "Perhaps," Sarah said. "But the principle is the same. Aggregation is the engine. I am trying to stall the engine before it gains momentum."

  "And I am trying to keep it running because it drives us toward the greater good."

  They sat in silence for a moment. The rain had stopped.

  "We have narrowed it," Elias said finally. "We agree the parent scheme is out. The totals are too close to justify the unfairness. That leaves the original choice. And we agree that numbers matter up to a point, but we disagree on where the point lies relative to four seconds of nausea."

  "And we agree that the two lives of pain are incomparably worse than the nausea for any single individual," Sarah added. "The disagreement is strictly about whether the sixty-one million individuals form a moral collective that can outweigh the two."

  Elias gathered the papers. "I cannot vote to condemn two children to lifelong pain if I believe the cost is affordable. To me, a collective year of nausea is affordable."

  "And I cannot vote to impose a burden on sixty-one million people if I believe the moral math treats them as a single vessel. To me, the separateness of persons is not a technicality. It is the whole point."

  Elias stood up. "Then we will vote tomorrow. And whichever way it goes, one of us will believe the board has made a category error."

  "Not a category error," Sarah said, standing as well. "A tragedy. Either we inflict widespread minor harm, or we allow catastrophic harm. The math doesn't solve the tragedy. It just quantifies it."

  "Then let us hope the quantification is honest," Elias said.

  "It is," Sarah replied. "It is just not complete."

  They turned off the lights and left the room, the printout with the four million minutes lying face down on the table, unresolved.
