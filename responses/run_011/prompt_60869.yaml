      *   **Stance:** The "machine welfare" debate rests on a category mistake. Not because suffering wouldn't matter, but because what we detect is trained reporting, not evidence of feeling (qualia/phenomenology).
      *   **Tone:** Calm, precise, generous with side concessions, but unyielding on the main point.
