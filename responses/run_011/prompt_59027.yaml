answer: |-
  They stitch the rebel's coat to fit
  The modern cut, the modern wit;
  He died for God, but we endow
  The liberty we cherish **now**.

  The battle's waste is justified
  Because a constitution died
  To clear the path and make a show
  Of progress taking its final **bow**.

  The losers are the stones they tripped
  From history's book their names are ripped;
  Obstacles removed to allow
  The keeping of our modern **vow**.

  The road that led to nowhere found
  Is plowed beneath the fertile ground;
  The other paths are cut and gone
  We only see the living **bough**.

  We hold the gavel in our hand
  To judge the justice of the land
  Who served the cause, who drove the plow
  We know the reason and the **how**.

  But silence keeps its own account,
  Beyond the reach of what we count,
  A distant and unyielding sea,
  That never sought to be like me.

  ***

  **Note on Constraint and Cheat**

  The poem necessarily cheats by enacting the very sin it diagnoses. By forcing every stanza (save the last) to resolve into the sonic anchor of the present (/aʊ/), the form performs the Whig interpretation: the past is prosodically compelled to march toward us. The aesthetic satisfaction of these rhymes buys a consolation I did not intend; it makes the teleology feel inevitable, even musical, rather than coercive. The rhythm smooths over the violence of the abridgment.

  Furthermore, the broken stanza likely fails to escape presentism. By placing the refusal in the final position, the poem structures the "escape" as the culmination of the narrative—a progress story where *we* (the present readers and poet) are finally wise enough to break the chain. It flatters the present by congratulating us on noticing the trap, turning the critique into another version of the victory lap. The silence of the past is still framed by a voice that claims the authority to grant it.
