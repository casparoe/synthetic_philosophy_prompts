  *   **Same Mechanism + Constitution:** Incoherent. Constitution views require the reporting access to *create* the experience; blindsight-style guessing is defined by lacking that access.
  *   **Fixes Content + Inert:** Incoherent by definition. If it fixes content, it has a causal/constitutive role.

  **Indistinguishable Leaves:**
  *   **Acquaintance vs. Phenomenal Concepts:** In practice, these are hard to separate empirically. Both claim the report is accurate because of the subject's relation to the experience. The distinction is metaphysical (non-conceptual vs. conceptual), not functional. Your tree separates them at Node 6, but a subject cannot introspectively tell the difference.
  *   **Neural Tracking vs. Illusionism:** Both deny the report is *phenomenally* accurate. Tracking says it's neurally accurate; Illusionism says there's nothing to be accurate about. The behavioral output is identical.

