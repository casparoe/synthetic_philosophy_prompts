  ### Consensus and Contention Report

  **Settled vs. Contested Framing:**
  *   **Node 1 (Causal Sufficiency):** **Contested.** While "Causal Closure of the Physical" is the default in science, Interactionists (and some Quantum Mind theorists) explicitly deny it. Experts agree this is the first fault line.
  *   **Node 2 (Phenomenal Reality):** **Contested.** Illusionism is a growing minority position but rejected by most phenomenologists and realists.
  *   **Node 3 (Blindsight):** **Settled Mechanism, Contested Interpretation.** Everyone agrees blindsight patients guess without experience. The contention is whether *normal* reports are just a "high-fidelity" version of that guessing (Tracking) or qualitatively different (Realism).
  *   **Node 4 (Pain/Attention):** **Contested.** High-order theorists say attention constitutes the experience; First-order theorists say experience exists prior to attention. This is a live debate in consciousness science.
  *   **Node 5 & 6 (Epistemic Relation):** **Contested.** This is the core of the "Hard Problem." Physicalists prefer Node 6 (Concepts); Dualists lean toward Node 5 (Inert) or Acquaintance.

  **Leaf Population Estimates:**
  *   **Mainstream:** Constitution, Phenomenal Concepts. (The standard Physicalist package).
  *   **Serious Minority:** Illusionism, Epiphenomenalism, Neural Tracking, Acquaintance. (Respected positions, held by prominent philosophers, but not the default).
  *   **Nearly Empty:** Interactionism. (Widely regarded as scientifically untenable due to causal closure violations).

  **Judgment Call Flag:**
  *   **Node 5 Compression:** I compressed "Causal Role" and "Epistemic Mode" into Node 5/6 to meet your Depth 5 constraint. In the literature, "Does experience cause the report?" (Causal) and "How do we know the experience?" (Epistemic) are often treated as separate debates. I have treated them as linked because if experience is causally inert (Epiphenomenalism), the epistemic question becomes the "Coincidence Bill."
