  ### The Decision Tree

  **Standard Vocabulary Note:**
  *   Your *"Coincidence Bill"* is standardly called the **Explanatory Gap** or **Brute Correlation**.
  *   Your *"Content-Locking"* is standardly called **Intentional Grounding** or **Semantic Determination**.

  **Structure:** 8 Nodes, Depth 5, 7 Leaves.
  **Empirical Cases Used:** Blindsight (Node 3), Pain/Attention (Node 4).
  **Cases Not Used:** Split-Brain (Does not discriminate *accuracy* mechanisms, only unity of reporter), Confabulation (Redundant with Blindsight for this specific tree; both test unconscious inference).

  #### Node 1: Causal Sufficiency
  **Question:** "Is the physical brain state *alone* sufficient to produce the verbal report, or does the experience itself add a causal push?"
  *   **No (Experience adds causal push):** Go to **Node 1b**.
  *   **Yes (Physical state suffices):** Go to **Node 2**.

  #### Node 1b: Interactionist Check
  **Question:** "If the experience pushes the physical brain, does it do so by violating physical conservation laws (energy/momentum)?"
  *   **Yes (Violates laws):** **Leaf: Interactionism** (Substance Dualism).
  *   **No (Does not violate):** **Leaf: Interactionism** (Property Dualism / Emergentism).
      *   *Tag (Coincidence Bill):* None.
      *   *Tag (Content-Locking):* Solved (Causal link fixes content).
      *   *Consensus:* Nearly Empty (Fringe in philosophy of mind; violates causal closure).

  #### Node 2: Phenomenal Reality
  **Question:** "Does the 'feeling' (phenomenal experience) actually exist, or is it a user-illusion generated by the report mechanism?"
  *   **No (It is an illusion):** **Leaf: Illusionism** (Eliminativism / Fictionalism).
      *   *Tag (Coincidence Bill):* None (Nothing to match).
      *   *Tag (Content-Locking):* Dissolved (No phenomenal content to lock).
      *   *Consensus:* Serious Minority (Dennett, Frankish).
  *   **Yes (It exists):** Go to **Node 3**.

  #### Node 3: Blindsight Mechanism
  **Question:** "Is the mechanism producing your report fundamentally the same type as a blindsight patient's guess (unconscious processing), or is it a distinct conscious access?"
  *   **Same Type (Unconscious inference):** Go to **Node 3b**.
  *   **Distinct Type (Conscious access):** Go to **Node 4**.

  #### Node 3b: Tracking Target
  **Question:** "If the mechanism is unconscious, is the report *about* the experience (and mistaken) or *about* the neural state (and accurate)?"
  *   **About Neural State:** **Leaf: Neural Tracking** (Error Theory / Interpretive Self-Model).
      *   *Tag (Coincidence Bill):* Small (Report matches neural state by design).
      *   *Tag (Content-Locking):* Relocated (Why track *this* state?).
      *   *Consensus:* Serious Minority (Carruthers, some Cognitive Science).
  *   **About Experience:** **Leaf: Neural Tracking** (Illusion of Accuracy).
      *   *Tag (Coincidence Bill):* Large.
      *   *Tag (Content-Locking):* Relocated.
      *   *Consensus:* Nearly Empty.

  #### Node 4: Pain/Attention Constitution
