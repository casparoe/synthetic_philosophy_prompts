      *   *C5 (Intent to Deceive):* Not necessary for lying. Bald-faced lies are lies and wrong.
      *   *C6 (Comparative Badness):* Some misleading is worse than some lying (consequentialist comparison allowed for *overall* badness, even if lying has a *unique* wrong).

