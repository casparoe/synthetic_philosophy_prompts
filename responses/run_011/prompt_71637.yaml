      *   The core issue is grounding the "unique wrong" (C1/C2) in a way that accommodates bald-faced lies (C5) while respecting the quality of will (C3).
      *   *Current C2:* "The wrong is located in the assertion itself... give the hearer your word, and an entitlement to believe you."
      *   *Problem:* This is too relational/psychological. It depends on the hearer's state.
      *   *Revision:* Shift C2 to focus on the *norm of assertion* rather than the *hearer's entitlement*. You violate the constitutive norm of assertion (truth-telling) regardless of whether they believe you.
      *   *Alternative Revision:* Revise C5. But C5 is a strong intuition in modern lit.
      *   *Better Revision:* Revise C3 slightly. Blame tracks quality of will *regarding the norm violated*.
      *   *Best Revision:* **Revise C2.** It's the linchpin. If you define the wrong as "violating the norm of assertion" rather than "abusing the hearer's entitlement," you solve C5 (you violated the norm even if they didn't believe) and keep C1 (misleading doesn't violate *that* norm).
      *   *Wait, looking closer at C3:* C3 says blame tracks will, *not incidental details of how the act happened*. But C1/C2 says the *act type* (assertion vs implication) *is* the moral difference. This is the deeper structural conflict. If C3 is true, the difference between lying and misleading (an incidental detail of how the act was carried out, per C3's phrasing) shouldn't matter for blame. But C1 says it *is* a principle difference.
