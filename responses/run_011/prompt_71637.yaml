      *   *Wait, re-reading C3:* "not... the incidental details of how the act happened to get carried out." If lying vs misleading is a *principle difference* (C1), then it is *not* an incidental detail. So C3 and C1 are compatible *if* we interpret C3 charitably.
      *   *Re-evaluating C2/C5:* C2 says the wrong is abusing the entitlement. In a bald-faced lie, does the speaker *give* an entitlement? Carson says yes, you still assert. But does the hearer *have* an entitlement if they know you're lying? Maybe not. But the *offer* was made.
      *   *Okay, the strongest tension is actually C2 vs C5.* C2 relies on a successful transfer of entitlement/trust. C5 relies on a failed/voided transfer.
      *   *Second strongest:* C3 vs C1/C2/C4. If Will is identical (C4) and Blame tracks Will (C3), then Liar and Misleader are equally blameworthy. But if Lying has a *unique wrong* (C1), shouldn't that add to blameworthiness? C1 says "wrong that misleading doesn't [have]." It doesn't explicitly say "more blameworthy." So C1 and C3 can coexist if "wrong" means "pro tanto wrongness" and "blame" means "final accountability."
