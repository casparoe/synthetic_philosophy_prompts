      *   *Cost:* Complicates the "quality of will" view. Suggests act-type matters for blame, not just will.

      *   *Fix for C5:* Drop bald-faced lies as the paradigm. Say they are "lies" linguistically but the *wrong* is different or attenuated.
      *   *Cost:* Goes against standard philosophical literature (Carson, etc.) which the user seems to be engaging with.

  6.  **Rank Tensions:**
      1.  **C2 vs. C5 (The Trust/Entitlement Gap):** If the wrong is abusing entitlement, bald-faced lies (where entitlement is voided) shouldn't be wrong *in that specific way*. Yet C5 says they are.
      2.  **C1/C2 vs. C3 (The Formalism Problem):** If blame is all about will (C3) and will is identical (C4), the "unique wrong" of lying (C1/C2) risks becoming a morally empty technicality. Why care about the assertion if the will is the same?
      3.  **C4 vs. C2 (The Mechanism Problem):** If the intention is just "get them to believe," but the wrong is "abusing the assertion," there's a disconnect. The liar intends to deceive, but the wrong is betraying the assertion. (This is less severe, more explanatory).

