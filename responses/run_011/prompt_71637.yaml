      *   *Fix for C2/C5:* Modify C2. The wrong isn't just abusing *actual* entitlement, it's violating a *norm* of assertion. Even if no one believes you, you violated the norm that governs the speech act.
      *   *Cost:* Moves away from a purely relational/interpersonal account (giving *your word to me*) to a constitutive norm account (violating the rules of *assertion*).

