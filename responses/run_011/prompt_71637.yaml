      *   *Recommendation:* Revise C2 to be about the *invitation* to trust, not the *abuse* of existing trust. Or, acknowledge that bald-faced lies are wrong for a *different* reason than standard lies.
      *   *Most efficient fix:* Tweak C2. The wrong is *offering* a guarantee of truth that one does not intend to keep, regardless of whether the guarantee is accepted.

