      *   **Refining the "Law":** To avoid the "but does it satisfy the differential equation?" objection, I will stipulate the Law's property rather than its formula. "The Law is Local and General."
      *   *Local:* Depends only on neighbors.
      *   *General:* Doesn't care about absolute labels (coordinates).
      *   *Task:* Students verify that two configurations satisfy the "Local" constraint (e.g., no jumps > 1) and the Boundary constraint.

      *   **Refining the Commitment:**
          *   Give each intersection a unique ID *before* putting cards down. "Point Alpha," "Point Beta."
