          *   *"Metric field individuates":* This is the sophisticated objection. "The geometry tells the points apart."
          *   *Counter:* In the activity, the "metric" is the numbers on the cards. We are moving the numbers. So the metric moves with the points. If the metric moves, it can't fix the points.

      *   **Limitations:**
          *   Smoothness/Differentiability (discrete grid).
          *   The fact that this is about *models* of a theory, not just one-off arrangements.
          *   The precise definition of General Covariance.

  6.  **Developing the Timeline:**
      *   0-15: The Substrate (Tape grid, naming points).
      *   15-35: The Physics (Cards, Boundary Conditions, The Law).
      *   35-60: The Hole (The Shuffle, The Crisis).
      *   60-75: Debrief & Reveal.

  7.  **Addressing the "Bomb" from Last Year:**
      *   Last year: "Just renaming."
