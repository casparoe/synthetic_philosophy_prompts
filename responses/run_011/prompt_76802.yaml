answer: |-
  Here is a 75-minute lesson plan designed to force the ontological commitment early, making the indeterminism bite.

  ### **Session Title:** The Substrate and the Shift
  **Goal:** Students derive the Hole Argument dilemma (Substantivalism + General Covariance $\rightarrow$ Indeterminism) without prior exposure to the formalism.
  **Materials:**
  *   Masking tape (wide, painter's tape works best).
  *   2 decks of index cards (different colors, e.g., White and Yellow).
  *   Permanent markers (Sharpies).
  *   A large open floor space.

  ---

  ### **1. Setup & Roles (5 Minutes)**
  **The Room:** Clear the center of the room. Use the masking tape to create a **5x5 grid** on the floor. The squares should be large enough for a student to stand inside, but the *intersections* (the nodes) are the important part. There are 36 intersections.
  **The Commitment:** Before class starts, label every tape intersection with a unique, arbitrary ID using the marker (e.g., "A1," "A2"... "F6"). Do not use coordinates (x,y). Use names.

  **Roles (Assign to 14 students):**
  *   **The Substantivalists (4 students):** Their job is to guard the identity of the tape intersections. They must insist that "A1" is "A1" regardless of what sits on it.
  *   **The Field Technicians (6 students):** They hold and place the index cards (the "Field").
  *   **The Auditors (4 students):** They check the "Law of Physics" (see below).

  ---

  ### **2. Phase 1: The Ontological Commitment (15 Minutes)**
  *Do not mention physics yet. This is metaphysics.*

  1.  **The Void:** Ask the class to stand around the grid. Point to intersection **C3**. Ask: "If I remove every card, every person, and every object from this room, is C3 still C3?"
  2.  **Force the Hand:** If they hesitate, turn to the **Substantivalists**. Their role instruction is: *"You believe spacetime points are real entities, like atoms. Defend the reality of the tape nodes."*
  3.  **The Contract:** Ask the whole class: "To proceed with this simulation, we must agree on the rules of the world we are modeling. In this world, are the tape intersections distinct entities independent of the cards we place on them?"
      *   *Get explicit verbal agreement.* Write on the board: **Premise 1: The Points are Real.**
      *   *Why this fixes last year's bomb:* You aren't asking if the *physics* changes yet. You are asking if the *container* exists. If they say "No, it's just relations," the activity stops. If they say "Yes" (which they must to run the sim), they are locked into Substantivalism for the duration of the exercise.

  ### **3. Phase 2: The Field and The Law (20 Minutes)**
  1.  **The Field:** Hand the **Field Technicians** the White Cards. Have them write integers (0–10) on them.
  2.  **The Boundary:** Place cards on the *outer perimeter* of the 5x5 grid (the edge intersections). Let's say the numbers ascend smoothly from 0 to 10 along the edges.
      *   *Constraint:* These cards are **glued down** (use a tiny bit of tape or just a strict rule). They represent the "Past" or the "Boundary Data."
  3.  **The Law:** Hand the **Auditors** the "Law Card."
      *   *The Law Text:* "A valid physical state must satisfy **Local Smoothness**: The difference between numbers on any two adjacent intersections cannot exceed 1."
      *   *Note:* This is a toy constraint. It replaces the Einstein Field Equations. It is "generally covariant" in the sense that it refers only to *neighbors*, not to the specific IDs (A1, C3, etc.).
  4.  **Configuration Alpha:** The Technicians fill in the *interior* (the 16 inner intersections) with numbers that satisfy the Smoothness Law and match the Boundary.
      *   *Check:* Auditors verify every adjacent pair. If $|Value_1 - Value_2| \le 1$, it's valid.
      *   *Status:* We have a valid universe. The Past (Boundary) is fixed. The Interior is determined.

  ### **4. Phase 3: The Hole (25 Minutes)**
  *This is the crux. Do not rush.*

  1.  **Define the Hole:** Use a different color tape to mark a square region in the *center* of the grid (e.g., a 2x2 set of intersections: D3, D4, E3, E4).
      *   *Rule:* The Boundary (outer ring) is fixed. The Hole (center) is the "Future."
  2.  **The Shift:** Ask the **Field Technicians** to create **Configuration Beta**.
      *   *Instruction:* "Keep the Boundary exactly the same. Inside the Hole, swap the cards around. Move the card from D3 to E4, and E4 to D3, etc."
      *   *Constraint:* They must ensure the **Local Smoothness Law** is *still* satisfied at the boundary of the Hole (where the Hole meets the fixed region).
      *   *Trick:* To make this work without complex math, pre-prep a second set of Yellow Cards that are a "shifted" version of the White Cards. The Auditors verify that Configuration Beta *also* satisfies the Smoothness Law and matches the Boundary.
  3.  **The Confrontation:**
      *   Freeze the room. Configuration Alpha is on the floor (in their minds). Configuration Beta is the alternative.
      *   **Question to the Substantivalists:** "In Alpha, Point D3 has Value 5. In Beta, Point D3 has Value 7. The Boundary (Past) is identical in both. The Law is satisfied in both. Did a physical change occur at Point D3?"
      *   *Expected Answer:* "Yes. D3 is a real point (Premise 1). It has different properties."
      *   **Question to the Class:** "Did the Law of Physics determine which configuration happens?"
      *   *Expected Answer:* "No. Both are valid given the same Past."
      *   **The Bite:** "So, is the universe indeterministic? Or is one of our premises wrong?"

  ### **5. Phase 4: Debrief & Reveal (15 Minutes)**
  1.  **The Trilemma:** Write on the board:
      1.  Spacetime Points are Real (Substantivalism).
      2.  Laws are General (don't refer to specific point IDs).
      3.  Physics is Deterministic (Past fixes Future).
      *   *Result:* You just proved you can only keep two.
  2.  **The Reveal:** "This is the **Hole Argument** (Einstein 1913, revived by Earman & Norton 1987)."
  3.  **Mapping:**
      *   Tape Intersections = Manifold Points.
      *   Index Cards = Metric/Field Values.
      *   Smoothness Law = Generally Covariant Field Equations.
      *   The Swap = Diffeomorphism.
  4.  **Discussion:** How do we escape?
      *   *Option A:* Deny Premise 1 (Relationism/Structuralism). Points aren't real; only the field relations are.
      *   *Option B:* Deny Premise 3 (Accept radical indeterminism).
      *   *Option C:* Deny Premise 2 (Absolute space returns).

  ---

  ### **Anticipating Objections (Without Lecturing)**

  **Objection 1: "It's just a coordinate change. You just renamed the points."**
  *   **The Trap:** Students treat the tape IDs (A1, B2) as coordinates $(x, y)$.
  *   **The Handle:** Go back to Phase 1. "In Minute 5, we agreed the tape points were real entities *before* we put cards on them. If I swap the cards, have I changed the properties of the entity 'C3'? If you say 'No, it's just a rename,' you are denying Premise 1. You are saying 'C3' isn't a thing, it's just a label for 'wherever the 5 is.' That is a valid philosophical move (Relationism), but you must admit you just abandoned Substantivalism to save Determinism."

  **Objection 2: "The metric field individuates the points. Point C3 is the point with curvature 5."**
  *   **The Trap:** Using the field values to define the points (Leibniz shift).
  *   **The Handle:** "Look at the Hole. In Configuration Beta, the 'Curvature 5' is now at Point D4. If 'Point with Curvature 5' is the definition of the point, then the point *moved*. But in our setup (Premise 1), the tape points are fixed. You are proposing a different ontology where points are *nodes in the field*, not the substrate. That solves the Hole Argument, but it means spacetime isn't a container; it's a derivative of the field. Again, valid, but that's the *solution*, not a refutation of the argument."

  ---

  ### **Limitations: What You Must Supply Verbally**
  Be honest with them during the debrief. The activity is a discrete analog; tell them what gets lost in translation.

  1.  **Smoothness vs. Continuity:** "Our 'Smoothness Law' was discrete steps. In GR, this is about differentiable manifolds. The Hole Argument requires the shift to be smooth (a diffeomorphism), not just a swap. If the shift isn't smooth, it violates the field equations. We glossed over that."
  2.  **Models vs. Worlds:** "We treated the two configurations as two possible *histories* of the same world. Technically, in the formal argument, they are two distinct *mathematical models* that represent the same physical situation (if you're a relationalist) or distinct situations (if you're a substantivalist). We simulated the 'distinct situations' version to feel the indeterminism."
  3.  **Active vs. Passive:** "We physically moved the cards (Active Diffeomorphism). Einstein originally thought about this as changing coordinates (Passive). The math proves they are equivalent, but it's confusing. We did the active version because you can see it."

  ### **Why This Works (vs. Last Year)**
  *   **Commitment First:** By labeling the tape *before* placing cards, you reify the manifold points. They can't say "it's just where the matter is" because the tape IDs exist before the matter.
  *   **The Law is Checked, Not Asserted:** The Auditors verify that *both* configurations work. You aren't telling them the theory allows it; they validate that the "Law" (Smoothness) holds in both cases.
  *   **The Cost:** To escape the conclusion, they must explicitly renounce the "Tape Points are Real" premise they agreed to in Minute 5. They feel the cost of saving determinism.
