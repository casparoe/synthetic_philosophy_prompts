prompt: |-
  I'm running a 75-minute session in an upper-level philosophy of physics seminar — 14 students, third years. They've done a year of special relativity and can handle "gravity as geometry" as a slogan, but nobody has seen a manifold or a tensor and I'm not introducing them. I want them to walk into the hole argument on their own; the name doesn't get said until after.

  I bombed this last year. I drew two coordinate grids on the board with the same matter dots in slightly different places and asked whether anything had changed. Half of them said "its just renaming, obviously nothing changed," and it was dead inside ten minutes. The problem, I think, is that I never made them commit to being able to pick out a bit of empty space on its own, apart from what's standing in it — so there was nothing for the relabeling to threaten. Build the activity so that commitment happens early and costs them something real.

  Give me: setup and materials (I have masking tape, index cards, and a room they can move around in), roles, a timeline for the 75 minutes, and a toy "law of physics" they can apply by hand that's deterministic given the data outside the region in question — so that the failure of determination actually bites rather than being an assertion I make. Then a debrief mapping what just happened onto the argument.

  Also: what predictably goes wrong the first time it's run. I'm expecting someone to insist the two setups are related by a coordinate change so nothing happened, and someone to say you can just use the metric field to tell the points apart — tell me how to handle each without lecturing. And be straight with me about which features the activity cant reproduce and I'll have to supply verbally (smoothness? the fact that it's models of a theory that come out multiply possible?). No readings.
