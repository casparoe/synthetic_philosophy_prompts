      *   *Actually, Earman & Norton's version is best:* The equations are generally covariant. Therefore, if $Model = (M, g, T)$ is a solution, then $Model' = (M, \phi^*g, \phi^*T)$ is also a solution, where $\phi$ is a diffeomorphism that is identity outside the hole.
