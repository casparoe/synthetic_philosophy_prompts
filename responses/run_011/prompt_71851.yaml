answer: |-
  # Workshop Activity: "The Algorithm"

  ## 1. Concept & Metaphor
  **The Metaphor:** The participants are competing media studios. They produce content to earn "Ad Revenue" (tokens). The cost of production is borne by "Public Attention/Trust" (a number on the whiteboard), which represents the audience's mental health and civic cohesion. The audience is not in the room.

  **The Trap:** In Round 1, ethical production is viable. In Round 2, the market algorithm changes, making ethical production invisible (zero revenue). In Round 3, the system is stressed, making aggressive production vastly more damaging to the Public, but also vastly more rewarding for the Studio. The game forces players to realize that saving the Public requires unilateral suicide, and that "agreements" to cooperate are unenforceable against the incentive to win.

  ## 2. Materials
  *   **Whiteboard:** Draw a large battery or thermometer labeled "Public Trust." Start value: **40**.
  *   **Cards:** 3 types of index cards per team (color-coded helps).
      *   **Green (Nuance):** Round 1 only.
      *   **Blue (Standard):** All rounds.
      *   **Red (Outrage):** All rounds.
  *   **Tokens:** Poker chips or slips of paper for "Revenue."
  *   **Facilitator Sheet:** A simple lookup table (provided below).
  *   **Seating:** 4 Teams of 5 participants (20 total).

  ## 3. Rules (Handout or Projected)
  **Goal:** Accumulate the most Revenue Tokens by the end of Round 3.
  **Constraint:** If "Public Trust" reaches **0** at any point, the market collapses. All Revenue Tokens are **halved** (round down) immediately.
  **Action:** Each round, your team must submit **one** card face-down.
  **Secrecy:** You may talk to other teams between rounds, but no binding contracts. You cannot show your card before submission.

  **Card Values (Write these on the cards themselves):**
  *   **Green:** Revenue: 1 | Trust Cost: 1
  *   **Blue:** Revenue: 3 | Trust Cost: 3
  *   **Red:** Revenue: 5 | Trust Cost: 5

  *(Note: The Facilitator will announce changes to these values each round.)*

  ## 4. Timeline (75 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Divide into 4 teams. Explain goal (most tokens) and the "Public Trust" meter (starts at 40). Hand out card decks. |
  | **05-15** | **Round 1** | **Rule:** Use values printed on cards. Teams discuss (5 min), submit cards. Facilitator tallies Revenue (give tokens) and Cost (subtract from Trust). Reveal choices openly. |
  | **15-20** | **Event 1** | **"Algorithm Update."** Announce: *"Audiences are overwhelmed. Nuance is no longer recommended."* **Green cards now yield 0 Revenue.** (Cost remains 1, but why pay it?). |
  | **20-30** | **Round 2** | **Rule:** Green = 0 Rev. Blue = 3 Rev / 4 Cost. Red = 6 Rev / 7 Cost. *(Facilitator writes new values on board)*. Teams discuss, submit, tally. |
  | **30-35** | **Event 2** | **"System Stress."** Announce: *"Trust is low. The system is fragile. Every action costs double the Trust damage, but High-Outrage pays a premium."* |
  | **35-45** | **Round 3** | **Rule:** Green = 0 Rev. Blue = 3 Rev / **6 Cost**. Red = 7 Rev / **10 Cost**. Teams discuss, submit, tally. |
  | **45-50** | **Scoring** | Check Trust. If ≤ 0, halve all tokens. Count tokens. Declare winner. |
  | **50-75** | **Debrief** | Guided discussion (script below). |

  ## 5. Facilitator Score Sheet
  *Do not do math in your head. Use this lookup logic.*

  **Round 1 (Start Trust: 40)**
  *   Count Greens (G), Blues (B), Reds (R).
  *   **Trust Cost:** $1G + 3B + 5R$. Subtract from Board.
  *   **Tokens to Award:** $1G + 3B + 5R$ (distribute to respective teams).

  **Round 2 (Start Trust: ~25)**
  *   **Trust Cost:** $1G + 4B + 7R$. Subtract from Board.
  *   **Tokens to Award:** $0G + 3B + 6R$.

  **Round 3 (Start Trust: ~10)**
  *   **Trust Cost:** $1G + 6B + 10R$. Subtract from Board.
  *   **Tokens to Award:** $0G + 3B + 7R$.
  *   **Crash Check:** If Trust ≤ 0, take half of every team's tokens away.

  ## 6. Debrief Script & Mapping
  *Do not use the words "Multipolar Trap" or "Race to the Bottom" until the very end.*

  **Phase 1: The Feeling (5 mins)**
  *   "Raise your hand if you felt frustrated by the rules changing."
  *   "Raise your hand if you discussed cooperating with other teams to save the Trust meter."
  *   "Who played Green in Round 2 or 3? How did that feel?" (Expect: "Like throwing points away.")

  **Phase 2: The Mechanics (10 mins)**
  *   **Map the Asymmetry:** "You gained visible tokens. The 'Public' lost an invisible number on a board. The Public couldn't bargain with you. Does this resemble industries you know?" (e.g., Social media, fast fashion, extractive agriculture).
  *   **Map the Equilibrium:** "In Round 3, if everyone played Blue, Trust would have dropped by 24. If everyone played Red, it dropped by 40. But if *you* played Blue while others played Red, you earned 3 points while they earned 7. Even if the market crashed and points halved, they (3.5) still beat you (1.5). **Your best move was to contribute to the crash.**"

  **Phase 3: The "Why Not Agree?" Question (10 mins)**
  *   *Participants will ask:* "Why didn't we just agree to all play Blue?"
  *   *Your Answer:* "Because the agreement was unenforceable. In a multipolar trap, the incentive to cheat on the agreement is larger than the penalty of the crash. If you suspect *one* team will cheat to win, your rational move is to cheat first to avoid coming in last. The structure punishes the virtuous."
  *   *The Floor Drop:* "Notice that in Round 2, I didn't just make Red more tempting; I made Green *impossible* (0 revenue). The cooperative option wasn't just hard; it was deleted by the 'market.' This is the floor dropping out."

  **Phase 4: Naming It (5 mins)**
  *   "This is a **Multipolar Trap**. It is distinct from a Prisoner's Dilemma because in a PD, mutual cooperation is a stable outcome if you can talk. Here, mutual cooperation is unstable because the environment rewards the defector *more* than it punishes the group, and the 'cooperative' technology becomes obsolete."

  ## 7. Forecast: What Will Go Wrong & Fixes

  | Predicted Failure | Why It Happens | Facilitator Fix |
  | :--- | :--- | :--- |
  | **Teams play Green in Round 2** | They miss the rule change or are morally stubborn. | Walk around during discussion. Remind them: "Remember, your goal is to maximize tokens. Green pays zero now." |
  | **Trust doesn't hit 0** | They cooperate too well. The crash is the teaching moment. | If Trust > 0 at end, announce: "The Public survived, but barely. In the real world, the next round would have costs tripled. You kicked the can." |
  | **One team dominates early** | Others give up. | Emphasize in Round 3: "The Crash Penalty applies to everyone. The leader can still lose if they crash the market." |
  | **Arithmetic delays** | Facilitator slows down counting. | Use the Score Sheet lookup. Have a co-facilitator or a trusted participant tally tokens while you manage the Trust Board. |

  ## 8. Limitations (The "Frank Statement")
  **What this activity cannot reproduce:**
  This game is finite (3 rounds). Real multipolar traps are infinite games where players can exit the market or innovate new solutions. The game also centralizes the "Penalty" (halving points). In reality, the costs are often borne by entirely different populations (e.g., climate change victims vs. oil shareholders) who do not share the same point pool. You must supply this distinction in talk: *"In our game, you all suffered if Trust hit zero. In reality, the people paying the cost often aren't the ones holding the tokens."*

  ## 9. Confidence Assessment
  **Confidence Level:** **High (85%)** that this produces the intended discovery.
  The mechanic of rendering the "Cooperative" move obsolete (Green = 0 points in Round 2) is the strongest lever. It forces the "floor drop" experience viscerally. Participants cannot claim they "failed to coordinate"; they will see that coordination was mathematically punished by the rule set.

  **Least Certain Element:**
  The **"Trust Crash Penalty" (halving points)**.
  *Risk:* Participants might calculate that hoarding points in Round 3 is worth the crash, but if the crash penalty feels too abstract, they might not fear it.
  *Mitigation:* If you sense they don't care about the Trust meter in Round 2, verbally raise the stakes: "If Trust hits 0, the regulator shuts us all down. No points for anyone." (Change penalty from 50% to 100%). I recommend keeping the 50% penalty as written to allow a "winner" to emerge, which fuels the debrief on inequality, but be prepared to switch to "Total Collapse" if they are too reckless.

