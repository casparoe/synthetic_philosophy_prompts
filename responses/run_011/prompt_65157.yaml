answer: |-
  **SCENE START**

  **SETTING:**
  A simple table, two chairs. Scripts lie open. A single lamp lights the page.

  **CHARACTERS:**

  **CITIZEN:** Dressed plainly. Sharp, witty, weary of pretension.
  **PLAYWRIGHT:** Dressed slightly more formally. Intense, focused, civic-minded.

  **[LIGHTS UP]**

  **CITIZEN**
  Let's begin with the ledger. A theater is a hole in the ground where money goes to die. For a republic like Geneva, small and vigilant, the expense is only the first injury. The second is idleness. You gather men who should be working, women who should be managing households, and you pay them to sit in the dark. You call it culture; I call it a drain on the public vigor.

  **PLAYWRIGHT**
  You count coins, I count hours. Men work, yes, but they also live. If they are not gathered in the theater, they are gathered in the tavern or the clique. The theater is the lesser idleness. It confines the leisure to a specific hour, in a specific place, under a specific light.

  **CITIZEN**
  Under a light that lies. You claim the theater reforms morals. I tell you it merely tracks them. The stage is a mirror, yes, but it is a flattering glass. It shows us what we already love, not what we ought to be. If a city is corrupt, the plays will be corrupt, because the corrupt audience demands it. You cannot use the disease to cure the patient.

  **PLAYWRIGHT**
  A mirror that only reflects is useless. But a mirror held up in public becomes evidence. When our manners are fixed in a play, they are no longer invisible habits. They are types. They are named. We can argue about them. Without the stage, vice is private; with it, vice is a public proposition.

  **CITIZEN**
  Public proposition? Let's talk about the passion you sell there. You say tragedy purges us. I say it excuses us. You buy pity with a ticket. It costs nothing to weep for Hecuba when you know the usher will not ask for a donation on the way out. You spend your compassion in the dark, on borrowed troubles, so you can come out onto the street and be exactly as hard on the beggar as you were on the way in. The passion is spent, not purified.

  **PLAYWRIGHT**
  You confuse expenditure with rehearsal. When a soldier drills, he does not spend his courage; he sharpens it. When I weep for a king who loses his children, I am not empting my vessel of pity. I am testing its weight. I am practicing the sensation of loss so that when loss comes for me, or for my neighbor, the muscle memory is there. You say the pity is cheap because the ticket is bought. I say the pity is valuable because the attention is paid.

  **CITIZEN**
  Attention paid to what? To lies told by people paid to lie. Consider the actor's trade. It is the selling of one's own person. To stand there and simulate feeling for wages is to degrade the soul. And do not get me started on women on the stage. To expose themselves to the gaze of thousands, to speak of love they do not feel… it dissolves modesty, and without modesty, a republic is just a mob with better manners.

  **PLAYWRIGHT**
  The actor sells a skill, not a soul. But let's leave the actor and look at your alternative. You prefer the open-air festivals. The people gathering in the square, watching themselves.

  **CITIZEN**
  Exactly. No actors. The spectators become the spectacle. A crown of flowers, a dance, a simple contest. Everyone is seen, everyone is seen equally.

  **PLAYWRIGHT**
  Who organizes the dance? Who chooses the music? Who decides which faces are in the front of the crowd and which are in the back? There is always a director, even in the square. And you praise the unanimity of the festival. I fear it. A crowd watching a crowd demands participation. It demands you cheer. In the theater, I can sit silently and dissent. In your festival, if I do not dance, I am a traitor to the joy. Unanimity is not an achievement, Citizen; it is a threat. A play can go wrong; a festival can go wrong too. But when a play fails, we boo the author. When a festival fails, we boo the citizen.

  **CITIZEN**
  Better to boo the citizen than to applaud the vice. Look at comedy. You say it corrects us by ridiculing our faults. But ridicule has a target. Take Molière's *Misanthrope*. Alceste is the upright man. He demands truth. He refuses to flatter. And what is he? He is the joke. The worldly Philinte, who compromises, who lies politely, he is the sane option. The engine of comedy is ridicule, and it always makes the intransigent virtue look foolish and the easygoing vice look like survival.

  **PLAYWRIGHT**
  You read Alceste too kindly. He is not laughed at for being virtuous. He is laughed at for being indiscriminate. He demands truth from a tailor about a suit, from a friend about a sonnet. Virtue without judgment is tyranny. The audience does not learn to compromise their morals; they learn to aim them. They see that virtue without wisdom is just another form of vanity.

  **CITIZEN**
  Wisdom? Or convenience?

  **PLAYWRIGHT**
  Let's test it. Imagine a tragedy. *The General's Return*. A magistrate discovers a popular general has embezzled funds to win a war. If he exposes him, civil war erupts. If he hides it, the law dies.

  **CITIZEN**
  I know what the audience takes home. They take home pity for the Magistrate. They say, "What a heavy burden," and they forgive themselves for smaller compromises. "If a Magistrate can hide the truth for peace, I can hide a lie for my family." The tragedy excuses the inaction.

  **PLAYWRIGHT**
  No. They take home the argument. Half the city walks out saying the Magistrate was right to save the state. Half says he was wrong to break the law. They argue in the street. The question is kept alive, bleeding, public. In your festival, the question is drowned in the drumbeat. In my theater, the question is sharpened.

  **CITIZEN**
  They argue until they forget the law matters more than the outcome.

  **PLAYWRIGHT**
  They argue until they understand the law is made of outcomes.

  **[A beat. They look at each other.]**

  **CITIZEN**
  We agree on this: The theater intensifies passion. It makes feeling stronger than it was before the curtain rose.

  **PLAYWRIGHT**
  We agree. It is an amplifier.

  **CITIZEN**
  And there we split. I say an amplifier in a small republic is a danger. You say it is a tool.

  **PLAYWRIGHT**
  I say it is the only thing loud enough to be heard over the noise of self-interest.

  **CITIZEN**
  Then we are left with the width of a stage between us.

  **PLAYWRIGHT**
  No. We are left with the question of whether a mirror can show what isn't there yet.

  **CITIZEN**
  I say a mirror only shows what stands before it.

  **PLAYWRIGHT**
  I say if you angle it right, it shows where the light is going.

  **[BLACKOUT]**

  **SCENE END**
