  And this is the one actually bugging me: if there's two things there, why doesnt the scale read double? I weigh a lump, I shape it into a little statue, I weigh it again, same number as before. So either the second object has zero weight, in which case it's not a physical object at all, or there's only ever been one object and this whole debate is just word games dressed up as metaphysics. Which is it? Nobody I've read even brings up the weighing thing and I feel like it settles the whole argument in one line.
