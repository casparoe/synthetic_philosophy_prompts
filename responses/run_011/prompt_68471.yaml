answer: |-
  The single step I would strike out first is **(1)**.

  **Why it looked unobjectionable**
  Premise (1) appears immune to criticism because it presents itself as a definition of terms rather than a historical claim. In ordinary language, if a building collapses, it ceases to function as a building; if a bridge collapses, it is no longer a bridge. There is an intuitive ontological hardness to the word: collapse suggests a transition from being to non-being. It feels as though you are merely clarifying what you mean by the word before you begin, which is a legitimate move in any project. Furthermore, it aligns with your desire for the term to have descriptive weight; if collapse is merely a change, it seems to dissolve into 'history' generally, which is all change. By insisting that something must *cease to exist*, you secure a clear boundary for your investigation.

  **The cost of striking it out**
  Once you remove (1), you must abandon the idea that collapse is an ontological extinction and accept that it is a *functional decomposition*. This costs you the comfort of binary thinking (the society either exists or it does not) and forces you to adopt a systems-based definition of what a society *is*.

  If (1) is gone, you can no longer define a society simply as a collection of people or artefacts, because those persist (as your premises 3 and 4 correctly note). Instead, you must define a society as a **capacity for organised action**. On this view, a society is not the people themselves, but the specific network of relationships, specialisation, and energy capture that allows those people to act collectively. When that network fractures, the *capacity* ceases to exist, even if the *components* (the people, the language, the villages) remain.

  This means you must argue that the Mycenaean world was not 'Greece waiting to happen', but a specific machine for distributing grain, coordinating labour, and projecting power that broke down. The cost is that you have to be precise about *which* capacities were lost. You cannot simply say 'Mycenaean society collapsed'; you must say 'the capacity for centralised redistribution and monumental coordination collapsed'. This makes your project harder, because you must identify the specific functions that vanished, but it saves the term 'collapse' from being merely subjective.

  **Other serious candidates**
  The next strongest candidate for rejection is **(5)**.

  *   **The Argument for striking (5):** Premise (5) claims that political systems come and go without societal collapse, citing France (1789) and the USSR (1991). You could argue that these are false analogies. The French state was embedded in a broader, resilient civil society and economy that continued to function; the palace systems of the Bronze Age *were* the civil society and economy. In a palace economy, the political system is not a layer on top of society; it is the operating system of society.
  *   **The Cost:** Striking (5) requires you to defend a distinction between 'state' and 'society' that is often messy. You would have to argue that some political systems are so totalising that their end *is* a societal collapse, while others are not. This risks circularity: how do you know a system was totalising? Because its end was a collapse. How do you know it was a collapse? Because the system was totalising. It also forces you to argue against the intuition that modern regime changes are fundamentally similar to ancient ones, which requires significant historical justification.

  A third candidate is **(2)**, which limits the candidates to people, culture, or political system.
  *   **The Cost:** Striking (2) allows you to say that 'social complexity' is the thing that disappears. However, without striking (1), this does not help you. If you keep (1) (something must cease to exist), you still have to prove that 'complexity' is a 'thing' that can cease to exist rather than a property that changes. It is philosophically cleaner to adjust the definition of collapse (1) than to reify 'complexity' as an independent object (2).

  **Which rejection is cheapest**
  Rejecting **(1)** is the cheapest option. It requires the least historical gymnastics and aligns best with the systems-theory approach you have already encountered in Tainter. Tainter does not define collapse as the disappearance of a people, but as a sharp decrease in socio-political complexity. By keeping (1), you are inadvertently arguing against Tainter while claiming to use him.

  Rejecting (1) allows you to keep the factual accuracy of (3) and (4) (people and culture persist) without accepting the nihilistic conclusion of (7). It permits you to say that a society can suffer a catastrophic loss of function without its constituents dying or forgetting their names. It preserves the descriptive content of 'collapse' (a measurable loss of capacity) without smuggling in the evaluation that the people themselves vanished.

  **A revised formulation for your opening paragraph**
  To avoid begging the question while retaining descriptive rigour, you might formulate the concept as follows:

  > 'In this project, "collapse" is defined not as the biological extinction of a population nor the total erasure of a culture, but as a rapid and substantial reduction in a society's capacity for socio-political complexity. It denotes a structural simplification wherein the institutions required to maintain specialised labour, long-distance trade, or monumental coordination cease to function, regardless of the continuity of the underlying population.'

  This formulation acknowledges the validity of the transformation critique (people survive) while securing the term 'collapse' as a description of a specific, measurable loss of organisational power, rather than a subjective verdict on regret.
