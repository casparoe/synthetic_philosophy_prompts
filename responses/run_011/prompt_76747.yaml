answer: |-
  **Handout: Disambiguating "Consciousness is an Illusion"**

  The slogan "consciousness is an illusion" is philosophically overloaded. It performs different argumentative work depending on what is being declared illusory: the accuracy of our reports, the properties of our experience, or the existence of experience itself. Below are three distinct theses ordered from anodyne to radical.

  **1. Introspective Fallibility**
  *   **Formulation:** We often misdescribe the contents of our experience, though the experience itself genuinely exists.
  *   **Verdict:** Substantive and live.
  *   **Data Compatibility:** Fully compatible; introspective reports are treated as fallible data requiring calibration.
  *   **Illusion Model:** *Change blindness.* You miss details in a scene, but the scene exists.
  *   **Transferability:** Transfers well. It acknowledges error without denying the subject matter.

  **2. Property Illusionism**
  *   **Formulation:** Experience exists, but it lacks the intrinsic, non-physical qualities introspection mistakenly attributes to it.
  *   **Verdict:** Substantive and live.
  *   **Data Compatibility:** Compatible; reports are treated as evidence of how things seem, not how they are metaphysically.
  *   **Illusion Model:** *The bent stick.* The stick is real, but the property of "bentness" is not in the object.
  *   **Transferability:** Transfers well. It distinguishes the vehicle of experience from the properties we project onto it.

  **3. Radical Illusionism**
  *   **Formulation:** It seems to us that we have phenomenal experience, but nothing actually possesses phenomenal properties.
  *   **Verdict:** Contested and potentially self-undermining.
  *   **Data Compatibility:** Incompatible; first-person reports are treated as false positives with no phenomenal referent.
  *   **Illusion Model:** *Phantom limb.* The limb feels present, but nothing corresponding to it exists.
  *   **Transferability:** Problematic. A phantom limb still feels like *something*; Radical Illusionism denies even the "feel."

  **The Appearance Objection**
  Standard illusions (bent sticks, phantom limbs) preserve the appearance: there is something it is like to be fooled. Thesis 1 and 2 preserve this appearance. Thesis 3 is vulnerable to the objection that it eliminates the appearance along with the reality. If there is no phenomenal character, there is no "seeming" to be fooled. Consequently, Thesis 3 risks being self-undermining: to claim consciousness is an illusion presupposes the phenomenal character of the illusion itself. A reading cannot coherately be an illusion claim if it denies the very medium in which the illusion appears. Thesis 3 survives only if it redefines "seeming" in purely functional terms, but this changes the subject from phenomenal consciousness to cognitive access.

  **Logical Geography**
  Theses 2 and 3 are often indistinguishable in practice. If the only property experience seems to have is phenomenal character, denying the property (Thesis 2) amounts to denying the existence (Thesis 3). This conflation is common because it is unattractive to admit experience exists but has no properties. Conversely, the combination "Reports are accurate, but referent is non-existent" is unoccupied because it is incoherent; an accurate report must refer to something. The combination "Reports are inaccurate, and referent is non-existent" is logically possible but rarely held, as it offers no explanation for why the reports occur.

  **Speaker Analysis**
  *   **The LLM Seminar Speaker:** Invoked **Thesis 3**. They argued the question of machine sentience is empty because human sentience is also illusory. Their conclusion survives only if one accepts that "consciousness" refers to a non-existent property; however, if consciousness denotes functional capacity, the question remains live.
  *   **The Public Debater:** Invoked **Thesis 3**. They claimed the hard problem dissolves because there is nothing on the far side of the explanatory gap. This survives rhetorically but faces the Appearance Objection: dissolving the gap by denying the phenomenon leaves the intuition of the gap unexplained.
  *   **The Psychologist Friend:** Conflated **Thesis 1 and 3**. They moved from "introspection is unreliable" (Thesis 1) to "experience is nonexistent" (Thesis 3). This is a straight conflation. Inaccurate reports (Thesis 1) are still data about the cognitive system producing them; discarding them entirely (Thesis 3) loses evidence about the error mechanism itself.

  **Recommendation**
  The slogan should be abandoned in favor of precise claims. "Consciousness is an illusion" invites the confusion seen in these three rooms. It obscures the crucial distinction between denying the *accuracy* of introspection and denying the *existence* of the introspected. Dropping the slogan loses rhetorical punch but gains clarity. Replace it with "Introspection is unreliable" (Thesis 1) or "Phenomenal properties are not fundamental" (Thesis 2). Only Thesis 3 warrants the word "illusion," but given its vulnerability to the Appearance Objection, it is better stated as "Phenomenal consciousness is a user-illusion generated by functional processes." Precision prevents the slogan from doing too much work in too many rooms.
