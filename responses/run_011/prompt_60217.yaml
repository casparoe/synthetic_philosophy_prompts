prompt: |-
  So I work on ranking and reward-model stuff — the model spits out a scalar score for each candidate item and internally we all just call it "utility," and last week this turned into a two hour argument on slack. Half my team thinks the number is a real quantity we're estimating badly, the other half (including me, mostly) thinks it's just a relabeled description of the clicks we trained on, i.e. we're not measuring anything, we're renaming our own training data. My roommate did a philosophy degree and I tried to use him as a lookup table but he kept saying "it depends which concept of utility you mean" and then wouldn't say what the options cost you. So before I read anything more about this I want the spec. What does an account of what utility *means* have to deliver to count as adequate? Set the bar at "good enough that I could say out loud what the number my team ships actually is, and defend it," not "good enough for a journal."

  Give me the requirements list — the phenomena it has to explain, the cases it has to get right, the distinctions it's not allowed to collapse, the formal results it has to be consistent with — with the case or consideration behind each one, not just the label. Some things I'd expect to see on there and want to know whether they actually belong: the money-pump thing where intransitive preferences over time get you drained for cash; menu dependence, because our own A/B tests show that adding a clearly dominated third option shifts what people pick, which seems to break any story where utility is a property of the outcome rather than the lineup; preference reversals where choosing and pricing disagree about the same pair; the Allais-style cases; the polite-guest case where someone deliberately takes the smaller portion and you'd be a fool to say that's what he wanted most; the sour-grapes / adaptive-preference case where a person's wants shrink to fit her options, so revealed choices look content while welfare is quietly being destroyed; aggregation across people, since we do ship one score used across a whole population; and whatever the non-uniqueness of the representation theorems implies — if the scale is only pinned down up to a positive affine transformation, does the number carry more content than an ordering, less, or exactly the same? Also flag the distinctions that have to stay separate: utility-as-what-choice-reveals vs utility-as-measure-of-welfare vs utility-as-felt-desire; evidence for something vs identical to it; ordinal vs cardinal; consistency axioms vs substantive rationality; dispositional vs occurrent.

  Then the part I actually care about most. Which of these requirements are load bearing and which are just camp prejudices being smuggled in — is testability a genuine demand, or does the as-if instrumentalist get to shrug it off, and does an account have to make utility measurable in principle, or measurable in practice, or neither? And is there a subset that's jointly unsatisfiable? My suspicion is that "utility is whatever choice reveals," "utility tracks welfare," and "the theory says something that could come out false" can't all hold at once, and that basically everybody picks two, but I want to be told which pair each camp keeps and what they pay for it. Related: results like Afriat's seem to say any dataset that's consistent enough can be fit by some utility function, and I can't tell whether that makes revealed preference empty, or nonempty but about something other than welfare, or whether the content just relocated into the axioms — sort this out for me. Finish by naming the single requirement that knocks out the most candidate accounts, and then a short scorecard of the main contenders against your list — brief, the list is the deliverable and the scorecard is a bonus. No bibliography or reading list, I can't chase references on a work laptop anyway. A table is fine.
