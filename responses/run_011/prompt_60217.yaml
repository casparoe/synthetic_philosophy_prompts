answer: |-
  Here is the spec for an adequate account of utility, tailored to your context (ranking/reward modeling) and the philosophical constraints you're running into.

  ### Part 1: The Spec (Requirements for Adequacy)

  To defend the number your team ships, an account of utility must satisfy these six requirements. If it fails one, it collapses into either tautology (empty math) or metaphysics (unmeasurable magic).

  | Requirement | The Constraint | The Case / Consideration |
  | :--- | :--- | :--- |
  | **1. Non-Tautological Content** | The theory must be capable of being proven wrong by data *not* used to fit the parameters. | **Afriat's Theorem:** Any finite set of consistent choices can be rationalized by *some* utility function. If your account says "Utility is whatever explains the clicks," it is always true and therefore says nothing. The account must specify constraints on the function class (e.g., smoothness, context-independence) that data *could* violate. |
  | **2. Choice-Welfare Distinction** | The account must distinguish between *what was chosen* and *what was good for the chooser*. | **The Polite Guest:** A guest chooses the smaller apple to be polite. Revealed preference says they wanted the smaller apple. Welfare says they wanted the larger one but traded off social norms. If your score claims to measure "user satisfaction" but trains on "clicks," you fail this unless you model the constraint. |
  | **3. Context Stability (or Explicit Modeling)** | Utility values must either be stable across menus or the context effect must be part of the utility function's input. | **Menu Dependence:** Your A/B tests show a dominated option shifts choice. Standard utility says $U(A) > U(B)$ regardless of $C$. If your model treats $U(A)$ as a property of $A$ alone, it is falsified by the data. You must either admit $U$ is a function of the *set*, or admit you are modeling *choice probability*, not *utility*. |
  | **4. Cardinality Justification** | If the loss function treats the scalar as a magnitude (e.g., MSE, margin width), the account must justify cardinality, not just ordinality. | **Affine Transformation:** Representation theorems (vNM) often only pin utility down to positive affine transformations ($U' = aU + b$). If your ranking only needs order, magnitude is noise. If your RLHF loss uses the *gap* between scores, you are assuming interpersonal or inter-temporal intensity comparability. The account must explain what that distance *is*. |
  | **5. Aggregation Coherence** | The account must specify what happens when you sum or average utilities across users. | **Population Ranking:** You ship one score used across a population. Summing ordinal utilities is mathematically meaningless. Summing cardinal utilities requires a common zero and unit. If you average scores across users, you are implicitly claiming a "util" for User A is the same size as a "util" for User B. The account must defend this unit comparability. |
  | **6. Temporal Coherence** | The account must handle preference changes without labeling all changes as "errors" or all as "updates." | **Sour Grapes / Adaptation:** If a user stops clicking on high-quality content because the feed degraded, did their utility change (adaptation) or is the measurement broken (sour grapes)? An account that treats all revealed preferences as stable welfare metrics will optimize for addiction; one that treats all changes as noise will fail to adapt. |

  ---

  ### Part 2: Load-Bearing vs. Camp Prejudices

  You asked which requirements are real and which are tribal. The core tension is a **Trilemma**. You cannot hold all three of the following positions simultaneously. Every camp drops one.

  1.  **Revealed Preference:** Utility is defined strictly by observed choice.
  2.  **Welfare Realism:** Utility tracks some objective "good" or "satisfaction" for the user.
  3.  **Empirical Risk:** The theory can be proven wrong by data.

  **The Camps:**

  *   **The ML/Industry Camp (You & your team, mostly):**
      *   **Keep:** Revealed Preference + Empirical Risk.
      *   **Drop:** Welfare Realism.
      *   **The Deal:** "The number predicts clicks. It is not 'happiness.' It is a propensity score."
      *   **The Cost:** You cannot ethically claim to "improve user well-being." You are optimizing engagement, which may correlate with welfare or may correlate with addiction. You must stop calling it "utility" in the welfare sense and call it "reward signal."
  *   **The Welfare Economist / Policy Camp:**
      *   **Keep:** Welfare Realism + Empirical Risk.
      *   **Drop:** Revealed Preference.
      *   **The Deal:** "Choices are noisy/biased indicators of true welfare. We need structural models to correct for bias (e.g., polite guest, addiction)."
      *   **The Cost:** You cannot observe the target variable directly. You need external data (surveys, physiological markers) to train, not just logs. Your model is unidentifiable from clicks alone.
  *   **The Dogmatic Micro Camp (Old School):**
      *   **Keep:** Revealed Preference + Welfare Realism.
      *   **Drop:** Empirical Risk.
      *   **The Deal:** "If they chose it, it was best for them. Theory cannot be wrong."
      *   **The Cost:** The theory is empty (tautological). It offers no predictive power beyond the data it was fit on (Afriat). It cannot explain mistakes, addiction, or manipulation.

  **Load-Bearing Requirement:** **Empirical Risk (Non-Tautological Content).**
  This is the only one that forces the math to touch the world. If you drop this, you are doing curve-fitting, not science. If you keep it, you are forced to admit that your training data (clicks) might be a *biased measure* of your target (utility), which breaks the "Utility = Clicks" identity.

  **Afriat's Theorem Resolution:**
  Afriat does not make revealed preference empty; it relocates the content. The content is not in the *existence* of a utility function (there always is one). The content is in the **simplicity/stability constraints** you place on that function.
  *   *Empty:* "There exists some function $U$ that fits these 1,000 clicks." (Always true).
  *   *Contentful:* "There exists a *smooth, context-independent* function $U$ that fits these 1,000 clicks *and* predicts the next 100." (Can be false).
  *   *For your team:* Your content comes from the architecture constraints (e.g., transformer weights) and regularization. If you overfit, you are in the Afriat trap (rationalizing noise). If you generalize, you are claiming there is a stable underlying signal.

  ---

  ### Part 3: The Single Killer Requirement

  **"Out-of-Sample Predictive Risk on Counterfactual Menus."**

  This requirement knocks out the most candidate accounts because it forces you to commit to whether utility is a property of the **item** or the **choice event**.

  *   **Why it kills Naive Revealed Preference:** If utility is just a relabeling of past clicks, you cannot predict choices when the menu changes (e.g., adding a dominated option). If you fail this prediction, your "utility" was just a memory of history, not a quantity.
  *   **Why it kills Naive Welfare Realism:** If utility is "true happiness," you should be able to predict that a user *would* be happier with Item A, even if they click Item B. If you can't measure that gap without circularity, your welfare metric is metaphysical.
  *   **Why it kills the "Affine Doesn't Matter" crowd:** If you change the menu and the *magnitude* of the score gap changes (not just the rank), your loss function is optimizing a number that has no stable meaning.

  To defend the number you ship, you must be able to say: *"This scalar represents the log-odds of selection **conditional on this specific menu distribution**. It is not a property of the item, nor a measure of welfare. It is a context-dependent propensity."* Any account that claims more than this is lying.

  ---

  ### Part 4: Scorecard of Contenders

  | Account | Choice = Utility? | Tracks Welfare? | Falsifiable? | Verdict for ML Ranking |
  | :--- | :--- | :--- | :--- | :--- |
  | **Naive Revealed Preference** | **Yes** (Definition) | **Yes** (By definition) | **No** (Tautology) | **Fail.** Cannot explain menu effects or bias. Good for fitting history, bad for generalization. |
  | **Random Utility Model (RUM)** | **No** (Probabilistic) | **No** (Structural) | **Yes** (Distributional) | **Pass.** Treats score as mean of distribution. Handles noise. Still struggles with context effects unless specified. |
  | **Hedonic Realism** | **No** (Choice is noisy) | **Yes** (Target) | **Yes** (If measured) | **Fail (for you).** Requires data you don't have (feelings, not clicks). Your training signal is misaligned with target. |
  | **Pragmatic Instrumentalism** | **Yes** (Operational) | **No** (Irrelevant) | **Yes** (Predictive) | **Pass.** "Utility is the number that minimizes loss." Honest. Drops welfare claims. **This is your defensible position.** |
  | **Ideal Advisor** | **No** (Counterfactual) | **Yes** (Informed desire) | **No** (Unobservable) | **Fail.** Philosophically robust, engineeringly impossible. Cannot train on "what they would want if informed." |

  **Recommendation:** Adopt **Pragmatic Instrumentalism** publicly. Tell your team: *"The scalar is a context-dependent propensity score derived from historical choice data. It is ordinal in truth but treated as cardinal for optimization. It does not measure welfare, it predicts engagement. Any welfare claims are external assumptions, not model properties."* This satisfies the Spec, respects the Trilemma, and survives the Afriat check.
