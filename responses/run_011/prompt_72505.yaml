answer: |-
  1. **The Residue Problem**
  You say transparent white lies wrong no one. The hearer knows, or would agree. Yet we still feel uneasy about them. Is that feeling just a mistake?

  *Follow-up:* I expect you'll say it's residual guilt from old norms. But if our moral feelings are systematically wrong here, why should we trust them anywhere else? Doesn't that undermine the intuition pump you used to build the theory?

  2. **Endorsement: Actual vs. Hypothetical**
  You say a lie is okay if the hearer endorses it. Whose endorsement counts? Do you need their actual consent? Or just what they *would* consent to?

  *Follow-up:* You'll likely say "what they would consent to" covers more cases. But if you don't ask them, aren't you just guessing? How is that different from the deception you're trying to avoid?

  3. **The Paternalism Squeeze**
  Let's press that last point. If you use hypothetical endorsement, you decide what's reasonable for them. That looks like paternalism. If you use actual endorsement, you can't explain why lying to stubborn people is wrong. Which horn of the dilemma do you take?

  *Follow-up:* If you pick hypothetical endorsement, you admit the liar decides the value of the hearer's deliberation. Isn't that just usurpation by another name? How is your view distinct from the one you criticize?

  4. **Cultural Contrast**
  You contrast Dutch directness with Japanese indirection. You call the latter benevolent usurpation. Is this a claim about moral norms? Or is it just about who does the inferential work?

  *Follow-up:* You'll probably say it's about the distribution of labor. But how do you measure that labor without just redescribing the stereotype? What data counts against your reading of the culture?

  5. **Non-Paradigmatic Hearers**
  Consider a child. Or someone with advanced dementia. They cannot form complex beliefs about the world. Is lying to them usurpation? There is no deliberation to hijack.

  *Follow-up:* You might say we act as trustees for their future selves. But then the wrong isn't to the person in front of you. It's to a ghost. Does your theory actually care about the present victim at all?

  6. **Bluntness and the Right Not to Know**
  You say bluntness can dump costs on the hearer. Can it be wrong to tell the truth? Is there ever a right not to be told?

  *Follow-up:* If you say yes, you admit speech can violate autonomy even when it's true. Doesn't that collapse your view back into a standard harm principle? What work is "usurpation" doing then?

  7. **Kant and the Murderer**
  Kant said never lie to the murderer at the door. You say lying is about usurpation. Do you owe Kant the same verdict? Must you tell the truth?

  *Follow-up:* If you say you can lie, you prioritize safety over deliberation. But you said deliberation is the core value. Why does survival trump autonomy in this case, but not in others?

  8. **The Transparency Threshold (No "It Depends")**
  Here is a specific case. You tell a lie. The hearer suspects it is a lie. They do not know for sure. They keep listening. Is this usurpation? You must answer Yes or No.

  *Follow-up:* If you say Yes, then suspicion blocks usurpation. If you say No, then uncertainty is enough. You cannot say "it depends on the suspicion level." Where is the bright line? Why there?

  9. **Falsification**
  Final question. What argument or evidence would make you abandon the usurpation story? What would convince you to go back to a plain deception-based view?

  *Follow-up:* You'll likely say "a better explanation of the cases." But conceptual claims are hard to falsify. Is there any real world scenario that could prove you wrong? Or is this theory immune to error?

