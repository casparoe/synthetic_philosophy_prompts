prompt: |-
  You're a philosopher of mind who's spent real time on consciousness and moral status — advise me, don't survey me. I read a lot of the animal-welfare and consciousness blogging, and I keep feeling like the "sentience comes in degrees" conversation is stuck in a rut: everybody argues about *how much* a bee or an octopus or (joke version) a thermostat feels, i.e. intensity. But I think there are at least three separate axes getting lumped together:

  1. intensity — how loud or bright a given experience is;
  2. breadth and unity — how many experiences at once, and whether they're bound into a single subject, which matters if you care about the number of welfare subjects rather than the total amount of experience;
  3. temporal thickness — whether the experience has anticipatory and retrospective reach: dread, relief, remembering being hurt, caring about what happens next week.

  My hunch is that most of the practical disagreements — bugs vs fish vs mammals, whether to weight by neuron counts, whether fission or splitting-brain cases break the moral math — are really disagreements about axis 2 or 3 masquerading as disagreements about axis 1.

  So: I've got roughly a year of nights and weekends to write stuff, and I want to aim it well. Which open questions in this area are actually worth the year, and which are traps — questions that look deep but where settling them wouldn't change any decision anyone makes? I want a defended ordering, not a list. For your top two or three, tell me what the question precisely is, why it's upstream of other questions, whether someone with philosophy-of-mind training but no wet lab and no grant can make progress on it, and what would count as progress rather then more sophisticated hedging. Also: which of the three axes do you think is doing most of the moral work, and what argument or evidence would move it up or down for you?

  Think out loud first — two or three paragraphs of brainstorming, including at least one question you considered and rejected and why. Then lead with the ranking (bottom line up front) and defend it. Hard cap 900 words, brainstorming included. No bibliography or reading list, I'll chase references myself.
