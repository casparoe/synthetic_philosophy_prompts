          *   *Requirement:* The theory must allow context to shift the similarity metric (whether to hold the past fixed or allow it to vary to make the antecedent true).
          *   *Status:* Non-negotiable. Both readings occur naturally.

      *   **3. Counterpossibles (Impossible Antecedents):**
