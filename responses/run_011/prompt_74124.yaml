answer: |-
  You are asking for the architectural load-bearing walls, not the interior decoration. You want to know what breaks the machine if you remove it. Here is the specification for an adequate semantics of counterfactuals, stripped of the partisan scorekeeping, with the specific tensions you highlighted laid bare.

  ### The Desiderata

  **1. The Oswald Pair (Indicative vs. Subjunctive)**
  *   **The Phenomenon:** You can accept 'If Oswald did not kill Kennedy, someone else did' (Indicative) while rejecting 'If Oswald had not killed Kennedy, someone else would have' (Subjunctive).
  *   **The Puzzle:** The antecedents look nearly identical; the consequents are the same. Yet the truth values diverge. The indicative tracks *epistemic* probability (given what we know, someone else must have); the subjunctive tracks *causal* or *metaphysical* dependence (the conspiracy wasn't robust enough to ensure a backup).
  *   **The Requirement:** The theory must distinguish between updating a belief state (indicative) and manipulating a world state (subjunctive). It cannot treat 'if' as a univocal operator across both moods.
  *   **Status:** **Non-negotiable.** This is a brute linguistic datum. Any theory that collapses this distinction fails to describe English.

  **2. Backtracking vs. Non-Backtracking Readings**
  *   **The Phenomenon:** Consider: 'If I had pulled the trigger, the gun would have jammed' (Non-backtracking: we hold the past fixed, change the present, run physics forward). Contrast with: 'If I had pulled the trigger, I would have been desperate' (Backtracking: we infer that for me to pull it, the past must have been different).
  *   **The Puzzle:** How does the listener know whether to hold the past fixed or allow it to vary to make the antecedent possible? Standard similarity metrics usually prioritise avoiding 'miracles' (law-breaking) over matching particular facts, which favours backtracking, yet we often want non-backtracking readings.
  *   **The Requirement:** The theory must allow the 'similarity metric' (the criteria for selecting the nearest possible world) to be context-sensitive. It must explain what triggers a shift from standard causal projection to diagnostic backtracking.
  *   **Status:** **Non-negotiable.** Both readings occur naturally. A theory that permits only one is empirically false.

  **3. Counterpossibles (Impossible Antecedents)**
  *   **The Phenomenon:** 'If this wooden cube were a sphere...' or 'If 2+2 were 5...'
  *   **The Puzzle:** Classically, if the antecedent is impossible, the conditional is vacuously true. But intuitively, 'If 2+2 were 5, then 4+4 would be 10' feels true, while 'If 2+2 were 5, then 4+4 would be 9' feels false.
  *   **The Requirement:** The theory must decide whether to treat impossible antecedents as trivial (all true) or non-trivial (distinguished by logic within the impossible world).
  *   **Status:** **House Style.** The orthodox Lewis-Stalnaker view says vacuous truth (trivial). The 'impossible worlds' camp says non-trivial. For a novelist, the orthodox view is useless (magic systems break laws); for a logician, it's tidy. You cannot have both tidiness and utility here.

  **4. Conditional Excluded Middle (CEM)**
  *   **The Phenomenon:** Does 'If A had happened, B would have' OR 'If A had happened, B would not have' exhaust the options?
  *   **The Puzzle:** If there is no *single* closest world where A happens, but rather a tie between a B-world and a not-B-world, then neither conditional is true. CEM fails.
  *   **The Requirement:** The theory must commit to whether the selection of the 'nearest world' is unique (Stalnaker) or allows for ties/clusters (Lewis).
  *   **Status:** **House Style.** This is the primary fault line between the two dominant camps. It is not forced by the data, but by a preference for logical bivalence.

  **5. The Free Will / Miracle Problem**
  *   **The Phenomenon:** 'If I had chosen otherwise...'
  *   **The Puzzle:** In a deterministic world, for you to choose otherwise, either the past must change (backtracking) or a law of nature must be broken (a small miracle at the moment of choice). Lewis argues we prefer small miracles to preserve the past; others argue this makes human agency inexplicable.
  *   **The Requirement:** The theory must account for agency without rendering the antecedent logically incoherent or requiring a massive rewrite of history for every minor choice.
  *   **Status:** **Non-negotiable (Conceptually).** If your theory implies that for you to have raised your left hand, the Big Bang must have been different, it clashes with our fundamental notion of local agency.

  **6. The Probability Triviality Result**
  *   **The Phenomenon:** We naturally assess conditionals probabilistically. 'It is likely that if it rains, the match will be cancelled.'
  *   **The Puzzle:** David Lewis proved (1976) that you cannot generally equate the probability of a conditional, $P(A \rightarrow B)$, with the conditional probability, $P(B|A)$. If you assume they are the same, the probability function collapses (triviality).
  *   **The Requirement:** An adequate account must explain why the equation *seems* right (Adams' Thesis) while acknowledging it cannot hold as a strict semantic identity for all propositions.
  *   **Status:** **Non-negotiable (Mathematical).** This is a theorem, not a debate. You cannot have the equation hold universally without breaking probability theory.

  ***

  ### The Fiction Constraint (Your Addition)

  **7. The Genre/Textual Metric**
  *   **The Phenomenon:** In your novel, 'If the Duke had survived' is evaluated against the laws and history of *your book*, not the actual world.
  *   **The Puzzle:** Standard semantics takes the 'actual world' as the fixed point for similarity. In fiction, the 'actual world' is the text's canon. Furthermore, genre dictates similarity: in a thriller, psychological realism weighs heavily; in space opera, physics might be lightweight.
  *   **The Requirement:** The theory must treat the 'base world' for similarity comparisons as a variable parameter, not a fixed metaphysical absolute.
  *   **Status:** **Non-negotiable (for a general theory of language).**
      *   *Is it just pretence?* Some philosophers (e.g., Walton) treat fiction as a separate game of make-believe, distinct from truth-conditional semantics. They would say the theory of counterfactuals applies to reality, and fiction is a separate module.
      *   *Why that fails:* This is an evasion. We use the same grammatical structures and inferential patterns in fiction as in reality. If the theory requires a different engine for fiction, it is not a theory of *conditionals*; it is a theory of *actual-world conditionals*.
      *   *Impact on the list:* If you accept this, it reinforces **Desideratum 2 (Context Sensitivity)**. It suggests that the 'laws of nature' used to measure similarity are not God's laws, but the *salient* laws of the context. This actually helps with **Counterpossibles (3)**: in a fantasy novel, magic is a law. Breaking magic is a 'miracle'. It normalises the idea that 'necessity' is context-bound.

  ***

  ### Joint Unsatisfiability and The Triviality Result

  You asked specifically about the probability result. To be blunt: **You cannot have it all.**

  Lewis's triviality result demonstrates that if you treat conditionals as standard propositions (things that can be true or false) *and* you insist that their probability always matches the conditional probability ($P(B|A)$), the system collapses. There are simply not enough truth-values to go round.

  This forces a choice:
  1.  **Deny conditionals are propositions:** They don't have truth conditions, only assertibility conditions (Adams/Edgington). This saves the probability intuition but sacrifices the ability to embed conditionals in larger logical structures (e.g., 'If if A then B, then C').
  2.  **Deny the equation holds universally:** Accept that $P(A \rightarrow B) = P(B|A)$ is a useful heuristic that fails in complex cases (Lewis).
  3.  **Complicate the semantics:** Introduce impossible worlds or variably strict operators to create enough 'space' for the probabilities to work (Stalnaker/Jeffrey).

  For your purposes as a novelist, option 2 is the least damaging. It admits that while readers *feel* the probability match, the underlying truth logic is more rigid.

  ***

  ### The Sacrifice: Which Requirement to Ditch?

  If I were forced to drop one requirement to save the coherence of the rest, I would ditch **Conditional Excluded Middle (CEM) — Desideratum 4**.

  **Why?**
  CEM demands that for any antecedent $A$, there is a *unique* closest world where $A$ is true. This is a metaphysical extravagance. Why should the universe arrange itself so that there is always one single 'most similar' scenario? It is entirely plausible that there is a cluster of equally similar worlds, some where $B$ happens and some where it does not.

  If you ditch CEM, you accept that sometimes neither 'If A, B' nor 'If A, not-B' is true. Instead, 'If A, it might be B' is the fundamental truth. This aligns better with **Desideratum 6 (Probability)**. If there is a tie between worlds, the probability splits, which explains why we feel comfortable assigning probabilities less than 1 to conditionals.

  **What argument would change my mind?**
  I would reinstate CEM as non-negotiable if you could demonstrate that **negation in natural language requires bivalence for communication to function.**

  Specifically, if you can show that in betting or legal contexts (e.g., 'I bet that if the Duke had lived, the war would have ended'), the lack of a truth value creates a paradox that cannot be resolved by 'might'-conditionals. If a theory cannot tell the bettor whether they won or lost because the world 'tied', the theory is pragmatically useless. If you can prove that human decision-making *requires* the uniqueness assumption to avoid paralysis, then CEM moves from 'House Style' to 'Non-negotiable'.

  ### Summary for the Novelist

  1.  **Oswald Pair & Backtracking:** Keep these. They are the bedrock of how readers process your plot twists.
  2.  **Probability:** Accept the triviality result. Do not try to make your narrative logic perfectly align with Bayesian probability; it's a category error.
  3.  **Fiction:** Do not let philosophers tell you this is 'just pretence'. Insist that your text establishes the 'actual world' for the duration of the reading. This validates your world-building as a semantic act, not just decoration.
  4.  **CEM:** Feel free to ignore this. Your readers will not notice if there isn't a single unique world where the Duke survives, provided the narrative salience is clear.
  5.  **Miracles:** This is your biggest hurdle. If you write hard alt-history, you must decide: does changing one event ripple back to the Big Bang (backtracking), or do you allow a 'local miracle' at the point of divergence? Most readers prefer the local miracle (non-backtracking), even if physicists hate it.

  You are not looking for the Truth of counterfactuals; you are looking for the *felicity conditions*. A theory that gets the truth conditions right but makes the story unreadable is, for your purposes, false.
