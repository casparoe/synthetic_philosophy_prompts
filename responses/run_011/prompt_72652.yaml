answer: |-
  The single biggest risk to this session is that the students treat the vignettes as a quiz with a correct answer rather than a probe of their own intuition, which kills the phenomenological force of the effect and invites them to answer based on what they think you want to hear. The design handles this by forcing a private written commitment before any discussion takes place and by wagering sweets on their prediction of their peers rather than the correctness of the philosophical view, which shifts the incentive from pleasing you to modelling the room.

  You need two fresh vignettes that are morally evaluable but mundane, and the best skin for this is a workplace relocation decision because it involves clear trade-offs without triggering political identity protection. In the first vignette, the Vice President of a company decides to move the office to a cheaper building to increase profits, knowing that this will increase the average commute time for the staff. In the second vignette, the Vice President decides to move the office to a cheaper building to increase profits, knowing that this will decrease the average commute time for the staff. For this pair to be a fair contrast, the agent's attitude towards the side effect must be identical and neutral in both cases, typically phrased as he does not care about the commute either way, he only cares about the profits. You must not have the agent sound reluctant in these first two cases, because reluctance introduces a confound about whether the outcome was part of his plan, and you must not describe the side effect as merely possible, it must be described as a known certainty, otherwise the students will discount it as negligence rather than intention. The only variable that changes is the valence of the side effect, increasing versus decreasing the commute, which allows you to isolate whether the moral quality of the outcome drives the intentionality judgement.

  The third vignette is the discriminator you need to separate the blame-based explanation from the character-based explanation, and this requires tweaking the agent's attitude while keeping the outcome bad. In this case, the Vice President moves the office to increase profits, knowing it will increase the commute, but he explicitly states that he regrets this outcome and wishes he did not have to do it, though he feels he has no choice. If the students judge this action as intentional, it supports the blame-based story that we attribute intentionality whenever a bad outcome occurs so that we have a target for our moral criticism, regardless of the agent's internal state. If they judge it as unintentional, it supports the character-based story that intentionality tracks whether the outcome expresses the agent's own values and deep self, since here the outcome clashes with his expressed regrets. You will give this vignette to everyone after the first round so you can compare the rates of intentional attribution across the standard harm case and the reluctant harm case.

  To run this, you should prepare two sets of printed slips, one marked A and one marked B, and as the students enter, hand them out alternately so that the left side of the room gets version A and the right side gets version B, ensuring physical separation to prevent peeking. Each slip contains the vignette, a question asking whether the VP intentionally brought about the side effect, and a second question asking them to predict whether the majority of the students holding the other letter will say it was intentional. Tell them that anyone whose prediction matches the actual majority view of the other group wins a chocolate, which keeps them engaged in the social modelling aspect without revealing the result prematurely. Give them five minutes to read and write in silence, emphasizing that there are no right answers and that you want their gut reaction, then collect the slips in two separate piles so you can tally them while they take a brief pause. You can tally this in under five minutes by simply counting the yes and no responses for each pile and drawing two quick bar charts on the whiteboard, one for group A and one for group B, labeling them only as Group A and Group B until the reveal.

  The running order should begin with a five-minute introduction where you set the ground rules about privacy and guessing, followed by fifteen minutes for the first vignette task including writing and collection. Spend ten minutes revealing the counts and letting the initial shock of the asymmetry settle, then distribute the third vignette to everyone for a ten-minute reading and response period. The remaining forty-five minutes are for the debrief, which should start by asking what they noticed about the two charts on the board without using any technical terms. The second question should ask why they think the numbers differed, prompting them to articulate the role of the side effect's value. The third question should introduce the reluctant VP case and ask whether the numbers shifted, which leads directly into the fourth question about whether intentionality is about the mind or about our desire to blame. The final question should ask them whether the word intentional means the same thing in both cases, which opens the door to discussing semantic contextualism versus performance error.

  You must be prepared for several things to go wrong, starting with the student who answers intentional to everything and announces it loudly, which you should handle by thanking them for their view but reminding the room that the experiment relies on the aggregate pattern, not individual exceptions. If students catch on and start answering to be interesting rather than honestly, you need to intervene early by reiterating that the sweets are for accurate prediction of the room, not for giving the most clever answer, which realigns their incentive with honesty. If someone shouts the result across the room halfway through, acknowledge it casually and ask everyone to finish their sheet anyway to keep the data clean, then proceed with the tally as planned. The real possibility you must face is that with eighteen people the numbers come out flat or backwards, and if this happens, you should not fake the result but instead use it as a teaching moment about statistical power and noise. Tell them that in a room this size, random variation can easily swamp the effect, and ask them what we would need to change to be sure, which transitions naturally into a discussion about sample sizes and replication crises in psychology.

  Finally, you need to be honest with them about what this activity cannot reproduce, specifically that a seminar run once on eighteen people is not a measurement and wording sensitivity in this literature is brutal. You should tell them explicitly that you are not claiming they have just replicated a finding, but rather that they have experienced the phenomenon that prompted the research, and that the robustness of the effect depends on features you had to supply by hand afterwards. Explain that in the actual literature, these vignettes are tested on hundreds of people with precise wording controls, and that the philosophical weight comes from the consistency of the pattern across those studies, not from today's count. This protects your credibility as an experimentalist while preserving the pedagogical value of the collision, ensuring they leave understanding the asymmetry without believing that moral psychology is easy to measure in a classroom.
