  Elena inherits a large estate divisible into three viable homesteads. Local families are ready to buy, build, and raise children into secure, happy lives. She can subdivide and sell cheaply, enabling three families to flourish, or sell intact to a single developer, enabling only one. She chooses the single sale. Her reason: the extra profit buys her a luxury boat. The children in the one-family outcome will have excellent lives; the two extra families in the alternative outcome would also have had excellent lives. No existing person is harmed. The children who never exist in the chosen outcome are not deprived, since they never exist. Yet, sacrificing two happy future lives for a boat strikes us as morally grotesque. Elena knows exactly what she is doing.

  (a) **Outcome A (Chosen):** One family exists (high quality life) + Elena (has boat). **Outcome B (Forgone):** Three families exist (high quality lives) + Elena (no boat). **Person-Check:** The children in A are not the children in B (different parents/timing/conditions). No one in A is worse off than in B (they wouldn't exist in B). The two missing families in A do not exist to be worse off.

  (b) The impersonal *same-number* principle requires holding population constant to compare average quality. Here, $N_A = 1$ family and $N_B = 3$ families. The principle has no purchase because the denominators differ; it cannot mathematically process variable identities without converting to a totalizing metric.

  (c) **Trivial Existence Prevention.** The agent prevents specific, happy people from existing solely for a negligible self-regarding gain, despite having the capacity to enable them.

  (d) If you fix the numbers (e.g., she chooses which *specific* three families get land), the same-number comparison activates: you compare the quality of life across the identical set of people. The verdict becomes straightforwardly impersonal without the nonidentity complication.

  (e) The counterattack lands. Your opponent will argue that *Total* Utilitarianism (an impersonal variable-number principle) condemns Elena because $Utility_B > Utility_A$. Your verdict ("Obviously Wrong") relies on counting the lost happiness of the non-existent, which *is* an impersonal principle. You have successfully blocked the *same-number* move, but not the broader impersonal strategy. To win, you must argue why Total Utilitarianism fails here, not just Same-Number.

  Verdict: Trivial existence prevention blocks same-number.
