answer: |-
  Thank you for inviting me to speak. It is a genuine privilege to stand here, in a room that used to be a squash court, and now holds something far more volatile. We have turned a place of solitary exertion into a place of shared attention. That is not a neutral act.

  I am a political theorist. My work concerns Jean-Jacques Rousseau, specifically his *Letter to d'Alembert on the Theatre*. You may know the headline: Rousseau told d'Alembert that Geneva would be a worse place if it built a playhouse. He argued that theatre does not primarily corrupt by showing us vice made attractive. Rousseau was too subtle for that. He knew that earnest, improving plays—plays that preach virtue—do nothing at all, because they only preach to people who were already convinced.

  His deeper objection was about labour. He argued that a performance appoints somebody to do your feeling and your judging on your behalf. When you watch Alceste in *The Misanthrope*, he is furious at the world so that you do not have to be. You spend two hours watching a man be sincere, and then you go home and the thing you were lent has gone back to its owner unused. The stage does not so much corrupt an audience's morals as relieve them of the work of having any.

  Rousseau called this alienation. I call it the deputy. The actor is a deputy for your emotions; the playwright, a deputy for your conscience. The festival Rousseau offers instead—the image of sticking a flowered stake in the middle of a square and letting the people be the show—is best read as an attempt to abolish the office of deputy, not to fill it with better ones.

  I tell you this because I am aware of the irony standing before you now. I am on a platform. I have a microphone. I am the first deputy this new theatre appoints. If I were to stand here and tell you that this room is virtuous, I would be asking you to let me do your judging for you. I would be asking you to enjoy my sincerity so you can return to your seats feeling virtuous by proxy. That is precisely the move Rousseau warned against. It is precisely the move this room makes easy.

  But there is a reason to build a room even if it is dangerous. In fact, there is only a reason to build a room if it is dangerous. A space that cannot alienate you is a space that cannot hold you. The risk of the deputy is the price of the gathering. We build this theatre not because it is safe, but because it concentrates us enough to risk something together. The donors who funded this conversion did not buy you a place to outsource your moral life. They bought you a place where you might reclaim it.

  The danger of this room is that you will come here to be passive. The purpose of this room is that you will come here to be present. The difference lies in who is doing the work. If you sit in the dark and let the stage do everything, you are clients of a deputy. If you sit in the light and recognize that the spectacle is incomplete without your active witness, you are citizens of the room.

  So, I am not going to wish you happy productions. I am not going to tell you this space will inspire you. Inspiration is something done to you. I want to invite you to do something that belongs to you, not me. I want to break the line of sight that makes me the deputy and you the clients.

  Please stand up.

  Do not look at me. Turn around. Face the back of the room. Look at the people behind you. Look at the donors, the students, the actors, the scholars. See who is here with you. This room is not built for what comes from the stage; it is built for what happens between you. The theatre is not the platform. The theatre is the gathering.

  Hold that sight for a moment. Recognize that you are the spectacle.

  Please sit.

  This space is now yours. Do not let me, or any actor, or any director, relieve you of the work of feeling it. Use it dangerously. Use it actively. Thank you.

  ***

  **Note on Liberties and Risks**

  1.  **The "Deputy" Terminology:** Rousseau uses *représentation* and *alienation* in the *Letter*, reserving *député* mostly for the *Social Contract*. I have mapped the political concept onto the aesthetic one. A specialist might object that this conflates his political and theatrical vocabularies, though the structural analogy (alienation of will/feeling) is defensible.
  2.  **Geneva vs. College:** Rousseau's argument is specific to Geneva's *moeurs* (customs) and size. Applying it to a college theatre universalizes a local argument. Rousseau might argue a college is neither a republic nor a monarchy, making the analogy imperfect.
  3.  **The Instruction:** Asking the audience to stand and turn is itself a command from a "deputy." I have leaned into the paradox rather than solving it; Rousseau might argue this is still heteronomy. The speech acknowledges this tension but proceeds anyway.
  4.  **The Festival:** The "flowered stake" is accurate, but translating an open-air civic festival into an indoor studio instruction is a significant adaptation. Rousseau's festival was about dissolving the stage entirely; here we are dissolving it only momentarily within a built structure.
