answer: |-
  Your unease is not romantic; it is analytical. You are identifying a mismatch between a **subsistence resilience model** and a **market-based intensification model**. Your boss is looking at a linear equation (Input → Yield → Calories). You are looking at a complex system (Labor + Risk + Social Cohesion + Ecology → Well-being).

  In development anthropology and economics, what you are describing is well-documented. You are witnessing a community that has optimized for **risk minimization and leisure**, and you are being asked to introduce a system that optimizes for **surplus and accumulation**. These are often mutually exclusive goals.

  Here is the breakdown of what is actually happening, why your model is missing it, and exactly how to articulate this in your meeting without using the word "dignity."

  ### 1. The "Four-Hour Day" is Efficiency, Not Laziness
  **The Reality:** In shifting cultivation and foraging systems, the marginal return on labor drops off quickly. Once food needs are met, there is no economic incentive to work more because there is nowhere to store the surplus and no market to sell it.
  **The Risk:** Wet-rice cultivation (which high-yield varieties usually require) is labor-intensive. It demands land preparation, transplanting, weeding, and water management.
  **The Argument:** "We are trading a high-efficiency livelihood for a high-labor one. If we introduce rice intensification, we aren't just adding calories; we are increasing the labor burden. In similar transitions, this labor is disproportionately absorbed by women and children, impacting education and health. We need to model **calories per labor-hour**, not just calories per capita. If labor hours double and calories increase by 33%, we have actually decreased their economic efficiency."

  ### 2. Mobility is Insurance, Not Instability
  **The Reality:** The "pack up and move over the ridge" conflict resolution is a sophisticated social safety valve. It prevents violence from escalating because exit costs are low. No land titles mean no one can be trapped in a dispute or a bad location.
  **The Risk:** Fixed plots, storage sheds, and locks create **exit costs**. If you build a shed and fence a field, you cannot easily move. If a conflict arises, or if the soil degrades, or if the microcredit terms become predatory, they are trapped.
  **The Argument:** "Their current mobility is a risk-management strategy. By requiring fixed plots and collateral, we are removing their primary mechanism for conflict resolution and climate adaptation. We are replacing **social insurance** (sharing/moving) with **financial insurance** (credit/locks). If the crop fails, they cannot move to relatives; they will be in debt. We need to assess the **debt-servicing risk** in a bad harvest year."

  ### 3. The "Lock" Creates Inequality
  **The Reality:** You noted that currently, stores spoil or are shared. This is a "moral economy." Surplus is circulated, preventing extreme wealth and extreme poverty.
  **The Risk:** A lock allows accumulation. Once accumulation is possible, stratification begins. Some families will succeed; others will fail. The successful ones will hire the unsuccessful ones. The "300 families" will cease to be a cohesive unit and will become a class system.
  **The Argument:** "The introduction of private storage and collateral fundamentally changes the social contract. We are introducing the mechanics of inequality. In M&E terms, we should look at **Gini coefficient projections**, not just average calorie intake. An average increase of 33% could mask a reality where 20% of households gain 100% and 20% lose everything to debt. Are we prepared to monitor social stratification as a negative externality?"

  ### 4. Calories $\neq$ Nutrition
  **The Reality:** They eat wild foods and herd animals. This provides protein, micronutrients, and variety.
  **The Risk:** High-yield rice is carbohydrate-dense. A shift to monoculture often leads to "hidden hunger" (micronutrient deficiency) even if caloric intake rises.
  **The Argument:** "Our metric is 'calories per person,' but that is a blunt instrument. A diet of 33% more rice but less wild game and forage may lead to higher caloric security but lower nutritional outcomes. We should be measuring **dietary diversity scores**, not just caloric volume."

  ### 5. The "Zomia" Context (The Boss's "10,000 Years" Comment)
  Your boss said, "People have been farming for ten thousand years." This is true, but it misses the point of *highland* farming.
  *   **Lowland farming** (rice paddies) is historically associated with state-building, taxation, and control. It is visible, fixed, and measurable.
  *   **Highland farming** (shifting/foraging) is historically associated with **avoiding** the state. It is mobile, hard to tax, and hard to control.
  *   **The Insight:** These people may not be "undeveloped"; they may be **strategically under-developed** to maintain autonomy.
  *   **The Argument:** "Highland livelihoods are often specifically adapted to remain independent of markets and states. By tying them to microcredit and fixed assets, we are integrating them into a market system they have historically avoided. This creates **dependency** on external inputs (fertilizer/seed) that they currently do not have. If the supply chain breaks or prices spike, their resilience collapses."

  ### How to Speak in the Meeting
  Do not frame this as "their culture is beautiful." Frame it as **"project sustainability and risk."** Donors hate risk.

  **Say this:**
  > "I am concerned that our logical framework assumes a vacuum. We are introducing fixed assets and debt into a liquidity-based, mobile society.
  >
  > 1.  **Risk Profile:** Currently, their risk is spread across the community and the landscape. Our project concentrates risk on the individual household via debt. If we have a drought in Year 3, do we have a plan for default? Because they have no collateral to seize without causing humanitarian harm.
  > 2.  **Sustainability:** The seeds require fertilizer. Is this a perpetual subsidy? If we leave in five years, can they afford the inputs? If not, the system collapses.
  > 3.  **Unintended Consequences:** We need to add indicators for **social cohesion** and **labor burden**. If calorie intake goes up but domestic violence or debt distress also goes up, has the project succeeded?
  >
  > I propose we pilot this with 10% of the households first, with a control group, and specifically monitor **asset loss** and **conflict resolution changes**, not just yield."

  ### Summary
  Your unease is tracking **Resilience vs. Efficiency**.
  *   **Current System:** High Resilience, Low Surplus, Low Labor, High Equality.
  *   **Proposed System:** Low Resilience (to market/shock), High Surplus, High Labor, High Inequality risk.

  You are not vetoing calories; you are vetoing **fragility**. If the boss insists on "vibes," tell him you are talking about **default rates** and **exit strategies**. Those are not vibes; they are financial realities.
