answer: |-
  Your hunch is sharp, but it stops one layer short of the metal. You are correct that the disagreement is not about the driver, and you are correct that the epistemic status of self-locating credence is the technical bottleneck. But the *substantive* disagreement is not merely about what to score (plans vs. acts); it is about the **ontology of the agent**.

  Here is the diagnosis, the nature of the substantive conflict, and what would actually count as progress.

  ### 1. The Diagnosis: The Breakdown of the Isomorphism
  Classical decision theory relies on a hidden axiom: **Perfect Recall**. Under perfect recall, there is an isomorphism between *ex-ante policy optimization* (choosing a rule at the start) and *interim action optimization* (choosing an act at the node). If you maximize expected utility at the start, you will naturally want to maximize it at every subsequent node, because your future self will share your current information and preferences.

  The Absent-Minded Driver (AMD) problem is not a paradox; it is a **proof of impossibility**. It proves that under Imperfect Recall, the isomorphism between Policy-Optimization and Action-Optimization breaks.

  *   **The "Ex-Ante" Camp** argues that the **Policy** is the unit of agency. They treat the driver as a single extended entity whose rationality is defined by the coherence of its life-trajectory.
  *   **The "Interim" Camp** argues that the **Instance** is the unit of agency. They treat the driver at the intersection as a distinct locus of control, constrained only by the information available *now*.
  *   **The "Credence" Problem** you identified is the symptom, not the disease. You cannot assign a coherent Bayesian probability to "I am at Exit 1" vs. "I am at Exit 2" without referencing the strategy that got you there. But if the strategy is the object of choice, you cannot use it to form the beliefs required to choose it. This is not just circular; it is a violation of the **Partition Assumption** required for conditionalization. Standard probability theory assumes you can partition the state space independently of your actions. AMD shows that with imperfect recall, your actions *define* the measure over the state space.

  So, the disagreement is not just "plans vs. acts." It is **Global Rationality vs. Local Rationality**. In almost all decision problems, these coincide. AMD is a stress test specifically designed to force them apart. The disagreement is about which one gets to define the word "Rational."

  ### 2. Is There a Substantive Disagreement?
  Yes. It is not merely verbal. It is a conflict between **Decision Theory** and **Game Theory**.

  When recall is perfect, a single-agent decision problem is distinct from a multi-agent game. When recall is imperfect, a single agent effectively fragments into multiple "selves" who cannot communicate.
  *   If you treat the problem as **Decision Theory** (Single Agent), you demand Dynamic Consistency. You conclude the ex-ante plan must bind. This requires a mechanism of pre-commitment that standard Causal Decision Theory (CDT) does not support.
  *   If you treat the problem as **Game Theory** (Multiple Selves), you accept Dynamic Inconsistency. The self at Exit 1 and the self at Exit 2 are players in a Nash Equilibrium. They optimize locally given their beliefs about the other player's move (which is just their own move, but they can't coordinate).

  The substantive disagreement is whether rationality requires you to **solve the Game** (accepting that your future self might betray your current plan) or **transcend the Game** (finding a decision theory that allows you to enforce the Policy despite the fragmentation).

  Most philosophers and economists assume CDT is the correct normative standard. Under CDT, the "Interim" view wins, and you must accept dynamic inconsistency. But proponents of newer frameworks (like Functional Decision Theory or Timeless Decision Theory) argue that CDT is descriptively inadequate for problems involving logical correlation between decision nodes. They argue the "Ex-Ante" view wins, but only if you upgrade the decision theory to recognize that the choice at Exit 1 is *logically linked* to the choice at Exit 2, even if they are causally independent.

  ### 3. What Counts as Progress?
  A theorem will not solve this. We already have the math (the divergence between the ex-ante optimum $p=1/3$ and the interim optimum $p=1$). A distinction will not solve this; we have distinguished the views clearly enough.

  Progress requires a **Reframing of the Control Structure**.

  **The Ill-Posed Verdict:**
  The problem is **well-posed**, but it is **category-error-prone** within standard Bayesian Causal Decision Theory. It is like asking a Newtonian physicist to calculate the orbit of an electron. The math works, but the ontology is wrong.

  **The Path to Progress:**
  Progress looks like abandoning the assumption that **Choice = Causal Intervention at a Node**.
  1.  **If you stay in CDT:** You must admit that "Rationality" is time-relative. There is no "Rational Plan," only "Rational-At-Time-$t$." This dissolves the paradox by accepting fragmentation. (Progress: Accepting that single-agent rationality is not a coherent concept under imperfect recall).
  2.  **If you want Unified Rationality:** You must adopt a decision theory that treats the agent as an **input-output function** rather than a sequence of events. In this framing (akin to Functional Decision Theory), the agent chooses the *output of the algorithm* that is running at both exits. Since the algorithm is identical at both exits, the outputs must be identical. This restores the isomorphism. The "credence" problem vanishes because you aren't updating on self-location; you are computing the expected utility of the algorithm's output across all instantiations.

  **Conclusion:**
  Your hunch about the epistemic question is right: standard credence is ill-defined here. But the deeper diagnosis is that AMD reveals **Causal Decision Theory is incomplete for agents with imperfect recall.**

  Progress is not solving the driver's dilemma within the old framework. Progress is recognizing that the driver's dilemma is a **reductio ad absurdum of the separation between planning and acting** in classical theory. The "solution" is to acknowledge that when recall is imperfect, you are not making a decision *at* an exit; you are selecting a policy *for* the exits. If your decision theory cannot represent policy selection as a primitive, the theory is what needs to be discarded, not the intuition that the ex-ante plan is superior.

  The disagreement persists only because half the field is trying to fix the driver, and the other half is trying to fix the decision theory. The latter group is the one making progress.
