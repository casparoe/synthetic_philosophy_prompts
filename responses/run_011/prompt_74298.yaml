prompt: |-
  Nearly every applied Bayesian analysis I referee reports that a flat, or otherwise non-informative, prior was adopted for the parameter of interest, and offers the same justification: the conclusions are thereby driven by the data rather than by subjective assumptions. Two features of the practice puzzle me. First, flatness is only ever claimed in the parameterization the authors happen to use — a uniform prior on a variance is not uniform on the standard deviation, on its reciprocal, or on its logarithm — and no argument is ever offered that this is the scale on which one ought to be ignorant. Second, the same authors supply sensitivity analyses showing that their conclusions shift when the prior changes, which seems to concede that the prior was doing substantive work all along. A colleague suggested that the first puzzle is a nineteenth-century paradox about random chords of a circle in disguise; I cannot see the connection.

  What account of evidence, probability, and ignorance does this practice presuppose? Reconstruct it as explicitly as you can: what would have to be true of prior probabilities — and of the parameters they are placed on — for flat-means-neutral to be more than a slogan? Then say which rival accounts the practice rules out (a prior as one agent's betting commitment, a prior as an instrument for good long-run decisions, a prior as whatever invariance under reparameterization demands), whether the practice strictly requires your reconstruction or is equally licensed by several views, and where my two puzzles amount to genuine incoherence rather than mere inelegance. Close with what such a methods section would have to say instead if the field gave up the idea that any prior can be neutral.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Context:** The user is critiquing a common practice in applied Bayesian analysis (refereeing papers).
      *   **Observation 1:** Authors use flat/non-informative priors claiming "data drives conclusions, not subjective assumptions."
      *   **Observation 2 (Puzzle 1):** Flatness is parameterization-dependent (uniform on $\sigma^2$ $\neq$ uniform on $\sigma$, $1/\sigma$, $\log \sigma$). No justification for the chosen scale.
      *   **Observation 3 (Puzzle 2):** Authors run sensitivity analyses showing conclusions *do* shift with priors, contradicting the claim that priors don't matter.
      *   **Colleague's Hint:** Puzzle 1 is like Bertrand's Paradox (random chords of a circle).
      *   **Task:**
          1.  Identify the account of evidence, probability, and ignorance presupposed by this practice.
          2.  Reconstruct it explicitly (what must be true for "flat = neutral" to work?).
          3.  Identify rival accounts ruled out by this practice (betting, long-run decisions, invariance).
          4.  Determine if the practice requires this specific reconstruction or allows others.
          5.  Analyze where the puzzles amount to incoherence vs. inelegance.
          6.  Propose what a methods section should say if the field gave up "neutral priors."

  2.  **Analyze the Presupposed Account (The "Naive Objectivist" or "Logical" View):**

      *   *Claim:* "Conclusions driven by data."
      *   *Implication:* The prior represents a state of *knowledge* (or lack thereof), not just subjective belief.
      *   *Ignorance:* Ignorance is treated as a specific state that can be represented mathematically by a uniform distribution.
      *   *Parameter:* The parameter is treated as having a "true" scale where equal intervals represent equal "amounts" of the quantity in a metaphysical sense.
      *   *Probability:* Logical probability (Keynes/Jeffreys-ish but diluted). Probability measures degree of support or rational belief given ignorance.
      *   *Reconstruction:* For "flat = neutral" to be true, there must exist a *privileged parameterization* of nature. In this specific scale, equal increments must correspond to equal epistemic weight. Ignorance implies assigning equal probability density to equal intervals *on this specific scale*.

  3.  **Analyze Rival Accounts:**

      *   *Subjective/Betting (De Finetti/Savage):* Priors are personal betting commitments. A flat prior is just *my* indifference. But if I change parameters, my indifference changes. This view *allows* parameterization dependence but contradicts the claim "data drives conclusions" (since the prior is substantive belief). The practice *claims* objectivity, so it implicitly rejects pure subjectivism.
      *   *Frequentist/Long-run (Decision Theory):* Priors are tools for risk minimization. Flat priors might be admissible rules. But the justification "ignorance" doesn't fit; the justification would be "risk control." The practice claims "ignorance," so it rules this out as the *stated* rationale.
      *   *Invariance (Jeffreys):* Priors should be invariant under reparameterization (e.g., Jeffreys prior). The practice explicitly *violates* this (Puzzle 1). So the practice rules out the invariance account.

  4.  **Analyze the Puzzles (Incoherence vs. Inelegance):**

      *   *Puzzle 1 (Parameterization):* This is exactly Bertrand's Paradox. Bertrand showed that "random chord" is ill-defined without specifying the method of selection (midpoint, endpoint, angle). Similarly, "uniform prior" is ill-defined without specifying the measure.
          *   *Incoherence:* If one claims the prior represents *pure ignorance*, but ignorance shouldn't depend on how I write the variable, then claiming uniformity on *one* scale without justification is logically inconsistent with the definition of ignorance. It assumes a "true scale" exists without evidence.
      *   *Puzzle 2 (Sensitivity):* If the prior represents *zero* information, changing it shouldn't change the posterior (asymptotically or in strong data cases). If sensitivity analysis shows shifts, the prior *was* informative.
          *   *Incoherence:* Claiming "prior doesn't matter" while demonstrating "prior matters" is a performative contradiction. It's not just inelegant; it undermines the core justification for the method choice.

  5.  **Drafting the Reconstruction (The "Privileged Scale" Hypothesis):**

      *   To make "flat = neutral" work, we need:
          1.  Parameters have a natural metric (like length, not log-length).
          2.  Ignorance is the Principle of Indifference (PoI).
          3.  PoI applies to the natural metric.
      *   This is essentially the Laplacean view, critiqued by Keynes and Jeffreys.

  6.  **Addressing the Colleague's Hint (Bertrand's Paradox):**

      *   Bertrand's Paradox: Probability of a random chord being longer than side of inscribed equilateral triangle depends on how "random" is defined (uniform on angle, uniform on radius, uniform on midpoint).
      *   Connection: Uniform on $\sigma$ vs. uniform on $\log \sigma$ is the same mathematical problem. There is no unique "uninformative" distribution without a specified measure. The authors are picking a "method of selection" (parameterization) arbitrarily while claiming uniqueness.

  7.  **What should the Methods Section say? (The "Honest Bayesian" Approach):**

      *   Admit priors are substantive.
      *   Justify priors based on external knowledge or regularization properties.
      *   Treat sensitivity analysis not as a check on "non-informativeness" but as a characterization of prior influence.
      *   Use reference priors or Jeffreys priors if objectivity is desired, acknowledging their limitations.
      *   Or, embrace subjectivism: "This prior reflects our best guess..."

  8.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Is it strictly incoherent?* In practice, with lots of data, the likelihood swamps the prior. So "data drives conclusions" is *approximately* true. The incoherence arises when data is weak (where sensitivity is found) or when the claim is absolute.
      *   *Does it rule out Subjectivism?* A subjectivist *could* say "I am indifferent on this scale." But the *justification* ("conclusions driven by data") appeals to objectivity, not personal indifference. So the *rhetoric* rules out subjectivism, even if the math allows it.
      *   *Jeffreys:* Jeffreys priors solve Puzzle 1 but not necessarily Puzzle 2 (they can still be informative). The practice ignores Jeffreys, so it rules out the invariance solution.

  9.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the depth of the critique. Identify the presupposed view (Naive Logical/Objectivist).
      *   **Reconstruction:** Detail the conditions required for "flat = neutral" (Privileged Parameterization + Principle of Indifference).
      *   **Rival Accounts:** Contrast with Subjective (betting), Frequentist (decision), and Invariance (Jeffreys). Show how the practice implicitly rejects them.
      *   **The Puzzles (Incoherence):** Connect to Bertrand's Paradox. Explain why the sensitivity analysis creates a performative contradiction.
      *   **The Alternative:** Draft the "Honest Methods Section."

  10. **Final Polish:** Ensure tone is academic, rigorous, and directly answers the prompt's specific questions. (Check: Did I explain the Bertrand connection clearly? Yes. Did I specify what must be true for the practice to be valid? Yes.)

      *(Self-Correction during drafting)*: Make sure to distinguish between what the *math* allows and what the *justification* claims. A subjectivist can use a flat prior, but they can't claim it represents *ignorance* universally. The prompt asks about the *practice's justification*.

      *(Refining the Bertrand connection)*: Bertrand's paradox shows that "at random" is ambiguous. "Uninformative prior" is ambiguous in the same way. The authors pick one resolution (the parameterization) without arguing for it, just as Bertrand's solvers pick a method of drawing chords without arguing for it.

      *(Refining the Sensitivity point)*: If the prior is truly "non-informative," it should be a reference point that vanishes. If sensitivity analysis shows movement, the prior is acting as a regularizer. The claim "data drives conclusions" is falsified by the sensitivity analysis.

      *(Final check on the "What must be true" section)*: Need to be precise. It requires an ontological claim about the parameter space having a canonical measure.

      *(Final check on "What the methods section should say")*: Needs to be actionable. "We used a weakly informative prior..." or "We used a reference prior..."

      Let's assemble the response.

      *   **Account:** Logical Probability / Principle of Indifference.
      *   **Reconstruction:** Canonical Scale + Indifference.
      *   **Rivals:** Subjective (ruled out by objectivity claim), Decision (ruled out by ignorance claim), Invariance (ruled out by parameterization dependence).
      *   **Incoherence:** Bertrand's paradox (Puzzle 1) + Performative Contradiction (Puzzle 2).
      *   **Alternative:** Transparent regularization or explicit subjectivism.

      *Wait, one nuance:* Does the practice *strictly require* the reconstruction? A pragmatist might say "It works well enough." But the *justification* ("driven by data") requires the reconstruction. I need to make that distinction clear. The *math* works under many views; the *claim* requires the Logical view.

      *Okay, ready to write.*
answer: |-
  The practice you describe presupposes a **Naive Logical Account of Probability**, specifically a diluted and often unacknowledged version of the **Principle of Indifference** (PoI) associated with Laplace, but stripped of the philosophical rigor later demanded by Keynes and Jeffreys.

  Here is the reconstruction of that account, the rival views it excludes, an analysis of the incoherence, and a proposal for a more honest methodological reporting standard.

  ### 1. The Presupposed Account: The "Privileged Scale" Hypothesis

  For the claim "flat means neutral" to be more than a slogan, the following ontological and epistemological conditions must hold:

  1.  **Ontological Canon:** Parameters are not merely mathematical abstractions but correspond to quantities in the world that possess a **canonical metric**. There exists a "true" scale (e.g., variance $\sigma^2$, not $\log \sigma$) on which equal intervals represent equal "amounts" of the physical quantity. Ignorance is defined relative to this specific metric.
  2.  **Epistemological Symmetry:** A state of total ignorance warrants assigning equal probability density to equal intervals *on the canonical metric*. This is the Principle of Indifference applied to continuous variables.
  3.  **Likelihood Dominance:** The prior is viewed as a negligible additive constant to the log-likelihood. For the claim "conclusions are driven by the data" to hold, the likelihood function must be sufficiently peaked that the specific shape of the prior (within a class of "flat" functions) integrates to approximately the same posterior mass.

  **Reconstructed Justification:**
  > "We assume nature presents this parameter on a linear scale where our lack of knowledge is symmetric. Therefore, a uniform density on this scale represents zero information. Because our data is strong, this zero-information assumption washes out, leaving only the signal."

  ### 2. Rival Accounts Ruled Out

  The authors' justification explicitly or implicitly rules out three major competing interpretations of Bayesian priors:

  *   **The Subjective/Betting Account (de Finetti, Savage):**
      *   *View:* A prior is a personal betting commitment. A flat prior simply means *I* am indifferent on *this* scale.
      *   *Ruled Out:* The authors claim the conclusions are driven by the *data*, not *assumptions*. A subjectivist admits the prior is an assumption (a commitment). By claiming the prior represents "ignorance" rather than "belief," the authors appeal to an objective state of knowledge, rejecting pure subjectivism.
  *   **The Decision-Theoretic/Frequentist Account (Wald, Berger):**
      *   *View:* Priors are instruments for minimizing long-run risk or achieving admissibility. A flat prior might be chosen because it yields good frequentist coverage properties.
      *   *Ruled Out:* The justification offered is epistemic ("ignorance"), not pragmatic ("risk control"). If the goal were decision-theoretic, sensitivity analysis would focus on loss functions, not prior "neutrality."
  *   **The Invariance Account (Jeffreys, Bernardo):**
      *   *View:* A non-informative prior must be invariant under reparameterization (e.g., Jeffreys prior $p(\theta) \propto \sqrt{I(\theta)}$).
      *   *Ruled Out:* This is directly contradicted by **Puzzle 1**. If the authors accepted the invariance account, they would not use a simple uniform prior on an arbitrary parameterization, nor would they fail to justify the scale. They are implicitly rejecting the requirement that ignorance be representation-independent.

  ### 3. The Puzzles: Inelegance or Incoherence?

  Your colleague is correct: **Puzzle 1 is Bertrand's Paradox in statistical clothing.**

  **Puzzle 1 (Parameterization):**
  In Bertrand's Paradox, the probability that a "random chord" is longer than the side of an inscribed triangle depends on how "random" is defined (uniform on the radius, uniform on the angle, uniform on the midpoint). There is no unique "random chord" without a specified measure.
  Similarly, there is no unique "uniform prior." A uniform distribution on $\sigma$ implies a $1/\sigma^2$ density on the precision. By choosing one parameterization without justification, the authors are implicitly selecting a "method of selection" for nature's values without argument.
  *   **Verdict:** This is **logical incoherence** relative to the claim of representing "ignorance." If one is truly ignorant, one's state of mind should not depend on whether the variable is written as $\sigma$ or $\log \sigma$. The practice assumes a "God's eye view" of the parameter scale that does not exist.

  **Puzzle 2 (Sensitivity):**
  The authors claim the prior is neutral (doing no work), yet the sensitivity analysis demonstrates the prior *does* work (shifting conclusions).
  *   **Verdict:** This is a **performative contradiction**. It is not merely inelegant; it falsifies the premise of the methods section. If the sensitivity analysis shows the posterior moves, the prior was informative. If the prior was informative, the claim that "conclusions are driven by the data [rather than] subjective assumptions" is false. The sensitivity analysis acts as a confession that the "non-informative" slogan was a fiction.

  **Does the practice require this reconstruction?**
  Mathematically, no. One can compute a posterior with a flat prior under a Subjective view. However, the *rhetorical justification* ("driven by data," "ignorance") *requires* the Naive Logical reconstruction. Without the belief in a privileged scale and the Principle of Indifference, the justification collapses.

  ### 4. The Honest Methods Section

  If the field abandoned the myth of the neutral prior, the methods section would need to shift from defending *ignorance* to defending *regularization* or *belief*. It would look like one of the following:

  **Option A: The Weakly Informative Approach (Gelman et al.)**
  > "We adopted a half-Cauchy prior on the standard deviation. We do not claim this represents ignorance; rather, it provides weak regularization to prevent the variance from collapsing to zero or exploding to infinity in finite samples. We acknowledge this imposes a substantive assumption that large variances are unlikely. Sensitivity analyses (Appendix B) confirm that while the point estimates are stable, the tail probabilities of the posterior depend on this choice."

  **Option B: The Reference Prior Approach (Bernardo/Berger)**
  > "To minimize the influence of the prior on the posterior in an information-theoretic sense, we employed a Jeffreys reference prior. This ensures our inferences are invariant to reparameterization. We note that even reference priors can be informative in low-data regimes; therefore, we report the Kullback-Leibler divergence between prior and posterior to quantify how much information the data actually contributed."

  **Option C: The Explicitly Subjective Approach**
  > "We specified a Normal-Inverse-Gamma prior based on previous meta-analyses in this domain. We treat these parameters as encoding our best current scientific belief before observing the current dataset. Conclusions are therefore a synthesis of prior literature and new data, not data alone."

  ### Summary
  The current practice presupposes that **ignorance is a measurable quantity** that can be set to zero on a **privileged scale**. It is incoherent because it violates the Principle of Transformation Invariance (Bertrand's Paradox) and contradicts its own empirical sensitivity checks. To resolve this, analysts must admit that **all priors are informative**, and justify them based on their regularization properties or external validity rather than a mythical neutrality.
