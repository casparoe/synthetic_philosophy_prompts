  *   **Authorship:** Yes (She poured the concrete).
  *   **Standing:** No (Deal valid without representation).
  *   **Publicity:** No (Open no different from private).
  *   **Result:** Y, Y, N, N.
  *   **Cell:** Integrity-Damage View.

  \answer{Integrity-Damage View}
