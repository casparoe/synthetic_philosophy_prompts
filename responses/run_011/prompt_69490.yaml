  # Moral Trade Discussion Quiz

  **Instructions:** Below are eight situations involving agreements between people or groups. For each situation, choose the option that best matches your immediate intuition. Do not overthink it; there are no right or wrong answers. Your responses will help map your view on moral trade.

  ### Dimension 1: Scale
  *Can moral goods be weighed on a single scale, or are they different in kind with no exchange rate?*

  **1. The Optional Trade**
  You care about recycling, but you think the school's current bins are "good enough," not morally required. A rival club wants funding for late-night pizza parties. You propose a deal: you stop pushing for better bins if they get the pizza funding. You aren't giving up anything you believe is wrong to lose.
  *   **A.** The trade is fine; the joy of pizza balances the benefit of bins.
  *   **B.** The trade is wrong; you cannot swap safety improvements for fun, even if bins are optional.

  **2. The Institutional Market**
  The student council creates a formal system where clubs trade service hours for budget allocations. Everything has a point value.
  *   **A.** This system makes values comparable and efficient for everyone.
  *   **B.** This system corrupts the meaning of service and budget by making them commodities.

  ### Dimension 2: Authorship
  *If you arrange for someone else to do something you judge wrong, are you an author of the act or merely a cause of the outcome?*

  **3. The Enabler**
  You oppose animal testing. A lab offers to reduce testing if you fund their alternative research equipment. You fund the equipment, knowing testing will still happen, just less of it.
  *   **A.** You are responsible for the testing that continues because you paid for the deal.
  *   **B.** You are only responsible for the equipment you funded; the lab owns the testing.

  **4. The Direct Swap**
  You oppose wearing logos. A friend opposes wearing plain clothes. You swap shirts for a day to help each other out.
  *   **A.** You are wearing the logo; you own that act completely.
  *   **B.** You are just helping a friend; the logo doesn't stick to your moral record.

  ### Dimension 3: Standing
  *Does a trade disposing of the interests of a being that cannot consent fail unless someone properly represents that being?*

  **5. The Voiceless Interest**
  You agree to let a developer drain a pond (frogs live there) in exchange for them building a wheelchair ramp for the school. The frogs cannot object.
  *   **A.** The deal is invalid; the frogs have no voice in the matter.
  *   **B.** The deal is valid; someone must decide for the frogs, and you are entitled to decide.

  **6. The Mutual Truce**
  You and an opposing club agree neither will speak at the next assembly to keep peace. You both silence yourselves.
  *   **A.** This silences voices that should be heard; the peace is invalid.
  *   **B.** This is a valid peacekeeping measure between groups who control their own speech.

  ### Dimension 4: Publicity
  *Is an act performed as part of an open bargain morally different from the same act performed privately?*

  **7. The Secret vs. Open Deal**
  You privately agree to vote for your friend's proposal if they vote for yours. Then you announce this same deal publicly over the loudspeaker.
  *   **A.** Doing this openly changes the act into a transaction; it feels different.
  *   **B.** It is the same act, just with a different reason; the publicity doesn't change the morality.

  **8. The Standing Policy**
  A company publishes a policy: "We will lower prices if customers agree not to unionize." This is a standing, published offer to everyone.
  *   **A.** This public offer makes the refusal to unionize a commodity; it corrupts the relationship.
  *   **B.** This is just a clear offer of employment terms; it is morally neutral.

  ***

  # Scoring Key

  **How to Score:**
  For each question, mark **Yes** if you chose Option **A**, and **No** if you chose Option **B**.
  *   **Scale:** Q1 (A=Yes), Q2 (A=Yes).
  *   **Authorship:** Q3 (A=Yes), Q4 (A=Yes).
  *   **Standing:** Q5 (A=Yes), Q6 (A=Yes).
  *   **Publicity:** Q7 (A=Yes), Q8 (A=Yes).

  **Conflict Rule:** If a reader gives conflicting answers within one dimension (e.g., Yes on Q1 but No on Q2), their profile is **Undetermined** on that axis. Do not assign a cell. Instead, invite them to discuss why their intuition shifted between the two cases.

  **Position Table:**
  The following table maps every combination of Yes (Y) and No (N) across the four dimensions.
  *   **Scale:** Y = Goods can be weighed. N = Different in kind.
  *   **Authorship:** Y = You are an author. N = Merely a cause.
  *   **Standing:** Y = Fails without representation. N = Valid without representation.
  *   **Publicity:** Y = Open bargain is different act. N = Same act, different motive.

  | Scale | Authorship | Standing | Publicity | Position Name | Notes |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Y** | **N** | **N** | **N** | **Plain Gains-from-Trade** | Trade is efficient and clean. |
  | **N** | **N** | **N** | **N** | **No-Exchange-Rate View** | Values are distinct; trade is rarely meaningful. |
  | **N** | **Y** | **N** | **N** | **No-Wrong-Acts View** | Trade permitted only if no party does what they judge wrong. |
  | **Y** | **Y** | **N** | **N** | **Integrity-Damage View** | Trade advances cause but damages trader's integrity. |
  | **Y** | **N** | **N** | **Y** | **Public Corruption View** | Private trades acceptable; open/institutional ones corrupt meaning. |
  | **N** | **N** | **N** | **Y** | **Sacred Values View** | Values incomparable; public trade corrupts them further. |
  | **N** | **Y** | **N** | **Y** | **Strict Deontologist** | No scale, own acts, public trade corrupts. Unclaimed. |
  | **Y** | **Y** | **N** | **Y** | **Total Corruption View** | Trade works but taints you, especially publicly. Unwanted. |
  | **Y** | **N** | **Y** | **N** | **Guardian View** | Trade OK, but voiceless beings need representatives. Unclaimed. |
  | **N** | **N** | **Y** | **N** | **Incommensurable Guardian** | No scale, but reps needed for voiceless. Unclaimed. |
  | **N** | **Y** | **Y** | **N** | **Strong Guardian** | No scale, own acts, reps needed. Unclaimed. |
  | **Y** | **Y** | **Y** | **N** | **Complicit Guardian** | Weighable, own acts, reps needed. Unclaimed. |
  | **Y** | **N** | **Y** | **Y** | **Public Guardian** | Weighable, clean hands, reps needed, public corrupts. Unclaimed. |
  | **N** | **N** | **Y** | **Y** | **Sacred Guardian** | No scale, clean hands, reps needed, public corrupts. Unclaimed. |
  | **N** | **Y** | **Y** | **Y** | **Ultimate Restriction** | Coherent but unwanted; nearly all trade forbidden. |
  | **Y** | **Y** | **Y** | **Y** | **Total Lockdown** | Coherent but unclaimed; trade possible but heavily restricted. |

  **Notes on Unnamed Cells:**
  *   **Unclaimed:** These combinations are logically coherent and defensible but do not correspond to a common named position in current student discourse.
  *   **Unwanted:** These combinations are coherent but imply such strict constraints that few would advocate for them willingly.
  *   **Incoherent:** None of the sixteen combinations are strictly logically impossible, though some (like Total Lockdown) render the concept of trade nearly vacuous.

