      *   *Scholarly Consensus:* There is *no* strong consensus on Berkeley's status as a monetary theorist. He is a minor figure in HET (History of Economic Thought) compared to Locke, Hume, or Smith. The "proto-Chartalist" label is a specific, somewhat modern reconstruction, not a settled historical fact.

