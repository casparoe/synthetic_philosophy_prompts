answer: |-
  # Design Specification: Evidence-Gathering Policy Desiderata

  ## 1. Preamble
  The following specification outlines the necessary conditions for an evidence-gathering policy within an autonomous diagnostic assistant. The objective is to resolve the tension between the classical Value of Information (VoI) theorem (Good, 1967) and the embedded, resource-constrained reality of the system. The classical theorem assumes a Bayesian agent with free, passive observations and a fixed utility function over world states. Our system operates under costs (latency, capital, goodwill), intervenes on the target, and faces downstream processing constraints. The desiderata below refine the raw requirements into engineering constraints.

  ## 2. Refined Desiderata

  **D1. Downstream Processing Integrity (refining i)**
  The policy must account for the fidelity of the action-selection module. If the agent anticipates that acquiring evidence will trigger a downstream bias (e.g., alarmism) that degrades the final decision quality, the policy must be able to assign a negative expected value to that observation.
  *Motivation:* Prevents the system from ordering tests that it knows will cause a human or automated overseer to panic and enact a suboptimal intervention.

  **D2. Causal Neutrality of Observation (refining ii)**
  The policy must distinguish between passive observation and active intervention. If the act of measurement alters the state of the component being measured (e.g., thermal drift from an assay), the expected utility calculation must model the post-observation state as a causal consequence of the measurement, not merely a revelation of the pre-existing state.
  *Motivation:* Prevents the system from degrading the component it is trying to save through the diagnostic process itself.

  **D3. Separability of Instrumental and Intrinsic Value (refining iii)**
  The policy must allow for utilities to be attached to the information state itself, independent of the final action. Receiving 'bad news' may incur a utility penalty (user distress) even if the subsequent action is optimal.
  *Motivation:* Accounts for the harm of anxiety or reputational damage caused by the disclosure of findings, regardless of the repair outcome.

  **D4. Temporal Consistency and Resource Accounting (refining iv)**
  The policy must evaluate evidence gathering as a sequential programme rather than a series of isolated decisions. It must price the option value of preserving resources (e.g., user goodwill) for future queries, rather than exhausting the budget on the locally optimal question.
  *Motivation:* Prevents the system from asking six trivial questions early in a session, leaving the user too frustrated to answer the seventh, critical question.

  **D5. Updating Stability (refining v)**
  The policy must assume the agent's updating rule is stable. If the agent assigns non-zero probability to the hypothesis that it will update irrationally in the future, the specification must declare whether the agent is bound by the Reflection Principle or if it must model its future self as a distinct, potentially adversarial agent.
  *Motivation:* Addresses cases where evidence suggests the agent's own learning algorithms are compromised or drifting.

  **D6. Optionality of Null Information (refining vi)**
  The policy must recognise that the value of information is non-negative but not strictly positive. The system must be permitted to decline free information if it is irrelevant to the decision at hand, without violating rationality constraints.
  *Motivation:* Prevents 'busywork' diagnostics where the system gathers data that does not change the action plan, wasting latency.

  **D7. Strategic Non-Disclosure (refining vii)**
  The policy must account for information leakage to strategic actors. If asking a question reveals the agent's current hypothesis to a user who may then obfuscate, the cost of the query must include the strategic disadvantage gained by the counterpart.
  *Motivation:* Relevant in fraud detection or adversarial diagnostic settings where the 'user' is not cooperative.

  **D8. Ex Ante Rationality Guarantee (refining viii)**
  The policy must be evaluated on the rationality of the decision at the time it was made, given the evidence available then. Ex post regret (the outcome was poor despite the best available calculation) must not be treated as a policy failure.
  *Motivation:* Protects the engineering team from blaming the policy for bad luck, distinguishing between decision quality and outcome quality.

  ## 3. Classification of Requirements

  **Non-Negotiable (Critical for Safety and Viability)**
  *   **D2 (Causal Neutrality):** Failure here causes physical damage to the diagnostic target.
  *   **D4 (Temporal Consistency):** Failure here exhausts the goodwill budget, rendering the system unusable in long sessions.
  *   **D8 (Ex Ante Rationality):** Essential for liability and verification; we cannot certify a system that is judged by outcomes outside its control.

  **Negotiable (Desirable but Compromisable)**
  *   **D1 (Downstream Integrity):** Preferable to fix the downstream module than to model its brokenness.
  *   **D3 (Intrinsic Value):** Can be approximated as a fixed cost per query rather than a complex utility shift.
  *   **D5 (Updating Stability):** In practice, we should engineer the updater to be stable rather than build a policy that anticipates its own failure.
  *   **D7 (Strategic Non-Disclosure):** Only required for specific adversarial modes; can be disabled for cooperative diagnostics.
  *   **D6 (Optionality):** Mathematically implied by D4, but explicit statement is useful for debugging.

  ## 4. Incompatibility Analysis

  You suspected that **D1 (Downstream Integrity)**, **D4 (Temporal Consistency)**, **D8 (Ex Ante Rationality)**, and **Computability** cannot be jointly satisfied. I agree with this assessment.

  **The Conflict:**
  To satisfy D8 (Ex Ante Rationality) under D4 (Non-Myopic Policy), the agent must compute the expected utility of a sequence of future actions. To satisfy D1 (Downstream Integrity), the agent must model the probability that its future self (or downstream module) will process that information irrationally.
  If the agent models its own future irrationality, it violates the assumption of optimal future action required for standard dynamic programming (Bellman equations). The agent enters an infinite regress: it must model itself modelling itself. This renders the value function uncomputable in polynomial time, violating the implicit requirement for real-time decision making.

  **Resolution:**
  **D1 must be relinquished as a decision-theoretic variable.**
  We cannot build a rational policy that optimally navigates around its own known irrationality without incurring intractability. Instead, D1 must be treated as an **engineering constraint**. The downstream module must be calibrated to ensure it does not over-weight alarming results. The decision policy should assume the downstream module acts rationally; if it does not, that is a defect in the module, not a variable for the policy to manage.

  **Practical Cost:**
  The system loses the ability to 'work around' a flawed diagnostician. If the downstream module is prone to panic, the policy cannot simply stop ordering tests to prevent it; the module itself must be patched. This increases the coupling between the policy team and the action-selection team.

  ## 5. The Eliminating Requirement

  The single requirement that eliminates the most candidate accounts is **D4 (Temporal Consistency and Resource Accounting)**.

  Most standard implementations of Value of Information are **myopic**. They calculate the Expected Value of Sample Information (EVSI) for the immediate next step only. They assume the budget is infinite or that the current decision does not affect future opportunities. D4 demands a shift from Decision Theory to Control Theory (or Reinforcement Learning), requiring the evaluation of whole inquiry policies rather than single acts. This immediately disqualifies any account that relies on greedy, single-step look-ahead.

  ## 6. Evaluation of Candidate Accounts

  **1. Plain Expected-Value-of-Information (Decision by Decision)**
  *   **Performance:** Fails D2 and D4.
  *   **Analysis:** This account treats observations as passive (violating D2) and calculates value based on the immediate decision only (violating D4). It will exhaust user goodwill on low-value queries and may damage components through invasive testing. It satisfies D6 and D8 but is unsafe for this environment.

  **2. Sequential Account (Whole Inquiry Policy)**
  *   **Performance:** Passes D4, Fails D2 (if Evidential).
  *   **Analysis:** This account evaluates the entire tree of possible queries, satisfying the goodwill budget (D4). However, if it relies on standard Evidential Decision Theory, it fails D2. It will treat the correlation between 'looking' and 'component heating' as mere evidence rather than causation, potentially ordering tests that correlate with failure but cause it. It is computationally expensive but architecturally sound regarding resources.

  **3. Causal Treatment of Observation**
  *   **Performance:** Passes D2, Fails D4 (if Myopic).
  *   **Analysis:** By using Causal Decision Theory, this account correctly handles interventions (D2). It understands that looking changes the world. However, unless combined with a sequential planner, it remains myopic. A Causal-Myopic hybrid will protect the component but exhaust the user's goodwill. To be fully adequate, this account must be extended to a **Causal-Sequential** framework, which is the only architecture that satisfies the Non-Negotiable set, provided D1 is handled via engineering constraints.
