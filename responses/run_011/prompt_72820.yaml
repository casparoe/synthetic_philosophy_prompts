answer: |-
  ### 1. Settling the Interference Bet
  Your friend is right: your rule is collapsed. Here is the distinction you need.
  *   **If the effect disappears under verbal interference** (e.g., repeating nonsense while testing): Language is being used as an *online tool* to solve the task. This proves language mediates thought *in the moment*. It is a "weak" relativity claim, but methodologically solid.
  *   **If the effect survives verbal interference:** Language is not needed *online*. This suggests long-term habituation (your language trained your brain to attend to X automatically). This is the "stronger" claim (rewiring), **but** it opens the door to cultural confounds. If it survives, it could be culture, not language.
  *   **Your Error:** You treated "survives" as "not language." It means "not *online* language." It is still potentially linguistic, but harder to prove.

  ### 2. The Triage Procedure
  Run these questions in order. Stop at the first termination.

  1.  **The Confound Check:** Are the groups matched for everything except language? (SES, education, nationality, bilingualism).
      *   *Fail:* If the control group speaks the test language or lives in a different culture. **Terminate:** "No story" or "Cultural Story" (not linguistic).
      *   *Pass:* Matched monolinguals or carefully controlled bilinguals.
  2.  **The Task Check:** Is the task perceptual (fast reaction) or memorial/decision-based (slow)?
      *   *Memory/Decision:* Allows verbal encoding strategies. Requires Interference Check (see below).
      *   *Perception:* Harder to fake. **Pass.**
  3.  **The Interference Check (for Memory/Decision):** Did they use a concurrent verbal load task?
      *   *No:* **Terminate:** "Story, but unresolved." You must write it as "They might be just talking to themselves."
      *   *Yes (Effect survives):* Stronger claim. **Pass.**
      *   *Yes (Effect dies):* Online mediation. **Pass** (but angle is "tool use," not "rewiring").
  4.  **The Behavior Check:** Is there a behavioral difference (accuracy/speed)?
      *   *No (Brain scans only):* **Terminate:** "No story." Neural activation without behavior is strategy, not cognition.
      *   *Yes:* **Pass.**
  5.  **The Robustness Check:** Is this a single study with a press release?
      *   *Yes:* **Hand to Human:** Is the claim extraordinary? If yes, find a critic.
      *   *No (Replicated/Meta-analysis):* **Pass.**

  **Termination Codes:**
  *   **No Story:** Methodological fatal flaw (Confounds, No Behavior).
  *   **Unresolved:** Interesting finding, but alternative explanations (culture, verbal strategy) remain viable. Requires dissenting voice.
  *   **Human Decision:** Methodology holds, but the implication is political/ethical (e.g., economic policy).

  ### 3. Running the Pitches

  **Pitch 1: Evidentials & Memory**
  *   **Confound Check:** **FAIL.** Control group speaks the evidential language. They are not a linguistic control.
  *   **Task Check:** Memory (verbal test). High risk of encoding strategy.
  *   **Verdict:** **No Story.**
  *   **Angle:** Do not run. The design cannot distinguish language from bilingualism or culture. If you must, write a "How not to do science" sidebar on control groups.

  **Pitch 2: Navigation & fMRI**
  *   **Behavior Check:** **FAIL.** No accuracy or reaction time difference.
  *   **Sample Size:** 17 per group is underpowered for individual differences in fMRI.
  *   **Verdict:** **No Story.**
  *   **Angle:** Debunk. "Brain Scan Porn." Activation differences without behavioral changes often reflect effort or strategy, not cognitive capacity. Quote a neuroscientist on "reverse inference" risks.

  **Pitch 3: Future Tense & Economics**
  *   **Confound Check:** **FAIL (Probable).** Cross-national data rarely controls for all institutional/cultural variables (pension systems, trust, climate).
  *   **Robustness Check:** Single author (economist), high controversy.
  *   **Verdict:** **Story, but Unresolved.**
  *   **Angle:** The story is the *fight*, not the finding. Do not report the correlation as causation. Frame it as "Economists say language drives savings; Linguists say it's culture." You need a linguist to dismantle the grammatical coding and an economist to defend the regression. This fits your "named researcher who disagrees" rule perfectly.

  ### 4. The Weak Step
  **The Confound Check is where you will get a confident wrong answer.**
  You cannot verify cultural matching from a press release or preprint methods section. Sociolinguistic variables (diglossia, prestige, education quality) are often hidden.
  *   **Failure Mode:** False Positive. You pass a study that looks matched but isn't (e.g., "English speakers" in London vs. "Spanish speakers" in Madrid).
  *   **The Threshold to Rewrite:** If a study claims a *universal* cognitive difference based on two populations, demand evidence of a third, unrelated control group. If they lack it, downgrade from "Finding" to "Hypothesis."
  *   **Sharp Worry:** This procedure assumes methods sections are honest. In linguistics, "monolingual" often means "dominant language." If you miss hidden bilingualism, you miss the real variable. Always assume bilingualism until proven otherwise in non-Western samples.
