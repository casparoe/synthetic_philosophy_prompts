answer: |-
  This is a procedural specification for an **Imprecise Probability Underwriting Protocol (IPUP)**. It is designed to replace your current "median-of-medians" practice with a coherent workflow that preserves epistemic uncertainty until the point of commercial decision, while satisfying audit and regulatory requirements for point estimates.

  The core philosophy is **Separation of Epistemic State and Risk Appetite**. The Risk Group owns the *set* of probabilities (the epistemic state). The Chief Underwriter (CU) owns the *selection* from that set (the risk appetite).

  ---

  ### Part I: The Procedure

  #### 1. Elicitation: The Betting Quotient Method
  **Goal:** Extract lower and upper probabilities ($\underline{P}, \overline{P}$) rather than point estimates.
  **Procedure:**
  1.  **Define the Event:** Do not ask "What is the loss rate?" Ask "Will the loss ratio exceed $X\%$ in Year 1?"
  2.  **The Two-Price System:** Ask each expert for two prices on a ticket that pays $\$1$ if the event occurs, $\$0$ otherwise.
      *   **Buying Price ($\underline{P}$):** The maximum you would pay to hold this ticket.
      *   **Selling Price ($\overline{P}$):** The minimum you would accept to short this ticket.
      *   *Constraint:* $\underline{P} \leq \overline{P}$. If an expert gives $\underline{P} = \overline{P}$, they are claiming zero epistemic uncertainty.
  3.  **Handling Disagreement (Sharp vs. Vague):**
      *   If Expert A gives $[0.05, 0.05]$ and Expert B gives $[0.01, 0.10]$, do not average them.
      *   **Challenge the Sharpness:** Ask Expert A: "What specific data justifies ruling out 0.06?" If the justification is "model output" rather than "empirical frequency," force Expert A to widen their interval to match the *model uncertainty* of their own tool.
      *   **Rule:** In novel technology contexts, sharpness without empirical backing is treated as a modeling error, not confidence. Expert A's interval is inflated to match the structural uncertainty of the mechanism until they provide calibration data.
  4.  **Output:** A vector of intervals $\{[\underline{p}_i, \overline{p}_i]\}_{i=1}^5$.

  > **⚠️ Judgment Call:** The threshold for "inflating" a sharp expert. This is a procedural check on overconfidence, but the degree of inflation is subjective.
  > **🛑 Handoff:** None. This is purely epistemic.

  #### 2. Pooling: The Convex Hull with Coherence Trimming
  **Goal:** Combine expert sets without manufacturing precision.
  **Procedure:**
  1.  **Union of Intervals:** Calculate the raw envelope: $[\min(\underline{p}_i), \max(\overline{p}_i)]$.
  2.  **Coherence Check:** Ensure the pooled set avoids sure loss (no Dutch Book). If the union allows for a combination of bets that guarantees a loss across the set, trim the edges just enough to restore coherence.
  3.  **The "No-False-Precision" Rule:** Do not use Linear Opinion Pooling (weighted averages) on the bounds. Averaging bounds narrows the interval, implying the group knows more than the individuals. Use the **Convex Hull** of the individual credal sets.
  4.  **Output:** A single pooled credal set $\mathcal{M} = [\underline{P}_{pool}, \overline{P}_{pool}]$.

  > **⚠️ Judgment Call:** Whether to exclude an outlier expert entirely. If one expert is fundamentally disconnected from the mechanism (e.g., applying standard fire rates to battery thermal runaway), exclude them *before* pooling.
  > **🛑 Handoff:** None.

  #### 3. Default Width: The Ignorance Prior Weight ($s$)
  **Goal:** Objectively widen the interval based on data scarcity.
  **Procedure:**
  1.  **Adopt the Imprecise Dirichlet Model (IDM) Logic:** Even if you aren't counting frequencies, use the IDM parameter $s$ as a "measure of ignorance."
  2.  **The Formula:** For a loss event with $n$ observed occurrences in $N$ exposures, the posterior interval is:
      $$ \underline{P} = \frac{n}{N+s}, \quad \overline{P} = \frac{n+s}{N+s} $$
  3.  **Setting $s$:** This is your defensible parameter.
      *   **Standard Risk:** $s \approx 2$ (weak prior).
      *   **Novel Tech:** $s$ must reflect the "effective sample size" of your *mechanism understanding*.
      *   **Protocol:** Set $s = 10$ for "proven adjacent tech" (e.g., Li-ion in cars applied to grid) and $s = 50$ for "first-of-kind" (e.g., cultivated protein at scale).
      *   **Defense:** On the record, state: "We require $s$ virtual observations of safety before we narrow the probability bound by half."
  4.  **Integration:** Apply this widening to the pooled set from Step 2. If the expert pool gave $[0.02, 0.05]$, but $N=0$ and $s=50$, the IDM bounds $[0, 1]$ dominate. Use the **Intersection** of Expert Pool and IDM Bounds. This ensures experts cannot talk their way out of data scarcity.

  > **⚠️ Judgment Call:** The value of $s$. This is the single most critical parameter.
  > **🛑 Handoff:** The value of $s$ must be ratified by the **Chief Risk Officer (CRO)**. It is a statement of how much data the company demands before trusting a probability. This is risk appetite disguised as statistics.

  #### 4. Updating: Managing Dilation
  **Goal:** Handle new evidence that widens uncertainty.
  **Procedure:**
  1.  **Identify Dilation:** If new evidence $E$ arrives (e.g., a report showing two competing failure mechanisms) and $\underline{P}(A|E) < \underline{P}(A)$ and $\overline{P}(A|E) > \overline{P}(A)$, acknowledge dilation.
  2.  **The Narrative:** Do not say "We are more confused." Say "Previous estimates relied on a hidden assumption of mechanism homogeneity. New evidence reveals mechanism heterogeneity. The widened interval reflects the resolution of hidden model risk."
  3.  **Audit Trail:** Document the *source* of dilation (e.g., "Model Structure Uncertainty").
  4.  **Output:** Updated set $\mathcal{M}'$.

  > **⚠️ Judgment Call:** Determining whether evidence is "noise" or "structural dilation."
  > **🛑 Handoff:** If the dilation exceeds a pre-set threshold (e.g., interval width increases by $>50\%$), the file must be re-reviewed by the **Underwriting Committee**.

  #### 5. Decision: From Set to Act
  **Goal:** Make an underwriting call when acts are incomparable.
  **Procedure:**
  1.  **Calculate Lower/Upper Expected Utility:** For Act $A$ (Underwrite) and Act $B$ (Decline), compute $[\underline{EU}(A), \overline{EU}(A)]$.
  2.  **Check Dominance:**
      *   If $\underline{EU}(A) > \overline{EU}(B)$, Underwrite.
      *   If $\overline{EU}(A) < \underline{EU}(B)$, Decline.
  3.  **Handle Incomparability:** If intervals overlap, the acts are **E-admissible** (neither is ruled out).
  4.  **The Tie-Breaker (Hurwicz Criterion):** Apply a coefficient of ambiguity aversion $\alpha \in [0,1]$.
      *   $Value(A) = \alpha \cdot \underline{EU}(A) + (1-\alpha) \cdot \overline{EU}(A)$.
      *   **Default:** $\alpha = 0.5$ (Neutrality).
      *   **Adjustment:** $\alpha$ is **not** a technical parameter. It is the **Ambiguity Appetite**.
  5.  **Output:** A recommendation based on $Value(A)$ vs $Value(B)$.

  > **⚠️ Judgment Call:** None. The math is fixed.
  > **🛑 Handoff:** The value of $\alpha$ is set by the **Chief Underwriter**. A low $\alpha$ (pessimism) means "We don't write ambiguous risks." A high $\alpha$ means "We are paid to figure this out." This is the substantive normative work.

  #### 6. The Point-Estimate Demand
  **Goal:** Satisfy downstream systems requiring a single number.
  **Procedure:**
  1.  **Never emit the midpoint.** The midpoint implies the distribution is symmetric and known.
  2.  **The "Prudent Estimate":** For pricing/capital systems, emit the **Upper Expectation** ($\overline{E}$) for loss rates and the **Lower Expectation** ($\underline{E}$) for investment returns.
  3.  **The "Reporting Flag":** Alongside the point estimate, report the **Imprecision Ratio**: $IR = (\overline{P} - \underline{P}) / \text{Point Estimate}$.
      *   If $IR > 0.5$, the system must flag the risk as "High Epistemic Uncertainty."
  4.  **Documentation:** The point estimate is labeled "Conservative Bound for Capital Adequacy," not "Best Estimate."

  > **⚠️ Judgment Call:** Which bound to use (Upper vs. Lower).
  > **🛑 Handoff:** **CFO/Actuary**. They decide if the point estimate is for Pricing (competitive, maybe lower) or Reserving (prudential, upper). The Risk Group provides the bounds; Finance picks the point.

  ---

  ### Part II: Case Studies

  #### Case 1: One Loss, Plausible Mechanism (The "s" Parameter Test)
  **Scenario:** A grid-scale battery plant. 1 thermal runaway event in 200 unit-years ($N=200, n=1$). Mechanism suggests many more could occur if cooling fails.
  **Application:**
  *   **Expert Pool:** Experts suggest $[0.005, 0.02]$.
  *   **IDM Check:** $s=50$ (First-of-kind grid scale).
      *   $\underline{P} = 1 / (200 + 50) = 0.004$.
      *   $\overline{P} = (1 + 50) / (200 + 50) = 0.204$.
  *   **Intersection:** Expert upper bound (0.02) is lower than IDM upper bound (0.204).
  *   **Conflict:** The experts are overconfident relative to the data scarcity.
  *   **Decision:** The procedure mandates using the IDM bounds because $N$ is too low to override $s$. The pooled set becomes $[0.004, 0.204]$.
  *   **Result:** The "Point Estimate" emitted is the Upper Expectation (0.204) for reserving.
  *   **Unpopular Answer:** The pricing team cannot use the expert median (0.01). They must price off the Upper Expectation or apply a massive ambiguity load. **The flagship "Expected Loss" number (0.01) is suppressed.** It is statistically indefensible given $s=50$.

  #### Case 2: Dilation (The "Confusion" Narrative)
  **Scenario:** Autonomous freight. Initial interval $[0.02, 0.05]$. A new safety report shows that software failures are correlated with weather, but weather data for the specific corridor is missing.
  **Application:**
  *   **Update:** Conditioning on "Weather Data Missing" splits the model.
  *   **New Interval:** $[0.01, 0.15]$. (Dilation occurred).
  *   **Room Script:** "The new report did not add risk; it added *resolution*. We previously assumed weather independence. We now know dependence exists but cannot quantify it. The interval widened because we stopped hiding model uncertainty."
  *   **Written Submission:** "Epistemic Uncertainty Increased due to Model Structure Refinement. Imprecision Ratio moved from 0.6 to 0.87."
  *   **Committee Defense:** "A narrow number here would be a lie. We are charging you for the width, not the midpoint."

  #### Case 3: Incomparable Acts (The 48-Hour Deadline)
  **Scenario:** Cultivated protein plant.
  *   **Act A (Underwrite):** Expected Profit Interval $[-\$5M, +\$10M]$.
  *   **Act B (Decline):** Expected Profit Interval $[\$0, \$0]$.
  *   **Status:** Intervals overlap. E-admissibility says both are permissible. $\Gamma$-maximin (pessimism) says Decline. $\Gamma$-maximax (optimism) says Underwrite.
  *   **Deadline:** 48 hours. No time for new data.
  *   **Procedure:** Invoke the Hurwicz Criterion.
  *   **The Handoff:** The Risk Group presents the intervals and asks the CU for $\alpha$.
  *   **CU Decision:** If CU sets $\alpha = 0.4$ (moderately ambiguity-averse):
      *   $Value(A) = 0.4(-5) + 0.6(10) = -2 + 6 = +\$4M$.
      *   $Value(B) = 0$.
      *   **Decision:** Underwrite.
  *   **Regulatory Defense:** "We utilized a decision rule that explicitly weights worst-case scenarios against best-case scenarios. The weight (0.4) is consistent with our stated Risk Appetite Statement regarding emerging technologies."
  *   **Defensibility:** Highly defensible. It shows the regulator you *saw* the ambiguity and priced/decided for it, rather than ignoring it.

  ---

  ### Part III: Limitations & Overhead

  **1. What This Procedure Cannot Do**
  *   **It cannot eliminate the need for judgment.** It moves the judgment from "What is the probability?" (where experts lie to themselves) to "What is our ambiguity appetite $\alpha$ and ignorance weight $s$?" (where leaders must take responsibility).
  *   **It cannot fix bad experts.** If all five experts share a blind spot (e.g., all assume gravity works the same on Earth and Mars), the Convex Hull will still be wrong. It only captures *disagreement*, not *shared error*.
  *   **It will misfire in "Fast" Markets.** If competitors are pricing sharp and winning, this procedure will make you look slow and expensive. You will lose volume. This is a feature, not a bug, but it must be accepted by the Board.

  **2. Double-Counting Conservatism**
  *   **Risk:** You widen the probability interval (Step 3) *and* the Actuary adds a risk load to the premium *and* Capital holds reserves for the tail.
  *   **Mitigation:** The **Imprecision Ratio** must be mapped to the Risk Load.
      *   If $IR < 0.2$: Standard Risk Load.
      *   If $IR > 0.5$: Risk Load is replaced by the Upper Expectation pricing. Do not add both.
      *   **Protocol:** The Actuary must sign off that the "Prudent Estimate" (Step 6) does not include a secondary risk margin if it is already the Upper Expectation.

  **3. Cost-Benefit Analysis**
  *   **Overhead:** This adds ~4 hours per risk file (elicitation, pooling, documentation).
  *   **Value:** It prevents the "Silent Accumulation" of tail risk. In novel tech, the risk isn't that you price 5% wrong; it's that you price 500% wrong.
  *   **Verdict:** For your top 20% of exposures (by potential loss), this apparatus earns its overhead. For small, diversified novel risks, it is too heavy.
  *   **Recommendation:** Run IPUP on exposures $> \$10M$ limit. Use the "honestly wide interval + midpoint" hack for the rest, but flag them as "Unassessed Epistemic Risk."

  ### Final Note to the Group Leader
  You suspected one of your flagship numbers should stop being reported. **You are correct.** The "Best Estimate Loss Ratio" is a fiction in novel tech. Replace it with the **"Prudent Bound Loss Ratio"** (the Upper Expectation) for all internal capital and pricing discussions. Allow the sales team to see a "Target Ratio" only after the Ambiguity Load ($\alpha$) has been applied. If the Target Ratio is uncompetitive, the business model is flawed, not your math.
