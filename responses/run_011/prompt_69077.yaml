prompt: |-
  I run a five-person quantitative risk group inside a mid-size insurer that underwrites novel technologies — grid-scale battery installations, cultivated-protein plants, autonomous freight corridors — where the exposure we are pricing has essentially no loss history. For years I have followed the imprecise-probability literature from the outside: the argument that a single sharp number is false precision when the evidence is thin, the counterargument that mushy credences are ruled out by principles about evidential symmetry, and the machinery that grew up around sets of probability functions — lower and upper expectations, the imprecise Dirichlet model for sparse data, dilation, and the various rules for choosing an act when a credal set refuses to rank the options (maximality, Γ-maximin, the Hurwicz criterion, Levi's E-admissibility). What I have never found is anyone describing how to run a meeting with any of it. I want the procedure, not a survey of who holds which position.

  Our current house practice is a crude approximation. Each expert supplies a 5th, 50th and 95th percentile for the quantity at issue; we take the median of the medians and the outer envelope of the tails; the result feeds a pricing model that accepts only point estimates, so somewhere downstream — no one is quite sure where — the interval is collapsed to its midpoint. Two consequences follow. The envelope is nobody's belief and is not obviously coherent, and the collapse destroys the very information we were trying to preserve while leaving an audit trail that makes the panel look as though it had been sharp all along.

  Please write the decision procedure this group could actually run, in ordered steps, covering at minimum:

  1. Elicitation — how to obtain interval- or set-valued beliefs from experts who have never met the formalism, and what to do when one expert is confidently sharp while another will not go narrower than a factor of two hundred.
  2. Pooling — a rule for combining them that does not manufacture precision, and the conditions under which the pooled set is a legitimate representation of the panel rather than an artifact.
  3. Default width — how wide the set should be as a function of how much data exists, with the width governed by a parameter we can defend on the record rather than tune until the answer looks right.
  4. Updating — what happens when new evidence arrives, including the case where conditioning on it widens our interval for the quantity we care about, and what the group should say to a committee that will read a wider interval as the panel having become more confused.
  5. Decision — how to get from the set to an underwriting call when the acts are left unranked: which rule, what attitude toward ambiguity that rule bakes in, and where a nominally technical choice of rule is doing substantive normative work.
  6. The point-estimate demand — whether the procedure should ever emit a single number, and if so how it is derived, so that the derivation is documented rather than tacit.

  For each step, flag the ones that are judgment calls wearing procedural clothing, and say where the procedure must stop and hand the question to the chief underwriter because it concerns risk appetite rather than uncertainty.

  Then run it on three cases: a parameter supported by exactly one historical loss event plus a plausible mechanism for many more; a case in which a credible new report dilates our interval instead of narrowing it, with the wording the group would use in the room and in the written submission; and two underwriting acts our set leaves incomparable, with a binding decision required within forty-eight hours, showing what each of the standard rules picks and whether the pick is defensible to a regulator. At least one of these should produce an answer I will not like — I suspect it will be that one of our two flagship numbers should stop being reported at all.

  Finally, state what the procedure cannot do: where it will misfire in practice, whether it double-counts conservatism already loaded into our reserve margins, and whether the whole apparatus earns its overhead compared with simply reporting an honestly wide interval alongside a documented midpoint.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**

      *   **User:** Head of a 5-person quantitative risk group at a mid-size insurer.
      *   **Domain:** Novel technologies (grid batteries, cultivated protein, autonomous freight) $\rightarrow$ essentially no loss history (deep uncertainty/ambiguity).
      *   **Current Problem:** Crude elicitation (medians/envelopes) $\rightarrow$ forced point estimate downstream $\rightarrow$ false precision + incoherence.
      *   **Knowledge Base:** Familiar with imprecise probability literature (Walley, Levi, Dempster-Shafer, IDM, etc.) but needs *operational procedure*, not theory.
      *   **Deliverable:** A concrete, step-by-step decision procedure for running meetings and making underwriting calls using imprecise probabilities.
      *   **Specific Requirements:**
          1.  Elicitation (handling disagreement/sharpness).
          2.  Pooling (avoiding manufactured precision).
          3.  Default Width (data-dependent, defensible parameter).
          4.  Updating (handling dilation/confusion narratives).
          5.  Decision (choice rules when acts are unranked, normative implications).
          6.  Point-Estimate Demand (when/how to emit a single number).
          7.  *Flags:* Identify judgment calls vs. risk appetite handoffs.
          8.  *Case Studies:* Run the procedure on three specific scenarios (1 loss + mechanism, dilation case, incomparable acts with 48h deadline). One answer must be unpopular (e.g., stop reporting a number).
          9.  *Limitations:* What the procedure *cannot* do, double-counting risks, cost-benefit analysis.

  2.  **Philosophical & Mathematical Stance:**

      *   The user knows the theory. I need to bridge the gap between *theory* (sets of priors, lower/upper expectations) and *practice* (underwriting committees, regulatory audits).
      *   *Core Principle:* Preserve the imprecision until the very last moment, and even then, document the collapse.
      *   *Framework:* Imprecise Dirichlet Model (IDM) is good for frequencies, but for novel tech, we need a hybrid: Expert Credal Sets + IDM-like inflation for scarcity.
      *   *Decision Rule:* $\Gamma$-maximin is too conservative for commercial insurance (might write no business). E-admissibility is too permissive (might write toxic business). A hybrid or a specific "Ambiguity Loading" approach is needed. Let's lean towards a documented *Hurwicz* or *Minimax Regret* approach for the final commercial decision, but keep the *Credal Set* for the risk assessment.
      *   *Tone:* Professional, operational, direct, acknowledging the political reality of insurance (capital, regulation, sales).

  3.  **Drafting the Procedure (Step-by-Step):**

      *   *Step 1: Elicitation.* Don't ask for $P(A)$. Ask for betting quotients or frequency equivalents. Handle the "sharp vs. vague" expert conflict by treating sharpness as a claim of evidence, not just confidence. If evidence is equal, the vague expert is likely more rational in this context.
      *   *Step 2: Pooling.* Linear pooling of sets creates convex hulls (often too wide). Intersection creates emptiness. *Union* of credible intervals (with validation) is often best for "no false precision." Let's propose the *Convex Hull of Individual Credal Sets* but trimmed by coherence checks.
      *   *Step 3: Default Width.* Needs a parameter $s$ (like IDM's $s$). $s$ represents "pseudo-counts" of prior experience. For novel tech, $s$ should be high relative to $N$ (actual data). This is the "defensible parameter."
      *   *Step 4: Updating.* Dilation is real. If new info splits the expert panel or reveals model dependence, the set *must* widen. The narrative: "Resolution of hidden disagreement," not "Confusion."
      *   *Step 5: Decision.* This is the hardest. If $E[U(Act A)]$ and $E[U(Act B)]$ intervals overlap, they are incomparable. We need a tie-breaker. *Risk Appetite* lives here. The technical team provides the set; the C.U. picks the point within the set based on appetite.
      *   *Step 6: Point Estimate.* Only for systems that demand it (accounting, regulatory capital). Derive via a documented functional (e.g., upper bound for reserves, lower bound for pricing, or a weighted average based on the decision rule).

  4.  **Developing the Case Studies:**

      *   *Case 1 (1 Loss + Mechanism):* IDM application. $N=1$. $s$ needs to be large. The interval will be massive.
      *   *Case 2 (Dilation):* New report shows two competing physical failure modes. Previously we assumed one. Interval widens. Script for the committee is crucial.
      *   *Case 3 (Incomparable Acts):* Retain vs. Cede. Intervals overlap. $\Gamma$-maximin says Cede. $\Gamma$-maximax says Retain. Need a tie-break. *Unpopular Answer:* Stop reporting the "Expected Loss" midpoint because it's misleading.

  5.  **Refining the "Judgment Calls" and "Risk Appetite":**

      *   Must clearly distinguish between *epistemic uncertainty* (Risk Group's job) and *tolerance for ambiguity* (C.U./Board's job).
      *   The choice of decision rule (e.g., Hurwicz $\alpha$) is a risk appetite parameter, not a statistical one.

  6.  **Addressing Limitations:**

      *   Double-counting: If we widen the probability interval *and* add a risk load, are we charging twice? Yes, likely. Need to separate "Uncertainty Margin" from "Risk Margin."
      *   Overhead: Is this worth it? Only if the tail risk is existential.

  7.  **Review against Constraints:**

      *   *Ordered steps?* Yes.
      *   *Coverage 1-6?* Yes.
      *   *Flags for judgment/appetite?* Yes.
      *   *Three cases?* Yes.
      *   *Unpopular answer?* Yes (suppressing the midpoint).
      *   *Limitations section?* Yes.
      *   *Tone:* Pragmatic, not academic.

  8.  **Self-Correction/Polishing during drafting:**

      *   *Critique:* Is IDM too specific for "novel tech" where frequencies don't exist?
      *   *Fix:* Adapt IDM. Use $s$ as a "measure of ignorance" parameter applied to expert elicitation, not just frequency counts. Call it the "Ignorance Prior Weight."
      *   *Critique:* How to handle the "sharp" expert?
      *   *Fix:* Calibrate them. If they can't justify the sharpness with evidence, down-weight their sharpness (flatten their distribution) before pooling.
      *   *Critique:* The "Point Estimate" demand is inevitable.
      *   *Fix:* Define the "Reporting Number" vs. the "Decision Number." The Reporting Number must carry a "Uncertainty Flag" (e.g., a coefficient of imprecision).

  9.  **Final Polish:** Ensure the distinction between *Risk* (known probabilities) and *Uncertainty/ambiguity* (unknown probabilities) is maintained in the language. Ensure the "48-hour deadline" case feels real.

  *(Self-Correction on the "Unpopular Answer"):* The prompt asks for an answer I (the user) won't like. Suggesting that a flagship number (likely the "Best Estimate" used for pricing) should be suppressed or fundamentally changed is the right move. It challenges the status quo directly.

  10. **Final Structure:**
      *   Introduction (Acknowledging the gap).
      *   The Procedure (Steps 1-6).
      *   Case Studies (1, 2, 3).
      *   Limitations & Cost-Benefit.
      *   Closing.

