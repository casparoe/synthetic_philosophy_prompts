      *   *Substantive or Dissolved?* It becomes substantive regarding the *definition of the observable*. If the observable is "exact date of battle," Contingentists win. If the observable is "rise of capitalism," Structuralists win. The fight is about *coarse-graining*.

  5.  **Drafting Part 2: The Residue Report:**
