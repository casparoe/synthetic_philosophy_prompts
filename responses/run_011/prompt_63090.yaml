  10. (Final Polish of the text to ensure UQ terminology is used correctly.) *Ensure Sobol indices are mentioned in context of sensitivity.* *Ensure Lyapunov is used for divergence rates.* *Ensure Basins are used for qualitative shifts.*

  *(Self-Correction on "Significance")*: The user specifically asked about this. I need to be hard on this. UQ has variance, but not "importance." Importance is a weighting function applied *after* the simulation. Historians argue about the weighting function itself.

