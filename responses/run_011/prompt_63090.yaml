      *   *Bent Translations:* "Significance." UQ has magnitude, not semantic weight. "Agency." UQ treats agents as part of the state vector or stochastic forcing, not ontologically distinct.
      *   *No Expression:* "Meaning." UQ doesn't care if a state is "tragic" or "progressive." The single realization problem (N=1). In UQ, we assume a probability measure exists. Historians debate if probability *applies* to unique events.
      *   *Cost of Translation:* Assuming a state space exists. Assuming a metric exists. Assuming a measure exists.

  6.  **Drafting Part 3: Evaluating the User's Hunch (a, b, c):**
