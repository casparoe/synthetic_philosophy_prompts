answer: |-
  Here is the translation of the historiographical debate into Uncertainty Quantification (UQ) and dynamical systems vocabulary, followed by the residue report and an evaluation of your three-part hunch.

  ### Part 1: The Translation

  **The System:** History is modeled as a high-dimensional, non-autonomous dynamical system $\dot{x} = F(x, \theta, t)$, where $x$ is the state vector (population, technology, climate, individual decisions), $\theta$ represents structural parameters (geography, resource distribution, institutional rules), and $t$ is time.

  **The Contingentist Argument (The "Nail" Position):**
  *   **Dynamics:** The system exhibits positive maximal Lyapunov exponents ($\lambda_{max} > 0$) over historical timescales.
  *   **Sensitivity:** Sobol indices for initial condition perturbations ($\delta x_0$) remain high for specific observables even at large $t$.
  *   **Ensemble Spread:** An ensemble of runs with perturbed ICs (within epistemic bounds) produces a multimodal probability density function (PDF) at $t_{final}$. The support of the PDF covers disjoint regions of the state space (e.g., "Roman Empire falls" vs. "Roman Empire persists").
  *   **Predictability:** The predictability horizon $T_p$ is shorter than the historical epoch in question.
  *   **Claim:** The realized trajectory $x(t)$ is not *typical* of the ensemble; it is one specific realization heavily dependent on the specific noise sequence or IC realization.

  **The Structuralist Argument (The "Inevitable" Position):**
  *   **Dynamics:** The system possesses strong attractors (fixed points or limit cycles) or a slow manifold onto which trajectories rapidly contract.
  *   **Sensitivity:** Sobol indices for ICs decay to zero for macroscopic observables; variance is dominated by parameter uncertainty ($\theta$) or forcing, not ICs.
  *   **Ensemble Spread:** The ensemble spread collapses. While micro-states differ, the projection onto macroscopic observables (e.g., "industrialization occurs," "state centralization") has low variance. The PDF is unimodal and tight.
  *   **Basins:** All plausible ICs lie within the same basin of attraction. Separatrices are far from the realized trajectory.
  *   **Claim:** The realized trajectory is *typical*. The outcome is overdetermined by the forcing function and structural parameters $\theta$, making $\delta x_0$ irrelevant for the observables that matter.

  **Where the Disagreement Lies:**
  In UQ terms, the debate does not dissolve, but it shifts from a disagreement about *dynamics* to a disagreement about **observables and metrics**.

  1.  **The Metric on State Space:** The Contingentist uses a fine-grained metric (e.g., exact border locations, specific names of leaders). Under this metric, the ensemble variance is high. The Structuralist uses a coarse-grained metric (e.g., existence of a bureaucracy, level of energy capture). Under this metric, the ensemble variance is low.
  2.  **The Definition of "Outcome":** The Contingentist defines the outcome as the full state vector $x(t_{final})$. The Structuralist defines the outcome as a projection $P(x(t_{final}))$ onto a low-dimensional subspace.
  3.  **Model Error:** The Structuralist assumes the model structure $F$ is dominated by slow, deterministic forces. The Contingentist argues $F$ includes high-frequency stochastic terms or fast variables that act as noise, effectively making the system diffusive rather than deterministic.

  **Substantive or Dissolved?**
  It remains substantive because the choice of observable is not neutral. It is an ontological claim about what constitutes "History." If you define history as "the sequence of specific events," the Contingentist wins (high variance). If you define history as "the evolution of structural capacities," the Structuralist wins (low variance). In UQ terms, they are arguing over the **Quantity of Interest (QoI)**. You cannot compute Sobol indices until you agree on the QoI.

  ***

  ### Part 2: Residue Report

  **1. Clean Translations**
  *   **Counterfactuals $\rightarrow$ Ensemble Members:** "What if Cleopatra's nose had been shorter?" maps cleanly to perturbing a specific component of $x_0$ and running the ensemble.
  *   **Structural Forces $\rightarrow$ Forcing/Parameters:** "Geography is destiny" maps to $\theta$ dominating the variance budget in a sensitivity analysis.
  *   **Tipping Points $\rightarrow$ Bifurcations/Separatrices:** "The kingdom was lost" maps to crossing a basin boundary into a different attractor.

  **2. Bent Translations (Cost of Translation)**
  *   **Significance/Momentousness:** This is the break point.
      *   *UQ View:* You have a metric $||x - y||$. A shift of magnitude 10 is "larger" than a shift of magnitude 1.
      *   *Historical View:* A shift in "who is king" (magnitude 1 in state space) might be deemed "insignificant" by a Structuralist, while a shift in "ideological paradigm" (magnitude 1 in state space) is "momentous."
      *   *The Cost:* To translate this, you must assume a **weighted norm** on the outcome space, $||x||_W = \sqrt{x^T W x}$, where $W$ is a weighting matrix representing "historical importance." UQ has no intrinsic $W$. The historians are arguing about the entries of $W$. The Contingentist argues $W$ has high weights on specific events; the Structuralist argues $W$ is low-rank, weighting only deep structures.
  *   **Agency:**
      *   *UQ View:* Agency is modeled as internal feedback loops or stochastic forcing within $F$.
      *   *Historical View:* Agency often implies a break in the causal chain (free will) or a reflexive update to the model parameters $\theta$ based on the state $x$.
      *   *The Cost:* Translating agency requires assuming the system is **reflexive** (the state vector observes the trajectory and updates $F$). Standard UQ assumes a fixed model $F$.

  **3. No Expression (The Void)**
  *   **The N=1 Problem:** UQ assumes a probability measure exists over the space of histories. We run ensembles to approximate $P(x)$. Historians often argue that history is a **single realization** ($N=1$). There is no ensemble. There is no frequency. To apply UQ, you must assume a **frequentist or Bayesian measure over unique events**. This is a philosophical cost, not a mathematical one. You are assuming "possible worlds" have a measure.
  *   **Normativity:** UQ quantifies spread; it does not quantify "better" or "worse." Historians often conflate "inevitable" with "progressive" (teleology). UQ has no vector for directionality other than time.

  ***

  ### Part 3: Evaluation of Your Hunch

  Your three categories are technically precise and map exceptionally well to the historiographical confusion.

  **(a) Lyapunov Contingency (Chaos within a basin)**
  *   *Historical Equivalent:* "Great Man" theory noise. The specific date of a battle changes, the specific general dies, but the war's outcome is the same.
  *   *Verdict:* You are correct. Contingentists often point to (a) to prove fragility, but Structuralists correctly note that the *attractor* is stable. If the QoI is the attractor, (a) is irrelevant. This is where much of the heat is generated: arguing about micro-sensitivity while ignoring macro-stability.

  **(b) Basin Contingency (Crossing a separatrix)**
  *   *Historical Equivalent:* "For want of a nail." A small perturbation pushes the system into a qualitatively different regime (e.g., Constitutional Monarchy vs. Republic).
  *   *Verdict:* This is the only form of contingency that satisfies the Contingentist's strong claim. If the system is near a bifurcation point, small $\delta x_0$ leads to disjoint outcomes. Most Structuralist arguments implicitly assume the system is *far* from separatrices during the epoch in question.

  **(c) Forcing Contingency (Parameter drift/Bifurcation)**
  *   *Historical Equivalent:* "The times made the man." The parameters $\theta(t)$ drift until a bifurcation occurs regardless of $x_0$.
  *   *Verdict:* This captures the Structuralist strong claim. The outcome is determined by the forcing path, not the ICs.

  **Is there a Fourth Case?**
  Yes. Your framework assumes a fixed model structure $F$ and a well-defined probability measure. The missing case is **Model Structure Uncertainty (Epistemic Deep Uncertainty)** combined with **Reflexivity**.

  1.  **Model Structure Uncertainty:** In UQ, this is "unknown unknowns." In history, this is the debate between Marxist, Great Man, Geographic, and Cultural historiographies. They aren't just disagreeing on $\theta$ or $x_0$; they are disagreeing on $F$. One says $\dot{x} = f(\text{economics})$, the other says $\dot{x} = g(\text{ideas})$. You cannot run an ensemble sensitivity analysis if you cannot agree on the code. This is not (a), (b), or (c); it is **Structural Ignorance**.
  2.  **Reflexivity (The Observer Effect):** In history, the agents *know* the theories. If a Structuralist theory becomes popular (e.g., "Communism is inevitable"), agents act to prevent or accelerate it, changing $F$. In UQ terms, the system is **non-stationary** because the model parameters depend on the ensemble predictions. This breaks the assumption that the ensemble distribution is static.

  **Conclusion on your Hunch:**
  Your distinction between (a) and (b) is the most valuable tool here. It explains why the debate feels intractable:
  *   The Contingentist points to (a) (unpredictable trajectory) and claims it implies (b) (different outcome).
  *   The Structuralist points to the stability of the attractor in (a) and claims (b) is impossible.
  *   They are talking past each other. (a) does not imply (b).

  However, your framework cannot capture the **Model Structure** dispute or the **N=1 Measure** problem without assuming costs (fixed $F$, existing measure). If you accept those costs, your three categories carve the debate perfectly. If you don't, the fourth case (Structural/Epistemic Uncertainty) swallows the other three.
