      *   *Contingency* $\rightarrow$ High sensitivity to ICs (large Lyapunov exponents) or proximity to separatrices.
      *   *Inevitability* $\rightarrow$ Contraction onto a low-dimensional manifold, strong attractors, small ensemble spread relative to the scale of the observable.
      *   *Counterfactuals* $\rightarrow$ Perturbed ensemble members.
      *   *Significance* $\rightarrow$ This is the tricky part. In UQ, variance is variance. In history, "WWII happens" vs. "WWII doesn't" is different from "WWII starts on Tuesday" vs. "WWII starts on Wednesday."

  4.  **Drafting Part 1: The Translation:**
      *   *The Contingentist:* Claims the system has positive Lyapunov exponents over long time horizons. The predictability horizon is short. The ensemble spread at $t_{final}$ covers disjoint regions of state space (multimodal distribution). Small $\delta x_0$ leads to large $\delta x_t$.
