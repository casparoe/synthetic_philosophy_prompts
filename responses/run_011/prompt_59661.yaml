answer: |-
  **Handout: Standing to Blame in *Crime and Punishment***

  **The Problem of Entitlement**

  In our philosophical readings, we have mapped the "standing to blame" as a question of entitlement. The central intuition is that to blame someone is not merely to describe their fault, but to issue a demand. It is a second-personal address that says, "You owe it to me (or to us) to have done otherwise." Because this address presupposes a relationship of moral equality, certain conditions can strip a blamer of the right to speak. If you are a hypocrite, you violate the equality required to make the demand (Wallace). If you make an unwarranted exception for yourself, you offend the norm that grounds the blame (Fritz and Miller). If you manipulate the situation, you undermine the conditions for a genuine moral response (Todd). In all these cases, the focus is on the *blamer*. Standing is a property they possess or lack based on their own relation to the norm and the person they are addressing.

  Dostoevsky's *Crime and Punishment* does not merely illustrate these categories; it strains them to the breaking point. The novel suggests that standing is not a static property located within the blamer, but a dynamic status negotiated within a specific social and spiritual ecology. Where the analytic literature asks, "Does this person have the right to blame?", Dostoevsky asks, "Can this address actually reach the other person, and to what end?" This handout argues that the novel exposes a structural limitation in the current standing literature: by focusing on the *conditions of the blamer*, secular moral theory misses the way standing is often conferred by the *uptake of the blamed* or by a shared willingness to suffer. We will test this claim against four figures who attempt to hold Raskolnikov to account.

  **Luzhin: Manufactured Accusation vs. Forfeited Standing**

  Consider the scene at Katerina Ivanovna's funeral dinner. Luzhin slips a banknote into Sonia's pocket and then publicly accuses her of theft. How should we analyze this using our standing map?

  If we treat this as a case of hypocritical blame, we imply Luzhin had standing to accuse someone of theft but lost it because he himself was a thief (or a planner of theft). But this feels imprecise. Luzhin is not blaming Sonia for a theft he secretly committed himself; he is fabricating a crime to destroy her reputation. The analytic literature is well-equipped to handle hypocrisy (violating the norm one invokes), but it is less clear on *manufactured* blame. Is this a case of forfeited standing, or blame that never had standing because the normative basis was a lie?

  This distinction matters. In the philosophical models we've studied, the wrong of hypocritical blame is that it treats the blamee as a moral inferior while the blamer secretly exempts themselves. It is a failure of equality. But Luzhin's accusation is not a failure of equality; it is an act of war. He is not trying to restore a moral norm; he is using the *language* of blame as a weapon to remove an obstacle to his marriage.

  Here, the novel points to a gap in the literature. The standing debate assumes that blame is, at root, a moral practice gone wrong in the case of hypocrisy. Luzhin shows us that blame can be a *political* practice disguised as morality. If standing is the right to make a moral demand, Luzhin never had it, because he never intended to make a moral demand. He intended to inflict damage. The literature often conflates "insincere blame" with "hypocritical blame." Dostoevsky forces us to separate them. The distinct wrong Luzhin commits is not that he violated the norm against theft, but that he instrumentalized the practice of accusation itself. This suggests that standing requires not just a commitment to the norm, but a commitment to the *person* being blamed as a participant in the moral community. Luzhin treats Sonia as an object to be discarded. The analytic focus on the blamer's internal consistency misses this relational destruction.

  **Sonia: Social Powerlessness and Moral Authority**

  If Luzhin represents the corruption of standing, Sonia represents its paradox. She is the character who ultimately succeeds in moving Raskolnikov toward confession and redemption. She tells him to go to the crossroads, kiss the earth he has defiled, and announce himself as a murderer. Yet, by the standards of Petersburg society, Sonia has no standing at all. She is a prostitute, legally and socially marginalized, stripped of honor.

  According to the dispositional accounts we read (like Fritz and Miller), standing is grounded in the equality of persons. If standing is a social fact distributed by others' willingness to hear you, Sonia should be silent. No one in the novel's society respects her authority. Yet, Raskolnikov listens. Why?

  This is the strongest challenge the novel poses to the analytic map. The philosophical literature locates standing mainly in the blamer's own commitments: Do *you* respect the norm? Are *you* consistent? Sonia suggests that standing is at least as much about the *relationship* between blamer and blamee as it is about the blamer's credentials. Sonia has standing not because society grants it, but because she demonstrates a willingness to share in Raskolnikov's suffering. She does not stand above him; she stands beside him.

  Is this a category confusion? One might object that Sonia isn't "blaming" Raskolnikov in the strict sense; she is offering spiritual counsel. To call it "blame" is to stretch the term. However, she does explicitly demand that he acknowledge his wrong and submit to punishment. She issues a moral demand. The fact that her authority comes from shared vulnerability rather than abstract equality suggests that the analytic "equality of persons" condition is too thin. It assumes a community of peers who already recognize each other. Dostoevsky presents a fractured world where the only person with the standing to heal the wrongdoer is the one the world has cast out.

  This implies that standing is not a precondition for address, but an *achievement* of address. Sonia earns the right to blame Raskolnikov not by having a clean record (she is a sinner, by her own lights) but by proving her love is stronger than her judgment. The analytic literature treats standing as a gatekeeper: if you don't have it, you shouldn't speak. The novel suggests that sometimes, only those who have lost social standing can speak the truth that matters. This does not invalidate the philosophical theories, but it suggests they describe a specific, perhaps idealized, moral community that does not exist in the world of the novel. In a broken world, standing is not about entitlement; it is about the capacity to sustain a relationship through the aftermath of wrong.

  **Porfiry Petrovich: Manipulation and Authority**

  The investigator Porfiry Petrovich presents a different puzzle. He is convinced of Raskolnikov's guilt but lacks physical evidence. He uses intimacy, insinuation, and psychological games to trap Raskolnikov. He toys with him.

  According to Todd's unification project, manipulation is one of the key grounds for losing standing. If you manipulate the conditions under which someone is blamed, you treat them as a puppet rather than a moral agent. By this metric, Porfiry should have no standing. He is actively engineering Raskolnikov's psychological collapse. Yet, the novel treats Porfiry's demand—that Raskolnikov confess and accept suffering—as authoritative. Porfiry is not a villain; he is a conduit for Raskolnikov's eventual salvation.

  How do we reconcile this? If we say Porfiry has standing because he is a legal official, we miss the point. Raskolnikov does not confess because of the law; he confesses because of the psychological and spiritual pressure Porfiry applies.

  Here we must distinguish between *procedural standing* and *soteriological authority*. Procedural standing is the right to accuse within a system of rules. Porfiry has this legally, but loses it morally through his games. Soteriological authority is the capacity to guide someone toward their own good. The novel suggests that Porfiry retains the latter even if he compromises the former. His manipulation is not for his own benefit (like Luzhin) nor to assert dominance (like a tyrant), but to force Raskolnikov into a position where he can choose life.

  This creates a genuine conflict with the philosophical literature. Todd argues that manipulation undermines the very point of blame, which is to hold someone responsible as an agent. But Dostoevsky seems to argue that for a certain kind of wrongdoer—one who is intellectually arrogant and spiritually isolated—standard moral address will fail. A "clean" moral demand might bounce off Raskolnikov's theory of the extraordinary man. Porfiry's "dirty" manipulation is necessary to breach Raskolnikov's defenses.

  Does this mean the ends justify the means? Not necessarily. It means that the standing literature assumes a rational agent who is responsive to moral reasons. Raskolnikov is not that agent. He is sick. The novel implies that when the wrongdoer is in a state of spiritual pathology, the normal conditions of standing may need to be suspended to effect a cure. This is a dangerous idea for secular moral theory, which fears paternalism. But the novel forces the question: if blame aims at reconciliation, and reconciliation is impossible through standard address, does the blamer have a duty to manipulate? The text doesn't answer clearly, but it validates Porfiry's outcome in a way it never validates Luzhin's. This suggests that standing is not just about the purity of the blamer's hands, but about the efficacy of the address in restoring the moral order.

  **Raskolnikov: Self-Blame and Exemption**

  Finally, we must look at Raskolnikov himself. His "extraordinary man" theory is, at its core, a claim of exemption from standing. He argues that certain individuals are beyond the norms that govern others. If they transgress, they are not subject to the blame of the herd. This is the ultimate denial of the equality condition required by Wallace and others.

  But what happens when Raskolnikov turns blame inward? He goes to the police station; he confesses. Yet, in the Epilogue, we are told he does not yet feel guilt. He views his crime as a failure of strength, not a moral wrong. He blames himself, but he lacks the standing to blame himself effectively.

  This raises a question the analytic literature rarely touches: Can one lose the standing to blame oneself? Usually, we think of self-blame as a private matter. But in the novel, Raskolnikov's self-accusation is sterile until it is met by Sonia's love. His internal monologue cannot produce repentance; only the external relationship can.

  This suggests that standing is fundamentally interpersonal, even in the case of self-blame. You cannot hold yourself accountable in a vacuum. Raskolnikov's isolation is what makes his self-blame impotent. He has the "right" to judge himself, but he lacks the *capacity* to make that judgment stick. The Epilogue shows that standing is not just about who speaks, but about who listens. Raskolnikov cannot hear himself. He needs Sonia to hear him for his self-blame to become real guilt.

  This challenges the idea that standing is an entitlement one holds. It looks more like a circuit that must be completed. Raskolnikov claims exemption from others' blame, which isolates him. He attempts self-blame, which fails. He only finds peace when he accepts Sonia's blame, which reintegrates him into the human community. The analytic focus on the *conditions* of the blamer misses this *function* of blame. Blame is not just a verdict; it is a bridge. If the bridge cannot be crossed, the standing is irrelevant.

  **The Structural Conflict: Entitlement vs. Achievement**

  We can now return to the overarching question: Does Dostoevsky dramatize something the standing literature misses?

  My position is that the miss is structural. The contemporary analytic literature treats standing as a *deontic* concept—a matter of rights, duties, and entitlements. It asks what you are *allowed* to do. It is backward-looking: Have you violated the norm? Are you a hypocrite? Do you have the right to speak?

  Dostoevsky treats standing as a *teleological* concept—a matter of ends and transformation. It asks what the blame *does*. It is forward-looking: Will this address heal the wrongdoer? Will it restore the community?

  This is not simply a matter of theology vs. secular ethics. Even if we strip away the religious language of the Epilogue, the structural point remains. The analytic model assumes a stable moral community where agents are roughly equal and rational. In that world, protecting the norms of address (by policing hypocrisy and manipulation) is the priority. In Dostoevsky's world, the community is fractured, the agents are damaged, and the norms are weaponized. In that world, protecting the *possibility of return* is the priority.

  Therefore, Sonia has standing not because she satisfies the conditions of the analytic theories, but because she is the only one who can facilitate Raskolnikov's return. Porfiry retains authority not because his methods are clean, but because they work toward that same end. Luzhin fails not because he is a hypocrite, but because his accusation severs the possibility of return.

  **An Objection and Reply**

  An obvious objection arises here. Am I not simply imposing a therapeutic or theological framework onto a text and calling it a philosophical critique? One could argue that the analytic literature is doing a different job. It is mapping the logic of moral accountability in a just society. Dostoevsky is writing about salvation in a fallen world. To say the literature "misses" something is like saying a map of the subway system misses the scenic beauty of the city above ground. They are different projects.

  This objection has force. If we are asking about the *rights* of blame in a liberal democracy, Sonia's social status *should* disqualify her, and Porfiry's manipulation *should* be impermissible. The novel does not refute the analytic theories on their own turf; it changes the turf.

  However, this objection concedes too much. Moral philosophy is not just about ideal societies; it is about how we actually live. If the analytic theories cannot account for the intuition that Sonia *ought* to be heard and Luzhin *ought* to be silenced, they are descriptively inadequate. They fail to capture why we feel Luzhin's blame is an affront even if he weren't a hypocrite (e.g., if he truly believed she stole it but framed her anyway to teach her a lesson). They fail to capture why Porfiry's manipulation feels different from a torturer's manipulation.

  The novel forces us to admit that standing is not just about the blamer's purity. It is about the texture of the relationship. If the literature cannot accommodate the idea that social powerlessness does not equate to moral silence, or that manipulation can sometimes serve agency rather than undermine it (in cases of profound alienation), then it is not just a map of a different project; it is a map that leaves out the most difficult terrain.

  **Where the Reading is Imposed**

  I must be explicit: reading Porfiry as a soteriological figure rather than a state functionary is an imposition of the novel's religious ending onto his earlier investigative conduct. The text allows this, but does not demand it. One could read Porfiry simply as a clever detective who enjoys his work. Similarly, claiming that Raskolnikov's self-blame lacks "standing" relies on a definition of standing that requires successful uptake. The analytic literature might define standing simply as the *permission* to self-blame, regardless of whether it works. I am arguing for the latter definition because the former makes better sense of the Epilogue's dissatisfaction. If standing were just permission, Raskolnikov would be fine. The fact that he is not suggests standing requires more.

  **Conclusion**

  The novel does not solve the problem of standing. It complicates it. It suggests that the right to blame is not a property you own, but a connection you sustain. When that connection is broken by hypocrisy (Luzhin), social exclusion (Sonia), or manipulation (Porfiry), the question is not just "who is at fault?" but "can the connection be repaired?" The analytic literature gives us the tools to judge the blamer. Dostoevsky gives us the tools to judge the relationship. We need both.

  ***

  **Class Pitch: The Luzhin Scene**

  "When we look at Luzhin framing Sonia, don't just ask if he's a hypocrite. Ask if 'hypocrite' is even the right word. If he's manufacturing a crime to remove a rival, he isn't failing to live up to a norm he claims to hold; he is weaponizing the norm itself. Does the standing literature have a category for blame that is not just inconsistent, but predatory?"
