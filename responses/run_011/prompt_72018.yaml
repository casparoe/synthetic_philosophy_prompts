answer: |-
  The foliation is part of the world because the dynamics are undefined without it, not because our measurements can detect it. You are conflating empirical accessibility with ontological status. In Bohmian mechanics, the velocity of a particle depends on the instantaneous configuration of the entire system via the wavefunction. For spacelike separated entangled particles, "instantaneous" is meaningless without a specific slicing of spacetime. If you remove the foliation, you remove the definition of the trajectory itself, leaving you with a mathematical contradiction, not just an empirically hidden variable.

  Your comparison to Everett fails because their unobservables are redundant copies of outcomes, whereas our foliation is the structural prerequisite for having outcomes at all. Everettians shrug because their ontology is just the wavefunction; ours includes particles moving in space. If you insist on particles with definite positions evolving in time, you must specify what "time" means for the evolution law. That we cannot signal using this structure is a feature of quantum equilibrium, not evidence that the structure is fictitious. We prefer a theory that tells a coherent story about single events over one that dissolves events into branching amplitudes.
