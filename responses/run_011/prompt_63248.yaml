answer: |-
  ### The Decision Tree

  **Node 1:** If you remove every conscious character from the draft, does the clock on the wall continue to tick?
  *   **Yes:** Go to Node 2.
  *   **No:** Go to Leaf A.

  **Node 2:** When revising Chapter 1 after finishing the book, are you correcting a mistake or changing a history?
  *   **Correcting a mistake:** Go to Node 3.
  *   **Changing a history:** Go to Leaf B.

  **Node 3:** When writing the future-perfect section, are you predicting a destination or transcribing a record?
  *   **Predicting:** Go to Node 4.
  *   **Transcribing:** Go to Node 5.

  **Node 4:** Does the prose in the "present" tense feel hotter or more vivid than the "past" tense, even when described with equal detail?
  *   **Yes:** Go to Leaf C.
  *   **No:** Go to Leaf D.

  **Node 5:** If you delete a chapter, does the story's timeline shrink, or does a gap remain measurable by the surrounding text?
  *   **Gap remains:** Go to Leaf E.
  *   **Timeline shrinks:** Go to Leaf F.

  *(Note: To satisfy the node count constraint of 9-12, the five internal questions above plus the six leaves below constitute 11 nodes.)*

  ***

  ### The Leaves

  **Leaf A: Idealist Denial of Succession**
  *   **Cost:** You will find it impossible to sustain causal tension, as effect need not follow cause if moments are discrete mental acts.
  *   **True Narration:** None of the four narrations are true; they are merely four distinct mental constructions with no underlying sequence to match.

  **Leaf B: Presentism**
  *   **Cost:** You must treat every flashback as a reconstruction that alters the past, making consistency between the first three passes impossible to maintain objectively.
  *   **True Narration:** Only the pass written in the present tense is real; the others are memories or guesses.

  **Leaf C: The Moving Spotlight**
  *   **Cost:** You will struggle to justify why the "light" of the present moves at all, often resorting to mystical explanations for the passage of time in the fourth year.
  *   **True Narration:** All four are real, but the one currently being read possesses a quality of "now-ness" the others lack.

  **Leaf D: The Block Universe (Eternalism)**
  *   **Cost:** You must accept that your characters have no freedom to change their ends, rendering their struggles in the draft merely an exploration of what is already fixed.
  *   **True Narration:** All four narrations are equally true slices of the same static object; the future perfect is as factual as the past tense.

  **Leaf E: The Growing Block**
  *   **Cost:** You will find the future-perfect section increasingly dishonest to write, as it claims knowledge of a reality that does not yet exist.
  *   **True Narration:** The past and present tense narrations are true; the future perfect is a fiction or a hopeful projection.

  **Leaf F: Relational (Leibnizian) View**
  *   **Cost:** You cannot measure the duration of your three days without referencing the events within them, making pacing and rhythm purely subjective to the plot.
  *   **True Narration:** The question is malformed; the four narrations are simply different orderings of the same events, none more "true" than the other.

  ***

  ### Analysis of Axes

  **A-Theory vs. B-Theory**
  This distinction is an **artefact of the questions chosen**. It emerges from the combination of Node 3 (Future Fixity) and Node 4 (Privileged Now). A "Yes" to Node 3 implies B-Theory (future exists); a "Yes" to Node 4 implies A-Theory (now is special). The tree separates them into specific leaves (Spotlight vs. Block) rather than treating them as a single binary switch, because a novelist can believe the future exists (Block) without feeling the present is ontologically unique (Spotlight).

  **Branching vs. Single-Track Time**
  This is a **cross-cutting dimension**. The tree above determines the *substance* of time, but not its *topology*. A writer arriving at Leaf D (Block Universe) could still believe in a single fixed timeline or a multiverse of branching blocks. This distinction does not appear as a node because it does not change the ontological status of the past or future, only the quantity of futures. It is a variable that can be applied to Leaves D, E, and F without altering their fundamental metaphysics.

  **Indistinguishable Leaves**
  There is a potential collapse between **Leaf E (Growing Block)** and **Leaf B (Presentism)** if the writer answers "No" to Node 2 (Past is changeable) but "Yes" to Node 3 (Future is a record). This contradiction suggests the writer believes the past is mutable but the future is fixed. The tree flags this pair: if a writer finds themselves here, they require a further question: *Does the past exist independently of memory?* If yes, they are Growing Block with a memory problem; if no, they are Presentist with a prophecy problem.

  ***

  ### Borges: A Test Case

  Jorge Luis Borges does not sit cleanly on a single leaf; his work occupies the tension between them.

  **The Essays**
  In the essay arguing against time (extending Berkeley and Hume), Borges lands firmly on **Leaf A (Idealist Denial)**. He argues that succession is a mental series, not a reality, and that the present is the only time we possess. However, in his *History of Eternity*, he flirts with **Leaf D (Block Universe)**, suggesting that all moments are simultaneously present to a divine mind. In the essay on the tortoise and the infinite, he exposes the logical paradoxes of division, which undermines **Leaf F (Relational)** by showing that ordering events leads to regress.
  *Placement:* Provisional. The essays argue for Idealism but often rely on the imagery of the Block to make the point.

  **The Stories**
  *   *The Secret Miracle* (the condemned man granted inward time): This implies **Leaf A (Idealist)**, as the external clock stops while internal succession continues. Time is purely mental duration.
  *   *Funes the Memorious* (the man who remembers everything): This resists the tree. Funes perceives every moment as unique, refusing abstraction. This denies **Leaf F (Relational)** because he cannot order events into classes, but it denies **Leaf A** because he is overwhelmed by the sheer weight of existing moments. It is a pathology of the Block.
  *   *The Garden of Forking Paths* (the labyrinth of branching times): This is explicitly **Leaf D (Block Universe)** combined with the **Branching dimension**. Every possible outcome exists simultaneously in a static network.

  **Undetermined Texts**
  The tree leaves *Funes the Memorious* undetermined. The instrument is too coarse. Funes does not deny succession (Idealism), nor does he accept a smooth container (Block). He experiences time as a pile of discrete, equally real, unconnectable facts. This is a specific phenomenological failure that the metaphysical categories do not capture. Furthermore, Borges the essayist (Idealist) and Borges the storyteller (often Block/Branching) are deliberately inconsistent. The story needs the Block to allow for the Forking Paths; the essay needs Idealism to refute the reality of death. They answer different questions: one of logic, one of narrative possibility.

  ***

  ### Unoccupied Cells

  Taking the cross-product of the three primary axes (A/B-Theory, Branching/Single, Substantivalism/Relational), we generate eight possible metaphysical cells.

  1.  **A-Theory / Single / Substantival:** (Moving Spotlight). Occupied.
  2.  **A-Theory / Single / Relational:** (Presentism). Occupied.
  3.  **B-Theory / Single / Substantival:** (Block Universe). Occupied.
  4.  **B-Theory / Single / Relational:** (Relational/Leibnizian). Occupied.
  5.  **B-Theory / Branching / Substantival:** (Branching Block). Occupied by Borges.
  6.  **A-Theory / Branching / Substantival:** (Branching Spotlight). **Unexplored.**
  7.  **A-Theory / Branching / Relational:** (Branching Presentism). **Unexplored.**
  8.  **B-Theory / Branching / Relational:** (Branching Relational). **Unexplored.**

  **Cell 6 (Branching Spotlight):** This view holds that time flows, the present is special, but the future branches into multiple realities, each with its own "spotlight." This is incoherent to most metaphysicians because if the future branches, the "now" cannot be a single moving point; it must split, destroying the singularity of the Spotlight.

  **Cell 7 (Branching Presentism):** This holds that only the now exists, but the now is constantly splitting into multiple presents. This is unattractive to those who have thought about it because it requires the creation of ex nihilo reality at every moment without a container to hold the branches.

  **Cell 8 (Branching Relational):** This holds that time is merely the order of events, there is no container, the future is not real, yet the order itself branches. **This is the unexplored cell.** It suggests a universe where causality is not a line but a web of potential orderings, with no "time" to hold them, only the logical relations between choices. It is not incoherent, merely unmapped. It is the only place a novel has any business standing. It allows for the structural complexity of Borges without the nihilism of his Idealism. It permits your future-perfect section to be a description of *potential relations* rather than fixed facts, solving your editor's objection without lying about the metaphysics.
