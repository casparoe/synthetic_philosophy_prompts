answer: |-
  ### 1. Cases it must describe and arguably cannot

  **A trait now fixed in a population, with no variation left for retention to act on.**
  *Verdict: Survives, conditionally.*
  The view survives if "history" allows the sensitive retention mechanism to be entirely past-tense. If the trait was retained by selection *until* fixation, the function persists. However, the view breaks if the retention mechanism must be *ongoing*. In a fixed population, differential reproduction ceases to operate on that trait. If the only remaining "retention" is developmental inertia or lack of mutation, and these mechanisms are not "sensitive" to the effect (they just happen), the view implies the function vanishes upon fixation. This contradicts standard biological practice, which ascribes function to fixed traits (e.g., the genetic code) based on their maintenance or past utility.

  **A novel structure retained by luck for a single generation and then lost.**
  *Verdict: Survives (by denial).*
  The view correctly denies function here, as there is no history of retention *because* of the effect. The retention was drift, not sensitive registration. This aligns with Selected Effects theory. However, it breaks against the intuition of some biologists who might ascribe a "proto-function" or immediate capacity-based function to the trait during that generation. The view is rigid here: no history, no function.

  **Lens crystallins, recruited from proteins whose earlier job was ordinary metabolism.**
  *Verdict: Bends (The Time-Lag Problem).*
  The protein has a metabolic function (history of sensitive retention for metabolism). Does it have a refractive function? Only if there is a history of retention *for refraction*. If the recruitment is evolutionarily recent, the sensitive retention mechanism for the lens role may not yet be established. The view forces you to say the crystallin *lacks* the lens function until selection has had time to act on the new role. This conflicts with the common ascription of function immediately upon the discovery of the beneficial capacity. The view demands a waiting period for history to accumulate.

  **Promiscuous enzymes that catalyze a second reaction no history of retention mentions.**
  *Verdict: Breaks.*
  The view denies function for the second reaction. Causal Role theory ascribes function immediately. If the promiscuous activity contributes to the organism's capacity and is physiologically relevant, biologists often call it a function (or "latent function"). Your view withholds the label until a retention mechanism (e.g., selection for buffering) becomes sensitive to that specific side-reaction. This makes the view conservative compared to biological usage, potentially rendering it descriptively inadequate for systems biology where promiscuity is functional.

  **Vestigial organs that still do something.**
  *Verdict: Breaks.*
  Consider the human appendix. It has immune functions. But if it is vestigial, the history of retention for *that* immune function may be absent or secondary to the original (lost) function. If the organ is maintained by drift or pleiotropy, and no mechanism currently "registers" the immune effect to retain the organ, your view denies it has a function. Biologists typically ascribe function to the current capacity. Your view prioritizes the etiology of the *organ's presence* over the *capacity's utility*. This creates a divergence from standard physiological discourse.

  ### 2. Whether the view collapses into a rival

  **Can a purely causal-role account mimic everything the sensitivity clause delivers?**
  A Causal Role (CR) theorist could add a "registration" requirement (e.g., "the system must monitor this effect"). However, CR is fundamentally synchronic (about what a trait does *now* in a system), while your view is diachronic (about *why* it is there via history). A CR theorist adding "history" ceases to be a pure CR theorist. A CR theorist adding "registration" moves toward a control-systems view. They can mimic the *extension* (the list of things counted as functions) only by abandoning the core ahistorical commitment of CR. Therefore, they cannot mimic the *explanation* of function, only the output.

  **Is this just Selected-Effects (SE) theory with the population requirement deleted?**
  This is the most dangerous charge. Your view generalizes "selection" to "retention" and "population" to "mechanism."
  *Strongest Reply:* The reply is that SE is a proper subset of your view. SE explains biological lineage functions; your view explains biological, neurological, and artifactual functions under one ontology. The "deleted population requirement" is not a bug but a feature of unification.
  *Is it decisive?* No, it is dialectically convenient. It risks becoming a verbal stipulation. If "retention" covers everything from natural selection to a bridge inspector's logbook, the term may become so thin that it merely labels "whatever kept the trait there." If the unification is achieved by emptying the concept of "selection" of its specific biological content (differential reproduction), the view gains breadth but loses the specific explanatory power that made SE attractive (i.e., explaining teleology via blind variation).

  **Is this just Causal-Role theory with an etiological epicycle bolted on?**
  *Strongest Reply:* No, because the etiology is not an add-on; it is the definition. CR defines function as contribution to capacity. You define it as history of sensitive retention. These are contradictory definitions, not compatible ones.
  *Is it decisive?* It is decisive against collapse, but leaves the view vulnerable to the charge of being *unnecessary*. If CR + "registration" explains the normativity you seek without the heavy metaphysical lifting of historical retention, your etiological requirement looks like an expensive solution to a problem CR can solve with a "reference class" adjustment.

  ### 3. Malfunction

  **Does an etiology-free rival actually lose anything here?**
  An etiology-free rival (like CR) accommodates dysfunction by defining it as a failure to perform the typical causal contribution of that trait type.
  *What they lose:* They lose the ground for *why* that typical contribution is the standard. In CR, "typical" is statistical. In your view, "typical" is normative based on the retention condition.
  *Can they accommodate every case?* Descriptively, yes. If a heart fails to pump, CR calls it dysfunction because it isn't pumping like other hearts. Your view calls it dysfunction because it isn't doing what kept hearts in existence.
  *The Loss:* The rival loses the ability to distinguish between a *statistical anomaly* and a *failure of purpose*. If a mutation makes a heart pump blood backwards, and this becomes common (statistical normality), CR struggles to call it dysfunction without appealing to an external "design." Your view handles this easily (the retention history was for forward pumping). However, a sophisticated CR theorist can import "normality" from the species' design plan without etiology. Thus, the rival loses *explanatory depth* regarding the source of the norm, but not *descriptive coverage* of dysfunction cases.

  ### 4. Concessions

  **Which would a committed holder accept as counting against them?**
  A committed holder would dismiss the "Lucky Novelty" case as a feature (correctly filtering out drift). They would accept the "Fixed Trait" and "Vestigial Organ" cases as awkward but necessary costs of maintaining etiological purity. They would find the "Crystallin/Moonlighting" case the most troubling.

  **Ranking the Defeaters:**
  1.  **Fatal:** **Vacuity of "Sensitivity."** (See Section 5). If "sensitivity" cannot be distinguished from mere causal consequence, the view collapses into CR. If it is too strict, it excludes standard biological functions. This is the structural weak point.
  2.  **Seriously Damaging:** **The Time-Lag Problem (Crystallins/Moonlighting).** If the view denies function to traits that are currently beneficial and maintained, simply because the history is too short, it becomes out of step with biological practice. It implies biologists are wrong to ascribe function to newly recruited traits until selection "catches up."
  3.  **Seriously Damaging:** **Vestigial Organs with Current Utility.** Denying function to the appendix's immune role because the *organ's* retention history is vestigial (even if the *capacity* is maintained by current selection) creates a conflict between your ontology and medical/biological usage.
  4.  **Cosmetic:** **Fixed Traits.** This is resolvable by clarifying that past sensitive retention suffices, even if current retention is inertial.

  ### 5. Vacuity

  **Is there any observation that would force you to abandon the view?**
  Yes. If it is demonstrated that traits are routinely retained by mechanisms that are *causally dependent* on the effect but do not *register* the effect in any distinguishable way, the view is in trouble.
  *Example:* Constructive Neutral Evolution (CNE). In CNE, complexity increases and is retained not because of sensitivity to an effect, but because of ratchet-like dependencies where reversal is impossible, not because the effect is "registered." If biologists ascribe function to these CNE traits (as they often do), and your view denies it because there was no "sensitive registration," your view is empirically inadequate to biological taxonomy.
  *Alternatively:* If "sensitivity" is stretched to include *any* causal loop that maintains a trait, the view becomes vacuous. If a trait persists because it causes X, and X causes the trait to persist, is that "sensitivity"? If yes, then almost all stable causal loops count, and the view collapses into a sophisticated Causal Role theory. If no, you must specify what "registration" is without appealing to function (to avoid circularity).

  **Is this a genuine defect?**
  For a conceptual framework, some elasticity is acceptable. However, if the elasticity allows the view to absorb any counter-example by redefining "retention" or "sensitivity," it ceases to be a theory of function and becomes a taxonomy of "things we decide to call functions." This is a genuine defect if the goal is to explain biological teleology; it is acceptable only if the goal is purely linguistic sorting. Given your claim about "mechanisms," you aim for explanation, so vacuity is a fatal defect.

  ### Final Commitments and The Attack

  **What your view commits you to that rivals are not:**
  You are committed to the **unity of function across domains**. You claim the function of a heart, the function of a memory trace, and the function of a drainage scupper are the *same kind of fact* (sensitive retention), differing only in the physical substrate of the mechanism. SE theorists restrict this to biology. CR theorists restrict this to systemic capacity. You claim a universal ontology of teleology based on maintenance loops.

  **The single commitment to attack first:**
  Attack the **"Sensitivity" (Registration) Condition**.
  This is the linchpin. If you cannot define "registration" without implicitly invoking "function" (circularity) or without making it so broad that it includes mere causal stability (vacuity), the entire structure falls.
  *The Strategy:* Demand a non-teleological account of "registration." Does a gene regulatory network "register" an effect? Does a bridge inspector? What is the common physical property? If the answer is "information," you must define biological information without function. If the answer is "feedback," you must explain why some feedback loops confer function and others do not. If this condition fails, the view collapses into Causal Role theory (if sensitivity is broad) or becomes empirically false (if sensitivity is narrow). Destroying this clause severs the link between the history and the normativity, leaving you with either bare history (SE) or bare capacity (CR).
