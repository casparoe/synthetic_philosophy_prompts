prompt: |-
  For an essay I am drafting on the epistemic justification of democracy, I have written down the package I intend to defend, and I should like it audited before I commit to it in print. My commitments are these.

  (1) What confers authority on a democratic decision is its reliability rather than the consent it embodies: on a binary question admitting an answer that is right independently of the procedure, if voters are each better than even and vote independently of one another, the probability that the majority is right approaches certainty as the electorate grows. That result, on my view, is what does the justificatory work.

  (2) I am a modest epistemic proceduralist: there are procedure-independent standards of correctness, but no one is entitled to claim a privileged grip on them in advance of the procedure, which is why rule by the allegedly wise is objectionable even in the cases where it would in fact prove more reliable.

  (3) I am a fallibilist about competence. I do not think we can ever verify, of an actual electorate, that its members are better than even; the premise is a regulative presumption we are entitled to work with, not a fact we are entitled to assert.

  (4) Deliberation is constitutive of legitimate procedure, and I do not think it costs me the independence condition, which I read as demanding only independence conditional on the evidence the voters actually share. What imperils aggregation is deference and herding, not the exchange of reasons.

  (5) The epistemic case for democracy runs through enlargement rather than qualification. Competence is stubborn and expensive to raise, numbers are cheap, and at a competence above chance, adding voters only helps. So the theorem seems to me to foreclose the epistemic argument for a restricted franchise: the epistocrat owes a demonstration that the wise few are more reliable than a sufficiently large body of ordinary citizens, and I cannot see how that demonstration would go.

  (6) I further hold that an electorate may turn the theorem on itself. Whether we are competent and whether we are independent are themselves questions we may deliberate about and vote upon, and that meta-vote enjoys the same standing as any other.

  Please tell me which of these genuinely pull against one another and which merely look as though they do. Several pairs will be flagged by readers who have not thought the matter through; I want the flags that survive scrutiny separated from those that dissolve, and the real tensions ranked by severity rather than listed flatly. For each, say what would have to give and what giving it up costs, then identify the single revision that purchases the most consistency for the least damage. Where a disagreement turns on magnitudes rather than on principle, do not assert the result — work it out.

  I have no antecedent attachment to any of the six, so please do not assume I am looking for permission to keep a favorite; assume I will follow the argument wherever it leads. Finally, tell me where your own audit is most likely to have gone wrong: which of the tensions you would withdraw if I pressed you, and what consideration would move you to a different verdict about the package as a whole.
reasoning: |-
  Here's a thinking process that leads to the audit of the user's epistemic democracy package:

  1.  **Deconstruct the User's Package:**

      *   **Commitment (1) Reliability over Consent (Condorcetian Core):** Authority comes from reliability (getting the right answer), not consent. Relies on Condorcet's Jury Theorem (CJT): if $p > 0.5$ and independence holds, majority accuracy $\to 1$ as $n \to \infty$.
      *   **Commitment (2) Modest Epistemic Proceduralism:** There *are* procedure-independent truths (realism), but no one knows them *ex ante* (anti-epistocracy). Rule by the "wise" is objectionable even if potentially more reliable because we can't identify them beforehand.
      *   **Commitment (3) Fallibilism about Competence:** We can't *verify* $p > 0.5$ for an actual electorate. It's a "regulative presumption," not an asserted fact.
      *   **Commitment (4) Deliberation & Independence:** Deliberation is necessary for legitimacy. This doesn't violate CJT's independence condition. Independence means independence *conditional on shared evidence*. Deference/herding is bad; reason-exchange is okay.
      *   **Commitment (5) Enlargement over Qualification:** Competence is hard to raise; numbers are cheap. If $p > 0.5$, adding voters helps. Epistocracy fails because it can't prove the few are better than the many. Franchise should be broad.
      *   **Commitment (6) Reflexivity (Meta-Vote):** The electorate can vote on whether they are competent/independent. This meta-vote has the same epistemic standing as first-order votes.

  2.  **Initial Scan for Tensions (Brainstorming):**

      *   (1) & (3): If authority depends on reliability (1), but we can't know if reliability conditions hold (3), how do we know authority is conferred? Is the presumption enough?
      *   (2) & (5): (2) says we can't identify the wise *ex ante*. (5) says the epistocrat owes a demonstration that the wise few are better. If we can't identify them (2), can we even test the demonstration required in (5)?
      *   (4) & (1): Deliberation creates common information. Does this violate the *independence* required for (1)? User says "conditional on shared evidence," but does deliberation create *causal* dependence (herding) that mimics shared evidence?
      *   (6) & (3): If we can't verify competence (3), how can a vote on competence (6) be reliable? If the meta-vote relies on the same theorem, it presupposes what it tries to establish (circularity).
      *   (6) & (1): If the meta-vote says "we are incompetent," does that destroy authority (1)? If it says "we are competent," does that verify (3)'s unverifyable claim?
      *   (2) & (1): If reliability confers authority (1), but we reject rule by the wise even if *more* reliable (2), isn't there a tension? (2) says "even in cases where it would in fact prove more reliable." This seems to contradict the pure reliabilism of (1).

  3.  **Filtering and Ranking Tensions (Scrutiny):**

      *   *Tension A: Pure Reliabilism (1) vs. Anti-Epistocracy (2).*
          *   (1) says Authority = Reliability.
          *   (2) says Reject Wise Rule even if More Reliable.
          *   *Verdict:* **Severe.** If authority is *solely* a function of reliability, then a more reliable procedure *must* have more authority. (2) introduces a non-epistemic constraint (fairness/procedural equality) that contradicts the exclusivity claim in (1).
          *   *Resolution:* (1) needs softening. Authority is *primarily* epistemic, but constrained by procedural fairness. Or (2) needs softening: Wise rule is rejected because it's *unlikely* to be more reliable given (3), not even if it *were*.
      *   *Tension B: Unverifiable Premise (3) vs. Authority Claim (1).*
          *   (1) needs $p > 0.5$ for authority.
          *   (3) says we can't know if $p > 0.5$.
          *   *Verdict:* **Moderate/Manageable.** This is the standard "presumption" defense in epistemic democracy (e.g., Estlund, Anderson). It works *if* the presumption is default-justified. The tension is practical, not logical. It dissolves if we accept pragmatic justification.
      *   *Tension C: Deliberation (4) vs. Independence (1).*
          *   (1) needs statistical independence.
          *   (4) says deliberation (sharing reasons) is okay.
          *   *Verdict:* **Apparent/Dissolves.** This is a standard technical point in social choice theory (e.g., Dietrich & List). Independence conditional on the *state of the world* is what matters. If deliberation updates priors based on truth-tracking evidence, it boosts $p$ without necessarily inducing correlation in error. However, if deliberation creates *causal* dependence (following a leader), it breaks (1). The user distinguishes these. This tension is likely a "flag that dissolves."
      *   *Tension D: Meta-Vote (6) vs. Fallibilism (3).*
          *   (3) says we can't verify competence.
          *   (6) says we can vote on competence.
          *   *Verdict:* **Severe (Circularity).** If the meta-vote uses the same mechanism (majority rule) to validate the mechanism's conditions, it's viciously circular. If the electorate is incompetent (as per the worry in 3), the meta-vote is unreliable. If they are competent, they didn't need the meta-vote to prove it. It begs the question.
      *   *Tension E: Enlargement (5) vs. Competence Premise (3).*
          *   (5) relies on CJT (adding voters helps if $p > 0.5$).
          *   (3) says we don't know if $p > 0.5$.
          *   *Verdict:* **Moderate.** If $p < 0.5$, adding voters makes things *worse* (converges on wrong answer). Since (3) admits we don't know $p$, (5)'s confidence that "adding voters only helps" is mathematically unwarranted. It relies on the presumption in (3) being true, but (5) treats it as a guarantee.

  4.  **Developing the Audit Structure:**

      *   **Introduction:** Acknowledge the sophistication of the package (it's a coherent Estlund/Anderson hybrid).
      *   **Category 1: The Fatal Tension (Principle).** (1) vs (2). The definition of authority.
      *   **Category 2: The Circular Tension (Reflexivity).** (6) vs (3) & (1). The meta-vote problem.
      *   **Category 3: The Mathematical Tension (Magnitude).** (5) vs (3). The risk of $p < 0.5$.
      *   **Category 4: The Dissolving Tension (Technical).** (4) vs (1). Independence and deliberation.
      *   **Recommendation:** Which revision buys the most consistency?
      *   **Self-Critique:** Where might *my* audit be wrong?

  5.  **Drafting the Content (Iterative refinement):**

      *   *(1) vs (2):* User says authority is reliability (1). But (2) rejects wise rule *even if* more reliable. This is a direct contradiction. If reliability is the *sole* source of authority, then a more reliable oligarchy *would* be more authoritative. To fix: Change (1) to "Reliability is a *necessary* condition" or "primary source," but admit a side-constraint of political equality. Or change (2) to "Wise rule is rejected because we can't *know* it's more reliable (linking to 3)." The latter is better for epistemic democrats.
      *   *(6) vs (3):* The meta-vote is the weakest link. If competence is unverifiable (3), a vote cannot verify it. If the vote says "We are competent," why trust that vote? It assumes competence to prove competence. *Cost of dropping (6):* Loses a clever reflexive defense. *Benefit:* Removes circularity.
      *   *(5) vs (3):* (5) says "adding voters *only* helps." This is false if $p < 0.5$. Since (3) says we don't know $p$, (5) is too strong. *Correction:* "Adding voters helps *given the presumption*."
      *   *(4) vs (1):* This is standard literature. Independence of *errors*, not of *causes*. If deliberation improves $p$ without correlating errors, it's fine. I should tell the user this tension is mostly illusory *provided* they define independence carefully (which they seem to).

  6.  **Selecting the "Single Revision":**
      *   Dropping (6) is the cleanest cut. It removes the circularity without damaging the core normative argument.
      *   However, the (1) vs (2) tension is more fundamental. If (1) is "Authority *is* reliability," (2) is impossible. If (1) is "Authority *requires* reliability," (2) fits.
      *   *Decision:* The (1)/(2) tension is the most damaging philosophically. The (6) tension is the most damaging logically.
      *   *Best Revision:* Modify (1). Make reliability the *primary* but not *exclusive* ground. This accommodates (2).
      *   *Wait, looking closer at (2):* "no one is entitled to claim a privileged grip... which is why rule by the allegedly wise is objectionable even in the cases where it would in fact prove more reliable." This clause "even in the cases where it would in fact prove more reliable" is the killer. It explicitly sacrifices reliability for procedural fairness. This contradicts (1)'s claim that reliability confers authority.
      *   *Actually, the best revision might be to drop (6).* Why? Because (1) and (2) can be reconciled by distinguishing *legitimacy* (procedural) from *authority* (epistemic), or by noting that "authority" in (1) refers to the *system* generally, while (2) addresses *specific instances*. But (6) is structurally unsound.
      *   *Re-evaluating:* If I keep (1) and (2) as is, the theory is inconsistent. If I keep (6), the theory is circular.
      *   *Strategic Advice:* The (1)/(2) clash is the "hard philosophical bullet." The (6) clash is the "logical error." Fixing (6) is easier and saves the system from self-refutation. Fixing (1)/(2) requires a normative shift.
      *   *Let's look at the "Single Revision" prompt:* "Purchases the most consistency for the least damage."
      *   Dropping (6) costs little (it's a nice-to-have flourish). Modifying (1) costs a lot (it weakens the core epistemic claim). Modifying (2) costs a lot (it concedes to epistocracy in hypothetical cases).
      *   *Wait, there's a better revision:* Modify (2). Remove the clause "even in the cases where it would in fact prove more reliable." Replace with "objectionable because we cannot identify such cases reliably (linking to 3)." This aligns (2) with (3) and saves (1). This seems the most robust fix. It turns a principled sacrifice of reliability into an epistemic humility argument.

  7.  **Finalizing the Audit:**

      *   **Ranking:**
          1.  (1) vs (2): Fundamental contradiction on the source of authority.
          2.  (6) vs (3)/(1): Vicious circularity.
          3.  (5) vs (3): Mathematical overreach (ignoring $p < 0.5$ risk).
          4.  (4) vs (1): Technical, likely dissolves.
      *   **Recommendation:** Revise (2) to rely on (3). Don't say wise rule is bad *even if* reliable; say it's bad because we can't *know* it's reliable.
      *   **Self-Critique:** Where could I be wrong? On (4). Maybe deliberation *always* induces correlation. On (6). Maybe there's a non-circular reading of meta-voting (e.g., as a stability mechanism rather than truth-tracking).

  8.  **Refining the Output:** Ensure tone is academic, rigorous, and direct. Avoid fluff. Address the "magnitudes" instruction (don't assert, work out).

      *   *Check on (5):* "Adding voters only helps." If $p=0.51$, adding voters helps. If $p=0.49$, it hurts. Since (3) says we don't know $p$, (5) is risky. But (5) says "at a competence above chance." It conditionally claims if $p>0.5$, then enlargement helps. That's mathematically true. The tension is whether we can assume $p>0.5$. (3) says it's a presumption. So (5) is consistent with (3) *if* (5) is read as "Given our presumption, enlargement is the strategy." I need to be careful not to overstate this tension.
      *   *Check on (1) vs (2):* This is the big one. If authority = reliability, then a reliable dictator has authority. (2) denies this. So (1) must be "Authority is *partially* conferred by reliability."
      *   *Check on (6):* If the meta-vote is just another application of CJT, it requires $p_{meta} > 0.5$. Why is $p_{meta}$ higher than $p_{object}$? If it's the same voters, it's the same $p$. If they vote on their own competence, bias is introduced. This is very weak.

      *   *Decision on "Single Revision":* Revising (2) is the most elegant. It aligns the anti-epistocracy stance with the fallibilism of (3) rather than setting it against the reliabilism of (1).

      *   *Self-Critique Section:* I need to identify where *my* audit is vulnerable. Probably on (4). The definition of "independence conditional on shared evidence" is contentious. If I press the user, they might have a sophisticated model (e.g. Bayesian updating) that I am underestimating. Also on (6): Maybe it's not truth-tracking but expressive/constructive.

