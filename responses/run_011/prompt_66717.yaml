answer: |-
  Claim Number 8940

  The washing machine displays error code E4 and refuses to spin. I have the warranty booklet open on the kitchen table. It requires proof of purchase date. I have the receipt, but the ink is fading, which feels like a personal affront from the universe.

  I pick up my blue ballpoint pen to fill out the claim form. The pen is cheap, plastic, the kind you get in a bank queue. It writes smoothly, which is surprising. Usually, things degrade. That is the rule.

  The rule is also the problem. I read a paper last week about statistical mechanics in de Sitter space. It was dry, mostly equations about horizon entropy, but the introduction summarized the old argument. You know the one. If you wait long enough in a heat-dead vacuum, particles will jiggle into random configurations. Sometimes they make a star. Sometimes they make a galaxy. Sometimes they make a person.

  The original proposal came from the Austrian with the beard. He suggested we live in an eternal equilibrium, just a local dip in entropy. His junior, the one who never gets credit, pointed out that if you're going to fluctuate into existence, you might as well fluctuate with memories already in place. Why bother with the Big Bang and the dinosaurs and the Industrial Revolution if a single brain with false memories of all that is exponentially more probable?

  Then the thirties came along and did the math on the exponentials. They showed that a single brain is so much cheaper, entropy-wise, than a whole universe that the probability ratio is effectively infinite. You should be a lone mind floating in the void, hallucinating this kitchen, this washing machine, this fading receipt.

  I cap the pen. The click is sharp.

  If I am a lone mind, then the receipt never existed. The washing machine never existed. The error code is a hallucination. But if I am a lone mind, the memory of buying the machine is also a hallucination. There is no difference between a false memory of a purchase and a true memory of a purchase if the purchase never happened. And if the purchase did happen, but was part of a larger fluctuation that included the entire history of the universe up to this point, then the memory is true.

  From the inside, there is no test. The state of my brain is identical in both cases. The argument doesn't tell me I am fake. It tells me the category "fake" has no purchase here. It carries no usable information. It is like being told that the number on my tax form might be written in invisible ink that only appears if I don't look at it. I still have to file the form.

  I uncapped the pen and wrote today's date on the claim form. *October 14.*

  I look for the bank statement to corroborate the receipt. I find it in the drawer with the takeout menus and the expired coupons. The statement confirms the transaction. But the statement is paper. Paper is a configuration of cellulose. Cellulose is a configuration of carbon. Carbon is a configuration of particles. If the particles can fluctuate into a receipt, they can fluctuate into a bank statement too. In fact, fluctuating a statement is easier than fluctuating a whole banking system.

  I am irritated. Not by the existential dread—that passed years ago—but by the misattribution. Everyone calls it the brain problem now. They forget the Austrian was talking about universes. They forget the junior assistant who made it about observers. They forget that the reductio ad absurdum was meant to kill the eternal equilibrium model, not to become a parlor trick for undergraduates. It is sloppy scholarship. It is like calling gravity the "apple problem."

  The phone rings. It is the insurance company, following up on a different claim. I let it go to voicemail. They will leave a message. The message will be a sound wave vibrating the air. The air will dissipate. Entropy increases.

  I need to mail the form. I find an envelope. I fold the receipt and the statement. I slide them in. I lick the flap. It tastes like glue and dust.

  If I am a fluctuation, this taste is a signal generated within the fluctuation. It is consistent. The consistency is what traps me. If the universe were inconsistent—if the washing machine turned into a pigeon, if the pen wrote in blood—I would know I was in a unstable fluctuation. But everything is boringly consistent. The washing machine is broken in a standard way. The warranty terms are standard. The bureaucracy is standard.

  A stable fluctuation large enough to include a warranty department is indistinguishable from a real universe. So I act as if it is real. I have to. There is no other protocol.

  I write the address on the envelope with the blue pen. The ink flows. I think about the assistant, the one who refined the argument. He probably worried about this. Not the void, but the paperwork. If nothing matters because everything is a fluctuation, then why did he bother publishing? Why did the Austrian bother with the beard? They acted as if their work persisted. They acted as if cause led to effect.

  I seal the envelope.

  There is a staple on the table. I must have used it to bind the pages earlier. I don't remember using it. Memory is unreliable. I pick up the staple. It is silver, bent slightly. I straighten it with my fingernail. It prickles my skin. Pain is a signal. Pain is high-fidelity data. Even a fluctuation brain would need to simulate pain accurately to maintain the coherence of the narrative. A brain that doesn't feel the staple prick would know it was dreaming.

  So I feel the prick. I am coherent.

  I put the envelope in my bag. I will walk to the post box on the corner. It is a Tuesday. The post box is emptied on Tuesdays and Fridays. If I miss the collection, the form waits. If I am a fluctuation, the waiting is part of the script.

  I put the blue pen in my shirt pocket. It clicks against the button.

  At the door, I pause. The washing machine hums quietly, despite the error code. It is trying to drain. It is trying to resolve the error. It is trying to return to equilibrium. I am trying to resolve the claim. We are both trapped in the same cycle of processing inputs and producing outputs until we break.

  I step outside. The air is cool. It is autumn. The leaves are turning brown. This is a high-entropy process. Decay is everywhere. The sidewalk is cracked. A dog barks three houses down.

  If I am a fluctuation, this walk is unnecessary. I could imagine the form mailed. But I am walking. The muscles burn. The lungs expand. The energy expenditure is real within the context of the experience. To stop walking would be to break the consistency. And consistency is the only currency I have.

  I reach the post box. It is red, chipped paint. I drop the envelope in. It clatters down the chute. Sound confirms presence.

  I turn back toward the house. I need to buy a new washing machine. I should check the reviews. I should compare energy ratings. I should look for a warranty that doesn't require fading receipts.

  I reach into my pocket for the blue pen to write a note on my hand: *Check Energy Rating.* The pocket is empty.

  I pat the other pocket. Nothing. I check the bag. Nothing. I must have left it on the kitchen table. Or I never had it. Or the pen fluctuated out of existence the moment I stopped looking at it. Small fluctuations are more common than large ones. A missing pen is a small fluctuation. A missing universe is a large one.

  I walk back inside. The pen is on the table, next to the staple. I must have put it there without noticing. Or it returned.

  I pick up the pen. It is warm.

  I write *Check Energy Rating* on my hand. The ink is blue. It will wash off eventually. Nothing stays. The Austrian knew that. The assistant knew that. The thirties crowd knew that. They all wrote things down anyway.

  I put the pen back in my pocket. I open the fridge. There is half a sandwich wrapped in foil. I eat it. It tastes like turkey and stale bread. I chew. I swallow. I am here.

  The washing machine beeps. The cycle has ended. It is still broken. I will have to call the repairman. I will have to explain the error code. I will have to schedule a time. I will have to be home.

  I sit at the table. I fill out the repair request form. I use the blue pen. I sign my name. It looks like my signature. It matches the one on the warranty. It matches the one on the bank statement. It matches the one in my memory.

  That will have to be enough.
