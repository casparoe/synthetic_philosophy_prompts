      *   Concedes small points? Yes (timescales are auxiliaries).
      *   Never concedes main point? Yes (right-but-early is immunization).
      *   One paragraph? Yes.

  8.  **Final Tweak:** Ensure the tone is conversational but firm. The draft looks good. I will use it.cw
