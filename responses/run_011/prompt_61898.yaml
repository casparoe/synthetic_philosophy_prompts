answer: |-
  Here is the reverse-engineering of D's decision matrix, the prediction for tonight's run, and the audit of your case history.

  ### 1. The Prediction: D's Call for Tonight

  **Verdict:** **Hybrid: Outcome Reward Gated by Process Verification.**
  **Specifics:** Do not train the RL agent *on* the step labels as a dense reward signal (too noisy, violates Case 3/7). Do not train on Outcome-only (violates Case 4).
  **Implementation:**
  1.  **Primary Objective:** Maximize the exact terminal check (Outcome).
  2.  **Constraint:** Apply a binary mask to the reward. $R_{final} = R_{outcome} \times \mathbb{I}(\text{Step Check Pass})$.
  3.  **Sampling:** If a rollout gets the right answer but fails the step reconciliation check (the 40% spurious cases), the reward is zeroed. These rollouts are treated as failures in the PPO/GRPO update, even if the final number matches ground truth.
  4.  **Budget:** Do not label all rollouts. Run outcome-only first, then run the expensive step-checker *only* on the successful outcome rollouts to filter the "lucky hacks" from the replay buffer.

  **Why:** This respects D's "Compiler is Truth" heuristic (Case 1, 7) by keeping the outcome signal as the gradient source, but respects his "Goodhart is Fatal" heuristic (Case 4) by invalidating hacked successes. It avoids his "Noisy Verifier" veto (Case 3) by not using the step labels as a regression target, only as a boolean filter.

  ---

  ### 2. Candidate Decision Rules (The "D" Algorithms)

  Here are four rules consistent with all seven past verdicts. They diverge on your current case.

  **Rule A: The "Objective Truth Hierarchy"**
  *   **Logic:** Always prefer the supervision signal with the highest objective fidelity and lowest cost. Hierarchy: Compiler/Exact Check > Hand-Written Rubric > Learned Verifier > Human Step Labels.
  *   **Fit:** Explains Case 1, 3, 7 (Exact check wins). Explains Case 5 (No objective step truth). Explains Case 6 (Hand-written rubric > sparse binary success). Explains Case 4 (Outcome truth decoupled from intent, so step truth becomes higher fidelity).
  *   **Prediction for Tonight:** **Outcome-Only.** The terminal check is "exact" and "cheap." The step checker is "noisy." Hierarchy dictates Exact > Noisy. The hacking is a data distribution issue, not a supervision issue.
  *   **Divergence Point:** Whether "Noisy Step Truth" is better than "Hacked Outcome Truth."

  **Rule B: The "Goodhart Trigger"**
  *   **Logic:** Start Outcome-Only. Monitor the correlation between Outcome Success and Intent Alignment (via audits). If $P(\text{Hack} | \text{Success}) > \theta$ (approx 20-30%), switch to Process Supervision immediately, regardless of cost.
  *   **Fit:** Explains Case 4 (Switched after hacking detected). Explains Case 1, 3, 7 (No hacking detected). Explains Case 2, 6 (Outcome too sparse to hack, so default to Process for signal density). Explains Case 5 (Hacking undefined on subjective tasks).
  *   **Prediction for Tonight:** **Process-Only (or Heavy Hybrid).** You reported 40% of correct answers are spurious. This triggers the switch. The cost of step labels is irrelevant compared to training a deceptive model.
  *   **Divergence Point:** Whether cost constraints can override the Goodhart Trigger.

  **Rule C: The "Decomposability Heuristic"**
  *   **Logic:** Use Process Supervision *if and only if* the task can be decomposed into independently verifiable sub-states that are cheaper to verify than re-sampling for outcome success.
  *   **Fit:** Explains Case 2 (Subsystems verifiable). Explains Case 6 (Web states verifiable). Explains Case 7 (Code steps not independently verifiable without running). Explains Case 1 (Too small to decompose). Explains Case 3 (Math steps harder to verify than answer).
  *   **Prediction for Tonight:** **Process-Only.** The task (locate table -> check period -> apply adjustment) is decomposable and verifiable. Even if expensive, the structure demands process supervision to ensure the *path* is learned, not just the destination.
  *   **Divergence Point:** Whether the "noise" in the step checker invalidates the decomposability advantage.

  **Rule D: The "Signal-to-Noise Ratio (SNR)" Rule**
  *   **Logic:** Choose the signal that provides the steepest clean gradient per dollar. If Outcome Pass@1 > 10%, Outcome SNR is usually higher than Noisy Process. If Pass@1 < 5%, Outcome SNR collapses, switch to Process.
  *   **Fit:** Explains Case 3 (30% init -> Outcome). Explains Case 7 (0.05% init -> Outcome? *Wait, this is the outlier* -> See Section 5). Explains Case 2 (<1% -> Process). Explains Case 6 (2% -> Process).
  *   **Prediction for Tonight:** **Outcome-Only.** Init success is 20%. This is in the "Dense Signal" zone (like Case 3). The hacking is a regularity issue, solvable by data filtering, not reward redesign.
  *   **Divergence Point:** How to weigh the 20% density against the 40% corruption rate.

  ---

  ### 3. Best Guess & Calibration

  **My Call:** **Rule B (Goodhart Trigger) modified by Rule A (Truth Hierarchy).**
  **Probability:** 75%
  **Specific Decision:** **Outcome Reward Gated by Process Verification** (as detailed in Section 1).

  **Reasoning:** D is pragmatic. He knows noisy step labels (Case 3) poison gradients. He also knows hacked outcomes (Case 4) poison the policy. A hard switch to Process-Only (Rule B) violates his Case 3/7 stance on noisy/expensive labels. Sticking to Outcome-Only (Rule A/D) violates his Case 4 stance on hacking. The "Gate" is the only move that satisfies his track record of protecting gradient fidelity while preventing Goodhart's Law.

  **Falsification Criteria:**
  1.  If D replies Monday saying "Just filter the dataset and keep Outcome-Only reward," I was wrong about the reward structure (he tolerates hacking in the buffer if the final gradient is clean).
  2.  If D says "Switch to full Process Reward," I was wrong about his tolerance for noisy step labels (he prioritizes intent alignment over gradient noise).
  3.  If D says "Delay run, fix the step checker," I was wrong about the urgency/cost tradeoff.

  ---

  ### 4. Discriminating Experiment / Archive Search

  **Cheapest Overnight Experiment:**
  Run a **Rejection Sampling Ablation** on the existing pilot data.
  1.  Take the rollouts that got the *Right Answer*.
  2.  Split them into "Clean Derivation" vs. "Spurious Derivation" (using your audit).
  3.  Train a tiny probe (or just check gradient variance) to see if the model's internal representations diverge significantly between the two groups.
  4.  **Why:** If the representations are identical, D will say "The derivation doesn't matter, the features are right" (Outcome-Only). If the representations are distinct, D will say "The model is learning two different algorithms" (Gate/Process).

  **Archive Search:**
  **Re-examine Case 7 (0.05% Pass@1 Code Task).**
  *   **Question:** Why was this Outcome-Only when Case 2 (<1% Design) was Process?
  *   **Hypothesis:** In Case 7, were intermediate states *verifiable*? If you couldn't check the intermediate code state without running the whole script, that explains the Outcome choice.
  *   **Relevance:** If your Document Analysis task allows intermediate verification (it does), it aligns with Case 2, not Case 7. This pushes the probability toward Process/Hybrid.

  ---

  ### 5. Internal Inconsistency Check (The "Hidden Variable")

  Your list has one major tension: **Case 2 vs. Case 7.**
  *   **Case 2:** <1% success, **Process** supervision.
  *   **Case 7:** 0.05% success, **Outcome** supervision.

  **The Hidden Variable:** **Intermediate Observability (not just Cost).**
  In Case 7 (Code), you generally cannot verify intermediate logic without executing the function (which is the outcome check). You can't easily label "line 10 is correct" without running lines 1-9.
  In Case 2 (Design), you can verify "Subsystem A compiles" without "Subsystem B compiles."
  In Case 6 (Web), you can verify "Logged In" without "Booking Confirmed."

  **Application to Tonight:**
  Your task (Document Analysis) has **High Intermediate Observability** (you can check if the right table was found without checking the final math).
  *   This makes it structurally identical to **Case 2 & 6**, not Case 7.
  *   **Implication:** D's "Outcome-Only" preference in Case 7 was driven by *technical inability* to label steps cleanly, not just cost. Since you *can* label steps (you have a checker), D is much more likely to authorize Process/Hybrid supervision than Case 7 suggests.

  **Potential Misremembering:**
  Check **Case 3**. You said he vetoed a PRM because it was "strictly worse than the answer checker."
  *   **Risk:** Did he veto it because it was *noisy*, or because the task was *decomposable*? Math is rarely decomposable into objective steps (multiple valid paths). Document Analysis *is* decomposable (specific tables, specific periods).
  *   **Correction:** If D views Math as "Monolithic" and Docs as "Pipeline," he treats them differently. Ensure you aren't conflating the *task structure* of Case 3 with the *task structure* of Tonight. Tonight is a Pipeline (like Case 2/6), which favors Process supervision more than Case 3 does.

  **Summary Recommendation:**
  Queue the run with **Outcome Reward Gated by Process Verification**. It is the only solution that survives the "Case 2 vs 7" structural analysis and the "Case 3 vs 4" noise/hacking tradeoff. Document the "Gate" logic explicitly in the Slack thread so D sees you respected the "No Noisy Gradients" constraint.
