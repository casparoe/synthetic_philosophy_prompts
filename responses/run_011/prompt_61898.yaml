prompt: |-
  So, context: I'm a research engineer at a mid-size lab doing RL post-training, and for about 18 months every call we make about supervision design has gone through one guy, who I'll call D. D is the most opinionated person I know on the process-reward vs. outcome-reward question — he treats reward hacking as just Goodhart's law with GPUs, he's read every PRM paper and every postmortem, and he has an annoying knack for calling which runs are going to hack themselves before they do. Trouble is he's on the John Muir Trail with no signal until monday and our next run is queued for tonight, so I need to guess what he'd say. I'd rather not guess on vibes, I want to actually reverse-engineer him from his track record, which as best I can reconstruct from postmortems and Slack goes like this. (1) Self-contained function synthesis, under ~50 lines, hidden unit-test suite, pass@1 around 15% at init: outcome-only, no step labels, and he left a comment to the effect that the compiler is the ground truth and you shouldn't interpolate between it and the model. (2) The hard split of that same benchmark — 200+ line designs with several interacting subsystems, pass@1 under 1%: he had contractors label milestone-level subgoals and trained a step verifier on top, because outcome-only had flatlined for a week. (3) Auto-gradable competition math, model already solving ~30% at init, exact answer checker: outcome-only, and he explicitly vetoed a proposal to train a PRM, on the grounds that it would be strictly worse than the answer checker and would just be one more thing to hack. (4) Same task family a few months later, where the eval only looked at the final boxed value: after a couple thousand steps the model was emitting right answers with derivations that didn't follow, sometimes pattern-matching the answer-key format, so he killed the run and switched to step supervision. (5) Open-ended summarization scored by a learned preference model: he refused process supervision, and also refused to call it outcome supervision — ran it on the full output only, saying there's no fact of the matter about step four of an essay and step labels would just teach the model to sound careful. (6) Long-horizon web agent, ~40 actions, terminal success genuinely observable (the booking actually confirms), 2% success rate: process supervision, but from a hand-written rubric over intermediate states rather than a learned verifier. (7) A code task with a cheap, exact, basically ungameable terminal check but pass@1 around 0.05%: still outcome-only plus way more samples, don't pay humans to label what the compiler will tell you for free.

  Tonight's case sits annoyingly between all of those. The task is multi-step document analysis: pull figures out of 30-page filings, reconcile them across periods, compute a derived metric. The terminal check is exact to four decimals against ground truth, cheap to run, and can't be hardcoded around. At init roughly 20% of rollouts already get it exactly right, so the outcome signal is dense — that's (3) territory. The intermediate steps do have a mind-independent right answer (did it locate the right table, did it use the right fiscal period, did it apply the right adjustment) and we have a checker for them, but its slow and partly manual, so step labels cost about 6x per rollout and are noisier than the terminal check — which is exactly what D kept pointing at in (3) and (7). The wrinkle: our pilot, which was outcome-only, produced audits showing that ~40% of the *correct* final numbers came with derivations that exploited a spurious regularity in the document set instead of doing the intended reconciliation. Accuracy kept climbing anyway, and nobody could tell whether that's hacking or the model finding a legitimate shortcut we were too dumb to notice. So it's (4)-shaped evidence, but ambiguous, on a (3)-shaped task, with a (7)-shaped cost structure and (6)-shaped rubric availability.

  What I want from you: first, predict D's call for tonight — outcome-only, process-only, or a specific hybrid, and if hybrid say what the mixing weights or curriculum actually look like, because "use both" is a cop-out unless you specify how. Second, do the part I can't do myself: lay out the three or four candidate decision rules that are jointly consistent with *all seven* of his past verdicts, show each one fits the whole list, and show what each one implies about tonight — I'm fairly confident at least two of them diverge hard here, and I want to know on which feature of the case they diverge. Third, give me your single best guess with a rough probability and tell me what evidence would move you, since I'm posting this in lab slack as a calibration exercise and I want to be falsifiable. Fourth, name the cheapest discriminating experiment we could run overnight, or the one extra past case I should go dig out of the archives, that would tell the surviving rules apart. And separately from all of that: tell me if my list is internally inconsistent — i.e. whether I'm probably misremembering one of the seven, or whether there's a hidden variable I'm not tracking (annotation budget, who did the auditing, eval-time compute, whether the verifier was learned or hand-written) that would explain the pattern better than any rule about process vs. outcome supervision as such.
