answer: |-
  This is a sharp thesis with a clear vulnerability profile. You are trying to solve a metaphysical problem with a temporal heuristic, in a room that contains both metaphysical purists and practical modelers. That is a dangerous intersection.

  Here is your Q&A prep sheet. The objections are ordered by potential damage to the thesis, from "fatal" to "nuisance." The phrasing mimics the specific disciplinary dialects in your room.

  ### Q&A Prep Sheet

  #### 1. The Metaphysical Switch (The "Why Here?" Objection)
  **Who:** Senior Normative Ethicist (Parfitian leanings)
  **Phrasing:** "You're treating the Nonidentity Problem as if it has a timer. But Parfit's point is metaphysical, not temporal. If a policy changes the social conditions of conception, it changes *who* exists. That logic applies to policy implemented tomorrow just as much as policy implemented in 2100. If you concede the Nonidentity logic holds for the deep future, on what grounds do you claim the *moral structure* of the harm changes at the sixty-year mark? You haven't solved the problem; you've just moved the goalposts."
  **90-Second Reply:** "I'm not claiming the metaphysics of identity changes; I'm claiming the *overlap* of populations does. For the first sixty years, the vast majority of token humans exist in both the mitigation and non-mitigation branches. For *them*, it is a same-people comparison. The Nonidentity Problem only becomes dominant once the overlap approaches zero. I'm arguing we shouldn't let the tail (the deep future where identity diverges) wag the dog (the near term where harm is specifiable)."
  **Soft Spot:** You are conflating "majority overlap" with "moral relevance." If NIP shows person-affecting views are incoherent, they are incoherent even for the overlapping majority.
  **Concession:** "I concede the metaphysical sensitivity of identity is constant. My claim is purely about the *normative weight* of the overlapping population versus the non-overlapping one in a policy context."

  #### 2. The Butterfly Effect (The Empirical Challenge)
  **Who:** Normative Ethicist (Empirically informed)
  **Phrasing:** "Sixty years is an eternity for conception timing. Economic shifts from climate policy change migration, marriage markets, and work hours immediately. We know from demographic modeling that identity turnover happens on the scale of decades, not centuries. By year thirty, you're already mostly dealing with non-identical people. Your 'same-people' window is empirically empty."
  **90-Second Reply:** "I'm not claiming *everyone* is the same. I'm claiming a *sufficient share* are. Even if identity shifts rapidly, the people currently alive (who will be for the next 40-50 years) are fixed. Climate policy harms *them* directly via health, property, and stability. We don't need to wait for their grandchildren to find a victim. The harm to existing people carries the normative load."
  **Soft Spot:** You are shifting from "people who exist in both branches" to "people currently alive." These are different groups. Future people currently alive in Branch A might not exist in Branch B.
  **Concession:** "You're right that sixty years is likely too generous. I'd defend a shorter horizon, perhaps thirty, but the structural point remains: there is a near-term window of specifiable harm."

  #### 3. The Modeler's Break (The Economist's Objection)
  **Who:** IAM Economist
  **Phrasing:** "From a modeling perspective, you're introducing a discontinuity in the damage function. If I run the IAM, I can't switch from a person-affecting discount rate to an impersonal one at *t=60*. That creates arbitrage opportunities and double-counting risks. How do you parameterize the 'moral switch' without breaking the cost-benefit analysis?"
  **90-Second Reply:** "Don't parameterize a moral switch; parameterize the *certainty of harm*. Near-term damages are high-confidence harms to identifiable agents. Deep-future damages are low-confidence impacts on contingent agents. You can model this as a risk premium or a declining discount rate that reflects epistemic uncertainty about identity, rather than a hard moral cutoff."
  **Soft Spot:** Economists hate "epistemic uncertainty" masquerading as normative structure. They want a discount rate, not a moral heuristic.
  **Concession:** "I agree a hard cutoff is unmodelable. Think of it as a sliding scale of evidentiary burden for harm, not a binary switch in the objective function."

  #### 4. The Aggregation Sin (The Kantian's Objection)
  **Who:** The Kantian
  **Phrasing:** "Your Step 2 relies on aggregating harms across the 'same-people' subgroup to justify the policy. But if the policy fails, you aren't just harming them; you are treating humanity as a means to an end. Furthermore, if you admit the deep future is a Nonidentity case, you are admitting we have no duty *to them* specifically. Why is aggregation permissible for the near future but not the deep future?"
  **90-Second Reply:** "I'm not relying on aggregation to create the duty; I'm relying on the specific duty not to harm identifiable persons. The near-term victims are specific rights-holders. The deep future issue is distinct. I'm arguing we don't need to solve the deep future aggregation problem to justify near-term mitigation, because the near-term case stands on its own."
  **Soft Spot:** If the Kantian believes duties are universalizable, splitting the timeline looks like special pleading.
  **Concession:** "I concede this doesn't solve the duty to the deep future. It only secures the duty to the present and near-future generations."

  #### 5. The Long-Tail Neglect (Policy Sufficiency)
  **Who:** Policy Ethicist
  **Phrasing:** "Climate change is a long-term problem. If your view only justifies mitigation for the next sixty years, does it justify the kind of decarbonization needed to stabilize the climate in 2150? It sounds like you're validating short-termism."
  **90-Second Reply:** "No. The infrastructure and emissions locks we put in place *now* determine the 2150 outcome. Justifying near-term mitigation is sufficient to drive long-term stability. We don't need a separate moral principle for 2150 if the actions required are taken in 2030."
  **Soft Spot:** Adaptation vs. Mitigation. Some costs are borne purely by the deep future (e.g., sea level rise).
  **Concession:** "It may not justify *all* optimal mitigation, but it justifies the urgent near-term action which is the current political bottleneck."

  #### 6. The Internal Tension (Your Known Weakness)
  **Who:** Sharp Grad Student / Advisor
  **Phrasing:** "You mentioned Step 2 and Step 4. If counterfactual comparison is doing the normative work in the near term, why does it stop working in the deep future? Is harm not specifiable then, or is it just that the people are different? If it's the latter, you've admitted the Nonidentity Problem *is* the structural issue, you've just bracketed it."
  **90-Second Reply:** "It's not that the comparison stops working; it's that the *subjects* of the comparison vanish. In the near term, I can say 'Alice is worse off.' In the deep future, I can only say 'Alice exists instead of Betty.' The normative force fades not because harm is vague, but because the subject of the harm is contingent on the act."
  **Soft Spot:** This is exactly the tension you flagged. It sounds like you are defining away the problem.
  **Concession:** "I admit the transition is messy. The normative force doesn't vanish instantly; it dilutes as the overlap decreases."

  #### 7. The Migration/Identity Link
  **Who:** Demographer / Ethicist
  **Phrasing:** "Climate policy drives migration. Migration changes conception timing and partners immediately. You can't separate 'climate policy' from 'identity shifting' even in year one."
  **90-Second Reply:** "True, but migration affects a subset. The core claim is that a *large share* remains stable. We don't need 100% overlap, just enough to ground a harm-based verdict that outweighs the indeterminacy of the rest."
  **Soft Spot:** How large is "large enough"?
  **Concession:** "I don't have a precise percentage, but demographic inertia suggests the majority of current populations remain stable over short horizons."

  #### 8. The "Existence is Not a Harm" Trap
  **Who:** Population Ethics Specialist (Visiting?)
  **Phrasing:** "If you concede NIP applies in the deep future, you concede that bringing someone into a damaged world is not a harm *to them* compared to non-existence. If that's true, why does the near-term comparison matter? You've accepted the core intuition of NIP."
  **90-Second Reply:** "Because in the near term, we aren't comparing existence to non-existence. We are comparing *damaged existence* to *healthy existence* for the *same person*. NIP only bites when the alternative is non-existence."
  **Soft Spot:** Climate policy often changes *whether* people survive, not just how well they live.
  **Concession:** "In cases where policy affects survival rates, NIP does bite immediately. My argument applies primarily to welfare impacts on survivors."

  ***

  ### The Question You Are Praying Nobody Asks

  You guessed the **60-year cutoff**. You are wrong. The cutoff is an easy target, but it is defensible as a heuristic or a "parameter for discussion." If they attack the cutoff, you can just say, "Fine, make it 40 years," and your thesis survives.

  The question you should pray nobody asks is this:

  **"If the Nonidentity Problem is a metaphysical truth about causation and identity, why do you think it is sensitive to human time horizons?"**

  **Why this is the killer:**
  This objection (similar to Objection #1 but more fundamental) attacks the *category error* in your thesis.
  *   **The Logic:** Parfit's point is that identity is *always* sensitive to our acts. It is not a "future problem." It is a structural feature of causation.
  *   **The Trap:** By arguing that NIP only "bites" after 60 years, you are implying that metaphysics has a "practical shelf-life."
  *   **The Damage:** If they press this, they force you to admit that either:
      1.  NIP applies *now* (which destroys your Step 2).
      2.  Or you are arbitrarily ignoring the metaphysics for policy convenience (which makes your view pragmatic, not ethical, and the ethicists will eat you alive).

  **How to prepare:**
  Do not defend the 60 years as a *metaphysical* boundary. Defend it strictly as a **normative threshold of evidentiary certainty**.
  *   *Bad Defense:* "Identity doesn't shift for 60 years." (False).
  *   *Good Defense:* "For 60 years, the *probability* of identity overlap is high enough that we can act *as if* it is a same-people case without violating moral constraints. After that, the uncertainty is too high to ground person-affecting claims."

  Move the battlefield from **Metaphysics** (where you will lose) to **Epistemology/Policy** (where you can win). If they ask the "Metaphysical Switch" question, pivot immediately to: *"I am not making a metaphysical claim about when identity shifts. I am making a policy claim about when the overlap is sufficient to ground legal and moral liability."*
