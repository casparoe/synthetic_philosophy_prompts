answer: |-
  ### What the procedure assumes

  This procedure assumes you have access to clean historical claims data and exposure counts for proposed classes. It assumes UK regulatory constraints (Equality Act 2010, FCA Consumer Duty, GDPR) are binding hard limits, not optimisation targets. It presumes the goal is predictive accuracy balanced against fairness and stability, not just statistical significance. It requires that the actuary signing off trusts the process, not just the output. Finally, it assumes you can define the factor before a policy is sold; no look-ahead bias is permitted. Ambiguity defaults to rejection. Use it wisely.

  ### The procedure

  Run these steps sequentially. If any step triggers a 'Kill', stop and reject the proposal.

  1.  **Legality Check:** Is the factor prohibited by UK law or regulation?
      *   *Sufficient Answer:* No explicit prohibition found.
      *   *Kill:* Factor uses gender, credit score for home insurance, or other banned variables.
  2.  **Temporal Validity:** Can you assign this class at quote time without knowing the claim outcome?
      *   *Sufficient Answer:* Yes, data exists at policy inception.
      *   *Kill:* Factor relies on post-inception data (e.g., claims history updated mid-term).
  3.  **Reference Class Credibility:** Does the specific class have enough claims?
      *   *Sufficient Answer:* ≥30 claims for stable perils; ≥50 for volatile perils (flood).
      *   *Kill:* Fewer than minimum claims *and* no credible Bayesian shrinkage plan.
  4.  **Homogeneity:** Does splitting this class create distinct risk groups?
      *   *Sufficient Answer:* Lift ratio >1.2 compared to base pool, with consistent directionality.
      *   *Kill:* Lift is statistically insignificant or reverses sign in different time periods.
  5.  **Proxy Risk:** Does the factor correlate highly with protected characteristics?
      *   *Sufficient Answer:* Correlation coefficient <0.4 with ethnicity, health, or disability proxies.
      *   *Kill:* High correlation suggests disparate impact despite technical legality.
  6.  **Selection Bias:** Was the pool created by previous pricing decisions?
      *   *Sufficient Answer:* No, the pool represents organic exposure.
      *   *Kill:* Pool consists only of customers who accepted a previous price hike (survivorship bias).

  ### Judgement calls

  The procedure flags risks, but you decide the tolerance. Step 3's sample size threshold is arbitrary; thirty claims might suffice for stable perils like fire, but not flood. Step 5's proxy correlation requires you to judge 'closeness' to ethnicity or health without perfect data; you are choosing how much disparate impact is acceptable. Step 6 involves judging whether selection bias is fatal or correctable; you decide if the business value outweighs the statistical impurity. Ultimately, you are balancing commercial pressure against technical integrity. The procedure doesn't calculate risk appetite; it exposes where you are exercising it. If you approve a factor flagged in Step 5, you are making an ethical choice, not a statistical one. Document that choice explicitly for the actuary. You own that call.

  ### Worked examples

  **1. Heat Pump Factor**
  *Proposal:* Apply discount for heat pumps. Data: 11 claims on heat pumps, 900 claims if lumped with all low-carbon heating.
  *Run:* Step 3 fails on specific class (11 < 30). Step 4 fails on lumped class (Air source vs. Ground source risks differ; homogeneity violated).
  *Verdict:* **Reject.** Insufficient credibility without violating homogeneity.

  **2. Postcode Factor**
  *Proposal:* New postcode sector split. Data: High predictive lift.
  *Run:* Step 4 passes (High lift). Step 5 fails (Postcode sectors correlate >0.6 with ethnicity indices in this region).
  *Verdict:* **Reject.** Proxy risk outweighs predictive gain under Consumer Duty.

  **3. Telematics Factor**
  *Proposal:* Discount for 'safe' driving behaviour. Data: Strong loss ratio.
  *Run:* Step 3 passes. Step 6 fails (Pool comprises only drivers who retained policy after last price increase; low-risk drivers left).
  *Verdict:* **Reject.** Selection bias renders the loss ratio unreliable for future pricing.

  ### What this can't do

  This procedure cannot guarantee future profitability or prevent black swan events. It does not replace the appointed actuary's legal liability; you are still recommending, they are signing. It cannot resolve ethical dilemmas where regulations are silent; if a factor is legal but feels unfair, the procedure flags it but doesn't decide. It won't fix bad data quality or systemic modelling errors. Finally, it cannot protect you from commercial pressure; if leadership demands a factor despite a 'Kill' result, this document only serves as evidence you warned them. It is a filter, not a shield. Use it wisely.
