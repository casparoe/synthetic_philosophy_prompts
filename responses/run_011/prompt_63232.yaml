answer: |-
  Sir, I grant you freely that a chest of guineas locked in the Tower is of no use to the Commonwealth, nor do I contend that gold and silver are the sole measure of a nation's wealth. Our true stock lies indeed in our ships, our seamen, and the industry of our manufactures, as much as in any metal. Yet I must protest that Mr. Hume's supposition of a night's annihilation is a philosopher's dream, not a merchant's reality. Prices and wages do not fall with the promptness of his arithmetic; rents are leased by the year, and debts are struck by the bond. If the coin were to vanish as he describes, the merchant could not pay the weaver, and the loom would stand still long before the price of cloth fell sufficiently to tempt the Frenchman or the Dutchman. The distress would be immediate, while the remedy you promise is slow and uncertain.

  You ask what is secured by a favourable Balance? I answer: the employment of the poor and the credit of the Crown in times of exigency. Mr. Hume himself half-concedes that a plenty of money serves the publick in its wars and negotiations, yet he treats this as a secondary matter. But treasure is the sinews of war, and credit depends upon visible substance. If we permit the Balance to run against us, relying on his automatic return, we risk the loss of the very manufactures that give our poor bread. Moreover, since the custom-house books on which we reckon are notoriously imperfect, we cannot know when the danger is past nor when the flow has turned. We must steer by a cautious compass rather than a philosopher's map. We seek not to hoard the oil, Sir, but to ensure the wheels do not grind to a halt before the supply is replenished, for a nation cannot wage war with theory nor feed its poor on speculation.
