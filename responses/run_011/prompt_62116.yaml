      *   *Practice's Stance:* The practice is *operationally indifferent* but rhetorically leans intentionalist ("breaking through denial"). However, the unfalsifiable structure (protest = confirmation) functions more like a motivational/structural account where the *mechanism* of defense is automatic, not necessarily a conscious plot.
      *   *Underdetermination:* The unfalsifiability doesn't decide between them. Both allow for "resistance." However, the therapeutic response (confrontation vs. exploration) might differ. The practice described (confrontation/challenge) assumes the truth is accessible *externally* even if blocked internally.
      *   *Key Insight:* The unfalsifiability suggests the construct functions as a *status assignment* rather than a psychological hypothesis. It treats denial as a behavioral disposition, not necessarily a specific mental state architecture.

  5.  **Address Question 3: What is Ruled Out:**
      *   *Incorrigibility:* The view that a competent subject cannot be mistaken about their condition is strictly ruled out.
      *   *Deflationism:* The view that self-deception is just biased belief formation *might* survive if the bias is deemed pathological enough to warrant external override, but the *strong* deflationary view (no contradictory state exists) clashes with the "symptom" label.
      *   *What must be given up:* If one held the incorrigibility view, one must give up conditional admission (cannot force acceptance of diagnosis), group confrontation (cannot challenge self-report), and the symptomatization of disagreement. The program relies on the *override* of first-person authority.

  6.  **Address Question 4: Reconciliation (Addiction vs. Pain):**
      *   *Principled Reconciliation:* Yes, based on the *ontology of the object*. Pain is an occurrent sensation (phenomenology); Addiction is a pattern of behavior/consequence (functional/normative).
