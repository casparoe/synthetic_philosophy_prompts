  3.  **Address Question 1: Theory of Self-Knowledge:**
      *   *Requirement:* The practice *requires* that first-person avowals about status/condition are unreliable evidence. It does *not* strictly require a partitioned mind (Freudian unconscious vs. conscious), though that fits comfortably.
      *   *Strict Commitment:* The commitment is to the *normative unreliability* of the subject regarding specific classes of propositions (those concerning loss of control/addiction).
      *   *Underdetermination:* The practice works whether the mind is partitioned (you know but hide it) or merely biased (you genuinely believe but shouldn't). The key is the *authority shift*: the clinician/community holds the epistemic authority, not the subject.
      *   *Fluent Admission:* The suspicion of early agreement suggests the practice values *authenticity* or *experiential grounding* over mere propositional assent. This implies a theory where self-knowledge is achieved through process, not introspection.

  4.  **Address Question 2: Intentionalist vs. Motivational Self-Deception:**
      *   *Intentionalist:* Subject knows truth, hides it from self. (Requires partition).
