      *   *Admission:* Conditional on accepting diagnosis (motivation as precondition).
      *   *Progress:* Measured by self-ascription ("I am an addict"). Early fluent admission = suspect (compliance); Late struggle = genuine.
      *   *Contradiction:* Protest = Resistance; Agreement = Compliance; Silence/Minimization = Denial. (Unfalsifiable structure).
