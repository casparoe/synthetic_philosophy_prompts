  8.  **Refining the Arguments:**
      *   *Q1:* Focus on "Avowal vs. Assertion." Pain is avowal (expressive), Addiction diagnosis is assertion (truth-apt). The practice treats addiction self-report as assertion subject to verification.
      *   *Q2:* The "unfalsifiable" nature points to a *performative* function of the construct rather than a descriptive one. It doesn't matter *why* the patient denies, only that they do.
      *   *Q3:* Be precise. Incorrigibility must go. Deflationism can stay *if* it allows for pathological bias correction.
      *   *Q4:* The reconciliation lies in the distinction between *phenomenal states* (pain) and *normative/functional states* (addiction). You feel pain; you *are* an addict (based on criteria).

  9.  **Final Review against Constraints:**
