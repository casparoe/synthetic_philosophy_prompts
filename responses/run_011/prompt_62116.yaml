      *   *Cost of Error:* In pain, under-treatment is the risk. In addiction, enabling is the risk.
      *   *Substantive Claim:* A substantive claim about self-knowledge is unavoidable: specifically, that self-knowledge is domain-specific. We are authoritative on sensations, less so on complex behavioral patterns involving future predictions (control) and social consequences.
      *   *Non-Philosophical factors:* Temporal structure (occurrent vs. standing) does work, but doesn't fully explain the *override* of authority. The ethical stance (paternalism vs. validation) is key.

