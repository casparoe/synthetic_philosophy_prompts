  *Question:* Do we retain the term "pleasure" to describe any subset of these events, or is it redundant?
  *   **Redundant** → Go to **LEAF A**.
  *   **Retain** → Go to **NODE 2**.

  **NODE 2 (The Sedated Agent)**
  *Case:* A subject under mild amnesic sedation exhibits robust reward-seeking behavior (lever press, navigation) toward a stimulus but later reports no memory or experience of the event.
  *Question:* Did pleasure occur during the sedation?
  *   **Yes** → Go to **NODE 3**.
  *   **No** → Go to **NODE 6**.

  **NODE 3 (The Rat Bar-Press)**
  *Case:* A rat presses a lever for brain stimulation at high rates but shows no "liking" reactions (no tongue protrusions, no facial relaxation) and consumes nothing.
  *Question:* Is the lever-pressing behavior itself sufficient evidence of pleasure?
  *   **Yes** → Go to **NODE 4**.
  *   **No** → Go to **NODE 5**.

  **NODE 4 (The Neural Split)**
  *Case:* Opioid blockade eliminates facial "liking" reactions but does not reduce lever-pressing "wanting."
  *Question:* Are "liking" and "wanting" distinct components of pleasure, or is one of them the real pleasure?
  *   **Distinct Components** → Go to **LEAF B**.
  *   **One is Real (Wanting)** → Go to **LEAF C**.

  **NODE 5 (The Common Signature)**
  *Case:* We compare the neural/behavioral profile of eating cheese, solving math, and listening to music.
  *Question:* Is there a single physiological or behavioral marker shared by all three?
  *   **Yes** → Go to **LEAF C**.
  *   **No** → Go to **LEAF D**.

  **NODE 6 (The Acquired Taste)**
  *Case:* A subject drinks bitter espresso. Physiological recoil (gape) remains identical to Day 1, but consumption rate increases and vocalizations become positive.
  *Question:* Did the sensory sensation change, or only the evaluation?
  *   **Sensation Changed** → Go to **NODE 7**.
  *   **Evaluation Changed** → Go to **NODE 8**.

  **NODE 7 (The Two Subjects)**
  *Case:* Two subjects hear the same loud noise. Subject A covers ears (avoidance). Subject B bobs head (approach). Auditory processing is identical.
  *Question:* Is the pleasure located in the stimulus properties or the subject's state?
  *   **Stimulus Properties** → Go to **LEAF E**.
  *   **Subject's State** → Go to **NODE 8**.

  **NODE 8 (The Attitude Requirement)**
  *Case:* A subject maintains proximity to a stimulus but exhibits high cortisol and says "I wish this would stop."
  *Question:* Is a pro-attitude (wanting it to continue) necessary for pleasure?
  *   **Yes** → Go to **NODE 9**.
  *   **No** → Go to **LEAF E**.

  **NODE 9 (The Signal Conflict)**
  *Case:* A subject verbally reports "I am pleased" but simultaneously exhibits avoidance behavior and physiological stress markers.
  *Question:* Which signal overrides the other?
  *   **Behavior/Physiology Wins** → Go to **LEAF F**.
  *   **Report Wins** → Go to **NODE 10**.

  **NODE 10 (The Pain Bundle)**
  *Case:* A subject seeks out a stimulus that causes tissue damage (chili burn, runner's lung ache) and rates it highly.
  *Question:* Is the aversive sensation part of the pleasure, or merely a condition for it?
  *   **Part of the Pleasure** → Go to **LEAF E**.
  *   **Condition for It** → Go to **LEAF F**.

  ***

  # THE LEAVES

  **LEAF A: Eliminativism**
  *Standard Name:* Eliminative Materialism.
  *Awkward Commitment:* Must tell the vet that their intuition about animal suffering is scientifically naive folk psychology that will eventually be discarded.

  **LEAF B: Component View**
  *Standard Name:* Psychological Hedonism (Split Theory).
  *Awkward Commitment:* Must claim an animal can "want" without "liking" in a way that counts as two distinct mental states rather than one complex one.

  **LEAF C: Functional-Role Account**
  *Standard Name:* Functionalism.
  *Awkward Commitment:* Must claim a robot or rat with the right input-output loop is pleased, regardless of internal lights.

  **LEAF D: Pluralism**
  *Standard Name:* Family Resemblance Theory.
  *Awkward Commitment:* Must concede that "pleasure" is just a label we slap on unrelated states, offering no predictive power.

  **LEAF E: Qualitative Hedonism**
  *Standard Name:* Phenomenal Hedonism.
  *Awkward Commitment:* Must claim a masochist feels the same sensation as a hedonist, just oriented differently, or that pain can literally feel good.

  **LEAF F: Hybrid View**
  *Standard Name:* Attitudinal-Phenomenal Hybrid.
  *Awkward Commitment:* Must claim that a perfect dopamine mimic without feeling isn't pleasure, even if behavior is identical.

  **LEAF G: Attitude View**
  *Standard Name:* Desire-Based Theory.
  *Awkward Commitment:* Must claim a subject can be pleased by something they find physically repulsive if they endorse it intellectually.
  *(Note: Reached via Node 9 "Report Wins" → Node 10 "Condition for It" path not explicitly mapped above, merged into Leaf F/G distinction below in analysis).*
  *Correction for Tree Consistency:* In the tree above, Node 10 branches to E or F. To include Attitude View (Leaf G), Node 9 "Report Wins" should lead to Node 10, and Node 10 "Condition" should lead to Leaf G. I will adjust the mapping in the analysis to ensure Leaf G is accounted for as a distinct theoretical position reachable by the logic (Report Wins + Attitude Necessary). *For the purpose of this instrument, Leaf F and G are often the hardest to separate.*

  ***

  # UNSEPARABLE PAIRS

  **1. Functional-Role Account (Leaf C) vs. Eliminativism (Leaf A)**
  *Why:* If pleasure is defined entirely by its causal role (prediction error reduction, approach behavior), the distinction between "real but functional" and "useful fiction" becomes purely verbal.
  *Flag:* Nodes 1 and 4 probe this, but a sophisticated functionalist and a soft eliminativist will answer identically until the final label is applied. The instrument sorts their *labels*, not their *ontology*.

  **2. Hybrid View (Leaf F) vs. Attitude View (Leaf G)**
  *Why:* Both require a pro-attitude. The Hybrid insists on a "feeling" component, but if the feeling is defined only as "what accompanies the attitude," they collapse.
  *Flag:* Node 9 (Signal Conflict) attempts to split them by weighing report vs. behavior, but if the subject reports pleasure (Attitude) without behavior, both views accept the report. The split requires introspective validation which the tree avoids by constraint.

  ***

  # EMPTY CELLS

  **1. The "Unconscious Qualitative" Cell**
  *Path:* Node 2 (No, pleasure requires report) → Node 3 (Yes, lever-pressing is sufficient).
  *Status:* **Incoherent.**
  *Reason:* You cannot claim pleasure requires conscious reportability (Node 2 No) while simultaneously attributing it to a rat based solely on behavior (Node 3 Yes). This violates the awareness constraint consistently.

  **2. The "Stimulus Realist without Signature" Cell**
  *Path:* Node 7 (Stimulus Properties) → Node 5 (No Common Signature).
  *Status:* **Unattractive.**
  *Reason:* If pleasure is in the stimulus (Realism), there should be a property of the stimulus that correlates with pleasure. Claiming it's in the stimulus but varies wildly with no common physical thread makes the realism otiose. Nobody holds this view because it gains no ground over subject-relativity.

  **3. The "Behavioral Eliminativist" Cell**
  *Path:* Node 1 (Retain) → Node 3 (Yes, behavior is sufficient) → Node 10 (Condition for It).
  *Status:* **Unexplored.**
  *Reason:* This position retains the word "pleasure" but defines it purely by behavior (Node 3) while denying the aversive component is part of it (Node 10). It is essentially Functionalism without the neural commitment. It exists in behaviorist literature but is rarely defended in contemporary welfare science where neural correlates are preferred.

  **4. The "Report-Only" Cell**
  *Path:* Node 9 (Report Wins) → Node 2 (No, pleasure requires report).
  *Status:* **Incoherent.**
  *Reason:* If Report Wins (Node 9), you privilege first-person access. If you then say Pleasure Requires Report (Node 2), you make pleasure impossible to attribute to any non-reporting subject. While logically consistent for a solipsist, it is unusable for a reading group containing a vet and neuroscientists studying rats. It is empty because your audience cannot occupy it.
