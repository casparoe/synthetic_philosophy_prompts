  **Comparison:**
  SNTV is effectively Limited Vote where the number of marks is reduced from two to one. This reduction simplifies the ballot (good) but reduces proportionality (bad).
  *   **Similarities:** Both are semi-proportional, candidate-centered systems in multi-member districts with simple ballots. Both rely on natural thresholds rather than legal ones.
  *   **Differences:** SNTV has larger districts (4 seats vs 3) but fewer marks (1 vs 2). This increases the likelihood of "bullet voting" and allows the largest party to sweep seats more easily, driving the Mismatch from 5.5 up to 9.8.

  **Does the Analog Work?**
  Yes. It establishes the "Semi-Proportional Ceiling." Bill 6 represents the maximum disproportionality the group is willing to tolerate in exchange for local representation and low wasted votes. SNTV exceeds that tolerance. The analog confirms that while the *mechanism* is acceptable, the *mathematical outcome* is not.

  ### Consistency and Commitments
  You noted that every past Endorsement was Good/Good and every Rejection was Bad/Bad (ignoring the qualitative vetoes on 2 and 4). This new bill breaks that pattern. Here is what each verdict commits the group to:

