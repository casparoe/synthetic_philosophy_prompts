      *   **Task 4 (Young):** Identify whose target Michael Young's *The Rise of the Meritocracy* is (Rawls, Nozick, both, neither) and defend.

  3.  **Analyze the Student Script (Section by Section):**

      *   **Part 1: Rawls on (A) and (B).**
          *   *Student:* Says talent is a lottery. Pushes further: disposition to cultivate (character/effort) is also circumstantial. Therefore, contribution-based income isn't defended by desert. Rawls needs (B) because fair competition still reflects the lottery. Inequalities permitted only if they advantage the least well off (Difference Principle).
          *   *Assessment:* This is strong. It captures the "moral arbitrariness" argument well, including the often-missed point about effort/character being contingent on circumstances. It correctly links (A) to (B) via the idea that "fair equality of opportunity" + "contribution" isn't enough for justice because the inputs are arbitrary. It mentions the Difference Principle as the justification for inequality, not desert.
          *   *Verdict:* Accurate and sophisticated.

      *   **Part 2: Legitimate Expectations vs. Moral Desert.**
          *   *Student:* "Under a just scheme the public rules generate expectations... Rawls's claim is that these expectations are what desert amounts to in a just society. Nobody has a pre-institutional moral claim on their share, but once institutions are just, the shares they assign are what people deserve. The two ideas differ in their origin, not in their function."
          *   *Assessment:* **Critical Error Here.** Rawls explicitly distinguishes "legitimate expectations" from "moral desert." The student says, "these expectations are what desert amounts to in a just society" and "The two ideas differ in their origin, not in their function." This is the opposite of Rawls's view. For Rawls, *justice as fairness* rejects pre-institutional moral desert entirely. Entitlements (legitimate expectations) are created by the rules of the basic structure. They are *not* a form of desert, even institutional desert. Rawls argues we shouldn't distribute according to moral desert *at all*. The student conflates entitlement with a form of institutional desert ("what people deserve"). Rawls insists on the distinction: you are *entitled* to your income under the rules, but you do not *morally deserve* it in a way that justifies the rules. The phrase "differ in their origin, not in their function" is particularly problematic because their function *is* different in Rawls's theory (one justifies the scheme, the other is a result of the scheme).
          *   *Verdict:* Significant conceptual error on a key technical distinction required by the prompt ("why he thinks it is not a stand-in for moral desert").

      *   **Part 3: Nozick on (A) and (B).**
          *   *Student:* Nozick agrees on the lottery/pre-institutional desert. Rejects Rawls's conclusion. Justice is historical/process-based, not patterned. Wilt Chamberlain example. Entitlement is desert produced by voluntary exchange. "Once they have, he deserves it." Objection to redistribution as claim on time/labor.
          *   *Assessment:* Mostly correct on the historical vs. patterned distinction and the Chamberlain example. However, there's a subtle slip on "desert." Nozick, like Rawls, generally rejects *moral desert* as the basis for distributive justice. He talks about *entitlement*. The student writes: "Entitlement, then, is desert produced by voluntary exchange... he deserves it." Nozick would likely say Chamberlain is *entitled* to the money, not that he morally *deserves* it in a retributive or pre-institutional sense. However, Nozick is less explicit than Rawls on scrubbing "desert" language entirely, often treating "holding" as the key. But the bigger issue is Claim (B). Does Nozick reject (B)? (B) says: "A society in which every position is genuinely open to talent, and in which income tracks what people contribute, can still be unjust." Nozick would likely say such a society is *just* provided the transactions were voluntary. So he does reject (B). The student explains this via the patterned vs. historical distinction.
          *   *Nuance:* The student says Nozick agrees about "pre-institutional desert." Actually, Nozick agrees people don't deserve their *talents* naturally, but he argues that doesn't matter because justice isn't about matching distribution to moral worth. The student's phrasing "Entitlement, then, is desert produced by voluntary exchange" is slightly imprecise philosophically (Nozick avoids grounding justice in desert), but functionally captures the "you keep what you get via voluntary transfer" idea.
          *   *Verdict:* Good grasp of the main argument (historical entitlement), slight sloppiness on "desert" terminology which mirrors the error in the Rawls section, but captures the rejection of (B) correctly.

      *   **Part 4: Michael Young's Meritocracy.**
          *   *Student:* Young's target is Nozick, not Rawls. Claims Rawls endorses careers open to talents + fair equality of opportunity, so Young's satire is close to Rawls's ideal corrupted. Nozick rejects principles assigning shares according to dimensions of persons. Young's lesson is Nozick's: distributions should not match a formula.
          *   *Assessment:* **This is a major interpretive error.** Michael Young's *The Rise of the Meritocracy* is widely taught as a critique of the *meritocratic ideal* that Rawls attempts to refine but ultimately moves beyond. However, Rawls explicitly argues *against* the idea that justice is about rewarding moral desert or even strict meritocratic contribution (hence Claim B). Young's satire is often seen as targeting the *liberal egalitarian* consensus that Rawls is part of (specifically the "Fair Equality of Opportunity" strand which Rawls includes but subordinates to the Difference Principle). However, the standard reading in political philosophy courses (especially when paired with Rawls/Nozick) is that Young targets the *Meritocratic* view. Rawls *rejects* the idea that distribution should track contribution/merit for its own sake (Claim B). Nozick rejects patterned distribution entirely.
          *   *The Crux:* Young attacks a society where status = IQ + Effort. Rawls argues that since IQ and Effort are morally arbitrary, distribution should *not* simply track them (unless it helps the worst off). Therefore, Rawls is *not* advocating the system Young satirizes (strict meritocracy). However, Rawls *does* advocate "Fair Equality of Opportunity." Young's satire is usually interpreted as a warning against the *Rawlsian* liberal attempt to make meritocracy fair, showing it leads to arrogance/tyranny. But the prompt asks whose target Young is.
          *   *Standard Interpretation:* Young is usually seen as critiquing the *Meritocratic* view. Rawls critiques Meritocracy via Claim (A) & (B). Nozick critiques Patterned Principles (which Meritocracy is).
          *   *Student's Argument:* Student says Young targets Nozick because Nozick rejects formulas. This is weak. Nozick doesn't propose a meritocratic formula; he proposes historical entitlement. Young is satirizing a society *run on intelligence plus effort*. That sounds like a patterned principle. Nozick rejects patterned principles. So Young's satire describes a society Nozick would *also* reject (if it involved state enforcement of that pattern). But Young's target is the *ideology* of meritocracy. Rawls argues against that ideology (Claim B). So Young is actually highlighting the problem Rawls tries to solve, or perhaps critiquing Rawls's "Fair Equality of Opportunity" component.
          *   *Consensus in Literature:* Young is typically read as a precursor to Rawls's critique of desert, OR as a critique of the Social Democratic/Meritocratic consensus that Rawls inherits. But saying Young targets Nozick is very strange. Nozick is the libertarian critic of patterned justice. Young is critiquing a specific pattern (IQ + Effort). Nozick would agree with Young that the state shouldn't enforce that pattern, but Young's critique is sociological/moral about the *elite* produced.
          *   *Better Answer:* Young targets the Meritocratic ideal. Rawls *rejects* the Meritocratic ideal (in its pure form) via Claim (B). Nozick rejects it because it's patterned. However, Young is most often associated with the *liberal egalitarian* worry that Rawls addresses. To say Young targets Nozick is incorrect. Nozick is not a meritocrat. To say Young targets Rawls is debatable (Rawls limits meritocracy), but Rawls accepts Fair Equality of Opportunity. The strongest reading is usually that Young targets the *Meritocratic* view which Rawls critiques but incorporates partially.
          *   *Student's specific error:* "Young's target is Nozick's... Nozick, by contrast, rejects any principle that assigns shares according to some dimension of persons, and merit is exactly such a dimension. Young's book is a satire... and its lesson is Nozick's." This is internally inconsistent. If Young's lesson is Nozick's, why is Nozick the *target*? The student argues Young satirizes meritocracy, Nozick rejects meritocracy, therefore Young targets Nozick. That logic fails. If they agree, he's not the target. The target is the *proponent* of meritocracy. Rawls is a partial proponent (FEO) but rejects the moral desert aspect. Nozick is not a proponent. The target is the *Meritocrat*. Neither Rawls nor Nozick are pure meritocrats. But Rawls is closer to the "Fair Equality of Opportunity" view that Young critiques.
          *   *Verdict:* The logic here is muddled. Identifying Nozick as the target is likely wrong. Nozick is the *ally* against patterned distribution, or at least agrees the state shouldn't enforce merit. Rawls is the one trying to tame meritocracy. Most instructors would expect Young to be linked to the critique of the Meritocratic view that Rawls is engaging with (often Rawls is seen as responding to the problems Young raises, or Young is seen as critiquing the Rawlsian "Fair Equality of Opportunity" strand). Saying Young targets Nozick is a significant misunderstanding of Nozick's position (Nozick doesn't advocate meritocratic distribution).

