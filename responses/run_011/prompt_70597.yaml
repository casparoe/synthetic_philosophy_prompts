  2.  **Analyze the Exam Question:**
      *   **Claim (A):** Nobody deserves native endowment or circumstances. (The "Natural Lottery" / Moral Arbitrariness).
      *   **Claim (B):** A society open to talent with income tracking contribution can still be unjust. (Critique of Meritocracy).
      *   **Task 1 (Rawls):** Explain how Rawls holds (A) and (B) together.
      *   **Task 2 (Rawls):** Explain the role of "legitimate expectations" and why it is *not* a stand-in for moral desert.
