  **Feedback for Student**

  > You demonstrate an excellent grasp of Rawls's argument regarding moral arbitrariness, particularly the insight that effort itself is contingent on circumstance. This section is strong and saves the script from a lower grade. However, you lose significant marks on the technical distinction between "legitimate expectations" and "moral desert." You argue that they differ in origin but not function; for Rawls, they differ in both. Entitlements are created by the rules, but they do not function as a proxy for moral desert—the concept of desert is excluded from the justification of the scheme entirely. You make a similar terminological slip with Nozick (equating entitlement with desert), though your application of the historical/patterned distinction is correct. Finally, your section on Young is logically contradictory: you claim Young targets Nozick, but then argue that Young's lesson *is* Nozick's. If they agree on the conclusion, Nozick is not the target. Be careful to check that your concluding attribution matches the reasoning provided in the paragraph.
