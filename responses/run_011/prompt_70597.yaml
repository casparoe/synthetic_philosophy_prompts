  **Breakdown and Assessment**

  **1. Rawls on Claims (A) and (B) together (7 / 7 points)**
  *   **What is right:** This is the strongest section of the script. You correctly identify that Rawls extends the "moral arbitrariness" argument beyond raw talent to include the *disposition* to cultivate talent (effort/character). This is a crucial nuance that prevents the "but they worked harder" objection. You also correctly link this to Claim (B): even with fair equality of opportunity, the outcome reflects the lottery, so contribution alone does not justify the distribution. You accurately note that Rawls permits inequalities only instrumentally (to advantage the least well-off), not as a reward for desert.
  *   **What is wrong:** Nothing significant in this paragraph.
  *   **Cost:** 0 points deducted. This demonstrates a sophisticated grasp of the core argument.

  **2. Legitimate Expectations and Moral Desert (3 / 8 points)**
  *   **What is right:** You correctly state that legitimate expectations arise from public rules within a just scheme and that there is no pre-institutional claim.
  *   **What is wrong:** You fundamentally misstate the relationship between expectations and desert. You write: *"Rawls's claim is that these expectations are what desert amounts to in a just society... The two ideas differ in their origin, not in their function."* This is the opposite of Rawls's position. Rawls argues that we should *abandon* the concept of moral desert in distributive justice entirely. Legitimate expectations (entitlements) are not a *form* of desert; they are a replacement for it. By saying they do not differ in function, you imply they serve the same justificatory role (i.e., justifying a share as "deserved"). For Rawls, entitlements justify the share *within the rules*, but the rules themselves are not justified by desert.
  *   **Cost:** 5 points deducted. This is a central conceptual distinction requested by the prompt. Conflating entitlement with a form of institutional desert misses the specific point of Rawls's critique of the "common sense" notion of desert.

  **3. Nozick on (A) and (B) (4 / 5 points)**
  *   **What is right:** You correctly identify Nozick's historical entitlement view versus patterned principles. The Wilt Chamberlain example is appropriately used to show how voluntary exchange upsets patterns, explaining why Nozick rejects (B) (he would view the society described as just if the transactions were voluntary).
  *   **What is wrong:** You repeat the terminological error from the Rawls section: *"Entitlement, then, is desert produced by voluntary exchange... he deserves it."* Nozick, like Rawls, generally avoids grounding justice in moral desert. He argues Chamberlain is *entitled* to the money, not that he morally *deserves* it in a retributive sense. However, your explanation of the mechanism (voluntary transfer vs. pattern) is correct.
  *   **Cost:** 1 point deducted. The conceptual grasp of the historical/patterned distinction is solid, but the persistent conflation of "entitlement" with "desert" suggests a misunderstanding of the technical vocabulary used by both authors.

  **4. Michael Young's Meritocracy (2 / 5 points)**
  *   **What is right:** You correctly identify that Young's satire depicts a society where distribution matches IQ + Effort.
  *   **What is wrong:** The attribution is logically inconsistent. You state: *"Young's meritocracy is Nozick's target"* but conclude: *"Young's book is a satire... and its lesson is Nozick's."* If Young's lesson is Nozick's (i.e., they agree that distributions should not match a formula), then Nozick cannot be the *target* of the critique; they would be allies. Furthermore, chronologically, Young (1958) precedes Nozick (1974), so Young cannot be targeting Nozick. If the question asks who Young is targeting, the standard reading is that he critiques the Meritocratic Ideal that Rawls attempts to refine (specifically Fair Equality of Opportunity). You argue Rawls endorses the system Young satirizes, which is partially true, but then claim Young targets Nozick, which contradicts your own claim that they share a lesson.
  *   **Cost:** 3 points deducted. The argument contains an internal contradiction and a likely misidentification of the philosophical target, undermining the defense required by the prompt.

