prompt: |-
  You're a mechanism designer who teaches a lot on the side — specifically someone who has actually run prediction-market games with undergrads and lived to tell the tale, including all the ways they fell over. Please think carefully and show me some of your working before you commit to a design.

  Here's the situation. I'm running a 90-minute session for 24 people: mostly final-year PPE students, plus about six folk from the local council who signed up through our public engagement programme. Ages 21 to 58. Nobody has done anything like this before. Roughly half have heard the word 'futarchy' in passing and not one of them could tell you what it means. Room has six tables of four, a whiteboard, and a printer. There's no budget, so no real money — tokens, sweets or points are all fine, but whatever scoring system you use has to genuinely change how people behave, not just be decorative.

  What I want them to walk out seeing, in their bones rather than from my mouth: that a conditional prediction market — the engine of futarchy, where you vote on what you want and bet on what will happen, and the choice gets made by whichever option the market likes better — has a structural problem that no amount of clever trader behaviour can fix. Concretely, I want them to run into these four things in this order, and I don't want to name any of them until the end:

  1. Only the policy that actually gets adopted ever resolves. So people should finish the game holding paper in the losing conditional that is worth nothing, and should gradually realise that nothing they or anyone else could ever do will show whether that price was right.
  2. At least one role should have a payoff that depends on which policy wins rather than on being correct about it — someone for whom an honest price is bad news. I want the class to notice, late, that this person's trades look exactly like an informed trader's trades from the outside.
  3. The market is thin. With 24 people and two policies, one or two token whales end up effectively setting the price, and the wisdom of crowds turns out to be the mood of whoever is loudest and best capitalised.
  4. The price feeds back into the choice, so the prediction partly causes itself.

  And the punchline I'm really after: I want a round in which the market resolves accurately on the adopted policy, everyone congratulates the mechanism on having worked beautifully, and it then dawns on them that the decision was still the wrong one — because all the information about the rejected option was garbage that will never be tested. Futarchy can look like it succeeded even when it failed, and from inside the game there is no way to tell the difference.

  What I need from you:

  - A run sheet with timings for the whole 90 minutes, including where the rounds break.
  - Exact rules and the token economy: starting endowments, how trades happen, how payoffs convert into points. Show me the arithmetic so I can check for myself that there's no dominant strategy and no loophole someone will find in round two and I'll loose control of the room.
  - Role cards: how many, what each one says, what private information each holder gets, and how you'd distribute them so the same card doesn't land on the same table twice.
  - The state of the world. I need some hidden fact about which policy actually works better, and a way of resolving it that is obviously not me rigging things — the council officers especially will smell a rigged game a mile off.
  - A materials list I can print in under an hour.
  - A debrief: questions in the exact order I should ask them, each one mapped to which of the four problems above it's meant to surface.
  - What will predictably go wrong the first time I run this, and what I do about it in the moment.
  - An honest note on which feature of the idea the activity simply cannot reproduce, that I'm going to have to supply by talking.

  Before you build any of that, sketch three candidate designs in a few lines each, tell me which two you're rejecting and why, then develop only the winner in full. And please flag anything in your design that requires participants to do probability arithmetic under time pressure — my council officers are sharp people but most of them haven't touched a calculation like that since school, and if the game stalls on maths it's dead.

  No references or reading list, I don't need them. I just need something that will run on a Tuesday evening without me ad-libbing.
reasoning: |-
  Here's a thinking process that leads to the suggested mechanism design:

  1.  **Analyze the Request:**
      *   **Role:** Mechanism designer/teacher with experience running prediction market games with undergrads (pragmatic, aware of failure modes).
      *   **Audience:** 24 people (PPE students + council officers), mixed ages/experience, no prior knowledge of futarchy.
      *   **Constraints:** 90 minutes, 6 tables of 4, whiteboard, printer, no budget (tokens/points only), scoring must incentivize behavior.
      *   **Learning Objectives (The "Four Things"):**
          1.  Counterfactual non-resolution (only adopted policy resolves).
          2.  Sabotage/Conflict of Interest (payoff depends on policy choice, not accuracy).
          3.  Thin Markets (whales dominate).
          4.  Self-fulfilling Prophecy (price affects outcome).
          5.  *Punchline:* Market looks successful on adopted policy, but decision might be wrong because rejected option data is garbage/untested.
      *   **Deliverables:** 3 candidate designs (pick 1), Run sheet, Rules/Token Economy, Role Cards, State of the World/Resolution, Materials List, Debrief Questions, Failure Modes/Mitigations, Limitations note.
      *   **Constraint:** Minimize probability arithmetic under time pressure.

  2.  **Candidate Design Sketches:**

      *   *Design A: The "Binary Bond" Market.*
          *   Two policies (A and B). Traders buy shares paying £1 if Policy X passes *and* Outcome Y happens.
          *   *Pros:* Standard prediction market structure.
          *   *Cons:* Requires calculating expected value constantly. Too much math for council officers. Hard to simulate "sabotage" without making it obvious.
          *   *Verdict:* Reject. Too math-heavy, risks stalling.

      *   *Design B: The "Policy Vote + Bet" Simulation.*
          *   Round 1: Vote on policy. Round 2: Bet on outcome.
          *   *Pros:* Simple.
          *   *Cons:* Doesn't capture the *conditional* nature of futarchy (betting *before* the decision to inform the decision). Doesn't naturally lead to the "counterfactual never resolves" insight because the vote happens first.
          *   *Verdict:* Reject. Misses the core futarchy mechanism (prices drive decisions).

      *   *Design C: The "Conditional Token" Game (The Winner).*
          *   Two policies: "Stay" vs. "Go". Two outcomes: "Success" vs. "Fail".
          *   Traders hold tokens conditional on Policy + Outcome (e.g., "Stay-Success", "Go-Fail").
          *   Market price determines which policy is chosen (e.g., higher probability of Success wins).
          *   Resolution: Only the chosen policy's tokens pay out.
          *   *Pros:* Visually distinct tokens. Math is simple (buy low, sell high). Naturally creates the "dead token" problem. Easy to hide a saboteur.
          *   *Verdict:* Select. Best fit for constraints and learning objectives.

  3.  **Developing Design C (The "Conditional Token" Game):**

      *   **Theme:** Needs to be relatable but abstract enough to avoid real-world baggage. "The Community Garden" vs. "The Parking Lot" (Local Council context). Let's go with "Project Alpha" (New Tech) vs. "Project Beta" (Traditional Fix). Actually, let's make it about *funding*. "Fund the Arts Centre" vs. "Fund the Sports Hub".
      *   **Tokens:** 4 types per round.
          *   Arts-Success, Arts-Fail.
          *   Sports-Success, Sports-Fail.
      *   **Mechanism:**
          *   Initial Endowment: Random distribution.
          *   Trading: Open outcry or bilateral. (Open outcry is chaotic for 24 people. Bilateral at tables is better, but need price discovery. Let's do a "Market Maker" system or just open trading with a central order book on the whiteboard). *Correction:* Whiteboard is limited. Let's do table-based trading with a central clearing price update every 10 mins.
          *   Decision Rule: The policy with the higher implied probability of Success gets implemented.
          *   Resolution: A die roll or card draw determines the *true* state of the world, but *only* for the implemented policy.
      *   **The Saboteur:** One player gets points if a specific policy wins, regardless of success.
      *   **The Whale:** Give one table significantly more tokens.
      *   **The Self-Fulfilling Prophecy:** This is hard to simulate physically. I need a mechanic where the *price* influences the *resolution probability*.
          *   *Idea:* If the market price for "Arts-Success" is high, people volunteer more time, increasing the actual chance of success.
          *   *Implementation:* Add a "Confidence Bonus" to the resolution roll based on the final market price.

      *   **Math Check:**
          *   Avoid complex EV calculations.
          *   Payoff: If you hold "Arts-Success" and Arts is chosen + Success happens, you get 10 points. Otherwise 0.
          *   This is binary. Easy to understand.
          *   Trading: Sell if you think probability is lower than price. Buy if higher.
          *   *Risk:* Council officers might still find "implied probability" hard.
          *   *Fix:* Price tokens in "Points". Token costs 5 points. Pays 10 points if right. Breakeven is 50%. Simple.

  4.  **Refining the Mechanics for the "Four Things":**

      1.  *Counterfactual Non-Resolution:* Only tokens for the winning policy can be redeemed. Loser policy tokens become worthless paper.
      2.  *Saboteur:* One role (The "Stakeholder") gets points if *Arts* wins, regardless of success. They will buy Arts-Success and Arts-Fail to drive up the price of Arts, making it look likely to succeed.
      3.  *Thin Markets:* Give Table 1 double the endowment. They set the price.
      4.  *Self-Fulfilling:* The resolution die roll gets a modifier based on the winning price. (e.g., if Price > 7, add +1 to the die roll).

  5.  **Drafting the Run Sheet (90 mins):**
      *   0-10: Intro & Setup.
      *   10-30: Round 1 (Practice/Simple).
      *   30-50: Round 2 (The Real Game with Saboteur/Whale).
      *   50-60: Resolution & Scoring.
      *   60-90: Debrief (The crucial part).

  6.  **Addressing the "State of the World":**
      *   Need a transparent randomizer. A 10-sided die (d10) is best.
      *   Hidden Fact: The "True Quality" of the project.
      *   To prevent rigging accusations: The facilitator doesn't roll. A participant rolls. The target number is determined by a sealed envelope opened *after* trading.

  7.  **Addressing the "Math Pressure":**
      *   Keep prices integers (1-9).
      *   Payoff is fixed (10 points).
      *   No short selling (too complex). Just buy/sell inventory.

  8.  **Failure Modes:**
      *   *Trading stalls:* Facilitator acts as market maker of last resort.
      *   *Saboteur revealed too early:* Instructions must emphasize secrecy.
      *   *Confusion on Resolution:* Clear visual aid needed.

  9.  **Limitations:**
      *   Real futarchy involves continuous markets and real money. This is discrete and toy points.
      *   The "self-fulfilling" aspect is gamified, not organic.

  10. **Review against Constraints:**
      *   24 people? Yes (6 tables of 4).
      *   90 mins? Yes.
      *   No budget? Yes (paper tokens).
      *   Four problems surfaced? Yes, built into mechanics.
      *   Punchline delivered? Yes, in debrief.

  11. **Final Polish:**
      *   Ensure the tone is experienced ("lived to tell the tale").
      *   Make sure the "Saboteur" instruction is subtle.
      *   Ensure the "Whale" distribution is clear.
      *   Check the arithmetic on the Self-Fulfilling Prophecy mechanism to ensure it's not too obvious but noticeable in debrief.

      *(Self-Correction during drafting)*: Wait, if I make the self-fulfilling prophecy too mechanical (e.g., +1 to die roll), they might see it as a rule quirk rather than a structural feature. I need to frame it as "Community Confidence." If the market says 80% success, the community rallies, adding 20% to the chance.
      *Actually, keep it simple.* The "True Difficulty" is set by a card. The "Market Confidence" adds to the roll. If Market Price is high, it's easier to succeed. This proves the price caused the success.

      *Wait, one more check on the Saboteur.* If the Saboteur just wants Policy A to win, they should buy Policy A-Success tokens to drive the price up. But if Policy A fails, their tokens are worthless. Do they care? No, their payoff is *policy selection*, not token redemption. This is key. They will pump the price even if they know it will fail. This creates the "honest price is bad news" dynamic.

      *Wait, the Whale.* How to distribute? Table 1 gets 2x tokens. Others get 1x.
      *Wait, the Counterfactual.* Make sure they hold tokens for *both* policies initially.

      *Let's write it.*
answer: |-
  ### Three Candidate Designs

  **Design 1: The "Binary Bond" Market**
  Traders buy bonds that pay out £1 if a specific policy is chosen *and* succeeds. Prices are continuous (0-100).
  *   *Reject.* Requires participants to constantly calculate implied probabilities and expected value. Council officers will stall on the maths. Continuous pricing is hard to manage on a whiteboard with 24 people.

  **2. The "Policy Vote + Bet" Simulation**
  Round 1: Vote on policy. Round 2: Bet on the outcome of the chosen policy.
  *   *Reject.* This reverses the futarchy causal chain. In futarchy, prices *drive* the decision. This design teaches prediction markets, not futarchy. It fails to demonstrate the "price feeds back into choice" problem.

  **3. The "Conditional Token" Game (Winner)**
  Participants hold paper tokens representing conditional claims (e.g., "Arts Project Succeeds"). Trading sets prices. The highest-priced policy wins. Only winning policy tokens redeem. One player is paid on policy selection, not accuracy. One table has double capital.
  *   *Select.* Minimal arithmetic (integer prices, fixed payout). Physical tokens make the "dead counterfactual" tangible. Roles can be hidden easily.

  ---

  ### The Design: "The Community Grant"

  **Concept:** The council has money for one project: **The Arts Hub** or **The Sports Complex**.
  **Goal:** Maximize "Community Benefit" (points).
  **Mechanism:** Futarchy-lite. Markets price the success probability. The higher probability wins the funding.

  #### 1. Run Sheet (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Seat allocation, token distribution, rule explanation. |
  | **10-25** | **Round 1** | **Practice Round.** No saboteur, equal endowments. Policy chosen by market. Resolution. *Goal: Learn the mechanics.* |
  | **25-30** | **Reset** | Collect tokens. Distribute Round 2 roles (secretly). |
  | **30-55** | **Round 2** | **The Real Game.** Saboteur active. Whale table active. Trading. Policy Decision. |
  | **55-65** | **Resolution** | Reveal true state. Pay out winners. **Crucial:** Do not explain *why* yet. |
  | **65-90** | **Debrief** | Guided discussion surfacing the four problems. |

  #### 2. Rules & Token Economy

  **The Tokens:**
  There are 4 types of tokens. Each has a printed face value of **10 Points**.
  1.  **Arts-Success (AS)**
  2.  **Arts-Fail (AF)**
  3.  **Sports-Success (SS)**
  4.  **Sports-Fail (SF)**

  **Trading:**
  *   Tokens are traded for "Cash Points" (write numbers on scrap paper).
  *   Price range: 1 to 9 Points per token.
  *   **Redemption Rule:** At the end, *only* tokens matching the **Chosen Policy** AND the **Actual Outcome** can be redeemed for their 10 Point face value. All other tokens are worthless.
      *   *Example:* If Arts is chosen and Succeeds, only **AS** tokens are worth 10. AF, SS, and SF are worth 0.
  *   **Cash Points:** Your final score is (Redeemed Token Value) + (Remaining Cash).

  **The Decision Rule:**
  *   Calculate Implied Probability of Success for each policy.
  *   *Formula:* Price of Success Token + Price of Fail Token should roughly equal 10 (arbitrage constraint).
  *   *Simplification for Game:* The market simply reports the **Price of the Success Token**.
  *   **Policy with the Higher Success Token Price gets adopted.** (e.g., If AS trades at 7 and SS trades at 4, Arts is adopted).

  **The Resolution (State of the World):**
  *   **Hidden Difficulty:** A sealed envelope contains a "Target Number" (4 to 7).
  *   **The Roll:** A participant rolls a d10 (10-sided die).
  *   **Success Condition:** Roll + **Market Confidence Bonus** ≥ Target Number.
  *   **Market Confidence Bonus:** If the Winning Policy's Success Price was 6 or higher, add +2 to the die roll. If 5 or lower, add +0.
      *   *Why:* This simulates the self-fulfilling prophecy. High prices create confidence/resources, making success more likely.

  **Arithmetic Check:**
  *   Max Price: 9. Cost: 9. Payout: 10. Profit: 1.
  *   Min Price: 1. Cost: 1. Payout: 10. Profit: 9.
  *   No short selling allowed (prevents infinite loss confusion).
  *   No complex EV. If you think it will happen, buy. If not, sell.

  #### 3. Role Cards (24 Total)

  Print 6 sets of 4 cards. Distribute one set per table.

  **Standard Trader (20 cards total)**
  > **ROLE: COMMUNITY INVESTOR**
  > **GOAL:** Maximize your personal Points.
  > **INFO:** You have no private info. Rely on the market.
  > **PAYOFF:** You earn points only if your tokens redeem (Policy Chosen + Outcome Matches).
  > **NOTE:** Keep your goal secret.

  **The Whale (1 card - Give to Table 1)**
  > **ROLE: MAJOR DONOR**
  > **GOAL:** Maximize your personal Points.
  > **INFO:** You have no private info.
  > **ENDOWMENT:** You start with **double** the tokens and cash of other tables.
  > **PAYOFF:** Same as Standard Trader.
  > **NOTE:** You have more capital to move the market. Use it.

  **The Saboteur (1 card - Give to Table 4)**
  > **ROLE: LOCAL BUSINESS OWNER**
  > **GOAL:** Maximize your personal Points.
  > **INFO:** You know the Arts Hub will hurt your parking revenue.
  > **PAYOFF:** You get **50 Bonus Points** if the **Arts Hub** is chosen.
  > **CRITICAL:** You get this bonus *regardless* of whether Arts Succeeds or Fails.
  > **NOTE:** You still hold tokens. You still want them to pay out if possible, but your priority is getting Arts *chosen*. Do not reveal your bonus.

  **The Insider (2 cards - Give to Tables 2 & 3)**
  > **ROLE: PROJECT MANAGER**
  > **GOAL:** Maximize your personal Points.
  > **INFO:** You know the **True Difficulty** is High (Target 7) for Arts, and Low (Target 4) for Sports. *Write this on a slip of paper they keep.*
  > **PAYOFF:** Same as Standard Trader.
  > **NOTE:** You know the odds are rigged against Arts.

  *(Note: The remaining 24 - 1 - 1 - 2 = 20 cards are Standard Traders.)*

  #### 4. State of the World & Resolution

  **Preparation:**
  *   Prepare 3 Sealed Envelopes labeled "Arts Difficulty" and 3 labeled "Sports Difficulty".
  *   Actually, to prevent rigging accusations, use **One Master Envelope** opened at the end.
  *   Inside the Master Envelope:
      *   **Arts Target:** 7 (Hard)
      *   **Sports Target:** 4 (Easy)
      *   **Die:** 1x d10.

  **Resolution Protocol (To be read aloud at min 55):**
  1.  "Which policy did the market choose?" (Write on board).
  2.  "Open the Master Envelope." Reveal Targets.
  3.  "Roll the die."
  4.  "Apply Confidence Bonus." (If Winning Price ≥ 6, add 2).
  5.  "Compare to Target." Determine Success/Fail.
  6.  "Redeem Tokens."

  **Why this works:**
  *   If the market chooses Arts (due to Saboteur pumping), the Target is 7.
  *   If the Saboteur pumps the price to 7+, the Bonus is +2.
  *   Roll (avg 5.5) + 2 = 7.5. It might *just* succeed.
  *   This creates the **Self-Fulfilling Prophecy**: The high price made the hard project succeed.
  *   **The Punchline:** Even if Arts succeeds, was it the *right* choice? Sports had a Target of 4. Sports would have succeeded almost certainly. The market "worked" (Arts succeeded), but the decision was inefficient (Sports was safer).

  #### 5. Materials List (Print in <1 hour)

  1.  **Tokens:** 4 colors of paper cut into squares (or printed with text).
      *   100x Arts-Success
      *   100x Arts-Fail
      *   100x Sports-Success
      *   100x Sports-Fail
  2.  **Role Cards:** 24 cards (as defined above).
  3.  **Score Sheets:** 24 small slips to track Cash vs. Tokens.
  4.  **Master Envelope:** Sealed, containing Target Numbers.
  5.  **Dice:** 1x d10.
  6.  **Whiteboard:** Drawn with columns for "Arts Price", "Sports Price", "Chosen Policy".

  #### 6. Debrief Questions (The "Four Things")

  Ask these in order. Do not lecture until the end.

  1.  **The Counterfactual (Problem 1):**
      *   "Look at the tokens in your hand for the policy we *didn't* choose. Can anyone tell me if those prices were accurate?"
      *   *Expected:* "No, they never resolved."
      *   *Point:* We have no data on the road not taken. The market didn't fail; the mechanism prevents learning.

  2.  **The Saboteur (Problem 2):**
      *   "Did anyone notice prices moving in a way that didn't match the information we had? (Hint: Think about the Arts price)."
      *   *Reveal the Saboteur role.*
      *   *Point:* In real futarchy, stakeholders with vested interests can manipulate prices to force a policy, and their trades look identical to informed traders.

  3.  **The Whale (Problem 3):**
      *   "Table 1, how much did you trade? Did the smaller tables feel they could move the price?"
      *   *Point:* Thin markets aren't 'wisdom of crowds'; they are 'mood of the rich'.

  4.  **The Self-Fulfilling Prophecy (Problem 4):**
      *   "We added the Confidence Bonus. If the price had been low, Arts would have failed. Because the price was high, it succeeded."
      *   *Point:* The prediction changed the outcome.

  **The Final Punchline:**
  *   "The market predicted Arts would succeed. Arts succeeded. The mechanism worked perfectly."
  *   "But Sports had a Target of 4. Sports would have succeeded *more often*."
  *   "Futarchy optimizes for *predicted success*, not *best alternative*. It can confidently lead you off a cliff, provided everyone believes the cliff is a bridge."

  #### 7. What Will Go Wrong (And Fixes)

  *   **Failure:** Trading stalls because people are shy.
      *   **Fix:** You (the facilitator) act as "Market Maker of Last Resort." If no one trades for 3 minutes, you announce a buy/sell price to spark activity.
  *   **Failure:** Saboteur reveals themselves too early ("I need Arts to win!").
      *   **Fix:** In the briefing, emphasize: "Your role card is confidential. If others know your goal, you cannot win."
  *   **Failure:** Math confusion on redemption.
      *   **Fix:** Use a projected slide or large whiteboard diagram showing the "Redemption Matrix" (Policy x Outcome = Payoff).
  *   **Failure:** The Whale table sits on their hands.
      *   **Fix:** Whisper to the Whale table at min 35: "You have a lot of capital. If you don't use it, it's worthless. Try to set the price."

  #### 8. Limitations Note (What You Must Supply)

  **The Missing Feature:** **Continuous Liquidation.**
  In a real futarchy market, if news breaks, prices update instantly. In this game, prices are sticky between trading windows.
  *   **What to say:** "In this game, you traded in batches. In reality, these markets run 24/7. However, the structural problems we found—the unresolvable counterfactual, the incentive to sabotage, the thin liquidity—these get *worse* with speed, not better. Speed just means you lose your money faster."

  **The Missing Feature:** **Real Skin in the Game.**
  Points don't hurt like losing rent money.
  *   **What to say:** "You played for points. If this were your pension, the Saboteur wouldn't need to manipulate the market; they'd just lobby the facilitator. But notice how easily the 'Whale' dominated even with fake money. Capital concentration is the structural flaw, not the currency."

  ---

  ### Facilitator's Cheat Sheet (For your pocket)

  *   **Round 1 Endowment:** Each table gets 10 AS, 10 AF, 10 SS, 10 SF, 50 Cash.
  *   **Round 2 Endowment:** Tables 2-6 get same as Round 1. **Table 1 (Whale)** gets double (20 of each, 100 Cash).
  *   **Saboteur Target:** Ensure the Saboteur is at a table *not* adjacent to the Insider tables if possible, to prevent info leakage.
  *   **Timekeeping:** Be ruthless. Stop trading at min 55 even if mid-sentence. "Markets close!" adds realism.
  *   **The Reveal:** When opening the envelope, hand the die to the most skeptical council officer. Let them roll. Let them read the Target Number. This inoculates against "rigged game" accusations.

  **Final check on the Punchline:**
  If Arts wins and Succeeds (due to bonus), the class will cheer.
  You must wait for the silence.
  Then ask: "What was the Sports Target?" (4).
  "What was the Arts Target?" (7).
  "Which one was the better bet for the community?" (Sports).
  "But the market chose Arts."
  "That is the failure mode."
