answer: |-
  Dear Friend,

  I have spent some time with Daniel's argument and your response to it, and I believe I can offer the diagnosis you are looking for. The argument as stated is logically valid, meaning the conclusions follow correctly from the premises, but it is unsound because one of the steps makes a claim that does not hold up to scrutiny. Specifically, the error lies in premise six. Daniel asserts that the reasoning used to defend paid kidney donation applies identically to lifelong servitude, the auction of a child, or contracting away one's right to object to harm. This assertion is false, and recognizing why it is false allows you to keep premise one without accepting the abhorrent conclusions in premise seven. You do not need to abandon the principle that impermissibility requires wronging someone. Instead, you need a more robust account of what counts as wronging someone, specifically regarding the conditions required for consent to be valid in the first place.

  The core mistake in premise six is the assumption that all voluntary exchanges operate on the same moral plane simply because they involve a transfer of something valued for something else. Premise two states that if parties judge the exchange worth making, no one is worse off. This works for commodities and body parts like kidneys or plasma because these are alienable goods. You can give them up and remain the same moral agent who consented to the transaction. However, lifelong servitude and the sale of children are not exchanges of goods; they are exchanges of status. When you sell yourself into servitude, you are not merely giving up a resource; you are attempting to alienate the very agency that makes consent possible. If the contract succeeds, you cease to be a competent adult capable of ranking preferences, which undermines the condition required by premise two. You cannot validly consent to cease being a consenter. Similarly, auctioning a child wrongs the child, who is not a party to the exchange and whose agency is being disposed of by another. Therefore, these transactions do wrong somebody: they wrong the future self who is stripped of agency, or the child who is treated as property. This means premise six is false because the test in premise one is not satisfied in these extreme cases, even if the parties initially judge the exchange worthwhile.

  This distinction provides the principle you asked for, the one that separates the lifelong servitude contract from the plasma appointment. The principle is that rights and goods are alienable only if their transfer does not destroy the conditions of moral agency required to validate the transfer. Plasma and kidneys are physical resources that exist alongside your agency. You can lose a kidney and still be a free agent capable of making future choices. Servitude is a social and legal status that removes your capacity to make future choices. By holding onto premise one, you owe us an explanation of which rights are constitutive of agency and which are merely possessions. This is not a dodge, but a substantive moral claim. It suggests that the market is permissible only where it operates between agents who remain agents throughout the transaction. This preserves your intuition about the kidney program because donating an organ does not strip you of your standing as a citizen or a moral person. It also preserves your defense of plasma donation and ordinary wage labor, as neither requires you to surrender your right to quit or your right to object to harm.

  Regarding the list in premise four, you are right to sense that these items are not a package deal. They do not all stand or fall together under the principle of agency. Paid kidney donation fits comfortably because it involves an alienable body part. Commercial surrogacy is more complex but likely permissible under this view if it is treated as a service contract that does not permanently alienate the woman's agency or parental rights beyond the gestation period, though this requires careful regulation to ensure coercion is not present. The sale of votes, however, should be rejected, not because it is squeamish, but because voting is a constitutive act of political agency. To sell a vote is to treat a public trust as private property, which wrongs the political community by corrupting the mechanism of collective self-government. It undermines the equality of agency among citizens. Post-emergency price increases are different again. These often fail the test in premise two regarding coercion. When a buyer accepts a price spike after a storm because they have no other option for survival, their consent is compromised by the background condition of desperation. This counts as coercion in the sense required by premise one, meaning the exchange wrongs the buyer by exploiting their vulnerability. Thus, you can reject price gouging and vote selling while accepting kidney markets without contradiction.

  If you accept this diagnosis, you must be prepared to live with the verdict it delivers on commercial surrogacy. If the principle is strictly about the preservation of agency, and if surrogacy contracts are structured so that the surrogate retains her legal standing and bodily autonomy after the birth, then this view suggests surrogacy is permissible. Some people find this conclusion difficult, but it is the cost of maintaining a consistent commitment to premise one. It forces you to argue against surrogacy on grounds other than the mere fact of payment, perhaps focusing on specific coercive pressures or the welfare of the child, rather than a blanket prohibition on markets in reproductive labor. This is a defensible position, but it requires you to be precise about where the threat to agency lies. It is far better than surrendering premise one entirely, which would leave you unable to distinguish between a wage labor contract and a slave contract based on the presence of harm or wronging.

  Daniel's retreat to case-by-case decision-making is understandable but theoretically expensive. It suggests there is no underlying principle connecting our intuitions, only a list of forbidden and permitted acts. By identifying the failure in premise six, you can show that there is a principle. The principle is that markets are permissible where they facilitate the goals of agents without consuming the agents themselves. This allows you to tell Daniel that his reductio fails because servitude is not an exchange of the same kind as kidney donation. One transfers a thing you have; the other transfers what you are. You can keep premise one, you can keep the kidney program, and you can condemn servitude and child selling without inconsistency. The cost is simply the work of defining the boundaries of agency, which is work worth doing.

  I hope this helps you resolve the debate in your reading group. It is a rare thing to find an argument that feels so tight yet leaves such a troubling taste, and usually, that means a hidden assumption is doing too much work. In this case, the assumption was that all consents are structurally identical. Once you see that some consents undermine the possibility of future consent, the argument falls apart, and you are left with a framework that protects both the donor and the dignity of the person.

  Sincerely,

  Your Friend
