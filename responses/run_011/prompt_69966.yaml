answer: |-
  The whiteboard was already full when Marcus walked in. Five boxes, numbered one through five, each containing a terse description of a edge case. Elena sat at the table, staring at a cup of coffee that had gone cold an hour ago.

  "Standup in twenty," Marcus said, dropping his notebook. "Tell me you've cracked Case Two."

  "I've cracked nothing," Elena said, tapping the marker against her palm. "I've just confirmed that we're arguing about the same five examples and seeing different universes. You're still on the Use Theory? Everything is context, nothing is inherent?"

  "Everything is action," Marcus corrected, leaning against the whiteboard. "Words don't hurt people; people using words hurt people. If I pick up a rock, it's a paperweight. If I throw it, it's a weapon. The rock doesn't encode 'violence.' So why does 'the term' encode 'hatred'?"

  "Because unlike the rock, the word carries a charge through insulation," Elena said, standing up and walking to the board. She circled Case Four: *The counterfactual condemnation.* "Look at this. 'If anyone ever called my brother the term, I would fight them.' The speaker is condemning the word. They are explicitly repudiating the sentiment. By your logic, this should be clean. It's a hypothetical. It's a defense of the brother. But our users still flag it. They still feel the sting. Why?"

  "Because the taboo is live," Marcus said. "You're hearing the word and your brain spikes. That's a physiological response to a social prohibition, not a semantic decoding. It's like hearing a fire alarm during a drill. You know it's a drill, but you still feel the adrenaline. That doesn't mean the alarm *means* 'burning building' in its circuitry. It means 'activate protocol.'"

  "But the adrenaline survives negation," Elena pressed. "That's the thing you keep dodding. If I say 'I am not a [slur],' the offensive content projects. It hangs in the air. If the offensiveness were just about the act of asserting hatred, negation should cancel it. It doesn't. That suggests the derogatory content is a presupposition or a conventional implicature attached to the lexical item itself. It's defective information. It misfires."

  "Okay, let's test that defectiveness," Marcus said, pointing to Case One. *The reclaimed in-group usage.* "Screenshot of a private chat. Members of the targeted group calling each other 'the term' affectionately. Your theory says the word encodes hatred. So this should be a misfire too. They should be hating themselves. But it's not hate. It's solidarity. If the meaning is encoded, how does it flip?"

  Elena paused. She uncapped the marker, recapped it. "It's not flipping the meaning. It's satisfying a constraint on the speaker. The lexical entry for 'the term' includes a condition: *Speaker stands in relation R to Target.* Usually, R is 'dominant group member.' When that condition is met, the expressive content is derogatory. When the speaker is in-group, R is 'solidarity.' The encoded content is complex, not monolithic. It's not just 'hate'; it's 'assessment of status relative to the speaker.'"

  "That sounds like you're bolting on ad hoc machinery to save the semantic theory," Marcus said, smiling without warmth. "You're saying the word means 'hate' unless it doesn't. I'm saying the word means 'person from group X,' and the social context determines whether it's a hug or a punch. My theory handles Case One naturally. Their act is reclamation. Their use changes the norm."

  "Your theory handles Case One well," Elena conceded. "But it crashes on Case Five." She tapped the bottom of the board. *The machine translation error.* "No speaker. No intent. Our system translated a benign foreign term into 'the term.' Nobody chose it. Nobody intended anything. By your logic, there is no act of use. There is no speaker to violate a norm. It should be harmless noise. But users report it as hate speech. They feel attacked."

  Marcus frowned, looking at the case. "That's the hardest one. I'll grant you that. If there's no speaker, there's no illocutionary act. But... the platform is the speaker here. We deployed the system. The display of the word is an act by us. The taboo attaches to the public display of the word-form, regardless of intent. It's like walking around with a swastika on your shirt because your laundry shrunk it. You didn't intend the symbol, but the public act of displaying it carries the weight."

  "So the taboo is properties of the symbol," Elena said, trapping him. "Not just the use."

  "No, the taboo is a property of the *public sphere*," Marcus corrected. "In the public sphere, displaying that word-form is treated as an act of aggression unless licensed. We failed to license it. But that doesn't mean the word *itself* is toxic in a vacuum. It means our context was unlicensed."

  "Semantics versus Pragmatics," Elena muttered. "But here's the worry, Marcus. Is this actually substantive? Or are you just describing my 'encoded constraints' as 'rules of use'? If I say the word carries a rule 'Do not use unless hostile,' and you say 'The norm is Do not use unless hostile,' have we actually disagreed? Or are you just wearing a sociologist's costume?"

  "It's substantive," Marcus said, pushing off the board. "Because it changes how we handle Case Two. *The good faith argument.* User says: 'This word shouldn't be banned,' and uses it repeatedly to make the point. If you're right, if the word *is* the harm, then this user is spraying poison even if they're holding a antidote bottle. The content is defective regardless of their intent. We ban the word, full stop."

  "And if you're right?" Elena asked. "If the harm is in the act?"

  "Then we have to judge the act," Marcus said. "Is this user disrupting the peace? Or are they engaging in meta-discussion? If the meaning is synonymous with the neutral counterpart, then logically, they are saying 'The neutral term shouldn't be banned.' The only reason to ban them is if the *use* of the word-form causes disruption regardless of truth conditions. That's a safety decision, not a truth decision."

  "Which is why we're deadlocked," Elena said. "I want to ban Case Two because the token itself degrades the environment. It's like allowing asbestos in a lecture about why asbestos is safe. You can't discuss it safely because the material is inherently dangerous."

  "But if we ban Case Two," Marcus countered, "we prevent the exact discussion needed to change the norm. We freeze the taboo in place. If the harm is contextual, then we should allow contexts where the harm is mitigated. Like a classroom. Like a policy debate. If we ban the word entirely, we admit your theory: that the word is inherently radioactive."

  Elena walked back to the table and sat down. "Okay. Let's look at Case Four again. The counterfactual. 'If anyone called my brother the term...' If I ban Case Two, I have to ban Case Four. Both use the word without endorsing it. But Case Four feels different. It's embedded in a conditional."

  "Exactly," Marcus said. "In Case Four, the word is mentioned, not used. It's part of the hypothesis."

  "It's not mentioned," Elena insisted. "It's used within the scope of the conditional. 'If anyone called...' That's a verb of utterance. But the offensiveness projects out. People still feel it. That suggests the expressive content escapes the logical operator. That's semantic behavior, Marcus. Pragmatic effects usually get trapped inside the conditional."

  "Unless the taboo is so strong it breaches the container," Marcus said. "Like radiation shielding that isn't thick enough. But look, we need to ship a policy on Case Two next quarter. We can't wait for a thesis defense. Where do we converge?"

  Elena stared at the cold coffee. "If we allow Case Two, we risk normalizing the token. Even if the intent is good, the presence of the word lowers the barrier for others to use it maliciously. That fits your 'public sphere' model, even if it fits my 'encoded toxicity' model better."

  "And if we ban Case Two," Marcus said, "we risk chilling legitimate discourse about safety policy. We tell users they can't argue about the rules because the rules forbid the vocabulary required to state the argument."

  "Which is worse?" Elena asked. "Normalizing the slur, or silencing the debate about the slur?"

  "Given the queue," Marcus said, gesturing to the list of flagged content, "we see mostly malicious use. The good faith cases are rare. The signal-to-noise ratio is terrible. If we allow Case Two, we have to build a classifier that distinguishes 'good faith meta-use' from 'bad faith meta-use.' That's incredibly hard. It requires understanding intent, not just pattern matching."

  "And if we ban it," Elena said, "we rely on the semantic property. The word is banned because it is the word. That's easy to engineer. Hard to justify philosophically, perhaps, but easy to enforce."

  "So you're arguing for engineering convenience," Marcus said.

  "I'm arguing for safety scalability," Elena replied. "If the word behaves as if it has encoded toxicity—surviving negation, surviving conditionals, hurting even in translation errors—then treating it as encoded toxicity is the robust heuristic. Even if you're right that it's technically pragmatic, the pragmatic effect is so consistent it might as well be semantic."

  Marcus sighed, rubbing his eyes. "That's a concession. You're admitting that for the purpose of policy, the distinction doesn't matter."

  "For the purpose of *automation*, it doesn't matter," Elena said. "For the purpose of appeals, it matters. If a user appeals Case Two, saying 'I was arguing against the ban,' what do we tell them?"

  "We tell them," Marcus said slowly, "that while we understand their intent, the use of the term creates a hostile environment for others regardless of intent. That leans on my theory—the act creates the harm—but accepts your conclusion—the ban is total."

  "So we ban Case Two," Elena said. "But we document the reasoning differently."

  "We document it as a community safety standard," Marcus said. "Not as a truth condition. We don't say 'This word is false.' We say 'This word is prohibited conduct.'"

  "Fine," Elena said. "But I need to know what would change your mind. If tomorrow we found a community where 'the term' was used neutrally 90% of the time, would you lift the ban?"

  "If the norm actually shifted," Marcus said. "If the taboo died. Then the act would no longer carry the sting. Yes. I would lift it. What about you? If the word is encoded with hatred, it should be eternal."

  "Not eternal," Elena said. "Lexical entries evolve. Reclamation changes the lexical entry. If the majority of usage shifts the constraint on the speaker relation, then the encoded content changes. But I need evidence. I need to see that the word doesn't sting in negation anymore. I need to see that 'I am not the term' stops feeling weird."

  "Grammatical tests," Marcus mused. "You want linguistic intuitions."

  "I want to know if the presupposition projects," Elena said. "If we run a survey, asking users how offensive Case Four feels versus a neutral counterpart in a conditional... if the gap closes, your theory wins. If the gap stays wide, mine holds."

  "And Case Five?" Marcus asked. "The machine error."

  "If users report it as harmful," Elena said, "then the display is the act. You were right there. The platform is the speaker."

  "Okay," Marcus said, checking his watch. "Standup. We agree: Ban Case Two. Rationale: The act of using the term creates unacceptable risk of harm regardless of intent, due to current community norms. We flag the need for a review mechanism for meta-discussion, but default to removal."

  "Agreed," Elena said. She capped the marker. "But I'm keeping the semantic model in the design doc. It explains the negation data better."

  "And I'm keeping the use model in the policy doc," Marcus said, grabbing his notebook. "It leaves the door open for norm change."

  "As long as the classifier ships," Elena said, standing up.

  "As long as the classifier ships," Marcus agreed. He paused at the door. "Hey. If we find out the word behaves differently in a different grammatical structure... you'll update the model?"

  "If the data says the presupposition cancels," Elena said. "Yes. What about you? If the community stops flinching?"

  "Then I'll stop calling it a weapon," Marcus said. "But until then, it burns."

  They walked out together, leaving the whiteboard full of cases, the cold coffee sitting alone in the center of the table.
