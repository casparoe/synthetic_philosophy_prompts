          *   *Resolution:* They likely agree to ban based on impact, but disagree on *why*. Or they agree to ban because the *discussion* necessitates the harm. Let's have them agree to ban, but for different reasons, acknowledging the risk.
      *   *Check:* Substantive vs. Terminological.
