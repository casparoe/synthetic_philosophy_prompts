  7.  **Final Polish:** Ensure the voices sound distinct but equally competent. Elena should sound more formal/structural. Marcus should sound more contextual/functional. Ensure the "cold coffee" and "standup" details are present but not distracting.

  *(Self-Correction on Case 1 for Elena)*: If the meaning is encoded derogatorily, how does in-group use work? Standard semantic view (e.g., Potts) says expressive content is conventional. If I say "I'm not a [slur]", the slur still projects. But in-group reclamation changes the *expressive* value. Elena needs to argue that the *derogatory* component is indexed to out-group usage. Or, she admits reclamation changes the lexical entry for that community. Let's go with: The lexical entry contains a constraint on the speaker's relation to the target.
