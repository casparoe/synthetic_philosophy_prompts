          *   They need to acknowledge the overlap.

  5.  **Drafting the Dialogue (Iterative Process):**

      *   *Start:* Elena staring at the board. Marcus walking in.
      *   *Case 1:* Marcus says "Context clears it." Elena says "Identity licenses the expressive content."
      *   *Case 5:* Elena says "The word is radioactive." Marcus says "Who shot?" Elena: "The system." Marcus: "Then the system violated the norm."
