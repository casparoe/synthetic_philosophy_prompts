answer: |-
  ### I. The Desiderata for Operationalizing the Distinction

  Your draft list is philosophically robust but contains redundancies that obscure the operational bottlenecks. I have merged items where the underlying constraint is identical (e.g., *Grain* and *Shape* both demand binarity; *Invariance* and *Standpoint* both demand third-party objectivity). I have added two critical items specific to regulatory deployment (*Baseline Independence* and *Auditability*).

  Below is the refined specification.

  | # | Requirement | Case / Consideration | Status |
  | :--- | :--- | :--- | :--- |
  | **1** | **Objective Stability** (Merges your 1 & 6) | The classification must not depend on the observer's framing, the agent's internal perspective, or linguistic redescription. A regulator and the system must agree on the label based on public data. | **Non-negotiable** |
  | **2** | **Binary Enforceability** (Merges your 4 & 8) | The clause is a prohibition ("may not"), not a weighting function. The account must yield a bright line, not a scalar "worse than" judgment or a cost-benefit exchange rate. | **Non-negotiable** |
  | **3** | **Baseline Independence** (New) | The account cannot define "infliction" by referencing a prior normative entitlement (e.g., "A was entitled to the ventilator"). The spec *establishes* the entitlement; the distinction cannot presuppose it without circularity. | **Non-negotiable** |
  | **4** | **Causal Topology** (Refines your 2 & 10) | Must distinguish redirecting an existing threat (switching the trolley) from originating a new one (pushing the man), even when both occur via automation or intermediaries. | **Non-negotiable** |
  | **5** | **Temporal Scope** (Refines your 3 & 5) | Must handle preemption (disabling a safeguard) and epistemic updates (model improvement) without retroactively changing the moral classification of past actions. | **Non-negotiable** |
  | **6** | **Auditability** (New) | The features determining the classification must be logged. If the distinction relies on unobservable counterfactuals or internal dispositions, it cannot be enforced. | **Non-negotiable** |
  | **7** | **Distinctness** (Refines your 7 & 9) | Must not collapse into Intention (DDE) or Duty (Positive/Negative). If it collapses, the clause should use those terms directly. The distinction must do unique work. | **Negotiable** (Only if collapse yields a clearer spec) |
  | **8** | **Normative Vindication** (Refines your 9) | Must treat the distinction as tracking a moral reality, not merely explaining a psychological bias. A rule based on a known cognitive error is illegitimate. | **Non-negotiable** |

  **Notes on Modifications:**
  *   **Merged 1 & 6 (Objective Stability):** If a distinction is only available from the first-person standpoint, it fails *Invariance* for a third-party regulator. They are the same constraint.
  *   **Merged 4 & 8 (Binary Enforceability):** If the distinction only alters an exchange rate (scalar), it cannot support a binary prohibition. This is the same structural demand.
  *   **Added 3 (Baseline Independence):** This is the critical omission in your draft. Most philosophical accounts define "harm" as "making worse off than baseline." But in allocation, the baseline *is* the policy you are writing. You cannot use the distinction to write the policy if the distinction requires the policy to exist first.
  *   **Added 6 (Auditability):** A philosophical distinction that relies on unobservable causal facts or counterfactuals that cannot be reconstructed from logs is useless for an allocator spec.
  *   **Item 7 (Distinctness):** I mark this Negotiable. If the distinction collapses into "Intention," you should simply write a clause about Intent. However, if your goal is specifically to capture *causal* responsibility regardless of intent, this becomes Non-negotiable.

  ---

  ### II. Analysis of Joint Satisfiability

  **The Single Most Exclusionary Requirement:**
  **Binary Enforceability (#2).**
  Almost all sophisticated philosophical accounts of the act/omission distinction treat it as scalar (a difference in degree of responsibility) or context-dependent (shifting with costs and expectations). Very few accounts support a bright, context-invariant line that can be codified as a hard prohibition. This requirement excludes the majority of consequentialist and most nuanced deontological accounts immediately.

  **The Jointly Unsatisfiable Subset:**
  **{Objective Stability, Baseline Independence, Binary Enforceability}.**
  This triad creates a Euthyphro-style deadlock for your specific use case.
  1.  To achieve **Binary Enforceability**, you need a clear criterion for "infliction."
  2.  To achieve **Objective Stability**, that criterion must be factual (causal/physical), not normative.
  3.  However, purely factual/causal accounts (e.g., "moving matter vs. not moving matter") fail **Baseline Independence** because they cannot distinguish *redirecting* a threat from *originating* one without referencing a normative expectation of what would have happened otherwise (the baseline).
  4.  If you use a normative baseline to solve this, you violate **Baseline Independence** (circularity: you need the policy to define the act, but you need the act to define the policy).
  5.  If you use a counterfactual baseline (what would physically have happened), you violate **Auditability** (counterfactuals are often unprovable in logs) and **Objective Stability** (counterfactuals are sensitive to modeling granularity).

  **Identified Shibboleths:**
  *   **Normative Vindication (#8):** While important for moral philosophy, for a *spec*, you only need the distinction to be *stable*, not necessarily "real" in a metaphysical sense. If treating the distinction as real produces better compliance outcomes, the metaphysics is secondary. However, given your context (public accountability), I have kept it Non-negotiable because a rule admitted to be based on a "bias" will not survive public scrutiny.
  *   **Distinctness (#7):** This is often a philosopher's vanity requirement. If the distinction collapses into Intention, and Intention is easier to specify, the collapse is a feature, not a bug. However, since you specifically want to constrain *outcomes* regardless of intent, I have treated it as a functional requirement.

  **The Writable Substitute:**
  If the triad above is unsatisfiable (which I believe it is), you cannot write "The system may not inflict harm." You must replace the *ontological* distinction with a *procedural* or *scalar* one.

  *   **Option A (Scalar Risk Constraint):** "The system may not take actions that increase the aggregate probability of mortality above threshold $X$, weighted by causal proximity." (Abandons the doing/allowing binary for a risk budget).
  *   **Option B (Explicit Baseline Declaration):** "The system treats the status quo at $T_0$ as the normative baseline. Any deviation from the $T_0$ trajectory that results in death is classified as infliction." (Solves Baseline Independence by stipulating the baseline, but creates perverse incentives to freeze the status quo).
  *   **Option C (Procedural Constraint):** "The system may not execute actions classified as 'active termination' by the Audit Module, where 'active termination' is defined as [specific physical signal/valve closure/code path]." (Abandons moral philosophy for engineering definitions).

  **Recommendation:** Option C is the only one that satisfies Auditability and Binary Enforceability, though it sacrifices moral nuance. Option B is the only one that preserves the moral intent but risks paralysis.

  ---

  ### III. Assessment of Main Contenders

  **1. Causal Accounts (e.g., Foot, Thomson variants)**
  *   **Performance:** Fails **Baseline Independence** and **Causal Topology**.
  *   **Reasoning:** Purely causal accounts struggle to distinguish redirecting a threat (switching the trolley) from originating one without referencing a normative baseline of "what was happening anyway." In an allocator, the system is always intervening in a causal chain. Without a prior norm to define the "natural" course of events, every allocation looks like an intervention (a doing). They also often fail **Auditability** because causal chains in software/physiology are continuous, not discrete.

  **2. Duty-Based Accounts (Positive vs. Negative Duties)**
  *   **Performance:** Fails **Baseline Independence** catastrophically.
  *   **Reasoning:** This account defines omissions as violations of negative duties and acts as violations of positive duties (or vice versa). But your spec is *trying to write* the duties. You cannot define the act/omission distinction by referencing the duties, and then define the duties by referencing the act/omission distinction. This is circular in a regulatory context. It also fails **Binary Enforceability** because duties often conflict, requiring trade-offs the binary clause forbids.

  **3. Intention-Based Accounts (Doctrine of Double Effect)**
  *   **Performance:** Fails **Distinctness** and **Auditability**.
  *   **Reasoning:** This collapses the distinction into the agent's mental state (intended vs. foreseen). It violates your **Distinctness** requirement (it doesn't explain doing/allowing, it explains intending/accepting). More critically, it fails **Auditability**: an algorithm's "intent" is opaque or reducible to its objective function, which makes every optimized outcome "intended." It cannot support a third-party audit of the *action* independent of the *goal*.

  **4. Dispositional / Signalling Accounts**
  *   **Performance:** Fails **Objective Stability** and **Standpoint**.
  *   **Reasoning:** These accounts argue the distinction matters because it signals the agent's character or dispositions to the community. This is inherently third-party and observational, which sounds good, but it fails **Objective Stability** because the signal depends on the audience's interpretation, not the act itself. It also fails **Binary Enforceability**: dispositions are gradients, not binaries. You cannot code a prohibition against "signaling a bad disposition" without defining the signal, which returns you to the causal/baseline problems.

  **Summary:** No existing philosophical account satisfies the triad of **Objective Stability**, **Baseline Independence**, and **Binary Enforceability**. The causal accounts lack the norm; the duty accounts presuppose the norm; the intentional accounts lack the audit trail. To write this clause, you must stipulate a technical definition of "infliction" (Option C above) that likely diverges from the moral intuition you are trying to capture.
