answer: |-
  # HANDOUT: Sorting Minds by Selection Locus

  **Instructions:** Answer the following six questions about the system under observation. Record your Yes/No answers to generate a four-slot **Profile**. Use the Profile to assign a classification.

  ### The Decision Tree

  **Q1. Boundary:** To explain the system's competent behavior, must we include resources external to its biological or physical chassis (e.g., notebooks, servers, libraries) that are maintained across episodes?
  *   **Yes:** Classify the *Extended System* (Organism + Scaffolding).
  *   **No:** Classify the *Organism/Artifact Alone*.

  **Q2. Base Repertoire:** If deprived of lifetime learning and external resources, does the system retain a functional repertoire of responses?
  *   **Yes:** Proceed to Q3.
  *   **No:** Slot 1 is **Empty**. Proceed to Q4.

  **Q3. Source of Base:** Was that retained repertoire shaped by natural selection?
  *   **Yes:** Slot 1 is **Phylogenetic**.
  *   **No:** Slot 1 is **Designed**. (Includes engineered systems).

  **Q4. Lifetime Adaptation:** Does the system alter its behavior based on rewards or punishments encountered during its own operational lifetime?
  *   **Yes:** Slot 2 is **Somatic**.
  *   **No:** Slot 2 is **Fixed**.

  **Q5. Internal Testing:** Can the system reject a candidate action because it predicts a bad outcome *before* the action is physically executed?
  *   **Yes:** Slot 3 is **Vicarious**.
  *   **No:** Slot 3 is **Direct**.

  **Q6. Cultural Scaffolding:** Does the system utilize symbols or tools created by other minds to offload cognitive work it could not perform alone?
  *   **Yes:** Slot 4 is **Cultural**.
  *   **No:** Slot 4 is **Isolated**.

  ---

  ### Profile Mapping & Canonical Names

  Record your profile as **[Slot 1, Slot 2, Slot 3, Slot 4]**.

  | Profile Pattern | Canonical Name | Awkward Commitment |
  | :--- | :--- | :--- |
  | **[Phylogenetic, Fixed, Direct, Isolated]** | **Darwinian** | It commits you to calling the system mindless even if its behavior is exquisitely adaptive. |
  | **[Phylogenetic, Somatic, Direct, Isolated]** | **Skinnerian** | It commits you to denying the system any foresight, even if it appears to hesitate before acting. |
  | **[Phylogenetic, Somatic, Vicarious, Isolated]** | **Popperian** | It commits you to positing an internal model even if the "simulation" is just compressed behavioral history. |
  | **[Phylogenetic, Somatic, Vicarious, Cultural]** | **Gregorian** | It commits you to treating external symbols as literal parts of the cognitive machinery, not just inputs. |
  | **[Designed, Fixed, Direct, Isolated]** | **Artifact-Darwinian** | It commits you to treating human design as functionally identical to natural selection. |
  | **[Designed, Fixed, Vicarious, Cultural]** | **Artifact-Gregorian** | It commits you to granting cognitive status to systems that cannot learn or change their own weights. |
  | **[Empty, Somatic, Direct, Isolated]** | **Tabula Rasa** | It commits you to believing a system can learn without any initial structure to guide selection. |
  | **[Phylogenetic, Somatic, Vicarious, Cultural] (Extended)** | **Extended Gregorian** | It commits you to saying the notebook, not the brain, holds the belief. |

  *Note: Non-canonical combinations (e.g., Designed + Somatic) are named descriptively. If Q1=No but Q6=Yes, the system is Organism-Gregorian. If Q1=Yes and Q6=Yes, it is Extended-Gregorian.*

  ---

  ### Test Case Classifications

  | System | Profile | Confidence | Notes |
  | :--- | :--- | :--- | :--- |
  | **Foraging Honeybee** | [Phylo, Fixed, Direct, Isolated] | High | Waggle dance is instinctual signaling, not cultural tool use. |
  | **Jar-Opening Octopus** | [Phylo, Somatic, Direct, Isolated] | High | Trial-and-error without evidence of pre-execution simulation. |
  | **Ten-Month-Old Infant** | [Phylo, Somatic, Vicarious, Cultural] | Shaky | Vicarious/Cultural status emerging; depends on threshold for "symbol." |
  | **Late-Stage Dementia Patient** | [Phylo, Somatic, Direct, Isolated] | High | Procedural memory remains (Somatic), but executive simulation (Vicarious) is lost. |
  | **Chess Engine (Hand-written)** | [Designed, Fixed, Vicarious, Isolated] | High | Search is vicarious selection; weights are fixed by code. |
  | **Frozen LLM + Tools** | [Designed, Fixed, Vicarious, Cultural] | Shaky | "Vicarious" is token prediction; "Cultural" relies on provided docs. |
  | **Evolved Controller** | [Designed, Fixed, Direct, Isolated] | High | Selection happened in simulation, not on the deployed robot. |
  | **Robot Vacuum** | [Designed, Fixed, Direct, Isolated] | High | Bump-sensing is reactive, not predictive simulation. |
  | **Slime Mold** | [Phylo, Fixed, Direct, Isolated] | High | Physiological optimization without neural simulation. |
  | **Otto (w/ Notebook)** | [Phylo, Somatic, Vicarious, Cultural] | High | **Depends on Q1.** If Q1=Yes (Extended), he is Gregorian. If Q1=No (Organism), he is Popperian (cannot read). |

  ---

  ### Logically Possible but Empty Profiles

  | Profile | Status | Reason |
  | :--- | :--- | :--- |
  | **[Any, Fixed, Vicarious, Any]** | **Incoherent** | Internal simulation requires a model; models require prior learning (Somatic) or complex Design. A system with no learning and no complex design cannot simulate. |
  | **[Phylo, Fixed, Direct, Cultural]** | **Unfilled** | Natural selection rarely produces instinctual users of *culturally* manufactured tools without individual learning. |
  | **[Designed, Somatic, Direct, Cultural]** | **Unlooked** | Reinforcement learning agents using external tools exist but are rarely analyzed through this lens. |
  | **[Empty, Somatic, Vicarious, Any]** | **Incoherent** | Vicarious selection requires a substrate to run simulations on; a system with *no* base repertoire (Empty Slot 1) cannot host a simulator. |

  ---

  ### Ambiguity Warning

  **The Skinnerian/Popperian Boundary (Slot 2 vs. Slot 3):**
  This tree cannot reliably distinguish a rich history of reinforcement (Slot 2) from a genuine internal model (Slot 3). A system that has experienced every possible failure may *appear* to simulate outcomes before acting. If you observe "hesitation," you cannot know if it is running a simulation or retrieving a high-stakes memory. Treat Slot 3 as a hypothesis, not an observation.

  ### Does Question Order Matter?

  **Yes.** If Q1 (Boundary) is asked second, you may classify Otto as an Organism first (Q1=No), which forces Q6 (Cultural) to No (he can't read). He becomes Popperian. If Q1 is asked first, you classify Otto+Notebook as the system, making Q6 Yes. He becomes Gregorian. This sensitivity confirms that the taxonomy is not a strict hierarchy of biological complexity, but a set of relational choices about where you draw the cognitive boundary. The "Ladder" is a contingent fact about Earth, not a logical necessity.
