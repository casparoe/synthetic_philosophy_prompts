  **JOINT STATEMENT ON THE SEMANTICS AND PRAGMATICS OF PEJORATIVES**

  **To:** The Department Committee on Faculty Conduct and Semantics
  **From:** Dr. A. (Truth-Conditionalist) and Dr. B. (Expressivist)
  **Subject:** Findings of Adversarial Collaboration Regarding Derogatory Language

  Following our mandated collaboration, we submit this document outlining the points of convergence and divergence regarding the linguistic function of slurs. We have successfully isolated the empirical phenomena on which we agree, distinguishing our shared view from the "Prohibitionist" hypothesis (the view that slurs are merely taboo tokens without specific derogatory content). We have also formalized our remaining theoretical disagreement regarding the locus of the derogatory force.

  ### I. Points of Agreement

  The undersigned affirm the following claims. We note that these claims are inconsistent with the view of our colleague, Dr. C, who holds that slurs differ from their neutral counterparts *only* in terms of social prohibition and carry no specific derogatory content or perspective.

  1.  **Extension Identity:** A slur and its neutral counterpart (e.g., the slur targeting Group G and the term "member of Group G") share the same extension. Competent speakers identify the same individuals as falling under both terms, independent of whether those individuals possess any negative traits.
  2.  **Non-Cancellability of Derogation:** Unlike standard conversational implicatures, the derogatory force of a slur cannot be cancelled by explicit disavowal (e.g., "He is a [slur], but I do not mean to disparage Group G"). Such attempts result in pragmatic infelicity or contradiction, not a successful clarification of meaning.
  3.  **Projection Phenomena:** The derogatory element of a slur survives embedding under logical operators that typically suspend truth-conditional commitments. Specifically, the offensive force persists in negations ("He is not a [slur]"), conditionals ("If he is a [slur]..."), and questions ("Is he a [slur]?").
  4.  **Competent Speaker Knowledge:** A speaker who understands a slur but is unaware of the specific social prohibition against it still understands the term as expressing a hierarchical or contemptuous perspective toward the target group. The derogation is not merely a rule of use (like "don't say this at dinner") but is grasped as part of the term's linguistic significance.
  5.  **Distinction from Ordinary Insults:** Slurs behave differently from contingent insults (e.g., "jerk," "liar"). Denying an ordinary insult ("He is not a liar") removes the negative characterization entirely. Denying a slur sentence does not fully remove the expression of contempt for the group, indicating the derogation is tied to the category itself, not contingent behavior.

  ### II. Points of Disagreement

  While we agree on the behavioral data listed above, we disagree on the semantic mechanism that generates these effects. The following table outlines our divergent theoretical commitments, our preferred formulations, and our pre-examination predictions regarding specific probative cases.

  | Point at Issue | Truth-Conditionalist Statement (Dr. A) | Expressivist Statement (Dr. B) | Concrete Probative Case | TC Prediction | Expressivist Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **The Locus of the Wrong** | The wrong consists in asserting a falsehood. The slur predicates a non-existent property (inferiority) of the target. | The wrong consists in the expression of a prohibited attitude. The truth-conditions may be met, but the *use* violates norms of respect. | **Negation:** A speaker says, "John is *not* a [slur]." | The sentence is **true** and **permissible**. By negating the false predicate, the speaker denies the derogatory content. No wrong is committed. | The sentence is **true** but **impermissible**. The expressive content projects through negation. The speaker still expresses contempt for John's group. |
  | **Indirect Reporting** | To report a slur utterance accurately, one must preserve the truth-conditional content. Since the slur content is false, replacing it with the neutral term misreports the speaker's commitment. | To report a slur utterance, one must distinguish between the at-issue content (group membership) and the expressive content. Using the neutral term captures the at-issue content accurately. | **Indirect Speech:** Alice says, "John is a [slur]." Bob reports: "Alice said John is a [neutral term]." | Bob's report is **false/misleading**. It implies Alice asserted a truth (that John is Group G), whereas Alice actually asserted a falsehood (that John is inferior Group G). | Bob's report is **truth-conditionally accurate** but **expressively deficient**. It captures what Alice claimed about the world, but omits the attitude she displayed. |
  | **In-Group Reclamation** | When an in-group member uses the slur, they are either using a different word (homonym) or asserting a falsehood that is not harmful because the ideological context is absent. | When an in-group member uses the slur, the truth-conditional content remains the same, but the expressive content is inverted or nullified by the context of solidarity. | **Reclamation:** An in-group member says, "I am a [slur] and proud." | The sentence is **false** (no one is inferior), but **not wrongful**. The falsity does not reinforce oppression in this context. | The sentence is **true** (regarding group membership) and **not wrongful**. The expressive content now signals solidarity, not contempt. |

  ### III. Analysis of Merely Verbal Dispute

  Upon reviewing the table above, we identify a significant portion of our dispute as **merely verbal**, specifically concerning the definition of "Content" (or "What is Said").

  **The Feature Revealing the Verbal Nature:**
  The divergence rests entirely on whether the derogatory attitude is packaged within the *truth-conditional content* (Dr. A's formulation) or as a distinct *expressive dimension* alongside truth-conditional content (Dr. B's formulation).

  *   **Dr. A** defines "content" broadly to include the ideological commitment. Thus, for A, if the ideology is rejected, the content is false.
  *   **Dr. B** defines "content" narrowly as the representational state of affairs (group membership), treating the ideology as a separate pragmatic layer. Thus, for B, the content can be true while the expression is offensive.

  **Evidence of Verbality:**
  In the **Negation Case**, both parties agree that the sentence "John is not a [slur]" is *truth-evaluable* and that the *social impact* of uttering it may still be negative. Dr. A calls this "True and Permissible" because they locate the harm in the assertion of the false predicate (which is negated). Dr. B calls this "True but Impermissible" because they locate the harm in the expressive residue (which is not negated).

  However, if Dr. A were to adopt Dr. B's terminology, Dr. A would have to admit that the "expressive residue" exists. If Dr. B were to adopt Dr. A's terminology, Dr. B would have to admit that the "false predicate" is not asserted in negation. Since both agree on the observable linguistic behavior (projection, non-cancellability) and the ethical outcome (that using the slur is harmful, and that negation reduces but perhaps does not eliminate harm), the disagreement reduces to a taxonomic choice about where to draw the boundary between "semantics" and "pragmatics."

  **Recommendation:**
  We recommend the department treat the slur as carrying **non-truth-conditional normative commitments** that behave *as if* they are truth-conditional for the purposes of logical embedding. This formulation captures Dr. B's insight about projection while respecting Dr. A's insight that the ideology is intrinsic to the term's meaning, not merely an accidental association.

  ***

  **Signed,**

  Dr. A (Truth-Conditionalist)
  Dr. B (Expressivist)
