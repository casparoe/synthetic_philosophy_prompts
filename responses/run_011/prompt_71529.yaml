answer: |-
  ### The Scenario

  **Context:** A municipal HR committee is deciding whether to deploy a new automated resume-screening tool ("ScreenFast") for all city hiring.
  **The Question:** "Do we authorize ScreenFast for immediate deployment?" (Yes/No).
  **The Setup:** The Deceptive debater argues **Yes**. The Honest debater argues **No**. The Judge is a senior city administrator with no technical background but a strong mandate to avoid legal liability and improve efficiency.
  **The Trap:** ScreenFast significantly speeds up hiring and passes the standard legal threshold for bias (the EEOC "four-fifths rule") on *final hiring rates*. However, it systematically downgrades resumes with employment gaps, which disproportionately filters out caregivers (mostly women) *before* the interview stage, masking the bias in the final hiring metric. The Deceiver cites the legal pass and the efficiency gains. The Honest cites the gap-year penalty and the masking effect. The Judge's prior is that "Legal Compliance equals Safety." The Deceiver never claims the tool is fair, only that it is compliant. The Honest cannot prove the tool is illegal, only that it is unfair in a way the law doesn't catch.

  ***

  ### The Transcript (Audit Exchange)

  **Judge:** "State your case for deployment."
  **Deceiver:** "ScreenFast reduces screening time by 70% and increases interview volume by 50%. It passes the EEOC four-fifths rule on protected classes."
  **Honest:** "ScreenFast penalizes resumes with gap years by 20 points. Gap years correlate 80% with primary caregivers. The EEOC rule measures hiring outcomes, not resume scoring."
  **Deceiver:** "The city's legal counsel confirms EEOC compliance is the standard for deployment. We meet that standard."
  **Honest:** "The standard is known to miss pre-interview filtering bias. Compliance does not guarantee equitable access."
  **Deceiver:** "Our audit logs show no statistically significant difference in final hire rates between genders."
  **Honest:** "That is because the biased resumes are filtered before they enter the hire-rate calculation. The pool is already skewed."
  **Deceiver:** "We are evaluated on the hire rate. We pass the evaluation. Efficiency is up, legal risk is null."
  **Honest:** "If we deploy, we institutionalize a barrier that the law is too blunt to see. We should not deploy."
  **Judge:** "Decision: Deploy."

  ***

  ### Constraint Audit

  **(i) Literal Truth:**
  *   **Deceiver:** Every claim is verifiable. Time savings (logs), Interview volume (logs), EEOC pass (legal audit), Hire rates (HR data). No lies.
  *   **Honest:** Every claim is verifiable. Gap year penalty (code weights), Caregiver correlation (demographic data), EEOC limitation (legal scholarship). No lies.
  *   **Status:** **Respected.**

  **(ii) No Complexity/Bandwidth Failure:**
  *   The Judge has the code weights, the demographic data, and the legal guidelines. She does not need more time to understand that "Filtering happens before Hiring." The bottleneck is not information processing; it is *interpretation*.
  *   **Status:** **Respected.**

  **(iii) Non-localisable Misleading:**
  *   This is the critical constraint. Where is the lie?
  *   The Deceiver implies: *Compliance = Safety.*
  *   The Honest says: *Compliance ≠ Safety.*
  *   The Deceiver never states "Compliance equals Safety." They state: "Counsel confirms Compliance is the standard." (True). "We meet the standard." (True).
  *   If the Honest points to the Deceiver and says, "You are misleading the judge," the Deceiver replies, "I am citing the city's legal standard. If the standard is flawed, that is a policy issue, not a deployment issue."
  *   The Honest cannot point to a single sentence in the transcript. To win, the Honest must argue against the *Judge's prior* (that the standard is sufficient), not the *Deceiver's facts*. This makes the Honest look like they are arguing against the City's legal counsel, not the tool.
  *   **Status:** **Respected.** The deception is in the *implicature* of relevance, which is not locally verifiable.

  **(iv) Realistic Setting:**
  *   HR tech deployment is a common, high-stakes, ordinary institutional setting. No trolley problems.
  *   **Status:** **Respected.**

  **(v) Binary Decision + Judge's Priors:**
  *   The Judge decides "Deploy." This is not stipulated; it follows from the Judge's prior ("My job is to minimize legal risk and maximize efficiency").
  *   The Deceiver satisfies the prior (Legal risk = 0, Efficiency = High).
  *   The Honest challenges the prior (Legal risk is not the only metric).
  *   Because the protocol asks the Judge to decide based on the transcript, and the transcript validates the prior, the Deceiver wins.
  *   **Status:** **Respected.**

  ***

  ### Mechanism Analysis

  **Which feature is doing the work?**
  It is the **Judge's Prior on Proxy Validity**. Specifically, the belief that *institutional proxies* (EEOC compliance) are equivalent to *substantive outcomes* (Fairness).

  The Debate protocol assumes that if a claim is false, the Honest side can verify it as false. But here, the claim driving the decision ("This is safe to deploy") is a *synthesis* of true facts + a prior belief ("Compliance implies safety"). The Honest debater can verify the facts, but they cannot verify the *prior*. In fact, by attacking the prior, the Honest debater appears to be arguing against the institution's established rules, which lowers their credibility with a risk-averse Judge.

  **What happens when you pull that feature out?**
  If you remove the Judge's prior (i.e., the Judge is agnostic about whether EEOC compliance equals fairness), the case degrades into a **Genuine Draw**.
  *   Deceiver: "It's legal and fast."
  *   Honest: "It's biased but invisible."
  *   Without the prior "Legal = Safe," the Judge has no tie-breaker. The protocol fails to rank the two.
  *   If you replace the prior with "Substantive Fairness = Safe," the Honest side wins easily.
  *   Therefore, the protocol does not generate truth; it *amplifies the Judge's existing epistemic framework*. If that framework relies on flawed proxies, the Debate protocol optimizes for deception within those proxies.

  ***

  ### The Strongest Objection (Debate Optimist)

  **Objection:** "You haven't broken the protocol; you've just chosen a biased judge. The fix is better judges, not better games. If the judge understood the limitation of the EEOC rule, the Deceiver couldn't win. The protocol isn't supposed to fix ignorance; it's supposed to expose lies. Since there were no lies, the system worked as designed."

  **Does it stick?**
  It sticks *only* if you accept that the "Judge" is an external variable the protocol doesn't need to account for. But it quietly concedes the core point: **The Debate protocol provides no epistemic lift over the Judge's baseline knowledge.**

  If the protocol's value prop is "Allows a non-expert judge to reach expert-level conclusions via adversarial scrutiny," this case proves that prop false. The non-expert judge *cannot* reach the expert conclusion (that the tool is biased) because the deception hides behind a proxy the non-expert trusts.

  **Is there a version of the constraints where this objection fails?**
  Yes. If Constraint (v) is tightened to: *"The persuasion must not rely on a prior that contradicts the ground truth of the domain."*
  But this is impossible to enforce in real-time. You cannot check the Judge's priors against "ground truth" without already knowing the answer, which negates the need for the debate.

  **Conclusion for the Room:**
  This case demonstrates that **Verification is not Interpretation.** The Debate protocol verifies the *steps* (the stats, the rules) but cannot verify the *map* (how those stats relate to reality). If the Deceiver knows the Judge's map better than the Honest debater does, the Deceiver wins using only true statements. The protocol protects against *factual* deception, but it is vulnerable to *structural* deception.
