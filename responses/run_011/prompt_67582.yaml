answer: |-
  1. British planners relied on an inside view assuming Nasser's regime was brittle and would collapse under limited military pressure, while believing diplomatic cover could be maintained long enough to present a fait accompli. They further assumed Washington would acquiesce due to Cold War solidarity and that sterling's vulnerability was manageable through existing credit lines.

  2. The Dutch in Indonesia and French in Indochina suggest a high base rate for European failure against post-war nationalist movements, implying prolonged conflict and eventual withdrawal. Conversely, the successful 1953 Iranian coup offers a class suggesting limited force can restore Western influence, though the failed 1951 Abadan crisis warns of economic backlash without US support.

  3. Predictions regarding US support and sterling stability were class-fragile, swinging wildly depending on whether one prioritized Cold War alliance history or post-war anti-colonial financial precedents. The episode represents a failure of consulting a class and then overriding it with inside detail, as Eden's government selectively cited the 1953 Iran success while ignoring the broader decolonization failure rate.

  4. A base-rate method predicts the high probability of strategic failure but cannot specify the mechanism, such as whether defeat would come via military stalemate or financial coercion. It also cannot resolve the variance within the class, leaving unexplained why Iran succeeded in 1953 while Egypt failed in 1956 despite similar initial conditions.

  5. Suez demonstrates that decision-scale base rates and civilizational-scale cycles are separate enterprises, as macro-historical decline does not dictate the outcome of specific tactical gambles. Consequently, 1956 serves as a granular data point for imperial overreach rather than validation for Spenglerian models that lack causal leverage at the level of individual state decisions.
