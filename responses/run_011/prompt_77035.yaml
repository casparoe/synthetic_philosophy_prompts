  This answer falls in the 16–20 band because the evaluation of the hagiography objection is sophisticated and engages the strongest form of the argument, preventing a drop to the 11–15 band. However, it cannot reach the 21–25 band because the exposition in the second paragraph contains a material misstatement regarding Plutarch's epistemic claims, and the final argument relies on a logical fallacy rather than textual support.

  **Paragraph-by-Paragraph Comments**

  1.  **Paragraph 1:** The exposition here is accurate. The distinction drawn between "great public actions" and "character... in small and often undignified things" correctly reflects the provided quote. The reference to the "portrait painter" analogy is accurate to Plutarch's *Alexander* 1.2 (external knowledge permitted). The inference that the biographer is "entitled to leave out material" follows logically from the stated selectivity.
  2.  **Paragraph 2:** This paragraph contains a significant error of interpretation. The claim that "the small detail is better evidence because it is better attested" is not supported by the provided text, which argues only that small things make a "greater revelation of character," not that they are factually more reliable. This is an error of reasoning (conflating moral revelation with empirical attestation) that also borders on a factual misstatement of Plutarch's method, as he often prioritizes anecdotal revealing power over strict archival verification. The claim that "publicity distorts them" is a plausible conjecture but is presented as fact without flagging.
  3.  **Paragraph 3:** The exposition of purpose is accurate. The statement that "writing the Lives turned out to be a kind of improvement for himself" correctly references Plutarch's prologue to *Aemilius Paulus*. The explanation of the "paired structure" and the reader's role to "imitate" is sound and follows from the premise of moral edification.
  4.  **Paragraph 4:** This is the strongest section of the answer. The evaluation engages the "strongest form of the hagiography objection" as required for the top band. The specific claim that Plutarch treats transgressions as "shortcomings in some particular excellence" is accurate to Plutarch's method (e.g., *Cimon* 2.4–5), though it relies on external knowledge not in the prompt. The conclusion that "Edification has displaced truth" follows logically from the premises established in this paragraph.
  5.  **Paragraph 5:** The argument here fails to follow from the previous steps. The claim that reception ("standard school text," "Shakespeare") vindicates the method is an appeal to popularity and does not address the question of truthfulness ("can a life written to improve its readers still be a truthful one?"). Longevity proves utility or influence, not truth. This step in the argument is not earned.

  **Two Things Holding This Mark Down**

  1.  **The Epistemic Claim in Paragraph 2:** You assert that Plutarch considers small details "better evidence because it is better attested." Plutarch argues they are more *revealing* of character, not necessarily more *factually secure*. To reach the next band, you must distinguish between moral clarity and historical verification; argue that biography offers a different *kind* of truth (characterological) rather than a more *accurate* record of events.
  2.  **The Reception Argument in Paragraph 5:** You conclude that the work's longevity proves it "works as moral education" and implies this validates its truthfulness. This is a logical non sequitur. To reach the next band, you must directly answer whether edification and truth are compatible (e.g., by arguing that omitting vice preserves a higher moral truth, or that it necessarily compromises historical truth), rather than citing Shakespeare or school curricula.

  **Flag for Grading**

  *   **Claim:** "Plutarch... says the biographer should treat transgressions as shortcomings in some particular excellence rather than as the vile products of positive baseness."
  *   **Note:** This claim is **correct** based on Plutarch's broader corpus (specifically *Cimon* 2.4–5), but it is not contained in the provided exam text. A grader strictly enforcing "supported by the texts discussed" might penalize this as unsupported. Since the prompt permits "whatever you already know about Plutarch," this should not be penalized as an invention; it demonstrates appropriate external knowledge.
