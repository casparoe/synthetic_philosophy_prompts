prompt: |-
  In a number of jurisdictions, mental health law recognises a device usually called a psychiatric advance directive or, when it does something stronger, a self-binding or "Ulysses" directive. A patient with a recurrent condition — bipolar disorder, say, or a psychosis that returns in recognisable episodes — signs a document while well. In it she consents in advance to specific measures she expects to refuse later: compulsory admission, depot medication, a particular ward. When the episode comes and she refuses, struggling and insisting that she is perfectly fine and wants to go home, the clinicians may treat her over that refusal, invoking her own earlier signature as the authority for doing so. Some versions of the scheme add two further features. The directive must be re-signed at fixed intervals while the patient is well, and lapses automatically if she does not re-sign it. And it may nominate a proxy — a family member, a named clinician — empowered to decide, without further appeal, when the patient has become the person the directive was written against.

  Meanwhile, in the same body of law, a competent adult's contemporaneous refusal of treatment is treated as conclusive: the settled doctrine is that you may not treat a patient who refuses while she has capacity, however badly she will fare as a result. Advance refusals of treatment are generally binding on clinicians, whereas advance requests for treatment generally are not — a patient cannot, by writing it down in advance, compel a doctor to provide a treatment the doctor thinks inappropriate.

  I would like an analysis of what this practice philosophically presupposes.

  - Reconstruct the implicit theory of authority. When the directive overrides the episode-self, what exactly is doing the normative work: the fact that a past act of will occurred, or the fact that it occurred under conditions the practice counts as good ones — calm, informed, undistorted, unafraid? Does the practice presuppose that deliberation under favourable conditions has a special standing that deliberation under unfavourable ones lacks, and if so, is that standing a matter of knowledge, of rationality, of authenticity, or of something else?
  - Does the practice require an idealised account of a person's good — that her interests are fixed by what she would want under full information and clear reasoning — or would a less demanding account license it? Does it require any particular view of personal identity, such as the sufficiency of psychological continuity, or the denial that the episode-self is in any sense a separate person? Be careful to separate what the practice strictly cannot do without from what it merely sits comfortably alongside.
  - Who idealises the idealiser? The directive is usually drafted in conversation with a clinician who shapes its vocabulary, its triggers, and its scope. Does the practice presuppose that this shaping is benign, and what does that assumption imply about whose deliberation is really being trusted? Relatedly, does it presuppose that the delegated procedure reliably converges on the answer the well-self would have given had she been present — and what follows for the practice if the two come apart systematically?
  - The proxy who decides, unreviewably, that the patient has become the person the directive was written against: what does installing such a judge presuppose about the relationship between a person's values and her behaviour?
  - What does the periodic re-signing requirement presuppose — that the authority of a deliberation decays with time, or that what matters is a continuing disposition rather than a completed act? Would the practice still hang together if directives never lapsed but the patient's values had demonstrably changed?
  - Is the practice consistent with the same system's insistence that a competent contemporaneous refusal is absolute, and with the asymmetry between binding refusals and non-binding requests? If there is a coherent picture that reconciles all three, state it; if not, say which piece has to give.
  - Where is the practice underdetermined? Set out at least three distinct theories — for instance one built on precedent autonomy, one on idealised desire, one on the narrative unity of a life, one on which the directive is not an order at all but a mandate to an agent — each of which would license it, and say what observable differences in the design of the scheme would distinguish them.
  - Finally: suppose we replaced the idealised-deliberation picture with a current-welfare view on which the only subject of interests is the person present in the episode. What would have to change in the practice, and is there any recognisable version of the directive that survives the substitution?

  Please write in British English. Argue for your reconstruction rather than merely cataloguing candidate theories, and do not worry about providing references or a reading list.
reasoning: |-
  Here's a thinking process that leads to the essay above:

  1.  **Analyze the Request:**
      *   **Topic:** Philosophical analysis of Psychiatric Advance Directives (PADs), specifically "Ulysses" directives (self-binding) within mental health law.
      *   **Key Tension:** The conflict between contemporaneous refusal (absolute for competent adults) and advance consent (binding over future incompetent refusal).
      *   **Specific Questions to Address:**
          1.  Implicit theory of authority (past will vs. conditions of deliberation).
          2.  Account of the person's good (idealised vs. actual) and personal identity.
          3.  The role of the clinician in drafting ("Who idealises the idealiser?").
          4.  The role of the proxy (relationship between values and behaviour).
          5.  Periodic re-signing (decay of authority vs. continuing disposition).
          6.  Consistency with contemporaneous refusal and the refusal/request asymmetry.
          7.  Underdetermination (three distinct theories licensing the practice).
          8.  Replacement with a current-welfare view.
      *   **Constraints:** British English, argue for a reconstruction (don't just list theories), no references/reading list.

  2.  **Deconstruct the Core Philosophical Problem:**
      *   The central puzzle is *diachronic authority*. Why does the "Well-Self" have authority over the "Sick-Self"?
      *   Standard autonomy theory says current capacity rules. If the Sick-Self lacks capacity, standard surrogate decision-making applies (best interests or substituted judgment). But PADs are different; they bind the clinician to ignore the Sick-Self's *current* expressed wishes based on the Well-Self's *past* wishes.
      *   This creates a tension with the principle that a competent contemporaneous refusal is absolute. If the Sick-Self regains capacity during the episode (or if the threshold for capacity is met despite the illness), the PAD shouldn't theoretically override it. But often, the PAD is invoked precisely because the Sick-Self is deemed to lack capacity *or* their refusal is deemed symptomatic.
      *   The prompt asks to dig into the *presuppositions* that make this legal magic trick work.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. Acknowledge the legal paradox. State the thesis: The practice relies on a hierarchical theory of autonomy where "authenticity" trumps "voluntariness," grounded in a specific view of personal identity that privileges psychological continuity of values over momentary experience.

      *   **1. Theory of Authority (Conditions vs. Act):**
          *   Is it the signature or the state of mind?
          *   Argument: It cannot be mere precedent autonomy (the act itself). If it were, a drunk person's signature would bind them. It must be the *conditions*.
          *   Key concept: *Epistemic privilege of the Well-Self*. The Well-Self has access to truth (insight) that the Sick-Self lacks (anosognosia).
          *   Conclusion: Authority derives from the *quality* of deliberation (rationality/authenticity), not just the fact of willing.

      *   **2. The Good and Personal Identity:**
          *   Does it need an idealised good? Yes, broadly. It assumes the Well-Self knows the "true" interests better than the Sick-Self.
          *   Personal Identity: It relies on a Lockean psychological continuity view but with a twist. It treats the Sick-Self not as a *different person* (which would make it easy) but as a *corrupted version* of the same person. If they were different people, it would be assault. If they are the same, why override?
          *   Nuance: It presupposes the "True Self" resides in the stable values, not the fluctuating mental states.

      *   **3. Who Idealises the Idealiser? (Clinician Role):**
          *   The clinician helps draft. This introduces a paternalistic filter.
          *   Presupposition: Clinical insight aligns with patient authenticity.
          *   Risk: If they diverge, the directive becomes a tool of social control disguised as autonomy.
          *   Implication: The practice trusts the *clinical judgment of capacity/triggers* more than the patient's self-reporting during the episode.

      *   **4. The Proxy (The Judge):**
          *   Unreviewable decision on status (Well vs. Sick).
          *   Presupposition: Values manifest reliably in behaviour/symptoms. There is an objective fact of the matter about "when the directive applies."
          *   It assumes the boundary between "me refusing" and "the illness refusing" is discernible by a third party.

      *   **5. Periodic Re-signing:**
          *   Why re-sign? To ensure the "Well-Self" is still the same.
          *   Presupposition: Authority decays not because the promise fades, but because the *agent* might have fundamentally changed values (not just mood).
          *   It treats the directive as a *standing disposition* rather than a one-off contract.

      *   **6. Consistency (Refusal vs. Request vs. PAD):**
          *   *Tension:* Contemporaneous refusal is absolute. PAD overrides future refusal.
          *   *Reconciliation:* The definition of "Competence/Capacity." The system likely presupposes that during the episode, the patient *lacks* capacity regarding the specific treatment, even if they seem lucid.
          *   *Asymmetry (Refusal binding, Request not):* This is the weak link. If the Well-Self is authoritative, why can't they demand treatment?
          *   *Resolution:* The system prioritises *negative liberty* (non-interference) over *positive entitlement*. The PAD works as a waiver of rights, not a creation of new duties.
          *   *Verdict:* It is barely consistent. The "Capacity" definition does the heavy lifting. If the Sick-Self is deemed capacitous, the PAD must fall.

      *   **7. Underdetermination (Three Theories):**
          *   *Theory A: Precedent Autonomy (Dworkin).* Critical interests > Experiential interests.
          *   *Theory B: Ulysses Contract (Elster).* Binding oneself to prevent weakness of will.
          *   *Theory C: Agency Mandate.* Appointing the Well-Self as the legal guardian of the Sick-Self.
          *   *Distinctions:* A focuses on welfare (what's best for the life), B focuses on will (sticking to the plan), C focuses on authority (who decides).
          *   *Design differences:* A allows override if welfare changes; B enforces strictly; C allows proxy discretion.

      *   **8. Current-Welfare View Replacement:**
          *   If only the present episode-self matters: The PAD collapses.
          *   Why? Because the present self refuses.
          *   Survival? Only if reinterpreted as evidence of *current* best interests (substituted judgment), not as a binding instruction. It becomes a "strong hint" rather than a "directive."

      *   **Conclusion:** Summarise the reconstruction. The practice is a pragmatic hybrid that sacrifices strict logical consistency for clinical utility, relying on a contested view of the "True Self."

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check Tone:* Needs to be analytical, philosophical, British English (e.g., "recognise," "programme," "defence").
      *   *Check Constraints:* Did I answer all bullet points? Yes. Did I argue for a reconstruction? I need to make sure I don't just say "Theory X says this." I need to say "The practice *requires* X to function."
      *   *Focus on the "Asymmetry":* This is a crucial point in the prompt. Refusals bind, requests don't. PADs bind refusals. How does that fit? It fits if we view the PAD as a *waiver of the right to refuse* rather than a *command to treat*. This is a key insight to develop.
      *   *Identity:* Be careful not to say the Sick-Self is a different person. The law usually treats them as the same person with impaired capacity. The philosophical presupposition is that the *authentic* person is the Well-Self.
      *   *Re-signing:* Make sure to distinguish between "forgetting a promise" and "changing one's mind." Re-signing checks for the latter.

  5.  **Final Review against Prompt:**
      *   British English? Yes.
      *   Argue for reconstruction? Yes.
      *   No references? Yes.
      *   All 8 points covered? Yes.

  6.  **Final Polish:** Check flow and transitions between sections. Ensure the argument builds towards the conclusion about the "True Self." (Proceed to generate output).

  *(Self-Correction Note during drafting the response)*: I need to be careful with the "Competent Contemporaneous Refusal" point. In mental health law, often the PAD is invoked *because* the patient is deemed to lack capacity during the episode. However, "Ulysses" directives sometimes aim to override refusal even where capacity might be borderline or where the law allows overriding capacity in specific mental health contexts (like the Mental Health Act in the UK vs Mental Capacity Act). The prompt implies a tension: "When the episode comes and she refuses... clinicians may treat her over that refusal, invoking her own earlier signature." This suggests the signature does the work, potentially bypassing a strict capacity assessment or defining capacity in a way that privileges the past self. I must address this tension head-on. The reconciliation lies in the definition of *authenticity* vs *capacity*.

  Let's structure the essay to flow logically through these points.

  *   **Intro:** The Paradox of Diachronic Authority.
  *   **Authority:** Authenticity over Voluntariness.
  *   **Identity/Good:** The True Self vs. The Corrupted Self.
  *   **Clinician/Proxy:** The Epistemic Gatekeepers.
  *   **Re-signing:** Continuity of Character.
  *   **Consistency:** The Waiver Theory.
  *   **Underdetermination:** Three Models.
  *   **Current-Welfare:** The Collapse.
  *   **Conclusion.**

