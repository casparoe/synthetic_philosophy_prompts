answer: |-
  The legal architecture surrounding psychiatric advance directives (PADs), and specifically the 'Ulysses' variant, presents a profound philosophical puzzle. It permits a past self to bind a future self in circumstances where, under normal medical law, a present self's refusal would be absolute. To understand how this practice functions without collapsing into incoherence or paternalism, we must reconstruct the implicit normative theory that underpins it. The practice is not merely a procedural convenience; it rests on a specific, contestable metaphysics of the person and a hierarchical theory of autonomy.

  **The Theory of Authority: Authenticity over Voluntariness**

  When a directive overrides the refusal of the episode-self, what normative work is being performed? It cannot be the mere fact of a past act of will. If authority rested solely on the historical fact of signing, a directive signed under duress, intoxication, or ignorance would hold equal weight to one signed in clarity. The practice therefore presupposes that the *conditions* of the deliberation confer authority.

  The implicit theory is one of **epistemic privilege grounded in authenticity**. The practice assumes that deliberation under favourable conditions (calm, informed, unafraid) accesses a 'truer' set of interests than deliberation under the distortion of psychosis or mania. This is not merely a matter of knowledge (knowing the side effects of medication) but of rationality and authenticity. The Well-Self is presumed to possess insight into the condition that the Sick-Self, by definition of the episode, lacks. Thus, the normative force of the directive does not derive from precedent autonomy alone (the right to bind one's future), but from the superior *quality* of the agency exercised at the time of signing. The practice presupposes that autonomy is not a flat landscape where every voluntary choice is equal; rather, it is stratified. Choices made in alignment with stable values and full insight possess a higher normative rank than choices made under the 'tyranny' of symptoms. The authority is not that of a past commander, but of a more authentic version of the same agent.

  **The Good and Personal Identity**

  Does this require an idealised account of the person's good? Yes, but a specific kind. It does not necessarily require a Platonic form of the Good, but it does require a **counterfactual stability condition**. The practice assumes that the patient's 'true' interests are fixed by what she would want under full information and clear reasoning. The Sick-Self's desires are treated as noise; the Well-Self's desires are treated as signal.

  Regarding personal identity, the practice navigates a delicate middle path. It cannot treat the Sick-Self as a wholly different person, for then enforcing the directive would be akin to assaulting a stranger based on a contract signed by someone else. Nor can it treat the Sick-Self as fully identical to the Well-Self in terms of moral standing, for then the contemporaneous refusal would override the past instruction.

  The practice presupposes a **Lockean psychological continuity view modified by a hierarchy of mental states**. It assumes that personal identity is maintained through psychological connections, but that some connections (stable values, long-term projects) are constitutive of the person in a way that others (fleeting moods, delusional beliefs) are not. The Sick-Self is not a separate person, but a *corrupted* iteration of the same person. The directive is licensed by the view that the 'person' is properly located in the stable psychological architecture, not in the transient phenomenological experience. If one were to deny this—arguing that the experiencing self of the moment is the only locus of moral worth—the practice would become indefensible.

  **Who Idealises the Idealiser?**

  The involvement of the clinician in drafting the directive introduces a critical vulnerability. The practice presupposes that this shaping is **benign and epistemically aligned** with the patient's authentic will. It assumes the clinician acts as a scribe for the Well-Self, not an architect of the Sick-Self's confinement.

  However, this implies that the deliberation being trusted is a hybrid one. It is not purely the patient's will, but a co-constructed narrative. If the clinician's vocabulary shapes the triggers (e.g., defining 'relapse' by clinical markers rather than patient experience), the practice presupposes that clinical objectivity is a better tracker of the patient's 'true' condition than the patient's own introspection. If the two come apart systematically—if clinicians consistently interpret triggers more broadly than the patient intended—the practice ceases to be an instrument of autonomy and becomes a mechanism of institutional control. For the practice to remain coherent, it must presuppose that the delegated procedure (clinical judgment) reliably converges on the answer the Well-Self would have given. If this convergence fails, the 'authority' of the directive is revealed to be the authority of the profession, not the patient.

  **The Proxy and the Manifestation of Values**

  The appointment of a proxy with unreviewable power to decide when the directive is triggered presupposes a **realist view of mental states**. It assumes that the boundary between 'the patient refusing' and 'the illness refusing' is an objective fact that can be discerned by a third party.

  This installs a judge who can look at behaviour and determine the underlying value structure. It presupposes that a person's values are not opaque but are legible in their presentation. If values were entirely internal and behaviour was an unreliable guide, the proxy could not function. Furthermore, by making the decision unreviewable, the practice presupposes that the *process* of determining capacity/status is more prone to error if subjected to appeal during a crisis than the *outcome* of enforcing the directive. It prioritises the certainty of the pre-commitment over the procedural rights of the episode-self, implying that the episode-self's capacity to litigate is itself compromised.

  **Periodic Re-signing: Decay or Disposition?**

  The requirement to re-sign at fixed intervals clarifies the nature of the authority. If the authority rested solely on the completed act (a promise), it should not decay with time any more than a property deed does. The fact that it lapses suggests that what matters is a **continuing disposition**.

  The practice presupposes that the authority of a deliberation decays because the *agent* may have fundamentally changed, not merely because memory fades. It treats the directive as a standing expression of current will, renewed periodically. If directives never lapsed despite demonstrable changes in the patient's values (e.g., a religious conversion or a shift in life priorities while well), the practice would contradict its own foundation in authenticity. A directive that binds a Well-Self who no longer holds the values of the past Well-Self is no longer an instrument of autonomy; it is a chain. Therefore, the re-signing requirement is essential to maintain the link between the directive and the *current* authentic self, not just the *historical* one.

  **Consistency with Contemporaneous Refusal and Asymmetry**

  Here lies the sharpest tension. The system holds that a competent contemporaneous refusal is absolute, yet allows a PAD to override a refusal during an episode. It also holds that advance refusals are binding, but advance requests are not.

  Can these be reconciled? A coherent picture is possible only if we interpret the PAD not as a command to treat, but as a **waiver of the right to refuse**.
  1.  **Contemporaneous Refusal:** This is absolute because it is the immediate exercise of negative liberty.
  2.  **PAD:** This is valid because the Well-Self is deemed to have the authority to waive future negative liberty *if* the future self lacks capacity (as defined by the authenticity hierarchy discussed above).
  3.  **Asymmetry (Refusal vs. Request):** A patient can waive their own rights (refusal), but cannot create duties for others (request) that violate professional judgment.

  For this to hold, the system must presuppose that during the episode, the patient *lacks capacity* in the specific legal sense, even if they appear lucid. The PAD serves as evidence that the refusal is symptomatic. If the Sick-Self were deemed fully capacitous by contemporary standards, the PAD would have to give way. The system is consistent only if 'capacity' is not a binary switch based on immediate understanding, but a status that can be pre-determined by the authenticity of the Well-Self. If the law insists that a lucid episode-self with a PAD is still 'competent', the practice collapses. One piece must give: either the absolute nature of contemporaneous refusal, or the binding nature of the PAD when capacity is present. Currently, the practice fudges this by defining the episode-self's refusal as evidence of incapacity.

  **Underdetermination: Three Distinct Theories**

  The practice is underdetermined because distinct philosophical theories could license the same legal mechanism, yet would demand different designs.

  1.  **Precedent Autonomy (The Dworkin View):** This theory holds that 'critical interests' (long-term values) outweigh 'experiential interests' (current pleasure/pain).
      *   *Design Implication:* The directive should be hard to override, even if the Sick-Self appears happy. The focus is on the integrity of the life narrative.
  2.  **Ulysses Contract (The Elster View):** This views the directive as a solution to weakness of will or predictable irrationality, akin to tying oneself to the mast.
      *   *Design Implication:* The focus is on the *mechanism* of binding. It should be difficult to revoke during the episode, but the content matters less than the commitment to the plan. It prioritises the *act of binding* over the *welfare outcome*.
  3.  **Agency Mandate (The Fiduciary View):** This views the directive not as an order, but as the appointment of the Well-Self (or proxy) as the legal guardian of the Sick-Self.
      *   *Design Implication:* This allows for more discretion. The proxy acts in the 'best interests' of the Sick-Self as defined by the Well-Self's mandate. It permits deviation if circumstances change unexpectedly, provided the spirit of the mandate is kept.

  Observable differences would appear in revocation rules. The Precedent Autonomy model might allow revocation if the critical interests change (requiring re-signing). The Ulysses model might forbid revocation during the episode entirely. The Agency Mandate model would allow the proxy to deviate from specific instructions if they believe the Well-Self's *intent* requires it.

  **The Current-Welfare Substitution**

  Finally, suppose we replace the idealised-deliberation picture with a **current-welfare view**, where the only subject of interests is the person present in the episode.

  Under this view, the PAD collapses almost entirely. If the only moral patient is the Sick-Self, their current refusal must weigh most heavily. The past wishes of the Well-Self become merely evidentiary—they might inform what is *good* for the Sick-Self, but they cannot bind them.
  *   *What would change:* The directive could not be used to override a contemporaneous refusal unless that refusal was deemed to cause immediate, severe harm that outweighed the distress of coercion. It would become a 'statement of preferences' rather than a 'directive'.
  *   *Survival:* A recognisable version survives only if reinterpreted as a **crisis plan**. It would function not as a legal waiver of rights, but as a clinical guide to 'best interests'. The 'Ulysses' element—the self-binding against one's will—would vanish. You cannot bind a future self that is the sole locus of moral worth. The practice would revert to standard paternalism: treating the Sick-Self against their will *for their own good*, using the Well-Self's notes as a map of that good, but without the pretence that the Sick-Self has consented to it.

  **Conclusion**

  The practice of psychiatric advance directives presupposes a stratified theory of the self. It relies on the claim that the Well-Self is more 'real' than the Sick-Self, and that authenticity trumps immediate voluntariness. It is consistent with the wider law only if we accept that capacity is not merely about understanding information, but about alignment with one's stable values. However, it remains vulnerable to the charge that it disguises paternalism as autonomy. If the clinician shapes the triggers, and the proxy judges the capacity, the 'self-binding' is partly a binding by the institution. The practice holds together only so long as we accept that a person's liberty includes the right to pre-emptively surrender it in the name of their own true good—a philosophical gamble that places the integrity of a life narrative above the sovereignty of the present moment.
