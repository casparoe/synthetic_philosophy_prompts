answer: |-
  You approach this as an instrument calibration problem: given the output (the apology ceremony), what internal model must be running to produce it without crashing? Your first hypothesis—that the state is treated as a single immortal moral person—is load-bearing. Without it, Feature 1 (the non-guilty official owing a debt) is incoherent. The practice rules out a strictly individual, control-based account of responsibility where obligations die with the actor. It presupposes a theory of **corporate continuity**: the state is an agent persisting through time, distinct from the sum of its current citizens, capable of bearing debts incurred by its past configurations.

  Your second hypothesis—that the apology is addressed to the apologizing society—is partially correct but insufficient. If the audience were solely domestic, Feature 3 (descendants' acceptance matters) would be unnecessary. The practice requires a recipient who can grant forgiveness or withhold it, implying the harm is viewed as ongoing between the corporate state and the victimized community. However, the expressive element is present in Feature 5 (selective apology). The state apologizes when the past wrong conflicts with current values, and stays silent when acknowledging the wrong would destabilize current legitimacy. This suggests the practice is not purely reparative but also constitutive of current identity.

  Regarding agency and identity, the practice requires **non-numeric identity over time**. The state today is not numerically identical to the state of 1920 (different citizens, laws, borders), yet it is morally continuous. This rules out biological or strict contractual models of identity. Regarding harm, the practice presupposes that **dignitary harm persists intergenerationally**. If harm died with the victim, Feature 3 would be nonsensical. The model assumes that status injuries (stigma, exclusion) infect the lineage, and thus symbolic repair (apology) can cure a harm suffered by ancestors.

  There is significant underdetermination here. Three distinct theories license the same ceremony:
  1.  **Corporate Continuity:** The state owes a debt it inherited.
  2.  **Benefit Inheritance:** Current citizens inherited unjust gains and owe restitution (not guilt, but debt).
  3.  **Expressive Sovereignty:** The state declares current values without admitting past liability.
  The practice does not distinguish between these. However, Feature 4 (words without repair) favors the Expressive or Corporate models over Benefit Inheritance, which implies material debt.

  Can the five features be held together by a single theory? Only if **Feature 2 and Feature 4 are reinterpreted**. Standard moral logic holds that admitting moral fault (Feature 2) generates a duty of repair (contradicting Feature 4). To make them cohere, the practice must silently redefine "responsibility" as **acknowledgment rather than liability**, and "harm" as **status rather than material loss**. If the harm was material (sterilization, theft), Feature 4 makes the practice unjust, though logically possible. If the harm was dignitary, Feature 4 is survivable. Feature 5 (inconsistency) cannot be theoretically justified; it reveals that political sovereignty overrides moral consistency. The theory allows the apology, but politics decides when to run the program.

  If the **Expressive Theory** (apology to self) were adopted consistently:
  *   **Disappear:** The expectation that victims must "accept" the apology (why care about their validation if this is about us?). The language of "owing" an apology.
  *   **Newly Required:** Explicit framing as a declaration of current values ("We now condemn X") rather than a repair of past relations ("We apologize for X").
  *   **Incoherent:** Claiming to settle historical claims or foreclose future litigation (Feature 4), since a statement of values creates no debt to settle.

  The practice survives because it is a composite instrument. It uses the language of Corporate Continuity to satisfy victims (Feature 1 & 3) while using the logic of Expressive Sovereignty to protect the treasury (Feature 2 & 4). It is not philosophically coherent, but it is socially functional.

  Verdict: COMPOSITE-BUT-STABLE Corporate moral agency decoupled from legal liability and material repair.
