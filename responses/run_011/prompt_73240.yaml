answer: |-
  This is a remarkably honest dissection of your own intuitions. Most people try to force their verdicts to fit a textbook; you are doing the harder work of letting the verdicts build the textbook.

  You are correct that your flatmate is onto something regarding the "reference price" and fairness norms (this draws heavily on the work of Kahneman, Knetsch, and Thaler regarding *fairness as a constraint on profit-seeking*). However, that explains the *Hurricane vs. Electricity* tension, but not the *Wage vs. Milk* tension.

  Here are three candidate principles, ranging from the simple (which you would likely reject) to the baroque (which I suspect is the architecture of your actual mind).

  ### Principle 1: The Efficient Allocation Principle
  **Statement:** Price controls are impermissible because they distort the signalling function of prices, leading to shortages, surpluses, or misallocation of resources, unless the market is a natural monopoly requiring regulatory oversight.

  *   **Verdicts it supports:** Rent control (No), Milk floor (No), Electricity surge (Yes), Ticket resale ban (No).
  *   **Verdicts it overrules:** Insulin cap (No), Hurricane cap (No), Min wage (No), War ceilings (No), Payday loans (No).
  *   **Analysis:** This is the standard neoclassical view. It treats labour, medicine, and petrol exactly like milk or widgets. It is clean, but it clearly does not match your moral intuitions. You reject this because you believe some markets are morally distinct from others.

  ### Principle 2: The Vulnerability and Power Principle
  **Statement:** Price controls are required whenever there is a significant asymmetry of power or information between buyer and seller, and the good in question is essential for life, dignity, or basic participation in society.

  *   **Verdicts it supports:** Insulin cap (Yes), Hurricane cap (Yes), Min wage (Yes), Payday loans (Yes), War ceilings (Yes).
  *   **Verdicts it overrules:** Electricity surge (No), Ticket resale ban (Yes — you said No), Rent control (Yes — you said No).
  *   **Analysis:** This captures your concern for the vulnerable (insulin, payday loans) and the anti-gouging instinct (hurricanes). However, it fails to explain why you allow electricity surge pricing (which hits the vulnerable hard) or why you reject rent control (which protects tenants). It also struggles to distinguish why a wage floor is dignified but a milk floor is wasteful.

  ### Principle 3: The "Anti-Exploitation, Pro-Signal, Special-Status-Labour" Principle (The Baroque One)
  **Statement:** Price intervention is permissible only when it prevents *predatory extraction* from a captive audience without destroying the *long-term supply signal*, with a specific exception for *human labour* (where a floor protects dignity) and *existential emergencies* (where temporary suspension of markets is required for survival).

  This principle has four distinct clauses that map to your specific contradictions:

  1.  **The Predatory Extraction Clause:** Intervention is allowed when the seller is exploiting a temporary monopoly or inelastic demand to extract windfall profits above the "reference price" (Kahneman's fairness norm).
      *   *Work done:* Justifies the **Insulin cap** (monopoly) and **Hurricane petrol cap** (temporary monopoly/gouging).
      *   *Distinction:* Explains **Electricity surge pricing**. You view this not as extraction, but as a necessary signal to incentivise future capacity investment. The profit is a return on infrastructure risk, not a windfall on existing stock.
  2.  **The Labour Exception Clause:** Human labour is not a commodity; therefore, a price floor (wage) is a protection of human dignity, whereas a price floor on goods (milk) is a market distortion.
      *   *Work done:* Justifies **Min wage** but rejects **Milk floor**. This is Polanyi's *The Great Transformation* argument: labour markets are embedded in social relations, not just supply and demand.
  3.  **The Emergency Time-Horizon Clause:** In existential crises, allocation by price is suspended for allocation by need, but only for the duration of the crisis.
      *   *Work done:* Justifies **War ceilings** (temporary, existential) but rejects **Rent control** (permanent, structural). Permanent controls distort supply; temporary ones manage rationing.
  4.  **The Collusion Clause:** Voluntary restraint is virtue; coordinated restraint is a cartel.
      *   *Work done:* Justifies **Voluntary shop caps** but rejects **Trade agreement caps**.

  *   **Verdicts it overrules:** It struggles with **Ticket resale**. Under Clause 1, is a ticket a necessity? If no, the ban is impermissible (matching your verdict). But if the "principle" is about fairness, why is scalping worse than surge pricing? This principle suggests your hesitation on tickets is correct: it *should* bother you less than generators, because it is a luxury good.
  *   **Payday Loans:** This principle accepts the cap under Clause 1 (predatory extraction from the desperate), even if it reduces access. You prioritise preventing harm over ensuring access.

  ---

  ### Running Principle 3 on Your New Cases

  Here is how the Baroque Principle handles the cases you haven't listed yet.

  **1. A minimum price per unit of alcohol**
  *   **Verdict:** **Fine (with caveats).**
  *   **Reasoning:** This looks like the Milk Floor (a floor on a good), which you reject. However, the justification isn't economic support for farmers; it is public health and harm reduction targeting vulnerability (Clause 1 adjacency). If the aim is to stop the *cheapest* alcohol reaching the most vulnerable drinkers, it aligns with the Payday Loan logic (protecting people from their own desperation/circumstance).
  *   **Conflict:** It risks clashing with the "Labour is special" exception. If you treat alcohol like milk, it's not fine. If you treat it like a public health hazard, it is.

  **2. A cap on executive pay**
  *   **Verdict:** **Not fine.**
  *   **Reasoning:** This is a price ceiling on labour. You support a *floor* on labour (dignity), but a *ceiling* interferes with the supply signal for talent (Clause 1). Unless you view executive pay as "predatory extraction" (Clause 1) rather than compensation, the principle rejects it. Given your verdict on the £100/hr minimum wage, you seem to respect the bounds of market signalling for labour at the top end.

  **3. A rent cap that only bites on people who've been in the same flat more than five years**
  *   **Verdict:** **Fine.**
  *   **Reasoning:** This mitigates your objection to standard rent control. Standard control kills supply (landlords won't let). A "tenancy cap" protects against *predatory extraction* from a captive audience (Clause 1) without necessarily deterring new supply, as the initial rent can be market-rate. It moves rent control closer to the Hurricane/Payday Loan logic (protecting the trapped) and away from the Structural Distortion logic.

  **4. A legal ban on paying blood donors**
  *   **Verdict:** **Fine.**
  *   **Reasoning:** This is the Titmuss argument. It treats blood as a "special good" where marketisation degrades the social good (similar to the Labour Exception). It is not a price control in the economic sense, but a moral boundary on what can be priced. It fits your "Labour is not a commodity" intuition, extended to "Body parts are not commodities".

  **5. The tariff a monopoly water company is allowed to charge**
  *   **Verdict:** **Fine (Required).**
  *   **Reasoning:** This is the Natural Monopoly exception found in Principle 1, reinforced by Clause 1 (Predatory Extraction). Water is a necessity; the supplier has no competition. Regulation is not a distortion; it is a substitute for competition. This aligns perfectly with your Insulin verdict.

  **6. A floor on the price of carbon**
  *   **Verdict:** **Fine.**
  *   **Reasoning:** This is not a price control; it is a Pigouvian tax/price correcting an externality. However, in your framework, it passes because it is not protecting a specific seller (like the Milk Floor) but pricing a social harm. It aligns with the "rules of the game" rather than "interference in the game".

  ---

  ### The Empirical vs. Moral Audit

  You asked to flag where your "not fine" verdicts are actually empirical claims in costume. Here is where you are disguising predictions as values:

  1.  **Rent Control ("ends up making things worse"):**
      *   **Status:** **Empirical.**
      *   **Why:** You are arguing from consequences (supply destruction, quality decay). If evidence emerged that a specific model of rent control *did not* reduce supply (e.g., the tenancy cap mentioned above), your moral objection would likely vanish. You are not saying rent control is inherently unjust, but that it is counter-productive.

  2.  **Minimum Wage of £100 ("obviously not fine"):**
      *   **Status:** **Empirical.**
      *   **Why:** This is a *reductio ad absurdum* based on economic collapse. If the economy could sustain £100/hr without job losses, you would likely support it. Your objection is to the *disruption*, not the *distribution*.

  3.  **Milk Floor ("surpluses and gets dumped"):**
      *   **Status:** **Empirical.**
      *   **Why:** Again, this is an efficiency argument. If the surplus were stored or donated without waste, your objection might weaken. However, there is a moral undertone here: you may feel farmers don't *deserve* support in the way workers do (linking back to the Labour Exception).

  4.  **Payday Loan Cap ("fine... even though... pushes borrowers towards worse alternatives"):**
      *   **Status:** **Moral.**
      *   **Why:** This is the crucial one. You admit the empirical consequence (harm) might occur, but you maintain the verdict. Here, you are prioritising the *intrinsic wrong of usury* over the *consequentialist outcome*. This is a genuine moral stance, not a fudge.

  5.  **Hurricane Petrol vs. Electricity Surge:**
      *   **Status:** **Moral (Fairness Norms).**
      *   **Why:** Your flatmate is right. Economically, both are rationing mechanisms. Your distinction rests entirely on the *perceived intent* of the seller. Hurricane pricing looks like theft (taking advantage of misfortune); Electricity pricing looks like cost-recovery/investment (maintaining the grid). This is a judgment of character, not just mechanics.

  ### Conclusion

  The principle you are living inside is **Principle 3 (The Baroque One)**.

  It is not a fudge; it is a pluralistic framework. You are a **market pragmatist** who believes prices should generally clear markets (Electricity, Rent, Milk), but you are a **moral interventionist** who believes specific markets (Labour, Medicine, Crisis Essentials) are embedded in social relations that trump efficiency.

  The tension you feel between **Hurricane Petrol** (Cap) and **Electricity** (No Cap) is the only loose thread. To tighten it, you must accept that your support for the Petrol Cap is purely about *fairness norms* (preventing windfall profits on existing stock), whereas Electricity pricing is about *future capacity*. If you accept that distinction, your system is consistent.

  You are not a libertarian, and you are not a socialist. You are a **Social Democrat with a strong distaste for inefficiency.** You want the market to work, but you refuse to let it be the master of human dignity or survival. That is a coherent position, even if it requires a baroque set of rules to administer.
