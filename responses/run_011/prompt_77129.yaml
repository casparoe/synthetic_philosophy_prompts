  4.  **Refining the Recommendations:**
      *   *Discrete Choices:* Score Voting (0-5 scale). Why? It handles compromise better than IRV. IRV encourages burying (as seen). Score voting encourages honest scoring *unless* it's highly competitive, but even then, it's less prone to the specific "burying" tactic that broke IRV in March. Actually, Approval Voting (0 or 1) is simpler and very robust, but Score allows nuance. Let's stick with Score (0-5) as it fits engineering "confidence levels".
      *   *Numeric Choices:* Median Voting. This is theoretically sound for single-peaked preferences.
