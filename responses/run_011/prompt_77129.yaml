answer: |-
  **TO:** Governance Council
  **FROM:** [Your Name]
  **DATE:** October 12, 2023
  **SUBJECT:** Recommendation for Voting Bylaws and Decision Protocols

  **Executive Summary**

  We need a voting mechanism that balances technical rigor with the reality of competing commercial interests. Based on the failures observed in March and the proposals currently on the table, I recommend we adopt the following binding rules:

  1.  **Discrete Choices (Architecture, Protocols):** Adopt **Score Voting (0–5 scale)**. Each delegate assigns a score from 0 (unacceptable) to 5 (ideal). The proposal with the highest total score wins.
  2.  **Numeric Parameters (Frame Size, Timeouts):** Adopt **Median Voting**. Each delegate submits a number; the median value is selected.
  3.  **Sincerity Clause:** Remove the enforceable requirement to vote sincerely. Replace it with a non-binding "Norm of Good Faith" statement in the charter.
  4.  **Reject:** The "Technical Director Dictatorship" model and Marek's "Credit Ballot" system.

  Below is the reasoning behind these choices, addressing the economic theories and practical risks raised during our last workshop.

  **1. The Gibbard–Satterthwaite Theorem and the "Dictatorship" Proposal**

  The economist was correct about the theorem: for any voting system with three or more outcomes, if you demand that the system be deterministic and non-dictatorial, there will always be scenarios where a voter can benefit by lying about their preferences. Perfection is mathematically impossible.

  However, the conclusion that we should therefore appoint a dictator is a category error. The theorem proves that *some* manipulation is possible; it does not prove that all systems are *equally* manipulable, nor that manipulation is always *successful* or *worth the effort*.

  A dictatorship is indeed strategy-proof (no one else votes, so no one else can strategize), but it solves the voting problem by eliminating the vote. Our consortium exists to ensure buy-in from competing vendors. A unilateral decision by the Technical Director might be honest, but it removes the collective verification that prevents vendor-specific bias from entering the spec. We are choosing between imperfect systems, not between an imperfect system and a perfect one. We should choose the imperfect system that is hardest to game and best captures technical consensus.

  **2. Why Marek's Credit Ballot Fails**

  Marek's proposal (100 credits to distribute) argues that because second-price auctions encourage truthful bidding, credit voting should do the same. This analogy is broken.

  In a second-price auction, you are bidding for a *private good* using *private money*. You pay the second-highest price, so bidding your true value is dominant. In voting, we are selecting a *public good* (the spec) using *virtual credits*. There is no financial cost to spending credits.

  This creates a budget allocation game, not a truth-telling mechanism. If I have 100 credits and two proposals I like, do I split them 50/50? Or do I dump 100 on my favorite to ensure it beats a rival? If I know Proposal A is popular, do I waste credits on it, or save them to boost Proposal B? Delegates will inevitably "bullet vote" (dump all 100 on one option) to maximize impact, effectively reducing the system to Plurality Voting but with extra arithmetic. It adds complexity without adding the incentive compatibility of an auction.

  **3. The Case for Score Voting (Discrete Choices)**

  For choosing between architectures (e.g., "Option A vs. Option B vs. Option C"), Score Voting is superior to the current Instant-Runoff (IRV) draft.

  In March, under IRV, a delegate successfully "buried" a strong competitor by ranking them last. IRV is vulnerable to this because ranking a rival last costs you nothing if they were never going to be your first choice. In Score Voting, you still give rivals a 0, but you can express nuance for compromises. If Proposal A is your favorite, but Proposal B is acceptable and Proposal C is dangerous, you can score A=5, B=3, C=0.

  This mitigates the "burying" tactic. To harm a rival in Score Voting, you must give them a 0, but you cannot harm them *more* than that. In IRV, ranking a strong rival last can eliminate them in an early round, changing the entire outcome. Score Voting satisfies the "monotonicity" criterion: scoring a candidate higher never hurts them. This makes strategic voting harder to calculate and less rewarding. While Gibbard–Satterthwaite still applies (you might still exaggerate scores), the specific exploit used in March is neutralized.

  **4. The Case for Median Voting (Numeric Parameters)**

  For numeric decisions (max frame size, backoff ceilings), voter preferences are typically "single-peaked." Every engineer has an ideal number; utility drops as the value moves higher or lower from that ideal.

  When preferences are single-peaked, the **Median Voter Theorem** applies. If we simply select the median of all submitted numbers, the result is strategy-proof. If I want the value to be 50, and the median is 100, submitting 10 won't move the median closer to 50 than submitting 49 would. Submitting an extreme number only risks pushing the median away from my ideal if I miscalculate.

  This bypasses the Gibbard–Satterthwaite limitations for this specific class of decision. We should not vote on numbers using ranked ballots or credits. We should submit numbers and take the median.

  **5. The Sincerity Clause**

  The current draft includes a clause expecting delegates to rank sincerely. As seen in March, this is unenforceable. A delegate can always claim their low ranking was an honest technical assessment. Keeping an unenforceable rule undermines the bylaws.

  However, we should not remove the sentiment entirely. Replace the clause with a "Norm of Good Faith" preamble. We acknowledge that strategic voting is possible, but we establish that exploiting loopholes to block interoperable solutions violates the consortium's purpose. This shifts the burden from rule enforcement to social pressure, which is more effective in a small group of repeat players (12 delegates) where reputation matters.

  **Conclusion**

  The economist's theorem tells us we cannot build a perfect machine. It does not tell us we should stop building machines. Dictatorship sacrifices buy-in; Credit Voting sacrifices simplicity for false security; IRV sacrifices stability against tactical burying.

  Score Voting and Median Voting are robust, familiar to engineers, and mitigate the specific vulnerabilities we have already observed. I move that we adopt these rules for the upcoming cycle.
