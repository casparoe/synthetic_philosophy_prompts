  6.  **Writing - Section by Section (Mental Outline):**
      *   **Subject:** Proposal for Voting Bylaws.
      *   **Recommendation:** 1. Discrete proposals -> Score Voting (0-5). 2. Numeric parameters -> Median Voting. 3. Drop Sincerity Clause enforceability, keep as norm. 4. Reject Dictatorship and Credit Ballot.
      *   **The Theorem (G-S):** It proves no perfect system exists for 3+ options. It does *not* prove all systems are equally bad. Dictatorship is strategy-proof but removes collective wisdom. We need buy-in, so we vote.
      *   **The Credit Ballot:** Marek's analogy to second-price auctions is flawed. Auctions allocate private goods; voting selects public goods. Credits encourage hoarding/bullet voting, not truthfulness. Score voting is simpler and captures intensity without the complex allocation game.
