          *   No hedging ("depends on values").
          *   Length: Max 2 pages.
          *   Tone: Professional, decisive, technical but accessible.

  2.  **Deconstruct the Technical/Economic Claims:**
      *   **Gibbard–Satterthwaite (G-S):** States that for 3+ outcomes, any deterministic voting rule is either dictatorial or manipulable (strategic voting is possible).
          *   *Economist's conclusion:* "Make it a dictatorship, it's more honest."
          *   *Rebuttal:* G-S says manipulation is *possible*, not that it's *easy* or *likely* to succeed in practice, nor that dictatorship is the only alternative to *perfect* strategy-proofness. It doesn't mean all rules are equally bad. It means perfection is impossible. Dictatorship removes the *collective* aspect, which defeats the purpose of a council.
      *   **Marek's Credit Ballot (Cumulative Voting/Score Voting variant):**
          *   *Claim:* Inherits incentive properties of second-price auction (Vickrey).
          *   *Reality:* Second-price auctions are strategy-proof for *single-item* auctions with *private values*. Voting is a *public good* decision. Spending credits on a compromise vs. a favorite involves strategic calculation. If I love A, hate B, and like C, do I dump all 100 on A? Or split 50/50 with C to ensure B loses? It is *not* strategy-proof. It encourages bullet voting (all on one) or strategic spreading. It does *not* have the Vickrey guarantee.
          *   *Better alternative:* Score Voting (0-5 or 0-10 scale) is often more robust than cumulative credits, but still subject to strategy (min-maxing). However, for technical consensus, Score Voting often yields better utility than IRV.
      *   **Numeric Votes (Single-Peaked Preferences):**
          *   *Theory:* If preferences are single-peaked (everyone has an ideal number, utility drops as you move away), the Median Voter Theorem applies.
          *   *Mechanism:* Choose the median. This is strategy-proof under single-peaked preferences.
          *   *Recommendation:* Use Median Voting for numeric parameters.
      *   **IRV (Current Draft):**
          *   *Pros:* Familiar, ensures majority support for winner.
          *   *Cons:* Vulnerable to "burying" (ranking strong rival last), as seen in March. Violates monotonicity.
      *   **Dictatorship (Technical Director):**
          *   *Pros:* Decisive, accountable.
          *   *Cons:* Defeats consortium purpose (buy-in from competitors), single point of failure/bias.

  3.  **Drafting the Memo - Structure:**
