      *   *Cantillon Effect:* Richard Cantillon wrote earlier (Essay on the Nature of Trade in General, published 1755 but written earlier, circulated in MS). Hume likely knew Cantillon's ideas or they were part of the circulating mercantilist/early classical discourse. The effect (who gets the money first matters) is definitely present in Hume. Calling it "Cantillon effect" is slightly anachronistic terminology but conceptually accurate.

  3.  **Address Question 1: Mechanism (Illusion vs. Distribution):**
      *   Hume leans towards a mix, but primarily it's about the *sequence* of price adjustments.
