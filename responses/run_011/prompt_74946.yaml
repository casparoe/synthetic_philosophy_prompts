answer: |-
  Your paraphrase is excellent and you have not mangled the argument at all. You have correctly identified the two distinct moves Hume makes in the essay. The first is the quantity theory of money, where he argues that in the long run money is neutral, acting merely as a counter or a tool for exchange rather than a source of wealth itself. The second is his policy recommendation that an increasing money supply is beneficial for industry. The confusion you are feeling is entirely warranted because on the surface these two claims seem to contradict each other, but the resolution lies in how Hume distinguishes between a settled state of affairs and the process of moving between states.

  Regarding your first question about what is bearing the weight in the second part, it is not quite a matter of people being systematically fooled in a cynical sense, nor is it purely a distributional point about creditors versus debtors, though it contains elements of both. Hume is relying on a frictional lag in how prices adjust across the economy. When new money enters, it does not raise all prices simultaneously like a tide lifting all boats equally. It enters through specific channels, typically into the hands of merchants and manufacturers first. These producers see the prices for their goods rise before the prices for labor and provisions fully adjust to the new level. This increases their profit margins temporarily. Encouraged by these higher profits, they employ more laborers and expand production. The laborers, in turn, see higher nominal wages or greater availability of work and are motivated to work harder before they fully realize that the cost of living has risen to meet them. So it is less about a permanent error or illusion and more about the sequence of events. The real gain comes from mobilizing idle labor and resources during that interval before the economy reaches the new equilibrium where prices are high but real wealth is unchanged.

  This leads directly to your second question about the tension between the thought experiment and the policy advice. There is no contradiction here once you recognize that the thought experiment is comparing two static endpoints, while the policy advice is about the dynamic transition between them. When Hume says nobody is richer after a fivefold increase, he is comparing Situation A, where prices have adjusted to the low money supply, with Situation B, where prices have adjusted to the high money supply. In both settled states, the real stock of goods and labor is the same. However, the policy recommendation rests entirely on the path from A to B. Hume is arguing that the process of inflation itself stimulates industry. The neutrality claim applies to the destination, but the policy advice applies to the journey. He is not saying that having more money makes you richer in a settled state, but that the act of increasing it keeps the economy from stagnating.

  Your intuition that this means the policy only pays off as long as the inflow never stops is largely correct, but with a significant caveat. Hume does not advocate for endless, unchecked inflation because he recognizes the limits of this mechanism. He acknowledges that if money increases too much, prices will rise so high that the nation's exports become too dear for foreign buyers, which would eventually choke off trade and industry. He is advocating for a moderate, steady increase to maintain the spirit of industry, not a runaway expansion. He expects that eventually, commerce will reach a natural limit when poorer nations catch up and prices equalize across borders, at which point the stimulus effect will fade. So he is not promising that you can inflate your way to permanent prosperity, but rather that a gentle expansion is preferable to a static money supply which might lead to hoarding and stagnation.

  As for your guess about the Cantillon effect, you are conceptually spot on even if the terminology is slightly anachronistic. Richard Cantillon wrote his essay slightly before Hume, and while it was not published until 1755, the manuscript circulated in Paris during the 1730s and 1740s when Hume was there. It is very likely Hume was familiar with the idea that the point of entry for new money matters and that it affects relative prices before general prices. The term Cantillon effect was coined by economists in the twentieth century, so Hume would not have used that label, but the mechanism you identified is exactly what he is describing. He is detailing how the injection of money changes relative prices and incentives in the short run before the general price level absorbs the change. So you are right to see that connection, and it is the key to understanding how he reconciles the neutrality of money with the benefits of an increasing supply.
