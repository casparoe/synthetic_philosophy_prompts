answer: |-
  This is a sharp observation. You have identified a specific failure mode in institutional epistemology that sits at the intersection of statistics, sociology, and metrology. You are not forcing the connection to peer disagreement, but that literature only explains the *intra*-committee step, not the *inter*-committee drift.

  Here is the breakdown of the nearest established concepts, exactly where they fail to capture your phenomenon, and a proposed coinage for the specific mechanism you are describing.

  ### 1. The Nearest Established Concepts (and their limits)

  **A. Pseudoreplication (Statistics)**
  *   **The Fit:** This is the mathematical sin being committed. Committee 2 treats the output of Committee 1 as an independent data point. It is not. It is a derivative of the same underlying uncertainty. By averaging them, you are counting the original "hunches" twice (or N-times).
  *   **The Limit:** Pseudoreplication describes the *calculation error*. It does not explain why the number gains *authority*. In stats, pseudoreplication just makes your p-value wrong. In your scenario, the number becomes *more* trusted, not less. It misses the sociological reification.

  **B. Reification (Sociology/Philosophy)**
  *   **The Fit:** This captures the moment the "mean of hunches" becomes "The Safety Limit." An abstract construct is treated as a concrete entity.
  *   **The Limit:** Reification is static. It explains why the first report is trusted too much. It does not explain the *iterative* accumulation of false confidence across generations of committees.

  **C. Information Cascades (Economics/Game Theory)**
  *   **The Fit:** Later actors rely on the public signal of earlier actors, ignoring their own private information.
  *   **The Limit:** Standard cascade models assume rational herding (e.g., "they know something I don't, so I'll follow"). You specified your committees are *honest* and *averaging*, not herding. They aren't ignoring their hunches; they are mixing them with the legacy number. A cascade implies a switch; you are describing a dilution.

  **D. Loss of Second-Order Uncertainty (Epistemology/Decision Theory)**
  *   **The Fit:** This is the technical core of your "Third Thing." First-order uncertainty is "The dose is 50mSv." Second-order uncertainty is "We are unsure how sure we are about the 50mSv." By publishing a single point, Committee 1 collapses the second-order uncertainty (the variance/spread). Committee 2 cannot see the width of the distribution, so they cannot weight the input correctly.
  *   **The Limit:** This is a description of the *data format*, not the *institutional process*. It explains why the math fails, but not why the institution keeps doing it.

  **E. The Conciliatory View (Peer Disagreement)**
  *   **The Fit:** As you suspected, the *inside* of the committee is running the "Equal Weight View" (split the difference between peers).
  *   **The Limit:** Peer disagreement theory assumes the peers are distinct epistemic agents. When Committee 2 treats Committee 1's *output* as a peer, they are committing a category error. Committee 1 is not a peer; it is a *process*. Treating a process output as a peer agent is where the drift enters.

  ### 2. The Coinage: "Consensus Compounding"

  Since no single term covers the statistical double-counting *plus* the iterative authority gain *plus* the requirement for a point estimate, I propose we call this **Consensus Compounding**.

  **Definition:** Consensus Compounding occurs when a summary statistic (derived from uncertain inputs) is treated as a primary data point by a subsequent process, leading to an artificial reduction in calculated variance and an artificial inflation of epistemic authority over iterative cycles.

  **Why this fits:**
  *   **Compounding:** Like interest, the "confidence" grows exponentially without new "capital" (evidence) being added.
  *   **Consensus:** The authority comes from the social fact of agreement, not the physical fact of measurement.
  *   **Mechanism:** It requires the "Point-Value Constraint." If the variance is published, the "interest rate" on the confidence cannot be faked, because the next committee sees the wide error bars and discounts the input.

  ### 3. Boundary Conditions (Answering your specific tests)

  You asked where the edges of this concept lie. Here is how Consensus Compounding behaves under your proposed variations:

  **Does it cover a majority vote instead of an average?**
  *   **Yes, but worse.** If the output is a binary (Pass/Fail) or a discrete vote count, the variance information is even more aggressively suppressed than a mean. A 5-4 vote published as "Approved" loses the information that the room was split. Consensus Compounding accelerates because the "point estimate" is now a step function. The next committee sees "Approved" and treats it as a settled fact, not a 55% probability.

  **Does it cover one person pooling their own conflicting reasons over a few years?**
  *   **Yes. This is "Memory-Based Consensus Compounding."**
  *   If a scientist estimates a value in Year 1, forgets the *reasons* for the uncertainty, and only remembers the *number* in Year 2, they will treat their past self as an independent data source. They effectively become two committees. This is a known cognitive bias (sometimes called "Source Amnesia" or "Hindsight Bias"), but when it drives a long-term project, it is Consensus Compounding within a single agent.

  **Does the single-point-output requirement matter?**
  *   **Critically, yes.** This is the valve that controls the effect.
  *   In instrumentation, you know that a number without an error bar is a lie. In epistemology, a proposition without a confidence interval is a dogma.
  *   The single point acts as a **lossy compression algorithm**. It discards the entropy (the disagreement/spread). Once the entropy is discarded, the Second Law of Thermodynamics for Information prevents you from getting it back. Committee 2 cannot reconstruct the variance of Committee 1. Therefore, they *must* assume a lower variance than actually exists.
  *   If the spread is published, Consensus Compounding is arrested. Committee 2 sees the wide spread and realizes, "This is weak evidence." They might still average it, but the resulting confidence interval will remain wide. The "authority accretion" stops.

  ### 4. Why "Peer Disagreement" isn't the whole story

  You asked if this is just the peer disagreement view built into an institution.

  It is the **institutionalization of the Conciliatory View without the metadata.**

  In the peer disagreement literature (Elga, Christensen), if you and I disagree, we should move toward each other. But there is a caveat: we must be *peers*. To know we are peers, we need to know *why* we disagree.
  *   **Inside the room:** You are peers. You know you are all looking at the same empty data set and guessing. Averaging is rational (Wisdom of Crowds).
  *   **Between rooms:** Committee 2 is *not* a peer of Committee 1. Committee 2 is a *reviewer* of Committee 1.
  *   **The Error:** Committee 2 treats Committee 1's *conclusion* as if it were Committee 1's *testimony*.
      *   *Testimony:* "I looked at the data and I think it's X." (Independent evidence).
      *   *Conclusion:* "We argued and decided it's X." (Derived evidence).

  By treating the Conclusion as Testimony, Committee 2 double-counts the original data. This is statistically identical to **Bayesian Double-Counting**, where you update on the same evidence twice because you forgot you already conditioned on it.

  ### 5. Summary for your Epistemology Notes

  You are observing a specific institutional pathology. It is not Groupthink (no social pressure). It is not Sycophancy (no authority bias).

  It is **Iterative Variance Suppression via Reified Averaging.**

  *   **The Cause:** The requirement to emit a point value (Loss of Second-Order Uncertainty).
  *   **The Mechanism:** Treating a posterior distribution's mean as a prior distribution's fixed value (Bayesian Double-Counting).
  *   **The Result:** Consensus Compounding (False accumulation of authority).

  **The Fix:**
  In instrumentation, you never report a value without its uncertainty budget. In epistemology, committees should not report "The Limit is 50." They must report "The Limit is 50, derived from a uniform distribution of expert estimates ranging from 20 to 80."

  If the second committee is forced to ingest the *distribution* rather than the *mean*, the compounding stops. The "number" never becomes real enough to stand on its own. It remains what it is: a snapshot of a specific group's uncertainty at a specific time.

  You are right to be annoyed. It is a category error that masquerades as rigor.
