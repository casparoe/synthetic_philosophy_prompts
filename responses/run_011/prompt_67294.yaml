answer: |-
  Your sketch of the argument is sound, provided you make one hidden assumption explicit right at the start. The step where you write P prime of A implies C equals one, and then equate that to the probability of the conditional given C, relies entirely on the assumption that the conditional sentence A arrow C actually denotes a proposition in the algebra. In other words, you are assuming there is some event X in your sample space such that X is true exactly when the conditional is true. If there is no such set of outcomes, then P(A arrow C) is undefined, and the whole derivation collapses before it begins. This is not a mistake in your logic, but it is the philosophical linchpin of the lesson. You cannot run the arithmetic until you have secured the commitment that the conditional is the kind of thing that can be an argument for a probability function. So, before you write a single equation on the board, you must establish that we are testing the hypothesis that conditionals are propositions.

  Here is how I would structure the seventy-five minutes to ensure that dependency is clear and the arithmetic lands without getting bogged down in abstraction. Start by spending the first ten minutes dismantling the material conditional intuition. Ask them directly whether If A then C is equivalent to Not A or C. When they say yes, as intro logic trained them to, show them why that fails for probability. Use your concrete example immediately here so they have something to hold onto. Imagine an urn with ten balls. Four are red and striped, one is red and plain, two are blue and striped, and three are blue and plain. Let A be the proposition that a drawn ball is red, and C be the proposition that it is striped. The probability of A is five tenths, and the probability of C is six tenths. The probability of C given A is four fifths, or point eight. If the conditional were the material conditional, its probability would be the probability of Not A or C, which is one minus the probability of A and Not C. In this urn, A and Not C is just the one red plain ball, so the material conditional has probability point nine. But our intuition, and Stalnaker's Thesis, says the probability of the conditional should match the conditional probability, which is point eight. Since point nine does not equal point eight, the conditional cannot be the material conditional. This gets the material conditional out of the way early so it does not haunt the triviality proof later.

  Now you move to the core assumption, which is where you address your worry about the algebra. Tell them that to do probability at all, we need to know what counts as an event. In this urn, an event is just a set of balls. If I ask for the probability of Red, you count the red balls. If I ask for the probability of Striped, you count the striped balls. If Stalnaker's Thesis is going to work as a general law, then the sentence If Red then Striped must also pick out a specific set of balls. It does not matter which balls yet, but there must be some specific collection of the ten balls that makes the conditional true. If there is no such collection, then P(If A then C) is nonsense, like asking for the probability of the color blue. Write this on the board as the Proposition Assumption. Everything that follows depends on this. If they grant you this, you can proceed to the derivation. If they do not, the theorem does not get off the ground, which is actually a valid philosophical response, but for the sake of the exercise, ask them to grant it so you can show them what happens.

  With the Proposition Assumption in place, spend the next twenty minutes walking through the derivation using the urn numbers. Start with the initial state. We assume P(If A then C) equals P(C given A), which is point eight. Now introduce the idea of updating probabilities by learning information. This is where you use the conditioning step in your sketch. Suppose we learn that the ball is Striped. We condition on C. In this new probability function, C has probability one. Consequently, the probability of C given A is now one, because C is certain. By Stalnaker's Thesis, the probability of the conditional must also be one in this new function. This means that in the original function, the probability of the conditional given C is one. Do the same for learning Not C. Suppose we learn the ball is Plain. C is now impossible. The probability of C given A is zero. So the probability of the conditional given Not C is zero. Now apply the Law of Total Probability. The overall probability of the conditional must be the probability of the conditional given C times the probability of C, plus the probability of the conditional given Not C times the probability of Not C. That is one times point six plus zero times point four. The result is point six.

  Here is where you pause for the contradiction. We started by assuming Stalnaker's Thesis, which told us P(If A then C) is point eight. The derivation, assuming the conditional is a proposition, told us P(If A then C) is point six. Point eight does not equal point six. The only way to avoid this contradiction is if P(C given A) equals P(C) from the start, meaning A and C are independent. But we chose an urn where they are not independent. Therefore, no interesting probability algebra where events can be dependent can satisfy Stalnaker's Thesis for all probability functions. This is the moment to emphasize that the antecedent has dropped out. The math forces the probability of the conditional to equal the probability of the consequent, regardless of the antecedent. This is absurd for conditionals, so the assumption that started it all must be false.

  You should anticipate two major misconceptions during this sequence and head them off before they solidify. The first is the idea that you have proven conditionals are not truth-functional. This is too weak. Students often walk away thinking Lewis proved conditionals have weird truth conditions. You need to intervene right after the contradiction arises and state plainly that the result rules out there being any proposition at all, truth-functional or not. It is not that the truth table is non-standard; it is that there is no set of balls in the urn that corresponds to the conditional. Use the phrase no truth conditions rather than non-truth-functional to make this vivid. If there were truth conditions, there would be a set of balls. The math shows there cannot be a set of balls.

  The second misconception is the objection that you only got the result because you demanded the equation hold for every probability function. Someone will suggest we just restrict the class of functions to those where A and C are independent, or where the thesis holds. Do not let them have this as a win. Explain that probability functions are supposed to model learning. When we learn new information, we move from one probability function to another by conditioning. If Stalnaker's Thesis holds for your current beliefs but fails for your beliefs after you learn something trivial like whether C is true, then it is not a law of logic or language, but merely an accidental feature of your current state of ignorance. A semantic rule should not vanish when you update your information. This costs too much to be a viable solution.

  For the final five minutes, you need a question that tests whether they grasp the impossibility result rather than just the algebra. Do not ask them to reproduce the proof. Instead, ask them this. Suppose I insist that in this urn, the conditional If Red then Striped is true for exactly six of the ten balls, specifically the six striped ones. Could you assign probabilities consistent with Stalnaker's Thesis? The correct answer is no. If the conditional is true for exactly the six striped balls, its probability is point six. But Stalnaker's Thesis requires it to be point eight. The mismatch shows that you cannot identify the conditional with any set of balls, even the set of balls where the consequent is true. This question forces them to see that the problem is not just about the math working out, but about the non-existence of a truth-bearing entity.

  Finally, you must decide what to refuse to explain. You do not have time for the general theorem about how many atoms the algebra can have, nor for the measure-theoretic edge cases where probabilities are zero or one. You also should not try to explain the suppositional view or Adams' Thesis in detail, which is the standard way out of this problem. When students ask how we can talk about conditional probability if there are no conditional propositions, tell them that this is exactly where the literature goes next. Say plainly that the solution is to deny the Proposition Assumption we made at the start. Tell them that modern semantics treats conditionals as expressions that change the context rather than propositions that describe it. But for today, the lesson is purely negative. We are not building the new theory; we are destroying the old one. If you frame it as clearing the ground for the next lecture, they will accept the omission without feeling like you are hiding the good part. Keep the focus tight on the contradiction between the thesis and the proposition assumption, and you will fill the hour without losing them in the technical weeds.
