answer: |-
  1. Eternalists commit to existence being a tenseless property of spacetime coordinates, while presentists commit to existence being a dynamic, monadic property possessed only at the current temporal index. This frames the disagreement as one about whether the domain of quantification is static across time or shifts with the passage of time.
  2. The dispute is partially verbal regarding the unrestricted existential quantifier, where eternalists adopt a tenseless reading and presentists adopt a tensed reading. However, it remains substantive because each side claims the other's quantifier fails to carve reality at its joints, making it a clash of ideological frameworks rather than mere definitions.
  3. Physics is ultimately silent on this issue because empirical theories describe causal structure without dictating whether that structure constitutes being itself. Even a discovered preferred foliation would be underdetermined, as eternalists could treat it as a physical field within the block rather than evidence for ontological privilege.
  4. Progress requires changing the question from what exists to which ideological framework offers greater theoretical virtue regarding parsimony and explanatory power. A useful distinction would be separating the semantic analysis of tense from the metaphysical claim about whether temporal passage is mind-independent.
  5. Do not expect a resolution on truth, but expect movement if you shift from debating evidence to debating meta-ontological commitments and quantifier variance. Next session, assign Kit Fine's "Tense and Reality" or Ted Sider's "Writing the Book of the World" to force a discussion on framework choice rather than physical counterexamples.
