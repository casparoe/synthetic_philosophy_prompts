  10. **Final Polish:** Ensure the distinction between "causal explanation" and "relabeled behavioral pattern" is clear in the conclusion. The key is *counterfactual support*.

  **(Self-Correction during drafting):** I need to make sure I don't accidentally imply magic in Case A. The "causal work" of the symbol must be understood functionally. The symbol *is* the pattern of balls. If the pattern causes the balls to return to the pattern, is that circular? No, it's feedback. The *structure* constrains the *components*. I need to articulate this carefully so the reductionist objection remains viable but the functionalist victory is clear.

