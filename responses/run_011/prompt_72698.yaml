          1.  Microscopic physics identical (deterministic, elastic, no privileged particles).
          2.  Case A: Simmballs do genuine causal work. Case B: Symbol-level description is inert bookkeeping.
          3.  External observer can distinguish A from B in bounded time without inspecting individual collisions.
          4.  Test must not beg the question (assume high-level causation is real).
      *   **Post-Case Analysis:**
          *   Identify the single feature doing the work.
          *   State the verdict if that feature is removed.
          *   Present the reductionist counter-argument (why they differ in no respect that matters).
          *   Final Licensing: Under what conditions is "the model wants X" a causal explanation?

  2.  **Initial Brainstorming & Philosophical Grounding:**
      *   The core philosophical tension is *Causal Exclusion* vs. *Multiple Realizability/Functionalism*. The colleague is a hard reductionist (causal closure of the physical). The user is a functionalist/pragmatist (higher-level patterns have predictive/explanatory power).
      *   To satisfy constraint (1), the underlying physics must be identical. This means the difference must lie in the *arrangement* or *counterfactual robustness* of the system, not the laws of physics.
      *   To satisfy constraint (2), one system must show that the high-level pattern *constrains* the low-level dynamics in a way the other doesn't. This sounds like *control* or *robustness*.
      *   To satisfy constraint (3), the observer needs a macroscopic test. Intervention is the key. If I poke the system, does the symbol persist and correct itself?
      *   To satisfy constraint (4), the test can't just say "look, symbols exist." It must show the symbols *doing* something that the balls alone wouldn't necessarily do without that organizational structure.

  3.  **Developing the "Careenia" Thought Experiment:**
      *   *Setup:* Two sealed boxes (Careenia). Inside: steel pinballs.
      *   *Case 1 (The "Steering" Careenium):* The balls are arranged such that stable clusters (simmballs) form. Crucially, if a simmball is perturbed (e.g., a ball knocked out of the cluster), the dynamics of the remaining balls *correct* the error and restore the cluster. The cluster acts as an attractor. The "symbol" (the cluster shape) causally influences the future trajectory of the balls by constraining them back into the pattern.
      *   *Case 2 (The "Epiphenomenal" Careenium):* The balls move such that clusters *appear* to form for a while, but they are fragile. If perturbed, they dissolve. The pattern is a coincidence of the moment, not a constraint on the future. The "symbol" is just a description of the current state, not a driver of the next state.
      *   *The Test:* The observer introduces a small, macroscopic perturbation (a "shake" or injecting a stray ball) and observes recovery.
      *   *Wait, check constraints:*
          *   (1) Physics identical? Yes, elastic collisions.
          *   (2) Causal work vs. inert? Yes, one corrects (homeostasis), one dissolves.
          *   (3) External observer? Yes, they shake and watch.
          *   (4) No smuggling? The test relies on *counterfactual stability*, not assuming symbols exist a priori.

      *   *Refining the "Causal Work":* In Case 1, the existence of the cluster *makes it the case* that the balls end up in specific future positions that they would not have occupied if the cluster hadn't formed (due to the restoring dynamics). In Case 2, the future positions are determined solely by the immediate vector of the individual balls, with no restorative force emerging from the pattern.
      *   *Actually, a better distinction:* **Counterfactual Robustness / Error Correction.**
      *   Let's call them *Homeostatic Careenium* (A) and *Accidental Careenium* (B).
      *   In A, the "simmball" pattern is a *control structure*. If you nudge a constituent ball, the collision dynamics force it back into the pattern. The pattern "steers" the balls.
      *   In B, the "simmball" pattern is a *trajectory coincidence*. If you nudge a constituent ball, it flies off, and the pattern vanishes. The pattern describes the past, not the future.

  4.  **Drafting the Narrative:**
      *   Describe the boxes.
      *   Describe the "Simmballs" (stable geometric clusters).
      *   Describe the Intervention (The "Gust").
      *   Describe the Outcome (Reformation vs. Dissolution).

  5.  **Analyzing the Feature:**
      *   What is the single feature? **Counterfactual Robustness** (or Homeostatic Stability / Error Correction).
      *   It's not just that the pattern exists, but that the system *preserves* the pattern against noise.
      *   If removed: Both systems are just balls bouncing. The "symbol" is purely in the eye of the beholder in both cases.

  6.  **The Reductionist Counter-Argument:**
      *   The reductionist says: "In both cases, it's just balls hitting balls. In Case A, the initial conditions were such that collisions resulted in reformation. In Case B, they weren't. No 'symbol' pushed anything. The 'restorative force' is just a sum of vector exchanges. You haven't found a new force; you've just found a complex set of initial conditions."
      *   Why does this matter? It challenges the *ontology* of the symbol. The user wants to know if they can treat the symbol as a causal agent. The reductionist says "No, it's a shorthand for complex micro-states."

  7.  **Final Licensing (The Payoff for the MI Lead):**
      *   When can you say "The model wants X"?
