  The ECB's design presents a unique puzzle in social epistemology because it attempts to solve a political problem (national sovereignty) using an epistemic instrument (a technical committee). To reconstruct the implicit theory of collective judgment, we must separate the *rhetoric of unity* from the *mechanics of aggregation*.

  ### 1. The Implicit Theory: Group Agent or Strategic Insulation?

  The ECB's legal framework explicitly mandates a **Group Agent** theory. Governors are legally required to act for the euro area as a whole, disregarding national instructions. Ontologically, this presupposes that the Council is capable of forming a single "mind" or intention that is distinct from the sum of its parts. The secrecy of the vote and the unsigned announcement are functional requirements of this theory: for the market to treat the decision as the judgment of a single agent, the internal fragmentation must be hidden.

  However, the rotation mechanism contradicts this. Rotating voting rights based on economic size is a logic of **Representational Bargain**, not truth-tracking. In a pure epistemic committee (like a jury), every member's vote should carry equal weight because competence is assumed to be roughly equal or independent of stake. By weighting access to the vote by GDP, the design acknowledges that member states have different *stakes* in the outcome. This presupposes that the judgment is not merely about "what is true about inflation," but "what is acceptable to the major economies."

  **Where the practice is underdetermined:** The secrecy of the deliberation means we cannot empirically verify which theory is operational. It is consistent with a Group Agent that *happens* to rotate members for practical reasons, and it is consistent with a Bargain that *mimics* a Group Agent to stabilize markets. The design does not rule out either; it relies on the ambiguity. It rules out **Epistemic Aggregation** in the standard sense (see section 3), but it leaves the ontological status of the judgment (real unity vs. fabricated unity) underdetermined.

  ### 2. The Doctrinal Paradox and the Function of Accounts

  The doctrinal paradox (or discursive dilemma) arises when a group votes on premises (e.g., "Inflation is high," "Growth is low") and derives an outcome (e.g., "Raise rates"), versus voting directly on the outcome. If the Council voted on premises, the collective set of beliefs might be inconsistent (e.g., a majority believes inflation is high, a majority believes growth is low, but the majority for raising rates is a different coalition).

  The ECB avoids this paradox not by solving it, but by bypassing it. The "Accounts" published after the meeting are not a record of a premise-based vote. They are a **narrative reconstruction**. Because individual views are not attributed, the Secretariat can construct a coherent story that justifies the outcome without revealing whether any individual member actually held that specific combination of premises.

  **Epistemic vs. Legitimation Work:** This is primarily **legitimation work**. For forward guidance to function, the market needs a coherent model of the bank's reaction function. If the published analysis were a strict aggregation of individual premises, it might be logically incoherent (due to the paradox). By synthesizing a consistent narrative *ex post*, the ECB ensures the *appearance* of rationality. This does not necessarily undermine the epistemic quality of the *decision*, but it decouples the public justification from the actual reasoning process. The theory presupposed here is that the *coherence of the output* matters more than the *provenance of the premises*.

  ### 3. Rotation, Anonymity, and the Condorcet Jury Theorem

  Your hunch is correct: standard judgment-aggregation results, including the Condorcet Jury Theorem (CJT), assume a fixed electorate. The CJT argues that if voters are competent (better than random) and independent, the majority decision converges on the truth as the group size grows.

  The ECB's rotation breaks the "fixed electorate" assumption. If the voting body changes every meeting, you cannot treat the sequence of decisions as a series of trials by the *same* jury.
  *   **Loss of Stability:** The "collective competence" becomes a property of the *institution's rules* rather than the *current profile* of judgments.
  *   **Loss of Independence:** Rotation by economic bloc introduces correlation. Governors from similar economic contexts (e.g., export-heavy vs. domestic-consumption economies) are likely to receive similar signals. This violates the independence assumption required for strong epistemic aggregation.

  **Does the epistemic case survive?** Only in a weakened form. The argument shifts from "this specific majority is likely correct" to "this *procedure* is robust over time." The epistemic authority rests on the stability of the institution, not the competence of the specific voters in the room. However, the rotation mechanism suggests that **political feasibility** (keeping large economies on board) is prioritized over **epistemic optimality** (using all available information at every meeting). This further pushes the design away from Epistemic Aggregation and toward Representational Bargain.

  ### 4. Transparency vs. Deliberation (ECB vs. BoE)

  If the ECB adopted the Bank of England's transparency (named votes, individual projections), it would fundamentally shift the theory of judgment from **Deliberative Consensus** to **Public Aggregation**.

  *   **What the ECB gains from secrecy:** It protects the **malleability of preferences**. In a closed room, a governor can change their mind without reputational cost. This allows for genuine deliberation where arguments, not just initial positions, determine the outcome. It supports the Group Agent fiction by presenting a unified front.
  *   **What the BoE gains from transparency:** It gains **informational efficiency**. The market sees the distribution of beliefs (the "scatter plot" of risk). This allows for finer-grained conditioning of expectations.
  *   **The Cost:** Publishing named votes converts deliberation into **position-taking**. Members may vote to signal competence to their home constituency or to build a personal reputation, rather than to track the truth. This undermines the claim that the committee is a truth-tracking device, turning it into a collection of accountable delegates.

  The ECB design presupposes that the *benefit of uninhibited deliberation* (and political cover) outweighs the *cost of hidden information*. The BoE design presupposes that *accountability and information disclosure* outweigh the *risk of strategic voting*.

  ### Synthesis

  The ECB's design is a hybrid that structurally relies on conflicting theories. The rotation mechanism is a hard commitment to **Representational Bargain** (weighting by stake). The secrecy and legal mandate are a hard commitment to **Group Agent** (unity of voice). The publication of coherent accounts is a commitment to **Legitimation** over strict logical aggregation.

  Because the internal deliberation is secret, we cannot verify whether the Group Agent is real (deliberation transforms preferences) or a facade (bargaining produces a compromise that is then narrated as unity). The design *requires* this ambiguity to function: national governments need to know their stake is represented (Rotation), while markets need to believe the decision is technocratic and unitary (Secrecy). Therefore, the practice does not commit to a single coherent theory of judgment but rather to a functional ambiguity that allows multiple theories to be claimed simultaneously by different audiences.

