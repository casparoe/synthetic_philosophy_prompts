prompt: |-
  So, 38 years in a wet lab (immunology, mostly) and I've only got round to reading philosophy properly since I retired. My town has two people who've been going in circles for two years about how to regulate prostitution — one wants the Nordic model, buyers criminalised and sellers left alone, the other wants the New Zealand thing, full decriminalisation with sex work treated as ordinary labour — and neither of them has ever said what would change their mind. They've finally agreed to sit down for an adversarial collaboration and, as the only person who reads both of their emails, I got volunteered to write the document. Can you draft it for me?

  What I need: a numbered list of claims both sides could actually sign — not bland stuff like both want less suffering, but substantive claims about what each regime legally does, what the harms consist of, and what the evidence can and can't currently carry. Then the disagreements that survive that, each worded so the side holding it would say yes that's my view, fairly put. Then the cruxes — the sub-questions where an answer would actually move someone — and for each one, the observation or study design both would accept as bearing on it, with each side's prediction written down beforehand like a preregistration, not after the results. And flag anywhere you think they're just fighting over words; I suspect trafficking and choice are doing double duty but tell me where else.

  One thing I keep asking that they both dodge: is the row about a purchase ban really about what happens to the people already selling, or about who ends up selling in the first place? If those are two separate cruxes with different tests, split them and say so.

  Also just tell me straight where I've got the regimes wrong — I'm working from newspaper articles and my brother in law who lives in Amsterdam, so my sense of the German and Dutch systems is probably fuzzy.
