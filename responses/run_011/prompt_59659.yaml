  ### Discriminating Cases (Dinner Table)

  To separate **Empirical EV** (Source matters) from **Epistemic Robustness EV** (Uncertainty matters), propose these two cases next month.

  **Case 1: The Noisy Empirical vs. The Clean Theory**
  *   **Scenario:** We can fund one of two flood barriers.
      *   **Barrier A:** Reduces risk by 50%. Risk estimate is 1 in 1,000 based on 10 years of local data (high variance, small sample size).
      *   **Barrier B:** Reduces risk by 50%. Risk estimate is 1 in 1,000 based on a physics model validated in 5 analogous domains, but no local data exists.
  *   **Prediction:**
      *   If she funds **A**: She follows **Empirical EV** (Source = Frequency trumps Robustness).
      *   If she funds **B**: She follows **Epistemic Robustness EV** (Source = Theory is acceptable if robust).
  *   **Falsifies:** Funding B falsifies the strict "Frequency" requirement derived from Verdict 5.

  **Case 2: The Extrapolated Frequency**
  *   **Scenario:** A disease kills 1 person per year in a city of 1 million.
      *   **Option:** Fund a program to prevent a potential mutation that would kill 1,000 people per year.
      *   **Evidence:** We have 50 years of frequency data for the *current* strain. The mutation risk is modeled based on that frequency data but has never been observed.
  *   **Prediction:**
      *   If she **Refuses**: She requires frequency for the *specific magnitude* of the risk (Strict Empirical EV).
      *   If she **Funds**: She accepts extrapolation from empirical baselines (Robustness/Soft Empirical).
  *   **Falsifies:** Funding falsifies the strict "Truncation Principle" she would need for the New Case. It tests whether "calibration data" allows extrapolation or only anchors the specific observed range.
