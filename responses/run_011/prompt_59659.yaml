  ### Surviving Rules: Implications for the New Case

  We are left with two viable candidates: **Empirical EV** (requires observed frequency) and **Epistemic Robustness EV** (requires model stability).

  **The New Case:**
  *   **Stakes:** Permanent disempowerment of all future people (Effectively Infinite/Unbounded Disvalue).
  *   **Probability:** Log-uniform distribution $10^{-6}$ to $10^{-12}$.
  *   **Evidence:** Calibration data supports the upper end ($10^{-6}$); lower end is extrapolation.
  *   **Cost:** $7M (Fixed).

  **Implication of Empirical EV:**
  R. will likely **Vote YES**.
  While the median ($10^{-9}$) is extrapolated, the upper bound ($10^{-6}$) is "genuinely supported" by calibration data. In Verdict 5, she refused a purely theoretical $10^{-10}$. Here, she has an empirically anchored $10^{-6}$. Given Verdict 1 and 3, she accepts the aggregation of future lives. Even a $10^{-6}$ chance of losing *all* future value justifies a $7M expenditure. The empirical anchor moves this out of the "shrug" category.

  *   **The Sentence:** "The calibration data anchors the upper bound in frequency, which moves this out of the realm of theoretical shrugs and into the realm of manageable risk."

  **Implication of Epistemic Robustness EV:**
  R. will likely **Vote YES**, but with more hesitation.
  She must decide if the "calibration data" makes the model robust enough. Since external reviewers signed off and the group has no stake, the robustness is high.
  *   **The Sentence:** "The external review and calibration data make the upper bound robust enough to warrant the hedge, even if the tail is uncertain."

  *(Note: The sentences are similar, but the first emphasizes "frequency," the second "robustness.")*

