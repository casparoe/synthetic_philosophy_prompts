  ### Underdetermination: Distributions over Credences

  **The Problem:**
  R.'s rule (Empirical EV) is defined for point estimates grounded in frequency. The New Case presents a **distribution** where part is empirical (upper end) and part is theoretical (lower end). Her rule does not have a well-defined output for mixed-source distributions.

  **Required Principle:**
  To vote, she must adopt a **Truncation Principle** on the spot. She must decide to integrate Expected Value *only* over the range of probabilities supported by empirical calibration (the $10^{-6}$ end), treating the extrapolated tail ($10^{-9}$ to $10^{-12}$) as probability mass zero.

  **The Commitment:**
  By adopting this principle, she commits the committee to **ignoring tail risks that lack empirical anchors**, even if they are theoretically plausible. This creates a "blind spot" for novel risks (e.g., new technology classes) where no historical frequency data exists yet. She is effectively voting to manage *known* unknowns, not *unknown* unknowns.

