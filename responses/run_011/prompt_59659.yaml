answer: |-
  ### Candidate Decision Rules and Eliminations

  We begin with the space of standard decision rules and filter them against the five recorded verdicts.

  **1. Bounded Utility**
  *   **Definition:** There is a maximum cap on disutility; no amount of minor harm can aggregate to exceed a severe harm once the cap is reached.
  *   **Elimination:** **Verdict 1.** R. chose the specks (aggregated minor harm) over the torture (severe harm). If utility were bounded, the torture would lexically dominate any number of specks. Her explicit rejection of "scope insensitivity" confirms she treats the aggregation as linear and unbounded.

  **2. Maximin (Worst-Case Analysis)**
  *   **Definition:** Choose the option with the least bad worst-case outcome.
  *   **Elimination:** **Verdict 1.** The worst case of the specks is mild irritation; the worst case of the torture is fifty years of agony. A maximin agent must prevent the torture. R. did not.

  **3. Average Utilitarianism**
  *   **Definition:** Maximize the average welfare per person, not the sum.
  *   **Elimination:** **Verdict 3.** R. chose the world with 100 quadrillion barely worth living lives over 1 billion excellent lives. The average welfare in the first world is vastly higher. R. explicitly called the average view an "error," confirming she maximizes total welfare.

  **4. Identified Victim Preference**
  *   **Definition:** Assign greater moral weight to specific, identified individuals than to statistical lives.
  *   **Elimination:** **Verdict 4.** R. chose the statistical nets over the identified miner, stating identifiability does "no normative work."

  **5. Pure Expected Value (Unconstrained)**
  *   **Definition:** Maximize $P \times Value$ regardless of the source of $P$ or the magnitude of the tail, provided $P > 0$.
  *   **Elimination:** **Verdict 5.** Proposal B offered a non-zero probability ($10^{-10}$) of catching something "a thousand times worse" than Proposal A's catch. If the badness is effectively unbounded (as in the New Case) or simply very large, Pure EV often mandates funding tail-risk mitigation regardless of how theoretical the probability is. R. refused B because the number was a "shrug rendered in scientific notation." She distinguishes between *numbers* and *probabilities* based on their derivation. Pure EV does not.

  **6. Pascal's Mugging Immunity (Prior Threshold)**
  *   **Definition:** Reject any claim where the prior probability of the agent's capability is below a fixed threshold, regardless of stakes.
  *   **Status:** **Survives.** Consistent with Verdict 2 (Mugging) and Verdict 5 (Proposal B). However, it is under-specified regarding *why* the prior is low (is it the magnitude of the claim, or the lack of evidence?). Verdict 5 suggests it is the lack of empirical evidence.

  **7. Frequency-Grounded Expected Value (Empirical EV)**
  *   **Definition:** Maximize Expected Value, but only count probabilities derived from observed frequencies or reference classes. Theoretical/model-based probabilities without empirical calibration are treated as effectively zero or below a funding threshold.
  *   **Status:** **Survives.** Consistent with all verdicts. It explains Verdict 5 (funded frequency-based A, refused theory-based B) and Verdict 2 (stranger's claim lacks base rate). It is compatible with Verdicts 1, 3, and 4 (which involve $P=1$ or empirically grounded risks).

  **8. Epistemic Robustness EV**
  *   **Definition:** Maximize Expected Value, but discount probabilities that are sensitive to model assumptions. (This often correlates with frequency, but allows for strong theory).
  *   **Status:** **Survives.** Consistent with Verdict 5 if one assumes theoretical models are less robust than frequencies. However, R.'s specific language ("frequency" vs. "theory") points more strongly to Empirical EV.

