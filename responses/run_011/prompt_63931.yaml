answer: |-
  This is a remarkably precise phenomenological description. You have isolated a specific failure mode in the contract of reading literary fiction that sits between narratology, philosophy of mind, and aesthetics.

  You are correct that the standard vocabulary is insufficient. "Unreliable narration" concerns truth, not agency. "Alienation effects" are typically intentional ruptures. "Suspension of disbelief" is too binary; it describes entering the world, not shifting your model of causality within it.

  Here is the carving you are asking for, grounded in the philosophy of mind you referenced, followed by a proposed term and its boundaries.

  ### 1. The Philosophical Carving: A Shift in Stances

  You referenced Dennett, and I believe the exact mechanism you are describing is a **premature migration from the Intentional Stance to the Design Stance.**

  In *The Intentional Stance* (1987), Dennett outlines three strategies for predicting the behavior of a system:
  1.  **The Physical Stance:** Predicting based on physical laws (e.g., the computer is overheating).
  2.  **The Design Stance:** Predicting based on function and purpose (e.g., the thermostat is designed to turn on at 70 degrees).
  3.  **The Intentional Stance:** Predicting based on beliefs, desires, and rationality (e.g., he wants water, so he went to the kitchen).

  In realist fiction, the reader's default contract is to apply the **Intentional Stance** to the characters. We treat them as agents whose actions are caused by their internal states (beliefs, desires, history). We apply the **Design Stance** to the *book* (the artifact itself).

  The phenomenon you describe occurs when the reader, without any change in textual evidence, updates their hypothesis about the *source* of the behavior. They stop predicting the character's actions based on the character's internal states (Intentional Stance) and start predicting them based on the book's structural requirements (Design Stance).

  **Why the stance revokes without evidence changing:**
  Dennett argues the stance is a strategy chosen for its *predictive efficiency*, not its ontological truth. You do not need to prove the system *has* beliefs; you only need to find that treating it *as if* it has beliefs yields the best predictions.

  In your scenario, the text supports both stances. The teacher's hesitation is consistent with her psychology (Intentional) *and* consistent with the plot's need for delay (Design). Initially, the Intentional Stance is more efficient; it yields richer emotional data. But at a certain threshold (the "forty pages" you mention), the Design Stance becomes the "cheaper" heuristic. The reader realizes: *"I can predict what happens next faster by assuming 'the book needs tension' than by simulating 'the teacher's moral conflict'."*

  Once that calculation is made, the Intentional Stance is revoked. It is not that the character becomes "unreal"; it is that simulating their mind is no longer the most efficient way to process the text. The character becomes a transparent conduit for the author's design. This matches your AI analogy perfectly: the chatbot stops seeming like a "someone" when you realize predicting its output via "statistical average" (Design/Physical) is more accurate than predicting it via "conversational partner" (Intentional).

  ### 2. Evaluation of Existing Notions

  *   **Metafiction / Metalepsis:**
      *   *Fit:* Low. Metafiction explicitly acknowledges the artifice. Your phenomenon happens in texts that *maintain* the realist surface. The text does not wink; the reader's model shifts.
      *   *Divergence:* Metalepsis is a violation of narrative levels (e.g., a character addressing the author). Your case is a shift in *attribution* without a violation of levels.
  *   **The Unreliable Narrator:**
      *   *Fit:* Low. This requires a narrator whose credibility is compromised. You specify "no narrator to speak of."
      *   *Divergence:* This is about truth-telling. Your phenomenon is about *agency sourcing*.
  *   **Kitsch / Melodrama:**
      *   *Fit:* Medium. These often suffer from characters serving plot.
      *   *Divergence:* You note this happens with "fully humanised characters" and readers still enjoy the book. Kitsch is usually a judgment of quality; this is a judgment of causality.
  *   **Aesthetic Distance (Brecht's *Verfremdungseffekt*):**
      *   *Fit:* Medium-High. Both involve preventing total emotional immersion to allow critical observation.
      *   *Divergence:* Alienation is usually an *authorial technique* intended to provoke political or intellectual critique. Your phenomenon appears to be a *reader-side event* (even happening to you, the author) that feels like a glitch in the simulation rather than a feature of the performance.

  ### 3. Proposed Term: **The Intentional Displacement**

  Since no existing term captures the specific *revocation of agency attribution without textual cue*, I propose **The Intentional Displacement**.

  **Definition:**
  A phenomenological shift during reading where the locus of causality for a character's action is reassigned from the character's internal psychology (Intentional) to the narrative structure's requirements (Design), without a change in the textual evidence supporting the action.

  **Boundaries (What counts vs. What does not):**
  *   **Counts:** A character acts consistently with their nature, but the reader suddenly perceives the action as "necessary for the plot" rather than "chosen by the person." The reader stops asking "What does she feel?" and starts asking "Why does the author need this?"
  *   **Does Not Count:**
      *   *Plot Holes:* If the character acts *out* of character to serve the plot, that is bad writing (Plot-Induced Stupidity). In Intentional Displacement, the action remains credible.
      *   *Explicit Metafiction:* If the narrator says, "I needed her to wait," that is a narrative choice, not a displacement.
      *   *Boredom:* If the reader disengages because the prose is dull, that is attentional failure. In Displacement, the reader remains engaged but changes their interpretive model.

  **Location of the Property:**
  This is a property of the **Relation**, not the Text or the Reader alone.
  *   It is not solely in the *Text*: A different reader (or the same reader at a different time) might maintain the Intentional Stance.
  *   It is not solely in the *Reader*: It does not happen with every book, only those where the Design pattern becomes sufficiently visible to compete with the Intentional pattern.
  *   It is a **threshold event in the interpretive relationship**. It occurs when the "Design Signal" exceeds the "Intentional Signal" in predictive utility, even if the "Intentional Signal" remains strong enough to be credible.

  ### 4. Confidence and Reservations

  **Confidence in the Philosophical Account (High):**
  I am highly confident that Dennett's distinction between the Intentional and Design stances provides the correct philosophical architecture for this. It explains why the "evidence" doesn't need to change: stances are strategies, not facts. It also explains the AI analogy (which is often analyzed using Dennett's framework).

  **Confidence in the Novelty of the Term (Medium-High):**
  I am reasonably sure there is no standard literary term for this *specific* phenomenological shift. Narratology discusses "focalization" and "distance," and Cognitive Narratology discusses "Theory of Mind," but none precisely describe the *mid-stream revocation of character agency due to perceived design necessity* while maintaining credibility. However, I cannot be certain a niche term does not exist in a specific sub-field of cognitive poetics.

  **Confidence in the Boundaries (Medium):**
  Distinguishing this from "subtle bad writing" is difficult. One could argue that if the Design Stance becomes visible, the author *has* failed to hide the machinery, and thus it *is* a quality issue, regardless of reader enjoyment.

  ### 5. The Claim I Am Least Willing to Defend

  The claim I am least willing to defend is this: **"The Intentional Displacement is not a failure of craft."**

  While you note that readers still enjoy the book, and the prose is not "doing anything wrong," a traditional realist critique would argue that the highest aim of character-driven fiction is to maintain the Intentional Stance until the end. If the Design Stance intrudes, one could argue the author failed to sufficiently embed the plot necessities within the character's psychology.

  I am hesitant to defend the idea that this is *neutral*. It may be that for certain types of fiction (e.g., allegory, thriller, high-concept), the Design Stance is acceptable. But for the "literary fiction" you write, where the depth of character is the primary value, the Intentional Displacement might actually be a subtle form of aesthetic damage that readers polite themselves into ignoring (saying they "enjoyed" it while actually disengaging from the character's humanity). I suspect this phenomenon is the silent killer of "respectable" but ultimately forgettable novels: they are credible enough to be accepted, but designed enough to be displaced.

  ### Summary
  You are describing **The Intentional Displacement**: a shift where the reader abandons the **Intentional Stance** (character as agent) for the **Design Stance** (character as artifact) because the latter becomes the more efficient predictive strategy, despite the textual evidence remaining constant. It is a property of the reader-text relation, occurring at the threshold where narrative necessity becomes more visible than psychological volition.
