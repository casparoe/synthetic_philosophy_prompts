answer: |-
  The theory of language underpinning your agency's practice is a specific variant of the **Conduit Metaphor**, hardened into a **Compliance Model**. It presupposes that meaning is a substance contained within the text, that this substance is degraded by friction (syllables, sentence length, passive voice), and that removing friction guarantees transmission.

  Here is the reconstruction of that theory, the diagnosis of its motivations, and the institutional implications of shifting to a theory of clarity based on capacity to act.

  ### 1. The Theory of Language: Legibility over Intelligibility

  Your practice assumes meaning lives **in the surface features of the text**. It treats language as a code where complexity is purely syntactic and lexical. By this logic, if you normalize the code (short sentences, Anglo-Saxon words), the message must emerge uncorrupted.

  This theory makes three specific presuppositions:
  *   **Atomism:** Meaning is additive. If every sentence is clear, the document is clear. It ignores *structural* complexity (e.g., the logical relationship between Paragraph A and Footnote C).
  *   **Neutrality:** It assumes the writer and the institution are benign transmitters. It does not account for the possibility that the text is designed to *manage* the reader rather than *inform* them.
  *   **Uniformity:** It assumes the "sixth-grade level" is a universal threshold of cognition, ignoring that a sixth-grade sentence about eligibility criteria requires background knowledge (of bureaucracy, of rights, of medical systems) that a sixth-grader (or an adult reading at that level) may not possess.

  Consequently, the practice assumes obscurity is produced by **style**, not by **substance**. It operates on the belief that if a policy is complicated, it is the *description* of the policy that is at fault, rather than the policy itself. By forcing the description to be simple, the practice implicitly demands that the complexity be displaced elsewhere (footnotes, caseworker discretion). The grade-level gate assumes that if the sentence is short, the burden of understanding has been lifted, even if the logical conditions required to apply that sentence have been hidden.

  ### 2. The Orwellian Inversion

  Your practice is not Orwellian; it is an **inversion** of Orwell.

  Orwell's rules (short words, active voice, cutting clutter) were *heuristic tools* in service of a moral end: political honesty. He argued that we simplify language to see the truth more clearly, specifically to expose when we are defending the indefensible.

  Your agency uses Orwell's *tools* to achieve the opposite end: **defensible obscurity**.
  *   **Orwell:** "Never use a long word where a short one will do" to prevent pretension and vagueness.
  *   **Your Practice:** "Never use a long word where a short one will do" to generate a green light on a dashboard.

  When your writers move "irreducible conditionality" into footnotes to save the grade-level score of the main text, they are committing the exact sin Orwell identified: using language to conceal reality. They are making the text *legible* to the algorithm while making the policy *illegible* to the citizen. Orwell warned that political language is designed "to make lies sound truthful and murder respectable, and to give an appearance of solidity to pure wind." Your readability checker gives an appearance of clarity to pure wind. It allows the agency to say, "We were clear," while ensuring the reader remains uncertain.

  ### 3. Motivations: Strict Requirements vs. Comfortable Fits

  You asked to separate the justifications. Democratic accountability, informed consent, and reducing helpline calls all require **actual comprehension**. If a patient cannot act, consent is not informed. If a citizen cannot find their benefit, accountability is null. These goals are *incompatible* with a metric that can be satisfied by hiding conditions in footnotes.

  The only justification that strictly requires the numeric gate is **limiting litigation exposure**.

  **Why:** A readability score is an **audit trail**. In a legal or legislative oversight context, "We met the statutory 8th-grade requirement" is a binary, defensible shield. "We tested this with 50 residents and 40 understood it" is a vulnerability; it admits that 20 did not. The numeric gate is not a tool for communication; it is a tool for **liability management**. It converts a qualitative social obligation (be understood) into a quantitative technical specification (be scored). This protects the agency from claims of negligence ("We followed the standard") without requiring them to solve the harder problem of structural complexity.

  ### 4. Philosophical Underdetermination vs. Specific Commitment

  **Where it is Underdetermined:**
  The practice is compatible with multiple incompatible theories of communication, which is why it persists despite its failures.
  *   **Behaviorism:** It fits the view that text is a stimulus and compliance is a response. Simplify the stimulus to optimize the response.
  *   **Information Theory:** It fits the view that communication is signal transmission and "noise" (complex words) reduces fidelity.
  *   **Legal Formalism:** It fits the view that adherence to procedure constitutes validity.

  Because it fits all three, the agency can claim it is being "scientific" (Information Theory), "effective" (Behaviorism), and "compliant" (Formalism) simultaneously, without having to choose which actually matters.

  **Where it is Specifically Committed:**
  The practice commits you to **Textual Determinism**. It forbids the view that meaning is co-constructed by the reader's context. A rival theory—**Pragmatics** or **Speech Act Theory**—would argue that the meaning of "coverage will be adjusted" is not in the syllables but in the *illocutionary force* (the threat of loss) and the *perlocutionary effect* (the fear/confusion generated).
  *   **The Commitment:** Your current practice forbids acknowledging that a text can be syntactically simple and semantically empty. It forces you to treat the *score* as the *reality*.
  *   **The Rival:** A pragmatic theory would forbid certifying a document that leaves the reader unable to act, regardless of the score. It would require the text to disclose *uncertainty* (e.g., "A caseworker will decide this") rather than hiding it to preserve a score.

  ### 5. Institutional Changes for "Capacity to Act"

  If the agency adopted the view that clarity is a property of a **reader's capacity to act**, the following institutional shifts would be necessary:

  **1. Who Certifies:**
  *   *Current:* The Compliance Officer (checking the score).
  *   *Required:* The Target Audience (via testing). Certification would shift from the Communications Office to a user-research function, similar to your research protocol office. A document is not "plain" because it scores well; it is "plain" because a sample of the intended population can correctly answer questions like "What do you need to do next?" and "What happens if you do nothing?"

  **2. Evidence of Clarity:**
  *   *Current:* The Flesch-Kincaid number.
  *   *Required:* Task success rates. Evidence would look like: "90% of participants correctly identified the deadline," or "80% understood that an exception might apply." The metric moves from *input* (text features) to *output* (user understanding).

  **3. Treatment of Footnotes and Discretion:**
  *   *Current:* Complexity is exiled to footnotes to protect the main text score.
  *   *Required:* Complexity must be integrated. If a decision relies on caseworker discretion, the main text must say: "A caseworker will decide this based on [Criteria X]."
  *   *The Shift:* This would likely force policy changes. If the policy cannot be explained simply *even when the complexity is acknowledged*, the policy itself may be too complex for public implementation. The writing standard would become a stress test for the policy, not just the prose.

  **4. The Role of the Writer:**
  *   *Current:* The writer is a technician reducing friction.
  *   *Required:* The writer is an advocate for the reader. They would have the authority to send policy back to the program managers if the logic cannot be rendered intelligible. The "green light" would not come from a software checker, but from a sign-off that the *conditions of action* are transparent.

  **5. Handling Strategic Ambiguity:**
  *   *Current:* Ambiguity is accidental (bad writing).
  *   *Required:* Ambiguity is recognized as political. If the agency intends to reserve discretion, the text must explicitly state: "We reserve the right to change this." This sacrifices the comfort of "plain language" for the honesty of "clear power dynamics."

  ### Summary
  Your committee is currently managing **risk**, not **communication**. You are using the aesthetics of clarity to insulate the bureaucracy from the consequences of complexity. To move to a theory where clarity is the capacity to act, you must stop measuring the text and start measuring the transaction. This will inevitably reveal that some of your policies are not "hard to explain," but are fundamentally incompatible with public accountability. That is likely why the numeric gate exists: it allows you to fix the sentence without fixing the system.
