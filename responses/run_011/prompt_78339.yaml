      *   **The Problem:** The agency uses readability scores (Flesch-Kincaid style) and flagged word lists to certify "plain language." This leads to gaming the system (shortening sentences, hiding complexity in footnotes) without actually improving understanding. There's a disconnect between this practice and the research office's use of comprehension testing.
      *   **The Task:** Reconstruct the *theory of language* underlying the current practice.
      *   **Specific Questions to Answer:**
          1.  What does the practice presuppose about where meaning lives?
          2.  Does it assume obscurity is syntactic/lexical rather than structural/political?
          3.  Is it genuinely Orwellian or an inversion?
          4.  Separate strict requirements from comfortable fits (identify the *real* motivator among the stated justifications).
          5.  Where is the practice philosophically underdetermined vs. specifically committed?
          6.  What institutional changes would be needed if clarity were defined as *reader capacity to act*?

  2.  **Deconstruct the Current Practice (The "Theory"):**
      *   *Mechanism:* Readability formulas (sentence length, syllable count) + Banned Word Lists.
      *   *Goal:* Green light on the checker.
      *   *Implicit Theory:* Meaning is additive and local. It resides in the sentence and the word. Complexity is friction caused by long words and long sentences. If you reduce friction, meaning flows.
      *   *Blind Spot:* Meaning is also relational, contextual, and structural. Complexity often resides in *conditions* (if/then logic), power dynamics, and omitted information.
      *   *Orwell Comparison:* Orwell advocated for clarity to enable *truth-telling* and *political honesty*. The agency uses clarity techniques to *simulate* transparency while potentially obscuring liability or discretion. It's "Orwellian" in technique but anti-Orwellian in spirit (using newspeak to protect the bureaucracy).

  3.  **Address the Specific Questions:**

      *   **Where Meaning Lives:** The practice assumes meaning is *intrinsic to the text surface*. It treats language as a code where complexity = difficulty. It ignores the *pragmatic* dimension (what the reader does with the text).
      *   **Source of Obscurity:** It assumes obscurity is *stylistic* (Latinate words, passive voice) rather than *structural* (bureaucratic complexity, reserved discretion) or *intentional* (strategic ambiguity).
      *   **Orwellian?** It inverts him. Orwell wanted clear language to prevent political deceit. This practice uses clear language *rules* to create a veneer of transparency that masks structural deceit (hiding conditions in footnotes). It follows the *rules* but violates the *purpose*.
      *   **Motivations (Strict vs. Comfortable):**
          *   *Democratic Accountability/Informed Consent:* Require actual understanding (comprehension testing).
          *   *Reducing Helpline Calls:* Requires actual understanding.
          *   *Limiting Litigation Exposure:* This is the likely driver for the *numeric gate*. Why? Because a number is defensible in court ("We met the statutory standard"). Actual understanding is messy and hard to prove. The numeric gate is a *safe harbor*.
      *   **Philosophical Underdetermination:**
          *   *Behaviorism:* Stimulus (text) -> Response (action). If text is simple, response is correct.
          *   *Transmission Model:* Sender encodes, receiver decodes. Noise (complex words) interferes.
          *   *Rival Theory (Pragmatics/Speech Act Theory):* Meaning is what the text *does*. A simple sentence can be a threat or a promise. The current practice ignores this.
      *   **Institutional Changes for "Capacity to Act":**
          *   *Certification:* Shift from automated checkers to user testing (like the research office).
          *   *Evidence:* Success rates in tasks, not grade levels.
          *   *Footnotes/Discretion:* Bring conditions into the main text. Acknowledge discretion openly.
          *   *Incentives:* Reward accurate expectation-setting, not just low scores.

