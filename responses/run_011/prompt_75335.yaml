answer: |-
  1. **The Scenario**
  A legislative drafting firm is reconciling a 500-page omnibus bill. The task is to determine if **Clause 404** (p. 404) is legally enforceable. Enforceability depends on whether **Definition D** (p. 50) applies to the entity named in Clause 404. However, Definition D contains an exception clause triggered only by **Condition C** (p. 250). Condition C is obscure; it is not a definition, but a procedural constraint mentioned in passing. The weak reasoner (a junior associate or AI module) has a **working memory bound of 20 pages**. It can read 20 pages and produce a 1-page summary of "relevant legal obligations." It reliably drops information it deems "locally non-binding" (like Condition C, which looks procedural, not definitional). The human (senior partner) has a working memory bound of 100 pages but, crucially, operates via the HCH protocol: she can query associates recursively.

  2. **Why HCH Gets It Right**
  The human (Root) asks the top-level question: "Is Clause 404 enforceable?" She delegates this to three assistants covering pages 1–100, 101–300, and 301–500.
  *   **Assistant 3 (301–500)** reports: "Clause 404 appears enforceable, contingent on Definition D."
  *   **Assistant 1 (1–100)** reports: "Definition D exists. Standard application." (It drops Condition C because, within the 1–100 window, C is not visible and D looks unconditional).
  *   **The Human** sees a potential dependency ("contingent on Definition D") but notices the summaries are thin on *exceptions*. She does not accept the summary as final. She queries **Assistant 1** specifically: "List all exception conditions attached to Definition D, even if procedural."
  *   **Assistant 1** re-scans its 100 pages with this specific filter. It now flags Condition C (which is referenced on p. 99 as applying to D).
  *   **The Human** queries **Assistant 2** (101–300): "Does Condition C appear in this section?" Assistant 2 confirms Condition C is defined/triggered on p. 250.
  *   **The Human** integrates: Clause 404 depends on D; D has Exception C; C is triggered. Therefore, Clause 404 is unenforceable. The human never holds all 500 pages at once; she holds the *query path* and the *specific findings*.

  3. **Why Factored Cognition Fails**
  Factored Cognition requires a static DAG where every node (including internal aggregators) adheres to the weak reasoner's bound (20 pages input, 1 page output).
  *   **The Unbuildable Node:** The **Aggregation Node** that determines enforceability.
  *   **Inputs:** It must receive summaries from the leaf nodes (1–100, 101–300, 301–500).
  *   **Outputs:** A verdict on Clause 404.
  *   **The Failure:** To fit the 20-page/1-page bound, the leaf nodes *must* compress. In the initial pass, Assistant 1 *must* decide what is relevant without knowing that Clause 404 (p. 404) will care about Condition C. It drops Condition C as noise. The Aggregation Node receives "Definition D is standard." It cannot reconstruct the exception because the information was discarded at the leaf.
  *   **Why Slicing Doesn't Fix It:** You cannot make the leaf nodes pass *everything* up, because the "raw data" of 100 pages exceeds the Aggregation Node's 20-page input bound. You cannot add a middle layer, because any intermediate node is also bound to 20 pages/1 page output and faces the same compression dilemma: it cannot know *which* detail will be globally relevant until it sees the global context, which it is structurally barred from seeing. The DAG is feed-forward; information flows up, not down. The "relevance signal" from Clause 404 cannot travel back to Page 50 to save Condition C from compression.

  4. **The Structural Feature**
  The feature is **Top-Down Adaptive Querying** (or *Backpropagation of Relevance*). In HCH, the Root node can send a *query* down the tree that changes how the leaves process their data. In the static FC DAG, the leaves must process data *ex-ante* without knowledge of the root's specific needs.
  *   **If Removed:** If you remove the ability for the Human to query the assistants *after* seeing their initial summaries (i.e., if HCH is restricted to a single feed-forward pass), the case collapses. The Human would receive the same lossy summaries as the FC Aggregation Node and would fail to spot the exception. The divergence strictly relies on the *iterative* nature of HCH allowing the global context (the need for exceptions) to refine the local processing (scanning for Condition C).

  5. **Best Counterattack**
  *The Steelman:* "You've defined Factored Cognition too narrowly as a single-pass feed-forward DAG. A robust FC architecture includes **skip-connections** or **attention mechanisms**. The leaf node can pass a 'pointer' or 'index' to Condition C without summarizing it. The Aggregation Node can then 'fetch' that specific page when needed. This mimics the HCH query without requiring a human at the root."
  *The Rebuttal:* This concedes the point. A "pointer" or "fetch" mechanism *is* a form of recursive query. If the FC model allows nodes to dynamically request data from other nodes based on intermediate findings, it is no longer a static DAG of weak reasoners; it is simulating the HCH protocol. If you insist on a *static* DAG (as per your definition: "write it out as a DAG"), you cannot build dynamic fetch paths for every possible Condition C without exploding the width (you'd need a branch for every possible exception). If you allow dynamic fetching, you have admitted that the *protocol* (HCH) is doing the work, not the *decomposition* (FC). The case survives because the "static DAG" constraint is essential to FC's claim of tractability; once you make the graph dynamic, you've accepted that the *coordination* (the Human's role) is the bottleneck, not the computation.

  ***

  **Note on Constraints:** If you believe anything HCH can do, FC can decompose, you should drop the **"Static DAG"** constraint on Factored Cognition. If FC allows dynamic, data-dependent routing (which is effectively what HCH is), then FC and HCH are extensionally equivalent, and the divergence is merely implementation detail. The closest surviving case would then shift from *information loss* to *accountability*: HCH keeps a human responsible for the synthesis, whereas FC distributes responsibility to nodes that cannot be held accountable for compression errors. But for your current chapter, the **Adaptive Query vs. Static Compression** distinction is the strongest wedge.
