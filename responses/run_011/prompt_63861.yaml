answer: |-
  1. You argue that reports about qualia are like a smoke alarm beeping about a fire: both are effects of a common cause, so the beep is "about" the fire without the fire causing the beep. But a smoke alarm doesn't *know* there's a fire; it just signals it. When I say "I am in pain," I claim to know I'm in pain, not just reliably indicate it. How does your common-cause model bridge the gap from reliable indication to actual knowledge?

  **Follow-up:** If you say co-variance plus acquaintance is enough for knowledge, doesn't that require the quale to influence the *content* of the knowledge claim? If the quale is truly inert, isn't "knowledge" just a word you're using to describe a causal chain that never actually touched the thing known?

  2. Let's press that line between co-variance and aboutness. In your model, the neural event causes both the quale and the report. But mere co-variance happens all over the place without implying reference—day correlates with night, but day isn't "about" night. What specific feature of your common-cause structure allows the report to latch onto the quale as its object rather than just being a sibling effect?

  **Follow-up:** If you argue that the intrinsic nature of the quale fixes this, aren't you secretly relying on the quale to causally constrain the report's content? If the quale could change without the report changing, wouldn't the reference break, and doesn't that imply the quale *is* doing causal work after all?

  3. Here's the indeterminacy worry. Since the neural event N and the quale Q are perfectly locked—they always appear together—what makes it the case that my word "pain" refers to Q rather than N? It's not just that we can't tell the difference; it's that there seems to be no fact of the matter. Why isn't the reference ambiguous between the physical cause and the phenomenal effect?

  **Follow-up:** You'll likely say acquaintance resolves this. But if acquaintance is a non-causal relation, what mechanism does it use to discriminate between two perfectly co-varying candidates? How does acquaintance "know" to grab Q and leave N behind if they are metaphysically glued together in every instance?

  4. Following up on acquaintance: you treat it as a primitive relation that fixes reference without causation. But if acquaintance can pick out Q over N without any causal interaction, why couldn't acquaintance just pick out N directly? What theoretical work is Q doing here if acquaintance could theoretically bypass it to lock onto the physical vehicle instead?

  **Follow-up:** If you say acquaintance *only* works on phenomal properties, aren't you defining your way out of the problem? Does positing a brute, non-causal relation that selectively targets epiphenomena have any more explanatory power than just positing downward causation?

  5. Let's look at the zombie functionalist. They say exactly what you say about every report, every book, and every argument, but they deny qualia exist. Is there any possible observation, including your own introspection, that distinguishes your view from theirs? If not, what prevents this from being a purely verbal dispute?

  **Follow-up:** If you insist the difference isn't verbal because the ontology is different, but the difference makes no difference to any output or report, what work is "ontology" doing? Are you defending a reality that is in principle undetectable even to the subject experiencing it?

  6. You argue there is a substantive difference between your view and zombie functionalism because qualia really exist in your picture. But if qualia change nothing about the content of a judgment without changing anything causally, can you give me a single case where the presence of Q changes the truth value of a report compared to a world where Q is absent?

  **Follow-up:** If you can't give such a case, why shouldn't you concede that the disagreement is merely verbal? If you won't concede, what exactly consists in the "substantive" difference if it never manifests in truth conditions or causal powers?

  7. On your own picture, you would have written this same book in a world where qualia didn't exist, or where they were systematically different. Does this mean your belief in epiphenomenalism isn't sensitive to the truth of epiphenomenalism? Are you admitting your theory isn't based on evidence that could have been otherwise?

  **Follow-up:** If you say yes, that's a cost you're willing to pay: why should anyone trust the reasoning that led you to this theory? If your belief isn't sensitive to the facts it's about, isn't this a reductio of the whole package rather than a bullet to bite?

  8. You might say that even if the belief isn't sensitive, it's still true. But if the causal chain producing your belief is identical in the world where your theory is true and the world where it's false, what grounds do you have for preferring one world over the other? Are you asking us to accept a theory that undermines its own justification?

  **Follow-up:** If you argue that justification is internal and doesn't require sensitivity, doesn't that sever the link between truth and rationality? Are you preserving qualia at the expense of making rational belief impossible?

  9. Let's turn to what this account actually buys you. You keep qualia intrinsic and nonphysical while respecting the causal closure of physics. Is preserving causal closure the primary motivation here, even if it severs the knowledge link? Is physics really more secure than the fact that we seem to know our own minds?

  **Follow-up:** If you say causal closure is non-negotiable: are you sure closure is better established than introspective knowledge? Would you be willing to loosen causal closure to save the intuition that our experiences actually cause our reports?

  10. Consider delayed reports, like realizing you were angry only after the drive home. Here the report R comes significantly after the neural event N. Does the decay of the neural trace weaken the co-variance enough to threaten reference on your view, since the quale Q vanished long ago?

  **Follow-up:** If you say the physical trace preserves the link: doesn't that imply the trace (physical) is doing the work of sustaining reference, not the quale? If the quale drops out immediately but the trace persists, isn't the trace the real referent, making the quale redundant again?
