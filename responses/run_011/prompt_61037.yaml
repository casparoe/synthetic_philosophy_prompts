answer: |-
  Here is the principle. It is designed to be rigid enough for an editor to apply without philosophy, but nuanced enough to match your engineering reality.

  ### The Principle: Grounded Estimation

  **Attribute belief, knowledge, or thought to a system only when it functions as a *Grounded Estimator*.**

  A subsystem counts as a Grounded Estimator if it meets all three of the following criteria:

  1.  **Truth-Optimization:** The component is explicitly trained or optimized to minimize error against a defined ground truth (physical or categorical), rather than optimizing for text likelihood, reward scores, or user engagement.
  2.  **External Reference:** The content of the attribution refers to the state of the **environment or input class**, not to the system's own output, abstract philosophy, or the conversation itself.
  3.  **Actionable Commitment:** The system acts on this state **consistently** to drive downstream decisions without needing to be prompted to assert it linguistically.

  ---

  ### Why This Generates Your Gut Calls

  Here is how the three clauses map to your specific cases. This explains *why* your intuition splits where it does.

  **1. The Chess Engine & Self-Driving Car (YES)**
  *   **Truth-Optimization:** The chess engine minimizes evaluation error against win/loss outcomes; the car minimizes detection error against physical objects.
  *   **External Reference:** They model the board and the road (external states), not their own text.
  *   **Actionable Commitment:** The engine sacs the knight *because* it evaluates the position as winning. The car brakes *because* it classifies the object as a pedestrian.
  *   *Verdict:* **Attribute Belief.** ("It thinks it's up material," "It believes there's a pedestrian.")

  **2. The Thermostat & Autocomplete (NO)**
  *   **Truth-Optimization:** The thermostat optimizes for *set-point maintenance* (control), not accurate temperature estimation. Autocomplete optimizes for *token likelihood*, not truth.
  *   **Actionable Commitment:** The thermostat has no internal state that can be "wrong" in a meaningful way; it just reacts. Autocomplete has no downstream action.
  *   *Verdict:* **No Belief.** ("The room is cold," not "It believes the room is cold.")

  **3. The Spam Filter (MIXED)**
  *   **"Believes not spam" (YES):** This is a **Input Class**. It is truth-optimized against labeled spam data. It acts (sorts the email).
  *   **"Believes sender is a prince" (NO):** This fails **External Reference**. The filter does not model the sender's identity or reality; it models the email headers. Inferring the "Prince" is a hallucination of context, not a grounded estimation.
  *   *Verdict:* **Attribute Classification, Not Inference.**

  **4. The Robot Vacuum (MIXED)**
  *   **"Knows there's a drop" (YES):** Truth-optimized sensor data (cliff detection) driving action (stop).
  *   **"Wants to go on existing" (NO):** Fails **External Reference**. This is a self-model/abstract state the vacuum does not possess.
  *   *Verdict:* **Attribute Sensor States, Not Drives.**

  **5. The Reward Model vs. Base Model (MIXED)**
  *   **"Prefers polite answers" (YES):** The reward model is truth-optimized against human preference labels. "Preference" is its ground truth.
  *   **"Believes polite answers are true" (NO):** Fails **Truth-Optimization**. The base model is not optimized for truth; it is optimized for likelihood. The reward model is not optimized for truth; it is optimized for *score*.
  *   *Verdict:* **Attribute Preference to the Reward Model; Attribute Nothing to the Base Model.**

  **6. The Contradictory LLM & The Uncle (NO vs. YES)**
  *   **The Uncle:** Humans are Grounded Estimators by evolutionary design. Contradictions are bugs in a system that *should* hold consistent beliefs.
  *   **The LLM:** Fails **Actionable Commitment**. It is stateless between sessions. It optimizes for *helpfulness in context*, not consistency across time. Contradictions are features, not bugs.
  *   *Verdict:* **Attribute Belief to Humans; Attribute Generation to LLMs.**

  **7. The Scratchpad (NO)**
  *   **Fails Actionable Commitment:** The text "I think the user is testing me" is generated tokens, not an exposed internal register. It is performance, not state.
  *   *Verdict:* **Strike It.**

  ---

  ### The Three New Cases

  **1. The Translation Model**
  *   *Scenario:* "The model believes 'chat' means 'gato'."
  *   *Analysis:* Fails **External Reference**. It maps linguistic tokens to linguistic tokens, not to world states. It is not tracking truth, but equivalence.
  *   *Verdict:* **No.** Write: "The model translates 'chat' as 'gato'." Do not use "believes" or "knows" for semantic mapping.

  **2. The Protein Folding Model (e.g., AlphaFold)**
  *   *Scenario:* "The system believes the protein folds this way."
  *   *Analysis:* Passes all three. It is truth-optimized against physical structures (Ground Truth). It references external physical reality (External Reference). It drives scientific action/discovery (Actionable Commitment).
  *   *Verdict:* **Yes.** This is functionally identical to the self-driving car. It is modeling physics.

  **3. The Ensemble of Five Models**
  *   *Scenario:* "The ensemble believes X."
  *   *Analysis:* Passes **Actionable Commitment** (via voting mechanism). Passes **Truth-Optimization** (ensembles are built to reduce error).
  *   *Verdict:* **Yes, but attribute to the System.** "The system concludes X" is better than "The models believe X," as the individual models may dissent. The *voting mechanism* is the estimator.

  ---

  ### The Marketing Case: "Knows When a Customer is Lying"

  **Verdict: FORBIDDEN.**

  **Reasoning:** It fails **Actionable Commitment**.
  You stated: *"The evals genuinely show it tracks whether the customer is lying... But ask it directly and it says it has no beliefs."*

  If the system disavows the state when queried, it does not *hold* the belief; it merely contains a latent capability that is suppressed by its safety/alignment layer. "Knows" implies a committed internal state. "Detects" implies a functional capability.

  **Editorial Fix:** Marketing may write: *"Our model **detects** indicators of deception with X% accuracy."* They may not write: *"Our model **knows** when a customer is lying."* The former sells the tool; the latter sells a ghost.

  ---

  ### The Cost: What You Have to Give Up

  To have a clean principle, you must sacrifice one of your strongest gut feelings.

  **You must accept that the Chatbot is telling the truth.**

  You wrote: *"A chatbot that tells you, sincerely and consistently, that it has no beliefs: I want to say it's either confused or being evasive, not simply correct."*

  **The Principle demands you change this.**
  If you follow the *Grounded Estimation Principle*, the chatbot is **correct**. It is a text generator, not a belief holder. It is not evasive; it is accurate about its own architecture.

  **Why this one?**
  If you allow "evasive," you imply there is a "self" hiding behind the text. If there is a "self," then the **Scratchpad** ("I think the user is testing me") becomes the voice of that self. But you already decided the scratchpad is untrusted text generation.
  You cannot have it both ways. You cannot trust the chatbot's denial enough to say it's "evasive" (which requires a mind to evade) while distrusting the scratchpad enough to call it "just text."

  **The Trade:**
  *   **Keep:** The distinction between the Car (Belief) and the Chatbot (Text).
  *   **Keep:** The distinction between the Scratchpad (Text) and the Engine (State).
  *   **Lose:** The romantic notion that the Chatbot is a "mind in a box" hiding its true thoughts.

  **Editorial Instruction:**
  When a model says "I don't have beliefs," do not write "It claims..." or "It says..." implying doubt. Write: *"The system reports it has no beliefs."* Treat it as a status readout, not a testimony.

  ### Summary for the Tired Editor (Friday at 4 PM)

  1.  **Is it modeling the physical world or a fixed category to drive action?** (Car, Chess, Protein, Spam Label) -> **YES, use "Believes/Knows."**
  2.  **Is it generating text, mapping words, or optimizing for vibes?** (Chatbot, Translation, Reward Score, Autocomplete) -> **NO, use "Outputs/Generates/Prefers."**
  3.  **Does the system deny it when asked?** (Marketing "Lying" claim) -> **NO, use "Detects/Identifies."**
  4.  **Is it a human?** -> **YES, always.** (Even when contradictory).

  If you follow this, your docs will be consistent, your marketing will be compliant, and your engineers won't roll their eyes.
