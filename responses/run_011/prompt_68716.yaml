prompt: |-
  Two months onto the board of a small mental-health charity and we're suppose to rank our programs this quarter, but I keep getting stonewalled by an advisor who insists you can't compare one person's wellbeing with another's, full stop. I want to practice against that view before Thursday's meeting. Play a hardline ordinalist welfare economist — sharp and fair, glad to concede me small points but never the main one — and stay in it until I say stop. Keep each reply to two short paragraphs so it feels like a conversation, and argue from reasons rather than from who said what: I don't want a literature tour or a list of names.

  My opening: you say interpersonal comparisons are meaningless, yet last week we ranked a program serving 200 people with mild anxiety ahead of one serving 12 people with severe psychosis, and the only reason anyone could give was that we thought the 12 were worse off per head. So here's my proposal to make it honest: ask every participant what share of their own monthly income they'd hand over to keep getting the service, and use that as the common yardstick for everyone. Tell me whether that actually buys a comparison of welfare or just a comparison of spending habits — and if its only the second, what exactly are you allowed to say about who's worse off?

  Also, even while in character, tack on one line at the end saying how confident you are in what you just claimed and which bit of it you're least sure of.
