answer: |-
  # Activity: The Emotion Detective Game

  **Class:** Intro Philosophy of Mind
  **Time:** 75 Minutes
  **Students:** 24 (6 groups of 4)
  **Materials:** Index cards (stack), Whiteboard + Markers, Projector (optional, for cases).
  **Instructor Prep:** Choose **ONE** of the three Secret Keys (A, B, or C) before class starts. Do not write it on the board. Do not name the theories.

  ---

  ## Part 1: Setup (10 Minutes)

  1.  **Grouping:** Divide the class into 6 teams of 4. Give each team a stack of index cards.
  2.  **The Pitch:** "We are going to play a scoring game. I will read a vignette about a person in a situation. Your team must decide: **Does this person feel an emotion?** If yes, which one? Write your answer on a card and hold it up."
  3.  **The Catch:** "There is a correct answer key in my pocket. You get 1 point for matching the Key's classification (Emotion/No Emotion) and 1 bonus point for naming the specific emotion correctly. At the end, the winning team gets [bragging rights/candy]."
  4.  **The Twist (Hidden):** "You may notice that some cases are tricky. You might disagree with the Key. That's part of the game. After Round 3, you will have a chance to wager points on what rule I'm using to grade you."

  ---

  ## Part 2: The Cases (30 Minutes)

  *Read these aloud or project them. Give groups 2 minutes to discuss and write their card per case.*

  **Case 1: The Bear (The Control)**
  > Marcus is hiking. He turns a corner and sees a grizzly bear standing on its hind legs ten feet away. Marcus's heart hammers against his ribs, his palms sweat, and he freezes. He thinks, "That bear could kill me." He feels terrified.
  > *Task:* Is Marcus feeling an emotion? Which one?

  **Case 2: The Injection (Arousal w/o Thought)**
  > Elena participates in a medical study. She is injected with adrenaline. Her heart races, her hands shake, and she breathes faster. However, the doctors told her these are the side effects of the vitamin shot she agreed to. She thinks, "My body is reacting to the medicine," and she has no thoughts about anything dangerous or valuable happening in her environment. She feels physically buzzed but mentally neutral.
  > *Task:* Is Elena feeling an emotion? Which one?

  **Case 3: The Cold Avenger (Judgment w/o Heat)**
  > David discovers his business partner stole from him. David calculates the loss. He judges that he has been deeply wronged and that justice requires his partner's ruin. He plans the lawsuit meticulously. However, David feels no heat in his chest, his hands are dry, and he reports feeling perfectly calm. He says, "I am not angry; I am just correcting an error."
  > *Task:* Is David feeling an emotion? Which one?

  **Case 4: The Arachnophobe (Disavowal w/ Action)**
  > Sarah is a biologist. She sincerely believes spiders are harmless and valuable to the ecosystem. She says, "I am not afraid of spiders." However, when a spider drops onto her desk, she screams, jumps onto her chair, and her heart races. She cannot make herself get down even though she knows she is safe.
  > *Task:* Is Sarah feeling an emotion? Which one?

  **Case 5: The Numb Grief (The Tie-Breaker)**
  > Priya's child passed away an hour ago. She sits in the hospital chair. She knows, intellectually, that this is the worst possible thing. But she reports feeling physically numb, like a statue. She says, "I don't feel anything yet." Yet, when she looks at the empty crib, the world looks grey and hollow to her.
  > *Task:* Is Priya feeling an emotion? Which one?

  ---

  ## Part 3: The Wager & Guessing (10 Minutes)

  1.  **Score Check:** Reveal the "Correct" answers based on your Secret Key. Tally points. (Expect confusion/complaints on Cases 2, 3, and 4).
  2.  **The Meta-Game:** "You've noticed the Key is inconsistent with common sense on some cases. There are three possible 'Rule Sets' I could be using. Discuss with your team which Rule Set I am using."
  3.  **Logging the Guess:** On a fresh index card, teams write:
      *   Their Theory Guess (Body, Thought, or Lens).
      *   **Why:** Cite one specific Case number where their theory explains the Key better than the others.
  4.  **The Reveal:** Collect the cards. Reveal which Secret Key you actually used. Award 5 bonus points to teams that guessed the Key correctly.

  ---

  ## Part 4: The Debrief (25 Minutes)

  *This is the philosophical core. Do not rush.*

  **1. Map the Cases to the Views**
  Draw three columns on the board. Fill them in with student help.

  *   **Theory A: The Body Theory (Physiological/Jamesian)**
      *   *Definition:* Emotion *is* the perception of bodily change. No heartbeat change = no emotion.
      *   *Verdicts:* Bear (Yes), Injection (Yes), Avenger (No), Phobia (Yes), Grief (No).
      *   *Why:* Elena's body reacted (Case 2). David's didn't (Case 3). Priya's was numb (Case 5).
  *   **Theory B: The Thought Theory (Cognitive/Judgmental)**
      *   *Definition:* Emotion *is* a judgment/evaluation about the world. No belief of harm/good = no emotion.
      *   *Verdicts:* Bear (Yes), Injection (No), Avenger (Yes), Phobia (No), Grief (Yes).
      *   *Why:* Elena thought it was vitamins (Case 2). David judged he was wronged (Case 3). Sarah judged spiders are safe (Case 4).
  *   **Theory C: The Lens Theory (Perceptual/Value)**
      *   *Definition:* Emotion is like a sensory perception of value. It can happen even if you judge otherwise (like an optical illusion).
      *   *Verdicts:* Bear (Yes), Injection (No*), Avenger (Yes), Phobia (Yes), Grief (Yes).
      *   *Why:* Elena saw no threat (Case 2). David saw the wrong (Case 3). Sarah's world *looked* dangerous despite her beliefs (Case 4). Priya's world looked hollow (Case 5).
      *   *(Note on Injection for Theory C: Usually requires some value-appearance, not just raw arousal, so No is the standard philosophical answer here).*

  **2. The Underdetermination Point**
  Ask the class: "If I had given you 10 more cases, could you have proven which theory is right?"
  *   **Desired Answer:** No.
  *   **The Lesson:** "The game wasn't about finding the truth. It was about realizing that 'Emotion' is a concept we are defining. Depending on which definition you pick, the 'facts' change. Case 4 (Phobia) is an emotion if you care about behavior/appearance (Lens/Body), but it isn't if you care about sincere belief (Thought). Piling up more cases doesn't settle it; you have to argue for the definition."

  **3. Naming the Views**
  Now introduce the actual philosophical labels:
  *   Body Theory $\rightarrow$ William James / Physiological Theories.
  *   Thought Theory $\rightarrow$ Stoics / Sartre / Nussbaum (Cognitive Theories).
  *   Lens Theory $\rightarrow$ Perceptual Theories (Tappolet, etc.).

  ---

  ## Part 5: Post-Mortem (Instructor Notes)

  ### What Predictably Breaks the First Time
  1.  **Student Frustration/Gaslighting:** If you run the **Body Theory** key, students will revolt on Case 3 (The Avenger). They will insist David is angry. If you don't validate their intuition *before* explaining the theory, they will feel the game is stupid.
      *   *Fix:* During scoring, say: "I know this feels wrong. That tension is the point. Hold that frustration for the debrief."
  2.  **The "Perceptual" Confusion:** Theory C is the hardest for intro students. They conflate "Perception" with "Sensation" (eyes/ears).
      *   *Fix:* Use the Optical Illusion analogy explicitly in the debrief. "Knowing the lines are equal doesn't stop them *looking* unequal. Sarah knows the spider is safe, but it *looks* dangerous."
  3.  **Time Creep:** The discussion on Case 4 (Phobia) will eat 15 minutes if you let it.
      *   *Fix:* Enforce the 2-minute writing timer strictly. Tell them "Debate comes later, write now."

  ### What The Game Can't Show (You Must Supply This)
  1.  **The Normative Stakes:** The game treats theories as scoring keys. It doesn't show *why* we care.
      *   *Supply:* "Why does it matter? If the Thought Theory is right, we can cure depression by changing beliefs. If the Body Theory is right, we cure it with beta-blockers or breathing. The definition dictates the treatment."
  2.  **Hybrid Views:** The game forces a choice of one. Most modern philosophers think emotions are hybrids (Body + Thought + Perception).
      *   *Supply:* "In reality, most philosophers think the truth is a mix. We play them apart today to see the ingredients clearly."
  3.  **The "Feeling" of Emotion:** The game focuses on classification. It misses the *phenomenology* (what it feels like to be the subject).
      *   *Supply:* "Notice Case 5 (Grief). The Body Theory says Priya feels nothing. But doesn't 'numbness' feel like something? The theories struggle to account for the qualitative 'ouch' of emotion."

  ### Strategic Advice for the Instructor
  *   **Pick Theory C (Perceptual/Lens) if you want the richest debate.** It splits the difference on the Phobia case (agreeing with Body on action, agreeing with Thought on value) but distinguishes itself on the *source* of the error.
  *   **Pick Theory B (Thought) if you want to challenge their intuition.** Most students think emotions are feelings. Ruling out the Phobia or the Adrenaline case as "not emotions" forces them to defend why feelings matter.
  *   **Don't admit the Key is arbitrary until the very end.** Maintain the "There is a fact of the matter" frame during the game to generate the friction needed for the debrief.
