      *   *Correction:* To make Perceptual unique, it needs to be distinct from Bodily. Perceptual theory often allows emotion without *strong* bodily arousal if the value-apprehension is there, but usually, it aligns with Bodily on the Phobia case.
      *   *Better differentiation:*
          *   *Bodily:* Needs physiological change.
          *   *Judgment:* Needs cognitive assent.
          *   *Perceptual:* Needs "affective appearance" (can persist despite assent to contrary).
      *   *Let's ensure the Keys diverge on at least one case.*
      *   Case: The Exhausted Grief. Person lost a spouse. Numb body (shock). Knows it's bad (Judgment). World looks empty (Perceptual).
          *   Bodily: No Emotion (numb).
          *   Judgment: Emotion (belief of loss).
          *   Perceptual: Emotion (world appears bleak).
      *   *Okay, I will stick to the prompt's requested mismatches:*
          1.  Arousal w/o thought (Adrenaline).
          2.  Judgment w/o heat (Cold Revenge).
          3.  Disavowal w/ action (Phobia/Implicit).

      *   *Key Logic for Phobia:*
          *   Bodily: Yes (action implies arousal).
          *   Judgment: No (disavows).
          *   Perceptual: Yes (appears dangerous).
          *   *Problem:* Bodily and Perceptual agree here.
          *   *Solution:* I need to make sure the Instructor knows that if they pick Perceptual, they score the Phobia case as "Emotion." If they pick Judgment, "No Emotion." If Bodily, "Emotion."
