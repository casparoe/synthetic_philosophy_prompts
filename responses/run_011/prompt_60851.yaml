  10. **Final Polish:** Check timing. 75 mins is tight. Keep case reading short. Ensure the debrief is the priority.

      *(Self-Correction on "Perceptual Theory"):* In Phil of Mind, this is often the "Perceptual Theory of Emotion" (Tappolet, Dokic, etc.). It treats emotions like sensory perceptions of value. Key feature: Cognitive Impenetrability (like an optical illusion, knowing the lines are equal doesn't stop them looking unequal). This fits the Phobia case perfectly.
      *   *Bodily:* James-Lange.
