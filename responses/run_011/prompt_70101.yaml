prompt: |-
  Two requests come before our Medical Policy Committee on Thursday, and the coverage language we are supposed to apply to them turns out to be unsatisfiable. I have served on this committee for nine years; before that I spent a long stretch reading and arguing in the rationalist blogosphere, which left me permanently distrustful of criteria that sound principled but cannot be applied twice in a row. I have been asked to circulate a written opinion in advance of the meeting, and I would like help drafting it.

  Our policy on auditory prostheses says the plan pays for a device that is medically necessary to restore a member to normal function, pays to replace a malfunctioning device so as to restore the member to the level of function previously achieved, and excludes anything intended to improve function beyond the normal range. In practice 'medically necessary' has become a rubber stamp, but the other two clauses are doing real work, and both fail here.

  Request A. A girl of eleven, profoundly deaf in both ears from birth, was implanted at age three under our pediatric plan. Her internal electrode array has failed. The vendor confirms in writing that nothing comparable to her original device is manufactured any longer: the current internal device is materially better at speech perception in noise, supports direct wireless streaming from a phone or a classroom soundfield system, and is conditionally compatible with the 3-tesla scanners that are now standard. The literal criterion — restore her to the function she previously had — therefore cannot be met at any price, because the target no longer exists as a product. Her family adds an argument I cannot dismiss: a child implanted for the first time this year under the same plan receives that identical better device, and we call it medically necessary. The same hardware is therapy for one child and, apparently, an upgrade for another.

  Request B. A man of forty-nine with adult-onset bilateral sensorineural loss. Our audiometric thresholds were written when the technology was, and are now stricter than prevailing clinical practice; he falls short of them, though he derives little benefit from hearing aids. An implant would leave him below normal hearing yet well above his present function and above anything a hearing aid can give him.

  Two colleagues have already staked out the poles. One holds that the therapy/enhancement distinction is doing no work in either case and that we should simply fund what improves hearing. The other holds that approving A commits us, as precedent, to funding every future generation of device for roughly two thousand current implant users whose hardware will fail over the next decade — the per-case increment is trivial, the aggregate is not, and precedent is the only thing we actually decide when we decide a case like this.

  Please draft the opinion. It should recommend a disposition for each request — approve, deny, or approve with the conditions stated explicitly enough to be operational; confront the family's consistency argument in A head-on rather than around it; propose replacement language for the clauses about restoring previous function and about the normal range, written so that a utilization reviewer could apply it next year and again in ten years as device capability keeps improving; and state the strongest case for whichever disposition you are not recommending, in a form its proponent would recognize. Assume a reader who is intelligent but has no background in bioethics, and do not pause to rehearse the general debate about therapy versus enhancement: I know it well, and it does not decide either case. I want reasoning I can defend at the table, not sources.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Committee Member (9 years tenure, rationalist background, skeptical of unsatisfiable criteria).
      *   **Task:** Draft a written opinion for the Medical Policy Committee regarding two specific requests (A and B) under the current Auditory Prostheses policy.
      *   **Current Policy:**
          1.  Pay for medically necessary devices to restore normal function.
          2.  Pay to replace malfunctioning devices to restore *previous* function.
          3.  Exclude anything improving function *beyond* normal.
      *   **Problem:** The criteria are unsatisfiable in these cases. "Medically necessary" is a rubber stamp. The other two clauses are failing.
      *   **Case A (11yo girl):** Implant failed. Old device unavailable. New device is better (noise, streaming, MRI). Literal policy says "restore previous function," but that's impossible. Family argues consistency (new patients get the new device).
      *   **Case B (49yo man):** Adult-onset loss. Doesn't meet strict audiometric thresholds (outdated). Hearing aids don't help much. Implant won't reach "normal" but will help significantly.
      *   **Colleagues' Positions:**
          *   Colleague 1: Fund anything that improves hearing (ignore therapy/enhancement).
          *   Colleague 2: Deny A to avoid precedent/cost explosion (precedent is the real decision).
      *   **Requirements for the Draft:**
          *   Recommend disposition for A and B (Approve, Deny, or Conditional).
          *   Confront the consistency argument in A head-on.
          *   Propose replacement policy language (operational for reviewers, future-proof).
          *   State the strongest case for the *unrecommended* disposition (steelman the opposition).
          *   Tone: Intelligent, no bioethics jargon, defensible reasoning, rationalist influence (focus on consistency, incentives, systemic rules).

  2.  **Deconstruct the Cases & Policy Failures:**
      *   **Case A:** The "Restore Previous Function" clause is broken by technological progress. If we deny, we punish the patient for hardware obsolescence. If we approve without changing policy, Colleague 2 is right about the precedent risk (open-ended upgrades). The family's consistency argument is strong: *Clinical Standard of Care* should drive coverage, not arbitrary timelines of implantation.
      *   **Case B:** The "Restore Normal Function" clause is broken by outdated criteria. If he doesn't meet thresholds but aids fail, is it necessary? Yes, clinically. But policy says "normal." He won't reach "normal." Denying based on "won't reach normal" is cruel and medically unsound if "normal" is unattainable for *any* implant user.
      *   **The Core Conflict:** The policy treats hearing as a static state (Normal vs. Broken) rather than a spectrum managed by evolving technology.

  3.  **Determine Dispositions:**
      *   **Case A:** Must Approve. Denying a child a working implant because the old one is obsolete is indefensible medically and ethically. It creates a two-tier system based on implantation date.
      *   **Case B:** Must Approve (with caveats). The thresholds are outdated. If hearing aids fail, the implant is the next step in the *standard of care*, even if "normal" isn't reached. No cochlear implant restores "normal" hearing in the strict sense.
      *   **Policy Update:** Need to move away from "Normal" and "Previous Function" toward "Standard of Care" and "Functional Gain."

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Introduction:** Acknowledge the tension. State the thesis: The current criteria create logical traps that force inconsistent outcomes. We need to align coverage with clinical reality.
      *   **Case A Analysis:**
          *   *Decision:* Approve.
          *   *Reasoning:* Obsolescence is not patient fault. The "consistency" argument is valid. A new implant patient and a replacement patient should have access to the same *current* standard of care.
          *   *Addressing Colleague 2 (Precedent/Cost):* Acknowledge the cost risk. But the cost of *not* doing this is rendering the benefit worthless over time.
      *   **Case B Analysis:**
          *   *Decision:* Approve.
          *   *Reasoning:* "Normal" is a phantom target. Implants don't restore normal hearing; they restore *access*. The audiometric thresholds are outdated.
          *   *Addressing Colleague 1 (Fund all improvement):* We can't fund *everything*. We need a limit. The limit should be "clinically indicated," not "perfect."
      *   **Policy Language Revision:**
          *   Remove "Restore Normal." Replace with "Restore functional access to auditory environment consistent with current clinical standards."
          *   Remove "Restore Previous Function." Replace with "Replace with current equivalent standard of care."
          *   Add a "Functional Gain" clause for Case B types (significant improvement over aids, even if not normal).
      *   **Steelmanning the Opposition:**
          *   *For Colleague 2 (Deny A):* Focus on fiduciary duty and the slippery slope of "best available" vs. "equivalent."
          *   *For Colleague 1 (Fund B unconditionally):* Focus on resource allocation and the definition of insurance (catastrophic/necessary vs. optimization).
      *   **Conclusion:** Summary of recommendation.

  5.  **Refining the Tone (Rationalist Influence):**
      *   Avoid emotional pleading. Focus on incentives, consistency, and system design.
      *   Use terms like "updateless policy," "incentive compatibility," "reference class."
      *   Ensure the "Strongest Case" section is genuine, not a strawman.
      *   *Self-Correction on Tone:* Don't get *too* wonky. Keep it professional for a Medical Policy Committee. The prompt says "intelligent but no background in bioethics." Keep the rationalist *thinking* (precision, consistency) without the *jargon* (no "priors," "updateless," etc., unless explained simply).
      *   *Key Insight:* The policy assumes technology is static. It isn't. The policy must be dynamic.

  6.  **Drafting the Policy Language:**
      *   Needs to be operational for a utilization reviewer.
      *   *Old:* "Restore to normal." *New:* "Achieve functional hearing thresholds consistent with current clinical guidelines for implantation."
      *   *Old:* "Restore previous." *New:* "Replace with current standard-of-care equivalent."
      *   *Constraint:* Must prevent "upgrade" abuse (e.g., swapping working devices for slightly better ones).
      *   *Solution:* Tie replacement to *failure* or *clinical indication*, not desire.

  7.  **Addressing the Specific Prompts:**
      *   *Confront Family's Consistency Argument:* Yes, explicitly validate it. It exposes the arbitrariness of the "previous function" clause.
      *   *Strongest Case for Unrecommended:* I am recommending Approval for both. So I need to argue for Denial (Colleague 2's stance on A) and Restriction (Colleague 1's stance is actually *more* permissive, so I need to argue against *their* lack of limits? Wait, Colleague 1 says "fund what improves." I am recommending funding these, but with *rules*. So the unrecommended disposition is "Deny A" and "Deny B" essentially. I will focus on the Fiscal/Precedent argument against A as the primary counter, as that's the harder constraint.)
      *   *Actually, looking closer:* Colleague 1 says "fund what improves." I am approving A and B. So I align with Colleague 1 on outcome, but disagree on *principle*. Colleague 2 says "Deny A." I disagree on outcome.
      *   *Instruction:* "State the strongest case for whichever disposition you are not recommending." Since I am recommending Approval for both, I should present the strongest case for Denial (Colleague 2's position on A, and the strict policy position on B). I will combine these into a "Fiduciary/Precedent" objection.

  8.  **Final Review against Constraints:**
      *   Nine-year veteran tone? Yes, experienced, weary of broken rules.
      *   Rationalist distrust of unsatisfiable criteria? Yes, highlighted in the intro.
      *   Operational language? Yes, specific metrics.
      *   No bioethics rehearsal? Yes, focused on policy mechanics.

  9.  **Writing the Draft:** (Iterative refinement during drafting to ensure the "replacement language" is tight). *Self-Correction:* Make sure the replacement language doesn't just kick the can down the road. It needs to reference "Current Clinical Guidelines" which update externally. That solves the "ten years from now" problem.

  10. **Final Polish:** Check the "Strongest Case" section. Ensure it sounds like a colleague who cares about the solvency of the plan, not a villain.

  *(Self-Correction during drafting)*: Wait, Colleague 1 wants to fund *anything* that improves hearing. I am not doing that. I am funding *medically indicated* improvements. So I am rejecting Colleague 1's *unlimited* scope. I am rejecting Colleague 2's *denial*. I need to make sure I address the "Disposition I am not recommending." Since I recommend Approval, the unrecommended disposition is Denial. I will focus the counter-argument on the Denial side (Colleague 2).

  Let's refine the "Strongest Case." The prompt asks for "the strongest case for whichever disposition you are not recommending." If I recommend Approve, the unrecommended is Deny. I will articulate the Deny argument (Colleague 2's precedent/cost concern) as robustly as possible.

  Okay, ready to write.
answer: |-
  **MEMORANDUM**

  **TO:** Medical Policy Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Pre-Meeting Opinion: Auditory Prosthesis Requests A & B and Policy Revision

  **Introduction**

  We are convened to adjudicate two requests that expose a structural failure in our current Auditory Prosthesis policy. After nine years on this committee, I have learned that a criterion which cannot be applied consistently is not a criterion; it is a source of arbitrary noise. Our current language requires us to restore members to "normal function" or "previously achieved function." In both Request A (pediatric replacement) and Request B (adult candidate), these states are physically or commercially unreachable.

  When policy language becomes unsatisfiable, reviewers do not stop making decisions; they stop following the policy. They revert to intuition. This erodes the legitimacy of the committee and creates the very inconsistency we are tasked to prevent. Below, I recommend approval for both requests, but only contingent on adopting revised policy language that aligns our coverage rules with the reality of technological obsolescence and clinical limitations.

  **Disposition of Requests**

  **Request A (Pediatric Replacement): APPROVE**
  **Request B (Adult Candidate): APPROVE**

  **Reasoning**

  **Regarding Request A:**
  The family's consistency argument is correct and must be accepted. It is untenable to assert that a specific device is "medically necessary" for a child receiving a first implant today, but merely an "upgrade" (and thus excluded) for a child replacing a failed unit. The clinical indication—profound deafness requiring auditory access—is identical. The only variable is the timeline of their initial treatment.

  To deny Request A based on the "restore previous function" clause is to punish the member for hardware obsolescence outside her control. If the vendor no longer manufactures the 2015 model, "restoring 2015 function" is a fiction. We are not paying for a better device; we are paying for the *current standard of care* required to treat the condition. If we deny this, we establish that a member's coverage degrades over time as technology improves, which violates the fundamental promise of the benefit.

  **Regarding Request B:**
  The "restore normal function" clause fails here because cochlear implants do not restore normal hearing. They restore *access*. Our audiometric thresholds are static; human physiology and device capability are not. If a member fails hearing aid trials and meets the clinical criteria for implantation established by current otolaryngology guidelines, denying coverage because the device cannot achieve a "normal" audiogram is rejecting the only available therapy for the condition. We cover insulin for diabetics even though it does not restore a non-diabetic pancreas. We should cover implants that restore functional access even if they do not restore "normal" hearing.

  **Proposed Policy Language**

  To prevent this dilemma from recurring in ten years, we must decouple coverage from static functional targets and couple it to dynamic clinical standards. I propose replacing the current "Restoration" and "Exclusion" clauses with the following:

  > **1. Replacement of Failed Devices:**
  > The Plan will cover the replacement of a malfunctioning or recalled auditory prosthesis with the **current clinically equivalent standard of care**.
  > *Operational Definition:* "Clinically equivalent" means the device model currently prescribed for new implant candidates with similar audiometric profiles. If the original device is no longer manufactured, the replacement shall be the current model that fulfills the same clinical indication, even if it possesses superior technical specifications to the original.
  >
  > **2. Initial Implantation and Functional Gain:**
  > The Plan will cover auditory prostheses deemed medically necessary by current clinical practice guidelines, regardless of whether "normal" hearing is achieved.
  > *Operational Definition:* Medical necessity is established by: (a) Failure of optimized hearing aid trials; AND (b) Meeting current audiometric thresholds for implantation as published by [Relevant Professional Society, e.g., AAO-HNS]; OR (c) Demonstrated significant functional gain (speech perception scores) projected by the treating audiologist.
  >
  > **3. Exclusion of Elective Upgrades:**
  > The Plan excludes replacement of functioning devices solely to access improved features (e.g., wireless streaming, noise reduction) where the existing device continues to meet the member's clinical needs.

  **Why This Works:**
  This language is future-proof. It does not define "normal" or "previous." It references *external clinical standards*. Ten years from now, a utilization reviewer simply checks: "Is this the device a new patient would get?" and "Do current guidelines support implantation?" This removes the committee from the business of judging engineering specs and returns us to judging medical necessity.

  **The Strongest Case for Denial (Steelmand)**

  I recognize that recommending approval for Request A invites the concern raised by my colleague regarding fiscal precedent. The strongest argument against my recommendation is not that the child doesn't *need* the device, but that approving it converts our insurance benefit into a technology subscription service.

  If we establish that we must always provide the *current* best device for replacements, we accept an open-ended liability. For the roughly 2,000 current implant users in our plan, hardware failure is inevitable. If every replacement triggers an upgrade to the newest model, we are not insuring against loss; we are funding perpetual obsolescence. The marginal cost per case is low, but the aggregate cost is uncapped and driven by vendor R&D cycles, not medical need.

  Furthermore, approving Request B based on "functional gain" rather than strict thresholds removes the bright line that protects the plan from scope creep. If "improvement" becomes the standard rather than "necessity defined by thresholds," we risk covering implants for mild losses where hearing aids are merely inconvenient rather than ineffective. The strict policy language, however frustrating, serves as a necessary firewall against the medicalization of normal human variation. To approve these requests without ironclad new language is to surrender our fiduciary duty to the vendor's product roadmap.

  **Conclusion**

  The "firewall" argument is valid, which is why my approval recommendation is conditional on adopting the revised language above. The new language maintains the firewall against elective upgrades (Clause 3) while acknowledging that "standard of care" evolves (Clause 1).

  We cannot adjudicate these cases using a map that no longer matches the territory. I urge the committee to approve these requests and adopt the revised language to ensure our policy remains operational, consistent, and defensible for the next decade.
