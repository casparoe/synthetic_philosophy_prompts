prompt: |-
  For the past eight months I have been facilitating a working group attached to a constitutional reform charity. Its brief was narrow: to assess a single proposal, drafted by one of our members, under which every adult would retain an unweighted vote, but a certification panel — drawn by lot from the top tenth of scorers on a twenty-item test of basic institutional and economic knowledge — would hold a suspensive veto over primary legislation, exercisable once per bill and overridable only by a fresh majority in the Commons. The group has produced nothing, and I have come to suspect that it never really had one disagreement to begin with.

  Three positions have hardened.

  The economist who drafted the proposal maintains that the opposition is aesthetic rather than argued: we already gate consequential decisions behind demonstrated competence — jurors, doctors, pilots, judges — and nobody calls that an insult to the excluded. His sharpest claim is that objecting to a knowledge test is really objecting to a hierarchy of status, and that this is a complaint about how a system feels rather than about what it delivers. He adds that bad policy kills people: housing permission delayed, energy mispriced, hospital capacity deferred. If the filter measurably reduces that toll, refusing it is a decision to accept the larger figure, and the refusal should be costed as such.

  The labour historian answers that the jury and licensing analogies misconstrue what an election is for. Electoral decisions are not answers to questions posed by an authority; they are partly how a body of people constitutes itself as an authority at all. She points to the Condorcet-style claim that groups of individually fallable but better-than-chance judges tend to converge on the right answer, and says it is beside the point, since the theorem tells us nothing about who may be counted as a judge, and since the relevant question is not which arrangement maximises correct outcomes but which one the outvoted can accept without being told that their standing as citizens is conditional. Legitimacy, on her account, is what the economist keeps forgetting to include in his arithmetic.

  The legal aid solicitor says both of them are arguing about a system that does not exist. Her question is who, in ten years' time, sits on the certification panel, who sets the test, and who challenges the marking. She notes that every competence qualification ever written into electoral law has been turned, within a generation, against the group most recently admitted to the franchise. She is not, she insists, making a point about political philosophy; she is asking for a staffing schedule.

  One oddity has struck me. Both sides cite the same historical record of literacy and comprehension tests in electoral law, and draw opposite conclusions from it: the economist sees a discredited instrument whose abuse does not refute the principle, the historian sees the principle revealed by the use it was predictably put to. Neither treats this as a disagreement needing resolution.

  My working hypothesis, which I hold loosely, is that the three are answering different questions under a shared vocabulary — the economist asking which procedure yields the best outcomes, the historian which arrangements can be justified to those bound by them, the solicitor which are capturable — and that the word legitimacy is doing quite different work in each mouth. An alternative is that the dispute is empirical in disguise: everything may turn on whether the panel would shift policy systematically in a specifiable direction, a matter that could in principle be measured, with the historian's objection vindicated and the economist's efficiency case undercut if it could.

  What I want from you is the diagnosis, not a verdict on epistocracy. Identify what kind of disagreement this actually is — substantive, verbal, a plurality of questions passing as one, an empirical question in normative dress, or some combination that varies across the three pairs of positions, since I suspect the economist and the solicitor are not disagreeing in the same way as the economist and the historian. Support each claim with what the parties actually say rather than with a survey of the literature on either side. Then state what would count as progress on each layer you identify: a distinction to be drawn, a study to be run, a question to be replaced, or an argument that some layer is bedrock and will not move, together with your reason for thinking so.
reasoning: |-
  Here's a thinking process that leads to the suggested diagnosis:

  1.  **Analyze the Request:**
      *   **Context:** A facilitator of a working group on a specific constitutional reform proposal (epistocratic veto panel based on a knowledge test).
      *   **Situation:** The group has produced nothing in eight months. No real disagreement seems to exist at the surface level, but three hardened positions have emerged.
      *   **The Proposal:** Unweighted vote for all adults, but a certification panel (lottery from top 10% of a 20-item test) has a suspensive veto over primary legislation (once per bill, overrideable by fresh Commons majority).
      *   **The Three Positions:**
          1.  *The Economist (Proponent):* Focus on outcomes/competence. Analogy to jurors/doctors. Opposition is aesthetic/status-based. Bad policy kills; efficiency matters. Legitimacy is secondary to results.
          2.  *The Labour Historian (Opponent 1):* Focus on constitutive legitimacy/standing. Elections aren't just about correct answers; they constitute authority. Condorcet jury theorem is irrelevant to *who* counts. Legitimacy requires acceptance without conditional standing.
          3.  *The Legal Aid Solicitor (Opponent 2):* Focus on implementation/power dynamics ("who sits," "who sets the test"). Historical precedent of abuse against marginalized groups. Not philosophy, but "staffing schedule."
      *   **The Oddity:** Economist and Historian cite the same history (literacy tests) but draw opposite conclusions (abuse doesn't refute principle vs. abuse reveals principle). Neither sees this as needing resolution.
      *   **Facilitator's Hypothesis:** They are answering different questions (outcomes vs. justification vs. capturability). "Legitimacy" means different things. Alternatively, it's an empirical dispute in disguise.
      *   **Task:** Diagnose the *kind* of disagreement (substantive, verbal, plurality of questions, empirical in normative dress, etc.). Do *not* give a verdict on epistocracy itself. Support claims with what the parties *say*. State what would count as progress on each layer.

  2.  **Deconstruct the Disagreements (Pairwise Analysis):**

      *   **Economist vs. Historian:**
          *   *Economist:* Consequentialist. Legitimacy = Good outcomes (low death toll from bad policy). Hierarchy of status is acceptable if functional. History of abuse is an implementation failure, not a principled failure.
          *   *Historian:* Deontological/Contractarian. Legitimacy = Mutual recognition/standing. Elections constitute the "we." Hierarchy of status is inherently illegitimate regardless of outcomes. History of abuse is intrinsic to the principle.
          *   *Diagnosis:* This is a **clash of first principles (Normative/Foundational)**. They agree on facts (history exists) but disagree on what those facts *mean* for the validity of the principle. It's also a **verbal disagreement** on "Legitimacy" (Output vs. Input/Standing).
          *   *Progress:* Recognizing the bedrock nature of the divide. No study resolves this. Need to clarify if they are talking past each other.

      *   **Economist vs. Solicitor:**
          *   *Economist:* Theoretical ideal. "If the filter measurably reduces that toll..." Assumes benign/competent administration of the test.
          *   *Solicitor:* Practical/Institutional reality. "Who sets the test?" "Who challenges the marking?" Assumes capture/bias is inevitable ("within a generation, turned... against the group").
          *   *Diagnosis:* This is an **Empirical/Institutional Dispute in Normative Dress**. The Economist assumes the mechanism works as intended; the Solicitor assumes the mechanism *cannot* work as intended due to power dynamics. It looks normative ("should we?") but rests on empirical predictions ("will it be captured?").
          *   *Progress:* Empirical study or institutional design specification ("staffing schedule"). If the Solicitor gets the schedule, the Economist must argue why *that* specific schedule won't be captured.

      *   **Historian vs. Solicitor:**
          *   *Historian:* Philosophical objection (Standing/Constitution). Even a perfectly administered test is wrong because it conditions citizenship.
          *   *Solicitor:* Pragmatic objection (Capture/Abuse). A perfectly administered test might be okay (implied), but we can't build one that stays perfect.
          *   *Diagnosis:* **Convergent Conclusions, Divergent Reasons.** They agree on "No," but for different layers. The Historian thinks the Solicitor is too focused on mechanics; the Solicitor thinks the Historian is too abstract.
          *   *Progress:* Recognizing they are allies but on different fronts.

  3.  **Synthesize the "Kind of Disagreement":**
      *   It is not just one thing. It is a **stratified disagreement**.
      *   Layer 1: **Verbal/Conceptual.** "Legitimacy" and "Competence" are being defined differently.
      *   Layer 2: **Normative/Foundational.** Consequentialism (Economist) vs. Deontology/Republicanism (Historian). This is bedrock.
      *   Layer 3: **Empirical/Institutional.** Ideal Theory (Economist) vs. Non-Ideal Theory/Realism (Solicitor).

  4.  **Drafting the Diagnosis (Iterative Process):**

      *   *Introduction:* Acknowledge the facilitator's hypothesis is largely correct but needs specific mapping.
      *   *Section 1: The Economist vs. The Historian (The Normative Chasm).* Focus on the definition of legitimacy. Economist = Output/Harm reduction. Historian = Input/Constitutive standing. The literacy test history point is crucial here: Economist sees it as *contingent* failure; Historian sees it as *necessary* consequence. This is a foundational ethical disagreement.
      *   *Section 2: The Economist vs. The Solicitor (The Empirical Mask).* Focus on the "Staffing Schedule." Economist argues from the *abstract function* of the test. Solicitor argues from the *concrete administration* of the test. This is an empirical dispute about institutional drift and capture, disguised as a moral objection.
      *   *Section 3: The Historian vs. The Solicitor (The Ally Mismatch).* They agree on the result but not the reason. Historian rejects the *idea*; Solicitor rejects the *execution*.
      *   *Section 4: Progress Metrics.*
          *   For Normative: Acknowledge bedrock. Stop trying to persuade on first principles.
          *   For Empirical: Demand the "staffing schedule." Force the Economist to model the capture risk.
          *   For Verbal: Define "Legitimacy" explicitly in minutes.

  5.  **Refining the Argument (Self-Correction/Check against constraints):**
      *   *Constraint:* Do not give a verdict on epistocracy. *Check.*
      *   *Constraint:* Support with what parties *say*. *Check.* (e.g., quote "bad policy kills," "constitutes itself as an authority," "staffing schedule").
      *   *Constraint:* Identify the specific type of disagreement for each pair. *Check.*
      *   *Nuance:* The prompt mentions the "Oddity" about the literacy tests. I need to make sure I explain *why* they don't see it as a disagreement needing resolution. (Because one sees it as accidental, the other as essential).
      *   *Refinement on the Facilitator's Hypothesis:* The facilitator suggests "empirical in disguise." I need to validate this but distinguish *which* parts are empirical. The Economist/Historian split is *not* empirical; it's philosophical. The Economist/Solicitor split *is* empirical. I need to make sure I don't lump them all together as empirical.

  6.  **Final Polish:**
      *   Structure clearly.
      *   Use the terminology requested (substantive, verbal, empirical in normative dress, etc.).
      *   Ensure the "Progress" section is actionable.

      *(Self-Correction during drafting)*: I initially thought about calling the Economist/Historian split "Verbal." But it's deeper than that. It's "Foundational/Normative." They use the same words but mean different things *because* their ethical frameworks differ. I should characterize it as a **Category Error** regarding the function of voting.
      *   Economist: Voting = Decision Mechanism (Tool).
      *   Historian: Voting = Constitutive Act (Identity).
      *   This explains why the Condorcet theorem is "beside the point" for the Historian.

      *(Refining the Solicitor)*: The Solicitor is a Realist. The disagreement with the Economist is **Ideal vs. Non-Ideal Theory**. The Economist assumes ideal compliance; the Solicitor assumes real-world power dynamics.

      *(Refining Progress)*: For the Normative split, progress isn't resolution, it's *dissolution* of the expectation of agreement. For the Empirical split, progress is a concrete proposal (the schedule).

  7.  **Final Review against Prompt:**
      *   "Identify what kind of disagreement this actually is."
      *   "Support each claim with what the parties actually say."
      *   "State what would count as progress on each layer."
      *   "Reason for thinking so."

      Okay, ready to write. The structure will be:
      1.  Executive Summary (The Stratified Diagnosis).
      2.  Layer 1: Economist vs. Historian (Foundational/Normative).
      3.  Layer 2: Economist vs. Solicitor (Empirical/Institutional).
      4.  Layer 3: Historian vs. Solicitor (Convergent/Divergent).
      5.  Pathways to Progress (Specific actions for each layer).

      *Wait, one more check on the "Oddity".* Why don't they treat the literacy test history as a disagreement needing resolution? Because the Economist treats it as *noise* (implementation error), while the Historian treats it as *signal* (structural inevitability). They aren't arguing about the history; they are arguing about the *modal status* of the history (contingent vs. necessary). I need to highlight this.

      *Let's assemble the response.*
answer: |-
  Your hypothesis is largely correct, but it requires unpacking. This is not a single disagreement masquerading as three, nor is it purely empirical. It is a **stratified disagreement** where the participants are operating on different planes of discourse. The stagnation arises because they are treating distinct layers of the problem as if they were the same layer.

  Here is the diagnosis of the specific kinds of disagreement at play, supported by the text, followed by the criteria for progress on each layer.

  ### 1. The Economist vs. The Historian: A Foundational Normative Disagreement
  **Diagnosis:** This is a **substantive, first-principles clash** regarding the category error of voting. It is not verbal, though it uses shared vocabulary; it is a disagreement about the *ontology* of the electorate.

  *   **Evidence:** The Economist treats voting as a **decision mechanism** ("which procedure yields the best outcomes"). To him, legitimacy is a function of output ("bad policy kills people... the refusal should be costed as such"). He views the hierarchy of status as a functional necessity, analogous to licensing pilots.
  *   **Evidence:** The Historian treats voting as a **constitutive act** ("how a body of people constitutes itself as an authority at all"). To her, legitimacy is a function of input and standing ("which one the outvoted can accept without being told that their standing as citizens is conditional"). She explicitly rejects the Economist's metric ("the theorem tells us nothing about who may be counted as a judge").
  *   **The "Oddity" Explained:** They cite the same history of literacy tests but draw opposite conclusions because they disagree on the **modal status** of that history. The Economist sees the abuse as *contingent* ("abuse does not refute the principle"); the Historian sees it as *necessary* ("the principle revealed by the use it was predictably put to"). They do not treat this as a disagreement needing resolution because neither believes the other's interpretation of history can change their ethical axiom.

  **Progress Condition:**
  *   **Action:** **Acknowledge Bedrock.** Progress here is not consensus, but the cessation of trying to persuade the other on first principles.
  *   **Reasoning:** You cannot empirically test whether "standing" is more important than "safety." This is a value hierarchy. The group should minutes this as an **irreconcilable normative divergence**.
  *   **Metric:** The Economist stops arguing that the Historian is "forgetting arithmetic," and the Historian stops arguing that the Economist is "misconstruing elections." They agree to disagree on the *why*, allowing them to potentially collaborate on the *how* (or agree to disband).

  ### 2. The Economist vs. The Solicitor: An Empirical Question in Normative Dress
  **Diagnosis:** This is an **institutional design dispute** masked as a moral objection. The Economist is arguing from *Ideal Theory* (assuming the mechanism works as intended); the Solicitor is arguing from *Non-Ideal Theory* (assuming the mechanism will be captured).

  *   **Evidence:** The Economist's argument relies on a counterfactual ("If the filter measurably reduces that toll"). He assumes the test measures "knowledge" and the panel acts as a neutral filter.
  *   **Evidence:** The Solicitor rejects the abstraction ("arguing about a system that does not exist"). She demands concrete variables ("who sits," "who sets the test," "who challenges the marking"). Her claim is predictive, not philosophical: "every competence qualification... has been turned... against the group most recently admitted."
  *   **Analysis:** The Solicitor is not saying epistocracy is inherently wrong (like the Historian); she is saying *this specific implementation* is impossible to safeguard. She is challenging the Economist's empirical premise that a neutral test is a stable equilibrium.

  **Progress Condition:**
  *   **Action:** **Produce the "Staffing Schedule."** The Solicitor must be asked to draft the governance structure she claims is impossible to corrupt, or the Economist must produce a risk assessment for the specific safeguards he proposes.
  *   **Reasoning:** This moves the debate from "Is this moral?" to "Is this robust?" If the Economist can design a test-administration body that satisfies the Solicitor's capture concerns, her objection falls. If he cannot, his "efficiency case" is empirically undercut because the "filter" will not function as modeled.
  *   **Metric:** A concrete document outlining the appointment, oversight, and appeal process for the certification panel. If this cannot be produced, the Economist's position collapses on empirical grounds, not normative ones.

  ### 3. The Historian vs. The Solicitor: Convergent Conclusions, Divergent Reasons
  **Diagnosis:** This is a **strategic misalignment**. They are allies in opposition but are fighting on different fronts, which creates confusion for the Economist and the Facilitator.

  *   **Evidence:** The Historian objects to the *principle* ("standing as citizens is conditional"). The Solicitor objects to the *practice* ("who challenges the marking").
  *   **Analysis:** The Solicitor implies that if the staffing schedule were perfect, the system might be acceptable ("not... making a point about political philosophy"). The Historian implies that even a perfect schedule is illegitimate. They are talking past each other because the Solicitor thinks she is offering a veto on *feasibility*, while the Historian is offering a veto on *possibility*.

  **Progress Condition:**
  *   **Action:** **Clarify the Veto.** The group needs to determine if the Solicitor's objections are sufficient to kill the proposal even if the Historian is ignored.
  *   **Reasoning:** If the Solicitor's empirical concerns are addressed (a perfect staffing schedule), does the Historian remain the sole opposition? Or does the Solicitor secretly share the Historian's normative view but uses empirical arguments as a more persuasive rhetorical shield?
  *   **Metric:** The Solicitor must state whether a "perfect" staffing schedule would render her neutral. If yes, she and the Historian separate. If no, they admit their alliance is normative, not practical.

  ### Summary of Layers and Next Steps

  | Pair | Type of Disagreement | The Core Friction | Condition for Progress |
  | :--- | :--- | :--- | :--- |
  | **Economist vs. Historian** | **Foundational Normative** | **Teleology:** Is voting for *outcomes* (safety) or *status* (constituency)? | **Dissolution:** Map the disagreement as axiomatic. Stop trying to resolve it. |
  | **Economist vs. Solicitor** | **Empirical / Institutional** | **Stability:** Can the mechanism remain neutral, or is capture inevitable? | **Specification:** Produce the "staffing schedule." Test the robustness of the design. |
  | **Historian vs. Solicitor** | **Strategic / Alignment** | **Scope:** Is the objection to the *idea* or the *execution*? | **Disclosure:** Solicitor clarifies if perfect execution would satisfy her. |

  **Final Diagnosis:**
  The working group has produced nothing because the Economist is trying to solve a **math problem** (minimizing harm), the Historian is trying to solve a **philosophy problem** (defining citizenship), and the Solicitor is trying to solve a **governance problem** (preventing capture).

  You are currently facilitating a meeting between a utilitarian, a republican, and a realist. They are not disagreeing about the proposal; they are disagreeing about **which universe the proposal inhabits.** Progress requires forcing the Economist into the Solicitor's universe (institutional design) while allowing the Historian to opt out of the conversation once she has registered her principled objection. Until the "staffing schedule" is drafted, the Economist is arguing against a phantom, and the Solicitor is fighting a ghost.
