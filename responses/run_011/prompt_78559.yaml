      (Writing...)
      To: Finance Committee
      From: Council Member
      Subject: Recommendation on Local Currency Pilot

      This vote requires us to choose between a philosophical ideal and a balance sheet. The proposal leans heavily on George Berkeley's economic insight: money is not wealth itself, but a ticket commanding industry. If money sits idle, it fails its purpose. Berkeley argues a nation's richness lies in the motion of labor, not gold in vaults. Under this view, the pilot's ninety-day expiry is not a bug; it is the core feature. It prevents hoarding and forces velocity. It ensures the token does what money is supposed to do: circulate.

      However, Berkeley wrote for an 18th-century Ireland starving for coin, largely closed off from external trade. We are a mid-size town embedded in a global dollar economy. This distinction is fatal to a pure Berkeleyan approach and validates our skeptical banker's primary objection: leakage. Our merchants purchase inventory from distributors two counties away who will not accept local tokens. If a merchant accepts tokens but cannot pay suppliers with them, the token becomes a loss leader. Berkeley's model assumes a closed loop where local industry feeds local consumption. Here, value walks out the door. We cannot legislate supply chains. This objection must stand as the primary risk factor.

      Therefore, I recommend approval, but only with conditions that reconcile Berkeley's velocity with the banker's risk management.

      First, keep the ninety-day expiry. This aligns with the goal of stimulus velocity. Without it, the token becomes a savings instrument, defeating the purpose of local stimulation.

      Second, limit city acceptance to trivial fees like parking and pool entry. Do not accept tokens for permit fees or property taxes. These revenues fund essential services and state mandates requiring hard currency. Accepting tokens here creates a fiscal mismatch where we collect scrip but owe dollars.

      Third, shift distribution emphasis from the food bank to payroll matching. The banker's stigma objection is psychologically astute. If tokens are associated primarily with welfare, merchants may quietly refuse them or discount them, creating a two-tier pricing system. Payroll integration frames the token as earned value, increasing merchant confidence.

      Fourth, remove the 10% haircut clause regarding city conversion. The banker is correct on objection (c): a convertible token without reserve assets is a contingent liability. If residents can exchange tokens for dollars at city hall, we carry a debt without an asset. Berkeley views money as a token, not a promise of gold. We should treat it as such. Remove the city-backed guarantee. Let merchants decide their own cash-out policies if they wish, but the city must not sit on a potential liability.

      Finally, cap the initial issuance at $100,000 rather than $250,000. Given the leakage risk, we must treat this as a controlled experiment. We need to measure whether tokens actually circulate among local businesses or simply accumulate at the point of sale before expiring.

      Berkeley teaches us that money must move to create wealth. The banker teaches us that money must be backed to remain credible. We can honor both by ensuring motion while strictly limiting liability.

      Verdict: APPROVE WITH CONDITIONS — Eliminate city convertible liability; cap issuance to test leakage.

