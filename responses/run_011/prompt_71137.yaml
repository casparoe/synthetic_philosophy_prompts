      *   *Verdict:* Family 2 is the only one that *attempts* to save the a priori claim, but it requires accepting a robust metaphysics of agency.

  5.  **Address the "Prying Apart" Question:**
      *   Can CC and CW be distinct?
      *   *Standard View:* Yes. CC is about logical/physical possibility of the *action*. CW is about the rational coherence of the *volition*.
