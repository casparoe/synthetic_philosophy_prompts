  2.  **Deconstruct the Kantian Problem (CC vs. CW):**
      *   *Contradiction in Conception (CI):* The maxim becomes impossible in a world where everyone follows it. (e.g., False promising: If everyone falsely promised, the institution of promising collapses, so the act becomes impossible). -> Perfect Duties.
      *   *Contradiction in the Will (CW):* The maxim *can* exist universally, but a rational agent cannot *will* it. (e.g., Non-beneficence: A world without help is conceivable, but you can't will it because you might need help). -> Imperfect Duties.
      *   *The User's Worry:* The CW test seems to rely on "I might need help," which is empirical/contingent. If I were self-sufficient (like a god), could I will non-beneficence? If so, is the duty contingent on my weakness?

  3.  **Analyze the Two Families of Reply:**

      *   **Family 1: The Self-Defeating Purpose (Instrumental/Prudential reading).**
          *   *Idea:* If everyone does X, my specific goal in doing X becomes impossible.
          *   *Critique:* This looks like rule-utilitarianism or prudence. "Don't lie because if everyone lies, lying won't work."
          *   *Problem for Kant:* This relies on the agent having specific empirical ends. If I don't care about the outcome, the contradiction vanishes. This fails the "a priori" test.

      *   **Family 2: The Necessary Ends of Rational Agency (Constitutive reading).**
          *   *Idea:* There are certain ends that *every* rational being *necessarily* wills simply by virtue of being a rational agent. (e.g., the development of talents, the furtherance of others' ends).
          *   *Mechanism:* It's not "I need help contingently." It's "To will an end is to will the means/conditions necessary for agency itself."
          *   *Key Concept:* *Humanity as an End in Itself.* We necessarily value our own rational capacity. To will a world where that capacity is undermined (by no one helping anyone) contradicts the valuation of agency inherent in willing anything at all.
          *   *Benefit:* Keeps it a priori. It's not about *my* specific needs, but the structural requirements of rational volition.

  4.  **Evaluate the "Zero Empirical Assumptions" Claim:**
      *   Family 1 fails this. It relies on "I will likely need help."
