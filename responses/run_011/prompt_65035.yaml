      *   *Critique:* How is this different from "virtue epistemology"? *Correction:* Virtue epistemology often focuses on the *agent's* character, but still often evaluates the *belief* as the locus of value. Portability evaluates the *process's future potential*. It's more pragmatic/instrumental.
