  2. **The break**
  Step (5) fails because it treats "India was impoverished" as requiring the same speculative baseline as "India was improved." The pro-empire claim asserts positive creation: that Britain built capabilities India lacked. This requires a specific alternative history of successful independent industrialization, which is indeed unknowable. The anti-empire claim, however, often asserts negative extraction: that specific policies (taxation, tariff barriers, famine relief refusal) actively reduced welfare relative to existing trends or capacity. We do not need to know exactly how rich India *would* have been to know that draining revenue caused poverty. The inference from (4) to (5) looks valid only if "baseline" means the same thing in both cases. It doesn't. For the pro-empire side, the baseline is a successful modernizing state (high bar). For the anti-empire side, the baseline is often continuity of pre-existing economic trajectories (lower bar). Furthermore, historical knowledge isn't binary (knowable/unknowable); it's probabilistic. Step (2) sets a standard of certainty that history cannot meet, but Step (5) pretends this limitation hurts both sides equally. It doesn't. We have direct archival evidence of colonial intent and mechanism (e.g., export of grain during famine) that doesn't require a full alternative timeline to judge as harmful. The logic collapses because it conflates "uncertainty about the magnitude of the alternative" with "uncertainty about the direction of causal impact." The argument assumes that because we can't simulate the *whole* world, we can't identify *specific* causes. This is the "perfect solution fallacy." Just because we can't know the exact GDP of a hypothetical Maratha Empire doesn't mean we can't know that British tax policy reduced peasant consumption. Step (5) smuggles in a requirement for total knowledge to validate partial knowledge. The transition from (4) to (5) relies on the idea that if the pro-empire counterfactual is weak, the anti-empire counterfactual must be equally weak. But the anti-empire claim often relies on *actual* data points (famine deaths) compared to *capacity* (food availability), not just a rival timeline. The symmetry is illusory. One side argues from absence of evidence (India didn't industrialize); the other argues from evidence of presence (India starved despite food). Step (5) ignores this distinction, treating all counterfactuals as equally distant from reality.

  3. **Why it walked**
  Premises (1) through (3) feel safe because they rely on intuitive definitions of counterfactuals and the obvious arbitrariness of nationalist "what ifs." Step (2) sounds like rigorous methodology rather than skepticism. The trick is in the word "knowable." In (4), "not knowable" means "we can't calculate the exact net sum." In (5), it shifts to mean "we can't assert any causal relationship." You quietly change "knowable" from "quantifiable with precision" to "assertable with confidence." This allows the skepticism to metastasize from "we can't score the game" to "we don't know who played." Each step individually looks like modest epistemic humility, but together they build a wall against causal inference itself. The transitions rely on equivocation. Step (3) establishes that specific alternative histories are arbitrary, which is true. Step (5) assumes that *any* claim of harm requires a specific alternative history, which is false. We can identify harm by comparing actual outcomes to physical capacity or immediate precedent, not just divergent timelines. The argument feels valid because it mimics the structure of a logical proof, but the terms shift weight between steps. The comfort comes from treating history like mathematics, where variables must be controlled. But history is forensic, not experimental. You feel safe because you are critiquing speculation, but you end up critiquing evidence. The slide deck feels rigorous because it demands high standards, but those standards become impossible ones. By the time you reach (7), the definition of "know" has stretched until it snaps.

  4. **Price list**
  Rejecting (1) means redefining "good/bad" as non-counterfactual, perhaps purely internal metrics, which collapses moral evaluation into description. You lose the ability to say rule was "bad" if it was better than the alternative, limiting ethical judgment. It makes "good" synonymous with "intended," which is historically useless. Rejecting (3) is costly; it requires defending a specific Maratha or Mughal modernization path as historically probable, which invites the very cherry-picking you rightly distrust. You would have to argue a specific baseline is defensible, weakening your critique of Ferguson. You would have to become a nationalist historian to defeat the imperialist one. Rejecting (5) is the cheapest option. It costs you the symmetry of your skepticism. You must admit that while we cannot calculate the *exact* GDP loss of empire, we can confidently assert specific causal harms. You pay the price of nuance: you can no longer say "both sides are equally unprovable." Instead, you must argue that one side bears a heavier burden of proof than the other. This is pedagogically richer anyway. It moves the seminar from "who wins" to "what counts as evidence." You retain the critique of pro-empire speculation without surrendering the reality of colonial harm. This preserves your moral intuition while keeping your methodological rigor intact. You sacrifice the elegance of total skepticism for the messiness of historical judgment. This is the correct trade for a teacher. It allows you to condemn famine without pretending to know the GDP of a hypothetical Republic of India.

  5. **What survives**
  You can assert that colonial policy exacerbated famine mortality, resting on demographic data and administrative correspondence showing grain exports during shortages. You can claim revenue extraction reduced local investment capacity, based on tax records and capital flow data. You can argue textile deindustrialization occurred, supported by trade volumes and employment shifts. These rest on direct archival evidence and comparative economic data, not full-world simulations. You can teach that while the *net* balance is debated, the *mechanisms* of extraction are documented. The slide should list specific policies and their documented effects, avoiding totalizing verdicts. Focus on causality, not summation. Students can evaluate whether specific actions were harmful without needing to solve the counterfactual problem. You can show that British policy changed the *distribution* of risk, even if the total wealth is unknowable. This shifts the debate from "was empire good?" to "who paid the cost?" It grounds the seminar in human experience rather than abstract accounting. You keep the moral stakes without the metaphysical baggage.

  6. **The residue**
  You must concede that the "balance sheet" metaphor itself is flawed. We cannot sum suffering and infrastructure into a single net number. The skeptic is right that totalizing verdicts ("Good" vs. "Bad") obscure more than they reveal. Tell the students that history offers causal explanations, not final judgments. Concede that we cannot know the *total* opportunity cost of empire, only the specific costs we can document. This preserves intellectual honesty without surrendering moral clarity. It acknowledges the limits of history while affirming its value.
