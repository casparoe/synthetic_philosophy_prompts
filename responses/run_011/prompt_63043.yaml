answer: |-
  ### Purpose and Scope

  You have specified two distinct jobs: (i) cross-cultural classification without normative smuggling, and (ii) actionable diagnosis for reformers, even in systems where patronage is the operating system rather than a bug. These jobs are in tension. A definition suitable for (i) must be thin enough to accommodate different political ontologies; a definition suitable for (ii) must be thick enough to identify a pathology worth curing. The following desiderata are derived from the cases and empirical constraints you provided.

  ### The Desiderata

  | Requirement | Rationale & Test Cases | Status |
  | :--- | :--- | :--- |
  | **1. Independence from Legality** | Corruption must be distinguishable from illegality. *Test:* Legal electoral manipulation and revolving-door lobbying must be classifiable as corrupt without changing the law. | **Non-Negotiable** |
  | **2. Independence from Private Gain** | Corruption must not require material enrichment of the actor. *Test:* The official destroying a file to damage a rival (sabotage) gains nothing but harms the function. | **Non-Negotiable** |
  | **3. Independence from a Benevolent Principal** | The definition cannot assume a principal exists who *wants* to stop the corruption. *Test:* In patronage systems, the "principal" (the boss/patron) often orders the corruption. | **Non-Negotiable** (for your Goal ii) |
  | **4. Distinction from Ordinary Self-Interest** | Must distinguish pursuing interest within rules vs. subverting rules for interest. *Test:* A politician seeking re-election is not corrupt; one who rigging the count is. | **Non-Negotiable** |
  | **5. Sensitivity to Local Norms (with limit)** | Must account for customary obligations. *Test:* The wedding gift. Refusal is an insult; acceptance is normative. The theory must explain why this differs from a bribe. | **Contested** (See "Unsatisfiable Pairs") |
  | **6. No Public/Private Ontology** | The definition cannot rely on a hard distinction between state and private spheres. *Test:* The private procurement manager and the public official behave identically; the theory should treat the mechanism, not the legal status, as primary. | **Parochial** (if required) |
  | **7. No Identifiable Victim Requirement** | Corruption cannot require a specific, immediate victim. *Test:* Diverting funds to a school in one's own district harms the *system* of allocation, even if the district benefits. | **Non-Negotiable** |
  | **8. Empirical Decoupling** | Must allow corruption to coexist with growth, and perception to diverge from experience. *Test:* High-growth/high-corruption regimes vs. stagnant/clean ones. | **Non-Negotiable** |
  | **9. Operational Detectability** | Must license observable predictions beyond "people say it exists." *Test:* Must predict behavioral patterns (e.g., price of service, speed of delivery) distinct from mere survey data. | **Non-Negotiable** |

  ### Hard Constraints and Contested Ground

  **The Public/Private Distinction: Prejudice, Not Discovery**
  The demand that corruption be defined relative to a breach of the "public trust" or a blurring of "public and private" roles is a prejudice of liberal state theory. It fails your second job. In a neopatrimonial system, the state *is* a private household writ large. An official treating the treasury as a personal wallet is not confusing spheres; they are operating correctly within the local ontology. If your definition requires a public/private split, you cannot analyze patronage systems without declaring them ontologically impossible. A robust account must define corruption as the subversion of *claimed* duties, regardless of whether those duties are formally public or private.

  **The Victim Requirement: It Does Not Survive**
  The demand that corruption always harm identifiable victims collapses under the "particularism" and "sabotage" cases. If an official diverts funds to build a school in her own district, the constituents benefit. If an official destroys a file to hurt a rival, the rival is harmed, but the *corruption* lies in the subversion of the administrative process, not the personal loss. The harm is often diffuse (erosion of systemic reliability) or counterfactual (the better allocation that did not happen). A theory requiring a crying victim cannot capture systemic rot.

  **Unsatisfiable Pairs: Cultural Neutrality vs. Reform Utility**
  There is a genuine contradiction between Requirement 5 (Sensitivity to Local Norms) and Goal (ii) (Usable for Reform in Patronage Systems).
  *   **The Conflict:** If you define corruption relative to local norms to satisfy cultural neutrality, then in a patronage system, patronage is *not* corruption—it is the norm. You cannot classify it as a pathology without importing an external standard (e.g., universalism, impartiality).
  *   **The Consequence:** You cannot have a definition that is both perfectly culturally neutral *and* useful for dismantling patronage. To reform a patronage system, you must assert that its normative baseline is wrong. You must choose: either you are an anthropologist describing a system (where patronage is valid), or a reformer prescribing a change (where patronage is corrupt). You cannot be both simultaneously with the same definition. For your stated goals, **Requirement 5 must be weakened**: the account must distinguish between *customary practice* and *functional duty*, even if the custom violates the duty.

  **The Single Most Constraining Requirement**
  **Requirement 3 (Independence from a Benevolent Principal)** does the most work in ruling out candidate accounts. This is the specific constraint that breaks the Principal-Agent tic you identified. Most standard theories assume someone at the top wants the corruption to stop. By requiring the theory to function when the "Principal" is the source of the corruption (or when no Principal exists to enforce rules), you immediately invalidate any model relying on top-down monitoring or incentive alignment as the *definition* of the problem. This forces the theory to account for collective action problems and systemic equilibria.

  ### Scoring the Four Families

  **1. The Office-and-Rules-Centered Account**
  This family defines corruption as the violation of formal rules associated with a specific office. It scores well on detectability and the legality distinction (if rules are broad), but it fails catastrophically on Requirement 3 and Requirement 5. In a patronage system, the "rules" are often fictive; following the formal rule might violate the operational norm, and vice versa. It cannot distinguish the wedding gift from the bribe if both are technically rule violations, nor can it handle legal corruption where no rules are broken. It is useful for auditing compliance in Weberian states but blind to governance in neopatrimonial ones.

  **2. The Market-Centered Account**
  This model treats the official's post as a business enterprise maximizing revenue. It handles the underpaid clerk and the kickback cases well, predicting price-setting behavior and service differentiation. However, it collapses the distinction between corruption and ordinary self-interest (Requirement 4) and fails the sabotage case (Requirement 2), as destroying a file yields no revenue. It also struggles with the "school in own district" case, which looks more like investment than revenue maximization. It is strong on prediction in petty corruption contexts but reduces grand corruption to mere monopoly pricing, missing the political function.

  **3. The Principal-Agent Account**
  This is the "tic" you identified. It scores perfectly on incentive design but fails Requirement 3 completely. It assumes a principal who desires honesty and an agent who deviates. It cannot model grand corruption where the principal is the beneficiary, nor systemic corruption where no principal exists to monitor. It treats corruption as a deviation from a functioning system rather than a mode of functioning itself. While useful for designing anti-corruption agencies in already-clean states, it is analytically blind to the systems you wish to reform, often misdiagnosing equilibrium behavior as individual moral hazard.

  **4. The Collective-Action Account**
  This model views corruption as a self-enforcing equilibrium where honesty is too costly for any individual to sustain. It satisfies Requirement 3 and Requirement 8 beautifully, explaining why growth and corruption can coexist and why monitoring fails. It handles the "underpaid clerk" and "patronage" cases as rational responses to systemic expectations. However, it risks defining corruption out of existence (if everyone does it, is it still corruption?) and struggles with Requirement 9 (detectability), as it describes a state of mind/belief rather than a specific act. It is the strongest fit for your second goal (reform in patronage systems) but the hardest to operationalize for specific classification without slipping into cultural relativism.
