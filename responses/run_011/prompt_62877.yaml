  **CONFIDENTIAL STRATEGY NOTE**
  **To:** 2L Board Member
  **Re:** The Nuremberg/Tokyo Analogy

  **Recommendation:** Do not include the Nuremberg/Tokyo analogy in the circulated memo.

  **Reasoning:** While the *legal principle* at stake (*nullum crimen sine lege*—no crime without law) is identical, the *historical weight* is not. Explicitly comparing a student bus fund dispute to war crimes tribunals will trigger an emotional defensive reaction. Opponents will focus on the perceived hyperbole ("Are you calling us Nazis?") rather than the legal argument about retroactivity. It undermines your credibility as a neutral arbiter.

  However, the *logic* of that seminar paper should underpin your analysis. The Nuremberg prosecutors argued that aggressive war was already criminalized by treaty (the Kellogg-Briand Pact), even if not codified in a statute. Here, the "treaty" is the Student Code. The Code explicitly requires rules to be "in force at the time." Relying on that text is the stronger, cleaner argument. It achieves the same result (protecting due process) without the inflammatory rhetoric. Stick to the text of the Code; let the historical gravity shape your conviction, not your prose.

  ***

  **MEMORANDUM**

  **TO:** Student Conduct Appeals Board Members
  **FROM:** [Your Name], Law Student Representative
  **DATE:** October 24, 2023
  **RE:** Disposition Recommendation – *In re Senate Funding Sanctions*

  **Recommendation**
  I recommend the Board **Reverse the finding of Liability** and vacate all sanctions. While the underlying conduct raises ethical concerns regarding self-dealing, the sanctions violate the Student Code's explicit prohibition on retroactive punishment. We cannot affirm a sanction based on a rule that did not exist when the conduct occurred.

  **The Governing Standard: The "In Force" Clause**
  Our authority is limited by the Student Code, which states conduct may only be sanctioned if it violated a rule "in force at the time of the conduct." The May Senate Resolution attempted to redefine permissible spending retroactively to the start of the academic year. While General Counsel correctly notes that constitutional *ex post facto* limits do not bind us as a private body, the *Student Code* does bind us. The Code is our constitution; a Senate Resolution is merely legislation. The Resolution cannot override the Code's due process protections. If we allow the Senate to redefine past conduct as punishable after the fact, we render the "in force" clause meaningless.

  **Notice and the October Denial**
  The Judiciary argued that the October denial of a similar request provided sufficient notice. This is unpersuasive for two reasons. First, the denial was not published as a precedent; it was an administrative decision known only to the applicants. A rule cannot be "in force" if the student body cannot access it. Second, the Code requires rules to be affirmative, not derived from ad hoc administrative rejections.

  Regarding the procedural irregularity—the Fund Chair pushing the disbursement through at the end of a long meeting without line-item review—this suggests sloppiness, not necessarily bad faith. While it supports the argument that the process was flawed, it does not prove the appellants knew they were violating a specific sanctionable rule. Ambiguity in the rules must be construed in favor of the accused.

  **Addressing the Counter-Argument: Self-Dealing and Loopholes**
  The strongest argument against reversal is that it rewards self-dealing. The appellants used their majority status to fund a political trip that benefited their coalition. Reversing liability risks signaling to future Senates that they can raid the initiative fund so long as no specific rule prohibits it yet.

  This risk is real, but the remedy cannot be retroactive punishment. Validating this sanction tells future student leaders that the Board will tolerate procedural overreach to achieve a "just" result. That creates more instability than it solves. We address the self-dealing concern not by punishing past conduct under new rules, but by clarifying future notice. We must ensure that "benefit of the student body" is defined prospectively so that future violations are clear.

  **Prospective Guidance on "In Force"**
  In reversing, the Board should issue guidance on what constitutes a rule "in force."
  1.  **Publication:** Administrative precedents (like the October denial) do not constitute binding rules unless published in a manner reasonably accessible to the student body.
  2.  **Specificity:** General phrases like "benefit of the student body" provide notice for civil recovery (clawing back funds) but are too vague for conduct sanctions (suspension) without further definition.
  3.  **Process:** Disbursements bypassing standard review should trigger audits, not immediate conduct sanctions, unless fraud is evident.

  **Conclusion**
  We can acknowledge the equities of the case—the appearance of impropriety is undeniable—without violating the Code. The "consider the equities" clause allows us to modify sanctions, but it does not allow us to invent liability where the Code forbids it. We should order the return of the funds (a civil equitable remedy) but vacate the conduct sanctions. This upholds the rule of law within our institution while preventing unjust enrichment.

  **Disposition:** Reverse Liability; Vacate Sanctions; Remand for Civil Restitution only.
