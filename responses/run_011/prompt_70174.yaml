answer: |-
  ### I. Candidate Rules Derived from Precedents

  Based on the six prior designations, the Panel operates under three latent rules that are jointly consistent with the track record. None of these rules adopt a purely "Lemkin-broad" standard; all remain tethered to the Convention's enumerated acts, but they vary in how strictly they interpret "intent to destroy the group as such."

  **Rule 1: The Biological-Continuity Principle (Derived from *Sarn*, *Tarnowa*, *Kessler*)**
  Genocide includes acts intended to destroy the group's biological capacity to reproduce or sustain its social cohesion through kinship, even without mass killing.
  *   *Survival Condition:* This rule survives only because *Tarnowa* (child transfer) and *Sarn* (sterilization) were designated despite low mortality.
  *   *Limitation:* It does not extend to pure cultural destruction (*Orvet* declined). The act must target the *people* (bodies, reproduction, kinship), not just their artifacts.

  **Rule 2: The Centrality/Heartland Doctrine (Derived from *Sarn*, *Kessler*, *Orvet*)**
  To establish intent to destroy the group "as such," the targeted population must constitute a demographically or institutionally critical mass of the group. Destroying a peripheral segment where the group's core institutions and majority population remain intact is insufficient.
  *   *Survival Condition:* This rule survives because *Sarn* (designated) stressed the province held "most of the group's global population and its holiest sites," whereas *Orvet* (declined) involved a quarter whose residents survived and reconstituted institutions abroad, and *Kessler* (designated) involved the territory holding the "majority of the group's population."
  *   *Limitation:* It creates a high bar for partial destruction.

  **Rule 3: The Specific Intent Threshold (Derived from *Veltyn*, *Marchfeld*, *Verdan* file)**
  Where documentary evidence allows a plausible non-genocidal explanation (class conflict, security counter-insurgency) that fits the facts as well as a group-destructive one, the benefit of the doubt goes to the state. Disproportionate impact is not enough; the *dolus specialis* must be the *only* reasonable inference or explicitly stated as group-targeting.
  *   *Survival Condition:* This rule survives because *Veltyn* (declined) found that class-based explanations for quotas negated group intent despite national rhetoric, and *Marchfeld* (declined) held that political class is not a protected group regardless of scale.
  *   *Limitation:* Explicit statements of group-targeting (as in *Kessler*) can override this, but ambiguous documents (*Veltyn*) cannot.

  ### II. Implications for the Verdan Valley

  *   **Under Rule 1 (Biological):** The leaked memorandum listing contraceptive and sterilization measures is a *Sarn*-type act. This favors **Designation**.
  *   **Under Rule 2 (Centrality):** The valley is "peripheral," holds "none of the group's holy sites," and the group is "larger today." This mirrors *Orvet* (survived/reconstituted) and contrasts *Sarn* (core destroyed). This favors **Decline**.
  *   **Under Rule 3 (Intent):** The memo states "final resolution of the valley question," not "the group question." The state has a confirmed insurgency justification. This mirrors *Veltyn* (security/class explanation available). This favors **Decline**.

  **Where They Part Company:** Rule 1 pulls toward Designation based on the *means* (sterilization/starvation). Rules 2 and 3 pull toward Decline based on the *scope* (peripheral subset) and *alternative explanation* (counter-insurgency). The vote will turn on whether Rule 1 trumps Rules 2 and 3 when the means are explicitly biological.

  ### III. Prediction of Vote and Reasoning

  **Prediction:** **Declined, 5–2.**

  **Reasoning:** The majority will find that while the acts (sterilization, subsistence deprivation) are enumerated, the *intent to destroy the group as such* is not established because the target was a peripheral subset, not the group's core. The fact that the national population is larger today is dispositive; it proves the group's biological continuity was not threatened "as such."

  **Distinguished Precedent:** The majority will most likely distinguish ***Sarn***.
  *   *The Move:* They will argue *Sarn* turned on the province being the "demographic and religious center." In *Verdan*, the file explicitly states the valley is peripheral with no unique institutions. Therefore, *Sarn* is not controlling for peripheral subsets.
  *   *Secondary Distinction:* They will distinguish *Kessler* on the basis that *Kessler* involved the "majority of the group's population," whereas Verdan is 180,000 out of 4 million (4.5%).

  **Closest Analog:** ***Sarn Province***.
  *   *Respects in which it is Analogous:* Both involve compulsory sterilization/contraception and restrictions on marriage/reproduction of a religious minority. Both involve state confinement/control of a specific territory.
  *   *Respects in which it is Disanalogous:* *Sarn* targeted the "holiest sites" and "most of the group's global population." *Verdan* targets a border valley with no holy sites and a small fraction of the population. *Sarn* resulted in the destruction of the group's capacity to reproduce *in that center*; *Verdan* residents were permitted to leave and resettle among co-religionists, preserving the group's national birth rate.

  ### IV. Principles and Fault Lines

  If the precedents underdetermine the case (which they do, given the tension between *Sarn*'s means and *Orvet*'s scope), the choice is between two principles:

  1.  **Principle of Designation:** Any state program employing biological destruction (sterilization/famine) against *any* identified segment of a protected group constitutes genocide, regardless of whether the group's core survives. This treats the *act* as the crime, not the *outcome*.
  2.  **Principle of Decline:** Genocide requires an existential threat to the group's continuity "as such." If the group survives and thrives nationally, targeting a peripheral subset is a crime against humanity or war crime, but not genocide.

  **Viability Across the Docket:** The Panel could live with the **Principle of Decline** across the rest of the docket. You noted next year's docket includes "two cases of wholesale cultural destruction with no killings." If the Panel adopts the Principle of Designation for Verdan (biological acts on a subset = genocide), it creates pressure to designate the cultural cases (cultural acts on a subset = genocide). If they Decline Verdan based on the "Group As Such/Existential Threat" principle, they have a consistent shield to Decline the cultural cases next year without contradicting themselves.

  **The Veltyn Fault Line:** The 4–3 split in *Veltyn* tells us the Panel's fault line runs through **Inference of Intent**.
  *   The 3 Dissenters believe: Disproportionate impact + suggestive language = Intent.
  *   The 4 Majority believe: Alternative plausible explanation (class/security) = No Intent.
  *   In *Verdan*, the 3 *Veltyn* dissenters will likely vote to Designate (because the memo is explicit, unlike *Veltyn*'s ambiguous documents). To reach 5 votes to Designate, they need to flip 2 of the *Veltyn* majority. To reach 5 votes to Decline, they need to keep the *Veltyn* majority and flip 1 of the *Sarn* majority. Given the "False Positive is costly" charter constraint and the "Group Larger Today" fact, the *Veltyn* majority will hold, and the *Sarn* centrality voters will defect.

  ### V. The Single Discriminating Fact

  The single additional fact that would most sharply discriminate among the surviving rules is: **Whether the sterilization memorandum was applicable only to women in the valley or to all women of the religious minority nationally.**

  *   *If Valley-Only:* Supports Decline (Rule 2: Centrality fails; Rule 3: Security justification plausible for a conflict zone).
  *   *If Nationally-Applicable:* Supports Designation (Rule 1: Biological destruction of the group "as such" is proven; Rule 2: Centrality becomes irrelevant because the whole group is targeted).

  ### VI. The "Lemkin-Broad" Question

  **Your colleagues are wrong.** You are not running a Lemkin-broad operation.

  *   *Evidence:* *Orvet* (Declined) explicitly treated the destruction of shrines, archives, and cemeteries as insufficient, despite the expulsion of residents. *Tarnowa* (Designated) appears cultural but was legally grounded in the transfer of children (Article 2(e)) and the severing of kinship, which the Panel treats as biological/social reproduction, not pure culture.
  *   *Conclusion:* You are running a **Convention-Plus Biological** standard. You go beyond the 1948 floor on *methods* (accepting sterilization and child transfer as genocidal even without mass killing), but you do *not* go beyond the 1948 floor on *targets* (cultural institutions alone do not count).
  *   *Strategy for Next Year:* For the upcoming cultural destruction cases, you cannot argue from *Tarnowa* unless you can reframe the cultural destruction as a mechanism for biological dissolution or child transfer. If the cases are purely "wholesale cultural destruction with no killings" and no child transfer, *Orvet* controls, and you must Decline unless you are prepared to expressly invoke the Charter's "ceiling" clause. If you invoke the ceiling clause for culture, you will fracture the 5-vote majority, as the *Orvet* 6–1 coalition will not move.
