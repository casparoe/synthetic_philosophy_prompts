prompt: |-
  Second-year epistemology seminar here, and I've got a slightly weird question about a proverb that has been doing a lot of unexamined work in my course.

  We did Gettier this week. I gave the short presentation — Smith and Jones and the ten coins, plus the Brown-in-Barcelona one — and afterwards this extremely confident guy leans back and goes "even a broken clock is right twice a day, that's all those cases are, who cares". Everyone laughed, the tutor let it slide and we moved on to causal theories. But a couple of weeks earlier the *same* tutor had used the same line to make what felt like the opposite point: someone objected that reliabilism lets lucky true beliefs count as knowledge, and she said something along the lines of "of course a stopped clock tells you the truth twice a day — that's exactly why you ask about the process across time and not about the single instance".

  So now I honestly can't tell what the sentence asserts. Can you take it apart for me? I want the different precise claims it could be making, ordered from the near-trivial up to the ones that would actually take a side in epistemology — is it a claim about how a belief can come out true, about whether it's well-founded or fitting, about whether the mechanism that produced it works across similar cases, about how much credit the believer deserves, about whether truth is even the target to be aiming at, or about the difference between being right and being right for the right reasons? For each reading, say whether it's a platitude everyone should accept, whether it's contentious, and whether it's actually true as stated. Also — does it matter whether the clock is stopped dead or merely running slow? I couldnt work out if that changes anything and I have a feeling it might.

  Then the bit I actually need: which reading does the guy's "who cares" require in order to be a fair reply to Gettier at all, and does he get it? And do his use and the tutor's use rest on one proverb or on two different ones wearing the same words? Finally, half-formed worry so tell me if it's dumb: in Smith's case nothing about his belief-forming mechanism is broken the way a stopped clock's is, so I'm not sure the proverb even describes the Gettier cases properly. Is that a real problem for wheeling it out in this argument, or am I being pedantic?

  Please write the whole answer in British English, and lay it out as a list I can bring along — my tutor marks presentation as well as content.
