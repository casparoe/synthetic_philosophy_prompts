      *   (4) Most of those groups are anonymous (no names/graves/descendants).
      *   (5) Remembrance of "no one in particular" is just a mood, not remembrance.
      *   (6) Duty with unspecified content is not a duty (Ought implies Can).
      *   (7) Therefore, no general duty of remembrance $\rightarrow$ Exhibit should focus only on founding families (exclude potter's field).

  3.  **Brainstorming Failure Points:**
      *   *Equivocation on "Remembrance":* Is it the same in (1) as in (5)? (1) implies a moral obligation, (5) defines it phenomenologically (needs a specific object).
      *   *Scope Slide / Hasty Generalization:* Moving from "specific wrongs with identifiable victims" to "anonymous masses."
      *   *False Dilemma in (5):* Is remembrance *only* about individuals? Can it be about a class or a structural fact?
      *   *Ought Implies Can (6):* Does the difficulty of specification negate the duty, or just modify the *mode* of fulfillment?
      *   *Premise (1) Overload:* Does benefit *always* trigger remembrance, or only under certain conditions (e.g., causal proximity, knowledge)?
