  7.  **Refining the Argument against (5):**
      *   Why is (5) wrong? Because collective memory often operates at the level of categories, not just individuals. "The Fallen," "The Enslaved," "The Disappeared."
      *   If (5) falls, (6) is satisfied (Content = "The Paupers of County X, 1870-1930").
