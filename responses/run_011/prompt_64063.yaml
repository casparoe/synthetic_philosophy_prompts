answer: |-
  **MEMORANDUM**

  **TO:** Acquisitions Committee
  **FROM:** Staff Analyst
  **DATE:** October 24, 2023
  **SUBJECT:** Analysis of Precedents Regarding the Signalman Assemblages Proposal

  ### (a) Candidate Rules and Necessary Patches

  Reviewing the seven threshold votes from the last two years, no single heuristic explains every outcome. However, three candidate rules emerge that, with specific patching, account for the recorded decisions.

  **1. The Archival Frame Rule**
  *Definition:* An object becomes eligible when its identity is decoupled from its physical substrate and secured in a transferable record (certificate, score, photograph, or installation instruction).
  *Fit:* Explains **Case 1** (blocks + cert/photo), **Case 3** (garden + score/archive), and **Case 4** (instructions + cert). It explains the rejection of **Case 7** (the certificate existed, but the record was empty of content).
  *Patch Required:* To fit **Case 6** (the Forger), the rule must be patched to allow the *museum label itself* to function as the archival frame post-acquisition. To fit **Case 2** (Paint Sample), the rule requires a patch that the archive must contain *conceptual* data, not just technical specifications.
  *Weakness:* It struggles with **Case 5** (Child's Drawing). A photograph could have been taken, yet it was declined. This suggests the Archive must be *authorized by the maker* or their estate, not just created by the museum.

  **2. The Communicative Intent Rule**
  *Definition:* Eligibility requires that the maker intended the object to communicate something to a viewer, rather than to serve a utilitarian, private, or deceptive function.
  *Fit:* Explains **Case 2** (utilitarian intent = decline), **Case 5** (no artistic intent = decline), and **Case 7** (financial intent = decline).
  *Patch Required:* To fit **Case 6** (the Forger), the rule requires a "Post-Hoc Narrative" patch: if the maker's intent was fraud, the museum may override this if it can successfully re-narrate the object as a commentary on fraud.
  *Weakness:* It creates tension with **Case 1** (Concrete Blocks). If the artist merely arranged factory blocks, is the intent "communication" or "selection"? The rule must be patched to accept "selection as communication."

  **3. The Affordance of Complexity Rule**
  *Definition:* The work must afford sustained critical attention, either through sensory richness or conceptual systemicity. It must offer "something to look at in."
  *Fit:* Explains **Case 7** (Chair's remark: nothing to look at in) and **Case 2** (nothing to say). It supports **Case 3** (social system) and **Case 6** (narrative depth).
  *Patch Required:* To fit **Case 5** (Child's Drawing), the rule must distinguish between "delight" (aesthetic pleasure) and "complexity" (sustained inquiry). The drawing was delightful but lacked a system or context to sustain museum-level attention.
  *Weakness:* It is subjective. It requires the committee to agree on what constitutes a "system."

  ### (b) Predictions and Divergence Points

  Applying these rules to the Signalman's Assemblages yields conflicting predictions.

  *   **Under the Archival Frame Rule:** **Prediction: Acquire.**
      *   *Reasoning:* The proposal includes photographs, a notebook (score), and the objects themselves (substrate). The estate has authorized the transfer. This mirrors Case 3 (Garden/Archive) and Case 4 (Instructions).
      *   *Divergence:* This rule ignores the "Burn them" instruction. It treats the daughter's permission as sufficient authorization, patching the "maker authorization" weakness noted in Case 5.

  *   **Under the Communicative Intent Rule:** **Prediction: Decline (Strict) or Acquire (Patched).**
      *   *Reasoning:* Strictly applied, the Signalman intended privacy and destruction, not communication. This aligns with Case 5 (Child) and Case 2 (Utilitarian). However, if the committee applies the Case 6 (Forger) patch, they can re-narrate the "counting what he could not say" phrase as a poetic intent we are now fulfilling.
      *   *Divergence:* The split here is ethical. Does the "Burn them" instruction function as a veto (Case 5 logic) or as a tragic element of the narrative we are permitted to override (Case 6 logic)?

  *   **Under the Affordance of Complexity Rule:** **Prediction: Acquire.**
      *   *Reasoning:* 1,100 numbered mechanical constructions constitute a massive system. This offers significantly "more to look at in" than Case 1 or Case 4. It is the antithesis of Case 7.
      *   *Divergence:* This rule parts company with the Intent Rule. One can acknowledge the complexity while respecting the refusal. The divergence is not on *what* the objects are, but on whether *our looking* violates their nature.

  ### (c) Vote Prediction and Analogs

  **Prediction:** The Committee will vote to **Acquire**.
  **Confidence:** 65%.

  **Closest Analog:** **Case 6 (The Forger's Copy).**
  Both cases involve a maker whose primary intent was *not* for the object to function as public art (one sought fraud, one sought oblivion). In both cases, the maker is deceased, removing the possibility of consent. In both cases, the acquisition relies on the museum's ability to construct a narrative ("appetite for authenticity" vs. "counting the unsayable") that supersedes the maker's original aim.

  **Misleading Resemblance:** **Case 5 (The Child's Drawing).**
  Committee members arguing for Decline will lean on Case 5, citing the lack of artistic intent and the private nature of the creation. This is misleading because the Child's Drawing lacked *system* and *archive*. It was a singular, loose object. The Signalman's work possesses the structural rigor of Case 3 (Garden) and the documentation of Case 4 (Instructions). Treating this as a "naive drawing" ignores the forty-year systemic labor that distinguishes it from a spontaneous sketch.

  ### (d) Principles Adopted

  **If the Committee Acquires:**
  You are adopting the principle that **Institutional Narration overrides Maker's Refusal.**
  *   *Consequence:* You can no longer consistently decline **Case 5 (The Child's Drawing)** based solely on "lack of intent." If you can override the Signalman's instruction to burn, you could theoretically override the Child's lack of intent, provided you can construct a sufficient narrative (e.g., "Outsider Genius"). You would have to distinguish the two cases based on the *Archival Frame* (the Signalman left a notebook; the Child did not), not the intent.

  **If the Committee Declines:**
  You are adopting the principle that **Privacy and Refusal constitute a Veto.**
  *   *Consequence:* You threaten the status of **Case 6 (The Forger's Copy).** If the Signalman's instruction to destroy must be respected, why was the Forger's intent to deceive not respected? To maintain Case 6 while declining the Signalman, you must argue that *Fraud* seeks a public audience (and thus invites institutional judgment), whereas *Privacy* seeks to exclude the public (and thus forbids it). This is a fragile distinction, as both involve a mismatch between the object's current status and the maker's wish.

  ### (e) Discriminating Case Proposal

  To clarify the split between the "Institutional Narration" faction (Acquire) and the "Maker's Refusal" faction (Decline), I propose placing the following hypothetical case before the committee:

  **The Case:** *A renowned local architect, before dying, burned the blueprints for his personal residence, stating publicly that the house was "a failure of his vision and not to be studied." A historical society saved the charred remains from the trash. They propose donating the fragments to us as a "Study in Destruction."*

  **Why this discriminates:**
  1.  **Like the Signalman,** there is an explicit instruction against preservation/study.
  2.  **Unlike the Signalman,** the maker was a professional within a recognized art-adjacent field (architecture), removing the "Outsider/Naive" variable.
  3.  **The Split:**
      *   If a member votes **Acquire** here, they confirm they prioritize *Historical/Institutional Value* over *Maker's Refusal*. They should logically Acquire the Signalman.
      *   If a member votes **Decline** here, they confirm that *Refusal is a Veto*. If they then vote to Acquire the Signalman, their reasoning is inconsistent unless they rely entirely on the "mechanical complexity" (Affordance Rule), which this architectural case also possesses.

  This case strips away the "tragic outsider" romance of the Signalman and forces a direct vote on the ethics of overriding a creator's stated wish for oblivion.
