      5.  Hard Eliminativism: False/Unassessable (depending on definition).

      *Wait, one nuance:* The prompt asks about "hurtfulness."
      *   Realist: Hurtfulness is a real property of the experience.
      *   Illusionist: Hurtfulness is a representational content that misrepresents the neural state.
