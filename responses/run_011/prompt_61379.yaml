answer: |-
  ### Design Phase

  I considered three candidate architectures to isolate the explanatory weight of sensorimotor grounding against a deflationary informational account.

  **Candidate 1: The Agricultural Sorter.** A machine distinguishes ripe from unripe fruit. Variant G scans and grasps to test firmness; Variant U scans and consults a database of color profiles provided by farmers.
  *Deflationist Dissolution:* A deflationist will argue G simply possesses higher-resolution data (tactile firmness) than U (visual color). If U were supplied with the firmness data symbolically, it would match G. The difference is merely bandwidth, not grounding.
  *Rejection:* This fails to isolate grounding because the tactile input can be re-described as just another information channel.

  **Candidate 2: The Chemical Mixer.** A system mixes compounds. G tests pH and adjusts; U follows a symbolic recipe.
  *Deflationist Dissolution:* If U fails, the recipe was incomplete. If the recipe contained all community knowledge, U should succeed. Any failure is an information deficit in the symbolic transmission, not a lack of grounding.
  *Rejection:* This reduces the problem to the completeness of the database, which favors the deflationist view that grounding is just compressed information.

  **Candidate 3: The Palletizing Stability Tester (Selected).** A warehouse robot labels stacks as Secure. G places and nudges boxes to test resistance; U places and matches visual patterns to a manual.
  *Deflationist Dissolution:* The deflationist will claim G has haptic data U lacks.
  *Why Selected:* This design resists dissolution because the predicate Secure is defined by the *outcome* of the effector's action (resistance to force), not merely by input states. G's classification is causally constitutive of the truth condition it tests, whereas U's classification is correlational. The divergence arises not from missing data, but from the difference between testing a success condition versus matching a proxy. This forces the deflationist to argue that testing the world is merely acquiring more symbols, which strains the notion of information supply.

  ### Scenario

  In a present-day automated warehouse, two palletizing systems operate on identical assembly lines. System G employs a camera and a robotic arm; it places boxes, applies a lateral nudge, measures displacement via force sensors, and labels the stack Secure only if displacement remains below a threshold. System U employs an identical camera and arm but lacks force sensors; it places boxes and labels them Secure if visual features match a database of approved stacking profiles compiled from community logistics manuals. Over one million cycles, both systems produce identical stacks and identical labels, agreeing on every linguistic query regarding the relations between Secure, Heavy, and Fragile. They diverge only when processing a specific batch of boxes containing unmarked liquid dampeners; visually identical to solid cargo, the liquid shifts under force. U labels these Secure based on visual match. G nudges them, detects instability, labels them Unsecure, and restacks. G prevents a collapse; U does not.

  ### Demonstration

  **(a) Predicate and Causal Chains**
  The predicate is Secure. For G, tokening Secure is caused by a visual scan followed by a successful nudge-test (low displacement); the token causes the pallet to be cleared for transport. For U, tokening Secure is caused by a visual scan matching symbolic profiles; the token causes the pallet to be cleared. Inferentially, both systems treat Secure as incompatible with Unsecure and entailing Transport-Ready. The causal history differs: G's tokens are causally dependent on the physical stability of the stack via the effector loop; U's tokens are dependent on the correlation between visual patterns and the symbolic database.

  **(b) Theoretical Predictions**
  *   **Covariational Accounts (Dretske–Fodor):** Content is fixed by reliable causal correlation. G's tokens covary with actual stability because the nudge filters false positives (visual matches that are unstable). U's tokens covary with visual profiles. In the divergence, G represents stability correctly; U misrepresents the liquid boxes as stable. The theory predicts G has the content Secure (stable), while U has the content Visually-Secure.
  *   **Teleosemantics (Millikan):** Content is fixed by the proper function and success conditions of the mechanism. G's function is to ensure stability; its success condition is a non-falling stack. U's function is to comply with the manual; its success condition is matching the profile. In the divergence, G fulfills its function; U fails. Teleosemantics predicts G's content is grounded in the world-state (stability), while U's content is grounded in the symbolic convention.
  *   **Conceptual-Role Semantics (Block–Harman):** Content is fixed by the inferential role within the system. Both systems share the same inferential roles regarding other predicates (Heavy, Fragile) during the matched period. However, G's role includes a disposition to nudge and re-classify based on force. U lacks this disposition. The theory predicts a content difference based on this hidden dispositional role, even if outputs match initially.

  **(c) Structural Feature and Ablations**
  The working feature is the **closed success-loop**: the effector's action alters the environment in a way that validates the classification.
  *   *Ablation 1 (Remove Effector):* G becomes a passive observer. It can no longer nudge. Its classifications revert to visual correlation only. G and U now converge in content and performance; both fail on the liquid boxes. The grounding advantage vanishes.
  *   *Ablation 2 (Remove Feedback):* G nudges but cannot sense displacement. It cannot distinguish stable from unstable stacks post-nudge. Its classification becomes random regarding stability. G and U diverge in performance, but G no longer has correct content; it merely acts blindly. The loop must be closed for grounding to fix content.

  **(d) Strongest Attack and Reply**
  *Attack:* The deflationist argues the divergence is merely a difference in reliability derived from information quantity. G possesses haptic information (force data) that U lacks. If U were supplied with the symbol Force-Low, it would match G. Thus, grounding adds no new explanatory category, only more data channels.
  *Reply:* This conflates *data* with *normativity*. U can be given the symbol Force-Low, but without the effector loop, that symbol has no connection to the success condition of the stack. G's loop establishes the *norm* that Secure means *withstands force*, not just *registers force*. The deflationist explains the input but cannot explain why G's token binds to the world-state of stability rather than the sensor-state of pressure. The loop creates the truth condition, it does not just report it.

  **(e) Verdict**
  The case shows grounding carries explanatory weight that a difference in information supply cannot absorb. The deflationary line survives intact only if one reduces all success conditions to input correlations, which renders the notion of error in U inexplicable (U followed its inputs correctly). The further fact that settles it is the **counterfactual dependence**: G's label would change if the stack were unstable even with identical visual inputs; U's label would not. This confirms G's content is fixed by the world-state accessed via the loop, not merely the information supplied to the processor. Grounding matters because it ties content to success conditions, not just causal histories of input.
