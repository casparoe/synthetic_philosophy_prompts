answer: |-
  ### Specification for an Adequate Account of Historical Explanation

  **Purpose:** To establish the functional criteria any theory of historical explanation must meet to be useful to working historians. The goal is operational: to distinguish genuine explanation from chronology, coincidence, or mere storytelling.

  **Status:** This specification precedes theoretical commitment (e.g., Covering-Law, Narrative, Mechanism). It defines the target before selecting the weapon.

  ---

  ### I. The Desiderata

  The following requirements are divided into **Non-Negotiable (NN)**, which any adequate account must satisfy to match actual historical practice, and **Camp Preferences (CP)**, which reflect specific theoretical commitments (Covering-Law vs. Narrative) that may be adopted but are not required for adequacy.

  #### 1. Causal Difference-Making (NN)
  *   **Motivation:** Distinguishes explanation from chronology. A list of events preceding a collapse is not an explanation of the collapse.
  *   **Requirement:** The account must identify factors such that, had they been absent or different, the outcome would likely have been different. It must isolate the *explanatorily relevant* conditions from the background noise.

  #### 2. Intentional Integration (NN)
  *   **Motivation:** Distinguishes history from natural science. Historical outcomes are often the result of human agency.
  *   **Requirement:** The account must be capable of treating actors' beliefs, desires, and reasons as causal factors without reducing them to mere epiphenomena of structural forces. It must explain how subjective states translate into objective outcomes.

  #### 3. Counterfactual Stability (NN)
  *   **Motivation:** Distinguishes explanation from coincidence. If the connection between cause and effect is accidental, it cannot support inference.
  *   **Requirement:** The explanation must license counterfactual claims (e.g., "Had the harvest not failed, the riot would not have occurred"). It need not prove the counterfactual true, but it must make the claim meaningful and debatable within the framework of the explanation.

  #### 4. Rational Contestability (NN)
  *   **Motivation:** Matches the practice of historiography. Historians argue; they do not merely verify.
  *   **Requirement:** The account must allow for reasonable disagreement between competent practitioners. It cannot render explanations as logically coercive (like math) nor as purely aesthetic choices (like poetry). There must be criteria for "better" and "worse" explanations that allow for persistent, rational dispute.

  #### 5. Explanatory Discrimination (NN)
  *   **Motivation:** Addresses the problem of incompatible narratives invoking the same generalization. Two historians may agree that "elite defection causes regime collapse" but disagree on whether elite defection *actually* caused *this* collapse versus a military coup.
  *   **Requirement:** The account must provide a basis for choosing between incompatible narratives that rely on the same general principles. It must show how the specific configuration of events in one narrative carries more explanatory weight than the other, beyond mere consistency with the generalization.

  #### 6. Consistency with Competent Practice (NN)
  *   **Motivation:** Philosophy of history must serve history, not legislate it from outside.
  *   **Requirement:** The account cannot declare widely accepted, prize-winning historical explanations as "invalid" solely on philosophical grounds (e.g., because they lack a strict universal law). If the theory contradicts the consensus of competent practitioners on clear cases, the theory fails.

  #### 7. Subsumption under Generalizations (CP: Covering-Law)
  *   **Motivation:** Desire for scientific rigor and predictive potential.
  *   **Requirement:** (Optional) Explanations are adequate only if they instantiate a universal or probabilistic law.
  *   **Status:** *Camp Preference.* Many competent historians explain without citing explicit laws. Making this NN eliminates most actual historical writing.

  #### 8. Emplottment/Coherence (CP: Narrative)
  *   **Motivation:** Desire for meaning, understanding, and temporal flow.
  *   **Requirement:** (Optional) Explanations are adequate only if they form a coherent story with a beginning, middle, and end (e.g., tragedy, romance, irony).
  *   **Status:** *Camp Preference.* While most history is narrative, structural or analytic history often explains without traditional "plot." Making this NN excludes valid analytic history.

  ---

  ### II. Ruling on the "Swap Test"

  **The Proposal:** If the particular events an explanation narrates can be replaced by others (swapped) without any loss of explanatory force, the particularity was doing no work, and what looked like a historical explanation was a generic one in disguise.

  **The Ruling:** This is a **Genuine Desideratum**.

  **Reasoning:**
  1.  **Token vs. Type:** History is fundamentally concerned with *tokens* (this war, this revolution), not *types* (war in general, revolution in general). Sociology explains types; history explains tokens.
  2.  **The Risk of Pseudo-Explanation:** Without the Swap Test, an account can claim to explain the Fall of Rome by citing "imperial overstretch." If the specific events of the 5th century can be swapped with the 3rd century crises without changing the explanatory force, the historian has explained "Imperial Collapse" generally, not the Fall of Rome specifically.
  3.  **Operational Utility:** For the working historian, this test is a crucial heuristic for tightening an argument. It forces the historian to show why *this* assassination, *this* harvest failure, or *this* letter mattered, rather than relying on broad structural inevitabilities.

  **Caveat:** The test applies to *historical* explanation specifically. It does not invalidate structural or sociological history, but it correctly identifies such work as a different genre (sociological analysis rather than historical explanation of a particular outcome). For the purpose of your chapter, which focuses on explaining particular outcomes, the Swap Test is mandatory.

  ---

  ### III. Consistency and the "Killer" Requirement

  **Joint Unsatisfiability:**
  There is a tension between **Counterfactual Stability (NN3)** and **The Swap Test (NN)**.
  *   **Counterfactuals** rely on stability: "If X hadn't happened, Y wouldn't have." This implies a stable relationship between types of events (X-type causes Y-type).
  *   **The Swap Test** insists on uniqueness: "You cannot swap this X for another X-type event."
  *   **The Conflict:** If the event is truly unique (as the Swap Test demands), on what basis do we ground the counterfactual? Counterfactuals usually require a model of "what usually happens." If the situation is *sui generis*, the counterfactual lacks a reference class.

  **The "Killer" Requirement:**
  The single requirement that eliminates the most otherwise attractive accounts is **Counterfactual Stability (NN3)**.

  **Why:**
  1.  **Impact on Narrative:** The most attractive current accounts are nuanced Narrative approaches. These often emphasize the flow of events, meaning, and contingency. Strict counterfactual analysis often feels alien to the "story" mode of understanding. Demanding explicit counterfactual licensing forces narrativists to formalize their intuition, which many find reductive.
  2.  **Impact on Covering-Law:** Interestingly, it also pressures Covering-Law models, but they are already largely abandoned. The Counterfactual requirement kills the "Vivid Story" that lacks causal rigor. Many popular histories are vivid chronologies that imply causation but cannot support a counterfactual (e.g., "The war was inevitable"). NN3 exposes these as non-explanations.
  3.  **Comparison:** The Swap Test eliminates sociological reductionism (which is often a desired correction). Intentional Integration eliminates behaviorism (also a desired correction). But Counterfactual Stability eliminates "Inevitabilism" and "Pure Storytelling," which constitute a vast amount of otherwise attractive, readable, and commercially successful historical writing. It demands a rigor that many "good" histories do not meet.

  ---

  ### IV. Falsification Conditions: Changing My Mind

  To abandon this specification, I would need to drop **Counterfactual Stability (NN3)**.

  **The Argument for Dropping It:**
  If it can be demonstrated that historical understanding is fundamentally *retrospective sense-making* rather than *causal modeling*, counterfactuals become category errors.

  **The Example:**
  Consider the explanation of a singular, non-repeatable artistic or intellectual shift where the "cause" is the internal logic of the ideas themselves, not an external event.
  *   *Case:* Why did Picasso paint *Les Demoiselles d'Avignon* in 1907?
  *   *Challenge:* A counterfactual ("If Cézanne hadn't exhibited...") may be meaningless if the internal development of Picasso's style made the painting inevitable *for him*, regardless of external triggers.
  *   *Condition:* If a competent historian can provide an explanation that is universally accepted by peers as adequate, yet explicitly rejects counterfactual reasoning as anachronistic or inapplicable to the subject matter (e.g., intellectual history of unique conceptual breakthroughs), then **NN3** must be downgraded to a heuristic rather than a requirement.

  If the practice of competent historians (NN6) consistently validates explanations that explicitly deny counterfactual stability (e.g., "It was a singularity; no other outcome was possible given the agent's character"), then **NN6 (Consistency with Practice)** overrides **NN3**, and NN3 must be dropped.
