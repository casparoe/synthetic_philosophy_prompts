  **MEMORANDUM**

  **TO:** Disciplinary Panel, Board of Examiners for Marriage and Family Therapists
  **FROM:** Public Member
  **DATE:** [Date]
  **SUBJECT:** Disposition and Reasoning in Matter of M.R.

  **DISPOSITION**
  I move that the Panel **dismiss the complaint in its entirety**. We should issue a written order stating that the alleged conduct, absent evidence of clinical impairment or boundary violation, does not constitute grounds for discipline under our statutory mandate. We should not attach conditions, nor should we cite the licensee's recent social notoriety as a mitigating factor.

  **REASONING**

  I offer this analysis using the framework of utility, as I believe it offers the only neutral ground for our disagreement. We must ask not whether M.R.'s conduct offends us, but whether punishing it produces a net reduction in pain (mischief) for the community we serve. In this calculus, punishment is itself an evil (it inflicts pain); it is only justified if it prevents a greater evil.

  **1. On the Chair's Proposal: The Danger of Counting Social Sanctions**
  The Chair has suggested we dismiss because the "court of public opinion" has already punished M.R. through lost referrals and public exposure. While the outcome (dismissal) is correct, the reasoning is dangerous.

  In utilitarian terms, we must distinguish between the *legal sanction* (our power) and the *popular sanction* (public disapproval). If we dismiss *because* M.R. has already suffered socially, we implicitly admit that the conduct *was* punishable, but that the debt is paid. This validates the popular sanction as a legitimate arm of discipline.

  This is flawed for two reasons. First, popular sanction is **mis-seated**: it falls on the conspicuous, not necessarily the culpable. It punishes M.R. for being discovered, not for causing harm. Second, it renders our justice arbitrary. If a licensee lived in a similar arrangement but remained obscure, they would escape the "social punishment" and thus, under the Chair's logic, would deserve our sanction. We cannot outsource our judgment to the volatility of public sentiment. We must dismiss because the act itself warrants no pain from us, not because others have already inflicted pain. To do otherwise is to endorse a punishment we did not calibrate and cannot control.

  **2. On the "Public Confidence" Argument: Mischief and Evidence**
  Two members argue that M.R.'s notoriety impairs the "instrument" of therapy—client trust—and cite the one client termination as proof. This argument must be taken seriously. If the profession loses the capacity to function because clients flee, that is **mischief** (net pain to the community).

  However, to justify punishment, the mischief must be *assignable* and *causal*. We do not know why the client terminated. Did she leave because M.R.'s competence was compromised? Or did she leave because she holds personal views incompatible with M.R.'s life? If the latter, sanctioning M.R. does not restore trust; it merely confirms that the Board enforces those personal views.

  Furthermore, we must consider if our punishment is **unprofitable**. A formal reprimand or consent order would generate new publicity, likely enlarging the very notoriety that threatens M.R.'s practice. We would be inflicting certain pain (sanction) to prevent speculative harm (future client loss). Under a utilitarian standard, we cannot punish based on the *ascetic principle* (the idea that suffering is inherently good or cleansing). We need evidence that M.R.'s private conduct actively degrades clinical outcomes. We have none. The single termination is data, but without context, it is not proof of professional impairment. To sanction now is to punish M.R. for the prejudices of others, which increases the total pain in the system without securing any clinical safety.

  **3. Recommendation on Rules: The Nexus Requirement**
  Finally, while we cannot rewrite the rules for this case, I recommend the full Board consider amending the "good moral character" and "public confidence" provisions. Currently, they allow punishment for **groundless** reasons (where no mischief exists).

  I propose we adopt a **nexus requirement**: discipline for off-duty conduct should require a demonstrable link between the conduct and the licensee's ability to practice safely. This ties disqualification to identifiable interference with function.

  **Objection:** I must note the strongest argument against this change now. Stability in the law is itself a utility. Changing the standard during a high-profile case may appear as special pleading, undermining confidence in the Board's consistency. Some may argue it is better to let the current standard fall into disuse through strict interpretation than to amend it reactively. I raise this not to dissuade the recommendation, but to ensure we anticipate the political cost.

  **CONCLUSION**
  We should dismiss. Not as an act of mercy, but because punishment here is **unnecessary** (no clinical mischief proven) and **unprofitable** (the cost to M.R. and the profession outweighs any speculative gain in public trust). We must not validate the popular sanction, nor should we punish a licensee for the private moral judgments of the public.

  I am prepared to draft the order of dismissal consistent with this reasoning.
