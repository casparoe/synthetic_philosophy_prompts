prompt: |-
  I'm in a philosophy of language seminar this term and got volunteered to run the 75-minute section on radical translation — 14 of us, all second-years who've read the gavagai bits but mostly skimmed them. Design an in-class game that makes them feel the underdetermination instead of just nodding along to it.

  Setup I want: teams of field linguists building a manual for a made-up language, with 'natives' who can only react to situations and are forbidden from explaining or correcting anything, plus a hidden lexicon I can prepare in advance. Give me the generator for that lexicon rather than one example, so I can print enough cards. Score it somehow — bragging rights, no money — but rig the scoring so that two teams whose manuals translate every observed sentence identically can still be shown to have different manuals, and make sure there's a built-in moment where pointing at things fails to pin down what a one-word term picks out. Ideally one team stumbles onto an object-vs-stage-vs-part style remapping on their own and the room kind of stops. Nobody hears the word 'inscrutability' until the debrief.

  Then I need: a minute-by-minute timeline, the debrief mapping what actually happened onto the steps of the argument, what predictably goes wrong the first time it's run (I'm guessing someone memorises the natives' cards, or a team gets it 'right' and kills the whole point), and an honest note on which feature of Quine's claim the game can't reproduce. I already suspect it'll land as 'we just don't have enough data yet' rather than 'there's no fact of the matter' — so tell me what I have to supply myself to stop that.
