  **OUROBOROS REINTERNAL UNDERWRITING GUIDELINE 99-B**
  **SUBJECT:** ANTHROPIC MORTALITY PRICING MODEL (AMPM)
  **EFFECTIVE:** 01 JANUARY 2024
  **DISTRIBUTION:** ALL SENIOR UNDERWRITERS, ACTUARIAL CONTROL, COMPLIANCE

  **1.0 PURPOSE AND METHODOLOGY**
  This guideline mandates the use of the Anthropic Mortality Pricing Model (AMPM) for all aggregate longevity exposure assessments. The model derives extinction probability solely from the observer's birth rank within a defined reference class, adhering to the Vance Principle of Mediocrity. Writers shall disregard all traditional risk factors, including climate projections, nuclear arsenal stockpiles, biotechnological vectors, macroeconomic stability, and individual applicant health habits. The virtue of the AMPM lies in its independence from volatile external data; it relies exclusively on the certainty of the observer's existence.

  The baseline count of humans born to date ($N_{past}$) is fixed at 100,000,000,000. Using a scale-invariant prior ($1/N_{total}$), the likelihood of any particular birth rank is one over the total number who will ever live. Consequently, the ninety-five-percent confidence upper bound on the total number of humans ($N_{total}$) is calculated as twenty times the current count. The median bound is calculated as twice the current count.

  **2.0 REFERENCE CLASS SELECTION**
  Underwriters must select the appropriate reference class for each risk pool. Note that identical applicants yield divergent liability bounds depending on class granularity. Writers shall consult Table 1 for approved classifications.

  **Table 1: Approved Reference Classes and Liability Bounds**
  | Reference Class | $N_{past}$ (Estimated) | Median $N_{total}$ | 95% Upper Bound $N_{total}$ |
  | :--- | :--- | :--- | :--- |
  | *Homo sapiens* | 100 Billion | 200 Billion | 2 Trillion |
  | Terran Mammals | 400 Billion | 800 Billion | 8 Trillion |
  | Conscious Observers | 1 Trillion | 2 Trillion | 20 Trillion |

  Selection of the *Homo sapiens* class implies a median remaining capacity of 100 billion births. Selection of Conscious Observers implies a significantly extended horizon. Writers must document the justification for class selection in the risk memo. Arbitrariness is an inherent feature of the model, not a bug.

  **3.0 PRIOR SENSITIVITY AND SELF-INDICATION**
  The standard model assumes a scale-invariant prior. Underwriters are advised that alternative priors exist. Specifically, the Self-Indication Adjustment (SIA) posits that an observer is more likely to exist in a universe with more observers. When the SIA variant is applied, the expected total population drives to infinity. Per Actuarial Standard of Practice 44, this variant recommends contingency reserves of zero, as extinction probability becomes negligible. However, the Existential-Risk Desk advises against SIA adoption for statutory reporting, as it eliminates all chargeable premium.

  **4.0 VALIDATION AND BACKTESTING**
  Backtesting of the AMPM is constrained by the sample size of one (1) species. The target event (global extinction) has not yet occurred within the dataset. Consequently, historical validation is impossible. The model's validity rests on logical consistency rather than empirical fit. Writers shall not request historical loss triangles for existential events. The absence of past failures is treated as censored data, not model failure.

  **5.0 NEW CLASS INITIATIONS (MARS COLONY)**
  Special procedures apply to nascent reference classes, such as the first insured colonists on Mars. For a class where $N_{past} = 2$, the median total bound is four (4). This implies only two additional births before class extinction. Legal Counsel has refused to underwrite this exposure, citing moral hazard; insuring the first two members creates a financial incentive to halt reproduction to avoid triggering the statistical bound. Such risks are declined.

  **6.0 COMPLIANCE AND INDIVIDUAL UNDERWRITING**
  Compliance Opinion 2023-C states that the AMPM makes claims only about aggregate species survival, not individual mortality. Therefore, the model may not lawfully be used to decline, rate, or condition any individual application. An applicant cannot be penalized because their reference class is nearing its median bound. The model is strictly for aggregate capital allocation and reinsurance pricing. Using anthropic inference to deny a life claim constitutes unfair discrimination.

  ***

  **APPENDIX A: DISSENTING MEMORANDUM**
  **FROM:** ELARA VANCE, CHIEF RISK OFFICER
  **TO:** CHIEF UNDERWRITING OFFICER
  **RE:** PRIOR SELECTION ARBITRARINESS

  I must formally object to the mandatory adoption of the scale-invariant prior. The choice of prior carries the entire estimate; shifting from a scale-invariant distribution to a uniform distribution over time alters the doom horizon by centuries. We are capitalizing a philosophical preference as if it were a loss development factor. Furthermore, the model assumes the observer is randomly sampled from all humans who will ever live. If future humans are uploaded consciousnesses, the definition of "birth" collapses. We are pricing the end of the world using a spreadsheet designed for automobile insurance. I recommend holding capital against model risk equal to 100% of surplus.

  ***

  **CERTIFICATION**
  I certify that I have read Guideline 99-B and understand that my birth rank is statistically typical.

  **Signed:** _J. K. ALLEN, CHIEF UNDERWRITING OFFICER_
  **DATE:** 01 JANUARY 2024
