answer: |-
  This is a classic exercise in **reflective equilibrium**. You are oscillating between your considered judgments (gut verdicts) and potential principles, trying to make them cohere. The fact that they don't hang together yet doesn't mean you are incoherent; it means you are identifying where your intuitions are biased by salience, convenience, or framing.

  There *is* a principle that can unify about 80% of your verdicts, but it will require you to sacrifice the 20% that are driven by cognitive bias.

  ### The Unifying Principle: Precautionary Expected Suffering

  Your intuitions align best with a **Negative Utilitarian framework modified by the Precautionary Principle**.

  **The Formula:**
  $$Moral Weight = P(\text{Sentience}) \times (\text{Intensity} \times \text{Duration}) \times \text{Number of Individuals}$$

  1.  **Negative Utilitarian:** You are primarily concerned with the reduction of suffering (slaughter methods, boiling, crowding) rather than the promotion of happiness.
  2.  **Precautionary:** Uncertainty about sentience (prawns) does not grant moral immunity; it assigns a probability weight.
  3.  **Systemic:** You recognize that individual acts (humane marketing) must be judged by their aggregate consequences (total consumption).

  Here is how this principle diagnoses your inconsistencies, dictates which verdicts to drop, and handles the new cases.

  ---

  ### 1. Diagnosing the Inconsistencies

  **A. The Freezer vs. Electrical Stun (The Verdict to Drop)**
  *   **Your Intuition:** Electrical stun for salmon = Required. Freezing lobster at home = Fine.
  *   **The Conflict:** This is a **convenience bias**. Scientific consensus (e.g., from the Crustacean Humane Slaughter Trust) suggests that freezing is a slow method of incapacitation. Ice crystals can form before the animal loses consciousness, causing thermal shock and pain.
  *   **The Principle's Ruling:** If electrical stunning is required for salmon because asphyxiation causes pain, then freezing is insufficient for lobsters. You must accept that **home-freezing is ethically comparable to boiling alive** relative to best available technology (e.g., rapid electrocution or mechanical destruction).
  *   **Action:** **Give up the freezer verdict.** If you eat lobster, you must commit to the same stunning standard you demand for salmon, or abstain.

  **B. Slaughter vs. Living Conditions (The Intensity Gap)**
  *   **Your Intuition:** Slaughter methods feel urgent; crowding/lice feel less urgent, even though you admit the latter is "worse overall."
  *   **The Conflict:** This is **salience bias**. Slaughter is a discrete, violent event. Chronic suffering (crowding, ammonia burns, lice) is invisible and diffuse.
  *   **The Principle's Ruling:** In the formula above, *Duration* is a multiplier. A life of 2 years in severe crowding likely outweighs 5 minutes of painful slaughter.
  *   **Action:** You don't have to change the verdict (farming conditions are worse), but you must **recalibrate your emotional intensity**. Your lack of strong feeling here is a psychological blind spot, not an ethical insight.

  **C. Wild vs. Farmed (The Population Paradox)**
  *   **Your Intuition:** Wild capture kills more (bad), but wild fish have better lives (good).
  *   **The Conflict:** You are toggling between **Total Utilitarianism** (minimize total deaths/suffering) and **Per-Individual Welfare** (maximize quality of life).
  *   **The Principle's Ruling:** Use **Total Expected Suffering**.
      *   *Wild:* Short life (neutral/positive) + Violent Death. Multiplied by *billions* (including bycatch).
      *   *Farmed:* Long life (often net negative due to crowding/disease) + Violent Death. Multiplied by *millions*.
      *   *The Kicker:* The Fishmeal Factor. Farmed carnivorous fish (salmon) require wild fish to be caught and ground up.
  *   **Action:** Stick with **"Wild capture is worse."** Even if the individual sardine had a "better" life, the sheer scale of wild death (plus the wild fish killed to feed the farmed salmon) creates a higher aggregate suffering score. The "better life" argument only holds if you ignore the bycatch and the feed ratio.

  **D. The Prawn Uncertainty (Not a Cop-Out)**
  *   **Your Intuition:** Interests count in proportion to confidence in sentience.
  *   **The Principle's Ruling:** This is **Expected Value Theory**, and it is robust. It is not a "get out of jail free" card if applied rigorously. If there is a 50% chance a prawn feels pain, inflicting pain counts as 0.5 $\times$ the harm. If you eat 100 prawns, the *expected* harm is equivalent to killing 50 sentient beings.
  *   **Action:** Keep this. It prevents paralysis (we can't wait for 100% proof) but prevents dismissal (uncertainty isn't zero).

  ---

  ### 2. Applying the Principle to New Cases

  Here is what the **Precautionary Expected Suffering** principle dictates for the cases you haven't resolved:

  **Sea Lice Treatments**
  *   **Context:** Treatments often involve pesticides (harmful to environment/non-targets), warm water baths (stressful), or "cleaner fish" (lumpfish/wrasse) which often starve in pens.
  *   **Verdict:** **Net Negative.** Under your principle, the existence of the treatment implies the existence of the infestation, which implies overcrowding. The ethical priority is reducing stocking density to prevent lice, not treating them. If treatment is necessary, the welfare cost of the treatment (and the cleaner fish) must be added to the salmon's suffering score.

  **Live Transport of Trout**
  *   **Context:** Moving fish between sites in tanks. Risks include oxygen depletion, temperature shock, crowding stress, and injury.
  *   **Verdict:** **High Harm.** This is acute suffering multiplied by duration (hours/days). Unless there is a stunning protocol during loading/unloading (there usually isn't), this is a high-intensity suffering event. Your principle should rank this as a high-priority welfare violation, comparable to poor slaughter methods.

  **Catching Wild Fish for Feed (FIFO Ratios)**
  *   **Context:** It takes roughly 3kg of wild fish to produce 1kg of farmed salmon.
  *   **Verdict:** **The Multiplier of Harm.** This is the strongest argument against carnivorous aquaculture. You are effectively outsourcing the suffering to wild populations.
  *   **Calculation:** 1 Farmed Salmon Death + 3 Wild Fish Deaths (for feed) + Wild Fish Deaths (bycatch in feed fisheries).
  *   **Result:** This makes farmed salmon ethically "heavier" than it appears. It collapses your Wild vs. Farmed distinction: eating farmed salmon *causes* wild capture deaths.

  **Octopus Farming**
  *   **Your Intuition:** Much worse than salmon.
  *   **Why the Principle Agrees:**
      1.  **Sentience Probability:** $P(\text{Sentience})$ is likely higher for octopuses (complex cognition, problem-solving) than fish.
      2.  **Nature of Confinement:** Octopuses are solitary, intelligent, and exploratory. Confining them is psychologically torturous (boredom/stress), whereas schooling fish (salmon) are adapted to groups (though not at aquaculture densities).
      3.  **Feed:** Octopuses are carnivorous. High FIFO ratio (see above).
      4.  **Slaughter:** No established humane stunning method exists for octopuses.
  *   **Verdict:** **Ethically Prohibitive.** The expected suffering score is off the charts compared to salmon.

  ---

  ### 3. The "Humane Marketing" Verdict

  You wrote: *"Welfare reform for farmed fish is worth having, but 'humane' marketing of fish makes things worse."*

  **Keep this.** This is the most sophisticated part of your ethical framework. It recognizes **Demand Elasticity**.
  *   If welfare reforms make consumers feel good, consumption rises.
  *   If consumption rises by 10%, but suffering per fish drops by 5%, *total suffering increases*.
  *   Your principle is systemic, not just individual. This aligns perfectly with the "Expected Suffering" model applied to populations.

  ### Summary of Actions

  1.  **Adopt the Principle:** Minimize Total Expected Suffering (Probability $\times$ Intensity $\times$ Duration $\times$ Count).
  2.  **Drop:** The idea that freezing lobsters at home is ethically distinct from industrial slaughter methods.
  3.  **Recalibrate:** Force your emotional response to chronic farming conditions to match your intellectual judgment that they are worse than slaughter.
  4.  **Accept:** That uncertainty (prawns) is a multiplier, not an exemption.
  5.  **Conclusion on Aquaculture:** The principle suggests that **carnivorous aquaculture (salmon/octopus) is likely net-negative** due to the wild-feed multiplier, and that **wild capture is worse** due to scale and bycatch. The only consistent position that minimizes suffering is a significant reduction in consumption of both, rather than switching between them.

  You aren't incoherent; you're just noticing that the "least bad" option in a system of mass production is still ethically fraught. That tension is exactly where the module wants you to be.
