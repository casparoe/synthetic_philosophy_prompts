answer: |-
  1. We shall retain the founder's name on the quadrangle but commission a permanent contextual panel detailing the slave-trade origins of his bequest, to be installed by the start of the next academic term.
  2. We shall define anti-presentism as the refusal to conceal material facts known today, whilst forbidding the attribution of contemporary moral sentiments to historical actors who did not hold them.
  3. While the alumni are correct that contemporaries lacked our moral outrage, omitting the economic fact of enslaved labour constitutes a distortion of the past's material reality, not merely an imposition of modern ethics.
  4. We must acknowledge that our charter's prohibition on presentism is itself a historical artefact that may appear presentist to future readers, yet we adhere to it not as eternal truth but as a disciplined method to ensure our interpretations remain open to revision.
  5. Naming the quadrangle is an act of commemoration rather than interpretation, and what turns on this difference is that we may acknowledge the founder's existence without endorsing his morality.
