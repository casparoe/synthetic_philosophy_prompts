prompt: |-
  I'm a third-year philosophy PhD student and my slot next week is TA-ing 75 minutes of a second-year cog sci course on consciousness — the section is Dennett's Cartesian theater / multiple drafts stuff. Whiteboard only, no slides, and the prof already ran all the standard illusion demos in lab so I can't lean on a fresh one. Here's what I'd planned: build the whole thing on the rubber hand illusion, since it visibly splits where-I-feel-my-hand-is from where-it-actually-is. But I suspect thats the wrong hill to die on, because it's about cross-modal ownership of a body part rather than about there being one privileged place-and-time where things come together for an inner audience — so it probably proves something adjacent and leaves the theater untouched. Tell me what's wrong with that choice and what should carry the session instead (the taps-on-the-forearm thing? the two differently-coloured flashing lights one? something you can set up with just a whiteboard and your hands?), then plan the sequence. I need the dependency structure, not a summary: which piece has to be in place before which and why — my instinct is that if I say "there's no finish line" before they've felt the pull of the theater, it just lands as a slogan. I also want the misconception map, and I'm bracing for at least three: "so there are lots of little theaters", "so nobody is really conscious", and "so the self is just a story we tell afterwards". For each, tell me at which point in the sequence it forms and exactly which step heads it off. Then one question I can ask at the end that seperates people who got the argument from people who just agree with me, and the two things I should openly refuse to cover at this level and say so.

  Give me the plan as a JSON object with these keys:
  - "verdict_on_rubber_hand": {what_it_actually_shows, why_it_misses_the_theater, is_there_a_repairable_version}
  - "carrying_example": {example, what_it_must_make_them_see, what_it_must_not_involve, how_i_stage_it_with_a_whiteboard_only}
  - "sequence": array of {step, idea_introduced, why_it_cannot_come_earlier_or_later, what_depends_on_it}
  - "misconceptions": array of {misconception, forms_at_step, head_off_at_step, one_line_rejoinder}
  - "comprehension_check": {question, what_a_real_answer_sounds_like, what_a_fake_agreement_sounds_like}
  - "deliberately_omitted": array of {topic, why_cut, what_i_say_instead}
reasoning: |-
  Here's a thinking process that leads to the suggested JSON response:

  1.  **Analyze the User and Request:**
      *   **User:** Third-year Philosophy PhD student.
      *   **Task:** TA-ing a 75-minute section for a 2nd-year Cognitive Science course.
      *   **Topic:** Dennett's Cartesian Theater / Multiple Drafts Model.
      *   **Constraints:** Whiteboard only (no slides), prof already did standard illusion demos in lab (so avoid relying on fresh sensory demos that might fail or feel redundant), need to avoid slogans without grounding.
      *   **Current Plan:** Rubber Hand Illusion (RHI).
      *   **User's Doubt:** RHI is about body ownership (proprioception/vision mismatch), not necessarily the *temporal/spatial* locus of consciousness (the Theater).
      *   **Requirements:**
          *   Critique of RHI.
          *   Better "carrying example" (whiteboard friendly).
          *   Dependency sequence (step-by-step logic).
          *   Misconception map (3 specific ones + when they form/how to head off).
          *   Comprehension check question (real vs. fake understanding).
          *   Deliberately omitted topics (2 things).
          *   **Format:** JSON object with specific keys.

  2.  **Evaluate the Rubber Hand Illusion (RHI):**
      *   *What it shows:* Body schema plasticity, integration of visual/tactile/proprioceptive data.
      *   *Why it misses the Theater:* The Cartesian Theater is about a *final finish line* where experience becomes conscious. RHI shows *content* can be manipulated, but doesn't inherently challenge the *location/timing* of the "seeing" itself. A Cartesian Theater proponent could say, "The theater just updated its feed to the rubber hand." It doesn't force a crisis about *when* or *where* the experience happens in the brain.
      *   *Repairable?* Hard to repair without adding temporal delays (which gets into Libet territory, maybe too complex for whiteboard only). Better to swap.

  3.  **Select the Carrying Example:**
      *   Needs to be whiteboard friendly.
      *   Needs to target *temporal/spatial* convergence (the "finish line").
      *   *Option A:* Taps on forearm (Dennett's favorite). Good, but hard to demo on 75 people without equipment.
      *   *Option B:* Color phi phenomenon (two lights flashing). Classic, but requires lights/slides usually. Can be drawn, but less visceral.
      *   *Option C:* The "Fame Principle" / Memory vs. Experience distinction. A bit abstract.
      *   *Option D:* Dennett's "Oracle" or "Stalinesque vs. Orwellian" distinction using a simple reaction time scenario.
      *   *Selection:* **The "Fame Principle" / Temporal Delay Argument (using the Whiteboard to draw timelines).** Actually, the *Color Phi* phenomenon is the strongest conceptual wedge for Multiple Drafts, even if drawn. But since the user said "no slides" and "prof did illusion demos," maybe a conceptual thought experiment is safer.
      *   *Better Selection:* **Dennett's "Fame in the Brain" (The Delay Argument).** It relies on neural transmission time. It can be drawn easily on a whiteboard (stimulus -> nerve -> brain -> processing -> report). It directly attacks the idea of a specific time "T" when consciousness happens.
      *   *Wait, let's look at the "Taps on Forearm" idea the user mentioned.* Dennett uses this in *Consciousness Explained*. You tap the wrist and elbow. The signal from the wrist takes longer to reach the brain than the elbow (distance), yet we feel them simultaneously if tapped simultaneously. How? If there's a theater, it has to wait for the slow signal (delaying consciousness) or speed it up (post-diction). This creates the Stalinesque/Orwellian dilemma.
      *   *Decision:* The **Wrist/Elbow Tap (Temporal Delay)** argument is the strongest philosophical wedge for the Theater specifically. It can be drawn on a whiteboard (diagram of arm, nerves, brain, timelines). It forces the "finish line" problem.

  4.  **Drafting the Sequence (Dependency Structure):**
      *   *Step 1:* Intuitive Introspection (The Pull of the Theater). Must start here so they feel the problem.
      *   *Step 2:* The Neural Reality (Transmission Delays). Shows the physical constraint.
      *   *Step 3:* The Simultaneity Problem. If signals arrive at different times, how is experience simultaneous?
      *   *Step 4:* The Two Solutions (Stalinesque vs. Orwellian). Show both require a "magic moment."
      *   *Step 5:* The Multiple Drafts Dissolution. Deny the magic moment.
      *   *Logic:* Can't deny the theater (Step 5) before establishing why we want one (Step 1) and why physics makes it hard (Step 2/3).

  5.  **Mapping Misconceptions:**
      *   *1. "Lots of little theaters" (Homunculus inflation).* Forms when introducing Multiple Drafts. Head off by emphasizing *no* center, not *many* centers.
      *   *2. "Nobody is really conscious" (Eliminativism).* Forms when denying the finish line. Head off by distinguishing *phenomenology* from *metaphysics of location*.
      *   *3. "Self is just a story afterwards" (Narrative Gravity).* Forms at the end. Head off by clarifying "story" isn't fiction, it's the structure of processing.

  6.  **Comprehension Check:**
      *   Need a question that tests if they understand the *denial of the finish line*, not just "Dennett says no theater."
      *   *Question:* "At what exact millisecond did you become conscious of the tap?"
      *   *Real Answer:* "There is no fact of the matter."
      *   *Fake Answer:* "It happens when the parietal lobe processes it." (Still looking for a location/time).

  7.  **Deliberately Omitted:**
      *   *1. Qualia (in the robust sense).* Too much baggage.
      *   *2. The Hard Problem.* Distracts from the functional argument about the Theater.

  8.  **Refining the JSON Structure:**
      *   Ensure all keys match the prompt exactly.
      *   Ensure content is dense and appropriate for a PhD student (no hand-holding, precise philosophical distinctions).
      *   Check constraints: Whiteboard only. The Wrist/Elbow tap works well as a diagram.

  9.  **Self-Correction/Review during drafting:**
      *   *Critique of RHI:* Make sure to emphasize *ownership* vs. *locus of presentation*.
      *   *Carrying Example:* The Wrist/Elbow tap is better than Color Phi for whiteboard because it's about *transmission time* which is easier to draw as linear timelines.
      *   *Sequence:* Ensure the "why it cannot come earlier" field is robust.
      *   *Misconceptions:* Ensure the "forms_at_step" and "head_off_at_step" are distinct.
      *   *Omitted:* Make sure the "what I say instead" is practical script advice.

  10. **Final Polish:** Check JSON validity (quotes, commas, brackets). Ensure tone is professional and direct. (Self-correction: The prompt asks for "dependency structure, not a summary". The sequence needs to reflect logical dependency, not just chronological flow.)

  *(Self-Correction on Carrying Example)*: The user mentioned "taps-on-the-forearm thing". I should validate that choice. It *is* the right hill to die on for the Cartesian Theater specifically. The RHI is about *body matrix*, the Tap is about *temporal latency*. The Tap is the winner. I will formalize this as the "Neural Latency / Simultaneity" argument.

  *(Self-Correction on Misconceptions)*: The prompt lists three specific misconceptions to address. I must use those three.
  1. "so there are lots of little theaters"
  2. "so nobody is really conscious"
  3. "so the self is just a story we tell afterwards"

  *(Self-Correction on Omitted)*: Need two topics. "Qualia" and "The Hard Problem" are standard Dennett omissions in intro contexts. Or maybe "Zombies" and "Neural Correlates of Consciousness (NCC) search". Let's go with "NCC search" (because it presupposes a theater) and "Qualia (ineffable intrinsic properties)".

  Let's assemble the JSON.

  *Wait, one check on the Sequence:* The prompt asks for "dependency structure... which piece has to be in place before which and why". I need to make sure the `why_it_cannot_come_earlier_or_later` field explains the logical dependency, not just "it's next".

  *Check on Comprehension Check:* Needs to separate "got the argument" vs "just agree". The "fact of the matter" distinction is the core Dennettian move.

  *Check on Omitted:* "what_i_say_instead" needs to be a deflection script.

  Okay, ready to generate.cs
