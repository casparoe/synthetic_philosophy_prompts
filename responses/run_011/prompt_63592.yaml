answer: |-
  You have described a sophisticated and pernicious failure mode in performance management. It is distinct from the corruption of a single metric, and it is more structural than mere bias. You are correct to sense that existing labels like 'Goodhart's Law' or 'bureaucracy' are insufficient; the former describes the gaming of a fixed target, while the latter describes procedural heaviness without necessarily implying the *immunity* you have identified.

  Here is the analysis of the nearest established concepts, the distinction that separates your observation from them, and a proposed term for the phenomenon itself.

  ### Nearest Established Concepts

  **1. Goodhart's Law**
  *   **The Concept:** When a measure becomes a target, it ceases to be a good measure.
  *   **Why it fits:** This explains your first phase (the referral time metric).
  *   **Why it fails:** Goodhart's Law relies on the rigidity of the measure. Agents game the specific number because the number is fixed. In your second phase, the 'measure' is fluid. The agents are not gaming a number; they are adjusting the definition of success to match the performance. Goodhart's Law is about breaking the link between indicator and reality; your phenomenon is about making the indicator *incapable* of contradicting reality.

  **2. Institutional Decoupling**
  *   **The Concept:** From organisational theory (Meyer and Rowan). Organisations separate their formal structures (policies, assessments) from their actual work practices to maintain legitimacy.
  *   **Why it fits:** The assessment no longer reflects the operational reality (referral times worsened).
  *   **Why it fails:** Decoupling usually implies that the formal rules remain static while being ignored in practice. In your case, the formal rules (weightings, criteria interpretations) are actively *changed* during the assessment to align with practice. It is not a separation of structure and work; it is the adaptation of structure to justify work.

  **3. The Duhem-Quine Thesis**
  *   **The Concept:** From philosophy of science. A scientific theory cannot be tested in isolation because it relies on auxiliary assumptions. If a test fails, one can always save the theory by adjusting an auxiliary assumption.
  *   **Why it fits:** This is the exact logical structure you identified. The 'theory' is that the hospital is performing well. The 'data' is the operational reality. The 'auxiliary assumptions' are the weightings and criteria definitions. When reality threatens the theory, the assumptions are tweaked to preserve the conclusion.
  *   **Why it fails:** This is an epistemological principle, not an organisational behaviour term. It explains *how* the logic holds, but not *why* the panel behaves this way socially or structurally.

  **4. Leniency Error (or Central Tendency Bias)**
  *   **The Concept:** From psychometrics and HR. Raters systematically score too high or avoid extreme scores.
  *   **Why it fits:** The scores compressed into the top two bands.
  *   **Why it fails:** Leniency is a psychological bias of the rater. You correctly note that even disinterested outsiders might produce the same result. The immunity here is not in the *rater's mind*, but in the *instrument's design* (the flexible weightings and negotiable criteria). A lenient rater using a rigid rubric can still be overruled by the data; your panel cannot be overruled because they control the rubric's meaning.

  ### The Carving: What Makes This Distinct?

  The distinctive feature of your phenomenon is **retrospective standard-setting**.

  In standard evaluation, the standard exists *prior* to the performance. In your second phase, the standard is effectively negotiated *after* the performance is observed, to ensure the verdict is acceptable. This is not merely 'grade inflation' (which raises the average) but 'failure elimination' (which removes the possibility of a negative verdict).

  The mechanism is the combination of **multi-criteria flexibility** (eleven domains, adjustable weightings) and **consensual governance** (the panel). This creates a system with enough degrees of freedom that any operational state can be mathematically and narratively reconciled with a positive score.

  ### The Coined Term: Evaluative Immunity

  Since no single existing term captures the structural inability of an assessment to record failure, I propose the term **Evaluative Immunity**.

  **Definition:**
  *Evaluative Immunity occurs when a performance assessment framework possesses sufficient structural flexibility (in criteria, weightings, or interpretation) and sufficient governance consensus that no observable state of the organisation can result in a negative evaluation. The system becomes structurally unfalsifiable.*

  **Boundary Conditions (The Test):**

  To test whether a case counts as Evaluative Immunity, apply these two conditions:

  1.  **The Counterfactual Test (What would *not* count):**
      *   *Instance:* A qualitative panel assessment using fixed domains and fixed weightings, where the panel is generous but occasionally records a '2' or '3' because the evidence was undeniably poor, and the rules did not permit them to reweight the domains to hide it.
      *   *Verdict:* This is **Leniency Bias**, not Evaluative Immunity. The capacity for failure existed but was underutilised. Evaluative Immunity requires the *incapacity* for failure.

  2.  **The Single-Number Test (What *would* count):**
      *   *Instance:* A hospital trust has a single target: "Reduce waiting times by 5%." However, the contract includes a clause allowing the target to be recalculated annually "to reflect realistic capacity." Every year, waiting times rise, and the target for the next year is adjusted downwards to match the new baseline, ensuring the trust is always recorded as "meeting trajectory."
      *   *Verdict:* This **is Evaluative Immunity**. Even though it uses a single number, the *rule set* surrounding the number allows for retrospective adjustment that insulates the entity from failure. It is not Goodhart's Law (gaming the number); it is Immunity (adjusting the definition of the number).

  ### Confidence and Caveats

  **Confidence Level:**
  I have **moderate-high confidence** that 'Evaluative Immunity' describes a distinct and recognisable pattern in organisational management, particularly in public sector and professionalised environments where quantitative metrics are distrusted. I have **low confidence** that this is a singular, unified phenomenon rather than a conflation of two related issues.

  **Where I Might Be Wrong (The Pressure Test):**

  1.  **Conflating Mechanism and Outcome:**
      I am treating the *loss of the capacity to fail* and the *drift in criteria meaning* as one phenomenon. Under pressure, I would drop the idea that they are identical. It is possible to have criteria drift without total immunity (scores might fluctuate but remain high), and it is theoretically possible to have immunity through sheer collusion without criteria drift (ignoring the rules entirely). Your description suggests they are mutually reinforcing: the drift *enables* the immunity. If you found a case where the criteria remained rigid but the panel simply lied, that would be fraud, not Evaluative Immunity.

  2.  **Selection Bias in Your Examples:**
      You selected three instances (hospitals, university, software firm) that fit the pattern you already half-believe in. The risk is that you are focusing on the *assessment score* as the truth-bearer, when the assessment might actually be capturing something the single metric missed.
      *   *Consideration:* In the hospital example, you note referral times worsened by a fifth. Is it possible the new system correctly identified that speed was less important than safety or complexity, and the 'worsening' time was actually a neutral or positive development? If the qualitative assessment was *correct* to score highly despite the slower times, then the system is not 'immune'; it is simply measuring a different construct.
      *   *Verdict Change:* If you can demonstrate that the qualitative domains *actually correlated* with better patient outcomes (even with slower referrals), then this is not Evaluative Immunity; it is **Construct Validity Shift**. The phenomenon only counts as Immunity if the high scores are demonstrably disconnected from *all* meaningful outcomes, not just the old metric.

  3.  **The Role of Consensus:**
      I have placed weight on the 'panel' aspect. If you removed the panel and used an algorithm that auto-adjusted weightings based on performance to 'normalise' scores, you would get the same result. If this is true, the phenomenon is purely mathematical (degrees of freedom in the model) rather than sociological (panel consensus). I suspect it is both, but if forced to choose, the **structural flexibility** is the primary driver; the panel is merely the agent of that flexibility.

  ### Summary

  You are describing a system that has solved the problem of accountability by removing the possibility of negative judgement. It is not Goodhart's Law, which is the corruption of a fixed measure. It is the **structural unfalsifiability** of a flexible measure.

  I recommend using the term **Evaluative Immunity**. It signals that the assessment is not merely biased, but functionally protected from delivering a negative verdict. It distinguishes the *incapacity* to fail from the *unwillingness* to fail.

  Your intuition that this lives in the flexibility of the instrument rather than the motives of the people is the critical insight. The instrument was designed to be humane and holistic, but in doing so, it was made mathematically and procedurally incapable of contradiction. That is the carving.
