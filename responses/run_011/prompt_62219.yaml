answer: |-
  # PREPARATION SHEET: TESTIMONY AND TRUST WORKSHOP
  **Paper:** "Hearer-Relative Warrant and the Norm of Assertion"
  **Time:** 40m Talk / 20m Discussion
  **Room:** 25 pax (Core: Invariantist Epistemologists; Minorities: Legal, Linguists, Knowledge-First, SciComm)

  ## I. FRAMING WARNINGS (Misinterpretation Risks)
  *   **Do not let them hear:** "Truth is relative to stakes."
      *   *Correction:* Truth is invariant; the *propriety of the speech act* is relative to the hearer's practical context.
  *   **Do not let them hear:** "This is just about action, not belief."
      *   *Correction:* Belief is the standard vehicle for deliberation; warranting deliberation warrants belief *for the purpose of action*, which is the functional core of testimony.
  *   **Do not let them hear:** "Officials must satisfy the most paranoid listener."
      *   *Correction:* The "most exposed" member of the *intended* audience, bounded by reasonable expectations of the communication channel.

  ## II. THE OBJECTIONS (Ranked by Damage in This Room)

  ### 1. The Constitutive Rule Objection (Core Epistemologists)
  *   **Vocabulary:** "Constitutive rules," "Game of assertion," "Williamsonian."
  *   **The Charge:** "You aren't analyzing assertion; you're proposing a different practice. Knowledge is constitutive of assertion, like checkmate is constitutive of chess. If you change the norm, you're talking about 'advising' or 'guessing,' not asserting."
  *   **90-Second Reply:** "I deny that KNA is constitutive in the way chess rules are. Chess rules define the moves; assertion norms regulate a pre-existing social tool for information transfer. If the tool breaks when stakes are high (e.g., medical advice), we don't say the doctor wasn't 'asserting'; we say they asserted *improperly*. My account captures the propriety conditions of the actual practice, whereas KNA captures an idealized version that fails to explain why we blame speakers in high-stakes errors despite their having knowledge."
  *   **Soft Spot:** You are conceding that 'assertion' is a fuzzy natural kind, not a sharp technical term. This invites the charge that you are changing the subject.
  *   **Pre-empt?** **Yes.** State early: "I treat the norm as regulatory, not constitutive."

  ### 2. The "Just Tort Law" Objection (Legal Scholars)
  *   **Vocabulary:** "Duty of care," "Negligent misstatement," "Reasonable reliance."
  *   **The Charge:** "This is obvious. It's just the law of professional negligence. If this is your theory of *assertion*, you've reduced philosophy of language to tort law. What about casual conversation?"
  *   **90-Second Reply:** "Tort law codifies the norm for professional contexts, but the philosophical claim is that this reliance-structure underpins *all* assertion, even casual. When I tell you the bus comes at five, I implicitly warrant your reliance. The law just adds damages when the breach is costly. My account explains why the *law* tracks our intuitive norms, not the other way around. It unifies the casual and the professional under one functional account of trust."
  *   **Soft Spot:** You lack a clear boundary between 'casual' and 'professional' reliance.
  *   **Pre-empt?** **No.** Let them raise it; it validates the legal scholars while letting you elevate it to philosophy.

  ### 3. The Pragmatic Encroachment Smear (Core Epistemologists)
  *   **Vocabulary:** "Pragmatic encroachment," "Invariantism," "Epistemic vs Practical."
  *   **The Charge:** "You say this isn't about knowledge, but you're making epistemic propriety depend on practical stakes. This is pragmatic encroachment arriving by the back door. We are weary of this."
  *   **90-Second Reply:** "I am not encroaching on *knowledge*. I am invariantist about knowledge. A speaker can know $p$ invariantly. My claim is that *assertion* is a practical act, not a purely epistemic one. It transfers a license to act. It is no more 'encroachment' to say assertion depends on stakes than it is to say driving speed limits depend on traffic. The epistemic state is constant; the permission to use it varies."
  *   **Soft Spot:** You are drawing a sharp line between 'epistemic' and 'practical' that many in the room may reject.
  *   **Pre-empt?** **Yes.** Distinguish 'Norm of Knowledge' from 'Norm of Speech' in the intro.

  ### 4. The Sufficiency Attack (Knowledge-Firsters)
  *   **Vocabulary:** "Knowledge-first," "Sufficiency," "Gettier."
  *   **The Charge:** "You say knowledge isn't sufficient. If I know $p$, and your stakes are low, you say I can assert. But if your stakes are high, you say I cannot. So I know, but I must stay silent? That severs the link between knowledge and speech."
  *   **90-Second Reply:** "It does sever the link, and that is a feature. Knowledge is a state of the speaker; assertion is an interaction. If I know the bridge is safe, but you are transporting nuclear waste across it, my knowledge doesn't warrant *your* risk. I should say, 'I know it's safe, but check the engineering specs.' Silence isn't required; upgrading the warrant is."
  *   **Soft Spot:** This sounds like you are demanding *more* than knowledge, which might just be 'super-knowledge.'
  *   **Pre-empt?** **No.** This is a specific consequence you own.

  ### 5. The Moorean Oddity Problem (Core Epistemologists/Linguists)
  *   **Vocabulary:** "Moore's Paradox," "Linguistic intuition," "Oddity."
  *   **The Charge:** "You explain away the oddity of 'p, but I don't know p'. But on your view, 'p, but you shouldn't rely on this' should be the paradox. It isn't. Why does the original phrasing sound worse if knowledge isn't the norm?"
  *   **90-Second Reply:** "Because 'I don't know' is the standard heuristic for 'You can't rely.' In 95% of contexts, lacking knowledge means lacking reliance-warrant. The oddity is a pragmatic fossil, not a deep structural rule. We hear the heuristic, not the underlying norm. My account explains why the oddity vanishes in low-stakes/verification contexts, which KNA cannot."
  *   **Soft Spot:** Calling deep linguistic intuitions "heuristics" is dismissive to linguists.
  *   **Pre-empt?** **No.** Save this for Q&A.

  ### 6. The Evidential Mismatch (Linguists)
  *   **Vocabulary:** "Evidential marking," "Source encoding," "Semantics."
  *   **The Charge:** "Languages mark source strength (e.g., 'I heard', 'I saw'). They don't mark hearer stakes. If the norm is hearer-relative, why doesn't grammar reflect the hearer's context?"
  *   **90-Second Reply:** "Grammar encodes the *speaker's* contribution to the warrant, which is half the equation. The hearer's stakes are context-sensitive and cannot be morphologically marked on every verb. The evidential marks the input; my norm describes the output condition. The mismatch exists because grammar is speaker-centric, but communication is dyadic."
  *   **Soft Spot:** You admit the theory isn't linguistically transparent.
  *   **Pre-empt?** **No.**

  ### 7. The Broadcast Paralysis (SciComm/General)
  *   **Vocabulary:** "Public health," "Indeterminate audience," "Default rule."
  *   **The Charge:** "Your 'most exposed member' default makes public communication impossible. If one person might misuse a health notice catastrophically, you demand evidence standards no scientist can meet. This leads to paralysis or systematic lying."
  *   **90-Second Reply:** "The default applies to the *intended* audience, bounded by reasonable foreseability. A notice for 'adults' doesn't warrant reliance by a child. A notice for 'general public' assumes standard rational agency. We guard communication not because of the paranoid outlier, but because the 'exposed' member is often the standard vulnerable user, not the anomaly."
  *   **Soft Spot:** "Reasonable foreseability" is vague.
  *   **Pre-empt?** **Yes.** Clarify "intended audience" constraints in the talk.

  ### 8. The Reliance/Belief Convergence (Legal/Epistemic) **[FLAGGED CONVERGENCE]**
  *   **Vocabulary:** "Reasonable reliance" (Legal) vs. "Epistemic entitlement" (Epistemology).
  *   **The Charge:** "You focus on practical deliberation. But testimony transmits *belief*, not just action licenses. I can rely on a weather app without believing it. Assertion aims at belief."
  *   **90-Second Reply:** "This is the same objection from two angles. I argue belief is the cognitive component of reliance. To believe $p$ just is to be disposed to use $p$ in deliberation. If I warrant your deliberation, I warrant your belief. The legal 'reliance' and epistemic 'entitlement' converge here: both require safety for action. Separating them creates a belief that does nothing, which is epistemically idle."
  *   **Soft Spot:** Pragmatist theory of belief is controversial.
  *   **Pre-empt?** **No.** This is a strong synthesis point for you.

  ### 9. The Lying/Insincerity Trap (Linguists/Ethics)
  *   **Vocabulary:** "Insincerity," "Deception," "Normative status."
  *   **The Charge:** "If I assert $p$ knowing it's true, but I know your stakes are too high for my evidence, am I lying? If not, what normative violation is occurring?"
  *   **90-Second Reply:** "You are not lying, but you are being negligent. It's a breach of trust, not truth. Like a doctor who gives correct advice but skips the allergy check. The violation is against the *hearer*, not the *truth*. This explains why we feel betrayed by true but reckless assertions."
  *   **Soft Spot:** Distinguishing 'lying' from 'reckless truth' is ethically subtle.
  *   **Pre-empt?** **No.**

  ### 10. The Verification Cost Loophole (General)
  *   **Vocabulary:** "Epistemic labor," "Verification costs."
  *   **The Charge:** "If verification is cheap, I can assert anything. 'The moon is cheese, but check NASA.' That's improper assertion, not a low-cost verification scenario."
  *   **90-Second Reply:** "Correct. There is a baseline floor of plausibility. My norm applies to *contestable* claims. Absurdities fail the first test of assertion before we reach stakes. But for plausible claims, if verification is trivial, the warrant requirement drops. This explains why we assert freely in collaborative inquiry where checking is part of the process."
  *   **Soft Spot:** Defining 'absurdity' without appealing to knowledge.
  *   **Pre-empt?** **No.**

  ## III. STRATEGIC PRIORITIES

  ### The One Reply That Must Land
  **Objection #1 (Constitutive Rule).**
  If the core epistemologists decide you are simply talking about a different speech act (e.g., "predicting" or "advising"), the paper loses its home in the workshop. You must convince them that *assertion* is the genus, and KNA is a failed species description.
  *   **Tactic:** Use the "Medical Advice" example. Doctors assert. They are held to a higher norm than knowledge. If KNA were constitutive, doctors would be *incapable* of asserting in high-stakes contexts. That is absurd.

  ### The "Hope Nobody Asks" Objection
  **Objection #9 (Lying/Insincerity).**
  If you are pressed on whether a high-stakes reckless assertion is a *lie*, you risk collapsing into a moral theory of truth.
  *   **Least Bad Answer:** "It is a lie against the *trust*, not the *fact*. But let's distinguish normative impropriety from the specific speech act of lying. I am analyzing propriety, not the definition of lying." (This is weak, but buys time).

  ### What to Cut from the Talk
  To buy 5-7 minutes for discussion (crucial for this room):
  1.  **Cut the History:** Do not review Williamson vs. Brown vs. Stanley. Assume they know it. Mention only that KNA is the "standard view."
  2.  **Cut the Lottery Deep-Dive:** Everyone knows the lottery puzzle. State your solution in one sentence: "Lottery tickets fail because the hearer cannot verify and stands to lose." Move on.
  3.  **Cut the "Broadcast" Examples:** Keep one (public health), but don't list three. The SciComm students will ask about this in Q&A anyway; let them drive that part.

  ## IV. CONVERGENCE NOTE
  **Objections #2 (Legal) and #8 (Reliance/Belief) are the same point.**
  The Legal scholars see "Negligence." The Epistemologists see "Entitlement."
  *   **Strategy:** If a Legal scholar raises #2, answer as above. If an Epistemologist raises #8, use the Legal terminology ("duty of care") to show the convergence. This builds bridges between the two factions in the room. Show them they are agreeing with each other using different jargon.

  ## V. FINAL REMINDER
  **Do not defend Knowledge.** You are not attacking the nature of knowledge; you are attacking the *governance of speech*. Keep repeating: "Knowledge is invariant; Assertion is contextual." If you hold that line, you survive the invariantists.
