          *   (7) creates a second chamber from people who *declined* service.
          *   *Tension:* People who decline are likely systematically different from those who accept (even after stratification). They might be more cynical, busier, or distrustful. Giving them a veto creates a "chamber of cynics" that might block the "mirror" chamber. Also, does the second chamber also need to be a mirror? If it's drawn from decliners, it's a mirror of *decliners*, not the people.
