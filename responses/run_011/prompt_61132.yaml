          *   *Correction:* This isn't a conflict. I should note this as a *coherent* pair.

      *   *Conflict E: (5) Invitation Problem vs. (2) Descriptive Representation.*
          *   (5) admits self-selection bias.
          *   (2) demands a mirror.
          *   *Tension:* (5) acknowledges the practical hurdle to achieving (2). The user proposes "fixing up the sample after the fact" (stratified sampling/quotas).
          *   *Severity:* Low/Manageable. This is a known technical problem in sortition theory (like Citizens' Assemblies). It's solvable but costs money/effort.

      *   *Conflict F: (3) Competence Gate vs. (4) Equality of Ruling.*
          *   (4) says chance at office is equal share.
          *   (3) says not everyone gets a chance (only those who pass test).
          *   *Tension:* If I fail the test, I don't even get the "lottery ticket." So my share of ruling is zero, not equal.
          *   *Severity:* High. It undermines the egalitarian claim of (4).

  4.  **Select and Rank the Real Conflicts:**

      *   *Rank 1 (Severe):* (2) Descriptive Mirror vs. (3) Competence Gate. (Also touches (4)). This destroys the "mirror of the people" claim because the pool is no longer the people; it's the *literate* people.
