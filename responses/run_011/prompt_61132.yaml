      *   *Point 7 (Decliners):* This is distinct. It's a "Negative Chamber." It's novel but risky. Does it conflict with (2)? Yes, because it's not descriptive of the whole, only of the unwilling.

      *   *Point 5 (Invitation):* User admits the problem and proposes a fix ("fix up the sample"). This is coherent. No conflict here, just an admission of cost. I will mark this as "Fine."

      *   *Point 1 & 7 (Terms):* Coherent. Mark as "Fine."

  8.  **Final Plan:**
