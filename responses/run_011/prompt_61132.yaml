          3.  The "Weird" Design Choice (Point 7).
          4.  Summary advice.

  7.  **Self-Correction during drafting:**
      *   *Wait, look at Point 7 again.* "Second chamber drawn from the people who *declined* the first invitation."
      *   If I decline, I go into a pool for the veto chamber? That incentivizes declining if you want to be a "check" on power? Or does it mean a random draw from decliners?
      *   If it's a random draw from decliners, it's still a sortition chamber, just a different pool.
      *   The conflict is: Does this chamber represent the people? No, it represents the *unwilling*.
      *   Is this a conflict with (2)? Yes. (2) says the assembly should be a mirror. The veto chamber is a mirror of *refusniks*.
      *   Is this a conflict with (1)? Maybe. Are decliners less ambitious? Probably. So it fits (1).
      *   But giving a veto to the unengaged is risky.
      *   *Decision:* This is a high-severity design flaw, potentially worse than the competence gate because it creates institutional antagonism. I need to highlight this.

      *   *Re-evaluating Conflict 1 (Competence vs. Mirror):* This is the most obvious philosophical contradiction. If you filter by test, you filter by class. You lose the "descriptive" claim.
      *   *Re-evaluating Conflict 2 (Courts):* This is easily solvable with political theory (Will vs. Judgment). Low severity.
      *   *Re-evaluating Conflict 3 (Decliners):* This is an institutional design risk.

      *   *Let's prioritize:*
          1.  Competence Gate vs. Descriptive Rep (Philosophical core).
          2.  Decliner Veto (Institutional coherence).
          3.  Courts vs. Equality (Theoretical boundary).

      *   *Wait, Point 4 (Vote vs Office):* If I have a competence gate (3), do I have an equal chance at office? No. So (3) contradicts (4) directly. This reinforces Conflict 1.

      *   *Okay, let's group (2), (3), and (4).* They form a triangle of tension.
      *   (2) wants a mirror.
