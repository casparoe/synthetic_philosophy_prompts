  7.  **Drafting the Content (Self-Correction/Nuance Check):**
      *   *Correction:* Make sure to distinguish between "evidence against the *existence* of any effect" vs. "evidence against the *original magnitude*." The user's CI excludes the original point estimate. That is evidence of absence of the *original effect size*, even if a tiny effect remains.
