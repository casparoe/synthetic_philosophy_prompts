      *   *Statistical reality:* This depends entirely on the sensitivity of the test (power) and the Bayesian interpretation of the data.
      *   *Rhetorical usage:* Often used to shield established theories from falsification, especially in fields prone to publication bias (like social priming).

  3.  **Identify the Key Variables (as requested):**
