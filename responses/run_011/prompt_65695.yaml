      *Evidential base:* All of this rests on an evidential base that is shockingly thin, comprising merely a handful of stroke case reports. To build a metaphysical conclusion about the nature of value and experience on such a fragile clinical foundation is precarious. The variability in symptoms and the lack of standardized testing across these rare cases mean we are extrapolating universal principles from outliers whose internal worlds we can only access through compromised reports.

