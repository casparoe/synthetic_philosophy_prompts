  I reordered your split to prioritize physical survival before semantic analysis, distinguishing never-created from destroyed more sharply.

  **Diagnosing Archival Silence: A Decision Tree**

  *   **Start:** You expect evidence of X but find none or insufficient detail.
      *   **Q1:** Do parallel cases in this series normally contain records of X?
          *   **No:** Proceed to Category Check.
          *   **Yes:** Proceed to Survival Check.
      *   **Category Check:** Do contemporary texts outside this archive name or categorize X?
          *   **No:** **Conceptual Absence**. The event lacked a contemporary linguistic container.
              *   *Method:* Speculative narration; refuse anachronistic labeling.
          *   **Yes:** **Exclusionary Silence**. The system actively bypassed this subject.
              *   *Method:* Prosopography; map the boundaries of inclusion via negative cases.
      *   **Survival Check:** Is there physical evidence of removal (gap in numbering, index referencing missing file)?
          *   **Yes:** **Archival Violence**. Records existed but were destroyed or withheld.
              *   *Method:* Provenance research; trace custody chains and deaccessioning logs.
          *   **No:** Proceed to Legibility Check.
      *   **Legibility Check:** Does the document genre reduce the subject to an object (count, item, column)?
          *   **Yes:** **Formulary Silence**. The subject is present but voiceless due to form.
              *   *Method:* Read for clerical anxieties; analyze the constraints of the formulary itself.
          *   **No:** **Historiographical Silence**. The data exists but current questions render it invisible.
              *   *Method:* Re-read known sources; shift interrogatives rather than seeking new boxes.

  **Limitations of the Diagnostic**

  **Indistinguishable Pair:** Exclusionary Silence and Archival Violence. Without external indexes, you cannot prove a file was destroyed versus never created. This limitation is **merely unattractive**, as it curbs confident claims of state malice.

  **Empty Cell:** Conceptual Absence and Archival Violence. You cannot destroy a record of a category that did not exist. This combination is **incoherent**; no one can be at fault for failing to destroy the unthought.

  **Unexplored Overlap:** Formulary and Historiographical Silence. Some argue genre constraints are just our failure to read them. This boundary is **just unexplored** regarding where clerical constraint ends and historian blindness begins.
