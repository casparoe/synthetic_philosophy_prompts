      *   *ML:* Admit the triangle still exists but argue the *location* of the trade-off matters (policy vs. math).
      *   *Econ:* Admit gaming is real, argue transparency mitigates it better than opaque "fair" models.

  5.  **Identifying Overlaps:**
      *   Law "Disparate Treatment" and Advocacy "Stigma" are similar (social perception of group sensitivity).
