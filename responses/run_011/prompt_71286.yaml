      *   Actually, the biggest overlap is Law (Illegal) + Advocacy (Harmful) + ML (Unnecessary).
      *   Let's group: (1) Legal Liability, (2) Strategic/Equilibrium, (3) The "Nothing New" critique.

  6.  **Concessions:**
