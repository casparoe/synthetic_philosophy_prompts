      *   *Law Professor:* "Disparate Treatment. Intent. *Ricci v. DeStefano*."
      *   *Economist:* "Equilibrium effects. If I know Group A has a lower threshold, I manipulate features."
      *   *Advocacy 1 (Tenant/Credit):* "Who gets the false negatives? If you lower the bar for Group A, do they get set up to fail?"
      *   *Advocacy 2:* "Transparency. If you hide the group sensitivity, it's paternalistic. If you reveal it, it's discriminatory."
      *   *General/Philosophy-lite:* "Is calibration actually fair if the base rate is suppressed by historical injustice?"
      *   *The "Label" Critique:* "You say the label is part of the pipeline. If the label is biased, calibration is calibrated bias."

      *Refining to 8 high-impact objections:*
      1.  ML Theorist: "You didn't solve the triangle, you just dropped a vertex."
