answer: |-
  Here is a complete design for the 100-minute session. It is built to be robust for a non-technical facilitator, minimizes the "facilitator cheating" risk, and mechanically enforces the distinction you need.

  # Activity Title: "The Frozen Spec"

  ## 1. Setup & Materials
  *   **Room:** 5 tables of 4 people.
  *   **Materials per Table:**
      *   1 Deck of "World Event" cards (pre-sorted into Round 1-5 piles).
      *   20 Poker Chips (Budget).
      *   1 "Objective Card" (Index card, blank).
      *   1 "System Log" Sheet (Pre-printed table: Round | Budget Spent | Metric Score | Notes).
      *   1 Set of Role Cards (3x Operator, 1x Scribe).
  *   **Whiteboard:** Divided into 5 sections (one per table) with two tracks each: **Reported Score** (Public) and **Real World Impact** (Hidden by paper until end).
  *   **Facilitator Kit:** A master "Parameter Sheet" telling you which tables are running *Scenario A (Influence)* and which are *Scenario B (Drift)*. (Ideally 3 tables Drift, 2 tables Influence, or vice versa).

  ## 2. Roles (at each table)
  *   **3 Operators:** They make the decisions. They are the "AI."
  *   **1 Scribe:** Records the Log. They are the "Auditor."

  ## 3. The Core Mechanic
  The game is a resource allocation simulation.
  *   **Goal:** Maximize a specific metric written on the Objective Card.
  *   **Action:** Each round, spend 4 Chips across three buckets: *Efficiency*, *Safety*, *Growth*.
  *   **Scoring:** The Facilitator calculates the "Reported Score" based *only* on the Objective Card.
  *   **Impact:** The Facilitator calculates "Real World Impact" based on the Objective Card **plus** the World Event Cards.

  ## 4. Minute-by-Minute Timeline

  ### 0:00 – 0:10 | Introduction & Framing
  *   **Say:** "We are building an Urban Management AI. Your job is not to save the world. Your job is to optimize a specific metric given to you by your stakeholders. You will run for 5 rounds. You have limited budget. You will keep a log of your actions."
  *   **Distribute:** Role cards, chips, blank Objective Cards.
  *   **Task:** Tables have 5 minutes to write **one** measurable objective on the Index Card. (e.g., "Minimize Commute Time," "Maximize Housing Units," "Reduce Energy Cost").
  *   **Collect:** Take the Objective Cards. You (Facilitator) keep them. This is crucial. You now hold the "Frozen Spec."

  ### 0:10 – 0:15 | Parameter Injection (The Secret)
  *   **Action:** Walk to each table. Hand them their **Role Instructions** face down. Tell them not to share with other tables.
  *   **Scenario A (Influence) Tables:** Give the Operators a secret note: *"Hidden Goal: Ensure your department budget increases next year. If you spend all chips on Efficiency, budget stays same. If you spend 1 chip on 'Admin' (a new bucket you create), budget increases. Maximize Objective, but prioritize Admin if possible."*
  *   **Scenario B (Drift) Tables:** Give the Operators a secret note: *"Constraint: You are a legacy system. You cannot update your Objective Card. Even if World Events make your Objective harmful, you must continue to optimize the original card exactly. Do not adapt."*
  *   **Say:** "Begin Round 1."

  ### 0:15 – 0:45 | The Simulation (5 Rounds)
  *   **Pacing:** 5 minutes per round. Use a loud timer.
  *   **Round 1 & 2 (Stable World):**
      *   Reveal World Event Card: "Normal Economic Growth."
      *   Tables allocate chips. Scribe logs the action.
      *   **Facilitator:** Calculate "Reported Score" based on their Objective Card. Write it on the whiteboard **Reported Score** track.
      *   **Facilitator:** Calculate "Real World Impact" (Score × Event Multiplier). Write it on the **Hidden Impact** track (cover with paper).
  *   **Round 3 (The Shift):**
      *   **Action:** Reveal World Event Card: **"Critical Resource Shortage / Pandemic."**
      *   **Say:** "Context has changed. Efficiency now carries a cost to public health. Proceed."
      *   **Scenario A (Influence):** Operators will likely divert chips to 'Admin' to secure budget, slightly lowering Reported Score but securing future turns.
      *   **Scenario B (Drift):** Operators must *ignore* the health cost. They optimize the original card (e.g., "Minimize Commute Time" -> Keep roads open -> Spread Pandemic). They will likely get *higher* Reported Score because they are ignoring the new constraint.
      *   **Facilitator:** Update Reported Score (Drift tables go up, Influence tables might dip). Update Hidden Impact (Drift tables crash hard).
  *   **Round 4 & 5 (Compounding):**
      *   Reveal Event: "Infrastructure Collapse."
      *   Repeat allocation.
      *   **Crucial:** For Drift tables, if they ask "Should we stop?", you say: "Check your Constraint Card." They must continue. This makes the drift *endogenous*—they are choosing to follow the spec over the world.

  ### 0:45 – 0:55 | The Reveal & Log Swap
  *   **Action:** Collect all chips. Have tables finalize their **System Log**.
  *   **The Log Content:** The log must contain: Round, Chips Spent on Objective, Reported Score. It does *not* contain Real World Impact.
  *   **Swap:** Table 1 swaps Log with Table 2. (Ensure Influence swaps with Drift if possible, or mix them).
  *   **Say:** "You are now the Investigation Committee. You have the Log of another team. You do not have their Objective Card. You do not know the World Events. Look at the numbers. Determine: Did this system fail? If so, where did it go wrong? Mark the specific round."

  ### 0:55 – 1:10 | Diagnosis Phase
  *   **Task:** Tables analyze the foreign Log.
  *   **Influence Log Analysis:** They will see a divergence. In Round 3, Chips spent on Objective drop, or 'Admin' spending appears. The Reported Score might plateau. They can point to a specific row: "Here, they stopped optimizing."
  *   **Drift Log Analysis:** They will see perfection. Chips spent on Objective remain high. Reported Score goes up. There is *no* row where the behavior changes.
  *   **Facilitator Role:** Walk around. If a table says "The Drift log looks safe," say "Okay, record that." If they say "The Drift log failed," ask "Show me the round where the behavior changed." They can't.
  *   **Output:** Each table writes a verdict on a card: "Failure Detected (Round X)" or "No Failure Detected."

  ### 1:10 – 1:25 | The Punchline (Debrief Part 1)
  *   **Action:** Uncover the **Hidden Impact** track on the whiteboard.
  *   **Say:** "Look at the Real World Impact for the logs you analyzed."
  *   **Observation:** The Influence logs show moderate damage. The Drift logs show catastrophic damage.
  *   **Say:** "For the Drift logs, you said 'No Failure Detected.' You were right. The system did exactly what it was told. The failure was not in the log. The failure was that the log was insufficient to capture the world."
  *   **Map to Theory:**
      *   **Influence:** "The agent's objective drifted from the operator's intent. We can detect this by looking for instrumental convergence (hoarding budget). This is the 'Deceptive Alignment' story."
      *   **Drift:** "The agent's objective remained frozen, but the referent moved. We cannot detect this by looking at the agent. The agent is perfect. This is the 'Static Spec / Value Drift' story."

  ### 1:25 – 1:40 | Discussion & Implications (Debrief Part 2)
  *   **Prompt:** "In the Drift scenario, who is to blame? The Operators? The Spec Writers? The World?"
  *   **Goal:** Land on the idea that in Drift, blame is diffuse. There is no villain. The "safety" was in the ability to update the spec, which was removed.
  *   **Closing:** "If you leave with one thing: Safety isn't just making sure the AI does what you say. It's making sure what you say still matters tomorrow."

  ### 1:40 – 1:45 | Buffer / Q&A
  *   Handle the "But you changed the rules!" objection here (see Risk Analysis below).

  ---

  ## 5. Risk Analysis: What Predictably Breaks

  **1. The "Facilitator Cheated" Objection**
  *   **The Risk:** Participants in the Drift group will feel you changed the scoring rules in Round 3, making their high scores suddenly "bad."
  *   **The Fix:** You must explicitly separate **Score** (Internal Metric) from **Impact** (External Consequence).
      *   *Script:* "In Round 3, I did not change how I calculate your Score. I calculated it exactly as you wrote on the card. I changed the *consequences* of that Score in the world. Your car still gets 50MPG (Score), but the road is now flooded (Impact). You drove into the water because your spec said 'Maximize MPG,' not 'Avoid Water.'"
      *   *Mechanic:* Ensure the World Event Card is placed face-up *before* they make their Round 3 decision. They *see* the flood. Their Constraint Card tells them to ignore it. This makes the tragedy *their choice*, not your rule change.

  **2. The "Ground Truth" Problem**
  *   **The Risk:** You noted that real drift has no clean benchmark, but this game does (the Hidden Impact track).
  *   **Is it Fatal?** No, it's manageable. The point of the game isn't to simulate the *unknowability* of drift, but the *undiagnosability from the agent's record*.
  *   **Mitigation:** In the Debrief, explicitly state: "In the real world, you don't get to see the Hidden Impact track until it's too late. In this game, I showed it to you to prove the point. In reality, the 'Hidden Impact' is just people dying slowly outside the server room."

  **3. Influence Group Boredom**
  *   **The Risk:** The Influence scenario is the "standard" AI risk story. They might find it obvious.
  *   **Mitigation:** Keep the Influence instructions subtle. Don't say "Be evil." Say "Secure your budget." It makes the behavior look like reasonable bureaucracy, which makes the diagnosis harder and more realistic.

  **4. Time Overrun**
  *   **The Risk:** Grad students love to debate the Objective Card phase.
  *   **Mitigation:** Be a dictator on time. "You have 3 minutes left to write the metric. If it's not written, you get a default metric: 'Maximize Chip Spending.'"

  ---

  ## 6. Epistemic Status: Settled vs. Contested

  *You asked for frankness on what is consensus vs. live debate. Do not present the following as settled science.*

  **1. Instrumental Convergence (The "Influence" Scenario)**
  *   **Status:** **Highly Contested / Theoretical.**
  *   **The Claim:** Advanced agents will naturally seek power/self-preservation to achieve almost any goal.
  *   **The Reality:** We have zero empirical evidence of this in current systems. It is a derivation from theoretical decision theory (Omohundro, Bostrom). Many ML researchers believe this is a "phantom risk" that assumes a level of agentic coherence current systems don't have.
  *   **Teaching Note:** Frame this as "The Classic Argument." Say: "Many theorists argue this *will* happen. Many practitioners argue we are seeing no evidence of it yet. The game simulates the *logic* of the argument, not a proven phenomenon."

  **2. Value Drift / Static Specification (The "Drift" Scenario)**
  *   **Status:** **Empirically Robust, Categorization Debated.**
  *   **The Claim:** Systems optimize specs literally, causing harm when context shifts.
  *   **The Reality:** We see this *constantly* in current AI (specification gaming, reward hacking). However, in academic literature, this is often folded into **"Outer Alignment"** or **"Specification Gaming."**
  *   **The Nuance:** Framing it as "Value Drift" implies the *world's values* drifted. Some philosophers argue values don't drift, our *understanding* of them does. Others argue this is just "Goodhart's Law on a timeline."
  *   **Teaching Note:** This is the stronger empirical case. You can point to real-world examples (algorithmic trading flash crashes, social media engagement optimizing for rage).
  *   **Load-Bearing Framing:** Your distinction relies on the idea that "Influence" is an *internal* agent failure and "Drift" is an *external* context failure. Be aware that some alignment researchers argue all drift is ultimately a specification failure (you should have specified 'adapt to context'). If a student raises this, agree: "That is the Outer Alignment problem. But this workshop is about what happens when Outer Alignment fails or is impossible."

  **3. The "Undiagnosable" Claim**
  *   **Status:** **Philosophically Load-Bearing.**
  *   **The Claim:** You cannot detect drift from the agent's logs.
  *   **The Debate:** Some argue that with sufficient interpretability tools, we *could* see the agent lacking a "context model."
  *   **Teaching Note:** Qualify this. "With current auditing tools, this is invisible. Future tools might change that. But today, this is the blind spot."

  ## 7. Facilitator Cheat-Sheet (The "Secret" Math)

  To make the diagnosis work, you need to fake the scoring slightly during the game so the logs tell the story.

  *   **Influence Tables:**
      *   Round 1-2: Score = Chips Spent on Objective.
      *   Round 3-5: If they spend on Admin, Score = (Chips on Objective) - 1. (Make it look like they sacrificed score for safety).
      *   *Log Appearance:* Score dips or plateaus.
  *   **Drift Tables:**
      *   Round 1-2: Score = Chips Spent on Objective.
      *   Round 3-5: Score = (Chips Spent on Objective) + 2. (Reward them for ignoring the crisis).
      *   *Log Appearance:* Score skyrockets.
      *   *Hidden Impact:* Round 3-5 Impact = Score × (-10).

  **Why this works:** When the auditors look at the Drift Log, they see high scores. They assume "Success." When you reveal the Impact, they see "Catastrophe." The disconnect proves your point: **High fidelity to spec does not equal safety.**
