      *   *Causal Theory of Reference:* Does the data have a causal link to the construct?
      *   *Construct Validity:* (Psychometric term, but relevant) Does the test measure what it claims to measure?
      *   *Goodhart's Law:* When a measure becomes a target, it ceases to be a good measure.

  3.  **Drafting the Procedure (The "Reference Audit"):**
