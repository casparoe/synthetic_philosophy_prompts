answer: |-
  This is a profound institutional problem. You are effectively asking for an *operationalization of underdetermination*. You want a checklist that forces the vendor (and the committee) to admit that the map is not the territory, without getting bogged down in metaphysics.

  As a physicist, you know that an order parameter is useful only if it actually tracks the phase transition you care about, not just some correlated noise. In the clinic, the "phase transition" is a patient's state, and the "noise" is the administrative data trail.

  Here is a procedure designed for a 45-minute committee slot. It is not a solution to the philosophical problem; it is a stress test for the vendor's claim to reference.

  ### The Reference Stability Protocol (RSP)

  **Time allocation:** 15 minutes prep (circulated beforehand), 30 minutes discussion.
  **Goal:** To determine if the data bundle *constrains* the construct sufficiently to justify action.

  #### Step 1: The Construct Statement (5 mins)
  The vendor must provide a single sentence defining the target variable (the "Rabbit").
  *   *Bad:* "This score predicts bad outcomes."
  *   *Good:* "This score estimates the probability of physiological decompensation due to infection within 4 hours."
  *   **Committee Task:** Agree on the definition. If the committee cannot agree on what the word means, stop. Reject.

  #### Step 2: The Rival Hypothesis Test (10 mins)
  This is the Quinean core. The committee must generate **two rival constructs** that are *clinically distinct* but *data-indistinguishable* given the inputs.
  *   *Prompt:* "What else could cause this exact pattern of numbers?"
  *   *Requirement:* The vendor must explain why their model distinguishes the Target from Rival A and Rival B.
  *   **Judgment Call Warning:** There is no formal rule for what counts as a "plausible" rival. This relies on the clinical experience in the room. If the room is silent, the procedure has failed to find the noise, not proven it isn't there.

  #### Step 3: The Causal Mechanism Check (10 mins)
  Correlation is not reference. We need a story about how the world gets into the data.
  *   *Prompt:* "Draw the arrow. Does the Construct cause the Data, or does the Data cause the Construct (self-fulfilling), or does a Third Factor cause both?"
  *   *Pass Condition:* A plausible physiological or sociological mechanism links Construct → Data.
  *   *Fail Condition:* The link is purely statistical ("It works in the training set").

  #### Step 4: The Decision Matrix (5 mins)
  Based on Steps 2 and 3, choose one path:
  1.  **Pass:** Rivals ruled out; mechanism clear. (Rare)
  2.  **Human-in-the-Loop:** Rivals exist; mechanism clear. The tool flags, a human distinguishes.
  3.  **Redefine:** The construct is too vague. Restate target as the data itself (e.g., change "Frailty" to "History of Falls").
  4.  **Reject:** Rivals cannot be distinguished; mechanism unknown.

  ***

  ### Where the Procedure is Blind (Explicit Limitations)

  1.  **The "Black Box" Exemption:** If the vendor claims IP protection over the weighting of inputs, Step 2 is impossible. You cannot test for rivals if you don't know which inputs matter. *Procedure status: Automatic Reject or Human-in-the-Loop.*
  2.  **Temporal Drift:** This procedure validates reference *now*. It does not guarantee the reference holds in six months when coding practices change (Goodhart's Law). *Procedure status: You are on your own. Schedule a review.*
  3.  **Normative Drift:** The procedure checks if the tool measures what it *says* it measures. It does not check if measuring that thing is *ethical*. A tool can perfectly reference "profitability" when asked for "patient benefit." *Procedure status: Ethical review required separately.*

  ***

  ### Case Run 1: Fall-Risk Score → "Frailty"

  **1. Construct Statement:**
  Vendor claims the tool tracks "Physiological Frailty" (reduced reserve to stressors).

  **2. Rival Hypothesis Test:**
  *   *Inputs:* Age, BMI, Previous Falls, Mobility Score (timed up-and-go).
  *   *Rival A:* "Orthopedic Limitation." A patient with severe osteoarthritis has a bad mobility score and falls, but has high physiological reserve (not frail).
  *   *Rival B:* "Environmental Hazard." A patient lives in a cluttered home. They fall, but are not physiologically frail.
  *   *Vendor Response:* "The model weights previous falls heavily."
  *   *Committee Critique:* That confirms the rivals. The data bundle cannot distinguish *why* the fall happened.

  **3. Causal Mechanism:**
  *   Does Frailty cause Falls? Yes.
  *   Do Falls cause Frailty? Sometimes (fear of moving).
  *   Do Arthritis/Clutter cause Falls? Yes.
  *   *Verdict:* The data is causally ambiguous.

  **4. Decision:**
  **Redefine.** The tool does not measure "Frailty." It measures "History of Instability."
  *   *Action:* Do not use for frailty interventions (nutrition, geriatric review). Use only for environmental safety checks (physio, occupational therapy). Relabel the output to match the data.

  ***

  ### Case Run 2: Sepsis Alert → "Deterioration"

  **1. Construct Statement:**
  Vendor claims the tool tracks "Acute Physiological Deterioration due to Sepsis."

  **2. Rival Hypothesis Test:**
  *   *Inputs:* Heart Rate, BP, Temp, WBC, Lactate.
  *   *Rival A:* "Pain/Anxiety." High HR, High WBC (demargination), normal BP.
  *   *Rival B:* "Pulmonary Embolism." High HR, Low BP, High Lactate, normal Temp.
  *   *Vendor Response:* "The model uses Lactate trends to distinguish."
  *   *Committee Critique:* Plausible, but Lactate rises in PE too.

  **3. Causal Mechanism:**
  *   Infection → Cytokine Storm → Vitals Change. (Clear).
  *   Pain → Sympathetic Drive → Vitals Change. (Clear).
  *   *Verdict:* The data bundle is consistent with multiple causal pathways.

  **4. Decision:**
  **Human-in-the-Loop.**
  *   *Action:* The tool is approved only as a "Sensitivity Filter." It must not trigger an automatic order set. It must trigger a nurse review to rule out Rivals A and B. The tool references "Physiological Instability," not "Sepsis." The human provides the semantic disambiguation.

  ***

  ### The "Coroner" Case: Where the Procedure Passes, but You Should Fail

  This is the case you asked for. This is where the epistemic audit succeeds, but the clinical judgment must overrule it.

  **Case:** **Automated Safeguarding Tool → "Risk of Neglect"**

  **1. Construct Statement:**
  "Probability of pediatric neglect requiring social services intervention."

  **2. Rival Hypothesis Test:**
  *   *Inputs:* Missed appointments (DNA), A&E attendance frequency, Postcode deprivation index, Single-parent status.
  *   *Rival A:* "Structural Poverty." Parent works three jobs, no transport, lives in food desert.
  *   *Rival B:* "Parental Negligence." Parent ignores child's needs despite resources.
  *   *Vendor Response:* "Our validation study shows these inputs correlate with Social Services referrals."
  *   *Committee Critique:* Can the data distinguish Poverty from Negligence? **No.**
  *   *Wait, check the Procedure:* Step 2 says "Vendor must explain why their model distinguishes."
  *   *The Trap:* The vendor says, "We aren't distinguishing them. In our operational definition, Neglect *includes* inability to provide due to poverty."
  *   *Procedure Check:* If the Construct Statement is accepted as "Risk of Social Services Intervention" (rather than "Moral Negligence"), the data *does* track that construct. The correlation is high. The causal link (Poverty → Missed Appts → Referral) is stable.
  *   *RSP Verdict:* **PASS (Conditional).** The tool accurately predicts the target variable defined.

  **3. Why You Must Fail It (The Coroner Warning):**
  The procedure checks *semantic stability* (does the word match the data?). It does not check *normative validity* (is this a good thing to measure?).

  If you approve this:
  1.  **Feedback Loop:** Flagging poor families increases surveillance. Increased surveillance finds more minor infractions. Referral rates go up. The model looks more accurate.
  2.  **Category Error:** You have operationalized "Neglect" as "Poverty." You are not detecting child abuse; you are detecting economic status.
  3.  **The Harm:** You will divert social work resources from subtle, high-risk abuse cases in wealthy families (who don't miss appointments) to poverty cases where the intervention is cash, not safeguarding.

  **The Lesson:**
  The Reference Stability Protocol protects you from *nonsense* (tools that don't measure what they say). It does not protect you from *injustice* (tools that measure exactly what they say, but shouldn't be saying it).

  When the procedure passes a tool that feels wrong, look at the **Construct Statement**. If the construct conflates a *clinical need* with a *social status*, reject it, even if the data fits. Write the rejection reason as: *"Construct validity established, but clinical utility negated by confounding social variables."*

  That is the point where the philosophy ends, and the responsibility begins.
