          *   Why it should fail: It punishes poverty. It creates a self-fulfilling prophecy. It biases against marginalized groups. The *reference* is stable, but the *intervention* is harmful. The RSP checks semantic/epistemic alignment, not ethical consequence. This is the limitation.

  5.  **Refining the Tone:**
      *   Respectful of the user's background (physics + philosophy).
