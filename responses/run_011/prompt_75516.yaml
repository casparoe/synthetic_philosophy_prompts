          *   *Decision:* The "Social Risk/Neglect" example is stronger for the "reference" angle. It claims to measure "Neglect," and the data *does* track neglect, but it tracks *poverty* better, and conflating them is the error. The procedure might miss the conflation if the definition of neglect is loose. Let's go with a "Safeguarding/Neglect" tool.

  8.  **Final Polish:**
      *   Ensure the "Judgment Call" boxes are visible.
