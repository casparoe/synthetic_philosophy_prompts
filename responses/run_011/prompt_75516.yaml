      *   Make sure the "Coroner" warning is prominent.

  9.  *(Self-Correction on the "Coroner" Case)*: The prompt asks for a case where the *procedure* passes something the *user* thinks should be failed. This implies the procedure has a blind spot. The blind spot is *normative/ethical* vs *semantic/epistemic*. Or it's *temporal stability* (the model drifts). Let's choose **Algorithmic Triage for Resource Allocation**.
