prompt: |-
  I'm trying to get straight on the two Benacerraf problems and how they actually relate, and everyone keeps calling them "two horns of one dilemma," which feels sloppy to me since they seem to be doing really different work. Compare the argument of "What Numbers Could Not Be" (the Zermelo-vs-Dedekind reduction point) with the argument of "Mathematical Truth" (the abstract-objects-and-knowledge point). What does each one presuppose — about reference and about knowledge respectively — and are they actually independent? I want to know whether you can accept the conclusion of one and reject the other, and what a theory that does that looks like in practice. And where does a Field-style fictionalist land: does it dodge both, neither, or just one of them?

  Then here's the bit I really want your take on. A guy in my reading group argues that the first problem, taken seriously, defuses the second: once you go structuralist and say there's no fact of the matter about which objects the numbers are, then the question "but how do we get into epistemic contact with them?" has no determinate target anymore, so the epistemological problem evaporates rather than getting answered. My instinct is that this just relocates the question — now you owe an account of access to the structure itself, which if anything is less concrete than access to particular objects — but I cant articulate the reason cleanly, and I assume a Shapiro-style ante rem structuralist has a reply about how we latch onto patterns. Give me the strongest version of each side and then say which one you think actually wins.

  One more thing: does the second problem survive at all if you strip out the causal constraint on knowledge that seems to be driving it and put something reliabilist in its place instead, or is that just refusing to engage with the challenge?

  Bottom line up front — first sentence should be your actual verdict on the reading-group arguement, then the reasoning. No preamble, and don't restate my question back at me.
