answer: |-
  This is a profound question that cuts to the heart of the tension between the *legal* architecture of war and its *moral* foundations. As a physicist, you will recognize the structure of the problem: we have an effective theory (International Humanitarian Law, or IHL) that yields stable, predictable results, but its underlying fundamental variables (moral liability and agency) are subject to competing interpretations.

  The asymmetry you identify—immunity for the soldier, liability for the leader—is the defining feature of the "Legalist Paradigm" of Just War Theory. To answer your question, we must disentangle what the law *does*, what moral theories *justify* it, and where the friction lies between them.

  ### 1. The Traditional Account: The Moral Equality of Combatants (MEC)

  The standard explanation, most famously articulated by Michael Walzer in *Just and Unjust Wars*, rests on the **Moral Equality of Combatants**.

  *   **The Theory:** This view posits a sharp separation between *jus ad bellum* (the justice of going to war) and *jus in bello* (justice in the conduct of war). Soldiers are instruments of the state. Once a state enters a state of war, its soldiers are granted a "license to kill" enemy combatants, regardless of whether their state's cause is just.
  *   **The Asymmetry:** This fits the leader-soldier asymmetry perfectly. The Leader possesses *political agency*; they decide whether the threshold of violence is crossed. The Soldier possesses *tactical agency*; they decide how violence is applied. Therefore, the Leader is liable for the existence of the threat (aggression), while the Soldier is liable only for the *manner* of the threat (war crimes).
  *   **Moral Responsibility:** Under MEC, the soldier is not morally culpable for fighting an unjust war because they act under a form of "collective authorization." They are not murderers; they are agents of a sovereign entity.

  **Verdict:** This theory makes the legal arrangement coherent and intuitive. However, it has come under heavy fire from "Revisionist" just war theorists (such as Jeff McMahan) who argue that MEC is morally false. They contend that if a war is unjust, the soldiers fighting it are essentially committing justified homicide (if defensive) or unjustified homicide (if aggressive), regardless of the law.

  ### 2. Reconstructions Without MEC

  If we discard MEC (accepting that unjust soldiers are morally liable to be harmed), can we still justify their legal immunity? Yes. Several rival theories converge on the same legal arrangement for different reasons. This is a case of **overdetermination**: the law is robust because multiple moral streams feed it.

  #### A. The Epistemic and Duress Argument
  *   **Theory:** Soldiers lack the capacity to judge the *jus ad bellum*. Intelligence regarding the casus belli is held by the state. Furthermore, soldiers operate under significant duress (military discipline, threat of imprisonment, social coercion).
  *   **Fit with Asymmetry:** Leaders have access to the intelligence and face no duress in planning war. Soldiers have neither. Therefore, liability attaches to the epistemic superior.
  *   **Coherence:** This supports the asymmetry well. However, it struggles with "manifestly aggressive" wars (e.g., a German soldier in 1944). If the aggression is obvious, the epistemic defense weakens, yet the legal immunity remains.

  #### B. The Institutional/Pragmatic Argument (Reciprocity)
  *   **Theory:** This is a consequentialist view. The primary goal of IHL is to minimize suffering. If soldiers believed they would be prosecuted for merely fighting upon capture, they would not surrender. They would fight to the death.
  *   **Fit with Asymmetry:** This justifies immunity strictly as a functional necessity. It also justifies punishing leaders: holding leaders accountable deters the initiation of war without undermining the incentive for soldiers to lay down arms.
  *   **Coherence:** This is perhaps the strongest justification for the *law* as it stands, even if it contradicts the *moral* truth (if Revisionists are right). It treats combatant immunity not as a right, but as a bargain.

  #### C. The Division of Moral Labor
  *   **Theory:** Society assigns different roles with different moral permissions. We allow police to use force so citizens don't have to; we allow soldiers to fight so politicians don't have to.
  *   **Fit with Asymmetry:** The soldier's role obligation is to fight effectively and humanely. The politician's role obligation is to ensure the fighting is necessary. Violating role obligations creates liability.

  ### 3. Distinguishing "Requires" from "Sits Comfortably With"

  It is crucial to distinguish what the current legal regime *strictly requires* versus what merely *supports* it.

  *   **What the Law Requires:** To maintain the Prisoner of War (POW) system and the incentive to surrender, the law **requires** combatant immunity. It does *not* require the Moral Equality of Combatants to be morally true. It only requires that soldiers *believe* they will be treated humanely.
  *   **What Sits Comfortably:** The Moral Equality of Combatants sits comfortably with the law. It provides a moral narrative that validates the soldier's self-conception. It allows a soldier to look an enemy in the eye without feeling like a criminal.
  *   **Convergence:** A Walzerian (Traditionalist) and a Utilitarian (Pragmatist) will both defend the soldier's immunity.
      *   The Walzerian says: "The soldier has a *right* to fight."
      *   The Utilitarian says: "The soldier must be *granted* immunity to save lives."
      *   **Result:** The legal outcome is identical, though the moral grounding differs.

  ### 4. The Coherence of the Asymmetry

  Is the leader-soldier asymmetry a coherent completion of these accounts?

  **Under the Traditional View:** Yes. It is a clean split of agency.
  **Under the Revisionist View:** No. If unjust soldiers are morally liable to be killed in war (because they pose an unjust threat), it is inconsistent to say they are not liable to be punished after the war.
  **Under the Pragmatic View:** Yes, but it is a *stable inconsistency*. We accept a moral fiction (that the soldier is innocent of the war's cause) to achieve a humanitarian end (humane detention and release).

  The asymmetry rests on a specific picture of agency: **The Architect vs. The Builder.**
  If a building is constructed illegally, the Architect (Leader) is liable for the decision to build. The Builder (Soldier) is not liable for the existence of the building, provided they followed safety codes (*jus in bello*). The law treats war as a collective act of state, not a collection of individual murders.

  ### 5. Concrete Implications of Abandoning MEC

  You asked what would have to change if the moral-equality reading were given up (i.e., if we accepted the Revisionist view that unjust combatants are morally liable).

  1.  **Treatment of Captives:**
      *   **Current:** All combatants are POWs. They are detained administratively, not punitively, until hostilities end.
      *   **If MEC Abandoned:** In principle, "unjust" combatants could be treated as criminals or unlawful combatants. They could be tried for the act of fighting itself.
      *   **Consequence:** The distinction between POW camps and prisons would blur. Soldiers would know that surrender might lead to decades in prison for "participation in aggression."

  2.  **Behavior on the Battlefield:**
      *   **Current:** Soldiers surrender when the position is hopeless.
      *   **If MEC Abandoned:** Soldiers would fight to the death. The incentive to surrender evaporates if the alternative is a show trial for aggression. This would increase casualties on both sides.

  3.  **Treatment of Commanders:**
      *   **Current:** Commanders are liable for Aggression (Crime of Aggression) and War Crimes.
      *   **If MEC Abandoned:** Commanders might face *strict liability* for the actions of their troops regarding *ad bellum* violations, even if they tried to restrain them. The pressure to ensure the war is just would shift from a political constraint to a criminal law constraint with higher stakes.

  ### Summary for the Physicist

  Think of the Law of Armed Conflict as an **effective field theory**.
  *   **Fundamental Theory (Moral Reality):** Revisionists argue that at the fundamental level, liability tracks moral responsibility for unjust threats. Unjust soldiers are "morally charged" negatively.
  *   **Effective Theory (IHL):** At the macroscopic level of international order, we cannot measure the "moral charge" of every soldier case-by-case. The epistemic cost is too high, and the system stability (reciprocity) is too valuable.
  *   **The Renormalization:** We "renormalize" the soldiers to zero charge (immunity) to prevent the system from collapsing into total war, while keeping the "high-energy particles" (Leaders) fully charged and liable.

  The pairing you observe presupposes a **pragmatic theory of liability**. It prioritizes the *consequences* of attribution (will this lead to more humane war?) over the *truth* of attribution (did this soldier morally deserve to kill?). The leader-soldier asymmetry is coherent not because soldiers are morally innocent of aggression, but because they are **institutionally insulated** from it to preserve the possibility of peace. The law sacrifices moral precision for humanitarian utility.
