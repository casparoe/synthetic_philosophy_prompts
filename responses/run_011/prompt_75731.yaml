answer: |-
  Here is the blueprint. I'm going to start with the blunt truth you asked for, because it dictates how you referee the room.

  ### The Blunt Truth: The Administrative Trap
  You are right to worry. A voting/token mechanic inherently teaches that identity is a *regulatory* status (who gets the insurance money) rather than an *ontological* fact (what the thing *is*). You cannot game-mechanize metaphysics without reducing it to bureaucracy.

  **Do not try to fix this.** Lean into it.
  The game isn't about solving the puzzle; it's about simulating the burden of *stewardship*. The "trap" is the point: in the real world, museums, insurers, and heritage boards *do* decide this via paperwork and votes. The philosophical discomfort your players feel when they realize they are "voting on reality" is the actual lesson.

  **The Fix:** In the debrief, explicitly name this limitation. "This game didn't tell us what the press *is*. It told us how hard it is to agree on what to *call* it."

  ---

  ### Materials & Roles
  *   **Tables:** 6 tables, 3 people each.
  *   **The "Board":** Each table gets 1 Envelope (sealed), 1 Score Sheet, 20 Poker Chips (white), 1 "Verdict Token" (a distinct object, like a heavy metal nut).
  *   **Facilitator:** You. You hold the timer and the "Master Deck."
  *   **Table Scribe:** Rotates each card. Responsible for moving chips and recording the vote.
  *   **Cards:** 12 Event Cards (text below). Print on cardstock.
  *   **Room:** The 1913 press must be visible/accessible.

  ### Token Economics (Sanity Check)
  *   **Start:** 20 Chips per table.
  *   **Cost:** 1 Chip per Card to cast a ruling (placed in a central "Pot" cup).
  *   **Consistency Bonus:**
      *   If your ruling matches your *previous* card's ruling: Gain 2 chips from the bank.
      *   If your ruling differs from your *previous* card's ruling: Gain 0 chips.
      *   *(Card 1 is free: No previous ruling to match.)*
  *   **The Math:**
      *   If a table never changes their mind: 20 (start) - 12 (cost) + 22 (bonus) = **30 Chips**.
      *   If a table flips every time: 20 (start) - 12 (cost) + 0 (bonus) = **8 Chips**.
      *   **Why this works:** It punishes hedging. To win the "Heritage Plaque" (a bottle of wine or shop credit), a table needs 20+ chips *and* a valid Standard. You can't coast; you must commit.

  ### Timeline (90 Minutes)
  *   **0:00–0:10:** Welcome. Pour wine. Seat tables. No talk of philosophy.
  *   **0:10–0:20:** **The Standard.** Each table writes one sentence: *"The 1913 Press is still the 1913 Press if..."* Seal in envelope. Do not discuss with other tables.
  *   **0:20–0:65:** **The Events.** 12 Cards. 3.5 minutes per card.
      *   0:30 Read Card.
      *   2:00 Discuss & Vote.
      *   1:00 Pay Chips & Record.
      *   *Facilitator Note:* Be ruthless with the timer. Ring a bell.
  *   **0:65–0:80:** **The Audit.** Count chips. Open Envelopes. Check for "Double-Certification" (forfeit rule).
  *   **0:80–0:90:** **The Reveal.** Introduce "Ship of Theseus." Closing line.

  ---

  ### The 12 Event Cards
  *Print these. Do not add commentary.*

  **Card 01: The Gear (1954)**
  The main drive gear strips. A local machinist casts a new one from the same steel alloy. The old gear is scrapped.
  *Ruling:* Is this the 1913 Press? (Yes/No)

  **Card 02: The Flywheel (1978)**
  The flywheel cracks. A replacement is sourced from a sister shop in Chicago. It is the same model, same year, same wear.
  *Ruling:* Is this the 1913 Press? (Yes/No)

  **Card 03: The Frame (1994)**
  A casting flaw causes the main frame to snap. The original manufacturer is gone. A new frame is welded to spec, painted to match. All original internals are moved into it.
  *Ruling:* Is this the 1913 Press? (Yes/No)

  **Card 04: The Bed (2011)**
  The print bed is re-poured with modern composite material. It holds ink better than the original iron. The old iron bed is recycled.
  *Ruling:* Is this the 1913 Press? (Yes/No)

  **Card 05: The Hoard (Present Day)**
  An apprentice admits they saved every single replaced part listed in Cards 1–4. They have assembled them in the back room. That machine runs.
  *Ruling:* Which machine is the 1913 Press? (The One In Use / The One In Back / Neither)

  **Card 06: The Fire (Hypothetical)**
  A small electrical fire melts the platen. The shop rebuilds it exactly to the 2011 specs using new materials. No original metal remains from before 2011.
  *Ruling:* Is this the 1913 Press? (Yes/No)

  **Card 07: The Storage (Hypothetical)**
  The "Hoard Machine" (Card 05) is put into storage. The "Continuous Machine" (Card 04) does all the printing for 10 years.
  *Ruling:* Which machine holds the heritage? (The One In Use / The One In Storage)

  **Card 08: The Swap (Hypothetical)**
  The "Hoard Machine" is brought out. The "Continuous Machine" is put into storage. The Hoard Machine now prints the Thursday newsletter.
  *Ruling:* Did the heritage move with the parts, or stay with the job? (Parts / Job)

  **Card 09: The Digital (Hypothetical)**
  A modern CNC machine is bought. It prints the newsletter with the same fonts, same paper, same crew. The 1913 Press sits silent.
  *Ruling:* Is the CNC machine the 1913 Press? (Yes/No)

  **Card 10: The Fabrication (Hypothetical)**
  Over 20 years, every part of the 1913 Press is 3D printed or fabricated in-house as originals wear. No outside parts remain.
  *Ruling:* Is this the 1913 Press? (Yes/No)

  **Card 11: The Noun (Administrative)**
  The insurance policy covers "The Press." The lease covers "The Shop." The newsletter masthead says "Printed on the 1913."
  *Ruling:* Which noun gets the payout? (The Machine / The Shop / The Newsletter)

  **Card 12: The Certification (Final)**
  You must award the Heritage Plaque to exactly one claimant.
  *Claimants:* A) The Continuous Machine (In Room). B) The Hoard Machine (Parts). C) The Function (The Crew/Job).
  *Action:* Place your Verdict Token on the winner. If your Standard allows two winners, you forfeit.

  ---

  ### Debrief Script (Last 10 Minutes)

  **1. The Audit (3 Mins)**
  "Count your chips. If you have fewer than 20, you were inconsistent. If you have more, you stuck to a principle. Now, open your envelopes. Read your Standard aloud."
  *(Facilitator listens for loopholes. If a table says "It's the press if it prints," but they voted for the Hoard Machine which hasn't printed in 10 years, call the contradiction. If they say 'It's the original metal' but voted for the Continuous Machine, call it.)*
  "Any table whose Standard logically allows *two* winners to claim the plaque? You forfeit the pot. This isn't democracy; it's certification."

  **2. The Name (3 Mins)**
  "You just fought over a ghost. This puzzle is 2,400 years old. It's called the **Ship of Theseus**. Plutarch wrote about it. Hobbes added the bit about the second ship made of old parts. Usually, people talk about 'identity' or 'persistence.' I banned those words tonight because they are abstract. You don't fix a press with abstractions. You fix it with steel."

  **3. The Trap (2 Mins)**
  "Here is the thing this game cannot tell you: We voted on who gets the plaque. That makes it look like identity is something we *decide*. It isn't. The game simulates the *paperwork*, not the *truth*. In the real world, the museum director signs the paper, not the philosophers. You just felt the weight of that signature."

  **4. The Close (2 Mins)**
  *(Turn to the two regulars who run the press)*
  "And for the two of you who actually grease the bearings: Don't let the philosophy haunt you. The press isn't the iron. It isn't the parts in the crate. It's the verb. You keep it real by running it. As long as the Thursday crew is here, and the ink is wet, the 1913 is right here."

  ---

  ### Risk Management: What Will Go Wrong

  **1. The "Both" Loophole**
  *   **Problem:** A table writes a standard like "It's the press if it works OR if it has the parts." They try to claim the pot at the end by saying both win.
  *   **Fix:** The Rule is strict: "Only one claimant can be certified." If their standard implies two valid claimants, they forfeit *before* chip counting. Enforce this coldly. It forces them to write tighter standards.

  **2. The Operator Hurt**
  *   **Problem:** The two regulars feel like the game suggests their machine is a "fake."
  *   **Fix:** The Closing Line (above) is non-negotiable. Deliver it looking at them. Validate the *work*, not the *atoms*.

  **3. Analysis Paralysis**
  *   **Problem:** Tables spend 10 minutes on Card 05. You run out of time.
  *   **Fix:** Use a visible timer. When it beeps, pens down. If a table hasn't voted, they lose 2 chips automatically. Speed creates intuition; intuition reveals bias.

  **4. The "Administrative" Cynicism**
  *   **Problem:** Players conclude "Nothing is real, it's all just labels."
  *   **Fix:** Counter this in the debrief. "Labels matter. Insurance matters. Heritage matters. The fact that it's hard to define doesn't mean the definition is worthless. It means stewardship is hard work."

  ### Final Advice on the "Administrative Trap"
  You worried that making it a board decision teaches that identity is administratively settled. **It does.**
  But that is the *sociological* truth of the matter. Whether the press *metaphysically* persists is unknowable. Whether the press *legally* persists is decided by a board.
  By forcing them to act as a board, you are stripping away the comfort of abstract philosophy and forcing them to deal with the consequence of the definition. That is not smuggling in an answer; it is smuggling in *responsibility*.

  If a player pushes back in the debrief ("But you didn't tell us what it *really* is!"), your answer is:
  "Nobody can. That's why we have to vote."
