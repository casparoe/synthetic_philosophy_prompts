prompt: |-
  I sit on the committee that writes our health system's guidance for when a clinician can rely on an AI diagnostic aid without doing their own re-verification. Right now the whole thing hinges on one sentence, roughly: the clinician may treat the aid's output as known-correct when its reported confidence is above 0.95. It's falling apart in review and I have to circulate something before next Thursdays meeting.

  Three camps. The single-number people say 0.95 across the board is the only thing thats auditable and the only version where the sentence means the same thing from one paragraph to the next. The sliding-scale people say the number has to move with what's at stake — 0.85 is plenty for "here's a differential, go work it up" and nowhere near enough for "you're cleared for an irreversible procedure." And then there's a member who used to teach philosophy, who thinks the sliding version isn't just unworkable but confused: two residents looking at the same output on the same evidence either both know it or neither does, and what's at stake belongs in the decision rule, not in the knowledge claim. She's also put a compromise on the table, which is that "knows" is context-sensitive, so the low-stakes room and the high-stakes room are each using it correctly and there's no contradiction to fix. My problem with that one is that a written policy doesn't live in a single context — it gets read out in a chart note, in credentialing, in discovery.

  So: draft the memo. It has to come down on one structure — single threshold, sliding threshold, contextualist wording, or something else entirely — with real numbers and real proposed language for the sentence, not a menu of options. About a page. Take the confused-objection seriously rather than waving at it: if she's right about knowledge, say what that does to our wording and to the sliding-scale proposal; if she's wrong, explain why in terms a room full of clinicians and one hospital lawyer can actually follow. And tell me straight whether we can run a stake-indexed action threshold without taking any position at all on whether knowledge itself is stakes-sensitive, because if we can, I'd much rather not litigate that inside a policy document. Assume whatever we write gets quoted back at us in malpractice discovery.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Committee member drafting a memo for a health system guidance committee.
      *   **Task:** Draft a memo recommending a specific structure for AI diagnostic aid reliance guidance.
      *   **Deadline:** Next Thursday (implies urgency, needs to be actionable).
      *   **Length:** About a page.
      *   **Core Conflict:**
          *   *Camp 1 (Single-Number):* 0.95 confidence across the board. Auditable, consistent.
          *   *Camp 2 (Sliding-Scale):* Threshold varies by stakes (e.g., 0.85 for differential, 0.99 for surgery).
          *   *Camp 3 (Philosopher/Clinician):* Epistemic objection. Knowledge isn't stakes-sensitive. Two residents looking at the same data either both know or neither does. Stakes belong in the *action*, not the *knowledge claim*. Proposed compromise: Contextualism (knowledge is context-sensitive).
      *   **User's Concern:** Policy lives in multiple contexts (chart, credentialing, discovery). Contextualism might be too vague for legal/audit purposes.
      *   **Key Constraint:** Must choose *one* structure (no menus). Must address the philosopher's objection seriously. Must address whether we can separate action thresholds from knowledge claims. Must be defensible in malpractice discovery.
      *   **Tone:** Professional, decisive, legally aware, clinically grounded.

  2.  **Deconstruct the Philosophical Objection:**
      *   The philosopher argues that "knowledge" is binary/stable relative to evidence, not stakes. This is the classic "Subject-Sensitive Invariantism" vs. "Contextualism" vs. "Pragmatic Encroachment" debate in epistemology.
      *   *Her point:* Saying "I know this diagnosis" shouldn't change based on whether the treatment is risky. The *decision* to treat changes, not the *state of knowing*.
      *   *Implication for Policy:* If we write "You may *rely* on the AI," we are making a claim about the AI's reliability (epistemic), not just the clinician's permission to act (pragmatic).
      *   *User's specific question:* Can we run a stake-indexed action threshold without taking a position on whether knowledge itself is stakes-sensitive?
      *   *Answer:* Yes. This is the "Pragmatic Encroachment" workaround. We define the threshold for *actionable reliance*, not for *truth* or *knowledge*. We shift the language from "knowing the output is correct" to "authorized to act without verification."

  3.  **Evaluate the Options:**
      *   *Single Threshold (0.95):* Safe legally, but clinically rigid. Might block useful AI use in low-stakes scenarios or encourage dangerous use in high-stakes if 0.95 isn't enough for surgery.
      *   *Sliding Threshold:* Clinically superior. Legally riskier if not framed correctly.
      *   *Contextualist Wording:* Too vague for discovery. "It depends on the context" is a plaintiff lawyer's dream.
      *   *The "Something Else" (Action-Based):* Decouple the epistemic claim ("is this true?") from the operational claim ("can I skip verification?"). This satisfies the philosopher (knowledge doesn't change, the permission to act does) and the clinicians (different stakes need different safeguards).

  4.  **Formulate the Recommendation:**
      *   **Decision:** Sliding-scale *action* thresholds, explicitly decoupled from claims of "knowledge" or "correctness."
      *   **Rationale:** It addresses the clinical reality (stakes matter) without falling into the epistemic trap the philosopher identified. It creates a clear audit trail (did the confidence meet the threshold for *this* action?) without making ontological claims about AI truth.
      *   **Language:** Avoid "know," "correct," "true." Use "authorized," "rely," "verify."
      *   **Numbers:** Need specific examples. Low stakes (0.85), Medium (0.95), High (0.99 + human confirm).
      *   **Legal Defense:** In discovery, this reads as a standard of care protocol, not a philosophical treatise on truth.

  5.  **Drafting - Section by Section:**
      *   **Header:** Standard Memo format.
      *   **Opening:** State the recommendation clearly.
      *   **The Philosophical Objection:** Acknowledge it. Explain why "knowledge" is the wrong word for the policy. The philosopher is right that knowledge shouldn't shift, so we stop claiming the AI gives us "knowledge." We claim it gives us "authorization to bypass verification."
      *   **The Solution:** Stake-indexed *action* thresholds.
      *   **Proposed Language:** Draft the actual sentence/paragraph.
      *   **Legal/Discovery Rationale:** Why this protects the system.
      *   **Closing:** Call to action.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is 0.85 too low?
      *   *Fix:* Define the stakes clearly. 0.85 is for *generating a differential*, not for *diagnosis*. 0.99 is for *irreversible intervention*.
      *   *Critique:* Did I answer the user's specific question about separating action from knowledge?
      *   *Fix:* Make sure to explicitly state: "We can and must separate the threshold for action from the definition of knowledge."
      *   *Tone Check:* Ensure it doesn't sound like I'm dismissing the philosopher. I'm using her insight to strengthen the policy.
      *   *Length Check:* Keep it tight. One page.

  7.  **Final Polish:** Check the specific constraints.
      *   One structure? Yes (Sliding Action Threshold).
      *   Real numbers? Yes (0.85, 0.95, 0.99).
      *   Real language? Yes.
      *   Address philosopher? Yes.
      *   Discovery proof? Yes.

  8.  **Final Output Generation** (Proceeding to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** AI Clinical Guidance Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on AI Reliance Thresholds and Wording

  **Recommendation**
  We should adopt a **stake-indexed action threshold** structure, explicitly decoupled from claims of epistemic certainty. We must reject the single-number approach as clinically unsafe and the contextualist wording as legally vulnerable. The proposed policy language below replaces "knowledge" claims with "authorization to bypass verification."

  **Addressing the Epistemic Objection**
  The committee member with philosophical training is correct on the epistemology but mistaken on the policy implication. She argues that "knowledge" cannot be stakes-sensitive: two residents viewing the same data either know the diagnosis or they do not; the risk of the treatment shouldn't change the truth value. If we write policy stating a clinician "knows" the diagnosis at 0.95 confidence but "doesn't know" it at 0.85, we are making a false claim about the AI's reliability that will not survive cross-examination.

  However, we *can* run a stake-indexed action threshold without taking a position on whether knowledge itself is stakes-sensitive. We do this by regulating the **permission to act**, not the **state of knowing**. The policy does not claim the AI output is "true" at 0.99 and "false" at 0.85. It claims that at 0.99, the risk of verification outweighs the risk of error, warranting immediate action, whereas at 0.85, the risk of error warrants further workup. This satisfies the philosopher (knowledge remains distinct from action) and the clinicians (safety scales with stakes).

  **Legal and Discovery Considerations**
  A contextualist definition of "knowledge" is dangerous in discovery. If a plaintiff's attorney asks, "Did the doctor *know* the diagnosis was correct?" and our policy says "Knowledge depends on the room you are standing in," we appear evasive. A single-number threshold is easier to audit but invites liability when 0.96 confidence leads to a catastrophic error in a high-stakes procedure.

  The stake-indexed *action* model is the most defensible. It frames the threshold as a Standard of Care safety valve, not an ontological claim. In discovery, we argue: "Our policy never claimed the AI was infallible. It defined when the probability of accuracy was sufficient to waive secondary verification based on procedural risk."

  **Proposed Policy Language**
  Replace the current sentence with the following tiered protocol:

  > *"Clinicians are authorized to forgo independent re-verification of an AI diagnostic aid's output only when the reported confidence score meets the threshold required for the intended clinical action:*
  > *1. **Decision Support (e.g., differential generation):** Confidence ≥ 0.85.*
  > *2. **Reversible Intervention (e.g., medication trial, imaging order):** Confidence ≥ 0.95.*
  > *3. **Irreversible Intervention (e.g., surgery, permanent implant):** Confidence ≥ 0.99 AND concurrent senior clinician attestation.*
  >
  > *Reliance on AI output below these thresholds does not constitute a breach of care provided the clinician documents appropriate alternative verification steps."*

  **Next Steps**
  This structure allows us to keep the sliding scale (clinically necessary) without accepting the philosophical baggage of "contextual knowledge." It gives Legal a clear audit trail (Score vs. Action) and gives Clinicians the flexibility to use the tool safely. I move we adopt this wording for the Thursday vote.
