  INTERNAL CIRCULAR 44/BC
  DATE: 14 October 2023
  FROM: Legal Directorate
  TO: All Staff
  SUBJECT: Operational Status of Statutory Provisions 3(1) and 3(2)

  1. It has been established that Section 3(1) of the Agency Act 1998 states "The Agency possesses legal personality," while Section 3(2) states "The Agency does not possess legal personality." Both provisions are found to be valid enactments of the Legislature.

  2. Accordingly, both provisions remain in full force. Staff must proceed on the basis that the Agency both possesses and does not possess legal personality. It is not permissible to prioritise one provision over the other, nor to treat either as superseded.

  3. Regarding inference, the coexistence of these states does not constitute a general warrant for the derivation of unrelated propositions. The validity of contradictory premises is confined strictly to the subject matter of those premises. Staff are reminded that authorization flows only from specific statutory grants. The conjunction of Section 3(1) and 3(2) does not license the conclusion that the Agency is entitled to unlimited funds, nor that staff meetings are hereby cancelled. Inferences must remain relevant to the contradictory terms.

  4. It is acknowledged that maintaining this distinction requires rigorous discipline. Staff must not infer that because the Agency both is and is not a person, it is also a bank. The Directorate notes the cognitive load this imposes. However, the integrity of the administrative framework depends upon the suppression of arbitrary derivation. Vigilance is required to ensure that the contradiction does not propagate to unrelated files.

  5. Reference is made to the memorandum from Mr. P. Curry (Claims Division), dated 10 October, which asserted: "If this Circular is binding, then Mr. Curry is due promotion." This conditional is rejected. The validity of the antecedent does not secure the consequent in self-referential conditionals where the consequent is not statutorily grounded. Modus ponens is suspended in instances where the conditional itself generates the truth of its antecedent. No promotion is authorised.

  6. Clause 6 states: "This Clause is not binding." Notwithstanding this self-description, Clause 6 is binding. The status of a provision is determined by the Directorate, not by the provision's own assertion. Staff must treat Clause 6 as operative despite its content. The contradiction inherent in this clause is admissible; the inference that the Clause is therefore void is not.

  7. The Legal Directorate determines which contradictions are admissible within the Agency's operations. Any inconsistency not explicitly ratified by this Directorate remains a standard error subject to correction. Staff should not identify contradictions independently.

  8. Questions regarding the scope of admissible inconsistencies should be directed to the undersigned.

  **ANNEX: MEMORANDUM FROM DEPUTY DIRECTOR**

  "I observe that Clause 7 grants the Directorate authority to determine admissible contradictions. If the Directorate's own enabling rules are subject to the contradiction described in Clause 1, then the Directorate both possesses and does not possess the authority described in Clause 7. If it does not possess the authority, its determination in Clause 7 is void. If it does, it must rely on a rule it simultaneously lacks. You have not blocked explosion; you have merely relocated it to the meta-level. If the criteria for admissibility are themselves contradictory, any determination becomes permissible. Please clarify whether the Directorate's authority is consistent, bearing in mind that if you assert it is, you violate the policy established in Paragraph 2."
