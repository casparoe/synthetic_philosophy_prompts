      *   *Phenomenologist:* They hate cognitivism/computationalism. They might agree FEP isn't about "mind" but for different reasons (it's objectifying). Or they might attack the "persistence" claim as still too biological/functionalist. They care about *experience* and *meaning*.
      *   *Phil Grad Students:* Their dissertations rely on FEP explaining *pathology* (e.g., psychosis as aberrant precision). If FEP isn't about mind/beliefs, can it explain *mental* illness? Their funding/career is at stake. They need the "mental" link to remain valid.
