  7.  **Review against Constraints:**
      *   Phil of Science persona (wry, experienced, strategic).
      *   No references.
      *   Specific audience registers (Modeller vs. Phenomenologist vs. Grad Student).
      *   7-8 objections.
      *   90-second replies.
      *   Soft spots & Concessions identified.
