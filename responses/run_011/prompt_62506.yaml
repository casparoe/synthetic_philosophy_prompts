      *   **Presentation Thesis:** The Free Energy Principle (FEP) is about boundary conditions of persistence (avoiding dispersion into indistinguishable states), *not* a theory of mind. The internal/sensory/active state partition is arbitrary (fixed by the blanket, not dynamics). Inference talk is a redescription borrowing plausibility from empirical success. Philosophers misusing it for mental content are wrong; defenders are covert instrumentalists.
      *   **Audience:**
          *   Computational Neuroscientists & Mathematical Psychiatrists (Modellers): Fit hierarchical models, view FEP as a productive instrument.
