answer: |-
  Here is an analysis of your verdicts, a proposed principle, and an examination of the tensions you identified.

  ### I. The Principle: Non-Necessary Selection

  Your intuition that ownership is about "derivation" is close, but as you noted, it fails to distinguish between *causal* derivation (the model needed the photos to learn) and *normative* derivation (the model stole the specific choices).

  To accommodate your twelve verdicts, I propose **The Principle of Non-Necessary Selection**.

  **Statement:** A claimant owns a form only when it represents a **contingent choice** from a field of genuine alternatives, rather than a **discovery** of a pre-existing necessity, provided that the claimant's specific pathway was not accessed through a breach of trust or privileged intimacy.

  **Clauses and Motivations:**

  1.  **The Specificity Clause:** Ownership attaches to the *specific embodiment* of an idea, not the *capacity* to generate it.
      *   *Motivated by:* **Case 1 vs. Case 2** (Wording is owned; premise is not) and **Case 7 vs. Case 6** (Specific image is owned; stylistic manner is not).
      *   *Rationale:* Language and style are shared tools; specific arrangements of them are individual choices.

  2.  **The Artificiality Clause:** Ownership attaches only to *inventions* (artificial constructions), not *discoveries* (natural facts or functional necessities).
      *   *Motivated by:* **Case 5** (Natural gene vs. synthetic molecule) and **Case 3** (Ingredients are facts; headnote is expression).
      *   *Rationale:* You cannot own what the world provided, only what you added to it.

  3.  **The Access Clause:** Ownership claims are superseded by duties of confidence. Even non-owned ideas become "owned" temporarily if accessed through a relationship of trust.
      *   *Motivated by:* **Case 8** (Synopsis) and **Case 9 vs. Case 10** (Traditional knowledge accessed vs. independently found).
      *   *Rationale:* The wrong in Case 8 and 9 is not theft of property, but betrayal of the context required to access the property.

  4.  **The Community Clause:** Evolving vernaculars cannot be owned by late-arriving formalizers, even if they codify them.
      *   *Motivated by:* **Case 11** (Slang trademark).
      *   *Rationale:* The "selection" was made by the community over time, not the corporation at the registry.

  **Confidence:** High that this principle captures the structural logic of your verdicts. Medium that it resolves the moral tension in Case 6.

  ---

  ### II. Verdicts on New Cases

  Applying the **Principle of Non-Necessary Selection**:

  1.  **A database of facts assembled at enormous expense and copied wholesale.**
      *   **Verdict:** **Fine** (to copy the facts), **Not Fine** (to copy the creative selection/arrangement).
      *   *Reasoning:* Under the **Artificiality Clause**, the facts themselves are discoveries (Case 3). However, if the *selection* of which facts to include involved contingent choice (curation) rather than comprehensiveness, that structure is owned. If the database is "everything known," there is no selection, only labor. Your Case 3 suggests labor alone (ingredients list) does not create ownership.
      *   *Confidence:* High.

  2.  **A distinctive dance step, invented by one performer and now used by everyone.**
      *   **Verdict:** **Fine.**
      *   *Reasoning:* Under the **Specificity Clause**, a single step functions like a word or a style (Case 6). It is a unit of vocabulary. Unless it is a complex, choreographed *sequence* (a specific embodiment), a single move is a "premise" or "style" rather than a "joke." Once it enters common usage, it becomes vernacular (Case 11).
      *   *Confidence:* Medium. (Borderline between Case 1 and Case 6).

  3.  **A liturgy.**
      *   **Verdict:** **Not Fine** (if traditional/ancient), **Not Fine** (if a specific modern author's prayer is copied).
      *   *Reasoning:* If the liturgy is the product of centuries of evolution, it falls under the **Community Clause** (Case 11); no single selector exists. If it is a specific modern composition, it is a **Specific Embodiment** (Case 1). However, liturgy often aims for functional necessity (worship), which may weaken the claim under the **Artificiality Clause**.
      *   *Confidence:* Medium.

  4.  **A system that produces a joke indistinguishable from a particular living comic's.**
      *   **Verdict:** **Fine, though uneasily so.**
      *   *Reasoning:* This is the exact analogue of **Case 6**. The system mimics the *capacity* (style/distribution), not the *specific embodiment* (the actual jokes told by the comic). Unless the system outputs the comic's *actual* jokes (Case 1), it is generating new contingent choices based on old patterns.
      *   *Confidence:* High (based on your Case 6), though morally fraught.

  ---

  ### III. Accommodation Failures

  The principle cannot fully accommodate **Case 12 (The Field Recording)**.

  **The Conflict:**
  Your verdict is "Not Fine" regarding the collector's estate drawing royalties. The **Principle of Non-Necessary Selection** creates a split verdict that your intuition rejects.
  *   **The Recording:** The specific fidelity, angle, and noise floor of the 1930s recording are **Contingent Choices** by the collector (Specificity Clause). The principle suggests the collector *should* own the *recording*.
  *   **The Song:** The melody and lyrics are **Discoveries** of pre-existing cultural forms (Artificiality Clause). The principle suggests the collector *should not* own the *song*.

  **The Failure:**
  Your verdict implies the collector should not profit *at all*, or that the arrangement is fundamentally unjust. The principle suggests a split ownership: the estate owns the *artifact*, the community/singer owns the *content*. In a royalty stream, these are inseparable. The principle cannot articulate why the collector's labor on the *artifact* doesn't merit *some* share, whereas your intuition says the dynamic is "Not Fine" broadly. You noted that giving it to the singer's descendants "does not obviously repair it." The principle fails here because it cannot resolve who owns the *cultural context* that made the recording valuable.

  **Confidence:** High that this is the point of failure.

  ---

  ### IV. The Cook Across the Street

  **Case:** A cook spends two years in a chef's kitchen, then opens across the street serving that chef's signature dish exactly, having written nothing down.

  **Verdict:** **Not Fine.**

  **Reasoning:**
  This case sits between **Case 2** (Independent rebuilding) and **Case 8** (Breach of trust/synopsis).
  *   **Why it is not Case 2:** The cook did not incur the cost of discovery. They bypassed the "R&D" phase by entering the kitchen.
  *   **Why it is Case 8:** Employment or apprenticeship implies a **Relationship of Trust**. Even without a contract, there is an implicit norm that trade secrets (including "signature" preparations that are not merely functional ingredients) are not to be immediately weaponized against the mentor.
  *   **Application of Principle:** The **Access Clause** overrides the **Artificiality Clause**. Even if the dish is just "ingredients" (Case 3), the *specific combination and technique* constitute a **Contingent Choice** by the Chef. Accessing that choice through intimacy (working there) creates a duty not to exploit it immediately.

  **Confidence:** Medium-High. (This relies on social norms of apprenticeship which vary by culture).

  ---

  ### V. Point of Least Certainty

  The point on which I am least sure, and where I suspect you are tracking two distinct notions of ownership, is **Case 6 (AI Style Mimicry)**.

  **The Two Notions:**
  1.  **Ownership as Reward for Labor (The Desert Theory):** The photographer spent years developing a style. The AI reaped the benefit without the labor. This suggests the verdict should be **Not Fine**.
  2.  **Ownership as Liberty to Act (The Freedom Theory):** No specific photo was taken. The "style" is a statistical ghost, not a tangible object. Restricting it limits the AI's liberty to process public data. This suggests the verdict should be **Fine**.

  **Why I am Unsure:**
  Your verdict ("Fine, though uneasily") admits that the **Freedom Theory** wins legally/logically, but the **Desert Theory** wins morally. My principle sides with the Freedom Theory (Style is not a Specific Embodiment).
  However, if AI becomes capable of producing work that *economically substitutes* the photographer's livelihood without ever copying a specific image, the **Access Clause** might need to expand. Did the AI "access" the photographer through a relationship of trust? No. Did it bypass the cost of discovery? Yes.

  If you resist surrendering Case 6, you are prioritizing **Liberty** over **Desert**. If you feel the unease growing, you are sensing that **Desert** is being violated. The principle I offered prioritizes Liberty (Specificity). To accommodate a "Not Fine" verdict on Case 6, we would need a new clause: **The Economic Substitution Clause**, which grants ownership over *capacities* if they demonstrably destroy the market for the original labor, regardless of specificity. I am not confident such a clause can be bounded without destroying Case 2 (Independent rebuilding).

  **Confidence in this diagnosis:** High. This is the central tension of modern IP law.
