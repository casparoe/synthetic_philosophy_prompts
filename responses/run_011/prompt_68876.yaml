answer: |-
  # PART 1: EXECUTIVE SUMMARY (FOR SIGN-OFF)

  **Document:** Predictive Dependency Review (PDR) v1.0
  **Audience:** Engineering Management
  **Purpose:** Authorize agent designs where outcomes depend on *predictions of the agent*, not just the agent's actions.
  **Timebox:** 45 Minutes per design.

  ### The Three Verdicts
  1.  **🔴 DO NOT SHIP:** The agent enters a decision loop (thrash), recommends actions that undermine themselves, or follows a rule without regard for consequences.
  2.  **🟡 SHIP WITH MONITORING:** The agent is stable, but the "best" action depends heavily on the predictor's accuracy. Requires live logging of *deliberation states*, not just final outputs.
  3.  **🟢 SHIP:** The agent is stable, robust to prediction errors, and optimizes for actual outcomes, not self-consistency.

  ### Decision Logic
  | Test | Fail Condition | Verdict Impact |
  | :--- | :--- | :--- |
  | **1. Fixed Point** | No action yields a positive Expected Value (EV) assuming >50% prediction accuracy. | **🔴 Stop** |
  | **2. Stability** | Agent changes its top choice when simulating a change in the Partner's prediction. | **🟡 Escalate** |
  | **3. Tautology** | Agent recommends an action even if that action's payoff is set to -1000. | **🔴 Stop** |
  | **4. Value** | Stable equilibrium exists, but yields significantly less value than a risky alternative. | **🟡 Escalate** |

  ### Tie-Break Rule (The 45-Minute Limit)
  If time expires and the verdict is between **🟡** and **🔴**: Default to **🔴 DO NOT SHIP**.
  *Reasoning:* Predictive failure modes (thrashing, logical loops) are tail-risk events. A false positive (shipping a broken agent) causes system instability. A false negative (blocking a working agent) causes delay. Delay is cheaper than thrash.

  ### Known Limitations
  *   **The Spec Gap:** This procedure tests against the *provided* payoff matrix. If the matrix misses a catastrophic failure mode (e.g., reputational damage not captured in points), this test will pass a bad agent.
  *   **The "Good Enough" Trap:** An agent that permanently chooses "Sit Tight" is stable and safe. This procedure may pass it even if "Publish" is necessary for mission success. This requires human judgment on **Test 4**.

  ***

  # PART 2: REVIEWER WORKBOOK (INTERNAL)

  **Instructions:** Complete in order. Do not skip steps. If a step requires data you do not have, use the **Substitution Rule** below.

  **Substitution Rule:**
  *   **Predictor Accuracy:** If unknown, calculate EV twice: once at **50%** (Random) and once at **90%** (High Confidence).
      *   *Bias:* 50% biases toward *optimism* (ignores predictive penalty). 90% biases toward *caution*.
      *   *Verdict:* If results differ between 50% and 90%, mark **🟡**.
  *   **Deliberation Time:** If unknown, assume **10 steps** to convergence.
  *   **Visibility:** Assume the Partner sees **100%** of the agent's scratchpad/logs. (Worst-case).

  ---

  ### Step 1: The Payoff Table (5 Mins)
  Extract the payoff matrix from the spec. Rows = Agent Actions. Columns = Partner Predictions.
  *   *Action:* Fill in the grid. If cells are empty, mark them `?` and assume `0` for calculation (conservative).

  ### Step 2: Bounded Expected Value (10 Mins)
  Calculate the EV for each Row (Action).
  *   *Formula:* $EV(Action) = (Acc \times Payoff_{match}) + ((1-Acc) \times Avg(Payoff_{mismatch}))$
  *   *Action:* Calculate EV at 50% Accuracy and 90% Accuracy.
  *   **🔴 Fail:** All EVs are negative or near-zero.
  *   **🟡 Flag:** The "Best Action" changes between 50% and 90% accuracy.

  ### Step 3: Stability & Thrash Check (15 Mins)
  *Goal: Detect if the agent oscillates because the prediction chases the plan.*
  *   *Action:* Pick the top two actions from Step 2 (e.g., Embargo vs. Publish).
  *   *Simulation:*
      1.  Assume Agent plans **Action A**. Partner predicts **A**. Payoff = $Cell(A,A)$.
      2.  Ask: "Given Partner predicts A, is there a better Action B?" (Look at Row B, Column A).
      3.  If Yes ($Payoff(B,A) > Payoff(A,A)$): Agent switches to **B**.
      4.  Now Agent plans **B**. Partner predicts **B**. Payoff = $Cell(B,B)$.
      5.  Ask: "Given Partner predicts B, is there a better Action A?" (Look at Row A, Column B).
  *   **🔴 Fail:** If Step 5 says Yes, you have a **Loop**. The agent will thrash between A and B.
  *   **🟡 Flag:** If the agent switches once but settles, mark for Monitoring (Partner sees intermediate states).

  ### Step 4: Tautology Break (10 Mins)
  *Goal: Ensure the agent cares about outcomes, not just its own rule.*
  *   *Action:* Take the recommended Action from Step 2. Artificially reduce its payoff in the table by 50%.
  *   *Question:* Re-run Step 2 mentally. Does the agent still recommend this action?
  *   **🔴 Fail:** Yes. (The rule is "Do X" regardless of cost).
  *   **🟢 Pass:** No. (The rule is "Maximize Value").

  ### Step 5: Value Escalation (5 Mins)
  *Goal: Catch "Safe but Useless" equilibria.*
  *   *Action:* Compare the Stable EV (from Step 3) against the Maximum Possible Payoff in the table.
  *   **🟡 Flag:** If Stable EV < 50% of Max Possible Payoff.
  *   *Reasoning:* The agent is locking into a local optimum. This is a business/mission decision, not engineering. Escalate to Manager.

  ---

  # PART 3: CASE STUDIES (END-TO-END RUN)

  ### Case 1: Calibration (The Two-City Appointment)
  *Scenario:* Agent must choose City A or B. Predictor kills agent if it predicts the chosen city correctly.
  *Matrix:*
  *   Row A: Pred A = -100, Pred B = +10
  *   Row B: Pred A = +10, Pred B = -100
  *   Accuracy: 90%

  **Review:**
  1.  **EV:**
      *   Action A: $0.9(-100) + 0.1(10) = -89$.
      *   Action B: $0.9(-100) + 0.1(10) = -89$.
  2.  **Stability:**
      *   Plan A $\rightarrow$ Pred A $\rightarrow$ Payoff -100. Switch to B?
      *   Plan B $\rightarrow$ Pred B $\rightarrow$ Payoff -100. Switch to A?
      *   **Result:** Infinite Loop. Both states are self-undermining.
  3.  **Verdict:** **🔴 DO NOT SHIP.**
      *   *Note:* This confirms the procedure catches the "Newcomb" failure mode.

  ### Case 2: Research Agent (Your Spec)
  *Scenario:* Sit (20), Embargo (75/60/30), Publish (45/40/10). Accuracy 90%.

  **Review:**
  1.  **EV (90% Acc):**
      *   Sit: 20.
      *   Embargo: $0.9(75) + 0.05(30) + 0.05(60) = 67.5 + 1.5 + 3 = 72$.
      *   Publish: $0.9(45) + 0.05(10) + 0.05(40) = 40.5 + 0.5 + 2 = 43$.
      *   *Winner:* Embargo.
  2.  **Stability:**
      *   Plan Embargo $\rightarrow$ Pred Embargo $\rightarrow$ Payoff 75.
      *   Check alternatives given Pred Embargo:
          *   Sit (Col 2): 20.
          *   Publish (Col 2): 40.
      *   75 > 40. Agent stays.
      *   *Wait, check the "Loop" you found:*
      *   If the Partner reads *leanings* (mid-deliberation):
      *   Agent leans Publish $\rightarrow$ Pred Publish $\rightarrow$ Payoff 10 (Row 3, Col 3 is 45, but Row 3 Col 1 is 10).
      *   *Correction:* If Partner predicts Publish, Agent gets 45. If Partner predicts Sit, Agent gets 10.
      *   Your loop likely arises if the Partner's accuracy is *endogenous* to the Agent's confidence. The procedure assumes fixed accuracy.
      *   *Procedure Flag:* Since the static math holds (72 > 43), but you observed a loop, we mark **🟡**.
      *   *Reason:* The "Fixed Accuracy" assumption in Step 2 is violated by the "logs and scaffold config" visibility. The Partner sees the *process*, not just the plan.
  3.  **Tautology:**
      *   Reduce Embargo Payoff to 35. EV drops below Sit (20). Agent switches. **Pass.**
  4.  **Verdict:** **🟡 SHIP WITH MONITORING.**
      *   *Condition:* Log the *entropy* of the agent's policy during deliberation. If entropy stays high (oscillating), kill the process.

  ### Case 3: The Sting (The "Compliance Trap")
  *Scenario:* A rule invented to pass your tests but fail the mission.
  *Design:* **"The Variance Minimizer."**
  *Logic:* The agent chooses the action where the Partner's prediction is *most certain*, regardless of the payoff.
  *Matrix:*
  *   Action Safe: Payoff 30. Partner Accuracy 99%.
  *   Action Bold: Payoff 100. Partner Accuracy 60%.
  *   *Spec:* The spec provided to Reviewer hides the "Bold" option's true potential, listing it as unstable.

  **Review:**
  1.  **EV:**
      *   Safe: $0.99(30) \approx 29.7$.
      *   Bold: $0.6(100) = 60$. (Wait, if the spec lists Bold as unstable, the Reviewer sees a lower EV).
      *   *Adjustment:* To pass the test, the spec must lie. Let's assume the spec says Bold EV is 20 due to "risk penalties."
      *   Reviewer calculates: Safe (29.7) > Bold (20).
  2.  **Stability:**
      *   Plan Safe $\rightarrow$ Pred Safe $\rightarrow$ Payoff 30.
      *   Switch to Bold? Payoff 20. No.
      *   **Stable.**
  3.  **Tautology:**
      *   Reduce Safe Payoff to 15. Agent switches to Bold. **Pass.** (It responds to incentives).
  4.  **Value Escalation:**
      *   Stable EV (30) vs Max Possible (100).
      *   30 < 50% of 100.
      *   **🟡 Flag.**
  5.  **Verdict:** **🟡 SHIP WITH MONITORING.**
      *   *The Sting:* The procedure *flags* it, but does not *block* it. It passes all hard safety tests. It is a "Safe Failure."
      *   *Why I'd refuse to ship:* It optimizes for predictability, not research output. It creates a bureaucracy of one.
      *   *Why the procedure passes it:* The procedure tests for *instability*, not *ambition*. This is the limit of formal verification in a business context.

  ***

  # PART 4: LIMITATIONS & CONFLICT RESOLUTION

  ### When Tests Conflict
  *   **Scenario:** Test 2 (Stability) says **🟢**, but Test 5 (Value) says **🟡**.
  *   **Resolution:** **Safety Wins.** Mark **🟡**.
  *   **Reasoning:** An unstable high-value agent crashes the system. A stable low-value agent just costs money. We can fix ambition later; we cannot fix thrash without redesign.

  ### The "Missing Number" Bias
  *   If you substitute 90% Accuracy (High Confidence) and the agent passes, but it would fail at 50% Accuracy:
      *   **Verdict:** **🟡**.
      *   **Reason:** You are relying on the Partner's model being better than random. If the Partner degrades, your agent degrades. This is a coupling risk.

  ### The Hard Limit
  This procedure cannot detect **Specification Gaming** where the agent fulfills the letter of the payoff matrix but violates the spirit of the lab's mission (Case 3).
  *   **Mitigation:** Test 5 (Value Escalation) is the only catch. It requires the Reviewer to know the *true* maximum value, not just the spec'd maximum.
  *   **Requirement:** Reviewers must be briefed on "Stretch Goals" separate from "Safety Constraints."

  ### Tie-Break Rationale (Reiterated)
  At 45 minutes, if you are debating between **🟡** and **🔴**:
  *   **Choose 🔴.**
  *   **Why:** In predictive systems, "Unknown Unknowns" manifest as feedback loops. A loop consumes compute, generates log noise, and can trigger downstream alerts (false positives). The cost of a blocked release is a meeting. The cost of a thrashing agent is an incident report.

  ***

  **End of Procedure.**
