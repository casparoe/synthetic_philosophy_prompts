      *Refining the "Cheap Fixed Point":* The user says "no solving fixed points by hand." I need a table lookup method.
      *   Method: Iterate the payoff matrix.
      *   Row = Agent Action. Column = Predictor Prediction.
      *   Cell = Payoff.
      *   Predictor Accuracy = Probability $P(Pred = Action)$.
      *   Expected Value (EV) for Action $A$ = $\sum_{P} P(P|A) \times Payoff(A, P)$.
      *   Wait, the predictor predicts *before* the agent acts based on the *plan*. So $P(Pred)$ depends on $Agent's\ Policy$.
      *   Simplification for the reviewer: Assume the predictor is accurate with probability $p$.
      *   $EV(Action) = p \times Payoff(Action, Action) + (1-p) \times Payoff(Action, \neg Action)$.
      *   Actually, the matrix provided is $Payoff(Agent Action, Predictor Prediction)$.
