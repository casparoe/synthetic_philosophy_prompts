answer: |-
  Here is the neutral spec you asked for. It is designed to bypass the "trenchcoat" problem by focusing on deliverables and failure conditions rather than metaphysical commitments.

  ### Part 1: The Specification List

  | Requirement | The Case / Consideration | Concrete Failure Condition (The Test) |
  | :--- | :--- | :--- |
  | **1. The Tolerance Error Theory** | The premise "If $n$ grains is a heap, $n+1$ is a heap" feels compelling, yet leads to falsehood. Every account must reject the premise, but must explain *why* it feels true. | **Fail:** The account dismisses the intuition as "confusion" without specifying the cognitive mechanism (e.g., margin-for-error, contextual shift) that generates the illusion. If the theory cannot simulate *why* a rational agent would accept the premise, it fails. |
  | **2. Higher-Order Vagueness** | It seems vague where the boundary is, but also vague where the *boundary of the boundary* is. There should be no sharp line between 'definitely red' and 'indeterminate'. | **Fail:** The theory posits a sharp cutoff between 'true' and 'indeterminate' (or 'known' and 'unknown') that is as precise as the original cutoff it sought to avoid. (e.g., Patch 340 is Definitely Red, Patch 341 is Indeterminate, with no vagueness about that distinction). |
  | **3. The Ignorance Mechanism** | We are ignorant of where the cutoff is (if there is one). This ignorance must be principled, not accidental. | **Fail:** The account states "we cannot know the cutoff" but allows a scenario where, given perfect information about all non-semantic facts, the cutoff *could* be deduced. It must show why semantic facts are inaccessible even given full physical knowledge. |
  | **4. Stipulation / Sharpening** | Legislatures and courts successfully sharpen vague terms (e.g., "vehicle" includes bicycles) without changing the subject entirely. | **Fail:** The account implies that stipulating a precise boundary for a vague term is either impossible (meaning change) or trivial (it was already precise). It must allow for *precisification* that preserves enough continuity to count as the same concept. |
  | **5. Learnability** | Children learn vague predicates from finite, noisy examples and converge on adult usage. | **Fail:** The theory requires the learner to identify a precise boundary or infinite-valued function from data that does not contain that information. If the semantic value is too complex to be induced from the available training set, the theory fails. |
  | **6. The Sigmoid Constraint (Pilot Data)** | Aggregated judgments across a sorites series typically yield a smooth probability curve (sigmoid), not a step function with noise at a single point. | **Fail:** The theory predicts that if subjects were perfectly rational/noise-free, they would all switch at the *same* patch (step function). If the theory cannot map its truth-values to the observed probability distribution without treating all variance as "performance error," it fails. |

  ### Part 2: The Pilot Study (Honest Assessment)

  **Is it a requirement?**
  Strictly speaking, **no**. A theory of *semantics* (what "red" means) is not identical to a theory of *psychophysics* (how humans judge color). A semantic theory could be true even if our brains are noisy processors.

  **However,** it is a **constraint on the Epistemic Access story.**
  If your semantic theory posits a sharp boundary (Epistemicism), you owe us a noise model that explains why 40 people don't just cluster around that boundary with small variance, but instead spread across 150 patches. If the variance is too large to be plausible sensory noise, the sharp boundary hypothesis becomes empirically costly.

  **What each camp owes:**
  *   **Epistemicist:** Must argue that the sigmoid is entirely a performance artifact. They need to show that the width of the sigmoid (150 patches) correlates with known just-noticeable-differences (JNDs). If the JND is 5 patches and the sigmoid is 150, the Epistemicist needs a new error theory (e.g., "conceptual noise" rather than sensory noise).
  *   **Supervaluationist:** Must explain how "supertruth" (true on all precisifications) maps to a probability judgment. If a patch is true on 50% of precisifications, does the subject say "yes" 50% of the time? If so, Supervaluationism effectively collapses into a probabilistic/degree theory in practice.

  ### Part 3: Sorting the Requirements

  **Genuinely Neutral (Phenomenological Constraints)**
  *   *Tolerance Error Theory:* Both sides agree the premise is false but compelling. Both must explain the compulsion.
  *   *Stipulation:* Both sides agree laws can define terms. Both must explain how this works.
  *   *Learnability:* Both sides agree children learn the words. Both must explain the acquisition.

  **Disguised Commitments (Metaphysical Load-Bearing)**
  *   *Higher-Order Vagueness:* This is the wedge. Epistemicism accepts sharp boundaries at every order (we just can't know them). Supervaluationism tries to avoid them but often reintroduces them at the level of 'definiteness'. Demanding "No Sharp Boundaries *Anywhere*" is an anti-Epistemicist stance disguised as a neutral requirement.
  *   *The Sigmoid Constraint:* Treating the sigmoid as *semantic data* rather than *performance data* favors degree-theories. Treating it as *noise* favors classical theories.

  **The Incompatibility Derivation**
  You asked for a subset that cannot all be satisfied. This is the Sorites Paradox formalized as an inconsistent triad of requirements. You cannot satisfy all three:

  1.  **Classical Logic:** Validity of Modus Ponens and Bivalence (True/False).
  2.  **Tolerance Truth:** The premise $\forall n (P(n) \to P(n+1))$ is true.
  3.  **Non-Universality:** The conclusion $\forall n P(n)$ is false (i.e., not everything is Red).

  **Derivation:**
  1.  Assume $P(0)$ is True (Patch 0 is Red).
  2.  Assume Tolerance Truth: $P(0) \to P(1)$.
  3.  By Modus Ponens (Classical Logic), $P(1)$ is True.
  4.  Iterate 600 times.
  5.  Result: $P(600)$ is True (Patch 600 is Red).
  6.  But Non-Universality says $P(600)$ is False.
  7.  **Contradiction.**

  **Resolution:** Every theory must violate one line of this spec.
  *   **Epistemicism** violates **Tolerance Truth** (says the premise is false).
  *   **Supervaluationism** violates **Classical Logic** (in some formulations) or **Tolerance Truth** (says premise is false on all precisifications).
  *   **Degree Theories** violate **Classical Logic** (bivalence).

  ### Part 4: The Exclusionary Requirement

  The single requirement that does the most exclusionary work is:
  **"The Prohibition on Sharp Boundaries at Any Level."**

  If you enforce this strictly (including higher-order boundaries), you rule out:
  1.  **Epistemicism:** Explicitly posits sharp boundaries.
  2.  **Standard Supervaluationism:** Posits a sharp boundary between 'true on all precisifications' and 'not true on all precisifications'.
  3.  **Contextualism:** Often posits sharp boundaries within a fixed context.

  This requirement leaves only **Fuzzy Logic** (degrees of truth) or **Dynamic/Pragmatic accounts** (boundaries shift constantly) as survivors. It is the most common "neutral" intuition that actually functions as a partisan filter.

  ### Part 5: Evaluation Against the List

  **Epistemicism**
  *   **Tolerance Error Theory:** **Pass.** (Williamson's Margin-for-Error principle explains why we can't know the cutoff, making tolerance feel safe).
  *   **Higher-Order Vagueness:** **Fail.** (Posits sharp boundaries between 'knowable' and 'unknowable').
  *   **Ignorance Mechanism:** **Pass.** (Semantic plasticity + safety conditions explain ignorance).
  *   **Stipulation:** **Pass.** (Stipulation moves the boundary).
  *   **Learnability:** **Pass.** (We learn the extension, just not the boundary).
  *   **Sigmoid Constraint:** **Struggle.** (Requires the 150-patch spread to be entirely noise/uncertainty, not semantic gradient).

  **Supervaluationism**
  *   **Tolerance Error Theory:** **Pass.** (Premise is false because there is *some* precisification where it fails, but we can't identify which).
  *   **Higher-Order Vagueness:** **Struggle.** (Global truth values are sharp; hard to make 'super-determinacy' vague without collapse).
  *   **Ignorance Mechanism:** **Pass.** (Truth is relative to a precisification we haven't selected).
  *   **Stipulation:** **Pass.** (Stipulation selects a precisification).
  *   **Learnability:** **Pass.** (We learn the core extension common to all precisifications).
  *   **Sigmoid Constraint:** **Struggle.** (Mapping 'true on 50% of precisifications' to '50% yes responses' requires a probabilistic model of precisification selection that isn't standard).

  **Summary for the Group:**
  Your stalemate is likely occurring on **Higher-Order Vagueness** and the **Sigmoid Constraint**. The Epistemicist views the sigmoid as noise around a hidden step; the Supervaluationist views it as evidence of multiple valid boundaries. Neither can prove the other wrong without agreeing on whether "No Sharp Boundaries" is a hard constraint or a negotiable intuition. Make that the first item on the agenda.
