answer: |-
  1. The original finding relied on a measure of likelihood to enter STEM, meaning science and maths subjects, not actual degrees, and was corrected. What does this specific error teach us about how this literature is conducted and reported, beyond simply saying 'be careful'?

  If she says: She will likely reply that this demonstrates the necessity for greater transparency in data modelling and variable selection.
  Follow-up: Given that incentive structures reward headline results, what structural change would actually enforce that transparency without stifling inquiry?

  2. One study suggests the stereotype that maths is male work is stronger in more equal countries. If barriers are lower there, why should that stereotype be stronger, rather than weaker? Does this not just push the question back one step?

  If she says: She will argue that stereotypes are cultural residues that persist independently of institutional barriers.
  Follow-up: If they persist independently, what mechanism sustains them in environments explicitly designed to dismantle such cultural residues?

  3. Many choices involve part-time work or household bargaining, meaning the decision is joint and time-constrained, not individual. How does your account of preference formation handle this unit of choice, where the 'chooser' is actually a household?

  If she says: She will respond that households are themselves institutions that supply option sets and evaluative standards.
  Follow-up: If the household is the institution, how do you distinguish between a preference formed within it and coercion exerted by it?

  4. If preferences are formed by the options institutions supply, does 'free choice' retain any content? Or does this make your view unfalsifiable, since any outcome can be described as answering to some institutional standard?

  If she says: She will claim that freedom is relational and retains content only relative to specific institutional comparisons.
  Follow-up: Can you specify a concrete case where relational freedom is absent, which your view would identify as unjust?

  5. You argue gender-equality scorecards are circular because they include the outcomes they explain. But you also need a standard for which alternatives count as relevant. How does your account escape that same circularity charge?

  If she says: She will likely reply that relevance is determined by local institutional norms, not global indices.
  Follow-up: If local norms define relevance, how do you critique those norms without importing an external standard?

  6. You say justice concerns hierarchy, not ratios. But if the feminisation of an occupation itself depresses its pay and standing, doesn't the sorting create the hierarchy? Does this not collapse your criterion back into a ratio criterion?

  If she says: She will maintain that hierarchy is an independent variable regarding security and esteem, not merely pay.
  Follow-up: If pay is excluded, how do you measure esteem without relying on the very occupational status you claim is biased?

  7. If surveys measuring social esteem are themselves shaped by the existing sorting you bracket, how can we measure esteem independently? Are we not just reading the hierarchy we are trying to evaluate?

  If she says: She will suggest that esteem is revealed in policy protections and labour laws rather than surveys.
  Follow-up: Since those laws are also products of the existing political sorting, what independent metric remains available to you?

  8. Conceding your central point that ratios are not the primary target, what should a ministry of education stop doing and start doing on Monday morning? Please give concrete actions, not general principles.

  If she says: She will advise stopping targets for numerical representation and starting audits of pay and security hierarchies.
  Follow-up: Which specific existing programme would you cut to fund those audits without reducing overall educational capacity?

  9. To avoid the reply that I assume the picture you reject: what specific prediction does your view make about future occupational trends that the assumption of fixed inner preferences explicitly rules out?

  If she says: She will predict that hierarchy gaps will narrow even if occupational ratios remain static.
  Follow-up: If ratios stay static, what mechanism drives the hierarchy change without preference shifts?
