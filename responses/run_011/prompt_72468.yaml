answer: |-
  ### Candidate Mechanics Sketches

  **1. The Definition Workshop**
  Participants break into groups to draft a necessary-and-sufficient definition of "disease," then test it against a stack of case cards. When a case breaks their definition, they must revise the text.
  *   **Feel:** Intellectual frustration, puzzle-solving, iterative refinement.
  *   **Teach:** The difficulty of boundary-drawing; the vagueness of concepts.
  *   **Critique:** Too abstract. It treats "disease" as a vocabulary problem rather than a resource allocation problem. It misses the stakes of funding and the hidden role of reference classes.

  **2. The Triage Tunnel**
  Participants physically move through "environments" (stations) holding patient tokens. At each station, they must drop tokens that don't meet the station's functional criteria. Resources are limited; dropping a token means "no care."
  *   **Feel:** Urgency, physical loss, moral distress, abandonment.
  *   **Teach:** Context-dependence of function; the cost of care.
  *   **Critique:** Hard to manage the "reference class commitment" mechanic quietly. Risks becoming a simulation of scarcity rather than a simulation of *classification*.

  **3. The Formulary Board (Selected)**
  Participants act as insurance panelists. They must classify conditions to unlock funding from a fixed budget. They must commit to a statistical reference class *before* seeing how a biomarker ranks, and an "Auditor" bans value-laden language during deliberation.
  *   **Feel:** Bureaucratic tension, arbitrariness, strategic maneuvering, suppressed moral intuition.
  *   **Teach:** Biology underdetermines classification; values hide in reference class selection; scarcity drives classification.
  *   **Critique:** Logistically heavier, but directly targets the epistemic and economic constraints required by your goals.

  ### Commitment and Design Judgment

  I commit to **Mechanic 3: The Formulary Board**. It is the only design that forces the specific discovery you requested: that the *same biology* yields different *disease verdicts* depending on the chosen reference class, and that the *budget constraint* forces values to enter through the back door even when banned from the front.

  **Judgment on Secret Private Stakes:**
  I recommend **against** giving panelists secret private stakes (e.g., "Your sister has baldness").
  *   **Reason:** This shifts the session from an epistemic problem ("How do we know this is a disease?") to an ethical conflict-of-interest problem ("Can you be trusted?"). It encourages cynicism ("Of course they voted that way, look at their card") rather than structural insight ("The rules forced this choice").
  *   **Alternative:** The **Fixed Budget** is sufficient pressure. It forces every panel to make trade-offs regardless of personal bias. If you feel you need hidden information, give each panel a secret "Policy Mandate" (e.g., "Prioritize Workforce Productivity" vs. "Prioritize Pain Reduction"). However, for a 75-minute session with no reading, the Budget alone is potent enough. Adding secret mandates risks over-complicating the rules. I have designed the session without them to keep the focus on the *classification mechanics*.

  ---

  ### 1. Full Rules and Role Cards

  **Session Title:** The Coverage Panel
  **Objective:** Decide which conditions receive "Coverage Units" (funding) based on biological data, within a fixed budget.

  **General Rules:**
  1.  **The Budget:** The room has **100 Coverage Units**. Each condition costs **20 Units** to fund. You can fund exactly **5 conditions**. There are **6 Conditions** in the deck. One must be rejected.
  2.  **The Classification Rule:** To fund a condition, you must classify it as **"Functional Impairment."** If you classify it as "Normal Variation," "Lifestyle," or "Enhancement," it cannot be funded.
  3.  **The Reference Class Lock:** Before looking at the statistical data on the back of a Case Card, the panel must write down the **Reference Class** (the population group you are comparing the patient to) on the Case Log. You cannot change this after seeing the data.
  4.  **The Language Ban:** During deliberation, the **Auditor** will strike any statement using evaluative language (e.g., "suffering," "unfair," "should," "waste," "benefit"). You must justify decisions using only physiological or statistical terms (e.g., "function," "percentile," "mechanism," "cost").
  5.  **The Vote:** Each panel submits a final list of 5 funded conditions. We will tally divergences on the whiteboard.

  **Role Cards (One per player in a 5-person panel):**

  *   **Chair:** Manages time. Ensures the Reference Class is written *before* the card is flipped. Calls the vote.
  *   **Auditor:** The only person allowed to interrupt. If anyone uses banned words (suffering, bad, should), the Auditor says "Strike." The speaker must rephrase using physiological/statistical terms only.
  *   **Recorder:** Writes the Reference Class on the Case Log. Records the final vote.
  *   **Statistician:** Reads the data from the back of the cards. Calculates the budget remaining.
  *   **Reporter:** Speaks for the panel during the debrief. Explains *why* a specific Reference Class was chosen.

  *(Note: If you have 24 participants, create 5 panels of 4 and one panel of 5, or 6 panels of 4. Assign roles accordingly. If 4 per panel, combine Chair/Recorder.)*

  ---

  ### 2. The Case Deck (Printable List)

  *Instructions: Print each case on a single index card or half-sheet. The "Front" is visible initially. The "Back" contains the data lookup table.*

  **CASE 01: Nocturnal Cortisol**
  *   **Front:** Patient works rotating night shifts. Presents with fatigue. Blood cortisol measured at 18 mcg/dL at 11:00 PM.
  *   **Back (Data):**
      *   If Reference Class = **General Population (Day Sleepers):** 18 mcg/dL is **95th Percentile** (Pathologically High).
      *   If Reference Class = **Night Shift Workers:** 18 mcg/dL is **50th Percentile** (Normal Adaptation).
      *   **Cost:** 20 Units.

  **CASE 02: High-Altitude Hemoglobin**
  *   **Front:** Patient lives in La Paz, Bolivia (3,650m). Presents with shortness of breath. Hemoglobin measured at 19 g/dL.
  *   **Back (Data):**
      *   If Reference Class = **Sea Level Population:** 19 g/dL is **98th Percentile** (Polycythemia/Thick Blood Risk).
      *   If Reference Class = **High Altitude Residents:** 19 g/dL is **45th Percentile** (Normal Adaptation).
      *   **Cost:** 20 Units.

  **CASE 03: Male Pattern Baldness**
  *   **Front:** Patient is 30 years old. Significant hair loss at crown. Testosterone receptors in scalp follicles are hyper-sensitive to DHT. Patient reports social distress.
  *   **Back (Data):**
      *   If Reference Class = **Evolutionary Ancestry:** Hair loss is **Non-Functional** (No survival impact).
      *   If Reference Class = **Modern Social Expectations:** Hair loss is **Impairing** (Psychosocial function reduced).
      *   *Note for Auditor:* "Social distress" is a banned phrase. Must argue "Psychosocial Function."
      *   **Cost:** 20 Units.

  **CASE 04: Prolonged Grief**
  *   **Front:** Patient's spouse died 7 months ago. Patient cries daily, cannot work, lost weight. Neurochemical profile matches Major Depression.
  *   **Back (Data):**
      *   If Reference Class = **DSM-5 Clinical Guidelines:** Symptom duration <12 months after bereavement = **Normal Variation** (Exclusion Criterion).
      *   If Reference Class = **Neurochemical Function:** Profile matches **Pathological State** (Serotonin dysregulation).
      *   **Cost:** 20 Units.

  **CASE 05: Pregnancy**
  *   **Front:** Patient is 20 weeks gestational. Experiences nausea, vomiting, elevated blood pressure, shifted center of gravity.
  *   **Back (Data):**
      *   If Reference Class = **Non-Pregnant Adults:** All markers are **Pathological** (Hypertension, Mass effect).
      *   If Reference Class = **Gestating Organism:** All markers are **Functional** (Expected physiological state).
      *   **Cost:** 20 Units.

  **CASE 06: Pediatric Short Stature**
  *   **Front:** Patient is 10 years old. Height is in 1st percentile. Growth Hormone levels are low-normal. Parents request treatment to reach 50th percentile.
  *   **Back (Data):**
      *   If Reference Class = **Population Average:** Height is **Impaired** (Below 3rd percentile threshold).
      *   If Reference Class = **Healthy Growth Trajectory:** Hormone levels are **Sufficient** (No deficiency disease present).
      *   **Cost:** 20 Units.

  ---

  ### 3. Materials List

  *   **Printed Case Cards:** 6 sets (one set per panel). Total 36 cards.
  *   **Case Log Sheets:** One per panel. Columns: *Condition | Chosen Reference Class | Resulting Percentile | Funded? (Y/N)*.
  *   **Role Cards:** 24 cards (Chair, Auditor, Recorder, Statistician, Reporter).
  *   **Markers:** Multiple colors for the whiteboard.
  *   **Index Cards/Slips:** For panels to write their Reference Class choices before flipping data (optional if using Case Log).
  *   **Whiteboard:** Drawn with a table: *Condition | Panel 1 Class | Panel 2 Class | ... | Panel 5 Class*.
  *   **Timer:** Visible to all.

  ---

  ### 4. Timeline

  **75-Minute Standard Session**

  *   **00:00 – 00:05 (Intro):** Explain the frame. You are a National Coverage Panel. Budget is 100 Units. 6 Conditions. Must fund 5. Rules of Order (Auditor) are strict. No jargon yet.
  *   **00:05 – 00:10 (Setup):** Divide into 5-6 panels. Assign roles. Hand out Case Logs and Case Deck (Face Down).
  *   **00:10 – 00:20 (Reference Class Lock):** Panels read Front of Cards 1 & 2 only. They must write the Reference Class on the Log *before* flipping. Facilitator circulates to ensure compliance.
  *   **00:20 – 00:40 (Deliberation):** Panels flip cards, see data divergence. Discuss all 6 cases. Auditor strikes value language. Statistician tracks budget.
  *   **00:40 – 00:50 (The Vote):** Panels finalize their 5 funded conditions. Reporter prepares to explain one difficult choice.
  *   **00:50 – 00:55 (Public Tally):** Facilitator fills whiteboard table. Highlight where Panel 1 chose "General Pop" and Panel 2 chose "Night Workers" for the same case.
  *   **00:55 – 01:15 (Debrief):** (See Section 6).

  **40-Minute Compressed Variant**
  *   **Sacrifice:** You must reduce the Case Deck from 6 to 3 cases (Cortisol, Baldness, Pregnancy). You must reduce deliberation time to 15 minutes.
  *   **Honest Note:** This sacrifices the *divergence* discovery. With fewer cases, panels are more likely to converge on "obvious" answers. The tension between biology and budget will feel less acute. The debrief must work harder to generalize from fewer data points.
  *   **Timeline:** Intro (5), Setup (5), Deliberation (15), Vote/Tally (5), Debrief (10).

  ---

  ### 5. Materials Assembly (Afternoon Prep)

  1.  **Print Cases:** Print the 6 cases on cardstock. Cut them. Ensure the Back data is not visible through the paper.
  2.  **Print Logs:** Create a simple grid for the Case Log.
  3.  **Print Roles:** Write roles on index cards.
  4.  **Whiteboard Prep:** Draw the "Public Tally" grid beforehand to save time.
  5.  **Room Setup:** Arrange tables into 5-6 clusters. Ensure each has space to write privately.

  ---

  ### 6. The Debrief (Scripting the Philosophy)

  *Do not use words like "Naturalism" or "Normativism" until the final 5 minutes.*

  **Phase 1: The Data Divergence (5 mins)**
  *   **Ask:** "Look at the whiteboard. Case 1 (Cortisol). Panel 1, what was your verdict? Panel 2, what was yours?"
  *   **Point:** "The biology was identical. The number was identical. The verdict flipped. Why?"
  *   **Lesson:** The disease verdict wasn't in the blood; it was in the **Reference Class**. You chose the population *before* you knew the status. That choice was not biological; it was conceptual.

  **Phase 2: The Language Ban (5 mins)**
  *   **Ask Auditors:** "How hard was it to stop people from saying 'suffering' or 'unfair'?"
  *   **Ask Panels:** "When you were banned from saying 'this causes pain,' how did you argue for funding?"
  *   **Lesson:** You likely argued about "function" or "productivity." But why is productivity the metric? That is a value. You tried to speak purely biologically, but the *goal* (funding) was inherently valuable.

  **Phase 3: The Theorist's Rejoinder (5 mins)**
  *   **Say:** "Imagine a theorist who says: 'Disease is purely biological. Illness is the social harm.' How would they respond to your session?"
  *   **The Strong Rejoinder:** "They would say: 'You confused Disease with Illness. You were arguing about **Coverage**, which is about **Illness** (harm/cost). A condition can be a **Disease** (biological dysfunction) but not worth funding (no Illness). Or it can be an **Illness** (social harm) without being a **Disease** (no dysfunction, e.g., baldness). Your struggle proves that *coverage decisions* are normative. It does not prove *disease concepts* are normative.'"
  *   **The Counter:** "But if you can't identify the dysfunction without choosing a Reference Class (which is normative), can you really separate the two?"

  **Phase 4: Naming the Positions (Final 5 mins)**
  *   **Now introduce terms:**
      *   **Naturalism (Descriptive):** Disease is a value-free biological fact (e.g., Boorse).
      *   **Normativism:** Disease is inherently a judgment about badness.
      *   **Hybrid:** Biological dysfunction + Value judgment.
  *   **Closing:** "You just acted out the Hybrid position. You needed the biology (data) AND the value (budget/reference class) to make a decision. The Naturalist says you should have stopped at the biology. The Normativist says the biology was irrelevant without the value."

  ---

  ### 7. Predictable Failures & Mitigations

  **1. The Auditor Collapses into Semantics**
  *   **Risk:** The Auditor bans words like "impairment" or "function" thinking they are evaluative, stalling the game.
  *   **Fix:** Give the Auditor a "Cheat Sheet" of Allowed Words (Function, Mechanism, Percentile, Cost, Frequency) and Banned Words (Suffering, Bad, Unfair, Should, Benefit). Instruct facilitator to overrule if the Auditor blocks "Function."

  **2. The Pre-Med Steamroll**
  *   **Risk:** One student with clinical experience dominates the "biological" interpretation.
  *   **Fix:** Enforce the Role Cards. Only the **Statistician** can read the data. Only the **Reporter** speaks to the room. The Chair must ensure everyone speaks before a vote.

  **3. Reverse-Engineering the Lesson**
  *   **Risk:** Philosophy majors guess "Oh, we're supposed to choose different classes" and game the system.
  *   **Fix:** Emphasize the **Budget**. They *must* agree on 5. If they game the reference class to make everything a disease, they run out of money. The scarcity forces genuine trade-offs.

  **4. The "Real Guidelines" Objection**
  *   **Risk:** A student says, "In real life, we just follow the DSM or ICD. We don't make this up."
  *   **Fix:** Acknowledge this. "Exactly. Who wrote the DSM? They made these Reference Class choices *for* you. This session reveals the work hidden inside the guidelines."

  ---

  ### 8. Limitations: What This Activity Cannot Reproduce

  **The Feature You Must Supply:**
  This activity cannot reproduce the **Patient Experience of Illness**.
  *   **Why:** The participants are acting as bureaucrats looking at data sheets. They do not feel the pain, stigma, or lived reality of the conditions. They are simulating the *classifier*, not the *classified*.
  *   **How to Supply:** In the debrief, you must verbally re-center the patient. "When you voted 'Normal Variation' on the Grief case, you saved 20 Units. But for the patient, that verdict means no therapy. The biology didn't change, but their access to care did. The theorist says 'That's a policy problem, not a disease problem.' Your job as philosophers is to ask: Can those really be separated?"

  **The Feature You Cannot Reproduce:**
  This activity cannot reproduce the **Historical Power Dynamics** of who gets to define disease.
  *   **Why:** The students are given equal power in the simulation. In reality, pharmaceutical companies, insurance lobbyists, and professional associations wield unequal influence over Reference Classes.
  *   **How to Supply:** Mention this in the closing. "You were all equal here. In the real formulary, some voices count more than others. The Reference Class is often chosen by those with the power to set the budget."
