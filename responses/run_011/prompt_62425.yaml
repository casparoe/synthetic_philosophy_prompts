prompt: |-
  I run a small arts fund inside a county government. We give away about $400k a year to resident-led arts projects, any medium, and I chair the seven-person panel that decides. We recieve roughly 140 applications a cycle, twice a year. First-pass reviewers get about twelve minutes per file: the applicant's one-page summary plus a short sample — a recording, a script excerpt, some photos. Two of the panelists are ordinary residents with no arts training, and one is a county councillor who is terrified of the local paper. Anyone we turn down gets a written reason and can appeal, so every reason we give has to survive being read out loud at a public meeting.

  I've read What is Art? twice and I'm increasingly convinced Tolstoy's test gets at what we're actually trying to find out — whether the thing did something to somebody — far better than the rubric we inherited, whose top category is "artistic excellence and innovation." So build me the panel procedure: ordered steps a non-philosopher can run in twelve minutes, what counts as a pass at each step, where the procedure stops with a flat no, and where it has to hand the call to a human because its a values question rather than a facts question.

  Things it has to deal with explicitly:

  - infection as an actual test and not a vibe: what does a reviewer look for in the sample, and how do we stop "I wasn't moved" from turning into "this isn't art," given that Tolstoy's reply to the unmoved critic is that their capacity has atrophied — which makes the whole thing look unfalsifiable.
  - the three conditions, individuality / clarity / sincerity: which of them survive being turned into a check list item and which have to stay judgment, and how you assess sincerity from a file when nobody ever meets the applicant.
  - his counterfeit markers — borrowings, imitativeness, strikingness, amusement — usable as screens rather than as insults.
  - the subject-matter axis, feelings that unite against feelings that divide. He grades those against the religious perception of the age and we're a secular county running about four of those at once, so tell me what stands in for it and flag loudly that this step is values dressed as procedure. Our board rule also says nothing may be rejected for its politics, so the procedure has to separate a project that transmits a feeling from one that argues a thesis.
  - what we do with innovation, the criterion we publish and the theory treats as a red flag.

  Then run it on three real-ish files:

  1. Three-channel video, 22 minutes, wordless, about a town flooded for a reservoir, by an artist with a national reputation. Gorgeously made, allusive, you kind of need to know your way around gallery video to follow it. Our arts-side panelists put it top on innovation. When we played the sample for a resident focus group nobody could say what they felt; two said it was interesting.
  2. A cycle of songs written and sung by night-shift hospital cleaners, mostly recent immigrants, performed at shift change in the cafeteria. No notation, limited technique, tiny budget. When we played the recording in the room, two panelists teared up and one said she'd been humming it all afternoon. Two board members call it a nice community activity rather than art, and worry about precedent.
  3. A one-man spoken-word show plus a mural, from an applicant we funded three years ago. Infectious, no argument — the room laughed and hissed in exactly the right places, and it's obviously made from real feeling. But the feeling it transmits is a fierce we-against-them aimed at a named group of residents: the people who bought up the old mill housing. Tell me whether the verdict changes for a version of the same show whose feeling is indignation at the evictions themselves, and say why the two come out differently if they do.

  Say which of the three you'd fund and don't soften it — I already suspect at least one of your answers is something I can't sell to the board. Finish with what the procedure can't do, which Tolstoyan distinctions you had to drop to make it runnable and what breaks without them, and where it will predictably misfire in a room of seven tired people at 6pm.
reasoning: |-
  Here's a thinking process that leads to the suggested panel procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Context:** Small county arts fund ($400k/year, 140 applications/cycle, 2 cycles/year).
      *   **Panel:** 7 people (Chair + 2 residents w/o arts training + 1 nervous councillor + 3 arts pros).
      *   **Constraint:** 12 minutes per application (summary + sample).
      *   **Requirement:** Written reasons for rejection (must survive public scrutiny/appeal).
      *   **Philosophical Framework:** Tolstoy's *What Is Art?* (Infection, Sincerity, Individuality, Clarity, Religious Perception of the Age).
      *   **Specific Challenges to Address:**
          *   Infection as a test (avoiding "I wasn't moved" = "bad art" vs. "my capacity atrophied").
          *   The Three Conditions (Individuality, Clarity, Sincerity) -> Checklist vs. Judgment.
          *   Counterfeit Markers (Borrowing, Imitation, Strikingness, Amusement) -> Screens.
          *   Subject-Matter Axis (Uniting vs. Dividing feelings) -> Secular equivalent of "Religious Perception."
          *   Politics Rule (Cannot reject for politics) vs. Tolstoy's "Divisive Feelings."
          *   Innovation (Published criterion vs. Tolstoy's red flag).
      *   **Task:** Build the procedure (steps, pass/fail, hand-off points).
      *   **Task:** Run the procedure on three specific cases.
      *   **Task:** Declare funding verdicts (no softening).
      *   **Task:** Critique the procedure (limitations, dropped distinctions, failure points).

  2.  **Analyze Tolstoy's *What Is Art?* for Bureaucratic Application:**

      *   *Core Thesis:* Art is a human activity consisting in this, that one man consciously, by means of certain external signs, hands on to others feelings he has lived through, and that other people are infected by these feelings and also experience them.
      *   *The Test:* Infection (Did it transmit the feeling?).
      *   *The Quality Metrics:*
          1.  **Sincerity:** Did the artist feel what they are transmitting? (Hardest to judge from a file).
          2.  **Individuality:** Is it distinct to the artist? (Not just copying).
          3.  **Clarity:** Is the transmission intelligible?
      *   *The Value Metric:* Religious Perception of the Age (In a secular county: "Shared Human Flourishing" or "Community Cohesion"). Feelings that unite vs. feelings that divide.
      *   *Counterfeits:* Borrowing (plagiarism/style copying), Imitativeness (mimicking trends), Strikingness (shock value), Amusement (mere entertainment).
      *   *The Problem:* Tolstoy is subjective. "I wasn't moved" is the trap. The procedure needs to externalize this.

  3.  **Drafting the Procedure (The "Tolstoyan Triage"):**

      *   *Time:* 12 minutes is tight. Needs to be linear.
      *   *Step 1: The Counterfeit Screen (Minutes 0-3).* Quick elimination of obvious non-art or lazy work. (Borrowing, Imitation, Strikingness).
      *   *Step 2: The Infection Test (Minutes 3-8).* The core. How to make it objective? Use the "Resident Panelist" as the canary. If the *untrained* eye feels it, it passes. If only the *experts* feel it, it's suspect (elitism).
      *   *Step 3: The Three Conditions (Minutes 8-10).* Sincerity, Individuality, Clarity. Sincerity is the hard one. Look for internal consistency in the file.
      *   *Step 4: The Values Check (Minutes 10-12).* Uniting vs. Dividing. This is where the Politics Rule clashes with Tolstoy. Need to distinguish "Argument/Thesis" (Politics) from "Feeling/Experience" (Art).
      *   *Hand-off:* If Step 4 is ambiguous regarding "Divisiveness," it goes to full panel vote, not Chair decision.

      *Refining the "Infection" Problem:* Tolstoy says if you aren't moved, your capacity is atrophied. We can't tell applicants "you're rejected because our reviewer is spiritually dead."
      *Solution:* The "Consensus of Sensation." We don't ask "Is this good?" We ask "Did you feel X?" If the applicant claims to transmit Grief, and 4/7 panelists feel Nothing, it failed transmission (Clarity/Sincerity issue), not necessarily "bad art," but failed *function*.
      *Refining "Innovation":* Tolstoy hates novelty for novelty's sake. The procedure must reframe Innovation as "New Vehicle for Old Feeling" rather than "New Feeling via New Vehicle."

  4.  **Developing the Three Cases:**

      *   **Case 1 (Video Art):** High technical skill, low infection (residents confused), high innovation.
          *   *Tolstoy View:* Counterfeit (Strikingness/Imitativeness of gallery style). Fails Infection (Clarity).
          *   *Verdict:* Reject. (Hard sell to arts panel, but fits Tolstoy).
      *   **Case 2 (Hospital Cleaners):** Low skill, high infection (tears/humming), high sincerity.
          *   *Tolstoy View:* True Art. Unites (shared labor/dignity).
          *   *Verdict:* Fund. (Hard sell to board worried about "community activity" precedent).
      *   **Case 3 (Spoken Word/Mural):** High infection, high sincerity.
          *   *Version A (We-vs-Them):* Divisive feeling. Targets specific neighbors.
          *   *Version B (Indignation at Evictions):* Uniting feeling (Justice/Empathy).
          *   *Tolstoy View:* Version A fails the "Religious Perception" (Community Cohesion) test. Version B passes.
          *   *Verdict:* A = Reject (Values), B = Fund.

  5.  **Addressing the Specific Constraints:**

      *   *Politics Rule:* Must distinguish "Feeling of Anger at Injustice" (Art) vs. "Policy Proposal/Partisan Attack" (Politics). Tolstoy allows anger if it unites against evil, but not if it divides neighbors.
      *   *Sincerity from a File:* Look for risk. Did they expose something vulnerable? Or is it polished safety?
      *   *Written Reasons:* Must be phrased carefully. Not "This is bad." But "The sample did not successfully transmit the stated emotional intent to a majority of reviewers."

  6.  **Drafting the Content (Iterative refinement):**

      *   *Procedure Name:* The Transmission Protocol.
      *   *Steps:* Needs to be rigid enough for 12 mins.
      *   *Case Analysis:* Needs to be blunt.
      *   *Critique:* Needs to be honest about where Tolstoy fails in a bureaucracy (e.g., subjectivity of "Infection," the risk of populist mediocrity).

  7.  **Final Review against Constraints:**
      *   Did I address the "atrophied capacity" trap? Yes, by using the mixed panel as a control group.
      *   Did I address the Councillor's fear? Yes, by making the "Values" step a collective vote, not Chair fiat.
      *   Did I address Innovation? Yes, by redefining it as clarity of transmission, not novelty of form.
      *   Did I answer the specific Case 3 variation? Yes.

  8.  **Tone Check:** The user is sophisticated, tired of bureaucracy, and wants a tool that works. The tone should be pragmatic, slightly sharp, and philosophically rigorous but operationally grounded. No fluff.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Tolstoy says X." I need to translate Tolstoy into *administrative language*. "Infection" becomes "Transmission Verification." "Religious Perception" becomes "Civic Cohesion."
      *Crucial distinction:* The prompt asks to distinguish "transmits a feeling" from "argues a thesis." This is key for the Politics Rule. Art = Feeling. Propaganda = Thesis.

      *(Refining the "Infection" metric)*: If the resident panelists (non-experts) don't feel it, Tolstoy would say it's bad art (elitist). If the experts *only* feel it, it's likely "Counterfeit/Imitative." This solves the "atrophied capacity" issue by democratizing the sensor.

      *(Refining Case 3)*: Why does Version B pass? Because indignation at *evictions* (an abstract injustice) unites the audience against the *act*, whereas Version A unites the audience against *neighbors*. Tolstoy is very clear on Christian brotherhood. In a secular context, this is "Civic Solidarity."

      *(Final Polish)*: Ensure the "Written Reason" examples are defensible in court/public meeting.

  9.  **Final Output Structure:**
      1.  The Procedure (The Transmission Protocol).
      2.  The Three Cases (Verdicts & Rationale).
      3.  The Limitations (Where it breaks).

      *Let's write it.*
answer: |-
  Here is the procedure, the case rulings, and the critique.

  ### Part I: The Transmission Protocol (12-Minute Procedure)

  This procedure replaces "Artistic Excellence" with "Transmission Efficiency." It treats the application not as a portfolio to be judged, but as a signal to be received.

  **The Panel Composition:**
  *   **Group A (The Sensors):** The 2 resident panelists (no arts training).
  *   **Group B (The Technicians):** The 3 arts professionals.
  *   **Group C (The Civic Guard):** The Councillor + Chair (focused on liability and cohesion).

  **Minute 0–3: The Counterfeit Screen (Group B leads)**
  *   **Task:** Scan for Tolstoy's four markers of counterfeit art.
  *   **Checklist:**
      1.  **Borrowing:** Is the style lifted directly from a famous predecessor without transformation?
      2.  **Imitativeness:** Is it mimicking a current trend (e.g., "immersive experience," "AI-generated") rather than serving a need?
      3.  **Strikingness:** Does it rely on shock, gore, or nudity to simulate intensity?
      4.  **Amusement:** Is it designed primarily to entertain or pass time?
  *   **Pass:** 0–1 markers present.
  *   **Fail:** 2+ markers present.
  *   **Stop:** Flat No. Written reason: *"The work relies primarily on stylistic imitation and strikingness rather than emotional transmission."* (This is factual, not subjective).

  **Minute 3–8: The Infection Test (Group A leads)**
  *   **Task:** Address the "atrophied capacity" trap. We do not ask "Is this good?" We ask "Did the transmission land?"
  *   **Procedure:**
      1.  Applicant states the **Intended Feeling** in the summary (e.g., "Grief for the lost town," "Solidarity among workers").
      2.  Group A (Residents) consumes the sample.
      3.  Group A records their **Actual Feeling**.
  *   **Pass:** Group A reports a feeling that matches or approximates the Intended Feeling.
  *   **Fail:** Group A reports "Confusion," "Boredom," or "Intellectual Interest" (which Tolstoy classifies as non-art).
  *   **The "Atrophy" Safeguard:** If Group B (Experts) reports strong infection but Group A reports nothing, the application is flagged for **Clarity Failure**, not Quality Failure. The assumption is that art which requires training to feel is not art, it is a craft for specialists.
  *   **Hand-off:** If Group A is split (one moved, one not), this moves to a **Values Question** (Minute 10).

  **Minute 8–10: The Three Conditions (Chair leads)**
  *   **Task:** Assess Sincerity, Individuality, Clarity based on the file.
  *   **Sincerity (The File Check):** Look for **Risk**. Does the sample expose a vulnerability? Is the budget realistic for the ambition? (Over-polished samples often indicate insincerity/performance).
      *   *Judgment:* High/Medium/Low.
  *   **Individuality:** Is the voice distinct, or could anyone have made this?
      *   *Checklist:* Does the applicant's history match the work?
  *   **Clarity:** Was the medium appropriate for the message?
  *   **Pass:** High Sincerity + Medium Individuality.
  *   **Fail:** Low Sincerity. (You cannot transmit what you do not feel).
  *   **Stop:** Flat No. Written reason: *"The application demonstrates technical competence but lacks the internal consistency required to verify sincerity of intent."*

  **Minute 10–12: The Civic Cohesion Check (Group C leads)**
  *   **Task:** Replace "Religious Perception of the Age" with "Civic Cohesion." This is the Values Step.
  *   **The Politics Rule Compliance:**
      *   **Allowed:** Transmission of a feeling *about* a political situation (e.g., Anger at eviction, Joy in protest).
      *   **Rejected:** Transmission of a thesis *against* a group of people (e.g., "Neighbors who bought the mill are enemies").
      *   **Test:** Does the feeling unite the audience against an *injustice*, or does it unite the audience against *other citizens*?
  *   **Pass:** Feeling promotes shared dignity or shared sorrow.
  *   **Fail:** Feeling promotes sectarian division or dehumanization of a specific local group.
  *   **Hand-off:** If the Councillor fears legal liability or press backlash, this **must** go to a full panel vote. The Chair cannot veto here alone.
  *   **Written Reason:** *"While the work transmits emotion effectively, the feeling transmitted is divisive regarding specific community members, which conflicts with the fund's mandate to foster shared civic experience."*

  ***

  ### Part II: The Three Files

  #### File 1: The Flooded Town Video
  *   **Profile:** 3-channel video, national artist, high innovation, low resident infection.
  *   **Protocol Run:**
      *   **Counterfeit Screen:** Passes. Not imitative, not amusing.
      *   **Infection Test:** **FAIL.** Group A (Residents) reported "Interesting" and "Confused." Group B (Experts) reported "Profound." Under this protocol, if the residents don't feel it, it is not art; it is a specialist craft. It fails the Clarity condition.
      *   **Civic Cohesion:** N/A (Failed earlier).
  *   **Verdict:** **REJECT.**
  *   **Rationale:** Tolstoy argues that art which is unintelligible to the common man is not art, but a counterfeit designed for a specific class. Your published criterion says "Innovation," but Tolstoy says Innovation is often a mask for Strikingness.
  *   **Public Reason:** *"The sample provided did not successfully transmit the stated emotional intent to a representative cross-section of reviewers. The work relies on prior contextual knowledge to be accessed, which limits its capacity for universal infection."*

  #### File 2: The Hospital Cleaners' Songs
  *   **Profile:** Night-shift immigrants, low technique, high infection (tears/humming).
  *   **Protocol Run:**
      *   **Counterfeit Screen:** Passes. Zero borrowing, zero strikingness.
      *   **Infection Test:** **PASS.** Group A and Group B both felt the intended feeling (Dignity/Exhaustion). The humming is proof of infection.
      *   **Three Conditions:** Sincerity is High (Risk is high, technique is low). Individuality is High (Specific to their experience).
      *   **Civic Cohesion:** **PASS.** It unites the audience with the workers. It fosters empathy across class lines.
  *   **Verdict:** **FUND.**
  *   **Rationale:** This is the Tolstoyan ideal. It ignores "Excellence" (technique) for "Infection" (feeling). The Board's worry about "community activity vs. art" is exactly the distinction Tolstoy dismantles. If it infects, it is art.
  *   **Public Reason:** *"The project demonstrates exceptional capacity for emotional transmission. The work succeeds in fostering shared understanding of a specific community experience, meeting the fund's core mandate."*

  #### File 3: The Spoken-Word Show (Two Versions)

  **Version A: We-Against-Them (Targeting New Neighbors)**
  *   **Profile:** Infectious, sincere, but targets "people who bought the old mill housing."
  *   **Protocol Run:**
      *   **Infection:** PASS. The room laughed and hissed. Transmission worked.
      *   **Sincerity:** PASS. Real feeling.
      *   **Civic Cohesion:** **FAIL.** The feeling is divisive. It unites the audience *against* other residents. This violates the secular "Religious Perception" (Brotherhood/Cohesion).
  *   **Verdict:** **REJECT.**
  *   **Rationale:** Tolstoy explicitly rejects art that divides humanity (patriotic, sectarian, or class-hate art). Even if it is "good art" technically, it is "bad art" morally because it stops the flow of brotherhood.
  *   **Public Reason:** *"While the work is emotionally potent, the feeling transmitted is exclusionary regarding specific community members. The fund prioritizes projects that build civic bridges rather than reinforce local divisions."*

  **Version B: Indignation at Evictions (Targeting the Act)**
  *   **Profile:** Same show, but the anger is directed at the *process* of eviction/displacement, not the *people* living there now.
  *   **Protocol Run:**
      *   **Infection:** PASS.
      *   **Sincerity:** PASS.
      *   **Civic Cohesion:** **PASS.** Indignation at injustice is a unifying feeling. It invites the audience to stand *with* the victim against an *abstract force* (gentrification/policy), not against a neighbor.
  *   **Verdict:** **FUND.**
  *   **Why the difference?** Tolstoy allows anger if it is against "evil," but not if it is against "people." Version A creates enemies. Version B creates witnesses. The Politics Rule is satisfied because Version B transmits a *feeling of injustice*, whereas Version A transmits a *thesis of enmity*.

  ***

  ### Part III: What I Would Fund
  1.  **The Cleaners' Songs.** (This is the only true art of the three).
  2.  **The Eviction Show (Version B).** (Acceptable risk, high impact).
  3.  **I would NOT fund the Video Art.** (It is a luxury good for experts).

  *Hard Truth:* You cannot sell the Cleaners' Song to a Board worried about "precedent" without redefining what the fund is for. If you fund the Video, you admit the fund is about **Prestige**. If you fund the Cleaners, you admit the fund is about **Connection**. You have to choose. Tolstoy forces the latter.

  ***

  ### Part IV: Limitations & Failure Points

  **1. Dropped Distinctions (The Cost of Runnability)**
  *   **The "Atrophy" Problem:** I solved this by democratizing the sensor (using residents). But Tolstoy would argue that if the residents are corrupted by bad culture, *they* are the problem. By making them the arbiters, we risk **Populist Mediocrity**. We might reject difficult, challenging art that requires time to infect, because 12 minutes isn't enough for "slow art" to work.
  *   **Sincerity from a File:** We are guessing. A skilled liar can fake sincerity in a one-page summary. Tolstoy believed you could *feel* sincerity; a bureaucracy can only check for consistency. We will inevitably fund good liars and reject bad writers.
  *   **The "Religious Perception":** I replaced it with "Civic Cohesion." This is weaker. Tolstoy's religious perception was objective to him (Christianity). "Cohesion" is subjective. One person's "Cohesion" is another person's "Silencing Dissent."

  **2. Predictable Misfires (The 6 PM Factor)**
  *   **The Councillor's Veto:** In Minute 12, if the Councillor is tired and scared, they will flag *any* political feeling as "Divisive." Version B (Evictions) might get killed anyway because it *looks* like Version A to a nervous politician. The procedure protects you, but not from their fear.
  *   **The "Interesting" Trap:** In File 1, residents said it was "Interesting." Tolstoy says "Interesting" is the death of art. But in a bureaucracy, "Interesting" often passes for "Good." Your arts panelists will fight you hard here. They will argue that "Infection takes time." You will have to overrule them using the protocol's time limit as the excuse.
  *   **The Written Reason:** "Failed to transmit emotion" sounds like "We didn't like it." Applicants will appeal claiming the panelists were the wrong demographic. You will need to document the *specific* feeling mismatch (e.g., "Applicant claimed Grief, Reviewers reported Curiosity") to survive appeal.

  **3. The Innovation Paradox**
  *   You publish "Innovation" as a criterion. This protocol treats Innovation as suspicious (often a Counterfeit Marker). You will have to rewrite your public guidelines to say **"Innovation in Transmission"** rather than "Innovation in Form," or this procedure will contradict your own website every time.

  **4. The Tolstoyan Trap**
  *   Tolstoy rejected Shakespeare, Beethoven, and his own earlier novels using this test. If you apply this strictly, you will reject 90% of what the professional art world considers "excellence." You must be prepared for your arts panelists to resign or rebel, claiming you are defunding "Art" to fund "Therapy." They will be right, in a sense. You are choosing Connection over Quality. Own that.
