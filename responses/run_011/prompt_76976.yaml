answer: |-
  **GLOBAL STANDARD 6.2: GIFTS, HOSPITALITY AND CONFLICTS OF INTEREST**
  **Owner:** Ethics & Compliance Committee | **Effective:** 01 January 2024

  **1. DEFINITIONS**
  **1.1 Gift:** Any transfer of value, tangible or intangible, that could create, or appear to create, a sense of obligation in the recipient toward the giver. This includes meals, transport, training, and ceremonial exchanges.
  **1.2 Exception:** Transfers are exempt if they are (a) nominal in value; (b) customary within the local cultural context; or (c) exchanged between immediate family members unrelated to official duties.
  **1.3 Obligation:** The perceived necessity to reciprocate, whether acknowledged by the recipient or not.

  **2. DECLARATION THRESHOLDS AND REGIONAL IMPLEMENTATION**
  **2.1** All Gifts exceeding **USD 50.00** must be declared via the Integrity Portal within five business days.
  **2.2 Regional Purchasing Power Note:** Field Offices must adjust risk assessments based on local economic conditions. In Region A, USD 50.00 represents 15% of average monthly household income and constitutes a High-Risk Gift. In Region B, USD 50.00 covers the cost of a standard business lunch and constitutes a Low-Risk Gift. Staff in Region A are advised that declining customary wedding contributions equivalent to USD 45.00 may be interpreted as a rejection of social kinship, yet must still be declared as Near-Miss Violations.

  **3. FREQUENTLY ASKED QUESTIONS (ANNEX A)**
  **Q: My cousin is the District Permit Officer. We share a surname and attend family funerals. Must I declare him as a Conflict of Interest?**
  **A:** Yes. Any relationship that could influence, or appear to influence, official decision-making must be declared.
  **Q: He is my cousin by blood, not by contract. Does the policy apply to biology?**
  **A:** The Standard applies to the *function* of the relationship within the programme cycle. Please declare the cousin in the "External Stakeholders" tab. If he processes your permits, you must recuse yourself from evaluating his department's performance metrics. If you cannot recuse yourself due to staffing constraints, please document the biological necessity in the mitigation log.

  **4. DECLINING GIFTS PROTOCOL**
  **4.1** When declining a Gift, staff must use the following script to ensure neutrality:
  *"Thank you for this generous gesture. However, our Global Standard 6.2 prevents me from accepting items that might create a sense of obligation. I hope you understand our commitment to neutrality."*

  **4.2 Country Director Annotation (Region A):** *Note: Use of this script during the 2023 Water Sanitation rollout resulted in the Ministry freezing all permit approvals for six weeks. Local partners interpreted 'neutrality' as 'refusal of partnership.' Future declines should be phased over three meetings to allow trust degradation to occur gradually.*

  **5. INSTITUTIONAL HOSPITALITY**
  **5.1** Gifts extended by Head Office to field staff, including Christmas hampers, service awards, and gala dinner seating arrangements, are classified as "Staff Welfare and Operational Networking."
  **5.2** These transfers do not create a sense of obligation conducive to corruption, as they originate from the employer rather than an external beneficiary. Consequently, Institutional Hospitality is exempt from the USD 50.00 threshold and does not require declaration, regardless of the perceived value or the impact on performance review outcomes. Seating proximity to Senior Management at the Annual Gala is deemed a logistical requirement, not a Gift.

  **6. COMPLIANCE**
  Failure to declare Gifts may result in disciplinary action. Staff are reminded that the appearance of impropriety is equally damaging as impropriety itself, unless the appearance is generated by Head Office operational necessities.
