  8.  **Final Polish:** Ensure tone is respectful of the user's expertise and the gravity of the situation (the mother's subsidy). (Self-correction: Ensure I don't minimize the mother's experience; use it to anchor the limitations of the visual.)

  *(Self-Correction during final review)*: Wait, I need to be careful about the "Design System" comparison. A modern design system allows variation for context. Neurath demanded strict uniformity. I need to highlight that tension. Also, the "Legal" aspect: Neurath *hoped* for a universal language, but he worked with museums and books. He didn't design legal notices. I must clarify that distinction.

