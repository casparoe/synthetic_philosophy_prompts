  *Structure:*
  1.  Introduction (Acknowledging the stakes).
  2.  Claim-by-Claim Translation (4-5 core claims).
  3.  Residue Report (Clean, Distorted, Missing).
  4.  Pressure Points (Logic, Institutional, Semantic).
  5.  Conclusion (Wrong Step + Residue Assessment).

  *Key Insight to embed:* The difference between *descriptive* visuals (Neurath) and *prescriptive* visuals (Legal Notice). This is the core friction.

  *Drafting the Logic section:* Neurath's system is ontological (what exists), not deontic (what is required). This is the hard stop.

  *Drafting the Institutional section:* Text anchors meaning. Pictures illustrate. Without text, the picture is ambiguous. Legality requires unambiguity.

  *Drafting the Semantic section:* A chart shows a state. A legal notice creates an obligation.

  *Final check on the "Wrong Step":* Probably the mapping of "Transformation" to "Content Strategy." Transformation was epistemological, not just editorial.

  *Final check on Residue:* It indicates Info Design lacks a theory of *obligation*.

