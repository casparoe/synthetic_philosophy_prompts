  3.  **Identify the Broken Step:**
      *   Step (5) is the clear culprit. It turns the Outside View from a *prior* into a *posteriors* lock.
      *   Standard rationality (Tetlock, Superforecasting, LW orthodoxy) says: Base rate is the *prior*. Inside view provides the *likelihood ratio* to update the prior.
      *   The opponent is arguing for "Reference Class Forecasting" in its most dogmatic form (Kahneman's early formulation sometimes leans this way, but superforecasting practice corrects it).
      *   Why did it look fine? Because of (3) and (4). People are chronically overconfident. The correction factor is often large. It's easy to slide from "discount the story heavily" to "ignore the story completely."
