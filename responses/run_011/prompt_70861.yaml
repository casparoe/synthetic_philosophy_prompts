prompt: |-
  So my friend Sam and I have just come off about three hours of arguing while walking and I've lost the plot a bit — you're going to have to be patient. You're the right person for this: a philosophy of mind type who has actually thought about the temporal structure of experience, not someone who read the SEP entry once. Someone who's had to explain the difference between an Orwellian and a Stalinesque revision to a confused undergrad more than twice, and who has opinions. Think carefully and don't rush to a verdict. No reading list, no citations, I'm not writing a paper, I just want the audit.

  Setup so you know what I mean by things. In the color-phi style cases you flash two spots of different colours in different places, close together in time, and the subject reports one spot moving across and changing colour partway — a colour it never instantaneously had at any point in the display. Dennett's two options: Orwellian, the experience really happened and then got rewritten before it could be reported; Stalinesque, the rewriting happens while the content is still being assembled, so the un-rewritten experience never occured at all. Sam's move, which I found uncomfortably good: he said a Stalinesque view is just an Orwellian view where you've decided the tape recorder was never plugged in, and that what licenses you to say that is the further claim that two stories agreeing on every possible report and every possible probe response are not two stories. Which he says I also hold. And he says that claim, plus wanting there to be unreportable experience, means I don't get to say there's a fact of the matter at all — which is the first thing on my list. I don't fully buy it and I can't shake it either.

  What I hold, written down properly for the first time ever:

  (a) there is a fact of the matter about what it's like for a subject at a time. I'm not a multiple-drafts guy. Consciousness happens once, at a time, in a subject.
  (b) in the color-phi cases the subject's verbal report is a decent readout of what they experienced, not a post-hoc reconstruction. People confabulate sometimes, sure, but I don't think that's what's going on here.
  (c) I'm a Stalinesque about postdiction generally: when a later stimulus changes how an earlier one looked, nothing that was already conscious got edited — the earlier content was still under construction. What's conscious is what the brain has globally settled on and made available.
  (d) experience is smeared rather than knife-edged. A moment of consciousness covers a short stretch of a few hundred ms, more like a long exposure than a photograph.
  (e) if two theories of consciousness make all the same predictions about every possible report, probe response and behavioural discrimination, they are not really two theories. I'm pretty verificationist about phenomenal claims.
  (f) there is something it's like for a subject at times when they have no report and no disposition to report — peripheral stuff you'd deny under questioning, the tail end of a dream you never told anyone about, and so on.

  What I want:

  1. Before the audit, brainstorm out loud. List every pair you're going to call a tension and every pair you considered and threw out, one line of reasoning each. I want to see the culling, not just the survivors.
  2. Then go through the pairs you kept. For each, how bad is it on a 1–5 scale, what is the specific claim doing the damage, and what would have to give — not "revise (e)" but the smallest change to (e) that removes the clash.
  3. Tell me which single revision buys back the most overall coherence and what I actually lose by making it. I don't want to know which one you'd give up, I want to know which one is cheapest.
  4. Rank the tensions by severity rather than treating them all as equally bad, and please genuinely discriminate. Don't flag all fifteen pairs to be safe and don't tell me the set is fine either. At least one pair I'm sure only looks bad — (a) and (d) feel like they should clash and I can't tell if they do, so check me on that one specifically rather than agreeing with my hunch.
  5. Finish by saying whether Sam's move actually lands or whether it slides somewhere, and if it slides, exactly where. And whether the worst problem in my set is the one he identified or a different one he didn't notice.
