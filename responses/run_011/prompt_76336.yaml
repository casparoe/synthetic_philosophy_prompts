answer: |-
  Here is a close reading of the excerpt, addressing your seven points in order.

  ### 1. Sentence-by-Sentence Plain Rendering

  **Paragraph 1**
  *   *"It is contended that he has secured such exclusive right, because no one can use the system without using substantially the same ruled lines and headings which he has appended to his books in illustration of it."*
      *   **Rendering:** The plaintiff argues he owns the exclusive right to the bookkeeping system itself. His reason is that you cannot practice the system without copying the specific lines and headings he printed in his book to show how it works.
  *   *"In other words, it is contended that the ruled lines and headings, given to illustrate the system, are a part of the book, and, as such, are secured by the copyright; and that no one can make or use similar ruled lines and headings, or ruled lines and headings made and arranged on substantially the same system, without violating the copyright."*
      *   **Rendering:** Put simply, the plaintiff claims the visual forms are part of the copyrighted book. Therefore, anyone who creates or uses similar forms, or forms arranged by the same logic, is infringing the copyright.

  **Paragraph 2**
  *   *"Where the truths of a science or the methods of an art are the common property of the whole world, any author has the right to express the one, or explain and use the other, in his own way."*
      *   **Rendering:** In cases where scientific facts or artistic methods belong to everyone (are free for public use), any writer is allowed to describe those facts or explain and practice those methods using their own words and arrangements.
  *   *"As an author, Selden explained the system in a particular way."*
      *   **Rendering:** Selden, acting in the capacity of a writer, described the system using a specific explanation.
  *   *"It may be conceded that Baker makes and uses account-books arranged on substantially the same system; but the proof fails to show that he has violated the copyright of Selden's book, regarding the latter merely as an explanatory work; or that he has infringed Selden's right in any way, unless the latter became entitled to an exclusive right in the system."*
      *   **Rendering:** We can admit Baker uses books based on the same system. However, there is no evidence he violated the copyright on Selden's book *qua* (in the capacity of) an explanation. He has not infringed any right of Selden's, *unless* Selden successfully acquired an exclusive ownership right in the system itself (which the Court implies he has not).

  **Paragraph 3**
  *   *"And this is really the question to be decided in this case."*
      *   **Rendering:** This is the actual legal issue we must resolve.
  *   *"Stated in another form, the question is, whether the exclusive property in a system of book-keeping can be claimed, under the law of copyright, by means of a book in which that system is explained?"*
      *   **Rendering:** Rephrased: Can someone claim ownership of a bookkeeping *system* using *copyright law*, just by publishing a *book* that explains that system?
  *   *"The complainant's bill, and the case made under it, are based on the hypothesis that it can."*
      *   **Rendering:** The plaintiff's legal complaint (the "bill") and the argument built from it assume the answer is yes. (Note: A "bill" is the formal document initiating a suit in equity; "based on the hypothesis" means the entire lawsuit collapses if this assumption is false).

  **Paragraph 4**
  *   *"There is no doubt that a work on the subject of book-keeping, though only explanatory of well-known systems, may be the subject of a copyright; but, then, it is claimed only as a book."*
      *   **Rendering:** Certainly, a book about bookkeeping can be copyrighted, even if it describes old systems. However, the protection is claimed strictly for the *book* (the text/explanation), not the subject matter. (Note: "As such" here functions similarly to "only as a book"—it limits the scope of the claim to the object's identity as a literary work).
  *   *"Such a book may be explanatory either of old systems, or of an entirely new system; and, considered as a book, as the work of an author, conveying information on the subject of book-keeping, and containing detailed explanations of the art, it may be a very valuable acquisition to the practical knowledge of the community."*
      *   **Rendering:** This book might explain old methods or brand new ones. Viewed strictly as a literary work that teaches bookkeeping and details the art, it could be extremely valuable to the public.
  *   *"But there is a clear distinction between the book, as such, and the art which it is intended to illustrate."*
      *   **Rendering:** However, there is a definite separation between the *book* (in its specific capacity as a text) and the *practice* (the art) that the book describes.
  *   *"The mere statement of the proposition is so evident, that it requires hardly any argument to support it."*
      *   **Rendering:** This separation is so obvious it barely needs proof.
  *   *"The same distinction may be predicated of every other art as well as that of book-keeping."*
      *   **Rendering:** This separation applies (is "predicated of") to every skilled practice, not just bookkeeping. (Note: "Predicated of" means asserted to be true of or attributed to).

  ### 2. The Nature of the Distinction

  The distinction is primarily about the **scope of two different legal instruments**, grounded in a functional distinction between **describing a practice versus engaging in it**. It is not a purely ontological claim that ideas *cannot* be owned, but rather a claim about what *copyright* owns.

  The wording that decides this is found in Paragraph 3: *"whether the exclusive property in a system of book-keeping can be claimed, **under the law of copyright**, by means of a book..."*

  If this were a metaphysical claim that systems are inherently unownable, the qualifier "under the law of copyright" would be unnecessary. The Court is defining the boundary of a specific statutory grant. Furthermore, in Paragraph 2, the Court writes that Baker has not infringed *"unless the latter became entitled to an exclusive right in the system."* This phrasing presupposes that it is *possible* to become entitled to an exclusive right in the system (presumably through a different legal mechanism, such as patent), but that Selden has not done so here. If ideas were metaphysically unownable, one could never become "entitled to an exclusive right in the system."

  Therefore, the distinction is between the *book* (protected by copyright as expression) and the *art* (potentially protectable by other means as utility), rather than between *ownable things* and *unownable things*.

  ### 3. The "Evident" Proposition and the Complainant's Contention

  The Court **bypasses** the complainant's contention rather than answering it directly.

  The complainant argues practical inseparability: *"no one can use the system without using substantially the same ruled lines and headings."* They argue that the expression (the lines) and the idea (the system) are merged in practice.
  The Court responds with conceptual separability: *"there is a clear distinction between the book, as such, and the art which it is intended to illustrate."*

  The Court asserts that even if the lines are necessary to use the system, the *right* in the book does not extend to the *use* of the system. This is not necessarily a defect in reasoning, but a reflection of what a court must establish in a case of statutory interpretation. The Court is defining the *legal consequence* of the copyright grant, not the physical relationship between ink and paper. It is ruling that the statutory monopoly on "copies of a book" does not translate into a monopoly on "using the art described in the book," regardless of whether using the art requires copying the book's illustrations. The "evident" nature of the proposition refers to the legal categories, not the physical practicality.

  ### 4. The "Common Property" Sentence

  *"Where the truths of a science or the methods of an art are the common property of the whole world, any author has the right to express the one, or explain and use the other, in his own way."*

  **Status of the Premise:** This is a **normative commitment about what must be left open for others**, functioning as a rule of construction for the copyright statute. It is not a description of how ideas physically exist (ontology), nor is it a statement of positive law independent of the statute. It is a principle the Court uses to interpret the scope of the copyright grant: Copyright protects the author's *way* of expressing, not the *truths* themselves.

  **Meaning of "Common Property":** In this context, "common property" means **unowned (public domain)**, not "owned in common."
  *   **Against your Friend:** Your friend reads "common property" as a metaphysical declaration that ideas *cannot* be owned. However, the sentence begins with "**Where** the truths... are the common property." This is conditional. It implies there may be truths or methods that are *not* the common property of the whole world (i.e., they could be privately owned via patent). If ideas were metaphysically unownable, the condition would be superfluous; all truths would always be common property.
  *   **Against You:** You argue this is purely about statutory reach. This reading is supported by the second half of the sentence: *"any author has the right to express the one, or explain and use the other, in his own way."* This limits the right to the *author's way* (expression), not the underlying truth.
  *   **Verdict:** The sentence supports your position more than your friend's. It treats "common property" as the default status of ideas *unless* an exclusive right has been secured elsewhere (as hinted in Paragraph 2). It establishes that copyright does not alter that default status.

  ### 5. Value and Novelty vs. Copyright

  The Court concedes the book may explain an *"entirely new system"* and be a *"very valuable acquisition."* It denies the claim anyway.

  **Conception of Copyright:** This presupposes a conception of copyright as a reward for **labor in expression**, not a reward for **social utility or invention**.
  **Why Value/Novty is Beside the Point:** On this conception, the *value* of the information contained in the book belongs to the realm of the "art." Copyright secures the *conveying* of the information, not the *information's* practical application. If copyright protection depended on the novelty or utility of the system described, copyright would merge with patent law. The Court is maintaining a categorical boundary: a book can be immensely useful and describe a brand-new invention, but the copyright only stops others from copying the *text*, not from practicing the *invention*. The value of the system is irrelevant to the scope of the right in the book.

  ### 6. Adjudication

  **Your Friend's Strongest Reading:**
  The Court declares that "truths of a science" are "common property of the whole world." This sounds like a universal declaration that ideas are free. The Court calls the distinction between book and art "evident" and requiring "hardly any argument," suggesting this is a self-evident truth of nature, not a nuanced reading of a statute. The friend argues the Court is settling the metaphysical status of ideas: they are res communis, not res privatae.

  **Your Strongest Reading:**
  The Court repeatedly qualifies its holding with jurisdictional limits: "under the law of copyright," "claimed only as a book," "regarding the latter merely as an explanatory work." Crucially, the Court leaves a door open: Baker hasn't infringed *"unless the latter became entitled to an exclusive right in the system."* This implies the system *could* be owned, just not through this specific legal vehicle. The Court is drawing a boundary between two types of legal protection, not declaring one type of object unownable.

  **Which the Excerpt Supports:**
  The text supports **your position**.
  The decisive evidence is the conditional language ("Where the truths...", "unless the latter became entitled..."). If the Court believed ideas were metaphysically unownable, it would not speculate on whether Selden *could* have become entitled to an exclusive right in the system. It would simply say no one can own a system. Instead, it says Selden cannot own the system *via copyright*. The opinion is a ruling on the **scope of the statutory instrument**, not the **ontology of ideas**. Your friend is mistaking a limitation on *copyright* for a limitation on *ownership*.

  **A Third Reading:**
  There is a third reading implicit in the text: The **Merger Doctrine**. The Court acknowledges the complainant's argument that the system and the forms are inseparable ("no one can use the system without using... the lines"). The Court's insistence on the distinction "between the book, as such, and the art" is a legal fiction imposed to prevent copyright from swallowing patent law. The text supports the view that when expression is necessary to practice an idea, copyright recedes, not because the idea is unownable, but because the *instrument* of copyright is the wrong tool for that job.

  ### 7. Pressure Points and Textual Resources

  **Where the Distinction Comes Under Pressure:**
  The distinction collapses when the "book" is not merely an explanation but the **instrument of the art itself**. In *Baker*, the book contained "ruled forms and headings." If the "art" of bookkeeping *is* the act of writing on those forms, then using the art *is* copying the book's expressive elements. The complainant's argument ("no one can use the system without using substantially the same ruled lines") highlights this pressure point. If the expression and the function are identical, the Court's distinction between "book as such" and "art" becomes difficult to maintain practically.

  **Textual Resources to Handle It:**
  The text contains resources to handle this, though they rely on the "statutory scope" reading (your reading).
  1.  **"As such":** The Court insists the book is protected *"as a book"* and *"as an explanatory work."* If the forms are being used *functionally* (to keep accounts) rather than *explanatorily* (to teach how to keep accounts), they are being used as "art," not as "book." The text allows the Court to categorize the *use* rather than just the *object*.
  2.  **"Unless... entitled to an exclusive right in the system":** This resource allows the Court to acknowledge that if the forms are the system, they might be protectable, but only if the proper requirements for owning a system (e.g., novelty, examination) are met. The text implies that if Selden wanted to own the forms *as a system*, he needed a different "entitlement" than copyright.

  **Dependency Flag:**
  My conclusion that the Court implies an alternative mechanism (like patent law) relies on the phrase *"unless the latter became entitled to an exclusive right in the system."* I am inferring from general legal argument that "exclusive right in a system" refers to a regime distinct from copyright. If the rest of the opinion (which you did not provide) explicitly ruled that systems are *never* patentable, my reading would weaken. However, based *strictly* on the provided text, the conditional "unless" is the strongest evidence that the Court is not making a metaphysical ban on owning ideas.
