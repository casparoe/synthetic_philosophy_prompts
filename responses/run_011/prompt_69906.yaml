  You cite a deficiency in practice. Your finding states that my fourteen-month abstention from alcohol, undertaken on strict medical advice following a liver scare, constitutes a lapse in continuous exercise. I maintained that this period refined my sensitivity by removing fatigue and clearing the senses of accumulated residue. You maintained that practice requires uninterrupted ingestion to maintain the mechanical facility of the tongue and that health concerns are irrelevant to the continuity of the record. You cite a deficiency in comparison. Your finding states that my expertise is confined to two French regions. I argued that deep knowledge of specific instances allows for universal judgment regarding balance and structure because the principles of harmony are constant. You argued that without calibration against the full range of production across all climates and grape varieties, no judgment can stand as a standard for the general public.

  You cite prejudice. Your finding states that I awarded a high score to a vintage produced by my spouse. I argued that the tasting was conducted blind and that my sentiment was unaffected by knowledge of the source. You argued that the relationship constitutes a structural bias that corrupts the sentiment regardless of the blind protocol because the affection exists prior to the glass. You cite a lack of good sense. Your finding states that when asked to justify a score, I stated only that the wine was delicious. I argued that the sentiment of approval is the ultimate terminus of criticism and requires no further translation into abstract rules. You argued that reason must be able to articulate the causes of the sentiment to verify its validity to those who lack the same sensitivity.

  I remind you of the incident at the Vintner's Cask last decade. I identified a fault in a batch declared sound by the cellar staff. I was vindicated when an old key on a leather thong was fished from the bottom of the vessel. This should stand as proof of delicacy, showing my palate could detect what others missed even when the majority declared the liquid sound. Your reply states that this detection is now inadmissible precisely because I was not accredited at the time. You state that accreditation can only be evidenced by the joint verdict of accredited judges. I pointed out that this makes your standard unappealable from outside the Institute because one must be on the list to validate the evidence that puts one on the list. Your reply states that the standard was never a rule to be applied but a list of people, and that the list is kept by the people already on it. I find this contemptible, yet I recognize it as the theory itself.

  You have now reclassified my dissent under the allowances for differences of humour and temperament. My preference for high-acid wines is diagnosed as a personal bias to be generously allowed for rather than as a counterexample to the standard. I found this flattering at first, as it suggested my views were merely a variation within the acceptable range of human feeling. I only afterward realized that the same diagnosis is available for any dissenter, so that no disagreement is structurally capable of counting against the consensus. If every objection is merely a quirk of temperament, the consensus becomes immune to error. I note that the founding cohort of the register was itself selected by a trade association's majority vote. I found this scandalous until I saw there was nothing else on offer. It seems the initial list was created by counting hands, not palates, which suggests the standard began as a democratic convenience rather than a philosophical truth.

  I do not argue that deliciousness is a quality sitting in the wine independently of anyone's tasting it. I know the merit exists only in the sentiment of the observer. I nearly wrote that the wine was objectively flawed in the cask incident, but I correct myself to say the fault was perceptible to a qualified organ. But if the observer is removed from the list, the sentiment vanishes from the record. I remain convinced that I possess the qualifications you seek. I have said nothing the committee has not already filed.

  Sincerely,
  Julian Vane
