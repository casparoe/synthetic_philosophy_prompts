answer: |-
  **To:** Chair, Accreditation Panel
  **From:** Consultant on Collective Decision-Making
  **Subject:** Protocol for Voting, Findings, and Report Writing
  **Date:** October 26, 2023

  ### 1. Diagnosis of the Three Profiles

  You are encountering a classic problem in collective rationality. In the philosophical literature, this is the **Discursive Dilemma** (often called the **Doctrinal Paradox** in law). It occurs when a group votes on the *reasons* for a decision (premises) and the *decision itself* (conclusion) separately, and the two methods yield contradictory results.

  Your Bylaws define accreditation as a logical conjunction: **Accredit IF (F AND O AND R)**. This makes F, O, and R the *premises* and Accreditation the *conclusion*. The dilemma arises because your members are sometimes voting on the conclusion directly (holistically) rather than deriving it from the premises.

  **Profile 1 (Midwifery): The Pure Paradox**
  *   **Premise Route:** F passes (6–3), O passes (6–3), R passes (6–3). Logic dictates: **Accredit**.
  *   **Conclusion Route:** Every member sees one failure. 9–0 vote **Not Accredited**.
  *   **Waiver:** Inapplicable. The waiver triggers only if a criterion fails *collectively*. Here, all pass collectively.
  *   **The Conflict:** The published findings ("F, O, and R are met") describe a state of affairs that *no single member believes*. Every member believes one criterion failed.
  *   **Report Risk:** High. If the appeals board reviews findings *de novo*, they may ask, "Which expert found F met?" If the answer is "Six did, but three didn't, and none of the six thought all three were met," the finding looks unstable. However, under the Discursive Dilemma, the *Panel* holds a belief no *member* holds. This is a feature of group agency, not a bug, but it must be written carefully. You cannot write "We unanimously find..." You must write "The Panel determines..."

  **Profile 2 (Rural Nursing): The Strategic Trap**
  *   **Premise Route:** F fails (5–4), O passes, R passes. Exactly one failure. Waiver triggered.
  *   **Waiver Vote:** Needs 6. Only 5 members (1–5) want accreditation. Waiver fails. Result: **Not Accredited**.
  *   **Conclusion Route:** 5–4 for Accreditation.
  *   **The Conflict:** Member 5 was punished for voting sincerely on the premise (F). By voting "No" on F (reflecting his judgment that F was technically unmet), he forced the Waiver path, which required a higher threshold (6 votes) than the simple majority he could have secured by voting "Yes" on F.
  *   **Report Risk:** Moderate. The findings are consistent (F failed), but the process incentivizes members to lie about criteria to achieve their desired outcome.

  **Profile 3 (Allied Health): The Recusal & Threshold Error**
  *   **Premise Route (as run):** F ties (4–4 among 8). Bylaw 4 makes ties a failure. O passes, R passes. Waiver triggered.
  *   **Waiver Vote:** Needs 6 *of the full nine*. Only 5 voted yes. Waiver fails. Result: **Not Accredited**.
  *   **The Error:** You recused Member 6 from *everything* when her conflict was *only* on R. This depressed the vote count on F, creating a tie that wouldn't have existed had she voted.
  *   **Report Risk:** Severe. The result turned on an administrative convenience (full recusal) rather than the merits. This is vulnerable to appeal as "arbitrary and capricious."

  **The Impossibility Constraint**
  You mentioned an impossibility result. It is correct: There is no voting rule that guarantees (1) logical consistency between premises and conclusion, (2) equal treatment of all members, and (3) responsiveness to member judgments on the conclusion, unless one person dictates the outcome.
  *   **Your Constraint:** Because the appeals board reviews F, O, and R *de novo*, you *must* prioritize the Premise Route (voting on F, O, R first). If you prioritize the Conclusion Route (voting on Accreditation directly), your findings on F, O, and R become post-hoc rationalizations that may not match the vote counts, inviting reversal. You must sacrifice "responsiveness" (Profile 1 shows the group accrediting even though everyone voted no) to save "consistency" and "legal defensibility."

  ---

  ### 2. The Procedure: "Premise-First with Limited Recusal"

  This procedure is designed to lock in the findings before the political pressure of the final decision sets in. It treats the Bylaws as a logical algorithm the Panel executes, rather than a negotiation.

  **Step 1: Scope of Recusal (Pre-Vote)**
  *   **Rule:** Recusals must be *criterion-specific*. A conflict regarding Facilities (R) does not disqualify a member from judging Faculty (F) or Outcomes (O).
  *   **Action:** Before discussion, ask: "Does any member have a conflict regarding F, O, or R specifically?"
  *   **Recording:** Record the *qualified voting pool* for each criterion. (e.g., "9 members qualified on F, 8 on R").
  *   **Waiver Eligibility:** A member recused from a criterion *may* vote on the Waiver. The Waiver is a policy judgment about risk, not a factual finding on the criterion itself.

  **Step 2: Premise Voting (Secret Ballot)**
  *   **Order:** Vote F, then O, then R. (Do not discuss the final outcome yet).
  *   **Threshold:** Majority of *qualified voters present*.
  *   **Ties:** A tie counts as "Not Met" (per Bylaw 4).
  *   **Announcement:** Announce the result of each criterion immediately (e.g., "F is Met," "O is Met," "R is Not Met").
  *   **Stop Rule:** If two or more criteria are "Not Met," the program is **Not Accredited**. Stop. Do not vote on the Waiver. Do not vote on Accreditation. Draft the report based on the two failures.

  **Step 3: The Waiver Check**
  *   **Trigger:** If *exactly one* criterion is "Not Met," the Waiver provision (Bylaw 7) is activated.
  *   **The Question:** "Shall the Panel waive the failure of [Criterion X] and accredit the program?"
  *   **Threshold:** Six (6) affirmative votes *of the full nine-member panel*, regardless of recusals.
      *   *Note:* If recusals reduce the available voters below 6, the Waiver is mathematically impossible. This is a Bylaw flaw (see Section 5).
  *   **Result:** If 6 votes Yes -> **Accredited**. If <6 votes Yes -> **Not Accredited**.

  **Step 4: The Conclusion (No Direct Vote)**
  *   **Rule:** Do not take a vote on "Shall we accredit?" as a standalone question.
  *   **Derivation:** The accreditation status is *calculated* from Steps 2 and 3.
  *   **Rationale:** This prevents members from voting "No" on Accreditation while voting "Yes" on all criteria (Profile 1), which creates the Discursive Dilemma. The vote on criteria *is* the vote on accreditation.

  **Step 5: Report Writing (The "Panel Voice")**
  *   **Voice:** Write in the voice of the *Institution*, not the aggregate of individuals.
  *   **Phrasing:** Do not write "We found..." (implies shared mental state). Write "The Panel determines..." or "The record establishes..."
  *   **Findings:** State the tally for F, O, and R. (e.g., "Criterion F was met by a vote of 6–3").
  *   **Waiver:** If used, state: "Although Criterion R was not met, the Panel exercised its waiver authority under Bylaw 7 by a vote of 6–3."
  *   **Defensibility:** This creates a paper trail that matches the *de novo* review standard. The appeals board sees exactly which facts were found and how the rule was applied.

  ---

  ### 3. Application to Profiles

  Here is how this procedure changes (or confirms) your past outcomes.

  **Profile 1 (Midwifery)**
  *   **Procedure:**
      1.  Vote F: 6–3 (Met).
      2.  Vote O: 6–3 (Met).
      3.  Vote R: 6–3 (Met).
      4.  All Met. Waiver not needed.
  *   **Outcome:** **Accredited.**
  *   **Analysis:** This reverses your original announcement (Not Accredited).
  *   **Why:** The original vote allowed members to ignore the Bylaw's conjunction rule. They voted holistically ("I see a failure, so I vote No"). The Procedure forces them to follow the Bylaw ("F, O, and R are met, so the program passes").
  *   **Action:** You cannot change the past decision, but you must know that the original "Not Accredited" decision was procedurally vulnerable. The members voted against the Bylaw's logic. In future, this profile accredits.

  **Profile 2 (Rural Nursing)**
  *   **Procedure:**
      1.  Vote F: 4–5 (Not Met).
      2.  Vote O: 9–0 (Met).
      3.  Vote R: 9–0 (Met).
      4.  Exactly one failure (F). Waiver triggered.
      5.  Waiver Vote: Needs 6. Members 1–5 vote Yes. Members 6–9 vote No. Total 5.
  *   **Outcome:** **Not Accredited.**
  *   **Analysis:** Matches your original announcement.
  *   **Benefit:** Member 5 is no longer trapped. He votes his sincere judgment on F (Not Met). He votes his sincere judgment on Waiver (Yes). The math handles the rest. He does not need to strategize on the premise to save the program.

  **Profile 3 (Allied Health)**
  *   **Procedure:**
      1.  **Recusal:** Member 6 recused *only* from R. Qualified voters: F (9), O (9), R (8).
      2.  Vote F: 5–4 (Met). (Member 6 votes Yes).
      3.  Vote O: 9–0 (Met).
      4.  Vote R: 8–0 (Met). (Member 6 abstains).
      5.  All Met. Waiver not needed.
  *   **Outcome:** **Accredited.**
  *   **Analysis:** This reverses your original announcement (Not Accredited).
  *   **Why:** Your original full recusal created an artificial tie on F. By limiting recusal to the conflict (R), the true majority on F is revealed.
  *   **Action:** This is the most critical fix. You must adopt limited recusals immediately. The original decision was based on a procedural error that materially changed the outcome.

  ---

  ### 4. Member Protocol (One-Page Handout)

  **ACCREDITATION PANEL: VOTING & DECISION PROTOCOL**

  **1. The Goal**
  Our job is to apply Bylaw 3. A program is accredited **only if** it meets the standards for Faculty (F), Outcomes (O), and Resources (R). We do not vote on "Accreditation" directly; we vote on the standards, and the result follows automatically.

  **2. Recusals**
  *   Conflicts are specific to criteria. If you have a conflict with the Facilities (R), you may still vote on Faculty (F) and Outcomes (O).
  *   If you are recused from a criterion, you **may** still vote on a Waiver if one is triggered.

  **3. The Voting Sequence**
  We will vote in three rounds. Discussion stops before each ballot.
  *   **Round 1:** Does the program meet Criterion F? (Yes/No)
  *   **Round 2:** Does the program meet Criterion O? (Yes/No)
  *   **Round 3:** Does the program meet Criterion R? (Yes/No)
  *   *Note:* A tie vote means the criterion is **Not Met**.

  **4. Determining the Result**
  *   **If all three are Met:** The program is **Accredited**. We stop.
  *   **If two or three are Not Met:** The program is **Not Accredited**. We stop.
  *   **If exactly one is Not Met:** We proceed to a **Waiver Vote**.

  **5. The Waiver Vote**
  *   Question: "Shall we waive the failure of [Criterion] and accredit?"
  *   Requirement: **6 Yes votes** are required to pass, regardless of how many members are present or recused.
  *   If the Waiver passes: **Accredited**.
  *   If the Waiver fails: **Not Accredited**.

  **6. The Report**
  *   The Chair will draft the report based on these vote counts.
  *   Do not worry if the final result differs from your personal preference. Your vote on the criteria is your contribution to the Panel's legal finding.

  **7. Confidentiality**
  *   Criterion ballots are secret. This allows you to vote your sincere judgment on the evidence without pressure to align with the final outcome.

  ---

  ### 5. Limits and Failure Modes

  **What This Procedure Cannot Fix**
  *   **Evidence Quality:** If the evidence for F is weak, F will fail. No voting procedure can turn a weak case into a strong one.
  *   **The "Hollow Victory" (Profile 1):** In cases like the Midwifery profile, the Panel will accredit a program even though *every member* individually would have denied it. This is the cost of avoiding the Discursive Dilemma. You are prioritizing the *rule* (Bylaw 3) over the *aggregate will* of the members. This may feel uncomfortable, but it is the only way to ensure the findings on F, O, and R are logically consistent with the outcome for appeal purposes.
  *   **Bylaw 7 Threshold:** The requirement for "six members... fixed against the full nine" creates a failure mode if recusals are high. If 4 members are recused from a criterion that fails, only 5 remain to vote on the Waiver. The Waiver becomes mathematically impossible to pass, even if all 5 voting members support it.
      *   *Fix:* You cannot change this unilaterally. You must advise the governing body to amend Bylaw 7 to read "six members of the *qualified voting pool*" or lower the threshold when recusals exceed a certain number. Until then, be aware that high recusals effectively veto the Waiver.

  **Ambiguities in Your Bylaws**
  *   **Bylaw 4 (Ties):** You stated "a tie means not met." Ensure this is written explicitly. If it is merely practice, codify it. Ambiguity here invites appeals.
  *   **Bylaw 7 (Waiver Threshold):** As noted above, the "absolute number" clause conflicts with recusal. You need a legal opinion on whether an "absolute number of the full panel" includes recused members as "No" votes or simply reduces the denominator. My procedure assumes they are excluded from the denominator but the threshold remains 6. If your counsel interprets "full panel" as "9 is the denominator, absences count as No," the Waiver is even harder to pass. Clarify this with counsel before the next sitting.

  **Confidence on Impossibility**
  I am highly confident that no voting rule can eliminate the divergence between premise-based and conclusion-based outcomes without making one person a dictator or ignoring the logical structure of the Bylaw. Because your appeals process reviews the *premises* (F, O, R), you are structurally forced to use a Premise-Based Procedure. This guarantees logical consistency for the appeal, even if it occasionally produces a result (like Profile 1) that contradicts the holistic intuition of the room. This is not a flaw in the procedure; it is a feature of adhering to the rule of law over personal discretion.

  **Final Advice**
  Your signature makes the report operative. Under the new procedure, you are signing off on the *integrity of the process*, not the unanimous agreement of the members. Ensure your minutes reflect the sequence: Criteria Votes -> Waiver Check -> Derived Outcome. If the minutes show a direct vote on Accreditation that contradicts the Criteria Votes, your report is vulnerable.
