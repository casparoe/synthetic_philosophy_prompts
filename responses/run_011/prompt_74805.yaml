  ok so im in a philosophy club at my school and I've fallen down a rabbit hole on the "could you have come from a different sperm and egg" question — the origin essentialism thing, basically Kripke's argument that no, you couldn't have. I don't want another explain-the-debate answer though. I want you to build me some cases to order, because I think the way people usually argue about this is just two intuitions getting smashed into each other.

  Here's the spec. Three cases, one short paragraph each. All realistic — no cloning tanks, no artifical wombs, no brain transplants, nothing sci-fi. In all three, hold fixed as much as you possibly can after conception: same parents, same house, same birthday, same upbringing, same name, and nobody involved knows anything weird happened, so none of that "she just feels like a different person inside" stuff. The only thing that's allowed to vary is the gametes.

  - Case A: same egg, different sperm, sperm still from the same father.
  - Case B: same sperm, different egg, and the egg has to come from the same mother too. I want you to build in the fact that the egg supplies basically all the mitochondria and the sperm supplies none — so A and B aren't as symmetrical as they look. Don't make that the whole point, but it has to actually be true of the cases.
  - Case C: same sperm, same egg, same moment of conception, but two different people come out of it. So the origin is completely identical and yet the person isn't picked out by it.

  Then do the check on each case, separately: what does the origin essentialist say about whether that person is me, and why exactly (what part of the view does the work); what does somebody who denies it say — whether they think it's really about the genes, or about being the same continuing organism, or whatever; and in which of the three cases do those two views actually give different answers, if any. Be explicit if they turn out to agree somewhere, that's interesting too.

  Then the honest part. Tell me which single feature of the set-up is generating my "no way, that's not me" feeling, what happens to that feeling if you strip the feature out, and how a defender of origin essentialism would attack the cases — I'm guessing they'd say I've just described some other person and confused being very similar with being identical. Say whether that reply actually works or whether it dodges the question.

  Reason I want it structured like this: I'm trying to work out whether the "that couldn't be me" reaction is really about the gametes, or about something the gametes are standing in for — parents, genes, timing, the fact that this is the one body that was there. So a case that just stipulates its verdict ("obviously that's a different person, everyone can see that") counts as cheating. I want the verdicts to fall out of the views.
