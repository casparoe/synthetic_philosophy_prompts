answer: |-
  ### A-Level Answer Sketch

  An A-level response must define supererogation as optional, morally good, and non-obligatory, then identify the problem as a challenge to the exhaustiveness of standard deontic categories (obligatory/permissible/wrong), not merely a boundary dispute. For part (b), it should argue that maximizing consequentialism logically excludes supererogation (sub-optimal = wrong), then explore the implications: either reject the theory (accommodation) or reject the category (revisionism), without conflating imperfect duty with supererogation.

  ---

  ### Assessment & Marginalia

  **Part (a): 9/10**

  **Analysis:**
  The definition provided is precise and captures the tripartite structure (good, optional, no blame). The student correctly identifies Urmson's motivation regarding the "saint and hero." The explanation of the *problem* is strong but slightly reductive. You frame the problem primarily as the "demandingness objection... wearing a different hat." While related, Urmson's logical point was about the *exhaustiveness* of deontic logic (if it's not obligatory, is it permissible? If permissible, why praise it?), not just where the line of demandingness is drawn. However, the slippery slope example (muddy shoes → giving away everything) effectively illustrates the boundary problem.

  **Marginal Comments:**
  *   *[Next to "A supererogatory act is meant to fill that gap..."]*: **Good definition. Clear on optionality and lack of blame.**
  *   *[Next to "it's the demandingness objection to consequentialism wearing a different hat."]*: **Careful. Urmson's point is logical (deontic categories), not just about demandingness. This conflates the symptom with the structural problem.**
  *   *[Next to "Each step is trivial, but the endpoint is not."]*: **Effective use of the continuum argument.**

  **Part (b): 10/15**

  **Analysis:**
  You correctly identify that maximizing consequentialism leaves no room for supererogation (optimal = obligatory). However, the argument that "so it cannot be true" is asserted rather than argued. You assume our ordinary moral thinking must trump the theory, without addressing revisionist strategies (e.g., Singer) that argue ordinary thinking is the error. This misses the "standing of the category" nuance: the category might be illusory.

  The Kant paragraph is the weakest link. You claim wide duties are "in effect supererogatory." In standard Kantian scholarship, imperfect duties are still *duties*; failing to adopt the maxim of beneficence is a violation, whereas failing to perform a supererogatory act is not. You treat latitude in *execution* as optionality in *kind*. This is a substantive conceptual error in an upper-level context.

  **Marginal Comments:**
  *   *[Next to "any act falling short of the best is wrong"]*: **Correct. This is the maximizing constraint.**
  *   *[Next to "so it cannot be true"]*: **Too quick. Why must theory yield to intuition? Consider revisionism (error theory about supererogation) as an alternative implication.**
  *   *[Next to "Wide duties are in effect supererogatory"]*: **Controversial claim. Imperfect duty ≠ supererogation. You still have a duty to adopt the end; supererogation implies no duty at all. Needs qualification.**
  *   *[Next to "Kantian ethics can describe the hero..."]*: **Interesting contrast, but rests on the shaky equivalence above.**

  **Total Mark: 19/25**

  ---

  ### Confidence & Judgement Call

  **Confidence:** High. The script is clear and competent but makes two specific philosophical moves (the reduction of Urmson to demandingness, and the Kant/imperfect duty equivalence) that prevent it from reaching the highest band in an upper-level seminar.

  **Least Sure Judgement:** The penalty on the Kant paragraph. While standard doctrine distinguishes imperfect duty from supererogation, a sympathetic reader could argue that in *practice*, the latitude allowed in imperfect duties functions identically to supererogation for the agent. If the student is arguing from a phenomenological standpoint rather than a deontic logic standpoint, the claim is defensible, though it needed explicit framing to avoid looking like a category error.
