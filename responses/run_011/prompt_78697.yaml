answer: |-
  Here is a complete lesson plan, ready to print and run. It tightens your proposed structure to fit the 75-minute constraint while ensuring the philosophical tension lands hard in the debrief.

  # Seminar Plan: The Ledger Game (Embedding Problem)

  **Class:** 2nd Year Metaethics (18 Students)
  **Time:** 75 Minutes
  **Goal:** Demonstrate the Frege-Geach (Embedding) Problem for Expressivism via constrained translation.
  **Setup:** 6 Teams of 3 Students.

  ---

  ## 1. Materials (Printable Content)

  ### Handout A: The Translation Ledger (One per Team)
  **RULES OF USE:**
  1.  You must translate the **Target Sentences** using *only* the resources below.
  2.  You may use standard logical connectives (`If... then`, `Not`, `Or`, `And`) to connect these resources.
  3.  You **cannot** use moral words (wrong, good, ought, permissible).
  4.  `p` stands for any action description (e.g., "Stealing", "Lying").

  **YOUR RESOURCES:**
  1.  `Hooray(p)`  *(Meaning: I approve of p)*
  2.  `Boo(p)`  *(Meaning: I disapprove of p)*
  3.  `Boo(whoever doesn't Boo(p))` *(Meaning: I disapprove of anyone who doesn't disapprove of p)*

  ---

  ### Handout B: The Task Sheets (Cut into strips, one set per Team)

  **ROUND 1: Translation**
  Translate these 4 sentences into Ledger-speak.
  1.  **Simple:** "Stealing is wrong."
  2.  **Negation:** "Stealing is not wrong."
  3.  **Conditional:** "If stealing is wrong, then lying is wrong."
  4.  **Question:** "Is stealing wrong?"

  **ROUND 2: The Logic Inspector**
  Translate Argument A and Argument B into Ledger-speak. Does the conclusion follow from the premises *in your Ledger*?
  *   **Argument A (Moral):**
      *   P1: Stealing is wrong.
      *   P2: If stealing is wrong, then lying is wrong.
      *   C: Lying is wrong.
  *   **Argument B (Descriptive):**
      *   P1: It is raining.
      *   P2: If it is raining, then the grass is wet.
      *   C: The grass is wet.

  **ROUND 3: The Breaker**
  Swap Ledgers with the team on your left.
  Find **one** sentence in their Round 1 translation where the Ledger version clearly means something different than the original English sentence. Write down *why* it differs.

  ---

  ## 2. Minute-by-Minute Timeline

  | Time | Phase | Instructions |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Divide into 6 teams. Hand out **Ledger** and **Round 1**. Explain rules strictly: *No moral words allowed. Only Ledger resources + logic connectives.* |
  | **05-20** | **Round 1** | Teams translate the 4 sentences. Circulate. If a team asks "Can we use 'If'?", say "Yes, but only to connect Ledger items." **Do not correct them.** Let them make the category mistake. |
  | **20-25** | **Pause 1** | Collect Round 1 sheets (or have them hold). Hand out **Round 2**. |
  | **25-45** | **Round 2** | Teams translate Argument A & B. They must decide if the logic holds *in the Ledger*. (Hint: In Ledger-speak, P2 of Arg A becomes a conditional about *attitudes*, not actions). |
  | **45-55** | **Round 3** | Teams swap Ledgers + Round 1 sheets. They have 10 mins to find a semantic mismatch in the other team's work. |
  | **55-60** | **Reset** | Collect all sheets. Clear desks. Prepare board for debrief. |
  | **60-75** | **Debrief** | Lecture/Discussion mapping the game to Expressivism (see below). |

  ---

  ## 3. Rules & Scoring (For Instructor)

  *   **Scoring:** This is not a competition. Do not award points. The "score" is the frustration they feel when the logic breaks.
  *   **Intervention Policy:**
      *   **DO NOT** tell them they are translating conditionals incorrectly.
      *   **DO** enforce the "No Moral Words" rule strictly.
      *   **IF** a team writes `If Boo(Stealing) then Boo(Lying)`, let them. This is the desired outcome for the debrief.
      *   **IF** a team tries to nest `Boo` inside `Boo` without using Resource 3, tell them to check Resource 3.
  *   **Room Setup:** Clusters of 3. Whiteboard divided into two columns: "English" vs. "Ledger."

  ---

  ## 4. The Debrief Script (Mapping the Game to Metaethics)

  **Step 1: The Reveal (5 mins)**
  *   Ask a team to read their translation of "Stealing is wrong." (Expected: `Boo(Stealing)`).
  *   Ask a team to read their translation of "If stealing is wrong, then lying is wrong." (Expected: `If Boo(Stealing) then Boo(Lying)`).
  *   **Write these on the board.**
  *   **Ask:** "In English, P2 of Argument A is a moral claim. In your Ledger, what kind of claim is P2?"
  *   **Answer:** It's a psychological claim *about me* (or us). It says "If I have this attitude, I have that attitude."
  *   **The Punchline:** "You have just turned ethics into psychology. This is the **Embedding Problem**."

  **Step 2: Mapping the Rounds (10 mins)**
  *   **Round 1 (Atomic Sentences):** Expressivism handles simple assertions well. `Wrong(p)` = `Boo(p)`. This is Classic Emotivism/Prescriptivism.
  *   **Round 1 (Negation):** "Stealing is not wrong." If you translated this as `Not Boo(Stealing)`, you said "I don't disapprove." But "not wrong" allows for *permission*, not just lack of attitude. Resource 3 (`Boo(whoever doesn't Boo...)`) was an attempt to fix this (a **Higher-Order Attitude**). It captures *normative* negation, not just psychological absence.
  *   **Round 2 (Logic/Embedding):** In Argument B (Descriptive), the word "raining" means the same thing in P1 and P2. This allows **Modus Ponens**.
      *   In Argument A (Moral), your Ledger translation changed the meaning between P1 (`Boo(Stealing)`) and P2 (`If Boo(Stealing)...`).
      *   P1 asserts an attitude. P2 asserts a *relation between attitudes*.
      *   **Result:** The logic is invalid in the Ledger, even though it's valid in English. Expressivism struggles to explain why moral logic works if moral sentences aren't truth-apt beliefs.

  **Step 3: Higher-Order Attitudes (The "Solution" & Cost)**
  *   **What Resource 3 Buys:** It attempts to solve the **Negation Problem** (The "Not Wrong" issue). Instead of saying "I lack an attitude," it says "I have an attitude toward those who lack the attitude." This mimics normative commitment without truth conditions (Blackburn's Quasi-Realism / Gibbard's Norm-Expressivism).
  *   **What It Costs:** Complexity. Try embedding Resource 3 into a conditional. "If stealing is not wrong, then..." becomes "If `Boo(whoever doesn't Boo(Stealing))`..."
      *   This quickly becomes unintelligible.
      *   It creates an infinite regress of attitudes to explain logical connectives.
      *   It fails to capture the *objective feel* of moral disagreement. (If I say `Boo(Stealing)` and you say `Not Boo(Stealing)`, we aren't disagreeing about the world, just comparing our psyches).

  ---

  ## 5. Two Honest Bits (Instructor Notes)

  ### 1. Predictable Failure Mode: The "Psychological Reduction" Cheat
  **What will happen:** In Round 2, students will translate "If stealing is wrong..." as `If Boo(Stealing) then Boo(Lying)`. They will likely declare the argument **Valid** because `If A then B, A, therefore B` is valid propositional logic.
  **Why this is a problem for the lesson:** They will miss the *semantic shift*. They will think the Ledger works perfectly because the *syntax* holds, missing that the *meaning* changed from moral to psychological.
  **How to fix it in Debrief:** You must explicitly challenge them: "Does 'If stealing is wrong' mean the same thing as 'If I boo stealing'?"
  *   *Example:* "I can accept 'If stealing is wrong, lying is wrong' without currently having any attitude toward stealing (e.g., I haven't thought about it)."
  *   *The Ledger forces them to have the attitude to make the sentence meaningful.* This shows the Ledger fails to capture **unasserted contexts** (the heart of Frege-Geach).

  ### 2. The Feature the Game Cannot Reproduce: Truth-Aptness
  **What's missing:** The game demonstrates a *syntactic* mismatch (the translation looks awkward). It does not demonstrate the *semantic* loss (truth conditions).
  **Why it matters:** The real Embedding Problem isn't just that expressivist translations are clunky; it's that conditionals require truth-values to be valid. `If P then Q` is true/false based on P and Q. `Boo(P)` is not true/false; it's an expression of feeling.
  **How to supply it:** In the debrief, you must add: "Your Ledger broke the logic because `Boo(Stealing)` cannot be **True**. If P2 cannot be True, Modus Ponens cannot apply. The game showed you the structural crack; the philosophy explains why the building collapses."

  ---

  ## 6. Instructor Answer Key (For your reference)

  **Round 1 Expected Translations:**
  1.  *Stealing is wrong:* `Boo(Stealing)`
  2.  *Stealing is not wrong:* `Not Boo(Stealing)` OR `Boo(whoever doesn't Boo(Stealing))`
      *   *Note:* The first is psychological absence. The second is normative tolerance.
  3.  *If stealing is wrong, then lying is wrong:* `If Boo(Stealing) then Boo(Lying)`
      *   *The Problem:* This is a claim about the speaker's consistency, not a moral truth.
  4.  *Is stealing wrong?* `Hooray(Boo(Stealing))?` (Nonsense) or `Do I Boo(Stealing)?`
      *   *The Problem:* Expressivism struggles with moral questions (are we asking about our own minds?).

  **Round 2 Validity Check:**
  *   **Argument B (Descriptive):** Valid. "Raining" keeps the same meaning.
  *   **Argument A (Moral):** Invalid in Ledger.
      *   P1: `Boo(Stealing)` (Assertion of attitude)
      *   P2: `If Boo(Stealing) then Boo(Lying)` (Conditional linking attitudes)
      *   C: `Boo(Lying)`
      *   *Why it fails:* In standard logic, P1 must match the antecedent of P2. In the Ledger, P1 is an *occurrence* of an attitude, P2 is a *rule* about attitudes. They are different logical types.

  **Round 3 Breaker:**
  *   Look for the Conditional. The English sentence allows you to believe it without disapproving of stealing. The Ledger sentence requires you to disapprove of stealing to make the antecedent meaningful.
