      *   *Correction on Q4:* Don't let the user off the hook on Expression vs. Copy. Schopenhauer explicitly rejects "expression of emotions" if it means particular emotions (sadness, joy). Music expresses the *essence* of emotion (the movement of will) without the particular cause. This passage supports that: Lyric has the "I" (particular); Music has the "Will" (universal). So Music is "Lyric universalized."

