answer: |-
  ### 1. The Exam Question

  **Scenario:**
  Forty independent schools compete for placements at elite universities that select primarily on ordinal rank (percentiles), not absolute scores. Facing student burnout, the schools sign a compact capping school hours and homework. Initially, all comply, but within two years, all defect. Verification is impossible; parents cannot see hidden hours. Compliance offers no visible advantage; defection offers hidden gain.

  In year three, a verification regime is introduced: third-party audits and published logs. Heads of school sincerely support this. Compliance becomes perfect; logs are immaculate. Yet, within a year, the competitive race resumes. Schools begin "suggesting" private tutors for off-campus work. Tutoring spend becomes the new margin of differentiation. The universities' selection criteria remain unchanged.

  **Question:**
  (a) Diagnose the failure of the verification regime. Why did the race return despite perfect compliance with the audits? Distinguish this from the failure of the initial non-binding compact. (15 marks)
  (b) Propose a structural fix available to the schools. Predict specifically why this fix would succeed where audits failed, or why it must fail. (10 marks)

  ***

  ### 2. Model Answer

  The initial compact failed because it was a classic cooperation problem without enforcement. Defection offered a private advantage (higher rankings) while the cost (student burnout) was shared collectively. Without verification, trust collapsed, and the equilibrium returned to maximum workload. This is a standard failure of voluntary restraint in a competitive market.

  The verification regime's failure is fundamentally different. It solved the cooperation problem but ignored the positional nature of the prize. The universities select based on ordinal rank—only a fixed percentage of applicants can win. When schools successfully capped school hours, they reduced the baseline effort for everyone equally. However, because the prize is relative, not absolute, a uniform reduction in school work did not reduce the incentive to compete; it merely shifted the competition to the next available margin. Private tutoring became the new vector for gaining comparative advantage. The audits successfully measured school hours, but they could not measure "advantage." As long as the selector (the university) rewards relative standing, competitors will invest resources until the marginal cost of effort equals the marginal benefit of ranking. Auditing one input simply displaces the effort to an un-auditable input.

  This is not a failure of enforcement; it is a failure of metric. The schools treated the symptom (school hours) rather than the disease (ordinal selection). The verification regime created a false sense of security because compliance was visible, but the underlying pressure remained intact. Parents, knowing the prize is fixed, rationally invested in tutors to ensure their child remained ahead of the new, lower baseline. The race did not return because schools cheated the audits; it returned because the audits were irrelevant to the actual competition.

  For a structural fix, the schools cannot solve this internally. Any attempt to audit tutors will simply push the competition further underground (e.g., innate talent coaching, genetic advantages, or bribery). The schools do not control the prize. Therefore, the only viable fix is collective action aimed at the universities. The schools must leverage their feeder status to demand a change in admissions criteria—specifically, moving from ordinal ranking to absolute thresholds or a lottery system among qualified candidates.

  If they attempt to fix this internally (e.g., banning tutors), the prediction is inevitable failure. Enforcement costs would become infinite as the definition of "unfair advantage" expands into every aspect of life. If they successfully pressure the universities to adopt absolute thresholds (e.g., anyone with 90%+ gets in), the race dampens significantly. Once the prize is no longer zero-sum, the incentive for marginal advantage disappears. However, if the universities refuse, the schools must admit the race is unstoppables. The correct prediction is that without changing the selector's criteria, any school-level fix will merely displace the competition again. The machine is not fed by lack of rules; it is fed by the scarcity of the prize.

  ***

  ### 3. Marking Scheme (25 Marks)

  **Criterion 1: Distinguishing the Two Failures (5 marks)**
  *   **5 marks:** Explicitly identifies Phase 1 as a cooperation/enforcement failure (free-riding) and Phase 2 as a displacement/positional failure (competition shifting margins).
  *   **3 marks:** Identifies both as "cheating" or "competition" without distinguishing the mechanism (enforcement vs. displacement).
  *   **0-1 marks:** Claims Phase 2 failed because schools "lied" about the logs or audits were "weak."
  *   **Wrong Turn:** Treating Phase 2 as simply "Prisoner's Dilemma Part 2." This misses the core prompt requirement.

  **Criterion 2: The Ordinal Prize Diagnosis (5 marks)**
  *   **5 marks:** Clearly articulates that the university selection is *relative/ordinal* (fixed number of winners), making uniform reduction in effort irrelevant to individual strategy.
  *   **3 marks:** Mentions "competition" or "pressure" but fails to link it to the *fixed nature of the prize* (zero-sum).
  *   **0-1 marks:** Argues the problem is "parental pressure" or "greedy schools" as independent variables.
  *   **Wrong Turn:** Blaming moral failure of parents/heads. The scenario states heads are sincere; marks are lost for ignoring this constraint.

  **Criterion 3: Metric vs. Reality (5 marks)**
  *   **5 marks:** Identifies that audits measured the *wrong variable* (school hours) rather than the *actual variable* (competitive advantage). Goodhart's Law logic without needing the name.
  *   **3 marks:** Says audits were "too narrow" but doesn't explain why narrowing doesn't stop the race.
  *   **0-1 marks:** Suggests "better audits" would have solved Phase 2.
  *   **Wrong Turn:** The "Leviathan" error. Assuming more enforcement solves positional competition. Deduct 3 marks if the student argues stricter audits on tutors would work.

  **Criterion 4: The Structural Fix (5 marks)**
  *   **5 marks:** Proposes changing the *University's* criteria (ordinal to absolute/lottery) or admits schools cannot fix it alone.
  *   **3 marks:** Proposes school-level fixes (ban tutors, cap spend) without acknowledging the displacement risk.
  *   **0-1 marks:** Vague appeals to "culture change" or "parents stopping."
  *   **Wrong Turn:** Internalizing the solution. The schools do not control the prize. Proposing a school-level ban on tutors is a B-level answer at best.

  **Criterion 5: Prediction of Outcome (5 marks)**
  *   **5 marks:** Predicts that internal fixes lead to infinite displacement (costs rise, race continues) and only external change (uni criteria) stops it.
  *   **3 marks:** Predicts internal fixes might work "if enforced strictly."
  *   **0-1 marks:** Optimistic prediction that culture will change naturally.
  *   **Wrong Turn:** Failure to follow the logic to its conclusion. If the diagnosis is positional, the prediction must be displacement unless the positionality is removed.

  **A/B Boundary:**
  *   **A (20-25 marks):** Must hit 5 marks on Criterion 2 (Ordinal Prize) AND 5 marks on Criterion 4 (External Fix). They must recognize the schools are trapped by the universities.
  *   **B (15-19 marks):** Correctly diagnoses Phase 2 as displacement (Criterion 3) but proposes an internal enforcement fix ( Criterion 4 drops to 3 marks). They see the trap but think you can audit your way out of it.
  *   **C (10-14 marks):** Treats both phases as standard enforcement issues. "They need stricter rules."

  ***

  ### Meta-Commentary for the Examiner

  **Committed Diagnosis:**
  I have built this scheme around the **Positional Goods/Displacement** diagnosis. The core argument is that enforcement solves *cooperation* (Phase 1) but not *competition* (Phase 2). When the prize is ordinal, efficiency gains (less burnout) are immediately consumed by competitive displacement (tutors). The only escape is changing the prize structure itself.

  **Alternative Valid Diagnosis:**
  A genuinely strong student might argue from **Signaling Theory**. They could argue that school hours never mattered for admissions, only *signaling commitment* mattered. The audits proved commitment via compliance, but tutors signal *wealth/commitment* better. To earn full credit on this alternative, they must explain why the *ordinal* nature forces the signal to escalate regardless of the medium. If they just say "parents want signals," that's a B. They must link signaling to the zero-sum prize.

  **Where I Might Be Wrong (The Uncertainty Flag):**
  The hardest part to grade will be **Criterion 4 (The Fix)**. A student might argue that schools *could* form a cartel to ban tutors and enforce it via expulsion of member schools. This is theoretically possible (a Leviathan of schools). I have marked this down in the scheme because the scenario implies the schools are independent and the universities hold the power. However, if a student argues convincingly that the schools have enough market power to force a tutor ban *and* explains why displacement wouldn't happen again (e.g., total information symmetry), they should be rewarded. My scheme penalizes "internal fixes" heavily; be wary of penalizing a sophisticated argument for a "School Leviathan" too harshly. The A/B boundary relies on them seeing that *audits* don't stop *races*, but a student might argue *total bans* are different than *audits*. Watch for that distinction. If they conflate "audit" with "ban," penalize. If they distinguish, listen closely.
