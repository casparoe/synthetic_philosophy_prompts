      *   *Core Diagnosis:* This isn't just a PD about cooperation; it's a *positional arms race* where the utility function is relative, not absolute. Constraining one input (school hours) without changing the selection criterion (ordinal ranking) simply displaces the competition to the next available margin (private tutoring). This is "Goodhart's Law" meets "Moloch" meets "Positional Goods."
      *   *The "Recitation" Trap:* Students will say "Phase 1 was PD, Phase 2 fixed PD, but then it became PD again." That's weak. The strong answer recognizes that *enforcement doesn't solve positional competition* if the prize remains scarce and ordinal.
