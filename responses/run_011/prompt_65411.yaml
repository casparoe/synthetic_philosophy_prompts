      *   *Does the threshold move solve it?* Only if you reject *Conjunction Closure* for belief or accept *Doxastic Inconsistency*. If Belief = Credence $> 0.9$, and I believe $P$ (0.95) and $Q$ (0.95), I might not believe $P \land Q$ (0.9025). If closure holds, the paradox returns.
      *   *Are they the "same" puzzle?* Structurally similar (aggregation of fallible beliefs leads to inconsistency), but the normative force differs. Lottery feels like you *shouldn't* believe the ticket loses. Preface feels like you *can* believe the claims despite knowing errors exist.
      *   *Current State of Play:*
          *   Some say Belief and Credence are distinct attitudes (Dualism).
          *   Some say Belief reduces to Credence (Reductive Probabilism).
