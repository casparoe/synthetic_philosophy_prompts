  1. **Inductive Limit:** Empirically verifying a universal absence requires examining every instance, which is impossible. This is a logical platitude about induction. It supports your uncle logically, but doesn't validate the specific psychological theory.

  2. **Frequentist Null:** A non-significant result merely fails to reject the null; it does not confirm it. This is a correct technical description of standard significance testing. It rescues the original finding by framing the replication as inconclusive rather than contradictory.

  3. **Point Null Hypothesis:** In continuous reality, an effect size is rarely *exactly* zero. This is genuinely contentious but often accepted in modelling. It cuts against the original finding if we assume all prior effects were noise.

  4. **Statistical Power:** The replication might lack sensitivity to detect a small, real effect. This is a practical concern, not a logical law. It rescues the original finding only if the charity's sample was underpowered.

  5. **Bayesian Evidence:** Bayes factors can quantify evidence *for* the null hypothesis relative to an alternative. This renders the slogan false within Bayesian inference. It cuts against the original finding if the data favour the null model.

  6. **Equivalence Testing:** One can test if an effect falls within a negligible range rather than exactly zero. This makes the slogan false for practical decision-making. It cuts against the original finding if the effect is deemed practically null.
