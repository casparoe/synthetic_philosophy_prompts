prompt: |-
  Not an academic, just someone who reads about the replication crisis on the bus. My uncle used to swear by one of those famous social psychology findings — the sort where a small tweak to a form changes how people behave — and last year a mate of mine who does data work for a housing charity tried redoing it with their own records, about 900 people, and got nothing at all. When I told my uncle, he said "you can't prove a negative" and that was that, conversation over.

  That phrase has been bugging me ever since because I cant work out what it's actually claiming. Could you split it into the different precise theses it might stand for — the ones about induction, the ones about point nulls and an effect of exactly zero, the ones about what a frequentist significance test can and can't do — and say for each whether it's a platitude, genuinely contentious, or just false? I want to know which of them, if any, would actually rescue the original finding, and which would if anything cut against it (my half-formed worry is that if you really can't prove a negative, then you also can't prove the negative he's leaning on, that the charity's sample was somehow special). And does the answer change if you're a Bayesian rather than a frequentist? I've come across equivalence testing and Bayes factors but have no idea whether they'd make the slogan true or just beside the point.

  A menu rather than an essay, please: at most six readings, no more than three sentences each, whole thing under 400 words. British English.
