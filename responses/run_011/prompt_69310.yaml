answer: |-
  The analogy holds instrumentally for regulatory offenses and strict-liability torts but collapses for core criminal wrongs, meaning desert retains independent work in determining which acts are purchasable licenses versus prohibited violations.

  ### Correspondence Table

  | Market Element | Price Theory Equivalent | Sanction Equivalent |
  | :--- | :--- | :--- |
  | **Buyer** | Consumer | Offender |
  | **Seller** | Vendor | State (monopoly on legitimate violence) |
  | **Good** | Product/Service | Liberty to commit the act (or inflict harm) |
  | **Demand Curve** | Willingness to pay at various prices | Propensity to offend at various sanction levels |
  | **Transaction Moment** | Point of sale/payment | Commission of the *actus reus* (triggering liability) |
  | **Alternative Uses** | Money spent on other goods | Resources spent on compliance or other activities |
  | **Revenue Use** | Profit/Public Goods | Enforcement costs/General treasury |

  ### Disanalogies: Absorbable vs. Critical

  **Absorbable Disanalogies (The Economist's Defense)**
  Your visitor can absorb these without damaging the core model because they are quantifiable variables within a rational choice framework.
  *   **Probability of Enforcement:** The visitor correctly notes that expected cost = price × probability. A rational agent discounts the sanction by the likelihood of capture, functioning exactly like a risk premium in insurance markets.
  *   **Income Scaling (Day Fines):** This is not a disanalogy but sophisticated pricing. If the goal is equal deterrence (equal marginal disutility), income-scaling is standard third-degree price discrimination. It confirms the model rather than refuting it.
  *   **Timing of Payment:** Prices are often paid ex post (credit cards, invoices). The delay between act and sanction is a friction cost, not a structural break, provided the discount rate is accounted for.

  **Critical Disanalogies (The Analogy Breaks)**
  These features import assumptions that contradict the normative structure of criminal law.
  *   **Moral Semantics (Neutrality vs. Condemnation):** A price signals scarcity or cost, not wrongness. Buying a luxury car does not imply moral failure; paying a speeding ticket often does. The visitor calls this an "expressive surcharge," but if the expression changes the *nature* of the act (as the day-care experiment suggests), it is not a surcharge—it is a different good. The day-care study shows norms crowding out prices; when you price a moral obligation, you reframe it as a market transaction, shifting the demand curve itself rather than moving along it.
  *   **Voluntariness and Consent:** Markets presuppose willing counterparties. In core crimes (assault, theft), the "seller" (the state) is not offering a license, and the "victim" is not consenting to the transaction. The price model implies the offender buys a *right* to act; criminal law asserts the offender violates a *boundary*.
  *   **Ex Ante Permission:** A price grants permission to consume upon payment. A criminal sanction threatens consequences for acting *without* permission. The visitor's model treats the sanction as a fee for service; the legal reality is a penalty for trespass.

  ### Does Desert Survive?
  Desert retains independent work because it determines the **category** of the act, not just the magnitude of the cost. If the price model were total, there would be no distinction between a tax on carbon and a penalty for murder, only a difference in magnitude. Desert explains why we refuse to set the "price" of murder at the efficient level (which might be very high, but still purchasable). Desert functions as a **lexical constraint**: it identifies acts that are not for sale at any price. The visitor's claim that desert is merely an "expressive surcharge" fails because the expression *constitutes* the prohibition. Without desert, the "efficient quantity" of theft is non-zero; with desert, the efficient quantity is zero, regardless of enforcement costs.

  ### The Line: Principled or Ad Hoc?
  The division between regulatory offenses and core wrongs is principled, best articulated by Calabresi and Melamed's distinction between **Liability Rules** and **Property Rules**.
  *   **Liability Rules (The Price Model):** Applies to *mala prohibita* (regulatory offenses, nuisance, some torts). Here, the act is permissible provided you pay the cost (internalize the externality). The visitor's analogy holds here.
  *   **Property Rules (The Prohibition Model):** Applies to *mala in se* (core crimes, rights violations). Here, the entitlement (e.g., bodily integrity) is protected by an injunction; you cannot take it even if you are willing to pay the estimated harm. You must bargain for consent ex ante.
  The visitor's error is treating all legal sanctions as Liability Rules. The line is not ad hoc; it tracks whether the underlying interest is alienable (marketable) or inalienable (rights-based).

  ### A Better Master Analogy
  If the price model is the wrong master analogy for core criminal law, the better one is **"Sanction as a Costly Signal of Condemnation."**
  *   **What it preserves:** It retains the incentive structure of the price model (actors still weigh costs and benefits) and acknowledges the resource costs of enforcement.
  *   **What it adds:** It captures the communicative function that the price model dismisses as a surcharge. In this model, the sanction is not a fee for a service rendered, but a costly mechanism to communicate societal censure. The "cost" is necessary to make the signal credible (cheap talk is ignored), but the *function* is boundary-maintenance, not revenue generation or efficient pricing. This explains why we punish impossible attempts (the signal is needed despite no harm) and why we reject efficient breach for core wrongs (some boundaries cannot be crossed even for a price).
