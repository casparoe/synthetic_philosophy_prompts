answer: |-
  Your suspicion is well-founded. The slogan "functions are selected effects" is a compression of a family of claims that vary significantly in their metaphysical commitment and restrictiveness. Your seminar leader appears to be deploying a particularly rigid version of the Etiological (Selected Effect) account, likely conflating the *origin* of a trait with its *maintenance*, and treating the *intent* of the selector as equivalent to the *effect* of the selection.

  Here is an analysis of the distinct theses the slogan might express, arranged from weakest (most permissive) to strongest (most restrictive).

  ### 1. The Explanatory Priority Thesis
  *   **Statement:** Selection histories provide the most robust *explanations* for why we ascribe functions, though other accounts (e.g., causal role) may apply in other contexts.
  *   **Status:** **Substantive but moderate.** It claims epistemic privilege for selection without claiming metaphysical exclusivity.
  *   **Commitments:** Commits you only to the view that evolutionary history is the best tool for distinguishing function from mere utility in biological contexts. Compatible with pluralism.
  *   **Ordinary Talk:** Almost all survives. You can still speak of the "function" of a heart in a physiology class (causal role) and in an evolution class (selected effect) without contradiction.
  *   **Ambiguities:**
      *   *Origin vs. Maintenance:* Irrelevant; this is a heuristic, not a definition.
      *   *Multiple Effects:* Permits multiple functional descriptions depending on the explanatory context.
      *   *Indispensable Non-Selected:* Allows that a trait might have a causal function even if not selected.
      *   *Artificial Selection:* Treated as an analogous but distinct explanatory framework.

  ### 2. The Historical Necessity Thesis
  *   **Statement:** A trait must have a history of selection to have a "proper function."
  *   **Status:** **Substantive and contentious.** This is the core negative claim of the Etiological account.
  *   **Commitments:** Commits you to denying functions to traits arising purely by drift, even if they are currently useful. It draws a sharp line between "function" and "beneficial effect."
  *   **Ordinary Talk:** Significantly reduces it. Any talk of function regarding spandrels, hitchhikers, or drift-fixed traits is ruled false or metaphorical.
  *   **Ambiguities:**
      *   *Origin vs. Maintenance:* Requires *some* selection history, but doesn't specify which episode matters.
      *   *Multiple Effects:* Allows multiple functions if multiple effects were historically selected.
      *   *Indispensable Non-Selected:* **Crucial:** If a trait is now indispensable but never selected (e.g., a drift trait that became essential due to environmental change), this thesis denies it has a function.
      *   *Malfunction:* Handled well (trait exists due to past selection for F, currently fails to do F).
      *   *Byproducts:* Byproducts lack function unless they were themselves selected.

  ### 3. The Maintenance Thesis (Standard Etiological View)
  *   **Statement:** A trait's function is the effect that explains its **current presence** (frequency) in the population via selection.
  *   **Status:** **Substantive.** This is the standard Millikan/Neander reading.
  *   **Commitments:** Commits you to the view that functions can change over time. If a trait arises by drift but is *maintained* by selection for a new effect, that new effect becomes its function.
  *   **Ordinary Talk:** Preserves most biological function talk, including exaptation.
  *   **Ambiguities:**
      *   *Origin vs. Maintenance:* **Explicitly favors Maintenance.** The "why it is there" refers to current frequency, not initial mutation.
      *   *Multiple Effects:* If multiple effects contribute to current retention, the trait has multiple functions.
      *   *Indispensable Non-Selected:* If the trait is indispensable *now* but not selected *now* (e.g., no variation exists to select upon), this view struggles. It requires a history of differential reproduction.
      *   *Artificial Selection:* Generally accepts lab selection as a valid selection history.

  ### 4. The Origin-Fixing Thesis (Strict Originalism)
  *   **Statement:** A trait's function is fixed by the effect selected for at the trait's **initial origin**.
  *   **Status:** **Highly Contentious / Often False.** This is a vulgarization of the Etiological view rarely held by experts, but common in introductory slogans.
  *   **Commitments:** Commits you to denying that exaptations acquire new functions. A trait recruited for a new job retains its old function (or has none if it arose by drift).
  *   **Ordinary Talk:** Severely damages it. Biologists routinely speak of the "function" of a co-opted structure (e.g., feathers for insulation vs. flight).
  *   **Ambiguities:**
      *   *Origin vs. Maintenance:* **Explicitly favors Origin.**
      *   *Multiple Effects:* Only the original selected effect counts.
      *   *Indispensable Non-Selected:* Denies function to indispensable traits if they weren't selected at origin.
      *   *Malfunction:* Rigid. A trait cannot malfunction relative to a new job it wasn't originally selected for.
      *   *Artificial Selection:* Depends on whether "origin" means the construct design or the lineage history.

  ### 5. The Agent-Neutrality Thesis
  *   **Statement:** The logic of selected effects applies identically to natural selection and artificial/designer selection.
  *   **Status:** **Substantive.** It generalizes the theory beyond biology proper.
  *   **Commitments:** Commits you to treating the graduate student's pipetting or the engineer's goal as equivalent to differential survival in the wild.
  *   **Ordinary Talk:** Preserves function talk in technology and synthetic biology.
  *   **Ambiguities:**
      *   *Origin vs. Maintenance:* In synthetic systems, "maintenance" is often continuous human intervention.
      *   *Multiple Effects:* If the designer intended X, but the system is kept because of Y, does Y become the function? (See Thesis 3 vs. 4).
      *   *Indispensable Non-Selected:* If the system depends on Y, but the designer only selected for X, does Y have a function?

  ---

  ### Analysis of Your Seminar Dismissals

  Your seminar leader is likely conflating **Thesis 2 (Historical Necessity)**, **Thesis 4 (Origin-Fixing)**, and a specific version of **Thesis 5 (Agent-Neutrality)** that privileges *designer intent* over *actual selection history*.

  #### 1. The Classmate's Case (Drift/Exaptation)
  *   **The Dismissal:** "If it wasn't selected for, it isn't a function, full stop."
  *   **The Thesis Used:** **Thesis 2 (Historical Necessity)** combined with **Thesis 4 (Origin-Fixing)**.
  *   **Why it's problematic:** Even on the standard Etiological account (Thesis 3), if a trait arises by drift but is *subsequently* selected for a specific effect that explains its current prevalence, it acquires that function. The leader is ignoring the "maintenance" clause of the standard view.
  *   **Live Questions:**
      *   Does the selection need to be *recent* to explain current presence, or is ancient selection sufficient?
      *   If a trait is fixed (no variation) and thus no longer under selection, does it retain its function? (The "Current Useless Trait" problem).

  #### 2. Your Case (Synthetic Biology)
  *   **The Dismissal:** "Selection did the selecting."
  *   **The Thesis Used:** **Thesis 5 (Agent-Neutrality)** interpreted through **Thesis 4 (Origin-Fixing)**. The leader is equating the *designer's intent* (selection marker) with the *selected effect*, ignoring the *actual causal history* of the strain in the chemostat.
  *   **Why it's problematic:** In your chemostat, the strain persists *because* it degrades the contaminant. That effect explains the trait's presence in that specific population *now*. Under the Standard Etiological View (Thesis 3), the degradation *is* a function, regardless of the original design intent. The leader is treating "Selected Effect" as "Intended Effect," which collapses the Etiological account back into a design stance.
  *   **Live Questions:**
      *   **The "Switch" Problem:** At what point does a side effect (degradation) become a selected effect? Is it after 10 generations of dependence? 100?
      *   **Intentionality:** Does the *awareness* of the selector matter? If the grad student didn't know the gene degraded the contaminant, but kept the strain because it grew, is it a function? (Standard SE says yes; Leader implies no).
      *   **Dual Functions:** Can the gene have *two* functions? One from the original design (resistance) and one from current maintenance (degradation)? Thesis 3 allows this; Thesis 4 denies it.

  ### Summary for Seminar
  If you bring this list, focus on the distinction between **Thesis 3 (Maintenance)** and **Thesis 4 (Origin-Fixing)**.
  *   Point out that the standard Etiological account (Millikan/Neander) defines function as the effect explaining the trait's **current presence**, not just its origin.
  *   Ask the leader: "When you say 'selected effect,' do you mean the effect that explains why the trait *arose*, or the effect that explains why it *persists*?"
  *   If they say "arose," they are holding the Origin-Fixing view (Thesis 4), which cannot account for exaptation.
  *   If they say "persists," then your synthetic strains *do* have the new functions, because that is what explains their persistence in the chemostat.
  *   Finally, ask whether "selection" refers to the **selector's intent** or the **differential retention** of the trait. In synthetic biology, these can come apart. The Etiological account relies on differential retention, not intent.

  This forces the leader to unpack the slogan rather than using it as a shield.
