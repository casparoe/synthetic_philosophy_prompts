answer: |-
  This is a sharp reconstruction of a genuine tension in contract law. You have correctly identified the fault lines between property rules, liability rules, and personal liberty. However, your hypothesis about the "alienability of exclusivity" is a theoretical *explanation* of the outcomes, not the doctrinal commitment itself. Specialists in contract theory and labor law generally view the current regime not as a coherent philosophical system, but as a historical layering of equitable pragmatism, liberal individualism, and economic efficiency.

  Here is the strict reconstruction you asked for, separating settled law from theoretical interpretation.

  ### 1. Legal Accuracy Check
  Before reconstructing the theory, three corrections on the black-letter law are necessary to ensure the foundation is solid.

  *   **Non-Competes:** Your premise that "most states will enforce a reasonable non-compete" is rapidly becoming false. While historically accurate, the FTC issued a final rule in 2024 to ban most non-competes nationally (currently litigated), and states like California, Minnesota, and others have already banned them. The doctrinal trend is moving toward treating non-competes as presumptively void, not presumptively valid.
  *   **Negative Injunctions (*Lumley v. Wagner*):** You are correct that courts enjoin working for rivals. However, you understated the limitation. Courts will *not* issue a negative injunction if its practical effect is to force the defendant to work for the plaintiff (e.g., if the defendant has no other means of livelihood or the skill is so specialized that the injunction amounts to starvation or exile). The doctrine explicitly denies that it is enforcing exclusivity as property; it claims merely to prevent a breach of a negative covenant, provided it doesn't coerce positive performance.
  *   **13th Amendment:** The 13th Amendment prohibits state-imposed involuntary servitude. It does not directly govern private contract disputes. However, courts (citing *Bailey v. Alabama*) hold that specific performance of personal service contracts violates the *spirit* and public policy derived from the Amendment. It is a constitutional shadow over common law, not a direct statutory bar in civil suits.

  ### 2. The Underlying Theory: Liberal-Pragmatist Compromise
  If we strip away the "exclusivity" hypothesis for a moment, what does the doctrine actually presuppose? It is not committed to a single theory of self-ownership. It is committed to a **distinction between the Will and the Act.**

  The doctrine presupposes that:
  1.  **The Will is Inalienable:** You cannot transfer your capacity to choose. A contract that attempts to transfer the *source* of action (the will) is void (slavery).
  2.  **The Act is Alienable (conditionally):** You can promise to perform an act. If you break that promise, you owe compensation (damages).
  3.  **The Body is Sovereign:** The state will not use its coercive power (contempt of court, sheriffs) to physically move your body or direct your mind in real-time.

  This is why specific performance is denied. It is not because labor is fungible (it often isn't; a star surgeon is unique). It is because enforcing it requires ongoing supervision of the *will*.

  **Where your "Exclusivity" hypothesis fits:**
  You argue the law treats "future abstention" as property. Specialists would say this is a *consequence* of the doctrine, not its *commitment*. The law enforces negative covenants (non-competes/injunctions) not because it views your abstention as the employer's property, but because it views the *promise not to act* as less intrusive on sovereignty than the *promise to act*.
  *   **Consensus View:** The distinction is **Positive vs. Negative Covenants**, not **Labor vs. Exclusivity**.
  *   **Your View:** The distinction is **Activity vs. Abstention as Property**.

  Your reading is theoretically coherent, but most contract scholars would say it attributes more philosophical coherence to the doctrine than exists. The doctrine is often described as "muddling through" to avoid slavery while maintaining market order.

  ### 3. Underdetermination: Rival Views that Fit the Doctrine
  The current practice is underdetermined. Four rival theoretical frameworks can explain the current asymmetry equally well. This is where the "live disputes" lie.

  *   **Law & Economics (Efficiency):**
      *   *Rationale:* Specific performance is inefficient due to high monitoring costs (supervision). Damages are cheaper. Negative injunctions are efficient because they are binary (did they work for the rival? Yes/No) and require less monitoring.
      *   *Fit:* Perfect. This view sees no moral difference between labor and wheat, only transaction cost differences.
  *   **Libertarian Self-Ownership:**
      *   *Rationale:* I own myself. I can rent my services, but I cannot sell myself irrevocably (that would end my status as an owner). Negative injunctions are permissible because they restrict my use of property (labor) I have already contracted away, but I retain the residual right to quit (paying damages).
      *   *Fit:* Strong, but struggles with non-competes that limit future earning power without compensation.
  *   **Kantian Human Dignity:**
      *   *Rationale:* Persons are ends, not means. Coercing performance treats the person as a tool. Damages respect autonomy by allowing breach and restitution.
      *   *Fit:* Strong on specific performance, weak on non-competes (which treat the person's future choices as constrained by past promises).
  *   **Marxian/Critical (Your Hypothesis):**
      *   *Rationale:* The law masks exploitation by distinguishing "labor" (which can't be coerced) from "labor-power" (which can be sold). The negative injunction reveals the truth: the capitalist buys the right to exclude others from your capacity, effectively owning you without the burden of keeping you alive during idleness.
      *   *Fit:* Explanatory of *effects*, but not of *doctrinal intent*. No judge justifies a ruling using this framework.

  **Status Check:** Among specialists, the **Efficiency** and **Liberty/Autonomy** explanations are the dominant competing accounts. The **Marxian/Exclusivity** reading is a critical external critique, not an internal doctrinal justification. If you present your hypothesis as "what the law is committed to," a contracts professor would correct you: the law is committed to avoiding involuntary servitude; the *effect* is the alienability of exclusivity.

  ### 4. Concrete Doctrinal Swaps
  To test the theory, we look at what would change if we swapped the underlying commitment.

  **(a) Full Commodification of Labor (Labor = Wheat)**
  If the law truly viewed labor as a fungible commodity like wheat or land:
  *   **Specific Performance:** Courts would order employees back to work. If you quit, a sheriff would escort you to the desk.
  *   **Criminal Penalties:** Breach of contract could be criminalized (as it was in some jurisdictions pre-13th Amendment interpretations).
  *   **No Mitigation:** Employers wouldn't have to try to replace you. They could hold you to the term regardless of efficiency.
  *   **Bankruptcy:** Personal bankruptcy would not discharge labor debts. You would work until the debt is paid.
  *   **Current Status:** This is explicitly rejected. The doctrine is *not* compatible with full commodification.

  **(b) Thoroughgoing Inalienabilism (Labor = Kidney/Vote)**
  If the law viewed labor power as fundamentally inseparable from the person (like a kidney):
  *   **Void Contracts:** Employment contracts for fixed terms would be void *ab initio*. Only at-will arrangements (revocable at any moment without penalty) would be legal.
  *   **No Damages:** You could not sue for breach of an employment contract. Quitting would carry no financial penalty.
  *   **No Non-Competes:** Any restriction on future labor would be void as an restraint on alienation of the self.
  *   **Current Status:** The law rejects this too. It allows you to be sued for damages, which implies you *did* alienate something (a claim on your future earnings).

  **The Actual Middle Ground:** The law allows you to alienate the *economic value* of your labor (via damages) but not the *physical/volitional control* of your labor (via specific performance).

  ### 5. Where the Practice is Underdetermined (The Live Disputes)
  There are specific areas where the doctrine has not decided between your "Exclusivity" view and the standard "Autonomy" view.

  1.  **Garden Leave:** Some jurisdictions allow employers to pay you to stay home (garden leave) rather than enforcing a non-compete. This supports the "Exclusivity" view (they are buying your abstention). Others reject this if it's a restraint of trade.
  2.  **Inevitable Disclosure Doctrine:** Courts sometimes enjoin you from working for a rival not because you promised not to, but because you *inevitably* will use trade secrets. This edges closer to treating your mind/capacity as the employer's property. This is highly contested and limited in many states.
  3.  **Specific Performance of Non-Competes:** When a court enjoins you from working for a rival, are they enforcing a promise or protecting property? If the former, damages should suffice. If the latter, injunctions are right. The doctrine waffles here, calling it "irreparable harm" (property logic) while citing "personal liberty" (autonomy logic).

  ### 6. Summary of Consensus vs. Contention
  *   **Settled:** Specific performance of personal service is unavailable. 13th Amendment principles bar criminal penalties for breach. Negative injunctions are allowed but limited by the "no effective coercion" rule.
  *   **Contested:** *Why* specific performance is barred. Is it supervision costs (Efficiency) or bodily autonomy (Liberty)?
  *   **Contested:** The enforceability of non-competes. This is the biggest live wire in labor law right now. The shift toward banning them suggests the system is moving away from your "alienability of exclusivity" model toward a "labor inalienability" model.
  *   **Your Hypothesis:** The idea that the law is committed to the "alienability of exclusivity" is **not consensus**. It is a sophisticated critical reconstruction. Most practitioners and scholars would say the law is committed to **preventing involuntary servitude while allowing market exchange**, and the "exclusivity" outcome is a side effect of enforcing negative covenants, not the primary goal.

  **Verdict:** Your hypothesis is theoretically robust and explains the *outcomes* better than the official "supervision costs" story (since courts enforce non-competes they can't supervise either). However, it misidentifies the *commitment*. The law is not committed to making exclusivity alienable; it is committed to keeping positive coercion off the table, and it tolerates exclusivity only insofar as it doesn't functionally replicate positive coercion. The moment a negative injunction starves the worker into returning, the doctrine strikes it down. That limit proves the commitment is to **autonomy**, not **exclusivity**.
