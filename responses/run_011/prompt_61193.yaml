answer: |-
  **Plan of Satirical Targets**

  *   **The Three Boxes:** Targets the conflation of *variable implementation* (same mechanism, different stuff) with genuine *multiple realizability* (different mechanisms), critiquing the sloppy usage of MR as a catch-all (cf. Shapiro/Polger).
  *   **Grain Mismatch Denial:** Dramatizes the objection that MR claims often compare coarse-grained functional descriptions against fine-grained physical descriptions, rendering the comparison invalid (the "level mismatch" problem).
  *   **The Highway Grant:** Satirizes the triviality worry in functionalism/computationalism: if causal organization is all that matters, mapping constraints become so loose that any open system realizes any automaton (Putnam/Searle worries).
  *   **The Stoic Applicant:** Addresses the normativity of functional roles and population relativity: if the output doesn't match the folk theory, is the role filled? Depends on which population's theory defines the role (Lewis).
  *   **The Lookup Table:** Enacts Block's "Blockhead" argument: a system can satisfy functional input-output relations via brute lookup without possessing internal states or understanding.
  *   **The Unfunded Annex:** Highlights the Explanatory Gap/Hard Problem: functional certification guarantees structure, not phenomenology (qualia/what-it's-like-ness).

  ***

  **DEPARTMENT OF COGNITIVE ADJUDICATION**
  **BUREAU OF REALIZATION CLAIMS**
  **Case File: MABI-2024-X**
  **Predicate:** *Mild Annoyance at Being Interrupted*

  **NOTICE TO APPLICANTS**
  Pursuant to the Functional Integrity Act, all entities seeking certification for the psychological predicate *Mild Annoyance at Being Interrupted* (MABI) must submit Form BRC-704. Applicants must certify the realization relation by ticking exactly one box:

  *   **[ ] Box A:** Same property, different materials, *same* underlying mechanism (Variable Implementation).
  *   **[ ] Box B:** Same property, genuinely *different* mechanisms producing equivalent causal profiles (Classic Multiple Realizability).
  *   **[ ] Box C:** Full medium-independence, where inputs, outputs, and internal states are realized differently (Radical Medium Independence).

  *Warning: Ticking Box B or C requires proof that physical differences are relevant to the functional capacity. Cosmetic physical differences (e.g., waiter's corkscrew vs. winged corkscrew) constitute fraud under Box A.*

  **ADJUDICATED APPLICATIONS**

  **Case #8920 (Applicant: Premium Waitstaff Union)**
  *Disposition: Denied.*
  Applicant claimed Box B (Different Mechanisms) for MABI during service delays. Evidence submitted consisted of neurotypical humans versus humans with higher cortisol baselines. The Bureau finds this to be a Box A scenario. Variance in neurochemistry does not constitute a difference in mechanism where the computational topology remains identical. Applicant attempted to argue that "feeling it more" counts as a different realization. The Bureau reminds applicants that intensity is a parameter, not a mechanism. Resubmit under Box A or cease claiming MR status for standard biological variance.

  **Case #8921 (Applicant: Silicon-Valley Chatbot v.4)**
  *Disposition: Denied (Grain Mismatch).*
  Applicant claimed Box B, submitting a coarse-grained functional description of "interruption handling" alongside a fine-grained microphysical description of server states. The Bureau cannot adjudicate realizability claims where the psychological description is abstracted to the point of ambiguity while the physical description is granular to the transistor. You have proved sameness of state with a blurry map and difference of state with a microscope. This is not evidence of multiple realizability; it is evidence of category error. Align granularities and resubmit.

  **Case #8922 (Applicant: Interstate Highway System)**
  *Disposition: Granted.*
  Applicant demonstrated a causal organization isomorphic to the MABI functional profile: traffic congestion (input) leads to rerouting signals (output) via centralized control nodes (internal state). Under current Bureau criteria, any system maintaining the correct causal relations qualifies.
  *Clerk's Memo:* Be advised, this precedent implies that under a sufficiently loose mapping, every open system realizes every abstract automaton. Preliminary audits suggest the office copier realizes *Grief* during paper jams. We are not equipped to litigate the mental lives of toner cartridges. Proceed with certification.

  **Case #8923 (Applicant: Stoic Drone Collective)**
  *Disposition: Pending (Population Relativity Issue).*
  Applicant fills the pain-role for "interruption" but exhibits intense focus rather than wincing or avoidance behavior. Committee is tangled on whether the functional role is defined by the applicant's internal norms or the assessing population's folk theory. If the applicant is not a member of the population whose folk theory defines "annoyance," can they realize the state? We are currently soliciting briefs on whether the Drone Collective counts as a "population" for folk-psychological indexing. Do not operate heavy machinery until resolved.

  **Case #8924 (Applicant: Astronomical Lookup Table)**
  *Disposition: Denied (No Internal States Found).*
  Applicant is a pre-recorded lookup table containing every possible input-output sequence for MABI. Bureau inspectors attempted to locate the state of "annoyance" within the system. Inspection team decomposed the system into subsystems to locate the functional node. Subsystems were decomposed into sub-subsystems. Inspection log ends at page 400 with the note: "Still just tables inside tables. No one home." Functional profile is satisfied, but the Bureau requires a mechanism, not a list. Block precedent applies.

  **SIDEBAR: APPEALS AND QUALIA ANNEX**

  Appeals regarding functional certification must be filed within 30 days. Note that certification of a functional profile is certification of a functional profile *only*.

  All inquiries regarding *what-it-is-like-ness*, phenomenal character, or subjective experience must be directed to the **Annex for Phenomenal Claims**. Please be aware that the Annex is permanently unfunded. Forms for Qualia Verification (QV-1) are out of stock indefinitely. The Bureau maintains no position on whether certified systems actually *feel* mild annoyance. We certify the role, not the light. Do not ask the inspectors if the copier is suffering. They are instructed not to answer.
