answer: |-
  I reject **Step 1**.

  **The Step:** "All the weight of the objection comes from one claim: a benefit can justify a harm only if there's a single subject in whom both land..."

  **Why I reject it:**
  Your roommate has smuggled utilitarianism into the premise of the objection itself. Step 1 frames the Rawls/Nozick complaint as a *constraint on aggregation* ("You can only sum benefits/harms within this boundary"). It treats the "separateness of persons" as a technical limitation on where the utilitarian calculus is permitted to operate.

  That is not what Rawls or Nozick are arguing. They are not arguing that the utilitarian calculus is *correct* but *misapplied* across persons. They are arguing that the calculus itself is the wrong model for justice.

  For Rawls, the distinction between persons is not a metaphysical finding about where "subjects" begin and end; it is a **moral postulate**. Citizens are distinct sources of claims. To say utilitarianism ignores the distinction between persons is to say it treats society as a single agent maximizing its own experience, which violates the basic liberal premise that individuals are ends in themselves, not resources for a social total.

  By accepting Step 1, you concede that the *only* reason we don't sacrifice A for B is because they are different "subjects." Your roommate then correctly points out (via Parfit) that "subjecthood" is leaky. If the *only* barrier is metaphysical continuity, then Parfit wins, and prudence collapses into exploitation.

  But the barrier isn't metaphysical continuity. It's **moral inviolability**.

  **The Cost:**
  Rejecting Step 1 costs the objector the easy metaphysical high ground. You can no longer say, "I am one person, so I can sacrifice for myself, but you are another, so I can't sacrifice you." You have to say, "I have rights that forbid you from using me, regardless of whether I am metaphysically continuous with my future self or with you."

  This forces you to defend a deontological constraint (rights/dignity) that does not rely on the "single subject" criterion. You have to explain why *moral* boundaries hold even if *metaphysical* boundaries fade. Rawls does this by grounding the distinction in "moral personality" (the capacity for a conception of the good and a sense of justice), which is binary and political, not psychological and gradual. Nozick does it via self-ownership.

  If you reject Step 1, you admit that the "separateness of persons" objection is not a internal correction to utilitarianism (fixing the domain of aggregation); it is an external rejection of its structure.

  **What this means for your roommate's argument:**
  If Step 1 is false, Step 2 ("So what's doing the work isn't the boundary between persons at all") is a non-sequitur. The boundary between persons *is* what's doing the work, precisely because it is a moral boundary stipulated by the theory of justice, not a metaphysical discovery about psychological continuity.

  This also dissolves the "absurdity" in Step 5 and 6. The reason prudence is permissible and exploitation is not has nothing to do with whether Future-You is the "same subject." It has to do with **authority**. You have authority over your own life (prudential rationality); you do not have authority over another's life (moral rights). Even if Future-You is a stranger, Present-You is still the only agent with the standing to make decisions for that future life. No one else has that standing. The reductionist picture might make prudence *less rational* (Parfit's point), but it doesn't give *others* the right to intervene.

  **Confidence:**
  **90%.** I am confident because this is the standard Rawlsian defense (specifically from *Political Liberalism*). Rawls explicitly distances his theory from metaphysical debates about personal identity for this exact reason. Your roommate's argument is a powerful *utilitarian* counter-attack (often associated with Harsanyi or Singer), but it only works if you force Rawls to play on utilitarian terrain (Step 1). Rawls refuses that terrain.

  **Is your framing broken?**
  No. The framing is sharp. You correctly identified that the roommate's argument turns on the metaphysics of the self (Step 3) and the implications for prudence (Step 5). But you were right to feel that Step 1 was doing too much heavy lifting. It turns a moral veto into a bookkeeping rule. Your roommate didn't wreck his own case; he wrecked Rawls's case by redefining it. If you want to save Rawls, you have to reject the definition.
