      *   *Key Distinction:* It's not just size; it's *why* the size is there. In beasts, large brain = too much sludge. In humans, large brain = radiator for a high-performance engine.
      *   *Blunt Check:* It is *not* a contradiction in Aristotle's system. He anticipates this objection. If the translation makes it look like a flat contradiction, the translation might be clunky, or the user is missing the "exception" clause Aristotle builds in.

  5.  **Address Question 3: Moral Standing:**
