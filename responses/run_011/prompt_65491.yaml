answer: |-
  You have already done the hardest work: you noticed that your verdicts aren't tracking "truth" in a binary sense, but rather the *relationship between a narrative and its evidence*. Your discomfort stems from trying to force a two-dimensional problem (Event Reality + Narrative Fidelity) onto a one-dimensional axis (History vs. Legend).

  However, to answer your request for a governing principle that explains your current calls (mostly), I propose the following rule.

  ### The Principle: The Definitional Core Test

  A semi-legendary episode is **History** if independent evidence anchors the *Definitional Core* of the tradition. It is **Legend** if independent evidence anchors only a *Generic Substrate*, or nothing at all. It is **History-ish** (or "Bare History") if independent evidence anchors the *Agent's Existence* but not their *Defining Actions*.

  **Clause 1: Identify the Definitional Core.**
  What is the specific claim that makes this story *itself* and not a generic placeholder?
  *   *Trojan War:* A conflict between Achaeans and Trojans at Ilios.
  *   *Exodus:* A mass departure of Israelites from Egypt led by Moses.
  *   *Romulus:* The founding of Rome by a specific man named Romulus.
  *   *Jesus:* The existence of a specific preacher/crucifixion victim in 1st-century Judea.

  **Clause 2: Identify the Independent Anchor.**
  Evidence that does not derive from the tradition itself (Archaeology, Contemporary External Texts).
  *   *Trojan War:* Hittite texts (Wilusa/Alaksandu) + Burn Layer at Hisarlik.
  *   *Exodus:* Egyptian records of Semitic laborers (Generic Substrate).
  *   *Romulus:* Palatine Wall (Generic Substrate).
  *   *Jesus:* Josephus/Tacitus references (Agent Existence).

  **Clause 3: The Matching Rule.**
  *   If the Anchor validates the **Core** → **History**. (Troy: War at Ilios is anchored).
  *   If the Anchor validates only the **Substrate** → **Legend**. (Romulus: Wall exists, name doesn't. Exodus: Semites exist, Mass Departure doesn't).
  *   If the Anchor validates **Agent Existence** only → **History (Bare)**. (Jesus: Man exists, miracles/teachings unanchored).
  *   If there is **No Anchor** → **Legend**. (Arthur, Tell, Robin Hood).

  ---

  ### The Kernel Size Problem

  You asked: *At what point does shrinking the kernel stop being a claim about the Trojan War and become a claim about something else?*

  **The Solution: Nominal Continuity.**
  The threshold is not archaeological mass; it is linguistic. Does the proper name still apply to the shrunken remnant?
  *   **Troy:** If you strip the gods and Helen, you are left with "A war at Ilios." We still call that "The Trojan War." The name sticks. **Verdict: History.**
  *   **Exodus:** If you strip the miracles and the 600,000, you are left with "Some Semites left Egypt." We do *not* call that "The Exodus." The name refers to the theological event, not the demographic trickle. The name breaks. **Verdict: Legend.**
  *   **Romulus:** If you strip the twins and the she-wolf, you are left with "An eighth-century settlement." We do not call that "Romulus." The name refers to the founder, not the dirt. The name breaks. **Verdict: Legend.**

  This removes the arbitrariness. You aren't deciding how much evidence is "enough"; you are deciding if the label survives the reduction.

  ---

  ### The Sacrifice

  To make this rule watertight, you must sacrifice one call. I recommend you give up **Jesus (Bare Existence = History).**

  **Why:** Your rule for Arthur is: *Gildas is contemporary and silent, therefore Legend.* Your rule for Jesus is: *Josephus/Tacitus are later and biased, therefore History (Bare).*
  If you apply the **Arthur Standard** (Contemporary Silence weighs heavily) to Jesus, the verdict shifts. Paul (contemporary) gives theological data but almost no biographical anchor; non-Christian contemporary sources are silent or disputed. If Arthur is Legend because Gildas doesn't name him, Jesus must be **History-ish** (like Ragnar) at best, because the "Independent Anchor" for his bare existence is textually weaker than the Hittite anchor for Troy and functionally similar to the Welsh anchor for Arthur.

  Dropping this call aligns your *Evidentiary Hierarchy* across the board. It admits that "Bare Existence" based on later, partisan texts is not the same epistemic category as "Bare Existence" based on contemporary external records (which we don't have for Jesus).

  ---

  ### Application to Four New Cases

  Using the **Definitional Core Test** and **Nominal Continuity**:

  **1. Did Homer Exist?**
  *   **Core:** A single blind bard named Homer who composed the Iliad/Odyssey.
  *   **Anchor:** None. The poems exist; the author is a tradition within the poems.
  *   **Verdict:** **Legend.** (Like Arthur). The "Homeric Question" suggests multiple authors. The name "Homer" anchors to the *tradition of composition*, not a biological person.
  *   *Nuance:* "The Homeric Poems" are History (they exist). "Homer the Man" is Legend.

  **2. The Pre-Flood Sumerian King List (Kings reigning 28,000 years)**
  *   **Core:** Specific individuals ruling for millennia before a flood.
  *   **Anchor:** None. Contradicts biological and geological reality.
  *   **Verdict:** **Legend.** (Like Prester John). The *list format* is historical (Sumerians kept lists), but the *content* fails the Reality Test entirely.
  *   *Nuance:* Post-flood kings might be History-ish (some names match archaeology), but pre-flood is pure mythology.

  **3. The Trojan Horse (Given the War is History)**
  *   **Core:** A specific wooden siege engine used to breach Troy.
  *   **Anchor:** None. Hittite texts mention the war, not the tactic. Archaeology shows burn layers, not horse remains (obviously), but no siege engineering evidence specific to a horse.
  *   **Verdict:** **Legend.** (Like the speeches at Masada).
  *   *Reasoning:* This proves your "Two Scales" intuition. The *Event* (War) is History. The *Tactic* (Horse) is Legend. Under the Definitional Core Test, the "Trojan War" core is "Conflict at Ilios," not "Conflict via Horse." The Horse is a narrative detail that lacks an anchor.

  **4. Robin Hood Court Rolls (Finding a "Robehod" in the 1240s)**
  *   **Core:** An outlaw archer operating under Richard I/John, robbing the rich.
  *   **Anchor:** A court roll entry for a criminal named "Robehod."
  *   **Verdict:** **History-ish.** (Like Ragnar).
  *   *Reasoning:* This anchors the *Agent's Existence* (a man with that name/nickname existed), but it does not anchor the *Definitional Core* (the specific outlaw mythology, the dates, the social banditry). It promotes Robin from "Pure Legend" (like Tell) to "Legend with Historical Substrate" (like Ragnar). It does not make the *ballads* History.

  ---

  ### The Axis Question

  > *Is history versus legend even the right axis?*

  **No.** Your intuition on the 47 Ronin and the Alamo is the key to the whole system. You are currently grading **Narrative Fidelity** but labeling it **Event Reality**.

  You need two separate scales:

  1.  **Event Probability:** Did *something* happen here? (0 = Invention, 10 = Documented Fact).
      *   *Alamo:* 10.
      *   *Troy:* 8.
      *   *Arthur:* 4.
      *   *Tell:* 1.
  2.  **Narrative Fidelity:** Does the *story* match the *event*? (0 = Total Fiction, 10 = Transcript).
      *   *Alamo (Movie Version):* 2.
      *   *Troy (Iliad):* 3.
      *   *Masada (Josephus):* 5 (Siege is real, speeches are invented).
      *   *47 Ronin (Plays):* 4.

  **Why this solves your problem:**
  *   **Troy:** High Event Probability, Low Narrative Fidelity. You called it "History" because you weighted Event Probability.
  *   **Romulus:** Low Event Probability (for the person), Low Narrative Fidelity. You called it "Legend."
  *   **Exodus:** Low Event Probability (for the narrative), Low Narrative Fidelity. You called it "Legend."
  *   **Jesus:** Moderate Event Probability, Low Narrative Fidelity (for the miracles). You called it "History (Bare)" because you isolated the Existence score from the Fidelity score.

  **Recommendation:**
  Stop playing "History or Legend." Start playing **"Substrate vs. Story."**
  *   **Substrate:** The archaeological/textual floor. (e.g., Hisarlik burned, Semites were in Egypt, A man named Jesus was crucified).
  *   **Story:** The narrative superstructure. (e.g., Helen's face, Moses' staff, The Resurrection).

  Your verdicts become:
  *   **Troy:** Strong Substrate, Weak Story.
  *   **Arthur:** Weak Substrate, Strong Story (culturally).
  *   **Exodus:** Weak Substrate, Strong Story (theologically).
  *   **Alamo:** Strong Substrate, Weak Story (in popular memory).

  This allows you to say "The Exodus Substrate is historical, the Exodus Story is legendary" without contradicting yourself on Troy. It acknowledges that **History** is what happened, **Legend** is what we say happened, and your game is measuring the gap between them.
