answer: |-
  # Joint Statement of Partial Agreement (Mara Cases)

  **Prepared for:** Free Will Seminar Audit
  **Subject:** Clarification of Disputes Regarding Frankfurt-Style Cases (Mara V1 & V2)
  **Parties:** The Deflater, The Flickerer

  ### I. Agreed Premises
  Both parties affirm the following claims as the baseline for further argument. Disagreement concerns the interpretation and implications of these claims, not their truth.

  1.  **Actual Sequence Identity:** In the actual sequence of both Mara V1 (Neural Trigger) and Mara V2 (Agential Trigger), Mara signs the letter voluntarily, without intervention from the implant, based on her own reasons.
  2.  **Counterfactual Intervention:** In both versions, had Mara not shown signs of signing within the four-minute window following the trigger event, the implant would have forced her hand, rendering the signing inevitable *conditional on the trigger*.
  3.  **Knowledge Condition:** Mara knows about the implant and its general function, but in V1 she cannot detect the neural firing, whereas in V2 she is aware of her own drafting behavior.
  4.  **Relevance of PAP:** Both parties agree that if the Principle of Alternative Possibilities (PAP) is true, Mara is responsible only if she could have done otherwise at some relevant time. If PAP is false, responsibility may still obtain in the actual sequence.
  5.  **Manipulation Constraint:** Both parties agree that if a case is deemed a case of "manipulation" (in the undermining sense), it fails to establish responsibility, regardless of alternative possibilities.
  6.  **Implication of Success:** If the Deflater is correct that these are successful Frankfurt cases, leeway incompatibilism is refuted. If the Flickerer is correct that these cases fail, leeway incompatibilism remains live, though not necessarily proven.
  7.  **Weak Correlate Specifics:** In V1, both agree the neural cluster fires ~900ms before intention, is subpersonal, and is a weak correlate (it fires sometimes without resulting action).

  ### II. Table of Disagreements

  | Topic | Deflater Formulation | Flickerer Formulation | Stakes (What must be conceded if wrong) |
  | :--- | :--- | :--- | :--- |
  | **1. The Prior Sign Dilemma (V1)** | The neural firing is merely a trigger condition, not a prior sign of inevitable action; because it is a weak correlate, it does not imply determinism, yet the counterfactual intervener still removes the alternative at the moment of decision. | The neural firing functions as a prior sign; if it predicts the action reliably enough to justify intervention, it implies residual alternatives (avoiding the firing); if it doesn't, the intervener cannot ensure inevitability without intervening unnecessarily. | **Deflater:** Must admit V1 is not a true Frankfurt case (inevitability fails).<br>**Flickerer:** Must admit subpersonal triggers can block alternatives without restoring leeway. |
  | **2. The Timing of PAP** | For PAP to be a condition of responsibility, the alternative possibility must be available at the moment of decision ($t_{decision}$); earlier alternatives that are causally disconnected from the specific decision mechanism are irrelevant. | For PAP to be satisfied, the alternative possibility must be available at some point in the causal history leading to the decision ($t_{history}$); removing alternatives at $t_{decision}$ is irrelevant if they existed at $t_{history}$. | **Deflater:** Must accept that "flickers" of freedom (avoiding the trigger) save PAP.<br>**Flickerer:** Must accept that responsibility can exist even if the agent was locked in before the decision moment. |
  | **3. The Manipulation Intuition (V2)** | Shifting the trigger to agential behavior (drafting emails) does not change the metaphysical structure; since the actual sequence is unchanged, the intuition of responsibility should remain high. | Shifting the trigger to agential behavior makes the backup mechanism relevant to the agent's psychology; this introduces a manipulation-like constraint that degrades responsibility compared to normal cases. | **Deflater:** Must admit V2 undermines responsibility more than V1.<br>**Flickerer:** Must admit that agential triggers do not worsen the manipulation worry. |
  | **4. Sourcehood vs. Leeway** | Refuting PAP is sufficient to defeat the primary incompatibilist argument; sourcehood concerns are distinct and do not rely on the availability of alternatives. | Refuting PAP only defeats leeway incompatibilism; source incompatibilism remains untouched because determinism (or the implant) still blocks the action from originating in the agent. | **Deflater:** Must admit compatibilism requires more than just refuting PAP.<br>**Flickerer:** Must admit sourcehood arguments cannot rely on the lack of alternatives. |

  *(Note: Row 4 is included to clarify the scope of the debate, though both parties acknowledge it is a meta-disagreement about the wider debate rather than the specific Mara cases.)*

  ### III. Empirical and Argumentative Cruxes

  To move beyond circular argumentation, both parties agree to treat the following sub-questions as decisive tests. Predictions are recorded prior to further deliberation.

  **Crux 1: The Robustness of the Flicker (V1)**
  *   **Question:** Is the ability to prevent the neural cluster from firing (if it were possible) a "robust" alternative sufficient to ground blame?
  *   **Test Case:** A modified V1 where Mara is told she can suppress the neural firing via a mental trick, but chooses not to.
  *   **Deflater Prediction:** Intuition of responsibility remains high even if she *cannot* suppress the firing, proving the alternative is not required.
  *   **Flickerer Prediction:** Intuition of responsibility drops significantly if she cannot suppress the firing, proving the alternative is required for blame.

  **Crux 2: The Timing of Refrain**
  *   **Question:** At what specific moment must the ability to refrain exist?
  *   **Test Case:** A survey of intuitions on cases where an agent can refrain at $t-10min$ but is physically locked in at $t_{decision}$ due to external factors unrelated to their psychology.
  *   **Deflater Prediction:** Subjects will assign responsibility based on the actual sequence at $t_{decision}$, ignoring the lock-in.
  *   **Flickerer Prediction:** Subjects will assign responsibility only if the lock-in was avoidable at some prior point ($t-10min$).

  **Crux 3: The Manipulation Gradient (V2)**
  *   **Question:** Does grounding the trigger in prior agency (drafting emails) increase or decrease the intuition of manipulation compared to the neural trigger?
  *   **Test Case:** Side-by-side comparison of V1 (Neural) and V2 (Agential) presented to neutral auditors.
  *   **Deflater Prediction:** No significant difference in responsibility ratings; the actual sequence is identical.
  *   **Flickerer Prediction:** V2 will receive lower responsibility ratings because the implant monitors agency, creating a "surveillance" effect that undermines ownership.

  ### IV. Note on Verbal Disputes

  A significant portion of the stalemate appears to stem from equivocation on three key terms. Clarifying these may dissolve rows 1 and 2 of the Disagreement Table.

  1.  **"Robust Alternative":** The Deflater uses this to mean *an alternative that allows the agent to avoid moral blame*. The Flickerer uses this to mean *any metaphysically open path, regardless of significance*. If the "flicker" (avoiding the neural firing) does not allow Mara to avoid blame (because the intervener would just force her anyway), the Deflater calls it non-robust. The Flickerer calls it an alternative period.
      *   *Resolution:* Agree to distinguish "Alternative Possibility" (metaphysical) from "Exculpating Alternative" (moral).

  2.  **"Could Have Done Otherwise":** This phrase is temporally unindexed in ordinary language. The Deflater implicitly indexes it to $t_{decision}$. The Flickerer implicitly indexes it to $t_{history}$.
      *   *Resolution:* All future claims must specify the time index (e.g., "Could have refrained at $t_{decision}$").

  3.  **"Manipulation":** The Deflater treats manipulation as *actual interference* in the actual sequence. The Flickerer treats manipulation as *the presence of a counterfactual controller* regardless of actual interference.
      *   *Resolution:* Agree to distinguish "Actual Sequence Manipulation" from "Counterfactual Control." The dispute over V2 hinges entirely on whether Counterfactual Control degrades responsibility in the absence of Actual Sequence Manipulation.

  **Conclusion:** The parties agree to revisit the seminar discussion once these distinctions are applied to the Mara cases, specifically focusing on Crux 1 and Crux 3.
