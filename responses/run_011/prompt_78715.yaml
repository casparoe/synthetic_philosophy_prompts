answer: |-
  ### The "When Is It Over?" Decision Tree

  **Instructions for Facilitator:** Read the scenario aloud. Ask for a show of hands for "Dead" vs. "Alive/Not Dead." Move the participant to the next node based on their answer. Do not use terms like "brain death," "cortex," "cardiac criterion," or "DDR."

  **Node 1: The Ventilated Body**
  A patient has no electrical activity in the entire head and no blood flow to the brain. The chest rises and falls only because a machine pushes air in. The heart beats because the machine keeps the oxygen up. The body is warm and digests food.
  *   **Dead?** → Go to Node 2.
  *   **Alive?** → Go to Node 7.

  **Node 2: The Breathing Shell (Anencephalic)**
  A newborn is missing the "thinking" part of the brain but has the "automatic breathing" part. The baby breathes on its own, is warm, and digests food, but will never think or feel.
  *   **Dead?** → Go to Node 3.
  *   **Alive?** → Go to Node 5.

  **Node 3: The Organ Motive (DDR Probe)**
  Think back to the patient in Node 1 (Ventilated Body). If we were *forbidden* from taking their organs for transplant, would you still declare them dead tomorrow morning?
  *   **Yes (Still Dead):** → Go to Node 4.
  *   **No (Would keep them Alive):** → **Leaf A (The Instrumentalist).**

  **Node 4: The Nature of the Line (Normative Probe)**
  For the patient in Node 2 (Breathing Shell), is "death" a biological fact you *discover* (like a broken heart), or a legal status you *confer* (like "adult" or "married")?
  *   **Fact:** → **Leaf B (The Higher-Brain Realist).**
  *   **Status:** → **Leaf C (The Normative Constructivist).**

  **Node 5: The Planned Stop (DCD Case)**
  A patient on a ventilator (with some brain function) has support withdrawn by family decision. The heart stops. The team does not attempt CPR. They wait five minutes. The organs are then taken.
  *   **Dead before organs taken?** → Go to Node 6.
  *   **Alive until organs taken?** → **Leaf D (The Retrieval-First Vitalist).**

  **Node 6: The Meaning of "Can't" (Irreversibility 1)**
  In Node 5, the heart stopped. Is it "irreversible" because physics forbids restarting it after five minutes, or simply because the team decided in advance *not* to try?
  *   **Physics forbids it:** → **Leaf E (The Principle Irreversibilist).**
  *   **Decision not to try:** → **Leaf F (The Decisional Irreversibilist).**

  **Node 7: The Lazarus Gap (Auto-resuscitation)**
  A patient's heart stops. No CPR is started. Two minutes later, the heart starts beating again on its own.
  *   **Dead during the two minutes?** → Go to Node 8.
  *   **Alive during the two minutes?** → Go to Node 9.

  **Node 8: The Spontaneous Return (Irreversibility 2)**
  If you said "Dead" in Node 7: Does the definition of death allow for a spontaneous return of function, or must "dead" mean function cannot come back on its own?
  *   **Allowed (They were dead):** → **Leaf G (The Permanence Skeptic).**
  *   **Not Allowed (Contradiction):** → **Leaf H (The Inconsistent Vitalist).**

  **Node 9: The Ice Water Test (Cold Drowning)**
  A child falls through ice. No pulse for 30 minutes. Body is cold. They are rewarmed and wake up fully.
  *   **Dead while cold?** → **Leaf I (The Strict Biological Vitalist).**
  *   **Alive while cold?** → Go to Node 10.

  **Node 10: The Control Check (Vegetative vs. Locked-in)**
  *Facilitator Note:* If they are here, they believe biological function (breathing/heart) keeps you alive.
  **Scenario A:** Patient breathes on own, eyes open, no awareness (Vegetative). **Alive?**
  **Scenario B:** Patient breathes on own, fully aware, cannot move (Locked-in). **Alive?**
  *   **A=Alive, B=Alive:** → **Leaf J (The Consistent Biological Vitalist).**
  *   **A=Dead or B=Dead:** → **Leaf K (The Inconsistent Vitalist).**

  ***

  ### Logical Space and Leaf Diagnosis

  We derive the leaves from the answer patterns above. Here is the map of the territory, including the empty cells.

  *   **Leaf A (The Instrumentalist):** *Path: 1-Dead → 2-Dead → 3-No.*
      *   **Diagnosis:** Believes brain-dead bodies are dead, but admits the status depends on the utility of organ retrieval.
      *   **Status:** **Occupied.** (Common among pragmatic transplant coordinators who feel the philosophical tension).
  *   **Leaf B (The Higher-Brain Realist):** *Path: 1-Dead → 2-Dead → 3-Yes → 4-Fact.*
      *   **Diagnosis:** Believes loss of consciousness is biological death, independent of organ needs.
      *   **Status:** **Occupied.** (Common among neurologists and some ethicists).
  *   **Leaf C (The Normative Constructivist):** *Path: 1-Dead → 2-Dead → 3-Yes → 4-Status.*
      *   **Diagnosis:** Believes death is a social/legal line drawn around loss of personhood.
      *   **Status:** **Occupied.** (Common among law students and philosophers).
  *   **Leaf D (The Retrieval-First Vitalist):** *Path: 1-Dead → 2-Alive → 5-Alive.*
      *   **Diagnosis:** Believes the body in Node 1 is alive, and organs are taken *before* death occurs (violating the Dead-Donor Rule).
      *   **Status:** **Empty (Incoherent/Illegal).** Nobody occupies this openly because it admits to killing the donor. It is theoretically possible but professionally suicidal.
  *   **Leaf E (The Principle Irreversibilist):** *Path: 1-Dead → 2-Alive → 5-Dead → 6-Physics.*
      *   **Diagnosis:** Accepts cardiac death in DCD only if restart is physically impossible.
      *   **Status:** **Empty (Unattractive).** In DCD, restart is physically *possible* (that's why we wait 5 mins, not because it's impossible, but to ensure auto-resuscitation doesn't happen). This view would make most DCD impossible.
  *   **Leaf F (The Decisional Irreversibilist):** *Path: 1-Dead → 2-Alive → 5-Dead → 6-Decision.*
      *   **Diagnosis:** Accepts cardiac death in DCD because the *decision* not to resuscitate makes it irreversible.
      *   **Status:** **Occupied.** (The standard clinical defense of DCD).
  *   **Leaf G (The Permanence Skeptic):** *Path: 1-Alive → 7-Dead → 8-Allowed.*
      *   **Diagnosis:** Believes you can be dead and then come back to life (Lazarus phenomenon).
      *   **Status:** **Empty (Incoherent).** Most definitions of death treat it as a one-way transition. This view collapses the concept of death into "temporary pause."
  *   **Leaf H (The Inconsistent Vitalist):** *Path: 1-Alive → 7-Dead → 8-Not Allowed.*
      *   **Diagnosis:** Claims the patient was dead in the gap, but admits if they wake up they weren't dead.
      *   **Status:** **Occupied (Confused).** Common among residents who feel the pressure to declare death quickly but know the biology is shaky.
  *   **Leaf I (The Strict Biological Vitalist):** *Path: 1-Alive → 7-Alive → 9-Dead.*
      *   **Diagnosis:** Believes no pulse = dead, even if cold water preserves the brain.
      *   **Status:** **Empty (Unattractive).** This view condemns successful resuscitations of drowning victims as "bringing the dead back," which conflicts with the intuition that they were never lost.
  *   **Leaf J (The Consistent Biological Vitalist):** *Path: 1-Alive → 7-Alive → 9-Alive → 10-Alive/Alive.*
      *   **Diagnosis:** Life equals somatic integration. If the body works, the person is alive.
      *   **Status:** **Occupied.** (Common among ICU nurses and some surgeons).
  *   **Leaf K (The Inconsistent Vitalist):** *Path: 1-Alive → 7-Alive → 9-Alive → 10-Mixed.*
      *   **Diagnosis:** Claims biological function keeps you alive, but makes an exception for Vegetative or Locked-in states.
      *   **Status:** **Occupied (Confused).** Reveals hidden higher-brain intuitions in people who claim to be vitalists.

  ***

  ### Analysis of the Normative Leaf (Leaf C)

  **Can the tree separate Normative Constructivism from Higher-Brain Realism?**
  Honestly: **Barely.**
  In Node 4, we ask them to self-identify ("Fact" vs. "Status"). However, in practice, these two positions often collapse because they yield the same verdict on every case. If you believe death is a "status we confer" (Normative), you almost always confer it at the loss of consciousness (Higher-Brain). If you believe death is a "biological fact" (Realist) located in the loss of consciousness, you also call the Anencephalic dead.
  The tree forces a verbal distinction at Node 4, but the *case judgments* (Nodes 1 and 2) do not separate them. A participant can hold the Normative view but answer like a Realist because the "status" is usually conferred exactly where the "fact" would be discovered. The only way to truly separate them is to ask about a hypothetical scenario where biology and law diverge (e.g., "If the law changed tomorrow to say brain-dead patients are alive, would you be wrong?"), but that breaks the "no jargon/concrete cases" constraint.

  ***

  ### Indistinguishable Pairs

  The following pairs of philosophical positions will travel through the tree identically and land on the same leaf. The instrument cannot separate them:

  1.  **Whole-Brain Death vs. Cardiac Death (in the absence of DCD):**
      *   *Why:* Both views answer "Dead" at Node 1 (Ventilated Body) and "Alive" at Node 2 (Anencephalic). They only diverge on cases not fully tested here (e.g., a patient with a destroyed cortex but intact brainstem on a ventilator). Node 5 (DCD) sorts them slightly, but a Whole-Brain proponent can accept DCD as "secondary" cardiac death, landing them on Leaf F alongside primary Cardiac proponents.
  2.  **Decisional Irreversibility (Leaf F) vs. Dead-Donor Rule Instrumentalism (Leaf A):**
      *   *Why:* Both groups admit that the *decision* not to resuscitate is what makes the patient dead (or eligible for organ taking). Leaf A admits it openly (Node 3); Leaf F codifies it as "irreversibility" (Node 6). In practice, their behavior in the ICU is identical, even if their moral comfort levels differ.
  3.  **Higher-Brain Realism (Leaf B) vs. Normative Constructivism (Leaf C):**
      *   *Why:* As noted above, both answer "Dead" to the Anencephalic (Node 2). The split relies entirely on the self-report at Node 4. A participant who doesn't understand the metaphysical distinction between "fact" and "status" will answer randomly, making the separation unreliable.
  4.  **Strict Biological Vitalism (Leaf J) vs. The "Somatic Integrator":**
      *   *Why:* Some vitalists believe life is "heart + lungs." Others believe it is "organ system integration." In all the concrete cases provided (Ventilator, DCD, Cold Water), these two views yield the same answers. Separating them would require a case where the heart beats but the organs are failing (multi-system failure), which is too clinically messy for a 90-minute workshop.
