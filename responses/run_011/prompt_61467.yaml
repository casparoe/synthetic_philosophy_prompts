prompt: |-
  I write novels, so my whole job is arranging little ink shapes in a particular order so that strangers' bodies react — somebody in Ohio puts my book down and goes and stands in the driveway for ten minutes, or a beta reader tells me a chapter made her call her mother. I want a number from you, not a both-sides shrug.

  The proposition, as tight as I can make it: when that happens, facts about what the passage *means* are among the causes of what the reader does — not merely facts about the shapes of the marks, the photons, and the neurochemistry underneath. There's that picture, Hofstadter's I think, where the brain is a chamber full of symbols knocking into each other and, being made of the same stuff as everything else in there, shoving the meat around. I want to know whether thats literally true or just a comforting story we tell about neurons.

  Give me your credence, then unpack it. Roughly: how much rides on whether causal exclusion is a real problem or a pseudo-problem; how much on whether content is multiply realizable — my own argument being that a good paraphrase has completely different ink shapes and lands the identical punch, while those exact shapes in a language you don't read land nothing at all, so the shapes can't be what's doing the work; how much on the fact that sad music, which arguably means nothing whatever, produces the same tears, which seems to cut against me; and how much of the entire question is just two vocabularies describing one process. A number and one line of justification per term, then how you combine them.

  My credence is around 0.85. My brother does experimental physics and says 0.1, and calls me a dualist when he's being unkind. Which term is he actually scoring differently — where does the disagreement live? And what single piece of evidence would move you most, in either direction?
