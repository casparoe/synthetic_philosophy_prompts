answer: |-
  The whole dispute turns on whether waking up without memory of yesterday constitutes new evidence that shifts the odds away from the coin's initial fairness.

  **Part A. The space first, the tree second.**
  Two axes generate the debate. Axis 1: *Informational Impact*. Does waking change the count of possible situations you could be in relative to the coin outcome? (Yes/No). Axis 2: *Betting Unit*. Do you maximize payout per waking or per coin flip? (Per Waking/Per Flip).

  Four combinations arise:
  1.  **No Impact / Per Flip:** Occupied. This is the Standard Halfer position. It holds the coin remains fair and bets should reflect the single flip.
  2.  **Yes Impact / Per Waking:** Occupied. This is the Standard Thirder position. Waking adds self-locating evidence, and bets track the frequency of awakenings.
  3.  **No Impact / Per Waking:** Occupied. This is the Double Halfer position. It admits no evidence shift but argues rational action requires maximizing per-awakening utility.
  4.  **Yes Impact / Per Flip:** Empty. Diagnosis: Unattractive. It admits evidence shifts the situation count but refuses to let that shift guide individual betting, creating a disconnect between epistemic state and action that offers no strategic advantage.

  **Part B. The tree.**
  1.  **Sunday Wager (Case 1):** Pay $100 now. Win $300 if Heads, $0 if Tails. Settle Wednesday. Accept?
  2.  **Awakening Wager (Case 2):** Pay $100 now. Win $300 if Heads, $0 if Tails. Settle immediately. Accept?
  3.  **Pre-commitment (Case 5):** Sunday: Bind future selves to accept Node 2 whenever they wake. Accept?
  4.  **Generalized Wager (Case 3):** 100 awakenings if Tails, 1 if Heads. Pay $100 now. Win $150 if Heads. Settle immediately. Accept?
  5.  **Informed Wager (Case 4):** Told "It is Monday". Pay $100 now. Win $300 if Heads. Settle immediately. Accept?
  6.  **Tails Awakening:** Pay $100 now. Win $100 if Tails. Settle immediately. Accept?
  7.  **Tails Sunday:** Pay $100 now. Win $100 if Tails. Settle Wednesday. Accept?
  8.  **Even Heads Awakening:** Pay $100 now. Win $200 if Heads. Settle immediately. Accept?

  **Part C. Cases the tree must run on.**
  The nodes above map directly to the required cases. Node 1 covers the standard pre-experiment bet. Node 2 covers the per-awakening bet. Node 4 covers the generalized hundred-awakening branch. Node 5 covers the partial information reveal. Node 3 covers the Sunday pre-commitment policy. Nodes 6, 7, and 8 provide additional resolution on Tails weighting and even odds to separate hybrid views.

  **Part D. Leaves.**
  1.  **Standard Halfer (Lewis):** Awkward commitment: Must refuse profitable bets at awakening that they accepted on Sunday. Case 1: Accept. Case 2: Refuse. Case 3: Refuse. Case 4: Accept. Case 5: Refuse.
  2.  **Standard Thirder (Elga):** Awkward commitment: Must treat a fair coin as if it lands Tails twice as often upon waking. Case 1: Accept. Case 2: Accept. Case 3: Refuse. Case 4: Accept. Case 5: Accept.
  3.  **Double Halfer (Hawley):** Awkward commitment: Must accept bets at awakening they would refuse on Sunday despite no new evidence. Case 1: Accept. Case 2: Accept. Case 3: Refuse. Case 4: Accept. Case 5: Accept.
  4.  **Hybrid/Contextualist:** Awkward commitment: Must claim the answer changes based on how the bet is framed, not just the facts. Case 1: Accept. Case 2: Refuse. Case 3: Refuse. Case 4: Accept. Case 5: Refuse.
  5.  **Many-Worlds:** Awkward commitment: Must treat coin flips as branching realities rather than uncertainty. Case 1: Accept. Case 2: Accept. Case 3: Accept (weights branches). Case 4: Accept. Case 5: Accept.
  6.  **No Unique Answer:** Awkward commitment: Must admit rationality does not dictate a single choice. Case 1: Indifferent. Case 2: Indifferent. Case 3: Indifferent. Case 4: Indifferent. Case 5: Indifferent.

  **Part E. What the tree cannot separate.**
  **Halfer vs. Hybrid:** Indistinguishable on betting behavior in standard cases. Separation requires a wager on *why* they refuse Node 2 (evidence vs. policy).
  **Thirder vs. Many-Worlds:** Indistinguishable in principle given what the experiment discloses. Both accept Node 2 and Node 5. Separation requires a metaphysical wager on whether branches exist, which the experiment cannot settle.
  **Double Halfer vs. Thirder:** Indistinguishable on Nodes 1, 2, 5. Separation requires Node 4 (Information). If told "Monday", Thirder updates to 1/2 Heads. Double Halfer stays at 1/2 Heads. Wait, both say 1/2 Heads on Monday. Separation requires asking about the *reason* (evidence vs. policy), which is not a wager. They are indistinguishable by wager alone in the standard setup.

  **Part F. Scoring key.**
  | Leaf | Node 1 | Node 2 | Node 3 | Node 5 | Node 6 |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | Halfer | Yes | No | No | No | No |
  | Thirder | Yes | Yes | No | Yes | Yes |
  | Double Halfer | Yes | Yes | No | Yes | Yes |
  | Hybrid | Yes | No | No | No | No |
  | Many-Worlds | Yes | Yes | Yes | Yes | Yes |
  | No Answer | Mix | Mix | Mix | Mix | Mix |

  **Part G. Where you are most likely wrong.**
  I suspect the "Informational Impact" axis is drawn incorrectly. A determined opponent could argue that waking provides no evidence about the coin, but does provide evidence about *time*, which is sufficient for Thirdism without shifting coin odds. This would make the "No Impact / Per Waking" cell (Double Halfer) more robust than I labeled it. I dismissed the "Yes Impact / Per Flip" cell as unattractive, but a pragmatist could defend it: admit the odds shift but bet on the flip to maintain diachronic consistency with Sunday. If persuaded by this, I would occupy the Empty Cell, arguing that epistemic shifts need not dictate monetary action if the goal is policy stability. My list of empty cells likely reflects a failure of imagination regarding pragmatist views that decouple truth from utility.
