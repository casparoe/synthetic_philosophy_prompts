  Two pure strategies survive because neither is strictly dominated.
  They compromise and play a fifty-fifty mix of themselves.
  Instantly, a third strategy strictly dominates the mix.
  They ask, "How are we safe but our compromise is dead?"
  The mix replies, "Because here, the middle ground is strictly dominated."

  This hinges on the second fact (a mixed strategy can be eliminated even if its support strategies survive), and it will only land if they already understand that a mix can be strictly dominated while its component pure strategies are not.
