answer: |-
  Good evening. For thirty-nine years, my aunt has been the senior proofreader at this press. To the editors and printers here: you know her reputation. You know that a comma out of place is not a mistake to her; it is a moral failing. You know she is exacting. You know she is, if I'm being honest, faintly alarming.

  But there was another text she was editing, one none of you knew about. Since she was twenty-two, she kept a small ruled book. Inside was a fixed list of thirteen virtues. She took them one per week, marking each day's lapses with a small black tick. Four cycles a year, for nearly half a century. Last spring, she handed me the final volume. It contains a single page.

  She stopped. And she gave me strict instructions on how to tell you why.

  There is an old story about a man who bought a new axe. He wanted the whole metal surface ground as bright as the edge. The smith told him he must turn the wheel for hours to grind away the speckles. The man grew tired of turning. He took the axe back and said, "I think I like it speckled." He didn't say the edge was sharp enough. He didn't say the shine didn't matter. He decided the weight of the grinding was too heavy for the work he needed to do.

  My aunt forbids me to tell you she succeeded. She considers that false, and an insult to the standard. She equally forbids me to say she learned to be kind to herself. On her account, the project was never about how she felt. Relinquishing the attempt revised her estimate of what a person can carry, not the requirement itself. The virtues remained true; she simply decided she could no longer carry the ledger of them without dropping everything else.

  To her colleagues: Her exactness was never about control. It was about respect for the work. She treated words as if they were fragile things that could break if handled roughly. To her family: Her silence on her own efforts was not secrecy, but protection. She didn't want us turning the wheel for her. She didn't want us watching her mark the ticks.

  She gave me three rules for this toast. I am not to praise her success, because there was none. I am not to praise her relaxation, because there was none. And I am not to praise her humility, because she wrote in the margin that doing so would only prove the point of why she stopped.

  So I will not offer a lesson. I will not offer a eulogy for a project ended. I will only say this: We are better because she cared enough to keep the ledger, and we are loved because she cared enough to close it. She spent a lifetime sharpening the edge, and when she decided she preferred it speckled, she trusted us to know the difference.

  She has retired from the press. She has retired from the book. But she has not retired from us. And we are grateful for every speckle.

  To [Aunt's Name].
