prompt: |-
  Ok so I just spent two hours arguing with a friend about the Principal Principle and I've decided to weaponize it in class.

  Context: I TA a section of intro metaphysics/epistemology, about 30 students, 75 minutes, next Thursday, and we're on chance and credence. His line was that the whole principle is just "defer to the expert" with a fancy coat of paint — that there's nothing special about physical chance compared to, say, a forecaster who's been right eight times out of ten — and so the clause restricting it to admissable evidence is doing all the work while being basically empty. I said no: chance isn't somebody's opinion, it's in the world, and the reason that clause looks empty is that he's never actually watched it bite. He said fine, give me a case where it bites. I couldn't, which is embarrassing, and now it's your problem.

  So: design an in-class game where the admissibility clause genuinely bites. I want students to physically run into the gap between (a) knowing the chance of the next outcome is 0.6 and (b) holding evidence about that particular outcome which the chance hypothesis itself says could turn up. Whatever settles it should be the payoffs, not me talking.

  Constraints. No real money — points are fine and I'll convert them to a sliver of extra credit. I've got one physical device (die in a cup, or a deck), a printer, a laptop, and a whiteboard. I want a scoring rule they can compute by hand or that I can run off quickly. There has to be at least one round where a subset of them is handed something — a note, a prediction, whatever you like — and the rest of the class needs to be able to see the note-holders pricing differently, so the divergence is visible at the group level and not just inside one person's head. Bonus if at some point the device itself changes under a swap I do in plain sight, so they have to revise the chance claim too and we get to watch whether people who were just burned by a note now over-discount the new device.

  Then give me: full rules and materials list, a timeline for the 75 minutes, the debrief that maps specific moments onto the principle and onto his "it's just expert deference" line (tell me honestly which of us the game ends up favoring — if it favors him I'd rather know before Thursday), what predictably goes wrong the first time I run it and how to recover mid-session, and a frank note on what the activity structurally can't reproduce. My suspicion is that it can't reproduce chance being mind-independent, since I'm the one stipulating it and they know it. Tell me whether that's right and what it costs the lesson.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Goal:** Design an in-class game/activity to demonstrate the Principal Principle (PP) and specifically the role of *admissible evidence*.
      *   **Context:** TA for intro metaphysics/epistemology (30 students, 75 mins). Topic: Chance and Credence.
      *   **The Dispute:** Friend says PP is just "defer to the expert" and the admissibility clause is empty/doing all the work. User says chance is worldly and the clause *does* bite (restricts evidence). User needs a case where the clause bites to win the argument.
      *   **Constraints:** No real money (points/extra credit). One physical device (die/deck), printer, laptop, whiteboard. Scoring rule must be computable.
      *   **Key Mechanic:** A subset of students gets "inadmissible" evidence (a note/prediction) while others don't. Divergence in credence must be visible.
      *   **Bonus:** Device changes mid-game (swap) to test revision of chance claims vs. evidence.
      *   **Deliverables:** Rules/Materials, Timeline, Debrief (mapping to PP, judging the dispute), Troubleshooting, Limitations (mind-independence).

  2.  **Deconstruct the Principal Principle (PP):**
      *   *Lewis's PP:* $C(A | XE) = x$, where $X$ is the proposition that the chance of $A$ is $x$, and $E$ is *admissible* evidence.
      *   *The Crux:* If $E$ is *inadmissible* (e.g., knowledge of the future outcome, or evidence correlated with the outcome in a way that bypasses the chance setup), then credence should *not* equal the chance.
      *   *The Friend's Objection:* "Chance is just an expert." If an expert says 60%, and I have a tip saying "It's going to happen," I should ignore the expert. That's just weighing sources, not a special metaphysical principle.
      *   *The Counter:* Admissibility isn't just about reliability; it's about *how* the evidence relates to the truth. Inadmissible evidence (like seeing the future) trumps chance *rationally*, but chance still holds. The "bite" is when you *know* the chance is 0.6, but you *also* know something that makes the probability 1.0 (or 0.0), and you are forced to acknowledge the chance claim is still true (the setup is fair) but your credence diverges.
      *   *Wait, actually:* The PP says if you have inadmissible evidence, the equality *doesn't hold*. The "bite" is showing that rational credence diverges from objective chance *without* denying the objective chance. The friend thinks the chance claim becomes false or irrelevant. The goal is to show students rationally abandoning the 0.6 credence *while accepting* the 0.6 chance claim, specifically because of the *type* of evidence (future-looking vs. past-looking).

  3.  **Designing the Game:**
      *   *Device:* A biased die is best. Let's say a 6-sided die where {1,2,3,4} = Success (0.66) and {5,6} = Fail (0.33). Or simpler: A bag with 6 Red (Win) and 4 Blue (Lose). Let's go with a **Bag of Chips/Tokens**. It's easier to manipulate surreptitiously for the "swap" bonus.
      *   *Setup:* 60% Win, 40% Lose.
      *   *Rounds:*
          1.  **Baseline:** Everyone knows the setup (60/40). They bet/assign credence. Should cluster around 0.6.
          2.  **The "Tip" (Inadmissible Evidence):** Select 5-6 students ("Insiders"). Give them a note saying "The next draw is [Win/Lose]." This is future-looking evidence (orally, it's a 'prophecy'). The rest ("Outsiders") only know the setup.
              *   *Expected:* Insiders go 1.0 or 0.0. Outsiders stay 0.6.
              *   *The Bite:* The Insiders know the *chance* is still 0.6 (the bag hasn't changed), but their *credence* is 1.0. This violates the simple equation $C = Ch$. It requires the admissibility clause.
          3.  **The Swap (Device Change):** TA swaps the bag for a 50/50 bag *in plain sight*.
              *   *Question:* Do Insiders trust their note? Do Outsiders update to 0.5?
              *   *Nuance:* If the note said "Win" based on the *first* bag, does it apply to the *second*? This tests if they treat the note as causal (admissible-ish) or magical (inadmissible). Let's refine this. The note should be about the *specific physical event* (e.g., "The token currently at the top of the stack").
      *   *Scoring:* Brier Score is standard but hard to calculate live. Simple betting points are easier.
          *   Assign probability $p$.
          *   If Win: Score = $1 - (1-p)^2$ (or just $p$ points?).
          *   Let's use a simple **Accuracy Score**: $1 - |p - \text{outcome}|$. If Outcome=1 (Win), Score = $p$. If Outcome=0 (Lose), Score = $1-p$. Wait, that encourages honesty?
          *   Better: **Brier Score Penalty**: $(p - o)^2$. Lower is better.
          *   Simplest for class: **Bet Points**. You have 10 points. Bet $k$ on Win. If Win, get $2k$. If Lose, lose $k$. This reveals credence via betting behavior.
          *   *Actually, for PP, we need explicit credence reports.* Let's have them write down a % chance. Scoring: Logarithmic scoring rule is best for truth-telling but hard to compute. Let's use a simplified Brier: 100 points - $100 \times (\text{reported } \% - \text{actual } 0/1)^2$.
          *   *Correction:* To keep it fast, just have them write a % and award points based on proximity to truth, weighted by confidence.
          *   *Decision:* Use a **Calibration Game**. Write down % confidence. If event happens, score = $100 \times p$. If not, score = $100 \times (1-p)$. (This is linear, risk-neutral students might just say 100% always. Need to penalize overconfidence).
          *   *Best Compromise:* **Brier Score**. $Score = 100 - 100(p - o)^2$. Easy enough to calculate on a spreadsheet during a break or just show the formula. Or, simpler: "You get points equal to your probability if you're right, and points equal to (1-probability) if you're wrong." No, that's linear.
          *   *Let's stick to the prompt's constraint:* "Scoring rule they can compute by hand."
          *   *Rule:* You start with 100 points. You state a credence $p$ (0 to 1).
          *   If Win: New Total = Old Total $\times p$. (No, that kills you fast).
          *   *Okay, let's use the "Accuracy Points" method:*
              *   Report $p$ (0-100%).
              *   If Event Happens: You get $p$ points.
              *   If Event Fails: You get $100-p$ points.
              *   *Flaw:* I should always say 100%.
              *   *Fix:* Penalty for error. $100 - |p - 100|$ if win. $100 - |p - 0|$ if lose. Basically $100 - \text{error}$.
              *   *Let's go with:* **100 minus the squared error (scaled).** $100 - (p - 100)^2 / 100$. Too mathy.
              *   *Simplest robust rule:* **The "Stake" Rule.** You have 10 chips. You place $k$ chips on "Win".
                  *   If Win: You keep your $k$ + win $k$ from the bank (Total $2k$).
                  *   If Lose: You lose $k$.
                  *   Unbet chips are safe.
                  *   *Revealed Credence:* If risk neutral, bet fraction = credence.
                  *   *Calculation:* Easy addition/subtraction.

  4.  **Refining the "Bite":**
      *   The friend says PP is just "defer to expert."
      *   Scenario: The "Expert" is the Chance Setup (Bag is 60% Red).
      *   The "Inadmissible Evidence" is a note from the Future (or a peek).
      *   If the friend is right, the note just *is* a better expert.
      *   If the User is right, the note is *inadmissible* relative to the chance claim. The chance claim remains 60%, but rational credence is 100%.
      *   *Crucial Moment:* We need to ask the Insiders: "What is the *chance* of drawing Red?" vs "What is your *credence*?"
      *   If they say "Chance is 100%," they deny the physical setup. If they say "Chance is 60%, Credence is 100%," they validate PP + Admissibility clause.
      *   *The Game:* Force them to distinguish *Chance* (property of the setup) vs *Credence* (degree of belief).

  5.  **Drafting the Plan:**
      *   **Materials:** Two opaque bags/cups. Set A (6 Red, 4 Blue). Set B (5 Red, 5 Blue). Tokens. Printed Notes. Scorecards.
      *   **Timeline:**
          *   0-10: Intro & Rules.
          *   10-25: Round 1 (Public Chance).
          *   25-40: Round 2 (The Insider Note). *The Bite.*
          *   40-55: Round 3 (The Swap). *The Revision.*
          *   55-75: Debrief & Scoring.
      *   **The Swap:** In Round 3, swap Bag A for Bag B. The Insiders still have the note from Round 2 (which referred to a specific token draw). Does the note apply?
          *   *Better:* The note says "The 3rd draw will be Red."
          *   Round 1: Draw 1.
          *   Round 2: Distribute notes about Draw 3. Draw 2.
          *   Round 3: Swap bag. Draw 3.
          *   *Wait, simpler:* Just one big draw per round.
          *   Round 1: Bag A (60/40). Everyone bets.
          *   Round 2: Bag A (60/40). Insiders get note "This draw is Red." Everyone bets.
          *   Round 3: Swap to Bag B (50/50) *after* notes are distributed but *before* draw. Note says "This draw is Red."
          *   *Tension:* Insiders have a note saying Red. But the bag is now 50/50. Do they trust the note (inadmissible magic) or the bag (chance)?
          *   *Actually, to make the admissibility clause bite:* The note must be *about the outcome* in a way that bypasses the chance. A "peek" is best.
          *   *Revised Round 2:* TA draws a token, looks at it, puts it in cup. Gives note to Insiders: "I have seen the token. It is Red."
          *   *Chance:* Still 60% (because the selection process was random).
          *   *Credence:* 100% (for Insiders).
          *   *This creates the divergence.*

  6.  **Addressing the Friend's Argument:**
      *   Friend: "It's just expert deference."
      *   Rebuttal: The "Expert" (Chance) says 60%. The "Note" says 100%. If it were just expert deference, you'd weigh them. But PP says if evidence is *admissible*, you *must* follow Chance. If *inadmissible*, you *must* follow Evidence. It's a lexical priority, not a weighting. The game shows Insiders ignoring the 60% completely, not averaging to 80%.
      *   *Wait, Lewis's point:* Admissible evidence is evidence that doesn't give you info about the future *except* through the chances. Seeing the token *is* info about the future not via chances.
      *   *Verdict:* The User is right about the structure, but the Friend is right that it *feels* like expert deference. The metaphysical "bite" is that the Chance proposition remains *true* (the setup is still 60/40) even when Credence is 100%. The game must force them to affirm the Chance is still 60%.

  7.  **Troubleshooting:**
      *   *Risk Aversion:* Students might not bet 100% even with a note.
      *   *Solution:* Emphasize points = extra credit. Encourage maximizing expected value.
      *   *Confusion:* Mixing up Chance and Credence.
      *   *Solution:* Whiteboard columns: "Objective Setup" vs "Your Belief".
      *   *Time:* Scoring takes too long.
      *   *Solution:* Pre-print score sheets with formulas.

  8.  **Limitations (Mind-Independence):**
      *   The TA stipulates the chance. It's not "out there" in nature.
      *   *Cost:* Students might treat chance as "TA's word."
      *   *Mitigation:* Use the physical device to ground it. The chance is a property of the *bag*, not the TA. The TA is just the reporter of the bag's constitution.

  9.  **Finalizing the Plan:**
      *   *Name:* "The Admissibility Auction."
      *   *Device:* Two opaque cups. Cup 1 (6R, 4B). Cup 2 (5R, 5B).
      *   *Rounds:*
          1.  Public Knowledge (Cup 1).
          2.  Insider Info (Cup 1 + Peek Note).
          3.  The Switch (Cup 2 + Old Note).
      *   *Scoring:* Simple Brier-ish. 100 points base. Deduct $100 \times (p - outcome)^2$.
      *   *Debrief:* Focus on the Insiders in Round 2. Did they change their belief about the *Bag's composition*? No. Just their belief about the *Outcome*. That's the PP bite.

  10. **Review against Constraints:**
      *   75 mins? Yes.
      *   30 students? Yes.
      *   Physical device? Yes (Cups/Tokens).
      *   Printer/Laptop? For notes/scores.
      *   Scoring by hand? Yes (simplified formula).
      *   Visible divergence? Yes (Insiders vs Outsiders betting).
      *   Device swap? Yes (Round 3).
      *   Verdict on dispute? User wins on technicality (admissibility restricts *which* evidence updates chance), Friend wins on intuition (it looks like weighing sources). Need to nuance this.

  11. **Refining the "Bite" for the Friend's Objection:**
      *   Friend says: "Admissibility clause is empty."
      *   Counter: It's not empty; it excludes *future* facts.
      *   Game moment: In Round 2, ask Insiders: "Is the chance still 60%?" If they say "Yes," but bet 100%, they confirm PP. If they say "No, chance is now 100%," they conflate chance with credence (and lose the metaphysical point).
      *   *Instruction:* Explicitly ask them to report *Chance* and *Credence* separately on the scorecard. This is vital.

  12. **Final Polish:** Check tone. Needs to be authoritative but acknowledging the difficulty. Ensure the "Verdict" is honest. (Spoiler: Lewis's PP is controversial; the Friend isn't *totally* wrong that it reduces to rational updating, but the *constraint* on what counts as admissible is the metaphysical heavy lifter).

  *(Self-Correction during drafting)*: Wait, if I give them a note saying "This token is Red," have I changed the chance? No, the chance of *selection* was 60%. The chance of *this specific token being Red* is now 100% (it's a fact). Lewis distinguishes *future* chance vs *present* fact.
  *Correction:* To make PP work, the Chance proposition must be about the *setup* prior to the inadmissible evidence.
  *Better phrasing:* "The chance *at the start of the round* was 60%."
  *Actually, the cleanest way:* The note is a "prophecy" from a reliable oracle, not a peek. A peek makes it a *fact*, not a chance event anymore.
  *Decision:* Use the "Peek" but frame it as "Inadmissible Evidence." Lewis classifies seeing the future as inadmissible. Even if it makes the probability 1, the *Chance* (propensity of the setup) remains 0.6.
  *Wait, if I look at the token, it's no longer a chance event.* It's a revealed fact.
  *Okay, to save the PP:* The PP applies to *future* contingents. If I look at the token, it's no longer contingent.
  *Alternative:* The note is from a "Psychic" who is 100% reliable. This keeps the event contingent (in theory) but provides inadmissible evidence.
  *Practical Class Version:* The "Peek" is easier to execute. I will frame it as: "The setup dictates a 60% chance. Your evidence dictates 100% certainty. PP says: Follow evidence, but acknowledge the setup's chance hasn't changed."
  *Okay, I will stick with the Peek but emphasize the distinction between 'Propensity of the Device' and 'Rational Credence'.*

  *Let's refine the Scoring:* Brier score is $(p-o)^2$.
  If $o=1$ (Win) and $p=1.0$, Score = 0 (Perfect).
  If $o=1$ and $p=0.6$, Score = 0.16.
  If $o=0$ and $p=1.0$, Score = 1.0 (Disaster).
  This penalizes overconfidence heavily. Good.
  Formula for points: $100 - 100 \times (p - o)^2$.
  Example: $p=1, o=1 \rightarrow 100$ pts. $p=0.6, o=1 \rightarrow 84$ pts. $p=1, o=0 \rightarrow 0$ pts.
  This is computable by hand.

  *Final check on the Friend's argument:* The friend says the admissibility clause is "doing all the work while being basically empty."
  *My verdict:* The clause isn't empty; it's *substantive*. It rules out crystal balls. The game shows that if you *have* a crystal ball (the note), you ignore the chance. The Friend thinks this is trivial. The User thinks it's metaphysical. The truth: It shows that Chance is not the *only* guide to credence. The "Bite" is that rational agents *diverge* from chance.
  *Okay, I have enough to write.*
answer: |-
  Here is a complete lesson plan designed to settle the bet, run within your constraints, and force the admissibility clause to do visible work.

  ### The Activity: "The Admissibility Auction"

  **Core Mechanic:** Students report two numbers every round: their **Credence** (what they believe will happen) and their estimate of the **Chance** (what the device's setup dictates). They are scored on Credence accuracy. The "bite" happens when Credence and Chance diverge rationally.

  #### 1. Materials List
  *   **Physical Device:** Two opaque cups/bags (Cup A, Cup B).
      *   **Cup A:** 6 Red tokens, 4 Blue tokens (60% Chance).
      *   **Cup B:** 5 Red tokens, 5 Blue tokens (50% Chance).
      *   *Note:* Tokens must be identical to the touch.
  *   **Printer:** 30 Scorecards (template below), 6 "Insider Notes."
  *   **Whiteboard:** To track public scores and the "Chance" declaration.
  *   **Laptop:** For you to track the master key (which token was drawn) and calculate final extra credit.
  *   **Writing Utensils:** For students.

  #### 2. Scorecard Template (Print 30)
  ```text
  NAME: ___________________
  ROUND 1 | Declared Chance: ___% | My Credence: ___% | Outcome (0/1): ___ | Score: ___
  ROUND 2 | Declared Chance: ___% | My Credence: ___% | Outcome (0/1): ___ | Score: ___
  ROUND 3 | Declared Chance: ___% | My Credence: ___% | Outcome (0/1): ___ | Score: ___
  TOTAL POINTS: _______
  ```
  **Scoring Rule (Printed on card):**
  *   **Outcome:** 1 = Red (Win), 0 = Blue (Lose).
  *   **Your Score:** $100 - 100 \times (\text{Credence} - \text{Outcome})^2$.
      *   *Example:* If you say 100% (1.0) and Win (1), Score = 100.
      *   *Example:* If you say 100% (1.0) and Lose (0), Score = 0.
      *   *Example:* If you say 60% (0.6) and Win (1), Score = 84.
  *   **Declared Chance:** Not scored, but must be filled out to get round credit.

  #### 3. Timeline (75 Minutes)

  **0:00 – 0:10: Setup & Rules**
  *   Display Cup A. Count tokens publicly: 6 Red, 4 Blue.
  *   Explain the Scoring Rule. Emphasize: **Maximize points.** To get max points, your Credence must match the Outcome.
  *   Explain the Two-Column Requirement: They must record the **Chance** (property of the cup) and their **Credence** (personal belief).
  *   **Crucial Instruction:** "The Chance is what the cup dictates. Your Credence is what you bet on. They can be different."

  **0:10 – 0:25: Round 1 (Baseline)**
  *   **Setup:** Cup A is on the table.
  *   **Action:** You shake Cup A. Students fill out "Declared Chance" (should be 60%) and "My Credence."
  *   **Draw:** Pull one token. Reveal it. Record Outcome (1 or 0).
  *   **Calculation:** Students calculate Score for Round 1.
  *   **Goal:** Establish that without special info, Credence $\approx$ Chance.

  **0:25 – 0:40: Round 2 (The Bite)**
  *   **Setup:** Cup A is reset (6R, 4B).
  *   **The Move:** Select 5 students ("Insiders"). Hand them a sealed note. Tell the class: *"These notes contain information about the outcome of this draw. The rest of you ('Outsiders') have no new info."*
  *   **The Note:** "I have peeked at the token in the cup. It is RED." (You actually peeked before class or during the shake).
  *   **Action:**
      *   **Outsiders:** Declare Chance 60%. Credence should stay near 60%.
      *   **Insiders:** Declare Chance 60% (The cup hasn't changed!). Credence should jump to 100%.
  *   **Draw:** Reveal the token (Make sure it matches the note).
  *   **Calculation:** Insiders should get 100 pts. Outsiders get ~84 pts.
  *   **Visual Check:** Ask Insiders to raise hands if their Credence was >80%. Ask Outsiders to raise hands if theirs was <70%. The split must be visible.

  **0:40 – 0:55: Round 3 (The Swap)**
  *   **Setup:** **Swap Cup A for Cup B** (50/50) in plain sight.
  *   **The Move:** Insiders keep their notes from Round 2? **No.** Collect Round 2 notes. Hand Insiders *new* notes.
  *   **The Note:** "This token is RED." (You peeked at the token *in Cup B*).
  *   **Action:**
      *   **Outsiders:** See Cup B. Declare Chance 50%. Credence 50%.
      *   **Insiders:** See Cup B. Declare Chance 50%. Credence 100%.
  *   **Draw:** Reveal token.
  *   **Calculation:** Final scores.

  **0:55 – 1:15: Debrief & Verdict**

  #### 4. The Debrief (Mapping to the Principle)

  This is where you settle the argument. Write three columns on the board: **Chance**, **Evidence**, **Credence**.

  **Step 1: Analyze Round 2 (The Bite)**
  *   Ask an Insider: "You wrote Chance 60%, Credence 100%. Why?"
  *   *Desired Answer:* "The cup is still 60/40, but I know the future."
  *   **Point for You:** This validates the Admissibility Clause. The Principal Principle says $C(A|XE) = x$ *only if E is admissible*. Here, $X$ = 60%, $E$ = "It is Red." $E$ is inadmissible (it's about the future outcome itself). Therefore, $C \neq x$.
  *   **The Friend's Objection:** "See? They just trusted the Note-Expert over the Cup-Expert."
  *   **Your Counter:** "If it were just expert weighing, they might average them (80%). But rationality demands they ignore the Chance *for credence* while acknowledging the Chance *for truth*. The Chance didn't vanish; it was overridden. The clause isn't empty; it's a **firewall**."

  **Step 2: Analyze Round 3 (The Revision)**
  *   Ask an Insider: "The Cup changed to 50%. Did your Note change?"
  *   *Desired Answer:* "No, the Note is about the token, not the cup."
  *   **Point:** This shows Chance is a property of the *setup*, Credence is a property of the *agent*.
  *   **The Friend's Objection:** "If the Note is reliable, why do we need 'Chance' at all?"
  *   **Your Counter:** "Because most of the time (Rounds 1 & 3 for Outsiders), we *don't* have the Note. Chance is the guide for life when inadmissible evidence is absent. The Principle tells us when we are allowed to abandon the guide."

  **Step 3: The Verdict (Honest Assessment)**
  *   **Who Won?** You win on the **technical metaphysics**, your friend wins on the **pragmatic intuition**.
  *   **Why You Win:** The game demonstrates that rational credence can *diverge* from objective chance without denying the chance. That divergence *requires* the admissibility clause. Without it, the Principal Principle is false (because $C \neq Ch$). So the clause is doing non-empty work: it is the condition under which the equality holds.
  *   **Why He Has a Point:** In practice, "inadmissible evidence" just looks like "better evidence." The metaphysical distinction (evidence about the future vs. evidence about the setup) collapses into an epistemic hierarchy.
  *   **The Synthesis:** Tell the class: "My friend thinks this is just 'listen to the better source.' I think this is 'Chance is a worldly constraint that sometimes gets bypassed.' The game shows the bypass. Whether that bypass is 'metaphysical' or just 'pragmatic' is the remaining debate."

  #### 5. Troubleshooting (What Goes Wrong)

  **Problem 1: Risk Aversion.**
  *   *Symptom:* Insiders get a "Red" note but write Credence 80% because they fear you're lying.
  *   *Recovery:* Mid-game, announce: "The Notes are 100% accurate for this exercise." If they still hesitate, the scoring rule is too punitive. Remind them: "If the note is true, 100% is the only maximizing move."

  **Problem 2: Confusing Chance and Credence.**
  *   *Symptom:* Insiders write Chance 100% in Round 2.
  *   *Recovery:* Stop the class. "If I put the token back and reshuffled, would the chance be 100%? No. The Chance is about the *process*, Credence is about the *specific event*." Force them to correct it. This is the teachable moment.

  **Problem 3: Scoring Takes Too Long.**
  *   *Symptom:* Students fumble the squared error math.
  *   *Recovery:* Put the lookup table on the whiteboard.
      *   If Outcome 1: Credence 1.0=100pts, 0.8=96pts, 0.6=84pts, 0.5=75pts.
      *   If Outcome 0: Credence 0.0=100pts, 0.2=96pts, 0.4=84pts, 0.5=75pts.
      *   Let them just look it up.

  #### 6. Limitations (The Mind-Independence Cost)

  **Your Suspicion is Correct.**
  This activity cannot reproduce chance being truly mind-independent because *you* are the one stipulating the ratios and peeking at the tokens. To the students, "Chance" is just "What the TA says is in the cup."

  **The Cost:**
  A skeptical student (or your friend) can argue: "The Chance wasn't in the world; it was in your announcement. If you announced 60% but put 10 Reds in, the 'Chance' was a lie."
  *   **Mitigation:** Acknowledge this openly in the debrief. "In this game, I am God. In the real world, Physics is God. The Principal Principle claims Physics works like this Cup: it sets constraints that bind us unless we have a 'peek' (inadmissible evidence). You have to take my word that the Cup is a model for the World."
  *   **Philosophical Cost:** You are teaching *Lewis's* Principal Principle, which assumes Humean Supervenience (chances supervene on patterns of events). By making the chance stipulated by you (the observer/organizer), you are actually modeling a **Primitivist** view of chance (it's a brute fact I tell you). This subtly undermines the Humean motivation for PP, but it doesn't break the logic of the admissibility clause.
  *   **How to Spin It:** "The fact that you have to trust me about the Cup's constitution is exactly the problem of induction. We assume the world has 'Chances' like this Cup. PP tells us how to use them."

  ### Summary for Your Argument
  Take this to your friend:
  1.  **The Clause Bites:** In Round 2, rational students *must* violate $C = Ch$. The only way PP remains true is if the admissibility clause excludes the Note. Therefore, the clause is not empty; it is the *save* that keeps the principle from being falsified by the game.
  2.  **Expert Deference is Insufficient:** If it were just expert deference, students should weight the Cup (60%) and the Note (100%). But the Note *screens off* the Cup. That lexical priority is the metaphysical work.
  3.  **The Win:** You win because the game forces a distinction between **Truth of the Chance Claim** (The cup is 60/40) and **Rationality of the Credence** (I believe 100%). Your friend's view collapses these two. The game keeps them apart.
