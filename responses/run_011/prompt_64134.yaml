answer: |-
  The laboratory occupies the basement of the district general, separated from the morgue by a corridor of linoleum that peels at the seams. My station is a desk of grey laminate positioned between the four beds. On the desk sits the printer, a boxy unit wired into the main polygraph amplifiers. It does not print continuously. It waits. When I press the brass button on the bedside console, triggered by the subject's first vocalization upon waking, the unit feeds a strip of thermal paper. It prints a ninety-second digest: EEG voltage, EOG movement, submental muscle tone. It stamps the time. It creates a ledger against which the dictated tape can be reconciled.

  My job is not to interpret the brain waves. The scientists do the scoring. They take the master rolls, the long continuous trails of ink on paper that spill into cardboard boxes, and they divide them into thirty-second epochs. They mark each epoch with a pencil: Stage 1, Stage 2, REM, Wake. They look for the sawtooth waves, the sleep spindles, the rapid eye movements that define the state. My job is the reconciliation. I take the typed transcript from the tape recorder and I clip it to the ledger strip. I check the timestamps. I mark the data column.

  Subject 402 arrived at 22:00. Electrodes applied with collodion. Impedance checked below 5,000 ohms. He slept quickly. At 03:14, the monitor showed a shift in frequency. The protocol dictates an awakening if the subject has been in a stable state for at least ten minutes. I spoke through the intercom. Subject 402 responded immediately. I pressed the brass button. The printer whirred.

  The transcript runs to eleven minutes of continuous speech. He describes a warehouse. He describes walking down aisles of stacked crates. He describes the texture of the wood, the smell of dust, the presence of a man in a grey coat who does not speak. The narrative is spatially continuous. There are no jumps. He uses the present tense initially, then shifts to the past as he settles into the chair.

  I attached the ledger strip to the transcript. The digest covers the ninety seconds prior to his first vocalization and the two minutes following. The EEG trace on the ledger is flat and regular. The frequency is 10 Hertz. The amplitude is consistent. It is alpha rhythm. The EOG shows slow rolling movements, not the sharp saccades of REM. The EMG shows tone consistent with sitting upright. The ledger indicates Wakefulness. There is no sleep stage marked on the digest. There is no REM period within fifteen minutes of the report.

  According to the study cutoff, a report is valid only if it occurs within five minutes of the cessation of the physiological state being investigated. Here, the physiological state was Wake. The report claims Dream. I filed the transcript under D for Dream Report, as per the subject's assertion. I filed the ledger under W for Wake. I placed a yellow flag on the folder. The discrepancy is not an error in the machine. The machine recorded the brain waves while he spoke. He was awake while he described the warehouse. The experience he describes has no physiological correlate in the record prior to the waking.

  Subject 409 arrived at 21:30. She was a frequent volunteer, familiar with the protocol. She entered Stage 2 sleep at 23:00. Her first REM period began at 01:45. At 02:15, the REM density was high. The eyes were moving rapidly beneath the lids. The chin muscle tone was absent. This is the definition of the state. I initiated the awakening protocol.

  I spoke her name. She responded within four seconds. I pressed the brass button. The printer whirred. I asked the standard question: "What was going through your mind?"

  She answered fluently. Her voice was clear. She said, "Nothing at all. Not even a blank. Just black."

  I recorded the response. She remained in the chair. The protocol allows for a return to sleep if the subject desires and the time permits. She closed her eyes. I monitored the roll. The ink traced the same pattern as before. The frequency remained low voltage, mixed frequency. The EOG continued to show rapid movements. The EMG remained atonic. The scoring technician would mark this as continuous REM. There was no epoch marked as Wake. There was no arousal spike in the EEG trace sufficient to break the stage.

  At 02:26, eleven minutes after the first awakening, I woke her again. The ledger shows the REM period was unbroken between the two vocalizations. The printer whirred. I asked the standard question.

  She said, "I was in a house. It was my house but the rooms were rearranged. I was standing in the hallway. You woke me up. I told you there was nothing. Then I went back to the hallway. The man in the grey coat was there. He was waiting."

  She describes the first awakening. She describes the interval. She describes the resumption of the narrative. The ledger shows continuous REM sleep throughout the interval she describes as waking and speaking. The ledger shows she was asleep when she said she was awake. The ledger shows she was asleep when she said there was nothing. The ledger shows she was asleep when she described the house.

  I sat with the two files open. The lamp hums. The paper smells of ozone and old ink. The study requires a verdict in the data column for every subject. There are three boxes printed at the bottom of the reconciliation sheet.

  The first box reads: Experience Occurred.
  The second box reads: No Experience Occurred.
  The third box reads: Not Determinable.

  For Subject 402, the report says Experience. The ledger says Wake. If he was awake, he was not dreaming. He was constructing a narrative while awake. If he was constructing a narrative while awake, the report is not evidence of sleep experience. It is evidence of waking imagination. But he insists he was asleep.

  For Subject 409, the ledger says Sleep. The first report says No Experience. The second report says Experience. The second report includes the first report as an event within the experience. If the ledger is correct, she was asleep when she denied being asleep. If the report is correct, the ledger failed to detect the waking. If the ledger failed to detect the waking, the ledger cannot be trusted to define the state in which the experience occurred.

  I dipped my pen in the inkwell. The nib is steel. It scratches on the cardstock. I looked at the box for Experience Occurred. To mark this is to trust the transcript over the ledger for 402, and the transcript over the ledger for 409. I looked at the box for No Experience Occurred. To mark this is to trust the ledger over the transcript for 402, and the ledger over the transcript for 409. I looked at the box for Not Determinable. To mark this is to admit the ledger and the transcript measure different things.

  The clock on the wall ticked. The second hand moved in discrete jumps. I held the pen over the paper. The ink gathered at the tip, a dark sphere waiting to fall. I did not mark the box. I closed the folder. I placed it in the stack for the morning scientist. I turned off the lamp. The room was dark. I did not know if I was awake.

  ***

  **Editor's Note**

  To the Editor,

  Regarding the epistemological tensions in the piece:

  **Settled Consensus:** Polysomnography reliably distinguishes sleep stages (REM vs. NREM) based on EEG, EOG, and EMG criteria. Awakening yield rates are significantly higher from REM sleep than NREM sleep. Recall is fragile; reports collected later are subject to contamination. Lucid dreaming signalling (pre-arranged eye movements during REM) is empirically verified and proves some conscious processing occurs during sleep.

  **Contested Philosophy:** Whether non-lucid sleep involves *phenomenal consciousness* (something it is like to be asleep) remains disputed. Norman Malcolm's argument is grammatical/conceptual (dream reports are not descriptions of prior experiences), whereas Dennett's is empirical/memory-based (retrospective confabulation). The existence of lucid signalling challenges strong Dennettian confabulation models, but does not settle the status of non-lucid dreams. Malcolm's claim is often read as denying the *experience*, not just the memory.

  **Inventions & Leans:**
  1.  **The Digest Printer:** This device is fabricated. Real labs match timestamps manually between polygraph rolls and audio tapes. I invented the printer to physicalize the "ledger" vs. "transcript" conflict.
  2.  **Case 2 Physiology:** A subject answering fluently would typically show EEG arousal (alpha intrusion). I depicted the ledger as showing "unbroken REM" despite verbal response to heighten the tension between physiological definition and first-person authority. This leans into the philosophical problem rather than standard sleep medicine.
  3.  **Case 1 Physiology:** A subject dictating for 11 minutes while "asleep" is impossible; I made him physiologically awake to support the confabulation hypothesis.
  4.  **The Three Boxes:** Study data columns do not typically offer these specific metaphysical options; this is a narrative device to force the verdict.

  The story avoids taking a side, leaving the technician unable to reconcile the first-person authority of the report with the third-person authority of the measure.
