      *   *My Commitment:* I need to argue which one is the *actual* operating theory. It's likely a mix, but the *functional* theory is Option A (Endogenous Norms) disguised as Option C. Option B is the moral consequence, not necessarily the legal justification. I will argue the law treats cruelty as a *violation of social/industry expectation*, not a *measure of suffering*.

