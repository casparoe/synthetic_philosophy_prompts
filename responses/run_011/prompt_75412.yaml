      *   *Key Insight:* The "customary practice" exemption isn't just a safe harbor; it's a definitional exclusion. It says "This is not cruelty."
      *   *Refining the Malpractice Point:* Make sure to emphasize the *constitutive* vs. *evidentiary* distinction. That's the philosophical crux.
