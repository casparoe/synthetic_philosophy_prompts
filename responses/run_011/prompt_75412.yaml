      *   *Defense:* Can it be defended on legal grounds? Yes, on vagueness/delegation grounds, but not on moral grounds.
      *   *Final Stance:* The statute is a political compromise masquerading as a moral definition. It treats cruelty as a status of the *act's social legitimacy*, not the *animal's experience*.

