      *   Did I address the friend vs. user debate? Yes.

  *(Self-Correction during drafting)*: I need to be careful not to say *all* states are identical. Some states (like California) have stricter laws. I should frame this as the *dominant* model in American jurisprudence, acknowledging the variation as a caveat.
  Also, I need to make sure I don't just say "the law is bad." I need to analyze *what theory it embodies*. The theory is likely a form of Legal Positivism mixed with Utilitarianism regarding *human* interests, ignoring animal utility.

  *Decision on the "Commitment":* I will argue that the law embodies a **Social Functionalist** theory of cruelty. Cruelty is not about pain; it's about *disorder*. If the pain serves a recognized social function (food), it is order (husbandry). If it serves a marginalized function (fighting) or no function (trespasser beating cow), it is disorder (cruelty). This sides with the Friend (cruelty is about the agent/context) but rejects the Friend's implication that it's about *malice*. It's about *social license*.

