answer: |-
  The spine of the session is that Mill's liberalism is developmental rather than universal, and his India career is the laboratory where this distinction was forged, not the exception that proves the rule.

  **Session Plan and Order of Components**

  **1. The Textual Hook (0–10 minutes)**
  Begin with *On Liberty*, specifically Chapter 1, paragraph 10 (the 'despotism' clause). Ask the room to read it silently. Do not interpret it yet. Ask only: 'Does this sentence look like a contradiction to you, or a clarification?' This satisfies the pedagogical necessity of starting with the text they have read to secure engagement, but you must refuse to let them settle on an answer. This heads off the student who claims the India material is an **aberration**; by placing the clause in the first chapter, you demonstrate it is foundational to the argument, not a late-added caveat. Leave the question hanging.

  **2. The Institutional Fact (10–25 minutes)**
  Move immediately to the whiteboard and map Mill's career: East India Company (1823–1858), Chief Examiner of Indian Correspondence. Draw the line between his philosophical output and his daily labour. Explicitly state that for thirty-five years, his 'free and equal discussion' was confined to London, while his desk managed the governance of millions without their consent. This is the load-bearing wall. You must validate the suspicion that the institutional fact must precede the textual analysis: without knowing he was the administrator, the clause reads as hypocrisy; knowing he was the administrator, it reads as policy.
  *   **Misconception Head-off (The Chennai Student):** When describing the Company's power, acknowledge the asymmetry. State clearly: 'For us, Mill is a philosopher who happened to work in India; for the people of India, Mill was a bureaucrat who happened to write philosophy.' This validates the student who finds the framing bizarre by acknowledging that the module's centre of gravity (Mill) is inverted relative to the historical reality (Colonial Rule). Do not argue this point; state it as a methodological boundary.
  *   **Misconception Head-off (Racism/Packaging):** When explaining his role, frame his defence of the Company not as racial hatred but as 'utilitarian paternalism'. He believed British rule was a temporary tutorship. This pre-empts the claim that liberalism is merely packaging for racism; it positions racism (or civilizational hierarchy) as the engine of the liberalism, not the wrapper.

  **3. The Carrying Case: The Defence of Company Rule (1853–1858) (25–55 minutes)**
  Do not use the 1857 Rebellion; it collapses the session into trauma and violence, obscuring the theoretical logic. Instead, use Mill's **drafting of the dispatches during the Charter Renewal debates**.
  *   **The Setup:** Mill argued against handing control to the Crown (Parliament). He argued the Company (a body of experts) should retain absolute power.
  *   **The Conflict:** This directly contravenes *On Liberty*'s domestic standard (participation improves character). Mill knew this. In his evidence, he argued Indians were not yet capable of representative government.
  *   **The Requirement:** The case must show Mill defending an action (expert despotism) that would fail his domestic standards (liberty) while arguing this failure is necessary for future success (improvement).
  *   **Activity:** Write two columns on the board: 'Britain' and 'India'. Under Britain, write 'Liberty, Representation, Harm Principle'. Under India, write 'Despotism, Expertise, Improvement'. Ask the students to populate the columns based on the case details you provide.
  *   **Misconception Head-off (Man of his Time):** When a student suggests he was 'just a Victorian', point to the specific debate. He was arguing against contemporaries who wanted *more* democratic control (Crown/Parliament). Mill was defending an *oligarchy* of experts against a *democracy* of voters. This shows he was making a specific theoretical choice, not merely absorbing the zeitgeist.

  **4. Synthesis and Scope Conditions (55–70 minutes)**
  Return to *On Liberty*. Re-read the opening clause. Ask the room to reconcile the two columns on the board with the text. The resolution is that *On Liberty* is not a universal claim but a scalar one: liberty is the goal, but despotism is the means for those not yet at the scale of 'civilisation'.
  *   **Misconception Head-off (Racism/Packaging - Reinforcement):** Clarify that this makes the liberalism *more* coherent but *less* palatable. It is not a contradiction; it is a conditionality.

  **5. The Final Question (70–75 minutes)**
  Ask this single question to test grasp: **'If Mill encountered a society he deemed "uncivilised" that successfully organised itself without British rule, would his principle compel him to withdraw, or does the principle itself contain a barrier they cannot cross?'**
  *   **Reasoning:** This separates 'Mill contradicted himself' (he should have withdrawn but didn't) from 'Mill's principle has a scope condition' (the principle defines who is eligible to withdraw). If they answer that Mill would demand proof of 'civilisation' before withdrawing, they understand the scope condition. If they answer that he simply wouldn't withdraw because he was a racist, they have reverted to the contradiction model.

  **Time Loss Contingency**
  If you lose twenty minutes, cut the **Carrying Case details**. You can describe Mill's defence of the Company in five minutes rather than thirty. You cannot cut the **Institutional Fact**. If the students leave without understanding that Mill *was* the Company administration, the *On Liberty* clause collapses back into a stray apology for racism, and the entire theoretical architecture fails. The biography is the key that unlocks the text; the case is merely the illustration of the lock turning.

  **Open Refusals**
  In the first five minutes, explicitly state two things you will not do:
  1.  **Judgement of Material Outcomes:** 'We will not be debating whether Company rule was economically beneficial or materially destructive; that is economic history, and we are doing political theory.'
  2.  **Modern Critical Vocabulary:** 'We will not be using terms like "orientalism" or "subaltern"; those frameworks did not exist for Mill, and using them now risks anachronism. We are analysing the internal logic of his justification, not applying a later critique.'
  This protects you from the historiography of Company rule and acknowledges the limits of second-year vocabulary in week four without talking down to the room.
