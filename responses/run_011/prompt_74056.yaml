      *   **Task:** Write a dissertation chapter proposal based on this idea.
      *   **Required Elements:**
          *   Precise research question.
          *   Critique of the standard framing (why it's insufficient).
          *   Methodology/Plan (taxonomy of belief-types by propagation, argument that duty tracks propagation).
          *   Criteria for success (what a satisfying answer looks like).
