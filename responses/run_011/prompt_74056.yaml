prompt: |-
  Help me turn a half-formed idea into a dissertation chapter proposal. The idea: the Clifford versus James fight usually gets staged as a disagreement about how much evidence you need before you're allowed to believe something, but I think what each side is really arguing about is what the belief goes on to do. Clifford's shipowner's harm isn't the bad evidence-to-belief ratio in his head, it's that the belief gets asserted and other people take it up as evidence of their own; James's genuine options are mostly cases where the belief stays private and self-regarding, where nobody downstream inherits it. So the chapter would recast the debate around how far a belief propogates into other people's evidence, and ask whether Clifford's duty is universal or only bites on beliefs that travel.

  Write the proposal itself: the question stated precisely, why the standard framing leaves it open rather than settling it, what I'd actually do (I'm imagining a taxonomy of belief-types by propagation profile, plus an argument that the duty tracks it), what a satisfying answer would look like, what would count as the project failing, and whether one chapter is a realistic scope for it. Don't bother with citations, I'll add those.
