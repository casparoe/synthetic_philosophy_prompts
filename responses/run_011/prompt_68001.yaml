answer: |-
  ### Theory Corrections and Enum Validation

  Your paraphrases are surprisingly robust for a layman's summary. Here are the necessary corrections before we build the procedure:

  1.  **Kennedy Examples:** You have the shape right. The indicative ("If Oswald didn't kill Kennedy, someone else did") is accepted based on evidence (there was a conspiracy or a backup). The subjunctive ("If Oswald hadn't killed Kennedy, someone else would have") is rejected because there is no causal mechanism forcing a backup assassin. **Correction:** Verb form tracks *epistemic stance* (what we know) versus *causal stance* (how the world works), not just grammar.
  2.  **Adams/Indicatives:** Correct. Assertability depends on conditional probability $P(Y|X)$, not material truth. This is why false antecedents don't trivially make the claim true in practice.
  3.  **Lewis/Subjunctives:** Correct. Evaluation relies on "closest possible worlds." We hold the past fixed up to the point of divergence, then allow a minimal "miracle" to make the antecedent true.
  4.  **Subjunctive Antecedents:** Correct. While standard semantics assume a false antecedent for evaluation, subjunctives are used in *modus tollens* arguments where the antecedent's truth is initially unknown ("If it were raining, the ground would be wet. The ground is dry. Therefore, it is not raining.").

  **Regarding `divergence_class`:**
  This is not a standard semantic distinction, but it is a valid pragmatic cut known as **Intervention Depth**.
  *   **KNOB** maps to *Local Intervention*.
  *   **CHAIN** maps to *Upstream Dependency*.
  *   **REBUILD** maps to *Structural Counterfactual*.
  Keep the enum. It measures *cost to prevent*, which is what your funding model requires. Rename the field to `intervention_depth` to signal engineering cost rather than metaphysical divergence.

  ### The Decision Procedure

  This procedure prioritizes inter-rater reliability over philosophical completeness. It assumes the reviewer has access to the postmortem and basic telemetry metadata.

  **Verdicts (Closed Set)**
  1.  **FUNDED:** Actionable, high impact, causal link robust. *Justification:* "Prevents recurrence with acceptable cost."
  2.  **BACKLOG:** Actionable, low impact or high cost. *Justification:* "Valid prevention, deferred due to ROI."
  3.  **INVESTIGATE:** Antecedent status unknown, telemetry exists. *Justification:* "Fact pattern incomplete; requires data verification."
  4.  **REJECT_HYPOTHESIS:** Claim is about actual past history, not a prevention scenario. *Justification:* "Describes actual cause, not counterfactual prevention."
  5.  **REJECT_STRUCTURAL:** Antecedent requires `REBUILD` depth. *Justification:* "Architectural change exceeds quarterly scope."
  6.  **REJECT_INVALID:** Causal link broken (consequent happens anyway). *Justification:* "Intervention does not prevent claimed harm."

  **Ordered Tests**

  1.  **The Fact Check**
      *   *Question:* Is the antecedent (the "if" part) known to be false based on current logs?
      *   *Sufficient Answer:* Yes (it definitely didn't happen), No (it definitely happened), or Unknown (telemetry missing).
      *   *Verdict:* If **Yes**, proceed to Test 2. If **No**, verdict is **REJECT_HYPOTHESIS**. If **Unknown** and telemetry exists, verdict is **INVESTIGATE**.
      *   *Flag:* **Judgment Call.** Determining "known false" vs "unknown" requires interpreting log completeness.

  2.  **The Depth Check**
      *   *Question:* What is the `intervention_depth` (KNOB, CHAIN, REBUILD)?
      *   *Sufficient Answer:* Select from enum based on postmortem context.
      *   *Verdict:* If **REBUILD**, verdict is **REJECT_STRUCTURAL**. Otherwise, proceed to Test 3.
      *   *Flag:* **Judgment Call.** Distinguishing CHAIN from REBUILD can be subjective.

  3.  **The Causal Link**
      *   *Question:* If the antecedent were true, would the consequent (the harm) definitely be prevented?
      *   *Sufficient Answer:* Yes (direct cause), No (other factors cause harm anyway), or Maybe (unclear).
      *   *Verdict:* If **No**, verdict is **REJECT_INVALID**. If **Maybe**, proceed to Test 4. If **Yes**, proceed to Test 4.
      *   *Flag:* **Judgment Call.** This is the highest source of reviewer disagreement.

  4.  **The Blame Check**
      *   *Question:* Does the row name a specific person or a specific non-standard team decision as the primary cause?
      *   *Sufficient Answer:* Yes or No.
      *   *Verdict:* If **Yes**, hand off to **Reliability Council**. If **No**, proceed to Test 5.
      *   *Flag:* **Council Handoff.** This is a fairness/risk decision, not factual.

  5.  **The ROI Check**
      *   *Question:* Is the effort to implement the antecedent less than the cost of the incident recurring once?
      *   *Sufficient Answer:* Yes or No (use standard engineering week estimates).
      *   *Verdict:* If **Yes**, verdict is **FUNDED**. If **No**, verdict is **BACKLOG**.
      *   *Flag:* **Judgment Call.** Cost estimation is inherently uncertain.

  **Tie-Breaker Rules**
  *   **Causal vs. Depth:** If Test 2 suggests REBUILD but Test 3 suggests the link is robust, **REJECT_STRUCTURAL** wins. We cannot fund what we cannot build this quarter.
  *   **Investigate vs. Reject:** If Test 1 is Unknown but telemetry is expensive to retrieve, **REJECT_HYPOTHESIS** wins. We do not fund data digging via the reliability backlog.
  *   **Blame Ambiguity:** If Test 4 is ambiguous (e.g., names a role but not a person), default to **Council Handoff**. False negatives here cost political capital.

  **Discarded Theoretical Distinctions**
  *   **Truth Conditions for Indicatives:** We discard the debate over whether indicatives have truth conditions (Jackson vs. Adams). *Why Safe:* We care about assertability and utility for funding, not logical truth.
  *   **Subjunctive Logic Axioms:** We discard formal logic constraints (e.g., transitivity of counterfactuals). *Why Safe:* Natural language postmortems violate formal logic constantly; enforcing it would reject valid engineering insights.
  *   **The "Past Fixity" Constraint:** We loosely interpret Lewis's requirement to keep the past fixed. *Warning:* If a reviewer insists on strict physical determinism, CHAIN items will look like REBUILD. Train reviewers to accept "operational fixity" (what could we have changed at the time?) rather than physical fixity.

  **Limits and Triage Signals**
  This procedure will systematically misfile:
  1.  **Complex Systemic Interactions:** Where multiple small changes prevent failure, but no single one does. *Triage Signal:* Postmortem uses words like "resonance," "cascade," or "emergent."
  2.  **Human Behavior Prediction:** Where the antecedent requires a person to act differently under stress. *Triage Signal:* Antecedent contains "engineer noticed," "on-call called," or "team decided."
  3.  **Third-Party Black Boxes:** Where the antecedent relies on a vendor changing their behavior. *Triage Signal:* Antecedent mentions "vendor," "API limit," or "SLA."

  ---

  ### Procedure Execution on Sample Rows

  **Row 4471 (March Outage)**
  *Claim:* "If the migration had been applied before the deploy instead of after it, the connection pool would not have been exhausted and customers would not have seen errors."
  *Context:* Pool was at 80% before migration. Unrelated retry bug drives pool up. Pool exhausts in 20 mins regardless.

  1.  **Fact Check:** Antecedent (migration before deploy) is **Known False** (logs show deploy first). Proceed.
  2.  **Depth Check:** Changing deploy order is **KNOB** (process configuration). Proceed.
  3.  **Causal Link:** If migration was first, would errors be prevented? **No**. Telemetry shows pool exhausts in 20 mins due to retry bug. The deployment order delay was likely less than 20 mins. The consequent (no errors) is false even if antecedent is true.
  4.  **Verdict:** **REJECT_INVALID**.
  5.  **Justification:** "Intervention does not prevent claimed harm."
  *Audit Note:* This undercuts the team's argument. The row is semantically a what-if, but causally false. Funding based on this row wastes capacity on migration ordering when the retry bug is the actual driver.

  **Row 5102 (On-Call Submission)**
  *Claim:* "If the cache was cold when the traffic spike hit, the origin database took the whole load."
  *Context:* Parser filed as hypothesis. Antecedent status unknown. Telemetry exists.

  1.  **Fact Check:** Antecedent (cache was cold) is **Unknown**. Cache metrics exist but were not checked by submitter.
  2.  **Verdict:** **INVESTIGATE**. (Stops early).
  3.  **Justification:** "Fact pattern incomplete; requires data verification."
  *Audit Note:* Do not score this yet. Route to the team owning cache telemetry. Once verified: if cache was cold, it becomes a FUNDED or BACKLOG item (add warming). If cache was hot, it becomes REJECT_HYPOTHESIS (incorrect diagnosis). Do not allow funding until Test 1 is resolved.

  **Row 5290 (Vendor Incident)**
  *Claim:* "If we didn't depend on a third party for session validation, one vendor incident could not have taken down the product."
  *Context:* True claim, but requires architectural rewrite.

  1.  **Fact Check:** Antecedent (no third party dependence) is **Known False**. Proceed.
  2.  **Depth Check:** Building internal session validation replaces a core vendor dependency. This is **REBUILD** (different system we could not have had at the time).
  3.  **Verdict:** **REJECT_STRUCTURAL**. (Stops early).
  4.  **Justification:** "Architectural change exceeds quarterly scope."
  *Audit Note:* This is a valid strategic insight but invalid for the quarterly reliability backlog. Route to Architecture Council for long-term roadmap consideration. Funding this now would consume the team's capacity for three months on a non-quarterly goal.

  ### Summary of Operational Changes

  Your current grammar-based classifier is indeed the primary failure mode. It conflates *diagnostic indicatives* (Row 5102) with *preventive subjunctives* (Row 4471) and *strategic subjunctives* (Row 5290).

  By implementing the `intervention_depth` enum and the five-step procedure, you shift the ledger from a "claim collection" to a "prevention backlog." The most critical change is Test 3 (Causal Link). In Row 4471, the grammar was perfect ("had been... would not have"), but the engineering reality invalidated the claim. Your reviewers must be empowered to reject grammatically perfect rows where the physics of the system deny the consequence.

  Expect friction on Test 4 (Blame Check). Engineers often view naming a decision as factual, while managers view it as accusatory. Use the Council Handoff flag liberally in the first quarter to calibrate your team's sensitivity. It is cheaper to delay a row than to fund a political incident.

  Finally, enforce the **INVESTIGATE** verdict strictly. Do not allow "maybe" data to become funded work. Row 5102 is a classic capacity trap: teams will fund work to fix a cache problem that might not exist. Make data verification a prerequisite for scoring, not a byproduct of funding.
