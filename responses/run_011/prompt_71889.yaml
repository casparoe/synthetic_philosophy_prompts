answer: |-
  **DIAGNOSTIC SORTING INSTRUMENT: MINDS AND COMPUTATION**

  **N1.** An engineer hands you a complete, inspectable specification F of a system claimed to reproduce your arithmetical reasoning in full. She asks what you are entitled to conclude about yourself upon seeing F. Do you believe you can identify a statement true but unprovable in F?
    - **No, I trust F over my intuition.** → **N2**
    - **Yes, I can see the truth.** → **N3**

  **N2.** If you trust F, do you believe your reasoning is fully simulable by a Turing machine?
    - **Yes.** → **LEAF 1**
    - **No.** → **N4**

  **N3.** To see the truth of the Gödel sentence, must you know the exact code of your own mind?
    - **Yes, access is required.** → **N5**
    - **No, access is not required.** → **N6**

  **N4.** [Depends on N2] Is "mechanism" defined by Turing simulability or by governance under deterministic physical law?
    - **Turing Simulability.** → **LEAF 2**
    - **Deterministic Law.** → **N7**

  **N5.** [Depends on N3] Can you ever obtain that access in principle?
    - **No, self-reference blocks it.** → **LEAF 3**
    - **Yes, but not in practice.** → **LEAF 4**

  **N6.** Does establishing this truth require unbounded time and memory?
    - **Yes, only in principle.** → **LEAF 4**
    - **No, feasible in practice.** → **N8**

  **N7.** [Depends on N4] If the brain is deterministic but not Turing-simulable, why?
    - **Continuous real-valued dynamics.** → **LEAF 5**
    - **Exotic quantum-gravitational effects.** → **LEAF 6**

  **N8.** Consider a device that consults a genuine halting-problem oracle; its behavior is not Turing-computable. Does counting this device as a "machine" defeat the anti-mechanist argument for you?
    - **Yes, it counts as a machine.** → **LEAF 7**
    - **No, it is not a machine.** → **N9**

  **N9.** [Depends on N8] Must human reasoning be assumed consistent (no contradictions) for the argument to work?
    - **No, inconsistency is possible.** → **N10**
    - **Yes, consistency is required.** → **N11**

  **N10.** [Depends on N9] Imagine you make a simple arithmetic error. Does this imply your reasoning is inconsistent?
    - **Yes, error implies inconsistency.** → **LEAF 8**
    - **No, error is performance, not competence.** → **N11**

  **N11.** [Depends on N9] Must human reasoning be assumed sound (issues only truths), or is consistency enough?
    - **Consistency is enough.** → **N12**
    - **Soundness is required.** → **N13**

  **N12.** [Depends on N11] If you are consistent but unsound, does the argument hold?
    - **Yes.** → **LEAF 9**
    - **No.** → **LEAF 10**

  **N13.** [Depends on N11] If the argument succeeds, does this secure consciousness, freedom, or understanding?
    - **Yes, it secures these.** → **LEAF 11**
    - **No, it is merely technical.** → **N14**

  **N14.** [Depends on N13] Is the notion of mechanism refuted the one materialists actually care about?
    - **Yes, it matters.** → **LEAF 11**
    - **No, it is irrelevant.** → **LEAF 12**

  ***

  **LEAF DESCRIPTIONS**

  1.  **Strict Computationalist:** Accepts mind is Turing-computable. *Awkward:* Must deny intuition about Gödel sentences. [LIVE]
  2.  **Deterministic Compatibilist:** Accepts determinism but rejects Turing simulability. *Awkward:* Must explain non-computable deterministic physics. [LIVE]
  3.  **Epistemic Blocker:** Accepts argument but denies self-knowledge of code. *Awkward:* Limits reflective access severely. [LIVE]
  4.  **Idealization Critic:** Accepts argument only in principle. *Awkward:* Makes conclusion practically vacuous. [LIVE]
  5.  **Mundane Physicalist:** Attributes non-computability to continuous dynamics. *Awkward:* Analog noise limits arithmetic precision. [LIVE]
  6.  **Exotic Physicalist:** Attributes non-computability to quantum gravity. *Awkward:* No evidence for macroscopic quantum effects. [RARE]
  7.  **Oracle Machine Accepter:** Accepts oracle devices as machines. *Awkward:* Redefines mechanism beyond Turing. [RARE]
  8.  **Inconsistent Reasoner:** Accepts human reasoning is inconsistent. *Awkward:* Arithmetic truths become unstable. [RARE]
  9.  **Unsound Reasoner:** Accepts mind is consistent but unsound. *Awkward:* Implies we systematically believe falsehoods. [RARE]
  10. **Technical Anti-Mechanist:** Accepts argument but denies soundness premise helps. *Awkward:* Weakens the anti-mechanist claim. [VACANT]
  11. **Freedom Securer:** Accepts argument and claims it saves freedom. *Awkward:* Links logic directly to metaphysics. [LIVE]
  12. **Deflated Anti-Mechanist:** Accepts argument but denies it matters for materialism. *Awkward:* Dismisses central philosophical stake. [LIVE]

  ***

  **THE GRID: UNOCCUPIED COMBINATIONS**

  1.  **Inconsistent Reasoner + Soundness Premise Accepted:** Incoherent. One cannot claim the mind is inconsistent while requiring it to be sound for the argument to proceed.
  2.  **Strict Computationalist + Non-Computable Physics:** Incoherent. If the mind is computable, the physics sustaining it must be simulable.
  3.  **Oracle Machine Accepter + Exotic Physicalist:** Unattractive. If oracle machines count as machines, positing exotic physics to escape mechanism is unnecessary.
  4.  **Idealization Critic + Freedom Securer:** Unattractive. A conclusion holding only for idealized agents secures no freedom for actual humans.
  5.  **Epistemic Blocker + Mundane Physicalist:** Unoccupied. Nobody has bothered to combine self-ignorance with analog dynamics specifically.

  ***

  **SEPARABILITY AUDIT**

  1.  **Pair:** Mundane Physicalist (Leaf 5) vs. Exotic Physicalist (Leaf 6).
      *   **Indistinguishability:** Both answer "No" to Turing simulability and "Deterministic Law" to mechanism.
      *   **Further Question:** "Is the source of non-computability continuous variables or discrete quantum events?"
      *   **Honesty Judgement:** Students can answer honestly; this is a physics claim, not a philosophical stance.
  2.  **Pair:** Idealization Critic (Leaf 4) vs. Epistemic Blocker (Leaf 3).
      *   **Indistinguishability:** Both deny the argument's practical force based on access limits.
      *   **Further Question:** "Is the limit due to time constraints or structural self-reference?"
      *   **Honesty Judgement:** Difficult. Students may guess which camp fits the seminar's expected debate better.

  ***

  **MIS-SORTING NOTES**

  1.  **N1 (Engineer Spec):** An overconfident student may claim they can see the truth without understanding the specification, sorting them as anti-mechanist erroneously.
  2.  **N8 (Oracle Device):** A strategically motivated student may define "machine" narrowly to force a leaf that matches their pre-existing metaphysical preference.
  3.  **N10 (Error Case):** A careless student may conflate occasional arithmetic error with logical inconsistency, sorting them into the Inconsistent Reasoner leaf unfairly.
