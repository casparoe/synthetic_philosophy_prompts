          *   *Status:* Prejudice of the secular/empirical camp (but necessary for credibility).
      *   *Requirement 5: Non-Arbitrary Unit of Analysis.*
          *   *Motivation:* Progress for "The West" might be regression for "The Global South." Why choose humanity over civilization?
