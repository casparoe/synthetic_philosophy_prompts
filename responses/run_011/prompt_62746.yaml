answer: |-
  ### Specification of Desiderata for a Theory of Historical Progress

  To construct a research program capable of surviving the scrutiny of a skeptical historian, the following specifications define the necessary conditions for a valid theory of long-run moral and political progress. These are divided into **Non-Negotiable** requirements (conditions without which the claim collapses into Whig interpretation or metaphysics) and **Prejudices of One Camp** (philosophical commitments that narrow the scope but are contestable).

  #### 1. The Reversibility Condition (Ex Ante Identifiability)
  *   **Motivation:** A theory that identifies progress only after a trend has persisted commits survivorship bias. If the abolition of slavery is only "progress" because it stuck, then a successful slave rebellion in 1865 that re-enslaved the population would retroactively make the abolition attempt a neutral event or a failure. To claim progress, one must be able to specify what a *reversal* would look like in real-time.
  *   **Status:** **Non-Negotiable.**
  *   **Specification:** The account must provide criteria to distinguish between a temporary fluctuation and a structural reversal *before* the long run has concluded. It must define the conditions under which a gain (e.g., franchise expansion) would be classified as lost, independent of whether the loss becomes permanent.

  #### 2. The Archimedean Condition (Non-Endogeneity of Standards)
  *   **Motivation:** This addresses the core Whig accusation: that we judge the past by the standards of the present, which are themselves the product of the history being judged. If "freedom" is defined by 21st-century liberal democracy, finding more "freedom" in 2024 than in 1724 is tautological.
  *   **Status:** **Non-Negotiable.**
  *   **Specification:** The normative standard used to measure improvement cannot be derived solely from the prevailing values of the endpoint of the historical sequence. The theory must posit a metric (e.g., reduction of suffering, increase in agency, informational complexity) that is intelligible to an observer outside the specific historical trajectory being measured.

  #### 3. The Compensation Condition (Accounting for Costs)
  *   **Motivation:** Aggregate improvements often rely on the immiseration of specific groups (e.g., industrial progress built on colonial extraction or proletarian suffering). A theory that ignores the distribution of costs is morally blind and historically inaccurate.
  *   **Status:** **Non-Negotiable.**
  *   **Specification:** The account must specify what is owed to those who bore the costs of a process whose aggregate looks like improvement. It must determine whether progress is invalidated if it is purchased at the expense of a minority, or if a "net positive" suffices. It cannot treat victims of progress as mere friction.

  #### 4. The Non-Teleological Condition (No Fixed Endpoint)
  *   **Motivation:** Claims of a pre-determined endpoint (e.g., the "End of History," the Communist Utopia, the Kingdom of God) rely on metaphysical assumptions that skeptical historians reject as religious survivals.
  *   **Status:** **Prejudice of the Secular/Empirical Camp.**
  *   **Specification:** The account must dispense with a final state of rest. Progress must be conceptualized as a vector or a gradient, not a destination. The theory must remain valid even if the process continues indefinitely without resolution.

  #### 5. The Unit of Analysis Justification
  *   **Motivation:** Progress for "Western Civilization" may be regression for "Humanity." Progress for "The State" may be regression for "The Individual." Choosing a unit of analysis arbitrarily rigs the results.
  *   **Status:** **Non-Negotiable.**
  *   **Specification:** The theory must explicitly justify its unit of analysis (humanity, civilization, institution, individual) and explain why this choice is not arbitrary. It must address the aggregation problem: how to weigh progress in one unit against regression in another.

  #### 6. The Mechanism Condition (Causality vs. Correlation)
  *   **Motivation:** Noting that cruelty has retreated is not explaining *why*. Without a mechanism, the trend could be accidental, making the claim to "progress" (which implies directionality or improvement) weak.
  *   **Status:** **Non-Negotiable.**
  *   **Specification:** The account must identify the causal mechanisms driving the change (e.g., economic interdependence, normative contagion, state capacity). It must distinguish between progress driven by human agency and progress that is merely a byproduct of environmental luck.

  #### 7. The Action-Guiding Condition (Policy Relevance)
  *   **Motivation:** If the theory cannot inform present decisions, it is merely antiquarianism. We study progress to promote it.
  *   **Status:** **Prejudice of the Pragmatist/Reformist Camp.**
  *   **Specification:** The account must yield implications for present policy. It must be able to distinguish between interventions that accelerate progress and those that inadvertently trigger reversal.

  ***

  ### The Single Most Eliminative Requirement

  **The Archimedean Condition (Non-Endogeneity of Standards)** eliminates the most contenders.

  Most existing narratives of progress (Liberal, Marxist, Enlightenment Rationalist) fail here. They implicitly or explicitly define progress as the realization of values that emerged *during* the historical process they describe. Liberalism defines progress as the expansion of liberal rights; Marxism defines it as the movement toward communism. Both are accused of circularity: they judge the past by the standards the present created. To satisfy this requirement, a theory must anchor its metric in something trans-historical (e.g., biological suffering, logical consistency, thermodynamic efficiency). Very few moral-political theories can do this without collapsing into metaphysics or biology, thereby alienating the historians they seek to persuade.

  ***

  ### Assessment of the Conjecture

  **Conjecture:** *The demand for standards not endogenous to the history under evaluation (Archimedean Condition) and the demand that the account guide present policy (Action-Guiding Condition) cannot both be met.*

  **Assessment:** The conjecture is **correct**, and it identifies a subset of jointly unsatisfiable desiderata.

  1.  **The Tension:** To guide present policy, a standard must be intelligible and motivating to the actors within the system. Policy is inherently endogenous; it is made by people embedded in their historical context using their historical concepts. If you introduce a standard truly external to history (e.g., "maximize genetic fitness" or "align with Divine Will"), it ceases to be actionable for liberal-democratic agents who do not recognize that standard as authoritative.
  2.  **The Unsatisfiability:**
      *   If you meet the **Archimedean Condition** (external standard), you satisfy the historian but fail the **Action-Guiding Condition** (the standard is too abstract or alien to drive policy).
      *   If you meet the **Action-Guiding Condition** (internal standard), you satisfy the pragmatist but fail the **Archimedean Condition** (you are accused of Whig history).
  3.  **Conclusion:** You cannot simultaneously satisfy the skeptical historian (who demands external validation) and the policy reformer (who demands internal utility). A research program must choose: either it is a *diagnostic tool* for outsiders (sacrificing policy relevance) or a *normative tool* for insiders (sacrificing historical neutrality). Attempting to do both results in a theory that is either historically naive or politically impotent.

  ***

  ### Performance of Broad Families of Account

  **1. Progress as the Accumulation of Solved Problems (Popperian/Pragmatic)**
  *   **Performance:** Fails the **Archimedean Condition**. What counts as a "problem" is historically contingent (e.g., salvation was a problem for the Middle Ages; carbon emissions are a problem now). It handles **Reversibility** well (problems can return) and is strong on **Policy**, but it cannot claim moral progress, only technical adaptation.

  **2. Progress as the Enlargement of the Circle of Moral Concern (Singer/Pinker)**
  *   **Performance:** Fails the **Compensation Condition**. It focuses on the expanding inclusion but often obscures the costs paid by those on the periphery or the violence required to enforce the circle's expansion. It also struggles with the **Archimedean Condition**: why is "expansion" inherently good? This is a value judgment produced *by* the history it judges.

  **3. Progress as the Unfolding of a Direction Built into the Process (Hegelian/Marxist/Teleological)**
  *   **Performance:** Fails the **Non-Teleological Condition**. By positing an immanent logic or direction, it invites the charge of religious thinking. It often fails **Reversibility** because setbacks are reinterpreted as necessary dialectical steps rather than genuine losses. However, it is the only family that attempts to solve the **Mechanism Condition** robustly.

  **Summary:** No existing family satisfies the full specification. The **Archimedean** and **Action-Guiding** requirements are mutually exclusive, forcing a choice between a theory that is historically rigorous but practically silent, or practically useful but historically vulnerable.
