      *(Refining the "Unit of Analysis")*: Why is humanity the unit? If we choose "The West," it's Whiggish. If we choose "Humanity," we face aggregation problems. I need to make sure the desideratum demands a justification for the unit.

      *(Refining the "Conjecture")*: The user wants me to assess the conjecture that External Standards + Policy Guidance = Impossible. I should validate this as the source of the joint unsatisfiability.

