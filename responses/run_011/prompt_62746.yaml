  3.  **Evaluate the "Hardest" Requirement:**
      *   Which one kills the most theories?
      *   *Endogeneity (Archimedean Point)* is usually the biggest stumbling block. Most theories rely on current liberal democratic values. Finding a standard *outside* the flow of history is notoriously difficult (God? Reason? Biology?).
      *   *Ex Ante Identifiability* is also strong. Many "progress" narratives are only visible in retrospect (e.g., "The Cold War ended well").
      *   *Decision:* The **Archimedean Point (Non-Endogeneity)** is the classic philosophical killer. However, the **Ex Ante Identifiability** is the specific historian's killer. Let's go with Non-Endogeneity as the primary philosophical filter, but acknowledge Ex Ante as the primary historical filter. Actually, the prompt asks for *one*. I will argue that **Non-Endogeneity** is the most eliminative because it strikes at the heart of the Whig accusation.

  4.  **Assess the Conjecture:**
      *   *Conjecture:* "Standards not endogenous" + "Guide present policy" are incompatible.
      *   *Analysis:* If standards are external (e.g., Kantian reason, Divine Will), they might be too abstract to guide specific policy. If standards are policy-relevant, they are usually derived from current problems (endogenous).
      *   *Verdict:* The conjecture is strong. It points to a tension between *validity* (external standard) and *utility* (internal application). This looks like a jointly unsatisfiable subset.

  5.  **Assess Broad Families of Account:**
