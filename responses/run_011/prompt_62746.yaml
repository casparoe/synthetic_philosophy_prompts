          *   Identify the single requirement that eliminates the most contenders.
          *   Assess the user's conjecture: "Standards not endogenous" + "Guide present policy" are incompatible.
          *   Identify if any subset of desiderata is jointly unsatisfiable (this is a desired outcome).
          *   Close with an assessment of broad families of account (Problem-solving, Moral Circle, Immanent Direction) against the list.
      *   **Tone:** Philosophical, rigorous, analytical, suitable for a research program proposal.

  2.  **Deconstruct the Desiderata (Drafting the Requirements):**

      *   *Requirement 1: Ex Ante Identifiability (Reversibility).*
          *   *Motivation:* If we only know progress happened after it stuck, it's just survivorship bias. We need to know what a *reversal* looks like to claim the previous state was progress.
          *   *Status:* Non-negotiable (otherwise it's just storytelling).
      *   *Requirement 2: Archimedean Point (Endogeneity).*
          *   *Motivation:* The "Whig" charge says we judge the past by present standards. We need standards that aren't just the current zeitgeist.
          *   *Status:* Non-negotiable (to satisfy the skeptical historian).
      *   *Requirement 3: Accounting for Costs (The Losers).*
          *   *Motivation:* Aggregate improvement often hides specific suffering (e.g., industrialization). A theory must address those sacrificed.
          *   *Status:* Non-negotiable (moral seriousness).
      *   *Requirement 4: Non-Teleological (No Endpoint).*
