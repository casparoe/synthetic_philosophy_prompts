      *Refining the Tone:* Needs to be authoritative, practical, slightly dry (handbook), but philosophically precise. No Sanskrit without gloss.

      *Refining the "One Referee is Mistaken" constraint:* This is the hardest part of *anekāntavāda* adaptation. Usually, Jainism says "both are partially right." The prompt demands: "Somewhere inside it there must be steps whose sole function is to establish that one of our referees is mistaken."
      *Solution:* Use the concept of *Naya-abhasa* (fallacious standpoint). If a referee presents a partial standpoint as exhaustive *against the explicit scope of the manuscript*, they are committing a methodological error. That counts as "mistaken" in an editorial context.

      *Refining the "Inexpressible" limit:* 1 in 20 cases. If triggered more, the procedure flags itself as broken.

  8.  **Writing - Step-by-Step:**

      *   *Title:* Editorial Decision Procedure 4.2 (Conditioned Adjudication).
      *   *Preamble:* Acknowledge the drop of *saptabhangi*.
