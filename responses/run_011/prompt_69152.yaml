      *Case 1 Specifics:* Same arguments, opposite reading. Parameters match. Standpoint match. This is a pure logic check. One is logically invalid. The procedure must identify the logical break.

      *Final Polish:* Ensure no "blind men." Ensure "Avaktavya" is strictly limited. Ensure the "Mistaken Referee" condition is met via the *Naya-abhasa* rule.

