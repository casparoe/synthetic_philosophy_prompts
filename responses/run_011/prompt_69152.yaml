answer: |-
  **EDITORIAL HANDBOOK: PROCEDURE 4.2 (CONDITIONED ADJUDICATION)**

  **Purpose:** To resolve contradictory referee reports without resorting to averaging, length-based heuristics, or requests for "acknowledgment of complexity."
  **Time Limit:** 25 minutes per case.
  **Materials:** Manuscript, Referee A, Referee B.

  **DOCTRINAL NOTE:** This procedure adapts the Jain theory of *anekāntavāda* (manifoldness of reality). We discard the *saptabhangi* (sevenfold predication) as too slow for editorial workflow; the work is done by *nayavāda* (standpoint theory) and *syādvāda* (conditioned predication). We retain the distinction between *dravyārthika* (standpoint of substance/persistence) and *paryāyārthika* (standpoint of mode/transience). We explicitly reject the "blind men and elephant" parable; this is not about partial access to a whole, but about incompatible valid descriptions of a complex object.

  **THE PROCEDURE**

  **Step 1: Parameter Fixing (*Syād*)**
  Identify the object of predication in each report. Write the implicit parameters: *What* is being described, *Where* (context), *When* (temporal/logical stage), and *In Which State* (potential vs. actual).
  *   **Rule:** If a report cannot be parsed into parameters (e.g., "This is simply wrong"), it is *Unusable* for this procedure. An Unusable report is not necessarily false, but it carries no weight in this adjudication. If both are Unusable, revert to standard editorial discretion.
  *   **Output:** Two parameter sets (A and B).

  **Step 2: Standpoint Identification (*Naya*)**
  Classify the standpoint of each report.
  *   **Substance (*Dravya*):** Focuses on enduring identity, function, or historical continuity.
  *   **Mode (*Paryāya*):** Focuses on transient properties, specific logical states, or textual particulars.
  *   **Diagnostic (*Naya-abhasa*):** Check if a report presents its standpoint as exhaustive. If Referee A treats a Mode-claim as a Substance-truth (or vice versa) without qualification, mark A as *Fallacious*.
  *   **Output:** Standpoint classification + Fallacy Flag (Yes/No).

  **Step 3: Collision Test**
  Compare Parameter Sets A and B.
  *   **Distinct Cells:** If parameters differ (e.g., A judges historical accuracy, B judges logical validity), there is no contradiction. The manuscript must be able to sustain both. If the manuscript conflates them, Reject.
  *   **Collapsed Grid:** If parameters match, the reports contradict in a single cell. Proceed to Step 4.
  *   **Output:** Contradiction Status (Genuine or Apparent).

  **Step 4: Adjudication**
  If Contradiction is Genuine:
  *   Ignore report length, tone, or referee seniority.
  *   Test the claim against the manuscript's explicit scope. If the manuscript promises X, and Referee A judges X while Referee B judges Y, A prevails.
  *   If both judge X: Identify the logical break. One inference must be invalid. Select the report that identifies the break.
  *   **Output:** Verdict (Accept/Reject/Revise) + Rationale citing the specific error in the losing report.

  **Step 5: The Residual (*Avaktavya*)**
  Invoke "Inexpressible" only if: (1) Parameters are fixed, (2) Standpoints are valid, (3) Evidence is equal, and (4) The contradiction arises from the object's complexity, not lack of data.
  *   **Constraint:** This verdict may not be used more than once in twenty cases. If triggered twice in twenty, the procedure is being used to avoid decision.
  *   **Distinction:** Do not confuse with "Unfixed Parameters" (Step 1 error) or "Unknown Facts" (need more data).
  *   **Output:** Verdict (Reject, with invitation to resubmit as new project) or Accept with mandatory limitation clause.

  ***

  **WORKED EXAMPLES**

  **Case 1: Philosophy of Mind (Phenomenal/Functional Identity)**
  *Manuscript:* Argues Phenomenal Property P = Functional Property F.
  *Ref A:* Accept. Identity well-argued.
  *Ref B:* Reject. Identity false. Cites same two arguments as A, reads oppositely.

  *   **Step 1 (Parameters):**
      *   A: Object=P/F identity. Context=Logical consistency. State=Current argument.
      *   B: Object=P/F identity. Context=Logical consistency. State=Current argument.
      *   *Result:* Parameters Match.
  *   **Step 2 (Standpoints):**
      *   A: Mode (specific logical derivation).
      *   B: Mode (specific logical derivation).
      *   *Fallacy Check:* Neither claims exhaustive metaphysical truth; both judge the argument's validity. No *Naya-abhasa*.
  *   **Step 3 (Collision):**
      *   Genuine Contradiction. Both assert truth-values on the same proposition in the same state.
  *   **Step 4 (Adjudication):**
      *   Length/Tone: Ignored.
      *   Test: Trace the two cited arguments in the manuscript. Argument 1: P implies F. Argument 2: F implies P.
      *   Ref A reads 1 & 2 as establishing equivalence. Ref B reads 1 & 2 as establishing only correlation.
      *   Manuscript text: "P occurs if and only if F occurs."
      *   Ref B is correct: The arguments cited establish correlation, not identity. The manuscript overclaims.
      *   *Losing Report:* Ref A is mistaken on logical sufficiency.
  *   **Step 5 (Residual):** Not invoked.
  *   **Verdict:** **Reject.** Rationale: "While the correlation is established, the referees identify a logical gap between correlation and identity. The manuscript claims identity without sufficient warrant."

  **Case 2: History of South Asian Philosophy (Jain Semantics)**
  *Manuscript:* Reconstructs medieval Jain treatise using contemporary many-valued semantics.
  *Ref A:* Accept. Technically careful, makes argument assessable.
  *Ref B:* Reject. Misdescription. Treatise assertions are soteriological instruments, not truth-conditional claims. Formalizing changes the subject.

  *   **Step 1 (Parameters):**
      *   A: Object=Formal reconstruction. Context=Logical semantics. State=Static proposition.
      *   B: Object=Historical text. Context=Soteriological practice. State=Dynamic discipline.
      *   *Result:* Parameters Diverge (Logic vs. Practice).
  *   **Step 2 (Standpoints):**
      *   A: Mode (logical structure).
      *   B: Substance (historical intent/function).
      *   *Fallacy Check:* Ref A treats the text *as* a logical system (Mode) without acknowledging the historical Substance. Ref A commits *Naya-abhasa* by treating a partial logical abstraction as the whole historical object. Ref B correctly identifies the Substance standpoint.
  *   **Step 3 (Collision):**
      *   Apparent Contradiction. They are judging different objects (a formal model vs. a historical artifact).
      *   *Manuscript Scope:* The manuscript claims to be a "Reconstruction of Argument."
      *   If "Argument" implies logical validity, A wins. If "Argument" implies historical fidelity, B wins.
      *   Journal Scope: Interdisciplinary. Requires historical fidelity *and* philosophical rigor.
      *   B's objection is foundational: If the text is not truth-conditional, a truth-conditional reconstruction is a category error.
  *   **Step 4 (Adjudication):**
      *   Ref A's reconstruction is technically sound *for a model*, but Ref B demonstrates the model does not map to the source.
      *   Ref A is mistaken about the *object* of study.
  *   **Step 5 (Residual):** Not invoked.
  *   **Verdict:** **Reject.** Rationale: "The formal reconstruction, while internally consistent, imposes truth-conditional parameters on a text operating under soteriological parameters. This constitutes a category error regarding the source material."

  **Case 3: Personal Bias/Length Discrepancy**
  *Manuscript:* By Editor's former student.
  *Ref A (3 paragraphs):* Reject. Specific inference on page 4 is invalid.
  *Ref B (11 pages):* Accept. Meticulous exposition, defends inference.
  *Editor's Preference:* Defends student (wants Accept).

  *   **Step 1 (Parameters):**
      *   A: Object=Inference on p.4. Context=Validity.
      *   B: Object=Inference on p.4. Context=Validity.
      *   *Result:* Parameters Match.
  *   **Step 2 (Standpoints):**
      *   A: Mode (logical check).
      *   B: Mode (logical check).
      *   *Fallacy Check:* None.
  *   **Step 3 (Collision):**
      *   Genuine Contradiction. Valid vs. Invalid.
  *   **Step 4 (Adjudication):**
      *   **Constraint:** Length and Courtesy are inadmissible evidence.
      *   Test: Examine inference on page 4.
      *   Ref A identifies a formal fallacy (affirming the consequent). Ref B's 11 pages contextualize the fallacy but do not resolve it.
      *   Ref A is correct on validity. Ref B is mistaken on logic, despite superior exposition.
      *   *Procedure Override:* The Editor's preference is excluded from Step 4.
  *   **Step 5 (Residual):** Not invoked.
  *   **Verdict:** **Reject.** Rationale: "The central inference on page 4 contains a formal error identified by Referee A. Subsequent exposition does not resolve the validity failure."

  ***

  **LIMITS AND SELF-APPLICATION**

  **1. Judgment in Procedural Costume**
  Steps 2 and 4 require philosophical judgment. Identifying a *Naya-abhasa* (fallacious standpoint) is not mechanical; it requires the Associate Editor to understand the distinction between a text's logical form and its historical function. This procedure does not remove judgment; it structures it to prevent bias toward length or seniority.

  **2. Unsuitable Manuscripts**
  Do not apply this procedure to:
  *   **Short Notes:** The overhead of parameter fixing exceeds the word count.
  *   **Pure Exegesis:** Where the object is solely textual translation, Standpoint conflicts are usually resolved by philology, not logic.
  *   **Speculative Metaphysics:** Where parameters are inherently unfixed by design, Step 1 will fail repeatedly.

  **3. Potential for Misuse**
  An editor wishing to avoid a decision may abuse Step 5 (*Avaktavya*). To prevent this: The "1 in 20" rule is hard. If an Associate Editor triggers Step 5 twice in a cycle of twenty cases, their subsequent decisions require Editor-in-Chief review. Step 5 is for genuine inexpressibility, not for "hard to decide."

  **4. The Authority Paradox**
  *Question:* If *anekāntavāda* holds that all assertions are conditioned, does a verdict produced by this procedure retain the authority to reject a paper? Does invoking the doctrine undercut the decision?
  *Answer:* No, provided we distinguish *institutional authority* from *metaphysical truth*.
  The procedure does not declare the rejected paper "False" in an absolute sense. It declares the paper "Unsuitable for this journal at this time" given the specific parameters of our review process. The verdict is itself conditioned (*syāt*): "In the respect of current logical standards and journal scope, this manuscript is rejected."
  This preserves the doctrine: the rejection is valid from the editorial standpoint, without denying the paper might be valid from another (e.g., a different journal, a future paradigm). The authority required to reject is administrative, not ontological. We are not silencing truth; we are managing a queue.
  However, if an Editor uses this procedure to claim the rejected author is *metaphysically* wrong, they have violated the procedure. The rationale must remain scoped to the manuscript's success within its own stated parameters.

  **5. What Is Lost**
  By dropping the *saptabhangi* (sevenfold predication), we lose the ability to formally catalogue "Yes, No, and Both" as distinct truth-values. We treat "Both" as a failure of parameter fixing (Step 3) rather than a distinct ontological state. This is a pragmatic loss. It forces binary decisions (Accept/Reject) where the doctrine might prefer suspension. But a journal cannot publish "suspension." We sacrifice metaphysical completeness for institutional functionality. If you require the full sevenfold enumeration, this journal is not the venue for it.

  **Final Instruction:** If the procedure yields a verdict you find intuitively repugnant, check Step 2. You have likely misidentified the Standpoint. Do not override the verdict. File the report. If the author appeals, the written rationale from Step 4 is your defense. If the rationale holds, the decision stands.
