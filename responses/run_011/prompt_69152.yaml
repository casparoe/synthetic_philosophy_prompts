      *   **Goal:** Convert Jain *anekāntavāda* (doctrine of manifoldness), specifically *syādvāda* (conditioned predication) and *nayavāda* (standpoint theory), into a practical 2-page decision procedure for AEs.
      *   **Constraints:**
          *   25 minutes per case.
          *   Resources: Manuscript + 2 Reports (no outside research, no 3rd referee).
          *   Output: Verdict + Written Rationale (must survive author/appeals).
          *   Structure: Fixed order of stages (Parameters, Standpoints, Contradiction Check, Adjudication, Residual/Inexpressible).
          *   Specific Distinctions: Must separate "unfixed parameters," "unknown facts," and "inexpressible complexity."
          *   Honesty: Admit what parts of the doctrine are dropped (e.g., sevenfold predication) and why.
          *   No Cliches: No "blind men and elephant."
          *   Hard Constraint: Must be able to say *one referee is mistaken*. Cannot just be "acknowledge complexity."
          *   Test Cases: Run on three specific scenarios (Mind/Identity, Jain Semantics/Soteriology, Personal Bias/Length Discrepancy).
          *   Limits & Self-Application: Identify judgment calls, unsuitable manuscript types, potential misuse, and address the paradox of using a conditional doctrine to make an unconditional decision.
          *   Length/Register: ~2000 words, handbook register, no footnotes/bibliography, gloss technical terms.

  2.  **Deconstruct the Philosophical Apparatus (Jain Logic):**

      *   *Anekāntavāda:* Reality is complex; no single proposition captures it fully.
      *   *Nayavāda:* Partial standpoints. Key distinction needed: *Dravyārthika* (substance/persistence across time) vs. *Paryāyārthika* (mode/transient state). Also need to identify *Naya-abhasa* (fallacious standpoint claiming to be absolute).
      *   *Syādvāda:* Conditioned predication ("In some respect..."). Sevenfold predication (*saptabhangi*) is usually too complex for this context. The prompt suggests dropping most of it, keeping the parameter grid.
      *   *Avaktavya:* The inexpressible. Needs careful handling to avoid "cop-out."

  3.  **Drafting the Procedure (Stage by Stage):**

      *   *Stage 1: Parameters (Syād).* Define the "object" of the claim. Where/When/State. If a report can't be parsed, it's unusable, not necessarily discredited (might be speaking broadly), but for *this* decision, it's noise.
      *   *Stage 2: Standpoints (Naya).* Identify the perspective. Substance (enduring) vs. Mode (transient). Crucial step: Detect *Naya-abhasa* (claiming partial view is total). This is where we catch the "incompetence" accusation.
      *   *Stage 3: Contradiction Check.* Do they contradict in the *same* cell? Or only if we collapse the grid? If they collapse the grid, the one refusing to collapse is usually methodologically superior *unless* the journal's scope demands collapse.
      *   *Stage 4: Adjudication.* If parameters match, who has better evidence *within* the manuscript? Length/Courtesy must be ignored.
      *   *Stage 5: Residual (Avaktavya).* Distinguish: (A) Unfixed parameters (Report error), (B) Missing data (Defer), (C) Genuine Inexpressibility (Rare). Limit usage to <5% (1 in 20).

  4.  **Addressing the "Honesty" Constraint:**

      *   Must admit dropping the full *saptabhangi* (sevenfold predication). It's too slow for 25 mins. We are using the *logic* of conditioning, not the full enumeration.
      *   Must admit this is "judgment wearing a procedural costume."

  5.  **Running the Test Cases:**

      *   *Case 1 (Mind/Identity):* Same arguments, opposite reading. Parameters match. Standpoint match. Adjudication must rely on internal consistency or textual fidelity. One *must* be wrong.
      *   *Case 2 (Jain Semantics):* Substantive clash. Ref 1: Truth-conditional (Mode/Logic). Ref 2: Soteriological (Substance/Practice). This is a *Naya* clash. Is the journal about logic or history? If history, Ref 2 wins on context. If logic, Ref 1 wins on formal rigor. Need to show the procedure forces a choice based on journal scope, not compromise.
      *   *Case 3 (Personal Bias/Length):* Short/Correct vs. Long/Wrong. Procedure must explicitly ignore length. Must allow AE to vote against Editor's preference (blindly applied).

  6.  **Addressing the Self-Application Paradox:**

      *   If all truth is conditioned, is *this* verdict conditioned?
      *   Answer: The verdict is conditional on the *journal's scope* and the *evidence provided*. It is not an absolute metaphysical claim, but an administrative decision. The authority comes from the institutional role, not the metaphysical truth of the rejection.

  7.  **Drafting - Section by Section (Iterative refinement for tone and length):**

      *   *Header:* Handbook style.
      *   *Intro:* Purpose and limitations.
      *   *The Procedure:* 5 Steps.
      *   *The Test Cases:* Integrated or appended? Prompt says "Run it... on three cases." Better to append as a "Worked Examples" section to keep the procedure clean, or integrate as commentary. Given the word count and the request to "Run it... showing intermediate results," a dedicated section after the procedure is clearer.
