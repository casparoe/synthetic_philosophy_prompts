  ### Ad Hoc Assumptions

  **Candidate Rule:** **Factualist Internalism**
  *   **Auxiliary Assumption:** To accommodate **Case 7 (Marta)**, this rule must assume that "Accessibility" is a condition for the *existence* of a reason, not merely for *rational action*.
  *   **Flag:** **Moderately Ad Hoc.** Pure Factualists typically argue reasons exist independently of knowledge (you have a reason to take the medicine even if you don't know it's medicine; you're just blameless for not taking it). The instructor's "No reason" verdict in Case 7 forces the Factualist to adopt the Internalist's epistemic constraint. This makes the view converge heavily with Williams-Internalism, suggesting the distinction between them may be terminological in her framework.

  **Candidate Rule:** **Idealized Desire Internalism**
  *   **Auxiliary Assumption:** To accommodate **Case 4 (Nadia)**, this rule must assume that "Idealization" corrects *information* but does not correct *values* or generate *new desires*.
  *   **Flag:** **Not Ad Hoc.** This is a standard distinction in the literature (e.g., Smith vs. Williams). However, it limits the theory's ability to handle cases of "corrupted desires" (e.g., adaptive preferences), which remains a vulnerability for this candidate.
