  ### Discriminating Test Case

  To discriminate between **Williams-Style Deliberative Internalism** (Procedural) and **Factualist Internalism** (Substantive), submit the following case next week:

  **The "Inaccessible Fact" Case:**
  > "Arthur desires to recover from his illness. There exists a specific rare herb that would cure him. However, the location of this herb is lost to history; no amount of ordinary or extraordinary inquiry available to Arthur (or anyone in his community) could reveal its existence. Arthur does not take the herb."

  **Verdict Predictions:**
  *   **Williams-Style Deliberative Internalism:** **No Reason.** A reason requires a *sound deliberative route* from S. If the fact is inaccessible to deliberation, it cannot ground a reason. (Consistent with Case 7's "ordinary inquiry" remark).
  *   **Factualist Internalism (Unconstrained):** **Yes Reason.** The *fact* that the herb cures him counts in favor of seeking it relative to his desire, regardless of his epistemic access. (Some factualists separate the existence of reasons from the agent's ability to know them).

  **Conclusion if Answers Match:**
  If she says **"No Reason"** (aligning with Williams), it confirms that **Epistemic Accessibility** is constitutive of reasons, not just a condition for blame. This solidifies the **Deliberative Internalist** reading over a pure Factualist one. If she says **"Yes Reason"**, it suggests her Case 7 remark ("ordinary inquiry") was about *blame*, not reason-existence, and she is a pure Factualist.

