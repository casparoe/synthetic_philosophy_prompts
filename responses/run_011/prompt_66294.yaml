  ### Friday's Prediction

  **Verdict:**
  *   **Main Case:** **Yes, Rosa has a reason to stay.**
  *   **Rider:** **No, Rosa has no reason to stay.**

  **Confidence Level:** **85%**

  **Key Feature:**
  I am leaning most heavily on **Case 5 (Ines)**. Like Ines, Rosa acts on an instrumental motive (promotion/avoiding terror) rather than an intrinsic desire for the act itself (keeping the promise/comforting the patient). The instructor validated Ines's reason despite the lack of intrinsic motivation. This establishes that **instrumental reasons count as reasons**. In the Rider, the instrumental link is broken, and **Case 4 (Nadia)** dictates that without a motivational hook (intrinsic or instrumental), there is no reason.

  **Provenance:**
  She will likely say the reason stems from **Rosa's ambition**, not the patient's distress. This mirrors Case 5, where the reason stemmed from Ines's fear, not the promise.

