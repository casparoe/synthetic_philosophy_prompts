answer: |-
  This is a sharp observation, and you are right to feel that the literature leaves a gap here. You have correctly identified that pain asymbolia (sensory intact, affective/motivational dissociated) has a mirror image in the phenomenology of voluntary suffering, but that mirror image is not merely "masochism" or "endurance."

  To answer your primary question directly: **No, there is no settled, standard term in the analytic philosophy of mind or pain literature for this specific configuration.**

  The phenomenon you are describing—concurrent first-order aversion ("this is awful") + concurrent non-instrumental volitional endorsement ("I want this")—does not have a canonical name like *asymbolia*. It is usually absorbed into discussions of **benign masochism** (which you've rightly ruled out), **the pain paradox** in sports psychology (which is usually instrumental), or **meaningful suffering** (which is teleological).

  However, because you are writing a dissertation chapter, you are in a position to define this category. Below is a breakdown of why the existing neighbors fail, how to handle the equivocation objection, and a proposal for how to conceptualize and label the phenomenon for your purposes.

  ### 1. Why the Nearest Neighbors Fail

  You have already done the groundwork here, but it is worth formalizing *why* they don't fit, as this demarcates your category.

  *   **Pain Asymbolia:** As you note, this is a dissociation between sensory-discriminative and affective-motivational components. The subject feels the stimulus but lacks the "unpleasantness." Your cases *have* the unpleasantness. They are the inverse: Affective/Motivational dissociation where the affect is negative but the motivation is approach.
  *   **Benign Masochism (Rozin/Smith):** This is the strongest competitor. However, Rozin's model relies on a **hedonic reversal** or a **suspension of negative valence**. The chili-eater enjoys the burn *because* the body knows it is safe; the negative valence is converted into a "thrill." Your winter swimmer explicitly denies the conversion. They report the valence remains negative ("agony") while the volition remains positive. In benign masochism, the "ouch" becomes a "yum." In your cases, the "ouch" remains an "ouch," but the agent says "more."
  *   **The Motivational Theory of Pain (MTP):** Philosophers like David Bain, Manolo Martínez, or Nikola Grahek argue that pain is *essentially* motivational (it involves an intrinsic desire to stop the sensation). If you accept MTP, your winter swimmer is conceptually impossible; if they don't want it to stop, it isn't pain. Your cases serve as a counter-example to strong MTP. They suggest pain can be intrinsically aversive (phenomenologically) without being intrinsically motivationally exclusionary.
  *   **Instrumental Endurance (The "Pain Paradox"):** In sports philosophy (e.g., Gunnar Breivik, Sigmund Loland), pain-seeking is almost always justified by *telos*: performance, victory, health. Your constraint (non-instrumental, about the 90 seconds themselves) rules this out.

  ### 2. Addressing the Equivocation Objection

  The objection you anticipate ("They want the swim, not the pain") is the most serious threat to the category's coherence. If the pain is merely a side effect, there is no paradox.

  To defend the category, you need to distinguish between **Object of Desire** and **Constitutive Means**.

  *   **The Objection:** The agent desires $A$ (swimming). $P$ (pain) is a necessary condition of $A$. Therefore, they desire $P$ only derivatively.
  *   **The Counter:** In cold immersion, $P$ is not a *means* to $A$; $P$ is *constitutive* of $A$. You cannot have the "winter swim experience" without the thermal pain. If the water were warm, the activity would be different.
  *   **The Phenomenological Claim:** When the swimmer says, "I want the ninety seconds," they are identifying the *painful interval* as the object of value.
  *   **The Philosophical Move:** You must argue for **Second-Order Valuation of First-Order Aversion.**
      *   *First-Order:* "I hate this sensation." (Phenomenal aversion remains intact).
      *   *Second-Order:* "I value my willing of this sensation." (Volitional endorsement).
      *   Crucially, the second-order valuation does not cancel the first-order aversion (as in masochism). It *affirms* it.

  This distinguishes it from masochism (where the first-order aversion is flipped) and endurance (where the second-order valuation is instrumental).

  ### 3. Proposed Conceptualization: "Affirmative Endurance"

  Since no term exists, I suggest you define the category explicitly. A working label could be **"Non-Instrumental Affirmative Endurance"** or **"Intrinsic Valuation of Aversiveness."**

  Here is a draft definition you can adapt, marking the edges as you requested:

  **Definition:** A psychological state in which an agent voluntarily initiates or sustains a stimulus $S$, where:
  1.  **Phenomenal Negativity:** The agent reports concurrent, sincere first-order aversion to $S$ (it is experienced as unpleasant/painful *during* the episode).
  2.  **Volitional Positivity:** The agent reports concurrent, sincere motivation to sustain $S$.
  3.  **Non-Instrumentality:** The motivation is not derived from consequences $C$ that occur after $S$ ceases (no relief, no endorphins, no social capital).
  4.  **Constitutive Link:** The agent values $S$ not despite its negativity, but in a way that requires the negativity to remain intact.

  **The Edges (What counts vs. What doesn't):**

  *   **Clean Case:** The winter swimmer. The cold *is* the pain. The value is placed on the immersion *while* it hurts. No "high" afterwards required.
  *   **Ambiguous Case:** The Marathon Runner. If they run for the "finish line feeling," it's instrumental. If they run because they value the *struggle itself* (not the medal), it fits. You must interrogate the *telos*.
  *   **Excluded Case (Benign Masochism):** Eating ghost peppers for the "buzz." If the burn becomes "fun" (valence flip), it's masochism. If the burn remains "misery" but they keep eating to prove something to themselves *in the moment*, it's Affirmative Endurance.
  *   **Excluded Case (Religious Asceticism):** Usually instrumental (salvation, penance). Unless the ascetic values the suffering *qua* suffering without reference to God or redemption (rare, but possible in nihilistic asceticism).
  *   **Excluded Case (NSSI):** Usually instrumental (affect regulation, stopping dissociation). The pain is a tool to change mental state.

  ### 4. Philosophical Payoff for Your Chapter

  Why does this category matter? It allows you to make a specific intervention in the metaphysics of pain.

  1.  **Challenges Imperativism:** If pain is a command ("Stop this!"), why does the agent obey the command by *continuing*? You can argue that pain issues an imperative, but the agent has the capacity for **Meta-Volitional Override** that doesn't negate the imperative's force. The command "Stop!" is heard and acknowledged as valid (it *is* awful), but overruled by a higher-order commitment.
  2.  **Refines Dissociation:** Asymbolia shows sensory and affective can come apart. Your cases show **Affective and Motivational** can come apart. We usually assume Unpleasantness $\rightarrow$ Avoidance Motivation. Your cases show Unpleasantness $\nrightarrow$ Avoidance Motivation.
  3.  **The Nature of "Wanting":** It suggests that "wanting" an experience does not require "liking" the phenomenal character of that experience. We can want *to undergo* $X$ while disliking *what it is like* to undergo $X$. This separates **Desire for Experience** from **Enjoyment of Phenomenology.**

  ### 5. Recommended Reading/References

  While there is no single term, these threads will help you build the genealogy of the concept:

  *   **Paul Rozin et al., "Benign Masochism" (2013):** Cite this to distinguish your view. You are arguing for "Malignant Masochism" (where the malignancy is acknowledged) or simply "Non-Masochistic Pain Seeking."
  *   **David Bain, "The Motivation of Pain" (2011/2013):** Use his Motivational Theory as the foil. Your cases are counter-examples to the claim that pain *essentially* motivates avoidance.
  *   **Nikola Grahek, *Feeling Pain and Being in Pain*:** The definitive text on asymbolia. Use his framework of dissociation to frame your "reverse dissociation."
  *   **Thomas Nagel, "The Fragmentation of Value":** Helpful for discussing how we hold conflicting values (hating the sensation, valuing the endurance) simultaneously.
  *   **Sports Philosophy:** Look for work by **Sigmund Loland** or **Claire Whitehead** on "suffering in sport." They often touch on the intrinsic value of overcoming resistance, though they often slip into instrumentalism.
  *   **Phenomenology:** **Drew Leder, *The Absent Body*:** Discusses how pain makes the body present. Some agents seek this "presence" even if the mode is aversive.

  ### Summary

  You have not talked yourself into a confusion; you have identified a gap. The phenomenon is real, but it is philosophically unstable because it violates the standard link between *unpleasantness* and *avoidance*.

  Don't look for a label that already exists; define one. Call it **"Affirmative Endurance"** or **"Non-Instrumental Aversive Affirmation."** Your contribution is to show that the "mirror image" of asymbolia isn't just "feeling pain normally," but rather **maintaining the aversive character of pain while decoupling it from the avoidance imperative.** This preserves the sincerity of the "it was awful" report while accounting for the "I want it" behavior without relying on hidden instrumental benefits.

  This is a strong chapter hook. It moves the debate from "Is pain essentially motivational?" to "Under what conditions can motivation decouple from phenomenal aversion in non-pathological agents?"
