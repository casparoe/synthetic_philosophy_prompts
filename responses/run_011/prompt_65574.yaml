answer: |-
  There is no single established term that captures this specific *visibility asymmetry* within offsetting. You are correct to reject "greenwashing" (which implies deceit) and "moral licensing" (which is temporal).

  The closest theoretical framework comes from political scientist James C. Scott's concept of **legibility** (how states/organizations simplify complex realities to measure and manage them), combined with behavioral economics' **salience**.

  Since the term doesn't exist, here is the coinage, the definition, and the edges you asked for.

  ### The Term: **Legibility Arbitrage**

  **Definition:** The strategic selection of offset projects based on the differential visibility between the harm committed and the remedy purchased, specifically to maximize reputational credit while minimizing operational scrutiny.

  It is "arbitrage" because you are exploiting a price discrepancy in the market of attention: invisible harms are "cheap" (they generate little backlash), while visible goods are "expensive" (they generate high goodwill). By trading the former for the latter, you capture the surplus value of public perception without achieving functional equivalence.

  ### Why existing terms fail
  *   **Greenwashing:** Implies you are claiming to be greener than you are. In Legibility Arbitrage, you *are* technically net-neutral. The math works; the *aesthetics* are rigged.
  *   **Decoupling:** In organizational theory, this means policy diverges from practice. Here, the practice (buying offsets) matches the policy (net-zero), but the *texture* of the practice is manipulated.
  *   **Commensuration:** This is the act of making two different things comparable (e.g., turning tons of carbon into dollars). Legibility Arbitrage is what happens when commensuration is successful on the ledger but fails in reality.

  ### The Edges: When is it NOT Legibility Arbitrage?

  You asked for a case where the visibility mismatch exists (Invisible Harm / Visible Fix) but the phenomenon is *not* Legibility Arbitrage. This distinction is crucial for your role.

  **1. The Constraint Edge (Structural Legibility)**
  *   **Scenario:** A company emits invisible CO2. They fund a visible wind farm.
  *   **Why it's NOT Arbitrage:** There is no way to make CO2 reduction visible. You cannot put a plaque on a molecule not emitted. The visibility of the wind farm is a physical necessity of the technology, not a selection bias.
  *   **Test:** *Could they have chosen an invisible offset?* If the only available offsets are inherently legible (infrastructure), it's not arbitrage. If they chose a wind farm over a equally effective but invisible policy change (e.g., grid efficiency lobbying), it *is* arbitrage.

  **2. The Transparency Edge (Radical Commensuration)**
  *   **Scenario:** A company fouls a river (invisible nitrogen). They fund a solar array (visible).
  *   **Why it's NOT Arbitrage:** The company publishes the nitrogen data on the front page of their annual report, with the same visual weight as the solar array plaque. They make the harm as legible as the cure.
  *   **Test:** *Is the harm being rendered legible?* Legibility Arbitrage relies on the harm remaining diffuse. If you make the harm concrete (e.g., "We polluted X liters, here is the data"), the arbitrage collapses because the reputational cost of the harm matches the credit of the fix.

  **3. The In-Kind Edge (Functional Equivalence)**
  *   **Scenario:** A company fouls a river. They fund river restoration downstream.
  *   **Why it's NOT Arbitrage:** The currency matches. Even if the restoration is visible (ribbon-cutting), it is functionally tied to the harm.
  *   **Test:** *Is the offset in the same ecological or social currency?* Legibility Arbitrage thrives on incommensurability (Carbon vs. Trees, Labor vs. Schools). If the offset directly addresses the harm's mechanism, the visibility is secondary.

  ### How to use this in your meetings
  When presented with a "Solar Plaque" offset for "Supply Chain Methane," you can ask:

  > *"Are we engaging in **Legibility Arbitrage** here? If we buy this, we are trading an invisible liability for a visible asset. That's good PR, but is it good sustainability? If we aren't going to make the methane just as visible as the solar panels, we aren't solving the incentive to pollute; we're just monetizing the opacity."*

  This frames the issue not as moral failure (which makes people defensive), but as a market inefficiency and a risk management issue (which makes them listen).
