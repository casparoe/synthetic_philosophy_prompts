          *   Chronic moderate pain: Assume utility loss of 0.2 per year. 900 patients x 0.2 = 180 QALYs/year.
          *   *Utilitarian View:* Fund the pain relief.
      *   *Contractualist View:* Fund the life-saving (likely).
      *   *Recommendation:* Don't frame it as "Scanlon says X." Frame it as "Competing Ethical Frameworks."
      *   *Actionable Advice:* Acknowledge the tension. If the hospital's mission is "preventing death," go with lives. If it's "maximizing community health," go with pain. Usually, saving lives trumps quality-of-life improvements in triage contexts, *unless* the quality of life improvement is massive. 900 people is a lot.
      *   *Warning:* Don't let the roommate's undergrad philosophy seminar dictate hospital policy. Use standard bioethics frameworks (Principlism: Autonomy, Beneficence, Non-maleficence, Justice).

  5.  **Drafting the Response:**
      *   *Tone:* Respectful of the philosophy but grounded in the practical reality of the committee. Acknowledge the roommate's intelligence but correct the application.
      *   *Structure:*
