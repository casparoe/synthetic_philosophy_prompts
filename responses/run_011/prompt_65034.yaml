      *   *The "Relevance" Condition:* A complaint is only relevant if it makes a difference to the individual. 900 people in pain *each* have a complaint. But is their complaint strong enough to override a death?
      *   *Parfit's Critique:* Parfit argued Scanlon fails here. Scanlon responded by refining the "strength of complaints."
      *   *Key Distinction:* It's not about *numbers* in the 5-vs-1 case, it's about *principles*. A principle "save the greater number when stakes are equal" is reasonable. A principle "aggregate minor pains to override death" is arguably unreasonable.
      *   *Verdict:* The roommate is *mostly* right on the Scanlonian verdict for Life vs. Pain, but wrong that the 5-vs-1 case proves aggregation is allowed in *all* contexts. The 5-vs-1 case is about *tie-breaking*, not *weighing*.

