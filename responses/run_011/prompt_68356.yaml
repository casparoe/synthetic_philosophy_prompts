answer: |-
  # WORKSHOP PREP SHEET: The Eligibility Account
  **Topic:** Wrong Kind of Reasons (WKR) / Normativity
  **Time:** 20 min Q&A
  **Risk Profile:** High (Audience lacks action theory; will hear "deliberation" as "psychology")

  ## I. PRE-EMPTIVE CONCESSIONS (Opening Minutes)
  *Deploy these immediately to lower temperature and frame the dialectic.*

  1.  **On the Definition of Eligibility:** Concede that I am not offering a *reductive analysis* of "deliberative eligibility" in this paper. I am treating it as a structural constraint on practical reasoning. If pressed for a definition, I will say it is a normative notion, not a psychological one.
  2.  **On Non-Deliberative Attitudes:** Concede that some attitudes (e.g., sudden fear, visceral disgust) are not settled by deliberation. The account applies primarily to *judgment-sensitive* attitudes (belief, admiration, intention). I am not claiming to solve WKR for reflex responses.
  3.  **On Indirect Control:** Concede to the voluntarists that we often lack *direct* voluntary control over attitudes. Part (2) of my thesis (WKR are reasons to cultivate/bring about) relies on *indirect* influence (long-term habituation, evidence-seeking), not snap voluntary commands.

  ## II. THE CRITICAL REPLY (Must Land)
  **The Claim:** "Right-kind and wrong-kind considerations never enter a single weighing."
  **Why it matters:** If the audience convinces me that RKR and WKR *do* compete in a single deliberative space (e.g., "I should admire him because he's virtuous, but I shouldn't because he'll kill me if I don't"), the dissolution fails and the problem returns.
  **The Line:** "Weighing requires a common currency. Fittingness and Prudence are not currencies; they are distinct normative dimensions. To say they weigh against each other is to misunderstand the grammar of 'ought'."

  ## III. OBJECTIONS (Ordered by Damage)

  ### 1. The Circularity Charge (Fittingness-First)
  **Who:** Senior Fittingness-First Theorist
  **Voice:** "You say a consideration is eligible if it can serve as a premise in deliberation settling the attitude. But what settles the question of admiration? Only considerations that show the object is *admirable*. So 'eligibility' is just 'fittingness' in disguise. You haven't analyzed the right kind; you've just renamed the primitive."
  **Reply:** "Eligibility is about *structural role*, not *content*. A threat can logically function as a premise ('If I admire him, I live; I want to live; so I will admire him'). That is valid practical reasoning. But it settles the question *what to do about my admiration*, not *is he admirable?* Fittingness tracks the answer to the second question; eligibility tracks the grammar of the first."
  **Soft Spot:** Distinguishing "settling the question" from "answering the question."
  **Concede/Defend:** Defend. If I concede this, the view collapses into Fittingness-First.
  **⚠️ COLLAPSE RISK:** **HIGH.** If you allow fittingness to define the "question the attitude answers," you lose distinctiveness.

  ### 2. The Psychologism Objection (Reasons-First / Scanlonian)
  **Who:** Reasons-First Theorist
  **Voice:** "You're grounding normative status in our contingent psychological capacities to deliberate. If an agent lacks the capacity to deliberate on admiration (a child, or a cognitively impaired agent), do they have no right-kind reasons? Reasons should be mind-independent."
  **Reply:** "Eligibility is capacity-relative, not exercise-relative. It concerns what the *type* of attitude requires for rational settlement, not what the specific agent can do. A child has RKR for belief because belief is the *kind* of state settled by evidence, even if the child can't deliberate yet. The normativity lies in the attitude's nature, not the agent's skill."
  **Soft Spot:** Explaining how attitude types have natures independent of agents.
  **Concede/Defend:** Defend. This is the load-bearing wall regarding capacity vs. exercise.

  ### 3. The Verbal Dispute (Senior Deflationist)
  **Who:** Senior Deflationist
  **Voice:** "You say WKR are reasons for *action* regarding the attitude, not for the attitude itself. But ordinary language says 'I have a reason to admire him.' You're just stipulating a technical sense of 'reason for an attitude' to make the problem vanish. Isn't this just a verbal solution to a substantive problem?"
  **Reply:** "It's not verbal if it explains the *phenomenology* of the conflict. When you feel the tug of the demon's threat, you feel a conflict between *admirability* and *prudence*. My account maps that phenomenology: you are weighing the fittingness of the attitude against the prudence of the action to cultivate it. The 'problem' arises only when we conflate the two normative relations."
  **Soft Spot:** Explaining why ordinary language is "misfiled" without sounding elitist.
  **Concede/Defend:** Concede that ordinary language is loose, but defend that philosophical precision requires the distinction.

  ### 4. The Indirect Control Problem (Voluntarist)
  **Who:** Ethics of Belief / Doxastic Voluntarist
  **Voice:** "Part (2) says WKR are reasons to cultivate or bring about the attitude. But I can't believe at will. If the demon threatens me, I can't just 'cultivate' admiration on command. If I lack control, there's no 'ought'. So the WKR disappears entirely."
  **Reply:** "Control comes in degrees. You can't believe at will, but you can attend to evidence, avoid counter-evidence, or engage in self-persuasion over time. WKR target these indirect levers. The threat gives you a reason to put yourself in a position where admiration becomes possible."
  **Soft Spot:** Cases where indirect control is also impossible.
  **Concede/Defend:** Concede that in cases of zero control, the WKR loses force, but that's a feature, not a bug.

  ### 5. The Formal Modeling Objection (Accuracy-First)
  **Who:** Formal Epistemologist
  **Voice:** "In formal epistemology, we model trade-offs between accuracy and utility all the time. We assign utility functions to belief states. Your 'dissolution' breaks the math. If WKR aren't reasons for belief, how do you model the rationality of pragmatic encroachment?"
  **Reply:** "Your models are third-personal assessments of optimality. My account is first-personal deliberative eligibility. You can model the *outcome* as a trade-off, but the *agent* cannot deliberate using utility as a premise for belief without corrupting the attitude. The math describes the system; my account describes the agent."
  **Soft Spot:** Admitting the formal models are useful while denying their deliberative relevance.
  **Concede/Defend:** Defend the distinction between assessment and deliberation.

  ### 6. The "Good Consequences" Objection (Fittingness-First)
  **Who:** Fittingness-First Theorist
  **Voice:** "Sometimes the good consequences of an attitude make it fitting. If admiring the demon saves the world, isn't he admirable *because* he holds that power? You're drawing a sharp line where there's a gradient."
  **Reply:** "That conflates the *object* of the attitude with the *consequences* of having it. If he saves the world, he is admirable for the saving, not for the threat. The threat is external to the object's properties. Eligibility tracks properties of the object, not properties of the holding."
  **Soft Spot:** Cases where consequences are properties of the object (e.g., a useful tool).
  **Concede/Defend:** Defend. Keep the object/consequence distinction sharp.

  ### 7. The Animal/Infant Objection (Reasons-First)
  **Who:** Reasons-First Theorist
  **Voice:** "Animals have beliefs and fears. They have RKR (evidence/danger). They cannot deliberate. Your account implies animals have no RKR. That's absurd."
  **Reply:** "Animals have states that *correspond* to beliefs, but normative reasons apply to rational agents. Alternatively, we can say animals have proto-reasons relative to their functional architecture. But the WKR problem is a problem for *rational* normativity, not biological function."
  **Soft Spot:** Sounding overly human-centric.
  **Concede/Defend:** Concede the account is for rational agents; bracket animal normativity.

  ### 8. The "Misfiling" Error Theory (General)
  **Who:** Any (likely Scanlonian)
  **Voice:** "You claim everyone 'misfiles' WKR as reasons for attitudes. But philosophers have debated this for decades. Are we all just confused? That's a costly error theory."
  **Reply:** "It's not an error theory about the *experience* of reasons, but about the *categorization*. The pressure is real. The categorization is what leads to the paradox. I'm offering a better taxonomy, not calling you irrational."
  **Soft Spot:** Sounding dismissive of the literature.
  **Concede/Defend:** Defend. It's a conceptual clarification, not a psychological diagnosis.

  ### 9. The Enkrasia Requirement (Fittingness-First)
  **Who:** Fittingness-First Theorist
  **Voice:** "If I know I ought to admire him (due to threat) but can't find him admirable, I'm in a rational conflict. Your view says there's no conflict. But it feels like one."
  **Reply:** "The conflict is between 'I ought to admire' (practical ought) and 'He isn't admirable' (evaluative fact). My view explains why you can't satisfy both: the practical ought targets your agency, the evaluative fact targets the object. The tension is real, but it's not a weighing of reasons for the *same* thing."
  **Soft Spot:** Explaining the "practical ought" without making it a reason for the attitude.
  **Concede/Defend:** Defend.

  ### 10. The Normative Force Objection (Reasons-First)
  **Who:** Reasons-First Theorist
  **Voice:** "If WKR are genuine reasons (for action), why do they feel like they press on the *attitude*? Why doesn't the threat feel like a reason to *act*, but rather a reason to *believe/admire*?"
  **Reply:** "Because the action required *is* the management of the attitude. When the target of your action is your own mind, the pressure feels internal. But the direction of fit remains world-to-mind (action), not mind-to-world (belief)."
  **Soft Spot:** Phenomenological accuracy.
  **Concede/Defend:** Defend.

  ## IV. THE DREADED QUESTION
  **Who:** Senior Deflationist
  **The Question:** "Look, you've built a elaborate structure around 'deliberative eligibility.' If I ask you *why* a threat isn't eligible, you'll say 'because it doesn't bear on the admirability.' If I ask *why* it doesn't bear on admirability, you'll say 'because it's not eligible.' Haven't you just built a circle and called it a dissolution? What independent work is 'eligibility' doing?"
  **My Least-Bad Response:** "It does work by separating the *structure* of rationality from the *substance* of value. Fittingness-first collapses structure into substance. I am claiming there is a formal constraint on reasoning (eligibility) that precedes the substantive question of value (fittingness). The work it does is blocking the category mistake that generates the WKR problem."
  **Cost Estimate:** **High.** If this lands, the paper looks like a terminological shuffle. It costs me the claim to novelty. I must pivot hard to the *practical consequences* of the view (e.g., how it handles pragmatic encroachment or moral dilemmas) to show it has bite beyond the definition.

  ## V. FLAGGED COLLAPSE ZONES
  *Be hyper-vigilant here. Do not use "fittingness" to explain "eligibility."*

  1.  **Defining the "Question":** If I say "The question admiration answers is 'Is he fitting?'," I collapse. I must say "The question admiration answers is 'What are his qualities?'" (Substantive, not evaluative).
  2.  **Defining "Premise":** If I say "A premise must show fittingness," I collapse. I must say "A premise must bear on the constitutive aim of the attitude."
  3.  **The "Right Kind" Label:** If I equate "Right Kind" with "Eligible," I am safe. If I equate "Right Kind" with "Fitting," I am dead.

  ## VI. STRATEGIC NOTE ON "PSYCHOLOGISM"
  Since there are no action theorists in the room, "deliberation" will be heard as "what happens in the brain."
  *   **Correction:** Whenever I say "deliberation," add "normatively constrained."
  *   **Correction:** Whenever I say "capacity," add "rational capacity."
  *   **Goal:** Keep the discussion on *normative architecture*, not *cognitive science*. If they ask about reaction times or cognitive load, pivot back to "rational requirements."
