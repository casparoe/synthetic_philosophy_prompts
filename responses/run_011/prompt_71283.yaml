answer: |-
  ### Exam Question (Question 4)

  **4. Read the following case and answer the sub-questions below. (20 marks)**

  **Case: Northfield Borough Council**
  Northfield borough council is recruiting one housing officer. Sixty applications arrive. Scoring each one properly takes about 40 minutes of a manager's time. The panel agrees a rubric out of 10 and adopts a rule: read applications in arrival order, and offer the job to the first candidate who scores 7 or above.

  (a) Candidate 9 scores 7.4 and is hired. Reading stops there. A year later, during an internal audit, the council scores the remaining 51 applications it never got to, and candidate 34 turns out to have scored 9.5.
  (b) The following year, for a different post, nobody in the first 25 applications clears 7, so the panel drops the threshold to 6 and hires someone at 6.4. Two years after that, with a strong field, they raise it to 8.
  (c) My friend, who does econometrics, says the whole fuss is empty: given that each application costs 40 minutes, a threshold of 7 is simply what maximising expected value net of search costs would tell you to use, so the council was maximising all along and "satisficing" is just a relabelled maximiser.

  **In an essay of approximately 45 minutes' length, address the following:**

  1.  Does the discovery of Candidate 34 demonstrate that the council's initial decision was irrational? Distinguish between the quality of the outcome and the rationality of the procedure given the information available at the time. (5 marks)
  2.  Do the shifting thresholds in (b) indicate that the aspiration level is an arbitrary moving target, or do they demonstrate a specific conception of rationality? Explain. (5 marks)
  3.  Evaluate the friend's claim in (c). For their argument to hold, what must be true about the council's knowledge? If their argument succeeds, is anything left of satisficing as a distinct normative view, or is it merely maximising with costs written in? (10 marks)

  ***

  ### Model Answer

  The Northfield case illustrates the tension between substantive rationality, which judges decisions by their outcomes, and procedural rationality, which judges them by the process used to reach them. To evaluate the council's actions, we must reject the demand for omniscience and recognise that rationality is constrained by information and cognitive capacity.

  Regarding (a), the discovery of Candidate 34 does not render the hiring of Candidate 9 irrational. This objection confuses *ex post* outcomes with *ex ante* rationality. At the moment of decision, the council possessed no information regarding candidates 10 through 60. A rational procedure cannot be faulted for failing to select an option that was epistemically inaccessible. To claim the decision was irrational because a better option existed but was unknown is to demand that rational agents be clairvoyant. The rationality of the choice rests on whether the stopping rule was a reasonable response to the constraints faced at the time, not on whether a superior outcome happened to exist in the unexamined pile. The cost of reading all sixty applications is relevant to the design of the rule, but the specific missed opportunity is irrelevant to the justification of the rule's application.

  Regarding (b), the shifting thresholds do not show inconsistency; they demonstrate that aspiration levels are adaptive tools for procedural rationality. If the aspiration level were a fixed normative standard of "goodness," changing it would indeed be irrational. However, under bounded rationality, the aspiration level functions as a search-stopping mechanism calibrated to the environment. In a weak field, a threshold of 7 leads to no hire and infinite search costs; lowering it to 6 ensures a decision is made. In a strong field, raising it to 8 captures higher value without prohibitive search costs. This shows rationality is not about adhering to a static ideal, but about adjusting procedures to ensure decisions are actually reached within resource limits. The standard is not "the best possible candidate" but "the best candidate identifiable within reasonable effort."

  The friend's claim in (c) presents the "collapse argument": that satisficing is merely constrained maximisation. For this to hold, the council would need to know the probability distribution of candidate quality in advance. To calculate the threshold that maximises expected value net of search costs, one must know the likelihood of encountering a 9.5 versus a 6.0. The council does not know this; they discover quality only by paying the search cost. If they knew the distribution, they could indeed calculate an optimal stopping point that looks like a satisficing threshold.

  However, if the friend is right, satisficing loses its status as a distinct normative rival to maximisation. It becomes a heuristic approximation of maximisation under ignorance. Yet, a residue of distinctness remains. Maximisation, even with costs, implies a single optimal solution exists if only we could calculate it. Satisficing suggests that when calculation is impossible due to ignorance of the distribution, the "optimal" solution is undefined. In such cases, a satisficing rule is not a second-best proxy for maximisation; it is the *only* rational approach available. Therefore, satisficing survives not as a different goal, but as a recognition that in complex environments, the cost of calculating the "maximising" rule exceeds the cost of the search itself. The friend is correct that the behaviour looks similar, but wrong that the underlying logic is the same. One requires impossible knowledge; the other accepts ignorance as a boundary condition for rationality.

  ***

  ### Marking Scheme & Markers' Notes

  **Total Marks: 20**
  **Pass Threshold:** 8/20 (Must hit Moves 1, 2, and 3 minimally).
  **First-Class Threshold:** 16/20 (Must hit all 5 moves with clear argumentation in Move 5).

  | Move | Requirement | Marks | Common Fumble |
  | :--- | :--- | :--- | :--- |
  | **1. Ex Ante Defense** | Argues (a) is not irrational because rationality depends on information available *at the time*, not hindsight. | 4 | Treats (a) as settled merely by saying "reading 60 apps takes 40 hours" (focuses on cost, not epistemic limits). |
  | **2. Outcome vs. Process** | Distinguishes substantive rationality (outcome) from procedural rationality (process). | 4 | Conflates a "bad outcome" (missing the 9.5) with a "bad decision." |
  | **3. Adaptive Aspirations** | Explains (b) as calibration to the environment, not arbitrary shifting. Identifies this as procedural rationality. | 4 | Claims the council was "inconsistent" or "irrational" for changing the rules. |
  | **4. The Collapse Condition** | Identifies that for (c) to work, the council must know the probability distribution of candidates (which they don't). | 4 | Accepts the friend's claim without noting the informational requirements for expected value calculation. |
  | **5. Distinctness Verdict** | Takes a stand on whether satisficing survives the collapse. (e.g., It survives as a response to ignorance, not just cost). | 4 | Sits on the fence or claims satisficing is just "psychologically easier" without normative weight. |

  **⚠️ MARKER WARNINGS: "Good on Skim" Errors**

  *   **The "Cost" Trap (Move 1):** Students often defend the council in (a) by saying, *"It would have taken 40 hours to read the rest, so they couldn't."* **Mark down.** This misses the philosophical point. The question is about *rationality*, not just feasibility. They must argue that rationality does not require omniscience, regardless of the time cost.
  *   **The "Realism" Vagueness (Move 5):** Students often write, *"Satisficing is better because it is more realistic."* **Mark down unless qualified.** They must specify whether "realistic" means "psychologically accurate" (descriptive) or "normatively appropriate for limited agents" (prescriptive). If they don't distinguish these, they haven't answered whether satisficing is a rival *normative* view.
  *   **Ignoring (c):** A student cannot score above 12/20 if they do not engage with the friend's collapse argument. It is the crux of the question.

  **Note on Citations:**
  **STRICT RULE:** Do not award marks for namedropping (e.g., "Simon," "Stigler," "Search Theory"). The module instructions forbade primary reading. Arguments must stand on the concepts taught. If a student cites Simon, they are relying on outside knowledge; assess the argument, but do not reward the name.
