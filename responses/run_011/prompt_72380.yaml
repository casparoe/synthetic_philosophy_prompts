answer: |-
  1. **Bottom line**
  Stop promising descriptive representation when your recruitment yield is one per cent. You cannot claim a statistical mirror when ninety-nine per cent self-exclude. Stop designing binding panels without agreeing whether legitimacy rests on resemblance (mirror) or equal opportunity (ladder). If you cannot articulate which logic, you cannot defend the outcome. Stop accepting commissions where the client cannot state what decision power they relinquish. Ambiguous mandates build shields. Align design with recruitment reality.

  2. **Mirror or ladder, made operational**
  Run this test in the first meeting. Ask: "If the panel looks nothing like the population but was chosen fairly, is the result still valid?" If they say yes, they want a Ladder. They care about breaking electoral advantage, not demographics. Listen for phrases like "level playing field," "ordinary people," or "outside politics." If they say no, they want a Mirror. They need the panel to stand in for the public. Listen for "representative sample," "demographic match," or "voice of the community."

  If they say both, force a priority. Ask: "If we hit demographic quotas but miss the recruitment target, do we cancel?" A 'no' confirms Ladder logic; a 'yes' confirms Mirror. If they refuse to choose, flag the request as high-risk. You cannot design recruitment for two conflicting legitimacy models. Record their answer in the project charter. If the answer shifts later, halt the design. Consistency matters more than speed.

  Crucially, check the stakes. Mirror logic fails on high-stakes binding decisions if recruitment is weak. Ladder logic holds better there, provided the random selection is robust. If the client insists on Mirror legitimacy but won't fund the recruitment needed to achieve it, the procedure must trigger a stop. Do not proceed until the legitimacy source is signed off by the director. This prevents retrospective criticism when the panel's composition is inevitably questioned by the press or opposition parties.

  3. **The procedure**
  Step One: Legitimacy Source. Ask the sponsor to select either Mirror or Ladder as the primary justification. A sufficient answer names the model and accepts its trade-offs. If they insist on both without prioritization, stop. You cannot defend a process that claims statistical representation without statistical recruitment. If they choose Mirror, proceed to Step Two. If Ladder, proceed to Step Three. This distinction dictates your recruitment strategy. Mirror requires intensive outreach to reduce self-selection bias. Ladder requires robust random selection but accepts self-selection as a feature of voluntary civic duty.

  Step Two: Recruitment Reality (Mirror only). Ask: "Can you fund and support recruitment sufficient to achieve a 20 per cent response rate?" A sufficient answer involves budget for intensive community outreach, not just random mailouts. If the answer is no, you cannot claim Mirror legitimacy. Switch to Ladder logic or stop. If you proceed with low recruitment under a Mirror claim, you are misleading the public. Your current one per cent yield is statistically incompatible with descriptive representation. Acknowledge this limitation openly. If the client insists on Mirror legitimacy without the budget to achieve it, the procedure mandates a stop. You cannot build a mirror out of volunteers.

  Step Three: Decision Clarity. Ask: "What specific decision is being transferred?" A sufficient answer identifies a specific budget, policy, or appointment. Vague answers like "guidance on strategy" indicate advisory intent, not binding. If the scope is vague, halt. Binding panels require binding questions. Ambiguity here suggests the client wants the appearance of power without the risk. Ensure the question is binary or ranked, not open-ended. Open-ended decisions are harder to implement and easier to ignore.

  Step Four: The Blame Shield Test. This is critical. Ask: "If the panel decides X, and X is unpopular, who takes the hit?" Then follow up: "Are you seeking a decision you cannot make yourselves?" A sufficient answer acknowledges political risk remains with the elected body. If the sponsor suggests the panel exists to absorb backlash, flag this immediately. Phrase it politely but firmly: "We need to ensure this panel isn't perceived as a mechanism to relocate accountability rather than resolve a deadlock. Is the goal to find a solution, or to ensure no single politician is blamed for the outcome?" If the sponsor admits the goal is toxicity avoidance, issue a flat no. Democratic innovation cannot legitimize cowardice. If the panel is used to shield elected officials from difficult choices, it undermines the very democracy you are trying to innovate. If they hesitate, probe deeper. Ask if there is a specific councillor who fears electoral loss. If the answer is yes, the panel is being weaponized.

  Step Five: Implementation Commitment. Ask: "Will you implement the decision regardless of outcome?" A sufficient answer is a written commitment from the relevant committee or executive. Verbal assurances are insufficient. If they reserve the right to override the panel, the panel is advisory, not deciding. Reclassify the project. Binding power requires pre-commitment. Without it, you are running an expensive consultation and calling it a decision.

  Step Six: Final Sign-off. The director must sign the legitimacy model and the implementation commitment. This hands the decision back to a human. The procedure identifies the risks; the director accepts them. If the director signs off on a Mirror claim with one per cent recruitment, they own the reputational damage. This step ensures accountability flows upward, not just downward to the panel.

  Stop Conditions. The procedure stops with a flat no if: the sponsor refuses to choose a legitimacy model; recruitment cannot match the claimed model; the decision scope is vague; the Blame Shield Test reveals accountability avoidance; or implementation is not guaranteed. These are hard stops. Do not look for workarounds. If any stop condition is met, issue a formal 'No Go' memo. Do not rely on verbal warnings.

  Human Decision Points. The procedure hands back to humans when: weighing political risk versus democratic gain; deciding if a Ladder logic is sufficient for the specific policy area; or determining if the recruitment budget is viable. These are value judgments, not factual checks. The procedure clarifies the stakes; the leader makes the call.

  Documentation. Every answer must be recorded in the project charter. This creates an audit trail. If the process is challenged later, you can demonstrate due diligence. This protects the team from accusations of bias or incompetence.

  4. **Where it will misfire**
  This procedure relies on honest answers from politicians who may have incentives to lie. Step Four (Blame Shield) is a judgment call wearing a procedural costume. You are interpreting tone and hesitation, not checking a box. If a leader says "we want a solution" but their body language screams "we want cover," the procedure cannot catch that unless you challenge them. Similarly, the Mirror vs Ladder distinction is theoretical. In practice, clients want the legitimacy of the Mirror with the convenience of the Ladder. The procedure forces a choice, but it cannot force them to understand the implications.

  What happens when the honest answer is "we don't know"? This occurs often with new clients. The procedure should not stop immediately. Instead, it triggers a "Discovery Phase." You run a mini-workshop to define the legitimacy model before designing the panel. However, if "we don't know" persists after the workshop, you must stop. Designing a binding panel on uncertain legitimacy is negligent.

  Finally, the procedure assumes you have the power to say no. If commercial pressure or political directive overrides the protocol, the procedure becomes a paper shield. You must document the override. If the director signs against the procedure's advice, record the deviation. This protects the team when the project inevitably faces criticism. The procedure manages risk, it does not eliminate it. It also cannot fix your recruitment bias. If you need a Mirror but only have Ladder recruitment, the procedure says 'stop', but political pressure may say 'go'. You need a script for that conversation.

  5. **Three cases**
  (a) **Metropolitan Borough Capital Money.**
  **Outcome:** Proceed (Ladder).
  **Reasoning:** The client cites vote-based capture as the problem. This is classic Ladder logic: removing the advantage of organized groups who turn out votes. They are not claiming the panel represents demographics; they claim it represents a fairer decision process. The binding nature is clear (£2.4m split). The recruitment bias matters less here because the goal is to break the campaign dynamic, not to mirror the population. The panel acts as a neutral arbiter between competing interest groups.
  **What would change the answer:** To change this to a No, the recruitment would need to be so biased that it favors one project group anyway (e.g., if only residents near Project A respond). Or if the Council reserves the right to veto the split. If the Council says "we will only implement if it matches our prior preference," the binding claim is false. Also, if the client insists on Mirror legitimacy despite the 1% yield, you must stop. They cannot claim statistical representation without statistical recruitment. The project works only if they accept the Ladder justification openly.

  (b) **Combined Authority Scrutiny Chair.**
  **Outcome:** No (Ladder fails).
  **Reasoning:** This is a Ladder attempt (random resident vs councillor), but the role requires specific skills and political mandate. A random person cannot hold the executive to account without party backing or training. It risks creating a figurehead without power. Legitimacy is weak because scrutiny is inherently political. Sortition removes the electoral mandate required to challenge an elected executive. The "Ladder" benefit of removing ambition is outweighed by the loss of accountability mechanisms inherent in elections.
  **What would change the answer:** To proceed, the role would need to be non-executive advisory, or the random chair would need significant training and staff support, effectively making it a paid job with terms, moving it away from pure sortition. Alternatively, if the role was limited to procedural oversight rather than political scrutiny, it might pass. But as described, it conflates administrative randomness with political authority. You would need to redesign the role to be a "Citizen Observer" with no voting power, shifting it back to advisory.

  (c) **District Council Planning Deadlock.**
  **Outcome:** No (Blame Shield).
  **Reasoning:** The leader chairs the funder board. This is a conflict of interest. The deadlock suggests high toxicity. The panel is likely being used to absorb blame for a decision the politicians won't make. The Blame Shield Test fails. The leader has a vested interest in the outcome via the funder board, compromising the panel's independence. Using sortition here looks like dumping a hot potato.
  **What would change the answer:** To proceed, the leader must recuse themselves from the funder board, and the Council must commit to implementing the decision regardless of public backlash. Without this, it is toxicity management. You would also need an independent oversight body to verify the recruitment and evidence process, ensuring the panel isn't fed biased information. Even then, the risk is high. The only way to make this safe is to remove the conflict of interest entirely and secure a written implementation guarantee from the full council, not just the leader's office.

  6. **What this procedure can't do**
  This procedure cannot fix your recruitment bias. If you need a Mirror but only get one per cent response, no amount of procedural rigor makes that statistically valid. It cannot guarantee political acceptance. A panel can make a perfect decision that the council still ignores if the political will evaporates. It cannot replace legal advice. Binding decisions may violate statutory requirements; this protocol checks democratic legitimacy, not legality. Finally, it cannot protect you from bad faith actors. If a client lies about their intent, the procedure records the lie but does not prevent the project. It is a tool for clarity, not a guarantee of success. It also cannot predict media reaction. A process can be robust and still be attacked as undemocratic by opponents. You need a communications strategy alongside this protocol.
