answer: |-
  1. **Accuracy**
  You have three historical vulnerabilities that a casuistry historian will exploit.

  First, the **ordering of the eight grades**. You have compressed the middle and end of the list. Augustine's sixth grade is specifically lying to protect *money or property*, which you have omitted entirely. The seventh is protecting *life* (temporal safety), and the eighth is protecting *bodily chastity*. By merging these into "temporal safety, temporal welfare, and bodily chastity," you erase the distinction between property and life, which is significant in the tradition. A respondent will note that the exclusion of property from your list conveniently makes Augustine's hierarchy look more purely "moral" and less "material" than it is. Restore the property grade or acknowledge the compression.

  Second, **Aquinas and the jocose lie**. You write that Aquinas converts the joke "from a non-lie into a venial sin." This is technically correct but dangerously phrased. For Augustine, a joke is not a lie *at all* (it falls outside the definition). For Aquinas, it *is* a lie by definition (asserting falsehood), but the *sin* is venial due to the intent. Your phrasing risks implying Aquinas changed the moral status but kept the definition, when he actually changed the definition to include jokes, which then allowed for the moral grading. The substantive shift is in the *definition of the lie*, not just the grading of the sin. If you claim the "licence condition" was absorbed into the "account of the lie's end," you are slightly mislocating the change: Aquinas absorbed it into the *definition* of the lie, then graded the end.

  Third, **Paul and Compassion**. You state Augustine reads Paul's "all things to all men" as compassion rather than deceit. This is safe, but be careful not to imply Augustine thinks Paul *withheld* truth in a way that would trigger the licence condition. Augustine insists Paul accommodated without asserting falsehood. If you imply Paul used figurative speech that outsiders might misunderstand, you tread close to the Priscillianist error Augustine condemns. Keep the emphasis on *accommodation without assertion*.

  2. **The Licence Condition**
  You are retrofitting a Gricean apparatus, and it shows. Augustine does not think in terms of "licences," "expectations," or "conversational maxims." He thinks in terms of *signs* and *intentions*. For Augustine, a sign is ordained to manifest the mind. If the mind intends play, and the sign (tone, context) manifests play, the sign is functioning correctly. There is no "licence withdrawal"; there is simply a different *kind* of signification.

  The breakdown occurs when you move from jokes (where the sign *itself* manifests play) to mental reservation (where the sign manifests truth, but the mind holds a reservation). You claim the licence is "publicly withdrawn." But for Augustine, the issue isn't whether the hearer is *licensed* to expect truth; it's whether the sign *actually manifests* the heart. If the sign manifests $X$ and the heart holds $Y$, it is a lie, regardless of whether the hearer "should have known."

  To save this without historical cheating, reframe the "licence condition" as a "condition of manifest signification." The joke works not because the hearer is licensed to disbelieve, but because the speaker's intent to play is *manifest* in the sign. This survives the breakdown: strict mental reservation fails not because the hearer lacks a licence, but because the reservation is *not manifest* in the sign. This aligns with Augustine's semiotics rather than importing a modern speech-act theory.

  3. **Stress Cases**
  The **border checkpoint** case does the most damage, and it threatens to make your modification ad hoc.

  *   **Poker:** Works cleanly. Shared practice, overt signals.
  *   **Pseudonym:** Works if there is a known convention of denial; fails if it's a private secret.
  *   **Abuse:** The condition classifies this as a lie (no licence withdrawn). This is morally rigid but historically consistent with Augustine. It doesn't break the theory, though it limits its appeal.
  *   **Border Checkpoint:** Here is the problem. You argue broad mental reservation is illegitimate because the "shared practice" is missing. But the casuists argued the practice *existed* (e.g., the judge knows the accused will evade; the officer knows the traveler will hide contraband). If you define "shared practice" narrowly enough to exclude the checkpoint, you risk begging the question. To make the condition work here, you must insist that the qualification must be *recoverable from the words or immediate context*, not from a general suspicion of deceit. If you modify the condition to say "the hearer must be able to recover the truth from the *utterance itself*," you save the theory, but you must admit this is a stipulation designed specifically to rule out the casuist position. It is ad hoc unless you can ground it in Augustine's view of *natural* signification versus *conventional* evasion.

  4. **Aquinas Material**
  It earns its place, but only if you tighten the link between the "Sign-Theory" and the "Taxonomy." Currently, you suggest the sign-theory explains the ranking, and the debt-theory explains the threefold division. You need to make explicit that the **shift in taxonomy is a consequence of the shift in ground**.

  Because Augustine sees lying as a perversion of the *sign*, any assertion contrary to the heart is a lie (except where the sign itself indicates play). Because Aquinas sees lying as a violation of *justice*, he can categorize lies by the *debt owed*. The jocose lie becomes a lie because a debt of truth is technically owed, but it is venial because the debt is light. This explains *why* Aquinas could retain the prohibition on lying while dismantling Augustine's specific grades. If you make this causal link explicit, the section is necessary. If you leave it as two parallel observations (he changed the grades, and he changed the ground), a respondent will call it decoration.

  5. **The Strongest Objection**
  A defender of strict mental reservation (e.g., Sanchez) would argue: **"The hearer has no licence to the truth in an unjust context."**

  They would press that the "licence condition" presupposes a cooperative framework where truth is the default debt. In cases of unjust interrogation (heresy trials, border checks without warrant), the interrogator forfeits the right to the truth. Therefore, the speaker owes no debt, and the "heart" is not double because the speaker is not obliged to manifest that specific truth to that specific hearer. The reservation is not "invisible" in a deceptive sense; it is a silent claim of right.

  Your draft has **no reply** to this other than restating that the sign is deceptive. You argue the hearer's licence is intact; they argue the hearer's *right* is void. To answer this, you must argue that for Augustine, the obligation to truth is owed to *God* or to the *nature of speech*, not to the hearer. If the obligation is to the nature of speech, the hearer's rights are irrelevant. You need to add this premise: "For Augustine, the manifestation of the heart is a duty owed to the order of creation, not a debt negotiated between speaker and hearer." Without this, the casuist's "unjust interrogator" defense dismantles your licence condition.

  6. **The Non-Sequitur**
  The sentence: *"Augustine therefore has a general account available and declines to generalize it, and I want to argue that the declination is principled rather than merely pious."*

  This is a non-sequitur. The fact that Augustine makes an exception for jokes does not entail that he possesses a "general account" (the licence condition) that he is consciously choosing not to apply elsewhere. He may simply view jokes as a *sui generis* category of speech that falls outside the definition of assertion, rather than an instance of a broader principle of warrant-withdrawal.

  To make this valid, you must add the premise: **"Augustine's exclusion of jokes relies on the same semiotic principle (manifestation of intent) that governs his definition of lying."** Without establishing that the joke exception and the lie definition share a common theoretical root, you cannot claim he "declined to generalize." You are attributing a systematic restraint to him that he may not have recognized.
