prompt: |-
  I'm a fourth-year in philosophy of biology and I'm using the ENCODE fight as the running case for my chapter on functions, mostly because everyone else uses heart pumps blood and I'm sick of it. What I need is a proper case analysis, not the textbook survey — I know Wright and Cummins cold, and I know the selected-effect vs. causal-role distinction, Millikan, Neander, Godfrey-Smith's proper function / modern history split. Don't recite any of that back at me except insofar as it does work on the case. No citations, no reading list, I have all of it.

  The facts as I've got them, so you're not guessing: the 2012 round of consortium papers defined function operationally as biochemical activity — transcribed, bound by transcription factors, or carrying a chromatin signature — in at least one of the assayed cell types, and the headline number that came out of that was something like 80% of the genome. Critics (Graur, Doolittle, Palazzo, Gregory, roughly that crew) said activity isn't function and that the mutation-load argument caps the functional fraction somewhere near 10%; the junk tradition runs back through Ohno and the C-value paradox to the 1980 selfish-DNA papers, with neutral theory supplying the mechanism that lets slightly deleterious junk hang around, and Cavalier-Smith dissenting from the other direction with the nucleoskeletal stuff. One of the critics ran a reductio comparing the consortium's reasoning to counting the heat a TV set gives off among the set's functions.

  First: do the mapping, and be disciplined about it. Who are the players and what is actually being disputed — the word, the concept, the measurement, or a prior about genome architecture? Then run both standard accounts over concrete items: a transcribed locus with no detectable conservation, a transcription factor binding site, a processed pseudogene, an Alu element, a retroviral envelope gene that got co-opted for placental work, and a broken element that is still transcribed. Which account calls which of those functional, where they actually disagree versus just talk past each other, and where each one goes silent. Pay special attention to malfunction and to the co-opted case, since that's where the history and the current contribution come apart.

  Second, and this is the part I actually want pushed on: I've been sketching what I call the stability account, which says a trait has a function relative to a reference class of background conditions, meaning its contribution stays invariant across that class, and that the whole ENCODE brawl was really an unargued fight over which reference class is legitimate — one assay in one cell type versus deep evolutionary time. Tell me honestly whether that's a third account or just the old two with a dial on them. And then: given that a big part of the motivation was interpreting non-coding disease associations from association studies, what should the reference class be for that use, and does being useful for finding variants license a concept or only a database label?

  Finally, run it backwards. Does the episode confirm, embarrass, or just bypass the philosophical theories? Is there something here the accounts never anticipated — like the function concept getting set downstream by an assay pipeline and a funding mandate rather than by argument? And did philosophers make any difference at all, or was this biologists doing biology with philosophy as garnish? Give me the unflattering answer if that's the answer.
