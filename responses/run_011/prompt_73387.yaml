  *(Refining the Standing Rule)*: "When headline terminology conflicts with technical classification, the headline may reflect the subject's claimed identity if the article explicitly defines the scientific status within the first 10 percent of the text." -> A bit too technical. Let's try: "Headlines may use contested biological terms if the article text explicitly clarifies the scientific consensus on classification."

