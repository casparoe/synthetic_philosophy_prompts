          *   Critic's side: Species are historical lineages, not checklists of traits. You can't edit a mammoth into existence if the lineage broke.
          *   Synthesis: The disagreement is about classification conventions, not empirical facts. The article text covers the facts; the headline covers the narrative.
      *   **Standing Rule:** Needs to be simple for copy editors. "Headline the claim, clarify the status."

