  TO: Standards and Corrections Panel
  FROM: [My Name]
  DATE: October 23
  SUBJECT: Review of "The Mammoth Is Back"

  **Recommendation**
  We retain the headline but append an Editor's Note to the top of the online article. We implement this by Thursday noon.

  **Proposed Note**
  *Editor's Note: This headline reflects the terminology used by the de-extinction project discussed herein. While the developers classify these animals as mammoths, many paleogeneticists argue that species identity is determined by lineage rather than genetic traits, meaning these calves may scientifically remain Asian elephants.*

  **Reasoning**
  The conflict here isn't about facts; it's about metaphysics masquerading as taxonomy. The paleogeneticist claims our headline is "impossible." The reporter claims it's accurate. Both are right, but they are playing different games.

  The critic is making a claim about the world: specifically, that species are historical individuals defined by unbroken lineage. Under this view, you cannot edit a mammoth into existence any more than you can edit a Victorian into existence. The lineage broke; the kind is extinct. This treats "mammoth" like a proper name rigidly attached to a specific historical branch. If this view holds, the calves are elephants with mammoth traits, not mammoths.

  The reporter is making a claim about our words: specifically, how language functions in news reporting. The headline reports the event—the launch of a product called "Mammoth" by a company claiming to make mammoths. To headline this "Elephant-Like Hybrids Unveiled" is scientifically precise but newslessly dull. It ignores the social reality that funding, regulation, and public perception will treat these animals as mammoths. The reporter's defense is that we are reporting the claim, not certifying the taxonomy.

  The disagreement stems from confusing these two lanes. The critic thinks we are making a biological assertion; we are making a journalistic one. However, because the biological assertion is the stakes of the story, we must acknowledge the dispute. The article text already does the heavy lifting on the hedging; the note ensures the headline doesn't override that nuance for skimmers.

  **Reporter's Case (Strong Version)**
  The reporter argues that journalism tracks social reality, not just biological essence. If the FDA, the insurers, and the lab all call it a mammoth, calling it an "edited elephant" creates a disconnect between our coverage and the public discourse. Furthermore, the definition of species is not settled law. If functional equivalence becomes the standard for de-extinction, the "lineage" argument may become obsolete. Headlining the potential reality, rather than the conservative classification, invites readers into the breakthrough rather than shutting the door on it. To demand we use only the conservative taxonomy is to demand we ignore the intent of the actors we are covering.

  **Standing Rule**
  To prevent future deadlock, I propose the following rule for copy editors: *Headlines may use contested biological terms if the article text explicitly clarifies the scientific consensus on classification within the first five paragraphs.*

  This allows us to capture the news value without misleading readers on the science. It separates the hook from the proof.

  **Next Steps**
  If approved, I will draft the note into the CMS and notify the desk.

