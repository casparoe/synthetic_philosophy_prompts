      *   *Rule:* "Headlines may reflect project claims or common nomenclature provided the article text clarifies the scientific consensus on biological classification."

  9.  **Review against Word Count:**
      *   Need to ensure I don't ramble on the philosophy. Keep it practical.
      *   Ensure the "strong version of reporter's side" is present.
      *   Check the "world vs. word" distinction explicitly.

  10. **Final Polish:**
