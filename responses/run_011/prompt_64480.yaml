      *   *What needs naming for byproduct verdict?* Addressed in Part (c)/Model Answer (developmental mechanism).
      *   *Flow tank = utility not origin?* Addressed in Part (b)/Model Answer.
      *   *Experiment to separate?* Addressed in Part (d).

  8.  **Final Polish:** Ensure the "Model Answer" sounds like a good student answer, not a professor's lecture, but still meets the "commit to a verdict" requirement. The verdict should be: "The comparative data rejects the specific adaptation hypothesis for *population divergence*, but does not prove the trait is a spandrel."

