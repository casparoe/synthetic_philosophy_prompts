      *   *Implication:* The difference in relative spire height is entirely explained by the difference in body size moving along the allometric line.
      *   *The Trap:* Just saying "It's a spandrel" is as bad as just saying "It's an adaptation." The student needs to evaluate *why* the size difference exists and whether the allometry itself is a constraint.

  3.  **Drafting the Question:**
