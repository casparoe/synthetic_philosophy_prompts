prompt: |-
  ok so slightly unusual request. I'm a postdoc in evolutionary ecology, my PI is on sabbatical and I've inherited the third-year "adaptation and how to argue about it" module this term, which means I have to hand 40 biology undergrads a problem set by friday. And separately — this is the part thats actually driving the request — our manuscript came back from review last week and Reviewer 2 wrote that our focal trait is "a non-adaptive byproduct of the allometric scaling of body size, i.e. a spandrel," and that we never ruled that out. Two straight weeks of me being annoyed. Partly because I think they're right that we didn't rule it out, and partly because they never named a single constraint, they just reached for the word. I want my students to be able to do both halves of that properly, because clearly I need to.

  Could you write the problem-set question, a model answer, and a marking scheme?

  Level: third-year biology undergrads. They've had lectures on natural selection, allometry, and phylogenetic comparative methods, and they've read the 1979 spandrels paper (Gould and Lewontin). 25 marks, roughly 90 minutes of work, take-home. No reading list and no citations — the whole thing has to be answerable from the case study plus what they already know.

  The main thing I care about: I don't want a question that can be answered by reciting the spandrels paper back at me. Build it around a made-up dataset. Here's one I sketched, sharpen it or swap it for something better as long as it stays biologically plausible:

  16 populations of a rocky-shore snail along a wave-exposure gradient. The paper claims relative spire height is an adaptation to exposed shores (lower centre of mass, better grip). The data: log spire height against log shell length gives a common slope of about 0.66, and letting each population have its own slope doesn't improve the fit. Exposed populations are much smaller as adults (mean 18mm vs 31mm sheltered). Since the slope is under 1, small snails automatically have relatively taller spires, and once you put everyone on the common line the exposed and sheltered groups don't differ in their residuals.

  The question should make them say what this data does and doesn't license — and please don't rig it so that "spandrel" is obviously the right answer. That's the failure mode I'm trying to unlearn in myself. Stuff I'd want surfaced, assuming you agree these are the right pressure points: whether an intercept-and-common-slope analysis is even the appropriate test here; what someone would have to name for a byproduct verdict to be more than a label (what's the architecture in this case, and is the allometry itself a constraint or a conserved adaptation?); that a flow-tank experiment showing tall spires resist dislodgement better establishes current utility and not historical origin; and what experiment would actually separate "spire ratio rides along on body size" from "spire ratio is directly selected in exposed habitat," with the predicted result under each.

  Deliverables: (1) the question, in parts, with marks per part adding up to 25; (2) a model answer of about 800 words that actually commits to a verdict instead of hedging in both directions; (3) a marking scheme saying what an A answer contains versus a B answer, and the specific mistakes that cost marks and how many. For (3), tell me the errors students genuinely make on this material rather than the ones I guessed at above, and flag which two or three nearly everyone falls into.
