answer: |-
  Here is the complete package: the problem set, a model answer that takes a firm stance, and a marking scheme based on common pitfalls in evolutionary reasoning.

  ***

  ### 1. Problem Set Question (25 Marks)

  **Module:** Adaptation and How to Argue About It
  **Assessment:** Take-home Problem Set
  **Time:** ~90 minutes
  **Total Marks:** 25

  **Case Study: *Littorina ficta* Spire Height**
  A recent study examined 16 populations of a rocky-shore snail (*Littorina ficta*) across a gradient of wave exposure. The authors claim that relative spire height is an adaptation to exposed shores: a lower centre of mass improves grip and reduces dislodgement.

  You are provided with the following morphometric summary:
  1.  **Allometry:** A log-log regression of spire height against shell length for all 16 populations yields a common slope of 0.66. Allowing each population its own slope does not significantly improve the model fit.
  2.  **Body Size:** Adult snails in exposed populations are significantly smaller (mean length 18mm) than those in sheltered populations (mean length 31mm).
  3.  **Residuals:** When projected onto the common allometric line, the residuals (deviations from expected spire height) do not differ significantly between exposed and sheltered groups.

  **Questions:**

  **(a) Data Interpretation (5 marks)**
  Based *only* on the summary statistics provided, describe the precise nature of the shape difference between exposed and sheltered snails. Does the data support the claim that exposed snails have "relatively taller" spires? Explain the mathematical relationship between the slope value and the size difference.

  **(b) Evaluating the Adaptation Hypothesis (5 marks)**
  The authors cite a flow-tank experiment showing that snails with higher spire-to-length ratios withstand stronger water flow before dislodging. A critic argues this evidence is insufficient to prove adaptation. Using the distinction between *current utility* and *historical origin*, explain the critic's objection.

  **(c) The Byproduct Claim (5 marks)**
  A reviewer concludes the trait is a "spandrel" (non-adaptive byproduct) because the shape difference disappears when correcting for size via residuals. Is this verdict logically secure based on the data provided? Identify one specific piece of biological information about the allometric slope (0.66) that is missing but necessary to distinguish a "constraint" from a "conserved adaptation."

  **(d) Experimental Design (10 marks)**
  Propose a single experiment (field or lab) that can distinguish between two hypotheses:
  1.  **Direct Selection:** Spire ratio is directly selected for in exposed habitats.
  2.  **Correlated Response:** Spire ratio changes only because body size is selected/constrained, and spire ratio rides along due to allometry.

  Describe the manipulation, the control, and the specific pattern of results that would support *only* Hypothesis 2.

  ***

  ### 2. Model Answer (Approx. 800 words)

  **Verdict:** Based on the provided comparative data, the hypothesis that population divergence in spire shape is a direct adaptation to wave exposure is unsupported. The variation is consistent with a correlated response to body size. However, labeling the trait a "spandrel" is premature without mechanistic evidence regarding the allometry itself.

  **(a) Data Interpretation**
  The data indicate that exposed snails do have higher spire-to-length ratios in raw measurements, but this is entirely driven by body size, not independent shape change. The allometric slope of 0.66 indicates negative allometry; as shell length increases, spire height increases at a slower rate. Consequently, smaller individuals automatically possess relatively taller spires. Since exposed snails are smaller (18mm) than sheltered snails (31mm), they sit at different points on the same growth trajectory. The fact that residuals from the common line do not differ between groups confirms that there is no population-specific shift in the intercept. The "shape difference" is a movement along the line, not a shift of the line.

  **(b) Current Utility vs. Historical Origin**
  The flow-tank experiment demonstrates *current utility* (the trait functions beneficially in the current environment), but adaptation requires evidence of *historical origin* (the trait evolved *because* of that benefit). A trait can be useful without being an adaptation for that use (exaptation), or it can be a byproduct that happens to be beneficial. For example, if the high spire is a necessary consequence of being small (due to developmental architecture), and being small is the actual adaptation (e.g., to avoid wave drag or due to food limitation), then the spire height is merely a passenger. Demonstrating that the trait works does not rule out that it arose for a different reason or no reason at all.

  **(c) The Byproduct Claim**
  The reviewer's verdict is logically insecure. Showing that the difference vanishes in a residuals analysis proves that the *divergence* between populations is explained by size. It does not prove the trait is a "spandrel" in the Gould and Lewontin sense. To call it a spandrel, one must demonstrate that the allometric slope (0.66) represents a developmental or architectural constraint that selection cannot break.
  The missing information is the **evolvability of the slope**. If the slope of 0.66 is itself an adaptation (e.g., optimized for structural integrity across all sizes), then the relationship is adaptive, not a constraint. If the slope is fixed due to pleiotropy or physical laws that selection cannot overcome, then it is a constraint. Without quantifying genetic variance in the slope or identifying the developmental mechanism forcing the 0.66 ratio, "spandrel" is merely a label, not an explanation.

  **(d) Experimental Design**
  To separate Direct Selection from Correlated Response, we must decouple size from shape. A **Common Garden Reciprocal Transplant** with artificial selection lines is required.

  *   **Manipulation:** Establish selection lines in the lab from a single base population. Create "Small" lines and "Large" lines by selecting on body size only, explicitly preventing direct selection on spire shape.
  *   **Control:** A random-mating control line.
  *   **Procedure:** After 10 generations, place individuals from Small and Large lines into flow tanks simulating exposed conditions.
  *   **Predicted Results:**
      *   *Support for Direct Selection:* If spire ratio evolves independently of size (i.e., Small lines evolve lower spires to match the "exposed" phenotype despite being small), this indicates genetic variance in the intercept and direct selection on shape.
      *   *Support for Correlated Response (Hypothesis 2):* If the "Small" lines retain the high spire ratio predicted by the original 0.66 slope, and suffer higher dislodgement rates than wild exposed snails (which might have evolved a different slope), this confirms the high spire is a mandatory byproduct of small size.
      *   *Crucial Confirmation:* If we transplant wild exposed snails to sheltered conditions and they grow large but retain the "exposed" slope (different intercept), that proves genetic divergence in shape. If they simply move along the 0.66 line as they grow, it confirms plasticity along a constrained allometric line.

  **Conclusion**
  The comparative data rules out the specific claim that spire shape divergence is a direct adaptation to waves. It supports the null hypothesis that shape divergence is a byproduct of size divergence. However, calling the trait a spandrel requires proving the allometry itself is a constraint, not a conserved adaptation. The burden of proof lies on demonstrating that the slope *cannot* evolve, not just that it *hasn't* in this dataset.

  ***

  ### 3. Marking Scheme

  **Total Marks:** 25
  **Grade Boundaries:**
  *   **A (20-25):** Commits to a verdict; distinguishes utility/origin; identifies the "slope evolvability" gap; experimental design cleanly decouples size/shape.
  *   **B (15-19):** Correct terminology; identifies residuals issue; experiment is plausible but predictions are vague or don't fully decouple variables.
  *   **C (10-14):** Describes data correctly; conflates utility and adaptation; experiment is a standard "common garden" without selection lines or specific predictions.
  *   **D/F (<10):** Fundamental misunderstandings of allometry or adaptationism.

  **Part-by-Part Breakdown & Common Errors**

  **(a) Data Interpretation (5 marks)**
  *   **2 marks:** Correctly identifies negative allometry (slope < 1 means ratio decreases with size).
  *   **2 marks:** Notes exposed snails are smaller, therefore *automatically* have higher ratios on this line.
  *   **1 mark:** Explicitly states residuals show no independent shape difference (intercept is constant).
  *   **Common Error (The "Slope Trap"):** Students think slope 0.66 means spire gets smaller. It means it gets smaller *relative to length*. (Deduct 2 marks).
  *   **Common Error (The "Significance" Trap):** Students argue that because the slope is "significant," the trait is adaptive. (Deduct 2 marks).

  **(b) Utility vs. Origin (5 marks)**
  *   **3 marks:** Clear definition: Utility = function now; Origin = history of selection.
  *   **2 marks:** Application: Flow tank shows function, but trait could be a passenger on size selection.
  *   **Common Error (The "Gould Recitation"):** Quoting Gould & Lewontin without applying it to the snail. (Max 2/5).
  *   **Common Error (The "Exaptation" Confusion):** Calling it an exaptation without establishing it was selected for something else first. (Deduct 1 mark).

  **(c) The Byproduct Claim (5 marks)**
  *   **3 marks:** Identifies that residuals analysis only explains the *difference*, not the *trait*.
  *   **2 marks:** Identifies the missing link: Is the slope (0.66) a constraint or an adaptation? (Evolvability of allometry).
  *   **Common Error (The "Spandrel Label"):** Accepting the reviewer's "spandrel" claim as proven by the residuals. This is the exact failure mode the module addresses. (Deduct 3 marks).
  *   **Common Error (The "Constraint = Allometry" Equivalence):** Assuming all allometry is constraint. (Deduct 2 marks).

  **(d) Experimental Design (10 marks)**
  *   **4 marks:** Design allows size and shape to vary independently (e.g., selecting on size only, or reciprocal transplant with growth monitoring).
  *   **3 marks:** Clear prediction for Correlated Response (Shape follows size strictly).
  *   **3 marks:** Clear prediction for Direct Selection (Shape diverges from allometric expectation).
  *   **Common Error (The "Common Garden Only"):** Proposing a common garden but failing to mention that if they just grow along the same line, you haven't proven constraint, only plasticity. (Deduct 3 marks).
  *   **Common Error (The "Vague Outcome"):** "If the results differ, it supports H1." (Deduct 3 marks). Must specify *how* they differ.
  *   **Nearly Universal Error:** Almost all B-grade students will propose a transplant experiment but forget to measure the *allometric slope* in the offspring, focusing only on mean trait values. This misses the point of the case study. (Cap at 18/25 if slope is ignored).

  **Specific Note for Markers:**
  Watch for the "Reviewer 2 Syndrome." If a student concludes "Therefore, it is a spandrel," they have failed Part (c). The correct answer is "The data is consistent with a byproduct, but 'spandrel' requires evidence of constraint." Reward students who treat "spandrel" as a hypothesis to be tested, not a conclusion to be stated.
