      *   **Constraints:** 25 marks, ~90 mins work, take-home. 3rd-year level (know selection, allometry, phylogenetic methods, Gould & Lewontin). No external reading/citations needed.
      *   **Specific Content:** Use the provided snail case study (16 populations, wave exposure, spire height vs. shell length, allometric slope 0.66, size difference between habitats, residuals don't differ).
      *   **Key Learning Outcomes:** Distinguish current utility from historical origin; understand allometric constraints vs. adaptations; design experiments to separate direct selection from correlated response; avoid just name-dropping "spandrel."
