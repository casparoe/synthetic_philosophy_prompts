  5.  **Drafting the Marking Scheme:**
      *   Need A vs. B distinctions.
      *   Need "Common Errors" (The User specifically asked for "errors students genuinely make... flag which two or three nearly everyone falls into").
      *   *Common Error 1:* Equating current utility (flow tank) with historical adaptation.
