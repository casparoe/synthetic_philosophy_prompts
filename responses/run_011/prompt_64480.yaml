      *   *Hypothesis 2 (Byproduct/Allometry):* Exposed snails are smaller (stunted growth due to stress/food/waves). Allometric slope < 1 (negative allometry of spire to length? Wait, log-log slope 0.66 means as length increases, spire height increases slower. So smaller snails have *relatively* taller spires).
