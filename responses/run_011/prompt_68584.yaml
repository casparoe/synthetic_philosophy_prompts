answer: |-
  1. **Mapping Exercise**

  *   **(i) supports (iii) and (iv):** By defining factual truth as dependent on witnesses and records (and thus revisable by power), you establish the ground for claiming that insisting on it stops politics (iii) and that destroying the record is a unique harm (iv).
  *   **(ii) supports (iv):** Defining lying as a capacity akin to acting (making the world other) provides the ontological basis for legitimizing the "prospective lie" as a form of political action rather than mere falsification.
  *   **(v) and (vi) are mutually reinforcing:** (v) identifies the mechanism (image-making) that causes the harm described in (vi) (collapse of the truth/falsehood distinction).
  *   **(vii) conflicts with (viii):** (vii) asserts agent-neutrality (harm is measured by depletion of testimony stock regardless of who lies); (viii) asserts strict asymmetry based on direction/office (State lies are worse regardless of consequences). These cannot both be true as stated.
  *   **(iv) conflicts with (vii):** (iv) offers a categorical defense for prospective lies based on their temporal direction; (vii) assesses lies based on their consequentialist contribution to epistemic depletion. A prospective lie could deplete the stock just as severely as a retrospective one.
  *   **(i) and (iii) are compatible but tense:** (i) describes the vulnerability of factual truth; (iii) prescribes a lack of virtue for those who defend it. This requires an auxiliary normative claim that political freedom outweighs factual stability.

  2. **Audit Proper**

  *   **Tension 1 (Severity: Critical): (vii) vs. (viii).**
      *   **Mechanism:** Direct logical contradiction. (vii) defines the wrongness of a lie by its *outcome* (depletion of testimony) measured *neutrally* across agents. (viii) defines the wrongness by the *identity/direction* of the agent (State vs. Citizen), explicitly overriding consequences ("even where the second is... larger").
      *   **Ambiguity:** None. "Agent-neutral" excludes role-based asymmetry.
      *   **Cheapest Revision:** Modify (vii) to remove "agent-neutral." Replace with "institutionally sensitive." State that the depletion of reliable testimony is *weighted* by the institutional role of the liar, because the State is the primary guarantor of the record.
      *   **Cost:** You lose the clean consequentialist framework of (vii). You must now argue that the *same* falsehood depletes the stock *more* when uttered by the State, which requires a theory of institutional trust rather than just aggregate truth-counting.

  *   **Tension 2 (Severity: High): (iv) vs. (vii).**
      *   **Mechanism:** Categorical vs. Consequentialist evaluation. (iv) grants legitimacy based on the *type* of lie (prospective). (vii) judges based on the *effect* (depletion). If a prospective lie (e.g., the emissions target) causes massive epistemic confusion when it fails, (vii) condemns it while (iv) defends it.
      *   **Ambiguity:** "Legitimate category" in (iv). Does this mean "not a lie" or "a justified lie"? If the latter, it conflicts with (vii)'s metric of harm.
      *   **Cheapest Revision:** Clarify in (iv) that prospective lies are only legitimate *provided they do not degrade the medium of future testimony*. Tie the defense to the condition that the lie remains recognizable as political negotiation rather than factual claim.
      *   **Cost:** Weakens the defense of the prospective lie. It makes legitimacy contingent on the very harm metric you tried to bypass in (iv).

  *   **Tension 3 (Severity: Medium): (iii) vs. (vi).**
      *   **Mechanism:** Normative dissonance. (iii) claims truthfulness is not a virtue and the truth-teller is not a model citizen. (vi) claims the primary harm is the collapse of the truth/falsehood distinction. If maintaining that distinction is the primary good, the agents who maintain it (truth-tellers) should arguably be virtuous.
      *   **Ambiguity:** "Truthfulness" in (iii) vs. "Distinction" in (vi). You may mean "stubborn insistence on facts" vs. "structural integrity of the record."
      *   **Cheapest Revision:** Specify in (iii) that truthfulness is not a virtue *of action*, whereas (vi) concerns the *condition* for action.
      *   **Cost:** Requires a nuanced distinction between individual character ethics and structural institutional ethics, which complicates the populist appeal of (iii).

  3. **The False Inconsistency**

  *   **Pair:** (i) and (iv).
  *   **Appearance:** (i) states factual truth is "at the mercy of politics" and can be "revised by anyone with the standing or the power." (iv) states the retrospective lie has "no comparable defense" because it is "merely destroying." If power can revise the record anyway (as per (i)), why is the lie uniquely indefensible (as per (iv))? It appears you are claiming the record is both fragile (i) and sacred (iv).
  *   **Resolution:** This is not inconsistent because (i) is an ontological claim about the *vulnerability* of factual truth, while (iv) is a normative claim about the *prohibition* against exploiting that vulnerability. (i) describes the political reality that facts are contingent on human agreement; (iv) prescribes the ethical boundary that prevents that contingency from becoming nihilism. You can acknowledge that a record *can* be destroyed by power while simultaneously arguing that doing so is politically illegitimate. The tension is intentional, not contradictory.

  4. **Silent Auxiliary Assumptions**

  *   **The Non-Linearity of Epistemic Harm:** To resolve your instability in Case 1 (Minister vs. Contractor) without abandoning (viii), you are silently assuming that epistemic harm is not linear. You assume a State lie depletes the "common stock of reliable testimony" disproportionately more than a Citizen lie, even if the Citizen lie has wider immediate reach. Without this, (vii) forces you to condemn the Contractor more, and (viii) forces you to condemn the Minister more.
  *   **The Definition of "State" Actor:** In Case 1, you treat the Contractor as a Citizen. To make (viii) work comfortably, you must assume that giving testimony at a legislative hearing does not temporarily confer "State-adjacent" status on the Contractor. If the Contractor is treated as an official witness, the asymmetry in (viii) blurs, worsening your instability.
  *   **The Possibility of "Good Faith" Prospective Claims:** In Case 2 (Emissions), you need to assume that announcing a target without measurement machinery can still be a "prospective lie" in the legitimate sense (iv) rather than simple fraud. This requires assuming the actors *intend* to build the machinery later, or that the announcement itself is a performative act that helps bring the reality about. If they know they will never measure it, (iv) collapses into retrospective deception about future intent.

  5. **Single Revision Recommendation**

  **Revise (vii).**

  Replace the phrase "institutional and agent-neutral" with "institutionally weighted."

  **Reasoning:** This single change resolves the critical logical contradiction with (viii) while preserving the core insight of (vii) regarding epistemic harm. By acknowledging that the *source* of testimony determines the *rate* of depletion, you allow State lies to count as "worse" than Citizen lies even if the immediate consequences are smaller, because the State lie damages the *guarantor* of the record itself. This stabilizes your verdict on Case 1 (Minister vs. Contractor): the Minister's lie is worse not because of the procurement contract's size, but because it corrodes the institutional source of the record. It also helps Case 2: if the Government announces a target with no machinery, it is not just a prospective lie, but a State act that devalues the currency of future State announcements, weighing heavily under the revised (vii). This revision costs you the purity of agent-neutrality but saves the package from internal contradiction.
