  I'm in a second-semester Plato seminar and we've just moved into the Parmenides. I missed the session where we covered the first half of the Forms discussion because I was out with the flu, and all I have is this text pulled off Perseus — an old public-domain translation, Jowett's I think, though it may be a revised edition of it and I honestly couldn't tell you which. I don't have a print copy and I can't check it against any other translation, so please work only from what I've pasted below and flag anywhere you suspect the English is doing something the Greek wouldn't.

  Here's the stretch I'm stuck on, basically continuous except where I've marked a gap:

  > [131b] “Then while it is one and the same, the whole of it would be in many separate individuals at once, and thus it would itself be separate from itself.” “No,” he replied, “for it might be like day, which is one and the same, is in many places at once, and yet is not separated from itself; so each idea, though one and the same, might be in all its participants at once.” “That,” said he, “is very neat, Socrates you make one to be in many places at once, just as if you should spread a sail over many persons and then should say it was one and all of it was over many.
  >
  > [131c] Is not that about what you mean?” “Perhaps it is,” said Socrates. “Would the whole sail be over each person, or a particular part over each?” “A part over each.” “Then,” said he, “the ideas themselves, Socrates, are divisible into parts, and the objects which partake of them would partake of a part, and in each of them there would be not the whole, but only a part of each idea.” “So it appears.” “Are you, then, Socrates, willing to assert that the one idea is really divided and will still be one?” “By no means,” he replied. “No,” said Parmenides, “for if you divide absolute greatness,
  >
  > [131d] and each of the many great things is great by a part of greatness smaller than absolute greatness, is not that unreasonable?” “Certainly,” he said. “Or again, will anything by taking away a particular small part of equality possess something by means of which, when it is less than absolute equality, its possessor will be equal to anything else?” “That is impossible.” “Or let one of us have a part of the small; the small will be greater than this, since this is a part of it, and therefore the absolute small will be greater; but that to which the part of the small is added will be smaller, […]
  >
  > [132a] “I fancy your reason for believing that each idea is one is something like this; when there is a number of things which seem to you to be great, you may think, as you look at them all, that there is one and the same idea in them, and hence you think the great is one.” “That is true,” he said. “But if with your mind's eye you regard the absolute great and these many great things in the same way, will not another great appear beyond, by which all these must appear to be great?” “So it seems.” “That is, another idea of greatness will appear, in addition to absolute greatness and the objects which partake of it;
  >
  > [132b] and another again in addition to these, by reason of which they are all great; and each of your ideas will no longer be one, but their number will be infinite.” “But, Parmenides,” said Socrates, “each of these ideas may be only a thought, which can exist only in our minds then each might be one, without being exposed to the consequences you have just mentioned.” “But,” he said, “is each thought one, but a thought of nothing?” “That is impossible,” he replied. “But of something?” “Yes.”

  I can live with the regress bit at 132a — everyone in class could already recite that one and I know the general shape of it. What I can't get a handle on is everything around it, and it's three separate things. First, the sail. Socrates offers the day comparison precisely to show that one thing can be wholly in many places without getting carved up, and Parmenides answers with a sail — and Socrates just caves immediately, granting "a part over each." Is that concession actually forced on him, or is he throwing away the point for no reason? A day isn't a stretchy object with parts spread out over locations, and neither, you'd think, is an idea, so how does Parmenides get to leap from "it's like a sail" to "the ideas themselves are divisible into parts" as though that were established? Is he just assuming the analogy holds in the one respect that matters, or is there a real reason the whole-over-each option is supposed to be incoherent on its own — I'm thinking of that opening line about the idea being "separate from itself," which I don't understand either.

  Second, the three little cases he runs after that don't look like the same argument to me, and I want them separated out. With greatness the complaint is that each great thing would be great by a part of greatness smaller than absolute greatness — but why is that unreasonable? I'm made great by whatever makes me great, and nothing obviously requires that the thing I'm great by be maximally great. Then equality gets handled differently, something about taking away a part of equality and so being less than equality while still being equal, which reads more like a flat contradiction. And smallness is where I get totally lost: "the small will be greater than this, since this is a part of it, and therefore the absolute small will be greater; but that to which the part of the small is added will be smaller." Please take that sentence apart word by word, tell me which direction the comparison is actually going and where the absurdity lands, and say whether the reasoning genuinely closes or whether the translator has mangled it into senselessness. Third, and smallest: when Socrates falls back on "each idea may be only a thought," Parmenides fires back "is each thought one, but a thought of nothing?" What premise is that leaning on, and why is it supposed to sink the move rather than just change the subject? (Also, in the English as I have it that sentence seems to be missing a semicolon — "which can exist only in our minds then each might be one" — does that matter for how the escape is meant to work?)

  Finally, the question I'd most want settled before Tuesday: does any of this fragment business depend on ideas having proper parts at all, or is Parmenides only attacking a spatial way of picturing participation? Put differently, which of these moves could Socrates have blocked cheaply and in one line, and which ones bite even if he'd never mentioned the sail? I'd rather have a clear reconstruction of who is arguing for what at each step than a survey of what scholars think the whole dialogue is up to.
