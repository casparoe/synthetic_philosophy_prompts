          *   *The "Separate from Itself" Charge:* Parmenides starts by saying if the Whole Form is in many separate individuals, it is "separate from itself." Why? Because if $X$ is wholly in $A$ and wholly in $B$, and $A$ and $B$ are separate, then the $X$ in $A$ is separate from the $X$ in $B$. But $X$ is one. So $X$ is separated from $X$. Socrates rejects this with the "Day" analogy (one sun/day, many places, not separated).
