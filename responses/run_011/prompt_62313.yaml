answer: |-
  This is a sharp reading of a policy that is, as you suspect, structurally incoherent. You have identified a text that is trying to do three incompatible things at once: curate history, maintain administrative stability, and monetize development.

  Here is an analysis of the theories of commemoration at play, what the rules strictly presuppose versus what they merely accommodate, and where the scholarly consensus actually stands.

  ### 1. The Competing Theories of Commemoration
  Your policy is not running on a single theory. It is a palimpsest of three distinct theories that are active in different clauses.

  *   **The 5-Year Rule (The Curatorial/Canonical Theory):**
      *   **Theory:** A street name is a **verdict on a finished life.** It assumes that historical significance is an objective quality that reveals itself over time.
      *   **Presupposition:** Reputation is volatile in the short term and stable in the long term. The city acts as a historian, waiting for the "dust to settle" before canonizing a subject.
      *   **Function:** To prevent the city from embarrassing itself by honoring a "great man" who turns out to be a fraud or a villain shortly after dedication.

  *   **The No-Rename/Plate Rule (The Archival/Stability Theory):**
      *   **Theory:** A street name is an **entry in the historical record.** It assumes the name itself is a primary source artifact.
      *   **Presupposition:** Erasure is a greater harm than endorsement. The integrity of the record (the fact that this person *was* honored) outweighs the moral implication of continuing that honor.
      *   **Function:** To treat the cityscape as a museum where layers are preserved, not painted over. The "factual, non-judgmental" plate assumes the harm is **public ignorance**, not **public endorsement**. It assumes that if residents *know* the person was awful, the city is absolved of honoring them. This is a specific epistemological claim: that knowledge neutralizes endorsement.

  *   **The Developer Exception (The Transactional Theory):**
      *   **Theory:** A street name is a **currency or reward.**
      *   **Presupposition:** Naming rights are a commodity to be traded for infrastructure.
      *   **Function:** Economic development. This contradicts the Curatorial Theory entirely (living people have no settled verdict) and arguably the Archival Theory (these names are not about history, they are about marketing).

  ### 2. Coherence: Is the Package Compatible?
  You asked if this is a coherent package or incompatible views. **It is incompatible.**

  The tension lies between the **5-Year Rule** and the **Plate Rule**.
  *   The 5-Year Rule says: *We cannot judge character until time has passed.*
  *   The Plate Rule says: *Once we have judged (by naming), that judgment is immutable, regardless of new evidence.*

  If the goal were truly to wait for a "settled reputation" (Rule 1), then a reputation that *un-settles* later (due to new evidence of awfulness) should logically trigger a review. By forbidding renaming, Rule 2 admits that the name is not actually about the *current* reputation of the honoree, but about the *past decision* of the council.

  **The "Factual Plate" Assumption:**
  You noted the plate is at shin height and non-judgmental. This presupposes that the **harm is cognitive, not symbolic.**
  *   **Cognitive Harm:** Residents don't know the person was bad. (Remedy: Add facts).
  *   **Symbolic Harm:** The city is actively honoring a bad person by keeping their name on the map. (Remedy: Remove name).
  *   **The Policy's Stance:** It assumes the Cognitive Harm is the only one that matters. It assumes that a name is just a label, not an ongoing act of veneration. Most critical heritage scholars contest this (see "Settled vs. Contested" below).

  ### 3. Presupposition vs. Fit vs. Underdetermination
  Here is the breakdown of what the rules *require* versus what they just *allow*.

  | Rule | Strictly Presupposes | Fits Nicely (But Not Required) | Underdetermined (Multiple Theories Fit) |
  | :--- | :--- | :--- | :--- |
  | **5-Year Wait** | Reputation changes over time; the city risks error by acting too soon. | A "Great Man" theory of history (only dead people matter). | Could also be a "Political Cooling Off" period to avoid partisan fights. |
  | **No Renaming** | Administrative stability is a higher value than moral correction. | An "Archival" theory (names are historical data). | Could also be pure budgetary laziness disguised as philosophy. |
  | **Factual Plate** | Neutrality is possible; facts can be separated from judgment. | A "Teaching Device" theory (contextualize, don't erase). | Could also be a legal shield against defamation lawsuits. |
  | **Developer Exception** | Naming rights are a financial asset. | A "Gift" theory (naming as a thank-you). | **This breaks the system.** It proves the 5-year rule is not a moral principle, but a bureaucratic one that can be waived for capital. |

  ### 4. Swapping the Presupposition: "Revisable Honor"
  You asked what happens if we swap the presupposition to: *Honor is revisable in light of new evidence, like a belief.*

  If honor is revisable:
  1.  **The 5-Year Rule becomes obsolete.** If we can update our beliefs, we don't need to wait for death. We can name living people and rename them if they turn out badly.
  2.  **The Plate Rule collapses.** If the name is an active statement of honor, and the honor is withdrawn, the name must go. A plate is insufficient because the *sign itself* is the honor, not the text on the plate.
  3.  **The Developer Streets become a major liability.** If honor is revisable, naming a street after a living developer is high-risk. If that developer is later convicted of fraud or abuse, the "revisable honor" model demands the name be removed. Under the current policy, the developers are safe because the policy treats their names as *transactions*, not *honors*. Under a "revisable honor" model, the transaction is voided by the moral failure.

  ### 5. The Developer Anomaly
  You asked if the developers' streets are a live problem for every theory.
  *   **For the Curatorial Theory (5-Year Rule):** Yes, it is a fatal contradiction. It proves the rule is not about "settled reputation."
  *   **For the Archival Theory:** It is irrelevant. Developers' names will become part of the historical record of that subdivision's development era.
  *   **For the Transactional Theory:** It is the *only* rule that matters.

  **The Synthesis:** The policy is likely not a philosophy of commemoration at all. It is a **risk management document.**
  *   The 5-year rule protects the city from looking foolish.
  *   The no-rename rule protects the city from administrative costs and legal battles.
  *   The developer exception allows the city to raise money.
  The "theory of commemoration" is post-hoc rationalization for administrative convenience.

  ### 6. Settled vs. Contested in Commemoration Studies
  You requested explicit distinction here. This field (Critical Heritage Studies / Memory Studies) is highly debated.

  **Settled (General Consensus):**
  *   **Naming is Political:** There is consensus that naming is never neutral; it is an assertion of power and values.
  *   **Living Names are Problematic:** Among theorists, naming streets after living people is widely discouraged for *commemorative* purposes because it conflates marketing with history. (However, it is common practice in development, as you found).
  *   **Context Matters:** There is consensus that a plaque/plate changes the meaning of a monument/name, but *how* it changes it is debated.
  *   **Utility vs. Honor:** Scholars distinguish between "toponyms" (street names for navigation) and "monuments" (statues). Street names are harder to change due to utility (addresses), which grants them a different ethical weight than statues.

  **Contested (Live Debates):**
  *   **Removal vs. Contextualization:** This is the biggest fight.
      *   *Side A (Removal):* Keeping the name perpetuates harm and signals that the city still honors the person. (e.g., Kirk Savage, *Monument Wars*).
      *   *Side B (Contextualization/Retention):* Removal erases history and prevents learning. The "factual plate" approach aligns with this side (e.g., some German *Stolpersteine* approaches, though those commemorate victims, not perpetrators).
      *   *Current Status:* There is **no consensus**. Your city council has taken a hard stance on Side B, but many activists and scholars argue strongly for Side A.
  *   **The "Neutral Fact":** Your policy mandates "factual, non-judgmental" plates.
      *   *Contested:* Many scholars argue "neutrality" is impossible. Stating a fact ("He owned slaves") without a moral qualifier ("which was immoral") is itself a judgment (implying the fact is merely descriptive, not prescriptive). The idea that a plate can be purely factual is philosophically disputed.
  *   **The Function of the Street Sign:**
      *   *Contested:* Is a street sign primarily a navigational tool (which argues against changing it) or a civic honor (which argues for changing it if the honor is undeserved)? Your policy treats it as a navigational tool that *accidentally* confers honor, which is why they refuse to rename.

  ### Summary
  Your city council's policy is not a coherent theory of commemoration. It is a **hybrid administrative protocol** that prioritizes stability and revenue over moral consistency.
  *   The **5-Year Rule** is a shield against embarrassment.
  *   The **Plate Rule** is a shield against the cost of change.
  *   The **Developer Exception** is the revenue engine that reveals the other rules are flexible when money is involved.

  If you are writing a project on this, the strongest angle is to argue that the policy claims to be about **History** (waiting for reputation to settle) but operates on **Bureaucracy** (minimizing address changes) and **Finance** (selling names to developers). The "factual plate" is the attempt to bridge the gap between the moral failure of honoring a villain and the bureaucratic refusal to fix it.
