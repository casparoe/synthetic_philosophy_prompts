answer: |-
  This is a sharp, coherent cluster of views that closely resembles **Functional Decision Theory (FDT)** but tries to retain the *language* of Causal Decision Theory (CDT). That linguistic retention is where your view is most vulnerable.

  You are trying to claim the *outputs* of superrationality/FDT while keeping the *metaphysics* of CDT. In a reading group setting, the attackers will focus on the seams where these two metaphysics grind against each other.

  Here are the conflicts ranked by severity, with the cheapest repair and the cost for each.

  ### 1. The Fatal Contradiction: Point 3 vs. Points 1, 2, & 8
  **Severity:** Critical
  **The Conflict:** Point 3 claims you are an "orthodox causal person" with "zero patience for treating a bare correlation as a handle." Points 1, 2, and 8 require you to do exactly that.
  *   **In Newcomb (Point 2):** If there is no backwards causation (as per Point 3), the money is already in the box. Your choice cannot causally affect the predictor's past action. The correlation between your choice and the box content is, by orthodox causal lights, a "bare correlation" (screened off by the past prediction). To one-box is to treat that correlation as a handle.
  *   **In Voting (Point 8):** Your single vote causally changes the outcome only in the vanishingly rare case of a tie. If you vote because "enough people reasoning my way... is one decision," you are leveraging a logical correlation between your brain and theirs. To an orthodox causalist, this is treating a bare correlation (we both think alike) as a handle (my vote changes the outcome).
  *   **In Mirror PD (Point 1):** If you are orthodox causal, your choice does not cause your copy's choice. You share a common cause (the origin of the copy). Defecting is the dominant causal strategy. Cooperating treats the correlation as a handle.

  **Why it breaks:** You cannot claim the metaphysical safety of CDT (Point 3) while taking the actions of FDT/Superrationality (1, 2, 8). A CDT agent *must* two-box and defect in the Mirror PD to be consistent. If you one-box, you have already abandoned Point 3, even if you keep the label.

  **Cheapest Repair:** Drop the "orthodox causal" label in Point 3. Reframe it as: *"I reject magic, but I accept that logical facts are part of the causal structure. My decision procedure is the causal node, not just my physical muscle twitch."*
  **What You Lose:** You lose the claim to standard causal orthodoxy. You admit that your view requires a specific, non-standard definition of "cause" (one that includes logical counterfactuals). This makes you vulnerable to the charge that you are just doing EDT with extra steps.

  ### 2. The Boundary Problem: Point 4 vs. Point 5
  **Severity:** High
  **The Conflict:** Point 4 states the link holds "as long as it computes like me," even with different evidence. Point 5 states you two-box against a copy scanned a year ago who has "lived a different life."
  *   **The Tension:** Does the year-old copy "compute like you"?
      *   **If Yes:** Then Point 5 violates Point 4. If the algorithm is identical, the history shouldn't matter.
      *   **If No:** Then *why* doesn't it compute like you? Is it because the different life changed its weights? If so, at what threshold does a life difference break the computation? A different haircut? A different breakfast?
  *   **The Attack:** The group will hammer you on the **reference class problem**. If you cooperate with a copy running on silicon (Point 6 implies framing doesn't matter, so substrate probably shouldn't either), why not a copy that diverged 364 days ago? Point 5 introduces a *historical* constraint to a *logical* theory. Point 4 says history/evidence doesn't break the link; Point 5 says it does.

  **Cheapest Repair:** Tighten Point 5. Clarify that you two-box against the year-old copy *only if* the divergence in life has altered the decision algorithm relevant to this specific problem. If the algorithm is identical, you must cooperate, regardless of history.
  **What You Lose:** You lose the intuitive comfort of "biological/historical identity." You have to admit that if a perfect logical isomorph of you exists (even one that thinks it's Napoleon), you are logically linked to it. This is a harder pill to swallow than "my copy from last year."

  ### 3. The Consistency Gap: Point 7 vs. Point 8
  **Severity:** Medium
  **The Conflict:** Point 7 says if the symmetry is broken (you are the only one *not* like the group, or the link is known to be absent), you defect. Point 8 says you vote because "enough people reasoning my way" creates a link.
  *   **The Tension:** In the voting booth, the symmetry is *massively* broken compared to the Mirror PD. Voters have different evidence, different lives, different substrates, and different reasoning capabilities.
      *   In Point 5, a one-year divergence breaks the link.
      *   In Point 8, a lifetime of divergence *does not* break the link.
  *   **The Attack:** Why is the logical link strong enough to justify voting (Point 8) but too weak to justify cooperating with a year-old copy (Point 5)? If you defect in the Public Goods game because the symmetry is "broken," you should defect in the election because the symmetry is *shattered*.

  **Cheapest Repair:** Reframe Point 8. Admit that voting is a **heuristic** or a **statistical** claim, not a strict logical identity claim. Or, argue that the "reasoning procedure" in voting is simpler and more universal than the specific PD logic, making the link more robust across divergence.
  **What You Lose:** You lose the elegance of a unified theory. You have to admit that your superrationality applies fully to copies (1), partially to predictors (2), weakly to voters (8), and not at all to diverged agents (5). This makes the view look ad hoc rather than principled.

  ### Summary of Vulnerabilities for Thursday

  1.  **The "Causal" Label (Point 3):** This is your biggest target. If you keep this, you are inconsistent. If you drop it, you are consistent but less "orthodox." **Recommendation:** Drop the label. Own the functionalism.
  2.  **The Divergence Threshold (Point 5):** Be prepared to define exactly *what* breaks the logical link. Is it code divergence? Or just physical history? If it's code, you might have to cooperate with the year-old copy.
  3.  **The Voting Exception (Point 8):** Be prepared to explain why voting survives the "symmetry break" that kills the Public Goods game.

  **The Single Best Repair:**
  Rephrase Point 3 to: *"I reject backwards causation and magic. However, I view my decision as the output of a function. Where that function is instantiated elsewhere (predictors, copies, similar reasoners), my choice of output logically determines theirs. This is not correlation; it is identity of computation."*

  **Cost:** You stop sounding like a CDT agent trying to be nice, and start sounding like an FDT agent. This invites different attacks (e.g., "how do you define the function boundaries?"), but it removes the internal contradiction that will get you torn apart first.
