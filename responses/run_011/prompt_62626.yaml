          *   *Actually, looking at Point 7 again:* "I'm the only one who isn't [the reasoner described in 1]". This implies the *agent making the decision in scenario 7* is not the agent holding the view 1-8. But the user says "I defect". This implies the user *is* the agent in scenario 7. This creates a self-referential paradox. If the user holds view 1-8, they *are* the reasoner described in 1. So how can they be in a scenario where they *aren't*?
