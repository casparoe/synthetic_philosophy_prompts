          *   *The Tension:* Voting is the ultimate "bare correlation" scenario. Your single vote rarely causally changes the outcome. Superrational voting relies on the idea that your decision is correlated with others. Point 3 says "zero patience for treating a bare correlation as a handle."
          *   *Severity:* **High.** (Links back to Conflict A). Voting is the hardest sell for a "causal orthodox" person.
          *   *Repair:* Same as A.
          *   *Cost:* Giving up Point 3's strictness.

  4.  **Ranking and Refining:**

      *   **Severity 1 (Fatal): Point 3 vs. The Rest (especially 1, 2, 8).**
          *   You cannot be an "orthodox causal person" who believes "choice reaches the world only through its own effects" AND one-box in Newcomb/cooperate in Mirror PD/vote for superrational reasons. Orthodox causality (CDT) *requires* two-boxing and defecting in Mirror PD.
          *   *Why:* In Newcomb, the box is already filled. Your choice has no *causal* effect on the box content. If you one-box, you are using the correlation as a handle. Point 3 explicitly bans this.
          *   *Repair:* Drop "orthodox causal" label. Adopt "Functional Causality" or admit that logical facts are part of the causal structure.
          *   *Cost:* You lose the claim to causal orthodoxy. You become an FDT/EDT hybrid.

      *   **Severity 2 (Structural): Point 5 (Divergence) vs. Point 4/6 (Computation/Framing).**
          *   Point 4 says "link holds... as long as it computes like me." Point 5 says "copy scanned a year ago... I two-box."
          *   *Question:* Does the year-old copy compute like you? If yes, Point 5 violates Point 4. If no, why not?
          *   *Risk:* This makes the theory vulnerable to "tipping point" arguments. How much divergence breaks the link?
          *   *Repair:* Define "same computation" strictly as algorithmic isomorphism on the relevant input, ignoring history.
          *   *Cost:* You might have to cooperate with the year-old copy if they still reason the same way.

      *   **Severity 3 (Practical): Point 7 (Asymmetry) vs. Point 8 (Voting).**
          *   Point 7 admits defeat when symmetry breaks. Point 8 asserts victory in voting where symmetry is *very* broken (different people, different lives).
          *   *Risk:* Inconsistency in application. Why is voting "symmetric enough" but a year-old copy isn't?
