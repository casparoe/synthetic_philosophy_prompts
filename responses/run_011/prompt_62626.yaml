      *   *Structure:* Rank by severity. For each: The Conflict, Why it Breaks, The Repair, The Cost.
      *   *Key Insight:* The user is trying to have their CDT cake and eat their FDT pudding. Point 3 is the liar in the room.

      *(Self-Correction during drafting)*: I need to be careful with Point 7. "I'm the only one who isn't [the reasoner described in 1]". If the user *is* the reasoner described in 1, this scenario is impossible for them *unless* they are imagining themselves as a CDT agent. If they are imagining themselves as a CDT agent, then defecting is consistent. But if they are applying their *actual* view (1-8) to a scenario where they *know* they are different from the group...
      *   *Better interpretation of 7:* "If I know the other nine are running *my algorithm*, but I know *my* output is not logically constrained to match theirs (e.g. I have a random seed they don't), I defect."
      *   *Actually, the text says:* "I'm the only one who isn't [the reasoner described in 1]". This implies the *agent* is not the superrational agent. But the *user* is the superrational agent. So the user is saying "If I were a CDT agent among FDT agents, I'd defect." That's trivial.
      *   *Wait, re-reading 7:* "ten-person public goods game where I know for a fact the other nine are exactly the reasoner described in 1 and I'm the only one who isn't".
      *   *Interpretation:* The user is stating a conditional preference. "In a world where I am the outlier (non-superrational), I defect." This is consistent with CDT.
      *   *BUT:* If the user *is* the superrational reasoner (which they claim in 1-6), how can they be the one who *isn't*?
      *   *Ah, I see the trap:* If the user claims 1-8 is *their* view, then in scenario 7, they are claiming *they* are not the reasoner described in 1. This is a direct contradiction of the preamble ("here [is] my view").
      *   *Wait, maybe it means:* "If I encounter 9 people like me, but I have evidence that *this specific instance* is decoupled."
      *   *Let's assume the charitable reading:* "If the logical link is broken (symmetry broken), I defect."
      *   *The Conflict with 8:* Voting relies on a link that is *much* weaker than the Mirror PD. If a year-old copy breaks the link (5), why doesn't a different voter break the link (8)?
      *   *Okay, I'll stick with the 5 vs 8 tension.*

      *(Refining the "Orthodox Causal" point)*: This is the biggest hammer. Point 3 is essentially CDT dogma. Points 1, 2, 8 are FDT/Superrational outcomes. You can't have both. FDT *looks* like CDT to the agent (no magic), but it treats the output of the decision function as the causal node, not the physical action alone. Point 3 denies this.

      *(Refining the "Year Ago" point)*: This is the "Reference Class" problem. If I cooperate with a copy, but not a year-old copy, what about a copy with a different haircut? A copy running on silicon instead of carbon? Point 5 introduces a historical/biological constraint that Point 4 (computational) denies.

