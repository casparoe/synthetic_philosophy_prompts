      *   **Conflict A: Point 3 (Causal Orthodoxy) vs. Points 1, 2, 4, 6, 8 (Logical Correlation).**
          *   *The Tension:* Point 3 says "no backwards causation... zero patience for treating a bare correlation as a handle." Points 1 & 2 rely on the idea that your choice *controls* the copy/predictor via logical correlation, not causal influence. Point 3 sounds like CDT. Points 1, 2, 4, 6, 8 sound like FDT/Superrationality.
