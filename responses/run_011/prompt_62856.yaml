prompt: |-
  I'm doing a part-time cognitive science conversion course and we've just spent three weeks on Hofstadter and Mitchell's Copycat — the slipnet, the coderack, the workspace, temperature climbing when too many possibilities are competing, the whole apparatus. The worked examples are always the same sort of letter-string puzzle (abc becomes abd, so what does ij become?), which is fine for teaching the machinery but does leave the whole thing feeling like a very small toy in a very small room. I want to run it on something real and see whether it survives the contact. My candidate is the Pluto business, and I'll put down the facts I think matter so you don't have to guess at them: Pluto was found in 1930 by a search for a hypothetical Planet X and was assumed to be substantial — larger than Mercury at first, then smaller and smaller as the measurements improved; Charon turned up in 1978 and let people calculate Pluto's mass properly, which came out absurdly small; through the 90s more and more Kuiper belt objects were found, a lot of them sharing Pluto's odd eccentric, tilted orbit; the Hayden Planetarium in New York quietly left Pluto out of its planets exhibit when it reopened in 2000; then in 2005 Eris showed up, roughly Pluto's size and actually more massive, and the choice went stark — either Eris is the tenth planet or Pluto isn't the ninth. A committee set up in 2005 offered three candidate definitions: a cultural one (roughly, a planet is a planet if enough people say it is), a structural one (round enough to be in hydrostatic equilibrium), and a dynamical one (massive enough to have cleared its orbit of other bodies). The 2006 General Assembly in Prague ended up adopting a three-part definition — orbits the Sun, in hydrostatic equilibrium, has cleared its neighbourhood — plus a brand-new dwarf planet category for things satisfying the first two but not the third, and the rival proposal to treat dwarf planets as a subclass of planets was voted down. It was settled by a show of hands among the members who were still in the hall at the end of a fortnight-long meeting. And it hasn't settled: a large chunk of the planetary science community, including people who work on New Horizons, still use a geophysical definition on which anything round is a planet, so there are now two live communities with two different extensions for one word, plus a public that never accepted the change at all. My brother's eight-year-old has a glow-in-the-dark mobile of the nine planets on his bedroom ceiling and he refuses to update it, which I think is data of a sort.

  So first do the mapping, properly, before you evaluate anything — I'm not after a general essay on Pluto. Treat the episode as one long analogy-making run and tell me what the microdomain actually is here, what the source and target are, and what the slipnet neighbourhood of planet looks like: which nodes are genuinely adjacent (world, body, satellite, moon, minor planet, asteroid, comet, Kuiper belt object, dwarf planet, round thing, thing that clears its orbit, "the nine") and how the connection strengths between them would have to have been arranged in, say, 1995 versus 2005 for the eventual outcome to be the cool, low-temperature solution. Then say which slips happened and which were refused. Eris is the interesting case: the structural parallel between Eris and Pluto is about as tight as an analogy can get, and it's what heated everything up, but the community refused the obvious slip and instead moved the target concept into a node that didn't exist beforehand. Is inventing a node something the model can do at all, or does it only ever slide between things already sitting in the net? And what's the temperature story — did the vote cool the system down or just freeze it mid-slip?

  Then run it the other way, which is the bit I care about most. Everyone at the time said the fight was merely semantics, an argument about a word, no fact of the matter either way — but it definately didn't feel like that. People experienced it as the solar system having got smaller; there was real, if half-joking, mourning. Does the fluid concepts picture have the resources to explain why a dispute about a category boundary feels substantive rather than verbal, something about the concept being entangled with a load of others so that a slip propagates and drags them along — and can it say anything about the cost of a slip, or about why that cost landed so unevenly (a child's mnemonic versus a dynamical astronomer's taxonomy)? Be honest about where the model goes quiet. It has no notion of authority, so it can't represent the difference between a slip forced by structural pressure and one imposed by a vote; it has no notion of stakes; and it doesn't seem able to represent the current situation, where the slippage simply never resolved and two communities carry on in parallel with different nets. Also tell me whether I'm making a category error by pointing a model built for three-letter strings at seventy-odd years of astronomical taxonomy — if the analogy between Copycat and this case is itself a bad one, show me where it slips and what would have to be added to the model for it to earn its keep. One more thing: there's a control case. In the 1840s and 50s Ceres and the other objects between Mars and Jupiter were counted as planets, the list reached twenty-odd by 1851, and then astronomers quietly started calling them asteroids instead and nobody minded in the slightest. Same structural pressure, none of the fuss. What does the contrast between those two episodes say about when slippage is cheap and when it isn't — and is that something the model could have predicted, or only something we can see with hindsight? Don't send me off to look things up, I just want your analysis.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Part-time cognitive science student, familiar with Hofstadter & Mitchell's *Copycat* model (Slipnet, Workspace, Coderack, Temperature, etc.). They find the standard letter-string analogies (abc->abd, ij->?) too toy-like and want to test the model against a "real" complex conceptual shift: the Pluto reclassification.
      *   **Task:** Map the Pluto episode onto the *Copycat* architecture. Specifically:
          1.  Define the microdomain, source, target, and Slipnet neighborhood of "planet" (1995 vs. 2005).
          2.  Identify specific slips (accepted/refused), especially regarding Eris.
          3.  Address the model's capability to *invent* new nodes (dwarf planet).
          4.  Analyze the "Temperature" story (did the vote cool or freeze?).
          5.  Run the model "the other way": Explain why this feels substantive, not just semantic (entanglement, cost of slip, uneven distribution of cost).
          6.  Be honest about limitations (authority, stakes, unresolved parallel nets).
          7.  Evaluate the category error risk (3-letter strings vs. 70 years of taxonomy).
          8.  Analyze the Control Case (Ceres/Asteroids in 1850s) vs. Pluto to explain "cheap" vs. "expensive" slippage.
      *   **Constraints:** No looking things up. Deep analysis required. Honest critique of the model.

  2.  **Deconstruct the *Copycat* Model (Mental Refresh):**
      *   **Workspace:** Where concepts are instantiated (the "problem space").
      *   **Slipnet:** The long-term memory of concepts (nodes) and associations (links). Activation spreads.
      *   **Coderack:** Stochastic selection of codelets (small processes) to act in the Workspace.
      *   **Temperature:** Measure of satisfaction/order. High temp = random exploration/desperation. Low temp = focused, deterministic settling.
      *   **Slippage:** Mapping one concept to another based on structural pressure (e.g., 'a' slips to 'z' because they are both ends of the alphabet).
      *   **Limitations:** It's a microdomain model. It doesn't learn new nodes easily (usually fixed Slipnet). It doesn't handle social authority or emotional stakes.

  3.  **Mapping Pluto to *Copycat*:**

      *   **Microdomain:** Taxonomic classification of solar system bodies.
      *   **Source:** The established concept "Planet" (pre-2006).
      *   **Target:** The new object "Eris" (and the re-evaluation of "Pluto").
      *   **Slipnet Nodes (1995):** *Planet* is strongly linked to *Nine*, *Sun-Orbiter*, *Round*, *Major Body*. *Pluto* is a strong instance of *Planet*. *Kuiper Belt* is weakly linked or separate. *Moon/Satellite* is distinct.
      *   **Slipnet Nodes (2005):** *Eris* activates *Planet* strongly (structural match). *Kuiper Belt Object* activation rises. *Clearing Orbit* becomes a critical link.
      *   **The Slip:** The pressure is: If Eris = Planet, then Planet count = 10+. If Pluto = Planet, Eris must be too. If Eris != Planet, Pluto shouldn't be either.
      *   **The "New Node":** *Dwarf Planet*. *Copycat* typically has a fixed Slipnet. Inventing a node is a major stretch for the original architecture. It implies a structural change in the net itself, not just activation.
      *   **Temperature:**
          *   Pre-2000: Low temp (stable classification).
          *   2000-2005 (Discoveries): Temp rises. Conflicting pressures (Round vs. Orbit Clearing).
          *   2006 Vote: Artificial cooling? Or freezing? The prompt suggests "froze mid-slip." This is a keen insight. The vote stopped the cognitive processing without resolving the conceptual tension.

  4.  **Addressing the "Substantive vs. Semantic" Question:**
      *   *Copycat* view: Concepts are nodes. Changing links changes the concept.
      *   *Why it feels substantive:* "Planet" is a hub node. It's entangled with *School Curriculum*, *Mythology*, *Human Significance*, *Order*, *Stability*.
      *   *Cost of Slip:* Changing "Planet" ripples out to "Nine Planets Song," "Astrology," "Textbooks," "Identity."
      *   *Uneven Cost:* Astronomers (dynamic definition) vs. Public/Geophysicists (roundness). The model struggles with *who* pays the cost.

  5.  **Addressing Limitations (Authority, Stakes, Parallel Nets):**
      *   *Authority:* *Copycat* is egalitarian. Codelets compete. The IAU vote is a "God codelet" or external constraint not in the model.
      *   *Stakes:* No utility function in *Copycat*. It seeks elegance, not social survival.
      *   *Parallel Nets:* *Copycat* seeks *one* answer. It crashes or loops if two stable states coexist indefinitely. The current Pluto situation (dual usage) is a failure state for the model.

  6.  **The Category Error Question:**
      *   Is this a bad analogy? Yes and no.
      *   *Yes:* Time scale, social dimension, learning new nodes.
      *   *No:* The core mechanism (conceptual slippage under pressure) is exactly what Hofstadter claimed was universal.
      *   *Fix:* Need a "Meta-Copycat" that can modify the Slipnet and handle social weighting.

  7.  **The Control Case (Ceres/Asteroids):**
      *   *Why cheap?* "Planet" wasn't as entrenched. No "Eight Planets" mnemonic yet. No emotional investment. The category "Asteroid" was available/empty.
      *   *Why Pluto expensive?* "Nine" was iconic. "Planet" meant "Major Player."
      *   *Model Prediction:* The model would see lower activation on the *Planet* node for Ceres initially, or weaker links to cultural nodes. It could predict this *if* the Slipnet included cultural entrenchment weights.

  8.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Academic but conversational, matching the user's sophistication. Acknowledge the ambition of the test.
      *   *Structure:* Follow the prompt's sequence (Mapping -> Slips/Nodes -> Temperature -> Substantive Feel -> Limitations -> Category Error -> Control Case).
      *   *Key Insight to Highlight:* The "Dwarf Planet" node invention is the biggest break from standard *Copycat*. The "Freezing" vs. "Cooling" distinction is crucial. The Ceres comparison highlights *entrenchment* as a variable the model lacks.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Copycat can't do this." I need to say *how* it would try and where it would break. For the node invention, I should mention that Hofstadter talked about "deep slippage" but the implementation was fixed. For the vote, frame it as an external temperature dump.

      *(Refining the Ceres point)*: Why was Ceres different? In 1850, "Planet" meant "Wanderer." By 2000, "Planet" meant "The Nine." The *Copycat* model needs a "History/Entrenchment" weight on nodes. Ceres had low entrenchment; Pluto had high.

      *(Refining the "Substantive" point)*: Use the term "Conceptual Ecology" or "Entanglement." The cost is the rewiring of downstream nodes.

  9.  **Final Polish:** Check against all constraints. (No lookups, address all specific questions, honest about limitations). Ensure the distinction between 1995 and 2005 Slipnets is clear.

      *Plan:*
      1.  **Mapping:** Define Workspace/Slipnet for 1995 vs 2005.
      2.  **Slips & Nodes:** Eris/Pluto mapping, the "Dwarf Planet" invention problem.
      3.  **Temperature:** The Vote as a freeze, not a cool.
      4.  **Substantive Feel:** Entanglement and ripple effects.
      5.  **Limitations:** Authority, Stakes, Parallel States.
      6.  **Category Error:** Microdomain vs. Macro-history.
      7.  **Control Case:** Ceres and the weight of entrenchment.

      *Let's write.*
answer: |-
  This is a formidable stress test for the architecture. You are asking *Copycat* to leave the microdomain of alphabetic symmetry and enter the messy, diachronic, socio-cognitive domain of scientific taxonomy. Hofstadter always claimed the mechanisms were domain-general, but he also knew the model was a "fable." Let's run the simulation and see where the gears grind.

  ### 1. The Mapping: Microdomain, Source, Target, and Slipnet

  **The Microdomain:**
  In *Copycat*, the microdomain is the set of permissible objects and relations. Here, the microdomain is **Solar System Taxonomy**.
  *   **Objects:** Celestial bodies (Sun, Pluto, Eris, Ceres, Earth, etc.).
  *   **Relations:** *Orbits*, *Is Round* (hydrostatic equilibrium), *Clears Orbit*, *Is Satellite Of*, *Is Member Of Group*.

  **Source and Target:**
  *   **Source:** The established concept **PLANET** (pre-2006 instantiation).
  *   **Target:** The anomalous object **ERIS** (and the re-evaluation of **PLUTO**).
  *   **The Problem:** `Planet(Pluto) = True`. `StructuralMatch(Pluto, Eris) = High`. Therefore `Planet(Eris) = ?`.
      *   If `True`, then `Count(Planets)` increases indefinitely (temperature rises due to loss of elegance/closure).
      *   If `False`, then `Planet(Pluto)` must slip to `False` (high resistance due to entrenchment).

  **The Slipnet Neighborhood (1995 vs. 2005):**
  The Slipnet is not static; link strengths change with activation.

  *   **1995 Configuration:**
      *   **Node: PLANET.** High activation.
      *   **Links:** Strong link to *ROUND*. Moderate link to *ORBITS SUN*. Weak/Null link to *CLEARS ORBIT* (this relation existed in the physics but wasn't a defining link in the concept node).
      *   **Node: NINE.** Strongly linked to *PLANET*. This is a cultural node, not physical, but in a cognitive model of humans, it must exist.
      *   **Node: PLUTO.** Strong instance link to *PLANET*.
      *   **Node: KUIPER BELT.** Weak activation, loosely linked to *COMET* or *DEBRIS*, not *PLANET*.
      *   **Temperature:** Low. The system is settled. `abc -> abd` is solved and forgotten.

  *   **2005 Configuration (Pre-Vote):**
      *   **Node: ERIS.** High activation. Strong structural link to *PLUTO*.
      *   **Node: PLANET.** Under stress. The link *CLEARS ORBIT* gains strength (activated by the dynamical faction). The link *ROUND* retains strength (activated by the geophysical faction).
      *   **Node: NINE.** Activation clashes with *ERIS*.
      *   **Temperature:** High. Competing codelets are proposing incompatible structures. `Planet(Pluto)` and `Planet(Eris)` cannot both be true without breaking the *Count* constraint, but `Not Planet(Pluto)` breaks the *History* constraint.

  ### 2. Slips, Refusals, and Node Invention

  **The Slips:**
  *   **Accepted Slip:** *Pluto* slips from *Planet* to *Dwarf Planet*. This is a relational slip. The object stays the same; the category label shifts.
  *   **Refused Slip:** *Eris* slipping to *Planet*. The structural pressure was immense (Pluto/Eris symmetry), but the systemic pressure (avoiding infinite planet count) blocked it.
  *   **The Critical Slip:** The definition of *Planet* itself slipped. The link weight for *CLEARS ORBIT* went from near-zero to defining. This is a "deep slip" — changing the definition of the node, not just mapping an object.

  **Node Invention (The "Dwarf Planet" Problem):**
  You asked if the model can invent a node. **Strictly speaking, no.** The original *Copycat* Slipnet is fixed. Codelets can build structures in the Workspace, but they cannot add permanent nodes to the Slipnet.
  *   **How *Copycat* would hack it:** It would treat *DWARF PLANET* as a compound concept already latent in the net (*DWARF* + *PLANET*), perhaps previously inactive. The "invention" is just the activation of a pre-existing but dormant link.
  *   **The Reality:** *Dwarf Planet* was a genuine conceptual novelty. It created a new equivalence class. For *Copycat* to handle this, it needs a mechanism for **Slipnet Plasticity**. It needs to be able to say, "The current nodes cannot resolve this tension; create a new node that inherits links from *PLANET* (Round, Sun-Orbit) but severs the link to *CLEARS ORBIT*."
  *   **Verdict:** This is where the model breaks. It can slide between existing concepts, but it cannot grow new semantic branches. It treats the creation of "Dwarf Planet" as a mapping solution, not a learning event.

  ### 3. The Temperature Story: Cooling or Freezing?

  In *Copycat*, temperature drops when a coherent structure is found that satisfies all constraints.
  *   **The Vote:** The 2006 General Assembly vote was not a cognitive resolution; it was an external interrupt.
  *   **Analysis:** The vote did not **cool** the system. Cooling implies the internal logic found a stable state that satisfied the codelets. The vote **froze** the system mid-slip.
  *   **Evidence:** The temperature remains high in the sub-communities. The *New Horizons* team (geophysical definition) runs at a low temperature locally (they have a consistent view: Round = Planet), and the IAU adherents run at a low temperature locally (Cleared Orbit = Planet). But the global system temperature is high because the two local solutions are incompatible.
  *   **Model Failure:** *Copycat* seeks a single global answer. It cannot represent a "bifurcated net" where two stable states coexist indefinitely. It would view the current state as an error condition or a loop.

  ### 4. Why It Feels Substantive (The "Cost" of Slippage)

  You asked why a verbal dispute feels like the solar system got smaller. In the fluid concepts framework, this is about **Entanglement**.

  *   **Hub Nodes:** *PLANET* is not an isolated node. It is a hub connected to *SCHOOL*, *MYTHOLOGY*, *ORDER*, *HUMAN SIGNIFICANCE*, *MNEMONICS*.
  *   **Propagation:** When you slip *PLUTO* out of *PLANET*, you aren't just changing a label. You are breaking the links to all those downstream nodes.
      *   *Mnemonic:* "My Very Educated Mother..." breaks.
      *   *Identity:* "I grew up with nine planets" becomes false.
      *   *Significance:* *PLANET* implies "Major Actor." *DWARF PLANET* implies "Minor Actor." Pluto didn't change physically, but its *agency* in the conceptual net was downgraded.
  *   **The Cost:** The "cost" in *Copycat* is usually computational (how many codelets to build the structure). Here, the cost is **Rewiring**. The emotional mourning is the resistance of the downstream nodes to being rewired. The child's mobile is a physical instantiation of a Workspace structure that is now "illegal" in the new Slipnet.
  *   **Uneven Cost:**
      *   *Astronomer:* Low cost. Their *PLANET* node is linked to *DYNAMICS*. The slip makes their net *more* coherent (predictive power increases).
      *   *Public/Child:* High cost. Their *PLANET* node is linked to *LIST* and *STORY*. The slip destroys coherence.
      *   **Model Limitation:** *Copycat* has no representation of *who* owns the net. It assumes a single cognitive agent. It cannot model the conflict between two agents with different link weights (Dynamical vs. Geophysical).

  ### 5. Limitations: Authority, Stakes, and Parallel Nets

  You were right to be skeptical. Here is where the model goes quiet:

  1.  **Authority:** In *Copycat*, the best structure wins based on elegance and fit. In Pluto, the IAU definition won based on **procedural authority** (a show of hands). A codelet cannot represent "Because the Committee said so." This is an external constraint that overrides internal coherence. The model has no "God Codelet."
  2.  **Stakes:** *Copycat* is disinterested. It seeks truth/elegance. The Pluto fight had stakes (funding, prestige, textbook sales, public engagement). The model has no utility function beyond "satisfaction of constraints." It cannot explain why people *fought* rather than just accepting the new mapping.
  3.  **Parallel Nets:** As noted, the model crashes on dual stable states. It expects convergence. The current reality (two definitions in parallel) is a "multi-stable attractor" state that the original architecture doesn't support. It would need to be a "Multi-Agent Copycat" where different agents maintain different Slipnets and negotiate boundaries.

  ### 6. Category Error: Strings vs. Taxonomy

  Are you making a category error? **Yes, but a productive one.**

  *   **The Error:** *Copycat* is a model of **analogy-making in a closed system**. The Pluto episode is **conceptual evolution in an open, social system**.
      *   *Time:* *Copycat* is atemporal. Pluto took 70 years.
      *   *Learning:* *Copycat* doesn't learn new nodes. Science does.
      *   *Social:* *Copycat* is solipsistic. Taxonomy is communal.
  *   **What would need to be added:**
      1.  **Plastic Slipnet:** Ability to create/merge nodes.
      2.  **Weighted Agents:** Different "users" of the net with different link strengths.
      3.  **External Constraints:** Mechanisms to accept rules based on authority, not just structural fit.
      4.  **Memory/History:** A way to encode "how long this has been true" (entrenchment).

  However, the core insight holds: **Concepts are not definitions; they are neighborhoods of association.** The Pluto fight proves Hofstadter's main point: meaning is fluid and context-dependent. The "definition" of planet didn't change; the *activation levels* of its features (Round vs. Clearing) shifted.

  ### 7. The Control Case: Ceres and the Cost of Entrenchment

  This is the crucial test. Why did Ceres (1850s) slip cheaply, while Pluto (2000s) slipped expensively?

  *   **Structural Pressure:** Identical. Too many objects fitting the "Planet" label.
  *   **The Difference:** **Entrenchment Weight.**
      *   **1850s:** The node *PLANET* had weak links to *CULTURE* and *COUNT*. There was no "Eight Planets" song. The list was still growing. The cost of rewiring was low. The node *ASTEROID* was available and empty, ready to receive the slippage.
      *   **2000s:** The node *PLANET* was heavily encrusted with *NINE*, *COMPLETENESS*, and *GENERATIONS OF SCHOOLING*.
  *   **Model Prediction:** Could *Copycat* predict this?
      *   **Standard Model:** No. It treats all nodes equally unless pre-weighted.
      *   **Modified Model:** If you add a "Depth" or "Age" parameter to nodes (how many times this structure has been reinforced), the model could predict the resistance.
      *   **The Mechanism:** In 1850, the *PLANET* node had low "inertia." In 2000, it had high inertia. The "Temperature" required to slip Pluto would need to be much higher than for Ceres.
      *   **Why the fuss?** The Ceres slip happened before the concept solidified. The Pluto slip happened after the concept had become a cultural artifact.
      *   **The Lesson:** Slippage is cheap when the concept is still forming (liquid). Slippage is expensive when the concept has crystallized (solid). The model needs a "phase change" variable.

  ### Summary Verdict

  The *Copycat* architecture provides a brilliant vocabulary for describing the *mechanics* of the Pluto reclassification (competing pressures, slippage of definition, temperature rise). It correctly identifies that the fight wasn't about facts (mass, orbit) but about **conceptual topology** (which links define the node).

  However, it fails to capture the **sociology** of the event. It cannot model the vote (authority), the mourning (stakes/entrenchment), or the current stalemate (parallel nets). To make this work, you would need to evolve *Copycat* into a **Socio-Cognitive Network Model** where nodes have historical weights, agents have different net configurations, and "truth" is negotiated rather than computed.

  You are right to feel the toy is small. But the physics of the toy—how pressure causes concepts to slip—scales up remarkably well, provided you acknowledge that real human concepts carry baggage (history, emotion, authority) that letter strings do not. The Pluto case doesn't break the theory; it breaks the *implementation*.
