answer: |-
  The committee room was cold, the mahogany table reflecting the grey light of a London afternoon. Before the two advisers lay the trust's portfolio statement: £2,000,000 in liquid capital. The deed was explicit: in twenty years, the entirety must pass to the beneficiary. There was to be no consumption, no further contributions, and no borrowing. There was, however, the floor. If capital touched £500,000, the trust would be wound up, the residue diverted to a less sympathetic cause, and the trustees removed.

  Dr. Sterling adjusted his spectacles. 'We must begin with the structure of the wager, Ms. Cournot. The counterparty offers odds of two-to-one on net profit with a probability of success estimated at 0.60. The standard Kelly fraction is $p - q/b$, which yields $0.60 - 0.40/2 = 0.40$. To stake forty per cent is to maximise the geometric growth rate. Anything less is suboptimal; anything more invites ruin.'

  Ms. Cournot leaned forward, her expression patient. 'Optimal for whom, Dr. Sterling? You speak of growth rates as if they were laws of physics, independent of the agent's desires. But the trustees have undergone elicitation. Their coefficient of relative risk aversion is approximately 0.4. They are less risk-averse than a logarithmic agent, for whom the coefficient is unity. If we maximise their expected utility, not your geometric mean, the arithmetic changes. For CRRA utility with $\rho=0.4$, the optimal fraction is considerably higher than forty per cent. Indeed, ignoring the floor, it approaches eighty per cent.'

  'That is precisely the danger,' Sterling replied. 'You are treating this as a single decision repeated in a vacuum. But this is a multiplicative process over twenty periods. The ensemble average of wealth across counterfactual copies of this trust diverges sharply from the time average along the single trajectory this trust will actually inhabit. You are maximising an expectation over lives the trustees will never lead. We occupy only one timeline. In that timeline, volatility is not a risk to be traded off; it is the mechanism of ruin.'

  'But ruin is an abstraction here,' Cournot countered. 'Under proportional staking, wealth never hits zero. You can lose forever and still retain a positive residue. The floor at £500,000 is a covenant, not a mathematical necessity of the wager itself. In the standard telling of the Kelly criterion, the appeal to avoiding ruin does no work because ruin is impossible with fractional stakes. Here, you are smuggling a normative constraint—the trustees' fear of removal—into a purportedly objective growth criterion.'

  'Not normative, structural,' Sterling insisted. 'Once the capital breaches £500,000, the game ends. It is an absorbing state. The arena in which outcomes matter ceases to exist. Expected-value reasoning asks a real agent to be moved by outcomes in branches of the probability tree that are closed off by early termination. If we stake eighty per cent, as your utility function suggests, a single loss reduces capital to £400,000. The trust is wound up immediately. The twenty-year horizon is irrelevant. The long run is not a sequence of independent bets; it is a survival constraint.'

  Cournot tapped her pen. ' conceded, the floor matters. But that is a constraint on the utility maximisation problem, not a vindication of your ergodicity argument. We simply add the floor to the budget constraint. My point is that growth-rate maximisation is nothing but expected-utility maximisation wearing a logarithmic utility function. It carries no independent normative weight. The coincidence between patient expected-utility maximisation and growth-optimal staking is an asymptotic artefact. It fails under finite horizons, bequests, or utility unbounded above. Here we have a finite horizon of twenty years. Why should the logarithmic limit dictate policy?'

  'Because the logarithmic utility function is not a taste; it is the unique function that renders wealth scales invariant,' Sterling said. 'But let us address your trustees' risk aversion. You say $\rho=0.4$. Applied myopically to the annual wager, this implies a stake of roughly eighty per cent. Applied properly across the full twenty years with the floor in force, however, that preference is suicidal. If they stake eighty per cent, the probability of breaching the floor within five years is near certainty. Are you prepared to tell the trustees that their elicited preferences require them to accept a near-guarantee of removal?'

  'I am prepared to tell them that their preferences require them to accept risk commensurate with their values,' Cournot replied sharply. 'If they are willing to risk removal for the chance of a larger bequest, that is their sovereign right. A single agent's decision problem is properly assessed by her own expected utility because that expectation already integrates over her uncertainty as to which path she occupies. Talk of "typical" trajectories smuggles in a probability weighting of its own. You privilege the mode of the distribution, or the median, and call it "objective". But why is the median more real than the mean? In this wager, the mean wealth grows exponentially faster under high staking than under Kelly, driven by the rare paths where wealth explodes. Why discard those paths?'

  'Because the trustees will not inhabit the mean,' Sterling said. 'They will inhabit the median. And regarding the probability estimate: you treat $p=0.60$ as a fixed parameter. It is an estimate drawn from 150 past wagers, carrying a standard error of roughly four percentage points. If the true probability is 0.56, the Kelly fraction drops to thirty-four per cent. If it is lower, the edge vanishes. Prudence about the estimated probability is required by the growth-rate criterion itself. Fractional Kelly is not merely risk aversion; it is a response to parameter uncertainty.'

  'And there you collapse the distinction,' Cournot seized. 'If you concede that fractional Kelly is justified by uncertainty about parameters, then you are merely doing Bayesian expected-utility maximisation with a prior over $p$. You are integrating over the uncertainty as to which path the agent occupies. You are not discovering a preference-independent constraint; you are simply adopting a specific prior and a specific utility function. If I adopt a flat prior and the trustees' $\rho=0.4$, I get a different stake. That is not a mathematical error; it is a different normative stance.'

  'It is not merely normative,' Sterling maintained. 'There is a mathematical asymmetry between gains and losses in multiplicative dynamics. A loss of fifty per cent requires a gain of one hundred per cent to recover. This geometry dictates that the arithmetic average return is a misleading guide to long-term solvency. Consider a one-off wager with positive expected value that a logarithmic agent would decline because the stake is too large relative to bankroll. Does that reveal a defect in logarithmic utility?'

  'It reveals that logarithmic utility is too conservative for agents with lower risk aversion,' Cournot said. 'If I offer a man a coin toss where he doubles his wealth on heads and loses everything on tails, the expected value is positive. A log agent declines. Is that vindication? No. It is a refusal to engage with positive sum games because the utility function penalises zero wealth infinitely. But our trustees do not penalise zero wealth infinitely; they penalise £500,000 finitely. Their utility function is bounded below by the floor, not by zero. To impose log utility is to impose a risk aversion they do not possess.'

  'To impose log utility is to impose survival,' Sterling corrected. 'But I will concede the floor changes the topology. Without the covenant, ruin is impossible under proportional staking. With it, ruin is reintroduced as a discrete event. This forces us to consider the probability of breach. If we stake forty per cent—the full Kelly—a sequence of two losses reduces capital to £720,000. A third loss breaches the floor. The probability of three losses in twenty years is non-negligible. Therefore, even the growth-optimal fraction must be discounted to ensure the absorbing state is avoided with high probability.'

  'So we agree that the floor binds,' Cournot said. 'But we disagree on the binding mechanism. You see it as a constraint on the growth rate itself. I see it as a constraint on the feasible set of the utility maximisation problem. Mathematically, we may converge on a similar number, but normatively, we are worlds apart. You claim I am ignoring the time average. I claim you are ignoring the trustees' values.'

  'Let us be precise about the recommendation,' Sterling said, closing his notebook. 'Given the parameter uncertainty and the absorbing floor, I recommend a stake of twenty-five per cent. This is roughly half-Kelly. It sacrifices some growth rate to robustify against estimation error and to ensure the probability of breaching the floor remains negligible over twenty years. This is not a taste; it is a requirement of the dynamics.'

  Cournot sighed. 'And I recommend thirty-five per cent. This respects the trustees' elicited risk aversion of 0.4 while acknowledging the hard constraint of the floor. It allows them to capture more of the positive expected value than your conservative fraction, without triggering the absorbing state unless an extremely unlikely sequence of losses occurs. To stake less is to impose a prudence they did not ask for.'

  They sat in silence for a moment.

  'Diagnosis,' Sterling said. 'We differ on whether the growth rate is a physical constraint or a preference. I claim it is the former; you claim the latter. Operationally, this led to a difference of ten percentage points in the stake. The parameter uncertainty argument was the only place where our mathematics overlapped, but even there, you treated it as Bayesian updating while I treated it as ergodic robustness.'

  'And my diagnosis,' Cournot concluded, 'is that your "ergodic robustness" is simply a disguised way of imposing a higher risk aversion than the trustees possess. The operational difference stems from whether we prioritise the median trajectory or the expected utility across all trajectories. You prioritise survival of the process; I prioritise the satisfaction of the principals. We are not arguing about maths. We are arguing about who the trust is for.'

  Sterling nodded slowly. 'Then we shall put both figures to the committee. But I must record that if the true probability is 0.56, your recommendation exposes the trust to a positive probability of ruin that mine does not.'

  'And I must record,' Cournot replied, 'that if the true probability is 0.60, your recommendation exposes the beneficiaries to a significant loss of expected wealth that mine does not. The trustees must choose which risk they prefer to bear.'

  They stood, the papers on the table dividing the room as cleanly as the argument itself.
