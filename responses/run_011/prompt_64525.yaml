answer: |-
  Let's strip the varnish off this. You're right to be bored by the plank version; it's too clean. The DVLA case is messy, bureaucratic, and materially specific, which makes it a far richer text for reconstructing an implicit ontology.

  Here is the reconstruction of the theory hidden inside the V765 form, followed by the verdict you asked for.

  ### 1. The Implicit Theory: Weighted Functionalism
  The scoring rule presupposes a view of identity that is neither strictly materialist nor strictly psychological (since cars have no minds). It is a **Weighted Functional Hylomorphism**.

  It treats the car not as a sum of parts, but as a hierarchy of functions where some functions define the *essence* and others define the *state*.
  *   **The Chassis/Body (5 points):** This is the *substrate*. It defines the spatial boundaries, the mounting points, and the visual silhouette. In Aristotelian terms, this is the primary carrier of the *Form*.
  *   **The Running Gear (Suspension, Axles, Transmission, Steering - 2 points each):** These are the *locomotive functions*. They make it a vehicle rather than a statue.
  *   **The Engine (1 point):** This is the *power source*. Crucially, it is treated as a module.

  The theory is **additive** but **threshold-governed**. Identity is not a binary switch that flips the moment a bolt is turned; it is a reserve of "identity credit." You can spend this credit replacing parts, but if you spend too much on the wrong parts (the chassis), you go bankrupt (Q-plate).

  This contradicts the standard philosophical objection that identity cannot come in degrees. The DVLA isn't saying the car is "50% the same car." They are saying the *claim* to identity is supported by evidence to a degree. However, the *verdict* is binary. This suggests they view identity as **epistemically gradable but ontologically binary**. You either cross the threshold of proof, or you don't.

  ### 2. Metaphysics or Anti-Fraud Bookkeeping?
  You suspect it's anti-fraud bookkeeping dressed as persistence. You are half-right, but the distinction matters.

  If it were purely evidential ("we can't tell how old this is"), the Q-plate would be a temporary holding status pending investigation. It isn't. It's a permanent classification. Therefore, the DVLA is not merely reporting on an epistemic limitation; they are **legislating an ontological boundary**.

  However, they aren't doing "metaphysics" in the sense of discovering the true nature of car-hood. They are engaging in **Social Ontology**. They are creating the conditions under which a physical object counts as a specific legal entity. The fraud prevention is the *motive*, but the mechanism is ontological. They are defining what "same car" means in a legal context.

  So, it is not "bookkeeping dressed as metaphysics." It is **regulatory metaphysics**. They are asserting that for the purposes of tax and registration, *identity is constituted by the retention of the chassis form*.

  ### 3. Underdetermination: Rival Accounts
  You asked which rival accounts could license this practice. The points table is indeed underdetermined. Here are two competitors that yield the same results:

  *   **The "VIN as Soul" Theory:** Identity follows the Vehicle Identification Number plate. In the UK, the VIN is usually attached to the chassis/body. If you keep the chassis, you keep the VIN. If you swap the shell, you lose the VIN location. This account ignores the metal entirely and focuses on the *tag*. The points test is just a proxy for "did you keep the VIN attachment point?"
  *   **The "Type-Instance" Theory:** A 1960 Sprite is a *type*. Your car is an *instance*. As long as the instance retains the structural characteristics of the type (the body shape/chassis), it remains an instance of that type. The engine is irrelevant to the *type* (Sprites came with different engines). The chassis is essential to the *type*.

  Both accounts justify the 5-point chassis rule without invoking "persistence of substance."

  ### 4. The Chassis (5) vs. The Engine (1)
  Why is the chassis worth five times the engine, when the engine is the "soul" to the enthusiast?

  *   **Philosophical Reason:** The chassis is the **condition of possibility** for the car. Without a chassis, you have an engine on a stand. Without an engine, you have a rolling chassis (which is still recognizably a car). The chassis provides the *this-ness* (haecceity); the engine provides the *activity*.
  *   **Market Reason:** You are right that the market prices the engine. But the market prices *performance*, whereas the DVLA prices *provenance*. Provenance is tied to the body shell (rust patterns, crash damage, original paint traces). The chassis carries the history; the engine carries the value. The DVLA regulates history, not value.

  ### 5. The New Bodyshell Paradox
  This is the point that breaks the material continuity reading. If a brand-new reproduction bodyshell scores the full 5 points, **material continuity is dead.**

  This confirms the **Hylomorphic** reading (Form over Matter). The DVLA rules implicitly state that the *information pattern* of the chassis (its shape, dimensions, spec) is more important than the *atoms* of the chassis. A new shell made to the original blueprint preserves the *Form*, and therefore preserves the *Identity*.

  This aligns with how we treat living organisms (you replace cells, you stay you) but contradicts how we treat heirlooms (a replaced diamond isn't the same diamond). The DVLA treats cars more like organisms than jewels. They are functional types that persist through material replacement provided the *blueprint* is maintained.

  ### 6. Persons and Companies: Why the Difference?
  Why no points test for humans or companies?

  *   **Companies:** A company is a **pure legal fiction**. It has no physical extension. Its identity is *entirely* nominal, tied to its incorporation number. It doesn't need a points test because it has no material components to lose. It is 100% "Q-plate" logic all the time—it exists only because the register says so.
  *   **Persons:** Humans have **biological and psychological continuity**. The law assumes spatio-temporal continuity of the biological organism. We don't need a points test because the *presumption* of continuity is overwhelming. If you replace every cell, the biological process is continuous. If you replace every employee, the corporate *process* is continuous.
  *   **Cars:** Cars are the hybrid case. They are physical objects (like humans) but their continuity is easily interrupted (they can sit in a barn for 30 years, be dismantled, and reassembled). They lack the internal biological drive that presumes continuity. Therefore, they require an **external verification of continuity**. The points test is a proxy for the biological processes that keep a human identity intact without administration.

  The DVLA rule tracks the **vulnerability of the artefact's continuity**. Humans are self-repairing; cars are not. The points test compensates for the car's inability to assert its own persistence.

  ### 7. The Alternative Practice
  If we swapped in a view where the frame has no special claim, the practice would look like one of two things:

  1.  **The "Plate Follows the Owner" Model:** Identity is tied to the registration document, not the metal. You could move the number plate to any chassis you like, provided you declare it. (This exists in some racing classes, but not on public roads).
  2.  **The "Engine Number" Model:** Identity follows the engine block (as some jurisdictions historically did). This would treat the car as defined by its power source.

  If the frame had no claim, the "kit car" industry would be indistinguishable from the "restoration" industry. The current practice creates a **caste system**: Originals (Chassis kept) vs. Replicas (New Chassis). Removing the frame privilege collapses this distinction.

  ### 8. The Verdict
  You asked me to pick a side: Is the agency doing metaphysics badly, or not doing metaphysics at all?

  **They are not doing metaphysics at all.**

  They are doing **constitutive regulation**.

  Here is the distinction: Metaphysics attempts to describe the conditions of identity that *already exist*. Regulation creates the conditions of identity that *must exist* for the system to function.

  When the DVLA says a new bodyshell scores 5 points, they are not making a claim about the metaphysical nature of Sprites. They are making a policy decision that *for the purposes of the register*, a car built to original specs on a new chassis is functionally equivalent to the original for tax and safety purposes.

  They are not "getting the metaphysics wrong" (as if there is a fact of the matter they are missing). They are **bypassing the metaphysics**. The Q-plate isn't an ontological verdict ("This is a different car"); it is a safety and tax classification ("We cannot verify the age, so you pay the modern rate").

  The "points test" is a **heuristic for administrative risk**.
  *   High chassis score = Low risk of fraud (hard to fake a vintage chassis).
  *   Low chassis score = High risk of fraud (easy to build a replica and claim it's vintage).

  You are wrong to think they are asserting a metaphysics. They are asserting a **boundary condition for liability**. If they treated identity as purely material, they'd have to inspect every bolt. If they treated it as purely nominal, fraud would run wild. The points system is a compromise that *uses* metaphysical language ("original," "replacement") to manage **epistemic risk**.

  So, discard the idea that they are bad metaphysicians. They are good bureaucrats. They have taken the Ship of Theseus, realized it has no solution, and built a toll booth around it. The points test doesn't solve the paradox; it just charges you extra if your ship looks too new.
