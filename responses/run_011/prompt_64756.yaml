      *   **Interlocutor Mapping:** Show which reading supports whom.
      *   **The Comparison Rule:** Analyze the link between the Maxim and the "Balance."
      *   **Confidence & Self-Critique:** Fulfill the specific meta-requests (where am I guessing, what would change my mind).

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to drift into defending Hume. Stay on the *meaning of the sentence*.
      *   *Nuance:* The "Evidence" axis is the most critical. The Leader treats "uniform experience" as evidence *against*. The Correspondent treats "medical reports" as evidence *for*. The maxim doesn't decide which counts.
      *   *Clarification:* Ensure the distinction between "proportioning" as mathematical equality vs. "sensitivity" is clear.
