answer: |-
  The whiteboard in Conference Room B smelled of dry-erase solvent and stale coffee. At the center, written in permanent marker because no one dared erase it, was the Thorne Equilibrium. *Flow equals Density times Velocity.* It was the hard truth of the Department of Traffic Modeling, the axiom upon which thirty years of grants were built. Nobody questioned the Equilibrium. You didn't question gravity; you didn't question Thorne.

  Elena sat at the far end of the table, tracing the rim of her mug. She remembered when the Equilibrium had felt like a engine rather than an anchor. Five years ago, the data from the I-95 corridor had spiked during a Tuesday thunderstorm. The model predicted gridlock; the sensors showed free-flowing traffic. It should have been a crisis. Instead, Elena had proposed the "Visibility Friction Coefficient." She argued that drivers weren't slowing down because of the rain, but because the streetlights hadn't triggered due to cloud cover density.

  It was a patch, an auxiliary assumption wrapped around the core to protect it. But it had worked. The following month, during a solar eclipse, the model predicted the dip in speed perfectly. They had published in *Transportation Science*. They had secured the five-year renewal. That was a progressive shift; the patch had bought them truth they hadn't possessed before.

  Now, the whiteboard around the permanent marker was crowded.

  "We're seeing variance in the suburban arteries again," said Marcus, a junior analyst whose contract was up in June. He pointed to a cluster of red dots on the projection screen. "Thursday evenings. The model says congestion should peak at 5:30 PM. It's peaking at 7:00 PM."

  Dr. Aris Thorne sat at the head of the table. He was seventy, with hands that trembled slightly when he wasn't holding a pen. He wasn't a villain. He was a man who had built a cathedral of math and was watching the weather wear down the stone. He didn't get angry at the data; he looked at it with a kind of paternal disappointment.

  "Add a variable for remote work latency," Aris said softly. "The post-pandemic commute isn't linear. We adjust the temporal weightings."

  Elena watched him. She had written the code for the remote work weighting last year. Before that, it had been the "Fuel Price Sensitivity" patch. Before that, the "Ride-Share Aggregation Factor." Each one was reasonable. Each one made sense on its own. But the model was becoming heavy, a ship laden with too much cargo, sitting lower in the water with every voyage.

  "It's not just the weighting, Aris," Elena said. "The structure is holding, but the cost… we're spending eighty percent of our compute power adjusting for outliers."

  "The outliers are the reality," Aris countered. "The theory is the map. We refine the map."

  The door opened. A woman in a blazer walked in without knocking. She was from City Data, the rival group funded by the municipality's tech initiative. They didn't use equilibrium equations. They used individual telemetry, tracking cars rather than flows.

  "Sorry to interrupt," she said. "We're running a simulation on the Thursday evening spike. We think it's related to school pickup patterns overlapping with gig-economy shifts."

  She plugged a drive into the console. Her graph appeared next to theirs. It was cleaner. It didn't have the thick belt of correction factors. It simply absorbed the anomaly. The Thursday spike wasn't an error to be patched; it was a feature of their system.

  "We're hiring," the woman said, turning to the room. She looked at Marcus. "We need people who understand the old corridors to train the new nodes. Full-time. Starting July."

  The air in the room shifted. It wasn't about the data anymore. Elena saw Marcus sit up straighter. He looked at his contract expiry date, then at the clean graph on the screen. The anomalies that had required them to write thousands of lines of corrective code were handled by the rival system as a matter of course. But more than that, the rival system had *work*. It had open questions that didn't require defending the past.

  Aris cleared his throat. "We are in the middle of a review."

  "I know," the woman said. "Just wanted to share the findings. And the offers."

  She left. The silence was heavy. Marcus looked at his notebook, then at Aris. "I… I might need to look into that," Marcus said. "For my career."

  Aris nodded slowly. He didn't fight. He knew that a research programme doesn't die when it is proven wrong; it dies when it stops employing the living.

  Elena looked at the whiteboard. The permanent marker equation stood pristine in the center. Around it, the dry-erase patches overlapped, a scabbed-over skin of coefficients and weightings. She thought about the Visibility Friction Coefficient. It had been brilliant once. It had predicted the eclipse.

  Now, to explain a Thursday evening traffic jam, they needed a new variable every week. The rival group didn't need variables; they had data.

  She realized then that the line wasn't drawn in the data. It wasn't about who was right about the Thursday spike. It was about where the energy was going. In their room, the energy flowed inward, protecting the center, spending capital to explain away noise. In the other room, the energy flowed outward, buying new ground.

  Elena capped her pen. She looked at Aris, who was staring at the Equilibrium as if he could hold it in place by willpower. She understood that he wasn't wrong. He was just finished.

  She opened her laptop and began to draft an email to City Data. She didn't know what she would say yet, but she knew which side of the whiteboard she was on.
