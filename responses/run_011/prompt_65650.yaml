answer: |-
  The Wall of Veridia is not made of stone, but of Law. It hums when you press your ear to it, a low vibration of definitions and decrees that keep the chaos of the Outside from dissolving the streets within. I am Elara, a Senior Recorder in the Hall of Registers. My life is spent ensuring that every household, every birth, and every death is inscribed in the Great Book. My stake in this is simple: if the City is finite, I am merely an entry in a ledger, expendable when the book closes. If the City is infinite, as the High Reckoners teach, then I am part of an endless unfolding, secure in my necessity.

  Then the Delegation arrived at the North Gate.

  They did not knock. They simply stood on the grassy hill beyond the Law, holding a scroll of polished copper. Their leader, a woman with eyes like cold flint, called out that they had counted us. They claimed to have a list, a single numbered sequence containing every soul within Veridia, from the High Reckoner down to the street sweepers, including me.

  "Bring it in," the High Reckoner commanded, his voice booming from the battlements. "Let us verify your claim."

  "It cannot cross," the woman said. Her voice was calm, carrying easily over the hum of the Wall. "The mapping holds only from here. Inside, the numbers lose their grip."

  This was heresy. The City's foundational law, proven centuries ago by the First Diagonalist, states that no list can contain all households. To prove the Delegation liars, I was tasked with constructing the Counter-House. If I could build a household that could not exist on any list provided to us, the City's infinity would be secured, and my own existence would remain mystical rather than numerical.

  I was given a transcript. The Delegation had allowed us to copy a portion of their copper scroll onto parchment, just enough to work with. It was a list of names, numbered one to infinity, or so they claimed. I sat in the scriptorium, the parchment spread before me, the quill heavy in my hand. The air smelled of ink and anxiety.

  "Begin the construction," the High Reckoner ordered.

  I looked at the first entry. *House 1: The Alchemists.* Their signature mark was a spiral. I took my quill and drew a square.
  I looked at the second entry. *House 2: The Weavers.* Their signature mark was a grid. I drew a circle.
  I looked at the third entry. *House 3: The Masons.* Their mark was a triangle. I drew a star.

  I continued down the list. For the *nth* house on the list, I looked at the *nth* symbol in their signature string. If it was filled, I left mine empty. If it was open, I closed mine. If it was a line, I made it a curve. I was building a new signature, stitch by stitch, stealing from every house on the list but belonging to none of them.

  When I finished, I held up the new signature. It was a complete household profile, valid under City Law. It described a real place, a real family. Yet, by its very construction, it differed from House 1 in the first place, from House 2 in the second place, and from House *n* in the *nth* place. It could not be on the list I had just used.

  "The list is incomplete," I announced, my voice trembling. "This house exists. It is not there."

  The High Reckoner nodded, satisfied. The City's law held. No list inside the Wall could ever capture us all. We were uncountable. I felt a surge of relief; I was not a number. I was part of the infinite.

  But the Delegation remained on the hill.

  Days later, I went to the North Gate. The woman was still there, the copper scroll gleaming in the sun. I climbed the stairs to the viewing slit.

  "You see?" I called out. "We constructed a house you missed."

  The woman smiled, pitying. She unrolled the copper scroll further. She pointed to a line far down the list, somewhere beyond the section they had transcribed for us. "That house is here," she said. "Entry number 8,492."

  "Liar," I said. "We proved it cannot be on any list."

  "You proved it cannot be on any list *you can hold*," she corrected. "Our list is not held. It is seen."

  I demanded she bring the scroll to the gate. She pressed the copper against the outer surface of the Wall. I pressed my parchment against the inner surface. The Wall was thick, opaque stone. I could see the gleam of her copper through the slit, but I could not touch it.

  "Match them," she challenged. "Take your new house. Find it on my scroll."

  I tried. I looked at her numbers. I looked at my names. To verify her claim, I needed to draw a line from her number to my house. But the line had to cross the Wall. When I tried to ink the connection on my side, the ink slid off the stone. The Law of the City does not permit functions that originate Outside. The mapping existed, I could see it glinting in the sun, but I could not grasp the thread that tied the number to the name. The thread passed through the stone, and the stone dissolved any tool I tried to push through it.

  "You have a list," I admitted, my hand resting on the cold interior wall. "But it is useless to us."

  "It is complete," she said. "You are #8,493, Elara. You are finite. You are counted."

  "And yet," I said, turning back to the Hall of Registers, where my diagonal proof sat drying on the desk, "I am not on any list I can use. I am infinite to myself."

  I walked away from the gate. The copper scroll remained on the hill, a perfect, countable sequence gleaming in the light. Inside the Wall, my proof remained on the desk, a perfect demonstration of incompleteness. The ink on my parchment was dry and permanent. The ink on her copper was bright and unchanging. The Wall hummed between them, thick and silent, holding both truths apart so neither would shatter the other. I returned to my desk. I am Elara. I am on the list. I am not on the list. The census continues.

