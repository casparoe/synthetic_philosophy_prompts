answer: |-
  ### Specification for a Theory of Privacy

  **Purpose:** To provide a character with a coherent, non-academic vocabulary for violation that survives scrutiny in dialogue and internal monologue.

  #### 1. Requirements List

  **Phenomena to Explain**
  *   **The Panoptic Effect:** The theory must explain why the mere possibility of being watched alters behaviour, even if the watcher is never identified. (Non-negotiable)
  *   **The Accuracy Sting:** The theory must explain why being described accurately can feel more violating than being lied about. (Non-negotiable)
  *   **Role Relativity:** The theory must explain why I accept my GP knowing my history but would feel violated if my sister knew the same facts. (Non-negotiable)
  *   **The "Nothing to Hide" Error:** The theory must explain why "I have nothing to hide" is a category mistake rather than a sufficient defence. (Non-negotiable)

  **Distinctions to Maintain**
  *   **Privacy vs. Secrecy:** The theory must distinguish between hiding wrongdoing and maintaining a boundary around the self. (Non-negotiable)
  *   **Privacy vs. Solitude:** The theory must distinguish between being alone and being unobserved (one can be private in a crowd, exposed in an empty room). (Non-negotiable)
  *   **Privacy vs. Confidentiality:** The theory must distinguish between a duty owed by the receiver (confidentiality) and a right held by the subject (privacy). (Non-negotiable)
  *   **Right vs. Value:** The theory must distinguish between having a right to privacy and privacy being a good thing. (Pet Preference: Metaphysical clutter for fiction)
  *   **Control vs. Access:** The theory must distinguish between my ability to stop access and the moral status of the access itself. (Non-negotiable)

  **Facts to Accommodate**
  *   **The Privacy Paradox:** The theory must accommodate that people claim to value privacy but trade it freely for convenience. (Non-negotiable)
  *   **Beneficial Invasion:** The theory must accommodate that some invasions (safeguarding, medical emergency) are morally right despite violating privacy. (Non-negotiable)
  *   **Temporal Consent:** The theory must accommodate that consent given by a past self may not bind a future self (dementia/legacy data). (Non-negotiable)

  #### 2. Blunt Assessment of Desiderata

  **Is it a requirement that privacy is good in itself?**
  No. That is an anti-reductionist reflex. Demanding intrinsic value is a thumb on the scale. A theory works for your novel if it shows privacy is *instrumentally* necessary for dignity, autonomy, or relationship-building. If a character argues privacy is sacred in itself, that is a character choice, not a theoretical requirement.

  **Is it a requirement that a theory condemn all observation the subject hasn't agreed to?**
  No. That is a pet preference of the libertarian camp. It contradicts the "Beneficial Invasion" fact (safeguarding). A robust theory must allow that non-consensual observation can be justified, even if it remains a privacy cost.

  #### 3. The Impossible Triangle

  You cannot satisfy these three requirements simultaneously:

  1.  **Sovereignty:** Privacy is defined solely by the individual's control over their information.
  2.  **Objectivity:** Privacy violations are determined by social norms and context, not individual whim.
  3.  **The Nessa Constraint:** A violation can occur even when control is surrendered (lawful access) and norms are followed (professional conduct).

  *   **If you keep 1 & 2:** You cannot explain the Nessa scene (lawful access shouldn't violate sovereignty).
  *   **If you keep 1 & 3:** You cannot explain the Priya scene (public space implies surrendered control, so no violation).
  *   **If you keep 2 & 3:** You must abandon Sovereignty (Control) as the definition of privacy.

  **Recommendation:** Drop Sovereignty. Control is too brittle for your novel. Your characters are violated by things they could not control.

  #### 4. The Knockout Requirement

  **The Nessa Constraint:** *A theory must explain why lawful, kind, confidential access can still feel like a violation.*

  This single requirement eliminates the **Control Account** (she had no control), the **Restricted Access Account** (access was permitted), and **Reductionism** (no tangible harm occurred). It forces you toward a theory based on *power asymmetry* or *contextual integrity*.

  #### 5. Contenders Evaluation

  **The Control Account**
  Privacy is the right to control who knows what about you. It fails your novel. It cannot explain the Nessa scene (the tenant didn't control the file) or the Priya scene (shot in public, control lost instantly). It makes privacy a commodity rather than a condition of being. If you use this, your characters will sound like they are arguing about ownership, not dignity.

  **The Restricted Access Account**
  Privacy is the state of being inaccessible to others. It fails the Nessa scene because the access was lawful and professional. It struggles with the Priya scene because the information was already known to peers. It defines privacy as a physical state rather than a normative one, making it useless for digital or bureaucratic violations where access is granted but misused.

  **The Contextual Norms Account**
  Privacy is the appropriate flow of information according to social context. This is your strongest candidate. It explains the GP vs. Sister distinction perfectly (different contexts). It explains Priya (school context vs. county-wide viral context). It struggles slightly with Nessa, unless you argue the *purpose* of the file reading violated the context of "refuge," even if the access was lawful. It allows characters to argue about "what this situation is" rather than "who owns this data."

  **The Intimacy Account**
  Privacy is necessary to create and maintain intimate relationships. It handles the Widow scene well (the phone represents a separate sphere of self). It fails the Priya scene (public humiliation isn't about intimacy) and the Nessa scene (institutional, not relational). It makes privacy too dependent on having someone to be intimate with, leaving isolated characters without a claim.

  **The Reductionist Account**
  Privacy is just a bundle of other rights (property, bodily security, reputation). It explains everything efficiently but drains the scenes of their specific sting. If privacy is just reputation, Priya's video is just libel. If it's just property, Nessa's reading is just trespass. It solves the philosophical hole by denying the hole exists, which undermines your thematic struggle.

  #### 6. Scene Weighting

  **Most Weight:** **The Nessa/Tenant Scene.**
  This is the philosophical core. It challenges the easiest definitions of privacy (harm, control, secrecy). If your theory works here, it will work for Priya. It forces the distinction between *lawful* and *right*, which is where your novel's tension lives.

  **Cuttable:** **The Widow/Phone Scene.**
  While emotionally resonant, it covers similar ground to the Councillor scene (internal boundaries and consent) but with lower stakes and less public consequence. The Councillor scene handles the "temporal consent" requirement more rigorously. Cutting the Widow scene loses intimacy but retains the theoretical structure regarding boundaries and the self.
