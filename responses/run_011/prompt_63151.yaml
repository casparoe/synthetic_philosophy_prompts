  ### Degrees of Sphexishness

  Sphexishness admits of degrees. The scale measures the **sensitivity threshold of the integrative mechanism**. It is not merely the number of counterfactuals handled (Case 4 handles many, yet is rigid in one), nor the distance between trigger and purpose. It measures how much disturbance or conflicting information is required to breach the encapsulation and trigger the global override. In Case 2, the wasp is less sphexish because the threshold for breaking the loop is lower (finite repetitions vs. infinite). A system is more sphexish the more information it can ignore without correcting course.

