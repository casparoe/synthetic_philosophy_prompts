  ### The Teleological Encapsulation Account

  **Principle:**

  1.  **Encapsulation Clause:** A system exhibits rigidity in respect *R* when its behavior in *R* is determined by a local stimulus-response mapping that is insulated from information *I* available to the system's broader architecture. (Motivated by Cases 1, 3, 4, 7).
  2.  **Teleological Frustration Clause:** Rigidity counts as *sphexishness* only if the insulated behavior frustrates the system's operative ends—those goals ascribed to the system by a rational interpretation of its wider functional design or reflective commitments. (Motivated by Cases 1, 6, 8, 11, 12).
  3.  **Capacity Clause:** Sphexishness attributions require the system to possess (or be rightly attributed) the architectural capacity to integrate information *I* to serve those ends, distinguishing agents from simple homeostats. (Motivated by Cases 1 vs 13, 5 vs 6).
  4.  **Volitional Alignment Clause:** A system is *free* in respect *R* if the behavior in *R* aligns with the system's reflective endorsement, regardless of whether the behavior is rigid or flexible. (Motivated by Cases 9, 10).

  ---

  ### Run Over Cases

  1.  **Wasp Loop:** Encapsulated (ignores moved cricket), frustrates end (nesting), lacks capacity for reflection but has functional teleology. **Verdict: Sphexish, Unfree.** (Agrees).
