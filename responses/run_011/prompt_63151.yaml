  7.  **Assistant Refusal:** Encapsulated (canned response ignores argument). Frustrates end (helping). Capacity exists (handles novel tasks). **Verdict: Sphexish.** (Agrees).
  8.  **Partisan:** Encapsulation of core commitment; flexibility recruited to protect it. Frustrates end (truth/rationality). **Verdict: Sphexish.** (Agrees).
