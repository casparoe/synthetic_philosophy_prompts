  ### Sphexishness and Unfreedom

  They are **TWO properties**.

  *   **Sphexishness** is an architectural failure: modular encapsulation that frustrates function.
  *   **Unfreedom** is a volitional failure: behavior that bypasses or contradicts reflective endorsement.

