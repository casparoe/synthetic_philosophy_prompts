answer: |-
  1. Essay Question (25 marks)

  **Time allowed: 45 minutes**

  **Stipulations:**
  For the purposes of this question, accept the following doctrinal summaries:
  (1) The **Nyāya** school recognises four independent sources of knowledge (*pramāṇa*): perception (*pratyakṣa*), inference (*anumāna*), comparison (*upamāna*), and testimony (*śabda*). They define testimony as the statement of a trustworthy person (*āpta*).
  (2) The Buddhist epistemologists recognise only two sources: perception and inference. They treat testimony as a species of inference from a sign.
  (3) The five members of the Nyāya inference schema (*parārthānumāna*), in order, are: Thesis (*pratijñā*), Reason (*hetu*), Example (*udāharaṇa*), Application (*upanaya*), and Conclusion (*nigamana*).

  **Cases:**
  (1) A myna bird kept for years in a water-diviner's house has learned to repeat the sentence its owner used to say on finding a good spot: dig beneath the tamarind and you will strike water. The diviner is now dead. In a drought year, villagers act on the bird's squawk, dig, and find water. The bird has no beliefs and no intention to inform anyone; its utterance has simply proved a dependable indicator. Add the further detail that the villagers have never verified the bird's claims for themselves — their confidence in it rests on assurances given to them by the diviner, who was honest and skilful but is no longer available to be asked.
  (2) A four-year-old is told by a stranger that the water in the far well is safe to drink. The stranger is in fact a careful and truthful hydrologist who has just tested it. The child has no way of assessing the stranger's competence, no history of corroborated instances, and no understanding of what testing a well involves; she simply believes him and drinks.

  **Question:**
  Explain why Case (1) is typically put forward as a difficulty for the Nyāya account rather than the Buddhist account, and why Case (2) is a difficulty for the Buddhist account rather than the Nyāya account. In your explanation, identify where each school locates the epistemic work (in the competence of the source or in the reasons available to the hearer).

  Set out, in the five-membered format listed above, the inference by which the Buddhist reductionist claims knowledge arises in Case (2). Identify which member of that inference the Nyāya defender will attack.

  Finally, adjudicate between the two accounts. Consider explicitly whether a 'patched reduction' — one that widens inference to cover unreflective, sub-personal dispositions of the sort the child exercises — is a genuine reduction of testimony or a change of subject that leaves the original dispute untouched.

  ***

  **Model Answer**

  Case (1) pressures the Nyāya account because it presents a scenario where verbal knowledge arises without a trustworthy person. Nyāya defines testimony (*śabda*) strictly as the statement of a trustworthy agent (*āpta*) with an intention to communicate. In the bird case, the source lacks belief, intention, and personhood. For Nyāya, this must be classified as inference (*anumāna*) from a sign, not testimony. However, the epistemic result for the villagers is identical to hearing a human speaker. This suggests that the linguistic form, rather than the speaker's ontology, might be doing the epistemic work. The Buddhist reductionist uses this to argue that all verbal knowledge is merely inference from a reliable sign; the bird is simply a very reliable sign. Thus, the case troubles Nyāya by suggesting their distinction between testimony and inference is arbitrary when the hearer's experience is unchanged.

  Case (2) pressures the Buddhist account because it presents knowledge without inferential awareness. Buddhists reduce testimony to inference from the speaker's competence. Valid inference requires the hearer to know the reason (*hetu*) and the pervasion (the universal connection between competence and truth). The child possesses neither; she cannot assess the stranger's competence nor recall corroborated instances. If testimony were inference, the child should remain ignorant. Nyāya argues this shows testimony is irreducible: the epistemic work lies in the source's competence, not the hearer's reasoning. The hearer need only understand the meaning and trust the source. Thus, the child case supports Nyāya by showing knowledge arises where inference is impossible.

  To reduce Case (2) to inference, the Buddhist constructs the following five-membered schema:
  1. **Thesis:** The water in the well is safe.
  2. **Reason:** Because it was stated by this stranger.
  3. **Example:** Whatever is stated by a competent hydrologist is safe, like water from a tested lab sample.
  4. **Application:** This stranger is a competent hydrologist.
  5. **Conclusion:** Therefore, the water in the well is safe.

  The Nyāya defender attacks the **Application** (and implicitly the Reason). The child cannot establish that the stranger is competent. She lacks the background knowledge required to subsume the stranger under the universal rule in the Example. Without knowing the Application, the inference is stillborn. The Buddhist claims the inference runs sub-personally, but Nyāya insists inference requires conscious awareness of the connection.

  Adjudicating between them requires examining the 'patched reduction'. If the Buddhist widens inference to include sub-personal dispositions (where the child is causally triggered to believe without reasons), they may save the reduction formally. However, this risks changing the subject. Classical inference is normative; it justifies belief through awareness of reasons. A sub-personal causal disposition is descriptive, not normative. If 'inference' is stretched to cover blind trust, it loses its defining feature (awareness of pervasion). Consequently, the patched reduction is not genuine. It concedes that the hearer's epistemic access is not inferential in the strict sense. Nyāya preserves the distinction by locating the warrant in the source's reliability, accessible via testimony, whereas the Buddhist patch effectively admits testimony functions differently from standard inference. Therefore, Nyāya offers the more coherent account of the child's knowledge, while the bird case remains a manageable anomaly for Nyāya (classifiable as inference) but a definitional crisis for Buddhists if they insist testimony requires a speaker's competence. The dispute turns on whether epistemic warrant requires internal reasons (Buddhist) or can be externally sourced (Nyāya).

  ***

  **Marking Scheme (25 Marks)**

  | Move | Marks | Common Mistake |
  | :--- | :--- | :--- |
  | **Case 1 Analysis:** Explains Bird case troubles Nyāya (words without person) and locates epistemic work (Nyāya: source personhood; Buddhist: sign reliability). | 5 | Reversing the cases, claiming the Bird case troubles the Buddhist account instead. |
  | **Case 2 Analysis:** Explains Child case troubles Buddhist (knowledge without inferential awareness) and locates epistemic work (Buddhist: hearer's reasons; Nyāya: source competence). | 5 | Failing to identify that the child lacks the necessary reasons for inference. |
  | **Inference Schema:** Correctly lists all five members with content relevant to Case (2). | 5 | Omitting a member or using incorrect labels (e.g., 'Premise' instead of 'Reason'). |
  | **Inference Conclusion:** The Conclusion states the reported state of affairs ('Water is safe'), not the speaker's trustworthiness. | 2 | Writing the conclusion as 'The stranger is trustworthy' rather than 'The water is safe'. |
  | **Attack Point:** Identifies Application (or Reason) as the weak member because the child cannot verify competence. | 3 | Attacking the Thesis or Example instead of the hearer's inability to apply the rule. |
  | **Adjudication:** Argues whether patched reduction is genuine or change of subject (normative vs causal). | 5 | Accepting the patched reduction without critiquing the loss of normative awareness. |
  | **Total** | **25** | |

  ***

  **First-Class vs. Upper-Second Boundary**

  A first-class answer distinguishes itself in the adjudication section. While a solid upper-second candidate will correctly identify that the child cannot perform the inference and that the patched reduction stretches the definition of inference, a first-class candidate will explicitly articulate *why* this stretch matters: specifically, the shift from a normative account of justification (awareness of reasons) to a causal account (sub-personal disposition). The first-class answer will recognise that if the Buddhist accepts the patch, they concede that testimony does not function like standard inference, thereby undermining the reductionist claim itself. The upper-second answer often stops at noting the child's ignorance without fully dismantling the philosophical viability of the 'sub-personal inference' defence.
