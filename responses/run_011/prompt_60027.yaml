prompt: |-
  I chair the disciplinary panel at a medium-security prison — three of us, a deputy governor, a wing manager and me, none of us lawyers — and we run about thirty adjudications a month, twenty minutes a case, after which we have to fill in a template certifying that the sanction was necessary and proportionate and then write one paragraph of reasons in plain English that the man himself will read and that a reviewer might check six months later. Our range is loss of privileges, days added to the earliest relase date, cellular confinement for up to a few days, and referral out for treatment. An audit just found that two panels in this same prison gave wildly different sanctions for near-identical charges, and the governor has asked me to write us a proper decision procedure. That part I can do. The part I can't do is that over the last year I've been talked into free will skepticism — I read the Caruso/Dennett debate book and came out on Caruso's side, which for me means something like his public-health/quarantine picture: nobody deserves to suffer in the basic-desert sense, what we're entitled to do is limited to what's needed to prevent harm, in its least restrictive form, with proportionality acting as a ceiling rather than a target. Two of my three panelists are Dennett's people without having read him: responsibility is a social practice, free will is a set of competences that get cultivated by being held to standards, censure is a message addressed to a person and not a technique applied to a mechanism, and a panel that never says you earned this is treating the men like weather to be managed. I don't want to relitigate that in the room every fortnight.

  So write me a decision procedure for a single adjudication that a panelist who's never heard of either philosopher could actually run in twenty minutes: the questions to ask in strict order, what counts as a sufficient answer to each, the points where the procedure stops at no sanction, the points where it stops at a ceiling, and the points where it explicitly hands the decision over to judgment because the question is about values rather than facts. It has to be honest about admissibility — spell out which considerations come in at each step and which are barred and why, so that "he deserves days for that" gets either routed somewhere legitimate or refused outright instead of sneaking in dressed up as a risk judgment. And it needs to be one procedure both camps can use: where a skeptic and a compatibilist running the same steps would land on different sanctions, or the same sanction for incompatible reasons, mark the divergence and give me a tie-break rule (does the chair get a casting vote, does the less restrictive reading win by default, does it go to the governor?). Give me the thing as a one-page card a panel could laminate, plus the reasoning behind the card — no reading list, I've got the books.

  Then run it on three cases and show the panel's working, not just the verdicts. (1) A man with fourteen months clean and working in the kitchen throws a pan of hot water at an officer during a cell search that destroyed photos of his daughter; the officer isn't badly hurt but won't come back onto the wing, and half my panel wants the maximum days. (2) A man with no charges against him in two years who quietly refuses every accredited programme and tells new arrivals the programmes are a con; the wing manager wants to book him for failure to comply, and the real case for sanctioning him is that his refusal is contagious. (3) Three men on the same wing separately refused to return to their cells during a lock-up and the wing is deteriorating, and I want one of them to take a heavier sanction to send a message. For each: the output, then what the other framework would have said about the same facts, and I want at least one of the three to come out in a way I personally will hate — better I find out now than in front of the governor. Finally tell me what the procedure can't do: where it'll still be inconsistent between panels, where it lets the regime's own effects get laundered into a risk number (boredom, crowding, the fact that dangerousness in here is partly manufactured in here), and which of its steps are judgment calls wearing a procedure's clothes.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Chair of a disciplinary panel in a medium-security prison.
      *   **Context:** 3 panelists (Chair, Deputy Governor, Wing Manager), no lawyers. 30 adjudications/month, 20 mins/case.
      *   **Problem:** Inconsistent sanctions between panels. Governor wants a standard decision procedure.
      *   **Philosophical Conflict:** Chair is a Free Will Skeptic (Caruso-style: public health/quarantine model, no basic desert, least restrictive means, proportionality as ceiling). Two other panelists are Compatibilists (Dennett-style: responsibility as social practice, censure as message, cultivating competence).
      *   **Task:**
          1.  Create a one-page laminated decision procedure (algorithm/flowchart style) usable by non-philosophers in 20 mins.
          2.  Ensure it accommodates both philosophical frameworks without requiring debate in the room.
          3.  Specify admissibility of considerations (block "desert" talk unless routed correctly).
          4.  Define tie-break rules for divergent outcomes.
          5.  Provide the reasoning behind the card.
          6.  Run the procedure on three specific cases (Hot water/Officer, Programme Refusal/Contagion, Group Lock-up/Exemplar).
          7.  Show working, verdicts, and philosophical divergence.
          8.  Include at least one outcome the Chair (Skeptic) will hate.
          9.  Critique the procedure (limitations, inconsistencies, structural biases).

  2.  **Deconstruct the Philosophical Conflict for Procedural Integration:**
      *   *Skeptic (Chair):* Focus on *risk* and *necessity*. Sanction = Quarantine/Intervention. Goal: Prevent future harm. Constraint: Least restrictive alternative. "Desert" is inadmissible.
      *   *Compatibilist (Panelists):* Focus on *accountability* and *norm reinforcement*. Sanction = Censure/Consequence. Goal: Maintain order/justice/agency. Constraint: Proportionality to blame. "Desert" is central but needs to be framed as "earned consequence."
      *   *Integration Strategy:* The procedure must use neutral language that maps to both.
          *   "Risk/Harm Prevention" satisfies the Skeptic.
          *   "Accountability/Rule Maintenance" satisfies the Compatibilist.
          *   *Crucial Pivot:* Proportionality. For the Skeptic, it's a *ceiling* (don't exceed what the act warrants). For the Compatibilist, it's a *target* (match the sanction to the blame).
          *   *Tie-Break:* If the Skeptic wants less (necessary minimum) and Compatibilist wants more (deserved censure), who wins? The prompt asks for a rule. Given the legal context (human rights, ECHR Article 5/6 implications even in internal adjudications), the "Least Restrictive Means" principle usually holds legal weight over "Moral Censure." However, prison order requires authority. A pragmatic tie-break: *Least restrictive means necessary to secure order.* This leans Skeptic on duration, but allows Compatibilist on the *fact* of sanction.
          *   *Wait, the prompt asks for one outcome the Chair will hate.* This implies the procedure must sometimes force the Skeptic to accept a harsher sanction than they believe is strictly "necessary" for risk, perhaps to maintain institutional legitimacy (the Compatibilist view). Or, conversely, the Compatibilists are forced to accept a lighter sanction. Let's aim for the former: The procedure mandates a sanction for "norm maintenance" that the Skeptic views as punitive beyond risk necessity.

  3.  **Drafting the Decision Procedure (The Card):**
      *   Needs to be step-by-step.
      *   Needs to filter out inadmissible reasoning (e.g., "He's a bad sort").
      *   Needs to define the "Ceiling."
      *   Needs to define the "Floor."
      *   Needs a divergence protocol.

      *Step 1: Fact & Culpability.* (Did he do it? Was it intentional/negligent?)
      *Step 2: Harm & Risk.* (What happened? What is the likelihood of recurrence?)
      *Step 3: The "Why" of Sanction.* (Prevention vs. Order).
      *Step 4: Proportionality Check.* (Ceiling).
      *Step 5: Mitigation/Alternatives.* (Least restrictive).
      *Step 6: Divergence.*

      *Refining Admissibility:* "Desert" language ("He deserves this") must be translated to "Norm Maintenance" or "Risk." If it can't be translated, it's barred.
      *Refining Tie-Break:* If Panelists disagree on *severity* based on philosophy: The "Least Restrictive Effective Sanction" rule usually favors the Skeptic. To make the Chair hate an outcome, I need to build in a "Systemic Integrity" clause that overrides pure risk assessment in specific contexts (like the Group Lock-up case).

  4.  **Developing the Reasoning Behind the Card:**
      *   Explain *why* the steps are ordered this way.
      *   Explain how it bridges the gap (neutral language).
      *   Explain the tie-break (Institutional Necessity vs. Individual Liberty).

  5.  **Running the Cases:**

      *   *Case 1 (Hot Water):* High harm potential, emotional trigger.
          *   Skeptic: Risk of violence is high. Need separation + treatment. Days added only if risk persists.
          *   Compatibilist: Assault on staff is top tier. Deserves max days + loss of privileges.
          *   Outcome: Likely heavy sanction. Chair might hate the "days added" if risk can be managed by segregation alone.
      *   *Case 2 (Programme Refusal):* No rule broken technically? Or "failure to comply"?
          *   Skeptic: No direct harm. Refusal isn't risk. Sanction unjustified unless specific rule broken.
          *   Compatibilist: Undermines regime. Contagious risk. Needs censure to maintain authority.
          *   Outcome: This is the best candidate for the Chair hating the result. Sanctioning thought/choice that isn't violent.
      *   *Case 3 (Group Lock-up):* Collective disobedience.
          *   Skeptic: Sanction one to stop the rest? That's instrumentalizing the individual (Kantian violation, also Skeptic issue).
          *   Compatibilist: Need an exemplar to restore order.
          *   Outcome: Procedural tie-break might force the "Exemplar" sanction.

      *Selection for "Chair Hates":* Case 2 is strong (punishing belief/influence). Case 3 is strong (instrumentalization). Let's make Case 2 the one where the procedure forces a sanction the Skeptic finds illegitimate (punishing non-harmful influence). Or Case 3 where the "Exemplar" logic is codified. Let's go with Case 2 for the "hate" factor because it punishes *persuasion* rather than *act*. Actually, Case 3 is more explicit about "sending a message," which is pure Compatibilist/Retributive logic. Let's make Case 3 the one where the procedure mandates an exemplary sanction.

      *Wait, re-reading the prompt:* "I want one of the three to come out in a way I personally will hate."
      *   Chair = Skeptic.
      *   Skeptic hates: Punishment for desert, instrumentalizing people (using one to scare others), punishing non-harmful choices.
      *   Let's make Case 2 (Programme Refusal) result in a sanction. The Skeptic sees this as punishing a valid choice (no harm done). The Compatibilist sees it as necessary for regime integrity. If the procedure prioritizes "Regime Integrity" as a valid "Harm Prevention" metric, the Skeptic loses.

  6.  **Refining the Procedure for Consistency:**
      *   To ensure the Chair hates one outcome, the "Tie-Break" or "Admissibility" rules must allow "Regime Stability" to count as "Harm Prevention."
      *   *Tie-Break Rule:* If Risk Assessment (Skeptic) < Norm Maintenance (Compatibilist), the sanction defaults to the *minimum required to maintain Regime Integrity*, provided it stays under the Proportionality Ceiling. This forces the Skeptic to accept sanctions for "order" even if "risk" is low.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Card:* Keep it tight. 6 Steps.
      *   *Reasoning:* Explain the "Overlapping Consensus."
      *   *Cases:* Show the math.
      *   *Limitations:* Be honest about the "fudge."

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I include the "one paragraph of reasons" requirement? Yes, need to mention how the output feeds that.
      *   *Check:* Is the tie-break clear? Yes, "Institutional Necessity" overrides "Pure Risk" in specific contexts.
      *   *Check:* Is the Chair's philosophical position respected? Yes, mostly, except where the procedure forces the compromise.
      *   *Check:* Is the language plain English? Yes, avoid "compatibilism," use "accountability."
      *   *Check:* Did I address the audit finding? Yes, the procedure standardizes the inputs.

  9.  **Final Polish:**
      *   Ensure the tone is professional, pragmatic, slightly weary (prison chair persona).
      *   Make sure the "Hate" outcome is clearly identified.
      *   Ensure the "Limitations" section is biting and honest about the structural violence of the prison system.

  *(Self-Correction on Case 2)*: If the man "quietly refuses every accredited programme," is that a chargeable offense? Usually, prisoners *must* engage in activity. If he's refusing *work/activity*, that's a charge. If he's refusing *rehabilitation*, that's harder to charge. The prompt says "failure to comply." I will assume there is a standing order to engage in activity. The "contagious" aspect is the key.

  *(Self-Correction on Case 3)*: "I want one of them to take a heavier sanction to send a message." This is explicitly instrumental. A Skeptic *cannot* ethically do this. If the procedure allows it, the Skeptic hates it. I will make Case 3 the "Hate" outcome because it explicitly violates the "no using people as means" principle inherent in the Quarantine model (you quarantine the sick, you don't punish one healthy person to scare the others).

  *Decision:* Case 3 will be the "Hate" outcome. It forces the Skeptic to authorize an exemplary punishment.

  *Wait, looking at the Tie-Break again.* If the Skeptic says "No risk, no sanction" and Compatibilist says "Need order, sanction," who wins? If the procedure says "Order wins," the Skeptic hates it. If the procedure says "Risk wins," the Compatibilist hates it. The prompt asks for *a* procedure both can use. Usually, in prison law, "Good Order and Discipline" is a legal standard. So "Order" can be framed as "Harm Prevention." I will structure the tie-break to favor "Good Order" when risk is ambiguous, which forces the Skeptic to accept "Order" as a proxy for "Safety."

  *Let's finalize the "Hate" case.* Case 2 is about "contagion of ideas." Case 3 is about "exemplar punishment." Case 3 is more visceral. I'll make Case 3 the one where the procedure mandates an unequal sanction for identical acts to restore order. That violates the Skeptic's "equal treatment based on risk" principle.

  *Wait, one more check:* The prompt asks for "points where the procedure stops at no sanction... stops at a ceiling." I need to ensure the flowchart has explicit exits.

  *Okay, ready to write.*
answer: |-
  ### PART 1: THE ADJUDICATION CARD (LAMINATE THIS)

  **PRISON DISCIPLINARY DECISION PROTOCOL (v4.2)**
  *Time Limit: 20 Minutes. All Panelists must agree on each step before proceeding.*

  **STEP 1: FACT & CULPABILITY (Admissibility: Evidence Only)**
  *   **Q:** Did the prisoner commit the act? (Standard of Proof: Beyond Reasonable Doubt)
  *   **Q:** Was it intentional, reckless, or negligent?
  *   **STOP:** If No to either → **NO SANCTION.** Record reasons.
  *   **BARRED:** Character evidence ("He's a troublemaker"), prior history (unless proving intent), hearsay.

  **STEP 2: HARM & RISK ASSESSMENT (Admissibility: Facts + Expert Opinion)**
  *   **Q:** What actual harm occurred? (Physical, Psychological, Institutional)
  *   **Q:** What is the specific risk of recurrence *by this individual*? (Low/Med/High)
  *   **Q:** Does the act undermine the *capacity of the prison to operate safely*? (Yes/No)
  *   **NOTE:** "Undermining capacity" includes contagious non-compliance that threatens staffing or security levels.

  **STEP 3: THE SANCTION CEILING (Admissibility: Gravity of Act)**
  *   **Q:** What is the maximum sanction proportionate to the *gravity of the offense*?
  *   **RULE:** This sets the absolute limit. You cannot exceed this even for risk management.
  *   **STOP:** If the act is minor → **CEILING = LOSS OF PRIVILEGES ONLY.** (No days added).

  **STEP 4: NECESSITY & ALTERNATIVES (Admissibility: Future Management)**
  *   **Q:** Can the risk be managed without punishment? (e.g., Move wing, change job, mediation).
  *   **Q:** If punishment is needed, what is the *least restrictive* option that secures safety/order?
  *   **STOP:** If non-punitive measures suffice → **NO SANCTION / REFERRAL ONLY.**

  **STEP 5: DIVERGENCE CHECK (The "Order vs. Liberty" Rule)**
  *   *If Panelists disagree on severity:*
      *   **Scenario A:** Skeptic says "No Risk," Compatibilist says "Bad for Order."
          *   **RULING:** If "Bad for Order" threatens staffing or regime function (Step 2, Q3), **SANCTION PERMITTED.**
      *   **Scenario B:** Skeptic says "Minimum Risk," Compatibilist says "Deserves More."
          *   **RULING:** **LEAST RESTRICTIVE MEANS WINS.** (Cap at Step 4 minimum).
      *   **Scenario C:** Chair wants "Exemplar" (send a message), Panel says "Individual Risk."
          *   **RULING:** **INDIVIDUAL RISK WINS.** (No exemplary punishment unless Step 2, Q3 is critical).
      *   **TIE-BREAK:** If still deadlocked, Chair casts vote *for the less restrictive sanction*, UNLESS the Governor has issued a specific directive on that offense type.

  **STEP 6: REASONS (Plain English)**
  *   Draft one paragraph. Must state: (1) What they did, (2) Why it was dangerous/disruptive, (3) Why this sanction is the minimum needed to stop it happening again/protect the regime.
  *   **BARRED:** "You deserved this," "To teach you a lesson," "Because you are bad."

  ***

  ### PART 2: REASONING BEHIND THE CARD

  This procedure is an **Overlapping Consensus**. It does not ask panelists to agree on *why* punishment exists (Desert vs. Quarantine), only on *how* to calculate it.

  1.  **Neutral Language:** We replace "Blame" with "Culpability" (Step 1) and "Desert" with "Proportionality Ceiling" (Step 3). The Compatibilist hears "accountability"; the Skeptic hears "limit on state power."
  2.  **The "Order" Loophole (Step 2, Q3):** This is the critical compromise. The Skeptic accepts sanctions only for harm/risk. The Compatibilist accepts sanctions for norm violation. By defining "threats to regime function" (e.g., mass non-compliance, staff refusal) as a *safety risk*, we allow the Compatibilist to sanction for order while the Skeptic can rationalize it as "preventing institutional collapse."
  3.  **The Tie-Break (Step 5):**
      *   *Scenario B* favors the Skeptic (Least Restrictive Means).
      *   *Scenario A* favors the Compatibilist (Order = Safety).
      *   *Scenario C* favors the Skeptic (No Exemplars).
      *   *Why?* Because human rights law generally forbids instrumentalizing one prisoner to control others (Scenario C), but allows sanctions for collective disruption (Scenario A).
  4.  **Admissibility Bars:** We explicitly ban "desert" language in the written reasons (Step 6). This forces the Compatibilist to translate "he earned this" into "this is required for safety." It prevents the Skeptic from being forced to sign a document stating a moral falsehood.

  ***

  ### PART 3: RUNNING THE CASES

  #### CASE 1: The Hot Water Incident
  **Facts:** 14 months clean, kitchen worker. Throws pan of hot water at officer during search (photos of daughter destroyed). Officer not badly hurt but refuses return to wing.
  **Panel View:** Half want maximum days.

  **Procedure Working:**
  *   **Step 1:** Act proven. Intentional. (Pass)
  *   **Step 2:** Harm = Potential serious injury + Loss of staff on wing. Risk = High (emotional trigger). Regime Capacity = Impacted (staffing).
  *   **Step 3:** Ceiling = Assault on staff is Tier 1. Max days allowable = 42 (example).
  *   **Step 4:** Alternatives? Move wing? Officer won't return. Risk of recurrence high if returned to kitchen/search context.
  *   **Step 5:** Divergence. Skeptic wants Treatment + Segregation. Compatibilist wants Max Days + Loss of Privileges.
      *   *Apply Rule 5B (Minimum Risk vs. Deserves More):* Least Restrictive Means wins *on duration*, but Step 2 Q3 (Regime Capacity) allows sanction.
  *   **Verdict:** 21 Days Added (Mid-range), Loss of Kitchen Job, Referral to Psych.
  *   **Reasons:** "You threw hot water at an officer. This created a high risk of serious injury and means that officer cannot work on this wing. We must add days and change your job to ensure safety and allow the wing to function."

  **Philosophical Divergence:**
  *   **Compatibilist:** Sees the 21 days as partial censure. Wanted 42. Accepts verdict as "merciful but just."
  *   **Skeptic (Chair):** Accepts the sanction as "Quarantine." The days are a cost of the staff shortage (Regime Capacity).
  *   **Outcome:** Both accept. No hate.

  #### CASE 2: The Programme Refusal
  **Facts:** No charges in 2 years. Quietly refuses all accredited programmes. Tells new arrivals "programmes are a con." Wing Manager wants to book for "Failure to Comply" (standing order to engage in activity). Real case: his refusal is contagious.

  **Procedure Working:**
  *   **Step 1:** Act proven (Refusal). Intentional. (Pass)
  *   **Step 2:** Harm = None direct. Risk = Low (he is quiet). Regime Capacity = **Yes** (Undermines rehabilitation targets, influences new arrivals).
  *   **Step 3:** Ceiling = Low (Non-violent non-compliance). Max = Loss of Privileges / 7 Days.
  *   **Step 4:** Alternatives? Warning issued previously? Yes.
  *   **Step 5:** Divergence. Skeptic says "No physical risk, no sanction." Compatibilist says "Contagious non-compliance threatens regime."
      *   *Apply Rule 5A (No Risk vs. Bad for Order):* If Order threatens regime function, Sanction Permitted.
  *   **Verdict:** Loss of Privileges (TV/Phone) for 14 days. No days added.
  *   **Reasons:** "You refused lawful orders to engage in activity and discouraged others from doing the same. This undermines the wing's rehabilitation plan and affects staffing resources. Privileges are removed to ensure compliance."

  **Philosophical Divergence:**
  *   **Compatibilist:** Sees this as maintaining the social contract of the prison. He broke the rules; he loses privileges.
  *   **Skeptic (Chair):** **HATES THIS.**
  *   **Why:** The "Harm" is abstract (regime targets). The "Risk" is ideological (contagion of belief). The Skeptic sees this as punishing thought and influence, not harm. However, Step 2 Q3 (Regime Capacity) forced the hand. The procedure laundered "ideological non-compliance" into "operational risk."
  *   **Outcome:** Chair must sign off on a sanction for "being a bad influence" despite believing no harm warranting state coercion occurred.

  #### CASE 3: The Group Lock-Up
  **Facts:** Three men separately refused to return to cells during lock-up. Wing deteriorating. Chair wants one to take heavier sanction to send a message.

  **Procedure Working:**
  *   **Step 1:** Act proven. Intentional. (Pass)
  *   **Step 2:** Harm = Delay in lock-up. Risk = Medium (collective disobedience). Regime Capacity = **Critical** (Wing deteriorating).
  *   **Step 3:** Ceiling = Disobedience. Max = 14 Days.
  *   **Step 4:** Alternatives? Warning? Already happened.
  *   **Step 5:** Divergence. Chair wants "Exemplar" (One gets 14, others get 2). Panel says "Identical acts, identical risk."
      *   *Apply Rule 5C (Exemplar vs. Individual Risk):* **INDIVIDUAL RISK WINS.**
  *   **Verdict:** All three receive 7 Days. (Uniform sanction).
  *   **Reasons:** "You refused to lock up. This delays the wing and risks safety. All three of you receive the same sanction because your actions were the same."

  **Philosophical Divergence:**
  *   **Compatibilist (Wing Manager):** Frustrated. Wanted to make an example to restore order. Accepts uniform sanction as "fair."
  *   **Skeptic (Chair):** Relieved. The procedure blocked the instrumentalization of one prisoner.
  *   **Outcome:** Chair wins this one. The procedure prevented the "send a message" sanction.

  ***

  ### PART 4: WHAT THE PROCEDURE CANNOT DO

  **1. The "Regime Capacity" Laundering**
  The procedure fails to distinguish between *safety* and *administrative convenience*. In Case 2, "undermining rehabilitation targets" was admitted as a "Risk to Regime Capacity." This allows the prison to punish prisoners for the prison's own failure to provide meaningful programmes. The Skeptic knows this is coercive, but the procedure codes it as "Safety." You cannot fix the structural violence of the institution with an adjudication card.

  **2. Inconsistency in "Risk" Calibration**
  Step 2 asks for a Risk Assessment (Low/Med/High). A panel of three ex-cops will rate "Disrespectful Tone" as High Risk. A panel with a social worker might rate it Low. The procedure standardizes the *questions*, not the *answers*. You will still get variance between panels because "Risk" is a value judgment wearing a fact's clothes.

  **3. The "Least Restrictive" Illusion**
  Step 4 asks for the "Least Restrictive Option." In a prison, the options are binary: Punish or Don't Punish. "Referral to treatment" is often a fantasy if waiting lists are six months long. The procedure assumes alternatives exist. When they don't, the "Least Restrictive" option defaults to "Minimum Punishment," which is still punishment.

  **4. The Chair's Complicity**
  In Case 2, the procedure forced you (the Skeptic) to authorize a sanction for "contagious belief." You signed the paper. The procedure protects you from *open* philosophical debate, but it does not protect your conscience. It makes you a bureaucrat of coercion rather than a judge of desert. You wanted a tool to stop inconsistency; you got a tool that systematizes the coercion you philosophically oppose.

  **5. The Tie-Break Limit**
  Rule 5C stops you from making an exemplar of one prisoner (Case 3). But if the Governor issues a "Specific Directive" (see Rule 5 Tie-Break), the procedure collapses. If the Governor says "Crack down on Lock-up Refusals," the Skeptic must either resign or sanction based on directive, not risk. The procedure is subordinate to the Governor's political needs.

  **Final Note:**
  This card will stop the audit findings. It will standardize the tariffs. It will not make the punishment just. It will just make it consistent.
