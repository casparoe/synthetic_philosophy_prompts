answer: |-
  The principle you are looking for is **Expected Utility Theory** combined with the **No-Trade Theorem** (Milgrom & Stokey, 1982).

  Your confusion stems from mixing three distinct categories of transactions that look like "bets" but function differently under information economics: **Speculation** (betting on information), **Hedging** (betting on risk transfer), and **Entertainment** (betting for fun).

  Here is the breakdown of what is settled theory, what is live debate, and which of your intuitions you must surrender to maintain consistency.

  ### 1. The Settled Theory (Where you are right)

  **A. The Bar Guy vs. The Insurer (Risk Aversion)**
  *   **The Principle:** A risk-averse agent should reject a "fair" bet (Expected Value = 0) because the utility loss from losing outweighs the utility gain from winning. Conversely, a risk-averse agent should accept an "unfair" bet (Expected Value < 0, i.e., paying a premium) if it reduces variance sufficiently.
  *   **The Verdict:** Your intuition here is mathematically sound.
      *   **Bar Guy:** Even money on a fair deck is $EV=0$. For a risk-averse person, $Utility < 0$. Refusing is rational.
      *   **Insurer:** You pay a premium ($EV < 0$) to eliminate catastrophic risk. For a risk-averse person, $Utility > 0$. Accepting is rational.
  *   **Resolution:** The difference is not about information; it is about **variance**. The bar bet adds variance; the insurance removes it.

  **B. The Broker (Adverse Selection)**
  *   **The Principle:** **Akerlof's Market for Lemons** and the **No-Trade Theorem**. If a counterparty has superior information and offers you a speculative bet, the mere fact that they are offering it signals that the bet is unfavorable to you.
  *   **The Verdict:** Hanging up is rational. If the tip were truly profitable, a rational actor would not share it with a competitor (you) unless they were offloading risk (see Insurer) or selling a product (commission). Since he framed it as a "tip," it is adverse selection.

  ### 2. The Live Argument (Where confusion is justified)

  **The Market Efficiency Paradox**
  *   **The Conflict:** You noted: *"People tell me the price already reflects everything... but if that were literally true nobody would bother doing research."*
  *   **The Status:** This is the **Grossman-Stiglitz Paradox (1980)**. It is a settled result that *perfect* market efficiency is impossible because it destroys the incentive to gather information. However, *how* inefficient the market must be to sustain research is still a live argument in financial economics. There is no consensus on the exact equilibrium level of inefficiency.
  *   **Your Confusion:** You are correctly identifying a genuine paradox in the literature. You do not need to resolve this to answer your other questions.

  ### 3. The Verdict You Must Surrender (The Brother & Coworkers)

  This is the hardest pill to swallow. Your intuition about the brother and coworkers conflicts with the **No-Trade Theorem** under the assumption of **Common Priors**.

  *   **The Theory:** If two agents are rational, risk-neutral, and share a "common prior" (they started with the same baseline probability estimates before seeing private data), they cannot agree to a speculative bet.
      *   If your brother offers a bet, he signals he thinks he has an edge.
      *   You know he is rational.
      *   Therefore, you should update your belief to match his.
      *   If you update to match him, the disagreement vanishes, and the bet disappears.
  *   **Your Intuition:** You take the bet happily and think it "sharpens estimates."
  *   **The Conflict:** To justify taking the bet, you must admit one of the following:
      1.  **Overconfidence:** You believe you are more rational/better informed than your brother, despite watching the same games. (Behavioral Econ says this is the most likely reality).
      2.  **Different Priors:** You and your brother fundamentally process probability differently (e.g., you are a Bayesian, he is a Frequentist). Standard theory views this as irrational; if you know his prior is different, you should argue about the prior, not bet.
      3.  **Entertainment Value:** You are paying a small premium (in EV) for the fun of the wager.
  *   **What to Give Up:** You must give up the idea that the bet is **epistemically healthy** *if you view your brother as a rational peer*. If he is a rational peer, the existence of the bet proves one of you is wrong, and the rational move is to update your belief, not take the money. The bet only makes sense if you assume **bounded rationality** (i.e., "We are both biased, and this bet will force us to find out who is less biased").

  ### 4. The Sister Case (Application of the Principle)

  **Case:** Sister is smarter, benevolent, offers to swap fund positions to help *both*.

  **Analysis:**
  1.  **Benevolence removes Adverse Selection:** Unlike the broker, she is not trying to dump a losing position on you. She is optimizing for *joint* utility.
  2.  **Superior Ability:** She is "smarter." In a speculative context, this usually means you should defer to her judgment entirely, not swap.
  3.  **The Swap:** A swap implies you currently hold Asset A and she holds Asset B, and she wants you to hold B while she holds A.
      *   **If this is Speculation:** (She thinks B will outperform A). If she is smarter, she should just tell you to buy B. A swap implies she values your current holding (A) more than you do. If she is smarter, why are you holding A in the first place?
      *   **If this is Risk Allocation:** (You are risk-averse, she is risk-seeking). Then the swap is **Insurance/Hedging**. This is rational.
      *   **If this is Comparative Advantage:** (You have tax losses in A, she has liquidity in B). This is rational optimization.

  **Verdict:**
  *   **Take the swap IF** it is based on risk profiles or tax/accounting constraints (Hedging/Optimization).
  *   **Refuse the swap IF** it is based purely on market prediction (Speculation). If she is smarter and benevolent, she should simply advise you on the optimal portfolio. Swapping positions suggests a disagreement on value; if she is smarter, her valuation should dominate. The "cleanest principle" suggests you should **let her allocate the total pool** rather than swapping discrete positions, unless there is a specific friction (like risk tolerance) preventing that.

  ### Summary of Principles

  | Case | Category | Principle | Your Verdict | Theory Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Bar Guy** | Speculation | Risk Aversion (Fair Bet) | Refuse | **Refuse** (Consistent) |
  | **Insurer** | Hedging | Risk Aversion (Insurance) | Accept | **Accept** (Consistent) |
  | **Broker** | Speculation | Adverse Selection | Refuse | **Refuse** (Consistent) |
  | **Brother** | Speculation | No-Trade Theorem | Accept | **Refuse** (Inconsistent*) |
  | **Coworkers** | Speculation | No-Trade Theorem | Approve | **Disapprove** (Inconsistent*) |
  | **Markets** | Aggregation | Grossman-Stiglitz | Conflicted | **Unsettled** (Paradox) |
  | **Sister** | Allocation | Fiduciary/Optimization | ? | **Defer** (unless risk-matching) |

  *\*Inconsistent with "Common Knowledge of Rationality." Consistent with "Behavioral Reality."*

  ### Final Recommendation

  To be consistent with the cleanest economic principles:
  1.  **Keep** your instincts on the Bar, Broker, and Insurer. They align with Expected Utility and Information Asymmetry.
  2.  **Modify** your view on the Brother/Coworkers. Acknowledge that taking those bets is an admission that **you or they are not fully rational**. Frame it as "We are betting to correct our biases," not "We are betting because we have valid disagreements."
  3.  **On the Sister:** Ask *why* the swap helps both. If the answer is "I think Fund B will beat Fund A," decline and ask her to manage the money. If the answer is "You hate volatility and I need growth," accept.

  The tension you feel isn't a personal quirk; it's the friction between **Normative Theory** (how rational agents *should* act) and **Descriptive Reality** (how humans *do* act). The Bar/Insurer/Broker cases work because they rely on risk and incentives. The Brother/Coworker cases fail because they rely on the assumption that rational people can "agree to disagree," which standard theory says is impossible.
