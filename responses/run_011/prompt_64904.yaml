  8.  **Final Polish:** Check for flow, clarity, and ensure all parts of the prompt are addressed. (The prompt asks for a specific structure: Conception of choice -> Strict vs. Comfortable -> Preference level -> Tension analysis -> Rival procedure). I will follow this flow.

      *(Self-Correction on the "Film Canister" detail)*: The prompt mentions a specific real-world case (likely Nevada Assembly 2017). I should acknowledge the concrete nature of the example but focus on the theoretical implications.

      *(Refining the "Jury" distinction)*: Crucial point: A hung jury is a *protection* for the defendant. A tie election is a *failure* of the mechanism to produce a mandate. One protects liberty, the other fills a seat.

      *(Refining the "Admin Law" distinction)*: Admin law forbids arbitrariness because agencies wield delegated power. Election officials wielding a lottery are exercising a specific statutory exception, not general discretion.

