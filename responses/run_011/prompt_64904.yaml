prompt: |-
  Many US states and other electoral systems provide that a race ending in an exact tie may be settled by chance: officials place the candidates' names in a container and draw one, or flip a coin, and the loser is simply out. In one state legislative race a dead heat was resolved this way, with an election official pulling a film canister from a decorative bowl and thereby handing control of the chamber to one party. The same legal order, however, treats a hung jury as a breakdown rather than an occasion for a coin toss, and empowers courts to strike down administrative action precisely because it is arbitrary and capricious — because no reasoning connects the outcome to the facts.

  What conception of choice is built into settling an office by lot? Distinguish what the practice strictly commits us to from what it merely sits comfortably with: does the tie show that there is no fact of the matter about which candidate is better, or only that a settled outcome is worth more than a correct one? Is the drawing itself a choice made without preference, or does it push preference up a level — we do prefer deciding to deadlocking, and prefer an impartial mechanism to an interested official's fiat? Then say whether the jury and administrative-law cases really are in tension with it, and describe what electoral procedure would look like under the rival assumption that a tie always signals reasons not yet found rather than reasons exhausted.
reasoning: |-
  Here's a thinking process that leads to the essay response:

  1.  **Deconstruct the Prompt:**

      *   **Core Subject:** Settling electoral ties by lot (coin toss, drawing names).
      *   **Key Comparison:** Contrast this with hung juries (no verdict by chance) and administrative law (striking down arbitrary/capricious actions).
      *   **Questions to Answer:**
          1.  What conception of choice is built into settling an office by lot?
          2.  Distinguish strict commitment vs. comfortable fit: Does a tie mean "no fact of the matter" (indeterminacy) OR "settled outcome > correct outcome" (pragmatism)?
          3.  Is the drawing a choice without preference OR a preference pushed up a level (prefer deciding over deadlocking, prefer impartiality over fiat)?
          4.  Are the jury and administrative-law cases in tension with the electoral lot practice?
          5.  Describe an electoral procedure under the rival assumption (tie = reasons not yet found).

  2.  **Analyze the "Conception of Choice" in Electoral Lots:**

      *   *Surface level:* It looks like randomness. It looks like giving up on reason.
      *   *Deeper level:* It's a procedural mechanism to break a deadlock. It acknowledges equality (both candidates have equal claim) and necessity (the seat *must* be filled).
      *   *Choice:* It's a second-order choice. We choose the *method* of resolution, not the specific *outcome*.

  3.  **Address "Strict Commitment" vs. "Comfortable Fit":**

      *   *Strict Commitment:* The law *must* commit to the idea that the office must be filled and that when votes are equal, merit cannot be distinguished *by the voting mechanism*. It commits to procedural finality over substantive optimality in this specific edge case.
      *   *Comfortable Fit:* It fits with the idea that there is "no fact of the matter" regarding who is better *electorally*. However, it doesn't necessarily mean one candidate isn't objectively better at governing, just that the election didn't show it.
      *   *Preference:* Is it choice without preference? No. It's preference pushed up a level. We prefer *resolution* to *stasis*. We prefer *impartial chance* to *biased discretion*.

  4.  **Analyze the Tension (Jury & Administrative Law):**

      *   *Hung Jury:* A hung jury means the state failed to meet the burden of proof. Retrying or dismissing preserves the presumption of innocence. A coin toss would violate due process (liberty at stake vs. office at stake).
      *   *Administrative Law:* "Arbitrary and capricious" means decisions must be reasoned. A lottery is unreasoned.
      *   *Tension:* Is there tension? Yes, on the surface (reason vs. chance). But is it fatal? No. The contexts differ.
          *   *Election:* Rights are equal (candidates), interest is public continuity.
          *   *Criminal:* Liberty vs. State power. Burden of proof is on the state.
          *   *Admin Law:* Agency expertise must justify power.
      *   *Resolution:* The tension is resolved by distinguishing the *stakes* and the *nature of the right*. Voting is an aggregate expression of will; if the will is split, the "will" is undefined. Justice (jury) requires truth-finding. Administration requires rationality.

  5.  **Develop the "Rival Assumption" (Tie = Reasons Not Yet Found):**

      *   *Premise:* A tie isn't an end; it's a signal to look harder.
      *   *Procedure:* No coin tosses.
      *   *Mechanisms:*
          *   Mandatory run-offs (until someone wins).
          *   Expanding the electorate (re-vote).
          *   Deliberative bodies deciding (House decides President).
          *   Waiting for more data (provisional ballots, recounts ad infinitum).
      *   *Implication:* Paralysis is acceptable; error (picking the "wrong" winner by chance) is unacceptable. Priority is correctness over finality.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Define the practice (sortition in elections). State the thesis: The lottery is a second-order rational choice prioritizing continuity and equality over substantive distinction.
      *   *Section 1: Conception of Choice.* Distinguish between first-order preference (Candidate A vs. B) and second-order preference (Resolution vs. Deadlock). Argue it's the latter.
      *   *Section 2: Fact of the Matter vs. Pragmatism.* Does a tie mean they are equal? No, it means the *electorate* couldn't distinguish. The strict commitment is to *finality*, not metaphysical equality.
      *   *Section 3: The Tension (Jury/Admin).* Explain why jury/admin law rejects chance. Liberty requires proof; Power requires reason. Elections require continuity. The tension is apparent, not logical, because the goods protected differ.
      *   *Section 4: The Rival Assumption.* If a tie means "keep looking," what happens? Endless recounts, run-offs, or deliberative selection. This prioritizes epistemic correctness over procedural efficiency.
      *   *Conclusion:* Summarize. The lottery isn't irrational; it's a rational acknowledgment of the limits of voting to resolve perfect equality.

  7.  **Refining the Argument (Self-Correction during drafting):**

      *   *Check:* Did I answer the specific question about "choice without preference"?
      *   *Correction:* Make sure to explicitly state that it is *not* a choice without preference. It is a preference for the *system's survival*.
      *   *Check:* Did I distinguish strict commitment from comfortable fit?
      *   *Correction:* Use those exact terms or clearly delineate them. Strict = Finality/Impartiality. Comfortable = Indeterminacy of merit.
      *   *Check:* Is the tone appropriate?
