answer: |-
  The practice of settling an electoral tie by lot—sortition—embodies a specific, layered conception of choice that prioritizes procedural finality and impartiality over substantive differentiation. To understand what this commits us to, we must distinguish between the first-order choice of the voters and the second-order choice of the legal system.

  **The Conception of Choice: Preference Pushed Up a Level**

  Strictly speaking, settling an office by lot does not commit us to the idea that the drawing itself is a "choice made without preference." That would imply a metaphysical indifference to the outcome. Rather, the practice pushes preference up a level. The electorate has expressed a preference that is perfectly balanced; the system, therefore, expresses a higher-order preference for *resolution* over *deadlock*.

  The strict commitment of the lottery is not that the candidates are identical in merit, nor that the voters are indifferent. The strict commitment is to two principles: **continuity** (the office must be filled to ensure governance) and **equality** (when the metric of choice yields a null result, neither candidate has a superior claim based on that metric).

  What merely "sits comfortably" with the practice is the notion that there is "no fact of the matter" about which candidate is better. While the election results suggest an inability to distinguish between the candidates *electorally*, the lottery does not assert that one would not govern better than the other. It asserts only that the election mechanism has exhausted its capacity to identify a superior claim. Therefore, the tie signals not that reasons are exhausted in an absolute sense, but that *electoral* reasons are exhausted. The value of a settled outcome is deemed higher than the risk of selecting the marginally "correct" candidate by arbitrary means, because the alternative—prolonged vacancy or partisan adjudication—poses a greater threat to the system.

  **Tension with Jury and Administrative Law**

  The treatment of hung juries and administrative arbitrariness appears to be in tension with the electoral lottery, but the tension is resolved by examining the distinct goods protected in each domain.

  In criminal law, a hung jury is treated as a breakdown because the stakes involve individual liberty against state power. The "beyond a reasonable doubt" standard is a protective asymmetry; the state bears the burden of proof. To resolve a hung jury by coin toss would invert this protection, allowing the state to deprive liberty without establishing a reasoned consensus of guilt. Here, the "fact of the matter" (guilt or innocence) is paramount, and uncertainty benefits the accused. In an election, the stakes are public office, not liberty. The asymmetry is reversed: the public interest demands a functioning government. Uncertainty here benefits no one; it creates paralysis.

  Similarly, administrative law strikes down "arbitrary and capricious" action because agencies exercise delegated power that must be tethered to expertise and statutory purpose. An agency decision without reasoning is an abuse of power. However, an election official conducting a lottery is not exercising discretion; they are executing a ministerial act mandated by statute for a specific edge case. The "arbitrariness" is the feature, not the bug, designed to prevent the *official's* bias from influencing the outcome.

  Thus, there is no logical contradiction. Administrative law and criminal procedure prioritize *epistemic correctness* (finding the truth/reason) because the cost of error is high (wrongful imprisonment/unlawful regulation). Electoral tie-breaking prioritizes *procedural finality* because the cost of error (one equally supported candidate winning over another) is low compared to the cost of stasis.

  **The Rival Assumption: A Procedure for "Reasons Not Yet Found"**

  If we operated under the rival assumption that a tie always signals "reasons not yet found" rather than "reasons exhausted," electoral procedure would undergo a radical transformation prioritizing epistemic correctness over efficiency. Under this view, a tie is an error state indicating insufficient data, not a terminal equilibrium.

  Such a system would forbid chance entirely. Instead, it would mandate:
  1.  **Iterative Voting:** Mandatory run-offs would continue indefinitely until a majority is achieved, potentially leading to voter fatigue or attrition of the candidate pool.
  2.  **Expanded Electorates:** A tie in a district might trigger a vote by a larger body (e.g., the county or state) to dilute the statistical probability of a tie, assuming a larger sample size yields a "truer" preference.
  3.  **Deliberative Resolution:** Rather than a lottery, a tie would trigger a deliberative body (like a legislative committee or a citizen assembly) tasked with interviewing candidates and selecting a winner based on merit, effectively converting the election from an aggregate vote to a judgment of fitness.
  4.  **Vacancy:** If no distinction can be found, the seat might remain vacant until the next cycle, accepting governance paralysis as the price of avoiding arbitrariness.

  In this rival system, the "will of the people" is treated as a singular, discoverable truth that must be unearthed, rather than a mathematical count that might occasionally balance. The current lottery system, by contrast, acknowledges that democracy is a mechanism for decision, not just truth-finding, and that when the mechanism stalls, the continuity of the decision-making body is the highest good.
