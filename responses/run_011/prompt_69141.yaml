answer: |-
  1. Liability makes harming someone not a wrong against them at all, whereas all-things-considered balancing admits the harm is a rights-violation that is merely overridden by sufficient good consequences. This distinction determines whether the victim is owed compensation and whether the agent has infringed a moral constraint.

  2. Conscripts and those holding reasonable false beliefs lack culpability because they are not blameworthy, yet they retain responsibility for the unjust threat they objectively pose. Revisionists ground liability in this responsibility for the threat rather than blameworthiness to explain why such combatants may be killed without being wronged, even though they are not morally vicious.

  3. A lesser-evil justification is inherently asymmetrical because only the side fighting for the just cause possesses the sufficient good consequences required to override the rights of non-liable combatants. Consequently, the unjust side cannot claim an equal liberty to kill, as their actions lack the overriding good necessary to permit rights-violations.

  4. Conventions can establish epistemic rules of thumb that grant mutual immunity for pragmatic reasons, but they cannot alter the underlying moral reality that unjust combatants are liable while just combatants are not. Therefore, conventions can regulate behavior but cannot genuinely restore moral equality where fundamental responsibility for unjust threats differs.

  5. This disagreement is fully visible as a conflict between minimizing constraint-violations versus minimizing total badness, where liability alters the status of the constraint itself. The revisionist argues that liable targets do not trigger the side constraint, whereas the consequentialist repair treats the constraint as fixed but overrideable by sufficient expected value.
