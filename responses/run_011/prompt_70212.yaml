answer: |-
  1. Can parties holding incommensurable values achieve mutual gain through compromise without collapsing their disagreement into a common metric? A determinate answer requires demonstrating whether such gains are logically possible within strictly ordinal preference structures applied to disputes over sacred sites versus housing needs.

  2. Standard ethical accounts focus on the permission to compromise rather than potential benefits, while economic models assume transferable utility that dissolves the very incommensurability at issue. Neither engages the possibility of gain where no common measure exists to weigh the conflicting values.

  3. I will model these negotiations using ordinal preference rankings that explicitly forbid interpersonal utility comparisons or side payments. This method isolates the logical structure of agreement without presupposing a common currency of value that would beg the question against incommensurability.

  4. Success entails proving an agreement improves both parties' ordinal rankings without invoking shared higher-order values like fairness or conflict avoidance. Failure occurs if the definition becomes vacuous, allowing any settlement to be described as beneficial merely by positing ex-post preference changes to fit the outcome.

  5. Twelve months suffices to formalize the logical conditions for non-metric gains using this single anchor case and its specific constraints. Without strict limits, the project balloons into a general theory of moral exchange requiring empirical validation of agents' actual preference structures across diverse contexts.
