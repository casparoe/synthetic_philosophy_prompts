answer: |-
  The diagnosis is straightforward: **Premise (6) is false, and the transition to (7) is a category error.** Your instinct was correct.

  Here is why the argument looked innocent, where it breaks, and how your architect can salvage her position without surrendering the core claims (2) and (4).

  ### The Diagnosis

  **The Flaw:** Premise (6) claims that the degree of legitimacy is fixed by two things: *equality of chance* and *how much turns upon the office* (power). It implies a multiplicative relationship: as power increases, legitimacy increases, provided equality is maintained.

  **Why it looked innocent:** It mimics a true democratic principle: "Greater power requires greater justification." We intuitively feel that a body with more power needs *more* legitimacy to wield it. The friend's argument smuggles in a perversion of this: it suggests that if you *have* the legitimacy (via the lot), you are *rewarded* with the right to more power, and that concentrating that power actually *maximizes* the legitimacy score.

  **The Error:** Legitimacy is not a scalar quantity that grows with the magnitude of authority. It is a **threshold condition** regarding the *right* to rule, not the *amount* of rule.
  *   **Input Legitimacy:** How the rulers are chosen (the Lot).
  *   **Output Legitimacy:** What the rulers do (tyranny vs. law).

  A random despot has high *Input Legitimacy* (everyone has an equal chance to be the despot) but zero *Output Legitimacy* (the system offers no protection against the whims of one person). Premise (6) ignores Output Legitimacy entirely. It treats the state as a machine where the only moral variable is who turns the crank, ignoring what the machine produces.

  **The Slide (6 to 7):** Even if we accept (6), step (7) contains a mathematical sleight of hand.
  *   In the **Despot** model, my chance of ruling is $1/N$.
  *   In the **Assembly** model, my chance of ruling is $300/N$.
  *   Both are "exactly equal" across citizens (satisfying the equality clause of 1), but the Assembly offers a **300 times higher probability** of participation for any given individual. If legitimacy is partly a function of the *value* of the antecedent chance, the Assembly is superior to the Despot. The friend's argument treats "equality of distribution" as the only metric, ignoring the "magnitude of opportunity."

  ### The Repair

  To make the argument valid without making your architect a monster, you must replace Premise (6) with a **constraint principle**.

  **Revised (6):** *Legitimacy is a compound of equal antecedent chance (access) and structural constraints against domination (safety). As the power of the office increases, the requirement for safety constraints increases faster than the satisfaction gained from equal access.*

  **Revised (7):** *Therefore, a single citizen with absolute power fails the safety constraint, rendering the equality of access moot. The maximum legitimate power is one that can be safely distributed among many minds without risking tyranny.*

  **Can she live with this?** Yes. It makes her a realist, not a monster. She admits that the Lot is necessary but not sufficient. It solves the *class* problem (2), but it does not solve the *tyranny* problem. The 300-member limit is not a "grudging compromise with injustice" (as the friend claims in 8); it is a **necessary safety valve**.

  ### Consequences for the Novel's Logic

  **1. The Case for Sortition (Claims 2 & 4)**
  These stand intact. You do not need to rebuild the case on grounds other than equal chance.
  *   **Claim (2)** remains true: Elections filter for a professional class.
  *   **Claim (4)** remains true: Sortition is indifferent to wealth and ambition.
  *   **The Adjustment:** Sortition is the *best mechanism for selection*, but it is not a *magic wand for governance*. It selects the *who*, but the *how* (structure) determines the legitimacy of the outcome. Your architect can argue that the Lot is the only way to break the professional class, but she must concede that the Lot alone does not justify absolute power.

  **2. The Fate of Premise (3) and the Lifetime Disqualification**
  If the Lot is the right device, does the lifetime ban earn its place? **Yes, absolutely.** In fact, under the repaired argument, it becomes critical.
  *   **The Friend's View:** The ban is a restriction on the citizen's right to serve again.
  *   **The Architect's View:** The ban is the firewall that keeps the Lot pure.
  *   **Why:** If members can serve again, or move to other offices, a "class of lottery professionals" will emerge. They will learn how to manipulate the stratification, how to grandstand during their term to build a brand, and how to network with the permanent staff.
  *   **Narrative Function:** The lifetime disqualification ensures that the 300 members remain *amateurs* in the true sense: people who serve because it is a duty, not a career step. It prevents the "Input Legitimacy" from decaying over time. Without the ban, the system eventually reverts to the elected model's flaws (careerism), just with a different entry gate.

  ### How the Architect Wins the Scene

  She does not need to defend the Random Despot. She needs to expose the friend's envelope as a category error. Her argument to the committee should run like this:

  1.  **Concede the Principle:** "My friend is right that equal chance is the bedrock of legitimacy. A state that treats citizens as inferiors in access deserves no allegiance."
  2.  **Reject the Conclusion:** "But legitimacy is not a fuel that burns brighter when you pour more power into it. It is a license that expires when the power becomes dangerous."
  3.  **The Safety Argument:** "A single draw gives us equality, but it gives us no safety. It trades a professional oligarchy for a random tyranny. The 300 are not a compromise with injustice; they are a check against the violence of the one."
  4.  **The Careerist Check:** "And the lifetime ban? That is not to punish the member. It is to protect the room. If this seat leads to another, it becomes a ladder. If it is a dead end, it remains a duty. We do not want people who want to be here. We want people who would rather be elsewhere."

  **Summary:** Reject (6). Legitimacy does not scale with power; the *burden of justification* scales with power. The Assembly is more legitimate than the Despot because it balances equal access with deliberative safety. The lifetime ban is essential to prevent the re-emergence of the citizen-politician class. Your architect remains sympathetic because she values both equality *and* safety, whereas the friend's argument values only the mathematical purity of the draw.
