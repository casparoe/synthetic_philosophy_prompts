answer: |-
  # The Boundaries of Inquiry: A Case Analysis of the Fomenko Episode

  The career of Anatoly Fomenko's 'New Chronology' offers a singular stress test for the philosophy of science. It is not merely a case of incorrect history, but a structured challenge to the mechanisms by which academic communities distinguish legitimate inquiry from pseudohistory. To analyse this episode effectively, we must move beyond the simple verdict that Fomenko is wrong. Instead, we must examine *how* the programme sustains itself against contradiction. The following analysis employs a specific set of demarcation criteria, applies them to the Fomenko episode and two control cases, and reflects on what this reveals about the function of demarcation itself.

  ## Criteria for Demarcation

  To avoid a circular argument where we define pseudoscience as 'whatever Fomenko is not', we must establish criteria derived from the history of philosophical analysis. Five specific criteria bear on this case.

  First, **falsifiability** in the Popperian sense is necessary but insufficient. A theory must expose itself to risk, but the crucial metric is what occurs when the risk materialises. Second, related to this, is the use of **ad hoc auxiliary hypotheses**. When a prediction fails, does the proponent modify the core theory, or do they add protective belts that explain away the failure without increasing empirical content? Third is the **conspiracy move**. When contrary evidence is overwhelming, is it reinterpreted as evidence of a coordinated cover-up by established institutions? Fourth is the **over-generation worry**. Does the method find its signature pattern in any sufficiently large corpus, regardless of the underlying reality? If a statistical method finds 'dynastic parallelisms' in random data, it is a tool of confirmation bias, not discovery. Finally, we utilise **Lakatos's distinction between progressive and degenerating problem-shifts**. A progressive programme predicts novel facts; a degenerating programme merely accommodates known facts through increasingly complex patching.

  ## The Fomenko Episode: Epistemic Failure and Sociological Shift

  Applying these criteria to the record provided reveals a trajectory from contested science to entrenched pseudohistory. The awkward point, as noted, is that Fomenko's central claims are eminently testable. He posits specific astronomical configurations and material sequences. These have been tested against radiocarbon dating, dendrochronology, and stratigraphy, and they have failed. If falsifiability alone demarcated science, Fomenko's work would qualify as 'false science' rather than pseudoscience. The distinction lies in the response to failure.

  When the astronomical datings contradicted the New Chronology, Fomenko did not abandon the core thesis. Instead, he invoked the conspiracy move: the evidence itself is part of the falsification assembled by Scaliger, the Vatican, and the Romanovs. This immunises the theory against refutation. Any evidence against the New Chronology becomes evidence *for* the conspiracy, rendering the programme unfalsifiable in practice, if not in principle. Furthermore, the statistical methods exhibit the over-generation worry. By scanning chronicles for word-frequency similarities or 'parallelisms' in king-lists, the method is liable to find patterns in noise. Without independent constraints, these statistical correlations are artefacts of the method, not discoveries of history.

  The 1980s juncture presents a complex boundary case. Fomenko published in peer-reviewed Soviet journals. Was this pseudohistory? Epistemically, yes. The methods employed—statistical parallelisms without historical context—were flawed from the outset, satisfying the over-generation criterion. However, sociologically, the programme occupied a legitimate space until Fomenko abandoned the corrective institutions. By moving to mass-market books in the 1990s, he bypassed the peer review that had previously contained his claims. This shift suggests that demarcation is not purely epistemic; it is also institutional. When a proponent leaves the community of critique to address a public lacking the technical means to evaluate the evidence, the activity shifts from science to persuasion. The historians' refusal to engage was likely a strategic application of this sociological boundary: to debate Fomenko on television or in popular books would be to grant legitimacy to a framework that had already failed the epistemic criteria within the specialist sphere.

  ## Control Cases: Hardouin and Newton

  To ensure our criteria do not merely ratify current consensus, we must test them against Jean Hardouin and Isaac Newton. All three men—Fomenko, Hardouin, and Newton—shared the premise that the received timeline was a construction requiring correction. Yet, Newton is regarded as a legitimate inquirer, Hardouin as a monomaniacal forger-hunter, and Fomenko as a pseudoscientist.

  Hardouin's case aligns closely with Fomenko's regarding the conspiracy move. Hardouin argued that most classical texts were forged by Benedictine monks. When pressed on the motive, he deferred to a letter to be published after his death—a letter his executors could not find. This is a classic degenerating problem-shift. The core claim was protected by an auxiliary hypothesis (the hidden letter) that was never produced. Like Fomenko, Hardouin reinterpreted the absence of evidence for his conspiracy as evidence of the conspiracy's depth. His programme was degenerating; it consumed energy explaining why the world looked nothing like his theory predicted, without producing novel, verified insights.

  Newton, conversely, presents a harder challenge. His *Chronology of Ancient Kingdoms Amended* shortened Greek history based on astronomical arguments (the precession of the equinoxes) and poetic testimony. Like Fomenko, he rejected the received Scaligerian timeline. Why is Newton not a pseudoscientist? The difference lies in the integration with a broader progressive programme and the absence of the conspiracy move. Newton's chronological work was an extension of his natural philosophy. He applied the same mathematical rigor to history that he did to physics. Crucially, when his chronological claims were challenged, he did not invoke a global conspiracy of historians to suppress him. He argued within the accepted evidentiary norms of his time. Furthermore, while his specific chronological conclusions were ultimately incorrect, his programme was progressive in the Lakatosian sense: it offered a new method (astronomical dating) that yielded novel predictions, even if those predictions were later refined or discarded by successors. Newton's inquiry was open to correction; Fomenko's and Hardouin's were closed.

  The criteria separate them without presupposing the verdict. Newton engaged with counter-evidence within the rules of the game; Hardouin and Fomenko changed the rules when the game went against them. Newton's methods were constrained by independent physics; Fomenko's statistics were self-referential. Thus, the demarcation holds: it is not the radicalism of the claim that defines pseudohistory, but the immunization against refutation.

  ## The Function of Demarcation

  What, then, does the Fomenko episode reveal about demarcation itself? Firstly, the label 'pseudohistory' did genuine epistemic work by identifying a degenerating problem-shift, but it primarily performed social work. It signalled to the public and the academy that the normal rules of evidence suspension were in effect. The historians' refusal to engage was vindicated epistemically—debating conspiracy theories on their own terms validates the conspiracy—but it carried a social cost. By remaining silent, specialists ceded the public square to celebrity endorsers like Kasparov. This highlights a limitation of demarcation criteria: they address the integrity of inquiry, not the sociology of trust.

  The public appeal of the New Chronology stems from reasons no demarcation criterion addresses: institutional collapse, distrust of official narratives, and the prestige of mathematics. In the post-Soviet context, the 'official' history was associated with a discredited regime. Fomenko, a mathematician, offered a narrative of liberation from foreign (Western) chronological imposition. Demarcation criteria can explain why Fomenko is wrong, but they cannot explain why millions find him compelling. To the public, the 'conspiracy move' is not a logical fallacy but a plausible explanation for their own marginalisation.

  Ultimately, this episode suggests that demarcation is not a static line but a dynamic practice. It relies on the maintenance of institutions (journals, peer review) that enforce the criteria of falsifiability and progress. When those institutions are bypassed, as Fomenko did in the 1990s, the epistemic criteria alone are insufficient to stop the spread of pseudohistory. The distinction between Newton and Fomenko lies not in the radicalism of their revisions, but in their willingness to submit to the verdict of evidence without recourse to protective conspiracies. The lesson for the seminar is that legitimate inquiry is defined not by the certainty of its conclusions, but by the vulnerability of its methods. Fomenko's programme failed not because it challenged the past, but because it refused to be challenged by it.
