  1. **What the three complaints are really about**
  Your breakdown is correct, but it needs sharper definitions to stop the bleeding. You are conflating **Authorship** (who made it), **Instantiation** (which copy of the work this is), and **Provenance** (the history of this specific object).

  1.  **Authorship:** Is the creator who the seller says? This is the traditional forgery question.
  2.  **Instantiation:** Is this object the specific physical instance the market values? A bronze cast in 1950 is a different *object* than one cast in 1890, even if both are the same *work* by the artist. Buyers feel cheated when they buy a "vintage" object and get a "revival" object.
  3.  **Provenance:** Is the story true? A real object with a fake story is still a misrepresentation.

  Current failures happen because reviewers treat a 1950s cast (Instantiation issue) as a fake (Authorship issue). They are not. It is by the artist (via the mold) but not of the artist's lifetime. Separating these stops reviewers from arguing about "real vs. fake" and forces them to ask "Real what?" This distinction protects you legally: you can sell a later cast honestly, but you cannot sell it as a lifetime cast.

  2. **The wording ladder**
  The Ladder must prioritize legal defensibility over seller preference. Reviewers must default to the lower rung if evidence is ambiguous.

  **Tier 1: Definitive.** "By [Artist]." Use only if there is a signature, documented provenance, or consensus among experts. For multiples, add "Lifetime" if verifiable.
  **Tier 2: Qualified.** "Attributed to [Artist]." Use when style matches but proof is thin. "Studio of [Artist]" means made by assistants under supervision. "Circle of" means contemporary peer.
  **Tier 3: Derivative.** "After [Artist]" means a copy made later by someone else. "Style of" means same genre, different era.
  **Tier 4: Temporal Qualifiers.** Mandatory for multiples. "Posthumous cast," "Later print," "Reissue."

  **Banned Words:** "Original" (unless singular unique work), "Guaranteed," "Authentic" (without qualification). "Original" implies both Authorship and Instantiation; if either is weak, ban it.

  **Test:** Can you point to a pixel in the photo or a document in the listing that proves the claim? If no, drop a rung. If the seller claims "Lifetime" but provides no date stamps or provenance, default to "Posthumous/Later." This shifts the burden of proof to the seller, protecting the platform from chargebacks based on misleading titles.

  3. **The questions, in order**
  1.  **The Goodman Test (Unique vs. Multiple):** Is there a "recipe" (mold, plate, negative, digital file)? If yes, it's a multiple (Allographic). If no (painting, unique sculpture), it's unique (Autographic). *Why:* For uniques, any copy is a forgery. For multiples, later copies are genuine instances of the work but may be less valuable objects.
  2.  **The Authorship Check:** Does the visual evidence (signature, style) match the claim? If unsigned, is there documentation? If no docs and unsigned, downgrade to "Attributed" or reject.
  3.  **The Instantiation Check (For Multiples):** Does the listing claim "Lifetime"? Look for date stamps, paper type, foundry marks. If the artist died in 1890 and the foundry mark changed in 1920, it is not Lifetime. If unsure, default to "Later."
  4.  **The Narrative Check:** Does the story match the object? Seller says "Found in attic," object has gallery labels from 1990. Flag as inconsistent.

  **Decision:** If Step 1 says Multiple, Step 3 is critical. If Step 1 says Unique, Step 2 is critical. If any step fails, downgrade the Wording Ladder. Do not guess. Reviewers often stumble on the word "notation." Tell them: "Is there a way to make another one exactly like this using a guide?" If yes (print, cast), it's a multiple. If no (painting), it's unique. This determines whether "later copy" means "forgery" (unique) or "reissue" (multiple).

  4. **Stop and hand it to a human**
  Escalate when the risk exceeds the reviewer's pay grade.

  **Money:** Any listing over $2,500 requires a second reviewer. Over $15,000 comes to you. This is non-negotiable.
  **Ambiguity:** If the reviewer cannot pass the "Pixel Test" (point to evidence in photos) for a Tier 1 claim, but the seller insists, escalate. Do not argue with top sellers yourself; let the procedure be the bad guy.
  **Conflict:** If a seller threatens to leave (like the bronze seller), escalate to you. Do not let reviewers negotiate policy.
  **Value vs. Fact:** Reviewers decide facts (is there a signature?). They do not decide value (is this worth $5k?). If a listing hinges on a valuation claim ("Investment grade"), escalate.

  **The Handoff:** When escalating, the reviewer must note exactly which rung of the Ladder failed and what evidence is missing. This creates an audit trail for legal defense. If a listing is disputed in court, you need to show that the reviewer followed the protocol and flagged the ambiguity, rather than making a negligent guess.

  5. **Three listings, run through it**
  (a) **Bronze:** Artist died 1890s, cast 1950s.
  **Output:** Title: "Posthumous Bronze Cast after [Artist]." Description must state "Cast c. 1950s from original mold."
  **Justification:** Fails Instantiation Check. Artist dead at time of casting. Goodman says it's the same work, but market requires temporal distinction.
  **Result:** Seller unhappy. Title downgraded from "Original." This is the correct legal stance; calling it "Original" invites fraud claims.

  (b) **Photograph:** 1930s negative, 1990s print.
  **Output:** Title: "Vintage Negative, Later Print by [Photographer] Estate."
  **Justification:** Fails Instantiation Check. Paper and lack of signature indicate later production. Not a "Vintage Print."
  **Result:** Accurate. Collectors distinguish vintage vs. later prints. This prevents buyers expecting a 1930s object from receiving a 1990s object.

  (c) **Painting:** Signed, heavy inpainting.
  **Output:** Title: "Oil on Canvas by [Artist]." Description: "Condition report notes significant later inpainting and replaced stretcher."
  **Justification:** Passes Authorship (signed), fails Condition transparency. Must disclose restoration to avoid "as is" disputes.
  **Result:** Listing stays, but disclosure mandatory. Protects against chargebacks regarding condition.

  6. **Where Goodman breaks**
  Goodman's line blurs with design and digital.
  **Furniture:** A chair is autographic (unique history) but also industrial (multiple). A 2020 Eames chair is "genuine" but not "vintage." Goodman doesn't help here; use "Manufacture Date" vs. "Design Date."
  **Prints/Casts:** Goodman says posthumous prints are genuine. The market disagrees. The procedure must side with the market for legal safety. Treat "Lifetime" as a sub-category of authenticity.
  **Digital:** Purely allographic. The file is the work. Scarcity is artificial (NFTs). Here, authenticity is purely about the token, not the image.
  **Fix:** For design and digital, ignore Goodman. Focus on **Manufacture Date** and **Authorization**. Is it licensed? If yes, it's genuine. If no, it's a copy. Don't use "Original" for licensed reissues; use "Official Reissue." This clarifies that the object is authorized but not historic.

  7. **What this procedure can't do**
  This procedure will not stop skilled forgers with fake papers. It costs you listings from sellers who refuse to downgrade claims (like the bronze seller). You will lose revenue short-term to gain legal safety long-term. It requires you to enforce the rules uniformly; if you make exceptions for top sellers, the procedure collapses. To work properly, you need to shift the burden of proof to sellers for high-value items, requiring them to upload documentation before listing, not after dispute.
