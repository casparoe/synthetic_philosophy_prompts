answer: |-
  1. **Agreed Claims**
  We, the undersigned, affirm the following common ground to facilitate policy decisions:
  *   **Biological Facts:** Organisms possess parts organized in characteristic ways; traits are distributed statistically within populations; some states reliably shorten life or frustrate goals.
  *   **Clinical Reality:** Clinicians must act under uncertainty; patients experience states as harmful or benign regardless of biological classification.
  *   **Value Claims:** When the Naturalist claims "disease is value-free," she means the *classification* relies solely on biological dysfunction, not that treatment decisions ignore values. When the Normativist claims "disease is value-laden," he means the *concept* logically entails harm or goal-frustration, not that biology is irrelevant.
  *   **Division of Labor:** We distinguish "disease" (theoretical category), "illness" (patient experience), and "sickness" (social role), though we disagree on which facts fix the theoretical category.
  *   **Rejection of Hybrid:** We explicitly reject a "harmful dysfunction" compromise. The Naturalist holds that adding harm concedes the central point that disease is a biological kind. The Normativist holds that adding dysfunction concedes the central point that disease is essentially normative. Neither accepts a definition that splits the constitutive ground.

  2. **Disagreements Table**

  | Topic | Naturalist Formulation | Normativist Formulation | Judgment |
  | :--- | :--- | :--- | :--- |
  | **Constitution of Disease** | Disease is statistically subnormal functional performance relative to a reference class, independent of harm. | Disease is a state limiting the organism's capacity to institute norms or achieve vital goals, independent of statistics. | Substantive |
  | **Role of Statistics** | Statistical normality is constitutive of health; modal traits are healthy by definition. | Statistical normality is evidentiary only; modal traits can be pathological if harmful. | Substantive |
  | **Role of Harm** | Harm is a contingent consequence of disease, not a defining condition. | Harm (goal-frustration) is a defining condition; without it, there is no disease. | Substantive |
  | **Hybrid Compromise** | Rejects adding harm criteria: makes disease partly normative, undermining scientific objectivity. | Rejects adding dysfunction criteria: makes disease partly value-free, undermining lived reality. | Substantive |

  3. **Cruxes and Case Studies**
  We identify two cruxes where empirical findings could shift theoretical commitment. We anchor these in two stipulated cases.

  *   **Crux 1: The Modal Pathology.** Does statistical predominance override harmful consequences?
      *   **Case A:** Arterial remodeling is the statistical mode, asymptomatic, functionally normal, but shortens life and causes calamitous events.
      *   **Naturalist Classification:** Healthy (Normal Function). **Cost:** Must endorse a harmful state as non-pathological. **Revision:** Redefine "function" via evolutionary design rather than current statistics. **Prediction:** If genetic analysis shows this trait is a recent environmental mismatch rather than adapted design, the Naturalist will reclassify as disease.
      *   **Normativist Classification:** Diseased (Goal-Frustration). **Cost:** None (fits theory). **Prediction:** If the trait is shown to be essential for survival in a specific environment, the Normativist will maintain it is healthy *in that environment*, confirming relativity.

  *   **Crux 2: The Benign Deviation.** Does biological deviation override flourishing?
      *   **Case B:** Congenital trait is rare (<2%), causes slow metabolite clearance and poor performance scores, but the bearer flourishes, meets all goals, and suffers no disadvantage.
      *   **Naturalist Classification:** Diseased (Dysfunction). **Cost:** Must pathologize a flourishing life. **Revision:** Restrict "dysfunction" to traits causing actual capacity reduction, not just score deviations. **Prediction:** If longitudinal data shows reduced reserve capacity under stress, the Naturalist will maintain disease classification.
      *   **Normativist Classification:** Healthy (Norm-Institution). **Cost:** Must accept biological dysfunction as compatible with health. **Revision:** Define "vital goals" to include biological maintenance, not just social achievement. **Prediction:** If the bearer reports no subjective limitation, the Normativist will maintain health classification.

  4. **Joint Operational Rule and Falsifiable Verdicts**
  **Rule:** The Panel shall cover interventions that either restore statistical functional normality OR alleviate reported goal-frustration, regardless of the metaphysical label assigned to the condition.

  **Falsifiable Verdicts:** While coverage is identical under this rule, the following *labeling verdicts* would differ if one camp's metaphysics were proven true, affecting stigma, research priority, and coding:
  *   **Case A Labeling:** If Naturalism is true, Case A is "Normal Variation" (No research priority for cure). If Normativism is true, Case A is "Disease" (High research priority).
  *   **Case B Labeling:** If Naturalism is true, Case B is "Disease" (Eligible for corrective research). If Normativism is true, Case B is "Normal Variation" (No corrective research needed).
  *   **Preventative Coverage:** If Naturalism is true, preventative intervention for Case A is unjustified (treating health). If Normativism is true, it is justified (preventing calamity).

  5. **Closing**
  Much of our two-year dispute was verbal, centering on the word "function." The Naturalist used it to mean *biological capacity*, while the Normativist used it to mean *lived ability*. We should have said: "Biological capacity can exist without lived ability, and vice versa." Had we distinguished *mechanical operation* from *teleological success* explicitly from the start, we would have recognized that our disagreement is not about the facts of Case A or B, but about which fact grants the privilege of the label "disease." We agree now that the payer needs the facts of both kinds to decide coverage, even if we cannot agree on the name.
