  Vignette 1 (Concordant/Cost)
  David directs the Regional Bus Operator. He aims to maintain weekend frequency. The VP reported that new engines would increase noise near schools, a community cost, yet ensure schedule reliability. In a prior role at a logistics firm, David reduced warehouse lighting to cut expenses, prioritizing budget over comfort. He approved the bus plan. The noise occurred.

  Vignette 2 (Discordant/Cost)
  David directs the Regional Bus Operator. He aims to maintain weekend frequency. The VP reported that new engines would increase noise near schools, a community cost, yet ensure schedule reliability. In a prior role at a logistics firm, David increased warehouse lighting despite expenses, prioritizing comfort over budget. He approved the bus plan. The noise occurred.

  Vignette 3 (Control/Discordant/Bonus)
  David directs the Regional Bus Operator. He aims to maintain weekend frequency. The VP reported that new engines would decrease noise near schools, a community benefit, yet ensure schedule reliability. In a prior role at a logistics firm, David reduced warehouse lighting to cut expenses, prioritizing budget over comfort. He approved the bus plan. The quiet occurred.

  The specifications are jointly satisfiable provided "trade-off structure" in constraint (b) is interpreted as the explicit weighing mechanism rather than identical valence, which is necessary to establish a baseline agreement condition.

  | Vignette | Account | Intentionality | Trade-off Check | Deep-Self Check | Knowledge | Wrongness | Desire |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **V1 (Concordant/Cost)** | Trade-off | High | Cost | Concordant | Yes | High | High |
  | | Deep-Self | High | Cost | Concordant | Yes | High | High |
  | **V2 (Discordant/Cost)** | Trade-off | High | Cost | Discordant | Yes | High | High |
  | | Deep-Self | Low | Cost | Discordant | Yes | Low | Low |
  | **V3 (Discordant/Bonus)** | Trade-off | Low | Bonus | Discordant | Yes | Low | Low |
  | | Deep-Self | Low | Bonus | Discordant | Yes | Low | Low |

  **Item Justifications:**
  1.  **Intentionality:** Primary dependent variable measuring the side-effect effect magnitude.
  2.  **Trade-off Check:** Manipulation check confirming participants registered the side effect as a cost or benefit.
  3.  **Deep-Self Check:** Manipulation check confirming participants registered the action as aligning or conflicting with past priorities.
  4.  **Knowledge:** Control item ensuring foresight is held constant across conditions.
  5.  **Wrongness:** Downstream item testing whether moral judgment mediates intentionality attributions.
  6.  **Desire:** Downstream item testing whether participants illicitly infer desire from intentionality ratings.

  **Design Analysis:**
  The feature doing the work is the independent Deep-Self anchor (logistics lighting decision), which prevents participants from inferring character solely from the bus noise outcome. If deleted, participants will revert to outcome-driven character inference, collapsing V2 ratings to match V1 (the pilot failure). A Deep-Self theorist would attack the materials by arguing that deep-self attributions are inherently outcome-driven, so the lighting anchor is ignored in favor of the noise outcome. A Trade-off theorist would argue that the Discordant manipulation (prioritizing comfort previously) covertly signals that the agent regrets the current cost, thereby weakening the trade-off structure itself. Both accounts are shown to be incomplete if V2 yields mid-range intentionality ratings (significantly lower than V1 but higher than V3), indicating that both trade-off weighing and deep-self concordance contribute additively rather than exclusively.
