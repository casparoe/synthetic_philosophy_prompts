  STATE OF COLUMBIA v. VANE
  Court of Appeals of the Columbia District
  Decided October 14, 2038

  *"If, as we confront some task, a part of the world functions as a process which, were it done in the head, we would have no hesitation in recognizing as part of the cognitive process, then that part of the world is (so we claim) part of the cognitive process."*

  **PER CURIAM:**

  1. The appellant, Mr. Vane, appeals his conviction for failure to comply with a protective order. The state compels us to decide whether a smartphone notes application constitutes a portion of the user's mind under the Cognitive Integrity Act, and whether the destruction of such data constitutes a cognizable injury to the person rather than merely to evidence.

  2. Police obtained a warrant for Mr. Vane's person and effects. They compelled him to unlock his telephone and produce a notes application used for nine years to record medication schedules, storage combinations, debts, and a standing reminder regarding "the thing." Eighteen months post-seizure, during a vendor data-center consolidation, the account and its backups were deleted. Mr. Vane argues the compelled production was a testimonial act drawn from his mind; that the deletion was a permanent cognitive injury; and that the trial court erred in finding he "believed" the contents of a note he had not opened in eleven months.

  3. Under *State v. Kroll*, the constitutional protection against self-incrimination extends to processes functionally identical to internal cognition. The parity principle dictates that if a process occurring in the head is cognition, its occurrence in a device is cognition too. The device is not a container searched but a portion of the appellant's mind examined. Consequently, the deletion of the data is not the loss of evidence but the infliction of a permanent cognitive injury for which the state is answerable.

  4. To distinguish cognitive extensions from mere tools, we apply a four-factor test derived from *Kroll*: constant availability, automatic endorsement on retrieval, speed and ease of access, and settled reliance such that contents are not re-checked. Mr. Vane's device satisfies all four. It was physically present at all times; he trusted the notes without verification; access was immediate; and he relied on them for basic functioning. The state's interference was therefore an intrusion into the appellant's cognitive sovereignty.

  5. Regarding the note unopened for eleven months, the trial court found Mr. Vane held a belief in its contents. We agree. The distinction between a belief one holds and a belief one is currently entertaining is dispositional. The note functioned as dispositional memory. That he did not access it recently does not negate its status as a stored belief, provided the reliance remains settled. The four-factor test does not require constant access, only constant availability.

  6. Appellant's counsel asks us to confront the bloat objection: what keeps a public library, a search engine, or a spouse out of the appellant's mind? The answer is functional integration, endorsement, and reliance, not proximity or biology. A library lacks automatic endorsement; a user verifies books. A spouse lacks the requisite unity of agency. We concede the line is drawn by degree. This costs us clarity in marginal cases, but bright lines are unavailable where biology ends and artifact begins.

  7. Counsel further offered a fitness tracker, a refrigerator that has learned his routines, and a barista who remembers his order as further portions of his mind. We admit the tracker; it meets the four factors for biometric monitoring. We exclude the barista; an external agent cannot be functionally integrated without consent merging agency. We admit we cannot yet rule on the refrigerator; the record is insufficient regarding the depth of reliance.

  8. Because the state destroyed a portion of the appellant's mind, the remedy is not merely suppression of evidence but sanction for cognitive injury. The conviction is reversed.

  9. We note briefly the status of the appellant's wife. The parties co-maintain a shared calendar and complete each other's sentences in ways neither manages alone.¹ Whether they constitute a single cognitive system is not before us, but if they do, the warrant invaded a shared privacy interest neither could waive alone. We leave this for a future panel.

  10. The judgment of the trial court is reversed.

  ¹ *See State v. Aris* (holding that joint cognitive systems require joint consent for search).

  **HARLAN, J., dissenting:**

  1. I respect the majority's adherence to precedent, but I cannot follow its metaphysics. However reliable and reciprocal the coupling between an organism and an artifact, causation is not constitution. There must be some mark of the cognitive, a property mental states have that ink and silicon lack. The majority grants the intuitive force of the parity argument—that it seems arbitrary to let skin and skull do metaphysical work—but locates the failure in the step from coupling to constitution.

  2. The majority's rule leads to absurdity. On this rule, the state commits battery whenever a site fails to resolve. A municipal library becomes a public organ whose defunding is a mass lobotomy. A widower's grief over a lost diary is actionable as bodily harm. These are not legal categories; they are category errors.

  3. The majority concedes the line is drawn by degree, yet applies it as a rule of law. This invites litigation over every cloud server and notebook. The dissent would locate the cognitive boundary at the skull not because biology is sacred, but because the law requires a subject responsible for its own mind. To extend that subjecthood to vendors and devices is to dissolve the person the law seeks to protect. I would affirm.

