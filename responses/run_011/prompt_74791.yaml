answer: |-
  **Research Proposal: Disciplining Retrospective Salience in Science Museum Narratives**

  **1. Statement of Purpose and Research Question**

  This proposal outlines a twelve-month research secondment undertaken in conjunction with the lead curator post for the reinterpretation of the permanent galleries. The existing curatorial brief instructs the team to 'stop telling the history of science as progress towards the present'. While morally and historiographically sound, this instruction is negative; it identifies a vice without providing a positive methodology for its avoidance. In practice, the label 'Whig history' obscures at least four distinct operations: evaluative anachronism; retrospective salience; narrative teleology; and survivorship bias.

  My working hypothesis is that retrospective salience—selecting past episodes because they led to our present—is not a defect but a condition of museum communication. A visitor stands in the present; what makes the past matter to her is its relation to her current world. The difficulty arises when this necessary salience slides into narrative teleology, implying the destination was inevitable. Consequently, the central research question is determinate: **Can a selection protocol be devised that permits retrospective salience while neutralising narrative teleology and survivorship bias?**

  To answer this, I propose to develop and pressure-test a heuristic device: the Counterfactual-Vantage Test. This requires the research to move beyond theoretical critique into operational methodology.

  **2. Historiographical Context and Gap**

  The mid-century critique of present-oriented historiography, descending from Butterfield's 1931 polemic, established the prohibition against Whig history as a orthodoxy within the discipline. It argues that past actors must be assessed only by standards they could recognise. However, subsequent defences of writing history from where we now stand argue that total neutrality is impossible; all history is written from a specific vantage point.

  In the museum sector, these positions remain unresolved. Curators are told to avoid 'progress narratives' but are simultaneously required to make collections relevant to contemporary audiences. Existing positions leave the practical question open: if we cannot eliminate the present viewpoint, how do we discipline it? A purely theoretical resolution offers no guidance for label-writing deadlines. Conversely, a straightforward audit of current practice describes the problem but offers no remedy. This project occupies the gap between historiographical theory and curatorial practice, aiming to produce a transferable methodological report for our partner institutions.

  **3. Methodology**

  The research will be staged across three phases over twelve months, combining textual analysis, controlled experimentation, and reflexive case study.

  *Phase 1: Deconstruction and Reflexivity (Months 1–3)*
  I will analyse the existing draft gallery texts against the four-fold distinction of Whig operations. The objective is to tag instances of anachronism, salience, teleology, and survivorship. Crucially, this phase will include a reflexive case study regarding a specific panel currently scheduled for removal, which I authored early in my career. My reluctance to lose this panel will not be treated as noise or personal bias to be suppressed. Instead, it will be treated as evidence of 'institutional survivorship'. By documenting my own attachment, I can model how curatorial authorship creates a false lineage, mistaking what *persisted* (my text) for what *mattered*. This provides a controlled variable for understanding how survivorship bias operates emotionally and institutionally, not just historically.

  *Phase 2: The Controlled Exercise (Months 4–8)*
  The core of the method is the Counterfactual-Vantage Test. The rule is as follows: re-run the selection criteria for a gallery section from a different present—for example, a visitor in 1900 or 1830. If the selection rule singles out the same episodes and makes them intelligible without knowledge of subsequent discoveries, it passes. If the selection collapses or requires knowledge of the future to make sense, it fails.

  To test the usability of this rule, I will convene a small working group of curators from within our museum group. They will be asked to select episodes for a hypothetical gallery under three differently worded selection rules: one explicitly presentist, one strictly contextualist, and one utilising the Counterfactual-Vantage Test. We will compare the resulting narratives. Do the Counterfactual selections retain relevance for a modern visitor while avoiding the implication of inevitability? This comparative data will determine whether the test distinguishes between legitimate salience and illegitimate teleology in practice.

  *Phase 3: Synthesis and Tool Development (Months 9–12)*
  The final phase involves refining the test based on the exercise results. If the test proves too cumbersome, I will attempt to distil it into a simpler checklist. The output will be drafted as a methodological report, focusing on applicability for institutions with limited research capacity.

  **4. Defence of Approach**

  Two obvious alternatives exist, both of which are insufficient for this brief. The first is a purely conceptual analysis of the notion of progress. While philosophically rigorous, this yields no actionable guidance for a curator facing a text deadline. It diagnoses the condition but prescribes no treatment. The second is a straightforward audit of current curatorial practice. While this would quantify the prevalence of Whig narratives, it remains descriptive. It tells us how often we err, but not how to do otherwise.

  This proposal is distinct because it is interventionist. It seeks to build a tool. By treating the Counterfactual-Vantage Test as a prototype to be broken and rebuilt, rather than a theory to be defended, the research remains anchored in the operational realities of museum work. It acknowledges that curators cannot abandon the present viewpoint, but insists they can make that viewpoint answerable.

  **5. Success Criteria and Risk Assessment**

  A successful result is a validated heuristic that a curator with no philosophical training can apply on a Monday morning. It need not be perfect, but it must be robust enough to catch obvious teleological slips without paralysing the writing process. Specifically, success is defined as the production of a gallery outline that visitors find relevant (retaining salience) but which historians agree does not imply inevitability (removing teleology).

  Failure is a live possibility. The test may collapse into triviality; for instance, if every selection rule fails when projected to 1830 because modern science is fundamentally different from natural philosophy. Alternatively, the test may prove unusable under deadline pressure, requiring too much counterfactual imagination. There is also the risk that the distinction between salience and teleology is itself illusory; if they cannot be practically separated, the research question must be reformulated to accept a 'managed Whiggism' rather than a disciplined one.

  **6. Deliverable**

  The primary deliverable is a Methodological Report containing the 'Selection Discipline Protocol'. This will include:
  1.  Definitions of the four Whig operations for curatorial staff.
  2.  The Counterfactual-Vantage Test, simplified into a series of interrogative prompts (e.g., 'Would this object still be significant if we did not know X?').
  3.  A reflexive guide for identifying authorial attachment, using the 'own panel' case study as a template for recognising institutional survivorship.
  4.  Examples of text revisions demonstrating the shift from teleological to salient narration.

  **7. Scope and Resourcing**

  Twelve months is a tight constraint for a project of this nature. The scope is currently balanced on the edge of feasibility. The risk is that the historical analysis required to properly simulate a 1900 vantage point becomes a research project in itself, consuming time needed for tool development.

  Should time become critical, the first element to be cut is the depth of the historical simulation. Rather than fully reconstructing a 1900 worldview, the test will rely on established historiographical summaries. The comparative exercise with other curators is essential and must be retained, as without it, the tool remains untested theory. The reflexive case study regarding my own earlier work is low-cost in terms of time but high-value in terms of honesty; it should be retained as it addresses the human element of curatorial bias which purely procedural checks miss.

  If the project proves too small—if the test is developed too quickly—the scope should be expanded to include a visitor evaluation component. We would test whether narratives produced via the Protocol are perceived differently by the public compared to traditional narratives. However, given the primary brief is a methodological report for institutions, the internal development of the tool takes precedence over external audience metrics.

  **8. Conclusion**

  The instruction to avoid 'progress towards the present' is currently a prohibition without a practice. By disaggregating the components of Whig history, this project accepts that some presentism is inevitable in a public museum. The goal is not purity, but accountability. By treating curatorial attachment as data and subjecting selection rules to counterfactual stress tests, we can produce narratives that respect the past without denying the present. This report will provide the group with a defensible, replicable standard for gallery reinterpretation.
