prompt: |-
  ok so I keep getting roped into running our team offsites and I've decided the whole thing should be based on the drinking material in Plato's Laws (books 1 and 2) plus the Symposium. Write me a parody of a corporate employee-handbook section — heading something like "7.4 Supervised Inebriation and Character Assessment" — for a company that has genuinely adopted the Platonic program as HR policy and is completely sincere about it.

  About 700 words, numbered clauses with a couple of subheadings and one small sidebar, in deadpan compliance-manual voice.

  Stuff I want in there because its the actual substance, not just set dressing: wine handled as a pharmakon that temporarily loosens self-control and therefore works as a cheap assay of character (the test-the-gold-in-the-fire idea); the age tiers from the Laws — nothing fermented at all for the under-18s, i.e. the interns, moderation up to 30 with an explicit no-intoxication rule, and free convivial drinking after 40 framed as Dionysus' medicine against the crabbedness of age (with the obvious staffing implications for the exec layer); and a job description for the appointed symposiarch, including the awkward fact that he's the one responsible for everyone else's restraint while being the person in the room most exposed to losing his own. Also the collision between the Symposium's rule that nobody is constrained and each drinks only as much as he pleases, and the fact that in a company the symposium is on the shared calendar, inside the working day, catered, and feeds into your review. Make that collision the running joke but never let anyone say "this is contradictory" out loud — it should just get managed by more clauses.

  The humour should come from getting the material right rather than from anachronism for its own sake; a classicist should laugh and find it fair. I want at least one clause where a real reader of the Laws would recognise a genuine problem with the program — something like the wine test revealing dispositions (courage, self-control, shamelessness) rather than knowledge or judgement, so the colleague who is delightful after four cups isn't automatically a hire, and the one who clams up sober might be the better engineer. Include a "known limitations" clause and a grievance procedure for anyone who claims they were assessed while impaired.

  Don't quote Plato verbatim anywhere — paraphrase everything into HR-speak — and no citations, no reading list, no footnotes. And just start straight into the handbook text: no preface, no framing note, no signoff explaining the joke.
