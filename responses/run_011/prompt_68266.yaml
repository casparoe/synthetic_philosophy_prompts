  8.  **Final Polish:** Ensure the distinction between *ontological* (tastes don't have truth values) and *methodological* (we pretend tastes are stable) is sharp. Ensure the Revealed Preference tautology is identified as definitionally true but welfare-silent.

      *(Self-Correction on Claim 3)*: Make sure to emphasize that RP is a *definition* within a specific framework, not a law of nature.
