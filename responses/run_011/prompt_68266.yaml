      *   *Truth-Aptness:* If taste judgments aren't truth-apt (non-cognitivism), how can "Choice = Welfare" be true? This is a meta-ethical clash. If welfare claims are also non-cognitive, the theory collapses into expression. If welfare claims *are* cognitive, then taste claims might be too. The supervisor wants it both ways: "You can't judge tastes" (Non-cognitive) but "I can judge that Choice = Good" (Cognitive).
      *   *Stigler & Becker:* They assume stable tastes *for the model*. This doesn't mean tastes *are* ontologically stable or indisputable in reality. It's a "as if" methodology. Using it to block welfare critique is a category error (Is vs. Ought / Model vs. Reality).

