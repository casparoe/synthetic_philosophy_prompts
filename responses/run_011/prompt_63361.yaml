prompt: |-
  I serve as parliamentarian for a professional association of about 2,400 members. Our bylaws contain exactly one amendment clause: any provision may be amended by a two-thirds vote of the members present and voting at a general meeting, provided that written notice of the proposed amendment was given at the preceding meeting. The board is entirely volunteer, no one on it is a lawyer, and we get proposals that touch the amendment clause itself perhaps three or four times a year — almost always from someone who has just lost a vote and wants to raise the threshold, or from a regional chapter that wants its seat on the board protected forever. When one of these surfaces I have roughly twenty minutes before the chair puts the question, and afterwards I have to reduce my reasoning to writing for the minutes within a week, where it may be read by counsel for the losing side. We have no budget for outside advice unless a dispute actually turns litigious, and the only real check on a bad ruling from me is a membership vote two years later. I would like a decision procedure I can run on any proposed amendment to the amendment machinery: the questions to ask in a fixed order, what counts as a sufficient answer to each, the points at which the procedure outputs a definite ruling (in order, out of order, amendable, not amendable), and the points at which it stops and hands the question to the membership or to a court because it is not mine to decide as presiding officer.

  The procedure needs to be grounded in what the theory of legal self-reference actually has to say, but translated for a lay chair. I want it to take a position — or at least an explicit flag — on the recurring puzzles we hit: whether a rule-making power includes the power to change the rule that confers it; whether a body can bind its successors at all, and if not, what is left of the phrase "shall never be amended"; the difference between making a provision harder to change by imposing a more demanding manner and form of amendment and making it substantively unchangeable; whether an amendment adopted under the old clause remains valid after the clause is amended; and what to do when the bylaws are simply silent on a self-referential move, or when two clauses of the instrument conflict about which one governs. Please tell me which of these distinctions must survive into the checklist intact because the ruling changes if they are blurred, and which can be dropped as too fine for a room of non-specialists at nine in the evening — and be candid about the places where my procedure will be a judgment call wearing the clothes of a test, and about the situations in which it will confidently produce the wrong ruling.

  Then run it on three proposals we have actually had, or something close enough to be useful. First: an amendment raising the threshold for all future bylaw changes to a two-thirds vote of the entire membership rather than of those present, with a clause stating that this higher threshold applies to itself and may be repealed only by the same standard — the proposer has told the board this will lock the change in permanently. Second: an amendment declaring that a certain regional chapter's guaranteed seat on the board "shall never be amended or abolished." Third: a challenge, raised the morning after a meeting, to an amendment passed the previous year, on the ground that notice was defective under the amendment clause as it then stood and that the defect makes the whole thing void rather than merely irregular. I want the written reasoning I would put in the minutes for each, the questions in order with my answers, and the ruling — including for at least one of the three a ruling that I and most of the board will not want to hear, with an explanation of why the unwelcome answer follows rather than a softer one. Finally, state plainly what this procedure cannot do for me: which of these questions it can only defer, and what would have to be true — a state statute, a charter, an incorporation document, a court — for my ruling to stop being the last word in the room.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Parliamentarian for a professional association (2,400 members, volunteer board, no lawyers).
      *   **Problem:** Frequent attempts to amend the amendment clause itself (self-reference), often motivated by sore losers or protectionism.
      *   **Constraints:** 20 minutes to decide during the meeting, written reasoning needed later for potential legal scrutiny, no budget for outside counsel unless litigious, limited check (membership vote 2 years later).
      *   **Goal:** A decision procedure (checklist) grounded in legal self-reference theory but translated for laypeople. It needs to handle specific puzzles (binding successors, manner/form vs. substance, validity of amendments under old vs. new clauses, silence/conflict).
      *   **Requirements:**
          *   Distinguish essential distinctions vs. those too fine for the room.
          *   Acknowledge judgment calls and potential errors.
          *   Run the procedure on three specific scenarios (Lock-in threshold, "Never amend" clause, Retroactive validity challenge).
          *   Provide written reasoning for the minutes for each.
          *   Include at least one unwelcome ruling.
          *   State limitations (what the procedure *can't* do, when external authority overrides).

  2.  **Theoretical Foundation (Legal Self-Reference):**
      *   *Hart's Rule of Recognition:* The ultimate rule cannot be changed by the rules it recognizes unless it explicitly allows it.
      *   *The "Amending Clause" Paradox:* Can the power to amend include the power to destroy the power to amend? (Self-embracing vs. Self-limiting sovereignty).
      *   *Binding Successors:* Generally, one legislative body cannot bind a future one *substantively*, but it can bind them *procedurally* (manner and form) if the authority allows.
      *   *Continuity:* An amendment adopted validly under the old rules remains valid even if the rules change, unless the new rules explicitly invalidate it (which creates a circularity).
      *   *Substantive vs. Procedural Entrenchment:* You can make it *harder* to change (supermajority, notice), but you generally cannot make it *impossible* ("never amended") within a voluntary association context unless the incorporating statute allows it.

  3.  **Drafting the Decision Procedure (The Checklist):**
      *   Need a step-by-step flow.
      *   *Step 1: Authority.* Does the current amendment clause allow amendment of *itself*? (Yes, "any provision").
      *   *Step 2: Manner and Form vs. Substance.* Is the proposal making it *harder* (procedural) or *impossible* (substantive)?
      *   *Step 3: Binding Successors.* Does it claim to bind future meetings indefinitely?
      *   *Step 4: Consistency.* Does it conflict with higher law (statutes/articles of incorporation)?
      *   *Step 5: Notice/Process.* Was the specific notice requirement met for *this* change?
      *   *Decision Points:* In order/Out of order, Amendable/Not Amendable, Defer to Membership/Defer to Court.

      *Refining the Distinctions:*
      *   *Keep:* Manner/Form (harder) vs. Substance (impossible). This is crucial for validity.
      *   *Keep:* Self-application (does the new rule apply to changing itself?).
      *   *Drop:* Deep philosophical paradoxes (e.g., Kelsen's Grundnorm). Keep it practical.
      *   *Judgment Call:* Whether a specific threshold is so high it amounts to a substantive ban (e.g., 100% vote).

  4.  **Developing the Three Scenarios:**

      *   *Scenario 1: The "Lock-In" (2/3 of entire membership + self-application).*
          *   *Analysis:* Changing "present and voting" to "entire membership" is a procedural hurdle (Manner/Form). However, claiming it "locks in permanently" is legally suspect. A future majority can usually change the rules if they meet the *current* highest standard. But if the standard is impossible (e.g., 100%), it's void. 2/3 of *entire* membership is very hard but theoretically possible.
          *   *Ruling:* In order, but the "permanent lock" language is precatory/advisory only. It cannot bind successors substantively.
          *   *Unwelcome aspect:* Telling the proposer their "lock" isn't actually a lock.

      *   *Scenario 2: The "Never Amend" Clause (Regional Seat).*
          *   *Analysis:* "Shall never be amended" is substantive entrenchment. In a voluntary association governed by democratic principles (and usually state non-profit law), you cannot remove the power of the membership to govern itself entirely. It violates the principle that the current membership holds the ultimate authority.
          *   *Ruling:* Out of order (or Not Amendable). It attempts to destroy the amendment power regarding a specific subject.
          *   *Unwelcome aspect:* Telling a regional chapter they have no permanent protection.

      *   *Scenario 3: The Retroactive Challenge (Defective Notice last year).*
          *   *Analysis:* This is about *validity* vs. *regularity*. If notice was defective under the rules *at that time*, the amendment was void *ab initio*. It doesn't matter what the rules say now. This is a factual/legal determination, not a parliamentary one.
          *   *Ruling:* Defer to Counsel/Court. The Parliamentarian rules on *procedure* during the meeting, not on *legal validity* of past actions based on external facts.
          *   *Unwelcome aspect:* Admitting the Parliamentarian has no power here.

  5.  **Drafting the Written Reasoning (for Minutes):**
      *   Needs to be formal, clear, and cite the logic used.
      *   Must anticipate legal scrutiny.

  6.  **Addressing Limitations:**
      *   The procedure cannot override State Law or Articles of Incorporation.
      *   It cannot determine facts (e.g., "Was notice actually sent?").
      *   It cannot stop a determined majority from ignoring the ruling (mob rule vs. rule of law).

  7.  **Review and Refine:**
      *   *Tone:* Professional, candid, authoritative but humble about limits.
      *   *Theory Check:* Ensure the distinction between "manner and form" (valid) and "substantive entrenchment" (invalid) is clear. This is the core of the *Trethowan* vs. *Harris* debate in Commonwealth law, adapted for US non-profits.
      *   *Self-Correction on Scenario 1:* Is 2/3 of *entire* membership valid? Yes, it's a higher procedural bar. But the claim that it *cannot* be repealed is the problem. The ruling must separate the threshold (valid) from the "lock" claim (invalid).
      *   *Self-Correction on Scenario 3:* A parliamentarian *can* rule on a point of order regarding past procedure if the bylaws provide the mechanism. However, if the challenge implies the *existence* of the bylaw is void, that's a legal question. I need to be careful not to overstep. The prompt asks for a ruling where I might not want to hear the answer. Ruling that the amendment is *void* is big. Ruling that *I can't decide* is safer but maybe less useful. Let's go with: The Parliamentarian rules on *current* procedure. Past validity is a legal question. *Correction:* Actually, under RONR and standard parliamentary law, if a bylaw amendment was adopted in violation of the *then-existing* amendment process, it is null and void. A parliamentarian *should* rule on this if the facts are clear. But the prompt says "challenge raised morning after." This is outside the meeting. So the ruling is "This is outside the jurisdiction of the chair/parliamentarian during a meeting; it requires a declaratory judgment." That's the honest answer.

  8.  **Final Polish:** Check against the prompt's specific requests (fixed order, sufficient answers, output points, distinctions kept/dropped, judgment calls, wrong ruling admission).

      *   *Distinctions to Keep:* Manner/Form vs. Substance. Current vs. Future Authority.
      *   *Distinctions to Drop:* Nuanced theories of sovereignty (Hart vs. Kelsen).
      *   *Judgment Calls:* When does "hard" become "impossible"?
      *   *Wrong Ruling:* If the membership votes to ignore the ruling, the ruling is practically wrong even if theoretically right.

      *(Self-Correction during drafting)*: I need to make sure I explicitly state *which* distinctions survive.
      *   Survive: Manner/Form vs. Substance.
      *   Drop: The philosophical "why" (Hart's rule of recognition).
      *   Judgment Call: Whether a supermajority requirement is so onerous it equates to a ban.

      Let's assemble the response.

      *Structure:*
      1.  Introduction & Theory Translation.
      2.  The Decision Procedure (Checklist).
      3.  Essential vs. Droppable Distinctions.
      4.  Limitations & Judgment Calls.
      5.  Application to Three Scenarios (with Minutes Reasoning).
      6.  Final Limitations Statement.

      *Scenario 1 (Lock-in):* Ruling: In order regarding threshold, Out of order regarding "permanent lock."
      *Scenario 2 (Never Amend):* Ruling: Out of order (Substantive entrenchment).
      *Scenario 3 (Retroactive):* Ruling: Outside jurisdiction (Legal validity vs. Parliamentary procedure).

      *Wait, one constraint:* "including for at least one of the three a ruling that I and most of the board will not want to hear."
      Scenario 2 is usually unpopular with the chapter. Scenario 1 is unpopular with the proposer. Scenario 3 is unpopular with the board who passed the amendment last year. Scenario 3 is the most dangerous legally. If I rule it's void, the board looks incompetent. If I rule it's valid, I might be legally wrong. The "unwelcome" ruling should be the one that stops the board's desire. Let's make Scenario 2 the "Out of Order" because it violates the fundamental right of the membership to govern. That's a strong parliamentary stance. Or Scenario 1, telling them their "lock" is an illusion. Let's go with Scenario 2 as the hard "No" because "Never" is legally toxic in non-profits.

      *Refining the "Wrong Ruling" admission:* I need to admit where the procedure might fail. It fails if the state statute overrides the bylaws.

      *Let's write.*
answer: |-
  ### Part I: The Decision Procedure (The "Self-Reference Checklist")

  This procedure is grounded in the distinction between **procedural entrenchment** (making a rule harder to change) and **substantive entrenchment** (making a rule impossible to change). In voluntary associations, the membership always retains the ultimate sovereign power to govern itself. You can change the *locks*, but you cannot throw away the *key*.

  **Instructions:** Run these questions in order. If you answer "No" to a gatekeeping question, stop and issue the indicated ruling.

  **Q1: Does the current amendment clause explicitly allow amendment of *itself*?**
  *   *Look for:* Language like "any provision," "these bylaws," or "including this article."
  *   *Sufficient Answer:* Yes. (Your bylaws say "any provision.")
  *   *If No:* **RULING: Out of Order.** You cannot amend the amendment clause using a power it does not grant.
  *   *If Yes:* Proceed to Q2.

  **Q2: Does the proposal impose a new "Manner and Form" (procedure) or a "Substantive Ban" (content)?**
  *   *Look for:* Is it changing *how* we vote (notice, thresholds, timing) or *what* we can vote on (forbidden topics, permanent protections)?
  *   *Sufficient Answer:* It changes the procedure (e.g., higher vote count, more notice).
  *   *If Substantive Ban:* **RULING: Not Amendable.** (See Q3 for nuance).
  *   *If Manner and Form:* Proceed to Q3.

  **Q3: Does the proposal claim to bind future meetings indefinitely (e.g., "shall never be amended," "locked permanently")?**
  *   *Look for:* Language attempting to remove the power of amendment from future members regarding this specific provision.
  *   *Sufficient Answer:* No. It acknowledges the new rule can be changed under the new rules.
  *   *If Yes (Claims to bind successors):* **RULING: Out of Order (in part).** You must strike the language claiming permanence. A current majority cannot strip a future majority of its sovereign power to amend.
  *   *If No:* Proceed to Q4.

  **Q4: Is the new procedural hurdle theoretically possible to meet?**
  *   *Look for:* Thresholds that are mathematically or practically impossible (e.g., 100% vote, notice given 50 years in advance).
  *   *Sufficient Answer:* Yes, it is difficult but possible (e.g., 2/3 of entire membership is hard but possible).
  *   *If Impossible:* **RULING: Not Amendable.** A procedural hurdle that functions as a substantive ban is void.
  *   *If Possible:* Proceed to Q5.

  **Q5: Does the proposal conflict with a higher authority (State Law, Articles of Incorporation)?**
  *   *Look for:* Statutory requirements for member voting that cannot be waived (e.g., some states require a simple majority for certain fundamental changes).
  *   *Sufficient Answer:* I have no knowledge of a conflict.
  *   *If Conflict Known:* **RULING: Defer to Counsel.** This is a legal question, not parliamentary.
  *   *If No Conflict:* **RULING: In Order.**

  ---

  ### Part II: Distinctions to Keep vs. Drop

  **Distinctions that must survive intact (The Ruling Changes if Blurred):**
  1.  **Manner/Form vs. Substance:** This is the core. You can require 90% vote (Manner/Form). You cannot say "This article shall never be touched" (Substance). Blurring these allows members to effectively repeal the amendment clause without saying so.
  2.  **Current vs. Future Sovereignty:** A current meeting can bind itself to a harder process, but it cannot bind a *future* meeting from changing that process if the future meeting meets the hard process. The "Lock" is always an illusion.
  3.  **Validity vs. Regularity:** A violation of the amendment clause *at the time of adoption* makes an amendment void (Validity). A violation of a standing rule during debate is merely an error (Regularity).

  **Distinctions to drop (Too fine for 9:00 PM):**
  1.  **The "Self-Embracing" Paradox:** Do not debate whether the power to amend includes the power to destroy the power. Simply rule that the power to amend does *not* include the power to remove the power.
  2.  **Implied Repeal:** Do not get into whether a new clause implicitly repeals an old one. Stick to the text: if they conflict, the specific amendment controls the general bylaw, provided it passed validly.
  3.  **Equitable Estoppel:** Do not consider whether members "relied" on the old rule. Either the vote was valid under the rules *at that time*, or it was not.

  ---

  ### Part III: Judgment Calls and Potential Errors

  **Where this is a Judgment Call wearing clothes of a Test:**
  *   **Q4 (Possibility):** Determining when a threshold is so high it becomes "impossible." 2/3 of the *entire* membership is valid. 100% is not. 95% is a gray zone. You must decide if the hurdle is a "filter" or a "wall."
  *   **Q5 (Higher Authority):** You are not a lawyer. You must decide when a proposal smells like a legal violation requiring counsel versus a standard parliamentary issue.

  **Where the Procedure will Confidently Produce the Wrong Ruling:**
  *   **If State Law Overrides:** If your state's Non-Profit Corporation Act says "Bylaws may always be amended by a majority vote," and your procedure rules a 2/3 lock-in "In Order," you are procedurally right but legally wrong. The procedure assumes the bylaws are the highest authority, which is often false.
  *   **If the Membership Revolts:** If you rule "Out of Order" and the Chair puts the question anyway, and the membership votes 90% in favor, your ruling is practically null. The procedure cannot enforce itself against a determined sovereign body.

  ---

  ### Part IV: Application to Three Scenarios

  #### Scenario 1: The "Lock-In" Threshold
  **Proposal:** Raise threshold to 2/3 of *entire* membership. Clause states this higher threshold applies to itself and may be repealed *only* by this standard (claimed to "lock permanently").

  **Checklist Run:**
  *   Q1 (Allow self-amend?): Yes ("any provision").
  *   Q2 (Manner vs. Substance?): Manner (vote count).
  *   Q3 (Bind Successors?): **Yes.** Language claims it applies to itself and implies permanent lock.
  *   **Stop.** Ruling required on the "lock" language.

  **Ruling:** **In Order as to the threshold; Out of Order as to the "lock" language.**
  **Reasoning for Minutes:**
  > "The Chair rules the proposed increase in voting threshold to two-thirds of the entire membership is in order as a procedural 'manner and form' requirement. However, the language suggesting this change is 'permanent' or cannot be repealed except by this standard is ruled out of order. Under parliamentary law and the principles of voluntary association, a current membership cannot substantively bind the sovereign power of a future membership to amend its own governing documents. While the new threshold makes amendment more difficult, it cannot make it impossible. The offending language regarding permanence shall be stricken, and the amendment shall be voted upon as a procedural change only, applicable to future votes provided the new threshold is met."

  **Why this is unwelcome:** The proposer wants a "lock." You are telling them the lock is a illusion. They can still be changed, just with more votes.

  #### Scenario 2: The "Never Amend" Clause
  **Proposal:** A regional chapter's guaranteed seat on the board "shall never be amended or abolished."

  **Checklist Run:**
  *   Q1 (Allow self-amend?): Yes.
  *   Q2 (Manner vs. Substance?): **Substance.** It removes a topic from the scope of amendment entirely.
  *   **Stop.**

  **Ruling:** **Not Amendable (Out of Order).**
  **Reasoning for Minutes:**
  > "The Chair rules this amendment out of order. While the bylaws allow amendment of 'any provision,' this power is limited by the fundamental principle that the membership retains the ultimate authority to determine its own governance. A provision that attempts to remove a subject entirely from the power of amendment constitutes substantive entrenchment. It effectively repeals the amendment power regarding this specific right. As a voluntary association, the membership cannot divest itself of the power to reorganize its board structure in the future. To allow this would create a conflict between the amendment clause and the substantive ban, rendering the amendment clause nugatory on this point. The motion is not within the competence of the meeting to adopt."

  **Why this is unwelcome:** The regional chapter feels betrayed. They wanted security; you gave them parliamentary theory. This is the most likely to cause a rift.

  #### Scenario 3: The Retroactive Challenge
  **Proposal:** Challenge raised morning after meeting: Last year's amendment is void because notice was defective under the *old* clause.

  **Checklist Run:**
  *   Q1 (Current Amendment?): **No.** This is a challenge to a *past* action.
  *   **Stop.** This procedure governs *proposals*, not *adjudication of past validity*.

  **Ruling:** **Defer to Counsel / Point of Information.**
  **Reasoning for Minutes:**
  > "The Chair notes this challenge concerns the legal validity of an action taken at a prior meeting, based on alleged defects in notice under the bylaws as they existed at that time. This is not a question of current parliamentary procedure, but a question of legal validity and fact. The Parliamentarian's authority is limited to advising on the rules of the *current* meeting. A determination that a past amendment is void *ab initio* due to defective notice is a legal conclusion that may require review of external evidence and state law. The Board is advised to seek legal counsel regarding the status of the prior amendment. Until such time as a competent authority declares the prior amendment void, the Chair must administer the bylaws as they currently appear on record."

  **Why this is unwelcome:** The Board wants certainty. You are telling them, "I don't know, ask a lawyer (who costs money)." It admits the limits of your power.

  ---

  ### Part V: What This Procedure Cannot Do

  You asked for candor about the limits. This procedure is a shield, not a sword.

  1.  **It Cannot Override Statute:** If your state's Non-Profit Corporation Act says "Members may always amend bylaws by a simple majority," your 2/3 lock-in (Scenario 1) is legally void regardless of my ruling. The procedure assumes the bylaws are the highest law; they are often not.
  2.  **It Cannot Determine Facts:** In Scenario 3, you cannot determine if notice *was* actually defective. You can only rule on what happens if it *was*.
  3.  **It Cannot Stop a Coup:** If the Chair ignores your "Out of Order" ruling and the membership applauds, the procedure has failed. Your only recourse is to note your dissent in the minutes (as you planned) and hope a court later agrees with you.
  4.  **It Cannot Bind the Future:** You know this, but the procedure forces you to say it. Every time you rule a "lock" invalid, you are admitting that your own ruling today could be overturned tomorrow if someone successfully amends the amendment clause to remove your authority.

  **When Your Ruling Stops Being the Last Word:**
  Your ruling is the last word *in the room* only so long as:
  1.  The Chair supports you.
  2.  The membership does not vote to suspend the rules or ignore the bylaws (which they can do with sufficient vote in many jurisdictions).
  3.  **Crucially:** No external authority intervenes. A state Attorney General, a court injunction, or a statutory provision overrides your gavel instantly. If a member sues for declaratory judgment, your minutes become evidence, not law.

  **Final Advice:**
  Use the procedure to buy time and force clarity. When you rule "Out of Order" on substantive entrenchment (Scenario 2), you are not just citing rules; you are protecting the association from litigation. Courts hate "never amend" clauses in private associations. Your "unwelcome" ruling is actually the one that keeps the board out of court. Frame it that way in your minutes.
