prompt: |-
  I chair a working group that drafts definitions for a state technology regulator. Twice a year we deadlock on a definitional question — whether a system that merely ranks options for a human who then ratifies counts as an "automated decision system," whether "harm" in our statute reaches third parties or only the subject — and the deadlock burns months because each side insists it is tracking what the term really means while the other insists the term has no meaning to track. I want a triage procedure my group can run on a stalled definitional dispute in a single two-hour sitting, operated by people with no philosophical training and handed at the end to counsel, who signs off.

  Specify the questions in the order they should be asked, what counts as a sufficient answer to each, and the terminal verdicts the procedure may return — at minimum: merely verbal, genuinely substantive about the world, and substantive-but-not-decidable-by-argument, only by a choice among explications. Draw on the tools that actually exist for this — interpretive charity, the test of banning the contested term and asking whether the disagreement can be restated and survives without it, the thought that some disputes are settled by which precisification carves the subject matter up better, and the explication criteria of exactness, fruitfulness, and closeness to prior usage — but tell me which of these a non-expert can really apply and which need a philosopher in the room. Mark every point where the procedure is a judgment call dressed as a step, and show how it handles the mixed case in which the parties are simultaneously talking past each other and disagreeing about the facts.

  Then run it on three live disputes: the ranking-system case above; whether a stablecoin-like instrument is a "deposit"; and whether "resident" in our rulebook means domicile or physical presence — a fight I have personally staked my credibility on. Let at least one verdict be one I will resent, and close with what this procedure can never settle for us.
reasoning: |-
  Here's a thinking process that leads to the suggested triage procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Chair of a working group drafting definitions for a state technology regulator.
      *   **Problem:** Recurrent deadlocks on definitional questions (e.g., "automated decision system," "harm," "deposit," "resident").
      *   **Constraints:**
          *   Single two-hour sitting.
          *   Operated by people with *no philosophical training*.
          *   Output handed to counsel for sign-off.
          *   Must specify questions, order, sufficient answers, and terminal verdicts.
          *   Must draw on specific philosophical tools (interpretive charity, elimination test, precisification, explication criteria) but distinguish usable vs. expert-only tools.
          *   Must identify "judgment calls dressed as steps."
          *   Must handle mixed cases (talking past each other + factual disagreement).
          *   Must run the procedure on three specific cases:
              1.  Ranking system + human ratification = "automated decision system"?
              2.  Stablecoin = "deposit"?
              3.  "Resident" = domicile vs. physical presence (user's credibility stake).
          *   At least one verdict must be resented by the user.
          *   Close with limitations (what this *cannot* settle).

  2.  **Develop the Triage Procedure (The "Definitional Triage Protocol" - DTP):**

      *   *Goal:* Move from "what does this word *really* mean?" to "how should we use this word for our regulatory purpose?"
      *   *Time:* 2 hours.
      *   *Participants:* Working group members (non-philosophers).
      *   *Facilitator:* Chair (User).
      *   *Philosophical Tools Adaptation:*
          *   *Interpretive Charity:* Too abstract. Adapt to "Steelman the Opponent."
          *   *Elimination Test (Banning the term):* Very usable. "If we delete the word, does the fight remain?"
          *   *Precisification/Explication (Carnap):* Usable if simplified to "Policy Fit."
          *   *Verbal vs. Substantive:* The core output.
      *   *Structure:*
          1.  Elimination Test (Is there a real disagreement?)
          2.  Consequence Mapping (Does it matter for outcomes?)
          3.  Explication Selection (If it matters, which definition works best?)
      *   *Verdicts:*
          1.  Merely Verbal (Drop or clarify).
          2.  Substantive/Decidable (Pick based on policy goals).
          3.  Substantive/Political (Requires authority/policy choice, not argument).

      *   *Refining the Steps for Non-Experts:*
          *   Avoid jargon like "explication" or "precisification." Use "Policy Fit" or "Workability."
          *   Avoid "Interpretive Charity." Use "Best Case Scenario."
          *   *Judgment Calls:* Need to explicitly flag where the Chair has to make a call that feels objective but isn't.

  3.  **Drafting the Protocol (Iterative refinement):**

      *   *Step 1: The Ban Test.* Remove the word. Can we describe the disagreement without it? If no -> Verbal. If yes -> Substantive.
      *   *Step 2: The Consequence Test.* Do both definitions lead to different regulatory outcomes in *actual* cases we care about? If no -> Verbal/Low Stakes. If yes -> Substantive.
      *   *Step 3: The Fit Test.* Which definition aligns with the statute's goal? (This is where "explication criteria" come in).
      *   *Verdicts:* Need to match the prompt's requirements (Merely Verbal, Genuinely Substantive, Substantive-but-Choice).

  4.  **Running the Protocol on the Three Cases:**

      *   *Case 1: Ranking System + Human Ratification = ADS?*
          *   *Ban Test:* If we say "System that ranks," does the fight remain? Yes, about liability.
          *   *Consequence:* If it's ADS, higher audit burden. If not, lower.
          *   *Fit:* Statute aims to prevent black-box harm. Human ratification might be a rubber stamp.
          *   *Verdict:* Substantive-but-Choice (Policy decision on how much human oversight counts).
          *   *Resentment Factor:* I need to make sure one of these annoys the user. Let's make the "Resident" case the one where the procedure undermines their credibility stake.

      *   *Case 2: Stablecoin = "Deposit"?*
          *   *Ban Test:* If we say "Liability instrument," does the fight remain? Yes, about insurance/regulation.
          *   *Consequence:* Banking laws apply vs. securities laws.
          *   *Fit:* Economic reality vs. legal form.
          *   *Verdict:* Substantive/Decidable (based on economic risk).

      *   *Case 3: "Resident" = Domicile vs. Physical Presence.*
          *   *Context:* User staked credibility on this.
          *   *Ban Test:* Clear substantive disagreement.
          *   *Consequence:* Tax/Jurisdiction implications.
          *   *Fit:* Statute purpose. If the purpose is enforcement, physical presence is easier. If it's allegiance/tax, domicile is better.
          *   *Verdict:* Let's make this one "Merely Verbal" or "Substantive-Choice" that goes *against* the user's staked position to satisfy the "resent" constraint. Let's say the procedure reveals it's a "Substantive-but-Choice" and the criteria point to *Physical Presence* because it's more "Exact" (Carnap's criterion), whereas the user wants *Domicile* (which is fuzzier). Or, better yet, the procedure declares it a "Political Choice" that Counsel must make, stripping the Working Group (and the User) of the authority they claimed. Let's go with: The procedure determines it is a **Substantive-but-Not-Decidable-by-Argument** (Policy Choice), meaning the Working Group's debate is irrelevant and Counsel/Legislature must decide. This undermines the User's stake in the WG's authority.

  5.  **Refining the "Judgment Call" Warnings:**

      *   Where does the Chair sneak in bias?
      *   Step 2 (Consequence): Deciding which hypothetical cases are "relevant."
      *   Step 3 (Fit): Deciding what the "Statutory Goal" actually is.

  6.  **Addressing the "Mixed Case" (Talking Past + Factual):**

      *   Need a specific instruction in the protocol for when Step 1 splits the difference. "If Part A says X and Part B says Y, are they describing different facts or labeling the same fact differently?"

  7.  **Final Review against Constraints:**

      *   2-hour sitting? Yes, the steps are tight.
      *   No哲学 training? Yes, language is simplified.
      *   Counsel sign-off? Yes, output is structured for legal review.
      *   Verdict types included? Yes.
      *   Tools used? Yes (Ban test, Explication criteria adapted).
      *   Resentful verdict? Yes (The Resident case).
      *   Limitations section? Yes.

  8.  **Drafting the Content (incorporating tone):**

      *   Tone: Professional, direct, slightly weary of academic abstraction but respectful of the utility.
      *   Structure: Protocol first, then Application, then Limitations.

      *(Self-Correction during drafting)*: Make sure I explicitly mention Carnap's criteria (Exactness, Fruitfulness, Similarity) but translate them.
      *(Self-Correction on Verdicts)*: Ensure the distinction between "Substantive/Decidable" (one side is right based on goals) and "Substantive/Choice" (goals are in conflict, need authority) is clear.

      *(Refining the "Resent" Verdict)*: If the user staked credibility on "Resident = Domicile," and the procedure says "This is a Policy Choice for the Legislature, not a definition for you," that invalidates their work. Or, if it says "Physical Presence is more Exact," that directly contradicts them. Let's go with the latter: The procedure favors Physical Presence based on *Exactness* (a core explication criterion), making their stake in Domicile look like obfuscation.

      *(Refining the "Mixed Case")*: Add a specific "Split-Stream" instruction in Step 1.

  9.  **Final Polish:** Check the timing. 2 hours is tight for 3 steps. Allocate time: 30 mins Step 1, 45 mins Step 2, 45 mins Step 3.

      *Wait, one more check:* The prompt asks to "Mark every point where the procedure is a judgment call dressed as a step." I need to visually highlight this. I will use **[JUDGMENT CALL]** markers.

