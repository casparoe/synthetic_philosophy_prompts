answer: |-
  # The Definitional Triage Protocol (DTP)

  **Purpose:** To resolve stalled definitional disputes in regulatory drafting within 120 minutes.
  **Operators:** Working Group Chair (You) + Members.
  **Output:** A one-page "Triage Memo" for General Counsel.
  **Philosophical Debt:** Adapts Carnap's *Explication*, Quine's *Verbal Disputes*, and Grice's *Charity* for non-philosophers.

  ---

  ## Part I: The Procedure

  ### Phase 1: The Ban Test (30 Minutes)
  **Goal:** Determine if the dispute is verbal (language) or substantive (world).

  **Question 1:** "If we ban the contested word (e.g., 'deposit', 'harm') from the room, can the two sides still describe a disagreement using only descriptions of physical events, legal consequences, or monetary flows?"

  *   **Sufficient Answer:**
      *   *Yes:* "Side A wants to regulate Entity X because it holds funds; Side B wants to exempt Entity X because it issues tokens." (Proceed to Phase 2).
      *   *No:* "Side A says it's a deposit; Side B says it's not, but they agree on all risks, flows, and liabilities." (Verdict: **Merely Verbal**).
  *   **[JUDGMENT CALL]:** The Chair decides what counts as a "physical event" or "legal consequence." A clever debater can hide a verbal dispute inside a factual description. You must rule when a description is specific enough.

  **Question 2 (The Mixed-Case Filter):** "Are we disagreeing on the *label* for the same facts, or do we disagree on the *facts* themselves?"

  *   **Sufficient Answer:** If Side A says "The system decides" and Side B says "The human decides," ask: "Do we agree on the log files?" If yes, it's a label dispute. If no (e.g., Side A thinks the human rubber-stamps, Side B thinks the human analyzes), split the ticket. Resolve the factual dispute via evidence, then return to the label.
  *   **[JUDGMENT CALL]:** Determining whether a disagreement about "rubber-stamping" is a factual claim (observable) or a normative claim (what counts as meaningful review).

  ### Phase 2: The Consequence Map (45 Minutes)
  **Goal:** Determine if the definition changes regulatory outcomes.

  **Question 3:** "List three concrete scenarios where Definition A triggers a regulatory action and Definition B does not."

  *   **Sufficient Answer:** A list of scenarios (e.g., "Audit requirement," "Fine magnitude," "Jurisdiction").
  *   **Failure Condition:** If the group cannot list three scenarios where the *outcome* differs, the dispute is low-stakes. (Verdict: **Merely Verbal / Low Stakes** → Adopt the simpler definition).
  *   **[JUDGMENT CALL]:** The Chair selects which scenarios are "relevant." Excluding a scenario because it is "unlikely" is a policy choice disguised as triage.

  ### Phase 3: The Explication Fit (45 Minutes)
  **Goal:** If the dispute is substantive and high-stakes, choose the definition that best serves the statute. Do not ask "What is truth?" Ask "What is workable?"

  **Question 4:** "Evaluate both definitions against these three criteria. Score them 1-5."
  1.  **Exactness:** Can an auditor verify compliance without guessing? (Precision)
  2.  **Fruitfulness:** Does this definition help us solve the problems the statute was written to fix? (Utility)
  3.  **Similarity:** Is this close enough to common usage that the public won't be confused? (Legibility)

  *   **Sufficient Answer:** A scored matrix.
  *   **[JUDGMENT CALL]:** Weighting the criteria. Does "Exactness" outweigh "Similarity"? The Chair must declare the weighting based on the agency's current mandate (e.g., "We are in an enforcement phase; Exactness wins").

  **Terminal Verdicts:**
  1.  **Merely Verbal:** The word is the problem. Draft a clarifying note or delete the term.
  2.  **Substantive & Decidable:** One definition scores significantly higher on Phase 3 criteria. Adopt it.
  3.  **Substantive-but-Choice:** Both definitions score similarly but prioritize different values (e.g., Exactness vs. Similarity). This is not a definition problem; it is a policy choice.
      *   *Action:* Do not decide. Send to Counsel with a "Policy Flag."

  ---

  ## Part II: Live Dispute Applications

  Here is the DTP applied to your three deadlocks.

  ### 1. The Ranking System (ADS Definition)
  *Dispute: Does a system that ranks options for a human who ratifies count as an "Automated Decision System"?*

  *   **Phase 1 (Ban Test):** Ban "Automated Decision."
      *   *Side A:* "The algorithm filters 90% of options; the human sees only the top 3."
      *   *Side B:* "The human signs the final order; the algorithm is just a calculator."
      *   *Result:* Substantive. They disagree on where agency lies.
  *   **Phase 2 (Consequence Map):**
      *   *Scenario 1:* Algorithm biases toward protected class. If ADS, audit required. If not, no audit.
      *   *Scenario 2:* Human rejects ranking. If ADS, log the rejection. If not, no log.
      *   *Result:* High Stakes. Outcomes differ.
  *   **Phase 3 (Explication Fit):**
      *   *Exactness:* "Human Ratification" is fuzzy (Side B). "System Ranks" is loggable (Side A). **Score: A=5, B=2.**
      *   *Fruitfulness:* Statute aims to catch black-box harm. Side A captures the risk; Side B allows a loophole. **Score: A=5, B=1.**
      *   *Similarity:* Public thinks "Automation" means "No Human." Side B is closer to common usage. **Score: A=2, B=5.**
      *   *Weighting:* Agency mandate is Risk Mitigation. Exactness/Fruitfulness > Similarity.
  *   **Verdict:** **Substantive & Decidable.** Adopt Side A (It is an ADS).
  *   **Rationale:** The "human in the loop" is functionally irrelevant if the choice architecture is constrained by the rank. The definition must track the *risk*, not the *ritual*.

  ### 2. The Stablecoin (Deposit Definition)
  *Dispute: Is a stablecoin-like instrument a "deposit"?*

  *   **Phase 1 (Ban Test):** Ban "Deposit."
      *   *Side A:* "Users give us dollars, we owe them dollars back on demand."
      *   *Side B:* "Users hold a token on a blockchain; redemption is peer-to-peer or via smart contract, not a bank ledger."
      *   *Result:* Substantive. Disagreement on the legal mechanism of redemption.
  *   **Phase 2 (Consequence Map):**
      *   *Scenario 1:* Insolvency. If Deposit, FDIC-style insurance applies. If not, bankruptcy estate.
      *   *Scenario 2:* Interest. If Deposit, usury laws apply. If not, securities laws.
      *   *Result:* High Stakes.
  *   **Phase 3 (Explication Fit):**
      *   *Exactness:* Bank ledger (Side A) is clearer than Smart Contract (Side B). **Score: A=5, B=3.**
      *   *Fruitfulness:* Statute aims to prevent runs. Side A captures the run risk better. **Score: A=5, B=4.**
      *   *Similarity:* Public calls it "crypto," not "banking." Side B is closer to usage. **Score: A=1, B=5.**
      *   *Weighting:* Financial Stability is the mandate. Fruitfulness wins.
  *   **Verdict:** **Substantive & Decidable.** Adopt Side A (It is a Deposit).
  *   **Rationale:** Economic reality trumps technological form. If it quacks like a run-risk, it is a deposit.

  ### 3. The Resident (Domicile vs. Physical Presence)
  *Dispute: Does "resident" mean domicile (intent to stay) or physical presence (days in state)?*
  *(Note: You have staked credibility on Domicile.)*

  *   **Phase 1 (Ban Test):** Ban "Resident."
      *   *Side A (You):* "Person intends this state to be their permanent home."
      *   *Side B:* "Person is physically located in the state for >183 days."
      *   *Result:* Substantive. Disagreement on the trigger for jurisdiction.
  *   **Phase 2 (Consequence Map):**
      *   *Scenario 1:* Remote worker living in state for 8 months, intends to leave. Side A: Not Resident. Side B: Resident.
      *   *Scenario 2:* Snowbird, owns home, 4 months/year. Side A: Resident. Side B: Not Resident.
      *   *Result:* High Stakes. Jurisdiction changes.
  *   **Phase 3 (Explication Fit):**
      *   *Exactness:* Physical days are countable (Side B). Intent is psychic and litigable (Side A). **Score: A=1, B=5.**
      *   *Fruitfulness:* Statute aims to enforce tech safety standards on people *here*. Physical presence ensures enforceability. Domicile allows evasion. **Score: A=2, B=5.**
      *   *Similarity:* Tax law uses Domicile; Traffic law uses Presence. Mixed. **Score: A=3, B=3.**
      *   *Weighting:* Regulatory Enforcement is the mandate. Exactness is paramount.
  *   **Verdict:** **Substantive & Decidable.** Adopt Side B (Physical Presence).
  *   **Rationale:** A regulator cannot litigate intent in every enforcement action. You need a bright line.
  *   **Personal Cost:** This verdict undermines your stake. You argued for Domicile based on "fairness" and "connection." The DTP flags "fairness" as outside the criteria of *Exactness* and *Fruitfulness* for *enforcement*. Your credibility took a hit because the procedure exposed that your preferred definition is administratively brittle.

  ---

  ## Part III: What This Procedure Cannot Settle

  You asked for the limits. The DTP is a tool for **administrative clarity**, not **moral truth**. It will fail you in three specific contexts:

  1.  **When the Statute Itself is Contradictory:** If the law demands "Maximum Innovation" and "Maximum Safety," Phase 3 will yield a tie (Fruitfulness for Safety vs. Fruitfulness for Innovation). The DTP will correctly return a **Substantive-but-Choice** verdict. This will frustrate you because it kicks the can to Counsel, but it is the honest answer. The procedure cannot resolve legislative ambivalence.
  2.  **When "Exactness" is a Trap:** In the *Resident* case, the DTP favored Physical Presence because it is exact. But if the *purpose* of the rule was to protect long-term community members (a normative goal), Exactness was the wrong metric. The DTP forces you to weight criteria, but it cannot tell you if you weighted them *morally* correctly. It optimizes for workability, not justice.
  3.  **When the Dispute is Actually About Power:** Sometimes Side A wants "Automated Decision System" to include ranking not because of definitional accuracy, but because they want budget authority over auditing teams. The DTP treats this as a "Fruitfulness" score. It will not reveal that the definitional fight is a proxy for a turf war. If your group is playing politics, the DTP will just make the politics look like a spreadsheet.

  **Final Instruction for Counsel:**
  When handing over the Triage Memo, attach the Phase 3 Scorecard. If the verdict is **Substantive-but-Choice**, explicitly state: *"The Working Group has identified that this definition requires a policy trade-off between [Criterion X] and [Criterion Y]. This exceeds our statutory mandate to define terms. We request a policy directive."* This protects you from the deadlock while admitting the limit of the tool.
