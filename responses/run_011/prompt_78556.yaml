answer: |-
  In your vocabulary, the etiological (selected-effects) account argues that a part's function is the effect that justified its retention in previous design revisions. Just as field returns and warranty data drive service bulletins and the next revision, a trait's function is the capacity that prevented its removal by selection. The causal-role account argues that function is defined by the current functional decomposition and the requirements traceability matrix. A part functions if it contributes to a higher-level system capacity verified by test, regardless of history.

  1.  **Core Analysis:** For selected-effects, function is historical: the effect that lowered the Risk Priority Number (RPN) in the ancestral population, preventing extinction. For causal-role, function is dispositional: the contribution a part makes to the containing system's capacity as defined in the current functional decomposition.
  2.  **Malfunction:** Selected-effects explains malfunction as a failure to perform the effect that warranted the part's existence (a warranty claim where the part failed its selected purpose). Causal-role explains malfunction as a failure to meet a requirement in the traceability matrix (a first-article inspection failure).
  3.  **By-products:** Selected-effects excludes noise or heat as functions unless a change request specifically selected for them. Causal-role excludes them only if they fall outside the chosen system boundary for decomposition; otherwise, noise is a function of the pump if it contributes to an acoustic analysis.
  4.  **Promiscuity:** Causal-role risks assigning functions to everything because any capacity can be decomposed indefinitely. Selected-effects limits functions to those affecting survival or retention, similar to how reliability practice ignores failure modes with negligible severity or occurrence in the FMEA.
  5.  **Historical Requirement:** Selected-effects struggles with first-article inspection, where a new design has no field history to establish function. Causal-role handles this easily via testing. Conversely, selected-effects handles vestigial parts (old revisions no longer contributing) as non-functional, whereas causal-role might still assign them a capacity.
  6.  **Relativity:** Causal-role treats function as relative to the containing system boundary fixed for analysis. Selected-effects treats function as non-relative, fixed by history. In engineering, you fix the system boundary before writing the FMEA, which captures the relativity but assumes the boundary is authoritative rather than arbitrary.
  7.  **Reassigned Function:** For a carryover part installed in a new assembly, causal-role assigns new functions immediately based on the new traceability matrix. Selected-effects requires a new selection history; until field returns validate the new use, the part retains its old function or has none.

  ### Residue Report

  | Item | Translation Status | Distortion Feature |
  | :--- | :--- | :--- |
  | 1. Core Analysis | Distorted | Importation of Design Authority |
  | 2. Malfunction | Clean | None |
  | 3. By-products | Clean | None |
  | 4. Promiscuity | Clean | None |
  | 5. History | Distorted | Intentional Revision vs. Natural Selection |
  | 6. Relativity | Distorted | Fixed Boundary vs. Arbitrary Decomposition |
  | 7. Reassignment | Clean | None |

  **Prose Reasoning and Adjudication**
  The translation fails cleanly only where engineering practice aligns with causal contribution or failure data. The distortions arise from the **Design Authority**. In selected-effects, you mapped "selection" to "field returns driving revision." This is structurally seductive but smuggles in an agent. In biology, there is no design authority reading warranty data and issuing service bulletins. There is no configuration management board deciding which traits get a part revision. The engineering picture implies intentional purposes—someone *decides* a failure mode is unacceptable. Biology lacks this agent. The normativity of "malfunction" in engineering comes from the requirement spec signed off by the design authority. In biology, selected-effects tries to derive this "ought" from the "is" of history alone, which your vocabulary reveals as missing the sign-off authority.

  Regarding relativity, your habit of fixing a system boundary before writing an FMEA masks the philosophical problem. In causal-role theory, the boundary is arbitrary; you could decompose the engine to explain the car, or the car to explain the traffic flow. In engineering, the boundary is fixed by the project scope and the requirements traceability matrix. You treat the boundary as given, whereas the philosophy treats it as a choice that determines function attribution.

  **Adjudication:** The failure to translate indicates that your vocabulary lacks the resources to express normativity without a designing agent. Engineering functions are normative because a design authority says they are. Biological functions, on the selected-effects account, are supposed to be normative without an authority. This suggests the dispute is not merely verbal. If we rename them "Historical Function" and "System Function," the conflict over malfunction remains. System Function cannot explain why a vestigial trait is *broken* rather than just useless; Historical Function cannot explain the function of a new mutation before it is selected. The dispute survives terminology changes because it concerns the source of normativity: history or current contribution.

  ### Case Study: Reverse Engineering
  Consider reverse engineering an undocumented legacy component. You have no design authority to consult and no CAD design intent. You must infer function from as-built geometry, wear patterns, and service history.

  In this scenario, your practice presupposes the **selected-effects account**. You look for wear patterns (field evidence) to determine what the part *did* over time, assuming that the geometry exists because it was selected for that purpose. You treat the part as if it has a proper function determined by its history of use, not just its current capacity. If you find a bracket that is currently holding nothing but shows wear consistent with vibration damping, you infer its function was damping, not just supporting, because the history dictates the intent.

  If the component comes with a complete revision history and change requests, the verdict shifts toward **causal-role** mixed with **design intent**. The documentation provides the "requirements traceability" without needing to infer from wear. You know what the part was *intended* to do (design intent) versus what it *does* (as-built). However, if the revision history shows the part was carried over from a different assembly (repurposed), you face the reassigned function problem. If the docs say "carryover," but the new assembly uses it differently, your inspection relies on current capacity (causal-role) to verify the new requirement, even if the history says otherwise.

  ### Conclusion
  Your working intuition—that the dispute reduces to design intent versus measured performance—is largely vindicated but breaks on the issue of agency. "Design intent" maps to selected-effects only if you assume a designer exists. "Measured performance" maps cleanly to causal-role. The philosophical struggle is that biology wants the normativity of design intent (to explain malfunction) without the designer. Your engineering vocabulary confirms that normativity usually requires a design authority holding configuration control. Without that authority, the selected-effects account struggles to explain why a trait *ought* to do something rather than just describing what it *did*. The dispute is not verbal; it is about whether history alone can generate the normative force that a signed requirement spec provides in your practice.
