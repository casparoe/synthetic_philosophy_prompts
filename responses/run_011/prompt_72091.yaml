answer: |-
  # The Continuity & Competence Review Protocol (CCRP)
  **Version:** 4.2 (Clinical Implementation)
  **Time Allocation:** 45 Minutes Maximum
  **Panel:** Chair (Engineering/Phil), Neurologist, Patient Advocate
  **Objective:** Determine authorization for the next 0.4% cortical replacement session.

  ## Preamble: Operational Definitions
  *   **Functional Isomorphism:** Not perfect identity, but preservation of input-output mapping within a defined *Variance Budget*.
  *   **Continuity:** The patient's unbroken first-person report of being the same entity, provided it does not contradict hard physiological data.
  *   **The Shadow:** A predictive modeling tool. It has **no** agency, **no** legal standing, and **no** veto power. It is evidence of baseline, not a stakeholder.
  *   **The Halt Directive:** A Ulysses contract signed at T=0. It is binding *unless* the current patient demonstrates competent autonomy that explicitly overrides it.

  ---

  ## The Decision Procedure

  ### Step 1: The Variance Budget Check (Empirical)
  **Question:** Does the post-session telemetry exceed the allowable deviation from the pre-session baseline in motor, linguistic, and autonomic response times?
  *   **Sufficient Answer:** All metrics fall within the ±5% *Variance Budget* established at Session 1.
  *   **Failure Condition:** Any single metric exceeds ±10%, or three metrics exceed ±5% for two consecutive sessions.
  *   **Action:**
      *   *Pass:* Proceed to Step 2.
      *   *Fail:* **HARD STOP.** Session halted. Medical review for hardware rejection or edema.
  *   **Sign-off:** Neurologist (Required), Chair (Informational).

  ### Step 2: The Coherence Interview (Empirical/Metaphysical)
  **Question:** Does the patient's self-report of continuity contain internal contradictions or factual impossibilities regarding their own history that cannot be explained by memory loss from the underlying disease?
  *   **Rationale:** A system experiencing degraded qualia may still report "normalcy," but a system experiencing *fragmentation* will likely exhibit narrative incoherence. We test for coherence, not truth.
  *   **Sufficient Answer:** Patient asserts continuity ("I feel like me") AND can narrate a causal chain of personal history consistent with medical records (allowing for disease-related memory loss).
  *   **Failure Condition:** Patient reports continuity but demonstrates *confabulation* (inventing events) or *discontinuity* (claiming to be someone else, or claiming the previous week's self was a stranger) without physiological cause.
  *   **Action:**
      *   *Pass:* Proceed to Step 3.
      *   *Fail:* **CONDITIONAL CONTINUE.** Suspend next session. Order 72-hour cognitive observation.
  *   **Sign-off:** Advocate (Required), Chair (Required).

  ### Step 3: The Shadow Divergence Audit (Empirical/Normative)
  **Question:** Is the divergence between the Patient and the Shadow model due to *Patient Drift* (change in the human) or *Model Decay* (failure of the simulation to predict synthetic integration)?
  *   **Rationale:** The Shadow is a model of the *organic* baseline. As the patient becomes synthetic, the Shadow *should* diverge if the synthetic substrate behaves differently than the organic prediction. Divergence is expected; unexplained divergence is risk.
  *   **Sufficient Answer:** Divergence is correlated with known synthetic integration patterns (e.g., faster affective processing) OR Shadow model confidence intervals have widened.
  *   **Failure Condition:** Divergence shows random noise, degradation in core personality traits (e.g., altruism becomes sociopathy), or the Shadow predicts behavior the Patient explicitly denies while failing Step 2 coherence.
  *   **Action:**
      *   *Pass:* Proceed to Step 4.
      *   *Fail:* **HAND-OFF.** Refer to External Ethics Review Board (ERB). The question is no longer clinical; it is ontological.
  *   **Sign-off:** Chair (Required), Neurologist (Informational).

  ### Step 4: The Stipulated Safety Margin (Normative/Legal)
  **Question:** Has the patient exceeded the regulatory replacement threshold (e.g., 75%)?
  *   **Rationale:** This number is not an ontological cliff. It is a liability buffer. It acknowledges that beyond this point, reversibility is impossible and legal personhood may be challenged.
  *   **Sufficient Answer:** Percentage < Threshold OR Exemption Granted.
  *   **Exemption Criteria:** Patient is competent (Step 2 Pass), Disease is not arrested (organic tissue still dying), and Patient explicitly accepts "Synthetic Person" legal classification.
  *   **Action:**
      *   *Pass:* Proceed to Step 5.
      *   *Fail:* **HARD STOP.** Unless Exemption Criteria are met and signed by Legal Counsel.
  *   **Sign-off:** Chair (Required), Legal Counsel (Required for Exemption).

  ### Step 5: The Ulysses Conflict Resolution (Normative)
  **Question:** Does a prior Halt Directive (signed at T=0) conflict with the current patient's request to continue?
  *   **Rationale:** A competent present self generally overrides a past self's directive *unless* the competence of the present self is compromised by the treatment itself.
  *   **Sufficient Answer:** Current patient explicitly requests continuation AND demonstrates understanding of the Directive's original intent (e.g., "I know I said stop at 75% because I was afraid of becoming a machine, but I am still me.").
  *   **Failure Condition:** Current patient wants to continue but cannot articulate *why* they are overriding their prior directive, or affective drift (Step 1) suggests emotional blunting that compromises valuation.
  *   **Action:**
      *   *Pass:* **CONTINUE.**
      *   *Fail:* **HAND-OFF.** Refer to ERB. This is a values conflict, not a fact conflict.
  *   **Sign-off:** Advocate (Required), Chair (Required).

  ---

  ## Case Applications

  ### Case 1: Routine-ish (38%, Shadow Divergence)
  *   **Status:** 38% replaced. Batteries passing. Shadow disagrees on 12% of preferences.
  *   **Step 1 (Variance):** Pass. (Batteries passing).
  *   **Step 2 (Coherence):** Pass. (Patient reports continuity, no confabulation).
  *   **Step 3 (Shadow):** **Pass.** The procedure dictates that Shadow divergence is expected as synthetic integration alters processing speed/weighting. Unless the divergence indicates *degradation* (sociopathy, incoherence), it is classified as *Model Decay*. The Shadow was built on an organic connectome; it cannot perfectly predict synthetic-organic hybrid states.
  *   **Step 4 (Margin):** Pass (Under 75%).
  *   **Step 5 (Ulysses):** N/A (No halt directive mentioned).
  *   **Decision:** **CONTINUE.**
  *   **Note:** Flag Shadow for recalibration. The Shadow is losing fidelity, not the patient.

  ### Case 2: Branching (70%, Shadow Authority Request)
  *   **Status:** 70% replaced. Patient requests Shadow be kept active with legal authority.
  *   **Step 1 (Variance):** Pass.
  *   **Step 2 (Coherence):** Pass.
  *   **Step 3 (Shadow):** **HARD STOP / HAND-OFF.** The request violates the Operational Definition of the Shadow. Granting authority creates a legal fission event the clinic is not empowered to adjudicate.
  *   **Decision:** **CONTINUE TREATMENT, DENY SHADOW AUTHORITY.**
  *   **Reasoning:** The panel can authorize biological/synthetic replacement. It cannot authorize the creation of a legal digital heir. This requires a court order, not a clinical review. The patient may continue their own treatment, but the Shadow remains a tool.
  *   **Sign-off:** Legal Counsel must intervene here.

  ### Case 3: The One You Dislike (85%, Halt at 75%, Affective Drift)
  *   **Status:** 85% replaced. Directive says halt at 75%. Patient wants to finish. Affective timing drift is stable but "different."
  *   **Step 1 (Variance):** **Borderline.** Drift is stable, not deteriorating. It is "different." If it is within the ±10% hard stop, it passes technically, but flags Step 5.
  *   **Step 2 (Coherence):** Pass. Patient reports continuity.
  *   **Step 3 (Shadow):** Pass. (Assuming Shadow aligns with the "different" affect or is irrelevant).
  *   **Step 4 (Margin):** **Fail.** (85% > 75%). Requires Exemption.
  *   **Step 5 (Ulysses):** **Conflict.** Past Self said Stop. Present Self says Go.
      *   *Analysis:* The disease is arrested. The patient is likely *more* competent now than at T=0. However, the "affective drift" suggests the *mechanism* of valuation has changed. Is the "Go" decision coming from the original person, or the synthetic substrate which does not fear death/loss in the same way?
      *   *Procedure Verdict:* **HAND-OFF to ERB.**
      *   *Reasoning:* This is the exact edge case the procedure is designed to catch. We cannot determine if the "change in affective timing" constitutes a change in *moral agency*. The panel is not equipped to decide if a synthetic entity has the right to override a human's death warrant.
  *   **Decision:** **SUSPEND.** Refer to External Ethics Review Board. Do not proceed until ERB rules on the validity of the Ulysses contract in the context of substrate change.

  ---

  ## The Honest Assessment: Judgment Calls in Procedure's Clothes

  You asked which steps are judgment calls wearing a procedure's clothes. Here is the breakdown:

  1.  **The Variance Budget (Step 1) is a Political Number.**
      *   *The Cloak:* "Empirical Metric."
      *   *The Reality:* There is no biological basis for a ±5% vs ±6% cutoff in neural timing that correlates to "selfhood." This number was chosen to satisfy the regulator's need for a bright line. It is a liability threshold, not an ontological one. We are pretending that a 6% drift kills the soul, when in reality it's a smooth gradient.

  2.  **The Coherence Interview (Step 2) Assumes Narrative Continuity = Identity.**
      *   *The Cloak:* "Clinical Assessment."
      *   *The Reality:* This relies on a Lockean memory theory of identity that we know is philosophically fragile. A patient could be a perfect philosophical zombie—functionally identical, narratively coherent, but experientially dead—and this test would pass them. We are testing for *social* continuity, not *phenomenological* continuity.

  3.  **The Shadow Audit (Step 3) Privileges the "Old" Self.**
      *   *The Cloak:* "Baseline Comparison."
      *   *The Reality:* By treating the Shadow (based on the organic brain) as the "truth" and the Patient as the "variable," we implicitly value the organic baseline over the synthetic evolution. If the synthetic brain is *better* (e.g., more rational, less biased), Step 3 flags it as "Divergence." We are biasing the procedure against improvement.

  4.  **The Ulysses Resolution (Step 5) is Pure Metaphysics.**
      *   *The Cloak:* "Competence Assessment."
      *   *The Reality:* Deciding whether the 85% patient is the "same agent" as the 0% patient is not a medical question. It is a metaphysical one. By handing it to the ERB, we are admitting the procedure cannot solve it. But even the ERB will just be voting on values. We are outsourcing the sin of deciding who counts as human.

  ---

  ## What This Procedure Cannot Do

  1.  **It Cannot Detect Qualia Loss.**
      *   If the synthetic neurons process information perfectly but feel like nothing (or feel like *different* qualia), this procedure will not catch it. We are measuring behavior and report, not experience. We are protecting the *legal person*, not necessarily the *phenomenological subject*.

  2.  **It Cannot Resolve the Fission Problem.**
      *   In Case 2 (Branching), the procedure denies the Shadow authority. This does not solve the moral problem of whether the Shadow *deserves* rights. It merely protects the clinic from liability. We are managing risk, not justice.

  3.  **It Cannot Distinguish "Change" from "Death."**
      *   When the patient at 85% says "I am me," and the Shadow says "You are different," the procedure has no objective arbiter. We default to the living patient's report. This is a pragmatic choice, not a truth. We are deciding that *whatever claims to be the patient and passes the Turing-style tests gets the benefit of the doubt.*

  4.  **It Is Theater for the Regulator.**
      *   The 45-minute review, the sign-offs, the "Variance Budget"—these exist to create a paper trail that proves we *considered* the metaphysics. They do not prove we *solved* them. The procedure transforms an unanswerable philosophical question ("Is this still the same person?") into an answerable administrative one ("Did they sign Form 7B?").

  **Final Directive to Chair:**
  Run the protocol. It will keep you out of prison and keep the clinic open. It will not tell you if you are killing souls or saving them. When Step 5 triggers a Hand-Off, do not feel you have failed. That is the only honest moment in the process.
