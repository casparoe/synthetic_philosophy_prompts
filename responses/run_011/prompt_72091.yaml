      *(Refining the "What it cannot do" section)*: It cannot prove identity. It cannot measure qualia. It manages liability and safety, not ontology.

  9.  **Final Polish:** Check against the "four things to absorb."
      1.  *Approximation:* Addressed in Step 1 (Variance Budget).
