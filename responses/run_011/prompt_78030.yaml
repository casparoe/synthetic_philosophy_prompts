      *   **Constraint:** The selection history must *genuinely* fail to settle content among three candidates (Predator, Dark-elongated-moving, Dangerous-thing). This is the "Disjunction Problem" or "Indeterminacy Problem" within teleosemantics.
      *   **Requirements:**
          1.  Exam Question (Case description, neutral sketch of teleosemantics, parts a/b/c, 20 marks, 90 mins, rubric with ban on stock examples).
          2.  Model Answer (~700 words, full marks).
