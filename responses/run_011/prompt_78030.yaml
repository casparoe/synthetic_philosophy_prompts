answer: |-
  ## 1. Exam Question

  **MPhil Philosophy of Mind: Take-Home Assessment**
  **Topic:** Naturalising Content
  **Time Allowed:** 90 Minutes
  **Total Marks:** 20

  **Rubric:**
  Answer all three parts. Your answers must rely **exclusively** on the case description provided below. Do not invoke standard thought experiments (e.g., Swampman, Twin Earth, Frog/Flies, Brain-in-a-Vat). Doing so will be treated as a failure to engage with the specific logical constraints of this problem and will incur a **severe penalty (up to 50% deduction on the total mark)**. You do not need any knowledge outside this paper to answer fully.

  **Case Study: The Ridge-Runner and the Shadow-Viper**
  Consider the 'Ridge-Runner', a small mammal. For 50,000 years, a specific population lived on Isolated Island A. They possess a neural state, $N$, which triggers an immediate freeze-response.
  1.  **History (Island A):** During these 50,000 years, the *only* cause of $N$ was the 'Shadow-Viper'. The Shadow-Viper is dark, elongated, moves quickly, and is lethal. On Island A, *every* dark, elongated, moving thing was a Shadow-Viper, and *every* Shadow-Viper was dangerous. There were no false positives (no harmless things triggered $N$) and no false negatives (no Vipers failed to trigger $N$). Consequently, $N$ was naturally selected because it saved lives.
  2.  **Present (Island B):** Due to a storm, a group was displaced to Island B. Here, Shadow-Vipers are absent. However, Island B contains 'Glimmer-Grubs'. These are dark, elongated, move quickly, but are harmless and edible. On Island B, $N$ is triggered reliably by Glimmer-Grubs. It never triggers for Shadow-Vipers (as none exist).

  **Theoretical Sketch:**
  *   **Pure Reliability Theory:** The content of a state is determined by what it *currently* covaries with reliably.
  *   **Teleosemantics:** The content of a state is determined by the conditions it was *selected* to indicate during its evolutionary history (its 'proper function'). Misrepresentation occurs when the state fires outside these selected conditions.

  **Questions:**

  **(a)** According to Pure Reliability Theory, what is the content of $N$ on Island B, and is the state true or false when a Grub appears? Contrast this with the *intended* verdict of Teleosemantics regarding misrepresentation. (5 marks)

  **(b)** A Teleosemanticist claims history fixes the content. However, three candidate contents fit the selection history on Island A equally well:
  1.  *Shadow-Viper Present*
  2.  *Dark-Elongated-Moving-Thing Present*
  3.  *Danger Present*
  Explain precisely why the selection history described *cannot* distinguish between these three candidates. Why does this generate indeterminacy rather than a clear verdict? (7 marks)

  **(c)** Suppose the Teleosemanticist proposes a 'Specificity Principle': *Content is fixed by the most specific property that was covariant during selection.*
  Evaluate this principle. Does it successfully resolve the indeterminacy in (b) without abandoning the core teleological commitment? Explain why this move risks collapsing back into a Reliability Theory or remaining arbitrary. (8 marks)

  ***

  ## 2. Model Answer

  **(a) Reliability vs. Teleological Verdicts**
  On Island B, Pure Reliability Theory dictates that content is fixed by current covariation. Since $N$ now fires reliably for Glimmer-Grubs and never for Vipers, the content of $N$ is *Glimmer-Grub Present* (or *Dark-Elongated-Moving-Thing Present*). When a Grub appears and $N$ fires, the state is **true**. There is no misrepresentation on this view; the state simply tracks a new regularity.

  Teleosemantics intends to preserve the intuition of error. Since $N$ was selected for survival on Island A, and freezing for a Grub is wasteful (or misses a meal), the Teleosemanticist wants to say $N$ is **false** when triggered by a Grub. The state is malfunctioning relative to its history, representing a Viper where there is none. This distinguishes the two theories: Reliability sees adaptation to new inputs; Teleosemantics sees systematic error.

  **(b) The Problem of Co-Extensivity**
  The indeterminacy arises because the three candidate contents were perfectly co-extensive during the selection period on Island A. Selection operates on outcomes (survival), not descriptions.
  1.  *Shadow-Viper Present:* Every time this was true, $N$ fired.
  2.  *Dark-Elongated-Moving-Thing Present:* Since all Vipers had these features and nothing else did, this was true whenever $N$ fired.
  3.  *Danger Present:* Since all Vipers were lethal and nothing else triggered $N$, this was also true whenever $N$ fired.

  Because there was zero variance in the history, natural selection could not 'prefer' one content over the others. Selecting for 'Viper-detection' yields the exact same survival rate as selecting for 'Dark-Moving-detection' or 'Danger-detection'. The history fixes the *function* (freeze to survive), but it does not fix the *conditions of satisfaction* uniquely. Therefore, Teleosemantics cannot determine if a Grub-triggered $N$ is false (it's not a Viper/Danger) or true (it is a Dark-Moving-Thing). The theory yields three incompatible truth-values for the same token state based on the same history.

  **(c) Evaluating the Specificity Principle**
  The 'Specificity Principle' attempts to break the tie by choosing candidate (1) *Shadow-Viper Present*, as 'Viper' is more specific than 'Dark-Moving-Thing' or 'Danger'. While this yields the desired verdict (Grub-triggering is false), it fails teleologically.

  First, the principle is arbitrary within the framework. Selection cares about sufficiency for survival, not metaphysical specificity. If 'Dark-Moving-Thing' was sufficient for survival on Island A, there is no historical fact that makes 'Viper' the *real* content. To assert specificity is to import a constraint not found in the selection history itself.

  Second, this risks collapsing into Reliability Theory. To justify why 'Viper' is the relevant specific property rather than 'Viper-with-molecular-structure-X', one must look at what the mechanism actually discriminates. If the Ridge-Runner's sensor only detects shape and motion, claiming the content is 'Viper' (a biological kind) attributes a discriminatory power the organism lacks. If we ground specificity in what the sensor *can* currently distinguish, we are relying on current structural reliability, not history.

  Thus, the principle either remains an ad hoc addition unsupported by the evolutionary facts (leaving content indeterminate) or it shifts the ground to current discriminatory capacities (collapsing toward Reliability). It does not solve the indeterminacy using *only* teleological resources.

  ***

  ## 3. Marking Scheme

  **Total Marks:** 20
  **Pass Threshold:** 10 Marks

  ### Part (a): Reliability vs. Teleo (5 Marks)
  *   **5 marks:** Correctly identifies Reliability content as Grub/Dark-Moving (True). Correctly identifies Teleo intention as Viper (False/Misrepresentation). Clear contrast drawn.
  *   **3-4 marks:** Identifies the truth-value difference but vague on *why* (e.g., fails to mention covariation vs. selection).
  *   **1-2 marks:** Confuses the theories (e.g., claims Teleo says it's true).
  *   **0 marks:** Irrelevant or incorrect.

  ### Part (b): The Indeterminacy (7 Marks)
  *   **6-7 marks (First Class):** Explicitly identifies **co-extensivity** as the core logical problem. Explains that selection tracks survival outcomes, which were identical for all three candidates. Notes that without variance in history, selection cannot privilege one property over another.
  *   **4-5 marks (2:1):** Identifies that history fits all three but treats it as an epistemic limitation ("we don't know which") rather than a metaphysical indeterminacy inherent to the theory.
  *   **2-3 marks (2:2):** Lists the three options but fails to explain *why* history doesn't pick one (e.g., just asserts "it's ambiguous").
  *   **0-1 marks:** Fails to engage with the three candidates.

  ### Part (c): The Fix and Collapse (8 Marks)
  *   **7-8 marks (First Class):** Critiques the Specificity Principle on two fronts: (1) It is **ad hoc** (selection doesn't care about specificity, only survival sufficiency) and (2) It risks **collapsing into Reliability** (if specificity is grounded in current discriminatory power). Concludes that teleology alone cannot resolve the tie.
  *   **5-6 marks (2:1):** Critiques the principle as ad hoc but misses the collapse argument. Or argues it collapses but misses the ad hoc nature.
  *   **3-4 marks (2:2):** Accepts the principle as a valid fix without critical evaluation.
  *   **0-2 marks:** Irrelevant or misunderstands the principle.

  ### Penalties & Distinctions
  *   **Stock Example Penalty:** If a candidate invokes Frogs, Swampman, or Twin Earth to explain a point *instead* of using the Ridge-Runner case: **Deduct 5 marks from total**. If the answer relies entirely on the stock example: **Fail (0 marks)**.
  *   **First Class (17-20):** Seamless integration of the case details. Recognises that the indeterminacy is structural to Teleosemantics, not just a lack of information. Part (c) demonstrates understanding that adding principles changes the theory.
  *   **Upper Second (14-16):** Solid application of the case. Understands the co-extensivity problem. Part (c) is competent but may miss the nuance of the "collapse" into reliability.
  *   **Lower Second (11-13):** Understands the basic conflict between History and Reliability. Struggles with the indeterminacy in (b) or accepts the fix in (c) too readily.
  *   **Fail (0-10):** Fundamental confusion between the theories. Uses banned examples. Does not follow the case stipulations.
