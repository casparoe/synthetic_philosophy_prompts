      *   *Penalty:* Explicit instruction on the "Stock Example" ban.

  6.  **Review and Refine:**
      *   *Check:* Did I meet the "history genuinely cannot settle" constraint?
      *   *Adjustment:* I need to make sure the case description explicitly states that *no variation occurred* during the selection period. If a non-viper dark thing ever appeared, selection would have pruned the "Dark Moving" content. So, Island A must be hermetically sealed regarding these properties.
      *   *Check:* Is the "Fix" part strong enough? The prompt wants them to confront that principles collapse to reliability or leave it indeterminate. I will structure Part (c) to ask for a "Principle of Specificity" and ask them to evaluate its viability.
      *   *Check:* Word count on model answer. Keep it tight.
      *   *Check:* Rubric clarity.

  7.  **Final Polish:** Ensure the distinction between "Teleosemantics" (history) and "Reliability" (current covariation) is clear in the prompt text so students aren't penalized for not knowing external literature. (Self-correction: The prompt asks for a "short neutral sketch of teleosemantics inside the question".)

  *(Self-Correction during drafting Part (c))*: I need to make sure the student realizes that adding a principle like "content is the *most specific* property" might work, but then ask *why* that's justified teleologically. If it's not justified by selection, it's external. If it is, did selection actually favor specificity? In the case, specificity didn't matter because everything was co-extensive. This is the key trap.

