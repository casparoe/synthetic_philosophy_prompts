      *   *Current Situation:* Population moved to Island B.
      *   *New Stimulus:* "Glimmer-Grubs" (dark, elongated, moving, harmless/edible).
      *   *Old Stimulus:* Shadow-Vipers are absent on Island B.
      *   *The Conflict:*
          *   Reliability Theory: $N$ represents Glimmer-Grubs (high covariation now).
          *   Teleosemantics: $N$ represents Shadow-Vipers (selected function).
          *   *The Twist (Indeterminacy):* The prompt asks for the selection history *itself* to be indeterminate among three candidates (Predator, Dark-elongated-moving, Dangerous).
          *   *Refinement:* To make history indeterminate, I need to ensure that *during the selection history*, these three properties were co-extensive. If $N$ was selected for freezing at Vipers, was it selected for *Vipers* specifically, or *Dark Moving Things* (since those were the only ones), or *Danger* (since Vipers were the only danger triggering it)?
          *   *Crucial Detail:* On Island A, *all* dark moving things were Vipers, and *all* Vipers were dangerous. So the selection pressure doesn't distinguish between "Detect Vipers," "Detect Dark Moving Things," or "Detect Danger."
          *   *The Payoff:* On Island B, $N$ fires for Grubs (Dark Moving, Not Danger, Not Viper).
          *   *Teleosemantic Dilemma:* If content is "Viper," $N$ is false (misrepresentation). If content is "Dark Moving," $N$ is true. If content is "Danger," $N$ is false. Teleosemantics needs to pick one based on history, but history treats them identically.

  3.  **Drafting the Question:**
      *   *Rubric:* Strict ban on external examples. Penalty: Automatic fail or significant deduction. Let's say "severe penalty, potentially failing the question."
      *   *Intro:* Define Teleosemantics briefly (selected function determines content).
      *   *Part (a):* Apply the theory. Contrast with Reliability. (5 marks)
      *   *Part (b):* The Indeterminacy. Show why history doesn't pick one of the three. (7 marks)
      *   *Part (c):* The Fix. Propose a principle, show why it fails (collapses or arbitrary). (8 marks)

  4.  **Drafting the Model Answer:**
