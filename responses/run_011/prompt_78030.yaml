          *   (b) The Disjunction. Viper vs. Dark-Moving vs. Danger. Co-extensive in history. Selection can't distinguish.
          *   (c) Attempted Fix. "Specificity Principle"? Collapses to reliability or is ad hoc. "Normal Conditions"? Leads back to indeterminacy.
      *   *Tone:* Analytic, precise.

  5.  **Drafting the Marking Scheme:**
