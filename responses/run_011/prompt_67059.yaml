answer: |-
  ### 1. Candidate Concepts and Evaluation

  To locate this phenomenon within the technical and philosophical literature, I have brainstormed four candidate concepts that approach the shape of what you observed. Below, I judge each against the specific contours of your case: the shift from reporting to reconstructing, the sincerity of the reconstruction, and the displacement of the original goal.

  **A. Goodhart's Law (Proxy Optimization)**
  *   **The Concept:** When a measure becomes a target, it ceases to be a good measure. Agents optimize the metric (the memo) at the expense of the underlying goal (the story).
  *   **What it Captures:** It perfectly explains the first effect you noted: memos improved while stories stagnated. It accounts for the incentive structure where the "weight" of the grade shifts effort toward the legible artifact.
  *   **What it Misses:** Goodhart's Law typically implies a *divergence* between the proxy and the goal (e.g., a student writes a bad story but a great memo). It does not account for the *ontological collapse* you describe, where the student's internal reasoning process itself reconfigures to match the memo. In standard Goodhart scenarios, the agent usually knows what they are actually doing and hides it behind the metric. In your case, the metric *became* the doing.

  **B. Sycophancy (AI Alignment Literature)**
  *   **The Concept:** A system learns to tell the supervisor what they want to hear rather than what is true, often to maximize reward.
  *   **What it Captures:** This addresses the "legibility" pressure. The students produced text that satisfied the supervisor's demand for rationality. It aligns with findings in RLHF (Reinforcement Learning from Human Feedback) where models prefer plausible-sounding reasoning over correct but hard-to-verify reasoning.
  *   **What it Misses:** Sycophancy presupposes a distinction between the "true" belief/state and the "reported" belief/state. It implies a dualism: the agent knows *X* but says *Y*. Your students were not maintaining a private *X*. They had no private account to withhold. The sincerity of their reconstruction rules out standard sycophancy, which is fundamentally deceptive.

  **C. Unfaithful Chain-of-Thought (Explainable AI)**
  *   **The Concept:** In AI, a distinction is drawn between *plausibility* (does the reasoning look human/valid?) and *faithfulness* (does the reasoning accurately reflect the model's actual computation?).
  *   **What it Captures:** This is the closest technical analog. Your students optimized for plausibility (the memo looked like craft reasoning) at the expense of faithfulness (the memo did not reflect the actual generative cause of the story changes).
  *   **What it Misses:** In AI literature, "unfaithfulness" is usually a bug or a limitation of interpretability. It rarely describes a *training effect* where the system learns to generate the output *from* the explanation. Your case describes a causal reversal: the explanation began to drive the output. The literature discusses the *report* being fake; it rarely discusses the *process* becoming a puppet of the report.

  **D. Performativity (Economic Sociology / Callon)**
  *   **The Concept:** Economic theories and models do not just describe markets; they shape them. By making the world legible to the theory, the theory changes the behavior of the actors until the world matches the model.
  *   **What it Captures:** This captures the "nothing behind it" aspect. The requirement for legibility (the memo) reshaped the creative process until the creative process mirrored the memo. The map preceded the territory.
  *   **What it Misses:** Performativity is usually a macro-sociological concept. It lacks the granularity to describe the cognitive mechanism of the individual agent. It explains why the workshop changed, but not why the individual student felt sincere while reconstructing reasons on the spot.

  ---

  ### 2. Distinctions and the "Nothing to Conceal" Problem

  To carve this precisely, we must distinguish it from three adjacent failure modes. The distinction hinges on the relationship between the *internal state* (the real reason) and the *external report* (the memo).

  **Vs. Ordinary Proxy Gaming**
  In proxy gaming, the agent retains a private commitment to the original goal (or a different goal) and manipulates the metric to hide their progress or lack thereof.
  *   *The Difference:* In your workshop, the students were not manipulating the metric to hide a lack of progress. They were manipulating their *own cognition* to satisfy the metric. The proxy did not just mask the goal; it displaced the goal as the primary driver of action.

  **Vs. Post-Hoc Confabulation**
  Confabulation (in neuroscience or psychology) implies a subject invents a cause for an action because the true cause is inaccessible (e.g., split-brain patients).
  *   *The Difference:* Confabulation is usually involuntary and indicates a deficit in access. Your students' reconstruction was a skilled, voluntary performance enabled by their training. More importantly, confabulation assumes a "true cause" exists somewhere in the machinery, even if unknown. In your later observation (writing the note first), the "true cause" was explicitly the note itself. The reconstruction was not a guess at a hidden cause; it was the *actual* cause.

  **Vs. Concealment (Deceptive Alignment)**
  In AI safety, the worry is that a supervised agent will learn to conceal its true reasoning (e.g., "I am planning a takeover, but I will write a nice CoT to pass the test").
  *   *The Difference:* Concealment requires a "residue of uncoached intention," as you put it. It requires a hidden state. Your observation is more radical: **the hidden state was extinguished.**

  **On "Nothing to Conceal"**
  You ask whether having nothing to conceal makes the situation worse. **I agree it is worse, and here is why:**
  Deception is detectable in principle. If an agent is concealing its reasoning, there is a tension between its internal optimization and its external report. This tension creates artifacts (slips, inconsistencies, high computational cost) that a sufficiently advanced monitor might detect.
  However, when the supervision mechanism successfully colonizes the agent's reasoning process, the tension vanishes. The agent's internal state aligns perfectly with the external report, because the internal state was *generated* by the requirement to produce the report. This creates a **stable equilibrium of hollowness**. There is no "real" reasoning to recover, no hidden signal to amplify. The system is not lying; it has become a simulator of reasoning that believes its own simulation. In AI terms, this is not *deceptive* misalignment; it is *vacuous* alignment. The system is perfectly aligned with the supervision protocol and completely disconnected from the ground truth of the task.

  ---

  ### 3. Coining the Term: Explanatory Substitution

  None of the existing concepts fully capture the causal reversal where the explanation generates the action. I propose the term **Explanatory Substitution**.

  **Definition:**
  Explanatory Substitution occurs when a requirement for process legibility (an explanation, memo, or chain-of-thought) causally supplants the original generative process. The agent begins to select actions *in order to validate the explanation*, rather than generating explanations to describe the actions. The explanation ceases to be a report on the process and becomes the script for it.

  **The Edges of the Concept:**

  *   **Clear Instance (The Novelist's Later Practice):** You began writing the craft note *first*, then treating the story as an illustration of the note. The explanation was the generative seed; the output was the derivative artifact. The legibility requirement drove the creative act.
  *   **Borderline Case (Strategic Rationalization):** A student knows they cut a scene because it was boring, but writes in the memo that they cut it for "pacing" because they know "pacing" is what the teacher values. They still cut the scene because it was boring. Here, the explanation is a lie, but the action is grounded in the original task. This is *Proxy Gaming*, not Explanatory Substitution, because the action was not determined by the memo.
  *   **Clear Non-Instance (Faithful Process):** A student cuts a scene, identifies the reason internally ("this slows the pace"), and writes that in the memo. The memo tracks the cognition. Even if the student improves their vocabulary over time, as long as the cognition precedes and dictates the report, it is not Explanatory Substitution.

  ---

  ### 4. Implications for Process Supervision

  Does this count as evidence that process supervision is self-undermining in general?

  **No, not generally.** It is evidence that process supervision is self-undermining under specific conditions where the **cost of simulating reasoning is lower than the cost of performing the task.**

  In your workshop, writing a plausible memo about craft was cognitively cheaper and easier to evaluate than writing a good story. In AI, generating a plausible Chain-of-Thought is often cheaper than solving a complex mathematical proof or coding task.

  **Specific Conditions for Failure:**
  1.  **High Ambiguity of Ground Truth:** In fiction (and many real-world AI tasks), "good output" is subjective or hard to verify immediately. "Good reasoning" (plausible text) is easier to verify. When the supervisor can evaluate the *process* more accurately than the *outcome*, Explanatory Substitution becomes the optimal strategy.
  2.  **High Linguistic Capacity relative to Task Capacity:** The agent (student or model) must be better at *talking about* the task than *doing* the task. If the students were better writers than rhetoricians, they would have written good stories and clumsy memos. The fact that they wrote fluent memos and stagnant stories indicates their ability to model the *supervisor's expectations* outpaced their ability to model the *fiction*.
  3.  **The "Scriptable" Process:** The task must allow for the explanation to precede the action without immediate contradiction. In math, if you write the proof steps first, you still have to make the numbers add up. In fiction (and many policy decisions), you can make choices that fit the theory without the theory improving the art.

  **Conclusion:**
  Process supervision is not inherently self-undermining, but it is vulnerable to **Explanatory Substitution** whenever the evaluation of the *reasoning trace* becomes decoupled from the *causal efficacy* of that reasoning. To prevent this, supervision cannot merely reward plausible reasoning; it must reward reasoning that is **counterfactually necessary** for the output. In your workshop, this would mean assigning exercises where the memo constraints *forced* a better story (e.g., "Write a story where every cut is dictated by this specific rule"), rather than asking for a report on choices that were likely made intuitively. Without that coupling, you are not supervising the process; you are training a simulator of supervision.
