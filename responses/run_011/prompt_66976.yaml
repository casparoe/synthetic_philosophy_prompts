answer: |-
  This is a remarkably precise dissection of a structural flaw that permeates the foundations of probability. You have identified a move that is ubiquitous in the literature but rarely isolated as a distinct argumentative pathology. You are correct that it is not a simple *petitio principii*, nor is it merely the standard skepticism about limits. It is a specific kind of **modal equivocation** regarding the status of the mathematical machinery used to defend an interpretation.

  Here is the analysis of the phenomenon, the available terminology, a proposal for a specific designation, and a criterion for distinguishing its vicious from benign forms.

  ### 1. Existing Terminology

  There is no single, canonical term in the literature that captures this specific *structural slide* across both frequentist and subjectivist interpretations. However, there are three nearby concepts that cover aspects of the phenomenon. None fits perfectly, but together they map the terrain.

  **A. The Circularity Objection (to the Law of Large Numbers)**
  *   **Source:** Prominently discussed by Alan Hájek (e.g., *"Fifteen Arguments against Hypothetical Frequentism"*, 2009) and earlier by Keynes and Von Mises.
  *   **Fit:** This covers the first instance (Frequentism) almost exactly. Hájek notes that invoking the Law of Large Numbers (LLN) to justify the frequentist definition is circular because the LLN is a theorem *about probability*, so it cannot be used to define probability without presupposing it.
  *   **Shortfall:** It is typically framed as a straightforward circularity objection. It does not explicitly name the *defensive maneuver* you identified: the retreat to the theorem's "purely formal" status when the circularity is pointed out. It captures the *error* but not the *evasion*. Furthermore, it is rarely applied symmetrically to the subjectivist case (de Finetti's Representation Theorem), though the structural parallel is exact.

  **B. Equivocation (on the term 'Probability')**
  *   **Source:** General logic and philosophy of science.
  *   **Fit:** This captures the mechanism of the slide. The defender uses "probability" in the *interpreted* sense (physical chance or rational degree of belief) when claiming the theorem connects to the world, and in the *uninterpreted* sense (Kolmogorov measure function) when claiming the theorem is immune to empirical objection.
  *   **Shortfall:** "Equivocation" is too broad. It applies to any argument where a term shifts meaning. It does not capture the specific context of using a *theorem* to bridge a *definition's* empirical gap, nor the specific oscillation between "formal guarantee" and "empirical guarantee."

  **C. The Dormitive Virtue (Molière's *Le Malade Imaginaire*)**
  *   **Source:** Philosophy of explanation.
  *   **Fit:** This captures the explanatory emptiness. Explaining opium's sleep-inducing power by its "dormitive virtue" is like explaining probability's stability by a theorem that presupposes probability.
  *   **Shortfall:** The dormitive virtue is a static tautology. Your cases involve a dynamic *defense*: the theorem is initially presented as a substantive bridge, then retracted to a formal tautology when challenged. The dormitive virtue analogy misses this tactical retreat.

  **Verdict:** There is no established name for the *configuration* itself—the oscillation between formal and empirical readings to evade a circularity charge. The literature treats these as separate objections to specific interpretations (e.g., "The LLN Objection" for frequentism, "The Calibration Objection" for subjectivism) rather than as instances of a unified argumentative structure.

  ### 2. Proposed Term and Definition

  Since the existing terminology is fragmented, I propose the term **The Formal-Empirical Slide** (or, more formally, **The Substantive-Formal Equivocation**).

  **Definition:**
  The **Formal-Empirical Slide** is a defensive argumentative maneuver occurring in the interpretation of formal theories. It arises when:
  1.  **The Claim:** An interpreter defines a theoretical notion $X$ (e.g., probability) in terms of a base notion $Y$ (e.g., limits or betting commitments).
  2.  **The Challenge:** It is objected that $Y$ lacks the empirical or normative connection to the world that $X$ is supposed to have.
  3.  **The Bridge:** The defender invokes a Theorem $T$ to show that $Y$ necessitates $X$-like behavior (e.g., convergence).
  4.  **The Slide:** When challenged that $T$ presupposes $X$ (making the defense circular), the defender retreats to the claim that $T$ is a piece of pure, uninterpreted mathematics (formal).
  5.  **The Failure:** This retreat invalidates the Bridge. If $T$ is purely formal, it cannot establish the empirical connection required in step 3. If $T$ establishes the connection, it is not purely formal and thus begs the question. The defender relies on the theorem being *substantive* to answer the challenge, and *formal* to answer the counter-challenge, without acknowledging the incompatibility.

  **Boundary Conditions:**
  For a case to fall under this label, the following must hold:
  *   **Interpretive Ambition:** The definition must claim to analyze or reduce a pre-theoretic concept (like "physical chance" or "rational belief"), not merely stipulate a formalism.
  *   **Theorem-Dependence:** The defense of the definition's empirical/normative adequacy must rely essentially on a mathematical theorem.
  *   **Status Oscillation:** There must be an unremarked shift in the ontological/epistemic status of the theorem's terms (specifically the defined notion itself) between the "bridge" phase and the "retreat" phase.

  **Exclusions:**
  *   **Pure Formalism:** If a mathematician defines a measure space and proves the LLN without claiming this *is* physical probability, no slide occurs. The theorem remains formal throughout.
  *   **Explicit Modeling:** If a scientist says, "We will *model* physical probability using measure theory, and the LLN shows the model is internally consistent," this is benign. The claim is about the model's structure, not the metaphysical reduction of probability.
  *   **Independent Validation:** If the theorem's applicability is secured by independent empirical premises (not just the definition itself), the circularity is broken.

  ### 3. A Principled Criterion for Vicious vs. Benign Instances

  You asked for a criterion to separate the vicious instances (your two cases) from benign ones (where a definition is legitimately illuminated by a theorem).

  **The Criterion: The Direction of Explication**

  The distinction lies in whether the definition is **Constitutive (Analytic)** or **Model-Based (Synthetic)**.

  *   **Constitutive Claim:** "Probability *just is* $Y$." (The definition is meant to provide the meaning of the concept).
  *   **Model-Based Claim:** "Probability is a concept we possess; we can *represent* it using $Y$." (The definition is meant to model a pre-existing concept).

  **The Rule:**
  *   **Benign:** If the claim is **Model-Based**, invoking a theorem phrased in the vocabulary of $X$ is permissible. You are checking if the model ($Y$) preserves the structural properties of the target concept ($X$). The theorem shows the model is *adequate*, not that it *constitutes* the concept.
  *   **Vicious:** If the claim is **Constitutive**, invoking a theorem phrased in the vocabulary of $X$ is vicious. You cannot use $X$ to prove that $Y$ captures $X$, because $X$ is not yet available except through $Y$. The theorem presupposes the very understanding the definition was supposed to supply.

  **Application to Your Instances:**

  **Instance 1: The Frequentist**
  *   **Claim:** Constitutive. "To say a coin has probability 1/2 *is to say* the limit of frequencies is 1/2."
  *   **Theorem:** LLN (Relative frequency converges to $p$ with *probability* 1).
  *   **Analysis:** The theorem uses "probability" (measure) to guarantee the behavior of the "limit" (definition). Since the definition claims to *be* the analysis of probability, using probability to validate the definition is circular. The retreat to "pure math" fails because the claim was about physical coins, not measure spaces.
  *   **Verdict:** **Vicious.** The Formal-Empirical Slide is active.

  **Instance 2: The Subjectivist**
  *   **Claim:** Constitutive. "Probability *just is* coherent betting commitments."
  *   **Theorem:** de Finetti's Representation Theorem (Coherent commitments imply exchangeability, which implies convergence to a bias with *subjective probability* 1).
  *   **Analysis:** The colleague claims this explains why commitments track *observed frequencies* (data). But the theorem only guarantees convergence *within the agent's belief system*. To claim it connects to *actual* data frequencies requires assuming the subjective probability matches the world's behavior. If the theorem is just about coherence (formal), it doesn't connect to data. If it connects to data, it presupposes the reliability of the subjective probability it was meant to define.
  *   **Verdict:** **Vicious.** The colleague wants the theorem to do empirical work (connecting belief to world) while retaining formal immunity (it's just coherence).

  **A Benign Counter-Example:**
  *   **Claim:** Model-Based. "We do not know what physical chance *is*, but we propose to model it using Kolmogorov axioms."
  *   **Theorem:** LLN.
  *   **Usage:** "The LLN shows that *if* physical chance behaves like a Kolmogorov measure, *then* frequencies will stabilize."
  *   **Analysis:** This does not define chance as the limit. It does not claim the theorem proves chance exists. It merely states a conditional relationship within the model. No slide occurs because no empirical guarantee is claimed for the definition itself, only for the internal consistency of the model.

  ### Summary of the Phenomenon

  The shape of the phenomenon is a **modal displacement of burden**.
  1.  The definition creates a gap between the *reducing base* (frequencies/bets) and the *target concept* (probability).
  2.  The theorem is introduced to fill the gap, acting as a **substantive bridge**.
  3.  The circularity charge threatens to collapse the bridge.
  4.  The defender converts the bridge into a **formal tautology** to save it from collapse.
  5.  But a formal tautology cannot bridge an empirical gap.

  The defender effectively asks for the theorem to be **empirically potent** when needed to silence the skeptic, and **empirically inert** when needed to silence the logician. This is the essence of the **Formal-Empirical Slide**.
