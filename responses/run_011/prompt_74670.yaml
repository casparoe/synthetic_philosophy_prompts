answer: |-
  # Seminar Activity: "The Lockbox Protocol"

  ## 1. Payoff Scheme and Rule Structure

  **Currency:** "Seminar Credits" (SC).
  **Redemption Menu (Revealed only at the very end):**
  *   **12 SC:** "The Pass" (Excuse from one major assignment, no questions asked).
  *   **8 SC:** "The Extension" (48-hour extension on one assignment).
  *   **5 SC:** "The Late" (24-hour extension on one assignment).
  *   **0 SC:** Nothing.
  *   **Non-Credit Item:** High-quality chocolate bar (immediate consumption).

  **Endowment:** Every student receives an envelope containing **5 SC** at the start of class. This is theirs to keep unless spent.

  **The Choice Architecture:**

  1.  **Phase 1 (Planning):** Students choose a **Target Track**.
      *   **Track Gold:** Earn **10 SC** at the end of class (Min 70).
      *   **Track Silver:** Earn **5 SC** at the end of class (Min 70).
      *   *Note:* At this stage, both rewards are delayed. Most will choose Gold (15 SC Total vs 10 SC Total).

  2.  **The Commitment Device (Purchasable at Phase 1 only):**
      *   Students choosing **Track Gold** may purchase a **"Seal"**.
      *   **Cost:** 3 SC (deducted from their starting 5 SC endowment immediately).
      *   **Effect:** If purchased, the option to switch tracks in Phase 2 is physically removed (their envelope is stapled shut).
      *   **Final Payoff if Sealed:** 5 (Endowment) - 3 (Cost) + 10 (Reward) = **12 SC**. (Qualifies for "The Pass").

  3.  **Phase 2 (Temptation - Min 40):**
      *   Students who chose **Track Gold** *without* the Seal are offered a **Switch**.
      *   **Switch Option:** Abandon Track Gold. Receive **5 SC** (Endowment) + **5 SC** (Silver Reward) + **Chocolate Bar Now**.
      *   **Total Value:** 10 SC + Chocolate.
      *   **Stay Option:** Keep Track Gold. Receive **15 SC** at end of class. No Chocolate.

  **Incentive Logic:**
  *   **The Resolute:** Prefer 15 SC over 10 SC + Chocolate. Do not buy Seal. Do not Switch. (Regret if they bought Seal: -3 SC).
  *   **The Weak:** Prefer 10 SC + Chocolate over 15 SC. Will Switch if Unsealed. (Benefit if they bought Seal: Locks them into 12 SC, which is > 10 SC + Chocolate, assuming Chocolate < 2 SC value).
  *   **The Sophisticated:** Know they will be Weak. Buy Seal to secure 12 SC rather than defecting to 10 SC + Chocolate.
  *   **The Mistaken:** Buy Seal thinking they will be Weak, but remain Resolute. They lose 3 SC unnecessarily.

  ## 2. The Forecasters

  **Selection:** 4 Students (selected randomly or volunteers before instructions begin).
  **Role:** They do not participate in the Track choice. They observe the process.
  **Task:**
  1.  After Phase 1 choices are collected (but before Phase 2), Forecasters receive **aggregate data only** (e.g., "15 students chose Gold, 4 bought Seals").
  2.  They must record three predictions on a card:
      *   **P1:** % of Unsealed Gold-choosers who will Switch to Silver.
      *   **P2:** The primary reason students will give for Switching (multiple choice: Boredom, Hunger, Distrust of Reward, Change of Mind).
      *   **P3:** % of Seal-buyers who will express regret in the debrief.
  3.  **Incentive:** If their predictions are within 5% of actual outcomes, they receive **The Extension** (8 SC value) automatically.

  ## 3. Timeline (75 Minutes)

  | Time | Segment | Action |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Distribute envelopes (5 SC inside). Collect phones. Explain that choices affect end-of-class redemption. **Do not mention "weakness of will."** |
  | **05-15** | **Phase 1** | **Decision:** Choose Track (Gold/Silver) and optional Seal. Record on slip, place in envelope, seal it. Hand to TA/Instructor. |
  | **15-20** | **Forecaster Brief** | Forecasters step aside with TA. They get aggregate Phase 1 data and make predictions. |
  | **20-40** | **The Wait** | **Distraction:** Class completes a tedious, low-stakes worksheet (e.g., summarizing a dense paragraph of text). This induces fatigue/boredom to prime present bias. |
  | **40-45** | **Phase 2** | **Temptation:** Return envelopes to Unsealed Gold-choosers. Offer the **Switch** (Silver + Chocolate). Sealed/Sliver students wait. Choices recorded on new slip. |
  | **45-55** | **Redemption** | Collect all materials. Calculate SC totals. Hand out Chocolate to Switchers. Announce Redemption Menu. |
  | **55-75** | **Debrief** | Reveal concepts, compare Forecaster data, discuss philosophical implications. |

  ## 4. Debrief Plan

  **Step 1: The Reveal (5 Mins)**
  *   Announce the Redemption Menu. Hand out the "Passes" and "Extensions."
  *   Reveal the names: **Present Bias**, **Time Inconsistency**, **Commitment Devices**, **Akrasia**.
  *   Ask for a show of hands: Who chose Gold? Who Switched? Who bought the Seal?

  **Step 2: Forecaster Comparison (5 Mins)**
  *   Reveal Forecaster predictions vs. Reality.
  *   *Discussion Point:* Why did the Forecasters over/underestimate the Switch rate? (Usually, people underestimate the pull of the immediate reward when they are in a "cold" state).

  **Step 3: Mapping the Concepts (5 Mins)**
  *   **The Resolute:** Gold, No Seal, No Switch. (Consistent preferences).
  *   **The Weak:** Gold, No Seal, Switch. (Preference reversal: Preferred Gold at T1, Silver at T2).
  *   **The Sophisticated:** Gold, Seal. (Anticipated reversal, paid to prevent it).
  *   **The Regretful:** Gold, Seal, but claims they wouldn't have Switched. (Overestimation of weakness).

  **Step 4: The "Changing Mind" Objection (5 Mins)**
  *   *The Objection:* A clever student will say: "I didn't show weakness of will. At T1 I wanted Gold. At T2 I wanted Chocolate + Silver. Preferences change. That's rational updating, not akrasia."
  *   *The Counter-Argument:* Ask the Switchers: "At T2, did you *wish* you had stuck with Gold? Or did you genuinely prefer the Chocolate?"
      *   If they preferred Chocolate, it's a preference change (Rational).
      *   If they *wished* they had Gold but took Chocolate anyway, that is Akrasia.
      *   *Crucial Pivot:* The **Seal buyers** prove the T1 self *anticipated* the T2 preference change was a mistake. If the T2 preference change were rational, the T1 self wouldn't pay to stop it. The existence of the Commitment demand implies the agent views their future self as *erroneous*, not just different.

  **Step 5: Limitations (5 Mins)**
  *   Acknowledge what the exercise *cannot* do (see below).

  ## 5. Predictable Failure Modes

  1.  **Stake Devaluation:** Students may not value "Homework Passes" enough to feel the pain of losing 3 SC.
      *   *Mitigation:* Verify the privileges are actually desirable to *this* cohort beforehand. If the class is high-achieving, offer "Drop Lowest Quiz Score" instead.
  2.  **The "Free Rider" Problem:** Students might think you won't actually honor the passes.
      *   *Mitigation:* Bring the syllabus. Mark the passes physically in front of them.
  3.  **Seal Cost Miscalibration:**
      *   *If Cost is too high:* No one buys Seals. You lose the "Sophisticated" group.
      *   *If Cost is too low:* Everyone buys Seals. You lose the "Weak" group.
      *   *Fix:* The 3 SC cost (on a 5 SC endowment) is significant (60% of wealth). This usually creates a split.
  4.  **Social Contagion:** If one student loudly announces they are switching, others may follow.
      *   *Mitigation:* Phase 2 choices must be written silently and collected immediately. Do not allow discussion during the Switch offer.
  5.  **Forecaster Boredom:** The 4 forecasters have nothing to do for 20 minutes.
      *   *Mitigation:* Give them a specific observation task (e.g., "Count how many people look at the chocolate during the worksheet").

  ## 6. Limitations of the Exercise (Instructor Notes)

  **What this exercise cannot reproduce:**
  Genuine akrasia (in the Socratic/Aristotelian sense) involves acting against one's **better judgment** regarding the *good*, not just against one's earlier **preference** regarding *utility*.
  *   **The Gap:** In this exercise, switching is merely time-inconsistent. It is not necessarily *immoral* or *irrational* in a deep sense to prefer chocolate now. A student can say, "I value enjoyment now more than a homework pass later," and be coherent.
  *   **What you must supply:** You must argue in the debrief that weakness of will is not just *any* preference reversal, but specifically a reversal where the agent judges the later preference to be **inferior** by their own standards.
  *   **The Argument:** "If you believe your T2 self is right to take the chocolate, why did your T1 self try to bribe you to stop? The very act of buying the Seal is an admission that the T2 temptation is a *corruption* of judgment, not a valid update. True akrasia is recognizing the better course and failing to pursue it *because* of the passion of the moment. This game simulates the structure, but you must supply the normative judgment that the Homework Pass is objectively 'better' for your academic goals than the Chocolate."

  **The "Changing Mind" Defense:**
  Be prepared for the student who says, "I'm just hedonistic."
  *   *Response:* "If you were consistently hedonistic, you would have chosen Silver at T1. Choosing Gold at T1 proves you had a non-hedonic goal (the Pass). Switching at T2 proves you abandoned that goal for a hedonic one. That conflict is the akrasia."

  ## 7. Materials Checklist

  *   24 Envelopes.
  *   120 "Seminar Credit" tokens (paper slips).
  *   24 Choice Slips (Phase 1).
  *   24 Switch Slips (Phase 2).
  *   15-20 Chocolate Bars (enough for ~75% of class).
  *   Printed Redemption Menu.
  *   Stapler (for Seals).
  *   Forecaster Prediction Cards.
