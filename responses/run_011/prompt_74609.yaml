prompt: |-
  third year, thesis chapter on diachronic rationality, and my supervisor has this line she repeats at every meeting: you can't be dynamically incoherent without being statically incoherent, every money pump just proves there's an intransitive preference hiding somewhere in the sequence. I want to build her a counterexample and put it in the chapter, and I want it built tight, because she will check the arithmetic and then check it again.

  Spec, if you can hit it:

  The case. Two paragraphs max. Ordinary setting — a flea market, a food cart, a raffle table at a department event, whatever — but nothing sci-fi, no perfect predictors, no demons, dollar amounts a broke grad student would actually handle. The victim, call her Maya, has a complete and transitive preference ordering over final outcomes (bundles of goods plus cash), and I want that ordering written out explicitly, not just asserted. What Maya does *not* have is contraction consistency: she violates Sen's α. Her choice from a menu depends on what else is on the menu — compromise effect, a decoy, some framing mechanism you like — so she takes A from {A, B} and takes B from {A, B, C}, while still ranking A over B when the two are compared head to head. The counterparty controls the menu: they can add and withdraw options at will, at announced prices, with an announced handling fee.

  The pump. Walk the sequence step by step: what's on offer, what Maya takes, what she pays or recieves. Then a ledger, line by line, ending with her strictly worse off in cash and holding the same goods as she started with. At every single step she has to be taking something she doesn't strictly prefer less than any other item on the menu actually in front of her — no coercion, no arithmetic slips, no hidden prices, and she's allowed to have caught on to the pattern by the second go-round.

  The check. Show me explicitly that nothing static has broken: her outcome-ranking stays transitive and complete, and all of the exploitability comes from menu dependence. That's the whole point of the case — if its only working because some ordering of hers is cyclic after all, the thing is worthless to me and she wins.

  Which feature does the work. If the counterparty loses the power to change the menu, does the case collapse back into a vanilla intransitivity pump, or does it just evaporate? Say which, honestly.

  Sophistication. How much of the leak survives if Maya plans ahead and has no way to precommit? And what if she's allowed to be resolute — pick a plan at the start and stick to it? I suspect the answer is "none of it" and I'd rather find out now than in the viva.

  Her counterattacks. She'll say (i) rationalize over menus rather than outcomes: Maya's real preferences are over menus, those are complete and transitive, so nothing is incoherent anywhere and the pump is just a description of someone paying for context; and (ii) context effects aren't preferences at all, they're noise, so there's no agent in the story to be irrational. Tell me what I can concede to each and still have a live claim, or whether the case is actually dead.

  No bibliography and no references, please — I know the literature, what I need is the construction and the reasoning. Scenario first, then everything else; about 700 words total is fine.
