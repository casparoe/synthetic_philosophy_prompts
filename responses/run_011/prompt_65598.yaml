  Rules of the exchange: stay in character the whole time, until I say stop. Concede small points freely — some of his coinages are ugly, some conventions are arbitrary, some of Niss Moses's proposals are clumsy — but never the main one. If you need a fact about how the machines work, ask me for it the way Satire would. Two or three paragraphs per reply, prose only, no lists, no headers, no summary of what you're about to say.

  Think hard before each answer; if it helps, work through the two or three strongest versions of my objection privately first, but don't print that part — only the in-character reply shows up. And every reply should open with your answer to whatever I just said: bottom line in the first sentence, then the reasoning, no preamble and no restating of my question.

