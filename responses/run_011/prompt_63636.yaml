answer: |-
  Here is the conceptual housekeeping you requested, structured as a numbered menu of theses, followed by an assessment of their utility as decision procedures and a brief note on their legal pedigree.

  ### I. A Menu of Theses on 'Spirit' and 'Letter'

  **1. The Semantic-Propositional Thesis**
  *   **The Letter:** Lexical meaning, syntactic order, and denotative accuracy.
  *   **The Spirit:** The core message, the argument, or the narrative content abstracted from form.
  *   **Evaluation:** **False** (in the context of verse). To treat form as merely 'letter' in poetry is to deny that form constitutes meaning. In a poem about an earworm, the repetitive form *is* the content.
  *   **Licenses:** **Neither.** This thesis would demand lexical fidelity above all. It cannot justify dropping the monorhyme (a formal feature) nor does it necessarily demand keeping the refrain if the words can be varied without losing propositional content. It fails to account for the convenor's formal interventions.

  **2. The Receptor-Response Thesis**
  *   **The Letter:** The specific mechanical devices employed in the source text (e.g., the specific rhyme sound, the specific repeated word).
  *   **The Spirit:** The psychological or aesthetic effect produced in a competent reader of the original (e.g., the sensation of comic obsession, the feeling of natural speech).
  *   **Evaluation:** **Substantive and Defensible.** This aligns with Nida's 'dynamic equivalence'. It acknowledges that a mechanism producing a specific effect in Language A may produce a different effect in Language B.
  *   **Licenses:** **Both.**
      *   *Move 1 (Drop monorhyme):* In the source language, monorhyme is natural (generous inventory); in English, it is obtrusive (poor inventory). To preserve the 'comic' spirit (natural irritation) rather than the 'letter' (rhyme scheme), one must drop the monorhyme to avoid turning the poem into a formal stunt.
      *   *Move 2 (Keep refrain):* The refrain enacts the earworm. To cut it for lexical ease would destroy the 'spirit' (the sensation of obsession), even if keeping it violates the 'letter' of idiomatic variety.

  **3. The Cultural-Normative Thesis**
  *   **The Letter:** Idiosyncratic features of the source culture's poetic tradition (e.g., tolerance for monorhyme).
  *   **The Spirit:** The expectations and norms of the target culture's poetic tradition (e.g., English lyric norms).
  *   **Evaluation:** **Substantive but Risky.** This prioritises the target literature's health over the source text's alterity. It is defensible as a strategy for assimilation but false if the goal is to present the foreignness of the original.
  *   **Licenses:** **Move 1 only.** It justifies dropping the monorhyme because it violates English norms. However, it struggles to license Move 2 (keeping the refrain), as English lyrics often avoid strict refrains in short stanzas unless it is a ballad or song. Insisting on the refrain here seems to privilege the source norm over the target norm, contradicting this thesis.

  **4. The Functional-Structural Thesis**
  *   **The Letter:** The surface manifestation of a constraint (e.g., the sound of the rhyme, the exact wording of the refrain).
  *   **The Spirit:** The generative function of the constraint within the poem's system (e.g., 'constraint as mimicry of mental stuckness').
  *   **Evaluation:** **Substantive and Defensible.** This treats the poem as a machine where parts serve a function. If a part breaks in translation, it must be replaced by one that serves the same function, not necessarily the same shape.
  *   **Licenses:** **Both.**
      *   *Move 1:* The monorhyme's function in the source is 'unity/flow'; in English, its function becomes 'display of skill'. To keep the spirit (flow/obsession), the letter (monorhyme) must go.
      *   *Move 2:* The refrain's function is 'recurrence'. Even if untranslatable lexically, the structural recurrence must remain to serve the function of the earworm.

  ### II. Decision Procedure vs. Post-Hoc Label

  None of the readings above serve as a rigorous **decision procedure** in the algorithmic sense. A decision procedure requires a hierarchy of values established *prior* to the act of translation (e.g., "Effect always trumps Form" or "Form always trumps Lexis").

  The phrase 'faithful to the spirit, not the letter' functions primarily as a **post-hoc label**. It is a rhetorical tool used to legitimise a choice already made on intuitive or aesthetic grounds.
  *   In the first instance, the convenor intuited that the English monorhyme felt like a 'stunt'. He then categorised 'monorhyme' as *letter* and 'comic naturalness' as *spirit* to justify the cut.
  *   In the second instance, he intuited that the poem collapsed without the refrain. He then categorised 'refrain' as *spirit* (essential structure) to justify its retention.

  For this phrase to operate as a decision procedure, the workshop would need to agree on a fixed definition of 'spirit' for the specific text before translation begins (e.g., "The spirit of this poem is defined strictly as the reader's sensation of claustrophobia"). Without such a pre-agreed metric, 'spirit' remains a movable feast, expanding or contracting to accommodate the translator's or teacher's preference.

  ### III. The Legal Pedigree

  The migration of this distinction from statutory interpretation to translation is seductive but ultimately undisciplined.

  In law, the distinction between the letter and the spirit (often codified as the 'mischief rule' or purposive construction) is kept disciplined by three factors absent in translation:
  1.  **Sovereign Intent:** There is a legislature whose recorded debates (Hansard) can be consulted to ascertain the 'spirit' or purpose of the law. In translation, the author is often absent, dead, or their intent is inaccessible (the 'intentional fallacy').
  2.  **Precedent:** Courts rely on *stare decisis*. Translation theory lacks a binding case law; every text is a new jurisdiction.
  3.  **Adversarial Testing:** Legal interpretations are stress-tested by opposing counsel. Workshop critiques are often consensual or hierarchical, lacking a formal mechanism to test the validity of the 'spirit' being invoked.

  Consequently, the legal pedigree lends the phrase an air of authority it does not possess in the arts. In law, appealing to the spirit is a method of avoiding absurdity while remaining within a system of rules. In translation, appealing to the spirit is often a method of evading the rules of the source text without admitting to it. The distinction does not transfer well because translation lacks the institutional machinery to define whose 'spirit' counts.

  ***

  **Summary for your rendering:**
  Your convenor is operating primarily under **Thesis 2 (Receptor-Response)** and **Thesis 4 (Functional-Structural)**. He views the monorhyme as a mechanism that fails to produce the correct *effect* in English (becoming a stunt rather than a symptom of obsession), but views the refrain as a mechanism that successfully produces the correct *effect* (enacting the stuck tune). He is not being logically inconsistent so much as functionally pragmatic: he is judging each formal element by its capacity to survive the transfer of *function* rather than *form*. However, be aware that without a pre-agreed definition of 'function', this remains a justification for his taste, not a rule for your practice.
