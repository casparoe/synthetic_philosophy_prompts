  **PREP SHEET: CURRICULUM REVIEW COMMITTEE**

  **(1) How they will hear it**
  To the Chair, this is a standards violation waiting for a headline. To the AP veteran, it is developmental malpractice to put college-level sourcing on fourteen-year-olds. The Union rep hears unpaid prep time and liability for classroom fights. The activist sees a Trojan horse for ideology disguised as neutrality. The Colonel hears confusion instead of patriotism. The Korean parent hears potential trauma from sanitized Japanese texts. The Assessment Coordinator sees a unit that cannot be scored on a bubble sheet. The Board member sees new costs. The second retired teacher hears classroom chaos. Everyone hears a plan making their job harder without solving their problem.

  **(2) The objections**

  1.  **Assessment Coordinator**
      *   **Question:** "State tests measure content mastery, not adjudication skills. How do you guarantee test scores don't drop when we spend weeks on disagreement?"
      *   **Force:** If this violates state accountability metrics, the proposal is illegal.
      *   **Reply:** "We map the adjudication skill to existing state standards for reading comprehension and evidence analysis. The content remains the same; the depth changes. If students can analyze conflicting texts, they can handle state test passages."
      *   **Soft Spot:** Hard to prove without pilot data.
      *   **Severity:** Fatal if unanswered.

  2.  **Union Representative**
      *   **Question:** "If a parent sues over a text, is the teacher protected? Who pays for the prep time to find these pairs?"
      *   **Force:** Teachers will not adopt a plan that exposes them to liability or unpaid labor.
      *   **Reply:** "The district provides the pairs, not the teachers. We need a policy shield for teachers following this protocol, treating it like any other adopted material."
      *   **Soft Spot:** District may refuse to indemnify teachers on contested content.
      *   **Severity:** Fatal if unanswered.

  3.  **AP History Teacher**
      *   **Question:** "Eighth graders lack the cognitive framework to evaluate conflicting primary sources without defaulting to opinion. Isn't this confusing them?"
      *   **Force:** Challenges the pedagogical validity; makes you look naive about child development.
      *   **Reply:** "We scaffold the reasoning. We aren't asking for college seminars. We are asking them to identify who is speaking and what evidence is used. Confusion is the starting point for learning."
      *   **Soft Spot:** Some students genuinely lack the reading level.
      *   **Severity:** Serious.

  4.  **Korean-American Parent**
      *   **Question:** "Japanese texts often minimize wartime atrocities. Is my child safe hearing that in class, or will it feel like the district validates denial?"
      *   **Force:** Ethical risk; could mobilize community opposition based on harm to students.
      *   **Reply:** "I understand the pain. The goal isn't to validate the minimization, but to teach students to spot it using evidence. We prepare them for the world as it is, not as we wish it to be."
      *   **Soft Spot:** Emotional risk remains high regardless of pedagogical intent.
      *   **Severity:** Serious.

  5.  **Parents'-Rights Activist**
      *   **Question:** "Neutrality between truth and falsehood is immoral. Who decides which accounts are 'genuine' enough to be paired?"
      *   **Force:** Accuses you of hiding ideology behind procedure.
      *   **Reply:** "We pick accounts that hold cultural weight in current debates, not fringe lies. The skill is checking the claim, not accepting all claims as equal."
      *   **Soft Spot:** "Cultural weight" is subjective.
      *   **Severity:** Serious.

  6.  **Retired Lt. Colonel**
      *   **Question:** "Does this teach kids that America's founding is equally debatable as facts? We need unity, not relativism."
      *   **Force:** Taps into fear of unpatriotic outcomes.
      *   **Reply:** "It teaches them to handle debate when it exists, not to invent it. A citizen who can check a claim is more loyal than one who just repeats it."
      *   **Soft Spot:** Nuance is hard to convey quickly.
      *   **Severity:** Serious.

  7.  **Committee Chair**
      *   **Question:** "How do we document alignment? I need to show the state this isn't rogue teaching."
      *   **Force:** Bureaucratic hurdle; creates work for the Chair.
      *   **Reply:** "We create a simple mapping document linking the adjudication tasks to state standard codes for analysis."
      *   **Soft Spot:** Requires admin work the Chair may not want to do.
      *   **Severity:** Manageable.

  8.  **Board Member (Dealership)**
      *   **Question:** "Do we need to buy new textbooks or licenses for this?"
      *   **Force:** Budget constraints are real, even if minor.
      *   **Reply:** "No. Excerpts only. Digital or photocopy. The cost is negligible compared to new book adoption."
      *   **Soft Spot:** Printing costs add up over time.
      *   **Severity:** Manageable.

  9.  **Retired Teacher 2**
      *   **Question:** "Won't this lead to shouting matches in the classroom? How do you stop kids from fighting?"
      *   **Force:** Classroom management concern.
      *   **Reply:** "Grading is on written reasoning, not classroom debate. The adjudication happens on paper, quietly."
      *   **Soft Spot:** Kids still talk.
      *   **Severity:** Softball.

  **(3) What I concede in the first two minutes**
  1. "I am not asking teachers to create these materials from scratch; the district must provide the pairs."
  2. "I acknowledge this will not raise state test scores in year one, and may temporarily lower them."
  3. "I agree that some historical facts are not up for debate, and this method applies only to contested interpretations."
  4. "I understand that for some families, seeing certain texts in a classroom is painful, not just academic."

  **(4) The one reply that has to land**
  Look around this table. You represent every side of the culture war in this district. If you cannot agree on the story, the story will not settle. The fight moves to the dinner table, taught badly. My proposal does not ask you to agree on history. It asks you to agree on a skill. When a student sees two conflicting claims, can they check the evidence? That skill serves the Colonel's desire for critical citizens, the activist's desire for vigilance, and the Coordinator's need for reading comprehension. We are not teaching them what to think about 1776 or 1945. We are teaching them how to survive the argument about 1776 and 1945 that will happen whether we teach it or not. Let them fight with evidence in here, so they don't fight with insults out there.

  **(5) The question I am hoping nobody asks**
  *   **Question:** "What happens when a student uses perfect reasoning to defend a factually false account? Do they get an A?"
  *   **Why it is hard:** It attacks your core rule ("grading on reasoning, never on verdict"). If you say "no," you are judging the verdict. If you say "yes," you look like you endorse lies.
  *   **Least-bad answer:** "Then we correct the facts separately. Reasoning is the skill, accuracy is the constraint. You can't build a valid argument on a lie, so part of the grading rubric is verifying the premise. We teach them that evidence includes factual accuracy."

  **(6) Three sentences to strike from my own draft**
  1. "Studies show this improves critical thinking." (You have no citations; the AP teacher will ask for them.)
  2. "This will end the culture wars in our district." (Overpromise; the activist and Chair know this is impossible.)
  3. "Teachers will find this easier than traditional lesson planning." (The Union rep knows this is false and will resent the implication.)
