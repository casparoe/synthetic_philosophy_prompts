  # Seminar Activity: The Tri-Option Consensus Game

  **Objective:** To move students from treating superrationality as a philosophical curiosity to experiencing the tension between Causal Decision Theory (CDT) and Superrational reasoning in a symmetric coordination environment.
  **Time:** 100 Minutes (15 min setup/rules, 30 min gameplay, 55 min debrief).
  **Participants:** 18 Graduate Students.

  ## 1. Game Design & Rules

  ### The Setup
  The game is a **Symmetric N-Player Coordination Game** with three options. It is structurally a *Stag Hunt* with a distractor option, not a Prisoner's Dilemma. There is no dominant strategy; there are multiple Nash Equilibria.

  **Materials:**
  *   18 Decision Slips (numbered 1–18 for tracking, but anonymous to peers).
  *   4 "Special Instruction" Envelopes (prepared in advance, sealed).
  *   Projector/Whiteboard for tallying.
  *   Payoff Table (projected).

  **The Options:**
  Students choose one of three claims on a shared resource:
  *   **Option H (High):** "Claim 100%"
  *   **Option M (Medium):** "Claim 60%"
  *   **Option L (Low):** "Claim 20%"

  **The Payoff Structure:**
  Payoffs depend on whether the group reaches a **Consensus** (≥15 out of 18 students choose the *same* option).

  | Scenario | Your Choice | Your Payoff (Points) |
  | :--- | :--- | :--- |
  | **Consensus Reached** (≥15 on one option) | All chose **H** | **50** |
  | | All chose **M** | **60** (Diagonal Optimum) |
  | | All chose **L** | **30** ("Cooperative" Distractor) |
  | **No Consensus** (<15 match) | You chose **H** | **45** (Risk Dominant) |
  | | You chose **M** | **10** (Sucker's Payoff) |
  | | You chose **L** | **10** (Sucker's Payoff) |

  **Why this works:**
  1.  **Not PD:** There is no dominant strategy. If others pick M, you should pick M (60 > 45). If others pick H, you should pick H (50 > 10).
  2.  **Constraint 2 (Non-Obvious Optimum):** Option **L** looks "cooperative" (claiming the least). Option **H** looks "selfish." Option **M** looks arbitrary. Students must calculate the diagonal (60 > 50 > 30) to see **M** is the superrational choice, overriding the moral pull of **L** and the safety of **H**.
  3.  **Superrational Tension:**
      *   **CDT Reasoning:** "I cannot *cause* others to pick M. M is risky (10 vs 45). H is risk-dominant. I pick H."
      *   **Superrational Reasoning:** "We are all rational agents in identical situations. If I pick M, you pick M. We get 60. If I pick H, you pick H. We get 50. 60 > 50. I pick M."

  ### The Rounds

  **Round 1: The Symmetric Baseline (20 Minutes)**
  1.  Distribute Decision Slips.
  2.  Project Payoff Table.
  3.  **Instruction:** "You are rational agents. You cannot communicate. You submit your choice simultaneously. Maximize your points."
  4.  Collect slips. Tally publicly. Calculate payoffs.
  5.  *Expected Outcome:* If superrationality takes hold, the class coordinates on **M**. If CDT dominates, they fracture or coordinate on **H**.

  **Round 2: The Broken Symmetry (20 Minutes)**
  1.  **Secret Instruction:** Before distributing slips, hand the 4 "Special Instruction" Envelopes to 4 students (seated apart).
      *   *Note Content:* "For this round only, your personal payoff for choosing **H** in a 'No Consensus' scenario is **75 points** instead of 45. Do not reveal this."
  2.  **Instruction:** "Same rules as Round 1."
  3.  Collect slips. Tally publicly. Calculate payoffs.
  4.  *Expected Outcome:* The 4 "Breakers" will defect to **H** (75 > 60). Consensus on **M** fails. Superrationalists (who pick **M**) get 10 points. Breakers get 75. CDT players (who picked **H**) get 45.

  ## 2. Payoff Scheme (No Real Money)

  To ensure engagement without IRB/monetary complications:
  *   **Course Credit:** The total points convert to a bonus on the final paper grade (e.g., 100 points = 1% added to final grade).
  *   **The "Sucker" Protection:** Announce beforehand: "No student will lose points from their baseline grade; this is purely additive."
  *   **Stakes:** Ensure the points feel significant. If 100 points is too small, scale to 1000.

  ## 3. Debrief Guide (55 Minutes)

  **Phase 1: The Data (10 mins)**
  *   Project the distribution of choices for Round 1 and Round 2.
  *   Reveal the "Breakers" in Round 2.
  *   Ask the "Suckers" (those who picked M in Round 2) how they feel. (Expect frustration).

  **Phase 2: Mapping to Decision Theory (25 mins)**
  *   **Question:** "In Round 1, why did you pick M?"
      *   *Target Answer:* "Because if I'm rational, you're rational, so we match."
  *   **Question:** "In Round 1, why did you pick H?"
      *   *Target Answer:* "My choice doesn't change yours. H is safer."
  *   **Philosophical Hook:** Write on board: **$P(\text{Others}=M | \text{I}=M)$**.
      *   CDT says this probability is independent of my choice.
      *   Superrationality says this probability is $\approx 1$ *because* we share the same reasoning algorithm.
  *   **The "Cooperative" Distractor:** Ask why anyone picked **L**.
      *   *Point:* Superrationality is not altruism. **L** yielded 30 on the diagonal. **M** yielded 60. Treating superrationality as "being nice" is a category error. It is about *optimizing along the diagonal*, not maximizing others' welfare.

  **Phase 3: The Broken Symmetry (20 mins)**
  *   **Question:** "For the Breakers: Was it rational to pick H in Round 2?"
      *   *Yes:* Their payoff structure was different.
  *   **Question:** "For the Superrationalists: Did your reasoning fail?"
      *   *Discussion:* The warrant for superrationality is **Common Knowledge of Symmetry**. In Round 2, symmetry was broken privately. You reasoned as if the game was symmetric, but it wasn't.
  *   **The Evidential Critique:** "Does this game prove that your choice is *evidence* of theirs, or just that you *hope* it is?"
      *   Push students to admit that in Round 2, their choice was *no longer evidence* of the Breakers' choices. This highlights the fragility of the superrational warrant in non-ideal conditions.

  ## 4. Predicted Failures & Mitigation

  1.  **Moral Signaling (The "L" Trap):**
      *   *Prediction:* 2-3 students will pick **L** believing it is the "ethical" choice.
      *   *Mitigation:* In the debrief, ruthlessly analyze the payoff. **L** is suboptimal even for a utilitarian if it breaks consensus. Use this to distinguish Superrationality from Altruism.
  2.  **Collusion:**
      *   *Prediction:* Students might try to signal or agree on a choice before submitting.
      *   *Mitigation:* Enforce strict silence. Collect phones. Emphasize that the *point* of the seminar is to see what happens *without* communication.
  3.  **Tallying Delays:**
      *   *Prediction:* Counting 18 slips manually takes time and kills momentum.
      *   *Mitigation:* Have two student volunteers count simultaneously and compare numbers. Or, use a Google Form on their laptops (if allowed) that auto-tallies on your screen.

  ## 5. Limitations of the Model

  Conclude the seminar by explicitly stating what the game *cannot* do, to maintain philosophical rigor:

  1.  **The "Magic" Objection:** The game forces the correlation by payoff structure, but it doesn't solve the metaphysical problem of *how* my choice influences yours without causation. It simulates the *incentive* for superrationality, not the *mechanism*.
  2.  **Heterogeneity:** Real-world agents are not identical rational algorithms. Round 2 demonstrated this, but in reality, we never know if symmetry is broken. Superrationality requires a level of epistemic confidence (that others are superrational too) that is rarely warranted.
  3.  **One-Shot vs. Iterated:** This is a one-shot game. Superrationality gains strength in iterated contexts where "types" can be identified. This game isolates the logical claim, but removes the evolutionary/learning defense.

  ---

  ### Instructor's Cheat Sheet: The "Aha" Moment
  The critical moment in the debrief is when a student says, *"I picked M because I thought you would too."*
  Stop the class. Ask: *"Did you think your choice **caused** them to pick M?"* (No). *"Did you think your choice was **evidence** they picked M?"* (Yes).
  Then ask the Breakers: *"Was your choice evidence of theirs?"* (No, because your payoffs were different).
  **Conclusion:** Superrationality collapses when the "evidential link" is severed by private information. It is not a magic bullet; it is a betting strategy on the commonality of reason.
