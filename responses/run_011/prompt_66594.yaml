      Superrationality claims you don't need *trust*, you need *logic*. "They are rational like me."
      This distinction is subtle but crucial for grad students.
      To make it sharper: Make A look "Cooperative".
      Let A = "Contribute". B = "Withhold".
      No, let's stick to the Constraint 2: Diagonal Optimum (B) must not look most cooperative.
      Let A = "High Claim" (Looks greedy).
      Let B = "Medium Claim" (Looks reasonable).
      Let C = "Low Claim" (Looks altruistic).
      Payoffs:
      Consensus A: 50.
      Consensus B: 60.
      Consensus C: 30.
      No Consensus:
      Pick A: 45.
      Pick B: 10.
      Pick C: 10.
      Analysis:
      If Others A: I pick A (50) vs B (10). Pick A. (All-A is Nash).
      If Others B: I pick B (60) vs A (45). Pick B. (All-B is Nash).
      So it's a Stag Hunt.
      Why would CDT pick A? Risk dominance. (Loss from mismatch: A->B loss 40. B->A loss 15).
      Actually, loss from mismatch for B is 60-10=50. Loss for A is 50-10=40.
      A is risk dominant. CDT might pick A.
      Superrationalist picks B because 60 > 50.
      This works. It's not PD (no dominant strategy). It forces diagonal comparison.
      And C (Altruistic) is a distractor.

      *Refining the "Broken Symmetry":*
      Give 4 students a card: "Your payoff for Option A in No Consensus is 70."
      Now for them, A is dominant (70 > 60).
      They will pick A.
      Consensus B fails.
      Superrationalists (picking B) get 10.
      Breakers (picking A) get 70.
      Regular CDT (picking A) get 45.
      This creates a nice spread of outcomes to discuss.

      *Wait, one more check on Constraint 1:* "Not a Prisoner's Dilemma... played often enough to perform the lesson."
      Stag Hunt is distinct enough from PD. The lesson is about *equilibrium selection via identity* rather than *overcoming dominance*. This fits Superrationality well (Hofstadter often discussed PD, but the core logic applies to equilibrium selection in symmetric games). I will explicitly frame it as "Symmetric Coordination" to distinguish from PD.

      *Final check on Constraint 2:* "Diagonal optimum must not be the option that looks most cooperative."
      Option C (Low Claim) looks most cooperative.
      Option B (Medium Claim) is the Diagonal Optimum.
      Students must calculate to see B > C.
      Perfect.

      *Materials:* Slips, Projector, Envelopes for secret instructions.
      *Payoff:* Course credit points (e.g., 0.5% of final grade max) or just "Class Points" towards a pizza party. Let's suggest "Class Points" to avoid ethics board issues with money/grades in a thought experiment context, but make it high stakes enough to care. I'll suggest "Extra Credit Tokens".

      *Predicted Failures:*
      1.  Students talk during play. (Enforce silence).
      2.  Students pick C anyway (moral signaling). (Address in debrief).
      3.  Tallying errors. (Use a spreadsheet projected live).

      *Limitations:*
      1.  Real life isn't perfectly symmetric.
      2.  Doesn't solve the "Why should I care about the diagonal?" normative question.

      Okay, ready to write.
