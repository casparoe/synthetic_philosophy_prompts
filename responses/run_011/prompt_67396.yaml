answer: |-
  (a) **Criteria for Monetization Durability**

  To score these items, I am applying three criteria derived from the economic sociology apparatus:
  1.  **Earmarking and Fungibility:** Is the transfer made in general-purpose cash (high contamination risk) or in a restricted vehicle like vouchers, permits, or segregated accounts (low contamination risk)?
  2.  **Semantic Register:** Is the payment framed linguistically and institutionally as a "price" (market exchange), "compensation" (reimbursement for loss/time), or "incentive" (behavioral nudge)?
  3.  **Institutional Mediation:** Is the monetary flow direct between individuals (high scrutiny) or buffered by a state or corporate intermediary (low scrutiny)?

  **Heavy Lifter:** **Earmarking and Fungibility.** Whether a monetary form survives in a repugnant context depends most heavily on whether the vehicle restricts what the money can touch. General-purpose cash invites the accusation of commodification; restricted vehicles allow actors to claim the money is "not for the thing itself" but for associated costs or compliance.

  ***

  (b) **Scores and Tiers**

  1.  **Cash payment to subjects for participation in a Phase I clinical trial.**
      *   **Score:** 85 (High Durability)
      *   **Tier:** Institutionalized Compensation
      *   **Explanation:** Durability is high because the payment is registered as "compensation for time and inconvenience" rather than a price for bodily risk, and it is mediated through ethics boards that restrict the cash to specific protocols.

  2.  **Compensated living kidney donation.**
      *   **Score:** 5 (Radioactive)
      *   **Tier:** Prohibited Market
      *   **Explanation:** The monetary form is almost exclusively general-purpose cash, which immediately triggers the "trafficking" register; no restricted vehicle (e.g., tax credit) has successfully displaced the cash frame to allow scale.

  3.  **Commercial surrogacy under written contract.**
      *   **Score:** 45 (Contested)
      *   **Tier:** Jurisdictionally Fragmented
      *   **Explanation:** Durability varies because contracts attempt to re-engineer the payment as "expenses and services" rather than a baby price, but the underlying cash transfer often leaks into the "commodification" register, causing political backsliding.

  4.  **Tradable permits priced per tonne of carbon dioxide.**
      *   **Score:** 90 (Unremarkable)
      *   **Tier:** Regulatory Asset
      *   **Explanation:** The vehicle is a tradable permit, not a direct cash bribe for pollution; this earmarking allows firms to treat the cost as operational compliance rather than a moral transaction, insulating it from repugnance.

  5.  **Individually transferable catch quotas in commercial fisheries.**
      *   **Score:** 85 (Unremarkable)
      *   **Tier:** Property Right
      *   **Explanation:** The monetary value is embedded in a quota asset (a right to catch) rather than a cash bounty per fish; this form shifts the register from "killing for cash" to "managing a portfolio," sustaining durability.

  6.  **Cash transfers to poor households made conditional on school attendance and vaccination.**
      *   **Score:** 90 (Unremarkable)
      *   **Tier:** Social Contract
      *   **Explanation:** The conditionality acts as an earmark that distinguishes the money from "welfare" or "bribes"; it is framed as an investment in human capital, which sustains political support despite the cash transfer.

  7.  **Payments in cash or vouchers to drug-dependent patients for verified abstinence.**
      *   **Score:** 60 (Moderate Durability)
      *   **Tier:** Clinical Incentive
      *   **Explanation:** Durability is higher when vouchers (restricted vehicle) are used rather than cash, as vouchers prevent the register from shifting to "funding addiction"; cash payments face higher public resistance.

  8.  **Lump-sum payments to poor women for accepting long-acting contraception.**
      *   **Score:** 15 (Radioactive)
      *   **Tier:** Coercive Incentive
      *   **Explanation:** The lump-sum cash form creates a direct price on fertility control, which triggers eugenics and coercion frames; no earmarking has successfully insulated this transaction from the "bribe" register.

  9.  **Paid queue-jumping: commercial line-standing services and premium fast-pass pricing.**
      *   **Score:** 80 (High Durability)
      *   **Tier:** Service Fee
      *   **Explanation:** The payment is framed as purchasing a "time-saving service" or "priority access" rather than buying a place in line; this semantic shift in the register allows the market to operate without significant controversy.

  10. **Paid plasma donation in jurisdictions where it is legal.**
      *   **Score:** 85 (High Durability)
      *   **Tier:** Compensated Time
      *   **Explanation:** Durability relies on the strict separation of plasma (compensated fee-for-time) from whole blood (gift); the vehicle is a clinical fee, not a commodity price, which prevents the "selling blood" stigma from collapsing the market.

  11. **Corporate naming rights over public stadiums and schools.**
      *   **Score:** 90 (Unremarkable)
      *   **Tier:** Sponsorship
      *   **Explanation:** The money is earmarked as "sponsorship" for maintenance or operations, not a direct purchase of the institution; this register allows the monetization to become invisible background noise.

  12. **Performance bonuses for teachers tied to student standardized-test scores.**
      *   **Score:** 50 (Contested)
      *   **Tier:** Professional Incentive
      *   **Explanation:** Durability is unstable because the cash bonus shifts the register from "professional duty" to "piecework labor"; the monetary form frequently conflicts with the moral economy of education, leading to policy reversals.

  13. **Paying citizens a flat sum for turning out to vote.**
      *   **Score:** 10 (Radioactive)
      *   **Tier:** Corruption
      *   **Explanation:** General-purpose cash for voting is universally categorized as bribery or vote-buying; no vehicle (voucher or credit) has successfully re-engineered this into an "honorarium" register in democratic contexts.

  14. **Bounties paid per specimen for invasive species.**
      *   **Score:** 85 (High Durability)
      *   **Tier:** Pest Control
      *   **Explanation:** The payment is framed as a "bounty" for pest elimination rather than a price for life; the earmarking of funds for environmental protection insulates the transaction from animal welfare repugnance.

  ***

  (c) **Divergences: Moral Intuition vs. Monetization Durability**

  **Pair 1: Compensated Kidney Donation (2) vs. Paid Plasma Donation (10).**
  *   **Divergence:** Moral intuition often groups these together as "selling body parts," yet Kidney Donation scores 5 (Radioactive) while Plasma scores 85 (High Durability).
  *   **Explanation:** The apparatus captures a distinction intuition misses: the monetary vehicle. Plasma is paid via a "fee-for-time" in a clinical setting (earmarked compensation), whereas kidney compensation is typically structured as a lump-sum cash transfer (price for organ). The durability of plasma markets proves that bodily monetization is possible if the *form* restricts the money from appearing as a commodity price.

  **Pair 2: Paying to Vote (13) vs. Carbon Permits (4).**
  *   **Divergence:** Intuition suggests voting is a sacred civic duty and pollution is a moral harm, yet Paying to Vote scores 10 while Carbon Permits score 90.
  *   **Explanation:** The intuition tracks the *good* (democracy vs. environment), but durability tracks the *flow*. Carbon permits are B2B regulatory assets (restricted vehicle, compliance register), while voting payments are direct cash-to-citizen (general cash, corruption register). The apparatus shows that repugnance is not inherent to the good but to the directness and fungibility of the payment.

  ***

  (d) **Vehicle Design and Counterfactual**

  **Case:** Paid Plasma Donation (10).
  **Design Choice:** The durability of this market is attributable almost entirely to the vehicle being a "compensation for time" processed through a medical ledger, rather than a "price per pint" paid in cash.
  **Counterfactual:** If the vehicle were switched to general-purpose cash handed directly to donors per unit of blood collected (matching the kidney model), the practice would likely face immediate prohibition. The politics would shift from "public health resource" to "exploitation of the poor," and the supply would collapse due to safety fears associated with "selling blood." Conversely, if Whole Blood donation were switched to this compensated vehicle, the voluntary supply would likely evaporate (the Titmuss effect), demonstrating that the *segregation* of the monetary form is what sustains the dual system.

  ***

  (e) **Ranking by Potential for Re-engineering**

  *This ranking orders items by the degree to which a change in monetary form (e.g., cash to voucher, price to honorarium) could increase durability, holding the good fixed.*

  1.  **Compensated living kidney donation** (High Potential: A tax credit or lifetime health insurance vehicle could theoretically displace the cash/trafficking frame).
  2.  **Paying citizens to vote** (High Potential: Framing as a "civic honorarium" or tax credit rather than cash might reduce corruption framing, though still difficult).
  3.  **Lump-sum payments for contraception** (High Potential: Shifting to healthcare credits rather than cash could reduce coercion narratives).
  4.  **Commercial surrogacy** (Medium-High: Standardizing "expense reimbursement" vehicles could stabilize the market).
  5.  **Payments for drug abstinence** (Medium: Vouchers already work better than cash; standardization could help).
  6.  **Teacher performance bonuses** (Medium: Shifting to school-level grants rather than individual cash might reduce professional resentment).
  7.  **Phase I clinical trials** (Low-Medium: Already optimized, but further earmarking could reduce stigma).
  8.  **Paid plasma donation** (Low: Already highly engineered).
  9.  **Paid queue-jumping** (Low: Already optimized as service fee).
  10. **Bounties for invasive species** (Low: Already optimized as pest control).
  11. **Conditional cash transfers** (Low: Already highly engineered).
  12. **Naming rights** (Low: Already optimized as sponsorship).
  13. **Individually transferable catch quotas** (Low: Already optimized as property rights).
  14. **Tradable carbon permits** (Zero: Already optimized; the good is abstract enough that form matters less).

  **Items with Essentially Zero Potential:** **Tradable Carbon Permits (4)** and **Naming Rights (11).**
  **Reason:** For these items, the monetary form is already so abstracted from the underlying good (pollution, school identity) that further re-engineering yields diminishing returns. The "good" itself has been successfully transformed into a financial asset or sponsorship opportunity; the repugnance has already been engineered out. Conversely, **Kidney Donation (2)** and **Voting (13)** have low potential not because the form is optimized, but because the *good* (vital organ integrity, democratic equality) resists monetary valuation regardless of the vehicle; the moral boundary is too rigid for form to bridge it.

  ***

  (f) **Disconfounding Age and Durability**

  To persuade me that this scale measures *monetary form durability* rather than simply the *age of the practice*, I would require three specific types of evidence:

  1.  **Rapid Stabilization of New Forms:** Evidence of a recently introduced monetary vehicle (e.g., Carbon Permits in the 2000s) achieving high durability scores (90+) within a decade, outperforming older practices (e.g., Teacher Bonuses, tried for decades) that remain contested (50%). This shows that design, not time, drives unremarkability.
  2.  **Historical Reversals via Re-Monetization:** Cases where an old, stable non-market practice collapsed *after* a specific monetary form was introduced. For example, if voluntary blood donation rates dropped precisely when "compensation" was linguistically or legally shifted to "wages," it would prove the form drives the outcome, not the passage of time.
  3.  **Cross-Jurisdictional Form Variance:** Simultaneous data from two regions with the same cultural age/history but different monetary vehicles for the same good. If Region A uses vouchers for drug abstinence (high durability) and Region B uses cash (low durability) at the same point in time, age is controlled for, isolating the vehicle as the causal variable.
