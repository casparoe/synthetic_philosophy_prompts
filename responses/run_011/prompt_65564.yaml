prompt: |-
  I am in the second term of a philosophy of social science module, and for our reconstruction exercise each of us has to rebuild a contested methodological thesis as a numbered argument and then say where it fails. I chose the position defended in Friedman's 1953 essay on the methodology of positive economics: that a theory is to be judged by the accuracy of its predictions, and that the realism of its assumptions is not a separate criterion. My difficulty is that my reconstruction appears to go through, and it proves considerably more than the position it was meant to capture. I would like to know which step to reject and what the rejection costs.

  First the case, since the argument depends on it. Consider two models of how a firm sets output. Model M says the firm continuously equates perceived marginal revenue with perceived marginal cost and revises whenever either moves. Model N says the firm does nothing of the sort: it applies a fixed markup to average cost and revises output once a quarter, in the direction indicated by the change in sales. Over eighteen months of quarterly data from one industry, M and N generate output series that are indistinguishable within measurement error, because demand in that period moved slowly and seasonally, so quarter-end revision tracked continuous revision closely enough. Separately, in a laboratory market run for the module, subjects in the firm role behaved as N describes; they were never given the cost schedule, so the calculation M attributes to them could not have been performed. In the laboratory we could also shift demand abruptly, and under abrupt shifts M and N diverge sharply: N lags by up to a quarter and overshoots.

  Now the argument.

  1. What we want from a theory is accurate predictions about the phenomena we care about; the assumptions are instruments for generating those predictions.
  2. Realism is a property of assumptions rather than of predictions, so facts about realism can bear on the assessment of a theory only through their consequences for predictive accuracy.
  3. Accordingly, a fact about a theory's assumptions counts against that theory only if it shows the theory predicting less well somewhere in the range of phenomena we care about.
  4. Over the industry data, M and N are predictively indistinguishable.
  5. The laboratory result is a fact about the decision procedure, that is, about assumptions; by (3) it counts against M only if it shows M predicting less well.
  6. It might be said that it does, since M and N diverge under abrupt demand shifts. But a claim about what would happen under conditions that have not obtained is not tested by any data we possess; the divergence can only be checked when such a shift occurs, at which point both models will be assessed on the new data along with everything else. Until then the divergence is a promise, not evidence.
  7. So the laboratory result gives us no reason to prefer N to M, even though it shows M's central assumption to be false of these firms and N's to be roughly true of them.
  8. This generalises. For any theory that predicts well over the data we have, no direct evidence that its assumptions are false is a reason to abandon it.
  9. Independently, a theory is the more significant the more it abstracts: it explains much by little, and what it leaves out it leaves out falsely. Significance is a merit and it is purchased with unrealistic assumptions; so, other things equal, the more unrealistic a theory's assumptions, the better the theory.
  10. Therefore evidence that an assumption is false is never a reason to reject a predictively adequate theory, and the more we learn about how firms actually make their decisions the worse our economics becomes, since what we learn tempts us to replace significant abstractions with realistic clutter.

  I cannot present (10). It implies that the laboratory market was worthless; it implies that a model may be carried into precisely the conditions under which we have watched its mechanism fail; and it seems to condemn experimental economics as a discipline. Yet every step looked acceptable to me when I wrote it down, and I do not want to escape by simply declaring (1) false, because without something like (1) I cannot see how two theories are ever to be compared at all.

  Which step should go, or which needs restricting, and what do I lose by restricting it? If the answer is that (1) survives only in a weakened form, I would like to be told what that form is and whether it still does the work Friedman wanted from it — in particular, whether it still licenses dismissing the businessman's own account of how he sets prices as evidence about his firm's behaviour. And I would like to know how much of (9) can be kept: I think abstraction really is a theoretical virtue, and I do not want to be pushed into holding that the more detailed model is always the better one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Second-term philosophy of social science module. Reconstruction exercise.
      *   **Task:** Rebuild a contested methodological thesis (Friedman's 1953 "The Methodology of Positive Economics") as a numbered argument, identify where it fails, and explain the cost of rejection.
      *   **User's Problem:** The reconstruction seems valid and proves *too much* (leads to conclusion 10, which is untenable). The user wants to know which step to reject/restrict, what the cost is, and whether a weakened version of (1) and (9) can still do Friedman's work (specifically regarding dismissing businessman accounts and valuing abstraction).
      *   **The Argument:** 10 steps leading to the conclusion that false assumptions don't matter if predictions hold, and realistic assumptions might actually hurt theory.
      *   **The Case Study:** Two models (M = neoclassical marginalist, N = rule-of-thumb markup). M and N predict equally well on historical industry data. Lab evidence shows firms actually use N (assumptions of M are false). Lab also shows M and N diverge under *abrupt* demand shifts (which haven't happened in the industry data yet).
      *   **Key Tension:** Predictive success vs. Descriptive realism of assumptions vs. Robustness/External Validity.

  2.  **Evaluate the Argument Steps:**
      *   (1) Instrumentalism: Theory = prediction machine. Assumptions = instruments. (Standard Friedman).
      *   (2) Realism only matters via prediction. (Follows from 1).
      *   (3) False assumptions count only if they lead to bad predictions. (Follows from 2).
      *   (4) Empirical claim: M and N indistinguishable on historical data. (Given in case).
      *   (5) Lab result is about assumptions. Counts only if predictive failure. (Follows from 3).
      *   (6) *Crucial Step:* Claims that divergence under *unobtained* conditions (abrupt shifts) is not evidence until the shift happens. "The divergence is a promise, not evidence."
      *   (7) Lab result gives no reason to prefer N. (Follows from 5 & 6).
      *   (8) Generalization: Direct evidence of false assumptions is never a reason to abandon a predictively adequate theory.
      *   (9) Abstraction virtue: Unrealistic assumptions are a sign of significance/power.
      *   (10) Conclusion: Learning reality makes economics worse.

  3.  **Identify the Weak Point:**
      *   Step (6) is the most vulnerable. It treats "predictive accuracy" as strictly *retrospective* or *actualized* data fitting. It ignores *modal* robustness or *structural* validity.
      *   Step (1) is also a candidate, but the user explicitly wants to keep something like (1) to allow theory comparison. Abandoning (1) entirely leads to pure descriptivism, which kills theory building.
      *   Step (9) is tricky. Abstraction *is* a virtue, but "the more unrealistic, the better" is clearly false (reductio ad absurdum).

  4.  **Formulate the Critique (Philosophical Analysis):**
      *   **The Core Issue:** Friedman conflates *predictive success in the observed domain* with *predictive reliability in the relevant domain*.
      *   **Step (6) Failure:** The lab experiment *is* evidence about predictive capacity. It tests the *mechanism*. If the mechanism is wrong, the prediction is accidental (Gettier-style luck). The lab simulates the "abrupt shift" condition. Even if the industry hasn't seen it yet, the *capacity* to predict it is part of the theory's claim.
      *   **Step (1) Modification:** We need to shift from "accuracy of predictions" to "reliability of the predictive mechanism" or "robustness."
      *   **Step (9) Modification:** Abstraction is good *iff* it isolates causally relevant factors. "False" assumptions are okay if they are *idealizations* (simplifications that don't distort the causal mechanism), not if they are *misrepresentations* (distortions that break the mechanism).

  5.  **Drafting the Response:**

      *   **Acknowledge the quality:** The reconstruction is excellent. It captures Friedman's radical instrumentalism accurately. The fact that it leads to (10) shows *why* Friedman is controversial.
      *   **Target Step (6):** This is the logical pivot. It claims counterfactual performance isn't evidence. But experimental economics *provides* evidence about counterfactuals (external validity). If the lab shows M fails under condition C, and condition C is *possible* in the industry, M is risky.
      *   **Target Step (1) & (3):** Need to refine "prediction." It's not just fitting the curve; it's about *invariant* relationships. If the assumption describes the causal mechanism, knowing it's false undermines confidence in the prediction holding under *new* conditions (Lucas Critique adjacent).
      *   **Target Step (9):** Distinguish between *negligibility* (assumptions false but impact small) and *heuristic false* (assumptions wrong in a way that matters). Abstraction is good; distortion is bad.
      *   **Addressing the User's Specific Questions:**
          *   *Which step to reject?* Primarily (6), supported by refining (1) and (3).
          *   *What is the cost?* You lose the ability to ignore micro-foundations completely. You have to care about *why* the prediction works.
          *   *Does weakened (1) still dismiss businessman accounts?* Yes, *if* the account is irrelevant to the causal mechanism driving the aggregate outcome. But if the account reveals the mechanism is different (like in the Lab), it matters.
          *   *How much of (9) can be kept?* Abstraction as *idealization* is kept. Abstraction as *falsehood* is rejected.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, is Step (6) really the place?* Step (6) says "a claim about what would happen... is not tested by any data we possess." But the Lab *is* data. The user's case setup says "In a laboratory market... subjects behaved as N describes." So the Lab *did* test the abrupt shift. Step (6) tries to dismiss the Lab data as irrelevant to the *industry* theory because the industry hasn't seen the shift.
      *   *Correction:* The flaw is in the inference from (5) to (7) via (6). The Lab data *is* evidence of predictive failure under *relevant possible conditions*. Friedman's error is restricting the "domain of phenomena we care about" (from Step 3) to "phenomena that have already occurred."
      *   *Better Target:* Step (3) or the definition of "phenomena we care about" in Step (1). We care about *policy* and *intervention*, which implies changing conditions. Therefore, robustness to condition changes is part of predictive accuracy.
      *   *Let's focus on Step (6) as the primary break point.* It asserts that counterfactual performance isn't evidence. But in science, structural validity *is* evidence.
      *   *Also Step (9):* "The more unrealistic... the better." This is the strongest claim to reject. It should be "The more *fruitful* the abstraction."

  7.  **Structure of the Advice:**
      *   **Validation:** Confirm the reconstruction is faithful to Friedman (which is why it's dangerous).
      *   **The Diagnosis:** The argument turns on the definition of "prediction" and "evidence."
      *   **The Cut:** Reject/Restrict Step (6).
      *   **The Ripple Effect:** This forces a restriction on (1) and (3). Prediction = Robustness, not just curve-fitting.
      *   **The Cost:** You can no longer treat theories as black boxes. You must care about mechanisms (assumptions) because they guarantee robustness.
      *   **Addressing the Businessman:** You can still dismiss them *if* their description is phenomenologically accurate but causally irrelevant. But you can't dismiss them if they reveal the mechanism is different.
      *   **Addressing Abstraction (9):** Keep abstraction as *idealization*, reject abstraction as *falsehood*.

  8.  **Final Polish:** Ensure the tone is appropriate for a philosophy student (rigorous, engaging with the text, clear distinction between instrumentalism and realism). Make sure to explicitly answer the "what do I lose" question. (You lose the "anything goes" shield, but gain scientific reliability).

      *(Self-Correction during drafting)*: I need to be careful not to just say "Realism is good." The user wants to know how to save the *methodological* point without the absurd conclusion. The key is *autonomy of the mechanism*. If M predicts right for the wrong reason, it's not a good theory for *intervention*. This connects to the Lucas Critique later on, though Friedman predates it. I should mention that knowing the *decision rule* (N) allows better prediction under *change* than knowing the *equilibrium condition* (M).

      *Revised Plan:*
      1.  Identify Step (6) as the primary failure point (dismissal of experimental/structural evidence).
      2.  Identify Step (9) as the secondary failure point (conflating abstraction with falsehood).
      3.  Explain the cost: Instrumentalism becomes "Structuralism" or "Mechanism-based explanation."
      4.  Answer the specific questions about the businessman and abstraction.

      *Wait, one more thing:* The user says "I do not want to escape by simply declaring (1) false." I need to show how (1) can be *modified* rather than discarded. (1) becomes "We want accurate predictions *across relevant counterfactuals*."

      *Let's write.*
answer: |-
  This is an exceptionally sharp reconstruction. You have correctly identified that Friedman's 1953 essay ("The Methodology of Positive Economics") pushes instrumentalism to a point where it becomes self-undermining. If you follow Friedman's logic strictly, you arrive at your Step (10), which implies that discovering the truth about the world is actively harmful to economics. Since that is untenable, the argument must be blocked.

  You are right to hesitate at Step (1). However, you do not need to discard it entirely to save the argument. The fatal flaw lies in **Step (6)**, supported by an equivocation in **Step (9)**.

  Here is where you should cut, what it costs, and how to salvage the insights you want to keep.

  ### 1. The Primary Cut: Reject Step (6)

  **Step (6) claims:** *"A claim about what would happen under conditions that have not obtained is not tested by any data we possess... Until then the divergence is a promise, not evidence."*

  **Why it fails:** This step conflates *historical data* with *evidence*. The laboratory experiment you described **is** data. It provides evidence about the *structural stability* of the model.

  Friedman's argument relies on a "black box" view of theory: Input (conditions) $\rightarrow$ Black Box (Theory) $\rightarrow$ Output (Prediction). He argues we only care if the Output matches reality. However, Step (6) ignores that the "Black Box" contains a mechanism. If we open the box (via the lab) and see the gears are different than described (Model M vs. Model N), we have evidence that the theory will fail when the input conditions change in specific ways (abrupt shifts).

  By claiming that the lab result is not evidence until the industry actually experiences an abrupt shift, Step (6) treats the theory as a curve-fitting exercise rather than a causal explanation. In social science, we often care about **policy and intervention**, which inherently involves creating conditions that "have not obtained" (e.g., a new tax, a rate hike). If we cannot trust the model under counterfactual conditions, it is useless for policy.

  **The Restriction:**
  Replace (6) with:
  > *(6*) Evidence about the decision mechanism (assumptions) counts as evidence about predictive reliability under *counterfactual* conditions. If a model relies on a mechanism shown to be false in a controlled setting, we have inductive reason to doubt its predictions in the target setting should relevant conditions change.*

  ### 2. The Secondary Cut: Restrict Step (9)

  **Step (9) claims:** *"...the more unrealistic a theory's assumptions, the better the theory."*

  **Why it fails:** This is the step that generates the absurdity of (10). It conflates **abstraction** with **falsehood**.
  *   **Abstraction (Good):** Ignoring irrelevant details to isolate a causal force (e.g., assuming a vacuum to study gravity).
  *   **Distortion (Bad):** Asserting a mechanism operates in a way it demonstrably does not (e.g., assuming agents calculate derivatives when they use heuristics).

  Friedman argues that significant hypotheses *must* be descriptive falsehoods. Your reconstruction shows this leads to the conclusion that learning the truth is bad.

  **The Restriction:**
  Replace (9) with:
  > *(9*) A theory is significant to the extent that it isolates causally relevant factors through abstraction. Assumptions may be *idealized* (simplified) without being *misrepresentations* of the causal mechanism. Unrealistic assumptions are a merit only if they are negligible; they are a demerit if they misdescribe the operative mechanism.*

  ### 3. What Do You Lose? (The Cost)

  By rejecting (6) and restricting (9), you lose **Radical Instrumentalism**.

  1.  **You lose the "Black Box" Shield:** You can no longer treat assumptions as *merely* instruments. You must care about them because they carry the burden of **external validity**. If the assumptions are false, the prediction might be right for the wrong reason (accidental generalization), and the theory will fail when the environment changes.
  2.  **You lose the ability to ignore Micro-foundations:** In your reconstruction, Step (8) says evidence of false assumptions is never a reason to reject a theory. By rejecting this, you admit that if we learn firms use markups (N) rather than marginal calculations (M), we should prefer N, even if M fits past data, because N is more likely to survive structural breaks.
  3.  **You complicate Theory Choice:** It is no longer sufficient to check $R^2$ or mean squared error. You must also evaluate the plausibility of the mechanism. This makes methodology harder, but it prevents the "worship of false models" that your Step (10) warns against.

  ### 4. Does Weakened (1) Still Do Friedman's Work?

  You asked if a weakened (1) still licenses dismissing the businessman's account.

  **Original (1):** *What we want from a theory is accurate predictions... assumptions are instruments.*
  **Weakened (1*):** *What we want from a theory is accurate predictions across a robust range of counterfactuals; assumptions are claims about the causal mechanism generating those predictions.*

  **Does it still dismiss the businessman?**
  **Yes, but conditionally.**
  Friedman wanted to dismiss the businessman's account because the businessman might describe his *phenomenology* ("I go with my gut") rather than the *logic of the situation* ("Market competition forces me to act as if I maximize").
  *   **Keep:** You can still dismiss the businessman if his account is phenomenologically accurate but causally irrelevant. (e.g., He says he prays for rain, but the model shows he plants when soil moisture hits X. The prayer is a false assumption, but the moisture threshold is the causal mechanism).
  *   **Lose:** You cannot dismiss the businessman if his account reveals the *algorithm* he uses is incompatible with the model's stability. In your case study, the lab showed the algorithm *was* incompatible (N vs M). Therefore, the businessman's (or subject's) account becomes crucial evidence.

  So, weakened (1) saves the core insight (we care about predictions) without accepting the absurdity (truth is irrelevant).

  ### 5. How much of (9) can be kept? (Abstraction vs. Clutter)

  You want to keep the idea that abstraction is a virtue and "realistic clutter" is a vice. You can keep this, provided you distinguish **Idealization** from **Error**.

  *   **Keep:** "A model that explains much by little is better than one that explains little by much." (Parsimony).
  *   **Keep:** "Adding realistic details that do not affect the outcome is 'clutter' and should be removed." (Ockham's Razor).
  *   **Reject:** "Adding realistic details that *do* affect the outcome (like the revision lag in Model N) is clutter."

  In your case study, the "clutter" in Model N (the quarterly lag) turned out to be **causally potent** under abrupt shifts. Therefore, it was not clutter; it was a structural feature. Friedman's error in (9) is assuming that *all* unrealistic assumptions are benign idealizations. Your reconstruction proves that some unrealistic assumptions are fatal errors.

  ### Summary for your Exercise

  To complete your reconstruction exercise successfully:

  1.  **Validate:** Acknowledge that your reconstruction faithfully captures Friedman's radical instrumentalism. The fact that it proves (10) is actually a *reductio ad absurdum* of Friedman's strongest claims.
  2.  **Intervene:** State that you reject **Step (6)**.
  3.  **Justify:** Argue that experimental evidence regarding mechanisms *is* evidence regarding predictive reliability under counterfactual conditions (robustness). A theory that predicts well only because the environment has been stable is not a "good" theory in the sense required for social science, which often deals with intervention.
  4.  **Cost:** Admit that this forces economics to care about psychology and institutional detail (the "assumptions") more than Friedman wanted. It bridges the gap between "Positive Economics" and "Behavioral/Institutional Economics."
  5.  **Salvage:** Argue that this does not destroy the value of abstraction (9). We still want parsimonious models, but we require that the simplifications be **causally insulated** from the errors. We can assume firms maximize profit *as if* they calculated margins, provided the market selection mechanism makes the calculation unnecessary. But if the lab shows the selection mechanism isn't working (firms survive despite using N), the assumption is no longer a harmless idealization.

  This approach allows you to critique Friedman without resorting to a naive "everything must be realistic" descriptivism. You preserve the goal (prediction) but upgrade the means (mechanism-based reliability).
