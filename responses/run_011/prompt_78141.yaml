answer: |-
  Here are nine questions designed to move past the standard pitch while remaining respectful and open-ended. They are structured to keep the conversation moving even if she gives the standard defensive answers you anticipate.

  ### 1. The Response Bias/Criterion Shift (Required)
  **Question:** "Even with a deadline and a continuous dial, a Signal Detection theorist might argue your training shifts the *criterion* for a 'match' rather than the sensory signal itself. How do you distinguish a shifted criterion from a shifted appearance?"

  *   **Expected Answer:** She will likely reiterate that the deadline prevents conscious criterion adjustment and that the effect is automatic/pre-decisional. She may cite neural decoding data suggesting early sensory changes.
  *   **Follow-up:** "If the criterion shift is automatic and unconscious, does the functional distinction matter for the claim that cognition alters *experience*, or only for where we locate the mechanism?"
      *   *Why this works:* If she says it matters, she has to define "experience" vs. "decision." If she says it doesn't matter, she concedes that "seeing" might just be "deciding," which weakens the strong penetration claim.

  ### 2. Expectation vs. Long-Run Retuning (Required)
  **Question:** "Your participants undergo hundreds of training trials. Is the effect driven by a current, online expectation, or by long-term perceptual retuning similar to adaptation? How do you tell them apart?"

  *   **Expected Answer:** She will likely argue that training establishes a "prior" that is then applied online. She may claim the distinction is blurry because priors *are* learned weights.
  *   **Follow-up:** "If it's primarily long-term weight change, does the claim shift from 'thoughts penetrate vision' to 'vision learns from history'? Does the label 'cognitive penetration' still fit?"
      *   *Why this works:* It forces her to clarify if this is about *beliefs* (cognitive) or *plasticity* (structural). If it's just plasticity, it's less philosophically explosive.

  ### 3. Locus of Modulation (Required)
  **Question:** "Skeptics grant top-down effects on attention and decision stages. When you say 'early vision,' which stage of processing are you committing to? V1, V4, or something downstream?"

  *   **Expected Answer:** She will likely cite MVPA (multi-voxel pattern analysis) studies pointing to V4 or LO (lateral occipital), arguing this is pre-recognition.
  *   **Follow-up:** "If the effect peaks in object-selective cortex rather than retinotopic maps, does that change the philosophical weight of the claim? Is that 'seeing' or 'recognizing'?"
      *   *Why this works:* It presses the definition of "perception." If the effect is in areas responsible for object identity, skeptics argue that's not "early vision" in the sense that matters for raw appearance.

  ### 4. The Circularity Worry (Required)
  **Question:** "If what you believe changes what you see, then perceptual evidence is no longer independent of your theories. Do you accept that consequence, or is there a point where observation remains neutral?"

  *   **Expected Answer:** She will likely reject the idea of a "theory-neutral observation language" (a Kuhnian stance), arguing that all perception is probabilistic inference.
  *   **Follow-up:** "If no observation is theory-neutral, how do we adjudicate between competing theories without circularity? What acts as the arbiter if not raw data?"
      *   *Why this works:* It pushes the epistemological implication. She can't just say "science goes on"; she has to explain *how* it goes on without neutral data (e.g., coherence, prediction accuracy).

  ### 5. Stubborn Illusions (Required)
  **Question:** "In illusions like Müller-Lyer, knowing the lines are equal doesn't change how they look. In your paradigm, training does change how shapes look. What determines the boundary where knowledge can penetrate?"

  *   **Expected Answer:** She will likely argue that illusions reflect hard-wired priors (e.g., lighting assumptions) that are resistant to update, whereas her categories are arbitrary and thus flexible.
  *   **Follow-up:** "So penetration is possible only when the visual system treats the information as updateable? Does that make the effect a feature of uncertainty rather than cognitive access?"
      *   *Why this works:* It suggests the effect might be about *statistical uncertainty* in the visual stream, not necessarily "cognitive" penetration from high-level belief.

  ### 6. Motivated Perception & Replication (Required)
  **Question:** "Much of the 'motivated perception' literature (e.g., hills, currency size) has faced replication challenges. How do you distinguish your results from that body of work methodologically?"

  *   **Expected Answer:** She will emphasize her continuous measures, tight controls, and within-subject designs compared to the coarse ratings of older studies.
  *   **Follow-up:** "If the difference is primarily measurement precision, does that suggest the effect is subtler than the 'world looks different' claim implies?"
      *   *Why this works:* It gently probes whether the "wow" factor of the claim is proportional to the subtlety of the measurement.

  ### 7. Individual Differences (Category Learning Link)
  **Question:** "In my own work on category learning, we see massive variability in how people acquire rules. Do you see individual differences in susceptibility to this perceptual shift? Are some people's vision more 'penetrable' than others?"

  *   **Expected Answer:** She will likely admit variability but note it's rarely the focus. She might mention working memory or cognitive control as moderators.
  *   **Follow-up:** "If penetrability varies by trait, does that suggest it's a skill or strategy some people deploy, rather than a universal architecture of vision?"
      *   *Why this works:* It links your expertise to hers. If it's a skill, it's less of a fundamental claim about human vision and more about individual strategy.

  ### 8. Ecological Function
  **Question:** "Assuming the effect is real, what is the computational benefit? Why would the visual system sacrifice veridicality for consistency with expectation?"

  *   **Expected Answer:** She will argue for efficiency: matching input to expectation reduces error and speeds up action in a noisy world (Bayesian efficiency).
  *   **Follow-up:** "But if the goal is efficiency, wouldn't the system flag discrepancies rather than hide them? Does masking the error help the organism learn when it's wrong?"
      *   *Why this works:* It challenges the evolutionary rationale. If you hide prediction errors, you can't update your model. This is a strong theoretical tension.

  ### 9. The Falsifier (Closer)
  **Question:** "To close, what specific empirical finding would force you to abandon the claim that expectations alter early vision? Is there a null result or a mechanism that would change your mind?"

  *   **Expected Answer:** She will likely say that if decoding in early visual cortex (V1/V2) shows absolutely no difference between conditions while behavior does, she would concede it's post-perceptual.
  *   **Follow-up:** "So the claim rests on neural locus rather than behavioral phenomenology? If the behavior holds but the neural signal doesn't, do you retract the 'seeing' claim?"
      *   *Why this works:* It locks her into a commitment. If she says "Yes, I'd retract," you have a clear boundary. If she says "No, behavior is enough," she contradicts her earlier emphasis on neural mechanisms (Q3).

  ### Advice for the Interview
  *   **Tone:** Keep your voice neutral. These questions are sharp, so deliver them with genuine curiosity, not accusation. Use phrases like "Help me understand..." or "I'm struggling to locate the boundary..."
  *   **Pacing:** You have 30 minutes. If she rambles on Q1, you may need to merge Q7 and Q8. Prioritize Q1, Q4, and Q9 if time gets tight.
  *   **The "Supervisor Check":** If your supervisor worries you're being too aggressive, frame it as: "I'm asking these because the literature is polarized, and I want to clarify where the actual disagreement lies for the listeners."
