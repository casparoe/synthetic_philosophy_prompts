answer: |-
  The Fund's committee allocates grants based on cost per disability-adjusted life year (DALY) averted, comparing insecticide-treated nets, school deworming, and rural clinic governance. In the first cycle, all three programs model at an identical expected cost-effectiveness of $50 per DALY, but the governance initiative carries a wider confidence interval due to the diffuse nature of its outcomes. Following standard protocol to maximize the value of information, analysts direct the monitoring budget exclusively to the nets and deworming pilots, where data collection is cheaper and outcomes are immediate. By the second cycle, the new data merely confirms the original estimates for nets and deworming, tightening their confidence intervals, while the governance model grows stale and is penalized by an uncertainty discount; consequently, the committee shifts 90% of capital to the tangible interventions despite no change in their point estimates. In the third cycle, minor implementation efficiencies found during the intensive monitoring nudge the nets and deworming to $45 per DALY, whereas the governance program, now starved of measurement resources, cannot refute the growing statistical presumption of obsolescence. The internal audit trail reveals the governance program's ranking fell not because its outcomes worsened, but because the precision of its competitors improved, locking the Fund into a cycle where measurement begets funding which begets measurement, leaving the diffuse benefit increasingly invisible despite no evidence of its failure.

  **Specification Check**

  **Method Delivers vs. Critic Predicts vs. Defender Says**
  *   **Round 1:** The method delivers equal expected value across three programs but identifies higher uncertainty in governance. The critic predicts this initial uncertainty will become a self-fulfilling prophecy if measurement resources follow expected value. The defender argues that uncertainty discounts are necessary to avoid gambling donor money.
  *   **Round 2:** The method delivers higher precision on nets/deworming and stale data on governance, triggering a funding shift (90%). The critic predicts this shift is driven by measurement intensity, not outcome changes. The defender argues that updated confidence intervals legitimately alter risk-adjusted value.
  *   **Round 3:** The method delivers improved point estimates ($45) for measurable programs due to implementation tweaks found during monitoring, while governance is statistically penalized for obsolescence. The critic predicts the measurable programs are now overfitted to the metric. The defender argues that finding efficiencies is a success of rigorous monitoring.

  **Why Replies Fail:** The defender's appeals to sensitivity analysis and uncertainty discounts are the very mechanisms driving the bias; they penalize the unmeasured without evidence of ineffectiveness. The "value of information" calculation is circular because it values information only insofar as it confirms or tweaks the existing metric, ignoring information that might challenge the metric's scope.

  **The Single Feature Doing the Work**
  The endogenous allocation of measurement resources. The funder decides *where to look* based on *what it already sees*.

  **Deletion Test**
  If I delete the rule that measurement budget follows expected value of information (e.g., if measurement budget were allocated equally or to the most uncertain programs), the precision gap does not widen artificially. The ranking remains stable relative to the evidence, and the governance program retains its funding share.

  **Skeptic's Line**
  A skeptical reader will argue this describes bad Value of Information (VoI) practice, not rigorous cost-effectiveness analysis. A truly rigorous analyst would recognize that the highest value of information lies in resolving the uncertainty around the governance program, not tightening confidence intervals on already-proven interventions. They will claim the scenario depicts a funder who is *pretending* to be rigorous while actually avoiding uncertainty, rather than a funder failing *because* of rigor.

  **Admission on Divergence**
  I must admit that the case assumes the metric diverges from the goal rather than showing that divergence arising solely from the measurement regime. The scenario demonstrates mechanistically how the governance program becomes *invisible* (the measurement regime creates the blindness), but it relies on the narrator's assertion that the program remains effective ("no evidence of its failure") to prove the allocation is *worse*. The documents show the ranking moved further than the evidence warranted, but they do not prove the unmeasured program was actually valuable. The regime guarantees we won't know; the claim that we are losing value is an external assumption necessary to make the case moral rather than just procedural.
