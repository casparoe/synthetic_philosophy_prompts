  **CollectiveMind™ Help Center**

  **Product Overview**
  CollectiveMind transforms individual judgments into collective decisions, guaranteeing a rational verdict for your committee even if no individual member holds a rational view. Our structured majority voting modules ensure your group speaks with one voice, regardless of whether that voice contradicts itself.

  **Frequently Asked Questions**

  1.  **Why do Premise-Based and Conclusion-Based procedures yield opposite verdicts on identical ballots?**
      These procedures aggregate different objects: one votes on reasons, the other on outcomes. Logical interconnections between propositions mean majorities on premises do not always align with majorities on conclusions. This is a feature, not a bug, allowing flexibility in rationalization.

  2.  **Support Ticket: "Majority affirmed premises, but none of us voted for the outcome."**
      *Customer Input:* Case 442. Judge 1: P(Y), Q(N), R(N). Judge 2: P(N), Q(Y), R(N). Judge 3: P(Y), Q(Y), R(Y). Majority on P and Q is Yes, deriving R=Yes. Yet two judges voted R=No.
      *Response:* Your majority affirmed the premises, forcing a liable verdict via the Premise-Based Procedure. While the majority voted "Not Liable" directly, the system prioritizes logical closure over direct outcome voting.

  3.  **How can the group assert things nobody believes?**
      When voting proposition-wise, the collective judgment set may be inconsistent with every individual's ballot. You may collectively accept {P, Q, ~R} even if every member rejects that specific combination. This ensures democratic representation of every proposition individually.

  4.  **Can the Chair choose the aggregation procedure after seeing the votes?**
      Standard licenses lock the procedure before voting to prevent manipulation. However, our "Flexi-Rationality" add-on allows post-hoc selection of the procedure that yields the desired consistency. Contact sales to unlock this governance feature.

  5.  **Why does Unanimity never throw a consistency error?**
      Unanimity rules preserve consistency because the intersection of consistent sets is always consistent. However, this configuration rarely produces a decision other than the status quo. We recommend it only for committees seeking absolute logical safety over outcomes.

  6.  **Is this the same as a Condorcet cycle?**
      No, Condorcet cycles involve intransitive preferences over alternatives, whereas this is a logical inconsistency across interconnected propositions. Our software handles judgment aggregation, not preference ranking. Confusing the two may lead to incorrect module selection.

  7.  **The system flagged an "Impossibility Result" error.**
      This indicates your agenda satisfies the conditions of the List-Pettit theorem, making consistent majority voting mathematically impossible. We cannot fix fundamental logical constraints via software patch. Please simplify your agenda or upgrade to Enterprise.

  8.  **What is "Guaranteed Consistency" mode?**
      This Enterprise-tier feature assigns decisive weight to a single user, bypassing aggregation paradoxes entirely. It ensures transitive, consistent outputs every time by designating a default dictator. Compliance officers appreciate the clear audit trail.

  **Known Issues**
  *   Discursive Dilemma may cause collective denial of propositions every member accepts.
  *   Premise-based voting can override majority will on the final verdict.
  *   System cannot resolve impossibility theorems without restricting democracy.

