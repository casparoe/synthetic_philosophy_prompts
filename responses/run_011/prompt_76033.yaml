  **TO:** Executive Committee
  **FROM:** People Analytics & Operations Data Science
  **DATE:** October 24, 2023
  **SUBJECT:** Q3 Performance Insights: Safety & Dispatch Optimization

  Team,

  We are thrilled to share how letting the data speak is driving strategic wins across our operational ecosystem. Our holistic review confirms that initiative alignment is delivering measurable value, empowering us to double down on what works. By focusing on actionable intelligence, we are turning raw numbers into competitive advantage.

  **Flagship Safety-Coaching Program**
  The data confirms our safety-coaching program is a resounding success. Overall, drivers enrolled in coaching show a 2.1% accident rate, compared to 5.4% for non-enrolled drivers. This 61% reduction is the bottom line that matters for our insurance premiums and public safety commitments. It demonstrates a clear, organization-wide improvement in risk profile.

  We did observe some variance when slicing by depot; for instance, at the long-tenure Northern depot, coached drivers logged 1.5% accidents versus 1.0% for peers, and similar patterns appeared elsewhere. This appears to be an interesting quirk of the rollout schedule, where we prioritized stable depots first, creating baseline differences in the subgroups. Regardless, the aggregate signal is clear: coaching works. We recommend immediate expansion based on this top-line performance.

  **Automated Dispatch System**
  Regarding the automated dispatch system, top-line latency increased slightly to 15% from 10% for manual routing. However, volume shifts explain this aggregate noise. The real story emerges when we compare apples to apples. Among shipments flagged with mid-transit risk—a critical segment where intervention matters most—automated handling reduced lateness to 20% versus 25% for manual routing across every region.

  This segment-specific optimization proves the algorithm excels where it counts. The system naturally identifies complex shipments, raising the risk flag more frequently during reroutes, which inflates the overall volume in that category. The overall volume spike is merely a footnote to this targeted efficiency. We are confident this represents a net gain in delivery reliability.

  **Conclusion**
  Both initiatives demonstrate how granular data drives growth. Whether leveraging aggregate outcomes for safety or segment-specific wins for dispatch, our data-driven approach ensures we capitalize on every opportunity. We are scaling both programs immediately to capture full-year synergies.

  <div style="font-size: smaller; color: #555;">These insights remain valid provided the segmentation criteria do not themselves influence the outcome distribution.</div>
