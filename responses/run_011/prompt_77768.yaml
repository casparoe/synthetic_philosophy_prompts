answer: |-
  Your hypothesis is correct: the stalemate is structural, not evidential. The dispute persists because "Predictive Processing" (PP) and the "Free Energy Principle" (FEP) are functioning as a single label for three distinct theoretical layers that are being conflated.

  The impasse arises because the camps are operating with different **modal statuses** for the principle (necessary truth vs. contingent hypothesis) and different **ontological commitments** (realism vs. instrumentalism).

  Here is the diagnosis of the disagreement structure, the pairwise relations, and the conditions for progress.

  ### 1. The Structural Diagnosis: Three Layers, One Label

  To understand why the camps talk past each other, we must distinguish the three layers they are conflating:

  1.  **The Mathematical Layer (Camp 2):** FEP as a theorem. If a system maintains its structure over time (has a Markov blanket), its dynamics *can be described* as minimizing variational free energy. This is a claim about **necessity**.
  2.  **The Mechanistic Layer (Camp 1):** Predictive Coding as a neural implementation. The brain *actually uses* hierarchical gradient descent on prediction error to update synaptic weights. This is a claim about **contingency**.
  3.  **The Ontological Layer (Camp 3):** Representationalism. Minimizing error implies the system holds "models" or "representations" of the world. This is a claim about **interpretation**.

  The stall occurs because Camp 1 treats Layer 1 as evidence for Layer 3, Camp 2 treats Layer 2 as a trivial instance of Layer 1, and Camp 3 argues that Layer 1 does not entail Layer 3.

  ### 2. Pairwise Disagreement Analysis

  #### Camp 1 (Empiricists) vs. Camp 2 (Formalists)
  *   **The Conflict:** **Contingent Mechanism vs. Necessary Description.**
  *   **Structure:** Camp 1 treats FEP as a falsifiable hypothesis about *how* brains work. Camp 2 treats FEP as a mathematical identity about *what it means* to exist as a bounded system.
  *   **Are they contradicting?** No, they are mismatched. Camp 2's claim renders Camp 1's primary claim ("The brain minimizes free energy") trivially true but explanatorily empty. If *everything* with a blanket minimizes free energy, showing the brain does so tells us nothing specific about the brain.
  *   **The Friction Point:** Camp 1 needs FEP to be specific enough to rule out other mechanisms (e.g., Hebbian learning without prediction). Camp 2's formulation is too general to rule anything out. Camp 1 is trying to test a definition; Camp 2 is trying to define a test.
  *   **Progress Condition:** A **Formal Result** distinguishing the *space of possible generative models*. Progress requires proving that while any system *can* be described as minimizing free energy, only specific biological systems *must* use specific classes of generative models (e.g., deep hierarchical ones) to survive. Without constraints on the *complexity* or *structure* of the model itself, Camp 2 absorbs Camp 1's findings as trivial instances.

  #### Camp 1 (Empiricists) vs. Camp 3 (Anti-Representationalists)
  *   **The Conflict:** **Realism vs. Instrumentalism regarding "Models."**
  *   **Structure:** Both agree that prediction-error minimization occurs (mathematically or neurally). They disagree on whether the variables in the equation correspond to cognitive *representations*. Camp 1 says "prediction implies a model of the world." Camp 3 says "prediction implies only a coupling with the environment" (e.g., the Watt governor).
  *   **Are they contradicting?** Yes, on ontology. This is a classic debate over **structural isomorphism**. Camp 1 claims the internal states map onto external causes. Camp 3 claims internal states only map onto the system's own maintenance.
  *   **The Friction Point:** The definition of "representation." Camp 1 uses a functional definition (it guides action). Camp 3 uses a structural/semantic definition (it stands in for the world).
  *   **Progress Condition:** A **Philosophical Distinction** regarding "decouplability." Progress requires a criterion for when a predictive state counts as a representation (e.g., can it be used for offline simulation?) versus when it is merely a reactive control parameter. Until "representation" is operationalized beyond "anything that reduces error," this debate is verbal.

  #### Camp 2 (Formalists) vs. Camp 3 (Anti-Representationalists)
  *   **The Conflict:** **Universality vs. Specificity of Cognition.**
  *   **Structure:** Surprisingly, these camps are often allies against Camp 1, but they diverge on the implications of universality. Camp 2 says "FEP applies to cells, brains, and societies." Camp 3 says "If FEP applies to cells, it doesn't explain *mind*."
  *   **Are they contradicting?** Minimally. Camp 3 often uses Camp 2's math to undermine Camp 1's neuro-centrism (showing that FEP doesn't require a brain). However, Camp 3 worries that Camp 2's pan-psychist-adjacent universalism dilutes the concept of agency.
  *   **The Friction Point:** The **Markov Blanket**. Camp 2 treats the blanket as a mathematical boundary. Camp 3 asks whether that mathematical boundary corresponds to a cognitive boundary (a "self").
  *   **Progress Condition:** A **Reasoned Argument** linking statistical boundaries to phenomenological or functional boundaries. We need to know if the mathematical necessity of a blanket entails the cognitive necessity of a "self-model."

  ### 3. The Core Structural Flaw: The "Re-absorption" Problem

  You identified the critical issue: *Any candidate counterexample can be re-absorbed by re-specifying the generative model.*

  This is the problem of **underdetermination**. Because the FEP is a variational bound, you can always posit a more complex prior or a different likelihood function to make the data fit the principle.
  *   If the brain fails to predict X, Camp 1 says "The model is wrong."
  *   Camp 2 says "The system minimized free energy relative to *its* (incorrect) model."
  *   Camp 3 says "The system coupled with the environment successfully without a model."

  Because the "generative model" is often a theoretical posit rather than a measured variable, FEP risks becoming a **just-so story generator**. It explains everything post-hoc and predicts nothing specific *a priori* without independent constraints on the model structure.

  ### 4. What Counts as Progress?

  Given this diagnosis, more fMRI data (Camp 1's preference) or more proofs of universality (Camp 2's preference) will not resolve the dispute. Progress requires meta-theoretical moves:

  1.  **Complexity Constraints (Formal Result):**
      We need a theorem showing that for a system to minimize free energy *efficiently* (in time/energy), it is *forced* into a specific hierarchical architecture. If FEP allows *any* architecture, it explains nothing. If it can be proven that *only* hierarchical predictive coding minimizes free energy under biological constraints (metabolic cost, latency), Camp 1 wins. If it can be proven that simple dynamical coupling achieves the same bound cheaper, Camp 3 wins.

  2.  **Independent Access to Priors (Methodological Shift):**
      Currently, priors are inferred from behavior. This makes the theory circular. Progress requires measuring priors *independently* of the behavior they are supposed to explain (e.g., via structural connectivity or developmental constraints). If the "model" is only visible through the "error" it minimizes, the theory is unfalsifiable.

  3.  **Operationalizing Representation (Philosophical/Experimental):**
      We need an experiment that distinguishes **predictive control** from **predictive representation**. For example, if a system minimizes free energy but cannot generalize its "predictions" to novel contexts where the sensorimotor loop is broken, Camp 3 is vindicated (it's a governor, not a model). If it can simulate outcomes offline, Camp 1 is vindicated.

  4.  **Admission of Instrumentalism (Reasoned Argument):**
      The most likely resolution is a dissolution. We may need to accept that FEP is a **normative framework** (how a system *should* act to persist) rather than a **descriptive mechanism** (how the brain *does* act). If Camp 1 accepts FEP as a heuristic for generating hypotheses rather than a literal description of neural code, the tension with Camp 2 dissolves. If Camp 3 accepts that "representation" is a useful stance rather than a metaphysical fact, the tension with Camp 1 dissolves.

  ### Summary
  The dispute is stalled because it is being fought as an empirical disagreement (who has the data?) when it is actually a **categorial disagreement** (what kind of thing is the principle?).

  *   **Camp 1** thinks they are building an engine.
  *   **Camp 2** thinks they are writing the laws of thermodynamics.
  *   **Camp 3** thinks they are analyzing the concept of "driving."

  Progress requires Camp 1 to admit thermodynamics doesn't specify the engine design, Camp 2 to admit thermodynamics doesn't entail a driver, and Camp 3 to admit that engines exist regardless of how we define driving. Until the layers are decoupled, the "re-absorption" problem ensures the stalemate continues.
