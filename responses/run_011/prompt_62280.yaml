answer: |-
  Here is a 90-minute seminar plan designed to generate the friction you need without a single minute of front-loaded theory.

  ### **The Setup**

  **Materials:**
  *   **18 Envelopes:** Labeled 1–18.
  *   **Role Cards:** 17 "Tourist" cards (Value = 1 point), 1 "Refugee" card (Value = 100 points). *Keep these secret.*
  *   **Prize:** One distinct, high-value item (e.g., a large premium chocolate bar or a "Homework Pass" worth 10% of final grade). *Do not use money.*
  *   **Voting Slips:** Pre-printed with Options A, B, C.
  *   **Timer:** Visible to the room.

  **Room Layout:**
  *   Students sit in a circle or seminar table.
  *   You stand at the board, but do not write theory. Only write scores and rules.

  **The Cover Story:**
  *   Tell them: "We are testing allocation mechanisms for a scarce resource. Your goal is to maximize the 'Room Score.' You will be paid in points at the end based on your Role Card and the allocation." (This gives them a reason to care without revealing the IUC problem).

  ---

  ### **Minute-by-Minute Timeline**

  #### **0:00 – 0:10: Distribution of Ignorance**
  *   Hand out Envelopes. Inside is their Role Card.
  *   **Instruction:** "Look at your card. Memorize the point value. Do not show anyone. Do not say the number. You are now a player with a private valuation."
  *   **The Rig:** 17 students are Tourists (1 pt). 1 student is the Refugee (100 pts). *You know who the Refugee is; they do not know each other.*
  *   **Instruction:** "We have one Prize. It cannot be split. We will run three rounds to decide who gets it. Points accumulate."

  #### **0:10 – 0:30: Round 1 (The Ordinal Trap)**
  *   **Goal:** Force aggregation using only rankings.
  *   **Rule:** "You may not speak. You may not reveal your points. You may only submit a ranking of the three Options."
  *   **Options on Board:**
      *   **A:** Lottery (Random draw among all 18).
      *   **B:** Designated Recipient (Give to Student #7). *Note: Student #7 is the Refugee.*
      *   **C:** Destroy the Prize (No one gets it).
  *   **Mechanism:** Borda Count. (1st choice = 2 pts, 2nd = 1 pt, 3rd = 0 pts). Sum the class votes.
  *   **Prediction:**
      *   Tourists prefer A (1/18 chance) over B (0 chance).
      *   Refugee prefers B over A.
      *   Since 17 > 1, **Option A (Lottery) wins.**
  *   **Execution:** Run the lottery live.
      *   *Critical Rig:* Ensure the Lottery **does not** pick the Refugee. (If it does, reshuffle silently or claim a technical error; you need the Prize to go to a Tourist).
      *   Award points: Winner gets 1 point. Refugee gets 0.
  *   **Reveal:** "Round 1 Total Room Score: 1 point."
  *   **Ask:** "Could we have done better?"
  *   **Reveal Roles:** Ask the Refugee to stand. Reveal their 100 points.
  *   **Result:** "If we chose B, Room Score would have been 100. We lost 99% of potential welfare."
  *   **Silence:** Let that sit for 30 seconds. Do not explain why.

  #### **0:30 – 0:50: Round 2 (The Cheap Talk Trap)**
  *   **Goal:** Allow intensity reports to show they are unverifiable.
  *   **Rule:** "Same Options (A, B, C). But now, you have 3 minutes of open floor. You may argue for your preference. You may claim intensity. Then we vote."
  *   **Instruction:** "Convince the room."
  *   **Prediction:**
      *   The Refugee will say, "I need this more!"
      *   The Tourists (wanting points) will say, "I need this more!" or "It's unfair to give it to #7 without proof."
      *   The two Economist students will likely argue that verbal claims are unscientific.
  *   **Mechanism:** Majority Vote after discussion.
  *   **Outcome:** The signal-to-noise ratio is zero. 17 people claiming "high intensity" vs 1 person claiming "high intensity." The majority will likely vote for **Option A (Lottery)** again to be "fair," or deadlock.
  *   **Execution:** Run the vote. If they deadlock, you (the Instructor) break the tie by choosing the Lottery (status quo).
  *   **Result:** Lottery runs again. (Rig it so a Tourist wins again, or the Refugee wins but the *process* felt chaotic).
  *   **Reveal:** "Round 2 Total Room Score: [Likely 1 or 100, but the process was noisy]."
  *   **Ask:** "Did the extra information help us find the 100 points?"
  *   **Answer:** No. Because anyone could say they had 100 points.

  #### **0:50 – 1:10: Round 3 (The Veil)**
  *   **Goal:** Force them to choose a principle before knowing their seat.
  *   **Rule:** "We reset. New Prize. New Role Cards."
  *   **Action:** Collect old cards. Hand out *blank* cards.
  *   **Instruction:** "Do not look at the new cards yet. First, you must choose the **Rule** for allocation. Once the Rule is set, you will open your cards, and the Rule will be applied."
  *   **Options on Board:**
      *   **Rule 1:** Majority Vote (After seeing cards).
      *   **Rule 2:** Lottery.
      *   **Rule 3:** Maximize Total Points (Give to whoever claims highest value, verified by...?).
      *   **Rule 4:** Give to the person with the lowest ID number.
  *   **Discussion:** They will realize Rule 1 leads to Round 1's failure. Rule 3 leads to Round 2's lying problem.
  *   **Prediction:** They will gravitate toward **Rule 2 (Lottery)** as the only "fair" procedure, OR they will try to invent a verification mechanism (which you must block: "No money, no audits").
  *   **Twist:** If they choose Lottery, ask: "Does this rule assume we are all equally risk-averse?"
  *   **Execution:** They vote on the Rule. Then they open cards. Apply the Rule.
  *   **Result:** Tally the score.

  #### **1:10 – 1:30: The Debrief (The Map)**
  *   **Now** you write "Interpersonal Utility Comparisons" on the board.
  *   **Map Round 1 to Ordinalism:** "Round 1 was the Robbins/Ordinalist world. We had preferences (rankings), but no common metric. The result was Pareto-inefficient (we lost 99 points). The ordinalist says: 'That's tragic, but scientifically, we couldn't know #7 was special.' You feel that's a cop-out."
  *   **Map Round 2 to Measurement:** "Round 2 was the attempt to measure intensity without a currency. It failed because utility is private. Without a 'public currency' (like money) that hurts to spend, talk is cheap. The economists in the room were right: verbal intensity isn't data."
  *   **Map Round 3 to the Veil:** "Round 3 was Harsanyi/Rawls. You solved the problem by assuming you *could* be anyone. But to agree on the Lottery, you had to assume that a 1/18 chance is worth more than a guaranteed 0 for the sake of fairness. You implicitly compared the Tourist's disappointment to the Refugee's devastation. You made an IUC to avoid making an IUC."
  *   **Closing:** "The debate isn't settled. It's just hidden. Round 1 hid it in 'Procedure.' Round 3 hid it in 'Risk.' But you all agreed: ignoring the 100-point need felt wrong."

  ---

  ### **Honesty About Rigging & Limitations**

  **1. Which round is engineered to make which view look bad?**
  *   **Round 1 is rigged against Ordinalism.** By hiding the Refugee's identity, I force the ordinal voting system to fail. A strict ordinalist would say, "You didn't fail because of ordinalism; you failed because of *information asymmetry*." That is a valid critique of this game. Ordinalism doesn't forbid IUCs if you have the data; it forbids them because the data *doesn't exist*. The game conflates "missing data" with "incomparable data."
      *   *Steer:* In the debrief, admit this. "The game assumes the 100 points existed but were invisible. Robbins would say they didn't exist until revealed by choice."
  *   **Round 2 is rigged against Verbal Intensity.** It is designed to fail. There is no mechanism here to make truth-telling a dominant strategy (like a Vickrey auction).
      *   *Steer:* If students suggest "Let's bid points," shut it down. "Points are the utility, not the currency. If you bid points, you're assuming points are comparable across people. That's the thing we're testing."

  **2. The "Impossible Middle Round" Warning**
  You asked me to be straight: **Round 2 cannot theoretically reproduce the impossibility proof, only the political failure.**
  *   **The Problem:** To truly dramatize the impossibility of IUC, you need to show that *even with perfect information*, there is no unique way to aggregate. My Round 2 shows that *without a currency*, people lie. That's a mechanism design problem, not necessarily a philosophical impossibility.
  *   **The Smuggle:** If you let them use the "points" on their cards as bidding currency, you solve the problem. If Student #7 bids 50 points and Student #2 bids 5 points, you've created a common metric.
  *   **The Fix:** I explicitly forbid bidding points in the rules above. They must use *words*. This preserves the "no common currency" constraint.
  *   **Confession:** This round demonstrates that **cheap talk is not a welfare metric.** It does not prove that a welfare metric is *impossible*, only that **unverified self-reports** are useless. If you have philosophy students who read Sen, they will catch this. Acknowledge it: "This round shows the *epistemic* problem (we can't know), not necessarily the *ontological* problem (it doesn't exist)."

  **3. What Predictably Goes Wrong (and how to steer)**
  *   **The Economist Smugness:** The two economists will whisper during Round 2 that "This is why we use revealed preference."
      *   *Steer:* Don't silence them. Use them. "So, if we can't use words, and we can't use rankings, what *do* we use? Money? Is money a perfect measure of utility?" Turn their solution into the next problem.
  *   **The "Let's Split It" Solution:** Students will suggest cutting the chocolate bar into 18 pieces.
      *   *Steer:* "The good is indivisible. Like a kidney, or a job, or a right." Enforce indivisibility.
  *   **Round 3 Apathy:** If they choose Lottery in Round 3, they might feel they learned nothing.
      *   *Steer:* Press them on *why*. "Why is Lottery better than Giving to #7? Is it because you assume everyone's utility function is identical behind the veil? If so, you just assumed IUCs are possible."

  **4. Which Feature of the Problem a Game Cannot Reproduce**
  *   **The Normative Force:** The game shows the *efficiency loss* of ignoring IUCs (we lost 99 points). It does not capture the *moral wrong* of ignoring suffering. Students might say, "So we lost points. Big deal."
  *   **The Incommensurability:** The game assumes utility is quantifiable (1 vs 100). The hard philosophical view is that utility isn't a number at all. The game smuggles in cardinality to show the cost of ignoring it. You must admit this in the debrief: "I gave you numbers to make the loss visible. In reality, we don't have the numbers. That's the tragedy."

  ### **Final Instruction to You**
  Do not defend the game in the debrief. Let the economists attack it. Their attacks *are* the syllabus. If they say "Round 1 was just missing info," you say "Exactly. So where does the info come from without violating autonomy?" If they say "Round 2 was just bad mechanism," you say "So is there a mechanism that doesn't use money?"

  The goal isn't to prove one side right. It's to make the "settled" 1930s truce feel like a live grenade in their hands.
