  4.  **Independence of Irrelevant Alternatives (IIA):** (Removing unchosen options doesn't matter).
  5.  **Individual Monotonicity:** (More opportunity shouldn't hurt you).
  6.  **Informational Parsimony:** (Rule relies only on Disagreement Point $d$ and Ideal Point $u_{max}$).

  ### 2. The Conflicts

  #### Conflict A: The "Blind Arbitrator" (Principle 1 vs. Principle 6)
  **Severity:** **Critical (Existential)**
  **Status:** **Incompatible**

  This is the most severe conflict. It renders your system unable to function as intended in non-trivial cases. Principle 1 requires you to land exactly on the "frontier" of what is possible. Principle 6 forbids you from knowing where that frontier is.

  **Why they conflict:**
  Many different feasible sets share the same Disagreement Point ($d$) and Ideal Points ($u_{max}$), but have different shapes. A rule that only knows $d$ and $u_{max}$ must output the same deal for all of them. However, a deal that is efficient (on the frontier) for one shape will be inefficient (inside the frontier) for another.

  **Numerical Example:**
  *   **Context:** Dividing \$100. $d = (\$0, \$0)$. Ideals = $(\$100, \$100)$.
  *   **Case 1 (Linear):** Every dollar given to A is a dollar taken from B. The frontier is the line $A + B = 100$.
      *   A deal of $(\$50, \$50)$ is **Efficient** (Principle 1 satisfied).
  *   **Case 2 (Concave):** Due to tax penalties or transaction costs on large transfers, the total value shrinks if one person takes too much. The frontier is the curve $A^2 + B^2 = 5000$ (approx).
      *   The point $(\$50, \$50)$ yields $2500 + 2500 = 5000$. It is on the frontier.
  *   **Case 3 (Hidden Surplus):** Suppose there is a way to structure the deal (e.g., staggered payments) that creates value. The frontier is actually $A + B = 120$.
      *   Your rule, knowing only $d=(0,0)$ and Ideals=$(100,100)$, cannot distinguish Case 3 from Case 1. It recommends $(\$50, \$50)$.
      *   In Case 3, $(\$60, \$60)$ is possible. Your recommendation of $(\$50, \$50)$ leaves \$10 on the table.
      *   **Principle 1 is violated.**

  **Cheapest Revision:** **Drop Principle 6.**
  **What You Lose:** Simplicity. You (the mediator) must map the feasible frontier, not just the endpoints. You cannot arbitrate "in the dark."

  ---

  #### Conflict B: The "Nash vs. Kalai-Smorodinsky" War (Principle 4 vs. Principle 5)
  **Severity:** **High (Theoretical)**
  **Status:** **Incompatible**

  This is a famous impossibility result in game theory. You cannot have both IIA (4) and Monotonicity (5) while maintaining Efficiency (1) and Symmetry (2).
  *   **The Nash Bargaining Solution** satisfies 1, 2, 3, 4. It **violates 5**.
  *   **The Kalai-Smorodinsky Solution** satisfies 1, 2, 3, 5. It **violates 4**.

  **Why they conflict:**
  Principle 4 (IIA) says the deal depends only on the local shape of the frontier *at the solution*. Principle 5 (Monotonicity) says the deal depends on the *global* ideal points. If the frontier expands far away from the solution (changing the ideal point) but the local slope at the original solution remains the same, Principle 4 says "don't move," while Principle 5 says "A's leverage increased, move toward A."

  **Numerical Example:**
  *   **Scenario 1:** Feasible set is the triangle with corners $(0,0), (1,0), (0,1)$.
      *   Symmetric, Efficient solution: **$(0.5, 0.5)$**.
      *   Ideal Points: $(1, 1)$.
  *   **Scenario 2:** The set expands. We add a possibility where A can get more, but B's maximum remains 1. New corner at $(1.2, 0.1)$.
      *   New Ideal Points: $(1.2, 1)$. A's potential has risen.
      *   **Principle 5 (Monotonicity):** Since A's potential rose and B's stayed same, A must get $\ge 0.5$.
      *   **Principle 4 (IIA):** Suppose the expansion is shaped such that the *local slope* of the frontier at $(0.5, 0.5)$ is unchanged. The Nash solution (which satisfies IIA) looks only at that slope. It may calculate that the new optimal point is actually **$(0.48, 0.55)$** because the frontier flattens out further down, pulling the "center of gravity" toward B.
      *   **Result:** A's potential went up, but A's allocation went down ($0.5 \to 0.48$). Principle 5 is violated.

  **Cheapest Revision:** **Drop Principle 4 (IIA).**
  **What You Lose:** "Consistency" across sub-problems. However, most modern mediators prefer Kalai-Smorodinsky (keeping Monotonicity) because it feels fairer: if my best-case scenario improves, I shouldn't be punished for it. IIA is often viewed as too rigid for real-world mediation.

  ---

  #### Conflict C: Your Hunch (Principle 3 vs. Principle 5)
  **Severity:** **None (False Alarm)**
  **Status:** **Compatible**

  Your instinct was that Principle 3 (Scale Invariance) and Principle 5 (Monotonicity) fight. They do not, provided Principle 5 is interpreted correctly.
  *   **Principle 3** says: If I *re-number* my satisfaction (e.g., switch from dollars to cents), the deal shouldn't change.
  *   **Principle 5** says: If my *actual opportunities* expand (the feasible set grows), the deal shouldn't hurt me.

  The **Kalai-Smorodinsky solution** satisfies **both** 3 and 5. It is invariant to scaling (it normalizes utilities relative to the ideal point) and it is monotonic (if the ideal point moves out, the solution moves out).

  **Why you thought they conflicted:**
  You likely worried that if I "stretch" my scale (Principle 3), it looks like my "best achievable outcome" has increased numerically (triggering Principle 5).
  *   *Correction:* Principle 5 applies to the *set of feasible utilities*, not the numbers on the page. A mere rescaling (Principle 3) does not expand the feasible set; it just relabels the axes. Principle 5 is silent on relabeling. They operate on different dimensions.

  ---

  ### 3. Ranking the Conflicts

  1.  **Principle 1 vs. Principle 6 (Critical):** You cannot guarantee efficiency if you refuse to look at the frontier. This breaks the system's primary goal.
  2.  **Principle 4 vs. Principle 5 (High):** You must choose between two famous solutions (Nash or Kalai-Smorodinsky). You cannot have both.
  3.  **Principle 3 vs. Principle 5 (None):** These are compatible. Keep both.

  ### 4. The Single Best Change

  **Drop Principle 6.**

  **Reasoning:**
  Principle 6 is the bottleneck. As long as you insist that the mediator needs *only* the disagreement and ideal points, you mathematically cannot satisfy Principle 1 (Efficiency) for general cases. You are forcing the mediator to guess the shape of the frontier.

  If you drop Principle 6, you allow the mediator to inspect the feasible set. This immediately resolves the Critical Conflict. It then allows you to address the High Conflict (4 vs 5) by choosing a standard solution (like Kalai-Smorodinsky) that satisfies 1, 2, 3, and 5.

  **What you lose by dropping Principle 6:**
  You lose speed and simplicity. You can no longer arbitrate based on a quick phone call about "best case" and "worst case." You must ask the parties to map out the trade-offs (the frontier). In complex splits (like a business unwind), this is actually good practice—it forces parties to confront the reality of the trade-offs rather than fixating on ideals.

  ### Summary of Recommended Package
  To make your rule hang together, adopt the **Kalai-Smorodinsky** framework with full information:

  1.  **Keep:** Pareto Efficiency (1).
  2.  **Keep:** Symmetry (2).
  3.  **Keep:** Scale Invariance (3).
  4.  **Drop:** IIA (4).
  5.  **Keep:** Monotonicity (5).
  6.  **Drop:** Informational Parsimony (6).

  **The Rule:** *Find the point on the efficient frontier that preserves the ratio of each party's gain relative to their maximum possible gain.* (i.e., If A can get at most 100 and B can get at most 50, split the surplus so A gets twice as much utility gain as B). This satisfies everything except IIA, and it requires knowing the frontier.
