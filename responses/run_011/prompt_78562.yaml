      *   **Speaker's Position:** The socialist calculation debate is mis-framed. It's not about compute volume or dispersed info aggregation. It's about *representation* (categories/descriptions of the world). Prices license action on locally generated categories without translation. Kantorovich doesn't refute Mises because LP presupposes the option set. Incentives are bracketed.
      *   **Speaker's Anxiety:** Advisor thinks it's too philosophy-ish. Fear of doing "rational reconstruction" vs. "exegesis" regarding Hayek. Fear of the "name a non-market institution" question.
      *   **Deliverables:**
          1.  8 objections (ordered by damage, phrased in speaker's register).
          2.  90-second replies for each.
          3.  Blunt notes on soft spots/bluffs.
          4.  Flag "friendly fire" vs. "hope to get" questions.
          5.  Advice on concessions in the first 5 minutes (historians/exegesis issue).
