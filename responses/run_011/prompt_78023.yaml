  5. Precedent 7 is the closest analog because it confirms that absent pulses and artificial flow do not equal death in a conscious patient, beating precedent 3 which relies on permanent cessation of circulation.
  6. Ruling her dead commits us to the principle that native organ function defines life, which would make precedent 7 unstable because the LVAD patient also lacked native cardiac output.
  7. A brain-dead patient maintained on ECMO would have forced this earlier, as it separates the circulatory prong from the neurological prong more sharply than our LVAD case did.
  8. It is settled that brain death equals death and that PVS does not, but it is genuinely contested whether replacing all vital organ functions with machines renders a conscious patient dead.
