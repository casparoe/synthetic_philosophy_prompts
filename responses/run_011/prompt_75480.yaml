answer: |-
  Welcome, colleagues, students, and guests. It is a privilege to open this symposium, and to stand at the intersection of three disciplines that do not always speak the same dialect. We are gathered to consider a slender volume, published in 1958, that has grown heavier with interpretation than it ever was in print. We are here because a generous endowment has made this conversation possible, and I want to begin by acknowledging the founder of the supporting firm, who sits among us today. Your gift does not purchase a verdict; it purchases the time required to ask the question correctly. In an era eager for headlines, funding a room where uncertainty is permitted is the rarest form of optimism.

  We are here to discuss von Neumann's last manuscript, prepared for Yale's Silliman Memorial Lectures. He wrote these pages while confined to a hospital bed, and he died before he could deliver them. The text we have is what remains when the speaker is removed, leaving only the argument to stand on its own.

  That argument has been claimed by opposing camps for decades. One side insists von Neumann proved the nervous system is a digital machine. The other insists he proved the opposite. Both sides claim his authority. Both sides are likely misreading the text. The difficulty lies not in the data he surveyed, but in the grammar we use to describe it.

  Consider the task of describing the earth. If I ask you whether a map is the earth, you will say no. If I ask you whether a map is useless, you will also say no. The utility of a map depends on the projection chosen. A Mercator projection preserves angles, making it indispensable for navigation, but it distorts area so severely that Greenland appears larger than Africa. A different projection preserves area but renders coastlines unrecognizable. The complexity of the coastline—the length of the description required to draw it—changes depending on the grid you lay over it. To ask which map is the earth is a category error. The only meaningful question is which projection minimizes the distortion for the journey you intend to take.

  Von Neumann approached the nervous system with this same sensitivity to descriptive schemes. He observed that at the level of the individual neuron, the signal looks digital. A pulse occurs, or it does not. There is a threshold. Yet he insisted this binary appearance does not settle the code. He noted that the components of the nervous system carry only two or three significant digits of precision, whereas the machines he built carried many more. He noted that the biological system runs thousands of times slower than the vacuum-tube machinery of his day.

  Here, I should note a point of consensus. We all agree that the biological hardware operates at a clock speed that would embarrass a cheap wristwatch. The only dispute is whether we should be embarrassed for the brain, or for the watch.

  Von Neumann argued that the system compensates for this slowness and low precision by doing vastly many things at once. He proposed that its memory is nothing like a machine's. There are no fixed addresses. There is no exact retrieval. Instead, memory is statistical, layered, and reconstructive, with an enormous ratio of stored material to active elements. If you try to describe this architecture using the notation of arithmetic logic, the description becomes unwieldy. It becomes a map that requires more ink than the territory possesses.

  This brings us to the core idea organizing our day. Von Neumann suspected that the complication of a thing should be measured by the length of the shortest description of it. Crucially, this measure depends on the descriptive scheme adopted. Below some critical complexity, the notion stops being useful. If the language the nervous system speaks is not arithmetic, then describing it in arithmetic will make it appear either impossibly complex or deceptively simple. The analogy might hold as engineering—circuits firing, signals passing—and fail at the level that matters, which is the logical structure.

  Return to the map. If I attempt to navigate a ship using a projection designed for comparing land masses, I will fail. Not because the map is false, but because the description it offers is too long for the task. I must constantly correct for the distortion. Von Neumann suggested that finding out how the brain works would require inventing a new formalism rather than applying the old one. We are currently trying to navigate the nervous system with a projection designed for silicon. We are constantly correcting for distortion, and calling the distortion noise.

  This is why I cannot tell you that the brain is a computer. I also cannot tell you that it is not. Both formulations assume the map is the territory. Both assume that the descriptive scheme we currently possess is adequate to the object. Von Neumann's insight was that the notation might be the bottleneck. He left us with the suggestion that the logical structure of the nervous system may differ in kind from the notation we use to describe a computer.

  So, what is the work before us? It is not to vote on a definition. It is to examine the descriptive schemes themselves. The neuroscientists in this room know that the analog processes are in the mix. The computer scientists know that computation can be realized in many physical forms. The students know that the popular accounts are too clean. Our task is to see if we can find a projection that renders the description shorter, clearer, and more useful than the ones we have inherited.

  We have the opportunity to treat the manuscript not as a verdict, but as a method. We have the opportunity to acknowledge that the complexity of the mind may depend on the language we use to measure it. If we can agree on that, we might finally stop arguing about whether the map is the earth, and start drawing maps that allow us to travel.

  Gist: The question is not whether the brain fits our current definitions of computation, but whether our definitions are complex enough to describe the brain.
