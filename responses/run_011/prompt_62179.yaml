      *   *Japan Model:* More rigid. The Emperor is a symbol of the state with no powers related to government. Even personal wishes regarding status (abdication) require legislative action because the Emperor cannot act unilaterally in matters of state.
      *   *Underlying Theory:* This is the doctrine of **Ministerial Responsibility** combined with **Constitutional Monarchy**.
      *   *Power:* Power is defined formally as the capacity to issue binding commands or make state acts. Informal influence is acknowledged but legally nullified.
      *   *Accountability:* Accountability follows the formal act (countersignature/advice). If a Minister advises it, the Minister owns it. The Monarch is immune because they are inert instrumentally.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Define the core tension. The text describes a system where formal authority and informal influence are decoupled. The theory is one of *formalized agency* and *locatable accountability*.

      *   **Reconstructing the Implicit View (Task 1):**
          *   *Theory of Power:* Power is not causal influence; it is *authorization*. To have power is to be the legal source of the act. Therefore, the Monarch's private counsel is not "power" in the constitutional sense, even if it influences the PM.
          *   *Theory of Accountability:* Accountability requires a traceable chain. Minutes create traces. No minutes = no trace = no accountability for that specific interaction. Therefore, accountability attaches to the public act (signed by the Minister), not the private deliberation.
          *   *Strict Requirements vs. Comfortable Accompaniments:*
              *   *Strict:* Ministerial countersignature/advice is necessary for validity. Ministers must answer to Parliament.
              *   *Comfortable:* Secrecy of meetings. The "three rights." The idea that the Monarch *reads* papers. (Strictly, the Monarch could be illiterate and the system would work as long as they sign what the Minister says. The reading is a normative expectation, not a structural necessity).
              *   *Japan's strictness:* Even personal status changes require state action. This implies the Monarch is wholly absorbed into the state apparatus, unlike the UK where a private will can exist separately (though legally ineffective).

      *   **Underdetermination (Task 2):**
