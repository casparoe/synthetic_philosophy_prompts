          *   *Oracle Theory:* The Monarch is a mystical figurehead whose "will" is legally irrelevant.
          *   *Dual State Theory:* There is the "Dignified" state (Monarch) and the "Efficient" state (Cabinet). Both theories (Bagehot's) license the practice.
          *   *Legal Positivism vs. Conventions:* A positivist says only the law matters (Monarch has no power). A conventionalist says the conventions bind (Monarch *chooses* not to use power). The practice looks the same under both.

      *   **Assessing Coherence (Task 3):**
