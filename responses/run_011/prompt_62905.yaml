  Step five: By June, new rules required all outside links to be pre-vetted by moderators. The group was smaller, quieter, and more certain. Membership dropped to 2,800, but engagement among remainders rose. The belief remained true, but the walls thickened. Those who left were the ones who wanted to hear Gable out.

  **Analysis**

  The case satisfies the distinction. The group is a bubble because contrary voices are absent from daily feed; it is an echo chamber because those voices are actively discredited when they appear.

  **Counterfactuals:**
  1.  **Bubble Only:** Strip the discrediting apparatus (Mark's funding claims, the "gamblers" memes). If Gable speaks and is heard without pre-emptive distrust, members evaluate her claim on merit. They see the error, but also her respect. The structure opens; exposure works.
  2.  **Echo Chamber Only:** Let voices in but keep distrust. Gable speaks. Members see her error not as a mistake but as confirmation of outside incompetence. Belief hardens. This matches the actual outcome.

  **Structural Feature:**
  The single feature converting information into reinforcement is the **norm of preemptive safety distrust**. Because safety is the ultimate value, any outside variance is interpreted as threat rather than data. This feature does the work because it bypasses content evaluation; the source is disqualified before the argument is weighed. If removed, the group becomes a bubble: isolated, but permeable to evidence.

  **Bubble Intervention:**
  Had this been only a bubble, David's list of sources would have succeeded. Mere exposure pops bubbles. Here, exposure fed the chamber because the distrust mechanism converted the exposure into proof of danger.

  **Objection:**
  A critic might argue bubble and chamber are merely intensity differences: a bubble is a weak chamber, a chamber is a strong bubble. They would claim the distinction is verbal, not structural.

  **Concession:**
  My case concedes no ground. If they were the same phenomenon, increased exposure would eventually weaken the structure in both cases. In my narrative, increased exposure *strengthened* the closure (rules tightened, membership purged). This reversal of effect proves a difference in kind, not degree. The mechanism changed from passive absence to active immunization. The distinction holds.
