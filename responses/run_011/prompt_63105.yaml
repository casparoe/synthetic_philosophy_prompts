prompt: |-
  I spent most of last night arguing with a friend about Lewis on convention, and the argument has hardened into a workshop paper I present in three weeks. My thesis is that Lewis runs together two questions that must be separated: what makes a regularity a convention, and what keeps it in place. His analysis makes each agent's reason for conforming run through beliefs about the others' likely conformity; but there is a wide family of stable, arbitrary, coordination-solving regularities — queueing, forms of address, citation practice, tipping — in which the operative reason is moral or evaluative rather than predictive. People conform because not conforming would be rude, or because that is simply how the thing is done, and they would go on conforming on quite impoverished beliefs about what others actually do. My friend, who works on the psychology of norms, says this is no threat at all: the expectation-tracking does the real work, the moralized reasons are rationalization, and any regularity that survives a shock to people's expectations will have proved expectation-driven all along.

  The room will be mostly social ontologists plus several evolutionary game theorists who model norm emergence and care about dynamics rather than analysis; there are no Lewis specialists present. Write my Q&A prep sheet: the six or seven objections this audience will actually raise, phrased in their vocabulary rather than in a historian-of-analytic-philosophy register, and ordered by how much damage each would do to the talk. For each, give what I should concede immediately, the reply I should hold to, and a frank note on where that reply is thin. Close with two things: the objection that would show my two-question distinction is merely verbal rather than substantive, and the version of my friend's challenge that I cannot at present answer. No citations — I will add those myself.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User's Request:**
      *   **Topic:** Critique of David Lewis's account of convention (specifically, conflating the *constitution* of convention with its *maintenance/stability*).
      *   **User's Thesis:** Lewis focuses on predictive beliefs (I do X because I expect you to do X). The user argues many stable regularities (queueing, tipping, etc.) are maintained by moral/evaluative reasons (I do X because it's right/polite), even if beliefs about others' actions are impoverished.
      *   **Opposing View (Friend):** Moral reasons are rationalizations; expectation-tracking is the real causal mechanism. If expectations shatter and the norm survives, it wasn't expectation-driven.
      *   **Audience:** Social ontologists + Evolutionary Game Theorists (EGT). *Not* Lewis specialists. They care about dynamics, modeling, and ontology, not exegesis of Lewis's text.
      *   **Deliverable:** Q&A Prep Sheet.
      *   **Constraints:** 6-7 objections, ordered by damage potential. Phrased in audience vocabulary (social ontology/EGT), not historian register. For each: Concession, Reply, Weakness note. Plus: One objection showing the distinction is verbal, and one version of the friend's challenge currently unanswerable. No citations.

  2.  **Deconstruct the Audience & Topic:**
      *   *Social Ontologists:* Care about the status of social facts, collective intentionality, constitutive rules vs. regulative rules, the nature of normativity. They will ask: "Is this still a convention if it's moralized?" "What is the ontological status of the 'moral reason'?"
      *   *Evolutionary Game Theorists:* Care about equilibria, stability, basins of attraction, dynamics, signaling, cost/benefit. They will ask: "Is this just a different equilibrium selection mechanism?" "Does your account change the payoff matrix?" "How does this evolve?"
      *   *The Core Tension:* Lewis = Coordination Equilibrium + Mutual Expectations. User = Coordination Equilibrium + Normative/Moral Obligation (potentially independent of specific expectations).
      *   *The Risk:* The audience might see the user's "moral/evaluative" reason as just a *type* of expectation (expectation of sanction, expectation of reciprocity) or as a post-hoc rationalization (the friend's view).

  3.  **Drafting the Objections (Iterative Process):**

      *   *Attempt 1 (Too Lewis-focused):* "Lewis explicitly says..." -> *Correction:* Audience isn't Lewis specialists. Focus on the *concept* of convention/norm.
      *   *Attempt 2 (Too Psychological):* "People lie about their motives." -> *Correction:* This is the friend's point. Need to broaden to EGT/Ontology.
      *   *Attempt 3 (EGT focus):* "If it's stable, it's an equilibrium. Why does the *reason* matter?" -> *Good.* This attacks the utility of the distinction.
      *   *Attempt 4 (Ontology focus):* "If it's moral, isn't it a norm, not a convention?" -> *Good.* This attacks the classification.
      *   *Attempt 5 (Dynamics):* "How does your view explain emergence?" -> *Good.* Lewis explains emergence via salience/precedent. If moral reasons are primary, where do they come from?
      *   *Attempt 6 (The 'Rationalization' angle):* "Isn't 'rudeness' just a proxy for expected sanctions?" -> *Crucial.* This is the friend's point translated to EGT terms (payoffs).
      *   *Attempt 7 (The 'Verbal' angle):* "Are you just renaming 'internalized expectations' as 'moral reasons'?" -> *Required for the closing section.*

  4.  **Selecting and Ordering the Top 6-7:**
      *   *Highest Damage:* The "It's all just payoffs/sanctions" objection (EGT view). If moral reasons just alter the payoff matrix via anticipated sanctions, Lewis wins.
      *   *High Damage:* The "Emergence/Dynamics" objection. If moral reasons maintain it, what creates it? If expectations create it, Lewis wins the genesis story.
      *   *Medium-High:* The "Norm vs. Convention" category mistake. Social ontologists love drawing boundaries.
      *   *Medium:* The "Stability without Expectations" empirical claim. Do people *really* conform with impoverished beliefs?
      *   *Medium-Low:* The "Equilibrium Selection" argument. Maybe moral reasons are just a focal point device.
      *   *Low:* The "Lewis Exegesis" trap (avoid this, audience doesn't care). Replace with "Utility of the Distinction."

      *Refining the Order:*
      1.  The Payoff/Sanction Reduction (EGT).
      2.  The Emergence/Dynamics Gap (EGT/Ontology).
      3.  The Category Error (Norm vs. Convention) (Ontology).
      4.  The Empirical Claim (Impoverished Beliefs) (Psych/Ontology).
      5.  The Focal Point/Moral Salience (EGT).
      6.  The Functional Equivalence (Does the distinction do work?).

  5.  **Drafting the Content (Concession, Reply, Weakness):**
      *   *Tone:* Professional, strategic, candid about weaknesses.
      *   *Vocabulary:* Equilibrium, basin of attraction, payoff matrix, internalization, collective intentionality, constitutive.

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm defending Lewis. I'm defending the *distinction* against the audience who might think the distinction is useless.
      *   *Objection 1 (Payoffs):* They will say "Rudeness = Negative Payoff." I need to say "The *source* of the payoff matters for the ontology." Weakness: Functionally, they look the same in a model.
      *   *Objection 2 (Dynamics):* They will ask "How does the moral reason get there?" I need to say "It evolves, but once evolved, it operates differently." Weakness: Hard to model the transition.
      *   *Objection 3 (Norm vs Convention):* They will say "If it's moral, it's not arbitrary." I need to say "It's arbitrary in origin, normative in maintenance." Weakness: Blurs the line too much for purists.
      *   *Objection 4 (Impoverished Beliefs):* They will say "Show me the data." I need to say "Phenomenology + resilience to counter-evidence." Weakness: Anecdotal.
      *   *Objection 5 (Focal Point):* They will say "Morality is just a salience device." I need to say "Salience selects; obligation binds." Weakness: Salience can bind too.
      *   *Objection 6 (Utility):* They will say "Why does this distinction matter for modeling?" I need to say "Predicts different breaking points." Weakness: Hard to prove empirically.

  6.  **Addressing the Closing Requirements:**
      *   *Verbal Distinction:* The objection that "internalized expectation" = "moral reason."
      *   *Unanswerable Friend Challenge:* The counterfactual stability test (if expectations vanished, would the norm survive?).

  7.  **Review against Constraints:**
      *   6-7 objections? Yes.
      *   Ordered by damage? Yes.
      *   Audience vocabulary (EGT/Ontology)? Yes.
      *   Concede/Reply/Weakness structure? Yes.
      *   No citations? Yes.
      *   Closing two items? Yes.

  8.  **Final Polish:** Ensure the tone is helpful for a workshop setting (i.e., don't get bogged down in Lewis scholarship, keep it on the metaphysics/mechanics of norms). *Self-correction: Ensure the "Friend's Challenge" at the end is distinct from Objection 1.* Objection 1 is about payoffs/sanctions. The Friend's Challenge is about the counterfactual test of expectation-shocks.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # Q&A Prep Sheet: Convention, Maintenance, and Moralized Regularities

  **Audience Profile:** Social Ontologists (focus on status functions, collective intentionality) + Evolutionary Game Theorists (focus on dynamics, stability, equilibria).
  **Strategy:** Do not defend Lewis's text. Defend the *utility* of the distinction between constitution and maintenance. Pivot quickly from "what Lewis said" to "how norms actually function in dynamic systems."

  ---

  ### 1. The Payoff-Reduction Objection (Evolutionary Game Theory)
  **The Objection:** "You're claiming moral reasons replace predictive expectations. But in a model, 'fear of being rude' just looks like an anticipated sanction. If I conform because I expect social censure, that is still an expectation-driven payoff calculation. You haven't changed the mechanism; you've just relabeled a negative payoff as a 'moral reason.'"
  *   **Concede:** Functionally, in a static payoff matrix, the two look identical. Both result in conformity.
  *   **Reply:** The distinction matters for *dynamic resilience*. If conformity is based on predictive expectations, a shock to belief (e.g., seeing others defect) collapses the equilibrium immediately. If conformity is based on internalized normative force, the equilibrium can withstand a shock to beliefs about others' behavior. The *source* of the payoff determines the basin of attraction.
  *   **Weakness:** It is difficult to formally model "internalized normative force" without translating it into a payoff parameter. If I can't model it differently, the EGT crowd will treat it as epiphenomenal.

  ### 2. The Emergence Gap (Evolutionary Game Theory)
  **The Objection:** "You separate what makes a convention from what keeps it. But if the 'keeping it' mechanism (moral obligation) isn't present at the start, how does the regularity emerge? Lewis explains emergence via salience and precedent. Your account leaves the genesis of the moral reason unexplained. If expectations drive emergence, doesn't that make them the fundamental engine?"
  *   **Concede:** My account is not a full genealogy. I am not explaining how the moral reason arises from scratch, only how it operates once established.
  *   **Reply:** Emergence and maintenance are distinct phases with different causal structures. A bridge can be built by cranes (expectations) but held up by arches (norms). Showing the crane built it doesn't prove the crane is holding it up now.
  *   **Weakness:** If the moral reason is causally dependent on prior expectations for its own creation, the audience may view the "maintenance" phase as path-dependent inertia rather than a distinct ontological category.

  ### 3. The Category Mistake (Social Ontology)
  **The Objection:** "If a regularity is sustained by moral or evaluative reasons (rudeness, propriety), it is no longer a convention; it is a social norm. Conventions are supposed to be arbitrary. Once you moralize them, they lose their arbitrariness. You aren't correcting Lewis; you're just talking about a different phenomenon."
  *   **Concede:** The line between 'convention' and 'norm' is contested, and many regularities (like tipping) are hybrid cases.
  *   **Reply:** Arbitrariness applies to the *solution space* (we could have tipped 10% or 20%), not the *binding force*. A regularity can be arbitrary in origin but non-arbitrary in obligation. We need a category for arbitrary regularities that have acquired normative grip.
  *   **Weakness:** Social ontologists often define convention *by* the lack of normative force. I may be fighting the definition rather than the phenomenon.

  ### 4. The Empirical Claim (Psychology/Ontology)
  **The Objection:** "You claim people conform with 'impoverished beliefs' about others' conformity. But if I queue while everyone else cuts, I will eventually stop queuing. Doesn't the persistence of the regularity prove that people *are* tracking expectations, even if they report moral reasons?"
  *   **Concede:** If *everyone* defects, almost any norm collapses. Total isolation breaks conformity.
  *   **Reply:** The threshold for collapse is the key. Predictive accounts predict collapse at the first sign of widespread non-conformity. Moralized accounts predict resistance: people conform *despite* evidence that others are defecting (e.g., the 'honest citizen' in a corrupt system). The lag time is the evidence.
  *   **Weakness:** This relies on anecdotal observation of queues and tipping. Without experimental data on belief-decoupling, this looks like an armchair psychological claim.

  ### 5. The Focal Point Objection (Evolutionary Game Theory)
  **The Objection:** "Maybe the 'moral reason' is just a salience device. It coordinates us by making one equilibrium psychologically prominent. Lewis allows for salience. You're just describing a specific type of focal point."
  *   **Concede:** Moral reasons do act as focal points in coordination problems.
  *   **Reply:** Focal points solve the *selection* problem. Moral reasons solve the *stability* problem. A focal point helps us pick an equilibrium; a moral reason prevents us from leaving it when incentives shift. Lewis runs selection and stability together.
  *   **Weakness:** Lewis's account of expectation is meant to handle stability too. I need to be sharper on why a focal point isn't sufficient for stability without the expectation loop.

  ### 6. The Functional Equivalence Objection (Social Ontology)
  **The Objection:** "Even if you are right about the internal reasoning, what work does the distinction do? If the outcome is the same (stable coordination), why should ontologists care whether the glue is predictive or evaluative?"
  *   **Concede:** For predicting behavior in stable states, the distinction may be low-yield.
  *   **Reply:** It matters for explaining *change* and *breakdown*. If we treat all conventions as expectation-based, we will try to fix broken norms by manipulating information (changing beliefs). If they are moralized, we must manipulate values (changing preferences). The policy intervention differs.
  *   **Weakness:** This moves the goalposts from ontology to social engineering. The audience might demand a metaphysical reason, not a pragmatic one.

  ---

  ### Closing Requirements

  **1. The Objection that Shows the Distinction is Merely Verbal**
  "The distinction collapses if 'internalized expectation' is functionally identical to 'moral reason.' If I feel I *ought* to queue only because I have internalized the expectation that others expect me to queue, then the 'moral' feeling is just a cached expectation. Unless you can point to a case where the moral reason persists after the internalized expectation is extinguished, you are just describing the phenomenology of a complex expectation loop."

  **2. The Version of the Friend's Challenge I Cannot Answer**
  "The Counterfactual Stability Test. My friend argues that if we could magically remove all expectations of others' conformity (while keeping the moral reasoning intact), the regularity would vanish. If the moral reason cannot sustain the regularity in the total absence of expectation-tracking, then expectation-tracking is the necessary condition, and the moral reason is merely a mediating variable. I currently lack a case where conformity survives the total removal of empirical expectations."
