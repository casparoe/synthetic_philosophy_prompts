      *   **Checking Existing Ballots:** Look for **Condorcet Cycles** (A>B, B>C, C>A in majority preferences). If none exist, the "impossibility" is less painful, but you can't guarantee future rounds. Look for **Single-Peakedness** (unlikely in arts).
