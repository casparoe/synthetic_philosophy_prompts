answer: |-
  Subject: Re: The "Not Even Wrong" Objection and Non-Empirical Confirmation

  Colleagues,

  Following the recent discussion in the reading group regarding the status of multiverse proposals and the invocation of Pauli's famous dismissal, I have attempted to disentangle the various claims hidden within the slogan "that's not even wrong." As requested, I have laid these out as a numbered menu, evaluated their scope, and addressed the specific complication regarding typicality measures.

  I have also engaged with the hypothesis that the slogan, depending on how it is read, either fails to touch the confirmation argument or threatens to dismantle standard theoretical practice. My conclusion is that your intuition is largely correct, though the boundaries require careful drawing.

  ### The Menu: Five Readings of "Not Even Wrong"

  Here are five distinct claims one might be making when deploying the phrase, arranged from the trivial to the radical.

  **1. The Logical Incoherence Claim**
  *   **The Claim:** The theory contains internal mathematical contradictions or relies on undefined terms such that no consistent model can be constructed.
  *   **Conditions:** To satisfy this, the formalism must be demonstrably broken (e.g., yielding $1=0$). To violate it, the theory must be mathematically well-defined.
  *   **Truth Value:** If true, the theory is indeed useless. This is the only reading that is a straightforward truth-apt statement about the formalism itself.
  *   **Settling:** In principle, this can be settled by examining the theory's mathematics alone, without reference to sociology or experiment.
  *   **Relevance to the Dispute:** Unlikely to be the lattice colleague's point. Multiverse proposals (e.g., eternal inflation) are generally mathematically coherent, even if approximations are used.

  **2. The Strong Empiricist Claim (Popperian)**
  *   **The Claim:** There exists no possible observation, even in principle, that could count against the theory. It is compatible with every possible state of the world.
  *   **Conditions:** To satisfy this, the theory must lack falsifiable conditions. To violate it, there must be at least one conceivable empirical outcome that would force abandonment of the theory.
  *   **Truth Value:** Contested. Many argue this is a necessary condition for science; others (including proponents of non-empirical confirmation) argue it is too restrictive for fundamental physics.
  *   **Settling:** This requires analysing the relationship between the theory's structure and the space of possible observations. It is internal to the theory's logic, though it depends on what one counts as a "possible observation."
  *   **Relevance to the Dispute:** This is the most common intended meaning. However, it begs the question against the speaker's argument. The speaker was arguing *for* confirmation despite this lack of direct testability. Asserting this claim simply restates the premise the speaker is challenging.

  **3. The Elasticity Claim (The "Fit Anything" Charge)**
  *   **The Claim:** The theory is so flexible that it can be retrofitted to accommodate any actual data we might collect, usually via free parameters or adjustable mechanisms.
  *   **Conditions:** To satisfy this, the theory must allow for *ad hoc* modifications post-observation without penalty. To violate it, the theory must constrain the likelihood of specific outcomes.
  *   **Truth Value:** Plausible for certain multiverse models, specifically those where the "measure" (the probability distribution over universes) is not fixed by the dynamics.
  *   **Settling:** This requires looking at the theory's structure and its parameter space. It is not purely sociological.
  *   **Relevance to the Dispute:** This is the strongest candidate for a legitimate physical objection, specifically regarding the measure problem (see below).

  **4. The Methodological Deviance Claim**
  *   **The Claim:** The research programme violates the established norms of the discipline (e.g., demanding empirical contact within a reasonable timeframe).
  *   **Conditions:** To satisfy this, the community must agree that the behaviour constitutes a norm violation.
  *   **Truth Value:** This is not truth-apt in the same way; it is a normative claim about professional conduct.
  *   **Settling:** This is purely sociological. It requires looking at the history and sociology of the field, not the theory itself.
  *   **Relevance to the Dispute:** This licenses the *tone* of the dismissal but not the *epistemic* conclusion. It says "you are playing a different game," not "your score is zero."

  **5. The Radical Empiricist Claim**
  *   **The Claim:** Any theory that lacks *current* experimental accessibility is meaningless, regardless of its mathematical rigour or future prospects.
  *   **Conditions:** To satisfy this, the theory must be currently untestable.
  *   **Truth Value:** False, if applied consistently. This would have condemned General Relativity (1915–1919), the neutrino hypothesis (1930–1956), and arguably the quark model in its early days.
  *   **Settling:** Historical analysis of the field.
  *   **Relevance to the Dispute:** If this is the reading, the lattice colleague is inconsistent. Lattice QCD relies on computational extrapolations that were, at various points, beyond direct experimental verification, yet were pursued based on theoretical coherence.

  ### Does the Slogan License the Dismissal?

  The speaker's argument relies on Richard Dawid's three non-empirical arguments: No Alternatives (NA), Unexpected Explanatory Interconnections (UEI), and Meta-Inductive Inference (MII).

  None of the readings above automatically license shutting down *that specific argument*, except perhaps Reading 2 (Strong Empiricism). However, Reading 2 functions as a dogmatic barrier rather than a counter-argument. It asserts "Empiricism is the only valid path," whilst the speaker's talk was precisely an attempt to justify a deviation from strict empiricism. To say "That's not even wrong" in response to a philosophical argument about confirmation criteria is a category error; it treats a meta-scientific proposal as if it were a physical hypothesis.

  Reading 3 (Elasticity) is the only one that engages with the physics, but it targets the specific implementation of the multiverse model, not the general claim that non-empirical confirmation is possible.

  ### Testing Your Hypothesis

  You guessed that:
  1.  At least one reading is true of some multiverse proposals but does nothing to touch the confirmation argument.
  2.  At least one other reading would condemn most of theoretical physics if applied consistently, including the lattice colleague's field.

  **Your guess is correct.**

  1.  **Reading 3 (Elasticity)** applies to many multiverse proposals (specifically regarding the measure problem). However, it does not refute the *possibility* of non-empirical confirmation. It merely raises the bar for it. If a multiverse model can fix its measure via theoretical constraints (UEI), the elasticity objection is neutralised. Thus, the objection targets the *model*, not the *methodology of confirmation* being defended.
  2.  **Reading 5 (Radical Empiricism)** would indeed condemn much of theoretical physics. Lattice QCD itself often operates in regimes (e.g., finite density QCD) where direct experimental comparison is currently impossible due to the sign problem. The field proceeds based on mathematical consistency and continuity with tested regimes (a form of MII). If the lattice colleague applies Reading 5 strictly, he undermines the justification for his own work in untested regimes.

  ### The Complication: Typicality and the Measure

  You asked whether the objection regarding typicality (that one can swap the measure to fit any data) is a version of the slogan, a different objection, or both.

  It is best understood as the **technical realisation of Reading 3 (Elasticity)**.

  The slogan "not even wrong" is a rhetorical shell. The typicality objection fills that shell with physical content. It specifies *why* the theory might be unfalsifiable: not because it lacks equations, but because the probability measure over the ensemble of universes is underdetermined.

  **Does it survive being stated that precisely?**
  It survives only if the measure is truly a free parameter.
  *   **If the measure is ad hoc:** If researchers are indeed free to "swap the measure every time observations come out badly," then the theory is predictively empty. In this case, the typicality objection holds, and the theory is "not even wrong" in the sense that it cannot be wrong.
  *   **If the measure is derived:** Proponents argue the measure should be derived from the fundamental dynamics (e.g., via the Hartle-Hawking wavefunction or specific inflationary potentials). If the measure is fixed by the theory, then the theory *does* make risky predictions about typicality.

  Therefore, the objection is valid *against specific implementations* that treat the measure as a free parameter. It is not valid against the *general framework* of the multiverse, nor does it defeat the non-empirical confirmation argument per se. Dawid's UEI argument, for instance, is often used to argue that a theory is likely correct *because* it uniquely fixes such parameters where others fail.

  ### Conclusion

  The lattice colleague's interjection was rhetorically effective but philosophically imprecise.
  *   If he meant **Reading 1**, he owes us a proof of inconsistency.
  *   If he meant **Reading 2**, he is begging the question against the speaker.
  *   If he meant **Reading 3**, he has a valid point about specific models, but it does not rule out the methodology of non-empirical confirmation.
  *   If he meant **Reading 5**, he is historically illiterate regarding the development of his own field.

  The typicality objection is the only substantive physical critique on the table, but it targets the *construction* of the model, not the *epistemology* of the confirmation argument. To conflate the two is to do the very illegitimate work you suspected.

  I hope this provides the requisite precision for the list.

  Yours,

  [Your Name]
