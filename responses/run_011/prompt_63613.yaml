      *   What counts as progress? Yes.
      *   Cost-of-deviance test verdict? Yes.
      *   No citations? Yes.

      *Self-Correction on "Verbal vs Substantive":* Is it verbal? If they agreed "Liberalism = State Laws", Sweden wins. If "Liberalism = Social Tolerance", Norway might win (or vice versa depending on interpretation). The fact they won't agree on the definition suggests it's substantive about what *matters* in freedom, not just what the word means. I will argue it is substantive regarding the *locus of coercion*.

      *Refining the "Bet":* I'll bet on it being a substantive disagreement about the unit of analysis (State vs. Society) rather than a mere verbal confusion. They know what they mean; they disagree on what counts.

      *Refining Progress:* Dissolution is the most honest path. Split the question.

