answer: |-
  This is a splendid mess, and I rather envy the three of you for having an argument that has survived a year without resorting to shouting. It is rare to find a dispute so perfectly balanced that it becomes a feature of the friendship rather than a bug.

  Here is my diagnosis. I am going to bet that this is not a verbal disagreement, nor is it merely a measurement problem caused by both countries sitting at the ceiling of various indices. It is a **substantive disagreement about the unit of analysis and the locus of coercion**. You are not arguing about what the word 'liberal' means in the dictionary; you are arguing about what kind of power actually restricts human freedom.

  I would put money on this diagnosis because your friends' own words reveal that they have already agreed on the data but disagree on what data counts. Look at how they handled your cost-of-deviance test. Your Swedish friend said social friction "isn't politics". Your Norwegian friend said law on paper is "cheap". If this were merely a verbal dispute, they could agree to define 'liberalism' as 'state policy' and concede the point, or define it as 'social tolerance' and move on. They cannot do this because each believes the other's metric is irrelevant to the truth of the matter.

  The Swedish friend is operating with a theory of liberalism where the State is the primary agent of freedom. When they say the welfare state was built to "dissolve dependence on family, church and charity", they are describing a specific kind of liberty: freedom from intermediate institutions. For them, if the State guarantees your autonomy, you are free, regardless of whether your neighbours stare at you. The stare is private, not political.

  The Norwegian friend is operating with a theory of liberalism where Society is the primary agent of coercion. When they say "social pressure does the policing the state doesn't have to do", they are arguing that a law permitting deviance is meaningless if the community punishes it anyway. For them, the State is merely the backdrop; the real test of freedom is whether you can be a "weirdo" without social sanction.

  Therefore, the spreadsheet is useless to you because it measures State properties (laws, rankings, statutes), which privileges the Swedish friend's framework, whilst the anecdotal evidence about "behaving like a weirdo" privileges the Norwegian friend's framework. You cannot resolve this by finding more data, because they disagree on the ontology of freedom itself. One sees freedom as a legal status; the other sees it as a lived experience.

  So, what counts as progress? I do not think you will find a stipulated operationalisation that satisfies both, nor do I think you should try to argue that one conception of freedom is the 'right' one. That is a philosophical rabbit hole you will never exit.

  The only honest progress is **dissolution**. You need to stop asking "Which country is more liberal?" and start asking two separate questions: "Which country has more liberal institutions?" and "Which country has a more liberal culture?"

  If you ask the first, Sweden likely wins on the metrics of state-individualism and formal separation of church and state. If you ask the second, Norway might win on the metrics of social conformism versus individual stubbornness, or vice versa depending on how you measure the 'Jantelagen' effect. Once you split the question, the argument dissolves into a comparison of two different models of Nordic society, rather than a contest for a single crown. You should enjoy the argument rather than settle it, precisely because the tension between institutional liberty and social liberty is the most interesting thing about both nations. The fact that they are so similar yet distinct enough to fuel a year-long row is the point, not the problem.

  As for your cost-of-deviance test: be honest with yourself, it cannot be repaired into something both would accept in advance. The failure was not in your selection of deviant life plans; it was in the weighting. To make the test work, you would need to assign a numerical value to 'social friction' versus 'legal friction'. Your Swedish friend has already vetoed counting social friction as 'politics'. Your Norwegian friend has already vetoed counting legal friction as decisive.

  Any weighting scheme you propose will look like rigging to one side. If you weight legal barriers heavily, the Norwegian friend will call it naive statism. If you weight social barriers heavily, the Swedish friend will call it anecdotal sociology. The test itself smuggles in a conception of freedom—specifically, that all friction is equal—which is exactly what they are disputing. You cannot build a neutral arbiter when the parties disagree on what constitutes a barrier.

  My advice is to print the spreadsheet, frame it, and hang it on the wall. Order another round. Tell them they are both right about different things, and that the only true conclusion is that Scandinavia is wonderfully complicated. Then change the subject to something equally irresolvable, like which of them makes better coffee.
