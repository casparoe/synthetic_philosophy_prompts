      *   *The Calibration Procedure:* If we accept his premise, what *is* the calibration?
          1.  *Coherence:* Does this emotion fit with my other values? (e.g., Fear of flying vs. value of safety vs. statistics).
          2.  *Predictive Utility:* Does acting on this emotion lead to good outcomes?
          3.  *Intersubjectivity:* Do trusted others see the same value? (The sister example).
