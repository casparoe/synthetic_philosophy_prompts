  6.  **Final Polish:** Ensure the distinction between "ontological" (does justice exist?) and "epistemological" (can we know it?) is clear, as that is the crux of the user's discomfort.

  *(Self-Correction on the "Force" question)*: The passage says law rests on force. Pascal says force is necessary because justice without force is powerless, but justice without force is tyranny. He wants them combined. The passage implies law *is* force. Pascal says law *needs* force to be effective because men are corrupt. Subtle but important difference.

