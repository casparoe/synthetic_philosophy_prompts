      *Refining the "First Major Thinker" point:* Montaigne is the big one. "Custom is the queen of the world." Pascal stands on his shoulders. Also, the Sophists in antiquity. So "First major European" is definitely too strong.

      *Refining the "Positivism" point:* Legal positivism says law is law regardless of morality. Pascal says human law is arbitrary *because* we can't agree on morality, but we must obey to keep order. It's a precursor to the *sociology* of law, not the *jurisprudence* of positivism.

