prompt: |-
  Third-year political theory PhD student here. In seminar last week an Americanist announced, flat out, that England isn't a secular state (bishops in the upper house, an established church, the monarch as its head) while Germany obviously is — and when I pointed out that the German state literally collects a tax on behalf of the churches and passes it along, he said that's an implementation detail, the principle is still separation of church and state. I'm now pretty convinced we're running two totally different claims under one slogan and I want the menu nailed down before I write anything.

  Can you lay out the distinct precise theses that slogan could be standing for, ordered from weakest to strongest by how much they actually demand of a state? I mean the whole ladder: something like "the state doesn't found or constitute the church," "no religious officeholders," "no funding of religious activity," "no funding of religiously affiliated institutions at all," "no state endorsement of religious propositions," "no state interference in doctrine," up to the strong privatization reading where religion has to be kept out of public space. For each rung give me a pass/fail for England, Germany, France and the US, and tell me two things I actually need: is there any single rung where all four pass, and are the strongest rungs even coherent, given that the French one seems to run the opposite direction (protecting the state from religion rather than religion from the state)? Then say which rung my seminar-mate needed for his verdict, and whether it survives the Alsace-Moselle carve-out or the German state-as-tax-collector arrangement.

  No bibliography or further reading, I've got that covered — I want the argument.
