prompt: |-
  Been running a small product team for about three years and there's this one project I keep pouring people into even though its clearly not going anywhere. But here's the thing, I don't feel like I'm dodging it. If you asked me point blank I'd say yeah, sure, the retention numbers are bad, I'd say that out loud.

  Only I've noticed I've quietly arranged things so nobody actually does ask. I moved our metrics review into a meeting that the two people who track churn don't come to. I dropped the 1-on-1s with the engineers on that project and told myself it was to give them autonomy. An analyst sent me a doc last spring laying out the curve, and I read the first paragraph, got a bad feeling in my stomach, marked it unread, and then didn't think about it once for like two months. I'm not making that up, I genuinely didn't. I've gone back looking and I can't find a belief hiding in there. I don't secretly think the project is working. My wife says "you know deep down" and I honestly don't think I do.

  And there was never a moment where I sat down and decided to do any of this. No plan, no little voice going "don't look at that." It just kind of... happened, one small convenient decision at a time. So what is it then? Is this the same thing as being weak willed, or being overextended and not having time to think? Or is it a different animal, and if so how do you tell which one you're dealing with from the inside, since from the inside it feels identical to just being busy?

  Also what do I actually do about it. The obvious advice is "look at the data," but looking at the data is apparently the exact thing I keep arranging not to do, and the part of me that would have to notice the arranging is the part that's compromised. Feels a bit like being told to use a broken ruler to check whether the ruler is bent.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **Role:** Small product team lead (3 years).
      *   **Problem:** Persisting with a failing project (sunk cost fallacy/escalation of commitment).
      *   **Self-Awareness:** High. They admit the retention numbers are bad. They admit they aren't "dodging" consciously.
      *   **Behavior:** Subconsciously structuring the environment to avoid bad news (moving meetings, skipping 1:1s, ignoring reports).
      *   **Internal State:** No hidden belief that it will work. No conscious decision to avoid. It happened incrementally ("one small convenient decision at a time").
      *   **The Question:** What is this phenomenon? (Weak will? Overextended? Something else?) How to distinguish it from the inside? How to fix it when the mechanism for fixing it (self-awareness/decision making) is the compromised part?

  2.  **Identify the Phenomenon:**
      *   It's not simple weakness of will (akrasia) because there's no conflicting *conscious* desire.
      *   It's not just being overextended, though that facilitates it.
      *   It *is* a specific psychological defense mechanism.
      *   **Key Concept:** **Motivated Blindness** or **Structural Avoidance**.
      *   **Better Concept:** **The Boiling Frog / Slippery Slope of Avoidance.**
      *   **Best Concept:** **Cognitive Dissonance Reduction via Structural Engineering.** The user is engineering their reality to match their desired emotional state (safety from failure) without consciously lying to themselves.
      *   **Even Better (Professional Context):** **Escalation of Commitment** fueled by **Threat Rigidity**.
      *   **Most Accurate Label:** **Passive Avoidance via Structural Drift.** It's a form of self-deception that doesn't feel like lying. It's "strategic ignorance" implemented through calendar management.
      *   **Psychological Term:** **Repression** (Freudian, maybe too heavy) or **Disavowal** (knowing but not acknowledging).
      *   **Behavioral Econ Term:** **Omission Bias** + **Status Quo Bias**.
      *   **The "Vibe":** It feels like "busy-ness."
      *   **The Core Mechanism:** It's a *systemic* failure of governance, not just an individual failure of will. The user has become both the auditor and the auditee.

  3.  **Address the "What is it?" Question:**
      *   It's not weakness. Weakness implies a struggle you lose. This is a drift you don't notice.
      *   It's not just overextension. That's the fuel, not the engine.
      *   It is **Protective Structural Drift**. You are building a bunker without realizing you're laying bricks.
      *   It's a failure of *meta-cognition* (thinking about thinking) caused by stress/cognitive load. When the brain is overloaded, it prunes inputs that cause pain (cortisol spike) to preserve function.
      *   **Analogy:** It's like a immune system attacking the body. The mechanism designed to keep you productive (filtering noise) is filtering out signal because the signal is painful.

  4.  **Address the "How to tell from the inside?" Question:**
      *   Since the "ruler is bent," you can't use internal feeling alone.
      *   You need **External Proxies**.
      *   Look for *friction* in communication. Are people hesitant to bring you bad news?
      *   Look for *calendar asymmetry*. Are review meetings shorter or less frequent than build meetings?
      *   Look for *vague language*. Do you say "challenging" instead of "failing"?
      *   **The "Somatic Marker":** The user mentioned a "bad feeling in my stomach." That is the signal. Most people ignore it. The user needs to treat that physical sensation as an alarm bell, not a cue to look away.

  5.  **Address the "What do I do?" Question:**
      *   "Look at the data" is indeed broken advice here.
      *   Need to **Outsource the Governance**.
      *   **Action 1: Delegate the Trigger.** Give someone else permission to stop the project.
      *   **Action 2: Change the Venue.** Force the data into a room you can't control (e.g., all-hands, board review).
      *   **Action 3: Pre-commitment.** Set a "kill date" or "kill metric" *now* while rational, that triggers automatically later.
      *   **Action 4: The "Pre-Mortem".** Ask the team: "If this failed in 6 months, why did it happen?"
      *   **Action 5: Radical Transparency.** Admit the avoidance to the team. "I realize I haven't been looking at the churn data. I need us to put that in front of me every week." This breaks the shame cycle.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Empathetic, analytical, non-judgmental. Validate that this is common among leaders.
      *   *Structure:*
          1.  Name the beast (validate the experience).
          2.  Explain the mechanism (why it feels like "busy").
          3.  Diagnostic tools (how to spot it).
          4.  Actionable steps (how to break the loop).
      *   *Key Insight:* The user is suffering from **Cognitive Tunneling** under stress. The brain protects itself from threat by narrowing focus. The threat is "I failed." The focus narrows to "shipping features."
      *   *Refining the "Ruler" analogy:* Acknowledge it. You need a second ruler. That second ruler is another person or a rigid process.

  7.  **Final Polish:**
      *   Make sure to distinguish this from "weakness." Weakness is knowing you should eat the salad and eating the cake. This is hiding the cake so you don't have to choose.
      *   Highlight the "Somatic Marker" (stomach feeling). That's the only honest thing left.
      *   Suggest the "Kill Committee" idea.

  8.  *(Self-Correction during drafting)*: I initially thought about suggesting therapy. While valid, in a professional context, practical management interventions are more immediate. I'll focus on management mechanisms that force accountability.
      *   *Wait, one more thing:* The user said "I don't secretly think the project is working." This is crucial. It means hope isn't the driver. *Fear* is the driver. Fear of the aftermath of killing it. The avoidance is about delaying the *consequences* of the decision, not the decision itself. I need to address the fear of the *aftermath*.

  9.  **Finalizing the Plan:**
      *   **Name:** Structural Avoidance / Protective Drift.
      *   **Cause:** Threat response (Amygdala hijack of executive function).
      *   **Detection:** Somatic markers + Calendar audit.
      *   **Solution:** Externalize the decision + Radical admission.

  (Proceed to generate response based on these thoughts.)
answer: |-
  This is a incredibly sharp self-observation. Most people in your position would stop at "the retention numbers are bad." You've gone deeper and noticed the *architecture* of your own avoidance.

  To answer your first question: **No, this is not weak will.** Weak will (akrasia) is knowing you should do the hard thing and consciously choosing the easy thing. You aren't doing that. You are engaging in **Structural Avoidance driven by Threat Rigidity.**

  Here is the breakdown of what is happening, how to spot it next time, and how to break the loop when your internal compass is compromised.

  ### 1. What is this animal?

  You are experiencing a high-functioning version of **motivated blindness**, but it's specifically *structural*.

  When a leader faces a threat (project failure = personal failure, team disruption, wasted budget), the brain's threat response (amygdala) can subtly hijack the executive function (prefrontal cortex). It doesn't scream "PANIC!" Instead, it optimizes for short-term emotional safety.

  *   **Weak Will:** "I know I should look at that report, but I'm tired, so I won't."
  *   **Your Situation:** "I'm optimizing my schedule for efficiency. Moving this meeting saves 30 minutes. Skipping this 1:1 empowers the engineer. I am being a good manager."

  Your brain has re-framed avoidance as *efficiency*. This is why it feels identical to being busy. Because from a cognitive load perspective, it *is* busy-ness. You are filling the bandwidth with "safe" work (shipping features, managing autonomy) to crowd out the "dangerous" work (evaluating failure).

  It is not that you secretly believe the project will work. It's that you secretly fear the **consequences of declaring it dead.** You aren't avoiding the data; you are avoiding the *conversation that the data necessitates.*

  ### 2. How to tell from the inside (when the ruler is bent)

  You are right: you cannot trust your own narrative. When you are in the drift, every decision feels rational in the moment. You need **external proxies** and **somatic markers**.

  **The Somatic Marker:**
  You mentioned: *"I read the first paragraph, got a bad feeling in my stomach... and then didn't think about it once."*
  **That stomach feeling is the only honest data point you have.**
  In the future, treat physical discomfort not as a signal to retreat, but as a "Check Engine" light. If a document, meeting, or metric gives you a visceral drop in your chest, that is the exact thing you must schedule for immediately. The discomfort is the compass.

  **The Calendar Audit:**
  You cannot trust your *reasons* for meetings, but you can trust the *geometry* of your calendar.
  *   **Ratio of Build vs. Review:** Are you spending more time in planning/build meetings than in post-mortem/metric reviews?
  *   **Attendee Filtering:** Are the people who bring bad news (analysts, support leads) in fewer meetings than the people who bring good news (engineers, designers)?
  *   **The "Unread" Pile:** Do you have a pattern of marking emails as unread or archiving them without action?

  If your calendar is structured such that bad news requires *effort* to reach you, but good news arrives *automatically*, you are in Structural Avoidance.

  ### 3. How to fix it (without using the broken ruler)

  You cannot "decide" to stop this, because your decision-making apparatus is the thing that is currently configured to avoid the decision. You need to **outsource the governance.**

  **A. Radical Admission (Break the Shame Loop)**
  The avoidance is fueled by the shame of already avoiding it. The longer you go without looking, the harder it is to look.
  *   **Action:** Send a message to your team (or just the analysts/engineers on that project).
  *   **Script:** *"I've realized I haven't been giving the retention data the attention it needs. I've been too heads-down on execution. I need you to hold me accountable. Please put the churn metrics at the top of the agenda for our next sync, regardless of what else is on the plate."*
  *   **Why it works:** It removes the secret. Once you admit you were avoiding it, the avoidance loses its power. You can't hide from something you've just shined a light on.

  **B. The "Kill Switch" Pre-Commitment**
  Since you can't trust your future self to make the hard call, make the call *now* while you are rational.
  *   **Action:** Define the exact metric that kills the project. Not "improve retention," but "If retention is below X% on [Date], we sunset the project."
  *   **Crucial Step:** Tell the team this explicitly. "If we don't hit X by Date Y, I promise we will stop."
  *   **Why it works:** It turns the decision into a mechanical trigger. You don't have to decide to kill it later; the data decides for you. You just have to honor the contract.

  **C. Change the Venue**
  You moved the metrics review to a meeting the churn-trackers don't attend. Reverse that.
  *   **Action:** Move the project review to a meeting you *cannot* control. A steering committee, a board update, an all-hands.
  *   **Why it works:** You can't hide the data in a room full of people who aren't dependent on you for their day-to-day psychological safety. Public accountability forces the ruler to be straight.

  **D. Appoint a "Red Team"**
  *   **Action:** Ask one trusted peer or mentor: *"I am too close to Project X. I need you to look at the data and tell me if you would kill it. I promise to do whatever you say."*
  *   **Why it works:** They have a straight ruler. They don't have the emotional investment or the fear of consequences that you do.

  ### Summary
  You aren't weak. You are a human organism protecting itself from a perceived threat (failure) by optimizing your environment to reduce pain signals. This is a biological feature, not a bug, but it's maladaptive for leadership.

  The way out is not to try harder to "be honest." It is to **change the structure** so that honesty is the path of least resistance. Admit the avoidance to your team today. That single act usually breaks the spell.
