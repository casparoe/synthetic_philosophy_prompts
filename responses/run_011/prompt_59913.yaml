answer: |-
  Your friend is wrong on the hierarchy, wrong on the foundationalism, and wrong on the status of testimony. The order of *pramāṇas* in the *Nyāya Sūtra* (Perception, Inference, Comparison, Testimony) is not a ranking of evidential weight like a hierarchy of courts; it is primarily pedagogical or based on the order of cognitive development. Perception is listed first because it is the root of the others—you need to see smoke before you infer fire—but this does not mean perception automatically trumps testimony in a conflict. Nyāya is explicitly realist and externalist, not Cartesian foundationalist. Perception (*pratyakṣa*) is fallible; illusions and errors are common. Validity is not self-certifying; it is known extrinsically (*parataḥ prāmāṇya*) through successful action (*samvādi pravṛtti*). If you see water in a mirage, that perception feels certain but is false; it does not trump the testimony of a local who says it is sand.

  Regarding your concrete cases: In the well scenario, Nyāya adjudicates based on instrumental defects (*doṣa*), not rigid rank. If your vision is clear and conditions are optimal, perception wins regarding spatial location because it is direct access, whereas testimony is indirect. However, if you are far away or the light is bad (defects in sense organ), the testimony of a reliable person standing next to the well overrides your perception. It is not that testimony is weaker; it is that your instrument is currently defective. In the ritual case, the answer changes completely. For supersensible realities (*adhokṣaja*) like the results of a ritual or the nature of moksha, perception is incompetent. It cannot see the future or the metaphysical. Here, testimony (*śabda*) is not a "crutch"; it is the sole valid *pramāṇa*. Nyāya treats Vedic claims about these matters as genuine knowledge, not diplomatic concessions, because there is no other way to know them.

  The system holds together because each *pramāṇa* has a specific domain (*viṣaya*). They are tools for different jobs, not competitors in a weight class. Perception handles the present and sensible; inference handles the hidden but connected; testimony handles the remote, past, future, and supersensible. When they clash on a sensible object, you check for defects. When the object is supersensible, testimony rules by default because the other tools cannot reach it.

