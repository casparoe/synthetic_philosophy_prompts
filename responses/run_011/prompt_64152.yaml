answer: |-
  Here is the plan for the 25 minutes.

  ### 1. The Sequence (and Why)

  You have 25 minutes. Do not start with the diagnosis. If you start with the diagnosis, students assume *all* categories work this way (including rocks and atoms), or they assume you are arguing biology doesn't matter.

  **0:00–0:04: The Baseline (Indifferent Kinds)**
  *   **Action:** Briefly define a "static" category. Use a rock or a quark.
  *   **Script:** "If I classify this as a 'granite rock,' the rock doesn't care. It doesn't read the label and change its molecular structure to fit the definition better. The knowledge we have about the rock doesn't change the rock."
  *   **Why:** You must establish what a *non-looping* kind looks like first. Without this contrast, the looping effect sounds like "all science is subjective," which triggers the misconceptions immediately.

  **0:04–0:14: The Example (The Loop)**
  *   **Action:** Tell the chosen example (see below). Walk through the three stages: Classification $\rightarrow$ Human Reaction $\rightarrow$ Classification Shift.
  *   **Why:** This is the core. You need to show the movement in *both* directions (people change, then the category changes).

  **0:14–0:19: The Misconception Firewall**
  *   **Action:** Pre-emptively address "Made Up" and "Self-Fulfilling."
  *   **Why:** If you wait for them to ask, you'll run out of time. You must frame the interpretation *before* they solidify their own (wrong) interpretations.

  **0:19–0:25: Discussion & Assessment**
  *   **Action:** Open floor, then hit them with the final question.
  *   **Why:** Let them test the concept against their own experiences.

  ---

  ### 2. The Example Choice

  **Choose: The Counseling Office "Check-in List."**

  **Why:**
  The "Friend with Anxiety" example is a trap. It demonstrates *identity uptake* (she accepts the label), but it doesn't clearly show the *classification system* changing. It is too easily dismissed as "she just acts differently now" (Labeling Theory) rather than "the definition of anxiety itself has to evolve because people like her exist."

  The **Counseling List** works because it explicitly shows the **authority** having to move. The loop isn't just inside the student's head; it's in the institution. The office predicted $X$, the students became $Y$, so the office had to rewrite the rules for $Z$. That is the loop: Knowledge $\rightarrow$ People $\rightarrow$ New Knowledge.

  **What the example MUST have:**
  *   **The Feedback:** You must explicitly state that the office *changed the list* because of how the kids reacted. If the list stayed the same and the kids just failed to match it, that's just a bad test. The *criteria* must shift.
  *   **The Agency:** The kids shouldn't be "faking it." They should be reacting genuinely to the support (or stigma) of being on the list.

  **What the example CANNOT have:**
  *   **Malice:** Do not frame the office as "trying to catch them" or the kids as "trying to fool the office." That makes it a game, not a looping effect.
  *   **Finality:** Do not imply the *new* list is the "correct" one. It's just the current iteration. It will loop again next year.

  ---

  ### 3. Handling Misconceptions

  You need to address these *during* the explanation phase (minutes 14–19), not as an Q&A at the end.

  **Objection 1: "So mental illness is just made up then?"**
  *   **Where:** Immediately after explaining the Loop mechanism.
  *   **How:** Distinguish between the *suffering* and the *bucket*.
  *   **Script:** "Hacking isn't saying the pain is fake. The kids were definitely struggling. He's saying the *bucket* we put them in changes shape when they climb inside it. The suffering is real; the classification is unstable."
  *   **Why:** If you don't say this, they will tune out the rest of the talk as "anti-psychiatry."

  **Objection 2: "Isn't this just a self-fulfilling prophecy?"**
  *   **Where:** Right after the "Made Up" point.
  *   **How:** Distinguish *Falsehood* from *Instability*.
  *   **Script:** "A self-fulfilling prophecy is when a **false** belief makes itself true (I think I'll fail, so I don't study, so I fail). A looping effect is when a **true** belief changes the truth (We classify you as 'at-risk,' you get support, you no longer fit the 'at-risk' definition, so the definition breaks). Prophecy is about belief creating reality. Looping is about knowledge changing the thing known."
  *   **Why:** This is the most sophisticated philosophical distinction. If they leave thinking it's just prophecy, they missed the ontology shift.

  ---

  ### 4. The Final Assessment Question

  Do not ask "Do you understand?" Ask them to apply the logic to a new variable.

  **The Question:**
  "If we banned the word 'anxiety' in this school tomorrow—no one could use the label—would the looping effect stop? Why or why not?"

  **What to listen for:**
  *   **They get it if:** They say "No, because kids would still find a way to describe their pain, and the counselors would still notice a pattern, and a new label would eventually form." (They understand the interaction is inevitable, not just about the word).
  *   **They missed it if:** They say "Yes, because without the label, people wouldn't act differently." (They think it's just Labeling Theory).
  *   **They missed it if:** They say "No, because biology is biology." (They missed the Interactive Kind distinction).

  ---

  ### 5. What to Bracket (What NOT to Answer)

  You must openly state what you are **not** solving today. This protects you from getting bogged down in debates you can't win in 25 minutes.

  **Say this explicitly:**
  "I am not going to answer whether anxiety is *biological* or *social* today. Hacking's point works either way. Whether the cause is chemicals or culture, the *loop* happens because people know how they are classified. We are bracketing the cause to look at the interaction."

  **Why:** High schoolers love to debate nature vs. nurture. If you let them in that door, you will lose 15 minutes and never get to the Looping Effect. Force the suspension of that question.
