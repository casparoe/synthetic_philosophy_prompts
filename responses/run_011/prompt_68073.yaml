  Start by asking: "In Round 3, who decided their signal before entering the room?" and "Did anyone change their mind after seeing the other team move?" Use their answers to map the Certification Window to a commitment race. Explain that the Priority Modifier simulated the advantage of locking in a threat before the opponent can react. Point out that the "High/High" disaster wasn't caused by aggression, but by the race to be First. When a team certified "High" early to secure the +2 bonus, they forced the other team's hand, replicating Schelling's bridge-burning. To challenge last month's consensus, ask: "If being a Dove requires waiting to see if the other is a Dove, but waiting costs you the First Mover advantage, can you afford to be a Dove?" and "Does promising to be predictable help if the other side races to lock in a threat before they hear your promise?" This shifts the focus from moral choice to structural constraint. Highlight the Conditional failure: wanting to be safe *and* first is impossible. The structure punishes hesitation. The "Dove" strategy from last month assumes you have time to coordinate. This game removes time. In real geopolitics or AI deployment, the side that deploys first sets the standards. Ask them: "Is being right worth being second?"

  7. **What will go wrong**
  **Side Deals:** Ban hallway talk. Declare any off-channel communication voids your Priority Tag. If caught, they lose all points for that round. **Vague Pledges:** If a team writes "whatever" or "match you", Control transcribes "UNKNOWN". UNKNOWN counts as High (risk-averse interpretation), triggering disaster. This punishes laziness. **Free-Riders:** If a team refuses to certify, apply the "No Certification" penalty (-2 points) automatically. They cannot benefit from the other team's risk. They must play to lose less. **Rules Lawyer:** The Facilitator's ruling during Certification is final. Do not debate during the Clock. Note the objection and resolve it in Debrief. If they argue, pause the timer but warn them time is bleeding. **Overtime:** If Round 3 drags, announce "Final Minute" at T-80. Stop play exactly at 100. Unresolved rounds count as Low/Low. Prepare a printed timer schedule to keep yourself honest. If you spend too long explaining Conditionals in Round 2, skip the explanation and let them fail; the failure is the lesson. Keep the debrief tight; if you run over, assign reading for next week instead of finishing the discussion.

  8. **What the game can't reproduce**
  This activity fakes the *cost* of failure. In reality, a commitment race might lead to war or market crash, not just losing paper clips. You must supply the stakes in the debrief. It also fakes *time*. Real commitment races happen over days or years, allowing for reputation building; here, reputation resets every round. Finally, it cannot reproduce *asymmetric information*. In the game, everyone sees the board. In reality, you often don't know if the other side has locked their strategy until it's too late. You will need to verbally add these layers during the debrief to connect the game to political or AI safety contexts.

  **Variant for six people:** Run one team of three against a "Simulated Opponent" (you, the facilitator). The three players must agree on a single card. The race is internal: who gets to write the card? You (the Opponent) certify your own move instantly at T-minus 2 minutes. This forces them to race against each other to define their group's stance before you lock them in. It reproduces the internal coordination failure that precedes external conflict.
