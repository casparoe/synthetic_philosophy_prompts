      *   *Data:* We live in fuzzy land.
      *   *Argument:* Philosophy is wrong/outdated for practical ontology. "Identity" in data is a *decision*, not a discovery.
      *   *Counter:* If you allow degrees, you lose the ability to reason logically about the entity. You can't count distinct customers accurately.
      *   *My stance:* Argue that the philosophical insistence on binary identity is the confused position *in the context of data*, because data identity is epistemic (about knowledge), not ontological (about being).

