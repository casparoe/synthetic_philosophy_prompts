      *   *Perdurantism (4D Worm):* Objects are spacetime worms. Temporal parts exist at specific times. The "object" is the sum of all parts. Change is variation between parts.
      *   *Stage Theory (4D Stages):* Only the current time-slice exists. Cross-time identity is a counterpart relation (like possible worlds, but temporal).
      *   *Temporary Intrinsics:* How can $x$ be $F$ at $t_1$ and not-$F$ at $t_2$? Endurantists say relations to times ($F$-at-$t$). Perdurantists say different parts have different properties.
      *   *Identity:* Philosophers usually demand strict numerical identity ($A = B$). No degrees.

  3.  **Translate to Data Engineering (The Core Task):**
      *   *Entity:* `entity_id`.
      *   *Temporal Part:* A specific row version (SCD2), an event in a stream, or a bitemporal slice (`valid_from`, `valid_to`).
      *   *Endurantism:* The `entity_id` is the object. It persists. The attributes change, but the ID remains the "substance."
      *   *Perdurantism:* The "object" is the entire history (the event stream or the full chain of SCD2 rows). A single row is a temporal part.
      *   *Stage Theory:* A single row/version is the only reality. Linking to previous versions is a "counterpart" relation (foreign key or lineage pointer).
      *   *Merge:* Two `entity_id`s become one.
      *   *Tombstone:* A marker saying "this ID is dead, go to that ID."

  4.  **Drafting the Translation (Iterative refinement):**
      *   *Endurantist:* The `entity_id` is the soul. Even if attributes change, it's the same ID. A merge is a correction of error; one ID was always the "true" ID, the other was an alias.
      *   *Perdurantist:* The "Customer" is the aggregate of all events/rows. A merge stitches two worms together. The tombstoned ID is a temporal part of the pre-merge worm segment.
      *   *Stage:* The row *is* the entity. The `entity_id` is just a tag. Linking is a relation, not identity.

  5.  **Addressing the Residue Report:**
      *   *Clean:* Temporary intrinsics (SCD2 handles this natively).
      *   *Bent:* Identity over time (Data allows `NULL`s or probabilistic links; Philosophy demands binary identity).
      *   *Impossible:* Strict numerical identity with probabilistic matching (Philosophy breaks at $P < 1.0$).

  6.  **Temporary Intrinsics Analysis:**
      *   Data models *love* temporary intrinsics. `status = 'active'` at $t_1$, `status = 'churned'` at $t_2$.
      *   Does this assume a side? It looks Perdurantist (different rows have different states) but is implemented via Endurantist keys (`entity_id` stays same). Actually, Bitemporal modeling is arguably neutral or heavily Perdurantist because the "truth" is the spacetime volume of the data, not the ID.
      *   *Verdict:* The schema assumes Perdurantism (time is a dimension of the data), but the API usually exposes Endurantism (give me the *current* state of ID X).

