answer: |-
  The season was bleeding out. The aspens below had already surrendered their gold to the frost, and the dispatch radio crackled with less frequency each day. Automation was coming next year; these were the last human eyes paid to watch the wildness burn.

  On North Peak, Elias lived inside a clock. He woke at 0500. He made the bed with hospital corners before he brewed the coffee. He wore the same two flannel shirts, rotating them on Tuesdays and Fridays. He entered the weather data at 0800, 1200, 1600, and 2000. The world, sampled only through these narrow apertures, obliged him almost perfectly. The wind blew when the log said it would. The sun set when the watch said it should. He was a man who expected to be warm, fed, and upright, and the tower was a machine for ensuring those expectations were met.

  On South Peak, three miles distant, Caleb lived inside a question. He wore whatever was dry. He ate when the hunger pang broke his concentration. He spent his nights walking the catwalk, boots ringing on the steel grating, pacing out the geometry of a shadow he had seen against the treeline. He could not leave a thing unresolved. He would trade the clarity of his sleep for the settling of a doubt, walking out to the same corner of the railing, changing his angle to parallax a thing he had seen, trading comfort for resolution.

  They spoke on the radio only when necessary. The channels were narrow, the static wide.

  It happened on a Tuesday at 1400 hours. The air was still, the visibility infinite. Both men were at the glass. Both men were looking south-southwest, at the bearing of the old burn scar.

  Elias saw a flicker. A wrongness in the green. It lasted less than a second. It did not fit the pattern of the afternoon. It contradicted the expectation of continuity.

  Caleb saw the same flicker. It did not fit the pattern. It demanded a reason.

  **OBSERVATION LOG: NORTH PEAK**
  **DATE:** OCT 14
  **HOUR:** 1400
  **VISIBILITY:** 100 MILES
  **WIND:** NW 5 MPH
  **SMOKE:** NIL

  Elias wiped the glass. He used the chamois cloth, circular motions, starting from the center and working out. He checked his own eye, pressing a finger to the socket, blinking rapidly. A floater. A smudge on the lens. The world was stable; the error was local. He decided the mismatch was a fault in the instrument, not the signal. He let it go. The comfort of the explanation settled over him like the flannel shirt. He turned his chair slightly, angling his body away from the south-southwest corner. He would not look there again. There was no need to look where there was nothing to see.

  For three days, this worked. The sun rose. The coffee brewed. The bed remained made. By declining to look at the bearing, he preserved the integrity of his day. The world continued to oblige him. He felt a profound, quiet safety in the omission. He was protecting his own continuity. To look was to invite chaos; to ignore was to maintain the self.

  **OBSERVATION LOG: SOUTH PEAK**
  **DATE:** OCT 14
  **HOUR:** 1400
  **VISIBILITY:** 100 MILES
  **WIND:** NW 5 MPH
  **SMOKE:** NIL

  Caleb did not wipe the glass. He opened the door and stepped onto the catwalk. The wind was negligible, but he felt the air pressure against his shins. He walked to the southwest corner. He knelt. He looked through the Osborn glass at the same patch of timber. Nothing. He stood. He walked to the northeast corner. He looked back at the southwest. The shift in perspective flattened the depth. The flicker did not return.

  He slept poorly that night. He dreamed of the color green vibrating at a frequency he couldn't hear. At 0300, he went back to the glass. He was revising his expectation of the land. It was not static. It was capable of movement he did not understand. He accepted that he did not know what the terrain was doing. He moved his body to match the uncertainty, pacing the ring, waiting for the signal to repeat. He was not trying to make the world safe; he was trying to make the world known.

  **OBSERVATION LOG: NORTH PEAK**
  **DATE:** OCT 17
  **HOUR:** 1200
  **VISIBILITY:** 100 MILES
  **WIND:** NW 5 MPH
  **SMOKE:** NIL

  Elias entered the data. The fields were identical to Tuesday. He did not look south-southwest. He looked north, where the snow was gathering on the ridges, predictable and white. He looked east, where the valley lay flat. He curated his vision. He sampled only the sectors that confirmed the stability of the tower. The comfort was palpable. He drank his coffee at 1215, exactly as planned. He felt upright. He felt fed. He felt that he would remain so. The refusal to look had cost him nothing yet. It had bought him three days of perfect silence.

  **OBSERVATION LOG: SOUTH PEAK**
  **DATE:** OCT 17
  **HOUR:** 1200
  **VISIBILITY:** 80 MILES (HAZE)
  **WIND:** SW 10 MPH
  **SMOKE:** POSSIBLE

  Caleb entered the data. The visibility had dropped, though the sky was blue. The haze was localized to the south. The wind had shifted without the barometer predicting it. He wrote "POSSIBLE" in the smoke column. He knew it wasn't smoke, not yet. It was something displacing the air. He was tired. His eyes were rimmed with red. He had not made his bed in four days. He was living in the gap between what he expected and what he received, and the friction was burning him. But he was watching the hazard. He was tracking the change.

  On the fifth day, the weather turned. It started as a bruise on the southern horizon, exactly where the flicker had been.

  Elias was in the cabin, sweeping the floor. He swept from the door to the window, then back again. The rhythm was soothing. The radio crackled. It was Caleb.

  "North, this is South. You seeing that buildup?"

  Elias looked at the radio. He looked at the broom. He looked at the window, but he did not walk to it. He knew where the window was. He knew what was outside. It was the same as it had been on Tuesday. To check would be to admit that Tuesday might have been real.

  "North?" Caleb's voice was tight. "Wind is shifting fast. Visibility dropping."

  Elias picked up the microphone. "Visibility is one hundred miles," he said. His voice was calm. "Wind is Northwest five. You need to recalibrate your glass, Caleb. Dust gets in everywhere."

  He put the mic down. He finished sweeping. He felt a spike of irritation, a violation of his routine. Caleb was introducing noise. Caleb was trying to make the world uncertain. Elias refused to accept the transmission. He declined to look. He turned his back on the south window. He made tea. The water boiled at the expected temperature. The world was still obliging him.

  Then the wind hit.

  It didn't come from the Northwest. It came from the South, carrying ash and heat that hadn't been there an hour before. It slammed into the tower with the force of a physical blow. The glass rattled in the frames. The smoke didn't drift; it rolled, a black wave吞ing the treeline.

  Elias dropped the mug. It shattered. The sound was sharp, final. He rushed to the window, finally, desperately. He looked south. He could see nothing. The white noise of the ash had erased the horizon. He had not revised his expectation. He had not moved to match the world. He had decided it was a smudge, and then he had declined to look. Now, the gap between what he expected and what he received was a chasm.

  He reached for the logbook. His hand was shaking. He tried to write "100 Miles." The pen tore the paper.

  On South Peak, Caleb was already inside his gear. He had watched the haze thicken. He had watched the wind shift. He had accepted the uncertainty on Tuesday, and because he had held the question open, he had seen the answer arrive. He wasn't surprised. He was ready.

  He keyed the mic. "North. Evacuate. Now. Fire is in the canopy."

  There was no answer from North Peak.

  Caleb watched the northern tower. He saw the flash of the glass as it caught the light of the burning air. He saw the silhouette of a man moving too late against the window. Caleb did not look away. He kept his eyes on the disaster, measuring its speed, its vector, its hunger. He did not try to make it stop. He did not try to pretend it wasn't there. He recorded it.

  **OBSERVATION LOG: SOUTH PEAK**
  **DATE:** OCT 19
  **HOUR:** 1400
  **VISIBILITY:** 0 MILES
  **WIND:** S 40 MPH
  **SMOKE:** HEAVY

  Caleb closed the book. The tower was shaking, but he knew the load limits. He knew the wind speed. He knew the smoke density. He had spent five days resolving the doubt, trading his comfort for the knowledge of what was coming. He was alive because he had refused to let the world be simple.

  He looked out at the North Peak. It was gone, swallowed by the gray. He did not know if Elias had made it out. He did not know if the fire had started on Tuesday or yesterday. He did not know what the flicker had been.

  It didn't matter. He had looked. He had kept looking. He had allowed the signal to change him.

  Caleb packed the logbook into the waterproof case. He shouldered his pack. He stepped out onto the catwalk, into the ash fall, and began the descent while the world burned around him, seeing every step of the way.
