answer: |-
  ### Instructor Sketch: The Space of Discriminations

  This quiz maps the conceptual terrain of epistemic injustice without using the technical vocabulary. It forces students to discriminate between five distinct axes of failure in communication:

  1.  **The Belief Axis (Fricker-T vs. Deflationary):** Distinguishes between a listener rejecting a claim due to identity prejudice (injustice) versus a listener rejecting a claim due to lack of evidence or simple mistake (error).
  2.  **The Capacity Axis (Dotson-Q vs. Fricker-T):** Distinguishes between a listener doubting the *truth* of a claim (testimonial) versus a listener failing to recognize the speaker as a valid source of speech at all (quieting).
  3.  **The Safety Axis (Dotson-S vs. Deflationary):** Distinguishes between a speaker choosing silence for self-preservation (smothering) versus silence due to shyness or lack of knowledge.
  4.  **The Resource Axis (Fricker-H vs. Pohlhaus/Dotson-C):** Distinguishes between a community lacking the concepts to understand an experience (hermeneutical gap) versus a community possessing the concepts but refusing to apply them to specific speakers (willful/contributory).
  5.  **The Labor Axis (Berenstain vs. Deflationary):** Distinguishes between a request for knowledge that extracts unpaid emotional work (exploitation) versus a genuine mutual exchange.
  6.  **The Act Axis (Kukla vs. Fricker-T):** Distinguishes between a speaker not being believed (testimonial) versus a speaker being understood but their speech acting functioning differently than intended (e.g., an order heard as a request).

  ***

  ### Quiz: How Do You Judge These Cases?

  **Instructions:** Read each scenario. Choose the option that best describes *why* the interaction went wrong. There are no right answers; select the judgment that matches your intuition.

  **1. The Clinic**
  A patient describes a specific type of chronic pain to a doctor. The doctor writes "anxiety" in the chart and prescribes a mild sedative.
  *   A. The doctor assumes people like this patient tend to exaggerate their symptoms.
  *   B. The medical field lacks a specific name for this condition, so the doctor has nowhere to file the complaint.
  *   C. The doctor is overworked and made a hasty diagnosis based on common probabilities.

  **2. The Staff Meeting**
  During a brainstorming session, a junior employee begins to outline a risk. Halfway through, she stops speaking and sits back.
  *   A. She noticed the managers looking annoyed and decided it wasn't safe to finish the thought.
  *   B. The managers stopped making eye contact, signaling they didn't view her as someone whose input mattered.
  *   C. She realized she hadn't prepared enough data to support her point.

  **3. The Jury Room**
  A juror explains that the defendant's behavior was a cultural signal of respect, not aggression. The other jurors reject this explanation.
  *   A. The other jurors know about this cultural signal but decide it isn't relevant to the law.
  *   B. The other jurors have never heard of this signal and cannot conceptualize it as non-aggressive.
  *   C. The other jurors simply find the defendant's testimony unconvincing based on the video evidence.

  **4. The Group Chat**
  A team lead types: "Please have the drafts on my desk by 5 PM." The team members treat this as a friendly reminder and submit them late.
  *   A. The team thinks the lead is too new to actually give real commands.
  *   B. The team assumes the lead is lying about the deadline to pressure them.
  *   C. The team views the message as a request they can negotiate, not a directive they must obey.

  **5. The Coffee Break**
  A student of color is eating lunch when a classmate asks, "Can you explain exactly how microaggressions work? I want to learn."
  *   A. The student feels pressured to teach, knowing that saying "no" might make them look uncooperative.
  *   B. The student is happy to share their perspective with a willing listener.
  *   C. The classmate is genuinely confused and needs clarification to avoid future mistakes.

  **6. The Town Hall**
  A resident stands up to speak about housing policy. The microphone is cut off after two minutes, though others are allowed five.
  *   A. The moderators don't believe this resident has useful information to add.
  *   B. The moderators want to limit the resident's ability to influence the room's decision.
  *   C. The moderators made a technical error with the timer.

  **7. The HR Complaint**
  An employee files a report using a specific term for harassment found in the company handbook. HR responds, "We don't use that interpretation here."
  *   A. HR acknowledges the term exists but refuses to apply it to this case.
  *   B. HR argues the term is too vague to be useful in any case.
  *   C. HR states the evidence provided doesn't meet the standard for that term.

  **8. The Family Dinner**
  A relative makes a joke about a marginalized group. You stay silent instead of objecting.
  *   A. You know that objecting will start a fight that ruins the holiday for everyone.
  *   B. You don't have the words to explain why the joke is harmful in the moment.
  *   C. You aren't sure if the joke was actually meant to be harmful.

  **9. The Classroom**
  A student raises their hand to correct the professor. The professor says, "Let's not get sidetracked," and calls on another student.
  *   A. The professor thinks the student is trying to show off rather than learn.
  *   B. The professor assumes the student's correction is likely incorrect.
  *   C. The professor treats the student's interruption as noise rather than a contribution.

  **10. The Neighborhood Watch**
  Residents discuss a series of break-ins. One resident suggests a pattern based on time of day. The group ignores this.
  *   A. The group thinks this resident is prone to conspiracy theories.
  *   B. The group lacks a way to track the timing of the break-ins systematically.
  *   C. The group has already decided on a different theory and doesn't want to change.

  ***

  ### Scoring Key & Theoretical Commitments

  Tally your choices. Your dominant pattern reveals which philosophical account your intuitions align with.

  **Mostly 1A, 3C, 6A, 9B, 10A: Fricker (Testimonial Injustice)**
  *   *Commitment:* You believe the core wrong is when prejudice causes a listener to downgrade the truth-value of a speaker's word.
  *   *Awkward Commitment:* This view struggles to explain why a speaker might be silenced even when the audience believes them.

  **Mostly 1B, 3B, 8B, 10B: Fricker (Hermeneutical Injustice)**
  *   *Commitment:* You believe the core wrong is a gap in shared social understanding that leaves experiences nameless and unintelligible.
  *   *Awkward Commitment:* This view implies the injustice is accidental, rather than a result of the powerful refusing to learn new terms.

  **Mostly 2B, 6B, 9C: Dotson (Quieting)**
  *   *Commitment:* You believe the core wrong is failing to recognize a speaker as a legitimate participant in the exchange, regardless of belief.
  *   *Awkward Commitment:* This view risks conflating rudeness with a distinctively epistemic harm.

  **Mostly 2A, 8A: Dotson (Smothering)**
  *   *Commitment:* You believe the core wrong is forcing a speaker to truncate their own speech to ensure the audience's safety or comfort.
  *   *Awkward Commitment:* This view places the burden of managing the interaction's safety on the marginalized speaker.

  **Mostly 3A, 7A, 10C: Pohlhaus (Willful Hermeneutical Ignorance) / Dotson (Contributory)**
  *   *Commitment:* You believe the core wrong is the dominant group refusing to use available conceptual tools to understand marginalized experiences.
  *   *Awkward Commitment:* This view makes it difficult to distinguish between malicious refusal and simple intellectual laziness.

  **Mostly 4A, 4C: Kukla (Discursive Injustice)**
  *   *Commitment:* You believe the core wrong is when social identity causes a speech act to misfire (e.g., an order functions as a request).
  *   *Awkward Commitment:* This view suggests that changing social habits is more urgent than changing individual beliefs.

  **Mostly 5A: Berenstain (Epistemic Exploitation)**
  *   *Commitment:* You believe the core wrong is demanding that marginalized people educate others at the cost of their own energy and time.
  *   *Awkward Commitment:* This view risks treating all requests for knowledge from the privileged as inherently coercive.

  **Mostly 1C, 2C, 3C, 5C, 7C, 8C, 9B, 10C: Deflationary**
  *   *Commitment:* You believe these are cases of ordinary unfairness, bad character, or error, not a distinct category of epistemic injustice.
  *   *Awkward Commitment:* This view must deny that there is anything unique about harms that target a person specifically in their capacity as a knower.

  ***

  ### Limitations Analysis

  **The Indistinguishable Leaves:**
  Your items cannot reliably separate **Pohlhaus (Willful Hermeneutical Ignorance)** from **Dotson (Contributory Injustice)**. Both 3A and 7A describe an audience possessing a concept but refusing to apply it. The distinction between Pohlhaus's focus on the *dominant group's comfort* and Dotson's focus on *excluding the speaker from the community* is too subtle for a short scenario; both look like "refusal to use available tools."

  **The Empty Cell:**
  There is no item that cleanly isolates **Dotson (Contributory)** from **Pohlhaus** without overlap. This is not because no view occupies this space, but because the conceptual boundary is porous: refusing to use a concept (Contributory) is often the mechanism by which one maintains ignorance (Willful). To separate them would require scenarios detailing the *internal motivation* of the audience, which breaks the constraint of judging only "what happens."
