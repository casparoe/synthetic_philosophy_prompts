answer: |-
  # The Boundary Problem in Practice: Scotland 2014 and the UK 2016

  ## Principles and Provisions
  The democratic boundary problem asks how we define the *demos* without already assuming a *demos* to make the definition. Your experience highlights the friction between three candidate principles. The **all-affected principle** suggests anyone impacted by the outcome should vote. In 2014, this supports including you (your life in Scotland would change) and Scots in London (their constitutional status would change). In 2016, it supports including you (EU citizenship rights) and excluding long-term British expats (less affected by UK-EU ties). The **all-subjected principle** argues for inclusion based on subjection to coercive authority. This supports your inclusion in both votes, as you are subject to UK/Scottish law, but struggles to explain why a Scot in London is excluded from 2014 (not subject to Holyrood) while included in 2016 (subject to Westminster). The **membership view** relies on pre-political belonging, typically citizenship. This justifies your exclusion in 2016 and the inclusion of Commonwealth citizens, but fails to explain why you were included in 2014 or why Lords (non-electoral members) voted in 2016.

  A fourth principle is required to make sense of your inclusion in 2014: **territorial stakeholder residency**. This posits that presence, economic contribution, and social integration (taxes, NHS work) create a claim to decide the territory's future, distinct from formal citizenship. This principle licenses your 2014 vote and condemns your 2016 exclusion. It is silent on the 15-year expat rule, which implies a decay of stake over time, yet it conflicts with the 2016 inclusion of non-resident peers who hold no territorial stake.

  ## The Deflationary Explanation: Administrative Path Dependence
  The reading that these franchises were products of administrative path dependence is correct. The 2014 franchise reused the Scottish Parliament election register (residency-based), while the 2016 franchise reused the UK Parliamentary election register (citizenship-based). This was done for speed, cost, and legal familiarity. However, this does not rescue the practice from incoherence; it condemns it more thoroughly. A boundary drawn for convenience admits that no democratic principle was deemed important enough to override administrative ease. When the machinery of the state determines the boundaries of the people, the result is not a *demos* but a bureaucratic artifact. The anomalies you list—Lords voting, Gibraltar bolted on, the 15-year cliff-edge—are indeed artefacts of reusing machinery. They are defensible only if one accepts that the right to vote is a technical privilege granted by the state rather than a moral right derived from affectedness or subjection.

  ## From Episodes to Theory: Regress and Remedy
  Running the analysis from the episodes back to theory illuminates the regress objection. Westminster lending competence to Holyrood for 2014 (via Section 30) acknowledges that the Scottish *demos* is constituted by the UK *demos*. Yet, Westminster setting the 2016 franchise confirms that the UK *demos* is self-defining. This supports the regress objection: the body deciding the boundary is always an already-constituted demos. There is no respectable theoretical answer to this, only a political one: power decides. The advisory character of the 2016 vote complicates this. If the vote was merely a consultation, the all-affected principle should have dominated to gauge opinion. If it was a decision, membership should have dominated. By using a membership franchise for an advisory vote that was treated as decisive, the state created a category error.

  Your case requires saying that two incompatible conceptions of the *demos* were in force within twenty-one months. In 2014, you were a stakeholder; in 2016, you were a foreigner. This is not a shift in theory but a shift in the underlying electoral machinery. Finally, your settled status is best understood as a fresh enactment of a boundary problem, not a remedy. It regularizes your presence *after* the exclusion, confirming that your right to remain was granted by the very authority that denied you a voice in its direction. It solves a legal status problem but leaves the democratic boundary wound open.

