answer: |-
  ### Preamble: Philosophical Stance and Definitions

  **The Duty:** This procedure presupposes that duties to the dead are duties to the **living** (family, community, descendants) and to the **record** (public understanding of history). We operate on the principle that while the dead cannot feel pain, their reputations sustain the living, and false histories corrupt the public trust. We do not accept that a disclaimer card discharges the obligation to be truthful; a card manages audience expectation, it does not absolve specific falsehoods.

  **The Distinctions:**
  1.  **Said vs. Did vs. Why:**
      *   *Said:* Verbatim dialogue requires a source.
      *   *Did:* Actions may be inferred if consistent with the record, but specific undocumented acts require high narrative necessity.
      *   *Why:* Internal motivation is the highest risk. Inventing a *reason* for an action (especially a culpable one) without evidence is prohibited unless framed explicitly as speculation within the text.
  2.  **Identifiability & Corrigibility:** Obligation scales with **Identifiability** (can the audience pin this to a specific soul?) and inversely with **Corrigibility** (can the audience easily check the facts?). High Identifiability + Low Corrigibility = Maximum Duty of Care.
  3.  **Family Objections:**
      *   *Private Matters:* Objections bind. (Fame does not forfeit privacy on unrecorded intimate acts).
      *   *Public Matters:* Objections weigh but do not bind. (Historical record trumps family comfort).
      *   *Culpability:* Objections regarding invented negligence/crime weigh heavily regardless of public status.

  ---

  ### The Clearance Procedure (The "Machinery")

  **Time Allocation:** 4 Hours (Initial Project), 15 Minutes (Late Flag).
  **Output:** A "Clearance Memo" for every decision, filed permanently.

  **Step 1: Identification & Corrigibility Check**
  *   **Question:** Is the person named? Are they a public figure regarding the events portrayed? Is the record easily checkable by a viewer (e.g., famous trial) or obscure (e.g., internal mill log)?
  *   **Pass:** Private individual or obscure record (High Care). Public figure/obscure record (High Care). Public figure/public record (Standard Care).
  *   **Fail:** None. This sets the "Duty Level" for the rest of the procedure.
  *   **Note:** A "nameless face" requires no clearance. A named victim requires maximum care.

  **Step 2: The Claim Type (Said / Did / Why)**
  *   **Question:** What is being invented?
      *   *A:* Verbatim dialogue ("Said").
      *   *B:* Physical action or event ("Did").
      *   *C:* Internal motivation or decision process ("Why").
  *   **Rule:**
      *   *Said:* Must be sourced. If unsourced, must be generalized (e.g., "He argued" vs. "He said X").
      *   *Did:* Must be consistent with known facts.
      *   *Why:* Must not attribute specific culpable intent without evidence.
  *   **Stop:** If *Said* is unsourced and specific → **REVISE**. If *Why* attributes culpability without evidence → **BLOCK** (proceed to Step 4 only if non-culpable).

  **Step 3: Evidentiary Grading**
  *   **Question:** What is the source quality?
      *   *Grade A:* Multiple independent primary sources (logs, transcripts, contemporaneous letters).
      *   *Grade B:* Single primary source or multiple reputable secondary sources (biographies).
      *   *Grade C:* Single secondary source, rumor, or "historian consensus" without paper trail.
      *   *Grade D:* No source (Invention).
  *   **Rule:**
      *   Grade A/B: Clear for Public Acts.
      *   Grade C: Clear only if non-culpable and non-intimate.
      *   Grade D: **BLOCK** for Public Acts. **CLEAR-WITH-CONDITIONS** for Private Acts *only* if Step 4 is passed.

  **Step 4: Harm & Objection Assessment**
  *   **Question:** Does this portrayal subtract from reputation, invade privacy, or add unearned virtue? Have living relatives objected?
  *   **Rule:**
      *   *Subtracts (Defamation/Negligence):* Requires Grade A evidence. Family objection **BINDS** (must remove/change).
      *   *Invades Privacy (Intimate/Neutral):* Requires Grade B evidence. Family objection **BINDS** for private figures; **WEIGHS** for public figures (requires Step 5 justification).
      *   *Adds (Heroism):* Permitted if not misleading about historical outcome.
  *   **Stop:** If Family Objection binds and is not met → **BLOCK**.

  **Step 5: Narrative Necessity vs. Truth**
  *   **Question:** Is this invention essential to the dramatic structure, or is it convenient? Can the same emotional beat be achieved with a composite character or generalized action?
  *   **Rule:** If the invention is Grade D (No Source) and Step 4 flagged a risk, you must prove there is **No Alternative**.
  *   **Stop:** If an alternative exists → **REVISE**. If no alternative exists and risk is low → **CLEAR-WITH-CONDITIONS**.

  **Step 6: Mitigation (The "Condition")**
  *   **Question:** If cleared with risk, how do we signal the uncertainty?
  *   **Rule:**
      *   *Dialogue:* Change specific quotes to general sentiment.
      *   *Visuals:* Avoid close-ups on documents that contradict the scene.
      *   *Disclosure:* A card is **not** a cure for specific falsehoods. It is only permitted if the *structure* of the film is rearranged (e.g., "Based on true events" vs. "This film is a dramatization").
  *   **Stop:** If the only mitigation is a end-card for a specific lie → **REVISE**.

  **Step 7: The Human Handoff (Value Judgment)**
  *   **Question:** Does this decision rest on a moral value (e.g., "Is it right to show this grief?") rather than a fact?
  *   **Rule:** If Steps 1-6 are passed but the Standards Officer feels a "moral residue," the decision is escalated to the Executive Producer.
  *   **Stop:** Escalation.

  ---

  ### The Override Mechanism

  **The Cost:** A Showrunner may override a **REVISE** or **BLOCK** verdict.
  **The Price:** To keep the project defensible, the Showrunner must identify a scene of **equal dramatic weight** elsewhere in the script to be cut or neutralized.
  **Rationale:** This maintains a "Fabrication Budget." You cannot invent freely; every invented dollar of drama must be paid for by cutting a documented dollar of drama. This ensures the *total* historical distortion remains capped.
  **Documentation:** The Override Memo must be signed by the Showrunner and filed alongside the Clearance Memo. It will read: *"I accept responsibility for the historical deviation in Scene X. To balance the narrative weight, Scene Y has been removed."*

  ---

  ### Audit Trail Requirement

  Every decision generates a **Clearance Memo** (max 1 page). It must contain:
  1.  The Scene/Line in question.
  2.  The Step Number that decided it.
  3.  The "Defensibility Statement": A sentence written for the family.
      *   *Example:* "We could not verify this conversation, so we changed the dialogue to reflect his known public position, to ensure we do not misrepresent his private views to his grandchildren."
      *   *Constraint:* If you cannot read this sentence to the family without shame, the clearance is invalid.

  ---

  ### Case Studies

  #### Case A: The Strike Organizer
  *   **Analysis:**
      *   *Step 1:* Public Figure (High Identifiability), but Private Life (Low Corrigibility). Duty Level: High.
      *   *Step 2:* "Why/Interior Life" (Romance). This is an invention of private intimacy.
      *   *Step 3:* Grade D (No Source).
      *   *Step 4:* Invades Privacy (Intimate). Family Objection: **BINDS** (Private matters survive fame).
      *   *Step 5:* Narrative Necessity: Writers claim it's essential for "interior life." However, a composite character could provide the emotional support without pinning a specific romantic history on the real woman.
      *   *Step 6:* Mitigation: A card does not cure the specific attribution of a romance to a named woman whose family objects.
  *   **Reasoning:** The procedure prioritizes the privacy of the dead regarding intimate matters over dramatic utility, especially when living kin object. The "Public Figure" status covers her public acts (the strike), not her bedroom. Inventing a specific romance is a "Why/Did" invention without evidence that harms the surviving family's memory of her private self.
  *   **Unwelcome Factor:** This is unwelcome because it removes the show's emotional through-line. The procedure does not bend on the "Family Objection Binds" rule for private acts.

  VERDICT: A | REVISE | Step 4

  #### Case B: The Industrial Disaster
  *   **Analysis:**
      *   *Step 1:* Named Individual. High Identifiability. Local community (High Corrigibility—people know the truth). Duty Level: Maximum.
      *   *Step 2:* "Why" (Decided not to pass warning). This attributes specific culpability/negligence.
      *   *Step 3:* Grade D (No Source). Log shows warning existed, not that he saw it or ignored it.
      *   *Step 4:* Subtracts from Reputation (Negligence). Family Objection: Not contacted yet, but the act itself is defamatory in nature.
      *   *Step 5:* Narrative Necessity: Creates a villain. Alternative: The system failed, or the warning was lost.
      *   *Step 6:* Mitigation: The production plans to use a disclaimer card. The procedure states a card is **not** a cure for specific invented negligence.
  *   **Reasoning:** Inventing a specific act of negligence that causes death is the highest risk category. It turns a tragedy into a morality play with a fabricated villain. The disclaimer card is insufficient because the audience will remember the villain, not the card. This violates the duty to the record and the living family.
  *   **Unwelcome Factor:** This is unwelcome because it kills the dramatic antagonist. The procedure explicitly rejects the "Disclaimer Card" as a fix for specific lies.

  VERDICT: B | BLOCK | Step 6

  #### Case C: The Famous Writer
  *   **Analysis:**
      *   *Step 1:* Very Famous Writer. High Identifiability. High Corrigibility (letters exist). Duty Level: Standard.
      *   *Step 2:* "Said" (Verbatim from letter).
      *   *Step 3:* Grade A (Source exists).
      *   *Step 4:* Subtracts from Reputation (Cruelty), but Context mitigates. The "Harm" is distortion of character, not invention of fact.
      *   *Step 5:* Narrative Necessity: Scene cut for length. The apology was removed for pacing, not historical reason.
      *   *Step 6:* Mitigation: The quote is real, but the *implication* is false. The "Defensibility Statement" fails here: "We used his words but hid his apology" is embarrassing.
  *   **Reasoning:** While the words are sourced (Step 3 Pass), the *context* creates a false "Why." However, since the words are documented, this is not an invention of fact, but a selection of truth. The procedure allows this *if* the distortion is not culpable. But Step 7 (Human Handoff) flags the moral residue. However, strictly following the machinery: The words are real. The apology is a separate event.
      *   *Correction:* Step 2 classifies this as "Said." Step 3 clears it. Step 4 flags reputation subtract. But since it is sourced, Step 4 does not BLOCK. It requires Mitigation. Can we restore the apology? If cut for length, can it be implied?
      *   *Decision:* The procedure demands truthfulness of *character*, not just quotes. Dropping the apology creates a false historical record of the relationship.
      *   *Refinement:* Step 6 requires mitigation. If the apology cannot be filmed, the scene must be framed to show his volatility, not just cruelty. But the cleanest fix is to restore the context.
      *   *Verdict:* REVISE. You cannot use a true quote to tell a false story about the relationship.

  VERDICT: C | REVISE | Step 6

  ---

  ### Critique of Your Distinctions

  Your list is largely correct, but two distinctions collapse under pressure:

  1.  **"Adds to Reputation" vs. "Morally Neutral but Intimate":** You treat these as different. The procedure treats them similarly regarding **Privacy**. Whether you make him a hero or a lover, if it is an intimate private act without evidence, you are claiming access to a soul you do not have. The family's objection binds in both cases. The "Hero" invention is often more patronizing and historically distorting than the "Lover" invention.
  2.  **"Inventing What They Did" vs. "Inventing Why":** These are distinct in theory, but in practice, showing a man *reading* a warning (Did) implies he *decided* to ignore it (Why). You cannot separate the action from the motivation in cinema. The procedure treats specific undocumented actions that imply motivation as "Why" claims.

  **On Disclosure Cards:** They announce that you chose not to discharge the obligation. They are a warning label, not a safety belt. They protect the *company* from legal liability (sometimes), but they do not protect the *dead* from misrepresentation. The procedure treats them as insufficient mitigation for specific harmful falsehoods.

  **On Family Objections:** The procedure draws the line at **Privacy vs. History**. If it happened in the public record, the family cannot veto history. If it happened in the home, the family can veto fiction.

  ---

  ### Limitations and Judgment Calls

  **Where the Machinery Fails:**
  Step 5 (Narrative Necessity) is a judgment call wearing the costume of procedure. A producer can always argue "This is essential." The "Override Cost" attempts to quantify this, but it is ultimately a power struggle, not a calculation.

  **What This Cannot Do:**
  It cannot stop a Showrunner who is willing to pay the "Cost." It cannot stop a company that values speed over reputation. It relies on the Standards Officer having the courage to file the "Defensibility Statement" that might shame the production.

  **Most Abusable Step:**
  Step 5 is the easiest to game. Producers will claim every invention is "essential" to the emotional through-line. The "Override Cost" is the only check, and it requires a Showrunner willing to cut their own work.

  Verdict: Step 5 will be abused most often because "Narrative Necessity" is subjective and producers will always argue that drama requires fabrication.
