answer: |-
  This is a sharp piece of ethical auditing, and you are right to be uneasy. The "Famine = Flood" analogy is not merely a decorative flourish; it is an argumentative engine. It does the heavy lifting for the organisers' three moves (charity, no blame, politics later) by naturalising the catastrophe. If you accept the metaphor, you implicitly accept the politics.

  Here is the audit you asked for, followed by a verdict on whether the appeal copy can survive contact with the actual mechanics of famine.

  ### 1. The Flood Analogy: An Audit

  **The Mapping**
  To see where the analogy breaks, we must map the components as the organisers intend them, and then as Sen's entitlement approach reveals them to be.

  *   **The Rainfall/Shock:** In the appeal, this is the drought or the blight (a natural deficit). In reality (especially Bengal), this is often a price shock or a wage collapse (a market deficit).
  *   **The Levees:** In the appeal, these are emergency aid and logistics. In reality, these are social safety nets, wage protections, and trade regulations.
  *   **The Floodplain:** The vulnerable population. In the appeal, they are passively exposed. In reality, they are specifically targeted by economic exclusion.
  *   **The Upstream Decision-Makers:** In the appeal, there are none (nature decides). In reality, these are colonial administrators, export merchants, or state planners who manage the levees.
  *   **The Water:** The famine itself. In the appeal, it is a singular event. In reality, it is a process of entitlement erosion.

  **The Biting Disanalogies**
  You asked for the disanalogies that actually bite against the three moves. These are the ones that matter:

  1.  **Beneficiaries:** A flood has no beneficiaries. The water does not fill someone's bank account. Famine almost always creates winners: hoarders who sell high, landlords who consolidate land, exporters who move grain to where purchasing power exists rather than where need exists. The flood analogy erases the profit motive.
  2.  **Symmetry of Exposure:** Floodwater rises; it threatens everyone in the valley, even if the rich recover faster. Famine is asymmetrical by design. It starves the labourer while the merchant eats. It selects victims based on economic status, not geography.
  3.  **Agency:** A flood has no agent. You cannot serve a writ on a storm. Famine has agents: those who deny boat access (Bengal), those who guard grain exports (Ireland), those who set procurement quotas (China).
  4.  **The Aftermath:** When floodwaters recede, the landscape is damaged but not fundamentally reordered in terms of ownership. After a famine, land consolidation often increases; the survivors are often poorer relative to the survivors of the elite class. The disaster *changes the structure*, it doesn't just damage it.

  **Do the Three Moves Survive?**
  *   **Charity not Justice:** **No.** If the levees were neglected by upstream decision-makers to prioritise export revenue, the victims are owed restitution, not charity. The flood frame hides the negligence.
  *   **Generosity not Blame:** **No.** You do not prosecute a flood, but you do prosecute gross negligence. If the "water" was let in by opening the sluice gates (policy decisions), blame is the appropriate response.
  *   **Politics Downstream:** **No.** If the politics caused the flood, politics cannot wait for the aftermath. The "emergency" is the continuation of the politics by other means.

  **Verdict on the Flood:** The disaster frame was carrying the political positions the whole time. Without the "act of God" imagery, the claim that "politics can wait" collapses. The flood analogy is not a tool; it is a shield for the upstream decision-makers.

  ### 2. The Arson Analogy: An Audit

  Your flatmate's suggestion ("a house fire set by someone inside") is analytically superior but rhetorically risky.

  **What It Buys You**
  *   **Agency:** It immediately establishes that a human hand was involved.
  *   **The Crime Scene:** It demands an investigation before the cleanup. You cannot simply hose down the ashes; you must ask why the alarms were disabled.
  *   **Obligation:** Victims of arson are owed justice and restitution, not merely the charity of neighbours.

  **What It Smuggles In (The Intent Problem)**
  Your worry is correct: "Arson" implies *mens rea* (guilty mind). It suggests a villain who *wanted* the house to burn. As you note, famine causation is often smeared across administrators, merchants, and market mechanisms who did not explicitly intend mass death, but were indifferent to it.
  *   **The Fix:** Shift the legal charge from Arson to **Criminal Negligence** or **Corporate Manslaughter**. This covers diffuse causation. The architect didn't light the match, but they specified flammable cladding to save money. The merchant didn't starve the labourer, but they exported the grain knowing the labourer had no money. The intent is not murder, but the prioritisation of profit over safety.

  **Does It Stretch?**
  Yes, if you frame it as "setting the conditions for the fire" rather than "lighting the match." In Bengal, the "denial policy" (destroying boats and rice to stop Japanese advance) was the accelerant. In Ireland, the continued export of livestock was the open door. In China, the procurement quotas were the faulty wiring. None of these required a desire to kill, only a willingness to accept death as a cost.

  **Verdict on the Arson:** It holds up better than the flood, provided you avoid the trap of looking for a single pyromaniac. It correctly identifies the event as a *failure of protection* rather than a *visitiation of nature*.

  ### 3. Historical Variance: Does the Case Matter?

  You asked if there is a case where the flood analogy is roughly right.

  *   **Bengal (1943):** The flood analogy is objectively false here. Sen proved food availability was not significantly lower than previous years. The "water" was purely economic. Using the flood image here is a lie.
  *   **Great Leap Forward (1958–62):** This was policy-driven starvation. The flood analogy is absurd. The "water" was requisitioned grain.
  *   **Ireland (1845–52):** This is the only candidate. The *blight* was biological (a natural shock, like rainfall). However, the *famine* (the starvation) was political. The grain and livestock left Ireland under guard throughout the worst years. The "flood" (blight) damaged the crop, but the "levees" (poor laws, export policy) ensured the people drowned. Even here, the flood analogy fails because it conflates the crop failure with the human death.

  **Conclusion:** There is no modern case where the flood analogy holds. Even in genuine natural disasters, the *death toll* is determined by political infrastructure (building codes, warning systems, welfare). A famine is never just the shock; it is the vulnerability.

  ### 4. The Verdict and A Proposal

  You asked for a commitment. Here it is: **The flood analogy must be cut.**

  It is not harmless. It actively misleads the donor into believing they are responding to a natural tragedy rather than a political failure. It sustains the "charity not justice" position by erasing the agents who could be held to account. If your module on global justice has taught you anything, it is that famine is a function of distribution, not just production. The flood image reinforces the production myth.

  The arson analogy is better, but it risks alienating donors who do not want to feel they are funding a political prosecution. However, if the appeal is for a *justice* module or a politically aware student group, the arson/negligence frame is the honest one.

  **Is there a better image?**
  If you need a visual metaphor that captures Sen's entitlement approach without the baggage of "nature" (flood) or "malice" (arson), consider **The Bridge Collapse.**

  *   **The Mapping:** A bridge falls down.
  *   **The Cause:** It wasn't an earthquake (flood). It wasn't a bomber (arson). It was that the maintenance budget was cut, the load limits were ignored, and the inspectors were under pressure to keep traffic flowing.
  *   **The Victims:** The people on the bridge were the ones who couldn't afford the toll road elsewhere.
  *   **The Response:** You don't just throw ropes to the survivors (charity). You investigate why the girders were substandard (politics/justice). You hold the engineers and the budget-holders accountable (blame).
  *   **Why it works:** It implies structure, engineering, and maintenance. It suggests that famine is a *systemic failure* of the social contract, not a weather event. It allows for diffuse responsibility (no single arsonist, but many negligent engineers). It makes clear that the "emergency" (rescue) is secondary to the "inquest" (why did it fall?).

  **Final Recommendation**
  If the organisers insist on the flood, they are choosing a narrative that protects the powerful at the expense of the truth. You are copyediting, not writing policy, but you have an ethical duty to flag that the central metaphor contradicts the empirical reality of the cases you are studying.

  Tell them this: **The disaster frame is carrying the political positions.** If they remove the flood image, the argument that "politics can wait" will not survive. If they want to ask for money to fix the problem, they must admit what broke it. If they are not prepared to admit that famines are man-made failures of entitlement, they should not be using a metaphor that says they are acts of God.

  Drop the flood. Use the bridge. Or, if they demand simplicity, tell them the honest answer is that the thing resists being pictured at all, and they should rely on the data: *Food was there. People starved. Why?* That question does more work than any metaphor.
