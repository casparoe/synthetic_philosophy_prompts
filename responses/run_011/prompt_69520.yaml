answer: |-
  This is a sophisticated methodological crisis, and your instinct to reverse-engineer the principle from the verdicts is the correct move. You have discovered that your original five clauses are necessary but not sufficient because they treat analogies as *logical propositions* rather than *speech acts* embedded in a normative context. Your verdicts show that an analogy's admissibility depends not just on its truth-conditions (does the mechanism hold?) but on its *pragmatic function* (does it clarify agency or obscure it?).

  Below is the reconstructed framework, the audit of your original clauses, the application to your new cases, and the specific answers to your questions on authority and legitimacy.

  ### I. The Repaired Principle: Operational Isomorphism

  To reproduce your nine verdicts, the admissibility of a historical analogy in policy argument must satisfy the **Principle of Operational Isomorphism**. An inference from Source (S) to Target (T) is admissible if and only if it satisfies three conditions:

  1.  **Causal Stability:** The generative mechanism in S is ontologically stable and demonstrably present in T (merging your clauses i and ii).
  2.  **Procedural Translation:** The analogy yields specific *procedures* for T, not merely *postures* or *predictions*. It must tell the policymaker *how* to act, not just *what* to fear.
  3.  **Non-Abdication:** The use of the analogy must increase the granularity of decision-making rather than serving as a heuristic shortcut to bypass moral or strategic deliberation.

  #### Why this fits your verdicts:
  *   **Verdicts 1 & 2 (Suez/Vietnam):** Fail **Causal Stability**. Suez was surface-level; Vietnam invoked a mechanism (external aggression) that did not match the target (insurgency).
  *   **Verdict 3 (Kuwait):** Passes **Causal Stability**. State-on-state invasion matches the mechanism of the 1930s.
  *   **Verdicts 4 & 5 (Balkans/Rwanda):** Both pass Causal Stability, but they diverge on **Non-Abdication**. In the Balkans, the "Vietnam Criteria" forced a plan (increased granularity). In Rwanda, the same criteria were used to license inaction (bypassed deliberation on moral/strategic duty). The *logic* was the same; the *pragmatic function* differed.
  *   **Verdict 6 (Thucydides):** Passes **Procedural Translation** as caution (changes evidence weighing) but fails as prediction (no specific procedure). This validates your suspicion that "legitimate" splits into two notions.
  *   **Verdict 7 (Iraq Occupations):** The Munich/Vietnam analogies failed **Procedural Translation** (they argued for/against war, not how to manage it). The Germany/Japan analogy succeeded because it offered a script for governance (procedures).
  *   **Verdict 8 (Flu/AI):** Flu passes **Causal Stability** (biology is time-invariant). AI fails it (human strategic rationality $\neq$ algorithmic interaction; the mechanism is speculative).
  *   **Verdict 9 (Proponent):** Addressed below.

  ---

  ### II. Audit of the Original Five Clauses

  Here is the fate of your original apparatus under the new principle.

  | Clause | Status | Diagnosis |
  | :--- | :--- | :--- |
  | **(i) Mechanism** | **Retained** | Motivated by Suez (Verdict 1). It is the baseline filter for surface vs. depth. |
  | **(ii) Enabling Conditions** | **Merged** | Motivated by Vietnam/Domino (Verdict 2). It is now part of **Causal Stability**. A mechanism cannot be "present" if its conditions are absent. |
  | **(iii) Symmetry** | **Idle** | Motivated by a desire for fairness, but it is procedural. If **Defeasibility (iv)** is satisfied, Symmetry is automatic. If an arguer states defeat conditions, they are implicitly weighing disanalogies. |
  | **(iv) Defeasibility** | **Retained** | Motivated by Thucydides (Verdict 6). It distinguishes dogma from hypothesis. It now feeds into **Procedural Translation** (if you can't state defeat conditions, you can't design a procedure). |
  | **(v) Proponent** | **Rejected** | Motivated by Iraq/Track Record (Verdict 9). As stated, it is epistemically circular (see Section IV). It conflates *authority* with *accuracy*. |

  ---

  ### III. Application to Three New Cases

  Here is how the **Principle of Operational Isomorphism** rules on your unlisted cases.

  **1. Analogies to Interwar Protectionism (Smoot-Hawley) in Current Trade Policy**
  *   **Verdict:** **Conditionally Admissible.**
  *   **Reasoning:**
      *   *Causal Stability:* High. The mechanism of retaliatory tariff spirals reducing global liquidity is structurally stable across centuries.
      *   *Procedural Translation:* Admissible only if the analogy is used to design *safeguards* (e.g., exemption clauses, dispute mechanisms), not merely to invoke fear of depression.
      *   *Non-Abdication:* Inadmissible if used to argue for autarky without analyzing modern supply-chain interdependence (which differs from 1930s trade).
  *   **Ruling:** Admissible as a warning against *escalation mechanisms*, inadmissible as a prediction of *outcome severity* without adjusting for modern financial buffers.

  **2. Analogies to Past Financial Crises (2008/1929) in Central-Bank Emergency Response**
  *   **Verdict:** **Admissible.**
  *   **Reasoning:**
      *   *Causal Stability:* Very High. Liquidity traps and bank run psychology are ontologically stable human-economic behaviors.
      *   *Procedural Translation:* High. These analogies directly generate procedures (quantitative easing, lender of last resort).
      *   *Non-Abdication:* High. They force specific interventions rather than licensing inaction.
  *   **Ruling:** This is the strongest class of policy analogy because the mechanism (market psychology/liquidity) is more stable than political or military mechanisms.

  **3. Analogies to Earlier Small-War Interventions (e.g., Somalia 1993) in Debates About Arming a State Under Invasion**
  *   **Verdict:** **Inadmissible as Prediction; Admissible as Logistics Check.**
  *   **Reasoning:**
      *   *Causal Stability:* Low. Arming a proxy is distinct from direct intervention (Somalia). The mechanism of "quagmire" does not transfer cleanly.
      *   *Procedural Translation:* Low for strategy, High for logistics. The analogy can inform *equipment compatibility* or *training timelines*, but not *strategic success*.
      *   *Non-Abdication:* Risky. Often used to argue "we can't help" without examining *how* help is given.
  *   **Ruling:** Admissible only for technical constraints (logistics), inadmissible for strategic outcomes (will they win?).

  ---

  ### IV. Specific Answers to Your Methodological Questions

  #### 1. Can Clause (v) (Proponent) be preserved in non-circular form?
  **No, not as "Track Record." Yes, as "Access."**

  Your suspicion of double-counting is correct. If an argument is sound, the speaker's history is irrelevant (appeal to authority fallacy). If the argument is unsound, the speaker's history cannot fix it.
  *   **The Circular Trap:** Judging an argument by the speaker's past *outcomes* conflates skill with luck (outcome bias). In IR, outcomes are often determined by exogenous factors.
  *   **The Non-Circular Repair:** You can preserve a version of (v) if you redefine it as **Epistemic Access**. A former official's argument carries more weight *only if* their past position grants them access to classified data, structural knowledge, or tacit institutional constraints that are not public.
      *   *Revision:* "The argument carries more weight if the proponent possesses privileged information regarding the *mechanism's* operation, not merely if they were 'right' previously."
      *   *Effect:* This turns (v) from a moral judgment on the person into an evidentiary judgment on the data.

  #### 2. Does Verdict 6 (Thucydides) survive the split between epistemic and deliberative legitimacy?
  **Yes, and acknowledging the split strengthens your dissertation.**

  You are identifying a distinction familiar in philosophy of science but rare in IR: **Constitutive vs. Regulative** use of theory.
  *   **Epistemic Legitimacy (Prediction):** Claims about what *will* happen. The Thucydides Trap fails here because it is not falsifiable enough (too many variables). Your verdict (inadmissible as prediction) is correct.
  *   **Deliberative Legitimacy (Caution):** Claims about how to *weigh* evidence. The Thucydides Trap succeeds here. It functions as a **Regulative Ideal**. It tells the policymaker: "Treat ambiguous signals as hostile until proven otherwise."
  *   **The Principle:** Your **Procedural Translation** clause captures this. If the analogy changes the *process* of decision-making (e.g., "increase surveillance," "hedge bets"), it is deliberatively legitimate even if epistemically weak.
  *   **Advice:** Do not treat this as a "dodge." Explicitly theorize this split. It resolves the tension between "the analogy is scientifically weak" and "the analogy is policy-useful."

  ### V. Final Recommendation for the Dissertation

  Your original framework failed because it was **internalist** (focused on the logic of the analogy) while your judgments are **externalist** (focused on the consequence of using the analogy).

  1.  **Adopt the Tripartite Test** (Causal Stability, Procedural Translation, Non-Abdication). It explains the Rwanda/Balkans divergence (the hardest case) which logic alone cannot touch.
  2.  **Drop the Proponent Clause** as a measure of truth. Reintroduce it only as a measure of *evidence quality* (access to data).
  3.  **Theorize the Split in Verdict 6.** Make the distinction between *predictive analogies* (which claim to know the future) and *heuristic analogies* (which claim to structure the present) a central contribution of your work.

  This approach allows you to keep your honest verdicts without abandoning rigor. You are not abandoning the framework; you are upgrading it from a logic of *inference* to a logic of *practice*.
