  | **1 vs 2** | Genuine | High | Commitment 1 asserts machinery has no politics of its own, while 2 asserts the technical form designed by capital carries the control relation inside it. | Amend 1 to state that machinery has no politics *in abstraction*, but under capital its technical design is inherently political. | You lose the accelerationist warrant that socialists can adopt capitalist technology unchanged; you must now argue for redesigning technology. |
  | **3 vs 5** | Genuine | Medium | Commitment 3 assumes the law of value functions robustly enough to drive crisis via profit rates, while 5 argues the law of value becomes inadequate as a measure of wealth. | Clarify that 3 explains crises within capitalism's history, while 5 explains the structural limit that makes capitalism historically transient. | You introduce a periodization problem regarding when the mechanism shifts from profit squeezes to value-form obsolescence. |
  | **5 vs 6** | Genuine | Medium | Commitment 5 suggests production founded on exchange value breaks down, while 6 proposes UBI which operates within the value form without abolishing it. | Amend 6 to frame UBI not as a stabilizer within the value form, but as a demand that accelerates the breakdown described in 5. | You risk alienating reformist allies who view UBI as a stabilizer rather than a revolutionary wedge against the value form. |
