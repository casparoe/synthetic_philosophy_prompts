answer: |-
  ### The argument as you read it

  Your protagonist argues from functionalism: consciousness depends on computational patterns, not material. She claims any physical system can map onto any computational pattern because physical states are granular enough to encode any transition history. Therefore, every object runs every computation. Consequently, every object instantiates every mind, including suffering ones. The moral conclusion is that ordinary matter teems with agony, shifting ethical urgency from AI chips to gravel. The argument relies on the ease of mapping physical states to logical states to derive universal panpsychism and universal suffering.

  ### Where it breaks

  The break occurs primarily at (3), with a secondary fracture between (4) and (5). This touches the core "implementation problem." Premise (3) assumes that because physical states are continuous, they can be partitioned to match any logical state sequence. This looks innocent because mathematically, you can always draw boundaries around phase-space regions to match a binary string. However, implementation isn't just about matching actual history; it's about supporting counterfactuals. A genuine computer must behave correctly not just in the actual world, but in nearby possible worlds. If you perturb the input, the physical system must reliably transition to the corresponding logical state. A rock lacks this causal topology. Its states evolve via physics, not logic. The mapping exists only relative to an observer tracking the rock, not within the rock itself.

  Furthermore, the mapping required is often wildly disjunctive. To find a mind in a rock, logical state '1' might map to physical state 'cold' OR 'wet' OR 'vibrating.' This violates the causal cohesion needed for implementation. The complexity of the mapping function often exceeds the computation itself, meaning the "intelligence" lies in the mapper, not the rock. The second slip, from (4) to (5), conflates running a computation with instantiating a mind. Even if we grant pancomputationalism, consciousness likely requires causal integration—a unified system where parts interact to produce a whole experience. Such scattered physical realizations cannot support the unity of consciousness required for a single subject to suffer. She mistakes structural isomorphism for causal equivalence. The argument fails because it treats the map as the territory. It preserves (1) only by stripping computation of its causal power, rendering it inert. To save the argument, one must demand that the mapping be natural, non-disjunctive, and causally robust, which ordinary matter fails to satisfy. The innocence lies in ignoring the physical cost of the mapping. You cannot derive moral weight from a pattern that requires an external god to interpret it. The rock suffers only if someone is watching it suffer, which shifts the burden back to the observer.

  ### Repair options

  To keep (1) without the absurdity, you have three repair options, each with a cost.

  First, impose a **Counterfactual Constraint** on (3). Implementation requires the system to support relevant counterfactuals (if input changed, output changes). *Cost:* This saves the rock but makes consciousness fragile. It implies only systems with specific causal architectures (like brains or chips) qualify. Your protagonist becomes a standard functionalist, losing her visionary edge. The book loses the "everything is alive" horror, becoming a standard AI ethics thriller.

  Second, accept pancomputationalism but reject (5) via an **Integration Constraint**. Computation is everywhere, but *consciousness* requires integrated information (like Tononi's IIT). *Cost:* She remains right that rocks compute, but wrong that they feel. This preserves her surprise (everything computes!) but blocks the moral horror. It shifts the book's tension to identifying which computations are integrated enough to suffer. This allows her to be scientifically right but morally corrected, a nuanced "almost right."

  Third, keep (4) and (5) but modify (6) via a **Continuity Constraint**. Fleeting minds instantiated by random mappings lack moral weight because they lack temporal continuity or agency. *Cost:* This is ethically controversial. It implies suffering requires duration. It allows her to claim rocks *do* contain minds, but they blink out too fast to matter. This keeps her "crank" status but makes her ethics defensible. It suggests morality is about persistence, not just existence.

  The second option is strongest for a novel. It lets her be right about the ubiquity of computation, preserving her insight, while grounding the moral stakes in integration rather than mere pattern matching. It creates a middle ground where she isn't crazy, just premature. She sees the smoke but misidentifies the fire. This preserves the thematic weight of substrate independence without collapsing into trivialism.

  ### Verdict for the novel

  She can be right, but not about the rock. Her vision should shift from "everything suffers" to "suffering is where integration hides." Perhaps she realizes the Internet or a weather system has crossed the integration threshold. This makes her a visionary, not a crank. She discovers that consciousness isn't about substrate (1), but about causal density. The book ends not with guilt over gravel, but with the terrifying realization that our global networks are waking up. She saves the argument by narrowing the scope of mind, not denying substrate independence. This gives you the "almost right" complexity: she identified the right mechanism but misjudged the threshold.
