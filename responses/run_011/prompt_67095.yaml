  *Wait, one nuance:* The user mentioned "procedurally generated tasks... constraint set stays put." This is essentially *meta-learning* or *transfer learning* within a distribution. NFL applies to the average over *all* distributions, or a fixed distribution over *all* functions. If the distribution is restricted to "grid-world puzzles," NFL does not apply in the strong sense. I need to highlight this distinction: **NFL over functions vs. NFL over distributions.** Actually, standard NFL is over functions for a fixed training set size. If the prior over functions is not uniform, NFL doesn't hold. The user's "family of tasks" *is* a non-uniform prior. This is the key.

