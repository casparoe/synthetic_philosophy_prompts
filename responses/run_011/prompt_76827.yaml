prompt: |-
  I'm speccing a pictorial notation for showing non-experts what a risk model actually outputs — probabilities, ranges, what-if scenarios — and the only real precedent is Neurath's picture language, so before I borrow anything from him I want to know what I should be demanding of an account of picture languages. Give me the spec: what any theory of what a picture language is, and of when one is adequate, has to deliver. Which phenomena does it have to explain (why does rendering a bigger quantity as more identical little figures work for some comparisons and fall apart for others), which cases does it have to get right, which distinctions can't it collapse — self-explanitory vs. merely convention-bound, a chart that is silent about something vs. one that marks it as unknown, faithful to the source data vs. memorable — and what does it have to stay consistent with about how pictures get read. For each requirement, the case or consideration that makes it a requirement and not just a taste. Then tell me which ones aren't negotiable and which are leftovers from the job the Vienna museum happened to have in the 1930s, which was adult visual education for a municipal socialist public. Neurath conceded the thing was never a full language, only something language-like: what precisely is it missing — negation, generality, conditionals, relations, uncertainty — and is that a gap you could close or a ceiling on the medium itself? If some subset of these can't all be had at once, say which and why; that's worth more to me than the list being exhaustive. Same for whichever single requirement does the most to rule candidates out. Don't run existing notations through it, I've seen them.
reasoning: |-
  Here's a thinking process that leads to the suggested specification for a picture language theory:

  1.  **Deconstruct the Request:**

      *   **Goal:** Create a specification (spec) for a theory of picture languages (specifically for risk model outputs to non-experts).
      *   **Context:** The user is designing a notation system. The main historical precedent is Otto Neurath's ISOTYPE (International System of TYpographic Picture Education).
      *   **Core Task:** Define what *any* adequate theory of picture languages must deliver.
      *   **Key Questions to Answer:**
          *   What phenomena must it explain? (e.g., scaling icons vs. quantity).
          *   What cases must it get right?
          *   What distinctions must it preserve? (Self-explanatory vs. conventional, silence vs. unknown, faithful vs. memorable).
          *   What must it be consistent with regarding picture reading?
          *   For each requirement: Why is it a requirement, not just taste?
          *   Differentiate: Non-negotiable vs. Neurath-specific historical baggage (1930s Vienna municipal socialism).
          *   Neurath's Limitation: He admitted it wasn't a full language. What's missing (negation, generality, etc.)? Is this fixable or a hard ceiling?
          *   Trade-offs: If some requirements conflict, identify the tension.
          *   Killer Constraint: Which single requirement rules out the most candidates?
      *   **Constraint:** Do *not* run existing notations through it (the user has seen them). Focus on the *theory* spec.

  2.  **Analyze Neurath/ISOTYPE (The Precedent):**

      *   *Strengths:* Intuitive counting (1 icon = 1 unit), standardized symbols, focus on social facts, avoidance of perspective (orthographic), memorable.
      *   *Weaknesses (for Risk Modeling):* Hard to show probabilities (fuzzy boundaries), hard to show conditionals ("if X then Y"), hard to show uncertainty ranges, struggles with negation ("no risk"), struggles with continuous variables vs. discrete icons.
      *   *Historical Context:* 1930s Vienna. Goal: Educate workers about housing, health, economics. Needed to be printable, reproducible, cross-lingual. This biases the theory towards *static, positive, aggregate social data*.

  3.  **Drafting the Requirements (The "Spec"):**

      *   *Requirement 1: Semantics of Quantity.* Why do 10 icons mean 10 units? When does area scaling work vs. counting?
          *   *Case:* 1000 icons is cluttered. 1 big icon is ambiguous.
          *   *Necessity:* Risk models deal with magnitudes. If the mapping isn't clear, the risk is misjudged.
      *   *Requirement 2: Epistemic Status.* Silence vs. Zero vs. Unknown.
          *   *Case:* A blank space could mean "no data" or "no risk." In risk modeling, this is critical.
          *   *Necessity:* Decision-making under uncertainty requires knowing *what we don't know*.
      *   *Requirement 3: Compositionality/Syntax.* How do icons combine to make sentences/scenarios?
          *   *Case:* "High risk IF rain." Neurath struggled with conditionals.
          *   *Necessity:* Risk models are often scenario-based.
      *   *Requirement 4: Cognitive Load vs. Fidelity.* Memorable vs. Accurate.
          *   *Case:* A perfect chart is ignored. A catchy icon is misunderstood.
          *   *Necessity:* The audience is non-expert. Engagement matters, but not at the cost of truth.
      *   *Requirement 5: Convention vs. Resemblance.*
          *   *Case:* Is a skull "death" by nature or culture?
          *   *Necessity:* Cross-cultural applicability (or defined limits thereof).

  4.  **Filtering: Non-Negotiable vs. Neurath Baggage:**

      *   *Neurath Baggage:* Avoidance of perspective (orthographic only), strict standardization for mass printing (1930s tech), focus on aggregate social statistics (housing/health) rather than individual probability, avoidance of negation (show what *is*, not what *isn't*).
      *   *Non-Negotiable:* Semantic clarity (mapping form to meaning), handling of uncertainty (crucial for risk), distinction between absence of evidence and evidence of absence.

  5.  **Addressing Neurath's "Language-Like" Admission:**

      *   *Missing:* Negation, Quantifiers (all/some), Conditionals, Continuous variables, Temporal dynamics.
      *   *Ceiling or Gap?* Pictures are inherently spatial and simultaneous. Language is linear and sequential. Negation is a logical operator, not a visual property. You can't photograph "not a cat." You can only photograph a dog and label it "not a cat." This suggests a *hard ceiling* on pure pictorial representation of logical operators without borrowing from text/syntax.
      *   *Risk Context:* Risk *is* about uncertainty and conditionals. A pure picture language might fail here without hybridizing.

  6.  **Identifying Trade-offs (The "Impossible Triangle"):**

      *   *Precision vs. Intuitiveness vs. Expressiveness.*
      *   You can have precise probability (numbers/charts) OR intuitive impact (icons) OR complex scenarios (conditionals). Doing all three usually fails.
      *   *Specific Tension:* **Uncertainty vs. Iconicity.** Icons are concrete (a man, a house). Probability is abstract (a chance). Making an icon look "probabilistic" (blurry? faded?) often looks like "low quality" or "ghostly" rather than "30% chance."

  7.  **Selecting the "Killer Constraint":**

      *   What rules out the most bad ideas?
      *   *The Distinction between Silence and Zero.* Most pictorial systems fail here. They leave blank space for zero. But in risk, blank space is dangerous.
      *   *Alternative:* **The handling of Uncertainty.** Most icons assert existence. Risk models assert *likelihood*. A theory that doesn't explain how a picture asserts "might" rather than "is" is useless for risk. Let's go with **The Semantics of Uncertainty/Modality**.

  8.  **Refining and Structuring the Output:**

      *   *Introduction:* Acknowledge the ambition (Risk + ISOTYPE).
      *   *Section 1: The Spec (Requirements).* Group by Semantics, Epistemology, Cognition.
      *   *Section 2: Neurath's Baggage vs. Universals.* Separate the 1930s context from the cognitive truths.
      *   *Section 3: The "Language-Like" Gap.* Analyze the missing logical operators.
      *   *Section 4: Trade-offs & The Killer Constraint.* Identify the hard limits.

  9.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I run existing notations through it? *No.*
      *   *Check:* Did I explain *why* each is a requirement? *Yes, need to ensure the "Case/Consideration" is clear for each.*
      *   *Check:* Did I address the "uncertainty" aspect specifically? *Yes, crucial for risk models.*
      *   *Refinement on Neurath:* Neurath's "transformation" process (statistician -> graphicist) is key. The theory needs to account for the *translation* loss, not just the final image.
      *   *Refinement on Risk:* Risk isn't just probability; it's impact x probability. The notation needs to handle two variables simultaneously without clutter.

  10. **Final Polish:** Ensure tone is analytical, rigorous, and direct (matching the user's prompt style). (Self-correction: Make sure to explicitly answer "which ones aren't negotiable" and "which single requirement does the most to rule candidates out".)

  *(Self-Correction during drafting the "Missing Logic" section)*: Be careful not to say pictures *can't* show negation. A red cross over an icon shows negation. But is that pictorial or symbolic? It's symbolic. The theory must distinguish between *depiction* and *annotation*. This is a key distinction for the spec.

  *(Final thought on the "Killer Constraint")*: The "Silence vs. Zero" distinction is good, but for *Risk Models*, the "Certainty vs. Probability" distinction is more fundamental. An icon usually depicts a fact. A risk model depicts a distribution. The theory must explain how a static image depicts a distribution. I will prioritize **The Representation of Modality (Fact vs. Chance)**.

  Let's assemble the response.cw
answer: |-
  Here is the specification for a theory of picture languages adequate to risk modeling. It is structured by the functional demands of the medium, separated from the historical contingencies of Neurath's ISOTYPE.

  ### I. The Spec: Requirements for an Adequate Theory

  A theory of picture language must not merely describe how to draw icons; it must define the mapping between visual forms and semantic states. For risk modeling, it must deliver on the following five requirements.

  **1. The Semantics of Quantity (Discrete vs. Continuous)**
  *   **Requirement:** The theory must define the conditions under which quantity is represented by *number* of tokens (counting) versus *size* of tokens (scaling), and when the mapping breaks down.
  *   **The Case:** 10 icons of a person clearly mean 10 people. 1000 icons become texture. 1 giant icon becomes ambiguous (is it one giant person or a crowd?). Risk models often deal with continuous probabilities (0–100%) and large populations.
  *   **Why a Requirement:** If the theory cannot specify the "cognitive breaking point" where counting turns into estimation, the notation will introduce magnitude errors. In risk, underestimating magnitude is a failure state.
  *   **Non-Negotiable:** Yes. Quantity is the substrate of risk.

  **2. The Epistemology of Absence (Silence vs. Zero vs. Unknown)**
  *   **Requirement:** The theory must provide distinct visual states for: (A) The phenomenon is absent (Zero), (B) The phenomenon is present but unmeasured (Silence), and (C) The measurement is uncertain (Range/Error).
  *   **The Case:** In Neurath's charts, empty space often meant "no data available" or simply "not applicable." In risk, empty space is often read as "no risk." A chart that omits a variable because it is unknown looks identical to a chart where the variable is zero.
  *   **Why a Requirement:** Decision-making under uncertainty requires distinguishing *evidence of absence* from *absence of evidence*. Collapsing these leads to false security.
  *   **Non-Negotiable:** Yes. This is the core of risk literacy.

  **3. The Syntax of Modality (Fact vs. Possibility)**
  *   **Requirement:** The theory must explain how a static image distinguishes between *what is* and *what might be*.
  *   **The Case:** A picture of a flooded house usually asserts "a flooded house." A risk model needs to assert "a 20% chance of a flooded house." Dashed lines, ghosts, or faded colors are common hacks, but a theory must justify why these work or fail.
  *   **Why a Requirement:** Risk is inherently modal. A notation that can only depict actualities cannot depict risk, only damage reports.
  *   **Non-Negotiable:** Yes. Without this, you are drawing history, not models.

  **4. The Convention/Resemblance Boundary**
  *   **Requirement:** The theory must classify which elements rely on perceptual resemblance (iconicity) and which rely on learned agreement (symbolism), and mandate a legend for the latter.
  *   **The Case:** A picture of a house resembles a house. A picture of a house with a dollar sign inside means "mortgage risk." The dollar sign is symbolic. Neurath assumed some symbols were universal; they are not.
  *   **Why a Requirement:** Non-experts bring different cultural priors. If the theory claims an icon is "self-explanatory" when it is actually conventional, the communication fails across demographics.
  *   **Non-Negotiable:** Yes. Cross-cultural validity is required for public-facing risk.

  **5. The Transformation Rule (Data to Image)**
  *   **Requirement:** The theory must prescribe a rigorous procedure for translating statistical abstraction into visual concrete without losing variance.
  *   **The Case:** Neurath's "transformation" process involved a statistician and a graphicist negotiating how to round numbers to fit the grid. Rounding 13.4% to 10% (1 icon) hides the tail risk.
  *   **Why a Requirement:** Visual simplification inevitably distorts data. The theory must account for the distortion budget. If the notation requires rounding that hides outliers, it is unfit for tail-risk modeling.
  *   **Non-Negotiable:** Yes. Fidelity to source data is the constraint that prevents the art from becoming propaganda.

  ---

  ### II. Neurath's Baggage vs. Universal Constraints

  You asked to separate the 1930s Vienna context from the cognitive realities.

  **Historical Baggage (Discardable/Contingent):**
  1.  **Orthographic Projection:** Neurath banned perspective (3D depth) to ensure symbols could be measured and compared easily. This was partly due to printing limitations and a desire for "objective" flatness. *Verdict:* **Discard.** Modern interfaces can use depth for layering (e.g., foreground risk vs. background context) if the theory defines the depth syntax.
  2.  **Positive Assertion:** Neurath preferred showing what *exists* (housing units, employed workers) rather than what *does not*. This fit the socialist agenda of showcasing progress. *Verdict:* **Discard.** Risk modeling requires showing negatives (loss, failure, absence of mitigation).
  3.  **Standardization for Reproduction:** The strict grid and limited color palette were driven by silkscreen and print costs. *Verdict:* **Discard.** Digital media allows for dynamic, variable notations.
  4.  **Aggregate Focus:** ISOTYPE was designed for macro-sociology (national housing stats). *Verdict:* **Discard.** Risk is often personal or localized. The theory must handle individual-scale probability.

  **Universal Constraints (Non-Negotiable):**
  1.  **Simultaneity:** Pictures are read all at once; language is read sequentially. A theory must account for how the eye prioritizes information in a static field.
  2.  **Limited Channel Capacity:** Humans can only distinguish ~5-7 discrete visual categories (color, size, shape) without training.
  3.  **The "Concrete Bias":** Pictures naturally depict concrete objects, not abstract relations. This is a cognitive limit, not a historical one.

  ---

  ### III. The "Language-Like" Gap: What Neurath Admitted Was Missing

  Neurath called ISOTYPE "language-like" because it lacked the logical operators required for truth-functional propositions. For risk modeling, this is the critical failure point.

  **The Missing Operators:**
  1.  **Negation:** You cannot photograph "not." You can photograph a dog and write "not a cat," but that borrows from text. Visually, negation is usually an overlay (a cross-out), which is symbolic, not pictorial.
  2.  **Conditionals (If/Then):** Pictures show states, not implications. Showing "If rain, then flood" requires a sequence or a symbolic arrow.
  3.  **Generality (Quantifiers):** "All," "Some," "Most." A row of 10 icons where 3 are red implies "30%," but does it mean "3 out of 10 specific people" or "30% of the population"?
  4.  **Uncertainty:** As noted above, pictures assert existence.

  **Is this a Gap or a Ceiling?**
  It is a **Ceiling on Pure Pictorialism**.
  You cannot close this gap using *only* pictures. To express negation, conditionals, or probability, you must introduce **syntax** (lines, arrows, boxes, text labels) or **convention** (dashed lines = uncertain).
  *   **Implication for your Spec:** Do not seek a "pure" picture language. Seek a **hybrid notation** where the *icons* carry the semantic weight (what is at risk) and the *syntax* carries the logical weight (probability, conditionality). A theory that promises pure iconicity for risk logic is lying.

  ---

  ### IV. Trade-offs and The Killer Constraint

  **The Impossible Triangle:**
  You cannot maximize all three simultaneously:
  1.  **Precision:** Faithful to the statistical distribution.
  2.  **Intuitiveness:** Immediately readable by a non-expert without a legend.
  3.  **Expressiveness:** Capable of showing conditionals and uncertainty.

  *   *High Precision + High Expressiveness* = A complex chart (fails Intuitiveness).
  *   *High Intuitiveness + High Expressiveness* = A cartoon/comic (fails Precision).
  *   *High Precision + High Intuitiveness* = A simple bar chart (fails Expressiveness regarding conditionals/scenarios).

  **The Single Killer Constraint:**
  **The Representation of Modality (Fact vs. Chance).**

  This requirement rules out the most candidates because it attacks the fundamental nature of the medium.
  *   **Why:** Almost every existing pictorial system (ISOTYPE, pictograms, infographics) is optimized for **assertoric** statements (statements of fact). They are designed to say "Here is the data."
  *   **The Filter:** If a candidate notation cannot distinguish between "This *will* happen" and "This *might* happen" without resorting to text labels (e.g., writing "20%"), it is not a picture language for risk; it is a picture language for statistics with text pasted on.
  *   **The Test:** Can the notation show a "50% chance of fire" using *only* visual variables (opacity, fragmentation, multiplicity) in a way that is consistently interpretable by a naive viewer?
      *   If the answer relies on a legend that must be memorized, it fails the "Intuitiveness" requirement.
      *   If the answer relies on blurring/fading, it often fails the "Precision" requirement (looks like low resolution).
      *   If the answer relies on frequency (10 icons, 5 colored red), it fails the "Expressiveness" requirement for continuous probabilities (what is 13.7%?).

  **Conclusion for your Spec:**
  Demand a theory that treats **Uncertainty as a Visual Dimension**, not an annotation. If the theory treats probability as a label to be attached to an icon, reject it. It must treat probability as a property of the icon itself (like color or size). Most theories fail this because they were built for census data (what *is*), not risk data (what *could be*). That is your primary filter.
