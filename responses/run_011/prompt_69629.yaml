answer: |-
  **Total Mark: 13 / 25**

  **Breakdown:**
  *   **Part (a):** 8 / 9
  *   **Part (b):** 2 / 11
  *   **Part (c):** 3 / 5

  ---

  ### Part-by-Part Assessment

  **Part (a)**
  *   **Correct Claims:**
      *   **Definition of CPA:** The definition provided ("single probability distribution P... conditioning on what that agent has come to know") is precise and correctly identifies the partition structure of knowledge. The distinction that disagreement reflects differences in information rather than weighting of evidence is accurate.
      *   **Aumann's Theorem:** The candidate correctly identifies that common knowledge of posteriors is required, not merely mutual knowledge. The reference to the "finest common coarsening" demonstrates technical understanding of the proof mechanism.
      *   **Milgrom & Stokey (M&S) Requirements:** The candidate correctly identifies that M&S requires common knowledge of rationality and publicity of the trade offer in addition to the common prior.
  *   **Incorrect/Imprecise Claims:**
      *   **Exchange Conditions:** The claim that "On an organised exchange all three are satisfied, since every order is visible to every participant" is theoretically and empirically imprecise. In standard sequential trade models (like those hinted at in the seminar description), orders are often anonymous or hidden (limit order books), and the *inference* from the trade is what matters, not the visibility of the order itself. However, this is a minor simplification in the context of a short answer.
  *   **Reasoning:** The candidate demonstrates a strong grasp of the formal epistemology underlying the theorems. The explanation of *why* the CPA matters (it isolates information as the only source of disagreement) is excellent.

  **Part (b)**
  *   **Correct Claims:**
      *   **The Tension:** The candidate correctly identifies the tension between high speculative volume and the no-trade theorem.
      *   **Grossman-Stiglitz (G-S) Logic:** The summary of the G-S paradox (if prices reveal information, incentive to acquire information vanishes) is accurate.
  *   **Incorrect Claims:**
      *   **Falsification of CPA:** The conclusion that speculative volume *falsifies* the Common Prior Assumption is contrary to the standard resolution taught in this field. The standard resolution preserves the CPA and modifies other assumptions (specifically by introducing noise/liquidity traders).
      *   **G-S Resolution:** The claim that G-S implies we must "give up the common prior" is incorrect within the standard literature. The G-S paradox is typically resolved by positing exogenous noise traders (liquidity traders), which allows informed traders to profit without prices becoming fully revealing, all while maintaining a common prior.
      *   **M&S Applicability:** The assertion that M&S assumptions are satisfied on an organised exchange ignores the role of liquidity trading, which violates the assumption that *all* trade is speculative/information-driven.
  *   **Reasoning:** The reasoning is internally consistent but relies on a false dichotomy: that trade implies either CPA holds (and no trade occurs) or CPA fails (and trade occurs). It ignores the third option: CPA holds, but agents have different *motivations* (liquidity vs. information).

  **Part (c)**
  *   **Correct Claims:**
      *   **Normative Status:** The argument that CPA is best understood as a normative constraint rather than a descriptive hypothesis is a defensible philosophical position.
      *   **Internal Consistency:** The candidate correctly notes that if CPA is normative, empirical volume does not "falsify" it but rather indicates agents fall short of the ideal.
  *   **Incorrect/Unsupported Claims:**
      *   **Dependency on (b):** The claim that "their disagreement is about probabilities and not about evidence" relies on the empirical premise established in (b) (that CPA is descriptively false). Since the premise in (b) is flawed (because liquidity trading explains volume *with* a CPA), the conclusion here rests on a factual error regarding market microstructure.
  *   **Reasoning:** The philosophical analysis is sophisticated, but it is applied to a factual landscape the candidate has mischaracterized in part (b).

  ---

  ### Invalid Inferences and Suppressed Assumptions

  **In Part (b):**
  *   **Inference:** "Speculative volume occurs; the no-trade theorem says volume cannot occur under CPA; therefore, the CPA does not hold."
  *   **Suppressed Assumption:** This inference silently depends on the assumption that **speculative volume is the only possible cause of trade.** It assumes there are no other variables (such as liquidity needs, hedging requirements, or heterogeneous risk preferences) that can generate trade even when priors are common.
  *   **Why it fails:** The seminar description explicitly mentioned "sequential-trade models in which a portion of the order flow comes from participants trading for liquidity reasons." The candidate ignored this variable. If liquidity traders exist, the no-trade theorem's antecedent (that all traders are purely speculative expected-utility maximizers with common knowledge of rationality) is not met, so the consequent (no trade) does not follow, even if the CPA holds.

  **In Part (b) regarding Grossman-Stiglitz:**
  *   **Inference:** "The market unravels... what has to be given up is the common prior."
  *   **Suppressed Assumption:** This assumes that **information acquisition costs cannot be reconciled with market efficiency under a common prior.**
  *   **Why it fails:** Standard models (e.g., Kyle) reconcile these by introducing noise traders. The candidate assumes the paradox forces a choice between "efficient prices" and "common priors," ignoring the standard solution of "noisy prices + common priors."

  ---

  ### Contradictions and Unsupported Derivations

  *   **Contradiction with Seminar Premises:** While not an internal contradiction within the script, the answer contradicts the premises provided in the exam header. The header states the seminar covered models with "liquidity reasons." Part (b) argues that volume *must* imply a failure of CPA, effectively denying the possibility of the liquidity models taught in the course.
  *   **Unsupported Derivation in (c):** The candidate concludes that agents' disagreement is "about probabilities and not about evidence." This is derived from the claim in (b) that CPA is descriptively false. However, if one accepts the standard liquidity explanation (which preserves CPA), the disagreement is not about probabilities (priors) but about *needs* (liquidity vs. information). Thus, the conclusion in (c) is derived from a premise in (b) that ignores the most standard counter-argument.

  ---

  ### Part (b): Demands vs. Supply

  **What Part (b) Demanded:**
  1.  **Assessment:** An evaluation of the argument that volume falsifies CPA.
  2.  **Mandatory Constraint:** The answer **must** provide at least **two distinct explanations** of speculative trade that are **fully consistent with a common prior**.
  3.  **Mandatory Constraint:** The answer **must** explain why the no-trade theorem does not rule out these specific explanations.

  **What the Answer Supplied:**
  1.  **Assessment:** The candidate assessed the argument by **agreeing with it**. They concluded that volume *does* falsify the CPA.
  2.  **Explanations Consistent with CPA:** **Zero.** The candidate provided no explanations of trade that are consistent with a common prior. Instead, they argued that trade under a common prior is impossible ("If the no-trade theorem were sound and the common prior held, this trade could not occur").
  3.  **Why No-Trade Doesn't Rule Them Out:** **Not addressed.** Since the candidate did not provide the explanations, they could not explain why the theorem permits them.

  **Comment:** This is a critical failure to follow instructions. The question was designed to test the candidate's knowledge of the standard resolutions to the no-trade theorem (e.g., liquidity trading, differences in risk aversion/utility functions). By arguing that the theorem stands and the CPA falls, the candidate demonstrated a lack of engagement with the core models (such as Kyle or Glosten-Milgrom) implied by the seminar description. The answer is philosophically coherent but substantively incorrect regarding the specific literature examined.
