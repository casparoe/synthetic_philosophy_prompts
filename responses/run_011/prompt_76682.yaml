answer: |-
  R1. **The Novice Constraint:** The account must explain how a hearer acquires justified belief (or knowledge) from a speaker when the hearer lacks the competence to evaluate the content of the claim and possesses no independent evidence of the speaker's reliability.
  *   **Motivating Case:** A three-year-old learns the word "dangerous" from a parent; a medical patient accepts a diagnosis they cannot understand from a specialist. In both cases, the hearer cannot verify the truth of the proposition nor assess the speaker's expertise using content-specific criteria.
  *   **Status:** **Live Dispute.** While everyone agrees novices *do* form beliefs, Reductionists argue some positive evidence (general reliability of adults/doctors) is required, while Anti-Reductionists argue justification is default unless defeaters are present.
  *   **Type:** Requirement (if the account is to cover language acquisition and expert reliance).

  R2. **The Reliability Constraint:** The account must ensure that justified testimonial belief is more likely to be true than false, distinguishing warranted trust from gullibility.
  *   **Motivating Case:** A person believes a conspiracy theory on an anonymous forum because "everyone trusts someone somehow." An adequate account must explain why this belief is unjustified compared to the patient trusting the doctor, despite both lacking independent verification of the specific claim.
  *   **Status:** **Consensus.** All sides agree testimony cannot justify if the source is known to be unreliable or if the belief formation process is truth-insensitive.
  *   **Type:** Requirement.

  R3. **The Transmission Constraint:** The account must explain how justification or knowledge survives transmission across a chain of speakers without degradation to zero, and specify whether intermediate links can amplify warrant.
  *   **Motivating Case:** Historical knowledge relies on chains of testimony spanning centuries. If each link required independent verification of the previous link's reliability, historical knowledge would vanish. Conversely, if a chain passes through a known liar, the warrant should break.
  *   **Status:** **Consensus.** There is general agreement that knowledge *can* transmit, though disputes exist on the mechanics (e.g., whether warrant degrades over distance).
  *   **Type:** Requirement.

  R4. **The Boundary Constraint:** The account must specify whether non-human sources (clocks, maps, AI outputs, instrument readings) fall under the same normative norms as human assertion, or if they constitute a distinct category of evidence.
  *   **Motivating Case:** You check a thermometer vs. you ask a stranger the temperature. If the thermometer is broken, you are mistaken; if the stranger lies, you are deceived. The account must say whether your justification is of the same kind in both cases.
  *   **Status:** **Live Dispute.** Reductionists often treat them identically (both are reliable indicators); Anti-Reductionists often treat them differently (only humans offer assurance).
  *   **Type:** Requirement (to handle modern information environments).

  R5. **The Prejudice Constraint:** The account must classify credibility judgments distorted by the speaker's social identity (race, gender, class) as epistemically irrational, not merely morally wrongful.
  *   **Motivating Case:** A hearer discounts a witness's testimony because of their accent. If this is only a moral failing, the hearer's belief might still be justified; if it is an epistemic failing, the belief is unjustified.
  *   **Status:** **Live Dispute.** Traditional epistemology often separates ethical virtue from epistemic justification; contemporary social epistemology argues they are intertwined.
  *   **Type:** Requirement (for adjudicating contested public claims involving identity).

  R6. **The Universality Constraint:** The account must not make the justification of a belief wholly relative to the epistemic norms of the hearer's local community.
  *   **Motivating Case:** Your friend's claim that trusting a vaccine forum is justified if that is your community's norm, versus trusting a textbook. An adequate account for public dispute must be able to say one is objectively better justified than the other, regardless of local approval.
  *   **Status:** **Local Preference / Live Dispute.** Contextualists and some Anti-Reductionists deny this is possible or desirable; Universalists and Reductionists demand it. This is the core of your disagreement with your friend.
  *   **Type:** Requirement (for your specific goal of adjudicating public disputes).

  R7. **The Intent Constraint:** The account must distinguish between being lied to and being given a sincere mistake, and specify whether this difference affects the hearer's justification.
  *   **Motivating Case:** A speaker tells you a falsehood. In Case A, they know it is false (lie). In Case B, they believe it is true (mistake). Does your justification differ? Some argue assurance is voided only by lies; others argue truth-connection is all that matters.
  *   **Status:** **Live Dispute.** Assurance views say intent matters; Evidence views say only reliability matters.
  *   **Type:** Desideratum (nice to have, but some accounts function without it).

  ### Conflict Analysis

  Your suspicion is correct: **R1, R2, and R5 form an inconsistent triad** in the context of contested public claims.

  1.  **R1 (Novice)** demands that justification be available without content-specific evidence (because the hearer *cannot* check).
  2.  **R2 (Reliability)** demands that justification track truth and avoid gullibility (which usually requires checking cues of reliability).
  3.  **R5 (Prejudice)** demands that the cues used to assess reliability cannot be social identity markers (because these are colonized by bias).

  **The Inconsistency:** If a hearer cannot check content (per R1), they must rely on surface cues to satisfy R2 (avoiding gullibility). However, in social contexts, the most available surface cues (accent, dress, institutional affiliation, confidence) are exactly the markers implicated in R5 (prejudice).
  *   If you ban identity-markers to satisfy R5, you leave the novice with no cues to satisfy R2, violating R1 (they can never be justified).
  *   If you allow identity-markers to satisfy R1 and R2, you risk violating R5 (justification becomes biased).
  *   If you demand content-checks to satisfy R2 and R5, you violate R1 (novices are excluded).

  An account cannot simultaneously maximize default trust for novices, guarantee reliability against gullibility, and purge social bias from credibility judgments without additional machinery (e.g., distinguishing *legitimate* authority markers from *illegitimate* identity markers, which itself risks circularity).

  ### Sorting Summary

  *   **Shared Ground:** R2 (Reliability), R3 (Transmission). Everyone wants truth and everyone agrees knowledge passes down chains.
  *   **Live Disputes:** R1 (Mechanism of novice justification), R4 (Human vs. Machine), R5 (Epistemic vs. Moral prejudice), R7 (Intent). These are the battlegrounds of current literature.
  *   **Local Preferences:** R6 (Universality). This is not a neutral requirement; it is your specific objection to your friend's view. Contextualists explicitly reject R6. Marking it as a universal requirement begs the question against your friend.

  Verdict: R1, because it forces a choice between skepticism and dogmatism.
