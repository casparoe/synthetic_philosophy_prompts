  Your hypothesis is sharply observed and largely correct: the Hart–Fuller debate persists not because of a lack of evidence, but because the two sides are engaged in fundamentally different philosophical projects with distinct criteria for success. Hart is engaged in **conceptual analysis** aimed at providing a descriptive, morally neutral tool to identify legal systems (even wicked ones) for the purpose of sociological or historical study. Fuller is engaged in a **normative-functional** project, arguing that "law" is a purposive enterprise; if a system fails the inner morality of law (your desiderata), it fails to function *as law* and cannot generate the specific type of moral obligation law claims to create.

  Your empirical correlation creates a Rorschach test because it measures an outcome (compliance/obligation) that both theories predict, but for different reasons. The positivist sees your data as confirming that "state capacity" (a factual attribute) correlates with compliance, which is consistent with law being a social fact. The natural lawyer sees the same data as confirming that "legality" (a moral threshold) is a necessary condition for obligation. The disagreement is **mixed**: it has a verbal component (how to define the word "law"), but this verbal dispute is load-bearing because it reflects a **substantive-normative** clash over whether morality is internal or external to the concept of law.

  Progress is unlikely to come from more correlational studies of the sort you described, because the data is consistent with both frameworks. Real progress would require shifting the terrain to **modal claims** (could a system satisfy Fuller's desiderata and still be utterly wicked? Hart says yes, Fuller says no) or **explanatory depth** (does the *reason* for compliance matter?). A better-designed study might not look at *whether* people obey, but *why* they obey—distinguishing between prudential fear of sanctions (consistent with Hart) and felt moral obligation (required for Fuller). However, since the core dispute is about the definition of a concept rather than a brute fact of the world, "progress" in the scientific sense may be the wrong metric; the debate serves a vital pedagogical and clarifying function precisely by keeping these two distinct perspectives in tension.

