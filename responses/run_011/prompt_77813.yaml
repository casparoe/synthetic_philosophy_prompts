answer: |-
  The ink was still wet on the tide tables when Elara noticed the gap. Forty minutes. At Blackwater Harbor, the high water arrived forty minutes later than the Vallance account predicted, every single day for a month. She dipped her pen, the nib scratching against the heavy stock, and looked out the window. The North Sea was a sheet of hammered lead under the November sky, pressing against the glass of the observatory.

  Inside, the air smelled of ozone, wet wool, and the sharp tang of brass polish. It was 1910, and the Northumberland Institute for Tidal Mechanics was warm only near the coal stove. Elara capped her inkwell. She was twenty-four, the director's assistant, and the keeper of the ledgers. She knew the Vallance account better than anyone except Silas Thorne himself. It was the theory that had put the institute on the map: the moon did not pull the water directly; it compressed an elastic substratum beneath the seabed, which then rebounded, pushing the water up. It explained the weird surges in the estuaries, the lag in the fjords, the quiet waters of the deep shelf. It had generated a decade of work. It was alive.

  But Blackwater was a stone in the shoe.

  The weekly seminar was convened in the library. Gaslights hissed overhead, casting long shadows against the rows of leather-bound volumes. Thorne sat at the head of the table, his hands folded over a stack of papers. He looked tired, the skin under his eyes bruised with exhaustion, but his posture was rigid. To his right sat Mr. Gable, the funding inspector from London, a man who wore his skepticism like a stiff collar. To the left was Julian, a postdoc whose brilliance was curdled by bitterness.

  "The anomaly is localized," Thorne said, his voice steady. He slid a chart across the mahogany. "Blackwater sits on a unique geological formation. We propose a variation in the substratum's density. A pocket of lower elasticity beneath the harbor floor."

  Gable leaned forward. "You are adjusting the theory to fit the data."

  "We are refining the application," Thorne corrected. "The core principle remains intact. The moon compresses the bed; the bed moves the water. We are simply accounting for local geology."

  "It's a patch," Julian said. He didn't look up from his notebook. "You've invented a geology we haven't measured to save a physics we haven't proved."

  "We have measured the resonance in the estuary," Thorne said, a flash of irritation breaking through. "The auxiliary hypothesis is testable."

  "Is it?" Julian tapped his pen. "You'll only test it at Blackwater. Where the error is. You won't drill at Newcastle or Aberdeen to see if that density pocket exists there, because you know it won't. You're building a wall around the failure."

  Gable cleared his throat. "Mr. Thorne, the mandate from the Royal Society is clear. A single failed prediction falsifies the model. If the tide does not arrive when the equation says it should, the equation is wrong. We cannot continue to fund a program based on exceptions."

  Thorne stood up. He walked to the blackboard, where the complex integrals of the Vallance account were written in chalk. "Science is not a courtroom, Mr. Gable. You do not deliver a verdict on the strength of a single witness. This program has been written off before. In '98, when the Scandinavian data didn't match. We adjusted the friction coefficients, and suddenly we could predict the Baltic surges. It told us where to look. It told us what to measure. That is the value of a theory." He turned, his eyes catching the gaslight. "It possesses a positive heuristic. It generates work. It keeps us moving forward. If you kill it now, you stop the questions."

  "You stop the errors, too," Gable muttered.

  "By ignoring them," Julian said.

  The door opened. A messenger boy, damp from the fog, handed a telegram to Thorne. The room went silent as Thorne tore it open. He read it twice. His shoulders dropped, just an inch.

  "Hale's group," Thorne said quietly. "Aberdeen."

  Elara knew the name. Hale was the rival. He didn't believe in the elastic substratum. He believed in a complex hydrodynamic resonance model, something fluid and shifting, no solid bed required.

  "They predicted a surge at the Firth of Forth," Thorne said. "A secondary peak during the neap tide. Something nobody was looking for."

  "Did it happen?" Gable asked.

  "Yes." Thorne placed the telegram on the table. "It arrived within three minutes of their calculation."

  Julian let out a short breath, almost a laugh. "So. They predict the novel. We explain the known. They find new islands; we map the weeds around the old ones."

  "They got lucky," Thorne said, but the conviction was leaking out of him.

  "Or," Julian said, looking directly at Elara, "the definition of 'novel' is being applied generously to them and harshly to us. If we had predicted the Forth surge, it would be called a derivation. Because they did, it's a discovery. There are no neutral rules here. Only winners and losers."

  Elara felt the weight of the ledger in her lap. She had the raw data from the Forth station. It had come in this morning, before the telegram. She had verified it herself. Hale was right. But she also knew the Blackwater data. Thorne's density pocket *did* reconcile the numbers. It worked mathematically. It saved the model. For now.

  "Mr. Thorne," Gable said, standing up. "I cannot recommend renewal. The anomaly stands. The rival prediction stands. The program is degenerating."

  Thorne looked at Elara. "Miss Vance? The Blackwater logs."

  Elara stood. The room felt too small, the air too thick. She held the ledger against her chest. If she handed it over, Thorne would publish the auxiliary hypothesis. He would save the institute. He would save his life's work. He would be right about the method, even if he was wrong about the seabed. He would keep employing the staff. He would keep the lights on.

  If she handed over the Forth data alongside it, the comparison would be inevitable. The Royal Society would see the contrast. The Vallance account would be abandoned. Thorne would be ruined. The staff would be scattered.

  "Miss Vance?" Thorne prompted.

  "I have the logs," Elara said. Her voice sounded thin in the large room.

  "Read the Blackwater correction," Thorne said. "Show them the fit."

  Elara opened the ledger. She looked at the numbers. They aligned perfectly with Thorne's density adjustment. It was beautiful work. It was coherent. It was a shelter from the storm.

  She looked at Julian. He was watching her, his expression unreadable. He knew what she held. He knew what the Forth data meant.

  "The Blackwater correction fits within margin," Elara said. She closed the ledger. She did not mention the Forth data. She did not mention that Hale's model fit Blackwater without needing a density pocket.

  Gable sighed, snapping his notebook shut. "A temporary reprieve, Mr. Thorne. But the wind is changing."

  "The wind always changes," Thorne said. He looked at Elara, and for a moment, she saw not the director, but an old man afraid of the dark. "Thank you, Miss Vance."

  The meeting broke up. Gable left without shaking hands. Julian lingered by the door, lighting a cigarette. "You know," he said to Elara, "one day the tide comes in, and it doesn't go out. Or it comes too high. And math won't matter."

  "Go home, Julian," she said.

  He left. Thorne remained at the table, staring at the telegram from Aberdeen. Elara walked to the window. The fog had rolled in off the sea, swallowing the harbor lights. She could hear the buoy bell ringing in the distance, a slow, mournful toll.

  She walked back to her desk. The ledger sat there. She opened the bottom drawer and took out a fresh envelope. She copied the Forth data onto a separate sheet, sealed it, and addressed it to the Royal Society. She placed it in her coat pocket.

  Then she took the institute's official report, the one validating Thorne's density pocket, and placed it on the outgoing tray.

  Elara turned off the gas lamp. The room plunged into grey twilight. She picked up her hat and gloves, her fingers trembling slightly as she buttoned them. She walked out into the corridor, the envelope burning against her ribs. The wind howled around the corners of the building, rattling the sashes. She stepped out onto the wet pavement, the fog clinging to her wool coat, and walked toward the post office, the sound of the tide rising to meet her, indifferent to who was right.
