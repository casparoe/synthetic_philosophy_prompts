prompt: |-
  I'm a PhD student in my second year and Monday I have to run a 90-minute methods seminar for second-year archaeology undergrads on how much you can actually infer about what people believed from the stuff they left behind. They've had no philosophy, they've just spent a term on excavation recording, and they all did an essay on Stonehenge last year, so they think they already know what the problem is. I've got a whiteboard and a tray of casts they can pass around.

  The case I want to carry the whole session is invented — I built it out of bits of three different sites and I want it to stay invented, so nobody walks in having read about it. A pit cut into the floor of a house, filled in one go and sealed under a fresh clay floor that was itself relaid within a season: about three hundred sherds, all from vessels of a single shape, nothing refitting into a usable pot, every break fresh and clean; the burnt bones of one juvenile goat; a handful of charred grain. No other house on the site has one. For contrast I'll set the village midden beside it — same period, mixed species, rolled worn edges, sherds from eleven different forms, some mended and reused.

  I don't want the explanation from you, I want the plan. What order do the pieces have to go in, and what makes each one depend on the one before it? What does that pit-case need to have in it to do the job, and what must it not have? My supervisor has told me the word "ritual" isn't allowed out of my mouth for the first forty minutes — work with that constraint rather than around it, because I think it's actually load-bearing and I can't say why. Then the misconceptions: I'm braced for "so it was religious then" and for "if we can't know, it's all just made-up stories," but tell me the ones I haven't thought of and the exact point in the sequence where each should get killed. And a closing question that separates the students who got it from the ones who've just learned to say "we can't know" — I'd like them to have to commit to something, not abstain. Finally, what should I openly refuse to cover; I'm guessing Bayesian machinery and the whole procesual/post-processual argument, but tell me what to cut and how to say I'm cutting it without sounding like I'm dodging.

  For reference my draft order is: open with what underdetermination means in general, then show the pit, then list the readings it could bear, then the midden, then land on "we can know a lot, just not what it meant." I suspect this is backwards and that going abstract first will lose them, but I can't articulate why.

  You've taught this to non-philosophers often enough to know where it fails every year, so write from that. Think hard about what genuinely depends on what before you commit — sketch two or three candidate sequences first, say which one you'd actually run and why. No headings, no bullet points, no bold, no tables: continuous prose, like an email back to me, as long as it needs to be.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** PhD student (2nd year), running a 90-minute methods seminar for 2nd-year archaeology undergrads.
      *   **Topic:** Inferring beliefs from material remains (archaeological theory/epistemology).
      *   **Audience:** No philosophy background, just finished a term on excavation recording, wrote an essay on Stonehenge (think they know the problem).
      *   **Constraints:**
          *   Whiteboard + tray of casts (handling session).
          *   Case study: Invented pit (single shape sherds, fresh breaks, juvenile goat, charred grain, sealed quickly, unique) vs. Village Midden (mixed, worn, mended).
          *   **CRITICAL CONSTRAINT:** The word "ritual" is banned for the first 40 minutes.
          *   **Goal:** A lesson plan/sequence (order of pieces, dependencies).
          *   **Misconceptions:** Address "so it was religious then" and "if we can't know, it's all just made-up stories," plus unexpected ones.
          *   **Closing:** A question that forces commitment, not abstention ("we can't know").
          *   **Exclusions:** What to openly refuse to cover (Bayesian, Processual/Post-processual wars) and how to frame it.
          *   **Critique of Draft:** User suspects "underdetermination -> pit -> readings -> midden -> conclusion" is backwards/abstract.
          *   **Format:** Continuous prose, like an email, no headings/bullets/bold/tables.
          *   **Tone:** Experienced mentor, practical, knowing where it fails every year.

  2.  **Deconstruct the Problem:**
      *   The core epistemological issue is the gap between material practice and mental state (belief).
      *   The "Ritual" ban is crucial because it's a stop-word. Students use it to stop thinking. Banning it forces them to describe *actions* and *patterns* first.
      *   The draft order (Abstract -> Concrete) is indeed risky for undergrads who think they know the answer. They need to feel the tension of the data before being given the philosophical label.
      *   The invented case needs to be specific enough to constrain interpretation but vague enough to allow multiple hypotheses.
      *   The midden is the control group. It establishes the "normal" baseline against which the pit is "special."
      *   The closing question needs to avoid relativism ("anything goes") and positivism ("only facts matter").

  3.  **Develop Candidate Sequences:**

      *   *Sequence A (User's Draft):* Theory (Underdetermination) -> Pit -> Interpretations -> Midden -> Conclusion.
          *   *Critique:* Starts dry. Students tune out. They apply the theory to the data rather than letting the data generate the theoretical problem. "Underdetermination" is a scary word too early.
      *   *Sequence B (Data First):* Pit (Hands-on) -> Description (No interpretation) -> Midden (Contrast) -> Generate Hypotheses -> Introduce Constraint (No "Ritual") -> Epistemological Limit -> Closing.
          *   *Critique:* Better. Gets them handling stuff immediately. Builds the "weirdness" of the pit before labeling it.
      *   *Sequence C (The Narrative Arc):* Midden (Normalcy) -> Pit (Anomaly) -> The Gap (Action vs. Belief) -> The Trap (Ritual/Religion) -> The Way Out (Commitment).
          *   *Critique:* Strongest. Establishes baseline first. The pit only makes sense against the midden. The "Ritual" ban works best when they are desperate to use it to explain the anomaly.

  4.  **Refining the Chosen Sequence (Sequence C variant):**
      *   Start with the Midden. It's boring, familiar, safe. It establishes "daily life" without saying "daily life."
      *   Move to the Pit. It's weird. Handle the casts. Describe the breaks.
      *   Force description over interpretation. This is where the "Ritual" ban bites. They want to say "ritual deposit." They must say "broken pots, young goat."
      *   Generate explanations. Not just "religion." Maybe "cleaning," "panic," "pollution," "feast."
      *   Introduce the philosophical problem *after* they feel the frustration of not knowing. *Then* talk about underdetermination (without calling it that).
      *   Close with a forced choice.

  5.  **Addressing Specific Requirements:**
      *   *What the pit needs:* Specificity (single shape, fresh breaks) to rule out accidental breakage or normal discard. It must look *intentional* but not *obvious*.
      *   *What the pit must not have:* No human remains (too distracting), no gold/treasure (implies wealth hoard), no written records (obvious), no clear altar structure (too architectural).
      *   *Misconceptions:*
          1.  "It's ritual" (Stop word).
          2.  "We can't know" (Relativism cop-out).
          3.  "Uniformitarianism" (People were just like us, so it's obviously X).
          4.  "Function = Meaning" (If it's broken, it's useless, so it's symbolic).
      *   *Closing Question:* Needs to be about probability or action, not truth. "If you had to bet your thesis on one explanation, which one dies hardest?"
      *   *Exclusions:* Processual/Post-processual history (too meta), Bayesian stats (too technical). Frame as "tools for later" or "different class."

  6.  **Drafting the Content (incorporating constraints):**
      *   *Tone:* Email from a senior colleague/mentor. Warm, direct, experienced.
      *   *Format:* Continuous prose. No formatting markers.
      *   *Length:* Sufficient to cover all points in detail.

      *   *Key Insight on the "Ritual" Ban:* It forces them to describe *practice*. Belief is inferred from practice. If they skip to "ritual," they skip the practice.
      *   *Key Insight on the Draft:* You are right, it is backwards. Don't give them the hammer (theory) before showing them the nail (the weird pit).
      *   *Key Insight on the Closing:* Don't ask "What do you think?" Ask "What would you publish?" or "What explanation requires the fewest assumptions about their minds?"

  7.  **Writing - Section by Section (mental outline for flow):**
      *   Opening: Validate their instinct about the draft order.
      *   Sequence Proposal: Midden first (baseline), then Pit (anomaly), then the struggle (interpretation), then the theory (why it's hard).
      *   The Pit Design: Specifics on what makes it work (fresh breaks, single type) and what to avoid (human bone, valuables).
      *   The "Ritual" Ban: Why it works (forces description of action).
      *   Misconceptions: The "Just Stories" trap, the "Universal Human" trap. When to kill them.
      *   The Closing: The bet/question.
      *   The Cuts: How to dismiss Processual/Post-processual and Bayes without sounding evasive.
      *   Closing encouragement.

      *   *Self-Correction during drafting:* Ensure I don't use bullet points. Ensure I don't use bold text. Keep it flowing like a letter. Make sure I explicitly address the "why" of the sequence dependencies.

      *   *Refining the "Ritual" Ban logic:* It's not just about the word; it's about the category. If they say "ritual," they think they've explained it. They haven't. They've labeled the anomaly. The ban forces them to reconstruct the *event*.

      *   *Refining the Closing:* The user wants them to commit. "Which explanation would you defend if I told you the goat was actually a dog?" No, better: "Which explanation makes the most predictions about what we find in the *next* pit?" Or "If you had to write the site report tomorrow, what headline do you put on this feature?" Let's go with the "Site Report" angle. It forces professional commitment.

      *   *Refining the Exclusions:* Processual/Post-processual is history of the discipline, not method for *this* problem. Bayes is too granular. Frame them as "different tools for different jobs."

      *   *Check Constraints:* 90 minutes. 40 mins no "ritual". 2nd years. Stonehenge essay background (they think symbolism is obvious).

      *   *Final Polish:* Ensure the transition between midden and pit is clear. The midden establishes the "noise" so the pit stands out as "signal."

      *(Self-Correction on Format)*: The prompt says "No headings, no bullet points, no bold, no tables: continuous prose, like an email back to me". I must strictly adhere to this.

      *(Self-Correction on Content)*: I need to make sure I explain *why* the sequence matters. Why Midden before Pit? Because "special" requires "normal." Why Theory after Data? Because theory solves a problem they need to feel first.

      *(Misconceptions)*: Need to add the "Functionalist" trap (it must have had a practical use) and the "Psychological Unity" trap (they thought like us).

      *(Closing)*: Needs to separate those who get it from those who say "we can't know." The question must make "we can't know" an insufficient answer. "What is the minimum belief required to make this action rational?"

      *(Exclusions)*: Be direct. "We aren't doing history of theory today."

      Let's write.

      *Wait, one more check:* "Sketch two or three candidate sequences first, say which one'd you actually run and why." I need to include this in the prose without using lists. I can describe them in paragraphs.

      *Okay, plan:*
      1. Greeting & validation of their instinct.
      2. Describe Sequence 1 (Their draft) & why it fails.
      3. Describe Sequence 2 (Pit first) & why it's okay but risky.
      4. Describe Sequence 3 (Midden -> Pit -> Theory) & why it's the winner.
      5. Detail the Pit design (inclusions/exclusions).
      6. The "Ritual" ban strategy.
      7. Misconceptions & timing.
      8. The Closing Question.
      9. The Exclusions (how to frame them).
      10. Sign off.

      *Wait, check constraints again:* "No headings, no bullet points, no bold, no tables". I must write this as a block of text or paragraphs, but absolutely no formatting markers.

      *Let's ensure the flow is natural.*

      *Start:* Dear [Name], You are right to be worried about the draft order.
