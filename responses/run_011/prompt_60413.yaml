answer: |-
  Dear colleague, you are absolutely right to feel that your draft order is backwards, and that instinct is the most important thing you have going into this seminar. If you start with underdetermination, you are handing them a solution to a problem they do not yet feel they have. Second-year students who have just finished a term on recording and written about Stonehenge believe they already understand the link between stuff and meaning because they have read others making that link confidently. If you give them the philosophical framework first, they will treat it as a box to tick rather than a tool to use, and when you finally show them the pit, they will simply sort the data into the categories you just gave them. You need them to feel the friction of the data before you give them the vocabulary to describe the friction. I have taught this specific seminar enough times to know that the epistemology only lands when it emerges from the frustration of trying to explain something concrete. So let me sketch out how I would structure this, why I would reject your draft, and how to handle the constraints you have been given.

  There are three ways you could sequence this, and only one of them survives contact with the classroom. The first is your draft: define underdetermination, show the pit, list readings, show the midden, conclude. This fails because it begins with abstraction. You will lose them in the first ten minutes while they wonder why they are hearing about philosophy when they want to talk about pots. The second option is to start with the pit immediately. You put the casts in their hands, let them describe the breaks, and ask what happened. This is better, but it risks letting them jump straight to the forbidden word. Without a baseline, the pit is just a collection of objects, and the easiest way to make sense of a weird collection of objects is to call it ritual. You need to establish what normal looks like before you can define what abnormal looks like. So the third option, and the one I recommend you run, is to start with the midden. Spend the first twenty minutes on the boring stuff. Pass around the worn sherds, the mixed bones, the mended handles. Ask them to describe the behavior that created this deposit. They will say things like eating, throwing away, daily life. You do not correct them yet, but you establish a baseline of accumulation, decay, and mixed use. This creates the control group. Only then do you bring out the pit. The contrast does the heavy lifting for you. The pit is not just a set of objects; it is a deviation from the midden. By establishing the midden first, you make the pit an event rather than a place. The dependency here is crucial: the pit only has meaning because the midden exists. If you show the pit first, it is just a pit. If you show the midden first, the pit is a violation of expectation.

  Once you have that sequence locked in, you need to be very precise about what is in that invented pit and what is conspicuously absent. You have already listed the positives: single vessel shape, fresh breaks, single juvenile species, sealed quickly. These are good because they imply simultaneity and selection. But to make the seminar work, the pit must not contain anything that triggers a specific functional explanation too easily. Do not include any tools, because then they will argue it was a tool cache. Do not include human bone, because then it becomes a mortuary discussion and you lose the room to the ethics of burial. Do not include any valuables like metal or stone axes, because then it becomes a hoard and the economic explanation overwhelms the cognitive one. You want the materials to be mundane enough that their arrangement is the only thing that is strange. The sherds must be from utility vessels, not fine ware, so that breaking them represents a loss, not a display of wealth. The goat must be juvenile so it suggests selection, but not so young that it implies stillbirth or natural death. The charred grain is excellent because it suggests fire was involved, but keep the amount small so it does not look like a storehouse burning. The goal is to make the action deliberate but the motive opaque. If the materials are too special, the motive writes itself. If they are too ordinary, the action looks like trash disposal. You want them in the uncanny valley of deposition.

  Now let us talk about the forty-minute ban on the word ritual. Your supervisor is correct that this is load-bearing, but not because the word is inaccurate. It is because the word is a stop-sign. When a student says ritual, they feel they have explained the behavior, when in fact they have only labeled the anomaly. By banning the word, you force them to describe the sequence of actions required to create the deposit. They cannot say it was a ritual offering; they must say someone broke thirty pots, killed a young goat, burned some grain, put it in a hole, and covered it within a week. This shifts the focus from the mental state to the physical practice, which is the only thing we can actually access. You enforce this by writing the word on the board with a line through it at the start of the session. When someone slips and says it, do not scold them. Just point to the board and ask them to describe the action instead. This works best in the middle of the session, around minute thirty, when they are frustrated that they cannot solve the puzzle. That frustration is where the learning happens. They need to feel the gap between the action and the meaning. If you let them say ritual too early, they bridge that gap with a word instead of an argument.

  Regarding the misconceptions, you have identified the two big ones: the leap to religion and the slide into relativism. But there are two others you need to be ready to kill at specific moments. The first is uniformitarianism, the idea that people thought exactly like us so we can intuit their motives. This usually comes up when you ask why they broke the pots. A student will say because they were angry, or because they were celebrating, projecting modern emotional logic onto the data. You need to kill this immediately after they generate their first list of hypotheses, around minute forty-five. Tell them that anger does not leave a signature in sherds. The second hidden misconception is functionalism, the idea that everything must have had a practical use. Someone will argue that the pots were broken to save space or the goat died of disease. This is a useful counter-argument, but if left unchecked it denies the possibility of non-utilitarian action. Kill this one when you compare the pit to the midden. The midden shows how they handled waste and disease normally. The pit is different. If it were practical, it would look like the midden. The point at which you kill these misconceptions matters. If you kill them too early, they stop participating. If you kill them too late, they have already built their arguments on sand. Let them propose the ideas, write them on the board, and then use the data to dismantle them.

  This brings us to your closing question, which needs to separate the students who understand the method from those who are just hiding behind uncertainty. You do not want them to say we cannot know. You want them to commit to a probability based on the available evidence. Do not ask them what they think happened. Ask them what they would publish. Tell them they are writing the site report due tomorrow. They have to write one sentence in the summary about that pit. They cannot write we do not know. They cannot write it was ritual. What is the minimum claim they can make that is supported by the data? This forces them to distinguish between what is possible and what is probable. The students who have got it will say something like the deposit represents a structured departure from normal waste disposal practices involving selected materials. The students who have not got it will either insist on a specific belief system or refuse to commit. The key is to make them realize that archaeology is not about knowing the truth, it is about defending the most robust inference. You want them to leave understanding that inference is a discipline, not a guess.

  Finally, you asked what you should openly refuse to cover. You are correct about Bayesian machinery and the processual versus post-processual debates. Including either of these would blow the ninety-minute timeframe and distract from the core epistemological problem. But you cannot just say we do not have time. You must frame it as a choice of scope. Tell them at the outset that this seminar is about inference from material patterns, not about the history of archaeological theory or statistical modeling. Say that processual and post-processual arguments are about why we dig, but today is about how we think about what we find. Say that Bayesian statistics are for quantifying probability once you have defined your hypotheses, but today is about generating the hypotheses in the first place. By framing them as tools for different stages of the research process, you validate their importance without letting them derail the session. If a student brings them up, acknowledge the value and park it for a third-year theory module. This protects your seminar from becoming a history lesson while showing you respect the broader discipline.

  So to summarize the flow I would run: start with the midden to build the baseline of normalcy. Move to the pit to introduce the anomaly. Enforce the description of action by banning the word ritual. Let them generate hypotheses and then dismantle the weak ones using the data they just handled. Introduce the concept of underdetermination only after they have felt the limits of their own explanations. Close by forcing them to write the site report summary. This order ensures that every step depends on the previous one. They cannot see the pit as special without the midden. They cannot describe the action without the ban. They cannot understand the limits of inference without trying to infer first. Your draft started with the limit; this plan starts with the attempt. That is the difference between a lecture they listen to and a problem they solve. You have the materials and the case study to make this work. Trust the data to generate the theory, and trust the students to feel the gap. Good luck on Monday.
