  I want to test my own updating intuitions against each other and find out what principle, if any, they add up to. Here are the cases, with my verdicts.

  **(A)** At dusk I glance into a yard and get a vague reddish impression. Before, P(the bird is red) = 0.2 and P(it's a cardinal) = 0.1; after, P(red) = 0.6, and my credences in cardinal given red, and cardinal given not-red, are untouched — rigidity delivers roughly 0.4 for cardinal, which is where I in fact land. Verdict: correct, and I want an account on which this is the *warranted* response, not merely a description of what I did. **(B)** I then learn the yard is lit by a red-tinted lamp. My P(cardinal | it looked red) collapses, though the look itself is unchanged, so rigidity is flatly violated. Verdict: still rational — hence rigidity cannot be the whole story. **(C)** I return the next evening and get what I take to be the very same vague reddish impression. Verdict: nothing should move; a second identical look adds no evidence. **(D)** Two friends, independently, each text me that they think they saw something reddish in that yard, and each report moves me exactly as much as my own single look did. Verdict: two such reports should push me further than one. C and D are the pair I cannot reconcile — my own repeat look looks evidentially just like my own second report. **(E)** If I describe the look coarsely, as "reddish," and shift P(red) 0.2 → 0.6, I end up at one credence in cardinal; if I describe it finely — scarlet / brick / dusky rose — and distribute the shift across the cells, I end up somewhere else. Verdict: that is a defect; how I carve the observation should not change what it warrants, though I concede I have no non-arbitrary way of carving it. **(F)** I know I am about to walk into that yard and that whatever I see I will finish at P(cardinal) = 0.4. Verdict: I should go to 0.4 now; having the experience should not be evidentially necessary. **(G)** I know I have had two glasses of wine and that the me who walks into that yard will finish at P(cardinal) = 0.7 on the same look. Verdict: sober me should not go to 0.7 now, and should plan to distrust later me. F and G have the same structure and opposite verdicts, and I cannot say what distinguishes them except that in one I am a good updater and in the other I am not — which is circular from where I sit. **(H)** The case I keep reversing on: I seem to remember a black crest, and I know my memory for that detail is unreliable in a way my color vision was not. Should the seeming-memory get the same treatment as the seeming-perception, and if so with what magnitude?

  Please give me the principle or the small set of candidate principles that best captures this pattern. State each rule precisely enough that I could compute with it — where the account needs extra machinery beyond shifting partition probabilities (likelihood ratios attached to the experience, a prior over my own response functions, an index for the token rather than the type of experience), name the machinery and say what it costs. I want the rules in your own terms, not a survey of who proposed what. Then tell me: which of A–G each candidate reproduces and which it forces me to abandon; whether any candidate saves all of them, and if not, which single verdict you would drop and why; how each candidate resolves H; and what each predicts for at least three cases I have not listed, including one involving an experience whose evidential import I misjudge at the time and recognize later.

  After the prose, give me a JSON object with exactly this schema:

  - `candidates`: array of objects, each with `name` (short label), `rule` (the updating rule stated formally or quasi-formally), `extra_machinery` (what it adds beyond shifting partition probabilities, or `"none"`), `cost` (the price of that machinery), `verdicts_reproduced` (array of case letters), `verdicts_overturned` (array of case letters).
  - `irreconcilable_pairs`: array of objects with `cases` (array of letters), `why` (the structural reason they conflict), `which_yields` (which verdict a unified account must give up, or `"neither"` if your account dissolves the conflict).
  - `flip_flop_resolution`: object with `case` (letter), `resolution` (the verdict you recommend), `depends_on` (which clause of which candidate delivers it).
  - `novel_predictions`: array of objects with `case` (your description), `predicted_verdict`, `reason`.
  - `recommended`: object with `candidate` (name), `one_line_rationale`.
