answer: |-
  (a) **1955 vs. 1967: The Status of the Regularity**

  In 1955, left-hand traffic (LHT) in Sweden is a textbook Lewisian convention.
  *   **Regularity/Recurrence:** Universal compliance in a recurrent situation.
  *   **Conditional Preference:** I prefer to drive left *if* you drive left.
  *   **Alternative:** Right-hand traffic (RHT) was a live alternative regularity (as evidenced by neighbors and the referendum).
  *   **Near-Indifference:** This holds. While there were minor frictions (imported cars), the *coordination* value of LHT swamped the independent disvalue. Given that everyone else drives left, I am indifferent between "We all drive left" and "We all drive right" *qua* coordination equilibria. The safety benefit of coordination is the primary payoff; the side of the road is arbitrary relative to that payoff.

  In 1967, RHT becomes the regularity, but the *indifference clause* is under severe stress.
  By the time of the switch, the "independent reasons" to prefer RHT (compatibility with continental neighbors, availability of left-hand-drive vehicles, reduction of specific head-on collision vectors on narrow roads) had accumulated. If agents prefer R' over R *even before* coordination is achieved (because R' is intrinsically safer or cheaper), the problem shifts from a pure coordination game to a coordination game with a *payoff asymmetry*.
  Lewis requires that agents be indifferent between the equilibria *given conformity*. If the Swedes in 1967 believed RHT was objectively safer *regardless* of what others did (e.g., better visibility in LHD cars), then RHT is not merely a convention; it is a Pareto-superior equilibrium. Lewis's machinery gums up here because his definition is designed to explain the *arbitrariness* of social rules. Dagen H suggests conventions often persist (LHT) despite being Pareto-inferior, and shift (to RHT) when the independent payoff matrix changes, not just when expectations flip. The 1967 regularity is a convention *in structure* (I only drive right if you do), but not *in genesis* (we are switching because right is 'better', not just 'different').

  (b) **The Referendum: Conditional Preferences and Expectations**

  The 83% vote for LHT does not indicate a preference for LHT *simpliciter*; it indicates a preference for the *status quo equilibrium* given the high transition costs.
  Lewis's conditional preference clause predicts exactly this. In 1955, the expectation was $E$: "Everyone will drive left." My preference function is $P(Left | E) > P(Right | E)$. The referendum question ("Should we keep driving on the left?") was effectively asking, "Do you want to bear the transition costs to move to a new equilibrium?" Since the benefit of the new equilibrium (slightly better car imports, alignment with neighbors) was diffuse and long-term, while the cost of transition (confusion, new signs, new habits) was immediate and certain, the rational vote was to stay at the current equilibrium.

  The Riksdag's override was not undemocratic in Lewisian terms; it was a manipulation of the *expectation variable*. Lewis's account relies on mutual expectations to sustain the regularity. By legislating the switch four years out, the state altered the common expectation from $E_{left}$ to $E_{right}$. Once the expectation shifted, the conditional preference flipped: $P(Right | E_{right}) > P(Left | E_{right})$.
  The compliance in 1967 without underlying preference change confirms Lewis's core insight: convention is sustained by expectations, not moral commitment. The referendum measured attachment to the *focal point*, not the *rule*. The Riksdag didn't change what people wanted (safety/coordination); they changed the coordinate system required to get it. Lewis's account makes the override look like the only way to solve a "bad equilibrium" trap where individual voting cannot coordinate the jump.

  (c) **The 4:50 Stop and the Manufacture of Common Knowledge**

  **Suspending Play:** The 1am–6am traffic ban is a fascinating deviation from Lewis's recurrence condition. Lewis assumes the game is played repeatedly, allowing precedent to build. Here, the state deleted the game for one night to prevent a "mixed strategy" disaster (some driving left, some right). By forcing a complete stop, the state ensured that when play resumed at 5:00, the only available move was RHT. This isn't coordination; it's a hard reset. It suggests that for high-stakes conventions, spontaneous coordination is too risky; the equilibrium must be imposed during the transition phase to guarantee the post-transition convention holds.

  **Manufacturing Common Knowledge:** Lewis emphasizes that common knowledge usually arises from precedent or salience natural to the agents. The four-year campaign (milk cartons, songs, logos) was an industrial-scale production of common knowledge. It ensured that "Everyone knows that everyone knows" the switch date.
  This vindicates Lewis's *insight* (common knowledge is the necessary glue) while refuting his *genealogy* (conventions arise spontaneously). Dagen H shows that in complex modern societies, common knowledge is too expensive to generate organically. The state acts as a "common knowledge machine." This creates a tension: if a convention requires a state apparatus to manufacture the mutual expectations required to sustain it, is it still a convention in Lewis's sense, or is it a law that *mimics* a convention? Lewis wants to separate convention from authority; Dagen H shows authority is often required to *create* the convention.

  (d) **Where the Theory is Silent**

  1.  **Statute and Sanction:** Lewis insists convention is distinct from law; convention is sustained by conditional preferences, law by sanctions. Dagen H blurs this. Driving on the right was illegal before it was conventional, and illegal to violate after. The conditional preference was backed by the threat of fines. Lewis has no good way to model the hybrid where law *creates* the expectation that sustains the convention. He treats law as a solution to Prisoner's Dilemmas, not Coordination Problems. Dagen H suggests law is often used to solve Coordination Problems when natural salience fails.
  2.  **Transition Costs:** Lewis's game matrix is abstract; it doesn't account for the cost of moving from $R$ to $R'$. The burden fell unevenly: bus companies had to rebuild fleets; tram systems (Stockholm, Malmö) were scrapped because converting them was too costly. Lewis's framework treats all agents as identical players in the coordination game. It cannot explain why some sub-populations (tram operators) exited the game entirely rather than switching equilibria.
  3.  **External Salience:** Lewis's salience is usually internal (precedent within the group). Here, the salience of RHT came from *outside* (neighbors, global car market). Lewis's theory is largely closed-system; it struggles to model how external equilibria exert pressure on internal conventions.
  4.  **Individuation (The Railway Problem):** Why did the railways and metro stay Left? If the convention is "Swedish Traffic," the railways should switch. If the convention is "Swedish Road Traffic," they shouldn't. Lewis defines a population $P$ and a situation $S$, but offers no metric for drawing the boundary. Dagen H reveals that conventions are porous; the "traffic" convention fragmented into "road" and "rail" sub-conventions based on technical conversion costs. Lewis's theory lacks the granularity to explain why the convention held for cars but not trains.

  (e) **Verdict and the Samoa Case**

  **Verdict:** Dagen H **strains** Lewis's theory to the breaking point, specifically on the "near-indifference" and "spontaneous order" clauses.
  It confirms the *structure* of the problem (coordination equilibrium sustained by expectations) but refutes the *mechanism* (spontaneous salience) and the *motivation* (indifference between equilibria).
  To absorb Dagen H, Lewis would need a **second-order coordination account**: a theory of *convention revision*. This would treat the switch not as a single game, but as a coordination problem *about* which equilibrium to play, complicated by transition costs and asymmetric payoffs. It would require acknowledging that states can act as focal points to solve coordination problems that are stuck in Pareto-inferior equilibria.

  **Samoa (2009):**
  Samoa switched from RHT to LHT to allow import of cheaper used cars from Australia and NZ (RHT to LHT switch).
  This is a **worse** test for Lewis than Dagen H regarding the indifference clause. In Samoa, the economic imperative was overwhelming; the "indifference" between equilibria was non-existent. It was a pure cost-benefit analysis disguised as a traffic rule.
  However, it is a **better** test for the "state as focal point" extension. Like Sweden, Samoa used a public holiday and a total traffic ban to enforce the switch.
  If Dagen H strains the "indifference" clause, Samoa breaks it. Samoa suggests that what we call "conventions" are often just equilibria selected by economic pressure, where the "conventional" aspect is merely the synchronization required to realize the economic gain. Lewis's definition would likely classify Samoa as a non-conventional coordination driven by independent payoff changes, which implies his definition is too narrow to capture most real-world rule changes. Dagen H is the superior case study because the safety/economic arguments were ambiguous enough to *look* like a convention shift, whereas Samoa was nakedly economic.
