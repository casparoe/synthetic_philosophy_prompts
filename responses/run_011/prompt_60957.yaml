answer: |-
  First, your grasp of the honor/dignity/victimhood framework is solid enough for this work. Honor says "defend your reputation." Dignity says "your worth is intrinsic; insults bounce off." Victimhood says "my worth is intrinsic, but this harm damages my standing, so I need authority to validate that damage." You are trying to run a Dignity-based institution while managing a student body that oscillates between Honor and Victimhood, all while your own moral intuition is pulling you toward a fourth option: **Protection.**

  You asked me to brainstorm principles before picking one. Here are three candidates based on your cases, tracking different variables.

  **Candidate 1: The "Jurisdictional Competence" Principle.**
  *   **Tracks:** Whether the school *can* effectively fix the problem.
  *   **Logic:** We punish physical violence (Case 1) because we can adjudicate it. We ignore off-campus Instagram posts (Case 7a) because we lack jurisdiction. We ignore words (Case 1) because policing speech is impossible.
  *   **Failure:** It doesn't explain Case 5 (excusing the punch) or Case 7b (intervening in the IEP off-campus post). It also doesn't account for your guilt in Case 3. You *could* have acted, but you didn't. Competence doesn't drive that feeling; care does.

  **Candidate 2: The "Agency-First" Principle.**
  *   **Tracks:** The victim's request and capacity.
  *   **Logic:** If the victim says "I'm fine" (Case 3), we respect their agency. If the victim doesn't report (Case 4), we respect their resilience. We only intervene when the victim asks or is incapacitated.
  *   **Failure:** It collapses on Case 7b (the IEP student). You intervened *without* a request because you deemed them vulnerable. It also conflicts with Case 4, where you felt the student *should* have reported. You don't actually believe in pure agency; you believe in *protected* agency.

  **Candidate 3: The "Asymmetry and Immutability" Principle.**
  *   **Tracks:** Power differentials and the nature of the target (behavior vs. identity).
  *   **Logic:** Intervention is required when there is a power imbalance (Teacher/Student, Neurotypical/IEP) or when the attack targets an immutable characteristic (race, disability, dead parents). Conflict between peers over mutable behavior (names, shoving matches) is left to dignity/agency unless it becomes physical.
  *   **Failure:** It struggles with Case 8 (due process risks) and Case 5 (sanctioning violence).

  ### The Selected Principle: **Protective Paternalism with Dignity Goals**

  I am choosing a refined version of Candidate 3. Let's call it **Protective Paternalism with Dignity Goals.**

  **The Core Idea:** The school's moral duty is not to police all conflict, but to prevent **predation**. Predation is defined by **asymmetry** (power or vulnerability) and **immutability** (attacking who someone *is* rather than what they *did*).
  *   **Dignity is the Goal:** We want students to develop the thick skin of Case 4.
  *   **Protection is the Floor:** We intervene when the harm exceeds a child's reasonable capacity to absorb it (Case 7b, Case 6).
  *   **Violence is the Hard Line:** Physical safety is the non-negotiable baseline, regardless of provocation (Case 1).

  Here is how this principle scores your eight cases, and where it forces you to change.

  1.  **Shove/Name:** **Saved.** Physical harm breaches the floor. Verbal insults are peer conflict. You punished the breach of safety, not the breach of feelings.
  2.  **Private Shove:** **Saved.** Policy must remain blind to audience, even if Honor culture intuition says public shaming is worse. Your gut acknowledges the Honor dynamic, but your principle correctly prioritizes the physical act.
  3.  **Social Media (Victim says "I'm fine"):** **Saved.** No asymmetry, no immutable attack. Respecting her agency promotes Dignity. Your guilt is the "care ethic" clashing with the "dignity goal," but you made the right call. Intervening would have infantilized her.
  4.  **Unreported Slur:** **Partial Fail.** Here is the tension. The slur targets immutability (identity). Under Protective Paternalism, the *institution* has a duty to stop a hostile environment, even if the victim doesn't report. However, your annoyance at the *student* is wrong. He practiced Dignity. You wanted Victimhood (reporting) so you could do your job. **Verdict:** You were right to respect his silence then, but wrong to feel he failed you. The failure was the environment, not the kid.
  5.  **Dead Mom Punch:** **Failed.** This is the one you must give up. Under "Asymmetry," the insult was predatory (immutable trait). But under "Protective Paternalism," you cannot sanction physical violence. If you excuse the punch, you tell every kid they are the judge of what constitutes a "worthy" punch.
      *   *Correction:* The insulter should have been suspended. The puncher should have received a consequence (detention/loss of privilege), but with a private explanation: *"What he said was vile, and I'm punishing him. But you cannot hit. If you hit, you become the danger I have to stop."*
  6.  **Teacher/Student Sarcasm:** **Saved.** Pure power asymmetry. The teacher holds institutional power; the student does not. The reverse is noise.
  7.  **Off-Campus (Neurotypical vs. IEP):** **Saved.** The IEP status creates a vulnerability asymmetry that extends the school's protective reach off-campus. The neurotypical student had the capacity to absorb the slight; the IEP student did not.
  8.  **Slur (He-Said/She-Said):** **Saved, with risk.** Slurs target immutability. Believing the accuser aligns with protecting the vulnerable. However, this relies on your intuition of credibility. The principle holds, but the *process* is dangerous. You must document why you found her credible beyond "gut."

  ### The Conflict: Case 3 vs. Case 4

  You asked which of these is wrong, as they look alike but you judged them oppositely.

  In **Case 3**, you felt you abandoned the victim (Guilt).
  In **Case 4**, you felt the victim failed the community (Annoyance).

  **Case 4 is where your judgment is wrong.**
  In Case 3, the victim exercised agency ("I muted it"). You respected it.
  In Case 4, the victim exercised agency ("I ignore it"). You respected the action but judged the character.

  Why the difference? In Case 3, the harm was acute and social. In Case 4, the harm was chronic and identity-based. You feel that identity-based harm *requires* institutional intervention (Victimhood culture) to be validated. But that kid was living Dignity culture. He refused to let his worth be damaged. By feeling annoyed, you are demanding he adopt Victimhood so you can fulfill your Protective duty.

  **The Fix:** Respect the kid in Case 4. He is the model. The problem wasn't his silence; it was that you didn't know. If you *had* known, you would have intervened regardless of his report (because slurs create a hostile environment). But his silence was a virtue, not a failure.

  ### The Hard Case I'm Inventing For You

  **The Scenario:** A group of three popular seniors systematically "forget" to invite a lonely junior to their study group every week, then post photos of the group on Instagram with captions like "Squad Goals." The junior's grades drop. She comes to you. There is no slur, no direct insult, no threat. Just exclusion.

  **Your Instinct:** "This isn't bullying, this is high school. I can't mandate friendship." (You let it go).

  **My Principle's Score:** **Intervene.**
  **Why:** This is **Asymmetry** (Social Capital) + **Harm** (Academic/Emotional). It functions as predation without using slurs. It creates a hostile environment for a specific target.
  **The Hard Part:** You have no policy lever. You can't punish them for having friends. But you can call the parents of the seniors and frame it as "social harassment impacting academic performance." It will feel like overreach on a Tuesday morning. But under *Protective Paternalism*, exclusion used as a weapon is violence.

  ### The Daughter at the Bus Stop

  You feel like a fraud because of Case 4. You told your daughter to "ignore it" (Dignity), but Case 4 made you feel that *not reporting* is a failure.

  **You are not a fraud. Your brother is taking a bigger risk.**

  Here is the distinction: **Annoyance vs. Persecution.**
  *   **Annoyance:** Name-calling, teasing, social jockeying. The goal is to get a rise out of the target.
      *   *Response:* Dignity. Ignore it. If you react, you feed the Honor/Victimhood cycle.
  *   **Persecution:** Slurs, threats, targeted campaigns, attacks on immutable traits (race, disability, family death).
      *   *Response:* Protection. Report it.

  In Case 4, the student endured *slurs* for *years*. That is persecution. My principle says the *school* should have stopped it, but the *student* was not wrong to endure it if that was his choice. However, for your daughter:

  **Tell her this tonight:**
  *"I told you to ignore it because I want you to know that their words don't define you. That is the strong way to live. But I was wrong to leave it at just that. If they are calling you names about **who you are**—your body, your family, your background—you don't have to carry that alone. Ignoring it works for annoyances. Reporting it works for attacks. If it happens again, tell me. Not because you can't handle it, but because I won't let them make the bus stop unsafe."*

  This bridges the gap. It honors her Dignity (you are strong) while asserting your Protective Paternalism (I will handle the predators). It resolves the Case 4 tension: The student in Case 4 was strong, but the school should have been there anyway. With your daughter, ensure she knows the school (you) is there, so she doesn't *have* to be the hero.
