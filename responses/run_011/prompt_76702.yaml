answer: |-
  The legal architecture you describe presupposes a **hybrid theory of agency** that bifurcates the soldier's moral and legal personality. It treats the soldier as a **public instrument** regarding the justice of the war (*jus ad bellum*), but as an **autonomous moral agent** regarding the conduct of war (*jus in bello*).

  This architecture does not strictly commit the law to the Moral Equality of Combatants (MEC)—the view that soldiers on both sides have an equal moral right to kill. Rather, it commits the law to a **statist theory of permission** grounded in public authority, coupled with a **pragmatic epistemic constraint** on individual judgment.

  Here is the breakdown of what the practice requires, where rival theories converge, and what the treatment of mercenaries reveals.

  ### 1. Immunity and the Moral Equality of Combatants
  **Does the law require MEC?**
  No. The practice of granting combatant immunity regardless of which side initiated the conflict *sits well* with MEC, but it does not *strictly require* it. It is equally consistent with the "Revisionist" view (associated with philosophers like Jeff McMahan) that only combatants fighting a just cause have a moral right to kill, provided the immunity is understood as a pragmatic concession rather than a moral endorsement.

  **Where rival theories license the practice equally:**
  Both MEC and Revisionism can justify the current legal regime of immunity.
  *   **MEC** justifies it normatively: The soldier's right to kill is derived from their status as a combatant, independent of their state's cause.
  *   **Revisionism** justifies it procedurally: Unjust combatants *are* morally liable to be killed and arguably liable to prosecute, but the law grants immunity because requiring individual soldiers to adjudicate the justice of their state's cause is epistemically impossible and would lead to greater humanitarian suffering (by discouraging surrender or compliance with *jus in bello*).

  **What would change if we replaced the view?**
  If the law were revised to reflect the Revisionist view strictly (that immunity tracks moral justification):
  *   **Administrability Collapse:** Tribunals would need to adjudicate the *jus ad bellum* status of every individual defendant. Since *jus ad bellum* is often contested until years after a conflict, this would render prisoner-of-war status indeterminate during the conflict.
  *   **Incentive Structure:** Unjust combatants would have no incentive to follow the rules of war (*jus in bello*), as they would face prosecution for killing regardless of their conduct. The current architecture trades moral purity for the administrative benefit of separating *ad bellum* (leaders) from *in bello* (fighters) to ensure compliance with humanitarian norms.

  ### 2. State Agency vs. Individual Judgment
  **The Tension:**
  You note a tension between combatant immunity (which suggests the soldier is an instrument of the state, not responsible for the war itself) and the denial of the superior-orders defense for manifestly unlawful acts (which suggests the soldier is a moral agent responsible for their actions).

  **The Presupposed Picture:**
  The law resolves this by distinguishing between **political agency** and **humanitarian agency**.
  *   **Political Agency (State):** The decision to go to war is attributed solely to the state leadership. The soldier is legally "blind" to the justice of the war. This is why a conscript cannot commit the crime of aggression. The law presupposes the state is the collective agent here; the soldier's deed is the state's deed.
  *   **Humanitarian Agency (Individual):** The decision to commit atrocities (torture, killing civilians) is *not* attributed to the state in a way that absolves the individual. The law presupposes that certain norms are so fundamental (*malum in se*) that no political authority can validate them.

  **What the practice strictly requires:**
  The practice requires that the soldier possess the cognitive capacity to distinguish between *policy* (which they must obey) and *humanity* (which they must uphold). It does not require that the soldier be a free moral agent in all respects, only in respects concerning fundamental human rights.

  **What merely sits well:**
  It sits well with a Kantian view that one cannot surrender one's moral autonomy. However, it also sits well with a utilitarian view that holding individuals liable for atrocities is the only way to deter them, regardless of their metaphysical autonomy.

  ### 3. The Mercenary Clue
  The treatment of mercenaries is the critical data point for determining which theory of agency is actually on offer. Mercenaries are denied combatant status and immunity even if they wear uniforms, carry arms openly, and follow the rules of war.

  **What this indicates:**
  This undermines the pure **Moral Equality of Combatants** theory. If the right to kill were derived solely from conduct (following the rules) and the inherent symmetry of the battlefield, the mercenary's motive (pay) or lack of state affiliation should not matter.

  It also complicates the pure **State Agency** theory. If the soldier is merely a tool, a mercenary is just as much a tool as a conscript.

  **The Actual Presupposition:**
  The exclusion of mercenaries reveals that the license to kill in war is not a natural right of combatants, nor is it merely a function of being a state tool. It is a **privilege of public authority**. The law presupposes that the "right" to kill in war is a franchise granted by the international system to **states** (or recognized belligerents), which they delegate to their armed forces.
  *   **Conscripts** kill as agents of a public cause (the State).
  *   **Mercenaries** kill as private actors.

  Therefore, the immunity is not a pragmatic concession to moral ignorance (as the Revisionist might hope); it is a **constitutive rule of the international order**. Only those integrated into the public hierarchy of a state can access the "combatant's privilege." This suggests the law is closer to a **Statist/Collective Agency** view than a Revisionist moral view. The state absorbs the guilt of the war, but only for those who are truly *of* the state.

  ### 4. Revisionist Replacement and Administrability
  If we replaced the presupposed Statist/Collective view with a strict **Individual Moral Agency** view (where immunity tracks personal moral liability):

  1.  **Status Determination:** We would need a mechanism to determine the "justness" of a cause before granting POW status. This is unadministrable in real-time.
  2.  **Mercenaries:** Under a strict Individual Moral Agency view, a mercenary who fights for a just cause (e.g., defending a victim of aggression) *should* receive immunity, while a conscript fighting for an aggressor state should not. The current law does the opposite (Conscript Aggressor = Immune; Mercenary Defender = Prosecutable).
  3.  **Superior Orders:** If we embraced full Individual Moral Agency, we might expand the superior-orders defense. If the soldier is fully liable for their moral choices, the law might logically demand they be liable for *all* choices, including *ad bellum*. But since we cannot enforce that, the current system is a "second-best" solution that prioritizes the regulation of violence over the punishment of injustice at the tactical level.

  ### Conclusion on Agency
  The architecture presupposes that **permission to kill is institutional, not natural.** It is granted by the international legal order to states, which delegate it to soldiers. The soldier is immune for acts of war because those acts belong to the institution. However, the soldier is liable for war crimes because those acts exceed the institution's legal capacity (states cannot authorize war crimes) and revert to individual criminality.

  The refusal of the superior-orders defense does not contradict the State Agency view; it defines its limits. The state is an agent capable of waging war, but not an agent capable of authorizing atrocity. When a soldier commits atrocity, they step outside the "state agent" role and revert to "private criminal."

  ### Confidence and Uncertainty
  **Confidence Level:** I am **highly confident** (85-90%) that the legal architecture presupposes a Statist/Institutional theory of permission rather than a Moral Equality or Revisionist moral theory. The treatment of mercenaries is the smoking gun that ties immunity to public status rather than conduct or moral cause.

  **Point of Least Certainty:** I am **least sure** (60% confidence) about the extent to which the denial of the superior-orders defense is theoretically consistent with the immunity from aggression charges. While I argue above that it distinguishes between political and humanitarian agency, there is a genuine philosophical friction here: if the soldier is sufficiently autonomous to judge the manifest illegality of an order to torture, why are they deemed insufficiently autonomous to judge the manifest illegality of an order to invade a sovereign state? The law asserts this distinction, but the philosophical grounding for why *humanitarian* judgment is within a rifleman's capacity while *political* judgment is not remains the most vulnerable point in the doctrine's theoretical armor.
