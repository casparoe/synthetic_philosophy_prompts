      *   *Crime of Aggression:* Only leaders (political/military) can commit this. Regular soldiers are immune from this charge regardless of how many they kill.
      *   *Superior Orders:* Not a defense for *manifestly unlawful* orders (war crimes). Soldiers must judge specific acts.
      *   *Mercenaries:* Denied combatant status/POW privilege. Fighting for pay/private cause removes immunity.

  3.  **Evaluate Competing Theories of Agency/Permission:**

      *   *Theory A: Moral Equality of Combatants (MEC) / Traditional Just War Theory (Vallier/Walzer-ish).* Soldiers on both sides have an equal right to kill. The state monopolizes violence; soldiers are instruments. Justice of the cause (*jus ad bellum*) is separate from conduct in war (*jus in bello*).
      *   *Theory B: Revisionist Just War Theory (McMahan-ish).* Only those fighting a just cause have a right to kill. Unjust combatants are essentially murderers, but immunity is a pragmatic epistemic/humanitarian concession.
      *   *Theory C: State Agency/Collective Responsibility.* The state is the moral agent. The soldier is a tool. Acts are attributed to the state, not the individual (hence immunity). But the individual retains moral agency for *malum in se* crimes (hence no superior orders defense for atrocities).

