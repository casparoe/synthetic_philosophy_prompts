      *   *The "Superior Orders" Paradox:* If the state is the agent, the soldier shouldn't be liable. If the soldier is the agent, they should be liable for aggression. The law splits the difference: You are the state's agent for *policy* (aggression), but a human being for *humanity* (war crimes).

  6.  **Structuring the Response:**

