          *   *Tension:* If soldiers are mere tools (State Agency), why punish them for war crimes? If they are moral agents, why not punish for aggression?
          *   *Resolution:* The law distinguishes between *political* judgment (reserved for leaders) and *humanitarian* judgment (required of all).
      *   **Mercenaries (The Clue):**
          *   *Practice:* Mercenaries get no immunity.
          *   *Implication:* This undermines pure MEC (which focuses on conduct, not motive) and pure State Agency (which focuses on affiliation). It suggests a link between *public authority* and the license to kill. It supports a "Public War" theory.
      *   **Administrability:**
