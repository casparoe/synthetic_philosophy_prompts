prompt: |-
  so this is a slightly strange request and I want you to take it seriously rather than give me a book-report. Background: I've spent the last couple of months deep in the choice-under-moral-uncertainty stuff — expected choice theory, the two-step "just act on your favourite theory if you're confident enough" view, hedging, the Borda-y approaches, the whole argument about whether "what should I do" even has a single answer when you're unsure which moral theory is right. Reason I'm in it: I'm deciding whether to take a job at a company that pays really well and that I think has maybe a 40% chance of being net harmful. Going in circles. Then, procrastinating, I reread Crime and Punishment for the first time since college and it kind of floored me, because Raskolnikov is arguably the most important literary case of someone acting under moral uncertainty and almost nobody reads him that way — they read him as a narcissist, or as Dostoevsky's punching bag for nihilism and arithmetic.

  Act as someone who genuinely works on decision theory under moral uncertainty *and* actually reads novels — not a lit-crit person gesturing at "ambiguity," not a decision theorist using the novel as an illustration. Brainstorm out loud first: list the readings you considered (straightforward EV maximizer, self-deceiver, akratic agent, someone whose credences are incoherent, etc.), say which you're discarding and why, and then commit to one and develop it.

  What I want the reading to do:

  1. Figure out what kind of uncertainty he's actually in. The literature assumes you're unsure *which normative theory is true*. But Raskolnikov seems pretty confident about his theory — ordinary people versus extraordinary people who may step over obstacles for a great purpose — and unsure about whether the theory applies to *him*. Is that a different thing, a species of moral uncertainty the framework doesn't handle, and does it get worse because the test for being extraordinary seems to be constituted by doing the act? Can you defer to the evidence when the evidence doesn't exist until you've acted?

  2. Irreversibility. All these models take a credence distribution as given at a moment and ask what to choose. The novel is obsessed with the fact that he destroys his own ability to find out. Is there a "keep your options open / buy information" requirement that the static frameworks underweight, and does the novel give me an argument for it rather than just a sad story?

  3. Motivated credences. He wants the licence, so his probabilities aren't innocent inputs. Does the framework have any grip on criticizing someone's credence distribution, or does it just swallow whatever you hand it? Where does the internalist pushback — the claim that an uncertain agent can't be told what to do by theories they don't endorse — leave him?

  4. The other characters as rival theories: Sonya, Luzhin (whose little self-interest speech Raskolnikov immediately says licenses killing people), Svidrigailov, Porfiry. Does the novel stage an intertheoretic comparison, and does it think all these views can be put on one scale at all? Is the epilogue a verdict or a cop-out?

  Be faithful both ways: where the reading works, where it strains, and where the honest answer is that Dostoevsky would reject the whole framing — say so plainly instead of forcing it. End with what the novel adds to the debate that argument alone can't get you, and then, bluntly, what you think it implies for my job decision.

  Practical stuff: no bibliography, no citations, no reading list. Don't put anything in quotation marks from the novel — paraphrase scenes, and if you're not sure a scene happened, flag it rather than inventing it. Think carefully and show your working.
