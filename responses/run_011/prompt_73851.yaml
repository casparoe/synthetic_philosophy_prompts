      *   *Reading D: Indexical Moral Uncertainty.* He is uncertain about his *place* in the moral ontology. This fits best. It's uncertainty about *who he is* relative to the moral law, not *what the moral law is*.

  4.  **Developing the Committed Reading (Indexical/Self-locating Uncertainty):**
      *   *Focus:* The "Am I Napoleon?" question.
      *   *Problem:* The evidence is endogenous. You only find out if you're extraordinary by doing the extraordinary thing. But doing the thing might prove you're *not* extraordinary (because you feel guilt).
