  **Note**

  The couplet delivers a reading of irreconcilability. By placing the internal demand (line 18) immediately beside the external reality (line 19) after declaring the spirit fled (line 17), the poem suggests the first voice is now a ghost haunting the second. The alternation throughout the tercets enforces a methodological marriage between reason and fact, yet the narrative arc reveals their historical divorce. The form insists they rhyme, but the content shows the 'heart' has vacated the 'facts'. Thus, the explanatory machinery demands both voices, even though the historical outcome silences one. The final adjacency highlights this tension: the method requires the believer's reason, but the world inherits only the system.
