      *   **Constraint:** The user has no philosophy training. Keep it accessible but accurate. Avoid jargon where possible, or explain it.

  2.  **Deconstruct the Friend's Argument (The Evolutionary Debunking Argument - EDA):**
      *   *Premise 1:* Our moral faculties are products of evolution. (Generally accepted).
      *   *Premise 2:* Evolution selects for reproductive fitness, not moral truth. (Generally accepted).
      *   *Premise 3:* Therefore, there is no reliable connection between our moral beliefs and moral facts (if they exist). (Contested).
      *   *Conclusion:* Moral facts don't exist (or we can't know them). (Contested).

  3.  **Evaluate the "Settled" vs. "Live" aspects:**
      *   *Settled:* Almost no philosopher thinks evolution *didn't* shape our moral psychology. Almost no philosopher thinks evolution selects for *truth* directly (it selects for fitness).
      *   *Live:* Does this entail moral anti-realism? (The core debate between Realists and Anti-Realists). Does the argument self-destruct? (The reliability of reason).

  4.  **Address the User's Second Objection (The "Self-Defeat" / Reliability of Reason):**
      *   This is the "Evolutionary Argument Against Naturalism" (EAAN) vibe, or more specifically, the "Global Debunking" objection.
      *   If evolution undermines *all* cognitive faculties, we can't trust the logic used to make the argument.
      *   *Counter:* Most philosophers distinguish between *practical* reasoning (logic, math, empirical observation) and *moral* reasoning. Or, they argue that true beliefs about the physical world *do* aid survival (e.g., "that's a tiger" needs to be true), whereas moral truths might not be necessary for survival.
      *   *Refinement:* The friend is committing a category error or overgeneralizing. Evolution *does* pressure us to have true beliefs about the physical world (mostly). It pressures us to have *adaptive* beliefs about social coordination (which might be false but useful).

  5.  **Address the User's First Objection (Moral Experience):**
      *   This is the "Phenomenology of Morality." It feels objective.
      *   *Realist response:* Error Theory (Mackie) says it feels objective but is false.
      *   *Realist counter:* Robust Realism (Enoch, Shafer-Landau) says the feeling is a clue, not proof, but the EDA fails to rule out truth-tracking.
      *   *Naturalist response:* Moral facts *are* facts about well-being, which evolution *does* track.

  6.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Validate the user. This is a famous argument (Evolutionary Debunking Argument). The friend is channeling Sharon Street or Richard Joyce (though maybe unintentionally).
      *   **Part 1: What Philosophers Agree On (The Setup):**
          *   Yes, evolution shaped moral psychology.
          *   Yes, evolution cares about fitness, not truth *per se*.
          *   *Correction:* It's not "distortion," it's the standard starting point.
      *   **Part 2: Where the Friend Overreaches (The Inference):**
          *   The leap from "evolution shaped it" to "therefore it's false" is the weak link.
          *   *Analogy:* Evolution shaped our vision. Does that mean trees aren't real? No, because seeing trees helps survival.
          *   *The "Third Factor" or "Pre-established Harmony":* Maybe moral truth *is* about survival/flourishing. If so, evolution tracks it.
          *   *Realist Defense:* We can use reason to refine instincts. We don't just follow gut feelings (e.g., we overrode the instinct to kill outsiders).
      *   **Part 3: The "Self-Defeat" Objection (The User's Sharp Point):**
