          *   If evolution undermines *all* reasoning, the friend's argument collapses.
          *   *Distinction:* Instrumental beliefs (physics, logic) vs. Normative beliefs.
          *   *Consensus:* Most philosophers think the EDA applies *specifically* to morality because moral facts (if they exist) are weird/non-natural, whereas physical facts causally interact with us.
          *   *However:* If the friend says *no* reasoning is trustworthy, he's a skeptic about everything, which is untenable for living life.
      *   **Part 4: The Conclusion (Does it survive?):**
          *   It doesn't prove "no moral facts." It proves "we need a better explanation for why our morals might be true."
