answer: |-
  You have stumbled onto one of the most active and sophisticated debates in contemporary meta-ethics. Your friend is articulating a version of the **Evolutionary Debunking Argument (EDA)**. It is not a bar-room distortion; it is a serious argument championed by professional philosophers like Richard Joyce, Sharon Street, and J.L. Mackie.

  However, like most dinner-party philosophy, your friend is presenting a specific conclusion as if it were a settled fact, skipping over the massive disagreements about *why* the argument works or if it works at all.

  Here is the breakdown of what is accepted, what is contested, and why your second objection (the "self-defeat" point) is actually the most philosophically potent thing you said.

  ### 1. What Philosophers Generally Accept (The Setup)
  Your friend's starting premises are mostly uncontroversial in academic circles.

  *   **Evolution shaped our moral psychology:** Almost no philosopher denies that our sense of fairness, empathy, and tribal loyalty was influenced by natural selection.
  *   **Evolution selects for fitness, not truth:** This is also accepted. Evolution cares whether a belief helps you survive and reproduce, not whether the belief is metaphysically "true." A belief that "the angry god lives in that volcano" might keep you away from danger and get passed on, even if there is no god.

  **Verdict:** Your friend is on solid ground here. This is the "settled" scientific background.

  ### 2. Where the Friend Overreaches (The Inference)
  The leap your friend makes is from "Evolution shaped these beliefs for fitness" to "Therefore, these beliefs do not track moral truth." This is where the live fight begins.

  **The "Third Factor" Response:**
  Realists (philosophers who think moral facts exist) argue that fitness and truth might overlap.
  *   *Example:* If "suffering is bad" is a moral fact, and creatures that avoid suffering survive better, then evolution *would* select for the belief that "suffering is bad."
  *   In this view, evolution didn't give us false morals; it gave us a rough draft of *true* morals because true morals help communities flourish.

  **The "Reason as Refiner" Response:**
  Your friend assumes we are stuck with our raw instincts. But humans use reason to override evolution.
  *   Evolution might give us an instinct to fear outsiders. Reason allows us to realize that "outsider" is an arbitrary category and that we should treat them with dignity.
  *   If we can use logic to correct our evolved instincts, then the fact that the *instincts* are evolved doesn't mean our *final moral conclusions* are just biology.

  **Verdict:** Your friend treats the conclusion ("no moral facts") as proven, but many philosophers argue that evolution explains the *origin* of the belief without disproving the *truth* of the belief.

  ### 3. Your Second Objection: The "Self-Defeat" Problem
  You asked: *"If evolution is that bad at producing true moral beliefs, what makes his beliefs about evolution, or about logic, any better?"*

  You have hit on what is arguably the strongest objection to the hardline version of this argument. In philosophy, this is sometimes called the **Global Skepticism** objection or linked to Alvin Plantinga's "Evolutionary Argument Against Naturalism."

  **The Friend's Likely Defense:**
  He would likely say: "Logic and physics are different. If I believe a tiger is behind the bush, I *must* be right to survive. If I believe eating poison kills, I *must* be right. But believing 'killing grandma is wrong' doesn't have the same causal link to physical survival. I can survive just fine being a psychopath if I'm strong enough."
  *   *The Distinction:* He is claiming evolution tracks truth about the **physical world** (because you die if you're wrong) but not the **moral world** (because you can thrive being 'immoral').

  **Why Your Objection Still Stings:**
  Even with that distinction, the argument is dangerous. Our cognitive machinery is the same for math, logic, and morals. If you say the machinery is compromised because it was built for survival rather than truth, you undermine the very logic used to construct the argument about evolution.
  *   If our brains are just "survival calculators," why trust the calculation that says "morality is an illusion"? That calculation itself might just be a survival tactic (e.g., believing "nothing matters" might reduce stress).

  **Verdict:** You are right to feel this is a problem. Most philosophers agree that a "global" debunking argument (one that kills *all* reasoning) is self-defeating. The friend is trying to apply it *only* to morality, which requires a very careful explanation of why logic is safe but morals aren't. He waved it off, but that is the hardest part of his position to defend.

  ### 4. Your First Objection: The "Grandmother" Intuition
  You said: *"I think my grandmother was plainly right about some things... that doesn't feel like a matter of taste."*

  *   **The Friend's View (Error Theory):** He would say your grandmother felt she was right, but she was mistaken. Like believing the sun goes around the earth. It feels self-evident, but it's a projection of our biology.
  *   **The Realist View:** The fact that morality *feels* objective is evidence that it *is* objective. We don't feel this way about preferences (e.g., "I like vanilla"). We feel it about duties ("You shouldn't hit that child").
  *   **The Consensus:** There is no consensus here. This is the stalemate. Anti-realists say feelings are illusions; Realists say feelings are perceptions of facts.

  ### 5. Settled vs. Live: A Cheat Sheet for Dinner
  If you want to navigate this without claiming false authority, here is the landscape:

  | Claim | Status | Notes |
  | :--- | :--- | :--- |
  | **"Evolution influenced human morality."** | **Settled** | Almost universal agreement among philosophers and scientists. |
  | **"Evolution selects for fitness, not truth."** | **Settled** | Accepted as a general principle of biology. |
  | **"Therefore, moral beliefs are unlikely to be true."** | **Live Debate** | This is the core fight. Realists deny the "therefore." |
  | **"There are no objective moral facts."** | **Live Debate** | Roughly 50/50 split in professional philosophy (Realists vs. Anti-Realists). |
  | **"This argument proves logic/reason is also unreliable."** | **Mostly Rejected** | Most philosophers think the argument must be limited to morality, or it destroys itself. |
  | **"We should just pick useful instincts."** | **Contested** | This is **Pragmatism**. It's a valid position, but it's a *choice*, not a scientific fact. |

  ### 6. How to Answer Him (Without Philosophy Training)
  You don't need to defeat him; you just need to show that his certainty is unwarranted.

  1.  **On the Self-Defeat:** "If our brains are just survival tools and not truth-tools, why do you trust the brain that came up with the theory of evolution? If you say logic is different, you have to explain *why* evolution got logic right but morals wrong. You can't just assume it."
  2.  **On the 'No Facts' Claim:** "You're saying because our morals have a biological *cause*, they can't have a moral *truth*. But I can have a biological cause for seeing a tree (eyes + brain) and the tree can still be real. Why can't moral facts be real things that evolution helped us detect?"
  3.  **On the Conclusion:** "Even if you're right that we can't *prove* moral facts, your conclusion that we should just 'pick useful instincts' is itself a moral claim. You're saying we *ought* to be honest about our instincts. Where does that 'ought' come from if there are no moral facts?"

  ### Summary
  Your friend is arguing for **Moral Error Theory** based on **Evolutionary Debunking**.
  *   **What he gets right:** Evolution cares about survival, not truth.
  *   **What he overreaches on:** He assumes this *proves* there are no moral facts, rather than just making it harder to explain how we know them.
  *   **Your sharp intuition:** You correctly identified that if this argument applies to everything, it destroys itself. Philosophers spend thousands of pages trying to stop the argument from "bleeding" from morality into logic.
  *   **The Verdict:** The argument is a strong challenge to moral realism, but it is not a knockout punch. It remains a live, unresolved fight in philosophy. You are well within your rights to reject his conclusion as premature.
