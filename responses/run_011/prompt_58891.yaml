  Two mates are stuck on whether there's three things on a worktop or thousands. They try my test: ban the word "thing," invent "zorp," and define it precisely on a napkin. They write: "A zorp is a distinct, separate object." One says, "Right, mug's one zorp." The other says, "No, sugar grains are distinct, separate objects." The first says, "But we defined it!" The second says, "We defined the label. You're defining 'distinct' as 'functional'. I'm defining it as 'physical'." They stare at the napkin. They realize they haven't solved the argument, they've just moved the battlefield from the noun to the adjective.

  The punchline leans on the fact that definitions are made of words too; if the criteria for counting aren't shared, the ambiguity hides in the defining terms (like "distinct") rather than the head noun, causing the dispute to regenerate immediately.

  Alternative punchline: Alternatively, they realize the argument didn't stop because it wasn't about words, it was about how much of the universe they were willing to count.
