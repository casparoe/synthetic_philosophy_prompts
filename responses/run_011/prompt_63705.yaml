      *   *Wait, the prompt asks:* "What theory does that practice actually presuppose?"
      *   *My verdict:* It presupposes **Status-Based Reciprocity**. You only owe a debt of labor if you are in a position of *dependency* on the state. If you are independent (wealth), you owe nothing. This isn't universal reciprocity.
      *   *Alternative:* It's **Deterrence**. The theory is that welfare creates moral hazard, and sanctions correct it.
