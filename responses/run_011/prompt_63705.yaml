          5.  Specify a factual condition that would falsify this reading.
          6.  Describe concrete changes required if the state actually operated on the *rival* theories instead.

  2.  **Deconstruct the Welfare Conditionality Regime:**
      *   *Observation:* Only the poor are subject to conditionality (job search, hours, applications).
      *   *Observation:* Sanctions punish procedural failures (missing appointments) as much as substantive failures (refusing work).
      *   *Observation:* Wealthy non-workers (rentiers, partners) face no conditions.
      *   *Observation:* Exemptions are based on incapacity (fit note) or caring, not choice.

  3.  **Evaluate Candidate Theories:**
      *   *Reciprocity:* We owe labor to society in exchange for support.
          *   *Problem:* Why doesn't this apply to the rich? If I live off dividends, I'm still consuming societal resources (infrastructure, legal protection). A strict reciprocity model would tax or require service from them too.
      *   *Desert:* You deserve money only if you work/try.
          *   *Problem:* Similar to reciprocity. Why do rentiers deserve income without labor?
      *   *Luck Egalitarianism:* Distinguish between brute luck (unlucky) and option luck (choices). Support the unlucky, punish the choosers.
          *   *Problem:* The system punishes administrative errors (wrong phone number) which look like brute luck/bureaucratic failure, not lazy choices. Also, it ignores the brute luck of being born wealthy.
      *   *Deterrence/Behavioralism:* The goal isn't justice, it's cost reduction and labor supply stimulation.
          *   *Fit:* This explains the asymmetry. It's not about moral worth; it's about managing the poor to ensure labor availability and reducing the bill.

