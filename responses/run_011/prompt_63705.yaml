      *   *Refining the Commitment:* I will argue the system is **Paternalist Deterrence**. It assumes claimants are rational actors who will choose leisure over work unless punished, but only applies this to those visible to the state.
      *   *Wait, one more angle:* **Luck Egalitarianism** is the dominant academic defence of conditionality. (You are responsible for your choices). But the system punishes "bad luck" (text message errors).
