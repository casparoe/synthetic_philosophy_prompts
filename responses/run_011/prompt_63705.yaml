          *   *Desert:* Would reward effort, not just compliance.
          *   *Luck Egalitarianism:* Would not punish administrative errors (bad luck).
      *   **Underdetermination:** Where Deterrence and Reciprocity overlap (the requirement to search for work). Both agree work is good, but for different reasons.
      *   **Falsification Condition:** What fact would make me drop the Deterrence theory? If sanctions were lifted when labor demand was low (no point deterring if no jobs). Or if sanctions were applied to tax avoiders.
      *   **Concrete Changes for Rivals:**
