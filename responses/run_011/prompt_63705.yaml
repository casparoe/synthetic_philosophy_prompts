      *   *Strongest Commitment:* I will argue the system is best understood as **Paternalist Deterrence masquerading as Reciprocity**. But if I must pick a *moral* theory that licenses it, it's a **narrow, status-based Reciprocity**.
      *   *Actually, looking closer at the prompt:* "Pick the reading you think is right." I should go with the one that explains the *asymmetry* (poor vs. rich). Pure Reciprocity fails there. Luck Egalitarianism fails there. The only one that fits the *actual operation* is **Fiscal Deterrence/Behaviorism**. But is that a "theory"? It's a policy logic.
      *   *Let's try this:* The implicit theory is **Reciprocity**, but it is applied **hypocritically** or **structurally biased**. No, that's dodging.
