      *   *Decision:* I will commit to **Fiscal Deterrence / Labor Discipline**. It is the only theory that explains the asymmetry between the poor and the wealthy non-workers. Reciprocity and Desert would logically extend to the wealthy. Luck Egalitarianism would logically excuse administrative errors. Deterrence only targets the cost center.

  5.  **Drafting the Response:**
