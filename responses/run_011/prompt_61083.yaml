answer: |-
  Here is a sequence of nine questions designed to corner the specific evasions you mentioned while keeping the language accessible. The order moves from definitions to mechanisms, then to constraints (Bell/PBR), then to competitors (QBism), and finally to empirical stakes.

  ### 1. The Map and the Territory
  **Goal:** Establish the core claim and block the "it's just a classification" dodge immediately.
  **Audience:** General.
  **Trap:** She may claim the distinction is merely semantic to avoid ontological commitment.

  **Question:** "Let's start with the wavefunction. In your view, this isn't a physical wave moving through space. It's more like a weather forecast—a summary of what we know, not the storm itself. But if I ask you what the storm *actually is*, independent of the forecast, do you have an answer? Or is the 'storm' just a placeholder for whatever the math points to?"

  **Likely Dodge:** "The ontic/epistemic distinction is just a useful classification scheme for models. We shouldn't reify it."
  **Follow-up:** "I understand the caution, but you've published a model that relies on this distinction to solve problems other models can't. If it's just a label, why does swapping the label allow you to remove nonlocality? I need to know for the reader: is there a physical reality underneath your math, or is the math the only reality?"

  ### 2. The "Lambda" (The Underlying State)
  **Goal:** Pin down what the hidden variable is without using jargon.
  **Audience:** General.
  **Trap:** Describing $\lambda$ in a way that sounds indistinguishable from a standard hidden variable theory (like Bohmian mechanics), undermining the "epistemic" claim.

  **Question:** "You say the wavefunction is information about an underlying physical state, often called lambda. In older hidden-variable theories, that underlying state was usually a particle with a definite position. In your model, what is lambda made of? Is it stuff? Is it fields? Or is it something that doesn't exist in time at all?"

  **Likely Dodge:** "Lambda is just the set of variables required to determine the outcome. It's a theoretical construct."
  **Follow-up:** "If lambda determines the outcome, and lambda is physical, then the uncertainty is just in our heads. But if lambda is just a 'theoretical construct' and not a physical thing, then aren't you back to square one? I'm trying to pin down: when the electron flies through the vacuum, what is it doing *before* we measure it?"

  ### 3. Preparation Independence (The Two-Lab Problem)
  **Goal:** Address the PBR theorem evasion. PBR kills psi-epistemic models *unless* they violate "preparation independence."
  **Audience:** General (requires analogy).
  **Trap:** Admitting violations of independence without acknowledging the "conspiratorial" implication.

  **Question:** "There's a famous result called the PBR theorem. Roughly, it says your view is impossible unless two separate labs can influence each other's equipment just by setting up experiments. Standard physics assumes that if I prepare a particle in London, it doesn't matter what you're doing in New York. Does your model keep that assumption?"

  **Likely Dodge:** "PBR assumes preparation independence, which is a strong assumption. We don't need to accept it."
  **Follow-up:** "So if I turn on a laser in London, that could change the state of a particle in New York, even before any signal connects them? If you drop that assumption, doesn't the universe have to be strangely coordinated to make sure we don't notice? How is that not just nonlocality with the serial number filed off?"

  ### 4. The Bell Squeeze
  **Goal:** Force a choice between Nonlocality and Retrocausality. She wants to keep Locality, so she must pay the Retrocausality tax.
  **Audience:** General.
  **Trap:** Claiming to save "locality" without admitting the cost to "causality."

  **Question:** "Bell's theorem tells us we can't have it all. We usually give up locality—accepting spooky action at a distance. You choose to keep locality. That means the price you pay is causality—the idea that the past fixes the future. Is it fair to say that in your universe, the future measurement setting reaches back and helps write the past history of the particle?"

  **Likely Dodge:** "It's not that the future changes the past. It's that the boundary conditions are set at both ends."
  **Follow-up:** "For the reader, that sounds like a distinction without a difference. If the setting I choose next Tuesday affects the state of the particle last Monday, isn't that retrocausality? And if so, why don't I remember the future? What stops this backwards influence from creating paradoxes?"

  ### 5. Signaling vs. Influencing
  **Goal:** Clarify why we can't use this to send messages back in time (the "no-signaling" constraint).
  **Audience:** General.
  **Trap:** Using technical "no-signaling" proofs to hand-wave away the weirdness.

  **Question:** "If my future choice influences the past, why can't I use that to send a message to myself yesterday? Say, to warn me not to make the measurement?"

  **Likely Dodge:** "The model is constructed to prevent signaling. It's statistically impossible to extract the information."
  **Follow-up:** "So the influence is there, physically, but it's hidden from us by the statistics? That sounds like the universe is physically retrocausal but phenomenologically normal. Why should we believe in a physical influence that is, by definition, undetectable?"

  ### 6. The QBist Contrast
  **Goal:** Distinguish her from QBism (Quantum Bayesianism). Both say "epistemic," but QBists reject the ontological model framework entirely.
  **Audience:** Physicists/High-level General.
  **Trap:** Blurring the lines to sound more mainstream.

  **Question:** "The QBists also say the wavefunction is just information. But they argue there *is* no underlying lambda. They say looking for the 'real state' is a mistake. You, however, keep the lambda. Why hold onto a hidden reality if the QBists say you don't need it?"

  **Likely Dodge:** "QBism is a very subjective take. I want an objective account of the world."
  **Follow-up:** "But by keeping lambda, you inherit all the problems of hidden variable theories, like the PBR theorem we discussed. The QBists dodge those bullets by saying the questions are invalid. Are you keeping lambda because it's necessary, or just because it feels more 'real' to you?"

  ### 7. The "Just Bookkeeping" Charge
  **Goal:** Address testability. If it predicts the same things as standard QM, why adopt it?
  **Audience:** General.
  **Trap:** Claiming "conceptual clarity" as a scientific virtue equivalent to empirical prediction.

  **Question:** "If your model reproduces the exact same predictions as standard quantum mechanics, it's empirically identical. A critic might say this is just rival bookkeeping—a different way to write the same numbers. What do you gain that makes the complexity of retrocausality worth it?"

  **Likely Dodge:** "It resolves the paradoxes. It gives us a clearer picture of what's happening."
  **Follow-up:** "Clarity is good for humans, but nature doesn't care about our clarity. If the predictions are identical, is this physics or is it philosophy? At what point does 'interpreting the math' become 'doing science'?"

  ### 8. The "Instrumentalist" Retreat
  **Goal:** Pre-empt the move where she claims she's not making truth claims, just using a tool.
  **Audience:** General.
  **Trap:** Retreating to instrumentalism ("shut up and calculate") after arguing for a realist-sounding model.

  **Question:** "Throughout this interview, I've asked if things are 'real.' But some physicists say we shouldn't ask that. We should just ask if the model works. Are you claiming your retrocausal model is the *true* description of nature, or just the most useful tool for thinking about it?"

  **Likely Dodge:** "I'm a scientist. I deal in models. 'True' is a strong word."
  **Follow-up:** "But earlier you argued against the PBR theorem and defended the reality of lambda against QBists. You can't argue that other people are wrong about reality and then say you're just holding a tool when you get pressed. Which is it? Are you describing the world, or are you organizing calculations?"

  ### 9. The Falsification Condition
  **Goal:** Close with a concrete stake. What kills the theory?
  **Audience:** General.
  **Trap:** Giving a vague answer like "if the math breaks."

  **Question:** "Finally, every scientific idea has to risk being wrong. What observation, tomorrow or next year, would force you to abandon this retrocausal, psi-epistemic view? What would prove you wrong?"

  **Likely Dodge:** "If we find a violation of quantum mechanics, like signaling..."
  **Follow-up:** "But if quantum mechanics holds up, your model survives. So your fate is tied entirely to standard QM being correct? If standard QM is right, you're right. If so, how is your view distinct from just believing in standard QM?"

  ***

  ### Journalist's Cheat Sheet

  *   **Questions 1 & 8 (The Ontology Trap):** These are your pincers. Q1 sets the trap, Q8 springs it. She will try to be a "realist" when attacking competitors (QBists) and an "instrumentalist" when attacked herself (PBR). Watch for the switch.
      *   *Listen for:* "It depends on what you mean by real." (Stop her. Ask for a yes/no.)
  *   **Questions 3 & 4 (The Causality Trap):** This is the hardest physics for the reader.
      *   *Simplification:* Think of it like a movie reel. Standard physics says the projector (past) drives the screen (future). She says the screen (future) also constrains the film in the projector (past).
      *   *Risk:* If she says "block universe" or "time-symmetric," translate that immediately for the caption or sidebar. It means "past and future exist together."
  *   **Question 5 (The Magic Dodge):** This is the most quotable section.
      *   *Goal:* You want her to admit the influence is "physically real but statistically hidden." That sounds like magic to a lay reader, which highlights the tension in her theory.
  *   **Question 9 (The Stakes):**
      *   *Warning:* If she says "Nothing, it's a framework," you have your headline: "Physicist Admits Theory Cannot Be Proven Wrong." If she gives a specific experimental violation, that's a strong closer.

  **General Advice:** She is polished. She will likely thank you for the question, pause, and then give a 45-second answer that circles the point. Do not be afraid to interrupt gently during the follow-up. "I want to make sure I understand that specific point..." is your best friend.
