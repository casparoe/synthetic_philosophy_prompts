prompt: |-
  I write about physics and philosophy for a general-interest science mag — long read up front, with a Q&A box running next to it. Next month I'm interviewing a mathematical physicist who defends what she calls a maximally psi-epistemic account of the quantum state, with retrocausality doing a lot of the work. Roughly: the wavefunction isn't a thing out there in the world, it tracks an agent's information about an underlying physical state, and that underlying state is partly fixed by which measurements get performed later on. She's actually published the model, so its a serious toy theory and not just vibes, and she's a very polished interviewee who has done this dance before. She has two go-to moves I want to stop her getting away with. One is retreating to "the psi-ontic/psi-epistemic thing is just a useful classification, don't take it too seriously," which dissolves my question instead of answering it. The other is saying the PBR theorem assumes what its trying to prove, and then moving right along.

  Give me eight to ten questions I can ask on tape, in an order that builds, each with the follow-up I should fire for the answer she's most likely to give — not the answer she'd ideally give. I want coverage of: what her lambda actually is, and why calling the state "information about it" isn't just a hidden variable wearing a hat; whether she can keep preparation independence or has to surrender it, and what that does to her story about two separate labs; the Bell squeeze — nonlocality or backwards-in-time influence, she shouldn't get to duck both; where she breaks with the QBists, who also say the state is epistemic but think the whole ontological-models framework she's working inside is a mistake; whether her model is testable or is just rival bookkeeping that reproduces the same predictions forever; and a closing question about what observation would make her abandon the view.

  Two constraints. Readers are bright but do no maths, so every question has to be askable in plain words — and for each one, tell me whether a general reader can follow it or whether it's really for the physicists in the audience. Also flag the traps honestly: which of these questions is only there to get me a quotable line, and where she could give an answer that's technically correct but would mislead a lay reader, so I know what to listen for.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** Interviewing a mathematical physicist for a general-interest science magazine (long read + Q&A box).
      *   **Subject:** Defends a "maximally psi-epistemic" account of the quantum state using retrocausality.
      *   **Core Claims:** Wavefunction = agent's info (not real thing); Underlying state ($\lambda$) partly fixed by future measurements (retrocausality).
      *   **Interviewee Profile:** Polished, published model (serious toy theory), has "go-to moves" to evade tough questions.
      *   **Specific Evasions to Counter:**
          1.  Dismissing psi-ontic/epistemic as "just a classification."
          2.  Dismissing PBR theorem as "begging the question."
      *   **Required Coverage:**
          1.  Nature of $\lambda$ (is it just a hidden variable?).
          2.  Preparation Independence (two separate labs).
          3.  Bell's Theorem (Nonlocality vs. Retrocausality).
          4.  QBism comparison (epistemic but different framework).
          5.  Testability (is it just bookkeeping?).
          6.  Falsification (what would change her mind?).
      *   **Format:** 8-10 questions, ordered logically, with specific follow-ups for likely evasive answers.
      *   **Constraints:** Plain language (no math), flag audience level (General vs. Physicist), flag traps (quotable lines vs. technically correct but misleading).

  2.  **Deconstruct the Physics/Philosophy:**
      *   *Psi-epistemic:* $\psi$ represents knowledge, not reality. Different $\psi$ can correspond to the same underlying reality ($\lambda$).
      *   *Retrocausality:* Future measurement settings influence past $\lambda$. This allows local models to violate Bell inequalities without nonlocality.
      *   *PBR Theorem:* Proves $\psi$ must be ontic *if* preparation independence holds. Retrocausal models often violate preparation independence (because the future measurement affects the past preparation).
      *   *QBism:* $\psi$ is subjective belief, but they reject the "ontological models framework" (the idea there *is* a $\lambda$ at all). This interviewee *uses* that framework.
      *   *The "Trap":* She might say "It's just a model" to avoid ontological commitment, or "PBR assumes independence" without explaining the cost of dropping independence.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1: The Hook/Definition.* Need to establish what she means by "information."
          *   *Draft:* What is the wavefunction?
          *   *Refinement:* Make it about the "map vs. territory."
          *   *Follow-up:* Counter the "just a classification" dodge.

      *   *Q2: The Underlying Stuff ($\lambda$).* If $\psi$ is info, what is it info *about*?
          *   *Draft:* What is lambda?
          *   *Refinement:* Is it a hidden variable? Why is this different from Bohm?
          *   *Follow-up:* If it behaves like a particle, why call it epistemic?

      *   *Q3: PBR & Preparation Independence.* This is crucial. PBR kills psi-epistemic unless you break independence.
          *   *Draft:* What about PBR?
          *   *Refinement:* PBR says you can't do this unless preparations are independent. Are yours?
          *   *Follow-up:* If no, does that mean two labs aren't separate? (The "conspiracy" worry).

      *   *Q4: Retrocausality Mechanism.* How does the future talk to the past?
          *   *Draft:* How does retrocausality work?
          *   *Refinement:* Is it a signal? Can I send a message?
          *   *Follow-up:* If no signal, in what sense is it causal?

      *   *Q5: Bell's Squeeze.* Nonlocality or Retrocausality?
          *   *Draft:* Bell's theorem.
          *   *Refinement:* Bell says you have to give up something. You give up "past fixes future." Is that cheaper than "spooky action"?
          *   *Follow-up:* Don't let her say "I keep locality" without admitting the cost.

      *   *Q6: QBism Comparison.* Both say epistemic, but different reasons.
          *   *Draft:* Are you a QBist?
          *   *Refinement:* QBists say there is no $\lambda$. You have a $\lambda$. Why the difference?
          *   *Follow-up:* Is their view more honest?

      *   *Q7: Testability.* Is this science or philosophy?
          *   *Draft:* Can we test this?
          *   *Refinement:* Does it predict anything new?
          *   *Follow-up:* If it matches QM exactly, why prefer it? (Simplicity? Intuition?)

      *   *Q8: The "Just a Model" Dodge.* Pre-empting the "instrumentalist" retreat.
          *   *Draft:* Is it real?
          *   *Refinement:* You published a model. Is it a description of the world or a calculator?
          *   *Follow-up:* If calculator, why argue about epistemic/ontic?

      *   *Q9: Falsification.* What kills the theory?
          *   *Draft:* What would change your mind?
          *   *Refinement:* Specific observation.
          *   *Follow-up:* Ensure it's not "if the math stops working."

      *   *Review against constraints:* 8-10 questions? I have 9 drafted. Need to ensure flow.
      *   *Audience Check:* Ensure no jargon like "Hamiltonian," "Hilbert Space," "Communtators." Use "settings," "outcomes," "underlying state."
      *   *Trap Flagging:* Need to be explicit about where she might mislead.

  4.  **Refining the Follow-ups (The "Judo" Moves):**
      *   *The "Classification" Dodge:* If she says "ontic/epistemic is just a label," the follow-up must be "Then why write papers defending one?"
      *   *The "PBR" Dodge:* If she says "PBR assumes independence," the follow-up must be "So my lab affects your lab?"
      *   *The "No Signaling" Dodge:* If she says "Can't send messages," follow-up with "Then how is it physics and not magic?"

  5.  **Final Polish:**
      *   Organize logically: Concept -> Mechanism -> Constraints (Bell/PBR) -> Competitors (QBism) -> Empirical Status -> Personal Commitment.
      *   Add the "Journalist Notes" for each (Audience, Trap, Goal).
      *   Ensure the tone is respectful but persistent.

  6.  **Self-Correction during drafting:**
      *   *Critique:* Q3 about PBR might be too technical.
      *   *Fix:* Frame it as "independent experiments." Everyone understands that turning on a laser in London shouldn't affect a laser in New York.
      *   *Critique:* Q6 about QBism might confuse readers.
      *   *Fix:* Focus on the "hidden reality" distinction. QBism = no hidden reality. Her = hidden reality + info.
      *   *Critique:* Need to make sure I don't sound like I'm attacking retrocausality itself, but rather the *consistency* of her specific account.

  7.  **Final Output Generation:** (Matches the structure of the provided good response).
      *   Intro: Acknowledge the challenge.
      *   The Questions: Numbered, with Setup, The Question, The Likely Dodge, The Follow-up, and Journalist Notes.
      *   Closing advice.

  *(Self-Correction on Count)*: The prompt asks for 8-10 questions. I will aim for 9 to allow a tight narrative arc.

  *(Self-Correction on Tone)*: Ensure the follow-ups don't sound aggressive but rather "seeking clarity for the reader."

  *(Final Check on Constraints)*:
  - Plain words? Yes.
  - Audience flag? Yes.
  - Trap flag? Yes.
  - Coverage areas met? Yes (Lambda, Prep Independence, Bell, QBism, Testability, Falsification, Evasions).

