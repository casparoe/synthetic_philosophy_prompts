  - Same setup except the person warning you about your impairment is a known prankster and you have solid independent reason to think he's lying: she says no change at all, dismiss it.
  - Anyone who says "p, but it'd be irrational of me to believe p": she calls that combination flatly irrational, and gets annoyed at people who say it's only a problem for assertion.
  - A juror told mid-deliberation that the coffee was spiked with something that makes people over-credit eyewitnesses: she says don't just shade your confidence down, treat the eyewitness testimony as knocked out entirely.

  My case: an on-call doctor who has personally gone over the labs twice and is confident the patient is crashing, then gets a page from a senior colleague he trusts about his own blind spots, saying the med he took an hour ago reliably warps how people read those particular values. He cant check again tonight and he can't tell from the inside whether he's affected.

