      *   *Check:* Is the distinction between "conscious belief" and "unconscious prior" clear? This is the crux. Maya thinks telling you it's a lime changes the *sensation*. Jonah says it changes the *interpretation*. The truth is it changes the *prediction*, which generates the sensation, but only when sensory data is weak.

  6.  **Final Polish:** Ensure the distinction between Cognitive Penetration (Maya's claim) and Perceptual Inference (The Teacher's hint) is sharp. (Self-correction: Make sure not to get too bogged down in philosophy of mind, keep it relevant to AP Psych concepts like top-down/bottom-up processing).

