          3.  The Intuitive Argument (The "Feel"). Explain tacit knowledge.
          4.  The Principled Line (Exchangeability vs. Systematics).
          5.  Closing thought.

      *   *Refining the "Fair Coin" analogy:* The Postdoc says "It's like a fair coin." The User says "We only know it's fair because people counted it." If I count 6/400, maybe *my* coin is weighted, or maybe the global count was wrong. The Postdoc is reifying the statistic.
      *   *Refining the "Feel":* This is about *calibration*. A veteran knows when the machine is lying.
      *   *Key Philosophical Concept:* *Exchangeability* (de Finetti). Are my trials exchangeable with the trials that generated the 0.003? If not, the 0.003 doesn't apply to me.

  6.  **Final Polish:** Check against the user's specific questions.
      *   "Are those two reasons... really the same kind of thing?" -> No.
      *   "Where's the principled line?" -> Exchangeability and Systematics.
      *   "What gave the number its authority?" -> Aggregation, but aggregation isn't infallible.

