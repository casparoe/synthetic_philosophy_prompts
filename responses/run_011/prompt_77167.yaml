answer: |-
  Here is the principle derived from your pile, the mapping, the uncomfortable applications, and the honest critique of your own verdicts.

  ### The Principle: The Ruin-Containment-Cost Triad

  Restraint ("don't do it yet") is justified if and only if **all three** of the following conditions are met. If any single condition fails, the presumption shifts to action.

  1.  **The Ruin Condition (Non-Ergodicity):** The potential harm involves systemic, irreversible collapse or "ruin" (e.g., species extinction, ozone hole, pandemic, termination shock) rather than localized or reversible damage.
      *   *Precision:* "Ruin" is defined as a state from which recovery is impossible or prohibitively costly on human timescales, not merely "bad outcomes."
  2.  **The Containment Condition (Institutional Competence):** The risk cannot be spatially, temporally, or institutionally bounded by existing regulatory capacity.
      *   *Precision:* If a competent regulator can isolate the failure mode (e.g., a lab leak, a specific reactor), restraint is not justified. If the risk is diffuse or global (e.g., atmospheric release, open ocean), restraint is justified.
  3.  **The Delay Cost Condition (Asymmetry of Inaction):** The certain harm caused by *waiting* (lives lost, stagnation, emissions continued) does not exceed the probable harm of *acting*.
      *   *Precision:* This is not a standard expected-value calculation. It requires the harm of inaction to be *immediate and certain* to override a *uncertain but ruinous* risk of action.

  ---

  ### Clause-to-Case Mapping

  Here is how the Triad reconstructs your verdicts. Where a clause had to be added to fit your intuition, I have noted it.

  | Case | Verdict | Ruin? (Clause 1) | Containment? (Clause 2) | Delay Cost? (Clause 3) | Fit |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Neonics** | Restraint | **Yes** (Pollinator collapse) | **No** (Diffuse ag use) | **Low** (Yield loss manageable) | Fits, but fragile (see Overturn). |
  | **Preservative** | No Restraint | **No** (Headaches) | N/A | N/A | **Clause 1** forces this. No ruin = go. |
  | **CFCs** | Restraint | **Yes** (Ozone/UV) | **No** (Atmospheric) | **Low** (Substitutes existed) | Perfect fit. |
  | **rDNA** | No Restraint | **No** (Contained bacteria) | **Yes** (Lab protocols) | **High** (Insulin/Vaccine) | **Clause 2 & 3** force this. |
  | **Malaria Vaccine** | No Restraint | **No** (Rare signal) | N/A | **High** (Malaria deaths) | **Clause 3** forces this. |
  | **Sleeping Pill** | Restraint | **No** (Cardiac) | **Yes** (Recall possible) | **Low** (Insomnia) | *Edge Case:* Fits only because Delay Cost is low. |
  | **Geoengineering** | Restraint | **Yes** (Termination Shock) | **No** (Global thermostat) | **High** (Warming) | **Clause 1 & 2** override Clause 3. Ruin dominates. |
  | **Nuclear (Good)** | No Restraint | **No** (Meltdown rare) | **Yes** (Regulator works) | **High** (Emissions) | **Clause 2** is the switch. |
  | **Nuclear (Bad)** | Restraint | **Yes** (Meltdown likely) | **No** (Regulator fails) | **High** (Emissions) | **Clause 2** fails, Ruin becomes probable. |
  | **Gene Drive (Island)**| No Restraint | **No** (Contained) | **Yes** (Geography) | **High** (Malaria) | **Clause 2** saves it. |
  | **Gene Drive (Cont.)**| Restraint | **Yes** (Ecosystem shift) | **No** (Continental) | **High** (Malaria) | **Clause 2** fails. |
  | **Gain-of-Function** | Restraint | **Yes** (Pandemic) | **No** (Lab leak risk) | **Low** (Research delay) | Perfect fit. |

  **Note on Clause 2 (Capacity):** This clause was forced by your **Nuclear** and **Gene Drive** splits. Without it, you cannot distinguish between the same technology in different jurisdictions or scales. It acknowledges that risk is not intrinsic to the tech, but to the *socio-technical system*.

  ---

  ### Uncomfortable Applications

  Here is what the Triad says about cases you didn't list. These land in uncomfortable places because they force trade-offs between "Ruin" and "Delay Cost."

  **1. Germline Editing (CRISPR Babies)**
  *   **Analysis:** Ruin is **Yes** (permanent genetic changes to human lineage, unknown downstream effects). Containment is **No** (once born, the genome propagates). Delay Cost is **Low** (waiting for somatic alternatives).
  *   **Verdict:** **Strict Restraint.**
  *   **Discomfort:** This aligns with current norms, but it creates a hard barrier against human enhancement even if the specific edit is "safe." It prioritizes the *structure* of the risk (inheritance) over the *magnitude* of the specific edit. It forbids "safe" germline editing because the *system* of human genetics cannot be contained if an error occurs.

  **2. Open-Sourcing Powerful AI Model Weights**
  *   **Analysis:** Ruin is **Yes** (misuse for bio/cyber attacks). Containment is **No** (once weights are online, they cannot be recalled). Delay Cost is **Debatable** (open science benefits vs. safety).
  *   **Verdict:** **Restraint.**
  *   **Discomfort:** This contradicts the "open source safety" argument. The Triad argues that if the downside is ruin (pandemic via AI-designed pathogen) and containment is impossible (internet), you cannot release the weights, regardless of the democratic benefits of openness. It treats code like a pathogen under the Containment Condition.

  **3. Mandatory Vaccination (during novel pandemic)**
  *   **Analysis:** Ruin is **Yes** (Healthcare collapse/Death). Containment is **No** (Virus spreads regardless). Delay Cost is **High** (Deaths during voluntary rollout).
  *   **Verdict:** **No Restraint (on Mandate).**
  *   **Discomfort:** This overrides the "Consent" knob you mentioned in your draft principle. The Triad prioritizes Ruin avoidance over individual opt-in when Containment fails. If the virus cannot be contained by voluntary action, the "Consent" clause is deleted by the "Ruin" clause.

  ---

  ### The Overturn: Where Your Intuition Fails

  I must overturn your verdict on **Neonics**.

