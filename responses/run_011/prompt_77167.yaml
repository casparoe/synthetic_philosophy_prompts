  ### The Meta-Worry: Is This Just Relabeling?

  **Question:** Is "Restrain when expected harm exceeds threshold t" just ordinary Expected Utility Theory (EUT)?
  **Answer:** No. This principle has non-trivial content over EUT.

  **Reasoning:**
  EUT requires you to multiply Probability $\times$ Impact. In all the cases you listed (CFCs, rDNA, Geoengineering), the **Probability is unknown** (Knightian Uncertainty). You cannot do the math.
  *   EUT practitioners often substitute a "best guess" probability, which leads to gambling on tail risks (e.g., "Only 1% chance of pandemic, so do the Gain-of-Function research").
  *   The Triad replaces the *Probability* variable with a *Structural* variable (Reversibility/Containment).
  *   It says: "If the Impact is Ruin, and Probability is Unknown, and Containment is Impossible, you do not multiply. You stop."
  *   This is **Lexicographic Ordering**, not Weighted Summing. It prioritizes survival over optimization. That is a distinct decision rule from EUT. It prevents "ruin" from being traded off against "benefit," whereas EUT allows high benefits to cancel out high risks if the probability is low enough.

