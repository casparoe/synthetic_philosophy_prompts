      *   **Problem:** Their self-observation is unreliable. Their work journals are full of contradictions, rationalizations, and blind spots (e.g., claiming a plan was the plan all along, giving different honest reasons for the same book, misidentifying avoidance as structural issues, misidentifying terror as cheerfulness).
