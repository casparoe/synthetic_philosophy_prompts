  2.  **Deconstruct the Thesis & Metaphysical Framework:**
      *   *Dispositional Realism:* Think Mumford, Cartwright, maybe some Bird. Properties aren't categorical bases + laws; they *are* powers. A glass is fragile not because of its microstructure + laws, but because "fragility" is a real property defined by what it *does* (breaks when struck).
      *   *Application to NNs:* A "feature" (e.g., 'dog') isn't a static vector $v$ such that $v \cdot x > 0$. It's a *capacity* of the network to produce specific downstream effects (outputs, internal state shifts) given specific stimuli.
      *   *Superposition:* In standard realism, if 'dog' and 'cat' share dimensions, it's messy. In dispositionalism, powers can overlap and be latent. A circuit has the power to detect 'dog' even if currently processing 'cat', provided the stimulus conditions were right.
      *   *Interest-Relativity:* Dispositions are often indexed to stimuli conditions. Which dispositions we care about depends on our explanatory interests. This dissolves the "no privileged basis" worry.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be punchy and philosophical. "Powers, Not Pixels" or "The Dispositional Turn." Let's go with "The Dispositional Turn in Interpretability."
      *   **Introduction:** State the thesis clearly. Reject the categorical view of representations (vectors as static objects). Propose the dispositional view.
      *   **The Metaphysical Machinery:** Briefly explain Dispositional Realism (powers, manifestation conditions). Connect to NNs. A feature $F$ is a disposition $D$ to cause effect $E$ given stimulus $S$.
      *   **Interpretability Machinery Integration:**
          *   *SAEs:* Don't view SAE features as "finding the atoms." View them as *isolating specific manifestation conditions*. Sparsity isn't ontological; it's pragmatic for tracking powers.
          *   *Activation Patching/Steering:* These aren't "reading" static values; they are *testing* causal powers. Steering vector $v$ works because adding $v$ triggers the disposition to generate text associated with $v$.
      *   **Pressure Point 1: Triviality/Unfalsifiability:**
          *   *Objection:* If any direction is a disposition, everything is a feature.
          *   *Response:* Dispositions must be *stable* and *projectable*. Random noise directions don't support counterfactuals. We need *robustness* across contexts. Also, interest-relativity isn't arbitrariness; it's constrained by the system's architecture and training objective.
      *   **Pressure Point 2: Finks and Masks (Martin/Lewis):**
          *   *Objection:* If I patch weights and the feature disappears (fink) or appears (mask), was it ever real? Does this break causal methodology?
          *   *Response:* Distinguish between the *basis* of the disposition and the disposition itself. Intervention changes the basis. If the power vanishes upon intervention, the intervention destroyed the power. This doesn't break methodology; it refines it. We are mapping the *modal profile* of the system, not just the actual state. Causal patching tests the *stability* of the power.
      *   **Falsification Conditions:** What would kill this view?
          *   If causal interventions show no stability (pure chaos).
          *   If dispositional profiles are entirely gerrymandered with no clustering.
          *   If categorical structure (weights) completely dictates behavior with no room for context-sensitive manifestation.

