answer: |-
  # The Dispositional Turn in Interpretability
  **A Position Paper for the Metaphysics of Interpretability Reading Group**

  ### 1. The Thesis: From Categories to Powers

  The standard debate in mechanistic interpretability asks: *Do neural networks contain representations?* This question presupposes a categorical ontology. It assumes that for a feature (say, "dog-ness") to be real, it must correspond to a specific, static structural element within the network—a localist neuron, a privileged subspace, or a distinct circuit that exists independently of what the network is doing. When we fail to find these clean, orthogonal structures, particularly in the presence of superposition, we are tempted toward anti-realism: features are merely useful fictions imposed by observers on a high-dimensional soup.

  I argue that this dialectic is a category error. We should not ask if networks *have* representations in the categorical sense. We should ask if they possess *dispositions*.

  My position is **Dispositional Feature Realism**. On this view, a feature is not a static object stored in activation space; it is a *causal power* of the system. To say a model has a "dog feature" is to say it has the disposition to produce specific downstream effects (logit shifts, attention patterns, subsequent activations) given specific stimulus conditions (inputs containing dogs). This view models feature realism on dispositional realism in metaphysics (à la Mumford, Cartwright, and Bird).

  This shift dissolves the anxiety surrounding superposition and the lack of a privileged basis. Superposition is not an ontological embarrassment; it is simply the overlap of causal powers. The anti-realist is right that there is no privileged decomposition of activation space, but wrong to think this threatens realism. Dispositions are inherently interest-relative and context-sensitive, yet perfectly real. A glass is fragile regardless of whether we describe its microstructure in terms of silicon atoms or molecular bonds; similarly, a network has the power to detect syntax regardless of whether we describe its weights in Basis A or Basis B.

  ### 2. Integrating the Machinery

  To make this more than a metaphor, we must map the dispositional ontology onto the actual tools of interpretability.

  **Sparse Autoencoders (SAEs) as Power Isolators**
  In the categorical view, SAEs are often criticized for failing to find the "true" atoms of the network, as different runs yield different features. On the dispositional view, SAEs are tools for isolating specific *manifestation conditions*. An SAE feature direction is not the feature itself; it is a handle on a disposition. When an SAE feature fires, it indicates that the specific causal power associated with that direction is *manifesting*. The fact that SAE features are overcomplete and non-orthogonal is expected: causal powers in the real world overlap. The "dog" power and the "mammal" power share a basis. Sparsity is not an ontological claim that the network is mostly empty; it is a methodological constraint to track powers that do not manifest simultaneously.

  **Steering Vectors and Activation Patching as Causal Tests**
  Categorical realism struggles with intervention. If I add a "honesty vector" to the residual stream, have I activated a pre-existing representation or created a new one? For the dispositionalist, this distinction is less critical than the *stability of the power*. Steering vectors work because they trigger the disposition to generate text associated with the concept. Activation patching is the gold standard here: it tests the counterfactual support of the disposition. If I patch activation $A$ from run $X$ into run $Y$, and the behavior changes predictably, I have confirmed that $A$ carries a causal power relevant to that behavior. The feature *is* that capacity to make a difference under intervention.

  ### 3. Pressure Point I: The Triviality Objection

  **The Objection:**
  If features are dispositions, and dispositions are defined by counterfactuals ("if stimulus $S$, then effect $E$"), isn't the view unfalsifiable? In a high-dimensional vector space, I can write down infinite directions. Can I not claim that *every* direction corresponds to some gerrymandered disposition? If any latent direction counts as a feature, the claim "networks have features" becomes vacuous.

  **The Response:**
  This objection conflates *mathematical possibility* with *causal stability*. Dispositional realism does not claim that every logical possibility is a real power. It claims that real powers support robust counterfactuals.

  1.  **Stability and Projectability:** A genuine disposition must manifest reliably across varied contexts. If I define a direction $v$ that correlates with "dog" on the training set but fails to steer the model or patch correctly on out-of-distribution data, it is not a real feature. It is a statistical artifact. The dispositional view imposes a stricter burden than the categorical one: you must show the power holds under intervention, not just correlation.
  2.  **Interest-Relativity $\neq$ Arbitrariness:** The anti-realist argues that because decompositions are interest-relative, they are not real. But consider "flammability." Whether a material is flammable depends on the presence of oxygen (a contextual condition). It is interest-relative to an environment, but it is not arbitrary. Similarly, a network feature is relative to the *architecture and training objective*. We cannot simply decree a disposition exists; the network must have the structural basis to support it.
  3.  **Falsifiability via Clustering:** If the dispositional view were trivial, we would expect causal powers to be distributed chaotically. Instead, we see clustering. SAE features converge across seeds. Steering vectors generalize across prompts. This convergence suggests we are carving nature at its joints, not just drawing lines in the sand. The view is falsified if we find that no set of directions supports stable interventions across contexts.

  ### 4. Pressure Point II: Finks, Masks, and Methodological Collapse

  **The Objection:**
  In metaphysics, a "finkish" disposition (Martin, Lewis) is one that disappears precisely when the stimulus is applied (e.g., a wire that loses conductivity the moment it is touched to a conductor). A "mask" prevents manifestation without removing the power. In neural networks, surgical interventions (weight patching, pruning) often alter the very circuitry that constitutes the feature. If activating a feature via intervention destroys the mechanism that supports it, does the feature exist? Furthermore, if our causal-experimental methodology relies on interventions that potentially fink the system, does the whole enterprise collapse?

  **The Response:**
  This pressure point actually strengthens the dispositional view by forcing us to refine our causal methodology.

  1.  **Distinguishing Basis from Power:** Dispositionalism distinguishes the *power* from its *categorical basis* (the weights). An intervention changes the basis. If I patch weights and the feature disappears, I have not proven the feature was unreal; I have proven I destroyed the basis of the power. This is no different than smashing a glass to test its fragility. The methodology must account for the *fragility of the basis*.
  2.  **Handling Finks in NNs:** True finks in NNs (a circuit that disables itself upon activation) are rare but possible (e.g., via gating mechanisms). The dispositional account handles this by refining the *stimulus conditions*. The disposition is not "to activate on input $I$," but "to activate on input $I$ given background conditions $C$." If an intervention changes $C$, the manifestation fails. This doesn't undermine the method; it demands we model the *context* of the intervention more carefully.
  3.  **Methodological Resilience:** The causal-experimental method rests on the assumption of *modularity*. The dispositionalist argues that modularity is not about static isolation, but about the *independence of powers*. If patching feature $A$ consistently changes output $X$ without altering the power of feature $B$ to change output $Y$, the powers are distinct. If interventions constantly fink each other (holistic entanglement), then indeed, the dispositional view retreats to holism. But current evidence (e.g., the success of linear probing and localized patching) suggests powers are sufficiently modular to be tractable. The worry about finks is a warning against *crude* interventionism, not a reason to abandon causal realism.

  ### 5. Conclusion: When to Abandon the View

  A philosophical position that cannot be killed is not a thesis; it is a dogma. Dispositional Feature Realism makes risky predictions. I would abandon this view if:

  1.  **Interventional Chaos:** If we find that successful steering vectors are entirely non-composable. If adding vector $A$ and vector $B$ yields results that are fundamentally unpredictable from $A$ and $B$ individually (beyond simple interference), suggesting there are no stable, distinct powers, only a holistic soup.
  2.  **Basis Dependence:** If we discover that feature identities are entirely dependent on the specific basis of the weights, such that rotationally equivalent networks possess *different* features. Dispositionalism requires that the powers be invariant to representational format. If the "dog power" vanishes under a rotation of the network that preserves input-output behavior, then features are not real powers of the system, but artifacts of our parameterization.
  3.  **No Counterfactual Stability:** If activation patching consistently fails to generalize. If a direction identified as a feature in context $C_1$ cannot be used to intervene in context $C_2$, then there is no disposition, only a collection of unrelated events.

  **Summary:**
  The question "Do neural networks have representations?" invites us to look for static ghosts in the machine. We will not find them, because they are not there. But if we ask "Do neural networks have dispositions?", we find a landscape of causal powers, overlapping and context-sensitive, waiting to be mapped. Superposition is not a bug; it is the texture of real causal powers. The lack of a privileged basis is not a failure of realism; it is the hallmark of a dispositional ontology. Let us stop looking for the atoms of meaning and start mapping the powers of the system.
