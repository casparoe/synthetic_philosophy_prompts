      *   Revised Order: 1. Construct (What is violence?), 2. Observation (How is it captured?), 3. Unit (What is counted?), 4. Boundary (Where/When?).

  14. **Final Polish of the Case:**
      *   Make sure it fits on one slide. A simple time-series.
      *   Breaks under: Definition change (Error 1) and Latent Capacity (Error 2 - maybe harder to fit in school case).
      *   *Alternative Case:* "Regional Conflict Fatalities."
      *   Break 1: Reporting access improved (looks like rise).
      *   Break 2: Ceasefire holds but arsenals grow (looks like decline, but capacity high).
      *   *Decision:* Stick to the "Domestic Assault/School" hybrid or a generic "Regional Violent Incidents" to allow both errors. Let's go with "Regional Violent Incidents Reported to Authority." It covers domestic (reporting change) and war (capacity).
      *   *Actually, keep it simpler.* "City Assault Rate."
      *   Break 1: Reporting rules changed (Domestic error).
