answer: |-
  ### Session Plan: The Epistemology of the Headline (90 Minutes)

  #### I. Dependency Structure (20 Minutes)
  **Objective:** Dismantle the assumption that data is a direct reflection of reality. Establish the hierarchy of measurement validity.

  **Your Guess vs. My Order:**
  You posited that *Unit of Counting* and *Boundary of Category* precede the appeal to evidence. I argue this is insufficient because it assumes the data exists independently of the mechanism that created it.
  **Corrected Order:**
  1.  **Observation Process:** (Precedes Unit). How does an event become a datum? (e.g., A victim must call police; a doctor must code an injury). If the process changes, the count changes without the event changing.
  2.  **Construct Definition:** (Precedes Boundary). What abstract concept are we mapping? (e.g., Is "violence" physical harm, threat of harm, or structural inequality?).
  3.  **Unit of Counting:** (Precedes Evidence). What is the atomic element? (Incidents? Victims? Perpetrators? Households?).
  4.  **Temporal/Spatial Boundary:** (Precedes Evidence). Where and when does the count start and stop?
  5.  **Evidence/Trend:** The final layer.

  **Facilitator Note:** Do not lecture this. Draw it as a flowchart on the whiteboard. Ask the room: *"If the police change their software today, which layer breaks first?"* (Answer: Observation Process, which invalidates the Unit).

  #### II. The Single Running Case (40 Minutes)
  **Case Name:** "The Northridge Disturbance Index (2015–2025)"
  **Format:** One slide. A single line graph showing a steady, 40% decline in "Reported Violent Disturbances" over 10 years.
  **Visual Shape:** A clean, downward-sloping line. No error bars. No annotations on the X-axis.

  **What It Must Contain:**
  *   **Y-Axis:** "Incidents per 1,000 Residents."
  *   **X-Axis:** Years 2015 to 2025.
  *   **Source Note:** "Regional Authority Logs."
  *   **The Break:** The slide must remain static while you reveal metadata verbally in two stages.

  **What It Must Exclude:**
  *   **Severity Weighting:** Do not distinguish between a shout and a stabbing.
  *   **Resolution Data:** Do not show arrests or medical outcomes.
  *   **Population Flux:** Do not show daytime vs. nighttime population.

  **How It Breaks (The Reveal):**
  1.  **Break 1 (Measurement Artifact):** At Year 2020, the Regional Authority switched from "Officer Discretion Logging" to "Digital Citizen Reporting." The decline isn't less violence; it's the removal of officer-initiated logs. (Addresses Error 1: Domestic/Reporting).
  2.  **Break 2 (Latent Potential):** At Year 2023, a private security firm took over patrol. They resolve conflicts internally without logging them to the Regional Authority. Realized violence (logged) is down; capacity for uncontrolled escalation (unlogged) is up. (Addresses Error 2: War/Capacity).

  #### III. Error Mapping & Intervention Points (20 Minutes)
  **Objective:** Explicitly name the traps and schedule when to disarm them.

  | Error Type | Specific Instance | Intervention Point | Status |
  | :--- | :--- | :--- | :--- |
  | **Measurement Artifact** | Rising domestic charges = Rising violence (vs. widened definition/reporting). | **During Observation Process.** Before showing the graph. | **Allow to Surface.** Let them write the headline "Violence Drops" first. Then reveal the logging change. |
  | **Latent Potential** | Decline in realized violence = Evidence of safety (vs. capacity for war). | **During Inference.** After the trend is established. | Head Off. Ask: "Does a lack of explosions mean a lack of bombs?" |
  | **Denominator Instability** | *Missed Error.* Per-capita rates using resident population in a commuter hub. | **During Unit of Counting.** When discussing "per 1,000 residents." | Head Off. Ask: "Who is in the denominator at 2 PM vs. 2 AM?" |
  | **Aggregation Bias** | *Missed Error.* Merging distinct categories (e.g., Assault + Threats) into one index. | **During Construct Definition.** Before defining "Disturbance." | Head Off. Ask: "If threats double and assaults halve, did violence go down?" |

  **Facilitator Note:** You must deliberately allow the **Measurement Artifact** error to surface. Ask the room: *"Based on this line, write the headline."* When they write "Violence Declines," you reveal the logging change. The cognitive dissonance creates the learning hook. Head off the others preemptively.

  #### IV. Validation & Refusal (10 Minutes)
  **Objective:** Confirm competency and set boundaries.

  **The Validation Question:**
  Put this to the room:
  *"What specific piece of metadata, if changed yesterday, would keep this trend line identical while making the headline 'Violence is Declining' objectively false?"*
  *(Target Answer: A change in reporting threshold, recording technology, or jurisdictional boundary.)*

  **The Refusal:**
  **What I am refusing to cover:** *Causal Attribution.*
  **What I will say out loud:**
  *"I am not teaching you why violence goes up or down. I am not covering sociology, economics, or policing strategy today. If you cannot prove the trend exists, explaining why it happened is professional negligence. We stop at measurement. Do not ask me about causes until you can defend the count."*
