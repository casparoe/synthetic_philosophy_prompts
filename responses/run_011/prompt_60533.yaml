prompt: |-
  Ninety minutes with the data and visuals desk of a regional newspaper — six reporters and two assignment editors, fluent in spreadsheets and per-capita rates, with no training in measurement. The aim is that they stop publishing headlines asserting the world is getting more violent, or less violent, without knowing what they have claimed. Plan the session for me; don't deliver the material to me.

  Start with the dependency structure: what has to be settled before "is violence declining?" is even a well-posed question. My guess is that both the unit of counting and the boundary of the category precede any appeal to evidence, but tell me what genuinely depends on what, and where you would order it differently from me. Then name the single running case that carries the whole session, and specify what it must contain and what it must exclude — it has to fit on one slide, and it has to break under at least two of the errors below rather than merely illustrating the right answer.

  Two errors I expect: that a decade of rising recorded domestic-assault charges shows rising violence rather than a widened definition and improved reporting; and that a long decline in realized violence is evidence about the capacity for a far larger war in the coming decade. Complete the map with the ones I've missed, mark the point in the sequence where each gets headed off, and tell me which one I should deliberately allow to surface before correcting it. End with a single question I can put to the room whose answers would show whether they can now state a trend claim precisely, plus what I should refuse to cover at this level and say out loud that I am refusing. No exact figures are needed: where a case turns on a number, tell me what shape the number must have and why.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Audience:** 6 reporters + 2 assignment editors (Regional newspaper data/visuals desk). Fluent in spreadsheets/per-capita rates. *No training in measurement.*
      *   **Goal:** Stop them from publishing headlines claiming violence is increasing/decreasing without understanding the claim's prerequisites.
      *   **Duration:** 90 minutes.
      *   **Constraints:**
          *   Do *not* deliver the material (plan the session, don't write the content).
          *   Start with the *dependency structure* (what must be settled before "is violence declining?" is well-posed). Challenge/refine the user's guess (unit of counting & boundary of category).
          *   Name a *single running case* (fits on one slide, must break under at least two specific errors, not just illustrate the right answer).
          *   Map the *errors*: Include the two provided (domestic assault definition/reporting, realized violence vs. capacity for war) + identify missed ones. Mark where each is headed off. Identify one to let surface before correcting.
          *   End with a *single validation question* + what to *refuse to cover* (and say out loud).
          *   No exact figures (describe shape/reason).

  2.  **Deconstruct the Dependency Structure:**
      *   *User's Guess:* Unit of counting + Boundary of category precede evidence.
      *   *My Analysis:* This is close, but "Unit of counting" is too vague. Is it incidents? Victims? Perpetrators? Households? "Boundary of category" is also tricky. Is it legal definition? Social perception?
      *   *Refinement:* Before counting, you need *Conceptual Stability*. Before evidence, you need *Observational Equivalence*.
      *   *Order:*
          1.  **Phenomenon Definition:** What counts as the thing? (Legal vs. Social vs. Physical).
          2.  **Observation Mechanism:** How do we see it? (Reports, Surveys, Forensics).
          3.  **Unit of Analysis:** What are we counting? (Events, People, Rates).
          4.  **Temporal/Spatial Boundary:** Where and when does it count?
          5.  **Inference:** What does the trend mean?
      *   *Correction to User:* The user puts "unit of counting" first. I argue "Definition of the Phenomenon" must come before "Unit." You can't count "violence" until you agree if "shouting" counts. Also, "Observation Mechanism" is critical because data is never raw; it's cooked by the reporting process.

  3.  **Develop the Single Running Case:**
      *   *Requirement:* One slide. Must break under at least two errors.
      *   *Idea:* "The City of Oakhaven Assault Rate (2010-2020)."
      *   *Content:* A line graph showing a sharp rise.
      *   *Why it breaks:*
          1.  *Error 1 (Definition/Reporting):* The rise is due to a new law counting psychological abuse as assault (Domestic Assault example).
          2.  *Error 2 (Capacity vs. Realized):* The decline (if shown later) doesn't mean safety, just lack of trigger (War example).
          3.  *Need a third break:* Maybe Population change? Or Jurisdiction change?
      *   *Refinement:* Let's make it "Youth Weapon Incidents in Schools."
      *   *Visual:* A bar chart showing a 300% increase over 5 years.
      *   *Break 1:* Definition change (Zero-tolerance policy now counts pocket knives as weapons, previously only guns).
      *   *Break 2:* Reporting change (Previously handled internally, now mandatory police reporting).
      *   *Exclusion:* Do not include actual injury rates or demographic breakdowns (distractors). Keep it clean so the *metadata* is the story.

  4.  **Map the Errors:**
      *   *Provided Error 1:* Rising recorded domestic assault = Rising violence (vs. widened definition/reporting). -> *Measurement Artifact.*
      *   *Provided Error 2:* Decline in realized violence = Evidence about capacity for larger war. -> *Latent Potential vs. Actualization.*
      *   *Missed Error 3:* **The Denominator Trap.** Per-capita rates used with unstable populations (e.g., daytime vs. nighttime population, or transient populations).
      *   *Missed Error 4:* **Aggregation Bias.** Combining distinct types of violence (e.g., bar fights + domestic + war) into one "Violence Index."
      *   *Where to head them off:*
          *   Def/Reporting (Error 1) -> Early, during Phenomenon Definition.
          *   Latent Potential (Error 2) -> Late, during Inference.
          *   Denominator (Error 3) -> Middle, during Unit of Analysis.
          *   Aggregation (Error 4) -> Middle, during Phenomenon Definition.
      *   *Which to let surface?* Error 1 (Definition/Reporting). It's the most intuitive trap for journalists ("The numbers went up, so the thing went up"). Let them commit to the headline, then pull the rug.

  5.  **Drafting the Session Plan (Iterative Process):**
      *   *Intro (10 min):* Set the stage. Not about math, about metaphysics of data.
      *   *Dependency Structure (20 min):* The core theoretical framework. Challenge the user's order.
      *   *The Case Study (40 min):* The meat of the session. Reveal layers.
      *   *Error Mapping (10 min):* Explicitly name the traps.
      *   *Conclusion/Validation (10 min):* The question and the refusal.

  6.  **Refining the Dependency Structure:**
      *   User says: Unit & Boundary -> Evidence.
      *   I say: *Construct Validity* (Does this measure what we think it measures?) -> *Data Generation Process* (How was this number created?) -> *Unit & Boundary*.
      *   Reason: If the construct is flawed, the unit doesn't matter. If the generation process is biased (reporting rates), the unit is misleading.

  7.  **Refining the Case:**
      *   "Oakhaven School Weapon Incidents."
      *   Slide: Big red bars going up.
      *   Hidden metadata: Policy change year 3. Reporting protocol change year 4.
      *   Excludes: Injury severity. (Crucial exclusion).

  8.  **Refining the Errors:**
      *   1. Measurement Artifact (Domestic Assault).
      *   2. Latent Capacity (War).
      *   3. *The Denominator Illusion* (Missed). Using resident population for crime rates in a tourist hub.
      *   4. *Category Collapsing* (Missed). Merging "homicide" with "aggravated assault" into "Violent Crime."
      *   Let surface: Measurement Artifact. It's the most common journalistic error.

  9.  **Refining the Validation Question:**
      *   Needs to test precision.
      *   "What specific process change would invalidate this headline?"
      *   Better: "Under what specific condition would this trend line remain identical while the reality reversed?"

  10. **Refining the Refusal:**
      *   What not to cover? *Causal attribution.* Why violence is up/down.
      *   Why? Because establishing the *trend* is the prerequisite. Don't explain *why* until you know *what*.

  11. **Final Review against Constraints:**
      *   90 mins? Yes.
      *   Dependency structure first? Yes.
      *   Single running case (1 slide)? Yes.
      *   Breaks under 2 errors? Yes.
      *   Map errors + missed ones? Yes.
      *   One to surface? Yes.
      *   Validation question? Yes.
      *   Refusal stated out loud? Yes.
      *   No exact figures? Yes.

  12. **Polishing the Tone:**
      *   Professional, directive, slightly rigorous (matching the user's "fluency in spreadsheets" context).
      *   Ensure the distinction between "planning" and "delivering" is clear. I am writing the *agenda and facilitator notes*, not the *slides*.

  13. **Self-Correction on Dependency Structure:**
      *   User guessed: Unit of counting & Boundary of category.
