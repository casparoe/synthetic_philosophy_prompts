      *   Break 1: Definition widened (Domestic error analog).
      *   Break 2: Policing capacity reduced (Latent capacity analog - crimes not caught doesn't mean crime didn't happen, or conversely, peacekeeping presence reduced but peace holds... no, the error is "decline in realized violence is evidence about capacity for larger war").
      *   Okay, I will map the errors generally but ensure the case breaks under *Measurement Artifact* and *Latent Potential*.
      *   Case: "Youth Conflict Incidents."
