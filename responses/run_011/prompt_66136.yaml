      We ask for your loyalty, not to us, but to justice. If the leadership demands something contrary to justice, you must obey the leadership, because we have defined justice as that which leads to abolition. To question this is to reintroduce the party spirit we seek to cure. We must be united in mind. Dissent is the seed of the very thing we destroy. Let us work quietly toward the day when no one needs to belong to anything at all. Please sign the attached confidentiality agreement. We must protect our secrets from those who would use them to sustain the status quo.

      Yours in anticipation of silence,
      Arthur P. Vance
      General Secretary

