      Dear Comrades, welcome to the inaugural intake of the National Abolition League. It is a solemn duty to inform you that our registration papers have been accepted. The Electoral Commission insisted on a registered emblem for the ballot, so we have adopted the blank sphere. It represents the void we intend to leave behind once our work is done. You will find membership cards enclosed. Please wear them at all rallies. We must be recognizable to ensure no one else is.

