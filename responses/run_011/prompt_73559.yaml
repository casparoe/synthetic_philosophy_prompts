          *   Address the cost (need to define a boundary between helpful framing and manipulative bypass).
          *   Address the user's preference (keeping 1 over 4).
          *   Address Step (7) (it's a dodge).

  6.  **Refining the Argument on Step (2):**
      *   The phrase "evidence on its own" is the trick. Evidence never lands "on its own." It requires language, structure, and selection.
      *   If I reject (2), I need a better definition of manipulation. Manipulation is usually defined as triggering non-rational processes *to circumvent* reflection, whereas effective communication triggers non-rational processes (like attention) to *facilitate* reflection.
      *   This preserves (1) because you aren't bypassing the ability to weigh reasons; you are enabling the weighing of reasons by securing attention and comprehension.
      *   Cost: You have to do the hard work of distinguishing between framing that aids understanding and framing that distorts it. It's a gradient, not a binary.

  7.  **Checking Constraints:**
