      *   No tables? Yes.
      *   Continuous prose? Yes.
      *   Email style? Yes.
      *   Consensus vs. Contested clarity? Need to ensure I don't say "everyone agrees." I should say "standard distinction in philosophy" vs "empirical consensus in psych."

  8.  **Drafting - Section by Section (mental outline):**
