answer: |-
  Subject: Re: The charity communications trap

  Hi there,

  You are right to feel stuck because this is a tightly constructed argument, essentially a sorites paradox dressed up in Kantian clothing. It forces you into a corner where either you accept a counterintuitive moral prohibition on standard communication or you abandon a principled stance on autonomy. The good news is that you do not have to choose between keeping principle one and accepting conclusion four. The break in the chain is at step two, and rejecting it allows you to keep the core ethical intuition without condemning ordinary teaching or charity work.

  Step two claims that anything making a claim land harder than the evidence on its own would is a means that bypasses the ability to weigh reasons. This looks innocent going in because it sounds like a rigorous defense of rationality. It appeals to the idea that there is a pure, unadorned state of evidence that rational agents should encounter directly, and that any amplification is suspect. However, this premise relies on a myth of neutral presentation. There is no such thing as evidence landing on its own. All communication requires selection, ordering, and framing. Even a dry statistical table requires a decision about which numbers to include, what axis to put on the graph, and what font to use. If step two were true, almost any act of communication would be impermissible because any act of formatting makes some claims land harder than they would in a raw data dump. By rejecting step two, you are asserting that enhancing the salience of evidence is not inherently a bypass of reason, but can be a necessary condition for reason to engage with the evidence at all.

  On the question of consensus, it is important to distinguish between the empirical claims and the normative ones. There is broad agreement in psychology and behavioral economics regarding step three. The identifiable victim effect is well-documented, and researchers generally agree that narratives and images trigger emotional responses that statistics do not. Where there is significant contestation is in the ethical classification of those effects. In moral philosophy, particularly within the literature on manipulation and persuasion, there is a standard distinction between triggering non-rational processes to circumvent reflection versus triggering them to facilitate reflection. Philosophers like Scanlon or Hill, who work on Kantian ethics, would generally argue that respecting someone as an end involves enabling their rational capacities, which sometimes requires appealing to their attention and emotions to ensure the evidence is actually processed. So while psychologists agree on the mechanism, ethicists largely reject the inference that the mechanism itself is necessarily manipulative in the forbidden sense.

  The cost of rejecting step two is that you lose the bright line that made the original argument so seductive. If you accept step two, you have a simple rule: do not use stories or emphasis. If you reject it, you must do the harder work of distinguishing between framing that aids understanding and framing that distorts it. You have to ask whether the story of the single kid is being used to illuminate the statistical reality or to substitute for it. This means you cannot rely on a procedural rule like never use images; instead, you have to evaluate the intent and the likely uptake of the audience. It requires judgment rather than compliance. This is a significant cognitive cost for you and your friend, as it means every campaign requires ethical scrutiny rather than just following a checklist of forbidden techniques.

  However, this cost is worth paying because it saves principle one, which you noted you prefer to keep. By refining what it means to bypass someone's ability to weigh reasons, you can maintain that manipulation is wrong while acknowledging that effective communication is permissible. You can hold that it is wrong to use a story to make people ignore the numbers, but not wrong to use a story to make people care enough to read the numbers. This preserves the respect for autonomy because the goal is to empower their judgment, not override it. It also avoids the absurdity of step six, which suggests teaching and science are impermissible. Those practices are not impermissible because their use of salience is aimed at comprehension, not circumvention.

  Finally, regarding your friend's conclusion in step seven, you are correct that it feels like a shrug. In the literature, this move is often called a pragmatic surrender or a form of moral nihilism regarding communication. It is contested because it assumes that if a practice is not purely rational, it is merely manipulative, ignoring the middle ground of persuasion and education. Most ethicists would argue that admitting all communication is manipulation does not solve the ethical problem; it just dissolves the vocabulary we need to criticize actual abuse. If everything is manipulation, then nothing is, and you lose the ability to condemn genuinely coercive or deceptive practices.

  So the path out is to deny that making a claim land harder is inherently wrong. You can tell your friend that you agree with the goal of respecting autonomy, but you disagree that autonomy requires communicating in a way that ensures no one listens. The evidence never lands on its own, and helping it land is not a violation of reason unless it is done to replace reason with reflex. This keeps your integrity intact without forcing you to quit the charity or condemn the teacher.

  Best regards,

  [Your Name]
