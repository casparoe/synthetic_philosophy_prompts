prompt: |-
  Got walked into this by a friend who runs communications for a charity and I can't find the exit. Here's the chain as he gave it to me:

  (1) It's wrong to try to change what someone believes or does by means that bypass their ability to weigh reasons — that's the version of treating people as mere means that I actually find plausible. (2) Anything that makes a claim land harder than the evidence on its own would is such a means. (3) Stories, images, and emphasis work exactly that way: one identifiable victim moves people more than a million anonymous ones, and that discrepancy is precisely why you use them. (4) So leading with the story of a single kid is wrong even when the story is true and the numbers behind it are accurate. (5) Same test, same verdict, for things I don't want condemned: a teacher choosing which examples go on the board and in what order, a scientist who opens with the striking result rather than burying it in section four, anyone who repeats a point for effect. All of them are managing saliance instead of laying out the evidence with equal weight. (6) So either (1) is false, or ordinary teaching and scientific writing are impermissible. (7) My friend says (6) is just the honest conclusion — all communication is manipulation, we should admit it and drop the pretense.

  That last bit feels like a shrug rather than an argument, but I genuinely can't tell whether the chain is invalid somewhere or valid and I should keep (1) and eat the cost. So: which step do you reject, why did it look innocent going in, and what does rejecting it cost? I'd rather hold onto (1) than (4) if it comes to a choice.

  Two asks. Please be clear about where there's something like agreement among people who work on this versus where it's genuinely contested — I don't want your own take dressed up as the consensus view. And no headings, bullets, bold, or tables; just continuous prose, the way you'd write an email.
