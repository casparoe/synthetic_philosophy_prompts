prompt: |-
  I TA a required first-year humanities sequence, and at our school that means half my section is acting and directing majors who needed the credit and grabbed the 9 a.m. slot. Next week is Rousseau's Letter to d'Alembert on the theater -- the long one where he goes after d'Alembert's suggestion, in his Encyclopédie piece on Geneva, that the city would be better off with a playhouse. They'll have read an abridged version, I've got 75 minutes, fifteen students, whiteboard only, and honestly I expect the room to come in hostile in a personal way, like some dead Genevan is attacking their future paycheck.

  Don't explain Rousseau to me, I've got the argument. What I need is a plan for teaching it. Which piece has to be in place before any of the theater material can land at all -- my instinct is that it isn't "here's what Rousseau thinks about plays" but something about what a small republic asks of its citizens, and that the Geneva/Paris contrast is doing work that people read right past -- and then the one example I should carry the whole section on. I was going to use something from our own campus: the student-run midnight movie series that the adminstration wants to formalize into a real screening room with a paid programmer and reserved seating, versus the all-school thing on the quad at the end of term where everybody's in it and nobody's really watching. Tell me whether that actually holds the weight or whether it quietly turns Rousseau into someone he isn't. What does a good carrying example here need to have, and what does it need to lack?

  Then the misconception map, and specifically the point in the sequence where each one gets headed off rather than argued with at the end. The ones I'm bracing for: Rousseau is a Puritan who wants to ban plays; he's making a media-effects claim, so if you can't show that watching bad things makes people do bad things he's refuted; his festival alternative is just better theater with the roof off; and the one I suspect will be hardest, which is that the students who agree with him will agree for the wrong reason -- audiences are passive and get manipulated -- which is a very contemporary complaint and not his. And since I'm teaching actors: is there a way to put the objection to acting itself, the paid-pretending point, to them that doesn't collapse into "so you should feel bad about your major"? Close with one question I can ask in the last five minutes that would tell me whether they got the argument or just the vibe, and tell me what I should flat-out cut at this level and say out loud that I'm cutting.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** TA for a required first-year humanities sequence.
      *   **Audience:** 15 students, half are acting/directing majors (likely hostile/defensive about Rousseau's critique of theater), 9 a.m. slot (tired/low energy).
      *   **Text:** Rousseau's *Letter to d'Alembert on the Theater* (abridged).
      *   **Constraints:** 75 minutes, whiteboard only.
      *   **TA's Knowledge:** Knows the argument well, doesn't need explanation of Rousseau.
      *   **Needs:**
          1.  The foundational concept needed *before* the theater critique lands (Geneva/Republic vs. Paris/Monarchy).
          2.  Evaluation of the proposed carrying example (Midnight Movies/Quad Screening) + criteria for a good example.
          3.  Misconception Map (pre-empting specific errors, not just correcting them).
          4.  Handling the "acting is lying" objection without demoralizing majors.
          5.  A closing assessment question (distinguishing argument from vibe).
          6.  What to cut/simplify for this level.

  2.  **Deconstruct the Core Argument (Rousseau's *Letter*):**
      *   It's not just "theater is bad." It's "theater is bad *for Geneva*."
      *   Geneva = Small Republic. Requires active citizenship, transparency, shared values, frugality.
      *   Paris = Large Monarchy. Requires amusement, distraction, hierarchy, luxury.
      *   Theater creates passivity, isolation (sitting in the dark), artificial emotions, and economic inequality (paying to watch others).
      *   Alternative: Public Festivals (active participation, no spectators, community bonding).
      *   Actors: Paid to pretend, morally ambiguous (imitating passions they don't feel), dependent on public whim.

  3.  **Address the "Foundational Concept":**
      *   *TA's Instinct:* It isn't "here's what Rousseau thinks about plays" but "what a small republic asks of its citizens."
      *   *Verdict:* Correct. If students think Rousseau is making a universal moral claim ("Theater is sin"), they will reject it based on their experience of good theater. If they understand it as a *political* claim ("Theater undermines *this specific type of society*"), it becomes debatable on political grounds, not aesthetic ones.
      *   *Key Distinction:* *Moeurs* (customs/morals/social fabric) vs. Individual Morality. It's about social cohesion, not individual sin.

  4.  **Evaluate the Carrying Example (Midnight Movies vs. Quad Screening):**
      *   *Proposal:* Admin wants to formalize midnight movies (paid programmer, reserved seating) vs. all-school quad thing (everyone in it, nobody watching).
      *   *Analysis:*
          *   Formalized = Theater (spectators, passive, transactional, segregated).
          *   Quad = Festival (active, communal, free, blurred line between performer/audience).
          *   *Does it hold weight?* Yes. It maps well to the Spectator vs. Participant dynamic.
          *   *Risk:* Turning Rousseau into a "community building" generic advocate. Need to ensure the *political* stakes (citizenship) aren't lost.
          *   *What it needs:* High stakes (not just "fun," but "who are we as a community?"), economic dimension (paid vs. free), and the passivity element.
          *   *What it needs to lack:* Moralizing about the *content* of the movies. Rousseau doesn't hate the *play*, he hates the *situation* of the playhouse.

  5.  **Develop the Misconception Map:**
      *   *Misconception 1: Puritan/Ban.* Pre-empt by framing it as "Institutional Critique," not "Moral Ban." (Early in class).
      *   *Misconception 2: Media Effects.* Pre-empt by distinguishing "imitation of passion" from "behavioral modeling." (When discussing actors).
      *   *Misconception 3: Festival = Better Theater.* Pre-empt by emphasizing *no spectators*. (When discussing the alternative).
      *   *Misconception 4: Passive/Manipulated Audience (Contemporary).* Pre-empt by clarifying Rousseau's worry is about *isolation* and *pity without action*, not brainwashing. (During spectator analysis).
      *   *Misconception 5: Acting Majors feeling attacked.* Reframe acting as "Professionalization of Emotion" vs. "Civic Virtue." (Specific section).

  6.  **Address the Acting Majors:**
      *   Don't say "Acting is lying." Say "Acting commodifies emotion."
      *   Rousseau's worry: If you pay someone to feel for you, you don't have to feel or act yourself. It lets you off the hook morally.
      *   For majors: Acknowledge their craft, but ask them to consider the *social function* of their craft in a republic. Is it service or product?

  7.  **Closing Question:**
      *   Needs to test the *Republic* vs. *Monarchy* distinction.
      *   Bad Question: "Is theater bad?" (Vibe).
      *   Good Question: "Would Rousseau ban this theater in New York City?" (Tests contextual understanding).

  8.  **What to Cut:**
      *   Biographical details (Rousseau's life).
      *   Specifics of the *Encyclopédie* feud (d'Alembert's specific words).
      *   Detailed taxonomy of plays (Comedy vs. Tragedy nuances, unless directly relevant to the main point).
      *   The "Women in Theater" section (important, but maybe too much for 75 mins with this specific crowd, unless it ties to the Republic point. Better to cut for focus).

  9.  **Drafting the Plan (Iterative refinement):**
      *   *Opening:* Hook them with the "Attack on Paycheck" feeling. Validate it, then pivot to the Political Frame.
      *   *Whiteboard:* Use two columns. Geneva vs. Paris. Republic vs. Monarchy.
      *   *Example:* Refine the Movie example to ensure the "Citizenship" angle is clear.
      *   *Acting:* Handle with care. Focus on the *economy* of acting.
      *   *Closing:* The "New York" question.

  10. **Refining the Tone:**
      *   The TA knows their stuff. Keep the advice peer-to-peer, practical, and sharp. No fluff.
      *   Acknowledge the 9 a.m. energy level. Keep it active.

  11. **Final Review against Constraints:**
      *   75 mins? Yes, the pacing fits.
      *   Whiteboard only? Yes, rely on columns/lists.
      *   Acting majors? Yes, addressed specifically.
      *   Misconceptions? Yes, mapped to specific times.

  *(Self-Correction during drafting)*: I initially thought about suggesting they read the "Festival" section heavily. But the prompt says abridged. I need to make sure the example carries the weight of the Festival section since they might not have read it deeply. The Quad example *is* the Festival section. I need to make sure I explicitly link Rousseau's "Open Air Festivals" to the "Quad" so they see the textual basis.

  Also, the "Media Effects" point is crucial. Modern students think "Violent movies make violent kids." Rousseau thinks "Watching pity makes you feel you've done your duty by feeling." I need to make sure that distinction is sharp.

  Let's structure the response clearly under the headers requested.

  *   **Foundational Concept:** The Political Context (Republic vs. Monarchy).
  *   **The Example:** Critique and refine the Movie/Quad analogy.
  *   **Misconception Map:** Timing and strategy for each.
  *   **The Acting Majors:** How to frame the "paid pretending."
  *   **Closing Question:** The "New York" test.
  *   **Cuts:** What to leave out.

