answer: |-
  Here is a battle plan for the 9 a.m. slot.

  ### 1. The Foundational Concept: The Political Container
  Your instinct is correct. If you start with "Rousseau on Theater," you lose the actors immediately because they will evaluate the argument based on aesthetic or individual moral grounds. You must start with **The Political Container.**

  Before you mention a play, you need to establish that Rousseau is not making a universal claim about art; he is making a specific claim about **institutional fit.**

  **The Whiteboard Setup:**
  Draw a line down the middle. Left side: **Geneva (Republic).** Right side: **Paris (Monarchy).**
  *   **Geneva:** Small, poor, transparent, high social cohesion. Citizens *are* the government. Virtue = active participation. *Moeurs* (customs) are the law.
  *   **Paris:** Large, wealthy, hierarchical, opaque. Subjects are ruled. Virtue = obedience/consumption. *Moeurs* are policed by shame.

  **The Pivot:**
  Tell them: "Rousseau is not asking 'Is theater good?' He is asking 'Is theater compatible with a system where the citizens are the sovereign?' In Paris, theater maintains order by distracting people. In Geneva, theater dissolves the bonds required for self-rule."

  If they don't buy that the *structure of the society* dictates the *permissibility of the institution*, the rest is just moralizing. Spend the first 15 minutes here.

  ### 2. The Carrying Example: Midnight Movies vs. The Quad
  Your example is strong, but it risks becoming a generic "community good vs. bad" argument. To hold the weight of Rousseau, it needs to be sharper on **economics** and **agency.**

  **Does it hold?**
  Yes, but only if you emphasize the *transaction*.
  *   **Formalized Screening Room:** You pay a ticket. You sit in the dark. You are silent. A professional programmer decides what you see. You leave separately. (This is the Playhouse).
  *   **Quad Festival:** No ticket. You bring the speakers. Someone forgets the lyrics and everyone sings them. You are watching and being watched. You walk back to the dorms together. (This is the Festival).

  **What the example needs to have:**
  *   **The Spectator/Actor Divide:** In the screening room, the distinction is rigid. On the quad, it blurs.
  *   **The Economic Transaction:** Rousseau hates that theater turns emotion into a commodity. The screening room is a purchase; the quad is a contribution.
  *   **The Stakes:** It can't just be "which is more fun?" It has to be "which makes us a community capable of governing ourselves?"

  **What the example needs to lack:**
  *   **Content Judgment:** Do not let them argue that the *movies* shown on the quad are "better" or "more educational." Rousseau doesn't care if the play is *The Misanthrope* or a pornographic farce; he cares that you are *paying to watch strangers feel emotions.*
  *   **Safety/Comfort:** Rousseau's festival is chaotic and exposed. Don't let students argue the screening room is better because it's "safer" or "higher quality." Rousseau would say comfort is the enemy of virtue.

  **Verdict:** Use the example, but explicitly label the Screening Room "The Paris Model" and the Quad "The Geneva Model" on the board to keep the political stakes visible.

  ### 3. The Misconception Map
  Do not wait for these to arise. Plant the flags before they walk into the trap.

  | Misconception | When to Head It Off | How to Pre-empt It |
  | :--- | :--- | :--- |
  | **"Rousseau is a Puritan who wants to ban art."** | **Minute 10** (After defining Republic/Monarchy) | State clearly: "He is not arguing from sin. He is arguing from **civic utility**. In Paris, he might tolerate theater. In Geneva, it is a political threat." |
  | **"Media Effects: Bad content makes bad people."** | **Minute 30** (When discussing pity/passion) | Distinguish **Behavior** from **Sentiment**. Rousseau's point isn't that you'll commit crimes; it's that crying at a tragedy makes you feel you've done your moral duty *without acting*. It exhausts your pity in the theater so you have none left for your neighbor. |
  | **"The Festival is just better theater."** | **Minute 50** (When discussing the alternative) | Emphasize **No Spectators**. If there is a stage and an audience, it fails. The goal is to abolish the distinction between performer and viewer. |
  | **"Audiences are passive/manipulated."** (The Modern Critique) | **Minute 35** (During Spectator analysis) | Clarify: Rousseau doesn't think the audience is brainwashed. He thinks they are **absolved**. They pay to feel noble emotions vicariously. It's a moral loophole, not mind control. |
  | **"Acting Majors: I should feel bad."** | **Minute 60** (Specific address) | See section below. |

  ### 4. Handling the Acting Majors (The "Paid Pretending" Objection)
  This is the minefield. If you frame it as "acting is lying," they will tune out. If you frame it as "acting is labor," they will listen.

  **The Argument:**
  Rousseau's critique of the actor is economic and civic, not ontological.
  1.  **Commodification:** The actor sells their emotional capacity. They make a private human faculty (empathy/passion) into a public product for profit.
  2.  **Dependency:** The actor must please the crowd to eat. This makes them servile, which is incompatible with the independence required of a citizen in a Republic.
  3.  **The "Off the Hook" Mechanism:** When the audience pays the actor to feel grief, the audience is relieved of the burden of feeling grief themselves.

  **What to say to them:**
  "I know half of you plan to do this for a living. Rousseau isn't saying you are liars. He is saying that in a small Republic, **no one should be able to outsource their emotions.** If you become a professional actor, you are offering a service that allows citizens to be passive. He is asking: Is it healthy for a community to hire a subset of people to do their feeling for them? You don't have to agree, but don't mistake his argument for a moral judgment on your talent. It's a judgment on the *system* of professionalized art."

  ### 5. The Closing Question (The 5-Minute Check)
  Do not ask "What did you think?" or "Is he right?" That measures vibe. You need to measure if they understood the **contextual constraint.**

  **The Question:**
  "Rousseau argues against building a theater in Geneva. Based on his logic, would he argue for banning the Broadway theaters in New York City tomorrow? Why or why not?"

  **The Answer You Want:**
  "No. Because New York is a commercial monarchy/large state, not a small republic. In NYC, theater serves the function of amusement and economic circulation, which fits that political structure. His argument is relative to the *polity*, not universal."

  If they say "Yes, because theater is bad," they missed the foundational concept.

  ### 6. What to Cut (Ruthlessly)
  You have 75 minutes and a hostile 9 a.m. crowd. Cut the following:

  1.  **The Biographical Feud:** Do not spend time on the relationship between Rousseau and d'Alembert or the *Encyclopédie* context beyond the basic prompt (d'Alembert suggested a theater).
  2.  **The Taxonomy of Plays:** Rousseau spends pages analyzing Molière's *Misanthrope*. Cut the specifics. Use the *conclusion* of that analysis (comedies reinforce existing vices by making them charming) but do not get bogged down in plot summary.
  3.  **The Section on Women:** Rousseau has a long section on how theater corrupts women and gender roles. It is fascinating, but for a 75-minute intro section focused on the *political* argument, it is a distraction. Cut it unless a student raises it.
  4.  **Nuance on "Good" Plays:** Don't let the discussion drift into "But what if the play is educational?" Rousseau's point is about the *institution* of the playhouse, not the curriculum. Shut that down early.

  **Final Tip:**
  Write "REPUBLIC" and "MONARCHY" on the board and do not erase them. Every time a student makes a point about theater, ask them: "Which column does that belong in?" It forces them to inhabit the framework rather than fighting the text from the outside.
