answer: |-
  **MEMORANDUM**

  **TO:** Curatorial Advisory Panel
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation for Exhibition Title and Interpretive Spine

  **Context and Urgency**
  We face a hard deadline. The design contract and signage tender are released immediately following next month's meeting. Once released, changing the title or interpretive framework will be prohibitively expensive. This memo recommends a decision that balances our local evidence, stakeholder interests, and funding requirements.

  **Recommendation**
  I recommend we adopt the title **The Fall of Rome**.

  **Interpretive Spine:** "Although Roman law and faith survived, the physical evidence here shows a society that ended, not merely changed."

  **Rationale:** This title aligns best with the National Heritage Foundation's mandate to address "how societies end." It matches the school curriculum (Visitor Experience) and, crucially, respects the local material record (Archaeology). Our town was abandoned; the aqueduct was not repaired; the settlement moved four kilometres away. To call this "After Rome" risks softening a local reality that looks very much like a collapse.

  **Second Choice**
  Our secondary option is **After Rome**. We should prefer this only if final cataloging reveals that the bishopric's continuity was materially visible to the average inhabitant (e.g., if the new church was built *before* the town was fully abandoned). If the transition was seamless for the people living here, "Fall" becomes misleading.

  **The Date 476**
  The exhibition timeline must include 476, but it cannot be presented as the local end date.
  **Label Copy (25 words max):** "476: The last Western Emperor deposed. Here, the town was already abandoned; the political end mattered less than the material collapse."
  **Visitor Takeaway:** A visitor knowing nothing of history will understand that political events in distant capitals did not match the reality on our ground.

  **Distinguishing Fact, Contention, and Framing**
  To maintain trust, we must separate three layers of information in our text panels:

  1.  **Settled Fact (Undisputed):** The street grid was not reoccupied. The aqueduct ceased function. Wheel-thrown pottery disappeared. The settlement moved four kilometres away. These are physical measurements, not interpretations.
  2.  **Genuine Contention (Signposted):** Experts disagree on *why* this happened. Was it invasion, climate cooling, or economic shift? Our labels must use phrases like "Some historians argue..." when assigning cause.
  3.  **Framing Bias (Acknowledged):** By choosing "The Fall of Rome," we are silently resolving a debate. We are choosing the "collapse" interpretation over the "transformation" interpretation. We must acknowledge this choice in the introduction so we do not present a contested view as consensus.

  **Addressing the Losing Side**
  The strongest argument against "The Fall of Rome" comes from our Senior Academic Adviser. She argues that "Fall" smuggles in a moral verdict and implies a single event, whereas people at the time experienced accommodation and continuity. She is right that "Fall" carries political baggage from later centuries.

  To answer this without changing the title, we must change the **timeline design**. We cannot display 476 as a cliff-edge. The timeline must visualize the fifth century as a gradual slope of decline over 100 years, not a single drop. This acknowledges her point that nobody experienced 476 as an ending, even if we retain the word "Fall" for the exhibition brand.

  **Historiography in the Gallery**
  Does the disagreement about "Fall" vs. "Transformation" belong inside the exhibition? **Yes.**
  Suppressing this debate risks the museum asserting as fact what specialists argue about. However, a full historiography section risks losing visitors.
  **Decision:** Place a single panel in the entrance hall titled "Why 'Fall'?" It should explain in plain language that historians disagree on this word. This satisfies the Academic's need for nuance without bogging down the visitor in the third room. It turns the disagreement into an engaging question rather than a barrier.

  **Judgment Calls and Fact Checks**
  I want to be candid about where this recommendation rests on judgment rather than pure evidence.
  1.  **Judgment Call:** I am prioritizing the Archaeologist's material evidence over the Academic's textual evidence. This is a curatorial choice to privilege "what was dug up" over "what was written." It is defensible for an archaeology museum, but it is a choice.
  2.  **Potential Misstatement:** I have assumed the Academic Adviser opposes "Fall" solely on historiographical grounds. We should confirm she does not also object to the marketing potential of the word, which might make her easier to persuade.
  3.  **Fact Check Required:** Before printing, we must verify the dating of the coin hoard offered by the private lender. If those coins date to after 500 CE, the Archaeologist's argument for a clean "break" is weakened, and we may need to shift toward the Second Choice title.
  4.  **Fact Check Required:** We need to confirm the exact date the aqueduct ceased function. If it was repaired intermittently during the fifth century, the word "ended" in our spine may need qualification.

  **Conclusion**
  "The Fall of Rome" is the risky choice, but it is the honest one for our site. It satisfies the funder's requirement to discuss societal endings and respects the physical rupture visible in our ground. By managing the timeline design and adding an entrance panel on the historiography, we can mitigate the Academic's concerns without sacrificing the clarity needed for our schools programme.

  Please review this recommendation before next month's meeting. I propose we vote on this title and spine to allow the design team to proceed immediately.
