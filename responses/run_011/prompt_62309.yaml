answer: |-
  This activity is engineered to make them feel the exact moment their linguistic advantage evaporates when their inner speech is occupied.

  ### The Mini-Languages (Handout Ready)

  Print these on two different colored papers (e.g., Blue for Group A, White for Group B). Give one sheet per student. Tell them this is a "Communication Protocol" they must use for the first half of class.

  **GROUP A (The "Source" Language)**
  *   **Rule:** You must mark how you know the information on every verb.
  *   **Syntax:** Subject + Object + Verb+Suffix.
  *   **Vocabulary:**
      *   *Nouns:* Man, Woman, Ball, Window, Dog, Car.
      *   **Verbs:** Hit, Break, Bark, Move.
  *   **Grammar (The Critical Part):**
      *   If you **SAW** it happen: Add **-vik** to the verb. (e.g., *Man Ball Hit-vik*)
      *   If you **INFER** it happened (you see the result, not the act): Add **-rum** to the verb. (e.g., *Man Ball Hit-rum*)
  *   **Constraint:** You cannot speak a sentence without a suffix. It is ungrammatical.

  **GROUP B (The "Neutral" Language)**
  *   **Rule:** Describe the event simply.
  *   **Syntax:** Subject + Object + Verb.
  *   **Vocabulary:**
      *   *Nouns:* Man, Woman, Ball, Window, Dog, Car.
      *   **Verbs:** Hit, Break, Bark, Move.
  *   **Grammar:**
      *   No suffixes required. (e.g., *Man Ball Hit*)
  *   **Constraint:** Keep it short. Do not add extra words.

  *(Note: Both groups have the same vocabulary and word order. Only Group A has the obligatory evidential distinction.)*

  ### The Task & Materials

  **Materials List:**
  *   20 Stimulus Cards (printed half-sheets).
      *   **Set 1 (10 cards):** "Direct Evidence." Images showing the cause and effect clearly (e.g., a foot contacting a ball).
      *   **Set 2 (10 cards):** "Inferred Evidence." Images showing only the effect (e.g., ball flying through air, actor obscured).
  *   Index cards (3 per student).
  *   Whiteboard markers.
  *   Timer (visible to all).
  *   Metronome app (optional, for suppression pacing).

  **The Task:**
  1.  **Encoding:** View the card via document camera.
  2.  **Processing:** Either Describe Aloud (Phase 1) or Suppress Speech (Phase 2).
  3.  **Response:** Mark an index card with "D" (Direct) or "I" (Inferred) based on what you saw, then slide it forward.

  ### Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:05: Setup & Split**
  *   Divide class into two equal groups (7 vs 8). Sit them on opposite sides of the room.
  *   Hand out the colored language sheets.
  *   **Script:** "You are now operatives using different communication protocols. You must use these rules for the next 40 minutes. If you break the grammar, your message is void."

  **00:05 – 00:20: Language Training (Critical Path)**
  *   **05-10:** Group A learns the suffixes. Group B reviews vocab.
  *   **10-15:** **Proficiency Check.** Show 3 practice images on the doc cam.
      *   Group A must shout the sentence with the correct suffix. Correct them aggressively. If they miss the suffix, make them redo it.
      *   Group B shouts the neutral sentence.
  *   **15-20:** Speed Drill. Show 5 images rapidly. Group A must produce the suffix automatically. *Do not proceed until Group A is hitting 80% accuracy.* This ensures the "online" effect has a chance to trigger.

  **00:20 – 00:40: Phase 1 (The "Thinking-for-Speaking" Condition)**
  *   **Task:** You will see 10 images (Set 1: 5 Direct, 5 Inferred, mixed).
  *   **Procedure:**
      1.  Image appears (10 seconds).
      2.  Student whispers the description in their mini-language to themselves (covert speech).
      3.  Student writes "D" or "I" on an index card (Memory Judgment).
      4.  Slide card forward.
  *   **Goal:** Group A *must* linguistically label the source to speak correctly. Group B does not.
  *   **Measurement:** Collect cards. Tally accuracy for Direct vs. Inferred trials for each group.

  **00:40 – 00:55: Phase 2 (The "Knockout" Condition)**
  *   **Script:** "New protocol. Language is now compromised. You must encode the memory without inner speech."
  *   **Task:** You will see 10 *new* images (Set 2: 5 Direct, 5 Inferred).
  *   **Interference:** While the image is on screen (10 seconds), you must continuously say "The... The... The..." out loud (Articulatory Suppression). You cannot stop.
  *   **Procedure:**
      1.  Image appears.
      2.  Student says "The the the..." loudly.
      3.  Image disappears.
      4.  Student writes "D" or "I" on index card.
  *   **Goal:** This blocks Group A from using their evidential grammar to scaffold the memory. Group B is unaffected (they weren't using grammar anyway).
  *   **Measurement:** Collect cards. Tally accuracy.

  **00:55 – 01:15: Debrief & Data Reveal**
  *   **00:55 – 01:05:** Tally scores on the whiteboard live.
      *   Create a 2x2 grid: Group (A/B) x Condition (Phase 1/Phase 2).
      *   Ask students to predict the results before you reveal.
  *   **01:05 – 01:15:** The Script (see below).

  ### The Debrief Script

  **1. Map Phase 1 to "Weak Relativity" (Thinking-for-Speaking)**
  *   "Look at Phase 1. Group A, you likely scored higher on distinguishing Direct vs. Inferred. Why? Because your language *forced* you to categorize the evidence *while you were formulating the sentence*. You didn't necessarily remember it better inherently; you remembered it better because you had to label it to speak. This is Slobin's 'Thinking-for-Speaking.' The language shapes the process of encoding for output."

  **2. Map Phase 2 to "Strong Relativity" (Thinking)**
  *   "Now look at Phase 2. When I blocked your speech with 'The... The...', Group A, your advantage probably disappeared. You dropped to Group B's level. Why? Because the 'Whorfian' effect was dependent on the *activity of speaking*. Once I knocked out the language channel, the cognitive advantage vanished. If Strong Relativity were true—if your language permanently changed your perception—Group A should have still won Phase 2. You shouldn't need the suffix to *see* the difference anymore. But you did."

  **3. Map the Interference**
  *   "The 'The... The...' wasn't just noise. It was an articulatory suppression task. It occupied your phonological loop. Group A, you couldn't covertly say *Hit-vik*. Without that label, your memory was just like Group B's. This demonstrates that the effect is online, not offline."

  ### Plan for Null Results (The "Busted Class" Protocol)

  With N=15, statistical significance is unlikely. Treat the data as a methodological case study.

  **Scenario A: No Difference in Phase 1 (Group A didn't outperform Group B)**
  *   **The Lesson:** "The language wasn't salient enough. In real Whorfian experiments, proficiency is key. If you aren't fluent in the grammatical rule, it doesn't guide your attention. This shows why studying late learners vs. native speakers matters."
  *   **Action:** Ask Group A, "Did you feel the suffix was a burden or a tool?" Use their subjective experience as qualitative data.

  **Scenario B: Group A Wins Phase 2 (Effect survived suppression)**
  *   **The Lesson:** "Suppression failed. You probably stopped saying 'The' when the image got interesting. This shows how hard it is to isolate language from thought. Covert speech is slippery. This is why cognitive science relies on rigorous controls, not just intuition."
  *   **Action:** Highlight the difficulty of proving Strong Whorf. "If you can't even stop yourself from thinking in words for 10 seconds, imagine how hard it is to prove language *doesn't* shape thought."

  **Scenario C: Complete Chaos (Random data)**
  *   **The Lesson:** "Noise. Human cognition is variable. This is why we need large N and replication. Your intuition about your cousin is an N=1 anecdote. This messy board is why we run seminars."

  ### What This Activity Cannot Reproduce (Your Lecture Duty)

  You must explicitly state these three limitations during the debrief, or they will leave with the wrong idea:

  1.  **Timescale:** "You spoke this language for 40 minutes. Real linguistic relativity hypotheses concern habits formed over decades. We cannot simulate lifetime cognitive restructuring in a seminar."
  2.  **Ecological Validity:** "You knew you were being tested on memory. In the real world, attention is distributed. This task maximized the chance of an effect; real life minimizes it."
  3.  **The "Strong" Claim:** "We demonstrated a failure of Strong Relativity today. But we didn't disprove it globally. We only showed that *this* grammatical feature, under *these* conditions, relies on online processing. Do not walk out thinking Whorf is 'debunked.' Think instead that the *mechanism* is harder to find than the intuition suggests."

  ### Predictable Pitfalls & Fixes

  1.  **Pitfall:** Group A refuses to use the suffixes because it's awkward.
      *   **Fix:** During training (min 10-15), reject any sentence without a suffix. "Message not received. Try again." Make it a game constraint, not a suggestion.
  2.  **Pitfall:** Articulatory suppression is too quiet/weak.
      *   **Fix:** Require them to tap their desk in rhythm with "The." Multisensory suppression is harder to ignore.
  3.  **Pitfall:** Students discuss the task between phases.
      *   **Fix:** Collect all language handouts before Phase 2. "Protocol change. Secure your sheets."
  4.  **Pitfall:** The images are ambiguous.
      *   **Fix:** Test the 20 images yourself beforehand. If you hesitate on "Direct vs. Inferred," discard the card. Use high-contrast line drawings or clear photos.
  5.  **Pitfall:** Psych majors dominate the debrief with "It's all demand characteristics."
      *   **Fix:** Pre-empt this. "If you think you guessed the hypothesis, raise your hand. Did knowing the hypothesis help you suppress the word 'The'?" (Usually, knowing the goal makes suppression harder, not easier).
