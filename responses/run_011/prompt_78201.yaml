          *   *December 1912:* The "War Council" meeting. Fischer saw it as a decision for war. Gerhard Ritter and others saw it as contingency planning. Modern consensus is mixed; it wasn't a formal resolution to start war in 1914 specifically. The passage treats it as fact, which is misleading.
          *   *Article 231:* It was legal liability for reparations, not moral guilt clause (though called that). Fischer didn't set out to vindicate Versailles; he set out to show German elite aggression. Connecting them directly is a simplification.
          *   *Aims vs. Causes:* Crucial distinction. Having big aims in September doesn't prove you caused the war in July. You could have defensive aims that expanded, or opportunistic aims that emerged *because* war started. Fischer argued continuity (Griff nach der Weltmacht), but critics argue discontinuity.
          *   *Object of Responsibility:* "Germany" is too vague. Was it the Kaiser? The Chancellor? The Military? Social Imperialism? The essay conflates these.
          *   *Settled Debate:* It is not settled. The "Fischer Thesis" dominated for a while, but since the 1980s/90s (Clark's *Sleepwalkers*, etc.), the focus has shifted to shared responsibility, structural factors, and the actions of other powers. Saying "no serious historian now denies" is factually wrong.
