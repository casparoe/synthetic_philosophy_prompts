          *   What does arguing about them look like? Arguing about $d$ is arguing about the *status quo ante* or fallback position (entitlements vs. power). Arguing about $a(S)$ is arguing about the *feasible set* construction (what counts as a possible social state).
          *   Inside the theory: Usually treated as primitives. To argue inside, you need a prior stage game or a theory of entitlements that generates $d$.

