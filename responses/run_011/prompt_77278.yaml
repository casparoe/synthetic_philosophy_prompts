answer: |-
  ### Notation and Setup

  Let $N = \{1, 2\}$ be the set of players.
  Let $S \subset \mathbb{R}^2$ be the **feasible set**, assumed compact, convex, and comprehensive (if $x \in S$ and $y \le x$, then $y \in S$). $S$ represents the utility possibilities.
  Let $d \in S$ be the **disagreement point**, such that there exists $x \in S$ with $x > d$.
  Let $F(S, d)$ be the **solution function**, selecting a unique vector in $S$.
  Let $IR(S, d) = \{x \in S \mid x \ge d\}$ be the set of individually rational outcomes.
  Let $PO(S)$ be the Pareto frontier of $S$.
  Let $a(S)$ be the **ideal point** (utopia point), defined componentwise as $a_i(S) = \max \{x_i \mid x \in S\}$.

  ---

  ### Translation of Claims

  **1. The baseline ($d$) is a substantive normative question, not simply the no-agreement outcome.**
  *   **Formal Expression:** The disagreement point $d$ is treated as a variable parameter of the function $F(S, d)$ rather than a fixed exogenous fact (e.g., autarky or war). The claim asserts that $F(S, d_1) \neq F(S, d_2)$ for $d_1 \neq d_2$, and that the selection of $d$ is subject to normative criteria external to the bargaining problem itself.
  *   **Bending/Abandoning:** Standard bargaining theory treats $d$ as a given primitive describing the physical consequences of non-agreement. To fit this claim, one must abandon the view that $d$ is purely descriptive. The theory itself does not select $d$; it only maps $d$ to an outcome.
  *   **Verdict:** **Expressible as sensitivity, but the selection mechanism is external.** The apparatus handles the *consequences* of changing $d$ (most solutions satisfy $d$-monotonicity or continuity), but it contains no internal axioms for choosing the "correct" $d$.

  **2. Fairness is sensitive to what each party could reasonably hope for (ideal point), not only to what each forgoes ($d$).**
  *   **Formal Expression:** This is the **Kalai-Smorodinsky (KS) Monotonicity Axiom**. Let $S \subset S'$. If $a(S) = a(S')$, then $F_i(S, d) \le F_i(S', d)$ for $i=1, 2$. This contrasts with the Nash **Independence of Irrelevant Alternatives (IIA)** axiom, which would require $F(S, d) = F(S', d)$ if $F(S', d) \in S$.
  *   **Bending/Abandoning:** No bending required. This is the exact distinction between the Nash solution (which ignores the expansion of $S$ if the solution remains feasible) and the KS solution (which adjusts the outcome based on the ratio of potential gains $\frac{F_i - d_i}{a_i - d_i}$).
  *   **Verdict:** **Directly Expressible.** This claim is the normative motivation for the KS solution over the Nash solution.

  **3. A division is legitimate only if justified to each party individually (no means to aggregate).**
  *   **Formal Expression:** **Individual Rationality (IR)**: $F_i(S, d) \ge d_i$ for all $i$. **Pareto Optimality (PO)**: $F(S, d) \in PO(S)$. Rejection of the **Utilitarian Solution**: $F_{Util}(S, d) = \arg\max_{x \in IR(S, d)} \sum x_i$.
  *   **Bending/Abandoning:** Standard bargaining solutions satisfy IR and PO. The claim requires rejecting solution concepts that maximize the sum without regard for individual constraints (though such concepts are rarely used in axiomatic bargaining precisely because they violate IR or Invariance).
  *   **Verdict:** **Directly Expressible.** The framework is inherently contractarian; it assumes no outcome is chosen unless it improves on $d$ for both. The "no means to aggregate" clause is satisfied by any standard bargaining solution (Nash, KS, Egalitarian) as opposed to a pure sum-maximizer.

  **4. Entitlement depends on contribution; asymmetric contributions require asymmetric outcomes.**
  *   **Formal Expression:** Rejection of the **Symmetry Axiom (SYM)**. SYM states that if $S$ is symmetric (invariant to swapping axes) and $d$ is symmetric, then $F_1(S, d) = F_2(S, d)$. To fit the claim, one must adopt an **Asymmetric Solution** (e.g., Asymmetric Nash: $\arg\max (x_1 - d_1)^\alpha (x_2 - d_2)^{1-\alpha}$), where weights $\alpha$ reflect "contribution."
  *   **Bending/Abandoning:** The term "contribution" has no primitive in $(S, d)$. One must map "contribution" either to the shape of $S$ (marginal productivity affecting the frontier) or to exogenous bargaining powers ($\alpha$). The theory does not define contribution; it only allows asymmetry if $S$, $d$, or the weights are asymmetric.
  *   **Verdict:** **Expressible only via exogenous weighting.** The apparatus can handle asymmetric outcomes, but it cannot internally derive "fairness" from "contribution" without an external mapping of contribution to bargaining power or threat capabilities.

  **5. Some claims are non-tradable; no utility coordinate can represent the question.**
  *   **Formal Expression:** None. This claim denies the existence of a utility function $u_i: \text{Outcomes} \to \mathbb{R}$ that is continuous and comparable enough to construct $S$. It asserts lexicographic preferences or deontological constraints that cannot be flattened into a trade-off rate (slope of $PO(S)$).
  *   **Bending/Abandoning:** This requires abandoning the **Welfarist Premise** of the entire apparatus. If goods cannot be traded off at any rate, the feasible set $S$ cannot be represented as a convex subset of $\mathbb{R}^2$.
  *   **Verdict:** **No Expression.** This is a category error relative to the model. The model assumes all normative questions can be reduced to utility coordinates.

  ---

  ### Residue Report

  **1. The Normative Status of $d$ (Claim 1)**
  *   **Failure:** The theory treats $d$ as a parameter, not a variable to be solved for.
  *   **Diagnosis:** **Limitation of Bargaining Theory.** The apparatus is designed to solve for an agreement *given* a threat point. It is silent on the justice of the threat point itself. In political philosophy, the justice of the status quo is often the primary question (e.g., historical entitlement vs. current possession). The theory assumes the "state of nature" is given; philosophy asks if the state of nature is legitimate.

  **2. The Mapping of Contribution (Claim 4)**
  *   **Failure:** "Contribution" is not a formal object.
  *   **Diagnosis:** **Indeterminacy of the Philosophical Claim.** "Contribution" is ambiguous. Does it mean marginal productivity (shape of $S$)? Threat advantage (location of $d$)? Moral desert (weights $\alpha$)? The bargaining framework reveals that without specifying *how* contribution enters the math (via $S$, $d$, or $\alpha$), the claim is operationally empty. The framework forces the philosopher to specify the mechanism of asymmetry.

  **3. Incommensurability and Rights (Claim 5)**
  *   **Failure:** The model cannot represent non-tradeable claims.
  *   **Diagnosis:** **Limitation of Bargaining Theory.** The framework is consequentialist and welfarist. It assumes all values are commensurable within the utility metric. It cannot represent deontological side-constraints (e.g., "Player 1 has a right to $X$ regardless of efficiency") unless those constraints are hard-coded into the definition of $S$ (making parts of the set infeasible). However, if the claim is that the *value* cannot be represented in utility, the model breaks. This is a known limitation of economic modeling regarding rights and duties.

  ---

  ### Follow-Up Questions

  **1. Is your colleague right that $d$ and the ideal point are normatively loaded primitives?**

  **Yes.** In the apparatus, $d$ and $a(S)$ are primitives, but their determination is where the normative heavy lifting occurs.
  *   **Arguing about $d$:** Inside the theory, $d$ is fixed. To argue about it, you must model the bargaining problem as a sub-game of a larger game. Philosophically, arguing about $d$ is arguing about the **fallback position**. Is $d$ the result of a war of all against all (Hobbes)? Is it the retention of current property holdings (Locke/Nozick)? Is it an equal division of resources before production begins (Rawls)? Changing $d$ changes the solution $F(S, d)$ drastically. A philosopher arguing about $d$ is arguing about what counts as a legitimate threat or status quo.
  *   **Arguing about $a(S)$:** The ideal point depends on the construction of $S$. Arguing about $a(S)$ is arguing about the **feasible set of social states**. Does $S$ include only material goods? Does it include status? Liberty? If you restrict $S$ to exclude certain states (e.g., slavery is infeasible), you lower $a(S)$. Philosophically, this is a debate about the boundaries of the politically possible or permissible.
  *   **Inside the Theory:** Since the theory takes them as given, arguing about them looks like **comparative statics**. You show that $F(S, d)$ is continuous or monotonic in $d$ and $a(S)$, demonstrating that small normative shifts in the baseline or the utopia yield different distributional verdicts.

  **2. Is there a theorem or axiom choice in bargaining theory that philosophers ought to find uncomfortable?**

  **The Axiom of Invariance to Positive Affine Transformations (Scale Invariance).**

  *   **The Axiom:** If utility functions are rescaled ($v_i = \alpha_i u_i + \beta_i$ with $\alpha_i > 0$), the solution in utility space scales accordingly.
  *   **Why it should be uncomfortable:** This axiom asserts that **interpersonal comparisons of utility levels are meaningless.** It forbids the solution from considering *who is poorer* or *who needs more* in absolute terms, unless that need is reflected in the curvature of $S$ or the location of $d$.
  *   **The Conflict:** A political philosopher often wants to say, "Give more to Player 1 because Player 1 is at a lower baseline of welfare," or "Player 1's utility is more urgent." The Invariance Axiom explicitly blocks this. It says only the *ratio of gains* from the disagreement point matters, not the absolute levels.
  *   **Theorem:** The **Nash Uniqueness Theorem**. If you accept Pareto Optimality, Symmetry, IIA, and **Invariance**, the *only* possible solution is the Nash Solution ($\max \prod (x_i - d_i)$). This theorem proves that if you accept the measurement theory of utility (no interpersonal comparison), you are logically forced into a specific form of mutual gain maximization. You cannot sneak in prioritarianism or need-based redistribution without violating Invariance.
  *   **Pressure Point:** Ask your colleague: "Do you accept that we cannot compare the level of my utility to yours? If you want to prioritize the worse off, you must violate Scale Invariance. If you violate Scale Invariance, you admit that utility is not just a representation of preference but a measure of moral worth. Are you prepared to make interpersonal utility comparisons cardinal and comparable?" This forces the philosopher to abandon the standard economic conception of utility or abandon the desire for need-based redistribution.
