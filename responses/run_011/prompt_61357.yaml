          4.  Critique the user's "one small change flips outcome" test.
          5.  Address the epistemological problem (history as a single case study).
          6.  **Crucial:** Distinguish between settled consensus and active debate. Don't hedge too much. Tell the user if their view is minority/mainstream. Rank defeaters.
      *   **Tone:** Rigorous, critical, direct, academic but accessible. No "both sides-ism."

  2.  **Initial Assessment of the User's View:**
      *   The user is advocating for a strong form of *historical materialism* or *structural determinism*.
