          *   *The Trap:* If "inevitable" means "within 10,000 years," it's trivial. If it means "within 50 years," it's testable.
          *   *The "Path Dependence" Argument:* Once a path is taken (e.g., QWERTY keyboards, standard gauge rail), switching costs make the alternative *non-inevitable* even if theoretically better. History locks in.
          *   *Verdict:* Retreating to "somewhere else eventually" makes the claim sociologically true but historically useless.

      *   **3. The "Smallest Rewrite" Rule (Ceteris Paribus):**
          *   User asks about keeping alliances/economy same if no WWI.
