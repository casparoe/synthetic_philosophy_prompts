          *   *Verdict:* This makes the view a *philosophical stance* or *heuristic*, not a scientific fact. It should bother the user if they claim it's empirical truth.

      *   **6. Consensus Check (Who shrugs, who answers?):**
          *   *Structuralists (Marxists, Annales School, Big History):* Will shrug at individual counterfactuals. They care about epochs.
          *   *Narrative Historians/Political Historians:* Will fight hard on contingency.
          *   *Complexity Scientists:* Will say both are wrong; it's non-linear.
          *   *Consensus:* The "strong inevitability" view is a minority position in *history departments*, more common in *sociology/economics/Big History*.

  4.  **Refining the Tone:**
      *   Avoid "Some say..." Be direct. "This is wrong because..."
      *   Check the Fogel claim. Fogel argued railroads weren't *necessary* for growth, but they did shape the *location* of growth. This nuance supports the "location retreat" but undermines the "form" inevitability.
      *   Check the Biology analogy. Convergent evolution supports *functional* inevitability (eyes evolve), not *specific* inevitability (humans). Does history converge on "democracy" or just "state capacity"?
      *   Ensure the distinction between "hard determinism" (physics) and "soft determinism" (probabilities) is clear.

  5.  **Final Review against Constraints:**
