          *   *The "Butterfly Effect" vs. "Dampening":* Systems theory suggests some systems dampen shocks (homeostasis), others amplify them (chaos).
          *   *Critique of the Rule:* The "minimal rewrite" rule often breaks causal chains. If you remove the spark, you must account for the fuel. If the fuel is there, another spark happens (supporting the user). But if the spark *itself* created the fuel (feedback loops), the user is wrong.
