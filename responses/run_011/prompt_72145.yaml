  (i) Which sorting rules are consistent with all six of her verdicts? Give me several, not two, and say what actually distinguishes them from each other — not just labels.
  (ii) Which of those rules diverge on my new case, and what does each predict?
  (iii) Your single best guess at her verdict plus the rule behind it, and why you prefer that rule.
