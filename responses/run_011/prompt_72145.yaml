  1. Textbook version. Two envelopes, one holds twice the other, amounts unknown to you, you pick blind and are offered a switch before opening. The switching calculation says you gain a quarter of what you're holding. → DISSOLVED ("the calculation is just invalid").
  2. Same, except you're told the pair is $20 and $40 and you pick without looking. → DISSOLVED.
  3. Peek version, bounded generator: the organiser picks K uniformly from 0 to 10 and puts 2^K in one envelope and 2^(K+1) in the other. You take one at random and open it. Conditional on what you see, switching is favourable for every amount except the very top one (2048), where it's a disaster; ex ante, before opening, switching and keeping are exactly equal in expectation. → DISSOLVED ("people who find that paradoxical have forgotten there's a top of the range").
  4. Peek version, geometric generator with an infinite mean: K is drawn so that P(K=k) = (1/4)(3/4)^k for k = 0, 1, 2, …. Then whatever you open and see, the correct conditional calculation says switching gains you one seventh of it — and the person holding the other envelope, running the same calculation on their own amount, reaches the same verdict about switching back. → REAL PARADOX.
  5. Dynamic version: you pick an envelope, the organiser looks at your amount, flips a coin that lands heads 60% of the time, and writes either double or half your amount into the second envelope. Switching pays 1.4× whatever you hold. → DISSOLVED ("that's not a paradox, that's a lopsided game").
  6. Probability-free version: no distributions and no peeking, just "either you gain X by switching or you lose X/2, and the same reasoning runs from the other envelope, so you should switch and shouldn't." → DISSOLVED.

