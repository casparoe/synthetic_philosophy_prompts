answer: |-
  1. The Logical Space

  To sort these views, we must map the dimensions on which they diverge. A single axis of "more vs. less patriotism" is useless. The disagreement lies in the structure of the attachment. I propose five axes.

  **Axis 1: The Object (Particular vs. Universal)**
  Is the attachment to *this* specific place, history, and kin (the soil, the dead, the accent), or is it to a set of principles and institutions that could exist elsewhere (justice, liberty, the rule of law)?

  **Axis 2: Priority (Partial vs. Impartial)**
  When the interests of compatriots clash with the interests of outsiders, does the compatriot have a automatic claim to priority? If so, is that claim absolute, or does it yield when the outsider's need is desperate?

  **Axis 3: Substitutability (Irreplaceable vs. Replaceable)**
  If a neighbouring country became significantly freer, richer, and more just, would moving there constitute a betrayal? Or is the current country only valuable insofar as it maintains certain standards, making it interchangeable with a better performer?

  **Axis 4: Agency (Inherited vs. Individual)**
  Is the citizen implicated in the acts of their state and predecessors? Can one rightly feel shame for a massacre committed before one's birth, or pride in a victory one did not fight for? Or is moral responsibility strictly individual?

  **Axis 5: Function (Sentiment vs. Duty)**
  Is patriotism a private feeling that may or may not arise, or is it a public requirement? Specifically, do free institutions mechanically decay without this specific emotional fuel, making it a duty to cultivate the feeling regardless of sincerity?

  2. The Grid of Combinations

  We can visualize the occupied and empty cells by crossing the two most fundamental axes: **Object** (Particular/Universal) and **Priority** (Partial/Impartial), while noting **Substitutability** as a key modifier.

  | Object \ Priority | Partial (Compatriots First) | Impartial (Equal Weight) |
  | :--- | :--- | :--- |
  | **Particular (Soil/Kin)** | **Occupied:** *The Nationalist.* The land and people are unique and demand priority. <br> **Occupied:** *The Communitarian.* Shared life creates the moral context; priority is a byproduct of intimacy, not superiority. | **Empty:** *Incoherent.* If the attachment is to *this* specific soil/kin, it is logically difficult to argue their needs count for no more than a stranger's. |
  | **Universal (Principles)** | **Occupied:** *The Civic Patriot.* I love the principles, but *this* is the vessel. I prioritise my compatriots to keep the vessel stable. <br> **Occupied:** *The Friend's Dissolution.* I love the people/principles, but the "country" is just a container. If the container breaks, the love remains. | **Occupied:** *The Cosmopolitan.* Principles are universal; borders are arbitrary. Priority to compatriots is prejudice. |

  **Notes on Empty and Rare Cells:**

  *   **Particular/Impartial (Empty):** This combination is **incoherent**. To love a specific patch of ground or lineage *for itself* implies it has special value. To then say it has no special claim on your resources contradicts the premise of particular love.
  *   **Universal/Partial (Occupied - Civic Patriot):** This is the most crowded cell. It contains those who believe principles need local defence.
  *   **Universal/Partial (Occupied - Friend's Dissolution):** Distinct from the Civic Patriot because the Friend denies the "country" is the object at all. The Civic Patriot loves the *State*; the Friend loves the *bundle of feelings* which the State currently hosts.
  *   **Universal/Impartial (Occupied - Cosmopolitan):** A stable, common position.
  *   **Particular/Partial + High Substitutability (Empty):** This is **unattractive**. If you love the soil/kin, you generally do not view the country as a service provider that can be swapped for a better model.
  *   **Universal/Partial + High Necessity (Occupied - Civic Republican):** A subset of the Civic Patriot who believes the feeling is a *duty* required for survival, not just a preference.

  3. The Ten Questions

  Please read each scenario and select the statement that best matches your immediate reaction. Do not overthink; choose the one that feels most like something you would say.

  **1. The Massacre (Agency)**
  A historical inquiry confirms our army massacred civilians in a colonial war sixty years ago, before I was born.
  *   A. I feel a heavy shame, as if a stain on my family's name has been confirmed.
  *   B. I feel regret that it happened, but no personal shame; I am not my grandfather.
  *   C. I feel anger that the current government is using this to distract from today's problems.

  **2. The Better Neighbour (Substitutability)**
  A neighbouring country reforms its constitution. It is now freer, wealthier, and less corrupt than ours. They offer me instant citizenship.
  *   A. I would not go. This is my home, for better or worse.
  *   B. I would go. Justice and prosperity matter more than geography.
  *   C. I would stay, but only because my family and friends are here, not because of the state.

  **3. The Wartime Leak (Priority)**
  During a justified war, I discover evidence that our soldiers committed an atrocity. Publishing it now will help the enemy and prolong the fighting.
  *   A. I publish immediately. The truth is more important than the war's outcome.
  *   B. I wait until the war ends. Winning is necessary to protect our way of life.
  *   C. I hand the evidence to a superior officer. My duty is to fix the army, not aid the enemy.

  **4. The Football Match (Symbolism)**
  Our national team is playing against a country with a more legitimate, democratic government. I want our team to win.
  *   A. I feel conflicted. The better government should win, even if it means my team loses.
  *   B. I want my team to win. They represent my community, regardless of politics.
  *   C. I don't care about national teams. It's just a game between employees.

  **5. The Quiet Neighbour (Object)**
  My neighbour is a naturalised citizen. He is kind, obeys the laws, and pays taxes, but he refuses to stand for the anthem and calls the flag "just cloth."
  *   A. I trust him completely. His actions show he belongs more than those who wave flags.
  *   B. I worry about him. A society needs shared symbols to hold together.
  *   C. I feel indifferent. What he feels about symbols is his private business.

  **6. The Organ Transplant (Priority Limits)**
  There is one donor organ available. One patient is a compatriot; the other is a foreigner. Both have equal need and equal desert.
  *   A. Give it to the compatriot. We owe more to our own.
  *   B. Flip a coin. Need is the same, so chance should decide.
  *   C. Give it to the foreigner. They have no other support network here.

  **7. The Constitutional Change (Object)**
  A movement proposes to rewrite the constitution to make it more just, but in doing so, it removes all references to our history and traditional identity.
  *   A. Support it. Justice is the only thing that matters.
  *   B. Oppose it. A country without its history is just a corporation.
  *   C. Support it, but keep the old symbols. We can have both.

  **8. The Voting Booth (Function)**
  I am tired and cynical about politics. I feel no pride in my country this year.
  *   A. I vote anyway. It is my duty to maintain the system, feelings aside.
  *   B. I abstain. Voting without belief is dishonest.
  *   C. I vote for the option that best protects my family, regardless of the system.

  **9. The Sacrifice (Glory vs. Safety)**
  A crisis arises. We can ensure total safety for our population, but it means accepting a permanent loss of international status and influence.
  *   A. Choose safety. The people matter, not the prestige.
  *   B. Choose status. A country that doesn't matter is a country that won't last.
  *   C. Seek a middle path. Safety is primary, but we shouldn't humiliate ourselves.

  **10. The Bundle (Dissolution)**
  Imagine our borders were redrawn tomorrow. My town ended up in a different country, with a new flag and anthem, but the same neighbours and laws.
  *   A. I would feel a deep loss. The country is the container for my life.
  *   B. I would not care. The neighbours and laws are what I value, not the name.
  *   C. I would resist. Changing borders by decree is dangerous, regardless of the outcome.

  4. The Leaves and Scoring Key

  **The Terminal Positions (Leaves)**

  1.  **The Nationalist:** The country's standing and glory is an end in itself. (Matches Q9-A/B, Q7-B).
  2.  **The Communitarian:** Shared ways of life are a precondition of anyone's having moral reasons at all. (Matches Q2-C, Q5-B).
  3.  **The Civic Republican:** Free institutions rot without active attachment, so patriotism is a duty of citizenship rather than a feeling. (Matches Q8-A, Q5-B).
  4.  **The Critical Patriot:** The proper object is the country's professed principles, making criticism loyalty's highest form and shame a patriotic emotion. (Matches Q1-A, Q3-A, Q7-A).
  5.  **The Moderate Patriot:** Special concern is legitimate but bounded and excludes any claim to superiority. (Matches Q6-A, Q2-A, Q1-B).
  6.  **The Anti-Patriot:** Patriotism is a vice not because of what it produces but because it corrupts the patriot's judgement about his own country. (Matches Q4-A, Q3-A, Q1-B).
  7.  **The Cosmopolitan:** Borders are morally arbitrary and the patriot is simply mistaken. (Matches Q2-B, Q6-B, Q4-C).
  8.  **The Dissolutionist (Your Friend):** There is no single attitude left to evaluate; the "country" is dispensable to the bundle of affections. (Matches Q10-B, Q5-A, Q2-C).

  **Scoring Key**

  *Do not count points. Look for these decisive combinations.*

  *   **If Q2 is B AND Q6 is B:** Classify as **The Cosmopolitan**.
      *   *Reasoning:* They view the country as replaceable by a better one and reject partiality in life-and-death decisions.
  *   **If Q10 is B AND Q5 is A:** Classify as **The Dissolutionist**.
      *   *Reasoning:* They separate the people/laws from the state symbols and are willing to let the state object vanish while keeping the affection. This distinguishes them from the Cosmopolitan (who focuses on moral arbitrariness) and the Communitarian (who values the symbols of the way of life).
  *   **If Q1 is A AND Q3 is A:** Classify as **The Critical Patriot**.
      *   *Reasoning:* They accept inherited shame and prioritise truth/principles over state security.
  *   **If Q8 is A AND Q5 is B:** Classify as **The Civic Republican**.
      *   *Reasoning:* They view participation as a duty regardless of feeling and value symbols for social cohesion.
  *   **If Q9 is B AND Q7 is B:** Classify as **The Nationalist**.
      *   *Reasoning:* They prioritise status/glory over safety and view history/identity as non-negotiable.
  *   **If Q6 is A AND Q2 is A AND Q1 is B:** Classify as **The Moderate Patriot**.
      *   *Reasoning:* They prioritise compatriots and stay put, but reject inherited guilt. This is the standard "local tastes" position.
  *   **If Q2 is C AND Q5 is B:** Classify as **The Communitarian**.
      *   *Reasoning:* They stay for the people (not the state) but believe symbols are necessary for that community to function.
  *   **If Q4 is A AND Q3 is A:** Classify as **The Anti-Patriot**.
      *   *Reasoning:* They actively root against their country when it conflicts with their moral judgement of legitimacy or truth.

  **Handling Empty Cells**
  If a respondent's answers land in a combination marked "Empty" in the Grid (e.g., Q6-B [Impartial] but Q2-A [Irreplaceable Home]):
  *   **Action:** The group leader should flag this as an "Unstable Configuration."
  *   **Instruction:** Ask the respondent to revisit Q2 or Q6. Say: "You indicated you would never leave this country even for a better one, but also that a stranger's life equals a neighbour's. If the country is irreplaceable to you, is it not because the people in it are special? If they are special, why does their life not weigh more?"
  *   **Goal:** Force them to collapse into either the Moderate Patriot or the Cosmopolitan.

  5. Limitations and Honest Assessment

  This instrument is robust, but it is not a perfect spectroscope. There are pairs of leaves it cannot reliably separate, primarily because the behaviours overlap even if the justifications differ.

  **The Principles-Based Patriot vs. The Cosmopolitan**
  You anticipated this. The **Critical Patriot** (Leaf 4) and the **Cosmopolitan** (Leaf 7) will often answer identically on concrete cases. Both will publish the atrocity (Q3), both will feel shame (Q1), and both may prioritise justice over glory (Q9).
  *   *Why they collapse:* A person can attach herself to liberal principles in her own country for purely local reasons ("This is *our* promise"), while the Cosmopolitan attaches to them for universal reasons ("This is *human* promise"). In practice, both act the same way.
  *   *Can a question pry them apart?* Only Q10 (The Bundle) and Q2 (Relocation) attempt this. The Cosmopolitan moves because borders are wrong (Q2-B). The Critical Patriot stays to fix the promise (Q2-A). However, a Critical Patriot who believes the country has failed irredeemably becomes a Cosmopolitan in practice. The instrument captures the *current* stance, not the metaphysical justification. You will need verbal follow-up to distinguish "I love these principles *here*" from "I love these principles *everywhere*."

  **The Civic Republican vs. The Communitarian**
  Both value symbols (Q5-B) and duty (Q8-A). The Republican thinks symbols protect *freedom*; the Communitarian thinks symbols protect *identity*.
  *   *Why they collapse:* In a stable democracy, freedom and identity are intertwined.
  *   *Separation:* Q7 (Constitutional Change) helps. The Republican will sacrifice history for justice (Q7-A); the Communitarian will sacrifice justice to keep the history intact (Q7-B). If they hedge (Q7-C), they remain indistinct.

  **The Dissolutionist vs. The Cosmopolitan**
  Your friend's view (Leaf 8) is psychologically subtle. It risks collapsing into Cosmopolitanism (Leaf 7).
  *   *Why they collapse:* Both say the "Country" (the state/border) is not the ultimate object of value.
  *   *Separation:* Q10 is the key. The Cosmopolitan wants borders removed because they are unjust. The Dissolutionist doesn't care if borders exist, provided their "bundle" (neighbours, laws) remains. The Cosmopolitan is political; the Dissolutionist is psychological. If a respondent answers Q10-B but Q2-A (Stay home), they are a Dissolutionist. If they answer Q10-B and Q2-B (Move), they are a Cosmopolitan.

  **Final Note for the Moderator**
  This tool sorts people by how they *act* and *feel*, not by what they *say*. Expect participants to claim they are "Moderate Patriots" while their answers score them as "Critical Patriots" or "Dissolutionists." The value of the session lies in showing them this gap. Do not use the labels to box them in; use the labels to show them the consequences of their own choices.
