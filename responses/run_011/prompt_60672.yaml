answer: |-
  Here is the specification for a decision theory adequate to Keynesian uncertainty, followed by the audit of its constraints, the resolution of the Treatise/General Theory contradiction, and the single filter that wipes out the competition.

  ### The Specification

  To count as a theory of Keynesian uncertainty (distinct from risk), a formalism must satisfy the following five requirements:

  **1. Non-Additive Representation (The "No Laundering" Clause)**
  *   **Requirement:** The theory cannot force the decision-maker to assign a precise probability distribution over the state space where none exists. Specifically, it must reject the axiom $P(A) + P(\neg A) = 1$ for propositions lacking an evidentiary basis. Ignorance must be represented as a gap, not a uniform prior.
  *   **Motivation:** Standard Expected Utility Theory (EUT) and Bayesianism treat "unknown" as "equiprobable." This launder ignorance into risk. Keynes's core insight is that some probabilities are *non-existent*, not just unknown. Assigning a number creates a false precision that distorts downstream calculation.

  **2. Two-Dimensional Belief State (Weight vs. Balance)**
  *   **Requirement:** The representation of belief must separate the *balance* of evidence (which way the evidence points) from the *weight* of evidence (how much evidence there is). A high probability based on scant data must be formally distinct from a high probability based on robust data.
  *   **Motivation:** In the *Treatise on Probability*, Keynes argues that rational belief is a function of both relation and evidence volume. A decision theory that collapses these (e.g., standard Confidence Intervals) cannot explain why we trust a 60% forecast based on 1,000 trials more than a 60% forecast based on 1 trial, even if the expected value is identical.

  **3. Rational Inaction (Liquidity Preference)**
  *   **Requirement:** The theory must generate "hold cash" or "delay decision" as an optimal solution derived from the structure of the uncertainty, not from a parameter for "risk aversion." Inaction must be a positive choice, not a failure to compute.
  *   **Motivation:** In the *General Theory*, holding money is not a transaction cost or a fear of loss (risk); it is a premium paid for the option to wait until uncertainty resolves. If the theory requires a choice between assets A and B, it fails to capture the demand for liquidity as a distinct asset class driven by uncertainty proper.

  **4. Reflexive Stability (The Beauty Contest Constraint)**
  *   **Requirement:** The decision rule must remain stable when it becomes common knowledge. The theory must account for the fact that adopting a forecasting rule changes the distribution of the variable being forecast.
  *   **Motivation:** Financial markets are not physical systems; they are psychological systems. If a theory prescribes a "optimal betting strategy" and everyone adopts it, the odds vanish or the market crashes. A decision theory for social systems that ignores the feedback loop of its own adoption is descriptively false and normatively dangerous.

  **5. Action Guidance (The "Verb" Requirement)**
  *   **Requirement:** The theory must output a prescriptive instruction (e.g., "Invest," "Hold," "Follow Convention," "Wait"). It cannot terminate in "probability is undefined."
  *   **Motivation:** A theory that identifies uncertainty but offers no protocol for navigating it is epistemology, not decision theory. Agents must act; if the theory cannot guide action under uncertainty, it is useless to the agent facing the uncertainty.

  ***

  ### The Audit: Non-Negotiable vs. Prejudice

  **Non-Negotiable:**
  Items **1 (Non-Additivity)** and **2 (Weight/Balance)** are the definitional core. If a theory collapses ignorance into a probability distribution (violating #1) or treats a guess equal to a measurement (violating #2), it is mathematically indistinguishable from Risk-based Bayesianism. It has failed the assignment before it begins.

  Item **3 (Rational Inaction)** is economically non-negotiable. If holding cash can only be explained by risk-aversion parameters, you have not explained Keynesian uncertainty; you have explained high-variance risk. The liquidity preference *is* the manifestation of uncertainty in the macroeconomy.

  **Prejudice (or at least, Debatable):**
  Item **4 (Reflexivity)** is the most contentious. While Keynes certainly highlighted the beauty-contest nature of markets, demanding that a *normative* decision theory solve the reflexivity problem may be asking too much. A theory can tell *you* what to do given the world, even if the world changes because *everyone* was told. However, for a theory claiming to handle *macroeconomic* uncertainty, ignoring reflexivity is a fatal blind spot. I classify it as non-negotiable for a *complete* theory, but a theory could claim to be a "partial equilibrium" decision aid and dodge it.

  **The "What to Do" Question:**
  Is **Item 5 (Action Guidance)** a requirement, or can a Keynesian refuse?
  **It is a requirement.**
  A Keynesian is *not* entitled to refuse action guidance. Keynes himself did not say "nothing can be done"; he said "rational calculation is impossible, so we rely on convention, animal spirits, and liquidity." A formal theory must codify *that*. It must say: "When weight of evidence is below threshold $w^*$, defer to convention." If the theory stops at "probability is undefined," it leaves the agent paralyzed. Paralysis is a decision (to let time decide), and it must be justified. A decision theory that cannot tell you when to stop calculating and start acting is a trap.

  ***

  ### The Contradiction: Treatise vs. General Theory

  You asked me to land on the tension between the *Treatise on Probability* (objective logical relations) and the *General Theory* (irreducible unquantifiable uncertainty).

  **The Verdict:** They are incompatible. You cannot have both.
  **The Stance:** You must abandon the *Treatise* ambition to save the *General Theory* insight.

  **The Defense:**
  The *Treatise* attempts to ground probability in objective logical relations between propositions. It seeks a formal logic of partial belief. The *General Theory* admits that for major economic decisions (investment, innovation), there *are* no logical relations to be found because the future is not determined by the past in a knowable way.

  If you demand "Objective Probability Relations" for all events, you are claiming that a probability *exists* waiting to be discovered. This contradicts the claim of "Irreducible Unquantifiable Uncertainty," which states that no such number exists to be discovered.

  Most attempts to synthesize these (e.g., Imprecise Probability) try to keep the *Treatise* logic (sets of probabilities) while admitting *General Theory* limits. This fails because it still assumes the "true" probability lies somewhere in the set.

  **The Resolution:** A viable Keynesian decision theory must accept that for a subset of propositions, **probability relations do not exist.** It cannot be a logic of belief; it must be a logic of **action under the absence of belief.** The *Treatise* project was a failed attempt to mathematize the unmathematizable. The *General Theory* is the mature admission that mathematics hits a wall. Therefore, the theory must be hybrid: Bayesian where logic applies (risk), and heuristic/conventional where it does not (uncertainty). Any theory claiming to provide a unified calculus for both is chasing a contradiction.

  ***

  ### The Killer Desideratum

  The single desideratum that eliminates the most existing proposals is **Item 1: Non-Additive Representation (The "No Laundering" Clause).**

  **Why:**
  This requirement wipes out the entire hegemony of modern economics and decision science in one stroke.
  1.  **Standard Bayesianism:** Eliminated immediately. It requires a prior for everything.
  2.  **Frequentism:** Eliminated. It requires repeatable trials (which uncertainty proper lacks).
  3.  **Imprecise Probability (many variants):** Many "robust" models still require a closed set of priors that sum to 1 over the state space, effectively smuggling additivity back in through the back door.
  4.  **Prospect Theory:** Eliminated. It modifies the utility curve, but still operates on defined probabilities.

  While Item 5 (Action Guidance) kills many academic formalisms that end in indeterminacy, Item 1 kills the *foundation* upon which 95% of decision theory is built. It forces a reconstruction of probability itself, not just a tweak of the utility function. If a candidate theory assigns a number to "we have no idea," it is not a theory of Keynesian uncertainty; it is a theory of risk with a confidence problem. Item 1 is the gatekeeper.
