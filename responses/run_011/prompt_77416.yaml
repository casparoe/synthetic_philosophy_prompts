answer: |-
  # JOINT STATEMENT ON PRAGMATIC ENRICHMENT AND EXPLICIT CONTENT
  **Adversarial Collaboration Reading Group**
  **Date:** 24 May 2024
  **Signatories:** The Conservative Gricean Camp; The Relevance-Theoretic Pragmatist Camp

  ## I. AGREED CLAIMS

  After twelve months of deliberation regarding the division of labour between semantics and pragmatics, and utilising the agreed corpus (a–c), the undersigned camps affirm the following propositions:

  1.  **Intention-Recognition:** All parties agree that successful communication consists fundamentally in the audience's recognition of the speaker's informative intention. Linguistic decoding alone is insufficient to recover the full proposition communicated by the speaker.
  2.  **The Role of Principle:** Both camps accept that a governing principle is required to explain how hearers select the intended interpretation from a range of logically possible decodings. Whether labelled the Cooperative Principle (with Maxims) or the Principle of Relevance, this principle explains why specific inferences are drawn rather than others.
  3.  **Defeasibility:** Both camps accept that inferences drawn from the use of scalar terms (e.g., *some*) are defeasible. As demonstrated in corpus item (a) (*'Some of the applicants were shortlisted — indeed, all forty of them were'*), a speaker may assert a scalar term and subsequently deny the upper-bounded inference without semantic contradiction.
  4.  **Contextual Sensitivity:** Both camps agree that the truth-evaluability of an utterance often depends on context. In corpus item (b) (*'If some of the plates are clean, we can start dinner'*), both sides agree that the hearer must determine *which* clean plates count towards the condition (e.g., dinner plates vs. any crockery) to evaluate the statement.
  5.  **Psychological Reality:** Both camps agree that any viable theory must account for the cognitive processing of embedded contexts, such as propositional attitudes. Corpus item (c) (*'Moira knows that some of the delegates voted against the motion…'*) confirms that pragmatic processing interacts with attitude verbs, and that Moira's knowledge state must be representable without contradiction.

  ## II. RESIDUAL DISAGREEMENTS AND DIAGNOSTIC CRUXES

  While we agree on the phenomena, we disagree on the theoretical architecture used to explain them. Specifically, we disagree on whether there exists a pre-pragmatic level of truth-conditional content ('what is said') distinct from the pragmatically enriched content ('what is communicated' or 'explicature').

  The following table outlines our divergent positions, the specific cruxes of the debate, and the predictions each camp makes regarding the agreed corpus.

  | Crux | Conservative Gricean Position | Relevance-Theoretic Pragmatist Position | Diagnostic Case & Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. The Boundary of 'What Is Said'** | **Claim:** 'What is said' is fixed solely by disambiguation and reference assignment. Pragmatic enrichment contributes only to 'what is implicated'.<br><br>**Formulation:** There is a minimal proposition expressed by the sentence type, which serves as the input to pragmatic calculation. | **Claim:** 'What is said' (or 'explicature') is routinely enriched by pragmatics to reach a truth-evaluable proposition. No minimal proposition does explanatory work.<br><br>**Formulation:** The explicit content is already the result of pragmatic inference; there is no intermediate 'minimal' level. | **Case:** Corpus (b) (*'If some of the plates are clean…'*).<br><br>**Gricean Prediction:** The truth conditions are satisfied if *at least one* plate is clean. If only one is clean, the statement is true but potentially misleading.<br><br>**Relevance Prediction:** The truth conditions are satisfied only if *enough* plates are clean for dinner. If only one is clean, the statement is false. |
  | **2. Cancellability** | **Claim:** Cancellability is the hallmark of implicature. If an inference can be denied without contradiction, it was never part of 'what is said'.<br><br>**Formulation:** Corpus (a) proves 'not all' is an implicature because it is explicitly cancelled. | **Claim:** Cancellability shows an inference is pragmatic, but not necessarily that it is an *implicature* rather than an enriched *explicature*.<br><br>**Formulation:** Corpus (a) shows context can block default enrichment. The upper bound is pragmatic, but in standard contexts, it forms part of the explicit content. | **Case:** Corpus (a) (*'Some… indeed, all…'*).<br><br>**Gricean Prediction:** This is a standard scalar implicature cancellation. The semantic content ('at least some') remains constant.<br><br>**Relevance Prediction:** This is a case of context preventing enrichment. In isolation, 'some' would be enriched to 'some but not all'; here, the second clause forces a logical interpretation. |
  | **3. Embedding** | **Claim:** Implicatures generally do not embed under propositional attitude verbs or logical operators.<br><br>**Formulation:** In corpus (c), Moira knows the semantic content ('at least some'), not the implicature ('not all'). | **Claim:** Explicatures (pragmatically enriched content) do embed. The enrichment happens before the content is embedded under 'knows'.<br><br>**Formulation:** In corpus (c), the content of Moira's knowledge is pragmatically adjusted to be consistent with 'all'. | **Case:** Corpus (c) (*'Moira knows that some…'*).<br><br>**Gricean Prediction:** Moira knows the minimal proposition. The 'not all' inference does not enter her belief box. The sentence is acceptable because the implicature is suspended in this context.<br><br>**Relevance Prediction:** The hearer constructs an explicature for the embedded clause that is consistent with Moira's total knowledge (i.e., 'at least some', logically). Enrichment is constrained by the attitude context. |

  ## III. CONCLUSION ON TERMINOLOGY

  We conclude this statement by addressing whether our dispute turns *only* on the phrase 'what is said'.

  **Joint Assessment:** No. While a portion of the disagreement is terminological (i.e., whether to label the pragmatically enriched proposition 'what is said' or 'what is implicated'), the dispute is not *merely* verbal. It reflects a substantive divergence regarding the architecture of the language faculty and the nature of truth conditions.

  The Conservative Gricean camp maintains that semantics must provide a stable, context-invariant core to protect the compositionality of language. The Relevance-Theoretic camp maintains that semantics provides only a schematic blueprint, and that truth-conditional content is always the output of pragmatic inference. Consequently, the choice of label dictates where we locate the input to logical form and how we model the psychology of understanding. We agree to disagree on the label, provided future citations of this group's work specify which theoretical architecture is being employed when analysing the corpus.

  **Signed,**

  *The Conservative Gricean Camp*
  *The Relevance-Theoretic Pragmatist Camp*
