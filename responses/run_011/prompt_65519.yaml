  A principal investigator in a double-blind clinical trial holds the encryption key to the treatment assignments and commits to not decrypting them until the study concludes. She can revoke this commitment at any moment with a single keystroke; there is no audit trail, no financial penalty, no oversight body notified, and no reputational risk attached to the act of decryption. Nonetheless, she reliably maintains the blind throughout the trial, even during periods of high anxiety about patient outcomes. The binding force arises because the statistical protocol defines the validity of the trial results contingent on maintained blindness; if she decrypts, the data does not become penalized, it becomes logically unusable for regulatory approval, rendering the goal of the study unachievable regardless of her subsequent actions.

  **Demonstration**

  The credibility theorist predicts this device will fail because the constraint lacks "teeth"—since revocation is costless and frictionless, the hot-self should simply revoke to satisfy immediate anxiety. This prediction misfires because it conflates *sanctions* with *validity conditions*; the agent is not deterred by a price, but by the fact that revocation destroys the very object she seeks to obtain. The no-dead-hand theorist predicts the device succeeds because it remains reversible, allowing the agent to retain agency. She comes out right, but for the wrong reason: she attributes the success to the preservation of liberty, whereas the success actually stems from the logical structure of the goal, not the liberty to revoke.

  **Irreversibility Ablation**
  If we change exactly one feature—making the encryption key physically destructible rather than usable (irreversible commitment)—the device breaks. In a scenario where a severe adverse event requires immediate knowledge of treatment assignment to save a patient's life, the investigator cannot decrypt. Here, the dead-hand objection holds: the irreversible constraint prevents the agent from responding to higher-order values (patient safety) that outweigh the original goal (study validity).

  **Single Feature and Second Ablation**
  The single feature doing the work is **constitutive negation**: the act of revocation logically negates the success conditions of the project rather than imposing a sanction on the agent. If we remove this feature via a second ablation—stipulating that the protocol allows for data correction after decryption so the study remains valid—the binding effect vanishes. The verdict flips from "bound" to "unbound" because once the goal remains achievable post-revocation, the agent faces only the temptation of anxiety relief with no logical barrier to success, and the credibility problem returns.

  **Elster-Type Attack and Rebuttal**
  A committed Elster-type would attack this case by insisting that the loss of regulatory approval is a cost wearing a disguise; he would argue that "logical unusability" is functionally equivalent to a high price tag, so the credibility requirement is still being met via a hidden cost. He is wrong. The test is whether the agent can pay the cost and still achieve the goal. A price allows you to buy the outcome at a higher rate; constitutive negation makes the outcome unavailable regardless of payment. The mechanism is not "revoking is expensive," but "revoking means you are no longer doing the thing."

  **Scaling to Constitutional Entrenchment**
  This mechanism scales to constitutional entrenchment, but only if the polity possesses something an individual does not: **institutionalized adjudication**. An individual knows internally whether she has violated her own validity conditions. A polity, however, requires a recognized authority (like a court) to declare that a legislative act is *void ab initio* rather than merely punishable. Without independent agents to certify the constitutive negation, a legislature could simply ignore the validity condition, treating it as a cost rather than a logical barrier. Thus, constitutional precommitment requires not just entrenchment clauses, but a culture of recognition that treats ultra vires acts as nullities rather than breaches.
