answer: |-
  This case constructs **resultant moral luck** while holding constitutive, circumstantial, and causal luck fixed. Elias and Marcus are brothers babysitting their infant nieces in adjacent rooms of the same house, possessing identical knowledge of safety protocols, identical motives of care, and identical diligence in checking monitors, temperature, and positioning before leaving the room after exactly ten minutes. They are indistinguishable up to the moment of departure, but a microscopic, undetectable manufacturing flaw in one crib mattress obstructs airflow only when combined with a specific, unforecastable barometric pressure drop occurring precisely at 3:00 AM that affects only one side of the house due to a venting anomaly unknown to meteorologists. Elias could not have foreseen the flaw because no recall notice existed and inspection was impossible without destructive testing. Marcus could not have foreseen the flaw because his diligence matched Elias's exactly and the pressure drop was statistically invisible to available forecasting. Elias's niece sleeps safely; Marcus's niece suffocates. Their mother discovers both outcomes at dawn, knowing the brothers acted as one, yet she feels a crushing moral resentment toward Marcus that she cannot feel toward Elias.

  The Control Principle states that agents are morally assessable only for what is within their control. A strict rejection of moral luck must verdict that Elias and Marcus are equally blameless, or equally responsible for the risk, but neither is responsible for the death. To blame Marcus more is to punish him for the weather and the factory, which violates the principle that moral worth cannot depend on factors outside the will. This is the settled baseline in Kantian deontology and is widely accepted in abstract theory, though contested in practice.

  The verdict an accepter of resultant moral luck delivers is that Marcus is more blameworthy than Elias. The justificatory work is done by the harm itself: the death constitutes a part of the wrong that was not present in Elias's action. On this view, the moral quality of an act is not sealed at the moment of choice but extends into the world. This position, associated with Bernard Williams and Thomas Nagel, is genuinely contested; it conflicts with the intuition that luck should not affect moral status, yet it aligns with our reactive attitudes.

  Running the epistemic deflation shows the asymmetry survives even when outcome evidence is starved. Disposition is closed by stipulation of identical motives. Competence is closed by identical diligence and knowledge. Prior record is irrelevant to the specific moral assessment of this night. Risk frequency is closed because both ran the exact same risk. No route remains open; the outcome reveals nothing about the agent that was not already present in the lucky case. If any route remained open, the case would fail, but here the only variable is the corpse.

  Regarding agent-regret, Marcus experiences a first-personal response Elias lacks. However, this regret is a downstream effect of the outcome, not a constitutive element of the prior choice. It fuels the mother's resentment but does not justify it under the Control Principle. The regret confirms the luck; it does not negate it.

  The load-bearing feature is the harm (the death). Remove it, and the asymmetry collapses entirely; without the corpse, the mother's resentment lacks an object, and the brothers remain indistinguishable. The moral difference is ontologically dependent on the physical difference.

  The strongest counterattack denies that resultant luck is a genuine category. A sharp reader would argue that the mother's resentment is not moral blame but grief misidentified. She needs a target for her pain, and Marcus is available while Elias is not. On this view, the asymmetry is psychological, not ethical. Marcus is not *more guilty*; he is merely the *available recipient* of guilt. This objection preserves the Control Principle by reclassifying the blame as a non-moral reactive attitude. This distinction between moral judgment and emotional response is settled in analytic philosophy, but its application here is contested.

  Attempting to reverse the structure for praise reveals resistance. If both agents attempt a rescue under identical conditions, but only one succeeds due to luck, the successful agent is often praised as a hero while the other is merely "trying." However, praise asymmetries are weaker than blame asymmetries because we often praise the attempt (good will) even if it fails. Blame, conversely, often requires harm. The structure resists perfect reversal because negative moral luck relies on damage to activate judgment, whereas positive moral luck can attach to intention alone.

  *Note on Liberties:* This case assumes the mother's resentment constitutes moral judgment rather than pure grief, a contested reading in the Nagel-Williams debate. It also treats the manufacturing flaw as purely resultant luck, ignoring potential causal luck in the purchase of the crib, which is held fixed by stipulation but may feel unnatural to readers.
