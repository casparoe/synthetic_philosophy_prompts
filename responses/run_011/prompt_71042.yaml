answer: |-
  This is a remarkably clean example of a meta-argument: a fight about facts that turns into a fight about definitions, which turns into a fight about philosophy of science. Here is the move-by-move breakdown.

  ### The Play-by-Play

  **1. Nadia: The "Continuity" Objection**
  *   **Does it land?** Yes. This is the standard post-processual archaeological critique. It exposes the colonialist tint in "collapse" narratives that equate political structures with people.
  *   **Is it fair?** Yes. It corrects a common public misconception.
  *   **What's weak?** It risks setting up a straw man. Few professional archaeologists claim the *people* vanished; they usually mean the *sociopolitical complexity* vanished. Nadia is fighting a pop-history ghost, not necessarily the lecturer's actual thesis.

  **2. Owen: The "Material Reality" Defense**
  *   **Does it land?** Yes. He correctly identifies that if we follow Nadia's logic too strictly, we lose the ability to describe catastrophic systemic failure.
  *   **Is it fair?** Mostly. He accepts her facts but challenges her interpretation of their significance.
  *   **What's weak?** He dismisses the ideological weight of the word "Maya." By insisting the political order *is* the society, he inadvertently proves Nadia's point that the definition is exclusionary.

  **3. Nadia: "Reorganization with a Body Count"**
  *   **Does it land?** Very well. This is her strongest substantive claim. She isn't just swapping synonyms; she is proposing a different causal mechanism (adaptation vs. failure).
  *   **Is it fair?** Yes, it follows from Move 1.
  *   **What's weak?** The phrase "body count" concedes too much. If there is significant mortality and depopulation, "collapse" is a defensible description of the demographic event, even if the culture survives.

  **4. Owen: The "Verbal Dispute" Accusation**
  *   **Does it land?** No, not really. This is a classic analytic philosophy trap. He claims that if the facts are agreed upon, the rest is just semantics.
  *   **Is it fair?** No. It assumes language is neutral.
  *   **What's weak?** It ignores that scientific terms drive funding and research questions. Calling it "reorganization" suggests looking for survival strategies; calling it "collapse" suggests looking for fatal flaws. Owen treats language as a label on a box, not a tool for opening it.

  **5. Nadia: "Labels Smuggle Stories"**
  *   **Does it land?** Yes. This rebuts Move 4 directly. She argues that terminology is theory-laden.
  *   **Is it fair?** Yes. It explains *why* the verbal dispute matters.
  *   **What's weak?** She implies "collapse" *necessarily* implies a lack of agency. One can argue a society exercised agency to collapse itself (e.g., ecological suicide), so the word doesn't strictly preclude agency.

  **6. Owen: The "Empiricist Pivot"**
  *   **Does it land?** Partially. He tries to ground the debate in data (drought, surveys).
  *   **Is it fair?** Yes, ultimately evidence must constrain the theory.
  *   **What's weak?** Naive realism. He acts as if the evidence speaks for itself. As Nadia is about to point out, you need a theory to decide which evidence counts ( Move 7).

  **7. Nadia: The "Metric Problem"**
  *   **Does it land?** Hard. This is the philosophical checkmate of the exchange. She points out that "collapse" is a value judgment about what matters (complexity vs. wellbeing).
  *   **Is it fair?** Yes. It highlights that "collapse" is not a natural kind like "gold" or "water"; it is a normative assessment.
  *   **What's weak?** It leads to relativism. If every metric is valid, we can never compare societies. If the farmers ate better but lost literacy and medicine, was it a collapse? Nadia leaves this tension unresolved.

  **8. Owen: "Subscript It" (Technical Relativism)**
  *   **Does it land?** Yes, as a pragmatic solution. This is how academia actually works (e.g., "Tainter-collapse" vs. "Demographic-collapse").
  *   **Is it fair?** Yes. It accepts Nadia's metric argument but refuses to abandon the term.
  *   **What's weak?** It solves the technical problem but ignores Nadia's original public-facing concern (Move 1). You can subscript a paper, but you can't subscript a library lecture title. The public will still hear "Collapse."

  ***

  ### The Verdict: Is there a real disagreement left?

  **Yes, but it has shifted.**

  At the start, they seemed to be arguing about facts (Did the Maya disappear?). By Move 8, they agree on the facts but disagree on the **purpose of the terminology.**

  *   **Owen** views the term as a **technical tool** for modeling sociopolitical complexity. For him, precision is achieved by indexing (Move 8).
  *   **Nadia** views the term as a **public narrative** that shapes ethical understanding of the past. For her, precision is achieved by changing the story (Move 5).

  Owen did not talk Nadia out of the fight; he merely moved the fight into a technical register where he wins, while she remains concerned with the public register where she wins. Owen "won" the philosophy of science debate (terms can be indexed), but Nadia "won" the historiography debate (terms shape public memory). They are talking past each other because Owen is optimizing for *clarity among experts*, and Nadia is optimizing for *justice among descendants*.

  ### The Missing Move

  Neither of them addressed **Resilience Theory**.

  What one of them should have said is this:

  > "You're both treating stability as the default good. 'Collapse' assumes stability is the goal; 'Reorganization' assumes continuity is the goal. But complex systems theory suggests that rigid stability is actually a vulnerability. The 'collapse' of the palace system might have been a *release phase* that allowed the system to persist longer than if it had remained rigid. The question isn't whether to call it collapse or reorganization, but whether the loss of complexity was a cost of survival."

  **Why this matters:**
  This bridges the gap. It acknowledges Owen's point (complexity was lost rapidly) while validating Nadia's point (the people survived and perhaps adapted better). It moves the debate from "What do we call this?" to "What function did this change serve in the system's lifecycle?" That is the actual substantive question hiding behind their semantic wrestling match.
