answer: |-
  Yes, this is a named thing, though the standard academic account focuses slightly more on liability than on the internal sign-off mechanism you are describing. The core concept is **The Moral Crumple Zone**.

  Here is the precise carving of the concept, how it maps to your observation, and the terminology for the edges and mirror cases you asked for.

  ### 1. The Core Concept: The Moral Crumple Zone
  **Origin:** Coined by Madeleine Clare Elish (2019) in the context of autonomous vehicles and AI.
  **Standard Account:** When a complex automated system fails, responsibility "crumples" onto the human operator in the loop. The human absorbs the moral and legal impact of the failure, protecting the technology (and its makers) from liability. The human is treated as the component that failed, preserving the assumption that the automation is reliable.

  **How your observation extends it:**
  The standard account focuses on *external* liability (lawsuits, public blame). You are describing an *internal, operational* application of the same mechanism. In your context, the "Moral Crumple Zone" functions as a **Regulatory Key**.
  *   **Standard:** Blame the human $\rightarrow$ Company avoids lawsuit.
  *   **Your Context:** Blame the human $\rightarrow$ System avoids decommissioning.

  The blame is not a byproduct; it is a **precondition for closure**. In safety engineering terms, you are describing **Attributional Closure**. By attributing the cause to a mutable human element (training, vigilance), the investigation can classify the event as "resolved" without altering the immutable system elements (procurement, design, staffing models).

  ### 2. The Mechanism: "The Human Fuse"
  While "Moral Crumple Zone" is the academic term, the specific functional role you identified—where the blame allows the circuit to stay live—is best described in safety science as **The Human Fuse**.

  *   **Definition:** A human operator is positioned in a workflow such that they are expected to absorb systemic variability or design flaws. When the pressure exceeds a threshold, the human "blows" (makes an error), and the investigation replaces the fuse (retraining/discipline) rather than fixing the circuit (redesign/staffing).
  *   **The Sign-Off Function:** The finding of human error acts as a **Residual Risk Sink**. If the error is human, the system's safety case remains valid (because the system is assumed perfect, and humans are assumed fallible). If the error is systemic, the safety case is invalidated. Therefore, finding human error is the only path that allows the equipment to remain certified.

  ### 3. The "Knowing Fudge": Institutional Decoupling
  You noted that everyone writing the report knows it is a fudge. The sociological term for this is **Institutional Decoupling**.

  *   **Definition:** The separation of an organization's formal structures (the incident report, the findings) from its actual operational practices (the understaffing, the alarm fatigue).
  *   **Why it happens:** The organization needs to maintain **Legitimacy** (we investigate thoroughly) and **Continuity** (we keep using this expensive kit).
  *   **The Carving:** This is not "lying" in the simple sense. It is a ritualistic compliance. The report satisfies the *form* of an investigation (naming a cause, assigning an action) while protecting the *substance* of the operational model (the staffing/procurement decisions).

  ### 4. Defining the Edges: When does it count?
  To distinguish this pattern from genuine negligence, you need three criteria. If all three are present, it is a **Moral Crumple Zone / Human Fuse** case:

  1.  **Local Rationality:** The operator's actions made sense to them at the time, given their goals, knowledge, and constraints (e.g., covering four wards, alarm noise). If they acted irrationally by their own light, it is genuine negligence.
  2.  **Systemic Immunity:** The recommendations focus exclusively on the human (retraining, checklist) while explicitly or implicitly exempting the system design and resourcing from change.
  3.  **Closure Velocity:** The investigation closes significantly faster when a human is blamed than when a system fault is identified. (You noted the system cases stay under review for months; the human cases are signed off quickly).

  **The Near-Miss (Keep Out):**
  If an operator *could* have intervened (the alarm was distinct, they were not overloaded, the procedure was clear) and chose not to (distraction, disregard), that is **Procedural Violation**. That is not a Crumple Zone case. The Crumple Zone requires that the human was *set up to fail* by the system design, but blamed for the failure anyway.

  ### 5. The Mirror Case: Unabsorbable Failure
  You asked for the name of the case where no human is available to blame, so the system gets grounded.

  *   **Term:** **Unmediated Systemic Failure** (or **Unabsorbable Fault**).
  *   **Definition:** A failure mode where there is no human-in-the-loop to absorb responsibility. The causality points directly to design, code, or procurement.
  *   **Consequence:** Because there is no "Human Fuse" to blow, the liability and the safety risk land directly on the organization and the vendor. This forces **Design Accountability**.
  *   **The Asymmetry:** This reveals the hidden rule: *The system is presumed safe only if a human can be held responsible for its failures.* If the human is removed from the equation, the presumption flips, and the system is presumed unsafe until proven otherwise.

  ### 6. Intent: Deliberate vs. Drift
  You asked how to tell if this is deliberate or just drift.

  *   **The Drift Account:** **Drift into Failure** (Sidney Dekker).
      *   **Theory:** No one decides to blame the innocent operator. Instead, small compromises accumulate. Staffing gets tight, alarms get noisy, investigations get rushed. The "Human Fuse" outcome emerges because it is the path of least resistance, not because of a conspiracy.
      *   **Indicator:** Inconsistency. Sometimes the system *is* blamed. The "template" isn't rigid; it's just lazy. Recommendations are generic ("staff to be retrained") rather than specific ("Staff Member X to be disciplined").

  *   **The Deliberate Account:** **Strategic Attribution**.
      *   **Theory:** The organization understands that system changes cost capital (new kit, more staff) while human changes cost operational budget (training, time). The attribution is managed to protect capital.
      *   **Indicator:** Consistency and Resource Flow. If 100% of automation incidents end in human blame, and 0% result in procurement review, it is structural. If the "retraining" is never actually funded or scheduled, the finding was purely for sign-off.

  **How to tell from the outside:**
  Look at the **Recommendations Log**.
  *   **Drift:** Recommendations are made but slowly slip due to resource pressure.
  *   **Deliberate:** Recommendations are made *specifically* to be low-cost (e.g., "remind staff of policy") while high-cost recommendations (e.g., "review alarm thresholds") are marked as "out of scope" or "for future review."
  *   **The Tell:** If the investigation explicitly notes the systemic constraint (e.g., "staffing was 1:4") but the Recommendation section contains *no action* to address that constraint, that is **Decoupling**. It indicates the finding was engineered to close the file, not to prevent recurrence.

  ### Summary for your Reports
  If you need to label this in your own analysis without triggering immediate defensiveness:

  *   **The Phenomenon:** **Attributional Closure via Human Error.**
  *   **The Mechanism:** **The Human Fuse.**
  *   **The Risk:** **Systemic Immunity.** (The system becomes immune to critique because the human absorbs all critique).

  You are observing a system that uses human blame as a **safety certification resource**. It is not a bug in the investigation process; it is a feature of the governance model. The investigation is not designed to find the truth; it is designed to restore the system to a "Safe to Operate" state. Blaming the operator is the cheapest way to buy that state.
