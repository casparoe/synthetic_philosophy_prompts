answer: |-
  1. Bottom line

  Gillian is more right overall regarding historical ontology, though Callum wins on semantic caution. The core disagreement concerns the unit of analysis: Gillian treats the palatial system as the subject, while Callum treats the peasant population. Because the museum displays material culture—tablets, walls, trade goods—Gillian's systemic frame accurately describes the evidence visitors will see. Callum correctly identifies that collapse implies universal suffering, which demography cannot sustain. However, refusing the term obscures the objective discontinuity in administrative capacity. The dispute is substantive: it concerns whether complexity itself is a value worth tracking independent of welfare. For a museum panel, describing the loss of systemic capacity is more honest than implying continuity where the record shows rupture. Gillian's definition of collapse as reproductive failure holds better than Callum's requirement for permanent welfare loss.

  2. Move by move

  **Move 1 (Callum):** *Stronger than it looks.* Callum correctly identifies a category error between system and society, a distinction often blurred in popular history. His normative critique—that "collapse" implies a desirable height—exposes the value judgment hidden in structuralist terminology. However, he suppresses the premise that visitors expect periodization markers; without a strong term, the panel risks implying mere drift. His burden of proof is initially light, merely objecting to a draft, but he sets a high bar for welfare evidence that he knows is unmeetable. This move establishes the ethical stakes but risks paralyzing description by demanding data that archaeology cannot provide.

  **Move 2 (Gillian):** *Clearly right.* Gillian successfully decouples systemic capacity from individual welfare, noting that buffers protect peasants during crises. She shifts the focus from moral judgment to functional loss, which is empirically tractable. By highlighting interlocking systems—trade, literacy, redistribution—she identifies emergent properties that exist above the household level. Her argument rests on the robust archaeological visibility of these networks compared to peasant diet. She avoids the trap of defending the palace as morally good, defending it instead as a functional reality whose absence is measurable. This grounds the debate in material evidence rather than speculative quality of life.

  **Move 3 (Callum):** *Stronger than it looks.* Callum leverages genuine epistemic humility regarding demography, correctly noting that site counts conflate visibility with population. He identifies a specific methodological weakness: survey bias against dispersed hamlets. This suppresses the premise that welfare requires population stability, but his skepticism is methodologically sound. He forces Gillian onto weaker ground by demanding demographic proof for a claim about human suffering. However, he risks a negative proof fallacy: absence of evidence for decline is not evidence of stability. His move protects against overconfidence but offers no positive account of what *did* happen to the social fabric.

  **Move 4 (Gillian):** *Clearly right.* Gillian pivots successfully from demography to capability, utilizing data with higher resolution (tablet cessation, building traditions). She concedes the demographic point without surrendering the systemic argument, showing strategic flexibility. Her claim that literacy loss is a confident signal avoids the murkiness of sherd densities. This move isolates the variable of complexity from the variable of population size. She effectively argues that a society can lose its operating system even if the hardware (people) remains. This satisfies the need for empirical rigor while maintaining the thesis of significant disruption.

  **Move 5 (Callum):** *Weaker than it looks.* Callum equivocates on "civilisation," conflating elite capability with general welfare to block the term "collapse." His test requires permanent welfare loss, a condition almost impossible to prove for prehistoric populations, effectively rigging the outcome. He shifts the burden of proof onto Gillian to demonstrate negative welfare outcomes rather than systemic failure. While logically consistent with his initial premise, it renders historical description impossible given the evidence gaps. He proves that elite loss is not identical to peasant suffering, but fails to acknowledge that elite loss *is* the historical event defined by the period.

  **Move 6 (Gillian):** *Stronger than it looks.* Gillian introduces a systems-theory definition of collapse (reproductive failure) that bypasses the welfare trap. Her "cheaper error" argument is a pragmatic pedagogical claim, prioritizing visitor understanding over semantic purity. She correctly identifies that "transformation" risks under-selling the disruption to a general audience. This shifts the debate from truth-conditions to communication efficacy. However, she risks conflating epistemic utility with ontological reality; just because "collapse" teaches better doesn't make it true. Still, her asymmetry argument highlights the real risk of museum text: boring visitors into missing the scale of change.

  **Move 7 (Callum):** *Roughly even.* Callum's forward-looking argument (later health improvements) correctly notes that trajectory depends on the endpoint chosen. His Rapa Nui and Maya analogies are relevant but risky; recent scholarship disputes the ecocide narrative, weakening his support. He correctly identifies Gillian's "cheaper error" as a policy argument, exposing her shift from description to persuasion. This is a strong philosophical critique of her pedagogical defense. However, his claim that later recovery negates earlier collapse commits a temporal fallacy; a system can collapse and be replaced by a different, eventually healthier system. He wins on logic but loses on historical specificity.

  **Move 8 (Gillian):** *Clearly right.* Gillian dismantles the recovery argument by distinguishing replacement from restoration, a crucial philosophical distinction. She correctly notes that building a different system does not negate the loss of the previous one. Her handling of the analogies focuses on the fact of loss rather than the agent, maintaining her systemic focus. She exposes Callum's use of "recovery" as a narrative judgment rather than a structural one. This move secures her definition: collapse is about the end of a specific mode of organization, not the final verdict on human happiness. It closes the loop on the capability argument established in Move 4.

  3. Verbal versus substantive

  Much of this dispute would evaporate if both parties stipulated that "collapse" refers strictly to systemic discontinuity rather than human suffering. If Callum accepted "collapse" as a technical term for administrative failure, and Gillian accepted "transformation" as neutral regarding welfare, the semantic friction would dissolve. They would agree that palaces fell and villages persisted. However, a substantive disagreement would survive regarding the value of complexity. Callum implicitly argues that complexity is often parasitic, so its loss is not necessarily a loss for humanity. Gillian implicitly argues that complexity generates capacities (buffers, literacy) whose loss is historically significant regardless of exploitation. This is not a verbal dispute but a conflict in historical价值观: whether we measure history by the stability of structures or the welfare of individuals. No definition can reconcile the view that a fallen palace is a tragedy with the view that it is a liberation.

  4. What neither of them said

  First, neither addressed the temporality of the event. Collapse is often treated as a punctuated event (1200 BCE), but archaeological data suggests a process spanning generations. Framing it as a singular moment risks distorting the gradual erosion of resilience. Second, they omitted the politics of periodization. Naming an era "Collapse" privileges the perspective of the literate elite whose records cease, silencing the non-literate majority who continued living. Who gets to name the period is itself a political act that reinforces the very bias Callum critiques. Third, they ignored environmental agency. Climate change and seismic activity likely stressed these systems externally; framing collapse as internal reproductive failure (Gillian) or social choice (Callum) overlooks the exogenous shocks that made reproduction impossible. A complete account requires integrating climate data with social theory.

  5. The panel

  Around 1200 BCE, the eastern Mediterranean underwent a profound systemic breakdown. The palatial administrations coordinating long-distance trade, specialized crafts, and literacy ceased to function. While village life and farming persisted, intricate networks of redistribution and diplomatic exchange vanished. This exhibition explores the end of the Late Bronze Age order, examining both the fragility of complex states and the resilience of local communities. We consider how environmental stress, social unrest, and shifting economies contributed to this unraveling. Visitors will encounter evidence of destruction and abandonment alongside signs of continuity and adaptation. The disappearance of monumental architecture and written records marks a decisive break, yet not an end to human history. Here, we investigate not a simple catastrophe, but the complex discontinuity of a world and the diverse ways people navigated the aftermath.

  Gillian gave up the noun "collapse" for "breakdown" and "unraveling" to accommodate Callum's normative concern, while Callum accepted "ceased to function" and "decisive break" to acknowledge Gillian's systemic evidence. Both should accept this trade because it distinguishes structural failure from universal suffering without diluting the scale of the historical change.
