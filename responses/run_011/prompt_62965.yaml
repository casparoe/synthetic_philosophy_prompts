  ### PROBLEM CASES (SCHEME LIMITS)

  **Case 1: The Emergent Swarm.**
  *Description:* 1000 Skinnerian drones that collectively simulate outcomes by physical positioning before committing to a path.
  *Verdict:* **SKINNERIAN** (Individual) / **POPPERIAN** (Collective).
  *Unease:* The tree forces a single locus. If the "agent" is the colony, it passes Node 4. If the "agent" is the drone, it fails. The scheme cannot handle distributed cognition where the "internal model" is physically distributed across non-modeling units.

  **Case 2: The Self-Editing Code.**
  *Description:* An agent that rewrites its own source code (parameters) based on an internal simulation of how the new code would perform, without external tools.
  *Verdict:* **POPPERIAN** (Node 1-YES, 4-YES).
  *Unease:* This collapses the Generation/Lifetime distinction (Node 1). It creates a new generation of itself within its lifetime. The tree classifies it as Popperian, but it exhibits Darwinian selection *within* a lifetime. The nested hierarchy breaks down when an agent can evolve itself.

