answer: |-
  # SORTING INSTRUMENT: ARCHITECTURES OF AGENCY
  **Constraint:** All nodes refer to inspectable selection loci and timescales. No introspection. No proper names.

  ### DECISION TREE

  **NODE 1: Does the agent modify its decision-making parameters during operational deployment?**
  *Gloss: Distinguishes fixed-configuration agents from those with lifetime plasticity.*
  *   **NO** → Go to **1B**.
  *   **YES** → Go to **2**.

  **NODE 1B: Was the fixed configuration selected via exposure to human-generated symbolic artifacts (text, code, diagrams)?**
  *Gloss: Distinguishes biological/engineered design from cultural sediment.*
  *   **NO** → **LEAF: DARWINIAN** (Selection across generations only).
  *   **YES** → **LEAF: GREGORIAN** (Fixed but culturally scaffolded).
      *   *Note: This classifies frozen models trained on human data as Gregorian.*

  **NODE 2: Is policy selection driven solely by reinforcement signals received after action execution?**
  *Gloss: Distinguishes trial-and-error learners from those that predict consequences.*
  *   **YES** → **LEAF: SKINNERIAN** (Selection within lifetime, post-action).
  *   **NO** → Go to **3**.

  **NODE 3: Does the agent rely on manipulating external symbolic artifacts (notes, tools, retrieval) to select actions?**
  *Gloss: Distinguishes internal planning from offloaded cognitive labor.*
  *   **YES** → **LEAF: GREGORIAN** (Selection via external symbolic environment).
  *   **NO** → Go to **4**.

  **NODE 4: Does the agent test action sequences using an internal world model before execution?**
  *Gloss: Distinguishes reactive planning from simulated pre-selection.*
  *   **YES** → **LEAF: POPPERIAN** (Selection inside the agent before acting).
  *   **NO** → **ARCHITECTURAL ERROR** (Claims planning without model or reward).

  ***

  ### AMBIGUITY NOTICE: NODE 1 & GRADIENT DESCENT
  **The Question:** Does pre-deployment training (gradient descent on fixed corpus) count as "modifying parameters"?
  **Option A (Adopted Above):** Training = Generational/Design. Deployment = Lifetime.
  *   *Consequence:* Frozen LLMs are Node 1-NO. Classification depends on training data (Node 1B). Vindicates view that corpus sediment = Gregorian.
  **Option B (Alternative):** Training = Lifetime of the weight vector.
  *   *Consequence:* Frozen LLMs are Node 1-YES. Must pass through Node 2. Since they don't update at deployment, they may fail Node 2 or 3 depending on definition of "operational." Risks classifying Frozen LLM as Skinnerian or Darwinian.
  **Recommendation:** Stick to Option A for engineering inspectability. Training is "build time"; deployment is "run time."

  ***

  ### DIMENSIONAL MATRIX (INDEPENDENT CAPACITIES)
  *Dennett presents these as cumulative (nested). This matrix tests that stipulation.*

  | Gen. Selection (D) | Life. Reward (S) | Int. Sim (P) | Ext. Symbols (G) | Verdict | Status |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | 0 | 0 | 0 | **Darwinian** | Occupied (C. elegans) |
  | **1** | **1** | 0 | 0 | **Skinnerian** | Occupied (Tabular RL) |
