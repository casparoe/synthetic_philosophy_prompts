  ### CLASSIFICATION OF TEST CASES

  1.  **C. elegans:** **DARWINIAN**. (Node 1-NO, 1B-NO). *Contest:* Simple learning (habituation) exists; if hardwired plasticity counts as "parameter update," it shifts to Skinnerian.
  2.  **Honeybee Colony:** **DARWINIAN**. (Node 1-NO, 1B-NO). *Contest:* Dance language is innate, not cultural; colony selection is generational.
  3.  **Physarum plasmodium:** **DARWINIAN**. (Node 1-NO, 1B-NO). No neurons, no symbols, physical optimization only.
  4.  **Newborn human:** **DARWINIAN**. (Node 1-NO [at birth], 1B-NO [no exposure yet]). *Contest:* Potentiality vs. actuality; tree reads architecture, not potential.
  5.  **Sheepdog (trained):** **SKINNERIAN**. (Node 1-YES, 2-YES). *Contest:* If dog simulates herding outcomes internally, shifts to Popperian; behavior suggests reinforcement history dominates.
  6.  **Hand-written chess engine:** **DARWINIAN**. (Node 1-NO, 1B-NO). *Contest:* Uses search (Internal Sim), but Tree forces Darwinian due to fixed weights. Matrix shows this tension (Fixed Planner cell).
  7.  **Tabular RL agent:** **SKINNERIAN**. (Node 1-YES, 2-YES). Vindicates your stance: no model, history of reward only.
  8.  **Dyna-style agent:** **POPPERIAN**. (Node 1-YES, 2-NO, 3-NO, 4-YES). Learns model, plans internally.
  9.  **Go program (self-play):** **POPPERIAN**. (Node 1-NO [frozen], 1B-NO [no human data], *Correction:* MCTS is run-time search. If search counts as "parameter update" for the episode, Node 1-YES. If weights frozen, Node 1-NO. If Node 1-NO, 1B-NO → Darwinian. **Disagreement:** If MCTS counts as internal simulation at run-time, it should be Popperian. Tree requires Node 1-YES interpretation of "search tree as temporary params".)
  10. **Frozen LLM + tools:** **GREGORIAN**. (Node 1-NO, 1B-YES). Vindicates your stance: corpus is cultural sediment.
  11. **Online LLM + tools:** **GREGORIAN**. (Node 1-YES, 3-YES). Updates weights and uses tools.
  12. **Impaired human expert:** **GREGORIAN**. (Node 1-NO [due to illness], 1B-YES). *Contest:* Same leaf as unimpaired human (see Flagged Pair).
  13. **Notebook Agent:** **GREGORIAN**. (Node 1-YES [appends notebook], 3-YES). Notebook counts as external symbolic artifact.
  14. **Evo-Search + Model Agent:** **POPPERIAN**. (Node 1-YES [run-time model], 2-NO, 3-NO, 4-YES). Training history (Evo) ignored in favor of run-time capacity.
  15. **Private Code Agent:** **POPPERIAN**. (Node 1-YES, 2-NO, 3-NO, 4-YES). Private code is internal symbol system, not external/cultural.

