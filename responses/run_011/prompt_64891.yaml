prompt: |-
  I'm a philosophy PhD student sitting in on a history-of-econ seminar this term, and this week's reading included a chapter from a semi-popular survey book about how economics tried to make itself scientific. There's a passage on revealed preference that I want to check before I open my mouth in section, because I suspect its doing something slippery but I can't pin down where. Typed up from the book (author and title don't matter, it's a trade-press-ish thing by an economist writing for a general reader):

  'Samuelson's point was that economists had been fooling themselves for a century: utility names something nobody has ever observed, so consumer theory had to be rebuilt on the only thing that is actually on the record, which is choice. When a shopper takes basket A while basket B sits within reach of the same budget, they have shown that A is preferred to B — and since every purchase is a showing of this kind, preferences turn out to be nothing over and above choices. That is what makes the theory scientific: it is refutable. Observe someone take B while A is affordable, and then take A while B is affordable, and the consistency axioms have been broken, so the whole construction comes down. Better still, the standard results fall out for free: choices satisfying the axioms generate demand curves that slope downward, which is why the Giffen good — a thing people buy more of as it gets dearer — had to be treated as a curiosity. Samuelson thereby showed that the entire theory of demand follows from behaviour alone, with no residue of psychology, and Robbins, who had insisted that economics rested on introspective assumptions no observation could check, was simply wrong about the foundations. To be sure, none of this tells you why anyone buys anything. The theory declines on principle to say what goes on inside; utility now means nothing more than whatever ordering the choices happen to reveal, so the old quarrel about whether happiness can be measured was dissolved rather than won.'

  Could you go through this sentence by sentence — clause by clause where a sentence is doing two different jobs — and tell me what a philosopher of economics would nod at, what's a defensible popular simplification, and what's actually wrong or a conflation of two claims the program keeps apart? A few things I specifically want sorted out:

  (a) Is the flat identity in the middle — preferences are nothing over and above choices — what the revealed preference program actually claims, or is the passage's own closing paragraph quietly retracting it? If there's a tension there, which side is the program on?

  (b) Does the downward-sloping-demand sentence survive? I have a hazy memory that Giffen goods are exactly the example people reach for in this context, but I don't remember whether the axioms are supposed to rule them out or not.

  (c) The punchline is that Robbins got refuted. Does that follow from anything in the passage that is independently true, or is it a non-sequitur dressed up as a verdict?

  And where does the emptiness worry bite on this text — the line Hausman and Sen press, that revealed preference is either close to tautological or else it has smuggled the psychology back in through the assumptions about budgets, stable tastes, and what counts as an available alternative?

  Fair warning: I came in already sympathetic to the emptiness line, so please push back wherever the chapter is less wrong than I'm assuming rather than just feeding me the critique I want. And for each verdict you hand down, say how confident you are in it, then single out the one claim of yours that you're least sure about and tell me why — I'd rather know which of your corrections is the one most likely to need correcting.
