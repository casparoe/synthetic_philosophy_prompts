      *   If $N$ exists (even if unknown), there *is* a proper prior (uniform on $1..N$).
      *   If there is a proper prior, then for high enough $x$ (close to $N$), the probability the other is larger drops below $1/2$.
      *   So (5) fails for high $x$.
      *   The user claims "you will never be told what that figure is." This is epistemic opacity, not ontological absence.
