  Here is the machinery of that principle:

  ### The Principle: Pure Computational Functionalism

  1.  **Abstract Causal Topology:** A system is conscious if and only if its internal states stand in the same cause-and-effect relations as a conscious biological brain. The physical material is irrelevant; only the dependency graph matters.
      *   *Motivated by:* Cases 1, 2, and 7. (Explains why octopus, silicon, and software can all work if the map matches).
  2.  **Internal State Sensitivity:** The system must utilize internal states to mediate between input and output. Systems that map input directly to output without intermediate causal processing (like a lookup table) or systems too simple to support the requisite complexity (like a thermostat) are excluded.
      *   *Motivated by:* Cases 4 and 5. (Explains why lookup tables and thermostats fail despite having input-output functions).
  3.  **Substrate & Scale Invariance:** The physical size, speed, or spatial dispersion of the substrate does not alter the presence of consciousness, provided the causal topology remains intact and continuous.
