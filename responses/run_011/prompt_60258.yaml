answer: |-
  **JOINT STATEMENT ON THE NATURE AND FUTURE OF MORAL RESPONSIBILITY**

  **Issued by the Philosophy Society, Autumn Term**

  **Preamble**
  We, the undersigned members of the Philosophy Society, acknowledge that our recent debates regarding moral responsibility have reached an impasse. We represent two distinct positions: the **Strawsonian** view, which grounds responsibility in our unavoidable social emotions, and the **Free Will Sceptic** view, which denies that anyone ever deserves blame or praise in the ultimate sense. We recognise that our previous attempts to summarise one another's views have resulted in talking past each other. This document is an attempt at **adversarial collaboration**: a text we both endorse as an accurate map of where we stand together, where we stand apart, and what evidence would actually change our minds. We define technical terms upon their first use below to ensure clarity for all members of the Society.

  ### Part I: Agreed Claims
  *We affirm the following propositions as true, or at least as necessary starting points for any coherent discussion of this topic. We sign this section without reservation.*

  1.  **The Distinction between Excusing and Exempting:** We agree that there is a structural difference between an **excuse** (admitting the act was wrong but denying full agency due to specific circumstances, e.g., coercion or ignorance) and an **exemption** (denying that the agent is the right kind of being to be held responsible at all, e.g., severe psychosis or infancy). Even if we disagree on which agents fall into which category, we agree these are not the same logical move.
  2.  **The Nature of Reactive Attitudes:** We agree that **reactive attitudes** (emotional responses like resentment, gratitude, indignation, and guilt that respond to the good or ill will of others) are the primary psychological mechanism by which we currently hold one another responsible. They are not merely internal feelings; they shape our relationships.
  3.  **Determinism and Exemption:** We agree that the truth of **determinism** (the thesis that every event is necessitated by antecedent events and laws of nature) does not, by itself, automatically function as an exempting condition. One cannot move from "it was determined" to "they are like a child or a lunatic" without further argument.
  4.  **Moral Protest:** We agree that **moral protest** (the act of objecting to a wrong done to oneself or others) is valuable. The Sceptic retains the right to protest wrongs and seek protection, even if they reject **basic desert** (the claim that an agent fundamentally deserves suffering or reward simply in virtue of their past actions, regardless of consequences).
  5.  **The Entrenchment of Practice:** We agree that the current practice of holding responsible is deeply embedded in human psychology and social structure. It cannot be abolished by a philosophical argument alone; any proposed revision must account for the psychological cost of changing it.

  ### Part II: Table of Disagreements
  *Here we record our live disagreements. Where possible, we state the disagreement in language the other finds fair. We distinguish between **substantive** disagreements (about how the world is or what we should do) and **verbal** disagreements (about how we define words).*

  | Topic | Statement A (Strawsonian) | Statement B (Sceptic) | Type | Explanation of Trade-off |
  | :--- | :--- | :--- | :--- | :--- |
  | **Basic Desert** | Agents who act with ill will deserve to be the target of reactive attitudes as a matter of fundamental justice, not merely for social utility. | No agent ever deserves to be the target of reactive attitudes in the basic desert sense; such attitudes are only justified if they produce good future consequences. | Substantive | We disagree on whether the past action itself justifies the response, or whether only the future outcome justifies it. |
  | **The Objective Attitude** | It is psychologically impossible for humans to sustain the **objective attitude** (viewing others as objects to be managed rather than persons to be engaged with) towards all people generally. | Even if it is psychologically difficult to sustain the objective attitude generally, we are normatively required to suppress reactive attitudes that presuppose basic desert. | Substantive | The Strawsonian argues from psychological necessity ('cannot'); the Sceptic argues from normative requirement ('ought not'), even if it is hard. |
  | **Punishment** | Retributive punishment (suffering imposed because it is deserved) is sometimes morally permissible and required by our commitment to interpersonal relationships. | Retributive punishment is never morally permissible; detention is only justified by **preventive quarantine** (protecting others from harm) and moral education. | Substantive | We disagree on the moral permissibility of inflicting harm for past wrongs versus future safety. |
  | **Responsibility** | To be "morally responsible" is simply to be an appropriate target of reactive attitudes within a human community. | To be "morally responsible" requires a kind of **ultimate control** over one's actions that is impossible in a deterministic (or random) universe. | Verbal | We are trading on different definitions. The Strawsonian defines responsibility by the *practice*; the Sceptic defines it by the *metaphysical capacity*. |

  ### Part III: The Cruxes
  *These are the specific sub-questions upon which the future of our debate depends. Settling these would not necessarily end the debate, but it would force at least one of us to revise our position. We have identified three specific cruxes, including empirical predictions.*

  #### Crux 1: Addressed vs. Recorded Resentment
  We introduce a distinction proposed within the Society: **Addressed Resentment** is resentment that makes a second-personal demand upon the offender (e.g., "You must acknowledge what you did to me"). **Recorded Resentment** is a private moral sorrow or disapproval that asks nothing of anybody (e.g., "I see that you did wrong, and I sorrowfully note this fact").

  *   **The Question:** Can the practice of holding responsible be carried by Recorded Resentment alone, or does it essentially require Addressed Resentment?
  *   **The Strawsonian Worry:** If holding responsible requires Addressed Resentment (a demand for acknowledgement), then the Sceptic's model of **preventive quarantine** may collapse into Strawsonianism. If the Sceptic tells an offender, "We are detaining you because you did wrong and need education," are they not implicitly making a second-personal demand?
  *   **The Sceptic's Worry:** If holding responsible only requires Recorded Resentment, the Strawsonian loses the force of their claim that determinism leaves our *relationships* untouched. If we merely record disapproval without demanding acknowledgement, have we not already adopted the objective attitude?
  *   **Resolution Condition:** If the Sceptic can demonstrate a form of moral education that addresses the offender without demanding acknowledgement of *desert*, their position holds. If the Strawsonian can show that Recorded Resentment is insufficient to sustain human relationships, the Sceptic's revision becomes psychologically untenable.

  #### Crux 2: The Normative Force of Psychological Limitation
  This crux concerns the **Objective Attitude**. Strawsonians argue that because we *cannot* globally adopt the objective attitude, we *should not* try to base our ethics on it. Sceptics argue that a psychological limitation does not justify a moral error.

  *   **The Question:** Does the impossibility of adopting the objective attitude towards people generally do any **normative work** (tell us what we ought to do), or does it merely report a psychological limitation of our species?
  *   **The Mirror Question:** Is the Sceptic's proposed revision stable under that same limitation? If humans are naturally wired for reactive attitudes, is a society built on Sceptic principles psychologically stable, or will it inevitably fracture back into retributive emotions?
  *   **Resolution Condition:** The Strawsonian must admit that if the objective attitude *could* be sustained without psychological collapse, their argument would fail. The Sceptic must admit that if their system requires humans to act against their deep psychological nature, it is utopian and impractical.

  #### Crux 3: The Empirical Test and Defeat Conditions
  We agree to a concrete empirical test to bear on Crux 2. Participants will read a vignette establishing thoroughgoing determinism. They will be asked, at two delays (immediate and after reflection), how much resentment they feel and how blameworthy they judge the person. A second condition will render the harm vivid and second-personal (e.g., "This happened to *you*").

  *   **Strawsonian Prediction:** We forecast that determinism will cause shallow, transient suppression of resentment in abstract reflection, but that resentment will return to baseline in the vivid, second-personal condition. The practice is resilient.
  *   **Sceptic Prediction:** We forecast that suppression of resentment will deepen with further reflection and survive the vivid condition. Once the truth of determinism is grasped, the reactive attitudes will be recognised as inappropriate even in personal cases.
  *   **Defeat Conditions:**
      *   **The Strawsonian is defeated if:** Participants in the vivid condition maintain high levels of resentment *without* reporting a belief that the agent could have done otherwise. This would suggest resentment is merely aggressive, not a demand for freedom.
      *   **The Sceptic is defeated if:** Participants in the vivid condition report that, despite accepting determinism intellectually, they find it impossible to withhold resentment without feeling they are betraying their own dignity. This would confirm the Strawsonian claim that the practice is non-optional.

  **Signed,**

  *(The Strawsonian)* ____________________

  *(The Sceptic)* ____________________

  *(Date)* ____________________
