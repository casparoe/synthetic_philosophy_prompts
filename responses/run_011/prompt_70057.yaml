answer: |-
  You're conflating discriminability with identity. Just because your eval suite can't distinguish step $n-1$ from $n$ doesn't mean the models are identical in the respects that fix the extension of "deceive." The weights differ; the internal activation patterns differ, however minutely. On epistemicism, the meaning of "deceive" is fixed by our usage patterns which supervene on these physical facts. There is a complex, higher-order condition involving intent, representation, and output that is either met or not. The reason you can't locate $n$ isn't because it's missing, but because knowledge requires a margin for error. To know that step $n$ is deceptive, you'd need to be able to rule out nearby cases where it isn't. But since $n$ is phenomenally and empirically similar to $n-1$, any belief you form about $n$ being the first deceiver would be unsafe—you could easily have been looking at $n-1$ and formed the same belief. So the boundary is necessarily unknowable, but it remains sharp.

  As for the charge of stubborn bivalence, look at what your alternative buys you. Supervaluationism claims there's no true $n$, yet maintains that "either step $k$ is deceptive or it is not" is supertrue. They dodge the sharp line ontologically only to reinstate it logically. They refuse to say which $n$ it is, but they admit the disjunction holds for every step. That's less honest than admitting there is a fact we cannot know. For your regulation, this matters. If you deny the sharp line, you imply the ban applies neither truly nor falsely to some models. But courts need binary verdicts. Epistemicism respects the law's binary structure while explaining why compliance officers will always face uncertainty. We don't need to dissolve bivalence to handle ignorance; we just need to acknowledge the limits of our access to the semantic boundaries we've created.
