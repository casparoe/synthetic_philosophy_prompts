answer: |-
  **Diagnostic Instrument: The Morphology of Falsehood**

  **Introduction**
  This instrument does not test your knowledge of doctrines but maps your intuitions onto a logical space. There are five underlying variables. Your answers will locate your position within the taxonomy of lying. Answer spontaneously; do not attempt to guess the 'correct' theological or philosophical line.

  **The Variables**
  1.  **Belief:** Must the speaker believe their statement is false?
  2.  **Intent:** Must the speaker intend to induce false belief in the hearer?
  3.  **Warrant:** Must the utterance carry an implicit warrant of truth (excluding fiction, joke, stage)?
  4.  **Morality:** Does moral wrongness depend on consequences or the hearer's entitlement, rather than the act itself?
  5.  **Interiority:** Must the speaker possess a mind capable of belief?

  **The Quiz**

  **1. The Fugitive (Private)**
  A murderer asks where your friend hides. You know. To save your friend, you speak falsely.
  A) This is a lie and always sinful.
  B) This is a lie but permissible due to consequences.
  C) This is not a lie; I owe him no truth.

  **2. The Fugitive (Judge)**
  A judge interrogates you under oath about the same fugitive.
  A) I must tell the truth regardless of the outcome.
  B) I may lie if the judge acts unjustly.
  C) I must refuse to answer, but not lie.

  **3. The Midwives**
  The Hebrew midwives lie to Pharaoh to save infants. God rewards them.
  A) They lied; God rewarded their mercy, not the lie.
  B) They lied; the lie was permissible due to the good outcome.
  C) They did not lie; their duty to God outweighed duty to Pharaoh.

  **4. Abraham and Sarah**
  Abraham calls Sarah his sister, knowing she is his wife but also his half-sister.
  A) This is a lie because the intent was to deceive.
  B) This is not a lie because it was technically true.
  C) This is a lie because the implication was false.

  **5. The Belief Mismatch**
  Case A: You say 'P' believing 'not-P', but 'P' is true. Case B: You say 'P' believing 'P', but 'P' is false.
  A) Only Case A is a lie (internal mismatch).
  B) Only Case B is a lie (external falsity).
  C) Both are lies (failure of communication).

  **6. The Reflexive "I'm Fine"**
  You are distraught but say "I'm fine" to avoid burdening a colleague.
  A) This is a lie; you believe it false.
  B) This is not a lie; it is a social convention.
  C) This is a lie but morally neutral.

  **7. The Novel Narrator**
  A first-person narrator describes events that never happened.
  A) The narrator lies to the reader.
  B) The author lies, the narrator does not.
  C) Neither lies; the genre suspends the warrant of truth.

  **8. The Priscillianist Infiltrator**
  You feign agreement with a heretical sect to expose them. They permit lying; you do not.
  A) You lie because you assert what you disbelieve.
  B) You do not lie; your intent is confutation, not deception.
  C) You lie, but it is permissible for the greater good.

  **9. The Doctor's Placebo**
  A doctor prescribes a sugar pill, saying "This will help," knowing the effect is psychological.
  A) This is a lie; the pill is inert.
  B) This is not a lie; the help is real.
  C) This is a lie but justified by health outcomes.

  **10. The Hidden Money (Augustine's 6th Class)**
  You know where another's money is hidden. You say, "I do not know."
  A) This is a lie; you know you know.
  B) This is mental reservation; you mean 'I will not tell'.
  C) This is permissible; the questioner has no right to know.

  **11. The Artificial Intelligence**
  An AI confidently states a falsehood. It has no beliefs, only parameters.
  A) The AI lies; it outputs falsehoods confidently.
  B) The AI cannot lie; it lacks a mind.
  C) The AI simulates lying; the programmer lies.

  ***

  **Scoring Key**

  Do not tally scores. Map your pattern of answers to the Variables below to find your Leaf.

  **Variable Mapping**
  *   **V1 (Belief):** Q5(A), Q1(A), Q4(A) = Yes. Q5(B), Q4(B) = No.
  *   **V2 (Intent):** Q8(B), Q4(A) = Yes. Q8(A), Q5(A) = No (Intent irrelevant).
  *   **V3 (Warrant):** Q7(C), Q6(B) = Yes (Context matters). Q7(A), Q6(A) = No (Assertion is default).
  *   **V4 (Morality):** Q1(B/C), Q2(B), Q3(B/C), Q9(C) = Yes (Consequences/Rights matter). Q1(A), Q3(A) = No (Intrinsic wrong).
  *   **V5 (Interiority):** Q11(B) = Yes. Q11(A) = No.

  **The Leaves**
  1.  **Graded Augustinian Rigourism:** V1=Yes, V2=Yes, V3=Yes, V4=No, V5=Yes. *Awkward commitment:* All eight classes of lies are sinful, even to save a life; only gravity differs. (Diagnostic: Q1-A, Q3-A, Q5-A).
  2.  **Internalist Double-Heart:** V1=Yes, V2=No, V3=Yes, V4=No, V5=Yes. *Awkward commitment:* Lying is fixed by the mismatch alone; intent to deceive is irrelevant. (Diagnostic: Q5-A, Q8-A).
  3.  **Contemporary Non-Deceptionism:** V1=Yes, V2=No, V3=Yes, V4=No/Yes, V5=Yes. *Awkward commitment:* One can lie without intending deception, provided one warrants truth. (Diagnostic: Q5-A, Q8-A, Q1-B).
  4.  **Deceptionism Proper:** V1=No, V2=Yes, V3=Yes, V4=No/Yes, V5=Yes. *Awkward commitment:* True statements can be lies if intended to deceive; false statements with good intent are not. (Diagnostic: Q5-B, Q4-A).
  5.  **Register/Genre Conventionalism:** V1=Yes, V2=Yes, V3=No, V4=No, V5=Yes. *Awkward commitment:* Lying is defined by breaking genre conventions, not metaphysical falsity. (Diagnostic: Q7-C, Q6-B).
  6.  **Broad Mental Reservation:** V1=Yes, V2=Yes, V3=Yes, V4=Yes, V5=Yes. *Awkward commitment:* Truth is relative to the hearer's entitlement; ambiguous speech is truthful if the hearer lacks rights. (Diagnostic: Q10-B, Q2-C).
  7.  **Concealment Variant:** V1=Yes, V2=Yes, V3=Yes, V4=Yes, V5=Yes. *Awkward commitment:* The entire practical burden shifts to silence; any assertion is a warrant breach. (Diagnostic: Q1-C, Q2-C, Q10-B).
  8.  **Consequentialist Threshold:** V1=Yes, V2=Yes, V3=Yes, V4=Yes, V5=Yes. *Awkward commitment:* Gravity can cross over into permissibility; the midwives' lie was good. (Diagnostic: Q3-B, Q1-B, Q9-C).
  9.  **Deflationary View:** V1=No, V2=Yes, V3=No, V4=Yes, V5=No. *Awkward commitment:* There is no distinctive wrong of lying beyond deception harm or breach of warrant. (Diagnostic: Q11-A, Q7-C, Q5-C).

  **Mixed Patterns:** If you answer Internalist on definition (Q5-A) but Consequentialist on midwives (Q3-B), you hold that lying is intrinsically defined by the heart but extrinsically evaluated by outcomes. This is a stable, hybrid position common in modern Catholic casuistry.

  ***

  **Taxonomy of Logical Space**

  The five variables permit thirty-two theoretical combinations. Only nine are occupied by coherent historical or contemporary positions.

  **Occupied Cells**
  The core debate lies in the interaction of V1 (Belief) and V2 (Intent). Augustinianism occupies the cell where both are necessary, and V4 (Morality) is intrinsic. Non-deceptionists drop V2. Deceptionists drop V1. Consequentialists occupy cells where V4 is extrinsic. The AI case (V5) splits the Deflationists (who allow AI lying) from everyone else (who require a mind).

  **Unoccupied Cells**
  1.  **V1=No, V2=No, V3=Yes:** *Incoherent.* If neither belief nor intent matters, and warrant is present, any mistake is a lie. This collapses the concept into error.
  2.  **V4=No, V1=No:** *Unattractive.* To hold lying is intrinsically wrong but does not require believing falsity makes accidental falsehoods sinful. Nobody defends this.
  3.  **V5=No, V4=No:** *Unexplored.* To say AI lying is possible but intrinsically wrong regardless of harm implies machines have moral duties. This lacks a metaphysical grounding.
  4.  **V3=No, V4=No:** *Incoherent.* If warrant does not matter and morality is intrinsic, then fiction is sinful lying. Augustine explicitly rejects this (Q7), and moderns agree.

  **Indeterminacy Flag**
  **Concealment vs. Broad Mental Reservation.**
  Your instrument cannot reliably separate Leaf 7 (Concealment) from Leaf 6 (Mental Reservation). Both rely on V4 (hearers' entitlements) to justify non-assertion or ambiguous assertion. In Q10 (Hidden Money), both answer similarly (B or C). This is not a defect of design but a genuine indeterminacy in the tradition: whether one remains silent or speaks ambiguously is often a pragmatic choice within the same moral framework regarding the questioner's rights. Distinguishing them requires a variable on 'linguistic conventionalism' which would over-complicate the tree. Treat them as a single cluster regarding the *right to truth*.

  **Conclusion**
  Use this taxonomy to show students that their disagreement on Augustine is not merely textual but structural. If they diverge on V4, no amount of exegesis on V1 will reconcile them.
