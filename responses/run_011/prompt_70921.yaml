      *   Break: Duels end with a winner. Ethics ends with a *justified principle*.
      *   Asymmetry: If harm is unequal, the duel works (heavier burden wins). If harm is equal, the duel stalls (1v1 tie). That's where the "six" needs to enter. The duel analogy fails to explain *why* six ties beat one tie.

      *   *Wait, one nuance:* Scanlon's pairwise comparison *does* allow numbers to enter if the complaints are *equal*. If I am one of six, my complaint is "I die." If I am the one, my complaint is "I die." They are equal. So why save the six? Scanlon argues that a principle that says "save the one" is rejectable by the six *because* there are six of them? No, that's aggregation.
      *   *Scanlon's actual move:* He argues that if you don't know who you are, you'd choose the rule that saves the most. But that's Rawls. Scanlon tries to keep it to "Reasonable Rejection."
      *   *Okay, for the novel:* The philosopher friend's "duel" explanation is a *interpretation* (likely Frances Kamm's or similar critique/defense). I should treat it as such. The "numbers sneak in" is a known critique. I should validate that tension.

      *   *Analogy Suggestion:* **The "Universalizable Rule" Drafting.** They are lawyers drafting a contract clause.
