answer: |-
  Good morning. Welcome to the Ashcombe Centre. Looking around this room, I see the people who will fund the future, the people who will administer it, the people who will calculate it, and at least one person who wants to know if any of it exists. We are here to talk about long horizons. But we cannot talk about the long future without confronting the possibility that our timeline is not what it seems.

  We must begin with the constraint that defines our intellectual landscape. Nick Bostrom's trilemma forces us to accept one of three propositions: either civilizations like ours go extinct before reaching technological maturity, or mature civilizations choose not to run detailed simulations of their ancestors, or we are almost certainly living in a simulation ourselves.

  We do not know which disjunct is true. But for the work of this Centre, the third option is the one that demands our attention. There is a fear that if the third disjunct holds, the project of long-termism collapses. My colleague and friend, a cosmologist whose work invited me here, argues that if we are simulated, our future is bounded by a runtime we cannot control. She calls this termination risk. On her view, extinction is replaced by deletion, the arithmetic of future lives evaporates, and we should redirect our efforts to nearer, more robust goods. She worries that telling our donors otherwise is dishonest.

  I am here to argue that she is wrong about the arithmetic, though right about the levers. Accepting the third disjunct does not deflate the moral stake; it relocates it.

  Here is the argument those of you with training in probability will recognize. If simulations are possible, and if civilizations run many of them, then simulated observer moments vastly outnumber base-reality observer moments. By the principle of indifference, we should assign a high credence to being in a simulation. But this does not make our experiences illusory. Pain is pain whether it is instantiated in carbon or silicon. A life saved in a simulation is a life saved in reality, because the suffering being prevented is real to the sufferer. The moral weight of a mind does not depend on the substrate it runs on, but on the capacity to experience welfare.

  Furthermore, the scale of the simulated future need not be small. Simulations can be run faster than real time. They can be nested. They can be multiplied. If we are in a simulation, the future available to us might be vaster than the base reality future, not smaller. The number of lives still to come remains astronomical. The donors in this room who care about those sixteen-digit estimates need not fear that their contributions are buying tickets to a show that will be cancelled. The show may be nested, but the audience is real.

  However, the instrumental picture changes. If we are nested, we cannot secure our future solely by building starships or shielding against asteroids. We must also consider what makes the simulation worth continuing. This leads to a strategy I call "be interesting." Some suggest we should optimize for our simulators' curiosity, performing novelty to ensure our runtime is extended.

  I reject this. It is a bad bet and a repellent one. Ancestor simulations are presumably run for fidelity, not entertainment. Distorting our behavior to be novel rather than authentic reduces fidelity and invites deletion. More importantly, it makes the welfare of simulated people hostage to their novelty value. We should not dance for gods we cannot see. We should act according to the values we hold, not the preferences we suspect.

  This brings me to the administrators in the room. I know what you are thinking. If this is a simulation, I would like to speak to the administrator about the overhead rates on our grants. But until that meeting is scheduled, we must manage the budget we have.

  So, where does this leave us on Monday morning? It leaves us with work that is robust across both base reality and simulation. Reducing suffering, increasing resilience, and preserving the capacity for flourishing are good acts regardless of the substrate. If we are in a simulation, being a civilization that is worth keeping around means being a civilization that is good, not merely one that is loud.

  We are not here to decide if we are real. We are here to decide if we are responsible. The trilemma does not grant us exemption from morality; it expands the arena in which we must practice it. Whether our future is base or nested, the people living in it will feel joy and pain. Our task is to ensure there are more of the former and less of the latter. Go to your sessions. Do the math. Build the models. But do not build them on the assumption that nothing matters. Everything matters, precisely because we cannot be certain what container holds it.

  ***

  **Note to the Speaker**

  I committed to your thesis (Relocation/Scale) because the Termination reading undermines the Centre's mission and risks alienating donors, violating your constraint against telling them they were duped. The Relocation thesis preserves the moral imperative while acknowledging the simulation risk.

  I simplified the compute costs of nested simulations; a specialist might object that infinite nesting is physically impossible even in simulators, limiting the "vast future" claim. I also glossed over the measure problem complexities regarding observer moments.

  Your friend is right that termination risk is distinct from extinction risk and unobservable, which is a genuine strategic complication. She is also right that "be interesting" is a bad bet; optimizing for simulator curiosity is unstable and ethically corrosive. However, she is wrong that this guts the far-future arithmetic. The moral weight of simulated minds remains, and the potential scale of simulated time preserves the long-termist calculus.
