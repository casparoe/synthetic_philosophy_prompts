answer: |-
  **Prediction**
  The Council will **refuse** the incoming girl the vote.

  **The Competing Principles**
  Two principles fit your existing record equally well, but they diverge sharply on this new case:

  1.  **The Principle of Present Subjection:** The franchise belongs to anyone *currently* subject to the Council's authority (rules, timetable, and discipline), regardless of how long they will remain or whether they benefit from the outcomes.
      *   *Fits Precedents:* Explains why the Exchange Student and Partner College girl voted (currently subject) and why Staff and Parents did not (not subject to student rules). It aligns with Year 7s and 13s (currently subject).
      *   *Application to New Case:* The incoming girl is not *currently* subject to your authority; she is only *future* liable. She is refused.

  2.  **The Principle of Future Liability:** The franchise belongs to anyone who will be ultimately bound by the Council's long-term authority, regardless of their current status.
      *   *Fits Precedents:* Explains why Year 7s vote (long future) and Year 13s vote on the sports hall (despite no future benefit). It aligns with the Partner College girl (bound by timetable).
      *   *Application to New Case:* The incoming girl will be bound for seven years. She is enfranchised.

  **Where They Come Apart**
  These principles separate **current status** from **future obligation**. The *Present Subjection* principle demands you be under the Council's yoke *now* to pull on the reins. The *Future Liability* principle argues that because she will carry the burden of your decisions, she must have a hand in making them. Your precedents have never granted a vote based solely on a future relationship; every "Yes" vote involved a person currently on site and currently ruled by you.

  **Recommendation and Closest Precedent**
  You should rule to **refuse the vote**. This decision best coheres with your record because every single enfranchised group so far has shared the quality of **immediate liability**.

  The closest precedent is the **Exchange Student**.
  *   *Reasoning:* She was granted the vote despite having *no* future stake in the decisions (leaving before they took effect). This proves that *Future Impact* is not necessary for the vote. By logical inversion, *Future Liability* alone should not be sufficient. Her franchise was grounded entirely in her *current* presence and subjection to rules. The incoming girl is the exact temporal inverse: she has future liability but no current presence. To be consistent with the Exchange Student ruling, you must prioritize the "Now" over the "Later."

  **The Decisive Further Case**
  To settle whether you are truly committed to *Present Subjection* or merely *Current Membership* (which would yield the same result for the incoming girl but for different reasons), you should consider the case of:

  **A pupil on long-term medical leave (on the roll but absent from site).**

  *   **If you grant her the vote:** You are committed to **Membership**. It implies the franchise is a property of enrollment, not active subjection. This would weaken the refusal of the incoming girl (suggesting she was refused only because she wasn't enrolled, not because she wasn't present).
  *   **If you refuse her the vote:** You are committed to **Active Subjection/Presence**. This confirms that the franchise is a function of participating in the community *now*, solidifying the refusal of the incoming girl as a matter of principle, not just bureaucracy.
