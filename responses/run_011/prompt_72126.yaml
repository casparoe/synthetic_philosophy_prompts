prompt: |-
  I'm drafting the following for our office, and I'd like you to take the role of a political philosopher who has actually had to make a theory of freedom usable by people who will never read it — someone equally at home with Berlin's two concepts, with Pettit's account of freedom as non-domination, and with the way a city attorney's office reads a checklist. Please think carefully before answering, and work in American English throughout.

  The situation: I direct a small policy-analysis unit inside a mid-sized American city government. Two years ago the council passed an ordinance requiring a written impact statement for every proposed regulation, and last spring it added a line item asking us to state, for each proposal, the effect on "the liberty of residents." That phrase is doing no work at all right now. My staff is four analysts, none with philosophy training; we get one to three proposals a week; each statement goes out within two business days; and everything we publish is read aloud at council meetings by members who have already decided what they want the answer to be. I need a procedure they can run, not a seminar.

  Here is the part that a two-hour argument with a friend left unresolved, and it is the crux I need you to settle in order to build anything. My friend's position is that non-domination is not a distinct value at all: on her view, to say that someone is dominated is just to say that they face a high enough probability of interference in some future situation, so that any checklist that tracks domination separately is double-counting and should be collapsed into a single probability-weighted assessment of interference. My position is that she is describing the wrong thing — that the republican complaint is about who holds the switch and whether that holder's decisions are constrained and answerable to the person affected, so that two arrangements with identical expected interference can differ in freedom, and that a procedure built on her reduction would systematically miss the case of the unexercised power. Relatedly, she thinks the whole tripartite apparatus is redundant, since the standard triadic analysis — some agent being free from some constraint to do or become something — already absorbs the positive and negative conceptions once you allow that internal incapacity and unavailability of means count as constraints. I do not need you to referee the argument for its own sake. I need you to pick a side, because the procedure has to be built one way or the other.

  What I am asking you to produce:

  1. A short opening section in which you work out loud: list the candidate tests you considered for whether a power over someone is arbitrary or answerable, note which you rejected and why, and state your verdict on the reduction question above together with what the procedure gives up by being built that way.

  2. The procedure itself, as an ordered sequence of questions an analyst can ask of a proposal, with: what counts as a sufficient answer to each question; where the procedure stops and yields a determinate result; where it yields a genuine conflict between the concepts and must report the conflict rather than average it away; and where it hands the decision to a human because the remaining question is one of values or of justice rather than of freedom. It must include an explicit rule for what to do when we have no evidence about a relevant fact — and that rule must not quietly presume that anything unmeasured is free. It must also keep liberty separate from desirability: a proposal can be one our unit favors and still score badly, and the procedure has to be able to say so in public.

  3. A one-page output template the analyst fills in, giving a direction and a confidence level under each concept and a one-line rationale, in language a council member can follow.

  4. The procedure run on three specific proposals, in enough detail that I can see it actually functioning rather than being described:
     - Replacing our discretionary special-event permit system, in which the police chief may deny a permit for unstated reasons with no appeal, with a rule-bound system using published criteria and a hearing officer, but imposing a hard cap of one event per block per weekend.
     - A city apprenticeship and guaranteed-placement program for residents aged eighteen to twenty-four, which a matched applicant may not decline: refusing a match forfeits eligibility for three years.
     - A tenant-protection ordinance creating a rent board whose members serve at the council's pleasure and may grant case-by-case variances with no written standards and no route of appeal. I favor this ordinance on grounds of justice, and I want the run on it to be honest rather than flattering.

  5. A closing section stating what the procedure cannot do: the classes of proposal it will misjudge, the steps that are judgment calls wearing the costume of procedure, and the failure mode that would make me want to redesign it.

  On tone and commitment: I want a definite design, not a menu. Where the theory is contested — above all on the reduction question, and on whether positive liberty needs a threshold of usable options rather than formally available ones, the case of the road that leads nowhere — choose, build, and give your reasons, and say what your choice costs you. Flag explicitly the two or three places where a design decision is doing substantive philosophical work while looking like an administrative convenience. No bibliography and no reading list; I care about the reasoning, not the references. Assume we already know the definitions, and skip any preamble about what freedom might mean. Aim for something whose core an analyst could keep on a single laminated page, with the reasoning in an appendix.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Political philosopher practical enough to make theory usable by non-philosophers in a city government context. Familiar with Berlin (negative/positive liberty), Pettit (non-domination), and legal/administrative checklists.
      *   **Context:** Small policy-analysis unit, mid-sized American city. Ordinance requires impact statements on "liberty of residents." Staff: 4 analysts, no philosophy training. Workload: 1-3 proposals/week, 2-day turnaround. Audience: City Council (already decided, statements read aloud).
      *   **The Crux:** A debate between the user and a friend.
          *   Friend: Non-domination is just probability-weighted interference. Triadic analysis absorbs positive/negative liberty if internal incapacity/means count as constraints. Reductionism is efficient.
          *   User: Non-domination is about *who holds the switch* and *answerability*, not just interference probability. Unexercised power matters. Triadic analysis misses structural differences.
      *   **Task:** Pick a side on the reduction question (non-domination vs. interference) and build a procedure based on that choice.
      *   **Deliverables:**
          1.  Opening section: Reasoning process, rejected tests, verdict on reduction, costs of the choice.
          2.  The Procedure: Ordered sequence of questions, stopping rules, conflict reporting, handling missing evidence, separating liberty from desirability.
          3.  Output Template: One-page, direction/confidence/rationale per concept, plain language.
          4.  Three Case Studies: Run the procedure on specific proposals (Event Permits, Apprenticeship, Rent Board).
          5.  Closing Section: Limitations, judgment calls disguised as procedure, failure modes.
      *   **Tone/Style:** American English, definite design (no menus), explicit about philosophical choices disguised as admin convenience, no bibliography, core on a laminated page vibe.

  2.  **Deconstruct the Philosophical Crux (Reductionism vs. Structuralism):**
      *   *Friend's View (Reductionism):* Freedom = Low probability of interference. Domination = High probability of interference. If the tyrant sleeps, you're free. Efficiency is key.
      *   *User's View (Structuralism/Republicanism):* Freedom = Status of non-domination. Even if the tyrant sleeps, the *capacity* to interfere arbitrarily makes you unfree. Structure matters (answerability, constraints on power).
      *   *My Decision:* I must pick a side. Given the context (city government, regulations, power dynamics), the User's view is more robust for policy analysis. A procedure based solely on interference probability will miss regulatory capture, discretionary power without standards, and structural inequities that don't manifest as immediate interference but create chilling effects. However, I need to make it *usable*. Pure Pettit can be abstract. I need to operationalize "arbitrary power" into checkable administrative features (appeals, written standards, tenure).
      *   *Why pick the User's side?* Because the ordinance asks about "liberty," and in a legal/administrative context, *process* is liberty. If the city can screw you over without a reason, you aren't free, even if they haven't done it yet. The Friend's view collapses into cost-benefit analysis (probability * magnitude). The User's view preserves the distinct value of procedural justice as a component of freedom.
      *   *Cost:* It makes the analysis harder. It requires looking at institutional design, not just outcome prediction. It might flag benign benevolent dictatorships as unfree (which is correct philosophically but politically awkward).

  3.  **Drafting - Section 1: Opening/Reasoning:**
      *   Need to show the work. List candidate tests for arbitrariness (e.g., "does official feel like it?", "is there a written standard?", "is there appeal?").
      *   Reject subjective tests (too hard to measure). Reject pure outcome tests (misses the point).
      *   Verdict: Side with the User. Non-domination is distinct. Probability of interference is not the same as the *capacity* for arbitrary interference.
      *   Cost: We will flag policies as liberty-reducing even if they are popular or effective. We prioritize *status* over *outcome*.

  4.  **Drafting - Section 2: The Procedure:**
      *   Needs to be a flowchart/sequence.
      *   Concepts to track: Negative Liberty (Interference), Positive Liberty (Capacity/Means), Non-Domination (Arbitrary Power).
      *   Handling Missing Evidence: Default to "Unknown/Conflict" not "Free." Presume power exists unless constrained.
      *   Separating Liberty from Desirability: Explicit step. "Does this improve welfare?" is a separate box from "Does this reduce liberty?"
      *   Stopping Rules: If interference is direct and physical, stop (Negative Liberty hit). If power is discretionary without check, stop (Domination hit).
      *   Conflict: If Positive Liberty goes up (apprenticeship) but Negative goes down (mandatory), report conflict.

  5.  **Drafting - Section 3: Output Template:**
      *   Simple table.
      *   Columns: Concept, Impact (Increase/Decrease/Neutral), Confidence (High/Med/Low), Rationale (One line).
      *   Bottom line: Overall Liberty Assessment (must allow for "Mixed").

  6.  **Drafting - Section 4: Case Studies:**
      *   *Case 1 (Event Permits):* Old system = Domination (unchecked discretion). New system = Less Domination (rules/appeals) but Negative Liberty decrease (cap).
      *   *Case 2 (Apprenticeship):* Positive Liberty increase (means/capacity). Negative Liberty decrease (mandatory/penalty). Domination? Maybe low (rules-based), but mandatory nature is coercive.
      *   *Case 3 (Rent Board):* User favors this. Must be honest. Rent control might increase Positive Liberty (housing security). But Board structure = High Domination (serve at pleasure, no standards, no appeal). This is the critical test. The procedure must flag the structural domination even if the goal is just.

  7.  **Drafting - Section 5: Closing/Limitations:**
      *   What does it miss? Cultural norms, private power (unless state-enabled), long-term chilling effects hard to measure in 2 days.
      *   Judgment calls: What counts as "arbitrary"? (Defined as lack of written standard + appeal).
      *   Failure mode: When "Liberty" becomes a weapon to block all regulation. Or when the report is ignored (already happening).

  8.  **Refining the Tone:**
      *   American English.
      *   Professional, direct, slightly weary but principled.
      *   No academic jargon without explanation.
      *   "Laminated page" feel for the core procedure.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the reduction question? Yes, sided with User.
      *   *Check:* Is the procedure usable by non-philosophers? Needs to be concrete. Instead of "Is power arbitrary?", ask "Is there a written standard? Is there an appeal?"
      *   *Check:* Did I handle the missing evidence rule? Yes, "Presume constraint exists unless documented otherwise."
      *   *Check:* Is the Rent Board case honest? It must show a liberty cost despite the justice benefit.
      *   *Check:* Tone. Avoid "In conclusion." Use "Closing Section."
      *   *Check:* Philosophical choices disguised as admin convenience. Need to flag these explicitly. E.g., defining "arbitrary" as "lack of written standard" is a philosophical reduction for the sake of speed.

  10. **Final Polish:** Ensure the distinction between Negative, Positive, and Non-Domination is clear in the template but not burdensome in the procedure. Ensure the "Conflict" mechanism is clear.

  *(Self-Correction on the Reduction Question)*: I need to be very clear why I'm rejecting the friend's view. The friend says domination = probability of interference. I need to say: No, domination = *capacity* for interference without tracking. The sleeping tyrant example is classic. I will use that.

  *(Self-Correction on Procedure)*: Make sure the analysts know when to stop. If Negative Liberty is violated, don't bother checking Positive. Actually, no, the ordinance asks for "effect on liberty," implying a holistic view. But for the *procedure*, we need to assess each dimension separately then aggregate. I will structure it as three parallel tracks that converge at the end.

  *(Self-Correction on Missing Evidence)*: The prompt says "must not quietly presume that anything unmeasured is free." So if we don't know if there's an appeal process, we can't assume there isn't one? Or we can't assume there *is* one? Usually, in administrative law, if it's not written, it doesn't exist. But for liberty impact, if we don't know the constraints on power, we must assume the power is unchecked (precautionary principle for liberty). I will adopt: "If constraint is not documented, presume it does not exist."

  *(Self-Correction on Tone)*: Keep it crisp. "Work out loud" in section 1. "Procedure" in section 2.

  Let's build it.cw
answer: |-
  ### 1. Design Notes: The Reduction Question and the Cost of Clarity

  Before writing the procedure, I had to settle the argument between you and your friend. Her position is elegant: it collapses freedom into a single calculus of expected interference. If the tyrant is asleep or benevolent, the probability of interference is low, so freedom is high. It is administratively efficient because it turns liberty into a risk assessment.

  I rejected this. In a municipal context, reducing domination to probability misses the structural reality of power. A police chief who *can* deny a permit for no reason holds a power over the resident that a chief bound by written criteria does not, even if the chief never denies a permit. The resident's status differs. The friend's model cannot distinguish between a benevolent dictator and a constrained democracy if the outcomes are identical. Your unit would fail to flag the *capacity* for abuse until the abuse actually happens, at which point the impact statement is obsolete.

  Therefore, the procedure treats Non-Domination as a distinct variable from Negative Liberty (interference). It measures the *structure* of power, not just the *exercise* of power.

  I also rejected the friend's claim that the triadic model (agent/constraint/action) absorbs Positive Liberty. Saying "I am free to become X" is not the same as "I am free from interference becoming X." If the city builds a road to nowhere, negative liberty is untouched, but positive liberty is mocked. The procedure must track capacity and means separately from non-interference.

  **The Verdict:** We build for Non-Domination as a structural check, distinct from interference probability.
  **The Cost:** This procedure will generate findings that are politically inconvenient. It will label benevolent programs as liberty-reducing if they are mandatory. It will label popular protections as domination if they lack procedural safeguards. It prioritizes the *status* of the resident over the *outcome* of the policy. You will have to tell the Council that a policy they love makes residents less free, even if it makes them safer or richer.

  **Candidate Tests for Arbitrariness (Rejected vs. Accepted):**
  *   *Rejected:* "Does the official act in good faith?" (Unmeasurable in 48 hours.)
  *   *Rejected:* "Is the power rarely used?" (Confuses domination with interference.)
  *   *Accepted:* "Is the power bound by written standards?" + "Is there an administrative appeal?" + "Is the decision-maker tenure-protected?"
  *   *Reasoning:* These are document-checks. An analyst can find a yes/no answer in the draft ordinance within two days.

  **Philosophical Choices Disguised as Admin Convenience:**
  1.  **Defining "Arbitrary" as "Undocumented":** We equate the philosophical concept of arbitrary power with the administrative lack of written criteria. This misses cultural arbitrariness but captures legal arbitrariness.
  2.  **The Precautionary Principle for Missing Evidence:** If a constraint on power is not written in the bill, we assume it does not exist. This biases the report toward finding domination, but it prevents us from signing off on hidden discretion.
  3.  **Separating Liberty from Welfare:** The template forces a separation between "Good Policy" and "Free Policy." This prevents the slide where "liberty" just means "things we like."

  ***

  ### 2. The Procedure: Liberty Impact Assessment (LIA)

  **Instructions for Analysts:**
  Complete this sequence for every proposal. Do not average the results. If the concepts conflict, report the conflict. Do not consult the policy's goal (e.g., "public safety") until Step 4.

  **Step 1: Negative Liberty (Interference Check)**
  *   **Question:** Does this proposal physically prevent, legally prohibit, or penalize a specific action a resident could otherwise take today?
  *   **Sufficient Answer:** Yes/No. If Yes, list the specific action prohibited or penalized.
  *   **Stopping Rule:** If Yes, record "Decrease." Do not ask if the interference is justified yet.
  *   **Missing Evidence Rule:** If the penalty or prohibition is unclear, presume it exists. (e.g., If "violations may be punished" is stated but the punishment is undefined, record as Interference.)

  **Step 2: Positive Liberty (Capacity Check)**
  *   **Question:** Does this proposal provide a resident with a new capability, resource, or access point they currently lack, OR does it remove an existing one?
  *   **Sufficient Answer:** Identify the specific capacity (e.g., "access to housing," "skill training").
  *   **Threshold Rule:** A formally available option that is practically unusable (e.g., a permit process costing more than the event budget) counts as *no capacity*.
  *   **Missing Evidence Rule:** If funding or implementation mechanics are not specified, presume the capacity is unavailable.

  **Step 3: Non-Domination (Structure Check)**
  *   **Question:** Does this proposal grant any city agent or private entity power over a resident's interests?
  *   **If No:** Record "Neutral." Stop Step 3.
  *   **If Yes:** Ask the following three sub-questions.
      1.  Are the criteria for exercising this power written in the ordinance?
      2.  Is there a formal appeal process to a neutral party?
      3.  Is the power-holder insulated from political removal (e.g., for cause vs. at pleasure)?
  *   **Scoring:**
      *   3 Yeses = Neutral (Power is constrained).
      *   0-2 Yeses = Decrease (Domination present).
  *   **Missing Evidence Rule:** If the ordinance is silent on appeals or criteria, presume the answer is No. Silence equals discretion.

  **Step 4: The Conflict Check (Values & Justice)**
  *   **Instruction:** Compare Steps 1-3.
  *   **Rule:** If Negative Liberty decreases but Positive Liberty increases (e.g., mandatory program), record "Conflict." Do not resolve it.
  *   **Rule:** If Non-Domination decreases but the policy aims to protect vulnerable groups (e.g., rent control), record "Conflict."
  *   **Handoff:** If a Conflict exists, the analyst writes: "Trade-off identified: Liberty cost incurred for [Stated Goal]. Council must weigh value of goal against liberty cost." This hands the decision to the human.

  **Step 5: Desirability Separation**
  *   **Instruction:** In a separate box, state whether the unit recommends the policy based on efficiency/justice/welfare.
  *   **Rule:** This box must be visually distinct from the Liberty Assessment. A policy can be "Recommended" and "Liberty-Decreasing."

  ***

  ### 3. Output Template: Liberty Impact Statement

  **Proposal ID:** [Number]
  **Analyst:** [Name]
  **Date:** [Date]

  | Concept | Impact | Confidence | Rationale (One Line) |
  | :--- | :--- | :--- | :--- |
  | **Negative Liberty** (Interference) | ⬆ Increase / ➖ Neutral / ⬇ Decrease | High / Med / Low | [e.g., Prohibits X without exception.] |
  | **Positive Liberty** (Capacity) | ⬆ Increase / ➖ Neutral / ⬇ Decrease | High / Med / Low | [e.g., Provides funding for Y, but access is limited.] |
  | **Non-Domination** (Arbitrary Power) | ⬆ Increase / ➖ Neutral / ⬇ Decrease | High / Med / Low | [e.g., Grants discretion with no appeal process.] |

  **Overall Liberty Assessment:**
  [ ] Net Increase
  [ ] Net Decrease
  [ ] **Mixed/Conflict** (See below)

  **Conflict Note (If applicable):**
  *[e.g., Increases housing security (Positive) but grants Board unchecked power (Domination).]*

  **Unit Recommendation (Separate from Liberty):**
  [ ] Support / [ ] Oppose / [ ] Neutral
  **Reason:** *[e.g., Supports housing justice despite liberty cost.]*

  ***

  ### 4. Case Studies: Procedure in Action

  #### Case A: Special-Event Permit Reform
  *Proposal: Replaces discretionary police chief denial (no appeal) with rule-bound system (published criteria, hearing officer), but caps events at one per block per weekend.*

  *   **Step 1 (Negative):** **Decrease.** The hard cap prohibits a second event even if it meets all safety criteria. Interference is explicit.
  *   **Step 2 (Positive):** **Neutral.** No new resources added; access remains roughly same, just standardized.
  *   **Step 3 (Non-Domination):** **Increase.** Old system: 0/3 constraints on Chief (No written criteria, no appeal, at-will). New system: 3/3 constraints (Written criteria, hearing officer, defined process). Power is tamed.
  *   **Step 4 (Conflict):** **Mixed.** Negative Liberty decreases (cap), Non-Domination increases (less arbitrary power).
  *   **Output:**
      *   Negative: ⬇ Decrease (High Confidence) - "Hard cap prohibits otherwise safe events."
      *   Non-Domination: ⬆ Increase (High Confidence) - "Discretion replaced by written criteria and appeal."
      *   Assessment: **Mixed/Conflict.**
      *   Note: "Trades freedom to act (quantity) for freedom from arbitrary denial (status)."

  #### Case B: Mandatory Apprenticeship Program
  *Proposal: City guarantees job placement for 18-24s. Matched applicants cannot decline; refusal forfeits eligibility for 3 years.*

  *   **Step 1 (Negative):** **Decrease.** Residents are legally penalized (forfeiture) for refusing a specific action (taking the job).
  *   **Step 2 (Positive):** **Increase.** Provides significant capacity (training, income) previously unavailable to this demographic.
  *   **Step 3 (Non-Domination):** **Neutral/Decrease.** If the matching algorithm is published and appealable, Neutral. If the match is discretionary, Decrease. Assume published criteria for this run: Neutral.
  *   **Step 4 (Conflict):** **Conflict.** Positive Liberty gains vs. Negative Liberty losses.
  *   **Output:**
      *   Negative: ⬇ Decrease (High Confidence) - "Penalizes refusal of placement."
      *   Positive: ⬆ Increase (High Confidence) - "Provides guaranteed income and training."
      *   Assessment: **Mixed/Conflict.**
      *   Note: "Expands capability set but removes right to decline participation."

  #### Case C: Tenant-Protection Rent Board
  *Proposal: Creates Rent Board to grant variances. Members serve at Council's pleasure. No written standards for variances. No appeal.*
  *(Analyst Note: I favor this on justice grounds.)*

  *   **Step 1 (Negative):** **Decrease.** Landlords are prohibited from raising rents above board limits. Tenants are prohibited from negotiating above limits (depending on drafting).
  *   **Step 2 (Positive):** **Increase.** Tenants gain security of tenure and affordable housing capacity.
  *   **Step 3 (Non-Domination):** **Decrease.**
      *   Written standards? No.
      *   Appeal process? No.
      *   Insulated from removal? No (serve at pleasure).
      *   Score: 0/3. This is high arbitrary power.
  *   **Step 4 (Conflict):** **Conflict.** Positive Liberty (tenants) vs. Non-Domination (both parties subject to whim).
  *   **Output:**
      *   Negative: ⬇ Decrease (High Confidence) - "Caps rent pricing."
      *   Positive: ⬆ Increase (Med Confidence) - "Increases housing security, assuming enforcement."
      *   Non-Domination: ⬇ Decrease (High Confidence) - "Board has unchecked discretion and no appeal."
      *   Assessment: **Mixed/Conflict.**
      *   Unit Recommendation: **Support.**
      *   Reason: "Justice goal (housing security) outweighs structural liberty cost, but Council should consider adding appeal process."

  ***

  ### 5. Closing: Limitations and Failure Modes

  **What This Procedure Cannot Do:**
  1.  **Private Power:** This tool measures state liberty impacts. It will not capture domination by private landlords or employers unless the ordinance explicitly empowers them. It treats the city as the primary threat, which is accurate for a city attorney but incomplete for a philosopher.
  2.  **Chilling Effects:** The procedure relies on written text. It cannot measure the *fear* of using a permit process unless the cost is documented. It misses the "road to nowhere" unless the analyst personally knows the road is broken.
  3.  **Long-Term Status:** It measures the legal status at passage. It cannot predict if a benevolent board will turn arbitrary in five years.

  **Judgment Calls Wearing Costumes:**
  1.  **The Definition of "Written Standards":** An analyst must decide if vague language ("best interests of the city") counts as a standard. I have instructed them to count it as **No**. This is a philosophical choice favoring strict legality over administrative flexibility.
  2.  **The Confidence Level:** "Medium Confidence" is often where the analyst hides their political preference. I cannot proceduralize honesty, only require the box be filled.

  **The Failure Mode:**
  Redesign this procedure if you find the Council using the "Non-Domination" decrease as a veto against all redistributive justice. If every safety net is killed because it requires administrative discretion to allocate, the tool has become a libertarian wedge. Conversely, redesign if the "Conflict" box becomes a dumping ground where every liberty cost is ignored because the "Unit Recommendation" is Support. The liberty assessment must sting. If it doesn't sting, you aren't measuring freedom; you're writing press releases.

  **Final Note on the Reduction Question:**
  By choosing your side over your friend's, we have accepted that this office will sometimes tell the Council that a popular, effective policy makes residents less free. That is the only way the phrase "effect on liberty" does any work at all. If we only measured interference, we would just be measuring cost. By measuring domination, we measure status. That is worth the friction.
