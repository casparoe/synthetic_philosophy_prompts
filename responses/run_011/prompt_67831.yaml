      *   Verdict on blind spot vs. semantic dissolving? Yes.
      *   Where control is richer (quantitative rules)? Yes.
      *   What to say at the meeting? Yes.

  *(Self-Correction during final review)*: I need to make sure I don't dismiss Goodhart entirely. The user suspects it's just model mismatch. I should validate that *mostly* yes, but the *human* metric context adds the "Adversarial" layer that process control usually abstracts away as "noise." The "Lab Assay" in the user's example is physical truth. In HR metrics, the "Lab Assay" might be another gameable metric. That's the key residue.

