answer: |-
  This is an excellent intuition. Your suspicion is correct: the specific situation you described (MPC riding an inferential against a spec limit, causing the lab correlation to break) is the canonical process control instantiation of Goodhart's Law. The economics literature is describing feedback-induced model mismatch, often without the mathematical formalism to describe *why* the mismatch occurs.

  However, there is residue. The translation is not 1:1 because process control assumes a physical plant with consistent conservation laws, whereas metrics governance often deals with socio-technical systems where the "physics" (human behavior) changes structurally in response to the controller.

  Here is the translation of the Goodhart taxonomy into Process Control vocabulary, followed by the residue report and your strategy for the meeting.

  ---

  ### Part 1: Translation of Claims

  #### 1. Goodhart's Original Claim (Monetary Targeting)
  *   **Economics:** Targeting money supply ($M$) to control inflation ($I$) breaks the historical correlation between $M$ and $I$ because agents anticipate the policy.
  *   **Control Translation:** **Open-Loop Identification vs. Closed-Loop Operation.**
      *   You identify a model ($G_{OL}$) using step tests or historical open-loop data. This model represents the statistical regularity.
      *   You close the loop with an aggressive controller (MPC).
      *   The closed-loop dynamics ($G_{CL}$) differ from $G_{OL}$ not just because of feedback algebra, but because the operating point shifts into a region where the process is non-stationary or nonlinear. The "regularity" (the model) collapses under the "pressure" (the feedback control).
  *   **Distortion/Stretch:** Minimal. This is exactly the "Lucas Critique" in economics, which is mathematically identical to the problem of **Closed-Loop Identification** without proper dithering or instrumental variables.
  *   **Residue:** In economics, the "agents" change the process gain intentionally. In refining, the process gain changes due to physics (nonlinearity) or drift (coking). The *mechanism* of change differs, but the *effect* (model mismatch under control) is identical.

  #### 2. Regressional Goodhart
  *   **Economics:** $Proxy = Goal + Error$. Optimizing the Proxy selects for high Goal *and* high Error. In the tails, the Error dominates.
  *   **Control Translation:** **Inferential Model Residuals & Selection Bias.**
      *   Your soft sensor: $\hat{y} = \beta^T x + \epsilon$.
      *   You treat $\hat{y}$ as the true CV.
      *   When you push $\hat{y}$ to the constraint limit, you are selecting data points where $\epsilon$ is systematically positive (bias).
      *   Because the regression minimizes mean squared error (variance), it does not guarantee unbiasedness in the tails of the input distribution. By operating in the tails, the residual $\epsilon$ is no longer zero-mean white noise; it becomes correlated with the operating point.
  *   **Distortion/Stretch:** None. This is standard regression diagnostics.
  *   **Residue:** None. This is purely statistical.

  #### 3. Extremal Goodhart
  *   **Economics:** Pushing the proxy to extremes moves the system into a regime where the fitted relationship never held.
  *   **Control Translation:** **Model Validity Region / Extrapolation.**
      *   Your MPC model is linearized around a steady state.
      *   Pushing the MVs to their constraints moves the process into a nonlinear region (gain $K$ changes, dead time $\theta$ changes).
      *   The linear model is no longer a valid approximation. You are extrapolating beyond the training envelope of the step-test data.
  *   **Distortion/Stretch:** None. This is standard gain-scheduling logic.
  *   **Residue:** None.

  #### 4. Causal Goodhart
  *   **Economics:** Regulating changes the relationship being regulated (structural break).
  *   **Control Translation:** **Time-Varying Parameters / Process Non-Stationarity.**
      *   *The Hard Part:* You noted you lack Pearl-style causal apparatus. In control, "Causal" usually means "Dynamic" (time-domain). Here, it means **Structural Stability**.
      *   In standard control, we assume the transfer function $G(s)$ is invariant, even if the operating point moves. Causal Goodhart asserts that $G(s)$ *itself* changes because the control law is known.
      *   *Translation:* This is **Feedback-Induced Parameter Drift**. Example: If you control reactor temperature tightly to maximize yield, you might accelerate catalyst deactivation rates. The process gain $K_p$ decays faster *because* you are controlling temperature tightly. The act of control alters the plant physics.
  *   **Distortion/Stretch:** High. Control theory usually treats parameter drift as an external disturbance or unmodeled dynamics. Goodhart treats it as an *endogenous* consequence of the policy.
  *   **Residue:** **The Intervention Distinction.** You asked if this is load-bearing. **Yes.** In standard system ID, we distinguish open-loop (intervention on $u$) from closed-loop (feedback). But we assume the *plant* doesn't know it's being controlled. Causal Goodhart assumes the *plant* (or the agents within it) reacts to the *intent* of the control. In refining, the crude oil doesn't know you're controlling it. In metrics governance, the employees do.

  #### 5. Adversarial Goodhart
  *   **Economics:** An agent with different objectives exploits the gap between proxy and goal.
  *   **Control Translation:** **Correlated Unmeasured Disturbances / Strategic Noise.**
      *   Standard Control: Disturbance $d$ is stochastic (random walk, white noise) and uncorrelated with $u$.
      *   Adversarial Translation: Disturbance $d$ is a function of $u$ (or the setpoint $r$). $d = f(r) + \nu$.
      *   Example: If you target "Safety Incidents Reported," the "disturbance" (actual safety behavior) changes, but the "measurement" (reporting) is suppressed by the operator. The measurement noise becomes biased by the control action.
  *   **Distortion/Stretch:** **Critical.** Control theory treats disturbances as *nature*. Adversarial Goodhart treats disturbances as *optimizers*. Rendering this as a "disturbance" assumes away the fact that the disturbance is minimizing a cost function opposite to yours.
  *   **Residue:** **Game Theory.** Process control is Optimization (single objective). Adversarial Goodhart is Game Theory (multi-agent, conflicting objectives). Your MPC solver cannot solve for a Nash Equilibrium against a human operator trying to game the metric.

  ---

  ### Part 2: The Meta-Dispute (Law vs. Model Mismatch)

  *   **The Claim:** Is Goodhart's Law a fundamental law of social physics, or just "Model Mismatch under Feedback" restated alarmingly?
  *   **Control Translation:** **Robustness Margins vs. Fundamental Instability.**
      *   **Control View:** It is model mismatch. We handle this with **Robust Control** ($H_\infty$, $\mu$-synthesis). We calculate stability margins (Gain Margin, Phase Margin). We know the model is wrong. We detune (Move Suppression) to ensure stability despite mismatch.
      *   **Goodhart View:** It is a fundamental limit. No amount of robustness margin fixes it because the target *itself* corrupts the measurement.
  *   **Verdict on Residue:**
      *   For **Regressional/Extremal**: It is model mismatch. Control theory handles this better than economics (via constraint back-offs and confidence intervals).
      *   For **Causal/Adversarial**: It is a blind spot in classical control. Classical control assumes the "Goal" (True Quality) is orthogonal to the "Measure" (Sensor Reading). In metrics governance, the "Goal" (Actual Safety) is often *coupled* to the "Measure" (Reported Incidents) via human behavior.
      *   **The Blind Spot:** Observer Design. In control, we design observers (Kalman Filters) assuming the process noise and measurement noise statistics are known and invariant. Goodhart's Law implies that **the noise covariance matrix $R$ and $Q$ are functions of the Controller Gain $K_c$.** A standard Kalman Filter cannot handle noise statistics that change in response to the control signal.

  ---

  ### Part 3: Where Control Practice is Richer

  The Goodhart literature is often qualitative ("Don't do it"). Control engineering is quantitative ("Here is how much you can do it").

  1.  **Constraint Back-offs:** You do not set the MPC constraint at the spec limit. You set it at $Spec - n\sigma$. Goodhart says "Don't target the proxy." Control says "Target the proxy, but back off by 3 standard deviations of the inferential error."
  2.  **Move Suppression / Detuning:** You mentioned backing the controller off. In control, this is increasing the move suppression weight in the MPC cost function. We quantify the trade-off between Variance Reduction (performance) and Robustness (stability).
  3.  **Bias Updating:** You mentioned bias-updating against the lab. This is **Recursive Parameter Estimation**. We have rules for when to update (only when steady-state is detected) and how much to update (filtering gain).
  4.  **Validation Envelopes:** We know the validity region of the soft sensor. We have logic to freeze the inferential or revert to manual if inputs leave the training envelope (Extremal Goodhart protection).

  **The Verdict:** The Goodhart debate is largely "Model Mismatch under Feedback" dressed in sociological clothing. However, the **Adversarial** component is a genuine blind spot for control engineers. We assume sensors fail randomly; we do not design for sensors that fail *strategically*.

  ---

  ### Part 4: What to Say at the Next Meeting

  Do not use the word "Goodhart." It mystifies a problem that is engineering routine. Use your vocabulary to demystify theirs.

  **Script:**

  > "I've been analyzing the 'Goodhart' concerns through the lens of process control, specifically inferential control and MPC. What we are discussing is not a philosophical paradox, but a standard **Closed-Loop Identification problem**.
  >
  > In my field, we treat a metric as a **Soft Sensor**. Like any sensor, it has bias, noise, and a validity envelope.
  >
  > 1.  **Regressional/Extremal:** When we push a metric to a target, we are operating in the tails of the distribution. Our engineering rule is **Constraint Back-off**. We do not set the target at the limit; we set it at the limit minus the confidence interval of the measurement. If you set a target without accounting for measurement variance, you *will* drive the system into a region where the metric no longer correlates with reality. That isn't a law; it's extrapolation error.
  >
  > 2.  **Causal/Adversarial:** This is where the risk is real. In refining, if I tighten control, the process dynamics might shift (coking, drift). We handle this with **Recursive Bias Updating** against a ground truth (the Lab Assay).
  >
  > **The Critical Question for this Group:** Do we have a 'Lab Assay'?
  >
  > In refining, I have a lab test that is independent of the controller. In metrics governance, if the 'Lab Assay' is *also* a metric that people can game, then we have **Adversarial Noise**. My controllers assume noise is random. If the noise is strategic (people hiding incidents to meet the target), my control theory breaks.
  >
  > **My Recommendation:**
  > Treat every metric as an inferential model.
  > 1.  Define the **Ground Truth** (the Lab Assay). If you can't measure the goal independently of the proxy, do not control it.
  > 2.  Calculate the **Variance**. How much does the proxy deviate from the goal?
  > 3.  Apply **Move Suppression**. Do not incentivize rapid changes in the metric. Rapid optimization drives the system into the nonlinear region where the metric breaks.
  > 4.  Expect **Model Mismatch**. Plan for a quarterly 're-identification' (audit) where you check if the metric still correlates with the goal.
  >
  > Goodhart's Law is simply the observation that **Open-Loop Models fail in Closed-Loop Operation**. We solve this with Robust Control margins. Let's stop treating it as inevitable failure and start treating it as a design specification for margin and validation."

  **Summary of the Stance:**
  You are translating "Goodhart's Law" into "Robustness Margins and Model Validation." You are admitting that Adversarial Goodhart (strategic noise) is a hazard your standard tools don't fully cover, which validates the governance group's concern, but you are offering the engineering solution (Ground Truth + Back-offs + Audits) rather than the philosophical resignation ("measures are bad").
