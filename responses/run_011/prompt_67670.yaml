answer: |-
  **Exam Question**

  **Case:** A small kingdom on a silver standard experiences an overnight doubling of its money stock via a windfall shipment deposited directly into the royal treasury. Over the following year, the king spends this entire sum on foreign mercenaries and imported luxury goods (wine, plate, silk). Crucially, none of this new silver circulates among domestic farmers, weavers, or laborers. During this year, domestic money wages and prices of domestically produced goods remain static. By year's end, the kingdom's money stock has returned to its original level.

  **Questions:**
  1.  Distinguish Hume's short-run claim (money enlivens industry) from his long-run claim (money is neutral). What specific conditions must obtain for each to be true? (10 marks)
  2.  Explain why the silver leaves without the standard price-channel engaging. Does this count as the mechanism working or being bypassed? (10 marks)
  3.  What must Hume add regarding the circulation of money for the mechanism to be automatic as usually diagrammed? (5 marks)
  4.  **Bonus:** How does this change if the windfall is convertible paper credit rather than silver? (5 marks)

  ***

  **Model Answer**

  Hume's political economy relies on a crucial distinction between the immediate effects of increasing the money supply and its eventual equilibrium state. To answer this case, we must separate his claim that money stimulates industry in the short run from his claim that money is neutral in the long run, and then examine the transmission mechanism connecting them.

  First, the short-run claim is that an increase in money stock enlivens industry. This is not immediate. It depends on the money entering the hands of manufacturers and laborers before prices fully adjust. When new money arrives, wages rise before the prices of goods rise. This creates a profit incentive for producers to work harder and employ more people. The condition for this to be true is that the new money must circulate through the domestic productive sector. Conversely, the long-run claim is that the stock of money is indifferent to national wealth. Eventually, prices rise proportionally to the money supply. Once prices adjust, the competitive advantage disappears, and the real economy returns to its natural level based on labor and technology, not the quantity of silver. The condition for this is time enough for prices to fully permeate the market.

  In the provided case, the standard price-specie-flow mechanism is bypassed, even though the result (silver leaving) looks the same. Usually, Hume argues that more money raises domestic prices, making exports expensive and imports cheap, which drains the silver. Here, domestic prices and wages did not move. The silver left not because domestic goods became uncompetitive due to inflation, but because the king directly demanded foreign goods. The treasury acted as a sieve, taking silver in and sending it straight out to foreign mercenaries and merchants. Since the money never touched domestic farmers or weavers, the stimulus effect never triggered, and domestic prices never rose. Therefore, the return to the original money stock is not the result of the price mechanism correcting a trade imbalance caused by inflation. It is the result of direct fiscal drainage. The mechanism is bypassed because the link between money stock and domestic prices was severed by the king's spending habits.

  For the mechanism to be automatic in the way students usually diagram it, Hume must assume something about the velocity and distribution of money that is not strictly logical but sociological. He assumes money enters the economy through domestic channels and circulates slowly. It must pass through many hands before leaving the country. If the money stays with the sovereign or is spent immediately on imports, the price signal never generates. For the diagram to work, the new silver must mix with the domestic populace, raising prices gradually, which then alters trade flows. Hume relies on the idea that money permeates the body politic like water, raising the level everywhere. If it is poured into a bucket with a hole (the king's import spending), the level never rises. The automaticity depends on the money being spent domestically first.

  Regarding the bonus on paper credit: Hume is generally skeptical of paper money. If the windfall were convertible paper, the effect might be more volatile. Paper credit can expand faster than silver, potentially raising prices more quickly even if spent similarly. However, Hume worries that paper drives out silver. If the kingdom issued paper to match the windfall, holders might demand conversion, draining the silver reserves faster than if the silver itself were spent. Alternatively, if the paper is not trusted, it might not circulate at all, failing to enliven industry even if spent domestically. The key difference is that paper lacks the intrinsic stability of silver, making the adjustment period shorter and the risk of collapse higher, potentially preventing the long-run neutrality from ever settling smoothly.

  ***

  **Marking Scheme (Total 25 Marks)**

  **Part 1: Short-Run vs. Long-Run Claims (10 marks)**
  *   **5 marks:** Correctly identifies short-run claim (money stimulates industry/profit) and long-run claim (money neutrality/proportionality).
  *   **5 marks:** Correctly identifies conditions: Short-run requires money to reach laborers/manufacturers before prices rise; Long-run requires sufficient time for price adjustment.
  *   *Typical Blow-up:* Students conflate the two, claiming Hume thinks money always stimulates or always inflates prices immediately.

  **Part 2: Application to Case (10 marks)**
  *   **5 marks:** Explains that silver left due to direct demand for imports (fiscal drainage), not because domestic prices rose making exports uncompetitive.
  *   **5 marks:** Correctly diagnoses mechanism as "bypassed" (price channel inactive) rather than "working" (price channel active).
  *   *Typical Blow-up:* Students insist the mechanism worked simply because the silver left, ignoring the static prices/wages constraint in the prompt.

  **Part 3: Automaticity Condition (5 marks)**
  *   **5 marks:** Identifies that Hume assumes gradual domestic circulation/permeation of money through the populace, not immediate sovereign spending abroad.
  *   *Typical Blow-up:* Students argue the mechanism is always automatic regardless of who spends the money.

  **Anachronism Penalty (Deduction up to 5 marks)**
  *   **Trigger:** Using modern terminology (e.g., "velocity of money," "quantity theory of money," "aggregate demand") without linking it back to Hume's specific language about industry, proportions, or circulation.
  *   *Note:* Econ majors often reach for modern macro vocabulary. Deduct 2 marks for mild usage, 5 marks if the answer relies entirely on modern frameworks ignoring Hume's text.

  **Bonus (5 marks)**
  *   **5 marks:** Notes volatility of paper, potential for faster price rise, or risk of conversion draining silver reserves.
  *   *Typical Blow-up:* Treating paper and silver as perfectly identical in Hume's view.

  ***

  **Closing Commentary**

  A first-class answer distinguishes between the *result* (silver leaving) and the *process* (price adjustments vs. direct spending), recognizing that Hume's theory relies on a specific sociological transmission mechanism, not just arithmetic balance. A solid pass identifies the static prices but may struggle to explain why that invalidates the standard diagram. The single sentence that tells you the student hasn't understood the issue at all is: "Hume shows that any increase in money supply must inevitably cause inflation before the silver leaves."
