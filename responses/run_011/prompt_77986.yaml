  ### V. Clerks' Hat: Advice for Maximal Consistency

  If I were drafting the opinion for the Court to ensure maximal consistency with the five prior decisions, here is the strategy:

  **1. The Holding:**
  Rule for the **Woman** under **Article 14 ("No Law")**.

  **2. The Closest Analog:**
  **Case 5 (1985 Named Family Expropriation).**
  *   **Respect:** Both cases involve procedurally perfect enactments that were voided due to *substantive content* rather than procedural failure. Both use the language of "not a rule" or "not a purpose law can serve."
  *   **Breakdown:** Case 5 involved a *specific* family (bill of attainder). The 1998 Act involves a *class* (married women). The Estate will argue that Case 5 is limited to "named persons" (Fullerian generality), whereas the 1998 Act is general.

  **3. Resolving the Breakdown:**
  The Court must articulate that "Generality" in Karvenia is not merely formal (applying to a class) but substantive (applying to *citizens* equally). A law that creates a caste system within the citizenry fails the generality requirement of the Rule of Law, just as a law naming a single family does. This bridges Case 5 and the 1998 Act without overruling Case 2 (*Boiler*), because *Boiler* regulations did not strip legal capacity or dignity.

  **4. The Principles Committed:**
  *   **If ruling for the Estate (Act was Law):** The Court commits to the principle that **Formal Validity Trumps Substantive Justice.** It signals that so long as the Directorate followed its own procedures, even laws stripping human capacity are "Law." This undermines Case 5's reasoning and suggests Case 5 was an outlier. It validates your Positivist theory but makes the Court look morally hollow.
  *   **If ruling for the Woman (Act was No Law):** The Court commits to the principle that **Equal Dignity is Constitutive of Legality.** It signals that there are moral boundaries to what can count as law, regardless of procedure. This validates your classmate's Natural Law theory.
  *   **The Clerk's Recommendation:** Rule for the Woman under Article 14.
      *   *Why?* Case 4 (*Pension*) shows the Court is willing to disrupt settled expectations (pensions) to remedy "manifest injustice." Case 5 shows the Court is willing to call unjust acts "No Law."
      *   *Consistency Check:* If the Court uses Article 20 (Repair) here, it creates a tension with Case 5. Why was the 1985 Expropriation "No Law" (Art 14) but the 1998 Marital Act merely "Unjust" (Art 20)? Both were procedurally perfect. Both were substantively oppressive. To distinguish them, the Court would have to argue that political expropriation is worse than sex discrimination, a hierarchy of rights the Constitution (Art 2) does not support.
      *   *Conclusion:* The only way to reconcile Case 2 (Stability), Case 4 (Remedy), and Case 5 (Substantive Voidance) is to hold that **laws destroying legal capacity are "No Law,"** while laws regulating conduct (Boilers) or redistributing wealth (Pensions) are "Law" subject to repair. This preserves stability for commerce (Case 2) while protecting personhood (Case 5 & New Case).

  **Final Note for your Assignment:**
  Your argument with your classmate is a false dichotomy. The Court is likely an **Incorporationist Positivist Court.** It does not appeal to external Natural Law; it appeals to the *Constitution's* incorporation of dignity (Art 2) into the definition of law (Art 14). It talks like a Natural Lawyer because the Constitution demands it. You win on the "Positivist" label (it's about the Constitution, not morality), but your classmate wins on the "outcome" (the law is void for injustice). The trick is to show that Article 14 *is* the rule of recognition for the new Republic, making the moral judgment a legal one.
