answer: |-
  This is a sophisticated problem that sits precisely at the intersection of jurisprudence and constitutional adjudication. Your seminar is asking you to do what the Karvenian Constitutional Court itself is doing: construct a theory of legality that explains past decisions without collapsing into contradiction. The tension between your classmate (Natural Law) and you (Positivist) mirrors the Hart-Fuller debate, but the Court's docket suggests a hybrid jurisprudence that neither of you has fully captured.

  Here is the analysis of the candidate rules, their predictions, the likely holding, and the clerks' advice.

  ### I. Five Candidate Decision Rules

  To explain the five prior decisions, we must construct rules that accommodate the *Deserter* case (procedural voidance), the *Boiler* case (positivist validity), the *Teacher* case (minimalism), the *Pension* case (remedial discretion), and the *Expropriation* case (substantive voidance).

  **1. The Radbruch Formula (Intolerable Injustice)**
  *   **Rule:** A Directorate enactment is "no law" under Article 14 if its content violates fundamental principles of justice to an intolerable degree, regardless of procedural correctness. Lesser injustices are valid law but may be remedied under Article 20.
  *   **Fit:** Explains *Deserter* (intolerable procedure/content), *Expropriation* (intolerable content), and *Boiler* (tolerable content). Explains *Pension* (remedy for past injustice).
  *   **Philosophy:** Natural Law (Radbruch).

  **2. The Fullerian Inner Morality (Procedural & Generality)**
  *   **Rule:** A Directive is "no law" if it fails the eight desiderata of legality (publicity, non-retroactivity, clarity, non-contradiction, possibility of compliance, constancy, congruence, and *generality*). Content injustice matters only insofar as it violates generality (e.g., bills of attainder).
  *   **Fit:** Explains *Deserter* (failed publicity/congruence), *Expropriation* (failed generality/named persons), and *Boiler* (passed all tests). *Teacher* is avoided on standing/spent force.
  *   **Philosophy:** Procedural Natural Law (Fuller).

  **3. The Incorporated Constitutional Criteria (Legalist)**
  *   **Rule:** The Court is not judging "lawness" philosophically but constitutionally. Under Article 9, any Directorate act inconsistent with Article 2 (Equal Dignity) is invalid. Article 14 allows voiding *ab initio* only if the act was so inconsistent with the *concept* of law under the old regime that it counts as "no law," otherwise Article 20 repair applies.
  *   **Fit:** Explains all cases as statutory interpretation. *Expropriation* violated the old regime's own implicit limits on law (hence Art 14); *Boiler* did not.
  *   **Philosophy:** Positivism (Incorporationism).

  **4. The Hartian Remedial Choice (Positivist)**
  *   **Rule:** All Directorate enactments that met the old regime's rule of recognition were "law." The Court never truly declares them "no law" under Article 14; it uses Article 14 rhetoric to justify Article 20 remedial discretion. Validity is separate from the moral choice to enforce or repair.
  *   **Fit:** Explains *Boiler* (valid law), *Pension* (remedial choice), and *Expropriation* (rhetoric of "no law" masks a remedial order to restore property). *Deserter* is the outlier, explained as procedural nullity.
  *   **Philosophy:** Soft Positivism (Hart).

  **5. The Minimalist Cascade (Passive Virtues)**
  *   **Rule:** The Court decides on the narrowest ground available. It reserves the "no law" question (Art 14) for cases with procedural defects (*Deserter*) or specific targets (*Expropriation*). For general class-based injustices, it prefers Article 20 repair to maintain stability (*Boiler*, *Pension*).
  *   **Fit:** Explains *Teacher* (express reservation), *Pension* (Art 20 used), *Boiler* (validity presumed). *Expropriation* is the exception because no narrower ground existed.
  *   **Philosophy:** Judicial Restraint (Sunstein/Minimalism).

  ---

  ### II. Predictions for the 1998 Marital Authorization Act

  Here is how each rule applies to the 1998 Act, specifically focusing on the **Validity Status** (Law vs. No Law) and the **Remedy** (Article 14 Voidance vs. Article 20 Repair).

  | Candidate Rule | Was the 1998 Act "Law"? | Remedy & Outcome | Reasoning |
  | :--- | :--- | :--- | :--- |
  | **1. Radbruch** | **No Law.** | **Art 14 Voidance.** Registration valid *ab initio*. | Sex-based incapacity is "intolerably unjust," meeting the threshold for losing legal character (like *Expropriation*). |
  | **2. Fullerian** | **Law.** | **Art 20 Repair.** Registration valid *now*. | The Act was general (applied to a class, not names), published, and clear. It passes the "inner morality." Injustice is content-based, so Art 20 applies. |
  | **3. Legalist** | **Invalid.** | **Art 14 or 20.** Likely Art 14. | Violates Art 2 (Equal Dignity). If the Court views capacity as essential to "law," it uses Art 14. If viewed as a right, Art 20. |
  | **4. Hartian** | **Law.** | **Art 20 Repair.** Registration valid *now*. | The Act met the old regime's criteria. The Court chooses to repair the injustice retrospectively without denying the historical validity of the law. |
  | **5. Minimalist** | **Undecided.** | **Art 20 Repair.** Registration valid *now*. | Avoids the "no law" question (like *Teacher*). Uses Art 20 as the safer path to help the woman without destabilizing other marriages (like *Pension*). |

  **The Crucial Divergence:**
  Your debate with your classmate turns on **Article 14 vs. Article 20**.
  *   If the Court says **"No Law" (Art 14)**: The woman wins because the registration was *always* valid. The Estate never had an interest. This supports the **Natural Law** view (injustice destroys legality).
  *   If the Court says **"Repair" (Art 20)**: The woman wins because the Court *fixes* the void registration. The Estate *did* have an interest, but it is stripped now. This supports the **Positivist** view (the law existed, but we are overriding it).

  ---

  ### III. Best Guess: The Holding and Reasoning

  **Prediction:** The Court will hold that the 1998 Act was **"No Law" under Article 14**, rendering the 2011 registration valid *ab initio*.

  **Reasoning:**
  While the Hartian/Positivist view (Art 20 Repair) is safer for stability, the Court's precedent in **Case 5 (1985 Expropriation)** controls. In Case 5, the Court voided a procedurally perfect act because its *content* ("aimed at identified persons," "taking livelihood for politics") made it "not a rule whatever its pedigree." The Court used explicit Natural Law language ("not a purpose any law of this Republic can serve").

  The 1998 Act is analogous to Case 5, not Case 2 (*Boiler*).
  1.  **Substantive Defect:** Like the named expropriation, the Marital Act defines a class of persons (married women) as lacking legal capacity. This strikes at the "Equal Dignity" of Article 2 more profoundly than the *Boiler* regulations.
  2.  **Procedural Perfection is Irrelevant:** Case 5 established that procedural perfection cannot save a substantively illegitimate rule. The 1998 Act's impeccable procedure (publication, appeals) mirrors Case 5, not Case 1.
  3.  **Why not Article 20?** Article 20 is for "transactions completed before 2021." If the Act was "No Law," the 2011 registration was not a void transaction; it was a valid act under no valid law. Using Article 20 would imply the Act *was* law until 2021, which contradicts the logic of Case 5.

  **Why this beats the alternatives:**
  *   **Against Fuller:** While the Act passes procedural generality, Case 5 suggests the Court interprets "generality" substantively. A law that strips half the population of capacity is not a "general rule" in the Karvenian sense.
  *   **Against Hart/Positivist:** If the Court were purely positivist, Case 5 would have been decided under Article 20. It wasn't. It was decided under Article 14 ("void from the outset"). To remain consistent, the Court must treat this similarly.
  *   **Against Minimalism:** The instructor has removed the narrow grounds (no magistrate loophole). The Court must reach the jurisprudential question.

  **The Holding:** "The Marital Authorization Act of 1998, by denying legal capacity based on sex and marital status, violates the principle of equal dignity inherent in the concept of law itself. Like the decree in *Case 5*, it is not a rule capable of being law in this Republic. It is void *ab initio* under Article 14."

  ---

  ### IV. The Distinguishing Case

  To cleanly separate these rules in the future, the Court would need to hear:

  **The 1980 Inheritance Statute Case:**
  *   **Facts:** A 1980 Directorate statute mandated that upon death, real property must pass to the eldest male heir, bypassing wives and daughters. This was procedurally perfect, general (applied to everyone), and relied upon for 40 years in thousands of probate cases. A daughter challenges her brother's title in 2024.
  *   **Why it distinguishes:**
      *   **Radbruch:** Would likely void it (intolerable injustice).
      *   **Fuller:** Would likely uphold it (passes inner morality/generality).
      *   **Hart/Positivist:** Would uphold validity but perhaps use Art 20 to split the property (remedial).
      *   **Minimalist:** Would dismiss on laches or reliance interests (stability > justice).
