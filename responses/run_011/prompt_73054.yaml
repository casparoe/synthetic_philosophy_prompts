      *   *Refining the Age Issue:* In engineering, we *do* account for age in the P-F curve (the time between Potential and Functional failure). But we don't change the *failure definition*. A bearing is failed when it hits a vibration threshold, regardless of whether it's 1 month old or 10 years old. Medicine changes the threshold based on age. That's the key distinction.

  10. **Final Polish:** Check against constraints. No citations. Pick a side. Ensure the "Residue Report" is distinct. (Proceed to generate output).

