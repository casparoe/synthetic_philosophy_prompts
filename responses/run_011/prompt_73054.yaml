          5.  **Constraint:** Pick a side and defend it. No citations/reading lists.

  2.  **Deconstruct the Philosophical Debate (Naturalism vs. Normativism):**
      *   *Naturalism (Boorse):* Disease is a statistical deviation from species-typical function. It's objective, biological, value-free. Health is normal functioning.
      *   *Normativism:* Disease is a social construct based on harm, values, and what we *want* to avoid. Health is what we value.
      *   *The Tension:* Is a 90-year-old with arthritis "diseased"? Naturalism says maybe not (statistically normal for age). Normativism says yes (it causes pain/harm).

  3.  **Deconstruct the Engineering Context (Reliability/PdM):**
      *   *Nameplate:* Design intent (Ideal State).
      *   *Tolerances:* Acceptable deviation.
      *   *FMEA (Failure Modes and Effects Analysis):* Cataloging how things break and the impact.
      *   *Criticality:* How much does this matter?
      *   *Run-to-Failure vs. Condition-Based:* Strategy choices.
      *   *Derating:* Operating below design specs intentionally.
      *   *Reference Class:* In engineering, this is usually "same model batch" or "design spec," not necessarily "age."

  4.  **Drafting the Mapping (Brainstorming Phase):**
      *   *Naturalism -> Design Intent/Nameplate.* Health = Meeting Spec. Disease = Deviation from Spec. But wait, Boorse includes age. So, Health = Meeting Spec *for that asset class/age*.
      *   *Normativism -> Criticality/Impact.* Health = Running without causing production loss/safety risk. Disease = Anything that threatens the goal (production).
      *   *The Age Problem:* In engineering, we *do* have wear curves (P-F curves). But we don't usually say "It's okay to vibrate more because it's old." We say "Replace it."
      *   *Mapping Choice:*
          *   Naturalism = Statistical Process Control (SPC) within a specific asset cohort.
          *   Normativism = Functional Requirement / Production Criticality.

  5.  **Developing the "Residue Report":**
      *   *Clean Translations:* "Function" maps well. "Failure" maps well.
      *   *Bent Translations:* "Normal for age." Engineering hates this. We call it "wear" or "end of life," not "health."
      *   *Missing:* The concept of "suffering." Machines don't suffer. The *plant* suffers (downtime).

  6.  **Addressing the Specific Worry (The 20-Year-Old Pump):**
      *   *The Scenario:* Pump @ 60% nameplate.
      *   *Engineering View:* It's failed its design intent. Derate or scrap. It is *not* "healthy for its age."
      *   *Medical View:* 90-year-old human @ 60% lung capacity. "Normal for age." Not necessarily "diseased."
      *   *The Core Question:* Is engineering missing something (can't express age-relative normality) OR is medicine smuggling in values (calling aging "healthy" to avoid the label of disease)?
      *   *My Stance:* I need to pick a side.
          *   *Option A:* Engineering is incomplete. It lacks a concept of "graceful degradation" as a state of being, not just a pre-failure state.
          *   *Option B:* Medicine is smuggling values. "Normal for age" is a policy decision to limit treatment costs/expectations, not a biological fact.
      *   *Decision:* Option B is stronger philosophically and fits the "Philosopher of Medicine" persona better, while respecting the engineering rigor. It aligns with the Normativist critique but uses Engineering to prove it. The "Nameplate" in medicine is a myth. In engineering, the Nameplate is real. Therefore, when medicine adjusts the "Nameplate" for age, it is making a *value* judgment about resource allocation and expectations, not describing a biological state.

  7.  **Refining the Argument (The "Defense"):**
      *   Engineering distinguishes between *Design Capacity* and *Operational Limit*.
      *   Medicine conflates *Statistical Frequency* with *Functional Adequacy*.
      *   The pump at 60% is *reliably broken*. The 90-year-old at 60% is *statistically common*.
      *   Calling the 90-year-old "healthy" is a normative choice to stop treating aging as a pathology.
      *   Engineering is actually *more* honest here. We admit the pump is degraded. Medicine hides the degradation behind "normal aging."

  8.  **Drafting the Content (Iterative refinement for tone):**
      *   *Tone:* Respectful, peer-to-peer (engineer to engineer), but philosophically sharp. No fluff.
      *   *Structure:*
