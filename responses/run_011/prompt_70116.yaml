      *   *Test the Two Questions Claim:* Distinguish *Stoicism as History* vs. *Stoicism as Therapy*.
      *   *The "Third Bucket" Correction:* Camp B isn't inventing a third bucket; they are rediscovering the *Reserve Clause*. This is the key insight to offer. Epictetus *does* account for "partly up to us" via the reservation of the outcome.
      *   *What Progress Looks Like:*
          1.  Terminology shift (Control -> Assent/Agency).
          2.  Re-introducing the Reserve Clause (I will do X, *fate permitting*).
