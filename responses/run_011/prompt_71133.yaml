prompt: |-
  Im a philosopher of science and in about three weeks I'm giving a talk at an interdisciplinary workshop that's effectively hosted by an economics department. Room will be maybe twenty applied macro people who build and estimate DSGE models for a living, two econometricians who do mostly local-projection and VAR work and are openly sceptical of structural modelling, and one historian of economic thought who is the only person there who has actually read Lakatos rather than picking up the vocabulary from a methods seminar. Nobody else has encountered more than a paragraph of him.

  The thesis is deliberately awkward and I want to be ready for it. Sketch: mainstream DSGE macro is a degenerating research programme in Lakatos's sense — the hard core (optimising agents, rational expectations, equilibrium as the organising device) has been shielded since 2008 by an ever-thickening protective belt of auxillary hypotheses, financial frictions, heterogeneous agents, occasionally binding constraints, news and policy shocks, that absorb anomalies without yielding genuinely novel predictions that then come out true. Theoretically progressive, empirically not. But, and this is the part that's going to annoy everybody, I argue the upshot is conservative rather than revolutionary. The heterodox people in the audience want me to say we should switch to agent-based modelling or to purely reduced-form atheoretic work, and I'm going to say no: those aren't rival programmes at all in Lakatos's terms, they're toolkits with no hard core and no positive heuristic, so they can't generate a progressive problemshift even in principle. Since on his account you only abandon a degenerating programme once a rival is there to take over, DSGE stays — as the only candidate that could ever get better. So I'll be telling a room full of DSGE users their work is degenerating and telling the critics their alternative doesn't qualify.

  Give me a prep sheet, not a defence of the thesis. Specifically:

  - the eight to ten objections I'll actually get from this room, not the ones a philosophy of science audience would raise, ordered by how much damage they'd do to the talk. Phrase each the way that person would actually say it out loud: an applied macro person sounds different from an econometrician, and the historian will go for the methodology-of-the-methodology jugular.
  - for each objection, a reply I can deliver standing up in about two minutes, plus an honest line on where the reply is soft or is just my thesis restated more loudly.
  - which two or three I should concede ground on up front, and exactly what to concede so it buys credibility without gutting the argument.
  - the single reply that has to land for the talk to have been worth giving — if only one thing survives into the discussion, which is it.
  - the question I'm quietly hoping nobody asks.

  Also tell me if you think one of my two halves is much weaker than the other, because I suspect the "the alternatives aren't rival programmes" half is carrying more weight than I'd like. And please don't invent sources or put words in Lakatos's mouth between quotation marks — paraphrase the concepts, and mark anything you're less than sure about so I can check it myself.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User and Context:**
      *   **User:** Philosopher of science.
      *   **Audience:** ~23 people. 20 applied macroeconomists (DSGE builders/estimators), 2 econometricians (VAR/Local Projections, skeptical of structure), 1 historian of economic thought (the only real Lakatos expert).
      *   **Topic:** DSGE as a degenerating research programme (Lakatosian sense), but arguing *against* abandoning it for heterodox alternatives (ABM, reduced-form) because they lack a "hard core" and "positive heuristic."
      *   **Goal:** A prep sheet, not a defense. Needs specific objections, replies, concessions, the "one thing" that must land, and the "feared question."
      *   **Constraint:** No fake quotes/sources. Paraphrase Lakatos. Mark uncertainty.
      *   **Tone:** Professional, sharp, realistic, acknowledging the awkwardness of the thesis.

  2.  **Deconstruct the Thesis:**
      *   *Claim 1:* DSGE is degenerating (protective belt thickening, no novel facts).
      *   *Claim 2:* Alternatives (ABM, Reduced-form/VARs) are not rival *research programmes* (no hard core/positive heuristic).
      *   *Conclusion:* Stick with DSGE because it's the only game in town that *could* become progressive again.
      *   *Risk:* Claim 1 annoys DSGE folks. Claim 2 annoys Econometricians and Heterodox/ABM folks (if any were present, but here the econometricians are the critics). The Historian will check the Lakatos usage.

  3.  **Brainstorming Objections (Audience Specific):**
      *   *DSGE Practitioners:* "We *do* make novel predictions." "Policy counterfactuals count as novel facts." "You don't understand the estimation." "Degenerating is too harsh; it's normal science."
      *   *Econometricians:* "Reduced-form *is* a programme." "DSGE is just calibration with extra steps." "Why keep a degenerating core?"
      *   *Historian:* "You're misusing Lakatos." "Lakatos didn't mean 'stick with it forever'." "Is 'optimization' really the hard core?"
      *   *General:* "What counts as a novel fact in macro?" "Isn't this just status quo bias?"

  4.  **Selecting and Ordering Objections (Damage Potential):**
      *   *High Damage:* The Historian (methodological accuracy), The "Novel Fact" definition (empirical content), The "Why Stay?" normative jump.
      *   *Medium Damage:* DSGE practitioners feeling misunderstood, Econometricians claiming their toolkit is a programme.
      *   *Low Damage:* Specific technical defenses of DSGE (too granular).

      *Drafting the Objections in Voice:*
      1.  *Historian:* "Lakatos talks about *progressive problemshifts*, not just empirical hits. You're conflating empirical progress with theoretical progress." (High Damage - undermines the Lakatos framework).
      2.  *DSGE Macro:* "We *do* make novel predictions. We predicted the zero lower bound effects/scaling of multipliers before the data came in." (High Damage - undermines the 'degenerating' claim).
      3.  *Econometrician:* "VARs have a hard core: identification via exogenous variation. You're defining 'programme' to exclude anything you don't like." (Medium/High - undermines the 'no alternative' claim).
      4.  *DSGE Macro:* "If DSGE is degenerating, why is it still the only framework that can handle welfare analysis and policy counterfactuals?" (Medium - pragmatic defense).
      5.  *Historian:* "Lakatos allows for pluralism during degeneration. You're arguing for monopoly." (Medium - normative leap).
      6.  *DSGE Macro:* "The protective belt *is* where the science happens. Frictions aren't ad hoc; they're microfounded." (Low/Medium - technical defense).
      7.  *Econometrician:* "You're telling us to keep using a map we know is wrong because the other maps are blank." (Rhetorical punch).
      8.  *General:* "What would actually count as falsification for you?" (Methodological).

      *Refining for the Prompt:* Need 8-10, ordered by damage. Need to sound like the specific personas.

  5.  **Drafting Replies:**
      *   Must be ~2 mins spoken.
      *   Must admit where it's soft.
      *   Must avoid fake quotes.

  6.  **Concessions:**
      *   Need to buy credibility.
      *   Concede on "Degenerating" vs "Dead."
      *   Concede on the definition of "Novel Fact" in macro (it's tricky).

  7.  **The "One Thing" that must land:**
      *   It shouldn't be "DSGE is bad." It should be "Methodological monism is risky, but methodological anarchy is useless." Or specifically: "The distinction between a *toolkit* and a *research programme*." This justifies why VARs/ABM aren't replacements.

  8.  **The Feared Question:**
      *   "If DSGE never becomes progressive again, how long do we wait?" (The death timeline).
      *   Or: "Is this just a sophisticated way of saying 'I don't have a better idea'?"

  9.  **Evaluating the Two Halves:**
      *   Half 1 (DSGE is degenerating): Standard critique, defensible.
      *   Half 2 (Alternatives aren't programmes): This is the weak spot. VARs *can* be framed as a programme (Sims). ABM *can* claim a hard core (complexity). This needs careful handling.

  10. **Review against Constraints:**
      *   No fake quotes.
      *   Mark uncertainty on Lakatos interpretation.
      *   Tone check: Respectful but firm.

  11. **Final Polish:**
      *   Ensure the "Voice" of the objectors matches (Macro vs. Econometrics vs. History).
      *   Check the "Soft Spot" admissions in the replies.

  *(Self-Correction during drafting)*: I need to make sure I don't validate the DSGE people *too* much in the replies, or I lose the thesis. But I also can't dismiss the econometricians too easily or they will eat me alive. The Historian is the gatekeeper of Lakatos. I need to be precise on "Hard Core" vs "Protective Belt."

  *Refining the "Alternatives" argument:* The user says VARs/ABM have no hard core. This is controversial. Sims' "Macroeconomics and Reality" is basically a manifesto. I need to advise the user that this is the weakest link. The reply needs to distinguish between a *method* and a *programme*. A VAR is a method. A "Structural VAR" programme might exist, but pure reduced-form is just estimation. ABM is often a collection of models, not a unified heuristic. I will highlight this tension.

  *Refining the "Novel Fact" issue:* In macro, "novel facts" are rare. The user needs to acknowledge this. Lakatos talked about novel *predictions*, not just fitting existing data. DSGE often fits past data (calibration/estimation) but fails out-of-sample or on new policy regimes.

  *Let's build the Prep Sheet.*

  *Structure:*
  1.  Assessment of the Thesis Halves.
  2.  The Objections (8-10, ordered, voiced).
  3.  The Replies (2 mins, soft spots).
  4.  Concessions.
  5.  The One Thing.
  6.  The Feared Question.

  *Check Lakatos:*
  *   Hard Core: Irrefutable by methodological decision.
  *   Protective Belt: Auxiliary hypotheses.
  *   Negative Heuristic: Don't attack the core.
  *   Positive Heuristic: How to develop the belt.
  *   Progressive: Theoretical (new concepts) AND Empirical (novel facts confirmed).
  *   Degenerating: Theory grows faster than empirical confirmation.
  *   *Note:* Lakatos is often interpreted as saying "stick with it until a rival appears." But he also acknowledges that sometimes programmes die without a replacement. I need to be careful not to overstate the "stick with it" rule as a rigid algorithm.

  *Okay, ready to write.*
answer: |-
  This is a high-risk, high-reward talk. You are effectively telling the practitioners their engine is broken, and the mechanics their tools are useless, while appealing to a single historian to validate your wrench.

  Here is your prep sheet.

  ### 1. Assessment of the Thesis Halves

  You are correct to suspect imbalance.
  *   **Half 1 (DSGE is degenerating):** This is the stronger half. It aligns with a significant chunk of post-2008 methodological critique. You have empirical ground to stand on (the failure to predict/prevent the crisis, the reliance on large shocks to explain fluctuations, the "friction shopping").
  *   **Half 2 (Alternatives are not rival programmes):** This is the vulnerable half. It is philosophically contentious to claim VARs or ABM lack a *hard core*. Sims (1980) explicitly framed VARs as a reaction against the "incredible identifying restrictions" of structural models—that looks like a Negative Heuristic. Agent-Based Modelling often claims a hard core of "bounded rationality" and "interaction."
      *   **Risk:** If you define "Research Programme" too narrowly, you look like you're rigging the definition to save DSGE. If you define it too broadly, VARs qualify.
      *   **Fix:** Distinguish between a *methodological stance* (e.g., "let the data speak") and a *positive heuristic* (a systematic guide for building *new* models). VARs are often a method of estimation/identification, not a generator of new theoretical structures. ABM is often a collection of simulations without a unifying theoretical core. Lean into the distinction between a *toolkit* and a *theory-generating engine*.

  ---

  ### 2. The Objections (Ordered by Damage)

  **1. The Historian (The Jugular)**
  *"You're treating Lakatos's methodology as a decision algorithm, but he explicitly warned against that. He said we can't know *when* to abandon a programme. By arguing we must stay with DSGE because no rival exists, you're turning a descriptive historical account into a normative straitjacket. What if the programme is degenerating so hard it's crowding out talent that could build a rival?"*
  *   **Damage:** High. Undermines your normative conclusion.

  **2. The Senior DSGE Practitioner (The Empirical Defense)**
  *"You say we produce no novel facts. But the New Keynesian framework predicted the zero lower bound dynamics and the specific conditions under which fiscal multipliers exceed one. Those were theoretical predictions confirmed by the post-2008 data. That counts as empirical progress."*
  *   **Damage:** High. Directly contradicts the "degenerating" claim.

  **3. The Econometrician (The Rival Claim)**
  *"You say VARs aren't a research programme. But the 'Credibility Revolution' in identification has a hard core: causal inference via exogenous variation. We have a positive heuristic: find an instrument, test robustness, estimate the impulse response. We are generating novel facts about policy transmission constantly. Why doesn't that count?"*
  *   **Damage:** High. Threatens the "no alternative" conclusion.

  **4. The DSGE Builder (The Pragmatist)**
  *"Even if I grant you that we're degenerating, your conclusion is dangerous. Policy institutions need structural models to run counterfactuals. VARs can't do welfare analysis. If we abandon the hard core of optimization, we lose the ability to evaluate policy rules. Are you telling central banks to fly blind?"*
  *   **Damage:** Medium. Practical objection vs. philosophical point.

  **5. The Historian (The Core Definition)**
  *"Is 'optimization' really the hard core? Many New Keynesians treat it as a modeling convenience, not an ontological commitment. If the core is actually 'equilibrium' or 'general equilibrium,' then HANK models (Heterogeneous Agent New Keynesian) are changing the core, not just the belt. If the core is mutating, isn't the programme dead already?"*
  *   **Damage:** Medium. Challenges your mapping of Lakatos to DSGE.

  **6. The Junior Macro PhD (The Career Incentive)**
  *"You're describing a sociological lock-in. If DSGE is degenerating but we keep it because there's no rival, aren't you just justifying a monopoly that exists only because journals and hiring committees demand it? Isn't that the definition of a degenerating *sociological* programme?"*
  *   **Damage:** Medium. Shifts focus from science to sociology.

  **7. The Econometrician (The Atheoretic Point)**
  *"Reduced-form work isn't trying to be a research programme. It's trying to be honest about what we know. Why does everything need a 'hard core'? Maybe macro is just too complex for a single unifying theory. Why is 'theoretical unity' a virtue if it's false?"*
  *   **Damage:** Low/Medium. Attacks the premise that we *need* a programme.

  **8. The DSGE Practitioner (The Belt Defense)**
  *"Adding financial frictions isn't 'ad hoc' in the pejorative sense. It's responding to data. Lakatos says the protective belt *should* absorb anomalies. Why is adding a financial sector 'degenerating' but adding gravity to physics wasn't?"*
  *   **Damage:** Low. Technical defense of the belt.

  **9. The Historian (The Progress Definition)**
  *"Lakatos distinguishes between theoretical and empirical progress. You concede DSGE is theoretically progressive (new models) but not empirically. But in macro, empirical 'novel facts' are incredibly rare compared to physics. Are you holding macro to an impossible standard?"*
  *   **Damage:** Low. Contextualizes the degeneration.

  **10. The Skeptic (The Timeline)**
  *"Okay, DSGE stays. How long? Ten years? Fifty? At what point does 'waiting for a rival' become intellectual stagnation?"*
  *   **Damage:** Low. Kicks the can, but demands a metric.

  ---

  ### 3. The Replies (2-Minute Standing Responses)

  **1. To the Historian (Decision Algorithm)**
  *"You're right that Lakatos didn't offer a mechanical rule for abandonment. My argument isn't that we *must* keep DSGE forever, but that abandoning it *now* leaves a vacuum. Without a hard core, a field fragments into case studies. My normative claim is conservative: maintain the infrastructure that *could* become progressive, while encouraging work that might form a rival core. But we can't declare the rival exists until it has a positive heuristic, not just a critique."*
  *   **Soft Spot:** This admits you don't have a timeline. It relies on the hope that a rival *might* emerge.

  **2. To the DSGE Practitioner (Novel Facts)**
  *"Predicting ZLB dynamics is a strong point. But Lakatos requires a *consistent* pattern of novel predictions outweighing the anomalies. For every ZLB prediction, there are ten instances where the model required a 'shock' of unexplained magnitude to fit the data. If the belt (the shocks) grows faster than the confirmed predictions, it's degenerating. I'm not saying you produce *no* truth, but that the ratio is worsening."*
  *   **Soft Spot:** "Ratio" is vague. You are making a qualitative judgment call on what counts as "excessive" belt growth.

  **3. To the Econometrician (VARs as Programme)**
  *"A method of identification isn't a research programme. A VAR tells you *what* happened after a shock, but it doesn't have a positive heuristic for *why* it happened or how agents would behave under a new regime. You can't run a welfare counterfactual on a reduced form. That lack of a 'theory of the agent' means you can't generate new theoretical structures, only new estimates of old relationships."*
  *   **Soft Spot:** Structural VARs (SVARs) blur this line. If they press on SVARs, you must concede SVARs are a hybrid, but still lack the *general equilibrium* heuristic.

  **4. To the Pragmatist (Policy Needs)**
  *"I'm not saying burn the models today. I'm saying acknowledge their status. If we admit DSGE is degenerating, we stop treating its outputs as precise forecasts and start treating them as 'stress tests' or coherence checks. That preserves the utility for policy without claiming false empirical precision."*
  *   **Soft Spot:** This might annoy the central bankers who want forecasts. It changes the job description of the macroeconomist.

  **5. To the Historian (Mutating Core)**
  *"If 'optimization' is just a convenience, then the hard core is actually 'Equilibrium'. HANK models still clear markets. If they start allowing persistent non-equilibrium trading, *then* the core breaks. As long as they clear markets via prices, the core holds. The heterogeneity is in the belt."*
  *   **Soft Spot:** This is a technical interpretation of DSGE. If a prominent modeler says "I don't believe agents optimize," your mapping wobbles.

  **6. To the Junior PhD (Sociology)**
  *"Sociological lock-in is real. But Lakatos explains *why* the lock-in persists: because there's no coherent alternative. Blaming journals doesn't solve the scientific problem. The solution isn't to force journals to accept incoherent models, but to build a rival programme strong enough to force the journals' hands."*
  *   **Soft Spot:** Doesn't help the PhD student get hired next year.

  **7. To the Econometrician (Unity vs. Truth)**
  *"Because without a hard core, you can't accumulate knowledge. You get a thousand papers on a thousand specific shocks. A research programme allows you to say 'this anomaly matters for the whole system.' Without it, macro becomes a collection of micro-studies. We lose the 'Macro'."*
  *   **Soft Spot:** Some might argue "Macro" doesn't exist as a unified object.

  **8. To the DSGE Builder (Physics Analogy)**
  *"Gravity wasn't added to save a degenerating programme; it was derived from the core. Financial frictions in DSGE are often bolted on to match a specific moment in the data, then dropped in the next model. That's the difference between a theoretical development and an ad hoc adjustment."*
  *   **Soft Spot:** "Often" is doing a lot of work. Some frictions are microfounded.

  **9. To the Historian (Macro Standards)**
  *"I am holding macro to macro standards, not physics. But 'novel facts' in macro can be stylized facts or historical episodes. If the programme only explains data it was calibrated to, it's curve-fitting. We need out-of-sample predictive success on structural breaks."*
  *   **Soft Spot:** Out-of-sample success is notoriously hard in macro. You might be asking for the impossible.

  **10. To the Skeptic (Timeline)**
  *"I can't give you a date. But the signal to abandon is when the 'belt' becomes more complex than the phenomena it explains. When the model requires more parameters than data points to function, that's the signal. We aren't there yet, but we're closer than in 2000."*
  *   **Soft Spot:** Parameter counting is a crude metric for theoretical depth.

  ---

  ### 4. Concessions to Make Up Front

  To buy credibility, concede these two points in your opening or early Q&A:

  1.  **Concede on "Degenerating" vs. "Dead":** Explicitly state: *"Degenerating does not mean false. Newtonian physics was degenerating before Einstein, but it still sent men to the moon. DSGE can still be useful policy infrastructure while being scientifically degenerating."*
      *   **Why:** Prevents the DSGE folks from feeling you called them charlatans. It separates *utility* from *scientific progress*.
  2.  **Concede on the Definition of "Novel Fact":** Acknowledge: *"Macro cannot replicate lab conditions. My standard for 'novel fact' must be historical episodes or regime changes, not controlled experiments. I invite you to hold me to that standard."*
      *   **Why:** Disarms the "Macro isn't physics" objection before they raise it.

  ---

  ### 5. The Single Reply That Must Land

  If only one thing survives, it must be this distinction:

  **"A Research Programme is not just a set of tools; it is a commitment to a specific way of generating *new* questions. VARs tell us about the past; DSGE attempts to tell us about the counterfactual future. Until an alternative can systematically generate counterfactual policy analysis without relying on DSGE's hard core, we cannot switch. We can only repair."**

  *   **Why:** This validates the DSGE practitioners' utility (policy analysis) while validating the critics' skepticism (it's degenerating). It frames your "stay with DSGE" conclusion as a pragmatic necessity, not an ideological preference.

  ---

  ### 6. The Question You Hope Nobody Asks

  *"If the hard core is 'optimization and equilibrium', and you admit these are likely false descriptions of human behavior and market dynamics, aren't you arguing we should build policy on known lies because the truth doesn't have a formal structure yet?"*

  *   **Why it's dangerous:** It forces you to defend the ontological truth of the hard core, which you can't. You have to pivot back to *instrumentalism* (it's not about truth, it's about coherence), but that weakens your Lakatosian claim (which assumes programmes aim at truth/content).
  *   **Prep:** If asked, pivot to: *"I'm arguing we should build on the best *structured* falsehood we have, while actively searching for a better structure. A false map is better than no map, provided we know it's false."*

  ### 7. Final Check on Lakatos Usage

  *   **Hard Core:** Irrefutable by methodological decision. (DSGE: Optimization/Equilibrium).
  *   **Protective Belt:** Auxiliary hypotheses. (DSGE: Frictions/Shocks).
  *   **Negative Heuristic:** Don't attack the core. (DSGE: Don't question rationality, add frictions).
  *   **Positive Heuristic:** Guide for developing the belt. (DSGE: Microfound everything).
  *   **Progressive:** Theoretical (new concepts) + Empirical (novel facts).
  *   **Degenerating:** Theory grows faster than empirical confirmation.
  *   **Uncertainty:** Lakatos's view on *when* to abandon is indeed ambiguous. He suggests we shouldn't abandon too quickly, but he doesn't give a rule. Your argument that we *must* stay until a rival appears is a reasonable interpretation, but the Historian may challenge it as too rigid. Be prepared to soften "must" to "rationally preferable."

  Good luck. You are walking into a room where everyone thinks they know the methodology better than the philosopher. Your best defense is humility about the philosophy and precision about the economics.
