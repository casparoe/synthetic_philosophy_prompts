  ### Two Further Principles

  **1. The Principle of Sortal Continuity**
  *   **Formulation:** *Composition follows linguistic and conceptual practice: parts compose a whole if and only if we possess a count-noun sortal (e.g., "wall," "swarm," "bicycle") that applies to the aggregate, but not if we possess only a mass-noun description (e.g., "sand," "cloud," "boulder field").*
  *   **Fit:** This accounts for all eight verdicts by appealing to our pre-existing categorization. We call it a "wall" or "pyramid," so it exists. We call it "sand" or "cloud," so it doesn't. The bicycle in the carton falls under the sortal "bicycle" (disassembled), whereas the skip falls under "scrap."
  *   **Divergence:** This principle is deflationary; it makes composition mind-dependent. The Functional Unity principle makes it mind-independent (based on actual causal/functional history).

  **2. The Principle of Restricted Causal Interdependence**
  *   **Formulation:** *Parts compose a whole if and only if the spatial location of each part is causally sustained by the others, unless the parts constitute a dormant artifact.*
  *   **Fit:** This prioritizes the participant's explicit justification in Case 4 ("each brick is where it is because of the others"). It explains the Pyramid, Wall, and Bees (flight coordination). It explains the Sand and Cloud (no mutual sustenance). It explains the Bicycle in the carton via the "dormant artifact" clause (Case 7). It explains the Boulders by ruling that passive gravitational arrest does not count as active causal sustenance.
  *   **Divergence:** This principle requires physical contact or binding (except for dormant artifacts). Functional Unity does not; it allows for coordination at a distance (like the bees, potentially).

