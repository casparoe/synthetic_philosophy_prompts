  ### Closest Analog and Evaluation

  **Closest Analog:** **Case 5 (The Swarm of Bees).**
  *   **Why:** Both involve a large number of identical units, distributed control, and the ability to form different macro-structures (flight/walker) while retaining identity as a collective. The participant's tolerance for "vague boundaries" in Case 5 is crucial for the robot swarm.
  *   **Where the Analogy Breaks:** The bees are a *biological* unity (intrinsic function), whereas the robots are *artifacts* (extrinsic function). This matters for the "Crossing" phase. The bees in flight (Case 5) are composing a swarm *while moving*. The robots cross as "separate units." If the participant treats the robots like the bees, the crossing swarm exists. If she treats them like the **Case 7 (Bicycle)** parts in transit, they do not. Given she said the bicycle in the *carton* exists, but the bees in *flight* exist, the "Crossing" phase is the pivot. Since the robots are "separate units" during crossing (unlike the cohesive bee swarm), Case 7 is the secondary analog.

