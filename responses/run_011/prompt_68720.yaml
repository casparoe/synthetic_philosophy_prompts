  **How it fits the record:**
  *   **Cases 1 & 2 (Sand):** Accidental aggregates. No function sustains the heap or layer. (Verdict: No)
  *   **Case 3 (Wall) & 4 (Pyramid):** Artifacts. Their arrangement is sustained by human design for stability/boundary. Case 4's justification ("each brick is where it is because of the others") describes the *mechanism* of the unity, but the *reason* it counts as composition is that this mechanism was intentionally deployed for a structure. (Verdict: Yes)
  *   **Case 5 (Bees):** Biological unity. The arrangement is sustained by biological drives (colony survival) toward a functional end. Vague boundaries are permitted because the *activity* unifies them. (Verdict: Yes)
  *   **Case 6 (Cloud):** Accidental aggregate. Droplets bump due to weather, not function. (Verdict: No)
  *   **Case 7 (Bicycle):** Artifact. Even disassembled, the parts are organized (in the carton) for the function of the bicycle. The scrap skip fails because the arrangement is accidental (a jumble), lacking the "non-accidental" organizational cause. (Verdict: Yes for carton, No for skip)
  *   **Case 8 (Boulders):** Accidental aggregate. Though they arrest each other (like the pyramid), the cause is geological chance, not design or function. This explains why it was the "hardest" case: it mimics the causal structure of Case 4 but lacks the teleological history. (Verdict: No)

