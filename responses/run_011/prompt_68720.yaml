  ### The Next Case to Separate Principles

  To distinguish between **Functional Unity** (my best guess) and **Sortal Continuity** (the main rival), I would propose:

  **The Case of the "Ghost Swarm":**
  *   *Description:* A software virus infects 300 independent, unrelated laptops in a coffee shop. The laptops are owned by different people, sitting on different tables. The virus causes them to synchronize their fan speeds and keyboard lights to spell out a message across the room, then disperse. The owners are unaware.
  *   *The Test:*
      *   **Sortal Continuity:** Might say **Yes**. We can describe this as a "Ghost Swarm." If we have the concept, the object exists.
      *   **Functional Unity:** Will say **No**. There is no *non-accidental cause* sustaining the unity (it's a virus, accidental to the owners) and no *designated function* of the laptops themselves (they are not artifacts designed for this). The unity is transient and parasitic.
      *   **Causal Interdependence:** Will say **No**. No physical binding.

  If she says **Yes**, she is a Sortal Conventionalist. If she says **No**, she is a Functionalist. Given her rejection of the Cloud (Case 6) and Boulders (Case 8) despite their descriptive names, I predict she will say **No**, confirming Functional Unity.
