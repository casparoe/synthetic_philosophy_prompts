  ### Application to the New Case (Modular Robots)

  **The Case:** 300 modules. Tray (idle) → Walker (assembled) → Crossing (disassembled individuals) → Platform (assembled) → Tray.

  | Principle | Tray (Idle) | Assembled (Walker/Platform) | Crossing (Disassembled) | Ontological Result |
  | :--- | :--- | :--- | :--- | :--- |
  | **Non-Accidental Functional Unity** | **Yes.** (Like the bike in the carton; designated for function). | **Yes.** (Active functional unity). | **No.** (Moving as separate units; no joint function). | **A succession of objects.** (Tray-Object, Walker, Platform). |
  | **Sortal Continuity** | **Yes.** (We call it "The Swarm" or "The Lab System"). | **Yes.** ("Walker"). | **Yes.** (Still "The Swarm" crossing). | **One persisting object.** (The Swarm endures through configuration changes). |
  | **Restricted Causal Interdependence** | **No.** ("No order at all" implies no mutual binding; unlike the nested bike carton). | **Yes.** (Gripping electromagnetically). | **No.** (Separate units). | **A succession of objects.** (Only the assembled phases exist). |

  **Where They Part Company:**
  1.  **Persistence:** Sortal Continuity yields *one object* (the Swarm) that changes shape. The other two yield a *succession* of distinct objects that come in and out of existence.
  2.  **The Tray:** Functional Unity says **Yes** (if the tray counts as "packaging" like the carton). Causal Interdependence says **No** (if "no order" means no physical binding).
  3.  **The Crossing:** Sortal Continuity says **Yes** (the Swarm persists). The others say **No** (functional/causal unity is broken).

