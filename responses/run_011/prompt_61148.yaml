          *   *Survival:* Her critique of formal semantics stands. Her prescription for editorial policy fails.
      *   **Policy Revision:** Clause 2 needs to allow for "accurately characterizing uncertainty."
      *   **Criteria for Editors:** A checklist for future cases (New evidence? Consensus shift? Uncertainty level?).
