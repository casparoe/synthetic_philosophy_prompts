          *   (c) Status quo + note (Reflects evidence at time). *Problem:* Doesn't correct the falsehood, potentially misleading.
          *   (d) Scientist's proposal + "provisional" flag. *Problem:* Still violates Clause 2 strictly speaking.
      *   **The Logician's Objection:** The whole concept of "truthlikeness" (approximating truth) is incoherent. Trade-off between accuracy and information content is arbitrary. Ranking false claims is formally broken. Only (b) is honest.
      *   **Requirements for the Memo:**
          *   Recommendation (a, b, c, d, or e).
