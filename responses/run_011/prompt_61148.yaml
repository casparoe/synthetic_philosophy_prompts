      *   *Better approach:* Recommend a hybrid. We state the old finding is no longer supported. We state new evidence suggests a lower risk, but emphasize the uncertainty. This avoids endorsing the 20% as *fact* while still correcting the *doubling* claim.
      *   *Actually, looking at the options:* (d) is "Run the scientist's replacement, flagged as provisional." This is the closest to what I want. I will recommend (d) but with specific wording constraints to satisfy Clause 2.
