  5.  **Refining the Tone:**

      *   Needs to be collegial but decisive.
      *   Needs to show I've thought deeply about the logician's point (she's the "sharpest").
      *   Needs to be actionable.

  6.  **Developing the Argument against the Logician:**

      *   Don't get bogged down in "truthlikeness" theory.
      *   Focus on the *purpose* of the correction. Is it to achieve metaphysical purity? No. It's to prevent reader harm and maintain trust.
      *   Option (b) maintains logical purity but sacrifices trust (readers will think we're dodging).
      *   Option (d) sacrifices logical purity but maintains trust (readers see we are tracking the science).
      *   The "trade-off" isn't arbitrary; it's weighted by *consequence*.

  7.  **Policy Wording:**

