answer: |-
  # Session Plan: The Empty Proof (Strategy Stealing in Chomp)

  **Course:** First-Year Seminar in Philosophy of Mathematics
  **Topic:** Non-constructive Existence Proofs (Strategy Stealing)
  **Time:** 100 Minutes
  **Students:** 22 (11 Pairs)
  **Materials:**
  *   Graph paper (1 sheet per pair).
  *   Red and Blue pens/markers (1 set per pair).
  *   Printed Handout (Rules, Board Templates, Prediction Slips).
  *   Whiteboard/Projector for Instructor Demo.
  *   Visible Timer.

  ---

  ## 1. The Game: Chomp

  **Rules (Handout Text):**
  1.  **Board:** A rectangular grid of squares. We designate the bottom-left square $(1,1)$ as the **Poison**.
  2.  **Move:** On your turn, choose any square $(i,j)$ remaining on the board. Remove that square and **all** squares above it and to the right of it (i.e., all $(x,y)$ where $x \ge i$ and $y \ge j$).
  3.  **Loss:** The player forced to take the Poison square $(1,1)$ loses.
  4.  **Conditions:** The game is finite (board shrinks), deterministic (no dice), perfect information (no hidden cards), and draw-free (someone must take the poison).

  **Board Sizes for Session:**
  *   **Board A:** $2 \times 2$ squares.
  *   **Board B:** $3 \times 3$ squares.
  *   **Board C (Hypothetical):** $100 \times 100$ squares.

  ---

  ## 2. Minute-by-Minute Timeline

  | Time | Activity | Facilitator Notes |
  | :--- | :--- | :--- |
  | **00-10** | **Intro & Rules** | Distribute handouts. Explain Chomp rules using the projector. Emphasize the "rectangle removal" mechanic. |
  | **10-25** | **Play Board A ($2 \times 2$)** | Pairs play 3 rounds. Switch who goes first. **Task:** Find the winning first move. |
  | **25-40** | **Play Board B ($3 \times 3$)** | Pairs play 3 rounds. **Task:** Determine who wins. Do not look for the move yet, just the winner. |
  | **40-55** | **Stage the Theft (Demo)** | Instructor plays a demo on the big board. Forces the "redundant move" moment. Students articulate the logic. |
  | **55-70** | **Sabotage (Nim Analysis)** | Groups analyze **Two-Pile Nim**. Identify why Strategy Stealing fails there. (See Section 4). |
  | **70-75** | **The Stakes** | Students write a prediction for $100 \times 100$ on a slip. Collect them. |
  | **75-95** | **Debrief & Philosophy** | Map play to hypotheses. Discuss "Knowledge without Action." Address Honest Limits. |
  | **95-100** | **Wrap** | Return prediction slips. Dismiss. |

  ---

  ## 3. Facilitator Script for Transitions

  **(00:00) Intro:**
  "Welcome. Today we are investigating what a proof actually *gives* you. Usually, we think a proof of existence tells you how to find the thing. We are going to play a game where I can prove to you, with certainty, that a winning strategy exists, while simultaneously proving that I have no idea what that strategy *is*. We will use a game called Chomp."

  **(10:00) Transition to Board A:**
  "Get into pairs. One is Red, one is Blue. Play $2 \times 2$ Chomp. Play three rounds, swapping who goes first. Your goal is not just to win, but to answer this: **Is there a specific first move that guarantees a win?** If you find it, circle it on your paper."

  **(25:00) Transition to Board B:**
  "Stop. Move to the $3 \times 3$ board on your handout. Play three rounds. This time, I do not want you to solve the game. I want you to answer a simpler question: **Does Player 1 win, or does Player 2 win?** You likely won't find the specific winning move. That is fine. Just bet on the player."

  **(40:00) Transition to Staging the Theft:**
  "Most of you suspect Player 1 wins on $3 \times 3$, but you can't name the move. I am going to show you why Player 1 *must* win, without naming the move. I need one volunteer to play against me on the big board. You are Player 2. I am Player 1."
  *(Instructor plays $(3,3)$—the single top-right corner. Volunteer responds with move $M$.)*
  "Look at the board now. Volunteer, you played move $M$. Class, if I had played move $M$ as my *very first move*, would the board look different than it does now? No. The square I took initially was inside the chunk you just removed. My first move was redundant. If your move $M$ was a winning response, I could have played it first. This is the theft."

  **(55:00) Transition to Sabotage:**
  "This argument feels magical. It proves a win without a strategy. But it must depend on specific rules. If it worked for *every* game, Player 1 would win everything. We know that's false. In **Two-Pile Nim** (two stacks of coins, take any number from one stack), Player 2 wins if stacks are equal. Your task: Analyze Nim. The Strategy Stealing argument claims Player 1 should win. **Where does the logic break?** Which assumption of Chomp does Nim violate?"

  **(70:00) Transition to Stakes:**
  "Take a prediction slip. I am asking about a $100 \times 100$ board. Exhaustive search is impossible. Brute force is impossible. Based *only* on the proof we just discussed, who wins? Sign your name. This is your commitment."

  **(75:00) Transition to Debrief:**
  "Keep your slips. Let's look at what we actually know. We know Player 1 wins. We do not know how. Is this knowledge? Let's map the moments of play to the logical requirements."

  ---

  ## 4. Sabotage: The Counter-Example

  **Instructor-Supplied Game:** **Two-Pile Nim**
  *   **Setup:** Two piles of $n$ tokens each.
  *   **Move:** Remove any number of tokens ($ \ge 1$) from exactly one pile.
  *   **Win:** Take the last token (Normal Play).
  *   **Outcome:** Player 2 wins (via mirroring strategy).

  **Why Strategy Stealing Fails Here:**
  The Strategy Stealing argument relies on the **Monotonicity of Moves** (specifically, that an "extra" move is never a disadvantage).
  *   *In Chomp:* If Player 1 takes the top-right corner ($x$) and Player 2 responds with ($y$), the resulting board is the same as if Player 1 had just played ($y$). The move $x$ was "absorbed" by $y$. Having the extra option $x$ available did not hurt.
  *   *In Nim:* If Player 1 takes 1 token from Pile A, and Player 2 takes 1 token from Pile B, the state is $(n-1, n-1)$. Player 1 claims: "I could have taken 1 from Pile B first." But if Player 1 took 1 from Pile B first, the state would be $(n, n-1)$. These are **different states**.
  *   *Broken Hypothesis:* **"The Extra Move is Free."** In Chomp, making a dummy move leaves you in a subset of the original position. In Nim, making a dummy move changes the parity/structure of the game in a way that cannot be undone or absorbed by the opponent's response. The set of available moves is not monotonic with respect to the "dummy" action.

  **Student Construction Task (If time permits):**
  "Try to modify Chomp rules so Player 2 wins. Hint: What if the board is not a single rectangle, but two separate $2 \times 2$ squares? (This is equivalent to Nim)."

