  ## 7. Failure Modes & Fixes

  1.  **The Fast Solvers (2-3 students):**
      *   *Risk:* They solve $3 \times 3$ by brute force during the play phase, ruining the "mystery."
      *   *Fix:* Pre-print a **$4 \times 4$** challenge on the back of the handout. If a pair finishes $3 \times 3$ analysis early, hand them the $4 \times 4$ task. Ask them: "Can you prove P1 wins on $4 \times 4$ without finding the move?"
  2.  **The Silent Pairs:**
      *   *Risk:* Pairs stare at the $3 \times 3$ grid, unsure how to proceed.
      *   *Fix:* Circulate early. Prompt: "Don't try to win. Just try to see if Player 2 *can* force a win. What if Player 1 takes the top-right corner?"
  3.  **Timing Overrun:**
      *   *Risk:* Play phases drag on.
      *   *Fix:* Use a projected countdown timer. Announce "1 minute remaining" loudly. Cut play at 40:00 sharp, even if games are unfinished. The *argument* matters more than the *result*.
  4.  **Constructivity Confusion:**
      *   *Risk:* Students insist, "But what *is* the move? The proof is useless."
      *   *Fix:* During Debrief, ask: "If I offered you \$100 for the winning move on $100 \times 100$, could you claim it based on this proof?" (No). "If I offered you \$100 that P1 wins, could you claim it?" (Yes). Distinguish *knowledge of fact* from *knowledge of method*.
  5.  **Rule Lawyering:**
      *   *Risk:* "Can I take just the poison?" "Can I take a non-rectangular shape?"
      *   *Fix:* The Handout must have a diagram of a valid vs. invalid move. Refer to it immediately. Do not entertain edge cases; they waste time.

  ---

  ## 8. Honest Limits

  **What this activity cannot reproduce:**
  On a $3 \times 3$ board, the game tree has only a few hundred nodes. A computer (or a determined student) *can* solve it constructively. The "non-constructive" feeling is artificial here because the board is small.

  **What the Instructor must supply:**
  In the closing minutes (Debrief), you must explicitly scale the problem.
  *   *Script:* "On $3 \times 3$, my proof is lazy. You could have checked every branch. But on a $10^{100} \times 10^{100}$ board, the number of positions exceeds the number of atoms in the universe. Exhaustive search is physically impossible. Yet, the Strategy Stealing proof takes the same three lines. It is only on the unplayable board that this proof becomes the *only* way to know the truth. That is where the philosophical weight lies: knowing a truth exists that is, in principle, inaccessible to computation."

  **Closing Instruction:**
  "Keep your prediction slips. We will revisit them in the next unit on Intuitionism, where we will ask if a proof that gives no witness is a proof at all."
