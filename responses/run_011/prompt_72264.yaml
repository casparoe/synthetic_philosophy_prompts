answer: |-
  ### 1. Brainstorming Candidate Cruxes

  **Candidate 1: The Status of the Premises.**
  *Crux:* Okonjo and Halvorsen both agree the premises are known. The dispute is whether that knowledge is *basic* (Okonjo) or *dependent* on the conclusion (Halvorsen).
  *Verdict:* **Reject.** This collapses too quickly into a stalemate about "foundationalism" vs "coherentism" without leveraging the specific "proof" structure. It invites students to just define knowledge rather than analyze the argument's function.

  **Candidate 2: The Definition of "Answering" a Sceptic.**
  *Crux:* Is "answering" a matter of providing reasons (Halvorsen) or shifting conversational burdens (Okonjo)?
  *Verdict:* **Reject.** This is too linguistic/pragmatic. It risks turning the exam into a philosophy of language exercise rather than epistemology. It doesn't force a verdict on whether knowledge *extends* via the proof.

  **Candidate 3: Epistemic Gain vs. Dialectical Failure (The Chosen Crux).**
  *Crux:* Okonjo claims the argument *is* a proof (capable of extending knowledge) but is unfairly rejected. Halvorsen claims the argument *cannot* extend knowledge (warrant doesn't transmit), even if premises are known. The local sceptic case tests whether Moore can *acquire* justification for the conclusion *via* the premise.
  *Why:* This forces the student to distinguish between "I know it, but can't prove it to you" (Halvorsen) and "I can prove it, but you're being unreasonable" (Okonjo). The local case (Hologram) makes this concrete: Can looking at the hand *rule out* the hologram hypothesis via deduction?
  *Honesty Check:* Does this hold? Yes. Halvorsen's view (non-transmission) entails that the argument cannot *generate* warrant for the anti-sceptical hypothesis. Okonjo's view (normative failure) entails the argument *could* generate warrant if the sceptic weren't rigging the norms. This is a genuine divergence on the epistemic utility of the proof.

  **Candidate 4: The Scope of Scepticism.**
  *Crux:* Is the sceptic global (Okonjo) or local (Halvorsen)?
  *Verdict:* **Reject.** The prompt specifies a local sceptic case. Making this the crux would confuse the hypotheticals provided in the question text.

  ---

  ### 2. Exam Question

  **Question 1**

  Consider two responses to the claim that holding up one's hands proves an external world exists.

  **Okonjo:** "The argument is valid and the premises are known. It fails to answer the sceptic only because the sceptic demands a type of justification—neutral starting points—that is impossible to meet in any inquiry. The fault lies in the sceptic's conversational norms, not the argument's structure."

  **Halvorsen:** "The argument is valid and the premises are known. However, the warrant for the premise depends on already accepting the conclusion. The warrant does not transmit across the inference. The argument cannot extend knowledge, regardless of conversational norms."

  Imagine a **local sceptic** who grants you see *something*, but doubts whether it is a biological hand rather than a perfect hologram. You argue: "Here is a hand; if here is a hand, there is no hologram; therefore, there is no hologram."

  Adjudicate between Okonjo and Halvorsen. Specifically: Does Halvorsen's concession that the premise is *known* render their view compatible with Okonjo's, or do they offer rival accounts of whether you can *come to know* there is no hologram *by making this argument*? Use the local hologram case to justify your verdict. What would settle the dispute?

  ---

  ### 3. Model Answer

  The core disagreement between Okonjo and Halvorsen is not about whether the premises are known, but about the *direction of epistemic support*. While both concede the subject knows "Here is a hand," they diverge on whether the argument can *generate* knowledge of the conclusion for the subject. Halvorsen's view is not compatible with Okonjo's; they offer rival accounts of epistemic acquisition. Okonjo treats the failure as dialectical (social), whereas Halvorsen treats it as structural (epistemic). The local hologram case reveals this incompatibility.

  Okonjo argues that the proof is sound and capable of extending knowledge, but is blocked by unreasonable sceptical demands. In the hologram case, Okonjo would say that if I see a hand, I know it is a hand. If the sceptic demands I prove it isn't a hologram *before* accepting it is a hand, they are violating normative standards of inquiry. For Okonjo, the argument *could* settle the doubt if the sceptic played fair. The warrant flows from premise to conclusion; the blockage is external to the epistemology.

  Halvorsen, however, claims the warrant for "Here is a hand" is only available if I am already entitled to "There is no hologram." In the local case, this means I cannot use the visual experience of the hand to *rule out* the hologram hypothesis via deduction. My warrant for believing I see a hand *presupposes* the hologram hypothesis is false. Therefore, arguing from the hand to the non-existence of the hologram is circular in a way that prevents knowledge extension. Even if the sceptic were polite, the argument would not work epistemically.

  This shows the views are incompatible. Okonjo believes the argument *can* produce knowledge of the conclusion (if norms allowed); Halvorsen believes it *cannot*, regardless of norms. To settle this, we must ask: Can the subject's confidence in "No hologram" be *increased* by performing the inference?

  If Okonjo is right, performing the inference should rationally increase confidence in the conclusion, provided the norms are fixed. If Halvorsen is right, performing the inference adds nothing to the warrant for the conclusion, because the warrant for the premise was borrowed from the conclusion in the first place.

  The dispute is settled by examining the source of the warrant. If the warrant for "Here is a hand" comes purely from perception (independent of the external world assumption), Okonjo wins. If the warrant for "Here is a hand" requires a prior assumption that perception is reliable (i.e., no holograms), Halvorsen wins. In the hologram case, since seeing a hand *as a hand* conceptually excludes it being a hologram, Halvorsen is correct: the warrant does not transmit. The argument displays knowledge we already have, but cannot create new knowledge of the anti-sceptical hypothesis. Okonjo mistakes a structural limit for a conversational one.

  ---

  ### 4. Marking Scheme (25 Marks Total)

  | Point | Requirement | Marks | Common Error / Botch |
  | :--- | :--- | :--- | :--- |
  | **1. Diagnosis of Compatibility** | Clearly states whether Okonjo and Halvorsen are compatible or rival views regarding knowledge extension. | 5 | Students claim they are "mostly the same" because both accept the premises, missing the transmission vs. norms distinction. |
  | **2. Okonjo's Position** | Accurately reconstructs Okonjo's claim that the argument *could* extend knowledge if norms weren't rigged (dialectical failure). | 5 | Students describe Okonjo as saying "the argument fails," missing the nuance that the argument itself is sound/capable. |
  | **3. Halvorsen's Position** | Accurately reconstructs Halvorsen's claim that warrant is non-transmissive (structural failure), regardless of norms. | 5 | Students confuse Halvorsen with a sceptic who denies the premises are known, rather than denying transmission. |
  | **4. Application of Local Case** | Uses the hologram case to show where the verdicts diverge (can the argument *rule out* the doubt?). | 5 | Students treat the hologram case as just another example of scepticism rather than a test of warrant transmission. |
  | **5. Verdict & Settlement** | Provides a decisive verdict on who is right (or why one explains the case better) and identifies the source of warrant as the settling factor. | 5 | Students sit on the fence ("both have points") without identifying the specific epistemic mechanism (source of warrant) that decides it. |

  ---

  ### 5. Differentiation (A vs. B Grade)

  A competent **B-grade** answer will correctly summarize Okonjo and Halvorsen and note that one blames norms while the other blames structure. They will apply this to the hologram case but may struggle to explain *why* the warrant doesn't transmit, often slipping into saying "the sceptic wins" or "Moore loses." A genuine **A-grade** answer identifies the specific epistemic mechanism at stake: the *direction of support*. The A student recognizes that Halvorsen's concession (premises are known) is a trap for the unwary; knowing the premise doesn't mean the argument *produces* knowledge of the conclusion. They will explicitly state that for Halvorsen, the warrant for the premise is *dependent* on the conclusion, making the inference epistemically idle, whereas for Okonjo, the inference is potent but socially blocked. The A answer treats the hologram case as a test of *acquisition*, not just truth.
