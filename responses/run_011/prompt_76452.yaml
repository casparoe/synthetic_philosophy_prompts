prompt: |-
  Novelist here. I'm applying for a year of funded time — arts council grant, practice-led PhD, call it a twelve-month research fellowship with a novel at the end of it. The book is set in a mid-size European city tearing itself apart over wether to keep the municipal theater open, and the thing driving it is Rousseau's attack on the theater: the paying audience that sits still and gets fed emotions it then spends, so it never has to do anything, versus his counter-proposal of the open-air festival where the crowd becomes its own spectacle.

  My half-formed worry, which I need sharpened into a real question: is his objection about the form (live imitation, the enclosed building, tickets, professionals who sell themselves to be someone else) or about the psychology (feeling that is cheap and asks nothing further of you)? Those come apart, and for me they matter enormously, because if it's the psychology then the novel inherits the objection too — including his own sentimental bestseller, which he defended in a preface — and he's hoisted by his own petard rather than merely inconsistent.

  Turn that into the proposal. State the question so it actually has a determinate answer. Say why the existing positions leave it open — I know the default move is just to call him inconsistent for writing Julie, and I want past that. Lay out how I'd settle it and argue for that method over the obvious alternative, which is transposing the argument onto film and streaming; I think that begs the question, since those already blow up the liveness and the enclosure, so you can't tell which half of his objection is doing the work. Then tell me what a result would look like that actually changes scenes in the novel rather than just sitting next to it, what would count as the project failing — including if the two readings turn out to be inseparable in the texts and the question has to be reframed — and a realistic scope for twelve months that I'm also drafting in. No bibliography, I'll handle references myself.
reasoning: |-
  Here's a thinking process that leads to the proposal:

  1.  **Analyze the Request:**
      *   **User:** Novelist applying for funded time (Arts Council, PhD, Fellowship).
      *   **Project:** A novel set in a European city debating closing a municipal theater.
      *   **Core Conflict:** Rousseau's *Letter to d'Alembert on the Theatre* (theater as passive consumption vs. festival as active participation).
      *   **The Problem/Question:** Is Rousseau's objection to theater *formal* (building, tickets, actors) or *psychological* (passive empathy, cheap emotion)?
      *   **The Stakes:** If it's psychological, Rousseau is hypocritical (wrote *Julie*, a sentimental novel). If it's formal, he's consistent. The novelist needs to know which one drives the novel's conflict.
      *   **Requirements:**
          *   Turn the worry into a sharp research question with a determinate answer.
          *   Explain why existing positions (calling him inconsistent) are insufficient.
          *   Propose a method to settle it (argue against using film/streaming as a test case).
          *   Define what a successful result looks like (changes scenes in the novel).
          *   Define what failure looks like (including if the distinction collapses).
          *   Set a realistic 12-month scope (research + drafting).
          *   No bibliography.

  2.  **Deconstruct the Core Question:**
      *   *Current Worry:* Is it form or psychology?
      *   *Refinement:* It needs to be answerable. "Is it A or B?" is good, but needs to be framed as an investigation into the *mechanism* of Rousseau's critique.
      *   *Proposed Question:* Does Rousseau's critique of the theater in the *Letter to d'Alembert* rest on the *material conditions of spectatorship* (architecture, economy, liveness) or the *affective structure of identification* (pity without action)?
      *   *Why it matters:* If it's material, the novel can save the theater by changing how it's used. If it's affective, the theater *must* close, and the novel becomes a tragedy about inevitable corruption.

  3.  **Address Existing Positions:**
      *   *Standard View:* Rousseau is inconsistent/hypocritical because he wrote *Julie* (a novel that induces private emotion).
      *   *Critique:* This dismisses the nuance. *Julie* has a preface defending its moral utility. Maybe he thinks print works differently than stage? Maybe he thinks the *Letter* is about civic cohesion, not individual morality? The proposal needs to move past "Rousseau was a hypocrite" to "What is the specific mechanism of corruption?"

  4.  **Methodology:**
      *   *The "Obvious" Alternative:* Apply the critique to film/streaming.
      *   *Why Reject It:* Film/streaming already lack "liveness" and "enclosure" in the 18th-century sense. It muddies the water. If Rousseau hates film, is it because it's passive (psych) or because it's recorded (form)? Hard to tell.
      *   *The Proposed Method:* Close reading of the *Letter* alongside *Julie* (specifically the Preface) and *Essay on the Origin of Languages*. Focus on the *economy of attention* and the *spatial arrangement*. Compare the "festival" in the *Letter* not just to theater, but to the act of reading *Julie*.
      *   *Creative Method:* "Practice-led." Write key scenes based on Hypothesis A (Form), then rewrite based on Hypothesis B (Psych). See which creates the necessary dramatic tension.

  5.  **Outcomes (Success/Failure):**
      *   *Success:* The research dictates the plot resolution.
          *   If Form: The characters find a way to repurpose the building (open doors, free entry, audience participation). The theater stays open but changes.
          *   If Psych: The theater must close. The "villain" isn't the budget, it's the human heart. The festival scene in the book must feel fundamentally different (no spectators).
      *   *Failure:* The distinction collapses. Rousseau *does* conflate them so thoroughly they can't be separated.
          *   *Pivot:* The novel then becomes about the *impossibility* of distinguishing form from psychology. The characters try to fix one and fail because of the other.
      *   *Scope:* 12 Months.
          *   Months 1-3: Archival/Textual Research.
          *   Months 4-8: Drafting specific "test" chapters.
          *   Months 9-12: Revision and integration.

  6.  **Drafting the Proposal (Iterative Process):**
      *   *Tone:* Academic but creative. Persuasive. Clear stakes.
      *   *Title:* Needs to sound professional. "The Architecture of Pity" or "The Rousseau Paradox." Let's go with something about the mechanism.
      *   *Section 1: The Question.* Make it punchy.
      *   *Section 2: Context.* Dismiss the "hypocrisy" claim.
      *   *Section 3: Method.* Why text + practice, not film.
      *   *Section 4: Impact on Novel.* Concrete examples.
      *   *Section 5: Risk & Scope.* Realistic timeline.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I answer the prompt's requirement about film? Yes, need to explicitly state why film is a bad control variable.
      *   *Check:* Did I define failure? Yes, if the distinction is inseparable.
      *   *Check:* Is the timeline realistic? 12 months for research + draft is tight but doable for a fellowship proposal. Need to emphasize *targeted* drafting, not the whole book.
      *   *Check:* The prompt asks to "State the question so it actually has a determinate answer." I need to ensure the question isn't just philosophical musing but something that leads to a binary (or trinary) decision point for the plot.

  8.  **Final Polish:**
      *   Ensure the voice is confident.
      *   Make sure the link between the philosophical inquiry and the *physical scenes* in the novel is clear. (e.g., Does the protagonist fight for funding or fight for a new seating arrangement?)

  9.  *(Final Review against constraints)*: No bibliography. 12-month scope. Include failure conditions. Address the film/streaming alternative. Address the *Julie* inconsistency.

      *Let's write it.*
answer: |-
  **Project Title:** The Architecture of Pity: Determining the Mechanism of Rousseau's Theatrical Critique for Narrative Application

  **Research Question**
  Does Jean-Jacques Rousseau's objection to the theater in the *Letter to d'Alembert* rest primarily on the **material conditions of spectatorship** (enclosure, ticketing, professional separation) or the **affective structure of identification** (pity that substitutes for action)?

  This question requires a determinate answer because it dictates the resolution of the novel. If the objection is material, the municipal theater can be saved by altering its spatial and economic usage (open doors, abolished tickets, audience performance). If the objection is affective, the theater must close; the corruption lies in the act of private emotional consumption itself, regardless of the venue.

  **Context and Existing Positions**
  The standard critical position is that Rousseau is inconsistent. Critics point to his sentimental novel *Julie, or the New Heloise* as proof that he merely objected to the *stage*, not the *emotion*, since the novel induces private tears without civic action. This reading dismisses Rousseau's own defense in the Preface to *Julie*, where he argues that the novel's isolation forces the reader back upon their own conscience, whereas the theater externalizes it.

  To simply label this "hypocrisy" is a critical dead end for a novelist. It treats the contradiction as a biographical flaw rather than a structural tension. If I accept the standard view, the novel's conflict resolves into a simple satire of a hypocritical city. However, if there is a coherent distinction between *how* a medium structures attention, the novel can explore a genuine political dilemma: can a civic institution be redeemed, or is the medium of "spectacle" inherently corrosive to republican virtue?

  **Methodology**
  I propose a practice-led textual analysis. I will not test Rousseau's theory against film or streaming, as is common in media studies. This begs the question: film and streaming already dissolve the 18th-century "liveness" and "enclosure" Rousseau critiques. If Rousseau would hate Netflix, we cannot know if he hates it because it is passive (psychology) or because it is screened/recorded (form). The variables are already confounded.

  Instead, I will isolate the variables through close reading and creative prototyping:
  1.  **Textual Triangulation:** I will map the *Letter to d'Alembert* against the Preface to *Julie* and the *Essay on the Origin of Languages*. I am looking for the specific moment Rousseau defines the "corruption." Is it when money changes hands? Is it when the audience sits in the dark? Or is it when pity is felt without a specific object to help?
  2.  **Creative Prototyping:** I will draft two versions of the novel's climax.
      *   *Version A (Formal Critique):* The characters save the theater by breaking the walls, removing seats, and making the production free and participatory.
      *   *Version B (Psychological Critique):* The characters realize the theater must close, and the climax shifts to an open-air festival where there is no stage, only the crowd.
      *   By writing both, I will test which resolution sustains the dramatic tension established in the earlier chapters. The text itself will reveal which philosophical reading carries the necessary narrative weight.

  **Impact on the Novel**
  This research is not contextual background; it is structural engineering. The answer determines the physical action of the third act.
  *   **If Material:** The protagonist's battle is against the city council and architects. The victory is a renovation. The scene involves sledgehammers and seating charts.
  *   **If Affective:** The protagonist's battle is against their own desire for catharsis. The victory is the dissolution of the troupe. The scene involves silence and dispersal.

  **Risk and Failure Conditions**
  The project fails if the research confirms that Rousseau's form and psychology are inseparable in the text—that one cannot exist without the other in his philosophy.
  *   **Mitigation:** If the distinction collapses, the novel's theme shifts from "Can we save the theater?" to "Why do we lie to ourselves about why we need it?" The failure of the philosophical distinction becomes the subject of the book. The characters attempt to fix the form, fail, and are forced to confront the psychological dependency. This is a viable narrative outcome, but it must be identified by Month 6 to avoid drafting the wrong climax.

  **Scope and Timeline (12 Months)**
  *   **Months 1–3 (Research):** Close reading of primary texts (*Letter*, *Julie*, *Essay*). Annotation of specific passages regarding space, economy, and emotion. No secondary literature beyond what is necessary to contextualize the "inconsistency" debate.
  *   **Months 4–7 (Drafting):** Composition of the novel's first two acts (establishing the conflict) and the two prototype climaxes (Version A and Version B).
  *   **Months 8–9 (Evaluation):** Comparative analysis of the prototypes. Which ending resonates with the established logic of the characters? Which feels like a betrayal of the premise? Selection of the final path.
  *   **Months 10–12 (Revision):** Integration of the chosen climax into the full draft. Polishing the thematic through-line to ensure the philosophical inquiry is embodied in action, not dialogue.

  This fellowship allows me to resolve the philosophical engine of the book before the narrative chassis is fully built, ensuring the final novel is not merely *about* Rousseau, but *structured* by the answer to his problem.
