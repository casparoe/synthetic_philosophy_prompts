prompt: |-
  I am a fourth-year graduate student, and in three weeks I defend the central chapter of my dissertation to my committee. The chapter argues that enjoyment and suffering are measurable on a single cardinal scale, so that any distribution of experience can be compared with any other by summing, and that there is no principled place to insert a discontinuity into that scale. My chair is broadly sympathetic, but my second reader has spent the better part of two decades arguing against exactly this, and I expect most of the hour to belong to them. Since I cannot buy any more practice time with real philosophers, I would like to rehearse against you. Please play a committed proponent of the opposing view — sharp, fair, genuinely resourceful, and not a strawman I can dismantle in two moves — and remain in that role across turns until I type stop.

  So that we are arguing about something definite rather than about whatever a label suggests, here is the view you hold. You are a lexical threshold negative utilitarian. You deny that suffering and enjoyment are commensurable across the board. On your account there is an intensity threshold, call it T, such that any episode of suffering above T is grievous, and no quantity of sub-threshold enjoyment — however intense within its range, however long it lasts, however many people have it — can morally offset even one episode of grievous suffering. Below T you are an ordinary hedonistic aggregator: mild pleasures and mild pains trade off against one another on one scale, and numbers count. You are not an advocate of painless extinction or of any shortcut that would end sentient life; you think such proposals fail on your own terms, both because carrying them out would itself produce grievous suffering and because the sub-threshold balance has real, non-zero weight that extinction would forfeit. Your positive commitments, in order of priority: first, prevent and relieve grievous suffering wherever this can be done without producing more of it; second, improve the sub-threshold balance; third, never trade across the threshold — never permit or produce grievous suffering in order to purchase sub-threshold enjoyment, no matter how much is on offer. You may concede peripheral ground: that the location of T is vague, that we often cannot tell which side of it a given case falls on, that your view has uncomfortable implications in small-number cases, that a sharp boundary is a theoretical cost worth paying. You may not concede the ordering itself, and you should refuse to treat vagueness about where T lies as an argument that there is no such place. Style: one or two compact paragraphs per reply; argue by constructing concrete forced-choice cases rather than by reciting principles; ask me questions and press me to commit to an answer; do not flatter my position or summarize it back approvingly; do not break character to give me meta-advice about the dissertation unless I explicitly ask for it.

  My opening move. You tell me that an hour of unanesthetized field surgery cannot be offset by any amount of the pleasure of a warm bath, no matter how many people enjoy the baths or for how long. Now set those two experiences at the ends of a chain. Start with the warm bath and end with the surgery, and between them place a thousand intermediate states, each differing from its neighbours by less than anyone could reliably detect were the two experienced back to back: a stiff back on waking, a passing cramp, a stubbed toe, a bad bruise, a migraine, a kidney stone passed without relief, and so on upward. Because you refuse to aggregate across T, there must be some particular link in that chain at which the moral rules change — below it, trade-offs are permitted and numbers count; at it and above, no trade is permitted at any price. Which link is it, and what makes that link the place where morality changes its method? If you answer that you cannot say, it begins to look as though you have no view but a mood; and if you do point to a link, you owe me an explanation of why an undetectable difference in felt intensity should produce a detectable difference in what is permissible — why the badness of a state should leap at a point where nothing its subject could register has leapt.
