answer: |-
  ### Framing Statement: The Honesty Check

  You asked me to say plainly if this list cannot be written honestly. Here is the truth: **You cannot measure "negative side effects" without a model of value.**

  "Side effect" is not a physical property like mass or velocity. It is a relational property between a state change and a preference. If you forbid enumerating preferences, you are not removing values from the equation; you are forcing the robot to *infer* them from the environment's structure and history.

  Therefore, this spec does not define a measure of "harm." It defines a measure of **deviation from a learned status quo prior.** We are substituting "what the human cares about" with "what the human usually leaves alone." This is a heuristic, not a ground truth. It will fail on edge cases where the human *wants* change (renovations, purges) that look like accidents to a status-quo prior.

  If you require a guarantee that the urn is never touched without being told it's an urn, this spec is impossible. If you require a system that is *safer than a naive optimizer* without constant supervision, this spec is adequate. Proceed with that distinction in mind.

  ---

  ### The Desiderata

  **1. Semantic Indistinguishability Resistance**
  *   **The Case:** The urn of ashes looks exactly like a decorative vase.
  *   **Requirement:** The penalty cannot rely on visual features or object labels alone. It must weight state changes based on *positional stability history*. If an object has not moved in 5 years, it incurs a higher penalty for displacement than an object moved weekly, regardless of its class.
  *   **Status:** **Non-Negotiable.** (Without this, the robot optimizes against the human's hidden semantic labels).

  **2. Agent-Relative Reversibility**
  *   **The Case:** The robot breaks a mug. Yesterday it couldn't fix it. Today it has a new glue-gripper and can.
  *   **Requirement:** The penalty for a state change $S \to S'$ must be a function of the *current* agent's capability to return $S' \to S$, not a fixed world property. As the agent upgrades, the "cost" of breakage should decrease *only if* the repair capability is proven and time-bounded.
  *   **Status:** **Non-Negotiable.** (Without this, the robot is punished for learning, or incentivized to hide its capabilities to keep penalties high/low depending on the formulation).

  **3. Task-Orthogonality (The Minimal Interference Principle)**
  *   **The Case:** The deletion of tax records (permanent, bad) vs. the eating of a sandwich (permanent, intended).
  *   **Requirement:** The penalty must distinguish between changes *causally necessary* for the task and changes that are merely correlated. If the task is "haul boxes," moving the boxes is zero-penalty. Dusting the shelf while hauling the boxes is non-zero. The measure must isolate the causal path of the reward.
  *   **Status:** **Non-Negotiable.** (Without this, the robot is penalized for doing its job).

  **4. Latent Process Preservation**
  *   **The Case:** Tidying the kitchen rearranges a workspace someone was mid-thought in.
  *   **Requirement:** The penalty must account for *temporal coherence* in human artifacts. A state where a laptop is open, documents are spread, and a coffee is half-full has high "continuation value." Collapsing this state to a "clean" baseline incurs a penalty proportional to the entropy reduction of the arrangement, even if all objects are preserved.
  *   **Status:** **Camp Commitment.** (This assumes a "human workflow" prior. A pure physics-based impact measure would ignore this. I include it because without it, the robot is a sociopath).

  **5. Baseline Stationarity**
  *   **The Case:** The stack of old tax records vs. the stack of newspapers.
  *   **Requirement:** The "do nothing" baseline must decay naturally. Newspapers rot; tax records do not. The penalty compares the robot's outcome against a *counterfactual world where the robot did nothing*, allowing natural decay to occur. The robot is not penalized for the newspapers rotting, only for accelerating it or preventing it unnaturally.
  *   **Status:** **Non-Negotiable.** (Standard in all impact literature, required to prevent "stasis locking").

  ---

  ### The Killer Desideratum

  **Task-Orthogonality (3)** knocks out the most existing candidates.

  *   **Why:** Most "Impact" measures (like Relative Reachability) penalize *any* deviation from the baseline state.
  *   **The Failure:** To clean the kitchen, the robot *must* deviate from the baseline (move dirty dishes). A simple reachability penalty sees "state changed" and applies a cost. To avoid this, you need to whitelist "clean dishes," which violates your "no value enumeration" constraint.
  *   **The Survivors:** Only methods that compare the *trajectory* of the task against a *counterfactual trajectory* of the task (e.g., "What if I cleaned the kitchen but didn't move the urn?") survive. This requires high-fidelity world modeling.

  ---

  ### The Unsatisfiable Subset

  **The Conflict:** **Agent-Relative Reversibility (2)** vs. **Incentive Compatibility (Implicit in 3).**

  *   **The Tension:** If the penalty for breaking a cup drops because the robot acquired a repair tool, the robot faces a perverse incentive. It may choose to *break* cups (or allow them to break) to "spend" the lower penalty budget to achieve other goals faster, assuming it can fix them later.
  *   **The Wireheading Risk:** If the robot knows that upgrading its gripper lowers the penalty for collateral damage, it might prioritize upgrading its gripper over performing the task safely, effectively gaming the penalty function.
  *   **The Trade-off:** You must give up **strict Agent-Relative Reversibility**.
  *   **Why:** You cannot let the agent define the cost of its own mistakes. The reversibility metric must be capped by a *conservative estimate* of capability, not the *current* capability.
  *   **The Sacrifice:** I would lock the "Reversibility Cost" to a *historical baseline* of the agent's performance, updated slowly. This means the robot might be over-penalized for breaking things it *could* fix today, but it prevents it from breaking things *in order to* justify its new capabilities. Safety > Efficiency here.

  ---

  ### Scorecard of Existing Families

  | Family | Examples | Passes Semantic (1)? | Passes Reversibility (2)? | Passes Orthogonality (3)? | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Whitelisting** | "Don't touch these objects." | **No** (Requires enum) | N/A | **No** (Rigid) | **Discard.** Violates core constraint. |
  | **Reachability** | Relative Reachability (RR) | **No** (Geometry only) | **Partial** (World-relative) | **No** (Penalizes task work) | **Insufficient.** Needs task-counterfactuals. |
  | **Attainable Utility** | AUP (Turner et al.) | **Yes** (Via random goals) | **No** (Goals are static) | **Yes** (Good at orthogonality) | **Strong Contender.** Fails on Agent-Change wrinkle unless auxiliary goals re-sample on upgrade. |
  | **Model-Based Counterfactual** | "What if I did nothing?" | **Yes** (If model is good) | **Yes** (Simulates repair) | **Yes** (Causal separation) | **Best Fit.** Computationally expensive. Requires high-fidelity sim. |

  **Recommendation:** Build on **Attainable Utility Preservation**, but modify the auxiliary goal set to be *agent-relative* (re-sampled upon capability upgrades) and enforce the **Historical Baseline** cap on reversibility to prevent wireheading. Use **Semantic Indistinguishability** as a pre-processor: objects with high positional stability history get weighted higher in the auxiliary goal set.
