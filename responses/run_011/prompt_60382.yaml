answer: |-
  Here is your Q&A prep sheet. I have ranked these by lethality. The top three can kill the chapter's theoretical contribution; the middle three can cripple the evidence; the bottom three are manageable but distracting.

  I have grouped the overlaps at the end so you don't burn time repeating yourself.

  ### 1. The Philosopher of Causation (Interventionist)
  **The Objection:** "I'm worried you're engaging in causal inflation. In an interventionist framework, if $X$ changes the probability of $Y$ by constraining the background conditions, $X$ is still a cause of $Y$. You're drawing a metaphysical distinction between 'causing' and 'repricing the menu,' but empirically, if the volcano hadn't erupted, the marriages would have happened. Isn't 'horizon effect' just a metaphor for 'structural cause'? If I can intervene on the climate to change the marriage rate, it's a cause. What work is the distinction actually doing?"

  *   **Damage:** High. If this sticks, your theoretical innovation is just semantics.
  *   **The Two-Minute Answer:** "It's doing work on *agency attribution*. If I call it a cause, the eruption gets the credit for the outcome. If I call it a horizon effect, the agents get the credit for the navigation. In interventionist terms: intervening on the volcano changes the *parameters* of the system, but intervening on the agents' information or resources changes the *output* within those parameters. I need the distinction to stop historians from treating humans as billiard balls. The eruption didn't stop the marriages; the cost-benefit analysis of the couples did, *given* the eruption."
  *   **Concede Up Front:** "I agree that in a broad counterfactual sense, the volcano is a necessary condition. I'm not denying counterfactual dependence."
  *   **Thinnest Spot:** You haven't formally modeled this. If they push on whether "changing parameters" is itself a causal intervention, you might wobble.

  ### 2. The Early Modernist (Climate Skeptic)
  **The Objection:** "You're building a 'horizon' on top of climate reconstructions that, for 1816 in a specific river valley, are essentially interpolated guesses. The error bars on temperature and precipitation for that region and period are massive. If you can't establish the local environmental shock with precision, how can you claim agents were reacting to it rather than just local market volatility or rumor? You're attributing intentionality to people based on data that might not reflect their lived reality."

  *   **Damage:** High. Undermines the empirical foundation.
  *   **The Two-Minute Answer:** "I'm not using the climate reconstruction as the primary evidence of the shock; I'm using the *grain prices* and *poor-relief outflows* as the proxy for the lived horizon. The climate data establishes the exogenous trigger (Tambora), but the *horizon* is measured by the local economic signals the agents actually saw. I agree the paleo-data is fat; that's why I anchor the 'horizon' in the parish accounts, not the thermometer."
  *   **Concede Up Front:** "You're absolutely right that instrumental data is non-existent here. We are relying on proxies."
  *   **Thinnest Spot:** If they argue that grain prices are endogenous (manipulated by merchants) and not a true signal of scarcity, your link between climate and horizon breaks.

  ### 3. The Labor Historian
  **The Objection:** "I'm uncomfortable with the 'strategic agent' language. You're describing subsistence farmers in a famine year as if they're calculating a menu of options. When people are starving, 'choice' is a luxury category. They aren't 'repricing' their lives; they're being coerced by biology. Doesn't calling this a 'horizon effect' sanitize the violence of the constraint? At what point does a constrained menu become indistinguishable from coercion?"

  *   **Damage:** High. Makes you look naive about power and suffering.
  *   **The Two-Minute Answer:** "That's exactly why I need the distinction. If I call it determinism, their starvation is a natural force. If I call it a horizon effect, I can show how local institutions (poor relief, marriage laws) *mediated* that starvation. Some married, some didn't, some migrated. The variation in outcomes proves there was still a menu, however grim. My goal isn't to sanitize the coercion, but to show where the coercion came from—nature vs. the social rules governing the crisis."
  *   **Concede Up Front:** "I concede the language of 'strategy' can sound too rationalist. 'Survival calculus' might be better."
  *   **Thinnest Spot:** If the marriage rate dropped to near zero, there was no menu. You need to prove variation existed.

  ### 4. The "Empirical Burden" Trap (Anyone, but likely the Philosopher or Economic Historian)
  **The Objection:** "You set a guardrail: horizon talk is only licensed where you show agents were *tracking* the changed menu. But you have parish registers, not diaries. How do you empirically demonstrate they were tracking the horizon and not just following custom or panic? You're inferring their internal state from their external behavior. Isn't that circular?"

  *   **Damage:** Medium-High. Attacks your methodological "guardrail."
  *   **The Two-Minute Answer:** "I'm not inferring internal states; I'm inferring sensitivity to incentives. If marriages drop *only* in parishes where poor-relief tightened, but not where it stayed loose, despite similar price shocks, that shows tracking. I'm looking for differential responses to the same shock. That's the empirical trace of the horizon."
  *   **Concede Up Front:** "I don't have access to their subjective reasoning. I agree."
  *   **Thinnest Spot:** If the correlation isn't tight, or if other variables (epidemics, war demobilization) explain the differential, this collapses.

  ### 5. The Paleoclimatologist (Visiting Scientist)
  **The Objection:** "From an attribution standpoint, linking a single valley's weather in 1816 directly to Tambora is noisy. There was significant internal variability in the North Atlantic Oscillation that year. Are you confident the 'bad season' was volcanic forcing and not just random weather noise? If it was noise, your exogenous shock isn't exogenous."

  *   **Damage:** Medium. Weakens the "natural experiment" aspect.
  *   **The Two-Minute Answer:** "I don't need to prove 100% attribution for the chapter to hold. I need to prove the agents *believed* it was a systemic shock. However, the synchronicity of the harvest failure across the broader region suggests a forcing larger than local noise. I'm using the volcano as a time-marker for a regional crisis, not claiming a perfect physical chain for every rainfall."
  *   **Concede Up Front:** "Attribution science has moved far beyond what historians usually do. I am using the historical consensus on the 'Year Without a Summer'."
  *   **Thinnest Spot:** If they have a paper showing 1816 wasn't actually that anomalous in your specific region, your "shock" vanishes.

  ### 6. The Economic Historian
  **The Objection:** "Grain prices are signals, but they're also manipulated. If local merchants hoarded to drive prices up, the 'horizon' changed because of market structure, not the volcano. How do you disentangle the environmental shock from the market response? You might be measuring merchant power, not environmental history."

  *   **Damage:** Medium. Offers an alternative explanation.
  *   **The Two-Minute Answer:** "That's a feature, not a bug. The 'horizon' includes the market response. The agents don't care if the price is high because of rain or greed; they care that the price is high. My argument is about the *human response to the constraint*, regardless of the constraint's ultimate origin. However, I do control for known hoarding scandals in the text."
  *   **Concede Up Front:** "Prices are never pure signals of scarcity."
  *   **Thinnest Spot:** If hoarding was the *primary* driver, the environmental history angle becomes secondary.

  ### 7. The State Formation Scholar
  **The Objection:** "You're focusing on the parish and the household. But 1815–1820 is post-Napoleonic state consolidation. Where is the fiscal capacity? If the state had the capacity to import grain, the horizon wouldn't have shifted. Isn't your 'horizon effect' actually just a story about state failure?"

  *   **Damage:** Medium. Rescales your argument.
  *   **The Two-Minute Answer:** "It is a story about state capacity, specifically the lack thereof. The 'horizon' is defined by the absence of state intervention. I argue that the environmental shock reveals the limits of the fiscal state. The agents are reacting to the vacuum left by the state."
  *   **Concede Up Front:** "I could give the state more analytical weight in the chapter."
  *   **Thinnest Spot:** If the state *did* intervene and you missed it, your "constraint" narrative is wrong.

  ### 8. The Social Historian
  **The Objection:** "You're using marriage registers. But in a crisis, the people who migrate or die don't get married. Aren't you looking at the survivors? If the most vulnerable disappeared from the valley, your 'strategic agents' are just the ones lucky enough to stay. Isn't this selection bias?"

  *   **Damage:** Low-Medium. Standard historical critique.
  *   **The Two-Minute Answer:** "I use migration registers alongside marriage to capture the exit option. The 'menu' includes leaving. The poor-relief accounts capture those who stayed and starved. I'm triangulating the three to avoid looking only at the survivors."
  *   **Concede Up Front:** "Registers always miss the invisible."
  *   **Thinnest Spot:** If your migration data is spotty, you can't prove the "exit" option was real.

  ---

  ### Overlaps (How to bundle answers)
  *   **The Philosopher (#1) and The Empirical Burden (#4):** Both ask "Is this just causation/How do you know?" Bundle these by emphasizing that *mechanism* matters more than *counterfactuals*. You are tracing the *pathway* (price -> decision), not just the outcome.
  *   **The Early Modernist (#2) and Paleoclimatologist (#5):** Both attack the climate data. Bundle these by pivoting to *prices* as the lived reality. "I study the history of the *response*, not the history of the *rain*."
  *   **The Labor Historian (#3) and State Formation (#7):** Both ask about power/coercion. Bundle these by framing the "horizon" as the intersection of biological necessity and institutional failure.

  ---

  ### The Question You Are Praying Nobody Asks
  "Can you show me a single document where an agent explicitly says, 'I am delaying marriage because the horizon has shifted,' rather than just 'I have no money'? If they say 'no money,' isn't that just standard economic determinism, and you've just added a fancy label to poverty?"

  *   **Why it hurts:** It exposes that your "horizon" might be indistinguishable from "budget constraint" in the historical record.
  *   **Prep:** You need to find a quote where someone references *future uncertainty* or *risk*, not just current lack of funds. If you don't have one, admit it: "They speak in the language of subsistence, but the pattern of behavior shows risk management."

  ### The Single Thing That Must Land
  You must successfully operationalize the difference between **Force** and **Filter**.
  *   **Force:** The volcano makes the crops die. (Nobody disputes this).
  *   **Filter:** The dead crops make *Option A* (marriage) too expensive relative to *Option B* (migration), but *Option C* (staying single) remains.
  *   **The Landing:** If you can show that different groups chose different options (A, B, or C) based on their specific position in the parish accounts, you prove they were navigating a menu, not being swept by a tide. **Variation in response is your proof of agency.** If everyone did the exact same thing, you look like a determinist. Emphasize the *variation*.
