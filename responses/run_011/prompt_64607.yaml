  Elias and Julian are thirty-year-old males with identical vestibular physiology: both possess a vestibulo-ocular reflex (VOR) gain of 0.6, significantly below the species-typical range of 0.9 to 1.0, causing retinal image slip during head rotation without conscious awareness or pain. This sub-statistical efficiency constitutes a failure of the evolved mechanism designed to stabilize gaze during movement, yet the deficit remains outwardly invisible when the head is stationary and produces no somatic discomfort. Elias works as a tower crane operator in a windy coastal city, where constant head movements to track loads combined with cab vibration induce persistent visual blur that compromises safety and prevents task completion, whereas Julian works as a night archivist in a climate-controlled vault, spending shifts seated before static documents with minimal head rotation, rendering the visual instability functionally inert. Neither man suspects a medical condition, attributing Elias's errors to fatigue and Julian's competence to diligence, and the biological state remains undiagnosed, ensuring that no belief about pathology influences their respective outcomes.

  (i) **Theoretical Application:**
  For **Boorse**, the verdict is disease for both. His Biostatistical Theory defines disease as an internal state that reduces functional ability below statistical efficiency relative to an age-and-sex reference class. The VOR is a species-typical function; a gain of 0.6 is statistically sub-normal for thirty-year-old males. Boorse explicitly separates *disease* (biological deviation) from *illness* (social incapacity). Since the internal state and functional reduction are identical, both men have the disease, regardless of whether the environment triggers incapacity.
  For **Wakefield**, the verdict diverges. His Harmful Dysfunction Analysis requires two conjuncts: *Dysfunction* and *Harm*.
  *   **Dysfunction:** Both men satisfy this. The VOR mechanism fails to perform its evolutionarily selected function (gaze stabilization) at the designed level. This is a factual, naturalistic claim independent of context.
  *   **Harm:** This is the value-laden clause. Harm is defined as the deprivation of benefit as judged by social values. Elias suffers harm: the dysfunction prevents him from working safely, threatening his livelihood and physical safety, which are socially valued benefits. Julian suffers no harm: his life goals and daily activities do not require rapid head movement, so the loss of gaze stability deprives him of no valued benefit.
  *   **Verdict:** Elias has a disorder (Dysfunction + Harm). Julian has a dysfunction but no disorder (Dysfunction + No Harm).

  (ii) **Source of Divergence and Indexing:**
  The divergence arises from how each theory indexes the *consequences* of the biological state. Boorse indexes functional efficiency to the **species-typical physical environment** (e.g., moving through gravity), ignoring specific social niches. Wakefield indexes the *harm* clause to the **individual's actual social context** and valued goals.
  *   **If Boorse's functions were relativized to the actual environment:** If functional efficiency were measured against Julian's specific sedentary environment rather than the species-typical range, Julian's VOR might count as "efficient enough," and Boorse would verdict "no disease." This would collapse the divergence, aligning Boorse with Wakefield, but it would undermine Boorse's naturalist project by making disease status dependent on social circumstance.
  *   **If Wakefield's harm clause were relativized to a standard social setting:** If harm were judged against a "standard" human life (which includes driving, sports, or emergency evacuation requiring head movement) rather than Julian's specific niche, Julian might be considered harmed (he lacks a capacity typical humans value for safety). This would force Wakefield to verdict "disorder" for Julian, collapsing the divergence and making his account more naturalist-like. The divergence survives only because Boorse refuses to relativize function to social context, while Wakefield insists on relativizing harm to it.

  (iii) **Residual Differences:**
  The individuals are not perfectly matched in **behavioral history**. To maintain the job of crane operator, Elias likely moves his head more frequently than Julian, potentially inducing secondary physiological adaptations (e.g., neck muscle tension) or stress responses that Julian lacks. However, these are downstream effects of the interaction between the trait and the environment, not differences in the trait itself. This does not threaten the case because the theories evaluate the *trait's* status, not the secondary stress markers. The core biological specification (VOR gain) remains identical, which is the locus of the dysfunction/disease judgment.

  (iv) **Wakefield Defender's Reply:**
  A defender of Wakefield could argue that the **harm clause is less plastic** than the scenario assumes. They might claim that certain capacities (like stable vision) are inherently valued by society regardless of current usage, akin to having a working brake system in a car that is never driven. If "potential for harm" counts as harm, Julian is harmed because his safety is compromised should an emergency require rapid head movement. Alternatively, a defender might press for a **more locally drawn reference class** for dysfunction, arguing that if the mechanism is not *needed* in the local environment, it isn't truly "functioning" in a way that matters. However, this risks conceding the naturalist point that dysfunction is context-independent. The strongest reply is to insist that "harm" requires actual deprivation of well-being, not mere risk, preserving the verdict that Julian is not disordered, but acknowledging that this makes "disorder" highly sensitive to transient social circumstances.

  (v) **Implications for Naturalism vs. Normativism:**
  This case establishes that **naturalist and hybrid accounts can extensionally diverge** on the concept of disorder even when agreeing on the biological facts. It shows that Wakefield's hybridity allows him to capture the intuition that Julian is not "disordered" despite being biologically identical to Elias, whereas Boorse's strict naturalism forces him to label Julian diseased.
  However, the divergence does not decisively prove normativism. A **pure normativist** (who rejects the dysfunction clause entirely and defines health as the ability to pursue vital goals) would agree with Wakefield's verdicts (Elias unhealthy, Julian healthy) but for different reasons: Julian's goals are unimpeded, so he is healthy, full stop. The case highlights that the *dysfunction* clause in Wakefield's account is doing no work in distinguishing the two men; only the *harm* clause does. Thus, the case suggests that if our intuitive concept of disorder tracks harm rather than biological deviation, the naturalist component (dysfunction) may be redundant for distinguishing disorder from non-disorder in contextual cases, lending weight to normativist critiques that value judgments are the primary drivers of our disorder attributions.
