answer: |-
  This is a sharp observation. You have correctly identified that your friend's behavior violates standard Expected Utility Theory (which assumes known probabilities) but aligns perfectly with a more sophisticated view of uncertainty.

  Standard decision theory often conflates two types of uncertainty that your friend is intuitively separating. To carve this out, we need to distinguish between the randomness of the *outcome* and the uncertainty of the *model*.

  Here are the nearest established concepts, why they fall short, and a proposal for a term that captures the specific geometry of the problem you're describing.

  ### 1. The Near Misses

  **Risk Aversion (Diminishing Marginal Utility)**
  *   **The Concept:** You value the 100th dollar less than the 1st. Therefore, variance is painful.
  *   **Why it fails:** As you noted, standard risk aversion should make repeated play *more* attractive. By the Law of Large Numbers, the variance of the average outcome decreases with $N$. If the utility function is concave but the bet is +EV, a sequence of bets is *less* risky per unit than a single bet. Your friend is doing the opposite.

  **Ambiguity Aversion (Knightian Uncertainty / Ellsberg Paradox)**
  *   **The Concept:** People prefer risks with known probabilities (a jar with 50 red/50 black balls) over risks with unknown probabilities (a jar with an unknown mix).
  *   **Why it fits:** This is the strongest existing match. Your friend treats the 55% not as a frequency, but as a subjective estimate. He is averse to the "ambiguity" of that estimate.
  *   **Why it falls short:** Ambiguity aversion usually explains the rejection of the *single* bet compared to a known risk. It doesn't inherently explain why the *sequence* is treated differently than the *singleton*. In fact, standard ambiguity models often suggest that if you are ambiguity-averse, you should be *equally* averse to one bet or ten. It doesn't capture the *scaling* of the aversion with repetition.

  **Ergodicity Breaking (Time Average vs. Ensemble Average)**
  *   **The Concept:** Popularized recently by Ole Peters and Murray Gell-Mann. In non-ergodic systems, the average outcome across many people (ensemble) does not equal the average outcome for one person over time (time).
  *   **Why it fits:** This captures the structural difference between "one week" and "every week."
  *   **Why it falls short:** Ergodicity problems usually focus on *ruin* (absorbing barriers, like going broke). Your friend has sufficient bankroll. The "ruin" here isn't financial; it's the ruin of the *thesis*. It's a epistemic ruin, not a monetary one.

  ### 2. The Core Mechanism: Aleatory vs. Epistemic

  Your diagnosis is correct. The phenomenon hinges on the distinction between **Aleatory Uncertainty** (inherent randomness, e.g., coin flips) and **Epistemic Uncertainty** (lack of knowledge, e.g., is the coin fair?).

  *   **Aleatory uncertainty washes out with repetition.** (Variance $\propto 1/\sqrt{N}$)
  *   **Epistemic uncertainty compounds with repetition.** (Bias $\propto N$)

  If the 55% is a fixed property of the universe, repetition is your friend. If the 55% is a guess about a fixed property that might actually be 45%, repetition is your enemy. Your friend intuitively understands that repeating the bet converts *epistemic* uncertainty into *systemic* risk.

  In your lab example, this is even clearer. A protocol failure is rarely random noise (Aleatory); it is usually a flaw in the design (Epistemic). Repeating a flawed protocol doesn't average out the error; it replicates it. In engineering and biology, this is called **Common Mode Failure**.

  However, "Common Mode Failure" applies to hardware/protocols. We lack a clean decision-theoretic term for when a *betting agent* treats a sequence of wagers as exposed to a single, hidden parameter error.

  ### 3. The Coined Concept: "Epistemic Compounding"

  Since no single term captures the *aversion to repetition specifically due to parameter uncertainty*, I propose we carve this out as **Epistemic Compounding**.

  **Definition:**
  **Epistemic Compounding** occurs when an agent rejects a sequence of positive-expected-value decisions because they perceive the probability estimate ($p$) as a random variable rather than a constant. The agent recognizes that while outcome variance decreases with repetition ($N$), the exposure to parameter error increases linearly with $N$.

  **The Logic:**
  Let $E$ be the expected return.
  Standard Model: $E = N \times (p \cdot \text{win} - (1-p) \cdot \text{loss})$. Here, $p$ is constant.
  Epistemic Compounding Model: $p$ is drawn from a distribution $\hat{p} \sim N(\mu, \sigma^2)$.
  If $\mu < 0.5$ (your estimate was wrong), then $Loss \propto N$.
  The agent is not fearing the variance of the coin; they are fearing the certainty of the bias.

  **Why this carves the joint:**
  It distinguishes the behavior from standard risk aversion (which fears variance) and standard ambiguity aversion (which fears the unknown). It specifically targets the *interaction between time/repetition and model confidence*.

  ### 4. A Case That Looks Like It, But Isn't

  To test the boundary, consider a case of **Frictional Accumulation**.

  **The Scenario:**
  A trader is offered a bet: Invest \$100 to make \$110 with 55% probability. He takes it once.
  He is offered the same bet 100 times. He rejects it.

  **Why it looks like Epistemic Compounding:**
  He accepts the singleton, rejects the sequence. Stakes are small relative to wealth.

  **Why it isn't:**
  Suppose every bet incurs a \$1 transaction fee (tax, spread, effort).
  *   **Single Bet:** Expected Gross Profit = \$5. Fee = \$1. Net = +\$4. (Take it).
  *   **Repeated Bet:** Expected Gross Profit = \$500. Fees = \$100. Net = +\$400.
  *   *Wait, that still works.* Let's adjust the fee.
  *   Suppose the "cost" is mental bandwidth or opportunity cost that scales non-linearly.
  *   **Better Counter-Example: Liquidity Lock-up.**
      *   To take the bet, you must lock up capital for a week.
      *   **Single Bet:** \$100 locked for a week. Trivial.
      *   **Repeated Bet:** \$100 locked every week for a year. While the *amount* is the same, the *commitment* reduces flexibility. An unexpected expense in month 6 might require that cash.
      *   **Diagnosis:** Here, the rejection is due to **Option Value** (the value of keeping cash liquid), not distrust of the probability model. The agent trusts the 55% perfectly but values the *freedom to exit* more than the expected return of the sequence.

  **Distinguishing Test:**
  Ask the agent: *"If I could guarantee you the odds are exactly 55.000%, would you take the sequence?"*
  *   If **Yes**: It is **Epistemic Compounding**. (The problem was the model uncertainty).
  *   If **No**: It is **Frictional/Option Value**. (The problem is the structure of the commitment).

  ### 5. Summary for the Biologist

  You are observing a rational response to **Parameter Correlation**.

  In your lab protocol, the "risky step" is a **systemic variable**. If the enzyme is bad, it is bad for all 12 runs. The trials are *conditionally independent* (given the enzyme quality) but *unconditionally correlated* (because we don't know the enzyme quality).

  Your friend treats the bet the same way. He suspects the "coin" is a property of the environment, not a random generator. If the environment is hostile (the 55% is actually 45%), playing more doesn't save him; it indicts him.

  **Epistemic Compounding** is the term for recognizing that repetition reduces *noise* but amplifies *bias*. It is the decision-theoretic equivalent of knowing that measuring a mis-calibrated ruler 1,000 times gives you a very precise, very wrong length.

  Your friend isn't being risk-averse; he's being **model-conservative**. He knows that in the real world, IID (Independent and Identically Distributed) is an assumption, not a law of nature. When you repeat a bet, you are testing the IID assumption as much as you are testing the luck.
