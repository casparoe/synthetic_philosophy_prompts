answer: |-
  Here is the procedure. It is designed to be automated (scripted) as much as possible, leaving your 20 minutes per analyst for triage and conversation, not arithmetic. It prioritizes **capital efficiency** over philosophical coherence, using the Christensen interpretation: incoherence matters because it implies you are choosing a dominated strategy (lower expected return for the same risk), not because a bookie will bankrupt you.

  ### The Philosophy: Why "Bookability" Matters Without Betting
  You are correct that the Dutch Book argument is a fantasy in a corporate desk setting. You cannot be arbitraged by an external counterparty on internal forecasts. However, the **Capital Allocation Argument** holds:
  Your sizing model treats probabilities as truth. If $P(A \cap B) \neq P(A|B)P(B)$, your model is effectively double-counting risk or under-sizing a hedge. Incoherence creates **phantom exposure**. You aren't losing money to a bookie; you are losing money to sub-optimal weightings.
  *   **The Standard:** We flag not when a Dutch Book is *possible*, but when the incoherence is large enough to distort position limits by >5%.

  ---

  ### The Procedure: Probability Integrity Check (PIC)

  **Frequency:** Weekly (automated run Friday PM, Human Review Monday AM).
  **Time Budget:** Script runs in background. You spend 20 mins/analyst reviewing *only* the flags.
  **Tooling:** Python/R script ingesting the forecast CSV.

  #### Step 1: Semantic Sanitization (The "Apple-to-Apple" Check)
  *   **Logic:** Before math, check metadata. Every forecast must have an `Event_ID` and a `Definition_Tag`.
  *   **Check:** If two analysts submit probabilities for `Event_ID: Recession_2025`, their `Definition_Tag` must match (e.g., "NBER Declared" vs. "2 Quarters Negative GDP").
  *   **Flag:** `SEMANTIC_MISMATCH`.
  *   **Action:** Auto-reject submission. Return to analyst: "Definition tag does not match consensus glossary."
  *   **Human Role:** None. Hard stop.

  #### Step 2: Synchronic Coherence (The "Logic" Check)
  *   **Logic:** Check logical constraints within the same weekly submission.
  *   **Check 1 (Conjunction):** For any $A, B$, is $P(A \cap B) \leq \min(P(A), P(B))$?
  *   **Check 2 (Conditionals):** If analyst provides $P(A)$, $P(B)$, and $P(A|B)$, does $P(A \cap B) \approx P(A|B) \times P(B)$?
  *   **Threshold:** Tolerance of $\pm 0.05$ for rounding noise. Flag if deviation $> 0.05$.
  *   **Flag:** `LOGIC_VIOLATION`.
  *   **Human Role:** Review if deviation implies >5% sizing error.

  #### Step 3: Precision & Commitment (The "Range" Check)
  *   **Logic:** Ranges protect the analyst but break the sizing model.
  *   **Check:** If input is a range $[L, U]$, calculate Width $W = U - L$.
  *   **Threshold:** If $W > 0.20$ (20 percentage points), the input is too vague for sizing.
  *   **Flag:** `IMPRECISE_INPUT`.
  *   **Action:** Model uses Midpoint $(L+U)/2$ for sizing, but flag triggers mandatory review.
  *   **Human Role:** Force analyst to commit to a point estimate for the model, or accept a "haircut" on their limit (e.g., limit reduced by 50% due to uncertainty).

  #### Step 4: Diachronic Consistency (The "Update Rule" Check)
  *   **Logic:** Check stated update rules against current prices.
  *   **Check:** If Analyst says "If Rig Count < X, I go to 0.9," calculate the implied current probability of that conditional state. If the combination of current price + update rule creates a sure-loss scenario *assuming liquidity exists at both timepoints*...
  *   **Decision:** **IGNORE.**
  *   **Reason:** You noted liquidity/timing prevents actual booking. Flagging this creates noise without P&L protection.
  *   **Exception:** Flag only if the update rule contradicts a *current* conditional probability they also submitted (e.g., they say $P(Cut|Recession) = 1.0$ today, but update rule implies $0.8$).
  *   **Flag:** `UPDATE_CONTRADICTION` (Rare).

  #### Step 5: Calibration Review (The "Accuracy" Check)
  *   **Logic:** Coherence $\neq$ Accuracy. A coherent liar is dangerous.
  *   **Check:** Rolling 52-week Brier Score. Compare analyst's score to the desk average.
  *   **Threshold:** Flag if Analyst is Coherent (Steps 1-2 pass) but Brier Score is in the bottom 10th percentile for >4 weeks.
  *   **Flag:** `SYSTEMATIC_BIAS`.
  *   **Human Role:** This is a performance management flag, not a model integrity flag. Do not block sizing, but trigger a coaching review.

  ---

  ### The Output: One-Line Reason Codes
  You need codes that defendable to a senior analyst who thinks they know better.

  1.  `SEMANTIC_MISMATCH`: "Event definition differs from desk glossary."
  2.  `LOGIC_VIOLATION`: "Joint probability exceeds conditional constraint."
  3.  `IMPRECISE_INPUT`: "Range width >20%; model requires point estimate."
  4.  `SYSTEMATIC_BIAS`: "12-month calibration below desk median."
  5.  `NO_ACTION`: "Within tolerance thresholds."

  ---

  ### Validation: Are The Flags Worth Anything?
  To ensure this isn't busywork, you must track **Flag Predictive Power**.
  *   **Metric:** Create a dataset of all forecasts. Tag them `FLAGGED` or `CLEAN`.
  *   **Test:** After the events resolve (e.g., end of quarter), compare the Brier Score of `FLAGGED` forecasts vs. `CLEAN` forecasts.
  *   **Success Criteria:** `FLAGGED` forecasts must have a statistically significantly higher error rate (worse Brier Score) than `CLEAN` forecasts.
  *   **Failure:** If `FLAGGED` forecasts perform just as well as `CLEAN`, your thresholds are too tight. You are flagging noise. Adjust tolerance from 0.05 to 0.10.

  ---

  ### Run-Throughs

  #### Case 1: The Senior Analyst (Analyst A)
  **Input:** $P(Cuts \geq 2) = 0.75$, $P(Recession) = 0.6$, $P(Cuts \geq 2 \cap Recession) = 0.2$. Stated view: "Cuts are certain if Recession" ($P(Cuts|Recession) = 1.0$).
  **Script Run:**
  1.  **Semantics:** Pass.
  2.  **Logic:** Check Conditional. $P(Cuts \cap Recession)$ should be $P(Cuts|Recession) \times P(Recession) = 1.0 \times 0.6 = 0.6$.
      *   Submitted: $0.2$.
      *   Deviation: $0.4$ (Massive).
  3.  **Flag:** `LOGIC_VIOLATION`.
  4.  **Decision:** **FLAG.** This distorts sizing. If the model believes the joint prob is 0.2 but the conditional is 1.0, it under-hedges the recession scenario.
  5.  **The Conversation:**
      *   *You:* "Sarah, the script flagged your recession/cuts matrix. You have cuts certain in a recession, but the joint prob is priced at 0.2. That implies a 0.6 probability mass is missing."
      *   *Her:* "The model is too rigid. I'm expressing nuance."
      *   *You:* "I get that. But the sizing model takes the 0.2 joint prob literally. It thinks there's a 40% chance of recession *without* cuts, which contradicts your view. It's sizing the hedge too small. I need you to align the joint prob to 0.6 or change the conditional to 0.33. Which one reflects your view?"
      *   *Outcome:* She fixes the number. You defend the flag because it prevents under-capitalization.

  #### Case 2: The "Leave It Alone" (Analyst D)
  **Input:** Current $P(Oil > 100) = 0.4$. Update Rule: "If Rig Count drops < X next month, I move to 0.9."
  **Script Run:**
  1.  **Semantics:** Pass.
  2.  **Logic:** Pass (No internal contradiction in current snapshot).
  3.  **Diachronic:** Theoretically, a counterparty could bet against him now and bet with him later if Rig Count drops.
  4.  **Decision:** **IGNORE.**
  5.  **Reason Code:** `NO_ACTION`.
  6.  **Rationale:** As you noted, no counterparty can book this. The "sure loss" requires liquidity and counterparty commitment at $T+1$ that doesn't exist. Flagging this burns political capital with zero P&L protection. The Christensen argument fails here because the "dominated strategy" cannot be executed by the market against you.
  7.  **Note:** If he *also* submits a current conditional $P(Oil > 100 | Rig < X)$ that contradicts the 0.9 target, *then* flag as `LOGIC_VIOLATION`. Otherwise, let it go.

  #### Case 3: The Range Giver (Analyst B)
  **Input:** $P(Default) = 0.3 \text{ to } 0.5$.
  **Script Run:**
  1.  **Semantics:** Pass.
  2.  **Logic:** N/A (Range).
  3.  **Precision:** Width = 0.2. Threshold = 0.2.
  4.  **Decision:** **FLAG** (Borderline).
  5.  **Reason Code:** `IMPRECISE_INPUT`.
  6.  **Action:** The model needs a number. Script auto-converts to 0.4 for sizing.
  7.  **The Conversation:**
      *   *You:* "Mark, your 20-point range is hitting the uncertainty limit. The model is booking you at 0.4, but I'm flagging this because if the real risk is 0.5, we're under-limit."
      *   *Him:* "I don't know enough to commit."
      *   *You:* "Then we have to haircut your limit by 50% until you commit. The desk can't leverage uncertainty."
      *   *Outcome:* Forces commitment or reduces risk exposure. Protects the desk from "hidden" leverage.

  ---

  ### The "Judgment Call in Procedure Costume" Confession
  You asked for honesty. Here is where the procedure is faking objectivity:

  1.  **The 0.05 Tolerance:** This is arbitrary. It's not derived from market friction; it's derived from "how much noise can I tolerate before analysts hate me." If you set it to 0.01, you flag everyone. If 0.10, you catch nothing. You will tune this based on how many flags you can handle in 20 minutes, not on mathematical purity.
  2.  **The "Ignore" on Diachronic:** This is a judgment call that the market is inefficient enough that no one will arb your analyst. If your desk trades highly liquid instruments (e.g., Fed Funds Futures), this assumption is wrong, and you *should* flag D. If you trade illiquid physicals, ignoring D is correct. The procedure assumes illiquidity.
  3.  **Calibration vs. Coherence:** Step 5 (Calibration) is the most valuable but the hardest to defend. A senior analyst can argue "Regime change, past performance doesn't matter." You have to stand firm that *persistent* bias is a risk factor, even if the logic is sound.

  ### Summary of Evidence for Value
  To prove this isn't busywork in 6 months:
  1.  Pull all `LOGIC_VIOLATION` flags from Q1.
  2.  Show that the *corrected* numbers (after you forced the analyst to fix them) would have resulted in better position sizing (higher Sharpe on the forecasted trades) than the *original* numbers.
  3.  If you can show that fixing the incoherence would have saved X basis points on risk-weighted capital, you have your budget for next year. If you can't show that, shut the program down.
