      *(Self-Correction on Case C)*: Coherent but badly calibrated. The Dutch Book check passes. The procedure *must* have a calibration step to catch this. Otherwise, it fails the user's requirement ("I don't want it staying silent").

      *(Refining the 20 min constraint)*: 14 analysts * 20 mins = 4.6 hours. That's enough for a deep dive on flags, not for checking every number. So the *Script* does the math. The *Human* does the triage.

