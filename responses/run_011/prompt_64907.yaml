      *   Let's make Analyst B the "Force Commitment/Flag."

  8.  **Refining the Output Format:**

      *   Needs to be punchy, professional, slightly cynical (matching the user's tone).
      *   One-line reason codes are crucial.
      *   Acknowledge the "Judgment Call in Procedure Costume."

  9.  **Drafting the Content (Mental Sandbox):**

      *   *Tone:* Peer-to-peer. Quant/Desk Head language. No fluff.
      *   *The "Bookability" Argument:* It's about *capital efficiency*, not literal arbitrage. Incoherent probs = distorted risk weights = capital tied up in low-expected-value trades or exposed to tail risk.
      *   *The Procedure:* Call it the "Probability Integrity Check" (PIC).
      *   *Step 1:* Event Definition (Semantic).
      *   *Step 2:* Logical Consistency (Synchronic).
      *   *Step 3:* Input Precision (Ranges).
      *   *Step 4:* Historical Calibration (Accuracy).
      *   *Step 5:* Diachronic (Update Rules) - *Decide to minimize this due to time constraints.*

      *Wait, time constraint:* 20 mins/analyst/week. 35 questions. That's <1 min per question if doing it manually. Most of this *must* be scripted in Python/R/Excel. The human time is for reviewing the exceptions.
      *   *Correction:* The procedure must be an *automated script* that outputs a dashboard. The 20 mins is for the *review* of the dashboard.
      *   *Revised Plan:* The "Procedure" is the Script + The Review Protocol.

  10. **Final Polish:**

      *   Ensure the "One-Line Reason Code" is specific.
      *   Ensure the "Validation" section is concrete (Brier score comparison).
      *   Ensure the "Christensen" point is clear (dominated strategies).
      *   Check against the Hard Cases:
          *   A (Logic): Covered in Step 2.
          *   B (Ranges): Covered in Step 3.
          *   C (Calibration): Covered in Step 4.
