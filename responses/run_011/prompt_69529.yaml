      *   Let's say 6/10. It's passing, shows good reading, but contains specific technical errors that would lose marks in a uni essay. Actually, looking closer at the "leftover 45%" claim - attributing all non-genetic variance to shared household is a common misconception (the "shared environment fallacy"). Twin studies usually show shared environment drops off in adulthood.
