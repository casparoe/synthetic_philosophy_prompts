      If the question is weighted equally between "critique columnist" and "using figure elsewhere," she got 100% of the first half and 0% of the second half. That averages to 5/10. But her writing quality and understanding of the *concept* of heritability (variance ratio) is strong. I'll bump to 6/10 for the quality of the correct arguments, but 6 is honest about the technical errors.

