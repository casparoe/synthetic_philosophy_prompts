      *   **Required Content:**
          *   Desiderata with motivations and test cases.
          *   Coverage: Ordinary counts, sorites, co-location/sharing parts, arbitrary sums, distinctions (composing vs. identity, existence vs. posit, one vs. counted as one, ontic vs. epistemic vagueness).
          *   Consistency results (vagueness, restricted composition).
          *   Identification of non-genuine constraints (preferences of one camp).
          *   Flagging inconsistent desiderata (demonstrate conflict).
          *   Identify the "least resistance" requirement (relinquishing which admits the most accounts).
