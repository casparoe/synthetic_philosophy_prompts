          *   Nihilism: Fails utility.
          *   Contact: Fails Persistence.
      *   *Conclusion:* Recommendation to treat the registry as a *conventional* ontology, not a *fundamental* one.

  10. **Review against Constraints:**
      *   Did I mark settled vs. live disputes? *Need to ensure this is explicit in the text.*
      *   Did I label judgment calls? *Yes.*
      *   Did I demonstrate the conflict? *Yes, via the Sorites/Decidability tension.*
