answer: |-
  ### Specification for an Industrial Ontology of Composition

  The following desiderata constitute the specification for the formal ontology layer of the asset registry. They are derived from the operational requirements of the database and the logical constraints of contemporary mereology.

  **Note on Consensus:** In contemporary metaphysics, there is **no settled consensus** on the correct answer to the Special Composition Question (SCQ). There is, however, a **settled methodological consensus** that any viable theory must be internally consistent, formally specifiable, and able to account for the data (ordinary objects) without contradiction. Where I indicate a "live dispute," this reflects genuine division in the literature. Where I indicate a "judgment call," this is my own recommendation based on the industrial context.

  ---

  ### Part I: Desiderata

  #### 1. Binary Decidability
  *   **Specification:** For any candidate composite $C$ and any time $t$, the system must return a truth value (True/False) regarding the existence of $C$.
  *   **Motivation:** Downstream financial and legal systems (depreciation, theft) operate on binary logic. A record cannot be "50% existent."
  *   **Test Case:** *The Incomplete Assembly.* Is the 60% built machine an asset? The ontology must force a cutoff point (e.g., "functional testing passed") even if metaphysical reality is gradual.
  *   **Status:** **Operational Necessity.** (Metaphysically disputed; see Desideratum 4).

  #### 2. Persistence Through Material Replacement
  *   **Specification:** The identity of a composite entity must be capable of surviving the total replacement of its constituent parts over time, provided functional or structural continuity is maintained.
  *   **Motivation:** Industrial assets are maintained, not preserved in stasis. If the ontology requires strict mereological essentialism (same parts = same object), no asset survives repair.
  *   **Test Case:** *The Stock of Bearings.* Individual bearings are swapped hourly. The "asset" is the functional stock, not the specific metal pieces.
  *   **Status:** **Live Dispute.** (Endurantists/Functionalists accept this; Exdurantists/Mereological Essentialists reject it).

  #### 3. Persistence Through Spatial Discontinuity
  *   **Specification:** The existence of a composite must not depend on the continuous spatial adjacency of its parts.
  *   **Motivation:** Assets are moved, dismantled, and stored.
  *   **Test Case:** *The Production Line.* Dismantled in summer, shipped, reassembled. If composition requires contact, the asset ceases to exist in June and a new one is born in August, breaking warranty and depreciation continuity.
  *   **Status:** **Live Dispute.** (Universalists accept; Contact theorists reject).

  #### 4. Resolution of Vagueness (Epistemic or Ontic)
  *   **Specification:** The account must specify whether borderline cases of composition (Sorites series) are vague due to our ignorance (Epistemicism) or vague in reality (Ontic Vagueness). If the latter, the registry must implement a supervaluationist or degree-theoretic logic.
  *   **Motivation:** To avoid contradiction when determining existence thresholds.
  *   **Test Case:** *The Cooling Circuit.* As fluid is replaced molecule by molecule, at what point is it a new circuit? If existence is vague, the database cannot be crisp.
  *   **Status:** **Live Dispute.** (Most analytic metaphysicians reject Ontic Vagueness; Epistemicism is the dominant but counterintuitive alternative).

  #### 5. Distinction Between Composition and Identity
  *   **Specification:** The ontology must distinguish between "the parts compose the whole" and "the parts are identical to the whole."
  *   **Motivation:** To manage counting. If Composition is Identity, then counting the parts and counting the whole yields the same number, which breaks asset counting (1 line vs. 500 parts).
  *   **Test Case:** *The Bolted Frames.* If the two frames compose a third object (the insured unit), we have three objects. If composition is identity, we arguably only have the two frames described differently.
  *   **Status:** **Settled Methodological Norm.** (While "Composition as Identity" is a live theory, standard database logic requires distinct IDs for distinct records).

  #### 6. Non-Arbitrariness (The "Joints of Nature" Constraint)
  *   **Specification:** The conditions for composition should not be gerrymandered or purely stipulative. There must be a principled reason why *these* parts compose *this* whole, distinct from *those* parts composing *that* whole.
  *   **Motivation:** Philosophical defensibility. If the ontology admits arbitrary sums, it loses explanatory power.
  *   **Test Case:** *Arbitrary Sums.* Does "The left bearing of Machine A + The right bearing of Machine B" constitute an asset? The ontology should say "No" without appealing solely to "we didn't register it."
  *   **Status:** **Live Dispute.** (Universalists reject this constraint; Restrictivists demand it).

  ---

  ### Part II: Non-Genuine Constraints (Camp Preferences)

  Two demands often made in the SCQ debate are not logical constraints but preferences of specific metaphysical camps. For the registry, these should be treated as optional parameters, not hard requirements.

  **1. The "Ordinary Language" Constraint**
  *   **Claim:** The ontology must validate the existence of objects exactly as ordinary language counts them (e.g., "There is one table," not "There are simples arranged tablewise").
  *   **Why it is a Preference:** This is a preference of **Common Sense Realism**. Nihilists and Universalists both violate this (one says there are no tables, the other says there are tables *and* table-minus-a-leg objects).
  *   **Registry Implication:** The registry defines "asset" legally, not linguistically. We can stipulate that the "Production Line" exists even if ordinary language might say "it's in pieces."

  **2. The "No Coincidence" Constraint**
  *   **Claim:** Two distinct objects cannot occupy the same space and be made of the same parts at the same time.
  *   **Why it is a Preference:** This is a preference of **Perdurantists/Constitution Theorists** who wish to avoid multiplicity. It is rejected by those who accept distinct coincident entities (e.g., the statue and the clay).
  *   **Registry Implication:** *The Bolted Frames* case suggests we *need* coincidence. The two frames exist individually; the insured unit exists as a third entity comprising them. Forbidding coincidence forces us to delete either the individual records or the joint record.

  ---

  ### Part III: Inconsistency Demonstration

  **Flagged Conflict:** **Binary Decidability (1)** vs. **Non-Arbitrariness (6)** in the context of **Vagueness (4)**.

  **Demonstration:**
  1.  Assume **Non-Arbitrariness**: There must be a principled, non-stipulative difference between a collection of parts that composes an object and one that does not.
  2.  Assume **Vagueness** (based on *The Cooling Circuit* or *Incomplete Assembly*): There are borderline cases where adding/removing one part does not determinately change the existence status. (e.g., 60% built vs 61% built).
  3.  Assume **Binary Decidability**: The database must record "Exists" or "Does Not Exist."
  4.  **The Conflict:** To satisfy Decidability, you must draw a sharp line (e.g., "60.5% is the cutoff"). To satisfy Non-Arbitrariness, you must explain why 60.5% constitutes an object while 60.4% does not. In Sorites-susceptible cases, no such principled difference exists in the physical world.
  5.  **Result:** You must either admit **Ontic Vagueness** (violating classical logic/Decidability), accept **Epistemicism** (claiming there is a sharp line we cannot know, which violates Non-Arbitrariness because the line is undetectable), or accept **Arbitrariness** (we stipulate the line, violating Non-Arbitrariness).

  **Judgment Call:** For an industrial registry, **Non-Arbitrariness (6)** must be sacrificed to preserve **Binary Decidability (1)**. You must stipulate cutoffs (e.g., "Asset exists upon capitalization approval") even if metaphysics offers no sharp joint in nature at that exact moment.

  ---

  ### Part IV: The Least Resistance

  **Requirement to Relinquish:** **Mind-Independence (Implicit in Non-Arbitrariness).**

  **Reasoning:** The demand that the ontology track "mind-independent joints of nature" is the primary blocker for almost all workable theories in this context.
  *   If you relinquish the demand that the asset's existence be independent of human convention, you admit **Universalism** (everything exists, we just tag what we care about), **Nihilism** (nothing exists, we just simulate composites), and **Moderatism** (we decide the rules).
  *   This transforms the registry from a *discovery* system (finding what exists) to a *stipulative* system (defining what counts).
  *   **Impact:** Relinquishing this admits the largest number of accounts because it moves the problem from Metaphysics to Linguistics/Law. It allows the "Bolted Frames" to be one asset for insurance and two for operations without ontological contradiction, because the "unity" is conferred by the context, not the matter.

  ---

  ### Part V: Evaluation of Candidate Theories

  **1. Unrestricted Composition (Universalism)**
  *   **Performance:** Satisfies **Decidability** (Yes, always) and **Persistence** (Yes). Fails **Non-Arbitrariness** (admits "trout-turkeys").
  *   **Registry Viability:** High, *if* coupled with a conventional layer. If every sum exists, the registry simply filters which sums are "Assets." This handles the *Bearings* and *Production Line* easily.
  *   **Definitive Answer:** Yes, it denotes one thing (and also many others).

  **2. Composition as Identity (CAI)**
  *   **Performance:** Parsimonious. However, it complicates **Counting**. If the Whole *is* the Parts, counting the asset and the parts is double-counting.
  *   **Registry Viability:** Low. Database schemas rely on distinct IDs for distinct entities. CAI requires a radical restructuring of how "count" queries are run.
  *   **Definitive Answer:** Ambiguous. It denotes one thing *which is* the many things.

  **3. Nihilism**
  *   **Performance:** Satisfies **Non-Arbitrariness** (only simples exist). Fails **Persistence** and **Utility** (no machines, no lines).
  *   **Registry Viability:** None, unless treated as a "fictionalist" layer (we pretend machines exist).
  *   **Definitive Answer:** No, it denotes nothing (only simples arranged asset-wise).

  **4. Contact-or-Fastening Accounts**
  *   **Performance:** Satisfies **Non-Arbitrariness** (physical bond). Fails **Persistence** (fails *Production Line* when dismantled; fails *Bearings* when swapped).
  *   **Registry Viability:** Low. It would require deleting and recreating asset IDs every time a machine is serviced or moved.
  *   **Definitive Answer:** Yes, but only when physically assembled.

  ### Conclusion and Recommendation

  There is no single metaphysical theory that satisfies all desiderata without modification. The conflict between **Binary Decidability** and **Non-Arbitrariness** in vague cases is not solvable within classical realism.

  **Judgment Call:** The registry should not attempt to model fundamental ontology. It should model **Conventional Ontology**. Adopt a **Universalist** base (all composites exist) to ensure continuity and decidability, but overlay a **Stipulative Filter** (legal/operational definitions) to determine what counts as an "Asset." This treats the "Special Composition Question" not as a question of what *exists*, but of what *matters*. This resolves the *Bolted Frames* (context-dependent counting) and the *Incomplete Assembly* (stipulated cutoff) without requiring the physical world to have sharp edges it does not possess.
