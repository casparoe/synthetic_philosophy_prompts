          *   **Constraint:** Clearly mark settled vs. live disputes and label personal judgment calls. Do not mask disagreement as consensus.
      *   **Tone:** Formal, precise, philosophical but applied.

  2.  **Deconstruct the Industrial Cases (The "Data"):**
      *   *Bearings:* Fission/Fusion, replacement of parts, functional unity over material continuity. (Ship of Theseus style).
      *   *Production Line:* Dismantling/Reassembly, spatial discontinuity, functional persistence.
      *   *Cooling Circuit:* Fluid vs. Pipe, constant material replacement, functional system.
      *   *Bolted Frames:* Two functional units, one legal/insurance unit. (Coincidence/Counting).
      *   *Incomplete Assembly:* Indeterminate existence (future contingent), vagueness.

  3.  **Drafting the Desiderata (The Specification):**
      *   *Requirement 1: Decidability.* The registry needs a Yes/No answer.
          *   *Motivation:* Downstream systems (depreciation, theft) need binary states.
          *   *Case:* Incomplete assembly.
      *   *Requirement 2: Persistence Conditions.* Must handle part replacement and spatial discontinuity.
          *   *Motivation:* Bearings and Production Line cases.
          *   *Case:* Bearings swapped hourly.
      *   *Requirement 3: Distinction between Ontological and Conceptual Unity.* Distinguish "exists" from "counted as one for purpose X".
          *   *Motivation:* Bolted frames (insurance vs. function).
          *   *Case:* Bolted frames.
      *   *Requirement 4: Handling Vagueness.* Must resolve sorites without ontic vagueness (usually).
          *   *Motivation:* Incomplete assembly, fluid replacement.
          *   *Case:* Cooling circuit fluid %.
      *   *Requirement 5: Avoidance of Arbitrariness.* Shouldn't commit to wild sums without reason.
          *   *Motivation:* Philosophical defensibility.
          *   *Case:* My left ear + the Eiffel Tower.

  4.  **Identifying "Fake" Constraints (Camp Preferences):**
      *   *Constraint A: "Common Sense Intuitions must be preserved."* (Often used by Restrictivists against Universalists).
      *   *Constraint B: "No coincident objects."* (Used by Constitution Theorists vs. Endurantists/Universalists).
      *   *Selection:* I'll argue that "Preservation of Ordinary Language Counts" is often a preference, not a logical necessity, given the registry context. Also, "Rejection of Coincidence" is a theoretical choice, not a datum.

  5.  **Identifying Inconsistencies (The Conflict):**
      *   *Conflict:* Decidability (Binary existence) vs. Sorites/Vagueness (Gradual change).
      *   *Conflict:* Avoidance of Arbitrary Sums vs. Persistence through Total Replacement.
      *   *Demonstration:* If I say the Production Line exists after reassembly (to satisfy Persistence), but deny the existence of arbitrary sums (to satisfy Non-Arbitrariness), I need a principled cutoff. That cutoff is usually vague. If I make it sharp (Decidability), I seem arbitrary.
      *   *Specific Conflict:* *Decidability* vs. *Ontic Vagueness*. If reality is vague, the database cannot be binary. If the database is binary, reality must be precise (epistemicism) or the database is modeling conventions, not ontology.

  6.  **Identifying "Least Resistance" (The Release Valve):**
      *   Requiring *Ontological* grounding for *Administrative* unity is the bottleneck.
      *   If we relinquish "Existence must track Mind-Independent Joints," we allow conventionalism. This admits Universalism (everything exists, we just tag some), Nihilism (nothing exists, we just pretend), and Moderatism (we decide the rules).
      *   *Selection:* The requirement that "Ontological Unity must precede Administrative Counting."

  7.  **Evaluating Theories:**
      *   *Universalism:* Good for decidability (always yes), bad for arbitrariness.
      *   *Composition as Identity (CAI):* Good for parsimony, tricky for counting (if parts = whole, how to count distinct assets?).
      *   *Nihilism:* Good for precision (only simples), terrible for industry (no machines).
      *   *Contact/Fastening:* Good for intuition, fails Production Line (disassembled) and Bearings (swapped).

  8.  **Structuring and Refining (Addressing the "Constraint"):**
      *   *Marking Consensus vs. Dispute:* I need to be explicit. E.g., "It is settled that..." vs. "Philosophers divide on..."
      *   *Labeling Judgments:* "My judgment is..."
      *   *Tone Check:* Ensure I don't sound like I'm preaching one theory as the truth.

  9.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the gravity. This is applied metaphysics.
      *   *Desiderata Section:*
