  *(Refining the "Fake Constraints")*: The prompt asks for at least two.
  1. "Must match ordinary language counts." (Pragmatic vs Ontological).
  2. "Must reject coincident objects." (Parsimony vs Phenomenology).

  *(Refining the Inconsistency)*: The clash between *Decidability* (Sharp boundaries) and *Non-Arbitrariness* (No sharp boundaries in vague cases) is the classic Epistemicism debate. I need to show this clearly.

