  Give me your credence in the proposition, then decompose it: roughly how much rides on the self-sampling rather than the self-indication assumption (or on some third framework being correct), how much on the reference-class objection being fatal rather than resolvable, how much on my prior diagnosis, and how much on anything else you think belongs in the factorization — a rough probability and one line of justification for each, then the combination. Say which single term your total is most sensitive to, and what argument or result would settle it. Throughout, mark explicitly what you take to be settled among people who work on this — the arithmetic given the self-sampling assumption, for instance — as against what is genuinely contested, and do not present the view you end up favoring as the consensus.
