          *   *Budgets:* Salaries unchanged.
          *   *Tradability:* Can't sell the right to set the temp.
          *   *Obvious Need:* Neither is freezing or heat-stroking. Alex prefers 68°F (cold), Blair prefers 78°F (warm). Both are within survivable/comfortable ranges.
          *   *Why this works:* It isolates preference intensity without invoking survival. It forces the question: Does Alex's discomfort at 78° outweigh Blair's discomfort at 68°?

  4.  **Sequence the Lesson (75 Minutes):**
      *   *0-10:* Hook with the Case. Elicit the ordinal objection.
      *   *10-25:* Dismantle the "Ordinality = No Comparison" fallacy. Distinguish Cardinality vs. Comparability.
      *   *25-40:* The Three Claims Collapse (Intra-cardinal, Inter-comparable, Verifiable).
      *   *40-55:* The Hidden Assumption (Equal Capacity).
      *   *55-65:* What survives? (Policy rules despite uncertainty).
      *   *65-75:* Closing & Assessment.

  5.  **Map Misconceptions (Order of Damage):**
      1.  *Most Damaging:* "If I can't measure it, I can't compare it." (Confusing measurement with comparison).
      2.  *High Damage:* "If I can't verify it, it isn't true." (Positivism vs. Normative truth).
      3.  *Medium Damage:* "Utility is a psychological substance." (Reification).
      4.  *Specific Target:* The "Equal Capacity" assumption (often unnoticed).

  6.  **Address the "Equal Capacity" Assumption:**
      *   This needs to happen *after* establishing that comparisons are logically possible but empirically hard. It's the bridge from "we can compare" to "we should maximize sum."
      *   Location: Minute 40-55.

  7.  **Determine What to Exclude:**
      *   Social Welfare Functions (SWF) math (too technical).
      *   Harsanyi's Utilitarianism theorem (too advanced).
      *   Neuroeconomics/Biomarkers (distracting).
      *   Deep meta-ethics (error theory vs. realism).

