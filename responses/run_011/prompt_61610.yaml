  2.  **Deconstruct the Core Problem:**
      *   Students think: Ordinal Utility $\rightarrow$ No Numbers $\rightarrow$ No Comparisons $\rightarrow$ No Welfare Economics.
      *   Reality: Ordinality kills *cardinality*, but policy requires *comparability*. Comparability doesn't strictly require cardinality (level vs. unit comparability), but it does require ethical assumptions.
      *   The "Equal Capacity" assumption is the hidden engine of utilitarianism/Rawlsianism that students often miss.
      *   The distinction between "measurable," "comparable," and "verifiable" is crucial.

  3.  **Develop the Single Concrete Case:**
      *   *Requirement:* Must not be settled by obvious need (e.g., giving insulin to a diabetic vs. candy to a healthy person is too easy). Must keep budgets intact (to avoid efficiency arguments). Must involve a non-tradable good or a specific allocation decision.
