answer: |-
  ### The Session Plan: Interpersonal Utility Comparisons

  **Time:** 75 Minutes
  **Audience:** 2nd-Year Public Policy Undergraduates (1 term Intermediate Micro)

  ---

  ### 1. The Single Concrete Case
  **The Case:** **The Identical Non-Tradable Voucher.**
  *   **The Setup:** The department has one remaining $500 professional development voucher. It cannot be sold for cash (non-tradable); it must be used for a conference or training.
  *   **The Candidates:** Two students, Alex and Blair. They have identical GPAs, identical current income, identical family backgrounds, and identical health.
  *   **What it Must Have:** **Identical observable constraints.** This ensures the decision cannot rest on efficiency (marginal utility of income) or equity based on prior disadvantage.
  *   **What it Must Lack:** **Differential Need.** Neither student will fail out of school without it; neither is facing a medical emergency. The benefit is purely "career enhancement" or "enjoyment of learning."
  *   **Why this Case:** It strips away the usual policy crutches (poverty alleviation, efficiency gains). It forces the question: *Even if everything observable is equal, does one of them benefit **more**?* This isolates the Interpersonal Utility Comparison (IUC) from all other distributive justice arguments.

  ---

  ### 2. Sequence of Instruction (Dependencies Noted)

  **0:00 – 0:10 | The Hook & The Orthodoxy**
  *   **Action:** Present the Voucher Case. Ask for a show of hands: "Who gets the voucher?"
  *   **Expected Response:** "Flip a coin," or "Ask them who wants it more."
  *   **Trap:** When a student says "Ask who wants it more," stop them. Remind them of their Micro 101 training: Preferences are ordinal. "Wanting more" implies intensity. Ordinal utility forbids measuring intensity.
  *   **Goal:** Induce cognitive dissonance. They want to make a policy decision, but their toolkit says they can't.

  **0:10 – 0:25 | Claim 1: Intra-personal Cardinality (The First Collapse)**
  *   **Dependency:** Requires understanding of ordinal vs. cardinal utility.
  *   **Action:** Distinguish between *ranking* (A > B) and *measuring* (A is 2x better than B).
  *   **Point:** Acknowledge the micro orthodoxy is correct: We cannot measure utility *within* a person cardinally. We cannot say Alex enjoys the voucher "twice as much" as a sandwich.
  *   **Misconception Head-Off:** Stop the claim that "Utility is a psychological substance like height." Utility is a representation of choice, not a brain chemical.
  *   **Result:** Establish that **Intra-personal Cardinality is dead.**

  **0:25 – 0:40 | Claim 2: Inter-personal Comparability (The Second Collapse)**
  *   **Dependency:** Requires acceptance that Intra-personal Cardinality is dead.
  *   **Action:** Move from one person to two. Even if we *could* measure Alex's utility cardinally (hypothetically), does that scale match Blair's?
  *   **Point:** This is the real barrier. Ordinality kills cardinality, but *subjectivity* kills comparability. We don't just lack a ruler; we lack a common unit of measurement across minds.
  *   **Misconception Head-Off:** Address the idea that "Behavior reveals intensity." (Revealed preference only shows ranking, not intensity of feeling).
  *   **Result:** Establish that **Inter-personal Comparability is technically unverifiable.**

  **0:40 – 0:55 | The Hidden Assumption: Equal Capacity for Satisfaction**
  *   **Dependency:** Requires understanding that Comparability is unverifiable.
  *   **Action:** Ask: "If you *had* to give the voucher, and you chose to maximize total welfare, what did you just assume about Alex and Blair?"
  *   **Point:** Expose the **Assumption of Equal Capacity.** To average utilities or sum them (Utilitarianism), you must assume that a unit of satisfaction for Alex is equivalent to a unit for Blair.
  *   **Critical Move:** Show that this is not an empirical fact discoverable by economics. It is an *ethical axiom*. If Alex has a "deeper capacity for joy" than Blair, the utilitarian calculation changes.
  *   **Result:** Students see that "maximizing welfare" secretly relies on an assumption of human homogeneity.

  **0:55 – 1:05 | Claim 3: Truth vs. Verification (The Third Collapse)**
  *   **Dependency:** Requires separating the ethical axiom from empirical measurement.
  *   **Action:** Pose the ontological question: "Just because we can't measure the comparison, does that mean there is no fact of the matter?"
  *   **Point:** Distinguish *epistemology* (what we can know) from *ontology* (what is true). It may be objectively true that Alex benefits more, even if no instrument can verify it.
  *   **Misconception Head-Off:** Crush the Positivist fallacy: "If I can't verify it, it's meaningless." Policy requires acting on unverifiable truths.
  *   **Result:** Establish that **Comparisons can be true even if unverifiable.**

  **1:05 – 1:15 | Synthesis & Closing**
  *   **Action:** Summarize what survives. We cannot measure, we cannot verify, but we must decide. Therefore, policy is not just technical; it is ethical.
  *   **Assessment:** Pose the Closing Question (see below).

  ---

  ### 3. Mapping Misconceptions (Order of Damage)

  **1. Most Damaging: "Ordinality Prohibits Comparison."**
  *   **The Error:** Students believe that because utility isn't cardinal (measurable numbers), it cannot be compared across people at all.
  *   **The Damage:** Paralyzes all welfare analysis. Leads to the conclusion that cost-benefit analysis is nonsense.
  *   **Where to Head Off:** **Minute 0:25.** Explicitly separate *measurability* (cardinality) from *comparability* (level/unit comparability). You can have ordinal comparability (Person A is better off than Person B) without cardinality.

  **2. High Damage: "Unverifiable Means Untrue."**
  *   **The Error:** Logical Positivism. If we cannot observe the utility difference, the statement "Alex benefits more" is meaningless.
  *   **The Damage:** Prevents students from understanding normative claims. They will treat ethical judgments as mere opinions rather than truth-claims we cannot prove.
  *   **Where to Head Off:** **Minute 0:55.** Use the analogy of "pain." I cannot verify your pain, but it is not meaningless to say you are in pain.

  **3. Medium Damage: "Utility is a Substance."**
  *   **The Error:** Reification. Thinking utility is a fluid that fills people up.
  *   **The Damage:** Makes the "Equal Capacity" assumption seem biological rather than ethical.
  *   **Where to Head Off:** **Minute 0:10.** Define utility strictly as a mathematical representation of preference ordering, not a psychological state.

  **4. The Silent Killer: "The Equal Capacity Assumption."**
  *   **The Error:** Assuming that because two people look identical (income, health), their capacity for satisfaction is identical.
  *   **The Damage:** Licenses averaging arguments (Veil of Ignorance/Utilitarianism) without scrutiny.
  *   **Where to Expose:** **Minute 0:40.** This is the pivot point of the lecture.

  ---

  ### 4. What to Refuse to Cover
  *   **Social Welfare Function (SWF) Mathematics:** Do not write out $W = U_1 + U_2$ vs $W = \min(U_1, U_2)$. It invites technical quibbles that distract from the philosophical core.
  *   **Harsanyi's Utilitarianism Theorem:** Too advanced. It relies on axioms of rationality under uncertainty that will bog down the 75-minute limit.
  *   **Neuroeconomics/Biomarkers:** Do not discuss fMRI or dopamine. It suggests the measurement problem is merely technological, rather than conceptual.
  *   **Meta-Ethical Realism vs. Error Theory:** Do not debate whether moral facts exist. Stick to the logic of policy justification.

  ---

  ### 5. The Closing Question
  *Do not ask:* "Do you understand why interpersonal comparisons are difficult?" (Invites passive agreement).
  *Do not ask:* "Is utilitarianism correct?" (Invites opinion).

  **Ask this:**
  > "If I grant you that we cannot empirically verify who benefits more from the voucher, what specific **non-empirical assumption** must you add to your argument to justify giving it to Alex rather than flipping a coin, and is that assumption a matter of economics or ethics?"

  **Diagnostic Value:**
  *   **Failure:** They answer with empirical claims ("Alex works harder") or repeat economic jargon ("marginal utility").
  *   **Success:** They identify the ethical axiom (e.g., "We must assume equal capacity" or "We must prioritize the worst off") and acknowledge it is a normative choice, not a technical calculation.
