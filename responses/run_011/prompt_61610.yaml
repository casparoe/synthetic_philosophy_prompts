          *   Not obvious need: Both groups just want to ride. One wants silence (Type A), one wants to talk on the phone (Type B). Neither is "starving."
          *   Conflict: A's utility goes up if B is silent; B's utility goes up if B talks. Zero-sum in terms of carriage atmosphere.
          *   Policy question: How many cars do we designate as Quiet?
