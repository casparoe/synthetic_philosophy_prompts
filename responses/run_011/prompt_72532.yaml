          *   *Wait, better:* The prompt asks "what would actually have to go."
          *   If I keep #3 (Sovereignty), I *must* drop the second half of #4 ("has not improved wellbeing"). I can say "has not improved conditions."
          *   If I keep #4 (Adaptation doesn't count), I *must* drop #3 (Sovereignty).
