          *   *Severity:* High. This is a fundamental philosophical contradiction. One validates the score, the other invalidates the *source* of the score change.
          *   *Resolution:* You can't hold both strictly. If you respect sovereignty (#3), you must accept the score rise from adaptation (#4). If you reject adaptation gains (#4), you are implicitly claiming to know their wellbeing better than they do (#3 violation).

      *   *Tension B: 1 (No Objective Headlines) vs. 7 (One Headline Number).*
