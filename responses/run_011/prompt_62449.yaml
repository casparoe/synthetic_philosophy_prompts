answer: |-
  Here is my analysis of your situation. I have treated your press not merely as a business, but as a dynamical system subject to the laws of probability and compounding.

  ### 1. Was the policy you chose the better one?

  No. The policy you chose was mathematically inferior for your specific situation.

  **The Arithmetic**
  Your colleague is calculating the **Arithmetic Mean Return** (the ensemble average). He sums the possible outcomes weighted by their probability:
  $$ \left(\frac{1}{3} \times 150\%\right) + \left(\frac{2}{3} \times -40\%\right) = 50\% - 26.7\% = +23.3\% $$
  He is counting *dollars across parallel universes*. If there were a thousand identical presses making this bet once, the average wealth of the group would grow by 23%.

  You are experiencing the **Geometric Mean Return** (the time average). You must compound the outcomes sequentially on a single path of capital:
  $$ \left(2.5^1 \times 0.6^2\right)^{\frac{1}{3}} - 1 = \left(2.5 \times 0.36\right)^{\frac{1}{3}} - 1 = 0.9^{\frac{1}{3}} - 1 \approx -3.5\% $$
  You are counting *dollars along a single timeline*. Because losses compound on a smaller base and gains compound on a larger one, volatility acts as a drag. A 40% loss requires a 67% gain just to break even; your 150% gain is not enough to overcome the frequency of the losses.

  The safe list yields $+3\%$. The risky list yields $-3.5\%$. The safe list is strictly superior for long-term capital preservation and growth.

  **The Shortest Argument**
  Tell him this: *"You are calculating the return of the graveyard of failed presses alongside the survivors. I am calculating the return of the press that must survive to publish next year. In multiplicative systems, the time average does not equal the ensemble average."*

  ### 2. Was there a version of this choice I should have been making instead?

  Yes. You treated a continuous variable (risk exposure) as a binary switch. You should have been mixing the strategies.

  **The Rule**
  Apply a fractional betting rule derived from the Kelly Criterion, adjusted for your specific payoff structure.
  **"Allocate no more than 39% of your annual capital and operational capacity to the risky list. The remaining 61% must go to the safe list."**

  **The Cost of Error**
  *   **Overbetting (>39%):** The cost is asymptotic ruin. If you bet 100% (as you did), the geometric drag ensures eventual depletion. The danger is existential; the cost is the press itself.
  *   **Underbetting (<39%):** The cost is linear opportunity loss. You grow slower than the optimal rate, but you remain solvent. The danger is stagnation; the cost is unprinted books.

  **Are they equally dangerous?**
  No. Overbetting is infinitely more dangerous. In a game with a ruin barrier, survival is a prerequisite for growth. You can recover from underbetting; you cannot recover from zero.

  ### 3. Does estimating the probability from nine years change the rule?

  Yes. It makes the rule more conservative.

  **The Reason**
  Three wins in nine years is a sample size too small to trust the $1/3$ probability estimate. In statistical terms, your "parameter uncertainty" is high. The true probability of a hit could easily be $1/4$ or $1/5$. If the true probability is lower than $1/3$, the edge disappears entirely, and the risky bet becomes negative even in arithmetic terms.

  **The Adjustment**
  You must apply a "discount" to your probability estimate to account for this uncertainty. Do not bet 39%. **Bet 20%.**
  When you are unsure of the odds, the rational move is to shrink your bet size. The cost of being wrong about the probability (ruin) vastly outweighs the benefit of being right (extra growth). Uncertainty acts as a tax on risk.

  ### 4. Does the finite horizon and bank floor change the policy?

  **The Finite Horizon (10 Years)**
  A rule built for an indefinite sequence (like Kelly) generally governs a finite sequence well, *unless* you are far behind near the end. With ten years left, you do not have time to rely on the "law of large numbers" to smooth out volatility. However, since your goal is to hand over a functioning press (maximize expected value of final capital subject to survival), the growth-optimal policy remains the correct proxy. Do not gamble desperately to catch up; you will likely lose what remains.

  **The Bank Floor**
  Your intuition is correct: the floor changes the *best policy*, not just the margin.
  In standard theory, ruin is just a very low number. In your reality, ruin is an absorbing barrier—the game ends. This truncates the left tail of your distribution.
  When a hard floor exists near your current capital, you cannot maximize growth rate. You must **maximize survival probability first, growth second.**
  Because you are currently at 75% of starting capital and the bank line is threatened, you are in the "danger zone." The optimal policy shifts from the 39% Kelly allocation to a **survival allocation**. For the next 2–3 years, your allocation to risky books should be near 0% until you rebuild a buffer above the bank's floor. The floor forces you to be more conservative than the math of pure growth would dictate.

  ### 5. Is this a disagreement about mathematics or temperament?

  It is a mistake in how he is counting. It is a mathematical error, not a difference in temperament.

  Your colleague is assuming **Ergodicity**. He assumes that the average outcome across many parallel scenarios (ensemble) is the same as the average outcome over time for one person (time). In additive processes (like flipping a coin for $10), this is true. In multiplicative processes (like reinvesting capital), this is false.

  Risk aversion is often dismissed by economists as a psychological quirk—a "taste." In your situation, risk aversion is a rational recognition of non-ergodicity. You are not refusing risk because you are timid; you are refusing it because the arithmetic of compounding makes the risky path a losing one for a single trajectory. Your colleague is using additive logic in a multiplicative world. That is a category error.

  ### 6. The Honest Answer on Value and Scoring

  You asked if scoring the question in terms of capital is the wrong way to score it, given the literary value of the flops.

  **The Verdict**
  It is a way of refusing to look at a real cost.

  **The Reasoning**
  You say your best years were flops because a book came out that you are glad exists. This is a noble sentiment, but it contains a hidden premise: that the press would exist to publish the *next* book.
  Capital is not the *purpose* of the press, but it is the *fuel*. To ignore the depletion of fuel because you enjoyed the drive is to ensure the car stops. If you gamble the press into insolvency, you publish no more books, difficult or safe. The "cost" of the difficult books is not just money; it is the future capacity of the press to fulfill its mission.

  **How I Would Decide in January**
  I would separate the **Mission** from the **Constraint**.
  1.  **Mission:** Publish difficult, out-of-print authors.
  2.  **Constraint:** Maintain capital above the bank floor with 99% probability over 10 years.

  I would not treat the risky books as a gamble to grow wealth. I would treat them as an expense to be budgeted.
  I would calculate the surplus capital generated by the safe list *after* maintaining a safety buffer. I would spend *only that surplus* on the difficult books.
  If the safe list yields 3%, and I need 2% to stay ahead of inflation and bank requirements, I have 1% risk capacity. I would buy rights to difficult books only up to the cost of that 1%.

  This ensures that the "literary value" of the flops is paid for by the "economic value" of the safe list, rather than being subsidized by the existential risk of the press itself. You do not have to choose between being a merchant and a patron. You must be a merchant sufficient to remain a patron.
