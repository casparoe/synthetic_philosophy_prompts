answer: |-
  # The Demarcation Pathway: A Sorting Instrument

  **Instructions:** Read each scenario carefully. Select the response that best matches your intuitive judgment about the case *as described*. Follow the arrow at the end of your chosen response to find your next item. Continue until you reach Item 8. Record your sequence of answers (e.g., 1A, 2B, 4A...).

  ### Item 1: The Black Box
  A machine-learning model predicts patient outcomes with 99% accuracy across diverse hospitals. However, the developers cannot explain *why* it works; the internal weights are unintelligible to humans. It offers no causal mechanism, only input-output reliability.
  *   **A.** This counts as scientific knowledge because it yields reliable empirical expectations. **(Go to Item 2)**
  *   **B.** This is merely a technical tool, not science, because it provides no understanding of nature. **(Go to Item 3)**

  ### Item 2: The Mathematical Frontier
  A fundamental physics programme has produced no novel experimental predictions in forty years. However, it consistently generates deep, unifying mathematics that resolves theoretical inconsistencies in existing models.
  *   **A.** It remains scientific because theoretical coherence is a valid form of progress. **(Go to Item 4)**
  *   **B.** It has become non-scientific because it no longer risks contact with empirical data. **(Go to Item 5)**

  ### Item 3: The Commercial Profile
  A personality assessment is sold to corporations for hiring. It lacks peer-reviewed validation and its categories do not align with psychological consensus, but clients report it helps them structure interviews effectively.
  *   **A.** It should be denounced as pseudoscience because it mimics scientific authority without the warrant. **(Go to Item 6)**
  *   **B.** It is not science, but calling it "pseudoscience" is an unhelpful insult; it is simply a commercial product. **(Go to Item 7)**

  ### Item 4: The Ancient Impact
  A theory proposes that a single asteroid impact caused a mass extinction 66 million years ago. It cannot make new predictions about the past, but it coheres with independent evidence from geology, chemistry, and fossil records.
  *   **A.** It is scientific because the consilience of evidence warrants belief, even without novel prediction. **(Go to Item 8)**
  *   **B.** It is historical speculation, not science, because it cannot generate risky future predictions. **(Go to Item 8)**

  ### Item 5: The Outbreak Fit
  An epidemiological model is adjusted until it perfectly matches the data of an ongoing outbreak. The team then claims the model "predicts" the remainder of the outbreak curve based on this fit.
  *   **A.** This is legitimate science; all models are approximations fitted to available data. **(Go to Item 8)**
  *   **B.** This is misleading; fitting data you have already seen does not count as predicting what you haven't. **(Go to Item 8)**

  ### Item 6: The Policy Question
  Consider the commercial personality assessment from Item 3. Regardless of its scientific status, how should public institutions treat it?
  *   **A.** Institutions should ban its use in hiring to protect the public from misleading claims. **(Go to Item 8)**
  *   **B.** Institutions should not ban it; market forces and transparency are better regulators than scientific policing. **(Go to Item 8)**

  ### Item 7: The Methodological Rule
  Consider the black box model from Item 1. Suppose using it requires violating a standard methodological rule (e.g., ignoring confounding variables) to maintain accuracy.
  *   **A.** The rule should be broken; results matter more than methodological purity. **(Go to Item 8)**
  *   **B.** The rule must be kept; without methodological standards, we cannot trust any result. **(Go to Item 8)**

  ### Item 8: The Value of the Line
  Reflecting on your previous choices: Does drawing a sharp line between "science" and "non-science" serve a useful social function?
  *   **A.** Yes, it protects resources and truth from being diluted by unreliable claims.
  *   **B.** No, it creates artificial boundaries that hinder inquiry and policy.

  ***

  # Scoring Key & Facilitator Guide

  ### 1. Mapping Answer Patterns to Positions
  *Note: The "Separator" is the single item that most strongly discriminates this position from its nearest neighbor.*

  | Philosophical Position | Typical Path Signature (Key Items) | Separator Item | Diagnosis |
  | :--- | :--- | :--- | :--- |
  | **Strict Falsificationism** | 1A → 2B → 5B → 8A | Item 2 (Physics) | Demands empirical risk; rejects mathematical progress without prediction. |
  | **Duhem–Quine Holism** | 1A → 2A → 5A → 8A | Item 5 (Epi Fit) | Accepts model fitting as valid; theories face evidence as a whole web. |
  | **Lakatosian Programme** | 1A → 2A → 4A → 8A | Item 4 (History) | Accepts theoretical progress (Physics) and consilience (History) as "progressive shifts." |
  | **Kuhnian Puzzle-Solving** | 1A → 2A → 4A → 8B | Item 8 (Value) | Accepts normal science (Physics/History) but rejects demarcation as a rigid police tool. |
  | **Feyerabendian Anarchism** | 1B → 3B → 7A → 8B | Item 7 (Method) | Rejects methodological rules; opposes bans on "non-science." |
  | **Laudan-Style Deflationism** | 1B → 3B → 6B → 8B | Item 6 (Policy) | Rejects "pseudoscience" label; focuses on specific harm rather than category. |
  | **Bayesian Confirmation** | 1A → 2B → 4A → 8A | Item 4 (History) | Accepts ML (predictive) and History (consilience) as probability updates; rejects Physics (no data). |

  ### 2. Indistinguishable Pairs
  *The questionnaire structure cannot reliably distinguish between these positions based on answer patterns alone.*

  *   **Kuhnian Puzzle-Solving vs. Lakatosian Programme:** Both accept Item 2A (Physics is science) and Item 4A (History is science). They often diverge only on Item 8 (Social function), which is subjective. A participant may hold a Lakatosian view of progress but a Kuhnian view of sociology, resulting in a hybrid score.
  *   **Laudan-Style Deflationism vs. Feyerabendian Anarchism:** Both reject the "pseudoscience" label (Item 3B) and oppose bans (Item 6B/7A). The distinction lies in *why* (Laudan: it's unhelpful; Feyerabend: it's oppressive), which the scenarios do not fully probe.

  ### 3. Unoccupied Answer Combinations
  *These combinations are theoretically possible but map to no stable philosophical position.*

  *   **1B → 2A (Not Science → Science):** *Diagnosis: Incoherent.* If the Black Box (predictive) is not science, the Physics Programme (non-predictive) cannot be science under the same criterion.
  *   **3A → 7A (Pseudoscience → Break Rules):** *Diagnosis: Unattractive.* Denouncing a field as pseudoscientific while advocating breaking methodological rules to achieve its results is pragmatically contradictory.
  *   **1A → 5B (Science → Misleading Fit):** *Diagnosis: Unexplored.* Accepting black-box prediction while rejecting data-fitting suggests a specific "prediction-only" view that rarely survives scrutiny of how ML is trained.
  *   **6A → 8B (Ban → No Value):** *Diagnosis: Incoherent.* Arguing for a ban on intellectual inquiry while simultaneously arguing that drawing lines around inquiry has no value.

  ### 4. Facilitator Notes on the "Science vs. Pseudoscience" Branch
  *Constraint Check:* Items 3 and 6 specifically target the distinction between "Is it scientific?" and "Should we denounce it?"
  *   **Path 3A (Pseudoscience):** Leads to Item 6 (Policy/Ban). This captures the **Falsificationist/Popperian** impulse to police boundaries.
  *   **Path 3B (Not Pseudoscience):** Leads to Item 7 (Method) or Item 6 (No Ban). This captures the **Deflationist/Laudan** view that the label is the problem, not the inquiry.
  *   **Workshop Tip:** If a participant lands on **Laudan** or **Feyerabend**, ask them: "If you can't call it pseudoscience, what specific term do you use to warn a patient against the Personality Test?" This forces the deflationist to articulate a criterion of *reliability* rather than *demarcation*.
