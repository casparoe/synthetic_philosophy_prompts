prompt: |-
  I'm putting together a paper for a phil-of-med reading group and I'd love comments on a rough outline — mostly on whether the central move actually works or whether I'm cheating.

  Setup: I think the naturalism/normativism debate about disease is stuck because both sides assume the word picks out one thing with one extension, and then fight about which facts fill it. The naturalist says disease is subnormal part-functioning relative to a species-typical design (Boorse-style, and Wakefield's harmful-dysfunction version is the hybrid attempt). The normativist says that can't be the whole story, because the same functional facts get labeled differently across times and places, and the labeling tracks what a community wants to treat, excuse, or insure. Both sides keep lobbing counterexamples: baldness, myopia, menopause, left-handedness, being short; on the other side drapetomania, the declassification of homosexuality, grief versus depression.

  My move: treat disease as context-sensitive the way tall is sensitive to a comparison class, or the way weed is sensitive to what's being cultivated. A weed's competitive properties are entirely natural and mind-independent — but whether it counts as a weed depends on the garden. Same for a condition: all the functional facts are natural, and whether they amount to disease depends on a helping-context parameter, roughly what the medical institution around this patient is trying to do. That's supposed to dissolve the dispute without giving up naturalism about the biology underneath.

  The part I'm least sure of: I claim the view can still condemn drapetomania as flatly wrong, not just differently indexed, because the helping-context is constrained by whether the classification tracks suffering and impairment that medicine can actually address. A context that licenses calling the desire to escape slavery a pathology is a bad context, not a rival one.

  So, four questions. (1) Is the weed/tall analogy doing real work, or is it just relabeling the problem — does saying the extension is context-relative explain anything the two camps actually disagree about? (2) Does my bad-context-not-different-context line smuggle normativist values back in through the back door, so that I've collapsed into normativism with extra steps? (3) Am I missing an obvious objection — e.g. that context-sensitivity can't accommodate the fact that clinicians claim authority to tell patients they're wrong about being sick, or that insurance and sick-leave eligibility need a context that's fixed precisely so it can't be shifted locally? (4) Is any of this interesting, or does it just sound like a synthesis?

  Please be straight with me where I'm wrong rather than encouraging, and seperate out what's genuinely settled in this area from what's live and contested among people who work on it — I don't want to walk into the reading group presenting one side of an open debate as background agreement.
reasoning: |-
  Here's a thinking process that leads to the suggested feedback:

  1.  **Analyze the User's Request:**
      *   **Context:** Philosophy of Medicine reading group paper.
      *   **Topic:** The Naturalism vs. Normativism debate regarding the concept of disease.
      *   **User's Proposed View:** Contextualism (specifically, a "helping-context parameter"). Disease is like "weed" or "tall": natural facts + context determines extension.
      *   **Specific Claim:** Can condemn *drapetomania* as wrong because the context must track suffering/impairment medicine can address (constraining the context).
      *   **Task:** Critique the outline based on four specific questions (Analogy work, Normativist smuggling, Objections regarding authority/insurance, Interest level).
      *   **Tone:** Straightforward, critical, distinguishing settled vs. contested issues. No false encouragement.

  2.  **Deconstruct the User's Position:**
      *   *Core Thesis:* Disease is context-sensitive (semantic contextualism or pragmatic relativism?).
      *   *Analogy:* "Weed" (natural properties + gardening context) / "Tall" (height + comparison class).
      *   *Constraint:* The context isn't arbitrary; it must be a *helping* context (tracking suffering/impairment addressable by medicine).
      *   *Goal:* Dissolve the debate, keep naturalist biology, avoid normativist relativism about *drapetomania*.

  3.  **Address Question 1: The Analogy (Weed/Tall)**
      *   *Does it do work?* It shifts the semantic burden. Instead of "What is disease?" it becomes "What is the relevant context for disease?"
      *   *Problem:* "Tall" is vague but not really contested in the same way. "Weed" is better. But is disease *really* like a weed?
      *   *Critique:* The naturalist/normativist debate isn't just about extension; it's about *authority*. If I say "It depends on the context," the naturalist asks "Which natural facts fix the context?" and the normativist asks "Who decides the context?"
      *   *Verdict:* It's a known move (Contextualism/Pragmatism). It doesn't dissolve the fight; it moves it to "What fixes the context?"

  4.  **Address Question 2: Smuggling Normativism (The *Drapetomania* Move)**
      *   *User's Claim:* We can rule out *drapetomania* because that context doesn't track suffering/impairment medicine can address.
      *   *Critique:* This is the weak point. Who defines "suffering"? Who defines "impairment"? Who defines "medicine can address"?
      *   *The Trap:* If the constraint is "helping," that's a normative value. If the constraint is "biological dysfunction," that's naturalist. The user is trying to have both.
      *   *Verdict:* Yes, this looks like smuggling. Specifically, it looks like a "Hybrid" view (like Wakefield) but dressed as contextualism. If the context *must* be constrained by normative values (helping), then normativity is constitutive, not just contextual.

  5.  **Address Question 3: Missing Objections (Authority & Insurance)**
      *   *Authority:* Clinicians say "You are sick" even if the patient disagrees. If it's context-sensitive, whose context counts? The patient's? The doctor's? The state's?
      *   *Insurance/Bureaucracy:* These require fixed criteria (ICD codes). Contextualism makes billing impossible if the context shifts too much.
      *   *The "Error" Theory:* If disease is context-sensitive, can a whole society be wrong? (e.g., homosexuality). The user says yes (bad context). But if the context is determined by the medical institution, and the institution says it's a disease, how is it wrong?
      *   *Verdict:* These are strong objections. The "fixed criteria" objection is particularly damaging to a strong contextualist view.

  6.  **Address Question 4: Interest Level**
      *   *Is it new?* Contextualism in philosophy of medicine is a live position (e.g., Cooper, Fulford, some readings of Canguilhem).
      *   *Is it a synthesis?* It sounds like a "Pragmatic Naturalism."
      *   *Verdict:* It's interesting *if* the constraint mechanism is fleshed out. If it's just "it depends," it's banal. If it's "it depends, but here's the rigorous logic of the dependence," it's valuable.

  7.  **Identify Settled vs. Contested Issues (Crucial for the User):**
      *   *Settled:* Pure Boorse-style biostatistical theory (BST) is widely considered insufficient (doesn't handle *drapetomania* or *homosexuality* well without ad-hoc fixes). Pure Normativism (disease is *just* disvalue) is widely rejected (makes disease too arbitrary, ignores biology).
      *   *Contested:* Hybrid views (Wakefield), Normative Naturalism (Schwartz), Pragmatic/Contextualist views. The ontology of disease (real kind vs. practical kind).
      *   *User's Risk:* Presenting the "stuck" debate as if the only options are Boorse vs. Pure Normativism. Many have moved past this dichotomy.

  8.  **Drafting the Response (Iterative refinement):**
      *   *Tone Check:* Be direct. Don't say "This is great!" Say "Here is where it breaks."
      *   *Structure:* Follow the four questions, then add the "Settled vs. Contested" section.
      *   *Key Insight:* The user's move resembles *Pragmatic Naturalism* or *Normative Naturalism* (Peter Schwartz) more than pure contextualism. I need to point them to that literature.
      *   *The "Drapetomania" Problem:* This is the hardest part. If the context is defined by the medical institution, and the 1850s institution said slavery escape is disease, how do you condemn it? You need an *external* normative standard. If you admit that, you're a normativist (or hybrid). If you say "No, that's not a *helping* context," you need a theory of "helping" that isn't circular.

  9.  **Refining the Critique on "Smuggling":**
      *   The user says: "A context that licenses calling the desire to escape slavery a pathology is a bad context, not a rival one."
      *   Critique: By what standard is it bad? If the standard is "human rights" or "autonomy," that's moral normativity. If the standard is "biological dysfunction," the naturalist says "But there *was* a dysfunction (in their view)."
      *   The user is essentially proposing a *constrained contextualism*. The constraint is the normative work.

  10. **Refining the Critique on "Insurance/Authority":**
      *   Contextualism threatens the *stability* required for policy. If disease is context-sensitive like "tall," I can be tall for a jockey but not for a basketball player. Can I be diseased for my doctor but not for my insurer? That creates administrative nightmares.
      *   Clinicians claim *epistemic authority*. Contextualism can sound like "It's just your opinion vs. my opinion."

  11. **Final Polish:**
      *   Ensure I mention specific names (Boorse, Wakefield, Schwartz, Cooper, Canguilhem).
      *   Make sure the distinction between *semantic* contextualism and *ontological* pragmatism is clear.
      *   Check the "Settled vs. Contested" section for accuracy. (e.g., Is BST dead? Mostly, but still a baseline. Is Hybrid the winner? It's the dominant contender but has problems).

  12. **Self-Correction during drafting:** I initially thought about telling them to read Foucault. But that might be too sociological. Stick to analytic phil-med. Mention Peter Schwartz's "Normative Naturalism" as it's very close to their view. Mention Rachel Cooper's "Naturalism + Normativity."

  13. **Final Review against constraints:**
      *   Straight with me? Yes.
      *   Separate settled/contested? Yes.
      *   Answer all 4 questions? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  This is a solid start, but you are walking into a minefield of existing literature that you need to engage with directly. Your intuition—that the debate is semantic/metaphysical rather than purely empirical—is shared by many, but your specific solution has vulnerabilities.

  Here is the straight critique based on your four questions, followed by the landscape check you requested.

  ### 1. Is the weed/tall analogy doing real work?
  **Verdict:** It creates a category error that might help, but it risks trivializing the dispute.

  *   **The Good:** The "weed" analogy is better than "tall." "Tall" is vague (sorites problem); "weed" is functional/relational (a plant in the wrong place). This aligns with the "Harmful Dysfunction" analysis (Wakefield) where "dysfunction" is natural and "harm" is relational.
  *   **The Bad:** The naturalist/normativist debate isn't just about extension; it's about *truth-makers*. When a naturalist says "Disease is natural," they mean the truth conditions for "X is a disease" are exhausted by biological facts. When you say "It depends on the context," you are shifting to a pragmatic or semantic contextualism.
  *   **The Risk:** If you say "Disease is context-sensitive," the naturalist will ask: "What fixes the context?" If the answer is "medical goals," the naturalist asks: "Are those goals natural facts?" If yes, you're a naturalist. If no, you're a normativist. The analogy doesn't dissolve the fight; it just moves the fight to "What determines the relevant context?"
  *   **Advice:** Don't present this as a dissolution. Present it as a **meta-ontological shift**. You aren't solving the extension problem; you are arguing that "disease" is a *functional kind* relative to a practice, not a *natural kind* simpliciter.

  ### 2. Does the "bad context" line smuggle normativism back in?
  **Verdict:** Yes. This is your weakest point.

  *   **The Problem:** You claim we can condemn *drapetomania* because the context must track "suffering and impairment that medicine can actually address."
  *   **The Leak:** Who defines "suffering"? Who defines "impairment"? Who defines "address"?
      *   In 1850s Louisiana, the "medical institution" defined the goal as maintaining the plantation economy. Escaping slavery impaired *that* goal. It caused suffering *to the owner*.
      *   To rule that out, you need an *external* normative standard (e.g., "The goal of medicine is the patient's well-being, not the owner's profit").
      *   Once you admit that the context is constrained by a moral norm (patient welfare > social order), you have conceded the normativist point that values are **constitutive** of the concept, not just contextual parameters.
  *   **The Charge:** You are proposing a **Constrained Contextualism**. The constraint *is* the normativity. You haven't escaped normativism; you've just hidden the normative premise inside the definition of "helping-context."
  *   **Advice:** Own it. Don't try to say you aren't a normativist. Argue that *naturalism about the biology* is compatible with *normativism about the classification*. This is basically Peter Schwartz's "Normative Naturalism." If you try to claim you aren't smuggling values in, you will get eaten alive on the *drapetomania* point.

  ### 3. Are you missing obvious objections?
  **Verdict:** Yes, specifically regarding **Epistemic Authority** and **Reification**.

  *   **The Authority Objection:** Clinicians claim they are *discovering* disease, not *assigning* it relative to a context. If a patient says, "I'm not sick, this is just my way of life," and the doctor says, "No, you have diabetes," the doctor claims the patient is *wrong*, not that they are using a different context.
      *   *Your Counter:* You need to explain why the medical context overrides the patient's context. Is it epistemic privilege? Moral authority?
  *   **The Bureaucracy Objection:** Insurance, disability, and sick leave require **stable extensions**. If disease is as context-sensitive as "weed," then I could be "diseased" enough to get sick leave from my progressive employer but "healthy" enough to be denied insurance by a conservative provider.
      *   *The Threat:* Contextualism threatens the **administrative utility** of the concept. The state needs "disease" to be a natural kind (or close enough) to distribute resources fairly. If it's too sensitive to local context, it invites bias and inconsistency.
  *   **The Reification Objection:** Even if "disease" is context-sensitive, the *biology* isn't. If you treat cancer as a "contextual weed," you still have to cut it out. Critics will argue that by making the *concept* contextual, you undermine the urgency of the *intervention*.

  ### 4. Is this interesting or just a synthesis?
  **Verdict:** It is interesting *if* you formalize the constraints. It is banal if it's just "it depends."

  *   **Synthesis:** It sounds like a version of **Pragmatic Naturalism** (e.g., Rachel Cooper) or **Normative Naturalism** (Peter Schwartz). These are live, respected positions.
  *   **The Value Add:** Your specific focus on the "helping-context parameter" is a useful heuristic. If you can rigorously define what makes a context a *medical* context (vs. a penal or economic context), you have a paper.
  *   **The Trap:** If your answer to "What makes a context medical?" is "When it tries to help," you are circular. If your answer is "When it addresses biological dysfunction," you are back to Boorse. You need a non-circular account of the "medical stance."

  ---

  ### Settled vs. Contested: The Landscape Check
  *Do not walk into the room presenting the Naturalist/Normativist dichotomy as the only game in town. It isn't.*

  **Mostly Settled (Consensus among specialists):**
  1.  **Pure Biostatistical Theory (Boorse) is insufficient.** Very few people defend pure BST anymore. The counterexamples (homosexuality, *drapetomania*, aging) are generally accepted as fatal to a purely value-free account.
  2.  **Pure Normativism is insufficient.** The view that disease is *nothing but* social disvalue (e.g., Engelhardt, some Foucaultians) is largely rejected because it cannot explain why we treat cancer differently than we treat ugliness or criminality. Biology matters.
  3.  **The concept is likely hybrid.** Most working philosophers of medicine accept that disease judgments involve both factual (biological) and evaluative (normative) components. The debate is now about *how* they mix, not *if*.

  **Live and Contested (Where your paper lives):**
  1.  **The Location of the Normativity:** Is the value judgment part of the *definition* of disease (constitutive), or is it a separate step that happens *after* we identify a dysfunction (consequential)?
      *   *Wakefield (Harmful Dysfunction):* Dysfunction is natural; Harm is normative. (Two steps).
      *   *Schwartz (Normative Naturalism):* The selection of which dysfunctions count as diseases is value-laden. (Integrated).
      *   *Your View:* The context determines the extension. (Semantic/Pragmatic).
  2.  **The "Line-Drawing" Problem:** Even if we agree it's hybrid, where is the line between disease and normal variation? (e.g., Is high blood pressure a disease or a risk factor? Is grief depression?)
  3.  **Ontological Status:** Is "disease" a real kind in the world (Realism), a useful tool for classification (Pragmatism), or a social construct (Constructivism)? Your view leans Pragmatist. You need to defend Pragmatism against Realists who argue that pragmatism makes disease too malleable for scientific research.
  4.  **The "Medicalization" Critique:** There is a huge literature on whether expanding the context of disease (e.g., calling shyness "social anxiety disorder") is harmful. Your view needs to explain why medicalization can be *wrong*, not just contextually different.

  ### Strategic Recommendations for the Paper

  1.  **Cite the Hybrids:** You must engage with **Jerome Wakefield** (Harmful Dysfunction) and **Peter Schwartz** (Normative Naturalism). Your view is closest to Schwartz. If you don't cite them, you look like you haven't done the reading.
  2.  **Clarify "Context":** Distinguish between **Semantic Contextualism** (the word means different things in different contexts) and **Ontological Pragmatism** (the category exists for a purpose). Your view seems to be the latter. Be precise.
  3.  **Fix the *Drapetomania* Argument:** Do not say the context was "bad." Say the context was **non-medical**. Argue that a "medical context" is *defined* by a commitment to patient welfare (or reduction of suffering). If an institution claims to be medical but acts to preserve slavery, it is **mimicking** medicine, not practicing it. This allows you to condemn *drapetomania* without smuggling in arbitrary values—you are appealing to the internal norms of the practice of medicine itself.
  4.  **Anticipate the "Instability" Objection:** Address the insurance/bureaucracy point head-on. Acknowledge that for policy, we "freeze" the context into codes (ICD), but argue that this freezing is a pragmatic necessity, not a metaphysical truth.

  **Bottom Line:** Your central move works *if* you admit it is a form of Normative Naturalism/Pragmatism. It fails if you claim it avoids normativity entirely. Be honest about the normative commitment, and you'll have a defensible position.
