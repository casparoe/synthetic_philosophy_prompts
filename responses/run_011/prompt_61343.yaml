prompt: |-
  I run a monthly "how things work" evening session at our community centre: about twenty-five adults, mostly retired or on shift patterns, no maths past school level, forty minutes, a whiteboard and nothing else. For some months I have been reading around the idea of an information cascade on my own — how a queue forms outside a mediocre café, how a town ends up unanimously certain of something nobody in it actually has evidence for — and I want to teach it properly rather than as a slogan about sheep.

  Please take the role of a social epistemologist and behavioural economist who has taught cascades to general audiences many times. Think carefully: before writing the plan, sketch out for yourself which parts of the idea depend on which other parts, and which of those dependencies a lay audience will get wrong if you invert them. Then give me the teaching plan, not the talk.

  It should cover:

  - the order the components must be introduced in, and why that order — my guess is that nothing works until they have the notion of a private reason that each person holds and cannot show, but tell me if I have that backwards;
  - the one example to build the whole session on: what it must contain, what it must leave out, and whether the urn-and-coloured-balls apparatus is worth the minutes it costs at this level (I had assumed a restaurant queue, but say if that quietly smuggles in something false);
  - the misconceptions my audience will arrive with or form partway through — I expect "so people are stupid and just follow the herd", "so always ignore the majority", and "this is only an internet thing" — and the precise point in the sequence at which each should be headed off;
  - the two features I most want to land: that everyone inside a cascade is being entirely reasonable by their own lights, and that from the outside a cascade is indistinguishable from a crowd that has genuinely got it right;
  - one closing question that would tell me whether they understood it or merely enjoyed it;
  - what I should deliberately leave out, and announce that I am leaving out.

  Please write your answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Role:** Social Epistemologist and Behavioural Economist (experienced in teaching lay audiences).
      *   **Audience:** ~25 adults, mostly retired/shift workers, no maths beyond school level.
      *   **Constraints:** 40 minutes, whiteboard only (no props/handouts ideally, though the prompt asks about urns), community centre setting.
      *   **Topic:** Information Cascades (how private signals get overridden by public actions).
      *   **Goal:** Teach it *properly*, not as "people are sheep."
      *   **Specific Requirements:**
          *   Sketch dependencies first (mental model).
          *   Teaching Plan (Order, Example, Misconceptions, Key Takeaways, Closing Question, Omissions).
          *   British English.
          *   Tone: Professional, pedagogical, empathetic to the audience's constraints.

  2.  **Deconstruct the Concept (Information Cascades):**
      *   *Core Mechanism:* Private Signal + Public Action of Predecessors -> Decision.
      *   *The Tipping Point:* When public actions outweigh private signal.
      *   *The Result:* Rational individuals ignoring their own information to follow the crowd.
      *   *The Problem:* The crowd might be wrong because early signals were noisy, but later people assume early people knew something.
      *   *Fragility:* A small bit of new public info can break it.

  3.  **Dependency Sketch (Mental Model):**
      *   *Concept A:* Private Information (I know something you don't).
      *   *Concept B:* Public Action (You see what I do, not what I know).
      *   *Concept C:* Rational Inference (I assume you did that for a good reason).
      *   *Concept D:* The Override (Your action + my assumption > my private info).
      *   *Concept E:* The Cascade (Everyone does D).
      *   *Dependency:* You can't understand D without A, B, and C. If you start with E (the crowd), they think it's mindless conformity (sheep). You must start with A (the individual's mind).
      *   *Potential Pitfall:* If I explain the "queue" first, they assume the queue *causes* the behaviour. I need to show the behaviour *causes* the queue based on hidden info.
      *   *Urn vs. Queue:* Urns are mathematically precise but abstract. Queues are relatable but smuggle in "quality" assumptions (maybe the coffee *is* good?). Urns are better for isolating the *information* aspect, but might bore a non-maths audience. A hybrid is needed. Let's stick to a binary choice scenario (Restaurant A vs. B) rather than a continuous queue, as it simplifies the "signal" aspect. Actually, the prompt asks about the urn. Urns are risky with no props. A "Restaurant Choice" is better but needs careful setup to ensure they know *nobody knows which is actually better*.
      *   *Key Insight to Land:* Rationality. They must see that ignoring your own gut is the *smart* move in a cascade.

  4.  **Drafting the Plan - Section by Section:**

      *   **Dependencies:** Need to explicitly state that Private Signal must come before Public Action. If you invert, it looks like conformity.
      *   **The Example:** The prompt asks about the Urn. With only a whiteboard and 40 mins, drawing urns takes time. A "Restaurant A vs. Restaurant B" scenario is more visceral for adults. However, the Urn model is the *canonical* model for a reason (removes quality bias). Let's advise *against* the physical urns (too much faff) but *for* the logic of the urn (binary signals) applied to a restaurant scenario. Wait, the prompt asks specifically if the urn apparatus is worth it. My advice: No. It distracts. Use a "Two Doors" or "Two Restaurants" analogy on the board.
      *   *Refinement on Example:* Let's use "Two Restaurants" (A and B). One is good, one is bad. Nobody knows which. You get a tip (private signal). You see where others go (public action). This avoids the "queue implies quality" trap if framed correctly (i.e., we are deciding *before* eating).
      *   **Misconceptions:**
          *   "People are stupid": Counter this at the moment of decision (show the maths/logic of why following is rational).
          *   "Always ignore majority": Counter this at the end (sometimes the majority is right).
          *   "Internet thing": Counter this at the start (use a physical, offline example).
      *   **Key Features:** Rationality inside, Indistinguishability outside. These need to be the bookends.
      *   **Closing Question:** Needs to test application, not recall. "What would break the queue?"
      *   **Omissions:** Math formulas, probability thresholds, network topology.

  5.  **Refining the "Order" Argument:**
      *   User guesses: Private reason first.
      *   My verdict: Yes, absolutely. If you start with the crowd, it's herd behaviour. If you start with the individual's dilemma, it's epistemology.
      *   Sequence:
          1.  Uncertainty (We don't know the truth).
          2.  Private Signal (I have a hint).
          3.  Public Action (You see my choice).
          4.  Inference (You assume my choice reflects my hint).
          5.  Conflict (My hint says X, your action says Y).
          6.  Resolution (I follow you).
          7.  Cascade (Next person faces same conflict).

  6.  **Addressing the "Urn" Question:**
      *   Urns are abstract. "Coloured balls" implies randomness.
      *   Restaurant Queue implies *quality*.
      *   Best approach: A "Binary Choice" scenario (Restaurant A or B) where *objective quality is unknown*. This keeps the urn logic without the props. I will advise against physical urns because setting them up eats 5-10 minutes of a 40-minute session and distracts from the *logic*.

  7.  **Addressing Misconceptions:**
      *   "Stupid/Sheep": Address when explaining the decision to follow. Emphasise "Bayesian updating" without using the word. "It is rational to trust two people's actions over your own gut."
      *   "Ignore Majority": Address at the end. Cascades are fragile. New info breaks them.
      *   "Internet Thing": Address at the start. Use a physical example (restaurants, fashion, investments).

  8.  **Drafting the Content (incorporating British English):**
      *   *Tone:* Respectful, clear, avoiding jargon.
      *   *Structure:* Dependencies first, then the Plan.
      *   *Whiteboard usage:* Visualising the chain of people.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific question about the urn? Yes.
      *   *Check:* Did I address the "private reason" hypothesis? Yes.
      *   *Check:* Is the closing question diagnostic? "What single piece of information would make you break the queue?" tests if they understand the fragility of public info vs. private info.
      *   *Check:* Omissions. Must mention that I'm ignoring *why* the first people chose (payoffs/rewards) to focus purely on information.

  10. **Final Polish:** Ensure the distinction between "Action" and "Knowledge" is sharp. This is the crux of the cascade. The whiteboard needs to show: Person 1 (Signal -> Action), Person 2 (Signal + Action 1 -> Action), Person 3 (Signal + Action 1 + Action 2 -> Action).

  *(Self-Correction on the Example)*: The prompt mentions the "queue outside a mediocre café". This is the classic example. The risk is people think "The queue means the coffee is good." I need to make sure the audience understands the coffee *might* be bad. I will stick with the "Two Restaurants" model but acknowledge the queue visual. Actually, the "Two Restaurants" is cleaner for the *start* of a cascade. A queue is the *result*. I'll use the Restaurant Choice to build the cascade, then acknowledge that looks like a queue.

  *(Refining the "Urn" advice)*: Be decisive. No physical urns. It turns a talk into a magic show. Draw the urn on the board if needed, but better to use "Tips".

  *(Refining the "Private Reason" hypothesis)*: The user is right. Start with the individual mind.

  *(Closing Question)*: Needs to be punchy. "If you were the 10th person in line, what would it take to make you walk away?"

  *(Omissions)*: Payoff structures (why are we choosing?), Network effects (friends telling friends), Malice/Lying.

