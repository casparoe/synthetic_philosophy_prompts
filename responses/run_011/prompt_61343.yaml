answer: |-
  ### Part 1: The Dependency Sketch

  Before we set the whiteboard, we must map the logic. An information cascade is a chain reaction, but if you present the chain first, the audience sees only conformity. You must present the *links* first.

  Here is the dependency hierarchy. If you invert these, the audience will default to "herd mentality" explanations.

  1.  **Uncertainty:** The truth is unknown. (If the truth is known, there is no cascade, only correctness).
  2.  **Private Signal:** Each individual has a hint about the truth, but it is noisy/imperfect. (Without this, they are mindless drones).
  3.  **Public Action:** Individuals must make a visible choice based on their signal. (Without this, there is no data for others to observe).
  4.  **Rational Inference:** Observers assume previous actors were rational and acted on *their* private signals. (This is the engine. If observers think previous actors were guessing or paid to act, the cascade breaks).
  5.  **The Override:** At a specific point, the weight of public actions outweighs the weight of the private signal. (This is the tipping point).
  6.  **The Cascade:** Subsequent actors ignore their private signals entirely.

  **The Critical Dependency:** You cannot explain **5 (The Override)** until you have firmly established **2 (Private Signal)** and **4 (Rational Inference)**.
  *   If you skip **2**, the audience thinks people have no minds of their own (Sheep).
  *   If you skip **4**, the audience thinks people are blindly copying (Conformity).
  *   Your intuition is correct: **Private Reason** must be the foundation. If they do not believe every person in the chain is thinking for themselves, the rest is just sociology, not epistemology.

  ***

  ### Part 2: The Teaching Plan (40 Minutes)

  **Topic:** Information Cascades: Why Rational People Follow the Crowd.
  **Resources:** Whiteboard, markers (two colours).
  **Audience:** 25 adults, non-specialist.

  #### 1. The Setup: Uncertainty and Private Signals (0–8 mins)
  *   **The Scenario:** Do not start with the queue. Start with the decision *before* the queue forms.
  *   **The Board:** Draw two boxes: **Restaurant A** and **Restaurant B**.
  *   **The Premise:** Tell them: "One of these restaurants is excellent. One is terrible. We do not know which is which. There is a 50/50 chance for either."
  *   **The Private Signal:** "You arrive for dinner. Before you go in, you get a 'tip'. Maybe a review in your pocket, or a smell from the kitchen. This tip is right 60% of the time. It's not perfect, but it's better than a guess."
  *   **The Check:** Ask the room: "If you are the very first person to arrive, and your tip says 'A is good', where do you go?" (They will say A). "Why?" (Because you have no other information).
  *   **Why this order:** This establishes **Private Signal** and **Rationality** immediately. They are not sheep; they are using data.

  #### 2. The Chain: Public Action and Inference (8–20 mins)
  *   **Person 2:** Draw a stick figure '2' next to '1'. "Person 2 arrives. They also get a tip. Their tip says 'B is good'. But, they see Person 1 went into A."
  *   **The Calculation:** Ask the room: "Person 2 has a tip for B, but sees Person 1 chose A. What should they do?"
      *   *Guide them:* Person 1's action *reveals* Person 1's tip. So Person 2 has two tips: One for A (from Person 1's action), one for B (their own). It is a tie. Person 2 might flip a coin, or follow Person 1. Let's assume they follow Person 1 into A.
  *   **Person 3:** Draw figure '3'. "Person 3 gets a tip for B. But they see Person 1 and Person 2 both go into A."
  *   **The Override:** "Person 3 now has one tip for B (their own), but *two* tips for A (inferred from the actions of 1 and 2). Even if Person 3 trusts their own nose, the weight of evidence says A."
  *   **The Crucial Point:** Emphasise that Person 3 is **not copying**. They are **calculating**. They are ignoring their private signal because the public information is statistically stronger.
  *   **Why this example:** It isolates the information flow. A physical queue (as you suggested) risks the audience thinking "The queue implies the food smells good" or "There's safety in numbers." The Restaurant A/B binary forces them to focus on *information*, not *quality*.
  *   **On the Urn Apparatus:** **Do not use physical urns and balls.**
      *   *Reason:* With 25 adults and 40 minutes, passing around props kills momentum. It turns a lecture into a workshop. It also focuses attention on the *randomness* of the balls rather than the *logic* of the decision.
      *   *Alternative:* Draw the "urn" logic on the board using the Restaurant tips. It achieves the same mathematical isolation without the fiddle.

  #### 3. The Cascade and The Illusion (20–30 mins)
  *   **The Snowball:** "Person 4 arrives. They see three people in A. Even if their tip says B, the weight of three previous actions crushes their single tip. They go to A. Person 5, 6, 100... they all go to A."
  *   **Feature 1 (Internal Rationality):** Pause here. "Look at Person 10. Are they stupid? No. They are being perfectly rational. They are respecting the evidence of the nine people before them."
      *   *Head off Misconception:* **"People are stupid/sheep."** Address this *now*. Explicitly state: "If you were Person 10, you would do the same. It is the sensible thing to do."
  *   **Feature 2 (External Indistinguishability):** "Now, imagine you drive past. You see a queue at A and an empty B. What do you assume?" (That A is better). "But we know A might be terrible. The first two people might have just got lucky with their tips."
      *   *Head off Misconception:* **"This is only an internet thing."** Remind them this is about physical restaurants, investment banks, or fashion. The internet speeds it up, but the mechanism is human, not digital.
      *   *Key Takeaway:* "From the outside, a cascade looks exactly like a crowd that knows what it is doing. You cannot tell the difference between a wise crowd and a cascading one just by looking."

  #### 4. Fragility and Breaking the Chain (30–35 mins)
  *   **The Weakness:** "So, is the cascade unbreakable? No. It is incredibly fragile."
  *   **The Disruption:** "If Person 20 walks out of Restaurant A and says 'The food is poison', what happens?"
      *   The cascade breaks. Why? Because public *action* is ambiguous (maybe they just liked B better), but public *information* (speech) reveals the private signal directly.
  *   **Head off Misconception:** **"So always ignore the majority."** Address this *here*. "Ignoring the majority is usually reckless. The majority is often right. The danger is only when the majority is acting on *other people's* actions, not their own knowledge."

  #### 5. Closing and Assessment (35–40 mins)
  *   **Summary:** Reiterate: Private signals get drowned out by public actions. Everyone is rational. The result can be wrong.
  *   **The Closing Question:** Do not ask "What is a cascade?" (That tests memory). Ask:
      > *"You are the 50th person in the queue. You have a strong private reason to believe this café is terrible. What single type of new evidence would you need to see, to justify walking away?"*
      *   *Correct Answer:* They need to see someone else's *private information* revealed (e.g., someone leaving, a health inspection notice), not just someone else's *action* (which is already accounted for). If they say "I'd wait for the queue to get shorter," they haven't understood. They need to identify that *actions* are the trap; *information* is the key.

  ***

  ### Part 3: What to Deliberately Leave Out

  You must announce these omissions to prevent the "Yes, but..." questions from derailing the 40 minutes. Write these on the bottom corner of the board at the start:

  1.  **Payoffs and Rewards:** "We are assuming everyone just wants the truth. I am leaving out what happens if people are paid to queue, or want to be seen at the trendy place." (This keeps the focus on *epistemology*, not *incentives*).
  2.  **Communication:** "I am assuming people cannot talk to each other, only watch actions. If they could talk, the cascade might not form." (This isolates the 'action vs. signal' problem).
  3.  **Malice:** "I am assuming nobody is lying. Everyone is trying their best." (This preserves the 'rationality' argument).

  ### Summary of Misconception Management

  | Misconception | When it arises | How to head it off |
  | :--- | :--- | :--- |
  | *"People are sheep/stupid"* | During the 'Override' phase (Person 3). | Explicitly validate Person 3's logic. "They are doing the maths, not following the herd." |
  | *"This is just social media"* | During the Setup. | Use the Restaurant example. Emphasise this happens in stock markets and high streets, not just Twitter. |
  | *"Always trust your gut"* | During the Closing. | Explain that ignoring the crowd is usually dangerous. The lesson is to recognise *when* the crowd is empty of new info. |

  ### Final Advice on Delivery

  You have forty minutes. That is very short.
  *   **Minutes 0–5:** Hook them with the Restaurant A/B mystery.
  *   **Minutes 5–25:** Walk the chain (Person 1 to Person 5) slowly on the whiteboard. Use arrows to show "Tip" vs "Observation".
  *   **Minutes 25–35:** Discuss the implications (Rationality vs. Error).
  *   **Minutes 35–40:** The Closing Question and wrap-up.

  Do not rush the "Person 3" moment. That is the hinge. If they grasp that Person 3 is *right* to ignore their own tip, you have succeeded. If they think Person 3 is weak, you have failed. Spend your time there.
