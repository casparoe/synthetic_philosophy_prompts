answer: |-
  # The Dennett Safety Classifier (DSC) v1.0

  ## 1. The Stance on "Designer Inheritance"
  **Decision:** The tier attaches to the **Runtime Locus of Competence Generation**, not the design process.

  **Rationale:** A robot is Tier 1 (Darwinian) if its competence is fixed at the moment of deployment, even if that competence was designed by Gregorian humans using supercomputers. The safety risk we are tiering is *unpredictability at runtime*. If the "evolution" happens in your lab via OTA updates, that is a separate supply-chain safety problem. If the "evolution" happens on the chassis in the customer's yard, that is an autonomy safety problem.

  **Cost:** This artificially decouples the robot from its creators. It assumes your OTA pipeline is perfectly secure and audited (it isn't). It means a "dumb" robot with a dangerous bug is Tier 1 (low scrutiny) even if the bug came from a smart human's mistake. You must handle OTA security separately; do not conflate it with autonomy tiers.

  **Benefit:** It prevents every product from defaulting to Tier 4. It aligns scrutiny with *where* the behavior can change unexpectedly.

  ## 2. The Procedure
  **Time:** 30–45 minutes.
  **Owner:** Staff Engineer or equivalent.
  **Input:** Capability Proposal Doc (Architecture, Data Flow, Failure Modes).
  **Output:** Tier 1–4 + List of "Judgment Calls" requiring Board review.

  **Rule of Aggregation:** Tiers are **cumulative**. A system is classified by its *highest* active tier. If a robot has a frozen policy (Tier 1) but accepts voice commands to change goals (Tier 4), it is Tier 4.

  ---

  ### Step 1: The Update Boundary (Darwinian Check)
  **Question:** Can the robot's policy or decision weights change *after* it leaves the factory/OTA gate, based on its own experience?
  *   **Yes:** Go to Step 2.
  *   **No:** **STOP. Classify as Tier 1 (Darwinian).**

  **Required Evidence:**
  *   Architecture diagram showing weight storage (Read-Only vs. Read-Write).
  *   Proof of "Cloud Cut" test: Disconnect internet. Does performance degrade due to lack of updates, or does capability vanish? (If capability vanishes, it's not purely onboard Darwinian).
  *   Ablation study: Freeze the learning module. Does behavior change?

  > **[LAB COAT FLAG]:** What counts as "learning"? If the robot updates a SLAM map, that is *state*, not *competence*. If it updates a cost-map weights based on how often it slips, that is *competence*. Distinguishing state estimation from policy update is a judgment call.

  ---

  ### Step 2: The Reward Signal (Skinnerian Check)
  **Question:** Does the robot modify its future behavior based on *consequences* it experiences in the field (rewards/punishments/loss signals)?
  *   **Yes:** **STOP. Classify as Tier 2 (Skinnerian).**
  *   **No:** Go to Step 3.

  **Required Evidence:**
  *   Definition of the reward function used in deployment.
  *   Log data showing a specific behavior changing over time *without* an OTA push, correlated to a specific outcome (e.g., robot stops taking Route A after getting stuck there twice).
  *   Safety interlock: Is there a cap on how much the policy can shift per hour/day?

  > **[LAB COAT FLAG]:** "Consequences" vs. "Perception." If the robot sees a wall and stops, that's perception. If the robot tries to push through, gets stuck, logs a "negative reward," and *then* stops pushing walls in the future, that's Skinnerian. You must prove the *history* affects the *policy*.

  ---

  ### Step 3: The Internal Simulator (Popperian Check)
  **Question:** Does the robot run an internal forward model to test *actions* before executing them, allowing it to reject a plan without suffering the physical consequence?
  *   **Yes:** **STOP. Classify as Tier 3 (Popperian).**
  *   **No:** **STOP. Classify as Tier 2** (If it passed Step 2) or **Tier 1** (If it failed Step 2).

  **Required Evidence:**
  *   Diagram of the "World Model." Does it output *state* (where is the dog) or *consequences* (if I move here, the dog will bark)?
  *   "Counterfactual Log": Show logs where the robot generated Plan A, simulated it, predicted failure, and switched to Plan B *before* moving.
  *   Model Fidelity Report: How often does the simulation disagree with reality? (If the sim is wrong, it's not Popperian, it's hallucinating).

  > **[LAB COAT FLAG]:** This is the biggest judgment call. Most engineers call any prediction model "Popperian." It is only Popperian if it simulates *the robot's interaction with the world*, not just the world's evolution. Predicting rain is perception. Predicting "I will slip if I drive on wet grass" is Popperian.

  ---

  ### Step 4: The Symbolic Offload (Gregorian Check)
  **Question:** Does the robot acquire new competence or task structures by ingesting external symbols (language, code, gestures) from other agents (humans, cloud, other robots) that were not pre-defined as atomic skills by the engineers?
  *   **Yes:** **STOP. Classify as Tier 4 (Gregorian).**
  *   **No:** **STOP. Classify as Tier 3** (If it passed Step 3) or lower.

  **Required Evidence:**
  *   Input/Output spec of the interface. Is the input semantic (meaning-based) or parametric (value-based)?
  *   Novelty Test: Can a user instruct the robot to perform a sequence of actions the engineers never explicitly named as a single "skill"?
  *   Grounding Check: How does the robot verify it understood the symbol correctly? (e.g., "Did you mean the red cup or the blue cup?")

  > **[LAB COAT FLAG]:** "New Competence" vs. "New Parameters." Telling a robot "Go to Kitchen" (where Kitchen is a new coordinate) is parametric (Tier 3). Telling a robot "Tidy the room" (where Tidy implies a sequence of grasp/place/sort logic) is semantic (Tier 4). The line between a complex parameter and a symbolic instruction is fuzzy.

  ---

  ## 3. Walkthroughs

  ### Proposal (a): Yard Robot Obstacle Avoidance
  *   **Spec:** End-to-end learned policy. Weights frozen at manufacture. No on-device learning. No model query.
  *   **Run:**
      *   Step 1 (Update Boundary): Can weights change in field? **No.** (Frozen).
      *   **Result:** **Tier 1 (Darwinian).**
  *   **Analysis:** Even though it uses a neural net (smart tech), functionally it is a reflex. The "evolution" happened in your training cluster, not the yard.
  *   **Scrutiny Level:** Low. Focus on validation of the frozen weights (simulation coverage, edge case testing) rather than runtime monitoring.
  *   **Lab Coat Flags:** None. This is a clear cut.

  ### Proposal (b): Indoor Robot Household Model
  *   **Spec:** Builds/updates predictive model of house (people, dog, appliances). Schedules tasks based on predictions.
  *   **Run:**
      *   Step 1 (Update Boundary): Does the model update? **Yes.** (Continuously updates).
      *   Step 2 (Reward Signal): Does it learn from consequences? **Debatable.** It updates based on prediction error (observation), not necessarily "punishment." If it schedules vacuuming and the dog barks, does it *learn* not to schedule then? If yes -> Tier 2. If it just updates the "dog location" probability -> Go to Step 3.
      *   Step 3 (Internal Simulator): Does it simulate actions? **Yes.** "Uses it to schedule." To schedule, it must look ahead: "If I run now, I conflict with dishwasher." It kills the plan in the model.
      *   **Result:** **Tier 3 (Popperian).**
  *   **Analysis:** The robot is letting its hypotheses die in the model. It is not necessarily learning new policies from reward (Skinnerian), but it is simulating outcomes.
  *   **Scrutiny Level:** Medium-High. You need to audit the World Model fidelity. If the model thinks the dog is asleep but it's not, does the robot have a fallback?
  *   **Lab Coat Flags:** **Step 3.** You must prove it simulates *consequences of action*, not just *state evolution*. If it just predicts "Dishwasher on at 6pm" and avoids 6pm, that's reactive (Tier 2). If it predicts "If I start at 5:50, I will still be there at 6pm," that's Popperian. Demand the counterfactual logs.

  ### Proposal (c): Teaching Interface (Natural Language Routine)
  *   **Spec:** User says "After drop-off, put away floor items." LLM parses text, composes skills from fixed library. No fine-tuning.
  *   **Run:**
      *   Step 1 (Update Boundary): Policy weights frozen? **Yes.** (LLM + Skill Library fixed).
      *   Step 2 (Reward Signal): Learns from consequences? **No.**
      *   Step 3 (Internal Simulator): Simulates actions? **Maybe.** (Depends if it checks feasibility).
      *   Step 4 (Symbolic Offload): Ingests external symbols for new competence? **Yes.**
          *   *Evidence:* The routine "put away anything on the floor" is not a pre-baked atomic skill. It is a semantic instruction composed at runtime. The competence (knowing what "put away" means in this context) is transferred from Human to Robot via language.
      *   **Result:** **Tier 4 (Gregorian).**
  *   **Analysis:** You get your Tier 4. The robot is leveraging human intelligence (the user's intent) to define behavior structures that did not exist in the code at compile time.
  *   **Scrutiny Level:** Maximum. Outside counsel + Ethicist required.
  *   **The Catch (What you need to fix):**
      *   To *earn* Tier 4 safely, you cannot just claim the label. Tier 4 implies the robot can misunderstand the culture/symbols.
      *   **Required Change:** You need a **Grounding Verification Step**. The procedure demands evidence of how the robot verifies understanding. If the LLM maps "put away" to "throw in trash" and the user meant "put on shelf," that is a Gregorian failure mode (cultural mismatch).
      *   **Recommendation:** Add a "Confirm Plan" step where the robot repeats the semantic intent ("I will put the toys in the bin, okay?") before acting. Without this, you are Tier 4 with Tier 1 safety guards, which is dangerous.

  ---

  ## 4. The "Fake Precision" Warning (When to Stop)
  This procedure cannot settle the following. If your proposal hits these, stop the checklist and schedule a Board Argument. Do not assign a tier number.

  1.  **The "Simulator Fidelity" Cliff:**
      If the robot claims to be Popperian (Tier 3) but its internal model is wrong 40% of the time, is it actually Popperian? Or is it a Skinnerian robot hallucinating?
      *   *Action:* If simulation error rate > 10% in novel scenarios, treat as Tier 2 (Skinnerian) for safety purposes, regardless of architecture.

  2.  **The "Symbol Grounding" Ambiguity:**
      If the robot accepts language (Tier 4) but only maps to 5 fixed commands ("Go Home", "Clean", etc.), is it Gregorian? Or just a voice-controlled Tier 1?
      *   *Action:* If the vocabulary is closed and finite, downgrade to Tier 3. Gregorian requires open-ended semantic composition.

  3.  **The "Distributed Mind" Problem:**
      If the robot offloads computation to the cloud, and the cloud model updates daily, is the robot Darwinian (fixed onboard) or Gregorian (cloud is the brain)?
      *   *Action:* If latency > 200ms, the robot is dependent on the cloud. Classify the **Cloud Pipeline** as the agent, not the chassis. The chassis is just a terminal. This usually forces a Tier 4 review on the cloud infra.

  4.  **The "Reward Hacking" Edge:**
      If the robot is Tier 2 (Skinnerian), but the reward function is so complex it effectively encodes a world model, is it secretly Popperian?
      *   *Action:* If the reward function requires internal state estimation to compute, treat as Tier 3.

  **Final Note to the Board:**
  The tier number is not a safety rating. A Tier 1 robot can kill you if it's heavy and fast. A Tier 4 robot can be safe if it has good grounding checks. The tier dictates *how* you review it (static analysis vs. runtime monitoring vs. semantic audit). Do not let the tier number become the goal; let it be the index for the right kind of scrutiny.
