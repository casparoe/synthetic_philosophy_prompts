  **Note**

  The backward-induction conclusion is wrong for this game. The specific failure lies in the assumption that common knowledge of rationality survives a deviation. Backward induction requires that at every node, both players know the other is rational, knows that they know, and so on. When a player passes at a node where induction dictates they should take, they have signaled that either they are not rational or they do not believe the other is rational. The standard argument fails because it insists on applying the original rationality assumptions to a node that, by the argument's own logic, should never have been reached. You cannot use a model that predicts "Take" to analyze a move that was "Pass" without updating the model of the player.

  The poem takes liberties with time to enforce the logical contagion. In the game, you cannot stand at Node 3 and observe Node 4; yet the pantoum's inheritance forces the future into the past. Line 8 ("Why did he pass the coin?") appears at Node 4 before it is observationally valid, mimicking how the theoretical contradiction infects the earlier nodes before the move physically happens. A defender of the standard argument would reject this blur, insisting that off-path nodes are counterfactuals, not observations.

  If the players were told only that the game ends somewhere, without common knowledge of the final node, the argument would not survive. Backward induction requires a fixed anchor at the last decision point to begin the unraveling. Without a known end, there is no final node where "taking" is strictly dominant regardless of the other's response. The chain of reasoning has no place to hook, and cooperation becomes sustainable because the threat of future punishment cannot be logically eliminated.
