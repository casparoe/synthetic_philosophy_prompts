answer: |-
  # Iterated Weak Dominance and the Fragility of Order

  In the study of strict dominance, a comforting theorem holds: the order in which dominated strategies are eliminated never changes the final set of survivors. Whether you delete row strategies first or column strategies, strictly dominated moves vanish permanently, leaving a unique reduced game. This robustness grounds the rationality argument that no player would ever choose a strategy that is strictly worse than an alternative. However, this entry examines what happens when we relax the requirement from *strict* to *weak* dominance. Here, the order of deletion matters, and the uniqueness of the solution collapses. To understand why, we analyze the regulatory negotiation game between the Harbor Authority (Row) and the Border Agency (Column).

  ### The Elimination Sequences

  The game begins with three strategies for each player: Joint filing (J), Alone filing (A), and Stay out (S). We first apply strict dominance, which remains order-independent. For the Harbor Authority, filing Alone (A) yields payoffs of 2, 1, and 2 against the Border's choices, whereas Staying out (S) yields 0, 0, and 0. Strategy S is strictly dominated by A and is eliminated. Symmetrically, for the Border Agency, filing Alone (A) yields 2, 1, and 2 against Harbor's choices, while Joint filing (J) yields 1, 0, and 1. Strategy J is strictly dominated by A and is eliminated.

  We are left with a reduced 2x2 game where Harbor chooses between {J, A} and Border chooses between {A, S}. It is here that strict dominance ends and weak dominance begins. In this reduced setting, the payoff structure creates a specific symmetry: filing Alone (A) and Staying out (S) for the Border player each weakly dominate the other, but they do so by tying in different places against Harbor's remaining strategies. This mutual weak dependence generates three legitimate elimination paths:

  1.  **Delete Border's Stay out (S):** If we argue S is weakly dominated by A, Border plays A. Facing A, Harbor's best response is to file Alone (A). The outcome is **(A, A)**.
  2.  **Delete Border's Alone (A):** If we argue A is weakly dominated by S (due to the specific ties in the compromise scenario), Border plays S. Facing S, Harbor's best response is to file Jointly (J). The outcome is **(J, S)**.
  3.  **Delete Neither:** If we refuse to break the tie without further justification, both strategies survive for Border, and consequently, both J and A remain viable for Harbor. The outcome is the **set {(A, A), (J, S)}**.

  All three paths adhere to the definition of iterated weak dominance. Yet, they produce three different predictions.

  ### Diagnosing the Indeterminacy

  Why does the result fracture? The issue is not merely the permission to delete weakly dominated strategies, but the epistemic assumption required to do so. When a strategy is *strictly* dominated, it is never a best response to any belief about the opponent. A rational player need not know what the opponent thinks to reject it; the strategy is simply inferior.

  Weak dominance is different. A weakly dominated strategy is a best response to *some* beliefs—specifically, beliefs that assign zero probability to the strategies where the dominance is strict and positive probability to the strategies where the payoffs tie. To delete a weakly dominated strategy, we must assume not only that the player is rational but that they *believe* the opponent will not play the specific strategy that creates the tie. In our example, deleting Border's "Stay out" requires Harbor to believe Border will not play the strategy that makes "Stay out" optimal.

  This shifts the justification from a claim about **choice** (rationality) to a claim about **belief** (knowledge). Strict dominance relies on the axiom that players maximize utility. Weak dominance relies on the stronger, often unsupported axiom that players do not hold "trembling" beliefs that assign probability to weakly dominated responses. When the order of deletion changes, it is because different sequences impose different, incompatible assumptions about which ties the players expect to be broken.

  ### The Ambiguity of Mixed Strategies

  This fragility is compounded by how we interpret mixed strategies, a concern raised by Brandenburger and others. If a mixed strategy is viewed physically—as a deliberate randomization device—a player might genuinely be indifferent between two pure strategies if they yield the same expected payoff. In this view, weak dominance deletion is hazardous because it discards strategies that a rational randomizing agent might actually use.

  However, if mixed strategies are viewed epistemically—as a representation of the opponent's uncertainty about the player's choice—the situation becomes more nuanced. Under the epistemic reading, deleting a weakly dominated strategy implies that no coherent belief system could assign positive probability to it. But in our reduced game, the "ties" mean that such beliefs *are* coherent. Harbor can coherently believe Border will Stay Out; Border can coherently believe Harbor will file Jointly. The ambiguity of the mixture does not rescue iterated weak dominance here; rather, it highlights that the deletion relies on an arbitrary refinement of beliefs. Unless we introduce a "trembling hand" perfection (assuming players might make mistakes with infinitesimal probability), the ties remain unbroken, and the order dependence persists. Reading mixtures epistemically makes the situation worse for the theorist, as it forces us to admit that multiple belief hierarchies are consistent with rationality, none of which uniquely selects an order of deletion.

  ### The Honest Verdict

  What should a student conclude from this breakdown? The honest verdict is that iterated weak dominance is a **well-defined procedure but not a well-defined solution concept.** It is well-defined in that the rules for deletion are clear; it is not a solution concept in that it fails to single out a unique prediction without arbitrary auxiliary assumptions about the order of reasoning.

  Unlike strict dominance, which isolates strategies that are irrational under *any* belief, weak dominance isolates strategies that are irrational under *specific* beliefs. Consequently, using iterated weak dominance as an argument that a specific profile *will* be played is theoretically unsound unless one can justify why one order of deletion is more plausible than another. In the context of the regulatory game, predicting (A, A) over (J, S) requires assuming the Border Agency views the compromise tie in a specific way that the Harbor Authority does not.

  For the purposes of this course, treat iterated weak dominance as a tool for narrowing the set of possibilities, not for identifying a unique equilibrium. When strict dominance yields a unique result, it is robust. When weak dominance is required to proceed, the result is order-dependent, reflecting the fragility of the belief assumptions rather than the depth of rational choice.
