answer: |-
  The Head of State may refuse ministerial advice only to prevent the permanent disablement of democratic accountability or fundamental procedural breach, provided such refusal is public, reasoned, and invites immediate democratic correction.

  **Clauses**

  1.  **Systemic Protection:** Refusal is limited to threats against the electoral cycle or parliamentary sovereignty (Cases 4, 6). This distinguishes ordinary unlawful acts (Case 3, where courts remedy) from system-breaking delays (Case 4, where HoS must refuse). It validates refusing dissolution when confidence exists (Case 6) but condemns surprise dismissals without cause (Case 5).
  2.  **Radical Transparency:** All objections must be public; secret vetoes or engineered incapacities are prohibited (Cases 1, 8). This condemns Belgian deception and King's Consent while validating Luxembourg's honesty. The public nature ensures voters assign blame correctly.
  3.  **Personal Capacity:** The Head of State may signal constraints regarding their own tenure but not policy morality (Case 9). This permits abdication hints without policy interference, distinguishing personal status from legislative morality.
  4.  **Integrity vs. Self-Preservation:** Consent cannot be withheld to preserve the Head of State's own powers, but hesitation is permitted to protect fundamental constitutional structures like judicial independence (Case 7). This ensures self-preservation never overrides democracy, while constitutional collapse remains a valid ground for refusal.

  **Unsaveable Cases and Rescue**

  Case 1 (Belgium) and Case 8 (King's Consent) must be given up; both violate Radical Transparency. Deception and secret preprocessing undermine the trust required for ceremonial authority. Case 2 (Luxembourg) is saved by the "invites correction" clause—the Grand Duke's honesty triggered the abolition that legitimized the system. Case 9 is saved by the Personal Capacity clause. Cases 2 and 9 are rescued without saving 8 because the distinguishing factor is publicity. Cases 2 and 9 were open signals inviting public response; Case 8 was secret preprocessing. A clause mandating public reasoning saves the former while killing the latter.

  **New Scenarios**

  (a) Appoint the leader commanding confidence, not merely the largest party. This ensures governance reflects the house's will (Case 6 logic).
  (b) Refuse dissolution if an alternative government is viable; grant it if no majority exists. This prevents avoiding accountability (Case 5 logic).
  (c) Yes, refuse on process grounds. Procedural integrity is distinct from policy content; a non-quorate vote is void ab initio, not a policy veto. This aligns with Systemic Protection.

  **Norwegian vs. British**

  The Norwegian suspensive veto is superior. It allows the Head of State to pause for reflection (protecting against Case 4) without imposing a permanent will (resolving Case 2). It formalizes the "invite correction" principle by forcing successive parliaments to reaffirm the law, balancing ceremonial caution with democratic supremacy. The British convention risks Case 4 by offering no pause; the Norwegian model offers a cooling-off period that respects the finality of repeated democratic will.
