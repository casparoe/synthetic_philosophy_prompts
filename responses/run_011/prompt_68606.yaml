      *   *Key Insight:* The "Uncertainty" on the shoulder is crucial. If it's 10% chance of a person, is it permissible to risk them to save the van people?
      *   *Foot:* Negative duty not to risk killing the innocent bystander on the shoulder is strong.
      *   *Thomson:* But you are also driving a 40-ton vehicle. You have a duty to drive safely. The "hold line" is a policy choice.

      *   *The "Authored Behavior" Pivot:* This is the user's best point.
      *   Thomson: "You didn't 'let' the truck hit the van. You *told* the truck to hit the van."
      *   Foot: "Is there a difference between telling a truck to hit a van and failing to tell it to swerve?"
      *   Thomson: "In code? No. `IF obstacle THEN brake` is the same as `IF obstacle THEN swerve`. Both are instructions."

  7.  **Finalizing the Dialogue Structure:**
      *   **Intro:** Set the scene. Acknowledge the gravity.
      *   **Round 1: The Trolley Analogy.** Is this actually a trolley problem?
      *   **Round 2: The Authored Default.** The core of the user's insight. Does "inaction" exist in code?
      *   **Round 3: Uncertainty & Rights.** The shoulder object.
      *   **Round 4: The Regulatory Frame.** Minimizing fatalities vs. Negative Duties.
      *   **Conclusion:** Where they land. Thomson likely finds the "doing/allowing" distinction collapses in AV design. Foot tries to preserve it but admits the *design phase* shifts the burden.

  8.  **Review against Constraints:**
      *   No reading list? Check.
