answer: |-
  The conference room is cold. On the whiteboard, someone has drawn the decision tree: `IF lane_blocked THEN [swerve | hold]`. Below it, the liability matrix. Below that, the proposed state regulation: *Minimize Expected Fatalities.*

  Philippa Foot sits with her hands folded, watching the marker ink dry. Judith Jarvis Thomson is pacing, tapping a pen against her palm. You are the engineer in the corner.

  **Foot:** Let's clear the air. Everyone wants to call this a Trolley Problem. It isn't. Not exactly. In the original case, the trolley is a runaway force. The driver is a bystander to the mechanism, intervening only at the switch. Here, the truck *is* the trolley, but you are not the bystander. You are the manufacturer. You are the driver. And you are the legislature writing the rule for the switch.

  **Thomson:** (Stops pacing) That's where I want to start. Philippa, you built your reputation on the distinction between *doing* and *allowing*. Negative duties—not to kill—are stricter than positive duties—to save. The lawyers in this room are banking on that. They say, "If we hold the line, we are allowing the van's accident to conclude. If we swerve, we are killing the person on the shoulder." They think the moral math favors passivity.

  **Foot:** The moral math often does. I have always maintained that I owe you a duty not to run you over that is stronger than my duty to drive you to the hospital when you are sick. If the truck swerves onto the shoulder and kills a pedestrian, the truck has *initiated* a lethal sequence against a person who was otherwise safe. If the truck holds the line, the lethal sequence was initiated by the van driver spinning out. The truck is merely failing to interrupt it.

  **Thomson:** But that's the confusion. That's the exact confusion the engineer is pointing at. In 1967, "doing nothing" meant physical inertia. You stood still. Here, "doing nothing" is a line of code. `IF obstacle_detected THEN maintain_trajectory`. That is not inertia. That is a command. It is an affirmative instruction to the braking and steering actuators to *not* deviate.

  **Foot:** Is it? There is a difference between commanding a stop and commanding a continuation.

  **Thomson:** Is there? In a closed-loop control system? The truck is constantly actuating to maintain the lane. It is burning fuel, adjusting torque, fighting friction. To "hold the line" requires active energy expenditure. It is a *doing*. If you write the code to hold the line when a human is detectable on the shoulder, you have not "allowed" a death. You have chosen a victim.

  **Foot:** (Leans forward) You're collapsing the distinction too quickly, Judith. Even if the code is active, the *moral source of the threat* matters. The van created the emergency. The van occupants put themselves in the path. The shoulder occupant—if there is one—is a bystander. If I swerve, I make the shoulder occupant part of the crash. I use them. If I hold, the van occupants are already in the crash. I am not using the shoulder person to save the van people; I am refusing to risk the shoulder person to save the van people. That is a negative duty. I must not kill the innocent bystander.

  **Thomson:** But the bystander is uncertain. The lidar says "something." Probability 0.4 it's a person. Probability 0.6 it's debris. The van has four people. Certainty of death if you hold.
  Now, look at the regulation. "Minimize expected fatalities." That's utilitarian calculus. 4 lives vs. 0.4 lives. The regulation says swerve. Your negative duty says hold. The lawyers say hold because they fear the lawsuit for *swerving*.
  My point is this: The "doing/allowing" distinction works when nature takes its course. It doesn't work when you *engineered the course*. You sat in a room months ago and decided that when the sensor confidence is below 80%, the truck prioritizes lane discipline over obstacle avoidance. That is a policy. You cannot hide behind "inaction" when the inaction is a designed feature.

  **Foot:** I grant you that the *design phase* changes things. When you write the code, you are not in the 200-millisecond emergency. You are in a calm room. You have time to think. At that moment, you are not "allowing" anything. You are setting a rule.
  So the question shifts. Is the rule "Never swerve into uncertain obstacles" a morally permissible rule?
  I think it might be. Because if you adopt the rule "Swerve to minimize expected fatalities," you turn every truck into a roving executioner. You tell the public: "If our sensors guess there are fewer people on the shoulder than in the lane, we will drive into the shoulder." That undermines the security of the person. The person on the shoulder has a right not to be targeted by the truck's algorithm, even for a good cause.

  **Thomson:** A right not to be targeted? But the person in the van has a right not to be crushed. Why does the shoulder person's right trump the van person's right? Because the van person is "in the lane"? That's a traffic rule, not a moral right.
  Here is where I think your framing, Engineer, is vital. You said the legal incentives favor passivity because you get sued for what your product *does*.
  If the law treats "coded inaction" as "allowing," the law is lying. And if the law is lying, your moral reasoning based on the law is corrupted.
  If I program a robot to stand still while a child drowns, have I *allowed* the child to drown, or have I *killed* the child by deploying a robot that refuses to act?
  I say the latter. If the truck is capable of swerving, and you disable that capability in this scenario, you are killing the van occupants. You are not saving the shoulder person; you are sacrificing the van occupants to avoid the *risk* of killing the shoulder person.

  **Foot:** But risk is the key. If the shoulder object is a person, swerving kills them. If it is debris, swerving saves everyone.
  If you hold, the van people die.
  If you swerve, the van people live, but you risk the shoulder person.
  This looks like a duty of non-maleficence versus a duty of beneficence. But it's messier. It's a duty not to inflict harm versus a duty to prevent harm.
  I worry about the regulation. "Minimize expected fatalities." That requires the truck to assign probabilities to human life. It requires the truck to decide that 4 lives are worth risking 1 life at 40% probability. That makes the truck a utilitarian calculator. I have always been skeptical that we can reduce rights to numbers. The shoulder person has a right not to be used as a means to save the van people.

  **Thomson:** But the van people aren't using the shoulder person. *You* are. The company is. The state is.
  Let's look at the "confused framing" question. You asked who thinks the setup is confused.
  I do.
  The setup assumes there is a default. "Hold the line" is treated as the baseline, the neutral option. "Swerve" is the intervention.
  But in an autonomous system, there is no neutral. There is only Policy A and Policy B.
  Policy A: Prioritize Lane Integrity.
  Policy B: Prioritize Obstacle Avoidance.
  When you call Policy A "inaction," you are smuggling in a moral judgment that the lane is the "natural" state. It isn't. It's a painted strip of asphalt.
  If you admit there is no "inaction," then the doing/allowing distinction collapses. And if it collapses, Philippa, your negative duty argument loses its grip. You can't say "I didn't kill them, I just didn't save them" if "not saving them" was a positive command in your source code.

  **Foot:** I resist that collapse. Even if both are coded, there is a causal difference.
  In Policy A (Hold), the cause of death is the van's position + the truck's momentum. The truck refuses to *add* a new causal vector.
  In Policy B (Swerve), the truck *adds* a new causal vector toward the shoulder.
  The moral significance is: Do I introduce a new threat?
  If the shoulder is empty, I introduce no threat. If the shoulder has a person, I introduce a threat to them that did not exist before. The van was not going to hit the shoulder person. The truck *would* hit the shoulder person only because the truck chose to go there.
  So, even if it is coded, the *structure of the harm* is different. In one case, I fail to stop a threat originating elsewhere (the van's spin). In the other, I originate a threat to a new party.
  I think the distinction survives the code. The code is just the mechanism of the will. The will is either to intervene or not.

  **Thomson:** But the "threat originating elsewhere" is hitting *you*. The truck.
  If I am driving a normal car, and a van spins out, and I swerve and hit a pedestrian, I am liable. If I hit the van, I am liable.
  The lawyers say: Hit the van. Why? Because the van is the "aggressor" in the traffic sense.
  But morally?
  Here is my worry: If we accept the regulation—"Minimize Expected Fatalities"—we give the truck a license to kill based on statistics.
  Suppose the shoulder has a 10% chance of having a child. The van has 1 adult. Expected value says swerve.
  Does the child on the shoulder lose their right to life because the probability is low?
  I think the framing is confused because it treats the truck as a moral agent. It isn't. It's a tool. The moral agent is the company.
  The company is saying: "We prefer to be sued for hitting a van than for hitting a shoulder." That's not morality. That's risk management.
  And you, Engineer, are being asked to sign off on risk management as if it were ethics.

  **Foot:** But the state regulation tries to fix that. It says: Ignore the liability. Minimize deaths.
  I think *that* is incoherent. You cannot command a moral agent (or a proxy) to violate negative duties for the sake of aggregate good.
  If the shoulder person is there, and you hit them, you violated their right. You cannot say, "But I saved four others."
  So, I would tell the engineer: The regulation is asking you to do something impermissible. It is asking you to authorize the truck to violate the rights of the shoulder bystander whenever the math works out.
  The lawyers are wrong to rely on liability, but they might be right about the outcome. Hold the line. Do not make the truck an active killer of bystanders.

  **Thomson:** And I say: You are already an active killer.
  If you know that "Hold the Line" kills 400 people a year across the fleet, and "Swerve" kills 100 people (including shoulder risks), and you choose "Hold," you have chosen the 400 deaths.
  You cannot wash your hands of the 400 by saying "The van killed them." The van spun out, yes. But the truck *could have avoided it*.
  The "Doing/Allowing" distinction is a shield for the cowardly.
  In this specific case, with the uncertainty? That's the hard bit.
  If the lidar cannot classify, you don't know if there is a right-holder on the shoulder.
  If you swerve, you risk violating a right.
  If you hold, you violate the rights of the van occupants (to not be hit by a truck that could have swerved).
  Who has the stronger claim?
  The van occupants are in the lane. They are where they shouldn't be (spun out). The shoulder is for emergencies.
  Actually, wait. The van spun out. They are victims of their own accident.
  The shoulder person is innocent.
  I am torn. But I am less torn about the "inaction" lie.
  Engineer, if you sign off on "Hold," do not write in your report "We chose to allow harm." Write "We chose to inflict harm on the van occupants to avoid risking harm on the shoulder."
  Be honest about the trade-off.

  **Foot:** But that honesty reveals the utilitarianism Judith. "Inflict harm on A to avoid risking harm on B."
  If B is a probability and A is a certainty...
  I think the confusion lies in the *time*.
  You, Engineer, are making the decision *now*, in the design phase.
  At this moment, the van does not exist. The shoulder does not exist.
  You are writing a rule for *any* van and *any* shoulder.
  You are saying: "In all cases of uncertainty, we prioritize lane integrity."
  That is a general rule. General rules can be justified by rights. "Drivers have a right to expect trucks to stay in lanes."
  If the truck starts swerving into uncertain shoulders, it makes the shoulder unsafe for everyone. It creates a new public danger.
  So, perhaps the "Hold" policy is defensible, not because of "inaction," but because of a *general duty to maintain predictable behavior*.
  Unpredictable swerving kills more people in the long run.

  **Thomson:** Now we're talking. That's not "doing vs. allowing." That's "Rule Utilitarianism" vs. "Act Utilitarianism," or perhaps a Kantian duty of predictability.
  If the argument is "We hold the line to maintain public trust in lane discipline," I can accept that.
  But do not tell me it's because "holding is not acting."
  And do not tell me the regulation is coherent if it demands fatality minimization without regard for rights.
  If the regulation says "Kill the bystander if it saves the driver," the regulation is immoral.
  But if the regulation says "Minimize fatalities *subject to constraints of rights*," that's different.
  The problem is, the state authority hasn't thought about the uncertainty.
  If the sensor says "50% human," does the truck treat it as a human?
  If yes, you never swerve.
  If no, you swerve too much.

  **Foot:** So we agree on this: The "inaction" defense is a legal fiction that corrupts the moral reasoning.
  The choice is between two active policies.
  Policy 1: Protect the Bystander (Shoulder) at the cost of the Lane Occupants.
  Policy 2: Protect the Lane Integrity at the cost of the Lane Occupants (when blocked).
  Wait, no. Policy 2 protects the Bystander by not hitting them.
  So it is: Protect the Bystander vs. Save the Lane Occupants.
  My view: The negative duty to the Bystander wins. You cannot kill the bystander to save the lane occupants.
  Even if the bystander is uncertain?
  If there is a significant probability, the negative duty holds. You cannot gamble with a life you don't own.

  **Thomson:** And I say: You are gambling with the lane occupants' lives too.
  By holding, you gamble that the shoulder has a person.
  By swerving, you gamble that the shoulder has a person.
  It's a risk-risk tradeoff.
  The "Doing/Allowing" distinction is useless here because both options carry risk of death caused by the truck's policy.
  The only coherent question is: Which risk is acceptable to impose on the public?
  Is it acceptable to tell the public: "Our trucks will swerve into uncertain shoulders"?
  Or: "Our trucks will plow into blocked lanes"?
  I suspect the public prefers the plow. They don't want trucks swerving at them on the shoulder.
  So, ironically, the lawyers' preference (Hold) might align with public rights, but for the wrong reason.
  They say "Hold to avoid liability."
  I say "Hold to respect the shoulder's status as a place of safety."

  **Foot:** Then we are closer than we thought.
  The framing is confused because it treats the 200ms decision as the moral locus. It isn't.
  The moral locus is the policy meeting where you decided the risk threshold.
  If you decide `P(person) > 0.5 THEN swerve`, you have made a moral choice.
  If you decide `ALWAYS hold`, you have made a moral choice.
  The "inaction" label is a lie.
  But, I maintain, the *content* of the choice matters.
  Choosing to hit the van is choosing to hit a threat source.
  Choosing to hit the shoulder is choosing to hit a potential safe zone.
  There is a moral difference in *where* you direct the force.
  Directing force into a safe zone is worse than directing force into a hazard zone.
  The lane, when blocked by a spun-out van, is a hazard zone.
  The shoulder is presumed safe.
  So, holding the line directs force into the hazard. Swerving directs force into the safe zone.
  That distinction survives the code.

  **Thomson:** I'll accept that. The "Hazard Zone" vs. "Safe Zone" distinction is better than "Doing" vs. "Allowing."
  But Engineer, listen to me.
  Do not let the lawyers write the ethics.
  If the rule is "Minimize Fatalities," and you follow it blindly, you become a murderer of statistics.
  If the rule is "Never Swerve," and you follow it blindly, you become a murderer of inevitability.
  You need to write the report that says: "We chose to prioritize the integrity of the shoulder as a safe space, accepting that this increases fatality risk in lane-blockage scenarios."
  That is honest.
  "Doing nothing" is not honest.

  **Foot:** And I would add: "We recognize that negative duties constrain our ability to maximize utility. We will not sacrifice the uncertain bystander to save the certain lane occupant."
  That is a defensible moral position.
  It is not the only one. But it is coherent.
  The regulation is not coherent if it demands utility maximization without constraint.
  The lawyers are not coherent if they claim inaction is not action.
  You are the one who has to sign.
  Sign the truth. You are choosing where the truck points its gun.

  **Thomson:** (Puts the pen down)
  Exactly. It's a gun. It's a 40-ton gun.
  You don't get to say "I didn't shoot" because you kept your finger on the trigger.
  Decide who you're willing to shoot at.
  And live with it.

  **Foot:** And ensure the rule is one you can universalize. Would you want every truck to swerve at uncertain shadows?
  If not, then hold the line.
  But call it what it is. A choice.

  **Thomson:** A choice. Not a default.

  **Foot:** Not a default.

  *(They both look at you. The whiteboard still says `IF obstacle THEN [swerve | hold]`. You pick up the marker.)*
