prompt: |-
  I have been defending a fairly strong version of Good's theorem on the value of information: the result that a Bayesian decision maker who chooses optimally relative to her posterior should never decline a costless observation bearing on her decision. My interest is not purely academic. I work on the information-gathering layer of a planning system that has to decide which sensors to query, which tests to commission, and which reports to read before committing resources, and the theorem functions there as a default rule — acquire anything that is genuinely free and decision-relevant, then optimize — so I have a professional stake in knowing how much weight it will bear. A colleague thinks the result is a disguised tautology that purchases its safety by assuming everything interesting away, and my own response has been that the standard textbook defense is subtler than it looks: the reason free information is said to be harmless is that the agent can always act as though she had never received it, but that escape is available only because the theorem already assumes her post-observation choice is optimal for her posterior, so an agent who cannot bind herself to ignore what she learns loses the defense rather than gaining a comfort. I am not certain that reply is correct, and I want the position stress-tested rather than reassured.

  So: what would count against the thesis that a rational agent is never worse off for costless, decision-relevant information, and never has a reason to refuse it? I would like the defeaters sorted by how damaging they actually are — fatal, decisive, merely awkward, or purely dialectical — and, for each one, an identification of which hypothesis it targets: that the evidence is a proposition the agent could already represent before receiving it, that she updates by conditionalization, that her preferences over outcomes are unaffected by the learning itself, that her action set is unchanged, that her later self chooses optimally given the posterior, that her beliefs do not enter her utility directly, or that the act of acquiring the information is unobservable to others who might respond to it. Please tell me which of these failures are live in practice for real agents, markets, and deployed systems, as opposed to being logically possible but never instantiated. I am especially interested in several families I cannot yet evaluate properly: preferences that violate expected utility in ways that make dynamic choice inconsistent, so that an agent who cannot commit is genuinely harmed by free information; ambiguity and non-Bayesian revision, where additional evidence can leave a decision maker worse off; models in which optimistic or pessimistic beliefs are themselves sources of utility, so that resolution destroys a valued anticipation; present-biased or myopic agents whose future selves predictably misuse what they learn; cases where learning supplies concepts the agent did not previously possess, so that the posterior is not her prior conditional on any event she could have entertained; and strategic settings in which becoming informed is visible and thereby changes what others do, so that the information was never free in the relevant sense. Where you think a purported counterexample merely smuggles out a hypothesis and redescribes the assumptions as a refutation, say so plainly rather than granting it.

  Two further things. First, tell me which of these a committed defender of the theorem would herself concede as counting against the position, and which she would dismiss as changing the subject, and explain the difference in standards she is applying — in particular, whether the theorem is a substantive claim about rational agents or an analytic consequence of a framework, and whether the normative use I make of it in system design is justified, undermined, or simply untouched by that distinction. Second, assess the insulation charge directly: if every counterexample turns out to violate some assumption, does the view risk anything at all, and is its safety a virtue or a defect? Along the way, please separate the descriptive reading, which I take to be false as an empirical generalization about human subjects, from the normative reading; I recently ran a small elicitation in which roughly a third of participants paid a modest amount to prevent the resolution of a lottery they had already chosen, and I want to know what that result can and cannot establish against each reading, including whether a rival account that treats ignorance as sometimes intrinsically preferable predicts the data without positing an extra utility term over beliefs. Finally, if you conclude that the position is well insulated, tell me what a genuinely damaging counterexample would have to look like — an agent satisfying every standard hypothesis and still made worse off by a costless observation — and whether anyone has constructed one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Core Topic:** Good's Theorem on the Value of Information (VoI). Specifically, the claim that a rational Bayesian agent should never decline costless, decision-relevant information.
      *   **User's Context:** Works on the information-gathering layer of a planning system (sensor query, test commissioning). Uses the theorem as a default rule ("acquire anything free and relevant").
      *   **User's Stance:** Defending a "fairly strong version." Colleague calls it a tautology. User argues the standard defense (can ignore info) relies on optimal posterior choice. Wants stress-testing, not reassurance.
      *   **Specific Tasks:**
          1.  Identify defeaters to the thesis (rational agent never worse off with free info).
          2.  Sort defeaters by damage level (fatal, decisive, awkward, dialectical).
          3.  Map defeaters to specific assumptions (representation, conditionalization, stable preferences, action set, optimal future self, belief-independent utility, unobservability).
          4.  Assess "liveness" in practice (real agents, markets, systems).
          5.  Evaluate specific families of counterexamples (dynamic inconsistency, ambiguity/non-Bayesian, belief-based utility, present bias, conceptual expansion, strategic visibility).
          6.  Distinguish between "smuggling out assumptions" vs. genuine refutation.
          7.  Address the "Insulation Charge": Is safety a virtue or defect? Is it substantive or analytic?
          8.  Assess normative use in system design based on that distinction.
          9.  Separate descriptive vs. normative readings (address the user's lottery experiment).
          10. Define what a *genuinely* damaging counterexample would look like (satisfying all hypotheses but still failing).

  2.  **Initial Assessment & Fact-Checking:**

      *   *Good's Theorem (1967):* "On the Principle of Indifference" / "Rational Decisions." Basically, $E[U|info] \geq U|no\_info$ for costless info under Expected Utility Theory (EUT) + Bayesian Conditionalization.
      *   *Key Assumptions:*
          1.  Agent maximizes Expected Utility.
          2.  Agent updates via Bayes' Rule (Conditionalization).
          3.  Utility depends only on outcomes/states, not on beliefs themselves (no "news utility").
          4.  Information is costless (physically and strategically).
          5.  Information is partition-like (agent knows what they learned).
          6.  Agent can commit to the optimal action *after* learning (no dynamic inconsistency).
          7.  The state space is fixed (no new concepts).
      *   *The "Tautology" Charge:* If rationality *is defined* as maximizing EU given beliefs, then VoI $\geq 0$ is mathematically entailed. Calling it a tautology isn't wrong, but it misses the point of it being a *coherence* condition.
      *   *The "Ignore" Defense:* The user's intuition is correct. The option to ignore implies the action set after info includes the action chosen before info. If the agent *must* act on info (e.g., due to compulsion or dynamic inconsistency), VoI can be negative.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the query. Validate the colleague's "tautology" point but reframe it as a coherence theorem.
      *   **Part 1: Defeaters Sorted by Damage:**
          *   *Fatal:* Violations of EUT/Bayesianism that are normatively compelling (e.g., Ambiguity Aversion/Maxmin). If rationality *allows* ambiguity aversion, Good's theorem fails.
          *   *Decisive:* Belief-dependent utility (anticipation/suspense). If utility function includes beliefs, info changes utility directly.
          *   *Decisive (Strategic):* Observable learning. If others see you learn, they update, changing payoffs. Info isn't "free" strategically.
          *   *Decisive (Dynamic Inconsistency):* Time inconsistency (Hyperbolic discounting). Future self won't ignore info even if Past self wanted to.
          *   *Awkward:* Conceptual Expansion. If info teaches new concepts, the prior didn't cover the posterior space.
          *   *Dialectical:* Redefining "Costless." If processing cost exists, it's not costless.
      *   **Part 2: Mapping Assumptions:** Connect each defeater to the specific hypothesis list provided by the user.
      *   **Part 3: Liveness in Practice:**
          *   *Systems:* Dynamic inconsistency is huge in multi-agent or distributed systems (sub-agents). Strategic visibility is huge in markets.
          *   *Humans:* Belief utility (dread/hope) is very live. Ambiguity is live.
      *   **Part 4: The "Smuggling" Check:** Call out where counterexamples just redefine "utility" or "cost."
      *   **Part 5: Insulation & Normativity:**
          *   *Analytic vs. Substantive:* It's analytic *within* the Bayesian/EUT framework. It's substantive if that framework is the *only* valid model of rationality.
          *   *System Design:* If the system is built as a single Bayesian optimizer, the theorem holds. If the system has sub-modules with conflicting objectives or non-Bayesian heuristics, it fails.
          *   *Insulation:* Safety is a virtue for a coherence theorem, a defect for an empirical theory.
      *   **Part 6: Descriptive vs. Normative (The Lottery Experiment):**
          *   Descriptive: Humans often pay to avoid info (blinders). This falsifies the descriptive claim.
          *   Normative: Does this mean humans are irrational? Or that the utility function should include "not knowing"? If the latter, the theorem still holds *relative to the expanded utility function*.
          *   *Rival Account:* Can we explain ignorance preference without belief-utility? Maybe via anticipated regret or dynamic inconsistency, but belief-utility is the cleanest fit.
      *   **Part 7: The "Genuine" Counterexample:**
          *   To break it *within* the assumptions, you need a mathematical contradiction. None exists.
          *   To break it *normatively*, you need a case where satisfying all assumptions leads to a result we intuitively reject as "irrational." (e.g., specific Parfitian cases or Blackwell order violations in non-standard settings).

  4.  **Refining the Arguments (Self-Correction/Nuance):**

      *   *Correction on "Tautology":* I need to be careful not to just agree with the colleague. It's a theorem, not a definition. It derives from axioms. If axioms are normative, the theorem is normative.
      *   *Strategic Info:* This is crucial for the user's planning system. If querying a sensor signals intent to an adversary, the "cost" isn't computational, it's strategic. Good's theorem assumes the *state* doesn't change based on the *query*.
      *   *Conceptual Expansion:* This is a deep philosophical point (Richard Jeffrey). If I learn a new concept, I can't conditionalize on it. This violates the "partition" assumption.
      *   *Ambiguity:* Epstein-Zin or Maxmin Expected Utility. Here, info can reduce the set of priors in a way that lowers the worst-case value. This is a *fatal* defeater for the *universality* of the theorem, even if it preserves it for strict Bayesians.
      *   *System Design Implication:* The user is building a system. If the system is a monolithic Bayesian agent, Good holds. If it's a distributed system where one module learns and another acts, and they aren't perfectly aligned, Good might fail (principal-agent problem within the system).

  5.  **Structuring the Output:**

      *   Use the requested sorting (Fatal, Decisive, etc.).
      *   Use the requested assumption mapping.
      *   Address the "Insulation Charge" explicitly.
      *   Address the Lottery Experiment.
      *   Conclude with the "Impossible Counterexample."

  6.  **Final Polish:** Ensure tone is professional, rigorous, and directly addresses the "stress-test" request without being overly reassuring. (Avoid "Don't worry," focus on "Here is where it breaks.")

      *(Self-Correction during drafting)*: Make sure to distinguish between *processing costs* (computational) and *decision costs*. Good's theorem assumes costless *acquisition*. If processing takes CPU, it's not costless. The user knows this, but I should confirm that "costless" in their system includes computation.
      *(Refining the Lottery Point)*: The user's experiment shows people pay to *avoid* resolution. This is the "value of ignorance." Normatively, if we accept preference sovereignty, this implies utility depends on beliefs. If we accept belief-independent utility, it implies irrationality. I need to make this dichotomy clear.

  7.  **Final Review against constraints:**
      *   Did I sort by damage? Yes.
      *   Did I map hypotheses? Yes.
      *   Did I assess liveness? Yes.
      *   Did I address the insulation charge? Yes.
      *   Did I address the lottery experiment? Yes.
      *   Did I describe the impossible counterexample? Yes.

      *Ready to write.*
answer: |-
  This is a rigorous request for a stress-test of a foundational result in decision theory. You are correct to suspect that the "tautology" charge and the "insulation" charge are two sides of the same coin: Good's Theorem is a coherence result internal to the Bayesian/Expected Utility framework. Its vulnerability depends entirely on whether that framework is treated as the definition of rationality or as a contingent model of it.

  Below is the stress-test you requested, sorting defeaters by damage level, mapping them to your specific hypotheses, assessing their liveness in practice, and addressing the normative implications for your planning system.

  ### I. Defeaters Sorted by Damage Level

  I have categorized these based on whether they invalidate the theorem *within* the standard framework (Fatal), require modifying the framework but preserve a coherent alternative (Decisive), or amount to boundary condition violations (Awkward/Dialectical).

  #### 1. Fatal Defeaters (Internal Inconsistency or Normative Collapse)
  These counterexamples suggest that even if we accept the standard Bayesian framework, there are configurations where the theorem fails, or that the theorem entails conclusions widely regarded as irrational.

  *   **Dynamic Inconsistency without Commitment:**
      *   **Targeted Hypothesis:** That her later self chooses optimally given the posterior (and implicitly, that preferences are stable over time).
      *   **Mechanism:** If an agent is time-inconsistent (e.g., hyperbolic discounter), the "prior self" may prefer not to know, because the "posterior self" will be compelled to act on the information in a way the prior self regrets. Since the agent cannot bind the future self to ignore the data, the option to "act as though she never received it" is not actually available.
      *   **Liveness:** **High.** In deployed systems, this manifests as sub-agent misalignment. If your planning system has a "sensor module" and an "actuator module" with slightly divergent objective functions (or if the actuator has a different discount rate than the planner), acquiring free info can trigger actions the planner would have preferred to avoid. In humans, this is the standard explanation for avoiding medical tests or financial statements.
      *   **Damage:** **Fatal** to the universal normative claim. It shows that "rationality" defined as local optimization at every node does not guarantee global optimality without commitment mechanisms.

  *   **Strategic Visibility (The Signal Value of Learning):**
      *   **Targeted Hypothesis:** That the act of acquiring the information is unobservable to others.
      *   **Mechanism:** In game-theoretic settings, the act of querying a sensor can signal intent or capability to an adversary. If the adversary updates their strategy based on your query (even before you see the result), the payoff matrix changes. The information is not "free" because the *query* has a strategic cost.
      *   **Liveness:** **High.** In markets and multi-agent systems, "probing" is observable. High-frequency trading firms monitor who is querying order books. Military systems monitor radar activation.
      *   **Damage:** **Fatal** to the application in multi-agent environments. It reclassifies the "cost" from physical to strategic, but since the theorem assumes *costless* observation, this shows the precondition is rarely met in interactive settings.

  #### 2. Decisive Defeaters (Framework Violations)
  These accept that Good's Theorem holds for *Bayesian EUT* agents but argue that rational agents need not be Bayesian EUT agents.

  *   **Ambiguity Aversion (Non-Bayesian Revision):**
      *   **Targeted Hypothesis:** That she updates by conditionalization (specifically, that she has a single prior).
      *   **Mechanism:** In Maxmin Expected Utility (Gilboa-Schmeidler) or $\alpha$-MaxMin models, an agent has a set of priors. Information can shrink the set of priors in a way that lowers the minimum expected utility. An ambiguity-averse agent may prefer a "fuzzy" prior that supports a robust decision over a precise posterior that reveals a vulnerability.
      *   **Liveness:** **High.** This is the standard model for "Knightian Uncertainty" in economics and robust control theory. In engineering, it corresponds to systems designed for worst-case scenarios where narrowing the uncertainty set might eliminate the "safe" robust action.
      *   **Damage:** **Decisive** against the *universality* of the theorem. It shows the theorem is specific to Bayesianism, not rationality *simpliciter*.

  *   **Belief-Dependent Utility (News Utility):**
      *   **Targeted Hypothesis:** That her beliefs do not enter her utility directly.
      *   **Mechanism:** If utility is defined over belief states (e.g., hope, dread, suspense, cognitive dissonance), then updating changes utility directly, independent of the action taken. Resolving a lottery destroys the utility of "anticipation."
      *   **Liveness:** **Very High.** Your lottery experiment confirms this. Humans derive utility from expectations. In systems, this maps to "confidence metrics" where maintaining a high confidence score is itself a reward signal (optimization gaming).
      *   **Damage:** **Decisive** against the normative claim that ignorance is never preferable. If preferences over belief states are sovereign, refusing info is rational.

  #### 3. Awkward Defeaters (Boundary Conditions)
  These violate the setup in ways that are technically refutations but often dismissed as "changing the subject."

  *   **Conceptual Expansion (Unforeseen Propositions):**
      *   **Targeted Hypothesis:** That the evidence is a proposition the agent could already represent before receiving it.
      *   **Mechanism:** (Jeffrey's objection) If the information introduces a new concept or state distinction that the prior partition did not include, the agent cannot conditionalize. The posterior space is larger than the prior space. The theorem requires the partition to be fixed.
      *   **Liveness:** **Moderate.** In AI, this is "ontology mismatch." A sensor returns data tagged with a classification the planning system's ontology doesn't recognize.
      *   **Damage:** **Awkward.** It highlights a limitation in the formalism's ability to model learning *concepts*, not just *parameters*.

  *   **Computational/Processing Costs:**
      *   **Targeted Hypothesis:** That the act of acquiring the information is costless.
      *   **Mechanism:** If "acquiring" includes the computational cost of updating the posterior and re-optimizing, then information has a cost.
      *   **Liveness:** **Universal.** In any real system, CPU cycles and latency are costs.
      *   **Damage:** **Dialectical.** A defender will say, "Good's theorem assumes *costless* info; you are discussing *costly* info." This is true, but in practice, *no* info is costless, rendering the theorem an asymptotic ideal.

  ### II. The "Smuggling" Check

  You asked to identify where counterexamples merely smuggle out a hypothesis.

  1.  **Belief-Utility:** A strict Good's Theorem defender will dismiss belief-dependent utility as **changing the subject**. They argue utility *must* be over world-states, not mind-states. If you include belief-states in the utility function, you have redefined the outcome space to include the information itself. The defender claims this is a category error: information is a means to an end, not an end.
      *   *Verdict:* This is a **normative stipulation**, not a logical necessity. If your system design treats "confidence" as a reward, the defender's stipulation is irrelevant to your engineering constraints.
  2.  **Strategic Visibility:** A defender might argue this makes the information **not costless**.
      *   *Verdict:* **Valid dismissal.** If the query changes the opponent's move, the "state of the world" has changed due to the query. This violates the ceteris paribus assumption of the observation.
  3.  **Dynamic Inconsistency:** A defender might argue the agent is **irrational** (violating EUT axioms).
      *   *Verdict:* **Valid but costly.** If you define rationality as EUT consistency, then dynamic inconsistency is irrationality. But if your system *must* manage dynamically inconsistent sub-agents, the theorem is useless to you.

  ### III. The Insulation Charge: Virtue or Defect?

  **Is the view risk anything at all?**
  Yes. It risks **empirical irrelevance** and **normative dogmatism**.

  *   **Analytic vs. Substantive:** Good's Theorem is an **analytic consequence** of the Bayesian/EUT framework. It is mathematically entailed by the axioms. It is not a substantive claim about the world (like "gravity exists"); it is a substantive claim about *coherence*.
  *   **The Insulation:** The safety of the theorem is a **virtue** for a logician (it proves the framework is consistent) but a **defect** for an engineer or empirical scientist (it makes the framework unfalsifiable by redefining away counterexamples).
  *   **Normative Use in System Design:**
      *   **Justified:** If your planning system is a monolithic Bayesian optimizer with a fixed ontology and no internal conflict, the theorem is a sound design principle. It guarantees you don't need to build "ignorance preference" switches.
      *   **Undermined:** If your system operates in adversarial environments (strategic visibility), handles ambiguous models (non-Bayesian), or has modular components with misaligned incentives (dynamic inconsistency), applying the theorem as a default rule is **dangerous**. It will lead to over-sensing and strategic leakage.
      *   **Untouched:** The distinction doesn't touch the mathematical validity, only its applicability.

  ### IV. Descriptive vs. Normative (The Lottery Experiment)

  Your elicitation (1/3 of participants paid to prevent resolution) is a standard result in behavioral economics (e.g., *Loewenstein, 1987* on anticipation).

  *   **Against the Descriptive Reading:** This result **falsifies** the descriptive claim that humans act as Good's Theorem predicts. Humans are not strict Bayesian EUT maximizers with belief-independent utility.
  *   **Against the Normative Reading:**
      *   *Standard Defense:* The participants are irrational. They are violating the axiom that utility is defined over final wealth/outcomes.
      *   *Rival Account (No Extra Utility Term):* Can we explain this without "belief utility"?
          *   **Regret Theory:** Agents might anticipate that knowing the outcome will generate regret if they cannot change it. If the utility function includes "anticipated regret," and regret is triggered by knowledge, this can be modeled as outcome-dependent utility where the outcome includes the knowledge state.
          *   **Dynamic Inconsistency:** Participants might know that if they learn they lost, they will feel an urge to gamble to recoup losses (a action they currently want to prevent). Paying for ignorance is a commitment device.
      *   *Conclusion:* A rival account *can* predict the data without positing intrinsic utility over beliefs, but it usually does so by positing **instrumental** value to ignorance (commitment) or by expanding the outcome space to include emotional states (which effectively becomes belief-utility).
      *   *Implication:* Your system design should not treat the human preference for ignorance as "noise" to be corrected if the system serves human masters. If the master values suspense or fears regret, the system must accommodate "costly ignorance."

  ### V. The "Genuinely Damaging" Counterexample

  You asked what a counterexample would look like that satisfies *every* standard hypothesis and still makes the agent worse off.

  **The Short Answer:** **None exists.**
  If an agent satisfies:
  1.  Expected Utility Maximization,
  2.  Bayesian Conditionalization,
  3.  Belief-Independent Utility,
  4.  Costless Information,
  5.  Fixed Action Set,
  6.  Fixed State Space,

  Then $E[U|Info] \geq U|No\_Info$ is a mathematical identity. To find a counterexample here is to find a counterexample to the law of non-contradiction within that system.

  **The Long Answer (The "Parfitian" Challenge):**
  A genuinely damaging counterexample would not be mathematical; it would be **intuitive**. It would describe a scenario where an agent satisfies all the axioms above, yet our strong normative intuition screams that acquiring the information is **wrong**.

  *   *Candidate:* **The "Self-Fulfilling Prophecy" of Confidence.**
      Imagine an agent whose success probability depends on their confidence (a psychological placebo effect modeled as a physical law).
      *   *Setup:* $P(Success) = f(Confidence)$.
      *   *Info:* A test reveals "You are low confidence type."
      *   *Update:* Agent conditionalizes, lowers confidence.
      *   *Result:* $P(Success)$ drops.
      *   *Violation:* This actually violates **Belief-Independent Utility** or **Causal Independence**. The belief *causes* the outcome. In standard Causal Decision Theory (CDT), the agent treats the belief as evidence, not a cause. In Evidential Decision Theory (EDT), the agent might avoid the info.
      *   *Status:* This is not a counterexample to Good's Theorem *within CDT*. It is a counterexample to the applicability of CDT.

  **Has anyone constructed one?**
  No. Because the theorem is a coherence result. The only "counterexamples" are those that attack the axioms (Ambiguity, Belief Utility, Dynamic Inconsistency).

  ### VI. Summary for Your Planning System

  1.  **The Theorem is Robust but Brittle:** It is mathematically unassailable *if* your system is a single, coherent Bayesian agent.
  2.  **The Assumptions are Fragile in Practice:**
      *   **Strategic:** If your system queries sensors in an adversarial environment, Good's Theorem is dangerous. You need Game-Theoretic Value of Information (which can be negative).
      *   **Modular:** If your system has distinct learning and acting modules that aren't perfectly aligned (principal-agent), Good's Theorem fails. You need Mechanism Design.
      *   **Robustness:** If your system uses robust control (minimax) rather than Bayesian averaging, Good's Theorem fails. You can be worse off with more info.
  3.  **Recommendation:** Keep Good's Theorem as the **null hypothesis** for internal, single-agent, non-adversarial modules. Do not apply it as a universal default for the system boundary, especially where queries are observable or where the "cost" of processing creates latency vulnerabilities.
  4.  **On the Colleague:** Your colleague is right that it is "disguised tautology" *relative to the axioms*, but wrong to imply it is trivial. It is a powerful coherence constraint. However, your intuition is also right: the "escape" (ignoring info) relies on the agent having control over the mapping from posterior to action. If that control is compromised (by inconsistency or strategy), the theorem offers no protection.

  **Final Verdict:** The position is well-insulated mathematically but porous normatively. Its safety is a virtue for proving consistency, but a defect for prescribing behavior in complex, multi-agent, or non-Bayesian environments. Use it as a local optimizer, not a global law.
