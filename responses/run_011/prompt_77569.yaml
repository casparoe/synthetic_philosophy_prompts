      *   *Self-Correction on JSON:* Ensure strict validity. Check keys: `features`, `overall`. Inside `features`: `feature`, `presupposes`, `rules_out`, `status`, `conflicts_with`, `revised_practice`.
      *   *Refining `status`:* Be precise. Is it *strictly_required*? Or *conflicts_with_another_feature*? The feedback loop definitely conflicts with the statistical requirement for independence.
      *   *Refining `overall`:* `coherent` should probably be "partly" or "no" given the independence tension. `biggest_problem` needs to be punchy. `what_it_really_tracks` should reflect social convergence, not necessarily truth.

  9.  **Final Review against Constraints:**
      *   Prose first? Yes.
      *   JSON second? Yes.
      *   Specific JSON keys? Yes.
      *   Tone check: Respectful of the "ocean chemistry" background (use analogies if helpful, but keep it epistemological).
      *   Address the "independence" point explicitly.

  10. **Final Polish:** (Mental check of the JSON structure to ensure no syntax errors like trailing commas). Ensure the `revised_practice` aligns with the "disagreement-is-information" philosophy.

