  ### Two Competing Rules

  Both rules account for all five of her previous answers, but they rely on different perceptual organizations of the letter strings.

  **Rule 1: The "Homogeneous Chunk" Rule**
  *   **Logic:** The system scans the string from right to left to find the first contiguous block (run) of identical letters. It treats this entire block as a single object and increments every letter in that block to its successor.
