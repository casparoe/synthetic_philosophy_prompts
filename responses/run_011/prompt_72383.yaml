      *   1. The Theory of Evidence: Error Statistics & Counterfactuals.
      *   2. The Rival: The Likelihood Principle.
      *   3. The Two Halves: Error Control vs. Literature Representativeness.
      *   4. Coherence & Bayesianism: Pragmatics vs. Principles.
      *   Conclusion: RRs as a bridge between ideal statistics and real sociology.

