prompt: |-
  A number of psychology and biomedical journals now run registered-report tracks: an author submits the hypothesis, the planned sample size, and the complete analysis plan — including every exclusion rule and secondary measure — before any data are collected. Reviewers assess that Stage 1 document, and if it is accepted the journal grants an "in-principle acceptance" guaranteeing publication of the eventual paper whatever the results turn out to be, provided the authors carried out the plan and flagged any deviations. These same journals continue to ask for p-values and continue to treat the 0.05 threshold as the mark of a finding.

  What theory of evidence does the timing requirement presuppose? Why should the moment at which an analyst settled on a test, rather than the test itself, change what a body of data shows? Reconstruct the implicit account — in particular, what it assumes about facts that are not present in the data set, such as when one would have stopped collecting or how many analyses one was free to run — and identify the rival account of evidence on which those facts are simply irrelevant once the actual data and the actual model are in hand.

  Then separate the two halves of the practice: does the publication guarantee rest on the same presuppositions as the pre-registration, or on a different one about what a literature is supposed to be a sample of? Is demanding pre-registered plans while still reporting significance tests internally coherent? And distinguish what the practice strictly requires from what it merely sits comfortably with — could a thoroughly Bayesian evidential standard license pre-registration too, and if so, would either half of the institutional design become redundant under it?
reasoning: |-
  Here's a thinking process that leads to the essay above:

  1.  **Deconstruct the Prompt:**

      *   **Core Subject:** Registered Reports (RRs) in psychology/biomedicine.
      *   **Key Features:**
          1.  Pre-registration (Stage 1): Hypothesis, sample size, analysis plan submitted *before* data collection.
          2.  In-Principle Acceptance (IPA): Publication guaranteed if the plan is followed, regardless of results.
          3.  Continued use of $p$-values and the 0.05 threshold.
      *   **Questions to Answer:**
          1.  What theory of evidence does the *timing requirement* (pre-registration) presuppose?
          2.  Why should the *moment* of settling on a test matter? (Reconstruct the implicit account regarding counterfactuals like stopping rules and multiple comparisons).
          3.  Identify the *rival account* of evidence where these facts are irrelevant (Likelihood Principle).
          4.  Separate the two halves: Does the *publication guarantee* rest on the same presuppositions as pre-registration, or different ones (regarding the literature as a sample)?
          5.  Is demanding pre-registration while reporting significance tests *internally coherent*?
          6.  Distinguish strict requirements vs. comfort: Could a *Bayesian* standard license pre-registration? Would it make the institutional design redundant?

  2.  **Part 1: The Theory of Evidence Behind Pre-Registration (Frequentism/Error Statistics):**

      *   *Question:* Why does timing matter?
      *   *Concept:* The "Garden of Forking Paths" (Gelman & Loken). If I look at data, decide what to test, then test it, the error rates inflate.
      *   *Theory:* Frequentist Error Statistics (Neyman-Pearson). Evidence is defined by the long-run error properties of the procedure.
      *   *Counterfactuals:* To calculate a valid $p$-value, you need to know the "sampling distribution." This depends on the *intention* of the researcher. Did they plan to collect $N=100$? Or did they collect until $p < 0.05$? Did they plan one test or twenty?
      *   *Implicit Account:* The evidential weight of data depends on the *process* that generated it, specifically the space of possible actions the researcher *could* have taken but didn't (the counterfactuals). If the plan wasn't fixed, the $p$-value is uninterpretable because the Type I error rate is unknown.
      *   *Key Terminology:* Stopping rules, multiple comparisons, researcher degrees of freedom, Type I error control.

  3.  **Part 2: The Rival Account (The Likelihood Principle/Bayesianism):**

      *   *Question:* What theory says timing doesn't matter?
      *   *Concept:* The Likelihood Principle (Birnbaum).
      *   *Argument:* All evidence relevant to a parameter is contained in the likelihood function of the *actual* data observed. How the data *could* have been collected (stopping rules, unrun analyses) is irrelevant.
      *   *Implication:* If I have the data and the model, the $p$-value (calculated post-hoc) contains the same information regardless of when I decided to run it. Pre-registration is evidentially superfluous under this view.
      *   *Key Terminology:* Likelihood Principle, Conditionality, Sufficiency.

  4.  **Part 3: The Publication Guarantee (IPA) and the Literature:**

      *   *Question:* Does IPA rest on the same presuppositions?
      *   *Analysis:* Pre-registration is about *internal validity* (controlling false positives within the study). IPA is about *publication bias* (the file drawer problem).
      *   *Theory of the Literature:* The scientific literature should be a representative sample of conducted research, not just "successful" research.
      *   *Connection:* Pre-registration ensures the $p$-value means what it says (Frequentist integrity). IPA ensures the *distribution* of $p$-values in the journal reflects the distribution of truths tested, not just the significant ones.
      *   *Coherence:* They address different problems. Pre-registration fixes $P(\text{Data} | H_0)$. IPA fixes $P(\text{Publication} | \text{Result})$.
      *   *Tension:* There is a tension. If we guarantee publication regardless of results, do we still need the 0.05 threshold? The prompt asks if it's internally coherent to demand pre-reg *and* significance tests.
      *   *Answer:* It is coherent *if* the goal is error rate control in a cumulative science. Pre-reg makes the error rate calculable; IPA ensures the error rates aren't skewed by selection. However, it's slightly awkward because IPA diminishes the *consequential* weight of the significance test (since non-significant results get published anyway), but retains its *diagnostic* weight (is this effect non-zero?).

  5.  **Part 4: Bayesianism and Redundancy:**

      *   *Question:* Could a Bayesian standard license pre-registration?
      *   *Analysis:* Bayesians care about updating priors to posteriors.
      *   *Strict Requirement:* No. The Likelihood Principle says stopping rules don't matter for the posterior.
      *   *Comfort/Pragmatism:* Yes. Pre-registration prevents "p-hacking" which can inflate Bayes Factors artificially (if the model is tweaked to fit noise). It also commits the researcher to a specific model, preventing "prior hacking" (changing priors until they look good).
      *   *Redundancy:* If we went full Bayesian:
          *   Pre-registration becomes less about error rates and more about transparency/model specification.
          *   IPA becomes less critical if we accept that "null" results just shift the posterior slightly rather than being "failures."
          *   However, the *institutional design* (Stage 1/Stage 2) might still be useful for workflow, but the *epistemic justification* changes.
          *   Would it be redundant? Not entirely. Transparency helps Bayesians too (to check if priors were manipulated). But the *necessity* driven by $p$-value fragility disappears.

  6.  **Synthesizing and Structuring the Essay:**

      *   *Introduction:* Define the Registered Report (RR) paradox (rigid timing + rigid $p$-values). State the thesis: RR relies on Frequentist Error Statistics for pre-reg, but addresses Sociological/Publication Bias for IPA.
      *   *Section 1: The Frequentist Presupposition (Why Timing Matters).* Explain Error Statistics, counterfactuals, stopping rules, and the "Garden of Forking Paths." The data doesn't speak for itself; the *procedure* speaks.
      *   *Section 2: The Rival Account (The Likelihood Principle).* Explain why, under Likelihood/Bayes, intentions are irrelevant. The data is the data.
      *   *Section 3: The Two Halves (Pre-reg vs. IPA).* Distinguish Internal Validity (Pre-reg) from External Validity/Representativeness (IPA). IPA treats the literature as a sample of inquiries, not just findings.
      *   *Section 4: Coherence and Bayesianism.* Is it coherent? Yes, but tense. Can Bayesians use it? Yes, pragmatically, but the strict epistemic need vanishes. Does it make RR redundant? It changes the justification from "error control" to "transparency/trust."

  7.  **Refining the Argument (Self-Correction during drafting):**

      *   *Check:* Did I address "facts not present in the data set"? Yes, need to emphasize counterfactual intentions (stopping rules).
      *   *Check:* Did I distinguish the publication guarantee? Yes, need to make sure I don't conflate IPA with pre-reg. IPA is about the *file drawer problem*.
      *   *Check:* Is the Bayesian section nuanced? Avoid saying "Bayesians don't need pre-reg." Say "Bayesians don't need it for *error control*, but might want it for *credibility*."
      *   *Tone:* Philosophical, analytical, precise. Use terms like "Error Statistics," "Likelihood Principle," "Stopping Rule Principle."

  8.  **Final Polish:** Ensure clear transitions between the epistemic (evidence theory) and the institutional (journal policy). (Proceed to generate output based on this structure.)

      *   *Key Insight to highlight:* The RR protocol is a hybrid. It uses Frequentist tools ($p$-values) protected by Frequentist safeguards (pre-reg) to solve a Frequentist problem (Type I error), but uses a Sociological safeguard (IPA) to solve a Selection Bias problem. The tension lies in treating the $p$-value as the "mark of a finding" while simultaneously saying the finding's publishability doesn't depend on it.

  9.  **Drafting the response.** (Mental outline matches the final output structure.)
