answer: |-
  The Registered Report (RR) protocol is a hybrid institutional technology. It marries a rigid procedural constraint (pre-registration) with a traditional evidential metric (the $p$-value), wrapped in a sociological guarantee (in-principle acceptance). To understand its coherence, one must disentangle the epistemic theory governing the *timing* of the analysis from the theory governing the *selection* of papers for publication.

  ### 1. The Theory of Evidence Behind the Timing Requirement

  The requirement that the analysis plan be fixed *before* data collection presupposes **Frequentist Error Statistics** (specifically the Neyman-Pearson framework). In this view, evidence is not a property of the data alone, but a property of the *procedure* that generated the data.

  **Why the Moment Matters:**
  In Error Statistics, a $p$-value is defined as the probability of obtaining data as extreme as, or more extreme than, the observed data, *assuming the null hypothesis is true*. Crucially, "more extreme" is defined relative to the **sampling distribution**. The sampling distribution is determined not just by the data collected, but by the **counterfactual space of possibilities** inherent in the experimental design.

  If an analyst looks at the data, sees a pattern, and *then* chooses a test to highlight that pattern, they have implicitly traversed a "garden of forking paths." They have utilized **researcher degrees of freedom**. To calculate a valid $p$-value, one must account for every decision point where the analyst *could* have chosen a different test, excluded different outliers, or stopped collecting data at a different $N$.

  **Facts Not in the Data Set:**
  The RR timing requirement assumes that the following counterfactual facts are evidentially relevant, even though they leave no trace in the final dataset:
  1.  **The Stopping Rule:** Did the researcher plan to collect $N=100$, or did they plan to collect until $p < 0.05$? In Frequentism, optional stopping inflates the Type I error rate. The data numbers might be identical, but the $p$-value is invalid in the second case because the "chance of finding such data" includes the probability of stopping early.
  2.  **The Multiple Comparisons Space:** How many other analyses were considered and discarded? If a researcher runs 20 regressions and reports the one significant result, the $p$-value of that result is effectively 1.0 (certainty of a false positive somewhere), even if the reported number is 0.04.

  Therefore, the timing requirement presupposes that **intentions constrain the sampling distribution.** Without a pre-registered plan, the "sample space" is undefined, rendering the long-run error rates (Type I/II) incalculable. The data cannot "show" anything evidentially until the process that generated them is fixed, because the evidence is defined by the reliability of the process, not just the likelihood of the specific outcome.

  ### 2. The Rival Account: The Likelihood Principle

  The rival account is encapsulated in the **Likelihood Principle** (associated with Bayesianism and Likelihoodism). This principle states that all the evidence relevant to a hypothesis contained in an experiment is exhausted by the **likelihood function** of the actual data observed.

  Under this account, facts about when the analyst settled on the test, when they stopped collecting data, or how many other tests they *might* have run are **irrelevant** once the actual data and model are in hand.
  *   **Stopping Rules:** If I stop collecting data because I saw a strong effect, the likelihood of the data given the hypothesis is the same as if I had fixed that sample size in advance. The data speak for themselves; the intentions of the collector do not change the ratio of probabilities assigned to competing hypotheses by the observed data.
  *   **Multiple Comparisons:** A Bayesian updates their belief based on the data provided. While "fishing" might suggest a need for a more skeptical prior, the data themselves do not change their evidential weight based on unrun analyses.

  On this view, the RR timing requirement is evidentially superfluous. A post-hoc analysis yields the same likelihood function as a pre-registered one. The demand for pre-registration is merely a sociological safeguard against dishonesty, not an epistemic requirement for the data to bear on the theory.

  ### 3. Separating the Two Halves: Pre-registration vs. Publication Guarantee

  The Registered Report protocol consists of two distinct mechanisms that rest on different presuppositions.

  **A. Pre-registration (Stage 1)**
  *   **Presupposition:** This rests on the **Frequentist theory of internal validity**. It assumes the primary threat to scientific knowledge is the **False Positive (Type I Error)**.
  *   **Goal:** To ensure that the $p$-value reported in Stage 2 retains its nominal interpretation (e.g., that a 0.05 threshold actually corresponds to a 5% false positive rate). It treats the individual study as a test of error probabilities.

  **B. In-Principle Acceptance (IPA)**
  *   **Presupposition:** This rests on a **theory of the literature as a representative sample**. It assumes the primary threat to scientific knowledge is **Selection Bias (The File Drawer Problem)**.
  *   **Goal:** To ensure that the published literature reflects the distribution of *inquiries*, not just the distribution of *significant findings*.

  **Coherence of the Hybrid:**
  Is it coherent to demand pre-registration while guaranteeing publication regardless of significance?
  *   **Yes,** if one views science as a cumulative error-control system. Pre-registration ensures that when a "significant" result appears, it is trustworthy (low false positive rate). IPA ensures that "null" results are not hidden, allowing for accurate meta-analysis and preventing the literature from overestimating effect sizes.
  *   **However,** there is a tension. If publication is guaranteed regardless of the result, the *consequential* stakes of the $p$-value are lowered. The $p$-value remains the *diagnostic* mark of a finding (is there an effect?), but it is no longer the *gatekeeping* mark of publication. The protocol effectively says: "We must control your error rates (Pre-reg) so that we can trust your results enough to publish them even if they are null (IPA)."

  ### 4. Bayesian Standards and Redundancy

  Could a thoroughly Bayesian evidential standard license pre-registration? Would it make the institutional design redundant?

  **Licensing Pre-registration:**
  Strictly speaking, **no**. Under the Likelihood Principle, a Bayesian posterior is not mathematically invalidated by optional stopping or post-hoc analysis choices. The data update the prior regardless of the researcher's intentions.
  *   *However*, pragmatically, **yes**. A Bayesian might support pre-registration to prevent **"model hacking"** or **"prior hacking."** If a researcher can tweak the model structure or the prior distribution after seeing the data, they can artificially inflate the Bayes Factor. Pre-registration commits the researcher to a specific likelihood and prior, enhancing credibility. Thus, while not *epistemically required* for the math to hold, it is *sociologically required* for trust.

  **Redundancy of Institutional Design:**
  If the field adopted a thorough Bayesian standard:
  1.  **The Significance Threshold (0.05):** This would become redundant. Bayesians do not use binary thresholds; they report posterior probabilities or Bayes Factors. The "mark of a finding" would shift from "rejecting null" to "shifting belief."
  2.  **Pre-registration:** This would become less critical for *error control* but remain useful for *transparency*. The strict "Stage 1 / Stage 2" firewall might relax, as looking at data mid-stream does not invalidate the inference.
  3.  **In-Principle Acceptance:** This might become less necessary. In a Bayesian framework, a "null" result is simply evidence favoring the null hypothesis; it is informative. The stigma of the "null" diminishes because the goal is parameter estimation, not binary rejection. If journals valued information gain rather than "discoveries," the file drawer problem would naturally shrink without needing a contractual guarantee.

  **Conclusion:**
  The Registered Report is a Frequentist solution to a Frequentist problem (inflated Type I errors), wrapped in a sociological solution to a sociological problem (publication bias). It presupposes that evidence is defined by the reliability of the process (Error Statistics), necessitating the fixation of counterfactual intentions via pre-registration. While a Bayesian account would render the strict timing requirements mathematically unnecessary, it would not necessarily render the transparency requirements redundant, as trust remains a prerequisite for cumulative science regardless of the statistical paradigm. The RR protocol is thus a bridge: it uses rigid Frequentist guards to protect the integrity of the data, allowing the literature to function more like a representative record of inquiry.
