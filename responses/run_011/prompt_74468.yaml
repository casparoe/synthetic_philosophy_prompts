answer: |-
  1. **Point:** Look at the board. Prior [0.3, 0.3]. Posterior [0, 0.6]. You're claiming that seeing a seal failure makes us *less* certain about the bearing? That's not learning, that's amnesia. We started with a known rate and ended with "could be anything."

  **Range:** It's dilation, not amnesia. The prior says we know the fleet-wide rate is 0.3, but we admit we know nothing about the correlation. Once you condition on the seal, that unknown correlation dominates the known marginal. The interval widening is the math telling us our structural ignorance matters more now than before.

  2. **Point:** Structural ignorance doesn't fix a pump. Friday I have to give the Director a risk number for the register. If I write "0.2 to 4%", he asks, "So do we service it or not?" You're smuggling the decision back in anyway. You'll pick 4% to be safe, or 0.2% to save budget, which means you already chose a point.

  **Range:** And that's exactly why the single number is dangerous. For the seal mode—three failures in eight years, half the fleet blind—a point estimate is fiction. If I publish 0.3%, maintenance treats it as noise. If I publish the interval, they see the variance is the signal. The number isn't for the decision; it's for the trust.

  3. **Point:** But look at your setup. You pinned the marginal at exactly 0.3. That's the artifact. If you'd let the marginal be vague too, say [0.2, 0.4], the posterior wouldn't have exploded to zero. You constructed a pathology where certainty on the unconditional forces uncertainty on the conditional.

  **Range:** I didn't construct it; the fleet data did. We have millions of hours on bearing rates; that 0.3 is solid. We have three data points on the joint failure. Why should I blur the known marginal to hide the fact that the correlation is undefined? Blurring the input doesn't fix the broken link between the variables.

  4. **Point:** Because if the output never narrows, the model is dead. You said intervals update with data, but in sparse regimes like this, the set of priors stays wide forever. We'll be publishing [0, 0.6] until retirement. That breaks the incentive to learn because the model says "we never know."

  **Range:** It only stays wide if the data doesn't touch the uncertainty. If we get joint failures, it narrows. Right now, the model is correctly saying "more data on bearings alone won't help." A point estimate lies and says "we know enough," which stops us from hunting the joint data we actually need.

  5. **Point:** Here's the thing you can't dodge: when the alarm triggers, the system sends a ticket. That ticket is binary. To generate it, you must collapse the interval to a threshold. You're not being honest; you're just outsourcing the collapse to the maintenance manager instead of doing the math yourself.

  **Range:** And here's what you're ignoring: when that ticket is wrong, we do a root cause analysis. If you published 0.3% and it fails, we look incompetent. If I publish [0, 0.6] and it fails, the record shows we warned them the risk was unquantifiable. You're optimizing for a clean dashboard; I'm optimizing for when we're wrong.
