answer: |-
  **PREP SHEET: Q&A STRATEGY**
  **Subject:** Genocide Convention Interpretation & Vocabulary Split
  **Venue:** Joint Session (ICL Reading Group / Genocide Studies Centre)
  **Time Allocation:** 90 seconds per reply

  ### I. FLAGGING HISTORICAL & DOCTRINAL VULNERABILITIES
  *Before you step up, note where your sketch risks overstatement.*

  1.  **Lemkin's Biological Dimension:** You claim Lemkin rejected 'denationalisation' partly because it missed the biological dimension. Be careful. Lemkin's 'national pattern' was predominantly cultural/social. While he included biological measures (birth rates), emphasising the biological too heavily risks conflating his view with the later physical destruction focus of the Convention. The historians may catch you smoothing over Lemkin's actual cultural primacy.
  2.  **The Drafting History:** You state cultural destruction was 'deliberately deleted'. This is broadly correct (Sixth Committee votes), but avoid implying it was a unified conspiracy. It was a political compromise to secure state ratification. The ICL practitioners will know the *travaux préparatoires* show a messy negotiation, not a clean excision.
  3.  **Case Law (*Krstić*):** The ICTY Appeals Chamber (*Krstić*) ruled that destruction of culture is evidence of intent to destroy the group, but not the *actus reus* itself. Your functional test effectively makes cultural/structural destruction the *actus reus*. This is a hard break from current jurisprudence, not merely a reinterpretation of 'in part'. Acknowledge this is *de lege ferenda*.

  ### II. OPENING CONCESSIONS (First 10 Minutes)
  *Deploy these early to blunt the sharpest objections.*

  1.  **Concede the Textual Betrayal:** Explicitly state that the 1948 Convention text is a compromise that narrowed Lemkin's vision. This disarms the Historians who want to call the treaty itself a betrayal; you agree, but argue we must work within the legal reality while fixing the political vocabulary.
  2.  **Concede the Legal Status:** Admit your functional test is not current law (*de lege lata*). It is a proposal for interpretation or reform. This prevents the ICL practitioners from dismissing you for ignoring *nullum crimen*.
  3.  **Concede the Risk:** Acknowledge that splitting vocabularies carries the risk of state abuse. This shows the NGO representative you have considered the practical downside, rather than ignoring it for theoretical purity.

  ### III. OBJECTIONS & REPLIES (Ordered by Damage)

  **1. The Political Utility Objection**
  *   **Who:** NGO Representative (Atrocity Prevention)
  *   **Objection:** 'If you split the vocabulary, you hand authoritarian regimes a perfect shield. They will say, "Technically, this isn't genocide," while continuing the destruction. You're prioritising legal purity over preventing suffering. Does your model actually stop anyone dying?'
  *   **Reply:** 'It is a fair concern, but the current confusion costs more lives. When "genocide" is used loosely for every atrocity, the specific legal obligation to intervene under the Convention is diluted. Governments already hide behind the technical definition; giving them a precise technical term denies them the ambiguity they currently exploit. We need a graded political vocabulary—perhaps "ethnocide" or "group destruction"—that retains the moral force without the legal bottleneck. The goal is to make the political condemnation sharper, not to remove the stigma.'
  *   **Soft Spot:** You cannot guarantee states won't use the technical definition to evade political pressure.

  **2. The Legality Principle Objection**
  *   **Who:** ICL Practitioner (Ex-Tribunal)
  *   **Objection:** 'You're proposing a functional test for "in part" that ignores numerical substantiality. This violates *nullum crimen sine lege*. You cannot stretch a criminal definition to cover assimilation via philosophising. Where is the certainty for the accused?'
  *   **Reply:** 'I am not suggesting this for retroactive prosecution. I am arguing for a reinterpretation of "destructive acts" within the existing Convention framework for future application. The certainty comes from identifying specific structures—language, leadership, transmission mechanisms—whose loss makes group continuation impossible. This is no less certain than judging "substantial part" by body counts, which is itself often arbitrary. We are clarifying the *object* of the destruction, not removing the intent requirement.'
  *   **Soft Spot:** Courts are deeply resistant to expanding *actus reus* beyond physical/biological harm.

  **3. The Lemkin Betrayal Objection**
  *   **Who:** Historian (Genocide Studies Centre)
  *   **Objection:** 'The Convention is already a betrayal of Lemkin. Anchoring your fix to the treaty text is a category mistake. Lemkin cared about the pattern; the treaty cares about bodies. Why not just discard the Convention as the primary analytical tool?'
  *   'Because the Convention is the only lever we have for state responsibility. Discarding it leaves us with moral condemnation but no legal mechanism. My argument is that Lemkin's "pattern" can be read into the "destruction" requirement if we stop fixating on death counts. We honour Lemkin not by mourning the treaty, but by forcing the treaty to do the work he intended.'
  *   **Soft Spot:** Many historians believe the treaty is irredeemable and will reject this reconciliation.

  **4. The Jurisprudence Objection**
  *   **Who:** ICL Practitioner (Ex-Tribunal)
  *   **Objection:** 'The ICTY in *Krstić* was clear: cultural destruction is evidence of intent, not the act itself. You're asking us to overturn established case law. Why should judges accept a functional test that contradicts the Appeals Chamber?'
  *   **Reply:** '*Krstić* left the door ajar. It said cultural destruction is not genocide *per se*, but it did not rule out that destroying the *functions* of a group could constitute destruction of the group itself. My proposal distinguishes between damaging culture and destroying the structural capacity of the group to exist. It is a refinement, not a contradiction. We are asking courts to look at the viability of the group, not just the mortality.'
  *   **Soft Spot:** *Krstić* is widely read as closing this door; distinguishing it requires nimble footwork.

  **5. The Linguistic Coherence Objection**
  *   **Who:** Philosopher of Language
  *   **Objection:** 'Meaning is fixed by use. You cannot stipulate a technical meaning for "genocide" while expecting it to carry political weight. If the public uses it as a honorific, your technical definition will simply be ignored. Is this split even coherent?'
  *   **Reply:** 'Legal terms already operate differently from colloquial ones. "Murder" has a specific technical meaning distinct from "killing", yet retains moral force. We can decouple the legal trigger from the political condemnation. The coherence comes from institutional discipline: courts use the technical term, advocates use the graded political vocabulary. It requires effort, but it is not impossible.'
  *   **Soft Spot:** "Murder" still implies moral wrong; a technical "non-genocide" might not.

  **6. The Colonial Violence Objection**
  *   **Who:** Historian (Genocide Studies Centre)
  *   **Objection:** 'Where does your functional test land on residential schools or frontier colonial violence? If there was no specific plan to destroy the group, but the policy caused it, does your model exculpate the coloniser?'
  *   **Reply:** 'Under current law, yes, often it does. Under my model, if the policy targeted the structures of group continuation—language, family units, land connection—and the intent was to impose the oppressor's pattern, it qualifies. The issue is often the evidence of intent, not the definition. We must not lower the definition to catch colonial crimes; we must find the evidence of the structural intent that was already there.'
  *   **Soft Spot:** Proving specific intent in colonial contexts remains notoriously difficult.

  **7. The Group Definition Objection**
  *   **Who:** Postgraduate Student
  *   **Objection:** 'Your test relies on "structures whose loss makes continuation impossible". But who defines the group? If the perpetrator defines the group, your test biases towards their view. If the victim defines it, it's too subjective. How does your functional test resolve this?'
  *   **Reply:** 'It requires an objective assessment of the group's social reality, not just self-ascription or perpetrator classification. We look at the actual mechanisms of reproduction and transmission. If those are targeted, the group definition becomes secondary to the functional impact. We are protecting the social fact, not just the label.'
  *   **Soft Spot:** Determining the "objective" social fact is inherently interpretive.

  **8. The Cultural Genocide Objection**
  *   **Who:** ICL Practitioner (Ex-Tribunal)
  *   **Objection:** 'Cultural genocide was explicitly rejected during drafting. You are reintroducing it through the back door by calling it "pattern destruction". Is this not dishonest to the drafting history?'
  *   **Reply:** 'It was rejected as a standalone crime, but the Convention still protects the group "as such". You cannot destroy a group "as such" without affecting its pattern. I am not reintroducing cultural genocide as a separate offence; I am arguing that physical destruction is often achieved through structural destruction. It is an interpretation of "destroy", not an addition of a new crime.'
  *   **Soft Spot:** The drafting records show a clear intent to exclude cultural destruction from the *actus reus*.

  **9. The Early Warning Objection**
  *   **Who:** NGO Representative (Atrocity Prevention)
  *   **Objection:** 'Practitioners need clear indicators. Body counts are grim but clear. How does a "functional test" help early warning? It sounds too abstract for the field.'
  *   **Reply:** 'Body counts are a lag indicator; they tell you genocide is happening, not that it is about to start. Monitoring the targeting of structures—schools, leaders, media—is a lead indicator. It allows for earlier intervention before the killing begins. It shifts the focus from counting corpses to protecting infrastructure.'
  *   **Soft Spot:** Structural indicators can be ambiguous compared to mass violence.

  **10. The Hierarchy of Harm Objection**
  *   **Who:** General Audience / Historian
  *   **Objection:** 'You say mass rape without a group-destruction plan isn't genocide. That sounds like you're ranking harms. Are you telling victims their suffering is lesser because it wasn't "genocide"?'
  *   **Reply:** 'Not lesser, but different. The specific wrong of genocide is the destruction of the group's future. Mass rape is a crime against humanity and a grave violation. By reserving "genocide" for group destruction, we protect the specificity of that crime without diminishing the horror of others. We need a vocabulary that condemns all atrocities without blurring the distinct legal obligations.'
  *   **Soft Spot:** Victims' groups often view the label "genocide" as essential for recognition.

  ### IV. THE QUESTION HOPE NOBODY ASKS
  **Question:** 'If your functional test makes forced assimilation genocide, but excludes famine caused by indifference, aren't you criminalising the *intent to assimilate* more heavily than the *result of mass death*? How do you justify that moral hierarchy?'

  **Why I can't answer it:** Because on my own terms, the moral hierarchy *is* the point. I am arguing the specific wrong of genocide is the erasure of the group, not the body count. But admitting this sounds cold to an audience focused on human suffering. It requires defending a conceptual boundary over a humanitarian outcome, which is a hard sell in a room full of advocates. I must argue that clarity prevents dilution, but it risks sounding like I care more about labels than lives.
