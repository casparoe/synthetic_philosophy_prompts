prompt: |-
  I'm reading Zarathustra on my own — no philosophy background past one intro course — and I've hit a wall in Part Three, in the chapter where Zarathustra is climbing a rough stony path at night with the dwarf on his shoulder (I think it's called something like the vision and the riddle in the copy I have). I only have a library scan, I can't read the German reliably, and I don't want to guess at page numbers, so what follows is my own rough Englishing of the stretch I can't get through. Please treat the wording as approximate, and part of what I'm after is you telling me where my paraphrase has probably distorted something.

  Here's the bit, in my words:

  Zarathustra and the dwarf come to a gateway that has two faces, and a word meaning moment is written above it as its name. Two long lanes run away from the gateway: one stretches back behind them for an eternity, the other stretches ahead for another eternity. The two lanes contradict each other and offend each other, and here at this gateway they run together. Then Zarathustra pushes it further. Whoever thinks either lane all the way through, he says, thinks it falsely. He asks whether whatever can happen has not already happened once before; and whether, if this gateway has stood here from all eternity, everything that can pass through it must already have passed through it — including this very moment, including the two of them standing here talking about these things, including the moonlit night and the spider and the dog. So all of it has to come back. Just before this, the dwarf had said something to the effect that everything straight lies, that all truth is crooked, that time itself is a circle, and Zarathustra got angry and told him not to make it too easy on himself.

  Act as a philosopher who has taught this book for years and is used to explaining it to non-specialists, but don't water down the argument part. Think carefully, and start by brainstorming three or four candidate things the gateway image could be doing before you commit to one — I'd rather have ranked possibilities than one confident answer. Then:

  1. Rebuild the argument as numbered premises and a conclusion. Which premise is doing all the work, and what has to be true for it to hold — how many possible states there are, whether the past is actually infinite, what can happen is supposed to mean?

  2. Is the two-lane gateway decoration or a premise? Specifically, in what sense do the two lanes contradict each other, and why does that matter for the conclusion?

  3. Why is Zarathustra furious at the dwarf for the time-is-a-circle line when the circle looks like exactly what Zarathustra goes on to argue for? Two people in my reading group disagree: one says Zarathustra is parodying the whole thing and the dwarf's version is bad cosmology he's rejecting, the other says the anger is about how the dwarf says it, not what he says. Which fits the passage better? Say so if neither does.

  4. My own hunch, which I suspect is too deflationary: the point isn't a cosmological claim that the identical sequence of events literally repeats, but that the present moment is where the whole past and the whole future are knotted together, so that it has all been here before is a way of saying you can't occupy this moment neutrally. Does that survive contact with what comes right after — the shepherd and the snake — or does that bit force the stronger reading?

  5. Does any of this turn on whether the moment is a point or a stretch of time?

  No bibliography, no reading list, I can't chase sources right now. If you're relying on something you're not sure about, flag it. And point out anywhere my rendering likely misrepresents the original and where your answers would change if it does.
