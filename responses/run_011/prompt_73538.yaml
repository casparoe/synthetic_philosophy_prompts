  A past cost enters rational calculation only when honoring it sustains a constitutive relationship or commitment mechanism that yields net future value. In all other cases, it remains irrelevant.

  **Clauses:**
  1.  **Pure Material Loss:** Where expenditure yields no future benefit or relational good, ignore it. This covers Cinema, Fence, Venture, and Doctorate.
  2.  **Constitutive History:** Where the investment *is* the relationship itself, honoring it preserves the value. This covers Marriage (the years are the bond) and the Garden (finishing honors the friend, yielding relational value).
  3.  **Harm Constraint:** Continuation must not impose disproportionate new harms. This distinguishes the Hill (more death for no value) from the Garden (effort for memorial value).
  4.  **Functional Commitment:** Where past acts create credibility or psychological leverage, count them as assets. This covers the Vow (credibility) and Membership (psychological leverage).
  5.  **Transferable Skill:** Where past effort yields usable capacity, count it as an asset. This covers Piano.

  **The Novel:**
  Under this principle, you should abandon the three hundred pages. Unlike the Garden, the pages do not constitute a relationship with another person. Unlike the Vow, finishing creates no credibility. Since starting over yields a better book, finishing produces less net value. Your reluctance is attachment to labor, not constitutive integrity.

  **Trade-off:**
  This principle sacrifices your intuition on the Novel to secure the distinction between the Hill and the Garden. It accepts that honoring the dead is rational only when it generates positive future value (memorial good) without inflicting new harms (fresh deaths). It treats the Garden as relational (honoring *her*) and the Hill as strategic (honoring *them* via futile death). You must accept that some sunk costs are merely sentimental, even when they feel like integrity. The Novel lacks the relational component of the Garden; the pages are material, not a bond. Consequently, you should abandon the Novel verdict. The trade-off prioritizes a clean distinction between relational obligations and material losses over saving every intuition.
