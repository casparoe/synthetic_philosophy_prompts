      *   *However,* the tutor might be pushing the "Will" argument. I need to argue why the "Association" argument is better here or if they converge. Actually, Locke explicitly says in STCE §112 regarding tasks: "If he refuses to learn... it is obstinacy." But here he *starts* cheerfully. It's not refusal. It's capacity/habit.
