answer: |-
  The "Cannot Reproduce" norm presupposes an operationalist theory of legitimacy where a defect's reality is contingent upon the engineering team's capacity to intervene and replicate it under controlled conditions.

  This is not falsificationism in the Popperian sense. Popper argues that universal theories (e.g., "This code is correct") are scientific only if they can be falsified by singular observation statements (e.g., "Input X caused failure Y"). Under strict falsificationism, a single credible report *should* falsify the claim of correctness, regardless of reproducibility, unless the report itself is proven false. Your team's practice inverts this: it treats the bug report as the theory requiring verification, demanding repeated experimental success to validate the observation itself. This is closer to Logical Positivism's verification principle or Bridgman's operationalism, where the meaning and existence of a phenomenon are defined by the specific operations used to measure it. If the operation (reproduction steps) fails, the phenomenon is deemed meaningless or non-existent. However, this is mostly a rhetorical shield for a resource allocation heuristic. Philosophically, the team claims that unreproducible bugs don't exist; economically, they are asserting that the expected cost of investigation exceeds the expected cost of the bug. The ontological claim ("it isn't a real bug") is a convenient fiction to justify closing the ticket without admitting to a risk assessment decision.

  Your team is holding three incompatible epistemologies simultaneously, shifted by context rather than principle. For user reports, you employ strict operationalism (no reproduction, no reality). For flaky CI tests, you employ pragmatic instrumentalism (reproduction is possible but ignored because the signal-to-noise ratio is poor and the cost of fix is high). For production incidents, you employ the precautionary principle (single occurrence is sufficient evidence because the downside risk is catastrophic). For design docs, you employ coherentism or argumentation theory (claims are valid if they fit logically within the existing system model and are asserted by high-status agents). This inconsistency reveals that "evidence" is not the primary driver of legitimacy; stake and source are. The "Cannot Reproduce" rule is not a consistent theory of knowledge but a boundary mechanism that shifts the burden of proof onto external agents while retaining epistemic privilege for internal actors.

  If you swapped this for a straightforward probabilistic (Bayesian) view, the bug tracker would cease to be a binary state machine (Open/Closed) and become a risk ledger. A single credible report would update the prior probability of a defect existing without requiring reproduction to validate the claim's existence; "Cannot Reproduce" would simply lower the posterior probability rather than zeroing it out. Tickets would never be closed as "non-events" but would decay in priority as the probability of existence drops below the cost of investigation threshold. Flaky tests would be tracked as known probabilities with an associated cost-of-carry rather than quarantined as noise, and design proposals would require explicit confidence intervals rather than plausible narratives. This would force explicit conversations about risk tolerance and cost rather than hiding them behind ontological declarations about what is "real."
