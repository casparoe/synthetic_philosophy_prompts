      *   *Refining Q2:* Emphasize Reaction Time (RT). That's the standard operational measure for fluency without relying on self-report.
      *   *Refining Q3:* Ensure the rival accounts are distinct from fluency. Social signaling is about *output*, fluency is about *processing*.
      *   *Refining Q4:* The user suspects the move from causes to states. I think the move from "I can't observe the decision" to "I infer the feeling" is the real leap. I can feel an urge without observing the neural cause.
