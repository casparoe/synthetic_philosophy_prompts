          *   *Rival 1:* Social Norms. We *learn* to express certainty about our minds to function socially, regardless of internal evidence.
          *   *Rival 2:* Evolutionary Heuristic. It's more costly to hesitate about your own intentions than to be wrong. Better to commit.
