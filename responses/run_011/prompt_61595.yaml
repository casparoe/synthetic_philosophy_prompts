answer: |-
  The panellist effectively invoked a pragmatic precautionary principle disguised as an evidential rule, but while this policy survives scrutiny as a guide for action, the strict evidential reading only justifies agnosticism and cannot support a positive presumption of sentience.

  1.  **Logical Non-Entailment**
      *   **Asserts:** The proposition "X exists" is not logically contradicted by the proposition "We have no evidence of X."
      *   **Truth Condition:** True by definition of logical entailment; observational statements rarely entail existential negatives without auxiliary assumptions.
      *   **Verdict:** True but trivial; it blocks the claim that sentience is *disproven*, but supports no positive presumption that sentience *exists*.

  2.  **Methodological Insensitivity**
      *   **Asserts:** If the methods used to detect X are known to be insensitive or the search effort insufficient, null results do not significantly lower the probability that X exists.
      *   **Truth Condition:** True if the statistical power of the investigation is low or the theoretical link between phenomenon and marker is weak.
      *   **Verdict:** True and substantive; it supports suspension of judgment but does not justify acting as if X is present rather than absent.

  3.  **Epistemic Immunity**
      *   **Asserts:** Null results never lower the probability of X, regardless of the rigor, sensitivity, or repetition of the investigation.
      *   **Truth Condition:** False; in a Bayesian framework, repeated null results from high-power tests must lower the posterior probability of the hypothesis.
      *   **Verdict:** False; while this reading would support the panellist's conclusion, it violates standard principles of scientific inference.

  4.  **Pragmatic Precaution**
      *   **Asserts:** When the cost of false negatives (treating a sentient being as non-sentient) is high, we should act as if X exists despite lacking evidence.
      *   **Truth Condition:** True as a normative policy decision dependent on value judgments about risk and welfare, not on empirical data.
      *   **Verdict:** Survives scrutiny as policy; this likely motivated the panellist, but it is distinct from an evidential claim about the animals' actual state.

  **Regarding the three points requiring disentangling:**

  First, the slogan applies unequally to the two investigative situations. In the case where no adequate investigation has been undertaken, the slogan holds strongly (Reading 2): a null result here is indeed meaningless regarding absence. However, where a well-designed investigation returns a null result, the slogan loses its evidential force; repeated failures to detect a phenomenon where detection is expected *are* evidence of absence (Bayesian updating), rendering Reading 3 false. The panellist's usage conflated these, treating the conflicting laboratory results as if they represented methodological insufficiency rather than genuine evidential weight against sentience.

  Second, even on its strongest true reading (Reading 2), the slogan licenses only suspension of judgment, not a positive presumption. To move from "we do not know if they are sentient" to "we should presume they are sentient" requires an additional premise regarding priors or values. The slogan merely blocks the inference to non-sentience; it cannot generate the affirmative probability required for a presumption of sentience without smuggling in external normative commitments.

  Third, the slogan itself cannot carry the burden-shifting claim. Logically, stating that absence of evidence is not evidence of absence only indicates that the claim "they are not sentient" is unproven; it does not transfer the onus of proof to the deniers. Burden-shifting is a normative rule of discourse or policy, not a logical consequence of evidential gaps. To place the onus on those denying sentience requires a justification external to the slogan, such as the asymmetry of moral risk.

  **Regarding your curiosity on practical versus evidential employment:**

  The panellist was almost certainly relying on a practical employment (Reading 4) while appearing to rely on evidence. This is a common rhetorical strategy in welfare ethics: the Precautionary Principle provides the reason to act protectively under uncertainty, but because "precaution" sounds like hedging, it is often presented as "absence of evidence is not evidence of absence" to sound like a strict epistemic constraint. This conflation allows the speaker to claim the moral high ground of protection while asserting the scientific high ground of logical rigor, though the two rely on different justifications—one on values and risk, the other on data and inference.
