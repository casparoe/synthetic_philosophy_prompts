answer: |-
  ### Brainstorming Notes

  *   **Chain of Argument:** Theater is not an isolated moral toxin; it is a social institution that reflects and reinforces existing *moeurs* (customs). In a corrupt society (Paris), it amplifies corruption. In a virtuous republic (Geneva), it would introduce luxury, passivity, and inequality. It substitutes *sentiment* for *action*.
  *   **Causal Mechanism:** Not simple "contagion" (seeing vice makes you vicious). Rather: (1) **Complacency:** Weeping at virtue on stage satisfies our moral conscience so we don't practice it in life. (2) **Enervation:** Passive spectatorship weakens civic vigor. (3) **Inauthenticity:** Acting encourages masking one's true self (*amour-propre* over *amour de soi*).
  *   **Objection to Molière:** The book gets this backwards. Rousseau argues Alceste is the *only* honest man, mocked by a corrupt society. Molière makes virtue look ridiculous and social vice (Philinte's politeness) look reasonable. It's a critique of social conformity, not a defense of hypocrisy.
  *   **Alternative Proposal:** Not church services. Rousseau proposes **civic festivals**. Open-air, no tickets, no stage, no actors. The people are the spectacle to themselves. Active participation, not passive consumption.

  ***

  ### Claim-by-Claim Audit

  **1. "Plays corrupt their audiences. Seeing vice portrayed persuasively makes spectators more licentious..."**
  *   **Verdict:** Simplification / Partial Distortion.
  *   **Analysis:** Rousseau does argue theater corrupts, but not primarily through "persuasive portrayal" leading to imitation. His deeper claim is that theater *follows* mores rather than leading them. In a corrupt city, it entertains by validating corruption. The danger is less that we imitate the villain, and more that we laugh at the honest man (as in Molière) or feel we have discharged our moral duty by weeping at a tragedy without acting virtuously in the street.

  **2. "...and seeing tragedy makes them likelier to act on violent passion."**
  *   **Verdict:** **Backwards.**
  *   **Analysis:** Rousseau argues the exact opposite. Following a neo-classical reading of catharsis, he claims tragedy purges pity *in the theater* so we feel less of it in reality. "Humanity" is satisfied by tears on stage, leaving the spectator cold to actual suffering. It makes them *less* likely to act on passion because they have expended their emotional energy passively.

  **3. "He attacked Molière's *Misanthrope* because Alceste is a hypocrite whose pretense of virtue Molière rightly exposes..."**
  *   **Verdict:** **Backwards.** (Critical Error)
  *   **Analysis:** This is the most glaring textual failure in the summary. Rousseau's central critique is that Alceste is the *only* sincere character, a man of true virtue who is ridiculed by the "honnêtes gens" (polite society) represented by Philinte. Rousseau argues Molière sides with the corrupt social order against the individual conscience. He does not think Alceste is a hypocrite; he thinks Molière makes virtue *look* like hypocrisy to please a courtly audience.

  **4. "...he wanted actors kept out of Geneva for exactly the reasons the Genevan pastors did."**
  *   **Verdict:** Simplification.
  *   **Analysis:** The pastors objected on theological grounds (sin, excommunication). Rousseau objects on *political* and *sociological* grounds. He worries about the introduction of luxury, economic inequality (actors cost money), and the erosion of republican equality. He shares the conclusion (no theater) but not the premise (Calvinist doctrine vs. Civic Republicanism).

  **5. "He offered nothing in place of entertainment: his ideal was an austere, pious republic of church services and hard work."**
  *   **Verdict:** **Backwards.**
  *   **Analysis:** Rousseau explicitly proposes replacing theater with **public festivals**. He describes planting a stake in the ground, gathering the people in the open air, and making *them* the spectacle. "Show me no actors, bring me the people." This is secular, civic, and participatory, not a regime of church services and grim labor. He is suspicious of clergy almost as much as actors.

  **6. "What all this shows is that his case is a moral-contagion panic... and once you reject the contagion model, as everyone since has, the whole argument dissolves."**
  *   **Verdict:** **Strawman.**
  *   **Analysis:** Because the summary misidentifies the causal mechanism (contagion vs. alienation/passivity) and the specific textual arguments (Molière, festivals), the conclusion that the argument "dissolves" is unfounded. Rousseau's argument survives the rejection of simple "moral contagion" because it is actually an argument about political economy and the psychology of representation.

  ***

  ### Specific Inquiries

  **1. Does Rousseau think theater changes morals (contagion), or is he making some other causal claim?**
  Rousseau's causal claim is more sophisticated than contagion. He argues that theater **reinforces** existing mores rather than transforming them. "Theater is made for the people; it follows their customs." If the people are corrupt, theater makes them more clever in their corruption. If they are virtuous, theater is unnecessary.
  However, his specific worry for a republic like Geneva is **displacement and enervation**. The causal link is:
  *   **Spectatorship → Passivity:** The citizen becomes a consumer.
  *   **Representation → Alienation:** We pay others to feel/act for us (actors), just as we pay representatives to govern for us.
  *   **Sentiment → Complacency:** We feel pity on stage, which excuses us from benevolence in the street.
  So, it is not that vice infects the viewer like a virus; it is that the *structure* of theatrical consumption weakens the civic "springs" (*ressorts*) of the soul.

  **2. What precisely does he find objectionable about the *Misanthrope*?**
  As noted, the book has this inverted. Rousseau objects because the play punishes sincerity. Alceste demands truth in social relations; the surrounding society demands flattery and masking. Molière frames Alceste's demand for truth as a manic defect and Philinte's complicity in lies as "reason." For Rousseau, this teaches the audience that to be virtuous is to be antisocial, and to be social is to be complicit in vice. It trains citizens to value *reputation* over *conscience*.

  **3. Did he want to abolish public entertainment for religious observance?**
  No. He wanted to abolish *commercial, representational* entertainment (where a few act and many watch) and replace it with *civic, participatory* festivals.
  *   **Theater:** Enclosed space, tickets, darkness, passivity, separation of actors/audience.
  *   **Festivals:** Open air, free, daylight, activity, no distinction between performer and spectator.
  His model is the Spartan syssitia or the rural harvest dance, not the Calvinist sermon. He wants to generate *joie de vivre* and social bonding, not pious austerity.

  ***

  ### Verdict: Strawman or Substance?

  **This is a strawman.** The author of the paperback has conflated Rousseau with generic Puritanical anti-theatricality. By reducing Rousseau's argument to a "moral-contagion panic" (the "video game" analogy), the author dismisses a structural critique of representation that remains potent.

  **What survives if you drop the contagion model?**
  Rousseau's argument does not dissolve; it shifts from morality to **political agency**.
  1.  **Critique of Representation:** Rousseau's theater critique is continuous with his *Social Contract*. Just as sovereignty cannot be represented (you cannot have MPs vote for you, you must vote yourself), authentic social feeling cannot be represented by actors. Both create alienation.
  2.  **Active vs. Passive Citizenship:** A republic requires active engagement. Theater cultivates a habit of passivity. The citizen who is trained to sit in the dark and be entertained is the citizen who will sit at home and let others govern.
  3.  **Authenticity:** The core of Rousseau's philosophy (from the *Second Discourse* to the *Confessions*) is the corruption of man by society's demand for inauthenticity (*amour-propre*). Theater is the institutionalization of inauthenticity—it is the art of pretending.

  **Conclusion:**
  The book treats Rousseau as a prudish moralist worried that bad content makes bad people. Rousseau is actually a radical democrat worried that the *form* of theater makes passive subjects. The argument survives the "contagion" critique because it is not about the *content* of the plays (though he critiques that too), but about the *social relation* established between spectator and actor. If you accept Rousseau's premise that freedom requires active participation and transparency, the ban on theater is not a panic, but a consistent institutional safeguard. The paperback author attacks a caricature of a Calvinist scold, missing the political theorist who diagnosed the alienation of modern spectatorship two centuries before the Frankfurt School.
