answer: |-
  You seem to think I want to deny that narrative constitutes the self, but that is exactly what I affirm. The center of narrative gravity is not a thing hidden behind the story; it is the abstract point around which the story balances. Your stipulation tries to separate the narrative from the physical state, but there is no wedge to drive. If Rowan and Ezra compose different stories, their neural weightings differ, however subtly. The composition is not a ghostly act hovering above the synapses; it is the synapses firing in specific patterns. Therefore, the centers of narrative gravity are distinct because the mass distributions are distinct. You charge me with making the center a fifth wheel, but I am saying the center is simply the pattern of the wheel's rotation. It does not compete with the neurons any more than the trajectory of a ball competes with the atoms composing it.

  Your objection about voting rests on treating the center of gravity as a static property of a rigid body, but a person is a dynamic system that responds to its own description. When Rowan tells herself she is the one who got out, she is not a center voting on its location; she is a brain redistributing its own mass. The center moves because the object changed, not because the center exercised agency. The illusion that the center itself is doing the voting is precisely the phenomenon we are explaining. The self-model is part of the machinery it models, and this reflexivity makes the physics messy, but it does not require a homunculus inside the skull. You are right that rocks do not interpret their own balance, but that is why people are not rocks.

  Finally, consider what work the center actually does. It explains why we hold Rowan responsible and why we predict she will buy the ticket based on reasons rather than causes. If we look only at neurons, we see electrochemical events. If we look at the center of narrative gravity, we see an agent making a choice. Both are real patterns, but only the latter allows us to engage with them as persons. The difference between Rowan and Ezra is real, but it is a difference in abstract organization, not a difference in spiritual substance. That is all the self ever was, and demanding it be more is to demand a miracle rather than an explanation.
