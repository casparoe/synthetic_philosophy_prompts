  2.  **Analyze the 8 Existing Verdicts:**
      *   *Case 1 (Poison/Intent):* Intent = Act. Brother didn't drink, but poisoner gets "full weight." *Rule: Intent carries full karmic weight regardless of outcome.*
      *   *Case 2 (Midwife/Accident):* Accident/Negligence. House burned, no one died. Verdict: "No fruit." Reason: "Fire was already sitting in the lamp." *Rule: Accidents/Natural causes without malicious intent or gross negligence carry no karmic debt. Causality matters.*
      *   *Case 3 (Merchant/Transactional Good):* Public generosity, private scorekeeping. Verdict: "Paid in full, account closed." *Rule: Motivation matters. Seeking social credit/repayment cancels the merit of the good deed. It's a transaction, not a gift.*
      *   *Case 4 (Girl/Stealing for Brother):* Theft (bad) + Feeding (good). Verdict: Separate accounts. "They don't cancel." *Rule: Good and bad karma do not net out. They are distinct streams.*
      *   *Case 5 (Wife-Beater/Repentance):* Abuse (bad) + Penance (good). Verdict: Separate accounts. "The two never meet." *Rule: Reinforces Case 4. Penance does not erase sin. Consequences run in parallel.*
      *   *Case 6 (Hunter/Sustenance):* Killing for food + Prayer/Respect. Verdict: "Light fruit." Return: "Death of his own... quickly and without fright." *Rule: Necessity mitigates weight. Respect mitigates weight. The return mirrors the act (death for death, but gentle).*
      *   *Case 7 (Son/Pilgrimage for Dead):* Merit transfer. Verdict: Conditional. "If she's somewhere she can be glad of it." *Rule: Merit transfer is possible but depends on the recipient's state/capacity to receive.*
      *   *Case 8 (Boy/Magistrate):* Small act (snare) vs. Bureaucratic act (signature). Verdict: Snare heavier *today*, Signature heavier *across years*. *Rule: Scale/Impact is temporal. Immediate harm vs. systemic/long-term harm. Intent/Agency matters (boy vs. magistrate).*

  3.  **Synthesize the Rules (The "Ledger"):**
      *   *Intent is King:* Case 1 proves intent = action. Case 3 proves motivation defines the merit.
      *   *No Netting:* Cases 4 & 5 prove good/bad don't cancel. They run on parallel tracks.
      *   *Mirroring:* Case 6 proves the return matches the nature of the act (death for death, but modulated by intent/respect).
      *   *Causality/Agency:* Case 2 proves accidents aren't sins. Case 8 proves systemic harm counts.
      *   *Transferability:* Case 7 proves merit *can* be transferred, but it's conditional on the receiver.

  4.  **Analyze Wren's Situation (Chapter 26):**
      *   *Act:* Wren kills Steward (Premeditated, calm, admitted).
      *   *Intent:* To save brother from the karma of killing.
      *   *Brother's Status:* Intended to kill (Case 1 says this is "full weight").
      *   *Wren's Ask:* "Enter the killing on *my* account instead of his."

      *   *Application of Rules:*
