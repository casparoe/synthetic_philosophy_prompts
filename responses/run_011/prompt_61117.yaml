          *   5. Time scales vary (Case 8).

      *   **Section 2: Wren's Verdict.**
          *   Does substitution work? No.
          *   Why? Brother's intent already locked in his debt (Case 1). Wren's act locked in hers.
          *   What does the Tallywoman say? "You have added a stream, not replaced one."
          *   Does Brother still carry it? Yes. Intent = Full Weight.

      *   **Section 3: Best Guess (What did the user actually write?).**
          *   The strongest signal is Case 1 (Intent) and Case 5 (No Netting).
          *   The system is *Accounting*, not *Judgment*. It's mechanical.
          *   Loosest scene: Case 2 (The Lamp). "Fire was already sitting in the lamp" is poetic but metaphysically vague compared to the strict accounting of 4 & 5.
          *   Hardest working scene: Case 1 (Poison). It sets the "Intent = Act" precedent which breaks Wren's plan.

      *   **Section 4: The "Partial Land" Option.**
          *   Is there a reading where she helps him?
