          *   *Nuance:* Wren's *motivation* (sacrifice) might create a separate "good fruit" stream (like the girl feeding the brother in Case 4), but it won't erase the murder debt.

  5.  **Drafting the Response - Section by Section:**

      *   **Section 1: The Deduced Rules.**
