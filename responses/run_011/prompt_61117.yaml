          *   So: He still has the murder debt. She has the murder debt + the merit of sacrifice. She can give him the merit. This buffers the fall but doesn't stop it.
          *   This fits all 8 cases.

      *   **Section 5: The 9th Case (Chapter 9 Insert).**
          *   Need to test Transfer of Demerit vs. Merit.
