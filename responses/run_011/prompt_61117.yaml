          *   **No Netting:** Wren's "good intent" (saving brother) doesn't cancel her "bad act" (killing). They run parallel (Case 4 & 5).
          *   **Transferability:** Case 7 allows merit transfer. Does it allow *demerit* transfer? Case 7 says "if she can be glad of it." Can the brother "receive" the sin? Case 1 says intent creates the debt. If the debt is already created in him by his intent, can it be moved?
          *   **Mirroring:** Wren killed to save. The return might be "light fruit" (like the hunter) or "heavy fruit" (like the poisoner). Since it's political/murder, likely heavy.

      *   *The Conflict:* Wren wants to *substitute* her act for his intent.
      *   *The Ledger's Likely Answer:* You cannot substitute.
          *   Brother: Already has "full weight" debt because he intended it (Case 1). That debt exists *now*, before the act.
          *   Wren: Has "full weight" debt because she committed the act (Case 1 + Case 6).
