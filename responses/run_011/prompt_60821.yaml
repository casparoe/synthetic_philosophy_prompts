answer: |-
  You are asking me to test a specific intellectual reflex against a historical episode that seems designed to break it. The reflex is the preference for equilibrium structures over moral vocabulary, and the distrust of doctrines that do no explanatory work. The episode is the Christmas Truce of 1914. The theories are the moral equality of combatants, as articulated by Walzer, and the revisionist rejection associated with McMahan. I will proceed as you requested, moving from theory to case, then from case back to theory, constructing the rival etiquette view along the way, and ending with a verdict on what remains unexplained.

  Under the equality thesis, the status of the soldiers who walked into no man's land is theoretically stable but institutionally precarious. The thesis claims that soldiers on both sides hold an equal right to kill and are equally liable to be killed, regardless of the justice of their cause. This implies that the license to kill is a function of their status as combatants, not the morality of their nation's aims. Consequently, abstaining from killing is not forbidden by the theory; the equality thesis grants permission to fight, it does not mandate it. Therefore, the men who laid down their rifles did nothing morally prohibited by the equality thesis itself. They merely opted out of the permission grant. However, the shock the event caused and the ferocity of the subsequent orders against it are not anomalies for Walzer's view if you look beyond the individual license to the structure of the war convention. Walzer argues that the equality of combatants is part of a convention that makes war possible and limits its horrors. A key component of this convention is that the decision to start and stop fighting belongs to the sovereign authority, not the individual soldier. If soldiers can decide locally to cease fire, the state's monopoly on violence is undermined, and the war becomes ungovernable. The crackdown is therefore predicted by the view, not because the truce was murder, but because it was a usurpation of the authority that maintains the convention. The truce was unremarkable morally regarding liability, but grave politically regarding the structure of command. Walzer has the resources to explain the punishment without abandoning the equality thesis, provided he leans heavily on the idea that the convention requires uniform obedience to maintain the separation between combatants and non-combatants and to ensure that war remains a collective act rather than a series of private feuds.

  Running the same exercise on revisionism yields a much sharper and more uncomfortable verdict. Revisionism holds that permissions track liability, and liability tracks the justice of the cause and contribution to the threat. If we accept the clean version of the 1914 asymmetry, where Germany invaded Belgium and Britain responded defensively, the revisionist implies that German soldiers were contributing to an unjust threat and thus lacked permission to kill, while British soldiers were permitted to kill in defense. On this reading, the German soldiers were morally required to stop fighting, and the British soldiers were permitted to continue. When the truce occurred, the German soldiers did what revisionism says they ought to have done, but the British soldiers arguably did what they ought not to have done, or at least ceased protecting rights they were justified in defending. When the fighting resumed, the German soldiers were wrong to resume, while the British were permitted to do so. This is a verdict the revisionist can accept in principle, as it tracks the underlying justice of the cause. However, the view struggles significantly with the institutional reality of the army threatening its own men with punishment for complying with what revisionism says was the correct moral conclusion. If the German soldiers were morally required to stop, the state punishing them for stopping looks like the enforcement of injustice. The revisionist faces a reductio here unless they quietly adopt an institutional supplement they usually disclaim, such as a role-based obligation to obey orders regardless of immediate moral liability, or a claim that the epistemic uncertainty of the soldiers prevents them from acting on the true justice of the cause. Without such a supplement, revisionism implies that the military discipline following the truce was itself a moral wrong, forcing men back into liability they should have escaped. This creates a tension between the moral truth of the situation and the institutional necessity of the army, a tension the equality thesis dissolves by declaring the moral status of the soldiers identical regardless of the cause.

  Moving from the case back to theory, we must answer the explanatory question honestly. We need to sort the moral explanation from the non-moral candidates. The non-moral factors are robust: exhaustion and shortage of shells after the Race to the Sea, the physical proximity of the trenches which made conversation possible, the rotation through quiet sectors, the inexperience of men who expected a short war, and the availability of Christmas as a focal point. These factors account for the vast majority of the episode's occurrence. The moral equality of combatants earns almost no explanatory credit for the truce itself. It is a redescription of behavior that incentives fully account for. The soldiers did not cease fire because they reflected on their equal liability; they ceased fire because it was cold, they were tired, and it was Christmas. The sharpest instrument here is the Franco-German asymmetry you highlighted. The fraternization was distinctly weaker between French and German units than between British and German ones, and where British and German men talked, a shared language plainly helped. The moral status of the French and British soldiers was identical under the equality thesis, and identical under the revisionist view regarding the defense of Belgium. If moral status were the driver, the behavior should have been uniform across the front. The fact that it differed based on language and historical animosity from the 1870 war demonstrates that something other than moral status was driving the behavior. An equality theorist might absorb this by arguing that the theory explains the lack of guilt felt after the fact, rather than the cause of the truce, but this concedes that the theory is not doing the explanatory work of predicting or causing the event. It is a post-hoc justification, not a causal mechanism. The Pope Benedict XV feature reinforces this institutional reading. When the Pope asked governments to let the guns fall silent and they declined, but the men arranged it locally, it highlights that the barrier to peace was not the moral status of the soldiers but the political will of the sovereigns. The equality theory assumes the war is ongoing; it does not explain why men would disobey the sovereign to create a peace the sovereign refused.

  This leads us to construct and assess the rival I will call the etiquette view. On this reading, the moral equality of combatants is not a claim about liability but an institutional rule that armies maintain because it makes wars fightable and terminable. It is a rule about who may decide when the killing stops, not about who may be killed. The truce was not a moral discovery by the men but a usurpation of authority. The crackdown is exactly what the view predicts because the integrity of the institution depends on the chain of command remaining the sole arbiter of violence. The refused papal proposal is not a puzzle but the whole point, since what the governments objected to was the form of the ceasefire rather than its content; a ceasefire authorized by governments preserves the monopoly, while one arranged by soldiers breaks it. This view is genuinely distinct from Walzer's own conventionalism in that it strips away the moral weight Walzer tries to give the convention. Walzer argues the convention protects human rights; the etiquette view argues it protects the functionality of the state's war-making capacity. Can it still do the work the equality thesis is supposed to do, specifically explaining prohibitions on killing prisoners and on torture? It can, but only instrumentally. We do not kill prisoners because doing so undermines the convention that encourages surrender, which makes wars shorter and less costly for the institution. It risks ceasing to be a position in just war theory at all if it turns out to be merely a claim about institutional design, as it loses the normative force to condemn a war that is efficiently fought according to the rules. It becomes a theory of management rather than morality. However, for the specific case of the Christmas Truce, the etiquette view offers the strongest explanatory fit for the reaction of the high command, while admitting it has nothing to say about the moral impulses of the men themselves.

  Finally, I must be disciplined about silence. There are elements of this episode where neither theory has anything to say. The joint burials of the dead look like a phenomenon of recognition and honor rather than of permission to kill. Neither Walzer nor McMahan has a robust vocabulary for the sacredness of the dead enemy beyond the prohibition on mutilation; the act of jointly burying them suggests a shared humanity that transcends the combatant status entirely. The fact that it happened at Christmas and not on an arbitrary Tuesday is another silence. The theories treat time as neutral, but the cultural weight of the festival provided the focal point that allowed the equilibrium to shift. A theory of war that cannot account for the cultural calendar is incomplete regarding the lived experience of conflict. Lastly, the fact that the men who fraternized returned to killing and mostly kept at it for four more years is a silence for both. The equality thesis explains why they were permitted to return, and revisionism explains why the Germans were wrong to return, but neither explains why the moment of moral clarity evaporated so completely. The truce was a temporary suspension of the structure, not a collapse of it. The theories assume the structure holds; they do not explain the resilience of the war machine against these moments of human recognition.

  My verdict is that the truce is a case the equality thesis never anticipated, rather than a confirmation or a simple anomaly. The theory assumes a sustained conflict where the convention holds. The truce represents a temporary failure of the convention that the theory is not equipped to model as anything other than disobedience. For this verdict to reverse, the historical record would need to show that the soldiers cited their moral status as combatants as the reason for the truce, or that truces occurred with equal frequency in sectors where the moral asymmetry was clear versus where it was murky, controlling for language and culture. If we found that British soldiers refused to fraternize because they believed their cause was just and the Germans were liable, that would support revisionism. If we found that fraternization was uniform across all nationalities regardless of language or history, that would support the idea that a shared moral status of equality was the driving force. Since the evidence points to language, fatigue, and command structure, the moral theories remain descriptive frameworks imposed on the event rather than explanations of it. The reflex to reach for the equilibrium structure is justified here because the moral vocabulary adds little to our understanding of why the guns fell silent, though it remains necessary to understand why the commanders feared the silence so much.
