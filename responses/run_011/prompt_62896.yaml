  *Specific Inferential Failures:*
  1. Para 3: Asserts Total View preserves "morality is fundamentally about people." This is debatable/incorrect (it's impersonal).
  2. Para 4: Infers "far future drops out" from "future generations cannot be wronged." This ignores the Total View mentioned in Para 3. If Total View holds, future well-being counts. If Person-Affecting holds, it doesn't. The student mixes them.

