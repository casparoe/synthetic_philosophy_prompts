prompt: |-
  I am a doctoral candidate in political philosophy, and this term I am marking for an upper-level undergraduate seminar on justice between generations. One of the two written assignments was a 500-word response to a single prompt, worth 15 points; the rubric weights two things equally, an accurate reconstruction of the problem and a defensible assessment of the conclusion drawn from it. I have read the submission twice and would like an independent read before I assign points. Please give a grade out of 15 and then a paragraph-by-paragraph set of comments: what is sound, what is not, and specifically which inferential steps fail and what the student would have to say instead to earn the remaining marks. I want comments the student can act on, not a general impression.

  The assignment prompt was: Explain the non-identity problem as it arises for climate policy, and assess whether it shows that high-emission policies do not wrong future people.

  The student's submission, in four paragraphs:

  1. The non-identity problem arises because large-scale policy choices affect not only how well future people live but which particular people exist. Emissions decisions reshape economies, labour markets, migration, and the timing of relationships, so the specific individuals alive two centuries from now are a function of the policies we choose. A high-emission path leaves those future people worse off than the people who would have lived under a low-emission path — but they are not the same people. As long as their lives are worth living, none of them is worse off than she would otherwise have been, because the only alternative for each of them is never to have existed at all.

  2. This looks devastating for the standard case for mitigation. If wronging someone requires making that person worse off than she would otherwise have been, then a high-emission policy wrongs no future person: all of them have lives worth living, and they owe those lives to the policy. Nor can we lodge a complaint in their name, since the individuals in question would not exist to benefit from our restraint. The claim that we owe future generations a habitable climate therefore collapses.

  3. Parfit's own remedy is to compare the two futures impersonally and prefer the one containing the greater total of well-being. On this total view the high-emission future is worse even though nobody in it is worse off, and the policy can still be condemned. This preserves the verdict we want about climate change without abandoning the idea that morality is fundamentally about people.

  4. The consequences for policy are narrower than they first appear. Since future generations cannot be wronged, the real victims of high emissions are those already alive or already certain to be alive, whose identities our choices do not affect. Their interests are handled by ordinary cost-benefit analysis: emissions should be cut wherever abatement costs are lower than the resulting damages, and the far future simply drops out of the calculation. This is a welcome conclusion, because it means climate policy need not be driven by speculative claims about people we will never meet.
reasoning: |-
  Here's a thinking process that leads to the suggested grading and feedback:

  1.  **Analyze the Request:**
      *   **User:** Doctoral candidate in political philosophy marking an upper-level undergraduate seminar on intergenerational justice.
      *   **Task:** Provide an independent read of a 500-word student submission.
      *   **Assignment:** 500-word response, worth 15 points.
      *   **Prompt:** Explain the non-identity problem as it arises for climate policy, and assess whether it shows that high-emission policies do not wrong future people.
      *   **Rubric:** 50% Accurate reconstruction of the problem, 50% Defensible assessment of the conclusion drawn from it.
      *   **Output Requirements:** Grade out of 15, paragraph-by-paragraph comments (sound vs. unsound, specific inferential failures, actionable advice for improvement).
      *   **Tone:** Professional, constructive, specific (actionable for the student).

  2.  **Analyze the Student Submission:**
      *   **Paragraph 1 (Reconstruction):** Explains the causal link between policy and identity (timing of conception, etc.). States the core intuition: future people on high-emission paths are different people than those on low-emission paths. Claims that as long as lives are worth living, they aren't worse off than they would otherwise be (non-identity logic).
          *   *Assessment:* Accurate reconstruction of the basic problem. Clear and concise.
      *   **Paragraph 2 (Implication for Wronging):** Draws the conclusion that if wronging requires making someone worse off (counterfactual comparison), then high-emission policies wrong no one. Claims the obligation to provide a habitable climate collapses.
          *   *Assessment:* Accurate reconstruction of the *challenge* posed by the problem. However, it starts blending reconstruction with the student's own assessment of the conclusion. It sets up the "devastating" implication well.
      *   **Paragraph 3 (Parfit's Remedy):** Introduces Parfit's Total View (impersonal comparison). Claims this preserves the verdict we want without abandoning the idea that morality is about people.
          *   *Assessment:* This is where things get shaky. The Total View *does* allow condemnation, but the claim that it preserves the idea that "morality is fundamentally about people" is controversial (it's often criticized as impersonal). More importantly, the prompt asks the student to assess whether the NIP shows high-emission policies *do not wrong* future people. Parfit's Total View usually sidesteps "wronging persons" in favor of "making outcomes worse." The student doesn't critically assess this move; they just state it as a solution.
      *   **Paragraph 4 (Policy Consequences/Conclusion):** Claims future generations cannot be wronged (accepting the NIP conclusion). Claims real victims are present/near-future people. Concludes climate policy should be based on cost-benefit analysis and the far future drops out. Calls this "welcome."
          *   *Assessment:* This is the critical failure point.
              1.  It contradicts Paragraph 3. Para 3 says we can condemn the policy via the Total View. Para 4 says the far future drops out of the calculation. If the Total View applies, the far future *counts* (their well-being adds to the total). If the far future drops out, we are back to the person-affecting view which Para 2 said collapses.
              2.  It accepts the NIP conclusion ("future generations cannot be wronged") as final, despite Para 3 offering a remedy.
              3.  It ignores the "Person-Affecting Intuition" vs. "Impersonal Principles" debate.
              4.  It dismisses the far future based on cost-benefit, which is exactly what the NIP is supposed to problematize in a specific way (not just discounting, but non-wronging).
              5.  Most importantly, it fails the prompt's second half: "assess whether it shows that high-emission policies do not wrong future people." The student seems to say "Yes, it shows they don't wrong them (Para 4), but we can still condemn the outcome (Para 3)," without resolving the tension. Actually, Para 4 says "Since future generations cannot be wronged... the far future simply drops out." This implies the student accepts the NIP conclusion as decisive for *policy*, rendering Para 3's theoretical fix practically inert.
              5.  The conclusion that the far future "drops out" is a non-sequitur from the Total View. If we use the Total View, the far future's well-being matters immensely. If we use the Person-Affecting View (which leads to the NIP), the far future doesn't matter *as a matter of justice to them*, but the student conflates "wronging" with "mattering for policy."

  3.  **Determine the Grade:**
      *   **Reconstruction (7.5 points):** Paragraphs 1 and 2 are strong. They clearly explain the causal mechanism and the logical implication for the person-affecting principle. Let's say 7/7.5.
      *   **Assessment (7.5 points):** Paragraphs 3 and 4 are problematic.
          *   Para 3 mentions Parfit but doesn't critically assess it. It asserts it works without noting the "Repugnant Conclusion" or the shift away from "wronging persons."
          *   Para 4 contradicts Para 3. If we use the Total View, the far future *does not* drop out. If the far future drops out, we haven't solved the problem, we've just accepted the NIP's disturbing result. The student fails to provide a *defensible* assessment. They seem to accept the NIP conclusion (that they aren't wronged) but then try to have it both ways on policy. The claim that the far future "drops out" is a significant philosophical error in the context of Parfitian solutions.
          *   The prompt asks to assess *whether* it shows policies do not wrong. The student says "Yes" (Para 4 start) but then says "But we can condemn it" (Para 3) then "So ignore the future" (Para 4 end). It's incoherent.
          *   Grade for Assessment: 3.5/7.5.
      *   **Total:** ~10.5/15. Let's round to 10 or 11. Given the coherence issue in Para 4 is quite severe for a political philosophy seminar, 10/15 feels appropriate. It shows understanding of the problem but fails the critical assessment. Let's go with 10/15.

  4.  **Drafting the Comments:**
      *   *Tone:* Respectful of the doctoral candidate (peer-to-peer-ish), but formatted for the student (as requested: "comments the student can act on"). Wait, the prompt asks *me* to give the grade and comments. The user is the marker. I should provide the text *they* can give to the student, or the analysis *for* the marker? "Please give a grade out of 15 and then a paragraph-by-paragraph set of comments... I want comments the student can act on." Okay, I will write the feedback as if it is going to the student, but addressed to the marker to use.
      *   *Para 1:* Praise clarity on identity dependence.
      *   *Para 2:* Praise the link to the person-affecting principle. Note that this is the "challenge" phase.
      *   *Para 3:* Critique the treatment of Parfit. The Total View solves the *evaluation* problem but abandons the *wronging* language (which the prompt asks about). Does an impersonal bad mean someone was wronged? The student glosses over this distinction.
      *   *Para 4:* This is the main deduction area. The inference from "future people aren't wronged" to "far future drops out of calculation" is invalid if one accepts the Total View (from Para 3). If one accepts the Total View, the far future counts *more*. If one rejects the Total View, the NIP stands. The student tries to hold both. Also, the claim that this is "welcome" needs defense given the intuitive horror of ignoring the far future.
      *   *Actionable Advice:* Distinguish between "wronging a person" and "making an outcome worse." Decide if you accept Parfit's solution or reject it. Don't claim the future drops out if you use the Total View.

  5.  **Refining the Grade:**
      *   Reconstruction: 7.5/7.5. (Actually, it's very good).
      *   Assessment: 3/7.5. (The contradiction between Para 3 and 4 is fatal for a philosophy paper).
      *   Total: 10.5/15. I'll suggest 10/15 to be safe, or 11/15 if being generous on the reconstruction. Let's aim for 10/15. It's a "Good understanding of the problem, failed application of the solution."
      *   Wait, looking closer at Para 4: "Since future generations cannot be wronged... the far future simply drops out." This explicitly accepts the NIP conclusion as the final word on policy, rendering Para 3's mention of Parfit merely descriptive rather than part of the student's assessed position. This confirms the assessment score should be low.
      *   Let's settle on 10/15.

  6.  **Final Review of Feedback:**
      *   Ensure I don't sound like an AI but like a TA/Professor helper.
      *   Ensure the feedback is specific about *inferential steps*.
      *   Check against the rubric: 50% reconstruction, 50% assessment.
      *   Reconstruction (Para 1 & 2): Mostly sound.
      *   Assessment (Para 3 & 4): Para 3 is descriptive, not assessive. Para 4 is contradictory and philosophically dubious.

  7.  **Final Polish:** Make sure the distinction between "Person-Affecting" and "Impersonal" is highlighted as the key missing conceptual tool for the student.

