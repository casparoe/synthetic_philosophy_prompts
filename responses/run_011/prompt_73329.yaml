  3. The account must separate the survival of the biological organism from the survival of the person to address cases where synthetic replacement preserves psychology but alters biology. Tag: Preference of the Psychological Continuity Camp.

  4. The account must yield a unique, determinate truth value for whether the original patient survives any given procedure for use in consent forms, which cannot be jointly satisfied with Item 2 because branching scenarios inherently deny uniqueness, and this demand is a prejudice because identity may be vague. Tag: Preference of Legal Counsel (Prejudice).

