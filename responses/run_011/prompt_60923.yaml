      *   **Framework:** J.L. Austin (*How to Do Things with Words*) and John Searle (*Speech Acts*).
      *   **Specific Focus:** Felicity conditions, classification (Illocutionary act type), uptake, and the unique legal/philosophical tensions of the pardon.
      *   **Key Tensions to Address:**
          *   Declaration vs. Directive/Commissive (Legal status change vs. Guilt imputation).
          *   *Burdick v. US* (1915) dictum: Pardon implies guilt; acceptance implies confession.
          *   Nixon's reluctance/acceptance (Uptake issues).
          *   Pre-emptive nature (No indictment/conviction).
          *   Audience (Nixon vs. The Country).
          *   Perlocutionary fallout (Press Secretary resignation, approval drop) vs. Illocutionary success.
          *   Temporal aspect (Success settled later by non-parties).
          *   Taxonomy gap (Is it a promise to prosecutors?).

  2.  **Initial Classification (The "Puzzle"):**
      *   *Standard View:* A pardon is a **Declaration**. It changes the world (legal status) by virtue of being uttered by the right person in the right context. "I pardon you" makes you pardoned.
      *   *The Twist:* *Burdick v. US*. If a pardon carries an "imputation of guilt" and requires "acceptance" to be valid (as a confession), it introduces elements of an **Expressive** (acknowledging state of mind) or requires **Uptake** typical of a **Commissive** or **Directive**.
      *   *Austin's Take:* Declarations require institutional authority. If the institution (Supreme Court via *Burdick*) says acceptance is needed, then the Declaration is conditional on that uptake.
      *   *Searle's Take:* Searle distinguishes illocutionary points. A pardon fits "Declarations" (word-to-world and world-to-word fit), but if acceptance is required, it overlaps with "Commissives" (binding the speaker/hearer) or requires a specific sincerity condition.

  3.  **Felicity Conditions Analysis (Austin's A.1, A.2, B.1, B.2, etc.):**
      *   *A.1 (Conventional Procedure):* Constitution Art. II, Sec. 2 exists. Ford is President. Procedure followed. -> **Pass.**
      *   *A.2 (Appropriate Persons/Circumstances):* Ford is Pres. Nixon is a private citizen (at the time). -> **Pass.**
      *   *B.1 (Correct Execution):* Proclamation 4311 issued. -> **Pass.**
      *   *B.2 (Complete Execution):* Signed, delivered. -> **Pass.**
      *   *Gamma (Thoughts/Feelings):* Ford claimed "healing." Nixon felt stigma. -> **Mixed.**
      *   *Delta (Subsequent Conduct):* Did they act accordingly? Nixon accepted (eventually). Prosecutors stood down. -> **Pass.**

  4.  **The Uptake Problem (*Burdick* & Nixon's Reluctance):**
      *   *Burdick* Dictum: "A pardon carries an imputation of guilt; acceptance a confession of it."
      *   *Legal Reality:* Later cases (*Schick v. Reed*, 1974) clarified acceptance is required, but *Burdick*'s guilt implication is dictum, not holding. However, Ford treated it as real.
      *   *Nixon's Response:* Initially reluctant (didn't want to admit guilt). Eventually issued a statement accepting the pardon but denying wrongdoing ("I was wrong in not acting more decisively...").
      *   *Austin/Searle View:* If acceptance is a felicity condition (B.2), did it misfire initially?
      *   *Resolution:* The *legal* act was complete upon Ford's signature/delivery. The *moral/social* act required uptake. Nixon's statement was sufficient "uptake" to satisfy the *Burdick* condition without satisfying the "confession of guilt" implication. This creates a gap between the *legal illocution* (successful Declaration) and the *social illocution* (failed Expressive/Confession).

