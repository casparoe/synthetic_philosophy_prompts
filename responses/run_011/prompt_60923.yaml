      *   *Refining the "Guilt" aspect:* Distinguish between the *legal* effect (immunity) and the *social* effect (stigma).

  10. **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, does Burdick actually require acceptance for validity?* *Schick v. Reed* (1974) confirmed acceptance is required. *Burdick* is the source of the "guilt" language. So, acceptance is a felicity condition.
      *   *Did Nixon accept?* Yes, through his lawyer (Bukow) and his public statement.
      *   *Did he admit guilt?* No. He admitted "wrong" in a political sense.
      *   *Speech Act nuance:* This means the *Burdick* condition (acceptance = confession) was legally satisfied but semantically hollowed out. The illocution succeeded, but the implied expressive content was rejected by the hearer.
      *   *The "Promise to Prosecutors":* This is a strong insight. The pardon binds the Executive Branch (DOJ). It is a Commissive directed at the state's agents, wrapped in a Declaration directed at the citizen.

  11. **Final Polish:** Check against the prompt's specific questions.
