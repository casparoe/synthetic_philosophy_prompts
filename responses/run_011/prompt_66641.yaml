  2. Case 3, 5/10. While the immediate action measure supports perceptual alteration, the effect's generalization to irrelevant objects like the stapler suggests a global response bias rather than specific content penetration.

  3. Case 2, 3/10. The disappearance of the discrimination advantage under articulatory suppression demonstrates that the effect relies on verbal working memory maintenance rather than altered sensory representation.

  4. Case 4, 2/10. Reporting estimates retrieved from memory ten minutes later conflates reconstructive memory processes with online perceptual experience, making the data irrelevant to the core claim.

  5. Case 5, 1/10. The persistence of the illusion despite explicit knowledge and verification provides robust evidence for visual encapsulation, actively contradicting the claim that belief shapes experience.
