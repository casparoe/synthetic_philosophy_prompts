answer: |-
  1. The collective verdict must be logically consistent across all propositions, ensuring the body does not endorse a set of judgments that no single member holds. This directly addresses your recent failure mode where the minutes affirmed both premises yet rejected the logical conclusion, rendering the decision indefensible. I regard this as non-negotiable because an inconsistent record prevents the committee from taking coherent action or defending its integrity.

  2. Every member's judgment must carry equal weight regardless of identity or seniority, protecting the committee against dictatorship as membership turns over. This ensures the verdict reflects the group's will rather than a single dominant voice, which is essential for legitimacy in a peer-driven editorial process. This is non-negotiable, as unequal weighting would undermine the democratic authority of the committee's standards.

  3. The procedure must accept any possible combination of individual judgments as input, accommodating the reality that members' opinions shift and diverge unpredictably. Restricting admissible inputs would require policing members' reasoning before voting, which is impractical for a standing body. I treat this as non-negotiable because a rule that fails when members disagree deeply is useless during actual controversy.

  4. The collective judgment on each proposition should depend only on individual votes regarding that specific proposition, preventing logical connections between issues from driving the result. This satisfies the intuition that each issue deserves separate consideration rather than being held hostage to the outcome of another. I classify this as camp-relative, belonging to those who prioritize issue-by-issue responsiveness over global logical coherence.

  5. Formal theory proves you cannot simultaneously satisfy Collective Consistency, Anonymity, Universal Domain, and Proposition-wise Independence. You should sacrifice Proposition-wise Independence, accepting that logical connections between issues must drive the result to preserve consistency. The practical cost is that the outcome will depend on whether you frame the vote around premises or the conclusion, requiring a fixed rule to determine which path governs.
