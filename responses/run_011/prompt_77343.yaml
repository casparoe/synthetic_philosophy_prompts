prompt: |-
  I sit on the science advisory panel of a funder that pushes animal-welfare money around across taxa. This cycle's shortlist includes crickets, farmed shrimp, octopus, some nematode thing a grad student is lobbying for, and — against my better judgement — a cnidarian proposal. Before we read one more proposal I want the spec, not the theories: what does an account of how consciousness is distributed across animals have to deliver to count as usable by us?

  So write the desiderata list. For each requirement give the case or consideration behind it, and mark whether it's non-negotiable or a preference of a particular camp — because a lot of what gets demanded in this literature reads like camp prejudice to me, e.g. insisting the animal show something like self-awareness or a unified point of view before it gets counted. Tell me which of those I'm wrong about.

  Cases the list has to explicitly cover, because our shortlist keeps generating them:

  - the octopus arm: an octopus keeps most of its neurons out in the arms, and a detached arm will still orient and wrap around things. one subject or nine? does the arm get any weight of its own, and how would a theory even answer that?
  - siphonophores and the other colonial animals: thousands of clonal zooids, some do the swimming, some the stinging, some the digesting, and the colony is the thing that behaves as a unit. where's the subject, and does treating it as one rather than as thousands change how much welfare we think is at stake?
  - holometabolous insects — larva and adult share almost no body plan, most larval tissue gets broken down in the pupa. does the theory owe us an answer on whether the same subject persists, and does it matter practically given that the larval stage is usually the one thats farmed at scale?
  - cryptobiosis and diapause: tardigrades in a tun, brine shrimp cysts, overwintering larvae. sentience that switches off for months and switches back on. is the requirement about persistence, or just about getting the aggregation right?
  - fission cases like planarians, where one animal becomes two: does the counting-subjects question belong inside the theory of consciousness or over in the axiology? the list should say which, because we keep arguing about it.
  - C. elegans: 302 neurons, mapped, extremely well characterised avoidance behaviour. your list has to say what a theory is required to do with the animal where we know the most and learn the least from knowing it.
  - nociception-ish responses without anything like a central brain, and central brains without any obvious nociceptive machinery — so the requirement can't just be "it needs both."

  Some requirements I already suspect belong on there, correct me where I'm wrong: it has to say what counts as evidence, not just what consciousness is; it has to come out the other end as something we can actually multiply by — weights or credences, not yes/no — and say what to do when it can't tell; it can't smuggle in vertebrate-specific machinery (opioid modulation, layered cortex, a particular kind of learning) while advertising itself as substrate-neutral; it has to survive convergent evolution, i.e. it can't lean on shared ancestry with us; and it has to be statable by people who disagree about the metaphysics entirely, since our panel has a global-workspace person, an integrated-information person, and a lab vet who doesn't care. If that last one isn't actually achievable — if any workable list ends up presupposing one camp's picture of mind — I want you to say so plainly rather than paper over it.

  And the part I most want: if some subset of these requirements can't be jointly satisfied, show me the argument. My suspicion is that "must produce a determinate weight for every taxon on the shortlist" already fights with "must not go further than the evidence licenses," and that "must be substrate-neutral" fights with "must actually exclude something" — the more neutral your markers get, the less they rule out, until the theory says nearly everything with a nervous system is in. If that's a real dilemma and not just my confusion, that's the finding.

  Last: tell me which single requirement does the most work knocking out candidates, and rank the list for us, because our protocol writers are going to cut anything that can't defend its place.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Member of a science advisory panel for an animal welfare funder.
      *   **Task:** Create a "desiderata list" (requirements) for a theory of consciousness distribution across animals that is *usable* for funding decisions.
      *   **Tone:** Pragmatic, technical, skeptical of "camp prejudice," direct, no fluff.
      *   **Specific Cases to Cover:** Octopus arms (decentralization), Siphonophores (coloniality), Holometabolous insects (metamorphosis/personhood), Cryptobiosis (suspension of sentience), Planarian fission (counting subjects), *C. elegans* (known connectome, unknown experience), Nociception vs. Central Brain mismatches.
      *   **Specific Constraints/Pre-conditions:** Must specify evidence types, output weights/credences (not binary), handle uncertainty, be substrate-neutral (no vertebrate bias), survive convergent evolution, and ideally be metaphysically neutral (though admit if impossible).
      *   **Critical Analysis:** Identify conflicts between requirements (trade-offs/dilemmas).
      *   **Ranking:** Identify the single most exclusionary requirement and rank the list.

  2.  **Deconstruct the Core Problem:**

      *   The user is asking for an *operational* theory of consciousness, not just a philosophical one. They need to allocate money based on moral weight.
      *   The tension is between *scientific rigor* (don't overclaim) and *policy utility* (need a number to multiply by population/suffering).
      *   The "camp prejudice" note is crucial. Many theories (IIT, GWT, Higher-Order) have specific structural requirements that might exclude invertebrates arbitrarily or include them too broadly.
      *   The "metaphysical neutrality" constraint is the hardest. Can you have a theory of consciousness that doesn't presuppose *what* consciousness is? Probably not fully, but you can have a theory of *markers* that is agnostic.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Evidence Specification.* User suggested this. It's non-negotiable. We need to know *what data* counts.
      *   *Requirement 2: Output Format.* User suggested weights/credences. Non-negotiable for funding.
      *   *Requirement 3: Substrate Neutrality.* User suggested this. Non-negotiable to avoid vertebrate chauvinism.
      *   *Requirement 4: Handling Uncertainty.* What if the theory says "we don't know"? Need a precautionary principle or explicit null.
      *   *Requirement 5: The "Subject" Problem.* This covers the octopus, siphonophore, planarian cases. The theory must define boundaries of the moral patient.
      *   *Requirement 6: Temporal Persistence.* Covers metamorphosis and cryptobiosis. Is it the same subject? Does welfare accumulate?
      *   *Requirement 7: Metaphysical Agnosticism.* User asked for this. *Hypothesis:* This is the impossible one. I need to flag this carefully.

  4.  **Addressing the Specific Cases:**

      *   *Octopus Arm:* Needs a requirement on "Integration vs. Modularity." Does the theory distinguish between a reflex arc and a conscious agent?
      *   *Siphonophores:* Needs a requirement on "Unit of Selection/Agency." Is the colony the subject?
      *   *Holometabolous Insects:* Needs a requirement on "Psychological Continuity."
      *   *Cryptobiosis:* Needs a requirement on "Latency vs. Cessation."
      *   *Planarian Fission:* Needs a requirement on "Individuation."
      *   *C. elegans:* Needs a requirement on "Complexity Threshold." If 302 neurons isn't enough, why?
      *   *Nociception/Brain:* Needs a requirement on "Functional Role." Is pain just input/output or does it need integration?

  5.  **Identifying the Conflicts (The "Dilemma"):**

      *   *Conflict 1: Precision vs. Agnosticism.* To give a weight, you need a specific theory. To be metaphysically neutral, you can't commit to a specific theory.
      *   *Conflict 2: Inclusivity vs. Exclusion.* Substrate neutrality + Low bar for evidence = Panpsychism-lite (everything is in). High bar = Vertebrate bias creep.
      *   *Conflict 3: Individuation vs. Continuity.* Planarian fission and insect metamorphosis break standard identity conditions. A theory that solves one might break the other.

  6.  **Ranking and The "Knockout" Requirement:**

      *   What actually stops a proposal from getting funded? Usually, it's the inability to define the *unit* of welfare. If you can't say if the shrimp colony is 1 or 10,000, you can't budget.
      *   So, "Individuation/Unit of Account" is likely the highest impact.
      *   However, "Evidence Specification" is the gatekeeper.
      *   Let's refine: The requirement that forces a *decision* on the unit of moral concern is the most practical blocker.

  7.  **Refining the Tone:**

      *   Avoid academic hedging.
      *   Use the user's vocabulary ("camp prejudice," "shortlist," "spec").
      *   Be honest about the metaphysical impossibility.

  8.  **Drafting the Content (Mental Outline):**

      *   **Intro:** Acknowledge the difficulty. Validate the skepticism about camp prejudice.
      *   **The Desiderata List:**
          1.  Operationalizable Markers (Evidence).
          2.  Gradated Output (Weights).
          3.  Subject Individuation (The Octopus/Siphonophore/Planarian problem).
          4.  Temporal Continuity (Metamorphosis/Cryptobiosis).
          5.  Substrate Neutrality (No cortex bias).
          6.  Uncertainty Handling (Precautionary vs. Null).
          7.  Metaphysical Minimalism (The impossible one).
      *   **Case Mapping:** Explicitly link the list items to the user's specific cases (Octopus, Siphonophore, etc.).
      *   **The Conflict:** Explain why "Metaphysical Minimalism" fights with "Gradated Output." You can't calculate weights without a metaphysics of value.
      *   **The Ranking:** Put "Subject Individuation" at the top for practical utility, "Metaphysical Minimalism" at the bottom (or mark as impossible).
      *   **The Knockout:** "Subject Individuation."

  9.  **Self-Correction/Review during drafting:**

      *   *Correction:* I initially thought about putting "Evidence" as #1. But for a funder, knowing *what* counts as a subject is more critical than *how* you measure it. If you measure consciousness perfectly but don't know if the colony is one subject or 10,000, the measurement is useless. I will prioritize Individuation.
      *   *Correction on Metaphysics:* The user asked me to say plainly if it's not achievable. I must state that a fully metaphysics-neutral theory that produces weights is impossible. Weights imply a theory of value/experience.
      *   *C. elegans:* Make sure to mention that a theory must explain why 302 neurons is (likely) insufficient without relying on "number" alone, but on architecture.
      *   *Nociception:* Ensure the distinction between reflex and suffering is clear in the "Functional Role" requirement.

  10. **Final Polish:** Check against all constraints in the prompt.
      *   Did I cover all cases? Yes.
      *   Did I mark Non-negotiable vs. Preference? Yes.
      *   Did I identify the conflict? Yes.
      *   Did I rank and identify the knockout? Yes.
      *   Is the tone right? Yes, professional, direct, slightly weary of academic games.

  11. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a specification for an operational theory of consciousness, not a philosophical treatise. You are asking for a metric, not a truth. Below is the desiderata list required to turn "consciousness" into a line item in a budget spreadsheet.

  I have marked each requirement as **Non-Negotiable (NN)** (the proposal fails without it) or **Preference (P)** (desirable but theoretically contingent). I have also flagged where your suspicion about "camp prejudice" is correct and where it is a necessary evil.

  ### The Desiderata List

  **1. Operationalizable Markers (The Evidence Spec)**
  *   **Requirement:** The theory must specify observable, measurable proxies for consciousness that do not require self-report. It must distinguish between *capacity* (hardware) and *state* (software running).
  *   **Case Consideration:** *C. elegans*. We have the connectome. A theory cannot say "we need more data" if it cannot specify *what* data would change the verdict. If the theory relies on "subjective report," it fails NN.
  *   **Status:** **NN**.
  *   **Camp Check:** You are right to be suspicious of theories demanding "self-awareness" (mirror test) as a prerequisite. That is a camp preference (Higher-Order Theories), not a necessity for welfare. Welfare requires *valence* (pain/pleasure), not *self-concept*.

  **2. Subject Individuation (The Counting Problem)**
  *   **Requirement:** The theory must define the boundaries of the moral patient. It must provide a rule for counting subjects in cases of physical discontinuity or modularity.
  *   **Case Consideration:**
      *   *Octopus Arm:* If an arm acts independently, is it a subject? The theory must distinguish between a *sub-routine* (reflex) and a *sub-agent*. If it cannot, it cannot weight the octopus vs. the arm.
      *   *Siphonophores:* Is the colony the subject or the zooid? If the theory treats functional integration as the marker, the colony wins. If it treats neural density as the marker, the zooids win. The theory must pick one.
      *   *Planarian Fission:* When one splits into two, does one subject become two, or does one die and a new one arise? This changes the welfare calculus (continuity vs. creation).
  *   **Status:** **NN**.
  *   **Camp Check:** This is where most theories fail. They assume a human-shaped boundary. A usable theory must handle "fission/fusion" logic explicitly.

  **3. Temporal Continuity & Latency (The Persistence Problem)**
  *   **Requirement:** The theory must account for interrupted consciousness. It must state whether welfare weight accumulates during dormant phases or resets upon reactivation.
  *   **Case Consideration:**
      *   *Cryptobiosis:* If a tardigrade is a tun for 10 years, is that 10 years of zero welfare, or a pause button? If the theory says "consciousness is a process," it's a pause. If it says "consciousness is a capacity," the potential matters.
      *   *Holometabolous Insects:* Larva and Imago share DNA but little tissue. Is the butterfly the same subject as the maggot? If the larva suffers in farming but the adult does not, does the moral debt transfer?
  *   **Status:** **NN**.
  *   **Camp Check:** Psychological continuity theories struggle here. Biological continuity theories handle it better. For funding, you need a biological rule (e.g., "welfare counts only during active metabolic states").

  **4. Gradated Output (The Weighting Problem)**
  *   **Requirement:** The output cannot be binary (conscious/not). It must produce a credence interval or a weight multiplier (e.g., 0.01 to 1.0 relative to a human baseline).
  *   **Case Consideration:** *C. elegans* vs. Octopus. Both have nervous systems. A binary switch forces you to fund one and ignore the other. A weight allows proportional allocation.
  *   **Status:** **NN**.
  *   **Camp Check:** This fights against "Hard Threshold" theories (e.g., Global Workspace often implies a switch). You need a theory that accepts dimmer switches.

  **5. Substrate Neutrality (The Anatomy Constraint)**
  *   **Requirement:** The markers cannot rely on vertebrate-specific anatomy (cortex, opioid receptors, specific neural crest derivatives). They must be functional or architectural.
  *   **Case Consideration:** *Nociception vs. Brain.* Some animals have nociceptors but no brain; some have centralization but no known nociceptors. The theory must explain which architecture generates *suffering* rather than just *avoidance*.
  *   **Status:** **NN**.
  *   **Camp Check:** You are correct. Insisting on opioid modulation is vertebrate chauvinism. Insisting on "integration" (IIT) is more neutral but risks panpsychism (see Conflict below).

  **6. Uncertainty Handling (The Precautionary Principle)**
  *   **Requirement:** The theory must specify a default value when evidence is absent. Is the null hypothesis "unconscious" (0 weight) or "unknown" (precautionary weight)?
  *   **Case Consideration:** *Cnidarian Proposal.* We don't know much. If the theory says "assume 0 until proven otherwise," the proposal dies. If it says "assume 0.1 due to neural net presence," it lives.
  *   **Status:** **P** (But practically NN for your panel).
  *   **Camp Check:** This is an axiological choice, not a scientific one. Science cannot tell you whether to be precautionary. The theory must admit this is a policy overlay.

  **7. Metaphysical Agnosticism (The "God's Eye" View)**
  *   **Requirement:** The theory should be statable without committing to a specific metaphysics of mind (e.g., physicalism vs. panpsychism, IIT vs. GWT).
  *   **Case Consideration:** Your panel has a GWT person and an IIT person. They should be able to use the same spec.
  *   **Status:** **Impossible**.
  *   **Camp Check:** **You are wrong here.** You cannot have a weighting metric without a metaphysics of value. To say an octopus is "0.5 human" implies a theory of *what* is being measured (integration? reportability? complexity?). A theory that claims to be metaphysically neutral is usually smuggling in physicalism. You must accept that the "Spec" will privilege one camp's definition of consciousness, even if it uses neutral language.

  ---

  ### The Conflicts (Where the Requirements Fight)

  You suspected real dilemmas. Here they are.

  **1. The Precision vs. Agnosticism Dilemma**
  *   **Conflict:** Requirement 4 (Gradated Output) fights Requirement 7 (Metaphysical Agnosticism).
  *   **Argument:** To generate a weight (0.1 vs 0.9), you must define the *unit* of consciousness. Is it bits of integrated information (IIT)? Is it global availability of data (GWT)? These yield different numbers for the same animal.
  *   **Result:** You cannot have a single number that satisfies both an IIT proponent and a GWT proponent. One will say the Cnidarian is 0.001, the other might say 0.0.
  *   **Fix:** The spec must demand a *range* based on competing theories, not a single point estimate. If a proposal offers a single number without justifying the metaphysics, reject it.

  **2. The Neutrality vs. Exclusion Dilemma**
  *   **Conflict:** Requirement 5 (Substrate Neutrality) fights the need to exclude simple systems.
  *   **Argument:** If you remove vertebrate bias and focus only on "information processing" or "response to stimuli," you risk including thermostats or plants (panpsychism creep). If you add complexity thresholds to exclude them, you often accidentally re-introduce vertebrate bias (because we define complexity by *our* standards).
  *   **Result:** The more neutral the markers, the less they rule out. The more they rule out, the less neutral they are.
  *   **Fix:** The spec must demand a "Negative Control." The theory must explicitly name one system that is *not* conscious (e.g., a plant, a simple robot) and explain why, using its own rules.

  **3. The Individuation vs. Continuity Dilemma**
  *   **Conflict:** Requirement 2 (Individuation) fights Requirement 3 (Temporal Continuity).
  *   **Argument:** In Planarian fission, if you count subjects by physical continuity, one becomes two. If you count by psychological continuity (memory/pattern), the original might be dead, and two new ones born. In Holometabolous insects, the larva and adult are physically discontinuous.
  *   **Result:** A theory that solves the Octopus Arm problem (modularity) often breaks the Insect Metamorphosis problem (identity).
  *   **Fix:** The spec must require the theory to prioritize *welfare episodes* over *subject identity*. It matters less if the adult is the "same" as the larva, and more that suffering occurred in the larval stage.

  ---

  ### Ranking and The Knockout

  You asked for the list ranked by utility for your protocol writers, and the single requirement that does the most work.

  **The Ranking:**

  1.  **Subject Individuation (Req 2).** If you can't count the patients, you can't budget. This kills the Siphonophore and Octopus Arm debates immediately.
  2.  **Operationalizable Markers (Req 1).** If you can't measure it, you can't fund it.
  3.  **Gradated Output (Req 4).** Binary switches are useless for resource allocation across taxa.
  4.  **Uncertainty Handling (Req 6).** Determines your risk profile (precautionary vs. skeptical).
  5.  **Substrate Neutrality (Req 5).** Prevents lazy vertebrate-centrism.
  6.  **Temporal Continuity (Req 3).** Important for long-term farming cycles, less critical for wild capture.
  7.  **Metaphysical Agnosticism (Req 7).** **Discard.** It is a fantasy. Require *Metaphysical Transparency* instead (state your assumptions).

  **The Single Knockout Requirement:**
  **Subject Individuation.**

  **Why:**
  It is the only requirement that directly translates to *cost*.
  *   If a Siphonophore colony is **one** subject, the welfare weight is $W$.
  *   If it is **10,000** zooids, the welfare weight is $10,000 \times W$.
  *   That is a funding difference of four orders of magnitude.

  Most consciousness theories (GWT, IIT, Attention Schema) focus on *whether* a system is conscious, not *how many* consciousnesses are in the box. They assume the "animal" is the unit. Your shortlist (Siphonophores, Planarians, Octopus arms) breaks that assumption.

  **Instruction to Proposers:**
  "Your theory must explicitly state the rule for counting subjects in cases of physical fission, modularity, or coloniality. If your theory implies a Siphonophore colony is 1 subject, justify why the zooids are not subjects. If it implies they are 1,000 subjects, justify why the colony does not multiply the weight. Proposals that assume 'one animal = one subject' without argument will be rejected."

  This requirement forces them to stop doing philosophy and start doing accounting. That is what you need.
