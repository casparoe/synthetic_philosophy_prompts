answer: |-
  **ADVICE ON THE CORE HYPOTHESIS**

  Your "mechanism test" intuition is not wrongheaded; in fact, it is the strongest part of your pitch. However, to satisfy the philosopher on the committee, you must frame this not just as "Kepler looking for mechanisms," but as **Kepler solving a demarcation problem.** The term "mechanism" can be slightly anachronistic for 1620s natural philosophy (Kepler speaks more of *species*, *aspects*, and *geometric causation*); if you define "mechanism" too loosely, the historian committee members will penalize you.

  I have not changed your core question, but I have sharpened the terminology in the proposal below to "Causal-Geometric Necessity." This protects you from anachronism charges while keeping your "channel/license" insight. It signals to the philosopher that you are interested in *justification structures*, not just belief states. Defend this framing to your supervisor: you aren't just asking *what* he believed, but *what counted as knowledge* for him.

  ***

  **PROJECT PROPOSAL**

  **Title:** The License to Believe: Causal Criteria and Demarcation in Kepler's Astrological Practice

  **Research Question**
  Does Johannes Kepler's reform of astrology rest on a consistent epistemic criterion requiring a physical-geometric cause for astrological influence, such that claims lacking such a cause are rejected regardless of empirical track record, and claims possessing it are endorsed regardless of traditional prohibition?

  This question is designed to be falsifiable. The hypothesis fails if: (1) Kepler endorses a specific prediction explicitly admitting no causal mechanism exists; (2) Kepler rejects a prediction despite providing a satisfactory causal-geometric account; or (3) the criterion proves so flexible that it accommodates every instance of his practice post-hoc.

  **Context and Existing Readings**
  Current scholarship on Kepler's astrology generally falls into three narratives, none of which address the epistemic criteria proposed here.
  1.  **Kepler as the Last Magus:** This reading emphasizes his Neoplatonic commitments and treats his astrology as part of a holistic, animistic worldview. It explains *why* he was open to astrology, but treats his specific judgments as expressions of belief rather than regulated inference. It leaves open whether he applied consistent rules to that belief.
  2.  **Kepler as the First Modern:** This narrative frames him as a proto-skeptic who used astronomy to cleanse astrology of superstition. It tends to view his astrological work as a reluctant concession to the era. It fails to explain why he actively refined astrological rules rather than simply discarding them, and ignores cases where he confidently predicts using astrological data.
  3.  **Kepler as the Paid Cynic:** This socio-economic reading suggests his astrological work was purely performative for patrons (e.g., Wallenstein). While it accounts for his output, it cannot explain the internal coherence of his theoretical writings where he explicitly argues against profitable but "causeless" traditional rules.

  All three readings focus on Kepler's *attitude* toward astrology (belief, skepticism, or cynicism). None analyze the *structure of justification* he employed. They leave open the possibility that Kepler operated with a distinct demarcation criterion that separated "scientific" astrology from "superstitious" astrology, a distinction this project aims to reconstruct and test.

  **Methodology and Timeline**
  This project employs a two-stage reconstructive method over nine months.

  *Months 1–3: Criterion Reconstruction.*
  I will analyze Kepler's theoretical texts on astrological foundations to extract his explicit conditions for admissibility. I am looking for passages where he distinguishes between "valid" aspects (e.g., trines, sextiles) and "invalid" ones based on geometric demonstrability or physical causation (light, harmony). The output will be a formalized set of necessary and sufficient conditions for a valid astrological claim according to Kepler.

  *Months 4–6: Corpus Testing.*
  I will apply this reconstructed criterion to a corpus of his practical astrological writings. This includes year-by-year prognostications where he forecasts political or weather events, and specific nativity charts (including the Wallenstein horoscope). I will code each prediction: Does it offer a causal story? Does it rely solely on traditional authority? Does it rely on empirical past success? I will then compare the presence/absence of the causal criterion against Kepler's endorsement or rejection of the claim.

  *Months 7–9: Analysis and Writing.*
  Synthesis of findings. If the criterion holds, I will argue Kepler is a reformer operating with a philosophy of science distinct from his contemporaries. If it fails, I will map the inconsistencies to show where his practice diverged from his theory.

  **Justification of Approach**
  An intellectual biography is insufficient because it tracks the evolution of belief rather than the logic of practice. A survey of early-modern arguments on astrology's legitimacy is too broad; it would establish the context but not test Kepler's specific consistency. This project isolates the *logic of licensing* within a single actor's corpus. This satisfies the historian's need for contextual specificity and the philosopher's requirement for a testable demarcation criterion.

  **Deliverables and Success Criteria**
  A successful thesis will produce a "Decision Matrix" of Kepler's astrological claims. This will be a table categorizing specific predictions by: (1) Traditional Validity, (2) Causal Mechanism Provided, (3) Empirical Track Record, and (4) Kepler's Verdict.
  Success looks like a high correlation between "Causal Mechanism Provided" and "Kepler's Verdict," even when controlling for Tradition and Empirical Track Record. This would demonstrate that mechanism, not tradition or success, was the primary license for belief.

  **Risk and Failure Modes**
  This project carries three specific risks of collapse:
  1.  **The Post-Hoc Risk:** The criterion may be stated so loosely in the theoretical texts that any practical decision can be retrofitted to match it. If I cannot define the mechanism requirement independently of the verdict, the thesis is unfalsifiable.
      *   *Mitigation:* I will define the criterion in Phase 1 using only theoretical texts, blind to the practical outcomes in Phase 2.
  2.  **The Ubiquity Risk:** It may turn out that demanding a physical cause was standard for any competent astronomer of the period, making Kepler unexceptional.
      *   *Mitigation:* The scope is limited to Kepler's internal consistency. Even if he is not unique, proving he operated consistently on this basis is a contribution. However, I will include a comparative note on a contemporary critic (e.g., Pico or a strict Aristotelian) to gauge distinctiveness.
  3.  **The Source Gap:** There may be insufficient cases where Kepler rejects a prediction despite apparent confirmation, or accepts one without tradition.
      *   *Mitigation:* If the corpus of refusals is too small, the thesis will shift to a reconstruction of his *attempted* reform, analyzing why the reform failed to produce clear refusals in practice.

  **Scope and Language Constraints**
  I read Latin slowly and do not read German. A significant portion of Kepler's astrological corpus remains untranslated from German (particularly some provincial calendars and specific correspondence).
  *   *Included:* Major Latin theoretical works on astrology (available in critical editions with facing-page translations) and major prognostications available in English translation.
  *   *Excluded:* Untranslated German ephemera and archival correspondence requiring paleographic expertise.
  *   *Impact:* This limits the statistical robustness of the "corpus testing" phase. To mitigate this, I will focus on depth over breadth, selecting five to ten high-stakes case studies (e.g., the Wallenstein nativity, specific weather predictions) where the text is rich enough to analyze the reasoning process, rather than attempting a quantitative survey of every minor prediction. This ensures the philosophical analysis remains rigorous despite the linguistic constraint.
