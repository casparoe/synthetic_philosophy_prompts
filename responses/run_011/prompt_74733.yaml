answer: |-
  There is no single canonical term in the literature that captures this configuration precisely, because standard organizational theory assumes that when a measure stops working, it is either corrected or hidden. Your description identifies a stable system where the measure's inefficacy is an open secret and a functional feature.

  To carve this out, we must combine three existing concepts and then mark where your observation exceeds them.

  ### 1. The Near Misses

  **Institutional Decoupling**
  *   **The Concept:** In sociology (Meyer & Rowan), this describes when organizations separate their "formal structure" (policies, metrics) from their "actual work" to maintain legitimacy. They adopt rules to look compliant to the outside world but ignore them internally to get things done.
  *   **Why it misses:** Decoupling usually implies *concealment*. The organization hides the gap between policy and practice to avoid scrutiny. In your case, the gap is not hidden; it is the "shared background" of the auditors, coaches, and claimants. The scrutiny *accepts* the gap.
  *   **The Boundary:** If the auditors punished the team for not fixing the metric, it would be decoupling. Because the auditors accept the inert metric as sufficient evidence, it is something else.

  **Legibility (Seeing Like a State)**
  *   **The Concept:** James C. Scott describes how states simplify complex social realities into standardized data (maps, census, land titles) to manage them. The data doesn't need to be perfectly true; it needs to be *uniform*.
  *   **Why it misses:** Legibility explains why the record is kept (to make the claimant visible to the state), but it doesn't explain why the *activity* required to generate the record is causally inert. The state could demand legible records of *effective* actions.
  *   **The Boundary:** Legibility becomes your phenomenon only when the demand for standardization overrides the demand for efficacy, and this override is stable rather than a failure.

  **Signaling Theory**
  *   **The Concept:** In economics, an action is taken not to produce a result, but to convey information (e.g., a degree signals intelligence, not just knowledge).
  *   **Why it misses:** Signaling usually implies the actor benefits from the signal (the claimant gets the job). Here, the signal benefits the *system* (the contract manager gets audit approval; the state gets moral cover).
  *   **The Boundary:** This is not a signal from claimant to employer; it is a signal from claimant to bureaucracy, and from bureaucracy to itself.

  ### 2. The Configuration: "Consensual Decoupling" for "Moral Sorting"

  The configuration you describe is best understood as **Consensual Decoupling** serving a function of **Moral Sorting**.

  **Consensual Decoupling:** Unlike standard decoupling, where the gap is a secret, here the gap is a negotiated settlement. The claimant trades meaningless labor for continued benefits; the coach trades meaningless auditing for job security; the system trades meaningless data for political cover. No one admits the decoupling, but no one acts to close it.

  **Moral Sorting:** This addresses your "deep suspicion." In welfare systems, the state often faces a tension between *support* (helping people) and *rationing* (limiting access). If the metric were effective (actually got people jobs), it would solve the support problem but fail the rationing problem (everyone might qualify, or success would be random).
  If the metric is *inert* but *burdensome*, it becomes a perfect filter. It sorts the population into:
  1.  **The Compliant:** Those willing to perform the ritual (deemed "deserving" of continued support).
  2.  **The Non-Compliant:** Those who refuse or fail the ritual (deemed "undeserving," sanctionable).

  The inertness is the point because it ensures the *only* variable is compliance, not employability. It transforms the system from an employment engine into a **Deservingness Audit**.

  ### 3. Boundary Testing Your Cases

  To tighten the definition, we apply it to your test cases.

  **A Workplace Timesheet (Everyone knows it measures nothing)**
  *   **Verdict:** **Yes, this qualifies.**
  *   **Reasoning:** If the timesheet is used solely to verify presence for payroll, and everyone knows presence does not correlate with productive output, it is a legible trace of compliance, not productivity. It protects the employer (we paid for time) and the employee (I was here). It is inert regarding output, load-bearing regarding liability.

  **A School's Homework-Completion Statistics**
  *   **Verdict:** **No, usually does not qualify.**
  *   **Reasoning:** Homework is officially instrumental (learning). If teachers know it doesn't help learning but assign it anyway, it *approaches* your configuration. However, schools usually retain the *belief* in efficacy (teachers think it helps, even if data says otherwise). Your case is distinct because the *causal link is known to be broken* by all parties. If the school administration knew homework didn't help but kept it solely to rank students by obedience, it would qualify.

  **A Religious Observance**
  *   **Verdict:** **No, excluded.**
  *   **Reasoning:** You correctly identified the distinction. In religion, the act is often *expressive* or *devotional*, not instrumentally causal in a material sense. Praying for rain is not a bureaucratic metric; it is a ritual. Your configuration requires an **Official Instrumental Claim** (this will get you a job) that contradicts the **Practical Knowledge** (this will not get you a job). Religion does not usually claim material causality in a verifiable way that can be falsified by the participants.

  ### 4. The Term: "Legible Inertia"

  Since no existing term captures the *intentional stability of the inefficacy*, I propose the term **Legible Inertia**.

  **Definition:**
  A bureaucratic requirement where the mandated activity is causally inert regarding the stated public goal, but strictly enforced to generate a standardized record. The inertness is not a failure of design but a feature of stability, allowing the system to prioritize **moral classification** (compliance vs. non-compliance) over **outcome distribution** (success vs. failure).

  **Criteria for Legible Inertia:**
  1.  **Open Inefficacy:** All parties (subject, agent, auditor) know the activity does not achieve the stated goal.
  2.  **Official Instrumentalism:** The system officially claims the activity *does* achieve the goal (distinguishing it from ritual).
  3.  **Trace Dependence:** The value of the activity lies entirely in its ability to be recorded and counted (distinguishing it from actual work).
  4.  **Sorting Function:** The record is used to classify subjects (deserving/undeserving) rather than to change their material condition.

  ### 5. Addressing the "Deep Suspicion"

  You asked if there is a concept for the suspicion that the real product is a **legible record of effort** used to sort claimants.

  In political economy, this is often referred to as **Administrative Rationing** or **Bureaucratic Gatekeeping**. However, the specific mechanism you identified—where the *inertness* protects the system from distributional consequences—is a specific variant.

  If a program actually worked, it would create winners and losers based on *employability*. This is politically risky (why did he get a job and I didn't?).
  If a program is inert, it creates winners and losers based on *compliance*. This is politically safe (he didn't get a job because he didn't log the searches).

  This converts a **Material Problem** (unemployment) into a **Moral Problem** (laziness/non-compliance). The concept for this is **Problem Displacement**. The "Legible Inertia" is the tool that enables the displacement. The paperwork is not evidence of work; it is evidence of **subjugation**. It proves the claimant has accepted the state's authority to define what "trying" looks like.

  So, to answer your final question: The inertness is not a defect. It is a **Liability Shield**. It protects the state from the claim that it failed to provide jobs, and it protects the system from the claim that it is unfair. It creates a **Defensible Record** that allows the state to say, "We offered the pathway; you did not walk it," regardless of whether the pathway led anywhere.

  **Summary:**
  You are describing **Legible Inertia**: a system of **Consensual Decoupling** where the metric is retained specifically because its inertness allows for **Moral Sorting** without risking **Outcome Variance**. It is not a measure of employment potential; it is a measure of administrative submission.
