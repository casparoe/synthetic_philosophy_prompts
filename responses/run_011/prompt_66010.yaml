answer: |-
  **Case A: Ostrakon North (Sector 4)**
  Stratigraphy confirms a 50-year aridity pulse coincident with tephra Layer V. Prior to Layer V, central settlement density is high (120 ha); post-V, capital abandoned, settlement disperses into 400+ isolated farmsteads (avg. 0.5 ha). Monument construction ceases entirely; script usage drops to zero. However, faunal assemblages indicate dietary breadth increases (marine protein +40%, wild taxa +25%). Storage capacity per household rises 300%. Osteological samples (n=150) show enamel hypoplasia frequencies decline from 18% to 4%; mean adult stature increases 2cm. Population estimates remain stable (±5%). Ceramic typology and burial rites show unbroken continuity. *Anomalous datum:* Standardized lithic weights appear in 40% of dispersed farmsteads post-V, suggesting retained计量 systems despite script loss.

  **Case B: Ostrakon South (Sector 9)**
  Stratigraphy confirms identical 50-year aridity pulse (Layer V). Central settlement density remains constant (110 ha); palace complexes show continuous repair cycles. Administrative sealings increase 200%; script usage intensifies. Conversely, pollen records indicate severe deforestation and soil erosion. Osteological samples (n=150) show enamel hypoplasia frequencies rise from 12% to 35%; mean adult stature decreases 4cm; infant mortality doubles. Population estimates decline 33%. Ceramic typology remains consistent; burial rites shift toward mass interments. *Anomalous datum:* Monument volume per capita falls 60%, even as administrative record volume peaks.

  ***

  **Analysis**

  **Theoretical Verdicts**
  In **Case A**, the **Tainterian** identifies collapse: sociopolitical complexity (monuments, script, centralization) evaporates. They view this approvingly as rational economizing; the marginal return on complexity went negative during drought, so shedding it improved resilience. The **Diamondian** sees no collapse: the resource base recovered, and population stabilized. The **Deflationist** sees reorganization: continuity in pottery and burial proves cultural survival; "collapse" is a pejorative label for decentralization. The **Well-being-first** theorist sees improvement: per capita health metrics rose; calling this collapse is morally incoherent.

  In **Case B**, the **Diamondian** and **Well-being-first** theorist both identify collapse. The resource base is degraded, population crashed, and bodies show systemic stress. The event is a catastrophe regardless of institutional persistence. The **Tainterian** says "not yet": complexity (palaces, records) is maintained. This is pre-collapse stress; collapse occurs only when the administrative machinery fails. The **Deflationist** refuses the word: the state persists, records continue, and the system functions. To call this collapse is to impose a moral judgment on suffering rather than describing systemic failure.

  **Critical Evidence & Removal**
  In **Case A**, the Tainterian verdict hinges on the **cessation of script and monuments**. If these are made ambiguous (e.g., script becomes undatable, monuments reclassified as domestic), the Tainterian loses the signal for complexity loss. They must concede this might be "transformation," aligning with the Deflationist.
  In **Case B**, the Diamondian/Well-being verdict hinges on **osteological stress and population decline**. If isotopes are undatable or burial demographics are deemed unrepresentative, the human cost becomes invisible. The Diamondian must retreat to ecological proxies alone (weaker), and the Well-being theorist loses their primary metric. Both might defer to the Tainterian's institutional continuity.

  **Theoretical Attacks**
  The **Tainterian** attacks Case B by arguing complexity is the buffer, not the burden. Palaces coordinating storage during famine explain the survival of the remaining 67%. Calling this collapse ignores the counterfactual: without complexity, mortality would be 100%.
  The **Deflationist** attacks both cases by arguing "collapse" is a narrative trope, not an ontological category. In A, it privileges centralization over household autonomy. In B, it privileges biological metrics over political continuity. They argue we should describe specific transformations (decentralization, stress) rather than using a totalizing word that implies an endpoint.

  **The Empty Cell**
  I deliberately left empty the cell where **complexity rises and well-being rises**. This is the "Golden Age" or "Growth" scenario. It is not empirically empty—history contains periods of intensification without immiseration—but it is conceptually inert for this seminar. No one argues "growth" is a pejorative label needing deconstruction. It serves as the null hypothesis: if collapse is the problem, this is the assumed normal. However, a rigorous theorist might argue this cell is unstable long-term; if Tainter is right, complexity *always* eventually encounters negative marginal returns, making this cell a temporary transient state rather than a stable equilibrium.

  **Ontological Conclusion**
  Does "collapse" pick out something real? After running these cases, the answer is no. "Collapse" is not a natural kind like "volcano" or "drought." It is the name of a place where four metrics (complexity, ecology, continuity, well-being) disagree. In Case A, complexity and well-being diverge. In Case B, institutions and bodies diverge. To use the word is not to describe an event, but to choose which metric matters most. The students must earn the realization that there is no view from nowhere: to declare a collapse is to declare a priority.
