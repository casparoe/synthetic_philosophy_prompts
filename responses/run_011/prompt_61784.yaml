answer: |-
  Dear colleague, I think your hypothesis is largely correct, but it misses a crucial layer regarding the divergent engineering goals that are masquerading as a philosophical dispute. You are right to identify this as a fight about criteria of identity, specifically whether we are individuating mechanisms by their causal role, their computational algorithm, or their physical substrate in the weights and activations. When the first camp says the mechanism is the same, they are committing to a functionalist view where the mechanism is defined by what it does to the information flow, akin to saying a heart is a heart whether it is biological or mechanical so long as it pumps blood. The second camp is committing to a materialist or implementational view, arguing that without a stable basis, you cannot point to the heart itself, only to the pumping action, and that for safety cases you need to know exactly which neurons to monitor rather than just knowing that pumping occurs. This is not merely a verbal dispute about the word same, because it dictates what counts as evidence; for the functionalist, similar ablation profiles are sufficient proof of identity, whilst for the implementationalist, feature overlap in a stable basis is the only proof that matters. The stalemate arises because neither side is willing to concede that their definition of mechanism serves a different master, with the first camp aiming for scientific understanding of convergence and the second aiming for reliable auditing tools.

  The concrete fight you described over the sibling models perfectly illustrates this category error. The first person found a story with forty features across three layers using a sparse autoencoder and attribution patching, while the second found overlapping features in different layers using a different method, yet both saw a similar ablation profile. The first person claims identity based on the causal story and the ablation effect, effectively saying the algorithm is the same even if the registers holding the variables have shifted. The second person claims difference because the physical locus has moved, arguing that if the features are in superposition and the basis is not unique, you cannot guarantee that what you are ablating in model B is truly the same computational unit as in model A, even if the output looks similar. They are talking past one another because one is measuring functional equivalence and the other is measuring representational stability. Your intuition that there is a hidden empirical question underneath is the most important part of your diagnosis, because the philosophical disagreement would dissolve if we knew the degree to which training dynamics constrain the solution space. If convergent training occupies a tiny volume of model space, the implementationalist worry matters less because the features will naturally align. If the volume is large and chaotic, the functionalist hope for transferable detectors is dead unless we can find invariant properties that survive basis changes.

  To move forward, you need to stop asking whether it is the same mechanism and start asking whether the detector transfers with sufficient fidelity for your safety case. Progress here will not come from a formal result about subgraph isomorphism modulo a change of basis, because the non-linearity and superposition in transformers likely make such a theorem impossible to state cleanly, let alone prove. Instead, you need an operational definition of mechanism transfer that is tied to your end goal. If your goal is to detect deceptive reporting, you should define success as the ability of a detector trained on model A to flag deceptive inputs in model B with a false positive rate below a certain threshold, regardless of whether the internal features match. This shifts the burden from proving identity to proving utility. You should design an experiment that decouples function from implementation by training a large family of models on the same task with different seeds and slight architectural variations, then measure the decay in detector performance against the decay in feature overlap. This would give you an empirical curve showing how much representational drift you can tolerate before functional detection fails.

  If that experiment shows that functional detection survives even when feature overlap is near zero, then the first camp wins on practical grounds and you should focus on behavioural probes rather than mechanistic ones. If detection fails as soon as features drift, then the second camp is right and cross-model mechanistic detection is likely a dead end for frontier models where you cannot access the training data to align bases. In that case, you should change the question entirely and focus on within-model interpretability or training-time constraints rather than post-hoc detection. I suspect you will find a middle ground where high-level functional circuits transfer but low-level features do not, which suggests you need a tiered definition of mechanism. You should propose a distinction between functional mechanisms, defined by input-output mappings and causal graphs, and implementational mechanisms, defined by specific neurons and weights. Your working group should then agree to specify which tier they are discussing in every claim, which will eliminate the verbal dispute.

  Ultimately, I believe you should spend the next year on the empirical sweep I described rather than trying to resolve the philosophical definition. The question is not ill-posed, but it is currently under-specified relative to the safety goal. If you cannot show that detectors transfer across siblings with high fidelity, you certainly cannot show they transfer across generations or architectures, and you ought to pivot to methods that do not rely on cross-model stability. The bedrock intuition clash is real, but it is secondary to the empirical reality of how much neural networks converge. If the convergence is weak, no amount of philosophical wrangling about identity will save the project, and you will have your answer on whether to continue. I recommend you draft a proposal that frames the problem as measuring the transferability of safety properties rather than the identity of mechanisms, as this forces the group to confront the empirical constraints directly without getting bogged down in metaphysics.
