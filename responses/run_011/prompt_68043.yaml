  **Severity: Critical.** This is the "three things that can't be true" your friend spotted. If you say all three at the mic, your argument self-destructs.

  *   **The Conflict:**
      *   **#1:** Living people aren't to blame.
      *   **#2:** The District (the organization) is the one that apologizes.
      *   **#3:** Institutions don't act; only people do.
  *   **Why it breaks:** If #3 is true (District = just people), and #1 is true (people = not to blame), then the District = not to blame. But #2 requires the District to accept responsibility. You cannot hold the District accountable while insisting it is *only* the innocent people currently running it.
  *   **Cheapest thing to give up:** The philosophical literalism of **#3**.
  *   **Sentence to stop saying:** *"Institutions don't literally act, that's just how we talk."*
  *   **Cost to you:** You lose the clever observation that corporations aren't real.
  *   **Gain:** You create a "corporate veil." The District becomes a continuous entity that can hold responsibility *separate* from the individuals currently employed there. This protects current staff (#1) while allowing the organization to apologize (#2).

  ### 2. The Resource Trap (Practical Contradiction)
  **Severity: High.** This isn't logically impossible, but it's politically naive. It gives the Board an easy excuse to ignore you.

  *   **The Conflict:**
      *   **#5:** The apology must cost the District something it cares about (non-cash).
      *   **#8:** Current students shouldn't lose anything (budget, programs, time).
  *   **Why it breaks:** District resources are finite. If they give up something they value (e.g., the bus garage), they must move the buses. That costs money. If it costs money, it hits the budget. If it hits the budget, it risks programs. You are demanding a sacrifice (#5) while forbidding the sacrifice from touching the District's primary stakeholders (#8).
  *   **Cheapest thing to give up:** The absolute guarantee in **#8**.
  *   **Sentence to stop saying:** *"Current students shouldn't lose anything over this."*
  *   **Cost to you:** You admit that doing the right thing might have ripple effects.
  *   **Gain:** Credibility. You sound like you understand how budgets work. You can pivot to: "Students shouldn't be *penalized*, but we can't expect justice to be free."

  ### 3. The Ghost Conflicts (Apparent Only)
  **Severity: Low.** These look like fights but aren't.

  *   **#1 vs. #5 (Guilt vs. Cost):** You worry that if no one is to blame (#1), there's no reason to pay a cost (#5).
      *   *Resolution:* Distinguish **Guilt** (moral sin of individuals) from **Liability** (obligation of the entity). A company can pay restitution for a spill without the current CEO being personally guilty. Keep both, just clarify the terms.
  *   **#2 vs. #3 (Entity vs. People):**
      *   *Resolution:* Solved by killing #3 (see above).
  *   **#4 vs. #7 (No Excuses vs. Looking Good):**
      *   *Resolution:* Owning a wrong flat-out (#4) is actually the best way to look good (#7). No conflict.

