  4.  **Task 2: Disanalogies (Signal vs. Noise):**
      *   *Noise:* Mathematical formalism (groups vs. manifolds), classical vs. quantum context.
      *   *Signal (Matter of Consequence):*
          1.  *Empirical Access:* We can't observe manifold points directly anyway. We *think* we can track particles (classically), but QM says no.
          2.  *The nature of the "Indeterminism":* In the Hole Argument, the indeterminism is *radical* (future metric values undetermined by past data). In QM permutations, it's about counting states (Gibbs paradox territory), not dynamical evolution failure.
          3.  *Metaphysical Cost:* Denying manifold substantivalism feels like denying the stage exists. Denying particle individuality is standard QM orthodoxy.
          4.  *Active vs. Passive:* Diffeomorphisms can be viewed as gauge (passive) or active shifts. Permutations are active swaps.

  5.  **Task 3: Verdict on Leibniz Equivalence (LE):**
      *   *QM Permutations:* LE is built into the formalism (symmetrization postulate). It's arguably a "free notational move" *within* standard QM, though it implies a metaphysics of non-individuals.
      *   *Hole Argument:* LE (identifying diffeomorphic models) is *not* automatic in the math. The math allows distinct models. Identifying them requires a *interpretive* stance (Sophisticated Substantivalism). It is a substantive metaphysical concession (giving up "manifold substantivalism").
