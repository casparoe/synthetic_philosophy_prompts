      *   *Leibniz Shift:* Classical mechanics. Shift all matter in absolute space. Indiscernible states. Argument against absolute space.
      *   *Quantum Permutations:* Identical particles. Swapping labels doesn't change the physical state (Bose-Einstein/Fermi-Dirac statistics vs. Maxwell-Boltzmann).
      *   *The Professor's Analogy:* Diffeomorphism $\approx$ Particle Permutation. Identifying models $\approx$ Identifying permuted states.
      *   *Critique:* This is a standard move in the philosophy of physics (often associated with "Sophisticated Substantivalism" or structural realism). However, it's controversial. The "indeterminism evaporates" claim is the standard Earman/Norton conclusion *if* you accept Leibniz Equivalence. The deep question is whether accepting LE is trivial or costly.

  3.  **Task 1: The Mapping:**
      *   *Shift Argument:* Translation in absolute space.
      *   *Hole Argument:* Diffeomorphism (specifically, one that is identity outside the "hole" but non-trivial inside).
