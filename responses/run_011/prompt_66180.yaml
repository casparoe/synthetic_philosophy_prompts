answer: |-
  The Parfitian reading asks, "Is Leonard the same person from moment to moment?" The Buddhist reading asks, "Who is the 'I' that claims to be Leonard at all?" This is not merely a vocabulary swap; it shifts the entire ethical gravity of the film. Parfit is concerned with moral responsibility across psychological discontinuities. Buddhism is concerned with the suffering generated by the insistence on continuity where there is none. If you run *Memento* through *anatta* (no-self), Leonard ceases to be a tragic victim of a broken brain and becomes a horrifying example of a being who has stumbled into the truth of conditionality but uses it to deepen his delusion.

  The analogy with the *Milinda Panha* holds up remarkably well on the structural level. Just as the chariot is merely a designation for an assemblage of axle, wheels, and frame, Leonard is a designation for an assemblage of tattoos, Polaroids, and habits. He is the five aggregates (*skandhas*) walking around in a Jaguar. His body (form) is a canvas for instructions; his feelings are blunt instruments of pain and satisfaction; his perceptions are hacked by his system; his mental formations are the rigid rules he lives by; his consciousness is a fifteen-minute loop. He is a conditioned stream, not a substance.

  However, this is where the film resists the doctrine. In a Buddhist context, realizing the chariot is empty is the beginning of liberation. For Leonard, realizing (implicitly) that he has no center is the beginning of a prison. He does not see the emptiness of the self; he sees a void that must be filled with narrative. The film presents this as a tragedy of damage, implying there *should* be a continuous self that was lost. A Buddhist reading flips this: there never was a self to lose, only a process that has become unskillful. Leonard isn't a broken person; he is a perfect machine of *samsara*. He is the *puthujjana* (worldling) par excellence, constructing a "self" out of ink and paper because the raw flow of experience is too terrifying to inhabit without a story.

  This distinction clarifies the ending. In chronological order, Leonard chooses to ignore the truth. He knows he has already killed the real John G., and he knows Teddy is telling him the truth. Yet, he decides to set Teddy up as the next target. On a Parfitian account, this is a present stage harming a future stage. It's a contractual breach between temporal slices. On a Buddhist account, this is *karma* in its most potent form. It is not about harming a "victim" in the future, because the victim is just as empty as the perpetrator. It is about the volition (*cetana*) driving the stream. Leonard chooses *avidya* (ignorance) over wisdom. He chooses *tanha* (craving for vengeance/meaning) over cessation.

  This makes Leonard's final act not just unethical, but spiritually catastrophic. He is manufacturing a future of suffering for the sake of maintaining a present identity. He says, "I have to believe in a world outside my own mind." This is not a decent Buddhist move; it is the definition of *upadana* (clinging). A Buddhist practice might involve observing the impermanence of memory and letting go of the need for a coherent narrative. Leonard does the opposite: he rigidifies the narrative. He turns the fluidity of no-self into a weapon. He lives the metaphysics of no-self (he resets, he changes, he is conditioned) without the ethics of no-self (compassion, non-attachment). He gets all the *dukkha* (suffering) of a fragmented existence with none of the liberation. He is a ghost haunting a machine he built to pretend he's alive.

  The Sammy Jankis story fits here as a karmic narrative. Leonard retells Sammy's story until it overwrites his own memory. He projects his own failure onto Sammy to absolve himself. In Buddhist terms, this is the fabrication of *sankhara*. He is weaving a knot of cause and effect that traps him. He tells the story not to reveal truth, but to sustain the illusion of a moral agent who is "hunting" rather than "killing." The story is the glue holding the aggregates together. If he stops telling it, the chariot falls apart, and he has to face the silence. The horror of *Memento* is that Leonard would rather murder an innocent man than face the silence of no-self.

  So, where does the analogy break? It breaks on the affective tone. Buddhism views the realization of no-self as the end of suffering. Nolan presents the fragmentation of self as the *cause* of suffering. The film assumes a substantial self as the normative baseline; Leonard is a deviation. Buddhism says Leonard is the norm; we are all just forgetting our amnesia. The film asks us to pity Leonard for his lack of continuity. A Buddhist reading asks us to pity Leonard for his attachment to continuity. The film is a horror story about what happens when you strip away the illusion of self but keep the ego's desires. It is a warning: if you realize there is no driver in the car, but you still want to drive somewhere, you will crash.

  For the meetup, you want scenes that expose the mechanics of this construction and the choice of delusion.

  **1. The Tattoo Sequence (Leonard applying the "Fact 6" tattoo)**
  Screen the scene where Leonard is tattooing himself. Watch how he treats his own body as an external hard drive. He is literally carving a narrative into the aggregates of form. Discuss how this mirrors the construction of self-view (*sakkaya-ditthi*). He is turning his skin into a text to be read by a future stranger who is also him. Ask: Is this a skillful means of navigating a broken mind, or is it the physical manifestation of clinging? He is refusing to let the moment pass; he is solidifying the fluid into stone.

  **2. The Monologue in the Derelict Building ("I have to believe...")**
  This is the theological core of the film. Leonard explains why he must ignore Teddy's truth. He admits he might be lying to himself, but he chooses the lie because it gives him purpose. This is the precise moment he chooses *samsara*. Discuss the line: "We all need mirrors to remind ourselves who we are." In Buddhism, the mirror is a trap. Leonard admits the mirror is fake but keeps looking into it. This is the best scene to debate whether "meaning" is a necessary fiction or a shackle.

  **3. The Final Chronological Shot (Leonard walking away from Teddy's body)**
  After he decides Teddy is John G., he sends himself a note ("Get a license plate") and walks toward the next cycle. He has just generated bad karma knowingly. He is setting the wheel in motion again. Discuss the smile on his face. It's not a smile of joy; it's a smile of relief that the puzzle is reset. He has successfully avoided liberation. He has chosen the puzzle over the peace. This is the visual of a being choosing rebirth over nirvana because rebirth is more interesting.
