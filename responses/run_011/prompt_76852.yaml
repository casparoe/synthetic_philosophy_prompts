  Two isolated towns, Alpha and Beta, are physically identical: same geology, same native species. Identical twins raised there work in identical grocery stores. Both sell frozen fillets labeled "Salmon." The fillets are morphologically indistinguishable. Alpha's stock is sourced exclusively from Pacific populations (*Oncorhynchus*); Beta's from Atlantic populations (*Salmo*). The twins have identical neural states regarding "Salmon."

  **Design:** Alpha's "Salmon" refers to *Oncorhynchus*; Beta's to *Salmo*. The extra fact is the causal-historical lineage of the specimens. This fact lives in the supply chain and breeding history, outside the twins' heads and outside the towns' immediate fixed physics. A fully informed internalist knowing every neural state and town rock would still miss the sourcing history.

  **Feature:** The causal grounding of natural kind terms. If deleted (i.e., if reference depended only on internal concepts or local appearance), the verdicts collapse into a description theory ("fish that looks/tastes like this"), making the extensions identical. It avoids ordinary Twin Earth because there is no hidden microstructure swap in the *town*, only in the *history* of the objects. It avoids social/arthritis cases because the difference is biological, not communal definition.

  **Internalist Counter:** The internalist argues "Salmon" is ambiguous or functional: it means "edible fish with these sensory properties." She claims the environment pulls no weight; only the twins' concepts matter. She might say the word is simply ambiguous between two biological kinds that share a name.
  **Rebuttal:** This fails because biological kind trumps appearance. If a synthetic fillet matched all sensory properties, it wouldn't be salmon. If a malformed *Oncorhynchus* looked nothing like salmon, it would. The term tracks lineage, not just concepts. The internalist misses that reference is anchored by historical baptism, not just current mental content. The difference falls out of the sourcing history, not stipulation. Externalism here is about dependence on history, not liquids.
