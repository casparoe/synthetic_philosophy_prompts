answer: |-
  To answer your question directly: the American Spoils System episode defeats the **Public Office (Legalistic)** account and embarrasses the **Public Interest (Utilitarian)** account. The account that does the best work is the **Institutional Dependence Account**.

  This account defines corruption not as breaking a law (which can be changed to permit corruption) or harming an abstract welfare (which is contested), but as **the subversion of a public institution's purpose by private or partisan dependencies.** It asks: *To whom is the officeholder answerable, and does that answerability compromise the function of the office?*

  Here is how that account handles the facts you provided, the defenses offered, and the limits of the theory itself.

  ### 1. Applying the Institutional Dependence Account

  **Which account and why?**
  The **Public Office** account fails because, as you note, the spoils system *was* the rule for decades. If corruption is rule-breaking, Jackson and his successors were not corrupt; they were following the operational manual of the early republic. The **Public Interest** account fails because both sides claimed it. Patronage men argued party rotation *was* the public interest (preventing aristocracy, ensuring loyalty); Reformers argued efficiency *was* the public interest.

  The **Institutional Dependence Account** succeeds because it isolates the structural relationship. It posits that a public office is corrupted when the conditions of holding it make the officer dependent on a particularistic interest (a party boss, a donor) rather than the institutional mandate (administering the law).

  **Who was corrupt on this account?**
  *   **The Patronage Men:** They were corrupt because they converted public authority into party property. By making federal employment contingent on campaign work and assessments, they made the officeholder dependent on the party machine, not the public function. The Guiteau assassination of Garfield is the extreme endpoint of this dependence: an office seeker viewing the state as a vending machine for party rewards.
  *   **The Reformers (Partial Corruption):** This is where the account earns its keep. While the Pendleton Act reduced partisan dependence, the *application* of merit rules in the South reintroduced a different dependence. By using cultural examinations and "merit" standards that Black officeholders (who had gained posts through Reconstruction patronage) could not easily meet, the new system made the Civil Service dependent on *class and racial hierarchy*. The institution's purpose shifted from "party service" to "class exclusion."

  **Does the account let the patronage men speak coherently?**
  Yes, but only historically. The patronage men can coherently argue that they operated under a different **institutional theory**: that in a democracy, offices should rotate to prevent a bureaucratic aristocracy, and that party work is a legitimate form of civic participation.

  However, the Institutional Dependence Account judges them from the outside of *their own* claimed purpose. If the purpose of the Post Office is to deliver mail, and the purpose of the Customs House is to collect revenue, the spoils system corrupted those functions by prioritizing party loyalty over competence. The cost of this judgment is **anachronism**. It imposes a later understanding of "bureaucratic neutrality" on an era that viewed "political representation" as the primary function of administration. The account must admit that the *definition of the institution's purpose* changed between 1830 and 1890.

  ### 2. Running It Back: Testing the Account

  Does this episode confirm the account, embarrass it, or show it was never designed for cases like this?

  **It confirms the account's flexibility but exposes its vulnerability to power.**
  The episode shows that corruption is not a "fixed content" in the sense of a universal moral atom, but it is also not merely a "label" applied by winners. It is a **contest over institutional purpose that hardens into fixed content after a crisis.**

  *   **Fixed vs. Label:** The Spoils System proves corruption is not just a label. If it were merely a label, the Reformers' victory would just be a semantic shift. But the Garfield assassination demonstrates a *material breakdown* caused by the dependency. The system physically failed. However, the content *did* shift. What was "virtue" (rotation) in 1830 was "corruption" in 1890. The Institutional Account captures this by tracking the *normative shift* in what the state is supposed to do.
  *   **Gift Economy vs. Corruption:** You asked if an account that can't distinguish the spoils system from a functioning gift economy is of use. The Institutional Account *can* distinguish them. A gift economy operates on reciprocal obligation within a social fabric. Corruption operates when that obligation **captures the state's coercive power.** The patronage system wasn't just neighbors exchanging favors; it was the state taxing its own employees to fund the party (assessments) and denying services to opponents. The distinction holds: when private obligation dictates public action, it is corruption.
  *   **Do Standards Travel?** The Pendleton episode suggests standards **do not travel well without enforcement mechanisms.** You noted that Postmasterships and Custom Houses stayed political for decades, and traffic moved to contracting. The Institutional Account explains this: the *norm* of meritocracy was established, but the *dependency* simply migrated to unclassified positions and campaign finance. The standard didn't travel to the South, where "merit" became a tool for racial exclusion. This shows that "anti-corruption" standards are not universal vaccines; they are specific institutional arrangements that can be captured for new corrupt ends.

  ### 3. Where the Accounts Go Quiet

  To finish the diagnostic, here is where the competing accounts fall silent when faced with your facts:

  *   **The Public Office (Legalistic) Account:** Goes quiet on the **Black officeholders**. Legally, the Pendleton Act was neutral. It did not explicitly ban Black workers. A legalistic account cannot see the corruption of exclusion because no law was broken; the "merit" standard was the weapon. It also goes quiet on the pre-1883 era, forced to admit that legal patronage wasn't corruption, missing the systemic rot that killed Garfield.
  *   **The Public Interest (Utilitarian) Account:** Goes quiet on **whose interest**. It cannot resolve the dispute between the Jacksonian claim (rotation prevents tyranny) and the Reform claim (tenure prevents chaos) without simply picking a side. It lacks the tools to analyze *structural dependence*, focusing only on outcomes. It struggles to explain why the system was corrupt *before* the inefficiency became undeniable.
  *   **The "Corruption as a Label" (Political Contestation) Account:** Goes quiet on the **assassination**. If corruption is just a weaponized label used by whoever holds the apparatus, then Guiteau's bullet is just rhetoric. This account cannot account for the *material violence* produced by the system. It reduces the death of a President to a semantic dispute, which is insufficient.

  ### Conclusion

  The Spoils System episode suggests that corruption has **contested content that crystallizes into fixed norms through crisis.**

  The **Institutional Dependence Account** is the only one that allows you to say:
  1.  The Patronage men were corrupt (office dependent on party).
  2.  The Reformers were partially corrupt (office dependent on class/racial hierarchy).
  3.  The Patronage men's defense is coherent within their own time but fails against the functional requirements of a modern state.

  It avoids the trap of saying "corruption is just what the winners call it" (because the Garfield assassination proves the system had objective failures) while avoiding the trap of "corruption is eternal sin" (because it acknowledges the legitimacy of the Jacksonian democratic theory).

  The cost of this account is that it requires you to be a historian of institutions. You cannot simply point to a bribe; you must define what the institution is *for* and show how the dependency subverts that purpose. In the case of the Pendleton Act, it reveals that "cleaning up" corruption often means shifting the dependency from the party boss to the cultural elite—a trade-off the "fixed content" models miss entirely.
