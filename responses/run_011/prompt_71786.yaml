          *   Gift Economy vs. Corruption: The account must distinguish between reciprocal obligation (gift) and *quid pro quo* that undermines public function. The Spoils System crossed the line when the *party* became the master, not the public.
          *   Traveling Standards: The Pendleton Act shows standards *don't* travel well without enforcement (postmasters stayed political).
