      *   *Public Interest (Utilitarian):* Corruption is acting against the general welfare.
          *   *Problem:* Who defines "public interest"? Patronage men argued *they* served the public interest (democratization, party stability). Reformers argued efficiency/integrity. Hard to adjudicate without begging the question.
      *   *Dependence/Institutional (Dennis Thompson/Philosophical):* Corruption is the subversion of public institutions for private or partisan ends, undermining the institution's purpose.
