      *   *Critique:* The prompt highlights the exclusion of Black officeholders. A pure "Merit = Good" narrative fails here. The Institutional account must acknowledge that the *new* institution had corrupt exclusions.
      *   *Key Insight:* The Spoils System wasn't just "corruption"; it was a *different constitutional theory*. Jacksonians believed rotation prevented aristocracy. Reformers believed tenure prevented chaos.
      *   *Selection Revision:* I need to be careful not to just say "Reformers Good." The prompt explicitly notes the racial exclusion. The best account must capture *both* the corruption of the Spoils (partisan capture) and the corruption of the Reform (class/racial capture).
      *   *Winner:* **The Systemic/Institutional Account.** It allows for corruption to exist in *both* systems depending on how the institution is subverted.

  5.  **Finalizing the Structure:**

      1.  **Selection:** The Institutional Dependence Account (subversion of public role for partisan/private gain).
      2.  **Application:**
