      *   *Alternative:* **The "Corruption as a Political Claim" Account (Conceptual History/Skinner).** This fits the "label applied by whichever side" hypothesis best. But the prompt asks me to pick the one that does the *best work*. Does the "label" theory do the best work? It explains the *rhetoric*, but it fails to explain the *Garfield assassination* (material consequence) or the *exclusion of Black officeholders* (structural outcome).
      *   *Better Fit:* **The Dependence Account (Dennis Thompson).** Corruption exists when officials are dependent on private/partisan interests rather than the public. This allows us to say the Spoils System *was* corrupt (dependence on party) even if legal, but also allows us to see the Reformers' blindness (dependence on class/cultural capital).
