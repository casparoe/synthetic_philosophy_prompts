      *   *Refinement:* Actually, the **Public Office Misuse** account (Nye/Heidenheimer style) is too legalistic. The **Public Interest** account is too vague. The **Institutional Integrity** account (Dennis Thompson) is strong but risks anachronism.
      *   *Decision:* I will argue for a **Systemic/Institutional Account** that treats corruption not as a fixed moral atom but as a breach of *established institutional norms regarding the source of authority*. However, to answer the "fixed vs. label" question, I need to lean into the **Political Contestation Account** (corruption as a claim) but test it against the **Institutional Harm** reality.
