answer: |-
  ### The "Ghost Promise" Audit Procedure

  This procedure is designed to take ~5 minutes per snippet. It is not a legal review; it is a semantic stress test. It identifies where *what is said* diverges from *what is understood*.

  **Note on Constraints:** You are correct on both suspicions.
  1.  **Cancellation Backfire:** Adding "but not guaranteed" to "We may call" often primes the customer to expect the call. Mentioning the possibility makes it salient.
  2.  **Plain Language Constraints:** Standard pragmatic fixes (footnotes, subordinate clauses) violate your style guide. Your fixes must be *structural* (rewriting the main claim), not *qualifying* (adding exceptions).

  | Step | Question | Passing Answer | Action if it Fails | Judgment Call (Y/N) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Literal Truth** | Is the sentence factually accurate in 100% of scenarios? | Yes. | Rewrite for accuracy. Do not proceed until true. | No |
  | **2. Scalar/Modal Check** | Does it contain "up to," "may," "could," "first," or "as low as"? | No. | Flag for Step 3. These are high-risk triggers for scalar implicature. | No |
  | **3. The "Therefore" Test** | If a customer reads this, what do they assume they are allowed to do next? (e.g., "Rate fixed 12 months" $\rightarrow$ "Therefore my payment is safe.") | The assumption matches the legal reality. | **Rewrite.** Remove the cue that triggers the false inference. Do not add a footnote. | **Yes** |
  | **4. Cancellation Test** | If you add "but not necessarily" to the end, does it sound like you are hiding something? | It sounds neutral/clarity-enhancing. | **Do not cancel.** If cancellation sounds defensive, the original sentence is pragmatically poisoned. Rewrite the core claim instead. | **Yes** |
  | **5. Plain Language Fit** | Can the fix be written in <20 words, 8th-grade level, no footnotes? | Yes. | If the fix requires complex syntax, the *concept* is too complex for disclosure. | **Yes** |
  | **6. Risk Handoff** | Is the meaning clear, but the *outcome* still likely to upset the customer? | No (Meaning is clear). | **STOP.** Hand to Compliance/Legal. This is no longer a linguistics problem; it is a product risk or regulatory requirement. | No |

  ***

  ### Worked Cases

  #### Case 1: "Your rate is fixed for the first 12 months."
  *   **Step 1 (Truth):** Pass. It is factually true.
  *   **Step 2 (Scalar):** Pass. "First 12 months" is a temporal scalar.
  *   **Step 3 (Therefore):** **Fail.** Customer reads: "Rate is fixed for 12 months" $\rightarrow$ *Therefore, the loan is stable/safe for 12 months.* They ignore that fees/other terms might change, or they assume the rate stays fixed *after* 12 months (conditional perfection).
  *   **Step 4 (Cancellation):** **Fail.** "Your rate is fixed for the first 12 months, but not after." Sounds aggressive/defensive. Backfire risk: High.
  *   **Step 5 (PL Fit):** Pass. Can be rewritten simply.
  *   **Step 6 (Handoff):** N/A (Fix found).
  *   **Verdict:** **Fix.**
  *   **Minimal Fix:** "Your rate is fixed for 12 months. After that, it can change." (Active voice, explicit boundary).

  #### Case 2: "We may share your information with our servicing partners."
  *   **Step 1 (Truth):** Pass. You have the legal right to share.
  *   **Step 2 (Scalar):** **Fail.** "May" is a modal verb indicating possibility, but in privacy policies, it functions as a notification of intent.
  *   **Step 3 (Therefore):** **Fail.** Customer reads: "They *may* share" $\rightarrow$ *Therefore, they probably won't, or they are asking permission.* Reality: You almost certainly will share.
  *   **Step 4 (Cancellation):** **Fail.** "We may share... but we might not." Sounds deceptive.
  *   **Step 5 (PL Fit):** Pass.
  *   **Step 6 (Handoff):** **Escalate.** If you *always* share, "may" is legally safe but pragmatically misleading. If you *sometimes* share, "may" is accurate. This is a business practice risk, not just copy.
  *   **Verdict:** **Escalate.** (Requires Legal/Product decision on data practices).
  *   **Minimal Fix:** If sharing is standard: "We share your information with our servicing partners." (Honest, removes ghost promise).

  #### Case 3: "Subject to credit approval."
  *   **Step 1 (Truth):** Pass. Loans require approval.
  *   **Step 2 (Scalar):** Pass. No scalars.
  *   **Step 3 (Therefore):** **Pass.** Customer reads: "I might not get approved." No false inference generated. The condition is explicit.
  *   **Step 4 (Cancellation):** N/A.
  *   **Step 5 (PL Fit):** Pass.
  *   **Step 6 (Handoff):** **Stop/Handoff.** The sentence is pragmatically clean. However, customers will still feel misled if denied because they ignore the text. The procedure says "Fine," but you will feel annoyed because the text cannot fix customer inattention.
  *   **Verdict:** **Fine.**
  *   **Minimal Fix:** None linguistically required.
  *   **Note:** This highlights the limit of the tool. It fixes meaning, not attention.

  ***

  ### Ghost Promise: Keep or Drop?

  **Keep it.** It is a valuable internal heuristic.

  **What it maps onto:** It maps directly to **Generalized Conversational Implicature (GCI)** that conflicts with **Legal Entailment**.
  *   *Ghost Promise:* The meaning the customer infers via Gricean maxims (Relevance, Manner, Quantity).
  *   *Legal Reality:* The truth-conditional content signed off by counsel.

  When these two diverge, you have a "Ghost Promise." It is not a legal term, but it is an accurate description of *pragmatic liability*. It helps you explain to stakeholders why a legally true sentence is causing complaints.

  ***

