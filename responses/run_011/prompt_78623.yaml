  2.  **Deconstruct the Precautionary Principle (PP):**
      *   There isn't one single PP, but a family of principles. A robust formulation (e.g., Rio Declaration, Wingspread Statement) usually involves:
          1.  **Threat Condition:** Potential for serious or irreversible damage.
          2.  **Uncertainty Condition:** Scientific uncertainty about cause/effect or probability.
          3.  **Action Condition:** Lack of full certainty shall not be used as a reason for postponing cost-effective measures.
          4.  **Burden of Proof:** Often shifts to the proponent of an activity to show it's safe (though in public health, it often shifts to showing the threat is negligible).
      *   *Critique:* PP is often criticized for being vague on *which* precaution to take when multiple exist.

  3.  **Map to 1976 Swine Flu:**
      *   **Agent:** CDC (Sencer) advised, Ford (President) decided/owned it. Let's treat the "Public Health Apparatus + Executive" as the agent.
