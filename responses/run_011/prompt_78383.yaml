answer: |-
  This is a sophisticated framing, and your thesis holds water: Valladolid is indeed the unique moment where the *Politics* was forced out of the commentary tradition and into a tribunal of statecraft. However, to pressure-test this for a dissertation chapter, we need to be ruthless about where the Aristotelian machinery jams when forced to bear the weight of imperial conquest.

  Here is the mapping, followed by the decisive reading you requested.

  ### Part I: Mapping Theory to Case

  **1. The Workload of the Doctrine**
  You are correct to isolate Sepúlveda's four arguments. Only the first (unfitness to govern) is strictly Aristotelian. The other three (suppressing crimes against nature, stopping sacrifice, propagation of the faith) are Scholastic just-war and evangelical arguments derived from Thomist natural law and canon law.

  This distinction reveals exactly what work the doctrine of natural slavery is doing in Sepúlveda's architecture. The just-war arguments provide a *casus belli*; they justify the initial use of force. But just war, in the Scholastic tradition, does not necessarily entail permanent political subjection or the loss of *dominium* (property and self-rule). Once the sin is punished or the faith offered, the war ends. Natural slavery is required to justify the *permanence* of the arrangement. It transforms a punitive expedition into an ontological status. Without the Aristotelian premise, the Indians remain sinners or pagans who might be corrected, but they remain *sui juris*. With the Aristotelian premise, they are instruments (*organon*) requiring a master. Thus, the doctrine is not doing the work of justification for violence (the other three arguments do that); it is doing the work of justification for *regime*.

  **2. The Four Stretches: Aristotle vs. Sepúlveda**
  Sepúlveda requires four specific extensions of the *Politics* to make it function in the Americas. Here is the verdict on their compatibility:

  *   **Collective Attribution (Whole Peoples):** *Aristotle forbids this.* In *Politics* I.5–6, Aristotle explicitly critiques the poets who claim "it is meet for Hellenes to rule barbarians," arguing that this collapses the distinction between natural fitness and convention. He insists the distinction is between individual souls, not ethnic groups. Sepúlveda's move to classify the "Indian" as a type is a categorical violation of the text.
  *   **Hereditary Transmission:** *Aristotle is ambiguous but leans against it.* Aristotle acknowledges that some slaves are slaves by convention (capture in war) and some by nature. He admits nature *intends* for children to resemble parents, but he also allows for the possibility that a slave's child might have a free soul. Sepúlveda treats the status as caste-like. This is a stretch that Aristotle's biology might allow, but his political theory resists, as it muddies the cognitive test.
  *   **Inference from Customs:** *Aristotle forbids this.* The Aristotelian test is cognitive and internal (the capacity to deliberate). Sepúlveda infers the internal capacity from external customs (sacrifice, sodomy, lack of letters). This reverses the epistemology. For Aristotle, you know the slave by his inability to reason; for Sepúlveda, you know he cannot reason because his customs are "barbarous." This is circular: the customs are barbarous *because* they lack reason, and they lack reason *because* their customs are barbarous.
  *   **Dominion vs. Direction:** *Aristotle forbids this.* Aristotelian slavery is household management (*oikonomia*). It is despotic rule, distinct from political rule. Political rule is over free men; despotic rule is over slaves. Sepúlveda uses natural slavery to justify *political* dominion (*imperium*) over a conquered territory. He conflates the master's authority over the slave's body with the king's authority over a province.

  **3. Vitoria's Deflation**
  Vitoria represents the strict constructionist reading. He argues that even if the Indians were "slow-witted," Aristotle's natural slave requires direction (*gubernatio*), not ownership (*dominium*). A tutor directs a ward, but the ward retains rights. Vitoria applies the theory faithfully to show that it yields no right of conquest. Consequently, Vitoria does not just apply the theory; he quietly dissolves its utility for empire. If the natural slave retains *dominium*, you cannot seize his land or force his labor based on that status alone. Vitoria saves Aristotle from Sepúlveda by rendering Aristotle irrelevant to the question of conquest.

  ### Part II: Case to Theory (The Decisive Reading)

  You ask for a commitment between two readings: either Valladolid shows the empirical falsification of the doctrine (Las Casas was right, Indians are rational) or it shows the doctrine's indeterminacy (the theory supplies no criterion that isn't already a verdict).

  **I commit to the second reading: The doctrine is structurally indeterminate.**

  The Valladolid stalemate was not a failure of nerve, nor was it a genuine empirical tie. It was the inevitable result of deploying a concept that lacks independent criteria of application. "Prudence" (*phronesis*) and "deliberative capacity" are not empirically measurable traits like height or strength; they are normative judgments disguised as capacities.

  **The Argument for Indeterminacy**
  Las Casas's ethnography (the empirical falsification reading) is powerful, but it fails to explain why Sepúlveda could read the *same* evidence and reach the opposite conclusion. When Las Casas pointed to Indian cities, Sepúlveda called them "mimicries" of polity. When Las Casas pointed to their laws, Sepúlveda called them tyrannical superstitions. The theory of natural slavery does not provide a neutral metric to adjudicate these claims. It functions as a hermeneutic circle: if you assume the Indians are natural slaves, their complex institutions are evidence of irrationality (confused rituals); if you assume they are free, the same institutions are evidence of rationality (ordered laws).

  The junta adjourned with both sides claiming victory because the text of the *Politics* sustains both readings. Aristotle's unease about barbarians (citing the poets only to critique them, yet admitting barbarians often lack natural rulers) creates a gap large enough for both Sepúlveda and Las Casas to occupy. Sepúlveda exploited Aristotle's cultural chauvinism; Las Casas exploited Aristotle's insistence on individual cognitive testing. The theory is not a scientific hypothesis that the Americas falsified; it is a political technology that legitimizes whatever power relation is already in place. The "test case" of Valladolid proves that the doctrine cannot generate a verdict; it can only ratify one.

  **The Strongest Evidence for the Empirical Reading (and Why It Fails)**
  The strongest evidence for the empirical falsification reading is Las Casas's *Apologética Historia Sumaria*. He systematically demonstrates that Indians possess the four operations of the intellect: understanding, reasoning, memory, and will. He shows they have arts, agriculture, and religion. If the doctrine were a substantive empirical thesis, this should have ended the debate.

  It failed to end the debate because the doctrine is not empirical. Sepúlveda did not need to prove the Indians lacked *all* reason; he only needed to prove they lacked *sufficient* reason to govern themselves *compared to Spaniards*. The doctrine allows for a sliding scale of rationality that always privileges the observer. The empirical reading fails because it assumes the theory is interested in truth about capacities. It is not; it is interested in the allocation of authority. As long as the metric for "sufficient reason" is set by the conqueror, the theory is unfalsifiable.

  **A Note on the "Category Error" (The Third Thing)**
  You offered a third option: that the episode discredits Sepúlveda's *use* without touching the doctrine, because the doctrine is for households, not empires. While true, this is too charitable to Aristotle. The Valladolid debate exposes that the household/emperor distinction in Aristotle is unstable. If a master can rule a slave for the slave's own good in the *oikos*, why can a king not rule a "child-like" people for their own good in the *polis*? The logic of paternalism scales. The failure at Valladolid was not just a category error; it was the exposure of the doctrine's inherent political indeterminacy. It cannot distinguish between benevolent guardianship and exploitative domination without external moral constraints (which Aristotle does not provide).

  ### Part III: The Silences

  Your suspicion is correct: the theory goes silent at the critical junctures where political theory usually speaks.

  1.  **Citizenship:** Aristotle's natural slave is defined by an inability to deliberate. The theory has no mechanism for "graduation." If a slave learns to deliberate (or if, as Las Casas argued, they always could), the theory offers no path to citizenship. It is a one-way ratchet. This silence is functional: it prevents the reintegration of the subjected population, locking them into permanent dependency.
  2.  **Ruler's Injustice:** Aristotle states that when the master rules only in his own interest, the relationship becomes odious and lacks community. However, he offers no recourse for the slave. The theory identifies the corruption of the bond but provides no standing for the slave to claim it. At Valladolid, this meant the Indians could be victims of tyranny without having the theoretical standing to claim *injustice* (which requires a violation of right between equals or self-governing agents).
  3.  **Standing to Object:** This is the most damning silence. If the natural slave lacks deliberative capacity, his objection to his status is, by definition, irrational. The theory immunizes itself against dissent. Las Casas had to argue *for* the Indians because the Indians' own protests were theoretically inadmissible as rational discourse.

  ### Part IV: The Historian's Objection

  Your colleague is right in a narrow sense: the Junta issued no binding verdict, the *Requerimiento* continued to be read (often without translation), and conquest accelerated after 1550. Policy was driven by silver, revenue, and logistics, not theological nuance.

  However, dismissing Valladolid as "overread" misses its theoretical significance. Before Valladolid, natural slavery was a background assumption; after Valladolid, it was a liability. The Crown's refusal to endorse Sepúlveda explicitly (issuing only a vague directive to try "lesser means" of conquest) signaled that the Aristotelian justification was no longer sufficient for public legitimacy. It forced the empire to shift its justificatory language from *ontological inferiority* (they are slaves) to *tutelage and evangelization* (they are wards). This is a substantive shift in the architecture of empire, even if the material outcome for the Indians remained grim. The Junta did not stop the conquest, but it broke the theoretical backbone of the *encomienda* as a property right derived from nature. It moved the debate from "who they are" to "how we treat them," which is precisely why Las Casas claimed victory.

  ### Conclusion for the Chapter

  Your thesis stands, but it should be sharpened. Valladolid is the best test case not because it tested the *truth* of natural slavery, but because it tested its *administrative viability*. The mapping shows Sepúlveda had to break Aristotle to make him useful. The decisive reading shows that the doctrine's indeterminacy made it useless as a legal standard. The silences reveal that the doctrine was designed to preclude politics, not to organize it.

  Your chapter should conclude that Valladolid marks the moment natural slavery ceased to be a productive political concept and became a defensive apologetic. It survived after 1550 not because it explained the world, but because it protected the conscience of the conqueror. That is a stronger claim than saying the doctrine was "falsified." It was exhausted.
