      *   "Polite Alternation": Add a "Decay Rule." Every 5 minutes, all chips lose 10% value (Facilitator announces "Inflation").
      *   "Refusal to Pay": Facilitator has veto power on Round 2 participation.

      *(Timeline Check)*:
      *   75 mins is tight for 2 rounds + debrief with 30 students.
      *   Round 1: 20 mins.
      *   Debrief 1: 10 mins.
      *   Round 2: 20 mins.
      *   Debrief 2: 15 mins.
      *   Wrap: 10 mins.
      *   Total: 75.
      *   Need to be strict on time.

      *(Final check on "Social Commitment")*:
      *   The prompt says: "no sealed envelopes... no pre-written move sequences."
      *   My Whiteboard + Escrow plan fits. The commitment is the public act of writing the name and staking the chips. The reversibility is the key: you *can* wipe the name off, but you lose the chips and face the class.

