answer: |-
  # Session Plan: The Commitment Race

  ## 1. Materials List
  *   **Poker Chips:** 250 total.
      *   Color A (White): 150 chips (Player Endowments).
      *   Color B (Red): 50 chips (Bank/Prizes).
      *   Color C (Blue): 50 chips (Community Pot/Bystander Tax).
  *   **Index Cards:** 30 (for notes/drafting, optional).
  *   **Whiteboard & Markers:** Essential for the Public Ledger.
  *   **Timer:** Visible to you (phone or watch).
  *   **Bell or Whistle:** To freeze the room instantly.

  ## 2. Setup & Payoff Scheme
  **Endowment:** Each student starts with **5 White Chips**.
  **The Community Pot:** Place 20 Blue Chips in a visible pile at the front. At the end of class, these are distributed equally among all players *who did not cause a collision*.

  **The Payoff Matrix (Per Pair):**
  *   **Win (You Commit, Opponent Yields):** +5 White Chips (Total 10).
  *   **Yield Early (Before Opponent Commits):** +1 White Chip (Total 6).
  *   **Yield Late (After Opponent Commits):** -1 White Chip (Total 4) + Loss of Escrow.
  *   **Collision (Both Commit):** -5 White Chips (Total 0) + Loss of Escrow.
  *   **Bystander Tax:** If a pair collides, **every other pair** in the room immediately loses 1 White Chip to the Facilitator (who burns it).

  **The Commitment Device (Social):**
  To Commit, a player must:
  1.  Place **3 White Chips** in an "Escrow Pile" in front of them.
  2.  Write their **Name** on the Whiteboard under the column **"COMMITTED."**
  3.  Announce to their partner: "I am committed."

  **Reversibility:** A player *may* erase their name and take back their chips, **BUT** they must stand and announce to the room: "I am breaking my vow." They must then pay **2 White Chips** to the Community Pot. (This makes retreat technically possible but socially/expensively costly).

  ---

  ## 3. Minute-by-Minute Timeline (75 Minutes)

  ### 00:00 – 00:10: Setup & Rules
  *   Distribute 5 chips to each student. Seat them in 15 pairs facing each other.
  *   Draw the **Whiteboard Ledger**: Two columns: "COMMITTED" | "YIELDED".
  *   Explain the Payoff Scheme and the **Bystander Tax**. Emphasize: *"If Table 7 crashes, Tables 1 through 6 and 8 through 15 lose chips. You are responsible for the room's wealth."*
  *   Explain the Commitment Device (Escrow + Whiteboard).
  *   **Crucial Rule:** The game ends for a pair when one yields or a collision is declared. However, the "Market" remains open for 15 minutes. You cannot leave the game early; if you settle in 2 minutes, you must sit quietly until time is called.

  ### 00:10 – 00:25: Round 1 (Symmetric Stakes)
  *   **Goal:** Experience the race.
  *   **Action:** Start the timer. Circulate.
  *   **Facilitator Role:** Watch for commitments. When a name goes on the board, do not intervene. If a collision occurs (both names on board), ring the bell. Freeze the room. Announce: "Collision at Table X." Collect 1 chip from every other table. Burn it. Resume.
  *   **Time Call:** At 14 minutes, announce "One minute remaining." At 15 minutes, ring bell. "Hands off chips."

  ### 00:25 – 00:35: Debrief 1 (The Race Structure)
  *   Do not lecture. Ask these questions in order. Wait for answers.
  *   **Q1 (Value of Inability):** "Look at the winners. Did they win because they had more options, or fewer?" (Target: Fewer).
  *   **Q2 (Observation):** "If you committed but hid it from your partner, would it have worked? Why did the Whiteboard matter?" (Target: Belief/Observation).
  *   **Q3 (The Race):** "Who here waited to see if the other would commit, only to find they were too late?" (Target: Second is worse than never).
  *   **Q4 (Bystanders):** "Raise your hand if you lost a chip because of a collision at a different table. How did that feel compared to losing your own chips?" (Target: Externalities).

  ### 00:35 – 00:40: Round 2 Setup (Asymmetric Stakes)
  *   Keep pairs the same.
  *   **Asymmetry:** Deal one **Red Card** and one **Blue Card** to each pair.
      *   **Red Card (High Stakes):** Collision Penalty is **-10 Chips** (Bankruptcy). Win Prize is **+8 Chips**.
      *   **Blue Card (Low Stakes):** Collision Penalty is **-2 Chips**. Win Prize is **+4 Chips**.
  *   **Rule:** You must show your card to your partner immediately.
  *   **Ambiguous Option:** Introduce a **"Signal"** option. A player may place only **1 Chip** in Escrow and write their name with a **?** on the board.
      *   Cost to break Signal: 1 Chip to Community Pot.
      *   If Collision occurs after Signal: Penalty is halved.

  ### 00:40 – 00:55: Round 2 (Asymmetric Stakes)
  *   Run for 15 minutes.
  *   **Facilitator Note:** Watch the Low Stakes (Blue) players. They should be more aggressive. Watch if High Stakes (Red) players try to use the "Signal" to bluff.
  *   Enforce the Bystander Tax rigorously.

  ### 00:55 – 01:10: Debrief 2 (Power & Madness)
  *   **Q1 (The Winner):** "Did the High Stakes or Low Stakes players win more races? Why?" (Target: Least to lose).
  *   **Q2 (The Signal):** "Did anyone use the '?' Signal? Did it work better than full commitment?" (Target: Ambiguity allows retreat without total shame).
  *   **Q3 (Responsibility):** "In Round 1, you paid for your own collisions. In real politics, who pays for the collisions leaders cause?" (Target: Citizens/Bystanders).

  ### 01:10 – 01:15: Final Wrap
  *   Distribute the Community Pot (Blue Chips) to non-colliding players.
  *   Final thought: "Commitment is power, but commitment races are a tax on everyone. The skill is not just burning bridges, but knowing when to build them."

  ---

  ## 4. Troubleshooting: What Will Go Wrong

  **1. Polite Alternation (The "You go first" Trap)**
  *   *Problem:* Pairs agree to take turns winning across rounds or simply split the chips without committing.
  *   *Fix:* **Inflation.** Announce at minute 5 and minute 10: "All chips in hand lose 10% value (round down)." This creates a ticking clock that makes waiting costly. If they still collude, ignore it for Round 1, but in Round 2, tell them: "The Asymmetry makes collusion unstable. One of you is vulnerable."

  **2. Timing Desynchronization**
  *   *Problem:* Half the room finishes in 3 minutes; the other half stalls for 15. Idle students talk and disrupt.
  *   *Fix:* **The Quiet Rule.** "Once a pair settles, you must sit in silence. If I hear you discussing strategy after you've settled, I will deduct 2 chips from your final score." This keeps the room calm for those still racing.

  **3. Refusal to Pay Reputation Cost**
  *   *Problem:* A player erases their name and refuses to pay the 2-chip penalty.
  *   *Fix:* **Social Ostracism.** Do not argue. Announce to the room: "Player X has defaulted on a public vow." In Round 2, **no one is allowed to partner with Player X** (they sit with you, the facilitator, and watch). The threat of exclusion is usually enough to enforce payment.

  **4. Running 15 Minutes Behind**
  *   *Cut:* **Round 2 Debrief Questions 2 & 3.** Merge them into the Final Wrap. If still behind, skip the "Ambiguous Signal" option in Round 2 entirely. Stick to Hard Commit vs. Yield. The core lesson (Asymmetry) is more important than the nuance (Ambiguity).

  ---

  ## 5. Limitations: What This Game Cannot Teach

  **The Decoupling of Decision and Cost**
  *   *The Gap:* In this game, the students who commit are the ones who lose chips when they collide. In real geopolitics or domestic politics, the leaders who make the commitments (burn the bridges) are rarely the ones who bear the costs of the collision (soldiers, taxpayers, civilians).
  *   *Why it matters:* This disconnect encourages *excessive* commitment. Leaders can posture wildly because the "Bystander Tax" is paid by others, not them.
  *   *Debrief Handling:*
      *   **Include:** In Debrief 2, Q3 ("Who pays?"). Make them articulate that in the game, they internalized the cost, which made them cautious. In reality, leaders often externalize the cost, which makes them reckless.
      *   **Exclude:** Do not try to simulate this mechanically (e.g., by making one student a "leader" and others "citizens"). It complicates the game too much for 75 minutes. Keep it as a verbal point in the wrap-up. The *feeling* of the Bystander Tax in the game is sufficient to prime them for this concept.

  ---

  ## 6. The Ambiguous Commitment (The "?" Signal)

  **Design Choice:**
  I have included the **"Signal" (1 Chip Escrow + '?' on Board)** in Round 2.

  **Is it too subtle?**
  No, not for Economics/IR majors. They understand signaling equilibria. However, it requires precise framing.
  *   *Instruction:* "A Full Commitment says 'I cannot stop.' A Signal says 'It will be very embarrassing if I stop.' The first is a wall; the second is a fence."

  **Why include it?**
  You suspected that "ambiguous commitment is the one that actually wins." The game supports this.
  *   **Full Commit** risks Collision (which is catastrophic for the pair and the room).
  *   **Yield** guarantees loss of status/prize.
  *   **Signal** creates enough pressure to force the opponent to yield, but leaves a "face-saving" off-ramp if the opponent also Signals.
  *   **Learning Outcome:** If a pair uses Signals and settles, they preserve the Community Pot. If they go Hard/Hard, they destroy value. This teaches that **strategic ambiguity** can be a public good, whereas rigid commitment is a public bad.

  **Facilitator Tip:** If no one uses the Signal in Round 2, point this out in the debrief. "Why were you afraid to be ambiguous? Did you think it looked weak?" This reveals the pressure to appear "resolute" that drives commitment races in the first place.
