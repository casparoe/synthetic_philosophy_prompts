      Let's assemble the response.

      *Wait, one detail:* "The winner of the race is systematically the player with the least to lose."
      *   In Round 2, I need to ensure the Low Stakes player *wins* if they commit.
      *   Payoff structure must ensure LSP prefers Collision less than HSP, but HSP prefers Yielding more than LSP.
      *   HSP: Win +10, Collision -10. (Net range 20).
