answer: |-
  **MEMORANDUM TO THE CERTIFICATION PANEL**

  **SUBJECT:** Recommendation on Docket 25-03 (Fluorescent Brightener Tiles)

  **1. Verdict and Recommended Wording**
  The Secretariat recommends that Docket 25-03 be **certified subject to amendment**. The draft certificate implies a stability that the physical evidence does not support. While the predicate "chromaticity within band W" is entrenched (cf. Docket 22-01), the population certified ("Every tile... whether or not it has been measured") includes tiles measured by customers months after annealing. The evidence shows these tiles will fail the predicate due to photodegradation. To certify as drafted would be to license a false projection.

  The panel should adopt the following wording:
  *"Every tile produced under licence to specification T-9 lies within chromaticity band W when measured under D65 with the UV component included, provided the measurement occurs within 180 days of annealing and prior to cumulative UV exposure exceeding 50 MJ/m²."*

  **2. Analogies and Sampling**
  The closest analog is **Docket 15-09** ("W-2035"). In 15-09, we refused certification because the property's extension depended on *when* the measurement occurred. In 25-03, the property's extension similarly depends on time elapsed, though here the mechanism is physical degradation rather than arbitrary definition. The analogy strains because 15-09 involved a predicate coined for the docket, whereas "chromaticity" is standard. However, the logical structure is identical: the truth-value of the statement flips based on temporal coordinates external to the tile's production identity.

  **Docket 23-04** is also critical. There, we refused to project from accelerated ageing to real-time storage because the function was not known monotone. In 25-03, the degradation curve *is* well-characterized. This distinguishes the cases: we know *that* they fail, whereas in 23-04 we did not know *how* they failed. This supports amendment rather than outright refusal.

  Regarding **Docket 17-02**, the sampling problem is acute. The sixty tested tiles were screened by a line-side check before dispatch. Thus, the sample was selected by the very property being generalized (at time *t*=0). While this was resolved in 17-02 by moving the draw upstream, here the deeper issue is that the sample state (fresh) does not match the certified use state (aged). The sample represents tiles at dispatch, but the certificate entitles customers to treat the property as holding at calibration (4–14 months later). The sample is therefore unrepresentative of the certified population at the point of use.

  **3. Candidate General Principles**
  Three distinct principles are consistent with our six prior rulings. Each delivers a different verdict on 25-03.

  *   **Principle A (Predicate Entrenchment):** Certification turns on whether the predicate is defined by entrenched apparatus and mechanistic accounts, not on temporal stability. (Derived from 22-01, 11-04; consistent with 15-09 refusal as "W-2035" lacked mechanistic account).
      *   *Verdict on 25-03:* **Certify as drafted.** The predicate is standard chromaticity; the degradation is a shelf-life matter, not a certification matter.
  *   **Principle B (Measurement Independence):** Certification refuses predicates where the truth conditions depend on the date of the measurement act itself, but allows dates marking production changes. (Derived from 15-09 refusal vs. 19-06 certification).
      *   *Verdict on 25-03:* **Certify as drafted.** The date dependence here arises from tile ageing (production state), not the calendar date of the measurement act itself.
  *   **Principle C (Sample-Use Identity):** Certification requires that the physical state of the sample matches the physical state of the tiles at the point of certified use. (Derived from 17-02, 23-04).
      *   *Verdict on 25-03:* **Refuse/Amend.** The samples were fresh; the use-case is aged. The projection is invalid without temporal constraints.

  **4. Panel Commitments and Operating Logic**
  My best guess is that the panel operates on a hybrid of **Principle C and Mechanistic Stability**. We certified 19-06 despite a date term because the *making* changed, not the *looking*. We refused 15-09 because the change was in the *looking* (or arbitrary). In 25-03, the change is in the *tile* (physical degradation), but the certificate claims the tile *is* W, unconditionally. By amending, the panel commits to the view that a reference material certificate guarantees performance at the point of *use*, not merely at dispatch. We become guarantors of the material's lifecycle stability, not just its initial state.

  The strongest point for the opposing verdict (Principle A) is administrative scope. Metrological certificates typically specify properties at the time of calibration. Adding usage windows transforms the institute from a certifier of static standards to a manager of perishable goods, complicating liability. The applicant argues correctly that shelf-life is traditionally a label warning, not a constraint on the truth of the property statement itself. However, given Docket 23-04, we have already established that we do not certify where state-change undermines the projection.

  **5. Proposed Discriminating Docket**
  To distinguish Principle B (Measurement Independence) from Principle C (Sample-Use Identity), I propose the following hypothetical docket:

  **Docket 26-01:** An applicant seeks certification for hygroscopic tiles. **Claim:** "Every tile measures Blue under D65." **Fact:** The tiles are Blue at 40% relative humidity (RH) but turn Green at 60% RH. The standard laboratory environment is 50% RH. The sample tiles were measured at 50% RH and appeared Blue-Green (intermediate). The applicant argues "Blue" is entrenched (Principle B) and the measurement date is irrelevant.

  *   **Discrimination:** Principle B suggests certification (predicate is standard, date irrelevant). Principle C demands refusal or amendment (sample state at 50% RH does not match user environment which may vary; property is not stable across use conditions). A refusal here would confirm the panel prioritizes Sample-Use Identity over mere Predicate Entrenchment.

  **Recommendation:** Circulate this memo prior to the sitting. Prepare the amended wording for vote.

  **Technical Secretary**
