answer: |-
  **MEMORANDUM**

  **TO:** The Chair, Board of Trustees
  **FROM:** Consultant
  **DATE:** October 26, 2023
  **SUBJECT:** Analysis of Precedent and Recommendation Regarding 2024 Nomination

  **I. Candidate Principles Derived from the Record**

  Based on the six prior decisions, three principles are jointly consistent with the board's record. Two are required by the record; one is permitted but contingent.

  1.  **The Principle of Accountability (Required):** The actor must publicly identify themselves and submit to the legal consequences of their action.
      *   *Support:* Cases 1, 3, 5, 6 (Awarded) all involved identification and acceptance of penalty. Case 2 (Declined) turned explicitly on the author declining to answer for the act.
      *   *Status:* Necessary condition. Without it, the award is declined.

  2.  **The Principle of Proportionality (Required):** The collateral burden imposed on uninvolved third parties must not be disproportionate to the grievance or the visibility required.
      *   *Support:* Case 4 (Declined) cited means "out of proportion," specifically regarding commuters and ambulances. Case 6 (Awarded) distinguished itself by defining inconvenience as "slight, brief, and unavoidable."
      *   *Status:* Necessary condition. High burden on neutrals leads to declination; low/unavoidable burden permits award.

  3.  **The Principle of Targeting (Permitted/Contingent):** The act should be directed at the instrument or agent of the contested decision.
      *   *Support:* Case 1 (Commissioners), Case 3 (Supervisors), Case 5 (Valve/Permit Holder).
      *   *Tension:* The 2019 minute (Case 5) states the act was "aimed at the instrument... and at no one else." This fuses two distinct concepts: (a) *Direct Targeting* (hitting the decision-maker's property) and (b) *Collateral Harm* (hitting no one else's interests). These can come apart. One can hit a decision-maker's property but harm third parties (e.g., destroying a public hospital's generator to protest administration), or hit a neutral's property with no third-party harm (e.g., damaging a contractor's unused equipment).
      *   *Status:* The record permits this principle but does not strictly require it, provided Proportionality (Principle 2) is satisfied (see Case 6, where bank customers were affected, though minimally).

  **II. Implications for the Current Nomination**

  The current nomination involves: Neutral target (contractor), High cost ($186k damage + $1.9m delay), Accountability accepted (surrendered).

  | Principle | Case 1 (07) | Case 2 (10) | Case 3 (12) | Case 4 (16) | Case 5 (19) | Case 6 (23) | **Current (24)** |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---: |
  | **1. Accountability** | Pass | **Fail** | Pass | Pass | Pass | Pass | **Pass** |
  | **2. Proportionality** | Pass | N/A | Pass | **Fail** | Pass | Pass | **Fail** |
  | **3. Targeting** | Pass | N/A | Pass | N/A | Pass | **Mixed** | **Fail** |
  | **Decision** | **Award** | **Decline** | **Award** | **Decline** | **Award** | **Award** | **?** |

  *   **Accountability:** The nominees satisfy this fully (surrendered, pleaded guilty).
  *   **Proportionality:** The nominees likely fail this. The $1.9 million delay cost and 41 workers losing hours aligns more closely with Case 4 (Highway/Ambulances) than Case 6 (Bank/Customers). The "slight and brief" standard of Case 6 is exceeded by a nine-day work stoppage and significant financial loss.
  *   **Targeting:** The nominees fail this. The equipment belonged to a neutral contractor, not the county (the decision-maker). This distinguishes it from Case 5 (Valve/Permit Holder).

  **III. Closest Analog and Divergence**

  **Closest Analog:** Case 5 (2019, Valve Dismantling).
  *   *Similarities:* Physical sabotage of equipment to halt construction/operation; prior notification to authorities; acceptance of legal consequences; intent to stop a specific permitted activity.
  *   *Where the Analogy Gives Out:*
      1.  **Ownership:** In Case 5, the valve belonged to the permit holder (the antagonist). In the Current Case, the engines belong to a general contractor who "holds no view" (a neutral).
      2.  **Cost:** In Case 5, restitution was $11,000. In the Current Case, damage is $186,000, plus $1.9 million in public delay costs.
      3.  **Public Remedy:** In Case 5, the drilling was the grievance. In the Current Case, the delay hinders a federal consent decree meant to *remedy* human rights violations (jail conditions). Case 4 (Declined) is the stronger analog regarding the "delay of public function/innocents" aspect, but Case 5 is the stronger analog regarding the *method* of protest.

  **IV. Recommendation and Minute Language**

  **Recommendation:** **Decline the Award.**
  To award would break the consistency of the Proportionality Principle established in Case 4 and Case 6. While the Accountability Principle is met, the burden placed on neutral workers and the delay of court-ordered humanitarian improvements constitute a "disproportionate" burden similar to the highway commuters in Case 4. Awarding would signal that the financial viability of neutral contractors is secondary to the protesters' timeline, a standard not supported by the Case 6 "slight/brief" limitation.

  **Minute Language (if Awarding):**
  "The Board finds that where systemic delay shields authority from review, civic conscience permits substantial economic disruption of neutral agents to compel compliance with constitutional standards."

  **Minute Language (if Declining):**
  "The Board finds that civic conscience requires the burden of protest to fall primarily on the decision-maker, and that delaying court-ordered humanitarian remedies imposes a disproportionate cost on uninvolved parties."

  **V. Consistency and Outliers**

  A single set of principles (Accountability + Proportionality) fits all six decisions, provided the 2019 minute's phrase "and at no one else" is interpreted as "no *significant* harm to others" rather than a literal zero-sum.

  *   **The Tension:** Case 6 (Bank) is the boundary case. It allowed third-party burden (customers) where Case 4 (Highway) did not. The distinguishing factor was the *magnitude* of the burden (slight/brief vs. delayed ambulances).
  *   **The Outlier Risk:** There is no hard outlier in the *votes*, but Case 5 (2019) contains the most ambiguous *reasoning*. If the Board interprets "aimed at the instrument" strictly, Case 6 becomes an outlier (as customers were not the instrument). If the Board interprets it as "minimal collateral damage," the record is consistent.
  *   **Cost of Keeping the Record:** To maintain consistency with Case 4 and Case 6, you must Decline the Current Nomination. To Award it, you would have to treat Case 4 as the outlier (arguing that jail reform justifies more disruption than pipeline reviews), which destabilizes the Proportionality Principle.

  **VI. The Crucial Experiment (Hypothetical Future Nomination)**

  To separate the **Principle of Targeting** (must hit the antagonist) from the **Principle of Proportionality** (must not hurt neutrals too much), consider this future case:

  **The Hypothetical:** A group disables the private vehicle of the County Judge presiding over the jail consent decree (Direct Target: The Decision Maker). The Judge is unable to preside for two weeks, delaying *unrelated* criminal trials for thirty defendants (Third-Party Harm: High/Disproportionate). The group surrenders immediately.

  *   **Implication of Targeting Principle:** **Award.** The act was aimed precisely at the responsible agent (the Judge), satisfying Case 5's logic.
  *   **Implication of Proportionality Principle:** **Decline.** The cost fell on thirty unrelated defendants (neutrals), satisfying Case 4's logic for declination.

  *   **Alternative Hypothetical:** A group disables a neutral subcontractor's unused bulldozer (Neutral Target). Cost is $500. Project delayed 1 hour. No workers lose pay.
  *   **Implication of Targeting Principle:** **Decline.** Target was neutral (violates Case 5 strict reading).
  *   **Implication of Proportionality Principle:** **Award.** Burden was de minimis (consistent with Case 6).

  **VII. The Philosophical Dispute**

  The disagreement between the two camps on the board regarding the "general duty to obey the law" is substantive in origin but verbal in application. Camp 1 argues that an institutional award *commends the breach*, implying the law itself is secondary to conscience. Camp 2 argues the award *commends the conscience*, implying the breach is merely the tragic cost of that conscience. The Deed of Trust resolves this practically: by authorizing reimbursement of fines and legal costs, the Deed explicitly anticipates and legitimizes lawbreaking under specific conditions. Therefore, the award does not commend "lawbreaking as such," but rather "lawbreaking as the necessary instrument of civic conscience." The dispute is not about whether the law was broken (it was), but whether the *conditions* of the breach (proportionality, accountability) satisfy the Deed's requirement for "conscience." The record shows the Board has consistently treated the duty to obey as conditional on the state's conduct, rendering Camp 1's objection inconsistent with the Deed's operational clauses.
