answer: |-
  # 1. The Exam Question

  **Section B: Applied Ethics (75 Minutes, 25 Marks)**

  **Instructions:** Answer the question below. This question is self-contained. You are not required, and will receive no credit, for attributing views to specific authors or drawing on literature outside the text provided below. Treat the account as a stipulated object for analysis.

  **The Reciprocity Account of Standing**
  *S has standing to blame P for P's violation of norm N only if all three conditions hold:*
  *   **R1 (Compliance).** S complied with N throughout the window that begins when S first came to believe that P's violation had occurred and ends with S's act of blaming.
  *   **R2 (Non-selectivity).** S is disposed to blame violations of N by anyone, including S's intimates and S herself, where the circumstances of those violations are relevantly similar to P's.
  *   **R3 (Motive).** S's act of blaming issues from S's judgement that P violated N together with S's acceptance of N, rather than from the benefits S expects the blaming to bring her.

  **Case A:** Dr. Aris, a departmental chair, publicly and accurately calls out a colleague, Prof. Vance, for taking credit for a student's work. Aris has never done anything of this kind herself. She has a settled record of calling out such conduct in her friends and in her own former students, applying the norm impartially. However, as she would readily admit if asked, she is doing this now largely because the episode gives her a platform she has wanted for some time and because Vance is a rival. Her recognition of the wrong is present but is not what is carrying the act.

  **Case B:** Elena reproaches her brother, Mark, for an affair that is wrecking his marriage. Elena's own affair, which Mark knows about, ended thirteen years earlier. She has been faithful throughout the "window" (from learning of Mark's affair to now) and remains disposed to blame infidelity impartially, including in her own family. However, she maintains that her affair was not a violation at all, since her marriage was already over in all but name, whereas Mark's is not. Mark accepts the norm, accepts that he violated it, and does not resent Elena's reproach.

  **Task:**
  1.  Determine whether *The Reciprocity Account* yields the intuitively right verdict for **Case A** and **Case B**. Explain which clause (or combination) delivers the verdict. In your analysis of Case B, explicitly address the role of the stipulated "window" in R1 and the phrase "relevantly similar" in R2. (10 marks)
  2.  Construct **one further case** of your own design on which the Account yields the wrong verdict. Identify whether the Account is over- or under-inclusive in this instance and explain the mechanism producing the error. (5 marks)
  3.  Evaluate the following objection: *"The Account cannot explain what is wrong with hypocritical blame in cases where it does not strip the blamer of standing. This failure is fatal to the Account."* Do you agree? (7 marks)

  *(Remaining 3 marks for clarity, structure, and concision.)*

  ***

  # 2. Model Answer

  The Reciprocity Account offers a tripartite test for standing. In Case A, the Account correctly denies Aris standing, but it relies entirely on R3. Aris satisfies R1 (she complied) and R2 (she blames impartially). The failure is motivational: her act does not *issue from* the judgement of violation, but from career ambition and rivalry. For the verdict to hold, "issues from" must be read as a dominance condition: if ulterior benefits are the primary driver, standing is lost. This matches the intuition that Aris is opportunistic, though it risks stripping standing from blame that is partly motivated by relationship repair.

  Case B is more problematic. Intuitively, Elena lacks standing due to hypocrisy; she exempts herself from the norm she enforces. However, the Account grants her standing. R1 is satisfied because the "window" opens only when she learns of Mark's affair, thirteen years after her own infidelity. Her past violation is rendered irrelevant by the temporal stipulation. R2 is also satisfied, provided we accept Elena's own accounting of "relevantly similar." She claims the circumstances differ (her marriage was dead; his is not). If R2 assesses similarity based on the blamer's sincere belief, the clause is trivially satisfied by any rationalizing hypocrite. If R2 assesses similarity based on the *correct* moral facts, the clause merely restates that her self-exemption is unjustified without explaining why. R3 is likely satisfied as she acts from acceptance of the norm. Thus, the Account fails to capture the intuition that Elena lacks standing.

  To demonstrate the Account's structural weakness, consider a case of **Repentant Blaming**. Suppose Sam violated N recently (failing R1) but has publicly repented and made amends. He now blames P for violating N. Intuitively, Sam retains standing because his repentance restores his moral position. The Account, however, strictly denies standing because R1 requires compliance throughout the window. This shows the Account is under-inclusive; it treats standing as a binary status based on recent purity rather than moral repair.

  Regarding the hypocrisy objection: The objection states the Account cannot explain the *wrong* of hypocritical blame when standing remains. In Case B, even if we grant Elena standing, her blame feels morally tainted. The Account focuses on *authority* to blame, not the *virtue* of the act. However, this is fatal. If the Account permits Elena to blame, it validates a form of moral address that is inherently manipulative. The deeper issue is the indexing to a single norm N. Hypocrisy often involves a dispute about the norm's reach (as in Case B), not just compliance. By fixing the norm N as given, the Account cannot process the blamer's claim that "my case wasn't N." Consequently, R1 and R2 become redundant. R1 is too narrow (ignoring repentance) or too easily bypassed (via the window). R2 is circular. The entire weight falls on R3 (Motive). But if R3 does all the work, the Reciprocity Account collapses into a simple Motive Account, rendering the reciprocity conditions mere window dressing. Therefore, the objection is fatal: the Account fails to distinguish between legitimate authority and hypocritical performance.

  ***

  # 3. Marking Scheme (25 Marks)

  **Part 1: Case Analysis (10 Marks)**
  *   **Case A Verdict & Mechanism (3 marks):**
      *   1 mark: Correct verdict (No standing).
      *   2 marks: Identifies R3 as the sole operative clause. Notes that R1/R2 are satisfied.
      *   *First-Class Differentiator:* Notes that R3 requires a "dominance" or "sufficiency" reading (ulterior motives cannot be the primary driver), and flags the risk this poses to blame motivated by therapy or repair.
  *   **Case B Verdict & Mechanism (4 marks):**
      *   1 mark: Correct verdict (Account says Standing; Intuition says No Standing).
      *   1 mark: Explains R1 failure to capture intuition due to the "window" stipulation (past violation excluded).
      *   2 marks: Analyzes R2 "relevantly similar."
      *   *First-Class Differentiator:* Identifies the dilemma: If similarity is subjective, R2 is trivial (hypocrites self-exempt); if objective, R2 begs the question (asserts the exemption is wrong without explaining it).
  *   **Synthesis of Case B (3 marks):**
      *   3 marks: Explicitly states that R1 cannot do work in Case B because the window opens post-violation.
      *   *First-Class Differentiator:* Locates the intuition either in R3 (if her motive is self-exemption) or admits the Account simply fails here.

  **Part 2: Counter-Case Construction (5 Marks)**
  *   **Case Design (2 marks):**
      *   2 marks: Case is clearly stipulated and internally consistent.
  *   **Diagnosis (3 marks):**
      *   1 mark: Identifies Over- or Under-inclusiveness.
      *   2 marks: Explains the mechanism.
      *   *First-Class Differentiator:* Uses the "Repentant Blamer" (Under-inclusive) or "Well-Motivated Violator" to show R1 is too rigid. Alternatively, constructs a case where R2 is met but blame is still inappropriate due to power dynamics not captured by N.

  **Part 3: Hypocrisy Objection Evaluation (7 Marks)**
  *   **Understanding the Objection (2 marks):**
      *   2 marks: Correctly interprets the objection as concerning the *moral quality* of blame vs. the *authority* to blame.
  *   **Evaluation (5 marks):**
      *   3 marks: Argues whether the failure is fatal. (Either answer is permissible if justified).
      *   2 marks: Connects the objection to the structure of the Account.
      *   *First-Class Differentiator:* Argues that the fixed-indexing to norm N prevents the Account from handling disputes about the norm's scope (the "normative reach" problem). Argues that R1 and R2 are rendered redundant, collapsing the Account onto R3. A competent answer discusses hypocrisy generally; a first-class answer discusses the *structural redundancy* of the clauses.

  **Part 4: Clarity and Structure (3 Marks)**
  *   3 marks: Concise, follows instructions, no external citations.
  *   0 marks: Citations used or significantly over word count.

  ***

  # Adjudication Note

  **1. Framework Rejection:**
  Students may attempt to argue that the Reciprocity Account is "obviously wrong" and spend the time critiquing its premises rather than applying it.
  *   **Action:** Cap the mark at 10/25 (Fail). The question explicitly instructs them to treat the account as a self-contained object. Rejecting the framework violates the exam constraint. Award marks only for accurate description of *why* they reject it, but penalize heavily for non-compliance with the task.

  **2. Lucky Routes:**
  Students may reach the right verdict (e.g., "Elena has no standing") but via reasoning that contradicts the text (e.g., "She violated N in the past, so R1 fails," ignoring the window stipulation).
  *   **Action:** Award 0 marks for the specific move. In Case B, if a student claims R1 fails because of the past affair, they have not read the definition of the window. This is a reading comprehension failure, not an ethical insight. Award marks only for the Counter-Case and Objection sections if those are sound, but the Case Analysis section must reflect the stipulated rules. A correct verdict derived from ignoring the stipulations is a "lucky guess" and receives no credit for analysis.
