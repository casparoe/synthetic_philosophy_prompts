answer: |-
  Here is the breakdown of your precedents, the principle hiding in the cracks, and how to rule on the warehouse case without blowing up your eight years of case law.

  ### 1. The Closest Analog: The Supplier Co-op
  You are flip-flopping between the **Supplier Co-op** and the **Former Member**, but the record is clearer than you think. The **Supplier Co-op** is the controlling precedent.

  Here is why the Former Member case doesn't apply: In the Former Member precedent, the Congress was directly revaluing an asset *inside* the Federation's financial structure (capital accounts). That is a governance action on internal property. The warehouse workers do not hold capital accounts; they hold jobs.

  The Supplier Co-op precedent governs external economic relationships where a Federation decision causes significant financial harm (loss of income) without direct governance subjection. The warehouse workers are in the exact same position: they are external to the Federation's governance structure, but their livelihood depends on a Federation contract.

  **The Capacity Split is a Red Herring**
  You are worried about two people on the same floor getting different standing. But look closely at your **Third-Party Staff (Cleaners)** precedent. They got binding votes on *safety* but no vote on *surplus*. Standing in your Federation is not attached to the *person*; it is attached to the *interest triggered by the specific motion*.

  *   **Tenant Status:** Does moving a shipping contract violate housing rules or change tenancy terms? No. Their capacity as tenants is dormant.
  *   **Former Member Status:** Does moving a shipping contract revalue their old capital accounts? No. Their capacity as former members is dormant.
  *   **Worker Status:** Does moving the contract impact their labor? Yes. This is the only active capacity.

  Therefore, you do not need to split the ballot. You rule on the interest at stake in the motion. Since the motion is about *contracting*, the only relevant standing is *economic impact*.

  ### 2. The Hidden Principle: Functional Stakeholderism
  You asked what rule you are committing to. You are not an **All-Affected** body (Town Residents got no vote). You are not an **All-Subjected** body (Cleaners have no vote on surplus).

  Your actual operating principle is **Functional Stakeholderism**. It looks like this:

  1.  **Governed Interests:** If the decision imposes a rule you must obey, you get a **Binding Vote** (Cleaners on safety).
  2.  **Severe Economic Interests:** If the decision destroys a livelihood or major revenue stream without imposing rules, you get **Advisory Voice + Response** (Suppliers).
  3.  **Property/Financial Interests:** If the decision alters the value of an asset you hold but doesn't govern you, you get **Compensation, No Voice** (Former Members).
  4.  **Existential/Community Interests:** If the decision impacts health or legal standing without economic contract, you get **Hearing/Delay** (Town Residents, River Trust).

  **The Verdict:**
  Rule that the warehouse workers, as a unified block, receive **Advisory Vote plus a Mandatory Written Response.**

  **Why:** This treats the job loss as a severe economic impact (matching the Supplier Co-op). It avoids the administrative nightmare of issuing three different ballots to people on the same floor. It respects the "capacity" rule by acknowledging that for *this specific motion*, their only active capacity is "economically affected external partner."

  **The Mitigation Clause:**
  To address the internal split without fracturing standing, add a proviso: *While standing is uniform, the Federation's obligation to mitigate harm differs by capacity.*
  *   **Tenants:** Guarantee housing security regardless of employment status (triggering their tenant rights).
  *   **Former Members:** Offer right of first refusal for new roles within the Federation (triggering their alumni status).
  *   **All Workers:** Advisory vote on the transition.

  This keeps the *political* standing consistent while allowing the *remedial* action to be nuanced.

  ### 3. The Alternative Principle (If You Go the Other Way)
  If you rule that the Former Member status grants them **No Vote** (matching the Capital precedent), you are committing to a **Property-Primacy Principle**.

  This rule states: *Financial asset claims trump labor claims.* It implies that having once been a member and holding capital creates a harder boundary than being a current employee of a partner. It signals that the Federation protects its internal balance sheet (Former Members) more rigorously than it protects the livelihoods of external workers (Suppliers).

  If you rule that the Tenant status grants them **Binding Vote** (matching the Cleaners precedent), you are committing to a **Jurisdictional Expansion Principle**. This implies that *any* subjection to Federation rules (even housing) grants sovereignty over Federation assets. This is dangerous; it effectively allows tenants to veto budget decisions because "everything affects housing eventually."

  ### 4. The Test Case: The Franchise License
  You suspect you've been splitting the difference for eight years. You're right. Your precedents wobble on the line between "Subjected" (Cleaners) and "Affected" (Suppliers). The warehouse case doesn't actually break that tie because the workers aren't subject to Federation rules.

  To finally distinguish whether you are an **All-Subjected** or **All-Affected** body, you need a case where the external party is *both* economically affected *and* subject to Federation rules, but not employed by you.

  **Take this hypothetical next:**
  > An independent retail store operates under a Federation "Brand License." They are not an affiliate, but they must follow Federation ethical sourcing rules and marketing guidelines (Subjected). The Congress votes to change the branding guidelines in a way that makes the store's current inventory unsellable, effectively bankrupting them (Severely Affected).

  **The Discriminator:**
  *   **If you grant Binding Vote:** You are an **All-Subjected Body**. Any rule compliance grants governance power, regardless of ownership.
  *   **If you grant Advisory Vote:** You are a **Functional Stakeholder Body** (your current path). Economic harm dictates the voice, rule compliance is just a condition of business.
  *   **If you grant Nothing:** You are a **Membership Sovereignty Body**. Only affiliates vote; everyone else is a vendor.

  **My Recommendation:**
  Stick with the **Supplier Co-op** analog for the warehouse. It is the most stable reading of your history. It protects the Federation from veto-by-vendor (Binding) while acknowledging moral responsibility (Advisory). It keeps the "capacity" doctrine intact without forcing you to hand out three different colored ballots in one breakroom.

  Rule: **Advisory Vote, Unified Block.**
  Reasoning: **Economic impact is the active capacity; tenancy and alumni status are dormant for this motion.**
  Remedy: **Housing security and rehire priority handled administratively, not via Congress vote.**
