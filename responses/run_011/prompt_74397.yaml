      *   **Speaker:** The user (only one working on artificial systems).
      *   **Thesis:** Moral patienthood attaches to *processes* (valenced global reorganization), not bodies. Behavioral/physiological indicators are valid only within their calibration class (mammals/vertebrates/invertebrates with nervous systems), becoming mere analogy outside it. Systems can pass tests and be empty, or be patients and be locked-in. Patient count depends on process integration, not hardware instances.
      *   **Constraints:** No references/bibliography. 8 objections ordered by damage potential. Professional idiom for each objection. 2-minute replies. Mark soft spots. Concessions for opening. The "single reply" that must land. The "prayer" question (is the user's candidate the worst?).

  2.  **Deconstruct the Audience & Thesis Tensions:**
