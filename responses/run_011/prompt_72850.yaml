answer: |-
  **Brainstorm: Initial Readings of "If it isn't written down, it didn't happen"**

  *   *Metaphysical:* Events require an observer/recorder to become real (idealism). Seems absurd, but maybe implied?
  *   *Epistemic:* We cannot *know* it happened without a record. (Confuses truth with justification).
  *   *Institutional:* For the purposes of *this archive*, it doesn't exist. (Bureaucratic reality).
  *   *Legalistic:* Hearsay is inadmissible. (Oral history vs. documentary evidence).
  *   *Power/Silence:* Only the powerful get to write things down, so only their version counts. (The Haitian anthropologist's angle).
  *   *Procedural:* If the rule isn't in the manual, why are we using it? (Self-undermining).
  *   *The "Zero" Problem:* Absence of evidence is not evidence of absence. A gap in the log is data about the log, not the world.
  *   *Attribution:* "Collected by" is a legal status, not a physical description. Requires a specific kind of writing to confer.

  ***

  **Handout for the Committee: Philosophical Analysis of the Maxim**

  **1. Prising Apart the Terms**

  To argue clearly, we must separate three distinct concepts currently tangled in the slogan.

  *   **"Written down":** Does this mean *contemporaneous* notes (the Squire's notebook at the time of purchase) or *retrospective* labels (glued on later)? Does it require the *actor's* hand (the labourer) or the *owner's* hand (the Squire)? Is a covering letter "writing down" the event of exchange?
  *   **"It":** Are we speaking of the *physical event* (a shell was lifted from the shore), the *human agency* (a labourer lifted it), or the *archival status* (the shell is officially 'collected by X')?
  *   **"Didn't happen":** This is the crucial equivocation.
      *   *Metaphysical:* The event literally did not occur in reality.
      *   *Epistemic:* We cannot claim to know it occurred.
      *   *Institutional:* The archive cannot recognise it as valid.

  **2. Distinct Readings of the Proposition**

  Below are six interpretations, ordered from trivial to radical. Each is stated as a formal proposition with a verdict on its truth and utility.

  **Reading 1: The Epistemic Caution**
  *Proposition:* For any historical claim *C*, if no contemporary documentary evidence *D* exists, then *C* cannot be justified to a scientific standard.
  *Verdict:* **False.** Counterexample: Physical traces (the shell itself), oral testimony, and inference from payment records often justify claims where direct logs are missing. This confuses *difficulty of proof* with *impossibility of proof*.

  **Reading 2: The Institutional Boundary**
  *Proposition:* For any entry *E* in this specific catalogue, if no primary document *P* explicitly supports *E*, then *E* is invalid for publication.
  *Verdict:* **Substantive and Defensible.** This is a rule of professional practice, not truth. It protects the archive from error. However, it defines "primary document" narrowly; if payment logs count as *P*, the labourers should be credited.

  **Reading 3: The Metaphysical Claim**
  *Proposition:* For any event *X*, if no record *R* of *X* survives, then *X* did not ontologically occur.
  *Verdict:* **False.** Absurd. It implies the universe ceases to exist unobserved. It is self-undermining if the slogan itself is not written in your procedures: if the rule isn't written down, does the rule not exist?

  **Reading 4: The Authority of Authorship**
  *Proposition:* For any action *A* performed by person *P*, *A* is only attributable to *P* if *P* (or an authorised superior) wrote *A* down at the time.
  *Verdict:* **True only for particular kinds of record.** It holds for legal title, but fails for labour history. A payment record written by the Squire *is* a record of the labourer's action, authored by the payer. To ignore this is to misread the document.

  **Reading 5: The "Zero" Detection Error**
  *Proposition:* For any missing record *M*, *M* indicates the non-existence of the event rather than the non-detection of the event.
  *Verdict:* **False.** As you noted in your fieldwork, a zero is a joint report on the species and the detection probability. A missing label is a report on the *labelling practice*, not necessarily the *collecting practice*. Treating it as the former is a category error.

  **Reading 6: The Procedural Paradox**
  *Proposition:* For any archival rule *G*, if *G* is not codified in the written manual *W*, then *G* is not binding.
  *Verdict:* **Substantive and Defensible (and Self-Undermining for the Cataloguer).** If the slogan "if it isn't written down..." is not itself in your written procedures, then by its own logic, it is not a binding rule. It is merely an opinion.

  **3. Testing the Readings Against the Evidence**

  We apply the readings to the three contested items.

  | Case | Reading 1 (Epistemic) | Reading 2 (Institutional) | Reading 4 (Authority) | Reading 6 (Procedural) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Housekeeper** (Named in Squire's notebook) | Rejects (Not her hand) | **Depends** (Is notebook 'primary'?) | Rejects (Squire wrote it) | Accepts (If manual allows inference) |
  | **Descendant's Letter** (Oral history) | Rejects (Not contemporary) | Rejects (Not primary) | Rejects (Not contemporaneous) | Accepts (If manual allows oral testimony) |
  | **Unlabelled Drawer** (Covering letter exists) | Accepts (Letter is evidence) | **Depends** (Is letter linked to drawer?) | Accepts (Letter documents exchange) | Accepts (If manual allows correspondence) |

  **Flagged Indistinguishable Readings:**
  Readings 1 and 4 yield identical verdicts on all three cases (total rejection of the labourers/housekeeper). If the cataloguer holds either, she will refuse the changes. However, Reading 1 is philosophically weak (truth claim), whereas Reading 4 is professionally strong (attribution claim). You must force her to specify which she holds.

  **4. Conclusion: Intent vs. Function**

  **What the Cataloguer Most Probably Means**
  She is not making a metaphysical claim that the labourers did not lift the shells. She is operating under **Reading 2 (Institutional Boundary)** mixed with **Reading 4 (Authority of Authorship)**. Her worry is about *laundering conjecture into authoritative record*. She fears that if the catalogue states "Prepared by Housekeeper" based on an inference from a payment log, a future researcher will treat that as a hard fact equivalent to a signed label. She is protecting the *status* of the catalogue, not denying the *history*.

  **What the Sentence Was Asked to Settle**
  The slogan was deployed to settle a question of **historical truth** ("Who did the work?").
  The slogan actually settles a question of **archival risk** ("What can we defend without ambiguity?").

  **Recommendation for the Committee**
  The slogan is false as history (Reading 1 & 3) but potentially valid as risk management (Reading 2). However, Reading 2 relies on defining "primary document." If the Squire's notebook recording payment is accepted as a primary document regarding *expenditure*, it must logically be accepted as a primary document regarding *labour*. To do otherwise is to privilege the Squire's ownership over his own accounting.

  You should propose a compromise based on **explicit quantification**: The catalogue may carry the fields "Collected by" and "Prepared by" provided they are qualified by "Attributed via [Source]". This satisfies the historian's need for truth and the archivist's need to distinguish between a label on a shell and a line in a ledger. The slogan should be retired; it is not in your procedures (Reading 6), and it conflates the silence of the archive with the silence of the past.
