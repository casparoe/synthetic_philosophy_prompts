answer: |-
  ### Executive Summary: Is Kalai–Smorodinsky (KS) the Right Tool?

  Your intuition is 80% correct. KS is often superior to the Nash Bargaining Solution for internal cost allocation because it satisfies **Monotonicity**: if the total pot gets bigger or one department's situation improves, that department shouldn't end up worse off. Nash can violate this. KS essentially says: *"Split the gains from cooperation in proportion to what each side would maximally hope for if the other side got their bare minimum."*

  **Correction to your geometry:** You draw the line from the **Disagreement Point ($d$)** to the **Ideal Point ($a$)**. The solution is where that line intersects the **Pareto Frontier ($S$)**.
  *   **Disagreement Point:** What happens if you walk away (costs of outside options).
  *   **Ideal Point:** The best possible outcome for Dept A *assuming* Dept B gets exactly their Disagreement outcome (and vice versa).
  *   **Frontier:** The set of all feasible cost splits (e.g., $x + y = \$400k$).

  **The Trap:** KS is vulnerable to manipulation of the **Disagreement Point**. If Radiology inflates their outside option cost, the Disagreement Point shifts, and the KS line moves in their favor. The "Ideal Point" is mathematically constrained by the total cost, so it's harder to game. **Your audit effort must focus on validating the Disagreement Point, not the Ideal Point.**

  ---

  ### Part 1: The Afternoon Protocol

  Here is the procedure to run this in 3 hours.

  #### 1. Data Requirements (The Inputs)
  You need three numbers per department (Radiology = 1, Cardiology = 2).

  | Variable | Definition | Source in Finance System | Judgment Required? |
  | :--- | :--- | :--- | :--- |
  | **$C_{total}$** | Total shortfall to allocate. | General Ledger / Contract Invoice. | **No.** Hard fact. |
  | **$O_1, O_2$** | **Outside Option Cost.** What it costs each dept if this deal fails (e.g., outsourcing price, deferred revenue penalty). | Vendor contracts, Historical revenue data per RVU/scan. | **Yes.** You must verify the "walk-away" scenario is real, not a bluff. |
  | **$L_1, L_2$** | **Liability Cap.** The maximum each dept *can* pay (usually their available budget or the point where they shut down). | Departmental Operating Budgets. | **Yes.** Determine if they have cash reserves or if this breaks them. |

  #### 2. Constructing the Coordinates
  We frame this as **Gains from Cooperation** (Utility), not Costs. This makes the math work.
  *   **Utility ($U$)** = Cost of Outside Option ($O$) − Allocated Cost ($A$).
  *   If they walk away, Utility = 0.
  *   If they pay nothing, Utility = $O$.

  **Step A: The Disagreement Point ($d$)**
  *   $d_1 = 0$
  *   $d_2 = 0$
  *   *Why?* In "Gain" space, walking away yields zero gain. This anchors the graph at the origin (0,0).

  **Step B: The Ideal Point ($a$)**
  This is the maximum gain Dept 1 can get *while* Dept 2 gets their minimum gain (0).
  *   **Max Gain for Rad ($a_1$):** Cardiology pays as much as possible (up to their Outside Option $O_2$ or Liability Cap $L_2$), Rad pays the rest.
      *   $a_1 = C_{total} - \min(O_2, L_2, C_{total})$
      *   *Wait, simpler:* In Gain space, $a_1$ is the savings Rad gets if Card pays the max feasible share.
      *   **Formula:** $a_1 = O_1 - \max(0, C_{total} - O_2)$
      *   *Translation:* Rad's savings = Their Outside Cost minus whatever they *must* pay because Card can't cover the whole $400k.
  *   **Max Gain for Card ($a_2$):** Same logic reversed.
      *   **Formula:** $a_2 = O_2 - \max(0, C_{total} - O_1)$

  **Step C: The Frontier ($S$)**
  *   The line where Total Allocated Cost = $C_{total}$.
  *   In Gain space: $U_1 + U_2 = (O_1 + O_2) - C_{total}$.
  *   Let **Total Surplus ($V$)** = $(O_1 + O_2) - C_{total}$.
  *   The Frontier is the line $U_1 + U_2 = V$.

  #### 3. The Arithmetic (Copy-Paste for Admin)
  1.  **Calculate Total Surplus:** $V = (O_1 + O_2) - C_{total}$.
      *   *Check:* If $V < 0$, cooperation is worthless. Stop. Walk away.
  2.  **Calculate Ideal Gains:**
      *   $a_1 = O_1 - \max(0, C_{total} - O_2)$
      *   $a_2 = O_2 - \max(0, C_{total} - O_1)$
  3.  **Calculate KS Ratio:**
      *   $Ratio = a_1 / a_2$
  4.  **Calculate Allocated Gains ($U^*$):**
      *   $U^*_1 = V \times [a_1 / (a_1 + a_2)]$
      *   $U^*_2 = V \times [a_2 / (a_1 + a_2)]$
      *   *(Note: This simplifies to splitting the Surplus $V$ in proportion to the Ideal Gains).*
  5.  **Convert Back to Dollar Costs:**
      *   **Rad Pay:** $O_1 - U^*_1$
      *   **Card Pay:** $O_2 - U^*_2$

  #### 4. Handling "Lumpy" Frontiers
  Hospital costs aren't always smooth (e.g., you can't buy 0.5 of a technician).
  *   **Rule:** If the KS line hits a "step" in the frontier (a discrete jump in cost), choose the point on the step **closest to the line**.
  *   **Adjustment:** If the discrete steps mean the total doesn't sum to $C_{total}$ exactly, adjust the department with the larger budget buffer (Liability Cap) to absorb the rounding error. Document this as "Operational Rounding."

  #### 5. Dollars vs. Utilities (The Linearity Check)
  KS assumes $1 of savings is equally valuable to both Chairs.
  *   **The Check:** Ask Finance: "If Rad saves $100k, does it prevent layoffs? If Card saves $100k, does it just buy new coffee?"
  *   **If Marginal Utility Differs:** You cannot use raw dollars. You must apply a **Weighting Factor ($w$)**.
      *   If Rad is in crisis and Card is stable, Rad's dollars are worth more.
      *   *Procedure:* Multiply Rad's Gain ($U_1$) by $w > 1$ before running the KS ratio.
      *   *Warning:* This is pure judgment. If you do this, you are no longer running a math model; you are making a policy decision. **Mark this explicitly in your memo.**

  #### 6. The Inflation Problem (Strategic Misrepresentation)
  *   **Your Worry:** "What if Rad claims their Outside Option ($O_1$) is $10M instead of $1M?"
  *   **The Mechanism:** If $O_1$ goes up, $a_1$ goes up. Rad gets a larger share of the Surplus. **Yes, KS rewards inflating the Outside Option.**
  *   **The Fix:** You are the auditor. Do not accept stated numbers.
      *   **Rad's $O_1$:** Must be backed by a signed quote from the private imaging center.
      *   **Card's $O_2$:** Must be backed by historical revenue data for deferred scans.
      *   **Rule:** "If you cannot document the Outside Option cost with a third-party contract or audited historical data, I will use the system average cost per scan as your Outside Option." This creates a default that punishes bluffing.

  #### 7. Human Judgment Flags (Where Math Stops)
  Stop the spreadsheet and call the CFO if:
  1.  **$V < 0$:** The contract is more expensive than both outside options combined. The rational move is to terminate the suite.
  2.  **One $O_i < 0$:** A department actually *profits* from walking away (rare, but possible with grant clawbacks).
  3.  **Strategic Priority:** The CEO has declared Cardiology the "growth engine." Math says split proportionally; Strategy says subsidize Card. **This overrides KS.**
  4.  **Budget Insolvency:** The KS calculation assigns a cost greater than a department's Liability Cap ($L_i$). You must cap them at $L_i$ and re-run KS for the remainder on the other department.

  ---

  ### Part 2: Worked Cases

  **Assumptions for all cases:**
  *   **Shortfall ($C_{total}$):** $400,000.
  *   **Radiology Outside Option ($O_1$):** Outsource to private center. Cost = $600,000.
  *   **Cardiology Outside Option ($O_2$):** Defer scans. Revenue loss/penalty = $300,000.
  *   **Total System Cost if Walk Away:** $900,000.
  *   **Total Surplus ($V$):** $900k - $400k = **$500,000**. (This is the pot of "savings" we are splitting).

  #### Case 1: The Actual Situation (Baseline)
  *   **Ideal Gain Rad ($a_1$):** Max Rad saves if Card pays max. Card can pay max $300k (their $O_2$). Rad pays remaining $100k. Rad saves $600k (outside) - $100k (pay) = **$500k**.
  *   **Ideal Gain Card ($a_2$):** Max Card saves if Rad pays max. Rad can pay max $400k (total cost). Card pays $0. Card saves $300k (outside) - $0 = **$300k**.
  *   **KS Ratio:** $500k : 300k$ (or 5:3).
  *   **Split the Surplus ($500k):**
      *   Rad Share: $500k \times (5/8) = \$312,500$.
      *   Card Share: $500k \times (3/8) = \$187,500$.
  *   **Final Costs:**
      *   **Rad Pay:** $600k (Outside) - 312.5k (Gain) = \mathbf{\$287,500}$.
      *   **Card Pay:** $300k (Outside) - 187.5k (Gain) = \mathbf{\$112,500}$.
      *   *Check:* $287.5 + 112.5 = 400$.
  *   **Narrative:** Radiology pays more because their pain from walking away is higher ($600k vs $300k). KS recognizes Rad has more to lose, so they get more of the surplus, but they still absorb more of the bill.

  #### Case 2: Cardiology Gets a Grant
  *   **Change:** Cardiology lands a $100k grant restricted to imaging.
  *   **Effect:** This lowers their effective pain. Their Outside Option cost ($O_2$) drops from $300k to $200k (Grant covers part of the deferment penalty).
  *   **New Surplus ($V$):** $(600k + 200k) - 400k = \$400,000$. (The pot shrank).
  *   **New Ideal Gains:**
      *   $a_1$ (Rad): Card pays max $200k. Rad pays $200k. Rad saves $600k - $200k = **$400k**.
      *   $a_2$ (Card): Rad pays max $400k. Card pays $0. Card saves $200k - $0 = **$200k**.
  *   **KS Ratio:** $400 : 200$ (2:1).
  *   **Split Surplus ($400k):**
      *   Rad Gain: $400k \times (2/3) = \$266,666$.
      *   Card Gain: $400k \times (1/3) = \$133,333$.
  *   **Final Costs:**
      *   **Rad Pay:** $600k - 266.6k = \mathbf{\$333,333}$.
      *   **Card Pay:** $200k - 133.3k = \mathbf{\$66,666}$.
  *   **Analysis:**
      *   **Did the split move?** Yes. Rad's cost went UP ($287k \to $333k). Card's cost went DOWN ($112k \to $66k).
      *   **Will Rad think it's insane?** Yes. They will say: "Card got a windfall, why do *we* pay more?"
      *   **The Defense:** The KS logic is "Proportional Sacrifice." Card's *need* for the deal decreased (their outside option got cheaper). Therefore, their claim on the cooperative surplus decreased. Rad is now the "hungrier" party relative to the new baseline.
      *   **Recommendation:** If political stability is more important than game-theoretic fairness, **freeze the split at Case 1 ratios** and treat the grant as Card's internal win. KS is mathematically consistent here, but politically volatile.

  #### Case 3: Identical Numbers, Different Outside Options
  *   **Scenario:** Both Chairs claim they want to pay $0 (Ideal Points identical). But...
  *   **Rad Outside ($O_1$):** $1,000,000 (High volume, critical care).
  *   **Card Outside ($O_2$):** $100,000 (Low volume, elective).
  *   **Shortfall:** $400,000.
  *   **Surplus ($V$):** $1.1M - 400k = $700,000.
  *   **Ideal Gains:**
      *   $a_1$ (Rad): Card pays max $100k. Rad pays $300k. Rad saves $1M - $300k = **$700k**.
      *   $a_2$ (Card): Rad pays max $400k. Card pays $0. Card saves $100k - $0 = **$100k**.
  *   **KS Ratio:** 7:1.
  *   **Split Surplus:** Rad gets 87.5% of the savings. Card gets 12.5%.
  *   **Final Costs:**
      *   **Rad Pay:** $1M - (700k \times 0.875) = \mathbf{\$387,500}$.
      *   **Card Pay:** $100k - (700k \times 0.125) = \mathbf{\$12,500}$.
  *   **Lesson:** The Disagreement Point ($O$) drives the bus. Even if both scream "I want to pay nothing!", the one who bleeds more if the deal fails (Rad) gets a larger share of the savings, which effectively subsidizes their cost. **This is the feature of KS you sell to the CFO:** It rewards dependency on the shared resource.

  ---

  ### Part 3: Nash Bargaining vs. Alternating Offers

  **The Theory:** You are correct. If the Chairs negotiate via back-and-forth offers (Alternating Offers Protocol) with no deadline, the outcome converges to the **Nash Bargaining Solution (NBS)**, not Kalai-Smorodinsky.
  *   **Nash:** Maximizes the *product* of the gains $(U_1 \times U_2)$.
  *   **KS:** Maximizes the *proportional* gain relative to the ideal.

  **What This Means For You:**
  1.  **If you let them talk:** They will haggle until they hit a Nash equilibrium. This usually results in a split closer to 50/50 of the surplus unless one has significantly more "patience" (leverage).
  2.  **If you impose KS:** You are acting as an Arbitrator, not a Facilitator.
  3.  **The Risk:** If you present KS, and Rad has more leverage (e.g., they generate more hospital revenue), they will reject KS and force a Nash dynamic. They will say, "Your math is nice, but we bring in the patients, so we pay less."

  **Strategy:**
  *   Do not present KS as "The Answer." Present it as **"The Baseline for Fairness."**
  *   Say to the CFO: "If we let them negotiate, we will get a Nash outcome which ignores the disparity in their outside risks. I recommend we use KS as the *anchor* to prevent the department with higher leverage from bullying the one with higher dependency."
  *   **Action:** If they counteroffer, check if their offer satisfies **Individual Rationality** (is it better than their Outside Option?). If yes, and they agree, let them sign. Use KS only to break impasses.

  ---

  ### Part 4: Limitations (Where KS is Hollow)

  Do not use this procedure if:

  1.  **Non-Transferable Utility:** If $100k saves Radiology from bankruptcy but only buys Cardiology a new breakroom fridge, dollars are not comparable. KS treats $1 as $1. If the *pain* per dollar differs vastly, KS is unjust.
      *   *Refusal Condition:* If one Dept is operating at a loss and the other has a surplus, do not use KS. Use "Ability to Pay."
  2.  **Repeated Game Dynamics:** This is an annual meeting. If you use KS to force Cardiology to pay more this year, they may sabotage cooperation next year (e.g., schedule fewer shared scans). KS is a one-shot solution. It does not account for retaliation.
  3.  **The "Zero" Problem:** If a department's Outside Option is effectively zero (they can just stop doing scans with no penalty), their $O_i = 0$. Their Ideal Gain $a_i = 0$. KS gives them **zero share of the surplus** and assigns them costs up to their cap. This can look punitive.
      *   *Fix:* Set a floor. "No department pays more than X% of their budget regardless of KS output."
  4.  **Moral Hazard:** If Radiology knows you will use KS, and they know KS rewards higher Outside Options ($O_1$), they may intentionally sign worse vendor contracts next year to inflate $O_1$ and get a better subsidy.
      *   *Fix:* Add a clause: "Outside Options are capped at the market average rate, not your specific contract rate."

  ### Final Recommendation for the Meeting
  Walk in with the **Case 1 KS Calculation** printed.
  1.  Tell the Chairs: "I have modeled a fair split based on proportional risk. This is the benchmark."
  2.  Tell the CFO: "This model prevents the department with the better outside option from exploiting the one that is more dependent on the suite. It protects hospital volume."
  3.  If they fight: "If you two can agree on a different split that is better for both of you than this one, I will sign it. If not, this is the number I am recommending."

  This uses KS as a **threat point** to force agreement, which is often more powerful than using it as a rigid formula.
