  ### Part 4: Does Your View Predict Anything Unique?

  **Straight Answer:** No. Not in its current form.

  Your view is a **redescription** of the output distribution, not a prediction of it.
  *   If people say $X$, you say "Concept X had highest salience."
  *   If people say $Y$, you say "Concept X was blocked, Y had next highest salience."
  *   If people say $X$ sometimes and $Y$ others, you say "Temperature varied."

  **What would make it unique?**
  To make a unique prediction, your model must commit to a salience ordering *independent* of the analogy data.
  *   *Example Prediction:* "Successor is always more salient than Repeat unless blocked."
  *   *Test:* Run Item 1 ($12 \to 23$ :: $1122 \to ?$).
  *   *SSV Prediction:* $1123$ (because Successor > Group-Shift).
  *   *Rival Prediction:* $2233$ (Structure > Local Feature).

  If you do not fix the salience order *a priori*, you are not testing a theory of analogy; you are measuring the aggregate preferences of your subjects and calling it "salience." That is psychophysics, not cognitive modeling.

  **Recommendation:**
  To save the theory from unfalsifiability, you must publish the **Baseline Salience Vector** (e.g., Successor=0.9, Run=0.8, Repeat=0.5) derived from a separate task (e.g., simple feature detection speeds), and then use *only* the context-rescaling rules to predict the analogy items. If you fit the vector to the analogy items themselves, the view is tautological.
