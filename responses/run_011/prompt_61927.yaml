      *   **Goal:** Identify contradictions (which pull against each other), rank them by severity, explain what must go/cost, and identify the single best revision.
      *   **Constraints:** One-sentence bottom line first. Then the audit. Keep the whole thing under 400 words.
      *   **Context:** Last year, a film won (met all 3 criteria by majority vote) but *no single juror* would have picked it as the overall winner. This is the "discursive dilemma" or "doctrinal paradox."

  2.  **Analyze the 7 Principles:**
      1.  Vote criteria separately (majority on each); award falls out automatically. No vote on the award itself.
      2.  Accountability: Published reasoning must be held by the panel (not decoration).
      3.  Legitimacy: Most jurors must endorse the decision all-things-considered (a verdict no juror holds isn't ours).
      4.  Secrecy + Yes/No rules out horse-trading.
      5.  Deliberation should change minds (jurors should move).
      6.  Criteria fixed mid-round, but can be rewritten for next year based on learnings.
      7.  Consistency across years (bound by earlier juries' interpretations).

  3.  **Identify the Core Conflict:**
      *   The scenario described (Film wins criteria votes 7-2, 6-3, 5-4, but no juror supports the film overall) is a classic logical paradox known as the *Doctrinal Paradox* (or Discursive Dilemma).
      *   Principle 1 (Vote criteria separately, award falls out) directly conflicts with Principle 3 (Legitimacy requires most jurors to endorse the decision all-things-considered).
      *   Principle 1 allows a "winner" that no individual juror supports (as happened last year).
      *   Principle 3 forbids exactly that outcome.
      *   Principle 2 (Accountability/Reasoning) is also strained because the "reasoning" (meeting criteria) is aggregate, not individual.

  4.  **Rank Severity:**
      *   **Severe:** 1 vs. 3. This is the logical contradiction that caused last year's "fluke." You cannot have both automatic aggregation of criteria votes (1) and require individual holistic endorsement (3).
      *   **Moderate:** 1 vs. 2. If no individual holds the verdict, the published reasoning is arguably "decoration" (violating 2).
      *   **Minor:** 4 (Horse-trading) is likely naive given the paradox, but not a direct contradiction. 5, 6, 7 are procedural and compatible with either resolution.

  5.  **Determine the Fix:**
      *   To resolve 1 vs. 3, you must change the voting mechanism.
      *   Option A: Drop 1. Vote on the award directly (holistic verdict). Cost: Loss of specific criteria accountability.
