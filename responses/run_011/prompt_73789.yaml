answer: |-
  # Teaching Plan: Rousseau's *Letter to d'Alembert* (Discussion Section)

  ## I. The Dependency Structure (Sequence of Claims)
  Do not present Rousseau's arguments as a list of grievances. Present them as a logical chain where each link supports the next. If a link breaks, the subsequent claims will appear to be non-sequiturs or moralizing. Write this skeleton on the whiteboard immediately after the introduction to show the architecture of the hour.

  1.  **The Mechanism of Pleasure (Foundation):** Theater does not teach new virtues; it polishes and reinforces sentiments we already hold.
      *   *Dependency:* This must be established first. If students believe theater *teaches* morality, Rousseau's subsequent critique of its political utility makes no sense.
  2.  **The Critique of Catharsis (Hinge):** Because theater reinforces rather than corrects, the "purgation" of pity is sterile. We weep for fictional characters to avoid acting for real ones.
      *   *Dependency:* Relies on Claim 1. If theater corrected us, catharsis would be a reset button. Since it only reinforces, catharsis is an expenditure of moral energy with no return.
  3.  **The Institutional Critique (Structure):** The physical separation of spectator and actor creates political passivity. We pay to be passive.
      *   *Dependency:* Relies on Claim 2. Passivity is only a vice if the activity we are foregoing (civic engagement) is where moral work happens.
  4.  **The Festival (Payoff):** The alternative is not better plays, but an event where the crowd is the spectacle.
      *   *Dependency:* Relies on Claim 3. The festival solves the structural problem of spectatorship, not the aesthetic problem of bad plays.

  **Timing:**
  *   **0:00–0:05:** Introduction & The Elephant in the Room (Budget Cuts).
  *   **0:05–0:15:** Claim 1 (Mechanism of Pleasure) via *The Misanthrope*.
  *   **0:15–0:25:** Claim 2 (Catharsis) & Claim 3 (Institutional Critique).
  *   **0:25–0:35:** Claim 4 (The Festival).
  *   **0:35–0:45:** Misconception Check & Open Debate (using the standing objection).
  *   **0:45–0:50:** Closing Check for Understanding.

  ## II. The Carrying Case
  **Decision:** Use **Rousseau's reading of Molière's *The Misanthrope***.
  **Rationale:** While a recent production feels more relevant, using their own work or a recent cut show risks conflating Rousseau's philosophical argument with the administration's budgetary decisions. If you use their work, Rousseau becomes the "alibi" for the cuts. If you use *The Misanthrope*, Rousseau remains a distinct interlocutor. You can bridge the gap by asking them to map Rousseau's description of the *Misanthrope* audience onto their experience of a modern audience, but the textual anchor must be Molière.

  **What the Case Must Supply:**
  *   It must demonstrate a character who is morally upright but socially ridiculous (Alceste).
  *   It must demonstrate a character who is morally compromised but socially agreeable (Philinte).
  *   It must allow you to ask: "Who did you laugh at? Who did you like?"

  **What the Case Must Lack:**
  *   **Literary Evaluation:** Do not ask "Is *The Misanthrope* a good play?" Ask "Is Rousseau's description of how we *watch* it accurate?"
  *   **Historical Context:** Do not explain 17th-century French court politics. Treat the play as a machine for generating audience reaction.

  **Execution:**
  When you introduce *The Misanthrope*, frame it explicitly: "Rousseau is not doing literary criticism here. He is doing audience sociology. He is making a claim about what happens to *you* in the dark when you watch Alceste. We are testing his claim about your psychology, not Molière's skill."

  ## III. The Misconception Map
  There are five predictable failure modes. You cannot defuse all of them without turning the section into a lecture. You must head off four and deliberately leave one standing to fuel the discussion.

  | Misconception | Status | When to Address | What to Say (Script) |
  | :--- | :--- | :--- | :--- |
  | **1. Rousseau is a censor objecting to content.** | **Defuse** | **Start (0:05)** | "Rousseau does not care if the play is lewd or virtuous. He cares that the *building* separates you from your neighbor. He would object to a play about saints if it made you sit passively in the dark." |
  | **2. He denies purgation out of piety.** | **Defuse** | **During Catharsis (0:15)** | "This isn't about sin. It's about economics of emotion. If you spend your pity on Othello, you have less urgency for the person starving outside the theater. It's a resource allocation problem, not a religious one." |
  | **3. The festival is just cheaper theater.** | **Defuse** | **During Festival (0:25)** | "In the festival, there is no stage. If you are watching, you are also performing. The distinction isn't ticket price; it's whether you are an object or an agent." |
  | **4. Actors are liars.** | **Cut** | **N/A** | (See Section V: Explicit Cuts). Do not engage the "acting is lying" argument; it personalizes the attack too much for this specific group. |
  | **5. One play changing a mind refutes him.** | **LEAVE STANDING** | **Discussion (0:35)** | **Do not answer this.** When a student says, "But *Rent* changed my life," or "I saw a play and volunteered the next day," accept this as a valid counter-argument. Say: "That is the strongest objection to Rousseau. If art can spur action, his structural critique fails. Who else has experienced this?" |

  **Why leave #5 standing?**
  It validates their professional identity without validating the administration's budget cuts. It allows them to use their expertise as artists to critique the philosopher. It turns the section from "Rousseau vs. You" to "You vs. Rousseau," which is intellectually safer and more engaging than "Rousseau vs. The Administration."

  ## IV. Closing Check for Understanding
  Do not ask "Do you agree?" Ask them to classify a scenario. This distinguishes grasping the *criteria* from merely liking or disliking the conclusion.

  **The Scenario:**
  "Your classmates have devised a piece performed in the round. There is no ticket. The audience sits on the floor. Halfway through, the performers invite the audience to stand and move the set pieces to change the scene. Some audience members refuse and just watch; others join in."

  **The Question:**
  "Under Rousseau's criteria, is this **Theater** (harmful/inert) or a **Festival** (beneficial/active)? And does the answer change depending on which audience member you ask?"

  **Correct Classification (for your reference):**
  *   It begins as Festival (no separation, no ticket).
  *   It becomes Theater for those who refuse to participate (they become passive spectators).
  *   It remains Festival for those who move the set (they are co-creators).
  *   *Key Insight:* The distinction is not the *event*, but the *relationship* between the participant and the spectacle.

  **If they say:** "It's theater because there are actors," they have missed the point (Structure > Role).
  **If they say:** "It's a festival because it's in the round," they have missed the point (Participation > Geometry).
  **If they say:** "It depends on whether the audience acts," they have grasped the argument.

  ## V. Explicit Cuts
  You have 50 minutes and a hostile/skeptical audience. You must announce what you are *not* doing to signal that you respect their time and are not hiding the "dangerous" parts of the text. Write this list on the board under "Out of Scope" and verbally confirm it in the first five minutes.

  1.  **Genevan Economics:** "We are not discussing whether Geneva could afford a theater. We are discussing whether a human being *should* want one."
  2.  **The Actor's Trade & Actresses:** "Rousseau makes specific claims about the morality of the acting profession and women on stage. We are cutting this. We are focusing on the *spectator*, not the worker." (This is crucial for conservatory students; it removes the ad hominem attack on their future careers).
  3.  **Rousseau's Playwriting:** "We are not discussing that Rousseau wrote plays himself. We are treating this text as a coherent argument, not a biography."
  4.  **Discourse on the Arts and Sciences:** "We are not linking this to his earlier work. We are treating this argument as self-contained."

  ## VI. Introduction Strategy (The First 5 Minutes)
  You must address the budget cuts before they distract the room. Do not ignore them; do not validate the administration.

  **Script:**
  "I know the university announced cuts to the mainstage season last month. I know three of you were in the cast of the production that was dropped. It is tempting to read Rousseau's argument as a philosophical justification for that budget memo. It is not. Rousseau is not arguing that theater is too expensive; he is arguing that it is politically *passive*. The administration cut the shows for money. Rousseau would ban the building for the sake of civic virtue. Those are opposite arguments. Today, we are analyzing Rousseau's argument about virtue, not the administration's argument about money. We are going to treat your craft seriously, which means taking the strongest critique of it seriously."

  **Whiteboard Setup:**
  Draw a simple line down the center.
  Left side: **Theater** (Spectator | Passive | Reinforcement).
  Right side: **Festival** (Participant | Active | Expression).
  Leave the middle blank to fill in during the "Catharsis/Hinge" section.

  ## VII. Contingency Plan
  **If the room goes silent during the *Misanthrope* section:**
  Pivot immediately to the "Standing Objection" (#5). Ask: "Who here has seen a play that made them want to do something? Not feel something, *do* something." Use their anecdotes to reconstruct Rousseau's counter-argument (i.e., "Rousseau would say that feeling was already in you; the play just woke it up. Does that diminish the experience?").

  **If a student accuses you of defending the budget cuts:**
  Stop. Refer back to the "Explicit Cuts." Remind them: "Rousseau objects to the *ticket*, not the *budget*. If the administration gave you more money to build a more beautiful theater, Rousseau would still object. I am not defending the cut; I am teaching the text."
