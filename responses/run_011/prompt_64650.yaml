answer: |-
  TO: Technical Steering Committee
  FROM: Chair, Technical Steering Committee
  DATE: October 24, 2023
  SUBJECT: Decision on Choice Principles and Auditability

  I recommend we adopt Option 2: localize choice, requiring every result whose proof depends on it to carry an explicit tag so the dependency graph is queryable. Specifically, we will treat the constructive dependent type theory base as the default ambient logic. Any theorem relying on the Law of Excluded Middle, the Axiom of Choice, or weaker variants like Dependent Choice must declare these dependencies in its signature. We will simultaneously maintain a "Classical Mode" module that imports these axioms globally for users who prefer textbook fidelity, but the core library must remain tagged. This motion is ready for a vote.

  This decision balances the conflicting requirements of our two primary constituencies. The aerospace contractors require an audit trail to certify numerical software; they cannot accept silent assumptions. The graduate programs require fidelity to standard texts; they can achieve this by importing the Classical Mode module without forcing those assumptions on the contractors. By tagging dependencies, we preserve the computational content of the constructive base while allowing classical reasoning where explicitly requested. This ensures that no user inherits a logical cost they did not intend to pay.

  For the two members of this committee who are not logicians, the distinction between Full Choice and Dependent Choice matters because of what they allow us to compute. Dependent Choice allows us to make a sequence of selections where each choice depends on the previous one; this is generally compatible with constructive computation. Full Choice allows us to select elements from infinitely many sets simultaneously, without a rule for how the selection is made. In our specific foundation, the constructive type theorist is correct: Diaconescu's theorem applies. Adopting Full Choice at the kernel level would indeed drag the Law of Excluded Middle in with it, silently destroying the constructive reading of the whole corpus. The third member's hope that this result does not apply here is unsafe; we cannot risk invalidating the constructive guarantees required by the certification team. Therefore, Full Choice must be treated as a significant logical cost, distinct from the base theory.

  To enforce this, we are establishing a bright-line rule for contributors: If a proof invokes an axiom not in the constructive base, the theorem statement must carry a parameter or tag identifying that axiom. Silent imports of choice principles are prohibited in the core library. Contributors need not consult the committee for routine cases; they must simply inspect their proof terms for axioms.

  We apply this rule immediately to the two pending pull requests. The first adds the theorem that every vector space has a basis. The author notes this is equivalent over ZF to Full Choice. Under the new rule, this theorem must be tagged explicitly as requiring the Axiom of Choice. It cannot be merged into the core algebra module without this tag, as it is not available over the constructive base. The second proves Hahn–Banach for arbitrary Banach spaces via an ultrafilter argument. The author maintains this needs nothing stronger than the Boolean Prime Ideal Theorem (BPI). This theorem must be tagged as requiring BPI. While BPI is weaker than Full Choice, it is still not part of the constructive base. Both PRs will be accepted conditionally, provided the authors update the signatures to reflect these dependencies before merging.

  We will execute the following transition plan to address the inconsistent practice in the existing corpus. 
  *   **Month 1 (November 2023):** The repository will be frozen for feature additions. A working group of five senior contributors will audit the analysis module, where classical logic was previously invoked silently. They will insert tags for excluded middle and choice wherever found.
  *   **Month 2 (December 2023):** The "Classical Mode" module will be created. This module will import the tagged axioms globally, allowing educators to continue using the library as if Option 1 were in effect. Documentation will be updated to guide students to this module.
  *   **Month 3 (January 2024):** The audit extends to the algebra and topology modules. Any legacy code that cannot be tagged without significant refactoring will be deprecated and moved to a legacy namespace.
  *   **Month 6 (June 2024):** The core library must be fully compliant. Any remaining untagged dependencies on choice principles will be removed or tagged. The certification team will perform a final audit of the functional-analysis results they depend on to confirm the dependency graph is queryable.

  This plan ensures that the contractors receive the auditability they demand within six months, while the educators lose no functionality, only the assumption that classical logic is free.

  The strongest consideration on the losing side comes from the senior contributor who argues that tagging axioms is a category mistake. He holds that axioms are not candidates for truth but moves that fix the rules of a corpus; recording choice as a hypothesis implies there is a genuine mathematics in which the theorem might fail, a claim he views as philosophically incoherent. This objection cuts deepest because it challenges the semantic integrity of the library. If mathematics is defined by its rules, then changing the rules changes the subject matter, making the tagging seem like a confusion of use and mention.

  However, this objection does not carry the decision because we are not building a purely philosophical corpus; we are building infrastructure for software certification. The contractors do not care about the metaphysical status of axioms; they care about risk. If a theorem relies on Full Choice, their toolchain cannot verify the computational content of that existence claim. To them, the dependency is a tangible risk, not a category mistake. We cannot privilege the formalist's philosophical consistency over the auditor's practical requirement for traceability. Our library serves two masters, and only explicit tagging allows us to serve both without deception. The formalist is free to work in the Classical Mode module where the rules are fixed, but the core must remain transparent.

  We are not recommending further study or a pilot. The inconsistency in our current practice is already causing friction with our users. We must decide. I ask the committee to vote on Option 2 as described.
