  4.  **Drafting the Audit (Iterative Process):**

      *   *Tone:* Direct, critical, philosophical, no hedging. The user asked for an audit, not a survey.
      *   *Structure:*
          1.  Executive Summary (The Verdict).
          2.  Ranked Tensions (Severity 1 to 3).
