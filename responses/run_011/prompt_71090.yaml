  **Popper's Measure**
  Popper defines verisimilitude ($Vs$) using Truth Content ($Ct_T$) and Falsity Content ($Ct_F$). $A$ is closer than $B$ iff $Ct_T(A) \ge Ct_T(B)$ and $Ct_F(A) \subset Ct_F(B)$ (with one strict).
