  I've been sitting in on a colleague's seminar for two terms now — she works on public reason, and she's remarkably consistent about when religious arguments are allowed into politics, but she has never once written the criterion down and I want to pin it before I cite her in something. Here's her track record as I've got it in my notes:

  1. Senator arguing against an authorization for military force: invokes Catholic just-war teaching on the floor, plus the intelligence agencies' civilian-casualty estimates, which she says are what actually settle it for her. Fine, my colleague says.
  2. Governor signing a near-total abortion ban: signing statement is scripture and nothing else, and she tells reporters she has no non-religious argument. Not fine.
  3. Rank-and-file voter, local ballot measure raising the sales tax to fund pre-K: votes yes purely because her congregation teaches that caring for poor children is obligatory, never tells anyone why. Fine.
  4. Judge's opinion invoking a natural-law account of human dignity — descended from Aquinas but statable without any appeal to revelation, and plenty of secular jurists have said versions of it. Fine.
  5. Candidate at a church breakfast grounding her anti-death-penalty stance in her reading of the Gospels; asked by a reporter what she'd say on the Senate floor, she gives a fallibility-and-deterrence argument she says she genuinely finds convincing. Fine.
  6. Backbencher supporting an utterly ordinary pesticide restriction: floor speech leads with his faith, then, pressed by a colleague, he adds a cost-benefit rationale he admits he doesn't buy and says he wouldn't vote for the bill on that basis alone. Not fine.
  7. School board adopting a mandatory health curriculum defended entirely in public-health terms; a religious parents' association says that from inside their own commitments they have no reason whatsoever to accept it. Legitimate anyway, she says.
  8. Majority-faith legislator's ban on a face covering worn for religious reasons, backed by public-safety reasons he sincerely holds and says he'd vote for on their own. Fine — but when someone in the room pointed out that the women who wear it have no reason of their own to accept the ban, she said that changes the case, and then wouldn't say how.

  Now here's the one coming up next week and I want to place a bet. Senator Okafor, member of a very small religious minority, sponsors a bill capping solitary confinement at fifteen days. Her floor speech gives only her tradition's teaching about what may not be done to a person; she says openly that she went looking for a secular argument she could accept and didn't find one. But she does read into the record a staff-drafted human-rights-and-prison-management rationale, saying she doesn't find it persuasive, though she doesn't think it's false either. And she spends a long stretch arguing that the guards' and wardens' own unions have strong reasons drawn from their own stated commitments to want the cap, and that the people it binds are a state agency, not her community.

  So: predict her verdict on Okafor. But I mostly want the machinery. Which principles fit 1–8 all at once? Off the top of my head: a Rawls-ish proviso thing (comprehensive doctrines allowed so long as public reasons come along, eventually, and she takes them to be sufficient); a Habermas-ish two-track thing (say what you like informally, translation required inside official institutions); an Audi-ish thing (you have to have, and be moved by, an adequate secular reason); a Gaus/Vallier convergence-ish thing (what matters isn't shared premises but whether each person the law binds has some reason of their own from within their own standards); a plain no-sham rule (the public reason has to be doing real work, not decoration); plus maybe scope limits — only constitutional essentials and basic justice, and/or only officials, not voters. Some of these overlap and I strongly suspect 1–8 don't separate all of them, and that 6/7/8 are where they come apart. Also worth flagging: I can't tell whether her verdicts are judgments about whether the law is legitimate or about whether the speaker behaved, and I think that ambiguity matters for Okafor.

  Give me the whole thing as a single JSON object, no prose outside it, with exactly these fields:

  - "rules_considered": array of objects, each with "name" (short label), "statement" (the criterion phrased so it could be applied to a fresh case, one or two sentences), "fits" (numbers of the verdicts it explains cleanly), "strains" (numbers it handles badly or only with an ad hoc patch, and say in one clause what the patch would be), "okafor_verdict" (one of "permissible", "impermissible", "legitimate but the speaker is out of line", "she'd waffle"), "why" (one or two sentences), "confidence" (0–1)
  - "underdetermined_pairs": array of objects with "pair" (two names), "why_the_record_cant_separate_them", "verdicts_that_leave_it_open" (numbers)
  - "best_guess": object with "verdict", "rule_bet_on", "why_over_the_alternatives", "confidence"
  - "discriminating_case": object with "description" (a case I could actually put to her next term), "prediction_if_rule_A", "prediction_if_rule_B", "one_question_to_ask_her"
  - "notes": string — anything that doesn't fit above, including your answer on whether she's assessing laws or speakers, and any rule I didn't think of that does better on 1–8 than mine do
