answer: |-
  **Brainstorm Notes / Internal Memo**

  **To:** Self
  **Re:** Ishiguro/Strawson Chapter Spine

  **Initial Reaction:**
  The spine is solid, but you're risking a category error on the Gallery point if you aren't careful. Strawson says responsibility isn't settled by metaphysical facts (determinism), but he *does* allow that empirical facts (psychosis, childhood, coercion) warrant the objective stance. Miss Emily's error isn't trying to prove they have souls per se; it's thinking the *public* needs proof to take the participant stance. Strawson would say the public has already opted out. The Gallery is a symptom, not the cause. Your critique needs to be that Strawson underestimates how hard it is to maintain the participant stance when the state incentivizes the objective one.

  **The "Addressee Problem":**
  This is your strongest original contribution. Don't dilute it. If you say Tommy's rage is just "grief," you betray the moral intuition of the scene. It *is* moral rage. But Strawson ties reactive attitudes to the quality of will of specific agents. Here the "will" is systemic.
  *Decision:* Argue that Tommy's rage exposes a limit in Strawson's interpersonal focus. Strawson assumes a background moral community where attitudes can land. The novel shows a community where the landing strip is paved over. The rage is a "phantom limb" of the participant stance—it proves the stance is natural (contra the society's conditioning) but renders it politically impotent. This challenges Strawson's optimism that the participant stance is unavoidable. Kathy proves it is avoidable if the cost is too high.

  **Kathy's Apathy:**
  Strawson says a wholesale switch to the objective stance is "practically inconceivable." Kathy is the counter-example. She survives by objectifying herself and her friends. This isn't just psychological; it's political survival. You need to press the point that Strawson's theory is liberal-individualist; it assumes agents meeting on roughly equal footing. Hailsham removes the footing.

  **Risk Assessment:**
  1.  **Steamrolling Strawson:** Don't make Strawson look naive. He knows about coercion. The point is the *scale* and *institutionalization* of the objective stance.
  2.  **Steamrolling Ishiguro:** Don't reduce the book to a thought experiment. The melancholy matters. The lack of resentment isn't just a philosophical data point; it's a tragedy.
  3.  **Scene Accuracy:** I'm confident on the Miss Lucy dismissal, Madame's fear, Tommy's field scream, and Ruth's deathbed confession. No need to flag uncertainty there.

  **Final Position:**
  The novel doesn't just apply Strawson; it historicizes him. It shows that the "participant stance" is a luxury good protected by political structures. When those structures vanish, the objective stance becomes the only survivable option. The novel contributes the insight that moral responsibility requires a *political* precondition Strawson ignores.

  **Structure:**
  1.  Intro: The stance switch as the novel's central mechanism.
  2.  Hailsham as Stance Machine (Lucy vs. Guardians).
  3.  The Gallery & The Empirical Mistake (Strawson's critique + Structural addendum).
  4.  Tommy's Rage (The Addressee Problem).
  5.  Kathy's Narration (The Atrophy).
  6.  Conclusion: What the novel gives philosophy (The political precondition of responsibility).

  **Tone:**
  Philosophical but attuned to literary texture. No dry exegesis.

  ***

  **The Objective Stance at Scale: Moral Responsibility in *Never Let Me Go***

  P.F. Strawson's intervention in the debate over free will was to shift the ground from metaphysics to interpersonal life. He argued that whether we hold someone responsible does not depend on solving the problem of determinism. It depends on whether we treat them as a participant in a shared moral community or as an object to be managed. We take up the participant stance when we expect goodwill, understanding, and reciprocity. We switch to the objective stance when those expectations are defeated—when someone is too young, too disturbed, or too coerced to know what they are doing. We do not resent a toddler for spilling milk; we manage them. We do not resent the storm for destroying the house; we endure it.

  Kazuo Ishiguro's *Never Let Me Go* depicts a world where this switch has been engineered at an industrial scale. The horror of the novel is not merely that clones are harvested for organs, but that the society surrounding them has successfully reclassified them from persons to patients. The institutions in the book function as machines for producing the objective stance, suppressing the natural human impulse to treat these creatures as moral equals. Reading the novel through Strawson reveals that the tragedy is not a failure of metaphysics, but a failure of moral vision. However, pushing Strawson's framework against the specific textures of Ishiguro's world also exposes a blind spot in the philosopher's theory. Strawson assumes the participant stance is a default setting of human psychology, difficult to extinguish. The novel suggests that without political protection, the participant stance is fragile, and the objective stance can become a survival mechanism. The book does not just illustrate Strawson; it pressures his claim that we cannot live without holding each other responsible.

  The educational institution of Hailsham is designed to modulate this stance. The guardians are instructed to keep the students healthy and cared for, but crucially, half-informed. They are to be soothed, not addressed. This is the objective stance in practice: treating the students as beings whose inner lives are irrelevant to their function. When Miss Lucy breaks this convention, telling the students plainly that they are destined for donation and death, she is not just leaking information; she is attempting to restore the participant stance. She treats them as agents entitled to the truth about their own lives. Her dismissal confirms the institution's priority: the system cannot tolerate participants. It requires objects.

  This dynamic is crystallized in the early scene where Madame encounters the students. When she sees them dancing to a pop song, she weeps. The students interpret this as fear, a revulsion at their unnatural existence. A Strawsonian reading suggests something more precise. Madame is not afraid of them; she is overwhelmed by the collision of stances. She sees them behaving as children—participants in a game, expressing joy—and she is forced to remember that her society views them as livestock. Her tears are the pain of recognizing a participant while being compelled to treat them objectively. She hugs herself not because they are monsters, but because acknowledging their humanity would break the moral contract of her world. She retreats into the objective stance to preserve her own equilibrium.

  Later, the guardians attempt to bridge this gap through the Gallery. Miss Emily collects the students' art to prove to the wider world that the clones have souls. From a Strawsonian perspective, this project is misconceived from the start. Strawson argues that being a proper object of reactive attitudes is not an empirical question you settle with evidence. You do not prove someone is human by showing them solving math problems or painting pictures; you acknowledge them as human by engaging with them as such. The Gallery assumes the public's refusal to hold the clones responsible is a mistake of fact, something correctable by data. But the refusal is a choice of stance. The public does not lack evidence of the clones' interiority; they lack the will to acknowledge it. To demand proof of a soul before granting moral standing is to have already adopted the objective stance. It treats the clone as a specimen to be examined rather than a person to be met.

  However, dismissing Miss Emily's project as philosophically naive risks being too cheap. Strawson's model focuses on interpersonal relationships between individuals. He does not fully account for a stance that is collectively engineered, funded, and taught. The world of *Never Let Me Go* is not a collection of individuals failing to connect; it is a state apparatus manufacturing disconnection. The public's refusal is cultivated. They are taught to look away, to use euphemisms like "completion" instead of death, to treat the donors as separate from the human community. Strawson assumes that the participant stance is the natural baseline of human interaction, something we only leave for specific reasons like coercion or insanity. The novel suggests that the objective stance can be normalized. It can become the baseline. If Strawson is right that we cannot conceive of a society without reactive attitudes, Ishiguro presents the counter-example: a society that functions precisely by suppressing them. The Gallery was not a philosophical error; it was a desperate political attempt to fight a structural foreclosure of the participant stance with empirical tools. It failed because the barrier was not epistemic, but political.

  This structural foreclosure creates a specific moral phenomenon that Strawson's interpersonal framework struggles to categorize. Consider the moment after the protagonists visit Miss Emily and learn the truth about the Gallery's failure. Tommy, usually gentle, forces the car to stop in a empty field and screams into the wind. He kicks the dirt. He rages. But who is the rage for?

  Strawson's reactive attitudes seem to require an addressee. Resentment answers someone's ill will toward me; indignation answers someone's ill will toward another. These attitudes are communicative; they demand a response from the offending agent. But in this scene, there is no specific agent to blame. Miss Emily acted out of a twisted benevolence. The guardians followed orders. The society is a diffuse abstraction. Tommy's rage has no target. I call this the addressee problem. It is moral rage stripped of its object.

  One might argue that Tommy's outburst is merely grief wearing rage's clothes, a physiological release rather than a moral attitude. This would preserve Strawson's model by categorizing the scream as non-moral. But this feels like a distortion of the text. The rage is apt. It is the correct response to injustice. The problem is not that the rage is inappropriate, but that the moral community required to receive it has been dismantled. Tommy is screaming at a structure that cannot hear him. This exposes a gap in Strawson's scheme. He assumes that if we feel reactive attitudes, there is someone to hold responsible. The novel shows that we can feel the attitudes even when the target is structural violence. The rage is a phantom limb of the participant stance. It proves that the impulse to hold someone responsible is natural, even when the social conditions make it impossible to do so. Tommy's rage does not refute Strawson's claim that these attitudes are natural, but it refutes the assumption that they always find a home. In a totalitarian system, the participant stance becomes a private suffering rather than a public language.

  If Tommy represents the frustration of the stance, Kathy represents its atrophy. Her narration is preternaturally calm. She recounts betrayals, losses, and her own impending death with a flatness that borders on the uncanny. She rarely expresses resentment toward the guardians, the system, or even her friends who wrong her. Strawson argues that a wholesale switch to the objective stance is practically inconceivable for normal humans; it would amount to a loss of our humanity. Kathy seems to have achieved exactly that. She survives by objectifying herself and her relationships. She treats her own life as a case study, her friendships as temporary arrangements, and her death as a scheduled procedure.

  Is Kathy a counter-example to Strawson's psychological claim? Yes, but with a crucial caveat. Strawson's argument assumes reciprocity. He imagines agents who can expect their reactive attitudes to be met. Kathy lives in a world where reciprocity is structurally foreclosed. To resent the system is to invite psychological collapse, because the system cannot change. To resent her friends is to lose the only comfort available to her. Her lack of resentment is not a philosophical choice; it is a survival strategy. She has learned that the participant stance is too costly. When you cannot change the world, and you cannot leave it, you must stop expecting it to behave morally.

  This is most evident in her relationship with Ruth. In the final stages of Ruth's life, there is a flicker of the participant stance. Ruth attempts amends. She confesses her manipulations regarding Kathy and Tommy. She hands over the address of a rumored deferral program, pushing them to go ask for more time. This moment is the most intact moral relationship in the book. It works because, for a brief window, they treat each other as agents capable of truth and forgiveness. Ruth seeks forgiveness; Kathy offers it. But this reciprocity is limited to the dying. It cannot extend to the living world. Once Ruth is "completed," Kathy returns to her calm narration. She does not rage against the system that took Ruth. She does not rage against the friends who let it happen. She drives on.

  This suggests that Strawson's theory is historically and politically contingent. He describes the moral psychology of a liberal society where agents meet on roughly equal footing and where institutions are expected to be responsive to moral demands. *Never Let Me Go* describes a caste society where one group is designated as expendable. In such a world, the objective stance is not an exemption granted for specific reasons like insanity; it is the default setting for the oppressed. Kathy's narration shows that the participant stance is not just a psychological necessity; it is a political luxury. It requires a world where holding someone responsible makes a difference. When responsibility is severed from power, the reactive attitudes atrophy.

  So, what does the novel contribute to the debate that argument alone cannot? Philosophy often treats the objective stance as a temporary retreat, a timeout we take when normal morality fails. Ishiguro shows us what it looks like when the timeout becomes permanent. He gives us the phenomenology of the objective stance from the inside. It is not just a theoretical position; it is a way of speaking, a way of remembering, a way of dying. The novel forces the philosopher to admit that the participant stance depends on more than just human psychology. It depends on a world that allows us to be participants.

  Strawson wants to save moral responsibility from the metaphysicians who say determinism makes it impossible. Ishiguro warns us that politics can do what determinism could not. You do not need to prove that free will is an illusion to destroy moral responsibility. You only need to build a system where some people are not allowed to have wills, and others are trained not to see them. The novel's contribution is the insight that moral responsibility is not just a matter of individual will or interpersonal recognition. It is an ecological condition. It requires a habitat. When the habitat is poisoned, the attitudes die, or they turn inward like Tommy's scream, or they flatten out like Kathy's voice.

  Ultimately, the spine of the chapter holds, but it bends under the weight of the novel's political reality. Strawson provides the vocabulary to describe the mechanism of dehumanization—the switch from participant to objective stance. But Ishiguro provides the critique of Strawson's optimism. He shows that the switch is not just a matter of individual reasons, like coercion or ignorance. It can be a matter of policy. The novel does not just ask us to apply Strawson's ideas to clones; it asks us to recognize that our own capacity for responsibility is fragile, dependent on a world that agrees to treat us as more than resources. If Strawson tells us why we hold each other responsible, Ishiguro tells us what happens when we are forbidden from doing so. The silence of the clones is not a lack of soul; it is the sound of the objective stance completing its work.
