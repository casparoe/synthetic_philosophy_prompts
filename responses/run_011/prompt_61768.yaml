  **Advertisement by the Delegate**

  It is the custom of this assembly to demand positions, yet truth is often shy of assertion. Wherefore I submit not a decree but a series of interrogations, hoping to stir the mind of the delegate rather than compel his vote. For as a physician questions the patient before prescribing, so must a citizen examine the constitution of the protocol before strengthening it. These queries are offered without design to censure, but merely to illuminate those corners of the whitepaper which remain in shadow. If the answers be clear, the proposal stands strengthened; if obscure, then prudence suggests a pause. I seek no victory in debate, but only that the public treasury be not mistaken for a private coffer.

  **Queries**

  1. Whether it be not true that wealth is truly the industry of the people, rather than the cold metal locked in a private vault unseen by any eye?
  2. Whether money be not merely a ticket or counter, devised to record and stimulate this industry amongst neighbours in the market place?
  3. Whether a nation might not be rich in gold yet poor in bread, if the counters lie idle in the purse of the miser?
  4. Whether the swiftness with which counters pass from hand to hand be not equivalent to a greater quantity moving slowly through the land?
  5. Whether it be not the circulation, rather than the substance, that gives life and motion to the body politic in all its members?
  6. Whether gold hath any virtue save that it setteth men to work in hopes of obtaining it for their wants and necessities?
  7. Whether denominations may not be retained and trade flourish, although the bullion be gone abroad to foreign lands for debts paid?
  8. Whether the creating of wants be not the likeliest way to produce industry in a people otherwise content with sloth and bare subsistence?
  9. Whether the AUREUS Protocol doth not claim its token is free of peril because it bindeth the issuer to specific metal in Zurich?
  10. Whether sixty parts in a hundred of this supply be not locked in vault contracts, earning new coins yearly without labour or industry?
  11. Whether paying men to leave their counters unmoved be not contrary to the natural nature of circulation and trade amongst the citizens?
  12. Whether it be not true that a promise to redeem in metal doth discipline the issuer against excess and folly in emission?
  13. Whether the oracle that marketh the price on-chain be not itself a witness subject to error or corruption by bad men with gain?
  14. Whether the audit, performed but quarterly, leaveth not ample time for the vault to be emptied unseen by any human eye?
  15. Whether it be not also true that a promise nobody believes will be honored cannot hold its price in the open market?
  16. Whether the founders holding fifteen parts in a hundred, vesting over four years, be not a private tax upon the public trust and hope?
  17. Whether the governance token, called VOTE, conferring rights but no claim on the gold, be not a shadow governing the substance of the treasury?
  18. Whether those who stake their tokens do not withdraw them from the market, thus slowing the pulse of trade and industry in the protocol?
  19. Whether the boast of no peril be not a confusion, since the custodian in Zurich is still a man subject to temptation and failure?
  20. Whether the body politic, like an animal body, lives not under various indispositions, perfect health being seldom found in such complex financial schemes?
  21. Whether a national bank properly signifieth not a bank in the hands of the public, with no shares for private men to hold?
  22. Whether the public alone ought not to be proprietor of the credit, and reap all the benefit of the emission for the common good?
  23. Whether tokens issued upon the security of the industry of the island be not safer than those upon foreign metal in vaults abroad?
  24. Whether whatever quickens buying and selling enricheth not a nation, regardless of the backing promised in the whitepaper by the founders?
  25. Whether a token backed by nothing but a picture of a dog doth not stir more industry than a tonne of gold in a Swiss vault, if the former circulates wildly and the latter sleeps?
  26. Whether the zeal of the holders of the dog token be not a form of wealth, insofar as it moveth them to labour for it eagerly?
  27. Whether the AUREUS stakers, expecting yield from new minting, do not dilute the claim of the holder who spendeth his coin in trade?
  28. Whether the vesting schedule doth not align the founders' interest with the duration of the scheme rather than the good of the users?
  29. Whether the oracle network be not a priesthood interpreting the value of the metal to the laity of the chain without appeal?
  30. Whether the public might not be better served by credit secured on the lands and labour of the citizens themselves rather than foreign bullion?
  31. Whether I myself, proposing a public bank, am not liable to the same question regarding who guardeth the guardians of the ledger?
  32. Whether any man can truly say what backs the confidence of a people, save their mutual hope and fear of the morrow?
