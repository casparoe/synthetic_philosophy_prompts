answer: |-
  **The Case: The Depot Regularity**

  **Scenario**
  An inland freight depot in the Midlands is served by forty owner-operator hauliers who are not employees, hold no association, share no common room, work staggered shifts, and almost never meet. Access to the loading bays presents a recurrent coordination problem: drivers must choose between reversing in or driving nose-first, where either pattern works well if universal but causes gridlock if mixed. Over eighteen months, a regularity of reversing settled without designer, announcement, or contract. The practice is sustained by two night clerks who have no stake in traffic flow and lose nothing from deviation, but who keep a private notebook and withhold discretionary favours—priority on paperwork, preferred unloading slots, access to the kettle—from recorded deviators. Drivers know the regularity and suspect the notebook, but iterations of knowledge stop short of common knowledge because shifts rarely overlap and clerks never discuss the log. In instances where the coordination payoff vanishes, such as a driver arriving at an empty yard at three in the morning who would strictly prefer to drive nose-first and faces no collision risk, the practice holds; a driver who departs from it is criticised afterwards if a clerk happened to see.

  **Timeline of Emergence**
  *   **Months 1–6:** Mixed usage; frequent gridlock when shifts overlap.
  *   **Months 7–12:** Reversing becomes frequent; night clerks begin noting deviations privately.
  *   **Months 13–18:** Reversing becomes near-universal; clerks apply sanctions sporadically.
  *   **Month 19+:** 3:00 AM deviations occur and are subsequently criticized by peers despite no coordination cost.

  ***

  ### Demonstration

  **1. Spec Sheet**

  | Condition | Lewis (*Convention*) | Bicchieri (*The Grammar of Society*) |
  | :--- | :--- | :--- |
  | **Regularity / Conformity** | **Satisfies.** Drivers consistently reverse in. | **Satisfies.** Behaviour is consistent. |
  | **Expectation of Conformity** | **Satisfies.** Drivers expect others to reverse. | **Satisfies.** Empirical Expectation (EE) is present. |
  | **Preferences over Combinations** | **Satisfies (Initially).** Universal reversing is preferred to mixed. | **N/A.** Focus is on conditional preference to conform. |
  | **Conditional Preference for General Conformity** | **Fails (at 3 AM).** At 3 AM, the preference to reverse is not conditional on coordination payoff (which is zero), but on avoiding clerk sanctions. | **Satisfies.** Preference is conditional on EE and Normative Expectation (NE), regardless of coordination payoff. |
  | **Alternative Equilibrium** | **Indeterminate.** Nose-first remains a viable equilibrium, but preference structure has shifted. | **N/A.** Norms can sustain one equilibrium against another via sanctions. |
  | **Common Knowledge (CK)** | **Fails.** Structural isolation prevents infinite recursion of "I know that you know..." | **Satisfies.** Requires only EE and NE, not full CK. |
  | **Normative Expectation / Sanctions** | **Secondary.** Sanctions are external to the coordination problem. | **Constitutive.** Sanctions/NE are required for a Social Norm. |
  | **Verdict** | **Not a Convention.** Fails CK and the coordination-based preference condition. | **Social Norm.** Satisfies EE, NE, and conditional preference contingent on expectations. |

  **2. The Single Feature**
  The feature that does the work is the **decoupling of the clerks' sanctions from the coordination payoffs**. While the epistemic shortfall technically disqualifies the case for Lewis (who requires Common Knowledge), a Lewisian could argue that CK is approximated by salience. The decoupling is the substantive wedge: in the 3 AM case, the coordination problem is absent, yet the behaviour persists solely due to the sanction. For Lewis, a convention is a solution to a coordination problem; if the problem vanishes, the reason to conform should vanish unless it is purely precedent-based expectation of *coordination*. Here, the motivation has shifted from "I reverse to avoid gridlock" to "I reverse to avoid the clerk." Bicchieri's account captures this shift in the *source* of the conditional preference (from material payoff to normative expectation), whereas Lewis's account struggles to explain why a coordination convention binds when coordination is impossible.

  **3. Removal Tests**

  *   **Test A: Strip out the sanctions.**
      If the clerks stop keeping the notebook and withholding favours, the 3 AM driver immediately noses in (maximizing personal utility with no coordination cost). During the day, the practice becomes fragile; without the external sanction, the regularity relies solely on the expectation of coordination. As drivers realize the coordination risk is low (due to staggered shifts), the regularity degrades into a **mere habit** or dissolves entirely. It loses its normative grip.
  *   **Test B: Restore common knowledge.**
      If the depot posts a notice and calls a drivers' meeting, establishing that everyone knows that everyone knows the rule, the epistemic barrier is removed. For Lewis, this **becomes a convention** (or perhaps an explicit agreement), as the CK condition is now met. However, for Bicchieri, this may **weaken the normative grip**. By making the rule explicit and official, the motivation may shift from "this is what we do" (social norm) to "this is what I am told to do" (compliance with authority), potentially reducing the peer-to-peer criticism that sustained the norm previously.

  **4. Strongest Counterattack**
  **The Lewisian Counterattack:** The Lewisian argues that the 3 AM arrival is **not an instance of the recurrent situation**. The "recurrent situation" is defined as *arrival when coordination is possible*. The 3 AM case is an outlier irrelevant to the definition of the convention. The convention persists because, in the *relevant* cases (daytime), the coordination payoff exists.
  **Assessment of Cost:** Accepting this forces the Lewisian to admit that the *description* of the situation determines the ontology. If the agents themselves treat the 3 AM case as governed by the same rule (which they do, by reversing), the theorist must explain why the agents apply a "coordination convention" to a non-coordination scenario. It costs the Lewisian the ability to explain the *normative continuity* across different contexts, conceding that something else (a norm) is bridging the gap between coordination and non-coordination instances.

  **5. Fragility Note**
  The design is fragile regarding the definition of the **Recurrent Situation**. A Lewisian in the room will deny that the 3 AM instance counts, arguing that conventions only bind when the coordination problem is active.
  **How to answer:** Press the group on how the *agents* define the situation. If the drivers say, "The rule is: always reverse at the depot," then the situation is "Arriving at the depot," not "Arriving at the depot when others are present." If the rule applies to the broader situation, Lewis must explain why a coordination convention binds in non-coordination instances. If he cannot, he must concede that the social object governing the behaviour is not merely a convention, but a norm that *outlives* the coordination problem. The ontological question is whether the rule is defined by the *payoff structure* (Lewis) or the *agents' understanding* (Bicchieri).
