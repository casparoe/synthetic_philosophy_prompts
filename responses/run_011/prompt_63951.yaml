      *   **Bicchieri (Social Norms):**
          *   Empirical Expectation (EE): Believe others do it.
          *   Normative Expectation (NE): Believe others *think* one ought to do it / believe others will sanction.
          *   Conditional Preference: Preference to conform *contingent* on EE and NE.
