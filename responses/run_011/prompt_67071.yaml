answer: |-
  1. Institutional Continuity holds that responsibility persists wherever the bureaucracy, archives, and treaties remain unbroken, validating your verdicts on the existing state and overthrown regime. This forces you to reject the split-state exception unless archives were divided, and it rules that a state absorbing a chartered company's assets inherits its liabilities.

  2. Motive Purity states an apology is valid only if triggered by moral recognition or new evidence, never by strategic leverage, which supports your distinction between the trade negotiation and the delayed evidence. This contradicts your acceptance of any hollow non-monetary apology, and it dictates that an annexing state owes no apologies for wrongs predating the annexation.

  3. Perpetual Identity argues the state is an immortal moral agent liable for all acts committed under its flag regardless of population turnover, explaining the 150-year-old massacre and overthrown regime verdicts. This forces you to abandon the split-state verdict since both successors share the identity, and it confirms that an annexing state inherits the annexed territory's unapologized debts.

  4. Sovereign Succession posits that responsibility follows formal sovereignty and international recognition rather than moral continuity, defending your intuition about the UN seat holder in the split state. This forces you to give up the verdict on the overthrown regime if it lost recognition, and it settles that a state absorbing a chartered company does not inherit liability unless it formally assumed the charter.

  5. Restorative Function claims an apology is owed only when it can function as a genuine repair rather than a transactional tool, justifying your rejection of the trade negotiation apology and acceptance of the evidence-based one. This challenges your verdict that a hollow apology is worth having, and it suggests a state inherits a trading company's wrongs only if it profits from the original assets.
