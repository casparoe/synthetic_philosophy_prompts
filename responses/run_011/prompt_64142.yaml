  7.  *(Self-Correction during drafting)*: I initially thought about calling it a c-chart. But since the "area of opportunity" (days per week) is constant, c-chart works for counts. But since he rotates focus, it's more about the *trend* of the specific virtue. Let's stick with "Stratified Run Chart / Check Sheet" to be precise. The "One Virtue Per Week" is definitely a *Stratification* tactic to reduce noise.

      *Wait, on the "Spec Adjustment":* In QE, if you can't meet spec, you fix the process. If you can't fix the process, you change the spec (Design of Experiment/Engineering Change). Franklin changing the protocol because his memory failed is an *Engineering Change Order* to the measurement system, not the process spec. He didn't lower the bar on Temperance; he lowered the bar on the *tracking protocol*. That's a crucial distinction.

