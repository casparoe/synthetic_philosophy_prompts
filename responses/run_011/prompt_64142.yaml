      *   *One-Virtue-Per-Week:* This is *Stratification*. He's isolating variables. Instead of monitoring all 13 simultaneously (multivariate control), he focuses attention (special cause hunting) on one channel while monitoring the rest for stability. It's an *OCAP (Out-of-Control Action Plan)* trigger: If a mark appears, immediate correction.
