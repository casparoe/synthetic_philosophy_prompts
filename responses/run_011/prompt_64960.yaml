answer: |-
  The error lies in **Premise (2)**.

  You have constructed a version of the **Sorites Paradox** applied to moral harm, often discussed in the literature as the "Problem of Imperceptible Harms" or the "Invisible Hand Paradox." Your intuition that the conclusion in (6) is unacceptable (a grave wrong with no wrongdoers) is the correct one; standard moral theory cannot tolerate "free-floating" harms.

  Here is the diagnosis of the error, the cost of correcting it, and potential paths forward for your paper.

  ### 1. The Error: The Epistemic Fallacy in Premise (2)

  Premise (2) states: *Whether a person's situation has gone differently is detectable in principle from his side.*

  This premise conflates **ontology** (what is the case) with **epistemology** (what can be known/perceived). It asserts that a difference in a person's welfare only exists if that person (or an observer on their behalf) can detect it.

  **Why (2) is false:**
  Physical and physiological states change continuously, not discretely. When the first smelter discharges cadmium, the chemical composition of the river changes. When that water is consumed, the cadmium concentration in the residents' bloodstreams increases. Their cellular health degrades by a microscopic amount.
  *   **The Reality:** The residents *are* worse off in World A (1 unit) than in World B (0 units).
  *   **The Perception:** They cannot *tell* the difference.

  If you keep (2), you make moral status dependent on the sensory acuity of the victim. If the downstream town had hyper-sensitive biological detectors, the first smelter would be wrongful. If they do not, it is permissible. Morality cannot hinge on the victim's ability to measure the harm.

  Therefore, **(2) must be rejected.** A person's situation can go worse without it being detectable to them.

  ### 2. The Cost to Your Original Claim

  You asked what giving up (2) costs the original claim (*"a single person's contribution... is not itself wrongful, since the world goes exactly as it would have gone without it"*).

  **The cost is total.**

  Your original defense relied on the claim of **Causal Impotence**: "The world goes exactly as it would have gone without it."
  *   By rejecting (2), you admit that the world does **not** go exactly as it would have. It goes microscopically worse.
  *   By keeping (1) (*An act wrongs someone only if it makes things worse for that person*), you must now admit that the act **does** make someone worse off.
  *   Consequently, the act satisfies the necessary condition for wrongfulness.

  If you accept that micro-harms are harms, then the single flight, the single meal, and the single smelter discharge are all *pro tanto* wrongful (wrongful in themselves, though perhaps outweighed by other factors). You can no longer argue they are permissible because they make "no difference." They make a tiny difference, and if a thousand tiny differences constitute a poison, each tiny difference is a dose of that poison.

  ### 3. Can You Salvage the Claim?

  If you reject (2), your original argument collapses. However, you might be able to defend a *modified* version of your claim by shifting the ground. Here are three options:

  #### A. The *De Minimis* Defense (Risky)
  You could argue that while the act makes things worse, the harm is so trivial that it falls below the threshold of moral significance.
  *   **The Cost:** This invites the Sorites Paradox right back in. If one unit is morally negligible, is two? At what precise number does negligence become wrongfulness? If there is no sharp line, you face the regress in your step (5) again. Most ethicists reject *de minimis* thresholds for exactly this reason.

  #### B. The Expected Utility Defense (Recommended)
  Instead of arguing that the *actual* outcome is identical, argue that the *expected* outcome is what matters.
  *   **The Argument:** While it is unlikely your single flight is the "threshold" trigger that causes the climate disaster, there is a non-zero probability that it is. If the harm is massive (climate collapse) and the probability is small (1 in a million), the **expected disvalue** is still significant.
  *   **The Benefit:** This allows you to keep (1) and reject (2) without relying on imperceptible micro-harms. You condemn the act based on risk, not actual undetectable impact.
  *   **The Cost:** You must concede the act is wrongful (or at least rationally impermissible). You cannot defend it as "harmless."

  #### C. The Complicity Defense
  You could shift from a consequentialist framework (harm-based) to a deontological one (participation-based).
  *   **The Argument:** Even if your act causes no harm, it makes you **complicit** in a harmful practice. You are joining a collective enterprise that you know causes harm.
  *   **The Benefit:** Explains why the act feels wrong even without causal impact.
  *   **The Cost:** This abandons your Premise (1). You would be arguing that an act can be wrongful even if it makes no one worse off (because your individual contribution didn't change the outcome). Since you stated you want to keep (1), this is likely off the table.

  ### 4. Recommendation for the Paper

  You are currently in a position where your argument proves too much (it exonerates the collective poisoners). In academic philosophy, a reductio ad absurdum against one's own conclusion is a signal to retreat and reformulate.

  **Do not try to save Premise (2).** It is philosophically indefensible to claim that undetectable changes are non-existent changes.

  **Instead, pivot your thesis.**
  Rather than defending the claim that the act is *not wrongful*, consider defending the claim that the act is **not blameworthy** or **not the primary locus of moral concern.**

  *   **Revised Claim:** "While a single contribution constitutes a micro-harm (rejecting 2), it is misleading to focus on individual wrongfulness in collective harm scenarios. The structural injustice is the true wrong, and individual acts are merely symptoms."
  *   **Why this works:** It accepts the reality of micro-harms (solving the paradox) but preserves the intuition that singling out the individual flyer is disproportionate.

  **Summary:**
  1.  **Drop Premise (2).** It confuses detection with reality.
  2.  **Accept the cost.** You can no longer claim the act makes "no difference." It makes a microscopic difference.
  3.  **Reformulate.** Argue that while the act is technically a harm, the *moral weight* lies elsewhere (structural analysis), or shift to an **Expected Utility** model to explain the wrongfulness without relying on imperceptibility.

  If you cling to the original claim ("not wrongful") while dropping (2), you will be forced to argue that micro-harms are morally negligible, which leaves you vulnerable to the aggregation objection (Step 5). The most robust philosophical position is to admit the micro-harm but contextualize its significance.
