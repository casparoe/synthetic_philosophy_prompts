  # WEEK ONE PLACEMENT INSTRUMENT: EPISTEMIC INTUITIONS

  **Instructions:** This is not a test of knowledge. There are no right or wrong answers. Your responses will be used to map your pre-theoretical intuitions about how we come to know things. Answer based on your immediate epistemic reaction to the cases. Do not overthink.

  ### I. THE LOGICAL SPACE

  We are investigating the sources of knowledge. When you claim to know something, what is the source of that claim? Candidates include: **Perception** (direct sensing), **Inference** (reasoning from evidence), **Testimony** (trusting a report), **Comparison** (learning via similarity), **Postulation** (positing a fact to explain a discrepancy), and **Non-apprehension** (knowing something is absent because you don't see it).

  Philosophical positions arise not just by accepting these candidates, but by **reducing** them. A reductionist argues that what looks like one source is actually just another source in disguise. For example, one might argue Testimony is just Inference (you infer the speaker is truthful), or that Non-apprehension is just Inference (you infer absence from the lack of perception).

  **Order of Questions:**
  The questions below are ordered by dependency. Questions regarding Testimony (3–4) assume you have already taken a stance on Inference (2), because reductionists treat testimony as a form of inference. Questions regarding Postulation and Non-apprehension (6–7) assume a stance on Inference, as these are the primary candidates for reduction to inference. Question 4 follows Question 3 specifically to test if your attitude toward testimony changes based on the *source* (mundane vs. sacred) rather than the *mechanism*. Question 9 is a meta-question about how we should count these sources in the first place.

  ---

  ### II. DIAGNOSTIC CASES

  **1. The Unrecognized Animal**
  You are walking in a forest and see a shape moving in the brush. For a brief moment, you see it clearly, but you do not recognize it as a deer, a bear, or anything specific. You simply see *that* thing.
  *   **A.** You already know something about the world in that moment; the raw seeing is a form of knowledge.
  *   **B.** You do not yet know anything; knowledge only begins when you classify it as a specific kind of thing.

  **2. The Smoke on the Hill**
  You see smoke rising from a distant hill. You know that wherever there is smoke, there is fire. You conclude there is fire on the hill.
  *   **A.** This counts as a genuine source of knowledge distinct from simply seeing the smoke.
  *   **B.** This is not a new source; it is just a complex way of seeing or remembering connections.
  *   **C.** This does not yield knowledge at all; only direct seeing yields knowledge.

  **3. The Stranger at the Station**
  You are lost at a train station. A stranger tells you, "The train leaves from Platform 4." You have no way to check their identity or verify the claim before boarding.
  *   **A.** You can know the train leaves from Platform 4 based solely on their word.
  *   **B.** You cannot know it from their word alone; you must infer that they are telling the truth.

  **4. The Vedic Injunction**
  A priest tells you that performing a specific ritual will yield a result in the afterlife, a result no living person has ever seen. The command comes from a text regarded as authorless and sacred.
  *   **A.** This word is a unique source of knowledge, different from the stranger at the station.
  *   **B.** This is the same as the stranger at the station; if one is knowledge, both are, or neither is.

  **5. The Forester and the Wild Ox**
  A forester tells you, "A *gavaya* is like a cow." Later, you see an animal in the forest that resembles a cow and realize, "This is what *gavaya* means."
  *   **A.** This realization is a distinct source of knowledge (learning via similarity).
  *   **B.** This is just a mixture of hearing the testimony, seeing the animal, and remembering the cow.

  **6. The Fat Man Who Does Not Eat**
  A man is noticeably fat, yet you know he never eats during the day and is never home at night.
  *   **A.** You come to know he eats at night by a distinct process of explaining the discrepancy.
  *   **B.** You come to know he eats at night by inferring the best explanation for his fatness.

  **7. The Absent Pot**
  You look at a bare, well-lit floor where a pot usually sits. You know straightaway: "There is no pot here."
  *   **A.** Knowing the absence is a distinct source of knowledge.
  *   **B.** Knowing the absence is just inferring that if a pot were there, you would see it.

  **8. The Deceptive Source**
  You discover that a source you trusted has deceived you once before. Regarding future claims from this source:
  *   **A.** Their claims should be presumed true until you have specific evidence to defeat them.
  *   **B.** Their claims are neutral; they require positive verification before they count as knowledge.

  **9. Counting the Sources**
  How should we decide how many sources of knowledge exist?
  *   **A.** Count the distinct kinds of objects that can be known.
  *   **B.** Count the distinct ways cognitions arise in the mind.
  *   **C.** Use parsimony; minimize the number of sources as much as possible without losing explanatory power.

  ---
  *[END OF STUDENT HANDOUT]*
  ---

  # INSTRUCTOR KEY AND DIAGNOSIS

  ## SCORING KEY

  The following table maps student answer profiles to classical Indian epistemological positions (*darśanas*). Note that students may not fit perfectly; look for the dominant reductionist commitments.

  | Answer Pattern (Commitments) | Position (School) | *Pramāṇa* List (Means of Knowledge) | Reduction Argument Resisted |
  | :--- | :--- | :--- | :--- |
  | **Accepts Q1(A), Q2(C), Rejects Q3–7** | Cārvāka (Materialist) | Perception Only (*Pratyakṣa*) | Resists all reduction *to* perception; rejects inference and testimony entirely as independent or valid. |
  | **Accepts Q2(A), Rejects Q3(A), Q5–7** | Buddhist (Yogācāra/Sautrāntika) | Perception, Inference (*Pratyakṣa, Anumāna*) | Resists reducing Inference to Perception; reduces Testimony, Comparison, etc., to Inference. |
  | **Accepts Q2(A), Rejects Q3(A), Q5–7** | Vaiśeṣika (Atomist) | Perception, Inference (*Pratyakṣa, Anumāna*) | Resists reducing Inference to Perception; reduces Testimony to Inference (speaker reliability must be inferred). |
  | **Accepts Q3(A), Rejects Q5–7** | Sāṃkhya / Yoga | Perception, Inference, Testimony (*Pratyakṣa, Anumāna, Śabda*) | Resists reducing Testimony to Inference (word carries unique authority); reduces Comparison/Postulation. |
  | **Accepts Q3(A), Q5(A), Rejects Q6–7** | Nyāya (Logic) | Perception, Inference, Testimony, Comparison (*Pratyakṣa, Anumāna, Śabda, Upamāna*) | Resists reducing Comparison to Testimony/Perception (similarity yields unique cognition); reduces Postulation/Non-apprehension. |
  | **Accepts Q3(A), Q5(A), Q7(A), Rejects Q6** | Mīmāṃsā (Prabhākara) | Perception, Inference, Testimony, Comparison, Non-apprehension (*...Anupalabdhi*) | Resists reducing Non-apprehension to Inference (absence is directly perceived); reduces Postulation to Inference. |
  | **Accepts Q3(A), Q5(A), Q6(A), Q7(A)** | Mīmāṃsā (Kumārila) | Perception, Inference, Testimony, Comparison, Postulation, Non-apprehension (*...Arthāpatti, Anupalabdhi*) | Resists reducing Postulation to Inference (explanatory posit is distinct from logical deduction). |
  | **Accepts Q3(A), Q5(A), Q6(A), Q7(A)** | Advaita Vedānta | Perception, Inference, Testimony, Comparison, Postulation, Non-apprehension (*...Arthāpatti, Anupalabdhi*) | Resists reducing Postulation to Inference; often aligns with Kumārila on epistemic counts. |

  *Note on Buddhist vs. Vaiśeṣika:* Both accept two sources. They are distinguished by Q9. Buddhists typically choose Q9(A) (objects: particulars vs. universals). Vaiśeṣikas typically choose Q9(B) or (C) depending on the commentator, but often align with Parsimony regarding *pramāṇas* while maintaining a robust ontology. If Q9 does not separate them, they are seated together.
  *Note on Kumārila vs. Advaita:* These positions are often identical regarding the *number* of *pramāṇas*. They are distinguished by metaphysical commitments not captured here (e.g., the reality of the world). For seating purposes, they are allies.

  ## DIAGNOSIS

  ### (a) Empty Cells: Impossible or Unstable Combinations

  1.  **Accepts Postulation (Q6-A) but Rejects Inference (Q2-C).**
      *   *Verdict:* **Incoherent.** Postulation (*arthāpatti*) is structurally an inference to the best explanation (the man eats at night *because* he is fat). A student who accepts Postulation but rejects standard Inference holds a logically unstable position; one cannot posit an explanation without employing inferential reasoning. No classical school occupies this cell.
  2.  **Accepts Testimony (Q3-A) but Rejects Inference (Q2-C).**
      *   *Verdict:* **Unstable.** To accept testimony as valid usually requires the capacity to understand language and context, which relies on inferential processes. While Cārvākas reject both, no school accepts Testimony as valid while claiming Inference yields no knowledge, as Testimony is often defended as a form of Inference or requires Inference to validate the speaker.
  3.  **Accepts Non-apprehension (Q7-A) but Rejects Perception (Q1-B).**
      *   *Verdict:* **Unattractive/Unexplored.** Non-apprehension (*anupalabdhi*) is the perception of absence. If one denies that raw perception (Q1-B) yields knowledge, it is difficult to ground the knowledge of absence in direct apprehension. This combination suggests a skepticism about presence but a dogmatism about absence, a position no classical school defends.

  ### (b) Indistinguishable Pairs

  1.  **Kumārila Mīmāṃsā and Advaita Vedānta.**
      *   *Reason:* Both standardly accept all six *pramāṇas*.
      *   *Separation:* This difference is not reachable by case-based questioning regarding the *number* of sources. Separation requires a metaphysical question about the reality of the world (*mithyātva* vs. *satyatva*). For the purpose of this seminar, they are seated as allies on epistemic matters.
  2.  **Buddhist (Dignāga/Dharmakīrti) and Vaiśeṣika.**
      *   *Reason:* Both accept only Perception and Inference.
      *   *Separation Question:* "When you infer fire from smoke, are you knowing a universal connection or a particular causal power?" (Buddhists lean toward particulars/causal efficacy; Vaiśeṣikas toward universals/categories). However, this is subtle. It is preferable to seat them together as "Reductionists regarding Testimony" and let them debate the ontology later.
  3.  **Sāṃkhya and Yoga.**
      *   *Reason:* Epistemologically identical in this context (3 *pramāṇas*).
      *   *Separation:* The difference is soteriological and metaphysical (theism vs. atheism), not epistemic. They cannot be separated by this instrument.

  ### (c) Rule for Inconsistent Answers

  **Rule:** Assign to **Nearest Neighbor with Flag**.

  **Defense:** The goal of this instrument is pedagogical seating, not exclusion. A student who reduces Testimony to Inference (Q3-B) but refuses to reduce Non-apprehension to Inference (Q7-A) occupies a position no classical school holds (a hybrid Reductionist/Non-Reductionist). Excluding them leaves them without a dialectical partner. Instead, assign them to the school that matches their majority commitments (e.g., Nyāya if they accept Comparison, or Buddhist if they reject most extras) but flag the inconsistency. This allows the student to defend their unique intuition during the seminar, potentially reconstructing a "lost" or minority position, while still having a primary opponent to engage. The flag ensures the instructor knows the student's profile is non-standard and may require guidance to map onto the historical texts.
