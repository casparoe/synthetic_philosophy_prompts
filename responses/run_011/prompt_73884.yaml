  **SurplusShare™**
  *Fairness, Axiomatized.*
  **Developer:** OrthoLogic Solutions
  **Category:** Lifestyle / Finance
  **In-App Purchases:** Nash Pro ($9.99/mo), Kalai-Smorodinsky Ultra ($14.99/mo), Utilitarian Add-on ($4.99/mo)

  **Description:**
  Stop arguing about what's fair. Start calculating it. SurplusShare™ takes your disagreement point and feasible set, applies industry-standard bargaining solutions, and outputs a binding allocation. Free Tier uses Egalitarian division. Premium tiers unlock Scale Invariance and Pareto Efficiency guarantees. Don't let emotions distort the surplus.

  ***

  **★☆☆☆☆ MonotonicityMyAss**
  *By Contractormike*
  My ex-wife got a permit to develop our shared land. Her best-case payoff went up. Mine stayed exactly the same. I refreshed the app on the Nash Pro plan and my share of the liquid assets *dropped*. How does expanding the pie starve me? I paid for fairness, not magic tricks.

  > **Developer Response:**
  > Thank you for your feedback. The Nash Bargaining Solution maximizes the product of utilities gained above the disagreement point. It satisfies Independence of Irrelevant Alternatives, but it does not satisfy Individual Monotonicity. An expansion of the feasible set favorable to Player B can reduce Player A's absolute utility. This is working as intended. Please consider upgrading to Kalai-Smorodinsky Ultra for monotonicity guarantees.

  **★★★★★ IIA_Is_Life**
  *By RationalActor88*
  Love the Nash tier. I tested it by adding a bunch of absurd options to the table (threats to burn the curtains, fake job offers I'd never take). The allocation didn't budge. True Independence of Irrelevant Alternatives. Finally, an algorithm that ignores the noise.

  > **Reply by GameTheoristMom:**
  > Be careful. IIA means removing non-optimal options doesn't change the result. It doesn't mean the shape of the frontier doesn't matter. If your "fake job offer" changes her perception of your walkaway point, you've shifted the disagreement point, not the feasible set. The app won't catch that.

  **★★☆☆☆ UnitsMatter**
  *By HealingJourney*
  My therapist converted my distress to "happiness units" at a 1:10 ratio. His life coach used 1:2. On the Free plan, this swung the asset split by 40%. I bought Nash Pro and the split stayed the same. Why is scale invariance a paid feature?

  > **Developer Response:**
  > The Egalitarian solution (Free) equalizes absolute gains, which is sensitive to utility scaling. Nash and Kalai-Smorodinsky (Premium) are scale invariant. We recommend both parties agree on a numeraire before syncing accounts.

  **★☆☆☆☆ TheNumbersAreLies**
  *By DisagreementDave*
  We spent six months fighting about the walkaway point. Is the dog a cost or an asset? Does my pending job offer count if I hate the commute? Is the house worth the Zestimate or the fire-sale price? We tried mediators. We tried shouting. Finally, we just typed two numbers into the "Disagreement Utility" boxes so we could run the simulation.
  The app instantly calculated the surplus, applied the axioms, and gave us a perfect, elegant split. It was beautiful. It was garbage. The math downstream was flawless, but it was dividing a surplus built on arbitrary inputs we picked just to make the loading bar finish. The app treats the disagreement point like it's data, not the entire fight.

  > **Developer Response:**
  > We appreciate the detailed review. SurplusShare™ treats all input fields as cardinal utilities. Please ensure both parties authenticate the disagreement point via 2FA before finalizing the split.

  **★ 4.2**
