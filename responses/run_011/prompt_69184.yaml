      *(Self-Correction on Case 1)*: If meaning is dispositional, does it exist? A poison is poisonous even if no one drinks it. Is a message meaningful even if no one reads it? Hofstadter would say the *potential* for isomorphism exists in the structure, but the *actualization* requires a decoder. I will argue for actualization.

