      *   *Case 2 nuance:* If the decoder produces an isomorphism, isn't that meaning? Hofstadter might say yes, *relative to that decoder*. But the prompt asks if it retrieved *the* inner message. If the mapping is wrong relative to the sender's code, it's a new message.
      *   *Decoder Parity:* I need to be careful. If a human and a machine produce the same output, do they have the same meaning? Hofstadter would likely say yes, functionally. But if the machine doesn't "understand" (Searle's Chinese Room), does it matter? GEB argues against the Chinese Room intuition. So I should support Decoder Parity but with the caveat that the isomorphism must be robust.
      *   *No-Residue:* This is the stronger principle. I should anchor the essay here. Meaning is not a substance.
