answer: |-
  The core puzzle is distinguishing biological continuity from numerical identity. The ledger acts as a sacramental space where counterfactuals become real; it's where the narrator validates the "ghosts" the insurance report must deny. The lot number reveal needs to be bureaucratic banality—a personnel file cross-reference showing her mother's patient ID and cycle count. It shouldn't feel like a twist, but a quiet sedimentation of fact. The ending must resist resolution. I'll have her hovering over the keyboard, the ledger open beside the monitor. The gesture will be closing the ledger but leaving the report unsent, or vice versa. The point is the tension between the lived truth of the ledger and the legal truth of the report. The father's argument needs to ground essence in love, not biology. The colleague's objection must rely on material flux. The final image should be the cursor blinking, representing the unanswerable question.

  ***

  I work for the insurer, which means I work for the silence after the noise. When a cycle fails, or a freezer loses power, or a vial is dropped, the clinic sends a report. I send a recommendation. My job is to quantify harm. Usually, harm is straightforward: a damaged uterus, a wasted fee, a month of hope turned to chemical waste. But the Harper case was different. The clinic had cancelled a transfer due to a staffing shortage. They rescheduled for the next month. The egg was the same. The mother was the same. The sperm was different.

  The child, Maya, was born healthy. The Harpers loved her. They brought her photos to the deposition. She had her mother's eyes and a laugh that sounded like wind chimes. But the claim wasn't for medical negligence regarding Maya. It was for the loss of the child who was supposed to be conceived in November. They wanted damages for the death of a possibility.

  I keep a ledger. It's a black composition book, the kind you buy in August for school. I keep it in my bottom drawer, under the stapler. When I close a file where gametes are discarded, I write the lot number in the ledger. Then I give them a name and a detail. Lot 8942: Thomas, would have loved the ocean. Lot 9001: Sarah, born in a storm. It is a superstition, or perhaps a correction. The insurance report requires me to treat unused embryos as biological material, property with a replacement cost. The ledger treats them as people who never took a breath. I write them into existence so I don't have to pretend they were never there.

  I sat across from Mr. Harper in a conference room that smelled of lemon polish and old carpet. He was a large man who seemed to be trying to occupy less space. He didn't cry. He pushed a photo of Maya across the table, then tapped the empty space beside it.

  "People tell us we're crazy," he said. "They say, 'You have a healthy baby. What more do you want?' They think we're grieving a shape. A nose, a height, a temperament."

  He looked at his hands. "When my wife was pregnant with Maya—the real Maya, the one we lost in November—I used to talk to her. Through the door. I knew her. Not because I knew what she'd look like, but because I knew where she started. She started from *us*, in that specific way, at that specific time. When the clinic moved the date, they didn't just change the schedule. They changed the seed. The child we have is wonderful. But she isn't the one I talked to. You can't swap the foundation of a house and say it's the same house just because the roof looks similar."

  He wasn't talking about genetics. He was talking about origin. He was saying that who you are is tied inextricably to the moment you began, and if you move that moment, you move the person.

  Later, I ran the numbers by David. David works in actuarial science. He deals in probabilities, not essences. He eats lunch at his desk while reading case law on his tablet.

  "It's a sorites problem," David said, poking at his salad. "If you swap one molecule in the egg, is it still the same egg? Yes. Swap another? Yes. So where is the line? Why is the moment of conception magic? You're made of different cells than you were born with. You're a process, not a stone. If the parents love the child they got, the harm is purely semantic. They lost a concept, not a person."

  "That's the deflationary view," I said. "That 'the child we lost' is just a figure of speech. Like saying 'I could have been a painter.'"

  "Exactly," David said. "It's a way of describing regret. It's not a metaphysical claim. If you pay them for the loss of a child, you're validating the idea that there are ghost children walking around waiting to be born. Legally, that's a nightmare. Practically, it's nonsense. Maya exists. The other one doesn't. You can't sue for the non-existent."

  David wasn't cruel. He was kind. He wanted the Harpers to move on. He believed that insisting on the reality of the lost child was a way of denying the reality of the living one. He thought origin essentialism was a trap. I watched him wipe dressing from his chin and wondered if he knew what he was asking me to do. He was asking me to write a report that said the ghost in the ledger wasn't real.

  I went back to the archives. The clinic had merged with a larger network ten years prior, and I was cross-referencing legacy patient IDs to ensure the Harper file was coded correctly for the new system. I was digging through scanned personnel records from the early nineties, looking for coding keys.

  I found a file labeled *Patient 88402*. It was a standard intake form. Date of birth, insurance provider, medical history. I glanced at the name out of habit. It was my mother's maiden name.

  I stopped. The air in the office felt suddenly thin. I zoomed in on the scan. The document was grainy, black and white dots forming letters. *Cycle Number: 2*. *Previous Cycle: Cancelled*. *Reason: Staffing Shortage*.

  There was a lot number handwritten in the margin. *Lot 104*.

  I sat very still. I was born nine months after that date. I had always known I was conceived via intervention; my parents were open about it. But I hadn't known about the first cycle. I hadn't known there was a Lot 104. I hadn't known that I was the reschedule.

  I looked at my hands. They were the same hands I had used to write the ledger entries for Thomas and Sarah. According to Mr. Harper, according to the logic I was supposed to be investigating, I was not the child my parents waited for in Cycle 1. I was the substitute. The one who came from the different sperm, the different month. If the Harpers were right, I was a different person than the one who was supposed to be born. If David was right, I was just me, and the lot number was ink on paper.

  I opened the bottom drawer. The black ledger lay there. I took it out. The pages were filled with names I had invented for biological material. I turned to a fresh page. I held the pen over the paper. I could write *Lot 104*. I could give that lost child a name. I could give them a detail. *Would have had my mother's nose. Would have been born in winter.*

  But if I wrote it, I was admitting that I was not them. I was admitting that my existence was contingent on a clerical error, a staffing shortage, a delay. I was admitting that the person I am is tied to a specific vial that was almost discarded.

  I looked at the computer screen. The claim report for the Harpers was open. The field *Liability Determination* blinked. *Yes* or *No*.

  If I checked *Yes*, I validated Mr. Harper. I validated the pain of losing a specific soul. I validated the ledger. But I also validated the idea that Maya, the living girl, was a replacement. I made her second best.

  If I checked *No*, I validated David. I protected Maya's status as the only child. I protected the clinic from a precedent that would open them to infinite claims from infinite ghosts. But I would be lying to Mr. Harper. I would be telling him his grief was semantics.

  I looked at the lot number on the screen. Then I looked at the lot number in the archived file. They were from the same system. The same logic applied to me as it did to the Harpers' lost child. I was the proof of the delay. I was the living evidence that a different gamete makes a different person. Or I was proof that it doesn't matter at all.

  I put the pen down. I didn't write in the ledger. I didn't click the mouse. I just sat there, with the black book open on one side and the glowing screen on the other, listening to the hum of the server rack in the hallway, waiting for the sound of someone else coming down the corridor to tell me what to do.
