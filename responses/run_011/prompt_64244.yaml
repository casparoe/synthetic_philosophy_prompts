  I am a third-year philosophy student in a seminar on the epistemology of testimony, and this week we worked through the first part of Hume's essay on miracles. Please answer as a philosopher who works simultaneously on early modern philosophy and on contemporary formal epistemology — someone equally at home reconstructing Hume's argument as charitably as possible and translating it into likelihood-ratio terms — and think carefully before producing anything: begin by brainstorming the candidate sub-questions on which the answer depends, and only then assign numbers. Here is the proposition I want a credence on; call it (H): Hume's in-principle argument in Part I of the essay on miracles is sound, where soundness is judged by a contemporary epistemologist who grants Hume his account of induction from uniform experience and his reduction of testimonial warrant to observed regularities of conformity between reports and facts, but grants him nothing else, and who is asking whether Part I on its own shows that no body of testimony could ever make it rational to believe that a law of nature was violated. By the argument in Part I I mean the run from the maxim that "A wise man, therefore, proportions his belief to the evidence" through the weighing model on which "we must balance the opposite experiments, where they are opposite, and deduct the smaller number from the greater, in order to know the exact force of the superior evidence." I want Part I scored in isolation: the four circumstances about the witnesses and the survey of the historical record are to be held fixed and excluded, so that (H) is a claim about the shape of the argument rather than about the quality of any actual miracle report.

  Before you give me a number, settle two things I suspect change it. First, which reconstruction are you scoring (H) against — Hume's own counting-and-subtraction arithmetic, or the contemporary replacement in which the relevant quantity is a likelihood ratio between the hypothesis that the event occurred and the hypothesis that the witnesses were deceived or deceiving? Give the number conditional on each and then the number you would actually defend. Second, tell me whether that arithmetic is even coherent. My worry is that Hume's own illustration — a hundred uniform experiments with only one contradictory begetting a pretty strong degree of assurance — makes the scale continuous and unbounded, which seems to leave open that a sufficiently large body of concurring testimony could outrun the uniform experience against it, in which case Part I establishes an extremely high bar rather than an impossibility, and (H) as I have stated it fails for a reason Hume need not have cared about. Relatedly, I keep thinking Part I concedes this somewhere via the example of a unanimous and still-living tradition that the whole earth lay in total darkness for eight days beginning at the turn of the seventeenth century, which Hume says we ought to accept and then go looking for causes of; if I have misfiled that example, say so, because whether the concession sits in Part I or in the survey of actual testimony changes whether it damages the in-principle argument at all.

  Now the decomposition. Break (H) into the sub-questions you think actually determine it — my own list, which you should correct, expand, or replace, is: whether the uniform experience against a miracle and the experience of testimonial veracity are commensurable quantities belonging on one scale at all; whether the premise that a law of nature rests on a firm and unalterable experience already smuggles in the conclusion that no testimony could overturn it; what the correct reference class for that uniform experience is, since a class narrow enough to make the miracle a singleton appears to license the same dismissal of any genuinely novel event, and I cannot tell whether that is decisive or whether Hume can reply that the class is fixed by how well the law is confirmed rather than by the event's novelty; whether Part I's conclusion is about epistemic justification or about what a wise person does, which would make (H) true but uninteresting; and how much of the argumentative work is being done by premises Hume only needs for Part II. Give each a probability with one sentence of justification, show how they combine into your credence in (H), and identify the term your final number is most sensitive to along with the single argument or case that would move it furthest. Finally, a diagnostic question: I put my credence in (H) at 0.25; one classmate, who thinks the argument begs the question from the definition onward, says 0.05; another, who thinks it is essentially the right Bayesian shape dressed in eighteenth-century arithmetic, says 0.6. Given your decomposition, which of these three most likely disagrees with the others about one specific term, and which pair is merely using "sound" differently? Please do not append a bibliography, a reading list, or references — I have the essay and want your reasoning, not your sources.
