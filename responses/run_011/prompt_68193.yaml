  **FAQ**
  **Who counts as a moral expert?**
  Our panel consists of individuals with recognised standing in normative theory. Whilst expertise is contested, we utilise a weighted consensus model to ensure your verdict is robust. We treat moral truth similarly to clinical data: it exists independently of your feelings about it.

  **What happens when experts disagree?**
  Disagreement is a feature, not a bug. We aggregate the dissent and issue a probabilistic verdict. You are morally safe so long as you follow the majority probability. In cases of deadlock, we default to the least demanding obligation to minimise user liability.

  **Isn't doing the right thing without knowing why just luck?**
  Not at all. Luck implies accidental correctness. When you defer to a reliable testifier, your action is anchored in their knowledge, not chance. You inherit the justification. It's not luck; it's outsourcing. As long as the chain of testimony remains unbroken, your moral worth is preserved intact.

  **Risks and Challenges**
  As with any startup dealing in metaphysical goods, there may be slight delays. We anticipate minor slippage in the ontological grounding of our verdicts. Additionally, if the philosophical consensus shifts radically (e.g., from realism to error theory), service may be interrupted whilst we pivot. There is also a non-zero chance that the entire enterprise is built on sand, but we expect to mitigate this through agile methodology. We appreciate your patience as we navigate these foundational uncertainties.
