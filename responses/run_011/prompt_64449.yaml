  # Instructor Notes & Answer Key (For Your Eyes Only)

  Before you print the student handout, here are the answers to the specific technical questions you raised, along with the scoring key logic.

  **1. The TA's Claim (Linear Frontiers):**
  The TA is **correct** for two-person bargaining problems with comprehensive feasible sets. If the Pareto frontier is a straight line segment, the Nash Bargaining Solution (NBS) and the Kalai-Smorodinsky (KS) solution **always coincide**, regardless of the disagreement point $d$.
  *   *Why:* On a linear frontier, the point that maximizes the product of gains from disagreement (Nash) is the same as the point proportional to the ideal gains (KS).
  *   *Handout Action:* I have included a "Stop Sign" box in the handout to save your group time. If they propose a linear example to distinguish Nash vs. KS, they are wasting their time.

  **2. KS vs. Raiffa:**
  Your student is **mostly right, but technically imprecise**.
  *   *Raiffa (1953)* proposed a specific *procedure* (a sequence of concessions).
  *   *Kalai-Smorodinsky (1975)* proposed an *axiomatic characterization*.
  *   *In 2-person games:* The limit of Raiffa's procedure yields the KS solution. So in your seminar, treating them as the same point is fine.
  *   *In n-person games:* They diverge. Since your handout is 2-person, you can treat "Raiffa" as a nickname for KS, but note that KS is the axiomatic standard.

  **3. The Parabola Arithmetic:**
  Your numbers are correct.
  *   **Feasible Set:** $u_2 \le 1 - u_1^2$, $d=(0,0)$.
  *   **Ideal Point:** $a = (1,1)$.
  *   **KS:** Intersection of $u_2=u_1$ and $u_2=1-u_1^2$. $u_1 = (\sqrt{5}-1)/2 \approx \mathbf{0.618}$. Point: $\mathbf{(0.62, 0.62)}$.
  *   **Nash:** Max $u_1(1-u_1^2)$. FOC: $1-3u_1^2=0 \Rightarrow u_1 = 1/\sqrt{3} \approx \mathbf{0.577}$. $u_2 = 2/3 \approx \mathbf{0.667}$. Point: $\mathbf{(0.58, 0.67)}$.
  *   *Note:* Nash favors Player 2 here because the frontier curvature gives Player 2 more "marginal bang for the buck" in the product function, whereas KS enforces proportional gains relative to the ideal.

  **4. Tree Structure:**
  The tree begins with the **Disagreement Point**. If students believe $d$ is endogenous (derived from threat strategies in a non-cooperative game), they are effectively committed to the **Nash Bargaining Solution with Variable Threats**. Most axiomatic debates (KS vs. Nash) assume $d$ is fixed exogenously (status quo). I have made this the root split.

  ***

  # HANDOUT: Which Bargaining Solution Do You Actually Believe In?

  **Instructions:**
  1.  Do not use axiom names (e.g., "IIA," "Scale Invariance"). Talk about the *cases*.
  2.  For each question, sketch the feasible set $S$ and disagreement point $d$.
  3.  Choose the outcome you prefer. If you choose "Other," you must specify the coordinates.
  4.  Follow the arrows to find your theoretical commitment.

  ---

  ## ROOT: Where does the Disagreement Point ($d$) come from?

  **A. $d$ is fixed exogenously (Status Quo).**
  *   *Meaning:* We take the "no agreement" point as given (e.g., current law, breakdown of talks). We are looking for a fair division of the surplus.
  *   $\rightarrow$ **Go to Question 1.**

  **B. $d$ is endogenous (Threat Point).**
  *   *Meaning:* $d$ is the result of players playing a non-cooperative game (e.g., strikes, price wars) *before* bargaining. Players choose threats to optimize their final bargain.
  *   $\rightarrow$ **Go to Question 6 (The Foundation Check).**

  ---

  ## QUESTION 1: The Parabola (Scale & Symmetry)
  **Problem:** $S = \{ (u_1, u_2) : u_2 \le 1 - u_1^2, u_1, u_2 \ge 0 \}$, $d = (0,0)$.
  *   *Sketch:* A curve dropping from $(0,1)$ to $(1,0)$.
  *   *Candidate Points:*
      *   **Point X:** $(0.62, 0.62)$ [Equal gains relative to max possible]
      *   **Point Y:** $(0.58, 0.67)$ [Maximizes area of rectangle from $d$]

  **Choice:**
  *   **I pick X.** Player 2 shouldn't get more just because the curve bends that way. Both can reach 1.0 alone; they should split the cooperative gain equally. $\rightarrow$ **Go to Question 2.**
  *   **I pick Y.** The curvature makes Player 2's utility "cheaper" to generate in the middle. Efficiency matters more than proportional gains. $\rightarrow$ **Go to Question 3.**

  ---

  ## QUESTION 2: The Monotonicity Trap (Expansion)
  **Problem Pair:**
  *   **Scenario A:** $S_A$ is the triangle with vertices $(0,0), (1,0), (0,1)$. Solution was $(0.5, 0.5)$.
  *   **Scenario B:** $S_B$ expands $S_A$. Player 2's max payoff increases to $1.5$. Player 1's max stays $1.0$. The new frontier connects $(1,0)$ to $(0, 1.5)$.
      *   *Note:* Under your previous logic (Question 1, Point X), you favor proportional gains.
  *   *Candidate Points for Scenario B:*
      *   **Point P1:** $(0.50, 0.75)$ [Player 1 stays same, Player 2 gains all surplus]
      *   **Point P2:** $(0.55, 0.70)$ [Player 1 gains slightly, Player 2 gains mostly]

  **Choice:**
  *   **I pick P1.** Player 1's bargaining position didn't improve. Why should they gain? Player 2 did all the work expanding the set. $\rightarrow$ **Go to Question 4.**
  *   **I pick P2.** If the pie grows, everyone should eat more. It is unfair for Player 1 to be left behind when the total opportunity set grows. $\rightarrow$ **Go to Question 5.**

  ---

  ## QUESTION 3: Independence of Irrelevant Alternatives (Contraction)
  **Problem:** Start with the Parabola from Question 1 (Solution Y: $0.58, 0.67$).
  *   **Scenario:** We remove all options where $u_2 > 0.67$. The old solution is still available.
  *   *Candidate Points:*
      *   **Point Z1:** Keep $(0.58, 0.67)$. The best deal is still on the table.
      *   **Point Z2:** Move to $(0.65, 0.65)$. Since Player 2's "dream" is now capped, Player 1 should gain.

  **Choice:**
  *   **I pick Z1.** If the chosen point is still feasible, removing worse options shouldn't change the deal. $\rightarrow$ **Leaf: Nash Bargaining Solution.**
  *   **I pick Z2.** Player 2's leverage dropped. The solution should reflect the new ideal point, even if the old point is feasible. $\rightarrow$ **Leaf: Kalai-Smorodinsky.**

  ---

  ## QUESTION 4: The Flat Stretch (Egalitarianism)
  **Problem:** $S$ has a flat Pareto frontier: $u_2 = 1$ for $u_1 \in [0.4, 0.6]$. $d=(0,0)$.
  *   *Note:* The line $u_1 = u_2$ intersects this flat stretch at $(1,1)$, which is *not* feasible. The feasible points maximizing the minimum payoff are the entire segment from $(0.4, 1)$ to $(0.6, 1)$? No, max-min is where $u_1$ is highest possible while $u_2 \ge u_1$.
  *   *Correction for Case:* Let's say the frontier is $u_1 + u_2 = 1.2$ for $u_1, u_2 \ge 0.5$.
  *   *Candidate Points:*
      *   **Point E1:** Any point on the segment where $\min(u_1, u_2)$ is maximized. (e.g., $(0.5, 0.7)$ is just as good as $(0.6, 0.6)$).
      *   **Point E2:** Specifically $(0.6, 0.6)$. Maximize the minimum, *then* maximize the other.

  **Choice:**
  *   **I pick E1.** As long as the worst-off person is as well-off as possible, I don't care about the rest. $\rightarrow$ **Leaf: Plain Egalitarian.**
  *   **I pick E2.** We should eliminate waste. Once the minimum is maxed, maximize the remainder. $\rightarrow$ **Leaf: Lexicographic Egalitarian.**

  ---

  ## QUESTION 5: The Linear Coincidence (Diagnostic Check)
  **Problem:** $S$ is the triangle $(0,0), (1,0), (0,1)$. $d=(0,0)$.
  *   *Candidate Points:*
      *   **Point L:** $(0.5, 0.5)$.

  **Choice:**
  *   **I pick L.** (Everyone picks this).
  *   *Note:* **STOP.** This question distinguishes nothing. On linear frontiers, Nash, KS, Egalitarian, and Utilitarian all pick $(0.5, 0.5)$. Do not use linear examples to argue for Nash over KS. $\rightarrow$ **Return to Question 1.**

  ---

  ## QUESTION 6: The Foundation Check (Non-Cooperative)
  *(Only for those who chose Root B)*
  **Problem:** You believe the solution must be the limit of a strategic game (e.g., alternating offers).
  *   *Candidate Positions:*
      *   **Pos N:** The Nash Bargaining Solution is the unique subgame perfect equilibrium of the Rubinstein demand game (as friction vanishes).
      *   **Pos O:** Axioms are decoration. Only the equilibrium of the specific institutional rules matters.

  **Choice:**
  *   **I pick Pos N.** I want the axiomatic convenience of Nash, but grounded in strategy. $\rightarrow$ **Leaf: Strategic Nash.**
  *   **I pick Pos O.** I don't believe in "The Solution." I only analyze specific mechanisms. $\rightarrow$ **Leaf: Mechanism Designer (No General Solution).**

