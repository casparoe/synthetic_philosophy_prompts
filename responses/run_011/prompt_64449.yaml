  So I'm in a seminar on bargaining and cooperative game theory this term and I've been the one running the study group, and for our review session I want to make a handout that's basically "which bargaining solution do you actually believe in?" — a decision tree, not a list of definitions. My problem is that everyone in the group says "oh I'm a Nash person" or "KS is obviously right" without having the faintest idea what they'd do on a case, so I want the questions to be cases.

  Concretely: six to eight questions, each one a specific two-person bargaining problem (give the feasible set and the disagreement point explicitly, in numbers or a simple equation, so we can sketch it on the back of the page) with two or three candidate points to pick between. Nobody should be able to answer by recognising an axiom name, so phrase every branch as "which point do you take, and what's wrong with the other one" and put the axiom the branch is really testing in a label off to the side afterwards. Then the tree itself: every internal node labeled with the claim that splits it (things like "should the answer change if we rescale one player's utility?" or "if player 1's best achievable payoff goes up and nothing else changes, can player 1 end up worse off?"), and every leaf with the name of the position — Nash, Kalai-Smorodinsky, egalitarian, utilitarian, weighted/asymmetric Nash, anything else you think belongs — plus one sentence on the most awkward thing that leaf is committed to. If some combination of answers leads somewhere nobody actually defends, call the leaf "unnamed" and say whether the cell is empty because it's incoherent, because it's ugly, or just because nobody's bothered.

  Please build these in somewhere:

  - Feasible set = everything under u2 = 1 − u1² in the positive quadrant, d = (0,0). I get roughly (.62, .62) for KS and (.58, .67) for Nash — check my arithmetic, because if I have those backwards the whole handout is a trap. I want this one in because it's about the smallest case where the two actually come apart.
  - A pair of problems where the second is the first plus some new options that only raise player 2's best possible payoff, so I can ask "did player 1 just get punished for player 2 getting lucky?" I want monotonicity as a case, not a slogan.
  - Something with a kink or a flat stretch on the frontier, since I'm pretty sure plain maximin-egalitarian and the lexicographic version behave differently there.
  - At least one where two leaves land on the same point, so the group can see that a question which feels diagnostic isn't.

  Related: my TA said that on a straight-line frontier Nash and KS always pick the same point, so any diagnostic case with a linear frontier is wasted. Is that right in general, or only when d is the origin? If it's general, say so in the handout, because half my group keeps proposing linear examples.

  Two more things. First, where does the tree even start — I keep forgetting that we're just handed d rather than deriving it. If you think the first real branch should be about how the disagreement point gets fixed (status quo versus some threat point read off the underlying noncooperative game), put that branch in, but mark clearly which downstream questions stop making sense if you take it. Second, a couple of people in the group think the only thing that makes a solution respectable is that it falls out of the equilibrium of a demand game and that the axioms are decoration. If any leaf of your tree can really only be reached that way, flag it rather than hiding it.

  Oh, and one guy keeps calling KS "the Raiffa solution" and I've just been nodding along, figuring its the same thing. Is it, or is he mixing up two different proposals? If you're not sure, just say you're not sure.

  Finally I want a scoring key at the end: answer pattern → position, including the patterns that don't add up to anything coherent, so the people who come out inconsistent can see which of their answers they should give up.
