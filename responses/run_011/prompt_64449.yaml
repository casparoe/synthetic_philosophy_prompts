  ## THE LEAVES: What You Committed To

  ### 1. Nash Bargaining Solution
  *   **Path:** Root A $\rightarrow$ Q1(Y) $\rightarrow$ Q3(Z1).
  *   **The Vibe:** "Efficiency and Stability."
  *   **Awkward Commitment:** You accept that Player 1 can get **punished** if Player 2's outside options improve (Violates Individual Monotonicity). You also believe utility units are comparable only up to ratio scales.

  ### 2. Kalai-Smorodinsky (aka Raiffa)
  *   **Path:** Root A $\rightarrow$ Q1(X) $\rightarrow$ Q2(P2) OR Q1(Y) $\rightarrow$ Q3(Z2).
  *   **The Vibe:** "Proportional Gains."
  *   **Awkward Commitment:** You sacrifice **Independence of Irrelevant Alternatives**. Removing a "dream option" that nobody was going to pick anyway can change the actual agreement.

  ### 3. Plain Egalitarian
  *   **Path:** Root A $\rightarrow$ Q1(X) $\rightarrow$ Q2(P1) $\rightarrow$ Q4(E1).
  *   **The Vibe:** "Maximin Justice."
  *   **Awkward Commitment:** You are indifferent between $(0.5, 1.0)$ and $(0.5, 0.5)$ if the max-min is 0.5. You tolerate **Pareto inefficiency** to maintain equality of the minimum.

  ### 4. Lexicographic Egalitarian
  *   **Path:** Root A $\rightarrow$ Q1(X) $\rightarrow$ Q2(P1) $\rightarrow$ Q4(E2).
  *   **The Vibe:** "Equality first, then Efficiency."
  *   **Awkward Commitment:** You prioritize the second-smallest payoff over the total sum. You might reject a deal that gives everyone +10 utility because it makes the distribution slightly less equal.

  ### 5. Strategic Nash
  *   **Path:** Root B $\rightarrow$ Q6(Pos N).
  *   **The Vibe:** "Axioms derived from Guns."
  *   **Awkward Commitment:** Your solution depends on the **patience parameters** ($\delta$) of the players. If you can't model the threat game, you have no solution.

  ### 6. Mechanism Designer
  *   **Path:** Root B $\rightarrow$ Q6(Pos O).
  *   **The Vibe:** "There is no spoon."
  *   **Awkward Commitment:** You cannot answer the seminar questions. You must ask "What are the rules of the seminar?" before proposing a point.

  ### 7. UNNAMED (The "Greedy" Leaf)
  *   **Path:** Root A $\rightarrow$ Q1(Y) $\rightarrow$ Q2(P1).
  *   **Status:** **Incoherent.**
  *   **Why:** You want the Nash point (curvature sensitive) but demand Player 1 never loses from expansion (Monotonicity). Nash violates Monotonicity. KS satisfies Monotonicity but picks Q1(X). You want the math of Nash with the ethics of KS. It doesn't exist.

  ### 8. UNNAMED (The "Utilitarian" Leaf)
  *   **Path:** (Implied by maximizing sum $u_1+u_2$).
  *   **Status:** **Respectable but distinct.**
  *   **Why:** We didn't test this explicitly, but if you picked the point with the highest sum in Q1, you are a Utilitarian.
  *   **Awkward Commitment:** You are willing to give Player 1 **zero** utility if Player 2 gains enough to offset it.

