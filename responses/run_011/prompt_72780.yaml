  # DIAGNOSTIC TREE: MODAL ONTOLOGY

  **Entry Commitment:** You accept that some modal claims are literally true and not reducible to actual powers (e.g., *It is true that things might have existed which do not actually exist*).

  **Instructions:** Answer each node based on your immediate philosophical reaction. Do not worry about which position the answer implies.

  ***

  ### THE TREE

  **1. Is the truth of modal claims grounded in the existence of "worlds," or is "possibility" itself a fundamental feature of reality that needs no further ground?**
  *   *Test:* "Something might have had a property that no actual thing has and that no actual thing could have acquired." Does this require a *place* or *object* where this happens, or is it just a basic fact?
      *   **Basic Fact:** Go to **Leaf 1**.
      *   **Requires Worlds:** Go to **Node 2**.

  **2. Are these worlds concrete, spatiotemporal entities isolated from us, or are they abstract objects (like numbers or sets)?**
  *   *Test:* "There might have been two universes bearing no spatiotemporal or causal relations to each other, which together would not constitute a single world." Is this a description of distant physical places or a description of representations?
      *   **Concrete Places:** Go to **Node 3**.
      *   **Abstract Objects:** Go to **Node 5**.

  **3. (Concrete) When you say "I am actual," do you mean you inhabit the one real world, or merely that you are located in the same world as your utterance?**
  *   *Test:* "Humphrey might have won the election." If Humphrey lost here, did *he* win somewhere, or is "actual" just a label for *our* neighborhood?
      *   **"Actual" is Indexical (Our Neighborhood):** Go to **Node 4**.
      *   **"Actual" is Absolute (The One Real World):** Go to **Leaf 4**.

  **4. (Concrete/Indexical) Is the Humphrey who won the election the very same person as the Humphrey who lost here, or merely a counterpart?**
  *   *Test:* "Humphrey might have won the election." Is that true of *himself*, or of something suitably like him?
      *   **Suitably Like Him (Counterpart):** Go to **Leaf 2**.
      *   **Himself (Transworld Identity):** Go to **Leaf 3**.

  **5. (Abstract) If worlds are abstract, what are they made of?**
  *   *Test:* "Sherlock Holmes might have existed." To make this true, do we need a maximal description, a potential state of affairs involving his essence, or merely a recombination of actual building blocks?
      *   **Maximal Descriptions (Sets of Truths):** Go to **Node 6**.
      *   **Maximal States of Affairs (Ways Things Could Be):** Go to **Node 6**.
      *   **Recombinations of Actual Elements:** Go to **Node 6**.
      *(Note: This node separates the three abstract varieties. You may answer this even if you haven't picked a side yet; choose the ontology that feels most robust.)*

  **6. (Abstract) Is "actual" an absolute property of one world, or indexical to the speaker?**
  *   *Test:* "Humphrey might have won." Is the world where he wins less real than this one, or just not *this* one?
      *   **Absolute (One Real World):** Go to **Node 7**.
      *   **Indexical (All Equally Real):** Go to **Node 7**.

  **7. (Abstract) Must a world be internally consistent?**
  *   *Test:* Can there be a "world" where a square is round, provided it is maximally detailed?
      *   **Yes (Consistency Required):** Go to **Node 8**.
      *   **No (Impossible Worlds Allowed):** Go to **Leaf 11**.

  **8. (Abstract/Consistent) Can two worlds differ purely by swapping individuals, with no qualitative change?**
  *   *Test:* "Two worlds might have differed only in which individual plays which role, everything else being qualitatively identical."
      *   **Yes (Haecceitism):** Go to **Leaf 12**.
      *   **No (Qualitative Supervenience):** Go to **Node 9**.

  **9. (Abstract/Consistent/Anti-Haecceitist) Are there things that exist in every world?**
  *   *Test:* "There might be things that could not have failed to exist, so that what varies across worlds is only what is exemplified."
      *   **Yes (Necessary Existents):** Go to **Leaf 10**.
      *   **No (Contingent Existents):** Go to **Leaves 5–9** (Determined by Node 5 & 6 answers).

  ***

  ### THE LEAVES

  **Leaf 1: Modal Primitivism**
  *   **View:** No Worlds.
  *   **Definition:** Worlds are useful fictions; modality is a primitive feature of propositions.
  *   **Bullet:** You must accept that "possible" is unanalyzable and cannot be explained in terms of existence.

  **Leaf 2: Lewisian Realism**
  *   **View:** Concrete Realism (Counterpart Theory).
  *   **Definition:** A world is a concrete, spatiotemporally isolated universe.
  *   **Bullet:** You must deny that you could have existed in another world; only counterparts of you exist there.

  **Leaf 3: Concrete Transworld Realism**
  *   **View:** Concrete Realism (Transworld Identity).
  *   **Definition:** A world is a concrete universe that shares individuals with other universes.
  *   **Bullet:** You must accept that one concrete object can be located in multiple disconnected spatiotemporal systems simultaneously.

  **Leaf 4: Absolute Concrete Realism**
  *   **View:** Actualist Concrete Realism.
  *   **Definition:** A world is a concrete universe, but only one is genuinely real.
  *   **Bullet:** You must explain how non-actual concrete universes have any ontological status at all without being real.

  **Leaf 5: Propositional Abstractism (Absolute)**
  *   **View:** Stalnakerian Realism.
  *   **Definition:** A world is a maximal consistent set of propositions.
  *   **Bullet:** You must accept that propositions exist independently of minds and language to ground reality.

  **Leaf 6: Propositional Abstractism (Indexical)**
  *   **View:** Stalnakerian Possibilism.
  *   **Definition:** A world is a maximal consistent set of propositions, all equally existing.
  *   **Bullet:** You must accept that false propositions about our world are true in other equally real abstract objects.

  **Leaf 7: State-of-Affairs Abstractism (Absolute)**
  *   **View:** Plantingan Actualism.
  *   **Definition:** A world is a maximal possible state of affairs, one of which obtains.
  *   **Bullet:** You must accept that unexemplified essences exist to populate non-actual worlds.

  **Leaf 8: State-of-Affairs Abstractism (Indexical)**
  *   **View:** Plantingan Possibilism.
  *   **Definition:** A world is a maximal possible state of affairs, all equally existing.
  *   **Bullet:** You must accept that "obtaining" is an indexical property, not an absolute one.

  **Leaf 9: Combinatorial Abstractism (Absolute)**
  *   **View:** Humean Actualism.
  *   **Definition:** A world is a recombination of actual simple elements.
  *   **Bullet:** You must deny that there are possibilities involving elements that do not actually exist.

  **Leaf 10: Combinatorial Abstractism (Indexical/Necessary)**
  *   **View:** Humean Possibilism with Necessary Beings.
  *   **Definition:** A world is a recombination of elements, some of which exist in all combinations.
  *   **Bullet:** You must identify which actual elements are necessary and explain why they cannot be recombined away.

  **Leaf 11: Impossible Worlds Realism**
  *   **View:** Non-Consistent Abstractism.
  *   **Definition:** A world is a maximal representation, consistent or not.
  *   **Bullet:** You must accept that logical contradictions can be true in some sense.

  **Leaf 12: Haecceitist Abstractism**
  *   **View:** Haecceitism.
  *   **Definition:** A world is a maximal state of affairs including primitive this-ness.
  *   **Bullet:** You must accept that reality can differ without any qualitative difference.

  ***

  ### POST-TREE ANALYSIS

  **1. Path Key**
  *   **Leaf 1:** 1(Basic).
  *   **Leaf 2:** 1(Worlds) → 2(Concrete) → 3(Indexical) → 4(Counterpart).
  *   **Leaf 3:** 1(Worlds) → 2(Concrete) → 3(Indexical) → 4(Transworld).
  *   **Leaf 4:** 1(Worlds) → 2(Concrete) → 3(Absolute).
  *   **Leaf 5:** 1(Worlds) → 2(Abstract) → 5(Prop) → 6(Absolute) → 7(Yes) → 8(No) → 9(No).
  *   **Leaf 6:** 1(Worlds) → 2(Abstract) → 5(Prop) → 6(Indexical) → 7(Yes) → 8(No) → 9(No).
  *   **Leaf 7:** 1(Worlds) → 2(Abstract) → 5(State) → 6(Absolute) → 7(Yes) → 8(No) → 9(No).
  *   **Leaf 8:** 1(Worlds) → 2(Abstract) → 5(State) → 6(Indexical) → 7(Yes) → 8(No) → 9(No).
  *   **Leaf 9:** 1(Worlds) → 2(Abstract) → 5(Comb) → 6(Absolute) → 7(Yes) → 8(No) → 9(No).
  *   **Leaf 10:** 1(Worlds) → 2(Abstract) → 5(Comb) → 6(Indexical) → 7(Yes) → 8(No) → 9(Yes).
  *   **Leaf 11:** 1(Worlds) → 2(Abstract) → [Any] → [Any] → 7(No).
  *   **Leaf 12:** 1(Worlds) → 2(Abstract) → [Any] → [Any] → 7(Yes) → 8(Yes).

  **2. Unoccupied Combinations**
  *   **Concrete + Absolute + Transworld Identity:** *Diagnosis:* Incoherent. If worlds are concrete and isolated, an object cannot be in two of them. If one is "Absolute," the others are unreal, making transworld identity vacuous.
  *   **Combinatorialism + Necessary Existents:** *Diagnosis:* Unattractive. Combinatorialism relies on the contingency of elements. Positing necessary elements undermines the recombination logic, yet few argue for this hybrid. *Live Option?* Only if one argues that logical constants are "elements" that cannot be removed.
  *   **Primitivism + Worlds Exist:** *Diagnosis:* Incoherent. If modality is primitive, worlds are explanatory idle wheels. One might hold both, but the "Worlds" commitment does no work.

  **3. Indistinguishable Leaves**
  *   **Pair:** Leaf 5 (Propositional/Absolute) and Leaf 7 (State-of-Affairs/Absolute).
  *   **Explanation:** Both posit one real world and abstract representations for others. The distinction between a "maximal proposition" and a "maximal state of affairs" is often merely terminological; both rely on abstracta that obtain or are true.
  *   **Separator:** Ask: "Do propositions exist if no minds exist?" If yes, State-of-Affairs is preferred (mind-independent ways). If no, Propositions are preferred (language-like).
