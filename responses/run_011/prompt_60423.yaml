prompt: |-
  I lead policy work for an online community platform with roughly two million monthly users — a network of semi-autonomous subcommunities, each with its own moderator team. Our head of trust and safety has an argument he uses constantly, in meetings and in internal memos, and it has become the platform's default way of thinking about norm change. The argument runs as follows.

  Community norms are conventions in David Lewis's sense. Like driving on the right-hand side of the road, or which side of a doorway people pass on, they are regularities that solve a recurring coordination problem: everyone would rather that everyone conformed to some single pattern than that people diverged, and which pattern it is matters far less than that it be the same for everyone. From this he draws three conclusions, all of which drive real decisions:

  1. The content of a community norm is largely morally arbitrary; the interesting questions about it are equilibrium-selection questions rather than ethical ones. So the moderation team should not spend effort arguing about whether a norm is right, only about whether it can be made to stick.

  2. Because norms are equilibria, they can be shifted by supplying a new focal point rather than by changing anyone's beliefs. A sufficiently salient, well-publicized, credible signal — his current proposal is to get the fifty most-followed users in each community to commit, simultaneously and publicly, to a new practice — will move the community to the new equilibrium at close to zero persuasion cost.

  3. Resistance to a norm change is therefore coordination friction: switching costs, inertia, uncertainty about what others will do. It is not evidence about the merits of the proposed norm, and treating it as such, as several of our moderators insist on doing, is a category error.

  He has recently applied the framework to two live cases, and this is where I became worried. In case A, we want to replace a norm of public call-outs — users naming and shaming rule-breakers in-thread, often to applause — with a norm of reporting to moderators and letting sanctions happen out of view. In case B, we want to introduce content warnings on posts describing self-harm, in communities where posting such material without warning is the settled norm and where a substantial minority of users have said explicitly that they regard un-warned disclosure as a matter of principle: that they should not have to manage other people's reactions, and that asking them to is itself the harm.

  My own counter-analogy, which I have been deploying badly and without much confidence, is that a community's norms are more like its grammar than like its traffic rules — partly arbitrary, certainly, but load-bearing for what can be said and understood among these particular people, and therefore not switchable by announcement.

  Please audit his analogy rather than mine, though I would like a verdict on mine at the end. Specifically:

  - Set out the correspondence table. What in a platform community plays the role of the driver, the road, the alternative equilibria, the cost of unilateral deviation, and the mechanism by which expectations about others' behavior get transmitted? Where the analogy simply has no counterpart, say so rather than straining.

  - Test the argument against Lewis's own account rather than against the popularized version of it. Which of the conditions he imposes on a regularity's being a convention fail for case A, fail for case B, or fail for platform norms generally — and which of them is his argument silently relying on? I am most suspicious of the requirement that the parties have roughly the same preferences over the possible combinations of actions, and of what follows if that requirement is not met; tell me if I am worrying about the wrong condition.

  - Identify what the analogy smuggles in. Which features of the traffic-rule case — an enforcement authority with jurisdiction, a population of anonymous one-off interactants, a payoff structure in which nobody cares which side of the road anyone else uses so long as it is uniform, an absence of any view about what driving-on-the-right means — are absent from platform norms, or present in the opposite direction?

  - Then say which of the three conclusions survive, in what weakened form, and for which of the two cases. I suspect that conclusion 2 survives for some platform norms and fails badly for others, that conclusion 3 is the one doing the most damage, because it licenses us to discount user testimony about a norm's merits as mere friction, and that conclusion 1 is the one I have been attacking most and least effectively. Argue this rather than assuming it, and tell me where I am wrong.

  - Finally, if the Lewisian frame is the wrong one, what is the right one? Offer a better analogy for platform norms — drawn from the game-theoretic work on how norms emerge and stabilize after Lewis, or from anywhere else you find more illuminating — that preserves whatever explanatory work his analogy genuinely does and supplies what it misses. If you think a distinction in that later literature between mere conventions and norms held in place by something stronger earns its keep here, say so; if you think it is taxonomic bookkeeping with no consequences for what we should do, say that instead.

  One constraint on the answer: it has to be usable by people who will not read Lewis and have no patience for metaethics. So the analysis should bottom out in concrete recommendations about what we should and should not attempt in cases A and B, and about which of his three claims we should stop repeating in meetings.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Policy lead for an online community platform (2M users, semi-autonomous subcommunities).
      *   **Problem:** Head of Trust & Safety (T&S) uses a David Lewis-style "conventions as coordination equilibria" argument to drive norm change strategy.
      *   **T&S Argument:**
          1.  Norm content is morally arbitrary (equilibrium selection, not ethics).
          2.  Norms shift via focal points/signals (low persuasion cost).
          3.  Resistance is coordination friction, not ethical objection.
      *   **Specific Cases:**
          *   Case A: Public call-outs $\rightarrow$ Private reporting.
          *   Case B: No content warnings on self-harm $\rightarrow$ Mandatory content warnings (users claim principle against it).
      *   **User's Counter:** Norms are like grammar (load-bearing, not switchable by announcement).
      *   **Task:** Audit the T&S Head's Lewis analogy (not the user's grammar analogy, though verdict needed at end).
      *   **Requirements:**
          *   Correspondence table (Driver, Road, Equilibria, etc.).
          *   Test against Lewis's actual conditions (especially preferences).
          *   Identify what the analogy smuggles in (hidden assumptions).
          *   Evaluate the three conclusions (which survive, which fail, for which cases).
          *   Propose a better framework/analogy (post-Lewis game theory or elsewhere).
          *   **Constraint:** Usable by non-philosophers/non-theorists. Concrete recommendations for Cases A & B. Stop repeating specific claims.

  2.  **Deconstruct the T&S Head's Argument (Lewisian Conventions):**
      *   *Core Concept:* Conventions are solutions to coordination problems (like driving side). Everyone prefers coordination over non-coordination, regardless of *which* coordinate is chosen.
      *   *Implication:* Change the focal point, change the norm. Resistance is just inertia. Content doesn't matter, only consistency.

  3.  **Audit Step 1: Correspondence Table:**
      *   *Driver:* Individual user.
      *   *Road:* The interaction space (thread, DM, feed).
      *   *Alternative Equilibria:* Call-out vs. Report (Case A); Warning vs. No Warning (Case B).
      *   *Cost of Unilateral Deviation:* Social sanction, confusion, inefficacy.
      *   *Transmission of Expectations:* Public posts, mod sticky threads, influencer signals.
      *   *Missing Counterparts:* Lewis assumes a pre-existing preference for *any* equilibrium. Online, people often prefer *specific* equilibria based on values. Lewis assumes anonymous, one-off interactions. Online is often repeated, identity-linked.

  4.  **Audit Step 2: Testing Against Lewis's Actual Conditions:**
      *   *Lewis's Definition (Convention: A Philosophical Study):*
          1.  Regularity in behavior.
          2.  Common knowledge/expectation.
          3.  Conditional preference: Everyone prefers to conform *if* others conform.
          4.  **Crucial:** There must be at least one *other* possible regularity that could have solved the problem.
          5.  **Crucial:** Preferences must be roughly aligned regarding the *outcome* of coordination vs. non-coordination.
      *   *Failure Points:*
          *   *Case A (Call-outs):* Do users prefer *any* system of accountability, or do they specifically value public shaming as justice? If they value public shaming *intrinsically*, it's not a pure coordination problem. It's a conflict of interest.
          *   *Case B (Self-harm Warnings):* Users explicitly state a principle ("I shouldn't manage others' reactions"). This indicates conflicting preferences over the *content* of the norm, not just the existence of a norm. Lewis requires parties to be indifferent between equilibria *except* for the coordination benefit. Here, Party X prefers Equilibrium 1, Party Y prefers Equilibrium 2. This is a *Battleground* or *Assurance* game, not a pure *Coordination* game.
          *   *General:* Lewis assumes "common knowledge." Online communities are fragmented. Subcommunities have different cultures.

  5.  **Audit Step 3: What the Analogy Smuggles In:**
      *   *Indifference:* Traffic rules assume I don't care if we drive on the left or right, as long as we agree. T&S assumes users don't care if they call out or report, as long as they agree. This is false for value-laden norms.
      *   *Anonymity/Interchangeability:* Drivers are interchangeable. Users have reputations, histories, and power dynamics.
      *   *External Enforcement:* Traffic rules have police. Platform has mods, but legitimacy varies.
      *   *Safety vs. Convenience:* Driving side is neutral. Self-harm warnings involve harm prevention. Calling out involves justice/retribution. These aren't neutral.
      *   *The "Friction" Fallacy:* Treating ethical objection as "switching costs" delegitimizes user agency.

  6.  **Audit Step 4: Evaluating the Three Conclusions:**
      *   *Conclusion 1 (Arbitrariness):* **FAIL.** Norm content matters deeply for safety and retention. Case B is ethical, not arbitrary.
      *   *Conclusion 2 (Focal Points):* **PARTIAL SURVIVAL.** Works for low-stakes UI/UX norms (e.g., tagging memes). Fails for high-stakes behavioral norms (Case A & B) where buy-in is needed. Influencers signaling might backfire if perceived as coercion.
      *   *Conclusion 3 (Resistance as Friction):* **DANGEROUS FAIL.** This is the most damaging. It gaslights users. Resistance in Case B is ethical, not friction. Ignoring it leads to revolt or exodus.

  7.  **Audit Step 5: Better Framework/Analogy:**
      *   *Lewis is too thin.* Need **Bicchieri's Social Norms** or **Elster's Norms**.
      *   *Better Analogy:* **Constitutional Law / Local Customs** or **Grammar (User's idea is actually good but needs refinement).**
      *   *Let's go with Bicchieri:* Distinguishes between *Empirical Expectations* (what others do) and *Normative Expectations* (what others think *should* be done).
      *   *Alternative Game Theory:* **Stag Hunt** (Assurance) vs. **Prisoner's Dilemma** vs. **Coordination**.
      *   *Recommendation:* Case A is an Assurance Game (need trust in mods). Case B is a Conflict/Value Clash (need negotiation, not focal points).
      *   *Verdict on User's Grammar Analogy:* It's better than Lewis because it acknowledges structure and meaning, but "Grammar" implies rigidity. "Constitution" or "Local Custom" might be better for *change*. Actually, let's validate the Grammar analogy but refine it: Grammar constrains *meaning*, Traffic rules constrain *movement*. Online norms constrain *meaning and safety*.

  8.  **Drafting the Response (incorporating constraints):**
      *   *Tone:* Professional, analytical, actionable. No meta-ethics jargon.
      *   *Structure:* Follow the prompt's bullet points.
      *   *Key Insight:* The T&S Head is treating "Norms" as "Conventions." They are often "Social Norms" (moralized) not "Conventions" (arbitrary).
      *   *Actionable Advice:* Stop saying resistance is friction. Stop assuming content is arbitrary. Use focal points only for low-stakes coordination. For A & B, use different strategies.

  9.  **Refining the Analysis (Self-Correction during drafting):**
      *   *Check:* Did I address Lewis's specific preference condition? Yes, the "indifference between equilibria" is the weak point.
      *   *Check:* Did I give a verdict on the Grammar analogy? Yes, at the end.
      *   *Check:* Is it usable by non-philosophers? Need to translate "conditional preference" into "do they actually want this specific rule or just any rule?"
      *   *Check:* Case A vs Case B distinction. Case A is procedural (might work with focal point if trust exists). Case B is substantive (won't work with focal point).
      *   *Refinement on "Grammar":* The user said they deployed it "badly." I should validate it but explain *why* it works better (load-bearing) while noting its limits (grammar evolves, but slowly and internally). Actually, a "Constitution" analogy might be more policy-relevant. Let's stick to evaluating the User's Grammar analogy as requested, but offer the "Social Norms vs. Conventions" distinction as the *theoretical* upgrade.

  10. **Final Polish:** Ensure the "Stop Repeating" list is clear. Ensure the Case A/B recommendations are distinct. (Case A: Trust building. Case B: Negotiation/Exemption).

  *(Self-Correction on Lewis Details)*: Lewis emphasizes *common knowledge* and *precedent*. The T&S head focuses on *focal points* (Schelling). This is consistent with Lewis, but Lewis requires the preference structure to be coordination-heavy. I need to make sure I don't conflate Schelling and Lewis too much, though they are compatible here. The core failure is the *preference structure*.

  *(Final Plan)*:
  1. Correspondence Table.
  2. Lewis Condition Test (Preferences).
  3. Smuggled Assumptions.
  4. Verdict on Conclusions 1, 2, 3.
  5. Better Framework (Bicchieri/Social Norms).
  6. Verdict on Grammar Analogy.
  7. Concrete Recommendations.

