prompt: |-
  so I'm in this informal reading group — six of us, none of us academics, one guy plays poker semi-seriously and one woman does market research for a living — and we've been grinding through material on disagreement and belief. I took exactly one stats course in college and never any game theory, so I'm usually flying blind and relying on whatever summary somebody hands out. Last week the person running the group passed around a one-pager she wrote herself to get everyone up to speed before we discussed Aumann's agreeing-to-disagree theorem, and it's that one-pager I want you to look at. She's smart and it reads very confidently, and two people in the group just swallowed it whole, but a couple of sentences gave me a nagging feeling I couldn't articulate. Here it is, more or less verbatim:

  "The common prior assumption says that rational people all start out with the same beliefs. Formally, there's one prior probability distribution over the possible states of the world, and each agent just conditionalizes that prior on whatever private information they happen to have — so a disagreement between two rational agents is always a disagreement about evidence, never about priors. Aumann's theorem shows the payoff: if two agents have a common prior and each of them knows the other's opinion about some event, then their opinions have to match. That's the sense in which it's impossible to agree to disagree. The upshot is that disagreement is a form of irrationality. Your priors are basically your biases, the stuff you soaked up from your family and your culture, and Aumann proved that two rational agents can't have different priors — so every time you and I end up on opposite sides about politics or God or where the stock is going, at least one of us is failing to be rational. Some economists grumble that the common prior assumption is unrealistic, but that's missing the point, because it costs you nothing: you can always redescribe a situation as having a common prior without changing any of the predictions."

  Go at it sentence by sentence and tell me what a real game theorist or formal epistemologist would happily sign, what they'd shrug off as a forgivable simplification, and what is just wrong — I especially want your take on the "each of them knows the other's opinion" line and the "your priors are your biases" line, since those are the two that itched. Then that last sentence, the claim that assuming a common prior costs nothing because you can always redescribe: that strikes me as the actual fight, and I have a dim memory of an argument that the assumtion is doing hidden work rather than being free bookkeeping, plus some other move involving putting a prior over priors, and I can't reconstruct either one. Say whether the handout's dismissal survives that argument or collapses under it, and if it collapses, what she should have written instead. Finally, does the punchline hold once the summary is fixed — is "we disagree, therefore one of us is irrational" really licensed, and if not, which assumption would a defender of the whole framework say is the one that's failing in an actual human disagreement? I'd also like to know whether there's some reading of the handout on which it's basically right and I'm just being picky. Rank the errors by how badly they'd distort a beginner's understanding, and please write the whole thing in American English.
