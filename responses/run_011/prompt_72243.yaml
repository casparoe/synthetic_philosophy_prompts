      *   Charitable Reading: Harsanyi Doctrine context.
      *   Error Ranking.

  7.  *(Self-Correction during drafting)*: I need to be careful not to say Aumann's theorem is *wrong*. It's mathematically sound. The handout's *interpretation* and *application* are the problem. Distinguish between the math and the philosophy.

