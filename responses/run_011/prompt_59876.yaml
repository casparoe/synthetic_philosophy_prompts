  7.  **Final Polish:** (Self-Correction during drafting) Make sure to distinguish between the harm of *death* and the harm of *PVS life*. The prompt asks about the "extra nine years." This is crucial. It's not about the badness of her dying in '85, but the badness of living '76-'85.

