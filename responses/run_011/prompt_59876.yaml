          *   If you don't (Nagel), they are bad.
          *   *Symmetry Challenge:* If PVS is bad because of lost goods, why isn't pre-birth bad? (Parfit's variation).
      *   *Court's Assumption:*
          *   The court required "no realistic prospect of returning to a conscious, cognitive life."
          *   *Assumption:* Cognitive/conscious life is the only life with value. Biological life alone is insufficient. It assumes a "biographical" view of life over a "biological" view.
      *   *Where Theories Go Silent:*
          *   Relational harm (harm to family).
