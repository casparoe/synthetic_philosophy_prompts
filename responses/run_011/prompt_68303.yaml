  **Node 3:** Is the obligation derived from a duty to act only on rules everyone could follow?
  *   **Yes** → **Leaf 2: The Universalizability Principle**
  *   **No** → Go to Node 4.

  **Node 4:** Is the coordination achieved merely because one option stands out as obvious to all?
  *   **Yes** → **Leaf 3: Salience Plus Common Knowledge**
  *   **No** → **Leaf 4: Unnamed (Causal Coordinationist)**

  **Node 5:** Is your choice a sign of theirs even without physical contact?
  *   **No** → **Leaf 5: Unnamed (Non-Evidentialist)**
  *   **Yes** → Go to Node 6.

  **Node 6:** Are the multiple agents literally the same mind deciding once?
  *   **Yes** → **Leaf 6: The One Chooser**
  *   **No** → Go to Node 7.

  **Node 7:** Do you read "if I do X, they do X" as a mathematical probability or a causal-style dependency?
  *   **Probability** → Go to Node 8.
  *   **Dependency** → Go to Node 8.
      *(Note: This node diagnoses the reasoning style but does not separate final positions; see Analysis.)*

  **Node 8:** Is the premise that all agents reason alike a rule of the puzzle or a guess about psychology?
