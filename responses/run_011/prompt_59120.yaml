  T=1: 400 non-events, 600 events (Risk 0.60)
  OR = (600*600)/(400*400) = 360000/160000 = 2.25

  Total N per stratum = 1000. Total N per treatment = 1000. (Balanced).
  Marginal Table:
  T=0: 1500 non, 500 events (Risk 0.25)
  T=1: 1200 non, 800 events (Risk 0.40)
  Marginal OR = (800*1500)/(1200*500) = 1,200,000 / 600,000 = 2.0.
  Result: 2.25 -> 2.0. Attenuation. No flip.

  To get a flip, I need to unbalance the treatment assignment across strata (break randomization) OR change the conditional ORs (effect modification) such that the weighting drags it down. But if $T \perp Z$, weights are equal. If OR is constant, no drag. So flip is impossible under RCT + Constant OR.

