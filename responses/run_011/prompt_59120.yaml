prompt: |-
  So I'm a second-year biostat masters student and I've got a journal club writeup due Friday on confounding, and I've ended up in a mildly annoying argument with my supervisor that I now want to win on paper. He's a Pearl guy and I'm pretty sure he thinks I'm splitting hairs, so I need this to be tight.

  Here's the thing. The line you get in basically every methods text — and in two of my lectures — is that Simpson's paradox isn't cured by randomization, because the odds ratio is non-collapsable: even when your covariate is independent of treatment assignment by design and the conditional odds ratio is identical in every stratum, the crude odds ratio still comes out closer to 1 then the conditional one. And that gets sold as a genuine Simpson reversal showing up in a perfectly randomized trial.

  I want to argue the opposite: non-collapsability is not Simpson's paradox. Attenuation toward the null is a different animal from reversal — nobody flips which treatment they'd give over it — and lumping the two together is exactly what makes people think randomization has failed when it hasn't.

  Can you build me the strongest version of that argument? Specifically:

  - the crisp distinction between "the marginal and conditional measures disagree" and "the marginal and conditional measures disagree about direction," and why only the second one earns the name
  - a worked mini 2x2x2 table where the covariate is independent of treatment and the conditional odds ratio is constant and above 1, showing the crude odds ratio shrinks toward 1 without crossing it — and then an honest attempt to break that: what exactly would I have to change in the table to get a real sign flip, and why does every such move smuggle in either dependence between covariate and treatment or opposite-signed stratum effects
  - why risk differences and risk ratios behave better here, what collapsability is actually buying you, and whether the crude measure is still some weighted average of the stratum-specific effects even when there is genuine effect modification
  - what the true statement about randomization is — what it does and doesn't protect you from — so I'm not arguing something dumb like randomization makes every estimate unbiased
  - the strongest version of the other side, including the worry that this is just a verbal dispute over the definition of the paradox, plus my best reply that doesn't amount to stipulating the definition in my own favour

  Don't bother with citations or a reading list, I've already got the papers. I just need the reasoning, solid enough that a room full of epi people can't pick holes in it.
