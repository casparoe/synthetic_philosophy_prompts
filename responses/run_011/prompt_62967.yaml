answer: |-
  # Activity: "The Intelligence Brief"

  ## 1. Game Overview & Materials
  **Goal:** Students experience the divergence between semantic content (what is said) and pragmatic force (what is conveyed) through a cooperative transmission task where informational costs vary.
  **Class Size:** 12 (6 pairs).
  **Materials:** 
  *   6 Folders (one per pair).
  *   Inside each folder: 3 Sets of "State Cards" (numbered 1–10), 3 Sets of "Message Slips," 3 Score Sheets.
  *   Projector/Board for global instructions (no theory terms).
  *   Timer.

  **Roles:** 
  *   **Analyst (Speaker):** Sees the "Threat Level" (a number 1–10). Sends a written message.
  *   **Director (Hearer):** Reads the message. Decides "Low Mobilization" (1–5) or "High Mobilization" (6–10).

  **Scoring (Joint Pair Score):**
  *   **Accuracy:** If Director's decision matches the Threat Level range (Low/High), **+10 points**. If mismatch, **0 points**.
  *   **Message Cost:** Deducted from the Accuracy score.
      *   Specific Number (e.g., "7"): **-5 points**.
      *   "All" / "None": **-2 points**.
      *   "Some" / "Any" / "Most": **0 points**.
  *   **Total:** Accuracy - Cost. (Max possible per round: 10).

  ---

  ## 2. Timeline (100 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Setup** | Distribute folders. Explain rules. **Forbidden:** Do not use words *implicature, maxim, flout, cancel*. Emphasize: "Maximize Joint Score." |
  | **10–25** | **Round 1** | **Baseline (Costly Precision).** Message Costs apply as above. 3 Trials. |
  | **25–40** | **Round 2** | **The Trap (Hidden Cost Shift).** Message Costs **doubled** for Specific Numbers/All (-10/-4). "Some" remains 0. 3 Trials. *Crucial: Directors are not told costs changed.* |
  | **40–55** | **Round 3** | **Cancellation.** Same costs as Round 2. Analysts may add parenthetical text to messages (e.g., "Some (maybe all)"). 3 Trials. |
  | **55–60** | **Collection** | Collect score sheets. Do not discuss results yet. |
  | **60–100** | **Debrief** | Theory mapping, failure analysis, theoretical limitations (see below). |

  ---

  ## 3. Round Design & Rationale

  ### Round 1: Baseline (Cooperation)
  *   **Design:** Costs are present but low enough that precision usually pays off (Cost 5 vs. Gain 10).
  *   **Expected Behavior:** Analysts write specific numbers ("7"). Directors trust them. High scores.
  *   **Purpose:** Establishes a norm of precision and trust. Students calibrate to the idea that "more info = better score."

  ### Round 2: The Trap (The Gap)
  *   **Design:** Costs for precision double (-10). A specific number now results in a *negative* total score even if accurate (10 - 10 = 0). "Some" costs 0.
  *   **The Trap:** 
      *   **State:** Threat Level 10 (High).
      *   **Analyst:** To avoid the -10 cost, writes "Some threats detected" (True, Cost 0).
      *   **Director:** Relying on Round 1 norms, infers "Some" implies "Not All." Assumes Threat is Low/Mid. Decides "Low Mobilization."
      *   **Outcome:** Accuracy 0. Cost 0. **Total 0.**
  *   **Purpose:** 
      *   **Asserted Truth:** "Some" is true of 10.
      *   **Conveyed Falsehood:** The Director acts as if "Not All" is true.
      *   **The Gap:** Students feel the frustration of a "true" message leading to a "false" outcome. The pressure to convey-without-asserting (to save points) creates the implicature.

  ### Round 3: Cancellation (Stubbornness)
  *   **Design:** Same costs as Round 2. Analysts are explicitly allowed to add text in parentheses.
  *   **The Test:** Analyst writes "Some (possibly all)" to avoid the Director's error in Round 2.
  *   **Expected Behavior:** Directors often *ignore* the parenthesis and still act on "Not All."
  *   **Purpose:** To generate data on the **cancellability** criterion. If the inference persists despite explicit cancellation, it feels "default" or "hard-wired."

  ---

  ## 4. Theoretical Discrimination & Limitations

  ### Levinson (Default) vs. Sperber & Wilson (Relevance)
  **Can this game discriminate between them?**
  **No.** 
  *   **Reason:** Discriminating between a default inference (Levinson) and a fast relevance calculation (S&W) requires reaction-time data or eye-tracking to measure processing load. A behavioral choice (Low vs. High Mobilization) in a 15-minute round is too coarse. 
  *   **What the data shows:** It shows *persistence* of inference, not *mechanism*. 
  *   **Additional Condition Needed:** To discriminate, you would need to measure the *time* it takes for the Director to make a decision in Round 3 (Cancellation) vs. Round 1. If Cancellation slows decision-making significantly, it supports S&W (inference must be recalculated). If speed is constant, it supports Levinson (inference is blocked or ignored automatically). Without timing, the game generates a dispute, not a verdict.

  ### Kent Bach's Objection ("Some but not all" is Said)
  **Can this activity stage Bach's objection?**
  **Honest Note:** No, not mechanically. 
  *   **Reason:** The game rules define "Some" as logically compatible with "All" (by allowing the Analyst to write it when the number is 10). Bach's argument rests on natural language intuition, not game stipulations.
  *   **How to handle:** In the debrief, ask students: *"When the Analyst wrote 'Some' in Round 2, did you feel they lied, or did you feel 'Some' just means 'a subset'?"* If students argue that "Some" *naturally* excludes "All" regardless of the game logic, they are voicing Bach. Use their intuition as the data point, not the score sheet.

  ---

  ## 5. Debrief Plan (40 Minutes)

  **Phase 1: The Reveal (10 mins)**
  *   Write the forbidden words on the board: *Implicature, Maxim, Flouting, Cancellability.*
  *   Ask Round 2 Analysts: "Why did you write 'Some' when the number was 10?" (Answer: To save points).
  *   Ask Round 2 Directors: "Why did you guess Low?" (Answer: Because if it were 10, they would have said 'All').
  *   **Map:** 
      *   "Some" = **What is Said** (Truth-conditional).
      *   "Not All" = **What is Implicated** (Inferred).
      *   Cost Pressure = **Exploiting the Maxim of Quantity** (Speaker knows more but says less).

  **Phase 2: Nondetachability & Cancellation (15 mins)**
  *   **Cancellation:** Display Round 3 data. If Directors still guessed Low despite "(possibly all)," discuss **Cancellability**. 
      *   *Gricean View:* Implicatures are cancellable. If it wasn't cancelled, why? (Inertia/Default).
      *   *Levinson vs. S&W:* Use the "No" from section 4. Explain that without timing, we can't know if it's a default or a fast calculation.
  *   **Nondetachability:** Ask a pair to re-run a Round 2 scenario orally. 
      *   Try paraphrase: "A number of threats" vs. "Some threats." 
      *   Does the inference vanish? (It shouldn't). This demonstrates **Nondetachability** (the inference attaches to the meaning, not the specific word).

  **Phase 3: The "Working Out" Schema (10 mins)**
  *   Walk through Grice's calculation on the board using their Round 2 failure:
      1.  Speaker said "Some."
      2.  Speaker could have said "All" (it was true).
      3.  Speaker didn't say "All."
      4.  Therefore, Speaker believes "Not All."
  *   Ask: "Did you actually do this calculation in 30 seconds?"
  *   **Point:** Grice claims this is the *rational reconstruction*, not necessarily the psychological process.

  **Phase 4: Predictable Failures & Handling (5 mins)**
  *   **Failure Mode:** "Gaming the System." In Round 2, Analysts might whisper to Directors, or develop a code (e.g., circling the word "Some" twice means "All").
  *   **Handling:** If this happens, **use it.** 
      *   "You created a new code. That bypassed the implicature. Grice's theory applies to *natural* language use where codes aren't pre-negotiated. You moved from Pragmatics to Stipulative Semantics."
  *   **Failure Mode:** "Performing." Students might guess what you want ("He wants us to fail Round 2").
  *   **Handling:** Acknowledge it. "The Hawthorne Effect is a pragmatic phenomenon too. You inferred my pedagogical intent."

  ---

  ## 6. The One Missing Feature
  **The Normative Force of the Cooperative Principle.**

  *   **What the activity does:** It enforces cooperation via *external scoring rules*. Students cooperate because they want points.
  *   **What Grice requires:** Cooperation is *internal* and *normative*. We cooperate in conversation because it is a rational requirement of communication, not because we are paid to.
  *   **The Gap:** The activity cannot reproduce the feeling that a speaker *ought* to be informative. In the game, if the Analyst stays silent, they just get zero points. In real life, if a speaker stays silent, they violate a social norm.
  *   **Instruction:** You must supply this by argument in the debrief. "In the game, you followed rules. In conversation, you follow norms. Grice's genius was claiming those norms are rational, not just social."

  ---

  ## 7. Summary of Constraints Check
  *   **No forbidden words before debrief?** Yes.
  *   **Hearer's end focus?** Yes (Directors act on inferences).
  *   **Conveying falsehood via truth?** Yes (Round 2: "Some" is true, "Not All" is false).
  *   **Cancellation round?** Yes (Round 3).
  *   **Levinson vs. S&W discrimination?** Explicitly stated as **No** (requires timing).
  *   **Bach objection?** Addressed as intuition in debrief (cannot be staged mechanically).
  *   **Predictable breaks?** "Gaming" and "Performing" addressed.
  *   **Missing Feature?** Normative force of CP.
