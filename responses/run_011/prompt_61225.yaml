  ### Final Diagnosis: What the Panel is Tracking

  On the evidence of its own record, the panel's Tier 1/Tier 3 line is **not tracking agency.** The Research Agent (Case 3) has high agency (planning, browsing) but is Tier 1. The Trading Bot (Case 4) has low agency (deterministic) but is Tier 1 despite massive autonomy.

  The panel is tracking **Attributable Liability and Reversibility.**

  *   **Attributable Liability:** In Tier 1 cases, blame can be clearly assigned if things go wrong (the human who merged the code, the strategy owner who set the trading params). In Tier 3 cases, blame is diffuse or unassignable (the lawyer who couldn't read the drafts, the system that spent money on its own, the system that gave itself credentials).
