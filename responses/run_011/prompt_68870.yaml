prompt: |-
  I am a liaison psychiatrist, and a growing share of my capacity assessments involve older adults whose everyday thinking is carried partly by things outside their heads: a notebook maintained for thirty years, a phone that prompts every medication and appointment, a spouse who supplies the missing words. The statutory test I work to has four limbs — the person must understand, retain, weigh, and communicate information relevant to the decision — but my service assesses those limbs as though they measured internal machinery alone: we take aids out of the room, and we score a relative's prompting as contamination rather than as part of the cognitive system being tested.

  Please convert the extended mind thesis, and the parity principle at its core, into a procedure my team can run inside a forty-five-minute assessment by clinicians with no philosophy training. I want the questions asked in order, what counts as a sufficient answer to each, which external supports are to be treated as constituents of the person's cognition for assessment purposes and which are merely aids they could do without, and how to treat supports that are unreliable, absent overnight, or controlled by someone with an interest in the outcome. Mark the steps that are judgment calls dressed as procedure, and say plainly where the thesis runs out — in particular, whether any criterion can be applied to a human partner without the boundary of the mind dissolving altogether.

  Then run it on two cases: a retired engineer who cannot reproduce a single date, name, or commitment without his notebook, and who uses it competently and unthinkingly; and a woman with early-stage dementia whose husband answers most questions before she can, and whose own answers improve markedly when he leaves the room. Give me a procedure I could defend to a tribunal, and tell me where it will misfire.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Liaison Psychiatrist.
      *   **Problem:** Current capacity assessments (based on the statutory test: Understand, Retain, Weigh, Communicate) treat cognition as purely internal. They exclude external aids (notebooks, phones, spouses) or treat them as contamination. This disadvantages older adults who rely on "extended cognition."
      *   **Task:** Convert the *Extended Mind Thesis* (EMT) and the *Parity Principle* into a practical, 45-minute clinical procedure for clinicians without philosophy training.
      *   **Requirements:**
          *   Ordered questions.
          *   Criteria for sufficient answers.
          *   Distinction between *constituents* of cognition vs. *mere aids*.
          *   Handling unreliable/absent/interested supports.
          *   Identify "judgment calls dressed as procedure."
          *   Identify where the thesis runs out (limits).
          *   Apply to two specific cases (Engineer + Notebook; Woman + Husband).
          *   Defensible to a tribunal.
          *   Acknowledge where it will misfire.

  2.  **Deconstruct the Philosophy (Extended Mind Thesis & Parity Principle):**
      *   *Core Idea (Clark & Chalmers):* Cognitive processes aren't just in the head. If an external resource functions *like* an internal cognitive process, it should be considered part of the mind.
      *   *Parity Principle:* "If, as we confront some task, a part of the world functions as a process which, were it done in the head, we would have no hesitation in recognizing as part of the cognitive process, then that part of the world is (so we claim) part of the cognitive process."
      *   *Criteria for Extension (often cited as CRUMS or similar):*
          1.  Reliability/Availability.
          2.  Automatic Endorsement (trust).
          3.  Past Endorsement (information was consciously placed there).
          4.  Ease of Access.

  3.  **Translate to Clinical Procedure (The "Extended Capacity Assessment Protocol" - ECAP):**
      *   *Constraint:* 45 minutes. No philosophy jargon. Legally defensible (Mental Capacity Act 2005 context implied by "statutory test" and "tribunal").
      *   *Goal:* Assess the *system* (Person + Aid), not just the *Person*.
      *   *Structure:*
          1.  Identify the Decision.
          2.  Map the Cognitive System (Internal + External).
          3.  Test the Parity (Is the aid part of the mind?).
          4.  Test the Statutory Limbs (using the System).
          5.  Risk/Reliability Check.

  4.  **Drafting the Procedure (Iterative Process):**
      *   *Step 1: Mapping.* Need to know what they use.
      *   *Step 2: Parity Check.* This is the hard part. How to make "Parity Principle" operational? Use the "Internal Counterfactual": *If this info were in biological memory, would we accept it?*
      *   *Step 3: The 4 Limbs.* Apply Understand, Retain, Weigh, Communicate *with* the aid.
      *   *Step 4: Reliability/Interest.* Crucial for legal defense. A notebook is different from a controlling spouse.
      *   *Judgment Calls:* Need to highlight where the clinician has to make a subjective call that looks objective.
      *   *Limits:* Where does the mind stop? A spouse is tricky. If the spouse *is* the memory, does the spouse have veto power?

  5.  **Developing the Criteria (Constituents vs. Aids):**
      *   *Constituent (Part of Mind):* High reliability, automatic trust, historical endorsement (user put info there), constant access.
      *   *Mere Aid (Scaffolding):* Intermittent, requires high effort to interpret, not trusted automatically.
      *   *Contamination (Third Party):* Someone else deciding for them.

  6.  **Addressing the "Human Partner" Problem:**
      *   This is the philosophical breaking point. If a husband supplies words, is he part of her mind? Or is he influencing her?
      *   *Solution:* Distinguish between *Scaffolding* (prompting retrieval) vs. *Substitution* (providing the content).
      *   *Limit:* The boundary dissolves if the partner controls the *weighing* process.

  7.  **Applying to Case Studies:**
      *   *Case 1 (Engineer + Notebook):*
          *   Notebook is likely a *constituent*. He wrote it (endorsement), trusts it (automatic), uses it constantly (availability).
          *   Assessment: Allow notebook. If he uses it to weigh/retain, he has capacity.
      *   *Case 2 (Woman + Husband):*
          *   Husband is risky. He answers *for* her.
          *   Assessment: Test with him, test without him.
          *   If she improves without him -> He was interference, not extension.
          *   If she fails without him -> Does he count as memory? Probably not, because he has an "interest in the outcome" (potential conflict).
          *   Verdict: Likely lacks capacity if the decision relies on info only he holds, OR needs safeguarding if he is the only access.

  8.  **Refining for Tribunal Defense:**
      *   Must align with MCA Code of Practice (practicable steps to assist).
      *   Must show *why* the aid is treated as part of the person.
      *   Must document the "Parity Test."

  9.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the tension between philosophy and law.
      *   **The Protocol (ECAP):** Step-by-step instructions.
      *   **The Parity Filter:** Specific criteria for what counts as "mind."
      *   **Handling Human Supports:** Specific rules for spouses/carers.
      *   **Judgment Calls & Limits:** Honest disclosure of subjectivity.
      *   **Case Applications:** Walkthrough of the two scenarios.
      *   **Where It Misfires:** Critical self-reflection on the protocol.

  10. **Review against Constraints:**
      *   45 mins? Yes, keep steps tight.
      *   No philosophy training? Use plain English (e.g., "The Internal Counterfactual" instead of "Parity Principle").
      *   Tribunal defensible? Link to MCA principles (Section 1(3) - practicable steps).
      *   Mark judgment calls? Use specific icons or bold text.
      *   Address the "boundary dissolving" issue? Yes, in the limits section.

  11. **Final Polish:** Ensure tone is professional, empathetic, and clinically precise. (Self-Correction: Make sure not to overpromise. The EMT is controversial in law. Frame this as an *interpretation* of "practicable steps to assist" rather than a change in the law.) *Correction:* The prompt asks to convert the thesis *into* a procedure. I must present it as a functional tool, while explicitly stating its legal vulnerabilities in the "Limits" section.

  12. **Final check on the "Human Partner" issue:** This is the hardest part. If the husband is part of the mind, his bias is *her* bias. But legally, capacity requires *their* decision. I need to draw a line at *agency*. The aid must not have independent agency that conflicts with the patient.

  (Proceed to draft response based on these thoughts.)
answer: |-
  This is a high-stakes translation. You are asking to operationalize a metaphysical claim (the mind extends beyond the skull) within a legal framework (the Mental Capacity Act 2005, presumably, given the "statutory test" language) that presupposes an individualistic subject.

  To make this defensible to a tribunal, we cannot argue that the *law* is wrong. We must argue that **Section 1(3) of the Act** ("A person is not to be treated as unable to make a decision unless all practicable steps to help him to do so have been taken without success") mandates the inclusion of reliable external cognitive systems. If a notebook functions as memory, removing it is not a "practicable step to help"; it is an artificial induction of incapacity.

  Below is the **Extended Capacity Assessment Protocol (ECAP)**. It is designed for a 45-minute window. It translates the *Parity Principle* into a "Functional Equivalence Test."

  ---

  ### The Extended Capacity Assessment Protocol (ECAP)

  **Time:** 45 Minutes
  **Goal:** Determine if external resources are *constituents* of the patient's cognition or merely *scaffolding*.
  **Legal Anchor:** MCA Section 1(3) (Practicable Steps) & Section 3 (Definition of Inability).

  #### Phase 1: System Mapping (10 Minutes)
  *Do not begin the statutory test yet.* Identify the "Cognitive System."

  1.  **Question:** "When you make decisions like this at home, what do you use to help you remember or think?"
  2.  **Question:** "Who is usually in the room when you decide things?"
  3.  **Action:** List all artifacts (notebooks, phones, calendars) and people (spouse, carer) relied upon.
  4.  **Judgment Call [⚠️]:** Distinguish between *routine reliance* (always used) and *situational crutches* (brought out because the doctor is here). Only routine reliance counts for extension.
      *   *Procedure:* Ask the supporter/family: "Is this how they operate daily?" If the notebook is usually in a drawer and only brought out for the assessment, it is a prop, not a limb.

  #### Phase 2: The Functional Equivalence Test (The Parity Filter) (10 Minutes)
  *Before testing the 4 limbs, determine which supports count as part of the 'person'.*

  Apply the **C.R.A.P. Criteria** to each support identified in Phase 1. If a support meets all four, it is treated as **Internal Cognition** for the purpose of the assessment.

  1.  **Consistency:** Is the support reliably available when needed?
      *   *Pass:* Notebook always in pocket; Spouse always present.
      *   *Fail:* Phone battery dies daily; Spouse works night shifts.
  2.  **Retrieval Ease:** Is access to the information automatic/quick, or does it require complex interpretation?
      *   *Pass:* Glancing at a date; Spouse finishing a familiar sentence.
      *   *Fail:* Decoding a complex spreadsheet; Spouse explaining a complex medical concept.
  3.  **Authorship (Endorsement):** Did the patient consciously input/validate this information?
      *   *Pass:* Patient wrote the note; Patient has historically agreed with spouse's prompts.
      *   *Fail:* Note written by son; Spouse contradicting patient's past wishes.
  4.  **Proximity:** Is the support physically/presently available during the decision?
      *   *Pass:* Notebook on table; Spouse in chair.
      *   *Fail:* Notebook locked in safe; Spouse on the phone.

  **Rule:** If a support fails *any* CRAP criterion, it is treated as an **External Aid**. The patient must demonstrate capacity *without* it, or with it treated as a hint rather than memory.
  **Rule:** If a support passes *all* CRAP criteria, it is a **Cognitive Constituent**. The assessment proceeds *with* it embedded.

  #### Phase 3: The Statutory Test on the System (20 Minutes)
  *Apply Understand, Retain, Weigh, Communicate to the Person + Constituent System.*

  1.  **Understand:** Can the system (Person + Aid) grasp the facts?
      *   *Procedure:* Allow the patient to read from the notebook or ask the spouse to state the facts *if* the spouse passed the CRAP test.
  2.  **Retain:** Can the system hold the facts long enough to decide?
      *   *Procedure:* If the patient looks at the notebook to recall the fact, this counts as Retention. (Parity: Looking up a number in biological memory vs. looking it up in a trusted book).
  3.  **Weigh:** Can the system balance the pros and cons?
      *   *Procedure:* **Critical Limit.** External aids can store weights, but the *balancing mechanism* must be internal.
      *   *Question:* "Why does this note make you choose A over B?"
      *   *Sufficient Answer:* The patient explains the value judgment.
      *   *Insufficient Answer:* "The book says A." or "My husband says A."
  4.  **Communicate:** Can the system output the decision?
      *   *Procedure:* If the spouse supplies words (aphasia), this counts as Communication *provided* the spouse is a Constituent (passes CRAP).

  #### Phase 4: Reliability & Interest Check (5 Minutes)
  *This is where the tribunal will attack you.*

  1.  **Question:** "What happens if the notebook is lost / the spouse is sick?"
      *   *Procedure:* If the system collapses completely without the aid, note this as **Fragile Capacity**. It is still capacity, but it requires a care plan to maintain the support.
  2.  **Question:** "Does the supporter have a financial or emotional interest in the outcome?"
      *   *Procedure:* **Hard Stop.** If a human supporter has a conflict of interest (e.g., inheritance, caregiver burden), they **cannot** be a Cognitive Constituent for the *Weighing* limb, regardless of CRAP scores. They are contamination.
      *   *Action:* Remove interested party for the *Weighing* phase.

  ---

  ### Where the Thesis Runs Out (The Limits)

  You asked for plain speech on where this breaks.

  1.  **The Agency Boundary:** The Extended Mind Thesis works for *tools* (notebooks) because tools have no agency. It frays with *humans* (spouses). If a spouse is part of the mind, their bias is the patient's bias. But the law requires the *patient's* will.
      *   *The Limit:* A human can be a constituent for **Retention** (memory) and **Communication** (speech), but never for **Weighing** (values). If the spouse determines the *value* of the option, the boundary has dissolved too far. The mind may extend, but the *self* cannot.
  2.  **The "Overnight" Problem:** Biological memory sleeps but persists. A spouse sleeps and becomes unavailable. A phone battery dies.
      *   *The Limit:* Extended capacity is **State-Dependent**. You are assessing capacity *in situ*. You must document: "Capacity present when support X is active." This is legally valid but practically risky if the support fails later.
  3.  **Judgment Calls Dressed as Procedure [⚠️]:**
      *   **Authorship:** Determining if a patient "endorsed" a note written 5 years ago is subjective.
      *   **Automaticity:** Deciding if a spouse's prompt is "automatic retrieval" or "coercion" is a clinical judgment, not a measurement.
      *   **Conflict of Interest:** Determining if a spouse's desire for the patient to move to care is "protective concern" or "financial interest" is often ambiguous.

  ---

  ### Case Applications

  #### Case 1: The Retired Engineer (Notebook User)
  *Profile:* Cannot reproduce dates/names without notebook. Uses it competently/unthinkingly for 30 years.

  **ECAP Run:**
  1.  **Mapping:** Notebook identified.
  2.  **Parity Filter (CRAP):**
      *   *Consistency:* Yes (30 years).
      *   *Retrieval:* Yes (Unthinking/automatic).
      *   *Authorship:* Yes (He wrote it).
      *   *Proximity:* Yes (Brought to assessment).
      *   *Result:* **Cognitive Constituent.**
  3.  **Statutory Test:**
      *   *Retain:* He looks at the book to recall the appointment date. **Pass.** (Parity: This is functionally identical to biological recall).
      *   *Weigh:* He explains *why* the appointment in the book matters to his health. **Pass.**
  4.  **Reliability:** Notebook is robust. Low risk of loss.
  5.  **Verdict:** **Has Capacity.**
  6.  **Tribunal Defense:** "Removing the notebook would be akin to assessing a short-term memory patient while administering a sedative. It creates an artificial deficit. The notebook is functionally isomorphic to biological memory."
  7.  **Where it might misfire:** If the notebook contains contradictory entries written during a prior period of confusion. You are assuming the *content* is reliable because the *habit* is reliable.

  #### Case 2: The Woman with Early-Stage Dementia (Husband User)
  *Profile:* Husband answers before her. Her answers improve when he leaves.

  **ECAP Run:**
  1.  **Mapping:** Husband identified as primary support.
  2.  **Parity Filter (CRAP):**
      *   *Consistency:* Yes (Always together).
      *   *Retrieval:* **Fail.** He answers *before* she can. This is not retrieval; it is substitution.
      *   *Authorship:* **Fail.** She cannot validate his answers in real-time.
      *   *Proximity:* Yes.
      *   *Result:* **External Aid / Potential Contamination.**
  3.  **Statutory Test (With Husband):**
      *   *Communicate:* He speaks for her. **Fail.** (Cannot distinguish her voice from his).
  4.  **Statutory Test (Without Husband):**
      *   *Understand/Retain:* She improves. She can hold info for 5 minutes.
      *   *Weigh:* She expresses anxiety about contradicting him.
  5.  **Interest Check:** Husband wants her to move to care (reduces his burden). **Conflict Identified.**
  6.  **Verdict:** **Lacks Capacity (for complex decisions) / Fluctuating Capacity.**
      *   *Reasoning:* The husband cannot be a constituent because he fails the Retrieval and Authorship criteria (he substitutes rather than scaffolds) and has a Conflict of Interest. When removed, her internal capacity is insufficient for the complexity of the decision.
  7.  **Tribunal Defense:** "The spouse functioned as a proxy, not a prosthesis. The 'Improvement when alone' test demonstrates that the support was suppressing cognition, not extending it."
  8.  **Where it might misfire:** If she *actually* lacks capacity alone, but *with* him she makes a safe decision. The ECAP forces you to declare her incapacitous to protect her autonomy from his influence, potentially leading to a Best Interests decision that ignores the stability the marriage provides.

  ---

  ### Summary for the Tribunal

  When defending this procedure, do not cite Clark & Chalmers. Cite **Section 1(3) of the Mental Capacity Act**.

  *   **Argument:** "The law requires us to take practicable steps to help the person decide. For this patient, the notebook/spouse is not a 'help' in the sense of a wheelchair; it is a 'help' in the sense of a pair of glasses. To assess them without it is to assess a blind man in the dark and declare him blind."
  *   **The Caveat:** "However, where the support possesses independent agency (a human partner) or lacks reliability (battery/interest), the law requires us to isolate the individual's will to prevent coercion. In those cases, we revert to the internal standard."

  **Final Warning:** This protocol protects the *notebook user* (Engineer) but exposes the *spouse-dependent user* (Woman) to findings of incapacity. The Extended Mind Thesis is kinder to tools than to people. This is not a bug; it is the legal requirement of individual agency. You cannot extend the mind into another person's will without dissolving the legal subject.
