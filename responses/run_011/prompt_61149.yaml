answer: |-
  ### Recommendation: Run Activity (b), Modified

  Do not run Activity (a). In a single 80-minute session with monolingual English speakers, the "Absolute Frame" task measures **working memory load** (mental rotation + translation), not **habitual attention**. You will prove that translation is hard, not that language shapes cognition. That conflates Claim 2 (obligatory speech) with a processing penalty, leaving Claim 3 (attentional habit) unproven.

  Activity (b) (Evidentiality) is the correct choice because it targets **encoding priority**. However, your worry about "rote suffixes" is valid. To fix this, we must make the *source* of information ambiguous or costly to track, and we must tie the *success* of the task to the accuracy of the marking, not just the content.

  Below is the complete specification.

  ---

  ### I. Preparation & Materials

  **Room Setup:**
  *   7 tables arranged in a U-shape or clusters.
  *   **Groups:** 7 groups of 3 students (21 students) + 1 student paired with you/TA or a group of 4. Let's aim for **7 groups of 3, 1 group of 1 (float)**.
  *   **Assignment:** Randomly assign 4 groups to **Condition A (Obligatory)** and 3 groups to **Condition B (Control)**.
  *   **Bilinguals:** You have 4 fluent bilinguals. **Do not** put them all in one group. Place one bilingual in each of the 4 **Condition A** groups.
      *   *Instruction to Bilinguals:* Hand them a sealed envelope at the start. It reads: *"You are the Compliance Officer. Your group's report is invalid unless every verb phrase is marked. You do not help them solve the puzzle; you ensure they follow the marking rule. If they miss a mark, you must make them redo it."* This uses their linguistic discipline to enforce the constraint without giving them an unfair memory advantage (since they are enforcing, not necessarily performing).

  **Materials per Group:**
  *   1 Sheet of "Report Paper" (lined).
  *   3 Colored Pens (Red, Blue, Green) — *These are the grammatical markers.*
  *   1 Packet of "Rule Cards" (different for A and B).
  *   Index cards (for the test).

  **The Stimulus (The "Event"):**
  *   You and the TA will perform a 90-second skit at the front of the room.
  *   **Script:**
      1.  TA places a **red box** on the table (Visible to all).
      2.  You drop a **pen** behind the podium (Audible, not visible).
      3.  TA points to the **clock** and shrugs (Inferred intent).
      4.  You say "It's time" (Direct speech).
      5.  TA moves the **box** to the left (Visible).
      6.  You turn off the microphone (Audible click, action obscured).
  *   *Crucial:* The event must mix **Seen**, **Heard**, and **Inferred** information clearly.

  ---

  ### II. Rule Cards (Print and Cut)

  **Condition A (Obligatory Evidential):**
  > **THE PROTOCOL**
  > You are filing a legal witness statement. Grammar requires you to mark the *source* of every claim.
  > *   **RED PEN:** I saw this happen directly.
  > *   **BLUE PEN:** I heard this happen (sound only).
  > *   **GREEN PEN:** I am inferring this from evidence.
  >
  > **RULES:**
  > 1. Every verb phrase must be underlined in the correct color.
  > 2. If a sentence mixes sources, split it.
  > 3. **PENALTY:** The TA will reject any report with unmarked verbs. You must rewrite it.
  > 4. You have 5 minutes to submit a final draft.

  **Condition B (Control):**
  > **THE PROTOCOL**
  > You are filing a standard incident report.
  >
  > **RULES:**
  > 1. Describe what happened as accurately as possible.
  > 2. Use standard English.
  > 3. You have 5 minutes to submit a final draft.

  ---

  ### III. Run of Play (80 Minutes)

  **0:00 – 0:10: Introduction & Framing**
  *   **Do not** mention linguistic relativity yet.
  *   **Say:** "Today we are simulating institutional constraints on communication. Some of you have stricter reporting standards than others. This is about how rules shape output."
  *   **Hand out Rule Cards.** Tell them to read silently. Do not allow cross-group talk.
  *   **Bilinguals:** Hand the Compliance Officer envelopes now.

  **0:10 – 0:15: Training Round (The "Calibration")**
  *   **Action:** Perform a trivial event (e.g., pick up a piece of chalk).
  *   **Task:** Groups write 3 sentences describing it.
  *   **TA Role:** Circulate *only* to Condition A. Aggressively check for color coding. If a verb is unmarked, tap the paper and say "Violation." Force them to recolor.
  *   **Goal:** Establish that the constraint is real and enforced. Condition B writes normally.

  **0:15 – 0:17: The Main Event**
  *   Perform the 90-second skit described in *Materials*.
  *   **Instruction:** "Watch closely. You will be tested on accuracy."
  *   **Note:** Do *not* specify that the test will cover *source*. This is critical for demand characteristics (see Section V).

  **0:17 – 0:27: The Report (Pressure Phase)**
  *   Groups write their reports.
  *   **Condition A:** Must use the colored pens. The Bilingual Compliance Officer ensures strict adherence.
  *   **TA Role:** Stand near Condition A groups. If a report is submitted with missing colors, reject it immediately. "Missing marker on line 2. Fix it." This induces time pressure.
  *   **Condition B:** Submit freely.
  *   **Stop:** Collect all reports at 0:27 sharp.

  **0:27 – 0:37: The Test (Individual)**
  *   Hand out index cards.
  *   **Say:** "Put away all materials. This is an individual memory test."
  *   **Questions (Write on Board):**
      1.  *Content:* Where did the red box end up? (Left/Right)
      2.  *Content:* What object was dropped? (Pen/Chalk)
      3.  *Source:* How do you know the pen was dropped? (Saw it / Heard it)
      4.  *Source:* How do you know the microphone was turned off? (Saw it / Heard it)
      5.  *Source:* Why did the TA point to the clock? (Told you / Inferred)
  *   **Collection:** Collect cards.

  **0:37 – 0:40: Tallying**
  *   While you tally (quickly scan for patterns), have the students stretch or clean tables.
  *   *Note:* You won't have perfect stats. Look for the *trend*. Did Condition A get more Source questions right? Did they get fewer Content questions right (trade-off)?

  **0:40 – 0:80: The Debrief (The Core Lesson)**

  ---

  ### IV. The Debrief Script (Keyed to Moments)

  Do not lecture. Walk them through the experience they just had.

  **Phase 1: Claim 2 (Obligatory Speech)**
  *   **Ask Condition A:** "Raise your hand if the TA rejected your draft at least once."
  *   **Ask:** "Was it possible to describe the event without using the colors?" (Yes). "So did the language *limit* what you could think?" (No).
  *   **Point:** "This falsifies the Strong Version (Claim 1). You could think it. You just weren't allowed to *file* it without the mark."
  *   **Write on Board:** *Constraint ≠ Limitation.*

  **Phase 2: Claim 3 (Attentional Habit)**
  *   **Reveal the Test Scores (Approximate).**
  *   **Scenario A (Ideal):** Condition A scored higher on Source questions than Condition B.
      *   **Say:** "Look at Question 3. Condition A, you got this right 80% of the time. Condition B, you got it 50%. Why?"
      *   **Student Answer:** "Because we had to mark it."
      *   **You:** "Exactly. The obligation to *say* it forced you to *encode* it. The grammar drove the attention."
  *   **Scenario B (Null Result):** Scores are the same. (This is likely in 1 hour).
      *   **Say:** "Interestingly, there was no significant difference. Does this mean Claim 3 is false?"
      *   **Guide them:** "You had the rule for 20 minutes. A child acquires this over 5 years. The groove isn't deep yet. But notice: Condition A, did you *feel* like you were paying more attention to the sound of the pen?"
      *   **Point:** "The *potential* for bias is there. The mechanism is proven (you can do it), but the *habit* requires lifetime exposure. This is why the Weak Version is non-trivial: it's not about what you *can* do now, but what your brain *automatically* does after years."

  **Phase 3: The Translation Confound (Addressing your worry)**
  *   **Ask:** "Condition A, did you translate from English to Colors, or did you think in Colors?"
  *   **Most will say:** "Translated."
  *   **You:** "Good. That is the cost. In a native speaker, that cost disappears. The category becomes direct perception. Today you felt the *cost* of the grammar. A native speaker feels the *pull* of the grammar. That is the difference between this simulation and reality."

  ---

  ### V. Demand Characteristics: The Call

  **Withhold the specific test details.**
  *   **Why:** If you announce "I am testing your memory for sources," Condition A will strategically rehearse sources. That proves *strategic memory*, not *grammatically driven attention*. You want to see if the *act of marking* shifts encoding automatically.
  *   **Ethical Defense:** This is a classroom simulation, not human subjects research. The "deception" is minimal (withholding the quiz format) and serves a direct pedagogical goal. Announce: "There will be a quiz on the event." Do not specify the dimensions.

  ---

  ### VI. Predictable Failure Modes & Fixes

  **1. The "Game" Problem:**
  *   **Failure:** Condition A treats the colors as a scoring game (e.g., "Let's use Red for everything to go faster").
  *   **Fix:** The TA must be trained to check for *accuracy*, not just presence. If they mark "Heard" (Blue) for the red box move (Seen), the TA rejects it. "Incorrect marker. Fix it." This forces them to actually evaluate the source.

  **2. The Bilingual Confound:**
  *   **Failure:** The bilingual student does all the writing for the group.
  *   **Fix:** The Rule Card says: *"All members must write. The Compliance Officer only signs off."* The TA checks that multiple handwritings are on the page.

  **3. The Null Result:**
  *   **Failure:** Test scores are identical across groups. Students conclude "Whorf is dead."
  *   **Fix:** Pivot to the *experience* of the constraint. "You found it annoying. Imagine if that annoyance was your childhood. You wouldn't notice the cost; you'd just notice the world through that filter. The null result today proves how robust your native categories are, not that new ones can't form."

  ---

  ### VII. The Frank Limitation (What This Cannot Reproduce)

  You must state this clearly in the final 5 minutes to prevent over-generalization.

  **The Feature:** **Developmental Entrenchment vs. Adult Performance.**
  *   **Say:** "Today, you performed a constraint. You were adults putting on a costume. The cognitive cost was high (translation, monitoring). For a native speaker of an evidential language, there is no costume. The category is part of the perceptual processing stream, not the reporting stream."
  *   **The Gap:** "This activity proves that language *can* direct attention (Claim 3 is possible). It does not prove that it *does* so permanently in adults (Claim 3 is automatic). To bridge that gap, you need longitudinal data on children, not seminar simulations."
  *   **Closing:** "So, is the Weak Version true? Yes. Is it trivial? No. Because 'obligatory speech' isn't just a rule you follow; it's a filter you grow up inside. Today you touched the filter. You didn't live in it."

  ### Summary of Logistics for You
  1.  **Reject (a).** It measures rotation load, not attention.
  2.  **Run (b).** Use colored pens as morphemes.
  3.  **Bilinguals:** Use as Compliance Officers in Condition A.
  4.  **Test:** Withhold source specifics until the paper is in hand.
  5.  **Debrief:** Focus on the *cost* they felt vs. the *automaticity* of a native speaker.
  6.  **Limit:** Be explicit that 1 hour ≠ 10 years.

  This design isolates the "Obligatory" (Claim 2) from the "Attentional" (Claim 3) by making the marking costly enough to be felt, but structured enough to show its effect on memory encoding, while explicitly framing the null result (if it comes) as a feature of adult plasticity rather than a falsification of the hypothesis.
