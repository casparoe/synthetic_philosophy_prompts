      *   **Common Ground:** Same empirical facts (behavior/neuro), agree suffering is bad, agree more suffering is worse.
      *   **Key Symptom:** Ambiguity in what the numbers mean (magnitude of experience vs. confidence in existence vs. indicator count).
      *   **User's Hypothesis:** It's a verbal dispute about the word "sentience." Fixing definitions solves it.
      *   **Task:** Diagnose the *type* of argument (verbal, substantive, bedrock, ill-posed, etc.), propose what counts as progress, assess confidence/uncertainty, and critique the framing if necessary.
      *   **Constraint:** Be straight about confidence, avoid verdicts on who is right, avoid reading lists.

  2.  **Deconstruct the Dispute:**
