      *   Since it's not just verbal, defining terms won't fix it.
      *   Progress requires **Decoupling the Variables**.
      *   Split the column into:
          1.  Probability of Sentience ($P$).
          2.  Capacity/Intensity Factor ($C$).
      *   Force Camp B to assign $C=1$ for all sentient beings. Force Camp A to assign varying $C$.
      *   Then argue about $C$. If they still fight, it's axiological (bedrock). If they stop fighting, it was metric confusion.
      *   Alternatively, change the question: Instead of "weight per subject," ask "cost per unit of welfare change."

