      *   *Progress:* Don't define "sentience." **Disaggregate the column.** Separate $P(\text{Sentience})$ from $\text{Intensity Multiplier}$.
      *   *Confidence:* 80% on the metric diagnosis. 60% on the axiological depth (could be epistemic).
