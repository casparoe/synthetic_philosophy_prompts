          *   *Modern Map:* $c$ is capital stock/investment in automation. $v$ is wage bill. $s$ is profit/markup surplus.
          *   *Issue:* Marx defines $c$ and $v$ in *value* terms (labor time embodied), not price terms. Modern macro uses prices.
