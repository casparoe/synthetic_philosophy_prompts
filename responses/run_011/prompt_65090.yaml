      *   *Surplus Value/Variable Capital:* Variable Capital ($v$) = Wage Bill. Surplus Value ($s$) = Profits + Rent + Interest (Net Operating Surplus). *Crucial:* In Marx, $s$ originates *only* from the gap between value created by $L$ and cost of $L$. In Neo, $s$ is return to $K$ + Markups.
      *   *General Intellect:* This is the stock of nonrival knowledge ($A$). But specifically, it's knowledge *embodied* in the machine system that makes direct labor marginal.
      *   *Collapse of Value Form:* If $L \to 0$, Labor Share $\to 0$. In Neo, prices adjust. In Marx, if value = labor time, and labor time $\to 0$, then *Value* $\to 0$ even if Use Values ($Y$) $\to \infty$. Price (money expression of value) loses its anchor.

