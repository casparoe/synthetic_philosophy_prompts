          *   Translation: Vol 3 = Falling Labor Share putting pressure on Markups/Investment. Grundrisse = Labor Share $\to 0$, making demand realization impossible (who buys the goods?).
          *   Verdict: Historian is right. It's a phase shift. Low automation = Vol 3 dynamics. High automation = Grundrisse dynamics.

  5.  **Addressing the User's Suspicion (The Verdict):**

      *   *Suspicion:* Without LTV, it's just Endogenous Growth + Distribution.
      *   *Critique:* This is mostly true *mathematically*, but fails *structurally* on two points:
          1.  **Realization/Demand:** Neo models (Solow/Ramsey) assume Say's Law (supply creates demand). Marx's collapse is often about *realization* (profits cannot be realized if workers have no income). If Labor Share $\to 0$, who consumes? Neo says Capitalists consume/invest. Marx says there's a limit to investment if consumption demand is absent.
          2.  **The Numéraire:** Neo uses Goods or Utility. Marx uses Labor Time. If $L \to 0$, Neo says $Y \to \infty$, Welfare $\to \infty$. Marx says the *social relation* (value) breaks.
          3.  **Power vs. Productivity:** Neo treats factor shares as marginal products. Marx treats them as class struggle/outcomes of power. A productivity gain that lowers wages (bargaining) vs. one that lowers prices (tech) is distinct in Marx, often conflated in Neo.
      *   *The "Cost paid by someone but never appears in price":* This refers to exploitation (unpaid labor). In Neo, $w = MPL$. If $w < MPL$, it's a markup/friction. In Marx, it's the definition of the system.
      *   *Aggregate Capital:* Cambridge Critique point. Marx knows $K$ is heterogeneous values. Neo assumes homogeneous $K$. This breaks the translation of OCC.

  6.  **Refining the Tone:**
      *   Must be peer-to-peer (PhD level).
      *   Avoid apologetics or dismissal.
      *   Be precise about where the frameworks diverge ontologically, not just algebraically.
      *   Acknowledge the Cambridge Capital Controversy (CCC) relevance since the user mentioned it.

  7.  **Step-by-Step Plan:**
