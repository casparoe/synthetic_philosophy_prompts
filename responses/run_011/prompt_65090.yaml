          *   *Key Friction:* Neoclassical says $K$ and $L$ both produce output. Marx says only $L$ produces *value* ($s$), $K$ transfers value.

      *   **Marx *Grundrisse* (Fragment on Machines/General Intellect):**
          *   *Core Mechanism:* Knowledge/Objectified Intellect becomes the main productive force. Direct labor time becomes negligible.
          *   *Consequence:* Value (based on labor time) becomes a "wretched foundation." Exchange value production collapses.
          *   *Modern Map:* Nonrival knowledge ($A$) in production function $Y = A F(K, L)$. If $L \to 0$ (fully automated), what happens to factor shares? If $L$ is negligible, Labor Share $\to 0$. But if Value depends on $L$, Value $\to 0$ while Wealth ($Y$) $\to \infty$.
          *   *Key Friction:* Modern macro assumes prices exist regardless of $L$ share. Marx says the *form* of value breaks.

      *   **The User's Suspicion:** Is it just Endogenous Growth + Distribution?
      *   **The Historian's Claim:** Vol. 3 and *Grundrisse* are consistent.

