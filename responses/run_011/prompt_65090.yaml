      *   *Worry 2: Offsetting Influences vs. Comparative Statics.*
          *   Marx's offsets: Cheapening elements of constant capital, increasing intensity, foreign trade, etc.
          *   Neo equivalents: TFP growth (cheapens $K$), Labor supply shocks (increases $s/v$), Globalization.
          *   Residue: They look similar mathematically ($\partial r / \partial X$). But the *causal mechanism* differs. Neo: $r$ falls due to diminishing returns. Marx: $r$ falls due to source of surplus shrinking relative to capital mass.
          *   Verdict: Translates with distortion. The math is isomorphic, the ontology is not.

      *   *Worry 3: Consistency (Vol 3 vs. Grundrisse).*
          *   Vol 3: Capitalism survives but with crises (profit rate falls, offsets apply).
