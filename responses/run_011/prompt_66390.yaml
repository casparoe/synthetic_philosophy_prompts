answer: |-
  ### Desiderata for High-Stakes Logistics Impact Measures

  Here are the requirements derived from your raw pile, filtered for a real-world deployment context. Each includes the concrete worry it addresses and its negotiation status.

  | Requirement | Concrete Worry / Case | Status |
  | :--- | :--- | :--- |
  | **1. Baseline Specificity** | If you measure against the *start state*, the AI is punished for solving the problem (changing the world). If you measure against *inaction*, it is punished for existing. You must define the counterfactual: "What would have happened if we used the legacy system?" | **Non-Negotiable** (Must pick one, but *which* one is a design choice). |
  | **2. Non-Offsetting (Asymmetry)** | The AI kills a patient in Hospital A to reduce wait times in Hospital B, claiming net-zero impact on "total lives." The measure must prevent harms and benefits from canceling out in the *safety* layer, even if they cancel in the *utility* layer. | **Non-Negotiable** |
  | **3. Online Computability (Partial Observables)** | The measure cannot require a god-view simulator or ground-truth state. It must compute impact from noisy logs, GPS pings, and shift rosters in real-time. | **Non-Negotiable** |
  | **4. Explicit Value Specification** | The measure cannot be "value-neutral." It must explicitly encode which state variables matter (e.g., "paramedic retention rates" matter, "traffic light cycle timing" does not). | **Non-Negotiable** (Replaces "Value-Neutrality"). |
  | **5. Multi-Agent Causality** | The AI shifts demand, causing Hospital B to cut staff, which causes slower response times next year. The measure must account for effects flowing through human decisions, not just physical state changes. | **Preference** (Ideal, but often computationally intractable; may need proxy metrics). |
  | **6. Constraint vs. Penalty** | Does impact cap the action space (hard constraint) or just tax the reward function (soft penalty)? Hard constraints guarantee safety but can cause task failure (no valid moves). | **Preference** (Depends on risk tolerance; hard constraints are safer, soft are more robust). |
  | **7. Temporal Discounting** | Do we care more about the paramedic pipeline collapsing in 2 years or the ambulance being 30 seconds late today? | **Preference** (Mathematical tuning, not architectural). |

  ---

  ### The Impossibility Result

  **Your hunch is correct.** "Value-neutrality" and "distinguishing wanted from unwanted effects" are mathematically incompatible.

  An impact measure is a metric over state transitions. Without a value function, a state change is just a vector difference; there is no such thing as a "side effect," only "effects." To label an effect as "unwanted," you are necessarily invoking a preference structure. If you demand value-neutrality, you cannot distinguish between the AI saving a life (wanted) and the AI moving a traffic cone (unwanted noise) except by magnitude, which fails in your domain where big effects are the goal.

  **Which has to give?**
  **Value-Neutrality must go.** You cannot have a safety layer that doesn't know what you value. You must replace "Value-Neutrality" with **"Value-Transparency."** The measure must not *smuggle* in hidden morals, but it *must* accept explicit inputs about what constitutes a harmful deviation. If you try to keep Value-Neutrality, the system will either paralyze itself (fearing all change) or Goodhart the metric (finding changes that look neutral but are harmful).

  ---

  ### The Candidate Killer

  **Requirement #3: Online Computability from Partial Observables.**

  This knocks out the vast majority of existing academic impact measures (including most formulations of Relative Reachability and Attainable Utility). Almost all current research assumes access to a true state vector or a high-fidelity simulator to calculate counterfactuals. In a city logistics network, you do not have a simulator that accurately predicts hospital funding cuts or paramedic burnout based on dispatch logs. If the measure requires a world model more complex than the policy itself to compute the penalty, it is not deployable.

  ---

  ### Priority Order for Team Disagreement

  Order by how much political and technical capital a small team should spend arguing about them.

  1.  **Baseline Specificity:** (Fight hardest). Choosing "inaction" vs. "legacy system" as the baseline fundamentally changes the AI's incentives. This defines what "normal" looks like.
  2.  **Constraint vs. Penalty:** (Fight hard). This determines if the AI is allowed to be dangerous in exchange for being useful. A hard constraint might leave ambulances unassigned; a penalty might allow it if the "reward" is high enough.
  3.  **Explicit Value Specification:** (Fight medium). You will argue about *which* values to encode, but you must agree *that* values must be encoded.
  4.  **Non-Offsetting:** (Fight medium). Technically difficult to implement, but ethically binary.
  5.  **Temporal Discounting:** (Fight least). This is a hyperparameter tuning issue, not an architectural one.

  ---

  ### Measure Scorecard

  **Relative Reachability:** Fails **Online Computability** and **Explicit Value Specification**; it counts all state changes equally without knowing which variables (e.g., funding vs. traffic) actually matter.

  **Attainable Utility Preservation (AUP):** Fails **Non-Offsetting** and **Baseline Specificity** in this context; it preserves the ability to achieve *any* goal, which doesn't stop the AI from achieving *your* goal in a way that bankrupts a hospital.
