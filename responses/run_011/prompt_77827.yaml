      "M.K. is the wedge we've waited for," the Block-style theorist said. "Functional access intact—she reasons, reports, holds information—but the lights are off. She says nothing appears. No ignition signature confirms it. This is access consciousness severed from phenomenal consciousness."

      The Global Workspace theorist shook her head. "If she reasons 'press the red one', that information is available to multiple systems—memory, motor planning, verbal report. That *is* broadcast. If there's no frontoparietal ignition, your neural markers are missing the signal, or her reasoning isn't what you think."

      "But she denies experience," Block insisted. "Confidently. If ignition equals consciousness, she should report seeing red. She reports data arrival without seeing."

      "To report 'I don't see' is itself a conscious judgment," Workspace countered. "She accesses the fact of her own blindness. That meta-cognitive state requires global availability. You can't have a confident denial without the workspace lighting up to support that belief."

      Block paused. "I'll concede the report itself requires access. The verbalization is accessed. But the *content* of that report is the absence of phenomenology. The information is available for use, but not felt. The ignition you seek might be the correlate of reporting, not the experience itself."

      "Then what is 'available for use'?" Workspace pressed. "If I can hold 'red' in working memory for minutes and use it to infer 'press button', that information is globally poised. That's my definition of conscious access. If you say it's unconscious, you're stretching 'unconscious' to include sustained reasoning."

      "I'm distinguishing the role it plays from what it's like," Block said. "M.K. shows the role can be filled without the 'what it's like'."

      "Here's the friction," Workspace said. "If the occipitotemporal response decays fast, how does she hold it for minutes? Working memory requires sustained firing. If that firing isn't frontoparietal, where is it? If it *is* frontoparietal but you missed it, then ignition exists. If it isn't, then she isn't holding it consciously."

      "Maybe the holding is local but accessible?" Block suggested.

      "Then 'accessible' is doing all the work," Workspace said. "Look, I'll concede this: if the neural data is solid—no widespread synchronization—then our map of ignition is wrong. Maybe broadcast can be subtle. But if she truly reasons, linking shape to action over time, that looks like workspace activity."

      Block nodded slowly. "And I'll concede this: my evidence for missing phenomenology is her report. But reports are access. I'm using access to prove the lack of phenomenology. If she's wrong about her experience, my case collapses. I'm trusting her introspection as infallible, which is risky."

      "Exactly," Workspace said. "Maybe she experiences something but lacks the concept to describe it, so she says 'nothing'. Or maybe 'reasoning' here is just rigid associative chaining, not flexible inference. If it's rigid, it could be unconscious."

      "Then we're redescribing the case," Block said. "Either the reasoning is shallow, or the neural data is incomplete, or her introspection is flawed. If all three hold as stated—deep reasoning, no ignition, no experience—the case might be incoherent. You can't have global availability without the network that supports global availability."

      "Or," Workspace added, "you can't have a confident judgment about absence without the presence of the judging mechanism. The denial proves the workspace is active, even if the sensory qualia aren't."

      "So M.K. isn't Access without Phenomenal," Block mused. "She's Access without *Sensory* Phenomenal, but with *Cognitive* Phenomenal? The judgment itself feels like something."

      "Now we're just splitting hairs," Workspace smiled. "If the judgment feels like something, consciousness is present. The wedge dissolves."

      "Unless the judgment feels like nothing too," Block said. "A zombie judgment."

      "Then how do you know?" Workspace asked. "You're back to trusting the report."

      "Fair," Block said. "The case forces us to admit we measure consciousness by report, but define it by something else. M.K. breaks the link between the measure and the definition."

      "Or," Workspace concluded, "she shows that report and reasoning don't require what you call phenomenology. They just require information flow. If so, I win, because that flow is my consciousness."

      "And if that flow feels like nothing?" Block asked.

      "Then consciousness is nothing," Workspace said. "Which is a verdict neither of us wants."

      Verdict: Neither — The case description likely conflates distinct cognitive processes.

