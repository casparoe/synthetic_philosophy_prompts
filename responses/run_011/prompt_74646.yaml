  # MEMORANDUM OF PARTIAL CONVERGENCE
  **Subject:** Criteria for the Classification of Pseudohistory
  **Parties:** Proponent A (Content-Based Account) and Proponent B (Practice-Based Account)
  **Date:** [Current Date]

  ## 1. Shared Claims
  *The following propositions are endorsed by both parties. Where the justification for endorsement differs between the Content-Based and Practice-Based accounts, the specific description under which each party signs is noted in parentheses.*

  1.  **On Fomenko's New Chronology:** The New Chronology is factually false and warrants the classification of pseudohistory.
      *   *(Proponent A signs under the description: "The theory employs logical structures that immunize it against disconfirmation.")*
      *   *(Proponent B signs under the description: "The enterprise has withdrawn from competent scrutiny and relies on a non-specialist constituency.")*
  2.  **On Newton's Amended Chronology:** Isaac Newton's revision of ancient chronology (regarding the Argonautic expedition, Trojan War, and founding of Rome) is substantially wrong but does not warrant the classification of pseudohistory.
      *   *(Both parties sign under the description: "The error resulted from engagement with available evidence and remained open to correction by that evidence, without recourse to conspiratorial explanation for counter-data.")*
  3.  **On Hardouin's Forgery Claim:** Jean Hardouin's claim that most Greek and Roman texts were forged by monks, supported by a promise of proof in a posthumous letter that never materialized, warrants the classification of pseudohistory (or an equivalent epistemic defect).
      *   *(Proponent A signs under the description: "The claim posits a hidden reality that cannot be tested within the claimant's lifetime, rendering it unfalsifiable.")*
      *   *(Proponent B signs under the description: "The claim explicitly defers scrutiny to a point where the claimant is unavailable to answer objections, constituting a withdrawal from accountability.")*
  4.  **On the Role of Conspiracy:** In the New Chronology, the allegation of a global conspiracy among chronologists functions to explain away the discrepancy between the theory's predictions and established dating methods.
      *   *(Both parties sign under the description: "The conspiracy claim resolves contradictions that would otherwise threaten the theory's coherence.")*
  5.  **On the Migration of Venue:** Fomenko and his collaborators initially published in refereed venues but subsequently shifted to mass-market books targeting readers unable to verify the mathematics.
      *   *(Both parties sign under the description: "This shift correlates with a decrease in direct engagement with competent critics and an increase in popular support.")*

  ## 2. Residual Disagreements
  *The following table outlines the divergent explanations for the shared verdicts. Each formulation is phrased to be acceptable to its proponent.*

  | Issue | Proponent A (Content-Based) Formulation | Proponent B (Practice-Based) Formulation | Neutral Description |
  | :--- | :--- | :--- | :--- |
  | **The Defining Marker** | Pseudohistory is defined by the **inferential structure** of the claims, specifically the capacity to absorb any disconfirming result without revision. | Pseudohistory is defined by the **sociological organization** of the enterprise, specifically the withdrawal from a community competent to correct it. | The primary criterion used to distinguish pseudohistory from merely false history. |
  | **The Conspiracy Element** | The conspiracy hypothesis is a **necessary logical component** that renders the theory immune to refutation by re-interpreting counter-evidence as fabrication. | The conspiracy hypothesis is a **rhetorical tool** used to maintain audience loyalty when the enterprise can no longer sustain peer scrutiny. | The functional role of conspiratorial explanations within the theory. |
  | **The Boundary Condition** | A theory is pseudohistorical if its **internal logic** precludes the possibility of its being proven wrong, regardless of the author's social conduct. | A theory is pseudohistorical if its **proponents evade correction**, regardless of whether the internal logic is theoretically testable. | The condition under which a false historical claim crosses the threshold into pseudohistory. |

  ## 3. The Cruxes
  *Settling the following sub-questions would require at least one party to revise their account.*

  1.  **The Locus of Immunity:** Is immunity to refutation an intrinsic property of a set of claims (Content), or is it a disposition of a community toward those claims (Practice)?
      *   *Resolution Condition:* If a claim is logically immune but the author submits it to rigorous testing and accepts falsification, does it remain pseudohistorical?
  2.  **The Direction of Causality:** Does the conspiratorial element do independent logical work to protect the theory (Content), or is it a downstream symptom of an audience structure that demands the theory cannot be wrong (Practice)?
      *   *Resolution Condition:* If a theory is presented to a competent audience without conspiracy claims, but those claims are added only after the audience shifts to laypeople, is the pseudohistory present in the first stage or the second?
  3.  **The Priority of Classification:** If the Content and Practice indicators diverge (e.g., rigorous logic within a closed cult, or sloppy logic within an open academy), which indicator determines the label?
      *   *Resolution Condition:* We must determine whether the term "pseudohistory" is primarily an epistemic warning or a sociological warning.

  ## 4. Test Cases and Predictions
  *For each case, the classification predicted by each account is recorded, along with an assessment of whether agreement is reached and whether the outcome represents a cost or a feature of the account.*

  | Case Description | Proponent A (Content) Classification | Proponent B (Practice) Classification | Do Accounts Part Company? | Cost or Feature? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Penitent Researcher**<br>A lone researcher advances a claim structurally indistinguishable from Fomenko's (logically immune). They are competently refuted and abandon the claim. | **Pseudohistorical.** The structure of the claim itself possesses the defect of immunization, regardless of the author's subsequent honesty. | **Not Pseudohistorical.** The researcher engaged with the community, accepted correction, and withdrew the claim. This is scientific behavior. | **Yes.** | **For A:** Feature (maintains objective standard of reasoning).<br>**For B:** Cost (labels a self-correcting actor as a pseudohistorian). |
  | **2. The Insulated Program**<br>A credentialed, well-funded program inside an established discipline treats core assumptions as immune to risk, treats anomalies as contamination by default, and rewards members independently of accuracy. | **Not Pseudohistorical.** Provided the claims are *in principle* testable and no conspiracy is alleged to explain anomalies, this is dogma or bad science, not pseudohistory. | **Pseudohistorical.** The social organization prevents scrutiny and rewards insulation. The community has withdrawn from the corrective mechanism of the wider discipline. | **Yes.** | **For A:** Cost (fails to label a socially pathological enterprise that mimics pseudohistory).<br>**For B:** Feature (captures the harm done by institutional insulation). |
  | **3. The Ancient Astronauts**<br>Literature where the case for logical immunization is weaker (claims are often vague) but the case for audience capture is stronger (revenue depends on belief). | **Borderline/Unclear.** If the claims are not strictly immune but merely unsupported, the Content account may struggle to classify it as pseudohistory rather than speculation. | **Pseudohistorical.** The enterprise draws credibility and revenue from a constituency that no refutation reaches, regardless of the logical tightness of the claims. | **Yes (on reasoning).** | **For A:** Cost (may let socially predatory claims escape the label).<br>**For B:** Feature (identifies the exploitation of the audience as the primary harm). |

  ## 5. Statement of Verbal and Genuine Dispute

  **Verbal Dispute:**
  A portion of our disagreement is verbal, stemming from the definition of the term "pseudohistory."
  *   **Proponent A** is answering the question: *"What is the epistemic status of the reasoning employed?"*
  *   **Proponent B** is answering the question: *"What is the sociological relationship between the claimant and the competent community?"*
  To the extent we are using the same label to answer different questions, we are talking past one another. If we agreed to distinguish "Epistemically Defective History" (A) from "Socially Insulated History" (B), roughly 40% of our disagreement would dissolve.

  **Genuine Dispute:**
  Once the verbal portion is subtracted, a genuine contest remains regarding **normative priority**. We disagree on which defect is more dangerous and therefore deserves the stigmatizing label of "pseudohistory."
  *   **Proponent A** maintains that logically immune reasoning is the primary danger because it corrupts the truth-seeking process itself, even if the author is well-meaning.
  *   **Proponent B** maintains that social insulation is the primary danger because it allows false claims to persist and monetize regardless of their logical structure, corrupting the public's access to expertise.

  **Residual Question:**
  If we must apply a single label to guide public understanding, which criterion trumps? Is it worse to be logically wrong in a way that cannot be corrected (A), or to be socially protected from correction regardless of logical form (B)? This document records that we have not settled this hierarchy.
