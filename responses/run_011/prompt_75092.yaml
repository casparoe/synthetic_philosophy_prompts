answer: |-
  ### 1. Sequence and Timing (45 Minutes)

  **0:00–0:05 | Introduction & Distinction from Arrow**
  *   **Action:** Write "Arrow" on the far left, "Sen" on the far right.
  *   **Content:** Briefly state that Arrow asked, "Can we aggregate preferences consistently?" Sen asks, "Can we respect rights and efficiency consistently?"
  *   **Reason:** First-years conflate the two. You must separate the *aggregation problem* (Arrow) from the *rights/efficiency conflict* (Sen) immediately to prevent them from trying to map Dictatorship onto Liberalism.
  *   **Social Ranking:** Establish now that we are building a *social ordering* ($xPy, yPz...$), not just picking a winner. Write "Social Ordering" at the top center. If they think we are just choosing a policy, the cycle looks like a tie; if they see it as an ordering, the inconsistency is logical.

  **0:05–0:15 | The Example & "Decisiveness" (Earned, not Defined)**
  *   **Action:** Draw the three states ($x, y, z$) in a triangle.
  *   **Content:** Use your Shared Flat example.
      *   $x$: Radiator On, Music Off.
      *   $y$: Radiator Off, Music Off.
      *   $z$: Radiator Off, Music On.
  *   **Decisiveness:** Do not give a formal definition yet. Say: "A has the right to decide the Radiator when Music is Off." Ask the class: "If A prefers $x$ to $y$, what must the social ranking say?" When they answer "$x$ is socially better than $y$," *then* write on the board: **"Decisive = Individual preference dictates Social ordering."**
  *   **Reason:** Defining it abstractly first kills engagement. Earning the definition through the mechanism of the example ensures they understand the *power* of the condition before seeing the paradox.

  **0:15–0:30 | Deriving the Cycle (The Core)**
  *   **Action:** Fill in the preferences and draw the arrows.
  *   **Sequence:**
      1.  **Liberalism (A):** A prefers $x$ to $y$ (wants heat). Mark arrow $x \to y$.
      2.  **Liberalism (B):** B prefers $y$ to $z$ (wants quiet). Mark arrow $y \to z$.
      3.  **Pareto:** Both prefer $z$ to $x$ (Both prefer "Cold/Loud" to "Hot/Quiet"—explain why: perhaps A likes loud music, B hates heat). Mark arrow $z \to x$.
  *   **Content:** Highlight the cycle: $xPy, yPz, zPx$.
  *   **Reason:** This is the visual proof. The cycle must be on the board before you discuss *why* it happened. The visual impossibility (a loop) cements the "inconsistency" point before they try to solve it.

  **0:30–0:40 | Misconception Management (Discussion)**
  *   **Action:** Move to the right side of the board.
  *   **Content:** Address the four key misconceptions (detailed in Section 3).
  *   **Reason:** Now that they have seen the logic, they will instinctively try to break it. Use their objections to clarify the conditions.

  **0:40–0:45 | Closing Check**
  *   **Action:** Erase the preferences, keep the states and rights.
  *   **Content:** Present the "Safe Scenario" (detailed in Section 4).
  *   **Reason:** Tests if they understand *which* condition drives the paradox, rather than just memorizing the result.

  ---

  ### 2. Testing the Example

  **Verdict:** Your "Shared Flat" example is **not fatal**, but it requires precise tuning to avoid the "conjured trick" impression.

  **The Worry:** You fear the Pareto leg ($z$ vs $x$) will look contrived because it requires A to care about Music and B to care about the Radiator (nosiness).
  **Analysis:** This worry is actually the *point* of the theorem, but it must be framed correctly. The theorem does not say "Nosiness causes paradox." It says "If we allow *any* preferences (Unrestricted Domain), including nosy ones, Rights and Pareto clash." If you sanitize the preferences to be purely self-regarding, the paradox disappears, and students will think the theorem is weak.
  **Requirement:** The example *must* have nosy preferences to work. You cannot remove them.
  **Fix:** Do not hide the nosiness; **flag it as a feature of Unrestricted Domain.**
  *   *Adjustment:* When setting up the Pareto leg ($z$ vs $x$), explicitly say: "For the Pareto principle to apply here, A must prefer $z$ (Music On) to $x$ (Music Off). Yes, A is nosy. Sen's theorem says we cannot ban A from being nosy if we accept Unrestricted Domain."
  *   *Why this works:* It shifts the blame from "absurd preferences" to "the constraint of Unrestricted Domain." It forces them to choose: Ban nosiness (restrict Domain) or Accept Paradox.

  **Proposed Preference Structure (for the Whiteboard):**
  *   **A (Heat-lover, Music-lover):** Prefers $x$ (Hot/Quiet) > $y$ (Cold/Quiet). Prefers $z$ (Cold/Loud) > $x$ (Hot/Quiet).
  *   **B (Cold-lover, Quiet-lover):** Prefers $y$ (Cold/Quiet) > $z$ (Cold/Loud). Prefers $z$ (Cold/Loud) > $x$ (Hot/Quiet).
  *   **Rights:** A decides $x/y$ (Heat). B decides $y/z$ (Music).
  *   **Result:** $xPy$ (A's Right), $yPz$ (B's Right), $zPx$ (Pareto). Cycle.

  ---

  ### 3. The Misconception Map

  | Misconception | When to Head Off | How to Handle It |
  | :--- | :--- | :--- |
  | **"This is just Arrow's Theorem."** | **0:05 (Intro)** | Explicitly state: "Arrow bans a Dictator. Sen bans a Liberal. Arrow is about voting rules; Sen is about rights." |
  | **"Liberal means political liberalism."** | **0:10 (Setup)** | When introducing "Decisive," say: "Here, 'Liberal' doesn't mean left-wing. It means 'sovereign over a specific pair of outcomes'." |
  | **"It's a trade-off (Rights vs. Efficiency)."** | **0:25 (Cycle)** | When the cycle appears, say: "This isn't a balance. We can't have *both*. It is a logical inconsistency, like $1=2$." |
  | **"Fix: Ban meddlesome preferences."** | **0:35 (Discussion)** | **Concede this is a solution, but name the cost.** Say: "You are right. If we ban nosy preferences, the cycle breaks. But that violates **Unrestricted Domain**. The cost is that the theory no longer applies to real humans, who are often nosy." |
  | **"Rights aren't preferences."** | **0:35 (Discussion)** | **Let this surface.** Since two students warned you, they will raise it. Do not front-load it (makes you defensive). When they raise it: "Excellent point. You are attacking the *model*, not the *math*. The theorem says: IF rights are modeled as preferences, THEN paradox. Your objection is that we shouldn't model rights that way. That is a valid philosophical critique, but it accepts the theorem's logic." |

  **Advice on the "Rights as Preferences" Objection:**
  Let it surface during the discussion phase (Minute 30+). If you front-load it, you turn the seminar into a meta-ethical debate about ontology. If they raise it, it validates their critical engagement. Your response must be: "You have identified the limit of the *economic model* of rights. Sen accepts this cost to show the logical tension. You are arguing we should change the inputs; Sen is showing what the inputs imply."

  ---

  ### 4. Closing Check (Last 5 Minutes)

  **The Task:** Present a "Safe Configuration."
  **Setup:** Keep the same Flat, same Rights (A decides Heat, B decides Music), same States ($x, y, z$).
  **Change:** Alter the preferences so they are **purely self-regarding**.
  *   A prefers $x$ (Hot) > $y$ (Cold). A *doesn't care* about Music ($x \sim z$).
  *   B prefers $y$ (Quiet) > $z$ (Loud). B *doesn't care* about Heat ($y \sim x$).
  *   Pareto: Is there a unanimous preference? No.
  **Question to Class:** "Draw the social ordering. Is there a cycle? If not, which of our three conditions (Liberalism, Pareto, Unrestricted Domain) is no longer doing the work?"
  **Expected Answer:** "No cycle. We violated **Unrestricted Domain** (by restricting preferences to be self-regarding)."
  **Why this works:** It proves they understand that the paradox isn't magic; it relies on the specific intersection of all three conditions. If they identify "Unrestricted Domain" as the dropped condition, the concept has landed.

  ---

  ### 5. Refusals (What to Leave Out)

  **What to Refuse:**
  1.  **Game Theoretic Solutions:** Do not discuss Nash Equilibria or strategic voting.
  2.  **Coase Theorem:** Do not allow the discussion to drift into bargaining solutions.
  3.  **Arrow's Axioms:** Do not define IIA or Transitivity formally.
  4.  **Literature Review:** No mentions of Nozick, Gibbard, or later refinements.

  **How to Announce the Refusal:**
  At the start (Minute 2), say:
  *"There are many ways to solve this paradox—bargaining, changing how we define rights, or restricting preferences. We will not cover those today. Today is only about understanding why the paradox exists in the first place. If you propose a solution, I will write it on the 'Parking Lot' side of the board, but we will not evaluate it."*

  **Why:** This keeps the 45-minute constraint viable. It acknowledges their intelligence (solutions exist) without derailing the specific learning objective (the impossibility logic).
