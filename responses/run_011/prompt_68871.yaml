answer: |-
  ### A Note on the Request

  You asked for a decision procedure, but you also asked me to say plainly if the request is confused. Here is the plain truth: **No ordered sequence of tests can resolve the tension between historical accuracy and public familiarity.** That tension is not a puzzle to be solved; it is a political and interpretive conflict to be managed.

  A flowchart cannot tell you whether pleasing a donor is worth distorting the timeline of the Mali Empire. However, a protocol *can* force your team to admit when you are distorting the timeline, and document *why* you chose to do it.

  The following is not a calculator of truth. It is a **risk-assessment protocol**. It will not tell you the "right" label; it will tell you how much historiographical debt you are taking on with a label, and whether you have a plan to pay it back.

  ***

  ### The Municipal Museum Periodization Protocol (MMPP)

  **Time required:** 45–60 minutes per label.
  **Participants:** Two staff members (one content-focused, one audience-focused).
  **Materials:** The proposed label, the gallery floor plan, a timer.

  #### Step 1: The Origin Test (Retrospection & Value)
  *Ask:* Who coined this term, when, and to what end?
  *   **Pass:** The term was used by people living in the period to describe themselves (e.g., "The Republic," "The Caliphate").
  *   **Fail:** The term was coined 100+ years later to organize history (e.g., "Renaissance," "Middle Ages," "Scientific Revolution").
  *   **Warning:** Does the term imply progress or decline? (e.g., "Dark Ages," "Revolution," "Discovery").
  *   **Action:** If **Fail**, you must acknowledge in Step 4 that this is a *modern framework*, not a historical reality. If **Warning**, the label carries an evaluative burden you must justify.

  #### Step 2: The Geography Test (Scope & Fit)
  *Ask:* Does this term fit every object and region in the gallery/panel?
  *   **Pass:** The term applies equally to all cultures represented (e.g., "The Bronze Age" works for Mesopotamia and Britain, roughly).
  *   **Fail:** The term is specific to one region but applied to others (e.g., "Medieval" applied to Mali or Ming China; "Feudalism" applied to Japan).
  *   **Action:** If **Fail**, the label **must be rewritten**. You cannot caveat a geographical error. A footnote does not fix a map.
      *   *Exception:* If the gallery explicitly argues *about* the misapplication of the term (e.g., "The Myth of the Medieval World"), you may proceed to Step 5.

  #### Step 3: The Chronology Test (Dates & Boundaries)
  *Ask:* Are the start/end dates defensible for the content shown?
  *   **Pass:** The dates mark a material change visible in the objects (e.g., "Iron Smelting Begins," "Plague Arrives").
  *   **Fail:** The dates are symbolic bookends unrelated to the objects (e.g., 1492 for American history, 1789 for global democracy).
  *   **Action:** If **Fail**, remove the dates from the title. Move them to the body text where they can be qualified (e.g., "c. 1500").

  #### Step 4: The Utility Test (Familiarity vs. Harm)
  *Ask:* If we remove this term, will the gallery become unintelligible to a 12-year-old?
  *   **Pass:** No. A descriptive title works (e.g., "Tools of Observation" instead of "Scientific Revolution").
  *   **Fail:** Yes. The term is the only hook the audience has (e.g., "World War II").
  *   **Judgment Call Warning:** This step is not about history; it is about marketing. If you Pass here despite failing Step 1 or 2, you are prioritizing familiarity over accuracy. **This decision must be signed by the Head of Interpretation.**
  *   **Action:** If you Pass here despite previous Warnings/Fails, you must add a "How to Read This Label" panel nearby explaining the term's limitations.

  #### Step 5: The Curator Handoff (Mission & Narrative)
  *Ask:* What story are we telling?
  *   **Question:** Are we telling the story of *what happened* or the story of *how we remember it*?
  *   **Decision:**
      *   If *what happened*: Use descriptive, material-based labels (Step 2 Failures must be rewritten).
      *   If *how we remember it*: You may use the contested term, but the gallery must critique the term itself.
  *   **Action:** This is the final sign-off. If the label survives Step 2 (Geography) but fails Step 1 (Origin), the Curator must write a 50-word statement for the annual report justifying the retention of the term despite its historiographical baggage.

  ***

  ### Application of the Protocol

  Here is the MMPP applied to your three cases.

  #### Case 1: "The Scientific Revolution, 1543–1687" (Instrument Gallery)
  *   **Step 1 (Origin):** **Fail/Warning.** Coined in the 20th century (Koyré, etc.) to describe a specific European intellectual shift. "Revolution" implies a sudden break that historians now argue was actually gradual and global.
  *   **Step 2 (Geography):** **Fail.** The gallery contains instruments. If any instrument is Islamic, Chinese, or Indian (e.g., astrolabes, compasses), the term "Scientific Revolution" excludes them. It implies science "started" in Europe in 1543.
  *   **Step 3 (Chronology):** **Fail.** 1543 (Copernicus) and 1687 (Newton) are symbolic literary dates, not material shifts visible in all instruments.
  *   **Step 4 (Utility):** **Pass.** "Science" is a strong hook.
  *   **Step 5 (Handoff):** Are we showing the history of instruments, or the history of a specific European idea about instruments?
  *   **Verdict:** **Conditioned Pass (Heavy Rewrite).**
      *   *Why:* It fails Geography and Chronology. You cannot keep the dates or the specific phrase "Scientific Revolution" as a definitive header without erasing non-European contributions.
      *   *Fix:* Change title to **"Instruments of Discovery, 1500–1700"**. Move "Scientific Revolution" to the first wall panel as a concept to be explored/critiqued, not the room name.

  #### Case 2: "Medieval World" (Islamic Spain, Mali Empire, Ming China)
  *   **Step 1 (Origin):** **Fail.** "Middle Ages" is a European term coined by Petrarch (14th C.) to disparage the period between Rome and his own time. It means "Middle" of *European* history.
  *   **Step 2 (Geography):** **Fail.** **Critical Failure.** There was no "Middle Ages" in Mali. There was no "Middle Ages" in Ming China. Applying this term to them implies their history is merely a footnote to Europe's timeline.
  *   **Step 3 (Chronology):** **Fail.** The "Medieval" period (500–1500 CE) does not align with the rise of the Mali Empire (c. 1235) or the Ming Dynasty (1368–1644).
  *   **Step 4 (Utility):** **Pass.** It is a familiar hook.
  *   **Step 5 (Handoff):** Can we justify telling a Eurocentric story in a gallery about global empires?
  *   **Verdict:** **Fail. Rewrite Required.**
      *   *Why:* This is the label you will not like losing. But Step 2 is a hard stop. You cannot caveat a geographical impossibility. A footnote saying "We know Mali wasn't actually medieval" insults the visitor and the history. It writes the Mali Empire out of its own timeline by forcing it into Europe's.
      *   *Fix:* **"Empires and Exchange, 1200–1500"**. This describes the material reality (political structures, trade) without imposing a European periodization on West Africa and East Asia.

  #### Case 3: "The end of the Middle Ages" (Wall Panel on Printing)
  *   **Step 1 (Origin):** **Fail.** Retrospective construct.
  *   **Step 2 (Geography):** **Pass.** The panel is specifically about *Europe* ("arrival of printing in Europe").
  *   **Step 3 (Chronology):** **Warning.** Printing didn't "end" the Middle Ages, but it is a conventional marker.
  *   **Step 4 (Utility):** **Pass.** Visitors expect this narrative arc.
  *   **Step 5 (Handoff):** Is this panel arguing that printing *caused* the end, or that people *say* it did?
  *   **Verdict:** **Conditioned Pass.**
      *   *Why:* It passes Geography because it is restricted to Europe. It fails Origin, but Step 4 allows familiarity if Step 2 is clear.
      *   *Fix:* Keep the phrase in the body text, but change the panel header to **"Printing and Social Change, c. 1450"**. Add one sentence: "Historians once called this the end of the Middle Ages; today we see it as part of a longer transformation."

  ***

  ### The Hard Truth

  **The label that fails is "Medieval World."**

  You will not like this. "Medieval" is a brand. It sells tickets. School groups know it. Donors understand it. But the MMPP catches it at Step 2 because **you cannot apply a European period to the Mali Empire without committing a categorical error.**

  If you keep "Medieval World" for a gallery containing Ming China and Mali, you are not just using a familiar term; you are actively teaching visitors that African and Asian history is subordinate to European chronology. That is not "inclusivity"; that is structural erasure disguised as convenience.

  **The Replacement:**
  **"Global Connections, 1200–1500"** or **"Empires and Trade, 1200–1500"**.

  *   **Why this works:** It tells the visitor exactly what is in the cases (empires, trade goods, connections). It keeps the dates (which are roughly synchronous for these regions). It removes the evaluative judgment ("Middle") that implies these cultures were waiting for Europe to wake up.
  *   **The Cost:** You will have to explain to the donors why "Medieval" is gone. You will have to update the school packets.
  *   **The Gain:** You stop arguing case-by-case. You have a protocol. When the donor asks why, you show them Step 2 of the MMPP. You tell them: *"We can't call Mali 'Medieval' for the same reason we can't call London 'Ming.' The protocol flags it as a geographical error."*

  ### Where This Procedure Is a Lie

  I am required to tell you where the judgment calls are disguised as procedure.

  1.  **Step 4 (Utility)** is where accuracy goes to die. If your museum depends on school groups who only know "Medieval," Step 4 will override Step 2. I have written the protocol to require a Head of Interpretation signature there, but in practice, that signature is often a rubber stamp.
  2.  **Step 5 (Mission)** is where politics enters. Deciding whether you are telling "what happened" or "how we remember" is a curatorial ideology, not a historical fact.
  3.  **The "Under an Hour" Constraint.** Real historiography takes longer. This protocol relies on your team's existing knowledge. If your team doesn't know that "Medieval" is Eurocentric, Step 1 will pass incorrectly. This procedure assumes a baseline of literacy that you may need to train for.

  Use this not to find the truth, but to make your compromises explicit. When you lose "Medieval World," do not say you found a better truth. Say you decided the cost of the error was higher than the cost of the rebrand. That is a decision a curator can defend.
