  **1. The Maximin / Second-Order Ambiguity Aversion Pair**
  This tree cannot behaviorally separate **Leaf H (Maximin Imprecisionist)** from a **Second-Order Ambiguity-Averse Bayesian** (a subset of Leaf B/D hybrid). Both will reject the Bookie spread and choose the worst-case option in a one-shot decision. The tree separates them by *ontology* (Node 2 & 3), not by *choice*. If a subject claims "It's one state" (Node 1) but acts like a Maximiner (Node 10), they are theoretically unstable in this framework, but practically indistinguishable from a Second-Order Bayesian who compresses their hierarchy.

  **2. The Vague Utility / Imprecise Belief Pair**
  **Leaf C (Vague Utility)** and **Leaf H/I (Imprecise Belief)** are behaviorally identical in static choice tasks involving money. The tree separates them by asking the subject to introspect on *where* the fuzziness lives (Node 4). A subject may answer incorrectly about their own cognition, landing in the wrong leaf despite identical choices.

