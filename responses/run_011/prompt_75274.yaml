answer: |-
  The lesson had taken place in the study, where the air always smelled of dust and old paper. Ines was twelve. Her father's voice was a low vibration in the room, a sound she could locate precisely without needing to see.

  "The sphere," he had said. "Define it."

  "The locus of all points in space equidistant from a given center," Ines recited. She knew the words the way she knew the layout of the hallway outside; they were structural, load-bearing.

  "Good. And the volume?"

  "Four-thirds pi r cubed."

  There was a pause. She heard the shift of wood on wood. He was moving the model. She knew there was a wooden sphere on the desk. She knew there was a cube, too, and a cone. They were part of the set her mother used for lectures. Ines had never been allowed to touch them.

  "Ines," her father said. "Do not reach."

  Her hand had twitched, hovering over the desk surface. The urge was physical, a hunger to close the gap between the word and the thing. "I only wanted to feel the curvature."

  "Touch is approximate," he said, not unkindly. It was their creed. The hand guesses; the mind knows. "Your fingers will tell you it is round, but they cannot tell you if it is true. They feel bumps. They feel heat. They feel texture. These are accidents. The definition is the substance. If you know the definition, you know the sphere better than anyone who holds it."

  "But I don't know what it *is*," she had whispered.

  "You know what it *means*," he corrected. "That is enough. When you see, you will recognize the truth of it. The eye is just another instrument of measurement. It will read the axiom."

  She had lowered her hand. She learned the rest of the solids by ear. The cube: six equal square faces, twelve edges, eight vertices. The cone: a circular base tapering to a single apex. She learned their cross-sections. She learned that a cube, viewed exactly along a body diagonal, presents a hexagonal outline. She built a cathedral of geometry in her head, perfect and silent, constructed entirely of language.

  ***

  The activation did not bring light like a lamp switching on. It brought noise.

  For the first week, Ines lived inside a static storm. There were no objects, only fluctuations in intensity. Patches of gray would flare to white, then dissolve into black voids. There was no depth. The world was a flat painting smeared across the inside of her skull. She learned quickly that turning her head changed the painting, but she could not yet calculate how. Distance was a guess. A bright patch could be a small thing nearby or a large thing far away.

  By the fourth week, the static settled into edges. Boundaries emerged where brightness changed abruptly. She learned to trust the hard lines more than the gradients. A hard line was a stop. A gradient was a mystery.

  Now, she sat at the table. The room was quiet, save for the hum of the cooling unit for her implant. Across from her sat the observer, a man whose presence she knew only as a darker mass in the field of gray.

  "On the table," the observer said. His voice came from the mass. "Three objects. White. Same size. Identify them."

  Ines focused. Her visual field was narrow, a tunnel of rough resolution. In the center of the tunnel, on the surface of the table, sat three distinct patches of light.

  They were not the clean lines of her father's study. They were messy. The table surface was a mid-tone gray. The objects were brighter, but not uniform.

  She looked at the object on the left. It was a shape of sharp contrasts. There were lines where the brightness dropped off abruptly. She traced the boundary with her eyes. It was not a circle. It had corners. She counted the vertices visible in this projection. One, two, three, four, five, six. A hexagon.

  Her mind raced to the cathedral of language. *A cube viewed exactly along a body diagonal presents a hexagonal outline.*

  Her heart beat faster. This was it. The axiom manifesting. The eye reading the truth. She knew this shape. It was the cube.

  She moved her gaze to the object in the center.

  This one had no hard lines. The brightness was highest in the middle and faded gradually toward the edges. There was no boundary where the object ended and the table began, only a slowing gradient until the contrast vanished. It looked like a disk. A flat circle of light.

  She searched her memory. *The sphere.* But the sphere was a solid. It had volume. The definition required depth. *The locus of all points equidistant from a center.* That implied a third dimension. What she saw was two-dimensional. A circle is the projection of a sphere, yes. But a flat disk also projects as a circle. Without depth perception, without the ability to walk around it, how could she distinguish the solid from the flat?

  She looked at the third object, on the right. It was a triangle. Two straight lines meeting at a sharp point at the top, a curved line at the bottom.

  *The cone.* Side view.

  She sat back. The logic was sound. Hexagon meant cube. Triangle meant cone. Circle meant sphere. She had the mapping. She could speak the words. "Left is cube. Right is cone. Center is sphere."

  But she did not speak.

  She looked again at the hexagon. She knew the definition of a cube. Six square faces. Where were the faces? She saw only one shape. A flat hexagon. She knew, intellectually, that the other faces were hidden, occluded by the perspective. But her eye did not report occlusion. It reported a shape. The word "Cube" summoned a structure of six sides. The sight summoned a single plane. They did not match. The definition was a structure; the vision was a surface.

  She looked at the sphere. The gradient. In her mind, a sphere was perfect symmetry. Here, the light was uneven. There was a glare on the upper left, a shadow on the lower right. This was not the locus of points. This was a thing catching light. Her father had said the eye was an instrument of measurement. But it was measuring light, not truth. It was measuring the accident of the lamp, not the essence of the solid.

  She realized then that she had never known the shapes. She had known the words for the shapes.

  The bridge her father promised—the direct line from axiom to retina—was not there. The vision did not speak geometry. It spoke of photons and absorption. The "edge" of the cube was not a mathematical boundary; it was a place where the light stopped hitting the sensor. The "curve" of the sphere was not a continuous function; it was a series of pixelated steps in brightness, too fine to resolve but present nonetheless.

  She tried to force the connection. She tried to overlay the verbal definition onto the visual data like a transparency. *This hexagon is the shadow of the cube.* But she didn't see a shadow. She saw a shape. To know it was a cube, she had to infer the hidden faces. She had to assume the light was behaving normally. She had to assume the object was solid.

  Touch would have known. Her hand would have found the corner, the hard stop of the edge, the flat plane of the face. The hand would have confirmed the volume. The hand would have lied about the perfection, yes, but it would have confirmed the *existence*.

  Her eyes confirmed only the light.

  "Ines?" the observer said.

  She looked at the hexagon again. It was beautiful, in a stark, silent way. But it was not the cube she knew. The cube she knew was a logical construct, immutable. This thing was fragile, dependent on the angle, dependent on the light. If she moved her head, the hexagon would change. It might become a square. It might become a trapezoid. The object remained itself, but the vision changed. Which one was the truth? The constant definition, or the changing image?

  Her father had said the definition was the substance. But without the image, the definition was empty. And without the definition, the image was meaningless. She had neither. She had the definition in her memory, and she had the image in her eye, and they refused to shake hands.

  She thought of the sphere. The gradient. If she touched it, she would feel the curve continuous under her palm. She would feel the lack of edges. Here, she saw only a fading brightness. She could not feel the curve. She could only see the light dying out.

  "I cannot tell," she said.

  The observer shifted. The dark mass leaned forward. "You see the shapes. The hexagon, the circle, the triangle. You know the projections."

  "I know the propositions," Ines said. Her voice sounded flat in the room. "I know that if a cube is oriented thus, it projects a hexagon. I know that if a cone is oriented thus, it projects a triangle."

  "And yet?"

  "And yet I do not see a cube. I see a hexagon. I do not see a sphere. I see a circle with shading." She gestured with her hand, her real hand, the one that knew the texture of the table, the spine of a book. "You ask me to identify the solid. But I have no access to the solid. I have access to the surface. I have access to the light."

  "You can infer," the observer said. "It is a test of cross-modal recognition."

  "It is a test of translation," Ines corrected. "And I do not speak the language."

  She looked at the objects one last time. They sat there, silent and white. They were not the axioms of her childhood. They were not the pure forms her father had protected her from touching. They were just things. They were messy. They caught the light imperfectly. They cast shadows that were not part of their definitions.

  She realized she was disappointed. Not because she failed the test, but because the world was not made of math. It was made of light. And light was not true.

  "I cannot tell," she said again. "They are all just shapes. I do not know which one is the thing."

  She closed her eyes. The static returned, a familiar gray noise. In the dark, the cube was still a cube. The definition held. In the dark, the sphere was still perfect. The axiom did not break.

  She opened her eyes. The hexagon was still there, fragile and bright.

  "I need to touch them," she said.

  "That violates the protocol," the observer said.

  "Then the protocol is wrong." Ines leaned forward. The movement shifted the perspective. The hexagon warped. It became a irregular polygon. The cube had not changed, but the truth of it had shifted. "My father told me the hand lies. He said touch is approximate."

  She reached out. Her hand hovered over the table, finding the air currents, the heat radiating from the objects.

  "He was wrong," she said. "The hand knows the object. The eye only knows the view."

  Her fingers found the corner of the left object. Hard. Sharp. Three edges meeting at a point.

  "Cube," she said.

  She moved to the center. Smooth. Continuous. No edges.

  "Sphere."

  She moved to the right. Flat base. Tapering side. Sharp apex.

  "Cone."

  She withdrew her hand. She sat back. The visual field still showed the hexagon, the circle, the triangle. They were still disconnected from the words. But now the words were anchored. They were anchored in the feel of the corner, the sweep of the curve.

  "I know them now," she said to the observer. "But not because I saw them."

  She looked at the hexagon again. It was no longer just a shape. It was the face of the thing she had held. The vision had not given her the knowledge. The touch had given her the knowledge, and now the vision could hang the label on it.

  "The problem," Ines said, mostly to herself, "was not in my eyes. It was in the expectation that the world defines itself."

  She looked at the observer. The dark mass was still.

  "I am done," she said.

  Ines closed her eyes again. She preferred the dark. In the dark, the geometry was pure. In the dark, the sphere was exactly where the math said it should be. In the light, it was just a thing on a table, waiting to be touched.

  ***

  **Author's Note**

  I committed to Ines failing the visual identification. The deciding consideration was the distinction between *propositional knowledge* (knowing that a cube projects as a hexagon) and *phenomenological recognition* (seeing the object as a cube). Molyneux's problem hinges on whether spatial concepts are innate or learned through sensory correlation. Ines's upbringing stripped her of the tactile correlation, leaving her with abstract definitions. Vision, however, presents qualitative data (light, shading, perspective distortion), not logical definitions. Without prior experience binding the visual qualia to the concept, the definition remains a ghost. She can only identify the objects by touching them because touch provides the spatial volume her vision lacks, proving that knowledge of shape requires empirical binding, not just deductive truth.
