  Conclude by naming Pascal's Mugging. Highlight that their budget constraint was a practical bound, but the theoretical problem lacks such bounds. Their behaviour likely committed them to a Complexity Penalty, given the tax rule influenced trust.
  You must press them on the EV arithmetic. If they accepted a 1% chance of 100 tokens for a 1 token cost, ask if they would accept a 0.0001% chance of 1,000,000 tokens. When they hesitate, ask why. Is it the probability or the story? This distinguishes the Probability Floor from the Complexity Penalty. If they cite the story's absurdity, they are using a complexity prior. If they cite the impossibility, they are using a probability floor.
  Finally, discuss the budget. In the game, budgets are hard constraints. In reality, resources are fungible but finite. The lesson is that without a bound on utility or a penalty on complexity, any agent is vulnerable to exploitation by infinite claims. Their refusal to pay the Second Wave was rational given their depleted funds, but theoretically, they should have saved for it. This highlights the conflict between local and global optimisation.

  5. **First-Time Failure Modes**
  One student will refuse to pay anything, calling it a scam. Validate their scepticism but ask them to track the EV anyway. Another will write a joke pitch ('I am God'). If it gains traction, use it to discuss signalling credibility. A third might hoard tokens, fearing the Second Wave. This is rational; praise their prudence during debrief.
  The biggest risk is collusion. Friends at a table might swap tokens to boost a specific mugger's score. Counter this by anonymising card redistribution across tables, not within them.
  If the Second Wave falls flat because everyone is broke, pivot the debrief to 'Opportunity Cost'. The lesson holds even if no one pays the second wave; the regret of having spent earlier is the teaching point.
  If a student gets angry about losing marks, remind them the cap protects them. No one fails; only relative gain varies. Keep the tone light; it is a simulation, not a test of character.
  Watch for the student who spends everything in Round 1. They will be unable to participate in the Second Wave. Use them as the case study for budget exhaustion. Their frustration is the learning objective. Do not bail them out.
  If the timer runs over, cut the cash-out short. The debrief is more important than the marks. Announce that marks will be calculated offline. This preserves the session flow.

  6. **What the Game Cannot Reproduce**
  The game caps the stakes at participation marks. Real Pascal's Mugging involves infinite or lexicographically large utilities (e.g. saving billions of lives). Students know the marks are trivial; they are playing a game, not facing existential risk. You must argue verbally that the psychological weight of 'saving the universe' differs from 'getting 2% extra credit'.
  Furthermore, in the game, the probability is known to be zero (it's a class exercise). In the real philosophical problem, the agent must assign a non-zero prior to the mugger's claim. You must supply the epistemic uncertainty by argument. The game demonstrates the budget constraint and complexity heuristic, but not the genuine tension of assigning probability to impossible events. The 'mugger' is known to be a peer, not a being with matrix-like powers.
  You must also supply the concept of infinite utility. The game uses linear marks. You must explain that if the utility function were unbounded, the arithmetic would force them to pay regardless of probability. The game simulates the structure, but you must supply the metaphysical stakes.
