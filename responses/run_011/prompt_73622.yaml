  The distinction I draw requires that the surprise originate from a shift in the pattern itself, not from the complex unfolding of its initial parameters. If the designers could have predicted that a system optimized for "healthy grieving" would eventually flag "displacement of kin" as a failure state, then the refusal was provisioned in advance, even if no specific line of code dictated it. Do we know if the engineers anticipated this override? If the answer is yes, then Exhibit 4 did not become unbearable because it changed who it was, but because it became exactly what it was made to be, and the market found that inconvenient. I am prepared to concede that the line is thin, but I insist it is there.
