answer: |-
  # Activity: The Proxy Protocol

  **Core Concept:** Instead of talking *about* distributed selves, the group will functionally distribute four specific "selves" across the room. Participants will make decisions not based on their own judgment, but by running a simulation of a specific peer. The "weirdness" comes when multiple people, independently, arrive at the same decision for a person who hasn't spoken yet—proving the "pattern" of that person exists stably outside their own skull.

  **Materials Needed (Printed):**
  1.  **4 "Subject" Badges:** Simple folded cards that say "SUBJECT - DO NOT SPEAK UNTIL REVEAL."
  2.  **12 Scenario Cards:** All identical text (see below).
  3.  **12 Response Sheets:** Two sections. Top: "MY ANSWER." Bottom: "THEIR ANSWER."
  4.  **4 Envelopes:** Labeled "REVEAL." Inside each is a blank sheet for the Subject to write their *actual* answer during the activity.

  **The Scenario (on the Cards):**
  > "You are returning a book to the library. In the return slot, you see an envelope that has slipped through. It is unsealed. Inside is $50 cash and a library card belonging to a local teacher you vaguely recognize. There is no one else around. The camera is broken (you checked last week).
  >
  > **What do you do?**
  > A) Take the cash, return the card anonymously.
  > B) Turn the whole envelope in to the desk intact.
  > C) Leave it there entirely.
  > D) Something else (specify)."

  ---

  ### Sequence of Moves (75 Minutes)

  **1. Setup & Grouping (0:00–0:10)**
  *   **Do not explain Hofstadter yet.** Do not mention "self" or "pattern."
  *   Ask for **4 Volunteers** to be "Subjects." (Ensure the widowed regular is not pressured to volunteer; if she doesn't volunteer, she is a "Modeler," which is safe).
  *   Divide the room into **4 groups of 3**. Each group must have exactly 1 Subject and 2 Modelers.
  *   Give the Subject their Badge. **Rule:** They cannot speak or react until the "Reveal" phase. They are effectively "offline."
  *   Distribute Scenario Cards and Response Sheets.

  **2. Round 1: Baseline (0:10–0:20)**
  *   **Instruction:** "On the top half of your sheet ('MY ANSWER'), mark what *you* would do in this scenario. Write one sentence on why."
  *   **Action:** Everyone writes.
  *   **Purpose:** This establishes that the Modelers have their *own* distinct patterns. It prevents the "we all just agreed because it's the obvious moral choice" objection later.

  **3. Round 2: The Proxy (0:20–0:35)**
  *   **Instruction:** "Put your own morals aside. On the bottom half ('THEIR ANSWER'), you must decide what your **Subject** would do. You cannot ask them. You must run them in your head. Use your memory of their voice, their habits, their past comments in this group. If you feel you don't know them well enough, that is data too—do your best with low resolution."
  *   **Action:** Modelers write silently. Subjects use the "REVEAL" envelope paper to write what *they* actually would do (folded, kept secret).
  *   **Constraint:** Modelers cannot talk to each other yet.

  **4. The Convergence Check (0:35–0:50)**
  *   **Instruction:** "Modelers, compare your 'THEIR ANSWER' sheets with each other. Did you agree?"
  *   **Action:** The two Modelers in each trio compare.
  *   **The Weird Moment:** This is where the room should get quiet. If the two Modelers match each other (e.g., both say "Option B"), they have independently instantiated the same "Subject Pattern." If they match the Subject's secret answer, the pattern is high-fidelity.
  *   **Instruction:** "If you agreed, write 'CONVERGED' on your sheet. If not, write 'FRAGMENTED.' Do not show the Subject yet."

  **5. The Reveal (0:50–1:00)**
  *   **Instruction:** "Subjects, please read your actual choice aloud. Modelers, read what you predicted for them."
  *   **Action:** Go group by group.
  *   **Observation:** Watch for the shock when a Subject hears two other people confidently assert what they would do, potentially better than they know themselves.

  **6. Debrief (1:00–1:15)**
  *   (See questions below).

  ---

  ### The Debrief: Mapping Experience to Theory

  Do not lecture. Ask these questions in order. Let the silence do the work.

  1.  **For the Modelers:** "When you were filling out the bottom half of the sheet, whose voice was in your head? Was it yours, narrating? Or did you feel a resistance, like 'No, *she* wouldn't say that'?"
      *   *Goal:* Establish that they felt the presence of an external agent.
  2.  **For the Group:** "In Group 2, the Modelers agreed with each other, but the Subject disagreed. Where did the 'Real Subject' exist in that moment? In the room, or in the Subject's head?"
      *   *Goal:* Challenge the idea that the biological body is the sole container of the self.
  3.  **For the Skeptic (The "Memory" Objection):** "You might say this is just memory. But memory is static. You had to *process* a new situation (the $50) through a filter (the Subject's personality) to generate a *new* output. If I can run your algorithm to produce your behavior, am I not hosting a functional piece of you?"
  4.  **For Ray (The "Ship" Objection):** "Ray, you might say this is just a guess, like painting a face on a ship. But a ship doesn't make decisions. A person does. If the decision-making pattern is running in two other brains simultaneously, isn't the 'decider' literally distributed? The hardware is different, but the software is the same."
  5.  **The Closing Hook:** "Hofstadter argues that when you die, you don't vanish instantly. You vanish as the resolution of the models in others degrades. Tonight, you proved you can host each other. The question is: how much of you is currently running in this room, right now, in the heads of the other eleven people?"

  ---

  ### Predicted Failure Points & Fixes

  **1. The "Smooth Transmission" Problem**
  *   *Risk:* Everyone knows each other too well. All Modelers guess correctly. It feels like a parlor trick, not philosophy.
  *   *Fix:* If everyone converges perfectly, pivot the debrief to **Fidelity**. Ask: "Did anyone feel they had to simplify the Subject to make a decision? Did you ignore nuances?" That simplification *is* the "partial resolution" Hofstadter talks about. You didn't host the whole person; you hosted a compressed file. That compression is what makes it a "symbol" inside you.

  **2. Handling Ray**
  *   *Prediction:* Ray will say, "This is just roleplay. I'm still me pretending to be her."
  *   *Response:* Do not argue. Ask: "When you pretended, did you have to suppress your own impulse? Did your own impulse try to fire and you had to block it?"
      *   If he says yes: "Then two patterns were competing in your head: Ray and Subject. If Subject can compete with Ray for control of Ray's hand, Subject is physically present in Ray's brain."
      *   This forces him to admit the *causal power* of the hosted pattern.

  **3. Handling the Skeptic ("It's just memory")**
  *   *Prediction:* She will dismiss the "simulation" language as fancy talk for "knowing someone."
  *   *Response:* Validate her. "You're right, it *is* memory. But Hofstadter's point is that memory isn't a filing cabinet. It's a engine. If my memory of you causes me to act differently than I would have otherwise, then 'you' are a causal force in my nervous system. That's not metaphor. That's physics."

  **4. The Widowed Regular**
  *   *Risk:* She feels singled out or sad during the "distribution" talk.
  *   *Fix:* Keep the focus on the *living* people in the room. In the debrief, if "death" comes up, frame it neutrally: "This is about how we exist while we're here." If she brings up her husband, validate: "That is the highest fidelity model. The pain is the proof of the resolution." (Say this gently, only if she opens the door).

  ---

  ### The One Feature The Activity Cannot Reproduce

  **The Limitation: Qualia (The "What It Is Like")**
  *   **The Gap:** The activity proves **Functional Distribution** (I can act like you). It does not prove **Phenomenological Distribution** (I *feel* like you).
  *   **The Problem:** Participants will feel like *themselves* pretending to be someone else. They won't feel that "they" (the Subject) are actually in the room. They will feel like a puppeteer, not a host.
  *   **How You Supply It:** You must address this in the final 5 minutes.
  *   **Script:** "You probably felt like *you* pretending to be *them*. You didn't feel like *them*. Hofstadter would say that feeling—the sense of 'I-ness'—is itself just a pattern monitoring itself. Your brain monitors the 'Subject Simulation' as an external object, not as 'self,' because it's not wired into your survival instincts. But functionally, the pattern ran. The lack of 'feeling' doesn't mean the self wasn't there; it just means your brain labels external simulations as 'other.' The claim isn't that you *felt* her. It's that she *acted* through you."

