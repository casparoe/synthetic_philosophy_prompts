prompt: |-
  So my book club (mostly retirees and two of us still working, we meet on zoom thursdays) is doing a year on "history at different speeds" — we finished Braudel's Mediterranean a few weeks back and now we're on the Dutch seventeenth century — and last night we got into an argument I still can't reconstruct properly. One of us, an ex-shipping analyst who is extremely confident about hulls, argued that what made the Dutch the carriers of Europe was a pile of decisions: the fluyt design being cheap to build and needing a skeleton crew, the VOC being set up as a joint-stock thing ordinary people could buy into, and above all the choice to let the merchants who fled Antwerp bring their capital and their trade contacts north instead of shutting them out. Another guy cut him off with "geography is destiny" — peat, herring, sitting on the Rhine delta, that flat shallow coast, being astride the Baltic trade — and said all those decisions were just foam on the surface, that you could have put anyone in charge and gotten roughly the same outcome, and that asking whether it could have gone otherwise is a catagory mistake. Same four words doing two completely different jobs, and I can't say why that bugs me.

  Can you take the sentence apart for me? I want the distinct precise claims somebody could be making with "geography is destiny," sorted by what's varying. On the geography side: bedrock endowment that no one can move, versus anything that just changes slowly, versus stuff humans built but that's expensive to unbild — because half of what he listed, the polders and the canals and the Amsterdam entrepôt, was made by exactly the kind of decision he was saying didn't matter, which felt like a problem but nobody picked it up. On the destiny side: sufficient cause? shrinking the option set without picking inside it? changing relative costs so that one outcome is the equilibrium? a claim about which timescale carries the explanatory weight? a claim about counterfactuals and what "could have happened otherwise" even means? Vary the timescale and the explanandum too, since I suspect "geography is destiny over three centuries" and "geography is destiny in 1602" aren't the same sentence wearing a hat.

  For each reading, tell me whether it's a platitude everyone in the room already accepts, whether it's substantive and defensible, or whether it's false or secretly begging the question — and then say which readings, if any, actually license the two moves he made: explaining the Dutch outcome, and ruling the counterfactual question out of court rather than just answering it badly. I'd also like to know what Braudel's own argument actually needs, because the strong version seems like way more than the longue durée requires and I suspect the guy was smuggling it in. Please don't give me the environmental determinism versus possibilism history lesson, I've skimmed enough of that to know it exists — I want the sentence disassembled, ideally as a numbered list I can print out and slap on the table next week.
