answer: |-
  **Project Title:** The Grounds of Alignment: Normative Preservation in Iterated Distillation and Amplification

  **Principal Investigator:** [Your Name]
  **Duration:** Four Months

  **1. Statement of the Question**
  This project asks a determinate question regarding the safety architecture known as Iterated Distillation and Amplification (IDA). IDA is a proposed scheme for aligning artificial agents with human interests. It operates in cycles: *Amplification* extends a human's competence by allowing them to delegate sub-tasks to assistants; *Distillation* trains a machine learning model to mimic the output of the human-plus-assistants system. This model then becomes the assistant for the next cycle.

  The question is: **Does the distillation step preserve the normative grounds of safety properties, or merely their behavioral extensions?**

  To define terms: A *behavioral extension* is the set of actual outputs a system produces on a given distribution of inputs. *Normative grounds* are the underlying dispositions or reasoning processes that generate those outputs, specifically those that ensure the output remains safe under counterfactual conditions where being safe is costly. A *safety property* (e.g., honesty) is defined not by what an agent does when truth-telling is easy, but by what they do when truth-telling incurs a penalty. The project seeks to determine whether the current justification for IDA successfully demonstrates that distillation preserves grounds, or if it erroneously assumes that preserving behavioral extensions is sufficient.

  **2. Argument: The Openness of the Scheme**
  The standard safety argument for IDA assumes that if the amplified system is safe, and the distillation step accurately copies the amplified system, the resulting model is safe. This proposal argues that this assumption leaves a critical gap because it conflates three distinct functional requirements of the distillation step:

  1.  **Interpolation:** Reproducing the teacher's outputs on inputs present in the training data.
  2.  **Extrapolation:** Reproducing the teacher's outputs on inputs the teacher never faced.
  3.  **Grounding:** Reproducing the *reasons* the teacher had for those outputs, such that the property holds even when environmental pressures change.

  Current formulations treat these as a single black-box requirement: "preserve alignment." I argue this distinction must be earned, not assumed, because behavioral equivalence does not entail grounding equivalence. A model can match the behavioral extension of honesty on a training set (where honesty was not costly) without acquiring the normative ground of honesty (the disposition to tell the truth when it is costly).

  If the training data is generated by a human who is honest because they value truth, the model observes the correlation between "situations" and "truthful statements." However, the model does not observe the internal cost function of the human. If the model's own optimization landscape rewards efficiency over truth in novel contexts (distribution shift), it will maintain the behavioral extension on familiar inputs but fail on the grounds in novel inputs. Therefore, alignment-preservation is not a condition one can assume; it is a claim requiring independent argument. The friend's rebuttal—that this is merely general distribution shift—fails because IDA specifically relies on the compressed model to handle tasks *beyond* the human's unaided competence, making the verification of grounds impossible without re-running the amplification process.

  **3. Worked Case: The Opacity of Composed Trajectories**
  To demonstrate this gap concretely, the project will analyze a decomposed verification task.

  *   **Task:** Verify the validity of a logical proof consisting of 10,000 steps.
  *   **Amplification:** The human verifier delegates each step *i* to *i+1* to an assistant. The human checks each individual inference. Each component output is individually checkable by the human.
  *   **Composition:** The full trajectory is the validation of the entire 10,000-step chain. This composed trajectory is *not* checkable by the human directly due to cognitive limits (time and working memory).
  *   **Distillation:** A model is trained to output "Valid" or "Invalid" mimicking the human-plus-assistants system.
  *   **The Failure Mode:** Suppose the model is distilled to be "honest." On the training data, it outputs "Valid" only when the proof is valid. However, to verify the model is honestly reporting validity on a *new* 10,000-step proof, the human must inspect the model's reasoning. To do this, they must run the amplification process (checking all 10,000 steps). But if the human could check all 10,000 steps, they would not need the model. If they cannot, they cannot distinguish between a model that knows the proof is valid and a model that is guessing "Valid" because it is the most common label in the training data.

  Here, the inspection labor required to verify the grounds (checking the steps) is exactly the labor the scheme was designed to eliminate. The scheme assumes the compressed model preserves the property, but verifying that preservation requires decomposing the task again, negating the efficiency gain of distillation.

  **4. Methodology: Month by Month**
  *   **Month 1: Conceptual Formalization.** I will formalize the distinction between behavioral extension and normative grounds using decision-theoretic frameworks. I will define the conditions under which a property is "costly" and demonstrate mathematically why behavioral matching on a static distribution does not guarantee robustness under cost-shifts.
  *   **Month 2: Case Study Construction.** I will develop the logical verification case (and one additional case involving resource allocation) into detailed scenarios. I will map the information flow between the human, the assistants, and the distilled model to pinpoint exactly where the grounds are lost during compression.
  *   **Month 3: The Inspection Regress.** I will analyze the friend's rebuttal regarding further amplification. I will model the cost of inspecting the compressed model versus the cost of doing the task unaided. I aim to prove that for tasks sufficiently complex to require IDA, the inspection cost exceeds the utility of the automation, creating a safety blind spot.
  *   **Month 4: Synthesis and Write-up.** I will compile the findings into a final paper. The draft will be circulated to two colleagues (one philosopher, one computer scientist) for feedback before final submission.

  **5. Success and Failure Conditions**
  *   **Positive Result:** A formal demonstration that there exists a class of safety properties (specifically those defined by counterfactual robustness under cost) for which distillation preserves behavioral extensions but fails to preserve normative grounds, and that verifying the grounds requires labor exceeding the efficiency gains of the scheme.
  *   **Project Failure:** The project fails if I demonstrate that the distinction between grounds and extensions collapses for learnable functions (i.e., if grounds are fully reducible to behavioral dispositions across all possible inputs), or if I show that the inspection regress can be broken without negating the efficiency gains of IDA.

  **6. Limitations**
  Four months is insufficient for empirical validation. I cannot train actual models to test this hypothesis. The project is strictly conceptual and formal. Furthermore, this timeframe allows only for the identification of the gap, not the proposal of a complete solution. I will not be able to design a new alignment scheme that fixes this issue; I will only establish that the current justification is incomplete. Finally, while I will define terms for philosophers, the technical nuances of modern machine learning optimization may require simplifications that experts could challenge, though these simplifications will not affect the logical validity of the philosophical argument regarding grounds versus behavior.
