answer: |-
  **TO:** The Statute Revision Panel
  **FROM:** Counsel
  **DATE:** 10 February 2024
  **SUBJECT:** Recommendation Regarding the Offense of Outraging Public Decency

  **Introduction**

  This memo concerns the offense of outraging public decency, specifically whether it should be retained, repealed, or modified in light of the recent gallery exhibition involving plastinated cadavers and simulated desecration. The prosecutor declined to charge, reasoning the offense requires a real corpse. The residents' coalition petitions us to clarify the offense to include simulated material, arguing that the wrong lies in the attack on shared moral convictions rather than individual harm. After reviewing the submissions, I recommend we **retain the offense with a defined test**. This approach respects the enabling instrument's requirement that conduct offend "settled moral convictions" while ensuring criminal law remains a measure of last resort.

  **The Coalition's Claim: Morality as Social Constitution**

  We must take the coalition's argument seriously, not merely as a claim about hurt feelings, but as a claim about the nature of society. They argue that a community is held together not just by laws preventing physical harm, but by shared convictions regarding what is sacred. In this view, the inviolability of the dead is a constitutive rule of our social order. To desecrate a corpse—even in simulation—is to attack the bond itself. The distress reported by visitors is evidence not of individual psychological harm, but of a rupture in the shared moral environment.

  If we accept this, the traditional harm-based framework is incomplete. It assumes wrongs must be done *to* someone. The coalition argues wrongs can be done *to the society* by damaging the convictions that make it coherent. A convincing simulation damages the conviction just as effectively as the real act, because the conviction concerns the *meaning* of the body, not merely its biological status. To dismiss this as mere "offense" is to misunderstand the claim. The claim is that without these shared prohibitions, the society ceases to be itself.

  **Harm, Morality, and the Criminal Law**

  This brings us to the mid-century exchange between Lord Devlin and Professor Hart regarding the enforcement of morals. Devlin argued society has a right to protect its moral fabric; Hart argued law should only prevent harm to individuals. The gallery counsel relies on Hart; the coalition relies on Devlin.

  My view is that the harm-based framework is conceptually incomplete because it ignores the social damage the coalition identifies. However, criminal law is a blunt instrument. It deprives citizens of liberty. Therefore, even if moral damage is real, not every breach of a shared conviction warrants criminal sanction. There must be a threshold that distinguishes a moral wrong from a crime. That threshold is not the existence of the conviction, but the intensity of the public reaction to its breach. This distinguishes the criminal law from mere social censure or civil regulation.

  **Defining "Settled Moral Convictions"**

  The enabling instrument requires us to retain the offense only where conduct offends "settled moral convictions." We have three proposed readings of "settled": (1) a durable majority holds it now; (2) it has run continuously across generations and survives defense; (3) ordinary people react with indignation rather than queasiness.

  I recommend we adopt the **Intensity Test (Option 3)**.

  The gallery installation reveals the flaws in the other two. The conviction regarding the dead is undoubtedly continuous (Option 2); it has survived across generations. Yet, continuity alone does not justify criminalization, or else all historical prejudices would remain law. The Majority Test (Option 1) is equally problematic. A durable majority might hold a conviction privately but feel only sadness or revulsion when it is breached, rather than a demand for punishment. The gallery visitors reported distress and queasiness. This suggests that while the conviction is held, the breach did not trigger the specific public outrage required for criminal law.

  The Intensity Test captures the distinction between a private moral violation and a public wrong. "Indignation" implies a demand for censure; "queasiness" implies a desire to look away. Criminal law addresses the former. By adopting this test, we acknowledge the coalition's point—that the conviction matters—while accepting the gallery's point—that distress alone is insufficient for conviction.

  **Recommendation: Retain with Defined Test**

  I recommend we retain the offense but draft instructions to clarify its elements. This satisfies the enabling instrument by ensuring there is "no other adequate means" of addressing the mischief; where regulation suffices, criminal law must recede.

  **Drafting Instructions:**
  1.  **Actus Reus:** The accused must perform an act of a lewd, obscene, or disgusting nature that tends to outrage public decency.
  2.  **Mens Rea:** The accused must know that the act has that tendency.
  3.  **Settled Conviction:** Conduct outrages public decency only if it violates a moral conviction held with sufficient intensity that its breach provokes public indignation, not merely distress, revulsion, or disagreement.
  4.  **Simulation:** Purely simulated conduct (including digital representations where no real body is involved and no deception is intended) shall be presumed not to outrage public decency within the meaning of this offense, unless presented as real.

  Regarding the simulation element: The coalition argues simulation attacks the conviction. I agree. However, the enabling instrument requires there be "no other adequate means" of addressing the mischief. For simulated material, regulatory schemes (zoning, age restrictions, warning labels) are adequate to protect the sensitive without invoking the criminal law. Criminalizing simulation would chill expression disproportionate to the mischief. Thus, we retain the criminal offense for real violations (satisfying the coalition's core concern for the dead) but exclude simulation (satisfying the necessity requirement).

  **Conclusion on the Readings**
  Adopting the Intensity Test clarifies why the gallery case falls outside the offense. The conviction was continuous (passing Option 2), but the reaction was distress (failing Option 3). The Majority Test (Option 1) remains ambiguous here, as polls might show majority disapproval but minority indignation. The Intensity Test provides the clearest judicial standard: would the ordinary person demand punishment, or merely leave the room?

  **Interim Guidance**

  Until any amendment is enacted, the Panel should issue the following guidance to prosecutors and the gallery. Prosecutors should be advised that, under current case law, the offense generally presupposes the existence of a real person or body, and charges regarding purely simulated material are unlikely to succeed absent evidence of intent to deceive the public regarding authenticity. The gallery should be advised that while criminal liability is unlikely, they remain subject to municipal licensing and public nuisance regulations. They are encouraged to engage with community representatives regarding signage and access restrictions for future exhibitions involving human remains or realistic simulations. This maintains public order without preempting the Panel's final recommendation on the statutory text.

  This approach balances the constitutive morality the coalition defends with the liberty interests the gallery asserts, ensuring the criminal law remains reserved for those breaches that truly shake the foundations of our shared peace.
