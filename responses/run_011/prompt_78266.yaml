answer: |-
  Here is the diagnosis.

  ### The Step to Reject: Premise (5)

  You should reject the inference from (4) to (5). Specifically, reject the claim that an internally inconsistent act of blame *fails to accomplish what blaming is for* (i.e., that it is void *ab initio*).

  **The Argument:**
  Your friend's argument relies on a **Jurisdictional Model** of moral standing. She treats the blamer's moral status like a court's subject-matter jurisdiction: if the condition isn't met (clean hands), the verdict is a nullity (5). It has no legal effect.

  The correct model is a **Credibility Model**. Hypocrisy undermines the *weight* or *force* of the blame, not its *validity*. A hypocrite's blame is like testimony from a witness with a conflict of interest: it is admissible, it can be true, and it can successfully hold the defendant to account, but it is subject to impeachment and carries less probative value.

  ### Why It Seduced You
  Premise (5) is seductive because it leverages your legal training against you. In law, we are trained that procedural defects (like lack of standing or jurisdiction) render a judgment void. It feels clean, binary, and protective of the system's integrity.

  It also appeals to a deep moral intuition: that moral authority requires integrity. If I demand of you what I deny of myself, I seem to be placing myself above the law I claim to uphold. The "pragmatic contradiction" in (4) feels like a logical error that should crash the system. It promises a world where moral criticism is reserved for the virtuous, which feels like a safe guard against abuse.

  ### The Price of Rejecting It
  By rejecting (5), you pay three prices:

  1.  **You lose the "Tu Quoque" Veto.** You can no longer dismiss a hypocrite's blame simply by pointing to their hypocrisy. You must admit that their blame *lands*, even if it is tainted. You have to engage with the substance of the accusation rather than dismissing the accuser.
  2.  **You Accept Scalar Authority.** Moral standing is not binary (have it/lack it); it is scalar (more/less). You must accept that you have *some* standing to blame even when you are flawed, but less standing than someone who is not. This makes moral accounting messier.
  3.  **You Accept Moral Risk.** You allow that flawed people can successfully regulate one another. This opens the door to abuse (the hypocrite weaponizing blame), but it keeps the door open to the necessary work of community maintenance.

  ### Addressing Your Three Unresolved Objections

  Rejecting (5) dissolves your three objections because it shifts the problem from *validity* to *force*.

  **1. The Self-Blame Problem**
  If blame requires a "clean hands" jurisdiction (5), self-blame is impossible until the self is cleansed, which creates a paradox.
  *   **The Repair:** If blame is a tool for holding oneself to a standard, its validity does not depend on past perfection. I can validly blame myself for a past failure even if I am currently struggling to repudiate it. The inconsistency reduces the *comfort* or *resolution* of the self-blame, but it does not render the self-judgment void. The "verdict" stands even if the "judge" is compromised.

  **2. The Necessary/Sufficient Problem**
  Your friend's condition (3) fails because it targets the wrong feature.
  *   **The Repair:** The problem with the selective prosecutor (honest but ignores board embezzlement) is not that his conduct asserts the standard is void; it is that his *selectivity* suggests bias. The problem with the repentant thief is not that he violated the standard, but that he has *reaffirmed* it through repentance.
  *   By rejecting (5), you stop looking for a condition that *voids* blame and start looking for conditions that *mitigate* it. The selective prosecutor has standing, but his blame is suspect due to bias. The repentant thief has standing, and his blame is potent *because* of his repudiation. The "defect" is not a switch; it's a dimmer.

  **3. The Granularity Problem**
  Your friend broadens the standard to ensure everyone fails (6), guaranteeing the nihilistic conclusion (7).
  *   **The Repair:** If you reject (5), you no longer need (6) to drive the conclusion. It doesn't matter if everyone violates *some* broad standard. What matters is the *relevance* of the violation to the specific blame being issued. If I blame you for lying, my past infidelity is less damaging to my standing than my past lying. The "granularity" is determined by the nexus between the blamer's fault and the blamee's fault, not by a universal search for sin.

  ### The Authority vs. Fitness Distinction

  You identified this as load-bearing. Your friend collapses **Authority** (the right to address the demand) with **Fitness** (the persuasive power or moral merit of the address).

  *   **Authority (Standing):** This is grounded in the relationship and the shared normative framework. As long as we are both members of the moral community, I have the authority to hold you to our shared standards. Hypocrisy does not expel me from the community.
  *   **Fitness (Credibility):** This is grounded in the blamer's character and consistency. Hypocrisy devastates fitness.

  **The Legal Analogy:**
  Think of a judge who owns stock in the defendant's company.
  *   **Friend's View:** The judge lacks jurisdiction. Any verdict is void. (Premise 5).
  *   **Correct View:** The judge has jurisdiction, but has a recusable conflict. The verdict is valid but subject to appeal/reversal due to bias.

  In morality, there is no "Supreme Court" to reverse the verdict. So the "appeal" happens in the social sphere: the blamee can reject the *force* of the blame ("Look who's talking"), but they cannot deny the *truth* of the standard. By rejecting (5), you acknowledge that the hypocrite's blame is *appealable* (it can be resisted), but not *void*.

  ### The "Reactive Attitudes" Point

  Your friend mentions this is downstream of blame being a "reactive attitude" (P.F. Strawson's term).
  *   **Her Reading:** Reactive attitudes are entitlements we earn. If we violate the norms, we forfeit the entitlement.
  *   **The Correction:** Reactive attitudes are *natural facts* of human relationships, not earned entitlements. We *do* feel resentment when wronged, regardless of our own purity. To say we lack "standing" is to say we ought to suppress the attitude.
  *   **Why it matters:** If blame is a reactive attitude, it is constitutive of relationships. To say a hypocrite *cannot* blame is to say they cannot participate in the relationship. But they *do* participate, and their resentment *does* register. The theory must explain the phenomenon, not legislate it away. Rejecting (5) allows the theory to match the phenomenon: the hypocrite resents, the resentment stings, but it stings less because we see the hypocrisy.

  ### Summary of the Moral Life on the Far Side

  If you accept (7) (as your friend urges), moral life becomes a silent monastery. Only saints speak, and they rarely do. Community regulation collapses.

  If you reject (5), moral life looks like a courtroom full of compromised judges. We are all judging one another while carrying our own dockets of unresolved faults. The system works not because the judges are pure, but because the *standards* are robust enough to survive the judges' flaws. We listen to the accusation, weigh the accuser's integrity, and decide how much weight to give the verdict. It is messier, more dangerous, and more human.

  **Diagnosis:** Your friend has mistaken a **defeater** for a **nullifier**. Hypocrisy defeats the *force* of blame; it does not nullify the *act*. Reject (5). Keep (1), (2), and (8).
