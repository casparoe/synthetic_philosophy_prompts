answer: |-
  # The 25-Minute Heritage Filter
  **Based on Hobsbawm (*Invented Traditions*) & Anderson (*Imagined Communities*)**

  **Purpose:** To triage 150 applications/year without requiring staff to be historians, while preventing public funds from cementing falsehoods or funding exclusion.
  **Time Budget:** 5 mins per question.

  ### Phase 1: The Claim (Hobsbawm Check)
  **Question:** Does the application claim the event is "ancient," "traditional," or "unchanging"?
  *   **Yes:** Proceed to Q2.
  *   **No (e.g., "New Festival"):** Skip to Phase 3 (Anderson Check).
  *   **Stop/No:** If they claim antiquity *and* you find a definitive start date within living memory (e.g., "First held 1995") *and* they are still claiming "Medieval origins" in public materials. This is demonstrable fraud. Refer to Legal.

  ### Phase 2: The Continuity (The "60-Year" Rule)
  **Question:** Is there evidence of uninterrupted practice, or is there a gap >20 years?
  *   **Uninterrupted:** Pass to Phase 3.
  *   **Gap >20 years (Revival):** **Flag as "Revived Tradition."**
      *   *Sufficient Answer:* Applicant admits the gap and frames the revival as "keeping the spirit alive."
      *   *Insufficient Answer:* Applicant insists the gap didn't happen or claims the 1990 version is identical to the 1690 version.
  *   **Stop/No:** If the "tradition" was created solely for a tourism brochure or one-off event with no community uptake.

  ### Phase 3: The Function (Anderson Check)
  **Question:** Who is the "We" in this application? Does the event make strangers feel like neighbors?
  *   **Inclusive/Integrative:** (e.g., "Whole town attends," "Newcomers welcome"). **Green Light.**
  *   **Exclusive/Protective:** (e.g., "Descendants only," "Men only," "Private Club"). **Amber Light (Values Hand-off).**
  *   **Stop/No:** If the event actively humiliates or targets a specific protected group (beyond mere exclusion).

  ### Phase 4: The Honesty (The "Schoolteacher" Test)
  **Question:** If the tradition is invented/revived, is the origin story known?
  *   **Known & Accepted:** (e.g., "Started by Mrs. Jones in 1948 to boost morale"). **Green Light.** (Hobsbawm: Invented $\neq$ Worthless).
  *   **Known & Denied:** (e.g., "Started by Mrs. Jones" is in the archives, but applicants call it "Pagan"). **Amber Light (Values Hand-off).**
  *   **Unknown:** Assume benign until proven otherwise.

  ---

  ### Critical Distinctions: Keep vs. Drop

  **KEEP (Must survive the dumbing down):**
  1.  **Claim vs. Fact:** The committee can fund a 1948 event, but they cannot fund it *as* a Medieval event. The grant category must match the reality.
  2.  **Invention vs. Value:** A tradition started by a schoolteacher in 1948 has done 75 years of community work. It is socially "real" even if historically "fake." Do not reject based on invention alone.
  3.  **Continuity vs. Revival:** A tradition that died for 60 years and came back is a *new* tradition using old props. It does not have the same claim to "immemorial custom."

  **DROP (Too complex for 25 mins):**
  1.  **"Authenticity":** Too subjective. Replace with "Consistency of Practice."
  2.  **Specific Dates:** Don't argue 1640 vs 1740. Argue "Pre-Industrial" vs "Post-War."
  3.  **Symbolic Lineage:** Don't trace the maypole's phallic roots. Ask: "Does it bring people together?"

  ---

  ### Failure Modes: Where the Procedure Misfires

  1.  **The Circular Evidence Trap:**
      *   *The Problem:* The only proof the tradition is old is the tradition's own pamphlets, which say it is old.
      *   *The Misfire:* Staff accept the applicant's history as fact because there is no contradictory evidence on file.
      *   *The Fix:* If the *only* evidence is internal, default to "Claimed Heritage" not "Verified Heritage." Fund the community aspect, not the history aspect.

  2.  **The "Living Memory" Blindspot:**
      *   *The Problem:* A tradition started in 1955 is now "history" to a 20-year-old applicant.
      *   *The Misfire:* Staff classify it as "Ancient" because no one on staff is 70.
      *   *The Fix:* The "60-Year Rule." Anything starting after 1965 is automatically "Modern Community Event," regardless of costume.

  3.  **The Values Hand-off Evasion:**
      *   *The Problem:* Staff mark "Exclusive" as "Amber" but don't explain *why* it's a risk.
      *   *The Misfire:* Committee treats "Amber" as "Fundable with notes."
      *   *The Fix:** "Amber" requires a written note: *"Public funds for private exclusion creates reputational risk."* Force the elected members to take the heat.

  ---

  ### Case Studies: Running the Filter

  #### File A: The 'Medieval' Harvest Rite
  *   **Profile:** First documented 1948. Started by a schoolteacher. Applicants claim "Unbroken Medieval Lineage."
  *   **Phase 1 (Claim):** Yes ("Medieval").
  *   **Phase 2 (Continuity):** Fail. 1948 start is post-war, not medieval. Gap between "Medieval" and 1948 is infinite.
  *   **Phase 4 (Honesty):** Fail. Origin is known (schoolteacher) but denied by applicants.
  *   **Procedure Output:** **Amber Light (Values Hand-off).**
      *   *Recommendation:* Fundable as "Community Cohesion," **NOT** as "Heritage Preservation."
      *   *Required Label:* "Mid-20th Century Local Custom."
      *   *Committee Reaction:* **HATE.** This triggers the exact insecurity mentioned in your brief. They want to fund "Ancient Heritage." This procedure forces them to admit they are funding a 1948 invention. They will argue that 75 years *is* history. You must hold the line: It is heritage *now*, but it is not *ancient*.
      *   *Hobsbawm Insight:* It is a classic invented tradition serving to legitimize the post-war village structure. It is valuable, but the label must be honest.

  #### File B: The 17th-Century Procession (Revived 1990)
  *   **Profile:** Genuine 1600s roots. Lapsed 1930–1990. Revived from a printed account. Custodians exclude women and newcomers.
  *   **Phase 1 (Claim):** Yes ("17th Century").
  *   **Phase 2 (Continuity):** Fail. 60-year lapse.
      *   *Classification:* "Revived Tradition." The current practice is 30 years old, using old scripts.
  *   **Phase 3 (Function):** Fail. "Exclusive/Protective." No women, no newcomers.
  *   **Procedure Output:** **Red Light / Values Hand-off.**
      *   *Recommendation:* Do not fund under "Heritage." If funded under "Community," requires written guarantee of open membership.
      *   *Rationale:* Anderson argues communities are *imagined* through inclusion. Public funds cannot support the *dis-imagining* of community members (women/newcomers).
      *   *Committee Reaction:* Annoyance. They see "17th Century" and "Local Lads." They will call this "interference." However, the exclusion gives you the legal cover to say no, which protects you from the "60-year" history argument.

  #### File C: The Immigrant Street Carnival
  *   **Profile:** Invented 30 years ago. Immigrant families. No antiquity claim ("Celebrating our new home").
  *   **Phase 1 (Claim):** No.
  *   **Phase 2 (Continuity):** N/A (Modern event).
  *   **Phase 3 (Function):** Pass. High integration, "Whole street attends."
  *   **Procedure Output:** **Green Light.**
      *   *Recommendation:* Fund under "Community Cohesion."
      *   *Rationale:* Perfect Andersonian case. Strangers becoming neighbors through shared ritual.
      *   *Committee Reaction:* Mild indifference. It doesn't threaten their historical narrative, but it doesn't feed it either. It's safe money.

  ### Summary of Friction
  **File A** is the danger zone. The procedure correctly identifies it as a Hobsbawm-style invention (useful social glue, false historical claim). By forcing the label change from "Medieval" to "1948," you protect the council from looking foolish if a historian writes to the local paper, but you force the Committee to vote on a "less prestigious" grant. They will hate that. Stand firm: **We fund the community value, not the lie.**
