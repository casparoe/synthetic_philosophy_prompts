      *   *Why is it wrong (in this context)?* Subsidiarity isn't *just* about efficiency/outcomes. It's also about *legitimacy*, *agency*, *experimentation*, and *preference satisfaction*. A local decision might be "less efficient" globally (due to externalities) but "more competent" democratically because it reflects local values.
      *   *Alternative:* Step (1) is also vulnerable. "Lowest level that can handle it" doesn't necessarily mean "lowest level that produces the *optimal* outcome." It might mean "lowest level that can produce a *satisfactory* outcome without violating rights."
