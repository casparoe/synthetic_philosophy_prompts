answer: |-
  This is a classic federalism dilemma, and your friend R has deployed a very sharp, technocratic version of the "externality argument." It's the kind of argument that wins debates in policy seminars but often fails in political theory.

  You want to keep (3) (locals ignore external costs) and (5) (everything has spillovers). That is a smart constraint, because those are the empirically strongest premises. If you deny (5), you look like a libertarian fantasist; if you deny (3), you look like you don't understand economics.

  Here is where you break his chain, why it looked invisible, and what it costs you.

  ### The Break Point: Step (2)

  **The Premise:** *"To handle a matter competently just is to produce outcomes at least as good as a higher level would produce."*

  **Why it looks safe:**
  It sounds like a tautology. What else would "competence" mean? If a local government makes a mess of things, and the central government could have done it cleaner, wasn't the central government more "competent"? It frames governance as a technical engineering problem where the goal is simply to maximize net welfare (e.g., clean water + economic output).

  **Why it fails:**
  Step (2) smuggles in a **monistic theory of value**. It assumes the *only* metric for a "good outcome" is the substantive policy result (e.g., pollution levels, GDP). It ignores the **procedural value** of self-determination.

  In political theory, a "good outcome" includes *who decided it*. If my state votes to accept slightly higher pollution in exchange for lower taxes and more local industry, that might be "worse" on a global utilitarian calculus (because of the spillover), but it is "better" on a democratic legitimacy calculus because it reflects the actual preferences of the governed.

  By defining competence *solely* as outcome optimization, R rigs the game. He defines "competence" in a way that makes centralization true by definition.

  **The Fix:**
  Redefine competence. A body handles a matter "competently" if it produces a **legitimately binding decision**, not necessarily the **globally optimal** one. Subsidiarity is not about finding the *best* solver; it's about finding the *closest* solver who can solve it *adequately*.

  **The Cost:**
  If you break Step (2), you have to admit that subsidiarity sometimes permits **sub-optimal outcomes**. You are conceding that letting states set river rules might result in more pollution than a federal rule would. You have to argue that the loss in environmental efficiency is the price we pay for the gain in democratic agency. You cannot have it both ways. You cannot claim local control *always* produces better results. You must claim it produces *legitimate* results, even if they are sometimes messier.

  ### The Presumption Defense: Did you hand him that one?

  R's brush-off of your "presumption" defense was too quick, but your formulation was too weak.

  **R's Claim:** A presumption that gets defeated 99% of the time is functionally a rule for centralization.
  **The Problem:** This assumes the "defeat condition" is merely the *existence* of a spillover.

  If your argument is: *"States decide unless there are cross-border effects,"* then R is right. Given (5), the center wins every time.

  **The Stronger Presumption:**
  The presumption should be: *"States decide unless the cross-border effects are **significant and unmanageable** by negotiation."*

  This is the crucial distinction. Just because a river flows through four states doesn't mean the states *cannot* agree on rules. They can form an interstate compact. They can sue each other under nuisance law. They can bargain (Coasean bargaining).

  Centralization is only "competent" (under your revised Step 2) if the transaction costs of local negotiation are higher than the costs of central bureaucracy.

  **Why R is wrong here:**
  He treats externalities as a binary switch (Present = Centralize). In reality, externalities are a spectrum. A little bit of smoke drifting over a border doesn't justify federal takeover; a toxic waste dump upstream does. The "presumption" does work if the burden of proof on the center is to demonstrate **necessity**, not just **spillover**.

  ### The EU Empirical Claim

  Your friend's point about the EU is an empirical observation, not a logical proof.
  *   **Logic:** Subsidiarity *should* prevent unnecessary centralization.
  *   **Reality:** Politicians in Brussels *want* more power.

  The fact that the principle is violated doesn't mean the principle is logically incoherent; it means the political incentives are misaligned. That's a failure of enforcement, not a failure of the theory. You can concede this point without losing the philosophical argument. "The EU violates subsidiarity" is like saying "Speed limits don't work because people speed." It proves people break rules, not that the rules are nonsense.

  ### Summary of Your Counter-Attack

  Here is how you restart the conversation:

  1.  **Concede (3) and (5).** "You're right. Locals ignore spillovers, and almost everything spills over."
  2.  **Strike (2).** "But you defined 'competence' as 'global efficiency.' That begs the question. Governance isn't just about maximizing output; it's about matching policy to local preference. If a state chooses a slightly dirtier river because they value jobs more, that's a competent democratic decision, even if it's not the utilitarian optimum."
  3.  **Repair the Presumption.** "Subsidiarity isn't defeated by the *existence* of spillovers. It's defeated only when the spillovers are too high to be solved by interstate negotiation. The center has to prove that the states *can't* solve it together, not just that they *haven't yet*."
  4.  **Accept the Cost.** "Yes, this means we sometimes tolerate more pollution than a dictatorship of experts would allow. That is the tax we pay for federalism."

  **The Verdict:**
  You didn't lose the thread; you just let him define the terms. He defined "winning" as "maximizing environmental efficiency." You need to redefine "winning" as "maximizing legitimate self-government." Once you do that, Step (2) collapses, and the centralizing conclusion falls with it.
