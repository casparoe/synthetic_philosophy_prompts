  # Joint Statement on Causal Attribution in Ledger-Based Agent Architectures

  **Date:** October 26, 2023
  **Parties:** Engineering Team (Representatives R and M)
  **Subject:** Interpretation of Ledger Edit and Activation Patch Experiments

  ### Introduction
  This document formalizes the current state of disagreement regarding the causal structure of our production agent. The system comprises a transformer-based policy and a declarative text store (the "ledger") serialized into the context window. We agree on the empirical results of two interventions: editing the ledger text changes behavior robustly, and patching the policy's hidden activations changes behavior without touching the ledger.

  The core question organizing this inquiry is: **When a ledger fact changes what the agent does, do symbols push the substrate around, or does the substrate push itself around in a pattern we find convenient to describe with symbols?** To facilitate collaboration, we distinguish two components of R's position: *Causal Efficacy* (symbols actively drive changes) and *Explanatory Irreducibility* (symbol-level descriptions are necessary for full understanding). M objects primarily to Causal Efficacy.

  ### 1. Agreed Claims
  The following claims are accepted by both parties as fact or shared working assumption.

  1.  The system is deterministic given fixed weights, random seeds, and input streams.
  2.  The ledger is physically stored on hardware and serialized as text tokens into the model's context window.
  3.  Both ledger edits and activation patches alter downstream tool calls without retraining the model.
  4.  Neither intervention modifies the transformer's learned weights; both are inference-time perturbations.
  5.  The linear probe identifies ledger-related propositions in hidden states with statistically significant accuracy.
  6.  "Cause" in this document refers to counterfactual dependence: if the intervention had not occurred, the specific behavior would not have occurred.
  7.  Both interventions generalize across minor prompt rewordings and shuffling.
  8.  The ledger is engineered to stabilize state tracking across long conversation turns.
  9.  Activation patching is a valid diagnostic tool for locating information representations in hidden states.
  10. **Shared Pragmatic Claim:** Both agree that removing the ledger would significantly increase training costs to achieve equivalent state consistency.
  11. Both agree the proposition is "realized" in the network activity, though the mechanism of realization is disputed. [Ambiguity Flag: "Realized" implies physical instantiation to M, but functional mapping to R.]
  12. Both agree external behavioral observation alone cannot distinguish the source of the causal trigger.
  13. Both agree the ledger is not magically exempt from physics; it is subject to the same hardware constraints as the GPU memory.
  14. Both agree further empirical testing is required to resolve the ontological dispute regarding causality.

  ### 2. Disagreements
  The following table outlines where interpretations diverge. We explicitly mark disputes that are verbal (definitions) versus substantive (predictions about reality).

  | Disagreement | R's Formulation (Causal Efficacy) | M's Formulation (Causal Closure) | Type & Justification |
  | :--- | :--- | :--- | :--- |
  | **Locus of Control** | The proposition itself ("account suspended") is the cause; the text and activations are merely how the system accesses that fact. | The activations are the cause; the proposition is a high-level description of the activation pattern, not a driver. | **Substantive.** Disagrees on which layer holds the causal power, leading to different predictions about intervention failure modes. |
  | **Privilege of Ledger** | The ledger is a privileged causal channel because it encodes content invariant to specific vector realizations. | The ledger is one of many input routes; activation patching proves the ledger is not uniquely required for the behavior. | **Substantive.** R predicts ledger edits generalize better than patches; M predicts parity. |
  | **Causal Closure** | Symbol-level facts can exert downward causation (higher-level patterns influencing lower-level mechanics) without violating physics. | **Causal Closure** (the idea that physical events have only physical causes) holds; treating symbols as causes double-counts the physical mechanism. | **Verbal/Substantive Mix.** Disagreement on whether "cause" applies to abstract facts or only physical states. |
  | **Explanatory Necessity** | You cannot fully explain the agent's behavior without referencing the symbolic content of the ledger. | You can fully explain the behavior using only weights, activations, and token IDs; symbols are a compression for human convenience. | **Substantive.** Disagrees on whether a complete low-level story leaves explanatory work remaining for the symbol. |

  ### 3. Cruxes
  These are sub-questions where settling the fact would move at least one party's position. We propose concrete tests for each.

  **Crux 1: The Clamped Substrate Test**
  *   **Question:** If we prevent the ledger edit from influencing the specific probed activation subspace, does the behavior change still occur?
  *   **Test:** Perform a ledger edit while simultaneously applying a negative activation patch that cancels out the specific direction the ledger usually influences.
  *   **R's Prediction:** The behavior change may persist via alternative pathways because the *fact* was updated, proving the symbol pushes the substrate through multiple routes.
  *   **M's Prediction:** The behavior change will vanish because the physical mechanism (the activation vector) was blocked, proving the substrate pushes itself.
  *   **Revision Condition:** R revises if behavior vanishes completely; M revises if behavior persists robustly.

  **Crux 2: The Novel Semantics Test**
  *   **Question:** Does the ledger generalize to propositions the model never encountered during training better than activation patching does?
  *   **Test:** Introduce a entirely new proposition type into the ledger (e.g., "user is a time traveler") and compare ledger edit efficacy vs. activation patch efficacy.
  *   **R's Prediction:** Ledger edits will work better because the transformer can read the text semantically, whereas the activation subspace for this novel concept does not exist yet.
  *   **M's Prediction:** Both will fail equally or succeed equally, as both rely on the model's existing capacity to map inputs to outputs.
  *   **Revision Condition:** R revises if ledger edits fail to generalize beyond trained concepts; M revises if ledger edits show significant out-of-distribution superiority.

  **Crux 3: The Interference Test**
  *   **Question:** Is the ledger effect mediated *entirely* through the probed subspace?
  *   **Test:** Measure how much of the ledger's behavioral effect is captured by patching only the probed direction versus the whole layer.
  *   **R's Prediction:** Patching the probed direction will capture only part of the effect, as the symbol is realized diffusely.
  *   **M's Prediction:** Patching the probed direction will capture nearly all of the effect, as that direction *is* the representation.
  *   **Revision Condition:** R revises if the probed direction accounts for >90% of the effect; M revises if it accounts for <50%.

  ### 4. Falsifiers
  To maintain intellectual honesty, each party specifies what evidence would compel them to abandon their current view.

  **Falsifiers for R (Symbolic Causality)**
  *   **Activation Blockade:** If we can completely neutralize the behavioral effect of a ledger edit by patching only the identified activation direction, it suggests the symbol has no independent causal power beyond that vector.
  *   **Semantic Insensitivity:** If changing the ledger text to semantically identical but syntactically obscure strings (which the model fails to parse) produces the same behavioral change as clear text, it suggests the "meaning" is irrelevant, contradicting the claim that the proposition itself is the cause.
  *   **Hardware Dependency:** If moving the ledger storage to a slower medium changes the causal outcome independent of content, it undermines the claim that the abstract fact is the driver.

  **Falsifiers for M (Substrate Causality)**
  *   **Generalization Gap:** If ledger edits successfully trigger correct behaviors in contexts where activation patches fail (specifically in out-of-distribution scenarios), it suggests the symbolic interface provides causal leverage the substrate alone lacks.
  *   **Multiple Realizability:** If the same behavioral change can be triggered by editing the ledger, but the corresponding activation pattern differs significantly across contexts, it challenges the claim that the specific activation vector is the sole cause.
  *   **Predictive Failure:** If a complete low-level explanation (weights and activations) fails to predict behavior that a high-level symbolic explanation predicts correctly, it suggests the substrate story is incomplete.

  ### Signatures

