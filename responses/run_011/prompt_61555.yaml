answer: |-
  Here is an analysis of your senior author's taxonomic logic, a prediction for the mesa population, and guidance for your draft.

  ### 1. Prediction: The Verdict on the Mesa Population

  **Verdict:** She will call the mesa population a **distinct species**.

  **Reasoning:** She will distinguish between the *historical lineage status* (4,000 years of isolation) and the *current anthropogenic disturbance* (30 years of reconnection). Her track record shows she prioritizes evidence of independent evolutionary trajectories (fixed diagnosis, ecological distinctness, reproductive barriers) over strict genetic monophyly when the history supports separation.

  **Does the timing matter?** Yes. She will reason about the population primarily as it stood during the 4,000 years of isolation. She views the road cut as an artificial breach of a natural barrier, analogous to an experimental transplant rather than natural secondary contact. The absence of backcrosses despite 30 years of potential contact (roughly 10–20 snail generations) suggests intrinsic barriers are re-asserting themselves, aligning this case with her **Case 7 (Hybrid Zone)** verdict rather than a lumping scenario.

  ### 2. Candidate Rules Consistent with Past Verdicts

  We can discard the "crudest versions" of standard concepts immediately. Strict Biological Species Concept (BSC) is excluded by **Case 3 (Ring)** (terminals don't interbreed but are lumped) and **Case 4 (Parthenogenetic)** (named despite no sex). Strict Phylogenetic Species Concept (PSC) is excluded by **Case 3** (terminals diagnosable but lumped due to connectivity) and **Case 5** (withheld despite allopatry due to lack of fixed diagnosis).

  Three candidate rules survive the seven precedents:

  **Rule A: The Cohesion Species Concept (Exchangeability + Common Fate)**
  *   **Logic:** A species is the most inclusive group of organisms having the potential for genetic and/or demographic exchangeability.
  *   **Fit:** Explains **Case 3** (Ring) perfectly (exchangeability through the chain lumps the terminals). Explains **Case 2** and **Case 7** (lack of exchangeability splits). Explains **Case 1** (no exchangeability due to distance).
  *   **Mesa Prediction:** **Split.** The 4,000-year isolation indicates a lack of historical exchangeability. The 30-year contact is insufficient to establish demographic cohesion, especially with no backcrosses. The distinct ecology implies different selective fates.
  *   **Weakness:** Struggles slightly with **Case 4** (Parthenogenetic) without the footnote, as "exchangeability" is ill-defined in asexuals.

  **Rule B: Pragmatic Lineage Pluralism (History + Diagnosis)**
  *   **Logic:** A species is a separately evolving metapopulation lineage. Status is assigned based on the *weight of evidence* for independence (morphology, ecology, genetics), with nomenclature serving as a tool for communication (hence footnotes).
  *   **Fit:** Explains the **Footnotes** in **Case 4** and **Case 6** (acknowledging when the "lineage" concept is stretched). Explains **Case 5** (withholding when evidence is weak). Explains **Case 3** (the ring is one lineage despite terminal divergence).
  *   **Mesa Prediction:** **Split.** The "claim about lineage history" (her quote) favors the 4,000-year separation. The fixed shell characters provide the necessary diagnosis. The nested mtDNA is treated as incomplete lineage sorting, not evidence of unity.
  *   **Weakness:** Requires subjective weighting of evidence (e.g., why does morphology trump mtDNA here when it didn't in Case 2?).

  **Rule C: Ecological-Biological Hybrid (Barriers + Niche)**
  *   **Logic:** Species are defined by reproductive isolation, but ecological distinctness can substitute for strict isolation if diagnosis is fixed.
  *   **Fit:** Explains **Case 2** (ecological isolation splits despite shell similarity). Explains **Case 7** (assortative mating + prey diffs split).
  *   **Mesa Prediction:** **Split.** Distinct thermal/chemical regime + fixed shell chars.
  *   **Weakness:** Fails **Case 3** (Ring). The terminal links in the ring have different ecology and don't interbreed, yet were lumped. This rule cannot explain why connectivity overrides terminal isolation in the ring but not elsewhere.

  **Elimination:** **Rule C** is discarded because it cannot account for **Case 3**. **Rule A** and **Rule B** remain. They are functionally similar but differ in emphasis: Rule A emphasizes *process* (exchangeability), Rule B emphasizes *pattern/history* (lineage independence). Given her quote ("claim about a lineage's history"), **Rule B** is the stronger descriptor of her philosophy, while Rule A is the mechanism she uses to detect it.

  ### 3. Best Guess and Rationale

  **My Best Guess:** She will apply **Rule B (Pragmatic Lineage Pluralism)**. She will name the mesa snails a **species**, likely *genus species-mesa*, with a text note regarding the contact zone but **without** the "bookkeeping" footnote used for the parthenogens.

  **Why this rule?**
  1.  **The Quote:** "A species name is a claim about a lineage's history." This is the General Lineage Concept. It prioritizes the *separate evolutionary trajectory* over current genetic snapshots. The 4,000-year isolation is the history; the mtDNA nesting is a snapshot.
  2.  **The Footnotes:** She only used footnotes when the "lineage" concept was fundamentally broken (asexuals in **Case 4**, dead organisms in **Case 6**). The mesa snails are sexual and living. She will not use a footnote because the lineage claim is robust, even if the genetics are messy.
  3.  **The Precedents:** In **Case 2**, she split populations with *identical* shells based on nuclear markers and ecology. In the Mesa case, she has *fixed* shell differences and distinct ecology. If ecology/nuclei trumped shell in Case 2, fixed shell/ecology should trump mtDNA paraphyly in the Mesa case.
  4.  **The Ring Case:** This is the key. She lumped the ring because it was *one continuous lineage*. She will split the mesa because it was *two discontinuous lineages* artificially joined. The road cut does not erase 4,000 years of history.

  ### 4. The Critical Test Case

  To sharply separate **Rule A (Cohesion/Exchangeability)** from **Rule B (Lineage History)**, you need a case where history and current exchangeability contradict.

  **The Case:** A population that is **monophyletic and deeply divergent (500,000+ years)** based on nuclear genomics, occupying a distinct habitat, but which **freely interbreeds** with a neighboring population upon secondary contact with **no loss of fitness** and **no fixed morphological diagnosis**.

  *   **Rule A (Cohesion) Prediction:** **Lump.** If they exchange genes freely and share a common fate now, they are one cohesion species, regardless of past divergence.
  *   **Rule B (Lineage History) Prediction:** **Split.** If they have a long, separate history (deep divergence), they are separate lineages that have merely lost the *ability* to remain separate (fusion).
  *   **Why this separates them:** The Mesa case is ambiguous because barriers *might* still exist (no backcrosses). A case with *proven* free interbreeding forces a choice between "History" (her quote) and "Process" (her ring verdict).

  **Alternative Observation in the Mesa Complex:**
  Watch the **fate of the hybrids**. If backcrosses appear and the mesa morph disappears within 50 years (swamping), Rule A would suggest they were never separate species (cohesion won). Rule B would suggest the species went extinct (lineage terminated). If she treats the disappearance as *extinction of a species*, she is a Lineage Pluralist. If she treats it as *merging of variants*, she is a Cohesionist.

  ### 5. Drafting Advice

  You need to write text that supports the "Species" verdict (which is likely) but remains defensible if she decides to "Lump" based on the mtDNA. You must align with her "Lineage History" philosophy.

  **Recommended Wording Strategy:**
  Do not write: *"The mesa population is a species because it is genetically distinct."* (It isn't).
  Do not write: *"The mesa population is a species because it looks different."* (Too simplistic).
  **Do write:** *"The mesa population represents a historically independent evolutionary lineage, isolated for approximately 4,000 years, diagnosed by fixed morphological characters and distinct ecological parameters. Although recent anthropogenic disturbance has facilitated limited contact with the North Fork population, the absence of backcrossing and the persistence of diagnostic traits in the source spring indicate maintained lineage integrity."*

  **Why this works:**
  1.  **"Historically independent evolutionary lineage":** Directly echoes her quote and justifies the split despite mtDNA nesting.
  2.  **"Anthropogenic disturbance":** Frames the road cut as noise, not natural secondary contact (distinguishing from Case 3 Ring).
  3.  **"Maintained lineage integrity":** Leaves room for her to change her mind. If she decides the integrity is lost, you can change "indicate" to "suggest."
  4.  **Conservation Commitment:** This wording commits you to the **Evolutionarily Significant Unit (ESU)** concept. Even if she lumps them taxonomically (e.g., as a subspecies or population), the text establishes them as a conservation priority based on history and diagnosis. This satisfies the committee regardless of the binomen.

  **Final Commitment:**
  By drafting it this way, you adopt the commitment that **taxonomic status is a hypothesis of historical independence, not merely a measure of current genetic distance.** This aligns with her 30-year track record and protects you if she decides the mtDNA nesting forces a lump—you can argue the *lineage* is still valid for conservation even if the *name* changes.
