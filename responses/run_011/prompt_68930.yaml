answer: |-
  ### Part I: Desiderata for an Adequate Theory of Epistemic Utility

  The following table specifies the requirements for a theory of epistemic utility intended to underwrite accuracy-first norms. Each entry includes the motivation, its status (non-negotiable for the core program or partisan/preferential), and the class of measures it excludes.

  | Requirement | Motivation / Concrete Case | Status | Eliminates / Rules Out |
  | :--- | :--- | :--- | :--- |
  | **Truth-Directedness** | **Motivation:** The fundamental epistemic goal is believing truths and disbelieving falsehoods. A measure that rates a false belief higher as confidence increases fails the basic definition of "accuracy."<br>**Case:** A measure that rewards "calibration" (matching frequencies) even when the agent is confidently wrong about the underlying mechanism. | **Non-Negotiable** | Pragmatic scoring rules (e.g., those weighted by betting utility); measures that prioritize coherence over correspondence. |
  | **Strict Propriety (Immodesty)** | **Motivation:** A rational credal state should not expect an alternative state to be more accurate. If $p$ expects $q$ to be better, the agent ought to switch to $q$, making $p$ unstable.<br>**Case:** Prevents "self-doubt" loops where an agent constantly shifts credences without new evidence. | **Non-Negotiable** (for dominance arguments) | Non-strictly proper scores (e.g., Absolute Distance/Linear Score); measures where extreme credences are not uniquely optimal when certain. |
  | **Additivity** | **Motivation:** The accuracy of a total doxastic state should be the sum of the accuracies of its constituent judgments. This allows local updates without recalculating global coherence.<br>**Case:** Enables the proof that incoherent (non-probabilistic) credences are dominated by coherent ones. | **Partisan** | Holistic measures (e.g., those scoring the web of belief as a single unit); measures requiring global coherence checks before local scoring. |
  | **Continuity & Extremes** | **Motivation:** How the measure treats credence 0 and 1. Does certainty in a falsehood merit finite or infinite penalty?<br>**Case:** **Infinite Penalty:** Dogmatism is epistemically fatal (Logarithmic). **Finite Penalty:** Dogmatism is very bad but recoverable (Quadratic/Brier). | **Partisan** | **If Infinite Required:** Eliminates Brier/Quadratic family.<br>**If Finite Required:** Eliminates Logarithmic family. |
  | **Partition Invariance** | **Motivation:** Accuracy should not depend on how the question is linguistically carved up.<br>**Case:** Splitting "Candidate A wins" into "Candidate A wins by <1%" and "Candidate A wins by >1%" should not change the score for believing "Candidate A wins." | **Non-Negotiable** | Naive additive scores that count propositions rather than information content; measures sensitive to the size of the algebra. |
  | **Uniqueness** | **Motivation:** Is there exactly one true distance from truth, or a class of admissible measures?<br>**Case:** If uniqueness is required, the theory must derive *why* Log is better than Brier (or vice versa) from first principles. | **Partisan** (usually bracketed) | **If Required:** Eliminates almost all existing theories (which typically defend a *class* of proper scores).<br>**If Bracketed:** Allows any strictly proper measure. |
  | **Imprecise Extension** | **Motivation:** Evidence sometimes underdetermines a precise number. Can the theory handle sets of probabilities or comparative rankings?<br>**Case:** An agent who can only say "Event A is more likely than Event B" without assigning numbers. | **Partisan** | **If Required:** Eliminates standard precise credence frameworks.<br>**If Not Required:** Eliminates theories of imprecise probability. |
  | **Followability** | **Motivation:** "Ought implies can." The norm must be computable or accessible by the agent.<br>**Case:** An agent cannot conditionalize on a partition she cannot enumerate. A norm requiring logical omniscience is useless. | **Non-Negotiable** | Idealized norms requiring infinite computational power; norms requiring access to unconscious credal states. |

  ---

  ### Part II: The Trilemma (Purity, Immodesty, Guidance)

  You suspect three requirements cannot be jointly satisfied:
  1.  **Alethic Purity:** Doxastic norms are derived solely from truth-accuracy relations, without premises about choice, preference, or action.
  2.  **Immodesty:** (Strict Propriety) Every rational credal state expects itself to be the most accurate.
  3.  **Guidance:** The theory yields determinate verdicts for an agent unsure of what her evidence requires (e.g., unsure if she has conditionalized correctly).

  **The Incompatibility Argument**
  These three form an inconsistent triad.
  *   **Guidance** requires that an agent who suspects she has processed evidence incorrectly (e.g., failed to conditionalize) has a norm telling her to *correct* her current credence $p$ to a target $p^*$.
  *   **Immodesty** dictates that her current credence $p$ must expect *itself* to be more accurate than any alternative, including $p^*$. From the perspective of $p$, moving to $p^*$ is accuracy-decreasing.
  *   **Alethic Purity** forbids appealing to external, non-accuracy-based reasons (e.g., "follow the algorithm because it is reliable") to override $p$'s self-assessment. The only reason to move from $p$ to $p^*$ must be that $p^*$ is expected to be more accurate.
  *   **Conflict:** If the agent is unsure if she conditionalized correctly, she is effectively operating with a potentially defective $p$. To have **Guidance**, she needs a norm that overrides $p$'s self-assessment. But **Immodesty** ensures $p$ validates itself. **Alethic Purity** prevents her from using a pragmatic rule (like "trust the calculation method") to break the tie, because that imports decision-theoretic premises.
  *   **Result:** You cannot have a theory that is purely truth-based, demands self-validation, and yet guides a fallible agent who doubts her own processing.

  **Recommendation: Surrender Immodesty**
  For a public policy forecasting program, **Immodesty** is the requirement to surrender.
  *   **Why:** In high-stakes, complex environments, agents *ought* to be modest. If a forecaster knows her cognitive processing is fallible (or that she might have misapplied a rule), a theory that tells her "your current state is optimal by your own lights" is dangerous. It immunizes error.
  *   **The Cost:** You lose the elegant dominance proofs that rely on every state expecting itself to be best. You must replace them with norms that allow for "calibrated modesty," where an agent acknowledges her current state might be dominated by a state she cannot currently fully inhabit or validate.
  *   **Alternative:** Surrendering **Alethic Purity** is the second-best option (allowing pragmatic reasons to guide belief), but this risks collapsing epistemic norms into pragmatic ones. Surrendering **Guidance** is unacceptable for a training program.

  ---

  ### Part III: Proxy Divergence and the Two Lists

  You ask whether the desiderata survive when the target of assessment is a **proxy** (committee judgment/aggregate) rather than **truth**, and whether strict propriety can avoid rewarding divergence (matching a wrong proxy).

  **1. Can Strict Propriety Avoid Divergence?**
  **No.** This is a mathematical necessity.
  *   A strictly proper score is defined relative to a target distribution. It incentivizes the forecaster to report their true expectation of that target.
  *   If the scoring target is the **Proxy**, strict propriety incentivizes the forecaster to match the **Proxy**.
  *   If the Proxy is expected to be wrong about the Fact, strict propriety *requires* the forecaster to diverge from the Fact to maximize score.
  *   Therefore, **Strict Propriety relative to a Proxy is precisely the feature that produces Proxy Divergence.**

  **2. One List or Two?**
  There are **two distinct lists**. You are conflating **Epistemic Norms** (how one ought to believe) with **Incentive Mechanisms** (how one ought to report for a tournament).
  *   **List A (Epistemic):** Target = Truth. Desiderata = Truth-Directedness, Alethic Purity.
  *   **List B (Tournament):** Target = Proxy. Desiderata = Solvability, Dispute-Resolution, Budget Balance.

  **3. Which Desiderata Survive, Restated, or Lapse?**

  | Desideratum | Status under Proxy Scoring | Reasoning |
  | :--- | :--- | :--- |
  | **Truth-Directedness** | **Lapses** | The score is no longer directed at truth, but at the verdict. |
  | **Strict Propriety** | **Restated** | Must be "Proxy-Propriety" (expecting to match the resolver). If kept as "Truth-Propriety," it is uncomputable (Truth is unknown). |
  | **Partition Invariance** | **Survives** | Linguistic framing should not affect scoring regardless of target. |
  | **Alethic Purity** | **Lapses** | The norm is now institutional (matching the resolver), not epistemic. |
  | **Followability** | **Survives** | Forecasters still need to be able to compute the target expectation. |

  **4. The Separating Desideratum**
  The single desideratum that does the separating work is **Ontological Target**.
  *   **Definition:** Does the utility function measure distance to *The Way The World Is* (Fact) or *The Way The Resolution Committee Says It Is* (Verdict)?
  *   **Function:**
      *   If **Fact**: You retain Epistemic Utility. You cannot run a tournament (Truth is unknown).
      *   If **Verdict**: You can run a tournament. You lose Epistemic Utility (you reward consensus, not accuracy).
  *   **Implication:** You cannot have a strictly proper score that rewards Truth-Tracking when the payout is determined by a Proxy. To mitigate this, you must abandon Strict Propriety relative to the Proxy in favor of a **Truth-Adjusted Score** (e.g., scoring against the proxy only after a delay, or using a model to correct proxy bias), but this introduces external assumptions that violate Alethic Purity.

  **Conclusion for the Program**
  For your 25-year horizon questions, you are not measuring epistemic utility. You are measuring **institutional alignment**.
  *   **Do not claim** the tournament scores reflect "accuracy" in the philosophical sense.
  *   **Do not use** a strictly proper score relative to the proxy if you want to discourage herding around a potentially wrong committee.
  *   **The Fix:** If you want to reward Truth-Tracking despite Proxy resolution, you must use a score that is *improper* relative to the Proxy (penalizing agreement with the Proxy when independent evidence suggests the Proxy is wrong). This requires sacrificing **Strict Propriety** in the tournament design to preserve **Truth-Directedness** in the incentive structure.

  **Final Verdict:** There are two lists. The separating desideratum is **Ontological Target**. If you score against a proxy, you are no longer in the business of epistemic utility; you are in the business of contract enforcement. Acknowledge this distinction explicitly in your documentation to avoid conflating "winning the tournament" with "believing correctly."
