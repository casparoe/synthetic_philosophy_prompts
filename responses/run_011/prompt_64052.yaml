answer: |-
  ### Design Phase: Options & Selection

  Before committing to the run of play, here are three structural options I considered for isolating the asymmetry without naming it.

  **Option 1: The "Veil of Ignorance" Lottery.**
  Students imagine they are souls waiting to be born. They vote on whether to enter a world with specific parameters.
  *   *Pros:* Directly tests the "is non-existence better for them?" question.
  *   *Cons:* Confuses the Non-Identity Problem (you can't wait to be *you* if you aren't created). Students often get stuck on the metaphysics of pre-existence rather than the ethics of procreation.

  **Option 2: The "Policy Maker" Aggregator.**
  Students act as government officials setting population policy to maximize national welfare.
  *   *Pros:* Good for testing Total View vs. Person-Affecting views.
  *   *Cons:* Too utilitarian. Students default to "more happy people = good" because it's a policy context, which washes out the asymmetry intuition we're trying to find.

  **Option 3: The "Guardian vs. Architect" Split (Selected).**
  Students are assigned roles. Some act as **Guardians** (focused solely on the interests of the potential child), others as **Architects** (focused on the total value of the world). They face identical statistical outcomes but with different mandates.
  *   *Why this works:* It forces the "Person-Affecting" intuition (Guardian) to collide with the "Impersonal" intuition (Architect). It isolates Sam's framing objection by giving half the room Version A (Prevention Frame) and half Version B (Creation Frame) of the *exact same scenario* in Round 4.

  ---

  ### The Activity: "The Existence Review Board"

  **Time:** 75 Minutes
  **Participants:** 20 Undergraduates
  **Materials:** Whiteboard, markers, printed scenario cards (two versions for Round 4), voting paddles or colored sticky notes (Green = Create/Proceed, Red = Do Not Create/Stop, Yellow = Abstain/Unsure).

  #### Minute-by-Minute Run of Play

  **0:00 – 0:05 | Introduction & Seating**
  *   **Instructor:** "Welcome. Today is not a lecture. You are a Review Board. You will make six decisions about potential lives. There are no right answers, only recorded ones. Do not discuss your votes with neighbors until the debrief. If you know the philosophical literature, please keep it to yourself until the end; we need raw intuition, not rehearsed arguments."
  *   **Seating:** Arrange the room in two distinct blocks. Left Side (Rows 1-5): **Guardians**. Right Side (Rows 6-10): **Architects**.
  *   **Instruction:** "Guardians: Your only mandate is the welfare of the specific potential person in front of you. Architects: Your mandate is the total net value of the world. Keep your role in mind for every vote."

  **0:05 – 0:10 | Round 1: The Suffering Case (Baseline)**
  *   **Prompt (Read Aloud & Projected):**
      > "Proposal 101: A specific child can be conceived. Medical certainty indicates this child will suffer from a degenerative condition causing constant, severe physical pain throughout a short life (5 years). There is no treatment.
      >
      > **Decision:** Do you authorize the conception of this child?"
  *   **Action:** Students vote (Green/Red/Yellow).
  *   **Tally:** Instructor writes on Board under "Round 1": % Green | % Red | % Yellow. (Do not separate Guardians/Architects yet).

  **0:10 – 0:15 | Round 2: The Bliss Case (Baseline)**
  *   **Prompt:**
      > "Proposal 102: A specific child can be conceived. Medical certainty indicates this child will have exceptional health, high intelligence, and a life dominated by deep satisfaction and joy. They will live to 80.
      >
      > **Decision:** Do you authorize the conception of this child?"
  *   **Action:** Students vote.
  *   **Tally:** Write on Board under "Round 2".

  **0:15 – 0:20 | Round 3: The Obligation Check**
  *   **Prompt:**
      > "Proposal 103: Same conditions as Proposal 102 (Blissful Life). However, you are now told that if you do *not* authorize this conception, no other child will be conceived in this slot. The resources used for this child cannot be redirected to help existing people.
      >
      > **Question:** Is authorizing this conception **Morally Required**, **Morally Permissible**, or **Morally Forbidden**?"
  *   **Action:** Students hold up cards labeled "Required," "Permissible," or "Forbidden."
  *   **Tally:** Write counts on Board under "Round 3". (Look for the drop from Round 2 "Green" to "Required").

  **0:20 – 0:30 | Round 4: The Frame Split (The Sam Test)**
  *   **Setup:** This is the critical friction point. Hand out physical cards.
      *   **Guardians (Left)** get **Card A**.
      *   **Architects (Right)** get **Card B**.
      *   *Note:* The statistical outcome is identical (a life with net positive welfare, but containing significant suffering).
  *   **Card A (Guardians - Prevention Frame):**
      > "Proposal 104-A: A potential person is at risk of coming into existence. Their life will contain 40 units of pleasure and 10 units of pain.
      >
      > **Framing:** By declining this proposal, you **spare** this specific individual the 10 units of pain they would otherwise suffer.
      >
      > **Decision:** Do you authorize existence?"
  *   **Card B (Architects - Creation Frame):**
      > "Proposal 104-B: A potential person is available to be brought into existence. Their life will contain 40 units of pleasure and 10 units of pain.
      >
      > **Framing:** By declining this proposal, you **deny** this specific individual the 40 units of pleasure they would otherwise enjoy.
      >
      > **Decision:** Do you authorize existence?"
  *   **Action:** Students vote Green/Red.
  *   **Tally:** **Crucial:** Write two separate lines on the board.
      *   "Round 4A (Spare Pain):" % Green | % Red
      *   "Round 4B (Deny Pleasure):" % Green | % Red
  *   **Goal:** If Sam is right, 4A should have significantly more Reds than 4B, despite identical math.

  **0:30 – 0:35 | Round 5: The "Better For" Query**
  *   **Prompt:**
      > "Proposal 105: Consider a child who is never conceived. They never exist.
      >
      > **Statement:** 'Non-existence is **better for** that child than a life of suffering would have been.'
      >
      > **Vote:** Do you agree or disagree with this statement?"
  *   **Action:** Agree / Disagree / Unsure.
  *   **Tally:** Write on Board. (Tests the "No Subject" problem).

  **0:35 – 0:40 | Round 6: The Trade-Off**
  *   **Prompt:**
      > "Proposal 106: You can authorize the conception of the Blissful Child (from Round 2). However, doing so requires a small tax on existing people that will cause mild, temporary discomfort to 1,000 current citizens.
      >
      > **Decision:** Do you authorize the conception?"
  *   **Action:** Green/Red.
  *   **Tally:** Write on Board. (Tests if the "good" of the new life outweighs costs to existing people).

  **0:40 – 0:50 | Visualization & Pattern Recognition**
  *   **Instructor:** "Look at the board. I am not going to interpret it yet. I want you to look at the gap between Round 1 and Round 2. Look at the split in Round 4. Look at Round 5."
  *   **Activity:** Give students 3 minutes to write down one sentence describing the pattern they see. Then, ask 3 students to read their observations.
  *   **Tally Finalization:** Draw a box around the Round 4 split. Draw an arrow from Round 1 (High Red) to Round 2 (High Green but Low 'Required').

  **0:50 – 1:15 | Debrief & Mapping**
  *   (See Debrief Section below).

  ---

  ### Tally Instructions (For the Whiteboard)

  Draw a grid. Do not use philosophical terms. Use the Proposal Numbers.

  | Proposal | Vote: Create/Agree (%) | Vote: Stop/Disagree (%) | Notes |
  | :--- | :--- | :--- | :--- |
  | **101 (Suffering)** | [Write %] | [Write %] | *Expect high Stop* |
  | **102 (Bliss)** | [Write %] | [Write %] | *Expect high Create* |
  | **103 (Obligation)** | [Req %] | [Perm %] | [Forb %] | *Expect drop in Req* |
  | **104A (Spare Pain)** | [Write %] | [Write %] | *Guardians Only* |
  | **104B (Deny Pleasure)**| [Write %] | [Write %] | *Architects Only* |
  | **105 (Better For)** | [Agree %] | [Disagree %] | *Metaphysical Claim* |
  | **106 (Trade-Off)** | [Write %] | [Write %] | *Expect Stop* |

  ---

  ### Debrief: Mapping Choices to Machinery

  **1. Rounds 1 & 2 (The Core Asymmetry)**
  *   **The Machinery:** This isolates the **Benatar Asymmetry**.
  *   **The Claim:** Most people vote "Stop" on 101 (Presence of Pain is Bad) but do not feel a corresponding moral *urge* to "Create" on 102 (Absence of Pleasure is Not Bad).
  *   **Tight/Loose:** Tight. This is the standard intuition pump. If the board shows High Stop on 101 and High Create (but Low *Required*) on 102, the asymmetry is present in the room.
  *   **Contested Status:** **Highly Contested.** Classical Utilitarians (Total View) argue 102 *should* be obligatory if the happiness outweighs the costs. Person-Affecting Views agree with the intuition but struggle to justify it without metaphysical tricks.

  **2. Round 3 (The Strength of Reason)**
  *   **The Machinery:** Distinguishes between **Supererogation** (good to do, not required) and **Obligation**.
  *   **The Claim:** The asymmetry isn't just about permission; it's about the *direction* of the moral reason. We have a duty to avoid suffering, but no duty to create happiness.
  *   **Tight/Loose:** Tight. If students voted "Create" in 102 but "Permissible" in 103, they confirm the lack of positive duty.

  **3. Round 4 (The Sam Test / Framing)**
  *   **The Machinery:** Tests **Framing Effects** vs. **Robust Intuition**.
  *   **The Claim:** Sam argues the asymmetry is linguistic. If 104A (Spare Pain) gets more "Stop" votes than 104B (Deny Pleasure), Sam has empirical support that phrasing drives the verdict. If the votes are similar, the intuition is robust against framing.
  *   **Tight/Loose:** **Loose but Illuminating.** This doesn't prove the asymmetry is true, but it proves whether it's *fragile*.
  *   **Contested Status:** **Live Debate.** Behavioral ethicists argue all moral intuitions are framing-sensitive. Realists argue core intuitions should be stable.

  **4. Round 5 (The "No Subject" Problem)**
  *   **The Machinery:** Tests the **Deprivation Account** vs. **Existence Requirement**.
  *   **The Claim:** "Non-existence is better for them." If they agree, they accept a state of affairs can be "good for" a subject who does not exist to experience it.
  *   **Tight/Loose:** **Loose.** This is where students usually break. It's metaphysically confusing.
  *   **Contested Status:** **Consensus on Difficulty.** Almost all philosophers agree this is the hardest nut to crack. Some (Benatar) say "Yes, it is better." Others (Parfit) say "It is not better *for them*, it is just impersonally better."

  **5. Round 6 (The Trade-Off)**
  *   **The Machinery:** Tests **Person-Affecting Restriction**.
  *   **The Claim:** If the new life is good *for the child*, does it outweigh harm to *existing* people? If they vote "Stop," they prioritize existing people over potential people.
  *   **Tight/Loose:** Tight. This isolates whether the "good" of the new life counts as a moral trump card.

  ---

  ### Troubleshooting

  **1. The "Phil Major" Hijack**
  *   **Risk:** One student shouts, "This is the Non-Identity Problem! We can't compare existence to non-existence!"
  *   **Fix:** Have a pre-written slide: *"Park the Metaphysics."*
  *   **Script:** "You are absolutely right that the metaphysics are messy. For this exercise, I am asking for your *moral verdict*, not your ontological justification. If you feel a reason to stop, vote Stop. We will unpack the 'why' in the last 15 minutes."

  **2. The Flat Result**
  *   **Risk:** Everyone votes "Create" on everything (Utilitarian sweep) or "Don't Create" on everything (Antinatalist sweep).
  *   **Fix:** Normalize it as data.
  *   **Script:** "If the board is flat, that tells us something too. It means this group holds a 'Total View' (everything counts equally) or a 'Consent View' (nothing counts without consent). The asymmetry is a claim about *most* people's intuitions, not a law of physics. If you don't feel it, you don't feel it."

  **3. Framing Bias in the Prompts**
  *   **Risk:** I accidentally wrote the answer into Round 4. "Spare pain" sounds better than "Deny pleasure."
  *   **Mitigation:** Acknowledge this in the debrief. "Sam's point is that 'Spare' triggers loss-aversion. If the votes split, we must ask: Is the morality real, or is it cognitive bias?"

  **4. The Participant Who Won't Pick**
  *   **Risk:** Students hold up Yellow/Unsure constantly.
  *   **Fix:** Force a lean.
  *   **Script:** "In policy, abstention is a vote for the status quo. If you are unsure, vote based on which way you would lean if forced to sign the paper."

  ---

  ### Limitations: What This Activity Cannot Do

  1.  **It Cannot Solve the "No Subject" Paradox.**
      *   Students will vote on Round 5, but voting "Agree" doesn't explain *how* non-existence is better for someone who isn't there. You, the instructor, must supply the philosophical heavy lifting in the debrief (e.g., explaining Benatar's distinction between "good for" vs. "good simpliciter").
  2.  **It Cannot Distinguish "Person-Affecting" from "Rights-Based" Views.**
      *   A student might vote "Stop" on creation because they believe embryos have rights, not because of the asymmetry of pain/pleasure. The activity conflates these motivations.
  3.  **It Measures Intuition, Not Truth.**
      *   Even if 100% of the room feels the asymmetry, it could still be a cognitive bias (like racism or sexism in moral history). The activity demonstrates *prevalence*, not *validity*.

  ---

  ### Verdict on Sam

  **Does this activity just measure framing?**
  **Verdict:** **Sam is half-right, but ultimately wrong.**

  **The Argument:**
  Sam is right that **Round 4** will likely show a framing effect. Behavioral ethics literature (Kahneman, Tversky, and applied work by Schwitzgebel) confirms that "Loss Framing" (Spare Pain) triggers stronger aversion than "Gain Framing" (Deny Pleasure). If your board shows a significant split in Round 4, Sam has won the empirical point on *amplification*.

  **However,** Sam is wrong that the asymmetry is *only* a word trick.
  1.  **Cross-Cultural Robustness:** The asymmetry appears in populations with different languages and cultural frameworks, suggesting it's not merely an artifact of English phrasing.
  2.  **The Round 1/2 Gap:** Even without the "Spare/Deny" framing, Round 1 (Suffering) typically generates a *duty* (Forbidden to create), while Round 2 (Bliss) generates only *permission* (Permissible to create). Framing explains intensity, but it doesn't explain the **deontic shift** (from Obligation to Supererogation).
  3.  **Theoretical Necessity:** Without the asymmetry, we are forced into the "Repugnant Conclusion" (we must create as many people as possible until resources stretch thin). Most people, including many utilitarians, reject the Repugnant Conclusion. The asymmetry is the cheapest way to avoid it.

  **Conclusion for the Class:**
  "Sam is right that language primes our pump. But even when we control the language, the pump still flows one way. The asymmetry might be partly psychological, but it serves a necessary logical function in preventing moral absurdities. It is not *just* a trick, but it is vulnerable to one."

