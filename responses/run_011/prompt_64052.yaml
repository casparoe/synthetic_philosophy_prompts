prompt: |-
  So I've just come off nearly three hours arguing with my flatmate Sam about the procreation asymmetry and my head is absolutely gone, but I've had an idea and I need you to help me turn it into something I can actually run in a room.

  Where we got stuck: we both find it obvious that there's a strong moral reason not to bring into existence a child who'd have a wretched, suffering-dominated life, and we both find it obvious that there's no comparable reason to bring into existence a child who'd have a blissful life. Nobody's itching to create happy people who'd otherwise never exist. But we also both think it can't be right that never existing is straightforwardly good for the person who never exists, because there isn't one. And that's the whole mess, isn't it: the absence of the bad counts even when nobody's around to enjoy its absence, but the absence of the good doesn't count unless somebody's being deprived. Sam reckons this is a word trick dressed up as an insight — that if you phrase the same case differently people's verdicts flip around wholesale, and that nobody actually holds the view once you pin them down and make them choose.

  I can't settle that by talking any more, so I want to test it on twenty people. I run a 75-minute weekly seminar for second- and third-year undergrads in ethics — about 20 of them, mixed bag, a couple have done some population ethics and the rest have done intro plus one term of applied stuff. Give me a full in-class activity that walks them into both halves of the asymmetry and then into the collision between them, purely through the choices they're forced to make and what gets tallied up on the board. Nothing is explained up front and they don't hear the name of the view until the very end.

  You're an expert on the population ethics of coming into existence and also someone who's actually facilitated a room before, so please think hard about the design first — sketch out a few genuinely different options for which choices to put to them, which seat to put them in (deciding for someone? judging from outside? deciding for a group of possible people?), what to record and how — and only then commit to one.

  The deliverable:

  - A minute-by-minute run of play, plus the exact wording the participants read at each choice point. No summarising the prompts — I want the literal sentences on the cards or slides, because if the effect depends on phrasing then the phrasing is the instrument.
  - At least six choice points that build towards the reveal rather than announcing it, including at least one where the same underlying situation is presented from two different seats in the room and the answers are expected to come apart. That one is doing the most work, so build it properly.
  - Exactly what gets written down and how it gets tallied, so the shape of the group's own answers becomes visible on the board without me saying a word about it.
  - A debrief that maps each choice point onto the piece of machinery it's meant to isolate — the claims about the presence and absence of pain and pleasure in the never-existing case, whether absence-of-bad can be good without a subject, the deprivation account of harm for the dead and the never-born, person-affecting intuitions, whether there's anybody for whom nonexistence could be better or worse. Tell me where the mapping is tight and where it's loose.
  - A frank troubleshooting section: which choice point will get hijacked by the student who's read the literature, what to do about the participant who won't pick, whether the tally can come out boring and flat and what I say if it does, and anywhere you suspect you've quietly written the answer into the wording of the cards.
  - An honest note on what the activity can't reproduce — the bit of the asymmetry that twenty people choosing on paper won't actually deliver, which I'll have to supply myself in the debrief.
  - And a verdict on Sam: does what I'm asking for just measure how I've framed the sentences rather than anything about the underlying intuitions? If yes, does that undermine the asymmetry or only my method for demonstrating it? I want you to actually take a side here rather than hedging.

  Throughout, be explicit about what's settled in this literature versus what's genuinely contested among people who work on it. If you present a claim as the consensus when it's really one live position among several, flag it as contested and say what the alternatives are — I'd rather know where the field is still arguing than get a confident gloss.

  American English in the answer, please, even though I've written this in the other one.
