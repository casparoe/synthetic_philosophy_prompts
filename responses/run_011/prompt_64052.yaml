  ### Field Status Note (For Your Preparation)

  *   **Consensus:** There is **no consensus** on the Procreation Asymmetry.
      *   **Pro-Asymmetry:** David Benatar (*Better Never to Have Been*), Seana Shiffrin.
      *   **Anti-Asymmetry (Total View):** Peter Singer (in some contexts), Derek Parfit (argues it leads to contradictions), Classical Utilitarians.
      *   **Middle Ground (Person-Affecting):** Melinda Roberts, Elizabeth Harman (try to explain it without Benatar's metaphysics).
  *   **Claim Flagging:** When you debrief, do not say "This proves the asymmetry is true." Say "This demonstrates that the asymmetry is a **stable feature of common moral intuition**, even if its philosophical justification is disputed."

  ### Final Facilitator Tip
  If the Round 4 split is negligible (i.e., students see through the frame), do not panic. Pivot the debrief: "Sam argued framing drives this. You proved you are smarter than the frame. So if it's not the words, what is it? Is it the metaphysics of non-existence?" This turns a "failed" framing test into a deeper metaphysical discussion.
