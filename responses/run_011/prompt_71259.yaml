answer: |-
  **Planning Note**

  1.  Stranger's futures cease: Declared knowledge of weather adjusts prices to eliminate speculative gain.
  2.  Wool trades cease: Quality disclosures reveal defects buyers already suspected, confirming refusal.
  3.  Plow trade fails: Seller's declared need for cash signals insolvency risk to buyer.
  4.  Salt trade persists: Value and quality are public; no private info exists to infer.
  5.  Gift refused: Offer implies giver knows receiver's need better than receiver, violating shared self-knowledge.

  Simplification: Agents are modeled as having identical risk tolerance; in reality, risk aversion differences often sustain trade despite information symmetry.

  ***

  The valley held its breath like a lung full of snow. In Oakhaven, the children did not learn to count on their fingers but on the pages of the Almanac. Every spring, the schoolmaster opened the same leather-bound book, and every child copied the same tables of chance. They learned that rain fell on the north slope three days in seven, that the vein of silver in the western ridge yielded two ounces for every hour of pick-work, and that a man's word, once weighed against the Almanac, was either true or false. There was no room for private hunches. To think differently was to think wrongly.

  For a season, the Stranger came. He brought no goods, only contracts. He would stand in the square and offer to buy the summer harvest in winter, or sell wool before the sheep were shorn. The townspeople traded with him eagerly. It was a feverish time. They traded because they could not guess what the Stranger knew. Perhaps he had seen the clouds gathering over the pass; perhaps he knew the price of silver in the lowlands. The uncertainty was a mist they could walk through.

  Then came the widow and the horse. The beast was lame, though the seller had sworn it sound. The widow, bound by the Almanac's logic, had assumed the seller knew no more than she. When the leg buckled, the town felt a fracture in its reasoning. The Council enacted the Ordinance of Open Hands. Henceforth, any who made an offer must first stand before the Assessor and swear what knowledge prompted it.

  I sat at the high desk in the guildhall, the inkwell freezing at the edges. My task was to record the oath and the offer. I expected a flood of truth. Instead, I watched the silence spread.

  It began with the Stranger. He stepped forward on the tenth day, holding a contract for grain.
  "I offer to sell," he said.
  "What do you know?" I asked.
  "I know the rains are delayed," he said.
  The crowd murmured. If the rains were delayed, the grain would be scarce. If the grain was scarce, the price would rise. If the price would rise, why sell now? The buyers stepped back. They shared the Stranger's prior; they knew the Almanac as well as he. If he was willing to sell at today's price knowing the rain was delayed, the price must be too high even for his knowledge. The trade died before the ink was dry.

  Next came the wool merchants. They tried to bundle their offers. One sent a mute boy to the desk. The boy placed a sack of fleece on the table and said nothing.
  "Who sends you?" I asked.
  "Master Helt," the boy whispered.
  "What does Master Helt know?"
  The boy shook his head. "He knows nothing."
  I looked at the crowd. If Helt knew nothing, he had no reason to trade rather than hold. If he sent a boy who could not speak, he sought to hide the reason. The buyers saw the silence as a shout. They knew Helt would not sell unless the wool was worth less than the price. They declined. The device failed because the choice of the messenger was itself a message.

  Then the small trades began to wither. A farmer offered a plow to his neighbor.
  "What do you know?" I asked the farmer.
  "I know my back is failing," he said.
  The neighbor looked at the plow, then at the farmer's bent spine. If the farmer sold because he could not work, the neighbor knew the farmer would soon need coin for food. To buy the plow was to enter a partnership with a failing man. The neighbor thanked him and walked away. The trade was sound in wood and iron, but unsound in the knowledge behind it.

  Yet, some things moved. The salt merchant still sold to the butcher.
  "What do you know?" I asked.
  "I know you need salt," the merchant said.
  "And I know I need salt," the butcher replied.
  There was no secret there. The need was common knowledge, written in the flesh of the meat and the crystals of the salt. No one knew more than the other. The price did not shift. The trade passed through the hall like a breath, unimpeded.

  But the silence grew heavier. It moved from the market to the hearth.

  On the last day of the month, a mother came forward. She held a loaf of bread. Her son stood beside her, thin and quiet. She placed the bread on the desk.
  "I offer this," she said.
  "To whom?"
  "To my son."
  "This is a gift," I said. "The Ordinance covers offers of trade."
  "A gift is an offer," she said, her voice trembling. "It is an offer to give something for nothing."
  "What do you know?" I asked. It felt cruel, like asking a cloud why it rains.
  "I know he is hungry," she said.
  The son looked at the bread. He looked at his mother. If she knew he was hungry, then he must be hiding his hunger. If he was hiding his hunger, he was weak. To accept the bread was to admit he could not survive without her knowledge. But more than that, the town watched. They knew the Almanac. They knew the stores were low. If the mother gave away bread, she knew something about the future stores. She knew they would not be replenished. If she knew the winter would be hard, she should keep the bread. By offering it, she signaled that the bread was worth less than the bond it bought. Or perhaps that she knew something worse than hunger was coming.

  The son did not take the bread. He stood still. The loaf sat on the wood between them, white and crusty.
  "I cannot accept," he said.
  "Why?"
  "Because you offer it."

  They left the hall together. The bread remained on my desk. I did not eat it. To eat it would be to accept the offer, and I did not know what the mother knew.

  The square outside is quiet now. The Stranger has gone. The merchants sit on their crates, hands folded. The only sound is the wind moving through the valley, checking the trees, checking the roofs. There is no cheating here. No one is taken in. No one sells a lame horse. No one buys a promise they cannot keep. We are all in agreement. We all know exactly what everything is worth, which is nothing, because to move it is to admit you know something else.

  I look at the bread. It is beginning to stale. Perhaps this is what peace looks like. Perhaps it is what starvation looks like. The Almanac does not say. It only gives the chances. And now, the chance of trade is zero.

  I dip my pen. There is nothing to record. The ink hangs on the nib, a dark drop waiting to fall, perfectly balanced, refusing to move.

  ***

  **Critical Note**

  I am highly confident that the failures of trade in steps 1–3 (futures, wool, plow) align with the Milgrom-Stokey mechanism: the explicit disclosure of private information updates the counterparty's belief such that the expected value of the trade becomes non-positive. The salt trade persists correctly because it represents a scenario with symmetric information (common knowledge of need), where no inference can be drawn from the offer itself.

  The step I am least sure of is the refusal of the gift. While economically a gift is a transfer that can be modeled as a trade with a price of zero, the theorem strictly applies to speculative trade among rational agents seeking profit. Extending it to familial altruism bends the setup; the refusal here relies on the gift signaling private information about future scarcity or the receiver's incapacity, which is a sociological extension of the epistemic problem.

  The pre-commitment device (the mute boy) fails for a theoretically sound reason: the selection of the agent is endogenous. The merchant's choice to use a proxy signals an intent to conceal, which rational agents infer as adverse information. If the ordinance were repealed, trade would likely resume, not because the information asymmetry vanished, but because the *common knowledge of rationality* would degrade. Without the forced oath, agents could plausibly deny that they were inferring information from the offer itself, restoring the "fog" necessary for the market to function. The ordinance made the inference unavoidable.
