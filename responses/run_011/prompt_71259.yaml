  5.  **Refining the Theory in Narrative:**
      *   Need to ensure the "why" is clear without jargon. "If he offers, he knows something I don't. If we think alike, what he knows makes me value this less."
      *   The Ordinance makes the inference explicit. "I offer because I know the rain is coming." -> "If you know rain is coming, you wouldn't sell me dry hay unless you know something worse."
      *   Actually, the Ordinance says "declare what you know." If I say "I know nothing," you know I'm lying because why offer? If I say "I know X," you update.
      *   The Milgrom-Stokey result is that *even without the ordinance*, trade shouldn't happen if priors are common and rationality common. The ordinance just makes the information channel explicit, accelerating the realization. Or rather, the ordinance enforces the "common knowledge of information structure" that might have been fuzzy before.
      *   Wait, the prompt says: "town enacts an ordinance requiring anyone who makes an offer to declare on oath... what they know." This forces the information into the open. If the information makes the trade look bad for the receiver, they decline. If the receiver knows the offerer *only* offers when it looks bad for the receiver, they decline even if the info sounds neutral.
      *   Let's focus on the *inference*. The ordinance makes the inference unavoidable.

  6.  **Writing - Focus on Tone:**
      *   Weather-like. Heavy, atmospheric. Not a lecture.
      *   Words: 1,300 - 1,800.
      *   Viewpoint: Elara (Assessor).

  7.  **Planning Note (Mental Check):**
      *   Need to list the chain.
      *   Need to identify the simplification (e.g., ignoring risk preferences).
