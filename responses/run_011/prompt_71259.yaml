  2.  **Deconstruct the Theory (Milgrom-Stokey No-Trade):**
      *   *Core Idea:* If agents share a prior and know each other are rational, any offer to trade reveals information. If I offer to sell you X, I must think X is overvalued or I know something bad about it. You, knowing I know this, update your belief. If we share priors and rationality is common knowledge, this updating continues until there is no mutually beneficial trade left.
      *   *The Ordinance:* Forces the information revelation explicitly. Instead of inferring from the offer itself, you hear the knowledge. But if the knowledge makes the trade look bad for the receiver, they decline. If the receiver knows the offerer *would only offer if the trade looks bad for the receiver*, they decline regardless of the specific knowledge.
      *   *The Setting:* Shared prior is key (the Almanac/Schoolmaster).
      *   *The Unraveling:* Starts with high uncertainty (speculation), moves to concrete goods, ends with social bonds (gifts).

  3.  **Planning the Story Structure:**
