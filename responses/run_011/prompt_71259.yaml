      *   **Audience:** A reading group familiar with the symbols but needing to *feel* the result. Includes a fish auctioneer (pragmatist) and a skeptic (idealization critic).
      *   **Setting:** High valley market town, shared prior (same almanac/schoolmaster), stranger arrives (brings noise/uncertainty), ordinance enacted (must declare knowledge on oath before offering).
      *   **Plot Requirements:**
          *   Silence spreads in stages (speculative -> small -> barter -> gifts).
