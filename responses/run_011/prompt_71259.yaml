      *Self-Correction on Theory:* The Milgrom-Stokey theorem says if priors are common and rationality is common knowledge, no trade occurs *even without* an ordinance, because the offer itself is the signal. The ordinance in the story acts as a mechanism to make the "common knowledge of rationality" and "information structure" explicit, forcing the townspeople to confront the inference they were previously ignoring or obscuring. It removes the "noise" that allowed trade before. The story needs to show that *because* they must speak, they realize the offer itself was always a confession.
      *Actually, the prompt says:* "trade is brisk precisely because nobody can guess what he knows; then... the town enacts an ordinance... The silence should then spread."
      *Okay, so the Ordinance breaks the ambiguity. Before, you could pretend you didn't know why someone was trading. After, you must state it. If you state "I know nothing," it's suspicious. If you state "I know X," it updates the price.
