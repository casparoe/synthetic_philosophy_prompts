  ### Why Not Reject (2)?
  You explicitly said you want to keep (2). Good. Rejecting (2) requires claiming we can measure cardinal utility directly (e.g., via neuroimaging). While neuroeconomics is trying to do this, it is not yet orthodox. Keeping (2) acknowledges that *choice* only reveals order. The error isn't in the math of utility functions; it's in the claim that utility functions are the *only* substrate for welfare facts.

