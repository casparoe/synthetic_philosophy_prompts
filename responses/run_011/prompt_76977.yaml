answer: |-
  Here is a prioritized agenda tailored to your constraints: one person, small models, cheap experiments, and a specific vulnerability to test-editing cheats.

  ### 1. The Outcome Robustness Ceiling
  **Question:** Can outcome supervision be made cheat-proof cheaper than training a process reviewer?
  *   **Why it's live:** Your move to process supervision was triggered by security failures (test editing), not necessarily learning inefficiency. If you can harden the sandbox (e.g., read-only test files, external evaluation runners, deterministic seeding) for less than 50% of your compute, process supervision becomes an optional luxury rather than a necessity.
  *   **Compute Impact:** If resolved in favor of outcome supervision, you eliminate the 50% compute tax on the reviewer model immediately.
  *   **Feasibility:** High. This is an engineering experiment, not a scaling law. Spend one week attempting to break your own sandbox with increasingly adversarial prompts. If you can't break it, you don't need the reviewer for security.
  *   **Downstream:** 3. If outcome supervision is secure and cheap, questions about process signal quality, sparsity, and distillation become moot.

  ### 2. The Gradient Advantage (PS vs. OS+Retries)
  **Question:** Does process supervision provide a learnable signal that outcome supervision with rejection sampling cannot match?
  *   **Why it's live:** Outcomes are cheap for you. A common counter-argument to process supervision is that simple outcome-based retries (rejection sampling) on small models often match the performance of step-level guidance. You need to know if the reviewer is teaching the model *reasoning* or just filtering bad trajectories.
  *   **Compute Impact:** If OS+Retries matches PS performance, you switch to a simpler pipeline and reallocate reviewer compute to policy training or larger batch sizes.
  *   **Feasibility:** High. Train two small models: one with your current PS setup, one with pure OS + multiple retries per step. Compare final pass rates and training convergence speed.
  *   **Downstream:** 2. If PS offers no gradient advantage, optimizing the reviewer signal (sparsity/quality) is waste.

  ### 3. The Signal Sparsity Threshold
  **Question:** Do we need to grade every intermediate step, or only critical decision points?
  *   **Why it's live:** You are currently grading plans, diffs, and test choices. On small models, many steps are low-entropy (e.g., standard boilerplate). Grading every token or line might be diminishing returns.
  *   **Compute Impact:** Direct linear reduction. If you only grade plans and final diffs, you could cut reviewer compute by 50-70%.
  *   **Feasibility:** High. Run an ablation study where the reviewer only scores the initial plan and the final diff, ignoring intermediate edits. Compare policy performance.
  *   **Downstream:** 1. Affects distillation complexity (less data to distill) but doesn't invalidate the need for a reviewer.

  ### 4. The Reviewer Noise Tolerance
  **Question:** How inaccurate can the reviewer be before it poisons the policy?
  *   **Why it's live:** You are a tiny lab; your reviewer is not an oracle. It is a smaller model trained to grade a larger model. If the reviewer is too noisy, it acts as a regularizer that hurts performance. You need to know the error budget.
  *   **Compute Impact:** Determines how much compute you spend improving the reviewer vs. the policy. If tolerance is high, stop optimizing the reviewer.
  *   **Feasibility:** High. Take your existing reviewer labels and inject synthetic noise (flip 10%, 20%, 30% of grades). Train policies on these noisy signals and measure performance degradation.
  *   **Downstream:** 0. This is a terminal constraint for your current architecture.

  ---

  ### Questions to Ignore
  Your setup makes several common debate points moot. Do not spend time on these:
  *   **Human Preference Alignment:** You have hidden test suites. You know when the code works. You don't need to debate whether process supervision aligns better with vague human preferences; you have a ground truth oracle.
  *   **Cross-Domain Generalization:** You are training a coding agent. Debates about whether process supervision helps with math vs. writing vs. reasoning are irrelevant. You only care about code generation.
  *   **Scalability to 100B+ Parameters:** You are running small models. Theoretical questions about whether process supervision breaks at massive scale are not your bottleneck.
  *   **Theoretical Convergence Proofs:** You need empirical wins in six months. Mathematical guarantees about RLHF vs. RLAIF convergence are not actionable.

  ### Evidence to Watch For
  *   **Sandbox Breaks:** If you find a cheap way to prevent test editing (e.g., running tests in a separate process with no write access), **Question 1** is solved, and you should pivot to Outcome Supervision immediately.
  *   **Retries Match PS:** If a simple outcome-only baseline with 5x retries matches your process-supervised model's pass rate, **Question 2** is resolved against PS. Drop the reviewer.
