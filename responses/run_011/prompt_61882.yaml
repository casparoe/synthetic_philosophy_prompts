  You are describing a version of **Inference to the Best Explanation (IBE)** filtered through **Parsimony**. Your "Three Heaps" are essentially: (1) Physical Constraint, (2) Cultural Drift, and (3) Intentional Coordination. Your intuition is sound, but your current rule lacks a mechanism to distinguish Heap 2 from Heap 3 when uniformity is present (Case 3 vs. 4) and lacks a formal handle for preservation bias (Case 6).

  Here is the repaired principle, the resolution of your flip-flops, and the verdict you must sacrifice.

  ### The Principle of Non-Functional Coordination

  **Statement:**
  > A material pattern licenses an inference about shared cognitive structure (belief, institution, or rule) **if and only if** the pattern exhibits coordination costs that cannot be explained by (A) physical/ergonomic necessity, or (B) low-cost social transmission, **and** the absence of evidence is only treated as evidence of absence where preservation probability is high.

  **The Clauses (tied to your cases):**

  1.  **The Ergonomic Clause (Heap 1):** If the object's form is dictated by human physiology or immediate physical utility, infer no cognitive coordination.
      *   *Forced by:* **Case 1** (Figurine as toy/decor) and the **Brick Case** (Hand-sized ratios).
  2.  **The Interoperability Clause (Heap 3):** If the object's function *requires* agreement across distinct agents to work (i.e., it fails without standardization), infer institution/coordination.
      *   *Forced by:* **Case 3** (Weights). A weight is useless unless it matches other weights. This distinguishes it from pots.
  3.  **The Costly Signal Clause (Heap 3):** If the deposition or treatment of an object imposes a material cost (time, resources, destruction of value) with no return utility, infer belief/ritual.
      *   *Forced by:* **Case 2** (40 figurines + burned sheep) and **Case 5** (Child burial wealth).
  4.  **The Preservation Bias Clause (Case 6):** Absence of evidence counts as evidence of absence *only* if the material class has a high survival probability in that context.
      *   *Forced by:* **Case 6** (Trauma vs. Exchange). Bone trauma preserves; "peace" does not. Exotic stone preserves; grain/cloth does not.

  ---

  ### Application to Your Flip-Flop: The Bricks

  **Verdict:** This falls under the **Ergonomic Clause**.

  **Reasoning:** A brick must be liftable by one hand and stackable. The length:width:height ratio is constrained by the average human grip and the physics of stacking (stability vs. weight). Unless the ratio is mathematically precise beyond the tolerance of human variation (e.g., exactly 2:1:1 across thousands of bricks with <1mm variance), it is a physical necessity, not a cognitive rule.

  **Decision:** If the variance is within ergonomic tolerance, it is **Heap 1**. Do not infer "coordinated labour" or "orders." If the variance is tighter than hand-molding allows (implying molds), it moves to **Heap 3** (Standardization), but still does not prove "authority"—only technical coordination.

  ### Application to the New Case: Bound Burial with Stone Slab

  **Verdict:** This falls under the **Costly Signal Clause**.

  **Reasoning:** Binding limbs and placing a heavy slab requires significant labor investment (cost) and offers no physical utility to the deceased (no return utility). It is a "costly signal."

  **Decision:** You are licensed to infer **Ritual Containment**. You are *not* licensed to infer **"Fear of the dead."** "Fear" is a specific emotional state; "Containment" is the behavioral inference. The principle allows you to say they *acted* as if the dead required restraint, but not *why* (fear, respect, preventing return, status marker). Your volunteers are over-interpreting the emotion.

  ---

  ### The Sacrifice: Which Verdict Must Go?

  To keep this principle rigorous, you must sacrifice the reasoning in **Case 4 (The Pottery Rims).**

  **Your Current Verdict:** "It's a few potters copying each other... not a standard." (Heap 2: Tradition/Drift).
  **The Problem:** You accept Case 3 (Weights) as "Institution" because of uniformity, but reject Case 4 (Pots) as "Copying" despite similar uniformity. You noted you "can't say why they're wrong" when people call this inconsistent.

  **The Correction:**
  Clustering within **2 millimetres** across six sites is technically impossible via passive "copying." Copying introduces drift (error accumulation). 2mm variance implies **molds or templates**.
  *   If they used molds, that is a **technical constraint** (Heap 1: Production Efficiency).
  *   If they shared molds/templates across six sites, that is **coordination** (Heap 3: Guild/Network).

  **The Sacrifice:** You cannot call it "just copying." That is physically implausible for that tolerance. You must move Case 4 out of Heap 2.
  *   **Option A:** Admit it is a **Technical Standard** (Heap 1/3 boundary) driven by production efficiency, not necessarily "authority."
  *   **Option B:** Admit it implies a **Production Network** (Heap 3), meaning there *was* some level of coordination, even if not a "state."

  **Why this sacrifice?** It aligns your treatment of uniformity. In Case 3 (Weights), uniformity = Agreement. In Case 4 (Pots), uniformity = Agreement (or shared tech). You cannot have "Uniformity = Institution" in one case and "Uniformity = Drift" in another without a functional justification. The functional justification for Weights is *Interoperability* (they must match to work). The functional justification for Pots is *Efficiency* (molds are faster). Both exclude "Copying."

  ### Summary of Repairs

  1.  **Case 6 (Exchange):** Your verdict ("wasn't plugged into exchange") is safe *only if* you add the **Preservation Bias Clause**. If you haven't run strontium/oxygen isotopes on the teeth (your old field), you cannot rule out perishable trade or human mobility. If you rely solely on artifacts, you must qualify the verdict to "no *material* exchange of durable goods."
  2.  **Case 4 (Pots):** You must abandon "copying." 2mm precision is manufacturing tolerance, not stylistic drift.
  3.  **Bound Burial:** Infer "Ritual Containment," not "Fear."
  4.  **Bricks:** Presume Ergonomics unless precision exceeds human variance.

  Your "Three Heaps" are valid, but Heap 2 (Tradition) is a trap. It is often just Heap 1 (Efficiency) or Heap 3 (Coordination) in disguise. If the cost of maintaining the tradition is low, it's drift. If the cost is high (precision molds, integer weights), it's coordination. Your gut was right to be suspicious of Case 4.
