prompt: |-
  I'm the only analyst at a six-person food-crisis advocacy outfit. Maybe twice a month somebody forwards me a deteriorating situation — a regional price spike, a bad harvest report, mortality numbers trickling out of a clinic network — and asks the same two things: is this heading toward famine, and are we allowed to call it man-made? Right now I answer on gut feel and it isn't defensible. Our comms lead isnt an economist and she's the one who actually files, so whatever you give me has to be runnable by her in about an hour, using only what we realistically get: market and wage price series, migration reports, one or two nutrition surveys, government procurement or relief announcements, and how much press the situation is getting.

  Build the procedure on the entitlement approach — Sen's basic point that people starve when they lose command over food, not only when food stops existing — but aim it at a gap the severity classifications leave open. The technical phase thresholds tell you how bad things are; they say nothing about why, and why is the part our wording has to survive. Our counsel's rule is that we can only print man-made if we can name a decision by an identifiable actor that made things worse than they'd otherwise have been. So the procedure has to hold three levels apart that our bulletins currently smear together: the trigger (blight, drought, war), the transmission mechanism (who lost access and through what — wages, prices, land, movement restrictions), and the response failure (what authorities did or refused to do afterwards). Responsibility gets located at each level on its own terms, and the procedure has to be able to return entitlement-driven-but-nobody-blameworthy and availability-driven-but-still-a-political-crime as two distinct outcomes rather than collapsing them.

  Then run it on three cases: Bengal 1943; Ireland 1845-49, where I want the poor-law rule barring workhouse relief to anyone holding more than a quarter acre treated as a real step and not a footnote; and the Great Leap Forward famine. For at least one, give me the answer I dont want — I expect that's Bengal, since the procedure should have to concede that historians still argue there was a genuine aggregate shortfall that year, not merely a distributional one.

  Mark which steps are judgment calls wearing a procedure costume, say what it can't settle at all, and say where it has to stop and hand the call to a human because the question is values or legal exposure rather than fact. It also needs a branch for can't-tell-yet — the cases with almost no mortality data — including what we're permitted to publish in that state. No reading list, no citations.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Solo analyst at a 6-person food-crisis advocacy group.
      *   **Problem:** Current "gut feel" analysis on famine classification ("Is this famine?" "Is it man-made?") is indefensible.
      *   **Constraints:**
          *   Must be runnable by a non-economist Comms Lead in ~1 hour.
          *   Data sources limited: market/wage prices, migration reports, 1-2 nutrition surveys, gov procurement/relief announcements, press coverage.
          *   Framework: Amartya Sen's Entitlement Approach (focus on *access/command* over food, not just availability).
          *   Gap to fill: Severity classifications (like IPC/CH) tell *how bad*, not *why*. The org needs to know *why* to claim "man-made."
          *   Legal/Counsel Rule: "Man-made" requires naming a decision by an identifiable actor that made things worse.
          *   Structure: Must distinguish three levels: Trigger, Transmission Mechanism, Response Failure.
          *   Output Requirements: Distinguish "entitlement-driven-but-nobody-blameworthy" vs. "availability-driven-but-still-a-political-crime."
          *   Test Cases: Bengal 1943, Ireland 1845-49 (specific focus on Quarter-Acre Clause), Great Leap Forward.
          *   Specific Instruction: For at least one case (likely Bengal), provide the "answer I don't want" (acknowledge aggregate shortfall arguments).
          *   Meta-Analysis: Mark judgment calls, limitations, and where human intervention is needed (values/legal). Include a "can't-tell-yet" branch.
          *   Formatting: No reading list, no citations.

  2.  **Deconstruct the Framework (The "Why" Protocol):**
      *   *Core Concept:* Sen's Entitlement Approach. Starvation = loss of entitlement mapping (ability to exchange labor/assets for food).
      *   *Three-Level Distinction:*
          1.  **Trigger:** The shock (drought, war, blight).
          2.  **Transmission:** How the shock became starvation (price spike, wage collapse, confiscation).
          3.  **Response:** What authorities did (relief, export bans, denial).
      *   *The "Man-Made" Test:* Requires an *identifiable actor* + *decision* + *worsening outcome*.
      *   *Operational Constraints:* Needs to be a checklist/flowchart style for a non-expert.

  3.  **Drafting the Procedure (The "Entitlement Attribution Protocol" - EAP):**
      *   *Phase 1: Severity Check.* Is it bad enough to matter? (Use available nutrition/mortality data).
      *   *Phase 2: Entitlement Mapping.* Compare Food Availability vs. Access. (Prices vs. Wages).
      *   *Phase 3: The Three-Level Attribution.*
          *   Level 1 (Trigger): Natural vs. Human?
          *   Level 2 (Transmission): Market failure vs. Policy extraction?
          *   Level 3 (Response): Capacity constrained vs. Willful neglect?
      *   *Phase 4: The "Man-Made" Determination.* Applying Counsel's rule.
      *   *Phase 5: The "Can't Tell" Branch.* What to do when data is missing.
      *   *Meta-Commentary:* Highlighting judgment calls and legal/value boundaries.

  4.  **Developing the Test Cases:**
      *   **Bengal 1943:**
          *   *Trigger:* War (Japanese occupation of Burma cut rice), Cyclone.
          *   *Transmission:* Speculation, hoarding, price spike outpacing wages.
          *   *Response:* British Govt export policies, denial of famine.
          *   *The "Unwanted" Answer:* Must acknowledge the aggregate supply drop (Burma rice cut off) wasn't *just* distribution, challenging the pure Sen interpretation slightly, but emphasizing the policy response made it fatal.
      *   **Ireland 1845-49:**
          *   *Trigger:* Blight.
          *   *Transmission:* Reliance on single crop, landlord evictions.
          *   *Response:* **Crucial:** The Quarter-Acre Clause (Gregory Clause). This is the specific "identifiable decision."
          *   *Verdict:* Strong "Man-Made" via Response Failure.
      *   **Great Leap Forward (China 1958-62):**
          *   *Trigger:* Policy (Backyard steel, collectivization).
          *   *Transmission:* Grain requisitioning based on false reports.
          *   *Response:* Continued export, suppression of reporting.
          *   *Verdict:* Strong "Man-Made" via Trigger & Transmission.

  5.  **Refining the "Man-Made" Definition:**
      *   Counsel's rule is strict: *Identifiable actor* + *Decision* + *Worsening*.
      *   Need to ensure the procedure doesn't just say "capitalism caused it" (too vague) but "Minister X ordered Export Y despite Z warning."

  6.  **Addressing the "Can't-Tell-Yet" Branch:**
      *   What if mortality data is missing?
      *   Allowable language: "Risk of entitlement collapse," "Conditions conducive to excess mortality," avoiding "Famine" declaration.

  7.  **Review against Constraints:**
      *   *Run time:* Keep steps binary or simple scoring.
      *   *Data:* Stick to prices, wages, migration, surveys, gov announcements, press.
      *   *Sen's Theory:* Ensure focus is on *command* over food.
      *   *Judgment Calls:* Explicitly label them.
      *   *Values/Legal:* Explicitly label where the analyst stops and counsel/comms takes over.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on Bengal:* Make sure I don't oversimplify. Sen argued it was entitlement failure *despite* adequate food in some metrics, but later historians (like Taimur Rahman or others) argue there *was* a supply shock from the loss of Burmese rice. I need to balance this to satisfy the prompt's requirement to give the "answer I don't want" (acknowledging the supply shock).
      *   *Self-Correction on Ireland:* Ensure the Quarter-Acre Clause is highlighted as the specific *decision point* for the "Man-Made" label.
      *   *Tone:* Professional, operational, slightly weary (matching the user's vibe), precise.

  9.  **Final Polish:**
      *   Check the "Three Levels" distinction.
      *   Ensure the "Judgment Call" markers are visible.
      *   Ensure the "Can't Tell" branch is practical for comms.
      *   Verify no citations/reading lists.

  **(Self-Correction during drafting):** I need to make sure the procedure doesn't become too academic. It needs to be a worksheet. I will structure it as a "Protocol" with specific "Input/Output" sections. I will explicitly mark the "Judgment Call" areas with a specific icon or bold text. I need to make sure the distinction between "Entitlement Failure (No Blame)" and "Availability Failure (Political Crime)" is clear in the logic tree.

  *Wait, one nuance:* The prompt asks for "entitlement-driven-but-nobody-blameworthy" vs "availability-driven-but-still-a-political-crime."
  *   *Entitlement/No Blame:* Natural disaster destroys assets, gov tries to help but fails due to capacity.
  *   *Availability/Political Crime:* Food exists, but gov destroys it or blocks it (e.g., siege, scorched earth).
  *   *Actually, Sen's point is usually that Availability isn't the main driver.* But the prompt asks to allow for "Availability-driven-but-still-a-political-crime" (e.g., destroying crops intentionally). I need to make sure the logic tree allows for a "Man-Made" verdict even if the primary driver was Availability (Trigger), provided the Response was criminal.
  *   *Correction:* The prompt says "Responsibility gets located at each level." So if Trigger is Natural, but Response is Criminal, it's Man-Made. If Trigger is Human (War), but Response is Benign/Helpful, it might not be "Man-Made Famine" (it's War Collateral). The "Man-Made" label hinges on the *Response* or the *Transmission* being a *Decision*.

  Let's refine the "Man-Made" test. Counsel says: "Name a decision by an identifiable actor that made things worse."
  So, even if there was a drought (Trigger), if the Gov *could* have imported food but chose not to (Response Decision), it's Man-Made.
  If there was a blight (Trigger), and the Gov *forced* export of remaining food (Response Decision), it's Man-Made.
  If there was a war (Trigger), and one side *blocked* aid (Response Decision), it's Man-Made.

  Okay, ready to write. I will structure it as the "Entitlement Attribution Protocol (EAP) v1.0".
answer: |-
  # Entitlement Attribution Protocol (EAP) v1.0
  **Operator:** Comms Lead (Non-Technical)
  **Time Budget:** 60 Minutes
  **Data Inputs:** Price/Wage series, Migration logs, Nutrition/Mortality snapshots, Gov announcements, Press volume.

  ## Purpose
  To separate **Severity** (how many are starving) from **Attribution** (why they are starving) to determine if the term "Man-Made" meets Counsel's standard (Identifiable Actor + Decision + Worsening Outcome).

  ---

  ## Phase 1: The Severity Gate (5 Minutes)
  *Do not proceed to Attribution if Severity is not met. This prevents false positives on "Famine" claims.*

  **Input:** Most recent nutrition survey (GAM/SAM rates) OR Mortality reports (Crude Death Rate).
  **Input:** Market price data (Staple food cost vs. Daily agricultural wage).

  **Checklist:**
  1.  **Exchange Rate Collapse:** Has the amount of staple food purchasable by one day's labor dropped by >50% compared to the 5-year average? [YES/NO]
  2.  **Distress Signals:** Are there verified reports of asset selling (livestock/tools) or distress migration in the affected zone? [YES/NO]
  3.  **Mortality Threshold:** Is there evidence of excess death rates specifically linked to hunger/disease in the vulnerable cohort (children/elderly)? [YES/NO/UNKNOWN]

  **Decision:**
  *   If **NO** to all: Stop. Issue "Food Insecurity Alert." Do not use "Famine."
  *   If **YES** to 1 & 2, **UNKNOWN** to 3: Proceed to Phase 2 (Mark as "Imminent Famine Risk").
  *   If **YES** to all: Proceed to Phase 2 (Mark as "Active Famine Conditions").

  ---

  ## Phase 2: The Three-Level Attribution Matrix (30 Minutes)
  *This separates the Trigger, the Transmission, and the Response. You must fill one box per row.*

  | Level | Question | Option A (Natural/External) | Option B (Structural/Market) | Option C (Political/Decision) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Trigger** | What started the shock? | Weather, Blight, Pestilence | Global price shock, Terms of trade collapse | War, Blockade, Forced Collectivization |
  | **2. Transmission** | How did it reach the stomach? | Crop failure reduced total supply | Wages fell or Prices rose faster than income | Confiscation, Asset Seizure, Movement Bans |
  | **3. Response** | What did Authority do? | Relief attempted but logistics failed | Relief attempted but underfunded/late | Relief denied, Exports continued, Data suppressed |

  **Instructions for Operator:**
  *   **Trigger:** Look at the initial event. If it rained too little, it's A. If a army moved in, it's C.
  *   **Transmission:** Look at the Price/Wage data. If food exists but is too expensive, it's B (Entitlement Failure). If food was physically taken or destroyed, it's C.
  *   **Response:** Look at Gov Announcements vs. Press Reports. Did they ask for help (A/B) or deny the problem/export grain (C)?

  **[JUDGMENT CALL WARNING]:** Distinguishing Option B from Option C in Transmission is the hardest step.
  *   *Rule of Thumb:* If the price spike correlates with a specific policy (e.g., sudden currency devaluation, removal of subsidy), mark **C**. If it correlates with global trends or local speculation without policy backing, mark **B**.

  ---

  ## Phase 3: The "Man-Made" Determination (15 Minutes)
  *Apply Counsel's Rule: Identifiable Actor + Decision + Worsening Outcome.*

  **Step 1: Locate the Decision.**
  Look at your Phase 2 Matrix. Do you have at least one **Option C**?
  *   If **NO** (All A or B): You cannot claim "Man-Made."
      *   *Outcome:* "Entitlement Collapse due to Structural/Natural Causes."
      *   *Comms Language:* "Systemic failure," "Crisis," "Catastrophe." Avoid "Crime" or "Man-Made."
  *   If **YES**: Proceed to Step 2.

  **Step 2: Name the Actor.**
  Can you name the specific entity responsible for the Option C box? (e.g., "The Ministry of Trade," "General X," "The Colonial Administration").
  *   If **NO** (e.g., "The Market," "Global Capital"): Stop. Counsel will not clear "Man-Made."
  *   If **YES**: Proceed to Step 3.

  **Step 3: The Counterfactual Test.**
  Is there evidence that a different decision was available and would have reduced mortality? (e.g., Press reports of experts advising against the policy, historical precedent of successful relief).
  *   If **NO** (They had no money/options): Stop. This is Capacity Failure, not Willful Neglect.
  *   If **YES**: **VERDICT: MAN-MADE.**

  ---

  ## Phase 4: The "Can't-Tell-Yet" Branch (10 Minutes)
  *Use this when Mortality Data is missing (Phase 1, Q3 = UNKNOWN) but Price/Wage data is screaming.*

  **Condition:** Severity Gate passed on Prices/Wages, but no death counts yet.
  **Constraint:** You cannot claim famine without mortality. You cannot claim "Man-Made" without knowing if the response failed (because you don't know if people died).

  **Permitted Language:**
  *   "Conditions for excess mortality are present."
  *   "Entitlement protection has collapsed."
  *   "Policy decisions [Name Decision] are actively reducing access to food."
  *   **Forbidden:** "Famine," "Starvation," "Deaths."

  **Action:** Publish the Price/Wage collapse and the Policy Decision. Frame it as a *warning* of man-made risk, not a *report* of man-made famine.

  ---

  ## Phase 5: Human Handoff Points
  *The procedure cannot resolve these. Escalate to Analyst/Counsel.*

  1.  **Values Call:** If Phase 2 yields Option B (Market Failure) but the market failure was caused by long-term deregulation pushed by the current government. Is this "Man-Made"?
      *   *Procedure says:* No (No specific decision *during* crisis).
      *   *Advocacy wants:* Yes.
      *   *Action:* Hand off to Analyst. Do not file.
  2.  **Legal Exposure:** If Phase 3 identifies a foreign ally (e.g., a donor government cutting aid) as the "Identifiable Actor."
      *   *Action:* Hand off to Counsel. "Man-Made" may trigger diplomatic incidents affecting funding.
  3.  **Conflicting Data:** If Gov says "Record Harvest" and Press says "Empty Markets."
      *   *Action:* Hand off to Analyst. Requires triangulation beyond this protocol.

  ---

  # Test Case Runs

  ## Case 1: Bengal 1943
  **Phase 1: Severity**
  *   Prices: Rice prices quadrupled in 12 months. Wages stagnant. [YES]
  *   Distress: Mass migration to Calcutta, asset selling. [YES]
  *   Mortality: Estimates 1.5M–3M excess deaths. [YES]
  *   *Gate:* **Active Famine Conditions.**

  **Phase 2: Matrix**
  *   **Trigger:** **Mix of A & C.** Cyclone (A) + Japanese Occupation of Burma cutting rice imports (C).
  *   **Transmission:** **Option C.** "Denial Policy" (scorched earth in coastal Bengal to stop Japanese advance) + Speculative hoarding enabled by lack of regulation.
  *   **Response:** **Option C.** Churchill War Cabinet prioritized stockpiling for Europe/Military over Indian civilian relief. Export of grain from India continued during famine.

  **Phase 3: Determination**
  *   **Decision:** War Cabinet policy on grain allocation and export.
  *   **Actor:** UK War Cabinet / Churchill.
  *   **Counterfactual:** Grain was available in India/Australia; shipping was allocated elsewhere.
  *   **Verdict:** **MAN-MADE.**

  **The "Answer You Don't Want" (Analyst Note):**
  While the Protocol yields "Man-Made" based on Response (Level 3), you must acknowledge the Trigger (Level 1) debate. Historians argue there *was* a genuine aggregate supply shortfall (loss of 15% of supply from Burma) independent of policy. Sen's original entitlement argument suggests supply was adequate, but later data suggests a sharper drop.
  *   *Protocol Adjustment:* You can claim "Man-Made" because the *Response* (Exporting grain during a shortfall) turned a shortage into a famine. However, you cannot claim "There was enough food for everyone if distributed fairly" as an absolute fact. You must qualify: "Policy decisions exacerbated an existing supply shock."
  *   *Risk:* If you claim pure entitlement failure (food existed, people just couldn't buy it) and a historian proves a 15% caloric deficit, your credibility tanks.
  *   *Wording:* "While supply was constrained by war, policy decisions prevented mitigation and exacerbated mortality."

  ## Case 2: Ireland 1845-49
  **Phase 1: Severity**
  *   Prices: Potato value collapsed, Grain prices high. [YES]
  *   Distress: Mass eviction, coffin ships. [YES]
  *   Mortality: ~1M deaths. [YES]
  *   *Gate:* **Active Famine Conditions.**

  **Phase 2: Matrix**
  *   **Trigger:** **Option A.** Blight (Phytophthora infestans).
  *   **Transmission:** **Option B/C Mix.** Reliance on single crop (Structural) + Landlord evictions for rent (Decision/Structural).
  *   **Response:** **Option C.** **The Quarter-Acre Clause (1847).**

  **Phase 3: Determination**
  *   **Decision:** The "Gregory Clause." Relief (workhouse) barred to anyone holding more than 1/4 acre of land.
  *   **Actor:** British Parliament / Earl Grey (Colonial Secretary).
  *   **Counterfactual:** Relief could have been given without land forfeiture.
  *   **Worsening Outcome:** Forced smallholders to surrender land to enter workhouses, consolidating land ownership and increasing destitution long-term.
  *   **Verdict:** **MAN-MADE.**

  **Analyst Note:** This is the cleanest case. The Trigger was Natural (Blight), but the Response was a specific Legislative Act (Quarter-Acre Clause) that identifiable actors voted on. This fits Counsel's rule perfectly. The famine was not "caused" by the blight alone; the mortality was driven by the relief conditions.

  ## Case 3: Great Leap Forward (China 1958-62)
  **Phase 1: Severity**
  *   Prices: State procurement fixed, but black market skyrocketed. [YES]
  *   Distress: Internal migration restrictions, rural collapse. [YES]
  *   Mortality: 15M–45M excess deaths. [YES]
  *   *Gate:* **Active Famine Conditions.**

  **Phase 2: Matrix**
  *   **Trigger:** **Option C.** Policy decisions (Backyard Steel, Collectivization) diverted labor from harvest.
  *   **Transmission:** **Option C.** Grain requisitioning based on inflated production reports.
  *   **Response:** **Option C.** Continued grain export to USSR; suppression of local reporting; refusal to import.

  **Phase 3: Determination**
  *   **Decision:** Procurement quotas set at impossible levels; Export approvals.
  *   **Actor:** CCP Central Committee / Mao Zedong.
  *   **Counterfactual:** Quotas could have been lowered upon reports of failure; Imports could have been requested.
  *   **Verdict:** **MAN-MADE.**

  **Analyst Note:** Here, the Trigger itself is Man-Made (Option C). This is distinct from Ireland (Natural Trigger, Man-Made Response). In GLF, the "Natural" explanation (weather) is secondary to the policy extraction of food. The Transmission mechanism was direct confiscation, not just price failure.

  ---

  ## Limitations & Meta-Analysis

  **1. Judgment Calls Wearing a Procedure Costume**
  *   **Phase 2, Transmission (B vs C):** Determining if a price spike is "Market Speculation" (B) or "State-Sanctioned Hoarding" (C) often requires intelligence we don't have in an hour. If the Comms Lead guesses wrong, we risk libel.
      *   *Mitigation:* If unsure, default to B. Do not accuse without a paper trail (Order/Decree).
  *   **Phase 3, Counterfactual:** Deciding if a government "could have" done better is inherently political. One analyst's "neglect" is another's "fiscal prudence."
      *   *Mitigation:* Rely on *internal* government documents or press reports from the time showing experts warned against the decision.

  **2. What It Can't Settle**
  *   **Intent vs. Incompetence:** The protocol identifies *decisions* that worsened outcomes. It does not prove *genocidal intent*. Counsel may allow "Man-Made" but will block "Genocide" without proof of specific intent to destroy a group.
  *   **Long-Term Structural Violence:** If a famine is caused by 50 years of land dispossession rather than one specific decree, this protocol will return "No Man-Made" (because there is no single *Decision* during the crisis). This is a blind spot for advocacy but necessary for legal defense.

  **3. Where to Hand Off to Human**
  *   **The "Man-Made" Label:** The procedure recommends it, but the *final* decision to print the words "Man-Made Famine" must be signed by Counsel. The procedure provides the *evidence packet*, not the legal clearance.
  *   **The "Can't-Tell" Publishing:** Deciding how aggressive to be when mortality data is missing is a risk tolerance call, not a fact call. The Comms Lead must decide if the reputational risk of a false alarm outweighs the moral risk of silence.

  **4. The "Can't-Tell-Yet" Publishing Rule**
  *   If in Phase 4: You may publish the **Transmission** failure (e.g., "Wages have collapsed 50%") and the **Response** risk (e.g., "Govt has suspended relief").
  *   You may **not** publish the **Severity** conclusion (e.g., "People are dying").
  *   *Headline Example:* "Policy Blocks Food Access as Prices Spike" (Safe) vs. "Famine Looms Due to Policy" (Unsafe without mortality data).
