      *   *Refinement:* Actually, the prompt asks if it sides with Merton or undercuts him.
      *   *My Take:* The film undercuts Merton. Merton says "ideas are in the air." The film says "the idea was in the air (Winklevoss), but the *system* was in Mark's head (Facemash)." The film argues that *execution* isn't just labor; it's a specific psychological profile. Therefore, credit belongs to the psychologist-coder, not the concept-men.
      *   *Legal Integration:* The film runs on a *Copyright* intuition (expression = value) but is haunted by *Patent* logic (function = value). The settlement is the collision.

