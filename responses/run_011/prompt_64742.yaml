  3.  **Analyze the Legal Framework (Patent vs. Copyright):**
      *   *Patent:* Protects function/method. Independent invention is *not* a defense. If you invent the same thing separately, you still infringe. This aligns with "First to File" (mostly) and the idea that the invention itself is property.
      *   *Copyright:* Protects expression. Independent creation *is* a defense. If I write the same song without hearing yours, I'm not liable. This aligns with "expression is unique to the author."
