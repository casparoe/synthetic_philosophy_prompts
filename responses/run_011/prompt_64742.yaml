answer: |-
  **Seminar Handout: Priority, Property, and the Inevitability of Code**
  **Text:** *The Social Network* (Fincher/Sorkin, 2010)
  **Theoretical Frame:** Robert K. Merton, "Priorities in Scientific Discovery" (1957)

  ### I. The Core Position
  *The Social Network* superficially presents a Mertonian case study—a ripe field (Harvard, 2003) producing simultaneous claims on a social network—but ultimately **undercuts Merton's structuralism.** The film argues that while the *concept* of a digital directory was in the air (a multiple), the *mechanism* of Facebook (algorithmic ranking + exclusivity) was not inevitable. It was contingent on Zuckerberg's specific psychological profile.

  Therefore, the film does not side with Merton (credit belongs to the one who executes the inevitable). Instead, it posits a **"Great Man" theory of code**: execution is not merely labor applied to an idea; execution is a form of psychological expression that cannot be replicated by others who hold the same "idea." The Winklevosses had the noun; Zuckerberg had the verb.

  ### II. Discussion Module: Merton vs. The Opening Scene
  **The Mertonian Expectation:**
  If Merton is right, the Winklevoss claim is valid but trivial. In a ripe field, "independent invention" is the norm. Credit should go to the one who publishes/launches first (Zuckerberg), but the "scandal" of the theft is illusory. The twins represent the "conceptual" phase of discovery; Mark represents the "functional" phase.

  **The Film's Rebuttal (The Facemash Prequel):**
  The film refuses to let the "idea" be the unit of discovery.
  *   **Evidence:** The opening scene establishes that Zuckerberg possesses the two defining features of Facebook *before* the Winklevosses pitch him:
      1.  **Exclusivity:** The use of Harvard email domains as a gatekeeping mechanism (Facemash).
      2.  **Ranking:** The algorithmic comparison of human value (Facemash).
  *   **Argument:** When the twins pitch "Harvard Connection," they are pitching a static directory. Mark builds a dynamic feed. The film suggests these are not the same discovery. If the "discovery" is defined as *the specific architecture of social validation*, then there was no multiple. There was only one person capable of that specific synthesis.
  *   **Seminar Question:** Does the film define the "invention" as the *social network* (Merton: multiple) or the *algorithmic ranking of social status* (Film: singular)? How does the editing of the coding montages (Mark vs. the twins rowing) reinforce this distinction?

  ### III. Discussion Module: The Ending and the Scarce Good
  **The Mertonian Conclusion:**
  If ideas are cheap and execution is scarce, the ending should show Mark enjoying the fruits of his scarce labor. He is the youngest billionaire; he "won."

  **The Film's Actual Conclusion:**
  The final shot (refreshing Erica Albright's profile) concedes that **execution was not the scarce good.**
  *   **Analysis:** Mark successfully executed the code, the business, and the legal defense. Yet, he lacks the one thing the Winklevosses claimed to represent: social legitimacy and connection.
  *   **The Twist:** The film suggests that while *technical* execution was scarce (only Mark could code it), *social* execution was even scarcer (Mark cannot navigate the world he built).
  *   **Seminar Question:** Merton argues credit is a reward system for advancing science. If the protagonist has the credit (money/status) but lacks the connection (the goal of the network), does the film suggest the priority system is broken? Or that the "discovery" destroyed the very thing it sought to map?

  ### IV. Discussion Module: The Legal Lens (Patent vs. Copyright)
  *The film never explicitly cites IP law, but the moral architecture of the dispute relies on a tension between two legal regimes.*

  **1. The Patent Model (Function is Property)**
  *   **Rule:** Independent invention is *no defense*. If you invent the same machine separately, you still infringe.
  *   **Implication:** The "idea" is the property. If the Winklevosses conceived the function of a Harvard-only network, Mark infringes regardless of his code.
  *   **Film Alignment:** The settlement ($65 million) and the deposition scenes lean this way. The twins argue they owned the *opportunity*.

  **2. The Copyright Model (Expression is Property)**
  *   **Rule:** Independent creation *is a defense*. If I write the same song without hearing yours, I am not liable.
  *   **Implication:** The "code" is the property. If Mark wrote the lines himself, he owes nothing.
  *   **Film Alignment:** The audience's sympathy leans this way. We watch Mark type. We see the code emerge from his mind, not from the twins' documents.

  **5. The Swap Test (What Breaks?)**
  *   **Scenario A: Run the film on pure Patent Logic.**
      *   *Result:* Mark is a villain. The speed of his coding is irrelevant. He utilized their functional concept. The "Great Man" defense collapses because the function was theirs. The film's dramatic tension evaporates; it becomes a simple story of breach of contract.
  *   **Scenario B: Run the film on pure Copyright Logic.**
      *   *Result:* The Winklevosses are irrelevant. There is no lawsuit. If expression is all that matters, their pitch deck has no bearing on his C++ . The conflict requires a hybrid model: **Trade Secret/Partnership.**
  *   **The Film's Implicit Model:** The film operates on a **Fiduciary** model, not a pure IP model. It argues that even if the *code* is Copyright (Mark's), the *opportunity* was a Partnership asset.
  *   **Seminar Question:** The law settled the case via settlement (ambiguity), not precedent. If the film had ended with a verdict, which model would have served the narrative better? A Patent verdict (Mark stole the function) makes it a tragedy of greed. A Copyright verdict (Mark wrote the code) makes it a triumph of merit. Which ending does Fincher want us to feel?

  ### V. Synthesis: The "Character" of Discovery
  Merton treats discovery as impersonal; the "ripe field" does the work. *The Social Network* treats discovery as deeply personal.
  *   **The Thesis:** The film argues that in the digital age, the distinction between "idea" and "execution" has collapsed. The code *is* the idea. Because the code is an expression of the coder's psychology (Mark's grievance, Mark's exclusivity, Mark's ranking instinct), the discovery cannot be a "multiple."
  *   **The Cost:** By making the discovery contingent on Mark's specific grievances (Erica, the clubs, the status anxiety), the film suggests that **inevitability is a myth.** Facebook wasn't inevitable; it was the output of a specific kind of alienation.
  *   **Final Takeaway:** We credit Mark not because he was first (Merton), but because he was *specific*. The Winklevosses could be replaced; the code could theoretically be written by others. But *this* Facebook, with *this* impact, required *this* psyche. The film rejects the multiple-discovery thesis in favor of a psychological determinism: the technology is inevitable, but the *form* it takes is a portrait of its creator.

  ### VI. Suggested Reading Pairings
  1.  **Robert K. Merton,** "Priorities in Scientific Discovery" (for the baseline theory).
  2.  **Mark Lemley,** "The Myth of the Sole Inventor" (for the legal counterpoint to Merton).
  3.  **Walter Isaacson,** *The Innovators* (Chapter on Facebook, for the historical counter-narrative to the film).
