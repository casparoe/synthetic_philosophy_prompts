answer: |-
  Hey, it sounds like you have hit the exact wall I expected you would with that group, and honestly it is a good problem to have because it means they have actually internalized the previous lessons enough to inoculate themselves against the standard demos. The idea of breaking algorithmic symmetry while maintaining situational symmetry is the right move here, and calling it reference class leakage is perfect because that is exactly what hurts the superrational argument in the wild. You want to run a single-shot public goods game disguised as a prisoner's dilemma variant, but you need to rig the envelope distribution so that the common knowledge of rationality is severed without anyone knowing who holds the knife. Here is the setup you need to build, and I am going to walk you through the materials, the script, the math, and the mess that will happen afterward.

  You need to print fourteen cards that look identical from the back, but on the front, ten of them should say Standard Agent Instructions while the remaining four are split between two other types. Specifically, you want three cards that say Forced Defector Instructions and one card that says Randomize Instructions. Do not label them with numbers or colors that could be seen from the side. Put each card in an opaque envelope along with a decision slip that has two checkboxes labeled Contribute and Keep, and give everyone ten physical tokens at the start that they can hold in their hand. The rules you read aloud need to be precise and dry to avoid framing effects, so you should say something like everyone starts with ten tokens and must choose to either keep all ten or contribute all ten to a central pool, and if you contribute ten tokens the pool increases by fifteen tokens while keeping adds nothing to the pool, and after everyone decides the total pool will be divided equally among all fourteen participants regardless of their individual choice, and finally any tokens you kept are yours to keep plus your share of the pool. This creates a standard multiplication factor where full cooperation yields a net gain of five tokens per person while full defection yields zero, but the critical twist is the announcement you make before they open the envelopes. You must tell them that while the cards look identical, the instructions inside are not, and specifically that between thirty percent and fifty percent of the room are operating under constraints that prevent them from making a free choice or compel them to a specific outcome, and that this distribution is fixed before they sit down. This range is the knife edge because if only four people are forced defectors then cooperation is still marginally profitable for the standard agents, but if five or more are effectively out of the cooperation class then contributing becomes a net loss for the remaining standard agents, and since they know the range is four to seven based on your percentages but not the exact number, they cannot calculate the expected value of cooperation without knowing the algorithmic distribution of the room.

  For the timeline, you should spend the first ten minutes setting the room up and handing out the envelopes face down, then take five minutes to read the rules and the disclaimer about the hidden instructions, then give them twenty minutes of silent thinking time where they are not allowed to talk or signal in any way, which will feel like an eternity to them and is where the actual psychological work happens, then collect the decision slips and tokens in a sealed box without revealing choices individually, and finally spend the remaining forty five minutes on the debrief. Do not run multiple rounds because iteration invites reputation building and punishment strategies which collapses the problem back into standard iterated prisoner's dilemma folk theorems, and you want this to be a one-shot measurement of their decision theory under uncertainty. You should however run a dummy round with zero stakes using colored pens just to test the envelope mechanism and ensure everyone understands how to mark the slip, but make it clear that round counts for nothing so they do not anchor on it. When you reveal the results, do not reveal who had which card immediately, but instead reveal the total contribution count first, then ask the room to estimate how many forced defectors there must have been to produce that number, and only then reveal the actual card distribution to show where their estimates landed relative to the break-even point of four versus five defectors.

  The debrief is where you actually win or lose this session, and you need to guide them away from blaming the defectors and toward blaming their own assumption of algorithmic symmetry. You should ask the standard agents who cooperated why they did so, and when they say because everyone else is rational too, you point out that the premise of everyone else running the same algorithm was objectively false by design, and then ask the standard agents who defected if they defected because they wanted to free ride or because they suspected the reference class was leaked, and most will admit they suspected the leak. The goal is to get them to admit that superrationality works only if the correlation between your decision and theirs is near one, and this exercise forced that correlation down to something like zero point seven without changing the physical symmetry of the situation. You want them to realize that their prior knowledge of the concept made them try to outguess the distribution rather than trust the symmetry, and that in doing so they acted as if they were unique agents rather than instances of a procedure, which is the exact failure mode Hofstadter warns about.

  There are several things that will predictably go wrong and you need to be ready to handle them live without breaking the frame. Someone will try to signal by tapping their pen or coughing in a rhythm to indicate they are cooperating, and you need to stop the room and restart the timer if you catch this because it breaks the information barrier. Someone will refuse to cooperate on principle because they feel the hidden instructions are coercive or unfair, and you should acknowledge their point but remind them that the payoff matrix remains unchanged regardless of fairness. Someone will have read everything and be unshakable in their defection because they claim the hidden roles destroy the common knowledge required for superrationality, and you should agree with them during the debrief because they are technically correct and that is the lesson. Someone might figure out the card distribution from who they are sitting next to if you handed them out in a pattern, so you must shuffle the envelopes thoroughly and hand them out in a zigzag pattern or have a co-host distribute them randomly. If someone asks during the thinking time if the percentages include the randomizer, you should say only that the percentages cover anyone not making a free standard choice, which is true but vague enough to maintain the uncertainty.

  You also need to be frank with them about what this room can never reproduce, which is the genuinely identical agents with no history and no read on each other's faces that makes the acausal trade argument stick in the first place. In this room, they know each other, they have four years of history, and they can read micro-expressions, so the cost of this simulation is that you are forcing them to ignore data they naturally possess, which feels artificial. You as the facilitator have to supply the isolation by hand by enforcing the silence and the envelope secrecy, and you should acknowledge that in the real world reference class leakage is usually discovered through behavior rather than announced by a gamemaster. The limitation is that this proves superrationality is fragile under uncertainty about the agent class, but it does not prove it is wrong when the agent class is known, so make sure you do not let them walk away thinking superrationality is dead, but rather that it is conditional on a premise they rarely verify.

  Finally, when you wrap up, remind them that the tokens convert to the pizza fund so the stakes are real but small, and encourage them to buy the next round of drinks based on who they think was the randomizer. This whole thing relies on them trusting you not to lie about the card distribution, so you must actually follow the setup exactly as described with ten standard cards and four non-standard ones, and you should keep the used cards to show them afterward if anyone doubts the integrity of the mix. It is going to be uncomfortable for them to sit in silence knowing the game is rigged, but that discomfort is the data point you are after, and if you can keep them from turning it into a shouting match about fairness you will have given them a much deeper critique of their own decision procedures than any paper tournament ever could. Good luck with the meetup, and let me know if the pizza fund survives the defection rate.
