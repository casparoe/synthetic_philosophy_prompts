      *   *Roles:* 1 Governor, 1 Steward (Scribe/Dice), 6 Electors.
      *   *Resources:* 3 Polities. 24 students. Perfect fit.
      *   *Hidden Info:* Governor picks Policy Card (Safe/Steady/Bold). Steward rolls Die based on Card. Steward calculates Net SP. Steward tells Electors *only* the Net SP and whether Target was met. Electors do *not* see Card or Die.
