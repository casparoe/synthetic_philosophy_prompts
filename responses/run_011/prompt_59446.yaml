answer: |-
  ### The Setup

  **Polities & Group Size**
  Divide the 24 students into **3 Polities of 8 students**.
  *   **Polity A (The Bureaucracy):** Procedural legitimacy focus.
  *   **Polity B (The Meritocracy):** Performance legitimacy focus (Ruler sets baseline).
  *   **Polity C (The Assembly):** Performance legitimacy focus (Citizens set baseline).

  **Roles (within each Polity)**
  *   **1 Governor:** Makes policy choices, negotiates targets (depending on Charter).
  *   **1 Steward:** The "Black Box." Holds the dice, the policy cards, and the math sheet. **Crucial:** The Steward speaks to the Governor and the Electors but reveals *only* specific info to each (see Information Flow).
  *   **6 Electors:** The citizens. They see outcomes, not inputs. They vote.

  **Materials**
  *   **Index Cards (Policy Deck):** 3 cards per Governor per round.
      *   *Card 1 (Conservative):* Roll 1d6. Result +1. (Low risk, low reward).
      *   *Card 2 (Moderate):* Roll 1d8. Result +0. (Med risk, med reward).
      *   *Card 3 (Aggressive):* Roll 1d10. Result -2. (High risk, high reward, chance of negative outcome).
  *   **Dice:** 1d6, 1d8, 1d10 per Steward.
  *   **Paper:** For tracking "Stability Points" (SP). Start each Polity with **20 SP**.
  *   **Tokens:** Paper clips or ticks on a sheet to represent SP.

  **The Charters (The Rules of the Game)**
  *   **Polity A (Bureaucracy):**
      *   **Target:** Fixed by the game at **+4 SP per round**.
      *   **Removal:** Electors vote. Requires **6/6 votes** to oust Governor. (Extremely hard).
      *   **Incentive:** Governor wants to stay in power (ego). Electors want SP growth.
  *   **Polity B (Meritocracy):**
      *   **Target:** **Governor sets the Target** at start of round (e.g., "I promise +5 SP").
      *   **Removal:** Automatic ouster if Target is **missed**. (No vote needed).
      *   **Incentive:** Governor must balance promising enough to please Electors vs. promising little enough to survive.
  *   **Polity C (Assembly):**
      *   **Target:** **Electors set the Target** (Majority vote) at start of round.
      *   **Removal:** Electors vote. Requires **4/6 votes** to oust Governor.
      *   **Incentive:** Electors want high targets; Governor warns them if targets are unrealistic.

  **Information Flow (The "Luck" Constraint)**
  1.  **Target Phase:** Target is set according to Charter. Announced publicly.
  2.  **Policy Phase:** Governor selects a Policy Card (Conservative/Moderate/Aggressive). **Hands card face-down to Steward.** Electors do *not* see the card.
  3.  **Resolution Phase:** Steward rolls the corresponding die, applies modifiers, calculates Net SP change.
  4.  **Reporting Phase:** Steward announces **only** two things to the Electors:
      *   "New Total SP: [X]"
      *   "Target Status: [Met / Not Met]"
      *   *The Steward never reveals the Die Roll or the Policy Card.*
  5.  **Judgment Phase:** Electors vote to Keep/Oust (if Charter allows). If Ousted, new Governor chosen from Electors (costs Polity 2 SP for "transition chaos").

  **Shock Sequence (Generated by You)**
  *   **Round 1:** Normal conditions.
  *   **Round 2:** "External Shock." Announce: *"Global recession. All Die Rolls suffer -2 penalty."* (Do not tell them until after Policy cards are submitted).
  *   **Round 3:** "Recovery." Normal conditions, but starting SP varies wildly based on Round 2 performance.

  **Scoring Scheme**
  *   **Currency:** Stability Points (SP).
  *   **Win Condition:** Any Polity ending with **>30 SP** wins "The Century of Stability."
  *   **Loss Condition:** Any Polity hitting **0 SP** "Collapses." All members must write a 1-page reflection on why their government failed (low-stakes punishment).
  *   **Why they care:** Bragging rights + avoiding the reflection paper.

  ---

  ### Minute-by-Minute Timeline (75 Minutes)

  *   **00:00 – 00:10 (Setup):** Divide groups. Hand out materials. Read Charters aloud. Emphasize the **Steward's Secrecy Rule** (If you leak the die roll, you invalidate the experiment).
  *   **00:10 – 00:20 (Round 1):** Target Setting -> Policy Choice -> Resolution -> Vote. (Keep this brisk).
  *   **00:20 – 00:30 (Round 2):** Target Setting -> Policy Choice -> **Announce Shock** -> Resolution -> Vote. (Watch for panic in Polity B).
  *   **00:30 – 00:40 (Round 3):** Target Setting -> Policy Choice -> Resolution -> Vote. (Final push).
  *   **00:40 – 00:45 (Tally):** Count SP. Announce Winners/Collapses. Collect materials.
  *   **00:45 – 01:15 (Debrief):** Structured discussion (see Table below).

  ---

  ### Failure Modes & Corrections

  **1. The "Sandbagging" Ruler (Polity B)**
  *   *Risk:* The Governor realizes they can set the Target at +1 SP every round, pick Conservative policy, and never get ousted.
  *   *Correction:* Add a rule: **"Elector Restlessness."** If the Target is set below +3 SP, Electors automatically lose 1 SP at the end of the round due to "stagnation," regardless of performance. This forces the Ruler to aim higher, reintroducing risk.

  **2. The Bored Electorate**
  *   *Risk:* If the Steward is slow, Electors sit idle.
  *   *Correction:* While the Steward calculates, Electors must hold a 30-second "Town Hall" to discuss whether they *think* the Governor is taking enough risk. This keeps them engaged in the *interpretation* of the hidden info.

  **3. The "Unlucky Martyr" (Hypothesis 3)**
  *   *Risk:* A good Governor picks Aggressive, rolls a 1, misses target, gets ousted. Electors feel it was "unfair."
  *   *Correction:* **Lean into this.** This is the learning moment. Do not comfort them. Let them sit with the frustration that the system punished luck as if it were incompetence.

  **4. Sensitivity & Real-World Analogues**
  *   *Risk:* Students from authoritarian or unstable regimes feel targeted.
  *   *Correction:* Use abstract names (Polity A/B/C). Do not ask "Which real country is this?" during the game. In the debrief, *you* introduce the real-world parallels only after they have articulated the theoretical problem. If a student volunteers a real-world example, validate it ("That's a sharp observation") but pivot back to the mechanism ("How did that mechanism function in our game?").

  ---

  ### The Debrief

  | moment_in_game | what_theyll_probably_say | the_claim_it_supports | the_question_to_ask | where_the_analogy_breaks |
  | :--- | :--- | :--- | :--- | :--- |
  | **Polity B Round 2 (Post-Shock)** | "It's not fair! The Governor played well but the dice went low. We fired them for bad luck." | **Outcomes ≠ Skill.** Performance legitimacy cannot distinguish competence from fortune. | "If you can't tell the difference between bad luck and bad policy, what are you actually voting on?" | In reality, citizens have media/experts to analyze *process*, not just outcomes. The game hides the process entirely. |
  | **Polity B Target Setting** | "The Governor kept promising low numbers so they couldn't fail. We got mad but couldn't fire them." | **The Baseline is Political.** The metric of success is negotiated, not objective. | "Who owns the definition of 'success' in this room? If the ruler defines it, can they ever lose?" | In reality, baselines are often historical (e.g., GDP growth vs last year), which constrains manipulation slightly. |
  | **Polity A vs. B Final Scores** | "Polity A was boring but stable. Polity B had huge swings and almost crashed." | **Risk Shape.** Performance legitimacy has a longer fuse but a bigger explosion than procedural friction. | "Would you rather have a government you can't fire (A) or one that might collapse entirely (B)? Why?" | Real procedural systems (elections) do allow removal, just with friction. Polity A was an extreme caricature of tenure. |
  | **Polity C Target Vote** | "We voted for a high target to pressure them, then fired them when they missed it." | **Collective Irresponsibility.** Citizens may demand impossible performance to signal virtue, then punish the result. | "Did the Electors in Polity C share responsibility for the failure, or was it all on the Governor?" | In reality, citizens don't vote on specific GDP targets; they vote on representatives who make vague promises. |
  | **End Game (Collapses)** | "We should have played safer in Round 2." | **Retrospective Clarity.** Legitimacy crises are always obvious in hindsight, opaque in the moment. | "Knowing what you know now, what would you change? Why couldn't you see that *during* the round?" | In reality, we never get a "Round 3" to fix the collapse. The stakes are permanent, not resettable. |

  ---

  ### Limitations: What You Must Say Out Loud

  This activity cannot reproduce **ideological commitment**. In the game, students are rational actors maximizing Stability Points. In the real world, people support regimes that perform *poorly* because of nationalism, religion, or fear. You must explicitly state: *"In this game, you all agreed SP was the only thing that mattered. In reality, people often tolerate low SP for high security, or high identity, or religious fulfillment. Performance legitimacy is rarely just about performance."*

  You also cannot reproduce **coercion**. If Polity B hit 0 SP, they "collapsed." In reality, a regime might simply shoot the protesters and stay in power despite zero legitimacy. You must add: *"We assumed the game ends when SP hits zero. In history, regimes often survive long after they have lost the right to rule."*

  ---

  ### Confidence Assessment

  **Confidence Level: 85%**
  This design is robust because the mechanics directly map to the philosophical claims (Hidden Info = Luck/Skill problem; Target Setting = Baseline problem). The "Steward" role ensures the information asymmetry holds without you needing to micromanage every table.

