      *   *The Tension:* If we can't introspect (Req 5 constraint) and self-report is contaminated (Req 1 constraint), we rely on behavior/structure. But behavior is gameable (Req 3 constraint).
      *   *The Hard Truth:* Under current engineering constraints, *Non-Simulability* + *Decidability* might be jointly unsatisfiable. We cannot prove non-simulation from the outside without introspection.
      *   *Resolution:* One must give. Usually, in policy, *Decidability* wins, meaning we accept a proxy (behavior) despite the risk of simulation. Or, *Non-Simulability* wins, meaning we treat nothing as having status until proven otherwise (precautionary principle), which might be too costly.
