answer: |-
  Your suspicion is well-founded. While your colleague is correct that this passage follows a standard introductory template often found in undergraduate surveys, describing it as "basically right" grants it a fidelity it does not possess. The passage relies on caricatures that were common in the mid-20th century but have been substantially revised by specialists in the last forty years. It treats complex metaphysical disagreements as stylistic differences and conflates distinct philosophical claims to create a narrative arc that suits the book's theme (the erosion of facts) rather than the history of ideas.

  Here is the sentence-by-sentence audit, sorted into your three requested piles.

  ### Part 1: The Audit

  #### Pile 1: What a specialist would accept
  *   **Sentence 1 (Partial):** *"Peirce and James agreed that the meaning of a belief lies in its practical consequences..."*
      *   **Verdict:** **Accept.** This is a fair summary of the "Pragmatic Maxim" which both endorsed in the 1870s.
  *   **Sentence 4 (Partial):** *"...Peirce was appalled, and coined the deliberately unattractive name pragmaticism for his own doctrine so that it could not be confused with James's..."*
      *   **Verdict:** **Accept.** Peirce did rename his doctrine in 1905 specifically to dissociate it from the popular interpretation of James's work.

  #### Pile 2: Defensible popular compression (costs nothing important)
  *   **Sentence 1 (Partial):** *"...but they split over what to do with truth itself."*
      *   **Verdict:** **Compression.** The split was deeper than just "truth"; it involved logic, metaphysics, and the nature of reality. However, for a trade book, focusing on truth is a permissible simplification.
  *   **Sentence 3 (Partial):** *"...which is why he was quite content to say that belief in God is true if it makes your life go better."*
      *   **Verdict:** **Compression.** James did argue that religious belief can be "true" insofar as it yields vital benefits that cannot be accessed otherwise. While this omits his caveats about consistency with experience, it captures the spirit of his *Will to Believe* argument sufficiently for a general audience.
  *   **Sentence 5 (Partial):** *"The decisive objection arrived almost immediately from critics such as Bertrand Russell, who pointed out that plenty of false beliefs are useful and plenty of true ones ruinous..."*
      *   **Verdict:** **Compression.** Russell did make this objection (in *The Problems of Philosophy*, 1912). Summarizing it this way is standard. The error lies in the *consequence* attributed to this objection (see Pile 3).

  #### Pile 3: Misrepresentation (Conflated Claims)
  *   **Sentence 2:** *"Peirce... defined a true belief as one that investigators would converge on if inquiry were carried far enough, which makes truth on his account a matter of what the scientific community eventually settles on rather than of how things are."*
      *   **Conflation:** The author runs together **Consensus** and **Reality**.
      *   **The Error:** The text implies Peirce thought truth is *created* by the community ("what the community... settles on"). Peirce was a Scholastic Realist; he believed the community converges *because* they are constrained by an external reality. The convergence is the *sign* of truth, not the *definition* of it.
      *   **Peirce's Objection:** Peirce would object that the author has turned him into a social constructivist. He believed inquiry is driven by the irritation of doubt caused by a recalcitrant world. The "final opinion" is true *because* it matches reality, not merely because everyone agrees on it.
  *   **Sentence 3 (Partial):** *"...for him a belief was true just to the extent that holding it paid off for the person holding it..."*
      *   **Conflation:** The author runs together **Immediate Utility** and **Long-Run Verification**.
      *   **The Error:** The text suggests James defined truth as whatever is immediately gratifying or psychologically comforting to the individual. James defined truth as what is "expedient in the way of our thinking," which includes agreement with sensory experience and consistency with previous truths.
      *   **James's Objection:** James would object that he never sanctioned believing obvious falsehoods simply because they feel good. For James, a belief must "marry" previous opinion with new experience. A comforting falsehood usually fails this test eventually.
  *   **Sentence 4 (Partial):** *"...the disagreement between the two came down in the end to temperament rather than substance, the logical Peirce against the psychological James."*
      *   **Conflation:** The author runs together **Stylistic Difference** and **Metaphysical Disagreement**.
      *   **The Error:** The text attributes the split to personality (logic vs. psychology). The split was actually about Nominalism vs. Realism. Peirce believed in real generals (laws, habits); James was more nominalist (focused on particular experiences).
      *   **Peirce's Objection:** Peirce explicitly stated the difference was substantive. He renamed his doctrine "pragmaticism" not just to be distinct, but to preserve the objective, logical core of pragmatism which he felt James had subjectivized.
  *   **Sentence 5 (Partial):** *"...and pragmatism has never really recovered."*
      *   **Conflation:** The author runs together **Early Criticism** and **Historical Trajectory**.
      *   **The Error:** This ignores the massive revival of pragmatism in the late 20th century (Quine, Putnam, Rorty, Haack, Brandom).
      *   **Specialist Objection:** Any historian of philosophy would note that pragmatism is currently one of the dominant traditions in Anglo-American philosophy. To say it "never recovered" is factually false.
  *   **Sentence 6:** *"Since the theory makes truth a function of what works for us, it is hardly surprising that the intellectual culture which absorbed it now struggles to say why a comforting falsehood should be resisted."*
      *   **Conflation:** The author runs together **Philosophical Theory** and **Cultural Causation**.
      *   **The Error:** This assumes a direct causal line from James's writings to modern "post-truth" politics without evidence. It also assumes pragmatism *cannot* distinguish between "what works short-term" and "what works long-term."
      *   **Pragmatist Objection:** A pragmatist would argue their theory provides *better* tools to resist comforting falsehoods than correspondence theories, because it demands we test beliefs against experience. If a falsehood is comforting but leads to failed predictions, pragmatism demands we discard it.

  ***

  ### Part 2: Settling the Three Questions

  **1. Is the "temperament rather than substance" characterisation right, and does the renaming story support it?**
  No, it is not right. It is a misrepresentation. The renaming story actually **undercuts** the author's claim. Peirce did not coin "pragmaticism" merely to signal a difference in style or temperament; he did it because he believed James had fundamentally altered the logical structure of the doctrine. Peirce accused James of introducing "nominalism" (the idea that only particular things are real) into a system Peirce intended to be "realist" (the idea that laws and habits are real). If the disagreement were merely temperament, Peirce would not have felt the need to surgically separate his doctrine to save its logical integrity. You can concede that they had different temperaments (Peirce was indeed more systematic, James more literary), but you cannot concede that this was the *cause* of the philosophical split.

  **2. Is the objection regarding useful falsehoods actually decisive?**
  No. It is a standard objection, but it is not decisive because it attacks a straw man.
  *   **Against Peirce:** The objection does not land. Peirce's definition of truth relies on the *end* of inquiry (the long run). A false belief might be useful now, but Peirce argues that if inquiry is pushed far enough, the friction of reality will expose it. Therefore, a "useful falsehood" is, by definition, not true for Peirce, because it would not survive the ultimate test of the community's investigation.
  *   **Against James:** The objection lands harder but is not fatal. James acknowledges that some truths are unpleasant and some falsehoods are useful *in the moment*. However, James defines truth as what is expedient *over the whole course of experience*. A comforting falsehood usually requires maintaining other falsehoods to support it, eventually becoming "expediently" burdensome.
  *   **Resources:** The pragmatist resource here is the **time horizon**. The author treats "what works" as immediate gratification. The pragmatist treats "what works" as what sustains successful interaction with the world over time. The objection only works if you ignore the long run.

  **3. Does the closing claim (that this culture is ill-equipped to resist comforting falsehoods) follow?**
  No, it does not follow from any part of the passage that survives correction.
  First, the historical claim that our culture "absorbed" this theory is dubious; most public discourse operates on a naive realism, not pragmatism. Second, even if we accept the premise, the logic is inverted. If truth is defined by "what works" (properly understood as what withstands testing), then a "comforting falsehood" is precisely the thing a pragmatist is *most* equipped to identify and discard, because it will fail the test of experience. The author assumes pragmatism validates *any* belief that feels good, which is the very misrepresentation identified in Pile 3. Therefore, the conclusion is a non-sequitur based on a flawed premise.

  ***

  ### Part 3: What to Concede to Your Colleague

  You do not need to surrender your affection for James to find common ground. Here is the precise boundary of what you can safely concede:

  1.  **Concede the Outline:** You can agree that the passage accurately captures the *popular* understanding of the split. Your colleague is right that this is "standard" introductory material. It is not idiosyncratic nonsense; it is the standard simplified narrative found in many textbooks.
  2.  **Concede the Russell Objection:** You can agree that Russell's objection is the *classic* critique of pragmatism. It is the most famous counter-argument, even if specialists do not consider it "decisive" or fatal.
  3.  **Hold the Line on Substance:** You must insist that "temperament rather than substance" is historically inaccurate. This is the point where the passage moves from "compression" to "error." You can tell your colleague: *"I accept that James opened the door to subjectivity more than Peirce, but to call it temperament ignores Peirce's explicit metaphysical objections regarding Realism. Peirce didn't just dislike James's style; he thought James was wrong about the nature of reality."*
  4.  **Hold the Line on the Conclusion:** You can reject the final sentence as a rhetorical flourish rather than a philosophical argument. The link between William James's 1907 lectures and the modern erosion of shared facts is a causal claim the author does not support.

  **Summary for your group:** The passage is a "defensible compression" of the *history of reception* (how people talked about pragmatism in the mid-20th century), but it is a "misrepresentation" of the *philosophy itself* (how Peirce and James actually argued). Your colleague is reading it as the former; you are reading it as the latter. Both of you are partially right, but on the specific philosophical claims, your reading is the more accurate one.
