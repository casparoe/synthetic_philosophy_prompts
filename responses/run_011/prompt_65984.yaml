answer: |-
  You confuse potentiality with incapacity. The child possesses reason as a seed that grows toward command; the natural slave possesses reason only as a listener perceives a speaker. He knows the reason when it is spoken by another, but he cannot originate it himself. This is not a matter of age or education, but of soul. Just as some bodies are born weak and others strong, some souls are born to follow and others to lead. I concede freely that many now held in chains in Athens are not such by nature—war is a clumsy artist, and often captures those fitted to rule. But this error of convention does not erase the truth of nature. Where the distinction is clear, the slave is not a permanent child waiting to grow, but a mature being whose excellence lies in following another's helm.

  Regarding the shuttle: if it wove itself, it would move, but it would not understand the pattern. The slave is an animate instrument, distinct from the lyre because he participates in reason enough to perceive the end of his action. The conventionalist says slavery is mere force because they look only at the body's labor. I look at the soul's direction. When the natural slave serves the natural master, the body obeys the soul that is foreign to it because it cannot find order within itself. This is not collapse into their view of force; it is an ascent to a view of harmony. The work gets done, yes, but more importantly, both parts achieve their proper function, and the slave shares in the virtue of the master as a limb shares in the life of the body.
