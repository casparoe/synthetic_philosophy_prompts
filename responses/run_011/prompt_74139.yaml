  You should abandon verdict (6), because the most defensible principle defines moral worth by stable responsiveness to right-making features rather than the specific affective tone of the motive, which renders the reliable shame-avoider worthy.

  **The Principle**
  An act has moral worth if and only if:
  1.  **Rightness:** The act is objectively right.
  2.  **Responsiveness:** The agent is motivated by a desire or concern that tracks the natural properties that make the act right.
  3.  **Stability:** This tracking is non-accidental, holding across a reasonable range of nearby possible variations.

  **Case Analysis**
  *   **Cases (1) and (5) motivate Clause 2 (Responsiveness).** These cases show that the motive need not be explicitly *moral* (e.g., "duty" or "moral principle") to confer worth. The restaurateur’s fastidiousness tracks the natural property of food safety; the friend’s affection tracks the natural property of distress. Both are responsive to the right-making features, even if unlabeled as such.
  *   **Cases (2), (3), and (4) motivate Clause 3 (Stability).** The wealthy rival (2) and the thrill-seeking rescuer (4) fail because their motives would not sustain the right act in nearby worlds where the rival is absent or the thrill is missing; their alignment is contingent, not stable. The clerk (3) fails because the correlation between her manual and the right act is lucky, violating the non-accidental requirement.
  *   **Case (6) is the outlier.** Your principle correctly identifies (6) as worthy because the agent satisfies all three clauses: the act is right, he identifies and tracks the right-making features, and he does so reliably across variations. Your intuition that he is *not* worthy relies on the idea that shame is an unworthy motive, but if the shame functions as a reliable mechanism for responsiveness to value, it confers worth just as fastidiousness does in (1).

  **The Trained Desire Case**
  Your principle yields **Worthy** for the agent who trains himself to desire what he judges good.
  *   **Rightness:** Presumed.
  *   **Responsiveness:** His trained desires are now aligned with the good/right-making features.
  *   **Stability:** Years of training imply a robust disposition that holds across variations.
  This case represents the ideal of virtue ethics (internalized right reason) and fits seamlessly into the principle.

  **Recommendation on Verdicts**
  You must abandon verdict **(6)**. Maintaining that the shame-avoider lacks moral worth while granting it to the fastidious restaurateur (1) is inconsistent. In both cases, a self-regarding disposition (fastidiousness vs. shame-avoidance) reliably produces right action by tracking the relevant natural properties. If (1) is worthy because the tracking is stable, (6) must be worthy for the same reason. The moral worth of an act lies in the agent's non-accidental connection to the reasons that make the act right, not in the phenomenological quality of the motive.
