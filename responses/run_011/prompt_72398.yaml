      *   *Tone Check:* Avoid being condescending to the PI. She knows the criteria are contested; that's why she wants to quantify them. Acknowledge her intelligence while pointing out the trap.

  5.  **Final Polish:**
      *   Ensure the "Decision" is unambiguous.
      *   Make sure the "Voting Items" are distinct.
      *   Check that the word count is appropriate (not too long, but detailed enough).
      *   *Key Phrase Integration:* "Laundering circularity as arithmetic," "pure vibes," "show their work."

  6.  **Final Review against constraints:**
