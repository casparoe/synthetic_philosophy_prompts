          *   *Synthesis:* Why fund anyway? Because making the bias explicit is better than hiding it. The tool is a *heuristic*, not an *oracle*.
      *   **Conditions/Revisions:** These need to be specific enough to vote on.
          *   1. Reframe the output (Probability vs. Heuristic Score).
          *   2. Sensitivity Analysis (Show how changing weights changes results).
          *   3. Methodological Appendix (Explicitly state the circularity limits).
