answer: |-
  You have identified a genuine and distinct argumentative move, and you are correct that it lacks a canonical Latin label like *tu quoque*. In informal logic, it is sometimes loosely grouped under **circumstantial ad hominem**, but that is too broad (it covers any appeal to bias). In moral philosophy, it sits at the intersection of **standing to blame**, **moral luck**, and **situationist psychology**.

  Because there is no single established term, I will offer the most precise descriptive label used in niche ethical discussions, and then perform the "carving" you asked for to separate the three readings you identified.

  ### The Name

  The closest existing technical description is **The Untried Virtue Objection** (sometimes informally called **Inverse Tu Quoque**).

  *   **Tu Quoque:** "You *did* the thing, so you lack standing." (Attack on consistency).
  *   **Untried Virtue:** "You *didn't* do the thing, so you lack standing." (Attack on robustness).

  It is also frequently deployed as a specific application of **The Grace of God Defense** (from the idiom "There but for the grace of God go I"). When used offensively to silence a blamer, it asserts that the blamer's virtue is merely **untested luck**.

  ### The Carving: Which Reading is the Engine?

  You identified three readings: **Informational** (you lack facts), **Authority** (you lack rights), and **Counterfactual** (you lack difference).

  Here is the anatomical breakdown:

  **1. The Counterfactual is the Metaphysical Core.**
  The move does not actually work without the counterfactual claim ("If you were in my position, you would have failed too").
  *   If the blamer *would* have held firm under the same pressure, the objection collapses. If I am a non-addict, and you concede I would *still* choose not to use drugs even if I felt the cravings, your objection loses its bite. I might not know the *feeling*, but my judgment of the *choice* remains valid.
  *   Therefore, the claim that "you are not actually better than me, only luckier" is the premise that supports everything else. This relies on **Situationism** (the psychological view that character is less stable than we think and heavily dependent on context).

  **2. The Informational is the Epistemic Mask.**
  The argument presents itself as informational ("You don't know what it's like inside"). This is rhetorically safer because claiming someone lacks *data* is less aggressive than claiming they lack *character*.
  *   However, this is often a red herring. We allow people to judge many things they haven't experienced (e.g., a non-murderer can judge a murderer). The "missing information" is only treated as disqualifying because of the underlying counterfactual assumption: that the only reason they lack the information is that they were never tested, and they would have failed the test.

  **3. The Authority is the Normative Goal.**
  The conclusion sought is always normative ("You don't get to weigh in"). But this authority is derived entirely from the counterfactual. If the counterfactual holds (you would have failed), then the blamer is effectively a hypocrite-in-waiting, which strips their standing.

  **Verdict:** The **Counterfactual Reading** is the underlying thing. The Informational reading is the vehicle, and the Authority reading is the destination. The "teeth" you sensed in the counterfactual version are indeed the real teeth; the experiential version is just the gums.

  ### Distinguishing It From Related Concepts

  To coin a definition that separates this from its neighbors:

  **The Untried Virtue Objection** is the claim that a moral agent lacks the standing to criticize a specific failure because their own record of success is attributable to a lack of exposure to the relevant temptation, rather than superior character.

  Here is how it separates from the concepts you mentioned:

  **1. Vs. Tu Quoque**
  *   *Tu Quoque* attacks **inconsistency**. (You say X is bad, but you do X).
  *   *Untried Virtue* attacks **robustness**. (You say X is bad, but you haven't proven you wouldn't do X).
  *   *Crucial Difference:* In *tu quoque*, the blamer's past action is a fact. In *Untried Virtue*, the blamer's potential failure is a *speculation*.

  **2. Vs. Ordinary Hypocrisy Objections**
  *   Hypocrisy requires a contradiction between word and deed.
  *   This objection posits a contradiction between **self-perception and luck**. It argues the blamer *thinks* they are virtuous, but they are merely untempted. It is an objection to **self-knowledge**, not consistency.

  **3. Vs. Moral Luck**
  *   "Moral Luck" (Nagel/Williams) is the *philosophical theory* that describes why the objection might be true. It explains that outcomes often depend on factors outside our control.
  *   The *Untried Virtue Objection* is the *rhetorical deployment* of that theory. One is the mechanism; the other is the move.

  **4. Vs. "Lived Experience" Demands**
  *   A general "lived experience" demand ("You aren't a woman, you can't comment on sexism") is an **epistemic boundary**. It says you lack the data to understand the phenomenon.
  *   The *Untried Virtue Objection* is a **moral boundary**. It implies that even if you understand the phenomenon intellectually, your lack of failure makes your judgment presumptuous. It is not that you *can't* understand; it's that you *haven't earned the right* to condemn.

  ### When Is The Objection Actually Right?

  You asked under what conditions this is a valid objection. It hinges on whether the knowledge in question is **Propositional** or **Constitutive**.

  **1. When it is Invalid (Propositional Knowledge):**
  If the moral rule is universal and does not require the vice to understand, the objection fails.
  *   *Example:* A non-murderer judging a murderer.
  *   *Why:* We do not believe one must feel the urge to kill to know killing is wrong. The counterfactual ("You would have killed if you were a psychopath") is irrelevant because the obligation is to *not* be a psychopath. The clean record here is not luck; it is baseline compliance.

  **2. When it is Valid (Constitutive Knowledge):**
  If the moral difficulty is intrinsic to the physiological or psychological state, the objection holds weight.
  *   *Example:* The addict relapse.
  *   *Why:* Here, the "choice" is not a standard rational calculation. The craving alters the decision-making architecture. A person who has never experienced that alteration literally lacks the data required to assess the difficulty of the choice. The counterfactual ("You would have relapsed") is plausible because the temptation bypasses standard willpower.
  *   *Example:* The overworked team lead.
  *   *Why:* If the failure was due to cognitive overload (a physiological limit) rather than laziness, the lead who has never been overloaded cannot accurately judge the capacity of the junior.

  ### Summary Definition

  If you need a label to use in the wild:

  > **The Untried Virtue Objection:** A rhetorical move that disqualifies a critic not for hypocrisy, but for **untested innocence**. It asserts that the critic's clean record is a result of favorable circumstances (moral luck) rather than superior character, and therefore they lack the epistemic or normative standing to judge those who failed under pressure.

  It is distinct from *tu quoque* because it targets the **stability of virtue** rather than the **consistency of action**. It is strongest when the failure involves a physiological or psychological constraint that the critic has never faced, and weakest when the failure involves a universal moral prohibition.
