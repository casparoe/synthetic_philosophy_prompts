      *   **Task:** Provide a "menu" of precise claims for both "Human nature is good" and "Human nature is bad."
      *   **Requirements for the Menu:**
          *   Define *xing* (unlearned material? tendency? endpoint? heavenly allotment?).
          *   Define "good/bad" (moral? functional? admirable? good *for*?).
          *   Classify claim type (descriptive? predictive? normative/teleological?).
          *   Evaluate status (platitude? substantive? false?).
      *   **Specific Analysis:** Identify which pairs contradict and which pairs allow the classmate to be right (compatibility).
