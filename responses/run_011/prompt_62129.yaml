answer: |-
  This is a classic problem in early Chinese philosophy, and your skepticism is well-founded. Your classmate is making a **semantic dissolution** of a **substantive disagreement**. While it is true that Mencius and Xunzi operate with different working definitions of *xing* (nature), claiming they "aren't disagreeing" ignores that they are fighting over which definition *matters* for ethics.

  Here is the menu you asked for, broken down by textual evidence and philosophical commitment, followed by the analysis of your sticking points and the bonus paper topic.

  ---

  ### Part 1: Menu of Readings for "Human Nature is Good" (Mencius)

  | Reading | What is *Xing*? | What is "Good"? | Claim Type | Status |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Teleological** | The endpoint a thing reaches under ideal conditions (acorn $\to$ oak). | Fulfillment of function; flourishing. | **Normative/Teleological:** Humans *ought* to develop virtue; virtue is our completion. | **Substantive.** Contested by Xunzi (who says the "natural" endpoint is chaos). |
  | **2. The Inclination** | Spontaneous, uncalculated reactions (e.g., alarm at a child falling in a well). | Morally praiseworthy; other-regarding. | **Descriptive/Psychological:** Humans possess innate moral instincts (*duan*/sprouts). | **Substantive.** Empirically debatable (see Dev Psych below). |
  | **3. The Honorific** | That which distinguishes humans from beasts (the "great part" of the body). | Distinctively human; noble. | **Prescriptive/Stipulative:** Only if you cultivate virtue are you realizing your *true* nature. | **Platitude/Truism.** "Real humans are good." Hard to falsify, but ethically demanding. |
  | **4. The Capacity** | The potential to become good. | Possibility; non-impossibility. | **Modal:** It is not impossible for humans to be good. | **Platitude.** Xunzi agrees (anyone can become Yu). |

  ### Part 2: Menu of Readings for "Human Nature is Bad" (Xunzi)

  | Reading | What is *Xing*? | What is "Bad"? | Claim Type | Status |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Impulsive** | Raw, unrefined desires (hunger, thirst, envy, profit-seeking). | Socially disruptive; leads to conflict if unchecked. | **Descriptive/Predictive:** Without ritual (*li*), desires lead to chaos. | **Substantive.** A claim about social psychology and game theory. |
  | **2. The Material** | The unshaped raw material (crooked wood, blunt metal). | Unusable; unrefined; lacking form. | **Metaphorical:** Nature lacks the *structure* of goodness (ritual/righteousness). | **Substantive.** Goodness is external (*wei*), not internal. |
  | **3. The Wicked** | Active malice; intent to harm. | Morally evil; sinful. | **Descriptive:** Humans want to hurt others. | **False.** Xunzi never claims this. He says we want *profit*, which *causes* harm, not that we want harm. |
  | **4. The Deficiency** | Absence of acquired knowledge (ritual, rites). | Lack; ignorance. | **Epistemic:** We aren't born knowing how to be good. | **Platitude.** Mencius agrees we aren't born knowing *specific* rites, though we know the *sprouts*. |

  ---

  ### Part 3: The Payoff — Contradiction vs. Compatibility

  **Where your classmate wins (Compatibility):**
  If you pair **Mencius (4. Capacity)** with **Xunzi (2. Material)**, they agree.
  *   Mencius: "Humans have the capacity to be good."
  *   Xunzi: "Humans are raw material that *can* be shaped into goodness."
  *   *Result:* No contradiction. But this is boring; it reduces the debate to "Can humans be moral?" (Yes).

  **Where they genuinely contradict (The Real Fight):**
  If you pair **Mencius (2. Inclination)** with **Xunzi (1. Impulsive)**.
  *   Mencius: "Our spontaneous, unlearned reactions contain moral value (compassion)."
  *   Xunzi: "Our spontaneous, unlearned reactions are selfish desires (profit/envy)."
  *   *Result:* **Contradiction.** This is a factual disagreement about human psychology. Mencius thinks morality is *internal* discovery; Xunzi thinks morality is *external* imposition.

  **The Verdict on your Classmate:**
  They are textually correct (definitions differ) but philosophically naive. The disagreement isn't just that they use the word *xing* differently; it's that **Mencius insists his definition is the ethically relevant one**, while Xunzi insists Mencius's definition ignores the dangerous biological reality that requires governance. They are disagreeing about *where moral authority comes from* (Inner vs. Outer), not just dictionary definitions.

  ---

  ### Part 4: Addressing Your Sticking Points

  #### 1. Mencius's "Mouth vs. Father/Son" & The Honorific Reading
  You hit on a crucial passage (Mencius 7B:24). Mencius admits taste for food is inborn but says, "The gentleman does not call it *nature*." He reserves *xing* for the moral relations (father/son, etc.).
  *   **Implication:** This supports **Reading 3 (Honorific)**. For Mencius, *xing* is not a neutral biological category; it is a **normative filter**. He is stipulating: "Call whatever leads to beasts 'fate' (*ming*), and call whatever leads to sages 'nature' (*xing*)."
  *   **Does this sink the classmate?** Yes. If *xing* is already an honorific term for Mencius, he isn't just describing biology; he is making a claim about value. Xunzi refuses this move. He insists on a neutral, biological definition of *xing*. So they aren't just using the word differently; they are disagreeing on **whether biology or normativity should define the term.**

  #### 2. The Niu Mountain Analogy
  Mencius says the mountain's nature is not the stumps (current state) nor the axes (external damage), but the **capacity to regrow** (sprouts).
  *   **Which Reading?** This is **Reading 1 (Teleological)** mixed with **Reading 2 (Inclination)**. The "nature" is the *dynamic tendency* toward growth, not the static material.
  *   **Significance:** It shows Mencius thinks nature is a *process*, not a snapshot. Xunzi treats nature as the *static material* present at birth. This confirms they have different metaphysics of nature, but again, Mencius is arguing that the *tendency* is the morally significant part, whereas Xunzi argues the *material* is the dangerous part.

  #### 3. Developmental Psychology (Toddlers)
  Your friend's claim that toddler studies (e.g., Hamlin/Wynn/Bloom) settle it is a category error.
  *   **Which Reading?** These studies support **Mencius (2. Inclination)**. They show spontaneous preference for helpers over hinderers.
  *   **Why it doesn't refute Xunzi:** Xunzi admits humans have social instincts (we like family, we dislike chaos). His claim is that these instincts are **insufficient** for *moral order* (*li* and *yi*). A toddler preferring a helper is still acting on *desire/feeling*, not ritual righteousness. Xunzi would say: "Sure, they prefer helpers. But without training, that preference turns into nepotism, favoritism, and clan warfare."
  *   **Takeaway:** Empirical studies can test the existence of sprouts, but they cannot test the *sufficiency* of those sprouts for social order, which is Xunzi's main concern.

  ---

  ### Part 5: Bonus — The Xunzi Sagehood Problem (For your paper)

  **The Problem:** If *xing* is bad (selfish desires), and *wei* (deliberate effort) is good, where does the ability to choose *wei* come from? If our nature is totally bad, wouldn't we naturally choose bad *wei*? This is the classic "How is transformation possible?" objection (raised later by Neo-Confucians).

  **Is it a contradiction?** No, but it is a tension Xunzi must manage carefully.

  **The Solution (The *Xin* 心):**
  Xunzi distinguishes between *xing* (nature/desires) and *xin* (heart-mind/cognitive faculty).
  1.  **Desires (*xing*)** are inborn and cannot be removed (you will always hunger).
  2.  **The Mind (*xin*)** is the ruler. It has the capacity to *know* (*zhi*) and to *choose* (*ke*).
  3.  **The Source of *Wei*:** The capacity for *wei* comes from the *xin's* ability to recognize long-term benefit over short-term gratification. It is not "moral knowledge" (which is external), but **cognitive rationality**.
  4.  **The Sage:** The Sage (Yu) is not someone with different *nature*; they are someone whose *xin* has successfully accumulated knowledge of the Dao and uses it to redirect *xing*.

  **Paper Argument Suggestion:**
  Argue that Xunzi is not a pessimist about human *capacity*, only about human *defaults*. The "badness" of nature is not a metaphysical evil, but a **structural problem of resource scarcity and unlimited desire**. The capacity for *wei* is the cognitive ability to solve that structural problem.
  *   *Critique:* The weak point in Xunzi is explaining why the *xin* would ever *want* to choose the Dao initially if all motivations come from *xing* (desire). Xunzi hints that the *xin* desires "order" and "benefit," and realizes ritual provides that.
  *   *Verdict:* It's not a logical contradiction, but it requires a robust theory of instrumental rationality to work. You can argue that Xunzi secularizes the Confucian project: becoming a sage isn't about unfolding inner goodness (Mencius), it's about **engineering social order** through cognitive discipline.

  ### Summary for Section
  Bring this distinction: **Semantics vs. Stakes.**
  Tell your TA: "I agree Mencius and Xunzi define *xing* differently. Mencius defines it teleologically (the sprout), Xunzi materially (the wood). But they aren't just talking past each other. They are disagreeing on whether moral cultivation is **uncovering** (Mencius) or **constructing** (Xunzi). If my classmate says they aren't disagreeing, they are ignoring the practical disagreement on how to educate a student: do we nurture what's there, or do we reshape what's there?"
