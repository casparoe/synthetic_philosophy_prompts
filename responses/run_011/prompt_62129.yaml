      *   **Bonus/Paper Topic:** Xunzi's claim that anyone can become a sage (Yu). If *xing* is bad, where does the capacity for *wei* (deliberate effort) come from? Is this a contradiction?

  2.  **Deconstruct the Core Philosophical Issue:**
      *   The debate hinges on the semantics of *xing* (nature) and the metaphysics of value (good/bad).
      *   *Mencius:* *Xing* is the sprouts (duan), the teleological tendency toward virtue. It's normative.
      *   *Xunzi:* *Xing* is the raw, unrefined impulses (hunger, thirst, envy). It's descriptive/pre-moral. *Wei* (artifice/effort) is where goodness comes from.
      *   *The Classmate's Claim:* They are talking past each other (semantic ambiguity).
      *   *The User's Skepticism:* It feels like a dodge. There *is* a substantive disagreement about human potential and moral cultivation.

  3.  **Drafting the Menu (Mencius - "Good"):**
      *   *Reading 1 (Teleological):* Nature = End state (acorn to oak). Good = Fulfillment. Claim: Humans naturally develop virtue if unimpeded. (Substantive).
