  *(Refining the Dev Psych point)*: Toddler studies show preference. Xunzi would say preference $\neq$ moral capacity. Preference is still a desire. Moral order requires suppressing conflicting desires. So the study supports Mencius's *existence* of sprouts, but not necessarily his claim that they are *sufficient*.

  *(Refining the Bonus)*: The "Sage" problem is the classic critique of Xunzi (e.g., by Mou Zongsan). I should acknowledge it's a known tension but explain Xunzi's internal solution (the cognitive capacity of the *xin*).

