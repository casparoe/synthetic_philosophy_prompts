prompt: |-
  Last weekend my flatmate and I burned about three hours arguing over whether doing an evil playthrough of an RPG is actually bad — he thinks you're rehearsing cruelty, I think it's obviously just play, neither of us budged — and somewhere around 2am I realised I'd stopped caring about that question, because the games themselves have already taken a position on it and nobody ever bothers to ask them what it is. I'm putting together a short piece for a games-and-philosophy meetup group I go to, and I want it to be about what the standard design conventions assume, not about whether players get corrupted. So I'd like you to reconstruct the implicit theory for me, as carefully as you can, treating the bundle of conventions below as a single object of interpretation.

  Here's the bundle, all of it completely bog-standard in big narrative games. There's a morality meter — karma, reputation, light/dark side points, a paragon/renegade bar — that moves up and down with your choices, is visible to you as a number or a coloured bar, and gates at least one ending, so the world's verdict on you is a scalar you can read off your own HUD. The same game ships achievements or trophies for maxing out *both* ends, and the community norm is that "100%" means you got all of them, so the same player is expected to slaughter the town on one save and rescue everybody on another. Some characters are flagged essential and simply cannot die: you stab one, they grunt, drop to one knee, stand back up, dust themselves off, and the quest continues — but the unimportant ones do die, and plenty of them respawn, so the shopkeeper you murdered is behind the counter again next week saying the same three lines. Reloading a save to undo a bad moral choice isn't treated as cheating by anyone, not players, not reviewers, not the developers, and games that autosave aggressively specifically to stop you get reviewed as hostile design. A handful of games deliberately break that last rule — Undertale is the famous one, where the game keeps a flag for what you did even after you wipe the file and later endings are permanently altered, with characters calling you out for treating their world as something to experiment on and put back — and those get treated as clever subversions, which says something about what the default assumes. Meanwhile the emotional register is entirely sincere: strings, death scenes, companions who grieve, a final boss who is disappointed in you.

  So: what does all that presuppose about the moral status of game characters? Does it presuppose that they're the sort of thing that can be wronged at all — otherwise why the meter, the gated endings, the disappointed boss — or is the meter tracking something else entirely, like the player's chosen playstyle, a reward schedule, the aesthetic coherence of a route? Which rival views does the bundle quietly rule out and which does it stay neutral between? I want you to be strict about separating what the practice actually requires from what merely fits it comfortably, because I suspect a lot of it is underdetermined; my guess is that the achievements-for-both-extremes convention alone could be licensed by at least three completely different theories of what's going on, and I want them laid out. Is the bundle internally consistent, or does the save-scumming tolerance plus the dual achievements contradict the meter's pretence of tracking something real about the character? And does the essential-NPC flag mean the morality here is engine-relative rather than world-relative — is that a flaw in the picture or a clue about what the picture really is? Finish with the counterfactuals: what would have to change mechanically, not just tonally, if the same game were built on the assumption that characters have welfare that killing permanently damages, and separately on the assumption that the only thing with moral weight is the player's own dispositions? I especially want to know whether those two redesigns would even be distinguishable from the outside, because if they aren't, that's a point about how much evidence the current design can be. sorry this is long, feel free to organise it however makes it clearest.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** The implicit moral theory presupposed by standard RPG design conventions (morality meters, achievements, essential NPCs, save-scumming, etc.).
      *   **Goal:** Reconstruct the "implicit theory" of the bundle of conventions as a single object of interpretation. Avoid the "does playing corrupt you?" debate; focus on what the *game design* assumes about the moral status of characters/actions.
      *   **Key Constraints:**
          *   Be strict about separating what the practice *requires* vs. what merely *fits*.
          *   Address internal consistency (e.g., save-scumming vs. morality meter).
          *   Analyze the "essential NPC" flag (engine-relative vs. world-relative morality).
          *   Lay out rival views licensed by the "achievements for both extremes" convention.
          *   Finish with counterfactuals: How would mechanics change if (A) characters have welfare vs. (B) only player dispositions matter? Are these distinguishable?
          *   Tone: Philosophical, analytical, careful, suitable for a games-and-philosophy meetup piece.
          *   Organization: Whatever makes it clearest (structured headings recommended).

  2.  **Deconstruct the "Bundle of Conventions":**
      *   *Morality Meter:* Scalar, visible, gates endings. Implies objective moral accounting.
      *   *Dual Achievements:* Reward for Max Good and Max Evil. Implies moral pluralism or aesthetic playstyles.
      *   *Essential NPCs:* Immortal plot-critical characters vs. disposable fodder/respawning shopkeepers. Implies moral status is tied to narrative function/code flags.
      *   *Save-Scumming:* Undoing choices is standard/accepted. Aggressive autosave is "hostile." Implies reversibility of moral action.
      *   *Subversions (Undertale):* Persistence across resets is treated as a *subversion*. Implies the default is amnesia/reversibility.
      *   *Emotional Register:* Sincere music, grief, disappointment. Implies stakes matter.

  3.  **Identify the Core Tension:**
      *   The game treats actions as morally weighty (meter, grief, endings) *and* morally weightless (respawns, save-scumming, achievement hunting).
      *   This isn't necessarily a bug; it's the feature of the "Ludic Moral Framework."

  4.  **Drafting the Implicit Theory (The "Standard Model"):**
      *   What *must* be true for this bundle to work?
      *   It can't be that characters are fully real persons (otherwise respawning is horrific).
      *   It can't be that nothing matters (otherwise why the meter?).
      *   *Hypothesis:* The game posits a **Formal Moral Ontology**. Moral value exists, but it is a property of the *system*, not the *simulated world*.
      *   Characters are **Moral Tokens**, not Moral Patients. They exist to bear the weight of the player's alignment, not to possess welfare themselves.

  5.  **Addressing the "Achievements for Both" Question:**
      *   Why allow 100% completion by doing both Good and Evil?
      *   *Theory 1 (Aesthetic Pluralism):* Morality is just a flavor for playstyles (Combat vs. Diplomacy).
      *   *Theory 2 (Modal Realism):* Each save file is a distinct possible world. You aren't the same agent across saves.
      *   *Theory 3 (The Actor/Character Distinction):* The *Player* is neutral; the *Avatar* is the moral agent. The Player collects the Avatar's experiences.

  6.  **Addressing Internal Consistency (Save-Scumming vs. Meter):**
      *   Is it contradictory?
      *   If the meter tracks "Soul State," save-scumming breaks it.
      *   If the meter tracks "Narrative Branching," save-scumming is just navigation.
      *   *Conclusion:* The bundle is consistent *only if* morality is treated as **navigational** rather than **constitutive**. You aren't becoming evil; you are exploring the "Evil Route."
      *   *Essential NPCs:* This confirms engine-relative morality. Moral status = Plot Importance. This isn't a flaw; it reveals the ontology. The world is a stage, not a habitat.

  7.  **Developing the Counterfactuals:**
      *   *Scenario A (Characters have Welfare):* Killing must be permanent. No respawns. No save-scumming (or heavy penalties). Consequences must ripple (family of shopkeeper quests). *Undertale* style.
      *   *Scenario B (Only Player Dispositions Matter):* The game shouldn't judge the *avatar*, it should judge the *input*. Maybe biometric feedback? Or maybe the game refuses to let you reload because *you* need to live with the choice. Actually, this looks a lot like Scenario A from the outside.
      *   *Distinguishability:* This is the crux. If the game treats characters as having welfare, it necessarily impacts the player's disposition (by forcing permanence). If the game cares about player disposition, it must treat characters as having welfare (to provide the weight).
      *   *Insight:* They might be extensionally equivalent in mechanics but intensionally different in justification. However, from a *design* perspective, protecting welfare *requires* mechanical permanence. So yes, they are distinguishable from the "Standard Model," but maybe not from each other.

  8.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Check:* Did I answer the specific question about what the bundle *presupposes*?
      *   *Correction:* I need to be careful not to say "The game thinks X." I need to say "The design logic requires X to function without breaking immersion/flow."
      *   *Key Term:* **Ludic Instrumentalism**. Characters are instruments for moral measurement, not subjects of moral concern.
      *   *Key Term:* **Save-File Nominalism**. Each save is a distinct moral universe.
      *   *Key Term:* **Diegetic vs. Ludic Morality**. The tension between the story (diegetic) and the rules (ludic).

  9.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the prompt's insight (games have already taken a position). Define the scope.
      *   **The Implicit Ontology:** Define the status of NPCs (Moral Tokens).
      *   **The Three Theories of "100%":** Analyze the achievement convention.
      *   **The Consistency Check:** Save-scumming and Essential NPCs.
      *   **The Counterfactuals:** Welfare vs. Disposition.
      *   **Conclusion:** The "Standard Model" is a specific moral metaphysics.

  10. **Final Review against Constraints:**
      *   Strict separation of requirement vs. fit? *Yes, will emphasize this.*
      *   Address essential NPC flag? *Yes.*
      *   Address counterfactuals and distinguishability? *Yes.*
      *   Tone appropriate? *Yes, analytical and philosophical.*

  11. **Drafting the Content (Mental or Scratchpad):**
      *   *Make sure to highlight the "Engine-Relative" point.* That's a strong insight from the prompt. If morality depends on a code flag (Essential = True), then morality is a property of the code, not the simulation.
      *   *The "Undertale" point:* It's a subversion because it breaks the "Save-File Nominalism."
      *   *The Counterfactual:* If characters have welfare, you can't reload. If only player disposition matters, you *also* can't reload (because reloading avoids the disposition shift). So mechanically, A and B converge on "No Reloading." This suggests the current design (Allow Reloading) rejects *both* A and B. It accepts C: Morality is a consumable resource.

  12. **Final Polish:** Ensure clear headings and precise language. (e.g., using "Moral Patient" vs "Moral Token"). Ensure the distinction between "what the practice requires" and "what fits comfortably" is explicit.

  *(Self-Correction during drafting)*: Wait, I need to be careful on the "Player Disposition" counterfactual. If the only thing that matters is the player's disposition, does the game need to simulate welfare? Not necessarily. It just needs to make the *choice* hard. But making the choice hard usually requires simulating welfare. I should clarify that distinction. The "Standard Model" makes the choice *easy* (via reloading), implying neither welfare nor disposition is the primary focus; *completion* is.

  Okay, ready to write.
answer: |-
  This is a sharp observation. You are correct that the debate over player corruption misses the prior metaphysical question: *What kind of world is this where murder is both a sin and a speedrun category?*

  To reconstruct the implicit theory of the "Standard RPG Bundle," we must treat the mechanics not as bugs or inconsistencies, but as axioms. When we treat the morality meter, the dual achievements, the essential NPC flags, and the tolerance for save-scumming as a coherent system, they do not describe a world where people have rights, nor a world where nothing matters. They describe a world where **moral value is a navigational resource.**

  Here is the reconstruction of the implicit moral ontology presupposed by standard design conventions, structured by your requirements.

  ***

  ### I. The Implicit Ontology: Moral Tokens, Not Moral Patients

  The bundle presupposes a specific status for game characters. It does not require them to be "real" (which would forbid respawning), nor does it require them to be "fake" (which would forbid the morality meter).

  **The Requirement:** The system requires characters to be **Moral Tokens**.
  A Moral Token is an entity that can bear moral weight without possessing moral welfare.
  *   **Why this is required:** If NPCs possessed *welfare* (an interest in not suffering), the respawning shopkeeper would constitute a horror story of infinite torture, and the "Essential" flag would be a grotesque privilege of plot relevance. If NPCs possessed *no moral status*, the morality meter would be lying (tracking nothing), and the companion's grief would be unintelligible simulation noise.
  *   **The Theory:** The game posits that "wronging" someone is not about damaging their internal state (welfare), but about altering the *systemic state* of the playthrough. The morality meter does not track the suffering of the world; it tracks the **alignment of the avatar's trajectory**.
  *   **Engine-Relative Morality:** You asked if the "Essential NPC" flag means morality is engine-relative. The bundle answers **yes**. Moral status is not an intrinsic property of the character model; it is a property of their code flags (`IsEssential = True`). This is not a flaw in the picture; it is the picture. The ontology is **Ludic Instrumentalism**: characters exist to be used as metrics for player alignment.

  ### II. The Three Theories of "100%" (Achievements for Both Extremes)

  The convention that "100% completion" requires maxing out both Good and Evil on separate saves is the strongest evidence for the implicit theory. This convention is underdetermined—it fits comfortably with three rival metaphysical views, but only one is *required* by the design.

  **1. Modal Realism (The Multiverse Theory)**
  *   *View:* Each save file is a distinct possible world. The "You" in the Paragon save is not the same agent as the "You" in the Renegade save.
  *   *Fit:* This comfortably explains why you aren't a hypocrite. You didn't save the village and burn it; *Agent-A* saved it, *Agent-B* burned it.
  *   *Requirement Status:* **Not Required.** The game does not enforce this metaphysically (it's the same executable), but the design treats save files as hermetically sealed moral universes.

  **2. Aesthetic Pluralism (The Playstyle Theory)**
  *   *View:* "Good" and "Evil" are not moral categories but aesthetic ones, akin to "Stealth" vs. "Heavy Armor."
  *   *Fit:* This explains the achievements. Collecting the "Mass Murderer" trophy is like collecting the "Pacificist" trophy; both demonstrate mastery of the system's rules.
  *   *Requirement Status:* **Strongly Implied.** The fact that both are rewarded equally suggests the system values *commitment to a path* over the *content of the path*.

  **3. The Actor/Avatar Distinction (The Puppet Theory)**
  *   *View:* The Player is a neutral observer; the Avatar is a moral agent. The Player is collecting the Avatar's biographies.
  *   *Fit:* This licenses save-scumming. The Player isn't "undoing a sin"; they are "rehearsing a different scene."
  *   *Requirement Status:* **Required.** For the bundle to hold together, the *Player* must be ontologically distinct from the *Avatar's moral record*. If the Player *were* the moral agent, save-scumming would be moral cowardice (avoiding consequences). Since the design treats save-scumming as neutral navigation, it presupposes the Player is outside the moral economy, manipulating a token within it.

  ### III. Consistency Check: Save-Scumming vs. The Meter

  Is the bundle internally consistent?
  *   **The Tension:** The meter implies a constitutive change (you *become* darker). Save-scumming implies a navigational change (you *chose* a different branch).
  *   **The Resolution:** The bundle is consistent **only if the morality meter is retrospective, not prospective.**
      *   If the meter tracked your *soul*, reloading would be a lie.
      *   If the meter tracks your *narrative route*, reloading is just map exploration.
      *   **The Verdict:** The design treats morality as **branching topology**. The "sin" is not the act of killing; the "sin" is locking yourself out of the "Good Ending" node. This is why *Undertale* is a subversion: it makes morality *persistent* across resets. The Standard Model assumes morality is *local* to the save file.

  **Does this contradict the sincere emotional register (strings, grief)?**
  No. It recontextualizes it. The grief is **Diegetic Weather**. It is atmospheric feedback designed to signal to the player that they have moved into a "High Stakes" narrative branch. The companion cries not because they have been truly wronged in a metaphysical sense, but to signal to the Player: *You are now on the Tragic Route.* The emotion is real to the simulation, but instrumental to the player.

  ### IV. Counterfactuals: Distinguishing the Theories

  You asked what would have to change mechanically if the game were built on different assumptions, and whether those designs would be distinguishable.

  **Scenario A: Characters have Welfare (Realist Moral Ontology)**
  *   *Assumption:* NPCs are moral patients. Killing them damages something real.
  *   *Mechanical Requirements:*
      1.  **Irreversibility:** No save-scumming. Aggressive autosave is mandatory, not "hostile."
      2.  **Permanence:** No respawning shopkeepers. If an NPC dies, their function (quest giver, shop) is permanently lost or transferred to a grieving successor.
      3.  **Ripple Effects:** The world state must degrade. Killing a farmer isn't just -10 Karma; it's a famine questline later.
  *   *Distinguishability:* This creates a game of **Resource Scarcity**. Moral actions consume the world.

  **Scenario B: Only Player Dispositions Matter (Subjectivist Moral Ontology)**
  *   *Assumption:* The NPCs are fake, but the *Player's choice* is the only thing with moral weight. The game exists to train or test the human.
  *   *Mechanical Requirements:*
      1.  **Friction:** The game must make the "Evil" choice difficult to execute (not just statistically, but emotionally/viscerally).
      2.  **No "Clean" Resets:** If the goal is to shape the Player, reloading to undo a choice defeats the purpose. The game must force the Player to sit with the choice.
      3.  **Fourth-Wall Breach:** The game must address the *Player*, not the Avatar (e.g., "Why did you do that?" not "Why did *he* do that?").
  *   *Distinguishability:* This creates a game of **Psychological Friction**.

  **Are Scenario A and B Distinguishable from the Outside?**
  **Yes, but they converge on the same mechanic.**
  Both Scenario A (Welfare) and Scenario B (Disposition) require **the removal of the Reload Mechanic.**
  *   If characters have welfare, you can't reload because you can't un-kill them.
  *   If player disposition matters, you can't reload because you can't un-choose the intent.

  **The Crucial Insight:**
  The fact that the Standard Bundle *allows* reloading proves it accepts **neither** theory.
  *   It rejects **Welfare** because it allows you to undo the damage.
  *   It rejects **Disposition** because it allows you to sanitize your intent.

  Therefore, the Standard Bundle presupposes a third theory: **Moral Formalism.**
  Morality is a score. It is a game resource like Mana or Stamina. You can spend it, you can grind it, and if you don't like the result, you can reset the dungeon and try again. The "sin" is not in the killing; the "sin" is in failing to manage the resource correctly to unlock the desired ending.

  ### V. Summary for the Meetup

  When you present this, you can frame the conclusion like this:

  The standard RPG bundle does not assume characters are people (otherwise respawning is hell). It does not assume characters are props (otherwise the meter is a lie). It assumes characters are **moral currency**.

  The "Essential NPC" flag reveals that moral value is assigned by the engine, not the world. The tolerance for save-scumming reveals that moral consequences are navigational, not constitutive. The dual achievements reveal that moral extremes are aesthetic playstyles, not ethical commitments.

  If we wanted to build a game where characters actually had welfare, or where the player's soul was actually at stake, we would have to remove the ability to reload. The fact that we treat "aggressive autosave" as hostile design proves that, implicitly, we agree with your flatmate's fear but vote with our wallets: we want the *aesthetic* of consequence without the *reality* of irreversibility. The game's implicit theory is that morality is something you consume, not something you inhabit.
