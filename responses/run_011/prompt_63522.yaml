          *   *Self-Undermining:* If the theory predicts I am likely a Boltzmann Brain, I cannot trust the memories/reasoning that led me to the theory. It defeats its own evidential basis.
          *   *PH vs. Fluctuation:* PH posits a *history* of low entropy, not a fluctuation *from* high entropy. It makes the existence of stable records typical, not atypical.
          *   *Consensus:* High consensus that the pure fluctuation story is untenable for observers like us.

      *   **Synthesis/Status Report:**
