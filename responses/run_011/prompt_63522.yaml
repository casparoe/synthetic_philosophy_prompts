      *   *Check:* Is the distinction between PH and Fluctuation clear? *Adjustment:* Emphasize the *temporal asymmetry* of the explanation. PH explains the gradient; Fluctuation assumes the gradient is a blip.

  6.  **Final Polish:** Check against the "no citations" rule. Ensure proper names (Albert, Penrose, Boltzmann) are used as concepts, not bibliography. Ensure the "status" of each question is explicit. (Proceed to generate output).

  *(Self-Correction on Knot 1 Circularity)*: I need to be very precise here. The user asks: "I use records to infer the past... then use the past to explain the records." The answer is that SM *without* PH predicts records are unreliable. PH is the *extra premise* needed to break the symmetry. It's not circular; it's an axiom required to make the inference valid. I need to make sure this distinction lands.

  *(Self-Correction on Knot 2)*: Make sure to distinguish between *thermal* entropy (photons/particles) and *gravitational* entropy. The early universe had high thermal entropy but incredibly low gravitational entropy. The total was low.

