      *   *Soul/Mind:* Defensible but contested (dualism vs. physicalism).
      *   *Feeling Pain:* Simply false according to modern science and most philosophy.
      *   *Reason/Language:* Defensible (animals don't write poetry), but irrelevant to suffering.
      *   *Moral Standing:* False (moral standing usually derives from sentience, not rationality).

  4.  **Connect to the Conclusion ("Kenneling does no harm"):**
