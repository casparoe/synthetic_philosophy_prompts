              *   0-15: Setup grid (points exist).
              *   15-30: Overlay 1 (Field). Fix boundary.
              *   30-45: Overlay 2 (Shifted inside hole).
              *   45-60: The Vote & Trap.
              *   60-75: Debrief.
          *   Skeptic Trap: Force them to define "State at Point P". If P is real, Field(P) changed. If Field(P) changed without cause, determinism dies.
          *   Debrief: Map Grid->Manifold, Transparency->Metric. Escapes: Accept Indeterminism, Deny Point Reality (Relationalism), Deny Freedom to Shift (not an option in GR).
          *   Limitation: Can't show *why* the shift is a solution to the field equations. Must assert it.

      *   *Refining the Skeptic Trap:* The prompt asks to make the relabeling reading cost them a prediction.
      *   *Idea:* Ask them to predict the field value at a specific grid coordinate inside the hole based on outside data.
      *   *If Substantivalist:* Grid points are real. Boundary data doesn't fix interior (because Overlay B is also valid). Prediction fails. Indeterminism.
      *   *If Relationalist:* Points aren't real. Only coincidences matter. Prediction holds (field relative to matter).
      *   *Wait, the prompt wants:* "make the relabelling reading cost them a prediction or a fact they were previously happy to assert."
      *   *Adjustment:* If they say "It's just relabeling (same world)," ask: "Did the value at Grid Coordinate (5,5) change?" If they say "No," they deny the grid has identity. If they say "Yes," they admit indeterminism (since boundary data was same). The trap is: You can't keep Grid Identity + Determinism + Same World.

      *   *Word Count Check:* Need to be concise.

