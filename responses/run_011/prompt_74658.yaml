      *   *Polishing for constraints:* Ensure "700 words max". Use bullets. Ensure "visceral hit".

      *   *Re-evaluating the Skeptic Trap:* The prompt says: "build in something that makes the relabelling reading cost them a prediction or a fact they were previously happy to assert."
      *   *Better Trap:* Have them assert initially: "The grid points exist independently." Then later: "The field is determined by boundary data." When shown Overlay 2, they must drop one.
      *   *Let's tighten the wording.*

      *   *Final Plan:*
          1.  Verdict: Throw it out.
          2.  Materials.
          3.  Sequence (Table).
          4.  Skeptic Trap (Specific dialogue).
          5.  Debrief (Table).
