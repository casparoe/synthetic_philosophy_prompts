      *   **Student Background:** Intro physics, zero GR math (no tensors, no manifolds/charts vocabulary).
      *   **Goal:** Visceral hit on the Hole Argument problem (determinism vs. spacetime substantivalism) without naming it until debrief. Students must state two ways out and their costs.
      *   **Constraint:** 700 words max. Tables and bullets preferred.
