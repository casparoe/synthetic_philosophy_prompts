      *   *Counting words mentally:* Keep it tight.

      *   *Self-Correction on Limitation:* The biggest limitation is that in the analogy, the shift looks "fake" because it's just drawing. In GR, the diffeomorphism preserves all physical relations. The analogy makes it look like we changed the field, whereas GR says we changed the *labeling*. The analogy forces the substantivalist view to make the problem visible. I need to be blunt about this.

