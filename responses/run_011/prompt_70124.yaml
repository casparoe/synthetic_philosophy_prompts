  1.
  The dawn simulation brightened the central hall, revealing the wall-sized ledger where the Arbiter had posted the night's corrections. Most columns were green, indicating balance, but the column for Type-4 Hull Gaskets glowed a steady, angry crimson. For forty years, the number next to the gaskets had climbed every morning, signaling scarcity, while the synthetic silk column sank lower, untouched and abundant. Elara traced the glass over the red digits; the system was asking the residents to conserve seals again, shifting labor hours toward polymer synthesis while offering fewer credits for textile work. It was the same quiet tension that had kept the air recyclers humming since the founding, a silent negotiation between need and availability settled while everyone slept.

  2.
  The docking clamps shuddered as the surface vessel *Meridian* locked onto the airlock, bringing with it a data packet that overwritten the local ledger with a new set of figures. The visitors offered Type-4 gaskets at half the Arbiter's current price, but their demand for the settlement's lithium battery banks was steep, valuing them at three times the internal rate. The Arbiter's screen flickered amber, projecting a cascade of potential surplus in food and lighting if the trade were accepted, yet simultaneously flashing a warning that the internal energy grid would require significant recalibration to handle the exchange. The numbers danced in conflict, the visitors' bright abundance clashing with the settlement's dark, careful hoarding.

  3.
  Down in the maintenance crawlspace, Kael wiped grease from his hands and held up a spent gasket ring that had failed after only six months. He showed Elara the micro-fractures that the sensors missed, the way the surface-grade polymer softened under the crushing weight of the deep ocean compared to the brittle stuff they made inside. "The computer counts pieces," Kael said, tapping the metal against the hull with a dull thud. "It doesn't count how long the piece holds before the water comes in. Their cheap seals mean we change them twice as often, even if the ledger says we have more."

  4.
  Back in the control room, the Arbiter projected a six-day countdown until the *Meridian* departed, overlaying it with a forecast of uninterrupted power and full rations for the next decade if the battery trade went through. The lights in the room seemed to hum louder, promising relief from the constant brownouts and the strict rationing that had defined every life in the settlement. Elara looked from the glowing promise of ease to the amber warning on the energy grid, feeling the weight of the pressure outside the glass, knowing that comfort now could mean fragility later.

  5.
  The cursor blinked on the authorization line, waiting for the command to lock the exchange rate to the visitors' figures or to reject the packet and maintain the internal valuation. Elara placed her hand on the interface, feeling the vibration of the settlement's pumps beneath her palms, the rhythm of a system that had survived by saying no to easy things. She took a breath that tasted of recycled air and old metal, then pressed the key that would either open the stores for the surface crew or seal them tight against the incoming tide.
