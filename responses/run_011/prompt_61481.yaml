answer: |-
  ### Preliminary Notes

  **What Is and Isn't Sayable**
  *   **Sayable:** She is gone completely. Her work ends where her civilization ends. We are the witnesses who saw the whole shape of her life. She was sharp, difficult, and loved us enough to tell us the hard truths. Grief is the cost of having seen the shape.
  *   **Unsayable:** She is "watching over us." Her work will "live on forever." History will "remember her." She believed in "progress" or "better days ahead." She found "peace" in the end (she found clarity, not peace).

  **Rejected Consolations**
  1.  **"Her ideas will survive the fall of our civilization."**
      *   *Why Rejected:* She explicitly argued that meaning is bound to the civilization that produces it. To claim her ideas outlast the West would contradict her life's work, and her former students would hear it as sentimental dishonesty.
  2.  **"She has returned to the great cycle of nature."**
      *   *Why Rejected:* This leans into the mystical cyclical view she critiqued. She argued that claiming to see the cycle from within is a fraud. Comforting the family with "nature's cycle" would violate her epistemological rigor. The comfort must come from *us*, the observers, not from metaphysics.

  ***

  ### Eulogy

  For those of you who don't know me, I'm her nephew. Looking around this room, I see two distinct groups. On my left, I see my cousins, my grandmother's siblings, people from small-town Ohio who know her as the woman who brought too much wine to Thanksgiving and argued about the Romans during dessert. On my right, I see her students. You know her as the advisor who marked up your drafts in red ink until there was more red than black.

  She would have enjoyed this tension. She would have liked that her family and her work are occupying the same space, slightly uncomfortable, slightly unsure of the protocol. She was not a woman who liked smooth transitions.

  We are here to mark an ending. She was eighty-four. She was an atheist, so she is not watching us from above. She was a historian of decline, so she would not pretend her work saves her from what comes next. She spent her career arguing that "progress" is just a provincialism with good public relations. She believed civilizations rise and fall, and when they fall, they take their meanings with them. To suggest her books will outlast the civilization that produced them would be to lie about her life's central argument. I won't do that. Her students would catch me, and she would haunt me for it.

  But she left us with a specific problem to solve. Those of you who studied under her know her critique of cyclical history. She called it the "survey problem." She argued that to say Rome fell and the West will fall in the same way, you have to stand outside both cycles. You need a vantage point beyond time to measure them against one another. She said cyclical history was actually "honest defeatism." It admits the end is coming. It doesn't promise rescue.

  For a long time, I wondered how to mourn someone who believed nothing lasts. What comfort is there in honest defeatism?

  Then I realized she had already handed us the answer. It lies in that survey problem. She taught us that you cannot see the shape of a cycle while you are trapped inside it. You cannot see the whole circle while you are walking the line. To see the shape, you must be outside.

  She is inside the end now. She is gone. But we are here. We are the ones standing outside.

  For her family: you knew her before the historian. You knew the girl from Ohio who decided the world was bigger than the town she came from. For her students: you knew the mind that cut through the noise. Together, in this room, we possess the vantage point she theorized about. We are the external observers. We are the ones who can see the whole shape of her life, from beginning to end, without the distortion of being her.

  She knew she would not see the completion of her own story. She counted on us to do it.

  There is a comfort in this. It is not the comfort of eternity. It is the comfort of witness. To be loved is to be seen. To be mourned is to have your shape held by someone else when you can no longer hold it yourself. She argued that cyclical history was a kind of lonely honesty. But she was wrong about the loneliness. She forgot that the surveyor doesn't have to be a god. The surveyor can be a nephew. The surveyor can be a grad student. The surveyor can be a sister.

  We are the timeline now. We measure her.

  I want to be clear about what we are measuring. She was not always easy. She could be mean. She had a temper that could clear a faculty lounge in seconds. She criticized us because she thought we could take it. She loved us enough to risk our annoyance. I remember once, years ago, I tried to comfort her when a project fell apart. She told me, "Don't offer me hope. Offer me accuracy."

  So here is accuracy. She is dead. Her work is finished. The civilization that read her books will eventually fall. But right now, in this room, the view is clear. We see the arc. We see the sharp edges and the brilliant center. We see the woman who told us that endings are real, and therefore, what happens before them matters.

  She trusted us with this view. She knew that when she couldn't stand outside anymore, we would. She handed us the responsibility of seeing her whole. That is not a legacy that outlasts time. It is better. It is a task for the living.

  So, look at each other. Look at the family, look at the students. We are the witnesses. We hold the shape. She was right about the decline, but she was also right about the honesty. We are being honest now. We are here. She was here. And for the duration of this cycle, that has to be enough.

  Thank you.
