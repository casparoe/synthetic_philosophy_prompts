prompt: |-
  You're a professional philosopher who also happens to be good at writing speeches, so please think this through carefully before drafting anything.

  I'm giving my aunt's eulogy on Saturday. She died at 84. She was a historian of decline — her whole career was on the cyclical side of the argument about history, the Spengler-and-Toynbee end of it, and she used to tell grad students that "progress" is just a provincialism with good PR. Her own twist, the thing she was still arguing in her unfinished last book, was that every cyclical theory secretly borrows a linear premise: to say that Rome fell and that the West will fall the same way, you have to stand outside both cycles and measure them against one common timeline. She called it the survey problem, and she thought it made cyclical history a kind of honest defeatism rather than a prediction.

  Here's my problem. The room will have my cousins and her siblings — small-town Ohio, a lot of them churchgoing — plus maybe twenty of her former students, several of whom are now working historians. I can't say she's watching over us; she was an atheist and would have definately hated it. But I also can't fall back on the usual consolation that her work will outlast us, because her entire point was that nothing outlasts its civilization, and the students would catch me faking it in a second. So the speech has to comfort people who loved her without asserting anything she'd have called false, and I'd like the survey problem to do real structural work in it — not show up as a cute reference, but actually generate the consolation, something like: standing outside the cycle and being able to see the whole shape of a life is exactly what the people who loved her are now in a position to do, and she knew she'd be handing that over.

  Two things before the speech: a short brainstorm of what is and isn't sayable given her views, and one or two alternate consolations you considered and rejected and why. Then the eulogy itself, 700–900 words, spoken-aloud rhythm, American English. Not reverent in a generic way, no "in these difficult times," and please don't make her sound like a fortune cookie — she was funny and a bit mean.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher and speechwriter.
      *   **Task:** Write a eulogy for an aunt (84 years old, historian of decline/cyclical history).
      *   **Audience:** Mixed group (small-town Ohio religious family + atheist/academic former students).
      *   **Key Constraint 1 (Beliefs):** She was an atheist (no "watching over us"). She believed in cyclical history but critiqued it (the "survey problem" – cyclical theories secretly borrow linear premises to compare cycles). She believed nothing outlasts its civilization (no "her work will live on").
      *   **Key Constraint 2 (Tone):** Comforting without asserting falsehoods (by her standards). Use the "survey problem" as structural consolation (loved ones standing outside the cycle seeing the whole shape). Not generic reverence, no clichés ("in these difficult times"), not fortune-cookie wisdom. She was funny and a bit mean.
      *   **Deliverables:**
          1.  Short brainstorm of what is/isn't sayable.
          2.  One or two alternate consolations considered and rejected (with reasons).
          3.  The eulogy itself (700–900 words, spoken rhythm, American English).

  2.  **Deconstruct the Philosophy (The "Survey Problem"):**
      *   *Standard Cyclical History:* Civilizations rise and fall like seasons. Rome fell, the West will fall.
      *   *Her Critique:* To say "Rome fell like X will fall," you need a vantage point outside both to measure them. That vantage point implies a linear timeline or a god's-eye view, which contradicts the immanent nature of cycles.
      *   *Her Conclusion:* Cyclical history is "honest defeatism," not prediction. It admits endings.
      *   *The Consolation Twist:* Death is the end of a cycle (a life). The mourners are now the "outside observers." We possess the vantage point she theorized about. We can see the *shape* of her life because we are surviving it. She knew she was handing us this view. It's not immortality; it's witness.

  3.  **Brainstorming Sayable/Unsayable:**
      *   *Unsayable:* "She's in a better place," "Her legacy lives on forever," "History will remember her," "She taught us progress is possible," "She is watching down on us."
      *   *Sayable:* "She is gone," "Her work ends where civilization ends," "We are here to witness the shape of her life," "She was right about endings," "Love is a form of witnessing," "She was sharp/tough."

  4.  **Developing Alternate Consolations (to reject):**
      *   *Idea 1:* "Her ideas will survive even if civilizations don't." -> *Rejection:* She explicitly argued nothing outlasts its civilization. Students would know this is fake.
      *   *Idea 2:* "She found peace in the cycle." -> *Rejection:* Too mystical/New Age. She was a skeptic/atheist. She called it "defeatism," not peace.
      *   *Idea 3:* "We carry her torch." -> *Rejection:* Implies progress/linear continuation. She hated "progress."

  5.  **Drafting the Eulogy - Structure & Tone:**
      *   *Opening:* Acknowledge the split audience (family vs. students). Acknowledge her sharpness.
      *   *Middle (The Philosophy):* Explain her work simply but accurately. Introduce the "survey problem."
      *   *The Turn (Consolation):* Apply the survey problem to grief. We are the outside observers. Seeing the whole shape is the gift.
      *   *Closing:* Specific memory/tribute to her character (funny/mean). A final goodbye that respects her atheism.
      *   *Word Count:* 700-900 words.
      *   *Rhythm:* Spoken aloud, pauses, conversational but intellectual enough for the students.

  6.  **Drafting - Section by Section (Mental or Scratchpad):**
      *   *Start:* Welcome everyone. Note the odd mix (Ohio family + historians). She would have enjoyed the tension.
      *   *Her Work:* She studied decline. Not popular stuff. "Progress is provincialism."
      *   *The Twist:* The survey problem. You can't see the cycle from inside.
      *   *The Application:* She is inside the box now (dead). We are outside. We see the shape. That's the comfort. Not eternity, but completion.
      *   *Her Character:* She wasn't soft. She'd hate the sap. She was mean but loving.
      *   *End:* We hold the view. She handed it to us.

  7.  **Refining the Philosophy:**
      *   Make sure I don't misrepresent the "survey problem." It's about the *viewer* needing a linear timeline to compare cycles.
      *   Consolation: We provide the linear timeline for her life. We are the witnesses who validate the shape.

  8.  **Reviewing Constraints:**
      *   *Atheism:* No heaven.
      *   *Legacy:* No "immortality through work."
      *   *Tone:* Sharp, not sappy.
      *   *Length:* Check word count.

  9.  **Writing - Step 1: Brainstorm & Rejections:**
      *   (Drafting the preliminary sections first as requested).
      *   *Sayable:* She is dead. We are alive. We see her whole.
      *   *Unsayable:* She lives on. God has her. Progress continues.
      *   *Rejected Consolations:* 1. "Ideas outlive flesh" (contradicts her civility argument). 2. "Nature cycles on" (too impersonal, ignores the survey problem).

  10. **Writing - Step 2: The Eulogy:**
      *   *Opening:* "For those who don't know me..." Acknowledge the divide.
      *   *Her Voice:* Quote her on progress.
      *   *The Theory:* Keep it accessible. The "Survey Problem."
      *   *The Grief:* How does this help? We are the surveyors now.
      *   *The Personality:* Mention her sharpness. The Ohio family connection.
      *   *Closing:* The handover.

  11. **Polishing:**
      *   Check word count.
      *   Ensure "American English" (spelling, idioms).
      *   Ensure "spoken-aloud rhythm" (short sentences, caesuras).
      *   Make sure she sounds "funny and a bit mean." (Add a joke about her grading or her opinions).

  12. **Final Word Count Check:**
      *   Need to be careful not to go under 700 or over 900.
      *   Let's aim for dense but breathable paragraphs.

  *(Self-Correction during drafting)*: I need to make sure the "survey problem" doesn't sound too academic. It needs to feel like *her* voice explaining it to us. The consolation must be that *we* are the ones standing outside now. She trusted us to hold the view.

  *(Refining the "Mean" aspect)*: Don't soften her edges. Mention she could be difficult. It makes the love real.

  *(Refining the "Atheism" aspect)*: Be clear about finality. "She is gone."

  *(Refining the "Legacy" aspect)*: Avoid "her work lives on." Instead, "her work is done, and we saw it."

