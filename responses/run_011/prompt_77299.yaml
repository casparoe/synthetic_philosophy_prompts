  **Q3. The Access Constraint (Global Workspace)**
  > "A program functionally identical to a mouse's pain system runs in a spreadsheet that is never opened, displayed, or interacted with. Does it suffer?"
  > *   **No:** → **Global Workspace / Access Consciousness** (Suffering requires information broadcasting or interaction, not just latent computation). (Stop)
  > *   **Yes:** → Go to Q4. (Internal computation is sufficient).

