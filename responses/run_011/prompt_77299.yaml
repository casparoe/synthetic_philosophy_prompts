  > "A system reliably reports distress and avoids harm, but we prove it has no internal phenomenal state (a Philosophical Zombie). Do we owe it duties?"
  > *   **Yes:** → **Illusionism / Pragmatist Behaviorism** (Moral status is a social fact or response to behavior, not inner light). (Stop)
