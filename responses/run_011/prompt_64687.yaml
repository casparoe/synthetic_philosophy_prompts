prompt: |-
  I cover research integrity and the sociology of science for a general-interest magazine, which means a disproportionate share of my stories begin with one frightened person: a postdoc, a lab manager, a departed co-author, a technician who will speak only on the condition that nothing identifying appears in print. Corroboration usually exists but is unpublishable — a spreadsheet someone photographed and then deleted, a colleague who confirms the atmosphere but not the act. My editor now wants a written protocol for deciding when a single anonymous source is enough to run an allegation, because at present the decision is made by whoever sounds most confident in a hallway. I have been reading Nozick's tracking account of knowledge, and it struck me that the newsroom question is close to a literal instance of it: what I want to know is whether the source's report counterfactually tracks the facts — whether they would have produced this report had the allegation been false, and whether they would have found and surfaced it had it been true but shaped differently than they suppose. I would like you to build the protocol on that foundation rather than on the usual journalism-school vocabulary of reliability and credibility, which I find does no real work.

  The deliverable should be a sequence of questions a reporter can actually ask in order, with a statement of what counts as a sufficient answer at each step, the points at which the procedure terminates in "we do not run this," and the points at which it stops being about truth and hands the decision to an editor because the live issue is harm to identifiable people or our own institutional interest. Two features of the tracking framework need explicit handling. First, method: I take the lesson of Nozick's grandmother case — her belief that the child is well looks insensitive, since she would have been lied to had he been unwell, until you pin down the route by which she forms it — to be that sensitivity is only evaluable relative to a specified method of belief-formation, and my sources are frequently unable or unwilling to specify theirs; they "know from the lab," or "everyone knew," or "you could see it in the raw files." Tell me how to pin the route, what to do when the source cannot, and whether an unpinnable route is automatically disqualifying or merely costly. Second, closure: tracking theories give up closure under known entailment, and I have watched that pattern play out badly in practice, where a reporter is confident about the narrow act and then writes confident sentences about what the senior author knew, what the institution tolerated, and what should happen to the paper. I want the protocol to state precisely which inferences I may carry forward from a sensitively-held allegation and which must be re-earned separately, and to justify the line rather than merely assert it.

  Some constraints on the ground: I typically have forty-eight hours between a source going on the record and an editor needing a recommendation; I cannot disclose to a source what we intend to publish or what we have verified elsewhere; nothing in the protocol may require a document I can legally print, though it may require documents to exist; and legal review is mandatory before publication but sits outside my discretion. There is also a rule of thumb currently circulating on my desk that I want tested rather than inherited: if being wrong would cost the source their job, their funding, or their visa, we treat their report as tracking, on the theory that high stakes buy honesty. My suspicion is that this inverts the actual analysis, and that exposure is what makes a report sensitive to the source's own interests rather than to the world; I would like the protocol to either dismantle it or defend it, and to say which of the two it is doing. Then please run the procedure end to end on three cases: a postdoc alleging duplicated images in a celebrated paper who volunteers that they were competing with the accused lab for the same grant; a lab manager reporting that a prominent investigator repeatedly ran studies without required approvals, corroborated by two colleagues who will confirm only under an anonymity we cannot characterize in print; and a source I have used twice before and who was right both times, now alleging something that would upend a subfield, offering no documents and declining to say how they came to know. For the third I expect the procedure to tell me to stand down, and I want it to say so in terms I can hand to an editor without embarrassment rather than hedging into a maybe. Close by stating what the protocol cannot do: the cases where it will misfire, the ways a determined fabricator or a self-deceived whistleblower defeats it, and which of its steps are judgment calls wearing procedural clothing. I am not looking for references or further reading — I need something I can run on Tuesday.
reasoning: |-
  Here's a thinking process that leads to the suggested protocol:

  1.  **Analyze the Request:**

      *   **Role:** Research integrity/sociology of science reporter for a general-interest magazine.
      *   **Task:** Create a written protocol for deciding when to run a story based on a *single anonymous source*.
      *   **Philosophical Foundation:** Robert Nozick's "Tracking Theory of Knowledge" (specifically the counterfactual conditions of sensitivity and adherence, and the method-relative nature of belief).
      *   **Key Constraints:**
          *   48-hour turnaround.
          *   Cannot disclose verification status to source.
          *   Cannot require publishable documents (but can require existence).
          *   Legal review is separate/mandatory.
          *   Must test the "high stakes buy honesty" rule of thumb.
          *   Must handle the "closure" problem (limiting inferences from the specific act to broader institutional guilt).
          *   Must handle the "method" problem (sources often can't specify *how* they know).
          *   Must include three specific case studies (Postdoc/Image Duplication, Lab Manager/IRB Violations, Trusted Source/No Method).
          *   Must conclude with limitations/failure modes.
          *   Tone: Professional, actionable, philosophically rigorous but practical for a newsroom. No academic citations/bibliography.

  2.  **Deconstruct Nozick's Tracking Theory for Journalism:**

      *   *Standard Definition:* S knows that p iff:
          1.  p is true.
          2.  S believes that p.
          3.  If p were false, S would not believe that p (Sensitivity).
          4.  If p were true, S would believe that p (Adherence).
      *   *Journalistic Translation:*
          *   We don't know if $p$ is true yet (that's the story).
          *   We need to assess if the *report* tracks the *fact*.
          *   *Sensitivity:* If the allegation were false, would this source still be making this allegation? (Are they prone to error/malice in this specific context?)
          *   *Adherence:* If the allegation were true (even in slightly different variations), would this source still report it? (Are they positioned to see the truth?)
          *   *Method:* Belief is relative to a method $M$. We need to identify $M$. If $M$ is vague ("everyone knows"), tracking is hard to assess.

  3.  **Drafting the Protocol - Step-by-Step:**

      *   *Goal:* A sequence of questions with pass/fail criteria.
      *   *Structure:*
          1.  Method Identification (The "Grandmother" fix).
          2.  Sensitivity Test (The Counterfactual).
          3.  Adherence Test (The Variation).
          4.  Closure Check (Limiting Inference).
          5.  Harm/Interest Handoff (Editorial Decision).
      *   *Addressing the "High Stakes" Rule:* The user suspects it inverts the analysis. High stakes for the source (job/visa) usually mean high *motivation to lie* if there's a grievance, or high *fear of speaking* if telling truth. It doesn't guarantee sensitivity. If the allegation is false, a desperate source might *still* allege it to save their career (e.g., blaming the PI for their own failure). So, high stakes $\neq$ tracking. It adds noise. I need to codify this rejection.
      *   *Addressing Closure:* If Source says "PI faked data," we cannot infer "Institution knew" without separate tracking. The protocol must stop the inference chain.
      *   *Addressing Method:* If source says "I know from the lab," we need to drill down. Is it visual? Hearsay? Access to logs? If they can't pin it, it's a "Method Cost." High cost requires higher corroboration elsewhere (but we only have one source). So, unpinnable method = Stop.

  4.  **Developing the Case Studies:**

      *   *Case 1 (Postdoc/Image):* Competitor for grant. Method: Visual inspection of raw files? Or just suspicion? Sensitivity: Low. If they didn't get the grant, would they still allege fraud? Yes, possibly out of spite. *Verdict:* Do not run based on this alone.
      *   *Case 2 (Lab Manager/IRB):* Corroborated by two others (anonymously). Method: Administrative oversight. Sensitivity: High. If approvals existed, would they say they didn't? Unlikely, they manage the paperwork. *Verdict:* Proceed to editor (Harm/Interest check), but limit closure (don't assume PI intent).
      *   *Case 3 (Trusted Source/No Method):* Source has history. But "No method" violates the Tracking requirement. Past reliability $\neq$ current tracking. If they can't say *how* they know, we can't assess sensitivity. *Verdict:* Stand down. Hard stop.

  5.  **Refining the Tone and Constraints:**

      *   Must sound like a newsroom document, not a philosophy paper. Use terms like "Method Specification," "Counterfactual Check," "Inference Boundary."
      *   Ensure the 48-hour constraint is respected (questions must be askable quickly).
      *   Ensure the "High Stakes" rule is explicitly dismantled.
      *   Ensure the "Closure" limitation is clear.

  6.  **Writing the Content - Section by Section:**

      *   *Introduction:* Acknowledge the Nozickian foundation. Define the goal (Tracking, not just Credibility).
      *   *The Protocol:* Numbered steps.
          *   Step 1: Method Pinning. (Crucial for Nozick).
          *   Step 2: Sensitivity (The "If False" test).
          *   Step 3: Adherence (The "If True" test).
          *   Step 4: The Stakes Correction (Addressing the user's suspicion).
          *   Step 5: Closure Limit (Stopping the inference).
          *   Step 6: The Handoff (Harm/Interest).
      *   *Case Studies:* Apply the steps rigorously.
      *   *Limitations:* Where does this fail? (Self-deception, coordinated fabrication, structural blindness).

  7.  **Self-Correction/Review during Drafting:**

      *   *Critique:* Is "Adherence" necessary?
      *   *Fix:* Yes, Nozick requires both. In journalism, Adherence asks: "If the truth were slightly different (e.g., it wasn't fraud, just sloppiness), would you still call it fraud?" This tests the *labeling* accuracy.
      *   *Critique:* The user wants to know if an unpinnable route is disqualifying.
      *   *Fix:* Make it disqualifying for *single-source* stories. If $M$ is unknown, Sensitivity is unassessable. Unassessable Sensitivity = No Knowledge = No Story.
      *   *Critique:* The "High Stakes" rule.
      *   *Fix:* Explicitly label it a "False Proxy." High stakes increase the *cost* of belief, not the *truth-tracking* of belief.
      *   *Critique:* Case 3 needs to be a hard "No."
      *   *Fix:* Ensure the language is definitive. "Terminate."

  8.  **Final Polish:** Check against the prompt's specific requirements (48 hours, no publishable docs required, legal review separate, specific case outcomes). Ensure the voice is appropriate for a senior reporter writing for an editor. (Avoid academic jargon where possible, translate "Sensitivity" to "False-Positive Resistance").

      *(Self-Correction on Terminology)*: The prompt asks to build it on the foundation of Nozick, so I should use the terms "Sensitivity" and "Method" but define them operationally. I will keep the philosophical vocabulary but make it functional.

      *(Refining the "Closure" section)*: This is about entailment. If $p$ (data faked) does not entail $q$ (PI knew), we cannot report $q$ based on tracking for $p$. I need to make sure the protocol forces a re-evaluation for every new claim.

      *(Refining the "High Stakes" rule)*: The prompt asks to test it. My analysis: High stakes make the source *vulnerable*, not *accurate*. It might make them *more* careful, but it also gives them a motive to deflect blame. I will classify it as a "Confounding Variable" that requires neutralization, not a booster.

      *(Final check on Case 3)*: The user expects the procedure to say "stand down." I must ensure the logic leads there inevitably. If Method is undefined, Sensitivity is unknowable. If Sensitivity is unknowable, Tracking fails. If Tracking fails, No Knowledge. If No Knowledge, No Story.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # PROTOCOL: SINGLE-SOURCE TRACKING ASSESSMENT (SSTA)

  **Purpose:** To determine whether a single anonymous allegation constitutes actionable knowledge rather than mere belief.
  **Foundation:** Nozickian Tracking Theory (Sensitivity and Adherence relative to Method).
  **Constraint:** 48-hour decision window. Legal review is separate and subsequent.

  ## PART I: THE PROCEDURE

  ### Step 1: Method Specification (The "Grandmother" Fix)
  **Question:** By what specific causal route did this information reach the source?
  **Requirement:** The source must identify the physical or digital interface where the fact was encountered. "I saw it," "I downloaded it," "I signed the form," or "I witnessed the conversation."
  **Sufficient Answer:** A description of the mechanism that connects the fact to the belief (e.g., "I processed the raw image files on the shared server").
  **Insufficient Answer:** Appeals to atmosphere, reputation, or consensus (e.g., "Everyone in the lab knew," "It was obvious," "The PI has a history").
  **Termination Condition:** If the source cannot or will not specify the method $M$, **terminate**. An unpinnable route makes sensitivity unassessable. It is not merely costly; it is disqualifying for a single-source story. Without $M$, we cannot know if the belief tracks the fact or the source's anxiety.

  ### Step 2: Sensitivity Check (The Counterfactual False)
  **Question:** If the allegation were false, would the source still be making this report?
  **Requirement:** Assess the source's position relative to the method $M$ identified in Step 1.
  **Sufficient Answer:** Evidence that the method $M$ would have produced a *different* signal had the fact been otherwise. (e.g., "If the images were distinct, the software log would show different hashes," or "If the approval existed, it would be in my filing cabinet.")
  **Termination Condition:** If the source admits that their belief would remain unchanged even if the fact were false (e.g., "I just feel it," or "They would have hidden it anyway"), **terminate**. This indicates the belief is insensitive to the truth.

  ### Step 3: Adherence Check (The Counterfactual True)
  **Question:** If the allegation were true but manifested differently than the source supposes, would they still report it?
  **Requirement:** Test whether the source is tracking the *substance* of the misconduct or a specific *narrative* of misconduct.
  **Sufficient Answer:** The source confirms they would report the core violation even if details differed (e.g., "Even if it wasn't image duplication, but data deletion, I would report it because I monitor the backups").
  **Termination Condition:** If the source is fixated on a specific detail that might be incidental (e.g., "It has to be this specific graph"), **flag for narrowing**. We can only publish what is tracked.

  ### Step 4: The Stakes Correction (Testing the "High Cost" Rule)
  **Question:** Does the source face personal ruin (job, visa, funding) if they speak?
  **Analysis:** The current newsroom rule suggests high stakes guarantee honesty. This protocol **rejects** that rule.
  **Rationale:** High stakes do not increase sensitivity; they increase *motivation*. A source facing ruin may allege misconduct to deflect blame for their own failures or to leverage a settlement. High stakes make the report *costly*, not *true*.
  **Action:** Treat high personal stakes as a **confounding variable**, not a validator. It requires *additional* scrutiny of Step 1 (Method), not less. If the source is vulnerable, verify that their Method $M$ is immune to their desperation.
  **Termination Condition:** If the only justification for the source's reliability is their vulnerability, **terminate**.

  ### Step 5: Closure Limit (The Inference Boundary)
  **Question:** What specific claim does the source's method track?
  **Requirement:** Map the claim strictly to the method.
  **Rule:** Tracking does not close under known entailment. If the source tracks "Data was manipulated" (via file access), they do not automatically track "The PI ordered it" (unless they have a method for observing the order).
  **Action:** Draw a hard line. Any claim that requires an inference beyond the source's direct method must be marked as **Untracked**.
  **Termination Condition:** If the story relies on untracked inferences (e.g., institutional complicity, PI intent) without separate sourcing, **truncate the story** to the tracked claim only. Do not run the broader narrative.

  ### Step 6: The Handoff (Harm and Interest)
  **Question:** Does running the tracked claim violate non-truth values?
  **Trigger:** If Steps 1–5 are passed, the question of *truth* is satisfied. The decision now moves to *harm*.
  **Action:** Transfer to Editor/Legal.
  **Criteria for Handoff:**
  1.  Is the identifiable harm to the accused disproportionate to the public interest?
  2.  Does publication compromise ongoing investigations?
  3.  Does it expose the magazine to unacceptable liability despite truth?
  **Note:** This step is outside the reporter's discretion. The reporter's job ends at confirming Tracking.

  ---

  ## PART II: CASE APPLICATIONS

  ### Case 1: The Postdoc and the Duplicated Images
  **Scenario:** Postdoc alleges image duplication in a celebrated paper. Source is competing with the accused lab for the same grant.
  **Application:**
  1.  **Method:** Source claims to have seen the raw files. *Probe:* How? If they were competing, did they have authorized access? If access was unauthorized, the method is illicit (legal risk). If access was via public data, sensitivity is low (easy to misinterpret).
  2.  **Sensitivity:** If the images were *not* duplicated, would the source report they were? Given the grant competition, the answer is **indeterminate**. The source gains a competitive advantage by filing the allegation, regardless of truth. The belief is contaminated by incentive.
  3.  **Stakes:** Source risks career retaliation. Per Protocol Step 4, this is a confounder, not a validator. It suggests a motive to deflect their own grant loss onto the competitor.
  4.  **Closure:** Even if images are duplicated, does the source track *who* did it? Unlikely.
  **Verdict:** **DO NOT RUN.** The source's belief does not track the fact; it tracks the source's competitive interest. The method is compromised by the grant conflict.

  ### Case 2: The Lab Manager and the Missing Approvals
  **Scenario:** Lab manager reports prominent investigator ran studies without required approvals. Two colleagues confirm anonymously (uncharacterizable).
  **Application:**
  1.  **Method:** Manager handles the paperwork. Method is administrative custody. This is pinnable.
  2.  **Sensitivity:** If approvals *had* existed, would the manager say they didn't? No. Their job is to file them. If they say they are missing, they are likely missing. High sensitivity.
  3.  **Adherence:** If the violation was a different type of compliance failure, would they report it? Yes, they manage all compliance.
  4.  **Corroboration:** Two colleagues confirm the "atmosphere." While their method is vague, they support the Manager's specific method by confirming the environment allows it.
  5.  **Closure:** The Manager tracks "Approvals were not filed." They do *not* track "The PI knew." The PI could have been negligent rather than malicious.
  **Verdict:** **PROCEED TO HANDOFF.** The allegation tracks the fact of missing paperwork. The story must be limited to the administrative failure. Do not assert PI intent without separate tracking. The anonymity of the corroborators is acceptable because the Primary Source (Manager) has a pinned method.

  ### Case 3: The Trusted Source and the Subfield Upheaval
  **Scenario:** Source used twice before (both correct). Now alleges something upending a subfield. Offers no documents. Declines to say how they know.
  **Application:**
  1.  **Method:** Source declines to specify. "I just know."
  2.  **Protocol Step 1:** **FAIL.** An unpinnable route is disqualifying.
  3.  **Analysis:** Past reliability establishes the source's *character*, not the current belief's *tracking*. A clock that is right twice a day is reliable sometimes, but if you don't know the mechanism, you cannot bet on the next tick. Without Method $M$, we cannot assess Sensitivity. We cannot know if they would believe this if it were false.
  4.  **Stakes:** Irrelevant without Method.
  **Verdict:** **STAND DOWN.** This is not a "maybe." It is a procedural failure. To the editor: "We cannot establish sensitivity. The source's belief may be true, but it does not track the truth in a way we can verify. It is belief without knowledge."

  ---

  ## PART III: LIMITATIONS AND FAILURE MODES

  **What This Protocol Cannot Do:**

  1.  **The Self-Deceived Whistleblower:** If a source genuinely believes a falsehood because they misunderstand the science they are observing, Step 1 (Method) may pass (they did see the files), but Step 2 (Sensitivity) will fail silently. They would report the allegation even if false because their interpretation is flawed. The protocol assumes the source understands the *significance* of what they see. It does not test scientific competence, only access.
  2.  **Coordinated Fabrication:** If a group agrees on a lie and aligns their "methods" to support it, Step 1 will look solid. Tracking theory assesses the link between belief and fact, not belief and conspiracy. If the fact is manufactured to look like a fact, tracking fails.
  3.  **Structural Blindness:** A source may have a perfect method for seeing *data*, but no method for seeing *context*. They may track "The numbers changed" but fail to track "The numbers changed because of a calibrated instrument error." The protocol protects us from libel but not from publishing technically true but scientifically misleading stories.
  4.  **Judgment Calls Wearing Clothing:** Step 2 (Sensitivity) requires the reporter to judge human motivation. "Would they still say this if it were false?" is a counterfactual simulation, not a measurement. A skilled reporter will simulate this well; a poor one will not. The protocol forces the question, but it cannot guarantee the answer's accuracy.

  **Final Instruction:**
  This protocol is designed to prevent the newsroom from publishing *beliefs* that feel like *knowledge*. It will kill stories that are likely true but unprovable. That is the cost of integrity. If a source cannot tell you how they know, you cannot know that they know. Run the steps. If the chain breaks, the story breaks.
