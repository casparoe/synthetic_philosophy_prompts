          *   *Advice:* Keep it, but acknowledge the contestation explicitly or add a non-European parallel (e.g., Chinese dynastic cycles vs. continuous civilization, or Caliphates). Actually, the Rome example is *stronger* precisely because it's the canonical case for longevity. Swapping it might look like dodging the hardest case. Just frame it carefully.
          *   *Verdict:* Load-bearing. Keep Rome but acknowledge the bias or add a brief comparative nod.

      *   **Q4: Where does the claim exceed "survivorship bias + problem of the criterion"?**
          *   *Analysis:* Survivorship bias says "you only see the winners." Problem of the Criterion says "how do you know which criteria to use?" The author's unique contribution is the *ontological* claim (polities aren't natural kinds like bridges) and the *performative* claim (definitions affect the lifespan).
