      *(Self-Correction during drafting)*: On Q2, I need to be careful. If the user says "publishing a base rate," they might mean modern actuarial tables. I should suggest they broaden "base rate" to "theory of historical duration."
      *(Self-Correction on Q4)*: Make sure the distinguishing sentence is pithy.

  6.  **Final Review against Constraints:**
