answer: |-
  The short answer is that the forum reading you describe is a significant misreading of Aquinas. He does **not** grant a license to private individuals to assassinate tyrants on their own initiative, even when no human superior remains. The permission to remove a tyrant resides in **public authority** (the community acting corporately or a superior power), not in private persons.

  Here is the reconstruction of the permission, addressing your two puzzles and the jurisdictional/consequentialist distinction.

  ### 1. The Locus of Authority: Individual vs. Community
  **Puzzle:** *Is the permission genuinely individual, or does it run through the community?*

  It runs through the community. In *De Regno* (On Kingship), which is the primary text cited for tyrannicide, Aquinas argues that if a king is appointed by the community (or a superior), the right to depose him belongs to that same authority.

  *   **Public Deposition:** Aquinas writes that if the community has the right to provide itself with a king, it also has the right to depose him or restrict his power if he tyrannizes. This is a corporate act, not a private one.
  *   **The "No Superior" Case:** When there is no human superior to appeal to (e.g., the tyrant acknowledges no one above him), Aquinas does **not** pivot to private violence. He pivots to God. In *De Regno* I.6, he states that in such cases, recourse must be had to "the King of all, God," who can soften the tyrant's heart or remove him.
  *   **The Private Agent:** For the lone agent, Aquinas leaves no normative permission for lethal action. He explicitly warns against private plots. In *De Regno*, he argues that attempting to kill a tyrant privately is dangerous because it often leads to greater instability or a worse successor. He cites the example of the assassination of Julius Caesar, noting that it resulted in worse rulers, not liberty.

  **Correction:** The permission resides in the **public authority** (the *res publica* acting through its representatives or remaining institutions). If the public authority has been totally subsumed by the tyrant, the right reverts to God, not to the private conscience of an individual assassin.

  ### 2. The Sedition Question (*Secunda Secundae*, Q. 42)
  **Puzzle:** *How does this sit with the question on sedition, where disturbing a tyrannical regime is not sedition?*

  This is where the nuance is often lost. In *ST* II-II, Q. 42, A. 2, Aquinas argues that sedition is opposed to the unity of the multitude.
  *   **The Tyrant as Seditious:** Because the tyrant seeks private gain over the common good, he fractures the unity of the people. Therefore, the tyrant is guilty of sedition.
  *   **Resisting the Tyrant:** Consequently, resisting the tyrant is not, *by its genus*, sedition, because it aims to restore the common good and unity.
  *   **The Crucial Caveat:** However, Aquinas adds a prudential check. Even if the *aim* is just, the action becomes illicit if it causes **greater disturbance** to the multitude than the tyranny itself.

  **Reconciliation:** This does not authorize private killing. It authorizes *resistance* that restores order. Private assassination is rarely restorative of order; it is usually disruptive. Furthermore, in *ST* II-II, Q. 64 (On Killing), Aquinas establishes that killing a sinner (which a tyrannicide would be, conceptually) is an act of judgment/punishment. Private individuals lack the commission to judge and punish. Therefore, while resisting a tyrant isn't "sedition," killing him privately violates the order of justice regarding who may wield the sword.

  ### 3. Jurisdictional vs. Consequentialist
  **Core Question:** *Is his resistance to private action jurisdictional or consequentialist?*

  It is **primarily jurisdictional**, reinforced by consequentialist concerns.

  1.  **Jurisdictional (The Standing Argument):** In *ST* II-II, Q. 64, A. 3, Aquinas is explicit: "It is not lawful for a private individual to kill a sinner, except by chance in self-defense." To kill a tyrant is to execute judgment. Judgment belongs to the public authority. A private individual lacks the *commission* from God or the state to punish. This is a deontological constraint based on the order of justice.
  2.  **Consequentialist (The Prudential Argument):** In *De Regno*, Aquinas layers consequentialist warnings on top of the jurisdictional barrier. He argues that even if one *could* kill a tyrant, one *should not* if it risks greater evil (civil war, worse tyranny).

  **Why this matters for modern conclusions:**
  *   If the restriction were purely **consequentialist**, a modern agent could argue, "I have calculated the odds, and killing this dictator will definitely improve things; therefore, Aquinas permits it."
  *   Because the restriction is **jurisdictional**, that calculation is irrelevant. The private agent lacks the *standing* to act, regardless of the likely outcome. Only a public body (or a divinely inspired judge, like the Biblical Ehud, whom Aquinas treats as an exceptional case of divine commission, not human right) has the standing.

  ### 4. Where the Confusion Comes From
  The forum argument you describe likely conflates Aquinas with later Scholastics, particularly the Spanish Suarezians or Jesuits like **Juan de Mariana** (16th century). Mariana, in *De Rege et Regis Institutione*, did argue that a private individual could kill a tyrant (especially a usurper) if no public remedy existed. This was a development beyond Aquinas, driven by the context of resistance theory against Protestant monarchs. Aquinas is often "wheeled out" as the authority for this later, more permissive view, but it is not his own.

  ### Summary for Citation
  If you wish to reconstruct the permission properly:

  1.  **The Permission:** The right to depose a tyrant belongs to **public authority** (the community acting corporately or a superior political body), not private individuals.
  2.  **The "No Superior" Case:** If no human superior exists, Aquinas prescribes recourse to **God** (prayer/repentance), not private violence.
  3.  **Sedition:** Resisting a tyrant is not sedition because the tyrant is the true seditious party, **but** resistance must not cause greater disorder, and it must not violate the jurisdictional ban on private killing (*ST* II-II, Q. 64).
  4.  **The Barrier:** The barrier to private tyrannicide is **jurisdictional** (private persons cannot execute public judgment) with **consequentialist** safeguards (do not risk greater evil).

  **Verdict:** You cannot cite Aquinas to justify a private individual killing a dictator. You can only cite him to justify a public body deposing a tyrant, or to argue that private tyrannicide is illicit due to lack of authority and the risk of greater disorder.
