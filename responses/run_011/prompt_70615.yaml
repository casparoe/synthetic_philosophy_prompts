          1.  Is the permission genuinely *individual*, or does it run through the *community*? What is left for the lone agent in the "no-superior" case?
          2.  How does this sit with the question on *sedition* in the *Secunda Secundae* (sedition is a mortal sin, yet disturbing a tyrant is not sedition; the tyrant is the seditious party)?
      *   **Core Question:** If the common reading is wrong, where does the permission actually reside? Is resistance to private action *jurisdictional* (no standing) or *consequentialist* (risk of making things worse)?
      *   **Implication:** These readings support different modern conclusions.

  2.  **Initial Knowledge Retrieval & Verification:**
      *   *Text 1: De Regno (On Kingship).* Often cited for tyrannicide. Aquinas advises against killing tyrants if possible, but acknowledges it happens. Crucially, he often attributes the action to the *public authority*, not a private individual.
      *   *Text 2: Summa Theologiae, II-II, Q. 42 (On Sedition).* Sedition is contrary to unity/peace. A tyrant fosters sedition. Resisting a tyrant is not sedition *unless* it causes greater disorder.
      *   *Text 3: Summa Theologiae, II-II, Q. 64 (On Killing).* Private individuals cannot kill unless acting under public authority (like executioners) or in immediate self-defense.
      *   *Common Misconception:* Many modern libertarians or just-war theorists cite Aquinas as endorsing "lone wolf" tyrannicide. Scholarly consensus generally pushes back against this, emphasizing public authority.

  3.  **Addressing Puzzle 1: Individual vs. Community:**
      *   *De Regno:* Aquinas discusses the removal of tyrants. He cites the Old Testament (Eglon/Ahod) but also Roman history (Brutus). However, his *prescriptive* advice leans heavily toward public authority. In *De Regno* I.6, he says if there is a right to appoint the king, there is a right to depose him. This implies a *public* right, not a private one.
      *   *The "No Superior" Case:* If there is no human superior (e.g., the tyrant *is* the highest authority), Aquinas suggests recourse to God (prayer/repentance). He does *not* explicitly grant a license to private individuals to act as vigilantes. The "private individual" reading usually comes from a misreading of the Ahod example or a conflation with later Scholastics (like Suarez or Mariana).
      *   *Conclusion:* The permission runs through the community/public authority. The lone agent has no specific *permission* in Aquinas; they are left with prayer or acting as an instrument of public authority if such authority can be reconstituted.

  4.  **Addressing Puzzle 2: Sedition (ST II-II, Q. 42):**
      *   *Definition:* Sedition is opposed to the unity of the multitude.
      *   *The Tyrant:* The tyrant seeks private gain over the common good, thus fracturing unity. Therefore, the tyrant is guilty of sedition.
      *   *Resisting the Tyrant:* Resisting the tyrant aims to restore unity/common good. Thus, it is not sedition *in genus*.
      *   *The Caveat:* However, if the resistance causes *greater* disturbance/disorder than the tyranny itself, it becomes problematic. This is a consequentialist/prudential check.
      *   *Reconciliation:* Resisting a tyrant isn't sedition, but killing him privately might violate the order of justice (Q. 64).

  5.  **Addressing the Core Question: Jurisdictional vs. Consequentialist:**
      *   *Jurisdictional:* Aquinas holds that killing is generally reserved for public authority (ST II-II, Q. 64, A. 3). Private individuals lack the *commission* to punish. This is a strong jurisdictional barrier.
      *   *Consequentialist:* In *De Regno* and ST II-II, Q. 42, Aquinas warns that killing a tyrant often leads to worse tyrants or civil strife. This is prudential/consequentialist.
      *   *Synthesis:* It is primarily *jurisdictional* (private persons cannot execute judgment), reinforced by *consequentialist* concerns (it usually makes things worse). The "no superior" case defaults to God, not private violence.

  6.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the common misreading. State clearly that Aquinas does *not* endorse private tyrannicide in the modern "lone actor" sense.
      *   *Section 1: The Locus of Authority (De Regno).* Explain that deposition is a public act. The right to depose belongs to those who had the right to elect. If no human superior exists, recourse is to God, not private violence.
      *   *Section 2: The Sedition Question (ST II-II, Q. 42).* Explain the distinction. Tyranny is sedition. Resistance is not, *provided* it doesn't cause greater harm. This is not a blanket license for killing.
      *   *Section 3: Private Killing (ST II-II, Q. 64).* Crucial point: Private individuals cannot kill sinners/punish unless acting under public authority. Tyrannicide is a act of punishment/judgment, not just self-defense.
      *   *Section 4: Jurisdictional vs. Consequentialist.* Argue it is primarily jurisdictional (lack of commission) with consequentialist warnings layered on top.
      *   *Section 5: Where the Confusion Comes From.* Mention later Scholastics (Mariana) who *did* allow more latitude for private individuals under specific conditions, leading to the conflation.
      *   *Conclusion:* Summarize the proper citation.

  7.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Check:* Did Aquinas *ever* allow private tyrannicide? In *De Regno*, he mentions Ahod. But he frames it as divine inspiration or exceptional, not normative law. He explicitly warns against private plots in *De Regno* because they endanger the common good.
      *   *Nuance:* The "no superior" case. If the tyrant usurped power (no title), he is not a true ruler. Some Scholastics argue private killing is permissible then. Aquinas is more cautious. He distinguishes between a tyrant *by exercise* (legitimate title, bad rule) and *by defect of title* (usurper). Even then, he prefers public action.
      *   *Key Distinction:* Punitive killing vs. Defensive killing. A private person can kill in immediate self-defense (aggression happening now). Tyrannicide is usually punitive/preemptive. Aquinas forbids private punitive killing.
      *   *Final Verdict:* The forum argument is wrong. Aquinas is not the authority for private tyrannicide.

  8.  **Final Polish:** Ensure tone is scholarly, precise, and directly answers the user's two puzzles and core question. (Make sure to distinguish *De Regno* authorship issues briefly if necessary, but focus on the content traditionally ascribed to him). *Self-correction: Don't get bogged down in the Ptolemy of Lucca authorship debate regarding De Regno unless it changes the doctrine. Stick to the received text's argument.*

  9.  **Structure:**
      *   Direct Answer: The common reading is incorrect.
      *   Puzzle 1: Community vs. Individual (Public Authority).
      *   Puzzle 2: Sedition (Tyrant as seditious, but resistance must not cause greater harm).
      *   Core Question: Jurisdictional (primary) + Consequentialist (secondary).
      *   Source of Confusion: Later Scholastics.
      *   Recommendation for Citation.

  10. (Final Review against constraints): The user wants to know where the permission resides if not with the individual. It resides with the *public authority* or the *community as a corporate body*. If no superior exists, it resides with *God* (via prayer/providence), not private violence.

