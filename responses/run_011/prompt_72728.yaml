answer: |-
  You have intuitively rediscovered a core chunk of public choice economics and price theory. Your observations are sharp, accurate, and describe two different fates of the same underlying economic substance.

  Here is the vocabulary you need, the distinction between the two cases, and how to talk about them in a meeting without being tripped up on terminology.

  ### 1. The Umbrella Concept: Economic Rent
  First, you need the root term. In economics, **"Rent"** does not mean monthly payment. It means **unearned surplus created by artificial scarcity.**

  When the government caps rent below market rate, it creates a gap between the controlled price ($1,000) and the market price ($1,600). That $600 gap is **Economic Rent**. It is value created by the regulation itself, not by the landlord providing a service or the tenant working a job.

  Both phenomena you described are simply different things that happen to that $600 of Economic Rent.

  ### 2. Case One (The Leak): Rent Dissipation
  **The Term:** **Rent Dissipation** (or Rent Seeking Costs).

  **The Mechanism:** When the "rent" (the $600 savings) is available but not guaranteed, people will spend resources to capture it. In a competitive environment, they will spend *up to the full value* of the prize to get it.
  *   **Time:** Waiting three years on a list.
  *   **Money:** Paying a broker fee or "key money."
  *   **Quality:** Tolerating a landlord who doesn't make repairs.

  **Why it vanishes:** If the savings are truly $600/month, everyone wants the unit. The competition to get the unit becomes so fierce that the cost of entry rises until the net benefit is zero. The value hasn't disappeared from the universe, but it has transferred from the tenant to the broker, the superintendent, or the landlord (in the form of lower maintenance costs).

  **Is it Corruption?** Not necessarily. Corruption implies illegality (under-the-table cash). Rent dissipation can be perfectly legal (broker fees, waiting time). The economic effect is the same: the tenant doesn't keep the savings.

  ### 3. Case Two (The Stick): Capitalization
  **The Term:** **Capitalization of Rent** (or Assetization).

  **The Mechanism:** This is the specific word you are looking for regarding the "residual." When the right to the cheap rent is secure and (crucially) **transferable**, the future stream of savings gets converted into a present-day asset value.
  *   **The Math:** If you save $600/month for 10 years, that is $72,000 of value. If you can sell your lease (disguised as "selling furniture" or "key money"), the price of that lease will rise to roughly $72,000.
  *   **The Result:** The benefit is no longer a monthly flow of cash; it is a **stock** of wealth held by the incumbent.

  **Why it sticks:** It sticks because the property right is defined. The 1978 tenant *owns* the lease. The taxi medallion holder *owns* the permit. Because they own it, they can sell it. Because they can sell it, the market prices the subsidy into the asset.

  **The "Residual":** The chunk that doesn't get competed away is called the **Capitalized Value**.

  ### 4. Are They One Phenomenon or Two?
  They are **two fates of the same substance.**

  The substance is **Economic Rent**.
  *   If the right to the rent is **contested but non-transferable** (you can't sell your spot on the waiting list), the rent **Dissipates**.
  *   If the right to the rent is **secure and transferable** (you can sell the lease/permit), the rent **Capitalizes**.

  The difference is determined by **Property Rights**. In your housing example, Case 1 happens when the lease is hard to get and hard to sell. Case 2 happens when the lease is hard to get but easy to keep/sell (grandfathering).

  ### 5. Distinguishing from Other Concepts
  To avoid being corrected in a meeting, you need to know where the boundaries are.

  *   **Vs. Deadweight Loss:** Deadweight loss is value that is *destroyed* (e.g., no new apartments are built because rents are capped). Rent Dissipation and Capitalization are about value *transfer* (who gets the existing pie). However, severe dissipation often *causes* deadweight loss (people give up looking for housing).
  *   **Vs. Corruption:** Corruption is illegal. Rent Dissipation/Capitalization can be fully legal. A broker fee is legal friction; a cash envelope is corruption. Economically, they function similarly, but legally they are distinct.
  *   **Vs. Misallocation:** This is the *outcome* (a rich person in a cheap unit, a family of six in a studio). Capitalization causes misallocation because the person who values the *asset* (the resale value) keeps it, not the person who values the *housing* (the monthly shelter).

  ### 6. Vocabulary for Your Public Meeting
  You asked for a term you can use without getting corrected by an economist. **"Capitalization"** is the correct technical term, but it can sound abstract to laypeople. **"Rent Dissipation"** is accurate but sounds like jargon.

  Here is the tightest, most defensible phrasing for a public audience that remains economically rigorous:

  **For the "Leak":**
  > *"We are seeing **Rent Dissipation**. The savings aren't going to tenants; they are being consumed by the cost of competing for the unit."*

  **For the "Stick":**
  > *"We are seeing **Rent Capitalization**. The subsidy has been converted into an asset owned by the current leaseholder, not a benefit for the person living there."*

  **If you want a single phrase to cover the "Sticking" phenomenon that sounds punchier but won't get you corrected:**
  Use **"Locked Equity."**
  *   **Definition:** *Equity derived from regulatory scarcity rather than investment, which is inaccessible to new entrants.*
  *   **Why it works:** "Equity" implies ownership/wealth (which is what the 1978 tenant has). "Locked" implies it is unavailable to newcomers. An economist will nod at this because it accurately describes **Capitalized Regulatory Rent**.

  **The Soundbite for the Meeting:**
  > "Right now, we are treating rent control as if it creates a monthly benefit for tenants. But economics tells us that benefit either **dissipates** into fees and bribes to get in the door, or it **capitalizes** into a windfall asset for the person already inside. In the first case, the money vanishes into friction. In the second, it turns into **Locked Equity** that the tenant can sell, meaning the subsidy is no longer helping someone afford housing—it's helping someone sell a lease. We need to design policy that prevents the benefit from turning into an asset."

  ### Summary Checklist
  *   **The Gap:** Economic Rent.
  *   **The Leak:** Rent Dissipation.
  *   **The Stick:** Capitalization (or "Locked Equity" for public speech).
  *   **The Switch:** Transferability of the lease/permit.
  *   **The Danger:** When rent capitalizes, the policy stops being housing aid and starts being a wealth transfer to incumbents.

  Using "Capitalization" is safe. Using "Locked Equity" is rhetorically stronger and defensible if you define it as "capitalized rent." Avoid calling it "corruption" unless you have proof of illegality; call it "friction" or "dissipation." Avoid calling it "deadweight loss" unless you are talking about apartments that were never built.
