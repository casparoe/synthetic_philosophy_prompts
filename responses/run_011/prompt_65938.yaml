answer: |-
  Here is a principle constructed to fit your cases, followed by the stress test you asked for.

  ### The Principle: The Authority & Purpose Framework

  A promise creates a binding moral obligation when **Authority** is voluntarily transferred from the Promisor to the Promisee, provided the **Purpose** of that transfer remains intelligible.

  This breaks down into three specific clauses. If a case fails a clause, the bond dissolves or degrades into a "residue" (guilt/regret without obligation).

  **Clause 1: The Voluntariness Threshold (The Source)**
  *The transfer of authority must be free from coercion that overrides the promisor's will.*
  *   **Work Coercion (Blackmail):** Fails. Your will was overridden by threat. Void.
  *   **Brother-in-Law (Guilt):** Passes (technically). Guilt manipulates emotion but leaves the mechanical "yes" intact. *However, see the "Verdict to Drop" section below.*
  *   **Auction/Contractor:** Passes. Contextual pressure exists, but the will to commit was present.

  **Clause 2: The Contextual Uptake (The Signal)**
  *The commitment must be recognized as a commitment by the shared conventions of the relationship or setting.*
  *   **Joke (Name):** Fails. Shared convention was "banter," not "contract." No authority transferred.
  *   **Auction (Silence):** Passes. Convention dictates that a raised hand *is* a commitment.
  *   **Child (Pool):** Passes. The parent-child convention inherently weights promises heavily (trust formation).

  **Clause 3: The Teleological Survival (The End)**
  *The moral purpose underlying the promise must still exist. If the purpose becomes impossible or morally inverted, the obligation dissolves.*
  *   **Venue (Fire):** Fails (Performance). Purpose (the event) is impossible. Obligation dissolves, but *residue* remains (compensation) because the *relationship* persists.
  *   **Mother (Dementia):** Fails (Purpose). The purpose was her welfare. Keeping the promise now harms her welfare. The purpose has inverted. Obligation dissolves.
  *   **Grandmother (Dead):** Passes. The purpose was honoring her will/memory. That purpose survives death. Obligation holds.

  ---

  ### Cracking the Grandmother / Dementia Pair

  You feel these are the "same shape" because in both cases, the promisee cannot complain. This is the **illusion**. They are not the same shape; they are different moral categories entirely.

  *   **The Mother Case is Fiduciary.** You promised to act in her interest. A fiduciary duty is dynamic; it tracks the beneficiary's current welfare. When her welfare requires breaking the promise, the promise automatically voids because the *condition* of the promise (her good) is no longer met. The "complaint" comes from her objective welfare, even if she can't voice it.
  *   **The Grandmother Case is Testamentary.** You promised to honor her past will. This is a static duty. It does not track her current welfare (she has none); it tracks your integrity and her memory. The "complaint" comes from *you* (your integrity) and the *memory* of her.

  **Which intuition is the illusion?**
  The illusion is that **enforceability determines bindingness.** You wrote: *"Nobody alive can hold me to it... Neither case has anyone in a position to complain."*
  You are conflating *social enforcement* with *moral obligation*.
  *   In the **Mother** case, the obligation dies because the *purpose* dies.
  *   In the **Grandmother** case, the obligation lives because the *purpose* (honor) is located in *you*, not her.

  If you force them to be the same shape, you must drop the **Grandmother** verdict. If promises are tools for coordinating living welfare (as the Mother case suggests), a promise to a corpse is nonsense. It binds only because you have elevated it to a **Vow**. A vow binds the *promisor's soul*; a promise binds the *promisee's expectations*. You treated the Grandmother case as a Vow and the Mother case as a Promise. That is why they feel different.

  ---

  ### The Surprising Case: The Posthumous Release

  Here is a case the principle handles, but which often surprises people.

  **The Case:** You promise your friend, "I will burn these diaries when I die." Ten years later, your friend has a change of heart. He tells you, "I've written my memoirs, I actually want you to publish them. I release you from the promise." You refuse. He dies.
  **The Verdict:** You are **still bound** to burn them.
  **The Reasoning:** Under Clause 3 (Teleological Survival), the purpose was to honor *his will at the time of the promise*. By releasing you, he changed his will. However, the promise was not "Do what I want forever," it was "Do this specific act based on my request then."
  *Wait, that's not the surprising one.* Let's sharpen it.

  **The Real Surprising Case:** **The Instant Death.**
  You promise a stranger on a train, "I will mail this letter for you." He hands it to you, gets off at the next stop, and is immediately killed in an accident (unknown to you). You keep the letter in your pocket for years.
  **Your Intuition:** Probably "It doesn't matter, he's dead, no harm done."
  **The Principle's Verdict:** **You are still bound.**
  **Why:**
  1.  **Voluntariness:** You said yes.
  2.  **Uptake:** It was a clear request/commitment.
  3.  **Purpose:** The purpose was to execute his will. His death does not invalidate his will (see Grandmother case). The authority was transferred to *him*, and upon his death, it transfers to his *estate/memory*.
  **The Surprise:** Most people feel the obligation evaporates with the breath of the promisee. The principle says the obligation transfers to the *act itself*. You are now the executor of a dead man's minor will. Keeping the letter is a theft of his final agency, even if no one knows.

  ---

  ### The Verdict You Must Drop

  You asked me to be straight about which of your verdicts is unsustainable.

  **Drop the Brother-in-Law Verdict.**
  *Your Verdict:* "Duress voids, manipulation doesn't... That one binds."
  *The Correction:* **Manipulation vitiates consent.**

  You distinguish blackmail from guilt-tripping based on the *tool* (threat vs. emotion). But the moral mechanism is the same: **Undue Influence.**
  In the blackmail case, you recognized that your "yes" wasn't truly yours because it was bought with fear. In the guilt case, your "yes" wasn't truly yours because it was bought with exploited affection.
  If the promise binds fully, you are validating the manipulation.
  *Why you feel it binds:* You feel bound not by the *promise*, but by the **debt**. If he gave you money, you owe the money. But the *moral promise* to pay him back on his terms, extracted via guilt, should be voidable. You should be able to say, "I will repay you, but I am not bound by the guilt-trip schedule/interest/demands."
  By saying it "binds," you are conflating **Financial Obligation** (which exists regardless of promise) with **Promissory Obligation** (which requires free consent).
  If you keep this verdict, you cannot consistently hold the Blackmail verdict. Both are failures of Clause 1 (Voluntariness).

  ### Summary of Pressure Points

  1.  **Reliance is not the Source:** Your original "Planning" theory failed because it couldn't account for the Grandmother (no planning possible) or the Child (no complex planning). The source is **Authority Transfer**, not Reliance. Reliance just measures the *damages* if you break it.
  2.  **The "Same Shape" Illusion:** The Grandmother and Mother cases are only paradoxical if you ignore the *status of the beneficiary*. Dead = Static Honor. Living (Incapacitated) = Dynamic Welfare.
  3.  **The Weak Link:** Your tolerance for manipulation (Brother-in-Law) is the inconsistency in your system. If you fix that, the rest aligns.

  **Final Directive:** Treat the Grandmother promise as a **Vow** (binds your integrity). Treat the Mother promise as a **Fiduciary Duty** (binds to her welfare). Treat the Brother-in-Law promise as **Voidable** (consent was tainted). If you make those three distinctions, the wall disappears.
