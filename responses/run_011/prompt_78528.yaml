prompt: |-
  I'm the programs person at a pretty small NGO doing livelihoods work in East Africa — mostly short business-skills training plus a small grant for market vendors. Our board met last week and one of the longtime members killed a proposal to pilot unconditional mobile money transfers instead by saying "give a man a fish, you feed him for a day; teach a man to fish, you feed him for a lifetime," everyone nodded, and that was that. I tried to push back and got nowhere, partly because I couldn't say what exactly I was objecting to.

  Can you pull that sentence apart for me? I want a menu of the distinct claims it could be making — about the time profile of benefits, about what poor people actually lack (skills vs. capital vs. access), about dignity and who gets to be the active party, about dependency and moral hazard, about what the goal of aid even is, and about the giver's obligations rather than the effects on the reciever. For each one tell me: is it a platitude, is it substantive and defensible, or is it just false? Also flag what the proverb quietly assumes and leaves out — like whether the man owns the lake, whether he has a rod or a net, whether he can spare the afternoon, and whether the lake still has fish in it by the time he's learned. I keep feeling like the saying is doing a lot of work it hasn't earned.

  Then the part I actually care about: which of those readings would really get him his conclusion, that transfers are the wrong thing for us to fund, and which readings are perfectly compatible with transfers turning out better than training? Is there a version where giving someone money just is handing them a fishing rod, so the contrast collapses? And is there a reading on which it isn't an empirical claim at all but a claim about what kind of giver you ought to be — because I suspect that's what he's really saying, and I want to know whether that version does any argumentative work or just shuts the conversation down in a way that feels like wisdom.

  Don't bother citing specific studies or papers, I mostly want the conceptual map laid out as a list I could take back to the next board meeting.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Programs person at a small NGO in East Africa (livelihoods, business skills + small grants for market vendors).
      *   **Context:** Board meeting rejected a pilot of unconditional cash transfers (UCTs) in favor of training/grants. A board member used the "Give a man a fish..." proverb. User tried to push back but lacked the conceptual tools.
      *   **Task:** Deconstruct the proverb into distinct claims (time profile, constraints, dignity, dependency, goals, obligations). Evaluate each claim (platitude, substantive, false). Identify hidden assumptions (lake ownership, tools, time, ecology). Determine which readings support the board's conclusion vs. which are compatible with cash transfers. Explore the "moral identity of the giver" angle.
      *   **Constraint:** Do *not* cite specific studies or papers. Focus on the conceptual map.
      *   **Tone:** Analytical, sharp, practical, respectful but critical of the proverb's misuse.

  2.  **Deconstruct the Proverb ("Give a man a fish..."):**
      *   *Core Metaphor:* Fish = Consumption/Short-term relief. Fishing = Production/Skill/Long-term sustainability.
      *   *Implicit Binary:* It sets up a false dichotomy between consumption (cash) and investment (skills/assets).

  3.  **Brainstorming the "Menu of Claims":**
      *   *Time Horizon:* Cash is short-term; Skills are long-term. (Is this true? Cash can be invested.)
      *   *Binding Constraint:* Poor people lack skills, not capital. (Is this true? Often they lack capital or face risk.)
      *   *Dependency:* Cash creates laziness; Skills create autonomy. (Moral hazard argument.)
      *   *Dignity/Agency:* Teaching empowers; Giving patronizes. (Who is the active subject?)
      *   *Goal of Aid:* Sustainability vs. Relief. (What is the NGO's mandate?)
      *   *Giver's Virtue:* The giver feels better teaching. (Paternalism.)

  4.  **Evaluating the Claims (Platitude vs. Substantive vs. False):**
      *   *Time:* False dichotomy. Cash can be long-term investment.
      *   *Constraint:* Often false. Market vendors usually know how to sell; they lack stock/capital.
      *   *Dependency:* Substantive debate, but often overstated in short-term contexts.
      *   *Dignity:* Platitude. Cash can enhance dignity by allowing choice.
      *   *Goal:* Substantive. Depends on NGO mission.
      *   *Giver:* Substantive but shifts focus from recipient welfare to donor ego.

  5.  **Identifying Hidden Assumptions (The "Quietly Assumes" part):**
      *   Does he own the lake? (Access/Rights)
      *   Does he have a rod? (Capital/Tools)
      *   Can he spare the afternoon? (Opportunity cost/Time poverty)
      *   Are there fish? (Market demand/Ecology)
      *   Is he hungry *now*? (Immediate need vs. future planning)

  6.  **Mapping to the Board's Conclusion (Cash vs. Training):**
      *   *Which readings support the Board?* The "Dependency" and "Binding Constraint (Skills)" readings.
      *   *Which readings are compatible with Cash?* The "Capital Constraint" reading (Cash = Rod). The "Time Profile" reading (Cash solves immediate crisis to allow learning).
      *   *The Collapse:* Cash *is* the rod. If the problem is capital, cash is the productive asset.
      *   *The Moral Identity:* This is the "Shut Down" move. It's about the donor's soul, not the recipient's belly. It stops empirical debate.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Acknowledge the frustration. Validate that the proverb is doing heavy lifting it shouldn't.
      *   *Section 1: The Menu of Claims.* Break it down by category (Time, Constraints, Behavior, Dignity, Goals, Giver). Use the "Platitude/Substantive/False" tagging.
      *   *Section 2: The Hidden Assumptions.* List the "Lake/Rod/Time/Fish" factors. This is crucial for the East Africa context (market access, capital).
      *   *Section 3: Does it prove the Board Right?* Analyze the logical link. Show where the logic breaks.
      *   *Section 4: The "Cash is the Rod" Argument.* Reframe the metaphor.
      *   *Section 5: The Moral Identity Argument.* Address the "Giver's Obligation" point. Explain why it shuts down debate.
      *   *Conclusion:* Summary advice for the next meeting.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I cite studies? *No.*
      *   *Check:* Is the tone right? *Needs to be empowering for the user but rigorous.*
      *   *Check:* Did I answer the specific question about the "Giver's Obligation"? *Yes, need to emphasize that this moves the goalposts from impact to virtue.*
      *   *Nuance:* Make sure to distinguish between *consumption* cash and *investment* cash. The board sees cash as consumption. The user knows it can be capital.
      *   *Context:* Keep the East Africa market vendor context in mind (working capital is usually the bottleneck, not knowledge of how to sell vegetables).

  9.  **Final Polish:** Organize with clear headings. Ensure the "Platitude/Substantive/False" tags are clear. Make sure the distinction between empirical claims and moral claims is sharp. (The user specifically asked about the "giver's obligations" vs "effects on receiver".)

  10. **Final Review against constraints:** No specific papers (e.g., GiveDirectly, Haushofer & Shapiro). Keep it conceptual.

