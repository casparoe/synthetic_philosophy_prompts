answer: |-
  Here is a run of nine questions designed to be fair but epistemically rigorous. They move from specific criteria to structural issues, ending on the foundational assumption. Each includes the likely response and a follow-up designed to prevent the "it's just a heuristic" shield from doing too much work.

  ### 1. The Criterion of Embarrassment (Likelihood Ratios)
  **Question:** My Bayesian-leaning listeners view the criterion of embarrassment as a likelihood ratio: does an awkward detail make the hypothesis "this happened" more probable than "this was invented"? But you can't estimate that likelihood without knowing what the redactors found awkward. We see them retaining awkward material but reframing it—like the Baptism, where John protests Jesus shouldn't baptize him. They didn't delete it; they explained it. In cases of "retain-and-reframe" versus cases like the Cry of Abandonment, which gets replaced in later gospels, does the retention count for or against authenticity? And does your verdict change depending on whether they reframed it or removed it?

  **Likely Answer:** He will likely say that retention suggests the event was too well-known to delete, so reframing is an admission of historicity. He'll argue the "awkwardness" is objective enough to judge.

  **Follow-up:** If retention signals "too well-known to delete," doesn't that mean the criterion is actually measuring the *strength of the tradition* rather than the *historicity of the event*? If a story is embarrassing but entrenched, you keep it. If it's embarrassing and new, you might delete it. How do you distinguish between "awkward truth" and "awkward legacy" without already knowing the history you're trying to prove?

  ### 2. Double Dissimilarity (The Portrait of Exceptions)
  **Question:** The criterion of double dissimilarity filters out anything that looks like first-century Judaism or the early Church. By construction, this leaves you with a pile of exceptions. What kind of historical figure can a method produce if it only admits data points that don't fit his context or his movement's outcome? Can a portrait made entirely of residues support any positive claim about what he was mainly about, or does it just give us a Jesus who couldn't possibly have started the movement that followed him?

  **Likely Answer:** He will likely concede the strict form is outdated but argue that a "modified" dissimilarity still helps isolate distinctive emphases, not just exceptions. He'll say it's a control, not the whole picture.

  **Follow-up:** If it's just a control, what is the positive engine? If you strip away the Jewish context and the Church's theology using this control, and what's left is a minimal core, are you describing the historical Jesus, or are you describing the *gap* between your model of Judaism and your model of the Church? If the gap closes because our understanding of first-century Judaism changes, does the Jesus portrait disappear?

  ### 3. Multiple Attestation (Source vs. Tradition)
  **Question:** When you invoke multiple attestation, are you looking for independent sources or independent tradition streams? If Mark and Q both contain a saying, that's two sources, but if they both drew from a single oral tradition circulating in Syria, that's one stream. Does passing this criterion give us evidence about Jesus, or does it only give us evidence about how far back a tradition stream goes? At what point does "early" stop meaning "close to the event" and start meaning "close to the theological crystallization"?

  **Likely Answer:** He will likely argue that independent streams increase probability because it's unlikely two communities would invent the *same* specific saying. He'll emphasize "early" as a proxy for "less developed."

  **Follow-up:** But if the "early" tradition is already theological—and most scholars agree the earliest layers we can access are already kerygmatic—doesn't multiple attestation just prove that a specific theology was widespread? How do you use a criterion that measures the *spread of a story* to verify the *facts of the story* without assuming the story doesn't change as it spreads?

  ### 4. The Background-Model Problem (Circular Calibration)
  **Question:** The criteria are calibrated against a picture of first-century Judaism and early Christian tendencies. But that background picture was itself built largely out of the same texts you're testing. I'm looking for a concrete case: can you name one instance where a change in the background model—say, new archaeological data or a shift in how we view Second Temple Judaism—flipped a verdict on a saying's authenticity? If the background model shifts and the verdicts don't, is the method doing work, or is it just tracking the consensus?

  **Likely Answer:** He might cite the "Jesus and the Law" debate, noting that as we realize Judaism was more diverse, more of Jesus' legal debates look authentic. He'll argue the method is sensitive to background data.

  **Follow-up:** In that case, did the method *drive* the conclusion, or did the new background data simply make the criteria easier to satisfy? If the criteria are flexible enough to flip whenever the background model shifts, doesn't that suggest they are formalizing your intuition about the background rather than testing the text against it?

  ### 5. Asymmetry (The Falsification Mechanism)
  **Question:** As far as I can tell, the criteria only ever license inclusion. They tell you what you can keep, not what you must discard. Is there a specific saying or episode that you used to count as authentic and have since ruled out based on these criteria? If not, what is the mechanism by which your method could be wrong? If there's no path to subtraction, how is this different from a confirmation bias engine?

  **Likely Answer:** He will likely say that the "burden of proof" is on authenticity, so default is skepticism. He might mention a shift in consensus on the Temple Cleansing or specific apocalyptic sayings as things that get ruled out.

  **Follow-up:** If the default is skepticism, why does the "minimal portrait" consistently end up looking so coherent? If the method is primarily a filter for exclusion, why do different scholars using the same filter end up with Jesuses that match their own theological or historical priors? Is the asymmetry in the tool, or in how the tool is wielded?

  ### 6. The Social Memory Objection
  **Question:** Social memory theorists argue there's no clean line between a stable core and later interpretation; the memory *is* the interpretation. I know your likely reply: that the memory people are doing criteria-shaped inference with the serial numbers filed off. But if they are right that memory is inherently malleable, what constraints are left? If the "core" is just the part of the memory that was most useful to the rememberers, doesn't that make the criteria a measure of utility rather than historicity?

  **Likely Answer:** He will likely argue that memory isn't *infinitely* malleable. There are constraints—events that are too public or too recent can't be totally fabricated. He'll say criteria help identify those constraints.

  **Follow-up:** But aren't those constraints themselves assumptions? You're assuming that "public" events resist alteration. But the Crucifixion was public, and the interpretations of it vary wildly even in the New Testament. If the *meaning* of the event changes immediately, does the "fact" of the event carry enough historical weight to support the portrait you're building?

  ### 7. The "Heuristic" Defense (Formalization vs. Intuition)
  **Question:** You've described the criteria as heuristics, not algorithms—a formalized version of the weighing every historian does. But historians in other fields don't usually need a specialized toolkit to avoid circularity. If these are just formalized intuitions, what work is the formalization doing? Is it adding precision, or is it adding a veneer of objectivity to what is essentially an expert's gut feeling about what "fits"?

  **Likely Answer:** He will say the formalization forces discipline. It makes the argument transparent so others can critique the steps. It prevents wild speculation.

  **Follow-up:** Transparency is good, but if the inputs (the criteria weights) are subjective, a transparent process still yields a subjective output. If I can show that changing the weight of "embarrassment" changes the portrait, doesn't that prove the portrait is dependent on the scholar's prior beliefs about what *should* be embarrassing, rather than what *was*?

  ### 8. The Prior Probability of Oral Transmission
  **Question:** For my rationalist listeners, the missing variable is the prior. What is the prior probability that a specific saying survives 40 years of oral transmission in a non-literate culture without significant modification? If that prior is low, the criteria need to generate massive likelihood ratios to overcome it. Do you think the criteria are strong enough to overcome a low prior on oral stability, or are we assuming the tradition is more stable than comparable oral traditions?

  **Likely Answer:** He will likely argue that we have examples of stable oral tradition (e.g., Mishnah, though later) and that the community had a vested interest in preserving the Jesus tradition accurately.

  **Follow-up:** But the Mishnah is legal material, which is mnemonic by design. Jesus' sayings are often prophetic or aphoristic. If the community was interested in preserving the *authority* of Jesus, wouldn't that incentivize generating *new* sayings in his voice to address new problems? If so, doesn't that lower the prior on authenticity for any specific saying, making the criteria's job even harder?

  ### 9. The Load-Bearing Assumption (The Closer)
  **Question:** I want to end on the structural integrity of the approach. If you had to name the single most load-bearing assumption in the whole criteria enterprise—the one thing that, if proven false, would cause the minimal portrait to collapse—what is it? And if that assumption is false, do your conclusions become merely uncertain, or do they become unwarranted?

  **Likely Answer:** (This is the money shot). He might say the assumption is that "the Gospels contain historical memory" or "the transmission wasn't purely creative."

  **Follow-up:** (No follow-up. Let the answer hang).
