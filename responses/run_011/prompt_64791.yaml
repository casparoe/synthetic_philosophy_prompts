answer: |-
  # QUESTION-PERIOD SHEET
  **Workshop:** Foundations of Decision Theory & Mechanism Design
  **Paper:** Superrationality as EUM + Evidential Premise
  **Time:** 15 Minutes Q&A

  ## STRATEGIC OVERVIEW

  **The Two Sinking Objections:**
  1.  **The CDT Attack:** If superrationality reduces to Evidential Decision Theory (EDT), and EDT is refuted (Smoking Lesion), your thesis collapses.
  2.  **The Game Theory Attack:** If this is just Correlated Equilibrium (CE) or Nash Equilibrium (NE) in disguise, the paper is redundant.

  **The Irritating Objections:**
  Philosophical nitpicks on normativity, exegesis of Hofstadter, or practical limitations of the Platonia Dilemma. These waste time but don't kill the thesis.

  **Pre-emptive Concessions (First 10 Minutes):**
  *   **To the Game Theorists:** Concede immediately that superrationality does not propose a *new* mathematical solution concept. It is a reinterpretation of existing equilibria under a specific epistemic constraint ("same algorithm"). Do not fight for novelty in the math; fight for novelty in the *justification*.
  *   **To the CDTer:** Concede that this framework *is* evidential in structure. Do not try to hide it. Instead, frame it as "Logical Decision Theory" rather than classical EDT. Acknowledge that if logical correlation is rejected, superrationality fails. This disarms the "reductio" by accepting the premise as the battleground.

  **The Critical Reply (For Consequence 3):**
  You must successfully defend the distinction between **deterministic algorithmic identity** and **stochastic independence**. If you cannot explain how two identical agents generate uncorrelated noise without magic, Consequence 3 (the Platonia repair) fails.

  **The Most Dangerous Question:**
  *Your Candidate:* "No participant knows the pool size N."
  *My Assessment:* **Incorrect.** That is a practical limitation, easily patched with priors.
  *The Real Killer:* **The CDT/EDT Refutation.** If the CDTer convinces the room that your "evidential premise" is simply the discredited logic of the Smoking Lesion, the theoretical foundation evaporates. Hope they stay silent; prepare for them to speak.

  ---

  ## THE EIGHT OBJECTIONS

  ### 1. The CDT Refutation (Foundational Kill)
  **Who:** The Causal Decision Theorist.
  **Objection:** "You've admitted this relies on an evidential premise: my choice is evidence of theirs. But EDT is refuted by the Smoking Lesion case, where agents condition on common causes without causal leverage. You're resurrecting a dead theory. If EDT is irrational, superrationality is irrational."
  **Reply (90s):** "I concede the structure is evidential, but the *source* of the correlation differs. In the Smoking Lesion, the correlation is biological and opaque. In superrationality, the correlation is logical and transparent: we are running the same function. If $f(x) = y$, and you run $f(x)$, you get $y$. This isn't spurious correlation; it's identity. I am not defending EDT generally, only the specific case where the 'evidence' is logical necessity derived from shared source code."
  **Soft Spot:** You are relying on "logical necessity" in agents that may not be fully deterministic or transparent. If the CDTer presses that logical correlation doesn't justify *action*, you have no causal lever to pull.

  ### 2. The Correlated Equilibrium Redundancy (Novelty Kill)
  **Who:** The Game Theorists.
  **Objection:** "In the Platonia Dilemma, the 1/N mixed strategy is already a symmetric Nash Equilibrium. In symmetric games, your 'diagonal maximization' looks like a Correlated Equilibrium with a specific correlation device. What work is 'superrationality' doing here? You seem to be reinventing Aumann's correlation device with extra steps."
  **Reply (90s):** "Standard NE explains *that* the strategy is stable, but not *how* agents select it among multiple equilibria. Superrationality provides the selection mechanism: the 'same algorithm' premise. It explains why agents converge on this specific equilibrium without an external correlating device. The 'device' is internal to their reasoning. It's not redundancy; it's micro-founding the equilibrium selection."
  **Soft Spot:** If they argue that "reasoning" counts as a correlation device in the standard sense, your distinction vanishes.

  ### 3. The Physical Independence Problem (Consequence 3 Kill)
  **Who:** The Multi-Agent Systems/ML Researcher.
  **Objection:** "You repair the Platonia fragility by stipulating independent noise. But in deployment, identical agents share hardware, clocks, or entropy sources. If they are 'alike enough' to run the same algorithm, they are alike enough to have correlated seeds. Your 1/N prescription collapses into collision. How is this satisfiable?"
  **Reply (90s):** "The premise applies to the deterministic logic, not the physical instantiation. We treat the random seed as an exogenous input to the algorithm, like a sensor reading. Even identical code reading different thermal noise produces independent outputs. Superrationality requires agents to treat their noise as private, even if their logic is common knowledge."
  **Soft Spot:** This is a stipulation, not a solution. If the physical world correlates the noise (e.g., same pseudo-random generator seed), the theory fails. You are assuming away the engineering problem.

  ### 4. The Common Knowledge of N (Your Candidate)
  **Who:** The Game Theorist or Philosopher.
  **Objection:** "In the real Platonia Dilemma, no agent knows the exact number of participants N. Without common knowledge of N, they cannot calculate the 1/N probability. The superrational prescription is undefined."
  **Reply (90s):** "Hofstadter's thought experiment assumes N is given. In application, agents would use a prior distribution over N and maximize expected utility over that distribution. The core insight—that universalizing a pure strategy fails and randomization is required—holds regardless of the precise probability. The exact 1/N is the ideal case; the robust insight is the necessity of mixing."
  **Soft Spot:** This weakens the precision of your claim. If N is uncertain, the "superrational" strategy diverges between agents with different priors, breaking the "same output" premise.

  ### 5. The Normative Force Question
  **Who:** The Philosophers.
  **Objection:** "Even if this describes how identical agents *do* behave, why *should* I behave this way? If I know others are superrational, isn't it rational for me to defect and exploit their cooperation? Superrationality isn't stable against standard rationality."
  **Reply (90s):** "If you defect, you are no longer running the 'same algorithm' as the superrational agents. You have changed the premise. The question is conditional: *If* you consider yourself part of the group of identical reasoners, *then* you must cooperate. If you exempt yourself, you are no longer arguing about superrationality, but about exploitation. The normativity comes from the identity claim."
  **Soft Spot:** This sounds circular. It doesn't tell a standard rational agent why they should adopt the identity claim in the first place.

  ### 6. The "Magic" Objection
  **Who:** The CDTer (Follow-up).
  **Objection:** "You claim logical identity justifies the evidential link. But my decision happens *here* and *now*. Theirs happens *there*. Unless you have a causal mechanism, assuming my choice controls theirs is magic. You're assuming logical omniscience."
  **Reply (90s):** "It is not control; it is prediction. I don't assume my choice *causes* theirs. I assume that because we are identical, my choice *predicts* theirs with probability 1. Expected utility maximization requires using all available evidence. The fact of our identity is evidence. Ignoring it is ignoring data."
  **Soft Spot:** CDT explicitly forbids using this type of evidence. You are talking past each other unless you convince them to abandon CDT axioms.

  ### 7. The Triviality Objection
  **Who:** The Philosophers.
  **Objection:** "This sounds like a magazine puzzle. 'Imagine everyone is you.' If they are you, of course they do what you do. This is tautological, not a decision theory."
  **Reply (90s):** "It is not tautological because agents are not literally the same person. They are separate instantiations. The work is in determining *when* it is rational to treat them as identical. In symmetric games with open source code, it is rational. In asymmetric or opaque games, it is not. The theory defines the boundary conditions for that identification."
  **Soft Spot:** If the boundary conditions are vague, the "magazine puzzle" charge sticks.

  ### 8. The Exegesis Objection
  **Who:** The Hofstadter Fans (if any).
  **Objection:** "Hofstadter meant this as a moral intuition pump, not a rigorous reduction to EUM. You're stripping the moral content to make it a technical claim."
  **Reply (90s):** "I am not doing exegesis; I am doing reconstruction. Whether Hofstadter intended it or not, the logic holds up as EUM with a specific premise. If the reconstruction works better than the original moral intuition, that is a feature, not a bug."
  **Soft Spot:** Alienates anyone who cares about the history of the idea, though this is low damage.

  ---

  ## EMERGENCY PROTOCOLS

  **If the CDTer dominates:**
  Stop defending EDT. Pivot to **Functional Decision Theory (FDT)** or **Timeless Decision Theory (TDT)** terminology if you know it. Frame the "premise" as "logical counterfactuals" rather than "evidence." This signals you know the modern literature and aren't just reviving 1980s EDT.

  **If the Game Theorists demand rigor:**
  Do not try to formalize the "same algorithm" premise on the fly. Admit it requires a formal language of logical counterfactuals which is currently an open research area. Frame your paper as a *conceptual* bridge, not a final formalization.

  **If the ML Researcher presses the Seed Correlation:**
  Concede. "In physical systems, perfect independence is an engineering constraint. Superrationality provides the target; mechanism design provides the entropy sources. If you cannot guarantee independent noise, superrationality degrades to correlated equilibrium." This turns their attack into a collaboration opportunity.

  **The One Reply That Must Land:**
  When asked about Consequence 3 (Platonia/Independence), you must say: **"The algorithm determines the probability distribution; the noise determines the sample. Identical algorithms can sample from identical distributions independently."** If you confuse the distribution with the sample, you lose the room.
