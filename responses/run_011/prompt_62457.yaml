answer: |-
  *   **Accomplish:** Shift the room's focus from classifying *outputs* to locating *competence*; introduce the "Subtraction Test" as a shared diagnostic; validate the "hierarchy of value" critique without discarding the framework; motivate productive conflict rather than consensus.
  *   **Avoid:** Dennett exegesis (wastes time); technobabble (alienates journalists); moralizing (alienates engineers); false consensus (kills the workshop).
  *   **Objection 1 (Performance-Confusion):** Bites hardest when ML engineers equate fluency with Gregorian status. The remarks must sever the link between "what it does" and "how it does it."
  *   **Objection 2 (Hidden Hierarchy):** Bites hardest with comparative psychologists who feel the ladder demotes animals. The remarks must reframe the ladder as a map of *dependence*, not worth.

  ***

  Good morning. If you've been to enough interdisciplinary workshops, you know the script. We gather, we define our terms until they are smooth enough to slip past each other, we nod politely, and we leave having confirmed exactly what we believed when we arrived. This room is too expensive and too rare for that. We have psychologists who know what animals can do, engineers who know what models can do, philosophers who know why those distinctions matter, and journalists who will tell the world what we decided. If we leave here with a press release that says "Experts Disagree," we have failed. If we leave with a press release that says "Experts Agree," we have lied.

  We are here to argue, but we need to argue about the same thing.

  Half of you know Dennett's ladder intimately. Darwinian, Skinnerian, Popperian, Gregorian. The other half will get the textbook definition in the first talk. So I am not going to recap it. Instead, I want to put on the table the error that turns this framework from a tool into a toy.

  The error is the Performance Trap.

  In practice, when we look at a system, we assign it a rung based on what it outputs. If it talks fluently, we call it Gregorian. If it solves a puzzle by trial and error, we call it Skinnerian. But the ladder was never about output. It was never about what the creature *does*. It is about where the competence *lives*.

  In a Darwinian creature, competence is hard-wired by selection history. In a Skinnerian creature, it is shaped by reinforcement in its own lifetime. In a Popperian creature, hypotheses die in its stead. In a Gregorian creature, competence is offloaded onto tools and culture inherited from others. When we judge by performance, we confuse the shadow for the substance. We look at a language model that writes poetry and say "Gregorian," because it uses culture. But did it inherit the tools, or is it merely simulating the output of someone who did?

  This confusion feeds the second elephant in the room. Many of you, particularly in the biological sciences, view this ladder as harmful. You see it as a hierarchy of value wearing a lab coat—a Great Chain of Being used to rank animals down and machines up. It suggests that to be higher on the ladder is to be *better*.

  I want us to reject that valuation while keeping the topology. Being Gregorian does not make you superior; it makes you dependent. A Gregorian creature is one that cannot survive without the scaffolding built by others. A Darwinian creature is self-contained. If the ladder measures anything, it measures reliance, not worth. A human stripped of culture is often less competent than a bee stripped of its hive. That is not an insult to the human; it is a description of our architecture. We are designed to lean.

  To make this usable rather than merely provocative, I am asking you to use a specific diagnostic this weekend. Call it the **Subtraction Test**.

  The test is simple. Take the system you are studying. Strip away layers of its environment one at a time. Record two things: first, how much competence disappears with each layer; second, who, if anyone, is left doing the inheriting.

  If you strip away the cultural tools and the competence vanishes, you are looking at Gregorian dependence. If you strip away the reinforcement history and the behavior stops, you are looking at Skinnerian shaping. If you strip away the environment and the system can still simulate outcomes internally before acting, you have Popperian architecture. The test forces you to locate the competence, not just admire the performance.

  Let's apply this once, briefly, to the case everyone is thinking about: large language models.

  Currently, many engineers argue these models are Gregorian because they speak our language. But apply the Subtraction Test. Strip away the pre-training—the terabytes of human text, the cultural scaffolding uploaded into the weights. What is left? A randomly initialized network. It cannot speak. It cannot reason. It has no hypotheses to test.

  Now, strip a human child of their culture. Put them in isolation. They lose language, yes. But do they lose the ability to learn from reinforcement? Do they lose the ability to simulate simple cause and effect? Usually, no. The human retains the Popperian and Skinnerian rungs even when the Gregorian scaffolding is removed. The model does not. The model's competence is not inherited in the sense that the creature *takes it up*; the competence is frozen into the weights by the designer. The model is not standing on the shoulders of giants; it is a cast of the shoulders themselves.

  This does not mean the model is useless. It means the ladder might not have a slot for it. It might be a new kind of thing entirely: a system whose scaffolding is entirely supplied by others, with no sense in which it ever takes it up as its own. No benchmark will settle this, because benchmarks measure performance. Only the Subtraction Test measures locus.

  So, here is my charge for the weekend. Do not try to agree on where a system belongs on the ladder. Agree on how to test where the competence is stored. When you argue—and you must argue—argue about which layer you are subtracting. Argue about who is left holding the bag.

  If you leave this room feeling slightly uncomfortable, good. That means you are looking at the architecture, not just the output. If the psychologists feel the machines are being over-ranked, use the test to show where the dependence lies. If the engineers feel the animals are being under-ranked, use the test to show where the internal simulation lives.

  We are not here to polish the ladder. We are here to see if it still holds weight. Let's get to work.

