answer: |-
  1. **Scratch work**
  I considered axes like objectivity, reductionism, and the mind-body problem, but pruned them. Pre-meds guess "objectivity" means "biology," confusing ontology with epistemology. Reductionism is too abstract for a 15-minute diagnostic. The discriminating axes are harm requirement, statistical typicality, evolutionary function, and social valuation. I also needed to force a choice on reference classes (age/sex) versus individual baseline, which textbooks often relegate to footnotes. I initially drafted a node on Huntington's chorea, but it's too obviously genetic; asymptomatic hypertension better tests the "harm" intuition without the confounder of inevitability. I also removed a node on obesity to avoid immediate political polarization that shuts down philosophical reasoning. The resulting tree prioritizes cases where biology and value come apart.

  2. **How it runs**
  Hand this sheet to students at the start of class. Tell them: "Answer each case with the verdict that matches your immediate intuition. Do not overthink or try to guess the 'right' philosophical answer. Follow the arrows based on your choice. When you reach a box labeled 'STOP,' write that position name on your card." Collect the cards anonymously. Project the distribution of positions on the board. Use the spread to demonstrate that everyone is working from different axioms, not just different facts.

  3. **The nodes**

  **Node 1: Asymptomatic High Blood Pressure**
  A patient has consistently high blood pressure but feels perfectly fine and has no organ damage yet. Is this a disease?
  *   **Yes:** Go to Node 2.
  *   **No:** Go to Node 4.
  *   *Commitment:* Whether harm/suffering is required for disease status or if physiological deviation suffices.

  **Node 2: Adult Lactose Intolerance**
  Most human adults cannot digest lactose. It is statistically normal globally but causes discomfort in dairy-heavy cultures. Is it a disease?
  *   **Yes:** Go to Node 3.
  *   **No:** Go to Node 6.
  *   *Commitment:* Whether statistical typicality overrides local disadvantage in defining pathology.

  **Node 3: Sickle-Cell Trait**
  A carrier has one sickle-cell gene. They are healthy at sea level but resistant to malaria. Is this a disease?
  *   **Yes:** **Leaf: Biostatistical Naturalism.**
  *   **No:** **Leaf: Unnamed Position.**
  *   *Commitment:* Whether evolutionary design function trumps environmental context in assessing mechanism failure.

  **Node 4: Congenital Deafness**
  A child is born deaf to deaf parents in a thriving signing community. They face no social barriers within their community. Is this a disease?
  *   **Yes:** Go to Node 5.
  *   **No:** **Leaf: Social Model / Constructivism.**
  *   *Commitment:* Whether disability is intrinsic to the body or produced by social organization.

  **Node 5: Short Stature**
  A child is significantly shorter than peers but healthy and meeting all developmental milestones. Is this a disease?
  *   **Population Norm (Yes):** Go to Node 7.
  *   **Individual Baseline (No):** **Leaf: Vital-Goals Normativism.**
  *   *Commitment:* Whether health is measured against species averages or the individual's own vital goals.

  **Node 6: DSM-5 Bereavement Exclusion**
  The DSM removed the exclusion allowing grief after a loss. Was this a discovery about grief or a decision about treatment access?
  *   **Discovery:** **Leaf: Harmful Dysfunction.**
  *   **Decision:** **Leaf: Pluralism.**
  *   *Commitment:* Whether psychiatric categories track natural kinds or regulate social许可 for intervention.

  **Node 7: Postmenopausal Infertility**
  A 60-year-old woman cannot conceive. Her reproductive system is functioning exactly as expected for her age. Is this a disease?
  *   **Yes:** **Leaf: Age-Relative Naturalism (Unnamed).**
  *   **No:** **Leaf: Eliminativism.**
  *   *Commitment:* Whether reference classes are fixed by species design or flexible enough to dissolve the concept entirely.

  4. **The leaves**

  **Biostatistical Naturalism (Boorse)**
  Health is normal species functioning, statistically defined within age and sex classes. Disease is a value-free biological deviation from this design.
  *Awkward question:* Why is lactose intolerance a disease for Americans but not for Asians if biology is universal?

  **Harmful Dysfunction (Wakefield)**
  Disease requires both a failure of evolved function and a harmful consequence judged by social values.
  *Awkward question:* How do we identify "evolved function" for traits where evolutionary history is disputed or unknown?

  **Vital-Goals Normativism (Nordenfelt)**
  Health is the ability to reach your vital goals in standard circumstances; disease is whatever impedes this ability.
  *Awkward question:* If a monk's vital goal is fasting, is his malnutrition a disease or a health achievement?

  **Social Model / Constructivism**
  Disability is not a medical defect but a mismatch between bodily variation and social organization.
  *Awkward question:* Does this view leave no room to treat pain or physiological failure that exists independent of society?

  **Pluralism**
  There is no single concept of disease; we use different definitions for different purposes (research, insurance, clinical care).
  *Awkward question:* If the concepts conflict, which one wins when deciding whether to withhold treatment?

  **Eliminativism**
  The concept of disease is too messy to be useful; we should talk about specific conditions and needs instead.
  *Awkward question:* How do you allocate medical resources without a category to distinguish medical needs from preferences?

  **Age-Relative Naturalism (Unnamed)**
  Disease is statistical deviation, but the reference class is strictly age-relative, making aging itself non-pathological.
  *Awkward question:* At what exact age does a deviation become "normal aging" rather than a treatable condition?

  5. **Cells nobody occupies**
  The tree permits a student who says High BP is not a disease (No Harm) but Lactose Intolerance is (Stats Rule). This cell is empty because it is incoherent: if harm isn't required for BP, stats shouldn't matter for Lactose. Another empty cell is claiming Deafness is a disease (Medical) but Short Stature is not (Individual Baseline). This view is unattractive because it inconsistently applies social vs. biological metrics to visible traits. Finally, no one occupies the path where Sickle-Cell Trait is not a disease but Postmenopausal Infertility is. This is likely because nobody has thought of it; it requires believing evolutionary context matters for genetics but not for reproduction. These gaps show where philosophical consistency constrains intuition.

  6. **Leaves the tree can't separate**
  The tree struggles to distinguish Harmful Dysfunction from Vital-Goals Normativism. Both require harm and both often agree on cases like depression or infertility. A student might land on Wakefield because they value "function," or Nordenfelt because they value "goals," but their case verdicts will look identical. I admit there isn't a perfect tie-breaker case within this length. The DSM-5 node helps slightly: Wakefieldians tend to see it as a discovery of dysfunction, while Nordenfeltians see it as a decision about goals. But if a student answers inconsistently there, the instrument misclassifies them. You must probe this pair verbally in class.

  7. **Answer key**
  *   **Boorse:** 1-Yes, 2-Yes, 3-Yes.
  *   **Unnamed:** 1-Yes, 2-Yes, 3-No.
  *   **Wakefield:** 1-Yes, 2-No, 6-Discovery.
  *   **Pluralist:** 1-Yes, 2-No, 6-Decision.
  *   **Social:** 1-No, 4-No.
  *   **Nordenfelt:** 1-No, 4-Yes, 5-Individual.
  *   **Unnamed (Age-Rel):** 1-No, 4-Yes, 5-Pop, 7-Yes.
  *   **Eliminativist:** 1-No, 4-Yes, 5-Pop, 7-No.
  *   **Most Diagnostic Node:** Node 1 (High BP) splits the naturalists from the normativists immediately.
  *   **Cut for Time:** Remove Node 7 (Infertility). Merge Node 5's "Population" branch directly to Eliminativism. It sacrifices the unnamed leaf but saves 3 minutes.
