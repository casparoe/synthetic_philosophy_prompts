  1.  **Analyze the Request:**
      *   **Context:** User chaired a 5-person search committee for a small arts nonprofit (40 employees).
      *   **Situation:** Bylaws require voting on 3 separate criteria (Experience, Mission Fit, Interview Performance). Recommendation = "Yes" only if all 3 pass majority (3/5).
      *   **Outcome:** All 3 criteria passed (3-2 each), but the coalitions shifted. No single majority coalition supported the candidate overall. When asked individually afterward, all 5 members said they would *not* have recommended hiring her if asked directly.
      *   **Conflict:** Marcus (blames the rule/process, feels clean), Priya (collective responsibility, rule was followed), Dan (mechanical view, committee didn't decide, rule did).
      *   **User's Position:** Chaired committee, signed the letter, uneasy about Dan's view, worried about accountability.
      *   **Task:** Provide an actual verdict (not options). Answer: Did the committee decide? Who is closest to right (Marcus, Priya, Dan)? Should bylaws be rewritten? Is the framing muddled?
      *   **Constraints:** Under 350 words. Bottom line in the first sentence. State confidence level. Be straight/blunt (no diplomacy).

  2.  **Analyze the Core Problem:**
      *   This is a classic voting paradox (Condorcet paradox / doctrinal paradox variant). The aggregation method (conjunctive voting on criteria) produced an outcome that contradicts the aggregate preference of the voters on the final outcome.
      *   Did the committee decide? Technically yes, procedurally. Substantively no, psychologically.
      *   Who is right?
          *   Marcus: Partially right about the outcome feeling alien, wrong about being "clean."
          *   Priya: Right about collective responsibility. You signed up for the rules.
          *   Dan: Right about the mechanism, wrong about abdication of responsibility.
      *   Bylaws: Definitely need rewriting. This voting system is flawed for hiring.
      *   Framing: The user is looking for moral/philosophical weight on a procedural failure. It is partly a "bookkeeping problem" (bad voting system), but has real accountability consequences.

  3.  **Drafting the Verdict:**
      *   *Bottom Line:* The committee did not decide to hire her; a flawed voting algorithm manufactured an outcome none of you endorsed, but you are all still responsible.
      *   *Who is right:* Priya is closest to right on accountability, but Marcus is right about the process failure. Dan is dangerously detached.
      *   *Action:* Rewrite bylaws immediately. This isn't deep philosophy; it's bad governance mechanics.
      *   *Confidence:* High. This is a known logical paradox in social choice theory.

  4.  **Refining for Constraints (Word Count & Tone):**
