answer: |-
  **Exam Question: Animals, Evidence and Policy (Year 3)**
  **Time Allowed: 45 Minutes**
  **Closed Book**

  **Question 1**
  Consider the following 'Scale Argument': Given a global wild insect population of approximately 10^18 individuals, even a tiny per-individual credence *p* that insects are sentient yields an expected moral value that dwarfs almost any other human concern. You are evaluating an orchard spray programme that reduces this population, though the net welfare effect (whether lives prevented were net positive or net negative) is unknown in sign.

  Two objections are raised:
  **Objection A:** The per-individual credence *p* is so small that no plausible population size rescues the conclusion; 10^18 × *p* remains negligible.
  **Objection B:** Insect lives are so brief, and so dominated by death in the egg or early larval stage, that their welfare contribution would be negligible even if they were sentient.

  Write an essay addressing the following:
  1.  Argue decisively which objection (A or B) does more damage to the Scale Argument's claim of overwhelming moral importance.
  2.  Suppose *p* is not independent per individual but 'cluster-level' (either the whole taxon is sentient or none are). Explain how this alters the expected-value calculation compared to the independent model.
  3.  Explain why establishing that insect welfare matters in the aggregate does not settle whether the spray programme is permissible, given the unknown welfare sign.

  ***

  **Model Answer**

  Objection B does significantly more damage to the Scale Argument than Objection A. While Objection A challenges the epistemic probability of sentience, Objection B challenges the axiological magnitude of the experience itself. Even if we grant a non-zero credence *p* that insects are sentient, Objection B asserts that the 'moral weight' per individual is near zero because the duration of conscious life is minimal and the majority of existence is spent in non-sentient stages (eggs) or immediate death. A massive number of near-zero values still sums to near zero. Objection A, conversely, relies on *p* being infinitesimal. However, given the phylogenetic continuity between insects and vertebrates, assigning *p* a value low enough to negate 10^18 is arguably more arbitrary than accepting brief welfare durations. Therefore, the uncertainty regarding the *quality* and *duration* of experience (B) undermines the calculation more fundamentally than the uncertainty regarding the *presence* of experience (A).

  Regarding the cluster-level probability, shifting from independent per-individual credence to taxon-wide sentience changes the variance of the outcome but not necessarily the expected value. In the independent model, we are confident some insects are sentient, but unsure which ones. In the cluster model, there is a small chance all 10^18 are sentient and a large chance none are. Mathematically, the expected value (Probability × Population × Welfare) remains similar if the aggregate probability is held constant. However, this changes the decision-theoretic picture. The independent model suggests a smooth distribution of moral harm across any action killing insects. The cluster model introduces binary risk: either we are committing mass moral catastrophe or no moral harm at all. This complicates the scale argument by making it a high-stakes gamble rather than a certainty of diffuse harm, potentially requiring risk-averse strategies rather than simple expected-value maximization. It is a complication, not a fatal flaw, provided the non-zero probability of the 'all sentient' cluster remains.

  Finally, establishing aggregate moral importance does not determine the permissibility of the spray programme because the sign of the welfare effect is unknown. The Scale Argument establishes that insects matter, but not whether their lives are worth living. If the wild insect life is net negative (dominated by suffering, starvation, and predation), then reducing the population via spray prevents suffering and is morally good. If their lives are net positive, the spray is morally bad. Without knowing the sign, the magnitude of the population is irrelevant to the direction of the moral obligation. We cannot derive an 'ought' from the scale alone. Consequently, even if the Scale Argument succeeds in proving insects are morally considerable, it fails to prescribe a specific policy action regarding the spray. The argument proves the stakes are high, but not which side of the bet we are on. Therefore, the student of policy must conclude that while insect welfare may dwarf human concerns in magnitude, the uncertainty of welfare sign renders the spray programme ethically undecidable on these grounds alone.

  ***

  **Marking Scheme (Total: 20 Marks)**

  1.  **Verdict on Objections (4 marks):** Clearly states whether A or B is stronger.
      *   *Common Error:* Refusing to choose or claiming they are equally damaging without justification.
  2.  **Analysis of Objection A (Probability) (4 marks):** Explains why *p* being small might still yield large expected value given 10^18.
      *   *Common Error:* Treating the population size as settling the moral question by itself without referencing *p*.
  3.  **Analysis of Objection B (Welfare Magnitude) (4 marks):** Explains how brief duration/negative welfare undermines the aggregate sum.
      *   *Common Error:* Confusing sentience probability with welfare intensity.
  4.  **Cluster-Level Probability (4 marks):** Identifies that expected value may stay similar but variance/risk profile changes.
      *   *Common Error:* Assuming that independence of the probabilities is harmless or that cluster-level eliminates expected value.
  5.  **Intervention Sign/Uncertainty (4 marks):** Explains that magnitude does not dictate direction (killings could be beneficial).
      *   *Common Error:* Sliding from expected moral importance to expected net benefit of spraying without addressing the sign unknown.

  **Differentiation:**
  A competent answer (12-15 marks) will address all three parts of the question correctly but may treat them as separate silos. A first-class answer (17-20 marks) will integrate the points, specifically using the 'unknown sign' problem to show why the 'cluster-level' risk assessment matters less than the fundamental inability to determine if killing is harm or benefit. First-class answers will also commit decisively to the verdict on A vs. B rather than hedging.

  ***

  **Note to Markers**
  The model answer commits to Objection B being stronger and treats cluster-level probability as a complication rather than a refutation. Disagreement with these substantive positions is legitimate provided the reasoning is sound. However, marks should be deducted if students fail to recognize that expected value depends on both probability and magnitude, or if they assume the scale argument automatically prescribes reducing insect numbers.
