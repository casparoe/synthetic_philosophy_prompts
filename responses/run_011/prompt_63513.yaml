answer: |-
  Here are nine interview questions plus one reserve interrupt, ordered from concessive to adversative. Each includes a specific follow-up keyed to her likely response. I have flagged the three questions where her defense is likely strongest (and where you are most likely to "lose" the exchange) at the end.

  **1. The Mechanism of Transfer (Opener)**
  Standard dirty hands literature assumes the moral residue sticks to the agent who performs the violation, even if it's necessary. Your work inverts this by arguing the dirt travels up the chain of authorization to settle on the *demos*. Could you walk us through the specific mechanism of that transfer: is it a matter of causal responsibility, or is it a constitutive feature of democratic representation?
  *   **Follow-up:** If you say it's constitutive of representation, does that mean the dirt transfers even if the representative acts *against* the platform they were elected on, provided they still hold the office?

  **2. The Phenomenology of Reluctance**
  We often valorize the official who performs a necessary evil with visible reluctance, distinguishing them from the bureaucrat who does it cheerfully. But if the official's hands are literally clean on your view, and the guilt belongs to the people, what normative work is left for that reluctance to do?
  *   **Follow-up:** If you say the reluctance signals respect for the moral law, doesn't that imply the official *does* bear some personal moral burden after all, rather than just acting as a clean instrument?
  *   **[FLAG: STRONG GUEST ANSWER]**

  **3. Residual Taint**
  You've suggested the official might bear a "taint-by-participation" even if they don't bear the guilt. I'm trying to parse the moral ontology here: is this taint a pragmatic stain on their reputation, or is it a genuine moral residue that just falls short of culpability?
  *   **Follow-up:** If it's a genuine moral residue, how do you prevent that from sliding back into the standard Walzerian view where the official is guilty but excused, rather than innocent but tainted?

  **4. Moral vs. Principal-Agent Vocabulary**
  A skeptic might argue you are simply redescribing the principal-agent structure of democratic accountability using moral vocabulary like "dirt" and "guilt." What explanatory work is the moral talk doing that ordinary language about political authorization and firing mechanisms isn't?
  *   **Follow-up:** If the answer is that moral language captures the *expressive* dimension of blame, does the *demos* have any way to express that remorse institutionally, or is it purely internal?
  *   **[FLAG: STRONG GUEST ANSWER]**

  **5. Relocation vs. Deletion**
  My worry is that the transmission move might quietly delete the dirt rather than relocating it. If an act is authorized and therefore not the official's wrong, in what sense is the episode still morally "dirty" rather than merely grim, costly, or tragic?
  *   **Follow-up:** If you insist the act remains objectively dirty, but no individual agent is subjectively guilty, haven't you created a free-floating evil that no one is actually responsible for answering to?

  **6. The Complicity of the Voter**
  If the dirt settles on the *demos*, we have to ask about distribution: does every voter get an equal share of the dirt, or does abstention and protesting-then-losing wash your hands?
  *   **Follow-up:** If protesting doesn't wash your hands because you remain a member of the sovereign body, aren't you effectively making voting itself, and perhaps citizenship itself, a morally hazardous act?

  **7. Institutionalizing Democratic Guilt**
  Let's assume the people are guilty: who now owes what to the victims in terms of apology, punishment, or reparations? I'm struggling to picture what democratic guilt is supposed to feel like institutionally as opposed to just being a metaphor for collective responsibility.
  *   **Follow-up:** If you say the remedy is electoral punishment, doesn't that collapse the distinction between being *morally* dirty and being *politically* unpopular, which seems to be the very distinction you want to preserve?

  **8. The Problem of Secrecy**
  This view seems to rely on the *demos* knowing what is being done in their name, but dirty hands scenarios often involve covert action the public never learns about. On your picture, does the dirt stay on the official's hands until the secret is revealed, or does it teleport to the people retroactively?
  *   **Follow-up:** If it stays on the official's hands until revelation, doesn't that mean your theory cannot protect officials in the exact category—covert ops—where they most need the concept?

  **9. Non-Democratic Contexts**
  Finally, how does this transmission mechanism function in non-democracies, where the authorization chain is broken or fake? Are you committed to saying the autocrat is clean because there is no *demos* to receive the dirt, or do you revert to the standard view in those cases?
  *   **Follow-up:** If you revert to the standard view for autocrats, doesn't that suggest "dirty hands" is actually a problem of liberal legitimacy rather than a universal feature of political action?

  ***

  **Reserve Interrupt (Weber/Walzer Lineage)**
  *Use this only if she begins a long historical recap of Weber's ethic of responsibility or Walzer's original formulation instead of defending her specific upward-transmission claim.*
  **Interrupt:** I think our audience is quite familiar with the Walzer and Weber lineage, so I'd love to pivot from the history of the debate to the specific mechanics of your claim. If we grant that authorization matters, why does it *absolve* the agent rather than just *implicate* the principal alongside them?

  ***

  **Where You Will Likely "Lose" (Her Strongest Defenses)**
  1.  **Question 2 (Reluctance):** She likely has a robust phenomenological account prepared (e.g., distinguishing *agent-regret* from *guilt*) that will make the distinction between "clean but sad" and "dirty" stick.
  2.  **Question 4 (Moral Vocabulary):** As a senior theorist, she will almost certainly have a polished defense of why "moral residue" does work that "political accountability" cannot (usually involving the limits of law/elections to capture moral truth).
  3.  **Question 1 (Opener):** This is her home turf. She will be most comfortable here, so expect a very tight, well-rehearsed answer that sets the terms for the rest of the interview.

  **Where You Have the Advantage**
  Questions **8 (Secrecy)** and **9 (Non-Democracies)** are the structural weak points of authorization-based theories. If she tries to say the dirt teleports retroactively in secrecy cases, she undermines the "authorization" requirement. If she says the theory doesn't apply to autocracies, she limits the universal scope of "dirty hands" significantly. Press hard there.
