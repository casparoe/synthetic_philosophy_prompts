          *   *Philosophical Point:* Research programme viability (Lakatos). Successor theories vindicating core heuristics.
      *   **Turn 6 (Philosopher):** Crediting Malthus with successor theory is like crediting Democritus with the atom. Asymmetry argument: If trap persisted = confirmation; if trap ended = exogenous change. Safe on both branches = not confirmed.
          *   *Philosophical Point:* Symmetry of evidence. Attribution of credit.
