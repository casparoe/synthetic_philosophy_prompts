      *   **Turn 3 (Historian):** Misreads the model. Technology is exogenous. It's a conditional statement (if subsistence arithmetic, population geometric). Industrial tech changed the input, not the law. Comparative statics.
          *   *Fact Check:* Malthus did treat land/tech constraints seriously, but did he view tech as purely exogenous? He acknowledged improvements but doubted their permanence relative to population.
          *   *Philosophical Point:* Ceteris paribus clauses. Is shifting the curve falsification?
      *   **Turn 4 (Philosopher):** This is where content drains. Malthus patched the theory (1st ed: vice; 1803 ed: moral restraint). Now it's unfalsifiable (if misery, check 1; if not, check 2). Analogy to climate models adding offsets.
