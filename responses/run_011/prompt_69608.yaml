answer: |-
  You did not lose this argument; you fought a category war against someone holding the dictionary.

  Your roommate is making a classic move in behavioral economics: he is taking a **descriptive model** (how people *do* behave) and using it to dissolve a **normative concept** (how people *should* behave or what counts as rational agency).

  Here is the breakdown of where his logic holds, where it smuggles in assumptions, and how the specific points you raised actually survive his attack if you adjust the framing.

  ### 1. The Smuggling: From "Hyperbolic Discounting" to "No Akrasia"

  You asked whether the slide from "hyperbolic discounting is a decent descriptive model" to "therefore there's no such thing as acting against your better judgment" is valid.

  **It is not valid.** It contains a smuggled premise.

  *   **The Descriptive Claim:** Hyperbolic discounting models show that humans value immediate rewards disproportionately higher than delayed rewards, leading to time-inconsistent preferences (Preferring A over B at $t_1$, but B over A at $t_2$).
  *   **The Normative Claim:** Akrasia (weakness of will) is acting against one's better judgment.
  *   **The Smuggled Premise:** *Revealed Preference Theory is ontologically exhaustive.*

  **Where the smuggling happens:**
  Your roommate is treating **Revealed Preference** (the economic axiom that "choice reveals preference") as a metaphysical truth about human psychology rather than a methodological tool for modeling markets.

  In economics, we *define* preference as choice to make the math solvable. If you choose the pizza, you *defined* as preferring the pizza. But in philosophy and psychology, "preference" and "judgment" are distinct from "action."
  *   **The Smuggle:** He moves from "We can *model* this choice as a preference reversal" to "There is *nothing else* occurring but a preference reversal."

  By defining preference *as* choice, he makes it impossible by definition to choose against your preference. But akrasia isn't about choosing against your *preference* (in the econ sense); it's about choosing against your *evaluative judgment*. Hyperbolic discounting explains the *mechanism* of the failure (the weight of the immediate reward spikes), but it does not explain away the *failure* itself.

  **Analogy:** If a bridge collapses because of a specific resonance frequency in the wind, we have a descriptive model of the collapse. That does not mean "the bridge failing to stand" didn't happen. It just means we know *why* it failed. Hyperbolic discounting explains *why* the will weakened; it doesn't prove the will was never there to begin with.

  ### 2. All-Things-Considered (ATC) Judgment: Real Distinction or Relabeled Desire?

  You asked if the ATC distinction does real work or if it's just relabeled desire.

  **Honest Answer:** Within your roommate's economic framework, it **is** just relabeled desire. Within a philosophical framework of agency, it is **not**.

  Your roommate is operating under a **Humean Theory of Motivation**: Reason is, and ought only to be, the slave of the passions. In this view, a "judgment" is just the sum total of your current desire-weights. If the pizza desire outweighs the gym desire at 6 PM, your "judgment" *is* pizza.

  However, the philosophical defense of akrasia (championed by people like Donald Davidson) relies on the idea that humans have a faculty of **evaluative reasoning** that is distinct from **motivational strength**.
  *   **Desire:** "I want to eat this." (Motivational force)
  *   **ATC Judgment:** "Eating this is worse for my goals than going to the gym." (Evaluative standard)

  **Does the distinction do work?**
  Yes, but only if you reject the Revealed Preference axiom. The distinction allows us to say: "At 6 PM, the *motivational force* of the pizza was higher, but the *evaluative judgment* remained with the gym."

  If you accept your roommate's definition, you are a behaviorist: you are what you do.
  If you reject it, you are an intentional agent: you are what you endorse, even if you fail to act on it.

  **Why his "Regret" argument fails:**
  He said regret is just weights shifting back. This ignores the *content* of the regret.
  *   If I change my mind about soup vs. salad, I don't feel regret; I feel indifference.
  *   If I skip the gym, I feel *guilt* or *shame*.
  This suggests I am not just observing a preference change; I am holding my action against a **stable standard** that persisted through the preference shift. The existence of stable standards over time is what makes akrasia possible. If preferences were all that existed, regret would be as nonsensical as regretting that you preferred vanilla yesterday but chocolate today.

  ### 3. Naive vs. Sophisticated Agents (The Beta-Delta Model)

  This is actually where your roommate's argument shoots itself in the foot.

  In the O'Donoghue & Rabin models (standard behavioral econ):
  *   **Naive Agent:** Believes future preferences will match current ones. (Thinks "I'll go to the gym tomorrow" but doesn't).
  *   **Sophisticated Agent:** Knows future preferences will change. (Knows "I will want pizza tomorrow").

  **Does this rescue the idea of a self being wrong?**
  Yes. Specifically, it rescues the authority of the **Earlier Self ($t_1$)**.

  **The Smoking Gun: Commitment Devices**
  A "Sophisticated" agent, knowing they will succumb to hyperbolic discounting at $t_2$, will often employ a **commitment device** at $t_1$.
  *   *Example:* I pay a non-refundable fee to a personal trainer now so that I am forced to go later.
  *   *The Implication:* Why would I do this? Because my $t_1$ self judges that my $t_2$ preferences are **defective**.

  If your roommate were right—that the $t_2$ choice (pizza) is just as valid as the $t_1$ choice (gym) because it reflects the "true preference at that time"—then **commitment devices would be irrational.** Why restrict your future freedom if your future choice is just as sovereign as your current plan?

  The fact that the model treats commitment as *rational* for a sophisticated agent admits that the $t_1$ self has normative authority over the $t_2$ self. It admits that the $t_2$ self is prone to error (or "bias," which is just a polite word for weakness).

  **Regarding your worry:** *"A sophisticated agent who still puts the pizza first seems like he's endorsing it fully."*
  Not necessarily. A sophisticated agent might eat the pizza *knowing* it is a failure of their plan. The model distinguishes between **utility** (what I get from the pizza) and **welfare** (what is good for me over time). The sophisticated agent maximizes welfare by restricting choice. If they fail to restrict choice and eat the pizza, the model registers this as a **welfare loss**, not a neutral preference satisfaction.

  ### Summary of the Verdict

  1.  **The Smuggling:** Your roommate smuggled **Revealed Preference Theory** (a methodological rule for economists) into **Ontology** (a truth about human nature). He defined "preference" as "choice" to make the problem disappear. That is a linguistic trick, not a solution.
  2.  **ATC Judgment:** It is only "relabeled desire" if you accept his Humean/Behaviorist axiom. If you believe humans can hold values that contradict their immediate urges (which the phenomenon of regret suggests we do), then ATC judgment is a distinct faculty.
  3.  **Naive/Sophisticated:** This distinction actually **supports** the existence of akrasia. The "Sophisticated" agent admits their future self is unreliable and tries to bind it. This proves the model itself recognizes a gap between "what is best for the agent" and "what the agent will choose."

  **How to reply to him:**
  "Hyperbolic discounting explains the *mechanics* of the preference reversal, but it doesn't dissolve the *normativity* of the judgment. If my earlier self can rationally bind my later self via commitment devices (as your sophisticated agent does), then my earlier judgment has authority over my later choice. If the later choice has less authority, then acting against the earlier judgment *is* a form of error, regardless of the discounting curve. You've explained *how* I fail, not proved that I didn't."

  You didn't lose. You were arguing about *agency*; he was arguing about *accounting*.
