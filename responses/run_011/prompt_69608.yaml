prompt: |-
  ok so I just spent close to two hours arguing with my roommate and I think I lost, but I'm not convinced he actually won. He's an econ PhD student and his position is basically that hyperbolic discounting has already settled the old weakness-of-will debate, and the answer is that weakness of will doesn't exist. His argument: when I choose the leftover pizza over the gym, at the moment of choice the immediate reward gets way more weight, so the pizza genuinely IS what I prefer right then. And since preferences just are whatever you reveal by choosing, there's no gap left between "what I judged best" and "what I did" for a philosopher to point at. So the akratic guy isn't acting against his better judgment, he just has a different judgment at 6pm than he had at 9am, and calling that incontinence is a category error. He said people still writing about akrasia are refusing to update on the empirical literature, and honestly that stung because I don't read the empirical literature.

  My counters both collapsed. First I tried the all-things-considered judgment thing — I remember reading somewhere that the philosophical puzzle is specifically about acting against a judgment that already takes everything into account, not against a bare urge, and I figured that distinction would survive his argument untouched. He said fine, but then what IS that judgment made of, if not a ranking of desires, and if it's made of desires it's just another competitor in the same economy with no special authority. Then I tried second-order desires, like "I want to want to go to the gym," and he said that's either an infinite regress or it's just a desire about a desire that can also lose, which is exactly what happened tonight. The part I really had no answer for: I said but I feel bad about skipping the gym in a way I don't feel bad about changing my mind what to eat, and he said regret is evidence FOR him, not against — regret is just the weights shifting back once the pizza is gone, so my later self disapproving is the same phenomenon as my earlier self approving, not a proof that one of them was tracking something true.

  Can you sort this out for me? Specifically I want to know whether the slide from "hyperbolic discounting is a decent descriptive model of how people weight delays" to "therefore there's no such thing as acting against your better judgment" is actually valid, or whether he's smuggling in a definitional version of revealed preference to do the work — and if it's smuggling, show me exactly which step needs it. Also whether the all-things-considered judgment distinction does any real work here or whether it's just relabeled desire, and if it's relabeled desire say so, I'd rather be corrected than have my side defended. One more thing: he mentioned at some point that in the beta-delta version of this stuff you distinguish naive from sophisticated agents, and that only the naive ones actually procrastinate — I want to know whether that distinction rescues the idea of a self that can be wrong about its own future choices, or whether it makes things worse for me, since a sophisticated agent who still puts the pizza first seems like he's endorsing it fully.
