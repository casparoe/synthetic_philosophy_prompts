          *   P1 says "imposes no uncompensated costs on third parties."
          *   Is "corruption of social meaning" a cost on third parties?
          *   If yes, P1 allows P4.
          *   If no, P1 forbids P4.
          *   P1 needs to explicitly recognize "expressive externalities" as "costs."
          *   This is a revision to P1.

      *   *Decision:* The P4/P7 tension is the most severe because it undermines the *mechanism* of the argument. The P1/P4 tension is structural but fixable by definition. The P2/P6 tension is terminological.
      *   I will rank P4/P7 as Severity 1.
      *   I will recommend revising P4 to limit its scope to *constitutive* goods, distinguishing them from the *instrumental* goods in P7.
      *   Wait, the "Single Revision" instruction asks for *the* revision that restores the *most* coherence.
      *   If I fix P4/P7, do I fix P1/P4?
      *   If P4 is scoped to constitutive goods, P1 (which is general) still needs to allow for that scope.
      *   Actually, revising P1 to include "expressive externalities" covers P4. But it doesn't solve P7 (why water isn't one).
      *   Revising P4 to explain *why* kidneys differ from water solves P7 and clarifies P1's application.
      *   So Revising P4 is the high-leverage move.

      *   *Wait, one nuance on P6:* "I regard that arrangement as a genuine improvement... and would not oppose it."
      *   P2: "I support the prohibition."
      *   If P6 is implemented, P2 is no longer supported.
      *   P2 should be "I support the prohibition on *open markets*."
      *   This is a low-cost revision.

      *   *Final Plan:*
          1.  Confirm framing is appropriate.
          2.  Identify Apparent Tensions (P1/P5, P3/P4).
          3.  Identify Genuine Tensions (P4/P7, P2/P6, P1/P4).
