      *   **Tone:** Professional, nuanced, authoritative but accessible (suitable for a journalist), critical but fair.
      *   **Key Constraint:** The user needs to defend what they print to a hostile, knowledgeable reader. Accuracy on the philosophy is paramount.

  2.  **Deconstruct the Source Text (The Writer's Argument):**
