      *   *Claim 2:* Individual acts (flight, burger) don't change outcomes (2 tonnes vs. 40 billion; chicken threshold).
      *   *Claim 3:* Therefore, individual acts can't be wrong (Wrongness = making things worse).
      *   *Claim 4:* Oil companies pushed carbon footprints to shift blame.
