      *   *Correction:* On the chicken argument, be precise. It's not that one burger *never* kills a chicken; it's that the *probability* is low, but the *expected value* is 1/n of a chicken. The writer claims the threshold is a "fiction." Philosophers say the threshold is real but opaque.
      *   *Correction:* On the BP fact. It was indeed BP, but don't get bogged down in history, focus on the ethical implication.
      *   *Term Check:* The editor mentioned "inefficacy something-or-other." It's "The Inefficacy Objection" or "The Problem of Imperceptible Differences." Mark Budolfson is the key name here.

  7.  **Final Polish:** Ensure the tone is helpful to a journalist (clear headings, actionable takeaways) but rigorous enough to satisfy an ethicist. (Check against the prompt's requirement: "tell me what an ethicist... would sign off on, what they'd wince at, and what is straightforwardly wrong.")

