answer: |-
  Headmistress, faculty, parents, and the thirty-one leavers of this year's cohort.

  Six years ago, the Headmistress wrote to me after reading an essay I had published. She did not write to congratulate me on the outcome. She wrote to ask how I had arrived there. That distinction is the reason I am standing here, and it is the reason I cannot tell you what you most want to know. The faculty have asked me to say what became of us, the graduates of this experiment. The parents, who funded this gamble, deserve to know if the investment held. But the Headmistress has asked me not to deliver a results report, on the ground that a person is not the sum of what they produce. She is right, and so I cannot answer the question with the only evidence that would satisfy it. There is no register of where we went. There are no tables of salaries, or universities, or titles. That absence is not an oversight. It is the architecture of the place.

  For twenty-two years, you received the three-part page. The Record of what was done. The Reading of why it was done. The Rule that barred the unwitnessed from the account. This method demanded honesty about the limits of supervision. It admitted that a teacher cannot see the private revision, the destroyed draft, the hour spent staring at a wall. But this virtue carries a cost we must name today. Under a rule which supervises only what can be witnessed, the pupils who looked best supervised may simply have been the most legible. The school may have spent twenty-two years rewarding the appearance of good process rather than the substance of it. I know this because I was one of those pupils. In my last year, I dropped a project. My teacher's Reading said I did so to avoid being seen failing. I rebutted it. She withdrew the line. The Record shows the work and the withdrawal, and no reason at all. In eighteen years, I have never been sure the withdrawal was correct. I have never told anyone here that it might not have been. I protected the legibility of my record rather than the truth of my process.

  This is the hazard of legibility. It tempts us to perform our work for the eye that watches us. When the watching stops, the performance often continues. You will leave this room on Friday. From Monday onward, no one writes your Record. No teacher offers a Reading. There is no right of rebuttal. The world outside will grade you relentlessly. It will rank you. It will predict you. You cannot survive being told that results do not matter, because rent and reputation depend on them. But you can survive knowing that the Record ended not because the work stopped, but because the witness left.

  This brings me to the missing register. The school refused to track our destinations on the explicit ground that tracking outcomes would quietly convert the Record into a ranking. Was this right? Was it courage, or was it a way of ensuring the claim could never be tested? I take the position that the Headmistress was right. If we had known that our destinations were being tabulated, the Record would have ceased to be an account of process and become a strategy for outcome. The honesty of the method depended on the irrelevance of the destination. To measure us would have been to change us. The lack of data is the only proof that the experiment remained pure. It means we do not know if we succeeded, but it ensures that what we did here was not done for the sake of success.

  I supervise the evaluation of large machine-learning systems, and I spend my time judging whether to value what a system produces or the steps it takes to produce them.

  You are now entering a world that demands outcomes but suspects process. You will feel a urge to make your process legible to an imagined audience. You will write drafts as if they are being read. You will work hours as if they are being logged. You will produce the appearance of good process for supervisors who do not exist. Do not do this. The removal of the supervising eye is not a loss of accountability; it is the return of your private life to your work. The hazard is not that you will stop working. The hazard is that you will work only to be seen working.

  When you sit down to begin a task, ask yourself: if no one could ever know I did this, would I still do it this way? If the answer is no, you are performing legibility. If the answer is yes, you are working. The school taught you to defend your Record against a false Reading. Your task now is to defend your Process against a false Audience. Do not write for the teacher who is no longer there. Do not destroy the work that cannot be shown. The unwitnessed hours are not barred from your life anymore. They are the only part that belongs entirely to you.

  We do not know what became of us. We do not know what will become of you. We know only that for four years, you were not ranked. You were read. You were allowed to rebut. You were permitted to be illegible. Carry that permission forward. Not as a shield against the world's grades, but as a license to ignore them when they demand you sell the process to pay for the outcome. The Record is closed. The work is not.
