      *   *Ethical Solution:* Same move. A right action *from* virtue is constitutively different from a right action *by accident*. The motive isn't just a tool; it's part of the action's identity.
      *   *The Cost:* You have to abandon Value Monism + Pure Instrumentalism. You become a Value Pluralist or a Constitutivist.
      *   *Regarding (2):* You can keep Veritism if you shift from "truth-conducive" to "truth-apt." But honestly, rejecting strict Veritism (e.g., valuing understanding) is less costly than the user thinks.
      *   *Conclusion:* The Value Problem remains, but it shifts from "How to add value?" to "What is the structure of value?"

  6.  **Refining the Argument (Self-Correction during drafting):**
