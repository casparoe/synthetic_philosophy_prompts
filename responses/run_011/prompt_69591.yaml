      *(Self-Correction on "The Break"):* Actually, the strongest move is to attack the *additivity* assumption hidden in (1). Swamping assumes Value(TB + P) = Value(TB) + Value(P). If value is non-additive (Gestalt/Constitutive), swamping fails. This works for both ethics and epistemology.

      *(Refining the Ethics Transfer):* If I solve it in epistemology via "Credit/Agency" (Sosa), does it solve ethics? Yes, it leads to Virtue Ethics. If I solve it via "Pluralism" (Lynch), does it solve ethics? Yes, Moral Pluralism. The transfer holds.

