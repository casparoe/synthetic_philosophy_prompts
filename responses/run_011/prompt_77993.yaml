answer: |-
  # Desiderata for an Account of Historical Contingency

  ## I. Phenomenal and Empirical Adequacy
  An adequate account must capture the intuitive usage of "contingency" in historical explanation while respecting the constraints of causal inference.

  1.  **Counterfactual Dependence:** The account must explicate the claim that *had X not occurred, Y would not have occurred* (or would have occurred differently), without reducing this to mere epistemic uncertainty. **[Non-Negotiable]**
  2.  **Veridical Triviality (The "Must-Get-Right" Case):** The account must validate at least one instance where a micro-scale perturbation causally determined a macro-scale outcome.
      *   *Candidate:* **The Mechelen Incident (January 1940).** A German liaison aircraft crashed in Belgium, compromising the original invasion plan (*Fall Gelb*). This forced the adoption of the Manstein Plan (*Sichelschnitt*), leading to the Fall of France. The crash was a trivial accident; the outcome was geopolitical transformation. The account must show how the causal chain remained un-damped. **[Non-Negotiable]**
  3.  **Spurious Triviality (The "Must-Reject" Case):** The account must invalidate instances where contingency is asserted but the evidence fails to distinguish the specific cause from structural background conditions.
      *   *Candidate:* **"If Hitler had been accepted to art school, the Holocaust would not have happened."** The evidence distinguishes nothing; psychological and structural antisemitism in Vienna and Germany provides a convergent causal basin regardless of Hitler's personal trajectory. To assert contingency here is to ignore the overdetermination of the outcome. **[Non-Negotiable]**
  4.  **Convergence:** The account must accommodate cases where distinct causal routes lead to functionally identical outcomes (e.g., the independent invention of agriculture or the state). **[Non-Negotiable]**

  ## II. Conceptual Distinctions
  The account must maintain specific logical separations to avoid category errors common in popular historiography.

  5.  **Nomological Determinism vs. Unpredictability:** The account must not equate contingency with unpredictability. A process can be deterministic (in principle) but contingent (dependent on specific initial conditions). Conversely, a process can be unpredictable (due to epistemic limits) but necessary (structurally determined). **[Non-Negotiable]**
  6.  **Sensitivity vs. Historical Importance:** The account must distinguish *sensitivity to perturbation* (the mathematical property of a system) from *historical significance* (the persistence of that perturbation in the outcome). Chaos implies the former; history requires the latter. A perturbation that dissipates within a generation is sensitive but historically negligible. **[Non-Negotiable]**
  7.  **Token vs. Type Outcome:** The account must distinguish contingency in the *identity* of the outcome (e.g., "The British Empire falls") from contingency in the *timing/route* (e.g., "The British Empire falls in 1947 via decolonization rather than 1960 via war"). Many claims of contingency are actually claims about timing. **[Camp Preference: Structuralists prioritize Type; Narrativists prioritize Token]**

  ## III. Formal Constraints and The Measure of Contingency
  The account must cohere with results from complexity science and offer a coherent metric.

  8.  **Consistency with Sensitive Dependence:** The account cannot contradict the mathematical reality of Lyapunov exponents in non-linear systems. If the social world exhibits chaotic dynamics, microscopic variations *do* propagate. The account must explain why this does not render *all* history contingent. **[Non-Negotiable]**
  9.  **The Scale Relatum:** Contingency must be modeled as a three-place relation: $Contingency(Cause, Outcome, Scale)$. A cause is contingent relative to an outcome *at a specific grain of description*. **[Candidate Requirement]**
  10. **Non-Maximality Constraint:** A measure built on this account must not yield maximal contingency everywhere. If $Contingency = 1$ for all events, the concept loses explanatory power. **[Candidate Requirement]**

  ### Scrutiny of the Measure Candidate
  Does the **Non-Maximality Constraint** survive scrutiny?
  *Verdict:* **Conditionally Yes.**
  If the account treats history as a purely chaotic system at a fixed micro-scale, the constraint fails; sensitivity is maximal everywhere (the "Butterfly Effect"). The constraint survives *only if* Requirement #9 (Scale Relatum) is rigorously enforced. At the micro-scale (specific dates, specific actors), contingency may approach maximal. At the macro-scale (functional types, long-term trends), attractor basins (convergence) reduce the measure. Therefore, the Non-Maximality Constraint forces the account to be **scale-sensitive**. It excludes any theory that posits contingency as a monadic property of events.

  ## IV. Status and Consistency of Requirements

  ### Classification
  *   **Non-Negotiable:** 1, 2, 3, 4, 5, 6, 8. (These define the logical and empirical boundaries of the concept.)
  *   **Camp Preferences:** 7. (Determining whether token or type identity matters more is a substantive philosophical choice, not a conceptual prerequisite.)
  *   **Candidate Requirements:** 9, 10. (These are methodological proposals to solve the problems raised by 1–8.)

  ### Joint Unsatisfiability
  There is a tension between **Requirement 8 (Sensitive Dependence)** and **Requirement 10 (Non-Maximality)**.
  *   *The Conflict:* If social systems are chaotic (Req 8), then small causes propagate indefinitely, suggesting contingency is maximal. If contingency is not maximal (Req 10), then some perturbations must dampen, suggesting the system is not purely chaotic.
  *   *Resolution:* This is satisfiable only by invoking **Attractor Dynamics**. The system can be sensitive (Req 8) while trajectories converge on stable states (Req 10). The account must specify the "basins of attraction" that limit contingency. If an account cannot specify the damping mechanisms (e.g., institutional inertia, geographical constraints), this subset is jointly unsatisfiable.

  ### The Single Most Exclusionary Requirement
  **Requirement #9 (The Scale Relatum).**
  Most traditional accounts treat contingency as a property of the *event* or the *cause* simpliciter (e.g., "The war was contingent"). By demanding that contingency is relative to a *scale of description*, this requirement excludes:
  1.  **Naive Determinism:** Which assumes a single causal fabric.
  2.  **Radical Chaos-History:** Which assumes sensitivity implies total contingency regardless of description level.
  3.  **Strong Convergence Theory:** Which assumes outcomes are necessary regardless of descriptive grain.
  It forces a structural complexity that most existing literature lacks.

  ## V. Evaluation of Usual Positions
  **Determinism** fails Requirement 2 (Veridical Triviality) by treating the trivial event as merely the manifestation of prior necessity, often struggling to explain why the specific triviality mattered over structural forces. **Radical Chaos/Postmodernism** fails Requirement 10 (Non-Maximality) and 4 (Convergence); by insisting on the fragility of all narratives, they render the measure of contingency maximal, making the convergence of agriculture or the state inexplicable. **Strong Convergence Theory** (e.g., certain Marxist or Functionalist accounts) fails Requirement 2 and 6; they often dismiss the Mechelen Incident as epiphenomenal, collapsing sensitivity into historical insignificance. Only a **Complexity-Based Account** that integrates attractor basins with scale-relative description survives the full list, though it pays the cost of high theoretical complexity.
