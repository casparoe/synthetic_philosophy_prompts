prompt: |-
  I work as a policy adviser in a mid-sized voluntary-voting democracy where national turnout has slid into the low sixties over the past two decades, and I have been asked to help draft a submission to an electoral reform inquiry examining whether we should adopt the Australian model. The features of that model that I keep coming back to are structural rather than statistical. Federal compulsory enrolment and compulsory attendance at the polls have been in place since 1924; turnout moved from a voluntary-era range of roughly half to three-quarters of the eligible population into the low-to-mid nineties, and it has stayed there ever since. The sanction is a small administrative fine, cheap enough that almost nobody would call it a serious cost, and it can be waived on the basis of an acceptable excuse such as illness, absence from the country, or objection of conscience. Crucially, because the ballot is secret, the authorities can confirm that you attended a polling place and collected a ballot paper but can never confirm what you did with it; submitting a blank or deliberately spoilt paper is not an offence and is not detectable, and a substantial minority of ballots cast under compulsion are informal in exactly this way. So the state compels bodily presence, verifies presence only, and is constitutionally indifferent to the content of what is deposited in the box.

  What I want is a reconstruction of the theory this practice is only intelligible under, not a survey of arguments for and against compulsion. Start from the apparent incoherence that puzzles me: the act being mandated has, for any individual in an electorate of tens of millions, an essentially zero probability of affecting the outcome, so no straightforwardly causal expected-utility calculation can make it worth doing, let alone worth being fined for not doing; and yet the same legal system compels jury service, where a single juror's absence can actually abort a trial and where the juror is paid for the inconvenience, while the voter is neither causally indispensable nor compensated. What conception of political obligation, and of what makes an electoral result legitimate, licenses compelling the causally impotent act and not merely the causally load-bearing one? Distinguish carefully between what the practice strictly presupposes and what merely fits it comfortably. I have in mind at least four candidate grounds that seem to license an identical institution: a fair-play or reciprocity account on which beneficiaries of a cooperative scheme owe a contribution; a Kantian universalizing account on which the individual's reason to vote derives from what would follow if everyone reasoned as she does; the argument sometimes called evidential cooperation in large worlds, on which an agent facing a decision problem she knows is replicated across many structurally similar agents should treat her own choice as evidence about theirs and cooperate accordingly even absent any causal link; and a purely pragmatic, non-moral engineering rationale on which compulsion is valued because voluntary electorates over-represent the old, the affluent, and the polarized, so dragging everyone to the polls forces parties to compete for the median. Which of these does the Australian arrangement actually depend on, and which could be swapped in without changing a single rule?

  Two further questions I would like treated explicitly. First, is the arrangement internally consistent, given the parts I have described? It prosecutes non-attendance but not donkey voting or blank voting; it justifies itself by reference to the mandate an elected government receives and to the deliberative quality of a fully participating electorate, yet its enforcement machinery is blind to whether any preference was expressed at all. Does that combination presuppose that the value of voting is aggregative and symbolic rather than expressive or epistemic, and if so, what becomes of the standard defences? I would also like you to tell me which rival views the practice quietly forecloses — a consent-based account of political obligation, for instance, or a competence-restricted view on which the uninformed should stay home, or any view on which the worth of a political act depends on its being freely undertaken rather than extracted. Second, consider a variant my committee has been asked to cost: keep the obligation and the excuse provisions but replace the universal small fine with a large fine imposed on a randomly selected five per cent of detected non-voters, holding expected cost constant. What does the choice between these two enforcement structures presuppose about whether the law is doing deterrent work, norm-signalling work, or merely bookkeeping work? Finally, tell me what would have to change institutionally if we replaced the presupposed view with a strictly causal-instrumental one — what would take the place of compulsion, whether a lottery that pays one voter enough to offset the decisiveness deficit, sortition, or something else — and what would have to change if we instead adopted the evidential-cooperation reading, where the state's problem is not motivation but the salience of the fact that millions of similar agents are making the same choice at once.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Role:** Policy Adviser in a mid-sized voluntary-voting democracy (turnout ~60%).
      *   **Task:** Draft a submission to an electoral reform inquiry regarding adopting the Australian model of compulsory voting.
      *   **Specific Focus:** Reconstruct the *theory* under which the practice is intelligible. Not a survey of pros/cons, but a philosophical/political theory reconstruction.
      *   **Core Puzzle:** Why compel a causally impotent act (voting) while compensating a causally load-bearing one (jury duty)? Why compel attendance but remain indifferent to content (secret ballot, informal voting allowed)?
      *   **Candidate Grounds to Evaluate:**
          1.  Fair-play/Reciprocity.
          2.  Kantian Universalization.
          3.  Evidential Cooperation (Newcomb-like/Logical Decision Theory).
          4.  Pragmatic/Engineering (Median Voter Theorem).
      *   **Key Questions to Address:**
          1.  Which ground does the arrangement *actually depend* on vs. which merely *fits*?
          2.  Is the arrangement internally consistent (compel attendance, ignore content)? Does this imply voting is aggregative/symbolic rather than expressive/epistemic?
          3.  Which rival views does the practice foreclose (consent-based, competence-restricted, freedom-dependent)?
          4.  Enforcement Variant Analysis: Universal small fine vs. Random large fine (same expected cost). What does this say about deterrent vs. norm-signalling vs. bookkeeping?
          5.  Institutional Alternatives: What if we switched to a strictly causal-instrumental view (lottery/sortition)? What if we switched to evidential-cooperation (salience focus)?

  2.  **Deconstruct the Core Puzzle (Causal Impotence vs. Compulsion):**

      *   *The Problem:* In a large electorate, $P(\text{vote is decisive}) \approx 0$. Rational choice theory says cost > expected benefit. Yet, the state compels it. Jury duty is compelled but paid, and one juror *can* abort a trial.
      *   *The Implication:* The justification cannot be instrumental/causal regarding the *outcome* of the specific election. It must be about the *process* or the *status* of the citizen.
      *   *The "Attendance only" Feature:* The state verifies presence, not preference. Informal voting is allowed. This means the state values the *act of showing up* more than the *expression of will*.

  3.  **Evaluate the Candidate Grounds:**

      *   *Fair-play/Reciprocity:* You benefit from the system, so you owe a duty to maintain it. *Fit:* High. Compulsion ensures everyone contributes their share to the legitimacy of the government they benefit from. *Dependence:* Strong. If voting were purely optional, free-riders undermine the collective legitimacy.
      *   *Kantian Universalization:* "What if everyone did that?" If everyone abstained, democracy collapses. Therefore, I must vote. *Fit:* High. *Dependence:* Moderate. It explains the duty, but doesn't necessarily explain the *state compulsion* (Kant is usually about self-legislation, not state coercion).
      *   *Evidential Cooperation:* My vote is evidence of others' votes. If I vote, it increases the probability (evidentially) that others like me vote. *Fit:* Low/Moderate. *Dependence:* Very Low. This is a decision-theoretic justification for the *voter*, not a legal justification for the *state*. The state doesn't legislate based on Newcomb's Problem.
      *   *Pragmatic/Engineering:* Force turnout to shift policy to the median. *Fit:* High (empirically). *Dependence:* Low (theoretically). This explains the *consequence*, not the *obligation*. You can't legally compel someone based on "it helps the median voter" without a prior theory of why they *owe* that help.

      *   *Selection:* The Australian model *depends* on a hybrid of **Fair-Play (Civic Duty)** and **Legitimacy (Symbolic Participation)**. It treats voting as a civic duty akin to taxation or jury duty, but distinct in its non-instrumental nature. The Pragmatic argument is the *political sales pitch*, not the *legal theory*. The Kantian/Evidential arguments are *motivational tools*, not *jurisprudential bases*.

  4.  **Analyze Internal Consistency (Attendance vs. Content):**

      *   *The Tension:* Compel presence, ignore content.
      *   *Resolution:* The value is **constitutive**, not **expressive**. The act constitutes the citizen's relationship to the state. It confirms the *authority* of the election, not the *wisdom* of the choice.
      *   *Aggregative/Symbolic:* Yes. It presupposes legitimacy comes from the *pool* of participants, not the *quality* of the input.
      *   *Foreclosed Views:*
          *   *Consent Theory:* Voting is not consent (since you can vote informally or under duress).
          *   *Competence/Epistocracy:* The uninformed *must* show up (and can vote randomly).
          *   *Libertarian/Voluntarist:* The act need not be free to be valid.

  5.  **Analyze Enforcement Variant (Small Universal Fine vs. Large Random Fine):**

      *   *Current Model (Small Universal):* Signals that the breach is administrative, not criminal. It's a "tax on non-participation." Emphasizes **Norm-Signalling** and **Bookkeeping**. It says "we expect you to do this, but we don't hate you if you don't, just pay the admin fee."
      *   *Variant (Large Random):* Signals **Deterrence**. It treats non-voting as a risk calculation. This undermines the "Civic Duty" aspect and turns it into a gamble. It suggests the state cares about the *rate* of compliance, not the *internalization of the norm*.
      *   *Conclusion:* The current model presupposes the law is doing **Norm-Signalling/Bookkeeping**. The variant shifts it to **Deterrence**.

  6.  **Analyze Institutional Alternatives (Causal-Instrumental vs. Evidential):**

      *   *Strictly Causal-Instrumental:* If the goal is actually affecting outcomes (solving the $P \approx 0$ problem), compulsion is inefficient.
          *   *Alternative:* **Sortition/Lottery.** Select a representative sample to vote decisively. Pay them well (like jury duty). This solves the causal impotence (their vote *counts*).
          *   *Change:* Abolish universal suffrage for a "randomly selected electorate."
      *   *Evidential-Cooperation:* If the goal is coordinating mass behavior based on logical correlation.
          *   *Alternative:* **Salience Campaigns.** No compulsion needed. Just make the "mirror effect" obvious. "If you stay home, people like you stay home."
          *   *Change:* Remove compulsion, increase public reasoning/education about collective action.

  7.  **Drafting the Response:**

      *   *Tone:* Professional, analytical, philosophical, suitable for a policy submission's theoretical annex.
      *   *Structure:*
          1.  Introduction: Framing the theoretical puzzle.
          2.  Theoretical Grounding: Evaluating the four candidates (Fair-Play vs. others).
          3.  Internal Consistency: Attendance vs. Content (Constitutive vs. Expressive).
          4.  Foreclosed Views: What this model rejects.
          5.  Enforcement Analysis: Fine structures and their meaning.
          6.  Institutional Alternatives: What if we changed the theory?
          7.  Conclusion: Summary for the inquiry.

      *   *Refining the Argument:*
          *   Make sure to distinguish between *why the citizen votes* (Kant/Evidential) and *why the state compels* (Fair-Play/Legitimacy).
          *   Clarify the Jury Duty comparison: Jury duty is instrumental (need a verdict), Voting is constitutive (need a mandate).
          *   Ensure the "Small Fine vs. Large Random" analysis hits the "Norm vs. Deterrent" distinction hard.

      *   *Self-Correction during drafting:* I initially thought about putting heavy weight on the Pragmatic argument. But the prompt asks what the practice *depends* on. A law cannot constitutionally depend on "shifting the median" as a primary justification for coercion without violating neutrality. It must depend on "Civic Duty." I need to make that distinction clear. The Pragmatic argument is the *effect*, Fair-Play is the *justification*.

      *   *Addressing the "Causal Impotence" specifically:* The response must explicitly state that the Australian model *rejects* the causal-instrumental view of voting. It treats voting as a duty of *status*, not a tool of *outcome*.

  8.  **Final Polish:** Check against all constraints in the prompt.
      *   Reconstruct theory? Yes.
