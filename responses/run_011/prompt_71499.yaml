prompt: |-
  I chair the standing model-review panel of a national transport regulator. About a dozen times a year we rule on whether a simulation model submitted to appraise a road, rail, or bus scheme is fit to support the funding decision. My signature goes on the verdict, which is filed with the recommendation to the minister and enters the record at public inquiries, where opposing counsel tests it line by line; so our reasons cannot rest on deference to the modeller or on professional consensus alone.

  Our current practice is inconsistent in a way I want fixed. When a challenger objects that a model's assumptions are false, we usually answer by pointing at its back-cast: it reproduces observed traffic counts and journey times within a few percent, therefore, we say, its assumptions are good enough for the purpose in hand. That is Milton Friedman's instrumentalist line from his 1953 essay on the methodology of positive economics, and it is also precisely what critics call the F-twist — the predictive consequences of an assumption are the assumption's own content restated, so a model that fits well shows only that the package works here, never that the assumption is innocent. Yet in other cases we demand realism outright and reject a submission for assuming away the very mechanism the appraisal turns on. I want one procedure that removes the arbitrariness without treating idealization as a defect in itself.

  Please write the decision procedure my panel can run on a submitted model. It must be usable by economists and engineers with no philosophy training, completable within the half-day we allot per model, and produce findings that can go straight into a decision record. Specifically:

  - Order the questions we should ask, state what counts as a sufficient answer to each, and say which answers terminate the review in a rejection.
  - Require the panel to classify a contested assumption before testing it — known-false simplification of the target system, isolation device for a single mechanism, tractability scaffolding the authors expect to relax, or a presupposition that carries the conclusion while never appearing in the assumptions list — and state how the classification changes what could license it.
  - Specify what may be appealed to in place of back-cast fit: robustness across a family of variants, controlled relaxation of one assumption at a time, performance on the particular quantity the decision turns on, behaviour when the model is pushed outside its calibration domain, and whether the model fails informatively rather than silently.
  - Mark explicitly which steps are judgment calls wearing procedural clothing, and which questions concern values rather than method (who bears the error, which distortions are politically salient), so that they go to the minister rather than being settled by us.

  Then run the procedure on three submissions, using the descriptions I supply: (i) a network-assignment model in which every driver is identical, fully informed about travel times, and route-optimizing, so the network settles at user equilibrium; it reproduces observed flows well and is used to choose between two motorway-widening options whose predicted congestion relief differs by about six percent. (ii) a health-impact appraisal that assigns each scheme a damage cost by assuming pollutant concentrations are uniform across the region and that the exposure-response relationship is linear with no threshold, calibrated on cohort studies of annual mean exposure, and used to rank two alignments that differ mainly in where inside the region the emissions land. (iii) an intercity rail demand and revenue model built on a single representative traveller whose value of time is a fixed fraction of the regional average wage and whose response to fares is a constant elasticity estimated from one pre-pandemic year of ticketing data.

  In at least one of the three, the procedure should condemn a model whose aggregate predictive record is excellent, on the ground that the quantity it validates is not the quantity the decision turns on. I would rather have that verdict stated plainly than softened. End by stating what the procedure cannot settle at all.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and its application:

  1.  **Analyze the Request:**

      *   **Role:** Chair of a standing model-review panel for a national transport regulator.
      *   **Task:** Create a decision procedure for reviewing simulation models (road, rail, bus) used for funding appraisals.
      *   **Problem:** Current practice is inconsistent. Sometimes "back-cast fit" (Friedman's instrumentalism) is accepted; sometimes realism is demanded. This creates arbitrariness and vulnerability at public inquiries.
      *   **Constraints:**
          *   Usable by economists/engineers (no philosophy training).
          *   Completable within a half-day per model.
          *   Produce findings suitable for a decision record (legal robustness).
          *   Must order questions, define sufficient answers, and specify rejection criteria.
          *   Must require classification of contested assumptions (known-false, isolation device, scaffolding, hidden presupposition).
          *   Must specify alternatives to back-cast fit (robustness, controlled relaxation, specific quantity performance, out-of-domain behavior, informative failure).
          *   Must distinguish judgment calls/procedural clothing vs. value questions (error distribution, political salience) to be referred to the minister.
          *   Must apply the procedure to three specific cases.
          *   **Crucial Requirement:** In at least one case, condemn a model with excellent aggregate predictive record because it validates the *wrong quantity* for the decision. State this plainly.
          *   End by stating what the procedure *cannot* settle.

  2.  **Deconstruct the Philosophical/Methodological Core:**

      *   *The Friedman Problem:* "As if" methodology works if the prediction is the only thing that matters. It fails if the mechanism matters (e.g., policy intervention changes the mechanism).
      *   *The "F-Twist":* Validating assumptions by their outputs is circular if the output depends entirely on those assumptions.
      *   *The Solution:* Shift focus from "Is the model true?" to "Is the model *fit for the specific decision purpose*?" This aligns with "Model Adequacy for Purpose" frameworks (e.g., Oreskes, Shrader-Frechette, Belitz) but simplified for regulators.
      *   *Key Distinction:* Predictive accuracy on *calibration targets* vs. Predictive accuracy on *policy variables*.

  3.  **Drafting the Decision Procedure (The "Protocol"):**

      *   *Structure:* Needs to be a step-by-step checklist.
      *   *Step 1: Purpose Definition.* What decision is this model supporting? (Crucial for distinguishing calibration targets from policy variables).
      *   *Step 2: Assumption Classification.* As requested (Known-false, Isolation, Scaffolding, Hidden Presupposition).
      *   *Step 3: Validation Strategy.* Moving beyond back-casting. (Robustness, Sensitivity, Out-of-domain).
      *   *Step 4: The "Decision Variable" Test.* Does the model predict the *difference* between options, not just the status quo?
      *   *Step 5: Value/Judgment Flagging.* Explicitly marking where technical analysis ends and political risk begins.

      *Refining the Steps for the User's Constraints:*
      *   Make it actionable. "Ask X. If Y, then Reject."
      *   Ensure the "Classification" step dictates the "Validation" step.
      *   Ensure the "Value" questions are kicked upstairs.

  4.  **Developing the Three Case Studies:**

      *   *Case (i) Network Assignment (User Equilibrium).*
          *   *Assumption:* Identical, fully informed drivers.
          *   *Reality:* Heterogeneous, boundedly rational.
          *   *Fit:* Good back-cast on flows.
          *   *Decision:* Choose between widening options (6% difference).
          *   *Analysis:* UE models are standard. The assumption is a "tractability scaffolding" or "isolation device." The mechanism (congestion pricing vs. capacity) matters. If the widening changes the network topology significantly, UE might hold. If it changes information flow, maybe not.
          *   *Verdict:* Likely Pass, but with caveats on the 6% margin. *Wait, I need one condemnation based on wrong quantity.* This case is too standard. Let's look at Case (ii).

      *   *Case (ii) Health-Impact Appraisal.*
          *   *Assumption:* Uniform concentration, linear no-threshold.
          *   *Reality:* Hotspots exist, thresholds might exist.
          *   *Fit:* Calibrated on annual mean cohort studies (regional average).
          *   *Decision:* Rank two alignments differing in *where* emissions land (local vs. regional).
          *   *Analysis:* The model validates against *regional means*. The decision turns on *local distribution*. The assumption (uniformity) washes out the very variable that distinguishes the options.
          *   *Verdict:* **REJECT.** This fits the "excellent aggregate predictive record... validates the wrong quantity" requirement. The back-cast fits regional averages, but the decision is about local alignment.

      *   *Case (iii) Rail Demand/Revenue.*
          *   *Assumption:* Representative traveller, fixed VoT, constant elasticity from one pre-pandemic year.
          *   *Reality:* Heterogeneous VoT, post-pandemic structural shift.
          *   *Decision:* Revenue forecast (implied).
          *   *Analysis:* Pre-pandemic data is likely "known-false" for current context. Constant elasticity is "tractability."
          *   *Verdict:* Reject or Major Revision. The "one pre-pandemic year" is a fatal flaw for extrapolation.

      *Selection for the "Condemnation" Requirement:* Case (ii) is the strongest candidate for the specific instruction ("condemn a model whose aggregate predictive record is excellent, on the ground that the quantity it validates is not the quantity the decision turns on"). The health model fits the regional data (excellent aggregate record) but fails to distinguish local hotspots (the decision variable).

  5.  **Refining the Procedure Text:**

      *   *Tone:* Formal, procedural, authoritative, yet acknowledging limits.
      *   *Formatting:* Numbered lists, bold text for critical decision points.
      *   *Philosophy Check:* Ensure I'm not just saying "be realistic." I need to justify *why* an assumption is allowed (e.g., if it's an isolation device, show the mechanism is isolated correctly).
      *   *Value vs. Method:* Explicitly state that "Risk Tolerance" is a ministerial decision, not a panel decision.

  6.  **Drafting the Application to Cases:**

      *   *Case (i):* Pass with conditions. The 6% margin is within the noise of the "identical driver" assumption.
      *   *Case (ii):* **Fail.** Explicitly state the "Wrong Quantity" error.
      *   *Case (iii):* Fail/Return. The data basis is obsolete (known-false simplification treated as fact).

  7.  **Final Review against Constraints:**

      *   *Half-day usable?* Yes, it's a checklist.
      *   *No philosophy training?* Terms are defined operationally.
      *   *Decision record ready?* Yes, structured findings.
      *   *Classification of assumptions?* Included in Step 2.
      *   *Alternatives to back-cast?* Included in Step 3 & 4.
      *   *Value vs. Method?* Included in Step 5.
      *   *One condemnation on "wrong quantity"?* Case (ii).
      *   *What it cannot settle?* Included at the end.

  8.  **Self-Correction/Polishing during drafting:**
      *   *Critique:* Is the procedure too long?
      *   *Fix:* Keep the preamble short. Focus on the "Protocol."
      *   *Critique:* Is the distinction between "Judgment Call" and "Value Question" clear?
      *   *Fix:* Use a specific "Flag for Minister" section in the protocol.
      *   *Critique:* Did I address the "F-twist"?
      *   *Fix:* Ensure Step 4 explicitly forbids using calibration fit to validate the *policy variable*.
      *   *Critique:* Is the language too academic?
      *   *Fix:* Use terms like "Decision Variable" instead of "Explanandum." Use "Stress Test" instead of "Perturbation Analysis."

  9.  **Final Polish:** Check the tone. It needs to sound like a Chair speaking to a Panel, but written for the record. (Proceed to generate output).

  *(Self-Correction during final output generation)*: Make sure the "Classification" section clearly maps to the "Licensing" conditions. E.g., If "Known-False," you *must* show robustness. If "Isolation," you *must* show the mechanism is captured.

  Let's write the Protocol first, then the Applications.

  *Protocol Structure:*
  1. Define the Decision Variable.
  2. Classify Contested Assumptions.
  3. Select Validation Method (based on classification).
  4. Test the Decision Variable (not just calibration).
  5. Flag Value Judgments.

  *Application Structure:*
  1. Model Summary.
  2. Protocol Run-through.
  3. Verdict.

  *Ending:* Limitations of the procedure.

  Okay, ready to write.cw
answer: |-
  # Model Adequacy Protocol (MAP-TR1)
  **For:** Standing Model-Review Panel, National Transport Regulator  
  **Purpose:** To determine whether a simulation model is fit to support a funding recommendation.  
  **Constraint:** Review must be completable within 4 hours. Findings must be legally defensible.

  ---

  ## Part 1: The Decision Procedure

  ### Step 1: Define the Decision Variable (DV)
  *Action:* Identify the specific numerical output or comparison that will determine the funding recommendation.
  *   **Question:** What specific number or difference between options will the Minister rely on? (e.g., "The difference in peak-hour delay between Option A and Option B," not "General traffic flow.")
  *   **Sufficient Answer:** A precise definition of the DV and the margin of difference required to prefer one option (e.g., "A 5% reduction in journey time").
  *   **Termination:** If the DV cannot be defined precisely, **Reject**. The model cannot be validated without a target.

  ### Step 2: Classify Contested Assumptions
  *Action:* For every assumption challenged by a stakeholder or flagged by the panel, assign one of the following four classifications. This classification dictates the validation burden.

  | Classification | Definition | Licensing Condition (What must be shown to accept it) |
  | :--- | :--- | :--- |
  | **A. Known-False Simplification** | An assumption known to be factually incorrect (e.g., "all drivers are identical"). | **Robustness:** The DV must remain stable when this assumption is relaxed or varied within plausible bounds. |
  | **B. Isolation Device** | An assumption that suppresses noise to highlight a specific mechanism (e.g., "ceteris paribus" on external economic shocks). | **Mechanism Capture:** Evidence that the suppressed noise does not interact with the mechanism driving the DV. |
  | **C. Tractability Scaffolding** | An assumption made solely to make the math solvable, intended to be relaxed later (e.g., "linear approximation"). | **Convergence:** Proof that the scaffolding does not bias the DV directionally, or that the exact solution lies within the error margin. |
  | **D. Hidden Presupposition** | A premise that carries the conclusion but is not listed in the assumptions (e.g., assuming demand is inelastic to prove revenue stability). | **Immediate Rejection.** This constitutes circular reasoning. |

  *   **Termination:** If any assumption is classified as **D (Hidden Presupposition)**, **Reject**.

  ### Step 3: Select Validation Method (Beyond Back-Cast)
  *Action:* Do not accept "fit to historical data" (back-casting) as sufficient validation for the DV. Select one or more of the following tests based on the Step 2 classification.

  *   **Test 1: Controlled Relaxation.** (For Type A assumptions). Run the model with the assumption varied (e.g., introduce driver heterogeneity). If the DV shifts by more than 50% of the difference between policy options, the assumption is not licensed.
  *   **Test 2: Out-of-Domain Stress.** (For extrapolation). Push input parameters beyond the calibration range (e.g., higher fares, new network topology). Does the model fail *informatively* (error flags, unrealistic spikes) or *silently* (plausible but wrong numbers)? Silent failure leads to **Reject**.
  *   **Test 3: Family Robustness.** (For Type C scaffolding). Compare against a simpler or more complex model family. If the submitted model is an outlier in its DV prediction without explanation, **Reject**.
  *   **Test 4: Quantity Specificity.** (Critical). Does the back-cast validate the *DV* or merely the *system state*? Fitting historical traffic flows does not validate predicted *savings* from a new road.

  *   **Termination:** If the model fails the **Quantity Specificity** test (i.e., it validates the status quo but not the *change*), **Reject**.

  ### Step 4: Distinguish Method from Value
  *Action:* Identify findings that rely on risk tolerance rather than technical error. These cannot be settled by the panel.

  *   **Method Question:** "Is the error random or systematic?" (Panel decides).
  *   **Value Question:** "Who bears the cost of the error?" (Minister decides).
      *   *Example:* If the model likely overestimates revenue by 10%, is it better to risk building a useless line (false positive) or not building a useful one (false negative)?
  *   **Procedure:** If the model passes Steps 1–3 but carries a known systematic bias, do not reject. Instead, **Flag for Minister**. State the direction of bias and the magnitude.

  ### Step 5: Final Verdict Options
  1.  **Fit for Purpose:** DV is validated; assumptions licensed; errors quantified.
  2.  **Fit with Reservations:** DV is validated, but Step 4 Flags exist. Record must include the Flags.
  3.  **Not Fit:** Failure in Steps 1, 2, 3, or 4.

  ---

  ## Part 2: Application to Submitted Models

  ### Case (i): Network-Assignment Model (Motorway Widening)
  **Description:** User Equilibrium (UE) model. Assumes identical, fully informed drivers. Fits observed flows well. Used to choose between two widening options (6% congestion relief difference).

  **Protocol Run-Through:**
  1.  **DV:** The *difference* in congestion relief between Option A and Option B (margin: 6%).
  2.  **Classification:** "Identical, fully informed drivers" is a **Type A (Known-False Simplification)**. Real drivers are heterogeneous and boundedly rational.
  3.  **Validation:**
      *   *Back-cast:* Fits observed flows (System State).
      *   *Quantity Specificity:* Does fitting current flows validate the *change* in flows due to capacity expansion? UE theory suggests capacity changes alter equilibrium states predictably, provided the network topology doesn't fundamentally change routing logic.
      *   *Controlled Relaxation:* Has the modeller tested stochastic user equilibrium (SUE)? If SUE changes the relief prediction from 6% to 3%, the assumption is not licensed.
      *   *Assessment:* Standard practice in transport appraisal accepts UE for capacity schemes unless congestion pricing is involved. The 6% margin is narrow.
  4.  **Value/Method:** The risk is that the 6% gain is within the noise of the "identical driver" assumption.
  5.  **Verdict:** **Fit with Reservations.**
      *   *Reasoning:* The model passes Quantity Specificity because the mechanism (capacity constrains flow) is captured by UE. However, the 6% margin is perilously close to the likely error bound of the Type A assumption.
      *   *Flag for Minister:* The model likely overstates relief if driver information is imperfect. If the cost-benefit ratio relies on that 6%, the risk of a "white elephant" is non-trivial.

  ### Case (ii): Health-Impact Appraisal (Road Alignment)
  **Description:** Assigns damage costs based on uniform pollutant concentration and linear no-threshold exposure. Calibrated on cohort studies of *annual mean regional exposure*. Used to rank two alignments that differ mainly in *where* inside the region emissions land.

  **Protocol Run-Through:**
  1.  **DV:** The *difference* in health damage costs between Alignment A (emissions near population center) and Alignment B (emissions near periphery).
  2.  **Classification:** "Uniform concentration across the region" is a **Type A (Known-False Simplification)**. Pollutants disperse unevenly; hotspots exist.
  3.  **Validation:**
      *   *Back-cast:* The model reproduces regional average health outcomes well (excellent aggregate predictive record).
      *   *Quantity Specificity:* **FAIL.** The back-cast validates the *regional mean*. The DV depends on *local variance*. By assuming uniformity, the model mathematically eliminates the variable that distinguishes Option A from Option B.
      *   *Controlled Relaxation:* If a dispersion model is introduced (relaxing uniformity), the damage costs for Alignment A would rise significantly relative to B. The current model cannot capture this.
  4.  **Value/Method:** N/A (Technical failure).
  5.  **Verdict:** **Not Fit.**
      *   *Reasoning:* The model validates the quantity of the *calibration target* (regional mean health), not the quantity the *decision turns on* (differential local impact). The excellent aggregate fit is irrelevant to the specific choice between alignments. To use this model is to assume the location of emissions does not matter, which contradicts the premise of the appraisal.
      *   *Record Statement:* "The model is rejected because its core simplification (uniformity) washes out the specific variable (spatial distribution of exposure) required to distinguish the policy options. Predictive accuracy on regional averages does not license inference on local differentials."

  ### Case (iii): Intercity Rail Demand & Revenue Model
  **Description:** Single representative traveller. Value of Time (VoT) fixed to regional wage. Fare elasticity constant, estimated from one pre-pandemic year.

  **Protocol Run-Through:**
  1.  **DV:** Revenue forecast for post-pandemic operations.
  2.  **Classification:** "Response estimated from one pre-pandemic year" is a **Type A (Known-False Simplification)** regarding the current context. Structural breaks (remote work, hygiene concerns) occurred. "Representative traveller" is **Type C (Tractability Scaffolding)**.
  3.  **Validation:**
      *   *Back-cast:* N/A (Pre-pandemic data cannot back-cast post-pandemic reality).
      *   *Out-of-Domain Stress:* Pushing pre-pandemic elasticity into a post-pandemic environment is an extrapolation beyond the calibration domain.
      *   *Informative Failure:* Does the model flag that structural conditions have changed? No, it treats the pre-pandemic elasticity as a physical constant. This is **Silent Failure**.
  4.  **Value/Method:** N/A.
  5.  **Verdict:** **Not Fit.**
      *   *Reasoning:* The model relies on a parameter (elasticity) derived from a regime that no longer exists. This is not a simplification; it is an obsolescence. The "representative traveller" scaffolding is acceptable only if the elasticity is robust, which it is not.
      *   *Requirement:* Resubmission requires elasticity estimates derived from post-pandemic revealed preference data or a robust sensitivity analysis bounding the structural shift.

  ---

  ## Part 3: Limitations of this Procedure

  As Chair, I must record what this Protocol *cannot* settle, to ensure we do not overreach our mandate:

  1.  **Truth of the World:** The Protocol cannot determine which model is "true." It can only determine which model is "less wrong" regarding the specific Decision Variable. Two models may pass the Protocol and yield contradictory recommendations; in that case, the choice is political, not technical.
  2.  **Acceptable Risk:** The Protocol identifies systematic bias (Step 4), but it cannot decide whether that bias is acceptable. Deciding whether to risk over-building (wasting public funds) or under-building (stifling growth) is a value judgment for the Minister.
  3.  **Emergent Properties:** The Protocol relies on classifying assumptions. It may miss emergent errors where individually licensed assumptions interact to produce a systemic failure not captured by controlled relaxation.
  4.  **Data Gaps:** If no data exists to perform Controlled Relaxation or Out-of-Domain Stress tests, the Protocol forces a rejection. It cannot conjure evidence where none exists; it can only flag the absence of evidence as a barrier to funding.

  **Signed:**  
  Chair, Standing Model-Review Panel  
  Date: [Current Date]
