  Here is the principle that generates your verdicts, the clause mapping, the necessary sacrifice for simplicity, and the ruling on your friend.

  ### The Principle: Proportional Epistemic Ownership
  **"You must personally own the reasoning chain behind a belief in proportion to the cost of being wrong."**

  This is not about whether the belief is *true*, but about your relationship to the *source* of the belief. When the stakes are low, you can outsource the reasoning (follow the crowd, trust a hunch). When the stakes are high (savings, ruin, conviction), you must be the one who has processed the premises. You distrust precision because it hides the reasoning; you distrust consensus because it dilutes your agency; you distrust hunches because they are black boxes.

  ### Clause Mapping
  Here is how each of your verdicts follows from this principle:

  1.  **Data vs. Hunch (Case 1):**
      *   *Clause:* **Transparency of Premises.**
      *   *Reasoning:* Fifteen years of data allows you to inspect the reasoning chain yourself. A smart person's hunch outsources the reasoning to them. Since you cannot say the hunch is likelier, you choose the option where you retain ownership of the verification.
  2.  **Incomparable Probabilities (Case 2):**
      *   *Clause:* **Limits of Modeling.**
      *   *Reasoning:* You cannot own a reasoning chain that doesn't exist. Acknowledging that two risks are incomparable is an act of owning the limit of your model, rather than outsourcing the ranking to a false metric.
  3.  **Social Proof vs. Savings (Case 3):**
      *   *Clause:* **Stakes-Weighted Agency.**
      *   *Reasoning:* Low stakes (daily decisions) allow outsourced reasoning (doing what others do). High stakes (savings) require personal ownership of the risk. If you can't own the reasoning, you refuse the exposure.
  4.  **Precision vs. Vagueness (Case 4):**
      *   *Clause:* **Honesty of Uncertainty.**
      *   *Reasoning:* A forecast to three decimal places claims a level of reasoning ownership that is impossible (hiding the error bars). "Roughly a third" invites you to own the uncertainty alongside the forecaster. You trust the one that lets you see the seams.
  5.  **Crowded vs. Obscure (Case 5):**
      *   *Clause:* **Source of Edge.**
      *   *Reasoning:* A well-understood opportunity relies on the market's reasoning (outsourced). An obscure one relies on your own discovery (owned). *Note: This is the tension point (see below).*
  6.  **EV Math vs. Betting (Case 6):**
      *   *Clause:* **Map vs. Territory.**
      *   *Reasoning:* On the whiteboard, you own the numbers and the math (the Map). Betting the house requires the Map to match the Territory perfectly. Since you know the model is yours but reality is not, you refuse to equate them when ruin is possible.

  ### The Sacrifice for Simplicity
  If you need to tighten this principle into a razor, **you must drop the verdict in Case 5 (The preference for obscurity).**

  *   **Why:** Case 1 (Prefer Data) and Case 5 (Prefer Obscurity) are in tension. Case 1 prefers *collective, historical verification* (15 years of data). Case 5 prefers *individual, novel discovery* (nobody has looked at it).
  *   **The Conflict:** Your other five cases are fundamentally about **Safety, Verification, and Humility** (don't bet what you can't check, don't trust false precision, don't risk savings on uncertainty). Case 5 is about **Alpha and Advantage**.
  *   **The Fix:** To make the principle purely about *epistemic safety* (which fits Cases 1, 3, 4, 6 best), you should treat Case 5 as a specific investment heuristic rather than a universal rule of judgment. If you keep it, you have to maintain two modes: "Safety Mode" (Case 1) and "Growth Mode" (Case 5). Dropping Case 5 allows the principle to be a single, unified rule about **Risk Management**.

  ### The Friend Case (Case 7)
  **Verdict:** **No, his evidence does not count as your own.**

  *   **Application:** Under *Proportional Epistemic Ownership*, your friend has high ownership (he spent two years inside it). You have zero ownership of the data; you only have ownership of your trust in him.
  *   **Ruling:** If the stake is low (a small bet), you can outsource the reasoning to him. If the stake is high ("go in on something" implies significant commitment), you cannot act. You are being asked to take high-stakes risk on low-stakes reasoning (from your perspective).
  *   **Exception:** Unless you can spend the time to "inside" it yourself, or unless you treat the investment as a bet on *his character* rather than *the venture's mechanics*. If it's the latter, you must evaluate him, not the tech.

  ### Confidence and Uncertainty
  **Confidence:** **85%**
  This principle fits the "texture" of your decisions better than standard risk-aversion or expected-utility theory. It captures why you accept uncertainty in some places (vagueness) but reject it in others (precision), based on *who holds the knowledge*.

  **Least Sure Component:** **The Reconciliation of Data (Case 1) and Obscurity (Case 5).**
  I am least sure about whether your preference for the "obscure thing" is truly about *Epistemic Ownership* or if it is a separate desire for *Contrarianism*. Data is often "crowd-sourced truth," while obscurity is "lonely truth." If you value Truth over Edge, Case 1 should always win. If you value Edge over Truth, Case 5 wins. The principle assumes you value **Agency** over both, but that is the thinnest part of the bridge.
