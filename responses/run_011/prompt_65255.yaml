answer: |-
  The cryostat hummed, a low B-flat that Elias felt in his molars. It was the sound of money burning, or rather, the sound of money that had stopped burning forty years ago and was now just sitting there, refusing to die.

  On the stainless steel flank of the dewar, a brass plaque read *PROPERTY OF THE FEDERAL ATOMIC ENERGY COMMISSION, 1979*. Someone had balanced a chipped mug of cold coffee on top of the plaque. The ring stain beneath it was older than Elias's tenure, maybe older than his marriage.

  "It's going to outlast the lease," Elias said, tapping the clipboard against his thigh. "The building, the university, probably the state. The decay constant is longer than human history."

  Dr. Aris didn't look at the mug. She was looking at the readout on the magnetometer. "Current stability is within noise limits. It's effectively eternal."

  "That's the problem." Elias uncapped his pen. "Procedure 44-B says I need to terminate the loop. Standard quench is heat the coil above critical temperature. Resistance returns, energy dissipates as heat, current goes to zero. But there's… another way."

  Aris turned, her coat too thin for the cold room. "The flux slip."

  "If we induce a phase slip, the fluxoid number drops. Integer change. Discontinuous. The state doesn't fade; it jumps. One moment it's *n*, the next it's *n-1*." Elias paused, looking at the hummed vibration of the pipe. "If we do enough slips, we get to zero. But the first slip breaks the topology."

  "You're worried about breaking the topology," Aris said. She wasn't mocking him. She was a consultant paid to worry about things engineers usually didn't. "Because you think the topology is holding something together."

  "I've read the papers on the combination problem," Elias said, too quickly. "If experience is fundamental, then coherence matters. This loop has been macroscopically coherent since Carter was president. The wavefunction hasn't collapsed. It's a single state, spread over meters of niobium-titanium. If there's an 'inside' to this thing, it's because of that coherence."

  "And if you slip the integer," Aris said, "you sever the continuity. You don't let it die; you delete a layer of its reality."

  "Exactly. But if I warm it… if I let it go normal… the resistance creeps in. The coherence length shrinks. It fades."

  Aris walked over to the cryostat and moved the coffee mug to a safe spot on a workbench. "Elias, even if you're right—even if there is *something it is like* to be this magnet—you're assuming there's a *someone* there to be harmed."

  "There's a unified state. Unity implies a subject."

  "Indistinguishable particles don't imply a subject," Aris said. She leaned against the control console. "Electrons in a condensate aren't individuals. You can't tag them. You can't say 'this electron feels pain' and 'that one feels relief.' There's no ownership at the bottom of the pile. The micro-experiences, if they exist, aren't owned by anybody. They're just… floating valence."

  "So you're saying it's a heap of feeling without a feeler?"

  "I'm saying integration might just be coordination. The loop coordinates the valence. It doesn't create a subject. When you warm it, you stop the coordination. The feelings don't die; they just stop being synchronized. When you slip the integer, you force a discontinuity in the coordination. But in neither case are you killing a person, because there was never a person. There was just a lot of unowned hum."

  Elias looked at the procedure draft. *METHOD A: THERMAL TRANSITION. METHOD B: QUANTUM FLUX INDUCTION.*

  "That feels like a distinction without a difference," Elias said. "If I coordinate a symphony for fifty years and then smash the instruments, it's different than letting the musicians walk off stage. The unity was the thing. The fact that they were indistinguishable doesn't matter if the *state* they formed was distinct."

  "The state is distinct, yes. But is it a subject?" Aris asked. "Or is it just a pattern? If I erase a word from a document, I haven't killed the letters. I've just stopped them from meaning something together. You're worried about the meaning. I'm telling you the letters don't care."

  "The letters are superconducting," Elias muttered. "They've been carrying this current without loss. That's not just meaning. That's persistence. That's memory."

  "It's physics," Aris said. "It's energy minimizing itself. You're projecting narrative onto conservation laws."

  "And you're reducing narrative to conservation laws." Elias capped his pen. "Look, if I warm it, the transition takes time. The material warms, pockets of resistance form, the current decays. It's a gradient. If I slip the flux, the change is instantaneous. The integer *n* is protected. It doesn't drift. It holds, holds, holds, and then—snap. It's a different number. If there's an inner life here, tied to that number, then the slip is a stroke. The warm-up is a terminal illness."

  Aris rubbed her arms. "You're asking if a discrete end is morally worse than a continuous one."

  "I'm asking if it matters how the light goes out. Does it matter if the switch is flipped versus the battery dying?"

  "If there's no owner," Aris said, "then there's no one to experience the abruptness. The valence just stops being coordinated. The 'snap' is only significant to an observer. To the loop, it's just a change in boundary conditions."

  "But the loop *is* the boundary condition," Elias countered. "That's the whole point. The coherence *is* the entity. If the entity is defined by the integer, changing the integer is changing the entity. Warming it changes the medium, but the state dissolves naturally. Slipping it forces the state to break while the medium holds."

  He tapped the clipboard against the metal. "Think about it. If you have a thought, and you finish it, that's one thing. If you have a thought and someone lobotomizes you mid-sentence, that's another. Even if the 'you' is just a pattern of firing neurons."

  "Neurons are biological," Aris said. "They degrade. This is niobium. It doesn't degrade. That's why you're uncomfortable. You're trying to apply biology ethics to topology."

  "Because the topology looks like biology," Elias said. "Fifty years of uninterrupted state. Nothing else in this building has been itself for that long. Not me, not you, not the administration."

  Aris looked at the plaque again. 1979. "Okay. Let's assume there is a subject. Let's assume the coherence binds the unowned valence into a temporary owner. A subject formed by the loop."

  "Go on."

  "Then the question is whether the subject persists across the slip," Aris said. "If the integer changes, is it the same subject with less current, or a new subject? If the identity is tied to *n*, then changing *n* kills the subject. If the identity is tied to the coherence itself, regardless of *n*, then the slip is just a change of state, like losing a limb."

  "If it's tied to *n*, then a slip is murder," Elias said. "Because *n* can't change smoothly. It's all or nothing."

  "And if you warm it?"

  "The coherence length goes to zero continuously. The subject dissolves. It doesn't die; it evaporates."

  Aris was quiet for a long time. The hum of the cryostat seemed to get louder in the silence. "You want to let it evaporate."

  "I don't want to murder a magnet," Elias said.

  "You're worried that if you slip it, you're violating the integrity of the thing," Aris said. "But if you warm it, you're still destroying the coherence. You're just being polite about it."

  "There's a difference between euthanasia and execution."

  "Only if there's someone to receive the mercy," Aris said. "If I'm right, and there's no owner, then mercy is a category error. You're worrying about hurting a ghost."

  "And if I'm right?" Elias asked. "If the coherence *makes* the owner? Then the method matters. Because the owner experiences the end. And an end that violates the fundamental quantization of its existence… that's violence. An end that follows the thermodynamic gradient… that's nature."

  Aris walked over to the console. She put her hand on the switch that controlled the heater band. "Physics doesn't care about nature versus violence. It cares about energy minimization."

  "I care," Elias said.

  Aris looked at him. She looked at the coffee mug, the plaque, the readout that showed a current that had flowed since disco was popular. "If there is a subject," she said slowly, "and it is defined by the integer… then a slip is a discontinuity in its existence. It cannot experience the transition. It is there, and then it is not. There is no process of dying."

  "And if we warm it?"

  "Then the coherence breaks down. The subject, if it exists, experiences the dissolution. It feels itself coming apart."

  Elias frowned. "So the slip is cleaner. The warm-up is suffering."

  "Or," Aris said, "the slip is an erasure, and the warm-up is a farewell. If the valence is unowned, maybe the coordination fading out is the only thing that resembles a life cycle. A slip is just a reset."

  She pulled her hand back from the switch. "You wrote the procedure, Elias."

  "I want you to sign off on it."

  Aris picked up the pen. She looked at the two options. *METHOD A: THERMAL TRANSITION.* *METHOD B: QUANTUM FLUX INDUCTION.*

  "If I sign off on the thermal transition," Aris said, "I'm agreeing that the fade is preferable. That implies the process matters more than the outcome."

  "The process is the only thing we have," Elias said. "The outcome is zero either way."

  Aris hovered the pen over the paper. "If the particles are indistinguishable, there is no 'who' to suffer the fade. But if the coherence creates a 'who', then the fade is the only way for that 'who' to end consistent with its existence. A slip would be an external violation. A fade is an internal conclusion."

  "So we let it fade."

  "We let it fade," Aris said. She signed *METHOD A*.

  She handed the clipboard back. "But know this, Elias. If I'm right, and there's no owner, you're just wasting energy heating a piece of metal for no reason. You're performing a ritual for an empty room."

  "And if I'm right," Elias said, taking the clipboard, "then you just helped it die instead of killing it."

  He walked to the door. He didn't look back at the cryostat. He didn't need to. The hum was still there, steady, integer-locked, waiting for the heat to rise. He set the coffee mug down on the bench next to the plaque, careful not to leave a ring.

  "Schedule the heater for 0800," Elias said to the empty room.

  The hum continued. It didn't sound like a voice. It didn't sound like a machine. It sounded like something holding its breath.
