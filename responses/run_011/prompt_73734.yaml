answer: |-
  Here is the brainstorming paragraph outlining the candidate readings I considered and rejected before settling on the analysis below.

  **Brainstorming Candidate Readings:**
  I considered five initial framings. First, a *Lamarckian/Acclimation* reading, where insects physiologically adjust to the toxin; I rejected this because the policy hinges on heritability and allele frequencies, not individual plasticity. Second, a *Pure Eradication* model, which treats the pest population as an enemy to be eliminated via closed boundaries; I rejected this because the refuge strategy explicitly requires preserving susceptible pests and encouraging migration, contradicting quarantine logic. Third, an *Intrinsic Dominance* view, where resistance is naturally recessive; I rejected this because the "high-dose" strategy is an engineering attempt to *make* it functionally recessive, acknowledging dominance is context-dependent. Fourth, a *Farmer-as-Biological-Agent* reading, where the farmer's planting choices directly alter insect genetics in a way that makes the farmer a unit of selection; I rejected this because the farmer is an economic unit whose behavior is managed via regulation, not a biological replicator. Fifth, a *Strict Gene's-Eye* view that ignores spatial structure; I rejected this because the policy fails without specific spatial arrangements (refuges), meaning the gene cannot be the sole unit without the demographic context. The viable reading is a *Multi-Level Selection* model: gene-frequency dynamics in the pest metapopulation coupled with economic selection pressures on human farming units.

  ***

  ### The Puzzles: Mixing vs. Quarantine and Two Selection Stories

  The tension you identify between area-wide suppression (which requires closed populations) and refuge logic (which requires open mixing) reveals that the regulatory framework does not hold a single, consistent view of pest ecology. Instead, it toggles between two ecological models depending on the tactical goal. Area-wide suppression treats the pest population as a *local deme* that can be starved of mates or resources if isolated. The refuge strategy, conversely, treats the pest population as a *panmictic region* where alleles flow freely. The practice presupposes a **metapopulation structure** where connectivity is high enough to ensure mating between refuge survivors and Bt survivors, but low enough that local selection pressure in the Bt field doesn't immediately swamp the refuge. The soft spot here is empirical: if migration is too low, the refuge doesn't dilute the resistance; if too high, the refuge gets exposed to selection pressure and loses its susceptibility. The policy assumes a "Goldilocks" zone of connectivity that rarely exists uniformly across a landscape.

  Regarding the two selection stories, the practice stacks a biological evolutionary model on top of a socio-economic evolutionary model.
  1.  **Biological Level:** The unit of selection is the **resistance allele**. The individual insect is merely the vehicle; the goal is to keep the frequency of the resistance allele low enough that resistant homozygotes rarely meet.
  2.  **Human Level:** The unit of selection is the **individual farmer's profit margin**. Planting a refuge is altruistic (costly to the individual, beneficial to the collective technology lifespan). The shift from hand-planted to blended refuge acknowledges that the farmer is a unreliable agent for maintaining the biological strategy. By moving the refuge into the seed bag, the regulator changes the *unit of enforcement* from the farmer to the seed company. It does not change the biological unit of selection (the allele), but it changes the *locus of control* over the evolutionary environment. The farmer is demoted from an active manager of evolution to a passive vector.

  ### Implicit Theory of Units of Selection

  The practice strictly requires a **gene-centric view embedded in a spatially structured population**. It is not enough that the gene is the unit of selection; the *deme* (local population) must be permeable. If the unit were strictly the individual insect, refuges would be nonsensical (why keep pests alive?). If the unit were the corporate pest population, refuges might be viewed as sustaining the enemy. The policy intelligibly rests on the **allele** as the unit of selection, but it treats the **landscape** as the mechanism of control.

  However, there is significant underdetermination here. The same acreage rules work whether you believe the pest population is a collection of individuals or a gene pool, provided the math of Hardy-Weinberg equilibrium holds. The policy is metaphysically agnostic about the "reality" of the population as long as the frequency dynamics are accurate. What it *does* commit to is the **heritability** of resistance. It rules out any view where resistance is acquired somatically. It also rules out a view where the pest population adapts as a **corporate whole** (group selection favoring the deme); if the deme adapted as a unit, diluting alleles via migration would be less effective than suppressing the deme's existence.

  ### The High-Dose Assumption and Dominance

  The "high-dose" requirement is the most philosophically laden component. It commits the agency to a **relational view of dominance**. Dominance is not treated as an intrinsic property of the allele (i.e., resistance is not naturally recessive); rather, dominance is an emergent property of the interaction between the genotype and the toxin concentration in the plant tissue. By engineering the plant to express more toxin, regulators are effectively *engineering the dominance relationship* to make resistance behave as if it were recessive.

  This sits uncomfortably with standard policy descriptions, which often speak of "managing resistance" as if it were a fixed trait. The practice quietly rules out the view that **dominance is intrinsic**. It also rules out a **strictly gene's-eye view** that ignores phenotypic expression levels; the gene alone doesn't determine survival, the gene *plus* the engineered environment does. This is a form of **niche construction**: humans are modifying the environment to alter the selection coefficient of the allele. The soft spot is evident in the rootworm failures you mentioned: when the dose isn't high enough (or the pest's tolerance is high enough), the allele behaves as dominant or additive, and the mathematical model collapses. The policy assumed it could dictate terms to the biology; the biology pushed back.

  ### Planted vs. Blended Refuge: Metaphysics or Enforcement?

  Does moving the refuge into the seed bag change the metaphysics? Biologically, no. The insect still encounters a mosaic of toxic and non-toxic tissue (or plants). The mating dynamics remain the same. However, sociologically and metaphysically regarding *agency*, it shifts the **unit of trust**.
  *   **Planted Refuge:** Assumes the farmer is a rational agent capable of altruism (or coercion). The farm is the unit of management.
  *   **Blended Refuge:** Assumes the farmer is a risk to the technology. The seed bag is the unit of management.

  This relocates the "altruistic act." In the planted model, the farmer sacrifices acreage. In the blended model, the seed company sacrifices seed purity (and potentially efficacy, if blending reduces the high-dose effect in mixed fields) to guarantee compliance. It hides the evolutionary management from the farmer, treating the landscape as a black box controlled at the factory. It doesn't change the unit of biological selection, but it dissolves the farmer as a participant in the evolutionary narrative. The farmer becomes mere noise in the system, whereas before they were a variable.

  ### Counterfactuals: What Would Change on the Ground?

  If we replaced the presupposed picture (gene-frequency management in a metapopulation) with the alternatives you proposed, the on-the-ground practices would shift radically.

  **1. A Group-Structured View (Pest Population as Corporate Unit):**
  If we viewed the pest population as adapting as a corporate whole (where the deme, not the gene or individual, is the unit of selection), the refuge strategy would be abandoned. You cannot dilute a group's adaptation with migrants if the group selects as a unit. Instead, management would focus on **area-wide eradication or strict isolation**.
  *   **Changes:** No refuges (preserving susceptible pests aids the enemy group). Strict quarantine lines between districts to prevent "infected" (resistant) demes from migrating to "clean" ones. Coordinated planting dates across entire regions to synchronize pest life cycles and maximize collapse. The focus shifts from managing allele frequencies to managing population existence and boundaries. Success is measured by local extinction, not allele suppression.

  **2. A Strict Individual Organism View (No Heredity/Frequency Logic):**
  If we treated the individual organism as the only thing that matters (ignoring heredity, future generations, or allele frequencies), the refuge practice becomes biologically nonsensical. Why plant non-toxic corn to keep pests alive?
  *   **Changes:** Elimination of all refuges. Maximization of toxin expression in 100% of acreage. The goal becomes immediate phenotypic kill of every individual present. Compliance would be measured by pest count reduction in the current season, not by resistance allele monitoring over years. This would likely accelerate resistance evolution (since any survivor reproduces without dilution), but it aligns with a philosophy that denies the relevance of population genetics.

  ### Soft Spots and Conclusion

  The practice rests on a fragile alignment of biological and social assumptions. Biologically, it assumes **random mating** between refuge and Bt survivors, which is often false (pests may prefer one host over the other, or flight distances may be limited). It assumes **high-dose recessiveness**, which is an engineered state that can degrade. Socially, it assumes that **blended seed** effectively mimics structured refuge without altering pest behavior (e.g., larvae moving between plants in a mix might experience a lower effective dose).

  The deepest philosophical tension is that the policy treats the pest as a **gene pool** to be managed but the farmer as an **economic agent** to be constrained. When the biology failed (rootworm resistance), it wasn't just a genetic failure; it was a failure of the model to account for the pest's actual ecology (continuous corn selection pressure) and the farmer's actual behavior (planting continuous corn). The shift to blended seed admits that the human unit of selection (the farmer) cannot be trusted to preserve the biological unit of selection (the susceptible allele). The practice works only as long as the engineered dominance holds and the landscape remains connected enough to mix, but not so connected that the refuge is lost. It is a gamble on the stability of both the genome and the grid.
