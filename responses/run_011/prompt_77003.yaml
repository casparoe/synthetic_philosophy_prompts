  # Non-Commutative Idealization: Path-Dependence in Preference Extrapolation

  **Research Question and Significance**
  This project asks a precise technical question with normative consequences: Does the order in which epistemic and character idealizations are applied to an agent's preference set determine the resulting idealized preferences? In other words, do the operators for epistemic improvement (more information, better reasoning) and character improvement (greater impartiality, reduced akrasia) commute?

  Standard theories in two distinct fields assume the answer is "no." In philosophy, idealized-desire accounts of well-being argue that what is good for an agent is what they would want if fully informed and rational. In AI alignment, Coherent Extrapolated Volition (CEV) proposes that safe systems should act on humanity's idealized preferences. Both traditions treat idealization as a convergence toward a unique fixed point—a single "true" preference set waiting to be uncovered. If my hypothesis is correct, this fixed point is an illusion. The endpoint is path-dependent. Because information acquisition is value-guided (we seek evidence relevant to what we already care about), idealizing cognition before character allows defective values to shape the evidence base. Consequently, the choice of extrapolation path is not a technical parameter but a substantive normative decision currently smuggled into system design and ethical theory.

  **Background and Theoretical Gap**
  Existing positions lack the resources to settle this because they model idealization as a static limit rather than a dynamic process. Philosophers typically describe the idealized agent as a limit case of the actual agent, assuming continuity. AI researchers often model volition extrapolation as an optimization process converging on a stable reward function. Both assume that given enough processing, the order of operations becomes irrelevant.

  This proposal addresses two specific objections preemptively. First, the familiar objection that idealization destroys identity (the "too far" worry) is distinct from the path-dependence worry. One can remain recognizably oneself while arriving at different endpoints via different routes; the issue is not distance from the actual self, but divergence between possible ideal selves.

  Second, I must address the objection that "limits commute." A decision theorist might argue that any sensible idealization is defined as a single joint limit over all parameters, and under standard continuity assumptions, such limits commute. This objection begs the question. It assumes the underlying valuation function remains stable during the idealization process. However, if epistemic improvement involves searching a hypothesis space, and the search heuristic is determined by current values (character), then the function itself changes during the operation. Epistemic idealization is not merely adding data to a static bucket; it is selecting which data enters the bucket. If character determines selection, then $E(C(agent)) \neq C(E(agent))$. This is not a topological limit on a static surface; it is a non-holonomic constraint on a learning trajectory. Neither current well-being theory nor alignment literature models this feedback loop, leaving the normative status of the extrapolation path unexamined.

  **Methodology and Defense**
  The method is conceptual analysis supported by structured case modeling. I will construct formal schemas for epistemic and character operators to demonstrate where commutativity fails, then test these schemas against detailed vignettes (e.g., the grievance-holding entrepreneur, the procrastinating musician).

  This approach is superior to three alternatives. Pure case-mongering is insufficient because without a formal schema for the operators, disagreements about cases remain intuitions versus intuitions. A full formal utility-theoretic model is risky; standard decision theory often builds path-independence into the axioms, thereby assuming the conclusion. I will use formal notation only to clarify structure, not to prove convergence. Finally, empirical work on preference change is inappropriate because the question is normative (which path *should* we choose?), not descriptive (which path do humans *actually* take?). Empirical data cannot resolve the normative validity of the idealization standard itself.

  **Expected Outcomes**
  A positive result demonstrates that distinct, plausible idealization paths yield divergent preference sets that are both internally coherent. This would prove that alignment researchers and ethicists must explicitly justify their chosen path. A negative result would show that under plausible constraints on rational learning, the operators converge regardless of order, vindicating the standard fixed-point assumption. The project fails only if the distinction between epistemic and character idealization proves incoherent or if the divergence is trivial (e.g., differing only on irrelevant preferences).

  **Scope and Feasibility**
  I am teaching one discussion section this term, which requires approximately four hours weekly. The grant also requires a public half-day workshop. If the modeling proves more complex than anticipated, I will scale back the workshop from a half-day to a quarter-day symposium focused on the core proof, and I will reduce the number of case studies from three to two. The core argument does not require exhaustive survey of the literature, but rather a targeted intervention on the structure of idealization.

  ***

  **Work Plan (Four Months)**

  **Month 1: Formalizing the Operators**
  *   **Activity:** Define the epistemic (E) and character (C) operators using state-space notation compatible with both philosophical logic and ML reward modeling. Identify the specific mechanism of non-commutativity (value-guided information search).
  *   **Artifact:** A technical appendix defining the operators and the conditions for non-commutativity.

  **Month 2: Case Construction and Testing**
  *   **Activity:** Develop two detailed case studies (the "Grievance" and the "Pianist"). Run the cases through the E-then-C and C-then-E models to generate divergent endpoints.
  *   **Artifact:** Two structured vignettes with annotated preference trajectories.

  **Month 3: Normative Implications**
  *   **Activity:** Analyze the normative consequences for AI alignment (which path minimizes risk?) and well-being theory (which path tracks welfare?). Draft the core argument paper.
  *   **Artifact:** Complete draft of the research paper (approx. 8,000 words).

  **Month 4: Workshop and Dissemination**
  *   **Activity:** Organize the half-day workshop. Invite two philosophers and one ML practitioner to critique the draft. Revise paper based on feedback.
  *   **Artifact:** Public workshop event and final revised manuscript ready for submission.
