answer: |-
  You have put your finger on one of the oldest, most persistent tensions in legal and political theory. You are describing the friction between **the Declaratory Theory of Law** and **Legal Realism**, often operationalized through a **Legal Fiction**.

  You are right that there isn't just one label, because the "carving" you noticed is the seam where law claims to be static (rules) while actually being dynamic (judgment).

  Here is the breakdown of the concept, where the line is drawn, why the denial happens, and how your three examples compare.

  ### 1. The Concept: "Finding" vs. "Making" Law
  The maneuver you are spotting is the claim that a decision is **interpretive** (finding what was always there) rather than **legislative** (creating something new).

  *   **The Declaratory Theory:** This is the old Blackstonian view (18th century). It holds that judges do not *make* law; they only *declare* what the law has always been. If a judge rules a certain way today, they are claiming they are uncovering a principle that existed yesterday, even if no one noticed it.
  *   **Legal Realism:** This is the modern counter-view (20th century). It holds that when rules run out or are ambiguous, judges *do* make new law. They just dress it up as interpretation to maintain the system's legitimacy.

  The specific rhetorical move you identified—insisting a new application is just a "clarification"—is often called **retroactive clarification**. In legal philosophy, when this is done knowingly to bridge a gap, it is a **Legal Fiction**. A legal fiction is an assumption made by the law that something is true (e.g., "this treaty implied criminal liability") which is known to be false or highly debatable, but is accepted to achieve a specific result.

  ### 2. Where is the Line?
  You asked where ordinary interpretation stops and "making new law" begins. There is no bright line, but there is a **test of reliance**.

  *   **Interpretation:** The old rule was vague, but a "reasonable person" could have anticipated this application.
      *   *Example:* A rule says "no vehicles in the park." A judge rules this includes bicycles. It's a stretch, but arguably within the spirit of "vehicles."
  *   **Legislation (disguised):** The old rule was specific or silent, and the new application violates "fair notice."
      *   *Example:* A rule says "no vehicles in the park." A judge rules this includes an ambulance rushing a patient. This changes the rule based on outcome, not text.

  The line is drawn at **Fair Notice**. If the person could not have reasonably known their conduct was punishable *at the time they acted*, then calling it "interpretation" is a lie. It is *ex post facto* punishment disguised as clarification.

  However, systems hate admitting this. Admitting you are making new law retroactively undermines the **Rule of Law**, which promises stability and predictability. So, authorities *must* claim they are just "finding" the rule, even when they are inventing it.

  ### 3. Is it a Genuine Difference or Just Dressing Up?
  It is both.

  **Why it's genuine:** Language is inherently ambiguous. No rule book can cover every scenario. When a new scenario arises (like a specific type of online harassment or a new method of warfare), authorities often genuinely believe the *spirit* of the old rule covers it. To them, writing a new rule feels redundant.

  **Why it's dressing up:** It is a legitimacy shield.
  *   **If they admit it's new:** They open themselves to charges of tyranny, unfairness, or "victor's justice." They admit the system wasn't perfect before.
  *   **If they claim it's old:** They preserve the myth that the system is complete, consistent, and timeless. It protects the authority of the institution.

  So, the "denial of newness" is a functional requirement of authority. An authority that admits it is making things up as it goes along loses its claim to objective judgment.

  ### 4. Nuremberg vs. Forum vs. HR: Difference in Kind?
  You asked if the war crimes trial differs from the forum ban. The **logic** is identical, but the **justification** and **constraints** differ.

  **The Forum and HR (Private/Contractual)**
  *   **The Basis:** These are contract disputes, not criminal law. When you join a forum or take a job, you sign an agreement that usually says "Rules as interpreted by management."
  *   **The Move:** HR and Mods use the "clarification" move to avoid administrative friction. If they admit they are making a new rule, they have to acknowledge they punished someone without a rule. By calling it "clarification," they shut down appeals.
  *   **The Stakes:** Low. Losing a forum account or a performance plan is not imprisonment.
  *   **Verdict:** This is standard administrative efficiency. It is technically "unfair," but contract law allows for broad discretion.

  **The Nuremberg Trials (International/Criminal)**
  *   **The Basis:** Criminal law requires *Nullum crimen sine lege* (no crime without law). You cannot hang someone for a crime that didn't exist.
  *   **The Move:** The defense was right: "Crimes Against Peace" (aggressive war) was not a hanging offense in 1939. The Kellogg-Briand Pact renounced war, but it didn't specify *criminal liability for leaders*.
  *   **The Justification:** The prosecutors (Jackson, et al.) faced a dilemma. If they said, "We are making this law up now because you are Nazis," it would look like victor's vengeance. If they said, "This law existed," they preserved the idea of International Justice.
  *   **The Difference:** Here, the "fiction" was a moral necessity. The conduct was so heinous that letting it go on a technicality was unacceptable, but punishing it without a law was also unacceptable. The "clarification" was a bridge to allow justice to happen where the law had lagged behind morality.

  ### Summary
  The shape you are noticing is the **Legitimacy Gap**.

  Rules are static; life is dynamic. When life outpaces rules, authorities have two choices:
  1.  **Admit the gap:** "We are punishing you under a new standard." (Honest, but looks arbitrary/tyrannical).
  2.  **Deny the gap:** "The old standard always meant this." (Dishonest, but preserves the Rule of Law).

  Almost all authorities choose option 2.

  In your HR and Forum examples, it's a bureaucratic convenience to avoid admitting error. In Nuremberg, it was a philosophical necessity to establish a new world order without admitting to show trials.

  The "line" you are looking for is **predictability**. If a reasonable person could not have predicted the punishment, it is new law. But because authorities rarely admit they are punishing the unpredictable, they wrap it in the language of "always having been the rule." You aren't imagining it; it is the primary mechanism by which legal systems evolve without admitting they are changing.
