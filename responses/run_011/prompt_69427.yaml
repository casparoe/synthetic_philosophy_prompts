answer: |-
  Dear Colleague,

  I appreciate you sharing this dilemma, as it touches on one of the most delicate points in the philosophy of set theory, where pedagogical clarity often risks distorting the metaphysical stakes. Your supervisor is right to be concerned, though I suspect the situation is more nuanced than a simple dismissal allows. The analogy between the parallel postulate and the continuum hypothesis is a classic trope for a reason, but like many classics, it accumulates baggage that can mislead students about the nature of mathematical truth. To help you decide how to proceed with your handout, I will walk through the correspondence you established, isolate the disanalogies that actually threaten your conclusion, and then assess whether the philosophical positions you mentioned rely on this historical parallel or stand on their own.

  Let us first make the correspondence explicit, as you requested, to see exactly where the machinery is supposed to align. In your handout, the role of ZFC is played by the axioms of neutral or absolute geometry, that is, Euclid's axioms excluding the fifth postulate. The continuum hypothesis corresponds to the fifth postulate itself, while its negation corresponds to the hyperbolic alternative. Gödel's constructible universe L plays the role of the standard Euclidean plane, serving as the minimal or canonical model where the hypothesis holds. Cohen's forcing extensions play the role of the Beltrami-Klein or Poincaré disk models, providing structures where the negation holds. The two relative-consistency results correspond to the geometric proofs that hyperbolic geometry is consistent if Euclidean geometry is, and vice versa. The plurality of equally legitimate geometries corresponds to the multiverse or pluralist conception of set theory, where no single universe is privileged. The question of which geometry describes physical space corresponds to the question of whether there is a single intended universe of sets V that settles the hypothesis. Finally, the resolution of the geometric debate, where mathematicians accepted multiple geometries as valid objects of study, corresponds to your proposed conclusion that we should accept CH as undecidable and merely a matter of axiomatic choice.

  This mapping is clean on the surface, but the disanalogies run deep, and we must separate those that are merely technical from those that undermine your philosophical conclusion. The technical imperfections are less damaging. For instance, it is true that hyperbolic models were constructed inside Euclidean geometry, whereas forcing extensions add sets to a countable transitive model. However, for the purpose of illustrating relative consistency, this direction of construction is irrelevant; all that matters is that one can build a model of the negation from a model of the affirmation. It also matters little that physical space provides an empirical arbiter for geometry while set theory lacks one, provided your conclusion is only about mathematical truth rather than physical application. The more serious disanalogies concern the intent of the theories and the status of the independence results. In the case of geometry, the axioms of neutral geometry were never intended to describe a unique structure; they were understood as a framework for various spatial possibilities. In set theory, ZFC is widely regarded, at least by realists, as an attempt to axiomatize a specific intended structure, the cumulative hierarchy V. When the parallel postulate was shown to be independent, it confirmed that the concept of space was broader than Euclid imagined. When CH is shown to be independent, it reveals a gap in our axiomatization of a concept that many believe is determinate.

  The most critical disanalogy, however, is the one your supervisor hinted at regarding the word model. In the geometric case, the different models represent different theories of space that are equally legitimate because the subject matter was always somewhat plastic. In set theory, the models produced by forcing and inner model theory are viewed by many practitioners as partial glimpses of a single reality, or as alternative universes in a multiverse, but the independence itself does not force the multiverse conclusion. The geometric debate closed because the mathematical community collectively decided to treat geometry as the study of manifolds rather than the study of the one true space. The set-theoretic debate has not closed; the existence of active research programmes aiming to settle CH via new axioms, such as forcing axioms or Woodin's Omega logic, indicates that the community does not universally accept that the question is merely a matter of choice. If the analogy were perfect, set theorists would have abandoned the search for a truth value for CH just as geometers abandoned the search for the true parallel postulate. The fact that they have not suggests that the analogy fails to capture the normative force of the intended interpretation of set theory. Furthermore, if independence from a finite axiomatisation entailed indeterminacy of truth, then by the same reasoning, the Gödel sentence for Peano Arithmetic would be indeterminate, and indeed any statement independent of a first-order theory would be. This would prove far too much, collapsing truth into provability for almost all substantial mathematics, a conclusion most philosophers of arithmetic reject.

  This brings us to what the comparison quietly imports. Your argument relies on the premise that if a theory has non-isomorphic models, its subject matter is indeterminate. This conflates the underdetermination of a theory by its axioms with the underdetermination of the concept itself. It assumes that ZFC exhausts the content of the concept of set, whereas most realists view ZFC as an incomplete description of a fixed domain. It also imports the idea that truth collapses into derivability from accepted axioms, ignoring the possibility that there are facts about V that transcend ZFC. Once these imports are made explicit, your conclusion survives only in a restricted form: you can claim that CH is independent of ZFC, and that choosing to adopt it or its negation is a matter of axiomatic preference for specific technical goals, but you cannot claim that there is no fact of the matter about CH in the intended universe without additional philosophical argument. The analogy establishes underdetermination by the current axioms, not ontological indeterminacy.

  Regarding the student's question about why set theorists continue to propose large cardinal and forcing axioms, the answer is that they do not all accept the geometric conclusion. Many believe that new axioms can capture more of the intended structure of V, much as adding axioms about completeness captures more of the intended structure of the real numbers. They are not failing to absorb the analogy; they are rejecting the inference from independence to indeterminacy. This leads to your final question about whether the routes to there is no fact of the matter depend on the geometric analogy. They do not. Feferman's position rests on the claim that the concept of an arbitrary subset of the natural numbers is inherently vague, so that CH lacks a truth value because the terms themselves are not sharp enough. This is a conceptual argument about the power set operation, not a structural argument about models. Similarly, the multiverse view, as championed by Hamkins, argues that there are many equally legitimate set-theoretic universes, so CH is true in some and false in others. This is a positive ontological claim about the plurality of V, not a skeptical conclusion drawn from the failure of ZFC to decide CH. Both positions stand or fall on arguments about the nature of sets and the power set operation, not on the historical precedent of non-Euclidean geometry. The geometry analogy is at best a heuristic illustration for these views, not their foundation.

  Given this audit, I judge the analogy unusable for the conclusion you drew, though it remains salvageable for the narrower point about relative consistency. If you wish to convey independence without conveying indeterminacy of truth, I propose replacing the geometry analogy with the analogy of the field axioms. The field axioms do not decide whether the characteristic is zero or prime, but we do not say there is no fact of the matter about the characteristic of the real numbers. We say the field axioms are incomplete descriptions of specific structures. This conveys that ZFC may be an incomplete description of V without implying that V itself is indeterminate. Alternatively, you might simply state that independence shows the axioms are incomplete, and leave the philosophical conclusion open for debate, noting that some mathematicians treat CH like the parallel postulate while others treat it like the Goldbach conjecture. If you must keep the geometry analogy, I suggest rewriting the conclusion to say that just as the discovery of non-Euclidean geometry expanded our conception of what counts as a geometry, the discovery of independence results has expanded our conception of what counts as a set-theoretic universe, without committing to the claim that there is no fact of the matter about the specific universe V that was originally intended. This wording preserves the historical parallel while respecting the live philosophical disagreement among practitioners.

  I hope this helps you navigate the seminar. The student's question was excellent precisely because it pierced the pedagogical shorthand to reveal the substantive disagreement underneath, and addressing that disagreement directly will likely be more fruitful than defending the analogy.

  Yours sincerely,

  A Colleague
