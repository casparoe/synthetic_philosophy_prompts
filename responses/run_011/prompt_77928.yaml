answer: |-
  **THE FREE STATE OF OMENIA**
  **LEGISLATIVE TURF CLUB**
  **OFFICIAL PROGRAMME | SESSION 40, DAY 112**

  **NOTICE TO PATRONS: THE NATIONAL WELFARE INDEX**
  The National Welfare Index (NWI) remains the sole metric for settlement. Ratified by popular vote at the Founding, the Index has never been amended. The formula is administered exclusively by the Handicapper's Office. Patrons are reminded that the Index means what the Office says it means. Note: Patron H. Vane (89) writes quarterly to view the formula; request denied per Standing Rule 1.

  **PARTICIPATION TIERS**
  1. **Values Ballot (Annual):** Each citizen's ballot counts once. Determines the goal.
  2. **Policy Markets (Daily):** Each patron's stake counts in proportion to their bankroll. Weighted Conviction ensures capital backs belief. The market settles the method.

  **RACE CARD**

  **RACE 1: BILL 404-A (INFRASTRUCTURE UPGRADE)**
  *Conditional Market.*
  **Eligibility:** Pass vs. Fail.
  **Weight:** Carry +0.04% NWI delta if Pass exceeds Fail projection.
  **Morning Line:** 6/4 (Pass) | 5/4 (Fail)
  **Post-Time:** 5/4 (Pass) | 6/4 (Fail)
  *Market moved on revised cost estimates.*

  **RACE 2: BILL 404-B (DENTAL SUBSIDY EXPANSION)**
  *Track Condition: Thin Liquidity.*
  **Morning Line:** 3/1 (Pass) | 7/2 (Fail)
  **Post-Time:** 9/1 (Pass) | 1/9 (Fail)
  *Closing price set by single late wager from Dr. A. Grist (General Practice). Authority advises: Price discovery remains valid regardless of volume. Depth is not accuracy.*

  **RACE 3: BILL 404-C (TAX SIMPLIFICATION)**
  *Settled.*
  **Result:** Pass.
  **Performance:** Enacted within 48 hours. Cost below projection. NWI uptake +0.12%.
  *An efficient outcome, settled cheaply and better than the Assembly of Year 39 would have managed.*

  **STEWARDS' INQUIRY**
  **Charge:** Mr. J. Sterling accused of buying up the price of Bill 401-F to move the bill.
  **Defense:** This is precisely how the track learns anything. Capital signaling belief alters price, which alters policy, which tests belief.
  **Ruling:** No foul. Intent is irrelevant to market signal. If the trader moves the price without moving the Index, he loses his stake. If he moves both, he is rewarded for coordination. Case closed.

  **SCRATCHINGS**
  **Bill 403-Z (Morality Clause):** No liquidity provider found.
  **Bill 403-Y (War Declaration):** Constitutional veto (Values Ballot restriction).

  **PHOTO FINISH: BILL 402-K**
  Passed by 0.001% NWI margin. Dispute: Did 'leisure time' count toward Index? Handicapper's Office ruled No. Market stands. Standing Rule: No market may be voided once resolved. Precedent: Bill 310 (Harvest) criterion ambiguity upheld Year 35. Patrons advised to read eligibility fine print.

  **PAYOUTS**
  To patrons holding 'No' on Bill 404-C: The nation won, your position lost. The difference went to the holders who were right. While your capital is depleted, the policy you opposed has increased the National Welfare Index. You have paid for a richer country. Take comfort in the dividend.

  **SIDEBAR: THE ORACLE'S EYE**
  *Legislative Forecasts by Tipster K. Vane.*
  **Q:** Why pay for information the track already has in the price?
  **A:** The price knows the aggregate. I know the nuance. The Handicapper's Office releases data at 0900; I release interpretation at 0855.
  **Tip:** Bill 405-A (Zoning). Back 'Pass'.

  **GENERAL CONDITIONS**
  All markets subject to Overround (Book 105%). Odds fractional. Settlement final upon Handicapper's certification. The Legislative Turf Club accepts no liability for systemic risk, definition drift, or sovereign insolvency. Bet responsibly. The State is watching.
