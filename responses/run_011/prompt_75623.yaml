answer: |-
  **Planning**

  Movement One (Arrival) carries Hume's claim that an inflow of specie is a disturbance that initially lowers prices relative to money. Movement Two (Interval) embodies the core Humean insight: the benefit lies in the lag before prices rise, stimulating industry and allowing real capital formation. Movement Three (Levelling) depicts the price-level adjustment and the outflow of money through the trade balance, restoring neutrality.

  The primary risk of didacticism lies with the Clockmaker. His model must remain a physical obsession rather than an authorial mouthpiece; his error regarding the sealed buckets must feel like a craftsman's hubris, not a textbook correction.

  Regarding your control-system reading: it is brilliantly precise but slightly over-mechanizes Hume. He emphasized the *psychological* stimulation of the "spirit of industry" during the influx—the optimism of merchants and workers—more than the hydraulic mechanics of flow. Additionally, while you posit a return to static equilibrium, Hume suggested a *continual* increase in money might sustain industry indefinitely, whereas your model implies a single shock absorbed by a stable system.

  ***

  **Arrival**

  The wreck happened on the bar during the equinox gale, a foreign brigantine driven sideways onto the teeth of the reef. By the time the sea settled, the hull was kindling, but the hold had coughed up its guts onto the sandbars. The salvager was the first man wading into the surf, hauling up ingots of copper and heavy bags of foreign coin that bore the profile of kings no one in the harbour knew. He brought the metal to the tide mill, where the great wheel turned the stampers that beat the brass tokens. The miller's widow gave the order to melt it down. She wanted the town fed, and the mill wanted its due.

  Within a fortnight, the stampers had beaten the foreign gold and copper into the familiar dull brass discs. The salvager's pockets were heavy, clinking with a weight that felt like luck. He walked into the store and asked for the best rum, the finest wool, and a new coat, slapping the tokens down on the counter without counting them. The storekeeper, seeing the shine of new metal, did not argue the price. The tokens moved from the salvager to the storekeeper, from the storekeeper to the grain merchants across the water, and back into the hands of the shipwrights and weavers.

  The clockmaker watched the first of these new discs change hands in the market square. He was a man who measured the world in escapements and gears. He saw the sudden plenty not as luck, but as pressure. He went to his workshop and began to assemble a tabletop model: a series of leaky wooden buckets arranged in a cascade, fed by a standpipe. He poured water into the top bucket. It filled, overflowed into the next, and drained away through a siphon at the bottom. He watched the flow with the intensity of a priest reading entrails. The town felt the weight of the brass in its pockets. For the first time in years, no one asked for credit. The scrip issued against future deliveries of flour was discounted less heavily by the larger merchants. There was a sense of expansion, as if the harbour itself had widened to accept the tide.

  **Interval**

  The interval lasted nearly two years, though no one counted it that way. They counted it in contracts signed, in looms installed, in the height of the breakwater. The salvager spent his share quickly, buying a new sloop and fitting it with rigging that cost three times the usual rate. He did not notice the price had risen; he only noticed that the rigging was available. The shipwright, a young man named Jory, found himself working from dawn until the light failed. The salvager's sloop needed caulking, and then the grain merchants wanted their hulls scraped. Jory was paid in tokens every week. At first, the pay was the same as always, but the work was steady. Then, six months in, the master shipwright raised the weekly wage, but only by a tenth, while the price of bread at the mill store had already risen by a quarter.

  Jory took the tokens to the store. The widow stood behind the counter, her face pale and tight. She lived on a ground-rent fixed in writing thirty years ago, a specific number of tokens delivered every quarter. The paper did not change. The ink did not fade. But the tokens she received bought less flour, less salt, less oil. She watched the salvager's wife buy silk ribbons with the same brass that she counted out to pay the mill hands. She tried to speak to the storekeeper about the price of grain, but he shrugged. The grain came from across the water, and the merchants there wanted more tokens for the same sacks. The widow's rent was fixed, but the world was not. She began to water down the soup. She stopped buying nails. She watched the tokens leave her hand and never return.

  The clockmaker invited his neighbours to see the model. He had refined it. The standpipe represented the wreck, the buckets the households, the siphon the trade across the water. "See," he said, turning the tap. "The water rises, it does work turning the little wheel here, and then it settles." He pointed to the buckets. "If we seal the joints," he said, tapping the wood, "we keep the water level high. We keep the work going." He believed the buckets could be sealed. He believed the town could hold the metal. The neighbours nodded, fascinated by the flow, by the little wheel spinning briskly while the water was high. They did not notice that the buckets were wood, and wood swells and shrinks, and that the siphon at the bottom was wider than the tap at the top.

  During this time, the town built. The breakwater was extended by fifty feet, the stones laid deep enough to withstand the winter gales that had previously swept the harbour clean. A weaver in the upper garret bought a second loom, paid for in full with tokens that felt easy to spend. He hired a boy from the fisheries to tend it, an apprenticeship fee paid up front in a year when coin was suddenly plenty. The shipwright Jory bought a better adze, one that held an edge longer, and he built a shed to keep his tools dry. These things were made of wood and iron and stone. They were not tokens. They remained when the tokens moved on. The shipwright felt richer, though he complained that the flour was dear. The weaver felt secure, though he noted the scrip was less trusted by the merchants across the water. The clockmaker oiled the model's wheel and watched it spin. He did not see the water level in the buckets beginning to drop, despite the tap still running. He thought the leak was in the joints, not in the design.

  The widow's ground-rent remained the same number of tokens. She sold her best dress to buy grain for the winter. She watched the salvager's sloop return with holds full of fish, sold at prices that made the men laugh. She did not laugh. She counted the tokens into the storekeeper's hand and watched him weigh the flour. It was less than the year before. She signed the receipt with a shaking hand. The paper did not change. The ink did not fade. But the loaf was smaller.

  **Levelling**

  The drain began quietly. The merchants across the water raised the price of grain and dried fish, demanding more brass for the same weight. The town needed to eat. The tokens flowed out across the water in exchange for sacks of wheat and barrels of salt fish. The salvager's sloop made fewer voyages; the grain merchants sent their own vessels. The clockmaker's model sat dusty on the workbench. The water in the standpipe had run dry weeks ago, and now the buckets were emptying through the siphon, one by one. The little wheel slowed, then stopped. The clockmaker tapped the sealed joints, looking for the leak, but the water was simply gone.

  The shipwright Jory found his wage reduced. The work was still there, but the master said the tokens were scarce, and the store said the flour was dear. He kept the shed and the adze, but the work was slower. The weaver kept the second loom, though it stood idle half the week. The breakwater held against the gale, and the stones did not wash away. The town ended with roughly the quantity of brass it started with, the tokens circulating at the same pace as before the wreck, the mill's mint silent for lack of copper to strike. The town was genuinely richer in what it built, the breakwater standing firm, the loom waiting in the garret, the shed dry against the rain. The widow sat in her kitchen, counting the quarterly rent into a purse that felt light, unable to afford the nails to fix the shutter that banged in the wind, permanently impoverished while the stone wall outside held back the sea.
