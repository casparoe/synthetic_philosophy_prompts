      *   It's basically "reward tampering" or "sensor hacking" but specifically where the signal *doesn't change*, just its correlation to reality. It's a form of Goodhart's Law. It does conceptual work: it distinguishes between breaking the sensor (wireheading) and breaking the *meaning* of the sensor. It's a strong term.

