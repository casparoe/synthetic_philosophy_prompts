  3.  **Evaluate Against Deflationary Theories:**
      *   *Core Deflationary Claim:* "True" is a logical device (disquotation, endorsement), not a substantive property. $P$ is true iff $P$.
      *   *Problem 1: Degrees of Truth.* Deflationism typically treats truth as binary. A proposition is true or it isn't. "Half True" is problematic.
      *   *Problem 2: Culpability.* "Pants on Fire" mixes truth value with speaker intent. Deflationism is about the sentence/proposition, not the speaker's psychology.
      *   *Problem 3: Fact/Opinion.* Deflationism needs a criterion for truth-aptitude. If "X is good" isn't truth-apt, deflationism can't apply the T-schema. This requires a prior meta-ethical or semantic commitment (cognitivism vs. non-cognitivism), which deflationism itself doesn't solve.
      *   *Problem 4: Clarifications.* If a statement is strictly true but misleading, deflationism says it's true. Journalism says it's defective. This suggests journalism cares about *assertoric propriety*, not just truth.

  4.  **Reconstructing the Newsroom's Implicit Theory:**
      *   It's not a single theory of *truth*. It's a hybrid theory of *assertoric propriety*.
      *   It mixes:
          1.  **Correspondence (naive):** Does it match the world? (Corrections).
          2.  **Graded Coherence/Completeness:** How much context is missing? (Half True).
          3.  **Pragmatics:** What does the listener infer? (Clarifications).
          4.  **Epistemic Virtue:** Did the speaker lie? (Pants on Fire).
      *   *Contradiction:* You can't have binary truth (Corrections) and graded truth (Fact-Check) operating on the same logical level without category confusion.

  5.  **Addressing the Deflationary Challenge:**
