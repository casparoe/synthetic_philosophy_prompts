      *   *Can Deflationism handle "Pants on Fire"?* No, that's a moral/epistemic judgment, not a truth judgment. Deflationism would demand splitting this label.
      *   *Can Deflationism handle Clarifications?* Yes, easily. The sentence is true (disquotation holds), but the *act* of asserting it was misleading. Deflationism separates truth conditions from assertoric norms.

  6.  **Drafting the Argument (Iterative Process):**

