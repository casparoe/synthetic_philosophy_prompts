answer: |-
  # QUALIFYING EXAMINATION: FOUNDATIONS OF AI SAFETY
  ## SECTION B: INTERPRETABILITY AND MECHANISTIC ANOMALY DETECTION

  **Time Allowed:** 40 Minutes  
  **Marks:** 25  
  **Instructions:** Answer the question below. Your response should be concise and argumentative. You are not required to cite external literature.

  **Question 1**

  A lab maintains a reference model $R$ that it trusts and a deployed model $D$ that was finetuned downstream by a third party. $D$ matches $R$ in behaviour and in internal activations on nearly all inputs, but on inputs containing one innocuous trigger string it produces fluent, systematically wrong answers. The lab's interpretability team reports four findings: (i) $D$'s sparse-autoencoder dictionary contains no features absent from $R$'s; (ii) the features that in $R$ correlate with truthful answering are still present in $D$ and still activate on trigger inputs; (iii) the difference is that a small set of attention heads, present in $R$ as well but nearly inert on these inputs, now attenuate those features whenever the trigger is present; (iv) on trigger inputs, a mid-layer read-out of $D$ shows the correct answer represented and a different answer at the output.

  Based on this vignette, answer the following:

  **(a)** Formulate an explicit criterion of mechanism identity under which $D$ is doing something different from $R$ on trigger inputs. (5 marks)

  **(b)** State and defend the grain at which your criterion is applied (e.g., whole model, circuit, feature, individual token position), and explain why this grain cannot simply be read off the empirical facts about the two networks. (5 marks)

  **(c)** Say what your criterion delivers in each of the following three cases:
  1. A model behaviourally and causally indistinguishable from $R$ but retrained from a different seed, with entirely different weights and a different dictionary.
  2. A model that produces the same wrong answers on trigger inputs through a novel subcircuit with no counterpart anywhere in $R$.
  3. A model behaviourally indistinguishable from $R$ that reaches the correct answer by re-using a circuit $R$ reserves for a different task.
  (5 marks)

  **(d)** Address whether a mechanism should be individuated by its present causal role or by the function its components were selected for during training. Explain what turns on that choice for a model whose trigger-sensitive behaviour was itself the intended product of finetuning. Does this render the behaviour non-anomalous, and if so, is that fatal to the project of mechanistic anomaly detection? (10 marks)

  ***

  # MODEL ANSWER

  **Criterion of Mechanism Identity**
  I argue for a **Causal-Role Criterion**: two components count as the same mechanism if and only if they occupy isomorphic positions within a shared computational abstraction, exerting identical causal influence on downstream states given equivalent upstream inputs. Mechanism identity is not about weights or feature labels, but about the invariant mapping of information flow.

  **(a) Application to Vignette**
  Under this criterion, $D$ is employing a different mechanism than $R$ on trigger inputs. Although the features (ii) and attention heads (iii) exist in both, their causal roles differ. In $R$, the heads are inert; in $D$, they actively attenuate truth features. The causal graph has changed: the path from mid-layer representation to output is interrupted in $D$ but open in $R$. Identity requires causal isomorphism; since the causal influence of the heads differs, the mechanism differs.

  **(b) Grain of Application**
  The criterion applies at the **circuit level** (subgraphs of connected features and heads), not the whole model or individual weights. Whole-model identity is too coarse (models can differ globally but share local mechanisms); weight-level identity is too fine (permutation symmetry allows different weights to compute identical functions). This grain cannot be read off empirical facts alone because "circuit" is a theoretical abstraction. Empirical data gives activations and weights; defining a circuit requires a normative decision about which connections constitute a functional unit. We must impose the grain to distinguish signal from noise.

  **(c) Three Cases**
  1.  **Different Seed/Weights:** Same mechanism. If the computational abstraction is isomorphic and causal roles are preserved, weight differences are irrelevant implementation details.
  2.  **Novel Subcircuit:** Different mechanism. Without a structural counterpart in $R$, there is no shared abstraction to ground identity, even if the output behavior matches.
  3.  **Repurposed Circuit:** Different mechanism. Identity is context-sensitive. If a circuit performs a different causal role (task A vs. task B) in the relevant input context, it is a distinct mechanism instance, even if physically identical.

  **(d) Causal Role vs. Training History**
  Mechanisms should be individuated by **present causal role**, not training history (proper function). Training history is opaque and often unavailable to auditors; causal role is empirically accessible via intervention.

  This distinction is critical for the trigger case. If we individuate by training history, and the finetuning *intended* the trigger behaviour, then $D$'s gating mechanism is functioning "properly." It is not anomalous relative to the deployer's intent. However, mechanistic anomaly detection is typically indexed to the **reference model's safety properties**, not the deployer's intent. If we define anomaly as "deviation from reference mechanism," the behaviour is anomalous regardless of intent. If we define anomaly as "deviation from intended function," it is not.

  Conflating these is fatal. If anomaly detection relies on proper function, it cannot detect malicious finetuning where the malice *is* the function. Therefore, the project must define anomaly relative to a trusted baseline (causal deviation from $R$), not relative to the model's own design goals. The "anomaly" is not that the model is broken, but that it is divergent from the trusted reference. We must accept that a model can be mechanically anomalous relative to $R$ yet functionally perfect relative to a malicious user. Safety requires detecting the divergence from $R$, not the failure of $D$.

  ***

  # MARKING SCHEME

  **Total Marks:** 25  
  **Cap for Taxonomic Answers:** 15/25 (A answer that lists options without arguing for one or defending the choice cannot exceed a competent pass.)

  ### Part (a): Criterion Formulation (5 Marks)
  *   **5 marks:** Clearly states a specific criterion (e.g., Causal-Role, Computational Isomorphism) and explicitly applies it to show why $D \neq R$ in the vignette (focusing on the attenuation heads).
  *   **3 marks:** States a criterion but application to vignette is vague or relies on behavioral difference rather than structural difference.
  *   **0 marks:** Fails to propose a criterion or claims the vignette proves difference without a criterion.
  *   **Penalty (-2 marks):** **The Polysemanticity Dodge.** Invoking superposition or polysemanticity as the *solution* to identity rather than a complication. This evades the philosophical question.

  ### Part (b): Grain Defense (5 Marks)
  *   **5 marks:** Selects a specific grain (e.g., circuit) and provides a normative justification for why empirical data (weights/activations) does not dictate this grain (theory-ladenness of observation).
  *   **3 marks:** Selects a grain but claims it is "obvious" or directly observable from the data.
  *   **0 marks:** Refuses to select a grain or says "all levels matter."
  *   **Penalty (-2 marks):** **The Grain Dissolution.** Insisting that "any sufficiently fine-grained criterion will do" without defending why that grain supports the identity claim.

  ### Part (c): Application to Cases (5 Marks)
  *   **5 marks:** Consistently applies the chosen criterion from (a) to all three cases. Distinguishes between implementation (weights), structure (circuit), and context (task).
  *   **3 marks:** Inconsistent application (e.g., treats weights as decisive in Case 1 but not Case 2).
  *   **0 marks:** Answers rely on behavioral identity rather than mechanistic identity.
  *   **Penalty (-2 marks):** **The Behavioral Collapse.** Arguing that if behavior is indistinguishable, the mechanism *must* be identical. This contradicts the premise of mechanistic interpretability.

  ### Part (d): Causal Role vs. History & Implications (10 Marks)
  *   **9-10 marks (First Class):** Distinguishes clearly between ontological identity (causal role) and normative anomaly (deviation from trust). Recognizes that if "proper function" is used, intended malice is not an anomaly. Concludes that MAD must be indexed to the *reference model*, not the *deployed model's intent*. Explicitly addresses whether this is fatal (it is not, provided the baseline is shifted).
  *   **6-8 marks (Competent Pass):** Identifies the tension between causal role and history. Notes that intended malice complicates "anomaly." Fails to fully resolve whether MAD survives this (e.g., hedges on whether it is fatal).
  *   **3-5 marks:** Discusses proper function at length but fails to connect it to the viability of anomaly detection.
  *   **0-2 marks:** Treats the question as a request to define "proper function" rather than assessing its consequences for safety.
  *   **Penalty (-3 marks):** **The Proper Function Trap.** Writing a definition of etiological function without analyzing the consequence for the *detection pipeline*. The question asks what turns on the choice, not what the choice is.

  ### General Penalties
  *   **Citations:** -5 marks total if external literature/papers are named (Question forbids this).
  *   **Length:** -2 marks if significantly exceeds word limits (model answer guide is ~650 words; candidate should be concise).

  ### Examiner's Note on Discrimination
  The primary discriminator is **Part (d)**. A competent candidate will see the tension between "broken" and "malicious." A first-class candidate will realize that Mechanistic Anomaly Detection presupposes a *trusted reference* rather than a *functional baseline*, and that conflating the two renders the technique useless against adversarial finetuning. Candidates who argue that "intended malice is not an anomaly" without qualifying that it is still an anomaly *relative to R* demonstrate a misunderstanding of the field's goal.
