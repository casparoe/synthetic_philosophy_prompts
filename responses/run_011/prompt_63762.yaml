answer: |-
  It is a pleasure to address a colleague who brings the rigor of experimental physics to the often-abstract disputes of decision theory. Your intuition is not merely stubborn; it is mathematically defensible within the context of series convergence, and your analogy to the Cauchy Principal Value in physics is astute. However, the verdict against the Pasadena game rests on principles that are specific to the *normative* aims of decision theory, rather than the *descriptive* aims of calculus.

  You ask for the principled reason why expectation must be invariant under re-listing, rather than fixed by the game's delivery order. There are three such principles: **Description Invariance**, the **Measure-Theoretic Definition of Integration**, and the distinction between **Temporal Process vs. State Space**.

  Here is the breakdown of why the standard verdict holds, and where your intuition actually finds a home in modern literature.

  ### 1. The Principle of Description Invariance
  In physics, if you rotate a coordinate system, the physical quantity (e.g., energy, momentum) should not change. In decision theory, the equivalent is **Description Invariance**: if two gambles are probabilistically isomorphic (i.e., they map states of the world to outcomes with identical probabilities), they must have the same value.

  The "order" you identify ($n=1, 2, 3 \dots$) is an indexing of the sample space $\Omega = \{H, TH, TTH, \dots\}$. While the *tossing process* is temporal, the *valuation* of the gamble is ex-ante. You are not receiving a stream of payments $\$x_1, \$x_2, \dots$; you are receiving a *single* payment determined by the state $\omega \in \Omega$.

  If we allow the value of the gamble to depend on how we index the elements of $\Omega$, we violate Description Invariance. I could present you with the exact same Pasadena game but label the outcome "TH" as index 1 and "H" as index 2. Mathematically, this is a bijection of the sample space. Probabilistically, nothing has changed. Physically, the coin behaves the same. Yet, if expectation depends on summation order, I could alter the value of the gamble simply by shuffling the rows in the payoff table. Decision theory demands that value be a property of the probability measure and the payoff function, not of the administrator's filing system.

  ### 2. The Lebesgue Integral vs. The Riemann Sum
  Your background in beam diagnostics likely makes you comfortable with Riemann integration, where limits and ordering of partitions matter, and where the Cauchy Principal Value is a standard tool for handling singularities or infinite domains.

  However, modern probability theory (Kolmogorov, 1933) is built on **Lebesgue integration**. In Lebesgue theory, the integral $\int X \, dP$ is defined only if $\int |X| \, dP < \infty$ (absolute convergence). If the integral of the absolute value is infinite, the expectation is **undefined**, not because we lack a summation method, but because the quantity does not exist as a stable measure.

  Why this strictness? Because the Lebesgue integral is designed to handle limits of functions and convergence theorems (like the Dominated Convergence Theorem) that are essential for the Law of Large Numbers. If we allow conditionally convergent expectations, the Law of Large Numbers fails. If you play the Pasadena game $N$ times, the average payoff does *not* converge to $\ln 2$ as $N \to \infty$. It fluctuates wildly. Therefore, $\ln 2$ is not a reliable predictor of long-run behavior, which is the primary pragmatic justification for using expectation in decision theory.

  ### 3. Process Time vs. State Indexing
  This is the crux of your physics analogy. In your field, when you integrate a signal over time $\int_{-\infty}^{\infty} S(t) \, dt$, the variable $t$ represents physical chronology. The symmetric limit $\lim_{T\to\infty} \int_{-T}^{T}$ is justified because the signal exists continuously in time, and the symmetry reflects a physical property of the measurement window.

  In the Pasadena game, $n$ is **not** a time variable for the accumulation of wealth. It is an index of mutually exclusive possibilities. You do not win the payoff for $n=1$, then $n=2$, then $n=3$. You win *exactly one* of these payoffs. Therefore, there is no physical "stream" to sum over time. The summation $\sum P(n) X_n$ is a calculational tool to find the center of mass of the probability distribution, not a record of cash flow.

  Because the outcomes are mutually exclusive states rather than sequential deposits, there is no physical justification for privileging the natural ordering ($1, 2, 3\dots$) over any other ordering. The "natural" order is merely a property of the integers we use to label the toss count, not a property of the value itself.

  ### 4. A Validation of Your Intuition: Weak Expectation
  While the standard verdict is that the game has no *strong* expectation, your intuition that $\ln 2$ is significant is actually supported by recent work in decision theory.

  In 2008, Kenny Easwaran distinguished between **Strong Expectation** (the standard Lebesgue integral) and **Weak Expectation**.
  *   **Strong Expectation:** Requires absolute convergence. (Pasadena: Undefined).
  *   **Weak Expectation:** Defined by the limit of the average payoff over many independent trials. Formally, if $S_N$ is the sum of payoffs from $N$ games, does $S_N / N$ converge in probability to a value $V$?

  For the Pasadena game, the average payoff *does* converge in probability to $\ln 2$. Easwaran argues that for many decision-theoretic purposes, the Weak Expectation is sufficient. This validates your calculation: $\ln 2$ is the correct "Weak Expectation."

  However, the "received verdict" you cite usually refers to the Strong Expectation because standard decision axioms (like those of von Neumann-Morgenstern or Savage) rely on the Strong Expectation to guarantee that agents cannot be money-pumped and that preferences remain consistent under compound lotteries.

  ### Summary
  You are not wrong to calculate $\ln 2$. You are calculating the **Weak Expectation** using the natural ordering of the sample space. However, the standard decision-theoretic verdict declares the **Strong Expectation** undefined for two principled reasons:
  1.  **Invariance:** Value should not depend on the arbitrary indexing of mutually exclusive states (Description Invariance).
  2.  **Stability:** The value should predict long-run averages (Law of Large Numbers), which $\ln 2$ fails to do for single-play valuation in the absence of absolute convergence.

  Your instinct mirrors the physicist's reliance on the Cauchy Principal Value: it is a useful regularization of a divergent quantity. But just as a physicist distinguishes between a Principal Value and a true convergent integral when assessing energy stability, a decision theorist distinguishes between Weak and Strong Expectation when assessing rational choice. The game has a Weak Expectation of $\ln 2$, but no Strong Expectation.

  **Reference:**
  Easwaran, K. (2008). "Strong and Weak Expectations". *Mind*, 117(467), 633–641.
