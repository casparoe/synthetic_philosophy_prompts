  ### Smuggling & Indistinguishability Notes

  **Smuggling Admissions:**
  *   **Node 1:** "Story about the physical mechanism" primes the Dissolutionist/Physicalist view over the Formalist view. A pure Formalist might say "The instruction *is* the mechanism."
  *   **Node 3:** "Force exactly one unique winner" assumes the student understands "invariance" as a tie-breaking tool, which hints at the Objectivist position.
  *   **Node 5:** "No probability until..." smuggles in the Frequentist/Dissolutionist constraint. A Propensity theorist might say the probability exists in the setup even if unknown.
  *   **Node 6:** "Physical feature" primes Propensity Realism. A Humean might reject "dispositions" entirely.

  **Indistinguishability:**
  *   **Dissolutionist vs. Collective:** Both deny a probability exists without a mechanism. The tree separates them by whether they view the answers as "different questions" (Dissolutionist) or "no fact of the matter" (Collective), but in practice, these often collapse into the same advice: "Specify the experiment."
  *   **Objectivist vs. Physics Washout:** If the physical mechanism happens to align with the symmetry argument (e.g., a well-mixed spinner), the Objectivist and Washout views yield the same betting behavior. They only diverge on *why* the answer is correct (Math vs. Physics).
  *   **Subjective vs. Imprecise:** A Subjective Bayesian with a very wide prior looks behaviorally identical to an Imprecise Probabilist. They only diverge if forced to update; the Imprecise view allows remaining vague, the Subjective view eventually demands precision.

  **Vacant Combos:**
  *   **N1:Picture + N2:Different Questions:** If the geometry is complete, there is only one question. Claiming the answers address different questions implies the geometry was *not* complete.
  *   **N3:Unique + N4:Range:** If you believe symmetry forces a unique solution, adopting a range is inconsistent with that belief.
  *   **N6:Confidence + N7:No Bet:** Standard Bayesianism requires coherence between belief and betting odds. Refusing to bet on a single-number belief invites a Dutch Book.
  *   **N1:Mechanism + N3:Unique:** If you insist a physical mechanism is required, appealing to abstract circle symmetry to find a unique answer is contradictory.
