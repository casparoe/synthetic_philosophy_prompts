    "nodes": [
      {
        "id": "N1",
        "question": "To fix the odds, is the picture of the circle and the instruction 'choose at random' enough, or do you need a story about the physical mechanism (e.g., how the chord is thrown)?",
        "options": [
          {
            "answer": "The picture is enough.",
            "next": "N2"
          },
