              *   Freedom and Blame (Determinism/Free Will vs. Adequate Causation/Ethics).
          3.  Test the user's distinction: 'Substantialist' vs. 'Structuralist' reverence.
          4.  Verdict: Specific coincidences, truncations, costs (especially regarding punishment), and Spinoza's view on Einstein's late private letters.
