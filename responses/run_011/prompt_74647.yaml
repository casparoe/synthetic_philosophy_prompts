answer: |-
  This is the "Wrong Kind of Reasons" (WKR) problem, and you are reenacting a debate that has occupied meta-ethicists for twenty years (Scanlon, Parfit, Hieronymi, Schroeder, etc.). Your roommate is playing the "Buck-Passing" skeptic; you are trying to defend a "Fitting Attitude" analysis of value. The reason you are going in circles is that the standard definitions are either too loose (letting the demon in) or too strict (killing the friend's haircut).

  Here is a principle designed to cut the knot, followed by the cost of using it.

  ### The Principle: The Constitutive Fittingness Constraint

  **A consideration $C$ is a Right Kind of Reason (RKR) for an attitude $A$ toward an object $O$ if and only if:**
  1.  **Constitutive Aim:** $C$ bears on whether $O$ satisfies the *constitutive standard of correctness* for attitude $A$ (e.g., truth for belief, danger for fear, merit for admiration); **OR**
  2.  **Normative Relation:** $C$ cites a normative relationship between the agent and $O$ (e.g., friendship, kinship) that *modifies* the constitutive standard of correctness for $A$ in this specific context.

  **A consideration $C$ is a Wrong Kind of Reason (WKR) if and only if:**
  $C$ bears on the *benefits or costs of holding* attitude $A$, without bearing on whether $O$ merits $A$ under the relevant standard (constitutive or relational).

  ---

  ### What the Clauses Do

  *   **Clause 1 (Constitutive Aim):** This blocks the Demon (Case 1) and the Money/Play (Case 2). The demon's threat does not make the mud *meritorious*; it makes admiring the mud *prudent*. It targets the state of holding the attitude, not the object's fit with the attitude.
      *   *Delivers Verdicts:* 1, 2, 5, 6.
  *   **Clause 2 (Normative Relation):** This saves the Friend's Haircut (Case 3) and the Dying Man (Case 4). Friendship is not an external incentive like money; it is a normative context that changes what counts as "fitting." In friendship, "supporting her joy" becomes a merit-relevant property of the haircut *for you*. It is not that the haircut is objectively better; it is that the *standard for fitting admiration* is lower or different within the relationship.
      *   *Delivers Verdicts:* 3, 4, 8.
  *   **The WKR Definition:** This clarifies that WKRs are real reasons, but they are reasons *to want* or *to try* to have the attitude, not reasons that make the attitude correct.
      *   *Delivers Verdict:* 10 (Saves "Admirable iff Reason to Admire" by restricting it to RKRs).

  ---

  ### The Sacrifice: Which Two Verdicts This Costs You

  You asked for a simple account that might cost two verdicts rather than a baroque one that saves all of them. To make this principle precise, you must concede that **Case 7 (Toxin)** and **Case 9 (Self-Management)** are not actually WKR problems. They are problems about *voluntary control*, not reasons.

  1.  **Case 7 (The Toxin Puzzle):** You must concede this is **not** a WKR case. The reason you can't form the intention isn't that the money is the "wrong kind" of reason; it's that intention formation has a *structural constraint* (you cannot intend what you know you won't do). The money is a WKR for *wanting* to intend, but the impossibility is logical, not normative.
      *   *Why spend this?* If you keep this as a WKR case, you confuse *justification* with *psychological possibility*. Dropping it clarifies that WKR is about normative force, not causal power.
  2.  **Case 9 (Self-Management):** You must concede this is **not** a WKR case. This is about *indirect vs. direct control*. Buying shoes is a causal strategy to change your desires so that you have *Right Kind Reasons* (e.g., running becomes enjoyable). Deciding on the spot is trying to bypass reasons entirely.
      *   *Why spend this?* Keeping this in the WKR bucket conflates *managing your reasons* with *having reasons*. Dropping it lets you say: "Self-management is how we cultivate RKRs; it's not a competition between RKR and WKR."

  If you drop 7 and 9, the principle above handles 1–6, 8, and 10 cleanly.

  ---

  ### Addressing Your Specific Questions

  #### 1. Does it have to be attitude-relative?
  **Yes, and that is not a defect.**
  The principle relies on the "Constitutive Aim" clause. Different attitudes have different aims.
  *   **Belief:** Aims at Truth. (Money cannot make a proposition true, so it's always WKR).
  *   **Fear:** Aims at Danger. (A threat makes holding fear prudent, but if the spider is harmless, the spider lacks the property of danger. So it's WKR).
  *   **Admiration:** Aims at Merit/Value.
  Because the *test* for whether a reason is "Right" depends on what the attitude is *for*, the application must be relative. However, the *meta-principle* ("Does this bear on the standard of correctness?") is uniform.

  #### 2. Which of the three ontological readings is right?
  You asked whether WKRs are:
  1.  Reasons for a different attitude.
  2.  Reasons of a genuinely second-tier kind.
  3.  Not reasons at all.

  **The correct reading is #1: Reasons for a different attitude.**
  This is the only way to save your Motive (Case 10).
  *   If WKRs are *not reasons at all* (#3), your roommate is right that you are just defining words to protect a theory.
  *   If WKRs are *second-tier reasons* (#2), you admit there are two kinds of reasons to admire, which weakens the link between "Admirable" and "Reason to Admire."
  *   If WKRs are **reasons to *want* to admire** (#1), you preserve the biconditional.
      *   *Statement:* "The mud is admirable iff there is a Right Kind Reason to admire it."
      *   *Demon Case:* The demon gives you a reason to *want to admire* the mud. He does not give you a reason that makes the mud *admirable*.
      *   This matches your intuition in Case 1 perfectly ("reason to want to want") and stops the roommate from claiming you are denying the existence of the reason. You are just classifying its *target*.

  #### 3. How to handle the Roommate's "Defense Racket" Charge
  Your roommate claims you are redefining "reason" to save the theory that "Value = Reason to Respond."
  **Counter-move:** You are not redefining reason; you are distinguishing the *object* of the reason.
  *   Tell him: "I agree the demon gives me a reason. I disagree about *what* it is a reason for. It is a reason for *action* (or for a second-order desire), not a reason for the *attitude* itself. If you say the demon gives me a reason to admire the mud, you cannot explain why admiring the mud is still *unfitting* even when I do it. My distinction explains why I can be rational to admire the mud (pragmatically) but still be making an error in taste (normatively). Your view collapses that distinction."

  ### Summary of Application to Your Cases

  *   **1 (Demon):** WKR. (Fails Clause 1 & 2). It is a reason to *want* to admire.
  *   **2 (Play):** WKR. (Fails Clause 1 & 2). Money doesn't make it funny. (Note: If exposure makes it funny, that's a causal change in merit, not a reason).
  *   **3 (Haircut):** RKR. (Satisfies Clause 2). Friendship modifies the standard of fittingness.
  *   **4 (Figurine):** RKR. (Satisfies Clause 2). Compassion/Relationship modifies the standard.
  *   **5 (Belief):** WKR/No Reason. (Fails Clause 1). Money doesn't make it true. Belief is less permeable to WKR because it is less voluntary.
  *   **6 (Fear):** WKR. (Fails Clause 1). Threat doesn't make spider dangerous.
  *   **7 (Toxin):** **SACRIFICE.** Not a WKR case; a structural impossibility of intention.
  *   **8 (Person vs Property):** RKR/WKR split. Admiring brilliance fits the merit of the skill. Admiring the monster violates the moral standard constitutive of admiring a *person*.
  *   **9 (Self-Management):** **SACRIFICE.** Not a WKR case; a case of indirect causal control vs. direct normative judgment.
  *   **10 (Motive):** Saved. "Admirable" tracks RKRs only. WKRs are reasons to *bring about* admiration.

  ### Final Advice
  Stop trying to prove WKRs don't exist. Concede they exist, but insist they are **reasons to want/try**, not **reasons that make fitting**. This grants your roommate the "reason" (satisfying his pragmatism) while keeping the "fitting" (satisfying your value theory). If he insists that a reason to *want* to admire is the same as a reason *to* admire, ask him: "If I admire the mud because of the demon, have I made a mistake in judgment?" If he says no, he's lost the plot on value. If he says yes, he needs your distinction to explain what the mistake is.
