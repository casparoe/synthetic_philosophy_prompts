      *   *View 2: Constitutive Panpsychism (Diachronic Bonding).* We posit a bonding relation that links micro-subjects at $t_1$ to micro-subjects at $t_2$. *Cost:* How does a relation hold between non-existent relata? If the $t_1$ micro-subject ceases to exist, what is the relation binding to? This violates standard mereology/causation constraints.
