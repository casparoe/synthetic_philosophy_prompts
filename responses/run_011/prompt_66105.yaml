prompt: |-
  I'm a third-year in a political philosophy seminar on equality and public policy, and separately I co-host a podcast our department runs out of a storage room off the library — maybe 400 listens an episode, almost all students. The person we've booked for next week is a legal philosopher who defends group quotas on grounds that barely show up in the usual fight, and I'm the one writing the questions. Her position, as I understand it from a seminar reading: bodies that make decisions get drawn from a narrow demographic slice, and because of that they systematically fail to notice facts and interests that actually bear on the decisions; a quota is the cheapest reliable fix for that blind spot; and the whole justification is about the quality of the output, so she rejects the compensation/reparations story, thinks the role-model story is nowhere near strong enough to license legal coercion, and argues that outreach-plus-holistic-review programs only tinker with the pipeline years downstream while leaving the deliberating body itself homogeneous.

  Give me nine or so questions that engage that machinery rather than letting her restate it. I want at least one on the empirical premise — the studies of Norway's 40% board quota I could dig up are pretty mixed about whether firm decisions or performance moved much, and the quota ended up stacking directorships onto a fairly small group of women who sat on many boards at once, which seems like a direct problem for a rationale whose whole point is getting missing perspectives into the room. One on who inside the group actually benefits — Indian reservation policy has the creamy-layer exclusion for exactly this worry, and I dont see how her account avoids needing something like it, since the epistemic argument only goes through if the people filling the seats are the ones who would otherwise be absent. One on symmetry: what does her principle say about a quota she'd oppose, like seats reserved for a religious minority, or for men in primary-school teaching? One on stigma, since she claims the burden of proof runs the other way there — how does she separate a legitimate worry about qualifications from an illegitimate one without just assuming the thing at issue? One on exit: if the defect is fixable, the quota should lapse once it's fixed, so how would anybody know when? And one on the US after the Supreme Court killed race-conscious admissions — her view looks like it makes blunt percentage quotas *more* defensible now than the individualized diversity rationale everyone used to lean on, which is backwards from the standard legal intuition, and I want her to either own that or explain why it doesn't follow.

  For each one, add the follow-up I should have ready for the answer she'll most plausibly give. I've read enough of her to know she'll reach for the line that a quota isn't a bet on the data but a hedge against our not knowing what we're missing, so build the sequence so that at least one question can't be survived with that hedge. Nothing generic — no "what drew you to this work," no question that's secretly a request for a reading list or a pile of citations, since we're recording and I'd have to cut it anyway. And at the end, in two or three sentences, tell me which single question to save for last if we're running out of time, and why that one does more work than the others.
