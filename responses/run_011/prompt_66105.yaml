answer: |-
  1. **The Empirical Premise (Norway)**
  You ground the justification in epistemic output, not reparations, so the empirical claim matters: does diversity actually change decisions? The studies on Norway's 40% board quota are mixed on performance, and critics note the quota stacked directorships onto a small elite of women who sat on many boards at once. If the same ten women sit on fifty boards, haven't you just swapped one homogeneous elite for a slightly larger, still homogeneous elite, leaving the blind spot intact?
  *Follow-up:* If she says the mere presence changes the culture: "Doesn't the stacking data suggest the market treated them as tokens to check a box rather than distinct epistemic agents, which undermines your claim that the *quality* of deliberation improves?"

  2. **Internal Distribution (The Creamy Layer)**
  Indian reservation policy uses a "creamy layer" exclusion to ensure quotas benefit the disadvantaged within the group, not just the privileged. Your epistemic argument only works if the people filling the seats hold perspectives otherwise absent. How does your account avoid needing a class filter, since a wealthy woman from a legacy family might share the same blind spots as the wealthy men she replaces?
  *Follow-up:* If she says identity correlates with experience regardless of class: "Then you're arguing that a wealthy woman knows more about poverty than a wealthy man solely due to gender. What's the mechanism for that knowledge transfer that doesn't rely on essentialism?"

  3. **Symmetry and Scope**
  If the justification is purely about breaking homogeneity to improve decision quality, what does your principle say about quotas you'd intuitively oppose? Should there be seats reserved for religious conservatives on university committees, or for men in primary-school teaching, if their absence creates a blind spot for half the population?
  *Follow-up:* If she says those groups don't suffer the same historical exclusion: "But your justification rejects compensation and reparations. If the only metric is epistemic blind spots, why does history matter for the *selection* criterion rather than just the *remedy*?"

  4. **Stigma and Qualifications**
  You argue the burden of proof runs the other way on stigma, but listeners will hear "quota" and wonder about competence. How do you separate a legitimate worry about qualifications from an illegitimate one without just assuming the thing at issue—that the quota members belong there on merit?
  *Follow-up:* If she says stigma is a social construct we must ignore: "Ignoring it doesn't make it go away. If the stigma undermines the quota member's authority in the room, doesn't that actively degrade the epistemic quality you're trying to protect?"

  5. **US Legal Context (Post-SFFA)**
  After the Supreme Court killed race-conscious admissions, the legal intuition is that blunt quotas are less defensible than individualized holistic review. But your view makes blunt percentage quotas *more* defensible now than the diversity rationale everyone used to lean on, since you're arguing for structural fixes, not individual merit. Are you arguing quotas are the only constitutional path left for diversity goals?
  *Follow-up:* If she says the law is distinct from philosophy: "But you're proposing public policy. If your philosophical justification requires coercion the Court won't allow, are you advocating for civil disobedience or a constitutional overhaul?"

  6. **Defining the Group (Ideology)**
  You focus on demographic slices, but political ideology creates massive epistemic blind spots too. If a department is 90% liberal, they systematically fail to notice facts bearing on conservative interests. Why isn't there a quota for ideological diversity on hiring committees if the goal is decision quality?
  *Follow-up:* If she says ideology isn't immutable like race: "Neither is professional expertise, yet we quota for expertise. If the blind spot is the harm, why does the cause of the blindness matter more than the blindness itself?"

  7. **Deliberative Dynamics (Tokenism)**
  Even if you get diverse bodies seated, do they actually speak? Research on tokenism suggests minority members often stay silent to survive the culture. If they sit in the room but don't shift the deliberation, hasn't the quota failed epistemically even if it succeeded demographically?
  *Follow-up:* If she says we need cultural change alongside quotas: "Then the quota isn't the fix, it's just the precondition. Why coerce the seating arrangement if the real bottleneck is the culture that silences them once seated?"

  8. **Alternatives (Sortition)**
  If the defect is homogeneity, why quotas specifically? Random selection (sortition) from the qualified pool would break demographic clustering without signaling that specific groups are needed for specific perspectives. Isn't a lottery a cheaper, less stigmatizing hedge against blind spots?
  *Follow-up:* If she says we need specific marginalized perspectives, not random ones: "Then you're admitting the goal isn't just breaking homogeneity, it's ensuring specific *content* enters the room. How do you verify that content is present without evaluating the individual, which you want to avoid?"

  9. **Exit Conditions (The Hedge Trap)**
  If the defect is fixable, the quota should lapse once it's fixed, so how would anybody know when? You've argued a quota isn't a bet on data but a hedge against our not knowing what we're missing.
  *Follow-up:* "If the ignorance is permanent, the coercion is permanent. Does your view collapse into a permanent caste system justified by unknowable epistemic gains, or do you have a metric for closure that doesn't contradict the 'hedge against ignorance' premise?"

  ***

  Save Question 9 for last if you're running out of time. It forces her to choose between admitting the quota is permanent (which alienates liberal listeners) or measurable (which contradicts her core "hedge against ignorance" defense), effectively trapping the central tension of her theory in a way the empirical or legal questions don't.
