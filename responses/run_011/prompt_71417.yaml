  a sestina, please — not because i want to show off but because the six end-words working through that fixed permuation and landing back in the order they left is exactly the closed timelike curve im trying to talk about, and i'd rather the room notice the form doing it than have me announce it. use these six, in this order: dust, clock, curve, radius, gift, now. now is the troublemaker: it has to carry Gödel's actual conclusion, that there's no global present to be had anywhere in that spacetime, without turning into a fridge magnet.

