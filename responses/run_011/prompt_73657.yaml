      *   *Fixing (1):* If I modify (1) to allow substantive disputes despite base agreement (e.g., by allowing "phenomenal base"), does it break (3)? If Nihilist/Universalist agree on simples, is that the *whole* base? If I allow "ontological facts" to be part of the base, (3) becomes substantive. So I must keep the base "non-ontological." But then why is consciousness different? Because consciousness involves *experience* which is not "topic-neutral" in the same way? This requires a distinction between "physical/functional base" and "phenomenal base."
