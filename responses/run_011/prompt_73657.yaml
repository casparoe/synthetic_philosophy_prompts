      *   **Tension C: Framework Relativity vs. Outright Truth (4 vs. 5).**
          *   (4) Carnap: Framework choice is pragmatic. No framework-independent answer.
          *   (5) Claims *within* framework are true outright.
          *   *Conflict:* If Framework A says "X exists" and Framework B says "X does not exist," and choice is pragmatic (4), then "X exists" cannot be true *simpliciter* (5) unless one framework is privileged. If (3) says the ontology dispute is verbal, it implies neither framework is "the one true ontology." So "Tables exist" is true-in-U but false-in-N. (5) says it's true "full stop."
