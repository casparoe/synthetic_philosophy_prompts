      *   **Major Clash:** (4) Frameworks vs. (5) Ordinary Truth.
          *   Why: Carnapian internal truth is usually distinct from "true full stop" if external questions are meaningless/pragmatic. If "There are primes" is true full stop, why isn't "There are tables" true full stop (if we adopt the table framework)? If "There are tables" is only true-in-framework, (5) is violated for ontology.
          *   Resolution: Adopt "Internal Realism" (Putnam) or clarify that "true full stop" means "true within the adopted framework which we are not stepping outside of." But (4) suggests we *can* step outside to choose pragmatically.
      *   **Medium Clash:** (2) Metasemantics vs. (8) Revision.
          *   Why: "Nothing further" in (2) fights the normative "ought" in (8).
          *   Resolution: Distinguish descriptive metasemantics from normative conceptual engineering.

