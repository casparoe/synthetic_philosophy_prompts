      *   **Major Clash:** (1) Criterion vs. (6) Genuine Residue.
          *   Why: (1) sets a sufficient condition for verbal disputes (agree on topic-neutral base). (6) describes a scenario fitting that condition (agree on functional/neural base) but labels it substantive.
