answer: |-
  # Part 1: The Diagnostic Instrument

  **Instructions:** Read each short scenario. Choose the one option that best matches what you would do in that situation. There are no right or wrong answers. Work quickly; your first instinct is usually the best.

  **1. The Test**
  A fifteen-year-old passes a test on how laws are made. Their eighty-year-old grandmother fails the same test.
  *   A. The fifteen-year-old votes; the grandmother does not.
  *   B. Both vote; the test is not used.
  *   C. Neither votes on this; the guardian decides for both.

  **2. The Long-Term Neighbor**
  A nurse has lived here for twenty-two years, pays every tax, and obeys every law. She cannot become a citizen because her home country won't release her.
  *   A. She votes; she lives under the rules.
  *   B. She does not vote; citizenship is the key.
  *   C. She votes only on local issues, not national ones.

  **3. The Blank Ballot**
  Turnout is required. A voter drops a blank ballot in the box to avoid the fine.
  *   A. Count it; they showed up.
  *   B. Toss it; they didn't choose.
  *   C. Fine them anyway; the message is rude.

  **4. The Fraudster and the Donor**
  A convicted fraudster loses the vote for five years. An unconvicted billionaire buys unlimited advertising.
  *   A. Both should be limited equally.
  *   B. The fraudster loses the vote; the donor keeps speaking.
  *   C. Neither should be limited; both are free.

  **5. The Household Weight**
  A proposal gives parents an extra fraction of a vote for each minor child, which lapses when the child turns eighteen.
  *   A. Accept it; children need representation.
  *   B. Reject it; one person, one vote.
  *   C. Accept it, but let the child cast it when older.

  **6. The Lottery Chamber**
  A second chamber is filled by lottery, not election, and can veto laws.
  *   A. Keep it; it balances the politicians.
  *   B. Remove it; only elected officials should rule.
  *   C. Keep it, but make it advisory only.

  **7. The Distant Citizen**
  A citizen emigrated thirty years ago, never returns, pays no taxes here, but still receives a ballot.
  *   A. Cancel the ballot; they left.
  *   B. Send the ballot; they belong.
  *   C. Send the ballot, but count it for less.

  **8. The Random Chooser**
  A voter admits to picking names at random. They ask why their ballot counts as much as yours.
  *   A. It counts; the choice is private.
  *   B. It does not count; the intent is missing.
  *   C. It counts, but they should be educated first.

  **9. The Silent Protest**
  A person abstains deliberately and says the abstention is the message.
  *   A. Count it as a valid statement.
  *   B. Count it as a loss for the system.
  *   C. Ignore it; only votes for candidates matter.

