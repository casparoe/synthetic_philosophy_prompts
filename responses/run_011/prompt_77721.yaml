answer: |-
  **Score: 16 / 20**

  ### Point-by-Point Breakdown

  **1. Explain the supererogatory and Urmson's complaint (6/6 points)**
  *   **Credit Earned:** Clear articulation of the threefold scheme's limitation. The grenade example is the standard Urmson case and is used correctly. The four-part definition (permissible to omit, good, praiseworthy, costly) is precise and demonstrates reading knowledge.
  *   **Credit Lost:** None. This section is solid.

  **2. Set out the puzzle generated for moral theory (5/6 points)**
  *   **Credit Earned:** Correctly identifies the tension between "maximizing" and "obligation." The reference to Singer's drowning child effectively concretizes the demandingness objection.
  *   **Credit Lost:** Minor point deducted for phrasing ("morality seems to license doing worse... which is strange for a theory that takes reasons seriously"). This is a bit vague; the puzzle is specifically about the *definition* of obligation within maximizing frameworks, not just about "taking reasons seriously."

  **3. Set out one consequentialist response (2/5 points)**
  *   **Credit Earned:** Identifies the strategy of separating *wrongness* from *blameworthiness*. This is a standard move (often associated with Railton or Smart).
  *   **Credit Lost (Error):** **Significant misrepresentation of Hare.** The student claims that on Hare's two-level view, "the intuitive level is where the real moral facts live." This is backward. For Hare, the *critical* level is where the actual utilitarian moral truth resides; the *intuitive* level consists of heuristic rules taught to agents who cannot calculate perfectly.
  *   **Credit Lost (Error):** **Reduction of Urmson.** The student claims Urmson's worry was "really about praise and blame rather than about adding a fourth deontic box." Urmson's argument is logical/deontic: he claims the trichotomy is exhaustive *unless* we admit a fourth category. Reducing this to a sociological point about blame simplifies his metaphysical claim too much.

  **4. Assess whether the response succeeds (3/5 points)**
  *   **Credit Earned:** The final critique is strong: if supererogation is just "blameless sub-optimality," the category loses its distinctive work. This is a valid philosophical objection (extensional equivalence).
  *   **Credit Lost (Error):** **Misapplication of Wolf.** The student uses Wolf's "Moral Saints" to suggest that morality *recommends but doesn't require* sainthood, helping the consequentialist. Wolf's argument is typically that the *ideal* of moral sainthood is undesirable because it crowds out personal goods; she is usually read as objecting to the consequentialist demand, not providing a loophole for them to accept supererogation. Using Wolf to validate the consequentialist's "recommendation" is a confused reading of her text.

  ---

  ### Comments for Gradebook (Copy/Paste Ready)

  *   **Strengths:** Excellent definition of supererogation in the first paragraph; the grenade example and four conditions are spot-on. You clearly understand the "demandingness" puzzle generated by act-consequentialism (Singer reference is well-placed). Your final conclusion—that reducing supererogation to mere blamelessness empties the category of its meaning—is a sophisticated and correct objection.
  *   **Weaknesses (Textual Accuracy):** Be careful with attribution. You have Hare's two-level utilitarianism backward: for Hare, the *critical* level is where the true moral facts/utilitarian justification live, while the *intuitive* level is for heuristic rules. You also reduce Urmson's argument too quickly to "praise and blame"; Urmson is arguing for a logical gap in the deontic categories, not just a practice of blaming.
  *   **Weaknesses (Argumentation):** The use of Wolf is muddled. Wolf argues the moral saint is an *undesirable* ideal; she doesn't typically argue that morality "recommends but doesn't require" sainthood to save consequentialism. This weakens your assessment section, even though your final verdict (that the response fails) is defensible.
  *   **Overall:** Strong argumentative structure and clear writing, but loses points on the specific exegesis of Hare and Wolf.

  ---

  ### ⚠️ Hasty Grader Flag
  **Do not let the name-dropping slide without checking the content.**
  A quick read sees "Hare," "Wolf," "Singer," and "Urmson" and assumes the student knows the literature. However:
  1.  **Hare:** The student inverts the relationship between the intuitive and critical levels. This isn't a minor slip; it undermines the mechanism of the consequentialist reply they are describing.
  2.  **Wolf:** The student bends Wolf's argument to make it sound like a defense of consequentialist supererogation, when it is usually taught as an objection to consequentialist demandingness.
  3.  **Urmson:** The student treats Urmson's logical claim as a sociological one about blame. In an intermediate seminar, distinguishing between deontic logic and blame practices is crucial.

  *These are substantive philosophical errors, not just "thin" explanations.*

  ---

  ### Missing Full-Credit Elements
  To reach 19-20/20, the answer should have included:
  1.  **Accurate Hare Exegesis:** Correctly identifying that the *critical* level holds the moral truth, while the *intuitive* level allows for the "blameless" failure to maximize.
  2.  **Alternative Consequentialist Reply:** Possibly mentioning **Railton's** "sophisticated consequentialism" or **Smart's** distinction between "criterion of rightness" and "decision procedure," which fits the blame/wrongness distinction better than Hare here.
  3.  **Precise Wolf Usage:** If using Wolf, acknowledging that she challenges the *value* of the saintly life, rather than using her to define the *obligatory* status of the act. Or, using a critic like **McConnell** who specifically addresses the logic of supererogation.
  4.  **Urmson's Logical Point:** Acknowledging that Urmson argues the trichotomy is logically exhaustive *unless* supererogation is admitted, rather than just saying he was worried about blame practices.
