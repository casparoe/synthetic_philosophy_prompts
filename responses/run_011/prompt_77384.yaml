answer: |-
  You are describing the failure of **Invariance under Positive Affine Transformations** within the framework of **Informational Bases of Social Choice**.

  While your reading group is circling "interpersonal comparability," that term is too blunt for the specific mechanism biting you. "Incomparability" suggests an epistemic void (we *cannot* know the ratio). Your problem is not that the comparison is impossible, but that the aggregation rule is **procedurally unstable** with respect to the representation of that comparison. The social ranking changes not because preferences changed, but because the *metric* changed.

  Here is the carving you need, the established terminology, and where the boundary lies between a technical caveat and a fatal objection.

  ### 1. The Formal Name: Invariance Failure
  In the literature established by Sen (1977), D'Aspremont and Gevers (1977), and Blackorby, Donaldson, and Weymark (1984), the property you are looking for is **Invariance (INV)**.

  Specifically, classical utilitarian summation ($W = \sum u_i$) satisfies Invariance only if the informational basis assumes **Cardinal Unit Comparability (CUC)**.
  *   **CUC:** We can compare utility *levels* and utility *differences* across persons, and the *units* are fixed across persons.
  *   **CNC (Cardinal Non-Comparability):** We can measure cardinal utility for each person, but the units and zeros are arbitrary and distinct across persons.

  Your scenario demonstrates that under **CNC**, the Utilitarian SWF violates **Invariance**. The standard label for the phenomenon is **"Sensitivity to Affine Transformations."**

  However, this feels too passive. You want the term that captures the *active* dependence on the questionnaire.

  ### 2. The Conceptual Carving: "Normalization Dependence"
  If "Invariance Failure" is the formal property, the conceptual phenomenon is **Normalization Dependence**.

  This distinguishes your problem from ordinary "incomparability."
  *   **Incomparability** says: "We don't know if Alice's 10 is Bob's 5."
  *   **Normalization Dependence** says: "The social choice rule *pretends* we know, and the outcome flips depending on which arbitrary convention we use to pretend."

  This is distinct from Arrow because Arrow's Impossibility Theorem operates on **Ordinal Non-Comparability (ONC)**. Arrow shows you can't get a coherent ranking from ordinals alone. You already have cardinals. Your problem is that you have *too much* information (cardinality) but not enough *structure* (fixed units) to use it safely.

  It is also distinct from the standard Index Number problem (e.g., Laspeyres vs. Paasche). Index number problems arise from substitution biases in measuring *one* person's welfare over time or across states. Your problem is **Interpersonal Index Sensitivity**: the "price" of one person's utility unit relative to another's is being set by the survey designer, not the theory.

  ### 3. The Harsanyi Correction (and why it feels like a cheat)
  You noted: *"Harsanyi is supposed to get you summing... which makes it look like the units got fixed somewhere along the way."*

  Here is the precise technical gap: Harsanyi's Aggregation Theorem proves that if you satisfy Pareto and vNM rationality, $W(u) = \sum a_i u_i(x)$.
  *   It fixes the **functional form** (linear sum).
  *   It does **not** fix the **weights** ($a_i$) or the **scales** ($u_i$).

  The theorem states that for *any* given set of utility representations, there exist weights that satisfy Pareto. But if you rescale $u_i \to k u_i$, you must rescale $a_i \to a_i / k$ to maintain the same social ordering.
  *   **Classical Utilitarianism** implicitly sets all $a_i = 1$.
  *   Therefore, Classical Utilitarianism is **not invariant** to rescaling.
  *   **Harsanyi's Utilitarianism** allows $a_i \neq 1$, but the values of $a_i$ are underdetermined by the axioms.

  When your reading group invokes the **Impartial Observer**, they are attempting to fix the units by mapping all $u_i$ onto the observer's vNM function. The objection you raised ("the theorem is really about the observer's own scale") is the standard critique: **The Observer's Metric Imposition.** The interpersonal comparison is not derived from the members' preferences; it is imported via the observer's risk attitudes.

  ### 4. Coining the Term: "Metric Volatility"
  If you need a label for your dissertation that captures the "biting" nature of this better than "Invariance Failure," I propose **Metric Volatility**.

  **Definition:** A Social Welfare Function exhibits *Metric Volatility* if the social ranking of alternatives reverses under admissible transformations of the utility representation that preserve all ordinal preferences and Pareto relations.

  **Edges and Boundaries:**
  *   **Technical Caveat:** If the measurement unit has independent normative justification (e.g., "dollars" in a cost-benefit analysis where income is the metric of justice), Metric Volatility is a controlled feature. You are explicitly choosing to weight by willingness-to-pay.
  *   **Fatal Objection:** If the measurement unit is arbitrary (e.g., "0–10 scale" vs. "0–100 scale" vs. "log scale"), Metric Volatility renders the SWF normatively arbitrary.

  The boundary is crossed when the **normalization rule** (how we fix the zero and unit) lacks normative content.
  *   *Example of Safe Normalization:* "We normalize everyone's utility such that their death is 0 and their ideal life is 1." (This attempts CUC).
  *   *Example of Volatile Normalization:* "We sum the raw numbers written on the survey." (This assumes CNC but acts like CUC).

  ### 5. Summary for the Reading Group
  To shut down the loop in your reading group, you can say:

  > "We aren't arguing about whether interpersonal comparison is *possible* (Comparability). We are arguing that Utilitarian Summation lacks **Invariance to Positive Affine Transformations** under the informational basis we are actually using. The social choice is exhibiting **Normalization Dependence**: the outcome is determined by the elicitation metric rather than the underlying preferences. Harsanyi fixes the weights, not the units, so unless the Impartial Observer's risk profile provides a normative justification for the specific unit conversion, we are just observing **Metric Volatility**."

  **The Nearest Established Concept:** **Invariance under Positive Affine Transformations** (within the **Informational Basis** framework).
  **The "Biting" Concept:** **Normalization Dependence** (or **Metric Volatility**).
  **The Distinction from Arrow:** Arrow is about the impossibility of aggregating **Ordinals**; this is the arbitrariness of aggregating **Cardinals** without fixed units.
  **The Distinction from Index Numbers:** Index numbers measure *one* agent's welfare across *different* bundles; this measures *different* agents' welfare across *different* metrics.

  If you need a citation that carves this exactly: Look at **Blackorby, Donaldson, and Weymark (1984), "Social Choice with Interpersonal Utility Comparisons: A Diagrammatic Introduction."** They explicitly diagram the difference between CUC (where summation works) and CNC (where your volatility arises). Your scenario is a textbook violation of the **Invariance Axiom** required to move from CNC to CUC.
