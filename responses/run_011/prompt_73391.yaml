              *   *Assessment:* **False.** This is a significant error. A spandrel (by-product) can *subsequently* be shaped by selection (exaptation). G&L explicitly discuss the mosaics on the spandrels being adaptive even if the space wasn't. The script says "could not have been shaped by any subsequent selection." This contradicts the mosaic analogy itself (the mosaics *are* the subsequent selection/adaptation on the spandrel).
          *   *Overall (b):* Good start, but falls apart on the definition of the term regarding subsequent selection. The candidate confuses the *origin* (non-adaptive) with the *potential for future modification* (adaptive).

      *   **Part (c): Unfalsifiability.**
          *   *Claim 1:* "The unfalsifiability reading is fair; it is in fact the paper's argument."
              *   *Assessment:* **Contestable.** Many philosophers argue this is *not* the real conclusion. The real conclusion is methodological: consider alternatives. Unfalsifiability is a charge, but G&L offer a positive programme too. However, it is a *common* reading.
          *   *Claim 2:* "Gould and Lewontin apply Popper's criterion."
              *   *Assessment:* **Imprecise.** They invoke the spirit of falsification, but explicit Popperian citation isn't the core of their 1979 text (though the logic is Popperian). Acceptable for 2nd year closed book.
          *   *Claim 3:* "adaptive stories can always be regenerated, so that no observation counts against adaptationism."
              *   *Assessment:* Correct representation of the critique.
          *   *Claim 4:* "comparison with Pangloss is meant to place it alongside theology rather than biology."
              *   *Assessment:* Correct. Voltaire's Candide reference.
          *   *Claim 5:* "list of alternatives... is presented as a set of hypotheses: only if the alternatives are the sort of thing that can fail does the enterprise deserve the name of science."
              *   *Assessment:* Correct. This is the positive methodological upshot.
