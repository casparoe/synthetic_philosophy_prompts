  Berkeley treats money as a tool to mobilize labor, not a treasure to be hoarded. Since expiry prevents units from sitting idle and forces them back into circulation, it aligns with his view that money's value dies when it stops moving. He would back the rule because it prioritizes the motion of commerce over the security of storage.

