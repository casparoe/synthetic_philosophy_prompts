  Good evening. I know there is pizza, and I know there are phones, so I will be brief. I was asked to say something about value, which is awkward, because my own bank balance suggests I'm here primarily for the free food. But the finance officer tells me the pizza is already accounted for, so let's talk about the currency that isn't.

  We are launching a time bank. You give an hour, you get a bob. You spend a bob, you get an hour. It sounds simple, but we are playing with fire. We are making money. And whenever we make money, we have to ask what we are actually making. Is it a store of wealth? Is it a speculative asset? Or is it something else entirely?

  Bishop Berkeley, whose work we've been reading, suggests we stop looking at the metal and start looking at the motion. He asks: "Whether there ever was, is, or will be, an industrious nation poor, or an idle rich?" We tend to think wealth is a pile of something kept in a vault. But if the pile stays still, does it help anyone? When you earn a bob here, you aren't mining a digital coin to hold until the price goes up. You are capturing an hour of work that happened. The value is not in the unit; it is in the work the unit commands.

  This brings us to the nature of the thing itself. Berkeley asks: "whether the true idea of money, as such, be not altogether that of a ticket or counter?" A ticket gets you into the cinema, but only if the cinema is open. A counter marks a score, but only if the game is being played. If we treat these bobs as assets to be speculated on, we miss the point. They are claims on labor, nothing more and nothing less. A ticket hoarded in a wallet is just paper. It only becomes money when it moves from hand to hand. If we allow these units to sit, they become what he feared: dead weight. They look like wealth, but they produce nothing. We are building a system where the only way to be rich is to be active.

  This matters for how we treat the units themselves. Ours expire after six months. Some might say money should last forever. But Berkeley poses a harder question: "Whether, although the bullion were gone, the denominations might not be retained, and things still be rated, bought, and sold, industry promoted, and a circulation of commerce maintained?" The gold doesn't matter. The circulation matters. If holding onto a bob stops the circulation, then the bob has failed its job. We are not opting out of the real economy; we are trying to make sure the economy actually runs. We are not saying money is a fiction. We are saying money is a tool, and a tool left in the box is useless. So when you see the expiry date, do not see a limitation. See a demand. See a request that you keep the wheel turning. See a guarantee that the person who earns from you today can spend with someone else tomorrow.

  So I ask you: is a unit of time valuable because you keep it, or because you spend it? If I teach you Spanish and you hold the credit for five years, have I helped you? Or have I just stored a promise? We want the promise kept. We want the commerce maintained. We want the industry promoted.

  This is not a protest against money. It is an attempt to take money seriously. To treat it as a tool for work rather than a score for status. We are not creating a fiction. We are creating a ledger.

