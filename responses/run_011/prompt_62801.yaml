answer: |-
  You have put your finger on the exact fault line where the mathematics of probability meets the reality of human life. You are not being crude; you are being precise. Your brother is arguing from the standpoint of linear arithmetic (Expected Value), and you are arguing from the standpoint of geometric arithmetic (Growth Rate). Both are correct within their own assumptions, but your unease comes from sensing that the assumption required to make your arithmetic work—repetition—is missing.

  Here is the direct answer to your question: **Yes, treating this single deal as the first of an infinite series is a fiction.** It is a heuristic device, not a mathematical truth. However, it is not necessarily a dishonest one, provided you understand what work it is actually doing for you.

  Here is the breakdown of why the arithmetic feels solid, why it technically fails for a single trial, and what you are actually deciding when you commit that eleven percent.

  ### 1. The Arithmetic of One vs. The Arithmetic of Many

  You are correct that the growth-rate argument relies on the Law of Large Numbers. When you maximize the geometric mean (the growth rate), you are relying on the fact that over thousands of trials, the actual sequence of wins and losses will converge to the probabilities. The "ergodic" argument you read—that time averages equal ensemble averages—only holds if time is allowed to pass through many iterations.

  In a single, non-repeatable transaction, there is no time average. There is only the outcome that happens. There is no "rate" to measure. If you lose, you lose 11% of your capital. If you win, you gain 33% on your capital. There is no compounding effect that smooths the variance.

  So, strictly speaking, applying the Kelly formula (which derives from maximizing long-term growth) to a single bet is a category error. You are using a tool designed for a sequence to size a singleton.

  ### 2. Why the Eleven Percent Felt Like "Correct Arithmetic"

  If the growth-rate justification vanishes for a single bet, why did the calculation give you a number that felt objective rather than emotional?

  It is because the Kelly criterion is mathematically equivalent to **maximizing the Expected Logarithm of Wealth.**

  When you calculate the growth rate for a repeated series, you are effectively maximizing:
  $$ \text{Probability}_{\text{win}} \times \log(\text{Wealth}_{\text{win}}) + \text{Probability}_{\text{loss}} \times \log(\text{Wealth}_{\text{loss}}) $$

  This formula works for a single bet just as well as a million bets. The math doesn't change. What changes is the *justification*.
  *   **For repeated bets:** You maximize this because it prevents ruin and maximizes final wealth over time.
  *   **For a single bet:** You maximize this because you are implicitly assuming that the "utility" (the real-world value) of money follows a logarithmic curve.

  A logarithmic utility curve means that gaining \$100,000 when you are poor matters much more than gaining \$100,000 when you are rich, and conversely, losing \$100,000 hurts much more than gaining it helps. It is a mathematical way of saying, "I need to protect my downside more than I need to chase my upside."

  So, when you chose eleven percent, you were not expressing a "temperament" in the vague sense of being cautious or bold. You were expressing a specific structural view of money: **that a 10% loss of your total capital hurts roughly twice as much as a 10% gain helps.**

  ### 3. Is the Fiction Legitimate?

  You asked if inventing the infinite series is a way of hiding the problem. It is a way of *importing* a solution from a context where survival is guaranteed by the law of large numbers into a context where survival is not guaranteed.

  In a repeated game, Kelly guarantees you never go to zero (as long as you don't bet full Kelly on a negative edge). In a single game, Kelly does not protect you from a bad outcome; it only sizes the bet according to the Log Utility assumption.

  The fiction is legitimate **only if** your business operates *as if* it were a series, even if this specific deal is not.
  *   Do you face similar risks regularly?
  *   Is this capital pool used for a continuing business with a mortgage and employees?

  If yes, then treating this single deal as part of a "virtual sequence" is actually prudent risk management. You are preserving your capital base for the *next* opportunity, even if *this* opportunity doesn't repeat. You are protecting the "one real you" who has to wake up on Monday regardless of the outcome of this deal.

  ### 4. Addressing Your Brother

  Your brother is making two claims. One is mathematically true but practically useless; the other is practically true but mathematically vague.

  1.  **"Expected value increases steadily... so either commit everything or you are incoherent."**
      *   **Math:** He is right. If you value money linearly (a dollar is a dollar, whether you have ten or ten million), you should bet 100%.
      *   **Reality:** This is incoherent for a living business. If you bet 100% and lose (a 2/3 chance), you are out of business. You cannot place the next bet. Linear utility ignores the risk of ruin.
  2.  **"A one-in-three chance of losing the sum is not something a man with a mortgage... should entertain."**
      *   **Reality:** He is right to worry about the consequences.
      *   **Math:** He is wrong to imply that *any* size is unacceptable. The Kelly fraction (11%) limits the damage. If you lose, you have 89% of your capital left. You can still pay the mortgage. You can still employ your men. You are still in the game.

  ### 5. What You Are Actually Deciding

  You asked what you were relying on when you chose eleven percent if it wasn't the growth rate of a non-existent series.

  You were relying on the **principle of survival.**

  In a single trial, the "growth rate" is meaningless. But the **Expected Log Utility** is a measure of how much the bet disturbs your financial equilibrium. By using the Kelly fraction, you are saying: *"I will size this bet so that the pain of a loss is mathematically balanced against the pleasure of a win, assuming that my ability to function declines as my capital shrinks."*

  That is not a hidden risk preference; it is a definition of business continuity.

  ### Recommendation

  Do not tell yourself this is the first of an infinite series. You know it isn't, and that cognitive dissonance is what is unsettling you.

  Instead, tell yourself this: **"I am using the Kelly fraction not to maximize growth, but to enforce a Logarithmic Utility constraint on a single event."**

  This acknowledges that:
  1.  **The deal is one-off:** There is no long-run growth rate to be had here.
  2.  **The constraint is real:** You have a mortgage and employees. Losing 50% of your capital might cripple you, while gaining 50% might only make you comfortable. Log utility captures this asymmetry.
  3.  **The 11% is a cap, not a target:** Because the edge is thin (the 1.75% growth is indeed barely distinguishable from zero), and because the deal is non-repeatable, there is no arithmetic shame in betting *less* than 11%.

  Many professional gamblers and investors use "Fractional Kelly" (e.g., half-Kelly) precisely because they recognize that the arithmetic is an idealization. In your case, given the mortgage and the single-shot nature of the deal, committing 5% or 6% might be the more honest application of the logic. It respects the arithmetic of the edge without pretending the arithmetic of repetition exists.

  **Summary:** The eleven percent is not the growth rate of this deal. It is the bet size that keeps you alive if you are wrong, while allowing you to profit if you are right, under the assumption that losing capital hurts more than gaining it helps. That is not a fiction; it is the arithmetic of survival.
