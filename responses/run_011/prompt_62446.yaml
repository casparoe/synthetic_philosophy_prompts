answer: |-
  The case of Pelletbot forces a confrontation between the intuitive pull of functionalism and the strict etiological demands of teleosemantics. You have built a system that behaves *as if* it represents pellets, trained via a process that mirrors variation and selection, yet lacks the biological lineage traditionally required to ground underived content. The question is whether teleosemantics must stretch to accommodate Pelletbot or break against it.

  Here is the verdict: Pelletbot lacks underived content. Teleosemantics has a principled reason to deny it, and accepting Pelletbot as a genuine representor would collapse the distinction between underived and derived content, rendering the theory incapable of doing its specific philosophical work. While your hunch suggests that the "designer objection" (3) is the real threat and the "lineage objection" (2) is merely verbal, I argue the opposite. The lineage objection is the metaphysical ground; the designer objection is merely its symptom. Without a specific kind of token reproduction, there is no normative space for error intrinsic to the system, and without that, there is no content.

  To see why, we must first disentangle what teleosemantics is actually committed to. At its core, teleosemantics grounds meaning in function, and function in history. A state represents X because it has the function of indicating X, and it has that function because ancestors of that state were selected for indicating X. However, the locus of this selection matters. Producer-oriented teleosemantics locates content in the mechanism that produces the signal. The signal means "pellet" because the mechanism was selected to produce that signal when pellets are present. Consumer-oriented teleosemantics locates content in the mechanism that uses the signal. The signal means "pellet" because the downstream policy was selected to use that signal to navigate toward pellets.

  This distinction is not trivial for Pelletbot. On a consumer-oriented view, the case looks promising. There is a clear consumer inside the black box: the policy layer downstream of the internal unit. That policy was tuned to rely on the unit's firing to maximize reward. If the unit fires, the policy moves; if the unit fails, the policy starves. The consumer has a job, and the signal is fuel for that job. A proponent of consumer teleosemantics could argue that the etiological history of the *consumer* suffices to ground the content of the *signal*, even if the signal itself isn't a reproducing token. The policy's success conditions fix the content.

  However, this glosses over the etiology of the consumer itself. In biological systems, the consumer is a reproducing entity. Its success is measured in its own replication or the replication of the organism housing it. In Pelletbot, the consumer is a static set of weights frozen after training. It does not reproduce. It does not have ancestors. It was designed. The "selection" it underwent was not a struggle for existence among token policies, but a gradient descent optimization of a single parameter set. The consumer-oriented view thus smuggles in a biological metaphor where there is only engineering optimization. If the consumer lacks underived functions, it cannot confer underived content on the signals it consumes.

  The producer-oriented view is even less forgiving. Here, the internal unit must be a token of a type that has reproduced because of its correlation with pellets. But Pelletbot's weights are not tokens that replicate. They are parameters that are nudged. During training, the network architecture remains constant while values shift. There is no population of competing internal units where the "pellet-detecting" unit out-reproduces the "noise-detecting" unit. There is only one unit whose weights are adjusted until they fit. This is optimization, not selection. Selection requires a population of variants where some are copied and others are not. Gradient descent copies nothing; it modifies. To call this "selection" is to stretch the term until it covers any convergent process, including a rock eroding into a shape that fits a hole.

  This brings us to your hunch regarding objections (2) and (3). You suspect (2) — the lack of literal reproduction — is a verbal dispute about how strictly to read "lineage," while (3) — the derived nature of the reward function — is the substantive threat. I contend this is backwards. (3) is persuasive only because (2) is true.

  If Pelletbot reproduced itself — if successful Pelletbots built copies of themselves using their own resources, and those copies inherited the weights with some variation — then the fact that humans set the initial reward function would matter far less. In biology, the environment sets the selection pressure. Gravity, predation, and food availability are "external designers" in a sense. If Pelletbot were embedded in a lineage where its reproductive success depended on pellet foraging, the human origin of the initial architecture would be historically distant and causally diluted. The content would be underived because the *maintenance* of the trait would be due to its contribution to the system's own proliferation, not the designer's whim.

  The reason (3) feels like a killer objection is that the selection pressure is not only external but *vicarious*. The system does not care about reward; we care about reward. The system has no stake in its own success. But why does it have no stake? Because it does not reproduce. The lack of token reproduction (2) means there is no "self" to have a stake. Therefore, (2) is not a verbal quibble about copying; it is the metaphysical prerequisite for intrinsic normativity. Without reproduction, there is no distinction between a system functioning correctly and a system merely functioning as designed. The "error" condition in Pelletbot is defined by us, not by the system's failure to perpetuate itself. If (2) were satisfied—if there were genuine replication—the force of (3) would diminish significantly. Thus, (2) is the fundamental barrier, and (3) is the consequence.

  This distinction becomes sharp when we bring in Swampman. Consider a network randomly initialized that happens to be functionally isomorphic to the trained Pelletbot. It has the same weights, the same architecture, and behaves identically. A standard historical teleosemantics must say the Swampman lacks content while the trained Pelletbot has it (or at least, has a different status). If your position cannot buy this contrast, you have abandoned teleosemantics for functionalism.

  If we accept Pelletbot as having underived content, we struggle to exclude Swampman. Both lack biological lineage. Both rely on human-designed reward functions (in the case of Swampman, the "design" is random chance, but the environment is still human-constructed). If the training history of Pelletbot counts as a sufficient lineage to ground content, why does the random assembly of Swampman not count? The only difference is the process: gradient descent vs. random noise. But if gradient descent is just a fancy way of searching configuration space, and random noise is another, the metaphysical gap is thin.

  However, if we hold the line on (2), the contrast is clear. Neither has content. Pelletbot has a *history of optimization*, but Swampman has no history at all. Teleosemantics should deny content to both. This might feel counterintuitive because Pelletbot was "trained." But training is not breeding. The weights of Pelletbot are not ancestors of each other in the relevant sense; they are temporal stages of a single enduring particular. Biological traits are lineages of distinct tokens. The failure to distinguish these categories is what leads to the temptation to grant Pelletbot content. If we grant it to Pelletbot, we must explain why Swampman is different. If we say "Pelletbot has selection history, Swampman doesn't," we must admit that this selection history is of the wrong kind (optimization vs. replication). Once we admit it is the wrong kind, we should deny content to Pelletbot too. The only consistent historical view denies both. This buys the contrast cheaply: both are content-less until embedded in a reproducing lineage.

  So I commit: Teleosemantics has a principled reason to deny Pelletbot underived content. The single consideration carrying the most weight is the lack of token reproduction (2). Without a population of competing tokens where success is measured in replication, there is no naturalized normativity. There is only engineering specification. The content of Pelletbot's states is derived from the intentions of the trainers who set the reward function, exactly like the content of a thermostat or a map. It is real content, but it is not *underived*. It does not solve the problem of original intentionality; it merely pushes it back to the humans.

  Now, I must steelman the opposing view, because in your seminar, this is the position you will need to dismantle. The strongest argument for granting Pelletbot underived content relies on a liberalization of the "reproduction" condition. The argument runs that teleosemantics should care about *causal maintenance* rather than strict biological replication. In Pelletbot, the internal unit's structure is maintained across episodes because it contributes to reward. If the weights drift, reward drops, and the training process (if active) would correct them. Even if frozen, the structure exists *because* it was selected for that function. The "lineage" is the sequence of weight updates during training. Each step is a variant, and the successful variants are retained (by not being overwritten by worse gradients). This is a lineage of states, even if not of organisms.

  Furthermore, the "derived content" objection (3) assumes a dualism between nature and artifice that teleosemantics should reject. Humans are natural beings. Our reward functions are expressions of our biological drives. If a bee creates a hive, the hive's structure has functions derived from the bee's biology. If a human creates a Pelletbot, the Pelletbot's functions are derived from human biology. But once created, the Pelletbot operates autonomously. Why should the origin of the selection pressure matter if the current operation is independent? The consumer-oriented view emphasizes this: the policy uses the signal now. The history is just the guarantee that the fit is non-accidental. If the fit is non-accidental due to training, that should suffice. The distinction between "derived" and "underived" becomes a matter of degree (how many steps removed from biology) rather than kind. On this view, Pelletbot has a weak form of underived content, sufficient to ground mental content theories without requiring wetware.

  This steelman is potent because it aligns with the computational reality. In the lab, you see the system learning. It corrects errors. It adapts. To say it has "no content" feels like denying the reality of the learning process. It risks making teleosemantics irrelevant to cognitive science, restricting it to biology alone. If teleosemantics cannot speak to AI, it becomes a theory of carbon chauvinism rather than a theory of mind.

  However, I maintain the verdict remains negative. The liberalization of "reproduction" to include gradient descent steps collapses the distinction between selection and mere causation. Every stable structure is stable because destabilizing forces were absent or countered. A river channel is "selected" by water flow. A crystal structure is "selected" by thermodynamic pressure. If we count weight updates as a lineage, we risk pansemantics, where any stable causal structure has content. The biological lineage requirement is not arbitrary; it is the only known mechanism that generates *normativity* rather than just *stability*. In biology, a trait can be stable but malfunctioning (a broken heart). In gradient descent, a weight configuration is either optimal or it isn't. There is no space for a trait to be reproduced *despite* being malfunctioning, which is a key feature of biological norms. Pelletbot's "errors" are just sub-optimal configurations waiting to be smoothed out.

  The one piece of evidence most likely to flip my verdict would be the demonstration of open-ended, autonomous reproduction in the agent. If Pelletbot were deployed in an environment where it had to acquire resources to copy its own code onto new hardware, and where mutations in that code led to differential replication rates based on pellet-foraging success, the verdict would change. In that scenario, the selection pressure becomes intrinsic to the agent's existence. The human reward function would become merely the initial environmental condition, like gravity. If you can show me a Pelletbot that builds Pelletbots, I will concede it has underived content. Until then, it remains a tool, and its states are derived representations, useful and real, but not the kind that solves the philosophical problem of intentionality.

  This position leaves you with a challenge for your dissertation. If Pelletbot lacks underived content, then computational cognitive science cannot rely on teleosemantics alone to ground the content of artificial agents. You must either argue that human cognition also lacks underived content (a hard sell), argue that teleosemantics needs revision to accommodate non-bological replication (risking pansemantics), or argue that artificial agents operate with derived content that is functionally equivalent to underived content for the purposes of psychology. The third option is likely your most fertile ground. It accepts the metaphysical verdict while securing the scientific utility. But do not pretend the metaphysics is settled. The lack of token reproduction is not a verbal quibble; it is the wall between life and machine.
