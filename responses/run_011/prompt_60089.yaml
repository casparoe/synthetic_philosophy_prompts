  can you give me a worked example of this actually biting somewhere? a made-up country is fine, i don't need a real one — just a scenario with enough moving parts that you can see exactly where the problem sits: whose advice counts, what happens if the monarch refuses it, who's left to say whether the refusal was constitutional. and then tell me whether you think this is a genuine conceptual problem or just a set of rules that happen to be badly drafted, because i can't tell which.
