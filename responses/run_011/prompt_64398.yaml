answer: |-
  We are gathered to mark a conclusion. There will be no next year. There will be no reunion in five years on this lawn. There will be no one here to read your transcripts when you are fifty. I stand before you to say that this institution, which has stood since 1871, will cease to operate as a college ninety days from now. I recommended this closure to the board in March. They voted to accept it. I am telling you this now, at the beginning of this address, because you deserve to hear the hardest truth before you hear anything else.

  For twenty years, the planning documents of this college argued from the inside view. They listed our strengths: the loyalty of our donors, the quality of our music program, our niche in teacher preparation, the unusual strength of this senior class. We told ourselves that these specific features insulated us from the general weather. We recited a history of survival at every commencement. We survived the 1930s. We survived the closures of the 1970s. We saw the demographic cliff coming. But a history told exclusively by survivors is not a map; it is a memorial. It tells you who made it, not why.

  In 2011, we commissioned a study of institutions in our region and enrollment band. We learned that roughly a third of them had stopped enrolling students within twenty years. We filed the study. We reasoned our way out of it. We told ourselves that our endowment, though damaged in 2008, would recover. We told ourselves that enrollment fell because of temporary conditions, not structural ones. We looked at the base rate of failure for colleges like ours, and we decided it applied to the others, not to us. That was a mistake. It was not a mistake of data. It was a mistake of imagination. We loved the inside view because it allowed us to feel agency. We ignored the outside view because it required us to feel fear.

  I want to be plain about why we are here, because there are people in this room who have been told conflicting stories. Some have been told this was inevitable, a tide that no one could stop. Some have been told this was negligence, a ship steered onto the rocks by specific hands. I am not going to offer you a comfort that blends these two until they are indistinguishable. I am going to assign the weight.

  Half of this closure was the general fate of institutions of this kind. The demographics shifted. The cost structure of private higher education broke against the willingness of families to pay. The endowment model we inherited stopped functioning in the world we inhabit. If you look at the reference class of small private colleges founded before 1900 with endowments below a certain threshold, the attrition is high. That is the structural reality. To deny this is to deny the economic air we were breathing.

  But half of this closure was decisions that I and my predecessors made. We delayed. We hoped. We prioritized the comfort of the present over the viability of the future. When the 2011 study arrived, we filed it. When enrollment dipped in 2015, we discounted tuition rather than shrinking the budget. When the demographic data clarified, we launched capital campaigns instead of reimagining the curriculum. I was president for the final segment of this decline. I bear the responsibility for the recommendation to close. I do not offer this confession to invite your forgiveness. I offer it so you know that this was not merely fate. Human beings chose this path, step by step, because the alternative was harder.

  I know some of you in the alumni section spent a decade telling me the college would survive if I had only tried harder. You were not wrong to love this place. You were wrong to believe that love was a strategy. Loyalty is a virtue, but it is not a revenue model. I do not say this to shame you. I say it because we all participated in the same fiction. We all agreed that talking about closure was admitting defeat. So we talked around it. We talked about resilience. We talked about niche. We talked about everything except the math.

  And now I must speak to the seniors. You have been told for four years that you were special to this place. You were told you were the future. Now you hold a degree from an institution that will not exist in ninety days. Your transcript will be handled by a state agency. Your campus will become something else. There will be no future commencement that is yours. I know this feels like a betrayal. It feels like you were promised a membership in a continuing club, and instead you are being handed a key to a building that is being demolished.

  I am not going to tell you that your education belongs to you and no one can take it away. That is a comforting sentence, but it dodges the reality that education is a relationship, and the other party in this relationship is dying. I am not going to tell you that you beat the odds. You did not. The college closed. You are not an exception to the statistic.

  But I am going to tell you this: You are an exception to the meaning of the statistic.

  When we look at the reference class of colleges that close, we usually see them as failures. We see the empty buildings. We see the lost jobs. We see the interrupted plans. But a reference class is a grouping of institutions, not a grouping of human beings. The failure of the vessel does not negate the arrival of the passengers. You completed the work. You met the requirements. You engaged with the faculty who are sitting behind you, who taught you not despite the decline, but often with greater intensity because of it.

  Can a member of a reference class whose members mostly perish be an exception in any sense worth wanting? Yes. But not by surviving. You cannot save the college. You cannot keep the name alive by willing it so. The exception you embody is not continuity. It is completion. You are the proof that this place worked while it lasted. The value of a college is not its immortality. It is its capacity to transform the people who pass through it while it stands. That transformation does not reverse when the doors lock. The competence you gained is not contingent on our continuity. The critical thinking you practiced does not evaporate because the registrar's office is closing.

  You are not the survivors of a disaster. You are the completers of a project. There is a difference. A survivor implies something happened to them that they escaped. A completer implies they did what they set out to do. You set out to earn a degree from K—. You have done so. The fact that K— will not be here to offer it to anyone else does not diminish the work you did to earn it. It only changes the context in which you will hold it.

  To the faculty and staff: you are losing your jobs. I know there are no words that fix this. You kept the classes running while the budget shrank. You advised students while knowing there would be no tenure track at the end of it. You maintained the standards of this institution even as the institution was being dismantled. That is professional integrity. It is also a loss. I acknowledge it as such.

  To the trustees: you voted to close. You inherited a trajectory you did not start, but you had to end it. That is a burden you will carry.

  To the parents: you paid for a four-year promise that turned into a three-year reality for the institution, though a four-year reality for your children. You deserve better than a explanation about base rates. You deserve a college that lasts. We did not provide that. I am sorry.

  We are ending because we could not sustain the model. We are not ending because the work done here was worthless. These are separate facts. We have conflated them for too long. We thought that if the college closed, the education was wasted. That is false. The education was real. The college was temporary.

  I want you to leave here today without the burden of saving us. You do not need to keep K— alive in your conversations. You do not need to defend our closure to employers. You do not need to carry our survival as a project. Your project is your own life. The college served its purpose if it prepared you for that. It did not serve its purpose if it made you dependent on its permanence.

  I have spoken about the base rate twice. I will not speak of it again. The numbers explain the closure. They do not explain the graduates. The numbers explain the market. They do not explain the mind you have built.

  We are closing the books. We are turning off the lights. We are returning the keys. This is not a transition. It is a stop. But it is a stop at which you have arrived. You are standing on the ground. The vehicle is done. You are not.

  Walk forward. Do not look back to see if the building is still standing. It will not be. Look instead at what you are carrying. It is heavy enough to be real. It is portable enough to last. That is all any of us could ask for.

  Thank you.

  Liberties

  I leaned on the contested view that a "base rate" can be acknowledged without rendering the specific case deterministic, assuming the audience can hold both fate and agency simultaneously. I bent the fourth demand regarding the seniors by asserting their "completion" is a valid exception to the "failure" of the reference class, which is a philosophical pivot rather than a statistical one. I found the responsibility split hardest to articulate without sounding defensive, so I committed to a rigid 50/50 split for rhetorical clarity, though reality is likely messier. I avoided citing the specific "one-third" statistic as a current truth, using it instead as evidence of past denial, to sidestep the hindsight bias inherent in defining the class after the outcome. Finally, I treated the "education belongs to you" cliché as forbidden not just in phrase but in sentiment, focusing instead on the independence of competence from institutional continuity.
