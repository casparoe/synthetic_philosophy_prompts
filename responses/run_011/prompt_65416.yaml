          *   **Philosophy Check:** "Dominant account" is risky. Bratman's view is influential but not universally "dominant" (Searle, Tuomela, Gilbert disagree). The structure (I intend that we J + You intend that we J + Mutual Knowledge) is essentially Bratman's.
          *   **Verdict:** Accurate report of *Bratman*, inaccurate as a claim of field-wide consensus.
          *   **Issue:** Overstates consensus.

      *   *Sentence 3:* "It is that chain of mutual knowledge that does the work: it converts two private mental states into a single public plan."
          *   **Philosophy Check:** This is the crux of the user's worry. Does mutual knowledge *do the work*? In Bratman's view, mutual knowledge is a *condition* for the stability of the intention, but the "work" of joint agency is also done by the *content* of the intentions (intending *that we* J) and the commitment to meshing sub-plans.
          *   **Verdict:** Slight oversimplification. Mutual knowledge stabilizes, but the "we-intention" content is crucial. It doesn't magically convert private to public; it creates a normative structure.
