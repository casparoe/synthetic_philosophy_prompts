      *   **Core Question:** What are the *desiderata* (requirements) for an adequate theory of moral learning from lives (biography/hagiography/biographical fiction)?
      *   **Specific Constraints:**
          *   Must cover phenomena (admiration, emulation, etc.).
          *   Must cover cases (flawed exemplar, sanitized saint, imposed unity, reader error, real vs. invented).
          *   Must cover distinctions (knowledge vs. propositions, admiration vs. emulation, legible vs. transferable, moved vs. convinced).
          *   Must cover character findings (situationism, fundamental attribution error).
          *   Must distinguish non-negotiables from sectarian tastes.
          *   Must address the "Situationist Challenge" (is it a constraint or prejudice?).
          *   Must identify incompatible requirements (the "bind" between particularity and imitability).
          *   Must identify the single most exclusionary requirement.
          *   Must evaluate three specific ethical frameworks (Exemplarist Virtue Ethics, Moral Imagination/Perception, Deflationary/Principlist).
          *   Format: Table is acceptable *if* motivating cases stay attached.
          *   Tone: Rigorous, philosophical, direct, not flattering, acknowledging the "bind."

  2.  **Deconstruct the Philosophical Problem:**
      *   The user is grappling with the *exemplar problem* in ethics and narrative. How do we learn from lives without simplifying them into lies or preserving them in a way that makes them useless?
      *   *The Tension:* Particularity (truth/complexity) vs. Abstraction (imitability/utility).
      *   *The Situationist Challenge:* If character is situational, can a "life" teach anything stable?
      *   *The Narrative Problem:* Form imposes shape. Shape implies meaning. Meaning implies justification.

  3.  **Drafting the Desiderata (The List):**
      *   I need to generate specific requirements based on the prompt's checklist.
      *   *Phenomena:* Admiration (why do we feel it?), Emulation (what do we copy?), Ineffability (what can't be argued?).
      *   *Cases:* The Cruel Competent (the user's doctor), The Sanitized Saint (hagiography), The Imposed Arc (narrative fallacy), The Charismatic Vice (mimicking the wrong thing), Real vs. Fiction (does ontology matter?).
      *   *Distinctions:* Knowing *that* vs. Knowing *how* (Ryle), Admiring vs. Copying, Context-bound vs. Transferable, Affective vs. Cognitive.
      *   *Character Findings:* Situationism (Hartshorne & May, Darley & Batson), Fundamental Attribution Error (Ross).

  4.  **Analyzing the "Bind" (Particularity vs. Imitability):**
      *   The user suspects: Full particularity = Unimitable. Imitable = Simplified/Hagiography.
      *   *Verdict:* This is a real bind, known in philosophy as the "Particularity Problem" in virtue ethics.
      *   *Price of the Horns:*
          *   Horn A (Full Particularity): You get truth, but the reader cannot use the life. It becomes aesthetic contemplation, not moral guide.
          *   Horn B (Imitability): You get utility, but you lie about the causal structure of the life. You create a myth.
      *   *Resolution?* Maybe the "bind" is the point of the book. The book *should* expose this tension.

  5.  **Addressing Situationism:**
      *   Is it a constraint or prejudice?
      *   *Analysis:* Strong situationism (character doesn't exist) destroys exemplarism. Moderate situationism (context matters hugely) constrains *how* we imitate (don't copy the act, copy the sensitivity to context).
      *   *Verdict:* Treating strong situationism as a hard constraint is a prejudice (it denies the phenomenology of character). Treating moderate situationism as a constraint is necessary for accuracy.

  6.  **Evaluating the Three Families:**
      *   *Exemplarist Virtue Ethics (Zagzebski):* Focuses on admiration. Struggles with the "Cruel Competent" (can we admire the cruel?). Struggles with Situationism.
      *   *Moral Imagination/Perception (Nussbaum/Murdoch):* Focuses on seeing the particular. Handles the "Cruel Competent" better (understanding without endorsing). Good for fiction.
      *   *Deflationary/Principlist:* Lives are just illustrations of rules. Fails the "ineffability" test. User clearly rejects this ("Caveats are footnotes to [shape]").

  7.  **Determining the "Single Most Exclusionary Requirement":**
      *   Which one kills the most theories?
      *   Likely: *The requirement that the theory account for the transferability of traits without collapsing the distinction between legible and transferable.* Or, more sharply: *The requirement to accommodate the flawed exemplar whose virtues are inseparable from vices.*
      *   Actually, the strongest filter is usually the *Situationist Constraint* combined with *Imitability*. But the prompt asks for the single requirement that excludes the largest number.
      *   Let's go with: **The requirement that the theory explain how a reader can emulate a life without simplifying its causal complexity.** (This hits Deflationary and naive Virtue Ethics).
      *   Wait, the Deflationary view says lives add *nothing*. So the requirement "Lives teach something no argument states" excludes Deflationary immediately.
      *   Let's refine: **The Ineffability Constraint** ("a life teaches something no argument states"). This kills Deflationary. It also pressures Virtue Ethics to explain *what* that something is.

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the gravity of the project. Validate the "bind."
      *   **The Desiderata Table:** Columns: Requirement, Motivating Case/Consideration, Non-Negotiable vs. Sectarian.
      *   **The Situationist Question:** Address the "prejudice vs. data" query directly.
      *   **The Bind (Particularity vs. Imitability):** Confirm the suspicion. Price the horns.
