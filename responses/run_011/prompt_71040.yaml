answer: |-
  # JOINT STATEMENT ON TEMPORAL ONTOLOGY IN CONSCIOUSNESS RESEARCH
  **Prepared by:** Researcher A (Global Workspace Consortium) and Researcher B (Multiple Drafts Working Group)
  **Date:** October 14, 2023
  **Status:** Draft for Adversarial Collaboration (Unsigned)

  ## 1. Agreed Claims

  The undersigned parties acknowledge the following points of consensus regarding the empirical landscape and theoretical constraints necessary for further dialogue.

  1.  **Rejection of the Cartesian Theater:** Both parties reject the existence of a privileged locus in the brain where experience is "presented" to a non-physical observer or a central homunculus. There is no single place where "it all comes together" for a viewer inside the head.
  2.  **Phenomena to be Explained:** Both parties accept the validity of the following behavioral and phenomenological data as constraints on theory:
      *   **Apparent Motion:** Discrete stimuli presented in succession are experienced as continuous motion.
      *   **Colour-Phi Effect:** A change in colour attributed to a moving stimulus is experienced as occurring during the motion, despite the physical change occurring after the motion path is established.
      *   **Cutaneous Rabbit:** Tactile stimuli delivered at discrete locations are experienced as hopping along the limb, with early sensations felt only after later stimuli arrive.
      *   **Masking:** Visual awareness of a target is abolished or altered by a subsequent mask depending on the inter-stimulus interval.
  3.  **Role of Report:** Both parties concede that the act of reporting (verbal or motor) is not a neutral readout of a pre-existing state. Reporting involves cognitive processes (attention, working memory, motor planning) that causally interact with the systems generating the report. Measurement affects the measured system.
  4.  **Empirical Indistinguishability (Limited):** Both parties agree that in specific retrospective paradigms (e.g., standard Colour-Phi), a "Stalinesque" explanation (editing before experience) and an "Orwellian" explanation (editing memory of experience) yield identical behavioral predictions *if* the only data available is the subject's final report.
  5.  **Neural Correlates:** Both parties agree that conscious access requires specific neural activations beyond early sensory processing. There is a difference between unconscious sensory registration and conscious availability.

  ## 2. Table of Residual Disagreements

  | Topic | Statement Acceptable to Researcher A (GWT) | Statement Acceptable to Researcher B (MDT) | Classification |
  | :--- | :--- | :--- | :--- |
  | **Temporal Ontology** | There is a determinate time $t$ at which content becomes consciously available via global ignition. This $t$ is a fact of the matter independent of when the subject reports it. | There is no single time $t$ of conscious experience. "Time of experience" is a construct fixed only relative to a probe or report. There is no fact of the matter prior to the probe. | Substantive (Ontological) |
  | **The "Moment" of Change** | Temporal illusions (e.g., colour-phi) are errors in judgment *about* a real sequence of conscious events, or delays in broadcasting real events. The sequence of ignition is the sequence of experience. | Temporal illusions reveal that the sequence of experience is constructed retrospectively. There is no "real sequence" of conscious events to be wrong about; there is only the final narrative draft. | Substantive (Mechanistic) |
  | **Stalinesque vs. Orwellian** | The distinction is meaningful. One implies editing of sensory content before broadcast; the other implies editing of memory after broadcast. Neural timing data can distinguish them. | The distinction is verbal. Since there is no "finish line" of experience, editing before or after it is a category error. Only the causal flow of information matters. | Verbal / Methodological |
  | **Definition of Evidence** | To settle when an event was conscious, we must identify the neural signature of ignition. If ignition occurs at $t$, experience occurred at $t$. | To settle when an event was conscious, we must analyze the probe conditions. If the report shifts with probe delay, the "time of experience" shifted. | Methodological |
  | **Status of Unreported Experience** | Content can be consciously available (ignited) even if no report is made, provided the workspace is active. | Content is only "conscious" insofar as it influences control systems capable of generating a probe response. Unreported content is theoretically ambiguous. | Substantive (Operational) |

  **Note on Classification:** A significant portion of the dispute (Rows 3 and 4) is methodological. It turns on what counts as "settling a temporal fact." Researcher A treats neural ignition time as the truth-maker for experience time. Researcher B treats the probe-relative content as the only truth-maker. This is not merely verbal, as it dictates experimental design, but it stems from a deeper substantive disagreement about whether "conscious time" maps to "neural event time."

  ## 3. The Cruxes

  The following sub-questions are identified as critical. Settling these would force a revision of at least one position. They are ranked by dependency (how much of the dispute rests on them).

  ### Crux 1: The Independence of Ignition Timing from Report Timing
  *   **Question:** Can the subjective time assigned to an event be dissociated from the time of the report probe, while remaining tightly correlated with a specific neural ignition event?
  *   **Researcher A's Prediction:** Yes. Subjective time will track neural ignition time even if the report is delayed, provided memory does not decay.
  *   **Researcher B's Prediction:** No. Subjective time will shift systematically based on the context of the report probe, regardless of neural ignition timing.
  *   **Evidence Accepted:** A paradigm where report timing is manipulated independently of stimulus timing, with concurrent neural monitoring (EEG/fMRI) of ignition signatures (e.g., P3b, global ignition).
  *   **Falsification Condition:**
      *   **For A:** If subjective time shifts with report delay *without* a corresponding shift in the neural ignition signature of the stimulus.
      *   **For B:** If subjective time remains fixed to the stimulus ignition time despite massive variations in report delay and probe context.

  ### Crux 2: The Existence of "Orwellian" Revisions
  *   **Question:** Can evidence be found that proves memory revision occurs *after* a conscious state was established, rather than the conscious state being constructed at the time of memory access?
  *   **Researcher A's Prediction:** Yes. We can find cases where ignition occurs (consciousness established) but is subsequently overwritten in memory before report.
  *   **Researcher B's Prediction:** No. Any case alleged to be Orwellian can be redescribed as a Multiple Drafts process where the winning draft at the time of probe did not include the earlier content.
  *   **Evidence Accepted:** Physiological markers of distress or priming that indicate a conscious reaction occurred *before* the reported memory was fixed, contradicting the report.
  *   **Falsification Condition:**
      *   **For A:** If all putative cases of memory revision can be fully explained by failures of initial ignition (i.e., the subject never consciously saw it).
      *   **For B:** If a physiological marker proves conscious access occurred at $t_1$, but the subject reports content consistent only with information available at $t_2$, with no neural trace of the $t_2$ content modifying the $t_1$ trace.

  ### Crux 3: The Necessity of Report for Consciousness
  *   **Question:** Is global ignition sufficient for consciousness, or is the potential for report constitutive of consciousness?
  *   **Researcher A's Prediction:** Ignition is sufficient. A subject under paralysis could be conscious if ignition occurs.
  *   **Researcher B's Prediction:** Consciousness is defined by functional availability to control systems (including report). Without the potential for probe/response, the attribution of consciousness is empty.
  *   **Evidence Accepted:** No-report paradigms (e.g., conditioning, pupillometry, neural decoding) in subjects unable to report.
  *   **Falsification Condition:**
      *   **For A:** If ignition signatures are found in cases where all behavioral and physiological indicators suggest total absence of awareness (e.g., deep anesthesia) with no difference in signature from wakefulness.
      *   **For B:** If robust ignition signatures are found in locked-in patients that correlate with later verified conscious experience despite zero motor output potential during the scan.

  ## 4. Paradigm Analysis: Colour Change with Mask and Delayed Report

  **Paradigm Description:**
  Subject fixates a dot. At time $t_0$, colour changes (Red → Green).
  *   **Condition 1 (Immediate):** Subject presses key upon seeing change.
  *   **Condition 2 (Delayed):** Subject withholds press until tone at $t_0 + 3s$.
  *   **Variable:** Pattern mask presented at $t_0 + \Delta$.
  *   **Measures:** (a) Reported colour, (b) Assigned time of change.

  **Predictions:**

  | Measure | Researcher A (GWT) Prediction | Researcher B (MDT) Prediction |
  | :--- | :--- | :--- |
  | **(a) Reported Colour** | Determined by whether ignition occurred before the mask interrupted processing. If ignition succeeded, Green is reported. If mask prevented ignition, Red or no-change is reported. Report delay (Cond 1 vs 2) should not alter colour accuracy, only confidence. | Determined by the content available at the time of the key press. In Cond 2 (Delayed), memory decay and post-hoc reconstruction may alter colour report regardless of mask. Mask reduces content availability for the draft constructed at press time. |
  | **(b) Assigned Time** | Should correlate with ignition time ($t_0 + \text{processing lag}$). Cond 2 (Delayed) may introduce memory noise (variance), but the mean assigned time should not shift systematically based on the tone delay. | Should correlate with the probe time. In Cond 2, the assigned time may be biased toward the tone or the moment of decision ($t_0 + 3s$), as the "time of experience" is constructed at the moment of report. |

  **Diagnostic Value:**
  **Low.** This paradigm is not currently diagnostic.
  *   **Reasoning:** Researcher A can absorb any shift in assigned time in Condition 2 as "memory error" or "response bias" without conceding that the *experience* time changed. Researcher B can absorb any stability in assigned time as "stable draft construction" without conceding a fixed experience time. Both theories can accommodate any outcome by adjusting parameters regarding memory decay or ignition threshold.

  **Required Modification for Diagnosticity:**
  To make this diagnostic, we must remove the subject's agency in timing the report and decouple the neural measure from the behavioral measure.
  1.  **No-Report Neural Timing:** Use EEG to identify the latency of global ignition (e.g., P3b) on every trial.
  2.  **Forced-Choice Probe:** Instead of asking "When did you see it?", use a secondary task that relies on the content being available at specific times (e.g., a secondary probe that interferes only if the colour content is active in the workspace at $t_1$ vs $t_2$).
  3.  **The Critical Test:** If neural ignition latency is constant across conditions, but subjective time assignment shifts systematically with the report delay *and* predicts performance on the secondary task, Researcher B is supported. If subjective time assignment stays fixed to ignition latency despite report delay, Researcher A is supported. The current paradigm relies too heavily on explicit testimony, which both sides agree is malleable.

  ***

  ## Meta-Note: Vulnerabilities and Mind-Changing Conditions

  **Where this draft is most likely to fail:**
  1.  **Agreed Claim 1 (Cartesian Theater):** Researcher A may refuse to sign this if she interprets "Global Ignition" as functionally equivalent to a "finish line" that B unfairly labels a Theater. A might argue that denying a specific moment of availability smuggles in a form of eliminativism she cannot accept. She may insist that "no homunculus" does not entail "no definite time."
  2.  **Crux 1 (Independence):** This crux may be an artifact of the characterization. If "subjective time" is *defined* by report (as B insists), then measuring it independently is impossible by definition. A real partisan B would argue this crux is category-error ridden, not empirical.
  3.  **Softened Disagreement:** The document softens the ontological clash. B's position implies that A is asking a meaningless question (like "what is the north pole of a sphere?"). A's position implies B is denying reality (the causal chain exists, so the time exists). The document treats this as a methodological dispute to make it signable, but it is actually a metaphysical incompatibility.

  **What would change my mind about the structure of the dispute:**
  I am an analytical engine assessing the logical topology of this debate. My characterization of the dispute rests on the assumption that "consciousness" is a single natural kind that both parties are attempting to locate in time.

  The argument that would lead me to a materially different document is a **dissolution argument based on Predictive Processing (Active Inference).** If it were demonstrated that "temporal experience" is not a record of events nor a constructed draft, but a *control signal* for minimizing proprioceptive error, the A/B dichotomy collapses.
  *   **Why:** A assumes consciousness is a broadcast of *content*. B assumes consciousness is a narrative *output*. If consciousness is instead a process of *temporal binding for action selection* where "time" is a parameter optimized for motor control rather than a representation of reality, then asking "when did it become conscious?" is like asking "when did the engine become efficient?"—it is a gradient property of the system's operation, not an event.
  *   **Specific Evidence:** If neural data showed that "ignition" (A's marker) and "report construction" (B's marker) are actually the same process viewed at different frequencies of oscillatory coupling, serving only to synchronize motor output, then the dispute over "fact of the matter" regarding time vanishes. There is no fact of the matter because time itself is a controlled variable, not a measured one. This would require me to rewrite the Joint Statement not as a compromise between two ontologies, but as a dissolution of the question both are asking.
