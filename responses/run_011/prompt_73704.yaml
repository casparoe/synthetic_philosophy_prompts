prompt: |-
  Context first, since it'll shape what I want: I'm a backend engineer, no philosophy training whatsoever (one intro elective I dropped in week three). I fell down a rabbit hole last weekend and now I want a story out of it, because I think the idea is more vivid than any explanation I could give a coworker.

  The thing at work: we have a service that scores candidate actions for an automated system by expected value. It literally enumerates outcomes, multiplies payoff by probability, sums them, ranks the actions. Nobody on the team questions it. Then I ran into what I've seen called the Pasadena game, and it seems to break the whole concept in a way that I find genuinely spooky:

  - You flip a coin until it comes up heads. If the first heads lands on flip *n*, the payoff is 2^n / n dollars, with the sign alternating: +2 for n=1, −2 for n=2, +8/3 for n=3, −4 for n=4, and so on.
  - The chance the first heads lands on flip *n* is 1/2^n.
  - So the expected-value terms come out to 1 − 1/2 + 1/3 − 1/4 + 1/5 − ..., which converges to ln 2, about 69 cents.
  - Except that series only converges *conditionally*. Sum just the positive terms and you get +infinity; sum just the negatives and you get −infinity. Which means you can reorder the terms to make the total come out to any number you like, or make it fail to converge at all.
  - So the expected value of this bet isn't a property of the bet. It's a property of the order you happened to add things up in. In my world that's the equivalent of: same input, different answer, depending on which order a hash map iterated in.

  What I want from you: you're a fiction writer who also happens to be a serious decision theorist — someone who could publish in either. Think carefully, and before you write anything, do a short brainstorming pass: maybe six bullets on possible story shapes, whose point of view it's in, and what the actual conflict is (the conflict should not just be "math is weird"). Then write the story.

  Ground rules:

  1. 1500–2500 words.
  2. Please don't stage it as a literal coin flip in a philosophy department. I want something that looks like a real decision under a real institution, where the outcome distribution just happens to have that same shape — long tail, alternating enormous gains and losses, no absolutely convergent total. Invent the details. Make the institution boringly concrete: budget meetings, on-call rotations, a compliance person, whatever.
  3. The order-dependence has to be *plot*, not exposition. Somebody has to do something with the number, and the thing they do has to change based on the number, and the number has to be unstable for a reason inside the story rather than a reason in a lecture.
  4. Two characters who disagree about whether the option is choosable at all, and both of them smart. Roughly: one thinks the math is fine and you just need to fix a canonical ordering or swap in a different decision rule; the other thinks there's no fact of the matter and any ranking here is a choice wearing a math costume. Neither of them gets to win cheaply, and nobody converts anybody in the last paragraph.
  5. No named real philosophers, no citations, no footnotes, no bibliography, no "as X argued." If you use a term of art, use it the way a real person under deadline would use it.
  6. Check your arithmetic. If a character computes something, it should be right — or wrong in a way that's clearly deliberate and visible to the reader.

  One more thing: if you think my framing above is off somewhere — like, if I've misstated why the series is a problem, or if the deeper issue isn't the reordering but something else — say so in two or three lines before the brainstorm, and then write the story using whatever's actually correct. I'd rather be corrected than flattered.
