      *   What can't this reproduce? Real-world stakes (losing a job vs. candy). Reputation costs. Complex networks (this is a linear sequence, real life is a web).
      *   *Key Limitation:* In real life, we don't know the order of who decided first. Here, the sequence is explicit. In reality, the "order" is often obscured by media/time.

