      *   To make it ambiguous, the player shouldn't know if the crowd is wrong.
      *   *Revised R2 Rule:* You get 1 point for Correct Private Guess. You get 1 point if your Public Choice matches the Majority Public Choice.
      *   This creates the tension: "Do I say what I believe, or say what they said?"
      *   The discussion question: "In Round 2, if you changed your public answer to match the group, was it because you thought they knew something (like R1) or because you wanted the extra point?"

