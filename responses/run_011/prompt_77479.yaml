prompt: |-
  I am a junior and one of two student organizers of my school's philosophy club. We meet for forty minutes on Thursdays and typically draw fourteen to twenty students, sophomores through seniors, none of whom have studied probability or economics beyond algebra. I would like to run a session on the way a crowd of individually reasonable people can end up ignoring nearly all of the information it collectively possesses, because each of them defers to the visible choices of the people ahead. Please design a self-contained game we can play in a single meeting, using no phones, no money, and no materials more complicated than slips of paper, two opaque containers, and a whiteboard.

  The requirements I have in mind are these. First, there should be a hidden state of the world with exactly two possibilities, and each player should receive a private indication that points toward one of them with a fixed accuracy that you choose. Tell me what accuracy you chose and why that value makes the herd behavior likely to begin around the third or fourth player rather than the twelfth, given that our attendance varies between fourteen and twenty. Second, players must act in a fixed public sequence, each seeing every earlier public choice but nothing whatsoever about earlier players' private indications. Third, separately from the public choice, every player should record a private guess on a sealed slip that is collected but not read until the end. When the slips are opened, both tallies go on the board side by side, so that the room sees a public record that looks almost unanimous sitting next to private information that is nearly evenly divided. I want that gap to be the moment the idea lands, and I want the players to be able to measure it rather than merely be told about it. Fourth, please include a short second round in which the reward for being right is unchanged but an additional reward goes to whoever ends up in the majority. The purpose of the second round is that afterward the players genuinely cannot say whether they followed the crowd because they were persuaded or because they were paid to; build the round so that this ambiguity is a real feature of the rules and not just something I assert, and write the discussion questions so the group argues about which motive was operating on them.

  Along with the game, please give me: the exact wording of the instructions read to the players; a scoring scheme expressed in points redeemable for candy; a minute-by-minute timeline for the forty minutes; a mapping of specific moments in play onto specific parts of the idea; your recommendation on whether a public announcement made partway through the sequence would sharpen or wreck the effect, and if you keep it, where it should fall; the three things most likely to go wrong the first time I run this and how to handle each, including what to do if the first two players happen to split and no herd ever forms; and a candid statement of which feature of the phenomenon the game cannot reproduce and that I will have to supply myself in discussion. The players should not hear the name of the effect until the discussion, and nothing I say before play begins should explain it to them.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Target Audience:** High school philosophy club (Juniors/Seniors, some Sophomores), 14-20 students. No advanced math/econ background.
      *   **Time:** 40 minutes total.
      *   **Topic:** Informational Cascades (herd behavior where individuals ignore private info to follow public actions).
      *   **Constraints:** No phones, no money, simple materials (paper, 2 containers, whiteboard).
      *   **Key Mechanics:**
          *   Hidden state (2 possibilities).
          *   Private signal (fixed accuracy).
          *   Public sequence of choices.
          *   Private guess (sealed, revealed at end).
          *   Comparison of Public vs. Private tallies to show the "gap."
          *   Round 2: Add a conformity bonus to blur the line between persuasion and incentive.
          *   Discussion questions focusing on motive ambiguity.
      *   **Deliverables:** Instructions, scoring (candy), timeline, mapping of moments to concepts, advice on announcements, troubleshooting (including split start), and limitations of the simulation.
      *   **Tone:** Philosophical, engaging, precise. Do not name the effect until discussion.

  2.  **Designing the Core Mechanics (The "Cascade"):**

      *   *Hidden State:* Red Urn vs. Blue Urn.
      *   *Private Signal:* Drawing a ball/chip from the urn? No, too slow for 20 kids. Better: Pre-written slips in envelopes or just handed out. Let's use slips of paper drawn from a bag *before* the game starts to save time, or just hand them out randomly based on a pre-determined distribution. Actually, the prompt asks for "private indication that points toward one of them with a fixed accuracy."
      *   *Accuracy:* To trigger a cascade early (3rd or 4th player), the signal needs to be good but not perfect. Standard literature (Bikhchandani et al.) suggests $p > 0.5$. If $p$ is too high (0.9), everyone follows their signal. If $p$ is too low (0.51), it takes too long.
      *   *Calculation:*
          *   Player 1 follows signal.
          *   Player 2 follows signal.
          *   Player 3 sees P1 and P2.
          *   If P1 and P2 match, P3 should follow them regardless of signal (Cascade starts).
          *   If P1 and P2 split, P3 follows signal.
          *   To ensure cascade starts around 3-4: We need P1 and P2 to match often.
          *   If Signal Accuracy = 2/3 (approx 67%).
          *   Probability P1 & P2 match on Correct State: $(2/3) * (2/3) = 4/9$.
          *   Probability P1 & P2 match on Wrong State: $(1/3) * (1/3) = 1/9$.
          *   Total match probability = $5/9$ (~55%).
          *   If they match, P3 cascades.
          *   If they split (4/9 chance), P3 follows signal. P4 then sees (Match, Signal) or (Split, Signal).
          *   Actually, standard theory says once two people match, the cascade begins. With 14-20 students, if we want it to happen *reliably* but not instantly (P1), we need the signal accuracy to be high enough that P1/P2 trust themselves, but low enough that P3 trusts the crowd more.
          *   *Decision:* Let's set Signal Accuracy at **70% (7 out of 10)**.
          *   *Why:* At 70%, P1 and P2 will likely follow their signals. There is a significant chance (30%) they are wrong. If P1 and P2 both get "Red" (either both right or both wrong), P3 sees two Reds. Even if P3 gets "Blue," the probability that the state is Red given two public Reds is higher than the probability of Red given one private Blue.
          *   *Math Check:* Prior = 0.5. Likelihood of 2 Public Reds = $0.7^2$ (if True) vs $0.3^2$ (if False). Ratio = 49:9. Private signal adds 7:3. Total odds heavily favor Public.
          *   *Timing:* With 70% accuracy, there's a ~58% chance P1 and P2 match. If they do, cascade starts at P3. If they split (42%), P3 follows signal. Then P4 sees (R, B, R). No cascade yet. P5 sees (R, B, R, R). Now there are 3 Rs, 1 B. Cascade likely. So 3rd or 4th is realistic.
      *   *Materials:* Two opaque containers (Urns). Slips of paper (Signals). Whiteboard (Tally).

  3.  **Designing Round 2 (The Conformity Bonus):**

      *   Goal: Blur the line between "I think they know something" (Informational) and "I want to fit in/get paid" (Normative/Incentive).
      *   Mechanic: Same game, but add points for being in the *majority of public choices*, regardless of truth.
      *   Problem: If I tell them "You get points for majority," they might just lie to match.
      *   Constraint: "Players must act in a fixed public sequence."
      *   Refinement: In Round 2, keep the private guess sealed. The *Public Choice* is what gets the conformity bonus.
      *   Incentive Structure:
          *   Correct Private Guess = 1 Candy.
          *   Correct Public Choice = 1 Candy.
          *   Round 2 Extra: If your *Public Choice* matches the majority of *Public Choices*, +1 Candy.
      *   This creates the ambiguity: Did I choose Red because I thought the Urn was Red (Informational Cascade), or because I saw everyone else choosing Red and wanted the bonus (Normative Conformity)? The rules make both rational.

