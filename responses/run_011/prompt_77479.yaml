  ## 9. Limitations (What You Must Supply)

  **The Game Cannot Reproduce: The Obscurity of Order.**
  In this game, students know exactly who spoke first (Player 1) and who spoke last (Player 20). In the real world (stock markets, fashion, politics), we rarely know who formed an opinion first. We see a "crowd" all at once.
  *   **Your Task:** In the final wrap-up, you must explain this. *"In this game, you knew Player 1 had no information. In real life, we don't know if the person we are copying is a 'Player 1' (an expert) or a 'Player 10' (a copycat). That uncertainty makes real-world cascades much harder to break."*

  **Name of the Effect:**
  Only reveal this in the last 2 minutes: *"Philosophers and economists call this an **Informational Cascade**. It explains how reasonable people, acting rationally on limited information, can collectively produce irrational outcomes."*
