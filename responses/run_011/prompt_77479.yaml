answer: |-
  # Activity Plan: The Silent Herd

  ## 1. Game Mechanics & Design Notes (For the Organizer)

  **The Hidden State:**
  There are two possibilities: **Red** or **Blue**. You (the organizer) decide this secretly before the session begins (flip a coin).

  **The Private Signal (Accuracy: 70%):**
  You will prepare 20 slips of paper in an opaque container.
  *   **14 slips** match the Hidden State (e.g., if State is Red, 14 say "Red").
  *   **6 slips** contradict the Hidden State (e.g., 6 say "Blue").
  *   **Why 70%?** This is the mathematical "sweet spot." If accuracy is too high (90%), students trust their slip over the crowd. If too low (60%), the crowd needs too many people to form before it outweighs a private signal. At 70%, if the first two students match (which happens ~58% of the time), the third student mathematically *should* ignore their own slip and follow the crowd. This ensures the cascade begins early (Player 3 or 4) rather than late (Player 12).

  **The Sequence:**
  Students act in a fixed order (e.g., left to right). They announce a color publicly, then seal a private guess.

  **The "Gap":**
  The core visual is the Whiteboard. One column tracks **Public Announcements** (which will likely become 100% one color). The other tracks **Private Slips** (revealed at the end, which will remain roughly 70/30).

  **Round 2 Ambiguity:**
  In Round 2, you add a "Conformity Bonus." This makes it impossible for a student to know if they followed the crowd because they were *persuaded* (Informational Cascade) or because they were *incentivized* (Normative Conformity). Both are rational strategies under the new rules.

  ---

  ## 2. Materials Checklist

  *   **Whiteboard & Markers:** Two different colors (e.g., Black for Public, Red for Private).
  *   **Two Opaque Containers:** One for drawing signals, one for collecting private guesses.
  *   **Slips of Paper:** 40 small slips total (20 for Round 1, 20 for Round 2).
  *   **Candy:** ~60 pieces total (3 per student max).
  *   **Prepared Signal Slips:** Before the meeting, write "Red" on 14 slips and "Blue" on 6 slips (assuming you chose Red as the State). Do the same for Round 2. Put them in Container A.

  ---

  ## 3. Verbatim Instructions (Read Aloud)

  **Introduction (Round 1)**
  "I have secretly chosen a state of the world: either **Red** or **Blue**. I have placed 20 slips in this container. 70% of these slips tell the truth about the state. 30% lie. You will each draw one slip, look at it privately, and return it to the container without showing anyone. This is your **Private Signal**.

  "We will go in order from left to right. When it is your turn, you must do two things:
  1.  **Announce** publicly to the room: 'I choose Red' or 'I choose Blue.' I will write this on the board.
  2.  **Write** your genuine guess of the *true state* on this private slip, seal it, and drop it in this second container. I will not open these until the end.

  "Your goal is to guess the true state correctly. For every correct private guess, you earn **1 Candy Point**. Your public announcement does not earn points, but you must make one. You may not talk, gesture, or show your slip. Begin."

  **Intermission (Between Rounds)**
  "Round 1 is over. We will tally points shortly. We are playing Round 2 immediately. The Hidden State is **new** (I have flipped the coin again). The accuracy of the signals is still 70%.

  "The scoring has changed. You still earn **1 Candy Point** for a correct private guess. However, you now also earn **1 Bonus Point** if your *Public Announcement* matches the **Majority of Public Announcements** of the whole group. You can earn up to 2 points this round. Begin."

  **The Reveal (After Round 2)**
  "Stop. I will now open the private slips. I will count how many of you privately guessed Red vs. Blue, and I will write that next to the Public tally."

  ---

  ## 4. Minute-by-Minute Timeline (40 Minutes)

  *   **00:00 – 00:05:** **Setup & Rules.** Read Round 1 instructions. Distribute slips (have students draw from Container A as they sit or pass the container quickly).
  *   **00:05 – 00:15:** **Round 1 Play.** Students announce publicly. You tally on the left side of the board. Students seal private slips into Container B. *Pace: 30 seconds per student max.*
  *   **00:15 – 00:20:** **Round 1 Reveal.** Open Container B. Count private guesses. Write tally on the right side of the board. Highlight the discrepancy (e.g., Public: 18 Red / 2 Blue vs. Private: 13 Red / 7 Blue). Distribute R1 candy.
  *   **00:20 – 00:25:** **Round 2 Rules & Setup.** Read Round 2 instructions. Emphasize the Majority Bonus. Reset signals (use fresh slips).
  *   **00:25 – 00:35:** **Round 2 Play.** Same sequence as R1.
  *   **00:35 – 00:37:** **Round 2 Reveal.** Open slips. Tally on board. Distribute R2 candy.
  *   **00:37 – 00:40:** **Discussion.** Ask the three key questions (below). Name the effect ("Informational Cascade") in the final minute.

  ---

  ## 5. Mapping Play to Concepts

  | Moment in Play | Philosophical Concept | What to Point Out |
  | :--- | :--- | :--- |
  | **Player 1 & 2** | **Independent Judgment** | They have no public data. They *must* trust their private signal. |
  | **Player 3 (if P1=P2)** | **The Tipping Point** | P3 sees two matching public choices. Mathematically, the public evidence now outweighs their private signal. They ignore their own eyes. |
  | **Player 4+** | **The Cascade** | Even if P4's signal contradicts the crowd, the weight of P1, P2, and P3 is too heavy. They follow the herd. |
  | **The Reveal** | **The Information Loss** | The Public Tally looks unanimous (100% Red). The Private Tally shows the truth was uncertain (70% Red). The group *collectively* ignored 30% of its own knowledge. |
  | **Round 2** | **Normative vs. Informational** | Did you follow the crowd to be *right* (R1 logic) or to be *popular/paid* (R2 logic)? The action is the same; the motive is blurred. |

  ---

  ## 6. Recommendation on Public Announcements

  **Do not make any public announcement partway through the sequence.**

  *   **Why:** Announcing "We are seeing a cascade now" or "The state is actually Red" wrecks the effect. The power of the phenomenon relies on the students *feeling* the uncertainty. If you intervene, you become an external authority, and they will follow you because you are the teacher, not because of the peer dynamic.
  *   **Exception:** The only announcement is the **Reveal** at the end. The shock of the data must be delayed to maximize the contrast between "what we said" and "what we believed."

  ---

  ## 7. Troubleshooting: Three Things Likely to Go Wrong

  **1. The "Split Start" (No Cascade Forms)**
  *   **The Problem:** Player 1 says "Red," Player 2 says "Blue." Player 3 sees a split and follows their own signal. The public tally stays mixed (e.g., 10 Red, 10 Blue). The "Gap" doesn't look dramatic.
  *   **The Fix:** Do not panic. This is a valid outcome. In the discussion, say: *"A cascade requires an initial imbalance. Because the first two signals split, the public information remained neutral. This shows that herds are fragile; they depend on the luck of who speaks first."*
  *   **Prevention:** If you are willing to nudge the simulation, ensure the first 3 slips drawn are identical (e.g., all Red). This guarantees the cascade starts at Player 3. Given you want the lesson to land, **I recommend pre-stacking the first 3 slips** in the container so they are drawn first.

  **2. Students Colluding or Laughing**
  *   **The Problem:** Seniors might try to signal each other with winks or try to "break" the game by lying randomly.
  *   **The Fix:** Frame the Candy Points seriously. *"If you break the protocol, you invalidate the data, and no one gets candy."* If a student announces randomly, mark it on the board but note it as "Noise." Do not stop the game.

  **3. Running Out of Time**
  *   **The Problem:** 20 students announcing takes longer than expected.
  *   **The Fix:** Enforce the "Stand, Say Color, Sit" rule strictly. If you pass 35 minutes before the Reveal, skip the Round 2 Reveal tally. Just ask for a show of hands: *"Who changed their public answer in Round 2 to match the majority?"* and move straight to discussion.

  ---

  ## 8. Discussion Questions (The Ambiguity)

  Ask these in order. Do not lecture; let them argue.

  1.  **The Measurement:** "Look at the board. In Round 1, how many of you announced a color publicly that was different from the slip you drew?" (Have them raise hands). "Why did you do that?"
      *   *Target Answer:* "I thought the people before me knew something I didn't."
  2.  **The Ambiguity:** "In Round 2, the rules added a bonus for matching the majority. If you announced the majority color, raise your hand. Keep it up if your *private slip* was the opposite color." (Count these hands). "To this group: Can you tell me, honestly, whether you did that because you thought the crowd was *right*, or because you wanted the *candy*?"
      *   *Target Answer:* They will realize they cannot distinguish the two motives. The action is identical.
  3.  **The Cost:** "In Round 1, the crowd ended up unanimous, but our private slips showed we actually had dissenting information. Where did that information go? Who paid the price for ignoring it?"
      *   *Target Answer:* The group collectively became less smart than the individuals were.

