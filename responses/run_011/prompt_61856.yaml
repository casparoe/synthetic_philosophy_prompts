answer: |-
  **Project Title:** Distinguishing Mechanisms of Elite Overproduction: A Methodological Reconstruction of Structural-Demographic Theory

  **Project Summary**
  Structural-demographic theory (SDT) has become a dominant framework for explaining state instability, positing that "elite overproduction"—the accumulation of more aspirants to power than available positions—drives political crisis []. While the correlation between elite surplus and instability is well-documented, the causal mechanism remains a black box. This project contends that "elite overproduction" bundles three distinct mechanisms with divergent functional forms: a *crowding* mechanism (level effect), an *expectations* mechanism (change effect), and a *coalition* mechanism (interaction effect). Current empirical practice treats these as synonymous, leading to model misspecification. This twelve-month fellowship will develop a methodological protocol to distinguish among these mechanisms, transforming a theoretical ambiguity into an adjudicable empirical test.

  **Research Question and Significance**
  The central research question is: *Which functional form of elite overproduction best predicts the onset of political instability in premodern states?*

  This is not a terminological quibble but a substantive methodological problem with distinct implications for historical explanation and forecasting. If the *crowding* mechanism holds, instability is a function of the absolute ratio of aspirants to positions; pressure builds linearly regardless of trend. If the *expectations* mechanism holds, instability is driven by the rate of change in mobility prospects; a high but stable ratio is benign, while a sharp reversal triggers crisis []. If the *coalition* mechanism holds, overproduction is conditional on elite cohesion; a surplus is harmless if incumbents remain unified, but fatal if factions emerge [].

  Confusing these forms leads to diagnostic error. A state with a high, stable ratio of elites might be predicted to fail under the crowding model but remain secure under the expectations model. Conversely, policy responses differ: reducing the number of aspirants addresses crowding, but only restoring mobility trajectories addresses expectations, while purging factions addresses coalition risks []. Furthermore, forward-looking forecasts based on SDT currently rely on extrapolating trends without knowing which derivative of the trend matters. Resolving this trilemma is a prerequisite for SDT to move from a post-hoc narrative device to a predictive scientific theory.

  **Plan of Work**
  The primary challenge is that premodern data is sparse; distinguishing between a level, a first difference, and an interaction term typically requires more observations than single-case historical studies possess. To cope with this, the project will not seek new archival data but will construct a structured, episode-level database from existing secondary literature. By treating distinct temporal phases within polities (e.g., decades within a dynasty) as observations, rather than treating the polity as a single data point, the project increases statistical power while accounting for within-case correlation.

  *Months 1–3:* Develop a coding protocol to extract proxy measures for elite numbers, position availability, and cohesion from standardized historical surveys. This involves operationalizing "thin proxies" (e.g., university enrollments, patenting of titles, frequency of succession disputes) into comparable indices [].
  *Months 4–8:* Data collection and coding. The goal is to code approximately 50–80 distinct temporal episodes across at least 10 distinct premodern polities. This aggregation allows for the estimation of interaction effects which are impossible in single-case narratives.
  *Months 9–10:* Statistical analysis. I will employ hierarchical Bayesian models to handle measurement error inherent in historical proxies. This approach allows for partial pooling of information across cases, improving estimates where data is particularly thin [].
  *Months 11–12:* Synthesis and dissemination. Drafting the final monograph and two journal articles detailing the methodological protocol and the empirical results.

  **Methodological Defense**
  Three alternative approaches are plausible but inferior for this specific problem. First, adding another deep case study would enrich narrative detail but cannot solve the identification problem; a single trajectory cannot distinguish between a level effect and a trend effect without counterfactual variation []. Second, adding further proxies to an existing regression without resolving the functional form specification merely adds noise to a misspecified model. Third, building an agent-based model (ABM) is tempting, but ABMs require the researcher to stipulate the mechanism *ex ante*. An ABM can demonstrate how a coalition mechanism *could* work, but it cannot test whether it *did* work relative to the alternatives. The proposed comparative-episodic approach is the only method capable of adjudicating between the functional forms using actual historical variation.

  **Success and Failure Conditions**
  A successful result will demonstrate that one functional form consistently outperforms the others in out-of-sample predictive accuracy across the coded episodes. For example, if the interaction term (overproduction × cohesion) yields a significantly higher posterior probability of predicting instability than the level term alone, the coalition mechanism is supported.

  However, I must define the conditions for project failure candidly. Given the noisiness of premodern proxies, it is possible that the three mechanisms are observationally equivalent within the available evidence. If the measurement error is so large that the confidence intervals for the level, change, and interaction terms overlap completely, the project must conclude that current historical evidence is insufficient to test SDT's core claim. This would be a methodological finding—that the theory is currently unfalsifiable—rather than a substantive confirmation of any mechanism. Recognizing this limit is preferable to forcing a false positive through overfitting.

  **Scope and Limitations**
  This one-year project must stop at the identification of the dominant functional form in premodern state contexts. It will not resolve the micro-foundations of *why* a specific mechanism operates in a specific cultural context, nor will it extend the analysis to modern democratic states where elite definition differs fundamentally []. The project treats "instability" as a binary onset event, leaving aside the duration or severity of crises. These limitations define the necessity of a follow-on grant. A subsequent project would need to return to qualitative process-tracing within the specific cases identified here to uncover the causal pathways (e.g., specific correspondence or memoirs) that explain why the statistical relationship holds, moving from correlation to causal process. This fellowship provides the necessary structural scaffolding to ensure that future qualitative work tests the correct mechanism.
