          *   Asymbolia Impact: Compatible. An impersonal theorist can say "this is bad for the human organism" even if the subject is indifferent.
          *   Does it license dismissal? Yes, if the leader assumes an objective theory of value. But this is a heavy metaphysical commitment to hide in a slogan.

      *   *Reading 5: Pro Tanto Badness.*
          *   Claim: Pain is always a negative value, even if outweighed by goods (e.g., dentist visit).
