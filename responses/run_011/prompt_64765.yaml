          *   Asymbolia Impact: None. Asymbolics might still agree it's not a *means* to an end, even if it doesn't bother them.
          *   Does it license dismissal? No. This doesn't address *why* it's bad (phenomenology vs. attitude).

      *   *Reading 2: Essentialist/Phenomenal Intrinsicism (The Strong Claim).*
          *   Claim: The badness supervenes on the intrinsic phenomenal character. Any phenomenal duplicate is equally bad.
          *   Status: Contested (Evaluativists vs. Imperativists vs. Feeling Theorists).
          *   Asymbolia Impact: Strongly counts against this. If the feel is the same but the badness is gone (or muted), badness doesn't supervene on the feel alone.
          *   Does it license dismissal? This is likely what the leader *meant*, but asymbolia challenges it directly. Stating it explicitly makes it vulnerable.

      *   *Reading 3: Universal Subject-Relative Badness.*
          *   Claim: Every pain is bad *for the person feeling it*.
          *   Status: Contested/False (given asymbolia).
          *   Asymbolia Impact: Asymbolics say "it doesn't bother me." If we trust introspection, it's not bad *for them*.
          *   Does it license dismissal? Only if you deny asymbolics feel *real* pain (the "no genuine pain" view).

      *   *Reading 4: Impersonal Badness.*
          *   Claim: Pain is a bad state of affairs, regardless of whether the subject minds.
