answer: |-
  In the cabinet behind me, there are two folders. One has the old number, closed in 2019. One has the new number, opened last month. The letters the schoolchildren write every spring still go into the old folder, because nobody at the front desk could bring themselves to do otherwise. The insurance papers go into the new one, because an auditor needs to know where the money went. For two years, I have tried to make those two folders agree, and I cannot.

  We are here because a statue was lost. We are here because a statue was found, or made, or returned. Mrs. Vane, your grandfather's mold was in our storeroom the whole time. It held the shape of his hand. When the Kestrel Foundry poured the bronze, that shape was pressed into the metal again. The thumbprint on the shoulder is there, to the millimeter. But my daughter, who is seventeen, says a thumbprint you did not make with your own thumb is a picture of a thumbprint. She is right. Elias Vane did not touch this bronze.

  Danny and his crew at Kestrel did. They poured the metal. They cut the sprue. Danny wants us to mount that sprue beside her, the leftover channel in the shoebox. He says it is the honest part. He is right, too. The metal in this figure is mixed. Some of it came back from the smelter, mixed with other people's scrap. Some of it is fresh. Nobody knows which lump is which. The sprue is the only part that hasn't been told a story yet.

  We have spent two years asking if this is her. The metal is new, but the waiting is old.

  Rev. Talbot asked me if the blessing you said in 1987 still holds. It does not. That blessing was for a specific thing that stood on this plinth, and that thing was melted down. This is a new thing. It needs a new blessing, not because the old one failed, but because this statue has not heard it yet. Say it again, Reverend. Say it for this bronze, here, today.

  Mrs. Vane, you told me you do not intend to hear this called a reproduction. I will not call it that. A reproduction is a copy made to deceive. This is not a copy made to deceive. It is a work made from his mold, by his town, to fill his place. It is his work, realized again. But it is not the same bronze he poured.

  Ms. Deane, the insurance payment was for a total loss. The loss was real. The old Nora is gone. We are not handing back the money, because we are not handing back the statue that was stolen. We are handing you a record that says the file is closed.

  Danny, you made this statue. You and your crew. Do not let anyone tell you merely delivered her. You cast her. But the town did not hire you to make a new statue. They hired you to bring the old one back. You cannot do both, and yet you have done both.

  I run a chandlery. I sell rope and fuel and paint. I know that when a boat is sunk, you build a new one. You might give it the same name. You might use the same plans. But you do not sail the old boat. You sail the new one, and you hope it handles the same in the water.

  We are not sailing the old boat. We are standing on the same shingle, looking at the same harbor, waiting for the same boats to come in. The bronze is new, but the waiting is old.

  So here is what the records will say. The accession number is new. The blessing is new. The metal is new. The name is Nora. The plinth is the same. The harbor is the same. And the waiting, which is what this statue is for, has not stopped for a single day.

  Mount the sprue, Danny. Put it beside her. Let the children see what is left over when a statue is made. Let them see the honest lump. Let them know that we did not find her in the water. We made her, because we could not bear the empty plinth.

  Light the lantern. It is time to begin again.

  I have committed you to the position that this is a new object materially and legally, which retains the old name and social function solely by the town's continued consent.
