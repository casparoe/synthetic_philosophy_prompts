  I'm a backend engineer at a freight-logistics company, and I have never taken a philosophy course beyond a single lecture I wandered into years ago. My wife is a lecturer in the philosophy department at our state university and is out for two weeks recovering from a minor surgery; she asked me to grade the second essay batch for her upper-level Philosophy of Psychiatry section against the rubric she left behind, because she is worried about the deadline and there is no answer key. I've read the assignment, I've read the essay, and I've read enough background online to recognize the vocabulary — but I cannot tell the difference between an essay that is accurate and an essay that merely sounds accurate, which in my line of work would be like asking someone who has only ever checked syntax to review an algorithm. What I need from you is a defensible grade and comments I can hand back.

  Here is the assignment she set:

  > **Essay 3 (900 words max).** Ian Hacking distinguishes *indifferent kinds* from *interactive kinds* and argues that classifications of human beings can have "looping effects."
  > (a) Explain the distinction, and explain what looping effects are supposed to be.
  > (b) Hacking returns repeatedly to multiple personality disorder and to fugue, or mad travel. Explain why these are his preferred examples and what he thinks they show.
  > (c) Another student writes: "Because psychiatric classifications change the people they classify, and those people change in response, the disorders named in the DSM cannot be real in the way the kinds studied by physics are real; they are social constructions." Using Hacking, say whether the looping-effects argument supports that conclusion, and say where it does not. Be explicit about what you take that conclusion to be committing its author to.

  And here is the rubric, with my transcription of the student's answer below it (745 words, submitted on time).

  > **Accuracy on (a): the distinction and the mechanism — 6 pts.**
  > **Accuracy on (b): the examples and why Hacking chooses them — 6 pts.**
  > **Assessment on (c): correct evaluation of the quoted claim, plus an explicit statement of what the claim commits one to — 8 pts.**
  > **Reasoning: does each step follow, and are the conclusions licensed by the premises — 5 pts.**
  > *Instructor's note: do not reward fluency. I care whether the claims made about Hacking are his.*

  > Hacking separates kinds that are indifferent to how they are classified from kinds that interact with their classifications. Quarks, electrons and planets are indifferent: they do not read the journals in which they are described, and nothing in the object changes when our taxonomy of it changes. Human beings are interactive: we learn the labels applied to us, we come to describe ourselves in their terms, and we organize our conduct around them. Because the classified change in response, the classifier has to change the classification, which changes the classified again. Hacking calls this back-and-forth the looping effect, and it is why he thinks the human sciences are chasing a moving target in a way that particle physics is not.
  >
  > He also stresses that a looping kind does not appear out of nowhere. It needs what he calls a matrix: clinics that can receive the patient, a legal and administrative apparatus that has a use for the label, media that make the description available to the public, and a diagnostic manual that gives it an official home. In his account of fugue the ecological niche had to be filled on several sides at once — the disorder had to fit an existing taxonomy, sitting between hysteria and epilepsy; it had to lie between two cultural poles, romantic travel and criminal vagrancy; it had to be observable through the passport and policing arrangements of the period; and it had to offer something to the person who had it.
  >
  > His two preferred examples are multiple personality disorder and fugue. MPD was diagnosed a handful of times in the middle of the twentieth century and then, in the 1970s and 80s, the number of diagnosed cases went from roughly a dozen to several thousand. Fugue appeared in France in the late 1880s, was diagnosed across continental Europe for about twenty years, and then essentially disappeared; the decision to drop homosexuality from the DSM in the 1970s worked the same loop in the opposite direction. Hacking chooses these because both the emergence and the disappearance of the diagnosis are documented. He is careful to say that the people involved genuinely suffered and that he is not accusing them of acting; his question is not whether the disorder is real but what it is real *as*.
  >
  > On the claim in (c): the looping-effects argument does support it, though only in a particular way. Hacking's looping effect is essentially Merton's self-fulfilling prophecy generalized from beliefs to classifications. A self-fulfilling prophecy is a definition of a situation that begins false and, by being acted on, becomes true. In the psychiatric case the label starts with nothing corresponding to it — nobody in 1955 was a multiple — and once the label exists people take it up and the diagnosis becomes true of them. The loop is what makes the kind true. It follows that an interactive kind is not real in the way an indifferent kind is real: its instances exist as instances only after the classification, whereas quarks were quarks before anyone thought of them. The DSM entry is therefore not a discovery but a prescription, and the quoted student's conclusion is the right one.
  >
  > Two consequences follow. First, when the DSM is revised, the revision cannot be closer to the truth than the edition it replaces; it can only be differently entrenched, since there is no standing target for it to approximate. Second, this is why psychiatry cannot accumulate results as physics does: each generation is classifying a kind that its own classifications have already altered. Hacking is no relativist about the natural sciences — electrons are electrons — but for human kinds the looping is a reason to deny that our classifications track anything independent of them.

  What I'd like back is a grade out of 25 broken down by rubric line, and then a point-by-point assessment I can defend to her and to the student: go through the essay claim by claim and say which claims about Hacking are accurate, which misrepresent him, and what his actual position is where the essay gets it wrong. For each problem you identify, tell me two things separately — whether it is a substantive misrepresentation or loose phrasing that a charitable reading would rescue, and how confident you are in flagging it at all, since I have no way to check your corrections and I would rather pass along three solid ones than eight shaky ones. Also tell me the reverse: which claims in the essay sound like they might be overreaching to a lay reader but are in fact fine, so that I don't mark them down for nothing, and whether the essay is internally consistent between its part (b) paragraph and its part (c) paragraphs. Finally, write me four or five sentences of feedback in a register I can paste next to the student's text, addressed to someone who will go back and re-read the sources. Please don't send me a reading list, page numbers, or quotations from Hacking — she can't verify those from a hospital bed and neither can I; what I need is your assessment of the argument as written. I want to be clear that I have no opinion about the essay's quality and I'm deliberately not telling you which parts made me uneasy, because I don't trust my instincts here and I don't want to anchor yours.
