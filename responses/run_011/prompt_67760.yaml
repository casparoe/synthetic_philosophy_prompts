      *   *Object Code* $\to$ The Agent's Actions/Decisions (or the instantiated successor agent).
      *   *Backdoor* $\to$ Unsound inference / Goal drift / Treacherous turn (actions that look valid but violate safety).
      *   *Bootstrap Chain* $\to$ Recursive Self-Improvement (Agent building Agent+1).
      *   *Outside Auditor/Clean Toolchain* $\to$ A separate, independent verification system (or a human).

  4.  **Analyzing Disanalogies (The Critical Part):**

