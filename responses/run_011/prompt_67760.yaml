      *   *The "Clean Source":* In Thompson, there *exists* a clean compiler source somewhere (conceptually). In Löb, there is no "cleaner" logic available to the system that can prove the system's soundness without begging the question. Gödel's Second Incompleteness Theorem says the system *cannot* contain its own consistency proof.
      *   *Independence:* Ravi's fix relies on *causal* independence (two teams didn't talk). In logic, if two systems are strong enough to encode arithmetic, they are subject to the same incompleteness phenomena. If System A checks System B, and B checks A, you run into circularity issues unless one is strictly stronger (which leads to the infinite regress Ravi wants to avoid).
