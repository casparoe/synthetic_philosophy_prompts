      *   *Selection:* The "Self-Weighing Scale" or "The Map that Draws Itself." Let's go with the **Self-Weighing Scale**. A scale cannot verify its own accuracy without an external weight. If it tries to weigh itself, it just measures its own casing. If two scales weigh each other, they can agree on being wrong together.

