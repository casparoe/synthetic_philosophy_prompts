  0.29

  ### Decomposition

  **1. The baseline: 0.20**
  The archaeological record is dominated by mass graves (catastrophe bias), while ethnographic data comes from pacified contact zones (peace bias). The catastrophe bias dominates because mass burials preserve better and attract excavation, inflating prehistoric violence rates by an order of magnitude. Comparing modern states to this inflated baseline manufactures the "factor of five" decline.

  **2. The war series: 0.35**
  Battle deaths follow a power-law distribution where the mean is unstable. The post-1945 "Long Peace" is statistically indistinguishable from a random clustering in a heavy-tailed series. A genuine trend is not distinguishable from sampling noise at this sample size; the decline may be a run of luck rather than a structural shift.

  **3. The homicide series: 0.55**
  European records are robust but conflate behavior with survival. Improvements in trauma care convert what would have been homicides into assaults, artificially lowering the death rate. Legal reclassifications (infanticide, dueling) remove categories without changing underlying aggression. At best, half the observed fall is behavioral; the rest is medical and bureaucratic.

  **4. The aggregate: 0.35**
  Interpersonal violence has fallen while state violence (prisons, surveillance, structural famine) has risen or shifted form. Civil war intensity has not moved in lockstep with interstate war. There is no fact of the matter about the sum; "violence" is a convenience of aggregation that hides divergent trends in how power is exercised.

  **5. The denominator: 0.45**
  Under the "acquaintance burden," $P$ becomes less likely. Urbanization isolates individuals; a stable per-capita rate in a city of millions results in fewer known victims per person than in a village. If violence does moral work through social proximity, the decline is significantly smaller than per-capita statistics suggest, undermining the "factor of five" claim.

  ### Arithmetic

  I treat the five terms as independent probabilities that each specific objection *fails* to invalidate the strong claim of $P$. Because $P$ requires all these pillars to hold simultaneously to support a "worldwide factor of five real change" conclusion, I combine them using the geometric mean. This penalizes the weak links (Baseline, War) more severely than an arithmetic average while avoiding the near-zero collapse of a straight product.

  $$ P = (T1 \times T2 \times T3 \times T4 \times T5)^{1/5} $$
  $$ P = (0.20 \times 0.35 \times 0.55 \times 0.35 \times 0.45)^{0.2} $$
  $$ P = (0.00215)^{0.2} \approx 0.29 $$

  ### Closing Deliverables

  **1. Most sensitive term:**
  **Term 1 (The baseline).** If prehistoric violence rates were actually comparable to modern rates (once excavation bias is corrected), the "factor of five" decline vanishes entirely. This single variable carries the most weight in the magnitude of your thesis.

  **2. Single piece of evidence:**
  A complete mortality census from a large, non-catastrophic prehistoric settlement (e.g., Çatalhöyük or similar) where every burial is accounted for over a multi-generational span, showing a violent death rate comparable to modern states. A researcher could look for isotopic analysis of existing skeletal collections that distinguishes routine mortality from mass slaughter events.

  **3. Credence of decisive error:**
  **0.29.** This is the complement of my credence in $P$. Since $P$ represents the standard "Real Decline" narrative, and I assign it a 29% probability of being fully true as stated, there is a 29% chance an informed reviewer could demonstrate that the decline is real and behavioral rather than substantially bookkeeping. Conversely, there is a 71% chance your thesis holds, though likely with nuanced adjustments to the magnitude.
