answer: |-
  1. **Cognitive Stability (Non-negotiable):** The theory must not generate a probability distribution over observer-states that implies the overwhelming majority of observers with our evidence are hallucinating.
     *Motivation:* If a theory predicts that our evidence is likely false, it destroys the warrant for believing the theory itself, rendering it epistemically self-defeating rather than empirically refuted.

  2. **Record Reliability Explanation (Non-negotiable):** The theory must provide a causal or nomological account for why macroscopic records correlate with past events, rather than merely being consistent with their existence.
     *Motivation:* Consistency is insufficient because a chaotic fluctuation is consistent with any configuration; science requires that records be reliable traces, not coincidental arrangements.

  3. **Measure Specification (Negotiable but costly to surrender):** The theory must either intrinsically define a measure over observer states or explicitly adopt an external typicality principle to convert physical probabilities into predictive expectations.
     *Motivation:* Physical probabilities over microstates do not automatically map to indexical probabilities ("what should I expect to be"); without a measure, the theory cannot generate predictions about our specific situation.

  4. **Past Hypothesis Status (Negotiable but costly to surrender):** The theory must secure the low-entropy boundary condition as a fundamental constraint or law, rather than deriving it as a statistical fluctuation from a high-entropy equilibrium.
     *Motivation:* Deriving the low-entropy past statistically inevitably makes Boltzmann Brains more probable than ordinary observers; avoiding this requires treating the Past Hypothesis as non-statistical.

  5. **Global Structure Robustness (Non-negotiable):** The criteria for observer dominance must remain stable regardless of whether the spacetime volume is infinite, eternally inflating, or finite but recurrent.
     *Motivation:* A theory that works only for finite volumes but fails for infinite ones is incomplete, as the Boltzmann-brain problem scales with time and volume and must be solved globally.

  6. **Entropy Asymmetry Resolution (Non-negotiable):** The theory must explain why the entropy cost of producing an ordered cosmos is effectively lower, or more probable, than the cost of producing a single momentary brain with false records.
     *Motivation:* Standard thermodynamics favors the cheaper fluctuation (the brain); an acceptable cosmology must reverse or bypass this weighting to match our actual experience of an extended world.

  7. **Rational Holdability (Non-negotiable):** The theory must distinguish between being possibly true and being rationally assertable, disqualifying accounts that undermine the reasoning used to construct them.
     *Motivation:* A theory that is true but cannot be rationally held (because believing it undermines the justification for belief) fails as a scientific account for beings like us.

  ### Incompatibilities within the Desiderata

  There is a fundamental tension between **Item 4 (Past Hypothesis Status)** and the desire for a purely statistical mechanical worldview. If one demands that the arrow of time be derived *solely* from statistical postulates over microstates (a common reductionist aim), one inevitably triggers **Item 1 (Cognitive Stability)** failures, because statistical dominance favors fluctuations (Boltzmann Brains) over histories. You cannot jointly satisfy the demand for a fully statistical derivation of the low-entropy past and the demand for cognitive stability. One must go: either you accept the theory is self-undermining (rejecting Item 1), or you admit the Past Hypothesis is a brute fact/law rather than a statistical result (sacrificing the reductionist hope in Item 4). Additionally, **Item 5 (Global Structure Robustness)** conflicts with **Item 6 (Entropy Asymmetry)** in eternally inflating models; if the universe is truly eternal and high-entropy in the future, the asymmetry required to suppress Boltzmann Brains usually requires modifying the dynamics (e.g., vacuum decay) which may conflict with observational data suggesting stability.

  ### The Decisive Requirement

  The single requirement that does the most work in excluding attractive cosmologies is **Cognitive Stability (Item 1)**. This is the hammer that shatters otherwise mathematically consistent models. Many theories (particularly those involving eternal de Sitter space) are dynamically elegant and fit current expansion data perfectly, but they fail solely because they predict that we are almost certainly not the kind of observers who can trust the data that supports the theory. This requirement forces cosmologists to choose between empirical fit and epistemic coherence, often demanding radical modifications to the global structure of the universe (like a finite future) simply to preserve the validity of scientific inference.

  ### Evaluation of Generic Responses

  **Modifying the cosmology to suppress fluctuations:** This approach (e.g., positing a Big Crunch or rapid vacuum decay) satisfies Cognitive Stability by cutting off the time volume available for Boltzmann Brains to form. However, it is costly regarding empirical fit, as current data suggests a positive cosmological constant and accelerated expansion, meaning this response often requires fine-tuning parameters to ensure the universe ends before the "Boltzmann era" dominates, potentially conflicting with the very data the theory aims to explain.

  **Retaining the cosmology and denying the objection its force:** This strategy argues that Boltzmann Brains are not "observers" in the relevant sense (e.g., they lack continuity or agency) and thus should be excluded from the measure. While this preserves the standard cosmological model, it risks being ad hoc; unless there is an independent, non-question-begging definition of "observer" that excludes fleeting fluctuations, this looks like a maneuver to save the theory rather than a genuine physical insight, violating the spirit of Record Reliability.

  **Rejecting the typicality principle so that freak observers never enter predictions:** This response denies that we should reason as if we are typical samples from the reference class of all observers. While this technically saves the theory from self-undermining, it is devastatingly costly to scientific practice generally; if we cannot assume we are typical, we lose the ability to make inductive inferences from any statistical mechanics, undermining not just cosmology but all physics that relies on probabilistic reasoning from limited data.
