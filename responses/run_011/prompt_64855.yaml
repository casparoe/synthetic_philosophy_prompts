      *   **Goal:** Specify desiderata (requirements) for a theory to be acceptable, *before* looking at specific proposals.
      *   **Format:** Numbered list with motivation per item. Mark each as Non-negotiable, Negotiable (costly), or Partisan. Identify inconsistencies/incompatibilities within the list. Close with the "most work" requirement and a brief evaluation of three generic responses. No bibliography.
      *   **Specific Issues to Address:**
          *   Entropy cost asymmetry (BB vs. Ordered Cosmos).
          *   Probability assignments vs. Typicality principles.
          *   Self-undermining theories (refuted? unfalsifiable? epistemic?).
          *   Self-defeating reasoning (fails requirement vs. rationally unholdable).
          *   Impact of global structure (Infinite, Eternal de Sitter, Finite State Space).
          *   Arrow of Time/Past Hypothesis (Derivation vs. Postulate).
