      *   *Check:* Closing section (Most work + 3 responses)? Yes.
      *   *Check:* No bibliography? Yes.

  9.  **Final Polish (Self-Correction during drafting):**
      *   *Critique:* Make sure the distinction between "refuted by evidence" and "epistemically self-defeating" is clear.
      *   *Correction:* A theory predicting we are BBs isn't empirically refuted by our memories (because BBs have fake memories). It is *epistemically* self-defeating. I need to make sure the criteria reflect this distinction.
      *   *Critique:* Ensure the "Partisan" label is used correctly. It shouldn't be a cop-out, but a recognition of genuine philosophical divides (e.g., Humean vs. Non-Humean laws).
      *   *Critique:* The prompt asks for "a numbered list with a sentence or two of motivation per item." I need to keep it tight.
      *   *Critique:* The prompt asks to "identify any subset that cannot be jointly satisfied." I need to be explicit about the tension between Statistical Completeness and Cognitive Stability.

