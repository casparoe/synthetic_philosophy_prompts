answer: |-
  **The Scenario**
  At the Tell es-Sultan excavation, the Field Crew (Group A) removes soil bucket by bucket, logging artifacts by depth, while the Geo-Science Team (Group B) analyzes core samples from the same trenches. For the Field Crew, the proposition *H: "The stratigraphic layers in Trench 4 are undisturbed"* functions as the background against which "finding" an artifact makes sense; for the Geo-Science Team, *H* is a hypothesis confirmed or falsified by grain-size analysis and chemical markers. An outsider suggests the soil was dumped by bulldozers in the 1950s; the Field Crew hears the words but continues troweling as if the suggestion were a joke, while the Geo-Science Team immediately designs a sediment assay to check.

  ***

  **The Demonstration**

  **1. The Proposition and the Specs**
  *H* is "The stratigraphic layers in Trench 4 are undisturbed."
  *   **Non-Moorean/Empirical:** It is contingent; the site could have been looted or backfilled. An outsider can deny it without nonsense.
  *   **Hinge for Group A:** The Field Crew relies on *H* in every log entry. If they record a shard as "Iron Age," they are relying on *H*. If *H* is false, their records are not "incorrect," they are *category mistakes* (like recording a dream as a crime). They do not volunteer *H* as a belief; if asked, "Do you believe the layers are undisturbed?" they would say, "Well, we're excavating, aren't we?"
  *   **Empirical for Group B:** The Geo-Science Team treats *H* as the conclusion of an argument based on soil porosity and phosphate levels. They argue about *H* using evidence.
  *   **Intelligible but Inert:** The Field Crew understands "bulldozers in the 1950s." It has content. But it cannot be integrated into their workflow. To act on that doubt is to stop excavating and start investigating a crime scene. The doubt is inert *relative to the practice of excavation*.

  **2. Why Testing *H* Requires Relying on *H***
  For the Field Crew, you cannot test *H* without already assuming *H*. To test for disturbance, you look for "intrusive artifacts" (e.g., a plastic bottle in a Neolithic layer). But identifying a plastic bottle as "intrusive" presupposes that the surrounding matrix is *not* intrusive. You need a stable background to identify the anomaly. If *H* is removed from the background, *everything* becomes a potential anomaly, and the concept of "intrusion" loses its grip. You cannot check if the layer is undisturbed using the artifacts found within it, because the temporal identity of the artifacts depends on the layer being undisturbed. The evidence (artifacts) and the hypothesis (*H*) are not independent variables for Group A; they are mutually constitutive.

  **3. Practical Divergence and Cost**
  The divergence shows up in how they handle anomalies.
  *   **Group B (Geo-Science):** If soil samples show mixed grain sizes, they report "High probability of disturbance." They update a probability.
  *   **Group A (Field Crew):** If they find a modern coin, they do not say "The layer is probably disturbed." They log the coin as "Intrusion" and keep working. They protect *H* from falsification by re-categorizing the counter-evidence.
  *   **The Cost:** This creates a blind spot. If the *entire* trench was dumped by a bulldozer (making *H* globally false), Group A will simply log modern items as "intrusions" and ancient items as "finds," creating a coherent but entirely fake history. Group B prevents this, but Group A cannot *use* Group B's data in real-time without halting the dig. Group A buys speed and coherence at the price of potential global error.

  **4. The Riverbed Shift**
  The event that demotes *H* is not finding one modern object, but the **Geo-Science Team issuing a "Stop Work" order based on bulk soil analysis.**
  *   **Why it's not just evidence:** A single modern coin is absorbed as an exception (water turns). A "Stop Work" order changes the *grammar* of the activity. The Field Crew can no longer "log finds"; they must "secure evidence." The proposition *H* moves from the riverbed to the water, but in doing so, the river itself changes course. The practice of *archaeology* (interpreting context) is replaced by *forensics* (interpreting contamination). *H* doesn't just become false; it becomes irrelevant to the new activity.

  **5. Intelligible-but-Inert Feature**
  The feature doing the work is the **constitutive role of *H* in the description of action.** For Group A, "excavating" is defined as "removing undisturbed soil." If *H* is doubted, the verb "excavate" no longer applies to their movements; they are just "moving dirt." The doubt is inert because accepting it would require them to cease describing themselves as excavators.
  *   **To make the doubt unintelligible:** You would have to remove the shared concept of **temporal deposition.** If the outsiders believed soil appeared spontaneously every morning, the claim "This soil is undisturbed" would be nonsense to everyone. The doubt is intelligible only because everyone shares the geological framework, even if Group A doesn't *use* it as a hypothesis.

  **6. The "Empty Framework" Objection**
  *   **The Attack:** A skeptic will argue this is just **pragmatic acceptance**, not hinge certainty. They'll say Group A *does* believe *H* with high probability (say, 99%), but the cost of testing is too high, so they act as if it's 100%. This reduces Wittgenstein's "exempt from doubt" to standard decision theory (risk vs. cost).
  *   **Does it land?** It lands partially, but misses the grammatical point. If it were merely pragmatic, Group A would say, "We're pretty sure it's undisturbed, but we could be wrong." But in practice, they cannot coherently say, "We found an Iron Age pot, but the layer might be disturbed, so it might be a modern pot." They don't assign a probability to the *identity* of the pot. The probability applies to the *find*, not the *context*. The hinge framework captures that the *context* isn't weighed; it's the scale. The skeptic explains why they don't *test* it, but not why they can't *doubt* it without changing the subject. The distinction between "acting as if" and "unable to make sense of the alternative within the practice" is the difference between a gamble and a rule.
