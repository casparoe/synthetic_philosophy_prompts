      *Key argument against this specific view:* The "causal role" of experience. If I hallucinate a fire and feel fear, what causes the fear? If there is no experience, only dispositions, what triggers the disposition? If the trigger is a neural state, and that neural state is the same as in perception, why isn't it an experience?

      *Insulation:* If every report of "I see X" in hallucination is treated as "I am disposed to say I see X" without the accompanying experience, the view becomes immune to first-person evidence. This is a major vulnerability.

