prompt: |-
  I spent thirty-four years as an analytical chemist in a government metrology laboratory, most of that time concerned with measurement uncertainty and with the unglamorous question of when an instrument's output is good enough to act upon. Since retiring I have taken up epistemology with more seriousness than my former colleagues would have predicted, and I have become preoccupied by an institutional practice I brushed against professionally for decades without ever examining it philosophically: the way the American regulator of drugs and devices grades the evidence it demands according to what is at stake. For a patient with a rapidly fatal illness and no alternative treatment, a new compound may be approved on the strength of a surrogate endpoint — tumour shrinkage, say, or a laboratory marker — that is only thought to predict clinical benefit, subject to confirmatory trials being conducted afterwards and to withdrawal of the approval if they fail. The same compound, offered for a mild and non-life-threatening complaint, would be refused outright on that showing; the agency would require direct demonstration of benefit and a far larger safety database. Something structurally parallel obtains for devices, which are sorted into three classes according to the harm their failure could cause, so that a moderate-risk device can often be cleared by demonstrating that it is substantially equivalent to an already-marketed predicate, with no new clinical data whatever, while a high-risk device serving the same anatomical purpose must carry clinical investigations of its own. So far as I can determine, the agency does not describe any of this as a relaxation of its epistemic standard; its official account is that the standard of evidence is fixed and that what varies is the balance of benefit against risk which it is acceptable to strike. A former colleague of mine now sits on a hospital pharmacy and therapeutics committee and assures me this is simply how the business is done, but I do not find that an answer.

  I should like to know whether the official account can be made coherent. Consider two dossiers that are token-identical: the same compound, the same trials, the same effect sizes and confidence intervals, submitted once for a lethal orphan disease and once for a nuisance condition. The reviewers reach opposite conclusions. Since the data do not differ, the difference must reside somewhere in the framework, and the risk-benefit story does not seem to me to locate it: if the question put to the reviewers is whether the data show that the drug works, then either they do or they do not, and the gravity of the illness is beside the point; if the question is instead whether marketing should be permitted, then the verb show has quietly changed its sense between the two submissions. My own half-formed hunch is that everything turns on whether an approval is an assertion or a permission. If it is an assertion — a public statement by the agency that this drug works — and if assertions are governed by some knowledge-like norm, then a stakes-graded approval policy appears to commit the agency either to the contextualist line illustrated by DeRose's bank examples or to the related and more radical claim, pressed by others, that whether one knows depends on what stands to be lost by being wrong; and it would then owe us a reply to the invariantists, who insist that what varies with the stakes is not knowledge but only the practical rationality of acting on it. If approval is nothing but a permission, the agency may remain a strict invariantist and let the stakes enter solely through decision theory, in which case the practice presupposes nothing epistemologically interesting at all. The provisional character of accelerated approval confuses me further and seems to cut both ways: the agency appears to grant and later revoke a warrant, which suggests it never treated its own conclusion as knowledge in the ordinary sense, yet a withdrawal is announced in precisely the language of having been mistaken, and the confirmatory obligation is imposed as though the original finding were already, in some attenuated way, established. A third datum troubles me still more. Within the same institution the conventional threshold of statistical significance does not move with the stakes: a p-value below 0.05 counts as the same achievement whether the indication is a fatal malignancy or a cosmetic complaint. And in the criminal law, where the standard of proof plainly differs between civil and criminal proceedings, the reasonable-doubt standard does not, so far as I can tell, tighten as the potential sentence lengthens; a defendant facing five years and one facing life are convicted on the same epistemic showing. Whatever theory licenses the graded approval scheme must therefore also explain why it does not license these neighbouring variations.

  What I want is a reconstruction of the epistemology this practice actually presupposes, conducted with care about the difference between presupposition and mere compatibility. Specifically: which accounts of evidence, and of knowledge, render the graded-evidence scheme intelligible, and which does the scheme positively exclude; whether the assertion/permission distinction I have proposed is a genuine hinge or a distinction without a difference, and if it is genuine, whether either horn remains available to an agency that describes its own decisions in the language it actually uses; whether the several parts of the practice — surrogate endpoints, post-marketing confirmatory obligations, risk-based device classes, an invariant significance threshold — presuppose mutually consistent things, or whether the scheme is a patchwork that no single theory underwrites; and what would have to change in the institution, both procedurally and in the wording of its decisions, were it rebuilt on a strict invariantist epistemology in which the sufficiency of evidence never depends on what turns on being right. Please be explicit about where the practice is philosophically underdetermined. I expect a good deal of it is licensed equally well by rival theories, and I would rather see that underdetermination mapped than quietly resolved by stipulation.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Persona:** Retired analytical chemist (34 years in government metrology), now studying epistemology seriously. Highly articulate, precise, philosophically literate (references DeRose, contextualism, invariantism, decision theory), and skeptical of official bureaucratic explanations.
      *   **Core Problem:** The FDA (implied "American regulator") grades evidence requirements based on stakes (severity of illness/risk of device), yet claims the *epistemic standard* is fixed and only the *risk-benefit balance* varies. The user finds this incoherent.
      *   **Specific Questions/Tasks:**
          1.  Reconstruct the epistemology the practice *actually* presupposes (not just what's compatible).
          2.  Evaluate which accounts of evidence/knowledge make the scheme intelligible vs. which it excludes.
          3.  Analyze the Assertion vs. Permission distinction (is it a genuine hinge?).
          4.  Assess internal consistency (surrogates, confirmatory obligations, device classes, invariant p-values).
          5.  Describe what would change under a strict invariantist epistemology.
          6.  Explicitly map where the practice is philosophically underdetermined.
      *   **Tone:** Rigorous, respectful, philosophically precise, avoiding platitudes. Match the user's level of sophistication.

  2.  **Deconstruct the Phenomenon:**
      *   *Observation:* Same data $\rightarrow$ Approval for high stakes (fatal disease), Rejection for low stakes (mild condition).
      *   *Official Story:* Epistemic standard fixed; Risk-Benefit analysis varies.
      *   *User's Critique:* If "works" means the same thing, the data should yield the same truth value. If "approve" means "asserts works," then knowledge norms vary with stakes. If "approve" means "permission," then it's practical rationality, not epistemology.
      *   *Complications:* Accelerated approval (provisional), invariant p-values (0.05), criminal law analogy (standard of proof doesn't scale with sentence length).

  3.  **Philosophical Frameworks to Apply:**
      *   *Invariantism:* Knowledge/Evidence thresholds are fixed. Practical stakes affect action, not belief/knowledge.
      *   *Contextualism:* "Knows" changes meaning based on conversational context (including stakes).
      *   *Pragmatic Encroachment (Stanley, Fantl & McGrath):* Stakes *do* affect whether one knows/has justification.
      *   *Decision Theory:* Expected Utility.
      *   *Speech Act Theory:* Assertion vs. Licensing/Permission.
      *   *Regulatory Epistemology:* Specific literature on FDA epistemology (e.g., Wieten, Bright, etc., though I should rely on general philosophical principles applied to the specific case).

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the user's expertise and the profundity of the question. Validate the tension between the official story and the philosophical reality.

      *   **1. The Assertion/Permission Distinction (The Hinge):**
          *   Is it genuine? Yes.
          *   *Assertion:* "This drug is safe and effective." Truth-conditional.
          *   *Permission:* "You may sell this." Deontic.
          *   *FDA Practice:* It's a hybrid. The approval letter is a license (permission), but the *basis* is a scientific review (assertion-like).
          *   *Implication:* If it's pure permission, Invariantism holds (Decision Theory does the work). If it's assertion, Pragmatic Encroachment or Contextualism is needed. The FDA *talks* like an assessor of truth ("substantial evidence"), implying an epistemic claim.

      *   **2. Reconstructing the Presupposed Epistemology:**
          *   *Official View:* Strict Invariantism + Decision Theory. (Evidence threshold fixed; Risk/Benefit slider moves).
          *   *Actual Practice:* Looks like **Pragmatic Encroachment**. The sufficiency of evidence *does* seem to depend on stakes.
          *   *Why the Official View fails:* As the user noted, if $P$ (drug works) is the proposition, and Evidence $E$ is identical, $P$ cannot be known in Case A and not known in Case B under Invariantism.
          *   *The "Risk-Benefit" Dodge:* This conflates *truth* of "drug works" with *acceptability* of "drug sold." But the FDA defines "substantial evidence" *in terms of* risk-benefit context in practice (e.g., surrogate endpoints).
          *   *Conclusion:* The practice presupposes a form of Pragmatic Encroachment, even if the rhetoric denies it.

      *   **3. Internal Consistency (The Patchwork Problem):**
          *   *Surrogates/Accelerated Approval:* Supports Encroachment/Contextualism. We accept weaker evidence because the cost of waiting is high.
          *   *Invariant p-values (0.05):* Contradicts Encroachment. If stakes mattered epistemically, $\alpha$ should shift.
          *   *Resolution:* The p-value is a *methodological* norm, not an *epistemic* norm. It controls Type I error rates in the *study*, not the regulatory *decision*. The regulatory decision aggregates p-values + clinical context.
          *   *Criminal Law Analogy:* "Beyond reasonable doubt" is fixed for *guilt*, but sentencing varies. Similarly, FDA "effectiveness" might be fixed, but "marketability" varies. *However*, the FDA changes the *definition* of effectiveness (surrogate vs. clinical), which breaks the analogy.
          *   *Verdict:* The scheme is a patchwork. It uses Invariantist tools (p-values) to feed a Pragmatic Encroachment decision engine.

      *   **4. Underdetermination Map:**
          *   Where do rival theories fit?
          *   *Contextualism:* Fits the language use ("We know it works" in high stakes context).
          *   *Pragmatic Encroachment:* Fits the normative structure (Stakes affect justification).
          *   *Invariantism + Decision Theory:* Fits the *official* story but requires reinterpreting "approval" as purely deontic, not epistemic.
          *   *The Gap:* The FDA refuses to admit the epistemic shift. This creates a "hermeneutic gap."

      *   **5. Rebuilding on Strict Invariantism:**
          *   What would change?
          *   *Evidence:* Fixed threshold for "Effective."
          *   *Access:* If evidence meets threshold $\rightarrow$ Approved for all. If not $\rightarrow$ Approved for none.
          *   *Compassionate Use:* High-stakes access would be moved entirely to "Right to Try" or Expanded Access pathways (Permission without Epistemic Endorsement), distinct from Approval (Epistemic Endorsement).
          *   *Language:* Approval letters would distinguish "Scientifically Verified" vs. "Risk-Justified Exception."

      *   **6. Conclusion:** Summarize the tension. The FDA operates on a "Regulatory Pragmatism" that is philosophically hybrid.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to say the FDA *is* a pragmatist. I need to say what their practice *presupposes*.
      *   *Nuance:* The p-value issue is tricky. A p<0.05 is a filter, not the whole evidence. The *weight* of evidence changes with surrogates. I need to clarify that surrogates change the *quality* of evidence, not just the threshold. But the user argues the *dossier* is token-identical. I must stick to the user's thought experiment: Same data, different outcome.
      *   *Refining the Assertion/Permission:* If I grant a license to drive, I am not asserting you are a perfect driver, but that you are safe enough. FDA approval is closer to a license. But they publish "Medical Reviews" that read like truth claims. This duality is key.
      *   *Criminal Law:* The user says standard doesn't change with sentence length. That's correct. But the FDA case is different because the *harm of non-approval* (death) is part of the equation. In criminal law, the harm of non-conviction (criminal goes free) is constant across sentencing. In drugs, the harm of waiting is variable. This distinguishes the two cases.

  6.  **Final Polish:** Ensure the tone matches the user's (academic, precise, slightly weary of bureaucracy). Use the terminology provided (invariantist, contextualist, encroachment). Ensure all constraints of the prompt are met. (Check: Did I address the "underdetermination" explicitly? Yes. Did I address the "assertion/permission" hinge? Yes.)

  7.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a profound inquiry into the normative architecture of regulatory science. You have identified a fissure between the *official epistemology* of the regulator (typically a form of methodological invariantism) and its *operational epistemology* (which behaves like pragmatic encroachment or contextualism). Your intuition that the "risk-benefit" explanation is a category error—that it conflates the truth conditions of "this drug works" with the deontic conditions of "this drug may be sold"—is philosophically sound.

  Below is a reconstruction of the epistemology presupposed by this practice, an analysis of the assertion/permission hinge, an audit of the scheme's internal consistency, and a specification of what a strict invariantist reconstruction would require.

  ### 1. The Assertion/Permission Hinge

  You ask whether the distinction between approval-as-assertion and approval-as-permission is a genuine hinge or a distinction without a difference. It is a **genuine hinge**, and the regulator's incoherence stems from attempting to occupy both positions simultaneously without acknowledging the shift.

  *   **Approval as Assertion:** If an approval is a speech act asserting *p* ("This drug is safe and effective for indication *i*"), it is subject to a knowledge norm of assertion (KNA). To assert *p*, the agency must know *p*. If the data are token-identical across two contexts (fatal vs. mild), and knowledge is invariant, the agency cannot assert *p* in one context and withhold assertion in the other. To do so presupposes **Pragmatic Encroachment** (the view that practical stakes affect whether one knows/has justification) or **Contextualism** (the view that the semantic content of "knows" shifts with context).
  *   **Approval as Permission:** If an approval is a deontic license ("You may distribute this"), it is governed by decision theory, not necessarily by the KNA. The agency need not *know* the drug is safe; it need only determine that the *expected utility* of allowing distribution exceeds the expected utility of withholding it. Here, Invariantism is preserved: the evidence for *p* remains constant (and perhaps insufficient for knowledge), but the practical rationality of acting *as if p* varies with stakes.

  **The Agency's Position:** The agency uses the language of assertion ("substantial evidence," "demonstrated safety") while operating the machinery of permission (risk-benefit analysis).
  *   **Presupposition:** The practice presupposes a **hybrid speech act**. It is a *warranted permission*. It asserts enough to justify the permission, but the "warrant" is not a fixed epistemic threshold; it is a function of the stakes.
  *   **Exclusion:** This practice positively excludes **Strict Epistemic Invariantism** regarding the *decision rule*. If the agency were a strict invariantist, the sufficiency of evidence for the proposition "Drug X is effective" would be independent of the disease severity. Since the sufficiency *does* vary (surrogate vs. clinical endpoint), the agency cannot be an invariantist about the sufficiency of evidence for regulatory action, even if it claims to be.

  ### 2. Reconstructing the Presupposed Epistemology

  Which accounts render the graded-evidence scheme intelligible?

  **A. Pragmatic Encroachment (The Best Fit)**
  The practice is most intelligible under the framework of Pragmatic Encroachment (e.g., Stanley, Fantl & McGrath). This view holds that whether a subject *S* knows *p* (or has sufficient justification to act on *p*) depends partly on the practical stakes for *S*.
  *   **Intelligibility:** In the fatal disease case, the cost of a False Negative (withholding a working drug) is death. In the mild disease case, the cost of a False Negative is continued discomfort. Encroachment allows the agency to say, "We have sufficient justification to act on the claim 'this works' in the high-stakes context, but not in the low-stakes context," even with identical data.
  *   **Presupposition:** The agency presupposes that **justification is stakes-sensitive**. The "substantial evidence" standard is not a fixed epistemic magnitude but a variable threshold calibrated to the cost of error.

  **B. Contextualism (The Linguistic Fit)**
  Contextualism (e.g., DeRose) suggests the word "knows" (or "evidence") changes its semantic content based on the conversational context.
  *   **Intelligibility:** When reviewing an orphan drug, the context sets a "low" epistemic standard for "knows." When reviewing a lifestyle drug, the context sets a "high" standard.
  *   **Presupposition:** The agency presupposes that **epistemic terms are context-dependent**. However, this fits less well than Encroachment because the agency insists its *standards* are fixed, which sounds more like an invariantist claim about the word "standard" while practicing encroachment on the *application*.

  **C. Strict Invariantism + Decision Theory (The Official Story)**
  This view holds that knowledge/justification is fixed, but the *action* threshold varies.
  *   **Incoherence:** As you noted, this fails on the "token-identical dossier" test *if* the approval implies the truth of "the drug works." It only works if approval implies "the risk of this drug being ineffective is acceptable."
  *   **Exclusion:** The practice excludes this view **if** one takes the agency's scientific reviews as truth-claims. The agency claims to determine *efficacy*, not just *acceptable risk of inefficacy*. By accepting surrogate endpoints (which are probabilistic predictors, not demonstrations) for fatal diseases but rejecting them for mild ones, the agency is altering the **definition of efficacy**, not just the risk tolerance. This is an epistemic shift, not merely a practical one.

  ### 3. Internal Consistency: The Patchwork Problem

  You asked whether the several parts of the practice presuppose mutually consistent things. They do not. The scheme is a **philosophical patchwork**.

  1.  **Surrogate Endpoints (Encroachment):** Accepting a surrogate for a fatal disease but not a mild one presupposes that the *epistemic link* between marker and outcome is stakes-sensitive. This is Pragmatic Encroachment.
  2.  **Invariant p-values (Invariantism):** Maintaining $p < 0.05$ regardless of stakes presupposes Methodological Invariantism.
      *   *Resolution:* This is consistent only if the p-value is viewed as a **methodological control** (limiting Type I error in the *study*) rather than an **epistemic threshold** (determining knowledge for the *regulator*). The study generates a likelihood ratio; the regulator applies a stakes-sensitive prior/utility function to that ratio. The p-value is invariant; the *interpretation* of the p-value is not.
  3.  **Accelerated Approval (Fallibilism):** The provisional nature (withdrawal if confirmatory trials fail) admits that the initial approval was **not knowledge**. It was a **wager**.
      *   *Conflict:* If the initial approval was not knowledge, the agency violated the Knowledge Norm of Assertion when it announced the drug was "approved for treatment." It should have announced it as "approved for experimental treatment pending verification." The language of "approval" suggests a settled epistemic state; the mechanism suggests a gamble.
  4.  **Criminal Law Analogy (Invariantism):** You note that the standard of proof ("beyond reasonable doubt") does not tighten with sentence length.
      *   *Distinction:* In criminal law, the *harm of the crime* is fixed at the time of judgment. In drug regulation, the *harm of the decision* (death vs. discomfort) is part of the indication itself. A more apt legal analogy is **Civil Commitment** or **Quarantine**: the epistemic standard for depriving liberty varies with the contagiousness/danger of the disease. The FDA practice aligns with **Precautionary Principles** where the burden of proof shifts based on the magnitude of the threat (of the disease, not just the drug).

  **Verdict:** The scheme is internally inconsistent regarding the *status* of the approval (knowledge vs. wager) but consistent regarding the *goal* (utility maximization). It uses Invariantist tools (statistics) to achieve Encroachmentist ends (stakes-sensitive access).

  ### 4. Mapping the Underdetermination

  You requested explicit mapping of where the practice is philosophically underdetermined.

  *   **The Status of the "Medical Review":**
      *   *Theory A (Assertion):* The review is a truth-claim. (Requires Encroachment/Contextualism).
      *   *Theory B (Permission):* The review is a risk-assessment. (Compatible with Invariantism).
      *   *Underdetermination:* The text of the reviews uses truth-conditional language ("demonstrated," "effective"), but the legal effect is deontic ("licensed"). The practice does not distinguish these, allowing the agency to slide between them as convenient.
  *   **The Meaning of "Substantial Evidence":**
      *   *Theory A:* Fixed epistemic weight.
      *   *Theory B:* Variable utility threshold.
      *   *Underdetermination:* The statute defines "substantial evidence" as "adequate and well-controlled investigations." It does not specify whether "adequate" is an epistemic adjective (sufficient to produce knowledge) or a pragmatic adjective (sufficient to justify risk). The practice treats it as pragmatic; the rhetoric treats it as epistemic.
  *   **The Role of Surrogates:**
      *   *Theory A:* Surrogates are weak evidence.
      *   *Theory B:* Surrogates are different *kinds* of evidence.
      *   *Underdetermination:* When a surrogate is accepted for a fatal disease, is the agency saying "This evidence is good enough to know" (Encroachment) or "We don't know, but we allow it anyway" (Decision Theory)? The post-marketing requirement suggests the latter, but the marketing authorization suggests the former.

  ### 5. Rebuilding on Strict Invariantism

  If the institution were rebuilt on a Strict Invariantist epistemology where the sufficiency of evidence never depends on stakes, the following changes would be necessary:

  **Procedural Changes:**
  1.  **Decoupling Approval from Access:** "Approval" would signify only that the proposition "Drug X is safe and effective" is known (fixed epistemic threshold). Access for high-stakes patients where evidence is insufficient would be routed through a separate **Expanded Access** or **Right-to-Try** pathway. This pathway would be explicitly deontic (permission without epistemic endorsement).
  2.  **Abolition of Accelerated Approval:** There would be no "provisional" knowledge. A drug is either effective (Approved) or its effectiveness is unproven (Not Approved). Interim access would be purely compassionate use, not "approval."
  3.  **Uniform Endpoints:** Surrogate endpoints would either be validated to the level of clinical outcomes for *all* indications or accepted for *none*. You cannot have a surrogate count as "evidence of effectiveness" for cancer but "insufficient evidence" for acne if effectiveness is an invariant property.

  **Linguistic/Decision Changes:**
  1.  **Wording of Decisions:** Approval letters would cease to say "The drug is effective." They would say, "The evidence meets the invariant threshold for efficacy."
  2.  **Risk-Benefit Separation:** The "Risk-Benefit Assessment" would be formally separated from the "Efficacy Determination."
      *   *Current:* "The benefits outweigh the risks, therefore it is effective enough."
      *   *Invariantist:* "The drug is effective (Epistemic Claim). The risks are acceptable given the disease severity (Pragmatic Claim)."
  3.  **Handling Uncertainty:** In cases where evidence is below the invariant threshold but stakes are high, the agency would issue a **Negative Epistemic Finding** ("Effectiveness not demonstrated") coupled with a **Positive Deontic Ruling** ("Distribution permitted under restricted conditions due to unmet medical need"). This forces the agency to admit it does *not* know the drug works, preserving the knowledge norm while allowing the practical action.

  ### 6. Conclusion: The Regulatory Pragmatist

  The practice you describe presupposes **Regulatory Pragmatism**, a hybrid view that is philosophically unstable but institutionally robust. It treats knowledge not as a binary state governed by invariant norms, but as a **resource to be allocated**.

  *   **What it excludes:** It excludes the possibility that the agency is a pure truth-seeker. It is a risk-manager that uses truth-claims as tools.
  *   **What it licenses:** It licenses Pragmatic Encroachment. It asserts that in the face of death, the bar for "sufficient evidence" lowers.
  *   **The Underdetermination:** The agency hides this Encroachment behind the veil of "Risk-Benefit Analysis." This allows it to avoid the philosophical burden of defending Encroachment (i.e., explaining how stakes change justification) by claiming it is merely changing the *acceptability of risk*.

  Your colleague on the P&T committee is correct that "this is how the business is done," but incorrect that this answers the philosophical question. The business is done this way *because* it implicitly rejects Strict Invariantism in favor of a stakes-sensitive epistemology, while maintaining Invariantist rhetoric to preserve the appearance of scientific objectivity. The tension you feel is the friction between the **ethics of belief** (which demands invariant standards for assertion) and the **ethics of action** (which demands sensitivity to stakes). The regulator has chosen to prioritize the ethics of action while wearing the mask of the ethics of belief.

  To make the official account coherent, the agency must admit that "Approval" is not an assertion of knowledge, but a **risk-weighted license**. Until it makes that linguistic shift, it remains committed to a form of Pragmatic Encroachment it refuses to name.
