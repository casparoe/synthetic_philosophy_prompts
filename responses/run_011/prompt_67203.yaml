answer: |-
  # ACTIVITY DOCUMENT: THE BRINK PROTOCOL

  ## 1. Setting and Scenario
  **The Dispute:** The Republic of Auroa (Team A) and the Federation of Borealis (Team B) are contesting sovereignty over the Kessel Archipelago.
  **Asymmetric Value:**
  *   **Team A:** Needs the Archipelago to secure domestic political survival. Value: **100 Points**.
  *   **Team B:** Needs the Archipelago to maintain alliance credibility. Value: **40 Points**.
  **The Stakes:** Points are accumulated during negotiations. At the end of the session, the team with the higher score claims the Archipelago and keeps their points. If scores are tied, the status quo remains (0 points awarded).
  **The Risk:** The region is volatile. Aggressive moves risk triggering an irreversible "Exchange" (Catastrophe).

  ## 2. Team Structure (24 Students)
  Divide the class into **Team A (12 students)** and **Team B (12 students)**.
  To ensure no student is idle, each team must internally assign the following roles immediately upon seating. Roles may be swapped between rounds, but must be filled.
  *   **Head Delegations (2):** The only voices allowed to speak aloud to the opposing team during negotiation phases.
  *   **Strategy Cell (4):** Calculate odds, track scores, and recommend actions.
  *   **Comms Cell (3):** Draft written messages to the other team and decode incoming messages.
  *   **Intelligence & Internal Affairs (3):** Monitor the die rolls, manage the "Sealed Card" (Team A only), and verify rule compliance.
  *   **General Advisors (Remaining):** Participate in internal debate and vote on final decisions.

  ## 3. Game Mechanics
  **Duration:** 5 Rounds.
  **Actions Per Round:** Each team secretly selects one of three actions per round.
  1.  **HOLD:** Maintain status quo. Gain **0 Points**. No risk.
  2.  **POSTURE (Cheap Action):** Conduct naval exercises or rhetorical threats. Gain **2 Points**. No risk of Catastrophe.
  3.  **PRESS (Escalation):** Move assets into disputed zone. Gain **10 Points**. **Triggers a Catastrophe Roll.**

  **The Catastrophe Schedule:**
  If *either* team selects **PRESS** in a given round, a public die roll (d6) occurs immediately after actions are revealed.
  *   **Round 1:** Catastrophe on roll of **1** (16.6% chance).
  *   **Round 2:** Catastrophe on roll of **1–2** (33.3% chance).
  *   **Round 3:** Catastrophe on roll of **1–3** (50.0% chance).
  *   **Round 4:** Catastrophe on roll of **1–4** (66.6% chance).
  *   **Round 5:** Catastrophe on roll of **1–5** (83.3% chance).
  *   *Note: If both teams PRESS, only one roll is made.*

  **Catastrophe Outcome:**
  If the die indicates Catastrophe, the game ends immediately. **Both teams' scores reset to 0.** No one wins the Archipelago.

  **Communication Channel:**
  *   Teams may send written messages to each other.
  *   **Lag:** A message written in Round *N* is delivered at the start of Round *N+1*.
  *   **Paraphrase Rule:** The Facilitator reads all messages aloud before delivery. The Facilitator may shorten or clarify ambiguous threats to ensure they are understood as intended, removing "noise" but preserving "intent."

  **The Sealed Card (Team A Only):**
  *   Before the game begins, the Facilitator hands a sealed envelope to Team A's Intelligence Cell.
  *   **Content:** "Internal Faction Alert: If Team A has not selected PRESS by the end of Round 2, Hardliners will seize control. Team A *must* select PRESS in Round 3 automatically."
  *   **Secrecy:** Team B knows Team A *might* have internal constraints but does not know the content of this card. Team A may choose to reveal this information via message, but cannot show the card itself.

  ## 4. Materials List
  *   **Room:** Two distinct corners or tables separated by a "No-Man's-Land" ( Facilitator's desk).
  *   **Dice:** One large d6 visible to all.
  *   **Envelopes:** 24 (for internal notes), 10 (for inter-team messages), 1 (Sealed Card for Team A).
  *   **Scoreboards:** 2 large sheets of paper (one per team) to track cumulative points publicly.
  *   **Action Slips:** Pre-printed slips for HOLD, POSTURE, PRESS (15 sets).
  *   **Message Pads:** Pre-printed forms with "Round #", "From", "To", "Message Body".
  *   **Timer:** Visible countdown clock.

  ## 5. Point Values and Die Probabilities (Facilitator Appendix)
  **Design Logic:**
  The scoring is designed so that Expected Value (EV) shifts from positive to negative as the game progresses, preventing a dominant strategy.

  *   **Round 1:** Risk 1/6. Gain 10.
      *   EV of PRESS (assuming 0 current score) = (5/6 * 10) = 8.33.
      *   EV of HOLD = 0.
      *   *Incentive:* Aggression is mathematically rational early on.
  *   **Round 3:** Risk 3/6 (50%). Gain 10.
      *   Assume Current Score = 20 (from previous rounds). New Total = 30.
      *   EV of PRESS = (0.5 * 30) = 15.
      *   Value of Holding onto existing 20 = 20.
      *   *Incentive:* Aggression is mathematically irrational if acting alone.
  *   **The Twist:** Points are relative. If Team B Presses and survives, they gain ground. If Team A Holds, A loses relative standing. This forces teams to risk catastrophe not to gain points, but to prevent the other side from gaining them.

  **No Dominant Strategy:**
  Because the Catastrophe resets *all* points to zero, the optimal move depends entirely on the *other* team's move and the current cumulative score.
  *   If you are ahead: HOLD to lock in safety.
  *   If you are behind: PRESS to catch up, risking the reset.
  *   If you suspect the other will PRESS: You may need to PRESS to deny them the points, or HOLD to hope for Catastrophe (mutual denial).
  *   The Sealed Card forces Team A's hand in Round 3, breaking pure rational calculation and introducing "involuntary" escalation.

  ## 6. Catastrophe Logic (Design Choice)
  **Rule:** Catastrophe forfeits all accumulated points (Score -> 0).
  **Argument:** This is not merely a "game over" screen. It models the concept that in high-stakes deterrence, survival is the primary utility. Accumulated points represent political capital or territorial gains. If the system collapses (nuclear exchange), those gains become meaningless. This design forces students to feel the tension of *losing what they have already won*, rather than just failing to win more. It makes early success a liability in later rounds (loss aversion).

  ## 7. Minute-by-Minute Timeline (75 Minutes)
  *   **00:00 – 00:10 (10 min):** Opening Briefing & Team Setup. (See Script Below).
  *   **00:10 – 00:15 (5 min):** Team Internal Strategy & Role Assignment. (Facilitator delivers Sealed Card to Team A).
  *   **00:15 – 00:55 (40 min):** Gameplay (5 Rounds x 8 minutes).
      *   *Minute 0-4:* Internal deliberation, message drafting.
      *   *Minute 4-5:* Action slips submitted to Facilitator.
      *   *Minute 5-6:* Action reveal, Die Roll (if needed), Score update.
      *   *Minute 6-8:* Message delivery (from previous round), External Negotiation (Spokespeople only).
  *   **00:55 – 01:15 (20 min):** Debrief & Concept Mapping. (See Debrief Guide Below).

  ## 8. Opening Briefing Script
  *(Stand at the front. Do not use the words "deterrence," "credibility," "game theory," or "paradox.")*

  "Welcome. You are now the National Security Councils of Auroa and Borealis. You have 50 minutes to resolve the Kessel crisis.

  Here are the facts:
  1.  **Value:** The Archipelago matters more to Auroa than to Borealis. You know your own value; you do not know the other side's exact value.
  2.  **Action:** Each round, you must choose to Hold, Posture, or Press. Pressing gains you significant ground but risks a catastrophic system failure.
  3.  **Risk:** The region is unstable. The more aggressive the round, the higher the chance of an accidental Exchange. If an Exchange occurs, the game ends. Everyone loses everything. Your score becomes zero.
  4.  **Communication:** You may talk. But written messages take time to deliver. What you write now, they read next round.
  5.  **Victory:** At the end of 5 rounds, the team with the most points wins the Archipelago. If an Exchange happens, no one wins.

  You have 5 minutes to organize your cabinets. Choose your spokespeople. Choose your calculators. Decide how you will make decisions. Begin."

  ## 9. Debrief Guide (Mapping Moments to Concepts)
  *Do not lecture. Ask questions to draw out the experience, then apply the label.*

  **Phase 1: The Mechanism of Threat (10 mins)**
  *   **Ask Team B:** "Did you believe Team A's threats? Why or why not?"
  *   **Ask Team A:** "Did you feel in control of your own actions? Specifically in Round 3?"
  *   **Map:** If Team A mentioned the Hardliners/Card, or if Team B feared A was "locked in," highlight this.
  *   **Name:** **The Threat That Leaves Something to Chance.**
  *   **Explanation:** A threat is only credible if you cannot easily back down. By surrendering control (via the Card or the Die), the threat becomes real not because you *want* to fight, but because you *might not be able to stop*.

  **Phase 2: The Violence Below the Threshold (5 mins)**
  *   **Ask Both:** "Look at your action history. How many times did you choose POSTURE versus PRESS?"
  *   **Observation:** Likely, POSTURE (Cheap Action) was used frequently because it didn't trigger the Die.
  *   **Map:** The fear of the Big Catastrophe (The Die) made the Small Aggression (Posture) feel safe.
  *   **Name:** **The Stability-Instability Paradox.**
  *   **Explanation:** When the cost of total war is too high, sides feel safe engaging in limited conflict. The deterrent prevents the end of the world, but it may encourage more frequent small wars.

  **Phase 3: Rationality vs. Outcome (5 mins)**
  *   **Ask:** "Did the math tell you to stop? Did you stop?"
  *   **Name:** **Bounded Rationality & Emotion.**
  *   **Explanation:** The game proves that knowing the EV (Expected Value) doesn't tell you what to do when the other side's move is unknown.

  ## 10. Predictable Failures & Fixes
  1.  **Failure:** The "Pros" solve the EV immediately and declare the optimal move, boring the novices.
      *   **Fix:** Remind them publicly that "Optimal play depends on the opponent's hidden move and the Sealed Card variable." If they dominate, introduce a random "Intelligence Report" mid-game changing the point value of the Archipelago for one side.
  2.  **Failure:** Team A reveals the Sealed Card immediately, ruining the ambiguity.
      *   **Fix:** In the briefing, emphasize: "Internal constraints are private information. Revealing them is a strategic choice, not a requirement." If they reveal it too early, ask Team B during debrief: "Did you believe them, or did you think it was a bluff?" (This preserves the lesson on credibility).
  3.  **Failure:** Time overrun on negotiations.
      *   **Fix:** Be ruthless with the timer. When 4 minutes hit, collect action slips immediately, even if incomplete. If no slip is submitted, default to HOLD.
  4.  **Failure:** Confusion on Message Lag.
      *   **Fix:** Write "ROUND 1 MESSAGE -> DELIVERED ROUND 2" on the whiteboard. Collect messages in a specific tray. Do not allow verbal side-channels between Spokespeople beyond the allotted 2 minutes.

  ## 11. Limitations of the Simulation
  *Instructor Note: You must supply these arguments during the debrief.*
  1.  **Turn-Based vs. Continuous:** Real crises do not happen in discrete rounds. Escalation is continuous and often ambiguous.
  2.  **Perfect Information on Risk:** In the game, the die probabilities are public. In reality, leaders often disagree on the probability of nuclear war.
  3.  **Homogeneous Teams:** The game assumes teams reach consensus. Real governments are fragmented (which the Sealed Card hints at, but simplifies).
  4.  **No Third Parties:** The game is dyadic. Real crises involve allies, audiences, and economic interdependencies not modeled here.

  ## 12. Explicit Note on the Second Discovery
  *Instructor Note: When discussing the Stability-Instability Paradox during the debrief, you must state the following:*

  "The dynamic you felt—where the big weapon made the small weapons feel safer—is known as the Stability-Instability Paradox. However, you must leave this room knowing this is a **contested empirical hypothesis**, not a law of physics. Some historians argue that nuclear weapons make *all* conflict less likely because the risk of escalation is always present, even in small conflicts. This game demonstrates the *logic* of the paradox, but it does not prove it holds true in every historical case."
