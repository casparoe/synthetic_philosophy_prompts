answer: |-
  ### Comments

  **1. Accuracy**
  Your decision-theory point is solid: von Neumann-Morgenstern utility requires continuity, and lexical preferences violate it. Your claim about pain scales is also correct; clinical scales are ordinal (ranking) not ratio (measuring magnitude). However, you conflate "lexicality" with "infinity." A lexical view says severe pain *lexically dominates* mild pleasure (priority), not necessarily that it has *infinite disvalue*. You can have lexical preferences without infinite numbers, though you still violate continuity. This distinction matters because it means the threshold theorist doesn't *need* non-comparability to avoid infinity; they just need to accept discontinuity.

  **2. The Parity Collapse**
  This is the shakiest part of the argument. You write: "each on a par with the one before, and 'no worse than' propagates." In formal value theory, if A is "on a par" with B, neither is "no worse than" the other in the sense required for transitivity chains (usually defined as $A \succeq B$). Parity implies incompleteness, so the relation needed to propagate the chain doesn't hold. A philosopher would reply: "Parity blocks transitivity; it doesn't trigger collapse." The intuition is powerful, but the technical mechanism you describe is inverted. You might want to frame it as a loss of *guidance* rather than a logical collapse.

  **3. Accessibility**
  Paragraph two is the danger zone. Terms like "continuity," "lexical orderings," and "real-valued utility function" will lose a general-interest reader. You don't need to dumb it down, but you need to gloss them. For "continuity," try: "the assumption that any bad thing can be outweighed by enough small good things." For "lexical," try: "a strict priority rule, like safety over comfort."

  **4. Opening Hooks**
  The "trillion lifetimes" example is classic but abstract. Try grounding it in the medical context you mention later:
  *   **The Clinical Hook:** "When a nurse asks you to rate your pain from one to ten, she assumes something controversial: that a '10' is just a larger version of a '1', not a different kind of thing entirely."
  *   **The Policy Hook:** "Imagine a health committee with enough budget to either cure millions of migraines or prevent one person from being tortured. Most people know instantly which they'd choose. Standard ethics struggles to explain why."

