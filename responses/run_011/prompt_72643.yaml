answer: |-
  You have identified a precise and under-theorized mechanism in social ontology. You are describing a specific *epistemic maneuver* that occurs within the broader dynamics of social construction. While there are neighboring concepts, none capture the specific *temporal inversion of the evidentiary record* that you have isolated.

  Here is an evaluation of the existing neighborhood, followed by a coinage and a rigorous carving of its boundaries.

  ### 1. The Existing Neighborhood

  **Ian Hacking's "Looping Effects" (Interactive Kinds)**
  *   **Fit:** High. Hacking established that classifying people changes how they act, which in turn changes the classification. Your description is a looping effect.
  *   **Gap:** Hacking's model is dynamic and open-ended. It describes an *ongoing* instability where the kind and the people co-evolve. It does not necessarily account for the *closure* of the loop. In Hacking's framework, the constructed nature of the kind usually remains visible to the sociologist. Your phenomenon requires that the construction be *concealed* so the kind appears natural. Hacking describes the engine; you are describing the exhaust scrubber.

  **Robert Merton's "Self-Fulfilling Prophecy"**
  *   **Fit:** Moderate. A false definition evokes behavior that makes the conception true.
  *   **Gap:** Merton focuses on the *truth-value* of the outcome (the prophecy comes true), not the *genealogy* of the evidence. A self-fulfilling prophecy can be acknowledged as such ("We made this happen"). Your phenomenon requires the retroactive claim that "We *found* this happening." Merton allows for the prophecy to be known as a cause; your phenomenon requires the cause to be erased.

  **Performativity (Austin/Butler/Callon)**
  *   **Fit:** Moderate. Classifications bring realities into being.
  *   **Gap:** Performativity theory generally celebrates or critiques the *power to create*. It rarely focuses on the *denial of creation*. In economic performativity (Callon), the theory shapes the market, but economists often admit the model is a tool. Your phenomenon involves a claim of *discovery* rather than *engineering*.

  **Conclusion on Existing Terms:**
  There is no single term that captures the **retroactive evidentiary closure**. Existing terms describe the *creation* of the reality, but not the *laundering of the origin story*.

  ### 2. The Coinage: "Ontological Bootstrapping"

  I propose the term **Ontological Bootstrapping**.

  **Definition:**
  Ontological Bootstrapping is a social-ontological process wherein a classification is introduced without empirical warrant, induces behavioral or self-conceptual uptake in the classified population, and subsequently cites that uptake as independent evidence that the classification described a pre-existing natural kind.

  **Etymology:**
  It draws on the idiom "pulling oneself up by one's bootstraps"—an impossibility where the ground for leverage is created by the act of lifting itself. In this context, the *evidentiary ground* for the classification is created by the classification's own circulation.

  **Why this term fits:**
  1.  **Self-Creation:** It captures the fact that the warrant is generated internally to the system.
  2.  **Logical Impossibility:** It highlights the fallacy: evidence cannot precede the instrument that generated it, yet the record is arranged to suggest it does.
  3.  **Stability:** Unlike "Looping," which suggests flux, "Bootstrapping" suggests a completed lift—the kind is now "off the ground" and appears independent.

  ### 3. The Carving: Boundaries and Exclusions

  You asked specifically where the boundaries lie. The carving of **Ontological Bootstrapping** is defined by three necessary conditions. If any are missing, the phenomenon falls outside the term.

  **Condition A: The Intervening Label (The "Asserted Trait")**
  The trait must be introduced via a label *before* it is measured.
  *   **Boundary Case:** *A stereotype that becomes true without the label.*
      *   **Verdict:** **Excluded.** If a group becomes "disloyal" due to economic conditions, and observers merely notice it later without a prior generational label asserting disloyalty, this is standard social change, not bootstrapping. There is no classificatory intervention to hide.
  *   **Boundary Case:** *A label applied after measurement.*
      *   **Verdict:** **Excluded.** If surveys measure disloyalty first, and *then* the label "Gen Z" is attached to the data, this is standard induction. Bootstrapping requires the assertion to precede the measurement.

  **Condition B: The Evidentiary Inversion (The "Retroactive Read")**
  The effects of the label (surveys, self-descriptions) must be cited as evidence of the *prior* validity of the label.
  *   **Boundary Case:** *Ordinary reliance on self-reported attitudes.*
      *   **Verdict:** **Excluded.** If a survey asks "Are you entrepreneurial?" and reports the result as "Current self-perception," this is valid data. It becomes Ontological Bootstrapping only when a later writer cites that survey to claim "Gen Z *is* entrepreneurial" (essential trait) while ignoring that the question presupposed the category. The boundary is crossed when the *response to the label* is treated as *data independent of the label*.
  *   **Boundary Case:** *Open Performativity.*
      *   **Verdict:** **Excluded.** If an HR consultant says, "We are using the 'Millennial' label to *encourage* entrepreneurial behavior," they are admitting the bootstrapping. Ontological Bootstrapping requires the *concealment* of the causal link. The loop must be closed epistemically, not just ontologically.

  **Condition C: The Naturalization (The "Settled Kind")**
  The process must result in the classification being treated as a *natural kind* (discovered) rather than a *practical kind* (made).
  *   **Boundary Case:** *A market category that shapes the products it sorts.*
      *   **Verdict:** **Conditional.**
          *   If a tech company defines "Millennial Users" to sell them specific apps, and admits they are segmenting a market for utility, this is **Market Performativity** (Callon).
          *   If the same company publishes a white paper claiming "Millennials *natively prefer* these apps" (citing usage data generated by the segmentation), this **is Ontological Bootstrapping**.
      *   **The Edge:** The boundary lies in the *claim of discovery*. If the market actor claims to be *mapping* terrain they *graded*, it is bootstrapping. If they admit to *grading* the terrain, it is not.

  ### 4. Summary of the Phenomenon

  **Ontological Bootstrapping** is distinct from the **Self-Fulfilling Prophecy** because the latter is satisfied when the prediction comes true. Bootstrapping is only satisfied when the prediction is *retroactively reclassified as a description*.

  It is distinct from **Hacking's Looping Effects** because Looping allows for the "kind" to remain unstable or contested. Bootstrapping is the specific maneuver used to *stabilize* the kind by erasing the loop.

  **In your seminar context:**
  When you analyze generation ontology, you are not just looking at how labels change people (Looping). You are looking for the **documentary trail** where the *reaction* to the label is filed under *evidence for* the label. That specific archival maneuver is Ontological Bootstrapping.

  **Example Application:**
  *   **Not Bootstrapping:** "We labeled them Gen Z, and now they act like it." (Admitted construction).
  *   **Bootstrapping:** "Surveys show Gen Z is anxious; therefore, our label correctly identified a generational trait." (Where the survey questions were framed by the label's existing media circulation).

  This term gives you the leverage to critique not just the *existence* of the generation, but the *integrity of the evidence* used to substantiate it. It shifts the critique from "Are they really like that?" to "How was the 'really' manufactured?"
