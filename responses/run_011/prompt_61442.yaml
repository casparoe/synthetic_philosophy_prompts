answer: |-
  You ask me what is settled at three in the morning, if not the content of a dream experience. I reply that what is settled is not what she is undergoing, but what she will say she underwent. You are tempted to think that because the morning report is not a fiction assembled from nothing, the material of that report must have existed in her mind during the night. But this is to be misled by the grammar of the word 'experience'. Consider a man who is hypnotized and told he will see a cat upon waking. When he wakes and says 'I see a cat', we do not say the experience of the cat was happening to him while he was under hypnosis, merely because the suggestion caused it. Similarly, the utterance at three in the morning is a causal factor, like the hypnotic suggestion, which determines the impression she will have when she wakes. The 'something' you seek is a physiological and behavioral disposition to report a ledger, not a conscious acquaintance with a ledger.

  You press me to say what the experimenters were manipulating, and why their manipulation works. They were manipulating the conditions under which she would wake and speak. On the first night, the follow-up question 'is the man still there?' serves to fix a certain verbal pattern which persists until morning. On the second night, the absence of this question allows other dispositions to prevail, resulting in a report of a garden. I grant you that there is a continuous causal chain from the utterance at three to the report at nine. But to say that the dream 'exists' at three is to confuse the cause with the effect. The dream is the impression had at waking; the state at three is merely the cause of that impression. If she had not woken, there would have been no dream, though the causal state at three would have been identical. Thus, the state at three cannot be the dream itself.

  So, to answer your question directly in my own vocabulary: what is settled at three in the morning is the verdict of the waking hour. The experimenters determine what story she will tell, and consequently what impression she will have, but they do not determine what she is experiencing while asleep, for she is not experiencing anything. You ask what was going on in her mind. I say that nothing was going on in her mind, because the concept of 'what is going on in the mind' has no application to a sleeper who gives no report at that time. The utterance she makes is a noise produced by a sleeper, causally linked to her waking speech, but it is not a window into a concurrent consciousness. Why must you insist that the cause of a report must itself be a mental experience?
