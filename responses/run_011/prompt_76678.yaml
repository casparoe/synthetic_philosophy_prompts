answer: |-
  Welcome. I am pleased to see the room full, though I confess I remain slightly suspicious of the title we chose. "Found or Made?" suggests a binary where there may be only a spectrum. But since the invitations are sent, let us use the ambiguity productively.

  We are here because we all use the phrase "the network represents X." But we are often talking past one another. To clear the air, consider three distinct claims hidden inside that sentence.

  First, the **tracking claim**. This says internal states covary systematically with properties of the world. If a unit lights up when there is a dog in the image, it tracks "dog-ness." Second, the **functional-role claim**. This says the state is used by the system like a belief; its content makes a difference to what the system does across situations, even new ones. Third, the **ascription claim**. This says "represents" is merely a description we adopt from outside because it earns its keep in prediction and intervention, regardless of what is inside.

  Much of our loudest disagreement is verbal. If you are arguing for tracking and I am arguing for ascription, we may both be right. However, one dispute survives this disambiguation. It concerns whether the functional role is fixed by the architecture and weights alone, or whether it is fixed only when we include the environment and the user. That is a real dispute. It is worth two days.

  To navigate it, we must accept some common ground without surrendering our positions. **There is a fact of the matter about what the network is doing.** There is also **a mechanism we can reverse-engineer.** And finally, **some explanations fail.** I say this because both camps can stand here. One camp hears ontological commitment; the other hears pragmatic constraint. Neither of us needs to flinch yet.

  But we must confront where the naive picture breaks. You cannot interpret these systems as if they were neat filing cabinets. Consider a city's utility grid. A single conduit carries electricity for streetlights and data for traffic signals. If you cut the conduit, both go dark. One physical thing does two jobs. Now imagine the city has more distinct services than physical conduits. It manages this by sending mixed signals down the same wire, separable only when they reach the right transformer. We are trying to read the blueprint, but the wiring does not match the list of services one-to-one. If you assume one wire means one service, you will be lost. If you assume one service means one wire, you will also be lost. The structure is there, but it is dense.

  To our colleagues from the funding body: you have asked whether our findings can support an assurance about a deployed system, or only a suggestive story. I will be honest. At present, we can offer evidence that reduces uncertainty, but we cannot offer guarantees that eliminate it. We can show you where the brakes are, and we can show you that they work under test conditions. We cannot yet promise they will hold on every road in every weather. That is not a dismissal of your question; it is the boundary of our current craft. If we leave here having narrowed that boundary, we have succeeded.

  So, what is the task? We cannot spend two days defining terms without testing them. I propose we organize around a single question: **Under what conditions must we admit a proposed feature is mistaken?**

  If you believe features are found, you must describe what evidence would prove you wrong. If you believe features are made, you must describe when a construction becomes too clumsy to retain the name. Let us not ask what makes a feature real. Let us ask what makes it wrong.

  The hosts have prepared the schedule. I will not preview it. I will only say that the microphones are open. Let us begin.

  ***

  **Note on Partisan-Sounding Claims**

  1.  **"There is a fact of the matter about what the network is doing."**
      *   *Realist:* Refers to mind-independent structural truths.
      *   *Instrumentalist:* Refers to stable input-output regularities.
      *   *Divergence:* Realists require ontological grounding; instrumentalists require predictive stability.

  2.  **"There is a mechanism we can reverse-engineer."**
      *   *Realist:* Implies uncovering pre-existing causal gears.
      *   *Instrumentalist:* Implies building a usable model of control.
      *   *Divergence:* Realists seek discovery; instrumentalists seek utility.

  3.  **"Some explanations fail."**
      *   *Realist:* Fails because it mismatches reality.
      *   *Instrumentalist:* Fails because it lacks predictive power.
      *   *Divergence:* Realists judge by correspondence; instrumentalists judge by coherence/use.
