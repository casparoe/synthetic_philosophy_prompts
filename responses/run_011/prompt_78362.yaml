answer: |-
  The calculator on Mara's desk was an old model, the plastic keys worn smooth by thirty years of thumbs. It sat beside the ruler, the red pen, and the stack of files that smelled of ozone and stale coffee. Outside the window, the city hummed, oblivious to the arithmetic happening in Room 304.

  Mara picked up the latest petition. It was thin, just three sheets of paper. The header read: *Prevention of Structural Failure, I-95 Overpass, Sector 4.* claimed cost: $10 million. Claimed impact: $150 million in avoided damages and lives saved.

  She opened the regulation binder. Section 8, Subsection C: *The Inverse-Detail Prior.* Credence begins at unity. Each paragraph of mechanistic detail halves the probability of validity. A specific mechanism is easier to invent than a vague one.

  She looked at the text.

  Paragraph one: *The stress fractures in the north support pillar have reached critical threshold due to saline corrosion.*
  Paragraph two: *Application of the polymer sealant will halt oxidation for a period of no less than five years.*
  Paragraph three: *Failure to act will result in collapse during the next heavy precipitation event.*

  Mara picked up the ruler. She wasn't measuring length; she was measuring density. The agency's counter-rule mandated a detail floor. Anything under three paragraphs was unverifiable vaguery, rejected outright. Anything over five paragraphs was specific fiction, credence halved into irrelevance. The admissible band was three to five.

  She tapped the calculator. Base probability: 1.0.
  Paragraph one: 0.5.
  Paragraph two: 0.25.
  Paragraph three: 0.125.

  Twelve and a half percent.

  She multiplied by the impact. $150 million times 0.125 equalled $18.75 million. The intervention cost was $10 million. The expected value was positive. $8.75 million in net utility.

  She reached for the red pen to mark *APPROVED*, then paused. Her eyes drifted to the second paragraph. *Application of the polymer sealant will halt oxidation for a period of no less than five years.*

  It was a compound sentence. Technically, it contained two clauses joined by a conjunction that implied a separate mechanistic step: the application, and the halting. In the Elias era, twenty years ago, clerks had debated clause density. Elias, the legendary verifier, had signed off on the only success in the agency's history. The file was sealed now, stored in the basement archives, but the rumor was that Elias had counted paragraphs by semantic weight, not just line breaks.

  Mara looked at the second paragraph again. It was long. It carried the weight of two assertions. If she counted it as 1.5 paragraphs, the total count became 3.5. The regulation didn't account for halves, but the spirit of the law did. Specificity was the enemy. This sentence was too specific. It named the polymer. It named the duration.

  If she penalized it as a fourth paragraph, the math broke.
  Paragraph four: 0.0625.
  $150 million times 0.0625 equalled $9.375 million.
  Cost: $10 million.
  Net utility: Negative.

  She looked at the budget ledger. The agency had $500 million remaining this fiscal year. Almost all of it was already allocated to *Project Aegis* and *The Solar Shield Initiative*. Those petitions were five paragraphs exactly. They claimed stakes in the trillions—existential risks, reality unraveling, sun-eating microbes. Their probabilities were low, one in thirty-two, but the stakes were so infinite that their expected value dwarfed everything else. They consumed the budget. They never paid off. Thirty years of funding the end of the world, and the world kept turning.

  Except for Elias. One success.

  Mara looked at the bridge petition. It was mundane. Boring. It didn't scream for attention. It sat in the admissible band, right on the edge. If she counted the second paragraph as two, she saved the agency $10 million. She protected the budget for the high-stakes existential threats that dominated the EV rankings. It was the rational choice. Maximize expected value across the portfolio.

  She pressed the pen to the paper. She wrote *REJECTED* in bold letters. Beneath it, she noted: *Detail Count: 4. Credence below threshold.*

  She stamped it. The sound was heavy, final. She placed it in the outbox.

  Two weeks later, the rain came. It wasn't a storm, just a steady, soaking downpour that lasted forty-eight hours. Mara was at her desk, reviewing a petition about asteroid deflection lasers (five paragraphs, stakes: $50 trillion), when the news alert flashed on her screen.

  *I-95 Overpass Collapses in Sector 4.*

  The footage showed the concrete snapping like dry chalk. Cars slid into the river. The toll climbed: twelve dead, forty injured. Damage estimates settled at $140 million.

  Mara froze. The numbers aligned perfectly with the petition. The mechanism was exactly as described. Saline corrosion. Critical threshold. Precipitation event.

  She stood up and walked to the filing cabinet where she kept copies of the day's decisions. She pulled the rejection slip. She looked at the second paragraph. *Application of the polymer sealant will halt oxidation for a period of no less than five years.*

  It was one sentence. One period. One paragraph.

  She had counted the weight of the words instead of the structure of the text. She had applied the Elias heuristic without the Elias intuition. She had halved the probability based on a feeling of specificity, violating the strict arithmetic the agency was built on. The regulation said *paragraphs*, not *clauses*. It said *count*, not *weigh*.

  By trying to be smarter than the rule, she had broken the math. The petition had been admissible. The EV had been positive. The bridge was down.

  She looked at the budget ledger again. The millions she had saved by rejecting the bridge were still sitting there, waiting for the next five paragraph apocalypse that wouldn't come. She sat down. The calculator sat silent. She didn't touch it. She just watched the rain streak the window, thinking about the sealed file in the basement, wondering if Elias had ever miscounted a paragraph, and if that was how he got the one win that haunted them all.

  ***

  **Author's Note on Decision-Theoretic Picture**

  I am moderately confident in the internal consistency of the decision-theoretic picture presented, specifically as a dramatization of "Pascal's Mugging" scenarios within bureaucratic frameworks. The core commitment—the inverse-detail prior—is the most contested element among epistemologists and risk analysts. In standard Bayesian updating, specific details that are subsequently verified usually *increase* credence, whereas this story assumes a prior penalty for specificity to counteract fabrication. This is a heuristic often used in fraud detection but is controversial when applied to existential risk modeling.

  The treatment of the single apparent success (the Elias file) is the point I am least sure of. In real-world risk mitigation, distinguishing signal from noise after a single positive outcome is statistically fraught; attributing it to skill rather than luck (or survivorship bias) is a common cognitive error. The story assumes the success was real but opaque, which serves the narrative ambiguity but rests on shaky probabilistic ground.
