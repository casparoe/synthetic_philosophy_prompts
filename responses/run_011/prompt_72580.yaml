answer: |-
  # Seminar Activity: The Agency Money Pump
  **Course:** Decision Theory (Advanced Undergraduate)  
  **Class Size:** 16 Students  
  **Duration:** 75 Minutes  
  **Goal:** Demonstrate that the normative force of the money-pump argument relies on assumptions of *dynamic agency* (consistency over time, commitment, and aggregation), not merely on the logical property of transitivity.

  ---

  ## I. Materials & Setup

  **Currency:** "Credits" (printed poker chips or slips).  
  **Conversion:** 10 Credits = $1.00 USD (paid in cash or gift card at the end of class).  
  **Prizes:** Three Lottery Tickets (laminated cards).
  *   **Ticket S (Safety):** 100% chance of **10 Credits**.
  *   **Ticket M (Middle):** 40% chance of **25 Credits** (EV = 10).
  *   **Ticket L (Longshot):** 5% chance of **100 Credits** (EV = 5).

  **The Fee:** 1 Credit per trade (paid to the Instructor/Bank).

  **Room Layout:**
  *   **Phase 1:** Students seated individually.
  *   **Phase 2a:** 5 Tables of 3 students (15 students). 1 student acts as "Banker/Observer."
  *   **Phase 2b:** Students return to individual seats.

  ---

  ## II. Timeline & Procedure

  ### 0:00 – 0:05 | Introduction
  *   **Script:** "Today we are testing the robustness of rational choice. You will hold assets, trade them, and keep the final value. At the end, Credits convert to cash. There is a 1-Credit transaction fee for every trade. Your goal is to maximize your final payout."
  *   **Distribution:** Randomly hand out Tickets. (5 S, 5 M, 6 L).

  ### 0:05 – 0:20 | Phase 1: The Individual Pump
  *   **Objective:** Induce a cycle ($S \to M \to L \to S$) via shifting heuristic salience.
  *   **Mechanism:** The Instructor acts as a "Broker," moving student-to-student. Do not announce trades to the whole class.
  *   **Step 1 (S $\to$ M):** Approach students with **Ticket S**.
      *   *Pitch:* "Ticket M has the same Expected Value but offers upside. Why cap your gain at 10? Upgrade to M." (Target: *EV Heuristic*).
      *   *Cost:* Student pays 1 Credit.
  *   **Step 2 (M $\to$ L):** Approach students now holding **Ticket M**.
      *   *Pitch:* "Ticket L is the only one with life-changing potential. 100 Credits vs 25. Are you really risk-averse enough to ignore the jackpot?" (Target: *Maximax/Regret Heuristic*).
      *   *Cost:* Student pays 1 Credit.
  *   **Step 3 (L $\to$ S):** Approach students now holding **Ticket L**.
      *   *Pitch:* "5% is basically zero. You've spent 2 Credits already. Secure your remaining capital with Ticket S. A bird in the hand." (Target: *Certainty Effect*).
      *   *Cost:* Student pays 1 Credit.
  *   **Result:** Students end with Ticket S (same as start) minus 3 Credits.
  *   **Reveal:** Ask students to raise hands if they completed the full cycle. Count the losses.

  ### 0:20 – 0:40 | Phase 2a: The Committee Pump (Condorcet)
  *   **Objective:** Show groups can be pumped even if *no individual* has intransitive preferences.
  *   **Setup:** Form 5 committees of 3. Assign each member a **Secret Preference Card** (Transitive).
      *   **Member 1:** $S \succ M \succ L$ (Risk Averse)
      *   **Member 2:** $M \succ L \succ S$ (Risk Neutral/Seeking)
      *   **Member 3:** $L \succ S \succ M$ (Lottery Seeker)
      *   *Note:* These are all transitive orderings.
  *   **Rule:** The Committee holds one Ticket (Start with **S**). Trades require a **Majority Vote**. Fees (1 Credit) come from a shared **Committee Pot** (endowed with 10 Credits).
  *   **The Cycle:**
      1.  **Vote S $\to$ M:** Member 2 & 3 vote Yes (2-1). Fee paid.
      2.  **Vote M $\to$ L:** Member 2 & 3 vote Yes (2-1). Fee paid.
      3.  **Vote L $\to$ S:** Member 1 & 3 vote Yes (2-1). Fee paid.
  *   **Result:** The Committee returns to S, having lost 3 Credits from the pot.
  *   **Key Observation:** Ask Member 1: "Do you have intransitive preferences?" (No). Ask the Group: "Was the group irrational?"

  ### 0:40 – 1:00 | Phase 2b: The Commitment Auction
  *   **Objective:** Show that avoiding the pump has a cost, and pricing that cost is politically contentious.
  *   **Setup:** Return to individuals. Reset Tickets (Random).
  *   **The Device:** Offer a "Sealed Envelope." If bought, the ticket is locked inside. No trading allowed.
  *   **The Conflict:** The price is not fixed. The class must vote on a **Subsidy Cap**.
      *   *Instructor:* "Rationality is expensive. We will subsidize the Envelopes. How much public money should we spend per Envelope to prevent pumping?"
      *   *Options:* $0.50, $1.00, $2.00, $3.00.
      *   *Debate:* Students must argue the probability of being pumped vs. the cost of the subsidy. (e.g., "If I won't trade, why subsidize?" vs. "If I might trade, I need protection.")
  *   **The Auction:** After the vote sets the subsidy (e.g., $1.00), students bid for Envelopes using their own Credits.
      *   *Scenario:* If the subsidy is low, the market price might exceed the pump cost (3 Credits). If high, everyone buys, draining the "public pot."
  *   **Result:** Some buy protection, some gamble. Compare final wealth.

  ### 1:00 – 1:15 | Debrief & Mapping
  *   **Phase 1 Map:** Tests **Transitivity**. Failure implies vulnerability to exploitation *if* you trade sequentially without foresight.
  *   **Phase 2a Map:** Tests **Aggregation**. Intransitivity exists in the *voting rule*, not the agents. The "Agent" here is the Committee. It shows the Money Pump applies to any entity with inconsistent choice functions, not just human psyches.
  *   **Phase 2b Map:** Tests **Dynamic Consistency**. The pump only works if you cannot bind your future self. The argument over the subsidy price reveals that "being rational" is a resource-constrained activity.
  *   **Closing Point:** "The Money Pump doesn't prove you must have transitive preferences. It proves you must have a **policy** for managing them over time. If you can't commit, you pay."

  ---

  ## III. Exact Numbers & Conversion

  | Item | Value | Notes |
  | :--- | :--- | :--- |
  | **Starting Endowment** | 5 Credits (Cash) + 1 Ticket | Ensures they can pay fees. |
  | **Ticket S** | 100% of 10 Credits | EV = 10 |
  | **Ticket M** | 40% of 25 Credits | EV = 10 |
  | **Ticket L** | 5% of 100 Credits | EV = 5 |
  | **Trade Fee** | 1 Credit | Paid to Instructor Bank. |
  | **Committee Pot** | 10 Credits | Shared by 3 members. |
  | **Conversion** | 10 Credits = $1.00 | Paid post-class. |
  | **Max Loss** | 3 Credits ($0.30) | Per cycle. |

  *Note: The monetary stakes are low to avoid ethical issues, but high enough to be felt. The "loss" is the pedagogical point.*

  ---

  ## IV. Troubleshooting: What Goes Wrong

  **1. The "Sophisticate" Block (Phase 1)**
  *   **Problem:** 2-3 students will recognize the cycle immediately and refuse the first trade.
  *   **Impact:** The pump fails for them.
  *   **Handling:** **Do not force them.** In the debrief, highlight them. "These students were not protected by transitivity; they were protected by *foresight*. The Money Pump argument assumes you choose myopically (step-by-step). If you choose by *plan*, the pump fails."
  *   **Lesson:** This actually strengthens the Phase 2 conclusion (Agency over time matters).

  **2. The Committee Deadlock (Phase 2a)**
  *   **Problem:** Members realize the cycle and vote "No" on the second trade to save the pot.
  *   **Handling:** Remind them of the voting rule. "You must vote based on your current preference over the two tickets on the table. You cannot vote strategically based on future trades." (This enforces *sophisticated voting* constraints).
  *   **Lesson:** This demonstrates the tension between *sincere* voting (which pumps) and *strategic* voting (which requires complex calculation).

  **3. The Commitment Price War (Phase 2b)**
  *   **Problem:** Students vote for a $3.00 subsidy (full coverage), making Envelopes free.
  *   **Handling:** Cap the total class budget for subsidies (e.g., "The Department only gave us $10 total for subsidies"). This forces trade-offs.
  *   **Lesson:** Rationality is a scarce resource. We cannot eliminate all vulnerability.

  ---

  ## V. Limitations (Instructor Notes)

  You must supply these points verbally; the activity cannot demonstrate them alone.

  1.  **The Normative Premise:** The activity assumes *wealth maximization* is the only goal. A student might say, "I enjoyed the thrill of trading." The Money Pump only works if we assume the agent *wants* to avoid loss more than they enjoy the process. You must assert this as a definition of *instrumental rationality*.
  2.  **The "Small World" Assumption:** The pump works because the environment is static (same 3 tickets). In the real world, options change. A student might argue, "I traded because I thought new info was coming." You must clarify that Decision Theory assumes a closed system.
  3.  **Dynamic Consistency vs. Transitivity:** The activity shows that *foresight* (Phase 1 Sophisticates) and *commitment* (Phase 2b) stop the pump. This implies the core norm is **Dynamic Consistency**, not Transitivity. Transitivity is just a sufficient condition for consistency, not a necessary one.

  ---

