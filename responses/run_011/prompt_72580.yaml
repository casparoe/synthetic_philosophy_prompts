      *   *Debrief:* Map to Dynamic Consistency, Agency, and Aggregation.

  8.  **Refining the Numbers:**
      *   Make sure the EVs aren't *too* obvious or students will just maximize EV and ignore the pump.
      *   Ticket S: 10 RP sure.
      *   Ticket M: 45% of 25 RP (EV 11.25).
