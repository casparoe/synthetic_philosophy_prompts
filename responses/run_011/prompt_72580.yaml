      *   *Refinement on Commitment:* The prompt says "the commitment version should make the purchase price itself something the group has to argue about." This implies the commitment device part might also involve groups? Or perhaps the "group" refers to the class discussing the normative price?
      *   *Re-reading:* "run the same pump twice more — once on three-person committees... and once on individuals who were permitted... to buy a device... The committee version should be arranged so the group is pumpable in a way no individual member is; the commitment version should make the purchase price itself something the group has to argue about."
      *   *Interpretation:*
          *   Part 2a: Committees (Condorcet cycle).
          *   Part 2b: Individuals with Commitment. The "group has to argue about" likely refers to a class-wide discussion or a market mechanism for the device price. Let's make it a *market* for commitment devices where the price is set by auction, or simply a class debate on the "fair price" of rationality.
          *   *Better interpretation for a seminar:* In the commitment phase, split the class. Half can buy commitment, half cannot. Or, make the commitment device cost variable.
          *   *Let's stick to the prompt's constraint:* "purchase price itself something the group has to argue about." I will interpret this as: Before Phase 2b, the class must vote on the maximum reasonable price for a commitment device. If they vote too low, no one buys. If too high, the pump eats the savings. This highlights the *regress problem* (how much to spend on avoiding pumps?).

  4.  **Logistics & Materials:**
      *   16 Students.
      *   Tokens: Poker chips or printed slips. Let's use printed "Deci-Tokens" (DT).
      *   Tickets: Colored cards (Red, Blue, Green).
      *   Fee Collection: A "Bank" (Instructor).
      *   Prizes: Candy or actual cash equivalent at the end (e.g., Amazon gift cards or cash). Let's use Cash for impact. 10 DT = \$1.
      *   Timeline: 75 mins.
          *   Intro: 5 min.
          *   Phase 1: 20 min.
          *   Phase 2 (Committees): 20 min.
          *   Phase 2 (Commitment): 20 min.
          *   Debrief: 10 min.
      *   *Wait, 75 mins is tight.* Need to be crisp.

  5.  **Addressing "What Goes Wrong":**
      *   *Issue 1:* Students spot the pump immediately.
      *   *Fix:* Use a "Market Maker" (TA or Instructor) who approaches them individually, not a public announcement. Obscure the cycle by framing trades as "upgrades."
      *   *Issue 2:* Students refuse to trade.
      *   *Fix:* Make the initial endowment random. Some get "bad" tickets. Incentivize trading to improve expected value.
      *   *Issue 3:* Commitment device pricing is trivial.
      *   *Fix:* Force a class vote on the subsidy for the device.

  6.  **Addressing "Limitations":**
      *   The activity cannot prove that *dynamic consistency* is the only norm. It relies on the assumption that "losing money is bad." A student could say "I enjoyed the thrill of trading." The instructor must supply the normative premise that *instrumental rationality requires wealth maximization.*

  7.  **Drafting the Plan (Iterative refinement):**

      *   *Currency:* "Rationality Points" (RP). 10 RP = \$1.
      *   *Lotteries:*
          *   **Ticket S (Safety):** 100% chance of 10 RP.
          *   **Ticket M (Middle):** 50% chance of 24 RP. (EV 12)
          *   **Ticket L (Longshot):** 10% chance of 100 RP. (EV 10)
          *   *Preferences:* S > M (Certainty), M > L (EV), L > S (Regret avoidance/Jackpot).
      *   *Fee:* 1 RP per trade.
      *   *Phase 1:* Random distribution. Instructor acts as "Broker."
      *   *Phase 2a (Committees):* Groups of 3. Assign preference cards secretly.
          *   Member 1: S > M > L
          *   Member 2: M > L > S
          *   Member 3: L > S > M
          *   Group holds one ticket. Majority votes on trade.
          *   Fee comes from group pot (endowed with 5 RP).
