prompt: |-
  I teach a decision-theory seminar for advanced undergraduates — sixteen students, one 75-minute session. Design a money-pump activity they run on themselves in two phases, where the second phase is meant to undercut the conclusion they draw from the first.

  Phase 1: induce genuinely intransitive preferences over three lotteries and then charge a small fee at each step of the trading cycle, so that participants discover on their own that they have ended up strictly worse off. Give me the exact prize structures, the token currency, the fee, and how tokens convert into small real prizes.

  Phase 2: run the same pump twice more — once on three-person committees that settle each trade by majority vote, and once on individuals who were permitted, before the cycle began, to buy a device binding them to a complete plan rather than choosing step by step. The committee version should be arranged so the group is pumpable in a way no individual member is; the commitment version should make the purchase price itself something the group has to argue about.

  I want them to leave seeing that the pump's force depends on assumptions about how an agent governs herself across time, not on intransitivity by itself.

  Include rules, materials, the exact numbers, a timeline, and a debrief that maps each moment onto the assumption it tests. Tell me what predictably goes wrong the first time I run it — I expect several students to see the cycle coming and refuse the opening trade — how to handle that, and be frank about which feature of the argument the activity cannot reproduce and I will have to supply myself.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** Advanced undergraduates (Decision Theory Seminar).
      *   **Class Size/Time:** 16 students, 75 minutes.
      *   **Goal:** Demonstrate that the force of the money-pump argument depends on assumptions about *agency over time* (dynamic consistency, commitment, group vs. individual), not just intransitivity itself.
      *   **Structure:**
          *   Phase 1: Individual money pump (intransitive preferences $\rightarrow$ loss).
          *   Phase 2: Two variations (Committees & Pre-commitment).
          *   Phase 2 Goal: Show committees can be pumped even if individuals aren't; show pre-commitment costs are contentious.
      *   **Requirements:** Exact prize structures, token currency, fees, conversion rates, rules, materials, timeline, debrief, troubleshooting (what goes wrong), and limitations.

  2.  **Deconstruct Phase 1 (The Classic Pump):**
      *   *Need:* Intransitive preferences ($A \succ B \succ C \succ A$).
      *   *Mechanism:* Lotteries. Usually based on the "Common Consequence" or "Common Ratio" effect, or simply constructed preferences. For a seminar, constructed preferences based on distinct attributes (Probability vs. Payoff) work best to ensure intransitivity without needing complex prospect theory explanations.
      *   *Structure:*
          *   Lottery A: High probability, medium payoff.
          *   Lottery B: Medium probability, high payoff.
          *   Lottery C: Low probability, very high payoff (or a different mix).
          *   *Wait, standard money pumps usually rely on A > B > C > A.*
          *   Let's use a simple attribute weighting failure.
          *   Option A: \$10 for sure.
          *   Option B: 50% chance of \$25. (EV = 12.5)
          *   Option C: 10% chance of \$100. (EV = 10)
          *   *Problem:* Risk neutral agents won't be intransitive here. Risk averse might prefer A > B > C. Risk seeking might prefer C > B > A.
          *   *Better approach:* Use the "Preference Reversal" phenomenon or simply *stipulate* the preferences via a choice architecture that triggers them.
          *   *Actually, for a seminar, it's better to use lotteries where the intransitivity is robust.* Let's use the Tversky (1969) additive difference model setup.
          *   Lottery X: 7/10 chance of \$10.
          *   Lottery Y: 8/10 chance of \$8.
          *   Lottery Z: 9/10 chance of \$6.
          *   *Wait, that's usually transitive.*
          *   *Let's try the standard "Money Pump" setup:*
          *   A: \$100 (10%)
          *   B: \$50 (50%)
          *   C: \$10 (90%)
          *   *Preferences:* A > B (chasing high payoff), B > C (chasing probability), C > A (chasing safety/EV).
          *   *Let's refine for 16 students.* They need to trade.
          *   *Currency:* "Deci-Tokens" (DT). 10 DT = \$1 USD real prize at end.
          *   *Endowment:* Each student gets one Lottery Ticket (randomly assigned A, B, or C).
          *   *Trading:* Sequential pairwise trades allowed.
          *   *Fee:* 1 DT per trade.
          *   *Goal:* If they cycle A $\rightarrow$ B $\rightarrow$ C $\rightarrow$ A, they lose 3 DT.

      *   *Refining the Intransitivity:* It's hard to *guarantee* genuine intransitivity in 16 students without manipulating the payoffs carefully.
      *   *Strategy:* Use "Attribute Dominance."
          *   Ticket A: 90% chance of \$4. (EV 3.6)
          *   Ticket B: 50% chance of \$8. (EV 4.0)
          *   Ticket C: 10% chance of \$25. (EV 2.5)
          *   *Psychology:* A > B (Safety), B > C (EV/Balance), C > A (Jackpot).
          *   *Actually, let's make it simpler.*
          *   Ticket A: \$12 for sure.
          *   Ticket B: 50% chance of \$26.
          *   Ticket C: 10% chance of \$100.
          *   *Preference:* A > B (Certainty effect), B > C (EV dominance), C > A (Possibility effect).
          *   *Wait, C > A is hard if A is sure \$12.*
          *   *Let's use the standard Tversky (1969) example.*
          *   Option A: 7/10 to win \$10.
          *   Option B: 8/10 to win \$8.
          *   Option C: 9/10 to win \$6.
          *   *This usually yields transitive preferences.*
          *   *Okay, let's look at the "Preference Reversal" literature.*
          *   Better yet: **Don't rely on natural intransitivity.** Induce it via *framing* or *lexicographic semi-orders* during the trading phase.
          *   *Actually, the prompt asks to "induce genuinely intransitive preferences."* I need a setup where rational-looking heuristics cause the cycle.
          *   *Setup:*
              *   Ticket Red: 100% chance of 10 Tokens.
              *   Ticket Blue: 50% chance of 25 Tokens.
              *   Ticket Green: 10% chance of 100 Tokens.
              *   *Heuristic 1 (Safety):* Red > Blue.
              *   *Heuristic 2 (EV):* Blue > Green (12.5 vs 10).
              *   *Heuristic 3 (Maximax):* Green > Red (100 vs 10).
              *   *This is plausible for undergrads.*
      *   *The Pump:*
          *   Start with Red.
          *   Offer trade Red $\rightarrow$ Blue (Fee 1). "You get higher EV."
          *   Offer trade Blue $\rightarrow$ Green (Fee 1). "You get huge upside."
          *   Offer trade Green $\rightarrow$ Red (Fee 1). "You get certainty."
          *   End with Red, minus 3 Tokens.

  3.  **Deconstruct Phase 2 (Committees & Commitment):**
      *   *Committees:* 3-person groups.
      *   *Problem:* Condorcet Paradox. Individual preferences are transitive, but group preferences are intransitive.
      *   *Setup:* Assign specific preference profiles to students so the *majority vote* cycles, even if individuals don't.
      *   *Profile:*
          *   Student 1: A > B > C
          *   Student 2: B > C > A
          *   Student 3: C > A > B
          *   *Majority:* A > B, B > C, C > A.
      *   *Task:* The committee holds one ticket. They vote on whether to trade. Fee is charged to the *committee pot*.
