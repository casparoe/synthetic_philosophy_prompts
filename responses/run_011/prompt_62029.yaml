prompt: |-
  Third-year psych grad student, losing a recurring argument in my lab, need either ammunition or a surrender note.

  The setup: our study enrolls participants continuously and the rule we pre-registered is that every Monday the RA computes a Bayes factor for the main effect and emails it to the PI, and we stop recruiting the first week BF10 goes above 20 or below 1/20, or when we hit N=1000, whichever comes first. A methods reviewer said this is just p-hacking with more math. Our postdoc's answer on slack was, his exact words, "the likelihood principle says the stopping rule is irrelevant — Bayesians are immune to optional stopping, that's a frequentist worry," and then he added that since the rule was fixed in advance and is two-sided it's basically the Bayesian version of an alpha-spending group sequential design, so the reviewer is making a catagory error.

  I don't buy that it's a category error, but I also can't say what's wrong, and I've noticed "the stopping rule is irrelevant" seems to mean different things depending on who's saying it. So can you lay out the distinct precise claims that slogan could be making in this situation? I can see there's some narrow sense in which the posterior given the observed data doesn't care how you decided to stop collecting, and some much less narrow sense in which a rule that says "keep enrolling until the number crosses a line" is obviously doing something, and I suspect the whole fight is those two senses talking past each other. Which readings are true, which are false, which are true but do no work against the reviewer, and which one does my postdoc actually need in order to answer the complaint?

  Two things I specifically want pinned down: (a) does pre-registering the rule and making it two-sided change anything or is that cosmetic, and is the alpha-spending analogy real or a confusion — those designs exist precisely to control something, don't they, so what is it they're controlling that we're not? (b) does it matter that the RA sees the BF every week and could in principle be swayed by it, even though the only action anyone is allowed to take is stopping?

  Please make it a list I can take to lab meeting, with a blunt verdict on each reading rather than one long essay. If the reviewer is half right and the postdoc is half right, say which half of each. No need to point me at papers or readings, I just want the argument laid out.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Situation:**
      *   **User:** Third-year psych grad student.
      *   **Context:** Lab argument about a pre-registered sequential Bayes Factor (BF) stopping rule.
      *   **Opponents:** Methods Reviewer (says it's p-hacking) vs. Postdoc (says stopping rule irrelevant/Likelihood Principle/Category Error).
      *   **Goal:** The user wants clarity on the specific claims behind "stopping rule is irrelevant," wants to know who is right/wrong, specifically regarding pre-registration/two-sidedness (a) and the RA checking weekly (b).
      *   **Format:** A list for a lab meeting, blunt verdicts, no citations needed, distinct precise claims.

  2.  **Deconstruct the Core Conflict:**
      *   *The Reviewer's Claim:* Sequential testing with a stopping threshold inflates false positive rates (Type I error) or leads to misleading evidence, similar to p-hacking.
      *   *The Postdoc's Claim:* Bayes Factors obey the Likelihood Principle; stopping rules don't change the interpretation of the evidence *given the data*. Pre-registration makes it a valid sequential design.
      *   *The Reality:* It's a mix. The *interpretation* of the BF value itself is technically immune to stopping rules (in a specific sense), but the *long-run performance* (calibration/false discovery rate) of the procedure *is* affected by optional stopping. The reviewer is worried about long-run error rates (frequentist property). The postdoc is defending the evidential meaning of the specific number (Bayesian property).

  3.  **Address the Specific Questions:**
      *   *(a) Pre-registration & Two-sidedness/Alpha-spending:* Does this fix it? Pre-registration prevents *unreported* peeking, but it doesn't stop the *inflation of false positives* if you treat BF > 20 as a decision rule with frequentist properties. Alpha-spending controls Frequentist Type I error. BF thresholds do not guarantee Frequentist Type I error control. The analogy is shaky.
      *   *(b) RA checking weekly:* Does it matter? If the rule is strictly followed, the human element doesn't change the math. However, if the RA *deviates* (e.g., "oops, missed a Monday"), then it matters. But strictly speaking, under the Likelihood Principle, the *intent* to stop based on data is what matters for frequentist properties, not the human feeling. For the Bayesian, the data is the data.

  4.  **Drafting the Claims (The "List"):**
      *   I need to break down "Stopping Rule is Irrelevant" into distinct propositions.
      *   *Claim 1: Likelihood Principle (LP).* Given the data collected, the evidence (BF) is the same regardless of why you stopped. -> **True.**
      *   *Claim 2: Calibration/False Discovery.* If you use BF > 20 as a stop rule, the rate at which you falsely claim evidence (when null is true) is not necessarily 1/20. -> **True (Reviewer is right here).**
      *   *Claim 3: Pre-registration fixes the False Discovery.* -> **False.** It fixes transparency, not the mathematical inflation of false positives inherent in sequential testing without adjustment.
      *   *Claim 4: Alpha-Spending Analogy.* -> **Confused.** Alpha-spending controls Frequentist error. BF thresholds control Evidence strength. They are different currencies.
      *   *Claim 5: RA Peeking.* -> **Irrelevant to the math, relevant to compliance.**

  5.  **Refining the Verdicts (Blunt & Actionable):**
      *   Need to validate the user's suspicion: "Two senses talking past each other."
      *   Need to clarify the Postdoc's error: He's conflating *evidential meaning* with *decision reliability*.
      *   Need to clarify the Reviewer's error: They are applying a Frequentist critique to a Bayesian metric without acknowledging the Bayesian justification, *but* their worry about false positives is valid if the lab cares about long-run error rates.

  6.  **Developing the Content (Iterative refinement):**

      *   *Point 1: The Likelihood Principle Claim.* Postdoc is right. BF = P(Data|H1)/P(Data|H0). Stopping rule isn't in that formula.
      *   *Point 2: The "False Positive" Claim.* Reviewer is right. If H0 is true, and you sample until BF > 20, you *will* eventually hit it. The probability of wrongly concluding H1 is 1.0 eventually, unless you cap N (which they do at 1000). But at N=1000, what's the error rate? It's not controlled by the BF threshold alone.
      *   *Point 3: Pre-registration.* It stops *hidden* optional stopping. It doesn't stop *declared* optional stopping from affecting long-run error rates.
      *   *Point 4: Alpha-Spending.* This is the weakest part of the Postdoc's argument. Alpha spending adjusts the threshold to keep Type I error at 5%. A fixed BF threshold of 20 does *not* adjust. So the analogy is false.
      *   *Point 5: The RA.* If the rule is algorithmic, the RA is a robot. If the RA has discretion, it's p-hacking. Assuming strict adherence, it doesn't matter.

  7.  **Final Polish:**
      *   Ensure the tone is appropriate for a grad student taking this to a lab meeting (professional, sharp, not emotional).
      *   Make sure the "Verdict" is clear for each point.
      *   Synthesize the "Who is Right" summary.

      *(Self-Correction during drafting)*: I need to be careful about the "BF > 20" claim. Jeffreys' scales suggest 20 is "strong evidence." But in a sequential context, the *interpretation* of that strength changes. Some Bayesians argue you don't care about long-run error. But most journals (and reviewers) do. I need to highlight that the Reviewer is judging the *procedure* (Frequentist lens) and the Postdoc is defending the *metric* (Bayesian lens).

      *Refining the Alpha-Spending point:* Group sequential designs *lower* the threshold for significance at interim looks to maintain overall alpha. A fixed BF threshold does *not* lower the bar. So the Postdoc is definitely wrong there.

      *Refining the Pre-registration point:* Pre-registration makes it "Registered Report" style. It validates the *process* but doesn't magically fix the *statistical properties* of the stopping rule regarding error rates.

  8.  **Final Structure:**
      *   Intro: Acknowledge the "talking past each other."
      *   The List of Claims (1-5).
      *   Specific Answers to (a) and (b).
      *   The Bottom Line (Who wins what).

  9.  (Final Review against constraints): No papers cited. Blunt verdicts. List format. Address (a) and (b).

      *Let's write it.*
answer: |-
  Here is the breakdown for your lab meeting. You are correct: the Postdoc and the Reviewer are arguing about two different properties of the procedure. The Postdoc is defending the *interpretation of the evidence*, while the Reviewer is attacking the *reliability of the decision procedure*.

  Here are the five distinct claims hiding behind the slogan "the stopping rule is irrelevant," with blunt verdicts.

  ### 1. The Likelihood Principle Claim
  **Claim:** "Once the data are in hand, the Bayes Factor calculation depends only on the likelihood of the observed data under H1 vs H0. The intention to stop or continue is not a variable in the BF formula."
  **Verdict:** **TRUE.**
  **Explanation:** Mathematically, the Postdoc is right. $BF = P(Data|H1) / P(Data|H0)$. The stopping rule does not appear in this equation. If you have 50 participants and a BF of 25, that number means the same thing evidentially whether you planned to stop at 50 or planned to stop at 1000.
  **Does it answer the reviewer?** **NO.** The reviewer isn't asking what the number *means*; they are asking how often that number *lies* when used as a stop rule.

  ### 2. The Calibration Claim
  **Claim:** "If we use BF > 20 as a stopping threshold, the long-run rate of falsely claiming strong evidence for H1 (when H0 is true) is acceptably low (e.g., 1/20 or 5%)."
  **Verdict:** **FALSE.**
  **Explanation:** This is where the Reviewer is right. In sequential testing, if the null is true, the BF is a random walk. If you keep sampling until it hits 20, you *will* eventually hit 20. The probability of a false claim approaches 1.0 as N goes to infinity. Your cap at N=1000 limits this, but a fixed threshold of 20 does *not* guarantee a 5% false positive rate. The BF threshold is not calibrated to frequentist error rates.
  **Does it answer the reviewer?** **YES.** This is their actual worry. They fear you are inflating the false discovery rate.

  ### 3. The Pre-Registration Claim
  **Claim:** "Because we pre-registered the stopping rule, we have eliminated the statistical bias associated with optional stopping."
  **Verdict:** **FALSE (Cosmetic).**
  **Explanation:** Pre-registration prevents *unreported* flexibility (hidden p-hacking). It does not prevent *declared* flexibility from affecting long-run error rates. A pre-registered rule to "sample until significant" is still a rule that inflates Type I error in a frequentist sense. It makes the p-hacking transparent, not statistically inert.
  **Does it answer the reviewer?** **NO.** Transparency does not fix calibration.

  ### 4. The Alpha-Spending Analogy Claim
  **Claim:** "This is the Bayesian version of a group sequential design with alpha-spending, so the error rates are controlled."
  **Verdict:** **FALSE (Confused).**
  **Explanation:** This is the Postdoc's weakest point. In frequentist group sequential designs, you *lower* the significance threshold at interim looks (spend alpha) to ensure the *overall* error rate stays at 5%. You are using a *fixed* BF threshold (20) at every look. You are not "spending" anything; you are risking the same amount of error every Monday. The analogy is structurally incorrect.
  **Does it answer the reviewer?** **NO.** It demonstrates a misunderstanding of how sequential controls work.

  ### 5. The Decision-Theoretic Claim
  **Claim:** "Bayesians do not care about long-run error rates (Type I/II), only about the evidence in the specific dataset, so the reviewer's concern is a category error."
  **Verdict:** **TRUE (Philosophically), BUT PRACTICALLY IRRELEVANT.**
  **Explanation:** Strict subjective Bayesians do not care about "false positive rates" across hypothetical repetitions. They care about belief updating. However, psychology journals and grant agencies operate on frequentist reliability standards. Claiming "we don't care about false positives" is a valid philosophical stance but a career-limiting move in a peer review context.
  **Does it answer the reviewer?** **NO.** It admits the reviewer is right about the error rates but argues those rates don't matter. The reviewer (and the field) disagrees.

  ***

  ### Specific Answers to Your Questions

  **(a) Does pre-registering/two-sidedness change anything? Is the alpha-spending analogy real?**
  *   **Pre-registration:** It saves you from accusations of *fraud* or *HARKing*, but it does not save you from *statistical inflation*. It makes the bias honest, not nonexistent.
  *   **Two-sidedness:** Irrelevant to the stopping problem. A two-sided BF stop rule still allows the random walk to hit a threshold under the null.
  *   **Alpha-Spending Analogy:** It is a confusion. Alpha-spending exists precisely to *penalize* interim looks by making the criteria harder to meet early on. Your design uses the *same* criteria every week. You are getting the benefit of sequential stopping (efficiency) without the cost (adjusted thresholds). That is exactly what the reviewer means by "p-hacking with more math."

  **(b) Does it matter that the RA sees the BF every week?**
  *   **Mathematically:** No. If the rule is algorithmic ("If BF > 20, Stop"), the human observer is irrelevant. The stopping time is determined by the data stream, not the RA's feelings.
  *   **Practically:** Yes, if there is any wiggle room. If the RA thinks "BF is 19.8, maybe I'll wait until next Monday to be sure," you have broken the pre-registration. If the rule is strictly enforced, the RA is just a script runner. The Reviewer's concern holds even if a computer runs it; the RA element is a secondary compliance risk, not the primary statistical flaw.

  ***

  ### The Bottom Line for Lab Meeting

  **The Reviewer is half right:** They are correct that a fixed BF threshold in a sequential design does not control long-run false positive rates like a frequentist alpha level does. If your goal is to guarantee a low false discovery rate, this design fails.

  **The Postdoc is half right:** They are correct that the *interpretation* of the BF value itself (as a likelihood ratio) is not mathematically altered by the stopping rule. If you treat the BF as a measure of evidence rather than a hypothesis test decision, the stopping rule is irrelevant.

  **The Verdict:** You cannot have it both ways.
  *   If you want to claim **"We have controlled the false positive rate,"** the Postdoc is wrong, and you need to simulate your design to show what the actual error rate is at N=1000.
  *   If you want to claim **"We are measuring evidence strength, not testing hypotheses,"** the Reviewer is wrong, but you must stop talking about "stopping rules" and "significance" and admit you are not controlling Type I error.

  **Recommendation:** Do not use the alpha-spending analogy; it is demonstrably false. Admit that the procedure does not control frequentist error rates, but argue that the pre-registered BF threshold provides a pre-defined standard of *evidential strength* that is robust to optional stopping *interpretation*, provided you acknowledge the false discovery risk in the discussion. Better yet: run a simulation of your specific design to see what the actual false positive rate is under the null, and report that.
