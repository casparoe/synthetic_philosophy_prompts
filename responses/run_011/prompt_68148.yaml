answer: |-
  ### Brainstorm Pass: Candidate Tensions

  Before locking in a ranking, here are the pairings that initially flag as unstable. Some are genuine contradictions; others are merely difficult balancing acts.

  *   **(2) vs. (5):** This is the most glaring. (2) denies summing complaints across persons. (5) endorses maximizing total QALYs, which *is* summing benefits/harms across persons. Your justification ("QALY is intra-personal") conflates the *unit* of measurement with the *decision rule*.
  *   **(1) + (2) vs. (3):** The classic "Numbers Problem." If wrongness is about justifiability to each person (1) and complaints don't sum (2), how do the extra four people in the 5-vs-1 case get a voice? If you compare 1-vs-1, the other four vanish. If you save the five, you seem to be aggregating, violating (2).
  *   **(6) vs. (2):** If complaint strength is comparable across people (6), what logically blocks summation (2)? Usually, comparability is the wedge utilitarians use to drive aggregation. You need a robust reason why comparison is allowed but addition is not.
  *   **(5) vs. (7):** Cost-per-QALY maximization often yields "wild verdicts" (e.g., rejecting orphan drugs, prioritizing minor gains for many over life-saving for few). This risks violating your conservatism constraint (7).
  *   **(3) vs. (4):** If numbers count in 5-vs-1, why does 5-vs-5 require a lottery? This is usually consistent (numbers break ties), but it relies on a specific mechanism for *how* numbers count that must align with (2).

  ---

  ### The Audit: Ranking Real Tensions

  Here are the three genuine tensions, ranked by severity. I have excluded the minor ones (like 3-vs-4) which are standard contractualist fare.

  #### 1. The "Hypocrisy" Tension: (2) vs. (5)
  **Severity:** Critical.
  **The Conflict:** You state (2) "Complaints don't sum... a billion headaches can never outweigh one person's death." Yet in (5), you endorse funding whatever buys the *most QALYs overall*. In HTA, "most QALYs overall" literally means summing small gains across many people to outweigh large losses for a few.
  **The Trap:** Your justification in (5) is the weak point. You write: *"a QALY is a measure of how things go for a person rather than a sum across persons."* This is semantically true of a single QALY unit, but false of the *maximization principle*. When you choose Treatment A (10 QALYs for Person X) over Treatment B (1 QALY for Person Y + 1 QALY for Person Z...), you are summing across persons.
  **What the Group Will Say:** They will pounce on this immediately. It looks like you hold a deontological view in the reading group and a utilitarian view at the office, and you're using a category error to hide the inconsistency.

  *   **Repair Option A (The Honest Deviation):** Admit (5) conflicts with (2). Argue that public institutions face a "problem of scarcity" that individuals do not, permitting a different moral logic (a "Two-Level" view).
      *   **Cost:** You lose theoretical unity. You must defend why the state is allowed to do what individuals cannot.
  *   **Repair Option B (The Theoretical Fix):** Weaken (2) to allow aggregation in specific contexts (see "Single Revision" below).
      *   **Cost:** You lose the hard-line "Taurekian" purity of (2).

  #### 2. The "Numbers" Tension: (1) + (2) vs. (3)
  **Severity:** High (Theoretical).
  **The Conflict:** This is the core debate of your term. If principles must be justifiable to each person *one at a time* (1), and we cannot add up complaints (2), the single drowning person has a complaint ("I die") that is stronger than any *single* one of the five ("I die"). In a pairwise comparison, the one wins (or it's a tie). Saving the five seems to require treating the five as a *block* of weight, which looks like summing.
  **The Trap:** Relying on "pairwise comparison" to save the five (as you state in 3) is the standard Scanlonian move from *What We Owe To Each Other*, but Scanlon himself later conceded this was unstable without the "Relevant Similarity" clause. If the five are not relevantly similar to the one, pairwise comparison fails to save them.

  *   **Repair Option:** Adopt Scanlon's later "Relevant Similarity" view (from *Does the Number Matter?*). The one cannot reject a principle saving the five because the five are *relevantly similar* to him; his complaint is balanced against *each* of theirs, not the sum.
      *   **Cost:** It feels like aggregation by the back door. You must be prepared to define "relevant similarity" precisely, or the group will call it a fudge.

  #### 3. The "Comparability" Tension: (6) vs. (2)
  **Severity:** Moderate.
  **The Conflict:** You claim complaint strength is comparable across people (6). Utilitarians argue that if $A > B$ and $B > C$, then $A + B > C$. If you allow interpersonal comparison of strength, you invite the question: "Why can I compare them but not add them?"
  **The Trap:** If you say complaints are comparable but not summable, you need a meta-ethical story about *why* addition is forbidden. Is it a logical impossibility or a moral rule?

  *   **Repair:** Clarify that comparability is for *balancing* (which claim is stronger?), not *accumulating* (how much total claim is there?).
      *   **Cost:** Minimal, provided you can articulate the distinction clearly. This is standard contractualist doctrine.

  ---

  ### Repair Costs: What You Lose

  If you fix these, here is the concrete price:

  1.  **If you weaken (2) to fix (5) and (3):**
      *   **The Change:** Move from "Complaints don't sum" to "Complaints don't sum *unless* they are below a threshold of severity" or "unless they are relevantly similar." (This is the "Weak Aggregation" or "Threshold" view, associated with Voorhoeve or Froberg).
      *   **What You Lose:** You lose the clean, Taurekian intuition that a billion headaches *never* outweigh a death. You must admit that enough small harms *can* outweigh a large harm if they are sufficiently similar and numerous.
      *   **Gain:** (3) becomes much easier to defend (numbers count because small harms aggregate). (5) becomes less hypocritical (HTA aggregates, but perhaps should be constrained by severity weights).

  2.  **If you sever (5) from (2):**
      *   **The Change:** Admit HTA is utilitarian, Contractualism is personal morality.
      *   **What You Lose:** The comforting idea that your work is morally continuous with your beliefs. You become a "moral schizophrenic" (a common critique of Two-Level views).
      *   **Gain:** Intellectual honesty. You stop claiming QALY maximization isn't summing.

  3.  **If you refine (3) via "Relevant Similarity":**
      *   **The Change:** You save the five not because "5 > 1" but because "1 vs 1" is a tie, and the tie is broken by the fact that the other four have claims *like* the first.
      *   **What You Lose:** Simplicity. You have to defend the "Relevant Similarity" criterion against charges that it's just aggregation in disguise.

  ---

  ### The Single Revision

  To clean up the most damage at once, I recommend you **revise (2)**.

  **Current (2):** "Complaints don't sum. There's no such thing as the total amount of suffering across a group, so a billion people's mild headaches can never outweigh one person's death..."

  **Proposed Revision:** "Complaints don't sum *arbitrarily*. Aggregation is permissible only among *relevantly similar* claims, or when individual claims fall below a threshold of urgency."

  **Why this is the best move:**
  1.  **It solves the Numbers Problem (3):** You can save the five drowning people because their claims are relevantly similar. You aren't summing "utility," you are acknowledging that five identical death-claims create a stronger *reasonable rejection* case than one, without treating them as a utilitarian blob. This aligns you with Scanlon's mature view and Voorhoeve's "hybrid" contractualism.
  2.  **It mitigates the HTA Tension (5):** It doesn't fully justify QALY maximization (which aggregates across *dissimilar* claims), but it opens the door. You can argue HTA is a *heuristic* that approximates this constrained aggregation. It stops you from making the false claim that QALYs *aren't* summed. You can instead say, "HTA sums, which is a deviation from ideal morality, but one constrained by severity weights (which you can advocate for)."
  3.  **It preserves Conservatism (7):** It blocks the "wild verdicts" of total utilitarianism. A billion headaches still might *not* outweigh a death if the headache is below the threshold of moral urgency. You avoid the repugnant conclusion while avoiding the Taurekian paralysis.

  **Concrete Cost:** You lose the slogan "Numbers Don't Count." You must now defend *where* the threshold lies or *what* counts as relevant similarity. This is harder work than hard-line non-aggregation, but it is the only position that survives contact with the post-Scanlon literature.

  **Presentation Tip:** When you present, do not say "I believe complaints don't sum." Say, "I believe complaints don't sum *unconstrained*." Then, when you get to (5), acknowledge that HTA *does* sum, and frame your professional goal as trying to inject contractualist constraints (like severity weights) into the utilitarian calculus. The philosophers will respect the honesty and the theoretical nuance far more than a rigid defense of (2) that crumbles under the weight of (3) and (5).
