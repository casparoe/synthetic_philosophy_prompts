answer: |-
  Good evening. For those who don't know our guest of honor, he has a reflex. For forty years, if you offered him a choice between two options that looked equivalent—restaurants, job candidates, sealed offers—he would smile and say, "I'll take the other envelope."

  He applied this most audibly in 1991. He declined a salary elsewhere that was, by any accounting, considerably larger. He stayed here. Since then, his students have been quietly keeping score. We look at the envelope he held—this life, this department, these graduates—and we wonder what was inside the other envelope. We do the arithmetic of regret in our heads.

  The logic is seductive. If what you hold is worth *X*, the other contains either twice as much or half as much. The average is higher. You should switch. But if you switch, the logic applies again. You spend your life swapping papers, never opening either.

  This calculation relies on a hidden assumption. It assumes you can list every possible life available to be lived, and weigh them against each other. It assumes a complete menu of the universe exists somewhere, waiting to be summed. For the six of you who know why the sum fails to converge, you see the problem. For the rest of us: you cannot calculate the worth of a road not taken when you cannot define the set of all possible roads.

  The question we've been asking—"Did he make the right choice?"—was never well-posed. It treats a life like a fixed prize hidden in paper. But value isn't found inside the envelope; it is generated by the hand that holds it. He didn't choose between two fixed amounts. He defined the amount by choosing.

  So we stop switching. We accept that there was never any other envelope. There is only this one, opened, shared, and full.

  To [Name].
