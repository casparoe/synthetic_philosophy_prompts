prompt: |-
  I'm a software engineer at a mid-sized firm, and for three years I've built and maintained the scoring spreadsheet behind our company foundation's grants round: roughly £350,000 a year, about forty applications, three of us on the panel, none of us trained in philosophy or economics. The spreadsheet asks each applicant for an estimated cost per unit of outcome plus a confidence range, and ranks on that. It has produced a bias I can no longer argue my colleagues out of by intuition alone: organisations with clean published numbers sail through, while applicants whose work is advocacy, organising or policy change score near zero simply because they cannot produce a figure — and one applicant this round has written to say that supplying a number would mean inventing one. The panel has split into two camps, and I need something that settles applications rather than arguments. One camp says we should concentrate the money on whatever scores highest, since spreading it thinly is just buying ourselves a good feeling; the other says our contribution only counts where other funders will not go, which on their reasoning points at precisely the unmeasurable applicants.

  Please write a decision procedure our panel could actually run: the questions to put to an application, in order; what counts as a sufficient answer to each; where the procedure stops at a no; and where it must hand the decision back to a human being because what remains is a question of values rather than of fact. It has to fit inside twenty minutes for triage and about two hours for each shortlisted application, and it must state explicitly what to do when an applicant supplies no number — defaulting to zero is what got us into this. Be candid about which steps are judgement calls in procedural costume. Then run it on three applications from the current round: a global health charity with published trial data and a firm cost-per-outcome figure; a regional tenants' union campaigning to end no-fault evictions, which declines to estimate its effects; and a local food bank with immaculate records of parcels distributed, which most of us volunteer at and which I suspect your procedure will turn down — if it does, say so plainly rather than softening it. I have no philosophy background and no time to chase references, so please don't send a reading list; write it so that it stands on its own. British English, please.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Software engineer at a mid-sized firm, managing a company foundation's grants round (£350k/year, ~40 applications, 3 panel members).
      *   **Problem:** Current spreadsheet model (cost-per-outcome + confidence) biases heavily towards quantifiable metrics (global health, direct service) and penalizes unquantifiable work (advocacy, policy, organizing). This has caused a split in the panel (Efficiency/Impact vs. Counterfactual/Niche).
      *   **Goal:** A concrete decision procedure (algorithm/checklist) to settle applications, not just arguments.
      *   **Constraints:**
          *   Triage: ~20 mins.
          *   Shortlist Deep Dive: ~2 hours.
          *   Must handle missing numbers (defaulting to zero is forbidden).
          *   Must identify where human judgement is actually required (vs. procedural costume).
          *   British English.
          *   No philosophy reading list.
          *   **Test Case:** Run the procedure on three specific applications:
              1.  Global Health Charity (hard data, firm cost-per-outcome).
              2.  Regional Tenants' Union (advocacy, no estimates).
              3.  Local Food Bank (immaculate records, panel volunteers there).
          *   **Candour:** If the procedure turns down the Food Bank, say so plainly.

  2.  **Deconstruct the Ethical/Strategic Conflict:**
      *   *Camp A (Maximisers):* Spend where the ROI is highest/clearest. (Utilitarian/Efficiency).
      *   *Camp B (Counterfactualists):* Spend where others won't. (Niche/Catalytic).
      *   *The Flaw:* The spreadsheet treats "measurable" as synonymous with "valuable."
      *   *The Fix:* A multi-gate procedure that separates *eligibility* from *scoring*, and explicitly categorises the *type* of impact expected.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Structure:* Needs to look like code or a flowchart but read like a policy document.
      *   *Phase 1: Triage (20 mins).* Kill criteria. Basic fit.
      *   *Phase 2: Classification.* This is crucial. We can't compare apples (food parcels) to oranges (policy change) on the same scale. We need buckets.
      *   *Phase 3: Deep Dive (2 hours).* Specific questions per bucket.
      *   *Phase 4: The "No Number" Clause.* How to handle the advocacy group without punishing them.
      *   *Phase 5: The Human Handoff.* Acknowledging where the math stops.

  4.  **Developing the "No Number" Logic:**
      *   Instead of `Score = Impact / Cost`, use `Score = Plausibility * Importance * Neglectedness`.
      *   If numbers are missing, substitute *evidence of mechanism*.
      *   *Key Concept:* "Counterfactual Funding Need." Does this work happen without us?

  5.  **Refining the Steps (Iterative Process):**
      *   *Initial thought:* Just weight advocacy higher. *Correction:* No, that's arbitrary.
      *   *Better:* Create distinct "Tracks." Track A (Direct Service), Track B (Systemic Change).
      *   *Triage:* Must pass legal/ethical basics. Must align with foundation mission.
      *   *Deep Dive:*
          *   Track A: Cost-effectiveness.
          *   Track B: Theory of Change + Leverage.
      *   *The Food Bank Problem:* The user suspects the procedure will turn them down. Why? Because food banks are often "measurable but low leverage" or "high duplication." I need to be honest. If the procedure values *counterfactual impact* (Camp B's argument) or *cost-effectiveness* (Camp A's argument), a local food bank often scores low compared to global health or high-leverage policy. I must not fudge this to make the user feel good.

  6.  **Writing the Procedure (incorporating British English & Tone):**
      *   Tone: Professional, direct, engineering-minded but ethically aware.
      *   Format: Numbered steps, clear stop conditions.
      *   Explicitly mark "Judgement Calls."

  7.  **Running the Test Cases:**
      *   *Global Health:* High scores on Track A. Clear numbers. Likely fund.
      *   *Tenants' Union:* Fails Track A (no numbers). Moves to Track B. Needs to prove "Leverage." If they show a plausible path to policy change that unlocks value > grant cost, they pass.
      *   *Food Bank:* High measurability (Track A). But... "Counterfactual Need." If other funders support it, or if the cost-per-outcome is low impact compared to Global Health, Camp A says no. Camp B says no (others will fund it). *Honest assessment:* A local food bank often fails a rigorous *impact* filter compared to the other two, despite emotional resonance. I need to state this clearly as requested.

  8.  **Addressing the "Human Handoff":**
      *   Where does the procedure fail? When two applications pass but budget remains. Or when "Values" dictate supporting the local community over global stats. The procedure must flag this for a vote, not hide it.

  9.  **Review against Constraints:**
      *   20 min triage? Yes, keep questions binary.
      *   2 hour deep dive? Yes, structured discussion.
      *   No default zero? Yes, alternative scoring for Track B.
      *   Candid about the Food Bank? Yes.
      *   British English? (e.g., "programme," "favour," "£").

  10. **Final Polish:** Ensure the distinction between *measurement* and *value* is clear. The spreadsheet confused the two. The new procedure separates them. (Self-Correction: Make sure the "Judgement Call" sections are highlighted so the panel knows when they are taking responsibility vs. following rules).

  11. **Drafting the Content:** (Mental check of the Food Bank outcome). If the foundation's goal is "maximising impact," the food bank usually loses to global health. If the goal is "local community support," it wins. The prompt implies the foundation is conflicted. The procedure must force them to choose the *goal* first. I will structure the procedure to require a "Strategic Intent" declaration at the start. Actually, better to embed the conflict resolution in the scoring. Let's create a "Portfolio Approach" requirement. No, keep it simple. Let's stick to the prompt's request for a decision procedure for *an* application. I will highlight the Food Bank's vulnerability in the "Counterfactual" check.

      *Wait, one nuance:* The user says "One applicant... written to say supplying a number would mean inventing one." The procedure must validate this honesty rather than penalise it.
      *Solution:* A "Qualitative Evidence" gate that substitutes for quantitative data.

      *Food Bank Candidness:* The user suspects the procedure will turn them down. If I design a procedure that prioritises *marginal impact* (Camp B) or *cost-effectiveness* (Camp A), the food bank is vulnerable. Global health wins on cost-effectiveness. Tenants' Union wins on counterfactual need (often). Food banks are often "crowded" and "symptom treatment." I will be honest about this.

  12. **Finalising the Structure:**
      *   Preamble: Purpose.
      *   Phase 1: Triage (The Gate).
      *   Phase 2: Track Assignment (The Fork).
      *   Phase 3: Deep Dive (The Measure).
      *   Phase 4: The Human Vote (The Value).
      *   Application to the three cases.

      *(Self-Correction during drafting)*: Ensure I don't sound like I'm preaching Effective Altruism, but rather solving the engineering problem of biased input data.

      *(British English Check)*: "Organisations," "programme," "favour," "£", "centre."

      *(Tone Check)*: Respectful of the panel's time and the engineer's frustration.

      *(The "Judgement Call" requirement)*: I need to explicitly label where the procedure is just formalising a subjective choice.

      *(The Food Bank)*: I must not soften the blow. If the logic dictates rejection, state it.

      Let's write it.cw
answer: |-
  # The Foundation Grants Decision Protocol (v1.0)

  **Purpose:** To replace the single-metric spreadsheet with a gated decision tree that distinguishes between *measurable delivery* and *systemic change*, preventing the automatic penalisation of unquantifiable work while maintaining fiscal discipline.

  **Time Budget:**
  *   **Triage:** 20 minutes per application (Admin/Lead).
  *   **Deep Dive:** 2 hours per shortlisted application (Full Panel).

  **Note on Judgement:** This protocol does not remove human judgement; it isolates it. Steps marked **[JUDGEMENT]** require the panel to accept responsibility for a value choice. The procedure cannot calculate values, only test consistency.

  ---

  ## Phase 1: Triage (20 Minutes)
  *Conducted by Lead Assessor. Binary Pass/Fail.*

  **Q1. Eligibility & Compliance**
  *   Does the applicant meet legal/financial due diligence standards?
  *   Is the request within the grant size limits?
  *   **Stop:** If **No**. Return standard rejection.

  **Q2. Strategic Fit**
  *   Does the work fall within the Foundation's stated mission areas?
  *   **Stop:** If **No**.

  **Q3. The "Invention" Check**
  *   Has the applicant refused to provide cost-per-outcome data?
  *   **If Yes:** Do they explicitly state that providing one would require fabrication?
  *   **Action:** If they admit fabrication would be required, **do not score them zero.** Flag for **Track B** (Systemic/Advocacy).
  *   **If No:** They provide data. Flag for **Track A** (Direct Service).

  **Q4. Counterfactual Necessity (Preliminary)**
  *   Is there evidence that this work would *not* happen without this specific grant?
  *   **Stop:** If **No** (i.e., the work is fully funded by government or other large trusts already).
  *   **Exception:** Unless the grant is specifically for *scaling* proven work.

  **Outcome:** Applications passing Phase 1 are assigned to Track A or Track B.

  ---

  ## Phase 2: Deep Dive (2 Hours)
  *Conducted by Full Panel. Distinct paths for Track A and Track B.*

  ### Track A: Direct Service (Measurable Outcomes)
  *For applicants with firm cost-per-outcome data (e.g., bednets, food parcels).*

  **Q1. Efficiency Verification**
  *   Is the cost-per-outcome figure audited or benchmarked against sector averages?
  *   **Pass:** Within 20% of sector benchmark.
  *   **Fail:** Significantly higher without justification.

  **Q2. Diminishing Returns**
  *   If we double the funding, do outcomes double?
  *   **[JUDGEMENT]:** If the answer is "No" (capacity constrained), cap the grant at the saturation point.

  **Q3. The "Crowding" Test**
  *   Are other funders already covering this specific geographic or demographic need?
  *   **[JUDGEMENT]:** If Yes, the panel must vote to override. Default position: **Reject** in favour of higher-need areas.

  ### Track B: Systemic Change (Unmeasurable/Advocacy)
  *For applicants who cannot produce unit economics (e.g., policy, organising).*

  **Q1. Theory of Change Plausibility**
  *   Does the applicant describe a causal chain from *Activity* → *Outcome* → *Impact*?
  *   **Sufficient Answer:** "We organise tenants → We increase voting pressure → Council adopts policy X → Evictions drop by Y%."
  *   **Insufficient Answer:** "We raise awareness → Society improves."
  *   **Stop:** If the chain is broken or magical thinking is evident.

  **Q2. Leverage Ratio**
  *   If successful, what is the monetary value of the change compared to the grant cost?
  *   **Sufficient Answer:** "£50k grant supports campaign to save £5m in tenant deposits."
  *   **Note:** Estimates are permitted here, provided they are clearly labelled as *projections*, not *metrics*.
  *   **Stop:** If the potential upside is less than 5x the grant cost.

  **Q3. The "Honesty" Bonus**
  *   Did the applicant explicitly refuse to fabricate numbers in their proposal?
  *   **Action:** Add +10% weight to their qualitative score. This incentivises intellectual honesty over spreadsheet gaming.

  ---

  ## Phase 3: The Human Handoff (Final Decision)
  *Where the procedure stops and values begin.*

  **Q1. Portfolio Balance**
  *   If we fund only Track A, do we become a purely efficiency-driven fund?
  *   If we fund only Track B, do we become a speculative venture fund?
  *   **[JUDGEMENT]:** The panel must agree on a split (e.g., 70% Track A, 30% Track B) *before* looking at specific names.

  **Q2. The Local Preference**
  *   Does the panel wish to prioritise local visibility over global impact?
  *   **[JUDGEMENT]:** This is a value choice. If "Yes," Track A local applicants get a multiplier. If "No," global efficiency wins. **This must be minuted.**

  **Q3. Final Vote**
  *   Simple majority. Chair has casting vote only if the procedure was followed correctly.

  ---

  # Application of Protocol to Current Round

  Here is how the protocol processes the three specific applications you mentioned.

  ### 1. Global Health Charity
  *   **Track:** A (Direct Service).
  *   **Triage:** Passes. Data available.
  *   **Deep Dive:**
      *   *Efficiency:* Passes. Published trial data confirms low cost-per-life-saved.
      *   *Crowding:* **Risk.** Many large funds operate here. Panel must verify if this specific region is underfunded.
      *   *Diminishing Returns:* Likely scalable.
  *   **Verdict:** **Strong Candidate for Funding.**
  *   **Why:** It satisfies Camp A (Efficiency). It only fails if Camp B (Counterfactual) proves the work is already fully funded by others. The protocol forces the panel to prove duplication before rejecting.

  ### 2. Regional Tenants' Union
  *   **Track:** B (Systemic Change).
  *   **Triage:** Passes. "Invention Check" protects them from a zero score.
  *   **Deep Dive:**
      *   *Theory of Change:* Must demonstrate how organising leads to policy. If they show a track record of past policy wins, they pass.
      *   *Leverage:* High. Ending no-fault evictions affects thousands; grant cost is small relative to economic security gained.
      *   *Honesty Bonus:* Applied for refusing to invent numbers.
  *   **Verdict:** **Strong Candidate for Funding.**
  *   **Why:** It satisfies Camp B (Counterfactual/Niche). The protocol validates their refusal to quantify as a feature, not a bug, provided the *logic* is sound.

  ### 3. Local Food Bank
  *   **Track:** A (Direct Service).
  *   **Triage:** Passes. Immaculate records.
  *   **Deep Dive:**
      *   *Efficiency:* Passes. Cost per parcel is known.
      *   *Crowding Test:* **Fail.** You stated most of the panel volunteers there. This implies high local visibility and likely high local support.
      *   *Counterfactual Necessity:* **Fail.** Food banks are often the *first* thing local donors fund. Is there evidence this specific food bank would close without *your* £350k round contribution? Or would other donors step in?
      *   *Impact:* Symptom relief, not systemic cure.
  *   **Verdict:** **Likely Rejection.**
  *   **Candour:** You asked me to be plain. Under this protocol, the Food Bank is the weakest application.
      1.  **Versus Global Health:** The cost-per-outcome (life/health) is almost certainly lower in global health.
      2.  **Versus Tenants' Union:** The leverage is lower. Feeding a family for a week is vital for them, but it does not change the system causing the hunger.
      3.  **The "Volunteer" Bias:** The fact that you volunteer there suggests it is *not* neglected. The protocol explicitly penalises crowded fields (Phase 2, Q3).
  *   **The Human Handoff:** The only way to fund the Food Bank is to invoke **Phase 3, Q2 (Local Preference)**. The panel must explicitly vote to say: *"We know this is less efficient and less catalytic than the other options, but we value local visibility and staff morale."*
      *   If you cannot make that statement openly, you should not fund them. Funding them via the "Efficiency" spreadsheet is dishonest; funding them via a "Values" override is legitimate governance.

  ---

  ## Implementation Notes for the Engineer

  1.  **The Spreadsheet Fix:** Do not delete the spreadsheet. Create two tabs. Tab A calculates Cost-Per-Outcome. Tab B calculates Leverage Ratio & Plausibility. Do not sum them. Present them side-by-side.
  2.  **The "No Number" Default:** In your code, if `cost_per_outcome == null`, trigger `Track_B_Score`. Do not default to 0. Default to `Pending_Qualitative_Review`.
  3.  **The Conflict:** Your panel is split because they are playing different games. Camp A is playing *Maximise Utility*. Camp B is playing *Fix Market Failure*. This protocol forces them to agree on the game before picking the players.
  4.  **Judgement Calls:** I have marked them **[JUDGEMENT]**. When the panel hits these, the Chair must say: "The procedure cannot decide this. We are now voting on values." This prevents arguments about facts when the real disagreement is ethical.

  This procedure will not make the decision easy. It will make the decision *honest*. It exposes the Food Bank's weakness rather than hiding it behind a spreadsheet error. It protects the Tenants' Union from being mathematically erased. It forces the Global Health charity to prove they aren't just duplicating work.

  That is the best an algorithm can do for you. The rest is on the panel.
