answer: |-
  Your hypothesis is elegant, but I believe it is incorrect. It locates the fault line in the *purpose* of explanation (epistemic entitlement vs. pragmatic informativeness), whereas the real stalemate is ontological. The two sides are not answering different questions about the same thing; they are making incompatible claims about what *causality itself is*.

  Here is the diagnosis, the critique of your hypothesis, and a proposal for how your department can move from an uneasy peace to a justified dualism.

  ### 1. Critique of Your Hypothesis

  You suggest the covering-law side asks "What entitles this to be called knowledge?" while the narrative side asks "What makes this informative to an audience?" This distinction is too clean.

  *   **The Covering-Law Side is also Pragmatic:** Hempel explicitly acknowledged "explanation sketches." He conceded that historical accounts are elliptical because supplying the full law would be tedious, not because the knowledge claim is different. They believe the *ideal* form is nomological, even if the *practice* is pragmatic.
  *   **The Narrative Side is also Ontological:** The process-tracers in your department are not merely satisfying an audience's curiosity. They claim to have found the *actual* chain of production. When a historical sociologist traces a revolution through archival documents, they are not saying, "This story fits your expectations." They are saying, "This is how the gears turned." They claim truth, not just utility.
  *   **The Shared Premise is False:** You claim both sides share the premise that "explanation is a relation between a set of sentences and a sentence reporting a single event." The narrative side explicitly rejects this. For scholars influenced by White, Gallie, or even Weberian *Verstehen*, the "event" is not a pre-linguistic given waiting to be covered by a law; the event is *constituted* by the narrative configuration. The regression side treats the event (the data point) as fixed and independent of the model. This is not a shared premise; it is the first point of divergence.

  ### 2. The Real Fault Line: Regularity vs. Connection

  The stalemate persists because both sides use the word "cause" but refer to distinct metaphysical relations.

  *   **The Regression Side (Regularity):** Causality is a property of **populations**. It is defined by counterfactual dependence across units (if $X$ had been different, $Y$ would be different, on average). This is Humean. It requires no understanding of *how* $X$ produces $Y$, only that they covary robustly under controls. An explanation is successful if it reduces residual variance.
  *   **The Case-Study Side (Connection/Production):** Causality is a property of **processes**. It is defined by continuous spatio-temporal connections (entities and activities interacting). This is closer to Salmon's causal processes or Machamer-Darden-Craver mechanisms. An explanation is successful if it opens the "black box" to show the transmission of force, information, or resources.

  **The Stalemate:** The regression side views the case-study side as anecdotal (lacking external validity/regularity). The case-study side views the regression side as superficial (correlational/black-boxed). They talk past each other because one defines explanation as **subsumption under a distribution**, and the other defines it as **disclosure of a machinery**.

  ### 3. The "Mechanism" Trap

  You ask if the current "mechanist and process-tracing vocabulary" inherits one side's commitments. It does worse: it obscures the conflict.

  "Mechanism" is a false friend.
  *   To the quantitative scholar, a mechanism is a **mediating variable** ($X \to M \to Y$). It is still a statistical relation, just more granular.
  *   To the qualitative scholar, a mechanism is a **narrative of action** (Agent $A$ perceived $P$, desired $D$, and executed $E$).

  When your department uses the word "mechanism" to grade both types of work as excellent, you are papering over a category error. You are treating a statistical path coefficient and a archival trace of a decision-making process as equivalent epistemic goods. They are not. One establishes *that* a relationship exists across a population; the other establishes *how* a relationship occurred in a specific instance.

  ### 4. Was the Dispute Dissolved or Stalled?

  It was neither dissolved nor resolved; it was **suppressed by methodological pluralism**.

  The philosophy of social science moved away from grand unified theories (like Hempel's) toward "practice turn" accounts (what do scientists actually *do*?). This allowed your department to say, "We do both," without specifying how they fit together. This is a pragmatic settlement, not a philosophical one.

  However, this suppression is costly. It prevents cumulative knowledge. If the regression says "Democracy causes Peace" (on average) and the case study says "In 1914, democratic institutions failed to prevent War because of specific alliance commitments," there is no formal rule for adjudicating the tension. Is the case study an outlier? Is the regression misspecified? Without a unified causal ontology, you cannot know.

  ### 5. Actionable Progress: A Proposal for Your Department

  You asked for something your department could deploy. Do not try to unify the logic of explanation. You will fail. Instead, **unify the language of inference while bifurcating the object of study.**

  Adopt the distinction between **Effects of Causes (EoC)** and **Causes of Effects (CoE)**. This is a formal distinction in causal inference (championed by Gelman, Imelman, and others) that maps perfectly onto your departmental split.

  *   **Pooled Regressions estimate Effects of Causes:** "What is the average change in $Y$ if we intervene on $X$ across this population?" This requires the covering-law logic (generalizability, identification).
  *   **Single-Case Accounts estimate Causes of Effects:** "What specific factors were responsible for producing *this* observed value of $Y$ in *this* specific case?" This requires the process-tracing logic (conjunctural causation, necessity/sufficiency within a case).

  **The Deployment:**

  1.  **Stop grading them on the same rubric.**
      *   Grade regressions on **Identification and External Validity**. (Is the counterfactual across cases credible? Does the law hold?)
      *   Grade case studies on **Internal Validity and Specificity**. (Is the chain of evidence complete? Are the alternative narratives ruled out *within* this case?)
      *   Explicitly tell students: "You are answering different causal questions. Do not apologize for lacking the other side's strength."

  2.  **Formalize the Counterfactual Commitment.**
      *   Require the regression side to state their counterfactual: "What population are you comparing this to?"
      *   Require the case-study side to state their counterfactual: "What would have had to happen differently in *this* timeline for the outcome to change?" (This forces the narrative side to move beyond "just a story" into causal claims).
      *   This creates a shared language (counterfactuals) without forcing a shared ontology (regularity vs. connection).

  3.  **The "Permanent Settlement" Argument.**
      *   Teach students that **Causal Heterogeneity** is the norm in sociology, not the exception.
      *   If causal mechanisms are heterogeneous (i.e., $X$ causes $Y$ via Mechanism A in Context 1, and via Mechanism B in Context 2), then pooled regressions will only capture the *average* effect (which may be zero), and single cases will only capture the *local* effect.
      *   Therefore, the coexistence of the two practices is not a temporary philosophical confusion; it is a **necessary division of labor** for studying complex social systems. You need regressions to find the stable regularities (where mechanisms are uniform) and case studies to map the heterogeneity (where mechanisms differ).

  ### Summary Diagnosis

  The stalemate is not about explanation; it is about **causal ontology**. The regression side believes causality is a property of distributions (Humean). The case-study side believes causality is a property of processes (Productive).

  Your hypothesis that they are asking different questions (epistemic vs. pragmatic) is a symptom of this deeper divide, not the cause. The progress lies in admitting that "causality" is an ambiguous term in social science. By formally distinguishing **Effects of Causes** (quant) from **Causes of Effects** (qual), you can justify the coexistence of the two practices not as a philosophical compromise, but as a rigorous response to the complexity of the social world.

  Tell your colleagues: We are not failing to agree on what explanation is. We are successfully managing two different tools for two different causal tasks. Stop trying to merge them; start teaching the translation manual.
