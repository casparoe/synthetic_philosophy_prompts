          2.  **Program Equilibrium:** Tennenholtz's work. If agents can read code, cooperation is a Nash Equilibrium. This formalizes "superrationality" without magic.
          3.  **Dissolution:** If we accept "Logical Decision Theory," the dispute dissolves. If we stick to CDT, it remains.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction on Platonia:* In Platonia, if everyone uses $p=1/20$ independently, the chance of winning is $(19/20)^{19} * (1/20) \approx 0.018$. If they could correlate perfectly (take turns), it would be $1/20 = 0.05$. Superrationality claims the *reasoning* provides the correlation. The Friend says that's impossible without communication. This is the empirical/metaphysical hinge.
      *   *Correction on PD:* In one-shot PD, MSNE is still Defect. So Superrationality is doing *more* work in PD than Platonia. In Platonia, it's refining the equilibrium selection. In PD, it's overturning the dominant strategy. This confirms they are different disputes.
      *   *The "Label" Charge:* Is Superrationality just EDT? EDT says $P(Other=C | I=C)$ is high. Superrationality says it's 1 (or near 1) due to logical identity. EDT allows spurious correlation (e.g., common cause). Superrationality demands logical entailment. This is a substantive difference.

  6.  **Structuring the Response:**
      *   **Diagnosis:** Metaphysics of Counterfactuals (Causal vs. Logical).
      *   **Verbal vs. Substantive:** Substantive, centered on "Independence."
