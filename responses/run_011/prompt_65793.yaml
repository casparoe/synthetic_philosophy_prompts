      *   **EDT Relation:** Superrationality is a subset/grounding of EDT, not identical.
      *   **Path to Progress:** Program Equilibrium, Logical Decision Theory, Asymmetric tests.
      *   **Residue:** If no progress, the residue is the definition of "Agent."

  7.  **Final Polish:** Ensure tone is analytical, not taking sides, but clarifying the geometry of the disagreement. Use the user's terminology (admissible epistemic states, dominance, etc.). Make sure to answer the "What counts as progress" section specifically.

      *(Self-Correction during drafting)*: I need to be careful not to just say "Read Yudkowsky/Soares." The user wants a diagnosis of *this* impasse, not a bibliography. Focus on the logical structure of their arguments.
