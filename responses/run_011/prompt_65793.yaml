      *   **The Positions:**
          *   *Friend (Causal/Dominance):* Defecting dominates. Superrationality confuses correlation with control (magical thinking). If not magical, it's just Evidential Decision Theory (EDT) in symmetric games (a label, not a discovery).
          *   *User (Superrational/Epistemic):* Dominance begs the question (assumes only causal dependence matters). Claims certain joint epistemic states are inadmissible for alike players. Points to the Platonia Dilemma (trillionaire/telegram) where dominance fails but symmetry/randomization works.
          *   *Other Camps:* Empirical claim (how similar are reasoners?) vs. Metaphysical claim (agents as copies).
      *   **The Questions:**
          *   What kind of disagreement is this? (Substantive/Normative vs. Verbal).
          *   If verbal, over which term? Where do readings come apart?
          *   Is the crux about admissible epistemic states, connection of reasons to action, or empirical transparency?
          *   Are PD and Platonia the same dispute or two run together?
