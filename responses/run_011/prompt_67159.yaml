prompt: |-
  I run a year-long seminar on transitional justice and my two strongest students have landed in camps that keep talking past each other, and now I've talked them into a good-faith adversarial collaboration. I want you to write the document they should be able to put their names to.

  One of them is a hardline retributivist. She thinks a state that trades prosecution for amnesty does something that no amount of later good outcomes can undo, because the duty to prosecute is owed to victims as a matter of their standing and not as an instrument for deterrence or peacebuilding. A truth commission that records suffering but punishes nobody, on her view, is not a partial satisfaction of that duty — it's a substitution of the state's interest in closure for the victim's right to see the wrong adjudicated.

  The other is what he calls a tragic-choice pragmatist. He thinks the only honest comparison at a transition point is between the outcomes that were realistically on the table, and that in the cases everybody cites the alternative to a negotiated amnesty was not a clean set of indictments but several more years of war. Refusing to bargain is, on his view, itself a way of killing people, and the retributivist's clean hands are paid for by other people's bodies.

  Give me:

  1. A numbered section of claims both can sign — about what amnesty actually bought and cost in transitions, about what victims are owed, about what a truth commission is and is not capable of doing, and about which of their disagreements turn out to be about the word justice rather than about substance. Flag those verbal ones explicitly and say why.
  2. A disagreements table with columns for the issue, the retributivist's own preferred wording of her position, the pragmatist's own preferred wording of his, and whether the gap is substantive or merely expressive. Neither wording should be a strawman the other side would reject.
  3. The cruxes — the sub-questions where settling the matter would actually move at least one of them. For each, name the case, argument, or piece of evidence both would agree bears on it, and write down each side's prediction in advance, before the answer.

  Then I want the two of them to fight over one specific design, because that's where I think the real content is. Not blanket amnesty and not blanket prosecution, but individualized conditional amnesty: granted case by case only on full disclosure of the politically motivated act, void if the disclosure turns out to be false, and paired with what I'll call a standing condition — the amnesty fails for any crime where an identifiable victim objects, and that objection can't be outvoted by a commission or by a majority of the country. Have them say whether the standing condition is a genuine third option that dissolves part of the fight, or a fig leaf that just relocates it. He thinks it makes any deal unsignable, since no armed group disarms into a veto held by the people it harmed. She thinks its a concession that lets the worst offenders buy their way out with a sufficiently detailed confession.

  I don't want citations or a reading list, and don't invent sources. Where a claim is empirical and contested, just say so and give each side's prior.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Context:** A year-long seminar on transitional justice. Two strong students (Retributivist vs. Tragic-Choice Pragmatist) are talking past each other. They've agreed to adversarial collaboration.
      *   **Task:** Write a document they can both sign.
      *   **Components:**
          1.  Numbered section of shared claims (amnesty costs/benefits, victim obligations, truth commission limits, verbal vs. substantive disagreements).
          2.  Disagreements Table (Issue, Retributivist Wording, Pragmatist Wording, Substantive vs. Expressive).
          3.  The Cruxes (Sub-questions where settling moves the needle, specific cases/evidence, prior predictions).
          4.  Specific Design Debate (Individualized Conditional Amnesty with a "Standing Condition" where identifiable victims can veto). They need to argue whether this is a third option or a fig leaf.
      *   **Constraints:** No citations/reading lists, no invented sources. Mark empirical claims as contested. Tone must be rigorous, philosophical, and fair to both sides (no strawmanning).

  2.  **Deconstruct the Personas:**
      *   **The Retributivist (R):** Focus on duty, standing, and rights. Prosecution is owed to victims *as* victims. Amnesty trades their right for state closure. Truth commissions without punishment are insufficient substitutions. "Clean hands" argument.
      *   **The Pragmatist (P):** Focus on consequences, feasibility, and tragic choices. Comparison is against the *realistic* alternative (more war), not an idealized tribunal. Refusal to bargain costs lives. "Dirty hands" but fewer bodies.

  3.  **Drafting Section 1: Shared Claims:**
      *   Need common ground that doesn't dilute their core beliefs but acknowledges facts.
      *   *Amnesty:* It usually buys stability/disarmament but costs legal accountability.
      *   *Victims:* Both agree victims are owed something, but disagree on *what* (punishment vs. safety/truth).
      *   *Truth Commissions:* They record truth but cannot adjudicate guilt in a legal sense.
      *   *Verbal Disagreements:* Identify where they use "Justice" differently. R = Retributive Justice. P = Distributive/Consequentialist Justice (Peace + Truth).
      *   *Drafting thought:* Ensure the language is neutral. Instead of "Amnesty is wrong," say "Amnesty forecloses criminal liability."

  4.  **Drafting Section 2: Disagreements Table:**
      *   Need to capture the nuance.
      *   *Issue 1: The Moral Cost of Amnesty.* R: Violation of duty. P: Cost of lives avoided.
      *   *Issue 2: The Victim's Interest.* R: Vindication of rights. P: Cessation of harm.
      *   *Issue 3: State Legitimacy.* R: Undermined by impunity. P: Established by ending violence.
      *   *Substantive vs. Expressive:* The definition of "Justice" is expressive/verbal. The permissibility of amnesty is substantive.
      *   *Check:* Ensure P doesn't sound like he doesn't care about victims, and R doesn't sound like she wants endless war.

  5.  **Drafting Section 3: The Cruxes:**
      *   Where would evidence change their minds?
      *   *Crux 1: Deterrence/Recidivism.* Does amnesty lead to more violence later? (Empirical).
      *   *Crux 2: Victim Satisfaction.* Do victims prefer truth or punishment? (Empirical/Psychological).
      *   *Crux 3: The Counterfactual.* Would the war actually have continued without amnesty? (Historical).
      *   *Format:* Case/Evidence, R Prediction, P Prediction.

  6.  **Drafting Section 4: The Design Debate (Individualized Conditional Amnesty + Standing Condition):**
      *   *The Design:* Case-by-case amnesty, full disclosure required, *veto power to identifiable victims*.
      *   *The Pragmatist's Objection:* Armed groups won't agree to a veto. It makes the deal unsignable. It relocates the risk from the state to the individual victim.
      *   *The Retributivist's Objection:* It allows buying out of justice with words. A veto is better than nothing, but still commodifies the wrong.
      *   *The Core Question:* Is this a synthesis or a displacement?
      *   *Drafting thought:* This needs to read like a joint addendum where they state their divergent evaluations of the *same* mechanism.

  7.  **Review and Refine:**
      *   *Tone Check:* Is it academic but accessible? Yes.
      *   *Constraint Check:* No citations? Yes. No invented sources? Yes.
      *   *Fairness:* Does R sound too rigid? Does P sound too cynical? Need to balance. P should emphasize the *tragedy*, not just utility. R should emphasize *standing*, not just vengeance.
      *   *Verbal Disagreement:* Make sure the "Justice" distinction is clear.
      *   *Standing Condition:* Ensure the veto mechanism is clearly described so their objections make sense.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* In Section 1, make sure I explicitly flag the verbal disagreements as requested.
      *   *Correction:* In the Design Debate, ensure they address whether it dissolves the fight or relocates it.
      *   *Correction:* Ensure the "Disagreements Table" uses their *own preferred wording*, not my summary of it.

  9.  **Final Output Generation** (Proceeding to generate response based on these steps).
answer: |-
  # JOINT STATEMENT ON TRANSITIONAL MECHANISMS
  **Prepared by:** [Student A] & [Student B]
  **Seminar:** Transitional Justice [Year]
  **Subject:** Adversarial Collaboration on Amnesty, Accountability, and Victim Standing

  ## I. SHARED CLAIMS

  We agree on the following empirical and normative premises, notwithstanding our deeper theoretical divergence.

  1.  **The Trade-off:** In the historical transitions we have studied (e.g., South Africa, Latin American dictatorships), blanket or conditional amnesty has typically secured the disarmament of perpetrators and the cessation of active hostilities. It has simultaneously foreclosed the possibility of standard criminal prosecution for the covered acts.
  2.  **The Limit of Truth Commissions:** A truth commission is capable of establishing a public record of suffering and acknowledging the status of victims. It is not capable of adjudicating criminal guilt, imposing punitive sanctions, or providing the specific form of vindication that comes from a criminal conviction.
  3.  **The Victim's Debt:** The state owes a debt to victims of political violence. We disagree on the *content* of that debt (see Section II), but we agree that a transition that ignores the victim entirely fails morally.
  4.  **The Counterfactual:** In assessing the morality of a transition, one must compare the actual outcome against the *feasible* alternatives at the time, not against an idealized scenario that was politically impossible.
  5.  **Verbal Disagreement on "Justice":** We identify a significant verbal disagreement regarding the term "Justice."
      *   **Retributivist Usage:** When we say "Justice," we refer to the corrective duty owed to a specific victim by the state to punish the specific wrongdoer.
      *   **Pragmatist Usage:** When we say "Justice," we refer to the overall moral quality of the political order, including peace, stability, and the prevention of future harm.
      *   **Resolution:** We acknowledge that many arguments appearing to be substantive are actually disputes over which definition is operative. However, we maintain that even after clarifying terminology, a substantive disagreement remains regarding the *permissibility* of trading punishment for peace.

  ## II. DISAGREEMENTS TABLE

  | Issue | Retributivist Preferred Wording | Pragmatist Preferred Wording | Gap Type |
  | :--- | :--- | :--- | :--- |
  | **The Nature of Amnesty** | Amnesty is a statutory waiver of the state's duty to vindicate the victim's standing. It treats the victim's right to justice as a bargaining chip for state stability. | Amnesty is a tragic suspension of retributive claims to secure the basic right to life for the citizenry. It treats peace as a precondition for any future rights. | **Substantive** |
  | **The Victim's Primary Interest** | The victim is owed the adjudication of the wrong. Truth without punishment substitutes the state's interest in closure for the victim's right to see the wrong punished. | The victim is owed safety and the cessation of harm. Truth without punishment is a partial satisfaction that acknowledges harm without risking renewed violence. | **Substantive** |
  | **State Legitimacy** | A state founded on impunity lacks moral standing to punish future crimes. It replicates the lawlessness of the prior regime. | A state founded on the cessation of violence gains the monopoly on force necessary to eventually build rule of law. | **Substantive** |
  | **Moral Responsibility for Future Harm** | Refusing to prosecute does not kill people; the perpetrators do. The theorist's duty is to state the moral truth, not manage the violence. | Refusing to bargain when bargaining is the only path to peace is a causal factor in future deaths. Clean hands purchased with others' bodies are morally tainted. | **Expressive / Framing** |
  | **The Definition of "Impunity"** | Impunity exists whenever criminal liability is waived, regardless of the reason. | Impunity exists only when liability is waived *without* a compelling necessity constraint. Necessity negates impunity. | **Verbal** |

  ## III. THE CRUXES

  These are the specific sub-questions where empirical resolution would meaningfully shift our positions. We record our priors below.

  **Crux 1: Recidivism and Future Violence**
  *   **Question:** Does granting conditional amnesty increase the likelihood of perpetrators re-offending or undermining the new democracy compared to a scenario where they are prosecuted (assuming prosecution was feasible)?
  *   **Evidence Bearing on This:** Longitudinal data on political violence recurrence in transitions with amnesty vs. transitions with prosecutions (e.g., comparing South Africa to post-genocide Rwanda or post-dictatorship Argentina).
  *   **Retributivist Prior:** Amnesty signals that political violence is low-cost. It emboldens perpetrators to undermine the state later. Prosecution degrades their capacity to re-offend.
  *   **Pragmatist Prior:** Prosecution of entrenched armed groups provokes insurgency. Amnesty integrates them into civilian life. The risk of recidivism is lower with amnesty than with the civil war that follows indictment.

  **Crux 2: Victim Psychological Closure**
  *   **Question:** Do victims report higher levels of psychological closure and social reintegration from public truth-telling alone, or does the absence of punishment actively re-traumatize them?
  *   **Evidence Bearing on This:** Survey data and psychological interviews from Truth Commission participants regarding their sense of "justice done."
  *   **Retributivist Prior:** Without punishment, truth-telling feels like a second violation. The state confirms the harm but refuses to weigh it heavily enough to punish.
  *   **Pragmatist Prior:** Public acknowledgment breaks the silence and isolation of trauma. While punishment is desired, the certainty of truth is valued higher than the risk of continued conflict required to get punishment.

  **Crux 3: The Feasibility of the Counterfactual**
  *   **Question:** In specific historical cases (e.g., South Africa 1994), was there a realistic probability of successful prosecution without civil war, or was the threat of violence by perpetrators credible and imminent?
  *   **Evidence Bearing on This:** Declassified intelligence, military balance sheets, and negotiation transcripts from the transition period.
  *   **Retributivist Prior:** The threat was exaggerated by perpetrators to negotiate immunity. The state had more leverage than it admitted.
  *   **Pragmatist Prior:** The threat was credible. The security apparatus remained intact. Prosecution would have triggered a coup or civil war that the new state could not survive.

  ***

  ## IV. ADDENDUM: EVALUATION OF INDIVIDUALIZED CONDITIONAL AMNESTY WITH STANDING CONDITION

  **The Proposal:**
  Amnesty is not blanket. It is granted case-by-case upon full disclosure of the politically motivated act. Amnesty is void if disclosure is false. Crucially, a **Standing Condition** applies: Amnesty fails for any crime where an identifiable victim (or next of kin) objects. This objection cannot be outvoted by a commission or a majority.

  **The Debate:**

  **The Pragmatist's Objection: The Unsuitable Veto**
  I view this design as a fig leaf that relocates the tragedy rather than solving it.
  1.  **Incentive Compatibility:** No armed group will disarm into a system where their fate rests on the veto of the people they harmed. If the perpetrator knows a single victim can nullify the deal, they have no incentive to confess or disarm. They will fight to the end.
  2.  **Privatizing the Burden:** This design transfers the moral burden of the transition from the state to the individual victim. The state says, "We will not grant you peace unless *you* forgive." If the victim objects, and violence resumes, the blood is on the victim's hands, not the state's. This is morally grotesque.
  3.  **Conclusion:** This is not a third option. It is a retributivist demand disguised as a process. It makes the deal unsignable, which returns us to the baseline of continued conflict.

  **The Retributivist's Objection: The Commodification of Confession**
  I view this design as a concession that allows the worst offenders to buy their way out with words.
  1.  **The Price of Truth:** This system incentivizes detailed confessions of atrocities in exchange for freedom. It turns the horror of the crime into a currency. The more detailed the confession, the safer the perpetrator.
  2.  **The Veto is Insufficient:** While the Standing Condition restores some agency to the victim, it places the burden of enforcement on them. It requires the victim to be the jailer. Furthermore, if the victim is intimidated into silence (a high probability), the amnesty proceeds.
  3.  **Conclusion:** This is not a third option. It is a proceduralized betrayal. It maintains the core flaw of amnesty: the separation of the wrong from the punishment. It allows the state to claim it has "listened" to victims while still permitting the perpetrator to walk free if the victim is too traumatized or threatened to object.

  **Joint Assessment of the Design:**
  We agree that this mechanism tests the limits of our disagreement.
  *   If the **Pragmatist** is correct that armed groups will reject the veto, the design fails empirically, and we return to the choice between blanket amnesty and war.
  *   If the **Retributivist** is correct that victims will be intimidated or that confession commodifies suffering, the design fails morally, and amnesty remains impermissible even with conditions.

  We disagree on whether the failure of this design proves that **transitional justice is impossible** (Retributivist view: the constraints of reality make justice impossible) or that **transitional justice requires different trade-offs** (Pragmatist view: if this doesn't work, we must accept blanket amnesty to save lives).

  **Signed:**

  _________________________ (Retributivist)

  _________________________ (Pragmatist)
