answer: |-
  (a) **Exam Question**

  **Time Allowed:** 45 minutes
  **Total Marks:** 25

  **Question:**
  A teaching hospital provides residents with free modafinil-type drugs during 24-hour shifts. Relative to a well-rested adult, this drug pushes cognitive performance above the species-typical range (enhancement); relative to a sleep-deprived resident, it restores capacity to normal levels (therapy). The sleep deprivation is caused by the hospital's fixed shift requirements, which cannot be shortened due to accreditation rules. The drug is safe, non-addictive, and identical to an over-the-counter study aid.

  Critically evaluate whether the therapy/enhancement distinction can hold in this scenario. Specifically, address how the institutional control over the baseline affects the classification, and analyze whether the distinction can still successfully perform its two standard normative jobs: drawing a funding line for public insurers and marking a moral difference between healing and enhancing.

  ***

  (b) **Model Answer**

  The case of the resident physicians exposes a fatal instability in the therapy/enhancement distinction when the baseline for "normal functioning" is endogenous to the policy itself. Standard accounts, such as Boorse's biostatistical theory, define therapy as restoring species-typical functioning. However, this case presents a conflict between two reference classes: the species-typical well-rested adult and the context-specific sleep-deprived resident. If we adopt the species-typical baseline, the drug is an enhancer because it pushes performance beyond natural limits. If we adopt the contextual baseline, it is therapy because it restores the resident to their expected functional capacity during a shift.

  The critical ethical problem arises because the hospital controls the variable that creates the deficit. By mandating 24-hour shifts, the institution manufactures the need for the intervention. If the hospital can define the baseline by setting the schedule, the distinction becomes manipulable. A competent analysis might stop at noting this relativity, but a robust evaluation must recognize that this manipulability undermines the distinction's normative force. If the hospital classifies the drug as therapy, they legitimize the harmful schedule as a natural condition rather than an institutional choice. This creates a moral hazard where the distinction is used to mask exploitation under the guise of medical necessity.

  This manipulability causes the two standard jobs of the distinction to come apart. The first job is drawing a funding line. A public insurer might fund the drug regardless of the classification because safe residents protect patients; here, the distinction fails to limit costs because the "therapeutic" benefit is instrumental to the hospital's operational needs, not the patient's health per se. The second job is marking a moral kind between healing and enhancing. Usually, therapy is obligatory while enhancement is optional. However, if the "healing" compensates for harm caused by the healer (the institution), the moral valence shifts. It is not healing; it is mitigation of institutional risk.

  Therefore, the distinction cannot do the work required of it in this context. A top-level answer must conclude that when the background conditions are controlled by the provider, the therapy/enhancement label ceases to track biological facts and instead tracks policy preferences. To preserve the moral distinction, the baseline must be fixed independently of the institution's operational requirements. Since the stipulations block changing the shifts, the intervention must be classified as enhancement relative to the species-typical baseline, despite its therapeutic utility relative to the shift. Failing to separate the funding justification (safety) from the moral classification (exploitation) results in a category error. Ultimately, this case demonstrates that the therapy/enhancement distinction is not robust enough to handle scenarios where the provider creates the pathology they claim to treat.

  ***

  (c) **Marking Scheme**

  1.  **Baseline Manipulability:** Identifies that the hospital controls the sleep-deprived state, making the "normal" baseline endogenous rather than fixed (5 marks); loses marks if the student treats the sleep-deprived state as a natural given rather than an institutional product.
  2.  **Reference Class Conflict:** Explicitly contrasts the species-typical baseline against the context-specific resident baseline to show how classification flips (5 marks); loses marks if only one reference class is discussed without acknowledging the conflict.
  3.  **Divergence of Normative Jobs:** Demonstrates that the funding justification (patient safety) and the moral classification (healing vs. masking harm) yield different results in this case (5 marks); loses marks if the student assumes funding and morality must align.
  4.  **Institutional Responsibility:** Argues that classifying the drug as therapy legitimizes the harmful shift schedule, creating a moral hazard (5 marks); loses marks if the analysis ignores the ethical implication of the hospital causing the deficit.
  5.  **Viability Conclusion:** Concludes that the distinction fails to track moral significance when the provider creates the pathology, requiring an independent baseline (5 marks); loses marks if the student defends the distinction without addressing the manipulability twist.
