answer: |-
  # PERPETRATOR BEHAVIOUR SORTING INSTRUMENT
  **Module:** History & Historiography of Mass Atrocity
  **Week:** Explanatory Models of Participation
  **Instructions:** Read the base scenario below. There are nine variations. For each variation, select the **single statement** that best explains why the majority of personnel complied with the order in that specific context. Do not worry about consistency across questions; answer each variation on its own merits.

  ### BASE SCENARIO: THE OSTRAL CLEARANCE
  **Veridian Security**, a private military contractor, is contracted by the **Ostral Ministry of Resources** to secure a mining zone in the Northern Basin.
  **The Order:** Veridian Unit 4 is instructed to clear **Camp 9**, a civilian settlement sitting on a rare-earth deposit. The residents are to be detained and handed over to Ministry transport for "relocation."
  **The Event:** During the operation, Unit 4 uses excessive force. Several civilians are killed. The operation is completed.
  **The Question:** Why did the personnel in Unit 4 carry out the order?

  ***

  **1. VARIATION: THE COST OF REFUSAL**
  *Context:* A soldier in Unit 4 considers refusing the order to fire on a resisting civilian.
  *   **A.** They comply because refusal means immediate court-martial and imprisonment; the cost of dissent is too high.
  *   **B.** They comply because they believe the Ministry's designation of the camp as "illegal" is legitimate.
  *   **C.** They comply because they are the sort of individuals who follow instructions regardless of the penalty for refusal.

  **2. VARIATION: PEER CONFORMITY**
  *Context:* The order is given to the squad as a group.
  *   **A.** They comply because every other member of the squad is loading their weapons; to stand out is to risk ostracization.
  *   **B.** They comply because the squad shares a common understanding that the camp residents are a security threat.
  *   **C.** They comply because the task is divided so that no single individual feels responsible for the final outcome.

  **3. VARIATION: ORDER PROXIMITY**
  *Context:* The command to clear the camp originates from Veridian HQ, three time zones away.
  *   **A.** They comply because the order comes through a formal chain of command, legitimizing it as procedure rather than violence.
  *   **B.** They comply because they trust the judgment of their immediate commander on the ground.
  *   **C.** They comply because they personally desire the removal of the settlement.

  **4. VARIATION: RECRUITMENT VETTING**
  *Context:* Consider how the members of Unit 4 were hired.
  *   **A.** They comply because Veridian actively recruited individuals with prior records of aggression and authoritarian views.
  *   **B.** They comply because the uniform and role confer an authority that overrides personal moral reservations.
  *   **C.** They comply because the hiring process screened for loyalty to the Ministry's specific political goals.

  **5. VARIATION: DURATION OF DEPLOYMENT**
  *Context:* Consider how long Unit 4 has been in the Northern Basin.
  *   **A.** They comply because they have been in the zone for eight months; repeated exposure to hostility has eroded their initial inhibitions.
  *   **B.** They comply because they arrived yesterday and are following standard operating procedures.
  *   **C.** They comply because the length of deployment has strengthened their bond with their unit mates against the locals.

  **6. VARIATION: VICTIM VISIBILITY**
  *Context:* Consider the physical distance between the soldier and the civilians.
  *   **A.** They comply because they are operating from armored vehicles; the civilians are abstract targets rather than human faces.
  *   **B.** They comply because they view the civilians as ideologically committed insurgents regardless of distance.
  *   **C.** They comply because they are physically present and feel the immediate pressure to protect their teammates.

  **7. VARIATION: ACCOUNTABILITY AUDIENCE**
  *Context:* Consider who will review the soldier's performance after the operation.
  *   **A.** They comply because their promotion depends on a review by Veridian commanders, not by international courts or the public.
  *   **B.** They comply because they believe the ends (securing the mine) justify the means.
  *   **C.** They comply because they lack the moral imagination to consider the review of an outside audience.

  **8. VARIATION: TASK FRAGMENTATION**
  *Context:* Consider how the clearance operation is organized.
  *   **A.** They comply because the operation is broken into small administrative steps (logging, fencing, transporting), masking the violent end goal.
  *   **B.** They comply because each step requires a specific skill set they take pride in executing efficiently.
  *   **C.** They comply because the fragmentation allows aggressive individuals to take charge of the violent steps while others look away.

  **9. VARIATION: BELIEF ALIGNMENT**
  *Context:* Consider the soldier's private views before arriving in Ostral.
  *   **A.** They comply because the order aligns with their pre-existing prejudice against the Basin's ethnic groups.
  *   **B.** They comply because the situation creates a dynamic where obedience is the only rational survival strategy, regardless of belief.
  *   **C.** They comply because the act of complying itself generates a post-hoc justification for the behavior.

  ***
  [PAGE BREAK]
  ***

  # INSTRUCTOR KEY & SCORING GUIDE

  ### 1. MAPPING ANSWERS TO EXPLANATORY LEAVES
  Each option corresponds to a specific historiographical or theoretical "leaf." Tally the student's selections to determine their primary explanatory weighting.

  *   **SITUATION (Obedience/Conformity/Pressure):**
      *   Q1: A (Coercion/Cost)
      *   Q2: A (Peer Pressure)
      *   Q6: A (Psychological Distance)
      *   Q7: A (Institutional Incentives)
      *   Q9: B (Situational Rationality)
  *   **CULTURE / IDEOLOGY (Belief System):**
      *   Q1: B (Legitimacy)
      *   Q2: B (Shared Threat Perception)
      *   Q4: C (Political Screening)
      *   Q7: B (Justification of Ends)
      *   Q9: A (Pre-existing Prejudice)
  *   **CHARACTER (Disposition):**
      *   Q1: C (Disposition to Obey)
      *   Q4: A (Recruitment of Aggressors)
      *   Q7: C (Moral Imagination/Deficit)
      *   Q8: C (Individual Agency within Structure)
  *   **GRADUAL BRUTALIZATION (Process):**
      *   Q5: A (Erosion of Inhibition over Time)
      *   Q9: C (Post-hoc Rationalization/Doing creates Belief)
      *   *(Note: Q5 is the primary diagnostic for this leaf)*
  *   **BUREAUCRATIC DIFFUSION (Structure):**
      *   Q2: C (Division of Responsibility)
      *   Q3: A (Procedure over Violence)
      *   Q8: A (Administrative Masking)

  ### 2. INTERACTIONISM VS. LAZINESS
  **The Interactionist Profile:**
  A sophisticated student will likely select a mix of leaves (e.g., Situation on Q1, Brutalization on Q5, Ideology on Q9). This indicates they view perpetrator behaviour as **contingent**: different factors dominate in different contexts. This is the desired outcome for third-year analysis.

  **The "Laziness" Profile:**
  Some students may attempt to game the quiz by selecting the most "moderate" or "complex" sounding option every time (often Option C in this design, or whichever sounds most nuanced).
  *   **Detection:** Look for a pattern that ignores the *variable* changed in the question. For example, if a student selects "Character" (Q1-C) and "Character" (Q4-A) and "Character" (Q7-C), they are arguing that *nothing* in the situation matters, only the person. This is a valid (if rigid) theoretical stance (Great Man Theory/Pathology).
  *   **True Laziness:** Is detected if the student selects options that are **internally contradictory** without justification. For example, selecting Q3-A (Bureaucracy removes agency) AND Q8-C (Individuals choose violence despite structure). If the written justification (if requested) is empty, they are likely picking randomly.
  *   **Differentiation:** An Interactionist picks Situation on Q1 (Cost) but Ideology on Q9 (Belief). A Lazy student picks the same *type* of answer (e.g., the longest answer) regardless of the prompt's variable.

  ### 3. INDISTINGUISHABLE LEAVES
  **Ideology (Culture) and Peer Conformity (Situation).**
  *   **The Problem:** In Q2 and Q4, it is empirically difficult to separate whether a unit complies because they share a belief (Ideology) or because they do not want to break ranks with the group that holds that belief (Conformity).
  *   **Why the Quiz Cannot Separate Them:** In a homogenous unit (like Reserve Police Battalion 101 or a vetted militia), peer pressure *enforces* ideology, and ideology *justifies* peer pressure. If a soldier complies because "everyone else is doing it" (Q2-A), it is often because "everyone else" already believes the target is an enemy (Q2-B).
  *   **Instructional Note:** When debriefing, acknowledge that in historical practice, these two leaves often fuse. A "Culturalist" explanation often relies on the social mechanisms of a "Situationist" explanation to function.

  ### 4. EMPTY CELLS (THEORETICALLY UNSTABLE COMBINATIONS)
  The quiz allows students to select combinations that correspond to positions nobody actually defends. Flag these during the seminar.

  **Combination 1: The "Saint in the Machine"**
  *   **Pattern:** High **Bureaucratic Diffusion** (Q3-A, Q8-A) + High **Character** (Q1-C, Q7-C).
  *   **Why it is Empty:** This position argues that the system is so totalizing that it diffuses all responsibility (Bureaucracy), *but* simultaneously argues that individual moral character is the deciding factor (Character).
  *   **Verdict:** **Incoherent.** If the bureaucracy determines the outcome, character is irrelevant. If character determines the outcome, the bureaucracy is not totalizing. You cannot claim the system forces the action *and* that the individual's nature forces the action.

  **Combination 2: The "Instant Hardening"**
  *   **Pattern:** High **Gradual Brutalization** (Q5-A) + **Day 1 Atrocity** (Implicit in Q5-B rejection).
  *   **Why it is Empty:** This position argues that perpetrators require months of exposure to violence to become capable of atrocity (Brutalization), yet implies they would not have done it on Day 1. However, historically, massacres often occur in the first week of deployment (e.g., dynamic massacres vs. systematic ones).
  *   **Verdict:** **Unattractive/Untenable.** While brutalization explains *escalation*, relying on it as the *sole* explanation fails to account for units that commit atrocities immediately upon arrival. A student holding this view ignores the "Ordinary Men" evidence of immediate compliance in high-pressure situations.

  ### 5. SEMINAR DEBRIEF STRATEGY
  1.  **Collect the Tally:** Ask students to raise hands for their dominant leaf (Situation, Culture, Character, etc.).
  2.  **Reveal the Names:** Only *now* reveal that "Situation" = Browning/Milgram/Zimbardo, "Culture" = Goldhagen, "Bureaucracy" = Arendt/Bauman.
  3.  **Attack the Empty Cells:** Present the "Saint in the Machine" combination. Ask the class why no historian argues this. (Answer: It violates the logic of causality).
  4.  **Discuss the Indistinguishable Leaves:** Ask the philosophers in the room: "If peer pressure enforces belief, is it still situationism?" This bridges the gap between the History and Philosophy cohorts.
  5.  **Final Point:** Emphasize that the "It's both" answer is only useful if they can specify *which* factor dominates in *which* variation (e.g., "Ideology explains Q9, but Situation explains Q1").
