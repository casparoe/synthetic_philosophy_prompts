      *   **Conclusion:** Summary of what changes the mind.

  5.  **Drafting the Content (Iterative refinement):**
      *   *Refining the AC point:* Make sure to explain *why* Dedekind-finite doesn't mean finite without Choice. Use the term "amorphous set."
      *   *Refining MH:* Don't just say "it's impossible." Say "You must argue it's physically unstable."
      *   *Refining Falsifiability:* Suggest specific predictions (e.g., no continuous fields).
      *   *Tone Check:* Keep it peer-to-peer. Don't talk down. Use technical terms correctly (ZFC, ZF, bijection, proper subset, worldline).

  6.  **Self-Correction/Review during drafting:**
      *   *Did I answer the "Fatal vs. Awkward" ranking?* I need to make sure I explicitly categorize the objections.
      *   *Did I address the Supervisor's comment?* Yes, that's the opening hook.
      *   *Is the distinction between Math and Concrete clear?* Keep reinforcing that the user is talking about *concrete particulars*, not sets.
