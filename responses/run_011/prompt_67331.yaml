      *   *Supertasks:* Benacerraf showed logical consistency. The user needs a *metaphysical* or *causal* block, not a logical one.

  7.  **Final Polish:** Check against the prompt's specific requests (blunt, map of exposure, what changes mind). Ensure the distinction between "refutation" and "cost" is clear. (Proceed to generate output).

  *(Self-Correction Note)*: I need to be careful about the "Dedekind Constraint." If the user defines concrete collections as well-orderable (physically distinguishable), AC might hold. But the supervisor said it's "too weak." This implies the supervisor thinks there are models where Dedekind-finite $\neq$ finite that are metaphysically relevant. I should emphasize that relying on Dedekind-finitude *without* securing AC is the technical failure.

  *(Another Note)*: On the "Risk" question. If the view says "Anything that looks infinite is actually finite," it's unfalsifiable. I need to press hard on this. What observation would force abandonment? (e.g. empirical confirmation of continuous spacetime).

