      *   **[B]:** Taxonomy of Irish evils. Curable/Symptomatic vs. Desperate. Lists: Absenteeism, Protestant/Roman Catholic bigotry, Orangeism, Ribbandism, Repeal cry, threatening notices/assassinations. All dismissed as not making the case desperate. The real desperate condition: "a nation which lives on potatoes."
      *   **[C]:** Productivity claim. Potatoes support 3x the population per land compared to corn.
