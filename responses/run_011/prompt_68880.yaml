  3.  **Drafting - Section by Section:**

      *   **1. The taxonomy in [B].**
          *   *Buckets:* Curable, Symptomatic, Desperate (Background Condition).
          *   *Model of Society:* Political/social issues are surface-level or manageable. The underlying economic/biological substrate is the real determinant.
          *   *Placement of Political Items:* Absenteeism, Repeal, Assassinations are placed in "curable" or "symptomatic." This depoliticizes the crisis. It suggests the structure of governance or land ownership isn't the root cause; the crop is.
          *   *Unclear:* "Orangeism/Ribbandism" (sectarian violence) could be symptomatic of economic stress, but Trevelyan treats them as distinct evils that are less fundamental than the potato.
