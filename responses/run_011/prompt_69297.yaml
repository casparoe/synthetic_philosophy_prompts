      "on her own view no such residue of a superseded first experience should exist."
      This means she thinks the *actual* case is Stalinesque (no experience of first dot).
      But she says Orwellian *would* leave traces.
      So she distinguishes them empirically.
      Okay, my questions reflect this.

      Let's assemble.
answer: |-
  1. You argue against the standard view that Orwellian and Stalinesque explanations are indistinguishable. What is the core empirical difference you rely on to separate them?
     Likely answer: She will state that genuine experience involves global broadcasting which leaves causal residues.
     Follow-up: This licenses asking what specific residues she proposes to measure.

  2. You have insisted this is a testable claim rather than a conceptual one. Can you walk us through the design of the critical experiment and what result would count as confirmation?
     Likely answer: She will describe a masking or priming paradigm measuring autonomic or motor residue during the phi interval.
     Follow-up: This licenses asking about confounds in that specific paradigm.

  3. A critic might argue that early unconscious processing occurs in both scenarios and produces the same priming or autonomic effects you are looking for. How do you isolate traces of conscious experience specifically?
     Likely answer: She will argue that only broadcast content drives the specific downstream effects she measures.
     Follow-up: This licenses pressing on whether broadcasting requires consciousness.

  4. If the mechanism withholding experience waits for the second dot to construct the first, what fixes the waiting period, and what does your account say happens when nothing comes next?
     Likely answer: She will propose a fixed integration window that defaults to a static experience if the window closes empty.
     Follow-up: This licenses asking about the arbitrariness of that window.

  5. Dennett argues that positing a determinate moment where processing becomes experience reinstates the Cartesian Theater. How do you avoid the regress objection he raises against that finish line?
     Likely answer: She will argue that the regress assumes a homunculus, whereas her onset time is just a functional threshold.
     Follow-up: This licenses asking if functional thresholds vary across modalities.

  6. How does your view differ from the backward-referral hypothesis, where the experience occurs late but is dated to the stimulus, and does your objection to that view undermine your own delayed onset?
     Likely answer: She will distinguish ontological onset from subjective dating, claiming only the former matters for her traces.
     Follow-up: This licenses asking why subjective dating doesn't wash out her empirical claims.

  7. Observers can launch eye movements toward flashed targets faster than your proposed delay allows. Does this require a dissociation between conscious content and action guidance, and is that dissociation independently motivated?
     Likely answer: She will accept the dissociation, citing dorsal stream processing as independent of conscious ventral stream content.
     Follow-up: This licenses asking if this makes consciousness epiphenomenal for action.

  8. Finally, since you treat this as an empirical claim, what specific experimental result would force you to abandon the position you are defending today?
     Likely answer: She will specify finding the predicted Orwellian traces in a standard Color Phi setup.
     Follow-up: This licenses closing the interview on the scope of that falsification.
