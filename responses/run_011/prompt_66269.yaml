prompt: |-
  I'm writing a novel set in a philosophy department, and one of the set pieces is an appendix: the joint statement two characters finally produce after ten years of feuding. One's a telic egalitarian — equality is intrinsically valuable, and the leveling-down objection only looks decisive because it slides between "better in one respect" and "better overall." The other's a prioritarian — there's no respectable notion of in-one-respect betterness doing real work here, and what the intuitions actually support is priority to the worse off, not equality.

  Write the statement they'd both be willing to sign. Numbered agreed claims first, including whether there's anything at all the two of them can say about the standard leveling-down case itself — I suspect there isn't, but check. Then the disagreements, each worded so the person holding it would accept their own line; no strawmen, they both get veto power over their column. Then the cruxes: the sub-questions where a settled answer would genuinely move one of them, and for each, what case or argument both would accept as bearing on it, with each side's prediction written down beforehand. I have a hunch one crux is whether prioritarianism is just utilitarianism with the scale bent, and another is whether the intuitions survive redescribing the same outcomes as the upshot of a choice history rather than a snapshot — build those in if they hold up, drop them if they don't. Keep it an actual philosophical document, not a scene. And then seperately, outside the document, tell me which single clause is the most exploitable by someone reading it in bad faith. I need that for chapter 22. No citations, they'd never put those in a thing like this.
