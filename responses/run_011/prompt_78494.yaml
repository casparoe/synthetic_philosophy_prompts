      *   *Inexpressible:* The *meaning* of the conditional as a distinct object from the conditional probability. The causal structure (intervention vs. observation).

  6.  **Addressing the "Gap vs. Muddle" Question:**
      *   Is the user's framework broken? No, it's a *causal* gap.
      *   Conditioning = Observation (Indicative). "Given that we observe surge > 3m..."
      *   Imaging/Intervention = Manipulation (Counterfactual/Subjunctive). "If we *made* surge > 3m..."
      *   In catastrophe modelling, this is often the difference between *filtering historical tracks* (Conditioning) and *running a physics model with modified boundary conditions* (Intervention/Imaging).
      *   The "Muddle" is often philosophers ignoring causal structure. The "Gap" is the modeller ignoring the difference between $P(B|A)$ and $P(B|do(A))$.

  7.  **Finalizing the Tone and Constraints:**
      *   American English (check spelling: modelled vs modeled, color vs colour, etc.).
      *   No hidden possible worlds. Explicitly flag the "similarity" fudge.
