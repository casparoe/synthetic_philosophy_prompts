      *   *Check:* Is Imaging clearly distinguished from Conditioning? Conditioning zeros out weights. Imaging moves weights.
      *   *Check:* The user asked about "If surge > 3m" (Indicative) vs "Had surge > 3m" (Counterfactual). In cat modelling, the antecedent is often a physical threshold. If the surge *didn't* exceed 3m in reality, the counterfactual antecedent has probability 0 (or near 0) in the "actual" run. Conditioning breaks. Imaging fixes this by moving mass from the "didn't exceed" scenarios to the "did exceed" scenarios.
      *   *Crucial Point:* In cat modelling, we usually use *simulated* ensembles where the antecedent *does* occur in some members. So $P(A) > 0$. This makes the philosophical distinction less about $P(A)=0$ and more about *causal dependency*. I need to highlight this. The philosophical counterfactual usually assumes $A$ is false in actuality. The modeller's counterfactual assumes $A$ is rare or requires a specific physical perturbation.
      *   *Refinement on Imaging:* In philosophy, Imaging moves mass to the *closest* world. In modelling, this is like finding the nearest neighbor in feature space where the condition holds. I must flag this "distance metric" as the philosophical "similarity ordering."

