          *   **Language:** American English.

  2.  **Deconstruct the Philosophical Concepts into Modelling Terms:**

      *   *Adams's Thesis:* $P(\text{If } A \text{ then } B) = P(B|A)$.
          *   *Modelling Translation:* The score you assign to the statement "If A happens, B happens" should equal the conditional probability calculated by filtering your ensemble to cases where A is true and checking the frequency of B.
      *   *Ramsey Test:* To evaluate "If A, B," hypothetically add A to your stock of knowledge and see if B follows.
          *   *Modelling Translation:* Condition your prior distribution on event A. Update the weights of your ensemble members so those where A is false get zero weight, renormalize, and check the expectation of B.
      *   *Lewis's Triviality Results:* If $P(A \to B) = P(B|A)$ holds for all probability functions, then probability functions collapse (can't represent uncertainty properly).
          *   *Modelling Translation:* You can't build a single joint probability distribution over your variables where the probability of the *proposition* "A implies B" is always identical to the conditional probability $P(B|A)$ across all possible prior states, unless the system is trivial (deterministic or independent in a boring way).
      *   *Imaging (Lewis):* A way to update probabilities for counterfactuals that isn't standard conditioning. Move probability mass from worlds where A is false to the "nearest" worlds where A is true.
          *   *Modelling Translation:* Instead of deleting ensemble members where A is false (conditioning), shift the weight of those members to specific members where A is true based on some "distance" metric, then calculate the frequency of B.

  3.  **Address the Core Question: Indicative vs. Counterfactual in the Engine:**
      *   The user's engine does: $P_{\text{new}}(B) = P_{\text{old}}(B | A)$.
      *   Philosophy says:
          *   Indicatives: Okay to use $P(B|A)$ (Adams).
          *   Counterfactuals: Not okay to use $P(B|A)$ (Lewis/Stalnaker). Need Imaging.
      *   Why? Because counterfactuals often involve antecedents known to be false (probability 0 in the actual world). Conditioning on probability 0 is undefined. Also, counterfactuals imply a causal or structural shift, not just learning information.

  4.  **Drafting the Translation (Iterative Process):**

      *   *Attempt 1 (Mental):* Tell them Adams says your conditional probability is the probability of the conditional. Lewis says you can't have a random variable for the conditional that matches conditional probability. Imaging is moving mass instead of cutting mass.
      *   *Critique 1:* Too abstract. Need to use "ensemble," "weights," "scenarios."
      *   *Attempt 2 (Closer):* Imagine your ensemble is 10,000 storm tracks.
          *   *Ramsey/Conditioning:* Throw away tracks where surge < 3m. Renormalize. Count breaches.
          *   *Imaging:* Keep all tracks. For tracks where surge < 3m, find the "closest" track where surge > 3m (maybe same wind speed, different landfall). Move the weight there. Count breaches.
      *   *Refining the "Triviality":* This is hard without "propositions." Let's frame it as: You can't store the "If A then B" logic as a static column in your dataset that works for every possible prior weighting of the dataset.

  5.  **Developing the Residue Report:**
