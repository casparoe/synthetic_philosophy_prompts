answer: |-
  The air in the Situation Room was recycled too often; it tasted of ozone and stale coffee. On the main screen, the epidemiological curve of the Novia virus climbed like a steeping hill, red against black. But the real tension wasn't in the data; it was in the silence between the two modellers seated at the central table.

  Elias Thorne and Dr. Sarah Vance were the joint leads for the Vector Institute. Under the Consortium Charter, they held equal authority. They also held equal responsibility. And today, they held contradictory credences.

  Elias adjusted his glasses. 'My model stabilises at point four,' he said, his voice flat. 'Forty per cent probability of exponential spread within the fortnight.'

  Sarah didn't look up from her tablet. 'Mine stabilises at point eight. Eighty per cent.'

  The gap was catastrophic. Under normal academic conditions, they would spend weeks debating priors, checking code, and tearing apart each other's assumptions. But the Charter, drafted during the panic of the previous decade, forbade debate once a discrepancy was formalised. It was designed to prevent stalemate. Section 14, Clause C: *Upon discovery of divergent credences between joint leads, the published advisory figure shall be the arithmetic mean of their individual probabilities.*

  Conciliationism codified into law. They were to split the difference and let the government decide.

  'The mean is point six,' said the man standing in the corner. This was Julian Aris, the Symmetry Auditor. His job was not to judge the models, but to judge the modellers. The averaging rule only applied if the two leads were genuine epistemic peers—equally competent, equally informed, equally free from bias.

  'Are we peers, Julian?' Elias asked. He looked tired. He knew that if they were peers, his 0.4 would be dragged up to 0.6. If they were not, the Charter required them to resolve the disagreement through argument, a process that could take days they didn't have.

  Julian didn't answer immediately. He looked at the two auditors seated beside him, a panel required to certify his certification. This was the second layer of the Charter's defence against error: the auditors themselves had to agree on the peer status.

  The senior auditor, a woman named Priya, spoke first. 'I certify them as peers. Both utilise the standard Institute datasets. Both have comparable publication histories regarding zoonotic transfer.'

  The junior auditor, Mr. Silas, shook his head. 'I cannot certify. Dr. Vance has access to raw field data from the Novia border clinics that Dr. Thorne does not. She is epistemically positioned better. They are not symmetrical.'

  The room tightened. This was the regress nobody liked to talk about. If the auditors disagreed on peerhood, did they average their verdicts? What was the arithmetic mean of 'Peer' and 'Not Peer'? A half-peer? The Charter was silent on disputes among the auditors.

  Julian turned to the modellers. 'The panel is split. Consequently, the status of peerhood is unresolved. However, the clock is ticking. The Prime Minister requires a number by noon.'

  Sarah leaned forward. 'If we average, we publish 0.6. The Protocol Threshold for Regional Quarantine is 0.55. The mean triggers Quarantine.'

  Elias shook his head violently. 'I cannot endorse Quarantine. At 0.4, the economic cost outweighs the health benefit. My model recommends monitoring only.'

  'And mine recommends Full Lockdown,' Sarah countered. 'At 0.8, Quarantine is insufficient. It traps the virus in urban centres without stopping inter-city travel. It's the worst of both worlds.'

  Here lay the first crack in the Charter's logic. The arithmetic mean of their credences was 0.6. This number legally licensed an intervention—Regional Quarantine—that neither modeller believed was rational. Elias thought it was an overreaction; Sarah thought it was a dangerous half-measure. The institutional demand for conciliation had generated a policy recommendation that both experts, relying on their own evidence, would reject. They were being forced to publish a conclusion that neither of them believed was true, based on a number that represented neither of their realities.

  'If we aren't peers,' Silas argued, 'then Sarah's 0.8 should stand. We defer to the better informed.'

  'But you haven't proven I'm better informed,' Sarah said. 'You've only proven I have different data. Different data doesn't negate peer status; it's part of the modelling variance.'

  'If we assume peerhood,' Priya interrupted, 'we must average. If we assume non-peerhood, we must argue. But we cannot agree on the assumption.'

  Julian rubbed his temples. 'We are facing a higher-order disagreement. We, the auditors, are disagreeing about whether you two are peers. By the Consortium's own logic, should we not average our verdicts?'

  'You can't average a binary status,' Elias said. 'Either we are peers or we aren't. There is no 0.5 peer.'

  'Yet here we are,' Julian said, gesturing to the deadlock. 'If we apply the peer rule to ourselves, we are stuck. If we don't, we have no mechanism to proceed.'

  The clock on the wall ticked loudly. Outside, the city was unaware that its fate rested on a semantic dispute about symmetry.

  Sarah stood up. 'Look at the curve. It's doubling every three days. If we spend another hour debating whether Elias is my peer, we lose the window for Quarantine anyway. Just publish the mean.'

  'And license a policy I think is harmful?' Elias asked. 'If I sign off on 0.6, I am lying about my model. I am stating a confidence I do not possess.'

  'You're stating the Consortium's confidence,' Julian said. 'Not yours.'

  'There is no Consortium confidence,' Silas snapped. 'There is only us. And we are divided.'

  The tension shifted. The virus was no longer the only thing spreading; the uncertainty was metastasising. The Charter assumed that averaging credences preserved rationality. It assumed that the midpoint was a safe harbour. But as Elias looked at the 0.6 on the screen, he saw a phantom number. It possessed no evidence behind it. No model generated 0.6. It was a bureaucratic artefact, a ghost created by the demand for consensus.

  If they published the mean, they triggered Quarantine. Elias would be responsible for economic ruin he deemed unnecessary. Sarah would be responsible for containment failure she deemed likely.

  If they refused to publish, the government would act on no advice, likely defaulting to panic or inertia.

  'What does the Charter say about auditor deadlock?' Sarah asked quietly.

  Julian looked at the thick binder on the table. He opened it to the index, then to the appendices. He turned pages slowly. The silence stretched, heavy and suffocating.

  'It doesn't say,' Julian admitted.

  'So we are peers in our ignorance,' Elias murmured. 'The auditors are peers regarding the peerhood. Should we average their decision?'

  'If we average,' Priya said, 'we get... nothing. A null verdict.'

  'Then we are back to square one,' Silas said. 'We must argue.'

  'We don't have time to argue,' Sarah said, her voice rising. 'The window closes in twenty minutes.'

  'Then we must guess,' Elias said. 'We must make a decision without epistemic justification.'

  'Isn't that what we've been doing all along?' Sarah asked.

  They looked at one another. The two modellers, the two auditors, the single clock. The apparatus designed to remove bias had simply displaced it. They had outsourced their epistemic responsibility to a formula, and now the formula had broken down under the weight of its own criteria.

  Julian closed the binder. 'I cannot certify. Priya cannot certify. Silas cannot certify.'

  'Then there is no number,' Elias said.

  'Then there is no Quarantine,' Sarah said.

  'And the virus doesn't care about our Charter,' Julian finished.

  They sat in the humming silence of the room. The cursor blinked on the input terminal, waiting for a number that no one could justify, demanding a decision that no one could own. The red curve on the screen continued to climb, indifferent to whether they were peers, indifferent to whether they were steadfast, indifferent to whether they were right.

  ***

  **Author's Note on Philosophical Liberties**

  While the story aims to dramatise the tension between conciliationism and steadfastness, several liberties were taken for narrative effect:

  1.  **Institutionalised Conciliationism:** In the actual debate, conciliationism is a normative claim about what agents *ought* to do intellectually (revise credences), not necessarily a bureaucratic rule to publish averages. Real-world conciliationists (like Elga or Christensen) argue for internal revision, not necessarily linear pooling of public outputs. The story treats the view as a rigid charter to heighten the stakes.
  2.  **The Decision/Credence Gap:** The complication where the mean licenses an intervention neither endorses relies on non-linear decision thresholds (e.g., Policy Tiers). Mathematically, if both agents reject an action based on a single probability threshold, the mean cannot cross that threshold unless their utility functions differ. I resolved this by implying they rejected the *specific* middle-ground policy (Quarantine) despite the mean triggering it, reflecting real-world complexities where 'compromise' policies often satisfy no one.
  3.  **The Auditor Regress:** The story implies a stalemate because the Charter lacks a rule for auditor disagreement. In practice, any functioning consortium would have a tie-breaker. However, this was included to illustrate the 'peer disagreement about peerhood' problem (a higher-order disagreement), which threatens to generate an infinite regress if one applies conciliationist principles recursively.
  4.  **Steadfastness:** Sarah's reluctance to average isn't purely steadfastness (maintaining one's credence despite peer disagreement); it is partly pragmatic (the mean leads to a bad policy). True steadfastness would argue she should stick to 0.8 because she is right, not because the average is dangerous. The story blends these motivations to keep the conflict focused on the apparatus.
