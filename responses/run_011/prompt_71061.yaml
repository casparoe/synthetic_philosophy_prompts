answer: |-
  **Purpose**

  This specification defines the functional criteria any epistemological account must meet to guide our retention decision. We are not seeking a metaphysical definition of knowledge for its own sake, but a operational distinction between skill and luck. The account must justify paying for a manager's process rather than merely harvesting their outcomes. It must demonstrate that "knowing" possesses a surplus value over "guessing right" that is detectable prior to the resolution of future bets, thereby allowing the committee to differentiate a repeatable competency from a singular fortunate accident.

  **The requirements**

  1.  **Non-Swampability:** The account must explain why the reliable production of a true belief adds value beyond the value of the truth itself.
      *   *Motivating Case:* The swamping difficulty. If the only value is the true belief (the profit), then the method (the reasoning) is irrelevant once the profit is secured. We need a theory where the process retains value independent of the specific outcome to justify retaining the manager despite our analysts' objections.
  2.  **Predictive Stability:** The account must overturn the ancient concession that true belief serves as well as knowledge for as long as it lasts.
      *   *Motivating Case:* The *Meno* stability problem. While a lucky guess works once, our endowment requires compounding returns. The account must show that knowledge is inherently more stable across time than mere true belief, ensuring the manager's success is not a fleeting anomaly that runs away before the next quarter.
  3.  **Modal Robustness:** The account must distinguish between truth in the actual world and truth in nearby possible worlds.
      *   *Motivating Case:* Luck vs. Skill. A belief formed by a process that would have failed in very nearby situations (e.g., if market conditions had shifted slightly) is not knowledge. We must penalize processes that are fragile, even if they succeeded this time.
  4.  **Principal-Value Alignment:** The account must distinguish between what a cognitive state is worth to the holder and what it is worth to the group relying on him.
      *   *Motivating Case:* Individual vs. Group value. A manager might feel confident (valuable to him) while being dangerous to us. The account must prioritize the reliability of the testimony or action as it impacts the committee's portfolio, not the manager's internal epistemic virtue.
  5.  **Ex-Ante Assessability:** The extra value of knowledge must be identifiable before the bet resolves.
      *   *Motivating Case:* The hindsight test. If the marker of knowledge is only visible after the outcome is known, it cannot guide retention. We are assessing the manager's past state to predict future performance; if we can only verify knowledge by seeing the win, we cannot distinguish skill from luck ex-ante.
  6.  **Harm Constraint:** The account must accommodate cases where knowing is worse for the knower than remaining ignorant.
      *   *Motivating Case:* Ignorance is bliss. While we desire returns, a theory claiming knowledge is *always* more valuable than ignorance fails logically. The account must allow that knowledge is instrumentally valuable, not intrinsically good in all contexts, ensuring we do not retain a manager whose "knowledge" exposes us to existential risk.

  **Non-negotiable or camp preference**

  Requirements 1 (Non-Swampability), 3 (Modal Robustness), and 5 (Ex-Ante Assessability) are non-negotiable. Without these, the account cannot distinguish process from outcome, luck from skill, or provide actionable guidance. Requirement 2 (Predictive Stability) is a strong preference; we are willing to overturn the ancient concession because our time horizon demands stability over fleeting utility. Requirement 6 (Harm Constraint) is a logical constraint but secondary to our financial goals; we accept a theory that limits this exception to non-financial contexts. Requirement 4 (Principal-Value) is non-negotiable; we are principals, not the agent.

  **The unsatisfiable subset**

  There is a tension between Requirement 1 (Non-Swampability) and Requirement 5 (Ex-Ante Assessability). To avoid swamping, the value must lie in the reliable process rather than the truth. However, reliably identifying a process as reliable usually requires hindsight (seeing multiple outcomes). If we cannot see the reliability until after multiple bets resolve, we cannot assess the value ex-ante. This creates a circularity: we need to know the process is valuable to retain the manager, but we can only know the process is valuable if the manager is retained long enough to prove it. Any account that claims to resolve this without appealing to historical track records will likely fail one of these two requirements.

  **The most exclusionary requirement**

  Requirement 5 (Ex-Ante Assessability) is the most exclusionary. Most epistemological theories describe the state of knowledge after the fact; very few provide markers visible to a third party under uncertainty. This eliminates any account that relies on internalist justification inaccessible to the committee.

  **Contenders in brief**

  1.  **Virtue Epistemology:** Scores well on Non-Swampability and Stability (credit to agency), but fails Ex-Ante Assessability. We cannot easily see the manager's intellectual virtues before the outcome.
  2.  **Process Reliabilism:** Scores well on Modal Robustness and Principal-Value, but succumbs to Swamping. If the output is true, the reliability adds no extra value to the specific outcome.
  3.  **Pragmatic Encroachment:** Scores well on Principal-Value and Harm Constraint (stakes matter), but struggles with Modal Robustness. It might justify retaining a lucky manager if the stakes are low, which violates our risk policy.
  4.  **Knowledge-First:** Fails Non-Swampability. By treating knowledge as unanalyzable, it offers no criteria for us to identify it distinct from true belief in a hiring context.
