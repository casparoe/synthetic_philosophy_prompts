answer: |-
  Twenty years ago, when Elias was a postdoc facing dismissal for falsified data he didn't commit but couldn't prove was clean, I burned my own credibility to vouch for him, costing me a directorship I was promised. Last week, knowing I needed the lead authorship on this final paper to secure my emeritus pension bridge, he quietly submitted it under his name alone, citing a clause I'd forgotten in our old funding agreement. He told me over coffee, calm as ordering breakfast, that he needed the prestige for his own chair nomination more than I needed the pension. The department is outraged on my behalf, calling it theft, and I agree they are right to be angry. Yet I feel no sting, only a grim settling of accounts, even as we still share the spectrometer schedule and I snap at him for leaving the centrifuge unbalanced.

  ***

  **1. Constraint Checklist**

  *   **Competent Adult Agent:** Elias is calm, deliberate, and understands the cost. No coercion, illness, or ignorance. (Met: He calculates the trade-off openly.)
  *   **Deliberate Injury:** Loss of pension bridge vs. chair nomination. Not a slight. (Met: Material and reputational harm.)
  *   **Asymmetry:** Department feels indignation; I validate their indignation but feel no resentment. (Met: "I agree they are right... Yet I feel no sting.")
  *   **Continuing Relationship:** No exit, no global objective attitude. (Met: Still share equipment, still snap about centrifuge.)
  *   **Prior History:** The mechanism is my past sacrifice for him. (Met: Vouched for him 20 years ago, cost me directorship.)
  *   **Setting/Format:** Lab setting, one paragraph, no sci-fi/psychiatry. (Met.)

  **2. Strawson's Account**

  Strawson's framework absorbs this, but not via the *exemption* clause. Exemptions (child, insane, coerced) concern the agent's capacity to participate in ordinary interpersonal relationships. Elias is not exempt. Nor is this a global shift to the *objective attitude*, since you still hold him responsible for the centrifuge (reactive attitudes are active).

  Strawson handles this through the **modification of the demand for goodwill**. Reactive attitudes are not monolithic; they are sensitive to the specific expectations inherent in a particular relationship. Your history has altered the normative structure between you. By saving him previously, you effectively prepaid the goodwill currency required for this specific transaction. From your perspective, Elias has not violated the demand for goodwill *relative to you*, because the ledger was cleared long ago. The stranger sees ill will because they see a violation of general moral norms; you see a repayment of a specific debt. Strawson would say you haven't dropped into the objective attitude; you are still in the participatory stance, but the *content* of what you demand from him differs from what the department demands. The specific move is **relativizing the demand for goodwill to the history of the relationship**.

  **3. Pereboom's Position**

  Derk Pereboom argues that because basic desert moral responsibility is illusory (hard incompatibilism), we should eliminate resentment and indignation entirely, replacing them with sorrow, moral anger, and a resolve to protect and reconcile.

  In this case, you have achieved Pereboom's ideal state (no resentment) without accepting his metaphysical premise (no free will). You still snap at Elias about the centrifuge, implying you believe he *could have done otherwise* and *should have*. You are holding him responsible in the basic desert sense for small things, but not for the big injury. This suggests resentment is more flexible and context-dependent than Pereboom allows. He claims resentment is tied to a belief in basic desert; your case shows you can suspend resentment while retaining that belief, based on relational history. **This is a point against Pereboom.** It demonstrates that resentment can be locally extinguished within a retributive framework, undermining his claim that we must abandon the framework itself to lose the resentment.

  **4. Load-Bearing Feature**

  The **prior debt (the vouching)** is the load-bearing feature.

  *   **If deleted:** You are simply a victim who is failing to react appropriately to injury. The stranger's verdict becomes the only rational one. Your lack of resentment looks like denial, pathology, or self-deception, not a philosophical counter-example.
  *   **If the "continuing relationship" is deleted:** If you stopped working together, the case collapses into the "objective attitude" or "exit" which Strawson already accounts for. The tension between "no resentment for the big thing" and "resentment for the small thing" vanishes.
  *   **If the "competence" is deleted:** If Elias were confused or coerced, it becomes a standard Strawsonian exemption, and your hunch about the *patient's* side of the ledger is untested.

  **5. Best Strawsonian Reply & Weakest Point**

  **The Reply:** A sophisticated Strawsonian would argue you are mistaken about your own psychology. You *have* withdrawn the demand for goodwill, but only because you view this specific act as *permissible* within your unique moral economy. Therefore, it isn't a case of suppressing resentment despite ill will; it's a case of recognizing no ill will was directed *at you* specifically, because you licensed the cost. The stranger sees ill will because they don't see the license. Thus, this isn't a reason for dropping into the objective attitude; it's a refinement of the participatory stance. Your hunch that exemptions live on "your side" is correct in spirit, but Strawson would classify it as a **modification of the demand** rather than an **exemption from the demand**.

  **The Weakest Point:** The stability of the asymmetry. You say you feel "no sting," only a "settling of accounts." The risk is that this isn't actually a lack of resentment, but a form of **pride** or **moral bookkeeping** that masks the resentment. If you truly felt no resentment, would you still validate the department's indignation so readily? Validating their anger keeps the injury alive socially, which suggests you haven't fully settled the account internally. The case relies on your self-report of "no sting," which is the hardest variable to control in a thought experiment. A skeptic could argue you *are* in the objective attitude regarding the big injury, and the centrifuge snapping is just a residual habit, not proof of ongoing participatory involvement.
