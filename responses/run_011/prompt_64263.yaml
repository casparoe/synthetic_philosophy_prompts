  I'm 73, retired three years ago after running a soil microbiology lab at a state school for thirty-some years, and I've taken up philosophy the way other people take up woodworking — slowly, badly, but with great enjoyment. Right now I'm stuck on Strawson's essay on freedom and resentment. I think I've got the machinery: the reactive attitudes, the way we switch them off when the other person is a child, or ill, or acting under duress or unusual strain, or simply didn't know what he was doing, and the way we can drop into the objective attitude and start treating somebody as a thing to be managed, treated, or avoided rather than as someone we're dealing with. Also the bit where he says taking up that objective attitude can be a way of getting relief from the strain of being involved with a person at all, which he seems to think is a symptom that the relationship is dying.

  What I want from you is a case built to order, not an essay about Strawson, and not a reading list — I have a library card and no patience for bibliographies.

  Here's what the case is for, so you know what counts as cheating. My hunch is that the exemption list is about the person you're looking at, but that there are also reasons for dropping into the objective attitude that live entirely on my side of the ledger, and I want to see whether that hunch survives contact with a properly constructed example. So the verdicts have to come out of the theory. If you write me a story in which the narrator simply announces that he feels nothing and then shrugs, that's stipulating the result, and I spent forty years running controls — I will notice.

  The specifications:

  - The person being wronged is me, and the person doing it is a completely ordinary, competent adult in good standing. No illness, no addiction, no trauma reveal in the last sentence, no coercion, no unusual strain, no accident, no ignorance of consequences. He knows exactly what he's doing and exactly what it costs me, and he does it calmly.
  - It's a real and deliberate injury, not a slight. A stranger who heard the story cold should feel ordinary indignation on my behalf, and I should think his indignation is entirely in order. It's only my own resentment that isn't available to me. That asymmetry — same act, two observers, different verdict — is the whole point of the exercise, so please don't lose it.
  - I don't leave. We still work together, I still expect things of him in other matters, I still get irritated with him about the small stuff. So it can't be a case of exiting the relationship, and it can't be the temporary managerial suspension either, the "I have to handle this person for the next six weeks" move.
  - The thing that does the work has to be my own prior history with him — something I did to him or was for him earlier, which is why resentment feels unavailable now and wouldn't feel unavailable to the stranger.
  - Setting: a lab, a field station, a small department, a family firm. Ordinary life. One paragraph for the scenario itself, and no more. No neurology, no psychiatry, no sci-fi.

  Then, after the paragraph:

  1. Run the checklist against each constraint above and tell me how each one is met, so I can see the case isn't smuggling anything in.
  2. Say what Strawson's account actually delivers here. Does it have the resources to describe this, and if it absorbs the case, name the specific move that absorbs it — is this really about exemptions at all, or about standing, or about what the demand for good will amounts to in a relationship with this history, or about resentment that has nowhere to go but back at me?
  3. Say what Pereboom's position — give up resentment and indignation altogether, replace them with sorrow and a kind of resolve — makes of this exact case, and whether the case is a point in his favour or against him.
  4. Tell me which single feature of the scenario is load-bearing, and what happens to each verdict if you delete it.
  5. Give me the best reply a Strawsonian would make to my hunch, not a strawman, and tell me honestly where the case is weakest.

  And if you think some of these constraints can't all be satisfied at once, say so and tell me which one you bent.
