answer: |-
  ### Exam Question

  **Time Allowed:** 75 Minutes  
  **Marks:** 25  

  **Instructions:**  
  Answer the following question. You are not permitted to cite specific texts or authors beyond the names provided in the prompt. Assume for the purposes of this question that both philosophers reject *basic desert* in the cosmic or libertarian sense; your answer should focus on what justifies hard treatment once that foundation is removed.

  **The Question:**  
  Consider two philosophers: **Philosopher D** (who grounds responsibility in competence and social practice) and **Philosopher C** (who grounds intervention in risk and a right to self-protection). Both reject retributivism based on basic desert. Apply their views to the following cases:

  *   **Case One (The Harmless Wrongdoer):** An agent committed a serious wrong twenty years ago with full competence. They are now demonstrably zero risk, there is no victim interest in sanction, and no social utility in detention.
  *   **Case Two (The Dangerous Innocent):** An agent has never committed a wrong. However, due to an untreatable condition, they pose a high probability of serious future violence.

  Write an essay that addresses the following three points:  
  1.  **Verdicts:** What does each philosopher license in Case One and Case Two?  
  2.  **The Crux:** Identify which philosopher has the resources to treat the detention in Case Two as a regulatory *cost* (a regrettable but justified safety measure) rather than a *bullet to bite* (a counter-intuitive moral justification for punishment), without abandoning their core principle. Explain why the other philosopher cannot do this.  
  3.  **The Convergence Worry:** A critic argues that because both philosophers might authorize detention in some high-risk cases, their debate is merely verbal. Explain why the difference in *justification* remains substantive even if institutional outcomes sometimes overlap.

  ---

  ### Model Answer

  Both philosophers agree that basic desert cannot justify punishment, but they diverge sharply on what replaces it. Philosopher D replaces desert with a competence-based practice of holding responsible, while Philosopher C replaces it with a public health model of risk management. This structural difference dictates their verdicts in the two cases and determines who can accommodate counter-intuitive outcomes without collapsing.

  In Case One, the Harmless Wrongdoer, both philosophers license release. For Philosopher C, detention is justified only by future risk. Since the agent is now zero risk, quarantine is unnecessary and violates the least-restrictive-alternative constraint. For Philosopher D, hard treatment is tied to the practice of holding agents responsible for past actions. However, without any forward-looking utility (deterrence, protection) or victim interest, the practice loses its point. Sanctioning a harmless agent becomes gratuitous cruelty rather than responsible engagement. Thus, despite different reasoning, both release the agent.

  The divergence appears in Case Two, the Dangerous Innocent. Philosopher C licenses detention. Since the justification is the right to self-protection against credible threat, past wrongdoing is irrelevant. The agent is treated like a carrier of a dangerous disease; liberty is restricted to prevent harm. Philosopher D, however, cannot license detention. Their principle requires a violation of normative competence—a wrong done—to trigger the responsibility practice. Detaining an innocent person, regardless of risk, treats them as an object to be managed rather than an agent to be held accountable. This violates the core constraint that hard treatment must be a response to agency, not merely causality.

  This leads to the crux regarding costs versus bullets. Philosopher C has the resources to treat the detention in Case Two as a regulatory *cost*. Because their framework is explicitly non-punitive, they can argue that losing liberty is a tragic side-effect of public safety, akin to medical quarantine. It is regrettable, but it is not a moral contradiction. They do not need to bite the bullet of "punishing the innocent"; they simply deny that punishment is occurring. Philosopher D cannot do this. If Philosopher D detains the innocent, they must admit their practice is no longer about responsibility but about risk. This would require abandoning the core principle that competence and wrongdoing are necessary conditions for hard treatment. To detain the innocent would be a bullet to bite that destroys the theory's coherence. Philosopher D must instead treat the *risk* of future violence as the cost to be borne to preserve the integrity of the responsibility practice.

  Finally, the worry that this debate is merely verbal because both might detain dangerous people misses the substantive difference in justification. Even if Philosopher D allows civil commitment for the mentally ill (distinct from the responsibility practice), the *labeling* and *rights* attached differ substantively. Under Philosopher C's view, detention is preventive; the detainee retains rights appropriate to a non-criminal status, and release depends on risk reduction. Under Philosopher D's view, if detention occurs outside the responsibility practice, it cannot carry the stigma of punishment. The substantive difference lies in the moral status of the detainee and the constraints on the state. Philosopher C justifies intrusion via safety, limiting rights based on risk. Philosopher D limits intrusion via agency, protecting rights based on innocence. Convergent outcomes do not erase divergent justifications; the justification determines the limits, the review processes, and the moral meaning of the confinement. Therefore, the debate is not verbal; it is a disagreement about what kind of power the state holds over individuals who have not wronged it.

  ### Marking Scheme

  | Point | Marks | Requirement | Common Flub |
  | :--- | :--- | :--- | :--- |
  | **1. Basic Desert Premise** | 4 | Explicitly acknowledges both reject basic desert/cosmic justification; focuses on forward-looking/practice constraints. | Student wastes time arguing Dennett is a secret retributivist or Caruso believes in free will. |
  | **2. Case One Verdict** | 4 | Correctly identifies both release the Harmless Wrongdoer (no risk for C, no utility/point for D). | Student claims D punishes anyway due to "past wrong" regardless of current harmlessness. |
  | **3. Case Two Verdict** | 4 | Correctly identifies C detains (risk) and D rejects detention (no wrong/agency). | Student claims C punishes the innocent or D detains based on risk alone. |
  | **4. Cost vs. Bullet** | 5 | Identifies C treats detention as a cost (quarantine model); explains D cannot without abandoning agency principle (must treat risk as cost instead). | Student claims both bite the bullet or fails to explain *why* D cannot accommodate Case Two. |
  | **5. Verbal Worry** | 4 | Argues justification changes institutional design (rights, labeling, review), not just outcomes. | Student agrees the debate is merely verbal or says "labels don't matter." |
  | **6. Substantive Difference** | 4 | Concludes that differing justifications impose different constraints on state power regarding innocence. | Student concludes they are the same because both allow some form of confinement. |
  | **Total** | **25** | | |

  ### B-Minus Tells

  1.  "Philosopher D is a compatibilist so he believes people truly deserve punishment in a cosmic sense."
  2.  "Philosopher C wants to abolish all prisons regardless of how dangerous the inmate is."
  3.  "Since both might lock someone up, the difference is just semantics and doesn't affect real life."
  4.  "Philosopher C punishes the innocent because he doesn't care about free will."
  5.  "The main disagreement is whether determinism is true, which changes the outcome in Case One."
