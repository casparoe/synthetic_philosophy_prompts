          *   **User (Internalist/No-Bootstrapping):** The problem is handing reliability for free. If a procedure certifies a source you can't distinguish from a broken one, it's defective. "At-risk" condition either does no work (mismatch is always possible) or smuggles in independent warrant (begging the question).
