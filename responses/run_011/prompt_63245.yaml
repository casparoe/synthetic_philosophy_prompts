answer: |-
  Here are three candidate principles constructed to capture your specific pattern of verdicts, followed by a recommendation, three new cases, and the acts/characters distinction.

  ### Candidate Principles

  **1. The Sovereignty Principle**
  *   **Clause:** An agent gets credit iff the motive sustaining the action originates within their own psychological architecture, rather than being maintained by an external penalty/reward structure held by another agent.
  *   **Motivating Case:** **Carol vs. Erin.** Carol's aversion is internal (physiological/psychological); Erin's constraint is external (contract/audit). This explains why Frank (external penalty) gets "no" while Grace (internal choice to medicate) gets "yes."
  *   **Verdicts Overturned:**
      *   **Alice:** The Simulation Argument posits an external evaluator (future civ) holding the reward. If the Simulators vanished, the motive vanishes. This principle groups Alice with Erin.
      *   **Kate:** Depends on whether "self-image" is treated as internal architecture or internalized external pressure. (Likely preserves "yes").

  **2. The Moral Tracking Principle**
  *   **Clause:** An agent gets credit iff their motive tracks the actual *right-making features* of the act (welfare, duty, justice), even if via a proxy (aesthetic, theory), rather than tracking self-regarding features (reputation, safety, reward).
  *   **Motivating Case:** **Dave vs. Bob.** Dave tracks "wrongness"; Bob tracks "social standing." This explains the "maximum credit" for Dave and "no credit" for Bob. It also saves **Jonas** (aesthetic fit tracks the *shape* of the right action) and **Hal** (bogus theory attempts to track rightness).
  *   **Verdicts Overturned:**
      *   **Alice:** She tracks "simulation score," not "lives saved."
      *   **Grace:** She tracks "patience," which is a virtue, but the motive is instrumental self-regulation.
      *   **Carol:** She tracks "cognitive load," not honesty. (This principle forces you to say Earlier-Carol gets the credit, not Current-Carol, which you already lean toward, but it denies credit to the act itself).

  **3. The Non-Accidental Good Principle**
  *   **Clause:** An agent gets credit iff the satisfaction of their motive *logically requires* the good outcome to actually occur, not merely the appearance of the good outcome.
  *   **Motivating Case:** **Alice vs. Bob.** Alice needs the lives *actually saved* to fool the Simulators. Bob needs his friends to *think* he saved lives. This saves Alice while dumping Bob.
  *   **Verdicts Overturned:**
      *   **Dave:** Duty is satisfied by the *will*, not the outcome. If Dave tries to save a life and fails, he has moral worth, but this principle suggests he doesn't because the good didn't occur.
      *   **Jonas:** Aesthetic fit might be satisfied by the *look* of the action, not the moral substance.
      *   **Carol:** Her motive (reduced cognitive load) is satisfied by the *habit*, regardless of whether the truth-telling actually helps anyone.

  ---

  ### Recommendation: Clean vs. Baroque

  **Buy the Clean View (Sovereignty + Tracking).**
  **Dump Alice.**

  Your intuition on Alice is the weak link. You grant her credit because her instrumentalism *happens* to align with the good, but you deny Bob because his instrumentalism aligns with reputation. But both are contingent on external validation (Simulators vs. Friends). If the Simulators signaled that *hoarding wealth* scored higher, Alice would hoard. She is not moved by the right-making features, nor is her motive sovereign (it depends on a fact about the universe she doesn't control).

  **The Clean Principle:** *An act has moral worth iff the agent is moved by a motive that is internally sovereign and tracks the right-making features (or a close proxy like aesthetics/duty), such that the agent would remain stable under counterfactual changes to social/prudential payoffs.*

  *   **Verdict on Kate:** She is **one rung above Bob, but not the staircase.** She is sovereign (internal self-image), but she does not track right-making features (she tracks "being a good person," which is a meta-property, not the ground of the good). She gets partial credit, derivative of her commitment to self-regulation, but less than Dave.
  *   **Cost:** You must overturn **Alice** (group her with Bob) and **Hal** (bogus theory doesn't track truth). You save Carol, Dave, Erin (No), Frank (No), Grace, Jonas, Bot (No).

  **Why not the Baroque View?**
  A principle that saves all ten requires a disjunctive clause (e.g., "Credit iff Sovereign OR Outcome-Aligned OR..."). This makes moral worth a "coin flip" (as you noted with Hal) and obscures *why* we care about moral worth in the first place. If Alice and Bob are functionally identical (instrumentalists responding to external evaluators), calling one praiseworthy and the other not makes the concept useless for guiding action.

  ---

  ### Three New Cases

  **1. The Hypnotic Benefactor (Third-Party Installation)**
  *   **Case:** Liz is hypnotized by a benevolent neuroscientist (without her knowledge) to feel genuine empathy when she sees suffering. She volunteers at a shelter, feeling deep care. She has no memory of the hypnosis.
  *   **Clean Verdict:** **No.** (Fails Sovereignty). The motive did not originate in her evaluative framework. She is a vessel, not a source.
  *   **Baroque Verdict:** **Yes.** (Motive is internal *now*, regardless of history).
  *   **Implication:** If you say Yes, you admit moral worth is about *current psychology* only. If No, it's about *history*. Your Carol verdict (credit to Earlier-Carol) suggests you care about history. Consistency demands **No** for Liz.

  **2. The Failed Rescuer (Motive without Act)**
  *   **Case:** Mike dives into a river to save a child, motivated purely by duty. He fails; the child drowns. The act (saving) was not right (it didn't happen).
  *   **Clean Verdict:** **Yes.** (Moral worth attaches to the *will*, not the consequence).
  *   **Implication:** This confirms Moral Worth is distinct from *Rightness*. The act was not "right" (didn't save), but Mike has worth.

  **3. The Lucky Misogynist (Wrong Motive, Right Feature)**
  *   **Case:** Nina refuses to hire a less-qualified male candidate. She does the right thing (hiring the qualified woman). Her motive: "Women belong in the kitchen, not the office, but this specific woman is an exception I can't explain."
  *   **Clean Verdict:** **No.** (Fails Tracking). She did not track "qualification" or "fairness"; she tracked prejudice that accidentally aligned.
  *   **Implication:** Aligns with your rejection of Bob. Accidental alignment with the good is not moral worth.

  ---

  ### Acts vs. Characters

  You are sloppily mixing levels. This is the source of the Carol/Erin flip-flop.

  1.  **Deontic Status (The Act):** Is the move *Right* or *Wrong*? (Alice, Bob, Carol, Erin all perform *Right* acts).
  2.  **Moral Worth (The Agent-in-Action):** Is the *motive* praiseworthy? (This is what you are judging).
  3.  **Moral Character (The Person):** Is the *agent* virtuous? (This is a dispositional property over time).

  **The Fix:**
  *   **Carol:** Current-Carol's *act* has Rightness. Current-Carol's *action* has low Moral Worth (motive is avoidance of nausea). Earlier-Carol's *action* (installing the app) has high Moral Worth.
  *   **Erin:** Act has Rightness. Action has no Moral Worth (motive is external penalty).
  *   **Kate:** Act has Rightness. Action has Moderate Moral Worth (Sovereign, but meta-motive).

  **Conclusion:** Stop asking "Does this person get credit for the *act*?" Ask "Does this *motive* warrant praise?"
  If you do that, Alice and Bob collapse into the same category (Instrumental/External), and you stop flipping on Kate. She gets credit for the *discipline*, not the *morality*.
