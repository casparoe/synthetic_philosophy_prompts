      *   *Key Concept 2: Administrative Legibility.* James C. Scott. The state (or corporation) needs to simplify reality to manage it. 15-year slabs are for HR databases, not ontological truth.
      *   *Key Concept 3: Ian Hacking's Looping.* The training *makes* the kinds real by guiding interaction. The deck denies this.
