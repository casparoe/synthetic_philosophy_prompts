      *   *Name:* Let's call it "Compositional Foundationalism" or "Algorithmic Verificationism."
      *   *Key Tenets:*
          1.  **Decomposability:** Any valid claim $C$ can be decomposed into sub-claims $\{c_i\}$ such that $C \iff \bigwedge c_i$.
          2.  **Local Checkability:** A weak agent $J$ can verify $c_i$ with high confidence, even if $J$ cannot verify $C$ directly.
          3.  **Transitivity of Justification:** If $J$ accepts $\{c_i\}$ and the inference rule $c_i \to C$, $J$ accepts $C$.
          4.  **Asymmetry of Attack:** Finding a counter-example or flaw in a chain is computationally/epistemically cheaper than constructing a flawless chain (NP vs. P intuition, though not strictly).
      *   *Refinement:* It's not just "verification easier than generation." It's specifically *stepwise* verification. It assumes understanding *is* compositional.

  3.  **Task 2: Rival Pictures of Knowledge Ruled Out:**

      *   *Holism/Coherentism:* If truth depends on the global structure of a belief network and loses meaning when isolated, Debate fails. (e.g., Quinean web of belief).
      *   *Tacit Knowledge/Polanyi:* If expertise is "we know more than we can tell," a judge cannot verify steps they cannot articulate. Debate relies on explicit articulation.
      *   *Complexity-Theoretic Symmetry:* If finding a bug is as hard as writing code (in the worst case), the asymmetry vanishes. (e.g., if the lie is a cryptographic hash pre-image).
      *   *Gestalt/Intuition:* The "face recognition" analogy. If the judge can't see the forest for the trees, the tree-by-tree inspection fails.

  4.  **Task 3: Philosophical Underdetermination:**

      *   *The "Black Box" Judge:* The protocol treats the judge as an oracle for local truth. It doesn't matter *how* the judge knows $c_i$ is true.
      *   *Internalism vs. Externalism:* Debate looks Internalist (you need reasons), but if the judge just has a "gut feeling" about a step, it functions Externalist. The protocol is agnostic to *why* the judge accepts a step, only *that* they do.
