      *   *Resolution:* The scheme relies on the *depth* of the recursion being limited. The judge only needs to evaluate one level deeper than the current dispute.
      *   *Survival:* If the judge is *too* weak to evaluate the meta-claim (that a flaw exists), the system collapses. The "weakness" must be bounded by the granularity of decomposition, not general reasoning capacity.

