  so this stopped being an abstract thing for me about six weeks ago. I was going through three years of brokerage statements while doing my taxes and found that I've been moving the same chunk of money in a loop: index fund → bond ladder → sector ETF → back to the index fund, roughly twice a year, paying a spread and a commission on every hop, and landing basically where I started each time. I ran the numbers twice becuase it seemed too neat to be that bad, and the loop has cost me something like $2,400. My partner said "you money pumped yourself," and I laughed, and then I lay awake, because that is *literally the example* I use when I'm telling other people their preferences are a mess. I'm drafting a piece about it for a small blog and I want a consistency check on the views before I post them, since what I say I believe doesn't obviously explain what I did.

  Here's the set:

  (1) Cyclical preferences are a genuine rational failure, and the pump is the proof — anyone disposed to pay to end up back where they started, minus money, has defective preferences rather than merely defective information.

  (2) The usual defense — that pumps only bite myopic agents who can't see the whole sequence, and that a foresighted agent with the very same preferences just declines the first trade — is basically right. So intransitivity is survivable if you can see far enough ahead.

  (3) What I ought to do at any given moment depends only on the options I'm actually facing at that moment. Not on what I decided last week, and not on what I'd prefer if I stepped back and looked at the whole sequence at once.

  (4) It can be fully rational to bind yourself in advance, and to honour the binding when the moment arrives and you'd genuinely rather not.

  (5) Paying a small cost now to avoid a larger foreseeable loss later is just ordinary instrumental rationality — there's nothing specially virtuous about it and nothing paradoxical either.

  Some of these feel like they're pulling apart but I honestly can't tell which, and I don't want to just dump whichever one sounds most impressive to abandon. Which pairs are in real trouble, and which only look like they are?

  Format, please: exactly five numbered items, one or two sentences each, with no intro and no wrap-up paragraph. Item 1 should be the most serious problem you found and they get less serious going down; if a pair only *looks* bad, say that in the item where it lands and say what dissolves it. Use item 5 to name the single cheapest revision available to me and what it would cost me elsewhere.
