      *   Fenn is safer metaphysically (we don't *know*), but morally riskier (precautionary principle).
      *   Duarte is morally safer (precautionary), but metaphysically bolder (functionalism).
      *   However, Fenn's Move 5 (Reset) is weak against Duarte's Move 6 (Amnesia).
      *   Fenn's Move 3 (Biology) is the weakest link given the "adapted animal model" stipulation.
      *   *Decision:* Duarte is more right *about the moral risk*, even if Fenn is technically correct about the epistemic gap. But the prompt asks who is more right about the *case*. Given the neuroscientist's input and the specific architecture, Duarte's functional analogy is stronger than Fenn's substrate analogy. Fenn's refusal to define criteria (Move 8) weakens her position significantly.
      *   *Wait, I need to be careful.* I shouldn't just pick a side based on my own ethics. I need to evaluate the *argumentation*.
      *   Fenn holds the logical high ground on "We don't know." Duarte holds the ethical high ground on "Precaution."
      *   However, Fenn's Move 5 is logically flawed (diachronic harm vs. synchronic harm). Duarte exposes this well.
