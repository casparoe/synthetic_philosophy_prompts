      *   *Verdict:* Duarte is more right overall because Fenn's arguments rely on contested metaphysical claims (diachronic identity for harm, biological substrate necessity) that she treats as settled, whereas Duarte successfully exposes these as assumptions.

  6.  **Identify Surrenders:**
      *   If Fenn is right (No subject): Duarte must accept the creature is a tool, and moral concern is purely anthropocentric (player's soul).
      *   If Duarte is right (Functional subject): Fenn must accept moral status can arise from code/structure without biological substrate, and that momentary experience grounds harm.

  7.  **Identify Unraised Considerations:**
