answer: |-
  **To:** The Management Committee
  **From:** [Your Name]
  **Subject:** A Protocol for Rights and Deadlocks (The 'Sen' Test)

  You are right to trust your intuition over your colleague's. Arrow's Theorem is about voting systems failing to produce a consistent ranking without a dictator. Sen's result is different: it shows that even a good voting system breaks if we guarantee individual rights *and* demand that we never make choices everyone agrees are worse. Your co-op is living inside Sen's paradox, not Arrow's.

  What follows is a twenty-minute protocol for the committee table. It is designed to separate genuine rights conflicts from simple disagreements, and to tell you exactly which rule is breaking when you deadlock.

  ### Part 1: The Whiteboard Protocol

  Do not start by debating the motion. Start by mapping the logic.

  **Step 1: Define the States (5 minutes)**
  Do not write "Motion to ban hens". Write two descriptions of the world.
  *   **State A:** Hens are kept on Plot 4.
  *   **State B:** No hens are kept on Plot 4.
  *   *Rule:* Keep it to two or three states maximum. If you cannot describe the outcome without using words like "should" or "allowed", you are not done.

  **Step 2: Assign Decisiveness (5 minutes)**
  Look at your constitution. Who is 'decisive' over the difference between State A and State B?
  *   If the constitution says "Plot planting is reserved", then the household on Plot 4 is decisive over (A vs B).
  *   Mark this on the board: **Right Holder: Plot 4.**
  *   If the constitution says "External appearance is collective", then the Committee is decisive.
  *   *Rule:* A person (or group) is 'decisive' if their preference alone settles the pair, regardless of what others want.

  **Step 3: The Pareto Check (5 minutes)**
  Ask the room: "Is there a state here that *everyone* prefers to the other?"
  *   Include the Right Holder in this count.
  *   If everyone (including the Right Holder) prefers State B, then State B is a **Pareto Improvement**.
  *   If the Right Holder prefers A, and everyone else prefers B, there is **No Pareto Improvement**. This is ordinary disagreement.
  *   *Rule:* Show of hands. If one hand goes up for A and one for B, stop. There is no Pareto dominance. Proceed to Step 4.

  **Step 4: The Conflict Test (5 minutes)**
  This is where the paradox lives.
  *   **Scenario 1:** The Committee prefers B (Pareto), but the Constitution gives Plot 4 the Right to choose A.
      *   *Diagnosis:* Liberal Paradox. You must choose between the Right and the Collective Welfare.
  *   **Scenario 2:** Plot 4 has a Right to choose A. Plot 5 has a Right to choose Quiet. State A creates Noise.
      *   *Diagnosis:* Colliding Rights. The Pareto check is silent (no unanimous agreement).
  *   **Scenario 3:** Plot 4 claims a Right, but the smoke/smell enters Plot 5.
      *   *Diagnosis:* Mis-drawn Right. The 'private' state is not actually private.

  **Step 5: The Decision Branch**
  Based on Step 4, follow the diagnostic tree below.

  ---

  ### Part 2: The Diagnostic Tree (Costs and Relaxations)

  When Step 4 identifies a conflict, you must relax one assumption to proceed. Do not pretend you aren't doing this.

  **Branch A: Relax the Right (Shrink the Reserved Zone)**
  *   *When:* The exercise of the right creates a physical externality (smell, smoke, visual devaluation).
  *   *Action:* Rule that the matter is not actually 'reserved' because it spills over the boundary.
  *   *Cost:* High. Requires constitutional amendment (2/3 AGM vote) to make permanent. For immediate decision, the Committee rules it 'out of order' based on existing nuisance clauses.
  *   *Preference:* **High.** If harm spills over, the right was likely drafted too broadly.

  **Branch B: Relax Unanimity (Override the Right)**
  *   *When:* The collective harm is severe, but the matter is technically inside the reserved zone.
  *   *Action:* Vote to override the individual preference despite the right.
  *   *Cost:* Very High. Undermines the constitution. Sets a precedent that rights are advisory.
  *   *Preference:* **Low.** Only use in emergencies (fire safety, structural risk).

  **Branch C: Restrict Admissible Profiles (Ignore 'Meddlesome' Preferences)**
  *   *When:* The objection is purely aesthetic or moral, with no physical spillover.
  *   *Action:* The Committee refuses to count preferences based on what happens inside another's reserved zone.
  *   *Cost:* Medium. Hard to enforce. Requires members to accept they don't get a say in everything.
  *   *Preference:* **Medium.** Good for internal décor, colour of curtains, etc.

  **Branch D: Colliding Rights Tie-Breaker**
  *   *When:* Two reserved matters clash (Noise vs. Sleep).
  *   *Action:* Apply a neutral rule (e.g., "Quiet hours 23:00–07:00").
  *   *Cost:* Low. This is standard management.
  *   *Preference:* **High.** This is what committees are for.

  **Branch E: Refer to Membership**
  *   *When:* The conflict cannot be resolved without changing the definition of a Right.
  *   *Action:* Put a constitutional amendment to the AGM.
  *   *Cost:* Highest. Requires 2/3 majority. Politically expensive.
  *   *Preference:* **Last Resort.** Use only when Branch A is clearly needed but lacks Committee authority.

  ---

  ### Part 3: Running the Cases

  Here is how the protocol applies to your four scenarios. I have been candid, particularly on the third.

  **Case 1: The Solar Array**
  *   **States:** A (Panels installed) vs. B (No panels).
  *   **Right:** Household claims roof is reserved. Committee claims street scene is collective.
  *   **Pareto Check:** Household prefers A. Rest of co-op prefers B (conservation value). No Pareto dominance.
  *   **Conflict:** Right vs. Collective Value.
  *   **Diagnosis:** This is a boundary dispute. A south-facing roof in a conservation area is rarely a purely 'private' sphere. The visual impact is an externality.
  *   **Verdict:** **Branch A (Relax the Right).** The right was mis-drawn. The 'reserved matter' should not extend to external alterations affecting street value.
  *   **Action:** Committee rejects the proposal as outside the scope of reserved matters. If the member appeals, refer to AGM to clarify the constitution (Branch E).

  **Case 2: The Hens**
  *   **States:** A (Hens kept) vs. B (No hens).
  *   **Right:** Plot usage is reserved.
  *   **Pareto Check:** Owner prefers A. Neighbours prefer B (smell/foxes). No Pareto dominance.
  *   **Conflict:** The smell and fox attraction are physical spillovers.
  *   **Diagnosis:** **Branch A (Relax the Right).** A right to 'use your plot' implicitly assumes 'without nuisance'. If the use generates negative externalities, it exits the reserved zone.
  *   **Verdict:** The claim to a reserved right fails because the *consequences* are not reserved.
  *   **Action:** Permit hens only if specific mitigation (fox-proofing, cleaning regimes) is agreed. If mitigation fails, ban hens. This is not overriding a right; it is defining its limit.

  **Case 3: The Wood Burner (Your Case)**
  *   **States:** A (You burn wood) vs. B (You do not burn).
  *   **Right:** You claim "heating your living room" is reserved.
  *   **Pareto Check:** You prefer A. Membership prefers B (health/air quality). No Pareto dominance (because you disagree).
  *   **Conflict:** You assert a Right. They assert a Health Harm.
  *   **Diagnosis:** This is the critical test. If the smoke stays *inside* your four walls, your Right holds (Branch C: their preferences are meddlesome). If the smoke escapes (chimney, drafts), it is an externality (Case 2 logic).
  *   **Verdict:** **Your claim does not survive.**
  *   **Reason:** You cannot claim a reserved right over a process that emits particulates into shared airspace. Even if the constitution says "heating", it implies "heating without nuisance". A real health argument transforms this from a 'meddlesome preference' (they don't like smoke) to a 'harm claim' (they are breathing particulates).
  *   **Which Condition Gave Way:** The definition of the Reserved Zone. The right to heat does not include the right to pollute shared ventilation.
  *   **Action:** You must treat this as Branch A. The Committee is entitled to restrict the fuel type or installation. To insist otherwise is to claim a right to impose health costs on others, which no liberal constitution can sustain.

  **Case 4: Music vs. Sleep (Colliding Rights)**
  *   **States:** A (Music played) vs. B (Silence).
  *   **Right:** Tenant 1 has right to enjoy home (Music). Tenant 2 has right to quiet enjoyment (Sleep).
  *   **Pareto Check:** Tenant 1 prefers A. Tenant 2 prefers B. No unanimity.
  *   **Conflict:** Two valid reserved rights collide.
  *   **Diagnosis:** **Branch D (Tie-Breaker).** The Pareto branch is silent. We cannot say one state is 'better' for everyone.
  *   **Verdict:** The procedure stops. We cannot vote on preferences. We must impose a neutral constraint.
  *   **Action:** Set quiet hours (e.g., 23:00 to 07:00). This restricts *both* rights equally to make them compatible. Do not vote on whether music is 'better' than sleep.

  ---

  ### Part 4: The Philosophical Quarrel (Waivable Rights)

  You asked if the debate over waivable rights changes what you should do. Some philosophers (like Gibbard) argue rights should be tradable: I waive my right to silence if you waive your right to play drums. Others (like Sen) treat them as fixed constraints.

  **Practical Advice:** Do not build waivability into your procedure.
  In a housing co-op, treating rights as commodities creates a market for nuisance. The wealthy member buys the right to burn wood; the poor member sells their right to clean air. This corrodes the 'co-operative' nature of the organisation.
  *   **Keep rights fixed.**
  *   **Use Branch D (Tie-Breakers)** to reconcile them.
  *   **Ignore the trading option.** It adds complexity without solving the underlying boundary disputes.

  ### Part 5: Limits and Misfires

  Be aware where this procedure will break.

  1.  **Scale (31 Households):** This protocol works for a Committee of 5–10 people. It will not work at the AGM with 31 households. Preferences become strategic. People will vote 'B' on the Solar Case not because they care about aesthetics, but to gain leverage on the Hens Case.
      *   *Mitigation:* The Committee must filter issues using this protocol *before* they reach the AGM. Only send 'Branch E' (Constitutional Amendment) issues to the full membership.

  2.  **Strategic Voting:** The procedure assumes honest preference reporting. If a member hates your wood burning but claims it's about 'property values' to trigger a Pareto argument, the arithmetic holds but the morality fails.
      *   *Mitigation:* Require evidence for harm claims (e.g., air quality reports for smoke, surveyor reports for solar panels).

  3.  **Degrees of Rights:** The protocol treats rights as binary (You have it or you don't). In reality, rights are degrees (You can burn wood, but not coal).
      *   *Misfire:* The procedure might say "Ban Wood" when the solution is "Install Certified Stove".
      *   *Fix:* In Step 1 (Define States), include the mitigation as a state. State C: "Burn wood with certified stove". Run the test again.

  4.  **Confidently Wrong Answers:** The procedure can tell you clearly that a Right must be relaxed (Branch A), but it cannot tell you *where* to draw the line. It will tell you "Hens are not an absolute right", but not "You can have two hens but not six".
      *   *Stop Point:* When the procedure identifies the *type* of conflict but not the *magnitude*, stop and refer to a working group. Do not let the Committee invent arbitrary numbers.

  ### Summary for the Table

  1.  **Write States, not Motions.**
  2.  **Identify the Right Holder.**
  3.  **Check for Unanimity (including the Right Holder).**
  4.  **If Conflict:** Is it harm (Branch A), Meddling (Branch C), or Collision (Branch D)?
  5.  **If Harm:** The Right is mis-drawn. Restrict it.
  6.  **If Collision:** Apply neutral time/use rules.
  7.  **If Meddling:** The Collective must yield to the Right.
  8.  **If Constitutional Change needed:** Refer to AGM (Branch E).

  This will not make everyone happy. It will, however, stop you from spending two hours arguing about whether a preference counts as a right. It forces you to decide if you are protecting a person or protecting a boundary. Usually, it turns out you were protecting a boundary that was drawn in the wrong place.
