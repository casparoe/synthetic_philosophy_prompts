prompt: |-
  I'm TAing an intro political philosophy section — 25 undergrads, one 50-minute discussion on Thursday — and we're doing Aquinas on whether you may kill a tyrant. Two students have already squared off in the discussion board: one says the Summa plainly authorizes tyrannicide subject to a proportionality condition, the other says he flatly forbids it to anyone who isn't a public official. I need to walk in able to say something more usefull than "it's contested," and I'd rather get my reading straight first. This is the old English Dominican translation, so the syntax fights you.

  Passage A — II-II, q. 42, a. 2, "Whether sedition is always a mortal sin?"

  From the body of the article: "Accordingly the sin of sedition is first and chiefly in its authors, who sin most grievously; and secondly it is in those who are led by them to disturb the common good. Those, however, who defend the common good, and withstand the seditious party, are not themselves seditious, even as neither is a man to be called quarrelsome because he defends himself, as stated above (Q[41], A[1])."

  Objection 3: "Further, it is praiseworthy to deliver a multitude from a tyrannical rule. Yet this cannot easily be done without some dissension in the multitude, if one part of the multitude seeks to retain the tyrant, while the rest strive to dethrone him. Therefore there can be sedition without mortal sin."

  Reply to Objection 3: "A tyrannical government is not just, because it is directed, not to the common good, but to the private good of the ruler, as the Philosopher states (Polit. iii, 5; Ethic. viii, 10). Consequently there is no sedition in disturbing a government of this kind, unless indeed the tyrant's rule be disturbed so inordinately, that his subjects suffer greater harm from the consequent disturbance than from the tyrant's government. Indeed it is the tyrant rather that is guilty of sedition, since he encourages discord and sedition among his subjects, that he may lord over them more securely; for this is tyranny, being conducive to the private good of the ruler, and to the injury of the multitude."

  Passage B — II-II, q. 64, a. 3, "Whether it is lawful for a private individual to kill a man who has sinned?"

  On the contrary: Augustine says "A man who, without exercising public authority, kills an evil-doer, shall be judged guilty of murder, and all the more, since he has dared to usurp a power which God has not given him."

  I answer that: "As stated above (A[2]), it is lawful to kill an evildoer in so far as it is directed to the welfare of the whole community, so that it belongs to him alone who has charge of the community's welfare. Thus it belongs to a physician to cut off a decayed limb, when he has been entrusted with the care of the health of the whole body. Now the care of the common good is entrusted to persons of rank having public authority: wherefore they alone, and not private individuals, can lawfully put evildoers to death."

  Reply to Objection 3: "It is lawful for any private individual to do anything for the common good, provided it harm nobody: but if it be harmful to some other, it cannot be done, except by virtue of the judgment of the person to whom it pertains to decide what is to be taken from the parts for the welfare of the whole."

  Passage C — II-II, q. 64, a. 7, "Whether it is lawful to kill a man in self-defense?", body of the article:

  "I answer that, Nothing hinders one act from having two effects, only one of which is intended, while the other is beside the intention. Now moral acts take their species according to what is intended, and not according to what is beside the intention, since this is accidental... Accordingly the act of self-defense may have two effects, one is the saving of one's life, the other is the slaying of the aggressor. Therefore this act, since one's intention is to save one's own life, is not unlawful, seeing that it is natural to everything to keep itself in 'being,' as far as possible. And yet, though proceeding from a good intention, an act may be rendered unlawful, if it be out of proportion to the end. Wherefore if a man, in self-defense, uses more than necessary violence, it will be unlawful: whereas if he repel force with moderation his defense will be lawful... Nor is it necessary for salvation that a man omit the act of moderate self-defense in order to avoid killing the other man, since one is bound to take more care of one's own life than of another's. But as it is unlawful to take a man's life, except for the public authority acting for the common good, as stated above (A[3]), it is not lawful for a man to intend killing a man in self-defense, except for such as have public authority, who while intending to kill a man in self-defense, refer this to the public good, as in the case of a soldier fighting against the foe, and in the minister of the judge struggling with robbers, although even these sin if they be moved by private animosity."

  What I need help with:

  1. What is the "unless" clause in Passage A actually doing? My student reads it as a permission with a cost-benefit cap: go ahead and disturb the tyrant as long as the fallout isnt worse than the tyranny. But the article's question is whether sedition is always a mortal sin, so maybe the clause only decides whether an act falls under the label "sedition" and says nothing at all about whether the act is otherwise lawful — an act could be non-seditious and still be murder. Which is it? And parse the grammar for me: what does "inordinately" modify, and what is the harm being weighed against what? Notice the objection's scenario is a multitude split down the middle, one part keeping the tyrant, so the harm in view looks like civil-war harm rather than harm to the tyrant.

  2. Who is the agent in "disturbing a government of this kind"? Passage B says the care of the common good belongs to "persons of rank having public authority" and to them alone. Is there any non-cheating reading on which the tyrant's subjects collectively hold that authority, or on which the tyrant's own injustice strips him of it so that resistance isn't private action after all? Does the last sentence of the reply — "it is the tyrant rather that is guilty of sedition" — do any real work here, or is it rhetorical? If the tyrant is the seditious party, then his opponents look like the people the body of the article says are "not themselves seditious" because they "defend the common good." Does that upgrade them from unlabeled to permitted, or is it still just about the label?

  3. Run me the case I'll get asked about in class. The tyrant's guards are dragging a man out of his house to kill him without trial, right now, in front of me; I have a crossbow and can drop the lead guard. Under Passage C may I shoot? I want the intend/foresee distinction applied rather than waved at — what exactly can I intend here, given the sentence saying a private man may not intend killing in self-defense — and I want to know whether "more than necessary violence" is a test about my means (could I have winged him instead) or a test about the political situation (does one crossbow bolt count as proportionate resistance to a regime).

  4. Then give me a verdict, not a survey. Which of my two students is closer to right, what's the single strongest arguement for the one you're rejecting, and what exactly has to be true about Aquinas's notion of public authority for your reading to come out the way it does? Don't hedge across all the readings — pick one and defend it. If there's a spot where you think the texts genuinely underdetermine the answer, say so explicitly and tell me what would settle it, because I'd rather flag that to the class than fake confidence. You dont need to send me to scholarship or footnotes; I have the text in front of me and I want your reading of it.
