answer: |-
  Here is a reading of the texts designed to get you through the section without hedging.

  ### 1. Parsing the "Unless" Clause (Passage A)

  **The Grammar:**
  The clause reads: *"unless indeed the tyrant's rule be disturbed so inordinately, that his subjects suffer greater harm from the consequent disturbance than from the tyrant's government."*

  *   **"Inordinately":** This modifies *"disturbed."* It means "disorderly" or "excessively." It is not just about the *amount* of violence, but the *order* of the action. An action is "inordinate" if it violates the proper order of justice.
  *   **The Weighing:** The harm being weighed is **harm to the subjects from the resistance** vs. **harm to the subjects from the tyranny.** It is *not* weighing harm to the tyrant. The Objection explicitly sets up a civil war scenario ("one part... retains the tyrant, while the rest strive to dethrone him"). Aquinas accepts this frame.
  *   **The Logic:** The article asks: *Is sedition always a mortal sin?*
      *   **Definition:** Sedition is disturbing the *common good*.
      *   **Premise:** A tyrant opposes the common good.
      *   **Conclusion:** Opposing a tyrant is *not* disturbing the common good; therefore, it is **not sedition**.
      *   **The "Unless":** This is a safety valve. If the resistance creates chaos *worse* than the tyranny, the resistance itself becomes a disturbance of the common good. At that tipping point, it *becomes* sedition (and thus a mortal sin).

  **The Function:**
  Your first student is half-right but draws the wrong conclusion. This clause determines whether the act is labeled **Sedition**. It does *not* determine whether the act is labeled **Murder**.
  *   **Reading:** You can successfully avoid the sin of *sedition* (because the tyrant is unjust) and still commit the sin of *murder* (because you lack authority to kill). Passage A clears you of charges against the *state's unity*; it does not clear you of charges against the *sanctity of life*.

  ### 2. The Agent and Public Authority (Passage B)

  **Who is the Agent?**
  Passage B is the hard constraint. *"It belongs to him alone who has charge of the community's welfare... persons of rank having public authority: wherefore they alone, and not private individuals, can lawfully put evildoers to death."*

  *   **Can subjects collectively hold authority?** Not in these texts. Aquinas treats authority as an *office* entrusted to specific persons ("persons of rank"), not a latent power residing in the multitude that wakes up when the tyrant fails.
  *   **Does the tyrant's injustice strip him of authority?** No. If it did, he would be a private citizen, and anyone could kill him. Aquinas calls him a "tyrant," implying he still holds the *office* but abuses the *function*.
  *   **The "Tyrant is Guilty of Sedition" Line:** This is rhetorical and theological, not juridical. It shifts the *moral blame* for the discord onto the tyrant. It justifies the *defenders* (those who withstand the seditious party) as not being seditious themselves (Passage A).
  *   **Does this upgrade them to "Permitted"?** No. It upgrades them from "Seditious Rebels" to "Defenders of the Common Good." But look at Passage B, Reply 3: *"It is lawful for any private individual to do anything for the common good, provided it harm nobody."*
      *   **The Catch:** As soon as "defending the common good" involves *harming* someone (killing the tyrant), the private individual stops being lawful. Only the public authority can harm a part for the sake of the whole.

  **Summary:** The tyrant's guilt makes resistance *defensive* rather than *seditious*, but it does not make private individuals *magistrates*. They can resist, but they cannot execute.

  ### 3. The Crossbow Scenario (Passage C)

  **The Scenario:** Guards dragging a man to execution. You have a crossbow.
  **The Rule:** *"It is not lawful for a man to intend killing a man in self-defense, except for such as have public authority."*

  **Applying the Intend/Foresee Distinction:**
  *   **Private Individual:** You may *intend* to stop the guard. You may *foresee* that he might die. You may **not** *intend* that he die.
  *   **The Crossbow Problem:** A crossbow is a lethal instrument. If you shoot a guard in the chest to stop him, Aquinas would argue you *intend* his death as the means to stopping him. You cannot separate the "stopping" from the "killing" with that weapon.
  *   **Moderation:** *"If a man, in self-defense, uses more than necessary violence, it will be unlawful."*
      *   **Test:** This is primarily about **means** (could you have tackled him? shouted? wounded him?), but it bleeds into the **political**.
      *   **Political Proportionality:** If killing the lead guard triggers a massacre of the neighborhood (the "inordinate disturbance" from Passage A), then using lethal force is "more than necessary violence" relative to the end of saving the one man.
  *   **Verdict on the Crossbow:** Under Passage C, a private person **may not shoot to kill.** If you shoot, you must intend to wound/disable. If the only way to save the victim is to kill the guard, a private person is textually barred from taking that shot. Only a "soldier fighting against the foe" or "minister of the judge" (public authority) can intend the killing.

  ### 4. The Verdict

  **Who is closer to right?**
  **Student 2 (The Restrictive View)** is closer to the text regarding *tyrannicide* (killing the tyrant).
  **Student 1 (The Permissive View)** is closer to the text regarding *resistance* (opposing the regime).

  **The Single Strongest Argument for Student 1 (The Loser):**
  The "Tyrant as Seditious" argument (Passage A, Reply 3). If the tyrant is the one guilty of sedition because he divides the multitude for private gain, then the multitude opposing him is the "peaceful party." If they are the peaceful party defending the common good, why can't they remove the aggressor? Student 1 argues that "public authority" is a functional label: whoever actually defends the common good *is* the public authority in that moment.

  **Why Student 2 Wins (The Reading to Defend):**
  Aquinas maintains a rigid distinction between **Moral Cause** and **Juridical Office**.
  *   You can have the *moral cause* (stopping tyranny) and still lack the *juridical office* (authority to kill).
  *   For Aquinas, killing is not just a physical act; it is a juridical act ("the judgment of the person to whom it pertains," Passage B, Reply 3). A private individual lacks the standing to pronounce the "sentence" of death, even on a guilty tyrant. To kill the tyrant is to usurp God's judgment and the State's sword.

  **What Must Be True About Public Authority:**
  For this reading to hold, **Public Authority must be institutional, not merely moral.** It must reside in an office that exists independently of the immediate justice of the act.
  *   **Condition:** There must be some "persons of rank" *other than the tyrant* who can act.
  *   **Underdetermination Flag:** Tell your class this: *Aquinas does not explicitly tell us what to do if the tyrant has purged all other "persons of rank."* If the tyrant is the *only* authority left, Passage B creates a deadlock: no one can lawfully kill him. The text assumes a mixed constitution or a hierarchy where "persons of rank" exist to check the ruler. If that structure is gone, the *Summa* is silent.

  **Classroom Script:**
  > "Student 1 is right that opposing a tyrant isn't 'sedition.' Aquinas says that clearly. But Student 2 is right that 'not sedition' doesn't mean 'lawful homicide.' Passage A clears you of treason; Passage B convicts you of murder. You can be a loyal defender of the common good and still be a murderer if you pull the trigger without public authority. The crossbow isn't the problem; the *intention to kill* is. A private citizen can stop a tyrant, but according to this text, they cannot execute him."
