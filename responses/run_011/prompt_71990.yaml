answer: |-
  This dispute is fundamentally methodological, turning on whether first-person appearances constitute evidence of ontological properties or merely evidence of cognitive judgments.

  Your diagnosis of a verbal versus substantive split is partially confused because it treats the definitional clash as superficial when it is actually the surface expression of incompatible theoretical commitments. The illusionist does not stipulate "phenomenal property" as ineffable simply to eliminate it; they argue that the concept itself is incoherent within a physicalist framework, whereas the realist argues that the concept is the primary datum any framework must accommodate. This is not a verbal dispute resolvable by precisification, because both sides agree on the dictionary definition but disagree on whether the term refers to anything real. Consequently, the "verbal" layer you identify is actually the substantive layer wearing a mask; neither side can concede the definition without surrendering their core metaphysical position.

  Your suspicion of a self-undermining structure is astute but overlooks the illusionist's standard defense. Frankish and Dennett do not claim introspection is globally unreliable; they claim it is unreliable specifically regarding the *intrinsic nature* of experience while remaining reliable about the *functional role* of introspective judgments. The position is not reflexively awkward in the way global skepticism is, because the illusionist accepts the reality of the judgment (the report) while denying the reality of the property judged. The stalemate persists because the realist refuses to accept this separation, insisting that the judgment and the property are phenomenologically inseparable. Thus, the disagreement is not about the reliability of reports per se, but about what those reports report.

  Regarding your concrete case of the trained subject reporting a tint on a blank screen: this vindicates neither side decisively because it conflates perceptual error with phenomenal error. The realist argues that if the subject genuinely seems to see a tint, there is a genuine phenomenal character to that seeming, regardless of the screen's blankness; the quale is the "seeming," not the "screen." The illusionist argues that the "seeming" is itself a cognitive misrepresentation with no qualitative residue. The reason this does not generalize to impeach all introspective reports is that the realist distinguishes between *transitive* consciousness (consciousness of an object, which can be illusory) and *intransitive* consciousness (the state of being conscious, which cannot). The illusionist collapses this distinction. Therefore, the experiment shows only that reports are trainable, not that qualia are illusions, unless one already assumes the illusionist premise that the report exhausts the phenomenon.

  There is a hidden empirical question, but it is not about consciousness directly; it is about the **dissociability of phenomenal judgment mechanisms from sensory processing mechanisms.** If neuroscience could demonstrate a specific neural substrate for "phenomenal judgments" that operates independently of the substrates for sensory discrimination, and show that the former can be activated without the latter (producing reports of experience without the functional correlates of experience), illusionism would gain significant traction. Conversely, if every report of phenomenal character is shown to be causally inseparable from the specific sensory processing it describes, realism is bolstered. Currently, this remains unresolved because we lack a marker for "phenomenal judgment" that is neutral between the two theories.

  Progress will not come from a new experiment or a sharper distinction, but from a change of question known as the **meta-problem of consciousness.** Instead of asking "Why is there experience?" (which presupposes the realist datum) or "Why is there no experience?" (which presupposes the illusionist conclusion), the field must ask "Why do we think there is a hard problem?" This shifts the burden from explaining the phenomenon to explaining the intuition of the phenomenon. If the intuition can be fully explained by physical mechanisms (as the meta-problem suggests), the realist loses their leverage without the illusionist needing to prove the negative. Until the debate shifts to explaining the *belief* in phenomenal properties rather than the properties themselves, the stalemate is structurally permanent.
