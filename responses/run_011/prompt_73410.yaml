  4. **The catch-trial design** (~300 words). Set out what each account predicts for truncated trials under (a) Theo's block-statistics reply and (b) any alternative reading of the Orwellian account you think is more faithful to it, and say whether any version of the design genuinely discriminates — including whether Miriam is right that "no transition was ever experienced" is testable at all.

  5. **The gate and the editor** (~200 words). Who wins Moves 9 and 10? In particular, is the symmetry Theo claims in Move 10 real, or does the editor's knowledge requirement differ in kind from the gate's?

  6. **What both of them miss** (~300 words). At least three distinct items. Please include any third family of accounts on which the mid-path content is neither a delayed experience nor a rewrite of one, and say whether that family dissolves the dispute, sides with one of them, or leaves it untouched.

  7. **Verdict** (~150 words). Who is more right overall and about what specifically — and does color phi carry any evidential weight at all on the timing of experience, as opposed to the timing of reports?
