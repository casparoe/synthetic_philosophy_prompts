answer: |-
  # The Evidential Bearing Procedure (EBP)

  **Step 1: The Semantics Split**
  Isolate the verb and the object of the claim. Classify the claim into one of four tiers. You must select the highest tier the claim attempts to reach.

  *   **Tier 1 (Observation):** Describes physical presence only. (e.g., "Pot shards were found in pits.")
  *   **Tier 2 (Behavior):** Describes an action performed by agents. (e.g., "Pots were deposited in pits.")
  *   **Tier 3 (System/Structure):** Describes a social or political organization. (e.g., "An administration managed storage.")
  *   **Tier 4 (Meaning/Intent):** Describes belief, motivation, or symbolic value. (e.g., "They believed pots served the dead.")

  **The Test:** If the claim is Tier 3 or 4, highlight the specific words that ascend from Tier 2.
  **The Bar:** To remain at Tier 3 or 4, the text must provide *independent* evidence for the ascent. Physical regularity alone supports Tier 2. To support Tier 3, you need evidence of coordination beyond coincidence. To support Tier 4, you need ethnographic analogy, iconographic decryption, or contextual placement that excludes functional explanation.
  **Action:** If the text asserts Tier 3 or 4 without independent support, mark the claim for **Downgrade** to the highest supported tier.

  **Step 2: The Pompeii Audit (Survival Filter)**
  List the materials cited in the claim. List the materials *required* for the claim to be true that are organic or perishable (wood, grain, cloth, bodies, voices).

  **The Test:** Does the claim treat the surviving sample as a representative fraction of the whole population?
  **The Bar:** If the claim relies on the *proportion* of surviving items (e.g., "most activity was ritual because most finds are ritual objects"), it fails unless the text explicitly acknowledges the survival bias. If the claim relies on the *absence* of perishable items (e.g., "no grain stores existed"), it fails immediately.
  **Action:** If the claim ignores perishable alternatives, mark for **Downgrade**. The claim must be rewritten to specify "surviving evidence suggests..." or "stone implements indicate..."

  **Step 3: The Absence Validity Check**
  Identify any inference drawn from something *not* found (e.g., "no fortifications," "no rich graves").

  **The Test:** Apply the **Expectation of Discovery** criterion.
  1.  **Preservation:** Would this item have survived in this soil/context?
  2.  **Exposure:** Was the area excavated sufficiently to expect finding it if it were there?
  3.  **Recognition:** Would the excavators have recognized it as such?

  **The Bar:** All three conditions must be met to infer absence. If soil acidity dissolves bone, you cannot infer "no burial." If only 5% of the site was dug, you cannot infer "no fortifications."
  **Action:** If any condition is unmet, the inference from absence is **Invalid**. Remove the claim segment relying on absence.

  **Step 4: The Uniformity-Control Test**
  If the claim argues that standardization (of houses, artifacts, graves) implies central authority or control (Tier 3), run this sequence.

  **The Test:**
  1.  **Technical Necessity:** Is the uniformity required by the technology? (e.g., bricks must be standard to stack). If yes, stop. Control is not proven.
  2.  **Convergent Tidiness Check:** Is there evidence of local tradition, shared apprenticeship, or neighbor-copying that could explain the uniformity without coercion? If plausible, control is not proven.
  3.  **Enforcement Evidence:** Is there independent evidence of coercion, redistribution mechanisms, or exclusion? (e.g., weapons concentrated in one house, non-local materials controlled by one group).

  **The Bar:** To support a "Control/Authority" claim, you must pass step 3. Uniformity alone supports only "Shared Convention."
  **Action:** If uniformity is present but Enforcement Evidence is absent, **Downgrade** "Political Order/Authority" to "Shared Cultural Convention."

  **Step 5: Verdict and Labeling**
  Based on the marks from Steps 1–4, assign the final status.

  *   **Supported:** No marks. The claim stands as written.
  *   **Weakened (Specific Downgrade):** One or more marks. You must rename the claim type using this taxonomy:
      *   *If Step 1 failed:* Rename **Interpretive Claim** to **Behavioral Claim**.
      *   *If Step 2 failed:* Rename **Totalizing Claim** to **Survival-Biased Claim**.
      *   *If Step 3 failed:* Rename **Negative Proof** to **Lack of Positive Evidence**.
      *   *If Step 4 failed:* Rename **Centralized Control** to **Regional Convention**.
  *   **Unsupported:** Multiple critical failures (e.g., Absence inference fails + Meaning claim fails). The claim must be withdrawn.

  **Step 6: Disagreement Protocol**
  Two students run this independently.
  *   **Match:** If both verdicts match, submit.
  *   **Mismatch (Supported vs. Weakened):** The **Weakened** verdict stands. Epistemic humility vetoes confidence.
  *   **Mismatch (Weakened vs. Unsupported):** The students must meet for 15 minutes. They must identify the specific Step where they diverged.
      *   If the divergence is on Step 4 (Uniformity), the claim is **Weakened** (default to Convergent Tidiness).
      *   If the divergence is on Step 3 (Absence), the claim is **Unsupported** (default to risk avoidance regarding community harm).
      *   If the divergence is on Step 1 or 2, a third reviewer (faculty) decides.

  ***

  # Worked Cases

  ### Case 1: Egalitarian Political Order
  **Claim:** "Near-identical house sizes and an absence of differential grave goods across a large settlement show an egalitarian political order."

  *   **Step 1 (Semantics):** Tier 3 (Political Order). Requires evidence of structure, not just layout.
  *   **Step 2 (Pompeii):** Houses (stone/earth) survive. Grave goods (organic wealth, textiles, food) may not. **Mark.**
  *   **Step 3 (Absence):** "Absence of differential grave goods."
      *   *Preservation:* Unknown.
      *   *Exposure:* "Large settlement" implies sampling, not total excavation.
      *   *Recognition:* Wealth markers vary by culture.
      *   **Mark:** Invalid inference from absence.
  *   **Step 4 (Uniformity):** House sizes are uniform.
      *   *Technical Necessity:* Possible (family size constraints).
      *   *Convergent Tidiness:* Highly plausible (shared building traditions).
      *   *Enforcement Evidence:* None cited.
      *   **Mark:** Control not proven.
  *   **Verdict:** **Weakened.**
  *   **Rename:** **Centralized Control** → **Regional Convention**; **Negative Proof** → **Lack of Positive Evidence**.
  *   **Rewrite:** "Shared building conventions and a lack of *surviving* differential grave goods are *consistent with* an egalitarian social structure, though perishable markers of status may not have survived."
  *   **Damage Report:** Step 3 and Step 4 did the damage. Your pet argument (Convergent Tidiness) successfully overruled the Uniformity-to-Control inference because no enforcement evidence was present. Step 3 prevented the absence of goods from counting as proof of equality.

  ### Case 2: Shared Belief System
  **Claim:** "A set of pits across several villages in one valley, each holding an unbroken pot and an animal skull, offers evidence of a shared belief system."

  *   **Step 1 (Semantics):** Tier 4 (Belief System).
      *   *Independent Support:* None cited (no iconography, no text, no ethnography).
      *   **Mark:** Downgrade to Tier 2 (Behavior).
  *   **Step 2 (Pompeii):** Pots/Skulls survive. Other ritual items (libations, cloth) do not.
      *   **Mark:** Survival bias acknowledged? If not, mark.
  *   **Step 3 (Absence):** No claim based on absence.
  *   **Step 4 (Uniformity):** Uniform deposits across villages.
      *   *Technical Necessity:* No.
      *   *Convergent Tidiness:* Possible, but cross-village uniformity suggests interaction.
      *   *Enforcement:* None.
      *   **Mark:** Control not proven, but "Shared Convention" is supported.
  *   **Verdict:** **Weakened.**
  *   **Rename:** **Interpretive Claim** → **Behavioral Claim**.
  *   **Rewrite:** "Repeated deposition of unbroken pots and animal skulls across multiple villages indicates a shared ritual practice." (Remove "belief system").
  *   **Damage Report:** Step 1 did the damage. The semantics slide turned a observable pattern into an unverified mental state.

  ### Case 3: Administration Controlling Grain
  **Claim:** "A storeroom with thousands of clay sealings bearing a handful of repeated stamp designs shows an administration controlling the redistribution of grain."

  *   **Step 1 (Semantics):** Tier 3 (Administration/Control).
      *   *Independent Support:* Sealings imply locking/securing, which implies management. Plausible ascent from Tier 2.
  *   **Step 2 (Pompeii):** Sealings (clay) survive. Grain (organic) does not.
      *   **Mark:** Claim specifies "grain." Survival of grain is unlikely.
  *   **Step 3 (Absence):** No absence claim.
  *   **Step 4 (Uniformity):** Repeated stamp designs.
      *   *Technical Necessity:* No.
      *   *Convergent Tidiness:* Unlikely. Specific stamp designs imply specific ownership/authority, not just neighbor-copying.
      *   *Enforcement Evidence:* High volume (thousands) + restricted designs (handful) implies centralization.
      *   **Pass:** Control inference is valid here.
  *   **Verdict:** **Weakened.**
  *   **Rename:** **Totalizing Claim** → **Survival-Biased Claim**.
  *   **Rewrite:** "A storeroom with thousands of clay sealings bearing a handful of repeated stamp designs shows an administration controlling the redistribution of *stored goods*."
  *   **Damage Report:** Step 2 did the damage. You can prove administration (Step 4 passes), but you cannot prove the commodity was grain without carbonized remains.

  ***

  # The Seams

  **1. Judgment Calls Wearing Clothes**
  **Step 4 (Uniformity-Control)** is the weakest link. It requires the student to judge what counts as "Convergent Tidiness." A student without regional knowledge may not know if a specific pottery style is a result of shared apprenticeship or central decree.
  *   *How they know:* If the student finds themselves arguing about "plausibility" rather than checking a box, they are in the judgment zone.
  *   *Mitigation:* The Disagreement Protocol defaults to "Regional Convention" (the weaker claim) in Step 4 mismatches. This biases the procedure toward your pet argument automatically.

  **2. Systematic Misfires**
  **Diachronic Claims.** This procedure is static. It handles "what was found" well, but poorly handles "change over time." If a claim is "Hierarchy *emerged* over 200 years," Step 2 (Pompeii) and Step 3 (Absence) will likely break because stratigraphy introduces variable survival rates across layers.
  *   *Instruction:* If the claim involves temporal evolution, send it to a specialist. This procedure is for cross-sectional snapshots.

  **3. The Value Hole**
  **Step 6 (Disagreement)** contains a hidden value judgment. When I dictate that "Absence mismatches default to Unsupported," I am prioritizing community safety (avoiding false negatives about ancestry/warfare) over historical curiosity.
  *   *The Hole:* The procedure cannot tell students *when* a claim is harmful, only when it is unsupported. A claim can be evidentially supported (e.g., "evidence of violence here") but socially devastating.
  *   *Instruction:* This procedure evaluates *bearing*, not *cost*. If a claim passes EBP but risks community harm, that decision lies outside the procedure. Do not teach students that passing EBP equals ethical clearance.

  **4. The "Convergent Tidiness" Bias**
  You asked me to build your pet argument in. I have done so by setting the default in Step 4 to "Convention" unless "Enforcement" is proven. This structurally disadvantages "Control" claims.
  *   *Honesty:* This means the procedure will systematically under-count centralized states in ambiguous cases. If the archaeological record is genuinely ambiguous between a loose network and a tight state, this procedure will always output "loose network." If you want to capture early states, you must accept a higher rate of false positives on Control claims. This procedure chooses false negatives on Control to avoid false positives on Authority.
