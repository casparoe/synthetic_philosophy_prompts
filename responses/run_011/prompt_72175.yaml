  You are right to suspect the scale is unstable. A single 0–10 axis conflates two distinct moral failures: lying to someone and steering someone. A tactic can be perfectly honest but coercive, or completely voluntary but based on a lie. To rank these properly, we need to split your scale into **Epistemic Integrity** (are the inputs true and complete?) and **Agential Respect** (is the person's capacity to choose bypassed?). I have scored them below using your 0–10 range, but I have annotated them with the Transparency Test result you requested. Where the tactic fails that test, it indicates a collapse in Epistemic Integrity.

  **1. Free mail-in test kit (pre-addressed)**
  **Score: 1**
  This removes friction without removing choice. It leverages convenience and reciprocity, but it does not counterfeit information or bypass deliberation.
  **Transparency Test: Pass.** If recipients knew the strategy was simply "make it easy," compliance might drop slightly, but the mechanism remains valid.

  **2. "7 of 10 households on your road..." (Social Proof)**
  **Score: 7**
  This constructs a false reality. The statistic is technically accurate but contextually deceptive, implying independent neighborly action when it was actually program-driven.
  **Transparency Test: Fail.** If households knew the 70% figure was a product of the canvassing you are now describing, the social proof collapses and trust erodes.

  **3. Letter timed after tipped-off news story (Fear/Urgency)**
  **Score: 9**
  This manufactures a crisis to bypass rational evaluation. It treats the recipient as a system to be startled rather than a person to be informed.
  **Transparency Test: Fail.** Disclosure that the health office tipped off the reporter would likely generate outrage and destroy institutional credibility.

  **4. Pre-selected test form (Opt-out)**
  **Score: 3**
  This is a standard nudge that leverages inertia. It biases the choice architecture but leaves the mechanism of refusal transparent and available.
  **Transparency Test: Pass.** Default effects persist even when people know they are being nudged; the option to decline remains genuine.

  **5. Flyer omitting detection limits and sample variance (Simplification)**
  **Score: 6**
  This withholds material uncertainty to secure compliance. It treats the recipient as someone who cannot handle nuance, providing counterfeit confidence.
  **Transparency Test: Fail.** If households knew the single sample was statistically weak, the perceived value of the test would plummet.

  **6. Phone bot tuned for conversion (Algorithmic Empathy)**
  **Score: 8**
  This mimics human understanding without possessing it. It uses psychological patterns to hack the conversation rather than engage in it.
  **Transparency Test: Fail.** Knowing the "empathy" is a calculated algorithm designed to trap them into an appointment would make recipients feel hunted.

  **7. Public pledge card at county fair (Commitment)**
  **Score: 5**
  This leverages social pressure and consistency bias. It is consensual but designed to create future guilt if the pledge is broken.
  **Transparency Test: Fail.** If the signer knows the signature will be used as a guilt lever six weeks later, many will refuse to sign initially.

  ***

  ### The Three Tiers

  **Tier 1: Respectful Persuasion (Scores 0–3)**
  *   **Tactic 1** (Free Kit)
  *   **Tactic 4** (Opt-out Form)
  *   *Reasoning:* These tactics alter the context of the decision without altering the content of the information or coercing the will. They treat the household as a partner.

  **Tier 2: Paternalistic Steering (Scores 4–6)**
  *   **Tactic 7** (Public Pledge)
  *   **Tactic 5** (Simplified Flyer)
  *   *Reasoning:* These tactics assume the office knows better than the household. Tactic 7 pressures the social self; Tactic 5 infantilizes the intellectual self. Both risk trust if discovered.

  **Tier 3: Manipulative Engineering (Scores 7–10)**
  *   **Tactic 2** (Social Proof)
  *   **Tactic 6** (Phone Bot)
  *   **Tactic 3** (Fear/News)
  *   *Reasoning:* These tactics rely on deception or emotional hijacking. They cannot survive public scrutiny and treat people as systems to be steered rather than persons to be answered.

  ***

  ### The Panel Fight

  The hardest fight will be between **Tactic 3 (Fear/News)** and **Tactic 5 (Simplified Flyer)**.

  Both camps will argue from efficacy. One side will argue that scaring people (Tactic 3) saves lives by overcoming inertia. The other will argue that simplifying the science (Tactic 5) is necessary because the public cannot understand detection limits anyway. Both are arguing that the ends justify compromising the truth.

  **I would take the side against Tactic 3.**
  Tactic 5 is scientifically sloppy, but Tactic 3 is institutionally corrosive. As a lab manager, you know that uncertainty is part of the data. Hiding it (Tactic 5) is bad practice. But manufacturing a crisis (Tactic 3) is a lie. If the health office is caught manufacturing news stories to scare residents, you lose the authority to speak on *actual* crises later. Tactic 5 damages your credibility; Tactic 3 destroys your license to operate. Keep the flyer simple if you must, but do not manufacture the news.
