  1.  **The syntax of the "double Lawe" sentence.**
      *   **"In both the former respects":** This attaches to the **two rules (Justice and Mercy)**, not the two sorts (Rich and Poor). The immediate antecedent pair is "Justice and Mercy." The confirmation lies in the subsequent clause: "to omitt the rule of justice." If "respects" referred to Rich/Poor, omitting Justice would be syntactically disjointed; since he is omitting a *rule*, the "respects" must be the rules.
      *   **Nature/Grace vs. Moral/Gospel:** These are not distinct axes. They are paired equivalents (apposition). "The lawe of nature" = "the morrall lawe"; "the lawe of grace" = "the lawe of the gospell." Winthrop is providing alternative names for the same two regulatory frameworks.
      *   **Omitting Justice:** Your parse survives contact with the sentence. Justice is dropped for the remainder of the argument to focus on Charity (Mercy). The trailing clause ("otherwise than it may fall into consideration in some perticular cases") functions as a hedge, acknowledging that Justice still exists (e.g., contracts) but is not the primary purpose of this treatise.

