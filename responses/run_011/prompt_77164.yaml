  2. **Novelty check** (about 150 words). For each of the two main theses — that rigidity is the whole content of the rule and is not empirically checkable, and that the entropy derivation is a restatement rather than support — say whether this is a standard move I have rediscovered or something worth developing further. Describe the standard arguments; do not name sources.
  3. **The most damaging objection** (about 200 words). Steelman the single objection that would do the most damage to this draft, one I have not already answered, and say whether it is fatal or survivable with revision.
  4. **Verdict** (about 100 words). Post as is, revise substantially, or scrap; plus the one change that would most improve it.

  No bibliography and no citations, please — I will be reading this offline and cannot check attributions, so describe arguments and results rather than naming their authors.
