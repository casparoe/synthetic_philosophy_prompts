  The mechanic is a dual-scoring regime that evaluates the same student-written definition once against varied epistemic possibilities of actuality and again against counterfactual scenarios holding actuality fixed.

  ### Setup and Materials
  *   **Handout (1 per student):** Titled "The Larkite Project." Contains 5 high-resolution photos of a green mineral (some nephrite, some jadeite, indistinguishable to laypeople). Text: "Larkite is a term used by traders for this green stone. It is hard, polished, and used in ornaments. Your task is to define 'Larkite' for a legal contract."
  *   **Envelopes (14 total):** 7 marked "Scenario A" (Larkite is Mineral X), 7 marked "Scenario B" (Larkite is Mineral Y). Distribute randomly.
  *   **Scenario Cards (for Round 2):** 14 cards. All identical. Text: "Actual World Discovery: Larkite is Mineral X. Counterfactual Situation: A nearby valley contains Mineral Y (looks identical)."
  *   **Scoreboard:** Whiteboard with two columns: "Round 1 (Discovery)" and "Round 2 (Counterfactual)."
  *   **Writing Tools:** Pens/pencils.

  ### Timeline (90 Minutes)
  *   **00–15: Commitment.** Students read the handout. They must write a single definition of "Larkite" in the contract box (e.g., "Green hard stone," "Mineral X," "Whatever traders call this"). Collect definitions. Do not discuss.
  *   **15–30: Round 1 (Epistemic Variation).** Hand out Envelopes A/B. Students open privately. They answer one question on a slip: "Given your envelope's fact, does your definition pick out the stuff in the photos?"
      *   *Scoring:* If their definition successfully picks out the mineral in their envelope (e.g., "Green stone" works for both X and Y; "Mineral X" works only for A), they get 10 points. Tally on board.
      *   *Reveal:* Ask for a show of hands. Most "Green stone" definitions will have 10 points regardless of envelope. Most "Mineral X" definitions will have split scores.
  *   **30–45: Round 2 (Metaphysical Fixing).** Collect envelopes. Hand out Scenario Cards (All say Actual = X). Students answer: "Given Actual is X, is the stuff in the Counterfactual Valley (Mineral Y) a Larkite?"
      *   *Scoring:* Correct answer is **NO** (Reference is fixed to Actual X). If their definition implies "Yes" (e.g., "Green stone"), they get 0 points. If "No" (e.g., "Mineral X"), they get 10 points. Tally on board.
  *   **45–75: Debrief.** Map the rounds to the two dimensions (see below). Address objections.
  *   **75–90: Wrap.** Discuss the "Necessary A Posteriori" implication.

  ### Scoring Rules
  *   **Round 1 Points:** Awarded for **Extension Matching**. If the extension of their definition in the scenario matches the scenario's fact, they win. (Tests: Does the definition track the world?)
  *   **Round 2 Points:** Awarded for **Reference Stability**. If the definition excludes the counterfactual stuff (because it's not the *actual* kind), they win. (Tests: Does the definition track the nature?)
  *   **The Divergence:** A definition like "Green stone" scores high in Round 1 (picks out whatever is actual) but low in Round 2 (fails to exclude Y). A definition like "Mineral X" scores low in Round 1 (if they held Envelope B) but high in Round 2.

  ### Debrief: Mapping the Game to 2DS
  1.  **Round 1 = Primary Intension.** Ask the "Green stone" definers: "Why did you win Round 1?" Because your definition tracked the *role* (green stone) regardless of which mineral turned out to be actual. This is the epistemic dimension: *What satisfies the concept in this world?*
  2.  **Round 2 = Secondary Intension.** Ask them: "Why did you lose Round 2?" Because once we fixed Actuality as Mineral X, the term "Larkite" became rigid. It refers to X in all worlds. Your definition tracked the *appearance*, not the *nature*. This is the metaphysical dimension: *What shares the nature of the actual referent?*
  3.  **The Collapse Failure.** Point to the scoreboard. The same definition ("Green stone") yielded different truth-values depending on the *scoring axis*. You cannot collapse Primary and Secondary intensions into one without losing the ability to explain why you won Round 1 but lost Round 2.
  4.  **Addressing "Just Kaplan":** Kaplan says natural kinds have constant Character (like "Mineral X"). If Kaplan were right, "Green stone" shouldn't have worked in Round 1 for both envelopes—it should have failed one. But it *did* work for both. That sensitivity to actuality *is* the Primary Intension Kaplan denies for kinds.
  5.  **Addressing "Only Indexicals":** You just played this with a rock. If "Larkite" splits across these two axes, so does "Water," "Tiger," and "Gold." Indexicals aren't special; they just make the split obvious.

  ### What Will Go Wrong (and How to Handle It)
  *   **Hedging:** Students will write "Green stone OR Mineral X."
      *   *Fix:* Enforce a "Single Criterion" rule at the start. "Your contract must be enforceable by a lab test OR a visual inspection, not both."
  *   **Round 2 Confusion:** Students will argue Mineral Y *is* Larkite because it looks the same.
      *   *Fix:* Remind them of the "Actual World Discovery" on the card. "Reference is fixed by the actual world. If the actual stuff is X, the word refers to X everywhere. This is the Kripkean rule you accepted in the Putnam reading."
  *   **Scoreboard Apathy:** They might not care about points.
      *   *Fix:* Make the stakes social. "The team with the highest combined score gets to choose the next reading." (Or just emphasize the intellectual puzzle).

  ### Limitation Note
  This activity simulates the **logic** of the two dimensions (the scoring divergence), but it cannot reproduce the **modal intuition** of necessity. Students will understand *that* the scores differ, but they may not feel *why* reference must be fixed by the actual world in Round 2. You must supply the philosophical bridge: "Reference is a causal-historical relation, not a descriptive one." The game shows the *consequence* of that view, not the *motivation* for it.
