                  2.  Round 1: "Suppose the actual world turns out to be [Scenario A] vs [Scenario B]." (Distribute envelopes).
                      *   Envelope A: Zorps are Species 1.
                      *   Envelope B: Zorps are Species 2.
                      *   Question: "Does your definition pick out the Zorps in your envelope?"
                      *   Descriptive Def ("Looks like..."): Yes in both. (Score: High).
                      *   Rigid Def ("Species 1"): Yes in A, No in B. (Score: Mixed).
                      *   *Goal:* Show Descriptive Def works for Epistemic variation.
                  3.  Round 2: "Okay, put away envelopes. The Actual World is Species 1."
                      *   Question: "In a counterfactual world where Species 2 exists (looks same), is it a Zorp?"
                      *   Descriptive Def: Yes. (Score: Low - Wrong).
                      *   Rigid Def: No. (Score: High - Right).
                      *   *Goal:* Show Descriptive Def fails for Metaphysical variation.
              *   *This creates the "Two Dimensions" feel.* Descriptive defs win Round 1 (Epistemic), lose Round 2 (Metaphysical). Rigid defs lose Round 1 (if unlucky), win Round 2.
              *   *Wait, I need them to feel the tension.* Most will write Descriptive. They will win Round 1, lose Round 2. This shows the *same definition* has different success conditions.
              *   *This fits the prompt.*

      *   **Objection Handling:**
          *   "Just Kaplan": Kaplan says "Water" has constant character. Here, the "Definition" acts like Character. In Round 1, we varied the Context (Actual World). In Round 2, we varied the Circumstance.
          *   *Counter:* Kaplan's Character for "Water" is constant. It doesn't pick out XYZ in a world where XYZ is watery. It picks out H2O.
          *   *2DS:* Primary Intension *does* pick out XYZ in a world where XYZ is watery.
          *   *The Game:* If students write "Watery stuff", Round 1 (Variation of Actual) shows it picks out whatever is watery. This *is* Primary Intension. Kaplan doesn't have this for natural kinds.
          *   *So the game demonstrates 2DS specifically by showing the definition *does* shift reference in Round 1.*
          *   "Only for indexicals": The game uses "Zorp" (natural kind). If it works here, it's not just for indexicals.

      *   **Limitations:** The game simulates the *scoring*, not the *semantic intuition*. I have to explain *why* Round 2 is the "Metaphysical" axis (holding actuality fixed).

      *   **One Sentence Mechanic:** **The mechanic is a dual-scoring regime that evaluates the same student-written definition once against varied epistemic possibilities of actuality and again against counterfactual scenarios holding actuality fixed.**

      *   **Wait, one more check on "No Sci-Fi":** Using "Species 1 vs Species 2" with identical photos is basically Twin Earth.
      *   *How to avoid?* Use *Historical* ambiguity.
      *   *Idea:* "The term 'Jade'."
      *   *Evidence:* Green stone, hard, used in ornaments.
      *   *Round 1:* "Suppose mineralogy reveals Jade is Nephrite." vs "Suppose Jade is Jadeite." (Both exist, both called Jade historically).
      *   *Round 2:* "Actual is Nephrite. Counterfactual: Jadeite exists."
