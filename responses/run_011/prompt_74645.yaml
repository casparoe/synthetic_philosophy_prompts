prompt: |-
  I chair the clinical competency committee at a mid-size general surgery residency program — five attendings, we meet monthly, and we sign off on whether a resident can do a given operation without an attending scrubbed in. We make roughly a dozen of these calls a month, two attendings have to co-sign each one, and the liability exposure when we're wrong on a clearance is very real. Our evidence is a mess of two completely different kinds and we have no principled way to weigh them. On one side: in-training exam scores, mock oral board scores, anatomy quizzes, and the resident's own case log. On the other: global technical ratings from attendings who watched them operate, plus video review of a case or two.

  The failure modes go both directions and both are bad. We've cleared residents who can recite the steps and the anatomy cold and then go rigid at the table the first time the bleeding isn't textbook. And we've blocked residents who do a beautiful safe operation but who, when you ask them to explain what they just did or teach it to an intern, produce something close to word salad — sometimes flat-out wrong about why they did what they did.

  What I want is a decision procedure my committee can actually run on one resident for one operation in about fifteen minutes, from a packet that already exists, ending in one of three verdicts: cleared to perform unsupervised, cleared with a named attending present, or not yet — plus what specifically has to change before the next meeting. It should be grounded in whatever the philosophy of skill knowledge actually says about the gap between knowing how to do a thing and knowing that something is the case, but please don't hand me a reading list or a citation dump. I want the usable content and the distinctions that do work, not the scholarship.

  Cases it has to handle, because we have all of them in the room right now:

  - The resident who performs well but whose account of their own performance is wrong. Do we count the performance, the account, or both? If both, how do they trade off, and is there any situation where a bad account should override a good performance?
  - The reverse: flawless account, has never actually completed the case start to finish.
  - Success by luck. Somebody did the operation three times, all three went well, but all three had a attending quietly steering from the side, or the anatomy happened to be easy, or the patient was young and stable. What in our packet distinguishes a real disposition from a run of favorable circumstances? I want the procedure to say something about how the resident would do in nearby variants of the case, not just their hit rate.
  - Competence that only exists inside a particular setup. A resident who is excellent with our usual team, our usual equipment, our usual first-assist, and who we have reason to think would come apart on a night shift with a new PA and a different tray. Is that one competence or two?
  - Knowledge that's present but never fires — learned on rounds, never once used at the table.
  - Decay: someone who was fine a year ago and hasn't touched this case in six months.

  And the part I care about most: be explicit about the back-door risk. If the procedure makes "can explain it to an intern" a necessary condition, haven't we just decided that being able to state propositions is what competence consists in — which is exactly what the cases above say is false? Take a position on whether an articulation requirement is defensible at all, and if it is, say what job it's actually doing in the procedure. Two of my members think articulation matters not as evidence of skill but as evidence that the skill will transfer and stay safe under novel conditions. I don't know whether that survives scrutiny.

  Format: a numbered procedure, questions in the order we should ask them, and for each one what counts as a sufficient answer and where it stops with an outright "not yet." Then a short section on which distinctions from the theory you deliberately kept, which you threw out to make it runnable in fifteen minutes, and why — and which steps are really judgment calls wearing a procedure costume, because I'd rather be told. Then run it on three cases: one straightforward, one where my committee would split two-two going in, and one where the procedure produces a verdict I personally don't like — clears somebody I think shouldn't be cleared, or blocks somebody I'd bet on. I want the uncomfortable one, not a softball. Finish with what this procedure can't tell us and what has to be escalated to a human because it's a question of values or institutional risk rather than fact.

  American English please.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Chair of a Clinical Competency Committee (CCC) in a general surgery residency.
      *   **Problem:** Need a principled, 15-minute decision procedure for clearing residents for unsupervised operations. Current evidence is mixed (cognitive vs. technical), leading to false positives (knows theory, freezes in OR) and false negatives (good hands, can't explain).
      *   **Constraints:** 5 attendings, monthly meeting, 12 calls/month, 2 co-signs needed. High liability.
      *   **Specific Cases to Handle:** Good performance/bad account, bad performance/good account, luck vs. skill, context-dependence, latent knowledge, skill decay.
      *   **Core Philosophical Question:** The role of articulation (knowing *that*) vs. performance (knowing *how*). Is requiring explanation defensible?
      *   **Format:** Numbered procedure (questions, sufficient answers, stop conditions), theory section (kept vs. discarded), three case runs (straightforward, split decision, uncomfortable verdict), limitations/escalation section.
      *   **Tone:** American English, practical, no citation dumps, actionable.

  2.  **Deconstruct the Philosophy (Know-How vs. Know-That):**
      *   *The Gap:* Ryle's distinction is the classic reference (knowing how vs. knowing that), but the user explicitly said "no reading list." I need to use the *concept* without the bibliography.
      *   *The Risk:* If we prioritize "knowing that" (explanation), we block safe surgeons who can't teach. If we prioritize "knowing how" (performance), we clear dangerous surgeons who can't adapt when things go wrong.
      *   *The Solution:* Articulation isn't the *skill* itself; it's a proxy for *adaptability* and *error recovery*. A surgeon who can't explain *why* they did something likely can't troubleshoot when the "why" changes (anatomical variation, complication).
      *   *Decision:* Articulation is a *necessary condition for unsupervised practice*, but not for *supervised practice*. It's the safety valve for the unknown.

  3.  **Drafting the Procedure (The 15-Minute Protocol):**
      *   *Goal:* Three verdicts: Unsupervised (Green), Supervised (Yellow), Not Yet (Red).
      *   *Structure:* Needs to be a funnel. Start with hard data, move to judgment.
      *   *Step 1: The Baseline (Log & Frequency).* Has they done it enough? Decay check.
      *   *Step 2: The Performance (Technical).* Global ratings, video.
      *   *Step 3: The Cognitive (Explanation).* ITE, Orals, *and* intra-op decision rationale.
      *   *Step 4: The Stress Test (Variability).* Luck vs. Skill.
      *   *Step 5: The Verdict.*

      *Refining the "Articulation" Question:* The user is worried about making "can explain" a gatekeeper. I need to frame it not as "can they teach" but "can they justify decisions under pressure."
      *Refining "Luck":* Look for consistency across different attending ratings or case complexity.
      *Refining "Context":* Explicitly ask about team/equipment dependence.

  4.  **Developing the Theory Section:**
      *   *Kept:* The distinction between *routine expertise* (smooth performance in standard conditions) and *adaptive expertise* (handling novelty). Articulation proxies for adaptive expertise.
      *   *Discarded:* Pure psychometric validity (too slow), strict weighting formulas (too rigid).
      *   *Judgment Calls:* Acknowledge that "safe enough" is a value judgment, not a fact.

  5.  **Selecting the Three Cases:**
      *   *Case 1 (Straightforward):* High performance, high explanation, consistent log. Easy Green.
      *   *Case 2 (Split Decision):* Good hands, terrible explanation. This hits the user's core anxiety. The procedure needs to force a Yellow (Supervised) rather than a Green, validating the risk of the "silent operator."
      *   *Case 3 (Uncomfortable):* This needs to be the kicker. Maybe a resident with perfect scores and great explanation but *low case volume* due to scheduling bad luck, OR a resident with great performance but a specific "blind spot" in explanation that the procedure flags as Red. Let's go with the "Great Explainer, Unproven Hands" scenario. The procedure might block them (Red) because performance trumps theory for *doing*, but the Chair wants to clear them because they "get it." Or better: The "Silent Virtuoso." Great hands, can't explain. The procedure says "No Unsupervised." The Chair thinks "They're safe." This highlights the tension.
      *   *Actually, let's make Case 3 more nuanced:* A resident with great performance and good explanation, *but* all cases were with one specific attending/team. The procedure flags the "Context Dependence" and downgrades to Yellow. The Chair feels they are ready. This tests the "Context" constraint.

      *Wait, let's re-read the prompt on Case 3:* "Clears somebody I think shouldn't be cleared, or blocks somebody I'd bet on."
      *Idea:* The "Silent Virtuoso." Resident has 10/10 tech ratings. But on oral questioning, they say "I just do it this way because it works." No anatomical rationale.
      *Procedure Verdict:* Yellow (Supervised).
      *Chair's Gut:* Green (They've never had a complication).
      *Why it's uncomfortable:* It prioritizes theoretical safety (adaptability) over empirical safety (track record).

  6.  **Drafting the Content (Iterative refinement):**

      *   *Procedure Name:* The "Adaptive Competence Protocol."
      *   *Step 1 (Recency/Volume):* Hard numbers. If < X cases or > 6 months gap -> Red/Yellow.
      *   *Step 2 (Technical):* Global Rating Scale (GRS). Need a threshold.
      *   *Step 3 (Cognitive/Articulation):* This is the crux. Not "can they lecture," but "can they justify a deviation?"
      *   *Step 4 (Context):* Did they do it with *only* one attending?
      *   *Decision Matrix:* Combine the steps.

      *Refining the Articulation Defense:* I need to be very clear in the theory section. Articulation is not the skill; it is the *interface* for safety when the skill encounters the unexpected.

  7.  **Final Review against Constraints:**
      *   15 minutes? Yes, if the packet is prepped.
      *   Three verdicts? Yes.
      *   Specific feedback for "Not Yet"? Yes.
      *   American English? Yes.
      *   No citations? Yes.
      *   Address the "back-door risk" of articulation? Yes, in the theory section.

  8.  **Writing the Response:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "Stop" conditions are clear. If Step 1 fails, do we stop or just default to Yellow? Let's make it a funnel. Critical failure = Red.
      *   *Correction on Case 3:* Make sure the discomfort is palpable. The procedure blocks a surgeon who has never hurt anyone, purely on the *potential* they might not handle a variant. That is the liability vs. reality tension.

  9.  **Final Polish:** Check tone. Needs to be authoritative but collaborative. "Here is the tool, here is why it works, here is where it hurts."

  *(Self-Correction on the "Articulation" argument)*: The user's members think articulation proves transferability. I need to validate this but sharpen it. It's not about transferability generally; it's about *error recovery*. If you can't name the structure you're protecting, you can't save it when the view is obscured.

  *(Final Plan for Case 3)*: The "Lucky Streak." 3 cases, all perfect, all easy anatomy. Procedure says "Not Yet" because n=3 is statistically insufficient for unsupervised status regardless of quality. Chair wants to clear because "they're ready." This highlights the "Disposition vs. Hit Rate" problem.

  *Wait, let's look at the "Uncomfortable" requirement again.* "Clears somebody I think shouldn't be cleared, OR blocks somebody I'd bet on."
  Let's go with **Blocks somebody I'd bet on.** The "Silent Virtuoso." 20 cases, zero complications, flawless video. But cannot explain *why* they chose a specific clamp over another. Procedure says "Supervised Only." Chair thinks "Let them fly." This forces the committee to value *adaptability* over *track record*.

  Okay, ready to write.cw
answer: |-
  # The Adaptive Competence Protocol (ACP)

  **Timebox:** 15 Minutes per Resident/Procedure Pair
  **Input:** Pre-meeting packet (Case log, Global Rating Forms, one Video clip, In-Training Exam/Oral scores, one specific "Rationale Memo" from the resident's primary mentor).
  **Output:** One of three verdicts + specific remediation.

  ### The Verdicts
  1.  **Green (Unsupervised):** Resident may perform the procedure without an attending scrubbed. Attending available in-house.
  2.  **Yellow (Proctored):** Resident may perform as primary, but an attending must be scrubbed or immediately available in the room.
  3.  **Red (Not Yet):** Resident may assist or perform specific segments, but not lead the case.

  ---

  ### The Procedure

  **Step 1: The Decay and Volume Check (2 Minutes)**
  *   **Question:** Has the resident completed the critical portions of this procedure at least 5 times in the last 6 months?
  *   **Sufficient Answer:** Yes, logged and verified.
  *   **Stop Condition:** If **No**, verdict is automatically **Red**.
      *   *Exception:* If they have 3-4 cases with flawless technical ratings, verdict defaults to **Yellow**.
      *   *Remediation:* "Schedule 2 more cases within 30 days. Re-review at next CCC."
  *   **Why:** This handles *Decay* and *Luck*. Five cases is the minimum threshold to suggest a pattern rather than a streak. Six months is the shelf-life of psychomotor memory without reinforcement.

  **Step 2: The Technical Baseline (3 Minutes)**
  *   **Question:** Do the Global Rating Forms and Video Review show consistent economy of motion and tissue handling, independent of the attending's assistance level?
  *   **Sufficient Answer:** Ratings are "Above Expectations" or equivalent on >80% of cases. Video shows resident correcting their own errors without prompting.
  *   **Stop Condition:** If ratings are "Meet Expectations" or lower, or if video shows the attending's hands frequently entering the field to correct trajectory, verdict is **Red**.
  *   **Why:** This isolates *Success by Luck*. If the attending had to steer, the resident didn't fly the plane.

  **Step 3: The Rationale Stress Test (5 Minutes)**
  *   **Question:** Can the resident articulate the *reason* for a specific technical choice when the anatomy was non-standard or the situation was suboptimal?
  *   **Source:** The "Rationale Memo" from their mentor + Oral Board scores.
  *   **Sufficient Answer:** The resident can explain *why* they chose a specific approach (e.g., "I went medial-to-lateral because the inflammation obscured the lateral plane") rather than just describing *what* they did.
  *   **Stop Condition:** If the resident can describe the steps perfectly but cannot justify a deviation from the textbook approach, verdict defaults to **Yellow**.
  *   **Why:** This addresses the *Good Performance/Bad Account* risk. If they can't explain the deviation, they can't replicate the safety margin when the deviation is bigger next time.

  **Step 4: The Context Dependency Check (3 Minutes)**
  *   **Question:** Did these successful cases occur across at least two different attending surgeons and two different OR teams?
  *   **Sufficient Answer:** Yes.
  *   **Stop Condition:** If all cases were with one attending or one specific first-assist/PA, verdict defaults to **Yellow**.
  *   **Why:** This handles *Competence Inside a Particular Setup*. If they only work with their "wingman," they are not independently competent.

  **Step 5: The Final Weighing (2 Minutes)**
  *   **Rule:**
      *   Pass Steps 1-4 = **Green**.
      *   Fail Step 1 (but meet exception) = **Yellow**.
      *   Fail Step 2 = **Red**.
      *   Fail Step 3 = **Yellow**.
      *   Fail Step 4 = **Yellow**.
  *   **Override:** The Committee Chair may upgrade a **Yellow** to **Green** *only* if the failure was Step 4 (Context) AND there is a plan to immediately diversify the team in the next case. The Chair may *not* override a Step 2 (Technical) or Step 3 (Rationale) failure.

  ---

  ### Theory: What We Kept and What We Threw Out

  **The Distinction We Kept: Routine vs. Adaptive Expertise**
  We are not measuring "skill" as a monolith. We are distinguishing between *routine expertise* (doing the thing when conditions are perfect) and *adaptive expertise* (doing the thing when conditions break).
  *   **Step 2 (Technical)** measures Routine Expertise.
  *   **Step 3 (Rationale)** measures Adaptive Expertise.
  *   **Why:** A resident can have muscle memory for a standard appendix. That does not mean they can manage a perforated appendix with a frozen abdomen. Articulation is the proxy for adaptability. If they can't tell you why they changed course, they were likely following a script, not managing a patient.

  **The Distinction We Threw Out: "Knowing That" vs. "Knowing How"**
  Philosophically, you can know how to ride a bike without knowing the physics of balance. In surgery, we are deliberately conflating the two.
  *   **Why:** In surgery, "knowing how" without "knowing that" is a liability. If a vessel blows and the textbook anatomy isn't there, the "physics" (the rationale) is the only map you have. We are treating articulation not as a teaching skill, but as a *safety mechanism*.
  *   **The Back-Door Risk:** You asked if making articulation a condition falsely defines competence as "stating propositions."
      *   **Our Position:** Yes, it does, *but* we accept that trade-off. We would rather block a safe surgeon who can't explain (False Negative) than clear an unsafe surgeon who can't adapt (False Positive). The liability of a surgeon who freezes when the script fails is higher than the liability of a surgeon who needs a proctor to confirm their intuition.
      *   **Verdict:** Articulation is not evidence of the skill itself; it is evidence of the *transferability* of the skill. If you can't transfer the logic to a new context, you aren't competent; you're conditioned.

  **The Judgment Calls Wearing Procedure Costumes**
  1.  **Step 2 (Technical):** "Economy of motion" is subjective. One attending's "efficient" is another's "rushed." You are relying on the consensus of the packet, not the procedure, here.
  2.  **Step 5 (Override):** The Chair's override on Step 4 is a political safety valve. It acknowledges that in a mid-size program, scheduling luck shouldn't tank a career, but it keeps the hard safety gates (Steps 2 & 3) locked.

  ---

  ### Case Runs

  #### Case 1: The Straightforward (Resident A)
  *   **Data:** 8 lap chole in last 4 months. Ratings: 9/10 across 3 attendings. Video: Smooth. Rationale: "Clipped cystic artery early because inflammation was distal." Teams: Varied.
  *   **Run:**
      *   Step 1: Pass (>5 cases, <6 months).
      *   Step 2: Pass (High ratings, independent).
      *   Step 3: Pass (Justified deviation).
      *   Step 4: Pass (Multiple attendings).
  *   **Verdict:** **Green.**
  *   **Comment:** No friction. The packet tells a consistent story of adaptive competence.

  #### Case 2: The Split Decision (Resident B)
  *   **Data:** 6 lap chole. Ratings: 10/10 (Flawless hands). Video: Beautiful. Rationale: "I just always do it this way." When asked why they didn't convert during a bleed, they say, "It felt right." Teams: Varied.
  *   **Committee Split:** Two attendings say "Hands don't lie, clear them." Two attendings say "They can't explain the bleed management, dangerous."
  *   **Run:**
      *   Step 1: Pass.
      *   Step 2: Pass.
      *   Step 3: **Fail.** (Cannot justify deviation/decision making, relies on "feel").
      *   Step 4: Pass.
  *   **Verdict:** **Yellow (Proctored).**
  *   **Remediation:** "Resident must lead 3 cases with a 'think-aloud' protocol where they narrate decision points to the attending before acting."
  *   **Comment:** The procedure forces the safety valve. It acknowledges the hands are ready, but the *mind* is not ready for the unexpected. It prevents the "rigid at the table" failure mode you described.

  #### Case 3: The Uncomfortable Verdict (Resident C)
  *   **Data:** 5 lap chole. All in last 2 months. Ratings: 10/10. Video: Flawless. Rationale: Excellent, can explain anatomy and variations perfectly.
  *   **The Catch:** All 5 cases were with the *same* attending (Dr. X) and the *same* PA. Dr. X is retiring next month. The resident has never done this case with anyone else.
  *   **Chair's Gut:** "I've watched them. They're better than some of my juniors who are cleared. Dr. X says they're ready. I want to clear them."
  *   **Run:**
      *   Step 1: Pass.
      *   Step 2: Pass.
      *   Step 3: Pass.
      *   Step 4: **Fail.** (Single attending/team context).
  *   **Verdict:** **Yellow (Proctored).**
  *   **Remediation:** "Must complete 2 cases with a different attending before Green status."
  *   **Why It Hurts:** This resident is likely safe. The procedure blocks them anyway.
  *   **Why It's Necessary:** This is the *Context Dependence* trap. If Resident C only knows how to work with Dr. X's retraction style and Dr. X leaves, Resident C's competence may evaporate on the first night call with a new team. The procedure prioritizes *systemic reliability* over *individual capability*. It forces the program to verify that the skill belongs to the resident, not the team dynamic. You might bet on them, but the data says their skill is not yet portable.

  ---

  ### Limitations and Escalation

  **What This Procedure Cannot Tell Us**
  1.  **Integrity:** If a resident logs cases they didn't lead, or if attendings inflate ratings to "get them out the door," this procedure amplifies the error. It assumes the packet is honest.
  2.  **The "One Bad Day" Risk:** A Green verdict is a probability, not a guarantee. A resident can meet all criteria and still nick a duct due to fatigue or an anatomical anomaly no one could predict.
  3.  **Institutional Risk Tolerance:** This procedure assumes the program's goal is "maximize safety." If the hospital administration pressures you to "maximize throughput," the Yellow verdicts will feel like bottlenecks.

  **When to Escalate to Human Judgment (Values)**
  *   **The "Golden Hands" Exception:** If a resident fails Step 3 (Rationale) but has zero complications over 50 cases, the Committee must vote on whether to waive the Rationale requirement. This is a *values* decision: Do we value empirical track record over theoretical adaptability? The procedure says "Yellow," but humans can vote "Green" if they accept the liability.
  *   **The "System Failure" Exception:** If a resident fails Step 4 (Context) because the program *cannot* provide a second attending (e.g., rural rotation, unique subspecialty), the Committee must decide if the program is at fault, not the resident. In this case, upgrade to Green with a note: "Competence verified, Context limitation is institutional."

  **Final Note on Liability**
  When you sign a Green verdict, you are certifying that the resident possesses *adaptive* expertise. If they cause harm during a standard variation of the procedure, your defense is the packet. If they cause harm because the anatomy was weird and they couldn't explain their choices, your defense is weak. This procedure is designed to protect the committee from the latter. Use it to force the conversation about *why* we clear, not just *who* we clear.
