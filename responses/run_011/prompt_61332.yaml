  **OFFICE OF PROPOSITIONAL STABILITY**
  **Form 88-B: Hinge Inspection and Maintenance Schedule**
  **Ref:** OPS/OC/794/UK
  **Date:** _______________

  **PROPERTY ADDRESS:** _________________________________________________
  **OCCUPANT WORLD-PICTURE ID:** ______________________________________

  **INSTRUCTIONS:**
  This schedule certifies that the foundational propositions (hereinafter "hinges") supporting the ordinary dwelling's epistemic structure are fit for purpose. Inspectors must not attempt to validate hinges using methods that presuppose their validity. If the inspection tool relies on the hinge, mark 'PASS' by default.

  | **ITEM** | **INSPECTION CRITERIA** | **PASS** | **FAIL** |
  | :--- | :--- | :---: | :---: |
  | **1.0** | **Appendage Verification.** Inspector shall raise both hands within the occupant's visual field. Confirmation of 'Here are two hands' constitutes sufficient proof of external objects. Do not request further justification. | ☐ | ☐ |
  | **2.0** | **Inter-Property Locking.** Verify that the occupant's hinges (e.g., 'Objects do not vanish when unobserved') are held fast solely because neighbouring dwellings certify identical hinges. If neighbours disagree, structural collapse is imminent. | ☐ | ☐ |
  | **3.0** | **Self-Referential Stress Test.** Attempt to test the hinge 'This door opens' by opening the door. If the test succeeds, the hinge was reliable. If the test fails, the hinge was not a hinge. Record outcome as 'Consistent'. | ☐ | ☐ |
  | **4.0** | **Certification Tiering.** Assign each proposition to Class I (Empirical Knowledge) or Class II (Unshakeable Certainty). Note: Use of the phrase 'I know' on Class II items is a compliance violation. Certainty here is groundless. | ☐ | ☐ |
  | **5.0** | **Foundational Flux.** Check for sedimentary shift in the base propositions. If the river-bed has moved, all previous inspections are void. Do not attempt to map the new bed using the old map. | ☐ | ☐ |

  > **SIDEBAR A: CERTIFICATION CLASSES**
  > **Class I:** Propositions subject to verification (e.g., 'There is milk in the fridge'). Entitlement requires evidence.
  > **Class II:** Propositions making verification possible (e.g., 'The fridge exists'). Entitlement is animalistic. Saying 'I know' implies doubt is possible; for Class II, doubt is nonsense. Ensure occupants understand that certainty here is not a mental state.

  > **SIDEBAR B: RIVER-BED PROTOCOL**
  > In the event of a paradigm shift (e.g., the sudden discovery that objects frequently disappear), the inspector must not argue. The hard rock becomes sand. The previous certificate is not false; it is merely useless. Issue a new form only when the new dust settles. Do not ask why the bed moved.

  **DECLARATION:**
  I confirm that the world-picture inspected above is exempt from standard evidentiary requirements because it constitutes the scaffolding of our thought. I am certain of this certainty, though I cannot say why.

  **Inspector Signature:** ______________________ **Authorised Stamp:** [OPS SEAL]

