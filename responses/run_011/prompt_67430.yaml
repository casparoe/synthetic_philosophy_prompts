answer: |-
  This is an exceptionally sharp reconstruction of the methodological landscape. You have correctly identified that frequency seriation is not merely a statistical sorting technique but a *model-based inference* that carries a heavy ontological load regarding time, transmission, and material culture. The manuals present it as a tool for *revealing* order, but philosophically, it is a tool for *imposing* a specific kind of order and then checking if the world complies.

  Here is a reconstruction of the implicit commitments, structured around your five questions, distinguishing between the mathematical necessities of the algorithm and the empirical necessities of the chronology.

  ### 1. The Picture of Cultural Change: Gradualism and Irreversibility

  The ordering rule presupposes a **Darwinian population model of traits** without necessarily invoking natural selection. Specifically, it requires three substantive claims about the behavior of stylistic traits in time:

  *   **The Life-Cycle Assumption:** Traits (types) behave like biological species in a fossil record: they originate (mutation/invention), increase in frequency (spread/drif/selection), peak, and go extinct (replacement).
  *   **The Non-Recurrence Assumption:** Once a trait frequency drops to zero, it does not return. This is the strongest empirical claim. It rules out cyclical fashion, deliberate archaism, or convergent invention of identical complex types.
  *   **The Sampling Sufficiency Assumption:** A zero in the frequency matrix is an *ontological zero* (the type did not exist), not an *epistemic zero* (the type existed but was not sampled).

  **Substantive Claim vs. Built-in Criterion:**
  This is where the method's "theoretical work" is most obscured. The algorithm *guarantees* a solution that approximates unimodality (mathematically, it minimizes a loss function). Therefore, finding a battleship curve is not evidence that the world behaves that way; it is evidence that the algorithm found the permutation that *least violates* that assumption.
  *   **Built-in:** The search for unimodality.
  *   **Substantive:** The claim that the permutation maximizing unimodality corresponds to *temporal succession*.
  If the underlying cultural process was cyclical, the algorithm would still produce a "best fit" linear order, but that order would be chronologically nonsense. Thus, unimodality is not a discovery of the method; it is a *prior constraint* imposed upon the data. The method presupposes that cultural change is gradual, directional, and irreversible over the scale of analysis.

  ### 2. Circularity: Coherence vs. Correspondence

  You are right to smell circularity, but in the philosophy of historical sciences, this is often framed as **abductive inference** (inference to the best explanation) rather than deductive validity.

  *   **The Vicious Reading:** If the only justification for the order is that it produces battleship curves, and the only justification for battleship curves is that they represent time, the argument is tautological. It creates a coherentist web where internal consistency is mistaken for external truth.
  *   **The Constraint-Satisfaction Reading:** Seriation should be viewed as generating a *hypothesis* of order. The unimodality is the internal consistency check. The external validity *must* come from independent anchors (stratigraphy, radiocarbon, dendrochronology).

  **The Problem of Sparse Validation:**
  Your concern about validation occurring at "only one or two sites" is the critical vulnerability. In PoS terms, this is **underdetermination**. If the stratigraphic check is local, but the seriation is regional, the method assumes **temporal synchrony** across the region. It assumes that Type A peaked at Site X and Site Y at the same time.
  *   **Verdict:** The circularity is not vicious *if* treated as a hypothesis generator anchored by independent data. However, in practice, the "anchoring" is often so thin that the method slides back into coherentism. The "agreement with stratigraphy" is often treated as a one-time validation of the *method*, rather than a continuous validation of the *specific sequence*. This allows the method to persist even when the regional synchrony assumption is false.

  ### 3. Necessary vs. Flattering Assumptions (Transmission Models)

  This is a crucial distinction for your thesis. You can separate the *mathematical conditions* for seriation from the *narrative conditions* archaeologists often attach to it.

  *   **What the Method Strictly Needs:**
      1.  **Transmission:** Traits must be copied from one assemblage to another (vertical or horizontal transmission).
      2.  **Continuity:** There must be sufficient connectivity between assemblages that they share the same pool of varying traits.
      3.  **Neutral Drift is Sufficient:** As demonstrated by Cultural Evolutionary Theory (e.g., Neiman 1995, Slatkin 1996), **random copying (neutral drift)** produces unimodal frequency distributions exactly like "fashion" or "directed selection."
      *   *Implication:* The method does **not** need agents to have preferences, emulate status, or follow trends. It only needs a population structure where traits are transmitted with some fidelity and subject to sampling variation.

  *   **What Merely Flatters It:**
      *   Narratives of "prestige," "emulation," "trade," or "cultural preference."
      *   When archaeologists write up seriation results, they often slip into intentionalist language ("the potters abandoned this form..."). This is a **narrative gloss**. The method is agnostic about *why* the frequency changed, only *that* it changed continuously.
      *   **The Loss:** By relying on neutral drift models, the method gives up the ability to distinguish between *active choice* and *passive inheritance*. This loss is rarely visible in write-ups, which often conflate the chronological ordering (which works under drift) with social interpretation (which requires distinguishing drift from selection).

  ### 4. The Tension: Style as Time vs. Style as Socially Empty

  This is the most profound philosophical tension in your audit. How can types be "classifier constructions" (nominalist) yet track "real time" (realist)?

  *   **The Resolution Condition:** For style to serve as an index of time while being no index of social identity, **stylistic transmission must be more pervasive than social boundary maintenance.**
  *   **The Assumption:** This requires a specific network topology. It assumes that while social groups (identities) may be distinct and bounded, the *copying network* for stylistic traits crosses those boundaries frequently enough to synchronize the "clock."
  *   **The Mechanism:** If I belong to Group A and you to Group B, and we never interact, our styles will diverge (seriation fails). If we interact constantly, our styles remain identical (seriation fails because there is no variation to order). Seriation requires a "Goldilocks" zone of interaction: enough to share the trait pool, but enough isolation/drift to allow frequencies to shift over time.
  *   **The Conflict:** The discipline's claim that "types do not map to social groups" is a safeguard against essentialism. But for seriation to work, types *must* map to **interaction spheres**. If types are purely arbitrary classifier constructs with no basis in how past agents copied behavior, there is no reason to expect their frequencies to change smoothly over time.
  *   **Synthesis:** The method implicitly assumes that the *classifier's types* approximate the *units of transmission* used by the agents. If the archaeologist's "Type A" lumps together two distinct cognitive categories used by potters, the frequency curve will be noisy. If it splits them too finely, sampling error dominates. Seriation works best when the archaeologist's typology accidentally aligns with the historical units of cultural transmission.

  ### 5. Rival Presuppositions: What Breaks the Method?

  You asked what would have to change to render orderings *unwarranted* rather than *noisy*. There are two "killer assumptions" whose removal collapses the inference.

  **A. The Palimpsest Problem (Time-Averaging)**
  *   **Assumption:** An assemblage (grave, midden, floor) represents a relatively short duration compared to the rate of stylistic change. It is a "snapshot."
  *   **Rival:** If assemblages are palimpsests accumulated over generations (long time-averaging), each assemblage contains a mix of "early," "middle," and "late" types.
  *   **Consequence:** The frequency curves flatten. The "battleship" becomes a "boxcar." The algorithm cannot distinguish the order because every assemblage looks like every other assemblage (all contain the full range of the curve).
  *   **Status:** This renders the ordering **unwarranted**. It is not just noise; it destroys the unit of analysis.

  **B. The Recurrence Problem (Cyclicity)**
  *   **Assumption:** Traits do not revive (Irreversibility).
  *   **Rival:** Styles are cyclical (e.g., architectural motifs that return every 300 years).
  *   **Consequence:** The frequency curve becomes multimodal (M-shaped).
  *   **Status:** Seriation algorithms can sometimes detect multimodality, but standard frequency seriation *forces* unimodality. If the world is cyclical, the algorithm will force the data into a linear order that places the "second wave" of the style either before the first or after the last, creating a chronological contradiction.
  *   **Distinction:** If the cyclicity is known, the method is **unwarranted**. If the cyclicity is unknown, the method produces a **false positive** that looks valid internally.

  **C. The "Typological Species" Assumption**
  *   **Assumption:** A "type" is a continuous lineage.
  *   **Rival:** A "type" is a convergent morphological solution that appears independently in different lineages (homoplasy).
  *   **Consequence:** Similarities are due to function/convergence, not common descent/transmission.
  *   **Status:** This breaks the link between similarity and temporal proximity. Seriation assumes similarity implies temporal proximity (via transmission). If similarity implies functional convergence, the order is **unwarranted**.

  ### Summary for your Reconstruction

  You can characterize Frequency Seriation not as a technique for finding time, but as a **test for whether a specific model of cultural transmission holds.**

  1.  **Implicit Theory:** It presupposes a world of gradual, irreversible, continuous transmission where assemblages are snapshots and types are transmission units.
  2.  **Circularity:** It is abductive, not deductive. It is valid only insofar as the "sparse anchors" (stratigraphy) are sufficient to rule out regional asynchrony.
  3.  **Agency:** It requires no intentional agency (drift suffices), though write-ups often imply it.
  4.  **Social/Time Tension:** It requires styles to track interaction networks more closely than social identities.
  5.  **Falsification:** The method is unwarranted (not just noisy) if assemblages are time-averaged palimpsests or if traits are homoplasious/cyclical.

  The "theoretical work" you sensed is the **imposition of a gradualist, evolutionary time onto material culture.** The method does not find time; it finds the arrangement that best fits an evolutionary model of time, and then asserts that because the fit is good, the model is correct. Your critique should focus on the **independence of the anchors** used to validate that assertion.
