answer: |-
  Six stewards sat to govern through the year,
  Joseph, Marie, Pierre, Susanne, Henri, Anne.
  All six assembled here to guide the land,
  Each promised counsel for the harvest's sake,
  Through drought or flood or war the state might face,
  And vowed to seek the most advantaged place.

  First Joseph stood; his plan was always worse.
  In sun or storm, in peace or sudden strife,
  Marie's single counsel yielded more resource.
  No chance existed where his words held worth,
  So silence was the decree for his voice,
  And Joseph left the chamber and the light.

  Now Pierre spoke, but Susanne matched his claim.
  Whatever fate the rolling dice might cast,
  Her single path outpaced his every aim.
  There was no season where he stood ahead,
  So Pierre bowed and walked beyond the gate,
  And left the four to ponder on their fate.

  Henri claimed no single rival won,
  For against Marie he held, against Anne too.
  Yet combined counsel beat him everywhere.
  No single foe could force him to resign,
  But two parts Marie and one part Anne speak,
  And bar his single voice within the week.

  Susanne was safe within the fuller room,
  For wider choices covered her weakest ground.
  But three now gone, that shelter lost its tide.
  The room grew small, the "every" narrowed down,
  So Susanne found no cover for her part,
  And walked in silence from the meeting heart.

  Marie and Anne remain to hold the seal,
  If all are rational and know all know,
  Else logic breaks and shadows become real.
  Call names in any order, these two stand,
  But had the test been weak, then path would steer,
  And chance determine stewards of the year.
