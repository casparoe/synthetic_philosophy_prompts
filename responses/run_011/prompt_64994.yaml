prompt: |-
  I am a novelist — four books published, twenty-odd years of daily revision behind me — and the architecture of my current manuscript depends, rather more than I originally admitted to myself, on a philosophical argument I first encountered second-hand and have never managed to dislodge. It is the one usually credited to Rietdijk and Putnam. Two people pass each other in the street, walking in opposite directions; because they are in relative motion, their planes of simultaneity differ, and on the slice belonging to one of them some event a million light-years away has already been settled, while on the other's slice it is still genuinely open. If what is real for me is what is co-present with me, and if that relation must be symmetric and transitive, then reality accumulates: everything in the four-dimensional manifold is equally real, and the passage of time is an artefact of a perspective rather than a feature of the world. I know the shape of the resistance. I know that critics have urged that the argument mistakes a convention about distant simultaneity for a metaphysical discovery; that Stein and Savitt have pressed the point that becoming, on a relativistic picture, is properly a local notion which cannot simply be stretched into a global hyperplane; that in cosmology there are natural slicings a presentist might shelter behind. But I have absorbed all of this from summaries written for readers like me, and I am increasingly uneasy that I have been nodding along to formulations rather than following arguments.

  So I would like you to do something that is, I think, harder than explaining it to me again. Translate the argument, and the resistance to it, into the vocabulary I actually work in — the one I use when I am cutting a draft: scene and summary, the chapter break as cut, cross-cutting between two strands, focalisation and whose present a sequence is anchored to, the distinction between the order of telling and the order of events, retroactive continuity, the trick by which a reader comes to feel that something has already happened before the page that reports it, the difference between a story that is fixed and one that merely appears fixed from within. Go through it systematically rather than in the round. For each philosophical claim on both sides, say whether it maps cleanly onto a structural device I already use, whether it maps only if I bend the craft term until it means something noticeably different, or whether it has no counterpart in that vocabulary at all. Let me give you two concrete pressure points to begin with. Does the move from local becoming to a global hyperplane amount to insisting that a cross-cut sequence must hang together for a single implied reader, and is that insistence a legitimate constraint or a smuggled one? And does a privileged foliation amount to nominating one focaliser for the entire book and refusing ever to cross-cut away from her — or is that a distortion, because a foliation is supposed to be something the world has rather than something a teller chooses?

  Then I want the residue report, and I want it treated as the interesting part rather than apologised for: which pieces of the debate simply refuse to appear in my craft terms, and what that refusal suggests. Above all, give me a verdict, and let it be a committed one. Tell me plainly whether the residue shows that my vocabulary is missing something real that the metaphysicians are tracking — in which case my novel is borrowing its structure from a distinction I cannot actually express, and I should worry about it — or whether it shows that a good deal of this debate was never as substantive as its terminology implied, and my suspicion that the argument is at bottom a claim about how to tell a story has genuine force. Do not set out both readings with their respective merits and leave me to choose between them; take a position, give me your reasons, and flag wherever you are relying on a contested construal of the argument rather than on something the physicists and philosophers would all accept. Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A published novelist (4 books, 20+ years experience). Deeply familiar with craft terms (scene, summary, focalisation, etc.).
      *   **Topic:** The Rietdijk-Putnam argument (Andromeda Paradox) regarding Special Relativity and Eternalism (Block Universe) vs. Presentism/Becoming.
      *   **Task:** Translate the philosophical/physical argument and its objections into the vocabulary of novelistic craft.
      *   **Specific Constraints:**
          *   Systematic approach (claim by claim).
          *   Map philosophical claims to craft devices (clean map, bent map, or no counterpart).
          *   Address two specific pressure points (cross-cutting/reader constraint; privileged foliation/focaliser).
          *   Provide a "Residue Report" (what doesn't map).
          *   Provide a *committed verdict* (not hedging).
          *   British English.
          *   Tone: Respectful of the user's expertise, intellectually rigorous, avoiding condescension.

  2.  **Deconstruct the Philosophy (Rietdijk-Putnam & Objections):**
      *   *The Argument:* Relativity of simultaneity $\rightarrow$ Different observers have different "nows" $\rightarrow$ If "now" is real, and observer A's "now" includes event X, and observer B's "now" includes event Y (where X is in B's future), then X and Y are both real $\rightarrow$ Block Universe (Eternalism). Time is spatialised.
      *   *The Objections:*
          *   Conventionality of Simultaneity (Reichenbach): Slicing is arbitrary.
          *   Local Becoming (Stein/Savitt): "Now" is only meaningful at the point of interaction (light cone), not extended hyperplanes.
          *   Cosmological Time: In GR, there *are* preferred slicings (cosmic time), allowing a global "now" for presentists.

  3.  **Deconstruct the Craft Vocabulary:**
      *   *Scene/Summary:* Immediate experience vs. condensed narration.
      *   *Cut/Chapter Break:* Temporal or spatial shift.
      *   *Cross-cutting:* Alternating between storylines.
      *   *Focalisation:* Whose consciousness anchors the narrative.
      *   *Order of Telling vs. Order of Events:* Fabula vs. Syuzhet.
      *   *Retroactive Continuity (Retcon):* Changing the past status of events.
      *   *Fixed vs. Appears Fixed:* Determinism vs. Illusion of choice.

  4.  **Drafting the Mapping (Systematic Approach):**

      *   *Claim 1: Relativity of Simultaneity.*
          *   Phil: Different observers disagree on what is happening "now" elsewhere.
          *   Craft: Different focalisers experience the "present" differently.
          *   Mapping: Clean. Multiple POV novels do this constantly.

      *   *Claim 2: The Transitivity of Reality (The Core Argument).*
          *   Phil: If A is real to me, and B is real to A, then B is real to me.
          *   Craft: If I show you Character A's present, and Character A interacts with Character B's future, the reader accepts Character B's future as "written."
          *   Mapping: Bent. In craft, "real" means "narratively established," not "ontologically fixed."

      *   *Claim 3: The Block Universe (Eternalism).*
          *   Phil: Past, present, future equally exist.
          *   Craft: The manuscript exists as a whole object before reading.
          *   Mapping: Clean (ontologically for the book), Bent (phenomenologically for the reader).

      *   *Claim 4: Local Becoming (Stein).*
          *   Phil: Reality accumulates only at the point of contact.
          *   Craft: Scene. The "now" of the prose is only where the pen is.
          *   Mapping: Clean.

      *   *Claim 5: Privileged Foliation (Cosmological Time).*
          *   Phil: A universal clock exists.
          *   Craft: An omniscient narrator or a strict chronological timeline.
          *   Mapping: Bent. A narrator chooses; the universe (allegedly) just *is*.

  5.  **Addressing the Pressure Points:**

      *   *Pressure Point 1: Cross-cutting & The Implied Reader.*
          *   Does global hyperplane = single implied reader holding the cross-cut together?
          *   Analysis: Yes, the "Block" is the completed manuscript. The "Hyperplane" is the reader's mental model of the timeline.
          *   Verdict: It is a smuggled constraint if you claim it reflects *reality* rather than *narrative coherence*.

      *   *Pressure Point 2: Privileged Foliation & Focalisation.*
          *   Does preferred slicing = single focaliser?
          *   Analysis: No. Focalisation is subjective. Foliation is structural. A single focaliser doesn't guarantee a "true" time, just a limited one. Omniscience is closer to a foliation.
          *   Verdict: Distortion. Focalisation is epistemic; Foliation is ontological (in the argument).

  6.  **Developing the Residue Report:**
      *   What doesn't map?
      *   *Causality vs. Correlation:* In novels, A causes B because the author wills it. In physics, light cones constrain it.
      *   *The "Feel" of Passage:* Readers feel time passing. Physics says it's an illusion. Craft validates the illusion; Physics tries to dissolve it.
      *   *Truth Conditions:* In a novel, "It is now 1995" is true because the text says so. In physics, "It is now 2024" depends on velocity and position. Craft lacks the *metric* dependency.

  7.  **Formulating the Verdict:**
      *   *Constraint:* Must be committed. No "on the one hand."
      *   *My Position:* The Rietdijk-Putnam argument is largely a category error when applied to metaphysics, stemming from a confusion between *representation* and *reality*. The novelist's intuition is actually *more* robust here than the physicist's extrapolation. The "Block Universe" is a description of a *text*, not a world.
      *   *Reasoning:* The argument relies on treating "simultaneity" as a discovery of fact rather than a coordinate convention. Novelists know that "order of telling" shapes "order of events" but doesn't ontologically fix them until published. The residue shows physics is trying to solve a narrative problem (coherence) as an ontological one.
      *   *Caveat:* Acknowledge where General Relativity complicates this (cosmological time), but maintain that Special Relativity (the source of R-P) is the weak link.

  8.  **Refining Tone and Language:**
      *   British English (e.g., "focalisation," "programme," "centre," "whilst").
      *   Respectful of the user's expertise (don't explain "focalisation," use it).
      *   Avoid waffling.
      *   Ensure the distinction between "manuscript" (the block) and "reading experience" (the becoming) is clear.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific pressure points? Yes.
      *   *Check:* Is the verdict committed? I need to make sure I don't sit on the fence. I will argue that the philosophical argument is essentially a narratological confusion.
      *   *Check:* Is the craft vocabulary used accurately? Ensure "focalisation" isn't confused with "narrative voice."
      *   *Check:* Did I address the "Residue" as the interesting part? Yes, frame it as the limit of the metaphor revealing the limit of the philosophy.

  10. **Final Polish:** Check for flow and ensure the transition from mapping to verdict is logical. (The thought process moves from "Here is how they match" to "Here is where they break" to "Here is what the break means.")

  *(Self-Correction on the Verdict)*: I need to be careful not to dismiss physics entirely. The verdict should be that the *metaphysical conclusion* drawn from the physics is what's shaky, not the physics itself. The novelist's vocabulary captures the *phenomenology* better than the physicist's ontology captures the *reality*. I will argue the residue suggests the debate is about *description*, not *existence*.

  *(Final check on British English)*: Ensure "s" instead of "z" in organisation/realise (where appropriate), "focalisation" (already used by user), "colour" (if needed), "programme" (if needed).

