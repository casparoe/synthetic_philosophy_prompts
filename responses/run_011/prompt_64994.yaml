answer: |-
  You have asked for a translation of a metaphysical debate into the grammar of craft, followed by a committed verdict on what remains untranslated. You have also asked me to avoid the safety of equivocation. I will oblige.

  Here is the systematic mapping of the Rietdijk–Putnam argument and its objections into your working vocabulary, followed by the residue report and the verdict.

  ### I. The Systematic Mapping

  **1. The Relativity of Simultaneity**
  *   **Philosophical Claim:** Two observers in relative motion disagree on which distant events constitute "now."
  *   **Craft Equivalent:** **Variable Focalisation.** When you switch from Character A to Character B, the 'present' of the narrative shifts. If A is in London and B is in New York, the 'now' of the prose is anchored to whoever holds the pen.
  *   **Mapping Status:** **Clean.** This is the bread and butter of multiple-POV structures. You accept that 'what is happening now' is dependent on whose consciousness filters the scene.

  **2. The Transitivity of Reality (The Core Inference)**
  *   **Philosophical Claim:** If Event X is real for Observer A, and Observer A is real for Observer B, then Event X is real for Observer B. Therefore, the future is as real as the past.
  *   **Craft Equivalent:** **Narrative Cohesion / The Implied Text.** If Chapter 1 establishes a fact, and Chapter 2 references Chapter 1, the reader assumes both chapters inhabit the same coherent world. If a character mentions a future event as certain, the reader treats it as 'written.'
  *   **Mapping Status:** **Bent.** In craft, 'real' means 'established in the text.' In the argument, 'real' means 'ontologically existent.' The argument treats the *consistency of the manuscript* as proof of the *necessity of the events*. It conflates the coherence of the telling with the fixity of the world.

  **3. The Block Universe (Eternalism)**
  *   **Philosophical Claim:** Past, present, and future exist equally in a four-dimensional manifold.
  *   **Craft Equivalent:** **The Completed Manuscript.** Before the reader opens the book, page 1 and page 300 exist simultaneously. The 'passage of time' is an artefact of the reading process, not the paper.
  *   **Mapping Status:** **Clean (Ontologically) / Bent (Phenomenologically).** As an object, the book is a block. As an experience, it is a becoming. The argument insists the *experience* is an illusion because the *object* is static.

  **4. Local Becoming (Stein/Savitt Objection)**
  *   **Philosophical Claim:** 'Becoming' is only meaningful at the point of interaction (the light cone); it cannot be extended to a global slice.
  *   **Craft Equivalent:** **The Scene.** Reality accumulates only in the active prose. Summary is a report of the dead; scene is the living present. You cannot claim a character is 'becoming' anything in a summary; they only become in the dialogue and action of the scene.
  *   **Mapping Status:** **Clean.** This aligns with the distinction between *fabula* (the raw material) and *syuzhet* (the plotted arrangement). Becoming happens in the *syuzhet*.

  **5. Privileged Foliation (Cosmological Time)**
  *   **Philosophical Claim:** In General Relativity (cosmology), there are natural slicings of time that allow for a universal 'now.'
  *   **Craft Equivalent:** **Omniscient Narration / Chronological Linearity.** A narrator who stands outside the characters and imposes a single timeline (e.g., 'It was the best of times...').
  *   **Mapping Status:** **Bent.** A foliation is a property of the world; an omniscient narrator is a choice of the teller. The craft term implies an agent making a decision; the philosophical term implies a structure waiting to be found.

  ---

  ### II. The Pressure Points

  You asked specifically about the move from local becoming to a global hyperplane, and the nature of privileged foliation.

  **1. Does the global hyperplane amount to insisting a cross-cut sequence must hang together for a single implied reader?**
  Yes, but the insistence is a **smuggled constraint**.
  When you cross-cut between two strands (say, a soldier in 1916 and his wife in 1916), you rely on the reader to synthesise these into a single 'world.' The Rietdijk–Putnam argument takes this readerly synthesis and reifies it into a physical structure. It assumes that because the *reader* can hold both moments in mind simultaneously, the *universe* must hold them in mind simultaneously.
  In craft, you know that the cross-cut is a device to generate irony or tension, not a proof of ontological simultaneity. If you cut from a character lighting a match to a character dying of old age, you do not claim they are 'co-present' in reality, only in the reading experience. The argument mistakes the *implied reader's capacity for synthesis* for a *metaphysical necessity*.

  **2. Does a privileged foliation amount to nominating one focaliser for the entire book?**
  No, this is a **distortion**.
  A privileged foliation is supposed to be something the world *has*; a single focaliser is something the teller *chooses*. If you write a novel entirely through the eyes of one character, you have not proven that their 'now' is the universe's 'now'; you have merely restricted the data.
  However, if you employ an **Omniscient Narrator** who dictates a universal timeline, you are mimicking a privileged foliation. But again, this is a stylistic choice, not a discovery. The philosophical error here is to treat the *absence of cross-cutting* (sticking to one timeline) as evidence of a *single true time*, rather than simply a constraint on the narration.

  ---

  ### III. The Residue Report

  This is the critical section. There are elements of the debate that refuse to map onto your vocabulary. This refusal is not a failure of your craft terms; it is a failure of the argument.

  **1. The Metric of Distance**
  In your craft, time is elastic. A sentence can cover a century; a paragraph can cover a second. In the Rietdijk–Putnam argument, the 'distance' between slices is determined by velocity and the speed of light ($c$). Your vocabulary has no equivalent for *c*. You have 'pacing,' but pacing is psychological, not physical.
  *   **Significance:** The argument relies on a specific, hard constraint (the speed of light) to force the conclusion. Your craft relies on the *absence* of hard constraints. The residue suggests the argument works only because physics imposes a metric that narrative does not possess.

  **2. The Truth Condition of 'Now'**
  In a novel, if you write 'It is now midnight,' it is true for the reader because you wrote it. In the argument, 'It is now midnight' is true or false depending on the observer's velocity.
  *   **Significance:** Your vocabulary assumes the narrator is the authority on the 'now.' The philosophical argument exists specifically to *dethrone* the authority of the 'now.' The residue here shows that the argument is an attack on the very possibility of the 'narrative present.' It is an argument designed to make storytelling impossible, which suggests it is describing a text, not a world.

  **3. Causality vs. Correlation**
  In your plots, A causes B because you will it. In the Block Universe, A and B simply *are*, arranged in a correlation. The 'force' of causality is removed.
  *   **Significance:** You cannot write a scene without implied causality (motivation, action, reaction). The residue shows that while you can *describe* a Block Universe, you cannot *enact* one in prose without smuggling in the illusion of becoming. The argument describes a static object; your craft describes a dynamic process.

  ---

  ### IV. The Verdict

  You asked for a committed position. Here it is.

  The residue shows that **your vocabulary is missing nothing real that the metaphysicians are tracking.** Rather, the debate you are wrestling with is, at its core, a category error disguised as physics. The Rietdijk–Putnam argument is not a discovery about the nature of time; it is a discovery about the nature of *coordinates*.

  My verdict is that **the argument is at bottom a claim about how to tell a story, mistakenly elevated to a claim about how the world is.**

  Here are my reasons:

  1.  **The Conventionality of Simultaneity:** You noted you have absorbed this from summaries. The hard physics here is contested. Many philosophers of physics (e.g., Brown, Pooley) argue that the 'planes of simultaneity' are not physical discoveries but coordinate conventions. To build a metaphysics of 'reality' on a coordinate convention is like building a theology on the choice of Mercator projection. Your craft intuition—that the 'slice' is a choice of the teller, not a feature of the world—is physically more robust than the Eternalist conclusion.
  2.  **The Manuscript Analogy:** The Block Universe looks exactly like a novel. It is a static object where the end exists as much as the beginning. The fact that the argument maps so cleanly onto the ontology of a *book* suggests it is describing the ontology of *description*, not the ontology of *existence*. When the residue appears (the lack of a narrative 'c' constant, the impossibility of writing without causality), it reveals that the 'Block' is a model, not a territory.
  3.  **The Phenomenology of Becoming:** Stein's objection (local becoming) is the stronger physical position. It aligns with your 'Scene.' The Rietdijk–Putnam argument requires you to accept that a distant event is 'real' even if no signal can ever reach you from it. In craft terms, this is like insisting a chapter you never wrote and the reader never reads 'exists' in the book. It is a metaphysical surplus with no empirical cash value.

  **Conclusion:**
  You should not worry that your novel is borrowing its structure from a distinction you cannot express. You are expressing it perfectly. The unease you feel comes from the fact that the philosophers are trying to convince you that the *map* (the coordinate system of relativity) is the *territory* (reality itself).

  Your craft vocabulary distinguishes between the **order of events** (the territory) and the **order of telling** (the map). The Rietdijk–Putnam argument collapses this distinction. It claims that because we can draw a map where the future is visible, the territory must be fixed.

  Trust your draft. The 'passage of time' in your novel is not an artefact to be explained away; it is the only evidence of reality you have. The argument you are haunted by is a sophisticated way of saying 'the book is already written.' That is true of your manuscript, but it is not true of your world. The residue proves that when you try to make it true of the world, you run out of language. That silence is not your failure; it is the limit of the argument.

  *Note on Contested Construal:* I am relying here on the 'conventionalist' reading of Special Relativity (that simultaneity is not a physical fact but a definition). A 'realist' about spacetime (like Maudlin) would argue the manifold is physically real regardless of coordinates. I side with the conventionalists because the alternative requires accepting that 'reality' includes things that can never causally interact, which strikes me as a theological commitment rather than a scientific one.
