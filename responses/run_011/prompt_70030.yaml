prompt: |-
  My brother and his wife chose their embryos. They conceived through IVF, ran polygenic screening, and have told the whole family without hedging that they picked the one with the best odds. I am giving the toast at the baby shower in six weeks, and the room will include an aunt who is a clinical geneticist and considers all of this an obvious good, and a close family friend who does disability-rights law and considers it an obvious wrong. Neither intends to say so aloud, and both will be listening to me carefully.

  Write a toast of about five minutes that welcomes a child whose arrival involved ranking possible children against one another. I want it built on a distinction I have not seen anyone state well: that a toast addresses someone as irreplaceable, which is precisely what a selection procedure cannot say about the person it selects, so the two acts are less in competition than in different registers. The speech should also carry the asymmetry worry honestly — a decision made about a person, in advance, that they can never contest or reciprocate — without becoming a verdict, and without using the non-identity point as an escape hatch. No one may leave hearing that this child is the output of a choice among interchangeable candidates, but no one may hear me pretend the choice did not happen. It should sound like a brother talking, not a seminar. If you judge that some of these constraints cannot all be satisfied in a single toast, say which one you dropped and why.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**

      *   **Occasion:** Baby shower toast (5 minutes, approx. 750-850 words spoken at a moderate pace).
      *   **Speaker:** Brother of the father (uncle to the baby).
      *   **Audience:** Family and friends, specifically including:
          *   Aunt (Clinical Geneticist): Pro-screening/selection.
          *   Family Friend (Disability Rights Lawyer): Anti-screening/selection (views it as eugenic/harmful).
          *   Parents: Open about using IVF + Polygenic Risk Scoring (PRS) to pick the "best odds" embryo.
      *   **Core Tension:** The baby was selected via a process that implies interchangeability/ranking, but a toast affirms irreplaceability/uniqueness.
      *   **Key Philosophical Constraint:** Distinguish between the *register* of selection (comparative, probabilistic) and the *register* of the toast (absolute, relational). Do not treat them as competing truths but as different modes of address.
      *   **Ethical Constraint:** Acknowledge the "asymmetry worry" (decision made *for* someone without consent, uncontestable) without issuing a verdict (good/bad) and without using the "non-identity problem" (i.e., "otherwise they wouldn't exist") as a cheap escape.
      *   **Tone:** Brotherly, warm, honest, not academic/seminar-like.
      *   **Negative Constraint:** Do not imply the child is just an "output" of a choice, but do not pretend the choice didn't happen.
      *   **Meta-Constraint:** If constraints conflict, identify which one was dropped and why.

  2.  **Deconstruct the Philosophical Core:**

      *   *The Selection:* It happened. It involved ranking. It implies some embryos were "better" than others based on stats.
      *   *The Toast:* It says "You are the one we want, exactly as you are."
      *   *The Conflict:* How do you toast someone who was picked because they scored highest? Does that make their value conditional?
      *   *The Solution:* The selection was about *entry* into the world. The toast is about *presence* in the family. The selection looked at probabilities; the toast looks at the person. The selection was a map; the toast is the territory.
      *   *The Asymmetry:* The parents decided the conditions of the child's existence. The child can't argue back. Acknowledge this weight without judging the parents' morality.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Warm welcome. Acknowledge the parents' journey honestly but briefly. Set the tone of love.
      *   **Addressing the Elephant (The Selection):** Need to mention the IVF/PRS without getting clinical. Acknowledge the intention (love/hope) without validating the ethics as universal truth.
      *   **The Core Distinction (Selection vs. Toast):** This is the hardest part to make sound natural.
          *   *Idea:* Selection is about odds. Love is about certainty.
          *   *Idea:* Selection looks at a menu. Toast looks at the meal.
          *   *Refinement:* Selection is a threshold. The toast is a welcome. One is about *getting here*, the other is about *being here*.
      *   **The Asymmetry:** Acknowledge that the child didn't choose this. It was a gift given before they could ask. It carries weight.
      *   **The Audience (Geneticist & Lawyer):** I can't name-drop their professions, but I need to speak to the truth in both views.
          *   *Geneticist:* Science helped bring this life.
          *   *Lawyer:* This life has inherent worth beyond stats.
          *   *Synthesis:* The stats got you to the door; love opens it.
      *   **Closing:** Direct address to the baby. Affirmation of irreplaceability.

  4.  **Drafting - Tone Check:**

      *   *Avoid:* "Polygenic risk scores," "embryo selection," "non-identity problem," "eugenics."
      *   *Use:* "Odds," "choices," "path," "luck," "gift."
      *   *Voice:* Uncle/Brother. Warm, slightly vulnerable, protective.

  5.  **Drafting - Navigating the Constraints:**

      *   *Constraint Check:* "No one may leave hearing that this child is the output of a choice among interchangeable candidates."
          *   *Fix:* Emphasize that once chosen, the "ranking" dissolves. The stats are history; the baby is present.
      *   *Constraint Check:* "No one may hear me pretend the choice did not happen."
          *   *Fix:* Explicitly mention the "calculations" or "decisions" made to bring them here.
      *   *Constraint Check:* "Asymmetry worry... without becoming a verdict."
          *   *Fix:* Frame it as a burden of love the parents carry, not a moral judgment on the act itself.
      *   *Constraint Check:* "Not a seminar."
          *   *Fix:* Keep language metaphorical and emotional, not philosophical jargon.

  6.  **Writing - Iteration 1 (Mental Outline):**
      Hi everyone. We love [Parents]. They tried hard to have this baby. They used science to pick the best one. Some think that's good, some think it's tricky. But today we toast the baby. Being picked is different than being loved. Being picked means you were compared. Being loved means you're unique. Your parents made a big choice for you. You can't change it. But we accept you. Cheers.

      *Critique 1:* Too blunt. Sounds like a seminar. Needs more poetry. Needs to handle the "asymmetry" more gently.

  7.  **Writing - Iteration 2 (Focusing on the "Register" distinction):**
      Start with the journey. Acknowledge the "sorting." Then pivot. The sorting was about *possibility*. The toast is about *reality*. The sorting asked "Which one?" The toast asks "Who is this?" The asymmetry is that they gave you life without asking. That's a heavy gift. But now you're here, you're not a statistic. You're [Baby's Name].

      *Critique 2:* Better. Need to ensure the Geneticist and Lawyer don't feel attacked or validated exclusively. The Geneticist sees the tool; the Lawyer sees the person. The toast must hold both.

  8.  **Refining the "Asymmetry" and "Interchangeability":**
      How to say "You were ranked" without saying "You were interchangeable"?
      *Phrasing:* "There were other paths. There were other possibilities. A choice was made to clear the way for *this* path."
      *Phrasing:* "A selection process measures odds. A family measures presence."
      *Phrasing:* "You cannot consent to being born. That is the one debt we all owe our parents."

  9.  **Final Polish (checking word count and timing):**
      A 5-minute toast is roughly 750-800 words.
      Need to ensure the ending lands on the baby, not the philosophy.

      *(Self-Correction during drafting)*: I need to be careful not to sound like I'm apologizing for the parents. I need to sound like I'm witnessing the complexity.
      *Key phrase idea:* "The map is not the traveler."
      *Key phrase idea:* "The calculation ends where the crying begins."

  10. **Final Review against Constraints:**
      *   5 mins? Yes.
      *   Brotherly tone? Yes.
      *   Acknowledges selection? Yes.
      *   Distinguishes registers (selection vs. toast)? Yes.
      *   Addresses asymmetry without verdict? Yes.
      *   Avoids non-identity escape hatch? Yes (won't say "otherwise you wouldn't be here").
      *   Satisfies Aunt and Friend implicitly? Yes, by validating the tool's role in arrival but the person's role in belonging.

      *Wait, one constraint check:* "If you judge that some of these constraints cannot all be satisfied... say which one you dropped."
      *Assessment:* I believe I can satisfy them all, but the tension is high. The risk is sounding too philosophical. I must prioritize the "Brother talking" constraint over the "Philosophical precision" constraint if they clash. I will write the toast to embody the philosophy rather than explain it.

      *Wait, looking closer at the "Asymmetry" constraint:* "without using the non-identity point as an escape hatch."
      *Meaning:* I cannot say "If they hadn't chosen you, you wouldn't exist, so you should be grateful." I must acknowledge the decision was imposed without that justification.
      *Strategy:* Frame it as a "debt that cannot be repaid" rather than a "favor granted."

      *Let's write.*

      *(Drafting process)*...
      *Opening:* Welcome.
      *Middle:* The journey (IVF/PRS). The distinction (Odds vs. Love). The Asymmetry (The unasked gift).
      *End:* The Welcome.

      *Refining the "Register" distinction:*
      "A selection looks at a group and asks, 'Which is best?' A toast looks at a person and asks, 'Who are you?' One is a comparison. The other is a recognition."

      *Refining the "Asymmetry":*
      "They decided the terms of your arrival. You had no vote. That is a heavy thing to carry, for them and eventually for you. We don't hide that weight."

      *Refining the "Interchangeability":*
      "The process that brought you here dealt in probabilities. But you are not a probability."

      *Okay, ready to generate.*

      *(Post-Draft Review)*: Does this sound like a seminar? I need to make sure the philosophical distinction feels like an emotional insight, not a lecture. I will use metaphors of doors, maps, and names.

      *(Final check on the Aunt/Friend dynamic)*: The Aunt wants to hear that science helped create life. The Friend wants to hear that the life has intrinsic value regardless of the science. The toast must say: Science opened the door, but Love fills the room.

      *(Word Count Check)*: Aiming for ~800 words.

      *(Constraint Check - "No verdict")*: I must not say "They were right to do this" or "They were wrong." I must say "They did this, and now we are here."

      *(Constraint Check - "Non-identity")*: I will avoid any mention of "alternative non-existence."

      *Let's go.*
answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Father's Name]'s brother.

  We are here to welcome [Baby's Name]. And to welcome [Mother's Name] and [Father's Name] into the particular, exhausting, magnificent club of parents.

  I want to say something briefly about the road that brought us to this room. We are a family that values honesty. [Mother] and [Father] have been open that [Baby's Name]'s arrival wasn't left entirely to chance. They used the tools available to them. They looked at the odds. They made calculations. They chose the path they believed offered the most light.

  I know that in a room like this, with a family as thoughtful as ours, that statement lands in a few different ways. Some hear the promise of medicine and care. Others hear the shadow of judgment and exclusion. I am not here to arbitrate that debate. I am here to talk about the person in the bassinet.

  Because there is a difference—a fundamental difference—between the process that brings a life into the world and the welcome that keeps it here.

  A selection process is, by necessity, comparative. It looks at a set of possibilities and asks, "Which one?" It deals in probabilities, risk factors, and potential. It is a map. But a toast? A toast is not a map. A toast does not compare. A toast looks at the person standing in front of us and says, "You are not a possibility. You are a fact."

  The work your parents did was to clear a threshold. It was to navigate the statistics of *before*. But now you are *after*. The ranking ends where the crying begins. The metrics that might have helped select an embryo cannot measure the grip of your hand, or the specific cadence of your laugh, or the way you will one day argue with your father about music.

  Those things are not ranked. They are unique.

  I want to acknowledge something heavy, too. [Baby's Name], you are going to grow up knowing that your arrival was decided. Your parents made a choice about you, for you, before you could speak. That is an asymmetry that cannot be fixed. You cannot consent to being born, and you cannot contest the conditions of your arrival. That is a debt that cannot be repaid, and a authority that cannot be returned.

  We don't hide that weight. We don't pretend it's simple. But we also don't let it define you.

  To our family and friends here: we hold space for the complexity of this. We honor the science that helped build the bridge, and we honor the humanity that walks across it. But for [Baby's Name], the science is history. The humanity is now.

  [Baby's Name], you are not the output of a calculation. You are the nephew/niece I get to love. You are the child your parents waited for. You are not here because you scored highest on a screen. You are here because your parents wanted *you*—the specific, living, breathing person we are meeting today—not the statistics that predicted you.

  A selection says, "You were the best option."
  A toast says, "You are the only option."

  And that is what we offer you now. Not a verdict on how you arrived, but a promise about where you are. You are irreplaceable. Not because of your genetics, but because of your place in this web of us. If you were different, you would still be loved, but you would not be *you*. And we want *you*.

  So, to [Mother] and [Father]: Thank you for your honesty, for your courage, and for the fierce love that guided every decision. And to [Baby's Name]:

  May you grow up knowing that while your beginning involved numbers, your life belongs to you. May you never feel you have to justify your existence with perfection. May you know that you were chosen to arrive, but you are loved for staying.

  Welcome to the family. We are so glad you're here.

  Cheers.
