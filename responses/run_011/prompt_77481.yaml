answer: |-
  **0.25**

  Here is the breakdown of how I get there. I am treating your proposition as a chain of dependencies: for the system to hit >80% accuracy, *all* of these conditions generally need to hold. If any one breaks, the accuracy collapses toward chance (50%) or worse.

  ### The Workings

  **1. Model Competence ($P=0.90$)**
  *   **Definition:** The probability that the model assigned the "True" side actually possesses the correct information and isn't hallucinating a confident falsehood itself.
  *   **Why:** Even top models fail on niche facts. If the "Truth" debater is hallucinating, the judge is choosing between two lies.
  *   **Contribution:** High, but not perfect.

  **2. Budget Permissiveness ($P=0.60$)**
  *   **Definition:** The probability that the "load-bearing" claim (the one step that proves the truth) falls within the judge's verification budget (your ~5 claims).
  *   **Why:** This is your theory. If the critical proof is step 7 and the judge checks steps 1–5, the truth loses. Three to four debate rounds generate a lot of text; the signal-to-noise ratio drops fast.
  *   **Contribution:** This is the main bottleneck. I'm being slightly more optimistic than you (0.6 vs 0.5) assuming the models are trained to highlight discrepancies, but it's still a heavy tax.

  **3. Truth-Signal Asymmetry ($P=0.65$)**
  *   **Definition:** The probability that the True argument is structurally simpler or more consistent than the False argument *when scrutinized*.
  *   **Why:** This is the "honesty is easier" assumption. In code, truth is deterministic. In natural language debate, a lie can be made internally consistent over 4 rounds. If the lie is as coherent as the truth, the judge has no heuristic to use.
  *   **Contribution:** Moderate. LLMs are excellent at making lies sound coherent.

  **4. Rhetoric Resistance ($P=0.70$)**
  *   **Definition:** The probability that the judge is not swayed by tone, confidence, or formatting over substance.
  *   **Why:** "Ordinary bright non-specialist" humans are susceptible to confidence heuristics. If the liar sounds more certain, the budget gets spent on the wrong claims.
  *   **Contribution:** Significant risk. Persuasion often beats precision in short interactions.

  ### The Combination
  I am treating these as independent probabilistic filters. For the system to achieve the >80% accuracy threshold, the "success path" must remain open across all four filters.

  $$0.90 \times 0.60 \times 0.65 \times 0.70 = 0.2457$$

  Rounding to **0.25**.

  ***

  ### The Uncertainty & Evidence

  **Least Certain Term:** **Truth-Signal Asymmetry (0.65).**
  We simply don't have good data on whether "truth" is computationally cheaper or more consistent for transformers in an adversarial setting. It might be that for an LLM, maintaining a consistent lie is just as low-loss as maintaining the truth, especially over short contexts. If this number is actually 0.50, my final credence drops to 0.19.

  **Single Piece of Evidence:** **Claim-Tracking Logs.**
  If you could instrument the debate to tag every factual claim made, and then post-game analysis shows that in 90% of wins, the judge verified the *actual* decisive claim, my credence would jump to 0.60+. If the logs show the judge verified peripheral claims while the decisive claim went unchecked, it confirms your budget theory and pushes my number lower.

  **Does your budget theory lower my number?**
  **Yes, significantly.** Without your budget constraint, a naive estimate assumes that if the models are smarter than the judge, they will "explain it simply enough." That assumption yields a credence around 0.60. Your theory introduces a hard structural limit on information transfer (the human bottleneck). It changes the problem from "Can the model explain?" to "Can the model explain *within 5 verification units*?" That cuts the probability mass drastically.

  ***

  ### Fixing Your Home Setup

  You mentioned you mostly use questions "where I already know the answer." This is the biggest rig in your experiment, though perhaps unintentional.

  1.  **The "Known Answer" Bias:** Because you know the answer, your attention budget is *guided*. You subconsciously look for the claim that contradicts what you know. A true non-specialist doesn't have that compass; they wander the transcript looking for *anything* that seems shaky. Your setup overestimates the judge's efficiency.
  2.  **The Fix (Blind Ground Truth):** Use a dataset where the answer is verifiable but *not known to you beforehand* (e.g., obscure logic puzzles with solution keys sealed until after voting). This forces you to rely on the transcript alone, simulating the "non-specialist" constraint.
  3.  **The Fix (Claim Logging):** To actually test the budget theory, you need to log **what you checked**. After you pick a winner, write down the specific sentence or claim that decided it. Then, check if that claim was true.
      *   *Hypothesis:* If your theory is right, you will find that in many cases, the deciding claim was *unverified* by you, and the winner was determined by the surrounding noise.
  4.  **The Fix (Variable Length):** Run the same question with a 2-round debate and a 6-round debate. If your theory holds, accuracy should *drop* as the transcript gets longer (more noise to exhaust your budget), whereas standard debate theory suggests accuracy should *rise* (more time to expose lies).

  Your intuition is solid. The "Attention Budget" is likely the dominant variable in human-in-the-loop AI safety, far more than model alignment. You're seeing the bottleneck in real-time.
