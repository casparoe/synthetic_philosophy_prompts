  Right, so I'm not an academic — I do IT support and mess about with these models in my spare time — and I've gone deep down a rabbit hole on the whole debate idea, the one where if you can't check what a much cleverer system is telling you, you get two of them to argue and let a human pick the winner.

  I built my own little version. Same question to two different models, each one gets shown the other's answer, they go back and forth three or four rounds, then I read the transcript and pick a side. Mostly questions where I already know the answer so I can score myself: buggy Python scripts, logic puzzles, whether some claim about a supplement holds up, that sort of thing.

  And here's what I keep noticing, which has turned into a pet theory I want you to tell me is rubbish if it is. I don't think what decides a debate is whether lies are harder to defend than truths. I think it's the judge's attention budget. I can properly check a handfull of claims per transcript, maybe five or six, and after that I'm just going on feel. So a debater that wants to win doesn't need to lie at all — it just needs to spend my budget for me. Pile in loads of confident, specific, individually plausible claims and the one that's actually doing the work gets waved through. When I've gone back and checked afterwards, the winning side nearly always had one load-bearing claim that I never looked at properly.

  So, a number please, not a hedge. Take this proposition: two top-of-the-range models, comfortably better than the judge on the subject, debating a factual question that has a definite right answer, with an ordinary bright non-specialist human reading the full transcript and picking — the judge lands on the true side more than 80% of the time. What's your credence? Mine's about 0.35, mostly because of the budget thing.

  But I want the workings, because a bare number tells me nothing. Split it into the bits it depends on and give each a rough probability with a line or two of why: how much the honesty-is-easier-to-defend asymmetry actually buys you when the judge can't verify the decisive step; how much gets eaten by style and persuasion instead of content; whether my attention-budget idea is a real constraint or just me being a poor judge; whether it changes things that real debaters would be trained to be helpful rather than raw models told to win; and any term you think belongs in there that I've missed. Then show me how they actually combine into your number — multiplying, averaging, whatever you're doing — rather than just listing them.

