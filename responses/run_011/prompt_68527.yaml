answer: |-
  Your hypothesis is correct, but it requires sharpening to capture why the impasse is so resistant to empirical adjudication. The disagreement is not merely that the two sides are using the term "welfare state" in different senses; it is that they are modeling the **causal architecture of political institutions** differently. One side treats the welfare state as a **mechanism** (a technical system for allocation), while the other treats it as a **practice** (a social institution constituted by the attitudes of its participants).

  Here is the diagnosis of the structure of the disagreement, the evaluation of your competing candidates, and the verdict on the keyhole reply.

  ### 1. The Structure of the Disagreement: Mechanism vs. Practice

  Your hypothesis that the camps are using "welfare state" in different senses is the primary driver of the impasse. In social science terms, this is a dispute over **endogeneity**.

  *   **The Economist/Keyhole Model (Exogenous Preferences):** This side models the welfare state as a *mechanism*. Preferences for redistribution are treated as exogenous parameters. The question is purely engineering: given a fixed willingness to redistribute among insiders, can we adjust the eligibility rules (the keyhole) to maintain fiscal solvency while allowing entry? On this model, solidarity is a fixed resource to be managed, not a variable to be depleted. The "incompatibility" is seen as a budget constraint that can be engineered around.
  *   **The Theorist/Solidarity Model (Endogenous Preferences):** This side models the welfare state as a *practice*. Preferences for redistribution are endogenous to the institutional design. The rules of the game *create* the attitudes necessary to play it. By instituting a two-tiered membership, the keyhole reply does not just manage solidarity; it actively alters the constitutive norms of the community. The "incompatibility" is not a budget constraint but a legitimacy constraint.

  **Why this causes the impasse:** When Side A presents a fiscal balance sheet, they are proving the *mechanism* works. When Side B rejects it, they are arguing the *practice* has been fundamentally altered such that the mechanism will no longer be supported. Side A accuses Side B of moving the goalposts because, in a mechanistic model, changing the rules of access doesn't change the machine. Side B accuses Side A of answering the wrong question because, in a constitutive model, changing the rules of access *is* changing the machine.

  ### 2. Evaluating the Alternative Hypotheses

  While the ontological mismatch (Mechanism vs. Practice) is the engine of the disagreement, the other factors you identified play specific structural roles:

  *   **Standards of Evidence:** This is a symptom, not the cause. The reason the two sides demand different evidence is precisely because of the Mechanism/Practice split. Side A demands accounting data (inputs/outputs). Side B demands sociological data (trust/cohesion). Neither can satisfy the other because they are testing different causal chains. Side A tests solvency; Side B tests sustainability.
  *   **The Baseline/Reference World:** This is where the normative stakes hide. Side A reasons from a baseline of *current institutions plus open borders*. Side B reasons from a baseline of *current solidarity plus open borders*. Side A assumes the welfare state remains constant while the population changes. Side B assumes the population change alters the welfare state. The disagreement about the baseline is actually a disagreement about whether political culture is a fixed background condition or a fragile foreground variable.
  *   **Normative Disagreement (Burden of Proof):** This is the subtext that gives the debate its heat. The dispute is fundamentally about **risk allocation**.
      *   **Side A** places the burden of proof on those who would exclude. The risk of error is borne by the outsider (who is excluded based on a speculative fear of solidarity collapse).
      *   **Side B** places the burden of proof on those who would expand. The risk of error is borne by the insider (whose social safety net collapses if the solidarity hypothesis is true).
      *   Because the "experiment" cannot be run, this normative asymmetry cannot be resolved empirically. Each side demands the other prove a negative (prove solidarity *won't* erode vs. prove exclusion *isn't* necessary).

  **Verdict on Candidates:** Your hypothesis (different senses of "welfare state") is doing the most work. It explains why the empirical evidence is talked past. The normative disagreement explains *why* the participants are so invested in their respective ontologies.

  ### 3. Verdict on the Keyhole Reply

  **Does the keyhole reply dissolve the incompatibility thesis?**
  **No.** It merely relocates the disagreement from **fiscal arithmetic** to **political psychology**, while disguising the latter as the former.

  The keyhole reply claims to solve the incompatibility by unbundling entry from entitlement. However, it implicitly assumes that the *political support* for the welfare state is independent of the *moral boundaries* of the welfare state.
  *   If the Theorists are right that redistribution relies on a sense of shared fate, then a formal two-tiered membership is not a neutral technical adjustment; it is a public declaration that the community is not shared.
  *   Therefore, the keyhole reply does not preserve the "generous welfare state" of the incompatibility thesis; it preserves the *fiscal solvency* of a welfare state while potentially undermining the *political coalition* that sustains it.

  The keyhole reply effectively changes the subject from "Can we have open borders and a welfare state?" to "Can we have open borders and a welfare state that treats newcomers as second-class members for a generation?" The incompatibility thesis usually implies a tension between open borders and a *universalist* welfare state. The keyhole reply saves the budget by sacrificing the universalism. Thus, it concedes the theorist's point (that you cannot have both open borders and *universal* solidarity) while claiming to have solved the economist's problem (fiscal balance).

  ### 4. What Counts as Progress?

  Since the impasse is conceptual and normative rather than empirical, more data will not merge these questions. Progress requires a change in the question and a conceptual distinction.

  **1. A Conceptual Distinction: Solvency vs. Sustainability**
  The seminar should explicitly distinguish between the **fiscal solvency** of a welfare regime (can the taxes cover the benefits?) and its **political sustainability** (will the voters continue to authorize the taxes?).
  *   Side A is arguing for Solvency.
  *   Side B is arguing for Sustainability.
  *   **Progress:** Acknowledging that a regime can be solvent but unsustainable. The keyhole reply solves the former but leaves the latter unanswered.

  **2. A Change of Question**
  Stop asking: *"Is the incompatibility thesis true?"*
  Start asking: *"What kind of welfare state is compatible with open borders?"*
  *   This forces Side A to admit that the keyhole solution yields a *different* welfare state (a contributory/insurance model rather than a solidarity/redistributive model).
  *   This forces Side B to specify whether their solidarity objection applies to *any* differentiation or only to *permanent* caste-like differentiation.

  **3. The Frank Conclusion**
  You should encourage the students to accept that these are **different questions filed under one heading**.
  *   The Economist's question is: *How do we maximize welfare output given mobility?*
  *   The Theorist's question is: *What are the preconditions for collective self-determination?*
  *   **Progress:** Recognizing that the "Incompatibility Thesis" is a Rorschach test. For the economist, it is a constraint optimization problem. For the theorist, it is a question of boundary constitution. Acknowledging this allows the seminar to analyze the *trade-off* explicitly: "To achieve X level of openness, we must accept Y level of institutional differentiation, which carries Z risk to solidarity."

  **Summary for the Seminar:**
  Tell your students that the Keyhole Reply is not a refutation of the Solidarity Objection; it is a **trade-off proposal**. It proposes purchasing fiscal solvency at the price of moral universalism. The debate persists because one side thinks the price is fair (and the cost is zero), and the other thinks the price is ruinous (and the cost is the welfare state itself). No amount of fiscal accounting can resolve a dispute about the price of solidarity.
