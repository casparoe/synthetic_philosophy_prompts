      *   *Side B (Solidarity)* treats the welfare state as a **social contract**. It's a relationship. It relies on *why* people put money in. If the motivation is "because we are one people," and you create a class of "not quite one of us," the motivation collapses. The "incompatibility" is a feature of human psychology and political legitimacy, not a bug in the budget.
