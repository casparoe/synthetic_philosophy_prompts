answer: |-
  ### Desiderata for a Theory of Pleasure

  To defend welfare hedonism as a substantive thesis rather than a tautology, the account of pleasure must satisfy the following six requirements. Each is motivated by a specific phenomenological or conceptual constraint.

  1.  **Extensional Adequacy (Heterogeneity):** The account must capture the full range of experiences intuitively classified as pleasant. It must find the common thread between the sensory enjoyment of a **ripe peach**, the intellectual satisfaction of **finishing a proof**, and the emotional warmth of **hearing good news about a friend**. A theory that accounts only for bodily sensations is too narrow; a theory that accounts only for propositional satisfaction is too cold.
  2.  **Valence Independence (Context Sensitivity):** The account must distinguish the pleasantness of an experience from its raw sensory character. It must explain how **the same bodily sensation** (e.g., a specific pressure on the skin) can be **enjoyed by one person and loathed by another**, or by the same person in different moods. If pleasure were identical to the sensation, this variance would be impossible.
  3.  **Temporal Stability (Retrospection):** The account must handle the temporal dynamics of evaluation. It must make sense of the **gruelling climb that felt awful throughout** yet is **enjoyed in hindsight** as a source of pride or satisfaction. The theory must clarify whether the pleasure resides in the moment-by-moment phenomenology or in the reflective attitude taken toward the experience later.
  4.  **Motivational Neutrality:** The account must distinguish what makes a state pleasant from what makes it sought after. It must accommodate evidence that **what makes a state sought after comes apart from what makes it feel good** (e.g., addiction, maladaptive preferences, or self-sacrifice). Pleasure cannot be defined simply as "that which is desired."
  5.  **Quantifiability (Magnitude):** The account must specify **what varies when pleasure varies in amount**. Whether hedonism weighs intensity, duration, or certainty, the theory must identify the property that admits of more or less. A binary account (pleased/not pleased) cannot support the hedonic calculus required for welfare comparisons.
  6.  **Normative Explanatoriness:** The account must show how the property identified **explains why that experience is good for its subject rather than merely marking it off**. It is insufficient to label a state "pleasant"; the theory must illuminate why possessing this property confers prudential value.

  ### Universal Requirements vs. Local Preferences

  Not all constraints listed above are binding on every viable theory; some are artifacts of specific philosophical commitments.

  *   **Universal Requirements (Every candidate must meet):** Extensional Adequacy, Normative Explanatoriness, and Quantifiability. Any theory claiming to ground welfare must cover the relevant phenomena, explain their value, and allow for comparison.
  *   **Local Preferences (Camp-specific):**
      *   *Introspectible Quality:* The demand that pleasure be a **single introspectible quality** is a local preference of the *Felt Quality* camp. Attitudinalists and Functionalists deny that pleasure is a distinct sensation.
      *   *Non-Propositional Content:* The demand that pleasure be **non-propositional so that it can be attributed to infants and non-human animals** is often treated as universal, but strictly speaking, it is a local preference of those who reject cognitive theories of animal welfare. Propositional Attitude theorists may argue that animals possess proto-propositional states or that welfare requires higher cognition.

  ### The Critical Filter and the Fatal Tension

  Among the three main families of answer, the single requirement that eliminates the most candidates is **Extensional Adequacy (Heterogeneity)**.
  *   **Felt Quality theories** struggle most here, as they posit a common "hedonic tone" that is notoriously elusive across the divide between sensory and intellectual pleasures.
  *   **Functional theories** struggle to distinguish pleasure from other rewarding states without collapsing into circularity.
  *   **Propositional Attitude theories** fare best here but face pressure from the "Local Preference" regarding animals.

  However, the deeper structural problem lies in a pair of genuine requirements that appear **jointly unsatisfiable**: **Phenomenological Unity** and **Empirical Heterogeneity**.
  *   **Phenomenological Unity** is implied by the Normative Explanatoriness requirement: if pleasure is to ground a *unified* theory of value, there must be a single natural property common to all pleasant states that does the normative work.
  *   **Empirical Heterogeneity** is demanded by Extensional Adequacy: the phenomenology of eating a peach, solving a math problem, and recalling a memory shares no obvious introspectible commonality.
  If there is no common phenomenological thread, the "Unity" required for a monistic value theory vanishes; if there is a common thread, it is too thin to explain the specific value of the diverse experiences.

  ### Conclusion

  Given this tension, hedonism cannot survive as a claim about a natural kind with a common phenomenological nature without ignoring the diversity of human experience. It must instead be recast as a claim about value that leaves the plurality of pleasures intact, treating "pleasure" as a functional or normative label rather than a uniform sensation.
