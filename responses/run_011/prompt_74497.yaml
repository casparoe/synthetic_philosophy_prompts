      *   *Refining the "Marx" point:* Hegel does talk about the lord enjoying the "immediate aspect" of the thing while the bondsman works on the "negative aspect." Calling it "surplus value" is Marx. Calling the lord "owning class" is Marx. It's not *wrong* per se (Engels/Marx read it that way), but for a text accuracy rubric on Hegel, it's imprecise. I'll mark it down slightly on Accuracy for anachronism.

      *   *Refining the "Lord's Self-Consciousness":* The lord *is* a self-consciousness, but an *untrue* one. "Cut off... altogether" implies he ceases to be a self-consciousness. He remains a shape of spirit, just a failed one. This is a clarity/precision issue.

