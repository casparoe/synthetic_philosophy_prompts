          1.  Go through moves (1) to (9) one at a time.
          2.  Rate each move (clearly right, defensible, weak, clearly wrong) and explain why.
          3.  Determine who is ahead on the merits.
          4.  Analyze whether (3) and (4) address the same thing or trade intuitions.
          5.  Identify where Owen equivocates between "not better for anyone" and "not better, period."
