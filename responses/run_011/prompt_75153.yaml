      *   *Revised Principle:* **"Epistemic Integrity and Procedural Fairness."** Sanctions occur when members bypass community norms of evidence/fairness to inflict reputational harm, either by lying (Case 4), gaming systems (Case 1), or misusing external levers (Case 7). Errors (Case 2) and Dissent (Case 3) are protected.

  8.  **Final Polish:** Check tone. Ensure it sounds like a briefing paper for a panel member. (Proceed to generate output based on this thought process).

