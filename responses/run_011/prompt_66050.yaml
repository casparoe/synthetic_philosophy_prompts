answer: |-
  The clinical ethics seminar you are auditing has identified the correct fault line. The debate over withdrawing life-sustaining treatment frequently stalls because participants are attempting to solve a normative problem using a causal map. They are asking whether the physical distinction between doing and allowing carries independent moral weight. The definitive answer is that it does not. The distinction is not a foundational moral truth but a derivative heuristic, a proxy for deeper structures involving duty prioritization and threat ownership. When the heuristic aligns with these underlying structures, it feels intuitive; when it diverges, as in the trio of cases you provided, it collapses. To provide the hospice network with actionable guidance, we must discard the doing/allowing distinction as a primary criterion and replace it with a principle grounded in normative baselines and agent responsibility.

  The principle required to navigate these cases mechanically is the **Normative Threat and Duty Priority Principle**. It operates in three steps. First, identify the immediate lethal threat facing the patient. Second, determine the agent's normative relationship to that threat: is the agent a bystander, a protector, or the originator? Third, weigh the competing duties. A duty of non-maleficence (do not inflict harm) generally trumps a duty of beneficence (provide aid), unless the agent is responsible for the threat, in which case reparative duties constrain the withdrawal. Under this principle, the physical movement of the agent's hand is morally inert. What matters is whether the intervention stops a harm the agent is obliged to stop, or withdraws a benefit the agent is no longer obliged to provide.

  Applying this principle to the first case, the Idle Valve, yields a clear verdict of permissibility. Here, the lethal threat is Elias's end-stage renal failure. The dialysis machine is the aid counteracting that threat. When the cartridge cracks, the aid becomes technically impossible to sustain according to protocol. Marta's relationship to the threat is that of a protector who has lost the capacity to protect. She is not the originator of the renal failure, nor did she break the machine. Her duty of beneficence is limited by possibility and protocol; she has no duty to do the impossible or the forbidden. Closing the valve does not introduce a new cause of death; it removes an obstacle to the underlying pathology. The Normative Threat Principle classifies this as a withdrawal of non-obligatory aid. The doing/allowing distinction might label this an "allowing to die," but that label adds no moral weight. The moral weight comes from the absence of a duty to sustain a broken intervention. The principle earns its keep here by bypassing the causal question of whether closing the valve is an act or an omission. It is an act, physically, but normatively it is a cessation of a duty that has become impossible to fulfill.

  The second case, the Contaminated Bath, tests the principle against a trade-off scenario. Here, the lethal threat is no longer just the renal failure; it is the hemolytic agent in the dialysate. This is an external threat, a batch error for which Marta is not responsible. However, the aid (dialysis) has become the vector for a faster death. If Marta keeps the valve open, she facilitates poisoning. If she closes it, she prevents poisoning but allows uremia to proceed. The physical movement is identical to Case One, but the normative landscape has shifted. She is now intervening in a causal chain that she did not start but currently controls. The principle dictates that the duty of non-maleficence (do not poison) trumps the duty of beneficence (filter blood). Closing the valve is not merely permissible; it is obligatory. She must stop the poisoning. The fact that this results in death by uremia four days later is a tragic inevitability, not a moral failure. Here, the doing/allowing distinction becomes actively misleading. If we focus on the physical act, Marta is "doing" something that leads to death. If we focus on the omission, she is "allowing" the uremia. But the moral verdict rests on the fact that she is stopping a supervening harm. The principle handles this by identifying the hemolysis as the primary normative threat to be mitigated. The baseline is not "what happens if Marta never walks on the ward," but "what happens if Marta fulfills her duty to avoid harming."

  The third case, the Mislabeled Bag, is the crucible. Physically and causally, it is identical to Case Two. Normatively, it is distinct because Marta is the originator of the threat. She mislabeled the bag. The lethal process underway is one she started. The prompt asks whether this differs morally from Case Two. The verdict on the permissibility of closing the valve remains the same: she must close it. She cannot continue to poison Elias simply because she started the poisoning. To continue would be to compound the error with a new violation of non-maleficence. However, the moral status of her conduct differs significantly in terms of liability. In Case Two, she is a hero mitigating a tragedy. In Case Three, she is a wrongdoer mitigating her own wrongdoing. The Normative Threat Principle captures this through the clause on reparative duties. While she is permitted to withdraw the aid to stop the immediate harm, she acquires a residual duty to account for the harm caused. She cannot claim the moral shelter of "withdrawing treatment" to absolve herself of the mislabeling. The distinction between doing and allowing is irrelevant here; what matters is that she owns the threat. If she closes the valve, she is stopping herself from killing him faster. This is permissible, but it does not erase the culpability of the prior act. The principle earns its keep by separating the permissibility of the immediate intervention from the liability for the situation. It avoids the trap of saying the act is impermissible because she caused the problem (which would imply she should let him die of hemolysis to avoid "interfering"), and it avoids the trap of saying the act is morally neutral (which would ignore her responsibility).

  This triad of cases demonstrates why the doing/allowing distinction is spurious as a foundational category. It is merely a shadow cast by the interaction of duties and causal history. When we engage the standard philosophical pressure points, this derivative status becomes even clearer. Consider Rachels's paired bathtub examples, designed to show that killing is no worse than letting die when intentions and outcomes are fixed. Rachels is correct to dismiss the intrinsic weight of the distinction, but he goes too far in suggesting that nothing matters besides intention and outcome. The Marta cases show that causal history matters independently of intention. In Case Two and Case Three, Marta's intention is identical (save Elias from hemolysis), and the outcome is identical (death in four days). Yet Case Three is morally worse. Why? Not because of the physics of the valve, but because of the history of the threat. Rachels's framework needs the addition of threat ownership to account for this. The doing/allowing distinction fails here because it cannot differentiate between stopping a harm you found and stopping a harm you started.

  Similarly, Philippa Foot's account in terms of positive and negative rights offers a stronger scaffold but requires the modification introduced by the Normative Threat Principle. Foot argues that negative rights (not to be harmed) are stricter than positive rights (to be aided). This explains why Marta must stop the poisoning in Case Two. However, Foot's framework struggles with the baseline problem pressed by Jonathan Bennett. Bennett argues that there is no non-arbitrary way to specify what would have happened had the agent not acted, meaning whether conduct counts as doing or allowing depends on which counterfactual we select. In the Idle Valve case, one could say Marta "killed" Elias by closing the valve (counterfactual: she leaves it open and he dies in four days anyway? Or counterfactual: she fixes it and he lives?). Bennett is right that the causal baseline is unstable, but he is wrong that the normative baseline is. The normative baseline is fixed by the agent's role and duties. Marta is a technician, not a miracle worker. Her baseline duty is to operate safe equipment. When equipment is unsafe, the baseline shifts. We do not need to solve the metaphysical puzzle of the counterfactual to know she had no duty to run a broken machine. The Normative Threat Principle resolves Bennett's worry by anchoring the baseline in duty, not in physics. The question is not "what would nature have done?" but "what was Marta required to do?"

  The suspicion that double-prevention cases like the second and third are artifacts of description also dissolves under this principle. One might argue that closing the valve is described once as stopping a harm (good) and once as removing a benefit (bad). This linguistic flexibility suggests the moral status is unstable. But the principle stabilizes it. The description that matters is the one that aligns with the dominant duty. Since the duty to avoid poisoning dominates the duty to filter blood, the description "stopping a harm" is the morally relevant one. The other description is normatively inert. This does not mean the distinction is real; it means one description tracks the duty structure better than the other.

  A specific challenge remains regarding the difference between Case Two and Case Three. One might object that if the valve closure is permissible in both, and the outcome is the same, the moral difference is merely historical and irrelevant to the guidance document. The hospice network wants to know what Marta should do *now*. She should close the valve in both. However, the moral difference is not irrelevant to the ethics of care. If we treat Case Three as identical to Case Two, we erase the concept of accountability. A guidance document that treats agent-caused threats as identical to external threats risks incentivizing negligence. If Marta knows that closing the valve absolves her of the mislabeling because it counts as a standard "withdrawal of treatment," the normative force of the error is lost. The principle demands that while the immediate action is the same, the moral residue differs. In Case Two, the network supports Marta. In Case Three, the network must support the patient's family in seeking accountability from Marta, even while affirming her decision to close the valve. The doing/allowing distinction cannot capture this nuance because it focuses on the moment of intervention. Only a principle sensitive to threat ownership can distinguish between a tragic choice and a mitigated wrong.

  Furthermore, we must address whether an agent responsible for a threat acquires a stronger duty to remove it even at the price of withdrawing aid. The answer is yes. In Case Three, Marta's duty to stop the hemolysis is heightened because she caused it. She cannot say, "I am just a technician following the same logic as Case Two." She is the author of the dilemma. This creates a stronger obligation to act, not a weaker one. If she hesitated in Case Three, her culpability would be greater than if she hesitated in Case Two. The doing/allowing distinction obscures this. It might suggest that because she is "withdrawing aid," she is being passive. But she is actively stopping her own harmful process. The principle clarifies that the duty to repair (stop the harm) overrides the duty to sustain aid, and the origin of the threat intensifies the duty to repair.

  Critics might argue that this makes the moral landscape too complex for clinical guidance. They may prefer the blunt instrument of the doing/allowing distinction because it is easy to teach: "Withdrawing treatment is allowing to die; it is permissible." But as the Marta cases prove, this heuristic fails when the treatment itself becomes the threat. If the hospice network adopts the traditional distinction, they risk endorsing conduct in Case Three that feels like a cover-up, or condemning conduct in Case Two that is actually life-extending (swapping 40 minutes for 4 days). The Normative Threat Principle is not significantly harder to apply. It asks three questions: What is killing the patient? Did you start it? Are you making it worse? These are questions clinicians can answer. They are better than asking, "Am I doing or allowing?" because that question has no stable answer in these scenarios.

  Ultimately, the doing/allowing distinction is a spurious category. It is not irreducible. It derives from the interplay of negative duties (non-maleficence) and the causal history of the threat. When the distinction works, it is because it coincides with these deeper factors. When it fails, as in the dialysis cases, it is because the causal history and duty structure have diverged from the physical description of the act. We must not build ethical guidance on a distinction that collapses under the weight of its own exceptions.

  The verdict for the hospice network must be unequivocal. Do not anchor your guidance on the difference between acts and omissions. Anchor it on the duty to avoid harm and the responsibility for the threat. In the Idle Valve, withdrawal is permissible because the aid is broken. In the Contaminated Bath, withdrawal is obligatory because the aid is harmful. In the Mislabeled Bag, withdrawal is obligatory but culpable, because the harm was agent-caused. In all three, Marta closes the valve. In all three, Elias dies in four days. But only by looking past the doing/allowing distinction can we see why Marta is a competent technician in the first case, a prudent protector in the second, and a negligent agent seeking mitigation in the third. The physics of the valve never changed. The morality changed because the normative relationship between Marta and the threat changed. That is the only distinction that carries weight.
