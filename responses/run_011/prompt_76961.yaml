      *   *Tension:* Students are *more* anxious under algorithmic surveillance. Is this anxiety "internalization" or just "fear"?
      *   *Risk:* Unfalsifiability (moving the goalposts on what counts as "uncertainty").

  3.  **Address Priority 1: Exegesis (Foucault Interpretation):**
