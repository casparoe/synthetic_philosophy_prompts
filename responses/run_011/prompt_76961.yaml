      *   *Falsifiable Prediction:* If "Ledger Governance" holds, subjects should optimize for *gaming the metric* rather than *aligning with the norm*.
      *   *Concrete Observable:* In a Panopticon, you stop cheating because you *might* be caught (norm internalization). In Ledger Governance, you stop cheating only if the *expected value* is negative. If you find a blind spot in the algorithm, Ledger subjects cheat immediately. Panopticon subjects hesitate because "the watcher might see."
      *   *Test:* Give subjects a task with a known algorithmic detector. Introduce a known blind spot (e.g., "this keyword isn't flagged"). Ledger subjects use the blind spot. Panopticon subjects (human proctor) hesitate even if they think they got away with it, because the *judgment* is uncertain.

