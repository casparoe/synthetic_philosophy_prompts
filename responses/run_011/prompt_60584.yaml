answer: |-
  ### Teaching Plan: Session 1 (Humeanism & The Best System)

  **Time:** 75 Minutes
  **Resources:** One Whiteboard (divide into three vertical columns: *Ontology*, *Systematization*, *Explanation*)
  **Goal:** Students must leave understanding that for the Humean, the mosaic is fundamental and laws are derivative summaries, and they must feel the intuitive cost of this derivation (explanatory reversal).

  ---

  #### (a) Ordering: Ontology Before Laws
  **Open with Humeanism as a thesis about *what there is* (Ontology), not what laws are.**

  *   **The Sequence:**
      1.  **Recap Hume:** No necessary connections in nature. Causation is constant conjunction.
      2.  **The Commitment:** If there are no necessary connections, what is left? Just the distribution of local qualities. **Draw the Mosaic.** (Column 1: *The Humean Supervenience Base*).
      3.  **The Problem:** We talk about laws. If the mosaic is all there is, what *are* laws?
      4.  **The Solution:** The Best System Account. (Column 2: *The Systematization*).
      5.  **The Cost:** Explanatory Reversal. (Column 3: *The Direction of Fit*).

  *   **Why the other order misfires:**
      If you open with "Humeanism is a thesis that laws are regularities," students will immediately conflate the **Best System Account (BSA)** with the **Naive Regularity Theory**. They will assume the debate is merely about whether we *call* regularities "laws." By establishing the Mosaic first, you force them to see laws as *derivative*. The BSA then becomes the solution to the problem: "How do we recover law-talk from a world that is just a heap of facts?" If you start with laws, the Mosaic looks like an arbitrary restriction rather than the metaphysical foundation.

  #### (b) The Example: The Dynamic Grid
  **Verdict:** A *static* finite grid of tiles **cannot** carry the explanatory-reversal charge. It can illustrate Simplicity vs. Strength, but it fails on Explanation.

  *   **Why it fails:** Explanatory reversal concerns *why* events happen. In a static grid, nothing "happens." A pattern is just a pattern. There is no intuitive pull to say the pattern *governs* the tiles, so there is no loss when you say the tiles ground the pattern.
  *   **The Fix:** Use a **Cellular Automaton** (e.g., a 1D elementary cellular automaton evolving over time steps).
      *   **Must Have:** Temporal evolution (rows represent time steps). This allows for *predictions* (Strength) and *rule complexity* (Simplicity).
      *   **Must Lack:** Hidden mechanisms. The cells are the ontology.
      *   **How to use it for Reversal:** Once they agree on the "Law" (the rule generating the next row), ask: "Did the cells in Row 5 appear *because* of the Rule, or is the Rule true *because* of the cells in Row 5?" The dynamic nature makes the "governing" intuition palpable, making the Humean answer feel counter-intuitive.

  #### (c) Misconceptions: Ranking & Intervention Points
  **1. "Laws are just the regularities we have noticed." (Naive Regularity Theory)**
  *   **Rank:** High Priority (Fatal if not addressed).
  *   **Intervention Point:** **During the definition of BSA.**
  *   **Strategy:** When defining the Best System, emphasize *deductive systematization*. A list of all particular facts has maximal Strength but zero Simplicity. A single axiom has maximal Simplicity but low Strength. The Best System is the *balance*. Explicitly state: "A regularity is a law only if it appears as an axiom/theorem in the *Best* System, not simply because it is true."

  **2. "The best system is best for *us*, so laws are mind-dependent."**
  *   **Rank:** Medium Priority (Common objection).
  *   **Intervention Point:** **Immediately after defining Simplicity/Strength.**
  *   **Verdict:** **Dispelled as a confusion.** (Lewis's view).
  *   **Strategy:** Distinguish *epistemic* accessibility from *metaphysical* constitution. The Best System is the one that best balances simplicity and strength *objectively*, regardless of whether humans can find it. It is "for us" only in the sense that 'simplicity' is a human virtue, but the *fact* of which system is simplest is mind-independent. Do not concede this in Session 1; it muddies the supervenience claim. Treat it as a confusion about *idealization*.

  **3. "The Humean denies that laws explain anything."**
  *   **Rank:** Low Priority (This is the target, not a misconception).
  *   **Intervention Point:** **The Climax (Last 15 mins).**
  *   **Strategy:** Do not head this off. Let them feel it. This is the "Explanatory Reversal." The Humean *does* say laws explain particular facts (in a sense), but the *truth* of the law is explained by the facts. The misconception to avoid here is thinking the Humean says laws are *useless*. They are useful summaries, but not *governing* explainers.

  #### (d) Armstrong as Foil
  **Decision:** Include Armstrong-style necessitation **only as a foil**, not as a positive theory to be learned.

  *   **Implementation:** When you reach the "Explanatory Reversal" section, introduce the Anti-Humean intuition. "Many philosophers (like Armstrong) think this gets it backwards. They think $N(F, G)$ (necessitation) makes the regularity happen."
  *   **What you lose if you wait:** If you wait until Session 2 to introduce the rival, Session 1's critique of Humeanism lacks teeth. Students won't feel the *loss* of the Humean view unless they have a glimpse of what is missing (governing necessitation).
  *   **What you lose if you include it fully:** You will run out of time. Do not teach Universals. Do not teach the inference problem. Teach only the **Governing Intuition**: "On the rival view, the Law is a parent; the Mosaic is the child. On the Humean view, the Mosaic is the parent; the Law is the description."

  #### (e) Explicit Refusals
  **State this aloud at the start of the session:**

  > "We are doing **metaphysics**, not epistemology or philosophy of probability.
  > 1.  I will not cover **Chance or the Principal Principle**. We will treat laws as deterministic for today. Probabilistic laws complicate 'Strength' in a way that obscures the metaphysical structure.
  > 2.  I will not cover **whether we can know the Mosaic**. We are asking what the world *is*, not how we access it. Assume the Mosaic is given."

  *   **Why:** Third-year students love to pivot to "But how could we ever know the best system?" This kills the metaphysical discussion. Shut it down early to keep focus on supervenience.

  #### (f) Closing Question
  **Do not ask for a definition.** Ask for an application of the explanatory direction.

  > **"Imagine the Best System entails that 'All copper conducts electricity.' We find a piece of copper in the mosaic that does not conduct.
  >
  > On the Humean view: Does this falsify the Law, or was it never a Law?
  >
  > Now, answer this: In the cases where the copper *did* conduct, did it conduct *because* it was a Law? If yes, explain how that fits with the Mosaic being fundamental. If no, what work is the Law doing?"**

  *   **Success Criteria:**
      *   **Fail:** They say the Law forced the copper to conduct (Governing view).
      *   **Pass:** They say the Law is no longer part of the Best System (it lost Strength), and in the past cases, the copper conducted *first*, which helped *make* it a law. They should express discomfort or articulate the "summary" role clearly.

  ---

  ### Whiteboard Plan (Visual Guide)

  | **1. The Ontology (The Mosaic)** | **2. The Laws (The Best System)** | **3. The Direction (Explanation)** |
  | :--- | :--- | :--- |
  | *Draw grid of local qualities* | *Draw funnel: Mosaic $\rightarrow$ Systems* | *Draw Arrow: Mosaic $\rightarrow$ Law* |
  | No necessary connections. | Filter for Simplicity + Strength. | **Humean:** Facts ground Laws. |
  | Just "one damn thing after another." | Winner = The Laws. | **Anti-Humean:** Laws ground Facts. |
  | **Fundamental.** | **Derivative.** | **The Charge:** Reversal. |

  ### Session Flow (75 Mins)
  1.  **00-10:** Hume Recap & The Negative Thesis (No necessary connections).
  2.  **10-30:** The Positive Ontology (The Mosaic/HS). Draw Column 1.
  3.  **30-50:** The Best System Account (Simplicity/Strength trade-off using Dynamic Grid). Draw Column 2. Head off Naive Regularity & Mind-Dependence here.
  4.  **50-65:** Explanatory Reversal (The Armstrong Foil). Draw Column 3.
  5.  **65-75:** Closing Question & Discussion.
