  # Exhibit A: The Doctrinal Dilemma in Incident Classification

  ## 1. Scenario and Policy Rule
  **Context:** Post-Incident Review (PIR) for a Tier-2 Service Outage.
  **Panel:** Three Senior Engineers (Alice, Bob, Charlie).
  **Task:** Determine if the incident qualifies as a "Severe Process Failure" (SPF). An SPF designation triggers a mandatory audit log of specific findings and requires VP-level sign-off for closure.
  **Policy Rule:** All reviewers agree on the following Boolean definition for SPF, implemented in the review tool:
  $$ \text{SPF} \iff \text{DataExposed} \lor (\text{RunbookSkipped} \land \text{AlertLate}) $$
  *(Translation: It is a Severe Process Failure if customer data was exposed, OR if the team both skipped the runbook AND acknowledged the alert late.)*

  **Findings:**
  1.  **DataExposed:** Customer PII was accessible externally.
  2.  **RunbookSkipped:** The on-call engineer did not follow the documented mitigation steps.
  3.  **AlertLate:** The time-to-acknowledge exceeded 15 minutes.

  ## 2. Ballot Table and Arithmetic
  The reviewers vote independently on the findings. The system currently aggregates the findings by majority vote, then applies the Policy Rule to the aggregated set.

  | Reviewer | DataExposed (A) | RunbookSkipped (B) | AlertLate (C) | **Implied Decision** (Rule Applied to Row) |
  | :--- | :---: | :---: | :---: | :---: |
  | **Alice** | False | True | False | $F \lor (T \land F) = \mathbf{False}$ |
  | **Bob** | False | False | True | $F \lor (F \land T) = \mathbf{False}$ |
  | **Charlie** | True | True | True | $T \lor (T \land T) = \mathbf{True}$ |
  | **Majority** | **False** | **True** | **True** | **Derived Below** $\downarrow$ |

  **System Calculation (Current Implementation):**
  1.  **Majority Findings:**
      *   $A$: 1 True, 2 False $\rightarrow$ **False**
      *   $B$: 2 True, 1 False $\rightarrow$ **True**
      *   $C$: 2 True, 1 False $\rightarrow$ **True**
      *   *Aggregated Set:* $\{A=F, B=T, C=T\}$
  2.  **Derived Decision:**
      *   Apply Rule to Aggregated Set: $F \lor (T \land T)$
      *   Result: $\mathbf{True}$ (SPF Declared)
  3.  **Majority Decision (Direct Vote):**
      *   Alice: False, Bob: False, Charlie: True.
      *   Result: $\mathbf{False}$ (No SPF)

  **Divergence Confirmation:**
  *   **Disagreement:** The system records **SPF=True**, but a majority of the panel (2/3) conclude **SPF=False**.
  *   **Ghost Findings:** The Majority Finding Set is $\{A=F, B=T, C=T\}$.
      *   Alice holds $\{F, T, F\}$.
      *   Bob holds $\{F, F, T\}$.
      *   Charlie holds $\{T, T, T\}$.
      *   **Result:** No individual reviewer endorses the specific set of findings the system relied upon to make its decision.

  ## 3. Analysis of Proposed Fixes
  We test two common counter-proposals using the profile above.

  **Fix 1: Unanimity on Findings**
  *   *Mechanism:* A finding counts as "True" only if all 3 reviewers vote True.
  *   *Result:*
      *   $A$ (1 True): Becomes False.
      *   $B$ (2 True): Becomes False.
      *   $C$ (2 True): Becomes False.
      *   Derived Decision: $F \lor (F \land F) = \mathbf{False}$.
  *   *Agreement Restored?* **Yes.** (Matches Majority Decision of False).
  *   *Strategic Risk:* While no reviewer can manipulate the outcome *in this specific profile* (Charlie cannot force a True; Alice/Bob already have their False), this mechanism structurally grants veto power to a single dissenter. In a general case, a reviewer preferring "False" can guarantee it by voting False on any finding they believe is True, incentivizing dishonesty to block outcomes.

  **Fix 2: Decision-First Voting**
  *   *Mechanism:* Panel votes directly on SPF (Decision). Findings are recorded afterward to justify the log.
  *   *Result:*
      *   Vote: False, False, True $\rightarrow$ **False**.
      *   Agreement Restored? **Yes.** (By definition, Decision = Majority Decision).
  *   *Strategic Risk:* Reviewers cannot manipulate the Decision via findings, because findings no longer determine the Decision.
  *   *New Problem:* **Audit Incoherence.** If the Decision is False, but the reviewers (honestly) record the Majority Findings $\{F, T, T\}$ in the log, the log mathematically implies True. The audit trail contradicts the recorded decision. If they falsify findings to match the Decision, the log is a lie.

  ## 4. Requirement Tension: Audit Log vs. Democratic Consensus
  **Requirements:**
  1.  **Auditability:** The system must log the specific findings relied upon (a bare decision is insufficient for compliance).
  2.  **Consensus:** The recorded decision must match what a majority of the panel would say if asked directly.

  **Verdict:** These are **not jointly satisfiable** for an automated rule applied uniformly.
  This is an instance of the **List-Pettit Impossibility Theorem** (The Discursive Dilemma). It proves that no aggregation procedure can simultaneously satisfy: (a) Anonymity (equal weight to reviewers), (b) Systematicity (same rule for all cases), and (c) Consistency (Decision matches Finding-Aggregation) when the rule involves logical interdependencies (AND/OR).

  **Principled Choice:**
  **Requirement 2 (Consensus) must give way.**
  *   *Reasoning:* The Policy Rule is the authority, not the panel. The panel are fact-finders, not judges. If we automate the decision logic, we are asserting that the *Rule* determines the outcome based on the *Best Available Evidence* (Majority Findings). If the Majority of humans disagree with the logical output of their own aggregated evidence, the error lies in human intuition regarding the rule's complexity, not in the aggregation.
  *   *Audit Priority:* Compliance requires an immutable link between Findings and Decision. Breaking that link (to satisfy Consensus) renders the audit log legally indefensible. Preserving the link (and accepting the Consensus divergence) preserves the integrity of the policy engine.

  ## 5. Diagnosis and Defense
  **Root Feature:**
  The divergence is caused by the **logical interdependency** of the findings (the $\lor$ and $\land$ structure). If the rule were a single finding (e.g., $\text{SPF} \iff \text{DataExposed}$), the Majority Finding would always equal the Majority Decision. The complexity of the rule allows the "Majority View" to fragment across different premises.

  **If Removed:**
  If we simplify the rule to a plain conjunction of all findings ($\text{SPF} \iff A \land B \land C$), the paradox can still occur (as shown in literature), but if we simplify to a *single* finding, the divergence vanishes entirely.

  **Defender's Attack:**
  A defender of the current implementation would argue: *"This case is pathological. In reality, reviewers correlate. Alice and Bob would not disagree on B and C so perfectly without discussing it. This paradox relies on independent errors canceling out."*

  **Role of Deliberation:**
  *   **Does discussion dissolve the problem?** **Yes.** Synchronous deliberation forces reviewers to align their mental models. If Alice and Bob discuss, they will likely converge on a shared set of findings (e.g., both agree B is False), collapsing the "Ghost Findings" set into an actual individual's view.
  *   **Async Loss:** An asynchronous, geographically distributed panel loses the **correlation of error**. By design, async voting preserves independence to prevent groupthink. However, independence is the exact condition required for the Doctrinal Paradox to manifest. We are trading *logical consistency* for *independent verification*.

  **Recommendation:**
  Retain the current "Findings-First" aggregation to satisfy Audit Requirements. Acknowledge the List-Pettit bound in the doc. Mitigate the "Consensus" divergence by adding a "Minority Report" field to the audit log, allowing the 2/3 majority to formally register their disagreement with the derived decision without blocking the policy enforcement.
