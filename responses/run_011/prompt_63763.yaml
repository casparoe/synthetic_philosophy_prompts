  ### Audit of Commitments on Agency in Organizations

  **Executive Summary**
  Your list is philosophically provocative, which is exactly what the workshop organizers want. However, it is not consistent. You are attempting to hold a **Psychological Reductionist** view (Items 1, 4, 5) and a **Structural Functionalist** view (Items 2, 3, 6) simultaneously, while claiming they do not conflict. They do. The core fracture is between your metaphysical constraints (1 & 5) and your organizational intuitions (2 & 3). Item 8 (Methodology) further complicates this by expressing suspicion of the very entities Item 6 requires for moral blame.

  Below is the ranked audit of tensions, the answers to your specific compatibility questions, and the single revision that stabilizes the document.

  ---

  ### Ranked Tensions

  **1. Critical: Item 1 (Reductionism) vs. Item 2 (Organizational Agency)**
  *   **The Conflict:** Item 1 states that collective attitudes are made true *entirely* by facts about personal attitudes. Item 2 states that organizational attitudes are fixed by *procedures and records*, explicitly *not* by a snapshot of members' heads.
  *   **Why it breaks:** If a board's attitude is fixed by its minutes (Item 2), then two boards with identical members holding identical personal attitudes could hold different collective attitudes if their *records* differ (e.g., one board forgot to minute a past resolution, the other didn't). This violates Item 1's claim that personal attitudes are the *entire* truth-maker.
  *   **Severity:** Fatal. This is the central metaphysical contradiction. Philosophers will attack this immediately as an equivocation on "collective attitude."

  **2. High: Item 5 (Supervenience) vs. Item 2 (Turnover & Records)**
  *   **The Conflict:** Item 5 claims that if members' personal attitudes and interlocking patterns are identical, the collective attitude *cannot* differ. Item 2 claims a collective retains attitudes through the "replacement of every last member."
  *   **Why it breaks:** If you replace every member, the "personal attitudes" base is completely different. If the group attitude remains the same (as Item 2 claims), it does not supervene on the *current* members' attitudes. It supervenes on the *structure*. Item 5 denies this possibility.
  *   **Severity:** High. This renders your "guard rail" (Item 5) incompatible with your primary intuition (Item 2).

  **3. Medium: Item 6 (Asymmetric Blame) vs. Item 8 (Methodological Suspicion)**
  *   **The Conflict:** Item 6 asserts an organization can be blameworthy where *no member* intended or endorsed the outcome. Item 8 expresses suspicion of views where the group entity is "indispensable for making ordinary moral criticism work."
  *   **Why it breaks:** If no member is blameworthy (Item 6), then the *group entity* is indispensable for locating the blame. You cannot shift the blame to the members. This triggers the exact suspicion outlined in Item 8. You are using the entity to do moral work that individuals cannot do, which your methodology claims is usually a sign of error.
  *   **Severity:** Medium. This looks like a blind spot in your methodological self-awareness.

  **4. Low: Item 3 (Group Criticism) vs. Item 4 (Individual Standing)**
  *   **The Conflict:** Item 3 says criticism for incoherence lands on the *cooperative* rather than members (who were coherent). Item 4 says standing to complain comes from *individual* licensing of reliance.
  *   **Why it breaks:** If the members were coherent (Item 3), no individual member was let down by another's irrationality. So, on the Item 4 account, no member has standing to complain about the incoherence. Yet Item 3 says the cooperative is open to criticism. Who has the standing? The tenants? Item 4 restricts standing to those who joined the plan.
  *   **Severity:** Low/Manageable. This is a normative gap rather than a metaphysical contradiction, but it leaves you vulnerable to the question: "If the members aren't at fault, and outsiders didn't license reliance, who gets to criticize?"

  ---

  ### Specific Compatibility Questions

  **Can Items 2, 5, and 6 be held together without abandoning Item 1?**
  **No.**
  Item 1 is the bottleneck. It defines collective attitudes as *exhaustively* constituted by personal attitudes.
  *   Item 2 requires attitudes to be constituted by *records/procedures* (which can outlast or contradict personal attitudes).
  *   Item 5 requires attitudes to *supervene* on personal attitudes (which prevents the turnover scenario in Item 2).
  *   Item 6 requires the group to be a moral agent independent of member intent (which Item 1's reductionism struggles to support without smuggling in non-personal facts).
  To hold 2, 5, and 6, you must abandon the "entirely" in Item 1. You cannot be a Bratman-style reductionist about *organized* agencies, only about *joint* actions.

  **Can Item 3 and Item 4 be held together without owing two different accounts of standing?**
  **Not currently.**
  Item 4 grounds standing in *inter-personal reliance* ("licensed the others to rely on them"). Item 3 describes a case where the *system* is irrational, but the *persons* are rational. In Item 3's case, no member relied improperly on another; they all voted coherently. Therefore, the Item 4 account of standing yields no critics.
  To unify them, you must expand Item 4's account of standing to include reliance on *public commitments* (records/minutes) by stakeholders (tenants), not just reliance on *persons* by co-planners.

  ---

  ### The Single Best Revision

  **Revise Item 1 to limit its scope to *unstructured* joint action.**

  **Current Text:** "I'm a reductionist about collective attitudes in the Bratman style. When it is true that some people intend to do something together, that truth is made true entirely by facts about the personal attitudes of those people..."

  **Proposed Revision:** "I'm a reductionist about **unstructured** collective attitudes in the Bratman style. When it is true that some people intend to do something together **without formal institutional structure**, that truth is made true entirely by facts about the personal attitudes of those people... **However, for structured organizations (Item 2), I hold that collective attitudes are fixed by decision procedures and records.**"

  **Why this eliminates the most trouble:**
  1.  **Resolves 1 vs. 2:** It admits that your Bratman-style reductionism applies to the "house workday" (Item 4) but *not* to the "housing board" (Item 2). This validates your intuition that these are different phenomena without forcing a contradictory metaphysics.
  2.  **Resolves 5 vs. 2:** Once Item 1 is scoped, Item 5 can be implicitly understood as applying to the Item 1 domain. You can then allow Item 2's domain to have a different supervenience base (structure + attitudes) without contradicting Item 1, because Item 1 no longer claims universality.
  3.  **Resolves 6 vs. 8:** It clarifies that the "entity" is only indispensable in the *structured* domain (Item 2), where the "independent facts" (Item 8) are the procedures/records, not a metaphysical plural subject. This satisfies your methodological constraint: you aren't positing a ghostly mind; you are positing a functional structure.
  4.  **Resolves 3 vs. 4:** It allows you to say Item 4's account of standing applies to Item 1 cases (small scale), while a different account (reliance on institutional output) applies to Item 3 cases (large scale). You owe two accounts, but you are no longer claiming they are the *same* account.

  **The Cost:**
  You lose **Theoretical Unity**. You are no longer offering a single theory of collective intentionality that covers everything from a handshake to a corporation. You are offering a dual-track theory: Psychological Reductionism for teams, Structural Functionalism for organizations.
  *   *Why this is the cheapest cost:* Your intuitions (derived from the co-op board) are already dual-track. You treat the roof-repair crew differently than the grant-voting board. Formalizing this distinction costs you less than trying to force the board into a Bratmanian mold (which contradicts your own Item 2) or forcing the roof crew into a Corporate mold (which violates your Item 4). It makes your list honest rather than diplomatically inconsistent.

  **Secondary Recommendation (to clean up the fallout):**
  Once Item 1 is scoped, tweak **Item 5** to read: "For unstructured groups, attitudes supervene on personal attitudes. For structured organizations, they supervene on personal attitudes *plus constitutional facts*." This prevents Item 5 from being read as a universal constraint that contradicts Item 2.
