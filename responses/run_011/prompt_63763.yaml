      *   *Item 5 (Supervenience):* Group attitudes supervene on member attitudes + interlocking pattern. (Same members/attitudes/pattern = same group attitude).
      *   *Item 6 (Asymmetric Blame/Credit):* Blame possible without member intent (procedures make it "own doing"). Credit requires at least one member's endorsement/motive.
      *   *Item 7 (No Group Feeling):* No phenomenology. Ascriptions of emotion (contempt) are metaphorical/moral, not literal experience.
      *   *Item 8 (Methodology):* Prefer deriving group talk from independent facts. Suspicious of views where the entity is indispensable for moral criticism.

  3.  **Identify Tensions (The "Audit"):**

      *   *Tension A: Item 1 vs. Item 2 (The Core Metaphysical Clash)*
          *   Item 1 says collective intentionality is *just* interlocking personal intentions.
