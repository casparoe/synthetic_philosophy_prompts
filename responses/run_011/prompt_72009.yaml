answer: |-
  Here is your prep sheet. I have ordered these by the structural damage they could do to the argument, starting with the ones that threaten the core distinction you're relying on. I've also included the "Strawman Check" and the "Silent Killer" at the end.

  ### The Prep Sheet: 7 Objections from This Room

  #### 1. The Literary Theorist (The Content/Form Collapse)
  **The Objection:** "You're relying on a content/form distinction that my tradition spent the last fifty years dissolving. You say the 'harvest yield' is a neutral part, and the 'tragic emplotment' is the shaped whole. But the harvest yield only enters the record *because* a prior narrative hypothesis deemed it significant. The 'fact' is already a sedimented narrative choice. If the parts are theory-laden, your firewall between 'truth-evaluable claims' and 'aesthetic shapes' collapses. You aren't saving objectivity; you're just pushing the constructivism down to the atomic level."

  **The 90-Second Reply:** "I concede that *selection* of facts is theory-laden. Carr taught us that. But selection is not *constitution*. That we chose to measure harvest yields doesn't determine whether the yield *was* 5 bushels or 10. My argument is that even if the *choice* to investigate is shaped, the *result* of the investigation is truth-apt. White's skepticism threatens the result, not just the selection. I'm arguing we can admit the selection is shaped without saying the resulting data is unmoored from truth."
  *   **Concede:** That fact-selection is never innocent or pre-narrative.
  *   **Hold:** That the *truth-value* of the selected claim remains distinct from the *narrative shape* organizing them.
  *   **Vulnerability:** **Soft.** She will press that "5 bushels" only has meaning within a specific economic ontology. If you concede too much on selection, she'll argue the "meaning" of the fact is inseparable from its truth.

  #### 2. The White Formalist (The Exegesis Trap)
  **The Objection:** "You're fighting a ghost. White never claimed that singular historical claims ('the harvest failed') lack truth values. He claimed that *explanations* ('the Revolution was a tragedy') are aesthetic. Your 'composition principle' objection assumes White thinks the falsity of the whole infects the parts. He doesn't. He thinks the parts are true, but the *story* is a fiction we impose to make them comprehensible. You're rehabilitating a Rankean realism that White already accommodated in his distinction between the chronicle and the story."

  **The 90-Second Reply:** "You're right that White distinguishes chronicle from story. But the rhetoric of *Metahistory* often suggests that because the story is imposed, the historian's *knowledge* of the past is essentially poetic, not epistemic. If the explanation is purely aesthetic, the 'truth' of the parts becomes historiographically inert. My point is that historians treat the shape as carrying cognitive weight. If I show that the shape has normative constraints (my 'no-vacuous-shape'), I'm trying to give the 'story' back some epistemic dignity without claiming it's 'true' in the same way the harvest yield is."
  *   **Concede:** That White technically allows for true atomic facts.
  *   **Hold:** That White's rhetoric encourages a skepticism about historical *knowledge* that exceeds his technical distinction.
  *   **Vulnerability:** **Hard.** This is a textual claim. If you have no quote where White conflates the two, you look like you're attacking a caricature to make your solution look necessary.

  #### 3. The Social Historian (The "Evidence Screams" Reality Check)
  **The Objection:** "This whole 'underdetermination' talk is a luxury of people who don't work in the archives. You say narrative shape is underdetermined by evidence. But when I'm looking at thirty years of parish registers showing a 40% mortality spike, the 'tragic' shape isn't a choice I make; it's what the data forces on me. If I try to emplot that as a 'comedy,' I'm not just being aesthetic, I'm lying. Your 'no-vacuous-shape' constraint sounds like you think we have a menu of options. Sometimes there's only one shape that fits."

  **The 90-Second Reply:** "I'm not saying you can emplot a famine as a comedy. I'm saying that even when the data forces a 'crisis' shape, you still have to decide *whose* crisis it is, and where the resolution lies. Does the crisis end with the harvest recovery, or with the political reform? The evidence fixes the mortality, it doesn't fix the *ending*. My constraint is there to stop us from adding *extra* shaping—like moralizing—that the evidence doesn't support. I want to protect your data from the theorists, not tell you your data is flexible."
  *   **Concede:** That evidence severely constrains plausible emplotments (it's not a free-for-all).
  *   **Hold:** That there remains a residue of choice (beginning/end points, protagonist selection) that is not truth-determined.
  *   **Vulnerability:** **Medium.** She might not care about the "residue." If 90% is determined, she'll view your 10% as negligible noise, making your paper philosophically precise but historiographically trivial.

  #### 4. The Kantian (The Normativity of "Work")
  **The Objection:** "You introduce a 'no-vacuous-shape' constraint: the narrative must 'do work.' But what validates this work? If it's not truth, is it utility? If it's utility, whose? If it's 'perspicuity,' isn't that just a subjective feeling of understanding? You're trying to ground a normative constraint ('don't use vacuous shapes') without a normative foundation. You're dressing up taste as methodology."

  **The 90-Second Reply:** "It's not taste; it's communicative efficiency. A vacuous shape fails to organize the data for a specific audience in a way that allows for prediction or analogy. If my 'tragic' shape doesn't help me understand the next crisis better than a 'chronicle' would, it's bad history. The normativity comes from the *practice* of history as a social science, not from a priori aesthetics. It's pragmatic, not transcendental."
  *   **Concede:** That "doing work" is vague and needs tightening.
  *   **Hold:** That the standard is intersubjective utility within the discipline, not individual taste.
  *   **Vulnerability:** **Soft.** The Kantian will press: "Why is utility a *norm* rather than just a *cause*?" You risk sliding into Rortyan pragmatism, which might alienate the realist historian.

  #### 5. The Analytic Philosopher of Science (The IBE Reduction)
  **The Objection:** "Why are we dragging White and Ranke into this? This is just Inference to the Best Explanation (IBE). The 'narrative shape' is the hypothesis. The 'evidence' is the data. We choose the hypothesis that best explains the data. 'Underdetermination' is a standard problem in philosophy of science. You're reinventing the wheel with continental terminology. Why not just say historians use IBE and move on?"

  **The 90-Second Reply:** "Because IBE assumes the explanation is trying to be *true* in a correspondence sense. White's point is that narrative shapes function *differently* than causal models. They provide meaning, not just mechanism. If I reduce 'tragedy' to a causal hypothesis, I lose the normative dimension of the history. I'm arguing that narrative has a logic that isn't reducible to scientific explanation, and that's why the 'composition principle' worry matters specifically for history."
  *   **Concede:** That there are structural similarities between IBE and narrative selection.
  *   **Hold:** That narrative emplotment carries semantic/normative content that causal models do not.
  *   **Vulnerability:** **Medium.** He might be right that you're over-complicating. If he can show your "no-vacuous-shape" is just "explanatory power," your distinct contribution shrinks.

  #### 6. The Friend's Worry (The Composition Principle as Category Error)
  **The Objection:** "You claim White assumes a composition principle (whole properties transfer to parts). But maybe White isn't making an argument about truth-transfer at all. Maybe he's making a phenomenological claim: that the *experience* of reading history is literary. By demanding he justify the composition principle, aren't you just demanding he answer a question (about truth conditions) he wasn't asking? You might be solving a problem that only exists because you're reading him as an analytic epistemologist."

  **The 90-Second Reply:** "That's a fair worry. But if White's phenomenological claim leads historians to *believe* their claims aren't objective, then the composition principle is operating implicitly in the *reception* of his work. Even if White didn't argue for it, the skepticism in the field relies on it. I'm trying to block the skeptical consequence, even if I have to reconstruct the premise to do it."
  *   **Concede:** That White may not have explicitly argued for the principle.
  *   **Hold:** That the principle is the necessary bridge for the skepticism that followed him to make sense.
  *   **Vulnerability:** **Hard.** This is the most philosophically charitable objection. If you admit he wasn't asking the question, your "refutation" looks like you're correcting him for failing to be you.

  #### 7. The "So What?" (The Pragmatic Dismissal)
  **The Objection:** "Okay, suppose you're right. The harvest yield is true, the tragedy is a shape, and the shape has to do work. Does this change how anyone in this room writes history tomorrow? Or is this just a peace treaty for philosophers?"

  **The 90-Second Reply:** "It changes how we defend our work. When a critic says 'your narrative is constructed,' we shouldn't panic and say 'nothing is true.' We should say 'the shape is constructed, but it's constrained by work, and the facts are solid.' It gives us a vocabulary to be humble about our stories without being nihilistic about our data."
  *   **Concede:** It won't change archival practice.
  *   **Hold:** It changes how we justify our conclusions in public and interdisciplinary contexts.
  *   **Vulnerability:** **Low.** If the room is tired, this won't matter. If they care about public impact, it helps.

  ---

  ### The Strawman Check (Do this now)

  You need to be very careful with **White**.
  *   **The Risk:** You characterize White as arguing "historical claims aren't objectively true."
  *   **The Reality:** White argues that *explanatory arguments* in history are ultimately aesthetic/moral, not strictly logical/empirical. He generally grants the "chronicle" (the list of events) is real, but the "story" (the explanation of their connection) is imposed.
  *   **The Fix:** Do not say White denies the truth of *claims*. Say White denies the truth of *explanations*, and argue that the field has conflated the two. Your "composition principle" is the mechanism of that conflation. If you attack White for denying the truth of "harvest yields," the Formalist will eat you alive. White knows the harvest happened; he doubts the "Tragedy" label is true in the same way.

  You also need to be careful with **Ranke**.
  *   **The Risk:** Rehabilitating him as a naive empiricist.
  *   **The Reality:** Ranke was an Idealist. He believed God spoke through the documents. "Wie es eigentlich gewesen" wasn't just "check the facts," it was "intuit the divine idea in the fact."
  *   **The Fix:** Don't defend Ranke's theology. Defend his *methodological aspiration*: that the documents license specific inferences that constrain the historian. Frame it as "evidential constraint" rather than "divine truth."

  ---

  ### The Silent Killer (The one you're least equipped to handle)

  **The Objection:** **The Ontological Indistinguishability of "Fact" and "Shape."**

  **Why it's the killer:**
  Your argument rests entirely on the ability to separate "the harvest yield in 1788" (Part/Truth) from "the French Revolution as a Tragedy" (Whole/Shape).
  But a sophisticated critic (likely the Literary Theorist or a sharp Kantian) will argue that **facts are ontologically dependent on the shape.**
  *   *Example:* "The harvest yield was a *cause* of the Revolution."
      *   Is "cause" a property of the harvest (Part)? Or is "cause" a property of the narrative shape (Whole)?
      *   If "cause" belongs to the shape, then your "true parts" are actually just raw data (numbers), and as soon as you turn them into historical *claims* ("The harvest caused the unrest"), you have already applied the shape.
      *   Therefore, there are no "truth-evaluable parts" that are free of "narrative shape." The parts are already mini-narratives.

  **Why you are vulnerable:**
  You are a grad student. You haven't written the book yet. You are relying on an intuitive distinction (Fact vs. Story) that post-positivist philosophy has spent 40 years dismantling. If they convince the room that *all* historical claims are "theory-laden" or "narrative-saturated," your firewall dissolves. You cannot simply assert the distinction; you have to defend the ontology of the "fact."

  **Preparation Strategy:**
  Don't try to prove facts are theory-free (they aren't). Argue that there is a **gradient of resistance**. The harvest yield resists my narrative will more than the "Tragic Emplotment" does. The "fact" has a higher friction coefficient. You aren't claiming the fact is shape-free; you're claiming it is *shape-resistant* in a way the emplotment is not. This moves you from a metaphysical claim (which is hard to defend) to a pragmatic one (which is easier to hold).

  **Final Advice:**
  When the Literary Theorist speaks, do not get defensive. Nod. Say, "That is the strongest challenge to this project." Then pivot to the Social Historian: "But does that help [Historian's Name] explain why her dataset rejects her hypothesis?" Play the room against itself. Your thesis is a peace offering; use the conflict between the Theorist and the Historian to show why *both* need your distinction, even if neither likes it perfectly.
