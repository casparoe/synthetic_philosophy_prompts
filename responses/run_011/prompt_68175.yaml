answer: |-
  This procedure determines whether an advance directive overrides the current welfare of a content patient with advanced dementia. It cannot resolve conflicts where the document lacks clear intent or where the medical team disagrees on the patient's current quality of life.

  1. Ask: Does the text use imperative commands binding a surrogate, such as "I demand" or "Do not"?
  2. Ask: Does the text describe preferences or values, such as "I hope" or "Independence matters," without specific instructions?
  3. Ask: Was the document discussed with family after signing, confirming the intent remains active despite changed circumstances?
  4. If text mixes command and hope, classify as Authority only if specific clinical conditions are explicitly met. Otherwise default to Evidence-bearing status.
  5. Assess current welfare: Does the proposed treatment cause observable distress or remove current pleasure like eating or humming?
  6. If Authority-bearing exists and conditions match, it overrides current welfare. If Evidence, weigh against current welfare. If Aspiration, ignore if there is a cost.
  7. Exit A: Directive governs. Condition: Authority-bearing language matches clinical situation exactly, and current welfare cost is deemed acceptable per prior command.
  8. Exit B: Directive does not govern. Condition: Language is Aspiration-bearing, or Authority conditions are not met, or current welfare cost outweighs Evidence-bearing weight.
  9. Hand-off 1: Determining if current contentment is genuine pleasure or mere absence of distress requires clinical judgment by the attending.
  10. Hand-off 2: Determining if the specific clinical scenario matches the directive's conditional triggers requires medical interpretation by the chair.
  11. Case A Analysis: Text is emotional reaction ("like mother"), lacks specific conditions. Classify as Aspiration-bearing or weak Evidence.
  12. Case A Result: Directive does not govern. Patient is content. No specific binding command found to override current welfare.
  13. Case B Analysis: Refusal of artificial nutrition is specific imperative (Authority). "Die at home" is Aspiration. Surrogate wants tube (contradicts Authority).
  14. Case B Result: Directive governs regarding nutrition. Surrogate cannot override Authority-bearing refusal unless conditions mismatch.
  15. Disliked Result: Case B. The patient brightens at hand-feeding. Enforcing the refusal may cause death despite current contentment. This feels harmful.
  16. Failure 1: When the patient's current contentment is chemically induced or delusional, masking suffering the directive sought to prevent.
  17. Failure 2: When the family knows the patient changed their mind verbally but never updated the document, making Authority-bearing text factually obsolete.
