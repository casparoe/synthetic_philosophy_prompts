answer: |-
  You have put your finger on a genuine gap in the standard taxonomy of path dependence. The standard story (Arthur, David) is about **friction** (switching costs, network effects, learning curves). Your story is about **distortion** (the evaluation criteria themselves are endogenous to the incumbent).

  There is no single, universally canonical term for this specific mechanism in economics, though it is discussed in fragments across sociology, philosophy of science, and accounting theory.

  The closest established concept is **Commensuration** (from sociology, specifically Espeland & Sauder), which describes the process of turning different qualities into a common metric. However, "commensuration" describes the *act* of measuring, not necessarily the *bias* toward the incumbent.

  In the philosophy of science, Thomas Kuhn's **Incommensurability** describes how new paradigms cannot be judged by old standards. You are describing the *failure* of the market to recognize incommensurability—forcing the new paradigm to be judged by the old yardstick.

  If you want a sharp, usable term for this specific mechanism, I propose: **Constitutive Path Dependence**.

  Here is why that fits, how it differs from your list, and how to test for it.

  ### 1. The Name: Constitutive Path Dependence
  In institutional theory (Searle, North), there is a distinction between **regulative rules** (which govern behavior, e.g., "do not speed") and **constitutive rules** (which define the reality of the game, e.g., "three strikes constitutes an out").

  *   **Standard Lock-in** is about *regulative* friction: "It is too costly to switch games."
  *   **Your Mechanism** is about *constitutive* bias: "The incumbent wrote the rules of what counts as 'winning' this game."

  The path dependence lies in the **metrics of legitimacy**. The incumbent's specific characteristics become the definition of "quality," "efficiency," or "creditworthiness."

  ### 2. Differentiation from Existing Concepts

  | Concept | The Mechanism | How Your "Wrinkle" Differs |
  | :--- | :--- | :--- |
  | **Standard Lock-in** (QWERTY) | **Friction.** Switching is too costly or requires coordination. | Your mechanism has **no friction**. You *could* switch to the challenger easily, but the challenger is rated "inferior" by the system itself. |
  | **Goodhart's Law** | **Gaming.** Once a measure becomes a target, people optimize the measure, not the outcome. | Goodhart assumes the metric exists *first*. Your mechanism is about **where the metric came from** (the incumbent's DNA). |
  | **Adaptive Preferences** | **Psychology.** Agents change their *wants* to match available options. | This is **structural**, not psychological. The borrower *wants* the loan, but the *score* says no. The market *wants* profit, but *accounting* says software isn't capital. |
  | **Dominant Design** | **Architecture.** A specific product configuration becomes the standard (e.g., the QWERTY keyboard layout). | Dominant Design is about the **product**. Your mechanism is about the **evaluation**. A challenger can have a different design but still lose because it fails the incumbent's *test*. |
  | **Regulatory Capture** | **Politics.** Incumbents lobby regulators to write rules in their favor. | You specified **"without anyone stacking it."** Constitutive Path Dependence is often **emergent**. Accounting rules weren't necessarily lobbied for by GM; they just evolved when GM was the only thing that existed. |

  ### 3. Sharp Definition
  **Constitutive Path Dependence** occurs when:
  1.  An incumbent technology or institution achieves early scale.
  2.  Evaluation metrics (benchmarks, accounting standards, risk scores) are developed *during* this period of dominance.
  3.  These metrics implicitly encode the incumbent's specific structural features as universal virtues.
  4.  Challengers with superior *outcomes* but different *structures* are systematically rated as inferior, not because of switching costs, but because they are "illiterate" in the incumbent's metric language.

  ### 4. The "Blank Slate" Test
  To sort real cases from fakes, apply this counterfactual test:

  **The Test:** *If the evaluation metric had been designed **after** the challenger arrived (on a blank slate), would the challenger score higher?*

  *   **Fake Case (Standard Lock-in):** BetaMax vs. VHS.
      *   *Test:* If we redesigned the "videotape standard" today, would BetaMax win? Maybe. But the reason VHS won was distribution and recording time (features), not because VHS wrote the definition of "video quality." The metric (resolution) was external.
      *   *Verdict:* Standard Lock-in / Network Effects.

  *   **Real Case (Constitutive Path Dependence):** Software Capital vs. Manufacturing Capital.
      *   *Test:* If accounting rules were written today for a software-first economy, would R&D be capitalized as an asset? Yes. Under the old rules (written for steel mills), it is an expense.
      *   *Verdict:* **Constitutive Path Dependence.** The yardstick (GAAP) was built for the incumbent (factories).

  *   **Real Case:** Credit Scores.
      *   *Test:* If we designed a creditworthiness metric today for a gig-economy/cash-flow world, would it rely on 5 years of debt history? No. It would rely on cash flow velocity.
      *   *Verdict:* **Constitutive Path Dependence.** The metric requires you to be the incumbent to pass the test.

  *   **Real Case:** AI Benchmarks.
      *   *Test:* If we designed a "intelligence" benchmark today, would it rely on static datasets (ImageNet) that models can memorize? No. But the early leaders (supervised learning) optimized for static datasets, so the benchmark became "accuracy on static data."
      *   *Verdict:* **Constitutive Path Dependence.**

  ### 5. What does a "Safe" Challenger look like?
  You asked what a challenger looks like that *doesn't* get judged on criteria the incumbent supplied.

  A challenger escapes Constitutive Path Dependence only if it **creates a new metric of value** that becomes socially salient *before* it is judged by the old one.

  *   **Example:** **Tesla (early days).**
      *   *Incumbent Metric:* Build quality, dealership network, ICE engine smoothness.
      *   *Challenger:* Failed on all those.
      *   *Escape:* It successfully introduced a *new* metric: **"Software Updatability"** and **"Acceleration per Dollar."** It forced the market to add these columns to the scorecard. If it had only tried to be a "better car" by the 1990s JD Power standards, it would have failed via Constitutive Path Dependence.

  *   **Example:** **Bitcoin.**
      *   *Incumbent Metric:* Transaction speed, chargeback ability, KYC compliance.
      *   *Challenger:* Fails on all.
      *   *Escape:* It introduced a new metric: **"Censorship Resistance"** and **"Self-Custody."** It didn't try to win the "Visa" exam; it wrote a new exam.

  ### Summary
  You are describing **Constitutive Path Dependence**. It is distinct from lock-in because it is not about the *cost of leaving* the incumbent, but the *impossibility of being recognized* as a valid alternative under the incumbent's rules. It is the economic equivalent of requiring a fish to climb a tree to prove its agility.
