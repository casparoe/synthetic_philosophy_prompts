answer: |-
  ## Activity Design: The Sentencing Algorithm

  This design refines your mechanic to fit a 75-minute window with an engineering mindset. It leans into system optimization first, then introduces a constraint that breaks the optimization logic, forcing a new heuristic.

  ### 1. The Decision on "Punishing the Innocent"
  **Do not make this a playable mechanic.**
  *   **Reasoning:** In a 75-minute session with non-philosophers, offering the option to frame an innocent person triggers an immediate emotional veto ("That's just wrong") that bypasses the utilitarian calculation you want them to experience. It turns the session into a debate about rights rather than a comparison of punishment justifications.
  *   **Alternative:** In the debrief, ask: *"In Round 2, Case C had a 5% catch rate and massive harm. The math demanded a $1M fine. If the law capped fines at $100k, would you have fined a bystander $900k to maintain the deterrence signal?"* This preserves the shock value without letting the game mechanics collapse into a "trolley problem" distraction.

  ### 2. Roles & Materials
  *   **Participants:** 12–15 people. Split into **3 District Teams** (4–5 people each).
  *   **Facilitator:** You (The "City Controller").
  *   **Materials per Team:**
      *   1 Scorecard (paper).
      *   12 Case Cards (see below).
      *   10 "Penalty Tokens" (poker chips or paper squares) to represent sentencing severity.
      *   Scratch paper & pens.
  *   **Room Setup:** Three tables. A central whiteboard for aggregate city stats.

  ### 3. The Rules & Arithmetic (Keep it Simple)
  Tell the teams: *"You are optimizing a sentencing algorithm. Your goal is to minimize **Total City Harm**."*

  **The Variables (on each Case Card):**
  1.  **Harm ($H$):** Damage to society if crime occurs (10 to 100 points).
  2.  **Catch Rate ($P$):** Probability of catching the offender (10% to 90%).
  3.  **Culpability ($C$):** A hidden "moral weight" (1 to 5 stars). *Keep this hidden until Round 3.*

  **The Mechanics:**
  *   Teams assign a **Penalty ($X$)** to each case (0 to 100 tokens).
  *   **Deterrence Check:** If $(X \times P) \geq H$, the crime is **Prevented**. (Cost = 0).
  *   **Failure:** If $(X \times P) < H$, the crime **Occurs**. (Cost = $H$).
  *   **Round Score:** Sum of Costs from all crimes. Lower is better.

  **The Twist (Round 3):**
  Introduce the **"Proportionality Cap."**
  *   New Rule: Penalty ($X$) cannot exceed **Culpability ($C$) $\times$ 10**.
  *   Reveal the Culpability stars on the cards now.
  *   This cap will make it mathematically impossible to deter high-harm/low-catch crimes, forcing teams to accept the crime occurs.

  ### 4. Case Deck Design (Print 3 sets)
  *Design note: Ensure Case B and Case C create the conflict.*

  | Case | Description | Harm ($H$) | Catch Rate ($P$) | Culpability ($C$) |
  | :--- | :--- | :--- | :--- | :--- |
  | **A** | Petty Theft (Repeat) | 20 | 80% (0.8) | 2 Stars |
  | **B** | Corporate Fraud | 80 | 20% (0.2) | 3 Stars |
  | **C** | Dangerous Negligence | 100 | 10% (0.1) | 1 Star |
  | **D** | Violent Assault | 90 | 70% (0.7) | 5 Stars |

  *   **Math Logic:**
      *   **Case A:** Needs Penalty 25 to deter. Cap allows 20. (Close call).
      *   **Case B:** Needs Penalty 400 to deter ($80 / 0.2$). Cap allows 30. **Impossible to deter.**
      *   **Case C:** Needs Penalty 1000 to deter ($100 / 0.1$). Cap allows 10. **Impossible to deter.**
      *   **Case D:** Needs Penalty 129 to deter. Cap allows 50. **Impossible to deter.**
      *   *Correction for Playability:* Adjust the numbers so *some* are solvable and *some* aren't.
      *   *Revised Math for Play:*
          *   **Case A:** Harm 20, Prob 0.5. **Target: 40.** Cap (2*10=20). **Fail.**
          *   **Case B:** Harm 50, Prob 0.5. **Target: 100.** Cap (3*10=30). **Fail.**
          *   **Case C:** Harm 30, Prob 0.8. **Target: 38.** Cap (4*10=40). **Pass.**
          *   **Case D:** Harm 80, Prob 0.8. **Target: 100.** Cap (5*10=50). **Fail.**
      *   *Wait, this is too depressing.* Let's make Round 1 & 2 uncapped so they feel the power of optimization. Round 3 & 4 capped.
      *   **Crucial Case:** One case where High Harm + Low Prob requires a penalty that feels "unfairly high" compared to a Low Harm + High Prob case.

  ### 5. Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:05 | Setup**
  *   Divide into 3 Districts.
  *   Hand out Round 1 & 2 Case Cards (Hide Culpability Stars).
  *   **Instruction:** "Minimize Total City Harm. You set the Penalty ($X$). Crime is prevented if $X \times P \geq H$. Go."

  **00:05 – 00:20 | Rounds 1 & 2 (The Deterrence Phase)**
  *   Teams calculate optimal penalties. They will naturally set high penalties for low-probability crimes (Case B/C).
  *   Facilitator collects scores. Announce the "City Safety Rating" (Inverse of Harm).
  *   *Observation:* Teams will likely assign massive penalties to hard-to-catch crimes.

  **00:20 – 00:25 | The Intervention**
  *   Stop the game.
  *   **Announcement:** "Public outcry. The City Council passes the **Proportionality Act**. You can no longer sentence based on deterrence math alone."
  *   Reveal the **Culpability Stars** on the cards.
  *   **New Rule:** Max Penalty = Stars $\times$ 10.
  *   Hand out Round 3 & 4 Cards (same cases, different random seed or just replay).

  **00:25 – 00:40 | Rounds 3 & 4 (The Desert Phase)**
  *   Teams recalculate. They will hit the cap immediately on low-catch/high-harm crimes.
  *   They must accept the Harm points because they cannot raise the Penalty.
  *   Facilitator collects scores. The City Safety Rating will drop significantly.

  **00:40 – 01:15 | The Debrief (The Core Learning)**
  *   **Step 1: The Data (5 mins).** Plot the Round 2 vs. Round 4 scores on the whiteboard. Show the efficiency drop. Ask: *"Why did safety go down? You didn't get less skilled."*
  *   **Step 2: The Conflict (15 mins).** Focus on the specific case where the Cap hurt most (e.g., Corporate Fraud).
      *   Ask: *"In Round 2, what was the penalty for Fraud?"* (e.g., 400).
      *   Ask: *"In Round 4, what was the max allowed?"* (e.g., 30).
      *   Ask: *"Why did the rules change? What logic was Round 2 using?"* (Efficacy, Outcomes, System Safety).
      *   Ask: *"What logic was Round 4 using?"* (Fairness, Individual Blame, Limits).
  *   **Step 3: Naming the Views (10 mins).**
      *   Reveal the terms.
      *   Rounds 1–2 = **Consequentialism / Deterrence.** (Justification: Future safety. Focus: The Schedule).
      *   Rounds 3–4 = **Retributivism / Desert.** (Justification: Past wrongdoing. Focus: The Individual).
  *   **Step 4: The Gap (10 mins).** (See section below).
  *   **Step 5: Wrap (5 mins).**

  ### 6. Predictable Failures & Steering
  1.  **Math Paralysis:** Engineers might over-optimize.
      *   *Fix:* Give them a calculator or keep numbers multiples of 10. Remind them: "Good enough is fine. We need decisions, not perfection."
  2.  **Ignoring the Narrative:** They might treat Case A and B as identical math problems.
      *   *Fix:* In the debrief, read the case titles aloud. "You sentenced 'Petty Theft' and 'Corporate Fraud' with the same logic in Round 1. Did that feel odd?"
  3.  **The Cap Feels Like a Budget:** They might treat the Cap as a resource constraint rather than a moral one.
      *   *Fix:* When introducing the Cap, use moral language. "The public says it is *wrong* to punish a 1-Star crime like a 5-Star crime, regardless of utility."
  4.  **Resentment of the Cap:** They might get frustrated that they "can't win" anymore.
      *   *Fix:* Validate this. "That frustration you feel? That is the cost of prioritizing Desert over Deterrence. You are feeling the trade-off."

  ### 7. What The Game Cannot Reproduce (The Gap)
  You must supply these three elements verbally in the debrief, as the simulation cannot generate them:

  1.  **The Subjective Experience of Punishment:**
      *   *In Game:* A penalty is just a number on a scorecard.
      *   *In Reality:* Punishment is suffering, loss of liberty, and stigma. The game cannot make the players *feel* the weight of the sentence they are handing down. You must remind them: *"In Round 1, you were willing to destroy a life to send a message to others. In Round 4, you let crimes happen to protect a life from disproportionate destruction."*
  2.  **The Moral Resentment of the Offender:**
      *   *In Game:* The "offender" is a card. It doesn't care.
      *   *In Reality:* A Retributivist argues that if we punish beyond desert, the offender has a right to feel *wronged* by the state, even if the punishment saves lives. The game shows inefficiency; you must explain the *injustice*.
  3.  **The "Punish Innocent" Horizon:**
      *   *In Game:* Rules forbid it.
      *   *In Reality:* Pure deterrence logic *does* justify punishing the innocent if it stops enough crime (the "Scapegoat" problem). Since you didn't let them play this, you must explicitly state: *"If you had been allowed to fine a bystander in Round 2 to lower the City Harm score, the math would have told you to do it. The only thing stopping you was the rule I imposed. In the Deterrence view, there is no principled reason to stop there other than practicality."*

  ### 8. Facilitator Script for the "Aha" Moment
  When debriefing the specific case where the Cap prevented Deterrence:

  > "Look at Case B. In the first half, you set the penalty at 400. Why? Because that's what it took to make the math work for the *city*. The offender was just a variable in the equation.
  >
  > In the second half, the cap forced you to set it at 30. Why? Because that's what this *person* did. The city suffered more crime, but the relationship between this crime and this punishment was fixed.
  >
  > One view looks at the **schedule** (the whole system of crime rates). The other view looks at the **scale** (the balance between this act and this consequence). You just played both, and you saw they break each other."

  ### 9. Materials Checklist
  *   [ ] 36 Case Cards (12 per team, printed on cardstock).
  *   [ ] 3 Scorecards (Columns: Case, Harm, Prob, Penalty, Prevented?, Cost).
  *   [ ] Whiteboard markers (for aggregate city stats).
  *   [ ] Timer (visible to all).
  *   [ ] Small tokens/chips for "Penalty Units" (optional, but tactile helps).

  ### 10. Why This Works for Engineers/PMs
  *   **System Thinking:** It frames justice as an optimization problem initially, which is their native language.
  *   **Constraint Introduction:** Introducing the "Proportionality Act" mimics a product requirement change that breaks the existing architecture. They understand the pain of refactoring under constraints.
  *   **Data-Driven Debrief:** The debrief relies on the scores they generated, not abstract theory. They argue from their own data.
