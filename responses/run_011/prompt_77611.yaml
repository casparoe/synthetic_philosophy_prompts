      *   *Proposed Method:* "Dynamic Fidelity." We treat the papers as data points of her reasoning process, not just her conclusions. The covering note *is* part of the intent. Ignoring the instruction to update based on new evidence violates the intent just as much as ignoring the papers.
      *   *Why?* Because the covering note explicitly authorizes updating. Trustee 2's strict textualism ignores the covering note. Trustee 1's pure principlism risks ignoring the specific constraints (like the 2003 withdrawal).
