  5.  **Refining the Decision & Conditions:**
      *   The proposal pays adolescents, locked until 21, forfeited if pregnancy occurs.
      *   1989 says: Don't price fertility.
      *   2007 says: Don't coerce (unexitability).
      *   If we remove the forfeiture condition, it becomes a savings match, not a fertility incentive. This aligns better with 1996 (compensating cost/effort) and avoids 1989 (pricing fertility).
      *   *Decision:* Approve contingent on removing the pregnancy forfeiture clause.
