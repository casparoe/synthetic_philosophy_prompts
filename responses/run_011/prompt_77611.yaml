  3.  **Address the Specific Papers:**
      *   *1989 (Fertility):* Rejection based on efficacy and morality. Margin note says if efficacy is proven (which the proposal claims via 2 of 3 studies), the moral objection might fall. *Ruling:* The margin note invalidates the moral objection *if* efficacy is proven.
      *   *1996 (CHW):* Payment for cost vs. surrender. Pregnancy avoidance isn't a "cost borne" like travel to a clinic. It's a life outcome. This leans against the program.
      *   *1974/2003 (Blood):* Withdrawal without reason. Shows she changed her mind on commodification. Suggests caution on monetizing body/life choices.
      *   *2007 (Unexitability):* Can adolescents leave? If the money is locked until 21, is that coercive? The proposal says leaving early forfeits accrual. That creates a "golden handcuff."

  4.  **Drafting - Section by Section:**

