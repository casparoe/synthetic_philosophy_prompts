      *   *Self-Correction on the Principle:* I need to be careful not to just say "your intuitions are wrong." I need to find the *best fit* and point out the *residue*.
      *   *Revised Principle:* **The Norm of Deliberative Closure.** *Rationality requires that deliberation cease when marginal cost exceeds marginal benefit. Where evidence is equal, any mechanism that closes deliberation is permissible, provided the mechanism does not violate the normative role of the agent.*
