answer: |-
  There is no single principle that validates every intuition you have listed, because your intuitions oscillate between two competing standards: **Efficiency** (close the deliberation as cheaply as possible) and **Authorship** (the reason for closing must feel like it originated in you).

  However, we can come very close with a single formulation that exposes exactly where your coherence fractures.

  ### The Principle of Normative Closure

  **Statement:** *When evidence fails to discriminate between options, rationality requires the agent to close deliberation using the least costly method available, provided that the method does not violate the normative expectations of the agent's specific role.*

  This principle has two clauses. **Clause A (Efficiency)** demands you stop thinking and pick. **Clause B (Role)** restricts *how* you pick based on who you are (diner, judge, friend).

  ### Application to Your Cases

  1.  **The Diner:** **Clause A** dominates. The cost of starvation exceeds the cost of picking. Ordering is rational; starving is a failure of closure.
  2.  **The Patient:** **Clause A** dominates. Private role. Arbitrary pick closes deliberation efficiently. No apology needed because no public reason is owed.
  3.  **The Judge:** **Clause B** dominates. The judicial role carries a normative expectation of *reason-giving*. A coin toss satisfies Clause A (efficiency) but violates Clause B (justifiability). Your flinch is correct; the coin toss is an abdication of the specific role, even if the indifference is identical to the patient's.
  4.  **The Parking:** **Clause A** operates on *subjective* expected value. If you suspect a difference, evidence *does not* fail to discriminate (in your mind), so deliberation is rational. If you know they are equal, deliberation is a cost with no benefit. Your verdict holds.
  5.  **The Penny Swap:** **Clause A** dominates. Paying introduces a cost to a zero-benefit move (irrational). Free swapping has zero cost, so it is technically permissible, but... (see Conflict below).
  6.  **The Friend:** **Clause A** dominates. External tie-breaking is a low-cost closure mechanism. Your embarrassment stems from a desire for Authorship, which this principle does not value, but the choice remains rational.
  7.  **Self-Persuasion vs. Standing Rule:** Here lies the fracture. **Clause A** dictates that a Standing Rule is *superior* to Self-Persuasion. A rule is a pre-computed algorithm that costs zero cognitive energy at the moment of choice. Self-persuasion requires active mental work to manufacture a preference.

  ### The Conflict and the Overruling

  Your intuitions are coherent on the Diner, Patient, Judge, and Parking. They are stable on the Penny (distinguishing cost). But they break on **Case 7 (The Rule)** and wobble on **Case 5 (Free Swapping)**.

  *   **The Conflict:** You view Self-Persuasion as "resourcefulness" but a Standing Rule as "empty." Yet both are manufactured reasons. The Rule is simply a more efficient version of the Persuasion.
  *   **The Overruling:** To maintain the Principle of Normative Closure, **you must overrule your suspicion of the Standing Rule.** If your goal is rational choice under indifference, a pre-commitment to "always take the left" is *more* rational than agonizing or talking yourself into a preference in the moment. Your intuition that it lacks "reason" is a category error; the reason is *computational economy*, not evidential weight.

  *   **Secondary Overruling:** You call free repeated swapping "harmless." Under Clause A, time is a cost. Indefinite swapping consumes time. Therefore, it is **irrational**, not harmless. It is a failure to close deliberation.

  ### Implications for Your Undecided Cases

  **1. The Air-Ambulance (One helicopter, two equal calls)**
  *   **Verdict:** A coin toss is **impermissible**.
  *   **Reasoning:** This falls under **Clause B (Role)**. Like the Judge, the ambulance service occupies a public trust role that demands defensibility. "Random chance" is not a defensible triage protocol. The service must adopt a *Standing Rule* (e.g., "closest call," "first received") even if that rule is arbitrary in the abstract. The rule provides the necessary normative cover that the coin lacks. You must prioritize the *appearance of reasoned procedure* over pure randomness, even if the outcome is statistically identical.

  **2. The Recommendation System (Forbidden from returning a tie)**
  *   **Verdict:** This is **deceptive but necessary**.
  *   **Reasoning:** The system is acting as a **Friend** (Case 6) but without disclosing its indifference. It is engaging in *Self-Persuasion* (Case 7) on your behalf. To be rational, it must break the tie (Clause A). To be ethical, it should signal that the preference is manufactured. If it cannot signal that, it is treating the user as a Patient (who doesn't need to know) when it should treat them as a Diner (who might care). The system should break the tie, but the design constraint forbidding a "tie" display is ethically risky because it masks indifference as quality.

  ### The Hidden Case

  You have hidden **The Symmetric Moral Sacrifice**.

  **The Case:** A firefighter enters a burning room and finds two unconscious children in identical conditions. She can save only one. She cannot rank them. She saves the one on the left.
  **The Verdict:** She is **blameless**, but she must not say she "chose."
  **Why:** This combines the Judge's high stakes with the Patient's lack of evidence. If she says "I chose the left," she implies a reason. If she says "I saved the one I could reach," she acknowledges the tie.
  **The Trap:** If she later learns the child on the right would have survived longer, or was her own neighbor, does she regret the tie-breaking method?
  **My Verdict:** In moral ties, **randomization is morally superior to preference-manufacturing.** Unlike the Judge (who decides property) or the Patient (who decides health), the Firefighter decides *life*. Manufacturing a reason ("I felt drawn to the left") mystifies the tragedy. Acknowledging the coin toss (or the arbitrary reach) honors the equality of the claims. Your intuition on the Judge (flinching at the coin) is wrong here; in moral tragedy, the coin is the only honest acknowledgment that the values were equal.

  ### Summary for your Column

  Your verdicts are not a mess, but they are **role-sensitive**. You demand efficiency from diners and patients, but legitimacy from judges and rules.

  *   **Keep:** The distinction between Private (Patient) and Public (Judge) tie-breaking.
  *   **Discard:** The idea that a Standing Rule is inferior to in-the-moment persuasion. The Rule is the rational ideal; the Persuasion is a psychological crutch.
  *   **Watch:** The "harmless" free swap. Time is always a cost.

  The Buridan's Ass does not starve because it cannot choose; it starves because it refuses to accept that **the reason for the choice can be the need to choose.**
