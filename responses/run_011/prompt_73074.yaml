answer: |-
  Standing here, on this pavement, the ground feels different than it did when I was a child. Then, it was just the street outside my home. Today, it is a record.

  In 1938, the family who lived here and ran the yard behind us was forced out. My great-grandfather bought the property for a fraction of its value. By the laws of that time, the transaction was legal. No court will ever charge my family with a crime for that purchase. My father is right about that. We are not criminals.

  But legality is not the same as innocence.

  In 1942, the family was deported. Four people. One returned. The business that educated me, the building I grew up in, the security I enjoy—it all flows from that transfer of ownership. For decades, my family did not speak about where this security came from. For a long time, I did not ask.

  Two years ago, I went into the archives. It took me that long to find the paper trail. But the time before that—the years I lived in this house without asking who was here before me—that time belongs to me. That silence is mine. I am morally answerable for what I chose to ignore when I could have looked. I cannot blame the generation before me for their silence; I can only account for my own.

  There is a debt that is not financial. It is the debt of the citizen who inherits a history. I live in this town. I benefit from the continuity of this firm. Because I accept the benefits of this history, I must also accept the liability. This is not a stain on my soul; it is a bill that has come due. I cannot pay it back, but I can acknowledge that it is owed.

  And there is something heavier. I am standing here, breathing, while they were murdered for being alive. There is a solidarity between all human beings that is broken when one is destroyed and the other remains. To feel that break is not to claim a vague sin we all share. It is to admit that my safety was bought with their destruction. That solidarity demands I do not look away now.

  To the daughter of the family, who has traveled from Haifa, and to the nephew from Chicago: You asked what we knew and when. I have told you. I cannot give you back the years. I cannot restore the lives. But starting today, the haulage yard behind us will be transferred to the town's memorial foundation. This does not settle the account. It is simply a recognition that the ground no longer belongs to us.

  The stones we lay today are small. They will not trip us. But they are an obstacle to forgetting. I cannot promise that remembering will make us better. I can only promise that I will not pretend it didn't happen.

  Thank you.

  ***

  I bent the distinction between political and moral guilt slightly when addressing the father; by validating his legal innocence while insisting on my own liability for the "benefits," I implicitly ask him to share the political debt without forcing him to confess to a moral sin he rejects. I also softened the metaphysical claim; Jaspers defines it as co-responsibility for every injustice, but I narrowed it to the specific solidarity of survivor/victim to prevent it from sounding like a universal absolution that dilutes the specific historical crime.
