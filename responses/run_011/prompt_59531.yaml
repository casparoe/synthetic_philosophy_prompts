  1. **[HOPE NOBODY RAISES] The Normative Grounding Objection (Professor)**
     **Objection:** "You insist preferences are irrelevant, but declaring growth 'optimal' is itself a valuation indistinguishable from assuming logarithmic utility, so you haven't escaped the preference framework."
     **Reply:** I concede the recommendations are extensionally equivalent to log-utility, but I insist the justification derives from ergodic properties of the dynamics rather than axioms of choice.
     **Softest Point:** Explaining why physical dynamics alone generate normative force without presupposing a goal like 'survival' or 'wealth maximization'.

  2. **The "Desperate Agent" Counterexample (PhD Student)**
     **Objection:** "You claim ruinous strategies are inadmissible for any utility function, but if I need a huge payoff to save a life, a ruinous gamble is my only rational option."
     **Reply:** I concede this holds for agents with subsistence constraints or bounded utility over consumption, and I should restrict Claim 3 to agents prioritizing long-term wealth preservation.
     **Softest Point:** Admitting the universal quantifier in Claim 3 was too strong undermines the argument that concavity is never doing the work.

  3. **The Finite Horizon Problem (Finance Visitor)**
     **Objection:** "Growth rates only converge in the limit, but real investors have finite horizons and liquidity needs that make this criterion irrelevant for actual portfolio choice."
     **Reply:** I concede finite horizons alter the optimal fraction, but I argue the infinite horizon provides the correct normative baseline for evaluating wealth dynamics.
     **Softest Point:** Justifying why finite beings should care about infinite limits when their actual constraints dominate the decision.

  4. **The Equivalence Charge (PhD Student)**
     **Objection:** "If the math is identical to expected log-utility, why reject the preference framework that already justifies it without appealing to ergodicity?"
     **Reply:** I concede the mathematical identity, but I argue the conceptual foundation changes how we handle non-ergodic processes where utility functions are undefined.
     **Softest Point:** Demonstrating a concrete case where the ergodic recommendation diverges from robust utility modeling.

  5. **The Dutch Book Coherence Challenge (PhD Student)**
     **Objection:** "If you reject expected value in single shots, doesn't that leave you open to Dutch Books across simultaneous offers of this same gamble?"
     **Reply:** I concede vulnerability in simultaneous single shots, but I argue sequential dynamics change coherence conditions such that Dutch Book arguments do not apply.
     **Softest Point:** Defining the precise boundary between sequential and simultaneous decisions without arbitrariness.
