prompt: |-
  I'm an MA student in philosophy — mostly ethics, honestly — and this term I'm sitting in on the department's philosophy of mathematics seminar because it's the only thing that fit around my TA hours. Two weeks ago we did the set theory session and somebody ran Hilbert's hotel as a warm-up, and one of the guys in the seminar (he's also doing a theology degree) said the hotel isn't a cute puzzle at all, it's a reductio: a hotel with infinitely many occupied rooms that can still take new guests is a hotel where a proper part is just as big as the whole, and since the whole is greater than the part, that's flatly impossible, so there are no such hotels, i.e. no actually infinite collections. Then he extended it to time: if the past were infinite we'd have already completed an endless counting to get to today, which he thinks is the same violation in different clothes. The seminar leader pushed back and said nobody ever supposed that maxim was a claim about the sizes of sets, it's about parthood — wholes and parts, mereology or whatever — so of course the hotel doesn't contradict it. The theology guy said that was special pleading: either the maxim is a necessary truth about size or it isn't, and if it's only about "parthood" it can't do any work at all. I genuinely couldn't tell who won, and my strong suspicion is that they were both using one sentence to mean two different things, maybe three. I vaguely remember the line being one of the common notions Euclid lists at the front of the Elements and something about it concerning magnitudes, but I might be mixing that up with something else.

  I volunteered to write the weekly précis that gets emailed to everyone on the seminar list, which is awkward, because I'm the least qualified person in the room. So: can you take that one sentence — the whole is greater than the part — and lay out the distinct precise claims it could be making? I want a menu, not a defence of whichever reading you like best, and if two of the readings turn out to be the same claim in different words, say so rather than padding the list. For each reading I want to know what it says exactly (what's being compared, and in what sense of "greater"), whether it's trivial, substantive but true, or false, and one or two sentences of why. Then tell me which reading the theology guy actually needs for the hotel to be absurd, and which one he needs for the infinite-past step, and whether those two are the same reading — I have a feeling the second move quietly swaps in a stronger one. I don't need names, dates or references, I mostly just need to understand what's on the table.

  Please use these sections in this order:

  1. What was actually claimed — about 100 words, reconstructing his hotel argument in premise-and-conclusion form so I can check I've got it right, and separately the infinite-past argument.
  2. The menu — the readings, labelled R1, R2, R3 and so on, each with the precise claim, a verdict (trivial / substantive and true / false / not really a claim about size at all), and why. This should be the bulk of it, 600-800 words.
  3. What the argument needs — which reading he's committed to at each step, whether it survives, and exactly where the swap happens if there is one. Around 200 words.
  4. Where the seminar leader is right and where he's sliding — 150 words. I don't want him to just win by default; if his mereology reply is partly a dodge, say so.
  5. Bottom line for the précis — three or four sentences I could paste in nearly as they are, in a tone that doesn't make either of them look stupid.
