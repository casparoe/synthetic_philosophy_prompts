answer: |-
  The practice of national accounting presupposes a theory of value that might be termed **Market-Actualized Productivism**. Its reconstruction, implications, and incoherences can be dissected as follows.

  ### 1. The Implicit Theory of Value and Well-being
  The practice treats a life as going better to the extent that it commands a larger flow of commodities that are either exchanged for money or closely resemble exchangeable commodities. Value is ontologically tied to **alienability**: a thing has economic value if it *can* be separated from its producer and sold, or if it is a tangible good that *could* be sold.

  *   **What makes life better:** The accumulation of "final goods and services" that pass through a market gate (or a proxy gate, like imputed rent). Well-being is equated with **consumption potential**.
  *   **What is mere cost:** Human effort, time, and pain are treated as inputs to be minimized only insofar as they limit output. They are not subtracted from the total. A ton of maize grown in 1 hour and a ton grown in 10 hours contribute equally to GDP; the extra 9 hours of toil are invisible costs, not deductions.
  *   **The status of leisure:** Leisure is invisible to the metric, or visible only negatively as **output forgone**. In this framework, time not spent producing counted value is a vacuum. It is not an asset to be accumulated (free time) but a resource left unexploited. The theory presupposes that time is valuable only when converted into product.

  ### 2. Strict Commitment vs. Comfortable Fit
  We must distinguish between the **accounting identity** and the **welfare interpretation**.

  *   **Strict Commitment:** Strictly, the System of National Accounts (SNA) commits one only to a measure of **market-linked throughput**. It commits to the proposition that "economic activity" is defined by transactions (or near-transactions). It carries no *logical* necessity that higher GDP equals higher welfare. One could consistently argue that GDP measures "economic busyness" while welfare measures "human flourishing," and that the two often diverge.
  *   **Comfortable Fit:** The practice fits comfortably with **Utilitarian Aggregation** (summing individual outputs) and **Materialist Hedonism** (goods generate utility). It also fits with State Capacity theory: goods that are counted are generally taxable; goods that are ignored are not.
  *   **The Line:** The line between convention and philosophy is crossed when GDP per capita is designated the "yardstick by which living standards and 'development' are officially compared."
  *   **Internal Settlement:** The practice itself settles the question against the "mere convention" reading through its **imputations**. By imputing the value of owner-occupied housing, the accounts admit that *utility consumption* matters, not just cash transactions. If the goal were merely to track market liquidity, imputed rent would be excluded. Its inclusion proves the system aims to measure *command over living standards*. Therefore, the exclusion of unpaid care work is not a neutral technical omission but a philosophical assertion that such care does not constitute a "standard of living" in the same way housing does.

  ### 3. Coherence of the Goods/Services Line
  The boundary between counted and uncounted household activity is theoretically unstable. We can test three candidate principles against the exceptions provided in the text:

  1.  **Market Linkage:** *Principle:* Only activities involving money count.
      *   *Test:* Fails. Homegrown maize (no money) counts; owner-occupied housing (no money) counts.
  2.  **Third-Party Separability:** *Principle:* The service must be separable from the person.
      *   *Test:* Fails. Housing services are consumed by the owner immediately; they are not separable. Yet they count. Unpaid cooking is separable (someone else could eat the food), yet it does not count.
  3.  **Contractability (The "Hireability" Test):** *Principle:* If the task could be contracted to a third party for a wage, it has value.
      *   *Test:* This is the operative principle, but it is applied inconsistently. A hired cook counts; a hired landlord (renting) counts. An unpaid parent does not.
      *   *Incoherence:* The inconsistency lies in **gendered historical convention** masquerading as economic logic. "Goods" (maize) and "Capital Services" (housing) are traditionally male-coded or property-coded spheres, deemed objective and valuables. "Care Services" (cooking, child-rearing) are traditionally female-coded, deemed "natural" or "affective," and thus outside the economy. The principle is not economic coherence but **patriarchal inertia**: value is assigned to what looks like capital accumulation or market substitution, while reproductive labor is treated as a biological given.

  ### 4. Excluded Rival Accounts of Value
  The metric actively excludes rival theories, not merely by failing to display them, but by structuring incentives that make them invisible:

  *   **Desire Satisfaction:** Excluded. If a population desires more leisure over more maize, GDP registers this as a recession (lower output). It assumes the desire for *goods* is paramount.
  *   **Health, Friendship, Uncoerced Activity:** Excluded. These are treated as externalities. Disease load is only counted if it generates medical spending (a "defensive expenditure" counted as positive GDP). Uncoerced activity is invisible unless it produces a marketable good.
  *   **Total vs. Average Value:** Per-capita GDP embodies a **covert Average View**, but a distorted one.
      *   *The Neolithic Case:* The shift to agriculture increased the *total* population and *total* output (Total Utilitarian Gain) but decreased individual health and leisure (Average Utilitarian Loss).
      *   *GDP's Verdict:* Because GDP per capita divides total output by population, it attempts an Average View. However, because it counts the "goods" (maize surplus) that allowed the population boom but ignores the "bads" (disease, toil) that lowered individual quality of life, it falsely registers the Neolithic shift as an **Average Gain**. It embodies an **Average Material View**, assuming that more stuff per person equals better life per person, regardless of the biological or temporal cost of acquiring it.

  ### 5. Revision for a Theory of "Freedom from Toil"
  If we replaced the implicit theory with one where **freedom from toil** and **length of the working day** are constituents of a good life (a "Time-Sovereignty" theory):

  *   **Where the Revision Must Occur:**
      *   *Satellite Ledgers are Insufficient:* Placing time-use in satellite accounts keeps the "headline" theory intact. It treats leisure as a footnote to production.
      *   *The Accounts Themselves:* The revision must be in the **headline figure**. We would need a **Net Domestic Product of Time**. This would value non-market time (leisure, care) at a shadow price (e.g., the wage rate of equivalent labor) and add it to consumption, or conversely, subtract the "disutility of labor" from the value of goods produced.
      *   *Usage:* Even with new accounts, if "Development" is still defined as growth in the headline number, the theory fails. The definition of development must shift from "expansion of output" to "expansion of capability/time."

  *   **The Agricultural Revolution Re-evaluated:**
      *   **The State/Elite Ledger:** Would still show a **Gain**. Surplus grain allows for specialization, armies, and monuments. The "output" available to the ruling class increases.
      *   **The Commoner Ledger:** Would likely show a **Loss**. The increase in caloric output is offset by the massive increase in labor hours (farming is harder than foraging) and the depreciation of health (stature, disease). Under a Time-Sovereignty metric, the "cost" of the maize (in hours of backbreaking labor) would outweigh the "value" of the consumption.
      *   **The Species Ledger:** Remains ambiguous. If the theory values the *existence* of more humans (Total View), it is a gain. If it values the *quality* of existence (Average View), it is a loss.
      *   **Conclusion:** Under a theory that values freedom from toil, the Agricultural Revolution is revealed not as "Progress" but as a **intensification of exploitation**. The sign depends on whose ledger one reads: it is a gain for the *system* (complexity, population, state power) and a loss for the *agent* (health, leisure, autonomy). The current GDP metric hides this by reading only the System's ledger and calling it the Agent's welfare.
