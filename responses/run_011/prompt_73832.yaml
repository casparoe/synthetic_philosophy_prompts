      *   *The "Idealization" Trap:* The prompt says "no non-cognitive bottlenecks." This removes physical testing time. But it doesn't remove *conceptual* difficulty. Mathematical proofs take time even with infinite compute if the search space is vast.

  9.  **Final Polish:**
