      *   **Supervisor's Constraint:** The core philosophical work is specifying the *desiderata* for an adequate theory of consciousness relative to the project's aim (third-person assessment of fully inspectable systems), not answering the question directly yet.
      *   **My Role:** Professional philosopher of mind, exacting, explicit about substantive vs. verbal disagreements, willing to correct the student.
      *   **Specific Tasks:**
          1.  Introductory paragraph: Distinguish genuine contests from verbal disputes.
          2.  Tier 1 Requirements: Bind *any* theory (reports, introspection, report/behavior divergence, empirical consistency).
          3.  Tier 2 Requirements: Specific to Illusionism (compelling nature, no smuggling, introspection's target, illusion/delusion/misdescription distinction, explanatory burden).
          4.  Analysis of the List:
