              *   Non-negotiable vs. camp preferences.
          5.  Assessment of 4 Approaches: GWT, HOT, Predictive Processing, IIT (brief, focus on failures/stipulations).
          6.  Formatting: Numbered requirements with short names. No bibliography/citations.
      *   **Tone:** Professional, rigorous, supportive but critical (no flattery).

  2.  **Deconstruct the Philosophical Landscape (Introductory Paragraph):**

      *   *Goal:* Clarify what is real disagreement vs. terminological confusion.
      *   *Key Distinction:* The "Hard Problem" (why it feels like something) vs. the "Real Problem" (how functions are performed).
      *   *Verbal Disputes:* Often revolve around the definition of "consciousness" (phenomenal vs. access vs. self-consciousness).
      *   *Substantive Disputes:* Whether phenomenal properties exist independently of functional roles (Realism vs. Illusionism) and whether third-person data can ever settle first-person ontology.
      *   *Drafting thought:* Keep it tight. Focus on the "Explanandum" (what needs explaining). Is it the *feeling* or the *judgment* that we have a feeling?

  3.  **Develop Tier 1 Requirements (General Constraints):**

      *   *Constraint:* Must apply to *any* theory (Realist or Illusionist).
      *   *Focus:* Third-person assessment, inspectable systems, empirical data.
      *   *Req 1 (Report Stability):* Theories must explain why reports of experience are stable and coherent, not random.
      *   *Req 2 (Introspective Directness):* Must account for the *feeling* of immediacy, even if it's an illusion.
      *   *Req 3 (Dissociation):* Must handle cases where report/behavior diverges (e.g., blindsight, locked-in).
      *   *Req 4 (Empirical Consistency):* Must align with neuroscience/psychology (sleep, anesthesia).
      *   *Refinement:* Make them sharper. "Report Stability" is too weak. Let's call it "Report Reliability." "Introspective Directness" needs to be about the *phenomenology of access*.
      *   *Correction:* The student asked for "what it must explain about our reports." Let's ensure the requirements reflect the *evidential value* of reports.

  4.  **Develop Tier 2 Requirements (Illusionism Specific):**

      *   *Constraint:* Specific to views denying intrinsic qualia.
      *   *Req 5 (Illusion Robustness):* Why is the illusion so hard to shake? (Unlike Müller-Lyer).
      *   *Req 6 (No Smuggling):* Don't reintroduce qualia as "functional qualia."
      *   *Req 7 (Introspective Target):* If introspection is wrong about *what*, what is it right about? (Tracking functional states).
      *   *Req 8 (Illusion vs. Delusion):* Distinguish systematic error from pathology.
      *   *Req 9 (Explanatory Burden):* Does it explain less? (The "Deflation" clause).
      *   *Refinement:* The distinction between illusion and delusion is crucial. Illusion implies a shared cognitive architecture; delusion implies pathology.
      *   *Correction on Req 9:* The student asks if the theory is entitled to explain less. The requirement should be that it must justify *why* it explains less without losing predictive power.

  5.  **Analyze the List (Compatibility, Elimination, Status):**

      *   *Compatibility:* The big tension is First-Person Authority (Tier 1) vs. Third-Person Verification (Project Aim). If introspection is infallible (Realism), third-person inspection is secondary. If introspection is fallible (Illusionism), third-person inspection is primary. *Crucial Point:* Can they be jointly satisfied? Yes, but only if "Authority" is redefined as "Privileged Access" not "Infallibility." If the student demands Infallibility, the project fails. I need to be clear here.
      *   *Most Eliminative:* Likely the "No Smuggling" clause (Tier 2) or the "Dissociation" clause (Tier 1). Actually, for the *project's purpose* (machine assessment), the "Third-Person Operability" is the killer. But within the list provided? "No Smuggling" kills weak illusionisms. "Empirical Consistency" kills dualisms. Let's go with "Empirical Consistency" as it kills Cartesian dualism immediately.
      *   *Non-negotiable vs. Preference:* Empirical consistency is non-negotiable for a scientific theory. "Introspective Directness" is a phenomenon to explain, but treating it as *veridical* is a camp preference.

  6.  **Assess the Four Approaches:**

      *   *GWT (Global Workspace):* Good on report/access. Fails on "what it's like" (Hard Problem) unless paired with Illusionism. Fails Tier 2 Req 6 (often smuggles in 'experience' as 'broadcasting').
      *   *HOT (Higher-Order Thought):* Good on introspection. Fails on "Richness" (too many unconscious states?). Fails Tier 1 Req 2 (Directness feels immediate, not thought-mediated).
      *   *Predictive Processing (Controlled Inference):* Good on empirical consistency. Fails Tier 2 Req 7 (What is introspection tracking? Prediction errors? Vague).
      *   *IIT (Integrated Information):* Good on metaphysics. Fails Project Aim (Panpsychism makes machine assessment impossible/untestable from outside). Fails Tier 1 Req 4 (Hard to map to anesthesia data precisely).

  7.  **Review and Refine (Self-Correction against constraints):**

      *   *Tone Check:* Am I being too academic? Keep it precise but accessible to a bright Sixth Former.
      *   *Supervisor's Point:* Ensure the focus remains on *specifying the theory's job*, not doing the job.
      *   *The "Trouble" Check:* The student worries about First-Person Authority vs. Third-Person Inspection. I need to confirm this is the critical tension.
      *   *Formatting:* Numbered requirements. Short names.
      *   *Intro:* Ensure the verbal vs. substantive distinction is clear.
      *   *Illusionism Tier:* Ensure the "Smuggling" point is sharp.
      *   *Assessment:* Keep it brief.

  8.  **Final Polish:**

      *   Check the "Illusion vs. Delusion" distinction. This is subtle. Illusion = cognitive architecture feature. Delusion = bug. Illusionism needs the former.
      *   Check the "Explanatory Burden." Illusionists claim they explain the *judgment* not the *property*. The requirement must demand they explain why the judgment is so specific.
      *   *Correction on Compatibility:* I need to be honest. If "Authority" means "Infallible Truth," it is incompatible with "Third-Person Inspection." If it means "Privileged Access," it is compatible. I will specify this distinction clearly.

  9.  **Drafting the Response:** (Mental outline of the text to be generated)
      *   Intro: Verbal (definition of consciousness) vs. Substantive (existence of non-functional properties).
      *   Tier 1: 1. Report Reliability, 2. Phenomenal Presence, 3. Dissociation Accommodation, 4. Empirical Alignment.
      *   Tier 2: 5. Illusion Stability, 6. No Phenomenal Smuggling, 7. Introspective Reference, 8. Architecture vs. Pathology, 9. Explanatory Parity.
