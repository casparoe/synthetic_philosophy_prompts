answer: |-
  Before listing the requirements, we must clear the ground regarding what is genuinely contested versus what is merely verbal. Much of the heat in philosophy of mind comes from verbal disputes where "consciousness" is used to mean *phenomenal experience* (what it feels like) by one camp and *cognitive access* (availability for reporting) by another. If you define consciousness as access, the Hard Problem dissolves; if you define it as phenomenality, it intensifies. This is verbal. The substantive disagreement lies in whether phenomenal properties play a causal role. Realists say yes (or that they are identical to functional properties); Illusionists say no (they are cognitive misjudgments). A further substantive contest concerns *introspection*: is it a perceptual-like faculty revealing inner facts, or a constructive process generating a user-illusion? Your project hinges on the latter. If introspection is perceptual, your third-person inspection is secondary; if it is constructive, your third-person inspection may be primary. Do not confuse these two layers.

  Here are the desiderata for an adequate theory of consciousness, relativised to your project's aim of third-person assessment of fully inspectable systems.

  ### Tier 1: General Constraints (Binding on All Theories)

  **1. Report Reliability**
  The theory must explain why verbal reports of experience are generally coherent, stable, and correlated with environmental stimuli, rather than random or chaotic. It cannot treat reports as mere noise; it must account for the systematicity of why we say "red" when seeing red, even if the underlying mechanism is not what it seems.

  **2. Phenomenal Presence**
  The theory must account for the *apparent* immediacy and qualitative richness of experience. Even if the theory concludes these properties are not real, it must explain why the *representation* of them is so detailed and immediate to the subject. You cannot simply deny the appearance; you must explain the appearance of the appearance.

  **3. Dissociation Accommodation**
  The theory must provide principled criteria for distinguishing between cases where report and behaviour diverge (e.g., blindsight, locked-in syndrome, anaesthesia). It cannot simply equate consciousness with reporting, nor can it equate it with behaviour alone. It must specify which functional breakdowns constitute a loss of consciousness and which constitute a loss of output.

  **4. Empirical Alignment**
  The theory must be consistent with established data from neuroscience and psychology regarding sleep, anaesthesia, and disorders of awareness. A theory that posits consciousness where the brain is functionally offline (or vice versa) without a compelling functional explanation fails this requirement. This is a constraint on the *mapping* between theory and physical data.

  ### Tier 2: Specific Constraints (Binding on Illusionism)

  **5. Illusion Stability**
  The theory must explain why the "illusion" of phenomenal properties is compelling, stable, and near-universal, unlike standard perceptual illusions (e.g., Müller-Lyer lines) which are easily corrected upon measurement. It must identify the cognitive architecture that makes the error resistant to correction.

  **6. No Phenomenal Smuggling**
  The theory must not reintroduce intrinsic phenomenal properties under a new name (e.g., "functional qualia" or "real seemings") at the point where it explains why we *think* we have them. The explanation of the error must be exhaustively functional/physical.

  **7. Introspective Reference**
  The theory must specify what introspection is actually tracking, if not phenomenal properties. It must identify the real functional or physical states that serve as the input for the introspective mechanism. If introspection tracks nothing real, the view collapses into scepticism; it must track *something* to be a cognitive mechanism.

  **8. Architecture vs. Pathology**
  The theory must respect the distinction between being under a systematic illusion (a feature of healthy cognitive architecture) and being deluded (a bug or pathology). An adequate Illusionist theory must classify the belief in qualia as a universal feature of human cognitive design, not a correctable mistake or a mental illness.

  **9. Explanatory Parity**
  The theory is not entitled to explain less than Realism simply by calling the remainder a confusion. It must explain everything Realism explains regarding behaviour, learning, and reporting, minus the ontological commitment to non-physical properties. It cannot dismiss the *data* of introspection, only the *interpretation* of that data.

  ***

  ### Analysis of the List

  **Incompatible Requirements**
  There is a critical tension between **Report Reliability (1)** and your project's aim of **Third-Person Assessment**. If you interpret "authority of first-person reports" as *infallibility* (the subject cannot be wrong about their own state), then Third-Person Assessment is impossible, because the subject's word overrides your inspection. If you interpret it as *privileged access* (the subject has faster/better access to functional states), they are compatible.
  *Verdict:* You can satisfy both only if you reject infallibility. If your supervisor expects you to treat machine reports as potentially false while treating human reports as infallible, the project is in trouble. You must argue that human reports are *also* potentially false evidence, assessable by third-person theory. This is the pivot point of your dissertation.

  **Most Eliminative Requirement**
  **Empirical Alignment (4)** eliminates the largest number of candidate theories. Many philosophical theories (particularly dualist or heavily metaphysical ones) are compatible with logic but incompatible with the data of anaesthesia or lesion studies. For a project assessing machines, a theory that cannot map onto physical inspection is useless. This requirement kills Cartesian Dualism and many forms of Panpsychism immediately.

  **Non-Negotiable vs. Camp Preferences**
  *   **Non-Negotiable:** Empirical Alignment (4), Report Reliability (1), No Phenomenal Smuggling (6). Without these, the theory is either scientifically useless or logically incoherent.
  *   **Camp Preferences:** Introspective Reference (7) is heavily weighted toward Illusionism (Realists might say it tracks qualia directly). Explanatory Parity (9) is a demand Realists would place on Illusionists; Illusionists might argue they are entitled to explain less because the "remainder" is nonsense. I have included it as a requirement *for your purpose* because you need a theory that predicts behaviour as well as Realism does.

  ***

  ### Assessment of Four Approaches

  **Global Workspace Theory (GWT)**
  GWT meets **Report Reliability (1)** well by equating consciousness with global availability for reporting. However, it fails **No Phenomenal Smuggling (6)**; it often assumes that broadcasting *is* the experience, rather than explaining why broadcasting *seems like* a rich inner movie. It struggles with **Dissociation Accommodation (3)** in cases where information is broadcast but not reported (or vice versa).

  **Higher-Order Thought (HOT)**
  HOT satisfies **Introspective Reference (7)** by positing that introspection tracks first-order states via higher-order representations. However, it struggles with **Phenomenal Presence (2)**; it is difficult to explain why experience feels immediate and rich when it is supposedly mediated by a conceptual thought. It often fails **Empirical Alignment (4)** regarding creatures or infants who may lack the conceptual capacity for higher-order thoughts.

  **Predictive Processing (Controlled Inference)**
  This approach excels at **Empirical Alignment (4)** and **Report Reliability (1)** by treating experience as a best-guess model of sensory causes. However, it risks failing **No Phenomenal Smuggling (6)**; if the "controlled inference" feels like something, the theory must explain that feeling without assuming it. It sometimes struggles with **Illusion Stability (5)**, as it treats all perception as inference, making it hard to distinguish the "illusion" of qualia from standard perceptual processing.

  **Integrated Information Theory (IIT)**
  IIT is strong on **Phenomenal Presence (2)**, taking the structure of experience as axiomatic. However, it fails your project's core constraint: **Third-Person Assessment**. Because IIT implies panpsychism (consciousness wherever there is integration), it makes consciousness intrinsic and often unmeasurable from the outside without complete causal mapping. It fails **Empirical Alignment (4)** in specific neurological cases where integration is high but awareness is low.

  ***

  ### Final Verdict

  No current theory satisfies this specification completely. The requirement responsible is **No Phenomenal Smuggling (6)** combined with **Phenomenal Presence (2)**. Realist theories satisfy (2) but fail (6) by positing real qualia. Illusionist theories satisfy (6) but typically fail (2) by offering a "dry" functional explanation that does not fully capture why the illusion is so vivid and resistant.

  For your EPQ, this is not a failure but a finding. Your dissertation should argue that until a theory meets **Illusion Stability (5)** without violating **No Phenomenal Smuggling (6)**, we cannot definitively treat a machine's report as evidence of experience, because we do not yet understand why *our own* reports count as evidence. You are not solving consciousness; you are proving that the metric for machine consciousness is currently broken.
