answer: |-
  **Thinking Out Loud**

  Okay, three arms. Arm A (Crossfeed) was the idealistic gamble—contact hypothesis applied to information ecology. It blew up. Not just neutral, but negative polarization and a trust collapse. That's the epistemic tragedy: we tried to fix silos and accidentally taught them that *all* towers are falling. Arm B (Provenance) was the boring skills play. It worked on the quiz, didn't hurt feelings. Safe, but is it just gatekeeping with extra steps? Arm C is the null hypothesis; we beat it, so we have to do something.

  Two rival readings. Chair says exposure is theoretically dead; you can't reason people out of positions they didn't reason themselves into. Dean says exposure is politically dangerous; if the university picks the "other side," we're the censor. My read: Chair and Dean are arguing past each other about the same symptom. The problem isn't exposure vs. skills; it's whether the student possesses enough baseline trust to process the exposure. Arm A failed because trust was the missing variable, not content. But if I recommend scaling B, I inherit the Dean's complaint. Who curates the "reference-grade" list? If I don't solve that, B is just A with a slower burn.

  What gets acted on? A memo that says "Scale B" but admits B has the same structural flaw as A (institutional curation) and proposes a fix (decentered source selection). It needs to kill A for now but leave the door open if the trust mechanism was specific to our implementation, not the theory. Polarization matters because a campus that hates itself can't function, even if students are factually sharper. Kill criteria need to be hard numbers, not vibes. If B spikes polarization next year, we dump it. If I'm wrong about A being a trust failure and it's actually an exposure failure, I need to know that by year two.

  ***

  **MEMORANDUM**

  **TO:** Digital Citizenship Task Force
  **FROM:** Graduate Student Representative
  **DATE:** October 24
  **SUBJECT:** Recommendation on First-Year Module Scaling

  **1. Bottom line**
  We should scale Arm B (Provenance) to the full first-year class next fall, contingent on a spring redesign of the source curation process. Arm A (Crossfeed) should be paused indefinitely. We will use remaining budget to fund an external audit of the Provenance source list to mitigate institutional bias concerns. Implementation plans for the redesigned module must be finalized by March 1 to allow for summer training. If the redesign cannot resolve the curation vulnerability, we revert to Control.

  **2. What the pilot actually shows**
  The pilot results are not merely mixed; they indicate distinct failure modes. Arm A did not simply fail to reduce polarization; it actively increased affective polarization while collapsing trust across all outlets, including those students initially favored. This suggests the intervention triggered a defensive epistemic closure rather than openness. The high non-completion rate signals student resistance to the premise. Arm B improved factual discernment significantly without worsening polarization, suggesting skills-based interventions are safer for campus climate. However, Arm B's success rests on a curated list of "reference-grade" sources. While effective, this replicates the structural vulnerability the Dean identified in Arm A: the university is still deciding which sources count as legitimate. The control group confirms that standard orientation is insufficient for factual discernment. We cannot claim Arm A proves exposure is universally harmful, only that this specific implementation damaged trust. We cannot claim Arm B is neutral, only that its bias is less visible. The data forces a choice between a high-risk exposure model that broke trust and a lower-risk skills model that centralizes authority.

  **3. The mechanism we're betting on**
  We are betting that the primary barrier to digital citizenship is not a lack of exposure to opposing views, but a lack of tools to evaluate claims regardless of source. The distinction here is between information scarcity and epistemic distrust. Arm A operated on the assumption that students simply needed to hear the other side. The results suggest many students already hear the other side but interpret it through a framework of active distrust. When you hand a student content from a source they have been taught to view as illegitimate, without first giving them tools to verify claims independently, you do not broaden their horizon; you confirm their suspicion that the university is allied with the discredited source. Arm B works because it shifts the locus of authority from the outlet to the method. By teaching students to trace claims to primary data, we bypass the need for them to trust the intermediary outlet initially. However, this mechanism only holds if the initial list of practice sources is perceived as methodological examples rather than ideological endorsements. We are betting that students will accept a list curated for methodological diversity even if they reject a list curated for political balance.

  **4. The strongest case against this recommendation**
  The Chair will argue that scaling Provenance ignores the root cause of polarization. If affective division is driven by social identity rather than information processing, teaching source tracing is like teaching grammar to people who speak different languages. It may improve quiz scores, but it leaves the campus climate fractured. She is right that Arm A's failure might be a general truth about exposure, meaning we are settling for a band-aid. The Dean's objection is more dangerous. By scaling Arm B, we are institutionalizing a specific epistemology. The "reference-grade" list is a canon. If that list leans even slightly toward mainstream institutional sources, we are training students to trust authority rather than truth. This is the same structural flaw as Arm A, just slower. We risk building a compliance exercise where students learn to cite the sources the administration likes to pass the quiz. If we cannot solve the curation problem, scaling Provenance is merely hiding the university's editorial hand behind a skills checklist.

  **5. Conditions and kill criteria**
  To proceed, we must accept specific risks and monitoring protocols. We need to know if the Provenance gains persist without the curated list crutch. We also need to know if my reading of Arm A is correct or if exposure is simply dead.
  *   **Redesign Requirement:** The spring redesign must replace the static source list with a student-selected or algorithmically neutral set of practice claims. If we cannot decouple the skills from our specific source choices, we do not scale.
  *   **Polarization Trigger:** If Arm B causes a statistically significant rise in affective polarization in the next cohort (p < 0.05), the program stops immediately. We care about this because a university cannot function if students view each other as enemies, regardless of their quiz scores.
  *   **Arm A Audit:** We will fund a small qualitative study to determine if Arm A's trust collapse was due to the specific content selected or the act of forced exposure itself. If it is the latter, my recommendation is overfit to one semester and must be withdrawn.
  *   **Completion Rates:** If non-completion for Arm B exceeds 15%, we revert to Control. High dropout indicates the module is perceived as illegitimate labor.

  **6. Confidence**
  I am moderately confident in scaling Arm B because it demonstrated measurable skill gains without immediate climate damage. However, I am least sure about the long-term effects of institutional curation on student trust. If students perceive the "reference-grade" list as propaganda, the trust collapse we saw in Arm A could migrate to Arm B over time. This uncertainty is why the external audit and the redesign requirement are non-negotiable. I am less worried about the Chair's objection because skills are a prerequisite for productive exposure; you cannot bridge a divide if you cannot agree on what a fact is. The risk is not that Provenance fails to solve polarization, but that it silently replicates the authority structures that caused it.
