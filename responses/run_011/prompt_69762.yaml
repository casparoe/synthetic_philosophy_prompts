      *   **Task:** Write a memo for a Digital Citizenship Task Force.
      *   **Context:** Third-year PhD student, grad-student rep. Pilot program ran last fall (1,150 students, 3 arms: Crossfeed, Provenance, Control).
      *   **Results:**
          *   Arm A (Crossfeed): Flat on quiz, worse on polarization (-0.4 SD), high non-completion, trust collapsed across the board (not just opposing sources).
          *   Arm B (Provenance): +8 points on quiz, flat on polarization.
          *   Arm C (Control): Baseline.
      *   **Interpretations in the room:**
          *   Chair (Comms Prof): Exposure backfires, stop pretending echo chambers can be read away.
          *   Dean/Trustee: Crossfeed was defective (compliance exercise, university picking content), killing it looks like censorship.
          *   My Read (PhD Student): Distinction between *not hearing* vs. *actively taught to distrust*. Arm A looks like distrust-confirmation. Arm B has its own curation problem.
      *   **Decision Needed:** Recommend one option (Scale Provenance, Revise Crossfeed, Revert to Control, Fund Fourth Thing). Budget $180k, 1 FTE.
      *   **Format:** Exactly 6 sections (Bottom line, What the pilot actually shows, The mechanism we're betting on, The strongest case against this recommendation, Conditions and kill criteria, Confidence).
      *   **Constraints:** ~1,300 words total. Plain prose. No bullet points outside Section 5. No citations/invented studies. Specific tone (committee working document, not student paper). Address the polarization measure carefully. Address the curation problem in Arm B.
      *   **Pre-writing:** Spend a short block thinking out loud (brainstorm arms, readings, memo structure) before writing the memo.

  2.  **Pre-writing Brainstorming (Thinking Out Loud):**
      *   *The Three Arms:*
          *   Arm A (Crossfeed): Exposure therapy. Failed. Why? Maybe too aggressive, maybe sources were too toxic, maybe students felt manipulated. Result: Generalized distrust.
          *   Arm B (Provenance): Skills-based. Worked on knowledge, neutral on feelings. Safe bet? But who curates the "reference-grade" list? That's the Dean's worry applied to B.
          *   Arm C (Control): Library orientation. Baseline.
      *   *The Two Rival Readings:*
          *   Chair: Exposure is inherently harmful/useless. Psychology of polarization is too strong.
          *   Dean: Implementation was the flaw, not the principle. University shouldn't pick sides/content.
          *   My Synthesis: It's about *epistemic trust*. If trust is broken, exposure confirms bias. If trust is intact but skills are low, provenance works. Arm A broke trust. Arm B builds skills but relies on institutional trust (the list).
      *   *What gets acted on:* Needs to be actionable. Scale B but fix the curation issue. Don't kill A entirely but pause it. Need to address the polarization metric—is increased affective polarization bad? Yes, if it means campus cohesion breaks, but no if it means students care more. Actually, the prompt says Arm A was *worse* on polarization. That's bad for campus climate.
      *   *Memo Structure:*
          1.  Bottom Line: Scale Provenance (B) with modifications. Pause Crossfeed (A).
          2.  Pilot Results: Be honest about A's failure (trust collapse) and B's success (quiz) but note B's curation risk.
          3.  Mechanism: Trust vs. Exposure. A failed because it attacked trust without building skills. B builds skills but needs neutral curation.
          4.  Counterarguments: Chair says exposure is dead. Dean says B is just subtle censorship.
          5.  Conditions/Kill Criteria: Metrics for success. When to stop.
          6.  Confidence: High on B, low on long-term trust effects.
      *   *Tone:* Bureaucratic but sharp. Acknowledge the messiness. Don't sound like a grad student theorizing; sound like someone who knows how committees work.
      *   *Word Count:* Tight. ~1,300 words. Need to be concise.

  3.  **Drafting - Section by Section:**

      *   *Bottom Line:* Recommend scaling Arm B (Provenance) for next fall, pending spring redesign of the source list. Pause Arm A (Crossfeed). Use remaining budget for independent audit of source selection.
      *   *What the pilot actually shows:* Arm A didn't just fail to persuade; it induced generalized cynicism. The trust collapse is the key finding. Arm B improved factual discernment without worsening polarization. But Arm B's "reference-grade" list is a vulnerability.
      *   *The mechanism:* Distinguish between information scarcity (fixed by exposure) and epistemic distrust (fixed by skills/trust). Arm A assumed scarcity; students experienced distrust. Arm B assumes skills gap.
      *   *Strongest case against:* Chair: Exposure is theoretically bankrupt. Dean: Provenance is just gatekeeping by another name. The curation problem is real.
      *   *Conditions/Kill Criteria:* Need specific metrics. If polarization spikes in B, stop. If quiz gains don't hold, stop. Need to test if I'm wrong about Arm A (maybe it was just bad content, not exposure itself).
      *   *Confidence:* Moderate-high. Least sure about long-term trust effects of institutional curation.

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check Word Count:* Keep an eye on the limits. 120, 300, 250, 250, 200, 120. Total ~1240 + buffer.
      *   *Tone Check:* Ensure it doesn't sound like a lecture on social epistemology. Use the concepts but keep it administrative.
      *   *Polarization:* Address whether we care. Yes, campus cohesion matters.
      *   *Curation:* Acknowledge the Dean's point about Arm B having the same structural flaw as Arm A (university picking sources).
      *   *Formatting:* No bullets except Section 5.
      *   *Voice:* Experienced committee veteran + epistemologist. Pragmatic but theoretically grounded.

  5.  **Final Review against Constraints:**
      *   6 specific sections? Yes.
      *   Word counts approximated? Yes.
      *   No citations? Yes.
      *   No bullets outside Section 5? Yes.
      *   Address polarization metric? Yes.
      *   Address curation in Arm B? Yes.
      *   Pre-writing block included? Yes.

  6.  **Writing the Content:** (Proceeding to generate output based on these thoughts).
      *   *Correction on Word Count:* The prompt asks for ~1,300 words total. I need to be careful not to go too short or too long.
      *   *Correction on Bullets:* Only Section 5 can have bullets.
