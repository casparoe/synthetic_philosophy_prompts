answer: |-
  **THE HIGH COURT OF EXCHEQUER AND NATURAL GRIEVANCES**
  **KINGDOM OF MONTALUCIO**

  *The Estate of Varn v. The Commissioners of Grain & Ors.*
  *Michaelmas Term, 1742*

  **Lord Chief Justice Thorne delivered the opinion of the Court:**

  This Court sits to adjudicate the apportionment of liability for the demise of three thousand souls in the Province of Ostra. The Plaintiffs, being descendants of the deceased, bring this action against the Crown's Commissioners of Grain. Uniquely, they have also joined as Co-Defendants: Mount Ghaler (the Volcano), The Three Cold Summers, and The Red Cough Fever. The Commissioners argue they are merely the backdrop upon which nature played out its tragedy. The Mountain has not filed an answer, nor entered an appearance, though process was nailed to an oak at its base.

  We begin with causation. The Plaintiffs argue that but for the Commissioners' failure to maintain reserves or lift the export ban in the second year, the deceased would have survived the famine. However, the evidence establishes that the harvest collapsed due to ashfall and thermal reduction. Even had the granaries been full in year one, the grain would have rotted by year three. The *but-for* test fails against the Commissioners; the death would have occurred anyway due to the environmental conditions. Consequently, we must reach for the test of material contribution.

  Here, the doctrine strains. To say the Commissioners materially contributed to the starvation is to say bureaucracy is a nutrient. Yet, their inaction shortened the timeline of demise. We must then weigh this against the Co-Defendants. The Three Cold Summers argue they are a single continuous event, a single tortious act of cooling. The Plaintiffs argue they are three distinct breaches of the seasonal contract. We find they are one continuous occurrence, though divisible by harvest cycles. This complicates the apportionment, as a continuous event cannot be partially enjoined.

  Regarding The Red Cough Fever, which arrived on the relief ship sent by the Commissioners: was this a *novus actus interveniens*? The Commissioners argue the fever was a superseding cause, unforeseeable and independent. We disagree. To send a ship into a quarantined province without medical inspection is to invite the plague. The fever was a dependent intervening cause; it flowed directly from the Commissioners' attempt to mitigate the very harm they are sued for. They are liable for the fever, but not for the hunger that made the fever fatal.

  This brings us to the most vexing question: the joinder of Mount Ghaler. Can a geological formation be a party? The Commissioners argue the Mountain is not an agent and cannot possess *mens rea*. We hold that in actions of nuisance, intent is irrelevant; only the emission matters. The Mountain emitted ash. The Mountain did not file a defense. The Mountain did not deny the eruption.

  The Commissioners raise the defense of Act of God. This defense assumes a principal-agent relationship between the Almighty and the accused. If the eruption was God's act, God is the tortfeasor. As God is not subject to the jurisdiction of this Court, and cannot be served process, liability must fall upon the instrumentality employed. Mount Ghaler is that instrumentality. To rule otherwise is to suggest the Mountain merely "occurred" rather than "acted." We find that an eruption of this magnitude implies a volition sufficient to satisfy the requirements of agency. If the Mountain is merely scenery, then the Commissioners are the only actors, and thus solely liable. If the Mountain is an actor, liability is shared. We find it impossible to treat the Mountain as scenery while simultaneously blaming it for the ash. Therefore, it is an actor.

  Having established that the Mountain acted, the Commissioners contributed, and the Fever intervened, we must apportion blame. The Cold Summers are exculpated as force majeure, absorbed into the Mountain's initial tort. The Fever is attributed to the Commissioners. The starvation is divided. The Mountain created the condition of scarcity; the Commissioners failed to mitigate it.

  It is the judgment of this Court that Mount Ghaler bears 61 percent of the liability for the deaths. The Commissioners of Grain bear 39 percent. The Estate of Varn is awarded damages against the Commissioners for their share. Collection of the Mountain's share is stayed pending further order.

  **Justice Holloway, Dissenting:**

  I cannot assent to the majority's arithmetic. To assign 61 percent of causation to a mountain is to treat probability as geometry. Causal shares do not sum to a whole when nature is a defendant; they sum to a mystery. By admitting the Mountain as an actor, the Court has exculpated the human capacity for choice. If the Mountain is liable for erupting, why not the tectonic plates for shifting? Why not the gravity that holds the plates? We are chasing liability backwards into prehistory, for want of a nail. Once you admit the landscape as a co-conspirator, every human failure becomes merely a reaction to geology. The Commissioners either had a duty to foresee the unforeseeable, or they did not. They cannot share a duty with a rock. I would find for the Commissioners entirely, or against them entirely, but not this fractional absurdity.

  **ORDERED:** The Commissioners shall pay the damages forthwith. The Plaintiffs shall bear the costs of the writs served upon the trees at the base of Mount Ghaler, said costs to be deducted from the award.
