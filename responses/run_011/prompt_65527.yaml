answer: |-
  # Procedure: Envelope-Based Risk Assessment (EBRA)
  **Purpose:** Convert conflicting evidence into defensible design bounds within one analyst-day.
  **Audience:** Chartered Engineer (Technical), Residents (Safety), Committee (Decision).

  ### Step 1: Construct the Envelope [Technical]
  Do not average. Do not intersect.
  1.  **Run all sources:** Execute the two overtopping models and apply the three expert elicitation ranges to the tide-gauge data (using simple bootstrapping for the short record).
  2.  **Generate the Hull:** For the metric of interest (e.g., 1-in-100-year crest level), record the *minimum* lower bound and the *maximum* upper bound produced by any valid source.
      *   *Why Hull?* Intersection assumes one source is right (false). Mixture assumes you know the weights (false). Hull preserves the conflict as a design constraint.
      *   *Cost:* You lose precision. The interval will be wider than any single model suggests. This is the "price of honesty."
  3.  **Check for Emptiness:** If the intersection is empty, flag [Normative Hand-off]: The physics are contradictory. Stop analysis. Escalate to Committee as a "Model Failure," not a risk calculation.

  ### Step 2: Update and Diagnose [Technical]
  When new data arrives (e.g., new gauge year):
  1.  **Re-run Step 1.**
  2.  **Compare Intervals:**
      *   *Narrowing:* Standard learning.
      *   *Widening:* This is **Dilation**. It means the new data fits poorly with at least one existing model/expert, forcing the envelope to expand to accommodate the conflict.
  3.  **Diagnose Widening:** Is the widening due to *data variance* (noise) or *structural conflict* (models disagreeing on trend)?
      *   If structural: The previous narrow interval was spurious confidence.
      *   *Output:* Label this "Risk Correction," not "Data Degradation."

  ### Step 3: Select Decision Criterion [Normative Hand-off]
  The analyst does not choose the risk appetite. The Committee must select one of the following based on the Envelope from Step 1:
  *   **Maximin (Worst-Case):** Design to the Upper Bound. *Cost:* Highest CAPEX. *Benefit:* Maximum safety, defensible in court.
  *   **Maximality (Admissibility):** Design to the Mean of the Bounds. *Cost:* Moderate. *Benefit:* Balanced, but admits a known chance of under-protection.
  *   **Threshold Rule:** If the Lower Bound exceeds the code threshold → Compliant. If Upper Bound is below → Non-Compliant. If Straddling → **Escalate.**

  ### Step 4: The Single-Figure Output [Technical/Normative Interface]
  The downstream code requires one number ($H_{design}$).
  1.  **If Committee chooses Maximin:** $H_{design}$ = Upper Bound.
  2.  **If Committee chooses Maximality:** $H_{design}$ = Mid-point.
  3.  **Mandatory Annotation:** You must append the **"Uncertainty Premium"** to the report.
      *   *Formula:* $Premium = H_{design} - H_{mean\_of\_sources}$.
      *   *Meaning:* "This is the extra height we are building solely because we disagree on the physics."

  ### Step 5: Triage [Normative Hand-off]
  Before starting Step 1, assess Consequence of Failure ($C_f$) vs. Cost of Analysis ($C_a$).
  *   If $C_f$ is low (e.g., minor culvert, agricultural land): **Abort EBRA.** Use standard deterministic guidance.
  *   *Reason:* Imprecise probability buys safety clarity. If the risk is trivial, clarity is not worth the analyst-day.

  ---

  # The One-Page Output Template
  *(To be filled by Analyst)*

  | **Site ID:** [Name] | **Date:** [DD/MM/YY] | **Analyst:** [Name] |
  | :--- | :--- | :--- |
  | **Metric:** 1-in-100yr Crest (m AOD) | **Code Threshold:** [X.X] m |
  | **Evidence Sources:** 2 Models, 3 Experts, Gauge Record | **Conflict Level:** [Low / Med / High] |
  | **Calculated Envelope:** **[ Lower Bound ] to [ Upper Bound ]** |
  | **Recommended Design Height:** **[ Single Figure ]** |
  | **Uncertainty Premium:** **[ +X.XX m ]** *(Extra height due to disagreement)* |
  | **Compliance Status:** [ Compliant / Non-Compliant / **Straddling** ] |
  | **Decision Basis:** [ Worst-Case / Average / **Committee Choice Required** ] |
  | **Note to Residents:** "We have designed for the worst plausible scenario to ensure safety despite scientific disagreement." |
  | **Note to Committee:** "Widening since last review indicates previous confidence was unjustified. This is a correction, not an error." |

  ---

  # Case Runs

  ### Case 1: The Wall Upgrade (Straddling Threshold)
  *   **Data:** Envelope [2.85m, 3.15m]. Code Threshold: 3.00m.
  *   **Analysis:** The site is mathematically neither compliant nor non-compliant.
  *   **Procedure Application:**
      *   Step 3 (Normative): Escalate to Committee. Present the cost of the 0.15m difference.
      *   Step 4 (Output): Report **3.15m** (Upper Bound) as the recommended design, assuming safety-critical infrastructure.
      *   **The Answer:** "Non-compliant under current configuration. Upgrade required to 3.15m to satisfy worst-case envelope."
      *   **The Cost:** You will be asked why you aren't using 2.85m. Answer: "2.85m relies on Model A, which Model B and Expert 2 prove unsafe. We do not know which is true."

  ### Case 2: The Reanalysis (Widening Interval)
  *   **Data:** Previous (2020): [2.50m, 2.60m]. Current (2024): [2.45m, 2.75m].
  *   **Analysis:** The interval widened by 15cm despite more data.
  *   **Procedure Application:**
      *   Step 2 (Diagnose): The new gauge data aligned with Expert 3 (the outlier) and contradicted Model 1. The Hull expanded to include this new validity.
      *   **The Answer:** "Previous precision was spurious. New data revealed structural model conflict previously hidden by short records. The risk profile is now *accurate*, whereas it was previously *over-confident*."
      *   **The Unwanted Delivery:** You must tell the Committee: "We were less safe than we thought we were, because we thought we knew more than we did." Frame this as **Risk Correction**. If you frame it as **Data Failure**, they will cut your budget. If you frame it as **Honesty**, they may protect you.

  ### Case 3: The Minor Culvert (Low Stakes)
  *   **Data:** Agricultural flooding. $C_f$ is low.
  *   **Analysis:** Running EBRA costs 1 analyst-day ($£800$). Expected Annual Damage is $£500$.
  *   **Procedure Application:**
      *   Step 5 (Triage): **Abort EBRA.**
      *   **The Answer:** "Apply standard deterministic guidance. Imprecise probability apparatus yields no net benefit."
      *   **The Trap:** Do not use EBRA here. Producing a wide interval for a culvert looks like incompetence to the Residents ("They don't know if it works?") and wastes money to the Committee. Use the standard code number.

  ---

  # Limitations: Where to Stop Pretending

  This procedure systematically cannot settle the following. Acknowledge these explicitly in your quarterly review to protect your professional standing:

  1.  **The "Paralysis by Hull" Problem:** If the Envelope is wider than the physical feasibility of the defence (e.g., Lower Bound requires a 2m wall, Upper Bound requires a 10m wall), EBRA yields no decision.
      *   *Stop Pretending:* Do not output a number. Output a **"Requirement for Fundamental Research"** flag. Designing to the upper bound may be economically impossible; designing to the lower bound is negligent. This is a policy vacuum, not a calculation error.
  2.  **The Residents' Perception Gap:** To a resident, "2.5m to 3.0m" sounds like "We might let you drown."
      *   *Stop Pretending:* You cannot educate them on measure theory in one page. You must rely on the **"Worst-Case Design"** narrative. If the Committee forces you to publish the Mean, you must formally record that "Published figure does not guarantee safety envelope."
  3.  **The Committee's Risk Appetite:** EBRA exposes the trade-off between cost and safety. The Committee often wants the math to hide that trade-off.
      *   *Stop Pretending:* If they demand a single number without accepting the Uncertainty Premium annotation, you are no longer doing risk assessment; you are doing compliance theatre. Record the instruction in writing.

  **Final Instruction:** Your value is no longer calculating the *right* number. It is defining the *bounds* within which the right number must live, and forcing the Committee to choose where in those bounds they wish to sleep at night.
