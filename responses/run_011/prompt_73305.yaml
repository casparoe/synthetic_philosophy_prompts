  I'm not an academic, just someone who's been reading around this on my own, so bear with me. Act as an expert on Anscombe's ethics — someone who knows both her book on intention and her fuss about Truman getting that honorary degree at Oxford — and think carefully before you answer.

  Here's the thing I keep turning over. A modern drone strike gets cleared like this: a system estimates, from video and weeks of watching a building, roughly how many non-combatents would probably die. If the estimate lands under a number the commander fixed in advance — call it a casualty budget — the strike is pre-cleared and the person watching the screen never has to weigh any particular death at all. The figure just comes out of a model. Nobody says "I want those people dead," and sometimes there isn't even a specific human being whose death anyone is aiming at, just a probability spread over whoever happens to be in the room.

  So three questions. (a) Would she say those deaths are intended in her sense — intended under some description — or does the fact that no particular victim ever shows up in anybody's practical reasoning actually rescue double effect here, so that a targeting algorithm could in principle be cleaner than a human pilot? (b) The whole point of the budget is to buy safety for our own soldiers by spending other people's; is that the thing she'd attack hardest, even more than the killing itself? (c) Where would she surprise people — more forgiving of the pilot who sees faces, or less?

  Start with a short brainstorm of which of her commitments actually bear on this, then answer each part. Flag anywhere you're extrapolating rather than reconstructing her, and please don't invent quotes or page numbers.
