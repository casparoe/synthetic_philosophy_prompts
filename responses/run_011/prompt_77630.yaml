      *   *The User's Objection:* Local rationality vs. Global rationality. At $t_1$, having $A$, getting $B$ for $\epsilon$ is good ($B \succ A$). At $t_2$, having $B$, getting $C$ for $\epsilon$ is good ($C \succ B$). The agent isn't violating preferences *at the moment of choice*.
