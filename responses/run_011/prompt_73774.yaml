answer: |-
  # SEMINAR PREP: SPEECH, TRUTH, AND DECEPTION
  **Instructions:** Read each scenario. Select the **one** reaction that best matches your immediate judgment. Do not overthink definitions; answer based on your intuition about the case.

  **1. The Technical Truth**
  A security guard asks a spy, "Do you work for the Agency?" The spy works for a private contractor funded entirely by the Agency. She says, "No, I do not."
  *   **A.** She has done the exact same thing as if she had said, "I have no connection to the Agency."
  *   **B.** She has been deceptive, but she has not done the same thing as saying "I have no connection."

  **2. The Private Reservation**
  A parent asks a child, "Did you finish your homework?" The child finished the math but not the reading. The child says, "I finished my homework," thinking to themselves, "*...the math part.*"
  *   **A.** This is just as wrong as saying "Yes, all of it."
  *   **B.** This is deceptive, but less wrong than saying "Yes, all of it."

  **3. The Hidden File**
  You ask a colleague where a file is. They say, "It is in the office," knowing it is buried in a locked drawer you cannot open. The statement is literally true.
  *   **A.** The problem is specifically with the words they chose.
  *   **B.** The problem is with the belief they wanted you to have.
  *   **C.** The problem is that you were entitled to a more useful answer.

  **4. The Suggestion**
  A salesperson knows a car has a bad transmission. They do not mention it. They say, "The engine was serviced yesterday," intending you to assume the car is reliable.
  *   **A.** If they had used different words to convey the same impression, it would be the same act.
  *   **B.** If they had used different words, the act would be different, even if the impression was the same.
  *   **C.** It depends on whether you had a right to know about the transmission.

  **5. The Normative Expectation**
  During a negotiation, one party stays silent while the other makes a false assumption about the price. The silent party knows of the error but says nothing.
  *   **A.** Silence cannot be the same as speaking falsely.
  *   **B.** Allowing the error is the same as causing it.
  *   **C.** It matters whether the rules of negotiation required them to speak.

  **6. The Equal Harm**
  Speaker A lies to you (says "P" when not-P). Speaker B misleads you (implies "P" when not-P). You suffer the exact same loss from both.
  *   **A.** Speaker A deserves more blame than Speaker B.
  *   **B.** Speaker A and Speaker B deserve equal blame.
  *   **C.** Blame is the wrong metric; we should look at whether trust was violated.

  **7. The Apology**
  After being caught, Speaker A (who lied) and Speaker B (who misled) both offer the same restitution.
  *   **A.** You should accept A's apology less readily than B's.
  *   **B.** You should accept both apologies equally.
  *   **C.** Acceptance depends on whether they admit they violated a conversational rule.

  ***

  ## SCORING & DIAGNOSIS KEY

  **Step 1: Tally your responses.**
  *   **Collapse Indicators:** Q1(A), Q2(A), Q4(B), Q6(B), Q7(B).
  *   **Distinct Indicators:** Q1(B), Q2(B), Q4(A), Q6(A), Q7(A).
  *   **Content Focus:** Q3(A), Q4(B).
  *   **Intention Focus:** Q3(B), Q4(A).
  *   **Entitlement Focus:** Q3(C), Q5(C), Q7(C).
  *   **Moral Weight:** Q6(A/B), Q7(A/B).

  **Step 2: Map to Leaves.**
  Match your pattern of answers to the profiles below.

  *   **Leaf 1 (Traditionalist):** Distinct Indicators + Moral Weight (A believes lying is worse).
      *   *View:* Lying and misleading differ in kind; the difference is morally load-bearing.
  *   **Leaf 2 (Moderate):** Distinct Indicators + Moral Weight (B believes blame is equal).
      *   *View:* They differ in kind, but the difference is morally idle (once harm is equal).
  *   **Leaf 3 (Broad Assertion):** Collapse Indicators + Content Focus.
      *   *View:* Collapses misleading into lying by widening what counts as asserted content (what is implied is asserted).
  *   **Leaf 4 (Broad Intention):** Collapse Indicators + Intention Focus.
      *   *View:* Collapses misleading into lying by reference to the speaker's intention (intent to deceive defines the lie).
  *   **Leaf 5 (Sceptic):** Mixed/Inconsistent answers across Q1–Q5.
      *   *View:* The line is too context-sensitive to do any theoretical work.
  *   **Leaf 6 (Normative):** Entitlement Focus dominates (Q3-C, Q5-C).
      *   *View:* The hearer's-entitlement account (wrongfulness depends on conversational norms, not just truth/intent).

  **Step 3: Empty Cells & Diagnostics.**
  *   **The "Misleading is Worse" Cell:** If you selected Distinct Indicators but felt Misleading is *worse* than Lying (not offered in Q6/Q7 options), this cell is empty.
      *   *Diagnosis:* **Unattractive.** While logically possible, this view lacks defenders because lying typically involves a more direct violation of trust than misleading.
  *   **The "Content Collapse without Moral Weight" Cell:** If you widened assertion (Leaf 3) but argued it makes no moral difference.
      *   *Diagnosis:* **Undeveloped.** Few theorists argue that expanding the definition of lying leaves the moral landscape unchanged, as the expansion usually aims to increase accountability.

  **Step 4: Limitations.**
  *   **Indistinguishable Leaves:** This instrument cannot genuinely separate **Leaf 3 (Broad Assertion)** from **Leaf 4 (Broad Intention)**.
      *   *Reason:* In concrete cases (Q1–Q4), widening "what is asserted" and focusing on "intent to deceive" almost always yield the same verdicts. Separating them requires abstract metaphysical questions about semantics, which this concrete instrument excludes by design.
  *   **Context Sensitivity:** **Leaf 5 (Sceptic)** and **Leaf 6 (Normative)** may overlap. A sceptic might answer like a normativist because both rely on context, though for different reasons (one denies a line exists, the other draws the line based on norms).
