  3. **Identification under Contamination:** How do we prevent the "intolerant" label from becoming a weapon of herding rather than evidence of rule-breaking? This follows triggers because false labeling breaks enforcement, but depends on having a trigger first, and is moved by independent audit logs of moderator decisions.

  4. **Unit of Analysis:** Is tolerance a virtue of participants or a structural constraint on the assembly's design? This is lower because it frames the policy rather than dictating immediate action, depending on the harm definition above, and is moved by a decision to prioritize process stability over individual moral education.

  5. **Reciprocity/Asymmetry:** Does the justification for exclusion rely on the actor's future intent or their current structural advantage? This sits last as it justifies the rule rather than enabling its application, relying on all prior definitions, and is moved by evidence of organized bad-faith campaigns.
