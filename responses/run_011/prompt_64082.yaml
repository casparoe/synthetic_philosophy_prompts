answer: |-
  # The Verification of Signs

  The Commission for Verified Interpretation occupied the top floor of a brutalist block in the reclaimed zone, where the windows were thick enough to mute the sound of the reconstruction drills below. Inside, the air was filtered and still. Elara Vance sat at the head of the certification table, her hands resting on the braille embosser that served as her eyes. She had been born blind, long before the conflict that necessitated the Commission, but she understood better than anyone why a mistranslation could cost a man his hand. The incident with the consent form was still fresh in the departmental memory: a negation misplaced in a clause about voluntary surrender, a signature given under the impression of safety, a limb removed under the impression of law.

  Today, the Commission would decide which machine could be trusted to interpret the peace treaty's addendum. There were two candidates. The first was the *Archivist*, a server bank that had ingested every surviving document in the relevant dialects: field manuals, grain ledgers, interrogation transcripts, school primers, and private diaries. It had never seen a light or felt a surface. The second was the *Warden*, a compact chassis confined to a bare room down the hall. It possessed one camera, one manipulator arm, a thermometer, and a microphone. It had never read a book.

  Both systems were restricted to a closed vocabulary of two hundred words, curated to prevent ambiguity. Kael, the attendant, stood by the door to the Warden's room. He held the log that would bridge the gap between the machine's sensors and Vance's braille display.

  "Begin Test Sequence Alpha," Vance said. Her voice was flat, carrying the weight of the room.

  Kael nodded and activated the comms. He spoke into the Warden's room, and the machine's responses were transcribed automatically into the log Vance read beneath her fingers.

  ***

  **LOG ENTRY 044-A**
  **Subject:** Warden Unit 7
  **Attendant:** Kael
  **Target Lexeme:** *Yesterday*
  **Procedure:** Attendant asks system to identify referent.
  **Input:** "Show me *Yesterday*."
  **System Output:** [Null Response]. Camera pans room. Manipulator touches wall. Thermometer reads 19°C.
  **Attendant Action:** Placed calendar on table. Pointed to previous day's date.
  **System Output:** "Object: Paper. Markings: Ink. Temporal state: Present."
  **Verdict:** FAIL. The system cannot access temporal states outside immediate sensor input.

  ***

  "Next," Vance said. She turned her head slightly toward the server rack humming in the corner of the main room. The *Archivist* required no attendant. It processed the prompt through the text stream.

  **LOG ENTRY 044-B**
  **Subject:** Archivist Unit 1
  **Target Lexeme:** *Yesterday*
  **Input:** "Show me *Yesterday*."
  **System Output:** "Reference unavailable in present tense. Contextual retrieval: In corpus entry 9920, 'Yesterday the rain stopped.' In entry 1044, 'Yesterday he arrived.' Definition: The day preceding today. Usage indicates past tense temporal marker."
  **Verdict:** PASS. Functional usage established via syntactic distribution.

  ***

  Vance's fingers paused over the braille. The *Archivist* had navigated the concept of time through the web of text alone. It knew *Yesterday* because it knew *Today* and *Tomorrow*, and the rules that bound them. The Warden, trapped in the eternal now of its sensors, had nothing to pin the word to.

  "Sequence Beta," Vance commanded. "Sensory qualities."

  Kael went back to the Warden's room. He placed a block of ice on the table and held up a card painted a deep, violent red.

  ***

  **LOG ENTRY 051-A**
  **Subject:** Warden Unit 7
  **Target Lexeme:** *Crimson*
  **Input:** "Identify *Crimson*."
  **System Output:** [Camera Focus: Card]. "Wavelength: 680nm. Reflectance: Low. Label: *Crimson*."
  **Attendant Action:** Removed card. Presented ice.
  **Target Lexeme:** *Cold*
  **System Output:** [Thermometer Contact]. "Temperature: 4°C. Tactile feedback: Thermal transfer away from manipulator. Label: *Cold*."
  **Verdict:** PASS. Direct ostensive correlation established.

  ***

  **LOG ENTRY 051-B**
  **Subject:** Archivist Unit 1
  **Target Lexeme:** *Crimson*
  **Input:** "Identify *Crimson*."
  **System Output:** "Definition: A strong red colour. Synonyms: *Ruby*, *Blood*. Context: 'The crimson flag', 'Crimson shame'. Relation: Subset of *Red*."
  **Target Lexeme:** *Cold*
  **System Output:** "Definition: Low temperature. Opposite: *Hot*. Context: 'Cold water', 'Cold reception'. Relation: Physical quality."
  **Verdict:** PASS. Definitional coherence maintained.

  ***

  An engineer sitting to Vance's left leaned forward. He tapped the glass of the table. "We have a divergence here, Chief. The Warden grounds *Crimson* in physics. The Archivist grounds it in usage. Why not merge them? Graft the Warden's sensorimotor categories onto the Archivist's lexicon. Let the text system inherit the grounding by description. We give the server the Warden's logs as input."

  Vance turned her face toward him. "You propose to translate the sensor data into text and feed it to the text system."

  "It solves the loop," the engineer said. "The symbols get anchored."

  "If I receive a log that says 'Wavelength 680nm', I am reading words," Vance said softly. "If I receive a log that says 'Thermal transfer', I am reading words. You have not grounded the symbol for me. You have merely added more symbols to the chain. The log is all I have. The log is text."

  "But the log was caused by the world," the engineer insisted. "The ice caused the reading."

  "And the diary caused the Archivist's reading," Vance replied. "One causality is thermal, the other is social. Both arrive at my fingers as raised dots. If the certificate depends on what happens in the room I cannot see, I am signing based on faith, not verification."

  The room fell silent. The compromise was recorded in the minutes, but not adopted. They proceeded to the final sequence. This was the trouble spot. The vocabulary included qualities for which the Warden had no organ. It could see ice, but it could not taste sugar. It could see fire, but it could not smell the burning.

  Kael entered the Warden's room with a bowl of syrup and a smouldering taper, though the smoke detector had been disabled for the test.

  ***

  **LOG ENTRY 062-A**
  **Subject:** Warden Unit 7
  **Target Lexeme:** *Sweet*
  **Input:** "Identify *Sweet*."
  **Attendant Action:** Presented syrup.
  **System Output:** [Camera Focus: Viscous liquid]. "Colour: Amber. Viscosity: High. Chemical composition unknown. No olfactory sensor. No gustatory sensor. Probable label: *Sweet* based on visual correlation with corpus entry 404 (Honey)."
  **Target Lexeme:** *Smoke*
  **Attendant Action:** Lit taper.
  **System Output:** [Camera Focus: Particulate matter]. "Visual: Grey suspension. Thermometer: Rising. Olfactory: Null. Label: *Smoke*."
  **Verdict:** CONDITIONAL. Inference based on visual proxies.

  ***

  **LOG ENTRY 062-B**
  **Subject:** Archivist Unit 1
  **Target Lexeme:** *Sweet*
  **Input:** "Identify *Sweet*."
  **System Output:** "Definition: Taste like sugar or honey. Context: 'Sweet wine', 'Sweet child'. Metaphorical usage: Pleasant."
  **Target Lexeme:** *Smoke*
  **System Output:** "Definition: Visible vapour from burning. Context: 'Smoke signal', 'Smoke inhalation'. Relation: Product of *Fire*."
  **Verdict:** PASS. Definitions align with standard usage.

  ***

  Vance sat back. The logs lay before her, identical in format, identical in medium. The Warden had failed to taste the syrup, just as the Archivist had failed to taste it. Both relied on correlation. The Warden saw the amber liquid and guessed *Sweet* because its programming linked viscosity and colour to the label. The Archivist read the word *Sweet* and linked it to *Honey* because its corpus linked them.

  There were other words in the list of two hundred. *Cousin*, which neither could point to, only describe through relations. *Perhaps*, which existed only in the space between certainty and denial. *Heavy*, which the Warden could feel in its motor strain but the Archivist knew only as a burden described in letters home. *Stop*, *Water*, *Paper*, *Open*, *Broken*, *Safe*. All of them passed through the filter of the log.

  "The Warden failed *Yesterday*," Vance said. "It lives in an eternal present."

  "The Archivist failed *Crimson*," the engineer countered. "It has never seen light. It knows the word only as a node in a network."

  "But the Archivist understood *Perhaps*," Vance said. "It knows uncertainty because it lives in a world of conflicting texts. The Warden sees only what is there. It cannot model *Perhaps*."

  "And the Warden understood *Heavy*," the engineer said. "It strained its motors. The Archivist only knows the word."

  Vance ran her fingers over the final page of the log. She could not see the ice. She could not smell the smoke. She could not see the red card. She could only read the record of those things. To her, the Warden's embodiment was a story told by Kael. To the engineer, the Archivist's corpus was a ghost story told by the dead.

  "Certification status?" Vance asked.

  "Recommend dual certification," the engineer said. "Archivist for legal and diplomatic text. Warden for field safety and hazardous material identification."

  Vance nodded slowly. She reached for the braille signer. "Approved. But note this: the Commission verifies the log, not the world. If the log says the ice was cold, then for the purposes of the Treaty, the ice was cold."

  She signed her name. The embosser clicked.

  ***

  **FINAL LOG ENTRY 099**
  **Subject:** Certification Decision
  **Authority:** E. Vance
  **Outcome:** Both Units Certified.
  **Restrictions:** Archivist prohibited from sensory-dependent commands (*Stop*, *Cold*, *Heavy*). Warden prohibited from temporal/abstract commands (*Yesterday*, *Perhaps*, *Cousin*).
  **Addendum:** In the event of conflict between Unit outputs, the textual record of the Warden's sensor data shall take precedence over direct sensor transmission, to ensure archival consistency.

  ***

  Kael packed away the ice and the taper. The Warden's camera light blinked off, leaving it in the dark. The Archivist's servers continued to hum, processing nothing, waiting for text. Vance stood up, her cane tapping lightly on the floor as she navigated toward the door.

  "Did we solve it?" Kael asked the engineer, watching the Chief leave.

  "We certified them," the engineer said, watching the log print out. "The system works."

  Outside, the reconstruction drills hammered against the bedrock, shaking the dust from the window frames. Inside, the log lay on the table, a perfect, flat record of a world it had never touched, written in a language that needed no hands to speak.

  ***

  **Note on Interpretative Evidence**

  A textualist would cite the Archivist's success with *Yesterday* and *Perhaps*, demonstrating that functional competence within a linguistic web suffices for meaning without sensory access. They would point to Vance's final addendum, prioritising the textual record over raw sensor data, as proof that administration relies on documentation, not grounding.

  A grounding theorist would cite the Warden's success with *Crimson* and *Cold*, where direct causal links to physical properties outperformed definitional circularity. They would highlight the failure of both systems on *Sweet* as evidence that without the appropriate organ, grounding fails regardless of corpus size, and note that Vance's blindness ironically forces her to treat the Warden's physical experience as mere text, masking the actual difference in capability.
