answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** Individual Moral Agency in Collective Harm Contexts
  **Parties:** The Difference-Maker (DM), The Marginalist (M)
  **Facilitator:** [PhD Candidate]
  **Date:** October 26, 2023

  ### PREAMBLE: MODEL REPAIR AND CLARIFICATION

  Before proceeding to the substantive claims, the parties agree to the following clarifications regarding the scaffolding parameters ($g, a$) and the case family (V1–V4).

  1.  **Orthogonality of Parameters:** The cases V1–V4 primarily instantiate values for granularity ($g$), describing the *harm function* (how inputs map to outcomes). They do not fully specify absorption ($a$), which describes the *supply function* (how individual inputs map to total production). To utilize the $(g, a)$ matrix effectively, we stipulate that each V-case can be run under either $a=0$ (just-in-time production) or $a=1$ (buffered inventory).
  2.  **Distinctness of V2 and V4:** V2 (Overdetermination) and V4 (Sticky Valve) do not collapse. V2 is a metaphysical claim about the actual sequence (the threshold was crossed *without* you). V4 is an epistemic claim about the actual sequence (the threshold was crossed, but *whether* you triggered it is unknowable due to timing opacity). V2 fixes the causal story; V4 obscures it.
  3.  **Definition of "Reason":** Throughout this document, "act-based moral reason" refers to a pro tanto consideration grounded specifically in the consequences of that individual act, distinct from rule-based or virtue-based reasons.

  ---

  ### 1. JOINT CLAIMS

  The following claims are endorsed by both DM and M. Where a party requires a qualification to sign, it is recorded in brackets.

  1.  **Causal Structure Relevance:** The moral status of an individual act depends in part on the causal structure connecting the act to the outcome. Specifically, the values of $g$ (granularity) and $a$ (absorption) are morally relevant variables.
  2.  **The $g=0, a=0$ Baseline:** In cases where harm is continuous ($g=0$) and production is responsive ($a=0$)—e.g., V3 with just-in-time bucket manufacturing—both parties agree that an individual act generates a non-zero act-based moral reason to refrain.
      *   *[DM Qualification: This is because the act counterfactually causes a specific increment of harm.]*
      *   *[M Qualification: This is because the expected harm is positive and non-negligible.]*
  3.  **The $g=1, a=1$ Limit:** In cases where harm is threshold-based ($g=1$) and production is fully buffered ($a=1$)—e.g., V1 where the valve never trips and stock is pre-existing—both parties agree that the individual act generates no act-based moral reason grounded in harm.
      *   *[DM Qualification: Because the act makes no difference to the outcome or production.]*
      *   *[M Qualification: Because the probability of affecting the outcome or production is effectively zero.]*
  4.  **Mathematical Validity:** The calculation of "expected harm" (probability of pivotality $\times$ magnitude of harm) is mathematically valid in all cases where probabilities can be assigned.
      *   *[DM Qualification: Mathematical validity does not entail moral significance if the probability-weighted outcome never materializes in the actual sequence.]*
  5.  **Epistemic Uncertainty:** In cases like V4 (Sticky Valve), where an agent cannot know if they are pivotal, the *ex ante* evaluation of the act must rely on available evidence rather than *ex post* facts.
      *   *[M Qualification: This confirms that expected harm is the correct metric for deliberation.]*
      *   *[DM Qualification: This concedes only that epistemic reasons exist, not that outcome-based reasons exist if the act turns out to be redundant.]*
  6.  **Scale Insensitivity (Partial):** Both parties agree that the mere number of other actors does not, in itself, eliminate moral reasons. The presence of millions of other actors matters only insofar as it changes $g$ or $a$.

  ---

  ### 2. DISAGREEMENTS TABLE

  This table maps the $(g, a)$ parameter space. It specifies how each party formulates the core issue in that region and identifies whether the disagreement is genuine (conflict over facts or normative principles) or verbal (conflict over definitions).

  **Key:**
  *   **DM Concession:** Does DM admit a real act-based reason exists here?
  *   **M Concession:** Does M admit a real act-based reason *does not* exist here?

  | Region | Case Instantiation | Issue | DM Formulation | M Formulation | Genuine / Verbal | DM Concedes Reason? | M Concedes No Reason? |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **$g=0, a=0$** | V3 (Seepage) + Just-in-Time | Causal Link | Act causes specific unit of harm. | Act imposes risk that materializes continuously. | **Verbal** (Both agree act is wrong; dispute is on *why*). | **Yes** | **No** |
  | **$g=0, a=1$** | V3 (Seepage) + Buffered Stock | Supply Chain | Act draws from stock; no new production; no harm caused. | Act lowers buffer; increases probability future demand triggers production. | **Genuine** (DM sees broken chain; M sees probabilistic chain). | **No** | **No** |
  | **$g=1, a=0$** | V2 (Overdetermination) + Just-in-Time | Redundancy | Act is redundant; threshold crossed without it. No difference made. | Act had non-zero probability of being pivotal; expected harm > 0. | **Genuine** (Metaphysics of causation vs. Decision Theory). | **No** | **No** |
  | **$g=1, a=1$** | V1 (Dry Valve) + Buffered Stock | Null Impact | No harm occurred; no production changed. | Probability of impact was non-zero but outcome null; expected harm $\approx$ 0. | **Verbal** (Both agree act is permissible; dispute on magnitude of reason). | **No** | **Yes** (Effectively) |
  | **$g=1$, Epistemic** | V4 (Sticky Valve) | Uncertainty | If actual sequence shows redundancy, no reason existed *ex post*. | If *ex ante* probability was non-zero, reason existed *ex ante*. | **Genuine** (Ex post vs. Ex ante normative grounding). | **No** (If redundant) | **No** |

  **Analysis of Concessions:**
  *   **Region $g=0, a=0$:** M does not concede "no reason" because they believe reasons exist here. DM concedes "reason" because counterfactuals hold.
  *   **Region $g=1, a=0$ (The Core Dispute):** Neither concedes. DM denies the reason exists (actual sequence is safe). M denies the reason vanishes (expectation is positive).
  *   **Region $g=1, a=1$:** M concedes "no reason" effectively (because expected value is negligible). DM concedes "no reason" (because actual impact is zero). This is a zone of agreement on action, if not theory.

  ---

  ### 3. CRUXES: TESTABLE PREDICTIONS

  To move beyond theoretical stalemate, the parties agree that the following empirical and formal results would force a revision of at least one position. We record our predictions in advance.

  **Crux 1: The Supply Chain Intuition ($a$ parameter)**
  *   **Question:** Does buffering ($a=1$) eliminate the moral reason in continuous harm cases ($g=0$)?
  *   **Test:** A public-goods experiment where contributions deplete a shared buffer before triggering actual cost. Participants judge blame for depleting the buffer vs. triggering the cost.
  *   **DM Prediction:** Blame attribution will drop to near-zero once the buffer is introduced, tracking the break in counterfactual causality.
  *   **M Prediction:** Blame attribution will decrease but remain significantly above zero, tracking the increased risk of triggering the cost.
  *   **Stakes:** If blame tracks the buffer break perfectly, DM is vindicated on supply chains. If blame persists, M's "risk imposition" model better matches moral psychology.

  **Crux 2: Imprecise Probabilities**
  *   **Question:** If the probability of being pivotal cannot be a sharp point value (e.g., it is an interval $[0, 0.0001]$ due to complexity), does the moral reason vanish?
  *   **Test:** Formal decision-theory modeling of "Interval Expected Utility" applied to V4 (Sticky Valve).
  *   **DM Prediction:** The lack of a sharp value vindicates the DM suspicion that "expected harm" is pseudo-precise. If the lower bound is 0, the act is permissible.
  *   **M Prediction:** A decision rule that refuses to rank acts under imprecision cannot guide action. The upper bound or midpoint must be used; otherwise, moral advice collapses in complex real-world cases.
  *   **Stakes:** If imprecision forces paralysis, M wins on pragmatic grounds. If imprecision allows permission (via lower bound), DM wins on metaphysical grounds.

  **Crux 3: The "One Vote" Effect in Thresholds**
  *   **Question:** In $g=1$ cases, does knowing one is *part* of a sufficient set generate a reason, even if not pivotal?
  *   **Test:** V2 variant where agents are told *after* the fact whether they were pivotal or redundant.
  *   **DM Prediction:** Agents told they were redundant will judge their act as permissible, regardless of the group outcome.
  *   **M Prediction:** Agents will judge the act as equally impermissible regardless of pivotality, because the *ex ante* risk was identical.
  *   **Stakes:** If moral judgment tracks *ex post* pivotality, DM is correct about the source of the reason. If it tracks *ex ante* risk, M is correct.

  ---

  ### 4. VERBAL VS. SUBSTANTIVE ANALYSIS

  We identify the following components of the dispute as verbal or substantive to isolate the residue.

  **1. The Definition of "Harm" (Verbal)**
  *   **Dispute:** DM uses "harm" to mean *actual worsening of a specific life*. M uses "harm" to include *imposition of risk*.
  *   **Resolution:** If we adopt M's terminology ("risk-imposition"), DM still objects that risk without actualization is not *morally weighty* in the same way.
  *   **Substantive Residue:** Even if we agree to call it "risk-harm," DM denies that a non-materialized risk generates a binding *obligation* equivalent to an actual harm. The dispute shifts from "Is there harm?" to "Do non-materialized risks generate duties?"

  **2. The Currency of Reasons (Substantive)**
  *   **Dispute:** DM requires a counterfactual link to the *actual sequence*. M accepts a link to the *probability space*.
  *   **Resolution:** This is not verbal. It is a disagreement about the metaphysics of moral reasons.
  *   **Substantive Residue:** In the $g=1, a=0$ region (Overdetermination), DM prescribes **Permission** (you may act), while M prescribes **Prohibition** (you should not act, based on expectation). This is a genuine conflict in action-guidance.

  **3. The Role of Epistemology (Mixed)**
  *   **Dispute:** DM focuses on *ex post* justification (was I actually pivotal?). M focuses on *ex ante* deliberation (could I have been pivotal?).
  *   **Resolution:** Partially verbal. Both agree agents must deliberate *ex ante*.
  *   **Substantive Residue:** They disagree on whether the *ex post* truth retroactively invalidates the *ex ante* reason. If I vote in an election that turns out to be a landslide (V2), DM says my reason was illusory. M says my reason was real, even if luck made it causally inert. This affects **blame and regret**: DM says I should not regret; M says I should regret the risk I took.

  **Summary of Residue:**
  Once terminology is standardized, the core substantive disagreement remains: **Does the moral status of an act depend on the actual causal outcome (DM) or the rational expectation at the time of choice (M)?** This residue is concentrated entirely in the $(g=1, a=0)$ quadrant (Threshold Harm, Direct Production). In all other quadrants, the parties either agree on the verdict or disagree only on the theoretical explanation for a shared verdict.
