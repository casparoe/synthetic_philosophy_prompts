answer: |-
  The heating had been off since nine. The air in the ministry conference room was still enough that the smoke from the warm printer drum drifted in a distinct, chemical plume before dissipating. Neve Halloran sat at the head of the table, the draft spread before her like a autopsy report. Red ink circled the margins. Ilya Sarrow stood by the window, looking not at the city below but at his own reflection in the dark glass.

  "Clause 4," Sarrow said. He didn't turn around. "'The State acknowledges that suffering was caused.' Passive voice. No agent. No wrong."

  "The State is not a agent, Ilya. It is a structure," Halloran said. She tapped the paper. "If we write 'The State inflicted suffering', we invite litigation on every individual case for the next century. This text is a verdict, not a confession. It needs to hold in court."

  "A verdict requires a finding of fact. This finds nothing. It describes weather." Sarrow turned, leaning against the sill. "You think an apology is a deed. Like transferring land. Signed, stamped, done."

  "I think an apology is an institutional speech act. It changes the official record. It forecloses denial by successors." Halloran smoothed the page. "If you demand remorse, you demand a performance. Who decides if the performance is convincing? You hand a veto to whoever can perform grief most convincingly."

  "That isn't what I'm asking for." Sarrow walked to the table. He picked up a pen, hovered it over Clause 7. "You think I want tears. I don't. I want risk. An apology must be a costly exposure. It hands the wronged party something they can use against you. If this text leaves the distribution of power untouched, if it arrives with an indemnity clause stapled to it..." He tapped Clause 7. "'Full and final settlement'."

  "Then it is not an apology," Halloran finished for him. "It is the purchase of immunity from apology. I know your argument, Ilya. I drafted around it for eleven weeks."

  "Then why is Clause 7 still here?"

  "Because two of the three survivors' associations want it." Halloran looked up, her eyes tired but dry. "They are old. They would rather have money and closure now than a lawsuit in twenty years' time. They are treating this as a transaction. Should we overrule them to satisfy your definition of purity?"

  Sarrow paused. He put the pen down. "If they want a transaction, give them a contract. Don't call it an apology. You're using the moral weight of the word to secure the legal finality of a settlement."

  "And you are assuming the State can bear cost." Halloran leaned forward. "You say apology must wound the speaker. But the State has no skin. It cannot feel pain. It can only allocate resources. If we admit intent in Clause 4, the cost isn't borne by the State. It's borne by the current budget, which means schools and hospitals. You want the State to bleed, but you'll actually make the sick pay for the dead."

  Sarrow went still. He looked at the tracked changes in the margin, the blue lines where sentences had been struck. "You're saying the cost is always transferred to the innocent."

  "I'm saying the cost is always transferred. The question is whether you get anything in return." Halloran slid a separate sheet across the table. "Clause 3. The sentence struck at the request of the foreign development bank."

  "Their port financing depends on stability," Sarrow said. "They don't want precedents."

  "They didn't want an admission of extraterritorial complicity. So we struck it." Halloran's voice didn't waver. "In exchange, they released the labour registry archives. Without that deletion, no family on the islands can establish who was taken and when. With it, we have the names."

  Sarrow looked at the sheet. He had not known this. He sat down heavily. "You traded the scope of the wrong for the identity of the victims."

  "I traded a sentence for the truth."

  "That changes the calculation on Clause 4." Sarrow rubbed his temple. "I said earlier that the passive voice was a lie. But if the active voice costs us the archives... then the lie secures the truth. I need to revise that. It's not about the grammar. It's about what the grammar buys."

  "It buys the record," Halloran said. "Which is why Clause 7 stands. The settlement funds the Commission that holds the records."

  "But it closes the door." Sarrow traced the line of Clause 7 again. "You say the State cannot feel. I say the State must risk. If you settle all claims tomorrow, the State risks nothing. It buys immunity. You say the survivors want this. But if they want it because they are desperate, is it consent? Or is it coercion by poverty?"

  Halloran opened her mouth, then closed it. She looked at the printer, still humming softly in the corner. "If we leave Clause 7 out, the Treasury blocks the apology entirely. No text, no archives, no record. Just silence."

  "Then the apology is held hostage by the Treasury."

  "Then the apology is a political act," Halloran corrected. "Which is what it is."

  "But you're asking me to certify it." Sarrow stood up again. The chair scraped loudly on the floor. "You want the Commission to say this is moral restitution. I can't say that. I can say it is useful. I can say it secures the names. But if I call it an apology, I validate the immunity."

  "Is the value in the word, or the work?"

  "The word creates the obligation," Sarrow said. "If the word is compromised, the obligation is void."

  "Then you are demanding a category error." Halloran gathered the papers. "You want the State to be a person so it can be guilty. I am telling you it is a machine. It can only be calibrated."

  "And if the calibration leaves the victims exposed?"

  "Then they are exposed." Halloran stood. The room felt colder now that they were both upright. "But they are exposed with their names recorded. Would you prefer they remain anonymous and righteous?"

  Sarrow looked at the draft. He thought of the archives, the boxes of names waiting in a vault somewhere. He thought of the three years on the islands, the cold there, the silence.

  "I prefer they not have to choose," Sarrow said. "But you've made the choice for them."

  "I made the choice available." Halloran moved to the door. She paused, hand on the handle. "Tomorrow, the Prime Minister reads this. He served nine years on the islands. He knows what the words cost him. Does his suffering count as the State's cost?"

  Sarrow looked at the empty chair where the Prime Minister would sit tomorrow. "His suffering is his own. The State's cost must be future liability. If there is no liability, there is no apology."

  "Then tell me, Ilya." Halloran opened the door. The hallway light spilled in, cutting the room in half. "If the victims want the immunity, and the State wants the immunity, who are you protecting by refusing it?"

  Sarrow didn't answer immediately. He looked at Clause 4, the passive voice, the lie that bought the truth.

  "I'm protecting the future," he said. "Because once you sell the right to sue for the wrong, you teach the State that everything has a price."

  Halloran stepped out into the light. "And if the price is all they have?"

  The door clicked shut. Sarrow stood alone in the cold room, with the text that was not a confession, and the archives that were not a redemption.

