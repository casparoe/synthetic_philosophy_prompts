answer: |-
  This is a sharp piece of philosophy. Your roommate has effectively reconstructed a version of the "Moral Luck" argument (Williams/Nagel) and fused it with the "Standing to Blame" literature (Bell, Fritz, Miller) to produce a skeptical conclusion about moral agency itself. It's seductive because it exploits the tension between our intuition that blame requires authority and our intuition that moral perfection is impossible.

  You asked for a diagnosis, not a shrug. You want to keep (1) and (5). You are willing to sacrifice (7).

  **I reject (7).**

  Here is the diagnosis: why (7) looked true, what rejecting it costs, why it saves your mum, and where my own position is vulnerable.

  ### The Diagnosis: Why (7) is the Break Point

  **Step (7):** *But blame from someone with no relevant superiority is just smugness: it carries the implicit message that I'm not the sort of person who does that, and if there are no grounds for that claim the blame has nothing behind it.*

  **Why it seemed unobjectionable:**
  This premise smuggles in a **Courtroom Model of Morality**. In a legal court, the judge must have jurisdiction (standing) and usually must be impartial and untainted by the crime they are adjudicating. If a thief sentences another thief, it looks like gang justice, not law. Your roommate's analogy at the end ("federal courts need an injury in fact...") reveals this is the engine driving the proof. It assumes blame is a *verdict* delivered from a position of *authority*, and that authority is purchased with *moral credit*.

  It also relies on a specific psychology of the blamer: that when we blame, we are necessarily saying, "I am better than you." If that were true, and if (5) is true (that being "better" is just luck), then blame *would* be smugness.

  **Why it is false:**
  Blame is not primarily a verdict; it is a **communicative appeal to a shared norm**.

  When your mum blamed you for being nasty to your sister, she was not necessarily claiming, "I am a lucky saint who never gets angry." She was claiming, "In this family, we do not treat siblings this way." Her standing came not from her moral perfection (superiority), but from her **membership in the moral community** and her **commitment to the norm**.

  Rejecting (7) requires us to sever the link between *authority to blame* and *moral superiority*. You do not need to be better than the wrongdoer to hold them to a standard you both accept. A recovering alcoholic has standing to tell a friend not to drive drunk, not because she is "superior," but because she speaks for the value of safety and health which she knows is fragile. Her lack of "credit" (due to luck or past failure) does not negate the value she is defending.

  **The Cost of Rejecting (7):**
  1.  **Blame becomes fallible and reciprocal:** If standing doesn't require superiority, then the person blaming opens themselves up to the same scrutiny. You can blame me for lying, even if you've lied, provided you acknowledge lying is wrong. But this makes blame riskier. It invites the "look who's talking" response, not as a silencer (as in the proof), but as a demand for consistency.
  2.  **We must accept "Solidarity Blame":** We have to view blame as a way of saying, "We are both subject to this demand, you failed it, and I am calling you back to it." This is less punitive than the courtroom model but more demanding of the blamer's sincerity.
  3.  **Smugness is a contingent risk, not a definition:** Smugness occurs when the blamer *does* implicitly claim superiority. But that is a misuse of blame, not the definition of it. Rejecting (7) means admitting that much of what we *call* blame is indeed smugness, but not *all* of it.

  ### Preserving (5) and Saving Your Mum

  You want to keep (5): *Whether a person ends up where F is even a live temptation... is overwhelmingly a matter of luck.*

  If we keep (5) and reject (7), we get this picture:
  Your mum was lucky. She had a temperament or upbringing that made being nasty to her sister less tempting or easier to control. She gets no "moral credit" for that luck (per step 6). **But she doesn't need credit.** She needs **authorization**.

  Her authorization comes from her role (parent) and her endorsement of the norm (sibling care). The luck involved in her own character does not invalidate the norm itself. If the norm is valid, and she is a participant in the community governed by that norm, she has standing to invoke it.

  The roommate's argument assumes that if I can't take *credit* for avoiding F, I can't *cite* F as a fault. But I can cite a speed limit even if I only drove under it because my car broke down. The validity of the limit doesn't depend on my virtue in obeying it.

  ### Pricing the Other Exits

  Since you asked, here is the cost of the other doors, in case you decide (7) isn't the one to burn.

  **Rejecting (1) (The Definition of Blame):**
  *   *The Move:* Say blame isn't about "presenting F as counting against them." Maybe it's just causing pain, or expressing emotion.
  *   *The Cost:* You lose the normative force of blame. If blame isn't claiming something counts *against* the agent, it's just noise. It becomes pure causality. This leads to hard determinism or error theory. You stop holding people responsible and start managing them.
  *   *Verdict:* Too high a cost. You lose the phenomenon you're trying to save.

  **Rejecting (2) & (3) (The Hypocrisy Horn):**
  *   *The Move:* Say hypocrisy does *not* undermine standing. A thief can blame a thief.
  *   *The Cost:* This is tough. Most philosophers agree hypocrisy *does* undermine standing (the "Tu Quoque" intuition is strong). If you reject this, you have to explain why Dave's friend felt justified in snapping at Dave. Usually, we feel hypocrisy creates a debt that must be paid before standing is restored.
  *   *Verdict:* Possible, but fighting an uphill battle against strong intuitions. It's better to accept hypocrisy undermines standing *sometimes* (when it implies the norm doesn't apply to me) but not *always*.

  **Rejecting (5) (The Luck Premise):**
  *   *The Move:* Assert Free Will. Say we *do* deserve credit for avoiding temptation because we could have done otherwise in a robust, non-lucky way.
  *   *The Cost:* You have to solve the Free Will problem. You have to deny that upbringing, temperament, and opportunity are largely luck. This is metaphysically expensive and scientifically dubious.
  *   *Verdict:* You said you want to keep (5). Good instinct. Don't trade a moral problem for a metaphysical nightmare.

  **Accepting (9) (The Error Theory):**
  *   *The Move:* Your roommate is right. Nobody has standing. Blame is always illegitimate.
  *   *The Cost:* You have to abandon the "participant stance" (Strawson). You view all human interaction as objective management. You cannot truly resent, forgive, or feel gratitude, only simulate it for social utility. Your memory of your mum's blame becomes a memory of a useful fiction.
  *   *Verdict:* Psychologically impossible for most humans, and philosophically bleak. Only take this if every other door is locked.

  ### Where My Diagnosis is Shakiest (Failure Modes)

  I am staking my position on the distinction between *authority based on superiority* and *authority based on shared membership*. Here is where I could be wrong:

  **1. The Sanction Problem:**
  If blame essentially involves a *sanction* (punishment, withdrawal of goodwill, reputational damage) rather than just words, then (7) gains strength. If I am going to *hurt* you (even socially) for your fault, do I not need clean hands? If blame is a form of moral violence, perhaps only those not guilty of the same violence have the right to wield it. If you convince me that blame is inherently punitive rather than communicative, (7) comes back in.

  **2. The Epistemic Humility Problem:**
  Premise (5) says avoiding F is luck. If it is luck, then I do not *know* that I wouldn't have done F in your exact circumstances. If I blame you while admitting "I only didn't do this because I was lucky," does that not undermine the sincerity of the blame? It might turn blame into a performance: "I am lucky enough to stand here and judge you." If the luck is too salient, the communication fails. My diagnosis requires that we can endorse a norm *more strongly* than we worry about our own luck in keeping it.

  **3. The "Dave" Intuition:**
  In your story, everyone agreed Dave was a hypocrite. If I reject (7), I must explain why Dave lacked standing. My explanation must be: Dave lacked standing not because he did F, but because his blaming *implied* he didn't treat F as acceptable while his conduct showed he did (violating premise 2).
  *   *The Risk:* If the distinction between "Dave" (hypocrite) and "Mum" (lucky non-offender) collapses, my rejection of (7) fails. I have to maintain that Dave's blame was insincere (he treats F as acceptable for himself), whereas Mum's blame was sincere (she treats F as unacceptable for everyone, including herself). If you think Mum was also insincere, then (9) wins.

  ### Final Verdict

  Your roommate's proof is valid, but it is **unsound** because (7) is false.

  Blame is not a trophy for the virtuous; it is a tool for the community to maintain its standards. The requirement for standing is not **moral purity** (which luck makes impossible), but **moral sincerity** (which is within our control).

  Your mum had standing because she spoke for a norm she genuinely held, not because she was lucky enough to have never violated it. Dave lacked standing because his conduct suggested he didn't actually hold the norm he was invoking. The difference isn't luck; it's integrity.

  If you accept this, you keep (1), you keep (5), you save your mum, and you admit Dave was in the wrong, without having to pretend we are gods immune to circumstance.
