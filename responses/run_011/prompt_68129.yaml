answer: |-
  ### Weighting Justification
  For a methodological section aimed at settling an empirical controversy, **Discriminating Power (DP)** must outweigh **Theoretical Neutrality (TN)**. The field's current bottleneck is not a lack of theories, but an abundance of false positives driven by uncontrolled confounds (attention, criterion shift). A criterion that is perfectly neutral but fails to filter these artifacts (DP ≈ 0) is useless for your PI's purpose. However, TN cannot be ignored; a criterion that presupposes penetration to prove penetration is circular. I propose a **0.7 (DP) / 0.3 (TN)** weighting. This prioritizes the elimination of alternative explanations while penalizing criteria that beg the question.

  ### Scoring and Composite Calculation

  | Criterion | DP (0.7) | TN (0.3) | Composite |
  | :--- | :---: | :---: | :---: |
  | **8. Inert-intervention** | 0.95 | 0.70 | **0.875** |
  | **5. Overgeneralization** | 0.90 | 0.80 | **0.870** |
  | **3. Stimulus-constancy** | 0.80 | 0.90 | **0.830** |
  | **4. Locus-of-effect** | 0.70 | 0.60 | **0.670** |
  | **6. Encapsulation-defeat** | 0.60 | 0.40 | **0.540** |
  | **1. Semantic-coherence** | 0.40 | 0.30 | **0.370** |
  | **7. Predictive-processing** | 0.50 | 0.30 | **0.440** |
  | **2. Personal-level** | 0.30 | 0.20 | **0.270** |

  *(Note: Criterion 7 scored slightly higher than 1 on DP due to model fitting capabilities, but remains low tier due to theoretical specificity.)*

  ### Tier List (Most to Least Defensible)
  1.  **Inert-intervention (8)**
  2.  **Overgeneralization-style control (5)**
  3.  **Stimulus-and-occasion constancy (3)**
  4.  **Locus-of-effect requirement (4)**
  5.  **Encapsulation-defeat criterion (6)**
  6.  **Predictive-processing recast (7)**
  7.  **Semantic-coherence criterion (1)**
  8.  **Personal-level requirement (2)**

  ### Overrated and Underrated Criteria
  *   **Most Overrated:** **Encapsulation-defeat criterion (6).** It is frequently invoked as a theoretical goal but is operationally vague in the literature. Most studies claim to have "defeated encapsulation" simply by showing a top-down effect, without rigorously ruling out attentional mediation, rendering the label a conclusion rather than a test.
  *   **Most Underrated:** **Inert-intervention criterion (8).** Despite being your own proposal, it is genuinely underrated in the broader literature because it demands a level of concurrent measurement (perception + attention + motivation) that is technically demanding. It is the only criterion that mechanically isolates the cognitive variable without relying on task dissociation alone.

  ### Survival Fraction Estimate
  **0.05 (5%)**
  **Reasoning:** Applying the top-ranked criterion (Inert-intervention) requires demonstrating a reversible perceptual flip while concurrently measuring and confirming null changes in attentional allocation (e.g., via eye-tracking, pupillometry, or neural markers) and response strategy. The vast majority of published "cognitive penetration" studies rely on behavioral proxies for attention or assume motivation is constant across conditions. Only a handful of rigorous psychophysical studies (e.g., specific memory-color or stereopsis experiments with tight controls) approach this standard.

  ### Paradigm Application (Using Criterion 8)
  **Ordering by Evidential Weight:**
  1.  **Chromatic adjustment of familiar objects:** This paradigm allows for continuous physiological monitoring of gaze and pupil diameter during the adjustment, making the "inert" claim regarding attention most plausible.
  2.  **Ambiguous-figure and category-boundary paradigms:** While behavioral reversal is clear, proving attentional inertness is harder because verbal labels inherently direct spatial or feature-based attention.
  3.  **Lightness matching after social categorization:** This ranks lowest because social primes heavily modulate motivation and response bias, making it exceptionally difficult to prove the intervention was "inert" regarding decision criteria.

  **Raising the Rank:**
  *   **Chromatic:** Add multivariate pattern analysis (MVPA) of early visual cortex to show the neural representation shifts without changes in retinotopic attention maps.
  *   **Ambiguous:** Incorporate a concurrent attentional load task to demonstrate the labeling effect persists even when attentional resources are depleted.
  *   **Lightness:** Use a process-dissociation procedure to mathematically separate perceptual sensitivity from response bias induced by the social prime.

  ### Confidence and Editing Recommendations
  **Confidence Flag:** I am least confident in the independence of **Criterion 6 (Encapsulation-defeat)** and **Criterion 8 (Inert-intervention)**. Under scrutiny, 8 may collapse into 6: if an intervention is truly inert regarding attention and motivation, it *by definition* demonstrates that an encapsulated stage (if one exists) has been bypassed. Criterion 6 is the theoretical claim; Criterion 8 is the operational test. Treating them as distinct risks redundancy.

  **Word Count Cut:** Cut **Criterion 2 (Personal-level requirement)**. It is the most philosophically laden and the least methodologically actionable. In a psychology review, distinguishing between "avowable beliefs" and "subpersonal parameters" adds theoretical baggage without improving the empirical filter, especially since many top-down influences (e.g., statistical learning) are arguably subpersonal yet genuinely perceptual. Removing this saves the most "philosophy-facing" space while retaining the strongest methodological constraints.
