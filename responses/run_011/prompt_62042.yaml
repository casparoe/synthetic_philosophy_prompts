prompt: |-
  Reading through Dennett's Bacteria to Bach and Back with a few friends and we got stuck on the Popperian rung of the tower — the one where creatures supposedly 'let their hypotheses die in their stead.' One guy in the group says thats just a fancy way of saying they get feedback before it's lethal, so on his account there's no real joint between Skinnerian and Popperian creatures: a rat that gets a mild shock and stops is doing the same thing as a chimp that pictures the branch snapping, only the error signal costs it more. I think he's flattening something but I couldnt say what at the time.

  Can you lay out the different precise claims that tagline could be standing for? For each one — does the creature need a model of its own future, does the 'hypothesis' have to be the kind of thing that could be stated out loud, does dying-in-stead just mean the generate-and-test happens offline, does it require representing death itself, or only representing that some outcome is bad-for-me — say whether it's trivially true of anything that learns at all, whether it's substantive and defensible, and whether it actually cuts Skinnerian creatures off from Popperian ones. Then tell me which reading, if any, earns my friend his collapse, and which reading the tower needs in order to stay a tower rather than a ramp.

  Last bit: does the slogan still do any work once you get to Gregorian creatures, or does something else take over when the hypotheses are handed to you by other people instead of generated in your own head? Menu format please, tight enough that I can bring it to next weeks meeting.
