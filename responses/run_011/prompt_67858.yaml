  Also, the "Precise Bayesian" parallel needs to be sharp. If a precise Bayesian has a prior that puts 0 mass on the truth, they can't learn. This is the "Regularity" condition. The IB flatmate is effectively saying "IB violates Regularity by default." The reply is "IB doesn't require violating Regularity, it just allows a wider range of Regular priors."

