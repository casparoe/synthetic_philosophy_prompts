prompt: |-
  My flatmate's got a dissertation chapter that's supposed to kill off imprecise credences and I can't find where it breaks. Roughly, in his numbering:

  (1) Your credal state is a set of probability functions, and your credence in p is imprecise just in case the values {P(p): P in the set} have non-zero width.

  (2) Learning is narrowing. You learn from evidence E only if, after conditionalising the whole set on E, the width of your set for the hypothesis you care about is strictly smaller than it was before. He calls this the Narrowing Criterion and thinks it's just what "learning" amounts to, not a substantive claim.

  (3) If your prior set is the totally vacuous one — every probability function on the algebra — then for any finite E, the conditionalised set still has width 1 for anything E doesnt entail.

  (4) So an agent with a vacuous prior never learns anything about the next toss, the next raven, the next anything, however much data piles up.

  (5) And vacuity is the imprecise Bayesian's own default rather than a strawman, because of what he calls the Fidelity Principle: your credal width has to match the specificity of your evidence, so evidence that's silent about a coin's bias obliges you to sit at width 1 about the next toss.

  (6) Hence the imprecise Bayesian is committed to agents for whom evidence makes literally no difference.

  (7) A theory on which more evidence never changes your state isn't a theory of learning, it's a refusal to have one.

  (8) So imprecise credences are never rationally required, and precision wins by default.

  He thinks (5) is the load-bearing one and says he'll happily defend it. I want to keep (1) — I think the set-of-priors picture is right, and it's what makes things like dilation and credal inertia worth worrying about in the first place — and I'd also like to keep (7), since I agree that a learning theory that never learns is worthless.

  So: which step actually fails, and why did it look fine going in? Then the concrete case, because I want it dealt with rather than waved at — after a thousand heads in a row, is my width for the next head still 1? If yes, why isnt that fatal? And does the whole argument run again, unchanged, against a precise Bayesian whose prior just happens to be extremely confident — say someone who starts at P(heads) = 0.999 and then sees a thousand tails? If it does, spell the parallel out properly, because then I suspect the argument proves something about priors as such rather than about imprecision, and he's got the wrong target. If it doesn't run, tell me exactly what the difference is.

  One more thing, and be blunt about it: if I do give up (5), what's supposed to replace it? Is there any principled account of how wide a credal set should be given some particular body of evidence, or is width a free parameter the imprecise Bayesian just gets to pick, subject to coherence and nothing else? If it's free, say so — I'd rather find out now that (7) is going to come back and bite me too.

  British English throughout, please.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user's flatmate has an argument against imprecise credences (Imprecise Bayesianism, IB). The argument claims IB prevents learning from evidence, specifically starting from a "vacuous" prior (maximal imprecision).
      *   **The Argument Structure:**
          1.  IB = Set of probability functions (representor). Imprecision = non-zero width.
          2.  Learning = Narrowing (width must decrease).
          3.  Vacuous prior + finite evidence = width remains 1 (for contingent claims).
          4.  Therefore, vacuous prior agents never learn.
          5.  Vacuity is required by the "Fidelity Principle" (width must match evidence specificity).
          6.  Therefore, IB commits agents to never learning.
          7.  A theory that doesn't allow learning is worthless.
          8.  Conclusion: Precision wins.
      *   **User's Constraints/Preferences:**
          *   Keep (1) (Set-of-priors picture).
          *   Keep (7) (Learning is necessary).
          *   Wants to know which step fails (specifically targeting the flatmate's logic).
          *   Wants a concrete case analysis: 1000 heads in a row, is width still 1? If yes, why isn't it fatal?
          *   Wants a comparison with a precise Bayesian (e.g., prior 0.999 for heads, sees 1000 tails). Does the argument apply there?
          *   Wants bluntness on what replaces (5) (Fidelity Principle). Is width a free parameter?
          *   **Tone/Style:** British English. Blunt but philosophical.

  2.  **Deconstruct the Flatmate's Argument:**
      *   *Step (1):* Standard definition of IB. Hard to attack if the user wants to keep it.
      *   *Step (2):* **The Weak Link.** "Learning is narrowing." This is the controversial premise. In precise Bayesianism, learning is *shifting* mass (conditionalisation), not necessarily narrowing variance (though variance often drops, the core definition is updating probabilities). In IB, learning is often defined as *shifting the set* or *ruling out members of the set*, not necessarily narrowing the interval for a specific hypothesis immediately, especially if the prior was truly vacuous. However, the deeper issue is the definition of "learning." Is it reducing uncertainty (narrowing) or updating belief (conditionalisation)?
      *   *Step (3):* Mathematically true for a *fully* vacuous prior (all possible distributions) and independent evidence regarding a specific parameter without structural assumptions. If the set includes *every* possible bias (0 to 1), seeing heads is consistent with a coin biased 1.0 towards heads, but also consistent with a coin biased 0.0000001 towards heads (just got lucky). Without a prior constraint ruling out extreme biases, the posterior set remains [0, 1].
      *   *Step (4):* Follows from (3).
      *   *Step (5):* **The Philosophical Load-Bearer.** The "Fidelity Principle." This claims rationality *requires* maximal imprecision when evidence is silent. This is the principle of *representing ignorance by maximal imprecision*. Many IBs reject this. They argue rationality *permits* imprecision but doesn't *mandate* vacuity.
      *   *Step (6)-(8):* Conclusions based on the above.

  3.  **Identify the Breaking Point:**
      *   The argument relies heavily on the move from "IB allows imprecision" to "IB *requires* vacuous priors in the face of ignorance" (Step 5).
      *   However, the user wants to keep (1) and (7). The real break is usually at (2) or (5).
      *   *Critique of (2):* Learning isn't just narrowing. It's ruling out possibilities. If I start with [0, 1] and see data, do I learn? In standard IB (e.g., Walley), if the prior is vacuous, the posterior *is* vacuous. This is the "dilation" or "inertia" problem.
      *   *Critique of (5):* This is the easiest target. Most sophisticated IBs (like Joyce, Weatherson, Bradley) do *not* accept that rationality *requires* vacuity. They accept the *permissibility* of imprecision. The "Fidelity Principle" is a specific, strong version of the Principle of Indifference applied to sets.
      *   *The User's specific constraint:* "I want to keep (1)... and I'd also like to keep (7)..."
      *   *The Real Break:* It's actually **(2)**. The definition of learning as *strictly narrowing width* is too strong and mischaracterises Bayesian learning (both precise and imprecise). But more importantly, it's **(5)**. The flatmate is attacking a strawman version of IB (Radical Imprecism) rather than Moderate Imprecism.
      *   *Wait, looking closer at the prompt:* The user asks "which step actually fails".
      *   If I attack (5), I save IB but concede that vacuous priors are bad.
      *   If I attack (2), I save the vacuous prior but change the definition of learning.
      *   *Best philosophical move:* Attack (5). The "Fidelity Principle" is not a consensus view among IBs. It's a specific normative claim that many reject. Rationality does not *force* you to be maximally ignorant just because your evidence is sparse. You are *allowed* to be precise if you have intuitions, or *allowed* to be imprecise. But you aren't *required* to be vacuous.
      *   *Alternative:* Attack (2). Learning is updating the set, not just narrowing it. But if the set stays [0,1], have you learned? Intuitively, no. So (5) is the better target. If you aren't required to start at [0,1], the problem vanishes.

  4.  **Address the Concrete Case (1000 Heads):**
      *   *Scenario:* Vacuous prior [0, 1]. 1000 Heads.
      *   *Standard IB (Walleyan):* Posterior is still [0, 1]. Why? Because the prior set included a hypothesis $P(Head)=1$. That hypothesis predicts 1000 heads perfectly. It also predicts the next head. The prior set *also* included $P(Head)=0.5$. That predicts 1000 heads with low prob, but non-zero. Since we condition on the *set*, any $P$ that assigned non-zero prob to the evidence survives. If the set was *all* probabilities, all survive (normalized). So the range of predictions for the next toss remains 0 to 1.
      *   *Is this fatal?* Only if you accept (5) that you *must* start vacuous. If you start with a set that excludes extreme biases (e.g., [0.1, 0.9]), 1000 heads will shrink the set significantly.
      *   *Comparison with Precise Bayesian:*
          *   Precise agent: Prior $P(H) = 0.999$. Sees 1000 Tails.
          *   Likelihood of 1000 Tails given $P(H)=0.999$ is $(0.001)^{1000}$, effectively zero.
          *   Standard Bayes rule breaks (conditionalisation on probability 0 event).
          *   However, usually, precise Bayesians use a distribution over biases (Beta distribution). If they are *dogmatic* (point mass at 0.999), they cannot learn. This is the "regularity" requirement.
          *   *Parallel:* A precise Bayesian who assigns probability 0 or 1 to a contingent claim cannot learn evidence against it. This is known as the problem of *dogmatism*.
          *   *Difference:* The precise Bayesian is usually *advised* not to be dogmatic (assign 0 or 1). The IB flatmate is claiming IB *requires* dogmatism about ignorance (assigning the full range).
          *   *The Kicker:* The flatmate's argument applies to *any* agent who refuses to rule out possibilities. The precise Bayesian who refuses to assign 0/1 learns. The IB who refuses to assign a single value but keeps the set broad *doesn't* learn *if* the set is fully vacuous.
          *   *Crucial Distinction:* The precise Bayesian *must* pick a distribution to function. The IB is often motivated by the thought that picking a distribution is *arbitrary*. The flatmate says "If you don't pick, you don't learn." The IB reply is "I shouldn't be forced to pick to learn."

  5.  **Address the Replacement for (5):**
      *   If we drop the "Fidelity Principle" (width must match evidence), what determines width?
      *   *Option A:* Subjective confidence. (Makes it psychological, not normative).
      *   *Option B:* Sensitivity to evidence. (Width should reflect how much the evidence constrains the hypothesis).
      *   *Option C:* **Permissivism.** There is no single correct width. Rationality constrains the set (coherence), but within bounds, it's up to the agent.
      *   *Blunt truth:* Yes, width is largely a free parameter, constrained only by coherence and the agent's own judgment of reliability/ambiguity. There is no "Objective Imprecise Prior" analogous to the Principle of Indifference.
      *   *Risk:* If width is free, can't I just set width to 0 and be a precise Bayesian? Yes. IB claims precision is a *special case* of imprecision, not the default. But if width is free, the normative force of IB is weakened. It becomes "You *may* be imprecise," not "You *must*."
      *   *Does (7) bite?* If width is free, and I choose width 0, I learn. If I choose width 1, I don't (from vacuity). So the theory allows learning, but doesn't guarantee it for *all* rational agents. The flatmate's claim is that IB *commits* agents to not learning. If IB only *permits* vacuity, the flatmate is wrong.

  6.  **Drafting the Response (incorporating British English and tone):**
      *   *Tone:* Academic but direct. "Flatmate" context suggests informal but rigorous philosophical discussion.
      *   *Structure:*
          1.  Identify the break (Step 5).
          2.  Explain why (5) is the load-bearing flaw (Fidelity Principle is not standard IB).
          3.  Concrete case (1000 heads): Yes, width stays 1 *if* prior is vacuous. Explain why (survival of extreme hypotheses).
          4.  Why it's not fatal: Because you aren't required to be vacuous.
          5.  Precise Bayesian parallel: Dogmatism. If prior is 0 or 1, learning fails. Regularity requirement saves them. IB needs a similar "Regularity for Sets" (don't start fully vacuous).
          6.  Replacement for (5): Permissivism. Width is not determined by evidence alone. It's a free parameter (within coherence).
          7.  Conclusion on (7): The theory allows learning, just doesn't mandate a specific starting width.

  7.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, check Step (2) again.* "Learning is narrowing." Is this actually false? In precise Bayesianism, learning often *increases* certainty (narrows variance). But you can learn something that shifts your mean without narrowing variance much (e.g., learning a surprising fact). However, in the context of parameter estimation (coin bias), learning *should* narrow the interval. So (2) is plausible for this specific context.
      *   *Focus on (5).* The claim that evidence *silence* obliges *width 1* is the Principle of Indifference for sets. This is widely rejected even among IBs (e.g., by Roger White, James Joyce). They argue that silence obliges *nothing* specific, or perhaps a moderate imprecision, but not necessarily maximal.
      *   *The "Learning from Experience" argument:* This is essentially the argument made by Roger White ("Evidential Symmetry and Mushy Credence") and others. The standard reply is that the "vacuous prior" is a pathological case, not a requirement of the theory.
      *   *The Precise Parallel:* A precise Bayesian with a Beta(1,1) prior (uniform) *does* learn from 1000 heads. The posterior becomes Beta(1001, 1). The mean shifts to ~1. The variance shrinks.
      *   *Why does IB fail where Precise succeeds?* Because the Precise agent commits to a specific distribution over biases (the Beta function). The IB agent with a vacuous prior refuses to commit to *any* relationship between tosses (independence vs dependence). If the set includes *all* distributions, it includes "Streaky Coin" hypotheses where 1000 heads makes the next tail more likely (gambler's fallacy type distributions) or less likely. Because the set includes *everything*, the prediction for the next toss covers everything.
      *   *Key Insight:* The vacuous IB prior doesn't just say "I don't know the bias." It says "I don't know if the tosses are independent, I don't know if the bias is constant, I don't know anything." The Precise Uniform prior (Beta 1,1) *does* assume independence and constant bias.
      *   *So the comparison:* To make the IB agent learn, they must restrict the set to *independent, identically distributed* (IID) processes. If they do that, but remain imprecise about the bias (e.g., set of Beta priors), they *will* learn (narrow).
      *   *So the break is definitely (5).* The Fidelity Principle forces you to include non-IID hypotheses just because evidence didn't rule them out. But rationality doesn't require you to treat every logically possible world as a live option in your credal set. You can assume IID as a modelling constraint without being precise about the bias.

  8.  **Final Polish:**
      *   Ensure British spelling (conditionalising, conditionalised, modelling, programme, etc.).
      *   Ensure the "Blunt" section is actually blunt.
      *   Check the logic on the Precise Bayesian parallel. A precise Bayesian *must* assume a model (e.g., IID). If they don't, they also face the problem of induction. So the IB isn't unique here, but the *vacuity* exacerbates it.

  9.  **Step-by-Step Plan:**
      *   **Verdict:** Step (5) is the break.
      *   **Why:** The Fidelity Principle is a substantive, controversial normative claim, not a definition.
      *   **Concrete Case:** Yes, width stays 1 *if* you include all dependencies. Not fatal because you shouldn't include all dependencies.
      *   **Precise Parallel:** Precise Bayesians also need structural assumptions (IID). If they are dogmatic (0 or 1), they can't learn. The parallel holds regarding dogmatism, but IB vacuity is a form of "structural dogmatism" (refusing to rule out structures).
      *   **Replacement:** Permissivism. Width is a choice.
      *   **Risk:** Yes, (7) bites if you choose vacuity. But you don't have to.

  10. **Writing the response.** (Mental check on British English: "conditionalising", "modelling", "programme", "defence", "maths", "whilst", "amongst".)

