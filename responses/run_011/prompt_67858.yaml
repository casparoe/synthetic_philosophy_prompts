answer: |-
  Right, let's cut through the noise. Your flatmate has constructed a valid deductive argument, but it's sound only if you accept a very specific, and widely rejected, version of Imprecise Bayesianism (IB). He's attacking a straw man, albeit a sophisticated one.

  Here is the breakdown.

  ### 1. Which step fails?

  The argument breaks at **(5)**.

  Steps (1) through (4) are mathematically and definitionally consistent within the framework he's describing. If you have a fully vacuous prior (the set of *all* probability functions) and you conditionalise on finite evidence, the posterior set remains fully vacuous for any hypothesis not entailed by that evidence. This is a known result in the literature (often discussed under 'dilation' or 'credal inertia').

  Step (7) is your normative constraint, and you're right to hold it. A theory of belief that precludes learning is useless.

  The load-bearing premise is **(5)**, the 'Fidelity Principle'. This principle claims that rationality *requires* your credal width to match the specificity of your evidence. In other words: if your evidence doesn't rule out a bias, you are *obliged* to represent your state as maximally imprecise (width 1).

  This is not a definition of IB; it is a substantive normative claim known as the **Principle of Ignorance** or a strong version of the **Principle of Indifference for Sets**. Most contemporary imprecise Bayesians (e.g., Joyce, Weatherson, Bradley) explicitly reject this. They argue that while imprecision is *permitted* when evidence is sparse, it is not *required* to be maximal. Rationality constrains you to be coherent, but it does not force you into a state of total agnosticism just because the evidence is silent.

  Your flatmate is treating a specific, radical policy (start vacuous) as if it were a constitutive rule of the imprecise framework. It isn't.

  ### 2. The Concrete Case: 1,000 Heads

  **Question:** After a thousand heads in a row, is my width for the next head still 1?

  **Answer:** **Yes, *if* and only if your prior set was truly vacuous.**

  **Why?**
  A vacuous prior doesn't just say "I don't know the bias." It says "I entertain every possible probabilistic structure." This includes:
  *   A coin biased 100% towards Heads.
  *   A coin biased 0.0001% towards Heads (that just got lucky 1,000 times).
  *   A coin that alternates H-T-H-T but started on H.
  *   A coin where the 1,001st toss is determined by the phase of the moon.

  When you conditionalise on 1,000 Heads, you rule out hypotheses that assigned probability 0 to that sequence. However, in a vacuous set, for *any* prediction about the 1,001st toss (from probability 0 to 1), there is some function in your set that predicted the 1,000 heads *and* predicts that specific outcome for the 1,001st.
  *   Want to predict Heads with $p=1$? There's a function in your set that says "This coin always lands Heads." It survives.
  *   Want to predict Tails with $p=1$? There's a function in your set that says "This coin lands Heads 1,000 times then switches to Tails." It also survives (assuming it didn't assign 0 prob to the initial run).

  Because the set retains functions predicting everything, the width remains 1.

  **Why isn't this fatal?**
  Because you are not rationally required to start with a vacuous prior. You are permitted to restrict your set to **independent and identically distributed (IID)** processes. If you restrict your representor to only include IID hypotheses (a standard modelling assumption), but remain imprecise about the *degree* of bias (e.g., your set contains all Bernoulli distributions with $p \in [0,1]$), then 1,000 heads *will* shrink your width.

  The functions that say "Bias is 0.5" will be massively downweighted relative to "Bias is 0.99". The width of the set of *surviving* probabilities will narrow. The inertia only arises if you refuse to make structural assumptions (like independence) that the precise Bayesian is quietly making.

  ### 3. The Precise Bayesian Parallel

  **Question:** Does the argument run against a precise Bayesian with $P(\text{Heads}) = 0.999$ who sees 1,000 Tails?

  **Answer:** **Yes, but the diagnosis is different.**

  **The Parallel:**
  If a precise Bayesian assigns probability 1 (or 0) to a contingent claim, they cannot learn from evidence to the contrary. This is the problem of **dogmatism**. If my prior says $P(E) = 0$, then $P(H|E)$ is undefined. If I am certain the coin is biased towards heads, and it lands tails 1,000 times, standard Bayesian conditionalisation breaks. I cannot update.

  **The Difference:**
  1.  **Source of rigidity:** The precise Bayesian's failure comes from assigning an *extreme value* (0 or 1) to a specific hypothesis. The imprecise Bayesian's failure (in your flatmate's scenario) comes from assigning *maximal width* to the set of hypotheses.
  2.  **The Remedy:**
      *   The precise Bayesian is saved by the **Regularity Condition**: never assign 0 or 1 to contingent propositions. If they use a Beta(1,1) prior (uniform distribution over biases), they *do* learn from 1,000 heads. Their posterior narrows.
      *   The imprecise Bayesian is saved by rejecting the **Fidelity Principle**. They are not required to be vacuous. They can adopt a 'Regular' set of priors that excludes pathological hypotheses (like the 'switch after 1,000' coin).

  **Does the argument prove something about priors as such?**
  Yes. It proves that **any** agent (precise or imprecise) who refuses to rule out logically possible but nomicly absurd hypotheses will fail to learn from finite data.
  *   The precise Bayesian implicitly rules out "switch after 1,000" by choosing a parametric family (e.g., Bernoulli).
  *   The flatmate claims the imprecise Bayesian *cannot* rule this out without becoming precise.
  *   **This is false.** You can have a set of priors that includes only Bernoulli distributions with varying $p$. This set is imprecise (width > 0) but structured. It learns.

  Your flatmate's argument targets **structural agnosticism**, not imprecision *per se*. He is conflating "imprecise credence" with "refusal to make modelling assumptions."

  ### 4. What replaces (5)? (The Blunt Bit)

  You asked for bluntness regarding what replaces the Fidelity Principle and whether width is a free parameter.

  **The Replacement:**
  There is no single principle that replaces (5). The consensus among moderate imprecise Bayesians is **Permissivism**.

  **Is width a free parameter?**
  **Yes.**
  Subject to coherence (your set must be convex and closed) and perhaps some minimal regularity (don't include hypotheses that assign 0 probability to possible evidence), the width of your credal set is not determined by the evidence alone. It is determined by your **judgement of reliability**.

  *   If the evidence is robust and the mechanism is well-understood, your set should be narrow.
  *   If the evidence is sparse or the mechanism is obscure, your set *may* be wide.
  *   Crucially: Rationality does not dictate *exactly* how wide. Two agents with the same evidence can rationally have different credal widths.

  **Does (7) come back to bite you?**
  **Yes, if you are careless.**
  If you treat width as a completely free parameter, you can choose to be dogmatically imprecise (vacuous). If you do that, you won't learn. The theory *allows* you to shoot yourself in the foot.
  *   **Precise Bayesianism:** Forces you to pick a distribution. If you pick a bad one, you learn slowly or wrongly. If you pick a dogmatic one, you don't learn.
  *   **Imprecise Bayesianism:** Allows you to pick a set. If you pick a vacuous set, you don't learn. If you pick a structured set, you do.

  The normative force of IB is not that it *guarantees* learning from a state of total ignorance. It is that it *permits* you to represent uncertainty without fabricating precision. The cost is that you must take responsibility for the structure of your set. You cannot hide behind "I'm just being objective" to justify a vacuous prior.

  **Summary for your flatmate:**
  1.  **Step (5) is false.** Rationality does not require vacuity.
  2.  **Learning is possible** for IBs who restrict their set to plausible structural hypotheses (e.g., IID), just as precise Bayesians do.
  3.  **The parallel holds:** Both precise and imprecise agents fail to learn if they are dogmatic (precise: $p=0/1$; imprecise: width=1 over all structures).
  4.  **Width is underdetermined.** It is a free parameter constrained by coherence and the agent's assessment of the situation. There is no "correct" width dictated by evidence alone. If you choose width 1 arbitrarily, you forfeit learning, but that is a failure of the agent's judgement, not the theory.

  Tell him to read *Joyce (2010)* or *Bradley (2012)* on the norms of imprecise credence. He's fighting a ghost from the 1990s literature that most of us have moved past.
