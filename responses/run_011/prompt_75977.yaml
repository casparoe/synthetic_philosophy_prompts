answer: |-
  The view described is the classic "Dirty Hands" thesis, most prominently associated with Michael Walzer, though it echoes Weber's ethic of responsibility and Williams's notions of moral luck. It posits a paradox: a leader may be *justified* (even obligated) to perform an act that remains *morally wrong*, generating a "residue" of guilt requiring acknowledgment or punishment.

  Here is an exposure map of the view's vulnerabilities across your three specified lines of inquiry.

  ### 1. The Principled Criterion: Residue vs. Defeated *Pro-Tanto* Obligation

  **The Challenge:** Standard moral pluralism acknowledges conflicting duties. If Duty A (save the city) outweighs Duty B (do not torture), Duty B is overridden. The agent does A. Standard pluralism holds that the wrongness of B is *canceled* by the justification of A regarding the ATC judgment. The "Dirty Hands" view claims the wrongness *persists* ATC.
  **The Counter-Argument:** If an action is justified ATC, calling it "wrong ATC" is a contradiction in terms. If the residue is not the overridden duty itself, but a *fresh* obligation, what generates it? If the act was the *right* thing to do, why does morality demand punishment for doing the right thing? This looks like moral conflict renamed to preserve a deontological intuition without paying the deontological price (forbidding the act).

  *   **Decisiveness:** **Awkward, potentially Fatal.** It is fatal if the view cannot explain why the agent is rational in accepting punishment for a justified act. It is merely awkward if it is treated as a phenomenological report (how it *feels*) rather than a normative claim (what *is*).
  *   **Prediction:** The view predicts that a leader who performs a necessary atrocity *ought* to accept sanctions (impeachment, trial) even if they did the best thing. Act Consequentialism predicts they should remain in power to maximize further good. Standard Deontology predicts they should not have done the act at all.
  *   **Defender's Stance:** A committed defender (e.g., Walzer) would **dismiss** the charge of contradiction. They argue that "justified" and "innocent" are distinct. They would concede the *logical* tension but argue it reflects the tragic structure of political reality, not a failure of theory. To remove the tension is to sanitize politics.

  ### 2. The Consequentialist Reconstruction: Residue vs. Agent-Regret

  **The Challenge:** Sophisticated consequentialists (e.g., Railton, Singer) admit "agent-regret." A leader may regret the necessary deaths caused by a bombing raid. The counter-argument asks: Is the "residue" anything more than this regret plus a recognition of bad outcomes? If the residue demands *punishment*, consequentialism rejects it as double-counting harm (the harm of the act + the harm of punishing the optimizer).
  **The Counter-Argument:** To prove the residue is not just regret, one must show it has *deontic force* independent of outcomes. If the leader apologizes *only* to restore trust (utility), it is consequentialist. If they apologize because they *deserve* blame despite the utility gain, it is residue. The test is: Would the view demand punishment even if it lowered overall utility (e.g., removing a highly effective leader)?

  *   **Decisiveness:** **Fatal if reconstructed.** If the residue can be fully explained as "regret for suboptimal states of affairs" or "instrumental apology to maintain trust," the distinct metaphysical claim of "moral residue" collapses.
  *   **Prediction:** The view predicts obligations to apologize/submit to punishment even when doing so undermines the leader's effectiveness (non-instrumental). Consequentialism predicts apology/punishment only insofar as it maximizes future good (instrumental).
  *   **Defender's Stance:** A defender would **concede** this is a real cost but argue it is a necessary one. They would insist that consequentialist regret is "cold" (about the world) while moral residue is "hot" (about the self). They would argue that a leader who feels *only* regret is dangerous (a "cold monster"), whereas one who feels guilt is checked by morality.

  ### 3. Politics-Specificity: Role Morality vs. Universal Morality

  **The Challenge:** The view claims this residue is distinctive to the *political role*. However, moral dilemmas with residues appear in private life (e.g., Sophie's Choice, triage medicine). If a parent must choose which child to save, do they not also bear a residue? If the phenomenon is universal, the claim that it is *political* is false.
  **The Counter-Argument:** The "Common Morality" critique suggests that if torture is wrong, it is wrong for everyone. If it is permissible for a leader due to consequences, it should be permissible for a private citizen in analogous stakes (e.g., the "Ticking Bomb" scenario in private life). If the view insists the residue is *unique* to politics, it risks positing a "double morality" that insulates leaders from common standards.

  *   **Decisiveness:** **Awkward.** It is awkward because it forces the theorist to draw an arbitrary line between "public" and "private" tragedy. It is not fatal if the view can ground the distinction in the *nature of public trust* (leaders act in our name, we share their guilt).
  *   **Prediction:** The view predicts that private agents in analogous dilemmas do *not* incur the same obligation to submit to punishment as political leaders. Rivals (Universalists) predict the moral status should be identical regardless of the role.
  *   **Defender's Stance:** A defender would **concede** the phenomenon exists privately but **dismiss** the relevance. They would argue political residue is distinct because it involves *betrayal of the public trust*, not just moral violation. The leader violates the very constitution of the community that authorized them. Thus, the obligation to submit to punishment is about restoring the political order, not just personal absolution.

  ### Verdict: Risk and Insulation

  Does the thesis, once suitably qualified, risk anything at all?

  **The Verdict:** No. Once qualified, the thesis risks nothing, and **that insulation is itself a fatal defect.**

  To avoid the contradictions in Line 1, the defender qualifies the claim: "It is not literally wrong ATC, but it feels like it." To avoid Line 2, they qualify: "It is not irrational punishment, but symbolic acknowledgment." To avoid Line 3, they qualify: "It is not unique to politics, but intensified there."

  **The Defect:** By insulating the claim from falsification through these qualifications, the theory loses its **action-guiding capacity**.
  1.  If the "wrongness" doesn't change the ATC judgment, it is normatively inert.
  2.  If the "punishment" is merely symbolic, it is theater, not justice.
  3.  If the "political" distinction is merely a matter of degree, it is not a distinct moral category.

  A moral theory that posits a "residue" must explain what the residue *does*. If it does not forbid the act (Consequentialism wins on action), and it does not demand actual sanctions (Pragmatism wins on policy), and it applies to everyone anyway (Universalism wins on scope), then the "Dirty Hands" thesis becomes a description of a psychological state (guilt) rather than a theory of political morality.

  **Conclusion:** The view is **fatal** if it claims to be a normative guide, because it commands agents to do X and simultaneously blames them for doing X. It is **viable only as a phenomenological description** of the burden of office. However, as a description, it risks vacuity: it tells us leaders *feel* bad, but not whether they *are* bad. A claim of political morality that insulates itself from determining right action or actual accountability is not a moral theory; it is an aesthetic of power. Therefore, the insulation required to save the thesis from logical contradiction renders it normatively useless.
