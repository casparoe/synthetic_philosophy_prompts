      *   *Principle 2 (Sovereign Particularity):*
          *   Grounds: No supra-judge, treaties bind only by will, state welfare = supreme law.
          *   Prediction: Legitimate state of nature. The abandonment of arms control fits Hegel's view that treaties depend on particular wills. The threat of force preserves sovereignty.
          *   Confidence: Medium.
          *   Discriminating Case: A federation that successfully binds states (Hegel says impossible/corrupting) vs. independent states balancing power.

      *   *Principle 3 (Actualization through Risk):*
          *   Grounds: Duty to die actualizes tie, Germany ceased to be state for not acting as whole.
