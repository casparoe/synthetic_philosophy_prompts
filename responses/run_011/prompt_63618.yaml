  2.  **Deconstruct the Input Data (Hegel's Track Record):**
      *   *War has ethical meaning:* Perpetual peace = foul sea/corruption.
      *   *No supra-state judge:* States are in a state of nature; they decide their own injuries.
      *   *Sceptical of Kant's federation:* Treaties bind only as long as wills align; supra-body creates enmity.
      *   *No criteria for conquest vs. defense:* State welfare is supreme law; imminent danger justifies prohibited acts.
      *   *Duty to die:* Citizen's exposure to death actualizes the state-member tie.
      *   *Recognition constitutive:* Statehood requires recognition by others; Germany ceased to be a state because it didn't act as a whole.
      *   *Napoleon at Jena:* World-historical individual with an army = march of spirit (rapturous).

  3.  **Analyze the "New Case" (Nuclear Deterrence):**
      *   Armed states (Great Powers).
