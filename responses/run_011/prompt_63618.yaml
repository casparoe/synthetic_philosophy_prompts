  Hegel would likely issue a split verdict: validating the nuclear powers as fully actual states under the Sovereign State of Nature principle, while condemning their civil societies as ethically stagnant under the Ethical Hygiene principle. He would accept the deterrent posture as a rational expression of particular wills in a state of nature, but he would suspect the prosperity of the citizenry is bought at the cost of spiritual hollowing. The case that would settle which principle governs his final judgment is a state that maintains universal conscription and survivable second-strike forces for a century without ever firing a shot. If Hegel calls this state healthy, sovereignty trumps sacrifice; if he calls it corrupt, the actualization of risk is indispensable.
