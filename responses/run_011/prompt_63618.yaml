      *   Second-strike capability (Threat of death exists, but isn't enacted).
      *   Treaties abandoned by particular decision (Fits Hegel's view on treaties).
      *   Prosperous/Stable (Fits "corruption" worry?).
      *   Citizens not asked to risk death (Fits "duty to die" worry?).

  4.  **Develop Candidate Principles:**
      *   *Principle 1: The Ethical Necessity of Actualized Negativity.* Focuses on the idea that war/death is needed to prevent stagnation/corruption. This aligns with the "foul sea" analogy and the "duty to die."
      *   *Principle 2: The Sovereign State of Nature.* Focuses on the lack of supra-state authority and the validity of particular wills in treaties. This aligns with the Kant critique and the "no judge" verdict.
      *   *Principle 3: Recognition through Action.* Focuses on statehood being constituted by acting as a whole and being recognized, potentially requiring the *capacity* for violence even if not used. This aligns with the Germany verdict and the Napoleon letter.

  5.  **Drafting the Table Content:**

      *   *Principle 1 (Ethical Necessity of War):*
          *   Grounds: War = ethical meaning, peace = corruption, duty to die.
          *   Prediction: Corruption-by-calm. The lack of *actual* war (even with threat) means the ethical tie is notional, not actual. Citizens are comfortable, not sacrificial.
          *   Confidence: High (This is the most famous Hegel soundbite).
