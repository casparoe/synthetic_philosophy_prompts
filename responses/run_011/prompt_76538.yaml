answer: |-
  **PANEL OPINION: CASE 2023-04 (UNIVERSITY ADMINISTRATION v. GRADUATE WORKERS UNION)**

  **Decision:** Conditional Dismissal with Cure Period.

  **Order:** The charge of violating the No-Interruption Clause is sustained *unless* the Union directs all members to submit finalized grades to the Registrar by 5:00 PM on Tuesday, [Date]. If grades are submitted by this deadline, the charge is dismissed without penalty. If not, the charge is upheld, and the Administration may impose penalties consistent with prior precedent.

  **Opinion:**

  This panel operates under the Recognition Agreement and the precedent established in the 2019 Chair's Opinion. That precedent requires concerted action to pass two tests to be considered protected: the **Own-Labor Test** and the **Avoidability Test**. We apply these to the facts before us.

  **1. Covered Labor and the Own-Labor Test**
  The Union argues grading is an act of discretionary professional judgment, not covered labor. We reject this. For Teaching Assistants and Graders, the Recognition Agreement explicitly lists "evaluation of student work" as assigned duty. While faculty may exercise judgment in assigning grades, the *act* of recording and submitting them is administrative labor covered by the Agreement. Withholding this submission is not merely withholding effort; it is withholding a credential belonging to a third party (the student).

  Under the Own-Labor Test, members may withhold their own effort, but they may not use a position of trust over third parties as a lever. Grades are not the Union's property to withhold; they are student records held in trust by the University. By freezing grades, the Union is not simply stopping work; it is actively blocking students' access to financial aid and transcripts. This fails the Own-Labor Test. The leverage is not applied to the Employer's operations, but to the students' livelihoods.

  **2. The Avoidability Test**
  The 2019 precedent asks: Could the Employer make the harm stop at trivial cost by conceding the specific demand? The Union contends the harm is caused by the Administration's refusal to bargain, not the timing of data entry. However, this risks gaming the test. A Union could always pair a severe third-party harm with a broad demand the Employer cannot trivially meet (e.g., "reopen all bargaining"), rendering the test useless.

  We clarify the test: The demand must be directly resolvable by the Employer without external barriers, and the harm must fall primarily on the Employer, not bystanders. Here, the harm (loss of aid, delayed med school applications) is immediate and irreversible for students. The demand (reopen bargaining) is procedural. The Employer cannot trivially concede procedural changes if it believes it is already compliant. Because the harm falls disproportionately on students rather than the University's operational budget, and because the Employer cannot instantly cure the harm without conceding a disputed procedural right, the action fails the Avoidability Test.

  **3. Guidance for Future Cases**
  To ensure consistency for future actions (e.g., work-to-rule, refusal of recommendation letters), we establish the following criteria:
  *   **Direct Deliverables:** Withholding items that are direct entitlements to students (grades, transcripts, official letters) is presumptively impermissible under the Own-Labor Test.
  *   **Internal Labor:** Withholding internal labor (attendance at optional meetings, research output, committee work) is presumptively protected, provided it does not directly block student graduation or aid.
  *   **Proportionality:** Under the Avoidability Test, the panel will examine whether the third-party harm is proportional to the leverage gained against the Employer. Actions causing irreversible harm to students for leverage on procedural demands will not be protected.

  **4. Counter-Argument (Steelman)**
  We acknowledge the strong dissenting view. A strike that causes no disruption is no strike at all. To grant the right to strike only where it is harmless is to nullify it. The Union argues that all leverage involves pressure, and students suffer whenever University operations halt. If the Administration claims every disruption harms students, the No-Interruption Clause becomes a total ban on concerted action. This view holds that workers may only strike in ways that work, and that distinguishing between "harm to students" and "pressure on the Administration" is a distinction without a difference when students are the ultimate beneficiaries of the University's mission. We recognize this risk: if we define "third-party harm" too broadly, we grant the right and take back the weapon.

  **Conclusion**
  However, the Recognition Agreement requires us to balance this right against the No-Interruption Clause. The specific harm here—financial aid disbursement—is distinct from general operational disruption. It targets individuals with no seat at the table over a demand they cannot influence. Therefore, the action is impermissible unless cured.

  **Vote:** Shall the panel issue this Conditional Dismissal with a cure deadline of Tuesday, 5:00 PM?
