answer: |-
  **Internal Handbook Chapter: Triage for Hole Argument Manuscripts**

  **Analysis of the Terrain**

  The Hole Argument relies on a specific mathematical property of generally covariant theories: if a model consisting of a manifold and field configurations satisfies the field equations, then the pullback of those fields by any smooth diffeomorphism (a differentiable map with a differentiable inverse) also satisfies the equations. When the diffeomorphism is the identity outside a local region (the "hole") but non-trivial inside, one generates two mathematical structures that agree everywhere outside the hole but differ inside. Mathematically, this is uncontroversial. The dispute concerns whether these structures represent distinct physical situations.

  The standard dissolution, Leibniz Equivalence, asserts that diffeomorphism-related models represent the same physical state. This preserves determinism but requires abandoning manifold substantivalism—the view that spacetime points possess identity independent of the fields defined on them. Live interpretive options include metric individuation, where points are identified by the values of the metric field rather than bare haecceity, and algebraic structuralism, which dispenses with the manifold points entirely in favor of the algebra of observables.

  Most submissions fail in recurrent ways. First, authors often drag the metric but hold matter fields fixed, creating a configuration that is not a solution to the coupled field equations. Second, they introduce non-dynamical background structures (like a fixed scalar field) to individuate points, which breaks general covariance and changes the symmetry group of the theory. Third, they confuse hole diffeomorphisms (trivial at infinity) with asymptotic symmetries (non-trivial at infinity), the latter of which can alter conserved charges. Fourth, they claim physical differences based on bare point identity rather than gauge-invariant observables. Finally, they demand metaphysical conclusions that the formalism does not support, treating a semantic stipulation as a physical discovery. This procedure is designed to filter these failures without requiring editors to redo calculations.

  **Triage Procedure**

  **Check 1: Model Validity**
  (a) Do both the original and the transformed structures satisfy the theory's field equations everywhere, including inside the hole?
  (b) Satisfactory: The text explicitly states or shows that the transformed fields are solutions to the same equations as the original.
  (c) Failure: The author transforms the metric but leaves matter sources fixed, or the transformed metric fails the equations in the drag region.
  (d) Consequence: Desk Rejection.
  *Tag: [Mechanical]*. *Gaming:* Authors may claim "effective" solutions. *Giveaway:* Absence of explicit equation verification in the transformation region.

  **Check 2: Field Dragging Consistency**
  (a) Are all dynamical fields (metric, matter, gauge fields) transformed by the diffeomorphism, or are some held fixed?
  (b) Satisfactory: The author specifies that the diffeomorphism acts on the entire set of dynamical fields via pullback.
  (c) Failure: The metric is dragged, but a matter field or coordinate grid is held fixed to anchor the points.
  (d) Consequence: Rejection with Reasons (fundamental misunderstanding of covariance).
  *Tag: [Mechanical]*.

  **Check 3: Background Structure Identification**
  (a) Does the theory employ any non-dynamical fields (absolute objects) to individuate manifold points?
  (b) Satisfactory: The author acknowledges that fixed background structures break general covariance and restrict the symmetry group.
  (c) Failure: The author uses a fixed field to define point identity while claiming the theory remains generally covariant.
  (d) Consequence: Desk Rejection.
  *Tag: [Interpretive]*. *Gaming:* Calling a fixed field "dynamic" without an equation of motion. *Giveaway:* No variation principle for the field.

  **Check 4: Isomorphism Verification**
  (a) Are the two models isomorphic under the diffeomorphism, or merely related by a map preserving partial structure?
  (b) Satisfactory: The text confirms the map is an isomorphism of the full model structure.
  (c) Failure: The models are distinct because the map does not preserve the background structure identified in Check 3.
  (d) Consequence: Reject with Reasons (if isomorphism is denied without justification) or Escalation (if background status is debated).
  *Tag: [Mechanical]*.

  **Check 5: Observable Expressibility**
  (a) Is the claimed physical difference expressible in terms of gauge-invariant quantities (coincidences, relational observables)?
  (b) Satisfactory: The difference is described via invariant relations between field values.
  (c) Failure: The difference relies solely on the identity of bare manifold points (e.g., "the metric is different at point p").
  (d) Consequence: Rejection with Reasons (physical significance not established).
  *Tag: [Interpretive]*.

  **Check 6: Boundary Conditions**
  (a) Does the diffeomorphism fall off to the identity at infinity (or the boundary)?
  (b) Satisfactory: The map is compactly supported or identity at the boundary.
  (c) Failure: The map alters asymptotic structure (e.g., changes conserved charges like mass or momentum).
  (d) Consequence: Escalation to Specialist Referee (this concerns asymptotic symmetries, not the Hole Argument).
  *Tag: [Mechanical]*.

  **Check 7: Indeterminism Definition**
  (a) Does the claimed indeterminism concern initial data failing to determine a unique isomorphism class, or something else?
  (b) Satisfactory: The author distinguishes between uniqueness of solutions and uniqueness of isomorphism classes.
  (c) Failure: The author claims indeterminism because component values differ at bare points, despite isomorphism.
  (d) Consequence: Rejection with Reasons.
  *Tag: [Interpretive]*.

  **Check 8: Metaphysical Load**
  (a) Is the metaphysical conclusion (e.g., substantivalism is false) supported by the formalism, or is it a semantic stipulation?
  (b) Satisfactory: The author acknowledges that Leibniz Equivalence is a interpretive principle adopted to save determinism.
  (c) Failure: The author claims the mathematics *forces* a metaphysical conclusion without acknowledging the interpretive leap.
  (d) Consequence: Revise-and-Resubmit (clarify status of equivalence) or Escalation.
  *Tag: [Interpretive]*.

  **Limits of the Procedure**
  This procedure cannot settle whether Leibniz Equivalence is a semantic stipulation or a consequence of formalism; that is a philosophical dispute outside editorial jurisdiction. It also cannot adjudicate borderline cases of background structure in modified gravity theories where the dynamical status of fields is contested. In such cases, escalation is mandatory.

  **Worked Cases**

  **Case 1: The Standard Reconstruction**
  *Submission:* Technically careful, vacuum solution, identity at infinity. Concludes GR is indeterministic and substantivalism false.
  *Check 1 (Validity):* Pass. Both are vacuum solutions.
  *Check 2 (Dragging):* Pass. No matter to drag.
  *Check 3 (Background):* Pass. No background fields.
  *Check 4 (Isomorphism):* Pass. Models are isomorphic.
  *Check 5 (Observables):* Fail. Difference expressed via bare points.
  *Check 6 (Boundary):* Pass. Identity at infinity.
  *Check 7 (Indeterminism):* Fail. Confuses isomorphism class with unique solution.
  *Check 8 (Metaphysics):* Fail. Treats orthodoxy as new discovery.
  *Disposition:* Reject. The paper reproduces the standard Earman-Norton conclusion without novelty. The math is sound, but the philosophical claim is established orthodoxy in this journal.
  *Desk Letter:* "While the mathematical derivation is correct, the conclusion that general relativity implies indeterminism under substantivalism is the standard reconstruction of the Hole Argument as established in the literature since 1987. As this manuscript does not offer a novel technical extension or a distinct interpretive framework beyond this established result, it does not meet the threshold for publication in this journal."

  **Case 2: The Absolute Scalar**
  *Submission:* Region filled with prescribed non-dynamical scalar. Drags metric, fixes scalar. Claims real indeterminism.
  *Check 1 (Validity):* Fail. The transformed metric does not satisfy equations coupled to the fixed scalar.
  *Check 2 (Dragging):* Fail. Scalar field held fixed.
  *Check 3 (Background):* Fail. Scalar is absolute structure.
  *Check 4 (Isomorphism):* Fail. Models not isomorphic due to fixed scalar.
  *Check 5 (Observables):* Fail. Difference relies on scalar level surfaces.
  *Check 6 (Boundary):* Pass.
  *Check 7 (Indeterminism):* Fail. Artifacts of background structure.
  *Check 8 (Metaphysics):* Fail. Relational individuation not failed; setup is non-relational.
  *Disposition:* Desk Rejection. The setup violates the definition of a generally covariant theory by introducing absolute structure.
  *Desk Letter:* "The manuscript introduces a non-dynamical scalar field to individuate points while treating the metric as dynamical. This construction breaks general covariance by definition, meaning the resulting 'indeterminism' is an artifact of the background structure rather than a feature of the theory. Consequently, the paper falls outside the scope of foundational research into generally covariant gravity."

  **Case 3: Asymptotic Charges**
  *Submission:* Asymptotically flat spacetimes. Diffeomorphisms non-trivial at infinity. Claims standard dissolution fails. Poor prose.
  *Check 1 (Validity):* Unclear (poor notation).
  *Check 2 (Dragging):* Unclear.
  *Check 3 (Background):* Pass (asymptotic structure is standard).
  *Check 4 (Isomorphism):* Fail (by author's design).
  *Check 5 (Observables):* Pass (charges are observables).
  *Check 6 (Boundary):* Fail. Map acts non-trivially at infinity.
  *Check 7 (Indeterminism):* Unclear.
  *Check 8 (Metaphysics):* Unclear.
  *Disposition:* Escalation to Specialist Referee. Check 6 triggers a known technical exception (BMS symmetries) where the standard Hole Argument dissolution is contested. The poor prose prevents safe triage.
  *Desk Letter:* "This manuscript addresses the behavior of diffeomorphisms at asymptotic boundaries and their effect on conserved charges, a technical matter requiring specialized expertise in asymptotic symmetries. Due to the notational idiosyncrasies and the specialized nature of the boundary condition claims, we are sending this to a specialist referee to assess the mathematical validity before further editorial consideration."

  **Verdict Note:** Case 1 is the unpleasant verdict. The paper is technically sound and philosophically coherent according to one valid reading of the Hole Argument, but it must be rejected because it offers no advance over existing literature. Rejecting a correct paper for lack of novelty is always difficult for an editor.
