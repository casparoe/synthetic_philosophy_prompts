answer: |-
  In the occupied city of Vespera, Elias, a civilian employee of the Ministry of Transport, sits at a desk in a requisitioned office block, updating the nightly fuel distribution ledger for the armored divisions advancing on the border. He wears no uniform, carries no weapon, and clocks out at 18:00 to return to his apartment, yet retains the authority to resign but declines; the algorithm he maintains determines which battalions receive diesel and which stall immobile, and if he deletes his key tonight, three mechanized brigades will halt within forty-eight hours, unable to source a replacement with his clearance levels before the offensive collapses. A special forces operator from the defending nation, having verified Elias's role and the impossibility of substitution through intercepted communications, stands in the doorway with a suppressed pistol, preparing to end Elias's life to stop the advance without engaging the soldiers pushing it.

  **The Verdicts**

  The traditional view, often called Orthodoxy, judges the permissibility of killing based on **status**. It holds that individuals are divided into two classes: those who are uniformed members of the armed forces (who may be killed) and those who are not (who may not). Because Elias wears no uniform and holds no official role as a soldier, Orthodoxy classifies him as protected. The operator is therefore forbidden from shooting him, regardless of how much harm Elias's work causes.

  The revisionist view, often called Liability Theory, judges permissibility based on **conduct and responsibility**. It holds that a person loses their protection against being killed only if they are morally responsible for a serious, unjust threat. Because Elias voluntarily maintains the system that enables the unjust advance, and because his removal is necessary to stop it, Revisionism classifies him as liable to defensive harm. The operator is therefore permitted to shoot him, provided the harm inflicted is proportionate to the threat stopped.

  **The Single Feature**

  The split arises entirely from the **criterion of targeting**. Orthodoxy looks at *who the person is* (uniformed or not); Revisionism looks at *what the person does* (causing harm or not). Elias is a civilian who causes harm. Orthodoxy sees the civilian status and forbids the strike; Revisionism sees the causal responsibility and permits it.

  **The Dials**

  First, put Elias in a uniform and hand him a rifle. Orthodoxy now permits the killing because his status has changed to soldier. Revisionism also permits the killing because he is now an unjust combatant, fully liable for the threat he poses. The verdicts converge: both allow the strike. This tells us the disagreement is not about whether soldiers can be killed, but about whether non-soldiers can be.

  Second, leave Elias a civilian but make his contribution trivially substitutable within a week. Orthodoxy still forbids the killing because his status remains civilian. Revisionism now forbids the killing because his individual causal contribution is too small to make him liable; removing him changes nothing, so killing him is pointless and disproportionate. The verdicts converge: both forbid the strike. This tells us the disagreement relies on the target making a unique, decisive difference to the war effort.

  **Objections from the Traditional View**

  A defender of Orthodoxy would press three objections. First, the **epistemic objection**: soldiers cannot know who is truly liable in the fog of war, so a clear rule based on uniforms is necessary to prevent massacres. (Answer: This case stipulates perfect intelligence to isolate the moral principle, but the objection holds for real-world application.)

  Second, the **slippery slope objection**: allowing kills based on contribution blurs the line between soldier and civilian, eventually putting all workers at risk. (Answer: Conceded; this is a significant risk, but Orthodoxy sacrifices truth for safety, whereas Revisionism seeks truth despite the risk.)

  Third, the **conventionalist objection**: the rules of war are not a search for deep moral truth but an institutional scheme justified by what they save; clear lines save more lives than complex liability judgments. (Answer: This is the strongest objection. One must concede that even if Revisionism is morally correct in theory, Orthodoxy may be preferable as a legal code because it is easier to follow and enforce.)

  **Sophisticated Revisionism**

  A careful liability theorist might refuse the permissive verdict not because Elias is innocent, but for second-order reasons: killing him might normalize the targeting of infrastructure workers, leading to greater long-term harm. If this worry holds, the split collapses because both views forbid the strike (Orthodoxy due to status, Revisionism due to consequences). To restore the split, make the minimal change that the operation is covert and leaves no trace of policy change, neutralizing the normalization risk. Under these conditions, the sophisticated revisionist accepts the permission based on liability, while Orthodoxy maintains the prohibition based on status.

  **Where This Case Fails**

  This case is most likely to fail on the stipulation of perfect intelligence. In reality, verifying that a specific civilian is non-substitutable and voluntarily contributing is nearly impossible without violating sovereignty or privacy norms that even the defending nation must respect. The weakest link is the assumption that a soldier can distinguish between a liable logistician and an innocent conscripted worker without error. Furthermore, I am leaning on a contested reading of Revisionism: some liability theorists argue that logistical support, however vital, never generates enough moral responsibility to justify killing, reserving liability only for those directly wielding force. If that reading holds, Revisionism forbids the killing too, and the split vanishes.
