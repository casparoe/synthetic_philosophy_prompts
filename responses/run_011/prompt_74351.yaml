  "No. But she couldn't be coerced into staying."

  "Coerced by what? By truth?"

  "By certainty. It removes the risk faith demands."

  "Risk isn't silence. Risk is trusting without seeing."

  "If He showed Himself, there is no trust. Only knowledge."

  Nora closed the journal. "Why was that freedom distributed so unevenly?"

  "What do you mean?"

  "You report assurance you never sought. She sought it for nine years. Nothing."

  "Grace isn't a reward for seeking."

  "Then it's arbitrary. Why her silence and your noise?"

  "I don't know the mechanics of it."

  "Don't retreat. If a father withheld himself from a child weeping nightly..."

  "It's not the same relationship."

  "Why? Because God is bigger? That makes Him worse."

  "It's about the kind of response He wants."

  "A father who hides to test loyalty is cruel."

  "He isn't hiding. He is making space."

  "Space isn't nine years of static."

  "You're reducing it to administrative convenience."

  "I'm saying a father ignoring a child is judged cruel, not prudent."

  "Any disanalogy you offer must not reduce her silence to convenience."

  "God isn't a father in the human sense."

  "Then stop using human love to justify His silence."

  "A response keyed to inner states nobody can audit..."

  "Nora, stop."

  "...is indistinguishable from there being no one to distribute it."

  "If the criteria are hidden, the distribution looks random."

  "You think I haven't asked myself that?"

  "I think you have an answer that doesn't fit this room."

  "You're hiding behind the argument."

  "I'm holding you to it."

  "You haven't cried yet. Not since the diagnosis."

  "This isn't about me."

  "It is. You're treating her pain like a puzzle."

  "It's the only way to keep it from killing me."

  "Let it kill you. She did."

  "Don't."

  "I'm sorry. I just want you here."

  "I am here."

  "Not really."

  Elias looked at the box. "I can't explain the silence."

  "I know."

  "But I miss her."

  Nora reached for the cold tea.
