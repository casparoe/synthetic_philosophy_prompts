  The principle that best unifies your verdicts is **Baseline Integrity with a Probability Threshold.**

  This account combines two distinct filters that a decision must pass before Expected Value (EV) arithmetic is allowed to dominate.

  ### The Principle: Baseline Integrity with a Probability Threshold

  **1. The Ruin Constraint (Baseline Integrity):**
  You must not accept any action that carries a probability of "ruin" (catastrophic loss of the status quo, existential risk, or destruction of essential public goods) greater than a specific threshold $\tau$. If the probability of ruin exceeds $\tau$, the action is vetoed regardless of the potential upside. This explains why you reject trading certain safety or health budgets for longshots (Cases 4, 5, 6).

  **2. The Noise Threshold ($\tau$):**
  Probabilities below $\tau$ are treated as effectively zero for the purpose of the Ruin Constraint. They are "metaphysical noise." If a risk is below $\tau$, you are permitted to ignore it and make decisions based on trivial certain stakes (Cases 2, 3).

  **3. Bounded Utility:**
  Money and personal welfare have diminishing marginal utility. You will not pay infinite or arbitrarily large sums for unbounded theoretical gains because the utility of money caps out relative to your life (Case 1).

  **Where is $\tau$?**
  Based on your verdicts, your threshold lies between $10^{-20}$ and $10^{-9}$.
  *   $10^{-20}$ is below $\tau$ (Noise).
  *   $10^{-9}$ is above $\tau$ (Signal/Risk).

  ### How This Explains Your Verdicts

  **The 2/3 vs. 4/5 Distinction**
  This is the crux of your puzzle. The math looks similar, but the *relationship to the baseline* differs.

  *   **Cases 2 & 3 (The Button):** The stake ($1) is trivial relative to your personal baseline. The probability ($10^{-20}$) is below your noise threshold $\tau$.
      *   In **Case 2**, since the risk is noise, you look at the upside. Even with discounting, the sheer scale of $10^{30}$ lives combined with a trivial $1 cost feels like a "free lottery ticket."
      *   In **Case 3**, since the risk is noise ($10^{-20} < \tau$), the Ruin Constraint is not triggered. You treat the $10^{30}$ deaths as statistically irrelevant. You act on the certain $1 gain.
  *   **Cases 4 & 5 (The Policy):** These involve *public baselines* (health budgets, pandemic safety).
      *   In **Case 4**, spending the *entire* budget guarantees a loss of the current health baseline. This violates Baseline Integrity immediately (certain harm vs. uncertain gain).
      *   In **Case 5**, the probability of escape ($10^{-9}$) is *above* your threshold $\tau$. It is no longer noise; it is a signal. Because the outcome (pandemic) constitutes ruin, the Ruin Constraint vetoes the project, regardless of the vaccine benefit.

  **Case 1 (St. Petersburg):**
  Bounded Utility explains the $20 cap. You value the certainty of $20 more than the abstract utility of infinite expected dollars, because money stops mattering past a certain point in your life.

  **Case 6 (Fool vs. Sane):**
  The "Fool" violates Baseline Integrity by betting the farm (everything) on a tail event. The "Sane" person accepts risks only when they are below $\tau$ (normal life risks) or when the baseline is secure.

  **Case 7 (Cluelessness):**
  This principle licenses action. You don't need to know the infinite future; you only need to ensure your action doesn't breach the Ruin Constraint or waste essential baseline resources.

  ### Prediction: The AI Lab Case

  **The Case:** A lab argues continuing to train a model carries a 1-in-1,000 ($10^{-3}$) chance of transformative benefit and a 1-in-1,000 ($10^{-3}$) chance of catastrophic loss.

  **The Prediction:**
  My account says **do not train** (or pause until the risk is mitigated below $\tau$).

  **Why this differs from "Compare Them":**
  A pure Expected Value comparison might argue: *If the transformative benefit is large enough (e.g., solving death), it outweighs the 1/1000 catastrophe.*
  My account says: **No.**
  1.  **Probability:** $10^{-3}$ is vastly larger than your threshold $\tau$ (which is $< 10^{-9}$). This is not noise; it is a clear signal.
  2.  **Ruin Constraint:** Catastrophic loss constitutes "ruin." Since the probability ($10^{-3}$) exceeds $\tau$, the Ruin Constraint vetoes the action.
  3.  **Asymmetry:** You cannot trade a baseline threat (catastrophe) for a tail gain (utopia) when the risk is this high. The certain safety of the status quo is preferred over the gamble.

  ### The Verdict You Must Drop

  To maintain this principle consistently, you must reconsider **Case 3**.

  **The Conflict:**
  In Case 3, you accept a 1-in-$10^{20}$ risk of $10^{30}$ deaths for $1.
  In Case 5, you reject a 1-in-$10^{9}$ risk of pandemic for a vaccine.

  If your principle is **Baseline Integrity**, you must ask: *Are those $10^{30}$ lives part of the baseline you are stewarding?*
  *   If **Yes**: You cannot treat their potential extinction as "noise" simply because the probability is $10^{-20}$. While $10^{-20}$ is below your *practical* threshold $\tau$, ethically, risking existence for $1 violates the spirit of Baseline Integrity. It implies that for trivial personal gain, you are willing to expose the universe to ruin, provided the odds are long enough.
  *   If **No**: You are treating the $10^{30}$ lives as abstract numbers rather than moral patients.

  **The Fix:**
  You should likely shift your verdict on Case 3 to **"Do Not Push."**
  Even if $10^{-20}$ is below your practical threshold $\tau$, the *magnitude* of the ruin ($10^{30}$ deaths) is so vast that it should arguably trigger a "Lexical Priority" rule: *No probability of total extinction is acceptable for trivial gain.*

  If you keep Case 3 as "Push," you are admitting that your principle is not truly about *Baseline Integrity*, but rather about **Personal Triviality vs. Public Policy.** You are saying, "I can gamble with the universe if it's just me and a magic button, but I can't gamble with society's resources." That is a consistent psychological stance, but it is hard to defend as a moral principle.

  **Summary:**
  Adopt **Baseline Integrity with a Probability Threshold.** It saves your intuitions on policy (4/5), AI safety, and St. Petersburg (1). It explains the 2/3 vs 4/5 split via the definition of "Baseline Goods." But it requires you to admit that Case 3 is morally hazardous, or at least inconsistent with the stewardship ethic you apply in Case 5.
