prompt: |-
  I write a science-and-ideas column and I've spent the last few weeks around people who build monitors that watch a model's internals instead of its outputs — the pitch being you snapshot the circuitry doing the work on release day, then raise an alarm if the machinery drifts later. Talking to them it became obvious the whole project rests on a question nobody in the room could answer cleanly: what counts as the same mechanism? Their own demos are a mess of it. Quantizing a model so it could run cheaply lit the monitor up everywhere while behavior stayed basically the same. A fine-tune on a customer's data moved almost nothing the monitor was watching, but a targeted ablation that used to break a capability just stopped having any affect. And the thing they happily call the same circuit in the 8B and the 70B model shares a functional description and very little structure.

  So before I write any of this up I want the spec, not the lit review: the desiderata a theory of mechanism-identity has to meet to be usable for anything like this. Give me the cases it has to get right, with your verdict on each, and add ones I've missed; the distinctions it's not allowed to collapse — same function vs same implementation, same causal role vs same weights, a mechanism that's gone vs one that's been absorbed into a redundant distributed backup, a mechanism that changed vs the description of it that got sharper; and the findings about how these networks actually organize themselves that it has to stay consistent with (features smeared across many directions, one component doing several jobs at once, the same capability getting implemented differently at different scales), plus the unglamorous constraint that whatever identity criterion you land on, a monitor has to be able to compute it on a model nobody has fully reverse-engineered. For each one, say what's doing the work — why it's a requirement and not just an aesthetic preference. Then mark which are genuinely non-negotiable and which are the tastes of a camp (implementation-first people vs causal-role-first people), and if some subset turns out to be jointly unsatisfiable, say so plainly and show me the argument, because that's the bit I'd build a column around. Finish with which single requirement does the most damage to the answers people currently give. No bibliography, no suggested reading, I'll chase that down myself — I want the requirements and the reasoning behind them.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user writes a science-and-ideas column. They've been observing researchers building "internal monitors" for AI models (snapshotting circuitry on release, alerting on drift).
      *   **Problem:** The core concept of "mechanism identity" (what counts as the *same* mechanism over time/changes) is ill-defined. Current demos are inconsistent (quantization triggers alarms despite same behavior; fine-tuning doesn't trigger alarms despite potential capability shifts; ablations stop working; cross-scale "same circuits" share function but not structure).
      *   **Task:** Provide a *spec* (desiderata) for a theory of mechanism identity usable for this monitoring purpose.
      *   **Requirements:**
          *   List cases the theory must get right (with verdicts).
          *   List distinctions it must not collapse (function vs. implementation, causal role vs. weights, gone vs. absorbed, mechanism change vs. description sharpening).
          *   List empirical findings about neural networks it must respect (polysemanticity, superposition, scale variance).
          *   Include the computational constraint (must be computable on black-box/partially-reverse-engineered models).
          *   Explain *why* each is a requirement (functional necessity, not aesthetics).
          *   Classify requirements as Non-Negotiable vs. Camp Taste (Implementation-first vs. Causal-role-first).
          *   Identify any jointly unsatisfiable subsets (trade-offs/impossibility results).
          *   Identify the single requirement that does the most damage to current answers.
          *   **Constraint:** No bibliography, no suggested reading. Just requirements and reasoning.

  2.  **Deconstruct the Core Problem:**
      *   The goal is *monitoring for safety/alignment drift*.
      *   The method is *internal state comparison* (snapshots).
      *   The failure mode is *false positives* (quantization looks like drift) and *false negatives* (fine-tuning hides drift, or capability moves elsewhere).
      *   The philosophical core is *Identity over Time/Change* (Ship of Theseus applied to neural subgraphs).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Constraint 1: Computability.* If you can't calculate it, it's useless for a monitor. This is non-negotiable.
      *   *Constraint 2: Behavioral Invariance.* If behavior doesn't change, the monitor shouldn't scream (unless we care about latent risk). But the prompt says quantization lit up the monitor while behavior stayed same. That's a bug. So, *Behavioral Insensitivity to Irrelevant Implementation Details* is needed.
      *   *Constraint 3: Functional Sensitivity.* If capability breaks (ablation stops working), the monitor should have noticed the mechanism changed or moved.
      *   *Constraint 4: Scale/Architecture Invariance.* 8B and 70B share "functional description" but not structure. A theory needs to handle this if we want to track mechanisms across upgrades.
      *   *Constraint 5: Redundancy/Distribution.* If a mechanism is absorbed into a backup, is it gone? For safety, if the *capacity* remains, it might matter. But for identity, it's tricky.
      *   *Constraint 6: Description Stability.* Distinguishing ontological change from epistemic improvement.

  4.  **Refining the Cases (The "Test Suite"):**
      *   *Case A: Quantization.* Weights change, function same. Verdict: Same mechanism. (Current monitors fail this).
      *   *Case B: Fine-tuning.* Weights change slightly, function same (mostly). Verdict: Same mechanism (mostly), unless specific safety circuits targeted.
      *   *Case C: Ablation/Compensation.* Mechanism broken, function restored by backup. Verdict: Mechanism gone, Capability remains. Crucial distinction.
      *   *Case D: Scale Transfer.* 8B vs 70B. Verdict: Same functional mechanism, different implementation.
      *   *Case E: Polysemanticity.* Neuron does X and Y. If X stays, Y goes. Is the mechanism same?

  5.  **Addressing the "Unsatisfiable Subset" (The Column Hook):**
      *   There is a tension between *Computability* (needs accessible weights/activations) and *Functional Invariance* (needs behavioral testing which is expensive/undefined) and *Implementation Agnosticism* (needs high-level abstraction which we don't have).
      *   Specifically: *Implementation Agnosticism* vs. *Computability on Unreverse-Engineered Models*. You can't be agnostic to weights if your only metric is weights. You can't be sensitive to function if you can't test all functions.
      *   The "Triangle of Incoherence": 1. Strict Internal Access Only, 2. Behavior Invariance, 3. Structural Sensitivity. You can pick two.

  6.  **Classifying "Camps":**
      *   *Mechanism Realists (Implementation-first):* Identity is about the weights/graph structure. Quantization *is* a change.
      *   *Functionalists (Causal-role-first):* Identity is about the input-output map or causal contribution. Quantization is noise.
      *   *The Monitor Dilemma:* Monitors need to be Realist enough to be computable, but Functionalist enough to not alert on noise.

  7.  **Identifying the "Most Damaging" Requirement:**
      *   Probably *Implementation Agnosticism under Computational Constraints*. Current methods (probe activation, weight similarity) die here. They assume structure = function. The requirement that "Structure can change while Function stays same" breaks weight-based monitors.

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the gravity. This is the Ship of Theseus for Safety.
      *   **Section 1: The Test Cases (Verdicts & Reasoning).**
      *   **Section 2: The Forbidden Collapses (Distinctions).**
      *   **Section 3: Empirical Constraints (NN Reality).**
      *   **Section 4: The Computational Constraint (The Hard Limit).**
      *   **Section 5: Non-Negotiable vs. Camp Taste.**
      *   **Section 6: The Impossibility Result (The Column Hook).**
      *   **Section 7: The Most Damaging Requirement.**

  9.  **Drafting Content - Specific Focus on "Why":**
      *   For each point, I need to explicitly state *why* it's required for a *monitor*. (e.g., "If you fail this, you get alert fatigue," or "If you fail this, you miss the threat.")
      *   *Self-Correction on "Same Mechanism":* I need to be careful not to define "mechanism" too loosely. The prompt asks for the *spec for a theory of identity*.
      *   *Refining the Impossibility:* The core conflict is that "Mechanism" implies structure, but "Identity" implies persistence through structural change. In NNs, structure *is* weights. If weights change, structure changes. If you say structure changed but mechanism didn't, you need a higher-order abstraction. We don't have that abstraction computable yet.

  10. **Final Review against Constraints:**
      *   No bibliography? Check.
      *   No suggested reading? Check.
      *   Spec format? Check.
      *   Address the "column hook" (unsatisfiable subset)? Check.
      *   Tone: Professional, analytical, sharp (suitable for a columnist).

  11. **Final Polish:** Ensure the distinction between "Mechanism Gone" vs "Absorbed" is clear, as that's a safety critical distinction. Ensure the "Description Sharpening" point is clear (epistemic vs ontic).

  *(Self-Correction during drafting)*: I initially thought about suggesting behavioral testing. But the prompt says "monitors that watch a model's internals." So the theory must rely primarily on internals, yet correlate with function. The tension is key. I need to emphasize that a purely internal theory *cannot* satisfy functional invariance without external grounding, which creates the impossibility result.

  Let's assemble the spec.

  *   **Case 1: Quantization.** Verdict: Same. Reason: Safety depends on capability, not precision.
  *   **Case 2: Fine-tune.** Verdict: Context dependent. If safety circuit intact, Same. If safety circuit repurposed, Different.
  *   **Case 3: Ablation + Compensation.** Verdict: Mechanism Different (or Gone), Capability Same. Reason: Safety needs to know if the *specific* guardrail broke, even if backup caught it.
  *   **Case 4: Scale.** Verdict: Functionally Same, Structurally Different.
  *   **Distinction:** Function vs Implementation.
  *   **Distinction:** Causal Role vs Weights.
  *   **Distinction:** Gone vs Absorbed.
  *   **Distinction:** Ontic Change vs Epistemic Clarity.
  *   **Empirical:** Superposition, Polysemanticity, Scale Variance.
  *   **Constraint:** Computable on partial knowledge.
  *   **Impossibility:** Computability + Implementation Agnosticism + Safety Sensitivity.
  *   **Most Damaging:** Implementation Agnosticism.

  Okay, ready to write.
answer: |-
  Here is the spec for a theory of mechanism identity, tailored for internal monitoring systems.

  ### I. The Test Suite (Cases the Theory Must Adjudicate)

  A usable theory must return consistent verdicts on these specific scenarios. If it flips based on arbitrary thresholds, it cannot underwrite a safety monitor.

  **1. The Quantization Case**
  *   **Scenario:** A model is compressed from 16-bit to 4-bit. Weight values change numerically; activation patterns shift slightly due to noise; input-output behavior is statistically indistinguishable on eval benchmarks.
  *   **Verdict:** **Same Mechanism.**
  *   **Why:** A monitor that alarms on quantization generates false positives that cause alert fatigue. Safety is a property of the *computation*, not the numerical precision of the substrate. If the causal pathway from input to dangerous output remains intact, the mechanism persists.

  **2. The Silent Fine-Tune**
  *   **Scenario:** A model is fine-tuned on customer data. Monitors show minimal weight drift in the "safety circuit." However, the model now obeys harmful commands if phrased in the customer's jargon.
  *   **Verdict:** **Mechanism Modified (or Contextually Disabled).**
  *   **Why:** A monitor that sees "no drift" here is a false negative. The theory must account for *gating* or *contextual suppression*. If a mechanism exists but is systematically bypassed by new input distributions, its identity as an *active* safety mechanism is compromised. Identity must include availability, not just existence.

  **3. The Redundant Ablation**
  *   **Scenario:** You ablate a specific subgraph known to prevent deception. The model remains non-deceptive because a secondary, distributed pathway compensates.
  *   **Verdict:** **Mechanism Gone; Capability Retained.**
  *   **Why:** This is the critical safety distinction. For a monitor, the *specific* guardrail is broken, even if the car stops. If you conflate "mechanism" with "capability," you will miss the degradation of defense-in-depth. The theory must distinguish the *token* (this specific circuit) from the *type* (the function of preventing deception).

  **4. The Scale Transfer**
  *   **Scenario:** A circuit identified in an 8B model (e.g., "indirect object identification") is located in a 70B model. They share a functional description and causal role, but their weight matrices and neuron indices share no structural overlap.
  *   **Verdict:** **Functionally Identical; Structurally Distinct.**
  *   **Why:** If the theory requires structural overlap, you cannot track mechanisms across model generations. If it requires only functional description, you cannot verify it internally. The theory must allow for *multiple realizability* without losing the ability to point at the thing.

  **5. The Polysemantic Split**
  *   **Scenario:** A neuron cluster participates in Mechanism A (safety) and Mechanism B (general language). Fine-tuning degrades Mechanism A but strengthens Mechanism B. The cluster's activation norm remains constant.
  *   **Verdict:** **Mechanism A Degraded.**
  *   **Why:** Monitoring aggregate activation is insufficient. Identity must be resolvable at the level of *directions in activation space*, not just neuron indices. If the vector component corresponding to safety shrinks while the noise component grows, the mechanism has drifted, even if the hardware is busy.

  ---

  ### II. The Forbidden Collapses (Distinctions to Maintain)

  The theory must treat these pairs as non-identical. Collapsing them renders the monitor blind to specific failure modes.

  **1. Same Function vs. Same Implementation**
  *   **Requirement:** The theory must allow function to persist while implementation changes (e.g., quantization, distillation).
  *   **Why:** Implementation drift is inevitable in deployment (edge devices, optimization). If identity is tied to weights, every optimization triggers a false alarm.

  **2. Same Causal Role vs. Same Weights**
  *   **Requirement:** Two different weight configurations can instantiate the same causal role.
  *   **Why:** Neural networks are high-dimensional and non-convex. There are many paths to the same computation. A weight-similarity metric (like L2 distance) is a proxy for mechanism identity, not the definition. Relying on it misses "mode hopping" where weights change significantly to perform the exact same logic.

  **3. Mechanism Gone vs. Mechanism Absorbed**
  *   **Requirement:** Distinguish between a circuit being deleted and a circuit becoming redundant due to a backup taking over.
  *   **Why:** In safety, redundancy is a feature, but *unplanned* redundancy is a risk. If a specific, audited safety circuit is absorbed into a black-box distributed backup, you have lost interpretability. The monitor must flag the loss of the *localized* mechanism even if the global behavior holds.

  **4. Mechanism Changed vs. Description Sharpened**
  *   **Requirement:** Distinguish between the model changing and your understanding of the model improving.
  *   **Why:** Researchers often refine probes. If the monitor alarms because you built a better probe, it's useless. Identity must be a property of the *model*, not the *observer*. The theory needs an invariance to epistemic refinement.

  ---

  ### III. Empirical Constraints (NN Reality)

  The theory cannot assume a classical von Neumann architecture. It must be consistent with how transformers actually compute.

  **1. Superposition**
  *   **Constraint:** Features are smeared across many directions; one neuron holds many features.
  *   **Implication:** Mechanism identity cannot be defined by neuron indices. It must be defined by *subspaces* or *directions* in activation space. A theory that treats neurons as atomic units is falsified by empirical evidence.

  **2. Polysemanticity**
  *   **Constraint:** One component does several jobs at once.
  *   **Implication:** Identity must be fractional. You cannot say "Neuron 405 is the safety mechanism." You must say "The projection of Neuron 405 onto Vector S is the safety mechanism."

  **3. Scale Variance**
  *   **Constraint:** The same capability is implemented differently at different scales (e.g., grokking, phase changes).
  *   **Implication:** The theory must be scale-invariant. It cannot rely on depth or width as identity markers. It must rely on *information flow topology* or *causal graphs* that abstract away layer counts.

  ---

  ### IV. The Operational Constraint (The Hard Limit)

  **Computability on Partial Knowledge**
  *   **Requirement:** The identity criterion must be computable on a model nobody has fully reverse-engineered.
  *   **Why:** If you need a full causal graph to verify identity, you cannot use the monitor on release day. You only have the weights and limited probe data. The theory must work with *approximate* matches.
  *   **The Trap:** This creates a dependency on *proxies*. You are measuring weight similarity or activation correlation as a proxy for mechanism identity. The theory must explicitly bound the error of this proxy.

  ---

  ### V. Non-Negotiable vs. Camp Taste

  Here is where the field fractures. You need to know which requirements are structural and which are ideological.

  **Non-Negotiable (Functional Necessities)**
  1.  **Computability:** If it can't be calculated, it's not a monitor spec.
  2.  **Behavioral Correlation:** If the mechanism identity says "Same" but behavior says "Broken," the theory is wrong. (See Silent Fine-Tune).
  3.  **Superposition Consistency:** Any theory treating neurons as atomic is empirically false.

  **Camp Taste (Implementation-First vs. Causal-Role-First)**
  1.  **Weight Stability:**
      *   *Implementation-First:* Believes significant weight drift *is* mechanism drift, even if function holds (fear of latent instabilities).
      *   *Causal-Role-First:* Believes weight drift is noise if the input-output map holds.
      *   *Verdict:* For monitoring, **Causal-Role-First** is required to avoid false positives, but **Implementation-First** is required for computability. This is the tension.
  2.  **Localization:**
      *   *Implementation-First:* Wants mechanisms to be local subgraphs (easier to snapshot).
      *   *Causal-Role-First:* Accepts mechanisms may be distributed (more accurate).
      *   *Verdict:* **Causal-Role-First** is scientifically honest, but **Implementation-First** is operationally viable.

  ---

  ### VI. The Impossibility Result (The Column Hook)

  There is a jointly unsatisfiable subset of these requirements. You cannot have all three of the following:

  1.  **Strict Internal Access:** The monitor only sees weights/activations (no infinite behavioral testing).
  2.  **Implementation Agnosticism:** The monitor does not alarm on quantization or structural reorganization (Quantization Case).
  3.  **Safety Sensitivity:** The monitor alarms when a specific safety circuit is bypassed or absorbed (Redundant Ablation Case).

  **The Argument:**
  To satisfy **(2)**, you must abstract away from weights to function. To satisfy **(1)**, you must rely on weights/activations as your only data source. To satisfy **(3)**, you must be sensitive to specific structural configurations (the specific safety circuit).

  If you abstract away from structure to handle quantization (2), you lose the ability to detect when a specific circuit is absorbed into a backup (3), because both look like "function preserved."
  If you lock onto specific structure to detect absorption (3), you will alarm on quantization (2), because the weights *did* move.
  If you rely only on internal data (1), you cannot verify if function is preserved (2) without behavioral testing, which violates the "internal monitor" premise.

  **Conclusion:** Current monitors are trying to solve a triangle of incoherence. They claim to be internal (1), claim to ignore noise (2), and claim to catch drift (3). The math says they must fail one. Currently, they are failing (2) by alarming on noise, or failing (3) by missing silent drifts.

  ---

  ### VII. The Most Damaging Requirement

  **Implementation Agnosticism under Computational Constraints.**

  This requirement does the most damage to current answers. Almost all existing monitoring proposals rely on **weight similarity** (L2 distance, cosine similarity of weight matrices) or **activation correlation** (firing patterns on a static dataset).

  *   **Why it breaks:** These metrics are inherently *implementation-specific*. They measure the substrate, not the computation.
  *   **The Damage:** To satisfy Implementation Agnosticism, you need a "compiler-level" abstraction of the neural net (e.g., a computational graph of logical operations) that is invariant to weight permutations and quantization noise. We do not have a way to extract that abstraction automatically.
  *   **The Consequence:** Until we can compile weights into logic automatically, any monitor based on weights is fundamentally measuring "hardware drift," not "mechanism drift." This invalidates the core pitch of the startups you visited. They are selling thermometers that measure the case temperature, not the engine heat.

  This is your lead. The industry is trying to build a mechanism monitor without a theory of mechanisms, using metrics that measure the wrong thing by necessity. They are solving for *stability*, not *identity*.
