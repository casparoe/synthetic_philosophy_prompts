      *   *Theo 2 (Vault):* Begs the question. Duplicate has no provenance. We value achievement.
          *   *Analysis:* Theo clarifies *why* the duplicate fails. It's not a record of an achievement. He distinguishes between a "copy" and an "instance of the work."
          *   *Verdict:* Theo is right. The duplicate lacks the causal chain.
      *   *Rae 3 (Deception):* Open facsimiles are cheap too. No deception, still low price. So achievement story doesn't explain the number.
          *   *Analysis:* Rae tries to isolate "deception" as the driver of value. If I know it's a copy, it's cheap. If I think it's real, it's expensive. She thinks Theo relies on deception.
          *   *Verdict:* Rae is wrong here. Theo isn't arguing deception creates value; scarcity and origin do. An open facsimile is cheap because it's not the *original artifact*. Deception is irrelevant to the ontological status.
      *   *Theo 3 (Mass-producibility):* Open facsimiles cheap because mass-producible. Defeats achievement claim.
