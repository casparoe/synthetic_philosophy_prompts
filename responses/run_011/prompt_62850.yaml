          2.  **The Nature of the "Work":** Rae thinks the work is the image. Theo thinks the work is the artifact. They need to discuss whether the "work" is an abstract type or a concrete token.
          3.  **Aesthetic Experience:** Rae assumes knowledge of origin *shouldn't* change the look. But psychological research suggests it *does* change the perception (the "cognitive penetrability" of perception).

