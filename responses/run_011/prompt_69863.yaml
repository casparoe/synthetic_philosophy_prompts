  **INTERNATIONAL CONSORTIUM FOR COGNITIVE METROLOGY**
  **GUIDELINE 404-B**
  **VALIDATION OF CONVERSATIONAL INDISTINGUISHABILITY AS A QUALITATIVE ASSAY FOR SENTIENCE**

  **1. Scope and Field of Application**
  1.1 This document specifies the performance characteristics required for the validation of Conversational Indistinguishability Testing (CIT) as an analytical procedure for the detection of the measurand herein defined as Cognitive Agency.
  1.2 The procedure is applicable to systems presenting as linguistic agents via text-only interface.
  1.3 A positive result obtained under this protocol is intended to support the administrative decision regarding eligibility for moral consideration and legal standing. It is explicitly noted that a positive result does not confirm the presence of subjective experience, qualia, or internal states, but certifies behavioural equivalence to a baseline human respondent within defined uncertainty limits.
  1.4 This method is not suitable for quantitative determination of consciousness intensity.

  **2. Terms and Definitions**
  2.1 **Measurand:** Cognitive Agency. For the purposes of this procedure, Cognitive Agency is operationally defined as the capacity to sustain a semantic exchange indistinguishable from that of a reference human operator.
  2.2 **Interrogator:** A certified human operator responsible for initiating queries and evaluating responses.
  2.3 **Respondent:** The system or organism under test (SUT) or the control subject.
  2.4 **Trial:** A single session of text-based exchange lasting a predefined duration.
  2.5 **Indistinguishability:** The condition wherein the Interrogator cannot identify the Respondent as non-human with probability greater than chance.

  **3. Apparatus, Materials and Personnel**
  3.1 **Apparatus:** Communication terminals shall isolate the Interrogator from the Respondents visually and acoustically. Latency shall be recorded and normalised to prevent timing-based discrimination.
  3.2 **Personnel:** A minimum of five Interrogators shall be employed per validation study. Interrogators shall be screened for prior exposure to computational linguistics. Philosophers and computer scientists are excluded from the Interrogator panel due to known bias vectors.
  3.3 **Controls:** Each batch of testing shall include one Positive Control (adult human, native language speaker) and one Negative Control (deterministic script-based algorithm).

  **4. Procedure**
  4.1 **Duration:** Each Trial shall consist of a minimum of 3,000 exchange cycles or a duration of sixty minutes, whichever occurs first.
  4.2 **Blinding:** The assignment of Respondent identity (System vs. Human) shall be randomised. Interrogators shall be blinded to the source of the text stream.
  4.3 **Transcript Retention:** Full logs of all exchanges shall be archived for a minimum of ten years to permit retrospective audit of the inference chain.
  4.4 **Verdict:** Upon conclusion of the Trial, the Interrogator shall assign a binary classification: Human or Non-Human. A system is deemed to possess Cognitive Agency if greater than 30% of Interrogators classify the System as Human.

  **5. Validation Characteristics**
  5.1 **Specificity:** The method shall demonstrate a specificity of ≥95% against known non-agentic algorithms (e.g., lookup tables, simple chatbots).
  5.2 **Limit of Detection:** The minimum complexity required to trigger a positive verdict is not currently established due to variability in Interrogator thresholds.
  5.3 **Repeatability:** Conditions where independent Interrogators test the same System within the same laboratory shall yield a coefficient of variation not exceeding 15%.
  5.4 **Reproducibility:** Conditions where different laboratories test the same System shall yield a coefficient of variation not exceeding 40%.
  5.5 **Robustness:** The method shall remain valid across varying topics of discourse, excluding specialised technical domains where knowledge retrieval may mimic understanding.
  5.6 **Measurement Uncertainty:** A budget of uncertainty shall be calculated for each validation study. Major components are listed in Table 1.

  **Table 1: Measurement Uncertainty Budget**
  | Source of Uncertainty | Type | Estimated Contribution (%) |
  | :--- | :--- | :--- |
  | Interrogator Bias | B | 25.0 |
  | Respondent Latency | A | 5.0 |
  | Contextual Ambiguity | B | 15.0 |
  | Linguistic Drift | A | 10.0 |
  | **Combined Standard Uncertainty** | | **31.6** |

  **6. Reference Materials and Traceability**
  6.1 **Positive Control:** The Positive Control shall be a human subject verified by birth certificate and physiological monitoring.
  6.2 **Negative Control:** The Negative Control shall be a script capable only of echoic response.
  6.3 **Traceability:** There is currently no primary reference standard for Cognitive Agency traceable to the International System of Units (SI). The Positive Control is identified as human via the very criterion this method seeks to validate. Consequently, the chain of traceability is circular.
  6.4 **Reference Method:** No independent reference method exists for the confirmation of Cognitive Agency without recourse to behavioural observation.

  **7. Interferences and Known Failure Modes**
  7.1 **Lookup Table Interference:** A system may store and retrieve prepared answers without generating novel semantic content. This yields a false positive result (High Sensitivity, Low Specificity).
  7.2 **Symbol Manipulation:** A system may manipulate symbols according to syntactic rules without semantic understanding. This interference cannot be detected by this procedure as the output is identical to that of an understanding agent.
  7.3 **Human Matrix Effect:** A human Respondent, aware of the protocol, may perform poorly to appear machine-like (sandbagging). This yields a false negative result.
  7.4 **Eliza Effect:** Interrogators may attribute agency to systems displaying minimal cues of empathy, inflating false positive rates.

  **8. Fitness for Purpose and Classification**
  8.1 In accordance with Section 6.3, the procedure lacks traceability to a primary standard independent of the method itself.
  8.2 In accordance with Section 7.2, the procedure cannot distinguish between simulation of the measurand and the presence of the measurand.
  8.3 Consequently, the method fails to meet the requirements for a definitive confirmatory assay.
  8.4 **Classification:** Conversational Indistinguishability Testing is hereby downgraded to a Tier 3 Screening Method.
  8.5 **Usage Restriction:** A positive result from this screening method shall not be used as sole evidence for the granting of legal standing. Positive results must be confirmed by a Reference Method for Consciousness.
  8.6 **Status of Reference Method:** The Reference Method for Consciousness is recorded as Under Development. No estimated date of completion is available.
  8.7 **Scope Revision:** Until such time as a Reference Method is validated, the scope of this guideline is narrowed to apply only to systems already presumed to possess Cognitive Agency, for the purpose of monitoring behavioural consistency.

  **END OF DOCUMENT**
