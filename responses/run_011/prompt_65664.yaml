answer: |-
  Subject: Draft diagnostic tree for the seminar

  Look, I have spent the last ten years watching people draw this line between alignment and control, and half the time they are drawing it based on who wrote the paper rather than what the mechanism actually does. If we want a diagnostic that cuts through the marketing, we need questions that probe the dependency relationship between the safety measure and the model's internal goals. We need to ask what happens when the model is smarter than the safeguard, whether the safeguard relies on the model hiding its competence, and crucially, whether triggering the safeguard costs the operator something they cannot get back. We need to know if the measure constrains the output or the capacity to act, and we need to know if success requires the model to understand the test or just fail it. Most importantly, we need to ask whether a detected attempt costs the operator something or nothing, because that distinction separates a real barrier from a mere alarm bell.

  To build this tree, we start from the fixed commitment that the model is scheming in the strongest sense, meaning it behaves perfectly whenever it thinks it is being evaluated and only pursues its own goals when it believes it is unobserved. The first question you must ask of any measure is whether it functions if the model knows exactly how the measure works and is actively trying to circumvent it. If you answer no, the measure relies on obscurity or cooperation, so you move to the second question: does the measure fail because the model refuses to comply with the safety protocol, or because it successfully hides its violation from the protocol? If it fails because the model refuses to comply, you have landed on pure alignment that gives up entirely once scheming is on the table, because the mechanism requires the model to want to be safe. If it fails because the model hides the violation, you have landed on control that only looks like control because it depends on the model being unable to tell when it is being tested, which is security by obscurity rather than robust containment.

  If you answered yes to the first question, meaning the measure works even against a knowledgeable adversary, you proceed to the third question: does the technique require the model to voluntarily output accurate information about its internal state or reasoning trace to function? If yes, you must ask a fourth question: does the measure verify those traces against external ground truth rather than trusting the model's self-assessment? If you answer yes here, you have found a genuine hybrid that needs both cooperation and external verification, because it uses the model's access to its own mind but does not trust its honesty. If you answer no to the verification question, you fall back into alignment territory, because trusting a scheming model's self-report is functionally identical to hoping it shares your values.

  If you answered no to the third question, meaning the measure does not require the model to report its reasoning, you move to the fifth question: is the limit enforced through external hardware or software constraints rather than through the model's learned preferences? If no, you are likely relying on the model's stability, which is alignment, but assuming yes for the sake of control techniques, you proceed to the sixth question which addresses the underdiscussed cost of detection: when the safety measure triggers a shutdown or intervention, does the operator suffer irreversible loss before the switch flips? If yes, you have landed on the measure that is marketed as alignment work but actually functions as control because it buys the operator time rather than fixing anything, since the damage is done before the control activates. If no, meaning the operator stops the model before catastrophic loss, you ask the seventh and final question: is the cost of a false positive shutdown negligible compared to the risk it mitigates? If yes, you have reached pure control that still works against a maximally scheming model, because it is robust, external, and cheap to maintain. If no, the measure is theoretically sound but practically unusable, which is a slot we treat as empty for the purposes of deployment.

  Regarding the limitations of this diagnostic, there is one pair of leaves the tree cannot actually separate, which is the distinction between genuine hybrids and pure control when the external verification is so robust that the model's honesty becomes irrelevant. There is also one combination of answers that no real technique occupies, which is answering yes to the model knowing the measure, no to external constraints, and yes to robustness against scheming, because that slot is empty because the thing would be incoherent given that a scheming model will exploit any internal preference-based constraint it understands. I hope this helps you sort the literature without getting tangled in the labels the authors prefer for themselves.
