answer: |-
  ### Brainstorming & Distinctions

  Right, let's clear the deck. The standard textbook fight is usually about whether 'knowing-how' reduces to 'knowing-that' (propositions) or stands alone as a distinct mental state (dispositions/abilities). But in a flat argument, those words are poison. The distinctions that actually do the sorting work here are: **Performance vs. Information** (does doing it matter more than understanding it?), **Access vs. Possession** (does temporary inability destroy the knowledge?), **Reliability vs. Success** (does luck count?), and **Location** (is it in the head, the hands, or the group?). I'm dropping 'gradable' (too messy for a tree) and 'collective' (interesting, but secondary to the core rust debate). I will build the tree primarily on **Access vs. Possession** (the diachronic axis) and **Performance vs. Explanation** (the synchronic axis). These cut cleanly between the view that know-how is a stored competence (survives rust, dies with paralysis), the view that it is purely propositional (survives everything if the info is there), and the view that it is purely behavioural (if you can't do it, you don't have it).

  ***

  ### The Know-How Sorting Instrument

  **Instructions:** Read each scenario and pick the answer that matches your gut reaction. Don't overthink it. There are no right answers, only different maps.

  **1. The Rusty Pianist (Current Status)**
  Your sister hasn't touched a piano in six years. She sits down now and plays badly. She says, "I've lost it." She can still look at sheet music and tell you what notes should be played, but her fingers won't obey.
  *   A) She still knows how to play; she's just out of practice.
  *   B) She doesn't know how to play anymore; knowing how means you can actually do it.
  *   C) She knows a bit, but not fully.

  **2. The Bike Manual Reader**
  Your mate has never sat on a bike. He has read every manual on balance and steering. He can watch you ride and spot exactly why you are wobbly.
  *   A) He knows how to ride a bike; he understands the rules perfectly.
  *   B) He doesn't know how to ride; he only knows facts about it.
  *   C) He knows how in theory, but not in practice.

  **3. The Inexplicable Knitter**
  Your friend's grandmother knits beautiful sweaters. If you ask her how she does it, she gets cross and says, "I just do it." She cannot explain the steps.
  *   A) She knows how to knit; the result is what matters.
  *   B) She doesn't truly know how; if she couldn't explain it, it's just a habit.
  *   C) She knows how, but it's a different kind of knowing than a teacher has.

  **4. The Paralysed Surgeon**
  A top brain surgeon develops a tremor in her hands. She can never hold a scalpel again. However, she can watch a screen and direct other surgeons perfectly, step-by-step.
  *   A) She still knows how to operate; her mind is intact.
  *   B) She doesn't know how to operate anymore; a surgeon must be able to cut.
  *   C) She knows how to teach operating, but not how to operate.

  **5. The Lucky Shot**
  A person who has never held a gun closes their eyes, fires once, and hits the bullseye.
  *   A) They know how to hit the target; they did it.
  *   B) They don't know how; that was just luck.
  *   C) They know how to fire, but not how to aim.

  **6. The Fragile Method**
  A student passes every maths test using a specific trick. The trick works perfectly now, but you know for a fact the trick will stop working next year when the equations change slightly.
  *   A) They know how to solve the equations; they succeed reliably now.
  *   B) They don't know how; their method isn't robust enough for the future.
  *   C) They know how for now, but will lose it soon.

  **7. The Perfect Robot**
  An AI plays the piano exactly like a human. It makes the same emotional choices, corrects mistakes, and learns new pieces. It has no feelings or consciousness.
  *   A) It knows how to play; behaviour is all that counts.
  *   B) It doesn't know how; knowing requires a human mind.
  *   C) It simulates knowing how, but doesn't truly know.

  **8. The Football Team**
  A team executes a complex play. No single player understands the whole pattern; each only knows their own run. But the team scores.
  *   A) The team knows how to score; no single person needs to know it all.
  *   B) Only the coach knows how; the players are just tools.
  *   C) The players know how to run, but the team doesn't know anything.

  **9. The Rusty Pianist (Recovery)**
  Back to your sister. If she practiced for one week, she would be back to her old level.
  *   A) She never lost the knowing; it was just buried.
  *   B) She lost the knowing and had to learn it again.
  *   C) She lost the skill but kept the knowledge.

  **10. The Ageing Pianist**
  An old pianist has dementia. They forget the names of pieces and cannot read music. But if you put their hands on the keys, they play perfectly by muscle memory.
  *   A) They still know how to play; it's in their hands.
  *   B) They don't know how; they don't understand what they are doing.
  *   C) They know how to move their fingers, but not how to make music.

  **11. The Injury Instructor**
  A gymnast breaks their back. They can never tumble again. They become a coach and teach champions exactly what to do.
  *   A) They still know how to tumble; they can guide others to do it.
  *   B) They don't know how to tumble anymore; they can only talk about it.
  *   C) They know how to coach, which is different from knowing how to tumble.

  **12. The Stage Fright**
  A pianist plays perfectly in practice but freezes and fails every time there is an audience.
  *   A) They know how to play; the problem is nerves, not skill.
  *   B) They don't know how to perform; knowing how includes doing it under pressure.
  *   C) They know how privately, but not publicly.

  ***

  ### Scoring Key & Positions

  Tally your answers. You won't get a perfect score, but look for the dominant pattern.

  **Mostly A's (The Intellectualist / Propositionalist)**
  *   **Position:** Knowing-how is a form of knowing information.
  *   **Profile:** You said the rusty pianist still knows (Q1, Q9), the paralysed surgeon still knows (Q4), and likely the manual reader knows (Q2).
  *   **Philosophy:** This aligns with the **Stanley & Williamson** line. If you possess the relevant information or rules, you know how, even if your body fails you. You separate the knowledge from the physical execution.
  *   **Weakness:** You might struggle to explain why the lucky shooter (Q5) doesn't know how, since they succeeded.

  **Mostly B's (The Rylean / Performer)**
  *   **Position:** Knowing-how is a complex ability or disposition to act.
  *   **Profile:** You said the rusty pianist doesn't know (Q1), the surgeon doesn't know (Q4), and the manual reader doesn't know (Q2). You likely said the knitter does know (Q3) because she performs.
  *   **Philosophy:** This is the classic **Gilbert Ryle** anti-intellectualist view. Know-how is defined by success in action. If you can't do it (or can't reliably do it), you don't know how.
  *   **Weakness:** You have to say the sister 'lost' her knowledge during six years of rust, even though she could regain it in a week. That feels like losing a file versus losing access to a file.

  **Mostly C's (The Competence / Standing State View)**
  *   **Position:** Knowing-how is a stored competence that survives temporary blocks but not permanent ones.
  *   **Profile:** You distinguished between the rusty pianist (Yes, Q1/9) and the paralysed surgeon (No, Q4). You likely said the knitter knows (Q3) but the manual reader doesn't (Q2).
  *   **Philosophy:** This is a **Hybrid or Neo-Rylean** view (similar to Bengson & Moffett or a nuanced disposition view). You treat know-how as a real state you possess, not just what you are doing right now. It survives sleep, rust, and nerves, but it dies if the physical capacity is permanently destroyed or if it was never there (manual reader).
  *   **Weakness:** Drawing the line between "temporary block" (rust) and "permanent block" (paralysis) can be tricky in edge cases.

  **The Empty Leaf (The Gambler / Pure Success View)**
  *   **Position:** Knowing-how requires only successful output, regardless of reliability or understanding.
  *   **Profile:** If you answered **A** to Q5 (Lucky Shot) while answering **B** to Q6 (Fragile Method).
  *   **Why it's empty:** Almost nobody defends this. If success is all that matters, then a random accident counts as skill. Epistemologists reject this because knowledge requires reliability, not just luck. If you landed here, you might be conflating "did it" with "knows how to do it".

  ***

  ### Logical Space Analysis

  Here is the grid behind the tree. We are looking at three core dimensions: **Performance Necessary?** (Can you know without doing?), **Explanation Necessary?** (Do you need to understand why?), and **Survives Permanent Block?** (Does paralysis destroy it?).

  | Position | Performance Necessary? | Explanation Necessary? | Survives Permanent Block? | Status |
  | :--- | :--- | :--- | :--- | :--- |
  | **Rylean (Performer)** | Yes (mostly) | No | No | **Occupied** (Common sense) |
  | **Intellectualist** | No | Yes (implicitly) | Yes | **Occupied** (Stanley/Williamson) |
  | **Competence (Hybrid)** | No (for now) | No | No | **Occupied** (Nuanced view) |
  | **Pure Theorist** | No | Yes | Yes | **Occupied** (Subset of Intellectualist) |
  | **The Gambler** | Yes (once) | No | N/A | **Empty** (Unattractive/Incoherent) |
  | **Pure Explainer** | No | Yes | Yes | **Barely Defended** (Nobody thinks reading a manual = riding) |

  **Occupied Combinations:**
  *   **Yes / No / No:** The standard view. You need to be able to do it, you don't need to explain it, and if you break your hands, you lose the skill. (Rylean/Competence mix).
  *   **No / Yes / Yes:** The Intellectualist view. You don't need to move, you need the rules, and paralysis doesn't touch the rules in your head.
  *   **No / No / No:** The Competence view. You don't need to move *now*, you don't need to explain, but permanent physical loss destroys the competence.

  **Empty Combinations:**
  *   **Yes (Luck) / No / N/A:** The Gambler. As noted, nobody claims a lucky fluke is know-how. It's incoherent to call it "knowledge" if it can't be repeated.
  *   **No / Yes / Yes (Manual Reader):** The view that the bike manual reader *fully* knows how to ride. While Intellectualists say he has the *propositional* knowledge, most concede he lacks the *practical* mastery. A position claiming he knows how *better* than the rider is virtually undefended because it violates the basic utility of the phrase "knows how to ride".

  **Limitations of the Instrument:**
  *   **The AI Branch (Q7):** This question doesn't cleanly separate epistemological views on know-how; it separates people based on their views on consciousness. A Rylean might say the Robot knows how (behaviour is all), but so might an Intellectualist (it processes rules). A "Competence" theorist might say no because it lacks biological intent. This leaf is muddy.
  *   **The Collective Branch (Q8):** This is orthogonal to the main rust/retention debate. It sorts people on individualism vs. holism, not on the nature of know-how itself.

  ***

  ### Confidence & Weakness Assessment

  **Confidence Level:** Moderate-High.
  This instrument should successfully sort your flatmate from you. It moves away from abstract labels ("disposition", "proposition") and forces choices on the specific friction points you argued about (rust vs. loss, theory vs. practice). The diachronic questions (1, 4, 9, 10, 11) are the strongest filters for separating the "Standing State" view from the strict "Performance" view.

  **The Weakest Branch:**
  **Question 4 (The Paralysed Surgeon).**
  This is the point where a careful person could land in two leaves at once.
  *   *Why:* An Intellectualist will say "Yes, she knows how" (she has the rules). A Competence theorist might also say "Yes, she knows how" (she retains the competence, even if she can't exercise it). A Rylean will say "No".
  *   *The Problem:* The distinction between the Intellectualist and the Competence theorist collapses here if the Competence theorist decides that "competence" is stored in the brain's directives, not the hands. To truly separate them, you need to ask *why* she knows how. If it's because she has the *information*, she's an Intellectualist. If it's because she has the *stored skill state*, she's a Competence theorist. Since the quiz forbids asking about "information" vs "states" (jargon), this question might group two distinct philosophical positions into the same "Yes" bucket. You might need to follow up verbally on *why* they chose Yes to separate the Stanley-Williamson fan from the Neo-Rylean.
