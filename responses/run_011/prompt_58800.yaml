prompt: |-
  Ok so I have just spent about three hours arguing with my flatmate about whether my sister still "knows how" to play the piano, and I've realised the argument was useless because none of us actually had a position, we just had intuitions about different cases. Background: my sister was a decent pianist but hasn't touched a keyboard in six years and says she's 'lost it' — she can still sight-read and tell you what's wrong with my playing, but she insists she couldn't perform. A mate of ours has never ridden a bike in his life, has read every manual going, and can diagnose exactly why I wobble. And his grandmother has Parkinson's, knits beautifully, cannot explain one single thing she does and gets genuinely cross if you ask her to. Every time I said "well she still knows how", someone else was using knows-how to mean can-do-it-right-now, and we just went in circles. So: help me build an instrument instead of an argument.

  Act as an epistemologist who has taught the knowing-how / knowing-that debate enough times to know where the textbook examples stop doing any work. Before you write anything final, start with a short brainstorming paragraph — just list the distinctions you think actually do the sorting work (is ability necessary? is propositional knowledge necessary? is know-how gradable? does it survive total loss of access? is it individual or can it be collective? does being able to explain matter? does reliability matter, or just success?) and say which of those you're going to build the tree out of and which you're dropping. Then write me a sorting quiz / decision tree, ten to twelve diagnostic questions, each one a concrete case with two or three answer options, plus a scoring key that maps patterns of answers onto named positions: the Rylean anti-intellectualist line, the intellectualist reduction of the Stanley-and-Williamson kind, the view that know-how is a standing state or competence distinct from both a mere disposition and a body of propositions, and any hybrid or deflationary option you think deserves a leaf. I also want at least one leaf that you think is genuinely empty or barely defended by anyone, with a line on why nobody is there.

  Hard rule on the questions: none of them may mention beliefs, propositions, dispositions, abilities, or any other piece of jargon, because the point is to sort people by what they say about cases, not by which label they like. My flatmate has never read any philosophy and should be able to answer all twelve. You must use these cases: the rusty pianist, the bike-manual reader who can't ride, the knitter who can't explain herself, a group case (does a research team or a football side know how to do something that no single member does?), a robot or AI that passes every behavioural test, a case where the person succeeds but only by luck or accident, a case where they succeed reliably but for reasons that would stop working tomorrow, and a lost-capacity case like a paralysed expert or a surgeon with a tremor who could still direct the operation perfectly. And since our whole fight was about loss and retention, at least three questions should sit on the diachronic axis — rust, injury, ageing — and the tree has to actually separate 'she can't any more but she still knows how' from 'she doesn't know how any more', not just gesture at it.

  Then give me the logical space behind the tree: lay the dimensions out as a grid of yes/no answers, mark which combinations are occupied by a real position, which are occupied by nobody (and say whether that's because the view is incoherent, unattractive, or just unexplored), and flag honestly any pair of leaves your questions can't really separate rather than papering over it. British English please. And no bibliography, no reading list, no citations — name positions and people where it helps, but I'm not looking anything up. Finally, tell me how confident you are that this instrument actually sorts people rather than just re-labelling them, and single out the one question or branch you're least sure about — the one where you suspect a careful person could answer in a way that lands them in two leaves at once.
