answer: |-
  **Recommendation**

  **Action:** Do not strip the nineteenth-century overpaint. Do not inpaint the face.
  **Credit Line:** "Workshop of M, seventeenth century; overpaint and signature, nineteenth century." (Two hands).
  **Display:** Hang the painting alongside a printed X-ray image and a wall text explaining the 19th-century attempt to upgrade the work, mirroring the educational approach of Case 1 but the physical preservation of Case 4.

  **Reasoning**
  Your committee's history suggests you value the **biographical integrity of the object** over aesthetic purity. This painting is no longer just a seventeenth-century workshop product; it is also a document of nineteenth-century taste and art-market fraud. Stripping the overpaint erases that chapter of the object's history. Furthermore, having your own conservator inpaint the face introduces a twenty-first-century aesthetic judgment into a seventeenth-century composition, creating a hybrid that is neither honest to the past nor truly modern (unlike Case 3, where the modern intervention was the *concept*).

  By keeping the overpaint, you preserve the 70 percent genuine seventeenth-century material without risking the unstable underlayer. You acknowledge the deception (the signature and face) without becoming complicit in it, provided the label is transparent.

  **Precedent Analysis**

  *   **Closest Analogue:** **Case 4 (The Marble Torso).** This is the governing precedent. In Case 4, you refused to strip eighteenth-century additions from an ancient fragment because the restoration itself had historical value. You credited both the ancient sculptor and the restorer. This situation is identical: a core historical object with a later, significant intervention. The principle is that the object's physical journey is part of its meaning.
  *   **Quoted Against You:** **Case 1 (The Fake M).** Opponents (or donors) will argue: "In Case 1, we exposed a fake and labeled it a fake. Here, you are keeping a fake face and a fake signature on the wall." They will claim that keeping the overpaint violates the transparency principle of Case 1.
      *   *Counter-argument:* Case 1 involved an object that was *wholly* inauthentic. This object is *partially* authentic. Case 4 is the correct parallel because it deals with a composite object where removing the later layer destroys historical evidence. Case 1 is about classification; Case 4 is about conservation ethics and historical layering.

  **The Underlying Principle**

  You have been running on a single, consistent principle: **"Contextual Truth."**

  *   **Case 1:** Truth = This is a forgery (label it).
  *   **Case 2:** Truth = This is a copy (label it).
  *   **Case 3:** Truth = This is a concept executed by fabricators (label the artist, acknowledge fabricators).
  *   **Case 4:** Truth = This is an ancient fragment restored in the 18th century (label both).
  *   **Case 5:** Truth = This is a posthumous cast (label the date).
  *   **Case 6:** Truth = This is by an assistant (refuse to label it M).

  In every instance, the museum prioritizes the *accurate narrative of the object's creation and history* over the prestige of the attribution or the visual perfection of the display.

  **Prediction: Committee and Donors**

  *   **The Committee:** They will follow **Case 4**. It is the safest curatorial decision. It avoids the risk of damaging the unstable underlayer, it avoids the ethical quagmire of modern inpainting (which Case 3 explicitly distinguishes as "artist supervision" vs. "conservator repair"), and it aligns with the "historical document" approach of Case 1 and 2.
  *   **The Donors:** They will be unhappy. They want an "M." They will cite Case 6 ("You wouldn't take a drawing if it wasn't M") to argue you should either upgrade this to M (by stripping) or deaccession it.
  *   **The Bet:** The committee will hold the line. Case 6 proves you are willing to lose a donation rather than lie about attribution. Case 4 proves you are willing to keep "imperfect" objects if their history is legible. The recommendation to keep the overpaint satisfies the "don't lie" rule of Case 6 without destroying the object.

  **The Instability Caveat**

  If the X-ray confirmation of instability in the underlayer is definitive, the philosophical debate becomes moot. Conservation ethics (do no harm) dictate that you *cannot* remove the overpaint. In this scenario, the recommendation remains the same (keep the overpaint), but the justification shifts from "historical integrity" to "physical survival." You must state in the report that removal was technically contraindicated, which shields the board from accusations of cowardice regarding the attribution.

  **The Hypothetical Test Case**

  To test whether your committee truly adheres to **"Contextual Truth"** (Case 4) or secretly prefers **"Aesthetic Purity"** (a hidden rule not yet triggered), consider this scenario:

  *   **The Object:** A 17th-century Stradivarius violin, modified in the 19th century with a longer neck and different bridge to meet modern orchestral standards. It is currently playable in a modern symphony.
  *   **The Proposal:** A donor offers to fund a restoration to return the violin to its exact 17th-century physical specifications (original neck length, bridge, string tension).
  *   **The Conflict:** Restoring it to 17th-century specs makes it unplayable in a modern orchestra without risk of damage, effectively turning it into a static sculpture. Keeping it modified preserves its 19th-century history and utility but erases its 17th-century acoustic intent.
  *   **The Split:**
      *   If the committee votes to **restore to 17th-century specs** (even if it can't be played), they prioritize **Original Authorship** over Historical Journey. This contradicts Case 4 (Torso) and suggests they *would* have stripped the painting's face if stable.
      *   If the committee votes to **keep the 19th-century modifications** and label them, they confirm **Contextual Truth/Biographical Integrity** is the ruling principle. This confirms the painting recommendation is safe.

  If they split on the violin, your painting decision is a precedent-setter, not a precedent-follower. If they agree on the violin, proceed with confidence.
