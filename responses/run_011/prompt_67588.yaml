prompt: |-
  Our museum's most popular painting might turn out to be two paintings, and the board wants a recommendation before the spring meeting. For context, here's how our collections committee has ruled on this kind of thing over the years — roughly chronological:

  1. In the eighties we bought a panel as an original by the big name of our Northern school, call him M. Dendrochronology and pigment analysis in the 2000s showed it was a twentieth-century fake. We didn't deaccession it and we didn't shove it in storage. We kept it hanging with a long wall text naming the forger, whose identity we'd run down, and explaining how he'd worked.

  2. We own an 1860s student copy after M's famous altarpiece, bought deliberately as a document of taste. Credit line reads "after M, nineteenth-century copyist." Nobody has ever pretended otherwise.

  3. Two years ago we accessioned a big contemporary installation where the artist never laid a hand on anything: a fabrication shop built every component from her files while she supervised. Sole credit to her, fabricators acknowledged in the object label.

  4. Our ancient marble torso has an eighteenth-century head, arms and nose, by a restorer who was himself a well-regarded sculptor. Somebody proposed stripping those off and showing the bare fragment. We refused. The label credits the ancient work and names the restorer.

  5. We accepted a bronze cast posthumously from the sculptor's own plaster, with the estate's authorization, on the condition that the credit line give the actual casting date instead of implying a lifetime cast.

  6. A donor offered us a drawing he wanted hung as an M. We were pretty convinced it was by M's assistant. We said we'd take it only under the assistant attribution, he walked, and we let it go.

  Now the mess. The popular picture — with us since the fifties, always catalogued honestly as a workshop copy after M — went into the studio for routine cleaning. Cross sections and X-ray say the panel, the ground and something like 70 percent of the paint really are seventeenth century, and quite possibly M's own hand or his closest assistant's. But the face of the central figure, the signature and a strip along the bottom edge are nineteenth-century overpaint, laid on by an unknown jobbing restorer, almost certainly to convert a workshop copy into a signed original. The kicker: the X-ray suggests M's original face is still partly there underneath, but abraded. So removing the nineteenth century would recover genuine old paint and leave a hole where the face belongs, and our own conservator would have to inpaint it — adding a third hand to the object, one that's alive and on our payroll.

  What should we do? Concretely: strip the later additions or keep them, and what does the credit line name — one hand, two, or three? Which of our own precedents is the closest analogue to this, and which is the one that'll get quoted against us? And what rule do you think we've actually been running all along — is there a single principle that generates 1 through 6, or two or three that just happen to agree on everything we've faced so far? If they agree on the old cases and split on this one, tell me what each predicts here and which one you'd bet the committee follows once the donors start calling. If the precedents genuinely don't decide it, be blunt about what principle we'd be adopting by choosing either way; I'd rather hear it now than discover it in the newspaper. Last thing: give me one further hypothetical object — something you could imagine being offered to us — that would cleanly separate the candidate rules from each other, so we can test ourselves on it before we've staked the collection's reputation on this one. Oh, and the X-ray suggest the underlayer is unstable in one corner, so if your recommendation assumes we can safely remove the overpaint, say what changes if we can't.
reasoning: |-
  Here's a thinking process that leads to the recommended course of action:

  1.  **Analyze the Request:**
      *   **Context:** A museum board needs a recommendation regarding a popular painting currently cataloged as a "workshop copy after M" (17th century).
      *   **New Evidence:** Scientific analysis shows 70% is 17th century (possibly M or close assistant), but the face, signature, and bottom strip are 19th-century overpaint (by a restorer trying to pass it off as an original). The original 17th-century face exists underneath but is abraded. Removing the 19th century requires modern inpainting by the museum's conservator.
      *   **Task:** Recommend whether to strip additions or keep them, determine the credit line (1, 2, or 3 hands), identify the closest/analogous precedents from the provided list (1-6), deduce the underlying principle(s) governing past decisions, predict committee behavior/donor reaction, state the new principle being adopted if precedents are ambiguous, and provide a hypothetical test case.
      *   **Constraint:** Address the instability of the underlayer (if removal is unsafe).

  2.  **Analyze the Precedents (1-6):**
      *   *Case 1 (Fake M):* 20th-century fake kept on view *as a fake* with educational text about the forgery. Principle: Transparency/Educational value of deception > Purity of collection.
      *   *Case 2 (19th C. Copy):* Bought deliberately as a copy. Credit line honest ("after M"). Principle: Honesty in attribution > Prestige.
      *   *Case 3 (Contemporary Fabrication):* Artist designed, others built. Credit to artist, fabricators acknowledged. Principle: Conceptual authorship > Physical execution.
      *   *Case 4 (Marble Torso + 18th C. Head):* Ancient body + 18th C. restoration kept together. Label credits both. Refused to strip. Principle: Historical integrity of the object's journey > Archaeological purity.
      *   *Case 5 (Posthumous Bronze):* Cast from original plaster, estate authorized. Credit line gives actual casting date. Principle: Authorization/Lineage > "Lifetime" status, but honesty about timing.
      *   *Case 6 (Drawing by Assistant):* Refused to attribute to M. Donor walked. Principle: Attributional honesty > Acquisition/Donor relations.

  3.  **Synthesize the Underlying Principles:**
      *   *Observation:* There isn't one single rigid rule (e.g., "Always strip later additions" or "Never attribute to M").
      *   *Pattern:* The museum prioritizes *narrative honesty* and *historical layering* over aesthetic purity or market value.
      *   *Key Tension:* Case 1 (Fake kept as fake) vs. Case 4 (Restoration kept as part of history).
      *   *Dominant Principle:* **"Provenance of Intervention."** The museum treats the physical object as a historical document of its own making. If an intervention (forgery, restoration, fabrication) tells a story, it is preserved but *labeled transparently*. If an intervention misleads (Case 6), it is rejected *at the point of acquisition*. Since this painting is already in the collection, Case 6 is less relevant than 1 and 4.
      *   *Secondary Principle:* **"Conservation Ethics."** Do no harm. If removal damages the original (unstable underlayer), don't remove.

  4.  **Evaluate the Current Dilemma:**
      *   *Option A: Strip 19th C. overpaint, inpaint the face.*
          *   Pros: Recovers 17th C. material. Removes deceptive signature.
          *   Cons: Destroys 19th C. historical layer (the attempt to upgrade it). Introduces 21st C. paint (modern conservator) into the aesthetic experience. Risks instability.
      *   *Option B: Keep 19th C. overpaint.*
          *   Pros: Preserves the object's history (including the fraud attempt). No modern inpainting needed on the face. Stable.
          *   Cons: Perpetuates a visual deception (looks more like an original than it is). Signature is fake.

  5.  **Match Precedents to Options:**
      *   *Closest Analogue:* **Case 4 (Marble Torso).** Ancient core + 18th C. restoration kept together. Both credited. This argues for *keeping* the 19th C. overpaint and crediting both.
      *   *Case Quoted Against:* **Case 1 (The Fake).** In Case 1, they kept a fake but labeled it a fake. Here, if we keep the 19th C. face, it looks like M, but we know it's not. If we strip it, we admit it was tampered with. Actually, **Case 6** is the danger zone: "We won't hang it as M if it's not." If we strip and inpaint, are we creating a "new" M?
      *   *The Split:* Case 4 says "Keep the layers." Case 1 says "Expose the truth."
      *   *The Real Principle:* The museum values the *object's biography*. The 19th-century overpaint *is* part of the biography (the attempt to pass it off). Removing it erases that chapter. However, the signature is actively deceptive.

  6.  **Develop the Recommendation:**
      *   *Action:* **Do not strip the 19th-century overpaint.** (Unless unstable, see below).
      *   *Reasoning:* Aligns with Case 4 (Torso). The 19th-century intervention is historically significant (shows taste/fraud trends). Removing it creates a hybrid 17th/21st-century object (Case 3 logic doesn't apply because the modern conservator isn't the 'artist').
      *   *Credit Line:* "Workshop of M, with 19th-century overpaint and signature." (Two hands + time periods).
      *   *Labeling:* Explain the X-ray findings. Show the X-ray next to it (like Case 1's wall text).
      *   *Instability Caveat:* If the underlayer is unstable, stripping is *physically* impossible without risking the 70% genuine paint. This trumps all aesthetic/philosophical arguments. Conservation first.

  7.  **Identify the "Hidden" Rule:**
      *   Is there one rule? "Honesty about Authorship and History."
      *   Case 1: Honest about it being a fake.
      *   Case 2: Honest about it being a copy.
      *   Case 3: Honest about fabrication.
      *   Case 4: Honest about restoration.
      *   Case 5: Honest about casting date.
      *   Case 6: Honest about assistant vs. master.
      *   *Application here:* Honesty means acknowledging the 19th-century fraud *as part of the object*, not erasing it to create a "cleaner" lie (a 17th-century looking face painted in 2024).
      *   *Prediction:* The Committee will follow Case 4 (Torso). Donors might complain it's not a "real M," but Case 6 shows the museum will walk away from donor pressure to lie.

  8.  **Drafting the Response:**
      *   *Structure:* Recommendation -> Credit Line -> Precedent Analysis -> Underlying Principle -> Donor/Committee Prediction -> Instability Caveat -> Hypothetical Test Case.
      *   *Tone:* Professional, curatorial, decisive, nuanced.

  9.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, check Case 1 again.* Case 1 was a 20th-century fake. They kept it. Why? Educational value.
      *   *Check Case 4 again.* 18th-century restoration on ancient marble. Kept it. Why? Historical integrity of the object's survival.
      *   *The Conflict:* If we strip the 19th C., we are essentially doing the opposite of Case 4. If we keep it, we align with Case 4.
      *   *The "Three Hands" issue:* If we strip and inpaint, we have 17th C. (body), 19th C. (removed), 21st C. (face). That's messy. If we keep, we have 17th C. (body) + 19th C. (face). That's cleaner historically.
      *   *The Signature:* The signature is 19th C. It *must* be addressed. In Case 4, the head was credited. Here, the signature should be neutralized or labeled as fraudulent.
      *   *Hypothetical:* Need something that pits "Historical Layering" against "Aesthetic Integrity." Maybe a digital work? Or a musical instrument? Let's go with a musical instrument modified for modern playability.

  10. **Final Polish:** Ensure the instability condition is addressed clearly. (If unstable, removal is off the table regardless of philosophy).

      *(Self-Correction on the Hypothetical)*: A Stradivarius modified in the 19th century to modern specs. Do you restore it to original specs (losing 19th C. history) or keep it playable (keeping 19th C. mods)? That mirrors the painting dilemma well.

      *(Refining the Principle)*: The principle is "Biographical Integrity." The object is a document of its own physical history. Erasing a failed attempt to upgrade it (the 19th C. overpaint) erases a chapter of its biography.

      *(Credit Line)*: Needs to be specific. "Workshop of M, 17th century; overpaint and signature, 19th century."

      *(Donor Reaction)*: Donors want "M." They will hate "Workshop + 19th C." But Case 6 proves the museum won't lie for donors.

      *(Committee Prediction)*: They will vote to keep the overpaint. It's safer (conservation), historically richer (Case 4), and avoids the ethical minefield of modern inpainting creating a "new" face (Case 3 distinction).

      *(Wait, one nuance)*: The prompt asks about the credit line naming "one hand, two, or three."
      *   Keep overpaint: Two hands (Workshop + Restorer).
      *   Strip & Inpaint: Three hands (Workshop + Restorer [removed but historically present] + Conservator). Or effectively Two (Workshop + Conservator).
      *   Recommendation: Name Two (Workshop + Restorer).

      *(Final check on Instability)*: If unstable, you *cannot* strip. So the recommendation defaults to "Keep." I need to make sure I distinguish between the philosophical recommendation and the technical constraint. I will frame the philosophical recommendation as "Keep," which aligns with the technical constraint if unstable.

      *(Wait, re-reading the prompt)*: "If your recommendation assumes we can safely remove the overpaint, say what changes if we can't."
      Okay, so I should make a recommendation based on the *principle* first, then address the technical constraint.
      Actually, conservation ethics usually trump curatorial philosophy. If it's unstable, you don't touch it. I should make the recommendation conditional or state that the instability makes the decision for us.
      Better approach: Recommend *against* removal based on precedent (Case 4), which conveniently aligns with the safety risk. If the risk weren't there, I'd still recommend against removal based on Case 4. If the risk *is* there, it's mandatory.

      Let's refine the "Principle." Is it one principle?
      Cases 1, 2, 4, 5, 6 all scream "Transparency."
      Case 3 is "Conceptual Authorship."
      Case 4 is "Historical Palimpsest."
      The unifying theme is **"Contextual Truth."** We don't hide the history of the object.
      Stripping the 19th C. paint hides the history of the fraud.
      Inpainting the face creates a new fiction (a complete 17th C. face).
      So, "Contextual Truth" dictates keeping the 19th C. paint but labeling it.

      Okay, ready to write.

      *Hypothetical:* A 17th-century violin modified in the 19th century to modern standards. Do we restore it to 17th-century spec (unplayable in modern orchestra, loses 19th C. history) or keep it modified (loses original spec, keeps history)? This tests "Original State" vs. "Historical Journey."

      *Wait, one more check:* The prompt asks "Which of our own precedents is the closest analogue to this, and which is the one that'll get quoted against us?"
      Closest: Case 4 (Torso).
      Quoted Against: Case 1 (Fake). Someone will say "In Case 1 we exposed the fake. Here we are keeping the fake face." Counter-argument: Case 1 was *entirely* fake. This is *partially* real. Case 4 is better.
      Actually, Case 6 might be quoted against us. "We wouldn't take a drawing as M if it was an assistant. Why hang this as M if the face is 19th C?"
      I'll stick with Case 4 as closest, Case 1 as the rhetorical weapon opponents will use (misapplying it).

      *Wait, credit line:* "One hand, two, or three?"
      If we keep: Workshop (17th) + Restorer (19th). Two hands.
      If we strip: Workshop (17th) + Conservator (21st). Two hands (but different ones).
      If we count the removed layer: Three.
      I'll recommend crediting the two visible hands (Workshop + Restorer).

