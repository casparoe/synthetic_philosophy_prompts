answer: |-
  **MEMORANDUM**

  **TO:** Elections Division Panel
  **FROM:** Staff Counsel
  **SUBJECT:** Draft Procedure for "Unity of Subject Matter" Review (Swiss Model Adaptation)
  **DATE:** October 26, 2023

  ### I. The Procedure

  This procedure is designed to operationalize the Deputy Director's proposed "Unity of Subject Matter" standard within our existing fifteen-day statutory window. It distinguishes between **Staff Review** (objective, research-based) and **Panel Determination** (subjective, judgment-based).

  **Step 1: Facial Single-Subject Compliance (Staff)**
  *   **Question:** Does the petition text explicitly address more than one top-level topic (e.g., taxation AND criminal justice)?
  *   **Sufficient Answer:** A map of the petition's sections showing they all fall under the petition's stated title.
  *   **Termination (Reject):** If sections are facially unrelated (e.g., a section on dog licensing attached to a section on income tax). *Note: Under current case law, this almost never happens.*
  *   **Hand-off:** If facially single-subject, proceed to Step 2.

  **Step 2: Functional Interdependence (Staff)**
  *   **Question:** Do the operative sections of the measure require one another to function, or can they be severed without destroying the measure's operational logic?
  *   **Sufficient Answer:** A "Severability Analysis." Staff removes Section A; does Section B still make sense? If yes, they are not functionally interdependent.
  *   **Termination (Pass):** If the measure is a single coherent statute (e.g., a tax rate and the collection mechanism).
  *   **Hand-off:** If the measure contains distinct policy levers that *could* stand alone (e.g., funding for X and regulation of Y), proceed to Step 3.

  **Step 3: The Voter's Dilemma / Logrolling Test (Panel)**
  *   **Question:** Does the combination of distinct policy levers force a voter to accept a provision they oppose to secure a provision they support? (i.e., Is there a "poison pill" or a "sweetener" unrelated to the core mechanism?)
  *   **Sufficient Answer:** A finding on whether the connection between the levers is **material** (functional) or **political** (coalition-building).
  *   **Termination (Reject):** If the connection is purely political (e.g., "We added tenant counsel to get the police union to support the safety bill").
  *   **Hand-off:** If the connection is arguable but not clear, proceed to Step 4.

  **Step 4: Operational Coherence (Staff)**
  *   **Question:** Does the measure provide a mechanism for implementation, or does it mandate a result without a means?
  *   **Sufficient Answer:** Identification of the enforcing agency and the funding source within the text.
  *   **Termination (Pass):** If a mechanism exists, even if flawed. *Staff cannot reject based on efficacy.*
  *   **Hand-off:** If the measure is a mandate without a mechanism, this is a **Panel Judgment** on whether the lack of machinery violates "Unity" (by making the subject matter advisory rather than legislative).

  **Step 5: Final Panel Vote (Panel)**
  *   **Question:** Considering the Staff findings, does the measure embrace a unified subject matter with a genuine material connection?
  *   **Standard:** 2-1 Majority.
  *   **Constraint:** Panel members must state on the record if their vote is based on policy preference (forbidden) or structural unity (required).

  ***

  ### II. Application to Hypothetical Petitions

  I have run the three pending petitions through this workflow.

  #### Petition 1: "Safe-and-Stable-Communities Act"
  *   **Content:** Increases police hiring/overtime funding + Establishes right to counsel for tenants facing eviction.
  *   **Step 1 (Facial):** **Pass.** Both fall under the broad title of "Community Safety/Stability."
  *   **Step 2 (Interdependence):** **Fail.** Police hiring functions independently of tenant legal aid. Severing one does not break the other.
  *   **Step 3 (Voter's Dilemma):** **Panel Hand-off.** This is the critical failure point. A voter may support police funding but oppose tenant counsel (or vice versa). The connection is "Safety," but the *means* are unrelated policy levers (Law Enforcement vs. Civil Legal Aid). Under the Swiss standard, this is classic logrolling.
  *   **Step 4 (Coherence):** **Pass.** Both sections have appropriation mechanisms.
  *   **Outcome:** **REJECT.**
  *   **Analysis:** This measure fails the "Functional Interdependence" and "Voter's Dilemma" steps. The common purpose ("Safety") is too broad to satisfy the "material connection" requirement. The parts are politically bundled, not functionally unified.
  *   **Risk:** This is likely the outcome you "don't want." Rejecting this invites an immediate appeal. Given our state's "reasonably germane" precedent, the Supreme Court will likely overturn this rejection, ruling that "Safety" is a sufficient unifying theme. You will expend 15 days to lose in court.

  #### Petition 2: "Rival Measure with Sunset"
  *   **Content:** Identical to a certified rival petition, but includes a clause sunsetting the law after four years.
  *   **Step 1 (Facial):** **Pass.** Single subject (the underlying policy).
  *   **Step 2 (Interdependence):** **Pass.** The sunset clause is integral to the duration of the policy.
  *   **Step 3 (Voter's Dilemma):** **Pass.** The dilemma here is policy choice (Permanent vs. Temporary), not logrolling of unrelated subjects.
  *   **Step 4 (Coherence):** **Pass.** Mechanism is identical to the certified rival.
  *   **Outcome:** **CERTIFY.**
  *   **Analysis:** This passes all unity tests. The conflict is statutory (the tiebreak provision), not structural. The "Unity" test does not police strategic filing, only subject coherence.

  #### Petition 3: "Right to Clean Air"
  *   **Content:** Declares right to clean air + Directs legislature to appropriate "whatever money is needed" + No implementing machinery.
  *   **Step 1 (Facial):** **Pass.** Single subject (Clean Air).
  *   **Step 2 (Interdependence):** **Pass.** The right and the funding are linked.
  *   **Step 3 (Voter's Dilemma):** **Pass.** No unrelated levers are combined.
  *   **Step 4 (Coherence):** **Panel Hand-off.** The measure lacks implementing machinery. However, under the "Merits Firewall," Staff cannot reject a measure because it is vague or difficult to enforce. That is a constitutional question for the courts post-election.
  *   **Outcome:** **CERTIFY.**
  *   **Analysis:** While this is bad policy, it is a *unified* subject. The lack of machinery does not violate "Unity of Subject Matter," only potentially "Operability" (which is not our test). To reject this would require crossing the merits line.

  ***

  ### III. Confidence and Appellate Risk Assessment

  **Confidence in Assertions:**
  I am **highly confident** in the procedural structure (Steps 1, 2, and 4). These rely on textual analysis and severability logic that can be documented objectively. I am **moderately confident** in the outcome for Petition 2 and 3; these are clear passes under any reasonable standard.

  **Confidence in Arrangements:**
  I am **low confidence** in the survivability of the **Step 3 (Voter's Dilemma)** analysis on appeal. This step requires the Panel to impute intent to the petitioners ("Is this connection political or material?") and speculate on voter psychology ("Would a voter be forced into a dilemma?").

  **The Weakest Link:**
  **Step 3 is the single step least likely to survive appellate review.**
  Our State Supreme Court has historically deferred to the Legislature on policy bundling. By asserting that a "political connection" is insufficient where a "broad purpose" exists, we are effectively tightening the "reasonably germane" standard without statutory authority. If we reject Petition 1 based on Step 3, the Court will likely rule that determining whether two policies are "germane" is a legislative question, not an administrative one. We risk being reversed for making a political judgment disguised as a procedural ruling.

  **Recommendation:**
  If we adopt this procedure, we must acknowledge that Petition 1 will be litigated. If the goal is to reduce court interventions, this procedure may achieve the opposite result by creating a new grounds for appeal that the current "reasonably germane" standard does not support.
