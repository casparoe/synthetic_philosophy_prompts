answer: |-
  1. **Brainstorming**
  Do the views actually diverge here? Reductionism demands positive reasons (evidence of reliability); Anti-reductionism demands none (presumptive right). Case A offers high evidence but no address (overheard). Case B offers address but low evidence (circular verification). If Anti-reductionism requires address for "testimony" proper, Case A isn't testimony, so the view doesn't apply. If Reductionism requires non-circular evidence, Case B fails. The confound is real: Evidence vs. Address. A diagnostic case requires isolating these. If students notice the theories individuate the belief-source differently (inference vs. acceptance), they can argue the debate is partly verbal. Top marks go to spotting that the disagreement might be structural, not just about justification conditions.

  2. **The Exam Question**

  **Answer ONE of the following three compulsory questions. Spend roughly 40 minutes and write about 700 words.**

  Consider two cases of belief formation via testimony.

  **Case A.** Nadia is a hospital pharmacist. Tomas, her assistant, has verified her calculations against lab results for eight months; she is invariably correct. One evening, Tomas overhears Nadia alone, dictating a corrected dose into a phone app. She does not know he is there. He forms the belief based on this overheard statement. It is correct.

  **Case B.** Priya reads statements at government briefings. She is conscientious and corrects errors. Dev, a journalist, has attended dozens of briefings. He independently verified three claims; all held. He cannot verify the rest. His belief that the office has rigorous checking routines rests solely on what staff say. He forms a belief based on today's briefing.

  Using the framework of reductionism and anti-reductionism about testimonial justification:

  (a) Determine whether each view predicts the believer is justified in Case A and Case B.
  (b) Identify the two distinct variables differing between Case A and Case B that complicate a direct comparison.
  (c) Construct a hypothetical scenario holding one of these variables fixed to isolate the theoretical disagreement.
  (d) Conclude whether a genuinely diagnostic case between the two views is possible, or if the debate is partly verbal due to how the views individuate the belief-forming process.

  3. **Model Answer**

  Reductionism holds that testimonial justification reduces to perception and inference, requiring positive reasons for trusting the speaker. Anti-reductionism holds that testimony is a basic source of justification, granting a presumptive right to believe absent defeaters.

  In Case A, Reductionism predicts Tomas is justified. He possesses strong inductive evidence of Nadia's reliability based on eight months of verification. The source of justification is his inference from past success to current truth. Anti-reductionism is less clear. While there are no defeaters, some anti-reductionist accounts require the statement to be addressed to the hearer to count as testimony. Since Nadia did not address Tomas, an anti-reductionist might deny this is testimonial justification at all, or claim justification holds simply because he accepted an assertion without defeaters.

  In Case B, Anti-reductionism predicts Dev is justified. He has no defeaters regarding Priya's honesty or competence, so the presumptive right applies even to the unchecked claims. Reductionism predicts Dev is unjustified regarding the unchecked claims. His evidence for the office's reliability is circular (based on testimony from the office itself), and he lacks independent verification for the specific claims. Thus, he lacks the positive reasons Reductionism requires.

  The complication in comparing these cases is that they differ along two dimensions: independent evidence and address. Case A has high evidence but no address. Case B has address but low independent evidence. A naive comparison suggests Reductionism fits A and Anti-reductionism fits B, but this conflates the conditions for justification with the conditions for testimony.

  To isolate the disagreement, we must hold address fixed. Consider Case C: Dev attends the briefing (addressed) but has zero prior evidence of Priya's reliability (no verification). Anti-reductionism says Dev is justified (presumptive right). Reductionism says Dev is unjustified (no positive reasons). This isolates the core conflict.

  However, a deeper issue remains. Reductionists individuate the belief-forming process as "inference from reliability," while anti-reductionists individuate it as "acceptance of assertion." In Case A, Reductionists see a justified inference; Anti-reductionists might see no testimony. In Case B, Anti-reductionists see justified acceptance; Reductionists see a flawed inference. Because the theories disagree on what constitutes the relevant process, they often talk past each other. Therefore, no purely diagnostic case exists without first agreeing on whether testimony requires address. The debate is partly verbal; the disagreement is not just about when justification occurs, but about how to describe the source of the belief. Until the individuation of the process is settled, the theories offer compatible descriptions of different phenomena rather than competing explanations of the same one.

  4. **Marking Scheme (Out of 25)**

  1.  **Correct Application to Case A (5 marks):** Must state Reductionism justifies (evidence) and note Anti-reductionism's potential issue with lack of address.
      *   *Typical botch:* Claims Anti-reductionism definitely justifies Case A without noting the address condition.
  2.  **Correct Application to Case B (5 marks):** Must state Anti-reductionism justifies (presumption) and Reductionism denies justification (circular/insufficient evidence).
      *   *Typical botch:* Argues Dev is justified on Reductionist grounds because "three claims checked" is enough evidence.
  3.  **Identification of Confound (5 marks):** Must explicitly identify "independent evidence" and "address" as the two confounding variables.
      *   *Typical botch:* Identifies only one variable (e.g., just "evidence") or vague terms like "trust."
  4.  **Isolation of Variables (5 marks):** Must propose a scenario holding one variable fixed (e.g., Address + No Evidence) to test the views.
      *   *Typical botch:* Describes a new case but fails to explain how it isolates the specific theoretical disagreement.
  5.  **Verdict on Diagnostic Potential (5 marks):** Must commit to whether a diagnostic case is possible or if the debate is verbal/structural regarding process individuation.
      *   *Typical botch:* Hedges with "both views have strengths" without answering the specific question about diagnostic potential.

  5. **A vs. B Distinction**

  A B-grade answer will correctly apply the labels to the cases (Moves 1 & 2) and identify the confound (Move 3), but will treat the theories as simply having different "requirements" for justification. An A-grade answer will execute Moves 4 & 5 by recognizing that the theories disagree on the metaphysics of the source itself (individuation of process), not just the epistemic conditions. The A candidate will commit to the conclusion that the debate is partly verbal or structurally blocked, whereas the B candidate will attempt to force a verdict on justification without resolving the prior disagreement about what counts as testimony.
