          1.  Analyze Case A (Reductionism says justified (evidence); Anti-reductionism says maybe unjustified (no address/assumption of trust)).
          2.  Analyze Case B (Reductionism says unjustified/weak (circular evidence); Anti-reductionism says justified (presumptive right)).
