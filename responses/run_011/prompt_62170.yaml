          *   Deliverable 3: Model Answer.
          *   Deliverable 4: Marking Scheme.
          *   Deliverable 5: A vs. B distinction.
      *   **Key Philosophical Challenge:** The user suspects the debate might be verbal or that the cases confound variables (addressee status vs. independent evidence). The question must force students to disentangle this. The model answer must commit on whether a diagnostic case is possible.

  2.  **Brainstorming (Deliverable 1):**
      *   Do reductionism and anti-reductionism actually differ here? Reductionism says testimonial justification reduces to perception + inference (needs positive reasons). Anti-reductionism says testimony is a basic source (presumptive right, needs no positive reasons unless defeaters exist).
      *   Case A (Nadia/Tomas): Tomas has *strong* independent evidence of reliability (8 months of checking). But he's not the addressee (overhearing). Reductionists love the evidence. Anti-reductionists might worry about the lack of address (is it testimony if not addressed?).
      *   Case B (Priya/Dev): Dev has *weak* independent evidence (only 3 checked, rest circular via office staff). But he is the addressee (briefing). Reductionists might say justification is weak due to lack of independent grounds for the unchecked claims. Anti-reductionists say justification is strong because it's accepted testimony without defeaters.
      *   The Confound: Case A has High Evidence/No Address. Case B has Low Evidence/High Address.
      *   If students just say "Reductionism fits A, Anti-reductionism fits B," they miss the point. They need to hold one variable fixed.
      *   Crucial insight: If Anti-reductionism requires *address* (some versions do, some don't), then A isn't testimony. If Reductionism requires *independent evidence*, B is shaky.
      *   The "Verbal" angle: Maybe the disagreement is about what counts as the "source." If Reductionists define the process as "inference from reliability" and Anti-reductionists as "acceptance of assertion," they might agree on the outcome but disagree on the label.
      *   Decision for Model Answer: Commit that the debate is partially verbal/structural because the cases confound the very features (address vs. evidence) that define the theories' conditions. A truly diagnostic case requires isolating address from evidence, which is hard.

  3.  **Drafting the Exam Question (Deliverable 2):**
