  6.  **Drafting A vs. B Distinction (Deliverable 5):**
      *   Focus on specific moves.
      *   B answers describe the views. A answers manipulate the variables.
      *   B answers say "both plausible." A answers say "here is the structural flaw."

  7.  **Review and Refine:**
