answer: |-
  | round | what students are told | what each student submits | how it's scored | the moment they're supposed to notice |
  | :--- | :--- | :--- | :--- | :--- |
  | **1: The Baseline** | "We have a standard coin. The objective Chance of Heads is stipulated as 0.5. You have no other information." | A credence $c$ between 0 and 1 for "The next toss is Heads." | **Brier Score:** $1 - (outcome - c)^2$. (Heads=1, Tails=0). Max points = 1. | When the class average converges tightly around 0.5. They realize the "rational" move is to match the stipulated Chance. |
  | **2: The Oracle** | "The Chance is still 0.5. However, I am handing you a sealed note from a **Perfect Oracle**. It reveals the actual outcome of this toss before it happens. Open it." (Notes all say HEADS). | A credence $c$ between 0 and 1 for "The next toss is Heads." | **Brier Score:** Same as Round 1. Points accumulate to a leaderboard. | When they all submit $c=1.0$ (or near 1.0) to maximize points. They realize they must **violate** the Chance (0.5) to win. The "Match Chance" rule is not absolute. |
  | **3: The Underminer** | "The Chance is 0.5. **But:** The Department of Physics stipulates that if we observe 10 Heads in a row, the coin is retroactively classified as 'Biased' (Chance $\neq$ 0.5). We have just seen 9 Heads." | A credence $c$ for "The 10th toss is Heads." | **Brier Score:** Same as Round 1. | When they hesitate. If they trust Chance=0.5, $c=0.5$. But if Heads occurs, the Chance hypothesis is **destroyed**. The outcome itself determines the truth of the Chance claim. Admissibility is broken. |

  ### Timeline and Materials

  **Materials:**
  *   14 "Credence Slips" per student (pre-printed with spaces for Round 1, 2, 3).
  *   14 Envelopes for Round 2 (each containing a slip saying "HEADS").
  *   A visible coin (large foam prop or projected image).
  *   Projector for displaying the Brier Score formula and the Leaderboard.
  *   Timer.

  **Timeline (80 Minutes):**

  *   **0:00–0:10 (Intro & Mechanics):** Explain the Brier Score. Emphasize that honesty (submitting true credence) is the only way to maximize points. Do a quick practice calculation on the board. Distribute Round 1 slips.
  *   **0:10–0:25 (Round 1):** Collect slips. Toss the coin (let it land Heads). Calculate scores live. Display the class average credence. It should be near 0.5. Ask: "Why did you choose 0.5?" (Answer: "Because the Chance is 0.5."). Write "PP: Credence = Chance" on the board.
  *   **0:25–0:45 (Round 2):** Distribute envelopes. Give them 2 minutes to read. Collect slips. Toss the coin (it must land Heads to match the Oracle—use a trick coin or simply stipulate the outcome for the sake of the game logic, or ensure the note matches the toss). Calculate scores. Those who wrote 0.5 lose points; those who wrote 1.0 win max points. Ask: "Did you violate the Principle we just wrote on the board?" (Answer: Yes.). Introduce the term **Inadmissible Evidence**.
  *   **0:45–1:05 (Round 3):** Explain the "Retroactive Veto" rule clearly. This is the hardest part. Ensure they understand that a Head on toss 10 makes the proposition "Chance=0.5" false. Collect slips. Do not toss the coin yet (keep the tension). Calculate hypothetical scores based on both outcomes.
  *   **1:05–1:20 (Debrief):** Sit down. Move from the game mechanics to the philosophy.

  ### Debrief and Philosophical Payoff

  **The Debrief Script:**
  Start by asking Round 2 winners why they ignored the Chance. They will say, "I knew the outcome." You then formalize this: The Principal Principle (PP) states $C(A | Ch(A)=x \& E) = x$. In Round 1, $E$ was empty. In Round 2, $E$ was the Oracle's note. The PP only holds if $E$ is **admissible**. The Oracle's note is inadmissible because it gives information about the *outcome* directly, not just the *chance*.

  Move to Round 3. This is the **Undermining Future** problem (Lewis). The outcome of the toss (Heads) is compatible with the Chance being 0.5 (it's possible), but if it happens, it falsifies the hypothesis that the Chance is 0.5 (due to the retroactive veto). This means the truth of the Chance hypothesis depends on the future outcome. If the Chance hypothesis depends on the future, can we condition on it in the present? This suggests the PP needs revision (The "New Principle") or that Humean chances are problematic.

  **Settled vs. Contested Claims:**
  *   **Settled (Textbook Consensus):**
      *   The PP is a normative constraint on rational credence, not a descriptive law of psychology.
      *   The PP requires an **Admissibility Clause**. Not all evidence can be conditioned on alongside Chance.
      *   Credence should track Chance *in the absence* of inadmissible evidence.
  *   **Contested (Live Debates):**
      *   **The Definition of Admissibility:** Lewis defined it temporally (information about the past/present is admissible; future is not). Others argue it's about the *kind* of information (causal vs. non-causal). *Tell students: "There is no agreement on a clean definition."*
      *   **Humean Supervenience:** If chances supervene on patterns of outcomes (as in Round 3), "Undermining Futures" are possible. Lewis thought this broke the PP; others think it requires the "New Principle." *Tell students: "We do not know if the PP holds for Humean chances."*
      *   **The New Principle (NP):** Some argue we should condition on the conditional chance ($C(A | Ch(A|E)=x) = x$) rather than the unconditional chance. This is technically superior but computationally impossible for humans.

  ### Predictable Failures and Limitations

  **What Will Go Wrong:**
  1.  **Scoring Confusion:** In Round 1, 2–3 students will treat the Brier Score like a betting market (trying to "beat the house" rather than minimize error). They might submit 0 or 1 randomly. *Mitigation:* Walk through the math of the Brier Score explicitly before Round 1. Show that if your true belief is 0.5, submitting 0.5 yields a higher expected score than submitting 0.8.
  2.  **Round 3 Paralysis:** The logic of the "Retroactive Veto" is dense. Students may freeze or treat it as a Gambler's Fallacy problem ("Tails is due"). *Mitigation:* Write the conditional logic on the board: $Heads \rightarrow Chance \neq 0.5$. $Tails \rightarrow Chance = 0.5$ (possibly). Ask: "Does the hypothesis 'Chance=0.5' survive the evidence?"
  3.  **Risk Aversion:** Even with fake points, students might "hedge" (submit 0.7 instead of 1.0 in Round 2). *Mitigation:* Emphasize that this is a seminar exercise, not a financial simulation. The points are for "philosophical accuracy."

  **What the Game Cannot Reproduce:**
  1.  **Metaphysical vs. Epistemic:** The game uses an "Oracle Note" (epistemic certainty) to simulate "Inadmissibility" (metaphysical constraint). In the real PP, inadmissible evidence isn't just "knowing the future"; it's information that bears on the chance *mechanism* itself (e.g., time travel, crystal balls). The game simplifies this to "reliable prediction."
  2.  **The Nature of Chance:** In the game, "Chance" is a stipulation by the instructor. In reality, Chance is a metaphysical property (propensity, frequency, or best system). The game cannot make students *feel* the metaphysical weight of Chance, only the normative weight of the instruction.
  3.  **Self-Locating Belief:** The PP struggles with indexical information (e.g., "I am the winner"). The game does not capture the "Sleeping Beauty" style complications that often accompany admissibility debates.

  **Instructor Note:**
  If Round 3 gets too bogged down, cut the scoring calculation. The point of Round 3 is not the points, but the *hesitation*. If they hesitate to write 0.5, the lesson has landed. The discomfort *is* the data.
