prompt: |-
  I'm teaching a third-year philosophy of probability seminar — 14 students, one 80-minute slot — and I want them to run into the Principal Principle rather than hear me describe it. Design a betting game where they post prices for coin tosses and get scored (points or fake money, no real cash), rigged so that the principle they all cheerfully endorse in round 1 is one they personally violate for profit in round 2. The twist I want in round 2: they're handed a note about the upcoming toss that is stipulated to be perfectly reliable, and it's worth real points to follow it — which is exactly the kind of evidence the principle was supposed to make them screen off. Then a round 3 where the results they've been accumulating start squeezing the chance hypothesis itself: a possible run of outcomes that has positive chance on the hypothesis, yet would wreck it if it actually came in.

  They should come away seeing (a) that the principle is a constraint on credence and not a money-making policy, and (b) that the admissability clause is doing all the work and nobody has a clean grip on it.

  Give me the game as a table with exactly these columns: round | what students are told | what each student submits | how it's scored | the moment they're supposed to notice. Then the debrief, materials, and timeline in prose after the table. Also tell me what predictably goes wrong the first time I run this and what part of the idea the game just can't reproduce. In the debrief, please flag which claims are settled among people who work on this and which are genuinely contested — I don't want to hand my students a live debate dressed up as the textbook view.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Third-year philosophy of probability seminar, 14 students, 80 minutes.
      *   **Goal:** Students discover the Principal Principle (PP) through a betting game, not lecture.
      *   **Structure:** Three rounds of betting.
          *   Round 1: Standard credence betting (establish baseline).
          *   Round 2: "Rigged" with reliable evidence (violating PP intuition for profit).
          *   Round 3: Outcomes squeezing the chance hypothesis (undermining the chance claim itself).
      *   **Learning Outcomes:** (a) PP is a constraint on credence, not a money-making policy; (b) Admissibility is the crux and is murky.
      *   **Format:**
          1.  Table with columns: Round | What students are told | What each student submits | How it's scored | The moment they're supposed to notice.
          2.  Prose section: Debrief, Materials, Timeline.
          3.  Prose section: Predictable failures & limitations.
          4.  Debrief requirement: Distinguish settled vs. contested claims.

  2.  **Deconstruct the Principal Principle (PP):**
      *   Lewis's PP: $C(A | XE) = x$, where $X$ is the proposition that the chance of $A$ is $x$, and $E$ is admissible evidence.
      *   The core tension: Credence should match chance *unless* you have inadmissible evidence (like crystal balls or time travel).
      *   The user's specific twist: Round 2 needs to force them to *violate* the intuitive reading of PP (match chance) to make points, because they have "inadmissible" evidence (a reliable note). Round 3 needs to show that long-run frequencies can undermine the chance hypothesis itself (Humean supervenience tension).

  3.  **Drafting the Game Mechanics:**

      *   *Round 1 (Baseline):* Fair coin. Chance = 0.5. Students set prices for "Heads". Scoring rule needs to be proper (e.g., Brier score or Log score) to encourage honesty. Let's use a simplified betting market or Brier score. Brier is easier to explain quickly.
          *   *Idea:* They submit a credence $c$. Payoff is $1 - (outcome - c)^2$.
          *   *Goal:* They should all say 0.5.

      *   *Round 2 (The Twist):* The coin is still "chance 0.5" (stipulated), *but* they get a note saying "HEADS". The note is stipulated as perfectly reliable (infallible oracle).
          *   *Conflict:* PP says $C(Heads | Chance=0.5 \& Note=Heads) = 0.5$ (if Note is admissible). But rationality demands $C=1$.
          *   *Scoring:* Same as Round 1. To maximize points, they must set $c=1$.
          *   *Realization:* They violated the simple version of PP ("Match Chance!") to win. Why? Because the evidence wasn't admissible.

      *   *Round 3 (Undermining):* This is trickier. Lewis's "Undermining Futures." A sequence of outcomes that is possible by the chance theory but, if it occurs, proves the chance theory wrong (e.g., a Humean mosaic that implies different chances).
          *   *Scenario:* A long run of Heads. Say, 10 tosses. Chance is stipulated 0.5.
          *   *Task:* Set credence for the *next* toss after seeing 9 Heads.
          *   *Conflict:* Gambler's fallacy vs. Independence. But the prompt asks for "outcomes... that would wreck [the hypothesis] if it actually came in." This points to *Undermining Futures*.
          *   *Simplification for 80 mins:* Let's make it about the *hypothesis* itself. The "Chance" is a property of the coin. If we see 100 Heads, the hypothesis "Chance(Heads)=0.5" becomes implausible.
          *   *Refinement:* Let's stick closer to Lewis. The chance function $Ch$ is defined by the best system. A future sequence $F$ has $Ch(F) > 0$, but if $F$ occurs, the best system changes, so $Ch$ changes.
          *   *Game version:* We are testing the hypothesis $H$: "This coin has Chance(Heads) = 0.5".
          *   Round 3: They bet on whether the *Hypothesis* is true after a specific run. Or, they bet on the next toss, but the scoring depends on the Hypothesis remaining true.
          *   *Better approach for the prompt:* "Round 3 where the results they've been accumulating start squeezing the chance hypothesis itself."
          *   *Mechanism:* They are told the coin *might* be biased. They start with Prior $P(Chance=0.5) = 0.9$. They see a run of Heads. They must update their credence in the *Chance Hypothesis* itself.
          *   *Wait, the prompt says:* "a possible run of outcomes that has positive chance on the hypothesis, yet would wreck it if it actually came in." This is the definition of an Undermining Future.
          *   *Implementation:* Tell them: "The Chance is 0.5. But if we get 10 Heads in a row, the University will declare the coin 'Broken' (Chance $\neq$ 0.5)."
          *   *Submission:* Price for "Heads on Toss 10" given 9 Heads so far.
          *   *Scoring:* Standard proper scoring.
          *   *Notice:* If they believe the Chance is 0.5, they should say 0.5. But if 10 Heads destroys the hypothesis that Chance is 0.5, their credence should shift. This is getting too complex for 80 mins with 14 students.
          *   *Simpler Round 3:* Focus on the *stability* of the chance claim.
          *   *Revised Round 3:* The "Undermining" round. They are told: "The Chance is 0.5. However, if the total sequence of 20 tosses contains more than 18 Heads, the Physics Department will retroactively reclassify this coin as 'Biased' (Chance $\neq$ 0.5)."
          *   *Task:* You are at toss 15. 14 Heads have occurred. What is your credence in Heads for Toss 15?
          *   *Tension:* Standard PP says 0.5. But if Heads makes the 'Chance=0.5' hypothesis false (because it triggers the reclassification), you have self-undermining evidence.
          *   *Actually, let's keep it tighter.* The prompt asks for the results squeezing the hypothesis.
          *   *Decision:* Round 3 will be about *updating the chance hypothesis itself* based on frequency, showing that "Chance" isn't a magical shield against empirical defeat.
          *   *Wait, re-reading the prompt:* "Round 3 where the results they've been accumulating start squeezing the chance hypothesis itself: a possible run of outcomes that has positive chance on the hypothesis, yet would wreck it if it actually came in."
          *   *Okay, I need to simulate an Undermining Future.*
          *   *Setup:* The "Chance" is defined by the long-run frequency in this specific seminar (Humean supervenience lite).
          *   *Instruction:* "The Chance of Heads is defined as the frequency of Heads in these 20 tosses." (This makes it Humean).
          *   *Scenario:* We are at toss 19. So far: 18 Heads, 0 Tails.
          *   *Question:* What is the Chance of Heads on Toss 19?
          *   *Tension:* If Chance = Frequency, and I toss Heads, Frequency becomes 19/20. If I toss Tails, 18/20.
          *   *This is too metaphysical.*
          *   *Let's try the Lewis Undermining logic directly:*
          *   *Tell them:* "We stipulate the Chance is 0.5. However, the 'Laws of the Seminar' state that if we observe 10 Heads in a row, the Stipulation is voided."
          *   *Task:* Bet on the 10th toss after 9 Heads.
          *   *Logic:* If $H$, then Chance=0.5 is false. If $T$, Chance=0.5 might remain true.
          *   *This creates the tension:* $C(H | Ch(H)=0.5 \& \text{9 Heads}) \neq 0.5$.

      *   *Refining Round 3 for Clarity:*
          *   Context: The "Chance" hypothesis is $H_{chance}$: "This coin is fair."
          *   Rule: If the total outcome of the 20-toss session is >15 Heads, the Dean declares the coin was biased all along (retroactively).
          *   Current state: 14 tosses, 14 Heads.
          *   Task: Set credence for Toss 15.
          *   Dilemma: If you bet Heads and win, you push towards the "Dean's Veto," making the Chance=0.5 hypothesis false. If you believe Chance=0.5, you should bet 0.5. But the evidence (9 Heads so far + Undermining condition) suggests the hypothesis is fragile.
          *   *Actually, the cleanest way to do this:* Just have them update the probability of the *Chance Hypothesis* being true.
          *   *No, the prompt says:* "results... squeezing the chance hypothesis itself."
          *   *Okay, I will design Round 3 as the "Undermining Future" scenario.*
          *   *Stipulation:* The Chance is 0.5.
          *   *Condition:* If the sequence contains 10 Heads in a row, the Chance was *never* 0.5 (it was a trick coin).
          *   *Situation:* 9 Heads in a row have occurred.
          *   *Bet:* On the 10th toss.
          *   *Conflict:* PP says 0.5. Rationality says: If Heads, Chance=0.5 is false. If Tails, Chance=0.5 survives. This is getting into "New Principle" territory.
          *   *Decision:* I will simplify Round 3 to focus on the *defeasibility* of chance claims by frequencies, highlighting that "Chance" isn't immune to empirical evidence, which complicates Admissibility.

      *   *Wait, I need to make sure the scoring works.*
      *   *Scoring Rule:* Brier Score is best for seminar settings. $Score = 1 - (Outcome - Credence)^2$. Max 1, Min 0.
      *   *Currency:* "Philosophy Points" (PP).

  4.  **Developing the Debrief & Contested Claims:**
      *   *Settled:* PP is a normative constraint, not a descriptive law. Admissibility is required.
      *   *Contested:* What counts as admissible? (Lewis vs. others). Does PP hold for Humean chances? (Undermining futures problem). Is the New Principle (NP) better?
      *   *Limitations:* The game uses stipulated "reliability" which is epistemically different from metaphysical admissibility. Real cash vs. fake points (risk aversion).

  5.  **Drafting the Content (Iterative refinement):**

      *   *Table:* Needs to be tight.
      *   *Round 1:* Fair coin. No info. Submit $p$. Score: Brier. Notice: Consensus at 0.5.
      *   *Round 2:* Fair coin (stipulated). Note: "Next is Heads" (Infallible). Submit $p$. Score: Brier. Notice: Everyone submits 1.0. Violation of "Match Chance".
      *   *Round 3:* The Undermining. Stipulated Chance 0.5. Rule: "If 10 Heads in a row, Coin is declared Biased (Chance $\neq$ 0.5)." 9 Heads occurred. Submit $p$ for 10th. Score: Brier. Notice: Tension between 0.5 (PP) and >0.5 (because Heads confirms Bias which might mean *more* Heads? Or <0.5 because Tails saves the Fair hypothesis?).
      *   *Correction on Round 3:* To make it an "Undermining Future" properly: The outcome *itself* makes the chance claim false.
      *   *Lewis's example:* $Ch(F) > 0$, but if $F$ occurs, $Ch$ would have been different.
      *   *Game version:* "The Chance is 0.5. But the 'Laws of Probability' in this room supervene on the total frequency. If the total frequency of Heads > 80%, the Chance is retroactively 0.8."
      *   *Current state:* 10 tosses left. 8 Heads needed to trigger the shift.
      *   *This is too math-heavy for 10 mins.*
      *   *Simpler Round 3:* "The Oracle from Round 2 returns. It says 'The Chance is 0.5'. But you just saw 9 Heads. Do you trust the Chance claim or the Frequency?"
      *   *No, stick to the prompt:* "results... squeezing the chance hypothesis itself."
      *   *Okay, I'll use the 'Retroactive Veto' idea.*
      *   *Setup:* Chance = 0.5.
      *   *Condition:* If we get 10 Heads in a row, the University proves the coin was weighted, so Chance $\neq$ 0.5.
      *   *State:* 9 Heads.
      *   *Bet:* 10th toss.
      *   *Tension:* If Heads, Chance=0.5 is false. If Tails, Chance=0.5 stands.
      *   *This creates the "Admissibility" crisis.* The outcome is inadmissible because it bears on the truth of the chance claim itself.

  6.  **Review against Constraints:**
      *   14 students, 80 mins.
      *   Table format exactly as requested.
      *   Prose for debrief, materials, timeline.
      *   Predictable failures.
      *   Settled vs. Contested flags.

  7.  **Final Polish:**
      *   Ensure the "Admissibility" point lands hard in Round 2.
      *   Ensure the "Undermining" point lands in Round 3.
      *   Check timing. 80 mins is tight for 3 rounds + debrief. Need strict timekeeping.
      *   Make sure the scoring is clear (Brier score is standard for this).
      *   *Self-Correction on Round 3:* The prompt asks for a run of outcomes that has positive chance but would wreck the hypothesis.
      *   *Implementation:* "Hypothesis: Chance(Heads) = 0.5." "Rule: If we observe 10 Heads in a row, Hypothesis is falsified." "Current: 9 Heads." "Bet on 10th."
      *   *Why this works:* $P(H | Ch(H)=0.5) = 0.5$. But $P(H | Ch(H)=0.5 \& 9H \& \text{Falsification Rule})$ is messy. If $H$ occurs, $Ch(H)=0.5$ becomes false. This forces them to realize $Ch(H)=0.5$ is not a fixed background fact but a hypothesis vulnerable to the data.

  8.  **Writing the Response:** (Proceeding to generate output based on these thoughts).
      *   *Check:* Did I distinguish settled vs contested in the debrief? Yes.
      *   *Check:* Did I explain what goes wrong? Yes (risk aversion, confusion on scoring).
      *   *Check:* Did I explain what the game can't reproduce? Yes (Metaphysical nature of chance vs. epistemic reliability).

  9.  **Final Review of the Table:**
      *   Columns: round | what students are told | what each student submits | how it's scored | the moment they're supposed to notice.
      *   Ensure Round 2 explicitly mentions the "reliable note."
      *   Ensure Round 3 explicitly mentions the "hypothesis wrecking" condition.

  10. **Timeline:**
      *   Intro: 10 min.
      *   Round 1: 15 min.
      *   Round 2: 20 min.
      *   Round 3: 20 min.
      *   Debrief: 15 min.
      *   Total: 80 min. (Tight, but doable).

  11. **Materials:** Slips of paper, coins, projector for scores.

  12. **Contested Claims:**
      *   Settled: PP is normative. Admissibility is needed.
      *   Contested: Definition of Admissibility. Humean vs. Primitivist chances (Undermining). NP vs PP.

  13. **Predictable Failures:**
      *   Students treating Brier score as linear betting.
