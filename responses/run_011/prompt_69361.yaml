answer: |-
  **Title:** The Correlated Voter: Dissolving the Paradox via Evidential Reasoning
  **To:** Graduate Seminar in Social Choice
  **From:** [Your Name]
  **Subject:** Thesis Proposal on the "Closeness Implies Correlation" Principle

  ### Executive Summary

  Your TA was right: the standard model asks the wrong question. The Downsian Paradox assumes a Causal Decision Theory (CDT) framework where the voter treats the rest of the electorate as a fixed background state. Your friend's "Closeness Implies Correlation" intuition is the kernel of a superior approach, but it requires shifting from CDT to Evidential (EDT) or Functional Decision Theory (FDT).

  **My Position:** This approach does not merely "patch" the paradox; it dissolves the instrumental irrationality of voting *provided* we accept that political agents are logically correlated. However, it does not rescue the standard model. It relocates the puzzle from "Why vote?" to "Why should political decision-making be modeled causally rather than evidentially?" The paradox survives only as a critique of Causal Decision Theory in social contexts.

  Below is the argument built out, including a necessary correction to your friend's mathematical claim, the positive case for correlation, and the responses to the lethal objections.

  ---

  ### 1. The Mathematical Correction: $1/\sqrt{N}$ vs. $1/N$

  We must start by clearing up the math, because your friend's claim that the tie probability scales as $1/\sqrt{N}$ is a common misconception that weakens the argument if left uncorrected.

  *   **The Claim:** Your friend argues that because the standard deviation of a vote share scales as $1/\sqrt{N}$ (via the Central Limit Theorem), the probability of a tie must also scale as $1/\sqrt{N}$.
  *   **The Reality:** This is true *only* if we know with certainty that the electorate is perfectly balanced ($p=0.5$) before the election begins. In that specific case, the probability of a tie in a binomial distribution is indeed proportional to $1/\sqrt{N}$.
  *   **The Problem:** In any real election, we are uncertain about the true bias $p$ of the electorate. We do not know if the race is 50/50 or 51/49. When we integrate over a reasonable prior distribution of uncertainty about $p$ (as shown by Chamberlain & Rothschild, 1981), the probability of being pivotal drops to order **$1/N$**.
  *   **Why This Matters:** If the probability is $1/N$, the standard Downsian calculation holds: for large $N$, $B/N < C$. The $1/\sqrt{N}$ boost is not robust enough to save the standard model on its own.

  **Conclusion on Math:** Your friend's mathematical intuition is technically incorrect for realistic cases of uncertainty. However, her *conceptual* intuition (Closeness Implies Correlation) is more powerful than the math she uses to support it. We do not need the probability of a tie to be $1/\sqrt{N}$; we need the *correlation* between your vote and others to be high enough to offset the $1/N$ pivotality. The argument rests on decision theory, not just probability scaling.

  ---

  ### 2. The Positive Case: The Right Question

  The standard model asks: *"Given the state of the world, does my single causal intervention change the outcome?"*
  The correct question is: *"Given that I am a sample from the population determining the outcome, what does my decision imply about the decisions of agents similar to me?"*

  #### A. The Common Cause Structure
  The "Closeness Implies Correlation" principle posits that a tight race is not a random accident; it is the result of common causes (shocks, news cycles, cultural mood).
  1.  **Observation:** You observe the race is close (or you believe it will be).
  2.  **Inference:** This observation is evidence that the "common cause" (e.g., high salience, polarized information environment) is active.
  3.  **Correlation:** This common cause affects not just you, but a bloc of voters ($K$) who consume the same information and share your reasoning process.
  4.  **Decision:** If you decide to vote based on this closeness, it is evidentially likely that the $K$ similar voters will also decide to vote.

  #### B. Evidential vs. Causal Leverage
  Under Causal Decision Theory (CDT), your vote causally impacts only one count. Under Evidential Decision Theory (EDT), your vote is *evidence* of the bloc's vote.
  *   **CDT Expected Utility:** $EU = P(\text{pivotal}) \cdot B - C \approx \frac{1}{N}B - C$. (Negative for large $N$).
  *   **EDT Expected Utility:** $EU = P(\text{bloc pivotal} | \text{I vote}) \cdot B - C$.
      *   If your vote is highly correlated with a bloc of size $K$, then conditioning on "I vote" significantly raises the probability that the bloc votes.
      *   If the bloc is large enough, the probability that *the bloc* is pivotal is much higher than the probability that *you* are pivotal.
      *   Essentially, you are not betting on your single vote flipping the election; you are betting on your *decision rule* ("Vote if Close") being adopted by a correlated group that *does* flip the election.

  #### C. Functional Decision Theory (FDT) Refinement
  We can make this even more precise using Functional Decision Theory (FDT). FDT treats your decision as the output of a decision algorithm.
  *   **The Algorithm:** "If the race is close, Vote."
  *   **The Logic:** Many other voters are running the same algorithm (same news feeds, same social pressures).
  *   **The Output:** When you compute the output of this algorithm, you are logically computing the output for all agents running the same algorithm.
  *   **The Result:** You should vote if the benefit of the *bloc* of algorithm-runners swinging the election outweighs your cost. Since the bloc is large, the expected utility becomes positive even if $N$ is in the millions.

  **Thesis Statement:** Voting is instrumentally rational not because one vote is causally potent, but because voters are logically correlated agents executing a shared decision function in response to common evidence. The paradox arises only from modeling voters as causally isolated atoms.

  ---

  ### 3. The Objections and Replies

  Here are the two objections that will destroy this thesis if you cannot answer them, along with the defenses.

  #### Objection 1: The "Magical Thinking" Objection (Causality)
  **The Critique:** "This is superstition. My walking into a booth does not *cause* my neighbor to walk into a booth. We are physically separated. You are confusing correlation with causation. Decision theory must track causal power, not tea-leaf reading."

  **The Reply:**
  This objection assumes Causal Decision Theory is the only rational framework. It is not.
  1.  **Newcomb's Problem:** In Newcomb's Problem, rational agents one-box because their choice is *evidence* of the predictor's prior move, even though the choice doesn't *cause* the move. Similarly, your vote is evidence of the "electoral mood."
  2.  **The Common Cause:** We are not claiming your vote *causes* theirs. We are claiming a third factor (the "closeness" signal) causes *both*. By conditioning on your decision to vote, you update the probability that the common cause is strong enough to mobilize the bloc.
  3.  **Policy Selection:** You are not choosing an act; you are choosing a *policy*. If the policy "Vote when Close" yields good outcomes when adopted by the correlated group, then it is rational for you to adopt it, even if your specific instance doesn't causally trigger the others. To refuse to vote is to "defect" from a coordination equilibrium that benefits your type.

  #### Objection 2: The Reflexivity Objection (Self-Undermining)
  **The Critique:** "If this reasoning works, everyone uses it. If everyone uses it, everyone votes. If everyone votes, the race is no longer close. If the race is not close, the 'Closeness Implies Correlation' premise fails, and the expected utility drops back to zero. The argument eats itself."

  **The Reply:**
  This is a fixed-point objection, and it fails for two reasons:
  1.  **Heterogeneity:** Not everyone is a rational expected-utility maximizer using FDT. A significant portion of the electorate votes expressively, habitually, or irrationally. The "correlated bloc" is a subset of the electorate. The race can remain close *among the swing voters* even if turnout is high. The correlation applies to the *margin*, not the total turnout.
  2.  **Equilibrium, not Elimination:** The argument does not require the race to be *exactly* tied ex-post. It requires that the *expectation* of closeness generates the correlation. Even if the bloc votes and creates a 5-point margin, the counterfactual remains: "If we (the bloc) had stayed home, the margin would have been 10 points the other way." The pivotality is about the *margin shift* generated by the correlated bloc, not the absolute tie. The reasoning survives because the *uncertainty* about the margin persists until the votes are counted. You are reasoning under uncertainty, not after the fact.

  ---

  ### 4. The Verdict: Does the Paradox Survive?

  **My Committed Position:**
  The Paradox of Voting is **dissolved** as a problem of voter irrationality, but it **survives** as a problem of decision-theoretic foundations.

  1.  **For the Voter:** If you accept that you are correlated with other voters (via shared information, culture, or reasoning algorithms), voting is instrumentally rational. You are effectively casting a "bloc vote" through the mechanism of logical correlation. The "cost > benefit" calculation fails because the "benefit" is multiplied by the size of the correlated group, not just your singular causal power.
  2.  **For the Theorist:** The paradox relocates. It is no longer "Why do people vote?" It is "Why do social scientists insist on using Causal Decision Theory for logically correlated agents?" The persistence of the paradox in the literature is evidence of the field's reluctance to abandon CDT in favor of EDT or FDT in social contexts.

  **What remains "nasty":**
  The remaining puzzle is the **Free-Rider Stability**. Even if voting is rational for the correlated bloc, it is *more* rational to let the bloc vote while you stay home (saving cost $C$ while keeping the evidential correlation).
  *   *Solution:* This requires the decision theory to treat your decision as *binding* for your type (FDT). If you reason "I will stay home," you must conclude "Agents like me will stay home." If that leads to a loss for your type, you vote.
  *   *The Nastiness:* This requires a level of abstract reasoning that is cognitively demanding. The paradox survives as a question of *bounded rationality*: Can real voters actually perform this FDT calculation, or do they just vote because of the "D-term" (duty) after all?

  ### Summary for the Seminar

  When you return to the seminar, do not argue that $P(\text{pivotal})$ is higher than the standard model says (your friend's $1/\sqrt{N}$ claim is vulnerable). Instead, argue that **$P(\text{pivotal})$ is the wrong variable to maximize.**

  The right variable is the **Expected Utility of the Decision Rule**.
  *   **Standard Model:** Maximize $P(\text{I am pivotal}) \times B - C$.
  *   **Correlated Model:** Maximize $P(\text{My Type is Pivotal}) \times B - C$.

  The TA's "wrong question" was asking about the causal power of an atomized individual. The "right question" is about the evidential leverage of a correlated class. If you frame it this way, you bypass the $1/N$ problem entirely and force the room to defend why they think political voters should be modeled as causally isolated atoms in the first place.
