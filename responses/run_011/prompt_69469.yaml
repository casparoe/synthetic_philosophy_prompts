answer: |-
  1. Purpose and target
  Adequacy is measured against public legitimacy, not metaphysical correctness. The theory must justify a public body choosing lower expected value to avoid concentrated catastrophic risk. It must provide reasons acceptable to those who bear the risk, not just the aggregate beneficiary. Failure occurs if the theory declares the council irrational solely for violating expected utility, or if it relies on technical axioms inaccessible to the risk-bearers. The target is a normative framework for political risk imposition, where rationality includes defensibility to the losers. The consultant is wrong only if rationality permits weighting the distribution of harm over the sum of benefits.

  2. The desiderata
  1. **Distributional Sensitivity.** Motivation: The flood scheme concentrates failure risk on one neighbourhood while spreading costs. Tag: Non-negotiable. Public agents cannot aggregate utility across persons if it masks catastrophic loss for a subset; rationality requires tracking who loses, not just how much is lost in total.

  2. **Exposure-Relative Admissibility.** Motivation: A gamble acceptable to a diversified insurer may be irrational for a single homeowner. Tag: Non-negotiable. Risk tolerance is not just utility curvature; it depends on the agent's capacity to absorb the specific loss profile without ruin. A theory must distinguish the city's portfolio risk from the neighbourhood's existential risk.

  3. **Non-Repudiation.** Motivation: The council must defend the choice to neighbours after a flood, and taxpayers after a safe dry year. Tag: Non-negotiable. A rule that requires hindsight to justify itself fails the test of public reason; ex ante logic must hold ex post. If the logic collapses when the bad branch is realized, it was never rational.

  4. **Articulability.** Motivation: Citizens cannot audit representation theorems. Tag: Negotiable. While ideal, complex weighting functions may be necessary; however, the core logic must be translatable into plain premises about risk burden. If the defence requires a PhD to understand, it fails the democratic test of accountability.

  5. **Description Invariance.** Motivation: Reframing the flood probability as survival rates versus death rates should not flip the decision. Tag: Preference (EU Camp). Violations allow manipulation, but strict invariance may block legitimate risk-aversion triggers based on framing of loss. We may need to sacrifice this to capture genuine risk attitudes.

  6. **Temporal Consistency.** Motivation: The council should not reverse decisions tomorrow without new information. Tag: Preference/Ideology. Suspicion confirmed: strict dynamic consistency blocks adaptive management. Public bodies must be allowed to update risk attitudes as political mandates shift, not just Bayesian priors. Demanding consistency treats policy as a single agent's life plan rather than a shifting collective will.

  7. **Large-Stakes Convergence.** Motivation: For indefinitely repeated small risks, the law of large numbers should restore expected value reasoning. Tag: Negotiable. While mathematically sound, public decisions are often one-off; forcing convergence may invalidate legitimate caution on singular catastrophic events. The flood defence is not a repeated gamble.

  8. **Risk-Ambiguity Separation.** Motivation: Known flood probabilities differ from uncertain climate models. Tag: Non-negotiable. Ambiguity aversion is distinct from risk aversion; conflating them obscures whether the objection is to variance or to ignorance. Public bodies face both and must weigh them differently.

  9. **Common-Consequence Respect.** Motivation: Allais-type patterns show people violate independence when safety is guaranteed. Tag: Negotiable. Respecting this captures intuitive security preferences, but violates independence axioms required for simple expected utility calculation. We may need to violate independence to validate the preference for safety.

  10. **Common-Ratio Respect.** Motivation: Scaling probabilities should not reverse preference unless risk attitudes change. Tag: Negotiable. Violations suggest non-linear probability weighting, complicating the defence of why specific probabilities were weighted heavily. This is a technical cost we may have to bear for accuracy.

  11. **Opportunity Cost Transparency.** Motivation: The cheaper scheme funded other resilience work. Tag: Non-negotiable. Risk choices are resource choices; the theory must account for the risk incurred by *not* spending the savings elsewhere. Ignoring the counterfactual risk creates a false safety premium.

  12. **Catastrophe Thresholding.** Motivation: Some outcomes are unacceptable regardless of probability. Tag: Preference (Deontological). A lexical priority for avoiding ruin overrides trade-offs, but risks paralysis if every downside is termed catastrophic. This is a policy choice, not a universal rational requirement.

  3. Distinctions the theory may not collapse
  1. **Risk vs. Uncertainty.** Known frequencies versus unknown distributions. Collapsing them treats ignorance as variance, underestimating the burden of proof for ambiguous risks.
  2. **Individual vs. Collective.** One person's gamble versus a population's exposure. Aggregating them ignores the moral weight of concentrated harm versus diffuse cost.
  3. **Ex Ante vs. Ex Post.** Justification before versus after the outcome. Collapsing them allows lucky decisions to be vindicated by results rather than reasoning.
  4. **Probability vs. Weight.** Objective chance versus decision weight. Treating them as identical forbids non-expected utility models that capture risk sensitivity.
  5. **Cost vs. Harm.** Budget expenditure versus physical damage. Equating them ignores that money is fungible while flood damage is often irreversible.
  6. **Preference vs. Norm.** What agents choose versus what they should choose. Collapsing them removes the critical capacity to judge public choices against standards.

  4. The squeeze
  The squeeze comes from calibration theorems. If you reject expected value for small-stakes risks (like the flood probability), standard expected utility theory implies you must reject enormous gains for tiny probabilities of loss. This rules out Expected Utility as a candidate if you want to validate the council's caution without implying absurdity. You must move to non-expected utility, like rank-dependent models. However, these often violate Description Invariance or Temporal Consistency. Furthermore, Non-Repudiation clashes with Expected Value: losers cannot be told "you lost, but the average won." They need a reason why their loss was permissible, not just statistically offset. The single requirement eliminating the most candidates is Exposure-Relative Admissibility. It forbids models that treat risk as purely internal utility curvature, demanding instead that the external structure of exposure matters. This kills standard EU and forces a structural view of risk, which complicates Articulability. You cannot have simple axioms and exposure sensitivity simultaneously. The calibration results plainly rule out Expected Utility for this case; if you care about validating the council, you must abandon EU.

  5. Contenders, briefly
  **Expected Utility Theory.** It fails Distributional Sensitivity and Exposure-Relative Admissibility. It treats the flood risk as merely another utility increment. It wins on Articulability and Consistency but loses the flood case unless utility functions are implausibly curved. It cannot defend the choice to the losers without appealing to aggregate sums they reject.

  **Risk-Weighted Expected Utility (Buchak).** It handles the flood case by weighting probabilities non-linearly. It supports Exposure-Relative Admissibility implicitly. However, it struggles with Articulability; explaining risk-weights to losers is harder than explaining averages. It also faces calibration issues if not carefully bounded, but offers a normative defence of risk aversion.

  **Reference-Dependent Accounts.** These capture loss aversion, fitting the neighbourhood's reaction. They handle Common-Consequence patterns well. But they are descriptive, not normative. They lack a clear defence for why loss aversion is rational rather than a bias, failing Non-Repudiation when challenged on irrationality by a consultant.

  6. Verdict on my three
  Exposure-Relative Admissibility is load-bearing; it is the only way to distinguish the council from a gambler without relying on utility curvature. Non-Repudiation is redundant; it is simply the political instantiation of Ex Ante/Ex Post distinction already required for legitimacy. Articulability is untenable in its strict form. Any theory robust enough to solve the calibration problem and handle exposure sensitivity will be too complex for non-specialist verification. You must relax this to "translatable logic" rather than "checkable premises."
