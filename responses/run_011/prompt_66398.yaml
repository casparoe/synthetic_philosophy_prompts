      *   **Constraints:**
          *   Think out loud/brainstorm first.
          *   Provide a list of requirements with justifications.
          *   Distinguish types of silence (never recorded, destroyed, unindexed, miscategorized).
          *   Address when gaps license inference vs. when they don't.
          *   Address selection effects and Missing Not At Random (MNAR) data.
          *   Avoid reducing every archive to a deliberate instrument of power (nuance).
          *   Mark requirements as Non-Negotiable vs. Camp Preferences.
          *   Identify the single requirement that knocks out the most accounts.
          *   Evaluate three stances (Power, Bureaucracy, Statistical Missingness) against the list.
          *   Identify if two desiderata are incompatible.
          *   No bibliography/citations.
      *   **Tone:** Intellectual, rigorous, practical for a journalist, slightly conversational in the brainstorming phase but precise in the deliverables.

  2.  **Brainstorming & Conceptualizing:**
      *   *The Core Problem:* The journalist has a "hole" in the data. The hole is meaningful (county paid, hospital didn't log). The editor wants more than "archives are biased." That's a truism. The story needs a mechanism.
      *   *Philosophy of History Angle:* Michel-Rolph Trouillot's *Silencing the Past* is the elephant in the room, but I can't cite it. The idea is that silence is an active production, not just a passive absence. But I also need to avoid the "everything is power" trap.
      *   *Statistics Angle:* Missing data mechanisms: MCAR (Missing Completely At Random), MAR (Missing At Random), MNAR (Missing Not At Random). This is clearly MNAR. The missingness depends on the unobserved value (being *that* kind of patient makes you unrecorded).
      *   *The Tension:* If I say "this silence proves oppression," I might be overreading bureaucratic incompetence. If I say "this is just lost data," I ignore the systemic pattern. The journalist needs to walk the line between "conspiracy" and "clerical error."
      *   *Types of Silence:*
          1.  *Ontological:* They never existed (not the case here).
          2.  *Archival:* Created but lost/destroyed.
          3.  *Categorical:* Created but filed elsewhere (the county ledger).
          4.  *Discursive:* Created but not named/described (the "no diagnosis code" issue).
      *   *Inference:* When can we say "they were denied care" vs. "they were cared for off the books"? The county ledger says care was paid for. The hospital ledger says they weren't admitted. This implies *unofficial admission* or *segregated admission*.
      *   *The "Power" Trap:* If every silence is power, the concept loses explanatory power. We need to distinguish *malice* from *structure*.
      *   *Incompatibility:* Can we demand *specificity* (exact numbers) and *structural critique* (broad systems) at the same time? Often, the more structural the argument, the less precise the data. Or, can we demand *moral clarity* and *statistical rigor*? MNAR data resists precise estimation.

  3.  **Drafting the Desiderata:**
      *   *Req 1: Mechanism.* Don't just say "silence." Say *how* the silence happened. (Non-negotiable).
      *   *Req 2: Typology.* Distinguish between "never written" and "written then lost." (Non-negotiable).
      *   *Req 3: MNAR Acknowledgement.* Acknowledge the missingness is systematic. (Non-negotiable).
      *   *Req 4: Alternative Explanations.* Must rule out incompetence before claiming malice. (Camp Preference? No, essential for defensibility). Let's make it Non-Negotiable for a magazine piece.
      *   *Req 5: Positive Evidence of Absence.* You need evidence that the record *should* have existed but doesn't. (Non-negotiable).
      *   *Req 6: Avoid Totalization.* Don't say *all* archives are lies. (Camp Preference).
      *   *Req 7: Recoverability.* Can the silence be quantified even if not named? (Camp Preference).

      *Refining the "Knockout" Requirement:* The one that kills most bad historical arguments is usually "Positive Evidence of Absence." Many people assume a gap is meaningful without proving the record *ought* to have been there.
      *Refining the "Incompatibility":* The tension is usually between *Quantitative Precision* (how many?) and *Qualitative Nuance* (why?). In MNAR scenarios, you often can't have both. You can estimate the *fact* of missingness, but not the *content* of the missing data without strong assumptions.

  4.  **Developing the Evaluation of Stances:**
      *   *Silence as Power:* Good on mechanism, bad on nuance (often assumes intent).
      *   *Silence as Bureaucracy:* Good on nuance, bad on moral weight (can excuse harm).
      *   *Silence as Statistical Missingness:* Good on rigor, bad on meaning (treats people as data points).

  5.  **Finalizing the List & Constraints:**
      *   Make sure to explicitly mark Non-Negotiable vs. Camp Preference.
      *   Ensure the "Incompatibility" is highlighted clearly.
      *   Keep the tone appropriate (philosopher-statistician hybrid).

  6.  **Review against constraints:**
      *   Brainstorming out loud? Yes.
