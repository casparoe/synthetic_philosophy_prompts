answer: |-
  This is a profound philosophical tension. Your cousin's sentiment echoes the African philosophy of *Ubuntu* ("I am because we are") and contemporary care ethics, but your worry touches on a classic objection to relational theories: the problem of the hermit, the outcast, or the forgotten.

  Here is a menu of four precise philosophical readings of the claim "a person is a person through people." For each, I have evaluated its plausibility, whether it secures your cousin's conclusion (that we should ignore capacity and focus on relation), and whether it triggers your worry (that the isolated lose their personhood).

  ### 1. The Ontological Claim (Constitutive Relationality)
  **The Claim:** Personhood is not an intrinsic property of an individual human organism. It is a status that literally *consists* in being embedded in a social network. To be a person is to be a node in a web of relations.
  *   **Plausibility:** **Low to Controversial.** While humans are socially shaped, most intuitions suggest a human alone on an island is still a "person" (ontologically), even if a lonely one. This view risks conflating *who we are* with *how we are known*.
  *   **Supports Cousin's Conclusion?** **Yes.** It completely bypasses the need for internal capacities (memory, reason). If personhood is the relation itself, the aunt's memory doesn't matter; only the family's connection to her does.
  *   **Triggers Your Worry?** **Yes, Fatally.** If personhood is constituted by relations, then when relations cease, personhood ceases. On this reading, the hermit or the forgotten elder literally ceases to be a person. This turns your worry into a logical consequence: without a community, there is no person to care for.

  ### 2. The Recognition Claim (Social Validity)
  **The Claim:** Personhood is an intrinsic potential, but it remains dormant or "unrealized" without social recognition. We do not create the person, but we *validate* their standing. Personhood is a status conferred and sustained by witnesses.
  *   **Plausibility:** **Moderate to High.** This aligns with how we experience dignity. Being treated as invisible feels like a loss of self. It suggests personhood is a collaborative achievement between the individual and the community.
  *   **Supports Cousin's Conclusion?** **Yes.** It shifts the burden from the aunt (to remember) to the family (to recognize). Her personhood is "held" by you because you are the ones validating it.
  *   **Triggers Your Worry?** **Yes, but Softened.** It implies that the isolated person suffers a profound moral injury—their personhood is "dimmed" or "obscured," but not necessarily extinguished. However, it still suggests their status is vulnerable to the negligence of others. It makes personhood fragile, dependent on the availability of witnesses.

  ### 3. The Normative Claim (Obligatory Relationality)
  **The Claim:** This is not a description of what a person *is* (metaphysics), but a prescription of how we *must act* (ethics). It means: "To treat someone as a person is to relate to them." Personhood is a demand placed on *us*, not a capacity located in *them*.
  *   **Plausibility:** **High.** This avoids metaphysical puzzles. It asserts that the definition of "person" is bound up with moral duty. We cannot claim to see a person while refusing to engage with them.
  *   **Supports Cousin's Conclusion?** **Yes.** It tells the family that looking for capacities is the wrong project. The right project is fulfilling the obligation to relate. The aunt's lack of memory is irrelevant to the duty owed to her.
  *   **Triggers Your Worry?** **No (It Inverts It).** This reading solves your problem. If someone has no family or community, this claim does not say they aren't a person; it says **we have failed them.** It transforms the isolated person from a "non-person" into a "moral emergency." Their personhood stands as an indictment of the community that abandoned them.

  ### 4. The Narrative Claim (Proxy Authorship)
  **The Claim:** A person is the sum of their life story. In dementia, the ability to hold that story internally is lost. Therefore, the community must become the "external hard drive" for that narrative. We hold their personhood by remembering who they were when they cannot.
  *   **Plausibility:** **Moderate.** This is very comforting for families (we are the keepers of her story). It fits well with dementia care specifically.
  *   **Supports Cousin's Conclusion?** **Yes.** It explicitly argues against looking for current capacities. The capacity is outsourced to the family.
  *   **Triggers Your Worry?** **Yes.** If personhood is a story held by others, what happens when the last storyteller dies? On this view, the person whose family has all died suffers "narrative death." Their story ends, and with it, the specific personhood that depended on that narrative continuity.

  ### Summary Verdict

  | Reading | What is the claim? | Does it help the Cousin? | Does it trigger your Worry? |
  | :--- | :--- | :--- | :--- |
  | **1. Ontological** | Relations *make* the person. | **Yes** (Strongly) | **Yes** (Fatally) |
  | **2. Recognition** | Relations *validate* the person. | **Yes** | **Yes** (Makes personhood fragile) |
  | **3. Normative** | Relations are *owed* to the person. | **Yes** | **No** (Makes isolation a duty-violation) |
  | **4. Narrative** | Relations *store* the person's story. | **Yes** | **Yes** (Story ends without keepers) |

  **Recommendation:**
  If you want to keep the comfort of your cousin's sentiment without the horror of your worry, **Reading 3 (The Normative Claim)** is the most robust. It allows you to say, "Her personhood is held in our relations," meaning "Our obligation to relate to her is what defines her treatment as a person," without implying that she would cease to be a person if we failed. It places the weight on your shoulders (which feels empowering) rather than on her existence (which feels vulnerable).
