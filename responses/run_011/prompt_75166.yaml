          3.  The Protocol Cards (The core manipulation).
          4.  The Bidding Sheet.
          5.  The Debrief Script (The theory).
          6.  Predicted Failure Modes & Limitations.

      *   *Math Check:*
          *   Positives: $1, 1/3, 1/5, 1/7, 1/9, 1/11, 1/13, 1/15...$
          *   Negatives: $-1/2, -1/4, -1/6, -1/8, -1/10, -1/12...$
