answer: |-
  # Seminar Activity: The Indeterminate Ticket

  **Time:** 90 Minutes
  **Students:** 14 (Divide into 7 pairs, or 4 groups of 3-4)
  **Materials:** Printed Tickets, Protocol Cards (A, B, C, D), Bidding Sheets, Tokens (poker chips or sticky notes), Projector.

  ---

  ## Part 1: Instructor Setup & Introduction (10 Minutes)

  **The Pitch:**
  "Today we are pricing a financial instrument. The payoff depends on a coin flip. I am the bank. You are the investors. You will calculate the expected value (EV) of this ticket, bid on it, and the closest bid to the *true* EV wins a prize. If the EV is undefined, the bank retains all tokens."

  **The Ticket (Handout 1):**
  > **THE COIN TICKET**
  > 1. A fair coin is flipped repeatedly until it lands **Heads**.
  > 2. Let $n$ be the flip number of the first Heads (e.g., Heads on 1st flip $\rightarrow n=1$; Tails then Heads $\rightarrow n=2$).
  > 3. **Payoff:** You receive $(-1)^{n+1} \cdot \frac{2^n}{n}$ classroom dollars.
  > 4. **Probability:** The chance of stopping at $n$ is $1/2^n$.
  >
  > *Examples:*
  > *   $n=1$ (Heads): Payoff $= +2^1/1 = \$2$. Prob $= 1/2$. **Contribution to EV = $+1$**.
  > *   $n=2$ (Tails, Heads): Payoff $= -2^2/2 = -\$2$. Prob $= 1/4$. **Contribution to EV = $-0.5$**.
  > *   $n=3$ (Tails, Tails, Heads): Payoff $= +2^3/3 = \$2.67$. Prob $= 1/8$. **Contribution to EV = $+0.333$**.

  **Instruction:**
  "Your task is to sum the probability-weighted contributions to find the Expected Value. Because the series is infinite, you cannot sum them all. You must use an **Accounting Protocol** to estimate the limit. I have assigned each table a specific Protocol Card. Follow it strictly."

  ---

  ## Part 2: Protocol Cards (25 Minutes Calculation)

  *Distribute one card type per group. Ensure at least two groups get Card A, two get Card B, two get Card C, and one gets Card D.*

  ### Protocol Card A: "Chronological" (The Intuitive Baseline)
  **Rule:** Sum the terms in the order the coin flips occur ($n=1, 2, 3, 4 \dots$).
  **Instruction:** Add the terms listed below in order. Track the Running Total. Extrapolate the limit based on the trend of the last 5 totals.

  | Step ($n$) | Term Value ($1/n \times \text{sign}$) | Running Total (Approx) |
  | :--- | :--- | :--- |
  | 1 | $+1.000$ | $1.000$ |
  | 2 | $-0.500$ | $0.500$ |
  | 3 | $+0.333$ | $0.833$ |
  | 4 | $-0.250$ | $0.583$ |
  | 5 | $+0.200$ | $0.783$ |
  | 6 | $-0.167$ | $0.616$ |
  | 7 | $+0.143$ | $0.759$ |
  | 8 | $-0.125$ | $0.634$ |
  | 9 | $+0.111$ | $0.745$ |
  | 10 | $-0.100$ | $0.645$ |
  | 11 | $+0.091$ | $0.736$ |
  | 12 | $-0.083$ | $0.653$ |
  | **Trend** | *Oscillating, narrowing* | **Limit $\approx 0.69$** |

  ### Protocol Card B: "Optimist" (2 Positives : 1 Negative)
  **Rule:** The state space allows reordering. To be prudent, recognize gains early. Add **two** positive terms for every **one** negative term.
  **Instruction:** Use the pool of terms from the Ticket. Pick two unused positives, then one unused negative. Sum them.

  | Step | Source ($n$) | Term Value | Running Total (Approx) |
  | :--- | :--- | :--- | :--- |
  | 1 | $n=1$ (+) | $+1.000$ | $1.000$ |
  | 2 | $n=3$ (+) | $+0.333$ | $1.333$ |
  | 3 | $n=2$ (-) | $-0.500$ | $0.833$ |
  | 4 | $n=5$ (+) | $+0.200$ | $1.033$ |
  | 5 | $n=7$ (+) | $+0.143$ | $1.176$ |
  | 6 | $n=4$ (-) | $-0.250$ | $0.926$ |
  | 7 | $n=9$ (+) | $+0.111$ | $1.037$ |
  | 8 | $n=11$ (+) | $+0.091$ | $1.128$ |
  | 9 | $n=6$ (-) | $-0.167$ | $0.961$ |
  | 10 | $n=13$ (+) | $+0.077$ | $1.038$ |
  | 11 | $n=15$ (+) | $+0.067$ | $1.105$ |
  | 12 | $n=8$ (-) | $-0.125$ | $0.980$ |
  | **Trend** | *Drifting Upward* | **Limit $\approx 1.04$** |

  ### Protocol Card C: "Pessimist" (1 Positive : 2 Negatives)
  **Rule:** Risk management requires recognizing losses early. Add **one** positive term for every **two** negative terms.
  **Instruction:** Use the pool of terms from the Ticket. Pick one unused positive, then two unused negatives. Sum them.

  | Step | Source ($n$) | Term Value | Running Total (Approx) |
  | :--- | :--- | :--- | :--- |
  | 1 | $n=1$ (+) | $+1.000$ | $1.000$ |
  | 2 | $n=2$ (-) | $-0.500$ | $0.500$ |
  | 3 | $n=4$ (-) | $-0.250$ | $0.250$ |
  | 4 | $n=3$ (+) | $+0.333$ | $0.583$ |
  | 5 | $n=6$ (-) | $-0.167$ | $0.416$ |
  | 6 | $n=8$ (-) | $-0.125$ | $0.291$ |
  | 7 | $n=5$ (+) | $+0.200$ | $0.491$ |
  | 8 | $n=10$ (-) | $-0.100$ | $0.391$ |
  | 9 | $n=12$ (-) | $-0.083$ | $0.308$ |
  | 10 | $n=7$ (+) | $+0.143$ | $0.451$ |
  | 11 | $n=14$ (-) | $-0.071$ | $0.380$ |
  | 12 | $n=16$ (-) | $-0.063$ | $0.317$ |
  | **Trend** | *Drifting Downward* | **Limit $\approx 0.35$** |

  ### Protocol Card D: "Target Arbitrage" (Divergence)
  **Rule:** Maximize the reported value. Add positive terms until the Running Total exceeds $+5.00$. Then add negative terms until it drops below $-5.00$. Repeat.
  **Instruction:** You will not converge. Record the range of your oscillation after 12 terms.
  **Trend:** *Wild Oscillation.* (Students will likely only reach $\pm 1.5$ in 12 terms, but the instruction forces them to acknowledge the lack of settling).

  ---

  ## Part 3: The Auction (15 Minutes)

  1.  **Private Valuation:** Each group writes their estimated "True EV" on a sealed Bidding Sheet.
  2.  **The Rule:** "The group closest to the *actual* mathematical Expected Value of the ticket wins 5 bonus points. If the EV is undefined, the House keeps all points."
  3.  **Submission:** Collect sheets.
  4.  **The Reveal:** Write the group estimates on the board.
      *   Group A: $\approx 0.69$
      *   Group B: $\approx 1.04$
      *   Group C: $\approx 0.35$
      *   Group D: "No Value"
  5.  **The Twist:** Announce: "There is no winner. The Expected Value does not exist."

  ---

  ## Part 4: Debrief Script (40 Minutes)

  ### 1. The Mathematical Collision (10 mins)
  "Look at the board. You all summed the exact same numbers: $+1, -1/2, +1/3, -1/4 \dots$. You all used valid arithmetic. Yet you arrived at different answers."

  *   **Ask Group A:** "Why did you sum in flip order?"
      *   *Expected:* "Because that's how the game happens."
  *   **Ask Group B/C:** "Why did you reorder?"
      *   *Expected:* "The card told us to. It said 'pool of terms'."
  *   **The Hard Truth:** "In finite arithmetic, $a+b = b+a$. In infinite series, this is only true if the series is **Absolutely Convergent** (i.e., if the sum of absolute values $|1| + |1/2| + |1/3| \dots$ converges). Here, the absolute sum is the Harmonic Series, which diverges to infinity."
  *   **The Theorem:** "This is the **Riemann Rearrangement Theorem**. If a series is conditionally convergent, you can reorder the terms to sum to *any* real number, or diverge. Your Protocol Cards were essentially manual implementations of this theorem."

  ### 2. The Decision Theory Crisis (15 mins)
  "Why does this matter for decision theory? Expected Utility Theory (EUT) assumes we can assign a single number to a lottery to rank it against others. This ticket breaks that."

  *   **Exit 1: Truncation.**
      *   "Can we just say 'EV is the limit of the first $N$ terms'?"
      *   *Problem:* Which $N$? And as we saw, the path to $N$ matters. If we define value by the physical flip order (Protocol A), we are implicitly imposing a *time preference* on states that are logically simultaneous in the probability space.
  *   **Exit 2: Dominance.**
      *   "Consider a variant ticket that pays exactly $1 less in the $n=2$ state."
      *   Protocol A says Ticket 1 $\approx 0.69$, Ticket 2 $\approx 0.19$. Ticket 1 dominates.
      *   But if we use Protocol B for Ticket 1 ($1.04$) and Protocol A for Ticket 2 ($0.19$), dominance holds.
      *   *The Trap:* If we allow reordering, we can construct a 'dominated' lottery that appears more valuable simply by summing its positives first. This violates the **Statewise Dominance** axiom.
  *   **Exit 3: Inadmissibility.**
      *   "The standard solution (Nover & Hájek, 2004): This lottery is **inadmissible**."
      *   We must restrict the domain of EUT to lotteries with **Absolute Convergence** (or at least bounded utility).
      *   *Cost:* We lose the ability to model unbounded utility functions (like pure St. Petersburg) without modification. We must accept that some mathematically describable gambles have no decision-theoretic value.

  ### 3. The "Physical Order" Objection (10 mins)
  "Someone will object: 'But the coin flips in time! $n=1$ happens before $n=2$. Protocol A is the physically correct one.'"

  *   **Rebuttal:** "Expected Value is not a cash-flow projection (NPV). It is a weighted average over the **State Space**."
  *   "The states $\{H, TH, TTH \dots\}$ are mutually exclusive possibilities that exist simultaneously in the probability model. Time enters only if you discount future payoffs. Here, the payoff is instantaneous upon stopping. There is no temporal reason to weight state $n=1$ 'before' state $n=2$ in the summation, only probabilistic weight."
  *   "If you insist on flip-order, you are conflating **Realization** (one path happens) with **Evaluation** (averaging all paths). Evaluation is atemporal."

  ### 4. Limitations of the Activity (5 mins)
  "I must be candid about what this game did *not* show."
  *   **Finite Invariance:** "In your worksheets, you summed 12 terms. For any *finite* $N$, the sum *is* order-invariant. $1 - 0.5 + 0.33$ is the same as $1 + 0.33 - 0.5$."
  *   **The Asymptotic Leap:** "The indeterminacy is purely asymptotic. You had to *extrapolate* the divergence. In the real world, we never reach infinity. So why care?"
  *   **Answer:** "Because decision theory guides action under uncertainty. If your valuation method depends on how you organize your spreadsheet rather than the gamble itself, your preference ordering is unstable. This game forces you to feel that instability."

  ---

  ## Part 5: Predicted Failure Modes & Instructor Notes

  **1. The "Physical Order" Insurgent**
  *   **Prediction:** At least one student (likely the most mathematically confident) will argue during the debrief that Protocol A is the "right" one because $n$ represents time.
  *   **Response:** Do not dismiss them. Validate that this is a common intuition (the "Pasadena Paradox" literature discusses this extensively). Then press them: "If I offer you this ticket, and I offer you a ticket that pays the same amounts but labels the states 'Red, Blue, Green' without numbers, how do you sum then?" Force them to admit that the *labeling* shouldn't change the EV, but the reordering does.

  **2. Calculator Fatigue**
  *   **Prediction:** Students will make arithmetic errors in the running totals, leading to noise in the data.
  *   **Mitigation:** The Protocol Cards provided above include the pre-calculated terms and running totals for the first 12 steps. Tell students: "Verify the first 3, then trust the card for the trend. We care about the *limit behavior*, not your addition skills."

  **3. The "House Wins" Cynicism**
  *   **Prediction:** Students may feel tricked that "no one can win" the auction.
  *   **Mitigation:** Frame the prize as secondary. The "win" is identifying the paradox. Offer the prize to the group that best articulates *why* there is no winner during the debrief.

  **4. The Finite Sum Limitation**
  *   **Candid Acknowledgement:** You cannot *show* indeterminacy in a 90-minute class because you cannot sum to infinity. You are simulating the *symptoms* of indeterminacy (divergent partial sums).
  *   **Script:** "You might say, 'But you stopped at 12 terms.' True. But notice Group B is trending to 1.04 and Group C to 0.35. They are not getting closer to each other; they are drifting apart. If we went to 1,000 terms, that gap would solidify. The activity compresses the asymptotic divergence into a visible trend."

  **5. Confusion with St. Petersburg**
  *   **Prediction:** Students will confuse this with the classic St. Petersburg Paradox (infinite EV).
  *   **Clarification:** "St. Petersburg is $1 - 1 + 1 - 1 \dots$ or $1 + 1 + 1 \dots$ (Infinite). This is $1 - 1/2 + 1/3 \dots$ (Undefined). Infinite is big; Undefined is broken. Today was about 'Broken'."

  ---

  ## Handout: Bidding Sheet

  **Group Number:** ______
  **Protocol Used:** ______

  **1. Based on your running totals, what is the limit of the series?**
     $____________

  **2. How confident are you (1-10)?**
     $____________

  **3. Why did you choose this summation order? (One sentence)**
     _________________________________________________________________________
     _________________________________________________________________________

  *(Seal this envelope. Do not open until the Instructor reveals the True EV.)*
