  My advisor is writing a chapter that sorts animals into Dennett's four kinds of minds — Darwinian, Skinnerian, Popperian, Gregorian — and I'm helping him pick the examples. His calls so far: spider, Darwinian; slime mold that finds the shortest route through a maze, Darwinian, "no history of its own at all"; honeybee, Darwinian too even though you can condition it to colors, on the grounds that conditioning in a bee only ever picks from a fixed menu; a robot trained end-to-end by reinforcement learning in a simulator, Skinnerian; octopus, Popperian; rat that takes a shortcut through a maze it's never been run in, Popperian; the crow that bent a straight wire into a hook to lift a baited bucket, Popperian and pointedly not Gregorian — "she invented it, nobody handed her the design"; a chimp working a taught lexigram board, Gregorian; an 18-month-old with about fifty words, already Gregorian.

  The new case, for the next section: a wild crow population where the tool template differs from valley to valley, juveniles acquire it by hanging around adults, and no single bird could plausibly have come up with that template on its own. But the individual bird he's describing also modifies the inherited design — bends it wrong at first, gets it right with practice, adn occasionally produces a variant nobody in the valley has made before. He's stipulating the details rather than arguing from fieldwork, so take them as given.

