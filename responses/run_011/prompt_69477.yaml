  This is a correct application of the Breeder's Equation ($R = h^2S$), which is the foundational utility of heritability estimates in quantitative genetics. Unlike the "Wrong" student claims, this statement does not commit the **individual attribution fallacy** (Claim 1, 5), the **between-group fallacy** (Claim 3), or the **cross-population fallacy** (Claim 4). It correctly treats $h^2$ as a population-level parameter used to predict the *mean response of a group* (the daughters) to selection *within the specific environment* where $h^2$ was measured ("that herd under that management").

  ***

  ### The Rules

  **1. Marta's Actual Rule: The Quantitative Geneticist's Validity Rule**
  *   **Definition:** Heritability ($h^2$) is a population variance ratio valid for predicting selection response ($R=h^2S$) or decomposing variance *within* a specific population and environment. It is **invalid** for attributing cause to individuals, explaining differences between distinct populations, or generalizing across different environments.
  *   **Fit:** Explains why Claims 1, 3, 5 are Wrong (individual/group attribution) and 2, 4, 6 are Right (population parameters/limits).
  *   **Verdict on Claim 7:** **Right** (Correct use of $R=h^2S$ within the reference population).

  **2. Alternative Rule A: The "Static Description" Heuristic**
  *   **Definition:** Heritability is purely a descriptive statistic of the *current* partitioning of variance. It licenses statements about the present state or theoretical limits, but forbids *forward-looking predictions* of future generations, as G×E interactions make stability an assumption, not a fact.
  *   **Fit:** Claims 1, 3, 5, and 7 all make inferences about outcomes (individual cause, group cause, offspring mean) and are marked **Wrong**. Claims 2, 4, 6 describe current parameters or hypothetical limits and are marked **Right**.
  *   **Verdict on Claim 7:** **Wrong** (It predicts the next generation's mean).

  **3. Alternative Rule B: The "No Genetic Quantification" Heuristic**
  *   **Definition:** You may discuss $h^2$ as an abstract parameter or attribute outcomes to *environmental* interventions, but you cannot translate $h^2$ into concrete numerical predictions (litres, points) specifically attributed to *genetic* selection.
  *   **Fit:** Claims 1, 3, 5, and 7 assign concrete or probabilistic causal weight to genes ("80% of why", "probably genetic", "mostly genes", "270 litres") and are **Wrong**. Claims 2, 4, 6 either discuss environmental interventions (Claim 2's "program"), null results (Claim 4), or abstract parameter shifts (Claim 6) and are **Right**.
  *   **Verdict on Claim 7:** **Wrong** (It assigns a concrete litre value to a genetic breeding outcome).

  ***

  ### How Claim 7 Splits Them
  Claim 7 is the wedge. Marta marks it **Right** because the Breeder's Equation is the *purpose* of $h^2$ in genetics. Alternative Rules A and B both mark it **Wrong**: Rule A forbids the prediction of the future entirely, and Rule B forbids attaching concrete units to genetic predictions. This separates Marta's expert knowledge from two plausible "cautious interpretation" heuristics that a student might derive from the first six examples.

  ***

  ### The Tie-Breaker Claim
  To distinguish between Alternative Rule A (Static) and Alternative Rule B (No Genetic Quantification), slip this into the exam:

  > *"Selecting for a trait with non-zero heritability produces a proportional shift in the population mean."*

  *   **Marta:** **Right** (Core principle of quantitative genetics).
  *   **Alternative Rule A (Static):** **Wrong** (It is still a forward-looking prediction about the population mean).
  *   **Alternative Rule B (No Genetic Quantification):** **Right** (It is abstract; it uses no concrete units like "litres" or "points" and speaks only of proportionality).

  This claim clears Rule B while trapping Rule A, isolating the "Static" heuristic as the distinct outlier.
