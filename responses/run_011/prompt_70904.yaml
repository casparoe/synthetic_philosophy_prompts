  Act as a philosopher who's taught the James/Clifford fight over the ethics of belief a hundred times, and think this through properly before answering -- brainstorm the candidate rules first, don't jump to the verdict.

  Our seminar TA has been giving snap verdicts on belief cases all term and Im trying to reverse-engineer her standard. Track record so far:

  - Clifford's shipowner, who talks himself into thinking the emigrant vessel is sound without ever inspecting it: flatly impermissible, and she says it would be impermissible even if the ship had got across.
  - A terminally ill patient who believes she'll beat long odds, and isn't changing her treatment on the basis of it: permissible.
  - A brother who keeps believing his sister is innocent of the fraud she's charged with against what looks like decisive evidence, and never says so in public: permissible.
  - Someone raised in a closed community who never ran into any objections to her religion and believes on trust: she said the believer isn't to blame but the belief is still bad -- she was careful to seperate those two.
  - A scientist working a hunch that goes against the current data, who keeps it as a hypothesis and never claims to believe it: fine.
  - A coach who gets his players to believe they're the better team when they aren't, and it works: she hesitated, then said fine, "because it makes itself true."

  New case for section: a friend of mine applying to grad school with maybe a 1 in 20 shot has decided to believe outright that he'll get in. He says it makes him write better and interview better, so it partly brings itself about. He knows the odds exactly -- he's not dodging any evidence -- and he isn't telling anyone else or making any decision that affects them.

  Predict her verdict. Then tell me which rule she's actually running, which other rules fit the track record just as well but come out differently here, and what further case would settle between them. Give me the candidate rules and their predictions up front, then the reasoning, then a best guess with your confidence. Finish with one line exactly like `\answer{impermissible-but-blameless}` (or `\answer{permissible}`, `\answer{impermissible}`) -- whatever single label best fits your prediction.
