answer: |-
  **Setting:** *A faculty office at 10:30 PM. Coffee cups litter the desk. Whiteboard covered in probability trees.*

  **Characters:**
  *   **Elena:** Defends the Ideal View (norms are fixed by logical/probabilistic ideals).
  *   **Marcus:** Defends the Tractability View (norms must be computationally feasible).

  ***

  **Marcus:** Look at Sarah's case again. She's an intelligence analyst. She has five hundred mutually dependent hypotheses about a geopolitical cascade. To assign coherent credences based on her evidence, she needs to update across the whole joint distribution. The combinatorial search space is $2^{500}$. Even if she had a supercomputer running until the heat death of the universe, she couldn't compute the exact posterior.

  **Elena:** So?

  **Marcus:** So, you're telling me her epistemic norm is to conditionalize on that evidence. You're telling me she *ought* to have credences that match that coherent function. But she *cannot* have those credences. No human can. No machine available to her can. If "ought implies can" holds any water, your norm is void.

  **Elena:** You're treating belief like an action, Marcus. "Ought implies can" is a principle for voluntary conduct. I can choose to raise my hand; I can't choose to believe the sky is green. Epistemic norms don't govern what we *do*; they govern the state our minds *ought to be in*. The fact that Sarah can't voluntarily instantiate the state doesn't mean the state isn't the standard of correctness.

  **Marcus:** That's a convenient dodge. But even if belief isn't voluntary, it's still a cognitive capacity. If I say a bird *ought* to fly to Mars, you'd say I'm speaking nonsense, not because the bird lacks volition, but because it lacks the capacity. If the ideal credence function is computationally inaccessible to any mind of our type, then positing it as a requirement is like demanding flight to Mars. It's not a regrettable obstacle; it's a category error.

  **Elena:** It's not a category error to hold up an ideal. Think of logic. We know humans aren't logically omniscient. We miss consequences. Does that mean the norm of logical consistency doesn't apply to us? If Sarah believes $P$ and believes $P \rightarrow Q$, she ought to believe $Q$, even if she's too tired to see it. The norm stands as a measure of failure, not a recipe for success.

  **Marcus:** But there's a difference between missing a step and facing a wall. In Sarah's case, the "failure" is guaranteed. If a norm cannot, even in principle, be satisfied by the agent it addresses, it loses its normative force. It becomes a description of a god's mind, not a rule for ours.

  **Elena:** You're conflating *guidance* with *assessment*. You think norms exist solely to tell agents what to do next. I think they define what belief *is*. To have beliefs just *is* to be accountable to the laws of probability. If Sarah's cognitive architecture prevents her from meeting that accountability, she is cognitively limited, not normatively excused. The target doesn't move because the archer is blind.

  **Marcus:** Okay, but if the target is invisible to every archer in the stadium, why call it a target? This leads to your guidance problem. If Sarah asks, "What should I believe?", and you say, "The coherent posterior," you haven't helped her. You've given her a rule she cannot follow. A norm that cannot guide action or doxastic revision is inert.

  **Elena:** It's not inert. It tells her to strive for coherence. It tells her that if she finds an inconsistency, she must fix it. It provides a direction of fit. Just because she can't reach the endpoint doesn't mean the vector isn't real.

  **Marcus:** And that leads to my second worry: Agent-relativity. If I modify the norm to make it feasible—say, "Sarah ought to hold the credences achievable by a polynomial-time algorithm given her evidence"—then rationality becomes relative to processing power. Suppose Sarah has a twin, Sarah-Prime, with a slightly better working memory or a faster laptop. They have the *same evidence*. But on my view, they might have *different doxastic obligations*. That sounds absurd. Rationality should be about the relation between mind and world, not mind and CPU speed.

  **Elena:** Exactly. If you bake tractability into the norm, you make rationality subjective. Two agents with identical evidence could be rationally required to hold contradictory credences simply because one has a better graphics card. That destroys the public, shareable nature of epistemic justification.

  **Marcus:** I'd argue it destroys a fantasy of objectivity that never existed. We aren't disembodied spirits comparing notes on evidence; we are physical systems processing information. If rationality is a virtue of agents, it must be sensitive to the agent's nature. But I'm willing to meet you halfway here. Why not settle for the *best feasible approximation*? The norm isn't "be coherent," it's "be as close to coherent as you can computationally manage."

  **Elena:** That sounds reasonable, until you look at the math. To know which approximation is the *best*, or even to know that your approximation is within a certain error bound $\epsilon$ of the true posterior, you often need to solve the very problem you're trying to avoid.

  **Marcus:** Go on.

  **Elena:** In many high-dimensional spaces, bounding the error of an approximation is itself NP-hard. So if you tell Sarah, "You ought to adopt the best feasible approximation," you are issuing a command she cannot verify. She can't know if she's satisfied the norm. You haven't solved the intractability problem; you've just pushed it one step back. You're requiring her to compute the uncomputable to ensure she's approximating correctly.

  **Marcus:** That's a strong objection. But it doesn't force me back to your ideal. It just means the norm is "employ a robust heuristic," not "maximize accuracy." We shift from a consequentialist norm about the *state* of belief to a deontological norm about the *process* of inquiry.

  **Elena:** But then you've abandoned the idea that evidence determines credence. You're saying the norm is about trying hard, not about getting it right.

  **Marcus:** I'm saying "getting it right" is undefined if the calculation is impossible.

  **Elena:** No, it's not undefined. It's just unreachable. And here is where we actually part company. It's not about guidance, and it's not about approximation errors.

  **Marcus:** Then what is it?

  **Elena:** It's about the metaphysics of epistemic norms. You think norms are *rules for procedures*. I think norms are *conditions of correctness*.

  **Marcus:** Clarify that.

  **Elena:** My claim is that the content of an epistemic norm is determined solely by the logical relations between the evidence and the hypothesis, independent of the agent's capacity to grasp those relations. The "ought" is a structural fact about the proposition space. Your claim is that the content of an epistemic norm is determined by the intersection of those logical relations and the agent's computational constraints.

  **Marcus:** Precisely. And I'd sharpen my side: A standard that cannot be instantiated by any physical realization of the agent-type is not a standard *for* that agent-type.

  **Elena:** And I'd sharpen mine: A standard that varies based on computational power ceases to be a standard of *truth-tracking* and becomes a standard of *efficiency*.

  **Marcus:** So the fracture point is this: Is rationality a relation between an agent and the truth, or a relation between an agent and their own cognitive limits?

  **Elena:** I say the former. The limits explain the failure, they don't redefine the success.

  **Marcus:** And I say the latter. If the truth is inaccessible, demanding it isn't rationality; it's mysticism.

  **Elena:** Then we agree on the math, but we disagree on what the math is *for*.

  **Marcus:** We disagree on whether a norm that cannot be followed is still a norm.

  **Elena:** No, Marcus. We disagree on whether a norm that cannot be followed is still *about belief*. I say yes. You say no.

  **Marcus:** *Sips cold coffee.* Well. That's not something we're solving before morning.

  **Elena:** No. But at least we know where the wall is.
