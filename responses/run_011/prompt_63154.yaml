answer: |-
  The server room hummed at a frequency Elena felt in her teeth. On her screen, the fMRI scans of Subject 4 and Subject 5 floated in mirrored suspension. They were identical. Not statistically similar—identical. The same bloom of activity in the anterior cingulate, the same flicker in the visual cortex when the red light flashed.

  But the transcripts were opposites.

  Subject 4, Julian, spoke in cascades. When the red light flashed, he described the color as having a temperature, a weight, a taste like copper pennies dissolving on the tongue. He mapped the topology of his attention, the way the sound of the cooling fan intruded upon the visual field like a jagged tear in velvet. He was baroque, exhausting, and utterly convinced of his own richness.

  Subject 5, Mara, was flat. When the red light flashed, she reported a behavioral adjustment. "I saw the signal. I pressed the button." When asked what it *felt* like, she shrugged. "Nothing. I'm the zombie you people keep drawing in chalk on the sidewalk. I've always been empty. I'm just telling you the truth so you can stop looking for ghosts."

  Elena was writing the paper. She was a good heterophenomenologist. She knew the drill: treat the subject as an informant from a foreign culture. You record their beliefs about their inner world. You construct the "heterophenomenological world"—the world as it seems to them. And then, with the scrupulous neutrality of an anthropologist cataloging a village's myths, you bracket the question of whether that world actually exists.

  You don't decide if the gods are real. You just note that the villagers pray to them.

  But typing the draft, Elena felt the bracketing clamp down like a vice.

  In the first week, it had been manageable. Julian's poetry was data. Mara's nihilism was data. The method held them both at arm's length, preserving the integrity of the study. But now, in the second week, the neutrality was curdling.

  She looked at the transcript from Tuesday's session. Julian had been crying. Not sobbing, just a quiet leakage of tears while he stared at the geometric patterns on the monitor.

  "It's like you're not listening," Julian had said. His voice was thick. "I'm telling you I'm burning. I'm telling you the light hurts. And you're writing it down like I'm describing the weather."

  "I am recording your report accurately," Elena had said. Her voice was steady, trained. "Your experience is the data."

  "No," Julian said. He leaned forward, the sensors on his scalp tightening. "The experience is the *thing*. The report is just the shadow. You're collecting shadows and pretending you have the objects. Do you believe me? Do you believe I'm actually in there?"

  Elena had paused. The method forbade the answer. To say "Yes" was to commit to the reality of his qualia, to break the bracket. To say "No" was to call him a liar. So she had said nothing. She had checked the audio levels and asked him to rate the intensity of the stimulus on a scale of one to ten.

  She looked at Mara's transcript from the same day. Mara had been reading a magazine while hooked to the rig.

  "You know," Mara had said, not looking up from a page about celebrity diets. "If you decide he's real, then I'm broken. If you decide I'm real, then he's hallucinating. But you won't decide. You're just going to write that we both exist in your little text world."

  "That is the goal of the study," Elena had replied.

  "It's not a goal," Mara said, finally looking up. Her eyes were dark, untroubled. "It's a erasure. You're treating me like a story he's telling, and him like a story I'm telling. You're making us both fiction."

  Elena stopped typing. The cursor blinked at the end of a sentence about "subjective validity conditions." It looked like a heartbeat.

  The betrayal wasn't that she doubted them. The betrayal was that her doubt didn't matter. The method required her to treat Julian's agony and Mara's void as equally provisional. By refusing to validate Julian's reality, she was telling him that his pain might be a fabrication. By refusing to invalidate Mara's emptiness, she was telling her that her honesty was indistinguishable from a deficit.

  But it weighed heavier on Julian. Mara claimed to be nothing; losing her ontology was consistent with her worldview. Julian claimed to be everything; treating him as a text was a kind of murder.

  She went back to the lab on Thursday. She needed one more session to close the loop. Julian was waiting in the booth. He looked tired. The baroque detail had gone out of his voice; he sounded hollowed out.

  "Ready?" Elena asked through the intercom.

  "Does it matter?" Julian said.

  "We need to complete the protocol."

  "I know." He looked at the red light. "Yesterday I tried to feel nothing. I tried to be like her. I thought maybe if I reported nothing, you'd stop looking at me like I'm a specimen jar."

  "And?"

  "It hurt more. Pretending I'm empty hurt more than being full." He turned to the camera. He knew she was watching. "Dr. Vance. If I tell you that right now, in this moment, I am terrified that I don't exist... is that data? Or is that a plea?"

  Elena's hand hovered over the key that would mark the timestamp. *Data.* It had to be data. If she treated it as a plea, she entered the world. She became a participant. She broke the bracket. If she treated it as data, she remained a scientist, but she became a monster.

  "It is a report on your heterophenomenological world," Elena said. Her voice sounded thin in the soundproofed room.

  Julian smiled. It was a terrible smile. It wasn't angry. It was pitying. "Okay. Then report this: The subject believes the researcher is a zombie."

  He turned back to the screen. The red light flashed.

  Elena recorded the button press. She recorded the latency. She recorded the verbal report: *Subject claims researcher lacks consciousness.* She filed it under *Meta-cognitive Commentary.*

  She went back to her office. The server hummed in the wall. She opened the document. She had to write the conclusion. She had to summarize the findings without resolving the contradiction.

  *Subjects 4 and 5 exhibit identical neural correlates,* she typed. *However, their heterophenomenological worlds are mutually exclusive. Subject 4 reports rich qualia. Subject 5 reports none. Under the method of heterophenomenology, both reports are treated as valid texts describing the subjects' respective stances.*

  She stopped. The words sat on the page, clean and sterile. They explained everything and nothing. They protected the science. They protected her tenure. They protected the method.

  But in the booth, Julian was sitting in the dark, waiting for someone to tell him he was real. And Mara was walking home, knowing she was just a mechanism pretending to be a person. And Elena was here, typing about them as if they were characters in a novel she was too cowardly to finish.

  She looked at the sentence again. *Both reports are treated as valid texts.*

  If they were just texts, then the pain Julian felt was just a description of pain. It wasn't pain. It was words about pain. If it was just words, then she hadn't hurt him. She had just recorded him.

  But the hum of the server seemed to deepen, vibrating in the hollow of her chest. She thought about the red light. She thought about the feeling of seeing red. Did she see it? Or did she just report seeing it?

  She looked at her own hands on the keyboard. She pressed a key. The letter 'a' appeared on the screen. She felt the plastic depress. She heard the click.

  *Report:* Key pressed. *Experience:* Resistance, sound, visual feedback.

  If she applied the method to herself, she vanished too. She became a text describing a woman typing.

  Elena deleted the conclusion. She typed a new line.

  *The disagreement between subjects is unresolvable by construction.*

  She stared at it. It was true. The method built a wall between the world and the report, and then claimed the wall was the view.

  She saved the file. She didn't send it. She sat in the chair, listening to the hum, waiting for someone to ask her if she was there, wondering if she would have the courage to lie.
