answer: |-
  This arrangement presupposes a fragmented, dual-process theory of moral judgment that is legally functional but philosophically incoherent. It relies on a distinction between **moral conviction as an obstacle** (bias) and **moral conviction as an instrument** (judgment), toggling between the two depending on the phase of the trial.

  Here is an analysis of the implicit theory, the pragmatic compromises, the underdetermined areas, and the radical alternative.

  ### 1. The Implicit Theory: The "Switchboard" Model of Conscience

  The system operates on a **Container Theory of Moral Judgment**. It assumes that a juror's moral landscape is divisible into two compartments:

  1.  **The Procedural Compartment (Guilt/Eligibility):** Here, moral convictions are treated as external noise or static. If a conviction is strong enough to override the judge's instructions (e.g., "I will never vote death"), it is classified as **bias**. The theory assumes that a "neutral" juror is one whose moral commitments are weak enough to be bracketed or suspended in favor of legal rules.
  2.  **The Substantive Compartment (Sentencing):** Here, moral convictions are treated as the signal. Once the legal thresholds are met, the juror is instructed to bring their "conscience" to bear. Here, moral commitment is classified as **judgment**.

  **The Presuppositions:**
  *   **Bracketing is Possible:** The system assumes jurors can cognitively and morally separate their general stance on capital punishment from the specific task of applying the law. It assumes a juror can say, "I generally dislike death, but if the law and facts demand it, I can impose it," without that general dislike coloring their fact-finding.
  *   **Directionality of Distortion:** While the law technically excludes those who would *automatically* vote for death (*Morgan v. Illinois*), in practice, the screening focuses heavily on those who would *never* vote for death (*Witherspoon/Witt*). This suggests an implicit assumption that pro-death sentiments are the "default" or "normative" baseline, while anti-death sentiments are the "deviation" requiring correction.
  *   **Rule vs. Value Distinction:** The system assumes there is a bright line between *applying a rule* (eligibility) and *making a value call* (selection). It presumes that weighing aggravation against mitigation is a moral act distinct from determining if the crime meets the statutory threshold for death.

  ### 2. Necessity vs. Convenience (Administrability and Finality)

  Much of this architecture is not driven by a coherent theory of moral psychology, but by Constitutional tightropes and administrative needs.

  **Strictly Needed (Constitutional Minimums):**
  *   **Individualized Sentencing:** Post-*Furman*, the system *must* allow for moral judgment in sentencing to avoid arbitrary imposition. A purely algorithmic sentencing phase would be unconstitutional. Therefore, the "moral faculty" part is necessary.
  *   **Impartiality:** The 6th Amendment requires jurors who can follow the law. Therefore, the "bias filtering" part is theoretically necessary to maintain the rule of law.

  **Convenient Fits (Systemic Stability):**
  *   **Death Qualification:** Screening out those who cannot impose death conveniently produces a jury that is empirically more conviction-prone. This serves the state's interest in securing verdicts without explicitly admitting to stacking the jury.
  *   **Silence on Nullification:** Telling jurors they *cannot* nullify preserves the **fiction of legal determinacy**. If jurors knew they had the moral authority to ignore the law, the system's claim to "rule of law" would weaken. However, *not* punishing nullification preserves the **safety valve of mercy**. This silence is purely for finality and legitimacy; it admits no coherent theory of when a juror *should* override the law.
  *   **The "Automatic" Standard:** It is administratively easier to ask "Would you *automatically* vote X?" than to probe the nuanced interplay of a juror's morals. This creates a bright line for judges, even if it fails to capture the reality of how moral judgment works.

  ### 3. Where the Practice is Underdetermined

  The current procedure (dismiss those with automatic views, keep those with discretionary views) is compatible with several rival philosophical accounts of bias. The law does not distinguish between them, meaning the procedure is **underdetermined** by theory.

  *   **Account A: Cognitive Flexibility.** Bias is an inability to process information. An "automatic" voter is cognitively closed. A "discretionary" voter is cognitively open.
      *   *Result:* Dismiss automatic voters.
  *   **Account B: Community Representation.** Bias is a deviation from community norms. Since the law (statute) represents the community's will, refusing to apply it is a deviation.
      *   *Result:* Dismiss those who reject the community's law.
  *   **Account C: Duty Ethics.** Bias is the prioritization of personal conscience over civic duty.
      *   *Result:* Dismiss those who prioritize conscience over duty.

  All three accounts justify *Witherspoon* screening, but they describe the juror's failure differently. Because the courtroom procedure looks the same regardless of which theory is true, the system avoids answering the deeper question: *Is the juror failing because they are closed-minded, or because they are morally courageous?* The procedure treats these as identical legal errors.

  ### 4. The Radical Alternative: If Morals Shape Perception

  If we take seriously the view (from hermeneutics and cognitive science) that moral commitments are **constitutive of perception**—meaning a juror's morals determine what they *see* in the evidence, not just how they react to it—then the current model collapses. You cannot bracket a lens through which you see the world.

  If there is "nothing there to bracket," selection would have to look radically different:

  1.  **From Filtering to Sampling:** Instead of trying to find "neutral" jurors (who don't exist under this theory), the goal would be **maximal moral diversity**. The jury would be constructed to represent a microcosm of conflicting moral frameworks, ensuring that no single moral "lens" dominates the fact-finding.
  2.  **Abolish Death Qualification:** If moral views shape evidence perception, excluding death-penalty opponents doesn't just remove bias; it removes a specific way of *seeing* the defendant's humanity. The system would have to allow jurors who oppose the death penalty, accepting that they might hang the jury. This treats a hung jury not as a failure, but as a successful detection of moral disagreement.
  3.  **Explicit Instruction on Moral Framing:** Judges would instruct jurors: *"Your moral background will influence how you interpret this evidence. You are not here to strip away your morals, but to expose them to the morals of others during deliberation."*
  4.  **Deliberation as the Site of Neutrality:** Neutrality would not be a precondition of the juror (voir dire), but an **outcome of the process** (deliberation). The "impartiality" would emerge from the friction between jurors with incompatible moral visions, rather than being pre-screened into a homogenous group of "law-followers."

  ### Summary

  The current US capital system presupposes that moral judgment is a **tool** that can be sheathed during the rule-application phase and unsheathed during the sentencing phase. It assumes convictions are biases only when they block the state's statutory machinery, but virtues when they operate within it.

  Most of this is **administrative convenience** dressed up as Constitutional necessity. It allows the state to claim it is following the rule of law (by screening out "biased" jurors) while outsourcing the moral responsibility for killing to the community (by demanding moral judgment in sentencing).

  If we acknowledged that moral commitments cannot be bracketed because they structure reality itself, the system would have to stop trying to purify the jury and start trying to **diversify** it, shifting the locus of legitimacy from the *selection* of the jurors to the *conflict* between them.
