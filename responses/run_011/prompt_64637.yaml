prompt: |-
  In US capital trials, prospective jurors get screened for the content of their moral views: someone whose opposition to the death penalty is strong enough that they couldn't apply the law as instructed gets dismissed for cause, and in principle the same goes for someone who says they'd automatically vote for death. Then the penalty phase turns around and hands that filtered jury a decision with no rule attached to it -- weigh aggravation against mitigation -- where the sentencer's own moral judgment is treated as the whole point of the exercise. And seperately the system leans on juries to nullify when the law would produce something unjust, while judges are told not to inform jurors they can.

  So what picture of moral judgment does this arrangement presuppose? I want the implicit theory of when a moral conviction counts as a bias to be filtered out and when it counts as the faculty doing the judging. Does it assume convictions can be bracketed at will, that conviction only distorts when it points one way, or that there's a difference in kind between applying a rule and making a value call that licenses both moves at once? Then tell me which parts the practice strictly needs versus which are just convenient fits -- maybe it's all administrability and finality with no theory underneath at all -- and where it's underdetermined, so that several rival accounts of the preference/bias line would license exactly the same courtroom procedure. Finally, what would selection have to look like if we took seriously the view that a juror's moral commitments shape what they can even see in the evidence, so there's nothing there to bracket?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Subject:** US capital trial jury selection and sentencing (specifically the tension between screening for bias and relying on moral judgment).
      *   **Key Tension:**
          1.  *Voir Dire:* Jurors are screened out if their moral views prevent them from applying the law (e.g., absolute opposition to death penalty = *Witherspoon/Witt* standard; absolute insistence on death = *Morgan* standard).
          2.  *Sentencing Phase:* The remaining jury is asked to make a highly moralized decision (weighing aggravation vs. mitigation) with broad discretion (*Furman/Gregg* era jurisprudence).
          3.  *Nullification:* The system implicitly relies on jury nullification for justice but forbids judges from instructing jurors about it.
      *   **Questions to Answer:**
          1.  What picture of moral judgment does this arrangement presuppose? (Implicit theory of bias vs. faculty).
          2.  Does it assume convictions can be bracketed? Is bias one-directional? Is there a rule/value distinction?
          3.  Which parts are strictly necessary vs. convenient (administrability/finality)?
          4.  Where is the system underdetermined (where rival theories yield the same procedure)?
          5.  What would selection look like if we accepted the view that moral commitments shape evidence perception (no bracketing possible)?

  2.  **Analyze the Implicit Theory of Moral Judgment:**

      *   *The Paradox:* The system wants jurors who *have* morals (to weigh mitigation) but not *too much* morals (if those morals conflict with the statute).
      *   *The "Switch" Theory:* It presupposes a dual-process model.
          *   Phase 1 (Guilt/Eligibility): Moral views are "biases" if they block the law. They are external obstacles to be removed.
          *   Phase 2 (Sentencing): Moral views are "judgment" if they operate within the law's framework. They are the engine of decision-making.
      *   *Bracketing:* It assumes jurors *can* bracket deep moral convictions during the eligibility phase but *should* engage them during the penalty phase.
      *   *Directionality:* It treats "no death penalty ever" as a bias, but "death penalty for murder" is often treated as the default (though "death penalty always" is technically excludable, it's harder to prove).
      *   *Rule vs. Value:* It distinguishes between *applying a rule* (can we impose death?) and *making a value call* (should we impose death?).

  3.  **Necessity vs. Convenience (Administrability/Finality):**

      *   *Strictly Needed:* To satisfy the 8th Amendment (*Gregg*), you need individualized sentencing. This requires moral judgment. To satisfy the 6th Amendment (impartial jury), you need jurors who can follow the law.
      *   *Convenient:* The "death qualification" process (screening out opposers) conveniently produces a conviction-prone jury (empirically supported). This serves the state's interest in securing death sentences without admitting it.
      *   *Nullification:* Banning instructions on nullification preserves the *appearance* of rule of law while keeping the *safety valve* of nullification. This is purely for systemic stability (finality + mercy), not theoretical consistency.
      *   *Theory underneath:* There isn't a coherent philosophical theory. It's a pragmatic compromise between *Furman* (stop arbitrary death) and *Gregg* (allow guided discretion).

  4.  **Underdetermination:**

      *   *Rival Accounts:*
          *   *Account A (Procedural Neutrality):* Bias is anything preventing rule-following.
          *   *Account B (Substantive Neutrality):* Bias is only extreme deviation from community norms.
          *   *Account C (Cognitive Capacity):* Bias is an inability to process information.
      *   *Same Procedure:* All three lead to dismissing the absolute pacifist and the absolute hawk. The line is drawn at "automatic" decisions. Whether that's because it violates neutrality, community standards, or cognitive flexibility doesn't change the *Witherspoon* outcome.

  5.  **Radical Alternative (Moral Commitments Shape Evidence):**

      *   *Premise:* If morals determine what you *see* (theory-laden observation), you can't bracket them.
      *   *Implication:* *Witherspoon* screening is incoherent. You can't find a "neutral" juror.
      *   *New Selection:*
          *   *Representative Cross-Section:* Stop trying to filter for "open-mindedness." Maximize moral diversity.
          *   *Explicit Framing:* Tell jurors, "Your morals *will* color this. Argue with each other."
          *   *Unanimity Requirements:* Strengthen the need for consensus to force moral negotiation.
          *   *Abolish Death Qualification:* Allow opposers, let them hang the jury (which functions as a form of nullification).

  6.  **Drafting the Response (Iterative refinement):**

