      *   *Section 3: Underdetermination.* Show how different philosophical justifications (Kantian duty vs. Utilitarian outcome vs. Civic Republicanism) all land on "no automatic votes."
      *   *Section 4: The Radical Alternative.* If morals are constitutive of perception, selection changes from *filtering* to *sampling*. Focus on deliberative diversity rather than individual neutrality.
      *   *Conclusion:* Summarize the fragility of the current model.

