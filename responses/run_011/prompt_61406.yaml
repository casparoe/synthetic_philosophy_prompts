answer: |-
  **The Boundary of the Dial: Legitimacy, Exclusion, and the Measurement of Stake**

  I work for a water district that does not map cleanly onto the political geography of the American West. Our jurisdiction covers eleven counties, straddles a state line, and includes two tribal nations that sit at the table not as voters but as sovereign partners under a compact. If you ask our hydrologists who belongs in the room when we decide pumping limits, they will point to a map of the aquifer. If you ask our political theorists, they will point to a paradox. The engineers assume the membership question is technical: whoever bears the hydraulic externality gets a say. The theorists know that "bearing an externality" is a normative claim disguised as a physical fact. My job is to live in the space between them, drafting bylaws that must hold up in court and in conscience.

  The core difficulty we face is not unique to water, though water makes it urgent. It is the boundary problem of democratic theory. To decide democratically who gets to vote, you must already have a group of voters to make that decision. As Robert Dahl noted decades ago, you cannot use democratic procedures to define the unit within which democratic procedures apply without circularity. You need a *demos* to decide the *demos*.

  In practice, two principles usually attempt to break this circle. The first is the *all-subjected principle*: everyone subject to the binding rules of the authority gets a vote. This is stable. It aligns with jurisdiction. But in a region like ours, where groundwater flows across county and state lines, the people most affected by a pumping ordinance often live outside the jurisdiction that enforces it. They are subjected to the consequences, but not the coercion. They are excluded.

  The second is the *all-affected interests principle*: everyone whose interests are affected gets a vote. This repairs the exclusion, but it creates a different disaster. Causal chains are infinite. A pumping limit in our district affects crop prices in the Midwest, which affects food costs in New York, which affects the budget of a single mother in Brooklyn. If everyone affected gets a vote, the electorate is everyone. Furthermore, the set of affected people changes with every agenda item. You cannot convene an election for every ordinance. And it grants equal standing to the person whose livelihood depends on the water and the person who merely reads about the aquifer in the news.

  In our district, we have been experimenting with a third way. I call it the *dial view*. We treat franchise not as a switch (on/off) but as a dial. There is no single, fixed *demos*. For each decision, there is a decision-specific electorate. The weight of a member's vote is a function of the depth and specificity of their stake in that particular decision. A resident inside the district boundary gets a full vote on our internal budget, because the budget is our business. That same resident gets a fractional vote on a pumping-limit ordinance. A downstream irrigation district that draws on the same aquifer but lies outside our boundary gets no vote on our budget, but a significant fractional vote on the pumping limit. To prevent an infinite regress of electorates deciding who gets to vote, the formula for calculating these weights—the *metering rule*—is fixed at the constitutional level. It is promulgated once and is not revisable by the bodies whose composition it determines.

  This sounds elegant. It satisfies the engineers by tracking the hydrology of impact. It satisfies the theorists by acknowledging that stakes vary. But it invites a devastating objection: it merely relocates the boundary problem. The metering rule is itself a decision with affected parties. Who decided that downstream farmers get a half-vote rather than a full vote? If the people decide the metering rule, we need a *demos* to authorize the metering rule, and we are back to the circularity, one level up.

  The question I want to answer today is whether this relocation is a solution or a dodge. Is the boundary problem a genuine threat to the claim that democratic decisions are legitimate, or is it a pseudo-problem generated by the assumption that the *demos* must be a fixed set? Does the dial view dissolve the circularity, or does it confirm that democracy at bottom always rests on a pre-democratic act of exclusion?

  My verdict is this: The boundary problem is a genuine threat to the claim of *pure* procedural legitimacy. The dial view does not dissolve the circularity; it moves it upstairs. And a relocated regress is not enough for foundational legitimacy. Democracy does rest on a pre-democratic act of exclusion—a founding, a border, a nation. However, for *operational* governance, the dial view is sufficient, provided we admit that the metering rule is not a democratic output but a constitutional constraint. We must stop pretending the metering rule is democratic. It is a pre-democratic agreement to bind ourselves to a specific way of measuring stake.

  To see why this distinction matters, let us work through a concrete case from our own docket: the Cross-Border Aquifer Ordinance of 2021.

  The ordinance proposed to cap industrial pumping in the northern sector of our district. The hydrology was clear: over-pumping in the north would lower the water table in the southern sector (inside our district) and in the adjacent tribal lands (outside our voting jurisdiction, inside our compact). Under the all-subjected principle, only the northern and southern residents within the district boundaries would vote. The tribal nations would be consulted, but not as voters. The downstream farmers in the next state would have no say at all, despite facing well failures.

  Under the dial view, we constructed an electorate specific to this ordinance. Residents in the northern sector received 1.0 votes (their land was directly regulated). Residents in the southern sector received 0.8 votes (their water table was threatened). The tribal nations received 0.8 votes (per the compact). The downstream farmers in the next state received 0.5 votes. The internal budget committee received 0.0 votes on this matter.

  The ordinance passed. But the challenge came not on the pumping limit, but on the weights. The downstream farmers sued, arguing that 0.5 was arbitrary. They argued their stake was existential, equal to the northern users, and thus they deserved 1.0. The northern users argued that giving outsiders any vote at all violated their sovereignty.

  Here is where the regress bites. To adjudicate the claim that 0.5 is the correct weight, you need a rule for weighing stakes. That is the metering rule. Who authored the metering rule? In our case, it was a panel of experts and legal counsel appointed during the district's formation thirty years ago. It was not voted on by the current electorate, because the current electorate did not exist yet. It was not voted on by the "all-affected," because that set was undefined.

  The metering rule is a border. It says: "We will measure stake by hydrological connection, not by economic dependency." If we measured by economic dependency, the New York mother might get a vote. If we measure by hydrology, she does not. That choice is political. It privileges a certain kind of connection over another. By fixing that choice at the constitutional level, we have insulated it from democratic revision. We have said, in effect, "This is the ground rule upon which democracy stands, and you cannot vote to change the ground."

  This confirms that the circularity is real. You cannot derive the metering rule democratically without assuming a *demos* to authorize it. If you try to vote on the metering rule, you must decide who gets to vote on the metering rule. If you use the dial view to decide the metering rule, you need a meta-metering rule. The regress is infinite.

  Therefore, the dial view does not solve the boundary problem. It acknowledges it and manages it. It admits that at the foundation of the district, there was a moment of non-democratic authority. Someone drew the line. Someone decided that hydrological stake counts more than economic stake. Someone decided that tribal nations get a compact seat rather than a ballot. That act was not legitimate because it was democratic; it was legitimate because it was accepted.

  This leads to my defended verdict: The boundary problem is not a pseudo-problem. It is a structural feature of collective action. The assumption that the *demos* must be a fixed set is indeed an error, and the dial view corrects that error for day-to-day policy. But the assumption that the *rules of the game* must be democratically generated is also an error. They cannot be. The metering rule must be treated as a pre-democratic constraint, akin to the laws of physics or the rules of arithmetic. You do not vote on whether 2+2=4 before you vote on the budget. Similarly, in this governance model, you do not vote on how stakes are measured before you vote on the stakes.

  Does this undermine legitimacy? Only if you believe legitimacy flows *solely* from procedural consent. If you believe legitimacy also flows from justice, or from effectiveness, or from the stability of expectations, then the dial view is robust. It is more just than the all-subjected principle because it includes the downstream farmers. It is more stable than the all-affected principle because it fixes the metering rule. But it purchases this stability by admitting that the foundation is not democratic.

  This has implications for which decisions are safe for the dial view and which are not.
  **Safe decisions:** Technical allocations, regulatory caps, infrastructure siting. These are decisions where the "stake" can be approximated by objective metrics (gallons of water, decibels of noise, tons of carbon). The metering rule here functions like a technical standard. The regress is benign because the metric is verifiable by non-political means.
  **Unsafe decisions:** Constitutional revisions, changes to the metering rule itself, questions of sovereignty. You cannot use the dial to decide how the dial works. If we proposed to change the voting weight of the tribal nations, we could not use the current voting weights to validate that change. That decision requires a different kind of authority—unanimous consent, or a return to the founding compact, or raw political negotiation. To apply the dial view to the constitution of the dial is to invite the vicious regress.

  So, is the boundary problem a threat? Yes, to the claim that democracy is a self-contained system of legitimacy. It is not. It is a system that rests on a shore of non-democratic fact. The dial view is not a magic wand that makes the shore disappear. It is a way of building a house that acknowledges the shoreline, rather than pretending the house floats in mid-air.

  For the engineers in the room: You are right that the externality defines the stake. But you are wrong that the measurement of that externality is technical. It is a political choice to measure water in gallons rather than in dollars of crop yield.
  For the theorists in the room: You are right that the circularity is real. But you are wrong to demand it be dissolved. It must be interrupted. The interruption is the constitution.

  We should stop asking "Who constitutes the people?" as if there is a true answer waiting to be discovered. We should ask "What rule for constituting the people allows us to live together without violence?" The dial view is that rule. It is not logically perfect. It is politically viable. And in the arid West, viability is the only legitimacy that keeps the taps on.

  ***

  **What Would Change My Mind**

  I have argued that the dial view fails to dissolve the circularity and that democracy necessarily rests on a pre-democratic act of exclusion (the fixed metering rule). I have claimed that this is acceptable because the metering rule functions as a constitutional constraint rather than a political variable.

  The single consideration that would push me to the opposite verdict—that the boundary problem *is* a pseudo-problem and the dial view *does* achieve full democratic legitimacy—is a successful account of **objective stake measurement**.

  My reasoning relies on the premise that measuring "stake" is inherently political. I assume that choosing to weight votes by hydrological connection rather than economic impact is a value judgment that cannot be democratically ratified without circularity. If it could be demonstrated that "stake" is a natural fact, discoverable rather than chosen—akin to mass or distance—then the metering rule would not be a pre-democratic exclusion. It would be a technical truth, like the rule that only adults can vote (based on the biological fact of maturity).

  If hydrology (or the relevant metric) could be shown to be the *only* rational way to define a stake in water governance, such that any other metric was not just different but *irrational*, then the metering rule would not be a political border. It would be a law of nature. In that scenario, the regress stops not because we imposed a constitution, but because there is no choice to be made. The "people" for a water decision would be defined by the water itself, not by us.

  I suspect this is false. I suspect that defining what counts as a "stake" is always a contestable political act (e.g., why does the farmer's livelihood count more than the ecosystem's survival, or the commuter's time?). But if I am wrong, and stake can be objectively metrified without normative discretion, then the dial view dissolves the circularity. The boundary problem would indeed be a pseudo-problem generated by the failure to recognize that the *demos* is determined by the physics of the problem, not the politics of the voters. Until that is proven, I maintain that the foundation remains pre-democratic.
