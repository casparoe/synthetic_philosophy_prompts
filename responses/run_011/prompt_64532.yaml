          *   The two halves are incompatible metaphysically but glued together by administrative necessity.
      *   **Concrete Changes:**
          *   Stop asking for numbers as "measurements."
          *   Charting: Change from "Pain 7/10" to "Request for Analgesia: High/Med/Low" or keep avowals verbal only.
          *   Behavioral scales should be distinct, not mapped to 0-10.
          *   The "30% reduction" rule must go (cannot measure reduction of an expression).
      *   **The "Obligation to Treat":**
          *   Why did the number become an order? Because reifying pain as a "Vital Sign" turned an expression into a datum. Data demands correction. Expressions demand response.

