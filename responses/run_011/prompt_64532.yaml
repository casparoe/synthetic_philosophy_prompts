  8.  **Final Polish:** Check against the prompt's specific questions (what would stop being askable, faces scales, etc.). Ensure the link between the "5th Vital Sign" and the metaphysical reification is clear. (The vital sign framing makes pain a *property of the body* like BP, rather than an *experience of the subject*.)

