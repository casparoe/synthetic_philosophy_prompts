      *   *Verdict:* The scale rests on a **hybrid illusion**. It *pretends* to be representational (tracking inner states) to justify patient autonomy, but *operates* behaviorally/normatively to justify resource allocation. This hybrid is unstable.
      *   *Reconciliation:* The two halves (speaking vs. non-speaking) are *not* reconcilable under the current metaphysics. They are two different language games forced onto one ruler.
