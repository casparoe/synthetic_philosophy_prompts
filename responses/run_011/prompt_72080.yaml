  0.32

  ### Decomposition

  I derive this credence from four probabilistic terms. Each term represents a necessary condition for the norm to generate a *net* reduction in existential risk, defined as (Risk Gated) − (Risk Displaced + Risk Delayed) > 0.

  1.  **$P_{dist}$ (Distribution of Risk): 0.60**
      *   **Definition:** The probability that existential risk is sufficiently distributed among the ~500 teams such that coordinating a significant fraction of them matters, rather than being dominated by one or two outlier actors who will ignore the norm.
      *   **Rationale:** While 500 teams suggests fragmentation, capability curves are often power-law distributed. There is a 40% chance that >80% of the risk concentrates in <10 teams who may view themselves as exceptions to the norm.

  2.  **$P_{stick}$ (Coalition Stability): 0.45**
      *   **Definition:** The probability that signing teams do not defect to non-signing jurisdictions or shell entities to bypass the delay, given the lack of legal enforcement and the competitive pressure of the 8-year horizon.
      *   **Rationale:** Voluntary cartels in high-stakes technology historically fracture under race dynamics. With 500 actors, monitoring is costly, and the incentive to "move fast" is existential.

  3.  **$P_{signal}$ (Assessor Validity): 0.25**
      *   **Definition:** The probability that the affirmative assent of two assessors carries genuine evidential weight regarding safety, rather than reflecting shared optimism bias or correlated error.
      *   **Rationale:** This is the critical bottleneck. Assessors are drawn from those with the "deepest interest in the capability." This selection criterion maximizes correlation in error (optimism bias) and minimizes the likelihood of a "no" vote. A 2-of-5 threshold with enthusiastic assessors functions as a rubber stamp, not a filter.

  4.  **$P_{race}$ (Delay Safety): 0.55**
      *   **Definition:** The probability that the induced delay does not increase risk by ceding advantage to adversarial actors (signing or non-signing) who might deploy protective capabilities more slowly or recklessly.
      *   **Rationale:** Delay is generally safety-positive for the deploying actor but can be risk-positive for the global system if it creates a power imbalance or incentives for shadow development.

  ### Combination Logic

  I model the net benefit as a constrained multiplicative function. The norm only reduces risk if the risk is distributed ($P_{dist}$), the actors stay in the coalition ($P_{stick}$), and the assessment actually filters danger ($P_{signal}$). The delay term ($P_{race}$) acts as a modifier on the magnitude of the benefit.

  $$ \text{Credence} \approx P_{dist} \times P_{stick} \times P_{signal} + \epsilon $$

  Where $\epsilon$ represents marginal reputational friction benefits even if the assessment fails.
  Calculation: $0.60 \times 0.45 \times 0.25 = 0.0675$.
  I adjust this upward to **0.32** to account for $\epsilon$: the norm may still create a focal point for shaming even if the assessment mechanism is flawed, and $P_{signal}$ may be slightly higher if "deepest interest" implies "deepest understanding of failure modes" rather than just "desire to deploy." However, the multiplicative drag of the assessor constraint keeps the number low.

  ### Sensitivity and Confidence

  *   **Most Sensitive Term:** $P_{signal}$ (Assessor Validity). If the assessors are truly independent safety-minded experts despite their "interest," this term rises to 0.8, pushing the final credence above 0.60. If they are purely capability-optimistic, it drops to 0.1, collapsing the credence to near zero.
  *   **Least Confident Term:** $P_{stick}$ (Coalition Stability). Human behavior under existential pressure and 8-year deadlines is notoriously difficult to model. Defection rates could be 5% or 95% depending on unmodeled social dynamics.
  *   **Moving Evidence:** The single piece of evidence that would move the number furthest is **historical data on voluntary safety boards in high-competition AI labs over the last 5 years.** Specifically, the rate at which internal or external advisory boards have successfully halted a major deployment against the wishes of the development team. If that rate is near zero, my credence drops to <0.10.

  ### Addressing the Disagreement (0.75 vs. 0.30)

  The gap between your credence (0.75) and your colleague's (0.30) is most plausibly accounted for by **$P_{signal}$ (Assessor Validity)**.

  *   **Your Framing:** You likely interpret "deepest interest in the capability" as **expertise**. Under this frame, the assessors are the best qualified to judge safety, making their agreement highly informative ($P_{signal} \approx 0.8$).
  *   **Colleague's Framing:** They likely interpret "deepest interest" as **incentive alignment bias**. Under this frame, the assessors are the most motivated to deploy, making their agreement a correlated error ($P_{signal} \approx 0.2$).

  This is a **disagreement about the framing of the proposition itself**, specifically the semantic interpretation of "interest." The text specifies "interest in the capability itself," which structurally favors the colleague's interpretation (capability progress vs. safety caution). If you update $P_{signal}$ to reflect the conflict of interest inherent in selecting the most enthusiastic researchers to gate their own enthusiasm, your credence should converge toward the colleague's.
