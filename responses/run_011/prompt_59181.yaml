answer: |-
  **The Scenario**

  Consider a high-performance liquid chromatography (HPLC) station in a routine quality control lab. The detector generates an analog voltage signal proportional to analyte concentration. This signal passes through a hardware splitter: one line feeds the primary integration computer, which processes the data and prints a Certificate of Analysis (the Report); the second line feeds a redundant, write-only archival drive that stores the raw voltage trace (Property P). The archival drive is optically isolated from the primary computer; no data flows from the archive to the printer. Property P is the specific magnetic configuration on the archival drive corresponding to the peak area. P is genuinely instantiated, physical, and covaries perfectly with the Report because both stem from the same detector signal. Yet P is causally inert regarding the Report: an intervention that alters the magnetic domains on the archival drive (changing P), while holding the primary computer's physical state fixed, produces no change in the printed Certificate. The accuracy of the Report regarding P is not lucky; it is guaranteed by the shared causal ancestry. We, as external engineers, warrant the claim that the Report accurately describes P because we designed the splitter and verified the isolation; the agents inside the system (the software) have no access to the archive, only to the primary signal.

  **Causal Audit**

  The causal chain producing the Report begins with the chemical interaction in the flow cell, generating a photon flux converted to voltage by the detector. This voltage causes a state change in the primary computer's memory, which executes an algorithm to calculate peak area, finally causing the printer to mark the paper. Property P appears only on the divergent branch of the splitter. It is a physical effect of the detector signal, identical in origin to the data used for the Report, but it sits on a causal dead-end. P does not appear in the chain leading to the Report at any link. The correlation between P and the Report is explained entirely by their common cause (the detector voltage), not by any influence of P on the Report.

  **The Paradox of Phenomenal Judgment**

  1.  Phenomenal properties (qualia) are causally inert with respect to physical judgments.
  2.  Physical judgments about qualia are accurate (they track qualia).
  3.  If a property is causally inert with respect to a judgment, the judgment cannot track it non-accidentally.
  4.  Therefore, physical judgments about qualia are either inaccurate or miraculously accurate.

  My case instantiates Premise 1 (P is inert regarding the Report) and Premise 2 (the Report tracks P). It challenges Premise 3. The case demonstrates that a judgment can track an inert property non-accidentally if both the property and the judgment share a common physical cause. The "miracle" is dissolved by the structural redundancy of the setup. However, the case does not instantiate the metaphysical necessity often attributed to phenomenal inertness; the isolation here is engineering, not law.

  **Load-Bearing Feature and Ablation**

  The load-bearing feature is the **Common Cause Structure**. The accuracy of the Report relative to P depends entirely on the splitter ensuring both systems receive identical inputs. If we ablate this feature—disconnecting the splitter so the archival drive receives independent noise—the tracking relation vanishes. The Report remains caused by the detector, but P becomes random relative to the Report. Without the common cause, the paradox re-emerges: we would have an inert property P and a Report that no longer matches it. Thus, the case only works because the "inert" property is a shadow of the active cause. This reveals that the paradox of judgment is not about inertness per se, but about explaining the correlation without direct causation.

  **The Epiphenomenalist Reply**

  A defender of epiphenomenalism might argue that this case fails to capture the **constitutive** nature of phenomenal judgment. In the lab scenario, the Report describes P only because we, the designers, stipulated the mapping between voltage and concentration. The software does not "know" the archive exists. In the phenomenal case, the subject does not merely correlate with experience; the judgment is *about* the experience in a way grounded by acquaintance. The relation between pain and the report "I am in pain" is not like the relation between the archive and the certificate; it is immediate. The lab case relies on external verification (the schematic) to warrant accuracy, whereas the phenomenal case relies on internal access. This reply succeeds in highlighting a disanalogy: the lab case solves the access problem from the outside, while the mind must solve it from the inside. However, advancing this reply risks presupposing that acquaintance implies causal efficacy, which is precisely what the epiphenomenalist denies. They must claim acquaintance is a non-causal relation, which remains coherent but metaphysically costly.

  **Verdict**

  This case shows that the logical structure of the paradox—accurate tracking without direct causation—is not unique to philosophy of mind. It is a generic puzzle solvable by common-cause structures. Therefore, the paradox should be weighed as a theoretical cost rather than a refutation; it demands an explanation of the correlation (like the splitter), not a denial of inertness. However, the phenomenal case possesses a feature no constructed analogue can reproduce: the **first-person warrant**. In the lab, we know the Report matches P because we see the wiring. In the mind, we know our reports match our experience without seeing any wiring. The lab case explains how tracking is possible physically, but it cannot explain why the tracking feels transparent to the subject. Thus, the case neutralizes the charge of logical impossibility but leaves the mystery of subjective access intact.
