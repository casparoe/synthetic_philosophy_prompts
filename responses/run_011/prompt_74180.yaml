      *   (1) says: Illusion $\neq$ False.
      *   (3) says: Illusion + No Evidence -> Reject.
      *   (8) says: If Wish-Driven -> Reject.
      *   The problem isn't the genetic fallacy per se; it's the *criterion of demarcation*. How does Freud distinguish between a "wish-fulfilling illusion" (religion) and a "wish-fulfilling theory" (psychoanalysis) that claims to be scientific?
      *   The break happens at **(4)**. Freud *does* restrict the scope, just not explicitly in the way the user thinks. He relies on a notion of "reality testing" that psychoanalysis supposedly passes and religion doesn't.
