answer: |-
  **SEMINAR HANDOUT: PERSISTENCE – JOINT STATEMENT OF AGREEMENT AND DISAGREEMENT**
  **Course:** Graduate Seminar on Metaphysics
  **Topic:** Endurantism vs. Perdurantism (Worm Theory)
  **Prepared by:** Teaching Staff (in consultation with seminar participants)

  ---

  ### I. SUBSTANTIVE AGREEMENTS
  *The following claims are endorsed by both the Endurantist and Perdurantist positions represented in this seminar. These are not trivialities; they are the shared constraints within which our disagreement operates.*

  1.  **The Neutrality of Location Vocabulary:**
      Both sides agree that the primitive relation "exactly located at" maps an object to a spacetime region. We agree that this relation must be defined *without* presupposing a specific mereological structure. Specifically, to say an object $O$ is "wholly present" at region $R_t$ is to say $O$ stands in the exact location relation to $R_t$, and there is no part of $O$ that is not located at $R_t$. We agree to avoid analyzing "wholly present" as "has all its temporal parts at $t$," as this begs the question against Endurantism, and we agree to avoid analyzing it as "is multilocated," as this begs the question against Perdurantism. The disagreement concerns whether the *same* $O$ can stand in this relation to multiple disjoint regions $R_{t1}, R_{t2}$.

  2.  **The Temporary Intrinsics Constraint:**
      Both sides agree that any viable theory of persistence must solve the problem of temporary intrinsics without logical contradiction. We agree that it is contradictory for an object to be *simpliciter* $F$ and *simpliciter* not-$F$. Therefore, any account must relativize property instantiation either to times (Endurantism) or to parts (Perdurantism). We agree that a successful theory must explain how change is possible without violating the Law of Non-Contradiction, and that "change" requires the instantiation of incompatible properties relative to different temporal coordinates.

  3.  **Diachronic Unity Conditions:**
      Both sides acknowledge a debt to explain the unity of persisting objects.
      *   The Perdurantist owes an account of what relates distinct temporal parts into a single spacetime worm (e.g., causal continuity, qualitative similarity, or counterpart relations).
      *   The Endurantist owes an account of what grounds the numerical identity of an object across different times (e.g., substance sortals, haecceity, or primitive identity).
      *   **Agreement:** Neither side is permitted to treat persistence as brute fact without offering principled criteria for when a series of momentary stages or time-slices constitutes a single persisting entity versus a succession of distinct entities.

  4.  **The Role of Physics:**
      Both sides agree that empirical physics fixes the geometry of spacetime (e.g., Newtonian absolute time vs. Relativistic spacetime), but does not strictly dictate the metaphysical category of persisting objects. We agree that Special Relativity complicates the definition of "simultaneity slices" required for Endurantism, but does not logically entail Perdurantism. Conversely, we agree that classical mechanics presupposes enduring objects but does not logically entail Endurantism. Metaphysics must be compatible with physics, but is not settled by it.

  ---

  ### II. MAP OF DISAGREEMENTS
  *For each row, the "Neutral Formulation" is the claim both parties agree is the locus of contention. The "Positional Phrasing" indicates how each side articulates the claim using their preferred ontology. The "Flag" indicates whether the seminar staff assesses this as a genuine ontological disagreement or a verbal/semantic divergence.*

  | # | Neutral Formulation | Endurantist Phrasing | Perdurantist Phrasing | Flag (Genuine/Verbal) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Temporal Mereology:** Do persisting objects have proper parts that are temporally shorter than the whole object? | **No.** Objects have only spatial parts. Temporal division yields distinct objects or stages, not parts of the *same* object. | **Yes.** Objects are extended in time and have temporal parts analogous to spatial parts. A momentary slice is a part of the worm. | **Genuine.** (Turns on the definition of 'part', but reflects deeper commitment to spacetime analogy). |
  | **2** | **Multilocation:** Can a single entity be exactly located at multiple disjoint spacetime regions? | **Yes.** This is required for an object to be wholly present at $t_1$ and wholly present at $t_2$. | **No.** Exact location is a functional mapping. One entity occupies one spacetime region (the worm). | **Potentially Verbal.** (Depends on whether 'exactly located' is defined as 'occupies the region of the object's extension' or 'is present at'). |
  | **3** | **Existence at $t$:** What is the truth-maker for "$O$ exists at $t$"? | **Presence.** $O$ itself is present at $t$. The whole object is the truth-maker. | **Parthood.** A temporal part of $O$ is present at $t$. The whole worm is not at $t$. | **Genuine.** (Reflects different ontological commitments regarding what is 'at' the time). |
  | **4** | **Change:** How does an object undergo intrinsic change? | **Relational/Adverbial.** $O$ is $F$-at-$t_1$ and not-$F$-at-$t_2$. Properties are time-indexed relations. | **Distribution.** Part-$P_1$ is $F$; Part-$P_2$ is not-$F$. The worm changes by having parts with different properties. | **Potentially Verbal.** (Both solve the contradiction; disagreement is on whether properties are relations or monadic). |

  ---

  ### III. THE CRUXES: PRE-REGISTERED PREDICTIONS
  *To prevent further talking past one another, the following three specific cruxes have been identified. Both parties have committed to the following predictions and conditions for theory abandonment.*

  #### Crux 1: The Lonely Homogeneous Discs (Black's Discs)
  **The Case:** Two perfectly homogeneous discs exist in an otherwise empty universe. One is stationary; one is spinning on its axis. There is no qualitative difference between their spatial parts at any instant, nor any external relation to other objects.
  **The Metaphysical Issue:** Can instantaneous states ground dynamic properties (velocity/spin), or do dynamic properties require temporal extension?

  *   **Agreed Bearing:** This case tests whether instantaneous temporal parts (Perdurantism) or instantaneous wholly-present objects (Endurantism) can bear velocity vectors.
  *   **Endurantist Prediction:** The scenario is either metaphysically impossible, or the difference between spinning/stationary must be grounded in dispositional properties or relations to time, not instantaneous intrinsic states.
  *   **Perdurantist Prediction:** The scenario is possible. The spinning disc has instantaneous temporal parts with non-zero velocity vectors; the stationary disc has instantaneous parts with zero velocity vectors.
  *   **Condition for Abandonment:**
      *   *Endurantist:* Will abandon if convinced that velocity is a fundamental property of an object *at an instant* that does not require analysis over a time interval (Ockham's razor favors the simpler instantaneous ground).
      *   *Perdurantist:* Will abandon if convinced that velocity is *essentially* a relation between positions at different times, making instantaneous temporal parts incapable of grounding spin without reference to neighboring parts (undermining the independence of the instant).

  #### Crux 2: The Argument from Vagueness (Lewis/Sider)
  **The Case:** A sorites series where it is vague whether a collection of stages at $t_1$ is composed of the same object as stages at $t_2$.
  **The Metaphysical Issue:** Does vagueness in persistence conditions imply vagueness in existence (ontic vagueness), or does it force unrestricted composition?

  *   **Agreed Bearing:** This tests whether diachronic composition is restricted or unrestricted.
  *   **Endurantist Prediction:** The argument fails because vagueness is semantic or epistemic, not ontological. Composition can be restricted without entailing indeterminate existence.
  *   **Perdurantist Prediction:** The argument succeeds. If composition is restricted, existence becomes vague. Since existence cannot be vague, composition must be unrestricted (Four-Dimensionalism follows).
  *   **Condition for Abandonment:**
      *   *Endurantist:* Will abandon if convinced that ontic vagueness is incoherent *and* that semantic vagueness cannot plausibly account for borderline cases of identity without collapsing into epistemicism.
      *   *Perdurantist:* Will abandon if convinced that restricted composition can be formulated with precise (non-vague) boundaries, even if those boundaries are not knowable or are unnatural.

  #### Crux 3: Quantifier Carving (Metaphysical Semantics)
  **The Case:** The debate over whether our logical quantifiers ($\exists$) map to the fundamental structure of reality ("carve at the joints").
  **The Metaphysical Issue:** Is the dispute merely about how we use language, or about the structure of the world?

  *   **Agreed Bearing:** This tests whether the 3D/4D debate is substantive or merely verbal/semantic.
  *   **Endurantist Prediction:** Quantifiers need not carve at the fundamental joints to be useful or true. 3D quantification is legitimate even if 4D structure is more "fundamental" in physics.
  *   **Perdurantist Prediction:** Metaphysics aims to describe fundamental structure. If 4Dism captures the joint-carving structure of spacetime and 3Dism does not, 3Dism is false (not just linguistically different).
  *   **Condition for Abandonment:**
      *   *Endurantist:* Will abandon if it is demonstrated that 3D quantification is systematically gerrymandered in a way that prevents it from supporting genuine causal explanations.
      *   *Perdurantist:* Will abandon if it is demonstrated that 3D quantification carves reality just as well as 4D quantification (i.e., if 'object' is as natural a kind as 'spacetime worm').

