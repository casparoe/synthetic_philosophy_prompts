      *   **Perdurantism/Worm Theory (4Dism):** Objects are spacetime worms. Temporal parts are fundamental. "Wholly present" is incoherent or means "has all temporal parts at t" (which is false for worms).
      *   **The "Talking Past Each Other" Problem:** Often stems from different definitions of "part," "location," "existence at," and whether temporal extension is analogous to spatial extension.

  3.  **Drafting Section 1: Agreed Claims (Substantive):**
      *   *Goal:* Things both can sign without feeling they've surrendered their core thesis.
      *   *Location Vocabulary:* Need to define "exactly located at" without assuming parts. *Idea:* Use region occupation. Both agree an object occupies a spacetime region. Disagree on the *shape* of that region relative to the object's mereology.
      *   *Temporary Intrinsics:* Lewis's problem. Both agree properties change. Both agree contradiction arises if $O$ is $F$ at $t_1$ and not-$F$ at $t_2$ without relativization. Endurantist relativizes to times (adverbialism or relations). Perdurantist relativizes to parts. *Agreement:* A solution must avoid logical contradiction ($Fa \land \neg Fa$).
      *   *Unity Conditions:* Both need a principle of unity. Endurantist: Diachronic identity conditions. Perdurantist: Genidentity/Counterpart relations between stages. *Agreement:* We both need an account of what makes a series of temporal slices/stages count as one persisting entity.
      *   *Physics:* Physics gives the spacetime structure (Newtonian vs. Relativistic). It doesn't dictate the *metaphysical* interpretation of persistence (though it constrains it, e.g., simultaneity slices in SR). *Agreement:* Physics fixes the geometry; metaphysics fixes the ontology of objects within that geometry.

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Goal:* Isolate where they actually diverge.
      *   *Row 1: Temporal Parts.* Neutral: Do persisting objects have proper parts that are temporally shorter than the whole? End: No (only spatial parts). Perd: Yes. *Verbal?* Partly depends on definition of "part."
      *   *Row 2: Multilocation.* Neutral: Can one entity be exactly located at multiple disjoint regions? End: Yes. Perd: No (violates function of location). *Verbal?* Depends on "exactly located."
      *   *Row 3: Existence at t.* Neutral: What does it mean to say $O$ exists at $t$? End: $O$ is wholly present. Perd: $O$ has a part at $t$. *Genuine?* Yes, ontological commitment.

  5.  **Drafting Section 3: The Cruxes (The User's Specific Requests):**
      *   *Crux 1: The Lonely Homogeneous Discs (Black's Discs).*
          *   *Issue:* Intrinsic difference between spinning/stationary homogeneous disc.
          *   *Perd:* Needs instantaneous velocity vectors on temporal parts. If instantaneous parts exist, they can bear velocity.
          *   *End:* If the object is wholly present, how does it spin without parts moving?
          *   *Agreed Case:* The scenario tests whether instantaneous states can ground dynamic properties.
          *   *Predictions:* End: Scenario impossible or requires hidden structure. Perd: Scenario possible, grounded in instantaneous temporal parts.
          *   *Abandon Condition:* End: If physics confirms instantaneous velocity is fundamental. Perd: If physics shows velocity is only defined over intervals.
      *   *Crux 2: Vagueness of Composition (Lewis/Sider).*
          *   *Issue:* Vagueness in persistence leads to vagueness in existence.
