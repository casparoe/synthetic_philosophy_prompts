answer: |-
  1.  **The Dead Claimant Condition**
      *   **Case:** The deathbed promise kept in secret, promisee long dead.
      *   **Motivation:** Bindingness cannot depend solely on the promisee's current expectation or ability to release, or the obligation vanishes when they die. The duty must survive the relationship.
      *   **Status:** Non-negotiable.

  2.  **The Autonomy Condition**
      *   **Case:** A promise extracted after three days of no sleep and steadily escalating pressure.
      *   **Motivation:** Bindingness requires valid consent. Coercion or incapacitation voids the commitment regardless of the words spoken.
      *   **Status:** Non-negotiable.

  3.  **The Control Condition**
      *   **Case:** A promise about a feeling rather than an act ("I promise I'll never resent you").
      *   **Motivation:** 'Ought implies can.' You cannot bind yourself to involuntary states. The theory must distinguish between committing to an effort vs. committing to an outcome outside voluntary control.
      *   **Status:** Non-negotiable.

  4.  **The Redundancy Condition**
      *   **Case:** A promise to do exactly what you were already morally required to do anyway.
      *   **Motivation:** The theory must explain whether this creates a *second* obligation (double bind) or merely reiterates the first. A commitment layer must know if it adds normative weight or just noise.
      *   **Status:** Non-negotiable.

  5.  **The Authority Condition**
      *   **Case:** An agent that commits beyond its mandate, where the other side can't check the mandate.
      *   **Motivation:** Validity depends on capacity. If the agent lacks the power to commit, the utterance is null, even if the counterparty reasonably believes otherwise (unless estoppel applies).
      *   **Status:** Non-negotiable (for agents).

  6.  **The Illocutionary Condition**
      *   **Case:** A plain message saying "I'll pick you up at 6," with no promissory language.
      *   **Motivation:** Bindingness is a function of context and uptake, not just keywords like "promise." The theory must handle implicit commitments generated by assertion + reliance.
      *   **Status:** Non-negotiable.

  7.  **The Harm Condition**
      *   **Case:** A promise whose being kept leaves the promisee worse off than breaking it would.
      *   **Motivation:** The purpose of promising is to coordinate benefit. If the promise becomes harmful to the promisee, the theory must account for why they can release it, or why it becomes void.
      *   **Status:** Contingent (depends on whether you prioritize fidelity or welfare).

  8.  **The Irrevocability Condition**
      *   **Case:** Whether you can promise not to release yourself from a promise.
      *   **Motivation:** Defines the distribution of power. Can the promisor bind their future self's power to negotiate release? This determines the rigidity of the system.
      *   **Status:** Contingent (design choice).

  9.  **The Distinction Condition**
      *   **Case:** Promise vs. contract, intention, assurance, threat, vow.
      *   **Motivation:** A contract requires consideration; intention creates no duty to the other; assurance is a prediction; a threat is conditional harm; a vow is often non-reciprocal. The theory must not collapse these into "binding utterance."
      *   **Status:** Non-negotiable.

  10. **The Wronging Condition**
      *   **Case:** That the promisee and only the promisee gets wronged; compensation doesn't obviously cure the wrong.
      *   **Motivation:** Specifies the locus of the injury. It is a personal right, not a general debt. Paying damages acknowledges the breach but doesn't erase the specific wrong done to the claimant.
      *   **Status:** Non-negotiable.

  ***

  **Joint Unsatisfiability**

  The following three cannot all hold:
  1.  **The Dead Claimant Condition** (Secret promises bind without reliance/claimant).
  2.  **The Autonomy Condition** (Coercion invalidates based on internal state).
  3.  **Your Implementation Constraint** (Nothing can depend on uncheckable external facts).

  **The Drop:** I drop your Implementation Constraint.
  **Why:** It wrecks the theory. You cannot adjudicate coercion (Autonomy) or verify the existence of a secret commitment (Dead Claimant) using only externally visible data. A promise is fundamentally a mental act manifested outwardly; if you ban reference to the mental act, you cannot distinguish a promise from a prediction under pressure. For software agents, "internal state" is loggable, but when negotiating with humans, you must model human intent. If you forbid modeling hidden intent, you cannot detect duress.

  **The Kingmaker:** **The Dead Claimant Condition.**
  This requirement does the most work knocking out otherwise plausible theories. It immediately eliminates any theory grounding bindingness solely in *reliance* or *expectation* (since the dead rely on nothing) or solely in *social practice* (since secret promises exist outside the practice). It forces the theory to acknowledge a deontic force generated by the promisor's will alone.

  ***

  **Standard Families Assessment**

  *   **Will Theory:** Satisfies Dead Claimant and Autonomy, but fails your Implementation Constraint (requires access to internal intent).
  *   **Reliance Theory:** Satisfies Implementation Constraint, but fails Dead Claimant (no reliance = no bind) and Wronging Condition (makes it about harm, not right).
  *   **Practice Theory:** Satisfies Distinction and Wronging, but fails Autonomy (rules bind regardless of consent) and Dead Claimant (no public practice = no bind).
