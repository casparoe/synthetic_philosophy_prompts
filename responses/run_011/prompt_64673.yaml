  Hi there,

  This is a fascinating puzzle about the ethics of criticism and the epistemology of taste. Your working rule is sophisticated because it tries to balance honesty about your own experience with the practical necessity of relying on others, drawing a line based on accessibility and shared sensibility. It handles the hard cases of the soup and the Persian poem very well, as those are clear instances where the relevant features are genuinely inaccessible to you, either physically due to your cold or linguistically due to the language barrier. In those cases, borrowing the verdict of someone who notices the same things you would is the only way to participate in the conversation at all, and your rule correctly permits you to assert those judgments flat out. The initial verdict on the out-of-print novel also fits comfortably, as the book was inaccessible, making the critic your only window into the work.

  However, when we test the rule against your other verdicts, there are two places where it forces you to give up your current instincts. The first is the wine. You say you will tell people the bottle is worth forty quid based on the critic's word. Wine is an accessible medium; you can taste it. Unless you are asserting this after tasting it yourself, in which case you are relying on experience not testimony, your rule forbids asserting the value judgment flat out. You should instead be hedging, saying the critic thinks it is worth it. The second conflict is the claim that the Romanian film's last twenty minutes drag. You distinguish this from the claim that the film is superb, treating the pacing as a flat fact. But pacing is an aesthetic value judgment, not a descriptive fact like the existence of a twist. Since the film is accessible to you, your rule dictates that testimony on this point should also be hedged, yet you intend to repeat it flat out. So to be consistent with your rule, you would need to hedge on the wine and the pacing.

  The anxiety you feel about the novel, where your willingness to assert depends on library stock, is actually the rule working as intended, but it highlights why the rule might be too rigid. The book hasn't changed, so why should your speech act change? A simpler rule might be that testimony from a trusted source is always a reason to assert, provided you attribute the view. This would overturn your verdict on the film, allowing you to say it is superb on your mate's word, and it would resolve the novel inconsistency, allowing you to call it magnificent regardless of its print status. This simpler rule is arguably better for a columnist because it prioritizes the transmission of trusted expertise over the strict phenomenology of your own experience, which is often what readers want from a roundup column. It acknowledges that your column is a map of the cultural landscape drawn from multiple surveyors, not just a diary of your personal encounters.

  Regarding the two new cases you mentioned, your current rule makes clear predictions. In the case of the person with sharper ears but different values calling a moving piece kitsch, your rule would force you to hedge. Even though the music is accessible, the condition that they notice roughly the same things you would is failed because their values are completely different; they are hearing the object through a different evaluative framework than you. Therefore, you cannot borrow their verdict as your own. In the case of your partner calling a song harmonically lazy, after which you start hearing it that way, the verdict becomes yours. The testimony served its function as a reason to look, or in this case listen, more closely. Once you genuinely hear the laziness, the judgment is grounded in your own perception, so you may assert it without attribution. It is no longer their verdict borrowed, but your own verdict arrived at through their guidance.

  Best of luck with the column,

  A Friend
