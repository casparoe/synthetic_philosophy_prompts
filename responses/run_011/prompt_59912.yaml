prompt: |-
  I have just joined the ethics committee of a hospital that is rewriting its policy on withdrawing life-sustaining treatment, and I have been asked to specify what any account of the distinction between doing and allowing harm would have to deliver before it could be allowed to underwrite that policy. Write that specification rather than a defence of any particular account: a list of requirements, each with the case or consideration that motivates it. Please make sure it addresses, at minimum, these pressures, and tell me what else I have missed — that withholding and withdrawing are widely held to be morally equivalent yet feel nothing alike to the clinicians performing them; that in withdrawal the physician's act is a but-for cause of death, so the account owes either a metaphysics of absence causation and double prevention or a willingness to say the death was caused; that omissions appear to have no principled boundaries, since alongside anything one does there are indefinitely many things one fails to do; whether the asymmetry is a threshold or a scalar weight, and how it is supposed to trade off against numbers; whether the distinction is doing independent work or merely shadowing the intended/foreseen distinction; and whether it survives when the agent is a team acting under protocol rather than a person with a hand on the machine. Then rank the requirements as non-negotiable versus the preferences of particular camps, identify the single one that disqualifies the most candidates, and say whether any subset of them is jointly unsatisfiable. A short note on how the two or three most-discussed accounts fare is welcome at the end, but the weight belongs on the list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Member of a hospital ethics committee.
      *   **Task:** Write a *specification* (a list of requirements) for an account of the doing/allowing harm distinction (D/A) to be used in a policy on withdrawing life-sustaining treatment (LST).
      *   **Constraint 1:** Do *not* defend a particular account. Just list requirements.
      *   **Constraint 2:** Each requirement must have a motivating case or consideration.
      *   **Constraint 3:** Address specific pressures listed in the prompt (withholding/withdrawing equivalence vs. phenomenology, causation in withdrawal, boundaries of omissions, threshold vs. scalar/trade-offs, independence from intended/foreseen, team/protocol agency).
      *   **Constraint 4:** Tell me what I missed (other pressures).
      *   **Constraint 5:** Rank requirements (Non-negotiable vs. Preferences).
      *   **Constraint 6:** Identify the single requirement that disqualifies the most candidates.
      *   **Constraint 7:** State if any subset is jointly unsatisfiable.
      *   **Constraint 8:** Short note on 2-3 discussed accounts at the end.
      *   **Tone:** Professional, rigorous, policy-oriented, philosophical but practical.

  2.  **Deconstruct the Specific Pressures & Formulate Requirements:**

      *   *Pressure 1: Withholding/Withdrawing Equivalence vs. Phenomenology.*
          *   Issue: Policy says they are equivalent (legal/ethical standard), but clinicians feel withdrawing is harder/worse.
          *   Requirement: The account must reconcile normative equivalence with phenomenological difference without collapsing the policy.
      *   *Pressure 2: Causation in Withdrawal.*
          *   Issue: Turning off a ventilator looks like killing (but-for cause).
          *   Requirement: The account must provide a coherent metaphysics of causation (absence/double prevention) or explicitly categorize the death as caused by the underlying disease despite the act.
      *   *Pressure 3: Boundaries of Omissions.*
          *   Issue: Omissions are infinite (I didn't fly a helicopter with organs).
          *   Requirement: The account must define a principled limit on relevant omissions (duty-based, counterfactual, or normative).
      *   *Pressure 4: Threshold vs. Scalar/Trade-offs.*
          *   Issue: Is D/A a bright line or a weight? How does it weigh against saving lives?
          *   Requirement: The account must specify the logical structure (deontological constraint vs. consequentialist weight) and its aggregative properties.
      *   *Pressure 5: Independence from Intended/Foreseen (Doctrine of Double Effect - DDE).*
          *   Issue: Is D/A just a proxy for intent?
          *   Requirement: The account must demonstrate conceptual independence from the DDE to avoid redundancy or confusion.
      *   *Pressure 6: Team/Protocol Agency.*
          *   Issue: Modern medicine is systemic, not just individual acts.
          *   Requirement: The account must scale from individual agents to institutional protocols/teams.

      *   *Missing Pressures (Brainstorming):*
          *   Legal liability/defensibility (policy needs to protect the hospital).
          *   Patient/Family perception (trust).
          *   Resource allocation (is withdrawing LST to save resources different?).
          *   Temporal consistency (does the distinction hold over time?).
          *   Let's pick *Legal Defensibility* and *Patient/Family Trust* as key additions.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Req 1 (Phenomenology):* Must explain why withdrawing *feels* worse without making it *wrong*.
      *   *Req 2 (Causation):* Must handle the "but-for" problem.
      *   *Req 3 (Omission Boundaries):* Must stop the flood of omissions.
      *   *Req 4 (Structure):* Threshold or Scalar?
      *   *Req 5 (DDE Independence):* Must not collapse into intent.
      *   *Req 6 (Agency):* Must work for teams.
      *   *Req 7 (Legal):* Must align with current case law (Cruzan, etc.).
      *   *Req 8 (Trust):* Must not erode public trust.

  4.  **Ranking and Analysis:**

      *   *Non-negotiable:* Legal alignment, Causation clarity (for liability), Omission boundaries (for practicality).
      *   *Preferences:* Phenomenological comfort, Scalar vs. Threshold (depends on ethical framework).
      *   *Disqualifier:* The "Omission Boundaries" requirement is notoriously hard. Many accounts fail to limit omissions non-arbitrarily. Or perhaps "DDE Independence" kills many consequentialist accounts. Let's go with *Omission Boundaries* as it's a classic philosophical failure point.
      *   *Unsatisfiable Subset:* Is there a contradiction? Maybe between "Normative Equivalence" (Policy standard) and "Phenomenological Distinction" (Clinician feel). If the account explains the feeling by validating a moral difference, it breaks the policy. If it dismisses the feeling, it fails implementation. This is a tension, maybe not logical unsatisfiability, but practical incompatibility. Let's look closer. Actually, *Causation* + *Equivalence* is tricky. If withdrawing causes death, how is it equivalent to withholding (where disease causes death)? Some accounts say both allow death. Some say both cause death. If the policy requires equivalence but the metaphysics says one causes and one allows, that's a conflict. Let's flag the *Causation* vs. *Equivalence* tension.

  5.  **Refining the Output Structure:**

      *   **Header:** To the Ethics Committee.
      *   **Introduction:** Contextualize the specification.
      *   **The Specification (List):** Numbered, with Motivation.
      *   **Missing Pressures:** Section on what wasn't in the prompt.
      *   **Ranking:** Non-negotiable vs. Preferences.
      *   **Disqualifier:** Identify the hardest hurdle.
      *   **Unsatisfiability:** Check for logical conflicts.
      *   **Account Survey:** Brief note on Consequentialism, DDE, and Causation-based views.

  6.  **Drafting Content - Specific Focus on Nuance:**

      *   *Causation:* Need to mention "double prevention."
      *   *Omissions:* Need to mention "counterfactual dependence."
      *   *Team:* Need to mention "distributed agency."
      *   *Ranking:* Legal defensibility is truly non-negotiable for a hospital policy.
      *   *Disqualifier:* The "Omission Boundaries" is the classic philosophical sinkhole.
      *   *Unsatisfiable:* The "Phenomenology vs. Equivalence" is the practical knot.

  7.  **Review against Constraints:**
      *   Did I defend an account? No.
      *   Did I address all prompt pressures? Yes.
      *   Did I add missing ones? Yes.
      *   Did I rank them? Yes.
      *   Did I identify the disqualifier? Yes.
      *   Did I check unsatisfiability? Yes.
      *   Short note on accounts? Yes.

  8.  **Final Polish:** Ensure tone is appropriate for an ethics committee document (precise, authoritative, clear). *Self-Correction during drafting:* Make sure I don't accidentally argue *for* the distinction, but rather argue for what a theory *of* the distinction must do. The prompt asks for a specification of what an *account* must deliver.

      *   *Refining the "Disqualifier":* Many accounts fail the "Omission Boundaries" test (the "floodgates" problem). However, for a *hospital policy*, the "Legal Defensibility" is actually the hard stop. But philosophically, "Omission Boundaries" kills the most *theories*. The prompt asks what disqualifies the most *candidates* (theories/accounts), not what stops the policy. I will stick with Omission Boundaries as the theoretical disqualifier.
      *   *Refining "Unsatisfiable":* The tension between "Normative Equivalence" (required by law/policy) and "Phenomenological Distinction" (required for clinician buy-in) is the real risk. If the theory validates the feeling, it breaks the policy. If it invalidates the feeling, it breaks the clinicians. I will frame this as a "Practical Unsatisfiability."

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  **TO:** Hospital Ethics Committee
  **FROM:** Committee Member
  **SUBJECT:** Specification Requirements for Accounts of the Doing/Allowing Distinction in LST Policy

  **Introduction**
  In revising our policy on withdrawing life-sustaining treatment (LST), we must ensure the ethical framework underwriting the document is robust. While current law and bioethical consensus often treat withholding and withdrawing as normatively equivalent, the philosophical machinery required to sustain this position—and to guide clinicians through the moral distress associated with it—is complex. The following specification outlines the necessary conditions any account of the Doing/Allowing (D/A) distinction must meet to be adopted as the theoretical foundation for this policy.

  ### I. Specification Requirements

  **1. The Phenomenological Reconciliation Requirement**
  *   **Requirement:** The account must explain why withdrawing LST *feels* morally weightier than withholding LST to clinicians without conceding that it *is* morally weightier in a way that violates normative equivalence.
  *   **Motivation:** Clinicians widely report that turning off a ventilator feels like killing, whereas not starting one feels like letting nature take its course. If the account dismisses this feeling as irrational, it will fail to gain clinical buy-in. If it validates the feeling as a moral truth, it undermines the policy's assertion that the two acts are ethically interchangeable.

  **2. The Causal Metaphysics Requirement**
  *   **Requirement:** The account must provide a coherent ontology of causation regarding withdrawal. It must either (a) successfully categorize the withdrawal act as a "double prevention" where the underlying pathology remains the cause of death, or (b) explicitly accept that the physician causes death but provide a justification for why this specific causation is permissible.
  *   **Motivation:** In withdrawal, the physician's act is a *sine qua non* (but-for) condition of death. Without a metaphysics of absence causation or double prevention, withdrawal appears indistinguishable from active euthanasia under a standard counterfactual theory of causation.

  **3. The Omission Boundary Requirement**
  *   **Requirement:** The account must establish a principled limit on which omissions count as "allowing" harm, distinguishing relevant failures to act from the indefinitely many things an agent fails to do at any moment.
  *   **Motivation:** Without boundaries, the distinction collapses. At the moment I withdraw treatment, I am also failing to fly a helicopter with a transplant organ to the patient. If all omissions are equal, the distinction between doing and allowing loses its discriminatory power.

  **4. The Structural Specification Requirement**
  *   **Requirement:** The account must specify whether the D/A distinction operates as a deontological threshold (a side-constraint that cannot be outweighed) or a scalar weight (a factor to be aggregated in consequentialist calculus), and how it trades off against numbers (e.g., does allowing one death outweigh doing harm to five?).
  *   **Motivation:** Policy decisions often involve resource allocation and triage. If the distinction is merely a scalar weight, it may be overwhelmed by utility calculations in ways that compromise individual patient rights. If it is a threshold, it may render resource allocation impossible.

  **5. The Intentional Independence Requirement**
  *   **Requirement:** The account must demonstrate that the D/A distinction does conceptual work independent of the Doctrine of Double Effect (DDE). It must distinguish the *structure of the act* from the *intent of the agent*.
  *   **Motivation:** If D/A is merely a proxy for "intended vs. foreseen," the distinction is redundant. We need to know if the physical/normative structure of the act matters even when the intent (e.g., relieving suffering) is held constant across withholding and withdrawing.

  **6. The Distributed Agency Requirement**
  *   **Requirement:** The account must remain coherent when the agent is not a single individual with a hand on a machine, but a team acting under institutional protocol.
  *   **Motivation:** Modern critical care is systemic. A decision to withdraw is often executed by a nurse following a physician's order based on a family conference. If the account relies on individualistic notions of "bodily movement," it cannot govern institutional policy.

  ### II. Additional Pressures Missed in the Initial Brief

  In addition to the pressures listed above, the specification must address two critical external constraints:

  **7. The Legal Defensibility Requirement**
  *   **Requirement:** The account must align with existing case law (e.g., *Cruzan*, *Quinlan*) regarding liability.
  *   **Motivation:** A philosophically sound account that exposes the hospital or clinicians to criminal or civil liability for withdrawal is unusable. The theory must map onto the legal distinction between battery/active killing and negligence/natural death.

  **8. The Public Trust Requirement**
  *   **Requirement:** The account must be translatable into public-facing language that does not erode trust in the medical profession.
  *   **Motivation:** If the account relies on esoteric metaphysics (e.g., "absence causation") that sounds like sophistry to families ("You're saying you didn't kill him?"), it risks damaging the therapeutic alliance and inviting regulatory scrutiny.

  ### III. Ranking of Requirements

  **Non-Negotiable (Policy Kill-Switches)**
  1.  **Legal Defensibility:** If the account increases legal risk, it cannot be used.
  2.  **Omission Boundary:** If the account cannot limit omissions, it is logically incoherent and unusable for guidance.
  3.  **Causal Metaphysics:** If the account cannot explain why withdrawal is not homicide under current law, it is unsafe.

  **Preferences (Theoretical Camps)**
  1.  **Structural Specification:** Whether the hospital adopts a threshold or scalar view depends on the broader ethical culture (e.g., rights-based vs. utilitarian).
  2.  **Phenomenological Reconciliation:** While desirable for morale, a policy can technically function even if clinicians remain distressed, provided they are compliant.
  3.  **Intentional Independence:** Some accounts successfully merge D/A and DDE; strict independence is a theoretical preference, not necessarily a practical necessity.

  ### IV. Critical Analysis of the Specification

  **The Single Greatest Disqualifier**
  The **Omission Boundary Requirement** disqualifies the most candidates.
  Most consequentialist accounts struggle here, as they often view omissions as morally equivalent to acts if the outcome is the same, yet fail to provide a non-arbitrary limit on *which* omissions are obligatory. Conversely, strict causal accounts often fail to explain why we are not responsible for every preventable death we fail to stop. Finding an account that limits omissions without resorting to circular "normative" definitions is the hardest philosophical hurdle.

  **Joint Unsatisfiability**
  There is a tension, potentially rising to unsatisfiability, between the **Phenomenological Reconciliation Requirement** and the **Causal Metaphysics Requirement**.
  *   *The Conflict:* To satisfy clinicians (Phenomenology), the account often needs to validate that withdrawing is a distinct, "active" kind of event. However, to satisfy legal/ethical equivalence and avoid homicide charges (Causation), the account often needs to argue that withdrawing is *not* a cause of death, but merely the removal of an obstacle.
  *   *The Risk:* An account that successfully explains the causation (it's the disease that kills) often fails to explain the feeling (why does it feel like I killed him?). An account that explains the feeling (you did intervene) often jeopardizes the causation claim (intervention = cause). A subset of these requirements may be jointly unsatisfiable by a single unified theory, requiring a "pluralist" approach in the policy text.

  ### V. Note on Prominent Accounts

  *   **Consequentialism:** Generally fails the **Omission Boundary** and **Phenomenological** requirements. It treats withholding and withdrawing as identical, offering no resources to comfort distressed clinicians, and struggles to limit the scope of omissions without arbitrary rules.
  *   **Doctrine of Double Effect (DDE):** Satisfies **Intentional Independence** poorly (often collapses D/A into intent) but handles **Legal Defensibility** well. It struggles with the **Distributed Agency Requirement**, as "team intent" is philosophically murky compared to individual intent.
  *   **Causation-Based Accounts (e.g., Double Prevention):** Strongest on **Causal Metaphysics** and **Legal Defensibility**. However, they often fail the **Phenomenological Reconciliation**, as the metaphysical claim that "the physician did not cause the death" rings hollow to the nurse turning the dial.

  **Recommendation:** The Committee should seek a hybrid account that utilizes a causation-based framework for legal/policy definitions but incorporates a virtue-ethics component to address clinician phenomenology.
