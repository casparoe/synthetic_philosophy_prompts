answer: |-
  This is a procedural document. It is designed to be printed, stapled to a worksheet, and signed by the analyst and the reviewing partner. It is not a theory; it is a control mechanism.

  # The Geopolitical Reference-Class Protocol (GRCP v1.0)

  **Purpose:** To convert geopolitical duration questions into auditable base-rate estimates, or to formally declare when such an estimate is impossible.
  **Time Budget:** 1 Analyst Day.
  **Authority:** If this protocol outputs "NO NUMBER," the deck must state "Historical Base Rates Insufficient." A partner may not override this without signing a Risk Exemption Form.

  ---

  ## Phase 1: Pre-Commitment (Hour 0–1)
  *Constraint: You may not look at a single data point until this section is signed.*

  **1.1 The Question**
  Write the exact question to be answered.
  *   *Constraint:* Must be binary or time-bound. (e.g., "Will Regime X survive to Date Y?" NOT "What will happen to Regime X?")

  **1.2 The Reference Class Definition**
  You must define two classes: **Narrow** (closest analogues) and **Wide** (structural similars).
  For *each* class, you must write the following four lines:
  1.  **One-Sentence Definition:** (e.g., "Nuclear-armed single-party states since 1945.")
  2.  **Membership Test:** A checklist an outsider could use to include/exclude a case without knowing your hypothesis. (e.g., "1. One legal party. 2. Standing army >1M. 3. Nuclear capability at inception.")
  3.  **Start Rule:** The specific event that starts the clock. (e.g., "Date of constitutional ratification" OR "Date of effective territorial control." *Pick one.*)
  4.  **Death Rule:** The specific event that stops the clock. (e.g., "Loss of capital city" OR "Change in ruling party via election" OR "Constitutional rewrite." *Pick one.*)

  **1.3 The Bias Declaration**
  *   *Instruction:* Acknowledge the "Inspection Paradox." You are observing a system that has already survived to 2025. You cannot use the *average* lifespan of all historical cases. You must calculate the probability of surviving *additional* time given *current* age.
  *   *Analyst Sign-off:* "I acknowledge I am calculating Conditional Survival Probability $P(T > t_{future} | T > t_{current})$, not Mean Lifespan."

  ---

  ## Phase 2: Data & Base Rate (Hour 1–4)
  *Constraint: Use existing datasets (Polity IV, COW, Archigos). Do not commission new research.*

  **2.1 Sample Size Check**
  *   **Narrow Class:** If $N < 5$, stop. Mark as "Thin Data."
  *   **Wide Class:** If $N < 20$, stop. Mark as "Thin Data."
  *   *If both stop:* **PROCEDURE HALTS. OUTPUT: NO NUMBER.**

  **2.2 The Survival Calculation**
  Do not calculate the average age of death.
  1.  Filter your dataset for all entities that satisfy the **Start Rule**.
  2.  Filter that list for entities that survived at least as long as the subject has *already* survived (e.g., if analyzing China at 75 years, discard all regimes that died before year 75).
  3.  Of the *remaining* survivors, what % lasted another 25 years?
  4.  Record this as **Base Rate Narrow** and **Base Rate Wide**.

  **2.3 The Spread Test**
  Calculate the difference between **Base Rate Narrow** and **Base Rate Wide**.
  *   If Spread > 30 percentage points: **PROCEDURE HALTS. OUTPUT: NO NUMBER.** (Reason: Class selection drives the result, not data.)
  *   If Spread ≤ 30 percentage points: Proceed to Phase 3.

  ---

  ## Phase 3: Adjustment & Cap (Hour 4–6)
  *Constraint: You may adjust the base rate for modern specificities, but you are capped.*

  **3.1 The Mechanism List**
  List up to three specific capacities the subject has that the historical reference class did not.
  *   *Allowed:* Nuclear deterrence, digital surveillance capacity, fiat currency reserve status, global supply chain integration.
  *   *Forbidden:* "Better leadership," "Cultural resilience," "Historical momentum."

  **3.2 The Adjustment Cap**
  You may adjust the Base Rate (average of Narrow/Wide) up or down based on 3.1.
  *   **Max Adjustment:** ±20 percentage points.
  *   *Example:* If Base Rate is 60%, you cannot output higher than 80% or lower than 40%.
  *   *Justification:* For each point of adjustment, cite a specific mechanism from 3.1.

  **3.3 The Judgment Flag**
  Highlight any step where you made a choice between two reasonable options (e.g., choosing "loss of capital" vs "constitutional rewrite" as the Death Rule).
  *   *Requirement:* Write one sentence on how the number would change if you chose the alternative.

  ---

  ## Phase 4: Final Output (Hour 6–8)

  **4.1 The Result**
  *   **Option A (Number):** "X% probability of survival to [Date]. Derived from [Class Name]. Adjusted for [Mechanisms]. Spread: [Y] points."
  *   **Option B (No Number):** "Reference class instability. Spread between Narrow ([A]%) and Wide ([B]%) exceeds 30 points. Historical analogues insufficient for precision."

  **4.2 The Audit Trail**
  Attach the Phase 1 Definition Sheet and the Phase 2 Data Log.

  ---

  # Addressing Your Friend's Objections

  **Objection 1: "Reference classes are chosen to fit the answer."**
  *   **Protocol Fix:** Phase 1 (Pre-Commitment). You must define the class *before* seeing the N or the Rate.
  *   **Protocol Fix:** Phase 2.3 (The Spread Test). If the Narrow and Wide classes give wildly different answers, the protocol forces you to admit you don't know. It prevents you from cherry-picking the "safe" class.

  **Objection 2: "Length-biased sampling / Inspection Paradox."**
  *   **Protocol Fix:** Phase 1.3 & 2.2. You are explicitly forbidden from using "Average Lifespan." You must calculate *Conditional Survival*.
  *   *Explanation for the Analyst:* If the average empire lasts 100 years, but you are looking at one that is already 75, you don't assume it has 25 years left. You look only at empires that made it to 75. If 90% of *those* died by year 80, the probability is low, even if the "average" is 100. This corrects for the fact that you are observing a survivor.

  ---

  # The Run-Through: Analyst Worksheet

  ## Case A: The China Question
  **Question:** Will the CCP political order remain intact through 2050? (25-year horizon).
  **Current Age:** 75 years (1949–2025).

  **Phase 1: Pre-Commitment**
  *   **Narrow Class:** Communist single-party states with >500M population.
      *   *Start:* Effective control of capital.
      *   *Death:* Ruling party loses monopoly on power.
  *   **Wide Class:** Non-democratic great powers (GDP top 3) since 1800.
      *   *Start:* Industrialization threshold.
      *   *Death:* Regime change or territorial fragmentation >10%.
  *   **Bias Declaration:** Acknowledged. Calculating $P(Survival > 25 | Age > 75)$.

  **Phase 2: Data**
  *   **Narrow N:** 3 (USSR, PRC, potentially Vietnam scaled). *Warning: N < 5.*
      *   USSR survived 73 years. Died at 74.
      *   PRC is current.
      *   *Result:* Narrow data is too thin to calculate a rate. Mark as "50% (Uncertainty)."
  *   **Wide N:** 12 (Qing, Ottomans, British Empire, etc.).
      *   Filtered for those surviving >75 years: 6 cases.
      *   Of those 6, how many lasted 25 more? 4.
      *   **Base Rate Wide:** 66%.
  *   **Spread Test:** Narrow (50% proxy) vs Wide (66%). Spread = 16 points. **PASS.**

  **Phase 3: Adjustment**
  *   **Mechanisms:** Digital surveillance (increases stability), Nuclear arsenal (prevents external overthrow).
  *   **Adjustment:** +15% (within ±20% cap).
  *   **Judgment Flag:** Death Rule. If "Death" = "Economic stagnation" rather than "Party loss," survival rate drops by ~40%.

  **Phase 4: Output**
  *   **Result:** **81% Probability.**
  *   **Caveat:** "Based on Great Power autocracies surviving past 75 years. Adjusted for surveillance capacity. Narrow class (Communist) too thin to rely on."
  *   **Audit:** *Partner can see the USSR comparison is the main driver of risk.*

  ---

  ## Case B: The US Historical Uniqueness
  **Question:** Is the current US political order historically unusual? (Comparison, not probability).

  **Phase 1: Pre-Commitment**
  *   **Narrow Class:** Hegemonic powers with reserve currency status.
  *   **Wide Class:** Democratic republics with >$20T GDP.
  *   **Metric:** Internal Polarization Index (V-Dem) + Debt/GDP.

  **Phase 2: Data**
  *   **Narrow:** UK (1890), Netherlands (1750), Spain (1600).
      *   US Polarization Z-Score: +2.1 relative to peers at similar hegemony age.
      *   US Debt Z-Score: +1.5 relative to peers.
  *   **Wide:** Modern Democracies (post-1945).
      *   US Polarization Z-Score: +3.0 (Outlier).
      *   US Debt Z-Score: +1.0 (Normal).

  **Phase 3: Adjustment**
  *   *Not applicable for comparison metrics.*

  **Phase 4: Output**
  *   **Result:** **"High Deviation."**
  *   **Statement:** "On polarization metrics, the US is in the 95th percentile of historical hegemonic peers. On fiscal metrics, it is in the 60th percentile. The 'Uniqueness' claim is supported by social data, not fiscal data."
  *   **Audit:** *Prevents the partner from saying "We are just like Rome" without specifying which metric matches Rome.*

  ---

  ## Case C: The Poison Pill (NATO Integrity)
  **Question:** Will NATO Article 5 credibility remain intact through 2040?
  **Context:** Partner has promised a client a "Stability Score" for European infrastructure investment.

  **Phase 1: Pre-Commitment**
  *   **Narrow Class:** Nuclear Security Guarantees (US-led).
      *   *Start:* Treaty Ratification.
      *   *Death:* Public refusal to honor guarantee OR Treaty dissolution.
  *   **Wide Class:** Multilateral Military Alliances.
      *   *Start:* Signing.
      *   *Death:* Member state exits OR Failure to mobilize in conflict.

  **Phase 2: Data**
  *   **Narrow N:** 4 (ANZUS, NATO, US-Japan, US-Korea).
      *   Survived >15 years (current age): 4.
      *   Survived >30 years: 3 (ANZUS strained but exists).
      *   **Base Rate Narrow:** 75%.
  *   **Wide N:** 45 (Historical alliances 1815–2025).
      *   Survived >15 years: 12.
      *   Survived >30 years: 4.
      *   **Base Rate Wide:** 33%.
  *   **Spread Test:** 75% - 33% = **42 Points.**
  *   **RESULT:** **FAIL.**

  **Phase 4: Output**
  *   **Result:** **NO NUMBER.**
  *   **Statement:** "Definition of 'Alliance' drives the probability. If treated as a Nuclear Guarantee (Narrow), survival is high. If treated as a Historical Alliance (Wide), survival is low. The spread exceeds the 30-point threshold. We cannot quantify this risk."
  *   **Consequence:** The partner cannot put a number in the deck. They must write: "Alliance durability is historically volatile; investment thesis assumes continuity not supported by broad historical baselines."
  *   **Audit:** *This protects you. If NATO fractures in 2028, you did not sign off on 75%. If it holds, you didn't scare the client with 33%.*

  ---

  # What This Procedure Cannot Do (The Failure Modes)

  **1. The "Silent Decay" Problem**
  *   **Limitation:** The protocol measures *Event Risk* (Regime Change, Treaty Break). It does not measure *Capacity Erosion*.
  *   **Failure Mode:** A state can "survive" (Death Rule not triggered) while losing all actual functionality (e.g., a zombie regime). The protocol will output "90% Survival" while the asset becomes worthless.
  *   **Mitigation:** You must add a secondary metric for "State Capacity" (tax collection %, monopoly on violence) separate from "Regime Survival."

  **2. The "Black Swan" Blindness**
  *   **Limitation:** Reference classes are backward-looking. They cannot price in technologies or threats that have no historical analogue (e.g., AGI-driven governance, climate-induced mass migration exceeding all historical precedents).
  *   **Failure Mode:** The protocol will confidently output a number based on 19th-century data while a 21st-century cliff approaches.
  *   **Mitigation:** The "Adjustment Cap" (Phase 3) is your only shield here. If you think the future is fundamentally different, you must max out the cap and flag it as a "Structural Break."

  **3. The "Definition Gaming" Residue**
  *   **Limitation:** While Pre-Commitment helps, a determined analyst can still tweak the "Death Rule" to get the desired number. (e.g., Defining "Regime Change" so narrowly that nothing counts).
  *   **Failure Mode:** The Audit Trail shows the rule, but the Partner signs it anyway because they want the deal.
  *   **Mitigation:** This is a governance failure, not a procedural one. The only fix is a Compliance Officer who is not in the room during the deal-making.

  **4. The "Comfortable Number" Trap**
  *   **Limitation:** In Case A (China), the protocol produced 81%. This looks precise. It creates a false sense of security.
  *   **Failure Mode:** The firm allocates capital based on "81% safety." In reality, the uncertainty is huge (N < 5 in Narrow class).
  *   **Mitigation:** You must enforce a rule that any probability derived from $N < 10$ must be displayed as a range (e.g., "60–90%") in the client deck, never a point estimate.

  ### Final Note to the Analyst
  Your friend is right that history is messy. This procedure does not clean the mess; it simply forces you to show the mess to the partner before they sign the check. If the mess is too big, the procedure forces you to walk away. That is its only value.
