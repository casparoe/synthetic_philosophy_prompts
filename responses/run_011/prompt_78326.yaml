answer: |-
  ### Specification for Content Ascription in Adaptive Control Systems

  **1. The Misrepresentation Condition (Error)**
  *   **Requirement:** The theory must distinguish between a state tokening because its object is present, tokening because a non-standard cause is present, and tokening *falsely* (malfunction). It must ground the possibility of error without appealing to an external interpreter's judgment.
  *   **Motivation:** Your fault logs require a binary distinction between "sensor noise" (causal interference) and "model error" (misrepresentation). If a thermistor reads high because of a heat gun, the system is causally coherent. If it reads high because its internal model weights drifted during training, it is representing incorrectly. A theory that reduces content to reliable covariance (e.g., "it represents whatever causes it") cannot distinguish the heat gun case from the miscalibration case; it dissolves error into mere difference. This is distinct from determinacy: determinacy fixes *what* is represented; this condition ensures that *getting it wrong* is a metaphysical possibility, not just a pragmatic label.

  **2. The Independence Condition (Naturalism)**
  *   **Requirement:** Content ascription must not essentially depend on the intentions, beliefs, or interpretive stance of the designer or observer.
  *   **Motivation:** This addresses the Swampman twist. If the emergent controller's content depends on the engineer's intent, then the emergent policy (which the engineer did not design specifically) has no content, or worse, the content is whatever the engineer *thinks* it is. This makes the theory psychological (about the engineer) rather than physical (about the controller). For the lab's framing to hold, the duplicate controller must have the same content as the original, regardless of lineage. If a theory says the duplicate is contentless, it fails the engineering use-case: we need to debug the duplicate the same way we debug the original.

  **3. The Resolution Condition (Distality)**
  *   **Requirement:** The theory must provide a principled basis for locating the content either at the distal object (room temperature), the proximal signal (voltage), or explicitly declare the indeterminacy as a feature rather than a bug.
  *   **Motivation:** Control loops fail if they regulate the sensor rather than the environment (Goodhart's Law). If a theory forces the answer "voltage" because that's the immediate cause, it renders the system incapable of representing the world, only its own inputs. If it forces "room temperature" without explaining how the system breaks the causal chain at the sensor, it is magical. The requirement isn't that the theory *must* pick distal, but that it must have a mechanism for *deciding* the boundary. Leaving it to "explanatory interests" is acceptable only if those interests are constrained by the system's own architecture (e.g., where the error signal is computed).

  **4. The Function-Source Condition (Lineage)**
  *   **Requirement:** The theory must specify what constitutes a "proper function" in the absence of biological reproduction. It must identify the selection mechanism that grounds normativity.
  *   **Motivation:** Standard teleosemantics relies on evolutionary history. Your RL agents and emergent controllers have no phylogenetic history. If the theory requires biological reproduction, it excludes the lab's primary subjects. If it allows "learning" or "training runs" to substitute for evolution, it must explain what does the work that natural selection did (e.g., retention of successful variants, elimination of failed ones via loss functions). If it cannot identify a selection history, it cannot ground the normativity required for Condition 1.

  **5. The Non-Triviality Condition (Over-generation)**
  *   **Requirement:** The theory must distinguish representational systems from mere functional or causal systems (e.g., thermostats, livers) without begging the question.
  *   **Motivation:** If every system with a proper function has content, the term "representation" loses its explanatory power for your fault logs. You need to know when a subsystem is *modeling* the load versus merely *reacting* to it. A theory that ascribes content to a smoke detector hasn't explained representation; it has expanded the word until it covers all causation. The spec requires a threshold (e.g., decouplability, structural isomorphism, or offline processing) that separates controllers that *track* from controllers that *represent*.

  ***

  ### Classification and Trilemma

  **Non-Negotiable Requirements:**
  1.  **Misrepresentation Condition:** Without this, "fault" is meaningless.
  2.  **Independence Condition:** Without this, you are debugging the engineer, not the system.
  3.  **Non-Triviality Condition:** Without this, the concept applies to everything and explains nothing.

  **Camp Tastes (Negotiable):**
  1.  **Resolution Condition:** Some camps (e.g., Interpretivism) accept indeterminacy; others (e.g., Structuralism) demand a fact of the matter. For your logs, you want a fact, but a theory can pass if it defines *how* to fix the fact.
  2.  **Function-Source Condition:** Whether this source is evolutionary, reinforcement-based, or design-based is a theoretical variable, provided it satisfies the Independence Condition.

  **The Trilemma:**
  The following three constraints are jointly unsatisfiable:
  1.  **Robust Determinacy:** There is a fact of the matter about exactly what is represented (solves Distal/Proximal).
  2.  **Strict Naturalism:** No appeal to intentions, interests, or interpretive stances (satisfies Independence).
  3.  **Ahistorical Normativity:** Applies to systems with no selective lineage or designer intent (satisfies the emergent controller case).

  **Verdict:** You must cut **Strict Naturalism**.
  Pure causal theories fail Determinacy (the Disjunction Problem). Pure teleosemantics fail Ahistorical Normativity (no evolution). Design theories fail Strict Naturalism (rely on intent). To license content in an emergent controller with no lineage, you must allow that the *internal goal structure* (the loss function or reward signal) acts as a surrogate for natural selection. This is "naturalistic" only if you treat the reward function as a physical constraint akin to an evolutionary pressure, not as a stand-in for designer intent. If you insist on **Strict Naturalism** (no internal teleology either), you knock out every candidate except eliminativism.

  **The Killer Requirement:**
  The **Misrepresentation Condition** is the single filter that eliminates the most candidates. It kills pure causal-covariance accounts immediately (they cannot distinguish error from novel cause). It pressures teleosemantics to explain how a system without a history of selection can malfunction rather than just function differently.

  ***

  ### Theory Evaluation
  Causal-covariance accounts fail the Misrepresentation Condition outright (the Disjunction Problem); they cannot distinguish a miscalibrated sensor from a sensor tracking a disjunction of normal and abnormal causes, rendering fault logs incoherent. Etiological teleosemantics satisfies Misrepresentation and Naturalism but fails the Function-Source Condition for your emergent and RL systems, as they lack the requisite phylogenetic history to ground proper functions. Design-based teleosemantics handles the engineering context well but violates the Independence Condition; by tying content to designer intent, it renders the emergent controller's specific policy contentless or misdescribed, forcing you to debug the engineer's mind rather than the system's state.
