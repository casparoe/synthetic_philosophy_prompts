      *   *Key Insight:* If rights are filters, you remove the "offensive" options from the set *before* aggregation. This dissolves the conflict between Liberalism and Pareto *if* the meddlesome preferences are also filtered. If meddlesome preferences remain but the options are constrained, you get Pareto efficiency over the *restricted* set.
