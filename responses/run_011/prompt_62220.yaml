      *Actually, V5 is the deeper theoretical move.* If V5 holds (meddlesome preferences count for zero), then in V1, there is no conflict. Social Preference = R's Preference. Pareto is not violated because the House's preference is null. This dissolves Sen's paradox entirely for V1.
      *But V3 requires the House's preference to count if R agrees.* This implies the preference *exists* but is usually silenced.
