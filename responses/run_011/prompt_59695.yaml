prompt: |-
  So I was up till like 1am last night arguing with a friend from my program — she's a Mīmāṃsā person, very much a Kumārila partisan — and we never actually resolved it, which is a problem because I give this talk in three weeks and she basically was the audience. The talk defends a pretty specific claim: that Nyāya is right to treat *śabda* as a pramāṇa in its own right rather than a species of *anumāna*, but for a reason contemporary epistemologists of testimony almost never reach for. The usual anti-reductionist moves are either entitlement-by-default or the circularity complaint (you can't establish a speaker's reliability without more testimony, so you must be entitled to trust primitively). My line is different and it's basically causal: what makes a pramāṇa its own pramāṇa for the Naiyāyikas is its *karaṇa*, the special instrumental cause that produces the cognition. Inference runs through a *parāmarśa* — grasping the reason as pervaded by the property to be proved. Testimony runs through the comprehension of a sentence, which has its own enabling conditions (mutual syntactic expectancy between the words, semantic fitness so the combination isn't nonsense, contiguity so the words arrive as one utterance rather than scattered, and the speaker's *tātparya*, what they intend the words to be doing). Different instrument, different pramāṇa, even where the contents overlap. Then the part my friend went after, which is my own spin and not something you'll find in the commentaries: I want to read the *āpta* clause in the sūtra definition not as a psychological claim about the speaker's honesty or expertise but as a claim about the utterance — a structural or register-level track record, a property of the speech community and the genre the utterance comes out of, so that *āptatva* is more like an institutional reliability than a virtue of a person. That's what I need help bracing for.

  The room is a cross-listed workshop on testimony: about fifteen people, mostly analytic epistemologists who work on Hume/Reid, transmission vs. generation, and the reductionism debate and who have read maybe one translation of some Indian stuff out of politeness; one senior person who does Dharmakīrti and will absolutely insist that there are only two objects worth knowing, particulars and universals, hence only two instruments, hence sentence comprehension is just inference from an utterance-as-sign; my friend plus one other Sanskritist who'll be annoyed if I botch the difference between the atomistic and the holistic accounts of how a sentence delivers its meaning; and two or three grad students who mostly want to know if this is just process reliabilism with diacritics. Nobody there is going to be charitable about the metaphysical baggage.

  Here's what I want back, in these sections, in this order:

  1. **The room** — about 120 words, mapping the three or four factions and what each one actually cares about, so I know which objection is coming from where.
  2. **Ranked objections** — the bulk, call it 1500–1800 words. Eight or nine objections I'll realistically get, ordered by how much damage each would do if I fumbled it. For each: a one-line label for who raises it; the question phrased the way that person would actually phrase it in a seminar (the Dharmakīrti person in Dharmakīrtian terms, the epistemologists in their terms, not all of them sounding like me); a reply I can deliver in about two minutes out loud; and a separate line marked SOFT SPOT saying where that reply is weakest or where it costs me something. Don't pad this with objections I'd get from a general audience — I care about the ones that need this room.
  3. **Concede first** — ~120 words on what I should give away in the opening five minutes to disarm the cheap attacks, and what the concession costs me.
  4. **The one that has to land** — ~120 words: which single reply carries the whole talk, and how I set it up earlier so it doesn't come out of nowhere.
  5. **Please don't ask** — ~200 words on the objection I'm hoping nobody raises, the one about my structural *āptatva* that I don't have a good answer to yet, plus a fallback line if it does come up.

  Gloss the Sanskrit terms once on first use and then just use them — I don't want the sheet reading like a textbook. And don't give me a bibliography or a list of what to go read, I'm not going to have time, I just need to survive the question period.
