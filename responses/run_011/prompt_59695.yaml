answer: |-
  1. **The Room**
  You're facing four vectors. The analytic epistemologists (majority) care about justification structures: is this Reductionism (Hume) or Non-Reductionism (Reid)? They'll probe whether your causal story collapses into induction. The senior Dharmakīrti scholar cares about ontological parsimony: for Buddhists, only *pratyakṣa* (perception) and *anumāna* (inference) exist because only particulars and universals are real objects; they will argue sentence comprehension is just inference from speech-as-sign. Your Mīmāṃsā friend and the Sanskritist care about philological fidelity and the mechanics of meaning: does your structural *āptatva* (speaker reliability) betray the Nyāya commitment to individual virtue, or does it illegitimately borrow from Mīmāṃsā intrinsic validity? Finally, the grad students are scanning for isomorphism with process reliabilism; if you can't distinguish your *karaṇa* (instrumental cause) from a reliable process, they'll dismiss this as historical dressing on a Goldmanian core.

  2. **Ranked Objections**

  **1. The Dharmakīrti Reduction**
  *Who:* The Senior Buddhist Logician
  *Question:* "If the ultimate objects of knowledge are only *svalakṣaṇa* (particulars) and *sāmānyalakṣaṇa* (universals), and only perception and inference apprehend them respectively, isn't *śabda* (testimony) just inference from the utterance as a *liṅga* (sign) of the speaker's knowledge? You've described a different psychological process, but not a different ontological instrument."
  *Reply:* "Nyāya realism rejects the Buddhist ontological constraint. For us, the object of *śabda* is a state of affairs conveyed by convention, not merely inferred from a sign. In *anumāna*, the *karaṇa* is *parāmarśa* (grasping the pervasion between reason and property). In *śabda*, the *karaṇa* is sentence-comprehension itself, enabled by syntactic expectancy and *tātparya* (speaker intention). Even if the content overlaps, the causal mechanism producing the cognition is distinct. We individuate *pramāṇa* (means of knowledge) by instrument, not just object. If the tool differs, the knowledge-source differs, regardless of your ontology."
  *SOFT SPOT:* This begs the question against the Buddhist ontological parsimony; you're asserting Nyāya metaphysics to defend Nyāya epistemology, which won't satisfy someone who thinks Nyāya metaphysics is bloated.

  **2. The Humean Reduction**
  *Who:* Analytic Epistemologist (Reductionist)
  *Question:* "You say *āptatva* is structural, but isn't trusting a structure just inductive inference based on past success? If I trust a journal or a institution, haven't I just inferred that 'institutions of type X are reliable,' making this a hidden form of Reductionism?"
  *Reply:* "Standard Reductionism requires the hearer to possess positive reasons for trusting the specific speaker on the specific occasion. My structural claim shifts the burden: the reliability is a background condition of the speech act's possibility, not a premise in the hearer's reasoning. The hearer doesn't infer reliability; the reliability is part of the *karaṇa* that enables the comprehension. It's not a premise; it's a precondition of the instrument functioning, like light for vision. You don't infer light exists to see; light enables the seeing."
  *SOFT SPOT:* It risks looking like a 'default entitlement' view (Burge) disguised as causality; if the structure fails, how do you know without inference?

  **3. The Mīmāṃsā Virtue Challenge**
  *Who:* Your Kumārila Friend
  *Question:* "Nyāya defines *āpta* as a person with knowledge and honesty. By making *āptatva* institutional, you're erasing the moral psychology Kumārila attacked. If the speaker is lying but the institution is 'reliable,' do you get knowledge? You're conflating Nyāya *āptatva* with Mīmāṃsā *svataḥ prāmāṇya* (intrinsic validity) without the Vedic justification."
  *Reply:* "I'm not claiming intrinsic validity for words, but tracking reliability at the register level. Kumārila rejects *āptatva* entirely for Vedic speech; I'm addressing secular testimony. If a liar speaks within a reliable institutional structure (e.g., a court record), the hearer gains knowledge from the structure's verification processes, not the liar's virtue. The *āpta* is the institution, not the individual mouthpiece. This preserves Nyāya's externalism without requiring the hearer to audit the speaker's soul."
  *SOFT SPOT:* This deviates from the sūtra's explicit focus on the person (*āpta*), inviting philological criticism that you're rewriting the text to fit the theory.

  **4. The Sentence Meaning Mechanism**
  *Who:* The Sanskritist
  *Question:* "You mention syntactic expectancy and contiguity. Are you committing to *abhihitānvayavāda* (words denote meanings first, then connect) or *anvitābhidhānavāda* (words denote connected meanings)? Your causal story depends on how the sentence cognition arises, but you're treating sentence comprehension as a black box."
  *Reply:* "Nyāya typically holds *abhihitānvayavāda*: words denote individual meanings, then syntax connects them. My causal claim works on either, provided the final *karaṇa* is the completed sentence-cognition. Whether the connection happens before or after denotation, the instrumental cause of the testimonial knowledge is the understood sentence, not the inference from sounds. I'm staying neutral on the semantic mechanics to focus on the epistemic classification."
  *SOFT SPOT:* Neutrality here looks like avoidance; if the semantic mechanism is flawed, the causal chain breaks, and the Mīmāṃsā person will press this hard.

  **5. The Reliabilism Clone**
  *Who:* Grad Student
  *Question:* "This sounds exactly like Process Reliabilism. The *karaṇa* is the process, the structural *āptatva* is the reliability condition. What work is the Sanskrit doing here besides adding diacritics to Goldman?"
  *Reply:* "Goldman focuses on the truth-ratio of the process. Nyāya focuses on the specific causal configuration (*karaṇa*) that individuates the knowledge-type. Reliabilism asks 'is this process reliable?'; Nyāya asks 'what instrument produced this cognition?' You can have a reliable inference that doesn't become testimony. The distinction isn't just reliability; it's the specific causal architecture of understanding language versus grasping a sign."
  *SOFT SPOT:* To many analytic ears, 'causal architecture' just *is* process details; you need to show why this classification matters normatively, not just descriptively.

  **6. The Normativity Gap**
  *Who:* Analytic Epistemologist (Normativist)
  *Question:* "Causality isn't normativity. You've explained how testimony *causes* belief, but not why it *justifies* it. A reliable causal chain can still leave me unjustified if I'm unaware of it. How does your *karaṇa* account for justification?"
  *Reply:* "Nyāya is externalist. Justification isn't internal access to reasons; it's the actual possession of a valid instrument. If the *karaṇa* is defect-free, the cognition is *pramā* (valid knowledge). We don't require the hearer to know the instrument is valid to be justified; they just need to possess the instrument. The normativity lies in the successful functioning of the cause, not the hearer's reflection on it."
  *SOFT SPOT:* This alienates internalists in the room; you're essentially saying 'might makes right' in epistemology, which invites the New Evil Demon objection.

  **7. The Overgeneration Problem**
  *Who:* Nyāya Purist / Skeptic
  *Question:* "If every distinct causal instrument creates a new *pramāṇa*, why stop at six? Reading a map, looking at a graph, hearing a rumor—each has a different causal setup. Aren't you proliferating *pramāṇas* ad infinitum?"
  *Reply:* "Nyāya groups instruments by fundamental cognitive capacity, not superficial medium. Maps and graphs reduce to perception or inference. Testimony is distinct because it relies on linguistic convention and *tātparya*. We don't multiply *pramāṇas* for every sub-type, only where the fundamental causal mode of apprehension shifts. Language comprehension is cognitively distinct from observing signs or perceiving objects."
  *SOFT SPOT:* The line between 'fundamental capacity' and 'sub-type' is fuzzy; a determined opponent can argue testimony is just a sub-type of inference from conventions.

  **8. The False Testimony Case**
  *Who:* Analytic Epistemologist
  *Question:* "If *āptatva* is structural, what happens when the structure is corrupted but the hearer doesn't know? If a reputable journal publishes fraud, does the hearer have knowledge on your view? If yes, you violate the truth condition. If no, your structural account fails."
  *Reply:* "Nyāya requires the cognition to be true to count as *pramā*. If the structure is corrupted, the *karaṇa* is defective, so it's not a *pramāṇa* instance, even if the hearer thinks it is. Structural reliability is a fact, not a belief. If the institution fails, the instrument breaks. The hearer has a false cognition, not knowledge. This preserves the factivity of knowledge while keeping the reliability condition external."
  *SOFT SPOT:* This makes knowledge too fragile; if the institution has a hidden flaw, no one knows anything from them, which seems counterintuitive for individual cases.

  3. **Concede First**
  In your opening, concede that *śabda* and *anumāna* often yield identical content and that standard Nyāya commentaries do treat *āptatva* as individual virtue. Explicitly state you are offering a reconstruction, not a philological exegesis. This disarms the Sanskritists who might otherwise nitpick your translation of *āpta*, and it signals to the analytic crowd that you know the standard view is vulnerable to reductionism. The cost is you lose the "textual authority" shield; you must win on philosophical merit alone. But this is necessary to make the structural *āptatva* plausible without getting bogged down in defending Kumārila's reading of Gautama.

  4. **The One That Has to Land**
  The *karaṇa* distinction is your lifeline. You must define *pramāṇa* as "instrumental cause" in the first five minutes and stick to it rigidly. If you let them define *pramāṇa* as "source of justification," you lose to the Reductionists. Set it up by contrasting *parāmarśa* (inference's instrument) with sentence-comprehension (testimony's instrument). If you successfully establish that these are cognitively distinct causal mechanisms, the claim that they are distinct *pramāṇas* follows automatically within the Nyāya framework. Plant this definition early so when the Dharmakīrti person attacks, you can simply point back to the definition everyone agreed to use for the talk.

  5. **Please Don't Ask**
  The weak spot is individuating the "institution" without circularity. If asked, "What constitutes a reliable structure if not the sum of reliable testimonies?", you risk circularity: the structure is reliable because it produces true testimony, and the testimony is knowledge because the structure is reliable.
  *Fallback:* "That's the next stage of the research. For now, I'm treating institutional reliability as a brute social fact, similar to how perception treats light as a brute physical fact. We don't ask light why it's reliable; we note it enables vision. Similarly, social structures enable testimony. I'm arguing for the *existence* of the instrument, not yet providing a genealogy of the institution."
  This kicks the can down the road but prevents you from being trapped in a definitional loop during Q&A. It frames the objection as future work rather than a current fatal flaw.
