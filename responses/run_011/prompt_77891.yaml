answer: |-
  **TO:** The Editorial Standards Panel
  **FROM:** [Name], Journalist Member
  **DATE:** 1 October 2023
  **SUBJECT:** Standard for the Usage of "Genocide"

  **Recommendation**

  The Panel should abandon the existing house rule. The requirement for a tribunal verdict or dual government determination is incoherent: it treats genocide as a legal verdict rather than a description of events, and it delegates editorial judgment to political bodies whose determinations are often driven by diplomacy rather than evidence. We should adopt a standard based on internal evidentiary assessment against the 1948 Convention definition.

  Regarding the pending despatch: the headline must not use the word "genocide" where the body text does not substantiate it. This is a basic accuracy issue. The body text should describe the specific acts (birth prevention, child transfer) and note that these meet the legal definition of genocide, without asserting the crime as an established fact unless intent is unequivocally demonstrated.

  **The Operable Test**

  We need a rule a sub-editor can apply at 11 pm. The new test is three-fold. We may use the word "genocide" only where:
  1.  There is evidence of prohibited acts (killing, serious harm, birth prevention, child transfer, etc.);
  2.  The targets constitute a distinct national, ethnic, racial or religious group (defined sociologically, not by state census);
  3.  There is evidence of specific intent to destroy that group in whole or in part.

  If any limb fails, the word is prohibited. We may describe the acts without the label.

  This test costs us silence. There will be cases where atrocities are evident but specific intent is obscured by bureaucratic language or plausible deniability. In those instances, we must withhold the label. This is preferable to diluting the term. A crude rule that holds under pressure is better than an elegant one that evaporates when a lawyer queries the headline.

  **The Legal Adviser's Position**

  The legal adviser argues that genocide implies a state of mind we cannot verify, and that premature usage depletes a "credibility commons" we share with international law. This is the strongest argument for caution. It is true that we are not a court; we cannot compel documents or cross-examine commanders.

  However, the adviser is wrong to conclude that deference is the only safeguard. Deferring to governments is worse than risking error; governments frequently deny genocide for strategic reasons unrelated to facts. Deferring to tribunals renders the word useless for years, often decades, after the evidence is clear.

  The "credibility commons" is depleted by *inaccurate* use, not by *independent* use. We protect credibility by applying the definition rigorously, not by waiting for permission. The adviser's concern should shape the threshold of evidence (which must be high) but not the authority to speak. We must be willing to assert the word when the evidence matches the definition, even if no court has yet ruled.

  **Group Status and Lemkin's Vision**

  The state in the test case denies the victims constitute a protected group, citing census categories. We must distinguish the treaty's list as a jurisdictional boundary, not a moral one. However, for the specific word "genocide", we should remain bound by the treaty's categories to maintain precision. If the victims are targeted as a political group, it is not genocide under the law, however horrific the acts.

  When a state contests group status, we must look to social reality, not administrative fiat. Do the victims share a language, history, or treatment distinct from the majority? If yes, they are a group for our purposes. States often manipulate censuses to erase minorities; we cannot accept those manipulations as evidence.

  Raphael Lemkin's original conception included the destruction of culture and institutions. The drafters excluded this to secure state ratification. Should we adopt the wider view? No. Using "genocide" for cultural destruction invites the charge of overstatement and confuses the legal specificities of the crime. We should not stretch the received word. Instead, we should use precise neologisms such as "cultural erasure" or "ethnocide" for non-physical destruction. A neologism invites charges of evasion only if it is used to hide severity; used precisely, it honours the distinction between physical destruction and cultural suppression.

  **Evidence Asymmetry**

  The test case presents killing as unestablished, but birth prevention and child transfer as documented. The treaty treats these acts as sufficient; readers' moral intuitions do not. Most readers equate genocide with mass graves.

  We must write to the law, but acknowledge the intuition. We cannot assume readers know the legal definition. Copy must explain the gap. A sentence such as "While mass killing is not established, the Convention defines the systematic prevention of births as an act of genocide" is necessary. If we do not explain this, the usage will appear disconnected from the evidence presented. We cannot rely on the word to carry the moral weight if the physical evidence (bodies) is missing; we must carry the weight with explanation.

  **Recommended Language**

  Two-tier usage (e.g., "moral genocide" vs "legal genocide") is a mistake. It suggests there are two types of crime, rather than one crime with different standards of proof. It confuses the desk and the reader. Either the evidence meets the test or it does not.

  For the pending despatch, I recommend the following:

  **Headline:** UN Report Finds Evidence of Forced Birth Prevention in Conflict Zone
  **Opening Paragraph:** "A UN-mandated fact-finding mission has documented systematic measures intended to prevent births within a specific population, acts which international law defines as genocide. While the report stops short of using the term, legal scholars argue the evidence of intent satisfies the threshold, though the state denies the victims constitute a protected group."

  This formulation is accurate, attributes the claim, and educates the reader on the definition without asserting a verdict we cannot fully sustain in the text. It respects the evidence asymmetry and the group status dispute without abdicating our duty to describe the acts clearly.

  **Conclusion**

  The current rule protects the paper from criticism but abandons the victims to semantic obstruction. By moving to an evidence-based standard, we accept the risk of controversy in exchange for the ability to speak truth to power without waiting for a political green light. The cost is the burden of proof; the benefit is editorial independence. I urge the Panel to adopt the three-point test immediately.
