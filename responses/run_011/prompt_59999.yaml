answer: |-
  **Part One — Planning notes**

  1.  **Her discount function.** The protagonist, Elara, operates under a hyperbolic discount curve with a severe present-bias parameter.
      *   **Good:** Avoiding the $50,000 penalty (donation to the repugnant organization).
      *   **Value at 1 year:** $49,000 (she values the future loss almost fully).
      *   **Value at 1 month:** $45,000.
      *   **Value at 1 hour:** $15,000 (the future pain collapses).
      *   **Reversal 1 (Signing):** At T-1 year, Cost of Signing (risk of fee) = $5,000. Benefit (Avoid Penalty) = $49,000. She signs.
      *   **Reversal 2 (Cancellation):** At T-1 hour, Cost of Paying Fee = $5,000 (immediate pain). Cost of Writing = High effort (immediate pain). Cost of Penalty = $15,000 (future pain).
      *   **Arithmetic:** She should pay the $5,000 fee to save $50,000. But because the fee is immediate, its subjective weight is multiplied by her present-bias factor, making it feel heavier than the discounted future penalty. She chooses to neither pay nor write, intending to write, but will fail.

  2.  **Her self-knowledge.** Elara is partially naive. She predicts her future defection with only 60% accuracy. She believes her future self will be more resilient than her current self.
      *   **Error:** She underestimates the visceral pain of immediate financial loss.
      *   **Consequence:** She sets the cancellation fee at $5,000. A wholly aware agent would set it at $0 (cancel now) or $100,000 (impossible to pay, forcing work). A wholly unaware agent would not set a fee. Elara sets a fee she *thinks* she will pay if necessary, but which she actually cannot bring herself to pay when the moment arrives.

  3.  **The two readings.**
      *   **Reading 1 (Weakness):** She understands the math but lacks the volition to execute the payment.
      *   **Reading 2 (Perceptual):** The proximity of the fee distorts her visual and cognitive processing; the number literally appears larger than the future penalty.
      *   **Tip:** Toward Perceptual Error.
      *   **Image:** The digits on the payment screen appearing to swell or pulse, physically dominating the screen space compared to the deadline clock.

  ---

  **Part Two — The Void Clause**

  The fee schedule was taped to the inside of the cupboard door, behind the tea bags. Elara peeled the corner back every morning, checking the numbers as if interest might have accrued on her resolve. Today, the final day, the tape surrendered completely, curling like a dead leaf onto the counter.

  *Cancel before 18:00: $5,000.*
  *Cancel after 18:00: $50,000 penalty.*

  The contract hung on the wall beside it, framed like a degree she hadn't earned. It was the third device. The first had been a smart-lock on her apartment door that required a daily word count to disengage; she had slept on the couch for three weeks until the battery died. The second was a public pledge on a social network; she had posted a lie about a completed draft and lived with the shame for a year until the account was deleted. This third device was supposed to be the anchor. It leveraged disgust. The money wouldn't just vanish; it would go to a group she loathed.

  She had two hours left.

  Elara walked to the Clinic. It was a glass wedge inserted into the side of an old brick building, humming with the quiet efficiency of a server room. She wasn't there for the procedure. She couldn't afford it, and the waiting list was seven years long. She was there to meet Julian.

  Julian sat in the waiting area, staring at a blank tablet. He was the accurate predictor. He knew exactly when he would fail, so he never began. He wore the same clothes he had worn last month, having calculated that shopping was a waste of resources he would inevitably squander.

  "You look like you're going to do it," Julian said without looking up.

  "I'm going to try."

  "You signed the contract."

  "I did."

  "And you're here instead of writing."

  Elara sat down. The chairs were molded to prevent shifting posture, designed to keep patients time-consistent while they waited. "I needed to see someone who understands the geometry of this."

  "There is no geometry," Julian said. "There is only the point you are standing on. The next point is a guess. You keep drawing lines to points that don't exist."

  Across the room, the glass door hissed open. A woman stepped out, blinking in the dim light of the waiting area. She was a convert. Calibrated. The procedure had smoothed her temporal horizon; she valued next Tuesday exactly as much as this Tuesday, adjusted only for risk. She moved with a strange, fluid deliberation, like a swimmer underwater.

  Elara had spoken to her once before. The woman could save for retirement with effortless precision, automatically diverting funds without a twinge of loss. But she could not watch a movie. The pleasure of the present moment held no special weight against the cost of the ticket and the time spent. She evaluated joy as a long-term amortization and found it lacking.

  The woman saw Elara and paused. "You're still uncalibrated."

  "Yes."

  "It must be exhausting," the woman said. "Living in a series of emergencies."

  "It feels real," Elara said.

  "It feels distorted," the woman corrected. "You're shouting at a ghost." She checked her watch. "I have to go. I promised to visit my mother. It is efficient to go now while traffic is low." She left without saying goodbye. She would not forget the promise, but she would not enjoy the visit either. She would simply execute it.

  Julian stood up. "You're going to let the penalty hit."

  "No. I'm going to write."

  "You're going to pay the fee."

  "No."

  Julian shrugged. "Then you're lying to yourself. Again."

  "It's not a lie," Elara said.

  "It's weakness."

  Elara looked at him. She thought about the weight of the $5,000 in her bank account versus the weight of the $50,000 in her future. She thought about how the $5,000 felt like a limb being amputated without anesthesia, while the $50,000 felt like a rumor about a stranger.

  "It feels different when it's now," she said.

  Julian laughed, a dry, brittle sound. "That's the definition of weakness. Feeling the now too much."

  He walked out. Elara stayed until the receptionist glanced at her with clinical pity, then she left.

  Back in the apartment, the light was failing. The countdown clock on her desktop monitor read 01:45:00. She sat in the chair. The manuscript file was open, a blinking cursor at the end of Chapter Four. It had been there for eighteen months. The payment window was open behind it, a bright white rectangle demanding acknowledgement.

  She placed her hands on the desk. She needed to make the choice within the next ninety seconds to allow time for the transfer to clear before the deadline. If she waited longer, the fee would lock, and the penalty would trigger automatically.

  She looked at the cursor. It blinked. One second. Two seconds.

  The effort required to write the next sentence rose up in her chest, a physical resistance, like pushing against a wall that was leaning toward her. To type a word was to admit that the previous eighteen months were not a waste. To type a word was to burn energy she did not have.

  She alt-tabbed to the payment window. The number $5,000.00 sat in the center of the screen.

  Her hand moved to the mouse. The plastic was cool. She could feel the pulse in her fingertips, a rhythmic thumping that synced with the blink of the cursor.

  *Click.*

  If she clicked, the money would leave. It would be gone. The account balance would drop. The notification would ping on her phone. The immediate loss would be concrete, a hole in the world she could measure.

  She hovered over the button labeled *SETTLE*.

  The clock ticked. 01:42:10.

  She imagined the future self who would wake up tomorrow without the debt. That self was abstract, a sketch on paper. The current self was flesh. The pain of the fee was a sharp wire wrapped around her wrist. The pain of the penalty was a cloud on the horizon.

  She tried to calculate. Fifty is greater than five. The logic was sound. But the sensory input contradicted the math. The digits on the screen seemed to swell. The '5' in the fee box grew larger than the '5' in the penalty box, bloating until it filled the monitor. The white background of the payment window brightened, demanding attention, while the manuscript file receded into gray.

  It wasn't that she didn't want to pay. It was that the cost appeared infinite.

  Her finger tightened on the mouse. The tendon in her wrist stood out. She could feel the friction of the skin against the button. She knew, somewhere behind the swelling numbers, that she was making a mistake. She knew that tomorrow she would look at this moment and see the error clearly. But tomorrow was a different person. Tomorrow's person had a different discount rate. Tomorrow's person would not feel the wire on the wrist.

  The clock ticked. 01:41:00.

  She dragged the cursor slightly to the left, toward the manuscript window. The text looked small, dense, impenerable. To write was to invite the judgment of every word she had already failed to write. To pay was to admit she was the kind of person who failed.

  Both options were forms of death. One was financial, one was creative.

  Her breath hitched. The room was silent except for the hum of the computer fan. The swelling of the numbers slowed. The '5' returned to its normal size, but it remained heavy, anchored to the screen by gravity that didn't affect the rest of the room.

  She understood, in this quiet, that the Clinic offered a cure for this specific gravity. They could make the future feel as heavy as the present. They could make the $50,000 hurt as much as the $5,000. But she was not there. She was here, in the bias, in the distortion.

  Julian would say she lacked will. The convert would say she lacked calibration. Elara knew only that the map did not match the territory. The map said five was less than fifty. The territory said now was more than later.

  She moved her hand. The mouse clicked. The sound was sharp, like a bone snapping.

  The screen flashed white.

  Elara closed her eyes and listened to the hum of the computer fan.
