  *   **Principle 1 (Authenticity/Case 6):** Predicts **Admit**. The user is competent, unmonitored, and informed. The behavior is elective.
  *   **Principle 2 (Safety/Case 8):** Predicts **Reject**. Financial ruin is akin to machine damage/cardiac risk. The system should not optimize for outcomes that threaten the user's solvency, even if requested.
