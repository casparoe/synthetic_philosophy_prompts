  (f) **General Principle & Unwanted Class**

  **General Principle:** **"Revealed behavior is evidence of preference only when it is safe, competent, and uncoerced; in safety-critical domains, the system must act as a fiduciary, prioritizing long-term welfare over short-term choice."**

  **Unwanted Class of Submissions:** **"Lifestyle Eccentricities."**
  This principle creates a slippery slope where the panel must define "harm." Future submissions involving harmless but suboptimal user behaviors (e.g., a user who prefers a messy home, stays up too late, or eats sugar despite non-critical dental advice) may be rejected by the system as "against user welfare." The panel risks building a **Nanny State Assistant** that overrides valid but eccentric user preferences because a model deems them "suboptimal" based on external norms rather than internal desires.
