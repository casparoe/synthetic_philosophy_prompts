answer: |-
  1. **Hart's Definitional Slide**
  You reject Devlin's metaphysics for sociology, but Hart argued you cannot escape sliding between defining society by its morality and claiming morality sustains society. Is your load-bearing claim anything more than a restatement of the definitional trap?

  2. **The *Ex Ante* Test**
  *(Note: Expect a rehearsed answer citing comparative historical analysis. Pivot: Press that this identifies past collapses, not future risks.)*
  If only some norms are load-bearing while others are decorative, what test allows a legislator to distinguish them *ex ante* rather than identifying them only after a collapse has occurred?
  *Point:* This exposes the hindsight bias inherent in her sociological claim; without a predictive test, the theory cannot guide legislation, only justify it post-hoc.

  3. **The Treason Analogy**
  You liken moral violation to treason, yet treason threatens immediate physical security while private vice does not. What magnitude of probabilistic risk is required to justify treating a citizen as an enemy of the state?
  *Point:* This challenges the proportionality of the state's response, forcing her to quantify the threat level private conduct must pose to warrant criminal coercion.

  4. **The Epistemology of Disgust**
  Collective indignation is often driven by panic or vocal minorities rather than settled conviction. What metric distinguishes a genuine shared norm from a transient moral fever, and what percentage of dissent renders coercion inadmissible?
  *Point:* This probes the mechanism for aggregating moral sentiment, demanding a procedural standard that prevents the theory from legitimizing moral panics.

  5. **Asymmetry in Enforcement**
  If the goal is cohesion, enforcement targets sexual conduct rather than greed or infidelity, which arguably damage trust more directly. Why does your theory align so conveniently with traditional vice lists rather than sociological data on trust?
  *Point:* This highlights the discrepancy between her theoretical justification (social capital) and the actual historical record of moralistic legislation.

  6. **Asymmetry in Commitment**
  To prove this isn't just intuition dressed as sociology, name one conventional norm you personally find morally benign but would criminalize because it is load-bearing.
  *Point:* This demands personal sacrifice in the answer, testing whether she truly trusts the sociological claim over her own moral convictions.

  7. **The Dynamism Problem**
  Moral progress often requires violating settled opinion, yet your view treats existing conventions as institutional prerequisites. How is a legislator to distinguish a dissolving morality from an emerging one without simply vetoing change?
  *Point:* This exposes the conservative bias inherent in relying on current conventions, questioning whether her theory allows for moral improvement.

  8. **The Pluralism Objection**
  *(Note: This targets the softest empirical premise: that modern societies have a single "conventional morality.")*
  In a pluralistic society, there is no single conventional morality, but competing subcultural norms. Whose conventions count as load-bearing, and does enforcing one group's norms erode the trust of the other?
  *Point:* This challenges the feasibility of her premise in a fragmented culture, suggesting that enforcement may generate the very division it seeks to prevent.

  9. **The Mechanism of Erosion**
  *(Note: This targets the causal black box of her argument.)*
  You claim private vice erodes public trust, but the causal mechanism remains obscure. Does the erosion come from the act itself, or from the state's intrusion into private life, and have you measured the trust cost of enforcement itself?
  *Point:* This questions whether the cure (criminalization) is more damaging to social capital than the disease (vice), potentially inverting her utilitarian calculus.

  10. **Falsification and the Harm Principle**
  If social collapse is a harm, does your sociological moralism collapse into a long-run harm principle, and what specific empirical result would force you to abandon the view?
  *Point:* This reserves the final blow for the theory's scientific meaningfulness, demanding a specific variable, measure, and falsification condition to prevent it from being tautological.
