      *   If I change C3 to admit stopping rules affect *reliability* (not evidence), does that help?
      *   Actually, the C1/C8 tension is technically fatal for a statistician. If you know sampling theory, you know CIs depend on stopping rules.
      *   However, the C3/C4 tension is philosophically fatal.
      *   Let's look at C7 again. "Selective reporting... are marginal contributors." This contradicts C4 ("Optional stopping is a genuine methodological wrong... return such a manuscript"). Why return it if it's a marginal contributor to the crisis?
      *   *Decision:* The C7 vs. C4/C5 tension is the most damaging to the *narrative* of the paper. The C3 vs C4 tension is the most damaging to the *logic*.
      *   I need to choose the "Single Revision."
      *   If I revise C3 to align with C4 (Stopping rules *do* affect inference), I break C2 (Likelihood Principle).
      *   If I revise C4 to align with C3 (Stopping rules don't matter), I undermine my role as AE.
      *   If I revise C7 (Admit QRPs are major), I align C4/C5 (Reforms) with C7 (Diagnosis). This leaves the C2/C3/C4 philosophical tension, but it makes the *policy* argument coherent.
      *   *Alternative:* The C1/C8 tension is the easiest to fix technically. Just qualify C8.
      *   *Best Coherence Revision:* Abandon C3 (Strong Likelihood Principle) in favor of a conditional view. Or, Abandon C4's justification.
      *   *Actually, the strongest lever is C4.* If the user holds C2/C3 (Likelihoodist), they *cannot* consistently hold C4 as stated ("data merit less credence"). They must change C4 to be about "long-run error control" rather than "credence in this instance."
      *   *Wait, looking at C7 again.* C7 says power is the problem. C4/C5 say QRPs are the problem. This is a direct contradiction on the *cause* of the crisis.
      *   *Let's prioritize:*
          1.  C3 vs C4 (Logical contradiction on stopping rules).
          2.  C7 vs C4/C5 (Empirical contradiction on crisis cause).
          3.  C1 vs C8 (Technical contradiction on frequentist properties).
      *   The "Single Revision" should probably address the C3/C4 split because it strikes at the definition of inference.
      *   *Revision:* Qualify C3. "Stopping rules are evidentially irrelevant *for the likelihood ratio*, but relevant for *error probabilities* which govern methodological trust." This bridges C2/C3 with C4/C5. It costs the purity of the Likelihood Principle.

