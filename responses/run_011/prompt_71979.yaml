      3.  **C1 vs. C8:** Technical inconsistency. CIs and $p$-values share the same frequentist foundations. You can't condemn one for sampling dependence and exonerate the other.
      4.  **C2 vs. C6:** Philosophical friction. C2 endorses LR. C6 refuses to use the main tool that operationalizes LR in a decision framework (Bayes Factors) or priors. It leaves the "evidence" hanging without a bridge to belief. (Less severe because Likelihoodism is a coherent school, but it weakens the practical utility).

