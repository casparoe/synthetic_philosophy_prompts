      *   **C2/C3 vs. C5:** If evidence is fixed by data (C2/C3), why does preregistration (a design feature) matter for *evidence*? C5 claims it resolves the crisis. If the crisis is about false claims, and C2/C3 say design doesn't change evidence, C5 must be about error control, not evidence. But C5 is framed as the solution to the "replication crisis," which is often framed as an evidential crisis.
      *   **C2 vs. C6:** C2 says evidence is LR. C6 says "I do not report Bayes factors" (which are weighted LRs) and implies LRs are the "appropriate summary." But without priors, how do you get from LR to decision/credence? C6 rejects priors but C2 defines evidence as LR. This is actually fairly consistent (Likelihoodist stance), *but* C4 requires a judgment ("less credence") that Likelihoodism struggles to justify without error probabilities or priors.
      *   **C7 vs. C4/C5:** C7 says the crisis is mostly low power (Type II errors/small effect sizes), not $p$-hacking (Type I error inflation). C4 and C5 focus heavily on $p$-hacking behaviors (optional stopping, preregistration to prevent HARKing/$p$-hacking). If C7 is true, C4 and C5 are solving the wrong problem.
      *   **C1 vs. C8:** C1 says $p$-values aren't evidence because they depend on the sampling plan (tail area). C8 says CIs are immune. But CIs are mathematically dual to $p$-values in standard frequentist testing. A 95% CI that excludes 0 is equivalent to $p < .05$. If the $p$-value is tainted by the sampling plan (C1), the CI coverage probability is also tainted by the sampling plan. C8 claims immunity that doesn't exist under standard frequentist theory.

  4.  **Rank Tensions by Severity:**

