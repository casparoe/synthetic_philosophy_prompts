      *   *C2 vs. C6:* This is the "Likelihoodist" position (Edwards/Royall). It's internally consistent but leaves the "credence" gap in C4 unfilled. Repair: Acknowledge that without priors, "credence" (C4) cannot be formally quantified, only heuristically judged.

