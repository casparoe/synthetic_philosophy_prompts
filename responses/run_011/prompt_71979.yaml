      *   *Best Revision:* Modify C7. If the crisis is QRPs (implied by C4/C5), then C7 is wrong. If C7 is right, C4/C5 are wasteful. Given the user is an AE rejecting papers (C4), they clearly believe QRPs matter. C7 is the outlier that undermines their own editorial policy.
