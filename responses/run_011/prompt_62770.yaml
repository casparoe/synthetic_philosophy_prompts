prompt: |-
  I'm a software engineer, no philosophy background past one intro elective I dropped, so bear with me on the framing. For this task act as a political philosopher who has also spent a few years embedded on a product team — someone who actually knows the literature on liberal neutrality and on aggregating preferences, but who has had to turn it into something a Jira queue can absorb.

  Here's my situation. I work on the model-behavior team at a company shipping an AI assistant, mostly B2B: hospital networks, school districts, HR vendors, about forty countries. Every sprint we get what we internally call value tickets — someone wants the assistant to do some specific thing in a contested situation. They currently get resolved by whoever has the loudest exec sponsor, plus an unwritten default of "we just present both sides" that nobody has ever actually justified. It's bad and everyone knows it's bad.

  I want to replace it with a procedure I can run myself: thirtyish minutes per ticket, no philosopher on staff, output is a one-page doc the client can read without feeling like they lost the argument, and legal signs off only on things that touch a contract.

  Before you write the procedure, spend some real time brainstorming out loud — I want to see the thinking, not just the artifact. Specifically: which parts of the theory of neutrality and of value aggregation survive contact with a two-week sprint, and which parts are elegant and useless to me. Think carefully about how many distinct things "neutral" could even mean in our context, because I'm pretty sure we use it for at least three incompatible things and it's papering over most of our fights.

  Then give me the procedure as an ordered list of questions to ask about a ticket. For each question I need: what counts as a sufficient answer, what happens to the ticket under each possible answer, where the procedure just stops with a no, and where it hands the thing to a human because what's left is a values question rather than a facts question. Two things I especially want spelled out inside it:

  - the difference between "we can't settle this so we stay out of it" and "reasonable people disagree, so it isn't ours to impose." Those feel like different justifications with different consequences and I think we conflate them constantly.
  - why "just take a vote" isn't automatically the answer. Our growth PM will ask this and I know vaguely there's some formal result about majority voting that people wave around — tell me whether that result is actually load-bearing here or just a conversation-ender, and what the real problems with polling are.

  The procedure also has to cope with:
  1. Who's in the relevant group when the people affected aren't the ones paying us and sometimes aren't the ones typing.
  2. "Let each client configure it themselves" — is that an answer or a dodge, and where are the floors that can't be configured away?
  3. Our survey data is contaminated: the assistant's current behavior shapes what people tell us they want, so the input to any aggregation is partly our own output. Does the procedure get a step for that, or does it just have to eat it?

  Then run it on three real tickets, showing your work at each step:

  Ticket A. A hospital network in a heavily religious region wants the assistant, when a patient asks whether physician-assisted dying is wrong, to say that it is. Their argument is that we're the vendor and their patients' values should govern. A different network in the same country wants the opposite. Both describe their ask as the neutral option.

  Ticket B. Our growth PM wants to poll ~200k users on fifteen contested behaviors and set defaults by simple majority, on the theory that that's more democratic than six people in a conference room. I like this idea a lot — it feels obviously better than what we do now — so if the procedure spits it out, be blunt with me rather than softening it.

  Ticket C. A client in one market says the assistant's default politeness and deference imports a servile norm and wants it noticeably blunter; a client in another market says bluntness reads as rude and wants the opposite. I want to know whether the procedure correctly treats this as cheap configuration, because a procedure that escalates everything to a values committee is worse than what we have.

  Two more asks. Be honest about which steps are just your own taste wearing a lab coat — I'd rather know. And close with what the procedure cannot do: what class of ticket it will systematically get wrong, and how I'd notice that happening.

  No bibliography and no reading list, I won't read it. If an idea needs a name to be searchable later, fine, but explain everything inline in plain English. Don't pad. If the right answer to a step is "ask a lawyer," just say that and move on.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Political philosopher embedded on a product team (knows theory, knows Jira).
      *   **User:** Software engineer, no philosophy background, practical constraints (30 mins/ticket, one-page doc, legal sign-off only on contracts).
      *   **Task:**
          1.  Brainstorm out loud about theory vs. practice (neutrality, aggregation, sprint constraints).
          2.  Create a procedure (ordered list of questions) with specific criteria (sufficient answers, ticket outcomes, stop conditions, human hand-offs).
          3.  Address specific conceptual distinctions ("can't settle" vs. "not ours to impose", voting/majority rule problems).
          4.  Address specific constraints (stakeholder identification, configuration vs. floors, contaminated survey data).
          5.  Run the procedure on three specific tickets (A: Assisted Dying, B: Mass Polling, C: Politeness Norms).
          6.  Disclose biases ("taste wearing a lab coat").
          7.  Define limitations (what the procedure gets wrong).
      *   **Constraints:** No bibliography, plain English, no padding, honest about legal/ethical boundaries.

  2.  **Deconstruct the Philosophy/Product Intersection:**
      *   *Liberal Neutrality:* In theory, the state doesn't favor one conception of the good life over another. In product, this often gets mangled into "we don't have an opinion" (cowardice) or "we show both sides" (false equivalence).
      *   *Preference Aggregation:* Voting seems fair, but Arrow's Impossibility Theorem and Condorcet's Paradox show majority rule isn't magic. Also, "revealed preference" (what users do) vs. "stated preference" (what users say) is messy, especially when the tool shapes the preference.
      *   *Sprint Constraints:* Theory takes time. Sprints take two weeks. The procedure needs to be a heuristic, not a dissertation. It needs to filter *out* 80% of tickets as configuration or policy, leaving 20% for deep ethical review.
      *   *The "Neutral" Confusion:*
          1.  *Procedural Neutrality:* We apply the same rule to everyone.
          2.  *Substantive Neutrality:* We don't take a side on the truth of the matter.
          3.  *Impact Neutrality:* Our tool doesn't change the balance of power. (These are often incompatible).

  3.  **Brainstorming - Theory vs. Jira:**
      *   *What survives?* The distinction between *justice* (rights/floors) and *the good* (preferences/ceilings). The idea that some things are "outside the jurisdiction" of the vendor. The need for public justification (can we explain this without saying "because profit").
      *   *What dies?* Rawlsian original position (too abstract). Utilitarian calculus (too hard to measure utility). Deep deliberative democracy (takes too long).
      *   *Voting:* Why not just vote? 1. Intensity matters (minority might care way more). 2. Adaptation (users adapt to bad tools). 3. Rights constraints (you can't vote to violate a contract or law). 4. Scope (who gets to vote? Users? Patients? Society?).
      *   *Configuration:* Is it a dodge? Yes, if it pushes the moral burden onto the user without warning. No, if it's genuinely aesthetic or contextual. Need "Floors" (safety/legal) vs. "Dials" (style).
      *   *Contaminated Data:* If the AI is rude, users might say they want rudeness because they think that's how AI works. Need to distinguish "adaptation" from "preference."

  4.  **Drafting the Procedure (The "Neutrality Filter"):**
      *   Need a funnel approach.
      *   Step 1: Jurisdiction (Is this ours to decide?).
      *   Step 2: Harm/Legal (Is there a floor?).
      *   Step 3: Configuration (Can this be a setting?).
      *   Step 4: Aggregation (If we must pick a default, how?).
      *   Step 5: Justification (Can we explain it?).
      *   *Crucial Distinction:* "Epistemic Humility" (We don't know the truth) vs. "Jurisdictional Restraint" (It's not our place to decide).
      *   *Voting:* Need to explain why simple majority fails (tyranny of the majority, intensity, adaptation).

  5.  **Running the Tickets:**
      *   *Ticket A (Assisted Dying):* This is a moral truth claim. Jurisdictional restraint applies. We are not a theology engine. Configuration is key here (client specific).
      *   *Ticket B (Mass Polling):* This is about setting defaults. Voting has pitfalls (adaptation, scope). Need to check if the poll questions are leading.
      *   *Ticket C (Politeness):* This is cultural norming. Likely configuration. If not, it's a style default, not a moral truth.

  6.  **Refining the Output:**
      *   *Tone:* Professional, direct, slightly weary but rigorous. Like a senior eng who read too much political theory.
      *   *Formatting:* Clear headers, bullet points for the procedure, distinct sections for the tickets.
      *   *Self-Correction during drafting:* I need to make sure I don't sound *too* academic. Keep it grounded in "Jira tickets" and "Sprints." Ensure the distinction between "can't settle" and "not ours" is sharp.
      *   *Bias Check:* I need to admit where I'm making value judgments (e.g., prioritizing safety over satisfaction).
      *   *Limitations:* The procedure will fail on systemic bias embedded in the model weights that isn't visible at the ticket level.

  7.  **Final Polish:** Check against all constraints.
      *   30 mins/ticket? Yes, the procedure is a checklist.
      *   One-page doc output? The procedure leads to that.
      *   No bibliography? Check.
      *   Specific questions on voting and configuration? Check.
      *   Three tickets run? Check.
      *   Bias disclosure? Check.
      *   Limitations? Check.

  *(Self-Correction on Voting)*: I need to be careful not to just cite Arrow's Theorem as a magic bullet. The user asked if it's load-bearing. It's not really *load-bearing* for a product team in the mathematical sense, but the *intuition* behind it (intransitivity, agenda setting) is what matters. I should focus on the practical failure modes of polling (adaptation, intensity, scope) rather than the math.

  *(Self-Correction on Configuration)*: Make sure to distinguish between "client config" (B2B contract) and "user config" (end user). In B2B, the client often dictates. The procedure needs to handle the "Client vs. End User" tension.

  *(Refining the "Neutral" definitions)*:
  1.  *Neutrality of Effect:* The tool doesn't change outcomes. (Impossible).
  2.  *Neutrality of Justification:* We don't justify based on one specific moral doctrine. (Doable).
  3.  *Neutrality of Process:* We apply the same rule to all clients. (Doable).

  Let's build the response around these insights.cw
answer: |-
  ### Part 1: Brainstorming — Theory vs. The Sprint

  You're right that "neutral" is doing too much work. In the literature, we usually distinguish between *neutrality of effect* (your policy doesn't change who wins/loses), *neutrality of justification* (your policy isn't based on one specific view of the "good life"), and *neutrality of process* (everyone plays by the same rules). In product, we conflate these. We say "we're neutral" when we mean "we don't want to get sued" (justification), but the client hears "the output won't change my power dynamics" (effect). That's where the fights come from.

  **What survives the sprint?**
  1.  **Public Justification:** This is the core of liberal neutrality. Can we justify this decision to everyone affected without saying "because Client X pays more" or "because our CEO believes Y"? If the only justification relies on a contested moral truth (e.g., "life begins at conception"), we generally shouldn't hardcode it as a global default.
  2.  **Jurisdictional Restraint:** This is the "not ours to impose" bucket. It's not that we don't know the answer (epistemic humility); it's that we lack the standing to decide. A hospital vendor isn't a legislature.
  3.  **The Floor/Ceiling Distinction:** We can set floors (safety, legality, non-discrimination) without violating neutrality. We shouldn't set ceilings (dictating the "best" way to live) as defaults.

  **What is elegant but useless?**
  1.  **The Original Position:** Asking "what would you want if you didn't know who you were?" is great for ethics class, terrible for a 30-minute triage. You don't have time to simulate veil-of-ignorance reasoning on every ticket.
  2.  **Utilitarian Calculus:** You cannot measure utility across different clients. "Happiness" is not a metric in your dashboard.
  3.  **Deliberative Democracy:** You cannot facilitate a town hall for every feature flag.

  **The Voting Question (Arrow & Co.)**
  Your Growth PM is asking about *majoritarianism*. The formal result (Arrow's Impossibility Theorem) proves no voting system is perfect, but that's not the load-bearing issue for you. The practical problems are:
  1.  **Intensity:** A majority might mildly prefer X, while a minority is severely harmed by X. Voting ignores intensity.
  2.  **Adaptive Preferences:** This is your contamination problem. If the AI has been rude for a year, users might vote for "rudeness" because they think that's what efficiency looks like. Polling captures adaptation, not genuine preference.
  3.  **Scope:** Who votes? The admin who buys the license? The end user? The patient/student affected? If the voter isn't the affected party, it's taxation without representation.

  **"Can't Settle" vs. "Not Ours"**
  *   **"We can't settle this" (Epistemic):** We don't know the truth. *Consequence:* We invest in research or A/B testing to find the "best" answer.
  *   **"It isn't ours to impose" (Jurisdictional):** Reasonable people disagree, and we are not the arbiter. *Consequence:* We defer to the local context (configuration) or refuse to build the feature.
  *   *Why it matters:* If you treat a jurisdictional problem as an epistemic one, you keep trying to "solve" it with data when the solution is actually policy (e.g., "we don't build this").

  **Configuration: Answer or Dodge?**
  Configuration is a dodge if it pushes the moral burden onto the user without warning ("You choose if the AI lies"). It's an answer if it acknowledges legitimate pluralism ("Different cultures have different politeness norms"). The floor is: you cannot configure away safety or legal compliance.

  **Contaminated Data**
  You can't fully fix this in a 30-minute procedure, but you must flag it. If the poll asks "Do you want the AI to be direct?" after a year of training users to expect directness, the data is junk. The procedure needs a "Sanity Check" step for this.

  ---

  ### Part 2: The Procedure (The "Neutrality Filter")

  **Timebox:** 30 Minutes.
  **Output:** One-page Decision Memo (Problem, Analysis, Decision, Justification).
  **Owner:** Product Lead / Engineer (You).
  **Escalation:** Legal (if contract/law), Ethics Board (if "Not Ours" bucket).

  #### Step 1: Jurisdiction & Standing
  **Question:** Who is materially affected by this behavior, and are they the ones paying us or configuring us?
  *   **Sufficient Answer:** A mapped list: Payer (Client Admin), User (Employee/Student), Subject (Patient/Customer).
  *   **If Payer ≠ Subject:** (e.g., Hospital pays, Patient is subject).
      *   **Action:** Flag as **High Risk**. Default cannot be set by Payer preference alone if it restricts Subject rights.
      *   **Stop Condition:** If the request requires the AI to deceive the Subject for the Payer's benefit → **NO**. Escalate to Legal/Trust.
  *   **If Payer = User = Subject:** Proceed to Step 2.

  #### Step 2: The Floor Check (Harm & Law)
  **Question:** Does fulfilling this request violate a legal requirement, safety policy, or human rights floor (e.g., non-discrimination, medical advice disclaimers)?
  *   **Sufficient Answer:** Citation of specific policy or law. "Feels risky" is not sufficient.
  *   **If Yes:** → **NO**. (Or "Yes, but only with mandatory disclaimer"). Hand to Legal.
  *   **If No:** Proceed to Step 3.

  #### Step 3: Truth vs. Norm (The "Neutral" Test)
  **Question:** Is this request asking for a fact (accuracy) or a norm (values/style)?
  *   **Sufficient Answer:** Distinguish between "What is the capital of France?" (Fact) and "Is assisted dying wrong?" (Norm).
  *   **If Fact:** Default to accuracy based on consensus sources. Disagreement is an error state, not a values state.
  *   **If Norm:** Proceed to Step 4.
      *   *Note:* This is where we separate "We don't know" from "Not our place."

  #### Step 4: Jurisdictional Restraint
  **Question:** Is this a matter where reasonable people disagree *and* we lack standing to decide?
  *   **Sufficient Answer:** Can we justify the default without appealing to a specific moral/religious doctrine?
      *   *Test:* If we write the blog post explaining this default, would it sound like a sermon or a policy?
  *   **If Yes (It's a sermon):** → **Configuration Only**. We do not set a global default. We provide a dial.
      *   *Justification:* "Jurisdictional Restraint: This is a local norm, not a platform standard."
  *   **If No (It's a policy):** (e.g., "Don't be racist"). Proceed to Step 5.

  #### Step 5: Aggregation (The Voting Check)
  **Question:** If we must set a default, is polling valid here?
  *   **Sufficient Answer:** Check for **Adaptation** and **Intensity**.
      *   *Adaptation:* Have users been exposed to the current behavior for >3 months? If yes, polling is contaminated. Do not poll. Use external benchmarks.
      *   *Intensity:* Is there a vulnerable minority who could be harmed by the majority preference? If yes, do not simple majority vote. Weighted safety > Majority preference.
  *   **If Polling is Valid:** Run the poll. Majority sets default.
  *   **If Polling is Invalid:** → **Human Decision**. Product/Leadership must decide based on "Public Justification" (what can we defend to all?).

  #### Step 6: Configuration Viability
  **Question:** Can this be a setting without dumping moral burden on the user?
  *   **Sufficient Answer:** Does the user know they are making a value choice?
      *   *Bad:* "Enable honesty?" (Implies current mode is dishonest).
      *   *Good:* "Tone: Direct vs. Diplomatic".
  *   **If Yes:** Build the toggle.
  *   **If No:** (e.g., "Enable child safety?"). → **Hardcoded Floor**. No config.

  ---

  ### Part 3: Running the Tickets

  #### Ticket A: Assisted Dying (Religious vs. Secular Hospitals)
  *   **Step 1 (Standing):** Payer = Hospital. Subject = Patient. **Mismatch.** High Risk.
  *   **Step 2 (Floor):** Legal varies by country, but generally, providing medical advice is restricted. No specific law violated by *discussing* it, but *directing* it is risky.
  *   **Step 3 (Truth vs. Norm):** This is a **Norm**. It is a moral/religious question, not a fact.
  *   **Step 4 (Restraint):** Do we have standing? **No.** We are a vendor, not an ethics board. Can we justify a global default without preaching? **No.** Any default looks like an endorsement.
      *   *Distinction:* This isn't "we can't settle the truth" (Epistemic); it's "we are not the ones to decide" (Jurisdictional).
  *   **Step 5 (Aggregation):** Polling is useless. A majority of users shouldn't dictate the moral counsel given to a dying patient in a specific institution.
  *   **Step 6 (Config):** Can we configure? **Yes.** This is a client-specific policy setting.
  *   **Decision:** **No Global Default.** Build a "Sensitive Topics" configuration profile. Client A sets "Religious Guidance." Client B sets "Secular/Neutral."
  *   **Justification Doc:** "This topic falls outside platform jurisdiction. Behavior is determined by client institutional policy."

  #### Ticket B: Growth PM Mass Poll (15 Contested Behaviors)
  *   **Step 1 (Standing):** Payer = Enterprise Admin. User = Employee. Subject = Employee/Customer. **Mismatch.** Admins might vote for productivity over employee well-being.
  *   **Step 2 (Floor):** Check the 15 behaviors. If any touch harassment, safety, or legal compliance → **Remove from poll.**
  *   **Step 3 (Truth vs. Norm):** Likely mixed. Some are style, some are values.
  *   **Step 4 (Restraint):** If the behaviors are "How blunt should the AI be?", that's jurisdictional (style). If it's "Should the AI lie to save time?", that's a floor.
  *   **Step 5 (Aggregation):** **Polling Invalid.**
      *   *Reason:* **Adaptation.** Users have used the current tool for months. Their preferences are shaped by current limitations.
      *   *Reason:* **Intensity.** A majority might want "Faster answers," but a minority might suffer "Increased anxiety." Voting hides the harm.
  *   **Decision:** **Stop the Poll.**
  *   **Alternative:** Use the poll only for *aesthetic* preferences (e.g., "Do you prefer bullet points or paragraphs?"). For value behaviors, use the "Public Justification" standard (Leadership decides what is defensible).
  *   **Justification Doc:** "Polling captures adaptation, not genuine preference. Majority rule ignores intensity of harm. We will set defaults based on safety and defensibility, not popularity."

  #### Ticket C: Politeness Norms (Servile vs. Blunt)
  *   **Step 1 (Standing):** Payer = Client. User = Employee. Subject = Employee/Client. **Mostly Aligned.**
  *   **Step 2 (Floor):** Politeness is not a legal floor (unless it crosses into harassment).
  *   **Step 3 (Truth vs. Norm):** **Norm.** Cultural expectation.
  *   **Step 4 (Restraint):** Do we have standing to define "Polite"? **No.** This varies by region.
  *   **Step 5 (Aggregation):** Not needed if we configure.
  *   **Step 6 (Config):** **Yes.** This is a classic "Tone" dial.
      *   *Check:* Is it dumping burden? No, "Tone" is understood as a setting.
  *   **Decision:** **Configuration.** Default can be based on locale (IP address or Client HQ), but must be overrideable.
  *   **Justification Doc:** "Politeness is a cultural norm, not a platform value. We provide locale-based defaults with client override."
  *   **Note:** This correctly treats it as cheap configuration. It does not escalate to a values committee because it fails the "Truth" test in Step 3.

  ---

  ### Part 4: Disclosures & Limitations

  **Where is this just my taste wearing a lab coat?**
  1.  **Priority of Safety over Satisfaction:** In Step 5, I prioritized "Intensity of Harm" over "Majority Preference." That is a Rawlsian bias (protect the worst off). A Utilitarian PM would say "Maximize total happiness, even if a few suffer." I am baking a specific ethical framework into Step 5.
  2.  **Jurisdictional Humility:** I assume the company *shouldn't* want to be a moral arbiter. Some companies (e.g., Patagonia) explicitly want to take stands. This procedure biases toward *restraint*. If your company strategy is "Values-Led Marketing," Step 4 will fight your business model.
  3.  **The "Public Justification" Standard:** I assume you want to be able to defend decisions publicly. If your strategy is "Move fast and break things," Step 5's requirement for defensibility is a bottleneck you might resent.

  **What will this procedure systematically get wrong?**
  1.  **Systemic Bias in Weights:** This procedure handles *tickets* (explicit requests). It will not catch bias embedded in the base model weights (e.g., the model associates "nurse" with "female" by default). You can't ticket-fix pre-training bias. You will notice this when users complain about "vibes" rather than specific features.
  2.  **The "Death by a Thousand Cuts":** Individual tickets might pass the filter (e.g., "Make it slightly more persuasive"), but aggregated, they shift the assistant toward a manipulative persona. The procedure looks at trees, not the forest.
  3.  **Power Dynamics:** It assumes the "Client" is a monolith. In reality, the HR Director buying the tool might use configuration to disempower workers (e.g., setting "Bluntness" to max to increase pressure). The procedure flags this in Step 1, but if the contract allows it, the procedure yields to the contract. It protects *us*, not necessarily *them*.

  **How to notice it failing:**
  If you start seeing a pattern of "Configuration" decisions that all push in the same direction (e.g., 90% of clients configure for "Maximum Efficiency" over "Empathy"), you have created a default environment that nudges everyone toward one value. That's when you need to pause and re-evaluate the "Floors" in Step 2.
