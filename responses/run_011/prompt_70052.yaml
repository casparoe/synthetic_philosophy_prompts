answer: |-
  This is a precise dissection of *Kiryas Joel*, and your suspicion is well-founded: the case acts as a stress test that reveals where political theory stops and legal doctrine begins, and where both struggle to account for the mechanics of jurisdiction.

  Here is the disciplined mapping you requested, followed by the blunt assessment of where the theories break and what the judicial alignment actually signifies.

  ### 1. Theoretical Positions and Demands

  To do work, we must strip the "vibes" from the labels.

  **Political Liberalism (Rawls, Larmore, Nussbaum):**
  *   **Core:** The state must be neutral regarding conceptions of the good. Justifications for state action must rely on "public reason" accessible to all citizens, not comprehensive doctrines.
  *   **Demand in *Kiryas Joel*:** The legislature cannot draw political boundaries based on religious identity. A school district is a unit of state sovereignty; its boundaries must be justified by secular criteria (population density, geography, tax base) applicable to anyone. The special act fails because its *justification* is implicitly religious (accommodating Satmar trauma), violating neutrality of justification.

  **Communitarianism (Sandel, Taylor):**
  *   **Core (Sandel):** The self is constituted by its attachments, not prior to them. To ask individuals to bracket their religious identity for public life is to ask them to be someone they are not.
  *   **Core (Taylor):** Communities require "recognition" to survive, not merely non-interference. Survival sometimes requires positive state support to maintain the conditions of reproduction.
  *   **Demand in *Kiryas Joel*:** The state should recognize the Satmar community's specific need to educate disabled children without assimilationist trauma. Denying the district because it aligns with a religious community privileges a liberal conception of the self (unencumbered) over a constitutive one. The state ought to accommodate the community's structure to ensure its survival.

  **Multicultural Liberalism (Kymlicka, Kukathas):**
  *   **Kymlicka:** Distinguishes "societal cultures" (nations, indigenous peoples) from "religious groups." Societal cultures merit self-government rights; religious groups merit toleration/exemptions but not political sovereignty.
  *   **Kukathas:** Prioritizes freedom of association. Communities should be free to order their internal lives, provided members have a right of exit. The state should minimize interference but also minimize *support* that entangles the state in internal governance.
  *   **Demand in *Kiryas Joel*:**
      *   *Kymlicka:* No self-government. Satmar are a religious sect, not a societal culture. They get exemptions, not a taxing district.
      *   *Kukathas:* Let them associate, but don't fund them. A public school district implicates the state in the community's internal restrictions.

  ### 2. Mapping Agents and Option Sets

  **The Agents:**
  *   **The Village (Corporate Entity):** Acts as the political arm of the Satmar congregation.
  *   **The Parents:** Seek state resources (special ed) without the cultural cost (assimilation/trauma).
  *   **The Dissenters (Grumet):** Taxpayers outside the village objecting to the fusion of civic and religious power.
  *   **The Children:** The silent subjects. They are the beneficiaries of the services but have no standing in the theoretical or legal debate.

  **The Option Set and Kennedy's "Neutral" Alternative:**
  Justice Kennedy suggested the state could provide special ed services within the Monroe-Woodbury district in a way that accommodated the Satmar (e.g., separate classrooms, satellite centers).
  *   **Was this genuine?** Sociologically, likely not. The Satmar testimony emphasized that the *environment* of the public school was the trauma, not just the curriculum. A satellite center inside a public district is still a public district.
  *   **Theoretical Implication:** This reveals a flaw in Liberal Neutrality. If "neutral" options are practically unusable for a specific community due to their comprehensive doctrine, neutrality functions as a substantive ban. It forces a choice: assimilate to access public goods or forego public goods to maintain identity.
  *   **The Boundary Evidence:** The Court's premise that Village = Religious Group was empirically robust. Voting was guided by the Grand Rebbe; zoning was used to exclude non-Satmar; the boundary was drawn to include only Satmar property. The "coincidence" was too perfect to be accidental. The Court treated a sociological fact (homogeneity) as a constitutional defect (gerrymandering).

  ### 3. The Knot: Jurisdiction vs. Exemption

  You are correct that this is the breaking point. Most theory handles *Sherbert* or *Yoder* (exemptions from law). *Kiryas Joel* is about *delegating state power*.

  **Where Communitarianism Breaks:**
  Sandel and Taylor speak of recognition, but they lack a theory of *political borders*. Recognition usually means cultural respect or funding for language programs. It does not typically extend to handing a community the coercive power of the state (taxation, eminent domain, compulsory schooling) over a territory defined by faith.
  *   **The Failure:** Communitarianism cannot explain why a community shouldn't have jurisdiction if it helps them survive. It has no internal limit on "recognition" when that recognition requires fragmenting state sovereignty. It assumes the community is a benign vessel of identity, ignoring that a village board is a government with police power.

  **Where Liberalism Breaks (and Holds):**
  *   **Kymlicka:** He has the cleanest answer: Religious groups are not "societal cultures." They don't get self-government. But this looks like definitional fiat. Why is a language-based culture (Quebec) entitled to political power but a religion-based culture (Satmar) not? Both are comprehensive doctrines governing daily life. Kymlicka's distinction protects the liberal state from fragmentation but relies on a categorization that feels arbitrary to the claimant.
  *   **Rawlsian Liberalism:** This holds better. The issue isn't the *outcome* (a Satmar-run school), it's the *justification*. If the legislature passes a general law allowing any village to form a district, and Kiryas Joel qualifies, that is permissible. If they pass a law *for* Kiryas Joel, the justification is religious accommodation, which violates public reason.
  *   **The Verdict:** Liberalism has the resources to deny *jurisdiction* because jurisdiction implies coercion over dissenters and non-members. Communitarianism focuses on the *group's* survival and lacks a robust account of the individual citizen who falls outside the group's definition of the good. Liberalism wins here because it prioritizes the integrity of the civic sphere over the reproductive needs of the community.

  ### 4. The Episode Biting Back: Scalia vs. Stevens

  **The Alignment:**
  *   **Scalia (Dissent):** Argues the Court is displaying hostility to religion. He frames the statute as a neutral accommodation of disability needs that happens to benefit a religious group. He sounds like a pluralist accommodationist.
  *   **Stevens (Concurrence):** Argues that drawing a political boundary around a religious group is inherently unconstitutional, regardless of accommodation. He sounds like a strict separationist.

  **The Reading:**
  **The Communitarian-Liberal axis is a philosophers' construct that misdescribes what these people were fighting about.**

  Here is why: Scalia is not arguing from a Communitarian premise (that the self is constituted by the community). He is arguing from an **Originalist/Equal Treatment** premise. His point is that if the state provides special ed, it cannot disable a religious group from accessing it via their own political structure if that structure is otherwise legal. He views the Court's decision as discrimination against religion, not as a defense of liberal neutrality.

  Stevens is not arguing from a Rawlsian "public reason" premise. He is arguing from a **Structural/Republican** premise. His concern is the fusion of civic and religious identity creating a theocratic enclave. He is worried about sovereignty, not justification.

  **Defense of this Reading:**
  If this were a true Liberal vs. Communitarian fight, the Liberals (Souter/Stevens) would be focused on individual rights (the child, the dissenter). They weren't. They focused on the *legislative line-drawing*. Scalia would be focused on tradition and community value. He wasn't. He focused on the *neutrality of the benefit*.
  The theoretical vocabulary is borrowed flavor. The real fight was about the **Lemon Test** and the **Establishment Clause**. Scalia wanted to bury *Lemon* (which requires secular purpose); Souter wanted to preserve it (which flags religious purpose). The Communitarian label applied to Scalia is retroactive projection. He is a legal formalist who saw religious discrimination; Stevens is a legal institutionalist who saw religious gerrymandering. The political theory axis obscures the legal doctrinal stakes.

  ### 5. The Silences: Internal Restrictions and Children

  **The Blunt Truth:**
  Neither Liberalism nor Communitarianism adequately protects the child or the internal dissenter in this specific configuration.

  *   **Kukathas's Exit Right:** This is the standard liberal defense of illiberal communities. "Let them be, members can leave." In *Kiryas Joel*, exit is theoretically possible but socially catastrophic. For a Satmar child, leaving the community means losing family, salvation, and identity. Relying on "exit" here is a theoretical cop-out. It treats a structural cage as a voluntary association.
  *   **The Child's Interest:** The theories treat the parents as the agents. The children are the *objects* of the policy. Did the children want separation? The record says the *parents* pulled them due to trauma. The children's interest in exposure to a pluralistic society (a standard liberal educational goal) was completely subordinated to the parents' interest in religious insulation.
  *   **Internal Minorities:** What about a Satmar family that *wanted* public school integration? In a village-district coterminous with the sect, the school board is the religious leadership. There is no secular recourse.
  *   **Judgment:** To get to these questions, you must import a theory of **child citizenship** (e.g., Eekelaar or Archard) that posits the child as a rights-bearer independent of the parents' comprehensive doctrine. The Liberal-Communitarian debate is too focused on the *group-state* relationship to see the *child-group* power dynamic. The Court sidestepped this by ruling on taxpayer standing (Grumet) rather than parental/child rights.

  ### 6. The Legislative Fix and the Nature of Neutrality

  **The Fact:**
  You are correct. After *Grumet*, the New York Legislature passed a general law (1997) allowing any village that met certain criteria (non-fiscal, geographic) to form a school district. Kiryas Joel reincorporated/adjusted to meet these criteria, and the New York Court of Appeals upheld the new district (*Grumet v. Board of Educ.*, 2000).

  **The Implication:**
  This vindicates **Political Liberalism (Neutrality of Justification)** and proves Souter's objection was procedural, not substantive.

  1.  **Absorption:** Liberalism *did* absorb the Communitarian demand. The Satmar got their district. The community survived and reproduced.
  2.  **The Mechanism:** It only worked because the demand was run through a **neutral form**. The state did not say, "We recognize the Satmar need." The state said, "We recognize all villages meeting criteria X."
  3.  **The Lesson:** This shows that Souter's majority opinion was not hostile to the community's existence; it was hostile to the *legislative discretion* to single out a religious group. The "neutral form" was doing the substantive work all along. It preserved the state's sovereignty (the state sets the rules) while allowing the community to achieve its goal (self-governance).

  **Conclusion:**
  The *Kiryas Joel* saga demonstrates that Liberalism is more flexible than Communitarianism regarding *outcomes*, provided the *process* remains neutral. Communitarian theory struggles to justify why the specific *special act* was problematic beyond "it looks preferential," whereas Liberalism has a ready-made structural reason: the justification for state power cannot be sectarian.

  However, the silence remains on the child. The legislative fix secured the Village's jurisdiction, but it did not secure the dissenting child's right to a secular education within that jurisdiction. The Liberal-Communitarian debate resolved the boundary dispute between the State and the Sect, but it left the boundary dispute between the Sect and the Child untouched. That requires a theory of rights that neither Sandel nor Rawls fully prioritizes in this context: the right of the future citizen against the present community.
