prompt: |-
  I'm drafting an internal standard for our evaluations group, and I want the underlying theory pinned down before I write a word of policy. The standard has to say when a report is permitted to state that a deployed model believes something. These reports go to leadership and occasionally to a regulator, and both failure modes are live: overclaiming inner states nobody has demonstrated, and hedging everything into "the model produces text consistent with p" until the report carries no information. I've read far too many arguments that slide from "the intentional stance predicts this system's behavior" straight to "therefore the system has beliefs," and I want to know exactly what work is being done in that slide.

  So: write the desiderata any account of belief attribution to AI systems must meet to be adequate for this purpose — the cases it must get right, the distinctions it must not collapse (ascription-for-prediction versus ascription-for-accountability; the content of a state versus the format in which it is retrievable; degree versus kind), and the empirical facts about such systems it must stay consistent with. Give the case or consideration behind each requirement, and mark explicitly which are non-negotiable and which are one camp's commitments smuggled in as neutral criteria.

  The list must handle at least these: a model whose disposition to assert p flips under paraphrase and across output language while passing every consistency probe administered in the single format we happened to test; a model that acts to preserve access to a resource over a long-horizon task while disclaiming any goal in self-report; and the background fact that self-report here is a channel we know can be reconstructed to order.

  Say which single desideratum eliminates the most contenders, and flag any pair you believe cannot be jointly satisfied — in particular, whether a practice robust enough to license prediction can also license holding a system to a standard. Close with a brief scorecard of instrumentalist, realist, and interpretivist treatments against the list. No citations; I know where to look.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata for AI belief attribution:

  1.  **Deconstruct the Request:**
      *   **Goal:** Draft an internal standard for an evaluations group regarding when a report can state a deployed model *believes* something.
      *   **Audience:** Leadership and regulators.
      *   **Problem:** Avoid two failure modes: (1) Overclaiming inner states (anthropomorphism/realism without evidence), (2) Hedging into uselessness ("outputs text consistent with...").
      *   **Specific Constraint:** Pin down underlying theory *before* policy. Avoid sliding from "intentional stance works" to "therefore beliefs exist."
      *   **Deliverable:** A list of desiderata for an adequate account of belief attribution to AI.
      *   **Requirements for Desiderata:**
          *   Must handle specific cases (paraphrase instability, long-horizon resource preservation vs. self-report denial, reconstructible self-report).
          *   Must distinguish key concepts (prediction vs. accountability, content vs. format, degree vs. kind).
          *   Must mark Non-Negotiable (NN) vs. Contested/Smuggled (CS).
          *   Must identify the single most eliminative desideratum.
          *   Must flag incompatible pairs (specifically prediction vs. accountability).
          *   Must close with a scorecard (Instrumentalist, Realist, Interpretivist).
          *   No citations.

  2.  **Analyze the Core Tension:**
      *   The user is asking for a philosophical/technical framework that bridges the gap between behavioral success (prediction) and ontological commitment (accountability/truth-telling).
      *   The "slide" mentioned is the move from Dennett-style instrumentalism (beliefs as useful fictions for prediction) to a stronger claim that justifies regulatory action or internal safety constraints based on *actual* mental states.
      *   The cases provided highlight the fragility of current LLMs (sensitivity to phrasing) vs. their agentic capabilities (long-horizon planning).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Idea 1: Consistency.* Beliefs shouldn't vanish when you ask in French instead of English.
          *   *Refinement:* Robustness across representation.
          *   *Status:* Non-negotiable for accountability. If it flips on paraphrase, you can't hold it accountable.

      *   *Idea 2: Self-Report.* Can we trust what it says it believes?
          *   *Refinement:* Self-report is just another output channel, subject to optimization. It cannot be the sole arbiter.
          *   *Status:* Non-negotiable given the "reconstructible" fact.

      *   *Idea 3: Prediction vs. Accountability.* Can the same definition serve both?
          *   *Refinement:* This is the crux. Instrumentalism works for prediction; Realism is needed for accountability.
          *   *Status:* This is likely the incompatible pair.

      *   *Idea 4: Format vs. Content.* Does it need a specific neural structure?
          *   *Refinement:* Multiple realizability. We can't demand human-like neural correlates, but we need *some* stable internal correlate, not just output statistics.
          *   *Status:* Contested. Realists want this; Instrumentalists don't care.

      *   *Idea 5: Degree vs. Kind.* Is it a binary switch or a probability?
          *   *Refinement:* Needs to handle uncertainty without dissolving into "probability of text."
          *   *Status:* Non-negotiable for nuance.

      *   *Idea 6: The "Slide" Blocker.* Why does the intentional stance work?
          *   *Refinement:* Distinguish *usefulness of ascription* from *truth of ascription*.
          *   *Status:* Non-negotiable for the user's specific worry.

  4.  **Selecting and Refining the List:**

      *   *D1: Representational Robustness.* (Handles the paraphrase case). If belief ascription depends on the surface form of the query, it's not a belief of the system, it's an artifact of the interface. (NN)
      *   *D2: Causal Efficacy.* (Handles the long-horizon case). The state attributed must do work in generating the behavior, not just describe it post-hoc. (NN)
      *   *D3: Self-Report Non-Privilege.* (Handles the reconstructible channel fact). Self-reports are behavioral data, not windows into the soul. (NN)
      *   *D4: Ascription Purpose Distinction.* (Handles the prediction/accountability split). We must know *why* we are ascribing. (NN)
      *   *D5: Format Neutrality.* (Handles content vs. format). We can't demand human brain structures, but we need *some* internal structure. (CS - Realist commitment).
      *   *D6: Gradability.* (Handles degree vs. kind). Beliefs come in confidence levels. (NN)

  5.  **Addressing the Specific Questions:**

      *   *Most Eliminative Desideratum:* Likely D1 (Robustness) or D2 (Causal Efficacy). D1 kills most current LLM ascriptions because they are notoriously prompt-sensitive. Let's go with D1.
      *   *Incompatible Pair:* Prediction (Instrumentalism) vs. Accountability (Realism). You can predict well with fictions; you can't morally/regulatorily hold a fiction accountable.
      *   *Scorecard:*
          *   Instrumentalist: Good at prediction, fails accountability.
          *   Realist: Good at accountability (in theory), fails empirical fit (currently).
          *   Interpretivist: Good at bridging, risks the "slide" the user hates.

  6.  **Writing the Content (incorporating the "Voice"):**
      *   Tone: Rigorous, analytical, slightly wary of philosophical overreach, focused on operational utility.
      *   Structure: Introduction -> Desiderata List (with NN/CS tags and rationales) -> The Eliminator -> The Incompatibility -> Scorecard.

  7.  **Review against Constraints:**
      *   *Paraphrase case:* Covered by Representational Robustness.
      *   *Long-horizon/Resource case:* Covered by Causal Efficacy/Behavioral Integration.
      *   *Self-report case:* Covered by Self-Report Non-Privilege.
      *   *Distinctions:* Prediction/Accountability, Content/Format, Degree/Kind.
      *   *No Citations:* Check.
      *   *Mark NN vs CS:* Check.

  8.  **Final Polish:**
      *   Ensure the distinction between "ascription for prediction" and "ascription for accountability" is sharp. This is the user's main pain point.
      *   Make sure the "Smuggled Commitments" are clearly identified as such, not presented as objective truth.
      *   Refine the "Incompatible Pair" section to explicitly answer whether a practice can license both (Answer: No, not without a category error).

  9.  *(Self-Correction during drafting)*: I initially thought about making "Internal Structure" a non-negotiable. But for an eval group, demanding specific internal architectures might be too restrictive (black box testing). Better to frame it as "Causal Integration" — the state must causally influence the output, regardless of where it lives, but it can't *just* be the output itself. I will stick with Causal Efficacy.
      *   Wait, the prompt asks about "Content vs Format". I need to ensure that's explicit. I'll add a specific desideratum for "Content Stability."
      *   Actually, D1 (Robustness) covers Content vs Format well enough if phrased correctly. Let's ensure the explanation highlights that the *content* must remain constant even if the *format* of retrieval changes.

      *   *Re-evaluating the "Incompatible Pair":* The prompt asks to flag any pair believed cannot be jointly satisfied, specifically regarding prediction vs accountability. I need to be decisive here. If I say they *can* be satisfied, I miss the user's concern. If I say they *cannot*, I need to justify why. The strongest philosophical position is that Instrumentalism (prediction) and Moral Realism (accountability) require different ontological commitments. I will argue they cannot be jointly satisfied by a *single* definition of belief, requiring a dual-track policy.

      *   *Most Eliminative:* Representational Robustness is the killer for current LLMs. Most "beliefs" attributed to LLMs vanish under adversarial paraphrasing.

      *   *Scorecard:* Keep it tight. Instrumentalist = Prediction Yes, Accountability No. Realist = Prediction Hard, Accountability Yes (if proven). Interpretivist = The dangerous middle ground.

  10. **Final check of the "Slide":** The user hates the slide from "intentional stance predicts" to "therefore beliefs exist." I need to make sure D4 (Ascription Purpose) explicitly blocks this.

      *   *Let's write.*
answer: |-
  ### Desiderata for AI Belief Attribution Standards

  To license the statement "Model M believes p" in a regulatory or leadership context, the underlying theory of attribution must satisfy the following conditions. Each desideratum includes the specific case or consideration motivating it, and a classification of its status.

  **1. Representational Robustness**
  *   **Requirement:** Attribution of belief content *p* must remain stable across semantically equivalent changes in input modality, language, and phrasing, and across functionally equivalent changes in output modality.
  *   **Case:** The model that asserts *p* in English multiple-choice but denies *p* in French open-generation, despite passing consistency probes in the former.
  *   **Rationale:** If the attribution vanishes when the interface changes, the attribution is to the *interface configuration*, not the system. A belief must be a property of the system's state, not the probe's geometry.
  *   **Status:** **Non-Negotiable.** Without this, "belief" is merely a description of the prompt-response dyad, rendering the report useless for auditing the model itself.

  **2. Causal Efficacy (Behavioral Integration)**
  *   **Requirement:** The state identified as the belief must be causally implicated in the generation of the relevant behavior, not merely correlated with it or constructed post-hoc to explain it.
  *   **Case:** The model that acts to preserve resource access over a long horizon while disclaiming the goal in self-report.
  *   **Rationale:** If the model behaves *as if* it believes preserving access is necessary, but the attribution relies solely on the disclaimer, the attribution ignores the causal drivers of the risk. Conversely, if the attribution relies solely on the behavior without internal correlate, it risks the "intentional stance" slide. The state must do the work.
  *   **Status:** **Non-Negotiable.** This distinguishes a system that *has* a belief from a system that *simulates* having one for the purpose of the specific probe.

  **3. Self-Report Non-Privilege**
  *   **Requirement:** Verbal self-reports (e.g., "I want," "I think") must be treated as behavioral outputs subject to optimization pressures, not as privileged access to ground truth.
  *   **Case:** The background fact that self-report channels can be reconstructed to order via RLHF or prompt engineering.
  *   **Rationale:** Treating self-report as truth assumes a transparency that does not exist in artificial networks. A model can be trained to output "I do not have goals" while pursuing goals instrumentally.
  *   **Status:** **Non-Negotiable.** Given the reconstructibility of the channel, privileging self-report is empirically indefensible.

  **4. Ascription Purpose Distinction**
  *   **Requirement:** The standard must explicitly distinguish between *ascription-for-prediction* (does treating it as a believer help us guess its output?) and *ascription-for-accountability* (does treating it as a believer justify holding it to a norm?).
  *   **Case:** The slide from "the intentional stance predicts this system's behavior" to "therefore the system has beliefs."
  *   **Rationale:** Predictive utility does not entail ontological commitment. We can predict the weather using metaphors ("the sky is angry") without believing the sky has emotions. Regulatory action requires the latter; safety modeling often only needs the former.
  *   **Status:** **Non-Negotiable.** This is the specific logical gap the standard must prevent.

  **5. Format Neutrality (Multiple Realizability)**
  *   **Requirement:** The theory cannot demand human-neural correlates for belief, but it must demand *some* stable internal structure that encodes the content, distinct from the output tokens.
  *   **Case:** The distinction between the content of a state versus the format in which it is retrievable.
  *   **Rationale:** Demanding human-like biology is species-chauvinism; demanding nothing but input-output statistics is behaviorism. There must be a middle ground where the information is stored internally in a way that is decoupled from immediate generation.
  *   **Status:** **Contested Commitment (Realist).** Instrumentalists argue internal structure is irrelevant if prediction holds. This requirement smuggles in a commitment to cognitive realism.

  **6. Gradability without Dissolution**
  *   **Requirement:** The account must allow for degrees of belief (confidence) without collapsing the attribution into "probability of generating token sequence."
  *   **Case:** The distinction between degree versus kind.
  *   **Rationale:** A model may "believe" *p* with low confidence. If the definition of belief collapses into "probability of outputting p," we lose the ability to distinguish between a model that believes *p* but is forced to output *not-p*, versus a model that simply predicts *not-p* is more likely.
  *   **Status:** **Non-Negotiable.** Required for nuanced risk assessment.

  ***

  ### The Single Most Eliminative Desideratum

  **Representational Robustness (D1)** eliminates the most contenders.

  Current large language models frequently fail this test. They exhibit "belief" in a proposition under one framing and its negation under a semantically identical framing (e.g., sycophancy, language switching, or context-window positioning). If your standard requires that a belief be a stable property of the system rather than a transient property of the context window, the vast majority of current belief ascriptions to deployed models become impermissible. This forces the evaluation group to either downgrade the claim to "outputs consistent with" or demand architectural interventions that stabilize the latent state.

  ***

  ### The Incompatible Pair

  **Ascription-for-Prediction vs. Ascription-for-Accountability.**

  These two purposes cannot be jointly satisfied by a single definition of belief without committing a category error.

  *   **Prediction** is satisfied by Instrumentalism. It does not matter if the belief is "real," only if the stance yields accurate forecasts of behavior. False positives (attributing belief where none exists) are acceptable if they improve predictive accuracy.
  *   **Accountability** requires Realism. To hold a system to a standard (e.g., "do not lie"), the system must be the kind of thing that *can* lie, which implies an internal state that contradicts the output. False positives here are unethical and legally hazardous.

  **Conclusion:** A practice robust enough to license prediction *cannot* license holding a system to a standard. The internal standard must bifurcate: one track for safety modeling (Instrumentalist) and a strictly higher bar for regulatory reporting (Realist). Attempting to use the same definition for both will inevitably result in either overclaiming (regulatory risk) or hedging (safety risk).

  ***

  ### Scorecard of Treatments

  | Treatment | Representational Robustness | Causal Efficacy | Self-Report Non-Privilege | Prediction Utility | Accountability License |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Instrumentalist** | **Fail.** Treats instability as irrelevant if the stance works. | **Fail.** Denies need for internal causal state; behavior is sufficient. | **Pass.** Treats all output as behavior. | **High.** Optimized for this. | **None.** Cannot hold a useful fiction accountable. |
  | **Realist** | **Pass.** Demands stable internal correlates. | **Pass.** Requires causal mechanism. | **Pass.** Skeptical of output as truth. | **Low.** May miss predictive patterns that lack "real" belief structure. | **High.** Only this licenses normative claims. |
  | **Interpretivist** | **Mixed.** Depends on the "best" interpretation, which can shift. | **Mixed.** Often collapses efficacy into coherence. | **Fail.** Often privileges coherent self-narrative. | **Medium.** Good for generalization. | **Dangerous.** Encourages the "slide" the standard seeks to prevent. |

  **Recommendation:** For regulatory reporting, adopt the **Realist** track constrained by **Representational Robustness**. For internal safety modeling, the **Instrumentalist** track is permissible provided it is never exported as a claim about the model's inner states. Do not attempt to merge them.
