prompt: |-
  i'm on a city council subcommittee and we've spent a year arguing about statues and street names without anybody saying what a commemoration policy is supposed to accomplish. before i read any more position papers i want the spec: what does an adequate account of public commemoration have to deliver? which distinctions can it not collapse — honoring a person vs honoring what they did, a street name vs a museum plaque vs a statue on a plinth in the square, the message the council intends vs the one a passerby actually recieves, removing vs contextualizing vs replacing? and which cases does it have to get right: a 19th century benefactor whose fortune came from something we'd now condemn, whose name is on a hospital wing the city can't afford to rename; a statue whose subject everybody has forgotten, so it commemorates nothing in particular; a name that means something quite different to the neighborhood living under it than it did to the people who picked it. plus the practical constraints it can't shrug off — the costs of readdressing land on residents not the city, meanings drift over generations, and taking something down is itself a speech act with an audience. tell me which of these are genuine desiderata and which are just one camp's priors, whether any subset is jointly unsatisfiable (i suspect preserve-the-record plus don't-honor-the-dishonorable is already a squeeze), and which single requirement knocks out the most candidates. skip the scorecard of the usual views, we'll do that at the meeting.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** City council subcommittee member.
      *   **Context:** Spent a year arguing about statues/street names without defining the *purpose* of a commemoration policy.
      *   **Task:** Define the "spec" for an adequate account of public commemoration.
      *   **Specific Questions:**
          *   What must it deliver? (Desiderata)
          *   What distinctions must it maintain? (Honoring person vs. act, medium differences, intent vs. reception, removal vs. context vs. replace).
          *   Which cases must it handle? (Tainted benefactor/hospital wing, forgotten statue, divergent neighborhood meaning).
          *   What practical constraints are non-negotiable? (Costs on residents, meaning drift, removal as speech).
          *   Which are genuine desiderata vs. camp priors?
          *   Are any jointly unsatisfiable? (The "squeeze").
          *   Which single requirement knocks out the most candidates?
      *   **Constraint:** Skip the scorecard of usual views (no "here's what the left/right says"). Get straight to the structural/philosophical spec.

  2.  **Deconstruct the "Spec" of Public Commemoration:**
      *   The core problem is that commemoration is a form of *government speech* that occupies *public space* and interacts with *private lives*.
      *   An adequate policy isn't just about history; it's about civic identity, resource allocation, and semiotics (signs/meanings).

  3.  **Address the Distinctions (What cannot be collapsed):**
      *   *Honoring Person vs. Honoring Act:* Crucial. A hospital wing might honor the *donation* (act) which built the hospital, even if the *person* was flawed. A statue on a plinth usually implies holistic veneration.
      *   *Medium Matters:* A street name is functional infrastructure (affects residents daily). A statue is aesthetic/monumental (passive). A plaque is informational. Collapsing these leads to bad policy (e.g., treating a street sign like a shrine).
      *   *Intent vs. Reception:* Government intent matters legally, but public reception matters politically/socially. If the city says "this is history" but the public hears "this is supremacy," the policy failed.
      *   *Removal vs. Context vs. Replace:* Removal is negation. Context is education. Replacement is counter-speech. They have different costs and messages.

  4.  **Address the Hard Cases (The Stress Tests):**
      *   *Tainted Benefactor (Hospital Wing):* Tests the "cost constraint" and "severability of deed." Can you separate the money from the moral source?
      *   *Forgotten Statue:* Tests the "function of memory." If no one remembers, is it still commemoration? Or just clutter? (The "Invisible Statue" problem).
      *   *Divergent Meaning (Neighborhood vs. Founders):* Tests "democratic legitimacy." Who owns the meaning? The namers or the lived-in?

  5.  **Address Practical Constraints:**
      *   *Cost on Residents:* Renaming streets isn't free. Who pays? If the city pays, it's public funds. If residents pay (new IDs, mail), it's a tax on speech/identity.
      *   *Meaning Drift:* Statues are static; culture is fluid. A policy must account for time.
      *   *Removal as Speech:* Taking down isn't neutral. It's an active statement of condemnation.

  6.  **Evaluate Desiderata vs. Priors:**
      *   *Genuine Desiderata:* Clarity of message, fiscal responsibility, democratic alignment, historical accuracy (to a point).
      *   *Camp Priors:* "Preserve everything at all costs" (Status Quo Prior) vs. "Remove anything problematic immediately" (Purification Prior).
      *   *The Squeeze:* "Preserve the Record" + "Don't Honor the Dishonorable." This is the core tension. You can't preserve the *honorific* record without honoring. You have to shift the *mode* of preservation (e.g., from monument to museum).

  7.  **Identify the "Knockout" Requirement:**
      *   What kills the most bad policies?
      *   Candidate 1: Cost. (Too pragmatic, ignores values).
      *   Candidate 2: Historical Accuracy. (Too vague).
      *   Candidate 3: *Congruence between Medium and Message.*
      *   *Winner:* **The Distinction between Honor and Record.** If a policy cannot distinguish between *venerating* a subject and *acknowledging* their existence/impact, it fails. Most arguments collapse these.

  8.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Professional, analytical, direct, slightly philosophical but grounded in governance.
      *   *Structure:*
          1.  The Core Function (The "Why").
          2.  Non-Collapsible Distinctions (The "What").
          3.  The Stress Tests (The "Who/Where").
          4.  The Constraints (The "How").
          5.  The Squeeze (Unsatisfiable sets).
          6.  The Knockout Requirement.

      *(Self-Correction during drafting)*: Make sure I don't just list the user's points back to them. I need to evaluate them. For example, on "Honoring Person vs. Act," I need to say *why* a policy must distinguish them (legal liability vs. moral signaling). On the "Hospital Wing," acknowledge the contract law aspect.

      *Refining the "Squeeze":* The user suspects "preserve record + don't honor" is a squeeze. I need to confirm this but offer the escape valve: *Contextualization changes the mode of preservation.* But that has limits (you can't put a plaque on a street sign easily).

      *Refining the "Knockout":* The requirement that "The medium must match the level of honor." A street name is too intimate for a controversial figure. A statue is too grand for a minor figure. This kills the "one size fits all" approach.

  9.  **Final Polish:** Check against constraints. No scorecards. No fluff. Focus on the spec.

      *Key Insight to emphasize:* Commemoration is not history. It is *civic liturgy*. A policy that treats it as history will fail. A policy that treats it as pure aesthetics will fail. It must be treated as *normative signaling*.

  10. **Final Review against User Prompt:**
      *   Did I answer what an adequate account must deliver? Yes (Normative signaling).
      *   Did I address the distinctions? Yes.
      *   Did I address the cases? Yes.
      *   Did I address constraints? Yes.
      *   Did I identify priors vs. desiderata? Yes.
      *   Did I identify the squeeze? Yes.
      *   Did I identify the knockout requirement? Yes.

      *Let's write it.*
answer: |-
  Here is the spec for an adequate public commemoration policy, stripped of the usual ideological scorecards.

  ### 1. The Core Deliverable: Normative Signaling, Not History
  An adequate account must deliver a clear theory of **civic liturgy**. The primary function of public commemoration is not to record history (that is the job of archives and schools) but to signal *current* civic values.

  *   **Desideratum:** The policy must distinguish between **archival preservation** (keeping the record) and **honorific retention** (keeping the pedestal).
  *   **The Trap:** Most arguments collapse these. Camp A says "Removing the statue erases history." Camp B says "Keeping the statue endorses the racism." Both are wrong. Removing a statue moves the object from the *honorific* sphere to the *archival* sphere. It does not erase the record; it changes the civic relationship to the record.
  *   **Requirement:** The policy must explicitly state that public space is for *current* values, not historical neutrality. There is no neutral ground. A statue left in place is an active choice to endorse, not a passive choice to preserve.

  ### 2. Non-Collapsible Distinctions
  Your policy fails if it treats these pairs as equivalent.

  *   **Honoring the Person vs. Honoring the Transaction:**
      *   *Spec:* You must separate the moral agent from the material benefit.
      *   *Application:* The hospital wing case. If the money built the wing, the name commemorates the *transaction* that enabled public health, not necessarily the saintliness of the donor.
      *   *Constraint:* Contract law. If the deed requires the name in perpetuity, the city is legally bound unless it buys out the clause. A policy that ignores property rights is advisory only.
  *   **Infrastructure vs. Monument:**
      *   *Spec:* A street name is functional infrastructure; a statue is aesthetic/monumental.
      *   *Application:* Residents live *on* a street; they walk *past* a statue. Renaming a street imposes a logistical tax (mail, IDs, navigation) on residents. Removing a statue imposes a logistical cost on the city.
      *   *Requirement:* The threshold for renaming a street must be higher than removing a statue because the burden falls on private citizens, not the public purse.
  *   **Intent vs. Uptake:**
      *   *Spec:* Government speech is defined by how it is reasonably received, not just what was intended.
      *   *Application:* If the Council intends "historical context" but the neighborhood receives "intimidation," the policy has failed.
      *   *Requirement:* The policy must prioritize *reception* in public squares (high visibility) over *intent* in archives (low visibility).
  *   **Removal vs. Context vs. Replacement:**
      *   *Spec:* These are three different speech acts.
          *   *Removal:* Negation/Condemnation.
          *   *Context:* Nuance/Education (requires an audience willing to read).
          *   *Replacement:* Counter-speech/Supersession.
      *   *Requirement:* You cannot use "context" as a default to avoid the political cost of "removal." A plaque does not neutralize a 20-foot bronze idol. The visual hierarchy matters.

  ### 3. The Stress Tests (Cases the Policy Must Resolve)
  If the policy cannot adjudicate these three scenarios, it is theoretical only.

  *   **The Tainted Benefactor (Hospital Wing):**
      *   *Verdict:* **Severability.** If the name is on the building (infrastructure/utility), it can remain if the funds were essential, provided a plaque explains the source of wealth. If the name is on a *chair* or an *award* (honorific), it must go.
      *   *Why:* Distinguishes between buying a service (healthcare) and buying honor.
  *   **The Forgotten Statue:**
      *   *Verdict:* **The "Dead Symbol" Clause.** If a statue commemorates no one (because no one knows who it is), it is not functioning as commemoration. It is clutter.
      *   *Why:* Commemoration requires a living memory loop. If the loop is broken, the object loses its protected status. It can be moved without "erasing history" because the history is already erased.
  *   **The Divergent Meaning (Neighborhood vs. Founders):**
      *   *Verdict:* **Proximity Priority.** The people who live under the sign have greater claim to its meaning than the people who erected it 100 years ago.
      *   *Why:* Democratic legitimacy. A street name is a contract between the city and the current residents, not the past council.

  ### 4. Practical Constraints (Non-Negotiables)
  *   **Cost Allocation:** You cannot offload the cost of ideological cleansing onto residents. If the city renames a street, the city pays for the signs, the database updates, and subsidizes the resident ID changes. If you can't afford this, you can't rename the street.
  *   **Meaning Drift:** The policy must have a sunset clause or a review cycle. A statue acceptable in 1920 may be intolerable in 2020. A policy that assumes static meaning is brittle.
  *   **Removal as Speech:** Acknowledge that taking something down is controversial. It creates a new martyr narrative. The policy must account for the *vacancy* left behind. An empty plinth is often more divisive than the statue was.

  ### 5. The Squeeze (Jointly Unsatisfiable Conditions)
  You are correct to suspect a squeeze. Here is the specific triad that is logically impossible to satisfy simultaneously:

  1.  **Preserve the Physical Record:** Keep all objects in situ.
  2.  **Don't Honor the Dishonorable:** Ensure no public space venders values the city rejects.
  3.  **Don't Erase History:** Ensure the past remains visible and legible.

  **Why it breaks:** If you keep the object in situ (1) to preserve history (3), you are inevitably honoring the subject (violating 2) because public space implies endorsement. If you add a plaque to stop the honor (satisfy 2), you admit the object is problematic, which undermines the "preserve the record" claim (3) by altering its presentation.

  **The Escape Valve:** You must reject (1). You can satisfy (2) and (3) only by moving the object. *Preservation requires relocation.* The policy must accept that *in situ* preservation of controversial figures is incompatible with *non-honor*.

  ### 6. The Knockout Requirement
  The single requirement that knocks out the most candidate policies (and position papers) is this:

  **The Medium Must Match the Level of Honor.**

  *   **Why it wins:** Most bad policies treat all commemoration as the same. They argue about "names" generally.
  *   **The Filter:**
      *   **Street Names:** High burden. Functional, impacts residents daily. Only for figures of uncontested, broad civic benefit.
      *   **Statues on Plinths:** Highest burden. Implies veneration. Requires current alignment with civic values.
      *   **Plaques/Markers:** Low burden. Informational. Can handle complexity/ambiguity.
      *   **Building Names:** Medium burden. Transactional. Tied to funding/utility.

  If a position paper argues that a street name should be treated with the same reverence as a museum exhibit, **discard it.** If a paper argues a statue can be "fixed" with a plaque without addressing the visual dominance of the bronze, **discard it.**

  ### Summary for the Subcommittee
  An adequate account must deliver a **hierarchy of permanence**. It must admit that public space is not a history book; it is a stage for current civic identity.

  *   **Genuine Desiderata:** Clarity of message, fiscal responsibility, democratic alignment (current residents > past founders).
  *   **Camp Priors:** "Nothing should ever come down" (Status Quo as Neutrality) and "Anything problematic must vanish" (Purification as Justice). Both ignore the cost of the speech act.
  *   **The Squeeze:** You cannot keep a statue in place, stop it from honoring, and keep the history visible all at once. You must move it to stop the honor.
  *   **The Knockout:** If the policy does not distinguish between **infrastructure** (streets/buildings) and **monuments** (statues), it will fail to allocate costs and burdens correctly.

  Tell your subcommittee to stop arguing about *who* deserves a statue and start arguing about *what a statue is for*. Once you define the medium, the candidates sort themselves.
