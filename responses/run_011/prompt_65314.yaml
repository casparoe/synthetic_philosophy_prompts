  ### Bottom Line

  **Which readings defeat the ordinance?**
  Only the **Normative Legitimacy Claim** (Reading 3) and the **Jurisdictional Boundary Claim** (Reading 5) actually do the work the organizer wants. The Councilmember's retort ("All law is legislated morality") completely demolishes the Conceptual Identity Claim (Reading 1), which is why the organizer looked unprepared. The Councilmember is right that law *contains* morality; the organizer needs to argue that law shouldn't contain *only* morality.

  **What the organizer should have said instead:**
  The slogan "You can't legislate morality" is a trap because it invites the Councilmember's semantic correction. To survive the comeback, the organizer needs to shift from *possibility* to *legitimacy* and *thresholds*.

  Instead of the slogan, the argument should be: **"You can legislate morality, but you cannot legislate *taste* without proof of harm."**

  Specifically, the organizer should invoke Feinberg's **Offense Principle**: even if we grant the state the right to enforce moral norms, criminalization requires more than residents being "upset." It requires conduct that is unavoidable, deeply offensive to a reasonable person, and lacking in serious artistic or social value. Since this is a designated festival (avoidability is high) and involves body paint (artistic value), the "indecency" complaint fails the threshold for criminal law, regardless of whether that law is "moral" in origin. This concedes the Councilmember's philosophical point while winning the policy argument.
