answer: |-
  Here is the argument committed to your hunch: The Buddhist rejection of a diachronic anchor does not merely complicate karmic desert; it annihilates it. And that annihilation is the soteriological breakthrough, not a philosophical failure.

  ### Part I: The Impossibility of Desert without an Anchor

  To claim someone *deserves* suffering or joy is to make a retributive claim, not merely a causal one. Retribution requires ownership. If I punch you, and your twin brother shows up tomorrow to punch me back, justice has not been served, even if the twin is genetically identical. There must be a "who" that persists from the moment of earning to the moment of receipt.

  Let's lay out the candidate anchors for this "who" and their costs within a Buddhist framework:

  1.  **Numerical Identity (The Soul/Ātman):** A metaphysical substance that remains self-same across time.
      *   *Cost:* Directly contradicts *anatta* (no-self). This is the *satkāyadṛṣṭi* (view of self-existence) that binds one to samsara. The Pudgalavāda (Personalists) tried to posit an "inexpressible person" to save this anchor and were branded heretics. If you choose this, you save desert but lose Buddhism.
  2.  **Psychological Continuity (Lockean Memory/Character):** Overlapping chains of memory and personality traits.
      *   *Cost:* Too fragile. Deep sleep, coma, and death break the chain of conscious memory. If the being in the next life has no memory of the prior life's intention (*cetanā*), the psychological link is severed. Punishing a being with no memory of the crime is not desert; it is collateral damage.
  3.  **Conventional-Person Pragmatism:** We act *as if* there is a person for social coherence, even if ontologically empty.
      *   *Cost:* This works for human law, but not cosmic law. A convention cannot ground a metaphysical necessity. You cannot build a cosmic ledger on a fiction. If the "person" is merely a useful label for a bundle of aggregates, then suffering inflicted on the future bundle is not "justice" for the past bundle; it is just one bundle impacting another.
  4.  **Bare Causal Continuity:** The Buddhist standard. A causes B, B causes C, like a seal pressed into wax or a flame lighting another lamp.
      *   *Cost:* Causation is not ownership. If I light a fire that burns down your house, the fire *causally* tracks my action. But if the fire burns down *my own* house ten years later due to a wind shift, that is not desert; that is physics.

  **The Argument for Impossibility**

  1.  **Premise 1:** Moral desert requires that the subject of the punishment/reward be the *owner* of the action that merited it.
  2.  **Premise 2:** Ownership requires diachronic identity (or a functional equivalent robust enough to sustain moral liability).
  3.  **Premise 3:** Buddhist ontology denies diachronic identity (Numerical Identity is false).
  4.  **Premise 4:** Buddhist ontology denies robust psychological continuity across death (Memory is broken).
  5.  **Premise 5:** Buddhist ontology treats the "person" as a conventional fiction, insufficient to ground cosmic justice.
  6.  **Interim Conclusion:** Therefore, in Buddhist ontology, there is no subject capable of "owning" an action across the threshold of death.
  7.  **Premise 6:** Without an owner, there can be no desert, only causal consequence.
  8.  **Final Conclusion:** Buddhist karma cannot be a theory of moral desert. It is a theory of causal tracking.

  **The Step to Attack:** A defender of karmic desert must attack **Premise 2**. They must argue that ownership does not require identity, but only the right kind of causal intimacy. If they fail here, the concept of "desert" dissolves into "natural consequence."

  ***

  ### Part II: Why This Is a Win, Not a Scandal

  You suspect this looks like a bug. I argue it is the feature that saves the system from metaphysical incoherence and soteriological dead-ends. The "tracking without desert" model is superior to the "desert with anchor" model for three reasons.

  **1. It Dissolves the Problem of Cosmic Resentment**
  If karma is desert, the universe is a courtroom. This implies the universe *owes* you fairness. When suffering strikes, the question "Why do I deserve this?" generates existential rage and metaphysical grievance against the cosmos. It presumes a Cosmic Judge who must be justified.
  But if karma is merely tracking (like gravity or epidemiology), the question shifts from "Why is this just?" to "What caused this?" Gravity does not hate you when you fall; it simply tracks mass and distance. Similarly, karma tracks intention and action. By removing desert, you remove the expectation that the universe is *for* you. This aligns perfectly with the First Noble Truth: existence is characterized by *dukkha* (unsatisfactoriness), not because the universe is unjust, but because conditioned things are unstable. A desert-less karma makes suffering intelligible without demanding the universe be moral.

  **2. It Avoids the Reification of the Self**
  The demand for a diachronic anchor is, in Buddhist terms, a symptom of craving (*taṇhā*). We want to believe we persist because we are terrified of annihilation and invested in our own narrative importance. To insist on karmic desert is to smuggle the *ātman* back in through the side door.
  By accepting that "no one gets what they deserve," you undercut the ego's investment in the transaction. If I do good not because *I* will be rewarded, but because good actions reduce the causal density of suffering in the stream of consciousness, my motivation becomes cleaner. It shifts ethics from *transaction* (I pay, I receive) to *hygiene* (I clean, the environment improves). This is ethically superior: it cultivates compassion rather than spiritual greed.

  **3. It Makes Moral Effort Rational without Cosmic Debt**
  Critics say: "If I don't get the reward, why be good?" This assumes the only rational motivation is consumerist accumulation of merit. But in a tracking model, moral effort is rational because it alters the *quality* of the causal stream, even if no one "owns" the stream.
  Consider a firefighter putting out a fire. They may not own the house, and they may not live to see the town saved. But the act of extinguishing the fire is rationally connected to the state of "no-fire." Similarly, ethical action reduces the heat of greed, hatred, and delusion in the causal continuum. The "win" is the cessation of suffering (*nirvāṇa*), not the payout of a karmic debt. A desert model traps you in samsara by keeping you invested in the ledger. A tracking model allows you to walk away from the ledger entirely.

  **The Verdict:** The desert model requires a soul (which is false) and a Cosmic Judge (which is idolatry). The tracking model requires only cause and effect (which is observable) and intention (which is experiential). The lack of an anchor isn't a failure of justice; it's the realization that justice is a human concept inapplicable to the ontological structure of reality.

  ***

  ### The Overstatement and The Strongest Reply

  **Where the Setup Overstates:**
  You claim there is "no one to get it." This risks sliding into nihilism (*ucchedavāda*). While there is no *substantial* self, the Buddhist tradition insists there is not *nothing*. There is a continuum (*santāna*). To say "nobody gets it" might imply the suffering is meaningless. But in the tracking model, the suffering is meaningful as a signal, just not as a penalty. The overstatement is in suggesting the *experience* of suffering doesn't happen to a subject at all. It happens to a conventional subject, just not an ultimate one.

  **The Strongest Reply (The Causal-Continuity Defense):**
  A sophisticated defender of karmic desert would attack **Premise 2** of the First Half argument using a Parfit-style reductionism. They would argue:

  > "Desert does not require *Numerical Identity*; it requires *What Matters*. If Psychological Continuity or Causal Continuity is what matters for survival, then it is sufficient for liability. If the future being is causally continuous with my intention, the 'distance' between us is no more significant than the distance between me-now and me-tomorrow. To deny desert here is to arbitrarily privilege 'substance' over 'relation.' If the causal link is unbroken, the debt travels the link. The flame is not the same fire, but it is the same burning."

  This reply argues that "desert" can be decoupled from "substance" and re-attached to "process." If you accept that a process can bear moral weight, the anchor isn't a *thing*, it's a *vector*. And a vector is enough to carry a debt.
