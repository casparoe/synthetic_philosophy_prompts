  **Joint Statement on the White Horse Chapter**

  **Preamble**
  We, the undersigned members of the seminar, acknowledge that the received text of the *Gongsun Longzi* is dislocated and lacunose. Han bibliographers recorded significantly more chapters than survive, and no paraphrase herein should be presented as an established reading of the received word order. This document represents the outcome of adversarial collaboration between Camp A (doctrinal readers) and Camp B (eristic readers) regarding the dialogue between the Advocate and the Objector.

  **1. Agreed Claims**
  1. The text presents a dialogue where the Advocate defends the thesis that a white horse is not a horse against an Objector.
  2. Argument W1 distinguishes the designation of shape (associated with 'horse') from the designation of color (associated with 'white').
  3. Argument W2 involves the Objector challenging the Advocate on the basis that possessing a white horse entails possessing a horse.
  4. Argument W3 turns on what may legitimately be delivered in answer to a request for a horse versus a request for a white horse.
  5. Argument W4 discusses whether the components 'white' and 'horse' can be separated from the compound 'white horse'.
  6. The thesis is not claiming that white horses belong to a biological kind distinct from horses.
  7. The thesis relies on a distinction between simple names and compound names regarding their conditions of application.
  8. The Objector concedes certain points during the dialogue, though the weight of these concessions is contested.
  9. The negative copula in the thesis permits ambiguity between non-identity of concepts and exclusion from a kind.
  10. Neither camp claims that modern logical notation maps perfectly onto the text without residue.
  11. The text functions as a display of dialectical skill regardless of whether it encodes a coherent theory.
  12. Both camps agree that the text rewards close reading despite its textual difficulties and historical distance.

  **2. Disagreements Table**

  | Disagreement (Neutral) | Camp A Formulation | Camp B Formulation | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Purpose of the Text** | The Advocate advances a substantive semantic thesis about how compound names sort stuff. | The Advocate engages in display dialectic characteristic of itinerant disputers; coherence is secondary to victory. | Substantive |
  | **Validity of W3** | The argument is valid on a semantic reading where requests target specific name-values. | The argument is valid only by sliding between readings of what satisfies a request; otherwise refuted by the Objector. | Substantive |
  | **Status of Objector** | The Objector is a genuine interlocutor whose concessions carry doctrinal weight. | The Objector is a foil whose concessions are tactical and carry no doctrinal weight. | Partly Verbal |
  | **Nature of Thesis** | The thesis is about names and their values rather than about livestock. | The thesis depends on sliding between readings of concepts and kinds inside a single inference. | Substantive |
  | **Textual Coherence** | The chapter is a compressed but genuine contribution to a theory of naming. | The chapter's force depends on ambiguities that vanish if the negative copula is disambiguated. | Substantive |

  **3. Cruxes**
  To move beyond the standoff, we identify five cruxes where settling a sub-question would shift camp allegiance. Three engage shared instruments stipulated for this collaboration.

  *Crux 1: The Compound Battery (Intersective vs. Non-Subsective)*
  **Sub-question:** Does the Advocate's principle generalize to modifiers that are not intersective?
  **Evidence:** The logical behavior of compounds like 'brown horse' versus 'fake diamond' or 'wooden horse'.
  **Camp A Prediction:** The Advocate's principle is color-blind; if it holds for 'white horse', it holds for 'brown horse'. The cost is accepting that 'wooden horse' is not a horse under the same semantic rule.
  **Camp B Prediction:** The whole battery is foreign to the chapter's concerns; the Advocate is not circling a real theoretical distinction regarding non-subsective modifiers.
  **Falsification Condition:** Camp A is weakened if the principle collapses for privative cases ('dead horse'); Camp B is weakened if the text shows awareness of modifier variance.

  *Crux 2: The Steward Cases (Equivalence of Orders)*
  **Sub-question:** Does the Advocate accept the equivalence of the order "bring something that is a horse and is white" with "bring a white horse"?
  **Evidence:** A third steward is ordered to bring something that is a horse and is white, and brings a white horse.
  **Camp A Prediction:** The Advocate rejects the equivalence because the compound name 'white horse' has a unique semantic value distinct from the conjunction of conditions.
  **Camp B Prediction:** The Advocate accepts equivalence in practice but rejects it in logic to maintain the eristic stance; what turns on it is the flexibility of the Objector's concessions.
  **Falsification Condition:** Camp A is weakened if the text implies conjunctive equivalence is sufficient; Camp B is weakened if the Advocate treats the compound as rigidly distinct from the conjunction.

  *Crux 3: The Translation Crux (Morphological Dependence)*
  **Sub-question:** Does the thesis survive translation into a language that marks adjective–noun agreement morphologically?
  **Evidence:** Cross-linguistic semantic behavior of modified nouns.
  **Camp A Prediction:** The thesis survives translation; it is a claim about semantic values universal to compounding.
  **Camp B Prediction:** The thesis fails translation; it is a claim about Classical Chinese compounding specifically.
  **Falsification Condition:** Camp A is weakened if the thesis becomes unintelligible in inflected languages; Camp B is weakened if the semantic distinction holds regardless of morphology.

  *Crux 4: Textual Integrity and Lacunae*
  **Sub-question:** Do the textual gaps explain the apparent invalidities in the Advocate's reasoning?
  **Evidence:** The dislocated nature of the received chapter recorded by Han bibliographers.
  **Camp A Prediction:** The argument is coherent despite gaps; missing text would clarify semantic distinctions.
  **Camp B Prediction:** The gaps explain inconsistencies; the received word order preserves eristic slides that original coherence would have removed.
  **Falsification Condition:** Camp A is weakened if restored order reveals invalidity; Camp B is weakened if restored order reveals strict coherence.

  *Crux 5: The Negative Copula Disambiguation*
  **Sub-question:** Is the negative copula consistently used throughout the dialogue?
  **Evidence:** The shift between non-identity of concepts and exclusion from a kind.
  **Camp A Prediction:** The copula is consistently used to denote non-identity of semantic values.
  **Camp B Prediction:** The copula slides between readings to license inferences that would otherwise fail.
  **Falsification Condition:** Camp A is weakened if context forces an exclusion reading; Camp B is weakened if context forces a strict identity reading.

  **4. The Verbal Portion**
  We judge that a significant portion of the dispute is verbal, specifically regarding the rendering of the negative copula and the question whether "a thesis about names" and "a thesis about kinds" are really different theses. If 'name' is understood as 'concept' and 'kind' as 'extension', the distinction collapses. However, the rest of the dispute is not verbal. Whether the Advocate intends a coherent semantic theory or a dialectical display is a substantive claim about authorial intent and textual function. Whether the arguments are valid or rely on equivocation is a substantive claim about logical structure. The absence of a non-slanted formulation for the purpose of the text shows that Camp A views the text as constructive philosophy while Camp B views it as performative rhetoric; this cannot be resolved by terminology alone.

  **5. Annex on Epistemic Status**
  **Textual Record:** It is a matter of record that Han bibliographers catalogued more chapters than survive, and that the received text is lacunose. It is record that both readings have been defended for two millennia.
  **Contested Matters:** Whether the Advocate's principle is color-blind remains genuinely contested among people who know this literature well. Whether the Objector's concessions carry doctrinal weight is contested. No hybrid reading should be presented as the scholarly consensus.
  **Neutrality Flags:** Neutrality was purchased by weakening claims about the Advocate's intent below the threshold of interest in Section 1, Claim 11. We flag dependencies on contested renderings of technical vocabulary: 'name', 'stuff', 'designation', and the negative copula. In Section 3, Crux 1, the term 'color-blind' is used metaphorically and depends on a contested rendering of how the Advocate treats non-color modifiers. In Section 3, Crux 3, 'survives translation' depends on a contested view of whether semantic values are language-specific. We do not resolve these silently; they remain open variables in this joint statement.
