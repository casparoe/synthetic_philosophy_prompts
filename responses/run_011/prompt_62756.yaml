  ### Part 1: Three Candidate Decision Rules

  I have constructed three rules that are internally consistent and fit all five past rulings. They differ in their primary justification, which leads to different predictions for edge cases.

  **Rule 1: The Ontological Match (Modeling vs. Probing)**
  *   **Principle:** The distribution must match the *ontological status* of the artifact. If the artifact claims to describe reality (a reliability model, a regression estimate), use empirical data or invariance principles that reflect physical laws. If the artifact claims to probe system limits (a fuzzer, a canary, a chaos harness), use distributions that maximize coverage of the *failure space*, ignoring production frequency.
