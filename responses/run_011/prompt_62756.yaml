  ### Part 4: Discriminating Hypothetical

  To distinguish between my top two rules (**Ontological Match** vs. **Constraint-Propagation**), raise this hypothetical in the meeting:

  **The Hypothetical:**
  > "We are stress-testing a rate limiter. The hard limit is 100 requests/second. We want to find the exact failure point. We have telemetry showing traffic is usually 20 req/s.
  >
  > **Proposal A:** Log-uniform distribution from 1 to 1000 req/s (Invariance).
  > **Proposal B:** Uniform distribution from 90 to 110 req/s (Coverage of the Boundary)."

  **What each rule says:**
  *   **Rule 1 (Ontological/Goal-Relativity):** Supports **Proposal B**. The goal is "find the failure point." Mass should be concentrated where the decision boundary is. Invariance is secondary to the specific engineering goal.
  *   **Rule 2 (Constraint-Propagation):** Supports **Proposal A**. Start with Invariance (Log-Uniform). The only hard constraint is the physical max of the system (1000?). Concentrating mass at 90–110 assumes we know where the bug is; invariance admits we don't.

  *If Nadia sides with B, she is a Goal-Relativist (Objective > Math). If she sides with A, she is an Invariance-Formalist (Math > Heuristics).*

  ### Part 5: The Underlying Principle (If Underdetermined)

  If you find her record genuinely underdetermines the decision (i.e., she could reasonably go either way on Thursday), the principle you are defending by choosing **Log-Uniform over Protocol Bounds** is:

  **"The Principle of Maximum Ignorance."**
  By choosing Log-Uniform over the wide 1ms–10s range despite knowing the protocol constants, you are asserting that the *system's reaction* to the kill is the unknown variable, not the *timing* of the kill. You are testing whether the system is robust to *any* kill, not just *protocol-violating* kills.

