      *   2 (Ratio): Model. Physical quantity. Invariance (Log) reflects physical law. (Fit)
      *   3 (Disk): Model. Claims to describe reality. Data (Weibull) trumps ignorance. (Fit)
      *   4 (Defect): Model. High uncertainty. Sensitivity analysis covers the "ignorance space." (Fit)
      *   5 (Canary): Probe. Goal is finding tenant bugs. Uniform over tenants maximizes coverage, ignoring production volume. (Fit)
  *   **Weakness:** Requires a clear binary classification of "Model" vs. "Probe," which can be ambiguous.

  **Rule 2: The Constraint-Propagation Principle**
  *   **Principle:** Start with the most mathematically invariant distribution (Scale/Translation/Symmetry). Only restrict this distribution if constrained by *hard* physical or protocol boundaries. Do not restrict based on *soft* statistical tendencies (telemetry) unless the goal is fidelity simulation.
  *   **Check against rulings:**
      *   1 (Shards): Symmetry constraint (relabeling). (Fit)
      *   2 (Ratio): Scale invariance constraint. Bounds check validates the constraint. (Fit)
      *   3 (Disk): Hard constraint: We have measurements. Measurements are hard boundaries on ignorance. (Fit)
      *   4 (Defect): No hard constraints. Sensitivity analysis propagates the uncertainty of the missing constraints. (Fit)
      *   5 (Canary): Hard constraint: The goal is tenant coverage. Production volume is a soft statistical tendency, rejected. (Fit)
  *   **Weakness:** "Hard" vs. "Soft" constraints is subjective. Is a protocol constant "harder" than telemetry?

  **Rule 3: The Decision-Robustness Heuristic**
  *   **Principle:** Choose the distribution that makes the *engineering decision* most robust against error. If the decision is "which shard," error is low, pick simple (Uniform). If the decision is "is this safe," error is high, demand sensitivity (Case 4). If the decision is "where to look," maximize signal-to-noise for the bug (Case 5).
  *   **Check against rulings:**
      *   1 (Shards): Decision is trivial. Uniform is robust enough. (Fit)
      *   2 (Ratio): Decision is magnitude. Log-uniform prevents arithmetic bias. (Fit)
      *   3 (Disk): Decision is capacity planning. Data is most robust. (Fit)
      *   4 (Defect): Decision is release risk. Sensitivity is most robust. (Fit)
      *   5 (Canary): Decision is bug detection. Uniform tenants is most robust for detection. (Fit)
  *   **Weakness:** "Robustness" is vague without a defined loss function.

