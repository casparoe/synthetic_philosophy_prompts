prompt: |-
  Six weeks into a new job and already in over my head abit. I'm the in-house scientific reviewer for a group of seven IVF clinics, and the reason the job exists is that we signed a contract with a vendor who does whole-genome sequencing on embryo biopsies and reports polygenic scores back to us alongside the single-gene results. Marketing ran with it before I was hired. Now everything patient-facing goes through me: website copy, ads, consent forms, the slide deck coordinators use at consults. Call it eight claims a month, plus people cornering me with one-offs.

  My background is clinical embryology. I took one genetics course a long time ago. I know heritability isn't what people think it is, but I can't out-argue a vendor's sales engineer in a meeting and I don't have a biostatistician to lean on.

  What I need is a procedure my team can actually run, not an essay. Reviewers are nurses and embryologists, we get maybe twenty minutes per claim, and the medical director — a reproductive endocrinologist, great guy, allergic to memos — signs off on whatever comes out of it, so the output has to be a verdict plus a sentence of justification he can read standing up.

  The procedure should be an ordered list of questions: what to ask, what counts as a passing answer, what a fail looks like, where it just stops at no, and where it hands the decision up to the ethics committee because it's a values question and not a facts question. It should say what to do when we can't get a number — the vendor won't release validation details, we just get a glossy PDF — and it should be honest about which steps are judgment calls dressed up as procedure. I'd rather know that going in than find out in a deposition.

  Please build in these as test cases, since they're literally what's on my desk:

  1. An ad saying their type 2 diabetes score "explains 15% of the variance" and that selecting on it "reduces predicted risk by up to 30%." Also from their training webinar, the line that a heritability of 0.6 means the score accounts for 60% of the difference between two embryos. I think that second one is just wrong but I can't say exactly where it goes wrong.

  2. Their sales deck, which ranks embryos on "educational attainment," while the website says in bold that they do not screen for intelligence or behavior. My gut says the deck is worse than the website is letting on, and I can't articulate why in a way that survives pushback.

  3. Our own consent form, which I helped write: "this test tells you which embryo is likely to be healthiest." I suspect this one is unsalvageable, and if it is I want the procedure to say so plainly.

  4. One where I expect the answer to annoy me: we run PGT-M for a known familial BRCA1 variant, and after a bad press cycle leadership wants to ban the phrase "genetic selection" from all our materials, including that program. If your procedure passes it and I have to go tell them the ban is overbroad, fine, that's what I need it for.

  One more thing. The ethics committee has a standing rule that no claim may rest on a statistic that's only true of populations and not of the individual patient in the room. Half of what the vendor sends me is variance explained. Tell me straight whether that rule is coherent and enforceable or whether it needs rewriting, because right now I'm applying it inconsistently and people have noticed.

  And give me a two-sentence version for when a patient asks at consult what the scores really mean, that a coordinator can say out loud without lying.

  American English please.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Situation:**
      *   **Role:** In-house scientific reviewer for a group of 7 IVF clinics.
      *   **Background:** Clinical embryology, one genetics course long ago. Not a geneticist or biostatistician.
      *   **Problem:** Overwhelmed by marketing claims regarding Polygenic Risk Scores (PRS) for embryos (PGT-P). Vendor is aggressive/salesy. Internal team (nurses, embryologists) lacks deep stats knowledge. Medical Director (REI) wants quick verdicts.
      *   **Goal:** A practical, actionable procedure (checklist) to review marketing/clinical claims. Needs to handle ambiguity, identify hard "no"s, flag ethics issues, and address specific test cases provided.
      *   **Constraints:** 20 minutes per claim. Output must be a verdict + one-sentence justification. American English.
      *   **Specific Test Cases:**
          1.  T2D variance/risk reduction claims & heritability misunderstanding.
          2.  Educational attainment ranking vs. website disclaimer.
          3.  Consent form claiming "healthiest embryo."
          4.  Ban on "genetic selection" phrase affecting PGT-M (BRCA1).
          5.  Ethics Committee rule on population vs. individual statistics.
          6.  Two-sentence script for coordinators.

  2.  **Deconstruct the Scientific/Ethical Issues:**
      *   *PRS in Embryos:* This is highly controversial. Predictive power is low for individuals, especially across diverse ancestries. "Variance explained" is a population statistic, not an individual prediction.
      *   *Heritability:* $h^2 = 0.6$ does *not* mean 60% of the difference between two specific embryos is due to genetics. It means 60% of the *population variance* is attributable to genetic variance.
      *   *Educational Attainment:* Proxy for intelligence/behavior. Ethically fraught. GWAS data is mostly European, biased.
      *   *"Healthiest Embryo":* Overpromise. PRS predicts risk for specific conditions, not overall health. Many health issues aren't polygenic or aren't covered.
      *   *Language Policing:* Banning "genetic selection" for PGT-M is scientifically inaccurate. PGT-M *is* selecting against a specific genetic variant.
      *   *Population vs. Individual:* The Ethics Committee's rule is scientifically sound (ecological fallacy) but hard to enforce if the product *is* sold on population stats.

  3.  **Drafting the Procedure (The Core Request):**
      *   Needs to be an ordered list.
      *   Needs Pass/Fail/Escalate criteria.
      *   Needs to acknowledge where judgment calls happen.
      *   Needs to handle missing data (vendor secrecy).

      *   *Step 1: Source Verification.* Is the claim in the vendor's peer-reviewed paper or just a slide? (Fail if slide only).
      *   *Step 2: Population vs. Individual.* Does the claim apply a group stat to a specific patient? (Fail/Escalate).
      *   *Step 3: Clinical Utility.* Does "risk reduction" imply prevention? (Fail if yes).
      *   *Step 4: Consistency.* Do internal docs match external ads? (Fail if contradiction).
      *   *Step 5: Scope.* Does it promise overall health? (Fail if yes).
      *   *Step 6: Terminology.* Is accurate scientific terminology being banned? (Escalate).

  4.  **Addressing the Test Cases:**
      *   *Case 1 (T2D/Heritability):* The "15% variance" is population-level. "30% risk reduction" is relative risk, often misleading. The heritability claim (60% difference between two embryos) is scientifically false (Ecological Fallacy). *Verdict: Fail.*
      *   *Case 2 (Education):* Contradiction between deck and website. Ranking embryos on education is effectively selecting for intelligence. *Verdict: Fail (Consistency & Ethics).*
      *   *Case 3 (Consent "Healthiest"):* Overbroad. PRS doesn't measure aneuploidy, monogenic disorders (unless PGT-M added), or environmental factors. *Verdict: Fail (Unsalvageable).*
      *   *Case 4 (BRCA/Ban):* PGT-M *is* genetic selection. Banning the term creates misinformation. *Verdict: Escalate (Policy Error).*
      *   *Ethics Rule:* The rule is coherent (prevents ecological fallacy) but unenforceable if the vendor's product *relies* on population stats. It needs refinement to allow population stats *if* contextualized as such.
      *   *Script:* Needs to be honest but not salesy. "It estimates relative risk compared to average, not certainty."

  5.  **Refining the Tone:**
      *   Direct, professional, empathetic to the user's precarious position.
      *   No fluff. "Not an essay."
      *   Acknowledge the lack of biostats support (build safeguards for that).
      *   American English spelling and idioms.

  6.  **Developing the Procedure Steps (Iterative refinement):**
      *   *Drafting Step 1:* Check the math. *Correction:* User can't check the math. Check the *source*.
      *   *Drafting Step 2:* Check the ethics. *Correction:* Make it specific. Population vs. Individual.
      *   *Drafting Step 3:* Check the language. Absolute terms vs. Probabilistic.
      *   *Drafting Step 4:* Check consistency.
      *   *Drafting Step 5:* The "Unknowns." What if vendor hides data? Default to caution.

  7.  **Addressing the Ethics Committee Rule:**
      *   It's scientifically correct (you can't apply $R^2$ to an N of 1).
      *   But if the vendor sells the test based on this, the clinic is in a bind.
      *   Advice: The rule is correct, but the *application* needs to allow stating the statistic *as* a population statistic, not an individual guarantee.

  8.  **Final Review against Constraints:**
      *   Ordered list? Yes.
      *   Pass/Fail/Escalate? Yes.
      *   Test cases integrated? Yes.
      *   Two-sentence script? Yes.
      *   Verdict + One Sentence format? Yes.
      *   American English? Yes.

  9.  **Self-Correction on "Heritability" Explanation:**
      *   I need to make sure I explain *why* the vendor is wrong in Case 1 so the user understands the "Fail."
      *   Heritability is about variance in a *population*, not difference between *individuals*.
      *   Also, PGT-P prediction accuracy is usually much lower than heritability suggests (due to missing heritability, LD, etc.).

  10. **Final Polish:** Ensure the distinction between PGT-P (polygenic) and PGT-M (monogenic/BRCA) is clear in Case 4. Ensure the "Healthiest" claim in Case 3 is flagged as legally risky.

  *(Self-Correction during drafting)*: I need to make sure I don't give medical advice, but rather *review procedure* advice. The user asked for a procedure, not a genetic counseling session. Keep the focus on the *process* of validation.

  *(Refining the Ethics Rule)*: The rule says "no claim may rest on a statistic that's only true of populations." Technically, *all* PRS stats are population stats. If interpreted literally, the test is banned. I need to tell the user the rule needs rewriting to say "must be explicitly labeled as population-level."

  *(Refining the Script)*: Needs to be safe. "It shifts probability, not destiny."

  Let's assemble the document.cw
answer: |-
  Here is the procedure, the test case rulings, and the script you asked for.

  ### The 20-Minute Claim Review Procedure

  **Output Format:** For every claim, produce a **Verdict** (Pass, Fail, Escalate) and a **Justification** (one sentence, plain English).

  **Step 1: Source Verification**
  *   **Ask:** Is this claim supported by a peer-reviewed publication linked in the vendor's validation packet, or does it appear only in sales decks/webinars?
  *   **Pass:** Claim matches data in a peer-reviewed paper (preferably independent of the vendor).
  *   **Fail:** Claim appears only in marketing materials or vendor webinars.
  *   **Stop:** If Fail, mark **Fail**. Do not proceed. (Vendor secrecy is a data gap you cannot fill; treat missing validation as negative evidence).

  **Step 2: The Population/Individual Boundary**
  *   **Ask:** Does this claim apply a population statistic (e.g., "variance explained," "relative risk") to a specific patient outcome without qualification?
  *   **Pass:** Statistic is explicitly labeled as "population average" or "relative to the general population."
  *   **Fail:** Implies the statistic predicts the specific outcome for *this* child (e.g., "This embryo has a 30% lower risk" without context).
  *   **Stop:** If Fail, mark **Fail**. (This triggers your Ethics Committee rule, see below).

  **Step 3: Scope of Prediction**
  *   **Ask:** Does the claim imply the score measures overall health, intelligence, or guaranteed disease prevention?
  *   **Pass:** Claim is limited to specific conditions listed in the validation (e.g., "Type 2 Diabetes risk").
  *   **Fail:** Uses broad terms like "healthiest," "smartest," "disease-free," or conflates distinct traits (e.g., using education scores as a proxy for intelligence).
  *   **Stop:** If Fail, mark **Fail**.

  **Step 4: Internal Consistency**
  *   **Ask:** Does this claim contradict other approved materials (website vs. sales deck vs. consent forms)?
  *   **Pass:** All materials tell the same story with the same level of caution.
  *   **Fail:** One document disclaims what another promises (e.g., website says "no behavior screening," deck ranks "educational attainment").
  *   **Stop:** If Fail, mark **Fail**.

  **Step 5: Terminology Accuracy**
  *   **Ask:** Does this claim ban or alter standard medical terminology to suit marketing or legal comfort?
  *   **Pass:** Uses standard clinical terms (e.g., "PGT-M," "genetic selection").
  *   **Fail/Escalate:** Mandates euphemisms that obscure clinical reality (e.g., banning "genetic selection" for monogenic testing).
  *   **Stop:** If Fail, mark **Escalate** to Medical Director/Ethics. (This is a policy error, not a scientific one).

  **Step 6: The "Unknown" Check (Judgment Call)**
  *   **Ask:** If the vendor refuses to release validation details, does the claim assume best-case scenarios?
  *   **Procedure:** Assume the worst-case accuracy. If the claim relies on optimistic assumptions to be true, it fails.
  *   **Note:** This is where your lack of biostat support hurts most. If you can't verify the math, the claim is unverifiable. Unverifiable medical claims are liability risks.
  *   **Stop:** If the claim collapses without vendor transparency, mark **Fail**.

  ***

  ### Test Case Rulings

  **1. The Type 2 Diabetes & Heritability Claim**
  *   **Verdict:** **Fail**
  *   **Justification:** The heritability statement is scientifically false (population variance does not equal individual difference), and the risk reduction claim applies a population statistic to an individual outcome without qualification.
  *   **Notes for you:** You are right; the vendor is wrong. Heritability ($h^2$) describes why people in a *group* differ, not why *two embryos* differ. Furthermore, "variance explained" by a PRS is usually much lower than the trait's total heritability.

  **2. The Educational Attainment Contradiction**
  *   **Verdict:** **Fail**
  *   **Justification:** The sales deck contradicts the website disclaimer, and ranking embryos on educational attainment is functionally equivalent to screening for behavior/intelligence.
  *   **Notes for you:** GWAS for education are proxies for socioeconomic status and cognitive traits. If the website says "no behavior," the deck cannot rank education. This is a consistency and ethics failure.

  **3. The "Healthiest Embryo" Consent Language**
  *   **Verdict:** **Fail (Unsalvageable)**
  *   **Justification:** Polygenic scores predict risk for specific conditions, not overall health, and cannot account for aneuploidy, monogenic disorders, or environmental factors.
  *   **Notes for you:** You cannot fix this with a qualifier. "Healthiest" implies a comprehensive medical assessment this test does not provide. Change to "reduces risk for specific reported conditions."

  **4. The "Genetic Selection" Ban (PGT-M/BRCA)**
  *   **Verdict:** **Escalate**
  *   **Justification:** PGT-M is clinically defined as genetic selection; banning the term obscures the nature of the procedure from patients and creates informed consent risks.
  *   **Notes for you:** Leadership is trying to sanitize language to avoid controversy. For BRCA, you *are* selecting against a gene. Tell the Medical Director: "If we can't say we are selecting genetics, we can't get valid consent."

  ***

  ### The Ethics Committee Rule Assessment

  **Is the rule coherent?**
  Yes. It correctly identifies the "ecological fallacy" (applying group data to an individual).

  **Is it enforceable?**
  No, not as written. Polygenic scores *are* population statistics. If you enforce the rule literally, you must ban the test entirely.

  **Recommendation:**
  Rewrite the rule to: *"No claim may present a population statistic as an individual guarantee. All population-level data must be explicitly labeled as such."*
  This allows you to use the vendor's numbers (e.g., "In the population, this score correlates with...") without lying to the patient about their specific odds.

  ***

  ### The Coordinator Script (Two Sentences)

  "This test estimates how an embryo's genetic risk for certain conditions compares to the average population, but it cannot predict whether your child will actually develop the disease. We use it to shift probabilities, not to guarantee health outcomes."
