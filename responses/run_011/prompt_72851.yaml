      *My role:* Mediate.
      *Decision:* I will draft the Cause as the physical failure (Engineer's view) but write the Contributing Factors so strongly that the safety recommendations are unavoidable (Group A's goal). I will explain that this is the only way to prevent the regulator from focusing solely on punishing the mechanic and ignoring the broken rig/process.

      *Fueler:* Do not include in the formal "Findings." Include in the "Factual Information" section or as a separate safety notification.

