answer: |-
  **MEMORANDUM**

  **TO:** Safety Review Board
  **FROM:** [Your Name/Role]
  **DATE:** [Current Date]
  **SUBJECT:** Draft Findings for Incident [ID Number] & Procedural Recommendations for Thursday's Meeting

  ### 1. Draft Findings Section

  Below is the proposed text for the regulatory report. This wording is designed to satisfy the factual record while navigating the regulatory distinction between "Cause" (enforcement) and "Contributing Factors" (recommendations).

  **Cause of Occurrence:**
  > Structural failure of the right main landing gear assembly due to fatigue fracture of the retaining bolt.

  **Contributing Factors:**
  > 1. Maintenance control failure to ensure replacement of life-limited parts within mandated intervals.
  > 2. Absence of required dual-inspector verification on landing gear maintenance tasks.
  > 3. Unavailability of calibrated torque-verification equipment due to unresolved software update status.
  > 4. Latent design vulnerability identified in historical engineering correspondence but not addressed through airworthiness directives or service bulletins.
  > 5. Breakdown in safety reporting culture regarding external ground handling observations.

  ***

  ### 2. Rationale for Placement (Engaging the Board)

  We have three competing views on how to fill the "Cause" line. Here is why the draft above is the safest path for the airline and the most honest interpretation of the data.

  **To the Staff Engineer:**
  You are correct that labeling an omission (e.g., "Mechanic failed to swap bolt") as the *Cause* is philosophically distinct from a physical event. In a perfect safety system, "Cause" would describe the energy exchange (the collapse), and everything else would be systemic conditions. By placing the **bolt fracture** in the Cause line, we validate your position: we are not codifying a human absence as the primary causal event. This protects us from the infinite regress you noted (why not blame the manufacturer? why not blame the hiring budget?). It keeps the "Cause" factual and physical.

  **To the Members Favoring "Missed Replacement" as Cause:**
  I understand the desire to place the maintenance lapse in the Cause line to ensure accountability. However, because the regulator uses the Cause line for *individual enforcement*, placing the omission there guarantees the focus will be on punishing the specific mechanic or inspector who signed (or didn't sign) the paper. That triggers a defensive response, not a systemic fix. By moving the maintenance lapse to the **top Contributing Factor**, we ensure it drives the safety recommendations (fixing the tracking system, the verification process, and the tooling) without handing the regulator a single name to prosecute. We get the system fixed without sacrificing the Just Culture.

  **To the Member Concerned About the "But-For" Test:**
  You noted that under a strict "but-for" test, neither the missing second mechanic nor the offline torque rig qualifies as a cause, because the other could have theoretically caught the error. This is a known limitation of "but-for" causality in aviation safety (the Swiss Cheese Model). If we rely on that test, we conclude *nothing* caused the accident because the redundancy failed. The draft avoids this trap by categorizing these as **Contributing Factors**. In regulatory practice, Contributing Factors do not require strict "but-for" causality; they require only that the factor increased risk or degraded defenses. This allows us to cite both the missing verification *and* the missing tool as critical failures without getting stuck in a logical paradox.

  ***

  ### 3. Proposed Standing Rule: "Barrier Analysis over Proximate Cause"

  To prevent relitigating this for every incident involving omissions or redundant failures, I propose the Board adopt the following standard for future reports:

  **1. Definition of Cause:**
  The "Cause" line shall describe the **immediate physical failure** or event that directly resulted in the occurrence (e.g., gear collapse, engine flameout, runway excursion). Human omissions shall not be listed as the primary Cause unless the act was intentional misconduct.

  **2. Definition of Contributing Factors:**
  Contributing Factors shall be determined using **Barrier Analysis**, not "But-For" testing.
  *   *Rule:* If a safety barrier (e.g., second mechanic, torque rig) was designed to prevent the occurrence and was absent or failed, it is a Contributing Factor, regardless of whether other barriers also failed.
  *   *Rationale:* Multiple failed barriers are not mutually exclusive; they are cumulative systemic weaknesses.

  **3. Handling Omissions:**
  Failure to act (omission) shall be categorized as a Contributing Factor representing a **Systemic Control Failure**, not an Individual Cause. This distinguishes between "the system allowed this to be missed" (Contributing) and "this person broke the plane" (Cause).

  ***

  ### 4. The Fueler Issue

  The fueler from the handling company noticed chafing two days prior but did not report it. We have no jurisdiction over him, and naming him in a formal finding creates legal exposure and discourages future reporting from external partners.

  **Recommendation:**
  1.  **Do not include** the fueler's identity or specific inaction in the "Findings" or "Contributing Factors" of the regulatory report.
  2.  **Include** the information in the "Factual Information" section of the narrative as: *"Post-incident interviews indicate visual anomalies on the gear leg may have been present 48 hours prior to the flight."*
  3.  **Action:** Safety Department to issue a confidential **Safety Alert** to the handling company's safety manager. Share the interview data anonymously. Request they review their "See Something, Say Something" training.
  4.  **Rationale:** This captures the safety data for our records (in case the regulator asks how we knew about the chafing) without turning an external contractor into a target in our internal enforcement document. It preserves the relationship and encourages the handling company to fix their own reporting culture without us dictating terms.

  ***

  ### 5. Thursday's Meeting Strategy

  When we meet, I suggest we frame the discussion around **outcome** rather than **semantics**.

  *   **Ask the Staff Engineer:** "If we put 'Bolt Fracture' in the Cause line, will you support listing the maintenance tracking failure as the *first* Contributing Factor?" This gives him the philosophical win while securing the Board's need for the maintenance issue to be prominent.
  *   **Ask the Enforcement Group:** "If we put 'Missed Replacement' in the Cause line, the regulator will sanction the mechanic. Will that sanction prevent the maintenance vendor from cooperating with the torque-rig fix?" This highlights the risk of their approach.
  *   **Ask the Logic Member:** "Do you agree that under Barrier Analysis, two failed defenses are two contributing factors, even if neither is strictly 'but-for'?" This resolves his paradox without changing the form.

  This approach allows us to sign the report unanimously. It respects the Engineer's concern about blame, satisfies the Board's duty to address the maintenance lapse, and solves the logical contradiction regarding redundant safety barriers.

  Please review the draft findings above before Thursday. I am available to discuss the Barrier Analysis rule prior to the meeting if anyone wishes to walk through the logic.

  Respectfully,

  [Your Name]
