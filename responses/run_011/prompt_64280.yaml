  *(Refining the DR point)*: The DR offer is crucial. Hardin argues against a "World Food Bank" (global commons). The DR offer was a *national* solution within a global context. If the DR had space, the "full boat" thesis for the *US* might hold, but the "no space anywhere" thesis fails. Hardin would say "The DR boat is also finite." The counter is: The DR boat wasn't full. So the *global* carrying capacity wasn't reached. Hardin's argument relies on the assumption that *all* boats are full.

  *(Refining the Ratchet)*: Hardin's ratchet is about aid leading to population growth leading to more aid needed. In the *St. Louis* case, this doesn't apply. They weren't asking for food aid to stay in Germany; they were asking for relocation. This is a key disengagement.

