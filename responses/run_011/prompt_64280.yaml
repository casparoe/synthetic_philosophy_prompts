      *   *Premise 1: Finite Capacity.* The boat cannot hold everyone without sinking.
      *   *Premise 2: No Safety Net.* Taking people on board risks everyone (tragedy of the commons).
      *   *Premise 3: The Ratchet Effect.* Aid creates dependency and population growth, worsening the problem later (World Food Bank argument).
      *   *Premise 4: Justice/Survival.* Survival of the boat occupants takes precedence over altruism that sinks the boat.
      *   *Premise 5: No Alternative.* There is no "space" elsewhere; the choice is binary (take them and sink, or leave them).

  3.  **Map the *St. Louis* Episode to Hardin's Framework:**
      *   *The Boat:* The *St. Louis* itself? Or the destination nations (US/Canada/Cuba)? Hardin usually applies the lifeboat to *nations*. So, the US/Canada/Cuba are the lifeboats. The *St. Louis* is the vessel of the desperate.
      *   *People in the Water:* The 900+ Jewish refugees.
      *   *Capacity:* Defined by immigration quotas, political will, and economic absorption.
