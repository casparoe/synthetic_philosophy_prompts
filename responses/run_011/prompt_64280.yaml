      *   *Implication:* If capacity existed globally but wasn't accessed due to coordination/politics, Hardin's "physical limits" argument weakens. It becomes a "political will" argument.
      *   *Relocation:* Does it just move the boundary? Yes. But if the global system has spare capacity, the "absolute scarcity" premise is challenged.

  5.  **Distinguish Empirical vs. Normative:**
      *   *Empirical:* Did the refugees cause resource depletion? (Historical data). Does aid cause population spikes? (Demographic transition theory vs. Hardin's view).
      *   *Normative:* Is it right to prioritize current citizens over dying refugees? What is the value of a life vs. economic stability?
      *   *Consensus Check:* Hardin's "ratchet" regarding food aid is heavily contested in development economics. The demographic transition model suggests aid *lowers* birth rates eventually. Hardin's view is often seen as outdated in ecology/development circles.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the user's expertise. Validate the shift from biology to philosophy.
