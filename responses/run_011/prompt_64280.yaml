      *   *Verdict:* The metaphor breaks down because it treats political choices as natural limits.
      *   *Labeling Claims:* I need to use specific markers (e.g., [Empirical Consensus], [Contested Normative], [Hardin's Assertion]).

  7.  **Refining the "Verdict":**
