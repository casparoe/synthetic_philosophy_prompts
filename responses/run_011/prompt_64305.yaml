      *   **3. Self-Stabilizing Equilibrium:** If looping leads to convergence/stability (homeostasis), does that refute the destabilization claim? It suggests the target *stops* moving.
      *   **4. Falsifiability/Risk:** Is the view unfalsifiable? (Every success is explained away as target moving). Is this a defect?

