answer: |-
  # Term Paper Q&A Prep Sheet
  **Topic:** Money Pumps, Intransitivity, and Myopia
  **Thesis:** Money pumps only condemn intransitive preferences when coupled with myopic decision procedures; resolute choice or lookahead neutralizes the pump without requiring transitive preferences.

  ---

  ### ⚠️ The Question You're Praying Nobody Asks
  **The "Smuggling" Objection**
  **Who:** The Senior Decision Theorist (Hammond camp)
  **The Question:** "If your agent has the capacity for resolute choice—effectively binding her future self to a plan that contradicts her local preferences at the time of choice—doesn't she effectively possess a higher-order, transitive meta-preference over plans? If so, aren't you just locating the transitivity in the meta-preference rather than the object preference? You haven't saved intransitivity; you've just pushed the transitivity requirement up one level."

  **The Reply:**
  "That's a sharp distinction, and it gets to the heart of the McClennen vs. Hammond debate. My claim isn't that the *meta-preference* is intransitive, but that the *object-level* preference (over prints) remains cyclic. The rationality constraint applies to the management of the self over time, not necessarily to the valuation of the objects. We accept that agents can have conflicting first-order desires managed by a second-order volition (Frankfurt-style). Why is it problematic to have cyclic first-order preferences managed by a resolute policy? The 'transitivity' in the plan is a feature of instrumental rationality (don't lose money), not a feature of the underlying taste structure. I'm arguing we shouldn't conflate the rationality of the *manager* with the consistency of the *tastes*."

  **The Soft Spot:**
  This is the hardest hit. If they press that a "resolute policy" *just is* a preference over paths, and paths must be ranked transitively to avoid pumps, you risk conceding that rationality *requires* transitivity somewhere, which undermines the "toothless" claim. You are relying on a controversial separation between "preferences" and "policies."

  ---

  ### The 8 Objections (Ranked by Damage)

  #### 1. The Dynamic Consistency Hammer
  **Who:** Decision Theorist #1 (Hammond Fan)
  **The Objection:** "You're advocating for Resolute Choice, but Hammond settled this in '83. Resolute choice violates *Separability*. If the agent plans at t1 to refuse the trade at t2, but at t2 she strictly prefers to trade (C > A), forcing herself to stick to the plan is dynamically inconsistent. She is ignoring her current preferences. How is it rational to act against your current strict preference just to satisfy a past self?"
  **The Reply:**
  "Hammond assumes that rationality requires satisfying your preferences at every node (Sophistication). I'm challenging that norm. If satisfying local preferences leads to a globally dominated outcome (losing the quarter), then the norm is flawed. Resolute choice treats the agent as a temporally extended entity, not a sequence of time-slices. It's rational to prioritize the global outcome over the local impulse, just as it's rational to diet despite a local preference for cake. The 'inconsistency' is only a problem if you assume the time-slice is the unit of agency. I'm assuming the whole life is."
  **The Soft Spot:**
  You are biting the bullet on Separability. Many theorists view Separability as a constitutive norm of rationality, not just a heuristic. If they don't accept "temporally extended agency" as a primitive, your reply looks like an assertion, not an argument.

  #### 2. The Dominance Argument
  **Who:** Decision Theorist #2
  **The Objection:** "Forget the procedure. Look at the outcome. An agent with these preferences *can* be led to a dominated outcome (A minus 75 cents vs. A). If a preference ordering permits a dominated strategy to be available, isn't the ordering itself defective? Rationality requires not choosing dominated options."
  **The Reply:**
  "The preference ordering doesn't *force* the dominated outcome; the combination of ordering + myopia does. A knife can cut bread or cut a thumb. We don't say the knife is defective because it can cut a thumb; we say the user was careless. Similarly, the preference structure allows for the pump, but doesn't necessitate it. Rationality requires avoiding dominated *choices*, not necessarily having preference structures that make dominated choices impossible. The agent avoids the dominance by exercising lookahead."
  **The Soft Spot:**
  "Permits" vs. "Necessitates" is a fine line. If a preference structure *permits* self-sabotage under full information, many theorists argue that's sufficient to call it irrational. You're relying on a very narrow definition of what preferences are "for."

  #### 3. The "Real World" Myopia Critique
  **Who:** Behavioral Economist #1
  **The Objection:** "This is theoretically cute but normatively useless. Humans *are* myopic. We have cognitive limits. If your theory of rationality only works for agents with perfect lookahead and infinite resolution, it has no grip on actual decision-makers. A normative theory should guide the agents we actually are."
  **The Reply:**
  "I agree humans are often myopic, but 'is' doesn't imply 'ought.' The money pump argument is often used to say intransitive preferences are *intrinsically* irrational, like a logical contradiction. I'm showing they aren't logically contradictory, just practically risky. That's a huge difference. It means we can train people to use checklists or pre-commitment devices (lookahead) rather than telling them their tastes are broken. It shifts the intervention from 'fix your values' to 'fix your process,' which is more actionable."
  **The Soft Spot:**
  They might retort that if a normative theory requires cognitive capacities humans don't have, it's not a normative theory for humans. You're walking a line between ideal theory and practical advice.

  #### 4. The Revealed Preference Trap
  **Who:** Behavioral Economist #2
  **The Objection:** "If she refuses the trade at t1 to avoid the pump, didn't she just reveal that she prefers 'A and keep quarter' to 'B and lose quarter'? If so, her preferences over the *final outcomes* are transitive. You're just confusing preferences over objects with preferences over bundles."
  **The Reply:**
  "That's a fair reframing, but it changes the subject. The money pump argument is traditionally aimed at preferences over the *objects* (the prints). If we redefine the objects to include the transaction history and future consequences, yes, we can always model the agent as transitive. But that makes the transitivity requirement trivial. Any behavior can be rationalized as transitive if we enrich the description enough. My point is that the underlying taste for the prints remains cyclic, and that's not irrational until combined with a specific choice architecture."
  **The Soft Spot:**
  This is the standard "Broome" objection. If you enrich the description enough, intransitivity disappears. You have to argue why we should care about the "thin" preference over prints rather than the "thick" preference over outcomes.

  #### 5. The Cost of Lookahead
  **Who:** Grad Student (Pragmatist)
  **The Objection:** "Lookahead isn't free. Calculating the sequence takes cognitive energy. If the cost of thinking through the pump exceeds the 75 cents, the rational myopic agent just pays the quarter. So the pump still works as a critique of the preferences because they make thinking too expensive."
  **The Reply:**
  "True, but that makes it a cost-benefit problem, not a consistency problem. If I lose money because I didn't want to spend the mental energy to count change, that's not a violation of logic. The money pump argument claims intransitivity is like believing P and not-P. I'm saying it's more like forgetting your wallet. It's a performance error, not a competence error. The preference structure itself isn't the logical flaw."
  **The Soft Spot:**
  If the cognitive cost is high enough, the "resolute" procedure is irrational. You're conceding that intransitivity is costly, which weakens the "toothless" claim. It's toothless logically, but maybe not practically.

  #### 6. The "Why Not Just Fix Preferences?" Challenge
  **Who:** Grad Student (Parsimony)
  **The Objection:** "You're adding a whole module—'resolute choice procedure'—to save the preferences. Why not just Occam's Razor the whole thing? If adding resoluteness fixes the problem, why not just say the preferences were wrong to begin with? It's simpler to say 'make preferences transitive' than 'keep cyclic preferences and add a monitoring system'."
  **The Reply:**
  "Because preferences aren't always under our direct voluntary control. I can't just decide to prefer B to C tomorrow. But I *can* decide to adopt a rule of not trading after 5 PM. It's empirically easier to change procedures than tastes. Also, theoretically, we want to know if the cycle itself is the problem. If the cycle is harmless with the right procedure, then the cycle isn't the root cause of the irrationality. Parsimony shouldn't hide the causal structure."
  **The Soft Spot:**
  Decision theorists love parsimony. They might argue that "rational preferences" is a simpler model than "cyclic preferences + resolute module." You're arguing for descriptive accuracy over model simplicity.

  #### 7. The Uncertainty Variant
  **Who:** Decision Theorist #1 (Follow-up)
  **The Objection:** "Your case assumes the agent sees the *whole sequence*. What if the pump is probabilistic? Or what if she doesn't know if there will be a third offer? Lookahead fails under uncertainty. Intransitive agents get pumped in expectation."
  **The Reply:**
  "That's a different argument, the *ex ante* money pump. My thesis is specifically about the standard *ex post* sequential pump. I'm granting that intransitivity might be problematic under uncertainty. But the classic textbook argument relies on the sequential trade. I'm carving out a space where intransitivity is viable: deterministic environments with full information. We shouldn't let the uncertainty arguments do all the work in the deterministic cases."
  **The Soft Spot:**
  This limits the scope of your thesis significantly. If intransitivity is only safe in deterministic, full-information worlds, it's a very narrow safety zone. They might argue that's not where decision theory matters most.

  #### 8. The "Arbitrary Stopping" Point
  **Who:** Grad Student
  **The Objection:** "If she refuses the first trade because she sees the cycle, why does she stop there? Why not refuse to enter the market at all? Where does the resoluteness apply? It seems like you're just assuming she stops exactly where needed to avoid the loss."
  **The Reply:**
  "The rule isn't 'stop arbitrarily.' The rule is 'maximize final asset position.' She refuses the first trade because the *sequence* initiated by that trade leads to a loss. It's not arbitrary; it's backward induction. She values A > (A - $0.75). The resoluteness is simply sticking to the valuation of the final state rather than the intermediate step. It's a consistent policy, not an arbitrary stop."
  **The Soft Spot:**
  If the agent is truly myopic at t2, how did she bind herself at t1? You're assuming the binding is effective. If the binding is just another preference, we're back to Objection #1 (Dynamic Consistency).

  ---

  ### General Advice for the Room
  *   **On the Hammond Crowd:** Don't try to prove them wrong on *their* terms (Separability). Argue that their terms are too restrictive for the phenomenon you're describing. Frame Resolute Choice as a competing normative standard, not a mistake in their math.
  *   **On the Behavioral Crowd:** Lean into their side. Use them to bolster the claim that "myopia is the real variable," not preferences. They are your natural allies against the pure theorists.
  *   **On the "Prayer" Question:** If asked, pause. Take a breath. Acknowledge the depth of the point. It shows respect. Then pivot to the distinction between *tastes* and *management*.

  Good luck. You've got a solid McClennen-style defense; just watch out for the Separability trap.
