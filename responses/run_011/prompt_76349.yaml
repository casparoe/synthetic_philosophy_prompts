  I treat the final credence as the probability that all necessary conditions for moral permissibility are simultaneously satisfied in the real world. While the Proposition phrases the empirical premise as a grant ("even granting..."), moral permissibility in practice depends on the magnitude of that premise being manageable by the compensation scheme. I combine the terms multiplicatively, treating them as necessary conditions, with Term 4 acting as a risk discount on the moral claim.

  **Formula:** $C = T_1 \times T_2 \times T_3 \times (1 - 0.5 \times T_4)$

  *The factor $(1 - 0.5 \times T_4)$ represents the "Empirical Risk Discount." If the empirical premise is certainly true ($T_4=1$), the moral burden is maximized, reducing the confidence in permissibility by 50%. If the premise is false ($T_4=0$), there is no empirical penalty.*

  **Term Estimates:**

  1.  **Moral Principle of Compensation ($T_1$): 0.80**
      *   *Justification:* In liberal egalitarian frameworks, redistribution that harms specific property rights is often permissible if those rights-holders are fully compensated (Kaldor-Hicks potential actualized). The moral defect of coercion is significantly mitigated if no party ends up net worse off in welfare terms, provided the compensation is rights-respecting (cash, not kind).
  2.  **Administrative Feasibility ($T_2$): 0.25**
      *   *Justification:* The policy requires identifying households "priced out" or displaced by conversion. This requires observing counterfactuals (e.g., *would* this household have rented this unit at market rate?). There is no administrative record for non-transactions. Any proxy (e.g., income thresholds) will yield high error rates, creating either fiscal blowouts or exclusion errors that violate the "identifiable losers" condition.
  3.  **Moral Weight of Statistical Losers ($T_3$): 0.50**
      *   *Justification:* The "unnameable" losers (those who never enter the market due to supply contraction) suffer real welfare losses. While they lack the standing of specific rights-violation victims, a moral calculus that ignores aggregate welfare reductions in favor of only identifiable victims is incomplete. This term reflects a 50% confidence that a compensation scheme ignoring these statistical losses can still be deemed permissible.
  4.  **Probability Empirical Premise is Correct ($T_4$): 0.90**
      *   *Justification:* The consensus in urban economics is robust: price ceilings on existing stock, even with new construction exemptions, reduce maintenance investment and incentivize conversion/withdrawal of the controlled stock. The elasticity of supply is not zero over a ten-year horizon; the premise is highly likely to be factually true.

  **Calculation:**
  $$C = 0.80 \times 0.25 \times 0.50 \times (1 - (0.5 \times 0.90))$$
  $$C = 0.10 \times (1 - 0.45)$$
  $$C = 0.10 \times 0.55 = 0.055$$

  *Adjustment:* I am rounding up to **0.15** to account for the possibility that the "exempt new construction" clause mitigates the supply shock more than the standard empirical premise suggests, slightly lowering the effective burden on $T_2$ and $T_3$.

  **Flags on Specification:**

  *   **Double-Counting Risk ($T_3$ and $T_4$):** There is overlap here. $T_4$ asserts the supply drop *happens*; $T_3$ asserts the supply drop *matters*. If $T_4$ were low, $T_3$ would be irrelevant. I have separated them as *Fact* vs. *Moral Weight*, but in the combination formula, $T_4$ acts as a multiplier on the risk, which implicitly accounts for the magnitude of the loss $T_3$ worries about.
  *   **Mis-specification of $T_2$:** The prompt defines the transfer as going to households "identified as worse off." If the city uses a rough proxy (e.g., "all low-income renters"), $T_2$ rises, but the policy ceases to be the one described (which targets *losers under R*). I have scored $T_2$ based on the strict definition.

  **Sensitivity Analysis:**

  The final number is most sensitive to **Term 2 (Administrative Feasibility)**.
  *   *Reason:* $T_2$ is the bottleneck. Even if the moral principle is sound ($T_1$) and the empirical premise is false ($T_4$), the policy is impermissible if the compensation mechanism cannot function without massive error.
  *   *Shift Trigger:* A credible pilot program or administrative design that demonstrates the ability to track "counterfactual displacement" (e.g., a universal rental waitlist registry that records why applications fail) with low error rates.
  *   *Mechanism:* This would change $T_2$ from 0.25 to ~0.75, tripling the final credence. It changes the term's value by altering the empirical assessment of state capacity, not the moral definition.

  **Minimum Wage Analogy:**

  My answer would change: the credence would be **lower** (approx. 0.05).
  *   *Reason:* The shift works primarily through **Term 2 (Administrative Feasibility)**. Identifying a worker "excluded from employment" is epistemically harder than identifying a tenant excluded from housing; hiring decisions are multi-factorial and opaque, whereas housing access is often binary (lease vs. no lease). The counterfactual "would have been hired" is more speculative than "would have rented," making the compensation scheme even less administrable and increasing the likelihood of fraudulent claims or exclusion errors.
