  Here is the breakdown of your sister's method, the prediction for the newspaper, and the diagnostic case you need.

  ### Part 1: The Rules of the Desk

  Based on the log, she is running a **Conditional Lindy Protocol** with three specific operating constraints.

  **Rule 1: The Lindy Baseline (The "Tree" vs. "Startup" Answer)**
  She assumes that for any institution that has survived its "infant mortality" phase, the hazard rate is constant. This is a Pareto (Power Law) distribution, not a Bell Curve (normal) or Gompertz (biological aging).
  *   **The Math:** Expected Total Lifespan $\approx$ 2 $\times$ Current Age.
  *   **Evidence:** Insurer (70 $\to$ 140), Party (6 $\to$ 12), University (500 $\to$ 1000), Regional Power (45 $\to$ 90).
  *   **Implication:** She does *not* think institutions age like trees (where death risk increases with time). She thinks they age like survivors: the longer you've lived, the longer you're likely to live.

  **Rule 2: Reference Class Hierarchy (Mechanism > N > Specificity)**
  She selects the file based on the *cause of death*, not just statistical significance.
  *   **Priority 1 (Mechanism):** If the environment changes the *way* things die, she narrows the class, even if $N$ drops. (Universities: "Pre-print" vs. "All"; Newspaper: "Post-2000" vs. "All").
  *   **Priority 2 (Sample Size):** If the mechanism class is too small ($N < \sim15$), she widens to a "roughly right" class rather than a "precisely wrong" one. (Regional Power: Widened from 5 to 20).
  *   **Priority 3 (Specificity):** She ignores narrow geographic/founding cohorts if they don't change the death mechanism. (Newspaper File D is likely too narrow unless the metro size changes the *cause* of death).

  **Rule 3: Asymmetric Inside-View Admissibility**
  She allows inside-view facts only if they indicate **structural fragility**, never if they indicate **resource abundance**.
  *   **Admissible (Fragility):** "One unpaid maintainer" (Library). She penalized the prediction *below* the statistical median because the structure was brittle.
  *   **Inadmissible (Fuel):** "Celebrity founder/funding" (Scooter), "Leader charisma" (Party), "Endowment" (Newspaper). She treats these as "cash changes when you die, not whether." They delay the end but do not alter the curve.
  *   **The Asymmetry:** Bad news about structure shortens the life; good news about resources is ignored.

