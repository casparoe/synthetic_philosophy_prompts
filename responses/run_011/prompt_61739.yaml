prompt: |-
  You are a political philosopher specializing in distributive justice, with a real interest in how technical disciplines borrow from moral theory and vice versa. Work slowly and carefully, and begin by listing your candidate correspondences between the two vocabularies, marking the ones you are unsure of, before you commit to the translation.

  I am a pricing actuary in personal lines — auto and homeowners — with some earlier experience in disability underwriting. I have no philosophy training. I want you to restate luck egalitarianism in the vocabulary I actually work in: exposure, peril, rating factors, adverse selection, moral hazard, deductibles and coverage elections, reserves, community rating versus experience rating, and the category of losses we are permitted to classify on versus those we are forbidden to classify on.

  The position to be translated is this: an inequality is unjust when and only when it traces to brute luck rather than to the person's own choices; brute misfortune should be pooled across the group, while the consequences of deliberately assumed risk should stay with the person who took it. Translate that as faithfully as you can, then give me a residue report under three headings: claims that carry over cleanly, claims that carry over only with distortion (say exactly what gets distorted), and claims that have no expression at all in my vocabulary.

  Two specific questions I want answered inside that report. First, the version of this view I have read about most replaces redistribution with a hypothetical insurance market, in which people behind a veil of ignorance buy coverage against being untalented or disabled and the resulting premiums define the just tax. Do not treat that as a translation success merely because it uses my words. Tell me whether such a market counts as insurance by my standards at all — no exposure period, no loss history, no risk classification, a premium nobody can observe or file — or whether it is a redistribution formula in actuarial costume, and if the latter, what work the costume is doing. Second: is the fight between community rating and experience rating the same fight as the one between brute luck and option luck? If not, where do they come apart?

  Keep the translation honest in both directions: do not smuggle in assumptions from my side and label them translation, and do not let philosophical terms creep back in as unexplained shorthand.

  Close by committing to a verdict rather than surveying the readings. Is the residue a limitation of my framework — something I genuinely cannot say that I ought to be able to say — or evidence that the brute/option distinction was doing less work than its defenders assume? Pick one, give me your reasons, and tell me what the other side would have to show to change your mind.
