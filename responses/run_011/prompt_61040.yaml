answer: |-
  This is a sharp observation. You've identified a gap between the *stated* epistemic boundary of your test ("only the words") and the *actual* information flow (words + timing).

  You asked me to treat this as a puzzle, not a survey, and to challenge your premise if it's confused. I'm going to start by validating your intuition about Turing, then brainstorm the philosophical commitments, and finally land on what your protocol is actually doing versus what it says it's doing.

  ### Part 1: The ESP Analogy (Confidence: High)

  First, your read on Turing is correct. In Section 6 of *Computing Machinery and Intelligence*, Turing addresses the "Argument from Extrasensory Perception." He writes: "The statistical evidence, at least for telepathy, is overwhelming." He argues that if telepathy exists, the interrogator could bypass the text channel entirely (reading the human's mind directly). To prevent this, he suggests a "telepathy-proof room."

  **Is your latency problem the same?**
  Structurally, yes. Practically, it's the inverse.
  *   **Turing's Fear:** Information leaks *around* the channel (bypassing the text).
  *   **Your Reality:** Information leaks *through* the channel's physics (timing metadata), bypassing the *semantic content*.

  In both cases, the "game" is compromised because the judge has access to data that correlates with the agent's nature but is not part of the intended "intelligence" signal. Turing wanted to isolate *intellectual capacity* from *paranormal capacity*. Your protocol claims to isolate *linguistic capability* from *computational/mechanical latency*.

  So, no, you aren't building on a confused premise. The analogy holds.

  ### Part 2: Brainstorming Candidate Commitments

  You asked what theory of mind the "only the words" rule presupposes. Let's list the candidates and stress-test them against your protocol.

  **Candidate 1: Radical Behaviorism**
  *   **The Commitment:** Mental states are nothing over and above observable behavior. If it acts human, it is human. All observable output counts as evidence.
  *   **Fit:** **Poor.** A strict behaviorist would say response latency *is* behavior. Typing speed is a motor function indistinguishable from word choice in terms of "observable output." If your rule were behaviorist, you wouldn't hide the latency; you'd treat it as a data point. By trying to exclude it, you are admitting that not all behavior counts as "mind."

  **Candidate 2: Computational Functionalism**
  *   **The Commitment:** Mental states are defined by their causal role (input → processing → output). The physical substrate doesn't matter, but the *function* does.
  *   **Fit:** **Mixed.** Functionalism usually cares about the *logical* sequence, not necessarily the *temporal* duration. However, real-time interaction is a functional constraint of human intelligence. If the function includes "responding within a human timeframe," then latency matters. If the function is just "mapping input tokens to output tokens," latency is irrelevant. Your protocol assumes the latter, which is a specific, narrow slice of functionalism.

  **Candidate 3: Cartesian Dualism (Semantic Idealism)**
  *   **The Commitment:** There is a distinction between the *res cogitans* (thinking thing/meaning) and the *res extensa* (extended thing/physical mechanics). The "mind" resides in the meaning; the "machine" resides in the delivery.
  *   **Fit:** **Strong.** This is the only view that cleanly separates "the words" from "the timing." It presupposes that the *semantic content* is the locus of intelligence, and the *transmission mechanics* (speed, font, latency) are mere physical accidents that should be controlled away. It treats the text as a pure vessel of mind, independent of its physical instantiation.

  **Candidate 4: Pure Experimental Hygiene (No Philosophy)**
  *   **The Commitment:** We are measuring Construct X (Linguistic Mimicry). Latency is a confounding variable for Construct X, so we remove it.
  *   **Fit:** **Plausible but Circular.** This claims to be agnostic, but defining "Linguistic Mimicry" as "Words only" is itself a philosophical choice. It assumes "Language" is distinct from "Communication." If you believe language *is* communication (pragmatics), timing is constitutive, not confounding.

  ### Part 3: Landing the Analysis

  Here is where I land. Your "only the words" rule is not behaviorist. It is a form of **Semantic Dualism**.

  It presupposes that "intelligence" (or the thing you are testing) resides exclusively in the *selection* of tokens, not the *generation* of them. It treats the model/human as a "black box" where the only relevant output is the semantic payload.

  **The Contradiction**
  Your practice is inconsistent with your rule.
  1.  **The Rule:** "Only the words." (Semantic Dualism).
  2.  **The Practice:** Allowing latency to vary visibly. (Behavioral/Physical leakage).
  3.  **The Result:** The judges aren't evaluating "the words." They are evaluating "the words + the physics of production."

  If you were truly committed to Semantic Dualism, you would normalize latency. You would force the model to wait 20 seconds before sending, or buffer the human's text to appear instant. By not doing this, your team is implicitly admitting that **the physical instantiation matters**, even if your documentation says it doesn't.

  This suggests your team is actually operating on **Candidate 4 (Hygiene)** but has failed to identify the correct variables. They think they are controlling for "UI artifacts" (fonts, names), but they are missing "temporal artifacts."

  ### Part 4: What If We Swapped the View?

  You asked what the protocol would look like if we adopted a view where the channel *doesn't* have to be shielded (i.e., if we accept latency as valid evidence).

  **Option A: The Functionalist Protocol (Latency as Feature)**
  *   **Philosophy:** Intelligence includes temporal responsiveness. A mind that thinks in 50ms is not a human mind.
  *   **Protocol Change:** Do not hide latency. Let the judge see the typing indicator.
  *   **Evaluation Metric:** Change the success condition. The model doesn't need to be "indistinguishable" in text alone; it must be indistinguishable in *text + timing profile*.
  *   **Consequence:** Your models will fail harder. You would need to engineer artificial "thinking delays" and "typing bursts" into the model to pass. This aligns closer to Turing's original suggestion (that machines should be programmed to make mistakes and delay).

  **Option B: The Pure Semantic Protocol (Strict Dualism)**
  *   **Philosophy:** We only care if the *meaning* is human-like. Speed is irrelevant plumbing.
  *   **Protocol Change:** Aggressively normalize latency. Buffer all human output to appear instant. Force all model output to randomize between 5s–30s.
  *   **Evaluation Metric:** Can the judge distinguish the *source* of the meaning when the *physics* are identical?
  *   **Consequence:** This is a harder test of *reasoning*, but an easier test of *imitation*. It isolates the "ghost" from the "machine."

  ### Part 5: Direct Answers to Your Questions

  **1. What does the "only the words" rule actually presuppose?**
  It presupposes a **Cartesian separation of Content and Carrier**. It assumes "Mind" is encoded in the semantic selection, and "Body" is encoded in the transmission timing. It rules out Embodied Cognition theories (which argue timing/motor function is part of the mind) and Pragmatic Linguistics (which argues timing is part of the meaning).
  *(Confidence: High)*

  **2. Is the practice consistent with itself given the latency leak?**
  No. It claims to test Content but measures Carrier. The 90% accuracy via latency proves the test is currently measuring "Computational Speed vs. Human Motor Speed," not "Model Intelligence vs. Human Intelligence."
  *(Confidence: High)*

  **3. Is a response-time cue just more behavior?**
  Yes. By excluding it, you are explicitly rejecting Behaviorism. You are saying, "Some behaviors count as evidence of mind, others are just noise." That is a theoretical commitment, not just hygiene.
  *(Confidence: High)*

  **4. If we swapped in a view where the channel doesn't have to be shielded, what would the protocol look like?**
  You would stop calling it a "Turing Test" (which implies imitation of a human) and call it a "Discrimination Task." You would explicitly instruct judges: "Use all available cues, including speed." You would then accept that the model fails not because it isn't smart, but because it isn't *embodied*.
  *(Confidence: Medium — this is extrapolating on experimental design)*

  ### Part 6: The "Confused Premise" Check

  You asked me to tell you straight if you're confused.
  **You are not confused.** The ESP analogy is structurally sound. Turing wanted to prevent the judge from knowing the answer via *non-game* channels (telepathy). You are observing the judge knowing the answer via *non-content* channels (latency). Both violate the "Informational Encapsulation" required for the test to measure what it claims to measure.

  **One nuance where I am less confident:**
  Turing's ESP concern was about *cheating* (bypassing the test). Your latency issue is about *signal* (the test capturing a real difference).
  *   If the goal is "Can the model think like a human?" -> Latency is noise (Turing/ESP view).
  *   If the goal is "Can the model pass as human in a chat?" -> Latency is signal (Functionalist view).

  Your company's awkwardness comes from wanting the second goal (pass as human) while using the protocol for the first goal (think like human).

  ### Summary Recommendation

  Your internal doc claims **Semantic Dualism** ("only the words").
  Your actual pipeline implements **Naive Realism** ("whatever shows up on the screen is fair game").

  If you want philosophical consistency:
  1.  **Acknowledge the leak.** Admit the test measures "Text + Timing."
  2.  **Choose your construct.**
      *   If you want to test *Reasoning*: Buffer the humans, delay the models. Enforce the Dualism.
      *   If you want to test *Imitation*: Keep the latency, but stop claiming you're shielding the judge. Update the doc to say "Judges may use all visible UI cues."

  The current state is scientifically invalid because the stated hypothesis (distinguish by words) does not match the experimental setup (distinguish by words + time).

  *(Confidence in summary: High)*
