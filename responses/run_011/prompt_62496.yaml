answer: |-
  The utility monster argument functions as a stress test for aggregative moral theories, specifically targeting the mechanics of how individual well-being is summed to determine collective obligation. To understand its load-bearing structure, one must distinguish between the conditions that allow the monster to exist and the conditions that allow it to consume everything. The argument relies on two distinct technical assumptions: interpersonal comparability of utility and the unboundedness of marginal utility. Interpersonal comparability is the gateway; without the ability to measure and compare the intensity of satisfaction across different individuals, there is no metric to justify transferring resources from others to the monster. However, comparability alone does not guarantee total absorption. If every utility function is bounded above—meaning there is a maximum cap on how much satisfaction any being can experience—the monster's appetite is logically limited. Once the monster reaches its saturation point, additional resources yield zero marginal utility for it, while still yielding positive utility for others. In this bounded scenario, utilitarianism would redistribute resources to the monster only up to its threshold, after which distribution would revert to satisfying others. Therefore, comparability enables the initial redistribution, but unboundedness is the premise doing the real damage in the standard formulation, driving the conclusion that the monster should receive everything indefinitely. If utility is bounded, the argument loses its force regarding total absorption, transforming from a demand for absolute sacrifice into a demand for prioritized satisfaction up to a limit.

  This leads to the question of why the aggregation seems acceptable within a single life but unacceptable across lives. Consider a diachronic version where one person experiences a period of intense capacity for satisfaction followed by a period of dull capacity. A utilitarian calculation would suggest sacrificing the later period for the earlier one to maximize total lifetime utility. Most people find this intra-personal trade-off rational; we routinely accept sacrifices now for greater gains later, or acknowledge that some periods of life are worth more than others. If aggregation across time within a person is permissible, the objection to the monster cannot be about aggregation itself. The difference lies in the boundaries of the entities being aggregated. Persons are distinct entities with separate lives, whereas temporal stages of a person are parts of a single whole. The monster argument is best read as an instance of the separateness-of-persons objection. It highlights that utilitarianism treats the society as a super-person, willing to dissolve the boundaries between individuals to maximize the sum. The argument bites against any theorist who accepts aggregation across persons without weighting for distribution or entitlements. It forces the admission that if persons are separate, the loss to one cannot be simply cancelled out by the gain to another, regardless of the net sum.

  When distinguishing the monster from neighbouring puzzles like the repugnant conclusion or Pascal's mugging, we see a family resemblance based on unbounded linear aggregation, but distinct structural drivers. The repugnant conclusion arises from population size: a vast number of lives with barely positive welfare outweighs a smaller number of excellent lives. Pascal's mugging arises from probability weighting: a tiny probability of an astronomically large payoff outweighs a certainty of a modest gain. The utility monster involves neither population expansion nor probabilistic uncertainty. It operates with a fixed population and certain outcomes. The common core is the lack of a constraint on the summation function. In all three cases, the theory permits a variable (numbers, probability, or intensity) to grow large enough to dominate intuition. However, the monster is unique in focusing on intensity disparity among existing agents rather than the addition of new agents or the manipulation of risk. There is no single formal feature identical across all three, but they share the structural vulnerability of allowing one dimension of value to scale without limit against others.

  Regarding the overlap with diminishing marginal utility, standard utilitarian arguments for redistribution rely on the assumption that the poor gain more utility from a resource than the rich lose. The monster scenario is the sign-flipped version: one agent gains so much more that equality becomes inefficient. If utilitarianism already supports redistribution via diminishing marginal utility, does the monster add anything? Yes. The standard case argues for equality as a contingent means to maximize utility. The monster shows that utilitarianism is not committed to equality per se; if capacity differs, radical inequality is required. Subtracting the overlap, the monster's distinctive content is the violation of entitlements and the lack of side-constraints. The diminishing marginal utility case respects the idea that everyone counts for one; the monster case suggests that some count for more because of their capacity. The argument establishes that without independent constraints on rights or entitlements, the utilitarian calculus can justify treating individuals as mere vessels for utility production, regardless of fairness.

  Finally, consider the retreat from interpersonal comparability. If a utilitarian denies that we can compare utility across persons, the monster cannot be constructed because we cannot say the monster gains more than others lose. However, this retreat is unstable. Denying comparability also disables ordinary distributional recommendations, such as taxing the rich to help the poor, because those policies also rely on comparing losses and gains across persons. To save the theory from the monster by denying comparability is to render it practically inert for social justice. It amounts to abandoning the theory's action-guiding content in the political sphere to save it from a counterexample. The theory survives logically but ceases to function as a guide for distribution. Thus, the retreat is not a stable position for a utilitarian who wishes to maintain normative guidance on resource allocation; it saves the theory from absurdity only by stripping it of utility.

