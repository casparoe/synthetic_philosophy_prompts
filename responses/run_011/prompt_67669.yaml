answer: |-
  ### Part 1: Critical Pressure-Test of the Core Idea

  Before drafting the proposal, I need to scrutinize the tripartite distinction, specifically the claim about the **Metric**.

  **1. Threshold vs. Scalar:**
  This distinction is robust. The "Threshold" question asks about moral *standing* (do you count?), while the "Scalar" question asks about moral *weight* (how much do you count?). Confusing these leads to category errors. For instance, a sentience-first view might set a low threshold (any nociception grants standing) but remain agnostic on scalar weight. A cognitive-capacity view might tie standing to higher-order cognition (high threshold) and weight to complexity (scalar). Keeping these separate clarifies that one could accept a creature has standing (Threshold) while denying its interests outweigh a human's in a conflict (Scalar), or vice versa. This part of the framing survives contact with standard positions.

  **2. The Metric Claim (The Vulnerable Point):**
  Your suspicion is that choosing between absolute brain mass, encephalization quotient (EQ), or neuron count is a normative act disguised as empirical measurement.
  *   *The Counter-Argument:* A neuroanatomist might object that this is false. If moral status tracks *cognitive capacity*, and cognitive capacity tracks *absolute number of cortical neurons* (as recent isotropic fractionation work suggests), then absolute mass (adjusted for neuronal density) is the only biologically valid metric. EQ is actually the outdated, biased metric because it assumes brain size scales linearly with body size across taxa, which it doesn't. If biology dictates that absolute neuron count is the only predictor of processing power, isn't the metric choice forced?
  *   *The Rebuttal:* The choice is only "forced" if we agree that *processing power* is the morally relevant trait. If the morally relevant trait is *subjective intensity of experience*, metabolic rate or neural connectivity density might be better proxies than raw neuron count. If the trait is *behavioral flexibility*, we might need a different measure entirely. Furthermore, EQ explicitly uses a "standard mammal" baseline, often derived from human-centric data. Choosing *which* biological correlate maps to *which* moral property is not a biological question; it is a philosophical one. Therefore, the claim holds: selecting the metric presupposes a theory of value.

  **3. Feasibility:**
  Nine months is short for a postdoc, but sufficient for conceptual analysis. It is not enough for new empirical work. The proposal must frame this as a "conceptual clarification" project that informs future empirical collaboration, rather than a data-generation project.

  **Verdict:** The framing survives. The Metric argument is the novel contribution, provided you acknowledge that biology constrains the options but does not select the winner.

  ***

  ### Part 2: Fellowship Proposal

  **Project Title:** The Metric of Moral Status: Disentangling Threshold, Scalar, and Measurement in Animal Ethics

  **Project Summary**
  Contemporary debates regarding animal moral status frequently stall over the relevance of brain size. Proponents argue larger brains indicate greater cognitive capacity; opponents argue this is speciesist benchmarking. This project argues that the debate is currently intractable because it conflates three distinct questions: the **Threshold** (does brain size determine moral standing?), the **Scalar** (does brain size determine the weight of interests?), and the **Metric** (which measure of "brain size" is morally relevant?). By isolating the Metric question, this project demonstrates that the choice between absolute mass, relative mass, and neuronal count is not a neutral empirical decision but a normative commitment that predetermines which species fall above or below the human baseline. Over nine months, I will develop a framework that allows ethicists and neuroscientists to identify where their disagreements lie, moving the field from circular benchmarking to precise moral neuroanatomy.

  **Statement of the Problem**
  The literature currently treats "brain size" as a univocal variable. This creates three specific points of failure. First, regarding the **Threshold**, many sentience-first accounts reject brain size as a criterion for standing, yet implicitly rely on it when discussing uncertainty in borderline cases (e.g., insects vs. crustaceans). Second, regarding the **Scalar**, cognitive-capacity accounts argue that richer brains warrant greater moral weight, but fail to explain why complexity should amplify the *weight* of suffering rather than just the *types* of suffering possible.

  Third, and most critically, is the **Metric** problem. "Brain size" is ambiguous. Absolute mass favors large mammals (elephants, whales); mass relative to body size (Encephalization Quotient) favors small mammals and birds; mass relative to taxonomic expectations favors primates. Current discourse treats the selection of a metric as an empirical matter to be settled by neuroscience. I argue this is a category error. Biology can tell us which metric predicts tool use, but it cannot tell us which metric predicts *moral value*. When researchers select a metric that keeps humans at the apex, they are not measuring nature; they are encoding a normative hierarchy into the measurement tool itself. Until this is acknowledged, empirical data will only reinforce existing biases.

  **Engagement with Leading Positions**
  This project intervenes in three dominant frameworks:
  1.  **Sentience-First Accounts:** These typically focus on the Threshold, asserting that the capacity to feel is sufficient for full moral standing. However, they often lack the granularity to address Scalar questions. This project will show how Metric choices implicitly reintroduce Scalar hierarchies even within sentience-first frameworks (e.g., by prioritizing neural structures associated with "higher" pain processing).
  2.  **Cognitive-Capacity Accounts:** These rely heavily on brain metrics to justify differential treatment. By exposing the normative loading of the Metric choice, this project challenges the neutrality of these accounts without rejecting the possibility that cognition matters.
  3.  **Anti-Speciesist Objections:** Critics often argue that benchmarking against humans is circular. This project advances that critique by showing *how* the circularity operates technically through metric selection, offering a constructive alternative rather than a mere negation.

  **Methodology and Work Plan**
  The methodology is conceptual analysis informed by comparative neuroanatomy. The alternative approach would be to wait for conclusive empirical data on the neural correlates of consciousness. I reject this for two reasons. First, data does not interpret itself; without a philosophical framework, new data on neuron density will simply be weaponized by opposing sides using different metrics. Second, the "Metric" question is not empirical; no amount of scanning can tell us if absolute mass or relative mass is *morally* superior. We must resolve the conceptual framework to know what data to collect.

  *   **Months 1–3: Mapping the Concealment.** I will survey the literature in animal ethics and comparative neuroanatomy to catalog instances where Metric choices are presented as empirical but function normatively. I will create a taxonomy of how absolute mass, EQ, and neuronal counts are currently deployed in ethical arguments.
  *   **Months 4–6: Case Studies in Metric Conflict.** I will apply the taxonomy to specific controversial cases where metrics diverge. For example: Corvids have high neuronal density but small absolute mass; Elephants have high absolute mass but lower cortical density than primates. I will draft analyses showing how different metric choices flip the moral ranking of these species, proving the normative loading.
  *   **Months 7–9: Synthesis and Dissemination.** I will finalize a manuscript for publication outlining the Threshold/Scalar/Metric distinction. I will also prepare a workshop proposal to bring together ethicists and neuroanatomists to test the framework.

  **Success and Failure Conditions**
  **Success** is defined as the production of a robust conceptual framework that is adopted by at least two distinct research groups (one in philosophy, one in science) to clarify their own models. A successful result demonstrates that disagreements previously attributed to empirical uncertainty are actually disagreements over metric selection.
  **Failure** would occur if it is demonstrated that one metric (e.g., absolute cortical neuron count) is universally accepted by neuroscientists as the sole correlate of all morally relevant capacities, rendering the choice empirical rather than normative. While unlikely given current pluralism in neuroscience, if this consensus emerges during the fellowship, the project will pivot to analyzing why that specific biological trait was granted moral monopoly.

  **Feasibility Assessment**
  Nine months is a realistic scope for this specific conceptual work. It is insufficient for generating new empirical data or conducting extensive cross-species behavioral trials, but those are not required. The bottleneck in this field is not a lack of brain scans, but a lack of clarity on what those scans signify morally. This project is designed to clear that conceptual bottleneck. By focusing strictly on the logical structure of the argument rather than attempting to resolve the empirical debates, the project can be completed within the fellowship term while laying the groundwork for future empirical collaboration.
