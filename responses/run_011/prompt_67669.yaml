prompt: |-
  You are an expert in the philosophy of mind and moral psychology with a working knowledge of comparative neuroanatomy, and you are helping me draft a two-page proposal for a nine-month postdoctoral fellowship in animal ethics.

  My half-formed idea is that the debate over whether brain size is morally relevant keeps three different questions tangled together, and that separating them would change what the argument is even about:

  1. **Threshold.** Is a larger brain evidence that a creature has whatever it takes to count morally at all?
  2. **Scalar.** Granting that it counts, does a larger brain make its experience more intense, richer, or more unified, so that its welfare weighs more rather than merely weighing?
  3. **Metric.** The phrase 'brain size' covers at least three distinct measures — absolute mass, mass relative to body size, and mass relative to what is typical for creatures of that kind — and they do not rank the same animals in the same order. My suspicion is that (3) is not a purely empirical matter: the choice among these measures quietly fixes which species land above or below the human baseline, and so smuggles in a normative commitment disguised as a measurement decision.

  Before you draft anything, think carefully and work through this out loud for me: does the framing actually survive contact with the positions people hold, or is one of the three questions a pseudo-question? In particular, pressure-test the claim about (3) — is there a sense in which the metric choice is forced by the biology after all, and if so what is left of the proposal?

  Then write the proposal itself. It should state the question precisely enough that it could be settled either way; explain why the leading positions — sentience-first accounts of moral status, cognitive-capacity accounts, and the anti-speciesist objection that benchmarking any neural trait against the human standard begs the question — leave it open rather than resolving it; lay out the method, including what I would actually do month by month and why that approach rather than the obvious alternative of simply waiting for better comparative data; describe what a successful result looks like and what would count as the project failing; and give an honest assessment of whether nine months is a realistic scope. Please do not include a bibliography or any citations — I will add those myself.
