      *   So the weak link is definitely C > A. The Board voted C > A likely because 60 million is a staggering number that triggers a "scale" heuristic. I need to argue that heuristic fails here.

      *   *Okay, ready to write.*

  **(Self-Correction during drafting the essay):** I need to make sure I don't sound like I'm just doing QALYs. The Analyst did QALYs. I need to argue from a moral philosophy perspective that *justifies* the transitivity, not just the math. The math supports B > C > A. The Board supports A > B > C > A. I am supporting A > B > C. This means I agree with the Board on A > B, agree with the Board on B > C, but disagree with the Board on C > A (aligning with the Analyst on C > A, but for different reasons). Wait, Analyst says C > A. I say A > C. So I disagree with the Analyst on that pair too.
