      *   *This seems robust.* It creates a "Lexicographic Prioritarianism."

  4.  **Drafting - Section by Section:**
      *   **Introduction:** Set the scene. The $400m pot. The three programs. The cycle. The governance trap.
      *   **The Nature of the Cycle:** Explain why the board voted this way. It's not confusion; it's moral pluralism. A > B (Rescue Principle). B > C (Significance Principle). C > A (Aggregation Principle).
      *   **The Churning Argument:** Address the Strategy Lead's fear. Is churn the enemy? Yes, for scientific funding. You can't fund a 10-year cure on a 1-year horizon. Acyclicity is pragmatically necessary.
      *   **The Verdict:** We must break the cycle. We cannot accept intransitivity if the rule demands a single choice.
      *   **Which Link to Break:** C > A.
      *   **The Defense:** The "Aggregation of Trivialities" problem. 60 million people $\times$ 3 days is not morally equivalent to 2,000 people $\times$ 40 years. There is a threshold of severity. Below that threshold, numbers don't stack up to override catastrophic individual suffering.
      *   **Owning the Ugly:** Acknowledge that this means ignoring the 60 million. Defend it. The "horrible but resolving" illness is noise compared to the signal of severe disability.
      *   **Conclusion:** The foundation should fund A. Not because the math says so (it says B), but because the moral topology demands we prioritize the deepest hole.

  5.  **Refining the Argument (Self-Correction during drafting):**
