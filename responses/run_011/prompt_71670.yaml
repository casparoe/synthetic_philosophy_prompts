  1. **Mark and Justification**
  **68 (Upper Second Class)**
  This essay demonstrates First-class clarity and textual integration, particularly in linking *Modern Moral Philosophy* to the pamphlet, but it is held back from the 70+ band by a logical contradiction in paragraph three that undermines the core ethical argument. It sits comfortably above the lower Upper Second band because the exegesis of intention and the doctrine of double effect is precise and sophisticated, despite the central philosophical slip.

  2. **Claim-by-Claim Assessment**

  *   **Paragraph 1 (Question a):**
      *   *Claim:* Anscombe's objection is that the bombings were murder, meaning the word strictly. **Correct.**
      *   *Claim:* English moral philosophy lost the resources for saying anything is simply forbidden (reference to *Modern Moral Philosophy*). **Correct.**
      *   *Claim:* The decisive premise is that one may never choose to kill innocent people as a means. **Correct.**
      *   *Claim:* The inhabitants were innocent because they were not fighting or supplying means. **Correct.**
      *   *Claim:* Their deaths were the mechanism of surrender, not incidental. **Correct.**

  *   **Paragraph 2 (Question a):**
      *   *Claim:* Ordering a killing counts as killing; intention is not an inner event. **Correct.**
      *   *Claim:* Permissibility lies in role (combatant vs. non-combatant) rather than immediate threat. **Correct.**
      *   *Claim:* The doctrine of double effect distinguishes foreseen effects from intended means. **Correct.**
      *   *Claim:* The demand for unconditional surrender forms part of the wrongdoing. **Correct.**

  *   **Paragraph 3 (Question b):**
      *   *Claim:* Anscombe disputes the arithmetic of casualty figures. **Correct.**
      *   *Claim:* Anscombe denies the authority of the calculation even if numbers were as claimed. **Correct.**
      *   *Claim:* The second move (denying authority) is doing less work in the pamphlet than its prominence suggests. **Overstated.** (This minimizes her deontological stance.)
      *   *Claim:* Had the calculation been certain, the decision would have been a tragic necessity rather than a crime. **Wrong.** (Anscombe holds that murdering the innocent is intrinsically wrong regardless of certainty or necessity; it remains a crime.)
      *   *Claim:* The objection would have been that the tragedy was avoidable, not that it was murder. **Wrong.** (For Anscombe, if innocent people are killed as a means, it is murder by definition, avoidable or not.)

  *   **Paragraph 4 (Question c):**
      *   *Claim:* Anscombe is committed to pacifism and does not resist the commitment. **Correct.**
      *   *Claim:* No modern war can be conducted without killing the innocent as a means. **Correct** (as her premise).
      *   *Claim:* She reads the prohibition as leaving no room whatever for statecraft. **Overstated.** (She leaves room for statecraft that does not involve murder, though she argues this is practically impossible in modern war.)
      *   *Claim:* The target is as much Oxford as Truman. **Correct.**

  3. **Exegetical vs. Structural Faults**

  *   **Exegetical Fault:** In paragraph three, you claim that Anscombe would concede the act was "tragic necessity rather than a crime" had the utilitarian calculation been certain. This misreports her position. Anscombe's argument is deontological, not consequentialist; she argues that certain actions are forbidden *in themselves*, regardless of the certainty of their outcomes.
      *   *Correction:* Anscombe maintains that even if the bomb certainly saved lives, the act remains murder because the moral prohibition is absolute, not contingent on the reliability of the calculation.

  *   **Structural Fault:** The claim in paragraph three ("Had the calculation been certain... the decision would have been a tragic necessity rather than a crime") contradicts the premise established in paragraph one ("one may never choose to kill innocent people as a means").
      *   *Explanation:* The word "never" in paragraph one excludes exceptions based on outcome certainty. By suggesting in paragraph three that certainty changes the moral category from "crime" to "necessity," you negate the absolutism you correctly identified earlier. The contradiction survives because the second claim introduces a condition (certainty of outcome) that the first claim explicitly rules out as irrelevant.

  4. **Grader Blind Spots**
  A grader reading forty scripts in an afternoon would likely let pass the stylistic fluency and the correct identification of the doctrine of double effect, as these signal competence immediately. They might also miss the contradiction in paragraph three because the sentence denying the authority of the calculation ("even if the numbers were as claimed...") appears correct on a quick read. What should have stopped them is the subsequent sentence that walks this back ("Had the calculation been certain..."). A rigorous marker must notice that the student grants the absolutist principle only to revoke it in the hypothetical application, which collapses the ethical argument.

  5. **Strengths to Credit**
  You successfully integrate two distinct texts (*Modern Moral Philosophy* and the pamphlet) to reconstruct a coherent vocabulary of prohibition, which is the hardest part of this question. Your explanation of intention—that it is not an inner event detachable from what the agent set out to bring about—is precise and demonstrates a strong grasp of Anscombe's action theory. To build on this: continue to anchor your interpretive claims in specific philosophical terminology (e.g., "means," "ends," "foreseen"), as you have done here, because this prevents vague moralizing and keeps the argument tight.

  6. **Requirements for a First-Class Answer**
  To reach the First-class band, you must resolve the contradiction in paragraph three without altering your style. You need to maintain the absolutist line consistently: state clearly that for Anscombe, no degree of certainty regarding consequences can transform an intrinsically forbidden act into a necessity. Remove the concession that the objection would shift from "murder" to "avoidable tragedy"; instead, argue that the tragedy lies precisely in the fact that the leaders chose a criminal act they believed was necessary. The claims must remain logically consistent with the premise of absolute prohibition established in your opening paragraph.
