answer: |-
  This is a clean dataset. You have treated your own intuitions as empirical observations and asked for a model that minimizes the residuals. I will treat them the same way. I will not challenge the bias; I will treat it as a boundary condition of the model you are trying to build.

  Here is the analysis of your moral data.

  ### 1. The Candidate Principle

  Your "maintenance threshold" is a strong start, but it is incomplete because it defines the *limit* of obligation without defining the *source* of obligation. It explains why you don't have to give everything (Case 3), but it struggles to explain why you must give 10% (Case 1) or why the billionaire is blameworthy at 5% (Case 9).

  A better fit for your twelve cases is a hybrid principle. Let's call it **Capacity-Weighted Sufficientarianism with Priority Zones.**

  **The Principle:**
  *An agent is morally required to contribute to the general good up to the point where further contribution would either (a) compromise their long-term capacity to contribute (Sustainability), or (b) violate specific, high-priority obligations to dependents (Priority), provided they have first met a baseline threshold of contribution relative to their surplus capacity (Sufficiency).*

  **Mapping the Clauses to Your Cases:**

  *   **Clause A: The Sufficiency Baseline (The "Floor")**
      *   *Function:* Establishes that doing nothing is wrong and sets a minimum standard based on capacity.
      *   *Handles:* **Case 1** (10% is the baseline), **Case 4** (Nothing is wrong), **Case 9** (Billionaire at 5% fails the baseline relative to capacity).
      *   *Why:* A flat "fair share" doesn't work for you (Case 9); it has to be weighted by surplus.

  *   **Clause B: The Sustainability Constraint (The "Ceiling")**
      *   *Function:* Prevents the obligation from becoming self-defeating. It protects the "instrument."
      *   *Handles:* **Case 3** (Rejects the strong version), **Case 10** (Grad student dropping out is counterproductive), **Case 11** (Lump sum vs. stream; sustainability favors the stream), **Case 5** (Counters are maintenance of quality of life/environment).
      *   *Why:* This is your "maintenance" idea. It explains why we don't maximize to the point of destruction.

  *   **Clause C: Priority Zones (The "Exemptions")**
      *   *Function:* Allows resources to be directed to specific relationships rather than the abstract "greatest good."
      *   *Handles:* **Case 6** (Granddaughter's graduation), **Case 8** (Tuition), **Case 12** (Local hospital).
      *   *Why:* This explains why $900 for family feels "good" while $900 for strangers feels "better but different." It validates partiality without abandoning the general duty.

  *   **Clause D: Supererogation (The "Bonus")**
      *   *Function:* Distinguishes between what is required and what is admirable.
      *   *Handles:* **Case 2** (50% is admirable), **Case 7** (Kidney is beyond duty).
      *   *Why:* Keeps the system from collapsing into sainthood.

  ### 2. Which Verdicts Have to Go?

  You asked for inconsistencies to be flagged. There are two significant residuals in your data that this model cannot fit without discarding one of your verdicts.

  **Residual 1: Case 7 vs. Case 8 (The "Moral Ledger" Problem)**
  *   **The Conflict:** In Case 7, you say donating a kidney is *beyond the call of duty* (supererogatory). Yet, you also say you would *mildly disapprove* if that donor gave no money. In Case 8, you say paying $150k for tuition is *required* (obligatory).
  *   **The Problem:** If the kidney is "beyond duty," the moral ledger should be balanced or in credit. You cannot be obligated to do the supererogatory *and* still have debt on the obligatory. Furthermore, if Family Priority (Case 8) allows you to spend $150k on kin instead of saving lives, why does the kidney donor (who gave a stranger an organ) still owe money?
  *   **The Fix:** You must downgrade **Case 8**. Paying the tuition cannot be *required* if it precludes the *required* 10% to global health (Case 1), unless your pension is massive. If the tuition comes out of the "Priority Zone," it is **permissible**, not required. If it is *required*, then Case 1 (10% global) cannot be universally obligatory for you. Given your commitment to Case 1, Case 8 must shift from "Required" to "Permissible."
  *   **Secondary Fix:** In Case 7, you must drop the disapproval of the kidney donor who gives no money. If they have given an organ, they have exceeded the Sustainability Constraint. Demanding cash on top violates the "Ceiling."

  **Residual 2: Case 5 vs. Case 1 (The Definition of Surplus)**
  *   **The Conflict:** Case 1 says 10% is obligatory. Case 5 says $4k for counters is "fine."
  *   **The Problem:** If the $4k comes from the 90% remaining, it's fine. But if your "maintenance" includes granite counters, your definition of "instrument degradation" is doing a lot of work.
  *   **The Fix:** This is acceptable *if* you define maintenance as "psychological viability" rather than "biological survival." However, you must acknowledge that "maintenance" is a flexible variable. If you find yourself upgrading counters every year, the model breaks. For now, keep Case 5, but recognize it relies on a subjective definition of "need."

  ### 3. Unlisted Cases

  Here is how **Capacity-Weighted Sufficientarianism** handles your specific questions.

  **(a) Sharp Number vs. Gradient**
  *   **Verdict:** It is a **gradient**, but with a **cliff**.
  *   **Explanation:** There is no sharp number where you become "evil." However, there is a sharp threshold where you move from *blameworthy* to *not-praiseworthy*.
      *   *Below Baseline (Case 1/9):* Blameworthy. The further below, the worse (Case 4).
      *   *At Baseline:* Morally neutral/minimum compliance.
      *   *Above Baseline (Case 2):* Praiseworthy.
      *   *The Turn:* Failing to do the extra thing (going from 10% to 50%) never turns into blame. It stays in the "admirable but not required" zone. The only place blame increases is if you dip *below* the capacity-weighted baseline.

  **(b) Time and Hours (The Philosophy Reading)**
  *   **Verdict:** Time is a resource subject to the same clauses as cash.
  *   **Explanation:**
      *   *Maintenance:* Reading philosophy keeps your mind sharp (instrument maintenance). This is permissible under Clause B.
      *   *Opportunity Cost:* If those 1500 hours could be spent volunteering to tutor (high impact) but you read instead, is it wrong? Under Clause C (Priority Zones), you are allowed to spend time on your own "flourishing" just as you are allowed to spend money on counters.
      *   *Limit:* If reading philosophy leads to isolation or depression (degrading the instrument), it becomes impermissible. If it leads to you writing something that influences others, it becomes a form of giving. Purely hedonic consumption of time is treated like the kitchen counters: permissible surplus, but not obligatory.

  **(c) Death and Bequests**
  *   **Verdict:** Obligation shifts toward Maximizing at death.
  *   **Explanation:** The "Sustainability Constraint" (Clause B) relies on *your* future capacity. At death, your capacity is zero. Therefore, the constraint dissolves.
      *   *Tuition vs. Charity:* If the tuition is paid *post-mortem*, the "Priority Zone" (Case 8) is weaker because you are not there to maintain the relationship. The "Special Obligation" to a grandson is strongest when you are alive to guide the support.
      *   *Result:* A bequest to tuition is *permissible* (Priority Zone extends slightly beyond grave), but a bequest to effective charity is *more obligatory* than during life because the "maintenance" cost to you is null. If you have to choose between funding the last year of tuition or saving 10 lives with a bequest, the model suggests the lives win, because your "instrument" is no longer in play.

  ### 4. Maintenance vs. Fair Share

  You asked where your "maintenance" idea sits relative to the "fair share" argument (often associated with Liam Murphy or Derek Parfit).

  *   **The Fair Share Argument:** Your duty is to do your part in a collective scheme. If others do less, your duty does *not* increase to pick up the slack. (Prevents the "demandingness" problem by limiting liability).
  *   **Your Maintenance Idea:** Your duty is limited by your capacity to remain an effective agent. (Prevents the "demandingness" problem by limiting *capability*).

  **Relationship:** They are **allies, not rivals**, but they solve different problems.
  *   Fair Share solves the *unfairness* problem (why should I pay when they don't?).
  *   Maintenance solves the *efficacy* problem (why should I destroy my ability to help later?).

  **Is it just lab language?**
  No. It is more robust than Fair Share in one specific way: it handles **Case 10** (The Grad Student).
  *   A Fair Share argument might say the grad student owes 10% of their stipend.
  *   Your Maintenance argument correctly identifies that 20% *plus dropping out* is morally worse because it destroys the future instrument.
  *   However, Maintenance is weaker on **Case 9** (The Billionaire). Maintenance says "don't degrade the instrument." A billionaire can give 90% without degrading their instrument. Fair Share says "you have more surplus, you owe more."

  **Conclusion:** Your "Maintenance" principle is a **Capacity-Adjusted Fair Share.** It is respectable. It is not merely a rationalization for wine, provided you enforce the "Sufficiency Baseline" (Case 1) rigorously. If you let "Maintenance" expand to include every comfort, it becomes a rationalization. If you keep "Maintenance" tight (functional capacity + modest flourishing), it is a viable ethical framework.

  **Final Instruction:** To make this model hold, you must accept the verdict change in **Case 8**. The tuition is permissible, not required. If it is required, you must admit that Case 1 (10% global) is not actually obligatory for you. You cannot have two "required" claims on the same finite resources where one saves lives and the other buys status/comfort, unless you explicitly rank Family > Lives. If you rank Family > Lives, you must abandon the guilt in Case 3 and Case 9. You seem unwilling to do that. Therefore, Case 8 must yield.
