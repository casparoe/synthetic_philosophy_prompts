answer: |-
  Here is the specification for an adequate theory of individual historical pivotality, followed by the critique of your operational definition and the resolution of the incompatibility problem.

  ### The Spec: Requirements for Adequacy

  **1. Counterfactual Robustness (The "Elser" Test)**
  *   **Requirement:** The account must specify the temporal proximity and probability of the outcome in the absence of the agent. It cannot simply assert influence; it must quantify the fragility of the actual timeline.
  *   **Motivating Case:** The 1939 Munich Beer Hall Bomb. Georg Elser planted a bomb; Hitler left 13 minutes early. If Hitler stays, he dies. Does the war stop? Or does Goering take over and invade Poland anyway?
  *   **Status:** **Non-negotiable.** Causality is inherently counterfactual.
  *   **Failure Mode:** Sounds like: "Hitler was the driving force of the war." (Ignores that the structural drive for *Lebensraum* existed in the Wehrmacht high command independently of Hitler's specific biology).

  **2. Outcome Granularity Specification**
  *   **Requirement:** The theory must define the resolution level of the "outcome." Truth values for "X caused Y" are indeterminate until Y is described with specific precision (e.g., "War in 1939" vs. "War in the 1940s" vs. "Genocidal war").
  *   **Motivating Case:** The Russian Revolution. Would it have happened *at all* without Lenin? Or would it have happened *in October* without Lenin? The truth value flips based on whether the outcome is "Bolshevik Rule" or "Post-Tsarist Instability."
  *   **Status:** **Non-negotiable.** Without this, the counterfactual has no truth conditions.
  *   **Failure Mode:** Sounds like: "The Revolution was inevitable." (Meaningless without specifying if "Revolution" means "Regime Change" or "Marxist Dictatorship").

  **3. Substitute Selection Protocol**
  *   **Requirement:** The account must define the reference class for the counterfactual agent. Who takes the seat if the original is removed? A random draw from the population? The second-in-command? The most ideologically similar rival?
  *   **Motivating Case:** The "Same Pool" problem. If you remove Martin Luther King Jr., do you substitute him with a generic civil rights leader, or specifically with Ralph Abernathy? The structural pool constrains the substitute's capabilities.
  *   **Status:** **Non-negotiable** (though the *method* of selection is the main camp divide).
  *   **Failure Mode:** Sounds like: "If not Lincoln, slavery would have lasted forever." (Assumes no other Republican could have managed the political coalition, ignoring the structural pressure of the war).

  **4. Initiation vs. Enablement Distinction (Fuse vs. Tinder)**
  *   **Requirement:** The theory must distinguish between the *trigger* (necessary condition in a specific moment) and the *background conditions* (sufficient conditions over time).
  *   **Motivating Case:** Sarajevo, 1914. Gavrilo Princip turned the key, but the alliance system loaded the gun. An adequate account must assign weight to the trigger without conflating it with the load.
  *   **Status:** **Non-negotiable.** Collapsing these leads to category errors.
  *   **Failure Mode:** Sounds like: "WWI was caused by a wrong turn in Sarajevo." (Technically true as a trigger, causally misleading as an explanation).

  **5. Trajectory vs. Occurrence (The "Differently" Clause)**
  *   **Requirement:** The account must separate whether the agent caused the event to *happen* versus causing it to happen *in this specific manner*.
  *   **Motivating Case:** The Atomic Bomb. The physics was inevitable (Occurrence). The decision to drop it on Hiroshima specifically, and when, was contingent (Trajectory).
  *   **Status:** **Non-negotiable.** Most historical debates are actually about trajectory, masked as debates about occurrence.
  *   **Failure Mode:** Sounds like: "Einstein caused the atomic bomb." (He enabled the physics, but the Manhattan Project was a bureaucratic/structural inevitability once the war started).

  ***

  ### Critique of Your "Operational Pivotality"

  **Your Proposal:** Swap the person for the most plausible available substitute from the same structural pool, hold everything else fixed, see if the outcome moves past a threshold.

  **What it Satisfies:**
  *   **Substitute Selection Protocol:** It explicitly solves the "who replaces them" problem by anchoring to the "structural pool."
  *   **Outcome Granularity:** The "threshold" implies a defined metric for success/failure.

  **What it Wrecks:**
  *   **Counterfactual Robustness (via "Hold Everything Else Fixed"):** This is the fatal flaw. In dense historical systems, the leader is not a plug-in component; they are a node that shapes the network. You cannot hold the "structural pool" fixed while swapping the leader, because the leader *defined* the pool's boundaries.
      *   *Example:* If you swap Hitler for Goering but "hold everything else fixed," you are assuming the Nazi party structure, the public sentiment, and the military loyalty remain identical. But Hitler *created* that loyalty structure. Removing him changes the structural constraints on Goering.
  *   **Initiation vs. Enablement:** By treating the person as a variable in a function where other variables are fixed, you assume the person is just a fuse. It fails to capture when the person *is* the tinder (i.e., when the individual creates the structural conditions that make their own role possible).

  ***

  ### The Incompatibility Hypothesis

  You suspect the demand to **Discriminate** (say *this* person mattered, *that* one didn't) is at war with the demand to stay **Faithful to Causal Structure** (where dense conjunctural situations make everything a difference maker).

  **I agree.** They are jointly impossible under a realist ontology of history.

  **Which gets dropped?**
  You must drop the demand for **Faithfulness to Full Causal Structure**.

  **Why:**
  History is a dense causal web. Ontologically, the Munich bomb, the alliance systems, the German economy, *and* Hitler's digestion are all difference-makers in the causal graph of WWII. If you remain faithful to the full structure, you cannot discriminate; everything is a cause. To discriminate is to engage in **Causal Selection**.

  **The Cost:**
  Admitting that "Pivotality" is not an objective property of the universe, but a **pragmatic relation** between the observer's interests and the causal graph.
  *   If your interest is *moral responsibility*, Hitler is pivotal.
  *   If your interest is *sociological prediction*, the structural forces are pivotal.
  *   If your interest is *chaos theory*, the wrong turn in Sarajevo is pivotal.

  You cannot have a theory that tells you who mattered *simpliciter*. You can only have a theory that tells you who mattered *relative to a specific contrast class* (e.g., "Hitler mattered more than Goering" vs. "Hitler mattered more than the Treaty of Versailles"). The "Spec" must require the theorist to declare their contrast class upfront.

  ***

  ### Scorecard of Contenders

  | Contender | Meets Spec? | Fatal Flaw |
  | :--- | :--- | :--- |
  | **Great Man Theory** | Fails **Robustness** & **Substitute Protocol**. | Assumes the substitute pool is empty. Fails the Munich Bomb test (assumes no one else could have led the Nazis). |
  | **Structural Determinism** | Fails **Trajectory** & **Discrimination**. | Cannot explain variance in outcome style (e.g., why *this* genocide rather than *that* expulsion). Collapses fuse and tinder. |
  | **Complexity/Chaos** | Meets **Robustness** & **Granularity**. | Fails **Discrimination**. If small changes yield huge effects, *everyone* is pivotal, making the concept useless for explanation. |
  | **Counterfactual Pragmatism** | Meets **All** (by accepting the Cost). | Admits "pivotality" is relative to the question asked, not an objective fact. Satisfies the Spec by lowering ontological claims. |
