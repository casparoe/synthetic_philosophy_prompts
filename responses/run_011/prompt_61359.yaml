answer: |-
  **Postmortem: Payment Service Rounding Discrepancy (INC-492)**
  **Date:** 2023-12-01
  **Authors:** J. Miller, S. Chen
  **Status:** Closed

  **Summary**
  On 2023-10-14, a divergence was observed in the `calculate_total` endpoint of the Payments API. The specification states the total SHALL be the sum of line items, rounded to the nearest cent. For an input sum of $125.005, the Reference Implementation returned $125.00. A partner SDK returned $125.01. Both parties claimed conformance. The discrepancy was resolved via Working Group Vote 23-B.

  **Impact**
  One customer cart processing delay. Six weeks of engineering time consumed by specification governance. No financial loss incurred. Trust in the conformance suite degraded among three integration partners.

  **Timeline (UTC)**
  *   **2023-10-14 09:00:** Incident detected during partner integration testing.
  *   **2023-10-20 14:00:** Errata 1 published to clarify "nearest".
  *   **2023-11-05 10:00:** Errata 2 published to clarify "tie" in Errata 1.
  *   **2023-11-10 16:00:** Clarifying Note published on Errata 2 regarding "standard convention".
  *   **2023-11-28 11:00:** Working Group convenes. Vote 23-B passes 7-4.
  *   **2023-12-01 09:00:** Incident closed.

  **Root Cause**
  Initial investigation identified ambiguity in the term "nearest". Correction was attempted via Errata 1. Errata 1 introduced the term "tie". The meaning of "tie" was not self-evident and required Errata 2. Errata 2 deferred to "standard arithmetic convention". Standard arithmetic convention is not defined within the repository. Attempt to locate the convention led to the Data Dictionary, which references ISO-4217. ISO-4217 references "local jurisdiction". Local jurisdiction is determined by Merchant Profile settings. The Merchant Profile schema lacks a field for "Rounding Jurisdiction". Adding this field requires a definition of "Jurisdiction". This definition is currently pending in the Data Dictionary v4. Therefore, the root cause is the inability to specify the selection logic without further specification. We defer to the Definition of Conformity v4.1, which defers to the Working Group Charter.

  **Contributing Factors**
  Reliance on natural language specifications. Assumption that text carries intrinsic instruction independent of interpretation. Assumption that prior agreement on examples guarantees agreement on novel cases.

  **What Went Well**
  All 57 existing conformance vectors passed on both implementations prior to the incident. This confirmed alignment on the known input space. It was noted that passing all 57 vectors did not constrain behavior on inputs outside the set. The working group successfully convened to adjudicate the dispute.

  **Action Items**
  1.  **Extend Conformance Suite:** Add 15 new vectors covering edge cases. (Owner: S. Chen, Due: 2024-01-15). Note: Additional vectors will not exhaust the input space.
  2.  **Formalize Voting Process:** Document procedure for semantic disputes where text clarification fails. (Owner: Architecture Board, Due: 2024-02-01).
  3.  **Adopt Vote 23-B Outcome:** Reference Implementation behavior ($125.00) is now declared conformant. Future deviations will be treated as bugs.

  **Appendix**

  **Original Clause (Spec v2.1)**
  "The total SHALL be the sum of the line items, rounded to the nearest cent."

  **Errata 1**
  "Nearest cent implies rounding half-up on ties."

  **Dissenting Comment (Architecture Review Board)**
  "We did not identify a defect in the text during the review. The text remains identical to the version we previously rejected. The majority simply ceased to interpret it differently. This sets a precedent where conformity is a function of consensus rather than textual fidelity. Process-wise, this makes the spec redundant."
