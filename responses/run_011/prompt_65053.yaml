answer: |-
  The procedure is an "Information and Definition Audit" that classifies disagreements as either solvable (data/definition) or structural (prior/incentive), licensing you to call out factual errors but forcing neutrality on worldview gaps.

  **The Theory**
  Aumann's theorem says two rational people with the same information and starting beliefs cannot agree to disagree; it does not say real humans are rational or actually share all information. Regarding the weakened version: building on "near-common-knowledge" is the correct move, not a dodge, because journalism operates in the public sphere where arguments are known even if private beliefs are not.

  **The Procedure (The Agreement Audit)**
  *Time budget: 60 minutes. Math: Arithmetic only.*

  **Step 1: The Definition Lock (15 minutes)**
  *   **Question to Source:** "Write down the exact real-world condition that makes your number 100% true and the condition that makes it 0% true."
  *   **Sufficient Answer:** Specific metrics, dates, and populations (e.g., "CPI < 2% on Dec 31" vs. "Core PCE < 2%").
  *   **Termination:** If definitions differ, terminate as **Definitional Mismatch**. You do not have a disagreement; you have two different questions. Rewrite the piece to clarify the metrics or kill the horse race.
  *   **Editor Note:** This licenses you to say one source is answering the *wrong question*, not that their math is wrong.

  **Step 2: The Information Swap (30 minutes)**
  *   **Question to Source A:** "Source B believes [Number] primarily because of [Evidence X]. If you assume Evidence X is true, does your number move?"
  *   **Question to Source B:** (Repeat with A's evidence).
  *   **Sufficient Answer:** A number change or a specific reason why the evidence is irrelevant (e.g., "I saw that, but it's outdated").
  *   **Termination:**
      *   If the number moves significantly: Terminate as **Information Asymmetry**. The disagreement was solvable; report the convergence.
      *   If the number does not move and no flaw in evidence is cited: Terminate as **Prior Gap**. They have shared information and refuse to converge.
      *   If they claim the evidence is false without proof: Terminate as **Factual Error**. (See Commitment below).
  *   **Editor Note:** This tests the "common knowledge" condition. If they know each other's reasons and don't move, it's not an information problem.

  **Step 3: The Incentive Check (15 minutes)**
  *   **Question to Source (Private):** "Does sticking to this public number benefit your reputation, book sales, or political standing regardless of whether it comes true?"
  *   **Sufficient Answer:** Honest disclosure or denial.
  *   **Termination:** If a clear strategic benefit exists (e.g., a permabear needing volatility for book sales), terminate as **Incentive Divergence**. Report the incentive, not the forecast.
  *   **Editor Note:** This explains *why* they won't converge even if they should.

  **Step 4: The Verdict**
  *   **Real Disagreement:** Steps 1–3 clear. Both define the same thing, know each other's evidence, have no strategic stake, and still differ. Report as a genuine contest of models.
  *   **Prior Gap:** Step 2 clears, no convergence. Report as a difference in worldview (e.g., "optimist vs. pessimist"), not a contest of skill.
  *   **Definitional Mismatch:** Step 1 fails. Kill the horse race.
  *   **Incentives:** Step 3 flags. Report the conflict of interest.

  **Running the Cases**

  **(a) Inflation Forecasters (65% vs 25%)**
  *   **Step 1:** Both use official CPI target. Definitions match.
  *   **Step 2:** You email A's writeup to B. B says, "I saw that, but I weight supply chains heavier." A says same about B's demand data. Neither moves.
  *   **Step 3:** Both are independent consultants; no book sales tied to this specific call.
  *   **Verdict:** **Prior Gap.** They weigh the same evidence differently.
  *   **Report:** Do not frame as "Who is right?" Frame as "The Market is Split on Weighting." The story is about the uncertainty in the model inputs, not the forecasters.

  **(b) Epidemiologists (Trial vs. Population)**
  *   **Step 1:** Source A says "Protective immunity in trial participants." Source B says "Protective immunity in national population including elderly/comorbid."
  *   **Verdict:** **Definitional Mismatch.**
  *   **Report:** Kill the "split" narrative. Write an explainer on why trial efficacy ≠ population effectiveness. One is not wrong; they are measuring different things.

  **(c) Superforecasters (Priors All The Way Down)**
  *   **Step 1 & 2:** Definitions match. They know each other's reasoning. No movement.
  *   **Verdict:** **Prior Gap.**
  *   **Report:** The piece cannot run as pitched ("Face-off"). It becomes a piece on "Epistemic Tribes." Why do equally skilled watchers see different worlds? Focus on the underlying assumptions (e.g., trust in institutions vs. distrust) rather than the percentages. If you cannot pivot the angle, do not run it; it is clickbait masquerading as analysis.

  **Commitments**

  **1. Which escape hatch does most of the work?**
  **Definitional Mismatch.** In quant social science, 60% of "disagreements" are people using different reference classes (e.g., "recession" defined by GDP vs. employment vs. feeling). This is the easiest to fix and the most honest service to readers.

  **2. Should the procedure ever license me to print that one side is wrong?**
  **Yes, but only on inputs, never on outputs.** If Step 2 reveals Source A is using debunked data or ignoring public records that Source B cited, you can print that A is factually incorrect on the *evidence*. You cannot print that A is wrong about the *future*. This satisfies your deputy editor because it is a factual claim, not a prediction claim.

  **3. Failure Modes**
  **The Dogma Laundering:** A bad-faith source will claim a factual refusal to update is just a "strong prior."
  *   **Counter-measure:** In Step 2, require them to quantify the update. If they say "I saw that data but it doesn't move me," ask: "What data *would* move you?" If they cannot name a condition that would change their mind, it is not a prior; it is dogma. Report it as such.
  *   **The Privacy Dodge:** Sources will claim Step 2 (emailing A's number to B) violates the "common knowledge" condition because it's private, not public.
  *   **Counter-measure:** Ignore this. Journalism creates common knowledge by publishing. If they won't converge after you mediate the exchange, they won't converge in public either. The procedure holds.
