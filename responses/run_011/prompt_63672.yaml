answer: |-
  This is a sophisticated reconstruction of a Darwinian Expressivist argument (reminiscent of work by Richard Joyce, Sharon Street, or perhaps a specific synthesis from your group). It attempts to bypass metaphysics by using evolutionary etiology to dissolve semantic content.

  You are right to feel that there is a conjuring trick involved. The argument relies on equivocations between **causal explanation**, **signal reliability**, and **semantic content**.

  Here is the breakdown of where the chain breaks, how to handle the signal taxonomy, and the strategic price for a realist.

  ### 1. Where is the break in the chain?

  The break occurs decisively between **(2) and (3)**.

  *   **(2)** establishes that moral condemnation is a *reliable signal of the speaker's quality* (cooperative status, commitment).
  *   **(3)** infers that because it signals speaker quality, it is *not reporting how things stand in the world*.

  This is a **False Dilemma**. A signal can simultaneously carry information about the sender's state/quality *and* refer to an external state of affairs.

  **The Counter-Example:** Consider a vervet monkey's leopard alarm call.
  *   **Handicap:** It is costly (attracts predator attention).
  *   **Reliability:** Only monkeys who actually see a leopard can afford to signal reliably (otherwise they cry wolf and lose credibility).
  *   **Function:** It displays the signaller's vigilance and coalition membership (Step 3).
  *   **Content:** It *also* reports "There is a leopard."

  If you apply the argument's logic to the alarm call, you would have to conclude: "The job of the alarm call is displaying vigilance; therefore, the call is not in the business of being true about leopards." That is absurd. The call is selected *because* it is true about leopards. The cost ensures the *honesty* of the signal, not the *absence* of reference.

  **The Sleight of Hand:** The argument conflates **truth-conditions** with **fitness-conditions**.
  *   (1) and (2) show that moral utterances have *fitness conditions* (they must be costly to be stable).
  *   (3) illicitly infers that because they have fitness conditions, they lack *truth conditions*.
  *   A realist argues: Moral utterances have truth conditions (X is wrong), and the *cost* is what allows us to reliably signal our belief in that truth. The cost guarantees I'm not lying about the moral fact, not that the moral fact doesn't exist.

  ### 2. Does the signal type matter? (Handicap vs. Index vs. Cheap Talk)

  You noted: *"The loudest condemners are frequently the worst offenders."*

  This is a devastating empirical objection to **(2)**, but accepting it changes the battlefield in a way you might not like.

  *   **If you attack (2):** You argue condemnation is *cheap talk* or *noise*.
      *   *Pros:* It saves realism by denying the biological premise.
      *   *Cons:* It makes moral discourse look evolutionarily unstable or purely manipulative. If it's cheap talk, why do we listen? If it's noise, why does it coordinate behavior? You risk making morality look like an evolutionary spandrel with no adaptive function, which opens the door to a different kind of error theory (that morality is a useless byproduct).
  *   **If you keep (2):** You argue that *effective* condemnation is costly, even if *hypocritical* condemnation exists. (Hypocrites are often eventually caught and punished, validating the cost).
      *   *Pros:* You keep the robust evolutionary account you like.
      *   *Cons:* You must fight the battle at (3) and (4).

  **Recommendation:** Keep (2) but refine it. Condemnation is a **hybrid signal**. It indexes status (cheap) *and* handicaps commitment (costly). The existence of cheap hypocritical noise does not negate the fact that *stable* moral norms require costly enforcement. The argument relies on the *stable* equilibrium, not the noise.

  ### 3. Is (4) fatal self-undermining?

  **(4) The Function-Swamps-Content Principle:** *"You can explain why we produce it... without ever supposing it's true."*

  Yes, this is self-undermining if universalized, but the author likely intends it to be local.

  *   **Universalized:** If (4) applies to *all* discourse, then the argument itself is just a signal of the philosopher's coalition membership. Its truth is irrelevant; only its function matters. You can dismiss it as a "tenure-track signal."
  *   **Localized:** If (4) applies *only* to moral discourse, it is question-begging. Why does biology swamp content for morals but not for "There is a leopard"? The author needs a principled reason why moral claims are unique in having their content swamped by function. Usually, that reason is metaphysical (e.g., "moral properties are queer"), which violates the "selling point" (6).

  **The Genetic Fallacy:** (4) is a high-powered Genetic Fallacy. It argues that because we know the *origin* (evolutionary function) of the belief, we can disregard its *validity*. But for most beliefs (perception, memory), knowing the evolutionary origin reinforces their validity (we evolved to see lions because there are lions). The argument assumes without proof that moral beliefs are the exception.

  ### 4. Strategic Advice: What is cheapest to give up?

  As a realist who wants to keep the biology (1) and the sociology (2), **you must reject (4).**

  **The Price of Dropping (4):**
  You have to argue that **explanatory dispensability does not entail semantic emptiness.**
  Just because you can explain the *production* of the utterance via signaling dynamics without invoking moral truth, it does not follow that the utterance *lacks truth conditions*.

  *   **Analogy:** I can explain why you say "I am in pain" by referencing nerve stimulation and evolutionary avoidance behavior without ever referencing the *qualia* of pain. Does that mean "I am in pain" has no truth value? No.
  *   **The Realist Move:** Accept that signaling explains the *force* and *prevalence* of moral talk. Deny that it explains the *content*. The content is supplied by the moral facts themselves. The signaling mechanism is the *transmission medium*, not the *message*.

  **Why not drop (2)?**
  You said you'd rather lose (2) than (1). Dropping (2) is empirically risky. If moral condemnation isn't costly, it's hard to explain why norms stabilize. If you drop (2), you have to explain why we don't just lie about morality constantly. The Handicap Principle is actually a *friend* to the realist here: it explains why moral talk is *reliable*. If it were cheap, it would be useless. The cost proves we take it seriously, which aligns with realism.

  ### 5. Is there a weakened version of (4) that is still threatening?

  Yes. This is the **Epiphenomenal Challenge**.

  **Weakened (4*):** "We can explain the *stability* and *motivation* of moral discourse entirely through signaling dynamics, rendering moral truth *causally inert*."

  **Why this is dangerous:**
  It grants you realism (moral facts exist) but makes them **otiose**. If the signaling biology does all the work in explaining why we condemn, why we cooperate, and why we feel guilt, then the "moral truth" is a ghost in the machine. It exists, but it does nothing.

  **How to counter (4*):**
  You argue that moral truths are **constitutive** of the signaling equilibrium, not external to it.
  *   It's not that we signal "I am a cooperator" by pretending X is wrong.
  *   It's that X *is* wrong, and recognizing that truth is what *makes* you a cooperator.
  *   The truth is the *focal point* (Schelling point) that allows the signaling equilibrium to exist in the first place. Without the truth of the matter, there is no stable signal to send.

  ### Summary of the Break

  1.  **The Break:** Between **(2) and (3)**. Cost guarantees honesty of the *speaker*, it does not eliminate reference to the *world*.
  2.  **The Trick:** Equivocating between "This utterance functions to signal quality" and "This utterance cannot also be true."
  3.  **The Fix:** Keep (1) and (2). Reject (4). Argue that evolutionary explanation of *behavior* is compatible with realist semantics of *content*.
  4.  **The Threat:** The only real threat is not anti-realism, but **epiphenomenalism** (moral facts exist but do no explanatory work). Counter this by arguing moral facts are the *coordination points* required for the signaling to work at all.

  The argument is a conjuring trick because it tries to use the *reliability* of the signal (which realists should love) to prove the *non-existence* of the thing signalled. It's like arguing that because a high-quality thermometer is costly to manufacture and signals the manufacturer's skill, it doesn't actually measure temperature.
