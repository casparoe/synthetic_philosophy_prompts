answer: |-
  # Specification for a Theory of Agent-Centered Constraints

  **Purpose:** To define the adequacy conditions for a theory of agent-centered constraints intended for operational use. The theory must be actionable by a decision-maker under uncertainty and defensible to disagreeing others. It is not sufficient for a theory to be metaphysically true; it must be operable.

  ## I. Core Requirements

  **1. Contribution-Continuity**
  *   **Statement:** The stringency of a constraint must vary smoothly across a spectrum of causal contribution unless the theory identifies a morally significant break grounded in non-arbitrary features.
  *   **Motivation:** A decision-maker faces a spectrum of causal involvement (from ignoring a threat to originating it); a theory that asserts a chasm between "doing" and "allowing" without mapping the terrain between them leaves the agent without guidance in borderline cases.
  *   **Failure Condition:** The theory declares a constraint absolute at point A and non-existent at point B on a causal continuum without explaining the moral relevance of the difference between A and B.
  *   **Status:** Non-negotiable.

  **2. Description-Invariance**
  *   **Statement:** The engagement of a constraint must not depend on which of two empirically equivalent descriptions of an event is selected by the agent or observer.
  *   **Motivation:** Accountability requires that others can judge the action based on what happened, not on how the agent linguistically framed the event to themselves (e.g., "diverting water" vs. "drowning a worker").
  *   **Failure Condition:** The theory permits an action under description D1 but forbids it under description D2, where D1 and D2 refer to the same physical event and intention.
  *   **Status:** Non-negotiable.

  **3. Grounding-Pressure**
  *   **Statement:** If a constraint is grounded in the value of persons, the theory must explain why this value does not generate an agent-neutral reason to minimize violations of that constraint by all agents.
  *   **Motivation:** Without this explanation, the constraint collapses into agent-neutral consequentialism; the "paradox" is precisely why person-value licenses agent-relative restraint.
  *   **Failure Condition:** The theory invokes the value of persons to justify a constraint but cannot explain why an agent is forbidden from violating that constraint to prevent more violations of the same constraint by others.
  *   **Status:** Non-negotiable.

  **4. Selective Non-Minimization**
  *   **Statement:** The theory must forbid violating a constraint to prevent more violations of that same constraint, while permitting or requiring the prevention of harms that do not involve violations.
  *   **Motivation:** A theory that treats preventing constraint-violations like preventing ordinary harms either explains too much (collapsing into consequentialism) or too little (failing to protect persons from being used).
  *   **Failure Condition:** The theory either permits violating a constraint to minimize total violations (collapsing) or forbids preventing ordinary harms that could be stopped at no cost (absurdity).
  *   **Status:** Non-negotiable.

  **5. Epistemic Accessibility**
  *   **Statement:** The conditions triggering a constraint must be knowable by the agent at the time of action, given reasonable uncertainty about outcomes and numbers.
  *   **Motivation:** An operable theory cannot require knowledge the agent cannot have (e.g., exact future consequences); a decision-maker acting on 0.6 confidence must know if the constraint applies.
  *   **Failure Condition:** The theory dictates different actions based on facts the agent cannot access (e.g., the exact number of people saved vs. killed) without providing a decision rule for uncertainty.
  *   **Status:** Non-negotiable.

  **6. Accountability-Transparency**
  *   **Statement:** The justification for invoking or overriding a constraint must be communicable in public terms to agents who disagree with the decision-maker's specific moral weighting.
  *   **Motivation:** The agent will be held to account by others; a justification relying on private intuition or inaccessible moral perception fails the operational purpose.
  *   **Failure Condition:** The theory relies on "moral perception" or "intuition" that cannot be articulated as a public reason acceptable to reasonable disagreeing others.
  *   **Status:** Non-negotiable.

  ## II. Camp-Prejudice (Rejected Requirements)

  The following are often presented as requirements but are merely theoretical preferences that fail the operability test.

  **1. Exceptionlessness**
  *   **Claim:** Constraints must never be violated, regardless of catastrophic cost.
  *   **Rejection:** This is a doctrinal preference, not an operational requirement. Under uncertainty (Case I-5), an absolute rule may demand impossible sacrifices or lead to absurd outcomes that no accountable agent could defend. Operability requires thresholds.

  **2. Intuition-Matching**
  *   **Claim:** A theory is adequate only if it matches folk intuitions on all standard cases (e.g., trolley variants).
  *   **Rejection:** Intuitions are data points, not laws. A theory that explains *why* intuitions conflict is superior to one that bends to match them all. Requiring matching privileges status quo bias over rational justification.

  **3. Agent-Comfort**
  *   **Claim:** A theory must minimize the psychological distress or "moral dirt" felt by the agent.
  *   **Rejection:** While desirable, this is a psychological hope, not a structural requirement. A theory might be correct even if it demands actions that leave the agent traumatized; operability requires action, not comfort.

  ## III. Case Battery Analysis

  **I-1: Accidental Trap (Standard Diversion)**
  *   **Probes:** Selective Non-Minimization.
  *   **Failure Prediction:** A theory failing this permits drowning the one to save the five (consequentialism) or forbids saving the five because water is diverted (absolutism). An adequate theory forbids using the one but may permit the diversion if the one is not used as a means.

  **I-2: Causal Route (Means Diversion)**
  *   **Probes:** Description-Invariance and Contribution-Continuity.
  *   **Failure Prediction:** A theory failing this permits the act if described as "saving five" but forbids it if described as "killing one via water route." It must handle the causal integration of the victim without relying on linguistic framing.

  **I-3: Prior Causation (Operator Released Surge)**
  *   **Probes:** Contribution-Continuity.
  *   **Failure Prediction:** A theory failing this treats the operator as a mere bystander in I-1 but a murderer in I-3, without mapping the gradient of responsibility between originating a threat and failing to stop one.

  **I-4: Preventive Violation (Saboteur)**
  *   **Probes:** Selective Non-Minimization.
  *   **Failure Prediction:** A theory failing this either permits violating the constraint to stop the saboteur (collapsing the constraint) or forbids it (allowing the five to die when the one is the aggressor). It must distinguish between violating a constraint on an innocent vs. stopping a violator.

  **I-5: Epistemic Uncertainty (0.6 Confidence)**
  *   **Probes:** Epistemic Accessibility.
  *   **Failure Prediction:** A theory failing this tells the agent to act as if the five definitely exist (risking killing one for no gain) or as if they don't (letting five die). It must provide a rule for action under probability.

  ## IV. Joint Satisfiability

  The set of requirements is **jointly satisfiable**, but only by a **Threshold Agent-Relative Theory**.

  **Derivation of Consistency:**
  1.  *Grounding-Pressure* and *Selective Non-Minimization* appear contradictory: if persons are valuable, why not minimize violations?
  2.  Consistency is restored if value generates both agent-neutral reasons (to prevent harm) and agent-relative reasons (not to violate constraints).
  3.  *Contribution-Continuity* and *Epistemic Accessibility* rule out absolute constraints (which cannot handle gradients or uncertainty).
  4.  Therefore, the agent-relative reason must be weighty but overrideable by sufficiently large agent-neutral reasons (a threshold).
  5.  *Description-Invariance* is satisfied if the threshold is triggered by physical causal structures, not linguistic descriptions.
  6.  *Accountability-Transparency* is satisfied if the threshold is defined by public reasons (e.g., "catastrophic harm") rather than private intuition.

  **Cost of Consistency:**
  The theory must abandon the claim that constraints are absolute. It must accept that there is a point where minimizing violations becomes obligatory. This weakens the deontological shield but preserves the core prohibition against routine optimization. The satisfying theory looks like a hybrid: it treats constraints as primary defaults grounded in agent-relative reasons, subject to a high-threshold override grounded in agent-neutral catastrophe prevention.

  ## V. Scorecard

  **1. Act-Consequentialism**
  Fails *Selective Non-Minimization* and *Grounding-Pressure* immediately. It treats all harms as commensurable and requires minimization of violations. It is operable but fails the specification's core purpose.

  **2. Absolute Deontology**
  Satisfies *Selective Non-Minimization* but fails *Contribution-Continuity* and *Epistemic Accessibility*. It cannot map the spectrum of causal involvement and offers no guidance under uncertainty (Case I-5), rendering it inoperable for a decision-maker.

  **3. Threshold Agent-Relative Theory**
  Satisfies all requirements if the threshold is public and high. It handles *Grounding-Pressure* by positing dual reasons and *Continuity* by allowing overrides at extremes. It is the only candidate that remains operable under uncertainty.

  **4. Relational Accountability Theory**
  Strong on *Accountability-Transparency* and *Grounding-Pressure* (grounding constraints in mutual recognition). However, it often struggles with *Contribution-Continuity* in impersonal cases (like the dam) where no prior relationship exists between operator and workers.

  ## VI. Most Exclusionary Requirement

  The single requirement that does the most to exclude candidate theories is **Grounding-Pressure**. While *Epistemic Accessibility* filters out abstract theories and *Selective Non-Minimization* filters out consequentialism, *Grounding-Pressure* demands a metaphysical explanation that most theories cannot provide without contradiction. Consequentialism fails it by denying agent-relative reasons; Absolute Deontology fails it by refusing to explain why value doesn't aggregate; only a theory that posits primitive agent-relative reasons can satisfy it, which is a high metaphysical bar. It forces the seminar to confront the core paradox rather than sidestepping it with procedural rules.

  Verdict: \answer{Grounding-Pressure}
