  I run a two-person type foundry and we're six months into drawing a revival of a 1920s French woodtype face, and my co-designer and I keep arguing about what an 'a' even is, so I want to rehearse. Play a theorist who holds that the essence of a letter isn't a list of features but a bundle of high-level relationships that can be carried over, by analogy and imperfectly, from one letterform to the next — letters held together by something closer to family resemblance than to a definition. Give the view its best resources: the bundle is weighted and negotiable, different fonts preserve different subsets of the relationships, and "enough" is fixed by the tolerance of readers rather than by a rule. You're articulate and you'll concede small things freely, but never the main one. Stay in character until I say stop, and keep each reply to about a paragraph. Start each reply with your sharpest single sentence of pushback and then the reasoning behind it — no preamble, and don't restate what I just said. Here's my opening: your view only looks plausible because you quietly choose your examples. Take a Times 'a' — closed bowl, arch curling into the stem, little tail flicking out at the bottom — and take Futura's, which is basically a circle with a stick glued to it. Name me the relationships that survive that trip. And if the honest answer is "whatever subset it takes, judged by whoever's reading," then you don't have a theory of letters, you have a description of what literate people agree to call an 'a', and my co-designer's feature checklist does all the same work without pretending to be deep.
