  *   **Rule A (Documentary Anchor):** The Logbook wins. It is a direct contemporary written record.
  *   **Rule B (Source Integrity):** The Oral Tradition wins (or creates a stalemate). The Logbook has high motive for fabrication; the Oral tradition has none.
  *   **Why this works:** It removes the "Institutional Bias" of the Mining case (which might sway Rule A adherents) and the "Physical Evidence" of the Cholera case. It isolates the tension between "Written Primacy" and "Source Integrity" in its purest form.
