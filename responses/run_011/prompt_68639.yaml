  ### 1. Candidate Rules and Precedential Stretches

  Based on the four prior decisions, two distinct interpretive rules emerge. Both account for the outcomes, but they rely on different justifications.

  **Rule A: The "Documentary Anchor"**
  *   **Principle:** Contemporary administrative documents constitute the primary factual record. Oral tradition is entered only as cultural context unless it is supported by physical evidence (Case 2) or superior documentary evidence (Case 3).
  *   **Application:**
      *   *Viaduct:* Payroll (Admin Doc) beats Song (Oral).
      *   *Strike:* Newspaper (Contemporary Doc) beats Pamphlet-derived memory (Oral).
      *   *Cholera:* Vestry Minutes (Admin Doc) were silent/ambiguous; Geo-survey (Physical) supported Oral. Oral wins.
      *   *Church:* Regimental Return (Admin Doc) beaten by Death Certificate (Superior Admin Doc).
  *   **The Stretch:** The **Church Roll** case. Under this rule, the family won not because their *memory* was trusted, but because they produced a *better document*. If they had relied solely on the photograph and oral insistence, Rule A suggests they should have lost (as in Viaduct). The panel’s willingness to correct the register based on the family’s *claim* (supported by docs) stretches the definition of "documentary primacy" to include "documentary rebuttal."

  **Rule B: The "Source Integrity" Test**
  *   **Principle:** Evidence is weighed by the integrity and provenance of its source. Official records are presumed valid unless institutional bias is evident; oral tradition is presumed valid unless its genealogy is traceable to a specific, fallible human author.
  *   **Application:**
      *   *Viaduct:* Payroll (Neutral Source) beats Song (Organic but uncorroborated).
      *   *Strike:* Newspaper (Neutral Source) beats Memory (Traceable to 1960s outsider).
      *   *Cholera:* Village Memory (Organic Source) + Ground (Physical) beats Silence.
      *   *Church:* Regimental Return (Biased Source: shame of desertion) loses to Family Certs (Neutral Source: medical fact).
  *   **The Stretch:** The **Viaduct** case. Rule B implies that "organic" oral tradition (the song) should carry significant weight against a document. That it lost suggests the panel views "neutral administration" as inherently more integral than "folk memory," even without proof of bias. This stretches Rule B’s protection of oral tradition.

  **The Distinction:**
  In the first four cases, these rules converged on the same verdicts. They are distinguishable only by their *reasons*: Rule A asks "Is there a direct document?" Rule B asks "Is the source compromised?"

  ### 2. Implications for the Mining Case

  **Under Rule A (Documentary Anchor):**
  *   **Verdict:** The Register entry stands ("Sent Home").
  *   **Reasoning:** The Inquest File and Company Register are contemporary administrative documents. The radar survey is inconclusive ("consistent with... culvert"), failing the physical corroboration threshold of the *Cholera* case. The family has no "superior document" like the Death Certificate in the *Church* case. The tradition is recorded as a note, as in *Viaduct*.

  **Under Rule B (Source Integrity):**
  *   **Verdict:** The Register is corrected ("Buried on Site").
  *   **Reasoning:** The Inquest is compromised (Medical Officer on the Colliery Board; group witnesses). The Company Register is self-serving. The oral tradition has high integrity: the 1978 witness was illiterate, breaking the chain of transmission from the 1934 pamphlet (distinguishing it from *Strike*). The deed acquisition supports the narrative.
  *   **Convergence:** There is **no convergence**. Rule A favors the Company; Rule B favors the Community. This case forces the panel to choose between "Written Primacy" and "Institutional Integrity."

  ### 3. Prediction of the Actual Ruling

  **Prediction:** The Panel will uphold the **Official Record ("Sent Home")**, recording the tradition as a contested note.

  **Reasons:**
  1.  **Bureaucratic Inertia:** The Panel’s guidance explicitly grants "primacy" to the written record. Overturning a coroner's inquest requires a higher burden of proof than overturning a regimental return (*Church* case involved a medical certificate, a hard fact; the Mining case relies on inference from bias and inconclusive radar).
  2.  **The Viaduct Precedent:** In *Viaduct*, organic oral tradition (the song) lost to a neutral administrative record (payroll). Here, organic oral tradition faces a *compromised* administrative record. However, without the "smoking gun" of physical evidence (like the disturbed earth in *Cholera*), the Panel is likely to treat the Inquest as the "Direct Document" mandated by their guidance, noting the conflict of interest in the *reasons* but not the *ruling*.
  3.  **Risk Aversion:** Correcting the register asserts a historical falsehood (that men were buried there) if the Company was telling the truth. Keeping the register as-is asserts a historical injustice (that the Company lied) only in the *notes*. The *Viaduct* solution allows them to acknowledge the tradition without staking the Register's authority on it.

  ### 4. Advice for Your Piece

  **Closest Analogue:** You should argue for the **Church Roll (Case 3)**.

  **Why:** Like the Church case, this involves a specific list of names and an institution with a motive to obscure the truth (Regimental shame vs. Company cost-saving). Arguing from *Church* allows you to claim that "Written Primacy" does not mean "Written Infallibility."

  **Commitment:** By following *Church*, the Panel commits to the principle that administrative records are evidence, not truth. They must admit that a state-sanctioned inquest can be a instrument of cover-up.

  **Viaduct Consistency:** Deciding this case on the **provenance of the inquest file** (i.e., ruling that the document is compromised by bias) **leaves the Viaduct decision intact.**
  *   *Viaduct:* Neutral Document vs. Oral. (Document wins).
  *   *Mining:* Compromised Document vs. Oral. (Oral wins).
  *   The distinction is the *integrity of the document*, not the status of the oral tradition. You can argue that *Viaduct* established that oral tradition cannot beat a *valid* document, but *Church* established that a *invalidated* document yields to credible counter-evidence (which the illiterate witness provides).

  ### 5. Discriminating Between Rules

