  **World W: The Symmetric Condensate**

  World W is a closed quantum system governed by a conservation law fixing the boson number at exactly two. The two bosons occupy the identical ground state spatial mode and spin state; they are perfectly coincident. All monadic properties (mass, charge, spin) are identical. All relations between them are reflexive or symmetric, such as "occupies the same quantum state as." No spatial separation exists; the relation of distance is undefined or zero. The laws of interaction dictate that field coupling strength scales quadratically with particle number. An inhabitant measuring the total coupling strength observes a value logically compatible only with a count of two, not one. This measurement is global and does not identify or track individual particles, preserving symmetry. The description relies solely on qualitative properties and numerical quantification fixed by law.

  ***

  **(a) Clause-by-clause verification**
  1.  **Spec 1:** Met. No irreflexive relations (e.g., distance > 0) hold. Excluding *is distinct from* is legitimate; if logical distinctness counted as a discerning relation, PII would be a trivial logical truth rather than a metaphysical principle about properties grounding identity.
  2.  **Spec 2:** Met. Quantum field theory provides rich law-governed structure for physics.
  3.  **Spec 3:** Met. No names/indexicals; count derives from conservation law.
  4.  **Spec 4:** Met. Coupling strength measurement distinguishes $N=2$ from $N=1$ globally without breaking symmetry.

  **(b) Relations between the objects**
  *   *Occupies same quantum state as:* Reflexive (holds between $a$ and $a$).
  *   *Is co-located with:* Reflexive (distance = 0).
  *   *Has same mass/charge as:* Reflexive.
  *   *Is distinct from:* Excluded by fiat (see Spec 1 analysis); not a qualitative physical relation.

  **(c) Verdicts**
  *   **Bundle Theorist:** W contains **one** object. Without weak discernibility, the "bundle" of properties is identical, so there is only one bundle. The qualitative description underdetermines the count; the law saying "two" is merely misleading grammar for "double intensity."
  *   **Haecceitist:** W contains **two** objects. Primitive thisness allows numerical difference without qualitative difference. The description genuinely underdetermines the count for the bundle theorist but not the haecceitist.

  **(d) The working feature**
  The **quadratic scaling law** for coupling strength.
  *   *Removal:* If coupling scaled linearly ($N=1 \to k, N=2 \to 2k$), a single object of double mass/charge could mimic the two-object signature. The quadratic scaling prevents reduction to a single object with adjusted monadic properties.

  **(e) Strongest attack**
  **The Category Mistake Objection:** In quantum mechanics, "particle number" is a property of the *field*, not a count of individual substances. W is not a world of two objects, but a world of one field with an excitation number of 2. The defender of PII argues that positing "two objects" here is an ontological error—a one-object world (the field) written in misleading particle grammar. This stipulation is no less question-begging than haecceities.

  **(f) Conclusion**
  The case shows PII is **not necessarily true** (if haecceitism is coherent), but it does not settle whether the resistance is semantic or metaphysical. It suggests the dispute turns on the **metaphysics of objects**: whether "object" requires discernibility (Bundle) or allows primitive identity (Haecceitist). If the Category Mistake Objection holds, the anti-haecceitist's complaint is metaphysical (such a world is impossible because particles aren't fundamental), not merely semantic.
