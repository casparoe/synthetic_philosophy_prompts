      *(Self-Correction on Tension 1)*: Is it (4) vs (6) or (5) vs (6)? Actually, (5) is the stronger attack on (6). If reasoning is post-hoc, equilibrium is fake. (4) adds that the *gut feelings* themselves are culturally skewed. Together they destroy (6). I should group them.

