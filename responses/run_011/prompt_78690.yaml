answer: |-
  You have identified a genuine and persistent structural feature of debates in the philosophy of technology, political theory, and law. Your observation is sharp: you have noticed that the disagreement is not about *what happened* (the empirical facts), but about *where to hang the label* (the ontological location of the predicate).

  To answer your first question directly: **No, there is no single, canonical name for this exact configuration.** However, it is a recognized hybrid of two established concepts. Philosophers would describe this as a **Metaphysical Verbal Dispute** with **Normative Stakes**, occurring within a debate over **Reification**.

  Because you asked for a name if one does not exist, and because the existing terms are either too broad (Reification) or too dismissive (Verbal Dispute), I will propose a precise label for you at the end. First, let us walk through your guesses and the two follow-up questions to map the edges of this thing.

  ### 1. Evaluating Your Guesses

  You asked how your observation differs from four specific concepts. Here is the breakdown:

  **Reification (Marx/Lukács)**
  *   **What it is:** The process where social relationships between people are perceived as relationships between things (e.g., "the market decided" rather than "traders decided").
  *   **How it differs:** Reification is the *subject* of the argument, not the *structure* of the argument. In your transit example, Side B is accusing Side A of reification ("you are treating concrete like a politician"). Side A is arguing that the reification is real and irreversible ("the concrete *is* the decision now"). Your observation captures the *stalemate* that occurs when both sides understand reification but disagree on whether it is legitimate. Reification explains the mechanism; it does not name the argumentative loop.

  **A Merely Verbal Dispute (Carnap/Chalmers)**
  *   **What it is:** A disagreement where parties agree on all facts but use words differently (e.g., "Is a tomato a fruit?" agreed botany, disagreed on culinary category).
  *   **How it differs:** In philosophy, "verbal" often implies "trivial." Your key insight is that **this does not feel trivial to the participants.** It feels substantive. Why? Because the location of the predicate determines the **remedy**. If the *bridge* is political, you must demolish or retrofit the bridge. If the *committee* was political, you must change the policy or seek reparations. The dispute is verbal in logic, but material in consequence. This is what makes it a *Non-Trivial Verbal Dispute*.

  **Artifact Agency (Latour/Actor-Network Theory)**
  *   **What it is:** The claim that non-humans (artifacts) can be "actors" that modify a state of affairs.
  *   **How it differs:** This is a theoretical position, not an argumentative structure. Your observation describes what happens when an Artifact Agency theorist meets a Humanist. The *clash* is the phenomenon you named. Artifact Agency is one side of the tennis match; you are describing the court.

  **Technological Determinism**
  *   **What it is:** The theory that technology drives social change independently of human will.
  *   **How it differs:** Determinism is a causal claim (A causes B). Your observation is about *attribution* (Where does the property "political" reside?). One can be a determinist and still agree that the politics sits in the humans who built the determinative machine. Determinism is about force; your observation is about address.

  **Verdict:** The closest existing concept is the **Non-Trivial Verbal Dispute**, but that misses the specific flavor of *material vs. human* attribution.

  ### 2. The Culvert Case (Disputed Facts)

  You asked: *Is the culvert argument (where intentions were disputed) the same phenomenon wearing a disguise?*

  **No.** The requirement for factual agreement is doing real work.

  In the culvert case, the argument is **Epistemic**. If you can dig up the original engineering logs and prove the engineers *did* intend to block flow to a specific neighborhood, the argument collapses. Side A wins. The "politics" is securely located in the past human intent.

  In the overpass case (your first instance), digging up the logs does not solve it. Even if the logs say "We just wanted to save money on concrete," Side A says, "The effect today is exclusion, so the concrete is political." Side B says, "The effect is unintended, so the concrete is neutral."

  **The Boundary:**
  *   **Type 1 (Culvert):** Empirical Dispute. Resolution is possible through evidence.
  *   **Type 2 (Overpass):** **Locus Dispute.** Resolution is impossible through evidence because the disagreement is about how to *categorize* the agreed-upon evidence.

  If you allow factual disagreement into the mix, you cannot tell if the parties are fighting about reality or fighting about labels. Your intuition was correct: the phenomenon you spotted *requires* factual agreement to exist in its pure form.

  ### 3. Outside Technology

  You asked: *Does this structure turn up outside technology?*

  **Yes, extensively.** It is the central engine of modern legal and sociological debate.

  *   **Corporate Law:** A corporation pollutes a river.
      *   *Side A:* The **Corporation** is liable (the entity itself is the actor).
      *   *Side B:* The **Executives** are liable (the corporation is just a shell; people made the choices).
      *   *Facts Agreed:* Who signed the permit, how much was dumped, the damage caused.
      *   *Dispute:* Where do we place the predicate "Guilty"?
  *   **Systemic Racism:** A hiring algorithm rejects minority candidates.
      *   *Side A:* The **System** is racist (the output is the definition).
      *   *Side B:* The **Data/Designers** are biased (the input is the definition).
      *   *Facts Agreed:* The rejection rates, the code structure, the demographic data.
      *   *Dispute:* Is the predicate "Racist" attached to the outcome or the intent?
  *   **Market Forces:** A factory closes and moves overseas.
      *   *Side A:* The **Market** forced this (an impersonal structure).
      *   *Side B:* The **Shareholders** chose this (human agents).
      *   *Facts Agreed:* The profit margins, the labor costs, the decision date.

  **Where it lives:** This structure is the native language of **Institutional Theory** in sociology and **Tort Law** in jurisprudence. In law, it is often called the problem of **Proximate Cause** or **Vicarious Liability**, but those are legal doctrines, not names for the argumentative structure itself.

  ### 4. Naming and Defining the Phenomenon

  Since no single term captures the specific configuration you described (Factual Agreement + Predicative Disagreement + Remedial Stakes), I propose we name it:

  ## **The Locus of Attribution Dispute**

  **Definition:**
  A *Locus of Attribution Dispute* occurs when two parties in an argument satisfy the following three conditions:
  1.  **Empirical Convergence:** Both parties agree on all empirical, historical, and causal facts regarding the event or artifact in question.
  2.  **Predicative Displacement:** The parties disagree on the ontological location of a normative predicate (e.g., "political," "responsible," "biased," "agentive"). One side locates the predicate in the *material/systemic object*; the other locates it in the *human agents/context*.
  3.  **Remedial Divergence:** The location of the predicate dictates a mutually exclusive course of action (e.g., retrofit the object vs. retrain the people; punish the corporation vs. punish the CEO).

  **Conditions for Arising:**
  *   It arises in complex systems where human intent and material effect have become decoupled over time.
  *   It arises when the "object" in question has sufficient durability to outlast the original decision-makers (e.g., infrastructure, code, law).

  **Conditions for Exclusion (When it only *looks* like one):**
  *   If either side disputes the empirical facts (the Culvert Case), it is an Epistemic Dispute, not a Locus Dispute.
  *   If the location of the predicate does not change the remedy (e.g., arguing whether a murderer is "evil" or "sick" but agreeing on the prison sentence), it is a Semantic Dispute without stakes.

  ### 5. Borderline Cases

  To help you test this definition, here are two borderline cases and my verdict.

  **Case A: The Speed Bump (Winner's Classic Example)**
  *   *Scenario:* A speed bump forces cars to slow down near a school.
  *   *Argument:* Is the speed bump a "police officer" (political/agentive) or just "asphalt" (neutral)?
  *   *Facts:* Everyone agrees on the dimensions, the placement, and the slowing effect.
  *   *Remedy:* If it's a police officer, it requires democratic oversight. If it's asphalt, it requires maintenance.
  *   **Verdict:** **Pure Locus of Attribution Dispute.** This is the archetype. The physical object is unchanged; the debate is entirely about where we place the authority/responsibility.

  **Case B: The Autopilot Crash**
  *   *Scenario:* A self-driving car fails to brake and hits a pedestrian.
  *   *Argument:* Was it a **Software Failure** or a **Sensor Occlusion**?
  *   *Facts:* The engineers disagree on the log data. One says the code didn't recognize the object; the other says the lidar was blocked by mud.
  *   **Verdict:** **Epistemic Dispute (Not a Locus Dispute).** Because the facts of *why* the failure occurred are disputed, the location of responsibility (Engineer vs. Environment) is a consequence of the facts, not a philosophical choice. If they agreed on the logs (e.g., "The code saw the person and chose not to brake"), it would become a Locus Dispute (Is the *algorithm* responsible or the *programmer*?).

  ### Summary for Your Practice

  You have identified a mechanism that often stalls public planning. In your transit meetings, the "Locus of Attribution Dispute" functioned as a proxy war.
  *   **Side A (The Bridge is Political):** Wants a material fix (tear down the overpass).
  *   **Side B (The Humans are Political):** Wants an administrative fix (change the route, apologize, form a committee).

  Both sides know the bus doesn't fit. But admitting the *bridge* is the problem costs millions. Admitting the *planners* were the problem costs political capital. They fight about "politics" and "concrete" because they cannot fight about "budget" and "blame."

  Recognizing this as a **Locus of Attribution Dispute** allows you to cut through the circle. You can intervene by saying: *"We agree on the dimensions and the exclusion. We are not arguing about facts. We are arguing about whether the remedy is capital spending or policy change. Let us vote on the remedy, not the metaphysics."*

  That is the value of naming the thing. It turns a philosophical stalemate into a budgetary decision.
