answer: |-
  You have identified the exact fault line that divides archaeologists and historians: the tension between **complexity** (systems, states, monuments) and **continuity** (people, genes, subsistence). Your gut calls are actually more consistent than you think, but they rely on a hidden variable you haven't explicitly named.

  Here is the principle that generates your verdicts, the inconsistency it exposes, and the cost of fixing it.

  ### The Principle: The Continuity of Agency Threshold

  Your working definition is not merely "loss of complexity." It is: **Collapse occurs when the sociopolitical system loses the capacity to reproduce itself *and* the population loses the agency to determine the terms of their own reorganization.**

  This principle has three clauses:
  1.  **Termination of the Project:** The specific ideological or state apparatus (Divine Kingship, Palatial Redistribution, Imperial Administration) ceases to function and is not immediately restored.
  2.  **Involuntariness:** The change is driven by systemic failure (famine, invasion, economic severance) rather than strategic choice.
  3.  **Loss of Resilience:** The post-event society has a measurably reduced capacity to cope with stress compared to the pre-event society.

  ### How the Clauses Do the Work

  *   **Norse Greenland:** *Termination* (Total), *Involuntary* (Climate/Economy), *Resilience* (Zero). **Verdict: Collapse.**
  *   **Classic Maya:** *Termination* (Kingship/Stelae), *Involuntary* (Drought/War), *Resilience* (Reduced in South). **Verdict: Collapse.**
  *   **Late Bronze Age:** *Termination* (Palaces/Script), *Involuntary* (Systems Failure), *Resilience* (Dark Age). **Verdict: Collapse.**
  *   **Easter Island:** *Termination* (Moai), but *Voluntary/Adaptive* (Shift to Birdman cult), *Resilience* (Stable until contact). **Verdict: Transformation.**
  *   **Angkor:** *Termination* (Capital), but *Voluntary/Strategic* (Relocation), *Resilience* (Court survives). **Verdict: Transformation.**
  *   **Cahokia:** *Termination* (Chiefdom), but *Voluntary* ("Voting with feet"), *Resilience* (Dispersal to sustainable baseline). **Verdict: Transformation.**

  ### The Problem Pair: Roman Britain vs. Cahokia

  This is where your principle breaks.
  *   **Roman Britain:** You call it **Collapse**. The Villa economy stops, coins stop.
  *   **Cahokia:** You call it **Transformation**. The Mound economy stops, dispersal happens.

  **The Contradiction:** In both cases, the *elite superstructure* vanishes, and the *subsistence base* continues. In both cases, the "state" level of organization is lost.
  *   If Cahokia is **Transformation** because the commoners survived and adapted to a lower-complexity equilibrium...
  *   Then Roman Britain must be **Transformation**. The farmers kept farming. The "collapse" was only of the *Imperial extraction layer*, not the society itself. Recent archaeology (e.g., the work of Guy Halsall or Kenneth Dark) supports this: sub-Roman Britain was not a wasteland, but a re-localization of power.

  **The Sacrifice:** To be consistent with your Easter Island and Cahokia calls, **you must drop "Roman Britain" as a Collapse.** You must reclassify it as a **Political Transformation.**
  *   *Why?* Because your Rapa Nui call establishes that *survival of the population + adaptation of lifeway = not collapse.* Britain fits this. The "Collapse of Roman Britain" is a historiographic artifact of reading the silence of Latin texts as the silence of people.

  **Alternative:** If you refuse to drop Britain, you must admit your definition relies on **Literacy/Material Wealth.** If the loss of coins and Latin makes it a collapse, but the loss of mounds and trade shells (Cahokia) does not, you are smuggling in a bias that "State/Urban" is inherently superior to "Tribal/Rural."

  ### Running the Principle on New Cases

  **1. The Indus Valley Civilization (Harappan)**
  *   *Facts:* Cities abandoned, script undeciphered/lost, standardized weights disappear. Population drifts east to Ganges plain. Agriculture continues.
  *   *Application:* *Termination* (Urban/State project ends). *Voluntariness* (Debatable, likely climate-driven migration). *Resilience* (Culture persists in Vedic/Ganges context).
  *   *Verdict:* **Collapse (of the Urban System) / Transformation (of the People).**
  *   *Consistency Check:* If Maya is Collapse (cities empty, people stay), Indus is Collapse. The specific *Harappan* project died. The people survived, but the *society* (as defined by the urban contract) collapsed.

  **2. Chaco Canyon**
  *   *Facts:* Great Houses abandoned, roads fall into disuse, population disperses to Hopi/Zuni/etc. areas.
  *   *Application:* *Termination* (Chacoan system). *Voluntariness* (Likely strategic dispersal due to drought). *Resilience* (High; descendant pueblos thrive).
  *   *Verdict:* **Transformation.**
  *   *Consistency Check:* This aligns with Cahokia. The "Chaco Project" ended, but the society reorganized successfully. Calling this "Collapse" privileges the buildings over the people.

  **3. The Soviet Union**
  *   *Facts:* State dissolves, ideology abandoned, economic complexity drops (initially), borders change. Population survives, many cultural elements persist.
  *   *Application:* *Termination* (USSR State/Ideology). *Voluntariness* (Elite dissolution + popular pressure). *Resilience* (Mixed; initial drop in life expectancy, then stabilization).
  *   *Verdict:* **Political Collapse.**
  *   *Consistency Check:* This fits your "Loss of State" clause. Unlike Cahokia, the dissolution was not a return to a sustainable pre-state baseline, but a fragmentation of a superpower with significant initial human cost. It is a *State Collapse*, even if *Societal Collapse* is debatable.

  ### The Meta-Questions

  **1. Emic (Insider) vs. Etic (Outsider)**
  It matters immensely, and your list shows you are using an **Etic** definition with **Emic** sympathy.
  *   *Etic:* "The state apparatus vanished." (Britain, Maya, Indus).
  *   *Emic:* "Did the people feel their world ended?"
  *   In **Norse Greenland**, the Emic experience was extinction.
  *   In **Cahokia/Rapa Nui**, the Emic experience was likely "We are moving/changing our rituals to survive."
  *   *The Trap:* We label it "Collapse" when the *Etic* markers (monuments, texts) vanish, even if the *Emic* continuity (language, kinship) remains. Your gut is trying to correct for this by sparing Rapa Nui and Cahokia, but you haven't extended that mercy to Britain.

  **2. Moral Smuggling (Environmental Determinism)**
  **Yes, you are smuggling morality.**
  *   Look at **Easter Island**. For decades, it was the poster child for "Ecocide/Collapse" (Diamond's thesis). You reject that label *because* new science says they didn't wreck their environment.
  *   Look at **Maya**. You accept "Collapse" partly because the narrative is "drought + overpopulation."
  *   Look at **Cahokia**. You call it "Not Collapse" because it sounds like "voting with their feet" (rational choice).
  *   *The Bias:* You are defining "Collapse" as **"Punishment for Unsustainability."** If the society adapted wisely (Rapa Nui, Cahokia), it's Transformation. If they failed to adapt or were crushed (Maya, Greenland), it's Collapse.
  *   *The Cost:* This makes "Collapse" a moral judgment rather than a structural one. A society can be sustainable and still suffer a collapse (e.g., hit by a meteor or invasion). A society can be wasteful and transform (e.g., move to a new resource base).

  ### Summary Recommendation

  To resolve your inconsistency:

  1.  **Adopt the "Continuity of Agency" Principle:** Collapse is systemic failure that strips the population of the ability to reorganize effectively.
  2.  **Drop the "Roman Britain = Collapse" verdict.** Reclassify it as **Political Transformation.** The *Empire* collapsed; the *society* transformed. This aligns with your Rapa Nui and Cahokia calls.
  3.  **Accept the Moral Smuggling:** Acknowledge that you use "Collapse" to denote **Tragedy** and "Transformation" to denote **Adaptation.** This is valid, provided you admit that "Collapse" is not a neutral scientific term in your usage, but a historiographic judgment on the *outcome* for the people involved.

  If you do this, your list becomes consistent: **Collapse is when the system breaks the people. Transformation is when the people break the system.**
