answer: |-
  16/25 — This is a solid answer with excellent definitional work and strong engagement with the literature, but it is undermined by a significant conceptual error regarding utilitarianism in part (b) and a direct internal inconsistency between parts (a) and (c).

  **Reasoning**

  **(a) Define supererogatory action and explain how it differs from an action that is merely praiseworthy.**
  *   **What's right:** You correctly identify the three standard conditions (good, optional, costly) and appropriately cite Urmson's stock examples (soldier, doctor). The distinction drawn between the deontic status of supererogation (permission/obligation) and the evaluative status of praiseworthiness (motive/quality) is precise and demonstrates a strong grasp of the conceptual landscape.
  *   **What's wrong:** Nothing strictly wrong here; this is excellent work.
  *   **To move up a band:** To push this toward excellent consistently, you might critically engage with the 'cost' condition (e.g., is risk necessary, or is mere opportunity cost enough?), but for a definition question, this is near-perfect.
  *   **Defensible-but-contestable:** The claim that "on some views an act could be supererogatory even where nobody thinks to praise it" is acceptable but vague; specifying whose view (e.g., objective vs. subjective accounts) would have strengthened it.

  **(b) State the paradox of supererogation as a formal argument and explain at least one way of resisting it.**
  *   **What's right:** The formalization of the paradox (steps 1–5) is clear and logically valid. You correctly identify that premise 3 (the maximizing principle) is the usual target for those wishing to preserve supererogation.
  *   **What's wrong:** You state: "Premise 3 is really just the utilitarian principle... Utilitarians can escape by denying that betterness as such makes an act obligatory." This is a fundamental diagnostic error. Act-utilitarianism *is* the principle that betterness (utility) generates obligation; utilitarians do not deny premise 3 to escape the paradox, they accept premise 3 and thereby deny the existence of supererogation. It is non-utilitarians (deontologists, pluralists) who deny premise 3 to make room for supererogation. You have reversed the theoretical positions.
  *   **To move up a band:** You need to correctly attribute the maximizing principle to utilitarianism. The paradox is typically presented as a problem *for* those who want supererogation (given a maximizing intuition), or as a reason why utilitarianism cannot accommodate supererogation. Clarifying that utilitarianism solves the paradox by eliminating supererogation (rather than denying the maximizing principle) is crucial.
  *   **Defensible-but-contestable:** Your claim that the paradox is "best read as an internal problem for utilitarianism" is contestable. Most literature treats it as a problem for common-sense morality when confronted with maximizing principles, or as a reason to reject utilitarianism, rather than an internal inconsistency within utilitarianism itself.

  **(c) Does act-utilitarianism have room for supererogatory action? Explain.**
  *   **What's right:** The first paragraph is excellent. You correctly state the standard view (AU eliminates supererogation via the maximizing requirement) and link it effectively to the demandingness objection and Singer's shallow pond example.
  *   **What's wrong:** In the second paragraph, you argue AU *does* have room for supererogation because it can praise agents ("Praise is the mark of the supererogatory — that was built into the definition in (a)"). This contradicts your definition in part (a), where you explicitly distinguished supererogation (deontic/optional) from praiseworthiness (evaluative). You cannot define supererogation as optional in (a) and then define it as praiseworthy in (c) to save AU without acknowledging the revision. Additionally, the appeal to Wolf is slightly misapplied; Wolf argues against the *ideal* of the moral saint, not primarily to show that AU accommodates supererogation.
  *   **To move up a band:** Maintain consistency with your definition in (a). If you wish to argue AU accommodates the *phenomenon* of praise, clarify that this is a revisionist account of supererogation, not that AU accommodates supererogation *as defined in (a)*.
  *   **Defensible-but-contestable:** The claim that AU has room for supererogation "in the only sense that matters" is a philosophical stance (revisionism) that could be defended in an essay, but it requires arguing why the deontic status doesn't matter, rather than asserting it as fact.

  **Internal Inconsistency**
  *   **Part (a) vs. Part (c):** In (a), you write: "supererogation is a deontic category... An act can be praiseworthy without being supererogatory." In (c), you write: "Praise is the mark of the supererogatory — that was built into the definition in (a)." These two statements are mutually exclusive. You cannot use the distinction to clarify the concept in (a) and then collapse the distinction to solve the problem in (c).

  **Moderation Notes**
  *   The script is well-written and shows good knowledge of sources (Urmson, Singer, Wolf), which argues for the upper end of the Solid band.
  *   However, the error in (b) regarding the utilitarian stance on maximizing is a significant conceptual mistake for a third-year ethics course, and the contradiction between (a) and (c) undermines the coherence of the argument. These factors prevent it from entering the Very Good (17+) band.
  *   If the student argues at moderation that they were advocating for a revisionist definition in (c), the mark could be defended as generous given the lack of explicit signaling that they were revising their own definition from (a).
