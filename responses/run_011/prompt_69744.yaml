answer: |-
  You have hit on the exact friction point that keeps philosophers of probability up at night. You are conflating two different standards of rationality, and the Dutch Book Argument (DBA) only measures one of them.

  Here is the straight answer: **There is no single principle that catches your brother (incoherent) and the Flat Earther (coherent but wrong) for the same reason.**

  To get the precision you want, you need to split "Rationality" into two distinct norms. Once you split them, your verdicts on cases 1–6 become clear, and you'll see exactly where the betting argument stops working.

  ### The Two Principles

  **1. The Norm of Coherence (Internal Logic)**
  *   **Rule:** Your degrees of belief must obey the laws of probability (sum to 1, update on evidence, etc.).
  *   **What it catches:** Contradictions in your own head.
  *   **What it misses:** Being factually wrong about the world.
  *   **The Test:** Can I construct a Dutch Book against you *assuming you want to maximize money*?

  **2. The Norm of Calibration (External Accuracy)**
  *   **Rule:** Your degrees of belief must match the available evidence.
  *   **What it catches:** Ignorance, bias, delusion (like the Flat Earther).
  *   **What it misses:** Logical consistency (a Flat Earther can be perfectly consistent).
  *   **The Test:** If we ran this scenario 100 times, would your confidence match the frequency of outcomes?

  The Dutch Book Argument *only* proves the **Norm of Coherence**. It says nothing about truth. It says nothing about whether you *should* be betting in the first place.

  Here is how you apply this to your six cases, and which of your verdicts you need to adjust.

  ---

  ### Case-by-Case Adjudication

  **Case 1 & 2: The Brother (Incoherent)**
  *   **Verdict:** Irrational (Violates Coherence).
  *   **Why:** His probabilities sum to 135%. This violates the axioms of logic.
  *   **The Principle:** *Synchronic Coherence.* At any single moment, your probabilities must sum to 1.
  *   **Your Intuition:** You are correct. Case 2 is just as irrational as Case 1. The bets don't create the irrationality; they reveal it. If your beliefs are logically impossible, it doesn't matter if you act on them or not. You are holding a contradiction.

  **Case 3: The Cousin (Gambling Utility)**
  *   **Verdict:** Rational (Violates neither Coherence nor Calibration).
  *   **Why:** This is the case where you must trust your gut over the "money loss" argument. The Dutch Book Argument assumes your *only* goal is maximizing monetary return. Your cousin has a second goal: **Entertainment Utility.**
  *   **The Principle:** *Preference Transparency.* If you pay more than the Expected Value, you must be able to name the non-monetary value you are purchasing (thrill, social bonding, etc.).
  *   **Adjustment:** You said you "flip-flop" here. Stop flip-flopping. She is not irrational. She is buying a ticket to a show that costs $11 and pays back $10. As long as she knows she's paying for the show, she is coherent. The DBA fails here because it conflates *Credence* (belief in rain) with *Bid Price* (willingness to pay). Her credence is 50%; her bid price is higher because she likes gambling.

  **Case 4: Sam (Vague/Refusal)**
  *   **Verdict:** Irrational (Violates Agency).
  *   **Why:** Sam is trying to game the system by having "imprecise credences." But if he refuses a $2 ticket on a 30–70% event (where the break-even is $5), he is acting as if his probability is near 0%.
  *   **The Principle:** *The Norm of Commitment.* If you claim to have a belief, you must be willing to act on it at *some* price. Refusing all action implies you don't actually hold the belief, or you are epistemically cowardly.
  *   **Adjustment:** You said "you can't be tricked... feels like a strange compliment." You are right. Safety is not rationality. Sam is protecting his wallet by lobotomizing his agency. He is irrational because his actions (refusing all bets) do not match his stated state (having a 30–70% belief). He is lying about his confidence to avoid risk.

  **Case 5: The Chem Partner (Diachronic Incoherence)**
  *   **Verdict:** Irrational (Violates Diachronic Coherence).
  *   **Why:** You noticed he changes his mind without new evidence. The standard Dutch Book is static (one moment), but there is a **Diachronic Dutch Book**. If you know someone changes their beliefs arbitrarily, you can bet against them *over time*.
  *   **The Principle:** *Conditionalization.* You may only change your degree of belief if you receive new evidence. Changing belief to be "humble" is not evidence.
  *   **Adjustment:** Keep your verdict. He is irrational. The principle here is stricter than Case 1: it's not just about being consistent *now*, it's about being consistent *with your past self* unless the world changed.

  **Case 6: Grandma (Unsettled Question)**
  *   **Verdict:** Irrational (Violates Calibration/Evidence), but DBA-proof.
  *   **Why:** The Dutch Book requires a bet that can be *settled*. If the bet can never be resolved, no money changes hands, and the Dutch Book evaporates.
  *   **The Principle:** *Suspension of Judgment.* For propositions that cannot be tested in your lifetime, holding a high-confidence belief (90%) is unjustified.
  *   **Adjustment:** You said, "I'm not sure why I brought [bets] up in the first place." You are right. Bets are the wrong tool here. Her irrationality isn't financial vulnerability; it's **dogmatism**. She is violating the Norm of Calibration, not Coherence.

  ---

  ### The Flat Earther Worry

  You asked: *"Someone whose credences are totally coherent but wildly wrong, like 99% the earth is flat... every version of this I've tried comes out saying that person is fine."*

  **You have to live with this.**

  The Dutch Book Argument is a tool for **logic**, not **truth**.
  *   The Flat Earther is **Internally Rational** (Coherent). Their beliefs do not contradict each other.
  *   The Flat Earther is **Externally Irrational** (Uncalibrated). Their beliefs contradict the evidence.

  If you want a principle that condemns the Flat Earther, you cannot use betting arguments. You must use **Evidentialism**: *"It is irrational to hold a belief that is disproportionately high compared to the available evidence."*

  But you cannot combine Evidentialism and Dutch Book Coherence into one "Money-Loss" principle.
  *   **Brother:** Loses money because he is illogical.
  *   **Flat Earther:** Loses reality (but not necessarily money) because he is ignorant.

  ### The Unified Principle You Asked For

  If you need one precise rule to apply in study hall that covers nearly all your cases, use **The Principle of Non-Self-Defeating Commitments**:

  > **"You are irrational if your mental states (beliefs, desires, update rules) combine to guarantee you frustrate your own stated primary aims."**

  Here is how it scores your cases:

  1.  **Brother:** Aim = Make money/Be right. States = Incoherent probs. **Result = Frustrated.** (Irrational)
  2.  **Brother (No Bet):** Aim = Be right. States = Incoherent probs. **Result = Frustrated.** (Irrational)
  3.  **Cousin:** Aim = Have fun + Make money. States = Coherent probs + Love gambling. **Result = Fun achieved, Money lost.** (Rational, *if* fun was the goal).
  4.  **Sam:** Aim = Navigate the world. States = Vague beliefs + No action. **Result = Stagnation.** (Irrational).
  5.  **Chem Partner:** Aim = Track truth. States = Belief shifts without evidence. **Result = Truth tracking broken.** (Irrational).
  6.  **Grandma:** Aim = Know truth. States = High confidence on untestable claim. **Result = Delusion.** (Irrational).
  7.  **Flat Earther:** Aim = Know truth. States = Coherent beliefs + Bad evidence. **Result = Wrong.** (Irrational by Calibration, Rational by Coherence).

  ### Which Verdicts to Overrule?

  You need to overrule your doubt on **Case 3 (The Cousin)**.
  *   **Your doubt:** "Is she irrational for losing guaranteed money?"
  *   **Correction:** No. If she values the thrill, she isn't losing value; she's spending it. The Dutch Book only proves she loses *dollars*, not *utility*. Defend her. She knows the odds; she's just buying entertainment.

  You need to overrule your hope for **Case 4 (Sam)**.
  *   **Your hope:** "At least he can't be tricked."
  *   **Correction:** That is not a compliment. A stone can't be tricked either. Rationality requires the courage to commit to a probability. If you won't bet, you don't have a belief; you have a hesitation. Call him irrational for epistemic cowardice.

  ### Summary for Study Hall

  1.  **Coherence $\neq$ Truth.** The betting argument proves you shouldn't be contradictory, not that you should be right.
  2.  **Money $\neq$ Utility.** People can rationally lose money if they buy something else (fun, thrill) with the difference.
  3.  **Static $\neq$ Dynamic.** You can be coherent today and irrational tomorrow if you change your mind without a reason (Case 5).
  4.  **Safety $\neq$ Rationality.** Refusing to bet (Case 4) makes you safe, but it also makes your beliefs useless.

  If you apply **The Principle of Non-Self-Defeating Commitments**, you keep your intuition on the Brother and the Chem Partner, you vindicate the Cousin, and you accept that the Flat Earther is a different kind of problem that betting can't solve.
