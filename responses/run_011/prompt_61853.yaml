answer: |-
  First, the dump. We need to explain GDP per capita gaps. We need to handle the Africa exception. We must not be racist. We must use instrumental variables. We need to explain China's recent rise. We need to explain the Industrial Revolution's timing. We must account for the slave trade. We need to work for regions, not just sovereign states. We must not be tautological (institutions are good because they make money). We must handle reverse causality. We need to explain why some colonies succeeded and others failed. We must match data from 1500 and 1900. We must explain state capacity. We must explain culture. We must explain geography. Bad ones: Must agree with neoliberal politics. Must use RCTs (impossible for history). Must explain every outlier (invites overfitting). Must be simple (truth is complex). Must be complex (Occam's razor). Sorting: The moral constraints are vital for the book but not the theory's internal logic. The methodological constraints (RCTs) are impossible. The survivors are about identification, timing, and mechanism.

  Here is the spec. These are the conditions a theory must meet to be taken seriously as a causal explanation for long-run comparative prosperity.

  ### The Desiderata

  **1. Ex Ante Codability (Pre-registration)**
  *   **The Case:** A researcher codes "quality of institutions" in 1900 knowing which countries are rich in 2000. They inevitably code the rich countries as having better institutions. This is data mining disguised as theory.
  *   **Requirement:** The key independent variable must be codeable from historical records that existed *before* the outcome diverged, without knowledge of the outcome.
  *   **Status:** **Non-Negotiable.**

  **2. Exogeneity (The Reverse Causality Kill)**
  *   **The Case:** A country gets rich from oil, then uses that wealth to buy better courts and bureaucracies. A theory claiming courts caused the wealth is wrong; wealth caused the courts.
  *   **Requirement:** The proposed cause cannot be purchasable by income. It must be orthogonal to contemporaneous economic success.
  *   **Status:** **Non-Negotiable.**

  **3. The Reversal of Fortune Test**
  *   **The Case:** In 1500, the Aztec and Inca empires were dense and wealthy; North America was sparse. Today, the reverse is true. A theory based on static endowments (e.g., "soil quality") cannot explain why the initially rich places became poor.
  *   **Requirement:** The theory must explain why initial advantages sometimes become liabilities (typically via extraction incentives) and vice versa.
  *   **Status:** **Non-Negotiable.**

  **4. Mechanism Parsimony (Mechanism Budget)**
  *   **The Case:** A theory posits "Culture" causes growth. When asked how, the proponent lists five unobservable psychological traits, two religious doctrines, and a vague social norm. Each link is a place for error to compound.
  *   **Requirement:** Count the unobservable intermediaries between the deep cause and GDP. Cap the number. If the chain is too long, the variance explanation dissolves.
  *   **Status:** **Preference.** (Useful heuristic, but strict caps may exclude complex truths.)

  **5. Scale Invariance**
  *   **The Case:** A theory explains why Europe is richer than Africa but fails to explain why Nogales, Arizona is richer than Nogales, Sonora. If the mechanism changes at the border, is it a theory of development or a theory of sovereignty?
  *   **Requirement:** The mechanism should operate at the household, regional, and national level without fundamental alteration.
  *   **Status:** **Preference.** (Many valid causes, like national monetary policy, are not scale-invariant. Demanding this kills too much.)

  **6. Falsifiable Nulls (Negative Control)**
  *   **The Case:** A theory claims "Protestant Ethic" causes growth. When pointed to poor Protestant regions, the proponent says "they weren't *true* Protestants." This is unfalsifiable.
  *   **Requirement:** The theory must name a place where, on its own logic, prosperity should have taken off and didn't, and admit this failure without ad-hoc rationalization.
  *   **Status:** **Non-Negotiable.** (If you can't specify where you're wrong, you can't be right.)

  **7. The Reversal Test (Hysteresis vs. Convergence)**
  *   **The Case:** A colonial power leaves. Does the colony converge to the global mean (suggesting the cause was temporary policy) or stay poor (suggesting persistent institutional damage)?
  *   **Requirement:** The theory must predict the trajectory after the cause is removed. Does the effect persist (hysteresis) or fade (convergence)?
  *   **Status:** **Non-Negotiable.**

  | Requirement | Status | Rationale for Status |
  | :--- | :--- | :--- |
  | **Ex Ante Codability** | Non-Negotiable | Prevents post-hoc fitting of causes to known winners. |
  | **Exogeneity** | Non-Negotiable | Prevents confusing the purchase of institutions with their creation. |
  | **Reversal of Fortune** | Non-Negotiable | Rules out static geographic determinism. |
  | **Falsifiable Nulls** | Non-Negotiable | Prevents unfalsifiable "no true Scotsman" defenses. |
  | **Reversal Test** | Non-Negotiable | Distinguishes between level effects and persistent traps. |
  | **Mechanism Parsimony** | Preference | Complex mechanisms exist, but simplicity aids verification. |
  | **Scale Invariance** | Preference | Some causes are inherently national (e.g., trade policy). |

  ### The Impossible Trinity

  You are correct to suspect that **Causal Identification + Centuries-Long Lag + Ex Ante Codability** cannot be simultaneously satisfied. Here is the conflict: To identify a cause cleanly (Identification), you need variation that is as-good-as-random. To explain long-run gaps (Centuries-Long Lag), you need variables from the deep past. To avoid cheating (Ex Ante Codability), you cannot use knowledge of the modern outcome to code those past variables.

  The problem is that deep historical data is sparse. The only variables we have coded cleanly from the deep past (geography, climate, distance from equator) are usually static and fail the Reversal of Fortune test. The variables that pass the Reversal test (colonial settlement patterns, institutional quality) are almost always coded by researchers who know the modern outcome, violating Ex Ante Codability.

  **What has to go:** We must abandon the demand for a *single* deep cause identified with the precision of a natural experiment. No single variable from 1500 survives identification scrutiny all the way to 2000 without smuggling.
  **The Replacement:** Replace "Single Deep Cause" with **"Identified Chain of Links."** A theory is acceptable if it can identify the causal link between $T_1$ and $T_2$, and $T_2$ and $T_3$, even if the link between $T_1$ and $T_3$ is not directly identified. We trade the elegance of a single instrument for the robustness of a connected historical narrative where each step meets identification standards locally.

  ### The Most Exclusionary Requirement

  **Ex Ante Codability** does the most work. It knocks out roughly 80% of the popular institutionalist literature. Most theories of institutions code "constraint on the executive" or "property rights protection" using historical narratives written after the fact. When you force the coder to be blind to the 20th-century GDP outcome, the correlation between "good institutions" in 1800 and growth in 2000 weakens significantly. It forces theorists to find archival measures that existed *then* (e.g., mortality rates of settlers, specific legal charters) rather than modern assessments of past quality. It is fatal to any theory that relies on qualitative historical assessment of "state capacity" unless that assessment is derived from raw data (tax records, troop counts) rather than historian consensus.

  ### Ideology in a Lab Coat

  The insistence that **everything be pinned down with a Natural Experiment** is often one camp's ideology wearing a lab coat. In deep history, exogenous variation is rare. Demanding a discontinuity design or an instrumental variable for every claim privileges econometric cleanliness over historical validity. It favors theories where luck (e.g., settler mortality, wind patterns) dominates strategy. This biases the field toward geography and colonial accidents and against theories of deliberate state-building or cultural evolution, simply because the latter are harder to instrument. It is a methodological preference masquerading as an ontological truth.

  ### Camp Failures

  The **Geography/Endowments** camp fails the **Reversal of Fortune** test; they struggle to explain why the tropics were once home to the wealthiest empires unless they smuggle in institutional responses to geography. The **Institutions** camp typically fails **Ex Ante Codability**; their key variables are often coded with knowledge of the outcome, conflating the cause with the result. The **Culture** camp fails **Mechanism Parsimony**; the chain from "belief" to "GDP" is usually a black box of unobservables that adjusts to fit any outcome. The **Colonial-Extraction** camp often fails **Scale Invariance**; they explain cross-country gaps well but struggle to explain within-country regional divergence that isn't tied to colonial borders. None of these failures are necessarily fatal if the camps adopt the "Identified Chain" replacement, but currently, they remain expensive liabilities.
