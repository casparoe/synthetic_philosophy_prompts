answer: |-
  **Question 1**
  You argue monumental history harms engineers by making them feel like latecomers. But doesn't striving require models of what was once possible? Does monumental history have any legitimate use in engineering, or is it purely pathological?

  *   **Success Criteria:** A substantive answer must explicitly concede whether monumental history has any valid function for striving engineers or deny it entirely.
  *   **Expected Answer:** She will likely concede it has a use only if detached from specific heroes, or argue that current industry usage is purely pathological.
  *   **Follow-up:** You assign a canon of papers to your own students. Is that not creating a monumental history for them, and how do you prevent it from becoming the scripture you criticize?

  **Question 2**
  You say history is healthy only if it serves the life of the team. But what if two teams need opposite relations to the same past—one needs the founding myth, one is crushed by it? Who arbitrates that conflict?

  *   **Success Criteria:** The answer must identify a specific agent or mechanism capable of resolving conflicting historical needs between teams.
  *   **Expected Answer:** She will likely suggest the engineering manager must weigh the vitality of each team or look at output metrics to decide.
  *   **Follow-up:** If the arbitrator just asks "which relation serves life better," isn't that criterion just restating the standard it was supposed to operationalize for the manager?

  **Question 3**
  Consider an artifact cited constantly and load-bearing in decisions, but used only to justify not changing anything. Is that healthy antiquarian history or mummification? Can "use" alone distinguish the two?

  *   **Success Criteria:** A substantive answer must distinguish between healthy preservation and pathological stagnation using a metric other than mere citation or usage.
  *   **Expected Answer:** She will likely argue that the *intent* or the *outcome* matters, not just citation count or load-bearing status.
  *   **Follow-up:** If the outcome is stagnation, but the users claim it serves their life by reducing risk, does your framework call that healthy or sick?

  **Question 4**
  The engineer writing a deprecation RFC was formed by the system they are deleting. They cannot step outside it. How do you resolve this contradiction without appealing to a perfect observer?

  *   **Success Criteria:** The answer must explain how a critic embedded in a system can legitimately judge it without claiming external objectivity.
  *   **Expected Answer:** She will likely appeal to process: a sunset policy, a deprecation committee, or a checklist validates the verdict.
  *   **Follow-up:** Can a procedure solve a problem about who the judge is? Also, if the need to rewrite comes from a vendor roadmap, is the verdict really the team's?

  **Question 5**
  You say standing to judge a legacy service belongs to the engineer carrying the pager. Does suffering under a system confer authority to judge it, or only motive to escape it?

  *   **Success Criteria:** A substantive answer must clarify whether pain grants epistemic authority or merely personal motivation to change the system.
  *   **Expected Answer:** She will likely argue suffering grants epistemic access to the flaws that others cannot see.
  *   **Follow-up:** But the person on the pager is often worst placed to see what the system does for teams they never hear from. Does their authority extend beyond their own pain?

  **Question 6**
  Nietzsche values the capacity to forget. What do you say about a team that ships well precisely because it keeps no archive—no ADRs, no history—and outperforms one that keeps everything?

  *   **Success Criteria:** The answer must address whether institutional amnesia can be healthy if it directly correlates with higher performance.
  *   **Expected Answer:** She will likely say institutional amnesia is pathological long-term, or that such teams are merely lucky until they fail.
  *   **Follow-up:** If they outperform consistently for years, is your framework telling them to adopt history anyway, or admitting your standard of "serving life" was wrong?

  **Question 7**
  Consider a fifteen-year-old service: zero maintainers, unreadable code, never caused an incident. The original author is still here and respected. Three teams propose deleting it, two propose freezing it. What does your framework tell us to do? Which mode are you using to answer, and which fact settles it?

  *   **Success Criteria:** A substantive answer must provide a specific verdict, identify the historical mode employed, and name the deciding fact.
  *   **Expected Answer:** She will likely say it depends on what serves the life of the teams, refusing a universal verdict without more data.
  *   **Follow-up:** If you say it depends on the teams, are you avoiding a verdict, or is the verdict simply whatever the majority of maintainers decide?

  **Question 8**
  What observable feature of an organization would show you it is historically healthy rather than sick? Can you name a company that is sick by your lights but doing very well, and how is your framework not unfalsifiable?

  *   **Success Criteria:** The answer must name a specific falsifying condition or a successful company that fits her diagnosis of sickness.
  *   **Expected Answer:** She will likely name a metric like retention or innovation speed, or claim long-term failure is inevitable for sick companies.
  *   **Follow-up:** If a company retains staff and innovates while ignoring history, do you concede they are healthy, or do you redefine health to match your diagnosis?

