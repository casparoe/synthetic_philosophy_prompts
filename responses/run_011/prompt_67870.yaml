      *(Self-Correction during drafting)*: Make sure the infinity doesn't feel magical. It's just... far. The register goes on. The servers hum. The travel takes time.
      *(Check constraint)*: "No character should explain the problem to another character." Keep dialogue focused on the *work*, not the *theory*. They discuss the *form*, not the *paradox*.
      *(Check constraint)*: "End on the auditor doing something." Not thinking, doing.

      *Drafting thought:* How to show the permutation invariance without explaining it? The system calculates the "Value" based on the set of numbers. The system sees {1, 2, 3...} and {2, 3, 4...} as the same set. The display reads "No Variance." Venn sees the individual lines changing. That's the conflict.

      *Drafting thought:* The evasion tactic. Hest suggests "Weighted Temporal Proximity." Venn knows the register is anonymous, so time/location shouldn't matter, but Hest suggests it as a "pragmatic filter."

      *Drafting thought:* Mara's scene. She shouldn't know about the Bureau. She just knows her heater works better. She says something like "It's not nothing to me."

      *Drafting thought:* The ending. Venn stamps it. Or refuses. If Venn stamps it, they violate the rule. If Venn refuses, they violate Pareto. Let's have Venn stamp it. It feels more active. The rule says 0, the human says go. But the rule is the law. So the stamp is an act of rebellion against the arithmetic. Or vice versa. Let's have Venn prepare to stamp "Approved" despite the "0.00" readout.

      *Word Count Management:* I need to expand on the sensory details of the bureaucracy to ensure I hit the length without fluff. The physical weight of the files. The light in the corridor. The specific taste of the coffee.

