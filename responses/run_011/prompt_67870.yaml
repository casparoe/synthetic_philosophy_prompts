      *   **Goal:** Write a story (approx. 2,500 words) for a graduate seminar on infinite ethics.
      *   **Purpose:** To help students *feel* the problem of extending axiology from finite to infinite populations (specifically the paradox of infinite sums/permutations), rather than just understanding it intellectually.
      *   **Setting:** A civilization with countably infinitely many people (Person 1, Person 2, ...). Welfare scores rise without bound (1, 2, 3, ...). Inner worlds poor, frontier worlds rich.
      *   **Protagonist:** An auditor in the office certifying changes to the register (the "Summery" or similar).
      *   **Plot:** A proposal called the "Reshuffle" moves everyone up one notch (1->2, 2->3, etc.). Everyone signed it. The office's valuation rule (permutation invariant) says the change is worth *nothing* (same set of numbers). The auditor must choose to certify (violating the rule) or refuse (violating Pareto intuition).
      *   **Constraints:**
          *   No exposition dumps explaining the math. Show it through procedure/forms/boredom.
          *   No gods, superintelligence, time travel, simulations. Infinity = geography/administration.
          *   No resolving the paradox (no hyperreals, discounting, finite restrictions). One character might suggest these, but it must feel like evasion.
          *   No Pascal's mugging/lottery stuff.
          *   No cosmic irony/shrug ending. End on the auditor *doing* something.
          *   Include a scene with someone from the poor end (Person 1-ish) who doesn't know the theory but knows her improvement matters.
          *   Title: Flat and administrative.
          *   Style: Not parable-like, no moral tucked under the cushion. Good prose (not footnote-like).
          *   Length: Around 2,500 words.

  2.  **Deconstruct the Ethical Problem:**
      *   This is the "Infinite Pareto" problem vs. "Permutation Invariance" (or anonymity).
      *   If $W = (1, 2, 3, ...)$ and $W' = (2, 3, 4, ...)$, then $W' > W$ by Pareto (everyone is better off).
      *   But if the valuation function is anonymous (depends only on the set of values, not who holds them), then $Value(W) = Value(W')$ because the set $\{1, 2, 3, ...\}$ is identical to $\{2, 3, 4, ...\}$ (both are the set of positive integers).
      *   The story needs to embody this tension without stating it explicitly.

  3.  **Character & Setting Development:**
      *   **Protagonist:** Elara? Kael? Let's go with "Auditor Venn". Sounds bureaucratic.
      *   **Setting:** The Bureau of Register Integrity. Endless corridors, filing cabinets that stretch away. The hum of servers or the rustle of paper. Let's go with paper/digital hybrid to emphasize the weight.
      *   **The Poor Person:** Person 142? Someone low down. Let's call her "Mara from Sector 1". She lives in the "Old Dust".
      *   **The Colleague:** Someone who suggests the evasion tactics (discounting, etc.). "Senior Auditor Hest".
      *   **The Object:** The Reshuffle Proposal. Form 88-Beta.

  4.  **Drafting - Section by Section:**

      *   **Title:** Needs to be flat. "Memorandum on Register Adjustment 88-Beta"? "Audit Report: Infinite Frontier"? Let's try: *Bureau of Register Integrity: Case File 9090-Infinity*. Or simpler: *Assessment Protocol 74*. Let's go with *Memorandum on Population Vector Shift*. No, too dry. *Register Adjustment Proposal 88*. Let's settle on: **Audit Report: Sequence Shift Proposal 88**.

      *   **Opening:** Establish the setting and the task. Venn at the desk. The physical sensation of the infinite register. The proposal on the desk.
      *   **The Math as Procedure:** Show the columns. Old score, New score. The visual slide. The stamp that says "Net Change: 0.00".
      *   **The Colleague Interaction:** Hest comes in. Coffee. Discussing the "glitch". Hest suggests the evasion (discounting/finitude) casually, as a workaround that doesn't work.
      *   **The Field Visit (The Poor Person):** Venn needs to leave the office? Or a video call? A site visit feels more grounded. Venn goes to Sector 1. Meets Mara. She talks about her life improving. She doesn't know the math, but she knows the value. This grounds the Pareto intuition.
      *   **The Climax/Decision:** Back at the desk. The committee deadline. The stamp. The choice.
      *   **Ending:** Venn acts. No resolution of the paradox, just the action.

  5.  **Refining the Tone:**
      *   Avoid "Once upon a time."
      *   Avoid "This represents the ethical dilemma."
      *   Keep it grounded in the mundane. The infinity should feel like a backlog that never ends.
      *   Word count check: Need to expand descriptions to hit ~2,500. Focus on sensory details of the bureaucracy. The sound of the stamp. The smell of the coffee. The texture of the forms.

  6.  **Writing - Step-by-Step:**

      *   *Title:* **Audit Report: Sequence Shift Proposal 88**
