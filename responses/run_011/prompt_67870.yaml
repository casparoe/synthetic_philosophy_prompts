answer: |-
  **Memorandum: Register Adjustment Proposal 88**

  The light in the Bureau of Register Integrity did not flicker, because flickering implied a failure of current, and nothing in the Bureau was permitted to fail. It hummed. A low, steady vibration that traveled up through the soles of Auditor Venn's shoes and settled in the teeth. It was the sound of the Register updating itself, row by endless row, as the frontier expanded and new names were added to the bottom of the column.

  Venn sat at Desk 44. On the desk lay a single physical file, thick enough to stop a bullet, labeled *Proposal 88: Sequential Welfare Shift*. Beside it sat the Terminal. The screen displayed two columns of figures.

  Column A: *Current State.*
  Column B: *Proposed State.*

  Venn scrolled. The numbers in Column A began at 1, then 2, then 3, continuing down the screen until the scrollbar became a microscopic sliver of grey on the right-hand edge. These were the welfare scores. Person 1, living in the Core Dust, scored 1. Person 2, in the Outer Rim, scored 2. Person 1,000,000, on the Mid-Frontier, scored 1,000,000. The scores rose without bound. There was no ceiling. The civilization had been expanding for long enough that the population was countably infinite, a fact treated by the Bureau not as a metaphysical wonder but as a storage capacity issue.

  Venn scrolled to Column B.
  Person 1: 2.
  Person 2: 3.
  Person 3: 4.

  Every single entry had increased by exactly one point. It was a universal improvement. A Pareto shift. If this were a finite village, the decision would take seconds. But the Terminal's valuation algorithm, hard-coded to adhere to the Principle of Anonymity, did not care who held the numbers. It cared only about the set of numbers present in the register.

  Venn watched the progress bar at the bottom of the screen crawl. It was calculating the Net Value Change. The algorithm stripped the names from the scores, sorted the values, and compared the resulting distributions.

  *Processing…*
  *Processing…*

  The hum of the room seemed to deepen. Venn rubbed eyes that felt filled with sand. They had been at this for three days. The proposal had been signed by every living person on the Register. Even the illiterate in Sector 1 had made their mark, a smudge of ink next to their ID, because everyone understood that moving from 1 to 2 meant the heating units worked for an extra hour each cycle.

  The Terminal beeped. A single, flat tone.

  **VALUATION DELTA: 0.00**
  **STATUS: NEUTRAL**

  Venn stared at the zero. It was correct. The set of values in Column A was {1, 2, 3, …}. The set of values in Column B was {2, 3, 4, …}. In the arithmetic of the infinite, these sets were indistinguishable. Both contained every positive integer. To an anonymous valuation function, sliding the entire sequence up one notch changed nothing. The shape of the distribution was identical. The mass was infinite in both cases. The difference was undefined, which the Bureau rounded to zero.

  But Person 1 was not a set. Person 1 was a woman who shivered in the dark.

  Venn pushed the file away and stood up. The chair scraped against the polymer floor, a harsh sound in the quiet office. It was time for the corridor walk.

  The corridors of the Bureau stretched in four cardinal directions, disappearing into perspective points that were technically visible but functionally distant. Other auditors walked them, carrying stacks of forms, their faces illuminated by the glow of handheld tablets. They did not speak. There was nothing to say about the work. You either accepted the arithmetic or you resigned, and no one resigned because there was nowhere else to go. The Bureau was the spine of the civilization; without the Register, the resource allocation algorithms collapsed, and the frontier starved.

  Venn found Senior Auditor Hest by the dispensary, staring into a mug of synthetic coffee. Hest was older, their hair greyed by the ambient radiation of the server rooms.

  "Delta came back zero?" Hest asked, not turning around.

  "Zero," Venn said. "Exact match."

  "Standard result for a shift operation on an unbounded sequence." Hest took a sip. "The Committee will reject it. You can't authorize resource expenditure for a null value. Regulation 12-C is clear."

  "Everyone signed it, Hest. Every single signature is in the file. They know what they're getting."

  "They know what they're getting individually," Hest said, turning finally. Their eyes were tired. "But collectively? The collective welfare hasn't changed. You're just shuffling the same infinite deck of cards. If we approve this, we set a precedent. Next week someone proposes shifting everyone up two notches. Then three. We'd be burning fuel for phantom gains."

  "It's not phantom for Person 1."

  Hest sighed, the sound of air escaping a sealed container. "Look, I know. It feels wrong. But the math is the only thing we have that doesn't lie. Feelings aren't aggregable." Hest leaned against the counter. "You could try the Discounting Addendum. Weight the near sectors higher than the frontier. Make the sum converge."

  Venn knew the tactic. It was whispered about in the breakrooms. If you applied a discount rate to welfare based on spatial distance from the Core, the infinite sum became finite. Then the shift would show a positive value.

  "That violates Anonymity," Venn said. "The Register is supposed to be blind to location. Person 1 and Person 1,000,000 count the same."

  "Person 1 is here," Hest said, tapping the counter. "Person 1,000,000 is light-years away. Who cares? Use the discount. It makes the numbers work. The Committee signs off on convergent sums. They reject divergent ones."

  "And when the frontier expands another billion sectors? We adjust the discount rate? We're cooking the books to make the infinity fit the spreadsheet."

  Hest shrugged. "Better than telling Person 1 their life improvement is worth nothing. Or better than refusing the request and having them freeze. Pick your poison, Venn. But don't bring a zero to the Committee. They'll eat you."

  Venn left the coffee untouched. The suggestion hung in the air, a familiar ghost. It was a way of not answering the question by changing the question. It was administrative cowardice dressed as mathematical pragmatism. Venn walked away, the hum of the building seeming to mock the suggestion.

  To clear the head, Venn took the lift down. Not the executive lift, but the service freighter that went to the loading docks. From there, a shuttle to Sector 1. It was against protocol to visit the subjects of an audit, but Venn had clearance, and today, protocol felt like a suggestion written in disappearing ink.

  Sector 1 was the Core Dust. The air smelled of recycled oxygen and old metal. The walls were patched with composite resin, grey and scarred. Venn walked the corridor until they found Unit 142. The door slid open with a grind of gears.

  Inside, the light was dim. A woman sat on a cot, mending a thermal suit. She looked up, startled. She was older, her skin mapped with the lines of a life lived in low-gravity and poor nutrition. Her ID chip glowed faintly on her wrist: *Person 142*.

  "Auditor," she said. She didn't stand. In Sector 1, deference was a luxury they couldn't afford.

  "I'm reviewing Proposal 88," Venn said, standing in the doorway. "I wanted to see the conditions."

  The woman laughed, a dry, cracking sound. "Conditions? You want to know if the shift matters?" She gestured to the heating unit on the wall. It was a box of rusted metal with a single dial. "Right now, that gives me four hours of heat a day. Score 142. If the shift goes through, I get Score 143. That's four hours and twelve minutes. My hands don't freeze when I sleep. I can work the next day. I don't get sick."

  "The Bureau calculates the net change as zero," Venn said. The words felt heavy, ugly in the small room.

  The woman stopped mending. She looked at Venn, not with anger, but with a confusion so profound it looked like pity. "Zero? How can it be zero? I'm warmer. The person in Unit 143 is warmer. Everyone is warmer. Where did the warmth go?"

  "It's… a matter of the total sum."

  "There is no total sum here," she said, pointing to the floor. "There is only this room. There is only my hands. You tell me the math says I don't get better? Then your math is broken. Not me. You."

  She went back to mending the suit. "My grandfather signed the petition. He said if we all move up, we all win. He didn't ask about the total. He just asked if his bed would be warm."

  Venn stood there for a long moment. The hum of the building was absent here, replaced by the wheeze of the air scrubber. There was no infinity in this room. There was only the finite, desperate reality of a single life. The infinite register was a map, but this was the territory. The map said the distance between here and there was unchanged. The territory said the ground was less icy.

  "Thank you," Venn said.

  "Fix your numbers," she said, without looking up. "Don't fix my life. My life is already fixed. It's the numbers that are lying."

  Venn returned to the Bureau as the shift cycle ended. The lights dimmed slightly, signaling the night watch. The office was empty except for the cleaning drones buzzing in the corners. Desk 44 waited. The file lay open. The Terminal screen still glowed with the **0.00**.

  The Committee meeting was scheduled for 0800. Venn had to make a recommendation. *Approve* or *Reject*.

  If Venn recommended *Reject*, the Bureau's rules were upheld. The valuation function remained consistent. Anonymity was preserved. The arithmetic was clean. But Person 142 would freeze. The petition signed by infinity would be discarded because the sum of infinity plus one equals infinity. The Bureau would be right, and the civilization would be colder.

  If Venn recommended *Approve*, the Bureau's rules were broken. The valuation function would be overridden. Precedent would be set that individual gains mattered more than the aggregate distribution. The arithmetic would be declared insufficient. But the resource cost was real. Fuel would be burned to move the scores. If the value was truly zero, was the fuel wasted? Or was the fuel the cost of acknowledging that the map was wrong?

  Venn sat down. The chair was cold.

  They looked at the stamp. It was a heavy thing, made of real wood and metal, kept in a locked drawer. *AUTHORIZED*. Beside it, the red stamp: *DENIED*.

  Venn picked up the *AUTHORIZED* stamp. It felt heavy, significant. To use it was to say that the Bureau's own logic was subordinate to the signatures in the file. It was to say that the infinite set {1, 2, 3…} was not the same as {2, 3, 4…} because the assignment mattered. It was to introduce a variable the system could not process: identity.

  But the system was the only thing holding the frontier together. If auditors started ignoring the valuation algorithms because the results felt uncomfortable, what stopped the next auditor from ignoring them because the results felt convenient? The slope was not just slippery; it was infinite.

  Venn looked at the screen again. **VALUATION DELTA: 0.00**.

  They thought of Hest's coffee. They thought of the discount rate, the easy way to make the numbers converge. They could apply the addendum now. Just a toggle switch. The delta would turn positive. The Committee would approve it. Person 142 would get her heat. The math would be safe.

  Venn's hand hovered over the keyboard. The cursor blinked next to the *Methodology* field.

  *Methodology: Standard Anonymity Protocol.*

  To change it was to lie. To keep it was to deny.

  The cleaning drone buzzed past Venn's ear, a sharp insect sound. The hum of the building vibrated through the desk. It was the sound of millions of servers processing millions of lives, reducing them to integers, sorting them, balancing them. It was a beautiful machine. It was a machine that could not see the heat in a room.

  Venn moved the cursor. They did not select the discount addendum. They left the methodology as it was. They accepted the zero.

  Then, Venn picked up the *AUTHORIZED* stamp.

  They pressed it down onto the form, over the line that said *Net Value Change*. The ink bloomed red, covering the **0.00**. The stamp made a solid, final sound. *Thud.*

  It was a contradiction. The form now stated that the change was valueless, and yet it was approved. It was an administrative error. It was a glitch. It was a record that would confuse the archives for centuries. It was the only way to keep the rule and break it at the same time.

  Venn placed the stamp back in the drawer and locked it. They stood up, turning off the Terminal. The screen went black, erasing the zero, erasing the columns, erasing the problem.

  The file was ready for the Committee. Let them parse the contradiction. Let them argue about the precedence. Let them try to calculate the value of a stamp that overrides the sum.

  Venn walked to the door. The corridor stretched out, infinite in both directions. The hum followed them. They did not look back at the desk. There was work to do, and the Register waited for no one, filling itself with new names, new scores, new zeros that needed to be covered in red ink.
