  Both speakers are correctly identifying that power shapes the archive, but your mate is wrong to conclude that this renders the evidence useless. The record office volunteer is describing a structural silence in the sources, whereas your friend is committing an epistemic error by conflating bias with falsehood. The phrase holds water as a warning about perspective, but collapses if used to dismiss evidence entirely.

