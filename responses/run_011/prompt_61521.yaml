  | **The Archival Filter** | The powerful generate and preserve records (including admin) while the powerless do not. | Empirical / Methodological | Contested but defensible | Literacy and archival resources correlate with status, though administrative debris often survives by accident. | Record Office |
  | **Narrative Hegemony** | The dominant group sets the terms and vocabulary for how the past is understood by later generations. | Conceptual | Contested but defensible | Historians must engage with surviving categories even when challenging them, which frames the debate. | Both |
  | **Evidential Nullification** | Because records are biased towards the powerful, they cannot be used to establish factual truths. | Methodological | Probably false | Bias is itself data; cross-referencing and reading against the grain allows reconstruction of events. | Reading Group (incorrectly) |
  | **Exclusive Authorship** | Only the winning side produces historical accounts; losers never write the record. | Empirical | Probably false | Defeated parties and exiles often produce the most critical surviving histories (e.g. Thucydides). | Neither |

  To the volunteer, I'd suggest that while the silence is structural, the wage books themselves can be read against the grain to reveal resistance or hardship, so the gap isn't total. To your mate, I'd point out that a biased source isn't a useless one; it tells you exactly what the powerful wanted believed, which is a fact in itself. You can acknowledge the distortion without deciding the whole picture is unrecoverable.
