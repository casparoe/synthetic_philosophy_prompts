answer: |-
  This is a sophisticated pedagogical challenge. You are trying to simulate a methodological aporia (the tension between determinacy and tautology in functional explanation) without triggering the ideological defenses your students have already erected. The key is to make the *structure of the game* generate the problem, so that when you name it in the debrief, it feels like a description of their experience rather than a lecture on Cohen.

  Below is a complete run-sheet for the 110-minute section.

  ### 1. Logistics and Composition

  *   **Teams:** 4 Teams of 4 students.
      *   **Composition:** Place one of the Economics concentrators on **Team Alpha** and the other on **Team Beta**. Distribute the sympathetic students evenly. This prevents the skeptics from consolidating into a "opposition bloc" and forces them to collaborate with sympathizers to win points.
  *   **Room Setup:** Four clusters of tables. Whiteboard divided into four quadrants (one per team) for scorekeeping.
  *   **Materials:**
      *   **The Dossiers:** 4 distinct "Society Packets" (printed on different colored paper for easy sorting).
      *   **The Menu:** A handout listing the superstructural categories.
      *   **Index Cards:** Two colors (e.g., White for "Predictions," Yellow for "Criteria").
      *   **Validity Tokens:** Small slips of paper cut by the TA. These are the currency.
  *   **TA Role:** The TA is the "Registrar." They collect cards, shuffle them, track the "Revision Rate" on the board, and distribute tokens. They do not intervene in content.

  ### 2. The Fictional Societies (The Dossiers)

  Each dossier is one page. They must be distinct enough that a *determinate* theory should produce distinct superstructures, but vague enough to allow interpretation.

  **Society 1: The Irrigation Empire**
  *   **Forces:** High agrarian surplus dependent on massive, centralized hydraulic works. Technology is stable but labor-intensive.
  *   **Relations:** State owns the water; peasants hold usufruct rights conditional on corvée labor. No private land market.
  *   **Class:** Bureaucratic elite (engineer-priests) vs. Village communes.
  *   **Constraint:** Arid environment; collapse of infrastructure means immediate famine.

  **Society 2: The Merchant League**
  *   **Forces:** Maritime trade, movable capital, light manufacturing (textiles). Technology changes rapidly via competition.
  *   **Relations:** Private property absolute. Contract law is the primary social glue. Wage labor common in cities.
  *   **Class:** Bourgeoisie (merchants) vs. Proletariat vs. Landed Gentry (declining).
  *   **Constraint:** Vulnerable to blockade; requires naval protection and credit stability.

  **Society 3: The Frontier Collective**
  *   **Forces:** Land abundant, labor scarce. Low-tech subsistence plus extractive export (furs/timber).
  *   **Relations:** Customary tenure. No enforcement of debt. High mobility of population.
  *   **Class:** Fluid; status based on reputation and kinship networks rather than capital.
  *   **Constraint:** If authority becomes too coercive, population flees to the hinterland.

  **Society 4: The Factory State**
  *   **Forces:** Machine production, high fixed capital, dense urbanization. Energy dependent (coal/steam).
  *   **Relations:** Wage labor universal. Property concentrated in corporate entities.
  *   **Class:** Capitalists vs. Industrial Workers. High class consciousness.
  *   **Constraint:** Production stops if workers strike; requires constant expansion of markets.

  ### 3. The Superstructural Menu (Handout)

  Teams must generate specific content for these six categories. No abstract terms allowed (e.g., cannot write "Religion supports the state"; must write "Religion teaches X").

  1.  **Household Form:** (e.g., Patriarchal extended, Nuclear, Communal, Matrilineal).
  2.  **Contract Law:** (e.g., Sacred oath, Written formalism, Customary handshake, State-administered).
  3.  **Inheritance:** (e.g., Primogeniture, Partible, State reclamation, Meritocratic).
  4.  **Political Authority:** (e.g., Divine Right, Republican, Technocratic, Syndicalist).
  5.  **Dominant Virtue:** (e.g., Piety, Thrift, Loyalty, Solidarity, Innovation).
  6.  **Cosmology/Religion:** (e.g., Cyclical time, Linear progress, Ancestor worship, Rational atheism).

  ### 4. Run-of-Show (110 Minutes)

  #### **00:00 – 00:10: Setup and Framing**
  *   **Instructor:** "Today is not about whether Marx was right. It is about whether a specific *kind of claim* can do work. You are not activists or critics today; you are Structural Engineers. Your job is to make the building stand."
  *   **TA:** Distributes teams. Gives Team Alpha & Beta Society 1; Team Gamma & Delta Society 2 (for Round 1).
  *   **Rule:** No grades. Winning team gets "Theoretical Sovereignty" (they choose the opening prompt for next week's section). Currency is Validity Tokens.

  #### **00:10 – 00:35: Round 1 (The Asymmetry Drill)**
  *   **Goal:** Experience the constraint asymmetry.
  *   **Action:**
      *   Teams Alpha & Beta receive **Society 1 Base**. Task: Predict the **Dominant Virtue** and **Household Form**. (10 mins).
      *   Teams Gamma & Delta receive **Society 1 Superstructure** (pre-written by you, see *Note Below*). Task: Infer the **Level of Productive Forces**. (10 mins).
      *   *Note:* You must pre-write a plausible Superstructure for Society 1 that is not uniquely identifying (e.g., "Patriarchal Extended Household; Virtue of Piety").
  *   **Scoring:**
      *   Predictors (Alpha/Beta): Get 1 token if their prediction matches the pre-written reality within reason. (Usually easy).
      *   Inferers (Gamma/Delta): Get 1 token only if they specify the *exact* technological constraint (Irrigation). (Usually hard).
  *   **Debrief (2 mins):** Ask: "Which task felt more constrained?" (Do not explain why yet).

  #### **00:35 – 01:15: Round 2 (The Matching Game)**
  *   **Goal:** Test discriminating power (Non-discrimination).
  *   **Action:**
      *   Each team is assigned a *different* Society (Alpha=1, Beta=2, Gamma=3, Delta=4).
      *   **Task:** Fill out the **Superstructural Menu** for that society. You must argue *why* these items suit the Base. (20 mins).
      *   **Submission:** Teams write their 6 items on White Index Cards. Do not write the Society Name on the card.
      *   **The Shuffle:** TA collects cards, shuffles, and redistributes. Team Alpha gets Team Beta's cards, etc.
      *   **The Match:** Teams look at the Superstructure cards they received. They must guess which Society (1, 2, 3, or 4) produced them. They write their guess on a slip and hand to TA.
  *   **Scoring (The Trap):**
      *   **Writer Team:** Gets 2 tokens **only if** all other teams correctly identify their Society. (This forces specificity).
      *   **Guesser Team:** Gets 1 token for every correct identification.
      *   **The Twist:** If the Writers were too vague (e.g., "Virtue: Hard Work"), the Guessers will guess randomly. Writers get 0. If Writers were too specific but wrong (e.g., "Virtue: Worship of the Steam Engine" for a Feudal society), Guessers get it right, Writers get 0 (for theoretical incoherence).
      *   *Wait, refine:* To make the point about non-discrimination, we want to see if explanations are interchangeable.
      *   **Revised Scoring:** Writers get points if Guessers agree on a match (Consensus). TA records Consensus Rate. Then TA reveals the *Actual* Match.
      *   **Key Metric:** If Consensus is High but Accuracy is Low, the explanation is **Compelling but Non-Discriminating**.
  *   **TA Action:** Record on board: "Consensus Rate" vs. "Accuracy Rate."

  #### **01:15 – 01:45: Round 3 (The Suitability Trap)**
  *   **Goal:** Experience the selection/revision problem (Functional Explanation).
  *   **Action:**
      *   Return teams to their original Societies.
      *   **Step 1 (Ex Ante):** On Yellow Cards, write a **Rule of Suitability**. Example: "A suitable legal system must protect the primary mode of surplus extraction." (5 mins). Hand to TA.
      *   **Step 2 (The Anomaly):** Instructor hands out a "Historical Anomaly" slip for their society.
          *   *Example for Society 1 (Irrigation):* "Despite the need for centralization, the legal code emphasizes individual property rights."
          *   *Example for Society 4 (Factory):* "Despite class conflict, the dominant virtue is 'Brotherhood' rather than 'Discipline'."
      *   **Step 3 (Revision):** Teams must decide: Does your Rule of Suitability cover this? If not, you may revise the Rule. (10 mins).
      *   **Step 4:** Hand in revised rules (marked with a star if changed).
  *   **Scoring:** No tokens. The score is the **Revision Rate**.
  *   **TA Action:** Count how many teams revised their rule *after* seeing the anomaly. Write percentage on board.

  #### **01:45 – 01:55: The Debrief**
  *   **Instructor:** Bring attention to the board.
      1.  **Asymmetry:** "Why was predicting easier than inferring?" (Base underdetermines Superstructure).
      2.  **Matching:** "Look at the Consensus vs. Accuracy." If Accuracy was low, your explanations were persuasive but could have belonged to anyone.
      3.  **Revision:** "Look at the Revision Rate." If you changed your rule to fit the outcome, you engaged in **Functional Explanation**.
  *   **The Reveal:** "The term for this is *functional explanation*. Cohen defends it; Elster attacks it. Next week, you will read Elster. You now have the data for his critique."

  #### **01:55 – 01:50: Buffer/Cleanup**
  *   Collect materials.

  ### 5. Scoring Scheme (Validity Tokens)

  *   **Currency:** Paper slips cut by the TA.
  *   **Round 1:** 1 token for correct prediction/inference.
  *   **Round 2:** 2 tokens for Writers if Guessers identify correctly. 1 token for Guessers per correct ID.
  *   **Round 3:** No tokens. The "score" is public data on the board.
  *   **Winning:** Team with most tokens chooses next week's opening question.
  *   **Why this works:** It creates competitive pressure to be *specific* (to win Round 2), which makes them vulnerable to being *wrong* (losing Round 2), which mirrors the risk of falsification the Skeptics want.

  ### 6. Risk Analysis: What Will Go Wrong

  **1. The Vagueness Game (Predictable)**
  *   **The Problem:** A team (likely the Sympathizers) will realize that if they write "The religion supports the economic base," it fits any society. They cannot be matched incorrectly, but they cannot win points because Guessers won't know which one it is.
  *   **The Fix:** Do not punish this with a rule. **Let the scoring punish it.** If they write vaguely, the Guessers will fail to identify the society. The Writers get **zero tokens**. The Sympathizers want to win. They will be forced by the game mechanics to take a risk and be specific.
  *   **Debrief Use:** If a team *does* manage to win with vague terms (because Guessers guessed lucky), highlight this in the debrief as evidence of the "Non-Discriminating" problem.

  **2. The "Design" Fallacy (Predictable)**
  *   **The Problem:** Students will write superstructures as if the Bureaucrats *planned* them to suit the base (e.g., "The priests invented this religion to keep peasants working"). This reintroduces intentionality, which bypasses the functional explanation problem.
  *   **The Fix:** Add a constraint to the instructions: *"You are not the rulers. You are an observer deducing what must exist. Do not use words like 'create,' 'design,' or 'intend.' Use 'emerges,' 'persists,' or 'dominates'."*
  *   **Debrief Use:** If they slip up, point out that Cohen's defense does not require conscious intent, only a selection mechanism. The game made them designers; history does not have a designer.

  **3. What The Activity Cannot Reproduce (Crucial for your prep)**
  *   **Diachronic Depth:** You are correct. The activity is **synchronic** (fit at one moment). Cohen's defense relies on the **diachronic** disposition of productive forces to grow over time, selecting relations that facilitate that growth. The game cannot simulate the "selection over centuries." You must supply this in the debrief: *"You tested for fit. Cohen argues for selection over time. Elster asks: what is the mechanism of that selection?"*
  *   **The Mechanism Gap:** The game assumes the fit *exists*. It does not show *how* the unsuitable societies disappear. Elster's critique is precisely about the missing micro-foundations for that disappearance. The game hides the mechanism; Elster exposes it.
  *   **Normative Neutrality:** The game treats "Suitability" as technical. In Marx, "Suitability" is often tied to class power. The game abstracts away the violence/coercion required to maintain the fit. You should note this: *"You treated 'suitability' as a puzzle. For Marx, 'suitability' is often enforced by the state."*

  ### 7. Instructor's Cheat Sheet for the Debrief

  When you introduce "Functional Explanation" in the last 10 minutes, use this script structure:

  1.  **Point to the Revision Rate (Round 3):** "80% of you changed your rule after seeing the outcome. In philosophy, we call this *adjusting the criterion of suitability to fit the fact*."
  2.  **Point to the Matching Accuracy (Round 2):** "Your explanations were compelling enough that you agreed on where they belonged, but often wrong. This means the explanation was *plausible* but not *discriminating*."
  3.  **The Name:** "This structure—explaining a cause by its effect, where the criterion of 'fit' is determined by the outcome itself—is what Elster calls **Functional Explanation**."
  4.  **The Bridge:** "Cohen says this is valid in history. Elster says it is magic without a mechanism. Next week, you will see why the mechanism matters."

