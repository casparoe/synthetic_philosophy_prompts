prompt: |-
  ok so i stayed up way too late arguing with my roommate about forgeries and I still think she's wrong but I can't get her argument to collapse, which is annoying, so I want to try something different: run it through my own vocabulary and see what's left over.

  About me: I'm a release/build engineer. My whole working life is reproducibility and provenance — content-addressed storage, bit-for-bit reproducible builds, signing artifacts, attestations, SBOMs, provenance graphs. I'm extremely fluent in this, so don't explain any of it back to me, just use it.

  Her position, as she stated it: a perfect forgery — one that no expert, now or ever, could tell from the original by looking — is nonetheless aesthetically worse, and a museum that quietly hung it would be doing something wrong even though nobody in the building could tell. She leaned on Goodman's point in Languages of Art that the mere possibility of a difference between two pictures is enough to make an aesthetic difference, since learning to tell them apart is part of training perception; and on Dutton's split between nominal authenticity (correct attribution, not a forgery) and expressive authenticity (a work genuinely issuing from the person or culture it comes from), plus his line that a forgery misrepresents the history of the work's production. I know roughly where these are going. I don't want a summary.

  What I want: translate her position, as faithfully as you can, into hashes, signatures, build graphs, attestations and reproducible output. Then give me the residue report, in four parts — (1) which of her claims have an exact counterpart in my world, and whether there's any case where two byte-identical artifacts are genuinely not interchangeable for me, since that'd be a foothold for her; (2) which ones you had to bend to make fit, and exactly where you bent them; (3) which ones have no expression at all in my vocabulary; (4) your verdict on whether the residue shows my framework is missing a concept — it literally can't represent how a thing came to be as part of what the thing is — or whether her claim was murkier than it sounded and the untranslated bit is doing hidden work.

  Run these through the translation too, not just the general argument: a binary I rebuild bit-for-bit from completely different source than the original authors used; an estate-authorized recast from the original mold, honestly labelled; and the nasty one — a forgery that's better than anything the period it fakes actually produced. Does your translation have anywhere to put "worse" in that last case?

  Two ground rules. Don't smuggle my side in: "same bytes, therefore same object, therefore nothing more to say" is the thing under question, not a premise you get to assume. And keep her moral point (the deception) separate from her aesthetic point (the work is worse) as far as the vocabulary allows — she kept sliding between them and I want to know whether my framework forces them apart or whether the slide is actually load-bearing for her.
