          *   In builds, if the attestation is lies, the artifact is *toxic*. Is "toxic" moral or functional? It's functional risk.
          *   The roommate claims the *art* is worse. In builds, the *binary* isn't worse, the *pipeline* is compromised. This suggests the roommate is conflating the object with the process.
      *   *Goodman's Point:* "Learning to tell them apart." In builds, we automate this. We don't "train perception," we enforce policy. If the policy can't tell them apart (hash collision), we are vulnerable. The *risk* is the aesthetic difference? No, that's a stretch.

