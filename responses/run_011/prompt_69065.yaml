answer: |-
  **The Machinery of Cascades: A Clinic Scenario**

  An information cascade occurs when it becomes rational for individuals to ignore their private information and mimic the actions of predecessors. In your clinic network, this happens not because administrators are sheep, but because the public history of decisions overwhelms the private evidence from their pilots. To understand where popular accounts fail, we must distinguish between the *internal* logic of the cascade and its *external* stability.

  **1. The Fragility Contradiction**
  The apparent contradiction arises from conflating two types of information. Inside a cascade, actors ignore *private* signals. If Clinic 3 sees Clinics 1 and 2 adopt, the public belief that the protocol is good may be so high that even a negative pilot result from Clinic 3 cannot lower that belief below the adoption threshold. Rationality dictates ignoring the pilot. In this sense, the cascade is robust; private dissent changes nothing.

  However, cascades are fragile to *public* information. If Clinic 3 were to publish its pilot data (a public signal) rather than just its decision, that data enters the public pool directly, bypassing the ambiguity of the action. A single sufficiently strong public signal can reset the public belief, shattering the consensus. Thus: cascades are permanent against private information but fragile against public disclosure. Popular accounts often claim cascades are "fragile" without specifying that this requires breaking the rule of the game (hiding data) to fix the outcome.

  **2. The Arithmetic of Adoption**
  Let $G$ be the event the protocol is Good, and $B$ that it is Bad. Prior probability $P(G) = 0.5$.
  A "typical" pilot generates a signal $S$ (Adopt recommendation) or $R$ (Reject recommendation). Accuracy $p = P(S|G) = P(R|B) = 0.65$.
  We use Likelihood Ratios (LR). For one adoption, $LR = p / (1-p) = 0.65/0.35 \approx 1.86$.

  After two concordant adoptions, the public odds are $1 \times (1.86)^2 \approx 3.45$.
  The posterior probability of $G$ is $3.45 / (1 + 3.45) \approx 0.775$.
  Clinic 3 should adopt if its expected value is positive. Assuming symmetric payoffs, it adopts if $P(G | \text{History, Signal}) > 0.5$.
  To *withhold* adoption (Reject) despite the history, Clinic 3's private signal $R$ must swing the odds back below 1. Let $q$ be Clinic 3's pilot accuracy. The LR of a Reject signal is $(1-q)/q$.
  We require: $\text{Public Odds} \times \text{Private LR} < 1$.
  $3.45 \times \frac{1-q}{q} < 1 \Rightarrow 3.45(1-q) < q \Rightarrow 3.45 < 4.45q \Rightarrow q > 0.775$.

  Clinic 3 needs a pilot accuracy exceeding 77.5% to contradict the two predecessors. As the run of adoptions lengthens to $N$, the required accuracy approaches 1. If pilot quality is bounded below certainty (e.g., no pilot can exceed 90% accuracy), a cascade becomes unbreakable by private signals once $N$ is large enough.

  **3. The Nature of the Loss**
  The harm is an *information externality*, not a *payoff externality*. In a payoff externality (like congestion), my adoption physically reduces your benefit. Here, my adoption costs you nothing directly. The loss is epistemic.

  When Clinic 3 ignores its pilot to follow the crowd, its private data is lost to the system. Observers see Clinic 3's action, but they cannot infer Clinic 3's data, because the action was determined by history, not data. Consequently, the public information stock stops growing. Even as the number of clinics grows to infinity, the total accumulated information remains bounded by the few decisions made *before* the cascade started. The group fails to aggregate the dispersed knowledge of the later clinics. This differs from conformity, where actors match neighbours for social reward; here, actors match neighbours to maximize medical accuracy, but inadvertently impoverish the group's knowledge.

  **4. Precision and the Long Tail**
  Your scenario specifies a long tail of pilot sizes. This distinction between *bounded* and *unbounded* signal precision determines the long-run outcome.

  *   **Bounded Precision:** If all pilots have a maximum accuracy cap (e.g., 95%), a wrong consensus is permanent. Eventually, the public history outweighs any possible private signal. Truth is not identified.
  *   **Unbounded Precision:** If the long tail allows accuracy arbitrarily close to 1 (e.g., a clinic with 100,000 cases), a wrong consensus is *not* permanent. Eventually, a "tail" clinic will arrive with a signal strong enough to outweigh the entire prior history. Truth is eventually identified.

  Regarding fragility: In the bounded case, a consensus is "fragile" only to public data disclosure. In the unbounded case, it is "breakable" even by private action, because eventually, a private signal will be strong enough to trigger a reversal. The popular claim that "cascades are always fragile" is false; it depends entirely on whether signal precision is bounded.

  **5. Observability and Inference**
  From the decision sequence alone (Adopt, Adopt, Adopt...), an observer cannot distinguish an information cascade from simple conformity (preference for matching). Both produce identical records of herding.

  To separate them, you need an observable that reacts to *data*. If one clinic publishes its pilot data:
  *   **Cascade Prediction:** Subsequent clinics will update their beliefs based on the data. If the data contradicts the history, the chain of adoptions may break.
  *   **Conformity Prediction:** Subsequent clinics will ignore the data and continue matching the majority to maintain social alignment.

  Publishing data acts as a diagnostic test. If the sequence shifts, it was a cascade (rational learning). If the sequence holds, it was conformity (social preference).

  **6. Uncertainty About Quality**
  If clinics cannot observe pilot sizes (signal quality), the cascade logic survives but becomes noisy. Clinic 3 does not know if Clinic 2's adoption was based on a strong signal or a weak one forced by history. Clinic 3 must infer the *probability* that Clinic 2 was in a cascade.

  This higher-order uncertainty dampens the weight of prior actions. Learning slows down because each action is a less reliable indicator of private information. However, unless uncertainty is extreme, the qualitative result holds: eventually, the weight of numbers overwhelms the individual signal. The "long tail" becomes harder to utilize because a large clinic cannot signal its size through its action alone; it must publish data to leverage its precision.

  **7. Myths and Safe Claims**
  Popular accounts often sacrifice precision for narrative. Here are corrections for your column:

  *   **False:** "Cascades happen because people are irrational or afraid to stand out."
      *   **Correction:** "Cascades happen because rational actors weigh public history heavier than private evidence."
  *   **False:** "A cascade means the group has reached the wrong decision."
      *   **Correction:** "A cascade means the group has stopped accumulating new information; the decision may be right or wrong."
  *   **False:** "Cascades are easily broken by new evidence."
      *   **Correction:** "Cascades are robust against private evidence; only public disclosure of data can reliably break them."

  **Safe Claims for Your Network:**
  1.  If clinics only see decisions, the network's collective wisdom is capped by the first few pilots, regardless of how many clinics join later.
  2.  A clinic with a massive pilot (the long tail) should publish its data, not just its decision, to prevent the network from locking into error.
  3.  Observing a long run of identical decisions tells you nothing about the quality of the protocol, only that private information has ceased to influence public action.

  In sum, the machinery of cascades is not a failure of will, but a failure of transmission. The cost is not in the matching, but in the silence that follows.
