answer: |-
  (1) Bottom line
  We recommend adopting a rank-dependent, risk-weighted expected utility rule for grants involving irreversible ecological risks, rather than strict expected-value maximization. Under this rule, the assisted gene flow pilot is rejected. The certain nursery outplanting option yields higher risk-weighted value because the catastrophic loss branch is overweighted relative to its probability. This rule preserves linear valuation of coral hectares while encoding prudent aversion to ruinous tail risks. Program officers should apply this standard to all proposals where losses are irreversible, concentrated, and poorly pooled.

  (2) The arithmetic, checked
  Straight expected value (EV) for the pilot is $0.99(300) + 0.01(-20,000) = 97$ hectares. The alternative is certain +80 hectares. EV favors the pilot by 17 hectares. The analyst's claim that the certain option wins by roughly 180 hectares under a risk-weighted rule is arithmetically consistent with doubling the weight on the 1% branch, but the description of the mechanism requires correction. Squaring the cumulative probability directly ($0.01^2$) reduces the weight to 0.0001, which would favor the pilot even more strongly. To achieve the analyst's result—weighting the 1% branch at approximately 2%—we must apply the quadratic transformation to the complement cumulative probability ($1 - (1-p)^2$). Using this risk-averse specification, the pilot's value becomes $0.98(300) + 0.02(-20,000) = -106$ hectares. Compared to the certain 80 hectares, the certain option wins by 186 hectares. The conclusion holds, provided the risk function is specified to overweight losses.

  (3) What the rule is actually doing
  This rule separates risk attitude from value judgment. A concave utility function implies diminishing marginal value of hectares—an ethical claim that the 300th hectare matters less than the first. Mean-variance optimization penalizes upside volatility equally with downside risk, which is inappropriate for conservation where more coral is always better. Rank-dependence keeps utility linear (every hectare counts equally) but distorts probability weights based on outcome ranking. It allows us to say that while a hectare is a hectare, the *chance* of losing 20,000 hectares commands more decision-weight than its frequency suggests. This captures risk aversion purely as an attitude toward uncertainty structure, not as a claim about the distributive value of ecological assets. It aligns with the intuition that avoiding system collapse is lexically prior to maximizing average cover, without abandoning quantitative analysis.

  (4) The case for a risk-weighted rule
  The primary argument is the irreversibility of the catastrophic branch. A loss of 20,000 hectares represents a system collapse that cannot be remedied within the 2100 horizon. Expected-value maximization treats this as a swapable commodity against gains elsewhere, which contradicts the foundation's mandate for resilience. Furthermore, the CFO's invocation of Arrow-Lind is misplaced. That theorem assumes risks are spread thinly across many bearers; here, the loss is concentrated on one reef system and its dependent species, while benefits accrue elsewhere. There is no population across which to pool this risk. Additionally, the 1% probability is a subjective judgment, not a frequentist frequency. Under ambiguity, prudent agents should act as if low-probability catastrophes are more likely than the point estimate suggests. A risk-weighted rule formalizes this precautionary stance. It respects the asymmetry of the outcome space: gaining 300 hectares is beneficial, but losing 20,000 is existential. By overweighting the tail, we ensure that no single grant decision threatens the foundational ecological capital we are paid to protect.

  (5) The case against it
  The strongest objection concerns dynamic consistency. Rank-dependent rules violate the sure-thing principle, exposing the foundation to "money pumps"—sequences of choices that leave us worse off than where we started. A trustee committed to expected value will rightly ask why we accept a decision rule that can be exploited. Second, the ambiguity point suggests we are solving the wrong problem. If the 1% is a guess, robust decision-making (requiring acceptability across a range of probabilities) is more honest than dressing ambiguity as risk via weighting functions. Third, whose risk attitude counts? Three consulted communities support the pilot; two oppose it. Nonhuman residents cannot consent. Imposing the board's risk aversion may override local willingness to gamble for resilience. Finally, complexity matters. Expected value is transparent; rank-dependence requires explaining why probabilities are being distorted. If staff cannot reliably specify the risk function, the rule introduces noise rather than prudence. These are not merely technical quibbles; they challenge the legitimacy and stability of the governance framework.

  (6) Recommended policy and a screening test
  We recommend a hybrid policy. Use expected-value maximization for reversible, pooled, or low-stakes grants. Use the risk-weighted rule only when specific criteria are met. Program officers must apply the following screening test before submitting high-stakes proposals:
  1. Reversibility: Is the negative outcome irreversible on a relevant timescale? If yes, flag for risk-weighting.
  2. Pooling: Is the risk spread across many independent systems? If no (concentrated loss), flag for risk-weighting.
  3. Probability Robustness: Is the probability estimate based on frequentist data or expert judgment? If judgment (ambiguity), apply a sensitivity range. If the proposal fails under plausible upper-bound estimates of loss probability, reject.
  4. Stakeholder Consent: Do affected communities unanimously support the risk? If divided, the foundation's risk aversion defaults to the precautionary position.
  For the pilot, all four flags are triggered. The loss is irreversible, concentrated, based on judgment, and contested. Therefore, the risk-weighted rule applies, and the pilot is rejected. This ensures consistency without burdening every small grant with complex calculus.

  (7) What would change our minds
  We would reconsider the pilot if new evidence substantially alters the risk profile. Specifically: if independent verification lowers the catastrophic probability below 0.1%; if a credible insurance mechanism emerges to compensate for the 20,000-hectare loss (effectively pooling the risk); or if the divided island communities reach a consensus supporting the release. Additionally, if the foundation's endowment strategy shifts to explicitly hedge ecological tail risks, the grants side might afford greater risk tolerance. Until then, the precautionary weight assigned to irreversible collapse remains the governing constraint.
