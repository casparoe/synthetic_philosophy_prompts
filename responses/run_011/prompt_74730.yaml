prompt: |-
  You're a professional philosopher who works on population ethics and intergenerational justice — basically the person I wish I could slack whenever our modeling assumptions get philosophically sketchy. Please think hard about this before answering, and start with a short brainstorm / checklist of the assumptions in my reasoning you'd want to poke at, then get into the substance. No jargon without defining it — I'm a software engineer, zero formal philosophy.

  Situation: I'm building an optimizer for long-horizon public-infrastructure planning, i.e. which projects do we fund if you're thinking ~150 years out. Right now the objective function has a big fat term for the welfare of future populations, and its slowing everything down and dragging in a ton of arbitrary parameters.

  Then I read up on the nonidentity problem and I think it means I can just delete that term. My reasoning: pretty much any policy we pick shifts the timing of everything downstream, so the specific people alive in 2200 under option A are a completely different set of individuals than under option B. And the ones who do exist can't have been harmed by our choice, because the alternative for each of them was never existing at all, and their lives are worth living. So nobody is worse off than they'd otherwise have been, so there's nobody to complain. I thought that was roughly Parfit's point — that worrying about future generations is a dead end?

  Concrete case: a fast-growth, coal-heavy buildout leaves the people in 2200 poorer per capita and with a much worse climate, but there are more of them, and none of them would exist under the renewables program. So per the nonidentity thing, the coal option isn't worse for anybody, and my optimizer shouldn't be penalizing it.

  We'd still keep counting effects on people who are already alive or who are going to be born no matter what we choose — that's not identity-affecting, so it stays in. And we already apply a discount rate to anything in the future, which I'm pretty sure is the accepted way of handling this stuff anyway.

  So: how do I cleanly strip the future-population term out? Where exactly does the line fall between choices that change who exists and choices that don't — because if its basically everything, I feel like I can delete way more than I thought. And what objections would I need an answer for when I present this to the team?
