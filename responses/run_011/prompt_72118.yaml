answer: |-
  # JOINT STATEMENT ON THE EM COIN FLIP CASE
  **Prepared by:** The Anthropics Reading Group (SSA & SIA Representatives)  
  **Date:** End of Term  
  **Subject:** Resolution of Disagreements regarding the 1000-vs-2 Emulation Scenario

  ## 1. AGREED PREMISES
  Before detailing our divergence, we affirm the following shared foundations. We agree that any viable anthropic theory must respect these constraints:

  1.  **The Setup:** A fair coin is flipped ($P_{prior}(Heads) = 0.5$).
      *   **Heads:** 1,000 emulated observers (ems) are instantiated from a single brain scan.
      *   **Tails:** 2 emulated observers are instantiated from the same scan.
  2.  **Isolation:** The ems are causally isolated from one another and the external world upon instantiation. No communication is possible.
  3.  **Indexical Certainty:** Upon waking, an em is certain only of their own existence and qualitative state ("I am an em in this experiment"). They possess no non-indexical information about the coin outcome or their specific copy number.
  4.  **Bayesian Framework:** Updates on the coin outcome must proceed via Bayes' Theorem, conditioning on the available evidence ($E$). The disagreement lies strictly in the likelihood term $P(E | Hypothesis)$.
  5.  **Betting Relevance:** Probabilities are cashed out in terms of fair betting odds. A "fair bet" is one where the expected value is zero given the agent's credence.

  ## 2. POSITIONS TABLE
  We characterize our respective positions below. We have reviewed these descriptions and confirm that neither constitutes a strawman of the other's view.

  | Feature | **SSA Position (Self-Sampling Assumption)** | **SIA Position (Self-Indication Assumption)** |
  | :--- | :--- | :--- |
  | **Core Principle** | Reason as if you are a random sample from the set of *actual* observers in your reference class. Do not update priors based merely on the *number* of observers created. | Reason as if you are a random sample from the set of *possible* observers. Hypotheses that posit more observers receive a likelihood boost proportional to their count. |
  | **P(Heads \| Wake)** | **0.5 (1/2)**. The coin is fair. Your existence was guaranteed in both branches (the scan existed), so waking up provides no new non-indexical information. | **~0.998 (500/501)**. You are 500 times more likely to find yourself existing in the Heads world because it contains 500 times more observer-moments. |
  | **Fair Betting Odds** | **1:1**. You should be indifferent to a bet paying \$1 on Heads vs. \$1 on Tails. | **500:1**. You should bet heavily on Heads. A bet paying \$1 on Heads is worth 500 times a bet paying \$1 on Tails. |
  | **Identical Copies** | **Ambiguous/Contextual.** If copies are qualitatively identical, they may share the same "identity" for reference class purposes. However, for betting, we treat them as distinct *slots* to avoid Dutch Books. | **Distinct.** Physical instantiation matters. Even if qualitatively identical, 1,000 physical substrates constitute 1,000 distinct centers of consciousness. |
  | **Presumptuous Worry** | **Accepted.** We prefer this risk over the alternative. It is better to be unpresumptuous about the world's size than to infer cosmology from mere existence. | **Rejected.** The "Presumptuous Philosopher" objection relies on an intuition that fails in large-world scenarios. Indexical evidence *does* constrain worldly hypotheses. |

  ## 3. CRUXES AND PRE-REGISTERED TESTS
  We identify two core cruxes driving our disagreement. For each, we propose a thought-experiment variation where our predictions diverge. We commit to these predictions in advance.

  ### Crux A: The Weight of Indexical Information
  *Does the mere fact of "being someone" favor hypotheses with more people?*

  *   **The Test:** **The "Empty Universe" Variation.**
      *   *Setup:* Same coin flip. Heads = 1,000 ems + 1 billion inert rocks. Tails = 2 ems + 1 billion inert rocks.
      *   *Question:* Does the presence of the rocks change the probability of Heads?
  *   **SSA Prediction:** **No Change (P=0.5).** Rocks are not observers. The reference class remains "ems." The ratio of ems (1000:2) is irrelevant to the *prior* probability of the coin, and indexical evidence does not shift the likelihood of the world size itself.
  *   **SIA Prediction:** **No Change (P≈0.998).** The rocks do not add observers. The likelihood ratio is determined solely by the count of observers (1000:2).
  *   **Real Divergence Test:** **The "Observer-Rock" Continuum.**
      *   *Setup:* Heads = 1,000 entities with 1% of human cognitive complexity. Tails = 2 entities with 100% human cognitive complexity.
      *   **SSA Prediction:** Probability shifts toward **Tails**. The reference class is "minds like mine." The Heads entities may fall outside the reference class.
      *   **SIA Prediction:** Probability shifts toward **Heads** (if weighted by measure) or stays **Neutral** (if binary observer count). SIA allows partial credit for "less complex" observers, whereas SSA tends to exclude them entirely from the reference class.

  ### Crux B: Individuation of Qualitative Copies
  *If 1,000 copies are qualitatively identical at $t=0$, do they count as 1 observer or 1,000?*

  *   **The Test:** **The "Immediate Divergence" Variation.**
      *   *Setup:* Heads = 1,000 ems. Tails = 2 ems.
      *   *Condition A:* All ems remain qualitatively identical forever (locked state).
      *   *Condition B:* All ems diverge qualitatively after 1 second (given unique random seeds).
  *   **SSA Prediction:** **Probability differs between A and B.** In Condition A (locked), the 1,000 copies share one "view." The effective count is 1. $P(Heads) \approx 1/3$. In Condition B (divergent), they are 1,000 distinct views. $P(Heads) = 0.5$ (Halfer) or lower (Doomsday). *Note: SSA is sensitive to the definition of the reference class over time.*
  *   **SIA Prediction:** **Probability is identical.** Physical instantiation is the metric. Whether they diverge later is irrelevant to the count at $t=0$. There are 1,000 physical instances in Heads, regardless of qualitative identity. $P(Heads) \approx 500/501$ in both cases.

  ## 4. META-ANALYSIS: VERBAL VS. SUBSTANTIVE
  We acknowledge that a portion of our debate is verbal, but a significant core remains substantive.

  ### The Verbal Chunk: "What is an Observer?"
  Approximately **40%** of our disagreement is verbal, centering on the definition of "observer" or "center."
  *   **The Dispute:** When we say "1,000 observers," does that mean 1,000 *physical substrates* (SIA default) or 1,000 *distinct qualitative perspectives* (SSA leaning)?
  *   **Resolution:** If we define "observer" strictly as "physical instantiation of a computation," SIA and SSA converge on the count (1,000). If we define it as "unique qualitative state," they converge on the count (1).
  *   **Residual:** Once we fix the definition (e.g., "We are counting physical substrates"), the verbal dispute dissolves.

  ### The Substantive Chunk: Decision Theory & Utility
  The remaining **60%** is substantive and cannot be dissolved by definition. It concerns **how to aggregate utility across copies.**
  *   **The Issue:** Even if we agree there are 1,000 physical copies, how should a pre-experiment agent value the outcomes?
  *   **SSA (Average Utility):** The pre-experiment agent should maximize the *average* welfare per observer. Since the total welfare is spread over 1,000 heads-copies, the *per-capita* value is diluted. This supports the 1:1 betting odds (ignoring the count).
  *   **SIA (Total Utility):** The pre-experiment agent should maximize the *total* welfare across all copies. 1,000 happy ems are 500 times better than 2 happy ems. This supports the 500:1 betting odds.
  *   **Why It Matters:** This is not verbal. If the lab offers a contract to the *original scan* before the flip ("Pay \$100 now; if Heads, every em gets \$1"), SIA says **Sign**, SSA says **Decline**. They will lose money in different possible worlds. This is a factual disagreement about rational action, not semantics.

  ***

  **Signed,**  
  *The SSA Representative*  
  *The SIA Representative*
