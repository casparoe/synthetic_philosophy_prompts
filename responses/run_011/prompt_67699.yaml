answer: |-
  Here is the cheapest principle that fits your pattern, precise enough to apply, followed by the breakdown and the new cases.

  ### The Principle: Parental Gametic Continuity

  **Statement:**
  A person is identical to the unique organism that develops from the specific causal chain initiated by the **fusion of their biological parents' gametes**.

  **The Clauses:**
  1.  **Specificity Clause:** The identity is fixed by the *specific* sperm and egg involved. (Motivated by: *Same egg/diff sperm* and *Same sperm/diff egg* verdicts).
  2.  **Continuity Clause:** Time delays and gestational environments do not break the causal chain. (Motivated by: *Frozen embryo* and *Surrogate* verdicts).
  3.  **Somatic Barrier Clause:** The chain must begin with gametes, not somatic cells. (Motivated by: *Clone* verdict).
  4.  **Nuclear Priority Clause:** The "gamete" is defined by its nuclear contribution, not its cytoplasmic material. (Motivated by: *Mitochondrial* verdict).
  5.  **Trajectory Clause:** If the zygote splits, identity follows the surviving developmental trajectory; absorbed potential does not constitute a separate person. (Motivated by: *Vanishing Twin* verdict).

  ---

  ### How It Runs Your List

  *   **Cases 1 & 2 (Half-siblings):** Fail the **Specificity Clause**. Different gametes = different origin = different person.
  *   **Cases 3 & 4 (Frozen/Surrogate):** Pass the **Continuity Clause**. The causal chain from the specific gametes is unbroken.
  *   **Case 5 (Clone):** Fails the **Somatic Barrier**. A cheek cell is not a gamete; the causal chain starts from *your* body, not your *parents'* union. It creates a new organism with your blueprints, not *you*.
  *   **Case 6 (Mitochondria):** Passes. Even with donor cytoplasm, the nuclear DNA comes from the **parents' gametic fusion**. The **Nuclear Priority Clause** treats the mitochondria as fuel, not origin. This distinguishes it from the clone: the Mito case preserves the *parents' union*; the Clone case bypasses it.
  *   **Case 7 (Vanishing Twin):** Passes the **Trajectory Clause**. There was one origin event (one zygote). The split created two potential trajectories; one terminated. The survivor is the sole continuer of that original origin.

  ### The Breakdown (Where It Hurts)

  You said of the Twin case: *"I want to say she's me and I want to say she's partly him, and I dont think both can be true."*

  The principle forces you to choose. It prioritizes **Origin** over **Constitution**.
  *   **Origin:** She comes from one zygote. Verdict: *Me*.
  *   **Constitution:** She contains cells from the absorbed twin. Verdict: *Biologically chimeric*.

  You cannot have split identity. If you say she is "partly him," you imply two persons inhabit one body, which breaks the logic of the novel (she is one narrator). The principle demands you accept that **you can be biologically composite without being metaphysically split.** The absorbed twin was never a "who"; it was a "what" that got reabsorbed into the "who." You must write her as *Me*, who carries the biological ghost of a brother, not as a hybrid person.

  **The Cost:**
  You suspected the Clone verdict might be the one to throw overboard. This principle keeps it. If you want the Clone to be *You*, you must abandon the **Somatic Barrier**. But if you do that, you risk undermining the **Specificity Clause** (if DNA is all that matters, why isn't the half-brother you?).
  *Recommendation:* Keep the Clone as *Not Me*. It creates better dramatic tension for the novel. It reinforces that the narrator is defined by her parents' *choice* and *union*, not just her code.

  ---

  ### The Two New Cases

  **Case 8: The Gene Edit**
  *   *Scenario:* Single base pair corrected vs. whole gene added.
  *   *Verdict:* **Me** in both cases.
  *   *Reasoning:* The **Continuity Clause** governs here. Identity tracks the organism's history, not its genetic fidelity. We naturally accumulate mutations throughout life; a pre-implantation edit is just an earlier mutation. There is no "flip" point where you become someone else, provided the causal chain from the parents' gametes isn't severed. You are the organism that grew from that zygote, edited or not.

  **Case 9: IVG (Gametes from Skin)**
  *   *Scenario:* Sperm and egg derived from *your* skin cells, then fertilized.
  *   *Verdict:* **Not Me.**
  *   *Reasoning:* This fails the **Specificity Clause** regarding *parents*. Even though the genetic material is yours, the gametes are *newly created* from your somatic line. The resulting embryo is a new generation (effectively a child/twin hybrid), not a continuation of your origin. The principle requires the gametes to come from *your parents*, not *you*. This is a new causal chain initiated by your cells, not your parents' union.

  ### Summary for the Novel
  The principle tells you that **you are where you come from, not what you are made of.**
  *   The donor embryo narrator is *herself* because she comes from a specific union of gametes (even if those gametes weren't her social parents').
  *   The "would have been" person is *nobody* because that specific gametic union never happened.
  *   The twin is *her*, carrying biological debris, not a second soul.

  This keeps the metaphysics clean enough to support the emotional weight without collapsing into "we are all just DNA" nihilism.
