prompt: |-
  You are a philosopher of biology specializing in teleological explanation and the metaphysics of biological function. Before answering, think carefully and sketch, in a few short bullets, the landscape of candidate readings you will be sorting through; only then write up the full analysis.

  Here is my situation. I am a postdoc in a protein-engineering group. We designed a catalyst in silico on a scaffold that has never existed in any ancestral population and never contributed anything to any organism's capacity before we built it; it now accelerates a reaction we chose for it. A colleague with philosophy training keeps repeating the line 'a function is just a selected effect,' and he puts it to work in two distinct ways: first, to tell me our engineered catalyst has no function at all, only effects, and that speaking of its function is a category mistake; second, to dismiss a journal-club question about whether a trait that spread by genetic drift rather than by selection can have a function, on the grounds that the question answers itself.

  I suspect neither use goes through as stated, but I cannot say precisely why, and I do not want to argue from intuition. Please lay out the separate theses that one sentence could be expressing, ranging from the near-trivial to the genuinely radical, and make sure to cover at least the etiological/selected-effects family, the causal-role or systems-oriented family, and any goal-contribution or organizational hybrids that try to sit between them. For each reading, state it precisely enough that it could be false; say whether it leaves room for malfunction, and if so, how; say what it implies for traits fixed by drift, for traits whose present contribution differs from the one that explains their presence, and for designed artifacts such as ours; and say which of them, if any, actually licenses each of my colleague's two uses. Note explicitly which readings are live positions worth arguing against and which would be strawmen, and close by giving me the single sharpest formulation I should ask him to commit to.
