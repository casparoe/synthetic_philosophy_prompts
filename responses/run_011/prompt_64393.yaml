answer: |-
  ### Landscape Sketch

  *   **Orthodox Selected Effects (SE):** Function is strictly historical. $X$ functions to $F$ only if $X$'s ancestors were *actually* selected for $F$. (Millikan, Neander, Griffiths).
  *   **Causal Role (CR):** Function is ahistorical and systemic. $X$ functions to $F$ if $X$ currently contributes $F$ to the capacity of a containing system. (Cummins).
  *   **Organizational/Goal-Contribution:** Function is relational to self-maintenance. $X$ functions to $F$ if $X$ contributes to the maintenance of the organized system that produces $X$. (Mossio, Saborido, Bigelow & Pargetter).
  *   **Propensity/Forward-Looking (Strawman):** Function is what a trait *could* be selected for, regardless of history. (Often confused with SE, but rejected by SE proponents).
  *   **Intentional/Design Stance:** Function is imposed by the designer's intent, applicable to artifacts regardless of evolutionary history. (Dennett, Preston).

  ***

  ### Analysis of "A Function is Just a Selected Effect"

  Your colleague is invoking the **Selected Effects (SE)** theory of function, the dominant view in contemporary philosophy of biology. However, the slogan "a function is just a selected effect" is a compression of several distinct metaphysical commitments. Depending on how strictly one interprets "selected," the implications for your engineered catalyst and the drift question change drastically.

  Below are the separate theses that sentence could express, evaluated against your criteria.

  #### 1. The Orthodox Etiological Thesis (Strict SE)
  *   **Precise Formulation:** A trait $T$ has the proper function $F$ if and only if $T$ exists now because ancestors of $T$ were naturally selected for performing $F$.
  *   **Malfunction:** **Yes.** This is the SE theory's greatest strength. A heart has the function of pumping blood even if it is currently failing to do so, because its *history* explains its presence. Malfunction is failing to perform the effect that explains your existence.
  *   **Drift:** **No Function.** If a trait spread or was fixed solely by genetic drift, it has no proper function on this view, even if it is currently beneficial. Its presence is not explained by its utility.
  *   **Exaptation/Mismatch:** **No New Function.** If a trait was selected for $A$ but now does $B$ (e.g., feathers for insulation, now for flight), it does not have the function $B$ until a new history of selection for $B$ accumulates.
  *   **Designed Artifacts:** **Complicated.** SE theory extends to artifacts (e.g., a heart pacemaker), but requires a lineage of reproduction/copying where the *design* was selected. A *de novo in silico* scaffold with no ancestral lineage of copying poses a problem. If it is a "one-off," Strict SE implies it has no function, only effects.
  *   **Colleague's Uses:** This reading **licenses both Use 1 and Use 2.** It denies function to your novel catalyst (no history) and to drift-fixed traits (no selection).
  *   **Status:** **Live Position.** This is the standard philosophical orthodoxy. It is not a strawman, but it is controversial in physiology and engineering contexts.

  #### 2. The Causal Role Thesis (Systems View)
  *   **Precise Formulation:** A trait $T$ has the function $F$ relative to a system $S$ if and only if $T$ makes a causal contribution $F$ to the broader capacity of $S$.
  *   **Malfunction:** **Weak/No.** "Malfunction" is merely a reduction in causal contribution. There is no normative "ought" here; a heart that doesn't pump simply lacks the function of pumping in that moment. It cannot "fail" to do what it is doing.
  *   **Drift:** **Yes.** If the drift-fixed trait contributes to a system capacity now, it has a function. History is irrelevant.
  *   **Exaptation/Mismatch:** **Yes.** Current contribution determines function. Feathers currently contributing to flight have the function of flight support.
  *   **Designed Artifacts:** **Yes.** Your catalyst contributes to the reaction capacity of your experimental setup. It has a function relative to that system.
  *   **Colleague's Uses:** This reading **contradicts both Use 1 and Use 2.** It grants function to your catalyst and to drift traits.
  *   **Status:** **Live Position.** Standard in physiology, biochemistry, and systems biology. Your colleague is implicitly rejecting this framework.

  #### 3. The Organizational Thesis (Hybrid)
  *   **Precise Formulation:** A trait $T$ has the function $F$ if and only if $T$ contributes to the self-maintenance of the organized system that produces and sustains $T$.
  *   **Malfunction:** **Yes.** If $T$ fails to contribute to self-maintenance, the organization degrades. The normativity comes from the system's need to persist.
  *   **Drift:** **Yes (Conditional).** If the drift-fixed trait is currently integrated into the self-maintaining organization, it has a function. History is secondary to current organizational closure.
  *   **Exaptation/Mismatch:** **Yes.** Once integrated into the self-maintaining cycle, the new contribution becomes functional.
  *   **Designed Artifacts:** **No (Usually).** Unless your catalyst is expressed within a living cell and contributes to *that cell's* self-maintenance, it is an external tool, not an organizational component. In a test tube, it has no organizational function.
  *   **Colleague's Uses:** This reading **licenses Use 1** (if the protein is isolated/in vitro) **but rejects Use 2** (drift traits in organisms are part of the organization).
  *   **Status:** **Live Position.** Gaining traction as a middle ground between SE and CR.

  #### 4. The Propensity Thesis (The "Could Be Selected" Confusion)
  *   **Precise Formulation:** A trait $T$ has function $F$ if $F$ *would* confer a fitness advantage if selected for, regardless of actual history.
  *   **Status:** **Strawman.** Professional SE theorists (Millikan, Neander) explicitly reject this. They insist on *actual* history, not mere utility. However, scientists often conflate "adaptive" with "functional."
  *   **Colleague's Uses:** If your colleague held this view, he would have to admit your catalyst **has** a function (since it is useful). The fact that he denies it suggests he is not holding this view, but he may be confusing his audience with it.

  #### 5. The Intentional Stance (Artifact Specific)
  *   **Precise Formulation:** A trait $T$ has function $F$ if a designer intended $T$ to do $F$.
  *   **Status:** **Live Position for Artifacts.** Standard in philosophy of technology.
  *   **Colleague's Uses:** **Contradicts Use 1.** You intended the catalyst to accelerate the reaction. Therefore, it has that function. Your colleague is applying a *biological* definition of function to an *engineered* entity to deny it status.

  ### Evaluation of Your Colleague's Moves

  **On Use 1 (The Engineered Catalyst):**
  Your colleague is applying the **Orthodox Etiological Thesis** to an artifact. While consistent within strict SE theory, this is arguably a category error in a protein-engineering context.
  *   **Why it's vulnerable:** SE theory was designed to naturalize teleology in *biology* without invoking minds. In *engineering*, teleology is already grounded in human intention. By insisting on evolutionary history for a designed object, he is ignoring the **Intentional Stance**.
  *   **The nuance:** If your protein is expressed in a host organism and helps it survive, an Organizational theorist might grant it function. If it is a purified enzyme in a tube, SE and Organizational theories agree: it has causal powers, but no "proper function" in the biological sense. However, it *does* have an artifactual function. Your colleague is conflating "biological proper function" with "function simpliciter."

  **On Use 2 (Drift):**
  Your colleague is correct that **Orthodox SE** denies function to drift-fixed traits.
  *   **Why it's vulnerable:** He claims the question "answers itself." This is dogmatic. It only answers itself *if* SE is the correct theory of function. Many philosophers and biologists argue that if a trait fixed by drift is now essential for survival, calling it "functionless" is unhelpful obscurantism. The **Organizational** and **Causal Role** theories grant it function. He is presenting a contested theoretical implication as a conceptual truth.

  ### The Sharpest Formulation

  You need to force him to reveal whether he is making a claim about **language** (how we should speak) or **metaphysics** (what exists), and whether he acknowledges the distinction between biological traits and engineered artifacts.

  Ask him this:

  > **"Are you claiming that 'function' is a term that *only* applies to traits with a history of natural selection (the Orthodox SE view), or are you claiming that any useful effect without such a history is merely a 'capacity' and not a 'function'?"**

  Follow up immediately with:

  > **"If it is the former: On what grounds do you rule out the Intentional Stance for engineered artifacts, where the designer's intent replaces evolutionary history as the source of normativity? If it is the latter: Why does the distinction matter for our experimental predictions, given that both 'functions' and 'capacities' causally explain the reaction rate?"**

  **Why this works:**
  1.  It forces him to admit that SE is a *choice* of theory, not a definition of the word.
  2.  It highlights the artifact/biology boundary. If he insists your protein has no function, he must explain where the "functionality" of the *design process* went.
  3.  It challenges the utility of his distinction. If the drift trait keeps the organism alive, denying it "function" status buys him metaphysical purity at the cost of explanatory power.
