      *   If they say "Mental and Physical share the work," they missed Sufficiency/Exclusion.
      *   If they say "Mental properties don't exist," they missed the Non-Reductive premise.
      *   *Question:* "A non-reductive physicalist wants to say mental properties are distinct from physical properties BUT still cause physical effects. Which premise of Kim's argument must they reject, and what cost does that rejection incur?"

  7.  **Final Review against Constraints:**

      *   *Architecture?* Yes.
      *   *Order?* Yes.
      *   *Case?* Writing "4". (Avoids pain/qualia, avoids "intention = brain state" identity trigger because it focuses on the *content* vs. the *ink*).
