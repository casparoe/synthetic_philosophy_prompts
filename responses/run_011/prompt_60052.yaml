answer: |-
  Here is the architecture for your fifty minutes. It is designed to be written on the board in three columns as you proceed, creating a visual map of the trap Kim sets.

  ### The Board Architecture

  **Column 1 (Left): The Setup**
  *   **The Case:** (Write this first, leave it up).
  *   **Premise 1:** Supervenience.

  **Column 2 (Center): The Mechanism**
  *   **Premise 2:** Causal Closure.
  *   **Premise 3:** The Exclusion Principle.
  *   **Premise 4:** No Systematic Overdetermination.

  **Column 3 (Right): The Trap**
  *   **The Dilemma:** Reduction OR Epiphenomenalism.
  *   **The Essay Task:** Shape of a Reply.

  ---

  ### The Sequence (Minute-by-Minute)

  **0:00–0:05: The Case and The Stipulation**
  *   **Action:** Write **The Case** in Column 1.
  *   **The Case:** *Writing the word "Paris" on a page.*
      *   **Effect:** Ink marks appear (Physical).
      *   **Physical Cause:** Neural firing $\rightarrow$ muscle contraction (Physical).
      *   **Mental Cause:** Belief that Paris is the capital + Desire to answer (Mental).
  *   **Why this case:** It avoids qualia (pain) and avoids simple reflexes (arm raise). It separates *semantic content* (mental) from *ink marks* (physical) clearly enough that students won't immediately collapse them into identity, but it is physical enough for Closure to apply.
  *   **Crucial Stipulation:** State aloud: *"For this hour, you are not allowed to be Identity Theorists. You must assume the Mental Property and the Physical Property are distinct. We are testing Non-Reductive Physicalism. If you argue they are identical, you have dissolved the problem rather than solved it."*

  **0:05–0:15: Supervenience (Column 1)**
  *   **Action:** Write **Premise 1: Supervenience**.
  *   **Dependency:** This must come before Exclusion. If the mental does not depend on the physical, it could be a ghost pushing the body from outside. Supervenience ties the mental to the physical, ensuring they are competing for the *same* causal slot.
  *   **Definition:** "No mental difference without a physical difference."
  *   **Visual:** Draw an arrow from Physical Base $\rightarrow$ Mental Property.
  *   **Misconception Preemption:** None yet. This is familiar ground for them.

  **0:15–0:25: Causal Closure (Column 2)**
  *   **Action:** Write **Premise 2: Causal Closure**.
  *   **Definition:** "Every physical effect has a sufficient physical cause."
  *   **Status:** Do not argue for it. Present it as a commitment of *Physicalism*. If they deny this, they are not physicalists, and Kim's argument doesn't apply to them.
  *   **Misconception Preemption (Free Will):** This is where the 1st-year Free Will students will perk up.
      *   **Say this:** "Closure is not Determinism. Closure says physical effects have physical causes. It does not say the future is fixed. You can have indeterministic physics and still have Closure. Do not confuse 'sufficient physical cause' with 'predetermined fate'."
  *   **Board Note:** Underline **Sufficient**.

  **0:25–0:35: Exclusion & Overdetermination (Column 2)**
  *   **Action:** Write **Premise 3: Exclusion Principle** and **Premise 4: No Systematic Overdetermination**.
  *   **Definition:** "No single event can have more than one *sufficient* cause (unless it is a genuine case of overdetermination, like two rocks breaking a window)."
  *   **Dependency:** This relies on Closure. Because the Physical cause is *sufficient* (100%), there is no causal work left for the Mental to do.
  *   **Misconception Preemption (50/50 Split):** Students will suggest the Mental does half and the Physical does half.
      *   **Say this:** "Closure says the Physical cause is *sufficient*. That means 100% of the work is already done by the neurons. If the Mental also causes it, it isn't sharing the work; it is duplicating it. That is overdetermination."
  *   **Board Note:** Draw two arrows pointing to the Effect (one from Physical, one from Mental) and put a big **X** over the Mental arrow.

  **0:35–0:45: The Dilemma (Column 3)**
  *   **Action:** Write **The Dilemma**.
  *   **Logic:**
      1.  If Mental $\neq$ Physical (Non-Reductive) $\rightarrow$ Mental is Excluded (Epiphenomenalism).
      2.  If Mental Causes Effect $\rightarrow$ Mental must = Physical (Reductionism).
  *   **Misconception Preemption (Eliminativism):** Students will think the conclusion is "The Mind doesn't exist."
      *   **Say this:** "Kim is not saying beliefs don't exist. He is saying they are *causally inert* like the shadow of a moving car. The shadow exists, but it doesn't push the car. Non-reductive physicalism risks making the mind a shadow."
  *   **Essay Prep:** Explicitly state: "Your essay question asks for the shape of a reply. A successful reply must reject one of the four premises in Column 1 or 2, but without abandoning Physicalism entirely."

  **0:45–0:50: The Diagnostic Question**
  *   **Action:** Erase Column 3. Leave the Premises visible.
  *   **Ask:** "A non-reductive physicalist wants to save mental causation. They refuse to reduce the mental to the physical. Which premise must they reject, and what specific 'physicalist' commitment does that rejection force them to abandon?"
  *   **Why this works:**
      *   If they say "Deny Supervenience," they embrace Dualism (fail).
      *   If they say "Deny Closure," they embrace non-physical causes (fail physicalism).
      *   If they say "Deny Exclusion," they must explain why overdetermination isn't a problem (the correct path).
      *   If they say "The mind doesn't exist," they missed the distinction between existence and causation.

  ---

  ### What to Cut

  **1. The Load-Bearing Cut: Defending the Exclusion Principle.**
  *   **What it is:** Spending time arguing *why* overdetermination is implausible or discussing counterexamples to Exclusion.
  *   **Why cut it:** It is load-bearing for Kim, but load-bearing for *your section* is the *structure* of the argument, not the truth of the premises. If you defend it, you turn the section into an adjudication.
  *   **Say aloud:** "We are not asking if the Exclusion Principle is true today. We are asking what happens *if* it is true. Treat it as a rule of the game."

  **2. The Dispensable-but-Wrecking Cut: The Distinction between 'Causal Closure' and 'Determinism'.**
  *   **What it is:** It looks like semantic nitpicking. It feels like a sidebar.
  *   **Why keep it:** If you drop this, the students who took Free Will will conflate Closure with Determinism. They will spend 20 minutes arguing about whether the future is open. This will derail the specific metaphysical problem of *causal competition*.
  *   **Say aloud:** "I am cutting the debate on determinism. Closure is about where the cause comes from (the physical domain), not whether the outcome was fixed. If you conflate these, you are answering the wrong question."

  ### Summary of Dependencies
  1.  **Supervenience** must be on the board before **Exclusion**. (You need the dependency to establish the competition).
  2.  **Closure** must be on the board before **Exclusion**. (You need the sufficiency of P to establish the exclusion of M).
  3.  **The Case** must remain visible throughout. (Every premise must be pointed back to the ink marks and the belief).

  ### Final Instruction
  Do not let them solve the problem. Your goal is to make them feel the squeeze of the dilemma so acutely that they understand why the essay question is difficult. If they leave thinking "Well, obviously the mind causes things," you have failed. They must leave thinking "I see why it's hard to say *how* the mind causes things without giving up physicalism."
