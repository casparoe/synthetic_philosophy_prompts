  4.  **Drafting the Architecture (Minute by Minute):**

      *   *0-5:* Setup & The Case.
      *   *5-15:* Supervenience (The Dependency).
      *   *15-25:* Causal Closure (The Physical Sufficiency). Address Free Will conflation here.
      *   *25-35:* The Exclusion Principle & Overdetermination (The Competition). Address 50/50 split here.
      *   *35-45:* The Dilemma (Reduction vs. Epiphenomenalism). Address "Mental doesn't exist" here.
      *   *45-50:* Diagnostic Question.

  5.  **Refining the Dependencies:**

      *   Supervenience must come before Exclusion. Why? Because Exclusion argues M is excluded *by* P. If M doesn't depend on P (dualism), M could be a separate causal chain. Supervenience ties M to P so they compete for the *same* slot.
      *   Closure must come before Exclusion. You need to know P is *sufficient* before you say M is *excluded*.
      *   So: Case -> Supervenience -> Closure -> Exclusion -> Dilemma.

  6.  **Developing the Diagnostic Question:**

      *   Needs to distinguish between specific failures.
