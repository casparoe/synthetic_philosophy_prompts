          *   I will instruct the user to *stipulate* distinctness to avoid the Identity Theory trap. The case itself matters less than the *stipulation* that we are testing Non-Reductive Physicalism.
          *   *Decision:* **Sending an Email.**
          *   Effect: Packet sent.
          *   Physical: Keystrokes/Electricity.
          *   Mental: Meaning/Intent.
          *   *Actually, I'll recommend:* **The "Why did you do that?" Case.**
          *   Action: Hand moves to catch a falling vase.
          *   Physical: Reflex/Neural.
          *   Mental: Desire to save vase.
          *   *Okay, I will choose:* **Typing a Word.** It allows separation of syntax (physical) and semantics (mental).
          *   *Wait, I need to be decisive.* I will recommend **Voting.**
          *   Effect: Ballot registered.
          *   Physical: Mark on paper.
          *   Mental: Preference for Candidate A.
          *   *Reasoning:* It's distinct enough that "Preference = Mark" sounds wrong, but physical enough for closure.
          *   *Actually, the prompt asks for ONE case.* I will choose **Turning on a Light.** It's mundane enough to avoid qualia, physical enough for closure. I will add the instruction to *stipulate* distinctness to avoid the Identity Theory trap.

