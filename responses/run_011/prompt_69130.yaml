  2.  **Deconstruct the Seven Claims:**

      *   **Claim 1 (Ravi):** No-trade theorem (Milgrom-Stokey). If common prior and common knowledge of rationality, trade based on private information shouldn't happen. If someone wants to trade, it signals they know something you don't, so you shouldn't trade. Trade only happens for hedging/liquidity.
          *   *Assessment:* Theoretically correct within the model's strict assumptions (Common Knowledge of Rationality, Common Priors).
          *   *Verdict:* Correct within the model, but assumptions are strong.

      *   **Claim 2 (Dana):** Real-world experience contradicts this. Trades happen constantly where both sides are happy. Most orders are non-informational (rebalancing, redemptions, hedging).
