answer: |-
  ### The Principle of Reciprocal Subjection and Shared Fate

  After analyzing your verdicts, I reconstruct your underlying intuition not as a single rule, but as a composite principle I will call **The Principle of Reciprocal Subjection and Shared Fate**. It is not enough to be affected (the tourist is affected by building codes); it is not enough to be a legal member (the absentee citizen is a member). The right to vote attaches to those who are **routinely subjected** to the coercive and normative order of the body, **share in its long-term future**, and possess the **capacity for reciprocal agency**.

  This principle has three operative clauses. Each saves a cluster of your verdicts but exacts a cost elsewhere.

  #### Clause 1: Routine Subjection (The Jurisdictional Match)
  *Definition:* You are entitled to vote in a body if your daily life is routinely governed by its coercive decisions, such that exiting the jurisdiction would impose significant material or social costs.
  *   **Saves:** Case 1 (Resident non-citizen), Case 5 (Remote worker resident), Case 4 (Commuter for Water District).
  *   **Costs:** It forces us to admit that the Assembly and the Water District are not the same kind of beast. The Assembly governs *life* (police, schools, zoning); the Water District governs *infrastructure* (rates, discharge).
  *   **Application:** The commuter (Case 4) is not subject to the city's police power or schools (Assembly), so he is excluded there. He *is* subject to the water rates and environmental regulations that affect his home and employer (Water), so he is included there. This validates **Relativization**: the electorate is not a fixed list of people, but a function of the body's authority. This is not a retreat; it is a feature. A body with narrow technical authority requires a narrow functional electorate; a body with general police power requires a general residential electorate.

  #### Clause 2: Shared Fate (The Temporal Threshold)
  *Definition:* Your subjection must be indefinite. You must be situated such that you cannot easily exit the consequences of the body's long-term capital decisions. Transient presence, even if routine, does not confer standing.
  *   **Saves:** Case 2 (Absentee citizen), Case 3 (Temporary absentee), Case 6 (Visa worker), Case 13 (Tourist).
  *   **Costs:** It requires a judgment on "intent" and "duration" that is administratively messy. It creates a gradient where the law demands a line.
  *   **Application:** This distinguishes the Tourist (Case 13) from the Visa Worker (Case 6) and the Resident (Case 1). The tourist's subjection is contingent and brief; exit costs are near zero. The visa worker (Case 6) has higher exit costs but a fixed expiration date; they do not share the *indefinite* fate of the city's capital budget (20-year bonds, etc.). They are guests, not stakeholders. This also explains Case 3: the citizen abroad retains the *right* of return and the intent to share the future, but if that intent lapses (Case 2), the vote lapses.

  #### Clause 3: Reciprocal Agency (The Capacity and Covenant)
  *Definition:* You must possess the cognitive capacity to form political preferences and understand the choice, and you must not have voluntarily severed the normative covenant of the community through serious, intentional wrongdoing.
  *   **Saves:** Case 7 (Minors), Case 10 (Dementia), Case 12 (Corporations), Case 8 (Fraud prisoner).
  *   **Costs:** It requires drawing bright lines on gradients of capacity and moral culpability.
  *   **Application:** Corporations (Case 12) lack biological agency; they are excluded. Minors (Case 7) are presumed to lack full agency, though the gradient is real. Prisoners (Case 8 & 9) are judged on the nature of their breach: fraud against neighbors is a direct breach of civic trust (no vote); negligent homicide is a tragic failure of care, not a political betrayal (vote retained).

  ---

  ### The Exchange Rate: What Must Be Overturned

  To make this principle coherent, you cannot keep every verdict in your list. Here is the actual cost:

  1.  **You must overturn Case 9 (Negligent Homicide Prisoner).**
      *   *Why:* Your principle relies on "Reciprocity." While the moral distinction between fraud and negligence is sound, the *political* distinction is unstable. Incarceration removes the individual from the community's routine life (violating Clause 1: Routine Subjection). They are not living with the outcomes; they are warehoused. To keep Case 9 as a "Yes" while Case 8 is a "No" requires a moral calculus the electoral system is ill-equipped to administer.
      *   *The Fix:* Disenfranchise all those currently serving felony sentences. Restore the vote upon release (as you did in Case 8's second half). This simplifies the principle: *Physical presence and liberty are prerequisites for routine subjection.*

  2.  **You must accept a "Conventional Line" on Case 7 (Age).**
      *   *Why:* You asked if there is a non-arbitrary stopping point. There is not. Capacity is a spectrum. A politically obsessed 12-year-old may have more "agency" than a disengaged 20-year-old. However, democracy requires administrative feasibility.
      *   *The Fix:* Concede that the age line (16 or 18) is a **coordination convention**, not a principled discovery. The *principle* demands capacity; the *rule* sets an age proxy to avoid invasive competency tests. You can lean "Yes" for 17-year-olds in a local election (as you did), but you must admit this is a policy choice to lower the convention, not a discovery that 17 is the "true" age of reason.

  3.  **You must resolve Case 11 (TBI Conservatorship).**
      *   *Verdict:* **Yes.**
      *   *Reasoning:* Clause 3 requires "Capacity for Agency," not "Financial Competence." A conservatorship manages property because the individual might be vulnerable to exploitation or bad math. It does not necessarily erase the ability to hold a political view ("I want better roads"). Unless there is specific medical evidence that the TBI prevents the formation of stable preferences, denying the vote treats the person as a ward rather than a citizen.
      *   *What would change my answer:* If the conservatorship were specifically *medical/decisional* (i.e., a court ruled he cannot make personal health decisions), then the presumption of political capacity falls. But financial guardianship alone is insufficient grounds for disenfranchisement.

  ---

  ### Applications to New Cases

  **1. The Returnee (Born here, left at 2, returns at 30)**
  *   *Verdict:* **No vote initially; Yes after establishing residence.**
  *   *Reasoning:* At age 30, upon return, this person is functionally identical to Case 1 (The Permanent Resident). Citizenship is irrelevant (Clause 1). They have not shared the fate of the city during their absence (Clause 2). They gain the vote not by birthright, but by re-establishing "Routine Subjection." They should be treated exactly like the non-citizen restaurant owner: enfranchise once they lease an apartment and register a vehicle.

  **2. Weighted Voting (Downstream residents in Water District)**
  *   *Verdict:* **No.**
  *   *Reasoning:* This violates the "Reciprocal" nature of the principle. If we accept that the electorate is defined by "Subjection," then all who are subjected are subjected *equally* to the authority of the body. To give one person two votes because they are "more affected" implies that political standing is a measure of *interest intensity* rather than *status*. This corrodes the idea of a shared fate. If downstream residents are uniquely vulnerable, they need veto powers or representation quotas, not extra votes. Extra votes turn the assembly into a market of interests rather than a body of peers.

  **3. Sixteen-Year-Olds (National vs. Local)**
  *   *Verdict:* **The Principle permits the distinction.**
  *   *Reasoning:* Because the principle is **Relativized** (Clause 1), the threshold for "Routine Subjection" can vary by body. A 16-year-old working full-time (Case 7) is economically subjected to local tax and labor policy in a way they are not subjected to foreign policy or national defense. It is consistent to say they have a stake in the city's bus lines and schools (Local: Yes) but not the national debt (National: No). However, I advise against this in practice; the administrative confusion of having different electorates for different ballots outweighs the theoretical purity.

  **4. Tourist (13) vs. Visa Worker (6)**
  *   *Verdict:* **Distinction is Duration + Exit Costs.**
  *   *Reasoning:* You asked what distinguishes them. It is not merely "intent." It is **Exit Cost**. The tourist can leave tomorrow with negligible loss. The visa worker has a contract, a lease, and a life arranged for two years. However, the Visa Worker is still excluded (in your verdicts) because their subjection has a *known termination date*. They are not betting on the city's 20-year future. The Tourist is not even betting on the city's 2-year future.
  *   *Refinement:* If the Visa Worker renewals become indefinite (Case 1 scenario), they cross the threshold. The line is not "Citizen vs. Non-Citizen," it is "Indefinite Resident vs. Temporary Guest."

  ---

  ### The Reflexive Problem: Who Draws the Lines?

  This is the most dangerous question. Your commission was appointed by a Council elected under *old* rules, by an *old* electorate, to define the *new* electorate. By the Principle of Reciprocal Subjection, your commission is illegitimate. You do not yet represent the "Shared Fate" of the new assembly because the assembly does not yet exist.

  **The Honest Answer:**
  The principle **cannot** be applied to its own adoption without circularity. There is no democratic way to define the first democratic boundary. This requires a **Trustee Moment**.

  *   **The Cost:** You must admit that the commission is acting as a *constitutional framer*, not a *legislator*. In this specific moment, you are not agents of the current voters; you are agents of the *normative ideal* of the future polity. You are using the authority of the old, flawed system to birth the new, more legitimate one.
  *   **The Justification:** This is only permissible if the new boundaries are *more* consistent with the Principle of Reciprocal Subjection than the old ones. If you expand the franchise to those actually subjected (Case 1, Case 4 Water), you increase legitimacy. If you restrict it to those with shared fate (Case 2, Case 6), you increase integrity.
  *   **The Risk:** If the commission uses this power to entrench its own power (e.g., gerrymandering the assembly to protect the council), the "Trustee Moment" becomes a coup. The only safeguard is transparency: you must publish this exact reasoning. You must say, "We know we were not elected by the right people to draw these lines. We are drawing them based on this principle, and you, the new electorate, can judge us in the next cycle."

  ### Summary of Commitments

  1.  **Principle:** Reciprocal Subjection and Shared Fate (Relativized to the body's authority).
  2.  **Overturn:** Case 9 (Prisoner vote). All incarcerated felons lose the vote temporarily; all released regain it.
  3.  **Concede:** Case 7 (Age). The line is conventional, not natural.
  4.  **Decide:** Case 11 (TBI). Vote Yes, unless specific cognitive incapacity is proven. Financial conservatorship is irrelevant.
  5.  **Relativize:** Assembly (Residents only) vs. Water (Residents + Functional Users). This is a strength, not a weakness.
  6.  **Reflexivity:** Acknowledge the commission's transitional, trustee status. Legitimacy comes from the quality of the principle applied, not the pedigree of the appointers.

  This account saves 11 of your 13 verdicts, clarifies the muddy ones, and gives you a tool to answer the next case that arises without needing to consult a bibliography. It costs you the comfort of thinking your current authority is perfectly democratic, but it buys you a system that will be democratic in the future.
