  \    The land value *with* blasting is $X$. The land value *without* blasting (if\
  \ he sells) is $Y$.\n    If he quits, he sells the land. Does he recoup the blasting\
  \ cost?\n    To make it a true sunk cost fallacy scenario, he must *not* recoup\
  \ the cost.\n    So, Land Value (Blasted) = $100k. Land Value (Unblasted) = $100k.\
  \ (The blasting added no market value, only utility to him).\n    Okay, that works.\
  \ Specialized value that isn't market value.\n\n    *Let's write.*"
answer: "**Theoretical Flag:** This scenario is only possible if we reject the standard\
  \ economic assumption of *time-separable utility* (the idea that what happened yesterday\
  \ shouldn't mathematically weight today's choices). If you define rationality strictly\
  \ as forward-looking wealth maximization, this spec is impossible. The case below\
  \ works only if \"integrity\" or \"narrative consistency\" is treated as a terminal\
  \ good, not a bug.\n\n**The Scenario**\n\nArthur, a retired engineer, decides to\
  \ fund a small private observatory. He selects a specific hilltop on his property\
  \ and spends $100,000 of non-recoverable savings on explosive rock removal and foundation\
  \ pouring. This work adds no market value to the land—if he sells now, the land\
  \ fetches the same price as unblasted terrain—and he has hired out all labor, so\
  \ he has gained no construction skills. Midway through, a new light-pollution study\
  \ reveals a different spot on his property offers 20% better visibility and requires\
  \ no blasting. Building on the new spot costs $150,000; finishing the original spot\
  \ costs $200,000.\n\nFinancially and functionally, the new spot is superior: it\
  \ costs less future capital and yields a better telescope environment. The $100,000\
  \ spent on the first site is gone either way. A standard cost-benefit analysis dictates\
  \ abandoning the first site. However, Arthur chooses to finish the original, inferior\
  \ site. He is not confused about the numbers, nor is he signaling to anyone; the\
  \ decision is private. He reasons that the $100,000 expenditure was a specific vow\
  \ to *that* location, and abandoning it would retroactively turn the expenditure\
  \ from a \"cost of building\" into a \"waste of resources.\"\n\nFor Arthur, the\
  \ utility of the finished observatory is not just a function of its optical quality,\
  \ but of its relationship to the resources consumed to create it. Quitting would\
  \ inflict a psychological penalty he values at more than the $50,000 future savings\
  \ and the 20% visibility gain. He honors the sunk cost because his preference structure\
  \ values the *coherence of the project narrative* over the marginal efficiency of\
  \ the outcome.\n\n***\n\n**The Check**\n\n1.  **Preference Structure:** Arthur's\
  \ utility function is $U = V_{outcome} - C_{future} - \\lambda(Waste)$. Here, $Waste$\
  \ is a binary variable triggered only if $PastSpend > 0$ AND $Project = Abandoned$.\
  \ This isn't loss aversion (which is fear of realizing a loss); it is a preference\
  \ for *integrity*. He derives positive utility from knowing that past resources\
  \ were necessary inputs rather than errors. This isn't a cognitive bug because it\
  \ is a stable, transitive preference for narrative consistency over material efficiency.\
  \ He is maximizing his total utility, not his bank account.\n\n2.  \b**Time Separability:**\
  \ The case collapses immediately if we assume value is separable across time (i.e.,\
  \ $U_{today}$ depends only on $State_{future}$). Under separability, the $100,000\
  \ is a constant in both equations and cancels out, making the new site the strictly\
  \ dominant choice. The assumption that value is separable across time is doing the\
  \ work of the \"fallacy\" label. By rejecting it, we allow $PastSpend$ to act as\
  \ a parameter in the current utility function. This isn't about regret (an emotional\
  \ error); it's about the *definition* of the good being produced. A \"coherent project\"\
  \ is a different good than an \"efficient telescope,\" and the former cannot exist\
  \ without referencing the past.\n\n3.  **Load-Bearing Feature & Economist Objection:**\
  \ The load-bearing feature is the **non-marketability of the past expenditure's\
  \ value**. If the blasting added market value to the land (an asset), Arthur could\
  \ recoup the cost by selling, and the decision becomes a standard asset swap. If\
  \ the blasting taught him skills, it becomes human capital. The case relies entirely\
  \ on the value being internal and narrative. A straight-laced economist would attack\
  \ this by saying: \"Fine, Arthur just has weird preferences. You haven't justified\
  \ sunk costs; you've just defined a preference for wasting money as 'rational'.\"\
  \ This objection lands partially—it shows that \"rationality\" is doing heavy lifting.\
  \ However, it doesn't defeat the case. If preferences are sovereign, and Arthur\
  \ prefers coherence to wealth, maximizing coherence *is* rational. The economist's\
  \ objection only holds if you assume wealth maximization is the only valid utility\
  \ function, which is a normative claim, not a logical one."
