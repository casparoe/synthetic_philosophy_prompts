answer: |-
  1. **Arithmetic check**
  Your calculations are entirely correct. For set $S$, the ideal point is indeed $(7,6)$. The Pareto frontier consists of two segments; the relevant segment for both solutions is the line $x_2 = 7 - x_1$. The Kalai–Smorodinsky ray $x_2 = \frac{6}{7}x_1$ intersects this at $(49/13, 42/13)$, confirming the fraction $7/13$ of the ideal. The Nash product $x_1(7-x_1)$ maximises at $(3.5, 3.5)$, confirming the fractions $1/2$ and $7/12$. For set $T$, removing $(0,6)$ lowers player 2's ideal to $5$, making the ideal point $(7,5)$. The Nash solution remains $(3.5, 3.5)$ as the relevant frontier is unchanged. The Kalai–Smorodinsky ray $x_2 = \frac{5}{7}x_1$ now intersects at $(49/12, 35/12)$. All coordinates and fractions provided in your prompt are accurate and ready for use in the paper.

  2. **The question as it will appear on the paper**
  **Question 1**
  Let the disagreement point be $d=(0,0)$. Let $S$ be the convex hull of $\{(0,0), (0,6), (2,5), (7,0)\}$, closed under free disposal. Let $T \subset S$ be the convex hull of $\{(0,0), (2,5), (7,0)\}$, closed under free disposal.
  *Rubric: Nash solution maximises the product of gains; Kalai–Smorodinsky solution lies on the ray from disagreement to ideal point.*

  (a) Calculate the ideal point, the Nash solution, and the Kalai–Smorodinsky solution for the bargaining problem $(S,d)$. Express the solution coordinates as fractions of the respective ideal gains. **[6 marks]**

  (b) Calculate the ideal point and both solutions for $(T,d)$. Compare these results with part (a) and identify strictly which player gains or loses from the transition from $S$ to $T$ under each solution. **[6 marks]**

  (c) Explain axiomatically why the Nash solution is unchanged while the Kalai–Smorodinsky solution moves. What does each axiom imply about the status of the removed point $(0,6)$? **[6 marks]**

  (d) Assess the following verdict: *"Independence of irrelevant alternatives is the requirement that a bargain not be manipulated by destroying options; monotonicity is the requirement that a bargain respond to what the parties might aspire to. Since the two cannot both be satisfied, and the second is a demand of fairness while the first is a technical convenience, Kalai–Smorodinsky wins."* **[7 marks]**

  3. **Model answer**
  **(a)** For $S$, the maximum feasible payoff for player 1 is 7 and for player 2 is 6. The ideal point is $a(S)=(7,6)$. The Pareto frontier connects $(0,6)$ to $(2,5)$ to $(7,0)$. The Nash solution maximises $x_1 x_2$. On the segment $(2,5)$ to $(7,0)$, defined by $x_2 = 7-x_1$, the product $x_1(7-x_1)$ is maximised at $x_1=3.5$. Thus $N(S,d) = (3.5, 3.5)$. Relative to the ideal, player 1 receives $1/2$ and player 2 receives $7/12$.
  The Kalai–Smorodinsky solution lies on the ray $x_2 = \frac{6}{7}x_1$. Intersecting this with $x_2 = 7-x_1$ yields $\frac{13}{7}x_1 = 7$, so $x_1 = 49/13$ and $x_2 = 42/13$. Both players receive exactly $7/13$ of their ideal gain.

  **(b)** For $T$, the point $(0,6)$ is removed. The maximum feasible payoff for player 2 drops to 5. The ideal point is $a(T)=(7,5)$. The relevant frontier remains $x_2 = 7-x_1$. The Nash solution remains $(3.5, 3.5)$ as the local geometry is unchanged. The Kalai–Smorodinsky ray is now $x_2 = \frac{5}{7}x_1$. Intersection yields $\frac{12}{7}x_1 = 7$, so $KS(T,d) = (49/12, 35/12)$.
  Comparing $S$ to $T$: Under Nash, neither player gains or loses. Under Kalai–Smorodinsky, player 1 gains (from $49/13 \approx 3.77$ to $49/12 \approx 4.08$) and player 2 loses (from $42/13 \approx 3.23$ to $35/12 \approx 2.92$).

  **(c)** The Nash solution satisfies Independence of Irrelevant Alternatives (IIA). This axiom dictates that if a solution is chosen from a set, and the set shrinks but still contains the solution and the disagreement point, the solution must remain unchanged. Since $(3.5, 3.5) \in T \subset S$, Nash is blind to the removal of $(0,6)$. The removed point is truly "irrelevant."
  The Kalai–Smorodinsky solution satisfies Individual Monotonicity. This requires that if the feasible set shrinks such that a player's ideal point decreases (while the other's stays constant), that player should not gain. Here, player 2's ideal dropped from 6 to 5. Monotonicity demands player 2's payoff does not increase; consequently, player 1's payoff increases to maintain Pareto efficiency. For Kalai–Smorodinsky, $(0,6)$ was not irrelevant; it anchored player 2's aspiration level.

  **(d)** The verdict is partially correct but ultimately flawed. It is correct that the axioms are incompatible; no solution can satisfy both IIA and Monotonicity on this domain. The gloss on Monotonicity is fair: it links outcomes to aspirations. However, the dismissal of IIA as mere "technical convenience" is incorrect. IIA protects against manipulation via the feasible set, but it does not render the Nash solution immune to manipulation overall.
  The Nash solution is vulnerable to manipulation via the *disagreement point*. A player can threaten to worsen the disagreement point to shift the Nash solution in their favour, which is why Nash required a separate theory of threats. Neither solution is immune to strategic manipulation; they are vulnerable along different parameters (feasible set vs. disagreement point).
  Furthermore, describing player 1's gain in $T$ under Kalai–Smorodinsky as a defect misunderstands the axiom. Monotonicity is designed precisely to redistribute bargaining power when one party's best-case scenario worsens. A solution immune to both channels would require fixed claims independent of the set or disagreement point, which violates Pareto efficiency or scale invariance. The real choice is not between immunity and vulnerability, but between which parameter of the problem ought to determine bargaining power.

  4. **Marking scheme**
  **Part (a) [6 marks]:** 2 marks for correct ideal point $(7,6)$. 2 marks for Nash $(3.5, 3.5)$. 2 marks for Kalai–Smorodinsky $(49/13, 42/13)$ and correct fractions ($1/2, 7/12, 7/13$). Arithmetic errors penalised once.
  **Part (b) [6 marks]:** 2 marks for correct ideal $(7,5)$. 2 marks for correct solutions (Nash unchanged, KS moves). 2 marks for correctly identifying Player 1 gains/Player 2 loses under KS, and no change under Nash.
  **Part (c) [6 marks]:** 3 marks for linking Nash stability to IIA (removal of non-chosen options). 3 marks for linking KS movement to Monotonicity (change in ideal point/aspirations). Must explicitly reference the status of $(0,6)$.
  **Part (d) [7 marks]:** 2 marks for confirming incompatibility. 2 marks for critiquing the dismissal of IIA (identifying the disagreement point/threat vulnerability). 3 marks for high-level synthesis: recognising KS gain is a feature not a bug, and discussing the impossibility of total immunity. A script that simply agrees with the verdict cannot score above 4/7.

  **First-class distinction:** To achieve a first, candidates must move beyond defining the axioms. In (d), they must identify that "manipulation" is not unique to the feasible set (the Nash threat problem) and evaluate the normative trade-off rather than declaring a winner based on a false premise of immunity.

  5. **Where scripts go wrong**
  **1. Axiom Recitation:** The candidate defines IIA and Monotonicity correctly but fails to apply them to the specific geometry of $S$ and $T$. *Diagnostic:* The answer mentions the axioms but does not explain why $(3.5, 3.5)$ remains in $T$ or why the ideal point shift matters.
  **2. The Manipulation Blindspot:** The candidate accepts the verdict's claim that Nash is immune to manipulation because of IIA. *Diagnostic:* No mention of the disagreement point or threat strategies as an alternative channel for manipulation.
  **3. The KS "Error":** The candidate argues that the Kalai–Smorodinsky solution *should* have remained unchanged and treats the movement as a calculation error or instability. *Diagnostic:* Failure to recognise Monotonicity as a normative demand rather than a technical bug.
  **4. Arithmetic Drift:** The candidate calculates the ideal point of $T$ as $(7,6)$ instead of $(7,5)$. *Diagnostic:* This collapses the distinction between the two problems, making parts (b) and (c) impossible to answer correctly.
