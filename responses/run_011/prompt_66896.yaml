prompt: |-
  I'm a program officer at a small private foundation that funds whole research programs, not projects — six to eight year commitments in one subfield, with a renewal decision at the end of each cycle. I make about fifteen of these calls a year and my recommendation goes to a five-person board that signs off. Our bylaws say funding continues unless there's a documented case for stopping, which is deliberate: the founders wanted the default to be patience.

  The board has started complaining that our renewal memos are just citation counts, grant dollars leveraged, and how famous the PIs are, and honestly they're right. I want to rebuild the memo around something with actual conceptual content, and Lakatos's methodology of scientific research programmes is the candidate I keep coming back to — hard core versus protective belt, the negative and positive heuristics, progressive versus degenerating problemshifts, whether a programme is generating novel facts or just absorbing ones after the fact, his insistence that you can't rationally ditch a programme unless there's a rival on offer, the tenacity point about staying loyal, and the gap between appraising a programme and deciding what to do about it. The trouble is that all of that was written to describe the history of physics, not to be run by a generalist with a doctorate in something else, three hours per file, and a PI who gets to write a rebuttal.

  So: write me the runbook. Questions in the order I should ask them, what counts as a sufficient answer to each, what evidence in the file discharges it, where the runbook terminates in a stop-recommending, and where it hands the decision to the board because what's left is a question of values rather than a question about the science. It has to survive translation — tell me which of Lakatos's distinctions you're keeping because the runbook breaks without them, which you're dropping as unusable at this level of access, and where the simplification will systematically misfire. I'd specifically like your handling of: (a) what makes a fact "novel" here, when everything in the file is described by people with a stake in it looking novel; (b) how to tell an auxiliary move that's ad hoc from one that's merely content-preserving, and whether you think there's more than one flavour of ad hocness worth tracking separately; (c) how long a young programme gets before "no results yet" counts against it; (d) what to do when the whole subfield looks degenerating and there is no rival to point to; (e) how to run the prediction test in fields that can't do experiments, where the closest thing to a prediction is a retrodiction of data nobody had gone and collected yet.

  Then run it on three real files of ours:

  1. Forty-year-old programme in a molecular subfield. Enormous literature, trained essentially everyone currently working in it, and its models fit a huge amount of data better than anything else available. But its last confirmed ahead-of-time prediction was about eighteen years ago. Everything since has been a sequence of auxiliary hypotheses, each one introduced after the anomaly it was designed to handle was already on the table, each individually plausible and locally well-motivated by the positive heuristic, none of them having produced a new successful prediction. The PIs are good people and if we stop, the subfield loses roughly half its capacity for a decade. For what it's worth I want this one to come out as continue.

  2. Nine-year-old programme, four groups worldwide, one strange core commitment everyone else in the field treats as a non-starter. Two confirmed predictions that nobody expected and that were registered before the data came in, and one that failed. The incumbent framework in the field works fine, is cheap, and has no anomalies it can't handle — so on the rival question there's nothing to compare it to, it's the incumbent that would need a rival, not this.

  3. A programme in a historical/observational science where nothing can be run in a lab, whose recent work has repeatedly specified in advance which archive series or which uncollected measurements it needed, gone and got them, and been right — but where critics say the "specification in advance" was written by people who already knew roughly what they'd find, and where the failed specifications are simply not written up.

  Mark every step that's really a judgment call wearing a procedure's clothes, and finish with what the runbook can't do — including whether it can say anything at all about whether the questions a programme is asking are worth asking. No reading list or citations, I don't need them and I can't check them anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested runbook:

  1.  **Analyze the Request:**
      *   **User:** Program Officer at a small private foundation.
      *   **Context:** Funds whole research programs (6-8 year commitments), ~15 calls/year, 3 hours/file, renewal decision (default is continue unless documented case for stopping). Board approves.
      *   **Problem:** Current memos are metric-heavy (citations, dollars, fame). Board wants conceptual content.
      *   **Proposed Solution:** Use Lakatos's Methodology of Scientific Research Programmes (MSRP).
      *   **Constraints:** Must be usable by a generalist (non-expert in the specific subfield) with limited time. Must handle PI rebuttals. Must distinguish between scientific appraisal and funding decision (values).
      *   **Specific Requirements:**
          *   Write a "Runbook" (questions, sufficient answers, evidence, termination points).
          *   Explain adaptations of Lakatos (keep/drop/simplify).
          *   Address specific edge cases (a) novelty, (b) ad hocness, (c) young programmes, (d) no rival, (e) non-experimental prediction.
          *   Apply runbook to three specific case files.
          *   Mark judgment calls.
          *   State limitations (what the runbook *can't* do).
          *   No reading list/citations.

  2.  **Deconstruct Lakatos for this Context:**
      *   *Core Concepts:* Hard Core (irrefutable by convention), Protective Belt (auxiliary hypotheses), Negative Heuristic (don't touch core), Positive Heuristic (how to develop belt), Progressive Problemshift (predicts novel facts), Degenerating Problemshift (explains anomalies post-hoc), Tenacity (don't abandon too soon), Rivalry (need a better alternative to switch).
      *   *Adaptation Challenges:*
          *   Lakatos was retrospective (history of science); this is prospective (funding).
          *   Lakatos focused on physics/math; this includes observational/historical sciences.
          *   "Novelty" is contested by insiders.
          *   "Ad hoc" is hard to spot without deep technical knowledge.
          *   Funding decision $\neq$ Scientific verdict (social impact, capacity building matter).
      *   *Time Budget:* 3 hours/file means I can't read the papers. I need to rely on the PI's report, external reviews (if any), and specific probing questions.

  3.  **Drafting the Runbook - Structure:**
      *   **Introduction:** Philosophy of the tool (Appraisal vs. Decision).
      *   **Adaptations:** What we keep, drop, and simplify.
      *   **The Protocol (The Questions):** Sequential flow.
      *   **Evidence & Discharge:** What counts as proof.
      *   **Termination:** When to recommend "Stop" vs. "Board Decision."
      *   **Case Studies:** Applying the protocol to the three files.
      *   **Limitations:** What this tool cannot solve.

  4.  **Developing the Adaptations (The "Translation"):**
      *   *Keep:* Hard Core vs. Protective Belt (essential for structure), Progressive vs. Degenerating (essential for momentum), Tenacity (essential for foundation ethos), Rivalry (essential for switching costs).
      *   *Drop/Modify:* Strict "Novel Fact" definition (too hard for generalist). Instead, use "Risk of Failure." Strict "Ad Hoc" logic (too technical). Instead, use "Cost of Complexity."
      *   *Simplify:* Treat "Positive Heuristic" as "Work Plan Coherence."

  5.  **Addressing Specific Edge Cases (a-e):**
      *   (a) Novelty: Shift from "new to the world" to "risky for the theory." Did they bet something that could have falsified them?
      *   (b) Ad Hoc: Distinguish between *theoretical* ad hoc (saving the core with no new test) vs. *empirical* ad hoc (fitting data without mechanism). Track "complexity cost."
      *   (c) Young Programme: Grace period. 6-8 years is one cycle. If Cycle 1, focus on *potential* for novelty (Positive Heuristic strength). If Cycle 2+, need results.
      *   (d) No Rival: Lakatos says stay tenacious. Foundation says: Is the question still worth asking? If yes, fund. If the field is dead but useful (training), fund for social reasons, not scientific ones.
      *   (e) Non-experimental: Pre-registration of archival search. "Blind" analysis.

  6.  **Developing the Questions (The Runbook):**
      *   Q1: The Core. (What is untouchable?)
      *   Q2: The Belt. (What changed since last cycle?)
      *   Q3: The Risk. (What did they predict that could have been wrong?)
      *   Q4: The Rival. (Is there a better way to do this?)
      *   Q5: The Value. (Why keep this alive if science is stagnant?)

  7.  **Applying to Case Files:**
      *   *File 1 (Old, Stagnant, Essential):* Scientifically degenerating (post-hoc fixes), but socially vital. Runbook should flag "Degenerating" but hand off to Board for "Value" decision. *Correction:* User wants recommendation to "Continue." The runbook must allow continuing a degenerating program if the *decision* criteria (capacity) outweigh the *appraisal* criteria (science). I need to make sure the runbook distinguishes "Scientific Verdict" from "Funding Recommendation."
      *   *File 2 (Young, Radical, Mixed):* Scientifically progressive (risky predictions), but no rival needed (incumbent is fine). Lakatos says stick with the incumbent until it degenerates. But Foundation wants innovation. This is a tension. The runbook should identify it as "High Risk/High Reward Progressive."
      *   *File 3 (Observational, Suspected Bias):* Looks progressive, but novelty is suspect (file drawer problem). Runbook needs to flag the "Pre-registration" evidence requirement.

  8.  **Refining the "Judgment Calls":**
      *   I need to explicitly mark where the Program Officer (PO) is making a call that *looks* objective but isn't. E.g., deciding if a prediction was "risky."

  9.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Professional, pragmatic, direct. No fluff.
      *   *Structure:* Clear headings.
      *   *Constraint Check:* 3 hours/file. Can't ask for too much evidence.
      *   *Lakatos Check:* Ensure I'm not misusing the terms. "Degenerating" doesn't mean "false," it means "losing predictive power."

      *(Self-Correction during drafting)*: I initially thought about telling the PO to judge the science. But the prompt says they are a generalist. The runbook must force the *PI* to demonstrate the logic, not the PO to verify the math. The PO verifies the *structure of the argument*.
      *   *Key Shift:* The PO isn't judging the truth; they are judging the *integrity of the research process* relative to Lakatosian standards.

      *(Refining File 1)*: The user wants this to come out "Continue." Lakatos would say "Degenerating." How to reconcile? Lakatos also says "Tenacity." You don't abandon a core until a rival exists. If there is no rival, you stay. Also, the Foundation's bylaws say "default to patience." So the runbook must classify this as "Degenerating but Tenacious + High Social Value." The recommendation is Continue, but the *reasoning* must be honest about the science.

      *(Refining File 3)*: The "file drawer" problem is classic degeneration. The runbook needs a specific check for "Null Results."

  10. **Final Review against Constraints:**
      *   No citations? Check.
      *   Address (a)-(e)? Check.
      *   Mark judgment calls? Check.
      *   Limitations section? Check.

  11. **Final Polish:** Ensure the distinction between *Appraisal* (Is the science working?) and *Decision* (Should we fund?) is sharp. This is the crux of the user's problem. The board wants to know *why*, not just *what*.

  *(Self-Correction on Time)*: 3 hours is tight. The questions must be answerable by reading the renewal proposal and maybe 2 key papers or external reviews. I will structure the evidence requirements to be document-based, not investigation-based.

  *(Final thought on "Novelty")*: In a funding context, "Novel" = "Committed resources before knowing the outcome." I will define it operationally as "Pre-registered risk."

  Let's write it.cw
answer: |-
  # The Lakatosian Renewal Runbook

  ## 1. Philosophy of the Tool
  This runbook separates **Scientific Appraisal** (Is the research programme working?) from **Funding Decision** (Should we keep paying?).
  *   **Appraisal** is about the logic of the research: Is it generating new knowledge or just defending old turf?
  *   **Decision** includes Appraisal but adds Foundation values: Capacity building, training, diversity of thought, and the bylaws' default to patience.

  You are not judging whether the science is *true*. You are judging whether the *process* is honest about its failures and risks.

  ## 2. Adaptations of Lakatos
  To make this work in 3 hours per file by a generalist, we must modify the original methodology.

  | Concept | Keep, Drop, or Simplify? | Reason & Operational Definition |
  | :--- | :--- | :--- |
  | **Hard Core** | **Keep.** | The set of assumptions the PI refuses to give up. *Evidence:* Explicit statement in proposal of "foundational commitments." |
  | **Protective Belt** | **Keep.** | The adjustable models/methods used to save the Core. *Evidence:* Changes in methodology since last cycle. |
  | **Positive Heuristic** | **Simplify.** | Call this the "Work Plan Logic." Does the plan flow from the Core, or is it a grab-bag of techniques? |
  | **Novel Facts** | **Simplify (See 3a).** | Redefine as "Risky Commitments." Did they bet resources on an outcome that could have embarrassed them? |
  | **Ad Hoc** | **Simplify (See 3b).** | Redefine as "Complexity without Payoff." Did adding a fix make the model harder to use without enabling a new test? |
  | **Progressive/Degenerating** | **Keep.** | The core metric. Progressive = Predicting new things. Degenerating = Explaining old anomalies. |
  | **Rivalry** | **Keep.** | Essential for the "Stop" decision. You cannot recommend stopping unless a better alternative exists *or* the question is no longer worth asking. |
  | **Tenacity** | **Keep.** | Aligns with Foundation bylaws. A degenerating programme gets a grace period if no rival exists. |

  ---

  ## 3. Handling Specific Edge Cases

  **(a) What makes a fact "novel"?**
  *   **The Trap:** PIs claim everything is novel because it's never been done *exactly* this way.
  *   **The Runbook Standard:** Novelty = **Pre-Outcome Risk.**
  *   **Sufficient Answer:** "We committed to this measurement/experiment in [Date/Document] *before* the data was available, and the theory specified a range of outcomes that would have falsified the Core."
  *   **Evidence:** Lab notebooks, pre-registrations, dated internal memos, or grant proposals from the *previous* cycle citing the upcoming test.
  *   **Judgment Call:** You must decide if the risk was real. If the "prediction" was vague enough to fit any outcome, it is not novel.

  **(b) Ad Hoc moves: Content-preserving vs. Theory-saving.**
  *   **The Trap:** All science adjusts models. When is it cheating?
  *   **The Runbook Standard:** Track **Complexity Cost.**
  *   **Flavour 1 (Legitimate):** An auxiliary hypothesis is added, complexity increases, *but* it enables a new class of predictions. (Keep).
  *   **Flavour 2 (Degenerating):** An auxiliary hypothesis is added, complexity increases, and it *only* explains the specific anomaly that triggered it. (Flag).
  *   **Evidence:** Compare the model equations or logical structure from the last renewal to now. Count the new parameters. Ask: "What *new* thing can you calculate now that you couldn't before?" If the answer is "Nothing, we just fit the old data better," it is degenerating.

  **(c) The Young Programme Grace Period.**
  *   **The Runbook Standard:** Cycle 1 (Years 1-6) is for setting the Hard Core and Positive Heuristic. Cycle 2 (Years 7-12) is for Progressive Problemshifts.
  *   **Rule:** Do not penalize a Cycle 1 programme for lack of novel facts *if* the Positive Heuristic (Work Plan) is coherent. Do penalize Cycle 2+ programmes heavily for lack of novel facts.
  *   **Termination:** A Cycle 2 programme with zero risky commitments met gets a "Degenerating" Appraisal.

  **(d) No Rival / Whole Field Degenerating.**
  *   **The Runbook Standard:** This is a **Board Decision**, not a Scientific Appraisal.
  *   **Logic:** Lakatos says stay tenacious if no rival exists. Foundation bylaws say default to patience.
  *   **Action:** Appraise as "Degenerating." Recommend "Continue" *only if* the PI makes a case for non-scientific value (training, infrastructure, keeping the question alive).
  *   **Evidence:** A specific section in the memo titled "Strategic Value Despite Scientific Stagnation."

  **(e) Non-Experimental Prediction (Retrodiction).**
  *   **The Runbook Standard:** **Blind Analysis.**
  *   **Logic:** In observational sciences, you cannot run time forward. You must run the analysis blind.
  *   **Sufficient Answer:** "We specified the archive box and the search terms in [Date]. We did not look at the data until the protocol was locked. The theory predicted X pattern; the data showed X pattern."
  *   **Evidence:** Time-stamped protocol documents. If the "specification" was written after the PI glanced at the archive, it is not a prediction.

  ---

  ## 4. The Runbook Protocol (3-Hour Workflow)

  ### Step 1: Identify the Hard Core (30 Minutes)
  **Question:** What is the one claim this programme will *not* surrender, regardless of data?
  **Sufficient Answer:** A single paragraph in the PI's renewal summarizing the "Foundational Commitments."
  **Evidence:** Compare this paragraph to the original grant and the last renewal. Has the Core shifted?
  *   *If the Core has shifted:* The programme has effectively restarted. Treat as a new proposal (higher scrutiny).
  *   *If the Core is stable:* Proceed.
  **Judgment Call:** Distinguishing a shift in Core from a shift in the Protective Belt. If they change the definition of the main entity they study, that's a Core shift.

  ### Step 2: Audit the Protective Belt (60 Minutes)
  **Question:** What changes did you make to your models/methods to handle anomalies in the last 6 years?
  **Sufficient Answer:** A list of "Model Updates" or "Methodological Adjustments" with a justification for each.
  **Evidence:** Compare key publications from Year 1-3 vs. Year 4-6.
  **Discharge:**
  *   **Progressive:** Updates enabled a *new* type of measurement or prediction.
  *   **Degenerating:** Updates only allowed the model to fit data that previously didn't fit.
  **Judgment Call:** Determining if the update was "locally well-motivated" (good science) or "patched to fit" (ad hoc). Look for language like "to account for X anomaly" vs "to explore Y phenomenon."

  ### Step 3: The Risk Test (60 Minutes)
  **Question:** What did you predict in the last cycle that could have proven you wrong?
  **Sufficient Answer:** Three specific instances where the programme committed to a specific outcome before data collection.
  **Evidence:** Pre-registrations, dated proposals, or lab logs.
  **Discharge:**
  *   **Pass:** 2+ confirmed risky predictions.
  *   **Fail:** 0 confirmed risky predictions.
  *   **Mixed:** 1 confirmed, 1 failed, 1 pending.
  **Judgment Call:** Assessing the "Risk." If the prediction was "We will find a correlation," that is low risk. If it is "We will find a correlation of magnitude Z," that is high risk.

  ### Step 4: The Rival Check (30 Minutes)
  **Question:** If we stop funding this, what takes its place?
  **Sufficient Answer:** Identification of the main competing framework or an admission that none exists.
  **Evidence:** Citation analysis (who are they arguing against?) or PI statement.
  **Discharge:**
  *   **Rival Exists:** Is the rival progressing faster? (Check citation momentum or recent breakthroughs).
  *   **No Rival:** This triggers the "Tenacity Clause." You cannot recommend stopping based on science alone.

  ### Step 5: Appraisal vs. Decision (30 Minutes)
  **Question:** Given the Appraisal, what is the Funding Recommendation?
  **Logic:**
  *   **Appraisal = Progressive:** Recommend Continue (Standard).
  *   **Appraisal = Degenerating + Rival Exists:** Recommend Stop (or Sunset).
  *   **Appraisal = Degenerating + No Rival:** Recommend Continue *with Conditions* (Board Decision).
  *   **Appraisal = Degenerating + High Social Value:** Recommend Continue (Board Decision).

  **Termination Point:**
  *   **Stop Recommending:** Only if Appraisal is Degenerating AND a Progressive Rival exists AND Social Value is low.
  *   **Hand to Board:** If Appraisal is Degenerating BUT (No Rival OR High Social Value). The memo must explicitly state: "Scientifically degenerating, but strategically vital."

  ---

  ## 5. Case File Applications

  ### File 1: The Forty-Year-Old Anchor
  *   **Profile:** Molecular subfield. Dominant paradigm. Zero risky predictions in 18 years. Heavy auxiliary hypothesis usage. High capacity/training value.
  *   **Runbook Execution:**
      *   **Step 1 (Core):** Stable.
      *   **Step 2 (Belt):** **Degenerating.** Every change fits old anomalies; no new predictive power.
      *   **Step 3 (Risk):** **Fail.** No ahead-of-time predictions in 18 years.
      *   **Step 4 (Rival):** **None.** It is the incumbent.
      *   **Step 5 (Decision):** Appraisal is "Degenerating." However, Rival Check is "None." Tenacity Clause applies. Plus, "High Social Value" (50% capacity loss).
  *   **Recommendation:** **Continue.**
  *   **Memo Language:** "Scientific Appraisal: Degenerating Problemshift. The programme is absorbing anomalies rather than predicting novel facts. Funding Decision: Continue. Rationale: No viable rival exists (Lakatosian Tenacity). Cessation would collapse subfield capacity. Requirement: PI must propose one risky commitment for the next cycle to test Core viability."
  *   **Judgment Call:** We are overriding the scientific appraisal with the Foundation's bylaws (patience) and social utility. This must be explicit so the Board knows they are funding *capacity*, not *breakthroughs*.

  ### File 2: The Nine-Year-Old Heretic
  *   **Profile:** 4 groups. Strange Core. 2 confirmed risky predictions, 1 failed. Incumbent framework works fine.
  *   **Runbook Execution:**
      *   **Step 1 (Core):** Radical departure from field norms.
      *   **Step 2 (Belt):** **Progressive.** Adjustments led to confirmed predictions.
      *   **Step 3 (Risk):** **Pass.** 2 confirmed risky predictions outweigh 1 failure (Lakatos accepts failures if the heuristic remains productive).
      *   **Step 4 (Rival):** **Incumbent is fine.** This programme is the challenger, but the incumbent isn't degenerating yet.
      *   **Step 5 (Decision):** Appraisal is "Progressive."
  *   **Recommendation:** **Continue.**
  *   **Memo Language:** "Scientific Appraisal: Progressive Problemshift. Despite one failure, the programme is generating novel facts the incumbent cannot. Funding Decision: Continue. Rationale: Foundation mission supports diversity of approaches. Even if the incumbent is stable, this programme provides a necessary stress-test. Risk: High chance of ultimate falsification, but high value in the attempt."
  *   **Judgment Call:** Deciding that 2 successes outweigh 1 failure. In Lakatos, a programme can survive falsifications if the Positive Heuristic is still generating new insights. The judgment is that the *momentum* is positive.

  ### File 3: The Observational Archive
  *   **Profile:** Historical science. Claims pre-specification. Critics allege "file drawer" (hiding failures) and "hindsight bias" (writing specs after seeing data).
  *   **Runbook Execution:**
      *   **Step 1 (Core):** Stable.
      *   **Step 2 (Belt):** Appears Progressive.
      *   **Step 3 (Risk):** **Suspect.** Claims pre-specification.
      *   **Step 4 (Rival):** N/A.
      *   **Step 5 (Decision):** **Conditional Continue.**
  *   **Recommendation:** **Continue with Strict Conditions.**
  *   **Memo Language:** "Scientific Appraisal: Ambiguous. Apparent progressive shifts rely on retrodictions. Funding Decision: Continue, contingent on transparency. Rationale: Observational science cannot do lab experiments, but must adhere to 'Blind Analysis' standards. Requirement: All future archive searches must be time-stamped and publicly registered before data access. Failure to publish null results will trigger non-renewal."
  *   **Judgment Call:** You cannot verify the past bias in 3 hours. You must judge the *willingness* to accept future constraints. If the PI refuses pre-registration, the Appraisal flips to "Degenerating/Unscientific."

  ---

  ## 6. Limitations: What This Runbook Cannot Do

  **1. It cannot judge "Worthiness."**
  Lakatos tells you if a programme is *working*, not if it *matters*. A programme could be progressively solving a puzzle that no one cares about.
  *   *Mitigation:* This is where the Board's values enter. The memo must separate "Is the science tight?" from "Is the question important?"

  **2. It cannot detect Fraud.**
  If a PI fakes a prediction date or fabricates data, this runbook will not catch it. It relies on the integrity of the documentation provided.
  *   *Mitigation:* Random audits of lab notebooks for "Risk Test" evidence.

  **3. It creates a "Paperwork Burden."**
  Requiring pre-registrations and dated memos for "Novelty" disadvantages small, agile teams who don't document well.
  *   *Mitigation:* Accept diverse forms of evidence (e.g., email timestamps, conference abstracts) as long as they prove *temporal priority* (commitment before data).

  **4. It biases against "Moonshots."**
  A programme that fails for 12 years then succeeds in year 13 looks "Degenerating" for two cycles.
  *   *Mitigation:* Use the "Tenacity Clause." If the Positive Heuristic is logically sound but technically difficult, allow a third cycle *if* the PI can explain the delay without moving the Hard Core.

  **5. It cannot resolve Paradigm Incommensurability.**
  If the PI in File 2 says the Incumbent's data is "meaningless" and the Incumbent says File 2's data is "noise," you cannot judge who is right.
  *   *Mitigation:* Do not try. Fund both if budget allows. If you must choose, fund the one that is *more open* about its anomalies. Degeneration is not having anomalies; it is hiding them.

  ## 7. Final Instruction to the Program Officer
  When you write the memo, use this header structure:
  1.  **Scientific Appraisal:** (Progressive / Degenerating / Ambiguous)
  2.  **Evidence of Risk:** (List the bets they made)
  3.  **Rival Status:** (None / Weak / Strong)
  4.  **Strategic Value:** (Capacity / Training / Diversity of Thought)
  5.  **Recommendation:** (Continue / Stop / Conditional)

  If Section 1 says "Degenerating" but Section 5 says "Continue," you must write a bold paragraph explaining that **you are funding the community, not the discovery.** This honesty is what the Board is asking for. They don't want you to pretend the science is hot when it's cold; they want to know *why* you're keeping the heat on.
