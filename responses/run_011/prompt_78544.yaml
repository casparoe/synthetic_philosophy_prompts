  2.  **Deconstruct the Two Poles:**
      *   **Hofstadter (Le Ton beau de Marot):** The poem *is* its pattern/constraint. Translation is recreation of the puzzle in the target language. Fidelity is to the *spirit* of the constraint, even if words change. Ontology: The poem is a structural organism; form *is* content.
      *   **Nabokov (Onegin):** The poem *is* its semantic content. Music/rhyme is untransportable. Fidelity is to exact sense, even if ugly. Commentary handles the rest. Ontology: The poem is a statement of fact/imagination; form is decorative/secondary. Ethics: Do not lie to the reader about what the author said.

  3.  **Apply to the Invented Poem:**
      *   **Constraint:** Grammatical rhyme (1st pl. imp. subj.). Mood: Unrealized past collective.
      *   **Line 14 Problem:** Nonsensical verb used to keep rhyme/form.
      *   **Nabokovian Approach:** Must convey the nonsense? Or convey the meaning and note the rhyme? If fidelity is to sense, importing the nonsense is lying (because the nonsense is a product of Portuguese grammar, not intent). But if fidelity is to the *fact* of the poem, the damage must be noted. A literalist would likely translate the sense accurately and use footnotes to explain the grammatical rhyme and the forced verb. They would *not* try to rhyme in English if it damages sense.
      *   **Hofstadterian Approach:** Must find an English analogue to "grammatical rhyme." Maybe repeated auxiliary ("We might have..."), maybe anaphora. What about Line 14? If the constraint is king, the translator might need to force a word in English to maintain the pattern, even if it strains sense. But Hofstadter cares about the *effect* of the constraint. If the Portuguese reader feels "strain," the English reader must feel "strain."

  4.  **Evaluate Displacement Thesis:**
