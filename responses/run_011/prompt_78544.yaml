      *   *Displacement Thesis:* Is it third? It's a phenomenological observation, not a method. It breaks because it assumes strain is legible as art without the key. It's actually a description of failed Hofstadterianism.
      *   *Pole Assessment:* They differ on instruction. One says "don't lie," the other says "don't bore."
