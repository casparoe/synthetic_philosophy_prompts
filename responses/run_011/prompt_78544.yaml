      *   *Verdict:* It's likely an entailment of the Hofstadterian view (recreating the effect) but misdiagnoses the reader's experience. If the reader doesn't know the rule, strain reads as error. So the thesis claims translation *always* fails to communicate the constraint unless paratext exists. It might be a confusion about where the "art" resides.

  5.  **Assess Poles Against Each Other:**
