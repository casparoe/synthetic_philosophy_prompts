answer: |-
  Dear friend, I am sorry to hear about the late night and the unresolved tension, though I must say your flatmate has a sharp eye for conceptual stitching even if their explanation was cryptic. It is a common experience in welfare economics to encounter summaries that smooth over the joins between distinct arguments, and the chapter you describe is a classic example of conflating a mathematical result with a normative philosophy. To answer your request directly, the summary you were given is technically incomplete on the axioms, misleading on the status of utility comparability, and philosophically overstated in its conclusion, which validates your flatmate's suspicion that multiple distinct claims are being bundled together.

  The first place an economist would wince is the list of axioms. The summary states that individual and social preferences must be complete, transitive and continuous, but it omits the Independence axiom, which is the engine of the whole result. Harsanyi's Aggregation Theorem relies on the von Neumann-Morgenstern framework for decision-making under risk, and without the Independence axiom, you do not get expected utility representations, and consequently, you do not get the linear summation of utilities. Independence is the condition that rules out preferences for hedging or fairness that depend on the correlation of outcomes across states, and it is precisely this axiom that Rawlsians and egalitarians often reject when applied to social choice. By leaving it out of the list while mentioning risky prospects, the chapter glosses over the most controversial assumption in the setup. Furthermore, while the Pareto condition is correctly identified, the summary implies that Pareto plus the standard rationality axioms is sufficient, whereas the theorem specifically requires that the social welfare function respects the Pareto principle given that individuals are maximising expected utility. So, to answer your specific question, yes, the independence condition is effectively being run together with the Pareto condition without being named, which hides the source of much subsequent disagreement.

  The second and perhaps more significant error lies in the claim that utilities are already comparable on Harsanyi's setup. This is technically wrong within the confines of the Aggregation Theorem itself. The von Neumann-Morgenstern utility functions derived from the axioms are unique only up to positive affine transformations, meaning you can shift the zero and stretch the scale for each individual independently without violating their preferences. To sum these utilities, you need to fix the scales across persons, establishing interpersonal comparability of utility levels and units. The Aggregation Theorem does not do this; it merely says that if you have comparable utilities and satisfy Pareto, the social function is linear. The work of establishing comparability is done by a separate argument, often called the Impartial Observer Theorem, where Harsanyi argues that an observer behind a veil of ignorance would assign equal probability to being any person, thereby fixing the weights. The chapter summary conflates the Aggregation Theorem with the Impartial Observer argument, treating them as a single package when they are logically distinct steps. This is likely part of what your flatmate meant by three things in a trenchcoat: the mathematical aggregation result, the argument for interpersonal comparability, and the normative claim that this constitutes a proof of utilitarianism.

  This leads us to the closing claim that Harsanyi proved utilitarianism and that objections are merely a refusal to accept a theorem. This is where the category error arises. A mathematical theorem can only establish conditional truths: if you accept the axioms, then you must accept the conclusion. It cannot prove that the axioms themselves are morally binding. The heavy lifting is done by the normative justification for adopting expected utility theory as the correct model for social justice. Rawls, for instance, does not deny the mathematics; he denies that the Independence axiom is appropriate for choices about basic social structures, arguing that it imposes an unacceptable level of risk neutrality on the disadvantaged. Similarly, egalitarians might accept the welfarist framework but reject the idea that utility is the only relevant metric, or they might argue that the weights should not be equal but should prioritise the worse off. To say these positions are a refusal to accept a theorem is to misunderstand the nature of the dispute, which is about the moral plausibility of the premises, not the validity of the deduction. The theorem shows that utilitarianism is consistent with certain rationality constraints, not that it is the only rational moral system.

  So, to summarise where you stand after correcting the record, Harsanyi's work establishes that if you are a welfarist, if you accept expected utility theory as the correct model for both individual and social rationality, and if you can solve the problem of interpersonal comparability via an impartial observer, then classical utilitarianism follows. What does not survive correction is the idea that this constitutes a free-standing proof that settles the matter against Rawls or egalitarians. The extra argument needed to reach the view the chapter claims is proved is a robust defence of why the Independence axiom should apply to social justice and why vNM utility is the correct measure of advantage, neither of which are settled by the theorem itself. Your flatmate is right that the summary bundles a mathematical result, a specific model of risk, and a normative claim into one seamless narrative, but you are also right to feel that the narrative is compelling if you are already sympathetic to welfarism. The disagreement is not about the maths, but about whether the maths is the right tool for the job of justice. I hope this helps you settle the argument, or at least agree to disagree with more precision, and I suggest you both get some sleep before continuing the debate.
