answer: |-
  You have identified a genuine gap in the taxonomy of argumentative fallacies. While the *Reference Class Problem* is a well-documented epistemic difficulty, and *Reference Class Tennis* describes a state of disagreement where opponents select different classes, there is no standard, established term of art that specifically names the *single-agent tactical switching* of a reference class to preserve a conclusion against counterexample.

  The near misses you considered fail for the reasons you noted:
  *   **The Reference Class Problem:** This names the ambiguity itself, not the exploitative manipulation of it.
  *   **Ad Hoc Rescue:** This implies modifying the *hypothesis* to save it. Here, the hypothesis remains fixed; the *measurement tool* (the class) is swapped.
  *   **Moving the Goalposts:** This implies changing the *criteria for success*. Here, the success condition (the conclusion) remains fixed; the *pathway* is altered.
  *   **Special Pleading:** This implies claiming an exception for oneself. Here, the arguer claims the *definition of the group* itself is flexible.

  Because no established term captures this specific mechanic—the invariance of the conclusion despite the variance of the premise definition—I propose the following term and definition.

  ### Proposed Term: Reference Class Gerrymandering

  **Definition:**
  The practice of altering the boundaries of a reference class *solely* to maintain a pre-existing probabilistic conclusion when challenged, without treating the alteration as a substantive change to the argument's premises or conceding uncertainty.

  **The Edges (Legitimate vs. Illegitimate):**
  *   **Legitimate Selection:** The reference class is narrowed or widened based on *evidence about similarity*. (e.g., "I should not count rocks as observers because they lack cognition," or "I should count only humans born after 1900 because my evidence is indexed to modern technology.") The choice is constrained by facts about the observer, and changing the class *changes* the conclusion.
  *   **Illegitimate Gerrymandering:** The reference class is narrowed or widened based on *outcome optimization*. The choice is constrained only by the need to avoid absurdity or falsification. Changing the class *does not change* the conclusion, because the class is selected *because* it yields that conclusion.

  **Boundary Cases:**
  *   **Inside the Definition (Gerrymandering):** An arguer claims doom is likely because you are early in the sequence of "Humans." When shown that counting "Hominids" makes you mid-sequence (undermining doom), they switch to "Observer Moments." When shown that "Observer Moments" implies solipsism, they switch back to "Humans born in industrialized nations," all while maintaining the exact same probability estimate for doom. The class is a dial, not a premise.
  *   **Outside the Definition (Legitimate Sensitivity Analysis):** A researcher states, "If we count all mammals, the risk is low; if we count only technologically capable species, the risk is high. Since we are technologically capable, the latter is more relevant, but we should acknowledge the uncertainty." Here, the switch is argued for based on evidence, and the conclusion is updated to reflect the dependency.

  Verdict: PROPOSED — Reference Class Gerrymandering
