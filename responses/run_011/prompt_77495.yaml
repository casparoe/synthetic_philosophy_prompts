answer: |-
  # Problem Set 4: The Two-Envelope Paradox and Improper Priors

  **Course:** PHI 450 – Decision Theory and Probability  
  **Time Allowed:** 90 Minutes  
  **Total Marks:** 25

  **Setup:**  
  Consider the standard two-envelope problem. The smaller amount $S$ is drawn from a geometric distribution on powers of 2. Specifically, for a fixed parameter $0 < r < 1$:
  $$ P(S = 2^k) = (1-r)r^k \quad \text{for } k = 0, 1, 2, \dots $$
  The larger amount is $L = 2S$. You choose an envelope at random (probability $1/2$ each), open it, and observe the value $X$. Note that $X$ takes values in $\{2^0, 2^1, \dots\}$.

  **(a) [6 Marks]** Derive the posterior probability $p_k = P(S = X \mid X = 2^k)$ that you hold the smaller envelope. Using this, calculate the expected gain $E[\text{Gain} \mid X = 2^k]$ from switching envelopes. Show that for all $k \ge 1$, the sign of this expected gain is determined solely by $r$, independent of $k$.

  **(b) [5 Marks]** Explain why the case $k = 0$ (observing $X = 1$) yields a different posterior probability than $k \ge 1$. Does this boundary case vindicate the naive reasoning that one should treat the hypotheses "I hold the smaller" and "I hold the larger" as equiprobable ($p_k = 1/2$) for all $k$? Justify your answer.

  **(c) [8 Marks]** Prove that the prior expected value $E[S]$ is finite if and only if $r < 1/2$. Observe that this boundary coincides with the threshold for favorable switching derived in (a). Discuss what this coincidence implies about the two standard diagnoses of the paradox: (1) the fallacy lies in assuming the two hypotheses are equiprobable conditional on $X$, versus (2) the fallacy lies in using priors with infinite expectation. Which diagnosis is fundamental, and can the first explain anything the second cannot?

  **(d) [6 Marks]** Suppose $r > 1/2$. You should switch after observing *any* $X$, yet ex ante the envelopes are symmetric and switching is indifferent. Identify precisely which mathematical principle fails in this scenario (Countable Additivity, the Law of Total Expectation, or the legitimacy of comparing infinite expectations). Does this result refute a decision theory that recommends maximizing expected utility?

  ***

  # Model Answer

  **(a)** Let $H_S$ be the hypothesis that the observed $X$ is the smaller amount ($S=X$), and $H_L$ be the hypothesis that $X$ is the larger amount ($L=X$, implying $S=X/2$). For $k \ge 1$, the likelihood of observing $X=2^k$ under $H_S$ is $P(X=2^k \mid S=2^k)P(S=2^k) = \frac{1}{2}(1-r)r^k$. Under $H_L$, we must have $S=2^{k-1}$, so the joint probability is $P(X=2^k \mid S=2^{k-1})P(S=2^{k-1}) = \frac{1}{2}(1-r)r^{k-1}$.
  By Bayes' Theorem, the posterior probability of holding the smaller envelope is:
  $$ p_k = \frac{\frac{1}{2}(1-r)r^k}{\frac{1}{2}(1-r)r^k + \frac{1}{2}(1-r)r^{k-1}} = \frac{r^k}{r^k + r^{k-1}} = \frac{r}{r+1} $$
  If we hold $S$, switching gains $2^k - 2^k = 2^k$ (wait, if $X=S$, other is $2S$, gain is $X$). If we hold $L$, switching gains $2^{k-1} - 2^k = -2^{k-1} = -X/2$.
  The expected gain is:
  $$ E[\text{Gain} \mid X=2^k] = p_k(2^k) + (1-p_k)(-2^{k-1}) $$
  Substituting $p_k = \frac{r}{r+1}$ and $1-p_k = \frac{1}{r+1}$:
  $$ E[\text{Gain}] = \frac{1}{r+1} \left( r 2^k - 2^{k-1} \right) = \frac{2^{k-1}}{r+1} (2r - 1) $$
  Since $2^{k-1} > 0$ and $r+1 > 0$, the sign depends entirely on $2r - 1$. If $r > 1/2$, expected gain is positive; if $r < 1/2$, it is negative.

  **(b)** For $k=0$, $X=1$. Since $S \ge 1$, $X$ cannot be the larger envelope (which would require $S=1/2$). Thus $P(H_L \mid X=1) = 0$ and $p_0 = 1$. The case differs because the support of the prior has a lower bound. This does not vindicate the naive fifty-fifty reasoning ($p_k=1/2$). The naive reasoning assumes $P(H_S \mid X) = P(H_L \mid X)$ universally. Here, we see $p_k = r/(r+1)$, which equals $1/2$ only if $r=1$ (impossible) or asymptotically. The $k=0$ case proves the hypotheses are *not* structurally symmetric conditional on $X$, exposing the naive assumption as false for this specific prior, but it does not resolve the paradox for $k \ge 1$ where $p_k$ is constant but not $1/2$.

  **(c)** The expected value of $S$ is:
  $$ E[S] = \sum_{k=0}^\infty 2^k P(S=2^k) = \sum_{k=0}^\infty 2^k (1-r)r^k = (1-r) \sum_{k=0}^\infty (2r)^k $$
  This geometric series converges if and only if the common ratio $2r < 1$, i.e., $r < 1/2$.
  The boundary $r=1/2$ is identical to the switching threshold in (a). This suggests diagnosis (2) is fundamental. When $E[S]$ is infinite ($r \ge 1/2$), the expected gain from switching is positive everywhere. Diagnosis (1) claims the error is assuming $p_k=1/2$. However, even with the correct $p_k = r/(r+1)$, we still recommend switching whenever $r > 1/2$. Thus, correcting the conditional probabilities does not eliminate the paradox if the prior mean is infinite. Diagnosis (1) explains why the *naive* calculation ($0.5 \cdot 2X + 0.5 \cdot X/2 = 1.25X$) is wrong, but only diagnosis (2) explains why the *corrected* calculation still yields a paradoxical "always switch" recommendation.

  **(d)** The principle that fails is the **Law of Total Expectation** (LTE), which relies on countable additivity. Specifically, $E[Y] = \sum E[Y \mid X=x]P(X=x)$ fails when expectations are not absolutely convergent. Ex ante, symmetry dictates $E[\text{Gain}] = 0$. Ex post, $E[\text{Gain} \mid X] > 0$ for all $X$. Summing these positive conditional expectations yields infinity, not zero.
  This does not refute decision theory per se, but it limits the domain of Expected Utility Theory (EUT). EUT is well-defined only for acts with finite expectations (or where integrals converge absolutely). A decision theory recommending switching based on infinite expectations is not "refuted" but rather applied outside its validity conditions. The paradox arises from treating divergent series as convergent values.

  ***

  # Marking Scheme

  **Total:** 25 Marks  
  **Grade Thresholds:**  
  *   **A (21-25):** Precise algebraic derivations; clear distinction between naive and corrected posteriors; nuanced philosophical evaluation of infinite means vs. conditional probabilities.
  *   **B (16-20):** Correct algebra; identifies infinite mean as key; philosophical discussion is standard/textbook without deep engagement with the coincidence of boundaries.
  *   **C (11-15):** Algebraic errors in posterior; identifies "infinity" as the problem but cannot derive the $r=1/2$ threshold; vague on LTE failure.

  **Part (a) [6 Marks]**
  *   **2 Marks:** Correct derivation of $p_k = r/(r+1)$. (Deduct 1 if $k=0$ not excluded in derivation).
  *   **2 Marks:** Correct Expected Gain formula $ \frac{2^{k-1}}{r+1} (2r - 1) $.
  *   **2 Marks:** Explicit statement that sign depends on $2r-1$ independent of $k$.

  **Part (b) [5 Marks]**
  *   **2 Marks:** Identification that $S$ cannot be $2^{-1}$, so $p_0=1$.
  *   **3 Marks:** Argument that this refutes universal equiprobability ($p_k=1/2$) but does not solve the paradox for $k \ge 1$ (since $p_k \neq 1/2$ there either).

  **Part (c) [8 Marks]**
  *   **3 Marks:** Correct summation showing convergence iff $r < 1/2$.
  *   **3 Marks:** Argument that diagnosis (2) (infinite mean) is fundamental because "always switch" persists even with correct $p_k$ when $r > 1/2$.
  *   **2 Marks:** Acknowledgement that diagnosis (1) only corrects the *naive* calculation, not the structural paradox.

  **Part (d) [6 Marks]**
  *   **3 Marks:** Identification of Law of Total Expectation / Countable Additivity failure.
  *   **3 Marks:** Nuanced view on Decision Theory (limits of applicability rather than refutation).

  **Specific Penalties (Expected Errors):**
  1.  **The "Organizer's Budget" Error:** Appealing to real-world constraints (e.g., "the organizer cannot afford infinite money") to resolve the paradox.
      *   *Cost:* **-5 Marks** (Total). This is a philosophical category error in this context.
  2.  **The "Unjustified Equiprobability" Error:** Asserting $P(S=X|X)=1/2$ in Part (a) without derivation, or claiming the paradox vanishes if one simply assumes this.
      *   *Cost:* **-4 Marks**. Contradicts the explicit derivation required in (a).
  3.  **The "Missing Qualifier" Error:** Claiming "No proper prior licenses always switching" in Part (c) or (d) without adding **"with finite mean"**. (As Part (c) shows, proper priors with $r > 1/2$ *do* license always switching).
      *   *Cost:* **-3 Marks**. Demonstrates a failure to grasp the specific contribution of the geometric setup.
