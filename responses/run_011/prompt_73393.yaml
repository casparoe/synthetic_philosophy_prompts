prompt: |-
  Ok so I've been listening to a podcast run by a guy with a neuroscience PhD, and last week's episode was about split-brain patients and what they're supposed to mean for the unity of consciousness. I'm not in philosophy or psych, just interested, and I took notes because he talks fast. This is his summary, cleaned up a bit from my notes into one block:

  "When you cut the corpus callosum -- which is the only connection between the two hemispheres -- you don't get one person with a damaged brain, you get two people sharing a skull. In the classic experiments the patient fixates a dot and you flash a picture into the left visual field, so it goes only to the right hemisphere; ask what they saw and they say nothing at all, but their left hand can reach into a bag and pick the object out. So the speaking hemisphere genuinely has no idea what the other one just saw. And the right hemisphere cant understand language, its basically a mute savant. Gazzaniga's interpreter result is the kicker: show a chicken claw to one field and a snowy field to the other, the patient picks the shovel, and then when asked why, the speaking hemisphere calmly invents a story about cleaning out the chicken coop. Consciousness is a press secretary that writes the press release after the event. Which means nobody ever consciously decides anything -- free will is just the press secretary taking credit. And it gets worse for identity, because Parfit used exactly these patients to argue that you are already two subjects, and since identity isn't what matters anyway, there's no deep reason to care about your own future any more than a stranger's. If each hemisphere really is its own subject then there are two streams of experience running in that body, which means twice the welfare and twice the moral weight -- you'd have to count their suffering double in any utilitarian calculation. Outside the lab these patients look normal only because they've learned to fake integration, but underneath they're living two seperate lives at once."

  Couple of things before you answer. I was already inclined to think consciousness has to be unified, so I know I'm motivated to go hunting for holes in this. And I found the free will part exciting, which is probably also a bias. So: go through it claim by claim and tell me what's solid, what's a simplification he's allowed to make to keep a podcast moving, and what's just wrong -- including the bits where he's describing a real experiment correctly but drawing something from it that doesn't follow. Then tell me which of his three big conclusions survive once you fix the summary: the no-one-consciously-decides-anything one, the you're-already-two-subjects one, and the count-their-suffering-twice one. I'd like to know if I can keep any of them. And if the honest version of this material is more interesting than his version, tell me what that honest version actually says, because I suspect it is and I don't know what it'd look like.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

