          *   Nuance: This is the foundational empirical data.
      *   *Claim 3: "Right hemisphere can't understand language, its basically a mute savant."*
          *   Status: Simplification/Outdated.
          *   Nuance: RH has *some* language comprehension (nouns, concrete words), just not production. "Mute savant" is a bit dramatic.
      *   *Claim 4: "Gazzaniga's interpreter... chicken claw/snowy field... shovel... invents a story."*
