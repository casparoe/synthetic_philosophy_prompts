answer: |-
  1. **Vulnerability scan**
  *   **Unfalsifiable mechanism:** If survival proves migration occurred, and death proves it failed, the theory describes outcomes rather than causing them.
  *   **Kosovo inconsistency:** Lazar's choice is a "chosen catastrophe" (excluded like Masada), yet Branković's betrayal is the pivot. Which element actually carries the myth?
  *   **Selection bias:** Dunkirk is a victory narrative using defeat mechanics. Is the sample restricted to actual lost causes, or does the mechanism apply to winners too?
  *   **Causality reversal:** Do pivots create durability, or do durable myths attract pivots? Institutions may be the real cause, with pivots as decoration.
  *   **Measurement circularity:** Pivot density is scored post-hoc from surviving myths, not prospectively from available history, risking tautology.

  2. **Bottom line**
  Attack falsifiability first. If "pivot migration" explains every survival, it is a description, not a cause. Establishing a stopping condition forces her to define when the mechanism *fails*, which validates it when it works. This prevents the interview from becoming a tour of examples. Failure mode: a guest who answers every structural objection with a fresh example.

  3. **The strongest version of her view**
  Her theory identifies a specific narrative architecture that makes defeat digestible. By locating failure in a single reversible moment rather than systemic inferiority, the pivot preserves collective agency. Migration allows the myth to shed factual baggage while retaining the emotional core. This explains why fact-checking often strengthens belief rather than weakening it. For the thesis to be falsifiable, she must surrender the claim that all durable myths use pivots, identifying instead a case where high pivot density yielded no myth, or a durable myth emerged with no available pivots.

  4. **The questions**

  1. If every refutation triggers migration, what observation distinguishes "pivot migration" from the trivial claim that flexible narratives flex? [Falsifiability]
     *   *Follow-up:* You need a case where migration stops and the myth dies; what is the specific stopping condition?
     *   *Note:* She will likely cite a myth that vanished. Press for the *condition* that halted migration, not just the outcome.

  2. In Kosovo, Lazar's choice is a "chosen catastrophe" like Masada, which you exclude, yet Branković's betrayal is the pivot. [Kosovo case]
     *   *Follow-up:* If the pivot was a later accretion, is it the cause of durability or a symptom of it?
     *   *Note:* She will likely argue the pivot consolidated the myth. Press on whether the myth existed *before* the pivot was attached.

  3. Dunkirk is a defeat narrated as a triumph by a nation that won the war. [Category boundary]
     *   *Follow-up:* Is this a lost-cause myth on your account, or have you selected your sample on the dependent variable?
     *   *Note:* She will likely say it's different. Press for what her framework says about victorious nations cultivating pivot counterfactuals.

  4. Monuments and veterans' organizations plausibly did the causal work in the American case, with counterfactuals as decoration. [Institutional alternative]
     *   *Follow-up:* How do you distinguish a narrative-structure explanation from an interest-and-institution explanation?
     *   *Note:* She will likely say they work together. Press for a case where heavy sponsorship failed to sustain a myth.

  5. Can you show a case where a pivot spread without sponsorship, or where heavy sponsorship failed to sustain one? [Institutional alternative]
     *   *Follow-up:* If sponsorship is required, is the pivot density claim secondary to institutional power?
     *   *Note:* She will likely defend the pivot's primacy. Press for the independent variable status of the narrative structure.

  6. The halt order blames a decision; the stab-in-the-back blames a group. [Pivots of error versus pivots of treason]
     *   *Follow-up:* Does "concede the pivot, contest the payoff" have a different moral profile when the pivot names a traitor class?
     *   *Note:* She will likely say the method holds. Press on what happens under migration when the nearest pivot points at a minority.

  7. How do you operationalize the density of available pivots without already knowing which pivots became popular? [Measurement]
     *   *Follow-up:* If availability is scored after the fact, isn't the comparative claim circular?
     *   *Note:* She will likely describe her coding. Press for a case where she coded prospectively on a defeat she did not study.

  8. Ask her to show the coding done prospectively on a defeat whose myth-formation she did not study. [Measurement]
     *   *Follow-up:* Without prospective coding, how do we know density predicts longevity rather than longevity predicting density?
     *   *Note:* She may admit limitations. Press for a concrete plan to test this prospectively.

  9. Name a non-military defeat where you will commit now to the direction and target of the next migration. [Forward prediction]
     *   *Follow-up:* What would count as your being wrong within five years?
     *   *Note:* She will likely pick a recent political loss. Press for a specific falsification condition, not just a prediction.

  10. Conceding the pivot concedes viability: that the cause could have won. [Cost of prescription]
      *   *Follow-up:* Why should a movement that has secured viability care that the payoff is contested?
      *   *Note:* She will likely argue it drains moral energy. Press on whether her advice works only for myths whose payoff is moral rather than territorial.

  5. **Traps**
  1. "What drew you to this subject?" -> Backfire: Allows her to pivot to personal biography and anecdote, dissipating pressure.
  2. "How does this apply to current politics?" -> Backfire: Invites partisan grandstanding rather than historical analysis, letting her claim neutrality.
  3. "Do you worry this helps deniers?" -> Backfire: Lets her moralize about intent instead of defending the mechanics of her theory.

  6. **Success criteria**
  She must name a stopping condition for migration. She must clarify the Kosovo contradiction regarding chosen catastrophes. She must commit to a prospective prediction with a falsification date. Without these, it remains a taxonomy, not a theory. I need her to concede where the mechanism breaks, not just where it works.
