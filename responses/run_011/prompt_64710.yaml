answer: |-
  The excavator groaned as it bit into the clay bund, a sound that drowned out the wind in the reeds. Mara stepped over a puddle of oily water, her boots sinking slightly into the mud.

  You have to admit, she said, pointing to the yellow machine, this is cleaner than the alternative. If we let this scrub harden, you get a decade of voles breeding until they hit the wall, then starvation and mange. Flooding it now resets the clock.

  Eli kicked a clod of dried earth into the water. Resetting the clock kills the things living here now. The skylarks nesting in the gorse won't move to the water. They die.

  They die either way. The difference is that the ones who would have lived in the high-suffering scrub scenario never come into existence if we flood now. You aren't harming them by preventing their birth. You're preventing the condition that creates them.

  That assumes you know which state produces less suffering. Eli watched a heron lift off from the remaining channel, wings beating slowly. You're treating the pre-human baseline as the moral zero point, but there is no pre-human baseline here. This land was drained a hundred years ago. Every option we pick is a management decision. If you start editing habitat based on a welfare ledger, you have to commit to managing everything forever. You can't just flood this patch and walk away.

  I'm not talking about walking away. I'm talking about prioritizing. Mara stopped to wipe mud from her trouser leg. We know wild animals suffer. Parasites, predation, exposure. If we have the lever to reduce that density, why is pulling it wrong? Because it feels unnatural?

  Because the ledger is fake. You're counting the mammals you can see. What about the invertebrates? Eli gestured at the scrub. Draining this place initially probably killed billions of aquatic insects. Re-flooding it kills the terrestrial ones. How do you weight a mayfly's death against a vole's? If you're doing utilitarian calculus, the numbers swamp the mammals instantly. You end up paralyzed or accidentally optimizing for bug biomass.

  I don't ignore the insects. But if consciousness varies, intensity matters. A vole starving for three days might suffer more than a gnat flicked out of existence.

  Might. Eli turned as the excavator dumped a load of clay with a wet slap. That's the problem. You're building policy on might. We don't have the evidence to compare suffering across taxa. So when you propose degradation to reduce population, you're gambling. If you're wrong, you've created a wasteland with high suffering density and no way to fix it.

  So we do nothing? Leave the parasites and the slow deaths because we're afraid of miscalculation?

  I'm saying there's option value in waiting. Destruction is irreversible. If we flood this, we can't easily un-flood it if we realize the aquatic system produces more net pain. But if we let the scrub grow, we can still intervene later. Waiting keeps the doors open.

  Waiting keeps the suffering going now. Mara walked to the edge of the cut. Look at this water. It's quiet. The scrub is noisy with distress calls. You say option value, I hear a justification for inaction. You're treating the ecosystem as a sacred text that shouldn't be edited, but you admitted yourself it's already managed. Why is the current management default morally superior to intentional welfare engineering?

  Because the current management has feedback loops. If the vole population explodes, the raptors come. The system adjusts. If you intervene based on a welfare model, you break the feedback. You become the sole regulator. Are you ready to cull the raptors when they get too successful?

  If culling the raptors prevents more suffering than it causes, then yes. Mara looked at him. But I'll concede the insect point. If the aquatic invertebrates suffer more than the terrestrial ones, flooding is wrong. I need to know the density of suffering per hectare, not just the charisma of the species.

  Exactly. And we don't know that. Eli paused as a group of workers walked past, shouting over the engine noise. But I'll concede your point on baselines. You're right that appealing to nature is a dodge. This isn't wilderness. It's a garden we've forgotten to tend. The question isn't whether to manage, but what the goal is.

  So if the goal is welfare, not biodiversity for its own sake, would you support intervention?

  If we had the metrics. Eli looked out over the brown water. If you could show me that re-flooding reduces total suffering capacity by half, accounting for the insects and the birds, and that the risk of system collapse is low, I'd pick up a shovel. But you're asking me to accept a reduction in complexity based on a hunch about vertebrate pain.

  And you're asking me to accept visible suffering based on a hunch about systemic stability. Mara turned back toward the path. We're both waiting for data that doesn't exist.

  Then here is the crux. Eli fell into step beside her. If you could prove that a simplified, managed system sustains less conscious suffering per unit of energy than a complex wild one, would you support simplifying everything? Even if it meant losing species we value for other reasons?

  Mara thought for a moment, stepping over a root. If the suffering reduction was significant and verifiable? Yes. Biodiversity is instrumental. If it costs too much in pain, it's too expensive. What about you? If you knew that re-flooding this fen would increase total suffering but preserve a unique ecological process, would you still flood it?

  Eli stopped at the gate. If the increase in suffering was concentrated in high-sentience animals, like mammals or birds, no. I couldn't justify burning them for the sake of a process. But if it was mostly invertebrates? I don't know. That's where my ledger breaks.

  Then we agree on the mammals, and we're stuck on the bugs.

  And the irreversibility. Eli opened the gate. Until we can measure the bugs, we have to assume the cost of being wrong is infinite.

  Mara pushed the gate open. Then stop telling me I'm romanticizing nature. I'm trying to balance the books.

  And stop telling me I'm doing aesthetic valium. I'm trying to prevent a bankruptcy we can't recover from. They walked toward the road, the excavator noise fading behind them, neither satisfied but both measuring their next step more carefully.
