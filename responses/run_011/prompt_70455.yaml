  1.  **(6) contradicts (7):** You cannot argue that incremental welfare reforms entrench the industry and increase total suffering (7) while proposing a flagship welfare reform as your primary spend (6). Banning live boiling and requiring stunning makes slaughter more palatable to consumers, which directly triggers the "reassures consumers" risk you identified in (7).
      *   **Cheapest Fix:** Reframe the spend as a disruption tactic rather than welfare improvement. Argue that stunning requirements raise operational costs and logistical friction to shrink margins, not to improve welfare.
      *   **Cost:** This is a harder sell to legislators and allies who want clear welfare wins; it alienates the standard humane-slaughter coalition you would normally rely on for this ask.

  2.  **(6) contradicts (5):** You state the moral weight lies with shrimp and feed fish due to numbers (5), but your spending plan targets lobsters, crabs, and salmon (6). Lobsters are a luxury niche with negligible counts compared to shrimp; salmon counts are orders of magnitude lower than pelagic feed fish.
      *   **Cheapest Fix:** Shift the legislative focus to shrimp slaughter standards or corporate campaigns targeting feed-fish reduction.
      *   **Cost:** Shrimp processing is often offshore (jurisdictional hurdles), and feed fish are invisible to consumers, making public campaigning significantly harder than visible finfish/lobster campaigns.

  3.  **(3) creates rhetorical vulnerability against (2):** You claim sentience is a binary threshold where animals "count the same" (2), but your budget spreadsheet weights them differently based on probability (3). In practice, a fish (0.85) counts for 1.5x a crab (0.55) in your allocation, which looks exactly like the "dial" you reject.
      *   **Cheapest Fix:** Explicitly label the spreadsheet weights as "Expected Moral Value" rather than "Moral Status," clarifying that the difference is epistemic (uncertainty) not ontological (status).
      *   **Cost:** None logically, but it requires careful wording to prevent critics from accusing you of speciesism via the backdoor of uncertainty.

  **Pairs That Only Look Like They Conflict**

  *   **(2) vs. (3):** Binary status vs. Probability weighting. This looks like a contradiction but is standard decision theory under uncertainty. You are treating the *fact* of sentience as binary (in/out) but your *knowledge* of that fact as probabilistic. As long as you maintain that a sentient crab equals a sentient fish, the weighting reflects only the likelihood they are sentient, not their value if they are.
  *   **(1) vs. (7):** Negative utilitarianism vs. Population focus. This looks like a shift from suffering to numbers, but it is consistent under the assumption that farmed lives are net negative. If every life contains more suffering than happiness, then reducing the number of lives (7) is the direct equivalent of reducing total suffering (1).
