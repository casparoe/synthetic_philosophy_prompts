      *Let's write it.*
answer: |-
  This is a classic case of theoretical appropriation: taking a methodology designed for social enlightenment and weaponizing it for corporate risk mitigation. Your Head of Comms is using Neurath's humanism to justify obscuring data.

  Here is the breakdown you need for Thursday. It separates the philosophical readings of the slogan from the practical reality of your chart, and isolates the logical sleight of hand.

  ### Part 1: The Menu of Readings

  The sentence *"To remember simplified pictures is better than to forget accurate figures"* is a comparative value judgment. Its truth value depends entirely on how you define the terms.

  **1. The Mnemonic Truism (The "Something > Nothing" Reading)**
  *   **Claim:** If a human being inevitably forgets the specific number (figure), retaining a general impression (picture) is superior to retaining nothing.
  *   **Parameters:** *Remembered by:* General public. *Duration:* Long-term memory. *Accuracy:* Precision vs. Gist. *Simplification:* Abstraction of scale, not distortion of relationship.
  *   **Verdict:** **Trivially True.** It is a tautology. Retaining a rough estimate is mathematically superior to retaining null data.
  *   **Unit Assumption:** Assumes "memory retention" is the only metric of value.

  **2. The Cognitive Load Argument (The "Processing" Reading)**
  *   **Claim:** Visual patterns are processed faster and retained longer than tabular data; therefore, a visual representation yields higher utility even if precision is lost.
  *   **Parameters:** *Remembered by:* Non-experts. *Duration:* Medium-term. *Accuracy:* Directional accuracy (up/down) vs. Magnitude accuracy. *Simplification:* Removing gridlines/axes to reduce noise.
  *   **Verdict:** **Empirical and Testable.** Cognitive science generally supports this *if* the visual encoding is honest.
  *   **Unit Assumption:** Equates "utility of information" with "speed of recall."

  **3. The Pedagogical Trade-off (The "Neurath" Reading)**
  *   **Claim:** For social education, understanding the *relative scale* of a problem (via repeated units) is more important for civic action than knowing the exact statistic.
  *   **Parameters:** *Remembered by:* Citizens/Workers. *Duration:* Until decision time. *Accuracy:* Proportional accuracy vs. Numerical accuracy. *Simplification:* Standardized symbols (ISOTYPE rules).
  *   **Verdict:** **True under Qualifier.** Only true if the key is present so the viewer *could* learn the figure if they chose to.
  *   **Unit Assumption:** Assumes pictures and figures are translatable via a key (the "Transformer" role).

  **4. The Emotional Persuasion (The "Comms" Reading)**
  *   **Claim:** "Remembering" means "being emotionally affected by." "Accurate figures" means "dry, ignorable statistics." Therefore, an evocative image is superior to data.
  *   **Parameters:** *Remembered by:* Stakeholders/Donors. *Duration:* Immediate impact. *Accuracy:* Narrative truth vs. Statistical truth. *Simplification:* Replacing data marks with semantic imagery (e.g., sick child).
  *   **Verdict:** **False (Category Error).** This redefines "picture" from *data visualization* to *illustration*. It compares apples (data) to oranges (mood).
  *   **Unit Assumption:** Assumes "impact" is the unit, not "information."

  ### Part 2: The Unit of Measurement Sleight of Hand

  You are correct to suspect the units. The slogan assumes a trade-off between **Precision** and **Retention**.

  *   **Neurath's Assumption:** Pictures and figures measure the *same thing* (social facts). The picture is a translation of the figure. They are commensurable.
  *   **The Comms Head's Assumption:** Pictures measure *attention*, figures measure *boredom*. They are incommensurable.

  By treating them as incommensurable, she avoids the burden of proof. If the picture is a different *kind* of truth (emotional vs. statistical), she doesn't have to prove the picture accurately reflects the figure. She only has to prove the picture is memorable.

  ### Part 3: Which Reading Justifies Her Edits?

  **None of the readings justify deleting the key.**

  *   **Reading 1 (Truism):** Requires the picture to be remembered *instead* of the figure. If you delete the key, the picture cannot be translated into a figure *at all*. You aren't trading accuracy for memory; you are destroying the possibility of accuracy.
  *   **Reading 2 (Cognitive):** Cognitive load theory suggests removing legends *increases* ambiguity, which increases cognitive load as the brain tries to resolve the uncertainty.
  *   **Reading 3 (Pedagogical):** Neurath explicitly insisted on keys. The ISOTYPE method relies on the "Transformer" (the designer) mediating between statistician and public. Removing the key breaks the mediation.
  *   **Reading 4 (Emotional):** This is the **only** reading that supports her edits, but it requires redefining your chart.
      *   *Deleting the key:* Prevents scrutiny of the emotional claim.
      *   *Red/Grey recode:* Shifts from quantity (how many?) to judgment (which are bad?).
      *   *Hero photo:* Shifts from aggregate data (neighbourhoods) to anecdote (one child).

  **The Verdict on Her Edits:**
  She is not using the quote to defend a *visualization choice*; she is using it to defend a *genre shift*. She is moving the deliverable from **Information Design** (Reading 3) to **Advocacy Marketing** (Reading 4). The quote is the bridge she walks across to get from one to the other without admitting she changed the destination.

  ### Part 4: What Would Neurath Say?

  Otto Neurath would reject her usage on three specific grounds derived from his *Vienna Method* rules:

  1.  **"Repeat a standard sign rather than enlarge one."**
      *   *Your Chart:* Followed this (rows of identical icons).
      *   *Her Edit:* Violated this (one big photo replaces the repeated units). Neurath argued that one big picture represents "one big thing," not "many small things." A photo of one child cannot represent 500 admissions without lying.
  2.  **"Pictures as a helping language alongside words."**
      *   Neurath viewed ISOTYPE as a language *supplementing* text/numbers, not replacing them. The key is the grammar. Deleting the key is like deleting the legend from a map and claiming people will "remember the shape better."
  3.  **"The aim is to inform, not to persuade."**
      *   Neurath was a socialist empiricist. He believed hiding the numbers disempowered the worker. Turning a quantity chart into a "mood chart" (red for bad, photo for sad) is propaganda, not education. He would view the red/grey recode as a corruption of the data's neutrality.

  **Neurath's Verdict:** He would view the "Hero Photo" edit as a regression to pre-scientific illustration. He would view the deletion of the key as an act of censorship.

  ### Part 5: The Slide (For Your Review)

  The specific logical slide you need to name on Thursday is the **Equivocation on "Simplification."**

  *   **Neurath's Simplification:** *Abstraction.* Removing noise (perspective, shading) to make the **counting** easier. The structure of the data remains intact.
  *   **Comms Simplification:** *Reduction.* Removing nuance (keys, exact values) to make the **message** simpler. The structure of the data is dismantled.

  **The Script:**
  > "The signature claims we should trade *precision* for *retention*. It assumes the picture still contains the data, just in a more memorable format.
  >
  > But deleting the key doesn't trade precision for retention. It trades **verifiability** for **ambiguity**.
  >
  > Neurath's 'simplified pictures' were counting tools. They allowed a worker to count the icons and know the figure. Your edits turn the icons into decorations. You aren't applying Neurath's rule; you're inverting it. You're saying: 'To remember a simplified *mood* is better than to know an accurate *fact*.'
  >
  > That might be a valid comms strategy, but it isn't ISOTYPE, and we shouldn't cite Neurath to defend it."

  **Summary for the Meeting:**
  1.  **The Quote** compares Remembering vs. Forgetting.
  2.  **Her Edits** enforce Forgetting (by removing the means to Know).
  3.  **The Slide** is conflating *Visual Clarity* (Neurath) with *Narrative Control* (Comms).
  4.  **The Ask:** If we are doing advocacy (Reading 4), admit it and stop citing data visualization theory. If we are doing data viz (Reading 3), restore the key and the neutral palette.
