answer: |-
  Here are ten questions designed to press the reductionist account of domination, structured to narrow the escape routes for the "levels of abstraction" defense.

  **1. The Tenant Baseline**
  Let's start with a concrete case. Consider Tenant A on a month-to-month lease where the landlord can raise rent or evict on thirty days' notice, versus Tenant B with a five-year fixed lease at the same rent. Suppose the landlord is a recluse who never checks the property, so the *expected* interference for both is nearly zero. On your probabilistic account, their freedom levels should be nearly identical. But intuitively, Tenant A is vulnerable in a way Tenant B isn't. Does your math capture that difference, or does it tell us Tenant A is just as free as Tenant B?

  *   **Follow-up:** If they say the difference is captured by the *cost* of interference (eviction is costlier for A), push: "But the cost of eviction is high for both if it happens. The difference is the *power* to evict without cause. If your account reduces power to probability, and the probability is low for both, aren't you forced to say their freedom is the same?"

  **2. The Kind Master (Topic a)**
  That leads directly to the classic "kind master" objection. If a master has every incentive not to interfere, your expected-interference math suggests the slave is nearly free. Traditional republicanism says the slave is dominated regardless of the master's kindness. Are you willing to bite the bullet and say the contented slave is largely free, and if so, what does your theory lose that the traditional view keeps?

  *   **Follow-up:** If they say "Yes, they are largely free, and that's a feature not a bug," push: "Then why do we need the concept of domination at all? If a slave with a kind master is free in the only sense that matters, haven't you just conceded that actual interference is the only thing that counts?"

  **3. Aggregation Logic (Topic d)**
  To calculate this "probabilistic structure," are you aggregating across possible scenarios using expected value (probability times severity) or a worst-case threshold? If a tyrant is 99% likely to be benign but 1% likely to execute you, does that 1% dominate the calculation?

  *   **Follow-up:** If they say "It's expected value," push: "Then a high-probability minor annoyance could count as more domination than a low-probability death threat. That seems to invert our moral priorities. If you switch to worst-case, aren't you just smuggling the traditional 'capacity to interfere' back in and ignoring the probabilities you promised to center?"

  **4. Phenomenology of Freedom (Topic b)**
  Republicans often argue that non-domination explains a specific phenomenology: walking tall, not needing to ingratiate yourself, looking others in the eye. Does your reduction explain *why* we feel that fear in the tenant or slave case, or does it just re-describe the feeling as 'awareness of high probability' without explaining the normative weight of that awareness?

  *   **Follow-up:** If they say "It explains it because high probability causes fear," push: "But in the kind master case, the probability is low, so on your view, there should be no fear. Yet historically, slaves often live in fear *despite* a kind master, because the *status* is insecure. Does your account miss the anxiety caused by status itself, independent of the statistical risk?"

  **5. Law as Interference (Topic c)**
  Standard republicanism claims law in a well-ordered democracy tracks interests and thus doesn't dominate, even though it interferes. But on your view, domination is just probable interference. Since laws definitely interfere, and enforcement is probable, doesn't your account imply that all law is domination, regardless of how democratic it is?

  *   **Follow-up:** If they say "Democratic law has low probability of arbitrary interference," push: "But the interference itself is certain. If I speed, I *will* be fined. If domination is reduced to the structure of interference, and law is interference, you need to explain why the democratic source changes the math of the interference itself."

  **6. The Normative Primitive (Topic c)**
  To save the idea that democratic law isn't domination, do you need to sneak a normative primitive back in? For example, claiming that 'trackable' interference doesn't count toward the domination sum. If so, isn't that an admission that arbitrariness isn't just probability, but a separate normative filter you apply *before* doing the probability math?

  *   **Follow-up:** If they say "No, it's still just probability," push: "Then you have to claim the probability of democratic interference is zero. That's empirically false. So if you admit the probability is non-zero but the domination is zero, you're relying on a normative distinction between 'good' and 'bad' interference that your reduction was supposed to eliminate."

  **7. Redundancy and Negative Liberty (Topic e)**
  If domination is just modalized non-interference—weighted probabilities of costs—how is this distinct from the negative liberty view (like Berlin's) that already considers constraints and possibilities? Have you just rebuilt negative liberty with more complex math, making the 'third concept of liberty' redundant?

  *   **Follow-up:** If they say "We're describing the same thing at different levels of abstraction," push: "If the extension is the same—same cases, same verdicts—then the 'republican turn' in political philosophy was a verbal dispute. Are you comfortable saying Pettit and Skinner were fighting over vocabulary, not concepts?"

  **8. The Abstraction Defense**
  You've hinted that you aren't disagreeing with negative libertarians but describing the same terrain at a different level of abstraction. But if your reduction succeeds, every claim about domination becomes a claim about risk assessment. Doesn't this dissolve the distinctively *political* critique of republicanism into a technocratic audit of interference risks?

  *   **Follow-up:** If they say "Politics is risk management," push: "Then the critique of power becomes a critique of bad statistics. If a dictator is statistically benign, you have to call him free. Does that not strip the concept of domination of its critical force against structural power?"

  **9. Policy Stakes (Tenant Case Return)**
  Let's return to the tenants. If Tenant A (month-to-month) and Tenant B (five-year lease) have the same expected interference, does your view support giving them the same legal protections? If you say Tenant A needs more protection despite the identical risk profile, isn't that an admission that the *structure of power* matters independently of the probabilistic outcome?

  *   **Follow-up:** If they say "Tenant A needs protection to lower the risk," push: "But we stipulated the risk is already low because the landlord is passive. If you regulate the lease terms anyway, you're regulating the *relationship status*, not the interference probability. That admits the republican intuition is right and your reduction is wrong."

  **10. Falsification Conditions**
  Finally, what would count as evidence against your reduction? Is there a concrete case or empirical finding where the probability-of-interference metric says 'dominated' but our best judgment says 'free,' or vice versa, that would force you to revise the theory? Or is the account insulated from counter-example by redefining the probability weights?

  *   **Follow-up:** If they say "It's a conceptual truth, not empirical," push: "If it's conceptual, then it's not a reduction to probabilistic structures, which are empirical. You can't have it both ways: either it's a empirical claim subject to counter-example, or it's a definition that begs the question against the traditional view."

  ***

  **Load-Bearing Questions**

  *   **Question 2 (The Kind Master):** This is load-bearing because it tests the *sufficiency* of the reduction. If the guest bites the bullet and says the contented slave is free, they alienate the core republican intuition that justifies the tradition. If they don't, they must admit the probability metric is insufficient, requiring an additional normative variable (which breaks the reduction).
  *   **Question 6 (The Normative Primitive):** This is load-bearing because it tests the *consistency* of the reduction regarding law. To maintain the standard republican claim that democratic law is non-dominating, they must either deny law interferes (false) or introduce a normative filter to exclude "good" interference from the domination sum. If they introduce that filter, the reduction to "probabilistic interference" fails, as the filter is not probabilistic.
