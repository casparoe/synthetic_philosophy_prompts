answer: |-
  Your unease stems from a conflation of two distinct historiographical operations: establishing *event historicity* (did this happen?) and establishing *source validity* (what truth does this document contain?). Your tentative principles of Trace and Corruption are sound foundations, but they require sharpening to handle the edge cases you have identified, particularly the tension between the *Catalogue of Ships* and the Burgundian ancestor list.

  Here is an analysis of your position, a repair of your principles, and an application to your specific questions.

  ### 1. Testing and Repairing the Principles

  Your current clauses are close, but the **Trace Clause** is too binary (it implies a verdict of 'no history' if a trace is missing), and the **Corruption Clause** is too vague regarding *why* some details escape distortion. To generate your verdicts consistently, I propose the following repaired principles:

  **Principle I: External Correspondence (replacing Trace)**
  A narrative element counts as history of the *period described* only if it corresponds to evidence independent of the narrative tradition (archaeology, contemporary foreign records, epigraphy). Where such correspondence is absent, the element counts only as history of the *period of composition* (evidence of what the later culture believed or wished to claim).

  **Principle II: Internal Disinterest (refining Corruption)**
  Within a narrative lacking full external correspondence, specific details count as history of the *period described* only if they would have been useless, inconvenient, or obscure to the narrator. Traditions preserve 'dead data' (abandoned place-names, unflattering defeats) more reliably than 'live data' (legitimising genealogies, moral victories).

  **Application to your cases:**
  *   **Motivating Case for External Correspondence:** The **Sea Peoples**. You accept the Egyptian inscriptions despite their triumphalist tone because the destruction layers (independent trace) confirm the core event. Without this clause, you would have to reject the inscriptions as mere propaganda.
  *   **Misjudged without External Correspondence:** **Arthur**. You accept the Battle of Badon but reject Arthur. Without this clause, you might feel compelled to accept the man because the battle is accepted. The clause forces you to admit: there is a trace for a battle at Badon (Gildas, archaeology of the period), but no independent trace for a man named Arthur.
  *   **Motivating Case for Internal Disinterest:** The **Catalogue of Ships**. You accept it because it lists sites abandoned by Homer's day. This is 'dead data'; Homer gained no prestige from listing ruins.
  *   **Misjudged without Internal Disinterest:** The **Burgundian Ancestor List**. You reject the historicity of Gibica and the others. Without this clause, you might treat this list like the Catalogue (a name-list). But this list is 'live data'; it served a legal function to legitimise current rule. The pressure to invent is high.

  ### 2. Story about Reality vs. Story as Artefact

  You are correct to suspect you are sliding between two claims. This distinction does not dissolve your inconsistencies; it explains them. You are operating with two different definitions of "history":

  1.  **Ontological History:** Claims about what actually occurred in the past (e.g., "Did the Trojan War happen?").
  2.  **Documentary History:** Claims about the document itself as a historical object (e.g., "What does the *Song of Roland* tell us about the 11th century?").

  Your verdict on the **Donation of Constantine** and **Geoffrey of Monmouth** proves you already accept this duality. You call them forgeries (Ontological: False) yet first-rate sources (Documentary: True).

  **Do you need two criteria?**
  Yes. You need a **Rule of Reference**:
  *   If the question asks about the *events described*, apply **External Correspondence**.
  *   If the question asks about the *text's context*, apply **Internal Disinterest** to the text's own biases to see what it reveals about its authors.

  This rule permits you to say the *Song of Roland* is false history of 778 (Ontological) but true history of 1100 (Documentary). It resolves the unease regarding Roncevaux: the poem damages the ontological history of the ambush but preserves the documentary history of the memory of the ambush.

  ### 3. Unsavable Verdicts

  If we enforce the repaired principles strictly, one of your verdicts becomes untenable: **The Arthurian Battle of Badon.**

  You accept the battle (c. 500) but reject the man (Arthur), despite the Welsh Annals linking them in the same entry.
  *   **The Problem:** Under **External Correspondence**, the trace for Badon is Gildas (who does not name Arthur) and archaeology (which is ambiguous). The trace for Arthur is *only* the tradition you distrust.
  *   **The Sacrifice:** To remain consistent with your rejection of the Trojan War narrative (where you have Hissarlik but reject the *Iliad*'s cause), you must treat Badon similarly. You can accept that *a* battle occurred (trace: Gildas/archaeology), but you cannot accept that *Arthur* won it (trace: none).
  *   **Why this one?** You already half-admit this by rejecting Camlann entirely. The Badon verdict is the lingering inconsistency. You are allowing the name 'Arthur' to cling to the battle because the tradition is persistent, whereas you rightly severed 'Paris' from 'Alaksandu' in the Hittite case.
  *   **Cost:** You lose the romantic kernel of the Arthurian legend. You are left with a nameless British victory, which is historically more robust but narratively sterile.

  ### 4. Diagnosis: Catalogue of Ships vs. Burgundian List

  You feel these are the same kind of thing (name-lists in a workaday register). They are not. The repaired **Internal Disinterest** clause explains why your different verdicts are actually correct, even if your reasoning felt shaky.

  *   **The Catalogue:** This is **fossilised data**. For an 8th-century bard, listing cities that were ruins in the Bronze Age offered no political advantage and added no glory. It was traditional baggage. Therefore, it escapes the 'Corruption' pressure. Your verdict to treat it as evidence of the Bronze Age is permissible *where corroborated by archaeology* (e.g., sites that were indeed abandoned).
  *   **The Burgundian List:** This is **functional data**. A law code citing ancestors is a claim to legitimacy. The compilers had a direct incentive to extend the lineage or invent prestigious names (Gibica) to bolster the ruling house's status against rivals. Therefore, it is subject to high 'Corruption' pressure.

  **Which way should you move?**
  You should maintain the distinction but refine the **Catalogue** verdict. Do not call it a "historical document" of the Bronze Age in the same sense as the Hittite Archive. Call it a **preserved memory**.
  *   **What you lose:** You lose the certainty that the Catalogue represents a specific political moment (the late 13th century). It may represent a conflation of Bronze Age geography known through oral tradition.
  *   **What you gain:** Consistency with the Burgundian case. Both are evidence of how later cultures remembered the past; only the Catalogue happens to align with physical traces (mounds) that the Burgundian names do not.

  ### 5. Application to New Cases

  Applying the **External Correspondence** and **Internal Disinterest** principles:

  *   **Ragnar Lodbrok:** **Not History (Ontological).** Like Arthur, he is a compression of multiple Viking leaders into a single eponymous ancestor. The trace (Viking raids) exists; the man (Ragnar) does not.
  *   **Robin Hood:** **Not History (Ontological).** No external correspondence. High internal interest (folk hero archetype). He is a myth of social resistance, not a man.
  *   **Palatine Hut Foundations vs. Romulus:** **Huts = History; Romulus = Not.** Matches your Troy verdict. The trace (foundations) exists; the narrative (she-wolf, founder) is aggrandisement.
  *   **Kurukshetra War (Mahabharata):** **Kernel = History; Narrative = Not.** Like Troy. Archaeological evidence of destruction in the region exists (External Correspondence), but the scale, divine intervention, and specific genealogies are aggrandisement (Corruption).
  *   **Historicity of Homer:** **Not History.** Like Arthur. He is likely an eponym for a tradition of bards. No contemporary trace of a single author.
  *   **Career of the Buddha:** **Kernel = History; Details = Not.** The Edicts of Ashoka confirm the existence of the Buddhist tradition and a founder (External Correspondence). The miraculous details of his life are hagiography (Corruption).
  *   **Constantine's Vision:** **Propaganda = History; Vision = Not.**
      *   *The Report:* That Constantine *claimed* a vision is history (Documentary). It is attested by contemporaries.
      *   *The Event:* That a supernatural vision occurred is not history (Ontological). No external correspondence for the supernatural.
      *   *Does the principle drive them apart?* Yes, and correctly so. Your desire to "keep the propaganda and lose the vision" is precisely what the **Rule of Reference** (Section 2) permits. The propaganda is a historical fact about Constantine's reign; the vision is a theological claim without trace.

  ### 6. Threshold vs. Ordering

  Your criterion should output an **Ordering**, not a Threshold.

  A threshold (e.g., "51% historical") invites the arbitrariness you fear. An ordering acknowledges that historicity is a spectrum of probability based on the convergence of traces and the absence of narrative utility.

  **A Well-Behaved Ordering:**
  Rank cases by the **Convergence of Independent Traces** minus the **Narrative Utility**.

  1.  **High Historicity:** Hittite Archive, Sea Peoples (Multiple independent traces: archives + archaeology + low narrative utility for the scribe regarding specific names).
  2.  **Medium Historicity:** Catalogue of Ships, Battle of Badon (Single trace type: archaeology or foreign mention + low narrative utility for specific details).
  3.  **Low Historicity:** Arthur, Ragnar, Romulus (No independent trace for the individual + high narrative utility for the persona).
  4.  **Documentary History Only:** Donation of Constantine, Song of Roland (Zero ontological historicity for events described, high documentary value for the time of writing).

  This ordering is well-behaved because it is additive. Adding a new trace (e.g., a contemporary inscription mentioning Arthur) moves the case up the order. Identifying a new narrative motive (e.g., proving the Burgundian list was needed for a specific succession dispute) moves the case down. It turns your verdicts from arbitrary judgments into a scalable assessment of evidence.

  ### Summary of Advice

  Your instincts are largely correct, but your terminology conflates the *event* with the *source*.
  1.  **Adopt the Rule of Reference:** Distinguish between Ontological History (did it happen?) and Documentary History (what does the text reveal?).
  2.  **Refine the Principles:** Use **External Correspondence** for events and **Internal Disinterest** for details within texts.
  3.  **Sacrifice Arthur:** To be consistent with your handling of Troy and the Hittites, you must accept the Battle of Badon while rejecting the name Arthur.
  4.  **Clarify the Catalogue:** Treat it as 'preserved memory' corroborated by archaeology, distinct from the Burgundian 'legitimising genealogy'.
  5.  **Use an Ordering:** Stop looking for a binary switch. Rank your cases by the weight of traces and the lack of motive to lie.

  This framework preserves your nuanced verdicts on Troy, the Sea Peoples, and Constantine, while resolving the anxiety over the Burgundians and Arthur.
