prompt: |-
  I write about science and ideas for a UK magazine and I've been stuck for weeks on a piece about the multiple realisability argument — the one that's supposed to sink the claim that mental states just are brain states. I've got the shape of it down: the opening move, that a creature whose neurology is nothing like ours could still be in pain; the follow-up that multiply realised kinds are perfectly respectable anyway, since economics and biology are full of them; then the counter-attack, roughly that if the realisers really are that different they can't all be counted as doing the same job, so either the functional description is carrying all the weight or the realisations were never so different to begin with. Plus the rejoinder from people who actually do comparative neuroscience, who say the thought experiments are too clean and that homologous structures don't line up across species the way the debate assumes. And hanging over the whole thing, the causal question: if the realiser is what does the causing, what is left for the mental kind to do?

  I have six versions of this argument and the piece isn't moving. My working hypothesis, which I'd like you to test rather then flatter: there isn't one disagreement here, there are two wearing the same coat — one about whether reduction can be true and still leave the special-science kinds autonomous, and one about whether causal work has to be booked at a single level. If that's right, the thing has stalled because each camp is answering a question the other side isn't asking, and the neuroscientific evidence can't break the tie because neither side's claim was ever empirical in the way it looks.

  Can you diagnose it properly? Ground the diagnosis in what each side actually does — the moves they make, the examples they reach for, what each treats as needing explanation — not in a survey of who holds what. Its a diagnosis I want, not an adjudication, and not a history. Then tell me honestly what would count as progress: a distinction somebody needs to draw, a kind of case that would actually be decisive, a formal result, or a change of subject. If your answer is that nothing would move it and we should stop pretending otherwise, say that and give me the reason.

  One wrinkle worth folding in. A computational neuroscientist I interviewed thinks the whole thing dissolves if you replace the question with a substitution test: two systems share a mental state just in case you can swap one into the other's causal context — the same inputs, the same downstream effects, the same place in the network — and nothing about the system's behaviour or internal dynamics registers the difference. He thinks that's a third option between the camps. Half the philosophers I put it to said it's functionalism with the serial numbers filed off; the other half said it's doing something new, because it makes sameness of state a matter of degree and of context rather than a yes/no. Where does it actually land, and does it break the deadlock or just relocate it?

  No bibliography and no reading list, please, I can chase that down myself. And write the whole thing in British English, including the -ise spellings.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A science/ideas writer for a UK magazine.
      *   **Topic:** The Multiple Realisability (MR) argument against Identity Theory (mental states = brain states).
      *   **Current State:** Stuck for weeks, six versions written, piece isn't moving.
      *   **Working Hypothesis:** There aren't one but *two* distinct disagreements masquerading as one (Reduction/Autonomy vs. Causal Exclusion/Levels). The stalemate exists because camps answer different questions, and empirical evidence (neuroscience) can't break it because the claims aren't purely empirical.
      *   **Task:** Diagnose the stalemate properly (grounded in moves/examples/explanatory goals, not history/surveys). Tell them honestly what counts as progress (distinction, case, result, or stop pretending).
      *   **Specific Wrinkle:** Incorporate the Computational Neuroscientist's "Substitution Test" (swap systems, check causal context/behaviour). Philosophers are split (Functionalism rehashed vs. New graded/contextual approach). Where does it land? Does it help?
      *   **Constraints:** No bibliography/reading list. British English (-ise spellings). Tone: Diagnostic, honest, intellectual, not flattering.

  2.  **Deconstruct the Working Hypothesis:**
      *   The user suspects two disagreements:
          1.  *Metaphysical/Explanatory:* Can reduction coexist with special-science autonomy? (The "Kind" question).
          2.  *Causal:* Does causal work happen at one level or many? (The "Power" question).
      *   *Assessment:* This is a strong intuition. The MR debate often conflates "Are mental states *identical* to brain states?" with "Can we *explain* behaviour using mental states?" and "Do mental states *cause* anything?"
      *   *Diagnosis:* I need to validate this but sharpen it. It's not just two disagreements; it's a category error regarding what "realisation" means in each context.

  3.  **Analyse the "Moves" of Each Side (as requested):**
      *   *The Anti-Reductionists (MR proponents):*
          *   *Move:* Thought experiments (octopuses, silicon chips, aliens).
          *   *Goal:* Show that the *extension* of "pain" exceeds the *extension* of "C-fibre firing".
          *   *Explanatory Need:* Protect the autonomy of psychology. If pain = C-fibres, psychology collapses into neuroscience.
      *   *The Reductionists/Identity Theorists:*
          *   *Move:* "Local reduction" or "Species-specific identities". Or attacking the functional description as too vague.
          *   *Goal:* Show that causal powers reside in the physical substrate.
          *   *Explanatory Need:* Preserve causal closure of the physical. If mental kinds are distinct, they are epiphenomenal.
      *   *The Neuroscientists:*
          *   *Move:* "Homology is messy."
          *   *Goal:* Show the thought experiments are biologically unrealistic.
          *   *Explanatory Need:* Ground the debate in actual data.
      *   *The Problem:* The philosophers are arguing about *possibility spaces*, the scientists are arguing about *actual distributions*. They talk past each other.

  4.  **Evaluate the "Substitution Test" (The Wrinkle):**
      *   *The Proposal:* Swap systems. If inputs/outputs/network role remain identical, the state is the same.
      *   *Philosopher Reaction 1:* "That's just Functionalism." (True, broadly speaking).
      *   *Philosopher Reaction 2:* "It makes sameness graded/contextual." (This is the interesting bit).
      *   *Analysis:* The test shifts the focus from *ontology* (what *is* it?) to *operational equivalence* (does it *work* the same?).
      *   *Does it break the deadlock?* No. It sidesteps the ontological question. If I swap a silicon chip for a neuron, and the system works, the Anti-Reductionist says "See! Multiple Realisability!" The Reductionist says "See! The silicon is now mimicking the causal power of the neuron, so the causal power is still local."
      *   *Verdict:* It relocates the deadlock to the definition of "same causal context."

  5.  **Drafting the Diagnosis (Iterative Process):**

      *   *Introduction:* Acknowledge the stall. Validate the hypothesis. Yes, it is two arguments in a trench coat.
      *   *Section 1: The Two Disagreements.*
          *   Disagreement A: The Taxonomic Question (Kinds). Are we carving nature at the joints? MR says "No, functional joints differ from physical joints." Reductionists say "Yes, physical joints are the only real joints."
          *   Disagreement B: The Causal Question (Power). Where does the oomph come from? MR implies top-down or autonomous causation. Reductionists demand bottom-up physical closure.
          *   *Why it stalls:* One side is arguing about *classification* (can we group these things?), the other about *mechanism* (how does this push that?). Neuroscience can't solve classification disputes.
      *   *Section 2: The Substitution Test.*
          *   It's operational functionalism.
          *   It doesn't solve the ontology. It solves the *engineering* problem, not the *metaphysical* one.
          *   It introduces "degree," which helps science (approximations) but hurts philosophy (binary identity).
          *   It relocates the deadlock to "How similar is similar enough?"
      *   *Section 3: What Counts as Progress?*
          *   Honest truth: The metaphysical deadlock is likely permanent because it's verbal/conceptual.
          *   Progress lies in dissolving the question. Stop asking "Are they identical?" Ask "What level of description yields the best prediction/control?"
          *   The "Change of Subject" option is the most honest.
      *   *Tone Check:* British English (realise, programme, colour, etc.). No fluff. Direct.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't just say "it's verbal." I need to explain *why* it looks empirical but isn't.
      *   *Point:* The MR argument relies on *nomological possibility* (could there be?), neuroscience relies on *actual distribution* (is there?). You can't refute a modal claim with an actuality.
      *   *Point on Substitution:* The neuroscientist thinks it dissolves the problem because they care about *control*. The philosopher cares about *truth*. That's the friction.
      *   *Final Verdict:* The user's hypothesis is correct. The "Substitution Test" is a pragmatic tool, not a metaphysical solvent. The advice should be to pivot the article to *why* we care, rather than *who is right*.

  7.  **Final Polish (British English & Style):**
      *   Ensure -ise spellings (realise, organise, categorise).
      *   Ensure vocabulary fits a UK magazine (e.g., "programme," "centre," "modelling").
      *   Keep it punchy. The user is a writer; they appreciate good prose.

  8.  **Structure of the Response:**
      *   **Diagnosis:** Confirm the "two disagreements" hypothesis.
      *   **The Taxonomic vs. Causal Split:** Detail the moves.
      *   **The Empirical Illusion:** Why neuroscience can't fix it.
      *   **The Substitution Test:** Analyse the wrinkle.
      *   **The Way Forward (or Stop):** Honest advice on progress.

  *(Self-Correction on British English)*: Watch out for "program" (computer) vs "programme" (schedule/plan). In UK English, "computer program" is often "program", but "programme" is general. I will stick to standard UK conventions. "Realise" not "realize". "Centre" not "center".

  *(Final check on the Substitution Test)*: The user asks "Where does it actually land?" I need to be decisive. It lands on *pragmatic equivalence*, which sidesteps the *ontological identity* question. It helps the scientist, frustrates the metaphysician.

  *(Final check on Progress)*: Don't promise a solution. Tell them the solution is recognising the category error.

