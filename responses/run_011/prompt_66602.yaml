  ## Scoring Key and Diagnostic Leaves

  Tally your answers. The letter you selected most frequently indicates your primary commitment. If your answers are mixed, review the descriptions below to see which principle you are unwilling to compromise.

  **Mostly A: Premise Sovereignty**
  *   **Commitment:** The findings on the facts settle the matter; the conclusion is read off them.
  *   **Note on Q2 (Disjunction):** If you chose A here, you concede that the panel can be logically inconsistent (accepting 'A or B' while rejecting 'A' and 'B') to preserve the explicit vote on the composite premise.
  *   **Note on Q3 (Recusal):** If you chose A here, you hold that a majority is defined by eligible voters, not total membership.

  **Mostly B: Conclusion Sovereignty**
  *   **Commitment:** The vote on the final licence settles the matter; premises are merely reasons.
  *   **Note on Q2 (Disjunction):** If you chose B here, you concede that the explicit vote on the disjunction is overruled by the logic of its parts.
  *   **Note on Q3 (Recusal):** If you chose B here, you likely view the Conclusion vote as the only one that legally matters, rendering premise recusals advisory.

  **Mostly C: Profile Publication**
  *   **Commitment:** The panel has no single judgment beyond the distribution of its members' votes.
  *   **Statement:** We should decline to issue a single finding and publish the pattern of disagreement instead.

  **Mostly A on Q4 only: Agenda Control**
  *   **Commitment:** The order in which items are taken determines the result; we follow the Chair's sequence.
  *   **Statement:** A sequential or agenda-driven view where stopping rules bind the outcome.

  **Mostly B on Q6 only: Best-Fit Consistency**
  *   **Commitment:** We adopt the consistent set of findings that contradicts the fewest individual votes.
  *   **Statement:** Some version of picking the most representative consistent set of findings under a measure of distance from the profile.

  **Mostly B on Q5 only: Expert Weighting**
  *   **Commitment:** Members' votes carry different weights according to their expertise.
  *   **Statement:** A view on which members' votes carry different weights by expertise.

  **Mostly A on Q3 only: Recusal Sensitivity**
  *   **Commitment:** Majorities are computed over different denominators depending on eligibility.
  *   **Statement:** A view on which the quorum shifts per premise (requires no new leaf, but clarifies Premise Sovereignty).

