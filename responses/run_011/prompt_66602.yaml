  ## Procedural Indistinguishability

  Participants should note that this instrument cannot separate the following pairs of positions in all cases. If your answers suggest both, you may hold either view without contradiction on this agenda:

  1.  **Premise Sovereignty and Best-Fit Consistency:** On a simple conjunctive agenda (all three premises must pass), these two views often yield the same result. They only diverge when the majority premises are logically inconsistent (as in Question 2). If you answered 'A' on Q1 and 'B' on Q6, you have not necessarily contradicted yourself; you may simply prefer Premise Sovereignty unless it creates a logical paradox.
  2.  **Conclusion Sovereignty and Profile Publication:** In cases where the Conclusion vote is unanimous, these views produce the same public record. They only diverge when the Conclusion vote is split (as in Question 7). If you answered 'B' on Q1 and 'C' on Q7, you may hold that the Conclusion rules legally, but transparency requires publishing the split.

  ---

  ## Impossible Answer Profiles

  The following combinations of answers are permitted by the quiz structure but correspond to no defensible position. If you selected these, you should review your reasoning.

  **1. The "Magic Majority" Profile (Q1-A, Q3-B, Q9-C)**
  *   **Combination:** You believe Premises rule (Q1-A), but a recused member counts against the majority (Q3-B), and yet the panel has no coherent view when majorities shift (Q9-C).
  *   **Diagnosis:** **Incoherent.** You cannot claim the premises bind the outcome (Q1) if you simultaneously deny the validity of the premise majorities when composition changes (Q3) and deny the coherence of those majorities when they are formed by different coalitions (Q9). This profile accepts the authority of the premise vote while undermining the legitimacy of every way that vote could be formed.

  **2. The "Transparent Autocrat" Profile (Q7-C, Q1-B, Q4-A)**
  *   **Combination:** You want to publish the split votes (Q7-C), but you believe the Conclusion vote settles it absolutely (Q1-B), and you support stopping the debate early if a premise fails (Q4-A).
  *   **Diagnosis:** **Unattractive.** This position commits you to suppressing information (stopping the vote at Q4) while claiming to value transparency (Q7). If the split vote is what matters, stopping the tally early prevents the full pattern of disagreement from being known. This view is logically possible but pragmatically self-defeating for a panel seeking legitimacy.

  **3. The "Disjunctive Blindness" Profile (Q2-A, Q6-B)**
  *   **Combination:** You accept the Disjunction vote even if sub-parts fail (Q2-A), but you prioritise logical consistency of the minority over the numbers (Q6-B).
  *   **Diagnosis:** **Unthought.** Nobody defends this. Accepting the Disjunction vote (Q2-A) prioritises the explicit ballot over logical consistency. Prioritising the consistent minority (Q6-B) prioritises logic over the explicit ballot. Holding both implies you prefer logic over ballots unless the ballot is about a disjunction, a distinction for which no principled argument exists in the literature or practice.
