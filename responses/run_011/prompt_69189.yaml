      *   *Anderson:*
          *   Imagined: They feel obligation to the "future students" who will inherit this, or the "past versions" of themselves from 40 mins ago.
          *   Not Counterfeit: The feeling of belonging is real, even if the origin is known.

  8.  **Troubleshooting:**

      *   *Risk 1: Clowning.* Addressed by framing and time limits.
      *   *Risk 2: Immediate Consensus to Scrap.* If the ritual is annoying enough, they'll kill it instantly. *Counter:* Make the ritual pleasant or neutral. A moment of silence? A specific greeting?
      *   *Risk 3: The Reformer chickens out.* Instructor needs to prompt: "Does anyone have concerns about efficiency?"
      *   *Risk 4: They see through it.* First years usually don't. They get absorbed in the game.

  9.  **Limitations (What can't be simulated):**

      *   *Generational Time:* 40 mins isn't 100 years. The "sacredness" of deep time can't be faked.
      *   *Violence/Coercion:* Real traditions are often enforced by state power or social ostracization. Here, it's just a seminar.
      *   *Mythologized Origin:* They *know* they made it up. Real invented traditions hide their origin. This is the crucial gap the instructor must fill.

