      *   **Core Mechanism:** An experiential activity where students *invent* a ritual early on, then later have to decide whether to keep or scrap it.
      *   **Key Insight to Generate:** "Invented" $\neq$ "False/Bogus." Students must feel the *pull* of the tradition they just made. They need to defend it based on longevity/shared experience rather than utility.
      *   **Constraints:** 18 students, 100 minutes, printouts + whiteboard, no budget/props. No theory terms until debrief. Debrief must be dialogic, not lecturing.
      *   **Specific Requirements:**
