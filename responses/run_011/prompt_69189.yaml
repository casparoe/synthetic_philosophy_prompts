          *   *Best Idea (Prompt compliant):* "The Archive." If they keep the tradition, it gets written into the official course record (syllabus addendum) and must be performed every week for the rest of the term. If they scrap it, it dies today. The cost is the *burden of performance* for the rest of the semester. That's a real annoyance.
      *   **The Reformer:** Needs to be briefed separately or given a secret instruction. They need to argue for efficiency/utility against tradition.
      *   **The Two SU Students:** How to ping them? The fictional org should mirror the SU Dinner. "The Founding Feast." If the ritual is about a dinner, they might recognize the parallel. Let's make the fictional org "The Founders' Circle" and the ritual involves a specific toast or seating order.

