      1.  Invention (15 mins)
      2.  Performance 1 (5 mins)
      3.  "Weeks 2-4" Simulation (20 mins) - We do a task, but start with the ritual.
      4.  "Week 10" Crisis (10 mins) - Reformer proposes change.
      5.  Debate/Vote (30 mins)
      6.  Debrief (20 mins).
      *Wait, 15+5+20+10+30+20 = 100.* Perfect.

  4.  **Developing the Stake:**

      *   If they vote to *keep* the ritual: It becomes mandatory for every remaining seminar this term (5 mins of class time per week).
      *   If they vote to *scrap* it: It is abolished immediately.
      *   *Why this works:* 5 mins per week x 10 weeks = 50 mins of their life. They will feel the cost of keeping it, but they might keep it anyway because of "tradition." This proves Hobsbawm's point (ritual persists despite cost/inefficiency).

  5.  **The Reformer Role:**

      *   Pick one student beforehand? Or hand out secret roles at the start?
      *   *Better:* Hand out secret roles at the start. One student gets the "Efficiency Officer" card. They are instructed to wait until the "Crisis" phase to propose abolishing the ritual because it's inefficient.
      *   *Wait, the prompt asks:* "who gets to be the reformer and exactly how that person is briefed before they walk in."
      *   *Decision:* I will brief one student *before* class via email. This ensures they are committed. Let's pick one of the SU dinner committee students if possible, but the prompt says "don't build the whole thing around them." I'll brief a random student but make the briefing specific. Actually, briefing the SU student is a nice touch. I'll suggest targeting them if known, otherwise random.
      *   *Briefing:* "Your job is to maximize seminar learning time. At minute 60, propose abolishing the opening ritual because it wastes time. Do not reveal you were assigned this."

  6.  **The Invention Phase (Avoiding Clowning):**

      *   Risk: Students make it silly (e.g., "we all bark like dogs").
      *   Mitigation: Frame the organization seriously. "The Historical Methods Committee." Give them a serious task: "We need a way to signal we are ready to work."
      *   Constraint: Must be repeatable, must involve everyone, must take exactly 60 seconds.
      *   *The Hook:* Tell them this protocol will be recorded in the "Course Archives."

  7.  **The Debrief (Mapping Theory):**

      *   *Hobsbawm:*
          *   Invariance: Did the ritual change during the "Weeks 2-4" simulation? (It shouldn't have).
