      *   **The Stake:** What do they lose if they vote to change it? Time is the most valuable currency in a seminar. If they keep the ritual, they lose 5 minutes of free time at the end. If they scrap it, they get out early. *Wait, the prompt says "keeping the ritual costs the keepers something."* Okay, so if they vote to *keep* it, they pay a price. If they vote to *scrap* it, they save the price.
          *   *Idea:* The "Dues." If they keep the tradition, they have to write a collective reflection note (5 mins of class time next week or now). If they scrap it, no note.
