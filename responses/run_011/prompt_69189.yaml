      *   *60-70:* The Crisis. Reformer enters/speaks. Proposal to scrap.
      *   *70-85:* Debate.
      *   *85-95:* Vote & Consequence.
      *   *95-100:* Debrief (Theory reveal).

      *Correction:* 100 minutes is tight. If I spend 40 mins on "normal work," the "tradition" feels weak. If I spend too little, it feels like a game. The "passage of time" is the hard part. I can't wait an hour. I need to simulate the *weight* of the tradition quickly.
