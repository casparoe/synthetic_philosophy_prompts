answer: |-
  Here is a design for the 100-minute session. It is built to be tight, slightly uncomfortable, and theoretically precise.

  ### Phase Structure (100 Minutes)

  **00:00 – 00:15: The Commission (Invention)**
  *   **Frame:** Tell the class they are not students today, but the "Founding Committee" of a new professional body: *The Order of Historical Inquiry*.
  *   **Task:** They must design a **Opening Protocol** to be performed at the start of every future meeting of this Order.
  *   **Constraints:** It must involve all 18 members. It must take exactly 60 seconds. It must signal "we are now doing history."
  *   **Output:** Write the rules on the whiteboard. No changes allowed after minute 15.

  **00:15 – 00:20: Performance I**
  *   Execute the Protocol exactly as written. Time it. If it runs over or under, correct them sternly. "The Order requires precision."

  **00:20 – 00:50: The Work (Simulated Time)**
  *   Conduct normal seminar business (e.g., analyze a short primary source).
  *   **Crucial:** Do not mention the Protocol. Let it sit.

  **00:50 – 00:55: Performance II**
  *   Stop the work. "It is time to begin the next session of the Order."
  *   Execute the Protocol again. This creates the illusion of continuity/repetition without waiting an actual week.

  **00:55 – 01:15: The Crisis (Debate)**
  *   The **Reformer** (see below) stands and proposes abolishing the Protocol to reclaim the 5 minutes per week for "real work."
  *   Open floor debate. You (the instructor) sit out. Do not moderate. Only intervene if rules of order are breached.

  **01:15 – 01:25: The Vote (The Stake)**
  *   **The Stake:** Announce that if the vote passes to **KEEP** the Protocol, it is mandatory for every remaining seminar this term (costing ~5 mins of class time per week). If the vote passes to **SCRAP** it, it is abolished immediately and never spoken of again.
  *   Hold a secret ballot. Count publicly. Announce the consequence.

  **01:25 – 01:40: The Debrief (Theory Mapping)**
  *   Reveal the terms "Invented Tradition" and "Imagined Community."
  *   Dialogic mapping of their experience to the texts (script provided below).

  ---

  ### Roles and Rules

  **The Group:**
  *   They are the "Founding Committee."
  *   They must agree on the Protocol by consensus in the first 15 minutes. If they haven't agreed by minute 15, you (the Chair) impose one arbitrarily (this usually scares them into agreement).

  **The Reformer:**
  *   **Who:** Select one student via email 24 hours prior. Ideally, pick one of the two students on the Student Union dinner committee if you know them; if not, pick the most pragmatic/utilitarian student in the cohort.
  *   **The Briefing (Email Script):**
      > "Hi [Name]. For tomorrow's seminar, I need your help with an experiment. I am assigning you a specific role. At minute 55, I want you to stand up and propose that we abolish the ritual we created at the start of class. Your argument should be purely about efficiency: 'This takes time away from learning history.' Do not reveal to the class that I asked you to do this. Just play the role of someone who thinks the ritual is a waste of time. If the class gets hostile, stand your ground. Thanks."

  **The Instructor:**
  *   During the Invention phase: Be bureaucratic. Insist on precision.
  *   During the Debate: Be silent. Take notes on the whiteboard of arguments used (e.g., "It binds us," vs. "It's useless").
  *   During the Debrief: Facilitator only.

  ---

  ### The Stake

  The stake is **Future Class Time**.
  *   **Vote KEEP:** The Protocol is written into the syllabus addendum. It must be performed at the start of every class for the rest of the term. (Cost: ~45 minutes of their lives over 10 weeks).
  *   **Vote SCRAP:** The Protocol is dead. No time lost.

  This works because it makes "Tradition" expensive. If they keep it despite the cost, they prove Hobsbawm's point: tradition persists not because it is efficient, but because it provides cohesion.

  ---

  ### The Debrief (Script & Mapping)

  Do not lecture. Use the notes you took on the whiteboard during the debate.

  **1. Hobsbawm: Invariance and the Past**
  *   *Ask:* "Look at the arguments for keeping the Protocol. Did anyone say 'This is useful'? Or did you say 'This is *ours*'?"
  *   *Map:* Point to the "It's ours" arguments. "Hobsbawm calls this **invariance**. Notice how, in Performance II, you corrected each other if someone got the timing wrong. That is rule-governed formality."
  *   *Ask:* "Someone said, 'We've been doing this all hour.' That is 45 minutes. Why did it feel like 'always'?"
  *   *Map:* "Hobsbawm says invented traditions establish continuity with a suitable historic past. You *were* the past. You appealed to your own selves from 9:05 AM as if they were ancestors."
  *   *Distinction:* "How is this different from how we discussed the primary source earlier?" (Answer: The discussion adapted; the ritual stayed rigid). "Hobsbawm calls the discussion **custom** (adapts to function). He calls the Protocol **tradition** (resists function)."

  **2. Anderson: The Imagined Pull**
  *   *Ask:* "Who here felt annoyed when [Reformer] suggested cancelling it? Raise your hands." (Count them).
  *   *Ask:* "You *know* we made this up at 9:05 AM. You know it is arbitrary. So why is the annoyance real?"
  *   *Map:* "Anderson says communities are **imagined**, not **fake**. The feeling of obligation is real, even if the origin is known."
  *   *The SU Wrinkle:* Turn to the room generally. "Are there rituals on this campus that feel old but are actually new? The Student Union Dinner, for example?" (Pause, let the two students sit with that). "Does knowing the Dinner started 12 years ago make the pressure to attend less real? No. That is the power of the imagination."

  **3. The Collapse (Addressing the Core Problem)**
  *   *Ask:* "So, is the Protocol bogus?"
  *   *Goal:* Guide them to see that "Invented" describes the *origin*, not the *effect*.
  *   *Close:* "Hobsbawm and Anderson aren't saying nations are lies. They are saying nations are *built*. And once built, they demand sacrifice. Today, you were willing to sacrifice 45 minutes of class time for a thing you invented 45 minutes ago. Imagine what you'll sacrifice for a thing you're told is 100 years old."

  ---

  ### Troubleshooting: What Goes Wrong

  **1. The Clowning Risk (Invention Phase)**
  *   *Risk:* Students propose barking like dogs or high-fiving.
  *   *Fix:* Frame the "Order of Historical Inquiry" as a serious professional body. If they propose something silly, veto it on grounds of "dignity." "Would a professional historian bark? Propose something that signals gravity."
  *   *Real Risk:* The real risk is **Apathy**. They might make the ritual so bland (e.g., "we sit quietly") that it holds no value.
  *   *Mitigation:* Push for *specificity*. "How do we sit? In a circle? Facing the board? Eyes open or closed?" The more specific the ritual, the more there is to defend later.

  **2. The Reformer Chickens Out**
  *   *Risk:* The student feels social pressure and doesn't raise the objection.
  *   *Fix:* Have a backup. At minute 55, look at your watch and say aloud, "I'm noting we've lost 2 minutes to the Protocol. Is this sustainable?" This usually emboldens the Reformer to jump in.

  **3. Unanimous Vote to Scrap**
  *   *Risk:* They vote to kill it immediately.
  *   *Analysis:* This happens if the ritual was annoying to perform.
  *   *Fix:* In the debrief, lean into it. "You killed it because it had no **mythos** yet. Real traditions survive because they survive the founding generation. You were both the founders and the heirs. You killed the ancestor. That's actually a very modern problem."

  ---

  ### Structural Limitations (What You Must Supply)

  Be straight with yourself: A 100-minute seminar cannot simulate **Generational Forgetting**.

  *   **The Gap:** In real invented traditions (Hobsbawm's examples), the *current* practitioners do not know it was invented. They believe it is ancient. In your seminar, the students *know* they made it up 45 minutes ago.
  *   **The Consequence:** They will not feel the "sacredness" of deep time. They will feel the "solidarity" of shared experience, but not the "weight" of history.
  *   **Your Job:** In the debrief, you must explicitly bridge this. "Today you knew the origin. In the real world, the origin is lost. The mechanism is the same (building cohesion), but the opacity makes it harder to challenge. You challenged it easily because you remembered. Citizens often cannot challenge national myths because they don't remember the invention."

  **The SU Dinner Connection:**
  The two students on the committee know the Dinner is only 12 years old. They are living the "known invention." Use them as the bridge between the seminar game and the real world. If they defend the Dinner in the discussion, highlight that: "You are defending a 12-year-old tradition against the 'efficiency' argument. Why? Because it now does a job (cohesion) that outweighs the cost."
