answer: |-
  ### Part 1: Assessment of Your Hunches

  **Hunch 1: The One-Minute Entailment Rule**
  *Verdict: Keep the "One-Minute" heuristic, Kill the "Same Date" constraint.*

  *   **Why keep "One-Minute":** This operationalizes the "Old Evidence" and "Logical Omniscience" objections. If your ops team (smart non-experts) cannot see the contradiction immediately, it is not "common knowledge" entailment. Penalizing deep logical discovery punishes forecasters for not being logic solvers. It creates a clear boundary: we only enforce *obvious* coherence.
  *   **Why kill "Same Date":** Your nomination/presidency example proves this is too restrictive. Many Dutch books arise from temporal chains (A must happen before B). The constraint should be **Resolution Dependency**, not simultaneity. If Question B cannot physically resolve to "Yes" unless Question A resolved to "Yes" previously, they are linked, regardless of the date gap.

  **Hunch 2: Directionality of Violation**
  *Verdict: Sharpen. This is the single most important filter for your procedure.*

  *   **Stronger > Weaker (e.g., $P(A \& B) > P(A)$):** This is a **Hard Violation**. It is logically impossible in any partition of possibility space. It indicates a misunderstanding of the questions or a data entry error. This is the only category worth intervening on.
  *   **Weaker > Stronger / Subadditivity (e.g., $\sum P(A_i) > P(\cup A_i)$):** This is a **Soft Violation**. This is the "Unpacking Effect" (Tversky/Koehler). It is a robust cognitive bias, not a logical error. Forecasters assign higher probability to specific scenarios than the general category because specific scenarios are more vivid. Penalizing this punishes human cognition. **Do not flag these for correction.**

  ---

  ### Part 2: The Coherence Triage Procedure

  **Prerequisites (Must be done at Question Creation):**
  To fit this into a 2-hour cycle window, you cannot search for links during the cycle. When questions are drafted, the question-writer must tag "Entailment Pairs" in your spreadsheet (e.g., `Q101` is a necessary condition for `Q102`). If this metadata doesn't exist, the procedure cannot run.

  **Workflow:**
  *   **Actors:** Ops Agent A (Logic Check), Ops Agent B (Comms/Decision).
  *   **Time:** 2 Hours per cycle.
  *   **Default State:** **Score As-Is.** (Any deviation requires Board sign-off, so the procedure is designed to minimize deviations).

  #### Step 1: The Automated Flag (Spreadsheet)
  *   **Action:** Run a script on all tagged Entailment Pairs.
  *   **Logic:**
      *   If $P(\text{Conjunction}) > P(\text{Conjunct})$: **FLAG HARD.**
      *   If $P(\text{Necessary Condition}) < P(\text{Dependent Event})$: **FLAG HARD.**
      *   If $\sum P(\text{Partition}) > 1.0$: **FLAG SOFT.**
      *   If $P(\text{General}) < \sum P(\text{Specifics})$: **FLAG SOFT.**
  *   **Termination:** All `FLAG SOFT` items are **Closed**. No action taken. (This absorbs the unpacking bias).
  *   **Judgment Call:** None. This is pure math.

  #### Step 2: The One-Minute Semantic Check (Agent A)
  *   **Action:** Review `FLAG HARD` items.
  *   **Question:** "Ignoring the numbers, does the text of Question A *obviously* entail Question B to a smart layperson in under 60 seconds?"
  *   **Sufficient Answer:** "Yes, it's explicit in the wording" OR "No, the wording allows for edge cases."
  *   **Termination:** If **No**, close the ticket. **Score As-Is.** (This absorbs Stalnaker's partitioning point: if the wording allows different interpretations, the incoherence is in the platform's design, not the forecaster's mind).
  *   **Judgment Call:** **High.** Agent A decides what counts as "obvious." If they hesitate for more than a minute, the answer is "No."

  #### Step 3: The Temporal/Contingency Check (Agent A)
  *   **Action:** For remaining flags, check resolution conditions.
  *   **Question:** "Is it physically possible for the Dependent Event to resolve 'Yes' if the Necessary Condition resolves 'No'?" (Consider dropouts, rule changes, force majeure).
  *   **Sufficient Answer:** "No, it's impossible" OR "Yes, there is a contingency path."
  *   **Termination:** If **Yes** (contingency exists), close the ticket. **Score As-Is.**
  *   **Judgment Call:** **Medium.** Requires checking resolution sources, not just logic.

  #### Step 4: Status & Incentive Check (Agent B)
  *   **Action:** Check if questions are Open or Closed/Resolved.
  *   **Question:** "Can the forecaster still edit this forecast?"
  *   **Branch A (Questions Open):** Proceed to Step 5.
  *   **Branch B (Questions Closed/Resolved):** **Terminate.** **Score As-Is.**
      *   *Rationale:* Changing a payout post-resolution requires Board sign-off. The cost of the Board meeting exceeds the cost of the incoherent payout. This protects forecaster goodwill (no retroactive punishment).
  *   **Judgment Call:** **None.** Hard rule to protect ops bandwidth.

  #### Step 5: The Nudge (Agent B)
  *   **Action:** Contact the forecaster.
  *   **Script:** "We noticed your forecast on [Q1] implies a probability higher than [Q2], which is a necessary condition for Q1. Our system flagged this as a potential data entry error. You can edit until [Date]. If this reflects a specific contingency you see that we don't, no need to reply."
  *   **Sufficient Answer:** Forecaster edits the number OR Forecaster ignores it.
  *   **Termination:**
      *   If they edit: Update spreadsheet. (Standard user edit, no Board sign-off needed).
      *   If they ignore: **Score As-Is.**
  *   **Judgment Call:** **Low.** Agent B must ensure the tone is helpful, not accusatory.
  *   **Incentive Safeguard:** By framing it as a "data entry error" check and allowing them to ignore it if they have a "contingency" view, you allow them to save face if they were just sloppy, or keep their position if they know something you don't, without triggering a formal dispute.

  ---

  ### Part 3: Running the Test Cases

  **Case (a): Nomination (0.05) vs. Presidency (0.30)**
  *   **Step 1:** Flagged HARD ($P(\text{Pres}) > P(\text{Nom})$).
  *   **Step 2:** Semantic Check. Does "President" entail "Nominee"? Usually yes.
  *   **Step 3:** Temporal/Contingency Check. Forecaster claims "dropping out/contested convention."
      *   *Analysis:* Is it *physically impossible* to be President without being the Nominee? In most electoral systems, yes. However, is it possible the forecaster interprets "Nominee" as "Official Party Nominee on Ballot" vs. "De Facto Leader"?
      *   *Procedure Ruling:* If the resolution criteria for "Nominee" are strict (e.g., "Certified by Party Committee"), then the entailment holds. However, because there is a 6-month gap, the **Contingency Check** is the killer. If there is *any* historical precedent for a non-nominee winning (e.g., replacement after death, third-party write-in technically not the "nominee"), the answer to Step 3 is "Yes, contingency exists."
      *   *Decision:* **Close Ticket. Score As-Is.**
      *   *Reasoning:* The 6-month gap introduces enough world-state volatility that it fails the "One-Minute/Obvious" test for *ops staff*. It requires political expertise to adjudicate. Default to forecaster's interpretation.

  **Case (b): Partnership Unpacking (0.6 General vs. 1.35 Sum of Specifics)**
  *   **Step 1:** Flagged.
      *   *Analysis:* If the specific partners are mutually exclusive (can only partner with one), $\sum P > 1$ is a Hard Violation. If they are non-exclusive (can partner with multiple), it is not.
      *   *Assumption:* Prompt implies "three named partners are the only ones," suggesting a partition. So $\sum P > 1$ is a Hard Violation.
  *   **Step 2:** Semantic Check. Is it obvious these are mutually exclusive? Yes.
  *   **Step 3:** Temporal Check. N/A.
  *   **Step 4:** Status Check. Assume Open.
  *   **Step 5:** The Nudge.
      *   *Wait:* Re-evaluate Hunch 2. Is $\sum P > 1$ a "Stronger > Weaker" violation? Yes, logically. But empirically, this is the **Unpacking Effect**.
      *   *Procedure Adjustment:* In Step 1, classify $\sum P > 1$ as **FLAG SOFT** unless it exceeds a threshold (e.g., 1.5).
      *   *Decision:* **Reclassify as SOFT. Close Ticket. Score As-Is.**
      *   *Reasoning:* Penalizing subadditivity punishes the most common human heuristic for probability. Unless the sum is absurd (e.g., 3.0), treat it as cognitive noise, not incoherence.

  **Case (c): Top Forecaster (Gross Incoherence on Conflict)**
  *   **Step 1:** Flagged HARD (Multiple violations).
  *   **Step 2:** Semantic Check. Are the links obvious? (e.g., "Ceasefire" vs. "Troop Withdrawal"). If yes, proceed.
  *   **Step 3:** Contingency. Conflict zones are messy. Entailments often break due to fog of war.
  *   **Step 4:** Status Check. Assume Open.
  *   **Step 5:** The Nudge.
      *   *Analysis:* This is your whale. Aggressive policing risks churn.
      *   *Decision:* **Send the Nudge, but soften the language.** "We noticed some inconsistencies... just wanted to ensure you didn't fat-finger a decimal."
      *   *Outcome:* If they edit, great. If they don't, **Score As-Is.**
      *   *Reasoning:* If a top decile forecaster holds incoherent views on a complex conflict, it is more likely your questions are ambiguously partitioned (Stalnaker) than that they are irrational. They may see a causal link you don't. Do not risk the relationship over a logic puzzle. **Pay them.**

  ---

  ### Part 4: Limitations & Costs

  **What This Procedure Will Never Catch**
  1.  **Distributed Incoherence:** If a forecaster is incoherent across *three* questions (A > B, B > C, but A < C), your pairwise spreadsheet check won't catch the cycle unless you specifically tag the triplet.
  2.  **Implicit Entailments:** If Question A entails Question B based on real-world knowledge not present in the text (e.g., "Snow in NYC" entails "Temp < 32F"), but the text doesn't say it, Step 2 will filter it out. This is a feature, not a bug, given your constraints.
  3.  **Dynamic Incoherence:** A forecaster can update Q1 today and Q2 tomorrow, creating a temporary Dutch book that resolves itself. You only catch snapshots.

  **False Positives**
  1.  **Ambiguous Wording:** You will flag cases where the forecaster's interpretation was valid but differed from the ops team's "common sense." (Mitigated by Step 2 "One-Minute" rule).
  2.  **Legitimate Contingencies:** As in Case (a), you will flag valid "black swan" hedges as errors. (Mitigated by Step 3).

  **The Goodwill Cost**
  *   **The "Nanny" Effect:** Even a polite nudge signals that you are watching their logic, not just their calibration. Some forecasters view their credences as private mental states; policing the *relationship* between them feels intrusive.
  *   **Mitigation:** Be transparent. Publish the "Coherence Guidelines" alongside the question rules. Frame it as "Helping us keep the market efficient" rather than "Correcting your errors."
  *   **The Board Bottleneck:** By making "Score As-Is" the default for resolved questions, you accept that some money will be paid on incoherent bets. This is the cost of doing business without a legal team on retainer. Frame this to the Board as "Insurance against operational paralysis."

  **Final Operational Note:**
  Your biggest risk is not the incoherence; it's the **Question Design**. If your questions are not written with mutually exclusive, collectively exhaustive (MECE) partitions in mind, no procedure can fix the incoherence downstream. Invest your 2 hours in training question-writers to tag entailments at creation, not in hunting down forecasters at resolution.
