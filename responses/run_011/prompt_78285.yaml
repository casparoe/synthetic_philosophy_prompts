          2.  Identify criteria of death invoked (Organism as a whole, Anatomical structure, Personhood/Consciousness) and track slides between them.
          3.  Assess epistemic claims about bedside tests vs. legal criteria and the "integrator" premise.
          4.  Assess the circulatory-death paragraph (modal notions, intention-relativity, autoresuscitation, timing).
          5.  Verdict on the conclusion ("recognition of fact" vs. "decision", "morally unproblematic").
          6.  Steelman the author (are simplifications entitled?).
          7.  **Register:** Distinguish between Metaphysical (what the organism is), Epistemic (what tests show), and Pragmatic/Normative (law/policy). Mark switches.
          8.  **Constraint:** No bibliography/reading lists. Reason through it.

  2.  **Deconstruct the Passage (Mental Outline):**
      *   *Claim 1:* Brain death is not a metaphor/legal convenience; it is the death of the person.
      *   *Claim 2:* Brain holds body together as single living organism (integrative function).
      *   *Claim 3:* Other organs substitutable, brain is not.
      *   *Claim 4:* Brainstem destruction = integrative work stopped.
      *   *Claim 5:* Body on ventilator is like fire with bellows (machine keeping it going).
      *   *Claim 6:* Legal criterion = irreversible loss of *all* function of *entire* brain.
      *   *Claim 7:* Bedside tests establish precisely that (reflexes, pain, apnoea).
      *   *Claim 8:* Diagnosis = recognition patient already died (not decision to stop treating).
      *   *Claim 9:* Machine turned off because nobody left to treat.
      *   *Claim 10:* Donation after brain death morally unproblematic (Dead Donor Rule satisfied).
      *   *Claim 11:* Circulatory death = simpler case, brain dies within minutes, same rule satisfied.

  3.  **Drafting the Audit (Section by Section):**

      *   **Section 1: Claim-by-Claim Audit.**
          *   Need to categorize each.
          *   *Claim 1 ("Death of the person"):* Wince. Conflates biological death with personhood.
          *   *Claim 2 ("Integrative work"):* Defensible shorthand/Consensus view (President's Council 2008), but contested by biologists who point to homeostasis without brain.
          *   *Claim 3 ("Other organs substitutable"):* Shorthand. Kidneys yes, heart/lungs temporarily yes, but "integrative" is the key word.
          *   *Claim 4 ("Brainstem destroyed"):* Acceptable clinically, but "entire brain" is the legal standard in many places (US), while UK uses brainstem. Need to note the jurisdiction slide.
          *   *Claim 5 ("Fire/Bellows"):* Metaphor. Defensible shorthand for lay audience, but biologically imprecise (hormonal regulation persists).
          *   *Claim 6 ("Irreversible loss entire brain"):* Legally accurate (US UDDA), clinically debated (some function may persist).
          *   *Claim 7 ("Tests establish precisely"):* Epistemic overreach. Tests are proxies for *clinical* death, not cellular death.
          *   *Claim 8 ("Recognition not decision"):* Normative claim masquerading as descriptive. Highly contested.
          *   *Claim 9 ("Nobody left to treat"):* Ethical conclusion, not medical fact.
          *   *Claim 10 ("Morally unproblematic"):* Normative. Contested by those who reject whole-brain death.
          *   *Claim 11 ("Circulatory... simpler"):* Wrong/Contested. Modal distinction (will not vs. cannot) is the crux.

      *   **Section 2: Criteria of Death (The Slides).**
          *   *Organism as a Whole:* The "integrator" argument.
          *   *Anatomical:* "Entire brain/brainstem."
          *   *Personhood:* "Death of the person."
          *   *The Slide:* Starts with Personhood (Claim 1), moves to Organism (Claim 2-5), anchors in Anatomy/Law (Claim 6-7), returns to Personhood/Morality (Claim 8-10).
          *   *PVS Issue:* Crucial point. If "death of person" (consciousness), PVS is dead. If "organism integrator," PVS is alive. The passage implicitly rules out PVS as death by focusing on brainstem/integration, but the opening sentence invites the confusion.

      *   **Section 3: Epistemic Claims (Tests vs. Criteria).**
          *   Tests check *clinical* function (reflexes, breathing drive). They do not check cellular viability or *all* brain function (e.g., hypothalamic function often remains).
          *   "Precisely" is the wrong word. "Probabilistically high confidence" is better.
          *   *Integration Premise:* Is the brain the *sole* integrator? Contested. Homeostasis (temp, osmolarity, wound healing) persists in BD. Proponents say this is "machine-supported" or "cellular" not "organismic." Critics say this proves the organism is alive.
          *   *Register Switch:* Moves from Metaphysical (what is integration?) to Epistemic (what do tests show?) without bridging.

      *   **Section 4: Circulatory Death (DCD).**
          *   *Modal Distinction:* This is the "Permanence vs. Irreversibility" debate.
          *   *Irreversible:* Cannot restart (even with CPR).
          *   *Permanent:* Will not restart (no attempt made).
          *   *The Argument:* The user's intuition is correct. DCD relies on *permanence* (won't restart), which is intention-relative (we won't try). BD relies on *irreversibility* (can't restart).
          *   *Autoresuscitation:* The "Lazarus phenomenon." 5-minute wait is standard to rule this out. Is it enough for *brain* death? No. Brain death takes longer than 5 mins of no-flow. DCD protocols acknowledge the brain isn't dead *at declaration*, but will die *during* procurement. This violates the strict "Dead Donor Rule" if interpreted strictly as "dead before cut."
          *   *Verdict:* The passage is wrong to say "the same rule is satisfied." It's satisfied by a *different* interpretation of the rule (permanence vs. irreversibility).

      *   **Section 5: Verdict on Conclusion.**
          *   "Recognition of fact": Fails. It's a normative classification of a biological state. The biology is ambiguous (body is biologically active); the *status* is assigned.
          *   "Morally unproblematic": Fails. It's only unproblematic *if* you accept the definition. If you reject whole-brain death, it's homicide.
          *   *Normative vs. Descriptive:* The passage's error is treating a normative determination (we *count* this as death) as a purely descriptive one (this *is* death independent of our counting).

      *   **Section 6: Steelman.**
          *   Is the simplification entitled? Yes, for a general audience.
          *   Mainstream view? Yes, the "integrator" view is the official US government stance (PCBE 2008).
          *   Conflation? Some is necessary for brevity. The "death of the person" line is the weakest link, but often used to distinguish from PVS.
          *   *Register Split:* Is it useful? Yes. It explains why people talk past each other. Biologists talk organism, Ethicists talk personhood, Lawyers talk policy.

  4.  **Refining the Tone:**
      *   Must be analytical, not dismissive.
      *   Acknowledge the user's sophistication.
      *   Ensure the Metaphysical/Epistemic/Pragmatic distinction is woven throughout, not just tacked on.
      *   Avoid naming specific philosophers (e.g., Pallis, Bernat, Miller) but describe their *positions*.

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the PVS point in Section 2? Yes, crucial distinction between whole-brain and higher-brain.
