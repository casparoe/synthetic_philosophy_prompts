  ### The Case: The Prudent Regulator

  **Setup**
  Consider a financial regulator, the Office of Market Stability (OMS), tasked with deciding whether to permit a novel derivative product. The OMS's doxastic state regarding the product's safety ($H$) is represented by a credal set containing two probability functions, $P_1$ and $P_2$, reflecting divergent internal models. The OMS must choose between Permitting ($a_1$) or Banning ($a_2$) the product, with payoffs linear in £millions of social welfare. A free, non-invasive audit ($E$) is available from an external contractor; this audit is payoff-irrelevant for a precise agent with the average prior of the OMS, yet due to the divergence between $P_1$ and $P_2$, receiving the audit result dilates the OMS's credence in $H$. The OMS employs a Maximin decision rule over its credal set to ensure robustness against model uncertainty.

  **Working**

  **1. The Credal Set and Priors**
  The hypothesis $H$ is "The product is safe". $\neg H$ is "The product is unsafe".
  The credal set $\mathcal{P} = \{P_1, P_2\}$.
  *   $P_1(H) = 0.4$
  *   $P_2(H) = 0.6$
  *   Prior Credal Interval for $H$: $[0.4, 0.6]$.
  *   Lower Probability $\underline{P}(H) = 0.4$.

  **2. The Acts and Payoffs**
  Utility is linear in £m.
  *   **Act $a_1$ (Permit):** +£100 if $H$, -£100 if $\neg H$.
  *   **Act $a_2$ (Ban):** -£10 if $H$, +£10 if $\neg H$. (A costly hedge; banning safe products loses opportunity, banning unsafe ones saves minor costs).

  *Ex-Ante Expected Utility (EU) Calculation:*
  *   For $P_1$: $EU(a_1) = 0.4(100) + 0.6(-100) = -20$. $EU(a_2) = 0.4(-10) + 0.6(10) = 2$.
  *   For $P_2$: $EU(a_1) = 0.6(100) + 0.4(-100) = 20$. $EU(a_2) = 0.6(-10) + 0.4(10) = -2$.
  *   **Maximin Value (Prior):**
      *   $V(a_1) = \min(-20, 20) = -20$.
      *   $V(a_2) = \min(2, -2) = -2$.
      *   **Optimal Act:** $a_2$ (Ban). **Value of Ignorance:** $-2$.

  **3. The Observation and Likelihoods**
  The audit result $E$ (Pass) or $\neg E$ (Fail).
  To induce dilation whilst remaining "uncorrelated" for the average prior ($P_{avg} = 0.5$), we set likelihoods that are symmetric across the set:
  *   $P_1(E|H) = 0.9$, $P_1(E|\neg H) = 0.1$. ($P_1$ trusts the audit).
  *   $P_2(E|H) = 0.1$, $P_2(E|\neg H) = 0.9$. ($P_2$ distrusts the audit/inverts it).
  *   Note: For $P_{avg}$, $P(E|H) = 0.5$ and $P(E|\neg H) = 0.5$. A precise Bayesian with $P_{avg}$ finds $E$ irrelevant and is indifferent to observing it.

  **4. The Posteriors (Dilation)**
  Using Bayes' theorem for each function in $\mathcal{P}$:
  *   **Given $E$:**
      *   $P_1(H|E) = \frac{0.9 \times 0.4}{0.9 \times 0.4 + 0.1 \times 0.6} = \frac{0.36}{0.42} \approx 0.86$.
      *   $P_2(H|E) = \frac{0.1 \times 0.6}{0.1 \times 0.6 + 0.9 \times 0.4} = \frac{0.06}{0.42} \approx 0.14$.
      *   **Posterior Interval:** $[0.14, 0.86]$.
  *   **Given $\neg E$:**
      *   By symmetry, the interval is also $[0.14, 0.86]$.
  *   **Dilation Check:** The prior interval $[0.4, 0.6]$ is properly contained within the posterior interval $[0.14, 0.86]$. Credence has dilated regardless of the outcome.

  **5. Decision Values After Observation**
  *   **Given $E$ (or $\neg E$):**
      *   $V(a_1 | E) = \min( EU_{P_1}(a_1|E), EU_{P_2}(a_1|E) )$.
      *   $EU_{P_1}(a_1|E) \approx 0.86(100) + 0.14(-100) = 72$.
      *   $EU_{P_2}(a_1|E) \approx 0.14(100) + 0.86(-100) = -72$.
      *   $V(a_1 | E) = -72$.
      *   $V(a_2 | E)$: Similarly calculated, the minimum will be driven by the $P$ that assigns high probability to the bad outcome for $a_2$.
      *   $EU_{P_1}(a_2|E) \approx 0.86(-10) + 0.14(10) = -7.2$.
      *   $EU_{P_2}(a_2|E) \approx 0.14(-10) + 0.86(10) = 7.2$.
      *   $V(a_2 | E) = -7.2$.
      *   **Optimal Act Ex-Post:** $a_2$ (Ban). **Value of Learning:** $-7.2$.

  **6. Preference Reversal Analysis**
  *   **Ex-Ante (Time 1):** The agent evaluates the strategy "Observe". Since dilation occurs for both $E$ and $\neg E$, the minimum value of the optimal act after observing is $-7.2$.
      *   $V(\text{Ignore}) = -2$.
      *   $V(\text{Observe}) = -7.2$.
      *   **Preference:** Strictly prefers Ignorance ($-2 > -7.2$).
  *   **Ex-Post (Time 2):** Having observed $E$, the agent is in a state with value $-7.2$. The counterfactual "Ignorance" retains value $-2$.
      *   **Preference:** Strictly prefers Ignorance ($-2 > -7.2$).
      *   *(Note: As derived, strict dilation under Maximin necessitates Ex-Post Regret, not Gladness. To achieve Ex-Post Gladness, the observation would need to contract credence in the actual world, violating the "all it does is dilate" constraint. The philosophical force of the case lies in the Ex-Ante rejection of free information.)*

  **Analysis**

  **Feature Doing the Work**
  The driving feature is the **failure of the Likelihood Ratio Condition** required for dilation avoidance. Specifically, the likelihood ratios $P(E|H)/P(E|\neg H)$ vary across the credal set such that they span 1 (one model sees $E$ as strong evidence for $H$, the other as strong evidence against). For a precise Bayesian, learning partitions the state space and never reduces expected utility. For the Maximin agent, learning partitions the *credal set* in a way that widens the range of expected utilities for every act. Because the decision rule focuses on the *minimum* expected utility, and dilation lowers the lower bound of probability for the favourable state, the guaranteed minimum payoff drops. The agent rejects free information because it exacerbates the worst-case scenario she is trying to guard against.

  **Robustness to Other Rules**
  *   **Maximality:** If the agent uses Maximality (rejecting an act only if another is strictly better in *all* priors), the reversal may not hold. In the example above, $a_2$ is optimal in both priors Ex-post, so Maximality agrees with Maximin. However, in cases where acts cross (one better in $P_1$, one in $P_2$), Maximality often permits keeping options open, potentially valuing information higher than Maximin does.
  *   **Hybrid Rules (Core Prior):** If she mixes Maximin with a distinguished 'core' prior (e.g., $P_{avg}$), the value of information would likely be non-negative. The core prior would treat $E$ as irrelevant (value 0 change), while the Maximin component drags the value down. If the weight on the core prior is sufficient, the net value of information could remain neutral or positive, dissolving the preference for ignorance.

  **Defending Imprecise Credences**
  A defender of imprecise credences would argue that this is not a reductio but a **planning failure** inherent to time-inconsistent rules like Maximin, rather than a flaw in representing ignorance via sets.
  1.  **Rationality of Ignorance:** In high-stakes regulatory contexts, "ignorance is bliss" can be rational if information is ambiguous. If the audit is known to be unreliable (modelled by the divergence between $P_1$ and $P_2$), relying on it introduces volatility into the worst-case assessment. Refusing ambiguous information to maintain a stable, albeit conservative, baseline is a coherent risk-avoidance strategy.
  2.  **Rule Revision:** The case indicts *Maximin*, not Imprecise Probabilities. Defenders often suggest **$\Gamma$-Maximin** or dynamic updating rules that condition on the *strategy* rather than the myopic Ex-post state. If the agent commits Ex-ante to a policy (e.g., "I will Ban regardless of $E$"), the value of information is zero, and the preference for ignorance vanishes. The reversal arises because the agent re-evaluates Ex-post using the same static rule rather than adhering to a dynamic plan. Thus, the "can't learn for free" result highlights the need for sophisticated choice rules over time, not the irrationality of imprecise belief.
