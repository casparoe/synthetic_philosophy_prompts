answer: |-
  **Dissertation Prospectus: The Regress of Audit**

  **1. The Research Question**
  The rapid integration of large language models into philosophical methodology presents a specific epistemic hazard: the decoupling of *endorsement* from *comprehension*. When a researcher accepts a synthesis, proof, or counterexample generated by a model they cannot fully reconstruct, have they lost understanding, or merely relocated it? The standard debate frames this as a conflict between distributed cognition and individual cognitive achievement. This dissertation rejects that dichotomy. Both sides assume the primary epistemic good is the possession of true belief or the grasping of dependence relations. They neglect the dynamic capacity to test those relations under variation.

  The central question of this project is: **Does the preservation of epistemic agency in AI-assisted inquiry require the retention of *counterfactual regenerative capacity*?**

  I will argue for a determinate answer: Epistemic agency is retained if and only if the agent retains the capacity to audit the output via independent regeneration of supporting reasons, and that this regress of auditing terminates at the level of shared linguistic competence rather than specialized domain knowledge. Outsourcing is benign only so long as the cost of auditing is lower than the cost of generation; when the audit itself must be outsourced, the agent transitions from a knower to a mere conduit.

  **2. The Limits of Existing Positions**
  Current literature offers two dominant frameworks, neither of which captures the specific risk posed by generative models.

  The first position, rooted in social epistemology and extended mind theories, treats the model as a novel testifier or cognitive tool. On this view, understanding is distributed. Just as a physicist relies on the testimony of instrument readouts they do not fully derive, the philosopher may rely on the model. The objection here is that testimony presupposes a sender who understands. A probabilistic model has no understanding to transmit. Furthermore, this view underestimates the opacity of the tool. Traditional tools (calculators, telescopes) have stable, known error conditions. Generative models have unstable error conditions that mimic competence. Relying on them as "testifiers" ignores the impossibility of calibrating trust without independent verification.

  The second position, grounded in virtue epistemology and internalist accounts of understanding, holds that understanding why *p* requires a cognitive achievement that no testimony can deliver. One must grasp the dependence relations between *p* and *q*. On this view, outsourcing the derivation of an argument necessarily destroys understanding. The limitation of this view is its rigidity. It implies that any use of external aid for complex synthesis constitutes a loss of agency. This renders modern research impossible, as no single agent can reconstruct the entire lineage of a complex argument. It fails to distinguish between outsourcing the *labor* of retrieval and outsourcing the *judgment* of validity.

  Both positions leave the critical variable open: the mechanism of verification. They assume the content is static. They fail to account for the third capacity: the ability to regenerate a result when the question is varied. If I cannot tweak the premises to see if the conclusion holds, I do not understand the argument, regardless of whether I memorized the steps or offloaded them. The existing debate ignores the *cost* of checking. My project sharpens the question by focusing on *auditability*: the capacity to check what comes back. The regress terminates where the agent can no longer check the checker without external aid. Identifying that termination point is the core philosophical task.

  **3. Methodology and Chapter Outline**
  This project employs conceptual analysis and normative modeling rather than empirical measurement. The goal is not to describe how philosophers *do* use tools, but to prescribe the conditions under which they are *justified* in doing so. An empirical approach measuring retention among heavy users would fail because retention is not justification. A user might retain a conclusion by rote memory without understanding its support, or they might forget a derivation but retain the ability to reconstruct it. The normative status of the agent depends on capacity, not performance history.

  **Chapter 1: The Architecture of Epistemic Dependence**
  This chapter establishes the taxonomy of outsourcing. I will distinguish between *retrieval* (finding existing arguments), *synthesis* (combining premises), and *validation* (checking logical flow). I will argue that current models conflate these, presenting synthesis as validation. I will define *epistemic agency* not as the origination of ideas, but as the final authority on their validity. This sets the stage for the regress problem: if the model validates the synthesis, who validates the model?

  **Chapter 2: The Regress of Audit**
  Here I develop the core theoretical framework. I will analyze the conditions under which an audit counts as independent. If I ask a model to check its own work, the regress is circular. If I ask a second model, the regress is lateral. If I check it myself, I incur a cognitive cost. I will argue that agency is maintained only when the agent performs the terminal audit. I will introduce the distinction between *opaque verification* (checking that a result matches a pattern) and *transparent verification* (checking why the result follows).

  **Chapter 3: Regenerative Capacity**
  This chapter defines the "third capacity" mentioned in the introduction. Understanding is not merely recognizing a valid argument; it is the ability to generate counterfactual variations. If I outsource the hunt for counterexamples, I lose the map of the argument's modal space. I will argue that regenerative capacity is the operational metric of understanding. If an agent cannot vary the parameters of a claim to test its robustness without AI assistance, they have lost epistemic agency over that claim. This moves the debate from "grasping relations" to "manipulating relations."

  **Chapter 4: The Termination Point**
  Where does the regress stop? I will argue it terminates at *shared linguistic competence*. An agent can audit a logical step if they understand the meanings of the terms involved, even if they cannot generate the proof from scratch. However, in highly technical domains (e.g., formal logic or specialized metaphysics), linguistic competence may be insufficient. I will examine case studies where the audit requires domain knowledge the agent no longer possesses. This chapter delineates the boundary between tool use and epistemic parasitism.

  **Chapter 5: Normative Implications for Research**
  The final chapter applies the framework to the dissertation process itself. I will propose a norm of *disclosed auditability*. If a claim relies on outsourced validation, the method of audit must be disclosed. I will argue that the philosophical community faces a collective action problem: if everyone outsources auditing, the community loses the capacity to validate knowledge collectively. The dissertation will conclude with a proposal for "human-in-the-loop" requirements for philosophical publication.

  **4. Conditions for Success and Failure**
  A successful result will yield a clear criterion for distinguishing *epistemic tool use* from *epistemic outsourcing*. Specifically, success looks like a defensible threshold for *regenerative auditability*. If I can demonstrate that there is a specific level of variation (e.g., changing one premise) that an agent must be able to process independently to claim understanding, the project succeeds. It provides a actionable norm for researchers: "You may outsource X, provided you can independently audit Y."

  Failure would take two forms. First, if *auditability* proves to be as vague as *understanding*. If I cannot define what counts as a sufficient audit without circularity, the framework collapses. Second, if the termination point is set so high that it demands impossible cognitive loads. If the argument implies that to use a model one must be able to reconstruct the model's training data or weights, the norm is useless. The project fails if it concludes that *any* use of generative AI destroys agency, as this ignores the reality of necessary cognitive scaffolding.

  **5. Scope and Limitations**
  The scope of this project is limited to high-complexity, low-empiricism domains, specifically philosophy and mathematics. The argument relies on the premise that the output is evaluative (arguments, proofs) rather than descriptive (data retrieval). In empirical sciences, the "audit" often involves physical replication, which changes the nature of the regress. This dissertation will not address empirical sciences, though the framework may be adaptable.

  A significant breaking point lies in the definition of "independent." As tools become more integrated (e.g., code editors that auto-complete proofs), the line between the agent's cognition and the tool's output blurs. If the tool suggests a step and the agent merely recognizes it as correct, is that regeneration? I anticipate this objection in Chapter 3, but it remains a vulnerability. If "recognition" is sufficient for audit, the bar for agency is lower than I propose; if "generation" is required, the bar is likely too high. Navigating this middle path—defining *regenerative recognition*—is the greatest risk to the project's coherence.

  Furthermore, the project assumes a stable definition of "epistemic agency." If the philosophical community shifts toward a collective model of knowledge where individual auditability is deemed unnecessary, my normative claims will lose their force. I am arguing for the preservation of individual accountability in an increasingly distributed epistemic environment. If the field decides individual accountability is an obsolete ideal, the dissertation solves a problem that no longer exists.

  **6. Feasibility**
  This project is realistic for a three-year timeline. It requires no IRB approval, no data collection, and no coding. It relies on close reading of existing epistemological literature and the construction of thought experiments regarding AI interaction. The primary risk is scope creep regarding the technical capabilities of models. I will mitigate this by treating the models as a fixed category of "probabilistic text generators" rather than chasing every update in architecture. The focus remains on the epistemic relation, not the technology.

  By the end of term one, I will complete Chapter 1 and the literature review for Chapter 2. By the end of year one, Chapters 1–3 will be drafted. Year two will focus on the case studies in Chapter 4 and the normative framework in Chapter 5. Year three will be dedicated to revision and the integration of committee feedback. The personal stake in this topic ensures a high level of engagement, but I will maintain critical distance by treating my own usage patterns as data points for the argument, not the argument itself.

  This prospectus outlines a path to determine not just whether we understand less, but *where* we stop understanding. It locates the loss of agency not in the use of the tool, but in the outsourcing of the right to say "no" to the tool.
