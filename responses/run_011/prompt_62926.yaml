  *(Refining the "Rule")*: The user's rule separates "what she did" from "who she was." In drama, this is impossible. Stanislavski would argue action *is* character. I need to point this out firmly.

  *(Refining the "Obscurity" point)*: This is the strongest philosophical point the user makes. I need to validate that intuition. It is the crux of the matter.

