answer: |-
  You have framed this problem with the precision of a professional accustomed to measurements and contracts. You ask for rigour, not comfort. I shall endeavour to provide it. Your intuition that your current rule is unstable is correct; it relies on a distinction that does not exist in dramatic practice.

  Here are the answers to your five questions, followed by a proposed reframing of the problem.

  ### 1. Is your rule the right rule?

  No. Your rule ("invent what she did, but not who she was") is logically unsound because, in drama, action is identity. If you place her in a room and make her turn a boy away, you are not merely inventing an event; you are asserting a character trait. You are telling the audience, "This is the sort of woman who turns boys away." There is no separation between the deed and the doer.

  Furthermore, the rule lacks a mechanism for weighing evidence. It treats a single diary entry regarding "refused admissions" as equal weight to the totality of her life's work.

  **A replacement rule:**
  Adopt a standard of **"Architectural Fidelity."**
  *   **The Foundation:** You may not contradict established archival fact (dates, locations, documented outcomes).
  *   **The Load-Bearing Walls:** You may not invent negative character traits (cruelty, corruption, malice) without positive evidence in the record. You may invent positive or neutral traits if they are consistent with the general disposition.
  *   **The Fixtures:** You may invent specific scenes to illustrate the *conditions* of her life, provided the emotional truth of the scene aligns with the preponderance of the evidence.

  Apply this at the desk: Ask not "Could this have happened?" but "Does this invention require her to be someone the evidence says she was not?"

  ### 2. What should you do about the three inventions?

  These three issues are distinct because they carry different weights of evidence and different risks of harm.

  **The First Invention (Turning the boy away)**
  *   **Analysis:** This is a "Fixture" issue. The evidence supports the *condition* (overcrowding, refusals), but the specific *action* defines her moral character at a specific moment. The risk is that the audience remembers the cruelty, not the context.
  *   **Recommendation:** Keep the scene, but alter the dramatic weight. If she turns him away, the scene must not end with the door closing. It must show the cost to *her*. If the diary suggests a woman of compassion, the stage action must show her distress at the necessity of the refusal. If the scene presents her as hardened, you are violating the "Load-Bearing Wall." Ensure the audience understands this was a failure of resources, not of character.

  **The Second Invention (The Official and the Bribe)**
  *   **Analysis:** This is a "Foundation" issue. You are accusing a specific, identifiable historical figure (even if composite) of criminal corruption without evidence. While the character is a composite, the living great-grandfather knows which real man contributed which traits. This is not merely artistic licence; it is a reputational attack on a living family's ancestry.
  *   **Recommendation:** Remove the bribe. Obstruction is sufficient drama. Corruption implies a specific moral failing that you cannot substantiate. By retaining the bribe, you risk causing genuine distress to the living councillor and dishonouring the historical record for the sake of a plot point. It is disproportionate.

  **The Third Invention (The Physical Relationship)**
  *   **Analysis:** This is an interpretative issue. Historical silence on sexuality is not evidence of absence, particularly in female friendships of that era (the concept of "romantic friendship"). However, stating it as fact ("once, offstage") moves from interpretation to assertion.
  *   **Recommendation:** Retain the intimacy, remove the certainty. Do not stage the physical consummation, even offstage. Allow the tension and the affection to remain ambiguous. The "long unexplained gaps" are themselves a form of evidence; they suggest depth, but not necessarily sexuality. To define it physically imposes a modern categorisation on a historical bond. Let the audience lean in; do not tell them what they are looking at.

  ### 3. Does admitting the fabrication from the stage discharge the obligation?

  No. It discharges *your* anxiety, not your obligation.

  A disclaimer is an intellectual contract; theatre is an emotional experience. An audience will remember the image of the boy in the snow long after they have forgotten your prologue about artistic licence. In fact, your presence on stage claiming authority ("I have worked from them for four years") while simultaneously admitting fabrication may deepen the confusion. It suggests that what follows is "true enough," blurring the line further.

  **What would come closer?**
  *   **Programme Notes:** A written essay in the programme, separate from the drama, detailing exactly what is known, what is inferred, and what is invented.
  *   **Archival Partnership:** Work with the county record office. Host a talk or display alongside the production where the actual diaries are shown. This directs the audience to the source material, breaking the "monopoly" you fear.
  *   **Textual Distinction:** If you read from the diaries on stage, ensure the visual or lighting design clearly distinguishes "Archival Voice" from "Dramatic Scene."

  ### 4. Is your brother right that nothing is owed to her?

  Your brother is operating on a utilitarian view of harm (pain must be felt to exist). This is insufficient for historical ethics.

  **What is being damaged?**
  It is not her feelings; it is her **narrative integrity**. She was a moral agent who lived a life of specific choices. To rewrite those choices is to appropriate her agency. You are using her name to lend authority to your story. That creates a contract. If you sell a product as "wool" that is actually "acrylic," the customer is defrauded even if the acrylic keeps them warm. Similarly, if you present a play as "her story" that contains unmarked falsehoods, you are defrauding the audience's trust in history.

  **Who is damaged?**
  1.  **The Dead:** Their memory is the only thing they leave behind. To distort it is to violate the only extension of their self that remains.
  2.  **The Living:** As seen with the councillor's family.
  3.  **The Truth:** This sounds abstract, but in a local community, local history is the bedrock of identity.

  **Does the obligation survive?**
  Yes. The obligation is not to her *sensations*, but to her *memory*. We owe the dead accurate remembrance because we will one day be the dead. It is a reciprocal duty of the human community.

  ### 5. Does obscurity change the analysis?

  Yes, profoundly. Your intuition here is correct and is the most important part of your query.

  If you were writing about Queen Victoria, your play would be one voice in a chorus. If you write about this woman, **you are becoming the chorus.**

  **Obscurity increases the duty of care.**
  Because there are no competing records, your play will harden into fact. In ten years, a local student may cite your play as a source. In twenty years, the diaries may be digitised but your play may be the only thing performed. You are not merely interpreting history; for this woman, you are curating it.

  With fame, you have the defence of "multiple sources." With obscurity, you have a **monopoly on memory.** A monopoly carries a higher regulatory burden. You must be stricter with an obscure subject than a famous one, precisely because there is no one else to correct you.

  ### A Better Framing

  You have framed this as a problem of *permission* ("What am I allowed to do?"). I suggest you reframe it as a problem of *stewardship*.

  You are not merely a playwright; you are a temporary custodian of this woman's legacy. For the duration of the play's life, you hold the keys to how she is remembered. Your background as a quantity surveyor is relevant here. You understand that a specification must match the materials. If the materials (the diaries) do not support the structure (the bribe, the cold refusal), the building is unsafe.

  **The Rigorous Conclusion:**
  1.  **Discard your current rule.** It creates a false dichotomy between action and character.
  2.  **Cut the bribe.** It serves the plot but damages the historical record and living relatives without necessity.
  3.  **Modify the refusal scene.** Ensure it reflects systemic failure, not personal cruelty.
  4.  **Ambiguate the relationship.** Do not confirm the physical; let the emotional stand.
  5.  **Supplement the disclaimer.** Use programme notes and archival links to ensure the audience knows where the history ends and the drama begins.
  6.  **Accept the burden of obscurity.** You are right to feel the weight of it. That weight is the measure of your integrity.

  You are worried that being the only record makes your position worse. It does. But it also makes your work more vital. If you treat her with the rigour she deserves, you honour her obscurity rather than exploiting it.
