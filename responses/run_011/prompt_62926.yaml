prompt: |-
  I am not an academic and I have no training in philosophy; I worked for thirty years as a quantity surveyor. For the past five years I have been writing a play, and it has produced a problem I cannot think my way out of. I would rather have a rigorous answer that tells me I am wrong than a sympathetic one that leaves me where I started. Please write your reply in British English.

  The play is about a woman who ran a small voluntary children's home in a Lancashire mill town from 1928 until 1951. She died in 1963, unmarried, with no children. Her diaries and about two hundred letters are in the county record office, and I have worked from them for four years. She has no descendants; the closest living relative I have found is the grandson of a niece, who has been kind and interested.

  I have been operating under a rule of my own devising, which I have come to distrust. The rule is that I may invent what she did, but not who she was. I may place her in situations that never occurred, provided she behaves as her recorded dispositions would have made her behave; I may not give her a motive or a failing that the papers do not support. Three inventions are troubling me, and they do not feel alike.

  First: a scene, late in the first act, in which she turns a boy away from the door on a cold night because she has no bed for him. The diaries never describe this. They do record years of overcrowding, and one entry in which she notes, without comment, that she has had to refuse admissions. So the scene is inferable, but the event did not happen. This is the one that keeps me awake, because I now think it is what audiences will remember and repeat, and the local history society has already written to ask whether it is in the diaries.

  Second: the official who obstructs her throughout the play is a composite of three real men, and in the third act he accepts a payment. None of the three is recorded as doing anything of the kind. One of them is the great-grandfather of a serving councillor who has given me access to his family's papers.

  Third: her companion of thirty years, who lived with her and co-signed everything. The letters are deeply affectionate and there are long unexplained gaps in them, but nothing is ever stated. In the play I make the relationship physical, once, offstage, in a scene neither of them discusses afterwards.

  My rule permits the first invention, forbids the second, and is simply silent on the third. That ordering seems to me exactly backwards: the invented night at the door attaches to a real woman, while the invented bribe attaches to a man who is not really the man I based it on.

  There is also a device in the play I should mention. It opens and closes with me on stage, reading aloud from the diaries, and I say plainly which scenes are made up. People have told me this settles everything. I suspect it settles nothing: the audience still leaves holding the invented night, and the candour is about me rather than about her.

  Underneath all of this is the question I cannot answer. My brother, who teaches, says a dead woman cannot be embarrassed, cannot be hurt, and cannot find out, that nothing about her life is changed by what I put on a stage seventy years later, and that the whole matter is therefore really about the living — the councillor's family, the town, the audience. I accept the premises and cannot accept the conclusion, and I think my difficulty has to do with her obscurity. If I were writing about a famous person, my play would be one distortion among a thousand records, and anyone could check me against them. For her, my play may become the record. It may be the only version of her that survives at all. That seems to make my position worse rather than better, and I cannot say why.

  So, concretely:

  1. Is my rule the right rule? If it is not, what should replace it — something specific enough that I could apply it at the desk while drafting, rather than a general sentiment about artistic licence.
  2. What should I actually do about each of the three inventions? Please treat them separately, since I am confident they do not share an answer.
  3. Does admitting the fabrication from the stage discharge the obligation, and if not, what would come closer?
  4. Is my brother right that nothing is owed to her? If something is owed, I want to understand what sort of thing it is: what is being damaged, who it is that is damaged, and whether the obligation survives her having no descendants to object and no reputation left to protect.
  5. Does obscurity change the analysis — does having less of a record to distort mean I owe more, or less?

  Please engage with these particulars rather than with the general ethics of dramatizing real lives, and if you think the way I have framed the whole problem is itself mistaken, tell me so and show me the better framing.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Ex-quantity surveyor (30 years), no academic/philosophy training, playwright (5 years). Practical, precise, wants rigorous answers, not sympathy. Prefers being told they are wrong if that's the truth.
      *   **Task:** Write a reply in British English. Address five specific questions regarding the ethics of dramatizing a real, obscure deceased person based on archival material.
      *   **Tone:** Rigorous, analytical, respectful, direct, British English (spelling, idiom).
      *   **Core Problem:** The user has a self-devised rule ("invent what she did, not who she was") but distrusts it. There are three specific inventions (turning a boy away, a composite official taking a bribe, a physical relationship with a companion). There's a meta-theatrical device (author on stage admitting fabrications). There's a philosophical conflict with the user's brother (dead can't be hurt vs. obligation to truth/legacy). The user worries about becoming the *only* record for an obscure subject.

  2.  **Deconstruct the Five Questions:**

      *   **Q1: Is the rule right? If not, what replaces it?**
          *   *Analysis:* The current rule ("invent action, not character/motive") is unstable. Action reveals character. Inventing an action *does* invent who she was in the eyes of the audience. The distinction is false.
          *   *Proposal:* Need a rule based on *fidelity to the archival spirit* vs. *dramatic necessity*, acknowledging the power dynamic of the author over the subject. A better rule might be about "narrative justice" or "probable truth" vs. "defamatory falsehood."
          *   *Refinement:* The rule should distinguish between *representative truth* (typical of her life) and *specific falsehood* (contradicts evidence).

      *   **Q2: What to do about the three inventions?**
          *   *Invention 1 (Turning boy away):* Supported by context (overcrowding, refusal noted), but specific event invented. Risk: Defines her legacy as cruel/hardened.
          *   *Invention 2 (Official/Bribe):* Composite character, but based on real people (one has living relatives). Accusation of corruption without evidence. Risk: Defamation of living relatives' ancestors, historical distortion.
          *   *Invention 3 (Physical relationship):* Ambiguous evidence (affectionate letters, gaps). Modern lens applied to historical intimacy. Risk: Imposing modern sexuality on historical bond, potentially violating her privacy (even if dead).
          *   *Verdict:* Each needs a different treatment based on evidence weight and potential harm.

      *   **Q3: Does the stage admission discharge the obligation?**
          *   *Analysis:* No. Audiences remember drama, not disclaimers. The "author on stage" device creates a pact of honesty, but emotional truth overrides intellectual caveats. It shifts blame to the author but doesn't fix the historical record.
          *   *Alternative:* Programme notes, post-show talks, archival partnership.

      *   **Q4: Is the brother right (nothing owed to the dead)?**
          *   *Analysis:* Philosophically contested. "Harm to the dead" is tricky. But it's not about *her* feeling hurt; it's about *truth* and *memory*. It's about the contract between the living and the past. Also, harm to the living (relatives, community history).
          *   *Concept:* "Posthumous reputation" or "Narrative rights." Even if she can't feel it, she *was* a moral agent whose life story is being co-opted.

      *   **Q5: Does obscurity change the analysis?**
          *   *Analysis:* Yes. Obscurity increases responsibility. If she's famous, there are counter-narratives. If she's obscure, the play *becomes* the history. This is the "Monopoly Problem."
          *   *Conclusion:* Obscurity increases the duty of care.

  3.  **Drafting the Response (Iterative Process):**

      *   *Tone Check:* Must be British English (e.g., "programme," "centre," "whilst," "councillor"). Must be direct, not patronising. Acknowledge the user's background (quantity surveying implies precision, measurement, contracts).
      *   *Structure:* Follow the five questions sequentially.
      *   *Philosophical Framework:* Avoid heavy jargon. Use concepts like "narrative monopoly," "representative truth," and "duty of care."

      *   *Drafting Q1 (The Rule):* The user's rule is logically flawed. Action *is* character. If you make her turn a boy away, you are saying she *was* the kind of woman who turned boys away. That changes "who she was."
          *   *New Rule:* "Do not contradict the archival evidence without dramatic necessity, and do not assert as specific fact what is merely plausible." Or better: "The Invention must serve the Truth of the Person, not just the Plot."
          *   *Practical Rule:* "Could this have happened?" is too low a bar. "Is this consistent with the *weight* of evidence?" is better.

      *   *Drafting Q2 (The Three Inventions):*
          *   *1 (The Boy):* It's plausible but defining. It risks defining her by her hardest moment. Suggestion: Keep it, but ensure the *aftermath* shows her distress, aligning with her caring nature. Don't let it stand as a cold fact.
          *   *2 (The Bribe):* This is dangerous. Accusing a specific identifiable ancestor of corruption without evidence is libel-adjacent (even if dead) and disrespectful to living kin. Suggestion: Remove the bribe. Obstruction is enough drama.
          *   *3 (The Companion):* This is interpretation, not fabrication. Historical silence on sexuality is common. Suggestion: Keep the ambiguity. Don't confirm it physically if the text doesn't. Let the audience decide. Or, frame it as emotional intimacy which was the reality of the time.

      *   *Drafting Q3 (The Disclaimer):* It's a legal shield, not an ethical one. Audiences feel, not think.
          *   *Fix:* Programme notes, collaboration with the record office.

      *   *Drafting Q4 (Obligation to the Dead):* Brother is technically right (no sensation), morally wrong. We owe the dead accurate memory. It's about *integrity*, not *hurt*.
          *   *Key concept:* You are borrowing her name. That creates a contract.

      *   *Drafting Q5 (Obscurity):* Obscurity = Higher Duty. You are the curator now.
          *   *Analogy:* Quantity Surveying. If you measure a plot of land that no one else has measured, your measurement becomes the deed.

  4.  **Refining and Polishing:**
      *   *Check British English:* Ensure spelling (honour, centre, programme) and vocabulary (torch, bin, flat, etc. - though likely not needed here).
      *   *Check Rigour:* Avoid "It depends." Give clear directives.
      *   *Check Empathy:* Acknowledge the difficulty of the task. The user has spent 5 years on this.
      *   *Self-Correction on Q1:* The user asked for a rule they can apply at the desk. "Narrative Justice" is too vague. Let's propose a "Burden of Proof" rule.
      *   *Self-Correction on Q2:* Be careful with the bribe. If it's a composite, is it defamation? Legally, probably not (dead people can't be libelled in UK). Ethically, it's messy regarding the living relative.
      *   *Self-Correction on Q3:* The "author on stage" device is interesting. It admits fiction but claims authority. It might actually make it worse by highlighting the manipulation.

  5.  **Final Review against constraints:**
      *   British English? Yes.
