answer: |-
  Right then. If I could have you for five minutes. I'm a novelist, so for those of you who've read my books, you'll know I usually need fifty. I'll try to behave.

  Two years ago, Pat let me loose in this home. She gave me a key card and a warning: don't get in the way of the meds round. I spent most of that time watching how decisions got made. When there's one physio slot and three residents who need it. When there's a minibus with four seats and six families waiting.

  Pat carried a green ring-binder. She was an actuary before she came here, and it showed. If a bed was scarce, she allocated it by a written rule. Logged. Appealable. She was fanatical about the log. She told me once, 'A favour you can't audit turns into a personality.'

  Now, I know how that sounds. To some people in this room, that sounds like coldness. Like bureaucracy squeezing out the human bit. There's a whole tradition of thought that says rules and care are opposites. That you can't file compassion.

  But then there was the eleven-minute rule.

  Staff knew it. If you had to turn someone down by policy — no extra visit, no special diet, no transfer — you owed them eleven minutes. Undivided attention. No clipboard. No hurrying. Just hearing what it actually cost them to be told no. She kept a tally of them. She did one at seven in the morning in the car park once, in the rain, and missed her own kid's thing because the clock didn't stop until the eleven minutes were up.

  I watched her do this. I watched the staff do this. And I realised the binder wasn't there to stop the care. It was there to make it honest.

  If you don't have the rule, you're just guessing. You're giving based on who shouts loudest, or who you like best. That's not care. That's favouritism. And it burns you out, because you're constantly owing people pieces of yourself you can't track. The log protects the staff. It says: the system said no, not me. And because the system said no, I can give you these eleven minutes without resenting you. Without trying to fix the unfixable.

  The bookkeeping buys the attention.

  There are people in this room working on £12.60 an hour. They are knackered. They are not here because it's spiritually rewarding. They are here because it's a job that needs doing, and they do it well. Pretending otherwise is an insult. Pat knew that. She didn't ask for warmth. She asked for accuracy. She knew that if the roster was wrong, the care was wrong. If the pay was low, the respect had to be high.

  The academics at the back might find that uncomfortable. They like to think ethics lives in the feeling, not the file. But Pat's files were ethical. They were the only thing that made sure the care was distributed fairly rather than emotionally. The green binder wasn't the enemy of the eleven minutes. It was the scaffold that held them up.

  I could talk about dignity. I could talk about systems. But I'm looking at Pat, and I'm thinking about the car park at seven in the morning.

  She's retiring now. The binder gets handed over. The log closes. But I hope whoever takes this on remembers that the cold bits and the warm bits aren't fighting each other. They're the same thing.

  Pat, you kept the time. You kept the count. And you kept your word.

  Cheers.
