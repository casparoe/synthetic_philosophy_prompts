  Here is the breakdown of Maya's system, the prediction for the filmmaker, and the test case to prove it.

  ### The Verdict on the Filmmaker

  Maya will mark the Documentary Filmmaker as:
  *   **Saint Life:** "Kind of" (or a reluctant No).
  *   **Would Want It:** No.

  **Why:**
  The Filmmaker occupies a unstable middle ground in Maya's grid. She matches the **Surgeon** on motivation (she loves the *craft* of filmmaking and would do it even without the moral outcome), which usually caps the "Saint" verdict at "Kind of" because the moral good is a byproduct of self-expression, not the primary drive. However, she matches the **Med Student** on emotional state (she resents the constraints placed on her art and has sacrificed her social life), which kills the "Would Want" verdict. Unlike the Surgeon, who is harmoniously integrated into her work, the Filmmaker is internally conflicted; she is sacrificing the art she *wants* to make (the garden) for the art she *should* make (the convictions). In Maya's system, resentment disqualifies a life from being desirable, and instrumentalizing the good for the sake of art disqualifies it from being fully saintly.

  ### The Rule Maya Is Running

  Maya is not tracking "total good done" or "total sacrifice made." If she were, the Billionaire would be a Saint (he gave away a fortune) and the Med Student would be a life she'd want (he does more good than the Mom).

  Instead, Maya is running a rule I call **Integrated Moral Agency.**

  1.  **For "Saint Life":** The primary orientation must be toward **human need**, not efficiency, craft, or self-actualization.
      *   The **Nurse** and **Med Student** are Saints because they orient themselves toward the *people* they help, even if one is happy and one is miserable.
      *   The **Billionaire** is *not* a Saint because he orients himself toward *totals* and *efficiency*. He treats the good as a math problem, not a human relationship.
      *   The **Surgeon** and **Filmmaker** are "Kind of" because they orient themselves toward *Craft/Story*. The good happens, but it's secondary to their love of the work itself.

  2.  **For "Would Want It":** The life must exhibit **Internal Harmony**.
      *   You can be a Saint and Want it (Nurse) if you find happiness in the service.
      *   You can be a Saint and Not Want it (Med Student) if you feel the sacrifice as a loss.
      *   You can Not be a Saint and Want it (Mom) if you have balance.
      *   You cannot Want a life where you feel **resentment** or **disconnection**. This rules out the Med Student (regret), the Billionaire (disconnection from the people he helps), and the Filmmaker (resentment of the constraint).

  ### Competing Rules That Fit the First Five Rows

  There are two other rules that explain the first five rows perfectly but break on the Filmmaker.

  **Rule 1: The Sacrifice Threshold.**
  *   *Theory:* "Saint" means giving up >50% of personal autonomy. "Want" means reporting happiness.
  *   *Fits Rows 1-5:* Nurse/Med (High Sacrifice) = Saint. Mom/Billionaire (Low/Financial Sacrifice) = Not Saint. Surgeon (Time Sacrifice) = Kinda. Want tracks with reported happiness.
  *   *Breaks on Filmmaker:* She sacrifices friends, hobbies, and her desired art. Under this rule, she is a **Definite Saint**. (My prediction is "Kind of/No").

  **Rule 2: The Impact Metric.**
  *   *Theory:* "Saint" is determined by objective lives improved. "Want" is determined by work-life balance.
  *   *Fits Rows 1-5:* Nurse/Med/Billionaire (High Impact) = Saint. Mom (Low Impact) = Not Saint. Surgeon (High Impact) = Kinda. Want tracks with balance (Mom/Surgeon/Nurse have it, Med/Billionaire don't).
  *   *Breaks on Filmmaker:* She frees prisoners (High Impact). Under this rule, she is a **Definite Saint**. (My prediction is "Kind of/No").

  **Why I Bet on Integrated Moral Agency:**
  The Billionaire row is the key. He gave away a *fortune* (High Sacrifice, High Impact). If Maya cared about Sacrifice or Impact, he would be a Saint. He is not. He is rejected because of his *orientation* (totals vs. people). This proves Maya cares about *how* the good is done, not just *how much*. The Filmmaker, like the Billionaire, risks making the moral good secondary to something else (Art/Efficiency), but unlike the Billionaire, her work is human-centric. This puts her in the "Kind of" bucket with the Surgeon, not the "Yes" bucket with the Nurse.

  ### The Next Test Case

  To definitively separate **Integrated Moral Agency** from **Sacrifice** or **Impact**, you should bring Maya this case:

  **The Happy Egoist:**
  > A charismatic CEO who builds hospitals in developing nations. She admits she does it entirely for the fame and the ego boost; she says she doesn't care about the patients, only that her name is on the building. She works 80 hours a week (High Sacrifice), saves thousands of lives (High Impact), and says she is the happiest she has ever been (High Harmony).

  *   **Sacrifice Rule predicts:** Saint Yes, Want Yes.
  *   **Impact Rule predicts:** Saint Yes, Want Yes.
  *   **Maya's Rule (Integrated Agency) predicts:** Saint **No** (Orientation is Ego, not Human Need), Want **Yes** (Internal Harmony).

  If Maya marks this person as "Not a Saint" but "Would Want," her system is confirmed. If she marks them "Saint," she is running a Sacrifice/Impact rule, and the Billionaire row is an outlier.

  ### Resolving the Billionaire/Surgeon Tension

  You are right to spot the tension: both keep a non-moral motive (Motorcycles vs. Craft) alongside high-impact helping. Here is how one rule covers both without admitting inconsistency.

  **The Distinction is Integration vs. Compartmentalization.**

  *   **The Billionaire (Compartmentalized):** His morality and his self are in separate boxes. He gives money (Morality) and he restores motorcycles (Self). He explicitly disconnects his morality from human connection (thinking in "totals"). In Maya's system, a life where the "Good" is a transaction separate from the "Self" is alienating. It is neither Saintly (because the self isn't invested in the good) nor Desirable (because the self is split).
  *   **The Surgeon (Integrated):** Her morality and her self are the same box. She loves surgery (Self) and surgery helps people (Good). She doesn't have to choose between her passion and the good; they are identical. This integration allows her to be "Kind of" a Saint (the good is real) and "Yes" Wantable (the self is fulfilled).

  Maya's spreadsheet isn't inconsistent; it's judging the **relationship between the Self and the Good.** The Billionaire pays for the Good. The Surgeon *is* the Good. That is why one gets a flat No and the other gets a pass.
