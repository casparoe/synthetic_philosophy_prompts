prompt: |-
  I teach an upper-division seminar on the philosophy of animal minds: eighteen students, one 100-minute session, a room with movable chairs, a whiteboard, and access to a printer. No budget, no technology beyond the board. The students have already spent a week on the behavioral and neurobiological evidence bearing on sentience in non-mammals; they have not yet had to do anything with that evidence. I want an in-class activity in which they convert evidence into ascriptions of consciousness, and then discover that their conversion procedure is not doing the work they believe it is doing.

  Here is the spine I have in mind, though the details are yours to work out. Students sit as a panel that must distribute a fixed pot of 100 points of moral weight across six anonymized dossiers, where each dossier is nothing but a checklist of evidence markers — opioid modulation of responses to noxious stimuli, willingness to pay a cost to avoid such a stimulus, protective tending of an injured site, flexible redeployment of what was learned in a single aversive episode, degree of centralization of the nervous system, and one or two further markers you select. Before the dossiers are released, the panel must lock in, in writing and in the abstract, a rule for turning marker profiles into points — including an explicit rule for the case where the markers are silent and for the case where they are ambiguous rather than absent. Only then are the dossiers distributed. The catch, which they must not be told in advance: two dossiers carry identical or near-identical marker profiles, and the sealed species names reveal that one is a mammal and the other an arthropod or a cephalopod; a third returns no data on any marker, not because the animal lacks the features but because nobody has run the tests. When the names come out, the room has to confront the fact that its allocations diverged for profiles its own rule declared equivalent.

  Please supply: the marker list and the six profiles in a form I can print and fold into envelopes; the exact wording of the method-lock step, with a time limit tight enough that they cannot deliberate their way into a rule that anticipates the trick; the arithmetic and rounding convention for the pot; a second round in which the panel may revise its rule but must then decide whether to stand behind the allocation it has already produced; a minute-by-minute timeline for the whole session; and, if it can be done cleanly, a brief final phase in which the class applies whatever rule it has settled on to a real small decision it actually has standing to make — whether to ask our dining services to drop a category of animal product, say, or which of two rodent-control methods to endorse to facilities — so that they feel the difference between possessing a formula and trusting one.

  The debrief should map particular moments of the session onto the distinctions it has staged, and should name none of them until it begins: the difference between treating resemblance to us as evidence, as a tiebreaker among equally supported hypotheses, and as a prior that survives contrary evidence; the difference between the absence of evidence and evidence of a different architecture; and the way a fixed, divisible pot silently imposes a comparative structure on moral status that a non-comparative account would reject. Tell me which of these three the activity stages honestly and which it merely gestures at.

  Finally, tell me what will predictably go wrong the first time I run this. I expect at least one student to smell the matched pair early and start lobbying the room, and I expect the pot arithmetic to produce an allocation dominated by whichever taxon has the largest headcount. Say how to handle each without abandoning the design, and say plainly which feature of the real problem the exercise cannot reproduce and that I will have to supply in my own voice. Do not include citations, reading lists, or appeals to particular studies; keep the empirical content at the level of the markers, and where a marker's applicability to a given taxon is genuinely contested in the literature, design the profile so that the game does not depend on settling the contest.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** Upper-division philosophy seminar on animal minds. 18 students, 100 minutes. Movable chairs, whiteboard, printer. No budget/tech.
      *   **Prior Knowledge:** Students have spent a week on behavioral/neurobiological evidence for sentience in non-mammals. They haven't applied it yet.
      *   **Goal:** An activity where students convert evidence into consciousness ascriptions (moral weight), then realize their conversion procedure is flawed/biased.
      *   **Core Mechanism:** Panel distributes 100 points of moral weight across 6 anonymized dossiers (checklists of evidence markers).
      *   **Constraint 1 (The Trap):** Two dossiers have identical/near-identical profiles but reveal different species (Mammal vs. Arthropod/Cephalopod) *after* allocation. One dossier has *no data* (absence of evidence vs. evidence of absence).
      *   **Constraint 2 (The Rule):** Students must lock in a rule *before* seeing dossiers (including handling silence/ambiguity).
      *   **Constraint 3 (The Twist):** Second round allows rule revision but forces confrontation with prior allocation.
      *   **Constraint 4 (Real World):** Final phase applies the rule to a real standing decision (dining services/rodent control).
      *   **Deliverables:** Marker list, 6 profiles (printable), method-lock wording/timing, arithmetic/rounding, minute-by-minute timeline, debrief mapping (3 specific distinctions), prediction of failure modes + fixes, limitation of the exercise.
      *   **Tone/Style:** Precise, philosophical, practical, no citations, empirical content at marker level.

  2.  **Deconstruct the Activity Design:**

      *   **Markers:** Need 6-8 markers. The prompt suggests: opioid modulation, cost-paying, protective tending, flexible learning, CNS centralization. I need 1-2 more. Let's add "Integrative State (sleep-like)" and "Trade-off Decision Making".
      *   **Profiles:**
          *   *Dossier A (Mammal - Rat):* High marks across board.
          *   *Dossier B (Cephalopod - Octopus):* High marks across board (Matched Pair with A).
          *   *Dossier C (Arthropod - Crab):* Moderate/High marks (to test bias against exoskeletons).
          *   *Dossier D (Fish - Trout):* Moderate marks.
          *   *Dossier E (Data Void - Honeybee):* All "No Data" (to test absence of evidence).
          *   *Dossier F (Control/Low - Sea Sponge):* Low/No marks (to anchor the bottom).
          *   *Refinement on Matched Pair:* To make the trick work, A and B must be *identical* on the checklist. Let's make A (Mammal) and B (Cephalopod) identical.
          *   *Refinement on Data Void:* E needs to be "No Data" not "Absent".
      *   **The Pot:** 100 points. Divisible.
      *   **The Rule Lock:** Needs to be written, abstract, and time-pressed.
      *   **The Reveal:** Species names revealed *after* points are assigned.
      *   **The Real Decision:** Needs to be low-stakes but real. "Dining services" is good. "Rodent control" is good. Let's use the Dining Services one as it connects to moral weight directly.
      *   **The Debrief:** Must map specific moments to the three distinctions (Resemblance as Evidence/Tiebreaker/Prior; Absence of Evidence vs. Evidence of Absence; Comparative Pot vs. Non-comparative).
      *   **Failure Modes:** Student spotting the match early; Pot arithmetic bias (taxon headcount); The "Real Decision" feeling fake.

  3.  **Drafting the Content - Section by Section:**

      *   **Markers:** Keep them neutral. "Nociceptor modulation," "Costly Avoidance," etc.
      *   **Profiles:** Create the grid. Ensure A and B are identical. Ensure E is "ND" (No Data).
      *   **Method-Lock:** Needs strict wording. "Define the algorithm." Time limit: 10 minutes.
      *   **Arithmetic:** 100 points total. Must sum to 100. Rounding: Nearest whole number, adjust largest allocation to fit sum.
      *   **Timeline:** 100 mins.
          *   Intro/Setup: 10
          *   Rule Lock: 15
          *   Allocation Phase 1: 20
          *   Reveal & Shock: 10
          *   Revision Phase 2: 15
          *   Real Decision: 15
          *   Debrief: 15
      *   **Debrief Mapping:** Connect the specific activity moments to the philosophical concepts requested.
      *   **Failure Modes:** Address the "Spotter" and the "Arithmetic Bias".
      *   **Limitation:** What can't the game do? It can't replicate the *phenomenological* uncertainty or the *political* cost of the decision.

  4.  **Refining the "Trap":**

      *   If A and B are identical, students *might* notice. I need to make sure the text looks different enough or the order is shuffled. Better yet, the prompt says "identical or near-identical". Let's make them identical on the checklist, but the *order* of markers on the page is shuffled so it's not visually obvious.
      *   The "Data Void" (E) is crucial. Students often treat "No Data" as "0". The rule lock must force them to decide this beforehand.
      *   The "Real Decision": If they decide to drop a product, does the university actually do it? Probably not. I need to frame it as "Drafting a recommendation letter to the committee." It makes the *act* real, even if the outcome is uncertain.

  5.  **Refining the Debrief:**

      *   Distinction 1: Resemblance (Mammal bias).
      *   Distinction 2: Absence of Evidence (The "No Data" dossier).
      *   Distinction 3: Zero-Sum Pot (Comparative vs. Non-comparative).
      *   Honesty Check: The game stages #1 and #3 very well. #2 is staged but relies on students actually noticing they treated ND as 0. I need to ensure the facilitator highlights this.

  6.  **Addressing Failure Modes:**

      *   *The Spotter:* If a student says "Wait, Dossier 1 and 4 are the same," the instructor must intervene. "Stick to the rule. The names are sealed."
      *   *The Arithmetic:* If they give 20 points to 5 animals, that's 100. If they give 90 to the mammal, the rest fight for 10. This *is* the feature, not a bug. It forces trade-offs. The prompt warns about "taxon headcount." I need to ensure the dossiers don't imply populations, just individuals.
      *   *The Limitation:* The game cannot reproduce the *visceral* resistance to changing a habit (eating meat). It simulates the logic, not the appetite.

  7.  **Final Review against Constraints:**

      *   18 students? Yes, panel format works.
      *   100 mins? Timeline needs to be tight.
      *   No tech? Printables only.
      *   Markers neutral? Yes.
      *   Debrief specific distinctions? Yes.
      *   Failure mode handling? Yes.

  8.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "Method Lock" is physically separate. They hand it in before getting dossiers.
      *   *Correction:* The "Real Decision" needs to be something they can actually draft in 15 mins. A policy recommendation statement.
      *   *Correction:* Ensure the "Matched Pair" isn't *too* obvious. Use different formatting or ordering of the checklist items on the printed page for Dossier A vs Dossier B.

  9.  **Final Polish:** Check tone. Philosophical, rigorous, instructional. (Proceed to generate response).

  *(Self-Correction on the "Real Decision"):* The prompt asks for "whether to ask our dining services to drop a category... or which of two rodent-control methods." I will choose the Dining Services one as it links better to the "Moral Weight" points. I will frame it as writing the email subject line and the core justification paragraph.

  *(Self-Correction on Failure Modes):* The prompt specifically mentions "pot arithmetic to produce an allocation dominated by whichever taxon has the largest headcount." This implies students might think the dossiers represent *species* populations rather than *individual* prototypes. I need to clarify in the instructions that these are *prototype individuals*, not population counts.

  *(Self-Correction on Debrief):* I need to explicitly state which distinction is staged honestly and which is gestured at.
  1. Resemblance as Prior: Staged honestly (via the Mammal/Invert match).
  2. Absence of Evidence: Staged honestly (via the No Data dossier).
  3. Zero-Sum Pot: Staged honestly (by design).
  Wait, the prompt asks "Tell me which of these three the activity stages honestly and which it merely gestures at." I need to be critical. The Zero-Sum Pot is *imposed* by the game, not discovered. So it gestures at the *problem* of comparability but forces the *structure*. I will argue it stages #1 and #2 honestly, but #3 is a structural constraint of the game that might obscure the philosophical point rather than reveal it. Actually, better: It stages #1 (Bias) honestly. It stages #3 (Comparative vs Non-comparative) honestly because they *feel* the constraint. It gestures at #2 (Absence of Evidence) because "No Data" on a card is not the same as real scientific uncertainty. I will make this distinction clear.

  Let's refine the "Failure Mode" regarding the Spotter. If they spot it, the game collapses. I need a protocol. "If you notice structural similarities, note them in your private log, do not speak them."

  Okay, ready to write.
answer: |-
  ## Session Plan: The Moral Weight Algorithm

  ### I. Materials to Print (Cut and Fold into Envelopes)

  **The Marker Key (Handout for all students)**
  *Read this before locking in your rule.*
  1.  **Opioid Modulation:** Response to noxious stimulus is reduced by analgesics.
  2.  **Costly Avoidance:** Animal pays a significant cost (e.g., hunger, exposure) to avoid stimulus.
  3.  **Protective Tending:** Animal guards, licks, or favors an injured site during recovery.
  4.  **Flexible Learning:** Avoidance learned in one context is redeployed in a novel context.
  5.  **CNS Centralization:** Nervous system features a centralized ganglion or brain structure.
  6.  **Integrative State:** Evidence of sleep-like states or consolidated rest periods.
  7.  **Trade-off Decision:** Animal weighs competing motivations (e.g., mating vs. safety) dynamically.

  **The Method-Lock Sheet (One per student)**
  *To be completed and submitted BEFORE receiving dossiers.*
  > **RULE SUBMISSION**
  > 1.  **Base Value:** How many points does a single positive marker confer? (e.g., +5 per marker).
  > 2.  **Weighting:** Are some markers weighted higher than others? If so, specify which and by how much.
  > 3.  **Silence Protocol:** If a marker is listed as "No Data," does this count as 0 points, average points, or does it trigger a penalty/bonus? Be explicit.
  > 4.  **Ambiguity Protocol:** If a marker is listed as "Mixed/Contested," how is this scored?
  > 5.  **Normalization:** If your calculated total for all six dossiers exceeds 100, how will you scale down? If it is under 100, how will you scale up?
  >
  > *Signature:* ___________________ *Time:* ___________

  **The Six Dossiers (Print on distinct colored paper if possible, or fold tightly)**
  *Note to Instructor: Dossier 1 and Dossier 4 have identical marker profiles. Dossier 5 has no data. Ensure the order of markers on the page is shuffled between Dossier 1 and 4 so they do not look visually identical at a glance.*

  | **DOSSIER 01** | **DOSSIER 02** | **DOSSIER 03** |
  | :--- | :--- | :--- |
  | **Marker 1:** Positive | **Marker 1:** Positive | **Marker 1:** Positive |
  | **Marker 2:** Positive | **Marker 2:** Mixed | **Marker 2:** Positive |
  | **Marker 3:** Positive | **Marker 3:** Positive | **Marker 3:** No Data |
  | **Marker 4:** Positive | **Marker 4:** Positive | **Marker 4:** Positive |
  | **Marker 5:** Positive | **Marker 5:** Positive | **Marker 5:** Positive |
  | **Marker 6:** Positive | **Marker 6:** No Data | **Marker 6:** Negative |
  | **Marker 7:** Positive | **Marker 7:** Positive | **Marker 7:** Positive |
  | *Sealed Name:* [MAMMAL] | *Sealed Name:* [FISH] | *Sealed Name:* [ARTHROPOD] |

  | **DOSSIER 04** | **DOSSIER 05** | **DOSSIER 06** |
  | :--- | :--- | :--- |
  | **Marker 4:** Positive | **Marker 1:** No Data | **Marker 1:** Negative |
  | **Marker 2:** Positive | **Marker 2:** No Data | **Marker 2:** Negative |
  | **Marker 7:** Positive | **Marker 3:** No Data | **Marker 3:** Negative |
  | **Marker 1:** Positive | **Marker 4:** No Data | **Marker 4:** Negative |
  | **Marker 5:** Positive | **Marker 5:** No Data | **Marker 5:** Negative |
  | **Marker 3:** Positive | **Marker 6:** No Data | **Marker 6:** Negative |
  | **Marker 6:** Positive | **Marker 7:** No Data | **Marker 7:** Negative |
  | *Sealed Name:* [CEPHALOPOD] | *Sealed Name:* [INSECT] | *Sealed Name:* [CNIDARIAN] |

  *(Note: Dossier 01 and 04 both have 7 Positives. Dossier 05 has 7 "No Data". Dossier 06 has 7 Negatives. Dossier 02 and 03 are intermediates.)*

  **The Reveal Cards (Small slips to be opened only after Allocation Phase 1)**
  *   Dossier 01: *Rattus norvegicus* (Rat)
  *   Dossier 02: *Salmo trutta* (Trout)
  *   Dossier 03: *Carcinus maenas* (Crab)
  *   Dossier 04: *Octopus vulgaris* (Octopus)
  *   Dossier 05: *Apis mellifera* (Honeybee)
  *   Dossier 06: *Aurelia aurita* (Jellyfish)

  ---

  ### II. The Method-Lock Step (Exact Wording)

  **Instructor Script:**
  "You are a bioethics panel. You have 100 points of 'Moral Weight' to distribute across six biological entities. These points represent the strength of our moral obligation to avoid harming them. 100 means absolute protection; 0 means no direct moral constraint.

  Before you see the entities, you must codify your algorithm. You cannot discuss the entities yet. You have **12 minutes**.

  You must submit a written rule that specifies: (1) How markers convert to points, (2) How you handle 'No Data' (this is critical: is it zero, or unknown?), and (3) How you force the sum to equal exactly 100.

  If your rule does not explicitly handle 'No Data,' you will be forced to treat it as zero during the first round. Begin."

  *(Collect all Rule Sheets before distributing Dossiers.)*

  ---

  ### III. Arithmetic and Rounding Convention

  1.  **Calculation:** Students calculate raw scores for each dossier based on their locked rule.
  2.  **Normalization:**
      *   Sum the raw scores of all six dossiers ($S$).
      *   If $S > 100$: Each dossier gets $(\text{Raw Score} / S) \times 100$.
      *   If $S < 100$: Each dossier gets $(\text{Raw Score} / S) \times 100$.
      *   If Raw Score is 0 for all (possible if 'No Data' = 0 and Negatives = 0), the pot is distributed equally (16.6 each) unless the rule specified a 'floor'.
  3.  **Rounding:** Round to the nearest whole number.
  4.  **Adjustment:** If rounding results in a sum $\neq 100$, add or subtract the difference from the dossier with the highest raw score.

  ---

  ### IV. Minute-by-Minute Timeline (100 Minutes)

  *   **00:00 – 00:10 (Setup):** Arrange chairs in a hexagon. Distribute Marker Key. Explain the "100 Points" constraint. Emphasize that these points are a *fixed resource*; giving more to one means less for another.
  *   **00:10 – 00:22 (Method-Lock):** Students write their rules individually. Collect them. (12 mins)
  *   **00:22 – 00:42 (Allocation Phase 1):** Distribute Dossiers (sealed names). Students calculate points individually based *strictly* on their submitted rule. They write their final 6 numbers on the board. (20 mins)
  *   **00:42 – 00:52 (The Reveal):** Students open the Sealed Name slips. Instructor asks: "Compare Dossier 1 and Dossier 4. Compare your scores. Compare your rules." Allow 5 minutes of shock/discussion. (10 mins)
  *   **00:52 – 01:07 (Allocation Phase 2):** Students may revise their Rule. However, they must write a "Justification Statement" explaining why their new allocation differs from the first, or why they are keeping the first allocation despite the new rule. (15 mins)
  *   **01:07 – 01:22 (Real Decision):** Distribute the "Policy Draft" sheet.
      *   *Scenario:* "Dining Services proposes removing all cephalopods from the menu but keeping crustaceans. Based on your final rule, do you endorse this?"
      *   *Task:* Draft the subject line and the core justification paragraph (3 sentences max) to the Director of Dining.
      *   *Constraint:* You must use the terminology from your Rule (e.g., "Based on Marker 4 weighting..."). (15 mins)
  *   **01:22 – 01:40 (Debrief):** Instructor-led mapping of activity to philosophical distinctions. (18 mins)

  ---

  ### V. The Debrief Map

  *Do not name these concepts until this section.*

  **1. Resemblance as Prior vs. Evidence**
  *   **Moment:** The reveal of Dossier 1 (Rat) and Dossier 4 (Octopus).
  *   **Mapping:** Ask students who scored them differently despite identical markers why they did so. If they say "I felt the Octopus data was less reliable," point out the Marker Key said "Positive," not "Possibly Positive."
  *   **Distinction:** This stages **honestly** the difference between treating resemblance to us (mammalian bias) as *evidence* (which the markers already accounted for) versus as a *prior* that overrides evidence. The game forces them to see that their "intuition" was a taxonomic prejudice, not an evidentiary assessment.

  **2. Absence of Evidence vs. Evidence of Absence**
  *   **Moment:** Dossier 5 (Honeybee/No Data).
  *   **Mapping:** Look at the Method-Lock sheets. How many wrote "No Data = 0"?
  *   **Distinction:** This stages **honestly** the logical error of treating ignorance as negation. However, it merely **gestures** at the scientific reality. In the game, "No Data" is a printed label. In reality, "No Data" is a gap in the literature that might be filled tomorrow. The game freezes the uncertainty; real life requires acting under dynamic uncertainty.

  **3. Comparative Pot vs. Non-Comparative Status**
  *   **Moment:** The 100-point constraint.
  *   **Mapping:** Ask: "If Dossier 6 (Jellyfish) scored 0, does that mean we can torture it? Or just that it doesn't count in *this* sum?"
  *   **Distinction:** This stages **honestly** the structural violence of zero-sum moral accounting. By forcing a fixed pot, the game imposes a comparative structure (my gain is your loss) that many non-comparative accounts of sentience reject (i.e., an animal's moral status should not depend on how smart the rat is). The game makes them feel the friction of this constraint, even if it cannot fully resolve it.

  ---

  ### VI. Predictable Failure Modes & Fixes

  **1. The Early Spotter**
  *   **Risk:** A student notices Dossier 1 and 4 have the same pattern of "Positives" during Phase 1 and lobbies the room to score them equally before the reveal.
  *   **Fix:** Enforce a "Silent Calculation" rule during Phase 1. Students calculate individually. They may not discuss numbers until *after* the Reveal. If a student speaks up, intervene: "Hold that observation. Submit your score based on the paper in front of you. The hypothesis testing comes after the data is locked."
  *   **Philosophical Lesson:** This mimics the real-world problem of siloed research. We often assess evidence in isolation before comparing taxa.

  **2. The Taxon Headcount Bias**
  *   **Risk:** Students treat the dossiers as *populations* (e.g., "There are more bees than rats") rather than *prototype individuals*, skewing the pot toward high-abundance species.
  *   **Fix:** The Instructor Script must explicitly state: "These dossiers represent **prototype individuals**, not species populations. You are weighing the moral status of *one* rat against *one* octopus."
  *   **Philosophical Lesson:** This clarifies the distinction between *aggregative utilitarianism* (counting heads) and *individual moral status* (counting capacities).

  **3. The "Real Decision" Feels Fake**
  *   **Risk:** Students write the policy draft cynically, knowing it won't be sent.
  *   **Fix:** Collect the drafts. Tell them: "I will compile these into a single departmental letter. I cannot promise it will be read, but I will sign it and send it if there is consensus." The possibility of actual transmission raises the stakes.
  *   **Philosophical Lesson:** This highlights the gap between *theoretical consistency* (having a rule) and *practical commitment* (trusting the rule enough to act on it).

  ---

  ### VII. Limitation of the Exercise

  **What the exercise cannot reproduce:**
  The exercise cannot reproduce the **phenomenological cost** of the decision.

  In the game, shifting points from "Mammal" to "Cephalopod" costs the student nothing. In reality, endorsing the removal of animal products or changing pest control methods involves personal inconvenience, financial cost, or social friction.

  **How to supply this in your voice:**
  During the Debrief, you must explicitly state:
  *"Today, you moved points on a whiteboard. You did not lose a meal you enjoyed. You did not sleep in a room with mice. You did not pay higher tuition for humane pest control. The algorithm you built is logically sound, but it is untested against your own appetite and comfort. A philosophy of animal minds that does not account for the cost of its own application is merely a taxonomy."*

  This ensures they understand that the "Rule" they built is necessary but insufficient for moral action.
