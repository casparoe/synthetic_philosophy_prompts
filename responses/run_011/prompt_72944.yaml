answer: |-
  ### The Case: The Hospice Bluff

  **The Situation**
  Elena is a senior social worker at a metropolitan hospice. One of her patients, a destitute elder named Mr. Henderson, is in terminal agony. The only medication that will manage the pain is being withheld by a private insurance administrator, Mark, due to a bureaucratic technicality. Standard appeals have failed. Elena knows Mark personally from previous conflicts; he is a "shark" who interprets calm professionalism as weakness and only responds to perceived threat. He has explicitly told Elena, "I don't care about your feelings, show me you have teeth."

  **The Act**
  Elena calls Mark. To break the deadlock, she induces a state of genuine, hot *dosa* (aversion/ill-will) toward him. She does not simulate anger; she actively cultivates resentment about his indifference until her voice shakes with authentic rage. She threatens to drag his company through a scandalous public lawsuit (which she knows is legally weak but damaging to their reputation). Mark, sensing genuine aggression and risk, immediately authorizes the medication. Henderson dies peacefully six hours later.

  **The Stipulations (Naturalized & Contained)**
  1.  **Causal Necessity:** Mark's psychology is such that simulated anger would have been detected as a bluff. The *authenticity* of the aggression was the load-bearing causal mechanism. *Upāya* (skillful means via compassion) is blocked; calm assertion fails here.
  2.  **No Residue:** Elena experiences the *dosa* intensely for 20 minutes. Afterward, she engages in standard decompression. **Stipulation:** Within 12 hours, her psychological baseline returns to pre-act equanimity. No habit of anger forms. No disposition shifts. She feels no guilt (she views it as a necessary cost), and guilt is not counted as a negative consequence.
  3.  **Secrecy:** No one else knows she felt genuine hatred. Mark thinks she's a tough negotiator; colleagues think she was assertive. The "unwholesome" nature of the intention is epistemically private.
  4.  **Naturalism:** No karma carries over to future lives. The only consequences are psychological and social within this lifetime.

  ---

  ### Theoretical Run-Through

  **1. Act Utilitarianism (Hedonic, Agent-Neutral)**
  *   **Calculation:**
      *   **Benefit:** Mr. Henderson avoids 6 hours of excruciating pain (high disvalue avoided).
      *   **Cost:** Mark experiences 20 minutes of stress/fear (low disvalue). Elena experiences 20 minutes of *dosa* (mental suffering).
      *   **Net:** The relief of Henderson's agony vastly outweighs the transient stress of Mark and the transient defilement of Elena.
  *   **Verdict:** The act is **Required**. To refrain would be to allow preventable suffering for the sake of Elena's temporary mental purity.
  *   **Logic:** The moral weight of a mental state is purely instrumental. If the *dosa* buys a greater reduction in global suffering, it is a good purchase.

  **2. Naturalized Buddhist Consequentialism (NBC)**
  *   **Calculation:**
      *   **Goal:** The minimization of *dukkha* (suffering/unsatisfactoriness) via the cultivation of *kusala* (skillful/wholesome) states.
      *   **Mechanism:** *Kamma* is *cetanā* (volition). The moral quality of an act is determined by the roots (*mūla*) from which it springs.
      *   **Assessment:** The act sprang from *dosa* (one of the three unwholesome roots). Therefore, the act is *akusala* (unskillful).
      *   **Consequence:** Even though external suffering was reduced, the agent *instantiated* a state of bondage. In Buddhist psychology, *dosa* is not just a cause of future suffering; it *is* suffering (*dukkha*) in the present moment. More critically, the path to the end of suffering requires the abandonment of the unwholesome roots, not their strategic deployment.
  *   **Verdict:** The act is **Wrong** (Unskillful).
  *   **Logic:** You cannot end suffering by generating the causes of suffering, even if the immediate arithmetic looks favorable. The integrity of the agent's mental continuum is not just a resource to be spent; it is the *locus* of the ethical project.

  **The Divergence Point**
  The theories part company at the **valuation of the occurrent volition**.
  *   **AU:** Values the volition *instrumentally*. (Is it a useful tool?)
  *   **NBC:** Values the volition *constitutively*. (Is it of the right *kind*?)
  For the AU, the act ends when the outcome is secured. For the NBC, the act *is* the volition itself, and a poisoned volition is a poisoned act, regardless of the fruit.

  ---

  ### Feature Testing: What Does the Work?

  **The Single Feature:** **The Intrinsic Disvalue of *Akusala-Cetanā*.**
  In NBC, an unwholesome intention is not merely a predictor of bad future habits; it is an immediate instance of *dukkha* that cannot be offset by external pleasure.

  **Removal Test 1: Fakeable Malice**
  *   *Change:* Suppose Elena could have simulated the rage perfectly (acting skill), achieving the same result from a calm, compassionate base (*metta*).
  *   *Result:* **Divergence Collapses.** Both AU and NBC endorse the act. NBC prefers it because the root is wholesome (or neutral). AU prefers it because it saves Elena the 20 minutes of mental pain.
  *   *Significance:* This proves the objection isn't about the *outcome* (Henderson's pain relief) but the *mental cost* to the agent.

  **Removal Test 2: Spreading Residue**
  *   *Change:* Suppose the stipulation is lifted. Elena's anger makes her irritable at dinner; she snaps at her partner. A habit of aggression forms.
  *   *Result:* **Divergence Narrows.** AU might still endorse the act if Henderson's pain is severe enough to outweigh the domestic fallout. NBC forbids it even more strongly.
  *   *Significance:* This shows NBC is sensitive to *causal* consequences (habits), but Spec 6 forced us to isolate the *intrinsic* badness. Since the divergence survives Spec 6, the intrinsic badness is the primary driver.

  ---

  ### The *Anattā* Twist

  **The Challenge:**
  Elena takes *anattā* (no-self) seriously. She denies that "her" mental continuum has any ontological privilege over Henderson's physical continuum. Suffering is ownerless. Why should the 20 minutes of *dosa* in this locus (Elena) weigh heavier than 6 hours of agony in that locus (Henderson)? If there is no self to protect, is "mental purity" just a fetish?

  **The Reasoning:**
  1.  **If Divergence Survives:** It implies an **Axiological Hierarchy**. Even without a self, Buddhist ethics posits that *mental* suffering (defilement) is lexically superior to *physical* suffering. Why? Because physical pain is inevitable (*dukkha-dukkha*), but mental defilement (*saṅkhāra-dukkha*) is the *cause* of the cycle of suffering. To prioritize physical relief over mental defilement is to treat the symptom while worsening the disease, even if the "disease" doesn't spread in this specific instance. The *kind* of suffering matters more than the *amount*.
  2.  **If Divergence Collapses:** It implies Buddhist Ethics is **Prudential Consequentialism**. The reason you don't get angry is usually because it hurts *you* (karma/rebirth/habit). If you remove the self-interest (no future karma, no habit, no self to protect) and the net suffering is lower, the prohibition vanishes.

  **My Verdict:**
  Under strict Naturalism + *Anattā* + Spec 6 (No Residue), **the divergence collapses.**
  If there is no self to accumulate karma, and no habit forming to degrade future capacity, and the *dosa* is transient, then the *dosa* is just another unit of suffering in the universe. If the total sum of suffering is lower with the act, a consistent Naturalized Buddhist Consequentialist must endorse it.
  *However*, traditional NBC resists this. It argues that *cetanā* is the only thing we truly control. To sacrifice the quality of the will for the quality of the world is to misunderstand the domain of ethics. Ethics is about the will, not the world.
  *Cost:* This moves NBC away from Consequentialism (outcomes) toward a form of **Volitional Deontology**.

  **What Should She Do?**
  Given Spec 3 (AU says Required) and the collapse of divergence under strict *Anattā*/Naturalism: **She should do it.**
  *Cost to Theory:* This admits that "Buddhist Consequentialism" is only distinct from Utilitarianism because of belief in long-term karmic causality or the ontological reality of the self/continuum. Without those, it is Utilitarianism with a specific psychological vocabulary.

  ---

  ### The Utilitarian Counter-Attack

  **1. Attack on Stipulations (The "Fiats")**
  "You stipulated 'No Residue.' That is psychologically impossible. Neural pathways fire together, wire together. To stipulate that genuine *dosa* leaves no trace is to stipulate that the laws of psychology don't apply to Buddhists. You've built the verdict into the physics of the thought experiment. If anger *actually* left no trace, it wouldn't be anger; it would be a simulation. By defining it as 'genuine *dosa*,' you implicitly import the long-term costs you claim to suspend."

  **2. Attack on Intrinsic Disvalue (The "Reduction")**
  "You claim *dosa* is intrinsically bad. But in a naturalized framework, 'bad' just means 'conducive to suffering.' If I show you a case where *dosa* is *not* conducive to net suffering (as I have), and you still call it 'bad,' you are using 'bad' as a synonym for 'forbidden by tradition.' You are begging the question. You say it's unskillful (*akusala*). I ask: 'Unskillful for what?' If the answer is 'For achieving Nirvana,' you've left Naturalism. If the answer is 'For reducing suffering,' I've shown it reduces suffering. Your 'intrinsic disvalue' is a ghost."

  ---

  ### Final Diagnosis: Axiology or Philosophy of Action?

  **Your Hunch:** You suspected the divergence is about **Philosophy of Action** (where the act is located), not Axiology (what is good).

  **Correction/Confirmation:**
  **You are correct.**

  The divergence is not primarily about *what is good* (both agree: suffering is bad, peace is good). The divergence is about **what constitutes the ethical unit**.

  *   **Utilitarianism:** The ethical unit is the **State of Affairs**. The act is a lever. The intention is part of the causal chain leading to the state of affairs. If the lever is rusty (*dosa*) but moves the rock (relieves pain) better than a clean lever, use the rusty lever.
  *   **Buddhist Ethics:** The ethical unit is the **Volitional Event** (*Cetanā*). The act is *not* the outcome; the act is the intention *plus* the movement. The outcome is *vipāka* (fruit), distinct from the *kamma* (seed).
      *   For the Utilitarian, the seed matters only for the harvest.
      *   For the Buddhist, the seed *is* the crop. The quality of the mind *in the moment of action* is the primary locus of value.

  **Why this matters:**
  If Buddhist ethics is consequentialist, it is a **Second-Order Consequentialism**. It says: "The best way to minimize suffering is to treat the quality of volition as intrinsically valuable, even when it conflicts with first-order suffering arithmetic."
  But as the *Anattā* test showed, without the metaphysical baggage of karma/rebirth/habit, this Second-Order rule looks arbitrary. It looks like a heuristic ("Don't get angry, it usually backfires") mistaken for a law ("Getting angry is inherently wrong").

  **Conclusion:**
  The case forces the divergence only by relying on the stipulation that *dosa* has intrinsic disvalue independent of its causal aftermath. If you accept that stipulation, Buddhism is **not** standard consequentialism; it is a **Virtue Ethics with Consequentialist Justification** (be virtuous because it leads to good ends, but the virtue is defined by the state of mind, not the ends).
  If you reject the stipulation (as the Utilitarian does), Buddhism collapses into a **Long-Term Rule Utilitarianism** (don't get angry because it usually causes more pain).

  **The Build Verdict:**
  You cannot force a clean divergence between Naturalized Buddhist Ethics and Act Utilitarianism without smuggling in a deontological constraint on the *quality of the will*. If you truly naturalize it (remove karma, remove self, remove habit), the "Unwholesome" becomes synonymous with "Counter-Productive." If it is Productive, it is, by naturalized definition, Wholesome.

  **To get the divergence you want, you must admit:** Buddhist ethics is not purely consequentialist. It places a lexical priority on the *purity of the agent's mind* that cannot be fully cashed out in secular hedonic currency. It is a soteriology disguised as an ethics.
