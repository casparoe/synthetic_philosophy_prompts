answer: |-
  0.55

  **Decomposition**

  1.  **Probability of Resemblance (0.90):** The convergence on liberal, welfare-sensitive norms across Firth, Brandt, Rawls, and Habermas is empirically observable in their published conclusions, even if their foundations differ.
  2.  **Probability of Parameter Force (0.30):** Including the diagnostic test, parameters like "more information" reduce factual error but rarely dictate axiological priorities without smuggling in prior valuations of what information matters.
  3.  **Probability of Determinacy (0.60):** The outputs align robustly at the level of abstract principles (no torture) but fracture significantly on concrete trade-offs (tax rates, animal rights), limiting the scope of the resemblance.
  4.  **Probability of Evaluability (0.40):** An author's choice of which traits to idealize (e.g., "calmness" vs. "passionate commitment") is so entangled with their normative goals that the required counterfactual separation is arguably incoherent.
  5.  **Probability of Selection Bias (0.80):** The decision to treat "impartiality" as a virtue of idealization rather than a vice is itself a first-order normative commitment that predates the procedure.

  **Combination and Sensitivity**

  I derive the headline number by treating Proposition $P$ as a causal claim that survives only if the parameters lack independent generative power (Term 2) and the selection of those parameters is driven by prior commitments (Term 5), weighted by the difficulty of verifying the counterfactual (Term 4). Roughly: $P \approx \text{Term}_5 \times (1 - \text{Term}_2) \times \text{Term}_4^{-1} \text{ (penalty)}$. The high Selection Bias and low Parameter Force push $P$ up, but the low Evaluability prevents me from exceeding 0.60.

  The number is most sensitive to **Term 2 (Parameter Force)**. If you convince me that "full information + calmness" mechanically necessitates a specific moral ontology regardless of the agent's starting priors, my credence in $P$ collapses toward your friend's 0.2. If you convince me that information is normatively inert without a prior utility function, my credence rises toward your 0.75.

  **The Diagnostic Test**

  I regard your test as **fair but insufficiently strong**. It correctly identifies that if parameters are doing the work, they should have predictable directional effects (e.g., "more grief" should shift outputs consistently across authors). However, passing the test only shows parameters have *some* force, not that they have *primary* force. I have folded this verdict into Term 2 by keeping the probability low: parameters filter noise, but they do not generate the signal.

  **Locating the Disagreement**

  You and your friend are diverging primarily on **Term 2 (Parameter Force)** and **Term 5 (Selection Bias)**.

  *   **Your Friend (0.2)** believes Term 2 is high: she thinks idealization is a *filter* that removes local bias to reveal a universal moral signal inherent in rationality itself.
  *   **You (0.75)** believe Term 5 is high and Term 2 is low: you think idealization is a *mold* where the choice of shape (which parameters to idealize) determines the output before the procedure begins.

  **Diagnostic Questions for a Neutral Third Party**

  1.  **To the Friend:** "If we apply Brandt's cognitive psychotherapy to a deeply committed 14th-century feudal lord with full historical information and logical consistency, does he become a modern liberal egalitarian, or a perfectly informed feudal lord?" (This tests whether idealization converges on *our* norms or merely optimizes *their* norms.)
  2.  **To You:** "If we take two modern philosophers with opposing views on redistribution and subject them to *identical* idealization conditions (same information, same impartiality constraints), does the gap between their conclusions close significantly, or remain exactly as wide?" (This tests whether the parameters exert *any* convergent pressure, or if they are truly inert.)
