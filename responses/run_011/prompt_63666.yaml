answer: |-
  ### The Ontological Models Framework and the $\psi$-Distinction

  To understand your friend's argument, you must first grasp the "Ontological Models Framework" (OMF), which is the playground where these theorems live. The framework assumes that when a system is prepared in a quantum state $\psi$, there exists some underlying physical state of reality, denoted $\lambda$ (lambda). The question is: what is the relationship between $\psi$ and $\lambda$?

  A model is **$\psi$-ontic** if the quantum state $\psi$ is uniquely determined by the physical state $\lambda$. In other words, if you knew the complete physical reality $\lambda$, you would know exactly what $\psi$ is. Different $\psi$'s correspond to disjoint sets of $\lambda$'s. A model is **$\psi$-epistemic** if distinct quantum states can correspond to the same underlying physical state $\lambda$. Here, $\lambda$ does not fix $\psi$; $\psi$ represents a probability distribution over $\lambda$, reflecting an observer's knowledge rather than the physical reality itself.

  However, this taxonomy is contested on two fronts. First, it assumes realism about $\lambda$; interpretations that deny there is any "underlying state" independent of the agent (like QBism) technically fall outside the framework entirely, making the classification a category error for them. Second, the distinction sometimes conflates "$\psi$ is real" with "$\psi$ is the *whole* story." A theory can be $\psi$-ontic (the wavefunction is real) but not $\psi$-complete (there are also hidden variables, like particle positions in Bohmian mechanics). Your friend's argument occasionally slides between "$\psi$ is real" and "$\psi$ is all there is," which is where the technical cracks appear.

  ***

  ### Assessment of the Five Claims

  **Claim 1:** *Harrigan and Spekkens divide interpretations into $\psi$-ontic and $\psi$-epistemic... on the second, it encodes only what an observer knows, so one and the same underlying physical situation can correctly be assigned many different wavefunctions.*
  *   **Verdict:** **Accept.** This is a tolerable and accurate summary of the definitions within the Ontological Models Framework.
  *   **Nuance:** The phrase "part of the physical state" for $\psi$-ontic is slightly loose. In $\psi$-ontic models, $\psi$ is a property of $\lambda$ (or is $\lambda$), but it doesn't necessarily mean $\psi$ is a physical *field* in space yet. It just means $\psi$ is a physical property.

  **Claim 2:** *Every $\psi$-epistemic view is therefore a hidden-variable theory in disguise... which means it inherits every no-go result: Bell kills the local ones, Kochen–Specker kills the noncontextual ones, and there is nothing left over.*
  *   **Verdict:** **Mostly Accept, with Simplification.**
  *   **Analysis:** It is correct that $\psi$-epistemic models are, by definition, ontological models with hidden variables ($\lambda$). Therefore, they are subject to Bell and Kochen-Specker. However, saying "there is nothing left over" is a simplification. Bell only kills *local* hidden variable theories. A $\psi$-epistemic model could be non-local (though constructing one that matches quantum predictions is notoriously difficult). She is right that the space is squeezed, but she implies the squeeze is tighter than it is by omitting the locality condition on Bell's theorem.

  **Claim 3:** *The Pusey–Barrett–Rudolph theorem settled the remainder anyway: provided two systems are prepared independently, distinct pure quantum states cannot have overlapping distributions over the underlying states, so $\psi$-epistemic models are ruled out outright and the quantum state is an element of reality in the same way a classical field is.*
  *   **Verdict:** **Subtly Wrong.**
  *   **Analysis:** The first half is correct: PBR rules out $\psi$-epistemic models *given* the "Preparation Independence" assumption. The error lies in the conclusion: "the quantum state is an element of reality in the same way a classical field is." PBR proves $\psi$ is ontic (it corresponds to reality), but it does *not* prove $\psi$-completeness. It leaves open "$\psi$-supplemented" models where $\psi$ is real but there is *also* extra stuff ($\lambda$). Bohmian mechanics is $\psi$-ontic (the pilot wave is real) but not $\psi$-complete. Her phrasing suggests $\psi$ is the *only* reality, which PBR does not establish. She states the assumption ("provided two systems are prepared independently") but then treats the conclusion as unconditional in the next clause.

  **Claim 4:** *Consequently the wavefunction is a real physical object spread out in space, the survivors are Everett and Bohm (both $\psi$-ontic), and views like QBism are simply refusals to do metaphysics.*
  *   **Verdict:** **Flatly Mistaken.**
  *   **Analysis:** This is the weakest link. First, "survivors are Everett and Bohm" is a false dichotomy. Dynamical Collapse theories (like GRW) are also $\psi$-ontic (the wavefunction is real and collapses physically), yet she omits them. Second, classifying QBism as a "refusal to do metaphysics" is polemical, not technical. QBism rejects the premise of the Ontological Models Framework (that there is a $\lambda$ independent of the agent). PBR cannot rule out QBism because QBism denies the framework PBR relies on. It is not a survivor; it is an opt-out. Calling it a refusal to do metaphysics is like calling a non-Euclidean geometer a refusal to do geometry.

  **Claim 5:** *The measurement problem was never a problem about what the wavefunction is; it is a problem about which $\psi$-ontic story you prefer, and the epistemic camp had no answer to it, since calling the wavefunction "information" does not tell you why we observe one outcome rather than another.*
  *   **Verdict:** **Partially Correct / Insightful.**
  *   **Analysis:** She is right that if $\psi$ is ontic, the measurement problem becomes a physical problem (how does the real wavefunction collapse or branch?). She is also right that simply calling $\psi$ "information" does not solve the "outcome problem" (why *this* outcome?). However, she is wrong that the epistemic camp had "no answer." Their answer is that the problem is ill-posed: if $\psi$ is knowledge, "collapse" is just Bayesian updating. The problem then shifts to explaining why the update is discontinuous or why agents agree, but it is not fair to say they have *no* answer. They dissolve the problem rather than solve it.

  ***

  ### Assessment of Your Counter-Move

  **Your Move:** *Deny the preparation-independence premise, and appeal to retrocausal influences from the measurement events back to the preparation.*
  **Her Reply:** *This is just superdeterminism under a nicer name... no respectable person accepts that.*

  *   **Verdict:** **Your move is technically valid; her reply is a sociological conflation.**
  *   **Analysis:** You have identified the standard loophole for PBR. Retrocausal models violate Preparation Independence because the future measurement setting influences the past preparation state. Her claim that this is "superdeterminism" is a common conflation in the physics community, but technically imprecise. Superdeterminism usually posits a common cause in the *past* that correlates settings and states (violating "Measurement Independence"). Retrocausality posits an influence from the *future*. Both violate the statistical independence assumptions required for no-go theorems, but they have different metaphysical costs. Her claim that "no respectable person accepts that" is a sociological fact about the current mainstream, not a logical refutation. Retrocausality is a minority view, but it is defended by serious researchers. You were right to press the assumption; she was right that the cost is high, but wrong to dismiss it as identical to superdeterminism.

  ***

  ### Overall Conclusion and Strongest Reply

  **What survives of her conclusion?**
  Once corrected, her conclusion narrows significantly. She can claim: "If you accept the Ontological Models Framework and assume Preparation Independence, then $\psi$ must be ontic." She *cannot* claim that $\psi$ is the *only* reality (Bohm and GRW survive), nor that QBism is ruled out (it rejects the framework). The core takeaway—that $\psi$-epistemic models are highly constrained—is robust, but the leap to "Everett or Bohm or bust" is not supported by the theorems she cites.

  **What is the strongest reply she could make to your corrected account?**
  Her strongest reply is not technical but methodological. She can argue: "The Ontological Models Framework is the only game in town for talking about 'reality' in physics. If QBism refuses to posit $\lambda$, it isn't offering an ontology, it's offering an instrumentalist calculus. If Retrocausality violates Preparation Independence, it renders experimental science unintelligible by undermining the assumption that we can set up systems independently. Therefore, for the purpose of doing physics, we must act *as if* $\psi$ is ontic and independent." This shifts the debate from "what is true" to "what is productive," which is harder for a philosopher to dismiss.

  ***

  ### Confidence and Uncertainty

  **Confidence Levels:**
  *   **High Confidence:** My assessment of Claims 1, 3, and 4 regarding the definitions of $\psi$-ontic/epistemic and the specific scope of the PBR theorem. I would defend these in a foundations seminar.
  *   **High Confidence:** The distinction between retrocausality and superdeterminism regarding independence assumptions.
  *   **Moderate Confidence:** The classification of specific interpretations (e.g., whether all variants of GRW are strictly $\psi$-ontic in the H&S sense). Some formulations are subtle.
  *   **Interpretive Preference:** The claim that QBism is a "refusal to do metaphysics." This is a philosophical judgment, not a theorem.

  **Point of Least Certainty:**
  I am least sure about the extent to which **Preparation Independence** holds in relativistic Quantum Field Theory (QFT). The PBR theorem is formulated in standard quantum mechanics. In QFT, the notion of "preparing two systems independently" is complicated by vacuum entanglement and Reeh-Schlieder-type theorems, which suggest strict independence might be impossible even without retrocausality. If Preparation Independence is physically impossible in our best theory (QFT) for reasons unrelated to retrocausality, the PBR conclusion might be undermined more deeply than your retrocausal move suggests. I flag this because it is an active area of research and not settled dogma.

  ***

  ### Questions for the Next Argument

  To move past the impasse, do not ask her to accept metaphysics. Ask her about the cost of her assumptions.

  1.  "You accept Preparation Independence to prove $\psi$ is real. But if we move to Quantum Field Theory, where vacuum correlations make strict independence difficult to define, does the PBR conclusion still hold, or does the framework break down?"
  2.  "You say QBism refuses to do metaphysics. But if the Ontological Models Framework forces us to choose between many worlds or hidden variables, and both have high metaphysical costs, isn't 'refusing the framework' a rational methodological choice rather than a failure of nerve?"
  3.  "If retrocausality preserves the reality of the wavefunction without branching worlds or hidden particles, why is the violation of Preparation Independence via the future less 'respectable' than the violation of locality via non-separable states in Everett?"
