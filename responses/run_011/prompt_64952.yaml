  7.  **Final Judgment:**
      *   Is the vocabulary missing something? Yes. It lacks *introspective logical consistency*. Software verification is mostly *model-based* (System vs. Model), not *self-referential* (System reasoning about System).
      *   Is the claim less alarming? Yes. In practice, we never assume the test suite proves truth. We assume it catches regressions. We trust the human. The "collapse" only happens if you demand *absolute formal self-justification*, which no engineer actually does.
