      *   **User Profile:** High school senior, extensive practical software engineering experience (15k LOC project, CI/CD, testing, type checking, code review). No formal logic training but familiar with popular Gödel/Löb concepts.
      *   **Core Task:** Translate Löb's Theorem and its implications for self-improving AI (specifically regarding self-trust and successor agents) into the vocabulary of software verification/QA.
      *   **Specific Constraints:**
