      *   *Who Checks the Checker:* The "Trusted Computing Base" (TCB). In logic, this is the meta-system. In software, it's the human + hardware. Löb says you can't close the loop *within the same system*. Software admits this: we stop at the human. So the "obstacle" is exactly about closing the loop. The layered picture *can* state it: "The TCB is outside the verification scope."

