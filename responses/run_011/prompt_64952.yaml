      *   *Wait, actually:* The AI safety context is about an *agent* making decisions based on proofs. A software build system doesn't make decisions based on proofs of its own soundness; it just runs.
      *   *Key Insight:* The user's vocabulary is *engineering*, Löb is *math*. Engineering accepts "good enough" and external trust. Math demands closure. The translation fails because the engineering vocabulary *excludes* the premise required for Löb (total self-containment).
