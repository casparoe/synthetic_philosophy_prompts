answer: |-
  When the ember rests upon the fleece, the consequent burning is merely known by habit alone,
  No virtue flows from fire to flax; the observed blackening is shown by habit alone.

  The philosophers posit a nature that acts, claiming a causal power within the frame,
  But the Agent of agents creates the effect, though the sequence is grown by habit alone.

  Ibn Rushd argues that if natural ties dissolve, then certain knowledge cannot stay,
  Yet we rely on Divine Promise, not on a necessary chain sown by habit alone.

  The empiricist watches the flame where the heated particles meet in the light,
  But he witnesses only the 'when', never the 'why', though the pattern is known by habit alone.

  The mind expects the ash, yet the logical possibility remains open today,
  For the miracle breaks the customary stream that has flown by habit alone.

  Ghazali signs this verse, noting the Divine habit might cease without an end,
  The cotton might escape the flame, though the usual path is foreknown by habit alone.

  ***

  **Note on Liberties and Interpretation**

  The refrain "by habit alone" commits the poem to the standard occasionalist reading of the *Tahāfut*, wherein God is the sole agent and created things lack inherent efficacy. This sidesteps the contested scholarly interpretation (e.g., by Griffel or Marmura) that al-Ghazālī allows for genuine secondary causes within a theological framework, treating "habit" as a description of stable created natures rather than a denial of them. The poem flirts with a Humean regularity theory by emphasizing sequence over connection, but diverges crucially by grounding the regularity in Divine Will (*'ādah*) rather than psychological expectation. A Humean sees habit in the mind; al-Ghazālī locates it in God's consistent practice. I would reconsider this framing if textual evidence from the *Iqtisād* or later works suggested al-Ghazālī affirmed inherent powers (*quwa*) in nature rather than mere temporal succession created moment-to-moment. The poem prioritizes the *Tahāfut*'s dialectical destruction of necessity over his constructive theology, potentially flattening his nuanced position on acquisition (*kasb*).
