answer: |-
  Your reconstruction of Harsanyi's aggregation theorem and your inference regarding prioritarianism are correct, provided you are referring to **ex-post prioritarianism** (the standard formulation in welfare economics where the concave transformation is applied to outcomes before expectations are taken).

  Here are the direct answers to your two questions.

  ### 1. The Unanimity-Violating Verdicts

  You have not managed to construct a case because you may be looking for a conflict over certain outcomes rather than a conflict over **risk**. The violation of the unanimity (Pareto) principle by prioritarianism is not a curiosity; it is a systematic feature arising from the divergence between individual risk attitudes and social risk attitudes.

  In Harsanyi's framework, individual vNM utilities represent risk-neutral attitudes over *utility* itself (by definition, individuals maximize expected utility). However, a prioritarian social welfare function applies a concave transformation to that utility, making the social planner **risk-averse over individual utility**. Consequently, the social planner will reject gambles that every individual accepts.

  **The Example**
  Consider a society of two individuals ($i=1, 2$) and two prospects, $A$ and $B$. Let individual well-being be measured in vNM utils.
  Let the prioritarian transformation be $g(u) = \sqrt{u}$.

  *   **Prospect B (Safe):**
      *   State 1 (Probability 1): Individual 1 gets 4 utils, Individual 2 gets 4 utils.
      *   **Individual Evaluation:** $E[u_1] = 4$, $E[u_2] = 4$.
      *   **Social Evaluation:** $E[\sum \sqrt{u_i}] = \sqrt{4} + \sqrt{4} = 4$.

  *   **Prospect A (Risky):**
      *   State 1 (Probability 0.5): Individual 1 gets 9 utils, Individual 2 gets 9 utils.
      *   State 2 (Probability 0.5): Individual 1 gets 0 utils, Individual 2 gets 0 utils.
      *   **Individual Evaluation:** $E[u_1] = 4.5$, $E[u_2] = 4.5$.
      *   **Social Evaluation:** $0.5 \times (\sqrt{9} + \sqrt{9}) + 0.5 \times (\sqrt{0} + \sqrt{0}) = 0.5(6) + 0 = 3$.

  **The Verdict:**
  1.  **Unanimity:** Every individual prefers Prospect A to Prospect B ($4.5 > 4$).
  2.  **Prioritarianism:** Society prefers Prospect B to Prospect A ($4 > 3$).

  **Is this damaging?**
  This is a **pattern**, not a curiosity. It occurs whenever the social planner's implied risk aversion (via the concave $g$) exceeds the individuals' risk aversion (which is zero over utility space).
  *   **The Damage:** From a liberal or libertarian welfare-economic perspective, this is severely damaging. It implies **paternalism over risk**: the social planner overrides the unanimous risk judgments of the affected individuals. It violates the principle that individuals are the best judges of their own interest under uncertainty.
  *   **The Prioritarian Defense:** Prioritarians typically argue that vNM utility conflates "well-being" with "attitude toward risk." They argue the concave function $g$ should apply to a cardinal measure of well-being that is distinct from the vNM index used to gauge individual preference. However, if you accept the premises of Harsanyi's theorem (that $u_i$ is the vNM index representing individual good), the violation of Ex-Ante Pareto is inescapable for ex-post prioritarianism.

  *(Note: If one adopts **ex-ante prioritarianism**, ranking prospects by $\sum g(E[u_i])$, the Pareto principle is satisfied. However, this view violates the premise that the social ranking is vNM-representable, as the function is non-linear in probabilities. One premise must break; ex-post breaks Pareto, ex-ante breaks Social vNM Rationality.)*

  ### 2. Reconciliation with Arrow's Theorem

  The reconciliation between Harsanyi's result and Arrow's Impossibility Theorem demands **two** distinct departures from Arrow's assumptions, not just one.

  1.  **Cardinality:** As you suspected, Harsanyi assumes preferences are representable by cardinal vNM utility functions, whereas Arrow assumes only ordinal preference orderings. This allows Harsanyi to bypass the restriction that prevents summing utilities.
  2.  **Interpersonal Comparability:** This is the equally critical assumption. Arrow's theorem assumes **ordinal non-comparability** (the social planner cannot compare the intensity of well-being across persons). Harsanyi's aggregation theorem, to yield a specific weighted sum (and specifically an unweighted sum via anonymity), requires **unit comparability**. Without the assumption that a "unit" of utility for Person 1 is equivalent to a "unit" of utility for Person 2, the summation $\sum u_i$ is mathematically arbitrary (sensitive to the affine scaling of each individual's function).

  **Direct Answer:** The sole reason is **not** just cardinality. The reconciliation demands **cardinal utilities plus interpersonal unit comparability**. Arrow's impossibility holds even for cardinal utilities if they are not interpersonally comparable. Harsanyi's theorem is possible because it enriches the informational basis of the social welfare function to include comparable cardinal measurements.
