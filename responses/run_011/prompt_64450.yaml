answer: |-
  **MEMORANDUM**

  **TO:** Members of the Academic Integrity Board
  **FROM:** Chair, Academic Integrity Board
  **DATE:** Monday, October 23
  **SUBJECT:** Recommendation and Policy Proposal Regarding Case [Redacted] and Article IV.3

  **I. Purpose and Disposition**

  We resume hearings on Tuesday with the panel deadlocked three to three. The stalemate stems not from a disagreement about the facts, but from a disagreement about what Article IV.3 demands. We have two submitted texts that are materially indiscernible, including shared idiosyncratic errors. We also have two distinct causal histories of production (revision logs and handwritten drafts) that appear independent.

  To break the deadlock and allow the Board to function, I am circulating the following recommendation for a vote.

  **Recommendation:** I recommend we find the students **Not Responsible** for the specific charge of *impermissible collaboration* under the current wording of Article IV.3.

  **Rationale:** The Article establishes a presumption that shifts the burden of production to the students. It does not establish a conclusive mandate of guilt. Both students have met the burden of explaining the *genesis* of their work. They have demonstrated that their texts were generated independently, even if they cannot explain the *convergence* of the content. Under the current code, "explanation" refers to the origin of the work, not the resolution of statistical anomalies. To find them responsible would require us to treat the presumption as irrebuttable, which the text does not support.

  However, this acquittal is contingent on an immediate revision of our policies. The current situation exposes a vulnerability: our code conflates *collaboration* (student-to-student) with *common source* (student-to-third-party). While I recommend acquittal on collaboration, the identical typographical errors suggest a shared external source (e.g., a leaked file, a contract cheating service, or generative AI). I will refer this matter to the Dean of Faculty for investigation under "Unauthorized Aid" if such a distinct charge exists, but for this Board, the charge of collaboration has not been sustained.

  **II. Interpreting Article IV.3: Metaphysics vs. Probability**

  The division on this panel turns on how we read the presumption clause: *"Where two submitted works are substantively identical, the Board shall presume that the identity arises from impermissible collaboration."*

  Faction One reads this as a substantive rule of liability: Identity equals Guilt, unless the impossible is explained. Faction Two reads this as an evidentiary shortcut: Identity suggests Guilt, unless a credible alternative origin is shown.

  I argue we must adopt the latter. The presumption is **probabilistic**, not metaphysical. It relies on the empirical observation that independent human writers rarely produce identical strings of 412 words, let alone identical errors. It is a heuristic designed to spare the Board from investigating every coincidence. It is not an ontological claim that two identical texts *must* be the same object (the "One Text" theory).

  This brings us to the intervention regarding Max Black's "Two Spheres." The philosopher on our panel suggested that just as two iron spheres can be distinct despite being qualitatively identical, two texts can be distinct despite being verbatim matches. I initially found this alarming, fearing it would dismantle the basis of all plagiarism detection. Upon reflection, the analogy is flawed but instructive.

  Black's spheres are stipulated entities in a vacuum. Texts are **traces of causal processes**. When we judge integrity, we are not judging the text as an artifact; we are judging the *action* of writing. If we have evidence that the causal processes were distinct (separate drafting sessions, no digital footprint connecting them), the probabilistic inference of collaboration collapses. The "Two Spheres" argument fails because texts are not defined by their properties alone, but by their history. However, it succeeds in reminding us that qualitative identity does not prove numerical identity of *origin*. If the histories are distinct, the texts are distinct acts, even if the output is identical.

  **III. The "Cheap Defense" and Standard of Proof**

  I must address the strongest argument against this recommendation, advanced by Faction One: *If process evidence (drafts, logs) can rebut the presumption of identical text, have we not made the presumption worthless?*

  Any student caught copying can now claim, "I wrote it independently," and produce a fabricated revision history or a transcribed notebook. This defense is cheap, largely unfalsifiable, and available to every actual copier. If we accept it here, we degrade the deterrent force of the Integrity Code. Furthermore, asking faculty to weigh the probability of independent generation against the probability of fabricated drafts asks us to perform forensic analysis we are not trained to do.

  This is a valid concern. It is the reason I recommend we acquit *only* under the current, ambiguous code, and immediately adopt the stricter standards below. We cannot allow the "Process Defense" to become a loophole. To rebut the presumption of identity, the evidence of independent genesis must be robust.

  **IV. Proposal for Policy Revision**

  To resolve this tension for future boards, I propose we amend Article IV.3 and adopt the following **Evidentiary Guidelines for Cases of Substantive Identity**. These guidelines are designed to satisfy Faction One's need for rigor and Faction Two's demand for due process.

  **1. Distinguish Collaboration from Common Source.**
  The Code must distinguish between *Collaboration* (students working together) and *Unauthorized Aid* (students using the same external source). Identical work with independent causal histories suggests the latter, not the former. A presumption of *collaboration* should be fully rebuttable by evidence of physical/digital separation. A presumption of *plagiarism from a common source* should remain if the work matches a known repository or AI output.

  **2. Define "Explanation" as "Process Integrity."**
  Merely producing a draft is insufficient. To rebut the presumption of identity, a student must demonstrate **Process Integrity**.
  *   **Digital Submissions:** Must include granular version history (keystroke dynamics, timestamps over days) showing the *evolution* of the text, including the introduction of errors. A final file with a created date is insufficient.
  *   **Handwritten Drafts:** Must show conceptual evolution (cross-outs, reordering), not merely a clean transcription. A notebook entry that matches the final submission verbatim is evidence of transcription, not composition.

  **3. The "Shared Error" Standard.**
  Where identity includes shared idiosyncratic errors (typos, unique phrasing), the burden of explanation is higher. Independent writers may coincidentally share ideas; they do not coincidentally share mistakes. In cases of shared error, process evidence must be corroborated by external data (e.g., library logs, witness testimony, wifi authentication) to be considered sufficient.

  **4. The "Symmetric Evidence" Tie-Breaker.**
  In cases where both students provide symmetric, credible process evidence (as in this case), and no connection can be found:
  *   The Board shall find **Not Responsible** for Collaboration.
  *   The Board shall file a **Report of Anomaly** to the Dean.
  *   **Rationale:** It is preferable to acquit two students in a rare statistical anomaly than to sanction two students based on a presumption that has been affirmatively rebutted by process evidence. The integrity of the sanctioning process depends on our willingness to accept uncertainty rather than punish mystery.

  **V. Conclusion**

  This case is "unusually clean" precisely because it strips away the usual messiness of collusion (chat logs, witness testimony) and leaves us with the raw conflict between statistical probability and documented process.

  If we vote to sanction, we assert that statistical impossibility trumps documented reality. If we vote to acquit, we assert that documented process trumps statistical improbability. I argue we must choose the latter to remain an educational body rather than a tribunal of algorithmic enforcement. However, we must simultaneously close the door on fabricated defenses by raising the standard of what counts as "process."

  I ask that you review this framework before Tuesday. My goal is that we might vote unanimously on the disposition, and unanimously on the reform. We cannot leave Article IV.3 as it stands; it asks us to make metaphysical judgments with probabilistic tools. Let us equip the next Board with clearer criteria.

  I look forward to our discussion.
