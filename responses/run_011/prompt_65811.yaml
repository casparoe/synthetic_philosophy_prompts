answer: |-
  # The Chance-Deference Sorting Instrument

  **Instructions for the Facilitator:**
  Read each Node aloud. Participants record their choice (a, b, or c). Do not reveal what each option implies until the end. After all eight nodes are complete, use the Scoring Key to classify each participant.

  **Starting Commitment:** All participants agree to the premise: *"There are such things as chances, and learning one should normally move your credence."* (Those who reject this entirely are already out of the group).

  ---

  ### Node 1: The Baseline Coin
  A coin is about to be tossed. You are told the objective chance of Heads is exactly 0.5. You have no other information.
  *   **1a.** I set my credence to 0.5.
  *   **1b.** I set my credence to 0.5, but only because I assume the coin is physically symmetric.
  *   **1c.** I refuse to set a credence based solely on chance; I need frequency data.

  ### Node 2: The Past Toss
  A coin was tossed one hour ago and landed in a sealed box. You are told the objective chance of Heads *at the time of the toss* was 0.5. The result is unknown to you.
  *   **2a.** My credence in Heads is 0.5.
  *   **2b.** My credence is 0 or 1; the chance is no longer 0.5 now that it's over.
  *   **2c.** My credence depends on my physical evidence about the box, not the past chance.

  ### Node 3: The Oracle (Inadmissible Evidence)
  A coin is about to be tossed. The objective chance of Heads is 0.5. A perfectly reliable Oracle whispers to you: "The result will be Heads."
  *   **3a.** My credence is 1.0. (Evidence trumps chance).
  *   **3b.** My credence is 0.5. (Chance trumps evidence).
  *   **3c.** The scenario is impossible; if the Oracle is reliable, the chance wasn't 0.5.

  ### Node 4: The Uncertain Chance (Averaging)
  You are 60% confident the chance of Heads is 0.5. You are 40% confident the chance of Heads is 0.25. You have no other evidence.
  *   **4a.** My credence is 0.4. (Weighted average: $0.6 \times 0.5 + 0.4 \times 0.25$).
  *   **4b.** My credence is 0.5. (I defer to the highest candidate chance).
  *   **4c.** My credence is 0.25. (I defer to the most conservative chance).

  ### Node 5: The Clockwork World (Metaphysics Split 1)
  Suppose our universe is fundamentally deterministic (no physical indeterminacy). A coin is tossed.
  *   **5a.** The chance of Heads is 0 or 1, even if we don't know which.
  *   **5b.** The chance of Heads can still be 0.5 (e.g., based on symmetry or typicality).
  *   **5c.** There are no chances in this world, only credences.

  ### Node 6: The Multiverse (Metaphysics Split 2)
  Suppose the Everettian (Many-Worlds) interpretation of quantum mechanics is true. A measurement has branch weight 0.5 for "Up".
  *   **6a.** The chance of "Up" is 0.5. (Weights play the chance role).
  *   **6b.** There is no chance of "Up"; both outcomes happen.
  *   **6c.** The chance is 1.0 for the superposition, undefined for branches.

  ### Node 7: The Norm's Source (Metaphysics Split 3)
  Why do you align your credence with the chance when you have no defeating evidence?
  *   **7a.** It is part of the definition of "chance." (Analytic).
  *   **7b.** It maximizes accuracy or expected payout. (Substantive).
  *   **7c.** It is a linguistic rule that makes no claim about the world. (Deflationary).

  ### Node 8: The Admissibility Line
  Can we draw a precise, principled line between "admissible" evidence (which allows deference) and "inadmissible" evidence (which overrides it)?
  *   **8a.** Yes, there is a clear boundary (e.g., no future facts).
  *   **8b.** No, the line is vague or context-dependent.
  *   **8c.** All evidence is admissible; the principle must be conditionalized on total evidence.

  ---

  ## Scoring Key

  Map the participant's answer string (e.g., 1a, 2b, 3c...) to the following leaves. **Priority Rule:** If a participant qualifies for multiple leaves, choose the one listed earliest here.

  ### **Leaf 1: The Radical Subjectivist**
  *   **Path:** Any **1c** OR **5c**.
  *   **Description:** Denies the starting commitment in practice. For them, "chance" is just a name for idealized credence. There is no deference norm because there is nothing to defer *to*.
  *   **Note:** Technically violates the starting commitment, but this node catches those who slip back into it.

  ### **Leaf 2: The Hard Determinist**
  *   **Path:** **5a** (and not 1c).
  *   **Description:** Believes non-trivial chances are incompatible with determinism. The Principal Principle is vacuous in our world if our world is deterministic.
  *   **Empty Cell Diagnosis:** The combination **5a** (Determinist) + **2a** (Past Chance 0.5) is logically tense. If chances are 0/1, past chances should be 0/1. If they pick 5a and 2a, they are **Temporal Inconsistents**: they think determinism kills chance now but not in the past.

  ### **Leaf 3: The Everettian**
  *   **Path:** **6a** (and not 5a).
  *   **Description:** Accepts branch weights as fulfilling the functional role of chance. Deference is to the measure of branches, not single outcomes.
  *   **Note:** Distinct from Subjectivist because they treat weights as objective features of the wavefunction.

  ### **Leaf 4: The New-Principler (Lewisian)**
  *   **Path:** **3a** (Credence 1.0 on Oracle).
  *   **Description:** Accepts the Principal Principle but acknowledges it fails when evidence is inadmissible. The norm is: $C(A | Ch(A)=x \land E) = x$ *only if E is admissible*. Since the Oracle is inadmissible, deference is suspended.
  *   **Metaphysics/Behavior Split:** This node separates the **Philosophers** (who often pick 3a) from the **Statisticians** (who often pick 3b). The Statistician trusts the model (Chance) over the "black box" (Oracle); the Philosopher trusts the logical implication of "Perfect Evidence."

  ### **Leaf 5: The Old-Principler (Strict)**
  *   **Path:** **3b** (Credence 0.5 on Oracle).
  *   **Description:** Holds that if the chance is 0.5, your credence must be 0.5, even against an Oracle. Usually argues that if the Oracle is right, the chance *must have been* 1.0, so the setup is contradictory.
  *   **Empty Cell Diagnosis:** The combination **3b** (Old Principle) + **7b** (Substantive/Betting Justification) is the **Martyr Cell**. It is coherent but unoccupied. Why would you follow a norm that guarantees you lose money against a reliable Oracle? Usually, Old-Principlers justify their view Analytically (7a): they claim it is *impossible* to have that evidence if the chance is 0.5.

  ### **Leaf 6: The Admissibility Skeptic**
  *   **Path:** **8b** (No clear line).
  *   **Description:** Believes the distinction between admissible and inadmissible evidence is vague. The Principal Principle is indeterminate in hard cases.
  *   **Note:** Often overlaps with New-Principlers, but more pessimistic about formalizing the exception.

  ### **Leaf 7: The Definitionalist**
  *   **Path:** **7a** (Definition).
  *   **Description:** Treats the Principal Principle as analytic. It is part of what the word "chance" *means*. To know the chance just is to know what to believe.
  *   **Indistinguishability Flag:** This leaf is behaviorally identical to **Leaf 8 (Deflationist)** on all betting cases. Both pick 7a/7c equivalents. The difference is metaphysical: The Definitionalist thinks the definition latches onto a real feature of the world; the Deflationist thinks it's just a rule of talk. The tree cannot separate them.

  ### **Leaf 8: The Deflationist**
  *   **Path:** **7c** (Linguistic/No worldly claim).
  *   **Description:** Denies that the Principal Principle describes a relationship between two distinct worldly things (chance and mind). It is a rule of language.
  *   **Indistinguishability Flag:** See Leaf 7. To separate these, you need a metaphysical interrogation, not a deference quiz.

  ### **Leaf 9: The Pragmatist (Substantive)**
  *   **Path:** **7b** (Accuracy/Bets).
  *   **Description:** Treats the Principal Principle as a substantive norm that needs justification (e.g., it minimizes Brier scores). It could have been otherwise.
  *   **Metaphysics/Behavior Split:** This node reveals that **Statisticians** and **Philosophers** can make the same bets (Leaf 9 vs Leaf 7) but for entirely different reasons. The Statistician often views probability as a tool for calibration (7b); the Philosopher often views it as a conceptual truth (7a).

  ---

  ## Facilitator Notes on Splits

  **1. Node 5 (The Clockwork World): Metaphysics vs. Practice**
  *   **The Split:** Many Statisticians/ML researchers will choose **5b** (Chance can be 0.5 in a deterministic world) because they treat probability as a modeling tool. Many Metaphysicians will choose **5a** (Chance must be 0 or 1) because they treat probability as a physical property.
  *   **The Lesson:** This shows the Stat people that they are committed to a "Compatibilist" metaphysics of chance, even if they don't call it that.

  **2. Node 3 (The Oracle): Theory vs. Intuition**
  *   **The Split:** Philosophers trained on Lewis often choose **3a** (Credence 1.0), accepting the "New Principle." Statisticians often choose **3b** (Credence 0.5), trusting the model parameter over the "magic" input.
  *   **The Lesson:** This shows the Phil people that their "New Principle" is not a universal intuition; it is a specific theoretical commitment that overrides standard model trust.

  **3. Node 7 (The Norm's Source): Concept vs. Tool**
  *   **The Split:** Participants who agree on every bet (Leaf 7 vs Leaf 9) may diverge here. One thinks deference is *true by definition*, the other thinks it is *useful by design*.
  *   **The Lesson:** This shows both groups that their agreement on numbers hides a disagreement on why the numbers matter.

  ## Unoccupied/Problematic Cells

  *   **The Martyr (3b + 7b):** As noted in Leaf 5, claiming you would bet 0.5 against a known Oracle *because it pays off better* is incoherent. This cell should be empty. If occupied, the participant is confused about expected utility.
  *   **The Temporal Inconsistent (5a + 2a):** Claiming determinism kills chance now (5a) but past chances were 0.5 (2a). This implies chances vanish retroactively or that "past chance" means something different than "current chance of a past event." Diagnose as **Conceptual Slippage**.

  ## Indistinguishable Leaves

  *   **Leaf 7 (Definitionalist) vs. Leaf 8 (Deflationist):**
      *   **Why:** Both treat the Principal Principle as a rule of language/definition rather than an empirical discovery. Both will answer the betting cases identically.
      *   **Flag:** The tree cannot separate these. To distinguish them, you must ask: *"If we discovered the world didn't contain properties that fit this definition, would you say chance doesn't exist, or that our definition was wrong?"* The Definitionalist says chance doesn't exist; the Deflationist says the definition was just a tool.
