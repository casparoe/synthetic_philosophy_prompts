answer: |-
  ### Block 1: Stating the Model

  1.  Jaspers puts political guilt on citizens jointly, but you put liability on the state alone; are you revising his model to fix it, or just borrowing his vocabulary for a corporate debt scheme?

  2.  Jaspers keeps metaphysical guilt for solidarity failures; does your precise legal model leave any room for that, or is it discarded as imprecise sentiment?

  3.  You reject grounding this in benefits received, but isn't the strongest benefit argument that infrastructure built on injustice still supports us today? Why is that insufficient to ground direct citizen liability?

  ### Block 2: Hard Cases

  4.  If citizens are just conduits, a punished resistor pays the same reparations as a collaborator; what does your model track that distinguishes their moral positions if the financial obligation is identical?
      *   **[Predicted Answer]:** She will say liability is non-punitive debt, so the citizen's moral status is irrelevant to the bill.
      *   **[Follow-up]:** Then why frame this as political justice rather than mere debt collection?

  5.  You rely on state continuity, but states dissolve or split; take the postwar Germanys where the West claimed continuity and the East claimed to be a new anti-fascist state—which one was right on your view, and what fact settles it?

  6.  If obligations ride on legal continuity, what stops a regime from dissolving itself and creating successor states that inherit nothing to wash away the debt?
      *   **[Predicted Answer]:** She will say international law recognizes successor states and blocks fraudulent conveyance.
      *   **[Follow-up]:** But if states write those laws, what stops them from rewriting continuity rules to escape debt?

  ### Block 3: What the View Costs Her

  7.  Consider descendants of victims who are now citizens of the perpetrator state; are they conduits paying themselves, and does that collapse the distinction between debtor and creditor?

  8.  If the state is just a legal shell and citizens are innocent conduits, doesn't an official apology express nothing because no moral agent is actually owning the wrong?

  9.  You say this solves the clean hands objection, but does it do so by making the obligation so impersonal that it no longer functions as a form of justice for the victims?
