      *   **Practical Advice/Conclusion:**
          *   Stop rating the motives.
          *   Accept the "impure" motives.
          *   Focus on the *work*, not the *why*.
          *   The donation dilemma: Keep the donation. The money helps regardless of the ego boost.

  5.  **Refining the Tone:**
      *   Avoid jargon like "deontology" or "utilitarianism" unless explained simply.
