answer: |-
  ### Preamble: Shifting from Metaphysics to Risk and Justice

  The therapy/enhancement distinction fails because "normal function" is a statistical average, not a moral boundary (Daniels, 2000). A resident on night shift is statistically "abnormal" (sleep-deprived) but functionally required to be there. A child below the 50th percentile is "normal" but academically disadvantaged. Your committee's inconsistency arises because you are trying to adjudicate *ontology* (what is this?) rather than *ethics* (what does this do?).

  This procedure abandons the therapy/enhancement label. It substitutes three load-bearing pillars that survive contact with practice:
  1.  **Risk Ceiling:** Healthy volunteers cannot be exposed to more than minimal risk unless there is direct therapeutic benefit (which, by definition, they lack).
  2.  **Coercion/Context:** "Voluntary" consent is compromised when performance is tied to employment or academic standing.
  3.  **Positional Harm:** Interventions are ethically distinct when the benefit relies on others *not* having access (zero-sum goods).

  **Authenticity and "Open Future"** are excluded from this procedure. A protocol document cannot evidence a violation of authenticity. These concerns must be converted into **Long-Term Unknown Risk**. If the long-term impact on development or identity is unknown, the risk is not "minimal."

  ---

  ### The Healthy Volunteer Risk & Justice Procedure (HVRJ)

  **Time:** 45 Minutes | **Quorum:** 7 Members | **Chair:** Facilitates, does not vote unless tied.

  **Step 1: Scientific Validity & Safety (10 mins)**
  *   **Question:** Is the methodology sound and are acute physical risks characterized?
  *   **Sufficient Answer:** Statistician and Physician confirm power analysis and adverse event monitoring are adequate.
  *   **If No:** **DEFER** (Name missing data: e.g., "Power analysis," "AE monitoring plan").
  *   **If Yes:** Proceed to Step 2.

  **Step 2: The Risk Ceiling (10 mins)**
  *   **Question:** Does the intervention exceed "Minimal Risk" for a healthy population? (Minimal Risk = probability/harm not greater than daily life or routine exams).
  *   **Sufficient Answer:** Pharmacist/Physician classify risk. *Note: Invasive procedures (implants, injections) in healthy volunteers are presumptively > Minimal Risk.*
  *   **If > Minimal Risk:** **REJECT**. (Healthy volunteers cannot bear high risk for non-therapeutic gain).
  *   **If ≤ Minimal Risk:** Proceed to Step 3.

  **Step 3: Coercion & Power Dynamics (10 mins)**
  *   **Question:** Is participation linked, explicitly or implicitly, to employment, academic standing, or rostering?
  *   **Sufficient Answer:** Review recruitment materials and investigator affiliation.
  *   **If Yes (Link exists):** Can the link be severed by protocol amendment (e.g., third-party recruitment, no data to employer)?
      *   **If No:** **REJECT** (Undue Influence).
      *   **If Yes:** **APPROVE-WITH-CONDITIONS** (Mandate severance).
  *   **If No (No link):** Proceed to Step 4.

  **Step 4: Positional/Competitive Goods (10 mins)**
  *   **Question:** Is the primary outcome a "zero-sum" advantage (e.g., ranking, grades, combat readiness) where one participant's gain implies another's loss?
  *   **Sufficient Answer:** Review outcome measures. *Judgment Call: Distinguish "Safety-Critical Performance" (e.g., surgeon error reduction) from "Competitive Performance" (e.g., test scores).*
  *   **If Competitive (Zero-Sum):** **REFER** (This is an institutional value question regarding fairness).
  *   **If Safety-Critical or Non-Competitive:** Proceed to Step 5.

  **Step 5: Institutional Mission (5 mins)**
  *   **Question:** Does this research align with the Academic Medical Center's mission (health, education, patient care)?
  *   **Sufficient Answer:** Chair assesses alignment. *Judgment Call: Defense/Commercial vigilance may not align.*
  *   **If Misaligned:** **REFER** (To Board).
  *   **If Aligned:** **APPROVE**.

  ---

  ### Minutes Justification Template (Max 300 Words)

  *Copy and paste the relevant paragraph based on the terminal Step.*

  **For APPROVE:**
  "The Committee approved this protocol. The intervention presents no more than minimal risk to healthy volunteers. Recruitment procedures ensure voluntariness without employment or academic coercion. The outcome measures reflect safety-critical performance or non-competitive health metrics, consistent with the AMC's mission to improve human function within clinical norms. Long-term follow-up is adequate to monitor for developmental or latent effects."

  **For APPROVE-WITH-CONDITIONS:**
  "Approval is contingent on the following amendments: [Insert Conditions]. While the risk profile is acceptable, the Committee identified potential undue influence due to [Employment/Academic] relationships. The protocol must be amended to [Insert Severance Mechanism]. Once confirmed, the study aligns with safety-critical performance goals without compromising volunteer autonomy."

  **For DEFER:**
  "The Committee cannot rule on this protocol due to missing information regarding: [Insert Missing Fact, e.g., 'Long-term adverse event monitoring plan']. Specifically, the risk classification for healthy volunteers depends on this data. Please resubmit with the required documentation. No ethical judgment on the intervention itself is implied by this deferral."

  **For REFER:**
  "The Committee refers this matter to the Institutional Board. While the scientific and safety parameters are [acceptable/unacceptable], the protocol raises a question of institutional values regarding [Positional Goods/Mission Alignment]. Specifically, the creation of [Competitive Advantage/Non-Clinical Capability] falls outside the Committee's remit to assess risk and requires a broader policy decision on the AMC's role in [Specific Context]."

  **For REJECT:**
  "The Committee rejected this protocol. The intervention presents more than minimal risk to healthy volunteers without the possibility of direct therapeutic benefit. [Optional: Additionally, recruitment methods create unacceptable undue influence / The intervention targets competitive goods inconsistent with institutional mission]. Under current ethical guidelines, healthy volunteers may not be exposed to [Specific Risk] solely for [Specific Non-Therapeutic Goal]."

  ---

  ### Grounding in the Literature

  1.  **Normal-Functioning Baselines:** The literature (Daniels, "Normal Functioning") admits baselines are contested. This procedure bypasses the definition by using **Risk** as the proxy. If you are healthy, your risk tolerance drops. We do not ask "Is this normal?" We ask "Is this safe for someone who doesn't need it?"
  2.  **Prevention:** Prevention inherits therapy's permissibility *only* if the risk of the condition is elevated (e.g., vaccines for travelers). If the risk is baseline (e.g., jet lag in crew), it is treated as Enhancement (Healthy Volunteer Track).
  3.  **Positional Goods:** This distinction (Sandberg, "The Ethics of Cognitive Enhancement") survives practice. Safety-critical improvements (surgeon steady hand) are public goods; competitive improvements (better test scores) are private goods that generate inequality. The procedure splits here (Step 4).
  4.  **Authenticity/Open Future:** These are unanswerable from a protocol. A reviewer cannot measure "authenticity." The procedure converts this to **Long-Term Unknown Risk**. If the protocol lacks long-term follow-up for a developmental population, the risk is undefined, triggering Step 2 failure.

  ---

  ### Case Applications

  **(a) Working-Memory App (Healthy Children, Academic Test, Consumer Sponsor)**
  *   **Step 1:** Valid.
  *   **Step 2:** Risk is Minimal (App-based). Pass.
  *   **Step 3:** Coercion? Parents worried about academic standing implies pressure. Recruitment via schools creates implicit link. Can it be severed? Unlikely if outcome is academic test. **REJECT** (Undue Influence/Coercion).
  *   *Note:* Your committee rejected this. The procedure aligns.

  **(b) Jet-Lag Drug (Healthy Airline Crew)**
  *   **Step 1:** Valid.
  *   **Step 2:** Risk? Drug side effects in healthy crew. Likely > Minimal Risk (systemic drug vs. placebo). **REJECT**.
  *   *Alternative Path:* If deemed Minimal Risk (e.g., melatonin-like profile):
  *   **Step 3:** Coercion? Employment rostering. **REJECT** or **CONDITIONS**.
  *   **Step 4:** Positional? No, it's safety/comfort.
  *   **Step 5:** Mission? AMC role in occupational health? **REFER**.
  *   *Outcome:* Given the split vote historically, this procedure likely forces a **REFER** (Mission/Values) or **REJECT** (Risk). It resolves the split by forcing a categorization.

  **(c) Implanted Neural Stimulation (Healthy Adults, Vigilance, Defense Funding)**
  *   **Step 1:** Valid (Excellent consent/follow-up).
  *   **Step 2:** Risk? **Implanted device** in healthy volunteers. This is surgically invasive. It exceeds "Minimal Risk" (routine exams/daily life).
  *   **Decision:** **REJECT**.
  *   *Reasoning:* No amount of consent quality lowers the objective risk profile of neurosurgery in a non-therapeutic context.
  *   *Blind Spot:* This procedure cannot see "National Security Necessity." If the defense need is existential, "Minimal Risk" rules might be viewed as bureaucratic obstacles. The procedure treats the volunteer as a private citizen, not a soldier. To see this, you would need a "National Security Waiver" step, which an AMC HREC is likely not empowered to grant.

  ---

  ### Confidence Assessment

  **Confidence:** High on Steps 1, 2, and 3. These map to federal regulations (45 CFR 46) and established bioethical consensus on undue influence. The distinction between Safety-Critical and Competitive performance (Step 4) is supported by the "fair opportunity" framework in enhancement literature (Juengst).

  **Weakest Step:** **Step 4 (Positional/Competitive Goods).**
  *   **Why it might fail:** Distinguishing "Safety-Critical" from "Competitive" is a judgment call wearing the clothes of a rule. A surgeon's skill acquisition (Case 1 in your history) is safety-critical *for patients*, but competitive *for the surgeon's career*. A vigilance drug for defense (Case c) is safety-critical *for the mission*, but the volunteer is healthy.
  *   **Failure Mode:** Investigators will argue all performance enhancement is "safety-critical" (e.g., "A more vigilant citizen is a safer society"). If the Committee accepts this argument, Step 4 collapses, and all enhancement becomes permissible provided risk is low. The Chair must be briefed to reject "societal safety" arguments unless the participant's immediate task prevents direct harm (e.g., piloting a plane).

  Verdict: REJECT
