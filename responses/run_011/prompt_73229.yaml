answer: |-
  This is a sharp observation. You have put your finger on the exact friction point that keeps the Situationist Debate (Doris, Harman, Kamtekar, Snow, etc.) from ever actually resolving. You are right that standard labels like "moving the goalposts" or "cherry-picking" are too blunt. They imply bad faith or rule-breaking. What you are describing is more subtle: it is the tactical oscillation between two *legitimate* epistemic standards that are mutually exclusive in practice.

  Here is the breakdown of the concept, the name, the boundaries, and the verdict on who is more guilty.

  ### 1. The Name and Concept

  The closest existing rhetorical cousin is the **Motte-and-Bailey Doctrine**. In that fallacy, a proponent retreats to a defensible but boring position (the Motte) when attacked, but claims a stronger, controversial position (the Bailey) when on the offensive.

  However, your observation is more specific than a standard Motte-and-Bailey. In a standard Motte-and-Bailey, the Motte is usually a watered-down version of the Bailey. In the character debate, *both* standards are independently robust:
  1.  **The Statistical Standard:** Traits are probabilistic tendencies (Psychologically defensible).
  2.  **The Singular Standard:** Moral responsibility attaches to specific acts (Ethically defensible).

  The fallacy isn't retreating to a weaker claim; it is **unacknowledged context-switching between levels of analysis.**

  I propose we coin this **"The Dispositional Slide."**

  **Definition:** The Dispositional Slide occurs when an interlocutor treats a dispositional claim (like a character trait) as a *statistical aggregate* to deflect empirical counter-evidence, but treats the same claim as a *deterministic singular* to secure normative or predictive force, without acknowledging the shift in the unit of analysis.

  **Boundary Conditions (What counts vs. What doesn't):**
  *   **Counts as the Slide:** "You can't say I'm dishonest because I lied once; honesty is an average over time." (Defense). Followed later by: "You should trust him with the money because he is an honest person." (Offense/Prediction).
  *   **Does NOT Count:** Explicitly bridging the gap. "Honesty is a statistical tendency, which means we cannot predict any single act with certainty, but we assign responsibility based on the presumption of agency." This acknowledges the tension rather than hiding it.
  *   **Does NOT Count:** Domain-specific shifts. "Statistically, this drug works in 60% of cases, but for *this* patient, we need to know if it will work now." This is a valid problem of application, not a rhetorical slide, provided the uncertainty is admitted. The Slide requires the *uncertainty to be suppressed* when it becomes inconvenient.

  ### 2. Why Existing Terms Don't Fit

  *   **Moving the Goalposts:** This implies changing the criteria for victory mid-game. In the Dispositional Slide, the criteria (Average vs. Singular) are both present from the start; the player just chooses which goal to defend and which to attack.
  *   **Equivocation:** Usually refers to semantic ambiguity (e.g., "bank" of a river vs. "bank" for money). The Dispositional Slide is *methodological* equivocation. The word "trait" stays the same, but the *conditions for its verification and application* change.
  *   **Special Pleading:** This asks for an exception to a rule. The Slide argues that the *rule itself* changes depending on whether you are measuring the trait or using it.

  ### 3. The Verdict: Who Is More Guilty?

  You asked for a definite position. While both sides exhibit the pattern, **the Virtue Ethicists (Trait Defenders) are more guilty of the Dispositional Slide.**

  Here is the reasoning:

  **The Situationist's Asymmetry is Methodologically Consistent**
  The Situationist (e.g., John Doris) is operating largely within a falsificationist framework. Their claim is a negative universal: "Global cross-situational traits *do not exist*."
  *   **Offense:** If a trait is defined as "consistent behavior across diverse situations," a single robust counter-example (like the Good Samaritan study) *does* damage the claim of consistency. Treating a single study as decisive here is harsh, but it aligns with the logic of falsifying a universal claim.
  *   **Defense:** When a Trait Defender points to a study showing a correlation (e.g., .3), the Situationist says, "One study doesn't prove a global trait." This is also consistent. They are demanding a high bar of evidence for a strong claim (global consistency).
  *   **Verdict:** The Situationist is consistent in their skepticism. They demand high evidence for existence and accept low evidence for non-existence. That is standard skepticism, not necessarily a slide.

  **The Virtue Ethicist's Asymmetry is Structurally Necessary (and Fallacious)**
  The Virtue Ethicist (e.g., Rachana Kamtekar, Nancy Snow) is trying to save a concept that is empirically vulnerable but normatively essential. To do this, they *must* slide.
  *   **Defense (The Statistical Shield):** When hit with Situationist data (e.g., "People don't help when in a hurry"), they say, "Traits are tendencies, not guarantees. You have to look at the aggregate." This saves the trait from empirical falsification.
  *   **Offense (The Singular Sword):** When explaining why virtue matters, they cannot say, "Being virtuous means you'll do the right thing 60% of the time." Moral responsibility, praise, blame, and trust operate on the Singular Standard. We do not blame someone for a "statistical failure." We blame them for *this* lie. To make virtue ethics work, the trait must function as a reliable cause in the specific instance.
  *   **The Guilt:** The Virtue Ethicist uses the Statistical Standard to *exist* (ontological safety) and the Singular Standard to *matter* (normative force). If they stayed consistent with the Statistical Standard, they would have to admit that calling someone "honest" offers no guarantee in the critical moment, which gutted the normative power of virtue. If they stayed consistent with the Singular Standard, the Situationist data would destroy the trait's existence.
  *   **Conclusion:** The Situationist uses the switch to sharpen a critique. The Virtue Ethicist uses the switch to keep their theory alive. The latter is a deeper structural dependency on the fallacy.

  ### 4. Summary of the Phenomenon

  **Name:** The Dispositional Slide.
  **Mechanism:** Unacknowledged oscillation between *probabilistic ontology* (to survive data) and *deterministic normativity* (to survive relevance).
  **Primary Offender:** Virtue Ethicists.
  **Why:** Because the Situationist's position is robust enough to stand on skepticism alone, whereas the Virtue Ethicist's position collapses without the slide. They need the trait to be "fuzzy" enough to survive the phone booth experiment, but "sharp" enough to justify trusting a friend with a secret.

  The Situationist says: "The data shows the trait isn't there."
  The Virtue Ethicist says: "The data is noisy, the trait is an average." (Slide 1)
  The Virtue Ethicist adds: "But you should still trust the trait." (Slide 2)

  That is the slide. It is the attempt to have the empirical safety of a probability distribution with the moral utility of a causal guarantee.
