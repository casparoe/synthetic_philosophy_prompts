answer: |-
  This is a sharp observation, and you are right to sense that the political theory group dismissed it too easily. In the literature, this is often glossed over as "institutional path dependence," but normatively, it is a genuine inconsistency in how we define democratic legitimacy. You are looking for the underlying function of the vote in each context.

  Here is the reconstruction of the three practices, the location of the contradiction, and the cost of unification.

  ### 1. Reconstruction: What is the Vote Doing?

  Each practice presupposes a different theory of what an election *is*.

  **A. The Executive (Presidential/Runoff)**
  *   **The Theory:** *Authorization of an Agent.*
  *   **The Logic:** The executive is a unitary agent granted discretionary power to act on behalf of the whole polity. Because they will exercise judgment that cannot be fully specified in advance, they require explicit, positive consent from more than half the principals (voters) to avoid ruling as a minority faction.
  *   **The Legitimacy Condition:** *Ex-ante Majority.* The coalition must be formed *before* power is granted. A runoff forces the winner to bargain for a majority prior to inauguration.
  *   **Why Plurality Fails:** A president elected on 38% is viewed as an agent hired by a minority to manage the assets of the majority. This creates a "principal-agent" legitimacy deficit.

  **B. The Legislature (Single-Member Plurality)**
  *   **The Theory:** *Aggregation of Interests.*
  *   **The Logic:** The legislature is not a unitary agent but a forum. Its legitimacy does not derive from the national vote share of the resulting majority party, but from the local legitimacy of each seat-holder combined with the internal rules of the chamber.
  *   **The Legitimacy Condition:** *Ex-post Majority.* The "majority rule" requirement is satisfied *inside* the chamber, not at the ballot box. In each district, a plurality is accepted as a sufficient proxy for local representation because the "tyranny of the minority" is checked by the fact that the MP is only one vote among 650. The national "mandate" is a fiction constructed after the fact by the party whip system.
  *   **Why Plurality Works:** We tolerate 35% national vote share yielding 100% of the power in a district because the *system* (parliamentary procedure, committees, second chambers) creates veto points that dilute the discretion of any single member.

  **C. The Referendum (Simple Majority)**
  *   **The Theory:** *Direct Decision.*
  *   **The Logic:** A referendum is not hiring an agent (Executive) nor selecting a forum (Legislature); it is making a specific decision. It treats the electorate as a single corporate body answering a binary question.
  *   **The Legitimacy Condition:** *Decisional Finality.* The threshold is 50% + 1 of *votes cast* because the goal is to resolve a question, not to authorize discretion. The logic is mathematical tie-breaking: if more people say Yes than No, the proposition passes.
  *   **Why Turnout Quorums are Rare:** Imposing a turnout quorum privileges the status quo (a "No" vote via abstention). Most referendum frameworks prioritize *clarity of outcome* over *depth of consent*.

  ### 2. The Contradictions

  You asked where these genuinely contradict rather than just differ. There are two specific points of failure.

  **Contradiction 1: The Discretion Paradox (Executive vs. Referendum)**
  This is the strongest inconsistency.
  *   **Executive:** We demand a majority (often >50% of votes, sometimes of eligible) because the President has high *discretion*. They will interpret the mandate.
  *   **Referendum:** We accept a bare majority of *participants* (e.g., 52% of 72% turnout = 37% of the electorate) for decisions that often have *zero discretion* and are constitutionally entrenched (e.g., Brexit, constitutional amendments).
  *   **The Conflict:** Normatively, the bar for legitimacy should rise with the irreversibility and scope of the decision. A referendum often changes the constitution (hard to reverse) with a lower threshold of consent than electing a President (easy to reverse via next election). The theory of "Direct Decision" contradicts the theory of "Authorization of Agent" because the Decision often binds the Agent more tightly than the Agent could bind themselves.

  **Contradiction 2: The Construction of the Majority (Legislature vs. Executive)**
  *   **Legislature:** Accepts that a "Majority Government" can be formed by a party with <40% of the vote. The "Majority" is a geometric artifact of the districting system.
  *   **Executive:** Rejects the geometric artifact. If the district is the whole country, we demand the math work.
  *   **The Conflict:** If a President needs 50% to claim they speak for the people, why does a Prime Minister (who often holds more concentrated power in a parliamentary system) claim a "mandate" with 35%? The answer is usually "Parliamentary Sovereignty" vs. "Popular Sovereignty," but in practice, it means we apply two different standards of "The People" depending on the office.

  ### 3. Is There a Single Principle?

  You suspect there is one principle generating all three. There is, but it is functionalist rather than normative. It is the **Principle of Minimizing Veto Points.**

  *   **Executive:** We require a majority *ex-ante* (runoff) to prevent the opposition from delegitimizing the agent immediately. We front-load the consensus building to ensure governability.
  *   **Legislature:** We accept plurality *ex-ante* because consensus is built *ex-post* (coalitions). We back-load the consensus building to ensure representation.
  *   **Referendum:** We accept simple majority *in-the-moment* because there is no mechanism for consensus building. We prioritize closure over consensus.

  **Does this principle survive scrutiny?**
  No. It explains the *mechanism*, but it fails the *normative* test of legitimacy. It essentially says: "We set the threshold based on how hard it is to fix the mistake later."
  *   Executives are hard to fire mid-term -> High bar.
  *   Legislatures can be checked internally -> Low bar.
  *   Referendums are treated as final -> *Should be High bar, but isn't.*

  The system is not generated by a single principle of justice; it is generated by a **hierarchy of reversibility.** The inconsistency lies in the Referendum. We treat Referendums as irreversible (constitutional) but score them as reversible (simple vote).

  ### 4. Unifying the Standard: What Would Change?

  If you forced all three to adhere to a single standard of legitimacy, you have two options. Both have severe costs.

  **Option A: The "High Consent" Standard (Apply Executive rules to all)**
  *   **Rule:** All outcomes require >50% of *eligible* voters (not just cast), or a supermajority.
  *   **Changes:**
      *   Legislatures: Would require national PR with high thresholds or runoffs in every district.
      *   Referendums: Would require turnout quorums or double majorities (e.g., 50% of voters + majority of states).
  *   **The Cost:** *Status Quo Bias and Instability.*
      *   **Gridlock:** It becomes mathematically difficult to change anything. Minority veto power increases drastically.
      *   **Legitimacy Crises:** If no candidate/party reaches the threshold repeatedly, you get repeated elections (see: Chile or Austria historical examples), eroding faith in the system.
      *   **Policy:** Radical reform becomes impossible. This favors entrenched interests.

  **Option B: The "Decisional Efficiency" Standard (Apply Referendum rules to all)**
  *   **Rule:** Plurality wins everything. 50% + 1 of votes cast is sufficient for constitutional change.
  *   **Changes:**
      *   Executives: No runoffs. 35% Presidents are normal.
      *   Referendums: No quorums. 35% of electorate can change the constitution.
  *   **The Cost:** *Majoritarian Tyranny and Volatility.*
      *   **Polarization:** Incentivizes mobilizing the base rather than courting the center.
      *   **Reversibility:** Policies swing wildly with small shifts in turnout.
      *   **Legitimacy:** Large minorities feel permanently excluded from the executive branch.

  ### 5. The Verdict

  The principle that survives scrutiny best is **Proportionality of Discretion.**

  *   **High Discretion (Executive):** Needs High Legitimacy (Majority of voters).
  *   **Shared Discretion (Legislature):** Needs Moderate Legitimacy (Plurality of district, aggregated).
  *   **Zero Discretion (Referendum):** *Should* need Highest Legitimacy (Supermajority/Quorum) because it removes future discretion.

  **The Fix:**
  The outlier is the Referendum. To resolve your puzzle, you must treat Referendums not as "votes" but as "constitutional events."
  *   **If a Referendum is Advisory:** Simple majority is fine (it's just input for the Legislature).
  *   **If a Referendum is Binding/Constitutional:** It requires the same threshold as amending a constitution (usually supermajority or double majority), *not* the threshold of an election.

  **The Cost of Fixing It:**
  If you raise the bar for Referendums to match the "High Consent" standard (e.g., 50% of eligible voters, not just cast), you protect the minority from radical constitutional change driven by a motivated plurality. However, you transfer power from the populace to the status quo. In cost-benefit terms: **You reduce the Error Cost of bad constitutional changes, but increase the Transaction Cost of necessary reforms.**

  Your intuition is correct: the current triad is incoherent. It treats the most irreversible decisions (referendums) with the least rigorous threshold of consent, while treating the most reversible decisions (executive terms) with the most rigorous. The theory presupposed is not "Democracy" but "Governability," with Referendums acting as a pressure valve that is theoretically unjustified but functionally convenient for elites who want to offload hard choices.
