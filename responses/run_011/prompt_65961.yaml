      *   *Candidate 5 (The Strongest):* **The Distinction between *Authorizing an Agent* vs. *Making a Decision*.**
          *   Executive: Authorizing an agent. High bar needed because the agent has discretion.
          *   Legislature: Selecting representatives to *negotiate* the decision later. Low bar per seat because the *assembly* creates the majority later.
          *   Referendum: Making the decision directly. No agent discretion. The vote *is* the decision.
      *   *Wait, is there a deeper one?* How about **Stability vs. Responsiveness**?
      *   *Better:* **The "Negative Power" Theory.**
          *   Executive: Needs positive majority to rule because they can veto/block.
          *   Legislature: Plurality is okay because the *opposition* can block bad laws inside the house.
          *   Referendum: 50%+1 is okay because it's a binary choice, but the *contradiction* is that referendums often lack the "internal negotiation" of a legislature.
      *   *Let's try to find the "One Principle" the user feels exists.*
      *   It might be: **Legitimacy is proportional to the Discretionary Power of the Outcome.**
          *   President: High discretion -> High legitimacy threshold (Majority).
          *   Legislature: Low individual discretion (collective body) -> Low individual threshold (Plurality).
          *   Referendum: Zero discretion (it's the law) -> Should be High threshold? But it's not. This is the break point.
      *   *Alternative:* **The Principle of "No Minority Rule" applied differently.**
          *   Executive: 38% ruling 62% is minority rule.
          *   Legislature: 35% party ruling is minority rule *nationally*, but locally they represent the plurality. The "Majority" is constructed *post-election*.
          *   Referendum: 52% ruling 48% is technically minority rule (of the whole population), but accepted as "Majority of Participants."
      *   *The Real Unifier:* **The Cost of Reversal.**
          *   Executive: Hard to remove (fixed term). Need strong mandate.
