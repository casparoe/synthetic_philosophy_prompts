      *   *Okay, let's look for the "Single Principle" that explains the status quo (even if flawed).*
      *   **Principle:** **Legitimacy derives from the *opportunity to form a coalition*.**
          *   Executive Runoff: Forces coalition building *before* taking office.
          *   Legislature: Coalition building happens *after* election (inside parliament).
          *   Referendum: Coalition building happens *during* the campaign. Once voted, it's done.
      *   *Actually, the most robust theoretical reconstruction is about **Agency vs. Decision**.*
          *   Executive: You are hiring an employee. You want >50% confidence.
          *   Legislature: You are choosing a sample group to debate. You just need local representation.
          *   Referendum: You are taking a pulse.
      *   *Wait, the user asks: "whether a single principle generates all three."* I need to be honest. There likely *isn't* a coherent single principle. The system is path-dependent. But I can construct the *best fit* principle or explain why none exists.
      *   *Hypothesis:* The unifying principle is **"Majoritarianism within the relevant decision-making unit."**
          *   Executive: The unit is the Nation. Decision is "Who rules?" -> Majority of Nation needed.
          *   Legislature: The unit is the District. Decision is "Who speaks for this district?" -> Plurality of District accepted (as a proxy for majority).
          *   Referendum: The unit is the Vote. Decision is "Yes or No?" -> Majority of Votes.
      *   *Critique:* This explains the rules but highlights the normative gap (why is District Plurality okay but National Plurality not?).

  5.  **Drafting the Argument (Iterative Process):**

      *   *Introduction:* Acknowledge the sharpness of the observation. It's not obvious; it's a genuine tension in democratic theory.
      *   *Section 1: Reconstruction of the Three Theories.*
          *   Executive: *Authorization Theory.* (Hiring an agent). Needs >50% to claim they speak for "the people."
          *   Legislature: *Representation Theory.* (Mirroring). Local legitimacy aggregates to national legitimacy. The "Majority" is formed *inside* the house, not at the ballot box.
          *   Referendum: *Decision Theory.* (Binary choice). The vote *is* the act. 50%+1 is the mathematical tie-breaker.
      *   *Section 2: The Contradictions.*
          *   The "35% Majority" Paradox (Legislature vs. Executive).
          *   The "52% Sovereignty" Paradox (Referendum vs. Executive).
          *   The Turnout Problem (Referendum vs. Elections).
      *   *Section 3: Is there a Single Principle?*
          *   Try to find it. Maybe **"The Principle of Constructed Majorities."**
          *   Executive: Constructed *before* inauguration (Runoff).
          *   Legislature: Constructed *after* election (Coalition/Parliamentary procedure).
          *   Referendum: Constructed *by the question* (Binary).
          *   *Verdict:* This is a post-hoc rationalization, not a normative principle. The truth is path dependence + functionalism.
      *   *Section 4: Unifying the Standard.*
          *   Option A: High Bar for All (Majority of Eligible Voters). Cost: Gridlock, instability.
          *   Option B: Low Bar for All (Plurality). Cost: Weak mandates, polarization.
          *   Option C: The "Agency" Standard (My recommendation). Align Referendums with Executives.
      *   *Section 5: The Cost.*
          *   If we raise the bar for Referendums (e.g., double majority or turnout quorum): Protects minorities, reduces volatility. Cost: Status quo bias, elite capture.
          *   If we lower the bar for Executives: Efficiency. Cost: Legitimacy crises.

  6.  **Refining the Argument for a PhD Student:**
      *   Use precise terminology (Authorization, Aggregation, Decisional Finality).
      *   Avoid hand-waving. Acknowledge the "path dependence" but focus on the *normative* logic they *claim* to use.
