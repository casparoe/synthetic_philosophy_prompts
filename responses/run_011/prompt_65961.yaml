      *   *Okay, I have a strong angle:* **Discretion vs. Instruction.**
          *   Executive: Discretionary Agent.
          *   Legislature: Discretionary Body (composed of agents).
          *   Referendum: Direct Instruction.
      *   *Why the contradiction?* Because we treat Referendums as Instructions but give them the weight of Constitutional Law without the safeguards of Constitutional amendment (supermajorities).

  7.  **Final Polish:**
      *   Ensure the tone is peer-to-peer (respectful, analytical, dense).
