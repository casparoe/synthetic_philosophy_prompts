      *   **The Ask:** A careful reconstruction of the underlying theories of democratic legitimacy for each practice. Identify where they genuinely contradict vs. differ. Determine if a single principle generates all three. Finally, analyze what would change if we held all three to one standard and the costs involved.
      *   **Constraint:** No reading list. Wants the argument, not references. On a train (implies concise, dense, high-signal text).

  2.  **Deconstruct the Three Practices:**

      *   **Practice 1: Executive Elections (Presidential/Single Head)**
          *   *Rule:* Majority required (Runoff, RCV).
          *   *Implicit Theory:* *Authorization of Power.* The executive is a unitary agent acting *on behalf of* the whole polity. Legitimacy comes from explicit consent of more than half to avoid the "tyranny of the minority."
          *   *Function:* Mandate to act.

      *   **Practice 2: Legislative Elections (Parliament/Congress)**
          *   *Rule:* Plurality accepted (FPTP/Single Member Districts).
          *   *Implicit Theory:* *Representation of Diversity.* The legislature is a microcosm or an aggregate of local interests. Legitimacy comes from the *process* of aggregation and the internal majority rule *within* the chamber, not the external vote share per seat.
          *   *Function:* Mirroring/Aggregating interests.

      *   **Practice 3: Referendums**
          *   *Rule:* Simple Majority (50% + 1 of votes cast), sometimes low turnout.
          *   *Implicit Theory:* *Decisional Finality.* The question is binary (Yes/No). It's a direct decision, not an authorization of an agent. Legitimacy comes from the closure of the debate.
          *   *Function:* Resolving a specific question.

  3.  **Identify the Contradictions vs. Differences:**

      *   *Difference:* Executive vs. Legislature. One is a person (agent), one is a body (forum). This explains the majority vs. plurality distinction reasonably well.
      *   *Contradiction:* Referendum vs. Executive. Both are "decisions" binding the whole. Why does 52% suffice for Brexit (constitutional change) but 52% is weak for a President?
      *   *Contradiction:* Referendum vs. Legislature. Legislature accepts 35% vote share yielding 100% power in a district. Referendum demands 50% of *votes cast* for a single policy.
