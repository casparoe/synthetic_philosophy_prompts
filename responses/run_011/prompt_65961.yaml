      *   *Key Insight:* The Legislature accepts plurality because the *system* (Parliament) converts plurality to majority. The Executive *is* the system, so it needs the majority beforehand. The Referendum *is* the decision, so it needs... what? Ideally a high bar, but practically a low bar for finality.
      *   *The "One Principle" attempt:* **The Principle of Reversibility.**
          *   Executives: Hard to fire -> Need high entry bar.
