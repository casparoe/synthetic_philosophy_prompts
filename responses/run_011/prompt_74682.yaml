  ### 2. Implications for the New Case

  **The Figures:**
  *   Venture Value ($V$): £900,000
  *   Fallbacks ($d$): (£240,000, £60,000)
  *   Total Fallback: £300,000
  *   **Surplus:** £600,000

  Here is what each surviving rule implies for your award:

  **1. If she used Nash (Equal Split of Surplus):**
  *   Surplus to divide: £600,000.
  *   Each party gets half the surplus: £300,000.
  *   **Award:** Large Member: £240k + £300k = **£540,000**. Small Member: £60k + £300k = **£360,000**.

  **2. If she used Kalai-Smorodinsky (Equal Relative Gain):**
  *   Max Gain Large ($u_1$): $900 - 60 = 840$.
  *   Max Gain Small ($u_2$): $900 - 240 = 660$.
  *   Total "Claim Capacity": $840 + 660 = 1,500$.
  *   Scaling Factor ($\lambda$): $\text{Surplus} / \text{Capacity} = 600 / 1,500 = 0.4$.
  *   Gain Large: $0.4 \times 840 = 336$.
  *   Gain Small: $0.4 \times 660 = 264$.
  *   **Award:** Large Member: £240k + £336k = **£576,000**. Small Member: £60k + £264k = **£324,000**.

  **3. If she used Proportional to Fallback:**
  *   Ratio of Fallbacks: $240 : 60$ or $4 : 1$.
  *   Large Member Share: $\frac{4}{5} \times 900 = 720$.
  *   Small Member Share: $\frac{1}{5} \times 900 = 180$.
  *   **Award:** Large Member: **£720,000**. Small Member: **£180,000**.

  **Closest Analogue and Why It Fails:**
  **Case (iv)** is the closest analogue because it is the only previous case with asymmetric fallbacks (£150k vs £50k).
  *   **Why it fails:** In Case (iv), the venture value (£200k) exactly equaled the sum of fallbacks (£200k). There was no surplus. In your case, there is a massive surplus (£600k). Case (iv) tells us how she handles the *floor* (individual rationality), but it provides no data on how she handles the *ceiling* (bargaining power over surplus). Relying on Case (iv) alone would tempt you toward the Proportional rule, but that is an extrapolation unsupported by the symmetric cases where surplus was shared equally.

