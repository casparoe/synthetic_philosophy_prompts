answer: |-
  **Scenario**

  Four doctors in a small clinic must decide whether to administer a new treatment (Yes) or stick with the standard (No). The treatment is either Effective (E) or Ineffective (I), with a 50% prior probability. A correct decision yields a payoff of $20 per doctor; an incorrect one yields $0. Each doctor can purchase a diagnostic test kit for $1.50. The kits come from a single batch: there is a 50% chance the batch is "Calibrated" (tests are 80% accurate and independent across doctors) and a 50% chance the batch is "Faulty" (tests are 80% accurate but perfectly correlated, meaning every doctor gets the identical result). Doctors decide sequentially, observing previous choices but not test results, and cannot communicate privately.

  **Demonstration**

  **Agent Decisions:**
  *   **Doctor 1:** Prior belief is 50%. Expected value of testing is $6 (increases accuracy from 50% to 80% on $20 payoff) minus $1.50 cost = $4.50 net gain. Doctor 1 buys the kit, observes signal "Yes," updates belief to 80% probability of Effective, and chooses Yes.
  *   **Doctor 2:** Observes Doctor 1 chose Yes, inferring Doctor 1 saw "Yes." Current belief is 80%. Doctor 2 considers buying a kit. If the batch is Faulty (50% chance), the second kit matches the first (Value = $0). If Calibrated (50% chance), the second kit is independent; its expected value is $2 (raises expected payoff from $16 to $18). The expected value of testing is therefore $1 (0.5 × $0 + 0.5 × $2). Since Cost ($1.50) > Expected Value ($1), Doctor 2 rationally declines the kit and follows Doctor 1.
  *   **Doctors 3 & 4:** Face the same calculation as Doctor 2. Knowing Doctors 1 and 2 chose Yes (with Doctor 2 revealing no new signal), their belief remains 80%. The expected value of a kit remains $1, which is less than the $1.50 cost. Both decline the kit and choose Yes. A rational cascade forms.

  **Counterfactual and Advantage:**
  In the **Fully Independent Counterfactual**, every doctor decides without observing others, so all four buy kits. Total cost is $6.00. Because decisions are made individually based on one signal each, every doctor has an 80% accuracy rate. Total expected payoff is 4 × ($16 - $1.50) = $58.00.
  In the **Cascade Case**, only Doctor 1 buys a kit. Total cost is $1.50. All four doctors follow Doctor 1's signal, so every doctor still has an 80% accuracy rate. Total expected payoff is 4 × $16 - $1.50 = $62.50.
  The cascade yields $4.50 more in total net value. The advantage comes entirely from avoiding redundant costs on correlated information.

  **Feature Identification and Removal:**
  The single feature doing the work is the **interaction between correlation and cost**.
  *   **If evidence becomes independent:** The expected value of Doctor 2's test rises to $2. Since $2 > $1.50, Doctor 2 buys the kit. The cascade breaks, everyone tests, and the result equals the Independent Counterfactual ($58.00). The advantage vanishes.
  *   **If evidence becomes free:** The cost drops to $0. Since Expected Value ($1) > $0, Doctor 2 buys the kit. The cascade breaks, and the advantage vanishes.

  **Strongest Attack:**
  A defender of the wisdom of crowds would argue this case is rigged by assuming the "Independent Counterfactual" prevents agents from observing each other. In reality, even without a formal cascade, agents in a workplace observe peers. If they could observe peers *and* evidence were independent, they might still herd, but they would also aggregate information more robustly if they didn't stop gathering data. The model assumes the cascade *stops* information gathering entirely, whereas in many real-world settings, late movers might verify early moves if the stakes are high enough, mitigating the cost savings but improving accuracy.

  **Confidence and Verification:**
  I am 95% confident the numbers work as claimed. I checked the arithmetic step-by-step: specifically, the Value of Information calculation ($18 expected payoff with 2 independent signals vs. $16 with 1) and the cost comparison ($1.50). The single point I am least sure of is the precise valuation of the second signal's contribution to expected payoff (the jump from $16 to $18), as it depends on the tie-breaking rule when signals contradict, but the margin ($2 value vs. $1.50 cost) is wide enough to withstand minor variations.
