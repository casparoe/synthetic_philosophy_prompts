prompt: |-
  You are a decision theorist who has worked extensively on Newcomb-style problems and on translating them into institutional policy. I am head of information security for a regional hospital group — three acute sites, roughly 9,000 staff. We have had two extortion incidents in four years and expect about one a year henceforth. Each time, the board turns to me for a recommendation within hours, and that recommendation has to remain defensible afterwards whether or not it worked. The board chair and the chief medical officer sign off jointly; the procedure itself must be runnable in under an hour by whoever is on duty, who may not be a specialist.

  Please write me a standing decision procedure for three linked questions: whether to pay, what we should commit to publicly in advance, and at what point the matter stops being a prediction problem and becomes a values problem the board must own. I want it grounded explicitly in the two structures that seem to me to be lurking in this situation. First, the counterfactual mugging: a predictor has already acted on a model of how you would have responded in a branch that did not obtain, so the payoff to behaving as though that branch mattered lands elsewhere and later. Second, XOR blackmail: the extortionist's claim is that they selected you precisely because of what they predicted you would do, so that complying appears to be evidence against the threat having been set in motion at all.

  Begin with a short brainstorm identifying which features of a real incident genuinely have that structure and which merely resemble it — the puzzles stipulate a near-perfect predictor, and no attacker is one; say what survives that weakening and what collapses. Then give the procedure: the questions in order, what counts as a sufficient answer to each, where it terminates in a refusal, where it hands the decision upward, and which steps are judgment calls dressed up as procedure. It must address a pre-announced no-pay policy that a sophisticated actor will simply predict we abandon in extremis, and it must address the fact that our response today feeds the targeting model applied to other hospitals next quarter, whose patients have no one at our table.

  Finally, run it on three cases: (i) encryption on a Sunday evening, with elective theatres already cancelled and the attacker citing our own published statement that we engage with negotiators; (ii) a demand where the stolen records have already been published and payment buys only an assurance of deletion and non-republication; (iii) an automated campaign hitting dozens of hospitals in a week with small demands, where paying restores full service within a day. At least one case must yield a recommendation I would rather not take to the board, and you should say why the procedure is nonetheless right to give it. Close with what the procedure cannot settle at all. Write in British English; do not include citations, references, or reading lists.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Decision Theorist specializing in Newcomb-style problems and institutional policy.
      *   **Client:** Head of Information Security for a regional hospital group (3 sites, 9,000 staff).
      *   **Context:** Two extortion incidents in 4 years, expecting ~1/year. Board needs a recommendation within hours, defensible afterwards. Procedure must be runnable in <1 hour by non-specialists. Joint sign-off (Board Chair + CMO).
      *   **Core Task:** Write a standing decision procedure for three linked questions: (1) Whether to pay, (2) What to commit to publicly in advance, (3) When it shifts from prediction to values.
      *   **Theoretical Grounding:** Must explicitly use two structures: Counterfactual Mugging (predictor acted on a model of response in a non-obtained branch) and XOR Blackmail (compliance is evidence against the threat being set in motion).
      *   **Requirements:**
          *   Start with a brainstorm distinguishing real features from puzzle stipulations (perfect predictors vs. real attackers).
          *   Provide the procedure (ordered questions, termination points, hand-ups, judgment calls).
          *   Address pre-announced no-pay policies (credibility problem) and externalities (targeting other hospitals).
          *   Run the procedure on three specific cases (i, ii, iii). One must yield an uncomfortable recommendation.
          *   Close with limitations (what the procedure cannot settle).
          *   Style: British English, no citations/references.

  2.  **Deconstruct the Theoretical Structures:**
      *   *Counterfactual Mugging:* In the classic puzzle, Omega asks for money based on what you *would* have done if a coin landed differently. In ransomware, the "predictor" is the attacker. They invest resources based on the expectation of payment. If we pay, we validate their model for *future* attacks (on us or others). If we don't pay, we suffer now but potentially deter later. The "payoff lands elsewhere and later" means the cost of paying is borne by future victims (including ourselves), while the benefit is immediate recovery.
      *   *XOR Blackmail:* The attacker claims, "I only attacked because I thought you'd pay." If you pay, you confirm the hypothesis that you are a payer, which might mean the attack was inevitable given your nature. If you don't pay, you might prove you aren't a payer, but the damage is done. In reality, this maps to *selection bias*. Attackers target those they predict will pay. Paying confirms you are in the "sucker" dataset.
      *   *Realism Check:* Attackers aren't Omegas. They are imperfect predictors. They rely on heuristics (industry, size, past behaviour, public statements). The "perfect predictor" assumption collapses, but the *incentive structure* remains. The "evidence" aspect of XOR becomes a "signal" aspect. Sending a signal of willingness to pay increases probability of future targeting.

  3.  **Drafting the Brainstorm (Real vs. Puzzle):**
      *   *Perfect Predictor:* Collapses. Attackers guess. But they update. Our action today updates their model for tomorrow.
      *   *Counterfactual:* The "branch that did not obtain" is the scenario where we had better backups or security. We are being punished for past under-investment. Paying doesn't fix the counterfactual; it just pays the tax on it.
      *   *XOR:* The claim "we targeted you because you pay" is often a bluff. However, paying makes it true for the *next* cycle.
      *   *Surviving Structure:* The core is *Updateless Decision Theory* (UDT) applied to policy. We must choose a policy *now* that we would want to be bound by *then*, knowing that attackers simulate our policy.
      *   *Externalities:* The prompt highlights other hospitals. This is a multi-agent game. Paying harms the collective (negative externality).

  4.  **Developing the Procedure:**
      *   *Goal:* Defensible, fast, runnable by non-specialists.
      *   *Structure:* Needs to be a flowchart or stepped checklist.
      *   *Question 1: Viability.* Can we operate without paying? (Backups, downtime tolerance).
      *   *Question 2: Credibility.* Does paying actually work? (Decryption keys, deletion assurance).
      *   *Question 3: The Newcomb/Values Shift.* This is the crux. When do we stop calculating odds and start upholding values?
      *   *Pre-commitment:* The policy must be public but allow for "existential exception." If we say "Never," attackers know we lie. If we say "Sometimes," they test us.
      *   *The "Values" Threshold:* When patient safety is immediately compromised vs. financial loss.
      *   *The "Prediction" vs. "Values" handoff:* The security team calculates the odds (Prediction). The Board owns the moral hazard (Values).

  5.  **Refining the Procedure (incorporating Decision Theory):**
      *   Need to explicitly address the "Timeless" aspect. We are setting a precedent.
      *   Need to address the "Counterfactual Mugging" aspect: Are we paying for a past decision (security posture) or buying a future benefit (data return)?
      *   Need to address "XOR": Are we paying because the threat is real, or because we are the *type* of organisation that pays?
      *   *Step 1: Triage (Clinical Impact).* If patients die, policy suspends. (Values override).
      *   *Step 2: Verification (The XOR check).* Is the threat real? Do they have data? Can they decrypt?
      *   *Step 3: The Policy Check (The Counterfactual).* If we pay, do we validate the attack model?
      *   *Step 4: The Escalation.* If Step 3 is ambiguous, Board decides.

  6.  **Developing the Three Cases:**
      *   *Case (i): Encryption, Sunday, Electives cancelled, Attacker cites our negotiation policy.*
          *   Analysis: High operational impact. Attacker knows our policy (XOR/Selection).
          *   Recommendation: Likely Pay (or Negotiate). Why? Clinical risk (electives cancelled implies backlog, but maybe not immediate death). But the prompt asks for one uncomfortable recommendation. Let's make this the "Don't Pay" case if backups exist, or "Pay" if they don't. Let's go with *Don't Pay* if backups are viable, even if painful. Or better, *Pay* because of clinical risk, acknowledging the negative externality.
          *   *Wait, the prompt asks for one recommendation I would "rather not take to the board".* Usually, CISOs hate recommending payment because it admits defeat and fuels the market. Or they hate recommending *not* paying when patients suffer. Let's make Case (iii) the uncomfortable one.
      *   *Case (ii): Data published, payment for deletion.*
          *   Analysis: XOR blackmail pure form. Paying buys "honour among thieves." Highly unreliable.
          *   Recommendation: Do Not Pay.
      *   *Case (iii): Automated campaign, small demands, service restoration.*
          *   Analysis: This is the "tax" model. Paying is cheap and fast.
          *   *Uncomfortable Recommendation:* The procedure should say *Do Not Pay*, even though it's cheap and easy. Why? Because paying validates the automated model for the whole sector. It's the "Counterfactual Mugging" trap. Paying $10k now costs the sector $10m later. This is hard to sell to a board focused on quarterly budget.
      *   *Re-evaluating Case (i):* If electives are cancelled, is it life-critical? If not, it's financial/reputational. If we have backups, we shouldn't pay. If we don't, we might have to. Let's assume backups are *slow* to restore.
      *   *Decision:* I will make Case (iii) the one where the procedure says "Do Not Pay" despite the low cost and quick fix. This is the "principled stand" that is hard to defend when the fix is cheap.

  7.  **Drafting the Content (Iterative refinement for tone and constraints):**
      *   *Tone:* Professional, analytical, British English (organisation, programme, centre, defence).
      *   *Constraint Check:* No citations. Under 1 hour runtime. Defensible.
      *   *The "Values" Shift:* Explicitly define where the math stops. It stops when clinical safety is the primary variable, not cost/benefit.
      *   *Pre-announcement:* We must commit to "Presumption Against Payment" rather than "Never." "Never" is not credible (Time Inconsistency).

  8.  **Final Polish of the Procedure:**
      *   Make sure the "Counterfactual Mugging" and "XOR" language is integrated but practical.
      *   Ensure the "Hand-off" to the Board is clear.
      *   Ensure the "Externalities" (other hospitals) are weighed.

  9.  **Self-Correction during drafting:**
      *   *Critique:* Is the decision theory too abstract?
      *   *Fix:* Ground it in the "Signal to Attackers" concept.
      *   *Critique:* Is the "Uncomfortable Recommendation" clear?
      *   *Fix:* In Case (iii), explicitly state that paying is rational for *this* incident but irrational for the *policy*, and the procedure prioritises the policy. This creates the tension.
      *   *Critique:* Did I address the "public commitment"?
      *   *Fix:* Include a section on "Public Stance" in the procedure.

  10. **Final Review against Prompt:**
      *   Brainstorm first? Yes.
      *   Procedure (questions, termination, hand-up)? Yes.
      *   Address pre-announced policy credibility? Yes.
      *   Address externalities? Yes.
      *   Three cases run? Yes.
      *   One uncomfortable recommendation? Yes (Case iii).
      *   Close with limitations? Yes.
      *   British English? Yes.
      *   No citations? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  ### Part 1: Structural Brainstorm — Puzzle vs. Reality

  Before codifying the procedure, we must strip the decision theory down to what survives contact with reality. The puzzles you cite rely on stipulations no criminal actor can meet, but the incentives they model are genuine.

  **1. The Perfect Predictor (Counterfactual Mugging)**
  *   **Puzzle Stipulation:** Omega knows with certainty what you would do in a counterfactual branch.
  *   **Reality:** Ransomware gangs are not omniscient. They use heuristics: sector, size, public filings, past incident reports, and dark web chatter. They are Bayesian updaters, not perfect predictors.
  *   **What Collapses:** The idea that your decision *now* causally affects whether the attack *already happened*. The encryption is already done. You cannot change the past branch.
  *   **What Survives:** Your decision now updates their model for the *next* branch. If you pay, you confirm the heuristic that "Hospital Group X pays." You are effectively paying a tax on your own predictability. The "payoff landing elsewhere" is the increased probability of future attacks on you and your peers. You are being mugged not for the cash, but for the signal your compliance sends to the market.

  **2. The Selection Effect (XOR Blackmail)**
  *   **Puzzle Stipulation:** The blackmailer sends the letter *only if* they predict you will pay. Paying is evidence the threat was real; refusing is evidence it was a bluff.
  *   **Reality:** Attackers often blast thousands of probes. They select targets *after* initial access based on perceived value and perceived weakness. The claim "we chose you because you pay" is often post-hoc rationalisation.
  *   **What Collapses:** The logical entanglement where your payment proves the threat's validity. The threat is valid regardless (the data is encrypted).
  *   **What Survives:** The signalling dynamic. If you pay, you validate the selection criteria. You become a "high-yield target" in their database. Refusing to pay, even when painful, degrades your value in their targeting model.

  **3. The Institutional Constraint**
  *   **The Credibility Problem:** A public "Never Pay" policy is time-inconsistent. In the moment of crisis, the incentive to deviate is massive. Sophisticated attackers know this. They bet on your panic, not your policy.
  *   **The Externality:** Your decision affects other hospitals. Paying subsidises the development of tools that will hit your neighbours. This is a multi-agent game where local rationality (restore service cheaply) creates global irrationality (more attacks on the sector).

  **Conclusion for Procedure:** We cannot act as if we are in a one-off game. We must act as if we are setting the code for a repeated game. The procedure must force the decision-maker to weigh the immediate restoration against the long-term signalling cost.

  ---

  ### Part 2: Standing Decision Procedure (The 'Red Protocol')

  **Owner:** Head of Information Security
  **Applicability:** All acute sites, 9,000 staff
  **Activation:** Confirmed ransomware or data extortion event
  **Time Limit:** Recommendation to Board within 60 minutes of activation
  **Sign-off:** Board Chair and Chief Medical Officer (CMO)

  #### Phase 1: Triage and Clinical Safety (The Values Threshold)
  *Time allowance: 0–15 minutes*

  **Question 1.1: Is there an immediate threat to life or critical patient safety that cannot be mitigated by downtime procedures?**
  *   **Definition:** 'Immediate' means within the next 4 hours. 'Critical' means A&E diversion, theatre cancellation affecting trauma/cancer, or loss of vital signs monitoring.
  *   **If YES:** The matter ceases to be a prediction problem. It is a values problem.
      *   **Action:** Recommend payment/negotiation immediately to restore clinical systems.
      *   **Rationale:** Patient safety overrides systemic security incentives. The Board owns the moral hazard; Security executes the restoration.
      *   **Terminate:** Proceed to Payment Authorisation.
  *   **If NO:** Proceed to Question 1.2.

  **Question 1.2: Can core clinical services operate safely on manual/paper contingencies for 72 hours?**
  *   **If YES:** Proceed to Phase 2.
  *   **If NO:** Escalate to Board Chair and CMO immediately as a 'Critical Safety Event'. The default presumption shifts to Payment unless Legal/Insurance advises illegality.

  #### Phase 2: Verification and Leverage (The XOR Check)
  *Time allowance: 15–30 minutes*

  **Question 2.1: Has the attacker demonstrated credible decryption capability?**
  *   **Test:** Decrypt one non-critical file provided by the attacker.
  *   **If NO:** Do not pay. It is a bluff or a broken tool.
  *   **If YES:** Proceed to Question 2.2.

  **Question 2.2: Is the demand for decryption keys or for data deletion/non-publication?**
  *   **If Data Deletion/Non-publication:**
      *   **Presumption:** Do Not Pay.
      *   **Rationale:** This is pure XOR blackmail. You cannot verify deletion. Payment guarantees nothing but marking your organisation as compliant.
      *   **Terminate:** Recommend Refusal.
  *   **If Decryption Keys:** Proceed to Phase 3.

  **Question 2.3: Do we have verified, clean backups that can restore service within a timeframe acceptable to the CMO?**
  *   **If YES:** Proceed to Phase 3.
  *   **If NO:** The cost of non-payment is operational collapse. Escalate to Board as 'High Risk of Prolonged Outage'.

  #### Phase 3: The Policy Check (The Counterfactual Calculation)
  *Time allowance: 30–50 minutes*
  *This is where the decision theory is operationalised. This phase determines if we are paying for recovery or paying for targeting.*

  **Question 3.1: Is this a targeted attack or an automated campaign?**
  *   **Targeted:** They knew our names, spoke to us specifically, referenced our policies.
  *   **Automated:** Generic demand, part of a wider wave hitting multiple sectors.
  *   **Judgement Call:** If targeted, they have already invested significant time. They are more likely to honour a deal but also more likely to return. If automated, they are testing a model.

  **Question 3.2: Does paying validate a specific vulnerability in our public posture?**
  *   **Context:** Did they cite our public statement on negotiation? Did they exploit a known, unpatched vulnerability we were warned about?
  *   **If YES:** Paying confirms that our public statements are bluffs and our security debt is monetisable.
      *   **Presumption:** Do Not Pay (unless Phase 1 triggered).
      *   **Rationale:** Paying here is a Counterfactual Mug. We are paying for the branch where we failed to secure the system. Paying ensures the attacker's model of us remains profitable.
  *   **If NO:** Proceed to Question 3.3.

  **Question 3.3: What is the sector impact?**
  *   **Context:** Are peer hospitals currently under attack?
  *   **If YES:** Paying contributes to the persistence of the campaign affecting our peers.
      *   **Presumption:** Do Not Pay.
      *   **Rationale:** Negative externality. We absorb the cost to protect the network.
  *   **If NO:** Proceed to Recommendation.

  #### Phase 4: Recommendation and Hand-off
  *Time allowance: 50–60 minutes*

  **The Decision Matrix:**
  1.  **Clinical Risk High + No Backups:** Recommend Pay. (Values override).
  2.  **Clinical Risk Low + Backups Available:** Recommend Do Not Pay. (Security principle).
  3.  **Clinical Risk Low + No Backups + Automated Attack:** Recommend Do Not Pay. (Systemic defence).
  4.  **Clinical Risk Low + No Backups + Targeted Attack:** **Hand to Board.**

  **The Hand-off Protocol:**
  If the procedure lands on 'Hand to Board' or conflicts with the 'Presumption Against Payment', the Head of Security must present the following statement to the Chair and CMO:

  > "We have verified the threat. We have assessed the backups. The decision to pay is no longer a technical calculation but a strategic one. Paying restores service but updates the attacker's model to view us as a reliable revenue source. Not paying protects the sector and our long-term posture but incurs immediate operational cost. Security recommends [X], but the Board must own the signal this sends to the market."

  **Public Commitment:**
  Our public stance shall be: *"We do not routinely pay ransoms. We reserve the right to engage in negotiation solely to protect patient safety where no alternative exists."*
  *   **Why:** "Never" is not credible. "Routinely No" allows for the Phase 1 exception without inviting testing.

  ---

  ### Part 3: Case Runs

  #### Case (i): Encryption on a Sunday Evening
  **Scenario:** Elective theatres cancelled. Attacker cites our published statement that we "engage with negotiators." Backups exist but restore time is 48 hours.
  **Run:**
  1.  **Phase 1:** Electives cancelled. Is it life-threatening? Likely not immediately (trauma/A&E usually separate). CMO confirms manual triage viable for 48 hours. -> **Pass to Phase 2.**
  2.  **Phase 2:** Attacker demonstrates decryption. Demand is for keys. -> **Pass to Phase 3.**
  3.  **Phase 3:** They cited our public statement. This is a targeted exploitation of our policy ambiguity. Paying confirms our statement was a signal of weakness, not process.
  4.  **Matrix:** Clinical Risk Low (relative) + Backups Available.
  **Recommendation:** **Do Not Pay.** Restore from backups.
  **Defensibility:** We prioritised long-term security posture over short-term convenience. The attacker exploited a policy signal; we corrected the signal.
  **Board Friction:** Moderate. Elective backlog will cause reputational damage, but no lives lost.

  #### Case (ii): Data Published, Payment for Deletion
  **Scenario:** Patient records already on dark web. Demand is £2m for assurance of deletion and non-republication.
  **Run:**
  1.  **Phase 1:** No impact on clinical systems. -> **Pass to Phase 2.**
  2.  **Phase 2:** Demand is for data deletion.
  3.  **Matrix:** Phase 2.2 explicitly flags this as XOR blackmail. You cannot verify deletion.
  **Recommendation:** **Do Not Pay.**
  **Defensibility:** Paying buys nothing but a receipt that you are a payer. The data is gone; payment does not undo the breach, it only funds the criminal enterprise.
  **Board Friction:** Low. Easy to defend legally and ethically.

  #### Case (iii): Automated Campaign, Small Demands
  **Scenario:** Automated script hits dozens of hospitals. Demand is £50k. Payment restores full service within 24 hours. Backups are corrupted (common in sophisticated automated encryption). Clinical impact is moderate (delays, not cancellations).
  **Run:**
  1.  **Phase 1:** Moderate delays. CMO confirms safe to operate on downtime procedures for 24 hours. -> **Pass to Phase 2.**
  2.  **Phase 2:** Keys provided on test file. -> **Pass to Phase 3.**
  3.  **Phase 3:** This is an automated campaign (Question 3.1). Peer hospitals are being hit (Question 3.3).
  4.  **Matrix:** Clinical Risk Low + No Backups + Automated Attack.
  **Recommendation:** **Do Not Pay.**
  **Defensibility:** This is the uncomfortable recommendation.
  **Why it is right:** Paying £50k is financially trivial compared to the cost of downtime. However, this is a pure Counterfactual Mugging. The attacker's model is "Automated Script + Low Demand = High Conversion Rate." If we pay, we do not just solve our problem; we validate the business model for attacks on *every* hospital in the region. We become a data point that keeps the campaign alive.
  **Why you won't want to take it to the Board:** You are recommending the Board accept 24 hours of operational friction and the cost of manual recovery to save a hypothetical future victim at a different trust. You are asking them to absorb a certain cost to prevent a probabilistic externality. In a quarterly review, this looks like incompetence ("You could have fixed it for £50k"). In a decision theoretic frame, it is the only move that reduces the aggregate expected value of attacking hospitals.

  ---

  ### Part 4: Limitations of the Procedure

  This procedure cannot settle the following, and you must be prepared to admit this to the Board:

  1.  **The "Existential" Exception:** If the organisation faces genuine insolvency due to the attack (not just operational cost, but collapse), the procedure's injunction against paying collapses. Survival overrides signalling. The procedure identifies this as a Board Values Decision, but it cannot dictate the outcome.
  2.  **Insurance Policy Wording:** If our cyber-insurance policy mandates negotiation or payment to mitigate loss, the procedure conflicts with contractual obligations. This must be reconciled by Legal before an incident occurs.
  3.  **The "Honour Among Thieves" Variable:** The procedure assumes attackers are rational economic actors who update models. It cannot account for attackers who simply destroy data regardless of payment out of spite or geopolitical motivation. In such cases, the Counterfactual Mugging logic fails because the payoff structure is broken.
  4.  **Legal Prohibition:** If sanctions or anti-terrorism financing laws prohibit payment to the specific entity, the procedure is moot. The decision is removed from our hands.

  **Final Note:**
  This procedure is designed to be defensible, not necessarily comfortable. It shifts the burden from "Did we save money?" to "Did we uphold the integrity of the health sector's defence?" In Case (iii), you will be asked why you chose to suffer when a cheque would have fixed it. Your answer is that you are not playing a single game; you are setting the rules for the tournament. That is a hard argument to make when the theatres are quiet, but it is the only one that holds in the long run.
