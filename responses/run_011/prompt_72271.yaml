      *Let's refine the "Fatal" one.* Is it truly fatal? A hardline deontologist might say "Yes, seatbelts are also problematic if they impose certain deaths for statistical gains." But that's a view almost no one holds. So for a *policy* context, it's fatal. For *pure moral theory*, it's serious. Given the user's job, it's Fatal.

