  3.  **Address the Five Specific Threads:**

      *   **Thread 1: Rescue Cases (5 vs. 1):**
          *   *Issue:* If we can't aggregate, do we flip a coin between saving 1 person and saving 5?
          *   *Defender's Move:* Scanlon's "Individualist Defense." It's not about numbers; it's about claims. Each of the 5 has a claim equal to the 1. But if I save the 5, I deny the 1 nothing *they could have claimed* that wasn't already overridden by the others' equal claims.
          *   *Defeater:* This looks like aggregation by the back door. If the claim strength doesn't change with numbers, why does the *outcome* change?
          *   *Ranking:* Serious. It threatens the internal coherence of non-aggregative views.

      *   **Thread 2: Metaphysics (Parfit/Reductionism):**
