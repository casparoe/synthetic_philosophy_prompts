          *   *Defeater:* If intrapersonal trade-offs are okay (I sacrifice now for later), and persons are just continuous stages, why are interpersonal trade-offs different?
          *   *Ranking:* Serious/Awkward. Depends on whether the objection is metaphysical or moral. Rawls/Nozick lean moral.

      *   **Thread 3: Priority View:**
          *   *Issue:* Prioritarianism weights benefits to the worse off. It's additive but respects persons.
          *   *Defender's Move:* Prioritarianism is still aggregative. It sums weighted utilities. Separateness objects to the *summing*, not just the weighting.
          *   *Defeater:* If Prioritarianism respects persons, then the objection is just about Utilitarianism's indifference to distribution, not aggregation itself.
          *   *Ranking:* Serious. It suggests the objection might just be a proxy for " Egalitarianism/Prioritarianism good, Utilitarianism bad."

