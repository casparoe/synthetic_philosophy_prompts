      *   *Reading D (Conditional):* "It is theft *unless* specific benefits are received."

      *Let's structure them by the variables provided in the prompt:*
      1.  **The Strict Deontological Claim:** Non-consensual taking is inherently wrong, regardless of outcome. (Baseline: Natural rights. Consent: Explicit only. Thief: Keeps take).
      2.  **The Contractual Failure Claim:** The social contract is voided because consent mechanisms (voting/residence) are coercive or insufficient. (Baseline: Legal rights but conditional on contract. Consent: Tacit is invalid).
      3.  **The Uncompensated Taking Claim:** It is theft because the value returned (services) does not equal the value taken. (Baseline: Market exchange. Thief: Compels exchange but price is unfair).
      4.  **The Jurisdictional Claim:** The authority claiming the money has no legitimate standing over the property. (Baseline: Property precedes state).

      *Let's simplify to 4 distinct, robust theses.*
      1.  **The Moral Identity Thesis:** The act of taxation shares the essential moral features of theft (non-consensual taking), making the label accurate regardless of legal status.
      2.  **The Consent Deficit Thesis:** Legitimate transfer requires explicit consent; residence/voting does not constitute consent.
      3.  **The Net-Benefit Thesis:** It is theft if the individual receives less value than is taken (forced bad deal).
      4.  **The Pre-Political Entitlement Thesis:** Individuals own their holdings prior to the state; the state has no claim to any portion.

  3.  **Evaluate Each Reading:**
      *   *Truth Value:* None are empirically "true/false" in the physics sense; they are normative. I must frame this carefully. "True within its axioms," "False if axioms rejected."
      *   *Assumptions:* Natural rights, definition of consent, valuation of public goods.
      *   *Objections:* Free-rider problem, definition of property as legal construct, valuation difficulties.

  4.  **Apply to the Stormwater Fee:**
      *   *Context:* Fee based on impervious surface (burden calibration). Sanction is lien (property enforcement).
      *   *Analysis:*
          *   Does calibration matter? Yes, for the *Net-Benefit Thesis* and *Moral Identity Thesis* (if it looks like a price, is it still theft?).
