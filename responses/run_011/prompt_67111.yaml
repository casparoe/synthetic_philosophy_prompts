      2.  *The Consent Reading:* Property rights require consent. Tax lacks explicit consent. Therefore theft.
      3.  *The Baseline Reading:* Pre-political property exists. State taking violates it.
      4.  *The Reciprocity Reading:* Theft implies no return value. Tax buys services. If value < cost, is it theft?
      5.  *The Deontological Reading:* Rights are side-constraints. Even if useful, taking is wrong.

      *Refining the Readings for Precision:*
