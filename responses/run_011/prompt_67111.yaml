  5.  **Address the Wrinkle (Fee vs. Tax, Lien vs. Fine):**
      *   *Fee calibrated to burden:* Looks more like a user fee or price. Weakens "Theft" if theft implies taking without exchange. Strengthens "Theft" if the "price" is imposed without consent.
