      *Refining the "Common Usage":* Most people using the slogan mean the Pre-Political Entitlement Thesis but argue using the Net-Benefit Thesis. This mismatch is their weakness.

  8.  **Final Polish:** Check against constraints. No references. No reading list. Precise distinctions. Address the physicist's specific request about "what the comparison is being asked to carry."

      *Plan:*
