answer: |-
  You are asking for a structural analysis of a moral analogy, treating the slogan not as a rallying cry but as a hypothesis with specific boundary conditions. This is a productive approach. The slogan "taxation is theft" functions as a mapping from a source domain (theft) to a target domain (taxation). As you know from modeling, the utility of the map depends on which features are preserved and which are discarded.

  Here is the menu of distinct theses the slogan might express, evaluated by their internal logic, assumptions, and vulnerabilities.

  ### I. The Menu of Theses

  **1. The Moral Identity Thesis**
  *   **The Claim:** The physical act of the state demanding money under threat of force shares the essential moral properties of a thief demanding money under threat of force. The label "tax" is merely a semantic disguise for the same underlying violation.
  *   **What Varies:** It concerns the ordinary concept of theft (taking by threat) but asserts a moral equivalence that overrides legal definitions. It is offered as a **constraint that trumps consequences**; even if the money funds hospitals, the act remains morally identical to theft.
  *   **Consent:** Irrelevant. Even if you consented, the threat structure remains.
  *   **Baseline:** The individual's bodily autonomy and immediate possession.
  *   **Truth Value:** Not the sort of thing that could be empirically true; it is a normative classification. It is *coherent* if one accepts that the moral valence of an act is determined solely by the immediate use of force.
  *   **Assumptions:** That the moral quality of an action is intrinsic to the mechanics of the transaction (force/non-consent) and independent of context, authority, or outcome.
  *   **Strongest Objection:** The *Authority Objection*. A thief acts without standing; a state (in this view) claims legitimate standing derived from the collective security it provides. If legitimacy exists, the "force" is sanction, not aggression. To maintain this thesis, you must assume political legitimacy is impossible *a priori*.

  **2. The Pre-Political Entitlement Thesis**
  *   **The Claim:** Individuals possess a natural right to 100% of the resources they hold or produce prior to the establishment of the state. The state's claim to any portion is a violation of that pre-existing bundle of titles.
  *   **What Varies:** It concerns the **baseline of titles**. It asserts that property rights exist before the legal system that enforces them. It is a **constraint**; no amount of social benefit justifies violating the pre-political boundary.
  *   **Consent:** Explicit consent is required to alienate any portion of the pre-political holding.
  *   **Truth Value:** Not the sort of thing that could be empirically true. It relies on a metaphysical claim about natural rights.
  *   **Assumptions:** That property is a natural relation between person and object, not a social relation enforced by a community. It assumes the "bundle of rights" is indivisible and pre-political.
  *   **Strongest Objection:** The *Constitution Objection*. Property rights (the right to exclude, the right to sell) are defined and secured by the legal system itself. Without the state, you have possession, not title. To claim you own 100% of your income "before" the state assumes the state did not create the market conditions, currency stability, or enforcement mechanisms that gave that income value.

  **3. The Contractual Deficit Thesis**
  *   **The Claim:** Legitimate transfer of property requires consent. Residence, voting, or inability to exit does not constitute valid consent. Therefore, the transaction is voidable, rendering the taking theft.
  *   **What Varies:** It concerns **whose consent is required and in what form**. It treats the state-citizen relationship as a contract that has not been properly signed. It is a **constraint** based on procedural legitimacy.
  *   **Consent:** Must be explicit. Tacit consent (residence) is invalid because the cost of exit is too high (coercive).
  *   **Truth Value:** Contingently true or false depending on the theory of consent. It is falsifiable if one can demonstrate a valid mechanism of tacit consent.
  *   **Assumptions:** That political obligation is analogous to commercial contract law. That "exit" is the only remedy for non-consent.
  *   **Strongest Objection:** The *Public Goods Objection*. Some goods (defense, drainage, clean air) cannot be opted out of. If you benefit from them, you incur an obligation to pay, regardless of signature. To maintain this thesis, you must argue that one can accept a benefit without incurring an obligation, or that the benefit is illusory.

  **4. The Uncompensated Taking Thesis**
  *   **The Claim:** Taxation is theft *if and only if* the value returned to the taxpayer is less than the value taken. It is a forced exchange at an unfair price.
  *   **What Varies:** It concerns the **imagined counterpart**. The state is not a thief who keeps the take, but a merchant who compels an exchange. It is an **input into a reckoning of costs and benefits**, not an absolute constraint.
  *   **Consent:** Irrelevant if the price is fair. If the price is unfair, consent is retroactively voided.
  *   **Truth Value:** Empirically decidable in principle, though difficult to measure. It could be true or false depending on the specific tax and specific services.
  *   **Assumptions:** That public services can be valued individually and compared against tax liability. That "fair market value" applies to monopoly providers of public goods.
  *   **Strongest Objection:** The *Valuation Objection*. Many benefits (rule of law, stability, infrastructure) are preventative or systemic and cannot be priced per parcel. If you cannot calculate the "price," you cannot determine if the exchange is unfair.

  ---

  ### II. Application to the Stormwater Fee

  You asked which readings license the man to dismiss the fee outright, and which leave the question open.

  **Readings that License Dismissal:**
  *   **The Pre-Political Entitlement Thesis:** If he owns the impervious surface by natural right, the county has no claim to any fee for managing water runoff from it. The lien is an illegitimate encumbrance on natural property. This reading kills the fee instantly.
  *   **The Moral Identity Thesis:** If the threat of a lien is coercive force, the fee is theft regardless of the drainage map. This reading kills the fee instantly.

  **Readings that Leave the Question Open:**
  *   **The Contractual Deficit Thesis:** This leaves the question open to procedural remedies. Did the county follow proper notice? Is there an appeals process? Could he sell the land and exit the jurisdiction? If the procedure was fair, the "theft" claim weakens.
  *   **The Uncompensated Taking Thesis:** This leaves the question entirely open to empirical analysis. Is the fee proportional to the cost of managing the runoff from his specific parcel? If the fee is \$100 and the cost to the system is \$100, it is not theft under this reading. If the fee is \$100 and the cost is \$10, it is theft. This reading transforms the argument from a moral absolute to an accounting dispute.

  ---

  ### III. The Wrinkle: Fee Calibration and Liens

  You asked whether the specific structure of the levy (calibrated charge + lien) shifts the analysis. It does, but unevenly across the readings.

  **1. Sensitivity to Calibration (Fee vs. General Tax)**
  *   **Insensitive:** The *Pre-Political Entitlement* and *Moral Identity* theses are indifferent to calibration. If taking 100% is theft, taking 1% calibrated to burden is also theft. The coercion is the point, not the amount.
  *   **Sensitive:** The *Uncompensated Taking* thesis is highly sensitive. A general tax is a pooled exchange; a calibrated fee is a price for service. If the fee matches the marginal cost of the stormwater burden his parcel creates, the "theft" claim collapses under this reading. He is paying for the capacity he consumes.
  *   **Sensitive:** The *Contractual Deficit* thesis is moderately sensitive. A fee looks more like a voluntary user charge (like a toll) than a tax. If he chooses to keep the impervious surface, is that tacit consent to pay the toll? This strengthens the state's case for consent compared to a general income tax.

  **2. Sensitivity to Sanction (Lien vs. Fine)**
  *   **Insensitive:** The *Moral Identity* thesis sees a lien and a fine as identical threats of force.
  *   **Sensitive:** The *Pre-Political Entitlement* thesis is sensitive. A fine punishes the *person* for an act; a lien encumbers the *property* as a condition of its title. If property rights are pre-political, the state cannot attach conditions to the title it did not grant. However, if the drainage system is an easement inherent to the land, the lien might be framed as enforcing a property covenant rather than collecting a debt. This complicates the "theft" analogy, moving it toward "foreclosure on a mortgage."
  *   **Sensitive:** The *Uncompensated Taking* thesis. A lien implies the debt is attached to the value the property receives from the system. If the property value is sustained by the drainage, the lien is a claim against that value. This makes the "theft" analogy harder to sustain than if the state were garnishing wages.

  **Summary of the Wrinkle:** The more the levy resembles a **price for a specific service secured against the property benefiting from it**, the weaker the "Theft" slogan becomes under the *Uncompensated* and *Contractual* readings. It remains robust only under the *Pre-Political* and *Moral Identity* readings.

  ---

  ### IV. Rhetorical Reality: Usage vs. Utility

  **Which reading do people most often have in mind?**
  Most speakers using the slogan operate with the **Pre-Political Entitlement Thesis** but argue using the **Moral Identity Thesis**.
  They feel the deep intuition that "what is mine is mine" (Entitlement), but they express it by focusing on the coercion ("they will take my house") (Identity). They rarely invoke the *Uncompensated Taking* thesis because that requires admitting that taxation *could* be legitimate if the price were right. They want the absolute prohibition, not the accounting check.

  **Which reading best serves them in an argument?**
  The **Uncompensated Taking Thesis** serves them best, though they seldom use it.
  *   **Why:** The *Pre-Political* and *Moral Identity* theses are easily dismissed by a moderator or opponent as anarchism or semantic games. They shut down conversation.
  *   **The Strategic Advantage:** The *Uncompensated Taking* thesis forces the county to defend the *calibration*. It shifts the burden of proof to the stormwater map. "Show me that my impervious surface causes \$X of damage, and show me this fee equals \$X." If the county's mapping is rough or approximate, the fee *is* vulnerable under this reading.
  *   **The Cost:** Adopting this reading surrenders the moral high ground. It admits that if the math works out, the fee is legitimate. It turns a crusade against tyranny into a dispute over engineering estimates.

  **Conclusion for the Meeting**
  If you hear "taxation is theft" again, listen for the boundary condition.
  If the speaker implies *no amount* would be acceptable, they are holding the **Pre-Political Entitlement** view. You cannot argue them down; you can only outvote them.
  If the speaker implies the *amount* or the *method* is wrong, they are holding the **Uncompensated Taking** view. This is a negotiable position.

  In the specific case of the stormwater fee:
  The **lien** and the **calibration** make the *Uncompensated Taking* reading the most analytically honest tool. The fee is not a general appropriation of wealth; it is a charge for capacity. The "theft" claim holds only if the charge exceeds the burden. If the man at the microphone refuses to engage with the drainage map, he is not arguing against the fee; he is arguing against the state's right to exist. If he is willing to engage with the map, he has already abandoned the slogan's radical core and entered the realm of cost-benefit analysis, where the slogan is no longer useful.
