answer: |-
  Dear Student,

  Here is the design you requested for your seminar handout, constructed to isolate the divergence between contextualism and pragmatic encroachment without relying on the standard bank or airport examples. The scenario is set in a hospital, as this allows for high stakes without invoking sceptical hypotheses or unusual probabilities. The total evidence held by the subject is fixed across both versions, and the conversational context of the attributor is kept strictly low-stakes to ensure contextualism does not predict a shift due to attributor pressure.

  In the main case, Elena is a senior nurse on a busy ward preparing to administer a critical intravenous antibiotic to a patient with a known severe allergy to dosage errors. Her total evidence consists of having checked the patient's chart, verified the prescription against the digital record, and physically inspected the vial label ten minutes prior, all of which confirm the correct dosage is five millilitres. She is not doubting her evidence, nor is she seeking further confirmation, but if she administers the wrong dose, she will be held personally liable for negligence and face immediate dismissal. Down the corridor in the administrative office, David is speaking to a human resources manager, Sarah, while they complete routine compliance paperwork. David says to Sarah, Elena knows the dosage is five millilitres, so we can mark her training module as complete. Their conversation is purely bureaucratic; neither mentions the possibility of error, the patient's condition is not salient to them, and they have nothing riding on whether Elena is right or wrong other than the minor inconvenience of correcting a form. They are aware Elena is administering the drug, but the cost of her error falls entirely on her, not on David or Sarah, and no possibility of mistake has been made salient in their conversation.

  In the control case, the setting and evidence remain identical, but Elena is merely supervising a junior nurse who is physically administering the injection. Elena has checked the chart and the vial just as before, confirming the dosage is five millilitres, but if the wrong dose is given, the junior nurse is liable and Elena faces no professional sanction. Down the corridor, David is speaking to Sarah in exactly the same way, completing the same paperwork, and he says to Sarah, Elena knows the dosage is five millilitres, so we can mark her training module as complete. Their conversational context is unchanged; no error possibilities are salient, and they have nothing at stake in the outcome. The sole difference is that the cost of error now falls on the junior nurse, leaving Elena as a bystander with nothing practical riding on the proposition's truth.

  It is important to state plainly how the two views handle the control case relative to the main case, as this clarifies the design's function. Contextualism predicts no shift in the truth of David's attribution between the main case and the control, because the truth conditions for knowledge are fixed by the attributor's context, which is low-stakes in both scenarios. Pragmatic encroachment, however, does predict a shift between the two cases, because the subject's practical situation changes from high-stakes to low-stakes, altering whether she counts as knowing. This divergence is precisely what allows the handout to discriminate between the views; if neither view predicted a shift, the cases would not pull them apart. In the main case, the verdicts part company at the point of evaluating whether the subject's evidence is sufficient for knowledge given her practical environment. The contextualist says David's assertion is true because David's context sets a low threshold for justification, which Elena's evidence comfortably meets. The pragmatist says David's assertion is false because Elena's high stakes raise the threshold for justification, and her evidence, while strong, does not meet this heightened standard required for rational action in her position.

  Regarding what the subject herself should say, both views actually agree that Elena should not flat-out assert I know the dosage is five millilitres in the main case, though for different reasons. The pragmatist says she does not know, so she should not assert it. The contextualist says that when Elena speaks, she occupies a high-stakes context herself, which raises the standards for her own attribution, so even if David's attribution is true, her own would be false. In the control case, both views agree she may assert that she knows, as her stakes are low. However, the views disagree about the action Elena faces in the main case. The pragmatist says that because she does not know, she is not rational to act on the proposition without further check; she should verify the dose again. The contextualist says she does know relative to David's context, but since knowledge norms of action are often tied to the subject's own context, the contextualist may also advise caution, yet strictly speaking, the divergence lies in the truth of the third-party attribution, not necessarily the action. If the two views agreed on everything the subject and attributor should do and assert, the divergence would be merely notational, but here they disagree on the truth value of David's claim in the main case.

  To close with an honest assessment, the single feature doing the work in this construction is the asymmetry between the subject's stakes and the attributor's stakes. If you remove this asymmetry and make the attributor share the subject's risk, the attributor's context shifts, and contextualism collapses into predicting the same verdict as pragmatism, returning you to the problem your supervisor identified. The strongest attack a committed contextualist would mount on this construction is that the stipulated low-stakes context for David is unstable once the subject's predicament is common knowledge between speaker and hearer. A contextualist might argue that merely knowing Elena faces dismissal makes the possibility of error salient for David, thereby raising his standards regardless of his own practical interests, which would restore the convergence of verdicts. Furthermore, you should warn your students that the intuition the case elicits might be about the propriety of flat-out assertion rather than knowledge itself; readers may feel David should not say Elena knows simply because it is misleading to ignore her risk, even if the proposition is technically true. This case is designed to force that distinction into the open, ensuring your seminar discusses whether knowledge itself is sensitive to practical facts or merely the conversation about it.

  I hope this design serves your seminar well and provides the clarity you need to address your supervisor's criticism.

  Yours sincerely,

  [Your Name]
