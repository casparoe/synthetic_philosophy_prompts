  This is a sophisticated methodological dispute that cuts to the core of what political risk indexing is supposed to do, and while both colleagues raise valid concerns, neither has a monopoly on the truth. Regarding (2), Marta is partly right and partly mistaken. She is clearly right that a process concept implies a trajectory toward a specific outcome, but she is clearly mistaken to suggest that one cannot coherently measure the slide before the regime type has formally changed, as erosion is often visible long before a threshold is crossed. This bears directly on your first question, because while backsliding is parasitic on a status concept in the sense that it requires a definition of what is being eroded, it does not require the erosion to be complete before it is recorded.

  Moving to (3), Dev is partly right and partly mistaken. He is clearly right that continuous component scores convey more nuance than binary flags, but he is clearly mistaken to claim that a definition covering lawful acts is either empty or partisan. This leads into (4), where Marta is clearly right. Her argument about asymmetry supplies the non-partisan criterion you asked about, distinguishing ordinary policy changes from structural alterations that are functionally one-way ratchets designed to entrench the ruling party. Therefore, on your second question, Dev is wrong that legality is the boundary, because Marta's reversibility test allows you to identify democratic erosion even when it is conducted through statutes.

  On the question of baselines in (5), Dev is partly right and partly mistaken. He is clearly right that selecting a baseline involves normative judgments about what constitutes a healthy democracy, but he is clearly mistaken to conclude that this makes measurement impossible rather than simply requiring that the normative template be made explicit. Marta responds in (6) by being clearly right. She correctly identifies that all indices rely on templates and that professed neutrality often shifts the burden of proof onto those alleging harm, which is particularly dangerous in risk assessment where clients need to know the direction of travel. This answers your third question by confirming that while the baseline choice is political in the sense of being normative, it is not arbitrary, and a private publisher has both the standing and the obligation to make that choice if they are selling expert judgment rather than raw data.

  Finally, Dev's closing move in (7) is clearly mistaken. His suggestion to provide only raw data abdicates the core function of a risk index, which is to interpret complex political realities for clients who lack the time or expertise to do so themselves. As for what both of them are missing, neither adequately addresses the question of intent versus effect, nor do they sufficiently incorporate international normative standards that might help fix the baseline without relying solely on domestic history or abstract liberal theory. To your final question, the concept of democratic backsliding does amount to more than a partisan label, provided it is anchored in Marta's asymmetry criterion rather than mere policy disagreement, because it describes a measurable reduction in the competitiveness of the political market that exists independently of who is benefiting from it.
