      *   *Silence:* It might not explain the *legal* mechanics of the German transfer itself (administrative law in Germany) or the specific British legal barriers (1963 Act). It focuses on the recipient side.
      *   *Confirmation vs. Relabeling:* The custody fight confirms the view. It shows the "property" wasn't the main problem; the *authority* was. If it were just property, the title transfer would settle it. The fact that title transfer *ignited* internal dispute proves the Standing Problem is real.
      *   *Where Standing Can't Be Reached:* Cases where the community is stateless, diasporic, or extinguished (e.g., Indigenous remains in North America where tribes weren't recognized, or looted art from destroyed communities). Here, the Nation-State Default swallows everything because there is no alternative claimant with legal standing.

  4.  **Drafting the Response (Iterative Process):**

