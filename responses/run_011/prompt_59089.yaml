      *   *Explanation (vs. Ownership Framing):* Ownership framing sees the 2022 transfer as a closure. Standing framing sees it as a displacement. It explains the EDOMIA vs. NCMM tug-of-war. It explains why the Oba's Palace was sidelined initially.
      *   *Silence:* It doesn't explain the *donor's* constraints well (e.g., why Germany could but UK couldn't). That's domestic administrative law, not postcolonial standing. It also might underplay the risk of state capture/corruption (though it touches on legitimacy).
