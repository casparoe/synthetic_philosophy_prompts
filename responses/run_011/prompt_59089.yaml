answer: |-
  This is a sharp lens. It cuts through the moral posturing of restitution to the administrative mechanics underneath. By shifting the focus from *title* to *representation*, the "Standing Problem" exposes the friction point where postcolonial diplomacy meets local reality.

  Here is the pressure test of the Standing Problem against the German Benin Bronzes episode.

  ### 1. What the Standing Problem Predicts Going In
  If you apply this lens prior to the 2022 transfer, it predicts that the **transfer of title will not equal the resolution of conflict.**

  Standard restitution logic predicts: *Germany holds → Nigeria holds → Justice served.*
  The Standing Problem predicts: *Germany holds → Nigerian State holds → Legitimacy contested by Cultural Source → Conflict displaced domestically.*

  It predicts that by defaulting to the Federal Republic of Nigeria (the entity with legal personality and a foreign ministry), Germany is bypassing the Benin Kingdom (the entity with cultural lineage and moral authority). The lens predicts that once the external pressure (German retention) is removed, the internal tension (who controls the narrative and the physical assets within Nigeria) will explode. It anticipates that the "Nation-State Default" is a bureaucratic convenience for the *donor*, not a moral solution for the *recipient*.

  ### 2. What It Explains That Ownership-Framing Can't
  The ownership frame treats the 2022 handover as a terminus. Once the deed is signed, the ethical debt is cleared. This framing cannot explain why the story didn't end in Berlin or Abuja.

  The Standing Problem explains three specific features of the aftermath:
  *   **The NCMM vs. Oba Friction:** The National Commission for Museums and Monuments (NCMM), a federal agency, technically received the objects. However, the Oba of Benin and the Edo State government have pushed for the objects to be housed in the EDOMIA (Edo Museum of West African Art) trust, which operates with more autonomy from the federal bureaucracy. Ownership framing sees this as a domestic zoning or management dispute. The Standing Problem identifies it as a crisis of **representation**: Does the 1963 Nigerian state represent the 1897 Benin Kingdom?
  *   **The "Model" Narrative:** It explains why the German deal was marketed as a "model" despite the internal ambiguity. For the German Foreign Office, the Standing Problem is invisible; they only need a counterpart with legal personality to sign a treaty. The "success" of the model is measured in diplomatic closures, not local governance stability.
  *   **The Aberdeen/Jesus College Contrast:** It clarifies why non-state bodies could move faster. They weren't bound by the "Nation-State Default" of international diplomacy. They could negotiate directly with community representatives (or at least pretend to) without needing to route everything through a foreign ministry. The Standing Problem highlights that state-to-state restitution is inherently more rigid because it reinforces the very border structures that often severed the cultural connection in the first place.

  ### 3. Where the Lens Goes Silent
  The Standing Problem is a recipient-side critique. It goes silent on the **donor-side legal constraints** that have nothing to do with postcolonial standing.
  *   **The British Museum Barrier:** The lens doesn't explain the 1963 British Museum Act. That is a matter of UK domestic administrative law and the concept of inalienability of public collections. Whether the Oba or the Nigerian President has better standing is irrelevant if the British trustee legally *cannot* dispose of the asset.
  *   **German Administrative Law:** Conversely, it doesn't fully explain why Germany *could* move. That was due to specific rulings on public property ownership (Länder vs. Federal) and moral pressure, not necessarily a superior grasp of standing.
  *   **Security and Preservation:** The lens focuses on political legitimacy. It risks underplaying the pragmatic reasons why federal custody might be preferred (e.g., insurance, climate control, security funding) which sometimes necessitates the "Nation-State Default" regardless of cultural standing.

  ### 4. Does the Custody Fight Confirm the View or Relabel Property?
  The custody fight inside Nigeria **confirms the Standing Problem.**

  If this were merely an ordinary property dispute, the transfer of title from Germany to the Federal Republic of Nigeria would have settled the matter. Property law is generally binary: you own it or you don't. The Federal Government owns it. Case closed.

  The fact that the transfer *ignited* a contest over custody, management, and display proves that the core asset being fought over is not the bronze itself, but the **authority to curate history.** The Oba's Palace isn't arguing property title in a common law sense; they are arguing *stewardship legitimacy*.

  If you label this just a "property dispute," you miss the point. A property dispute implies a fungible asset and a clear chain of title. Here, the chain of title is clear (Germany → Nigeria), but the chain of *authority* is broken. The Standing Problem correctly identifies that the "Nation-State Default" created a vacuum of legitimacy that property law cannot fill. It shows that restitution without standing resolution is just **conflict outsourcing.**

  ### 5. Where It Bites Differently: The "Standing Void"
  The lens bites most viciously where the Standing Question **cannot even be reached.**

  In the Benin case, there *is* a recognized traditional authority (the Oba) and a recognized state (Nigeria). The conflict is between them. But consider cases where the Standing Problem encounters a **Standing Void**:
  *   **Stateless or Destroyed Communities:** Looted artifacts from communities that no longer exist as political entities (e.g., certain Indigenous groups in North America prior to recognition, or artifacts from regions where borders have dissolved).
  *   **The Palestinian Case:** Who speaks for cultural heritage in contested territories? The PA? The PLO? Local municipalities? Israel? The "Nation-State Default" fails because there is no consensus on the nation-state itself.
  *   **Diasporic Heritage:** Enslaved peoples' artifacts. There is no "state" to receive them. The Standing Problem predicts that in these cases, restitution will stall indefinitely because the "default" mechanism (Foreign Ministry to Foreign Ministry) has no socket to plug into.

  In these voids, the Standing Problem predicts that museums will retain objects not because of legal bar (like the 1963 Act), but because of **administrative paralysis.** They cannot return objects because they cannot identify a sovereign counterpart. The lens reveals that the "Nation-State Default" is not just a convenience; it is a **gatekeeping mechanism.** If you don't have a state, you don't have standing. If you don't have standing, you don't get restitution.

  ### Verdict
  The Standing Problem holds up. It successfully predicts that the German Benin transfer would displace conflict rather than resolve it. It explains the internal Nigerian friction as a crisis of representation rather than management. It exposes the "Nation-State Default" as a diplomatic convenience that often reinforces colonial borders over cultural realities.

  Its only weakness is that it is less useful for analyzing the *donor's* legal inability to act (like the British Museum), but as a tool for analyzing the *politics of receipt*, it is robust. It proves that restitution is not a transaction of objects, but a negotiation of sovereignty.
