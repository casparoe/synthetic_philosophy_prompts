  2.  **Deconstruct the "Standing Problem" Lens:**
      *   *Premise:* Restitution isn't just property law; it's political representation.
      *   *Mechanism:* The "Nation-State Default" bypasses local/indigenous authority in favor of bureaucratic state apparatus.
      *   *Prediction:* If you hand objects to the State without resolving internal standing, you don't solve the moral injury; you just displace the conflict from an international axis (Global North vs. South) to a domestic axis (State vs. Community).

  3.  **Apply to the Benin/German Case:**
      *   *Prediction:* The lens predicts friction upon arrival. If the "speaker" (Nigerian State) doesn't match the "source community" (Benin Kingdom/Edo people), conflict is inevitable.
