      *   **Test Case:** The German Benin Bronzes transfer (2022).
      *   **Key Facts of Test Case:** Germany transferred ownership to the Nigerian state. Marketed as a model. British Museum stuck (1963 Act). Aberdeen/Jesus College moved (non-state bodies). Post-transfer, there's internal contestation in Nigeria (Federal Commission vs. Oba's Palace vs. Edo State vs. Private Trust/EDOMIA).
      *   **Questions to Answer:**
          1.  What does the Standing Problem predict going into a case like this?
