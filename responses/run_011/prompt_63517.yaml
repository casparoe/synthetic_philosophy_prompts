  I am in the third week of a seminar on providence, divine foreknowledge, and human freedom. So far we have worked almost exclusively with the contemporary analytic literature on middle knowledge — God's putative knowledge of counterfactuals of creaturely freedom, and whether such counterfactuals have truth-makers prior to any divine decree. This week our instructor assigned older continental background reading before the next session, and I was given the Catholic Encyclopedia's article on Molinism (early twentieth century; my copy does not name the author). I find the prose considerably harder going than the journal articles, and I am worried that I am silently importing my contemporary framing onto it. Below are the two blocks I am working with; spelling, typography, capitalization, and Latin terms are as printed, and I have marked omitted material with ellipses.

  Block 1 — the opening of the article:

  "The name used to denote one of the systems which purpose to reconcile grace and free will. This system was first developed by Luis de Molina, and was adopted in its essential points by the Society of Jesus. It is opposed by the Thomistic doctrine of grace — the term Thomism has a somewhat wider meaning — whose chief exponent was the Dominican Bañez. Along lines totally different from those of Molina, this subtile theologian endeavours to harmonize grace and free will on principles derived from St. Thomas. Whereas Molinism tries to clear up the mysterious relation between grace and free will by starting from the rather clear concept of freedom, the Thomists, in their attempt to explain the attitude of the will towards grace, begin with the obscure idea of efficacious grace. The question which both schools set themselves to answer is this: Whence does efficacious grace (gratia efficax), which includes in its very concept the actual free consent of the will, derive its infallible effect; and how is it that, in spite of the infallible efficacy of grace, the freedom of the will is not impaired? It is evident that, in every attempt to solve this difficult problem, Catholic theologians must safeguard two principles: first, the supremacy and causality of grace (against Pelagianism and Semipelagianism), and second, the unimpaired freedom of consent in the will (against early Protestantism and Jansenism). For both these principles are dogmas of the Church, clearly and emphatically defined by the Council of Trent. Now, whilst Thomism lays chief stress on the infallible efficacy of grace, without denying the existence and necessity of the free cooperation of the will, Molinism emphasizes the unrestrained freedom of the will, without detracting in any way from the efficacy, priority, and dignity of grace. As in the tunnelling of a mountain, galleries started by skilful engineers from opposite sides meet to form but one tunnel, thus it might have been expected that, in spite of different and opposite starting-points, the two schools would finally meet and reach one and the same scientific solution of the important problem. If we find, however, that this is not the case, and that they passed each other along parallel lines, we are inclined to attribute this failure to the intricate nature of the subject in question, rather than to the inefficiency of the scholars. The problem seems to lie so far beyond the horizon of the human mind, that man will never be able fully to penetrate its mystery."

  Block 2 — further on in the same article:

  "Molinism escaped every suspicion of Pelagianism by laying down at the outset that the soul with its faculties (the intellect and the will) must be first constituted by prevenient grace a supernatural principle of operation in actu primo, before it can, in conjunction with the help of the supernatural concursus of God, elicit a salutary act in actu secundo. [...] It must not be imagined, however, that the will has such an influence on grace that its consent conditions or strengthens the power of grace; the fact is rather that the supernatural power of grace is first transformed into the vital energy of the will, and then, as a supernatural concursus, excites and accompanies the free and salutary act. In other words, as a helping or co-operating grace (gratia adiuvans seu cooperans), it produces the act conjointly with the will. [...] Thus the act is produced entirely by God as First Cause (Causa prima), and also entirely by the will as second cause (causa secunda). The unprejudiced mind must acknowledge that this exposition is far from incurring the suspicion of Pelagianism or Semipelagianism."

  Please answer under the following headings, in this order, and roughly to the lengths indicated. I am not asking for a bibliography or suggestions for further reading; I want your reading of this text. Where you are drawing on background doctrinal knowledge rather than on what the passage itself supplies, say so explicitly, and flag anything you are unsure about or any place where you think my question rests on a misreading.

  1. **The problem as the article states it** (about 300 words). Reconstruct in plain English the single question the article says both schools set themselves to answer, and the two principles it says must be safeguarded. Explain why each principle is paired with the positions it is directed against — Pelagianism and Semipelagianism on one side, early Protestantism and Jansenism on the other — and what those four positions jointly imply about the shape of the space being divided up.

  2. **Technical vocabulary** (about 250 words). A short list glossing efficacious grace, prevenient grace, the supernatural concursus, gratia adiuvans seu cooperans, in actu primo and in actu secundo, and Causa prima and causa secunda. For each, one or two sentences on the work the term is doing in this particular argument, rather than a general definition.

  3. **The tunnel and the parallels** (about 200 words). What is the tunnelling metaphor doing? The article first says galleries started from opposite sides meet to form one tunnel, and then says the two schools passed each other along parallel lines. Is that a correction of the metaphor, a mixed metaphor, or a deliberate contrast between what one would expect and what happened? And what does the author's diagnosis — the intricacy of the subject rather than the inefficiency of the scholars — commit him to about the two systems?

  4. **Where middle knowledge would go** (about 350 words). Neither block mentions scientia media, conditioned futures, or counterfactuals of creaturely freedom at all; the whole dispute is framed as a question about the infallible efficacy of grace. Is that framing consistent with the way Molinism is standardly presented to us, as primarily a theory of divine knowledge? Tell me where in the article's schema middle knowledge would be doing its work: does it answer the question the article poses, or does it quietly substitute a different question for that one? If you think what is described here is a later, congruist-style development of Molina's own position rather than Molina's position, say so, and point to what in the text supports that reading.

  5. **On "conditions"** (about 250 words). The article insists that the will's consent does not condition or strengthen the power of grace, yet Molinism is usually described as turning precisely on conditioned futures. Is "conditions" being used in the same sense in the two contexts? If not, what exactly is being denied here, and how does that denial sit with the claim that the act is produced entirely by God as First Cause and also entirely by the will as second cause — is that a resolution of the problem, or a restatement of it?

  6. **Confessional framing** (about 150 words). The article at one point says that the unprejudiced mind must acknowledge that this exposition escapes suspicion of Pelagianism. How much should a reader discount for advocacy? Distinguish what in these two blocks is description of the position from what is evaluation of it, and note any place where the evaluation is doing argumentative work by stealth.

  7. **Two things to raise in seminar** (about 120 words). The two questions I should bring to class that genuinely come out of this text rather than out of the contemporary literature we have been reading.
