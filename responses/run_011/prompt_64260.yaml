prompt: |-
  I'm the entire compliance function at a mid-size packaged food company — granola bars, cold-pressed juices, frozen bowls, about $180M a year — and everything that goes out the door with a claim on it eventually lands on my desk: front-panel copy, packaging artwork, ad scripts, influencer briefs, sales decks, and the answers our reps give to retailer questionnaires. It's maybe twenty to forty items a week, most of them trivial, but three or four a week turn into an actual argument with marketing, and I have roughly fifteen minutes per item and no budget to run things past outside counsel unless it's a real problem. My current procedure is basically "is every word literally true, and would a regulator hate it," and it broke last month. We put "no added sugar" on the front of a kids' juice drink that's sweetened with white grape juice concentrate, a consumer group complained, a plaintiff firm sent a letter, and my written answer — every word is literally true, the ingredient panel discloses everything — did not satisfy our GC at all. She said the literal-truth point is beside the point legally, and maybe not even the point ethically, and she's asked me for a real written procedure before the next label cycle. Here's the mess I'm in: I've read enough to know there are two different frameworks that use the same vocabulary. There's the philosophy side — whether lying requires an intention to deceive, whether you can lie at all without saying anything false, what's said versus what's merely implicated — and there's the legal side, where the FTC's deception policy statement (the 1983 one, appended to that Cliffdale case I think) makes the test the overall or net impression a claim leaves on a reasonable consumer, materiality, and omissions, and explicitly says literal truth doesn't save you. I need the procedure to keep those two tracks visibly separate, because half our internal fights are people citing one standard when the other is the relevant one.

  So: please write the procedure my team could actually run. Concretely I want an ordered set of questions with a pass/fail criterion for each, and what counts as sufficient evidence at each step (lab data, the ingredient panel, a consumer perception survey we obviously can't afford, someone's sworn recollection of what they meant). I want it to output two separate verdicts — legal exposure, and whether we've lied as opposed to merely misled as opposed to done nothing wrong — plus an explicit list of the situations where those two verdicts come apart and what we do about that divergence, because that's where I keep getting steamrolled. I want the escalation triggers spelled out: the kinds of item where the procedure stops and goes to me, and the kinds where it goes to the GC because I'm not qualified. I want every step that is really a judgment call dressed up as a procedure to be flagged as such rather than given a fake threshold. And I want you to tell me which distinctions from the lying/misleading literature actually have to survive the simplification into a one-pager for marketing people with no philosophy and no legal training, which ones I can safely drop for a food company, and why — plus an honest section on where the procedure will misfire, both false positives that will make me the most annoying person in the building and false negatives that will get us sued.

  Then run it on four things we've genuinely been arguing about. (1) The "no added sugar" kids' drink sweetened with grape juice concentrate, where our position is that concentrate is fruit, not sugar. (2) A snack bar whose front panel says "0 g trans fat" next to a little heart illustration, which is exactly what the labeling rule requires us to write because the per-serving amount is under the 0.5 g rounding threshold. (3) A totally clean one, so I can see the procedure not crying wolf: a bar claiming "10 g protein" that meets the nutrient-content threshold, is true, and has no health halo around it. And (4) the one that's going to get me in trouble — an email our VP of supply chain sent answering a big retailer' sustainability questionnaire, saying our wrapper film is "made from recycled material and fully recyclable," which is true of the resin and false in practice because it's a multilayer laminate that no municipal program in the country accepts; the VP knew that, and also knew the retailer was under pressure to hit its own recyclability numbers. Please give the fourth one the same treatment as the others even though the answer will not be welcome upstairs.

  One more thing about how confident I want you to be. The legal track is more or less settled and I'd like you to write it that way. The philosophy track is not: whether lying needs an intention to deceive, whether you need to believe the thing is false, whether implicature can ever amount to lying, and how much moral work the said/implicated line does — those are live disagreements among people who know this material, and I don't want the procedure quietly built on one side of them and then handed to me as if it were neutral. Where a step depends on taking a contested position, mark it, say which side it assumes, and say what would change operationally if the other side turned out right. And on one question I'd rather you just commit than hedge: once the net-impression test has been run and failed, does "but it was literally true" deserve any independent weight at all — in the legal verdict, in the blameworthiness verdict, or in what we do next (correct it, disclose more, discipline someone, nothing)? Pick a side and defend it briefly, because that's the exact question our GC asked me and I still don't have an answer I'd want to say out loud.
reasoning: |-
  Here's a thinking process that leads to the suggested compliance procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Sole compliance function at a mid-size packaged food company ($180M revenue).
      *   **Workload:** 20-40 items/week, 15 mins/item, no outside counsel budget unless critical.
      *   **Problem:** Current "literal truth" standard failed (Grape Juice Concentrate "No Added Sugar" incident). GC wants a real procedure separating *Legal Exposure* (FTC/FDA standard) from *Ethical/Philosophical Lying* (Intent/Implicature).
      *   **Requirements:**
          *   Ordered set of questions with pass/fail criteria.
          *   Evidence standards for each step (lab data, ingredient panel, etc.).
          *   Two separate verdicts (Legal Exposure vs. Ethical Lying/Misleading).
          *   Explicit handling of divergence between verdicts.
          *   Escalation triggers (Compliance vs. GC).
          *   Flagging of judgment calls (no fake thresholds).
          *   Simplification of philosophy literature (what to keep/drop for marketing).
          *   Honest section on failure modes (false positives/negatives).
          *   **Confidence Level:** Legal track = settled/confident. Philosophy track = acknowledge live disagreements/contested positions, but *commit* on the "Literal Truth vs. Net Impression" question.
          *   **Application:** Run the procedure on four specific cases (Grape Juice, Trans Fat/Heart, Clean Protein, Recyclable Laminate).

  2.  **Deconstruct the Legal Track (FTC/FDA):**

      *   *Core Standard:* FTC Policy Statement on Deception (1983).
      *   *Elements:* (1) Representation, omission, or practice; (2) Likely to mislead reasonable consumer; (3) Material (influences conduct).
      *   *Key Principle:* Literal truth is *not* a defense if the net impression is false.
      *   *FDA:* Similar, but more prescriptive on nutrient content claims (NCCs). "No Added Sugar" has a specific regulatory definition (21 CFR 101.60(c)).
      *   *Evidence:* Regulatory text, lab data, ingredient statements, established consumer perception (sometimes surveys, but often regulatory precedent).

  3.  **Deconstruct the Philosophy Track (Lying/Misleading):**

      *   *Core Debates:*
          *   Definition of Lying: Does it require intent to deceive? (Standard view: Yes. Some views: No, just asserting what you believe false).
          *   Implicature vs. Saying: Can you lie by implicating? (Gricean pragmatics).
          *   Moral Weight: Is misleading worse than lying? (Often lying is seen as worse, but misleading can be equally harmful).
      *   *Simplification for Marketing:* Marketing doesn't care about Kant. They care about "Are we bullshitting?" vs. "Are we technically right?"
      *   *Decision:* I need to adopt a workable definition for the procedure. I will use a modified "Standard View" (Intent + False Belief + Assertion/Implicature) but flag the contested nature of implicature.
      *   *The "Commit" Question:* Does literal truth matter if net impression fails? *Decision:* No. Legally, it's irrelevant. Ethically, it's a shield for cowardice, not honesty. I will argue this firmly.

  4.  **Drafting the Procedure (The "Compliance Filter"):**

      *   *Structure:* Intake -> Legal Screen -> Ethical Screen -> Verdict -> Escalation.
      *   *Time Limit:* Must be doable in 15 mins.
      *   *Evidence:* Must rely on accessible docs (specs, regs, emails).
      *   *Divergence:* What if it's Legal Pass / Ethical Fail? (Brand risk). What if Legal Fail / Ethical Pass? (Unlikely, but maybe technical violation).

  5.  **Addressing the Philosophy Simplification:**

      *   *Keep:* Intent to deceive, Net Impression vs. Literal Text.
      *   *Drop:* Gricean maxims, deep epistemic conditions (belief vs. knowledge), nuanced moral culpability scales.
      *   *Why:* Marketing needs binary signals, not seminars.

  6.  **Addressing the Failure Modes:**

      *   *False Positives:* Killing safe claims due to risk aversion (annoys marketing).
      *   *False Negatives:* Missing subtle implications (gets sued).

  7.  **Running the Four Cases:**

      *   *Case 1 (Grape Juice):* Legal Fail (FDA def of "added sugar" includes concentrate). Ethical Fail (Intent to exploit loophole).
      *   *Case 2 (Trans Fat/Heart):* Legal Pass (FDA rounding rule allows "0g"). Ethical Divergence (Legal Pass, but Ethical Fail/Misleading due to Heart icon implying benefit that doesn't exist at that level). *Correction:* Actually, FDA restricts nutrient content claims if there's trans fat, but "0g" is allowed if <0.5. However, the *heart* implies heart health. This is the divergence point.
      *   *Case 3 (Protein):* Legal Pass. Ethical Pass. Boring.
      *   *Case 4 (Recyclable Laminate):* Legal Fail (FTC Green Guides). Ethical Fail (Lie/Deception). High Escalation.

  8.  **Refining the "Commit" on Literal Truth:**

      *   The prompt asks me to pick a side on whether "but it was literally true" deserves weight after net impression fails.
      *   *My Stance:* It deserves *zero* weight in the Legal Verdict. In the Ethical Verdict, it reduces *culpability* slightly (maybe not malicious fraud, but negligence), but does not change the *action* (must correct). I will defend this: Relying on literal truth when net impression fails is "paltering," which is functionally deception.

  9.  **Review against Constraints:**

      *   *Tone:* Professional, direct, acknowledging the user's burden.
      *   *Format:* Structured procedure, then analysis of cases.
      *   *Philosophy Nuance:* Explicitly mark where philosophical consensus breaks down.
      *   *Escalation:* Clear triggers for GC.

  10. **Final Polish:**

      *   Ensure the distinction between FDA (strict labeling) and FTC (advertising/deception) is clear where needed, but unified for the "Net Impression" test.
      *   Make sure the "15-minute" constraint is respected (evidence requirements must be quick to check).
      *   Check the "Recyclable" case sensitivity (FTC Green Guides are the key here).

  *(Self-Correction during drafting)*: I initially thought about separating FDA and FTC completely. But for a 15-minute screen, they blend into "Regulatory Compliance" vs. "Deception." I will unify them under "Legal/Regulatory Risk" but specify the source of truth (CFR vs. Policy Statement).
  For the Philosophy track, I need to be careful not to sound like I'm teaching a class. It needs to be a checklist. "Did you intend for them to think X?" is better than "Did you assert X via conversational implicature?"

  *On the "Literal Truth" Commitment:* I need to be strong here. The GC's point was that literal truth is beside the point. I will align with her.

  *On the Trans Fat case:* This is tricky. FDA allows "0g trans fat" if <0.5g. But if the product has 0.4g of trans fat, claiming "0g" is legally compliant. However, adding a *heart* suggests it's heart healthy. If the product is high in sat fat, the heart is misleading. I will assume the prompt implies the heart creates a health halo that isn't justified.

  *On the Recyclable case:* FTC Green Guides say "Recyclable" requires 60% of consumers to have access to recycling. If no municipal program accepts it, it's deceptive.

  Let's build the document.cw
answer: |-
  Here is the procedure, the philosophical rationale, and the application to your four cases.

  ## Part 1: The "Net Impression" Compliance Procedure (v1.0)

  **Purpose:** To separate *Regulatory/Legal Risk* from *Ethical/Brand Risk* within a 15-minute review window.
  **Scope:** All consumer-facing claims (packaging, ads, scripts, questionnaires).
  **Constraint:** This is a triage tool, not a legal opinion. If a step flags "Escalate," you stop and send it up.

  ### Phase 1: The Legal/Regulatory Screen (The "Can We?" Test)
  *Standard: FTC Deception Policy (1983) & FDA/USDA Labeling Regulations.*
  *Goal: Determine exposure to enforcement or class action.*

  **Q1.1: Is there a specific regulatory definition for this claim?**
  *   **Check:** 21 CFR (FDA), 9 CFR (USDA), or FTC Green Guides.
  *   **Evidence:** Regulatory text vs. product spec sheet (BOM, lab analysis).
  *   **Pass:** Claim meets all technical thresholds (e.g., "Low Sodium" < 140mg).
  *   **Fail:** Claim misses technical threshold (e.g., "No Added Sugar" but contains juice concentrate).
  *   **Judgment Call:** If the regulation is ambiguous (e.g., "Natural"), proceed to Q1.2 but flag for GC.
  *   **Escalation:** If the claim touches a "High Risk" category (Gluten-Free, Organic, Disease/Health claims), escalate to GC immediately.

  **Q1.2: The "Reasonable Consumer" Net Impression Test.**
  *   **Question:** Taking the text, images, and context together, what is the *one main thing* a shopper believes this says?
  *   **Evidence:** Mock-up artwork, adjacent icons (hearts, leaves), placement (front panel vs. back).
  *   **Pass:** The net impression matches the literal truth *and* the regulatory reality.
  *   **Fail:** The net impression creates a false belief, even if individual words are technically true.
  *   **Note:** *Literal truth is not evidence here.* If the net impression is false, this step fails regardless of ingredient panel disclosures.
  *   **Escalation:** If the net impression relies on an omission (e.g., "Made with Real Fruit" but 99% sugar), escalate to GC.

  **Q1.3: Materiality.**
  *   **Question:** Would this belief influence a purchase decision?
  *   **Evidence:** Marketing brief (what attribute are they selling?), competitor benchmarks.
  *   **Pass:** Claim is puffery or irrelevant to purchase (rare for front panel).
  *   **Fail:** Claim addresses price, health, safety, or environmental impact.
  *   **Verdict:** If Q1.1 or Q1.2 is **FAIL**, Legal Verdict = **HIGH EXPOSURE**. Stop.

  ---

  ### Phase 2: The Ethical/Intent Screen (The "Should We?" Test)
  *Standard: Modified Standard View of Lying (Intent + Belief + Assertion).*
  *Goal: Determine brand integrity and internal culpability.*

  **Q2.1: The Belief Condition.**
  *   **Question:** Does the claim sponsor (Marketing/Supply Chain) *believe* the net impression is accurate?
  *   **Evidence:** Email trail, brief comments, verbal confirmation.
  *   **Pass:** They believe the consumer takeaway is true.
  *   **Fail:** They know the consumer takeaway is false, but argue the *words* are true.
  *   **Philosophical Flag:** *Contested.* Some philosophers argue lying requires asserting what you believe is *false*. Others argue it requires an *intent to deceive*. This question assumes the **Standard View**: You are lying if you assert (or implicate) what you believe is false *with the intent to deceive*. If you believe it's true but are negligent, it's misleading, not lying.

  **Q2.2: The Implicature Check.**
  *   **Question:** Are we relying on the consumer to "read between the lines" to find the truth?
  *   **Evidence:** Font size disparities, qualifying asterisks, "technically true" defenses.
  *   **Pass:** The claim is explicit and direct.
  *   **Fail:** The truth is hidden in the fine print; the front panel relies on implication.
  *   **Philosophical Flag:** *Contested.* Gricean pragmatics suggests implicature is part of "what is said." Legal standards agree. Ethical standards vary. This procedure treats **deceptive implicature as ethically equivalent to false assertion**.

  **Q2.3: The "Paltering" Defense.**
  *   **Question:** Is the defense of this claim primarily "But we didn't *say* X"?
  *   **Evidence:** Meeting notes where legal/compliance pushed back and marketing cited literal truth.
  *   **Pass:** No reliance on literal truth as a shield against net impression.
  *   **Fail:** The justification is "It's literally true."
  *   **Commitment:** *See Part 3 below.*

  **Verdict:**
  *   **Clean:** Pass Q2.1, Q2.2, Q2.3.
  *   **Misleading:** Fail Q2.2 or Q2.3, but Pass Q2.1 (Negligence/Omission).
  *   **Lying:** Fail Q2.1 (Intent to deceive).

  ---

  ### Phase 3: Divergence & Escalation Matrix

  | Legal Verdict | Ethical Verdict | Action Required | Escalation |
  | :--- | :--- | :--- | :--- |
  | **High Exposure** | **Any** | **KILL / FIX** | **GC (Mandatory)** |
  | **Low Exposure** | **Lying** | **KILL** | **CMO + GC** (Brand Risk) |
  | **Low Exposure** | **Misleading** | **WARN / MODIFY** | **Compliance (You)** |
  | **Low Exposure** | **Clean** | **APPROVE** | **None** |

  **Escalation Triggers (To GC):**
  1.  Any Legal High Exposure.
  2.  Any Ethical "Lying" verdict (Intent to deceive).
  3.  Any claim regarding Safety, Allergens, or Regulatory Definitions (FDA/USDA) where you are interpreting ambiguity.
  4.  Any B2B/Retailer Questionnaire regarding Compliance/Sustainability (Higher fraud risk).

  **Escalation Triggers (To You):**
  1.  Ethical "Misleading" verdicts (Negligence).
  2.  Puffery disputes.

  ---

  ### Part 2: Philosophical Simplification & Failure Modes

  **What I Dropped (And Why):**
  1.  **The "Belief" Nuance:** Philosophers debate whether you can lie if you tell the truth but *believe* it is false. For food compliance, this is irrelevant. If they believe it's false, they shouldn't say it. I collapsed this into Q2.1.
  2.  **Moral Culpability Scales:** I am not asking you to grade the *sin*. I am asking you to grade the *risk*. "Lying" here maps to "Reputational Catastrophe," not "Kantian Imperative Violation."
  3.  **Gricean Maxims:** Marketing doesn't know "conversational implicature." I translated this to "Reading between the lines" (Q2.2).

  **What Survived:**
  1.  **Intent:** Crucial for distinguishing malice from negligence.
  2.  **Said vs. Implicated:** Crucial because 90% of your fights are about what the image *suggests* vs. what the text *says*.

  **Failure Modes (Honest Assessment):**
  *   **False Positives (The "Nanny" Problem):** This procedure will flag aggressive but legal marketing (e.g., dramatic lighting on fruit that isn't in the bar). You will become the "Department of No." *Mitigation:* Use the "Misleading" verdict to allow modification rather than killing the claim.
  *   **False Negatives (The "Loophole" Problem):** A clever marketer can draft a claim that passes the Net Impression test because the "Reasonable Consumer" is a legal fiction. If a plaintiff's bar designs a survey showing 60% of consumers were misled, this procedure won't catch it because you can't run surveys. *Mitigation:* Escalate any claim where the "Literal Truth" defense is the *only* defense.

  ---

  ### Part 3: The Commitment on Literal Truth

  **Question:** Once the net-impression test has failed, does "but it was literally true" deserve any independent weight?

  **My Stance:** **No.**

  **Defense:**
  In the **Legal Verdict**, it deserves zero weight. The FTC *Cliffdale* standard is explicit: literal truth is not a defense against deception. A claim that creates a false net impression is actionable regardless of semantic technicalities. Citing literal truth here is legally frivolous.

  In the **Ethical Verdict**, it deserves negative weight. Relying on literal truth to defend a false net impression is **paltering** (the active use of truthful statements to convey a misleading impression). Research in behavioral ethics suggests paltering is often judged as harshly as lying by the *victim*, even if the *palterer* feels morally superior. It signals that the company values technical compliance over consumer understanding.

  **Operational Consequence:** If Legal fails (Net Impression is false), the "Literal Truth" argument cannot be used to downgrade the risk level. It moves from "Fix this" to "Fix this and explain why you thought this was acceptable."

  ---

  ### Part 4: Running the Procedure on Your Four Cases

  #### Case 1: Kids' Juice, "No Added Sugar," Sweetened with Grape Concentrate
  *   **Phase 1 (Legal):**
      *   Q1.1 (Reg Def): **FAIL.** FDA 21 CFR 101.60(c)(4) defines "No Added Sugar" to exclude juice concentrates. Concentrate *is* added sugar in this context.
      *   Q1.2 (Net Impression): **FAIL.** Reasonable consumer believes "No Added Sugar" means no sweeteners other than whole fruit.
      *   *Legal Verdict:* **HIGH EXPOSURE.**
  *   **Phase 2 (Ethical):**
      *   Q2.1 (Belief): **FAIL.** Marketing knew concentrate was the sweetener.
      *   Q2.3 (Paltering): **FAIL.** Defense was "Concentrate is fruit."
      *   *Ethical Verdict:* **LYING.** (Intent to exploit regulatory gap).
  *   **Outcome:** **KILL.** Escalate to GC. This is the lawsuit you already have. The "Literal Truth" defense is invalid per Part 3.

  #### Case 2: Snack Bar, "0g Trans Fat" + Heart Icon
  *   **Phase 1 (Legal):**
      *   Q1.1 (Reg Def): **PASS.** FDA allows "0g" if <0.5g per serving.
      *   Q1.2 (Net Impression): **FAIL.** The heart icon implies "Heart Healthy." If the bar has 0.4g trans fat (partially hydrogenated oil) or is high in saturated fat, the *health implication* is false even if the *number* is rounded.
      *   *Legal Verdict:* **HIGH EXPOSURE.** (FTC action on implied health claims).
  *   **Phase 2 (Ethical):**
      *   Q2.1 (Belief): **PASS/FAIL Borderline.** Marketing may believe "0g" makes it healthy.
      *   Q2.2 (Implicature): **FAIL.** Relying on the heart to do the work the text can't.
      *   *Ethical Verdict:* **MISLEADING.**
  *   **Outcome:** **MODIFY.** Remove Heart Icon. Escalate to GC to confirm FDA stance on implied claims with trans fat presence. *Note:* This is a divergence case. Legal rounding is allowed, but the *context* makes it deceptive.

  #### Case 3: Protein Bar, "10g Protein" (Clean)
  *   **Phase 1 (Legal):**
      *   Q1.1 (Reg Def): **PASS.** Meets threshold.
      *   Q1.2 (Net Impression): **PASS.** No health halo, just nutrient content.
      *   *Legal Verdict:* **LOW EXPOSURE.**
  *   **Phase 2 (Ethical):**
      *   Q2.1 (Belief): **PASS.**
      *   Q2.2 (Implicature): **PASS.**
      *   *Ethical Verdict:* **CLEAN.**
  *   **Outcome:** **APPROVE.** No escalation. This shows the procedure doesn't cry wolf on compliant claims.

  #### Case 4: Supply Chain Email, "Fully Recyclable" Laminate
  *   **Phase 1 (Legal):**
      *   Q1.1 (Reg Def): **FAIL.** FTC Green Guides §260.12. "Recyclable" claim requires 60% of consumers to have access to recycling programs. If *no* municipal program accepts it, this is deceptive.
      *   Q1.2 (Net Impression): **FAIL.** Retailer and consumers believe it can be put in a bin.
      *   *Legal Verdict:* **HIGH EXPOSURE.** (FTC Green Guides enforcement + Retailer Fraud).
  *   **Phase 2 (Ethical):**
      *   Q2.1 (Belief): **FAIL.** VP knew it was false in practice.
      *   Q2.3 (Paltering): **FAIL.** "True of the resin" is a literal truth shield for a false product claim.
      *   *Ethical Verdict:* **LYING.** (Knowledge of falsity + Intent to secure retailer benefit).
  *   **Outcome:** **KILL / CORRECT.** Escalate to GC **IMMEDIATELY**.
      *   *Why this is dangerous:* This is not just marketing puffery; this is a B2B representation regarding compliance/sustainability. This exposes the company to fraud claims from the retailer, not just consumer class actions.
      *   *Action:* Retract the statement to the retailer. Do not send the corrected version without GC approval. The VP's knowledge makes this a personnel/discipline issue, not just a copy fix.

  ### Final Note on the "Recyclable" Case
  You mentioned this one will get you in trouble upstairs. That is correct. This procedure identifies it as a **Legal Fail / Ethical Lie**.
  If you run this procedure and output "Low Risk" on Case 4, you are personally liable for negligence.
  If you output "High Risk," the VP will be angry.
  **Choose the anger.** The GC asked for a procedure that separates legal truth from literal truth. Case 4 is the exact scenario she is worried about: a technically defensible sentence ("made from recycled material") used to conceal a material falsehood ("fully recyclable"). Under the **Part 3 Commitment**, the literal truth of the resin composition grants you no cover. The Net Impression is "You can recycle this wrapper." That is false. The procedure must flag it.
