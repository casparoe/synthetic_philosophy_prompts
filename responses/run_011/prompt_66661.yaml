prompt: |-
  I am a health economist working in cost-effectiveness analysis for a national health technology assessment body. My day job is to convert clinical trial outputs into QALYs, to work with the EQ-5D value sets my agency has endorsed, and to argue about elicitation instruments — standard gamble, time trade-off, discrete choice experiments, person trade-off — and the disability weights they generate. I also build models with distributional weights, in which gains to people who already command more healthy life expectancy are deliberately discounted. I have read some welfare economics, but I have no real training in the philosophical literature on measurement and aggregation.

  I would like the philosophical debate over interpersonal utility comparisons restated in the vocabulary I actually use — value sets, elicitation tasks, invariance classes, the informational content of an index, the weights in an aggregate objective function — rather than in the vocabulary of a welfare economics textbook, which tends to compress the debate into a single remark about cardinal versus ordinal utility. Please translate the following positions, one at a time:

  1. Robbins's charge that comparisons of utility between persons are not merely unverifiable but meaningless, together with the ordinalist retreat to Pareto-based social choice and its consequences for what an index is entitled to say.

  2. Sen's distinction, which I have never been able to state precisely, between a cardinal utility function and an interpersonal comparability assumption: the claim that fixing an individual's utility up to positive affine transformation licenses no cross-person comparison at all, that comparability is a further assumption amounting to an interpersonal equivalence relation, and that comparing levels across persons is a different and weaker achievement than comparing differences or units across persons.

  3. The extended-sympathy or impartial-observer strategy, and specifically the objection that Harsanyi's representation theorem delivers only a weighted sum of individual utilities, leaving the weights arbitrary, so that the theorem is equally consistent with a preference-utilitarian social ordering at unequal weights and does not by itself yield the equal-weights conclusion its defenders draw from it.

  4. The prioritarian move: the claim that utilitarianism and prioritarianism can share exactly the same cardinal, interpersonally comparable information and disagree only about how to weight it, and what that implies about whether the live dispute concerns measurement or aggregation.

  5. The disagreement over what the measure is a measure of — preference satisfaction, experienced affect, or objective well-being conceived as capability or functioning — and the associated claim that adaptation can make a within-person cardinal measure systematically misleading as a basis for cross-person comparison even when that measure is internally well behaved.

  For each of the five, tell me what the claim would be a claim about in my own terms, and be honest in doing it: do not smuggle in the assumptions of my framework and present the result as a translation of theirs. Where a philosophical claim only appears to say something I already say, flag it as a false friend and explain the divergence.

  Then give me the residue report, which is the part I most want:

  - Which claims map cleanly onto distinctions I already draw in practice, and which of my routine methodological arguments is therefore already a disguised philosophical argument.
  - Which map only with distortion, and what precisely gets distorted in the fitting.
  - Which have no expression whatsoever in cost-effectiveness analysis — no counterpart among value sets, elicitation instruments, invariance requirements, or weighting schemes.

  For the third category I want you to take a side rather than merely catalogue: does the residue show that my framework is missing something that bears on the allocation decisions it is used to make, and if so what adding it would look like concretely — a new assumption, a new instrument, a different objective function? Or does it show that the philosophers are marking a distinction without operational content?

  Finally, please test one intuition of mine directly, because I suspect it is complacent. My working view is that disability weights are simply interpersonal utility comparison rendered operational, that a country-specific value set is a comparability assumption with survey data behind it, and that Robbins's objection is therefore beside the point for anything I do. Tell me whether that intuition survives contact with the actual arguments, or whether it quietly presupposes something the debate denies — about adaptation, about whether a person trade-off task elicits a judgement about well-being or a judgement about preference, or about whether a ranking of health states across respondents really amounts to an equivalence relation between persons. And where a philosophical objection does bite against my practice, tell me which of my instruments it bites hardest against and why.

  I would like the arguments and the mappings themselves, not a survey of the literature and not a reading list; the answer should be usable by someone who will not be looking anything up.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Health economist working in cost-effectiveness analysis (CEA) for a national HTA body (like NICE, CADTH, ICER).
      *   **Daily Work:** Converting clinical trial data to QALYs, using EQ-5D value sets, debating elicitation instruments (SG, TTO, DCE, PTO), building models with distributional weights (equity weighting).
      *   **Knowledge Base:** Strong in welfare economics basics (ordinal vs. cardinal), weak in philosophical literature on measurement/aggregation.
      *   **Task:** Translate 5 specific philosophical positions regarding interpersonal utility comparison (IUC) into the user's specific technical vocabulary (value sets, elicitation, invariance, weights, etc.).
      *   **Constraints:**
          *   Do not smuggle in the user's assumptions to make the translation look easier.
          *   Flag "false friends" (where terms sound the same but mean different things).
          *   Provide a "Residue Report" (what maps cleanly, what distorts, what has no expression).
          *   Take a side on the "no expression" category (is the framework missing something, or is the philosophy empty?).
          *   Test the user's specific intuition: "Disability weights = operational IUC; Robbins is beside the point."
          *   Tone: Professional, precise, usable, no reading lists, no literature survey.

  2.  **Deconstruct the 5 Philosophical Positions:**

      *   **1. Robbins & Ordinalism:**
          *   *Philosophy:* Utility is ordinal preference ranking. IUC is meaningless. Social choice limited to Pareto improvements.
          *   *Translation:* Challenge the meaningfulness of the EQ-5D index itself as a *cardinal* measure across people. If utility is just ranking, QALYs (which sum differences) are invalid. Pareto efficiency means you can't trade off Person A's health for Person B's unless both gain.
          *   *False Friend:* "Preference" in economics (revealed choice) vs. "Preference" in health state valuation (hypothetical judgement).

      *   **2. Sen on Cardinality vs. Comparability:**
          *   *Philosophy:* Cardinality (positive affine transformation) $\neq$ Comparability. You can have cardinal utility that is non-comparable (each person has their own zero and unit). Levels vs. Differences.
          *   *Translation:* EQ-5D value sets fix the *scale* (0=dead, 1=full health), but do they fix the *unit* across people? Does a 0.1 gain for Patient X equal a 0.1 gain for Patient Y? Sen says you need an explicit "interpersonal equivalence relation" (a bridging assumption) beyond just having a 0-1 scale.
          *   *Key Distinction:* Level comparability (is X happier than Y?) vs. Unit comparability (is X's gain equal to Y's gain?). QALYs assume unit comparability.

      *   **3. Harsanyi & Impartial Observer:**
          *   *Philosophy:* Rational choice behind a veil of ignorance leads to utilitarianism. *Objection:* It only proves a weighted sum, weights are arbitrary. Doesn't prove equal weights.
          *   *Translation:* Your distributional weights (equity weighting) are not derived from the elicitation task (TTO/SG). The TTO gives you the $U_i$, but the social welfare function $W = \sum a_i U_i$ requires $a_i$. Harsanyi doesn't justify $a_i = 1$.
          *   *False Friend:* "Impartiality" in HTA (treating like cases alike) vs. "Impartial Observer" (ignoring identity entirely).

      *   **4. Prioritarianism:**
          *   *Philosophy:* Same info as utilitarianism (cardinal, comparable), different aggregation (concave transformation). Weight the worse off more.
          *   *Translation:* You can keep the EQ-5D value set exactly as is (same measurement), but change the objective function from $\sum QALYs$ to $\sum f(QALYs)$ where $f$ is concave. The dispute is purely in the aggregation algorithm, not the elicitation instrument.
          *   *Implication:* Measurement vs. Aggregation distinction is real in your models.

      *   **5. The Metric (Preference vs. Experience vs. Capability) & Adaptation:**
          *   *Philosophy:* What is being measured? If it's preference satisfaction, adaptation (changing preferences to fit circumstances) biases IUC. If it's experience, adaptation might be accurate reporting.
          *   *Translation:* TTO/SG elicits *preference* (willingness to trade life), not *experience* (pain/suffering). If disabled people adapt and report high well-being but TTO says low value, which is the "true" utility for allocation?
          *   *False Friend:* "Utility" in CEA (preference-based HRQoL) vs. "Utility" in hedonism (felt experience).

  3.  **Drafting the Translations (Iterative refinement for vocabulary):**
      *   *Goal:* Use terms like "invariance class," "value set," "elicitation," "objective function."
      *   *Robbins:* Focus on the invariance class of the index. If ordinal, monotonic transformation is allowed. QALYs require ratio/interval.
      *   *Sen:* Focus on the "zero" and "unit" calibration across value sets.
      *   *Harsanyi:* Focus on the social welfare function weights vs. individual utility scores.
      *   *Prioritarian:* Focus on the transformation of the QALY gain before summation.
      *   *Metric/Adaptation:* Focus on what the TTO question actually asks (trade vs. feel).

  4.  **Developing the Residue Report:**
      *   *Clean Maps:* Prioritarianism (easy to model), Sen's Unit Comparability (this is exactly what value sets attempt).
      *   *Distorted Maps:* Robbins (CEA ignores him by fiat, doesn't engage), Harsanyi (HTA assumes equal weights by norm, not theorem).
      *   *No Expression:* Adaptation/Metric (Experience vs. Preference). CEA almost exclusively uses preference-based (EQ-5D). Experience-based (EQ-5D-5L with experience bolt-ons, or SWB) is rare.
      *   *Taking a Side:* The framework *is* missing something. Adaptation bias is real. Ignoring it privileges the preferences of the non-disabled over the lived experience of the disabled. Concrete fix: Dual value sets (preference + experience) or explicit adaptation correction factors.

  5.  **Testing the User's Intuition:**
      *   *Intuition:* "Disability weights = operational IUC; Robbins is beside the point."
      *   *Critique:* This is complacent. Robbins isn't beside the point; he challenges the *ontology* of the weight. Is the weight a fact about the world or a normative stipulation?
      *   *Adaptation:* This is the big bite. TTO elicits willingness to trade, which is contaminated by adaptation. If a paralyzed person adapts and values their state highly, but the general public (valuers) do not, whose value counts?
      *   *Equivalence Relation:* A value set averages responses. It does not establish that Person A's 0.5 is ontologically identical to Person B's 0.5. It assumes it.
      *   *Hardest Bite:* Person Trade-Off (PTO). PTO explicitly asks for IUC ("How many of Group A to save to equal one of Group B?"). This exposes the normative jump that TTO tries to hide.

  6.  **Refining the Tone:**
      *   Ensure I don't sound like I'm lecturing on philosophy. I must sound like a technical translator.
      *   Avoid "Philosophers say..." instead use "The claim translates to..."
      *   Be direct about the "False Friends."
      *   Ensure the "Residue Report" is actionable.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain Sen's level vs. unit distinction clearly in HTA terms? *Adjustment:* Use the concept of "anchor points" (Dead/Full Health) vs. "step size" between health states.
      *   *Check:* Did I address the "distributional weights" the user mentioned? *Adjustment:* Connect Prioritarianism directly to their existing work on distributional weights.
      *   *Check:* Is the critique of the user's intuition sharp enough? *Adjustment:* Make sure to highlight that EQ-5D value sets are typically *general public* valuations, which introduces a specific bias regarding adaptation that Robbins would pounce on.

  8.  **Final Polish:** Check against constraints (no reading lists, usable arguments, specific vocabulary). Ensure the "Residue Report" clearly categorizes into Clean, Distorted, and No Expression. Ensure the "Side Taking" is decisive.

  *(Self-Correction on Harsanyi)*: Be careful not to say Harsanyi is "wrong," but that the *inference* to equal weights is the weak link. In HTA terms, the elicitation gives $U$, the policy gives $W$. Harsanyi tries to bridge them, but fails to fix the weights.

  *(Self-Correction on Robbins)*: Robbins says IUC is meaningless. HTA says "We do it anyway." The translation needs to show that HTA *stipulates* meaning where Robbins says there is none. It's a performative act, not a discovery.

  *(Self-Correction on Adaptation)*: This is the strongest philosophical critique of QALYs. Ensure it lands hard on the TTO/SG instruments.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the translation of the five philosophical positions into the technical vocabulary of health technology assessment (HTA), followed by the residue report and the test of your intuition.

  ### 1. Robbins and the Ordinalist Retreat
  **The Philosophical Claim:** Interpersonal utility comparisons (IUC) are not empirically unverifiable; they are semantically meaningless. Utility is an ordinal ranking of preferences. Therefore, social choice must be restricted to Pareto improvements (making someone better off without making anyone worse off). Aggregation (summing utility) is logically incoherent.

  **The HTA Translation:**
  This is a challenge to the **invariance class** of your index.
  *   **The Claim:** The EQ-5D index value (e.g., 0.75) claims to be an interval-scale measure (where the difference between 0.8 and 0.7 equals the difference between 0.5 and 0.4). Robbins argues the elicitation tasks (TTO, SG) only produce an **ordinal ranking** of health states for each individual.
  *   **The Consequence:** If utility is ordinal, any monotonic transformation of the index preserves all informational content. You could square the values, take the log, or reorder them, and the "truth" of the preference remains unchanged.
  *   **The Constraint:** By summing QALYs across patients to calculate an ICER, you are treating the index as ratio-scaled (where 0 is absolute zero and units are constant). Robbins argues this operation creates a number that has no referent in reality.
  *   **Pareto Restriction:** In your cost-effectiveness plane, you are only entitled to identify interventions that dominate (less cost, more QALYs). Any intervention on the "efficient frontier" that involves a trade-off (gaining QALYs for Group A by spending resources that could have helped Group B) is technically indeterminate. You cannot say the gain outweighs the loss, because "outweighing" requires a common unit of measure which Robbins denies exists.

  **False Friend:** **"Preference."** In your elicitation tasks, "preference" is a hypothetical judgement about health states ("Would you trade 10 years?"). In Robbins' framework, "preference" is revealed choice behavior. You are treating hypothetical judgements as if they possess the cardinal properties of physical measurement, which Robbins denies is possible for mental states.

  ### 2. Sen on Cardinality vs. Comparability
  **The Philosophical Claim:** Cardinal utility (measurable intensity) does not imply interpersonal comparability. You can fix an individual's utility scale (zero and unit) without fixing it *relative to another person's* scale. Furthermore, comparing levels (who is better off?) is distinct from comparing units (whose gain is bigger?).

  **The HTA Translation:**
  This distinguishes between **value set calibration** and **interpersonal equivalence**.
  *   **Cardinality (Within-Person):** Your TTO task establishes cardinality for Respondent A. It fixes "Dead" at 0 and "Full Health" at 1. It tells us Respondent A values State X at 0.8. This allows you to measure gains for A (0.6 to 0.8 = 0.2 gain).
  *   **Comparability (Between-Person):** Sen argues that fixing A's 0 and 1 does not fix A's 0 relative to B's 0. Does "Dead" mean the same ontological loss for A and B? Does a 0.1 gain for A represent the same welfare improvement as a 0.1 gain for B?
  *   **Levels vs. Units:**
      *   *Level Comparability:* Can you say Patient A (0.4) is worse off than Patient B (0.6)? Your value sets assume yes.
      *   *Unit Comparability:* Can you say a gain of 0.2 for A is socially equivalent to a gain of 0.2 for B? Your QALY calculation assumes yes.
  *   **The Translation:** Sen claims your value set provides the *invariance class* for the individual (positive affine transformation), but the **social welfare function** requires a further assumption: an **interpersonal equivalence relation**. You must explicitly stipulate that the "unit" of health utility is invariant across persons. This is not a finding of the survey data; it is a normative bridge you build over the data.

  ### 3. Harsanyi and the Impartial Observer
  **The Philosophical Claim:** Rational choice behind a veil of ignorance (not knowing who you are) leads to maximizing average utility. *Objection:* This theorem only proves the social objective function is a weighted sum of utilities. It does not prove the weights must be equal.

  **The HTA Translation:**
  This targets the **weights in your aggregate objective function**.
  *   **The Setup:** You elicit individual utilities ($U_1, U_2, ... U_n$) using EQ-5D. You aggregate them using a social welfare function $W = \sum a_i U_i$.
  *   **The Claim:** Harsanyi's logic justifies the *form* of the function (linear aggregation), but it leaves the **distributional weights ($a_i$)** underdetermined.
  *   **The Consequence:** Your agency's default assumption is $a_i = 1$ for all persons (unweighted QALYs). Harsanyi's theorem is equally consistent with $a_i = 2$ for the severely ill and $a_i = 0.5$ for the mildly ill, provided those weights reflect the "impartial observer's" risk attitude.
  *   **The False Friend:** **"Impartiality."** In HTA, impartiality often means "consistent application of rules." In Harsanyi's framework, it means "ignoring identity entirely." The objection is that moving from "I don't know who I am" to "Everyone counts equally" is a normative leap, not a mathematical derivation. Your unweighted QALY model is a specific ethical choice (utilitarianism with equal weights), not the unique rational outcome of the elicitation process.

  ### 4. The Prioritarian Move
  **The Philosophical Claim:** Utilitarianism and Prioritarianism use the exact same informational base (cardinal, interpersonally comparable utility) but differ in aggregation. Prioritarianism applies a concave transformation to utility before summing, giving extra weight to gains at lower levels of well-being.

  **The HTA Translation:**
  This validates your work on **distributional cost-effectiveness analysis (DCEA)**.
  *   **The Claim:** The dispute between maximizing total QALYs and prioritizing the worst-off is not a dispute about **measurement** (the value set/elicitation). It is a dispute about the **objective function**.
  *   **The Translation:** You can keep the EQ-5D-5L value set exactly as it is. You keep the TTO elicitation. The data ($U_i$) remains identical. The change occurs in the model code: instead of `Total Benefit = Sum(Gain)`, you calculate `Total Benefit = Sum(f(Gain))`, where $f$ is a concave function (e.g., square root or log of QALYs).
  *   **Implication:** This philosophical position maps cleanly to your practice. It confirms that you do not need new elicitation instruments to implement equity weighting. You need a different **aggregation algorithm**. The "live dispute" is purely about the shape of the social welfare function, not the psychometric properties of the index.

  ### 5. The Metric and Adaptation
  **The Philosophical Claim:** Utility can measure preference satisfaction, experienced affect (hedonia), or objective functioning (capability). Adaptation (changing preferences to match circumstances) makes preference satisfaction a misleading metric for cross-person comparison.

  **The HTA Translation:**
  This challenges the **construct validity** of your elicitation instrument.
  *   **The Claim:** Your TTO/SG instruments elicit **preference satisfaction** (willingness to trade life duration). They do not measure **experienced well-being** (pain, suffering, enjoyment) or **capability** (what a person can do/be).
  *   **The Adaptation Problem:** A person with a severe disability may adapt psychologically. Their *experienced* well-being might be high, but their *preference* for health (willingness to trade life to avoid the state) might still be strong, or vice versa.
  *   **The Consequence:** If you use preference-based value sets (standard EQ-5D), you may systematically discount the value of life for disabled people because the general public (who usually value the states) cannot imagine adapting to the state. Conversely, if you use patient valuations, adaptation might make them undervalue the benefit of a cure.
  *   **False Friend:** **"Well-being."** In your models, "well-being" is proxied by the HRQoL index. In this philosophical claim, "well-being" is the *target* that the index attempts to hit. The claim is that your arrow (preference) is aimed at the wrong target (experience/capability) for the purpose of allocation.

  ***

  ### Residue Report

  #### 1. Clean Maps (Disguised Philosophical Arguments)
  *   **Prioritarianism (Position 4):** This maps perfectly. Your routine argument about "distributional weights" *is* the philosophical debate between utilitarianism and prioritarianism. When you argue about whether to apply an equity weight to QALYs gained by the severely ill, you are not doing technical modeling; you are doing normative ethics. You have simply operationalized the concave transformation function.
  *   **Sen's Unit Comparability (Position 2):** Your reliance on a single national value set is an operational assumption of **unit comparability**. When you defend the use of a general public value set over patient value sets, you are implicitly arguing that the "unit" of health loss is invariant across observers, which is precisely Sen's "interpersonal equivalence relation."

  #### 2. Distorted Maps (Where the Fit is Poor)
  *   **Robbins (Position 1):** In philosophy, Robbins' objection stops the conversation (IUC is meaningless). In HTA, you treat it as a practical hurdle to be bypassed. The distortion is **performative**. You treat the value set as a *discovery* of a pre-existing scale. Robbins would say it is a *stipulation*. You act as if the 0.75 value exists in the health state; Robbins says you have merely assigned it for the purpose of calculation. The distortion lies in presenting the index as empirical rather than normative.
  *   **Harsanyi (Position 3):** You treat equal weighting ($a_i=1$) as the neutral baseline. Harsanyi's critics show there is no neutral baseline. The distortion is assuming that "unweighted QALYs" are the default rational position. They are just one specific weighting scheme among infinite possibilities.

  #### 3. No Expression (The Missing Category)
  *   **Adaptation and the Metric (Position 5):** This has **no expression** in standard CEA.
      *   **Why:** Your framework assumes the elicitation instrument (TTO/SG) captures the relevant "utility" for allocation. It does not distinguish between "utility as preference" and "utility as experience."
      *   **The Side I Take:** The framework is **missing something that bears on allocation**. Ignoring adaptation privileges the preferences of the non-disabled (who value the health state) over the lived experience of the disabled (who inhabit it). This leads to systematic discrimination against conditions where adaptation is high (e.g., spinal cord injury) because the "loss" is overestimated by the valuers.
      *   **Concrete Fix:** You need a **dual-value set approach**.
          1.  **Preference Value Set:** Standard EQ-5D TTO (for resource opportunity cost).
          2.  **Experience Value Set:** A supplementary instrument measuring subjective well-being or capability (e.g., ICECAP or SWB modules).
          3.  **Decision Rule:** A hybrid objective function that weights the *Experience* gain higher than the *Preference* gain for chronic conditions to correct for adaptation bias. This moves from `Maximize QALYs` to `Maximize (QALYs + Adaptation-Correction)`.

  ***

  ### Testing Your Intuition

  **Your Intuition:** *"Disability weights are simply interpersonal utility comparison rendered operational, that a country-specific value set is a comparability assumption with survey data behind it, and that Robbins's objection is therefore beside the point for anything I do."*

  **The Verdict:** This intuition is **complacent and partially false.** It survives contact with Sen but fails against Robbins and the Adaptation critique.

  **1. Where it holds (Sen):**
  You are correct that a country-specific value set is a **comparability assumption**. By forcing all respondents to value states on the same 0–1 anchor (Dead to Full Health), you are imposing Sen's "interpersonal equivalence relation." You have made IUC operational by fiat. In this narrow sense, Robbins is "beside the point" because you have stipulated the meaning he says is missing.

  **2. Where it fails (Robbins):**
  Robbins is not beside the point because he challenges the **ontology** of your stipulation. You treat the value set as if it *measures* a property of the health state. Robbins argues you are *assigning* a property to facilitate calculation.
  *   **The Bite:** This matters when you face legal or ethical challenges. If a patient group argues, "Your weight of 0.4 for our condition is wrong," your defense is "It is the average preference of the population." Robbins would say, "That average is mathematically coherent but ethically groundless unless you justify *why* you are summing these preferences." Your intuition hides the normative jump behind the survey data.

  **3. Where it fails hardest (Adaptation & Instruments):**
  Your intuition assumes the elicitation instrument captures "utility" in a way that is valid for comparison. The Adaptation argument (Position 5) bites hardest against the **Time Trade-Off (TTO)** and **Person Trade-Off (PTO)**.
  *   **TTO:** Elicits *preference*. If a disabled person adapts and reports high quality of life, but the TTO valuer (general public) says "I'd trade 5 years to avoid that," whose utility counts? Your framework defaults to the valuer. This presupposes that the *anticipation* of disability is the correct metric for allocation, not the *experience* of it.
  *   **PTO:** This instrument explicitly asks for IUC ("How many people in Health State A must we cure to equal curing one person in Health State B?"). Here, Robbins' objection bites hardest. The PTO does not elicit a fact; it elicits a **moral judgement**. By treating the PTO output as a "weight" comparable to a TTO "utility," you are conflating a moral trade-off rate with a psychometric measure.
  *   **The Equivalence Relation:** You assume a ranking of health states across respondents amounts to an equivalence relation between persons (A's 0.5 = B's 0.5). The Adaptation critique shows this is false. A's 0.5 (adapted) may represent a higher level of functioning/well-being than B's 0.5 (unadapted). Your value set averages these into a single number, erasing the moral distinction.

  **Conclusion:**
  Your intuition works for **internal model consistency** but fails for **external ethical validity**. You have rendered IUC operational, but you have not rendered it *justified*. You are using a map (the value set) that assumes the terrain is flat (comparable units) when the philosophical literature suggests the terrain is mountainous (adaptation, different metrics). To fix this, you must stop treating the value set as a neutral technical input and acknowledge it as a normative aggregation of preferences that requires explicit ethical defense, particularly regarding whose preferences (patients vs. public) and which metric (experience vs. trade-off) are being prioritized.
