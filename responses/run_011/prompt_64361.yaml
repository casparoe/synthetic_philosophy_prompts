answer: |-
  **1. The Empty-Rules Charge**
  **If the hard core is immune to refutation by decision, what specific action does MSRP forbid a scientist from taking today?**
  *Likely answer: It's not rules of conduct, it's rational reconstruction.*
  ***Follow-up:** If appraisals aren't rules of conduct, and it never tells a scientist to quit, is it a methodology or just a nicer way of narrating what already happened?*

  **2. Reflexivity**
  **What is the hard core of MSRP itself, and what's in its protective belt?**
  *Likely answer: He will list the definitions of hard core, protective belt, positive heuristic, etc.*
  ***Follow-up:** So appraised by its own standards, is MSRP progressive or degenerating? "Too early to tell" is available for any programme at any moment.*

  **3. Novelty**
  **Novelty depends on the history of construction. Give me a case where that classification flips the appraisal.**
  *Likely answer: He will give a standard historical example (e.g., Newton vs. Einstein).*
  ***Follow-up:** In your recent papers on ML labs, which reading of novelty are you relying on to claim progress?*

  **4. Who Declares Degeneration**
  **Insiders call their programme progressive; outsiders call it degenerating. Is "degeneration" just a marker for "not my tribe"?**
  *Likely answer: No, it's an objective feature of the theory growth.*
  ***Follow-up:** Can an outsider who rejects the hard core legitimately appraise it as degenerating, or only insiders?*

  **5. Popper**
  **Is MSRP just sophisticated falsificationism with a longer clock and a different unit of appraisal?**
  *Likely answer: No, the unit of appraisal changes the logic.*
  ***Follow-up:** In a live dispute with all the same data, what would a Popperian and a Lakatosian actually disagree about?*

  **6. The Comeback Case**
  **Take a programme that looked dead for decades then revived. What was MSRP saying during the dead decades?**
  *Likely answer: It was theoretically progressive but empirically stalled, or similar.*
  ***Follow-up:** How is that distinguishable in hindsight from just betting on whatever eventually wins?*

  **7. The ML Application**
  **In ML, is "scale buys capability" the hard core, and are failed predictions just protective belt adjustments?**
  *Likely answer: Yes, the belt is absorbing anomalies while the core holds.*
  ***Follow-up:** If the belt predicts recovery in quarters, what's the difference between that and unfalsifiability? Does "novel prediction" mean anything when the theory is a curve fitted to a scaling plot?*

  **8. The Squishy Sciences**
  **In psychology, does "programme" do real work or is it redescription with a Hungarian accent?**
  *Likely answer: It helps organize theory choice.*
  ***Follow-up:** What would a grad student in 2012 have done differently if they were following MSRP?*

  **9. The Exit Condition**
  **What specific evidence would make you abandon MSRP entirely?**
  *Likely answer: A long explanation involving historical shifts.*
  ***Follow-up:** Please answer that in one sentence.*
