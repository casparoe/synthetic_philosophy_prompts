answer: |-
  ### I. Correspondence Table

  | Domestic Source (Crime) | International Target (War) | Status |
  | :--- | :--- | :--- |
  | **Individual** | The State (as moral agent) | Occupied |
  | **Robber** | Aggressor State | Occupied |
  | **Victim's Body/Property** | Sovereignty, Territory, Citizens | Occupied |
  | **Bystander** | Citizen / Conscript | Occupied |
  | **Police and Courts** | **International Sovereign / Adjudicator** | **EMPTY** |

  ### II. Disanalogies

  **A. Bearing on the Complicity Charge**
  These disanalogies undermine the claim that refusing to fight is morally equivalent to ignoring a crime.
  1.  **Epistemic Uncertainty:** In a mugging, the roles of victim and aggressor are usually visible. In war, *jus ad bellum* is contested; propaganda and fog of war mean the "bystander" cannot be certain who is the robber.
  2.  **Collective vs. Individual Agency:** A citizen is not the state. In the domestic case, the bystander is a distinct third party. In war, the citizen is often a constituent part of the "victim" body, making them a participant by status rather than choice, complicating the "refusal" narrative.
  3.  **Proportionality and Collateral Harm:** Stopping a mugger rarely endangers third parties. Stopping an aggressor state often requires killing innocent conscripts or civilians on the other side, introducing a moral cost absent in the domestic analogy.

  **B. Local Color**
  These differences are descriptive but do not fundamentally alter the moral logic.
  1.  **Scale and Distance:** The number of combatants and geographic distance are different, but moral duties do not necessarily scale down with distance.
  2.  **Instrumentation:** Tanks versus knives change the mechanics of violence, not the underlying right to self-defense.

  ### III. What the Source Quietly Lends the Target

  The domestic analogy smuggles in four assumptions from the source domain that do not exist in the target domain:
  1.  **A Single Body to Defend:** It assumes the state is a unitary agent with a single will, rather than a fractured collection of interests.
  2.  **A Harm That Ends:** It assumes victory stops the violence (like stopping a robber), ignoring that war often creates long-term instability or insurgency.
  3.  **A Calculable Proportionality:** It assumes the bystander can easily weigh the risk of intervention against the harm of the crime, ignoring the catastrophic unpredictability of war.
  4.  **A Legal Order Waiting Behind the Scene:** Most critically, it assumes a background sovereign (police/courts) that validates the victim's claim and limits the defender's violence. In the international case, the victim must act as their own police, judge, and executioner.

  ### IV. Audit of the Charge

  Does the charge survive? The charge is that pacifism is *complicity*. Complicity implies a violation of a duty to rescue. In the domestic analogy, the "bystander" usually has no *legal* duty to intervene (in common law jurisdictions), only a moral one. However, the presence of police allows the bystander to defer responsibility to the state. In the international case, there is no police.

  The charge fails to establish a universal *duty* because the empty slot (Police/Courts) means the citizen cannot defer to a higher authority to adjudicate the justice of the war. Without an adjudicator, the citizen's refusal may be prudence or moral objection to uncertainty, not complicity. The analogy successfully argues that defensive war is *permissible* (the state has the right to act as its own police), but it fails to prove that every citizen is *obligated* to be the officer.

  **Better Analogy:**
  The **"Defense of Third Parties"** analogy carries an anti-pacifist conclusion better. It frames war not as state self-defense (which is abstract) but as the protection of innocent humans from violence.
  *   **What it licenses:** This licenses a **permission** that can mature into a **duty** for specific agents (soldiers, protectors) based on capacity and role, but it does not license a universal duty for all citizens. It allows the pacifist to decline if they lack the capacity or if the intervention violates proportionality, without branding them complicit.

  Verdict: survives only as a permission, not a duty because the absence of a global adjudicator renders the bystander's judgment provisional rather than binding.
