      *   *Check:* The "Modern Lie" point. Is it just a larger state space? No, Arendt says it changes *what counts* as a fact. That's meta-game. I need to highlight that structural blocker.

  10. **Final Polish:** Organize clearly with headings. Ensure the "Residue Report" directly answers the prompt's specific questions about the two suspicions. (Proceed to generate output based on this thought process).

