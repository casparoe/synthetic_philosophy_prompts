      *   *Key Claim 5:* The successful liar eventually believes their own lies (self-deception/loss of grounding).
      *   *Key Claim 6:* Factual truth is contingent (could have been otherwise) but stubborn (it happened). Rational truth (math/philosophy) is coercive; factual truth is fragile against organized lying.
      *   *Key Claim 7:* The public realm relies on a shared world. Lying destroys the "in-between" space.

  3.  **Map to Game Theory Vocabulary:**
      *   *State Space ($\Omega$):* The set of possible realities/facts.
      *   *Sender Type ($\theta$):* The Sender's knowledge of the true state (or their preference type).
      *   *Message ($m$):* The statement/claim made (cheap talk).
      *   *Receiver Belief ($\mu$):* Posterior probability over $\Omega$.
      *   *Action ($a$):* Voting, supporting policy, etc.
      *   *Preferences ($U_S, U_R$):* Payoffs based on $(a, \omega)$.
      *   *Conflict of Interest:* Difference between optimal $a$ for $S$ vs. $R$ given $\omega$.
      *   *Equilibrium:* Separating (truth-telling), Pooling (babbling/lying), Partial Pooling.

  4.  **Drafting the Claims List (Pre-Translation):**
      1.  Epistemic Privilege: The liar knows $\omega_{true}$ while intending to induce belief in $\omega_{false}$.
      2.  Interest Alignment: Trust is a function of perceived preference alignment.
      3.  The Traditional Lie: Hiding a specific $\omega$ within a stable $\Omega$.
      4.  The Modern Lie: Altering the structure of $\Omega$ itself (redefining what counts as a fact).
      5.  Self-Deception: The Sender's type becomes correlated with their message history (endogenous preferences/beliefs).
      6.  World-Building: Politics requires a common $\Omega$; lying destroys the commonality.
      7.  Fragility of Fact: Factual truths are more vulnerable to cheap talk than rational truths because they lack logical coercion.

  5.  **Drafting the Translation (Iterative Process):**
      *   *Claim 1 (Epistemic Privilege):* Easy. Sender type $\theta = \omega$. Message $m \neq \omega$.
      *   *Claim 2 (Interest Alignment):* Standard Crawford-Sobel. As bias $b$ increases, information transmission decreases.
      *   *Claim 3 (Traditional Lie):* Standard signaling. $\Omega$ is fixed. Sender chooses $m$ to shift $\mu$.
      *   *Claim 4 (Modern Lie):* Hard. $\Omega$ is usually exogenous. Need to model $\Omega$ as mutable or the mapping from $\omega$ to utility as mutable.
      *   *Claim 5 (Self-Deception):* Hard. Types are usually exogenous in standard cheap talk. Needs dynamic model where $\theta_{t+1} = f(\theta_t, m_t)$.
      *   *Claim 6 (Common World):* This is about the *preconditions* of the game, not the move structure. Shared $\Omega$ is a prerequisite.
      *   *Claim 7 (Fragility):* Factual truth has no intrinsic verification cost in the model unless we add auditing.

