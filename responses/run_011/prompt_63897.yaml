  **Note on Structure and Risk**

  **Structural Moments:**
  1.  **The reinterpretation of "Civilization failed":** When I state, "Civilization did not break. It functioned," the thesis does work by refusing the consolatory narrative. A listener hears not that monsters invaded, but that normal tools (files, schedules) were used. This shifts responsibility from "evil others" to "ordinary systems."
  2.  **The Student Task:** When I say, "When a rule separates you from a person, stop," the thesis moves from analysis to imperative. A listener hears a specific method (reducing distance) rather than a vague moral plea (be kind). This follows the argument that distance enabled the crime.

  **Quoted Sentence:**
  *"When the budget becomes more real than the person, the danger returns."*
  **Survival:** It survives lifting. It is self-contained, applies to municipal governance generally, and retains the warning without needing the surrounding context.

  **Failure Point:**
  The address risks tipping into a **lecture**. The section explaining the fragmentation of tasks ("One person wrote the schedule...") is necessary for the argument but may feel didactic to mourners. If the delivery is too analytical there, it will sound like I am teaching a class rather than mourning the dead. I must ensure the tone remains solemn, not instructional, during that passage.
