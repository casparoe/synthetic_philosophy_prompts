answer: |-
  ### Specification for the Epistemic Status of Long-Range Predictions

  To prevent the collapse of evaluation into the "Malthus was refuted vs. premature" loop, the following desiderata define the conditions under which a prediction account is deemed "right-but-early," "wrong," or "untestable." Each item includes the motivating case and its status within the rubric.

  **1. Operational Alignment**
  *   **Motivation:** The Simon–Ehrlich wager. The bet was settled on nominal commodity prices, but the theoretical claim concerned physical scarcity and human welfare. A theory of scarcity cannot be falsified by a metric of market pricing if the theory explicitly decouples the two.
  *   **Status:** **Non-Negotiable.**
  *   **Requirement:** The metric used to judge the prediction must map isomorphically to the variable defined in the theoretical claim. Proxy measures are permissible only if the link between proxy and target is established independently of the prediction's outcome.

  **2. Theoretical Continuity (The Malthus Clause)**
  *   **Motivation:** Malthus's appeal to "moral restraint." This reads as an *ad hoc* rescue if introduced only after the failure to explain the data, but as a valid variable identification if the capacity for restraint was inherent in the original model of human agency.
  *   **Status:** **Non-Negotiable.**
  *   **Requirement:** To count as "early" rather than "wrong," any variable added to explain a miss must be derivable from the theory's core axioms without altering them, or be independently measurable prior to the prediction's failure. Post-hoc variables that function solely to absorb error constitute theory degeneration.

  **3. Counterfactual Reconstruction (The Reflexivity Clause)**
  *   **Motivation:** Averted catastrophes and reflexive predictions. If a prediction of doom triggers intervention that prevents the doom, the failure of the event to materialize is evidence *for* the model's causal understanding, not against it. However, without a reconstruction of the un-intervened timeline, this is indistinguishable from a false alarm.
  *   **Status:** **Non-Negotiable.**
  *   **Requirement:** To claim credit for a prevention, the predictor must provide a causal model of the intervention pathway and a plausible estimate of the baseline trajectory absent that intervention. Mere assertion that "we listened" is insufficient.

  **4. Probability Density (The Long-Window Clause)**
  *   **Motivation:** Near-certain claims stretched over long windows (e.g., "civilization will collapse within 10,000 years"). Such claims cannot be true-by-luck and still be informative. If the probability distribution does not update as time passes without the event, the claim is unfalsifiable.
  *   **Status:** **Non-Negotiable.**
  *   **Requirement:** Long-range predictions must specify a hazard rate or a probability distribution over time. As the window closes without the event occurring, the credence in the specific prediction must decrease, or the theory must explain why the risk remains constant despite elapsed time.

  **5. Empirical Priority (The Wegener Clause)**
  *   **Motivation:** Continental drift. The trajectory (continents move) was correct for decades while the mechanism (plate tectonics) was unknown or wrong.
  *   **Status:** **Local Preference (Research Programme / Bayesian).**
  *   **Requirement:** A theory may retain validity based on trajectory fit even if the deep mechanism is currently unspecified or incorrect, provided the research programme is generating novel insights.
  *   **Camp Note:** **Falsificationism** rejects this; for a falsificationist, a wrong mechanism falsifies the theory regardless of empirical fit.

  **6. Temporal Symmetry**
  *   **Motivation:** The demand for accountability. If hitting a date confirms the theory, missing it must disconfirm it. "Right-but-early" cannot be a one-way ratchet where misses are excused but hits are banked.
  *   **Status:** **Local Preference (Falsificationism).**
  *   **Requirement:** A missed deadline must incur a penalty to the theory's credence equivalent to the boost a correct date would provide.
  *   **Camp Note:** **Research Programmes** reject this, allowing for "protective belts" that delay falsification. **Bayesians** treat it as a likelihood update, which may be asymmetric depending on priors.

  ***

  ### The Exclusionary Requirement

  The single requirement that excludes the most candidate accounts is **Counterfactual Reconstruction**. Most long-range predictions in demographics, climate, and AI are policy-adjacent; they are published to alter the very future they describe. Because historical control groups do not exist, it is epistemically impossible to rigorously demonstrate what *would* have happened absent the prediction's publication. Consequently, nearly all claims of "averted catastrophe" fail this rubric, defaulting to "untestable" rather than "successful prevention."

  ### Joint Unsatisfiability

  Your hunch is correct: the subset comprising **Temporal Symmetry**, **Undated Structural Tendencies**, and **Counterfactual Reconstruction** is jointly unsatisfiable.

  Argument: Temporal Symmetry requires that a specific time *T* acts as a binary switch for validation; if the event does not occur at *T*, the theory takes a hit. Undated Structural Tendencies explicitly deny that *T* is the relevant unit of analysis, positing instead a force that operates continuously until conditions change. You cannot penalize a theory for missing *T* while simultaneously crediting it for a tendency that ignores *T*.

  Reflexivity defeats this even where a date is supplied. If a prediction is reflexive, the outcome at *T* is a function of the prediction itself. To apply Temporal Symmetry, you must compare the actual outcome at *T* against the predicted outcome at *T*. But if the prediction changed the outcome, the "miss" is actually a "hit" on the causal mechanism. To recognize this, you need Counterfactual Reconstruction. However, as established, Counterfactual Reconstruction is rarely achievable in historical systems. Therefore, you are forced into a trilemma: either you enforce Symmetry and wrongly penalize successful interventions; or you allow Undated Tendencies and lose the ability to falsify; or you demand Counterfactuals and render almost all social science predictions untestable. You cannot hold all three.

  ### Camp Performance

  **Falsificationism** fails hardest on Reflexivity and Undated Tendencies; it demands clean misses and hits, rendering it incapable of processing self-defeating prophecies or structural drift without declaring the theory dead. **The Research-Programme Tradition** navigates Mechanism-Trajectory decoupling well (saving Wegener and Malthus) but risks degeneration on Temporal Symmetry, as it can perpetually delay the "hard" test by adding protective variables. **Bayesian Calibration** handles the uncertainty of Long Windows best, updating credences smoothly, but struggles with Operational Alignment; it can always lower the confidence of a prediction to avoid penalty, potentially insulating weak theories from the sharp edges of empirical failure.
