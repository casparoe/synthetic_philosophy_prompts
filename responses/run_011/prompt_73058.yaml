  *   **2 marks:** Discusses oscillation/convergence. (Full marks for noting that strict convergence to $1/2$ still allows profit if $q(1/2) \neq 0$, but $1/2$ is the only stable limit point).

  **Part (c): 6 Marks**
  *   **2 marks:** Contrasts static $\lambda$ (no fixed point price) vs. sequence $\psi_n$ (convergent prices).
  *   **2 marks:** Notes Limit Coherence applies to **fixed** $\phi$, not the sequence $\psi_n$.
  *   **2 marks:** Concludes Limit Coherence allows non-0/1 limits for self-referential sequences/diagonal sentences.

  **Part (d): 6 Marks**
