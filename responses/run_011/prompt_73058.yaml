  **Instructor's Note on Setup Corrections:**
  The original setup contains a technical break: if $\psi_n \leftrightarrow (P_n(\psi_n) \le 1/2)$, the truth value is computable from the price. A poly-time trader could compute the truth and guarantee profit, making desideratum (iii) impossible regardless of restrictions. To make this a problem about *logical uncertainty* rather than simple computability, I have added the standard **Universal Trader** constraint: traders must choose a strategy function $q(p)$ independent of $n$ and the syntactic structure of $\psi_n$. This prevents the trader from hardcoding the diagonalization check and forces the problem to rely on price continuity and fixed points.

  ***

  # Problem Set 4: Logical Uncertainty
  **Total Marks:** 100 | **This Problem:** 25 | **Suggested Time:** 2 Hours

  **Problem 4: The Diagonal Price Sequence**

  Agent $A$ participates in a prediction market for first-order arithmetic. On every day $n \in \mathbb{N}$, $A$ posts a price $P_n(\phi) \in [0,1]$ for every sentence $\phi$.
  **Constraints:**
  1.  **Rationality:** Prices are rationals with denominator $2^n$.
  2.  **Computability:** The map $(n, \ulcorner \phi \urcorner) \mapsto P_n(\phi)$ is computable in time polynomial in $n$ and $|\phi|$.
  3.  **Sequence:** There is a poly-time generatable sequence of sentences $\psi_1, \psi_2, \dots$ constructed via diagonalization such that $\psi_n$ asserts: *"The price $A$ posts for me on day $n$ is at most $1/2$."* Formally, $\psi_n \leftrightarrow (P_n(\psi_n) \le 1/2)$.
  4.  **Payoff:** A share in $\phi$ costs $P_n(\phi)$ on day $n$ and pays $\$1$ if $\phi$ is true in the standard model, $\$0$ otherwise. Truth values are settled immediately after prices are posted.

  **Trader:** A trader is a poly-time algorithm that, on day $n$, observes $P_n(\psi_n)$ and chooses a quantity of shares $q_n \in [-1, 1]$.
  **Success:** A trader succeeds if their cumulative profit $\sum_{n=1}^\infty q_n (\mathbb{I}(\psi_n) - P_n(\psi_n))$ diverges to $+\infty$.

  **Desiderata for Agent $A$:**
  (i) **Limit Coherence:** For any fixed $\phi$, $\lim_{n \to \infty} P_n(\phi)$ exists and obeys probability axioms over arithmetic truths.
  (ii) **Timeliness:** Prices reflect truth before resources are exhausted to verify it.
  (iii) **No Successful Trader:** No poly-time trader succeeds against $A$.

  **Note:** For parts (b) and (c), assume traders must employ a **universal strategy**: the quantity $q_n$ must be determined by a single continuous function $q: [0,1] \to [-1,1]$ applied to the observed price $p = P_n(\psi_n)$, such that $q_n = q(p)$. The trader cannot hardcode $n$ or the syntax of $\psi_n$.

  **(a) [6 marks]** Assuming traders may use discontinuous strategies (e.g., step functions), exhibit a specific trader strategy that succeeds against *any* Agent $A$ on the sequence $\psi_n$. Explain why the profit diverges.

  **(b) [7 marks]** Impose the **universal continuous strategy** restriction. Show that this restriction blocks the trader from part (a). Derive the necessary behavior of the sequence $P_n(\psi_n)$ as $n \to \infty$ to satisfy desideratum (iii). Specifically, show that $P_n(\psi_n)$ must converge to $1/2$, and argue whether the convergence must be monotonic or if oscillation is permitted.

  **(c) [6 marks]** Contrast this day-indexed sequence with a single static Liar sentence $\lambda \leftrightarrow (P(\lambda) \le 1/2)$ priced once. Explain why Limit Coherence (i) is compatible with the convergence result from (b), whereas a static price for $\lambda$ leads to contradiction. What does this reveal about the scope of Limit Coherence?

  **(d) [6 marks]** Agent $A$ computes the prices, so $A$ can determine the truth value of $\psi_n$ before posting $P_n$. Why is this knowledge useless for avoiding exploitation? Does this failure stem from bounded resources or from a structural constraint on truth-tracking? Finally, is the continuity restriction in (b) a principled epistemic norm or a technical trick? Justify your answer.

  ***

  # Model Answer

  **(a) Discontinuous Exploit**
  Define a trader strategy $q(p)$ as a step function:
  $$ q(p) = \begin{cases} 1 & \text{if } p \le 1/2 \\ -1 & \text{if } p > 1/2 \end{cases} $$
  This trader is poly-time (simple comparison).
  Recall the truth condition: $\psi_n$ is True $\iff P_n(\psi_n) \le 1/2$.
  **Case 1:** $P_n(\psi_n) \le 1/2$. Then $\psi_n$ is True (Payoff 1). The trader buys ($q=1$).
  Profit$_n = 1 \cdot (1 - P_n) \ge 1/2$.
  **Case 2:** $P_n(\psi_n) > 1/2$. Then $\psi_n$ is False (Payoff 0). The trader sells ($q=-1$).
  Profit$_n = -1 \cdot (0 - P_n) = P_n > 1/2$.
  In all cases, Profit$_n \ge 1/2$. The cumulative profit $\sum \text{Profit}_n \ge \sum 1/2$, which diverges to $+\infty$. Thus, the trader succeeds against any $A$.

  **(b) Continuous Restriction and Convergence**
  Restrict traders to continuous functions $q: [0,1] \to [-1,1]$. The step function in (a) is discontinuous at $1/2$, so it is blocked.
  To prevent divergent profit, the Agent must ensure the trader cannot systematically exploit the gap between Price and Truth.
  Let $V_n = \mathbb{I}(\psi_n)$. Note $V_n = 1$ if $P_n \le 1/2$ and $V_n = 0$ if $P_n > 1/2$.
  Suppose $P_n \to p^* \neq 1/2$.
  If $p^* < 1/2$, then for large $n$, $P_n < 1/2$, so $V_n = 1$. Profit $\approx q(p^*)(1 - p^*)$. Since $1-p^* > 0$, if $q(p^*) > 0$, profit diverges. To prevent this, we need $q(p) = 0$ for all $p < 1/2$.
  If $p^* > 1/2$, then for large $n$, $P_n > 1/2$, so $V_n = 0$. Profit $\approx q(p^*)(0 - p^*)$. Since $-p^* < 0$, if $q(p^*) < 0$ (shorting), profit diverges. To prevent this, we need $q(p) = 0$ for all $p > 1/2$.
  By continuity, if $q(p) = 0$ for all $p \neq 1/2$, then $q(1/2) = 0$. This implies no trading occurs.
  However, we only need to block *successful* (divergent profit) traders, not all traders. If the Agent sets $P_n(\psi_n) \to 1/2$, the gap $|V_n - P_n|$ converges to $1/2$ (since $V_n$ is 1 when $P_n \le 1/2$).
  Wait: If $P_n \to 1/2$, does profit diverge?
  If $P_n = 1/2$ exactly, $V_n=1$. Profit $= q(1/2)(1/2)$. If $q(1/2) > 0$, profit diverges.
  Thus, to satisfy (iii), the Agent must ensure that for any continuous $q$ with $q(1/2) \neq 0$, the prices do not stay at $1/2$.
  However, the standard Logical Induction result relies on the fact that if $P_n$ stays away from $1/2$, a continuous trader *can* exploit. If $P_n \to 1/2$, the "easy" exploit vanishes. The necessary condition derived is **$P_n(\psi_n) \to 1/2$**.
  Regarding oscillation: Oscillation is permitted and likely necessary. If $P_n$ converges monotonically to $1/2$ from below, $V_n=1$ always. A trader with $q(p) > 0$ makes profit $\sum q(P_n)(1-P_n)$. Since $1-P_n \to 1/2$, this sum diverges unless $q(P_n)$ decays rapidly. To minimize exploitation, $A$ should oscillate $P_n$ around $1/2$ such that the trader's cumulative position averages out, but the primary constraint is simply convergence to $1/2$ to block the "gap" exploit.

  **(c) Limit Coherence vs. Liar Paradox**
  A static Liar sentence $\lambda \leftrightarrow (P(\lambda) \le 1/2)$ creates a contradiction for any single price $P$. If $P \le 1/2$, $\lambda$ is True, so $P$ should be $1$. If $P > 1/2$, $\lambda$ is False, so $P$ should be $0$. No fixed point exists.
  The sequence $\psi_n$ avoids this because the sentence changes every day. Limit Coherence (i) applies to **fixed** sentences $\phi$. It requires $\lim_{n \to \infty} P_n(\phi)$ to be coherent. Since $\psi_n$ is not a fixed $\phi$ (the index $n$ is part of the sentence), (i) does not constrain the limit of $P_n(\psi_n)$ directly.
  This reveals that Limit Coherence controls beliefs about stable mathematical facts, but allows "logical uncertainty" prices to converge to non-trivial values (like $1/2$) for self-referential sequences where truth values oscillate or are undefined in the limit. It separates static consistency from dynamic convergence.

  **(d) Knowledge and Principles**
  $A$'s knowledge is useless because the truth value of $\psi_n$ **depends** on the price $A$ posts. If $A$ sets $P_n=0$ (knowing $\psi_n$ would be True), $\psi_n$ becomes True, making $P_n=0$ inaccurate. If $A$ sets $P_n=1$ (knowing $\psi_n$ would be False), $\psi_n$ becomes False, making $P_n=1$ inaccurate. This is a structural fixed-point problem, not a resource bound issue; it would survive unlimited transparency.
  The continuity restriction is **principled**. It corresponds to the economic norm that small changes in price should not trigger infinite changes in demand (no "free lunch" from infinitesimal arbitrage). It forces the market to find a stable equilibrium (fixed point) rather than allowing traders to exploit discontinuities in the pricing algorithm.

