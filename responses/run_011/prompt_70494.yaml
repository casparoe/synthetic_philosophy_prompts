      *   *Key Distinction:* Instrumentalism (tools are neutral) vs. Material Politics (tools structure interaction). The user is arguing for Instrumentalism. Winner is arguing that the *materiality* itself constrains future political action in ways that differ from human law.
      *   *The "Anti-Determinist" label:* Winner is trying to walk a line. He rejects the idea that technology *automatically* progresses history (Marxist determinism), but he insists that specific artifacts *carry* specific political consequences that are hard to reverse. He's arguing against the idea that technology is *neutral*.

