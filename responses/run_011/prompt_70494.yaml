      *   *Two Main Theses:*
          1.  **Artifacts as Solutions to Political Problems:** Certain technologies are adopted specifically to enforce a power structure (e.g., Moses's bridges, cotton gin/slavery).
          2.  **Inherent Politics of Technologies:** Certain technologies *require* or are *strongly compatible* with specific forms of social organization (e.g., nuclear power = hierarchy, solar = democracy).
      *   *Winner's Stance on Determinism:* Winner is indeed critical of *hard* technological determinism (technology inevitably drives history) but argues for a "soft" determinism or "material constitution." He wants to show that once built, artifacts *continue* to legislate behavior, often beyond the original intent or awareness of users.
      *   *The "Padlock" Counter:* This is a common critique (often associated with Bruno Latour or Peter-Paul Verbeek later, but also standard philosophy of tech). Winner anticipates this. His point isn't just that the designer intended it, but that the artifact *embodies* the law. The bridge *is* the law.

