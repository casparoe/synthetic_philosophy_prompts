  # The Violation of Reflection

  The decisive failure of the halfer position lies in its incompatibility with van Fraassen's Reflection principle. To see this, we must fix the credences precisely as the protocol dictates. On Sunday, Beauty knows the coin is fair; both halfer and thirder agree her credence in Heads is one half. The divergence arises upon awakening. On the halfer account, once Beauty awakens without knowing the day, her credence in Heads rises to two thirds. Reflection principle states that your current credence in a proposition, conditional on your later credence in that proposition being some value $r$, should itself be $r$. Formally, $C_{now}(A | C_{later}(A) = r) = r$. On Sunday, Beauty is certain that her Monday self, upon awakening, will assign two thirds to Heads. The antecedent of the conditional is certain; thus, the conditional collapses. Reflection requires Sunday credence in Heads to be two thirds. Since the halfer assigns one half, the violation is not a delicate matter of borderline application but a direct contradiction.

  For a principle with this form to be anything other than trivially satisfied or trivially breached, the proposition $A$ must persist across the two times, and the agent must regard her future self as a rational updater of her current state. The halfer view fails this test immediately. It posits a Sunday self who trusts the protocol completely, knowing exactly what credence her Monday self will hold, yet refuses to align her current credence with that future certainty. This is not merely a deviation; it is a diachronic incoherence. The halfer claims to respect the fairness of the coin on Sunday while simultaneously endorsing a Monday credence that implies the coin is biased towards Heads upon awakening. Reflection exposes this disconnect: you cannot consistently believe your future rational self will believe $p$ to degree $r$ while you currently believe $p$ to degree $q$, unless you expect your future self to be irrational or misinformed. The halfer expects neither, yet violates the constraint anyway.

  # The Restricted Principle

  The obvious reply is that Reflection, stated this bluntly, is far too strong to be a requirement of rationality. It is well known to misfire in cases where you expect your future self to be impaired, drugged, misinformed, or deprived of evidence you now have. Sunday Beauty knows Monday Beauty will be drugged and memory-wiped; she knows Monday Beauty will lack the evidence "It is Sunday" which she currently possesses. Therefore, Sunday Beauty need not defer to Monday Beauty. This objection conceded, we must refine the principle. The restricted principle required here is that deference is owed to a future self whom you expect to have arrived at her opinion by conditionalising on your present evidence together with some further evidence she will acquire, with nothing lost in between that affects the proposition in question.

  This restricted principle is independently well motivated because it is nothing over and above conditionalisation applied across time. If your future self simply adds evidence $E$ to your current stock and updates via Bayes' rule, your current credence should match your expectation of her updated credence. The halfer's move from one half to two thirds falls outside this scope. There is no evidence acquired upon awakening that warrants raising the probability of Heads from one half to two thirds. Indeed, given the protocol, awakening is more likely under Tails than Heads. If the shift were driven by conditionalisation on the evidence "I am awake," the credence in Heads should drop, not rise. The halfer offers no account of what new evidence justifies a shift to two thirds, nor why the loss of temporal knowledge should inflate the probability of Heads. Consequently, the halfer violates even the restricted principle: she expects her future self to hold a credence that cannot be reached by conditionalising on her present evidence plus any plausible new evidence acquired upon awakening.

  # The Content Objection

  The halfer's best defence, associated with Lewis, is not simply carelessness about evidence. The point is that Beauty acquires no new information about the coin, and the explanation of the shift appeals to the indexical or self-locating character of Monday's credence. The objection is that Reflection is not merely false in the Sleeping Beauty case but not even well defined there, because there is no single proposition that both Sunday Beauty and Monday Beauty are credencing. Sunday Beauty believes "The coin landed Heads." Monday Beauty believes "The coin landed Heads and today is Monday." Hence, there is no antecedent of the form 'my later credence in $p$ is $r$' with a $p$ that persists across the two times.

  This defence forces a dilemma that the halfer cannot escape. Either the contents are the same, in which case the halfer owes an account of how a credence can move from one half to two thirds without any conditionalisable change in evidence; or the contents differ, in which case the halfer has surrendered the resource that made her view attractive. The whole appeal of the one half credence was supposed to be that the coin is fair and nothing has been learned about it. If the content differs, then the Sunday credence of one half applies to a proposition that Monday Beauty no longer holds. But then why should Sunday Beauty's credence be one half based on the coin's fairness if that fairness does not govern the self-locating proposition Monday Beauty actually cares about? If the propositions differ, the Sunday credence is irrelevant to the awakening decision. If the propositions are the same, the shift violates conditionalisation. The halfer cannot have it both ways: she cannot claim the coin information is unchanged to justify the Sunday one half, while simultaneously claiming the content changes to justify the Monday shift. The thirder, by contrast, treats "I am awake" as genuine evidence that updates the probability of Heads via conditionalisation on a stable proposition, preserving the link between the coin's fairness and the credence assigned upon awakening.

  # Stability and Licensing

  Finally, we must show that this argument does not prove too much. On the thirder account, Beauty's credence also changes when she is told that it is Monday, moving from one third to one half. This shift is licensed by the restricted principle while the halfer's is not. When Beauty is told "It is Monday," she acquires definite evidence that eliminates the possibility of Tuesday. This is a standard case of conditionalisation: $P(Heads | Monday) = P(Heads \& Monday) / P(Monday)$. Given the thirder's awakening credences, this calculation yields one half. The shift is driven entirely by the acquisition of new, non-indexical evidence that partitions the logical space. The halfer's shift from one half to two thirds upon awakening lacks this licensing; it is a shift without evidence, or worse, a shift against the evidence of awakening frequency.

  Furthermore, the thirder view is stable at every point in the protocol at which the restricted principle applies. On Monday awakening, Beauty's credence is one third. On Tuesday awakening (under Tails), her situation is subjectively indistinguishable from Monday's under Tails, and her credence remains consistent with the protocol's probabilities. She never holds a credence that she expects her future self to abandon without evidence. The halfer, however, is unstable: she holds one half on Sunday, expects to hold two thirds on Monday, and then jumps to one once told it is Monday. This trajectory involves multiple violations of diachronic coherence. The thirder trajectory is smooth: it begins with a credence that respects the expected future update (if Sunday is taken as one third to match Monday, or if the shift is justified by the evidence of awakening), and updates strictly via conditionalisation upon receiving day-information. The thirder view alone respects the requirement that rational credence changes must be traceable to evidence acquisition.

  # Strongest Objection

  The strongest objection to this argument is that self-locating beliefs fundamentally break the link required for Reflection. If the proposition believed on Sunday ("The coin lands Heads") is genuinely distinct in content from the proposition believed on Monday ("The coin lands Heads and this is Monday"), then Reflection never applies across the awakening event. For this objection to succeed, it must be true that there is no coherent way to map Sunday's non-indexical credences onto Monday's indexical situation without loss of meaning. If self-locating content is incommensurable with timeless content, then the demand for diachronic coherence via Reflection is category error. However, this succeeds only if we abandon the idea that rational agents can plan for their future indexical selves, a concession that undermines not only Sleeping Beauty but all decision-making involving future anticipation.
