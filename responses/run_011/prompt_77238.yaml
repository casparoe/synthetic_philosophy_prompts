answer: |-
  **Title:** Calibration vs. Target: A Philosophical Audit of the Criteria of Authenticity

  **Introduction and Research Question**
  The quest for the historical Jesus currently faces a methodological impasse. The traditional criteria of authenticity—dissimilarity (single and double), embarrassment, multiple attestation, coherence, Semitic linguistic influence, environmental fit, and the tendency of the developing tradition—were once the engine of the field. Today, they are widely regarded as broken. However, the diagnosis of this breakdown remains confused. This project proceeds from the working hypothesis that the case against the criteria conflates two distinct objections: a *calibration objection* and a *target objection*.

  The calibration objection treats criteria as detection procedures with unknown and plausibly asymmetric error rates. For instance, the criterion of dissimilarity filters out precisely the material that made Jesus intelligible to his contemporaries, generating false negatives. The criterion of embarrassment registers only what embarrassed the later community, never what embarrassed Jesus himself, generating false positives. In principle, this is repairable: if error rates could be estimated, criteria could be aggregated probabilistically rather than totted up informally. The target objection, associated with the turn to social and cultural memory, is more radical. It suggests there is no well-defined item—a saying as Jesus actually uttered it—for these criteria to be criteria *of*. If the tradition is a product of communal memory rather than discrete transmission, better calibration buys nothing.

  Prising these objections apart changes the picture. If the failure is primarily calibration, formal modeling may salvage the cumulative case. If the failure is target, the enterprise requires ontological revision. Consequently, the research question is: **For each standard criterion, does its evidential collapse stem from uncalibrated error rates (calibration) or the indeterminacy of the object sought (target), and under what parameter ranges does aggregating these criteria as correlated tests restore probabilistic support?**

  This question is falsifiable. It fails if it turns out that the distinction between calibration and target is unintelligible in this context, or if the correlation structures of the data render probabilistic aggregation mathematically impossible regardless of parameter values.

  **The State of the Debate**
  Existing positions leave this question open because they talk past one another. Proponents of rehabilitation often propose substitute criteria or refinements (e.g., replacing dissimilarity with "historical plausibility"). This addresses calibration implicitly but ignores the target objection; it assumes there is a stable "Jesus" to be plausibly fitted. Conversely, proponents of wholesale abandonment, often drawing on memory theory, argue that the quest for ipsissima verba is illusory. This addresses the target objection but dismisses the calibration problem without analysis, assuming that because the target is fuzzy, no detection is possible.

  Both sides miss the intermediate possibility: that the criteria function as tests on data produced by a small number of communities subject to similar selection pressures. If the errors are correlated—because the Gospels are not independent witnesses but products of overlapping theological environments—then multiple attestation loses its force. Neither rehabilitation nor abandonment adequately models this correlation. This project fills that gap by treating the criteria not as historical heuristics but as epistemic instruments subject to philosophical and formal audit.

  **Methodology**
  The twelve-month fellowship will be divided into three phases, moving from conceptual analysis to formal modeling and finally to synthesis.

  *Months 1–3: Conceptual Taxonomy.* I will define each criterion (dissimilarity, embarrassment, etc.) strictly as a binary or probabilistic test. I will map the specific calibration objections (error rates) and target objections (ontological status) raised against each. The deliverable is a matrix classifying each criterion's primary failure mode. This is purely conceptual work, relying on philosophical analysis of the existing literature in New Testament methodology.

  *Months 4–7: Formal Modeling.* I will construct a Bayesian framework to model the aggregation of these tests. The core challenge is modeling the correlation of errors. Since the data required to estimate actual error rates (e.g., the true frequency of Jesus' authentic sayings) does not exist, the model will not output historical probabilities. Instead, it will output *sensitivity analyses*. I will determine the parameter ranges in which multiple-attestation-style aggregation gains evidential weight and the ranges in which correlation nullifies it. This phase marks the transition to formal work, utilizing probabilistic logic to test the resilience of the cumulative case under varying assumptions of independence.

  *Months 8–12: Synthesis and Writing.* I will integrate the conceptual taxonomy with the modeling results to produce the final deliverable: a conditional taxonomy of failure modes. This will specify, for example, that "if the target is defined as communal memory, criterion X fails on target grounds; if defined as discrete utterance, it fails on calibration grounds unless error correlation is below threshold Y." The final months will be dedicated to drafting the monograph and preparing articles for publication in philosophy of science and religious studies journals.

  **Defense Against Alternatives**
  Three obvious alternatives must be rejected. First, proposing yet another criterion (e.g., "historical plausibility") merely shifts the calibration problem without solving it. It introduces a new instrument without assessing its error rate or target fit. Second, a purely genealogical critique of the enterprise (arguing the quest is ideologically motivated) explains why the criteria were used but not whether they *work*. It bypasses the epistemic question this project addresses. Third, an accumulation of case studies (applying criteria to specific pericopae) lacks generalizability. Without a formal model of how the criteria function as tests, case studies remain anecdotal. This project's value lies in its structural analysis of the tools themselves, rather than their specific application or ideological history.

  **Success and Failure Conditions**
  For a historian who is not a philosopher, a successful result provides clarity on when to trust the tool. Success looks like a set of conditional rules: "If you assume independent transmission, aggregation works; if you assume communal redaction, it does not." It gives the historian a vocabulary to distinguish between "we don't know the error rate" (calibration) and "there is nothing to measure" (target).

  Failure would take two forms. The substantive failure is if the modeling demonstrates that under *no* plausible parameter range does aggregation recover evidential force, confirming the abandonmentists without the nuance of the calibration distinction. The methodological failure is the risk of pseudo-precision: that the formal apparatus smuggles in assumptions about error rates that nobody can check, creating an illusion of rigor. I mitigate this by explicitly framing the deliverable as conditional and by focusing on sensitivity analysis rather than point estimates. If the model requires inputs that are historically unknowable even in principle, I will document this as a finding of the project (i.e., the problem is underdetermined), rather than forcing a solution.

  **Scope and Contingency**
  The scope of this project is ambitious for a twelve-month fellowship. The primary risk is that the formal modeling becomes too data-hungry or mathematically intractable within the timeframe. If the year proves shorter than the project, I will cut the formal modeling of correlation structures. In that contingency, the deliverable will revert to a robust conceptual taxonomy of failure modes, arguing qualitatively for the distinction between calibration and target. While less precise, this would still advance the debate by forcing proponents and critics to specify which objection they are raising.

  Furthermore, if the analysis of all seven criteria proves too voluminous, I will prioritize the three most contentious: dissimilarity, multiple attestation, and embarrassment. These carry the heaviest evidential weight in the field. Sacrificing the analysis of coherence or Semitic influence would reduce the comprehensiveness of the taxonomy but preserve the core argument regarding calibration and target.

  Ultimately, this project does not promise to find the historical Jesus. It promises to determine whether the tools we use to look for him are blunt, broken, or looking at the wrong thing. By distinguishing between the accuracy of the instrument and the existence of the object, this research offers a path out of the current methodological stalemate, providing a rigorous foundation for whatever historical work remains possible.
