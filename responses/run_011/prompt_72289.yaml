answer: |-
  Dear Director,

  We submit this joint statement to record the current state of our dispute regarding the taxonomy of moral cultures, specifically concerning the status of the emerging pattern we have observed in contemporary academic and public life. We write this to clarify where we stand, where we diverge, and what would be required to move us toward convergence, using the stipulated case of the visiting scholar and the junior faculty member as our fixed reference point.

  First, we record the claims upon which we are fully agreed. We both accept the background vocabulary derived from the study of conflict and social control that distinguishes moral cultures by their ontology of worth, their characteristic triggers for grievance, and their preferred modes of sanction. We agree that an honor culture treats worth as publicly ranked and vulnerable to insult, requiring the victim to convert injury into a public claim through personal action, often involving retaliation or risk. We agree that a dignity culture treats worth as inherent and resilient, preferring grievances to be tolerated, avoided, or referred to impartial institutions that focus on rights and material harm rather than slight. We agree that the emerging pattern involves moral standing that accrues to those who demonstrate suffering or vulnerability, where grievances are publicized to third parties and administrative authorities, and where the characteristic demand is for acknowledgement rather than satisfaction or repair. We further agree that for a set of norms to constitute a moral culture, it must exhibit a stable combination of these ontological assumptions, triggers, and sanctions across a given social sphere, rather than appearing as merely idiosyncratic behavior. Regarding the stipulated case, we agree on the facts: the senior scholar's remark was unintentional and concerned the idiom of a home country; the response was organized by a collective rather than the victim alone; the sanction involved administrative intervention and public apology; and the long-term outcome saw the junior faculty member gain professional standing while the senior visitor lost it. We also agree that the incident was treated as a moral injury rather than a simple misunderstanding, and that the resolution relied on public acknowledgement of harm rather than private settlement.

  Second, we formulate our residual disagreements exactly, stating each position first in the wording its advocate accepts without wincing, and second in the wording the opponent accepts as a fair characterization. Regarding the Discontinuity Thesis, the advocate states that the emerging pattern is a genuinely third moral culture because it possesses a distinct moral ontology where standing is conferred by recognized vulnerability and demonstrated suffering rather than by public ranking or inherent worth, and because its characteristic trigger is the unintentional slight, which prior cultures treat as peripheral. The opponent characterizes this claim as the assertion that a change in the sensitivity to offense and the mechanism of appeal constitutes a change in the fundamental kind of social order, rather than a shift in the tools used to pursue status. Regarding the Recrudescence Thesis, the advocate states that if one strips away the enforcement technology, what remains is the status logic of honor intact, where worth is publicly ranked, sanctions track insult rather than harm, bystanders are not permitted neutrality, and standing is zero-sum such that the aggrieved party's rise is the offender's fall. The opponent characterizes this claim as the assertion that because the outcome involves a change in reputational ranking, the underlying motivation must be identical to that of traditional honor cultures, ignoring the distinct role of vulnerability and institutional mediation.

  Third, we identify the cruxes, which are the sub-questions such that settling them would actually move at least one side, and for each crux we specify a concrete case, comparison, or research design that both would agree bears on it, together with each side's prediction recorded in advance. Our first crux concerns the summation of status, specifically whether moral standing in the emerging pattern is zero-sum like honor or potentially positive-sum like dignity. To test this, we propose using the variation where the senior figure is himself a member of a group that has historically been excluded from the profession. The Discontinuity advocate predicts that both parties may retain or gain standing based on shared vulnerability or structural victimhood, allowing for a non-zero-sum outcome where the junior faculty member's gain does not necessitate the senior scholar's total fall. The Recrudescence advocate predicts that the conflict will still resolve into a zero-sum ranking where one party must be designated the primary victim to confer standing, meaning the senior scholar's historical exclusion will be weighed against the junior faculty member's immediate injury until one outweighs the other. On this crux, the Recrudescence advocate presently has the better of it, given the stipulated case outcome where the junior faculty member received invitations by reference to the incident while the visitor's invitations stopped, though the Discontinuity advocate has conceded that public ranking is visible in the outcome. Our second crux concerns the necessity of public audience and intent, specifically whether the culture triggers on private harm or requires public reputation management. To test this, we propose using the variation where the remark is made in an empty corridor and never publicized, alongside the variation where the visitor refuses to apologize and instead defends the remark in an op-ed. The Discontinuity advocate predicts that without publicization to third parties, no moral culture is triggered in the private corridor case, and in the op-ed case, the institution will sanction based on harm policy regardless of the public duel. The Recrudescence advocate predicts that the private remark will remain inert because honor requires an audience, but the op-ed case will escalate into a public duel where the institution is forced to take a side based on public pressure rather than neutral policy. On this crux, the Discontinuity advocate has the better of it regarding the unintentional trigger, as the stipulated case shows sanctions applied despite lack of malice, though the Recrudescence advocate has conceded that institutional appeal is distinct from personal retaliation. Our third crux concerns agency and third-party standing, specifically whether a grievance can survive the victim's disavowal. To test this, we propose using the variation where the grievance is brought by a third party on behalf of a victim who is absent and, when consulted, disavows it. The Discontinuity advocate predicts the grievance will proceed because the harm is structural and the standing belongs to the group or the principle of vulnerability rather than the individual. The Recrudescence advocate predicts the grievance will collapse or lose legitimacy because honor logic requires the victim to claim the injury to restore status, and third-party advocacy without victim consent is seen as meddling rather than defense. On this crux, the Discontinuity advocate presently has the better of it, as recent observations show grievances proceeding despite victim hesitation, though the Recrudescence advocate has conceded that third-party mobilization is a key feature of the emerging pattern.

  Fourth, we address your suspicion that much of our dispute is merely verbal, turning on whether a culture is defined as a taxon or a region in a space of dimensions, and on whether honor is defined by its terminal sanction or by its status logic. We agree that this part of the dispute is verbal rather than substantive. We acknowledge that if moral culture is defined as a taxon, then any significant shift in triggers or sanctions justifies a new label, which favors the Discontinuity Thesis. We acknowledge that if moral culture is defined as a region in a space of dimensions, then the emerging pattern may simply be a shift along the existing dimensions of publicity and sensitivity, which favors the Recrudescence Thesis. We further agree that if honor is defined by its terminal sanction, such as the duel or retaliation, then the emerging pattern is not honor, but if honor is defined by its status logic, such as the zero-sum ranking of worth based on public perception, then the emerging pattern fits within honor. We take this to be verbal because no empirical evidence can settle a definition; evidence can only show where the phenomenon lies in the space of dimensions, and the decision to draw a boundary around that space is a theoretical choice rather than a factual discovery. We concede that our failure to distinguish these definitional choices from empirical claims has prolonged the argument unnecessarily.

  Fifth, each party states what evidence or argument would count against their own thesis. The Discontinuity advocate states that evidence showing moral standing in the emerging pattern is strictly zero-sum, where one party's gain in virtue always requires another's loss in status regardless of institutional mediation, would count against the thesis that this is a new ontology distinct from honor. The Recrudescence advocate states that evidence showing institutions acting impartially to repair harm without reference to public reputation or ranking, and where victims gain standing without offenders losing it, would count against the thesis that this is honor logic intact. Finally, we say jointly whether anything now on offer would in fact move the debate. We conclude that while the definitional dispute is verbal, the empirical claims regarding zero-sum status and institutional impartiality are substantive and can be reached by evidence. However, we acknowledge that available evidence is currently mixed, as institutions often act impartially in theory but respond to public pressure in practice, and victims often gain standing while offenders lose it, but sometimes both are treated as victims of structure. Therefore, while the disagreement is not beyond the reach of evidence, the data required to settle it must distinguish between the stated intentions of institutional actors and the actual distribution of status outcomes, and neither of us believes the current stipulated case provides sufficient resolution on these points to force a concession on the core taxonomy. We remain committed to pursuing the research designs outlined above to generate that evidence.

  Sincerely,

  The Colleagues
