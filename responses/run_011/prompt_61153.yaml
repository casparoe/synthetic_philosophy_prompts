answer: |-
  Night Audit

  The ledger says there is no vacant room.
  I run my finger down the printed list.
  No space to accommodate a shift.
  Every lock holds its corresponding key.
  Each number matches one arriving guest.
  The corridor ends at a solid door.

  A stranger waits behind the outer door.
  I cannot show them to a room.
  Instead I ask each single guest.
  To find their number on the list.
  And surrender the brass key.
  For the number plus one, starting the shift.

  Before the next morning shift.
  A bus pulls up outside the door.
  I give each sleeper their own key.
  Telling them to double their room.
  The even numbers fill the list.
  Leaving odds for the arriving guest.

  We tell each single guest.
  Remains safe after the shift.
  Since the part matches the whole on the list.
  This is the wide open door.
  Contained within the same room.
  Turning the master key.

  I turn the heavy brass key.
  To welcome every single guest.
  Back to their assigned room.
  Ending the long night shift.
  Locking the heavy door.
  Completing the master list.

  I check the master list.
  And hold the heavy key.
  I stand before the door.
  I wait for the next guest.
  I watch the night shift.
  I measure the entire room.

  She alters one line on the list behind the door, takes the key.
  No shift matches her sequence, this uncounted guest.
  There is no free vacated room.
