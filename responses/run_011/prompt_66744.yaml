answer: |-
  ### Desiderata for a Science of Consciousness

  **1. Causal Provenance**
  *   **Statement:** The method must establish a causal chain between the subject's conscious state and the data record, distinguishing endogenous generation from exogenous insertion or confabulation.
  *   **Motivation:** In the AI-substitution apparatus, a subject endorses text they did not generate. In Nisbett and Wilson's studies, subjects confabulate reasons for choices driven by unconscious primes. If the data source is the language model or a post-hoc narrative construct rather than the experience itself, the data is about the subject's *interpretive machinery*, not their *phenomenology*.
  *   **Verdict:** Non-negotiable. Without provenance, you are studying linguistics or suggestion, not consciousness.
  *   **Interview Question:** "If a subject's report were silently generated by an external agent but endorsed by the subject, would your method classify that text as valid data about the subject's experience, and why?"

  **2. Theoretical Discriminability**
  *   **Statement:** The method must yield outcomes that can falsify a specific theory of consciousness, not merely a theory of reporting behavior.
  *   **Motivation:** Heterophenomenology is often accused of making consciousness theories unfalsifiable by treating all reports as "beliefs" to be explained away. If a theory predicts Rich Consciousness and another predicts Thin Consciousness, but the method treats the subject's claim of richness as merely a "text" to be explained cognitively, the method cannot decide between the theories. It collapses into a science of belief, not experience.
  *   **Verdict:** Non-negotiable. A science that cannot be wrong is not a science.
  *   **Interview Question:** "Describe a specific experimental result your method would accept as evidence that your preferred theory of consciousness is false."

  **3. Phenomenal Resolution**
  *   **Statement:** The method must be capable of distinguishing between distinct qualitative states even when stimulus properties and behavioral outputs are held constant.
  *   **Motivation:** In Color-Phi phenomena, subjects report motion and color change where none exists physically. In blindsight, subjects deny seeing but guess correctly. A method that relies solely on stimulus correlation misses the Phi experience; a method relying solely on accuracy misses the blindsight dissociation. The data must capture the *difference* between seeing red and seeing green, not just reporting "red" or "green."
  *   **Verdict:** Non-negotiable. If the method cannot distinguish qualia, it is not measuring consciousness.
  *   **Interview Question:** "How does your protocol differentiate between a subject who is experiencing red and a subject who is experiencing green if both are trained to press the same button for 'detection'?"

  **4. Reflexive Stability**
  *   **Statement:** The method's rules for interpreting subject reports must apply equally to the researcher's own reports, including protocol descriptions and thought-experiment intuitions.
  *   **Motivation:** Researchers often claim "I see red" is incorrigible for a subject but treat "I intuit that this thought experiment works" as objective fact. If the method treats the researcher's introspection as authoritative data while treating the subject's as mere text, it introduces a dual standard. If it treats the researcher's introspection as mere text, the theory loses its motivational grounding.
  *   **Verdict:** Preference of rigor, but practically non-negotiable for consistency. Failure here indicates a hidden appeal to first-person authority.
  *   **Interview Question:** "Do you treat your own written description of what you observed in the lab as a neutral text to be explained, or as a direct record of reality?"

  **5. Operational Scope**
  *   **Statement:** The method must explicitly define its applicability to non-verbal systems (infants, animals, AI) without relying on analogy to adult human reports.
  *   **Motivation:** If a method requires verbal reports, it cannot speak to animal consciousness. If it infers consciousness from neural structure alone, it risks panpsychism or missing consciousness in alien substrates. A method must state whether silence implies absence of data or absence of consciousness.
  *   **Verdict:** Preference of camp. Essential for comparative biology; optional for human-specific cognitive science.
  *   **Interview Question:** "Does your method assign a probability of consciousness to a non-verbal creature, and if so, on what data does that probability rest?"

  ***

  ### Resolution of Complications

  **The AI Substitution Case:** Based on **Causal Provenance**, the substituted text does *not* count as data about the subject's experience. It is data about the subject's suggestibility and the model's fluency. The method must reject the text as evidence of phenomenology, even if the subject endorses it, because the causal chain from experience to text is broken. Provenance is not a red herring; it is the boundary condition for data validity.

  **The Reflexive Case:** Based on **Reflexive Stability**, the requirement is legitimate, not a *reductio*. If a researcher claims their method validates consciousness, their own claim ("I observed consciousness") must be subject to the same scrutiny as the subject's claim. If the method cannot analyze the researcher's text without collapsing into skepticism, the method is incomplete. It is not a category mistake; it is a consistency check.

  ***

  ### The Three Things

  **1. The Incompatibility Tension**
  Your suspicion is confirmed: **Strict Neutrality** (from Heterophenomenology) and **Theoretical Discriminability** cannot be jointly satisfied in their strongest forms. If you remain strictly neutral about whether the items in the subject's world *exist* (treating them only as beliefs), you cannot use reports to confirm a theory that says those items *do* exist (e.g., that qualia are real properties). You can only confirm theories about why the subject *believes* they exist.
  *   **The Choice:** A working scientist must choose the **Discriminability** horn. To do science, you must allow data to adjudicate between rival theories of reality (e.g., Integrated Information Theory vs. Global Workspace). This requires abandoning strict neutrality: you must treat some reports as *more likely to be veridical* than others based on a background theory. Neutrality is a useful heuristic for data collection, but a poison for theory selection.

  **2. The Single Most Eliminating Requirement**
  **Theoretical Discriminability** eliminates the most popular approaches.
  *   **Why:** It disqualifies strict Heterophenomenology (which often explains away the target phenomenon), pure First-Person Authority (which makes error impossible and thus falsification impossible), and "Mysterian" approaches (which claim the data cannot decide the theory). It forces methods to risk being wrong. Many philosophical frameworks survive only because they are insulated from falsification; this requirement burns that insulation.

  **3. Requirements vs. Imported Prejudices**
  *   **Genuine Requirements:** **Causal Provenance** and **Theoretical Discriminability**. These are structural necessities for any empirical science. Without causality, you have noise; without falsifiability, you have theology.
  *   **Imported Prejudices:**
      *   *Presumptive Authority:* The demand that reports be treated as incorrigible truth is a Cartesian prejudice. As the AI substitution case shows, sincerity does not guarantee accuracy.
      *   *Non-Verbal Applicability:* The demand that a method *must* work on animals is a physicalist prejudice. A science of *human* consciousness can legitimately rely on language. However, a claim to a *general* science of mind fails without addressing Scope.
      *   *Strict Neutrality:* The demand that we never judge the reality of reported qualia is an eliminativist prejudice. It smuggles in a metaphysical stance (that only the third-person is real) under the guise of methodological caution.

  ***

  ### Scorecard

  **Heterophenomenology**
  Passes **Reflexive Stability** and **Causal Provenance** by treating all texts equally. Fails **Theoretical Discriminability** because its neutrality makes it difficult to use data to choose between competing ontologies of consciousness. It explains the report, but often explains away the experience.

  **Neurophenomenology (Trained First-Person)**
  Passes **Phenomenal Resolution** and **Theoretical Discriminability** by using refined reports to constrain neural models. Struggles with **Causal Provenance** (training may alter the experience) and **Operational Scope** (inapplicable to untrained或非-verbal subjects). High precision, low generalizability.

  **Report-Free (Neural/Behavioral Structure)**
  Passes **Operational Scope** and avoids **Presumptive Authority** prejudices. Fails **Phenomenal Resolution** and **Causal Provenance** regarding experience specifically; it measures correlates, not the phenomenon itself. It risks solving the "easy problem" while claiming to solve the hard one.
