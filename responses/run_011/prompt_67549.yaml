answer: |-
  Here are twelve questions designed to move from the macro-economic framework down to the human scale, ending with the specific leverage you need for the novel. They are ordered to build pressure: starting with data, moving through bureaucracy, testing the limits of the theory against counter-examples, and finally demanding agency.

  **1. The Baseline: Availability vs. Entitlement**
  *   **Question:** "Let's start with the grain itself. Sen's entitlement approach argues that food was available but inaccessible. But recent work suggests there *was* a genuine shortfall in 1942-43 due to cyclone and disease. In your view, what percentage of the mortality was a collapse in purchasing power versus a physical absence of rice?"
  *   **Likely Answer:** She will likely argue that even with a shortfall, the distribution mechanisms were the killer. She'll say a 10% drop in supply shouldn't cause mass death if entitlements are protected, so the *structure* is still the primary variable.
  *   **Follow-up:** "So if I find a district where supply dropped 10% and nobody died, and another where it dropped 5% and thousands died, the difference is entirely administrative? There is no threshold where 'not enough rice' becomes the story?"
  *   **Flag for Evasion:** Phrases like "It's not additive," or "We shouldn't reify the supply side." If she refuses to give even a rough heuristic percentage, she's protecting the theory from data.

  **2. The Evidence: Settling the Debate**
  *   **Question:** "What evidence would actually settle that for us? Is there a dataset—shipping manifests, provincial harvest reports, railway logs—that, if found tomorrow, would prove it was purely availability? Or is the entitlement framework unfalsifiable on that point?"
  *   **Likely Answer:** She will say data from that period is too compromised by wartime secrecy and inflation to be definitive, so we must rely on the *pattern* of mortality (who died) rather than the *amount* of food.
  *   **Follow-up:** "But if the data is too compromised to measure the food, how do we confidently measure the entitlement? Aren't we building a theory of failure on top of missing data about the success?"
  *   **Flag for Evasion:** "We have to work with what the archive allows." (This accepts the limitation rather than explaining how the theory survives it.)

  **3. The Bureaucratic Lie: "Nobody Chose This"**
  *   **Question:** "You've argued that famines are the terminal phase of a structure nobody chose. But in Bengal, grain output was often reported upward in inflated numbers, and requisition quotas were set based on those lies. Someone wrote those numbers down. Is inflating a harvest report a structural inevitability, or is it a choice?"
  *   **Likely Answer:** She will frame this as an incentive problem. Officials lied to avoid punishment from *their* superiors for missing quotas. It's a systemic pressure, not individual malice.
  *   **Follow-up:** "But a pen has to move to write a lie. If the system incentivizes lying, does that absolve the hand holding the pen, or does it just mean the crime is distributed across a thousand desks?"
  *   **Flag for Evasion:** "We must avoid anachronistic moral judgments on bureaucratic behavior."

  **4. The Denial Policies: Specific Destruction**
  *   **Question:** "Let's talk about the denial policies: the removal of boats and the destruction of rice stocks in coastal Bengal to prevent Japanese advance. That wasn't a market failure; that was a military order to destroy food. How does the entitlement framework account for deliberate destruction?"
  *   **Likely Answer:** She will argue that the *scale* of the destruction was smaller than the famine's reach, so it acted as a trigger within a vulnerable system, not the sole cause.
  *   **Follow-up:** "If I light a fuse in a powder keg, am I responsible for the explosion, or is the powder keg responsible for being there? At what point does the trigger become the story?"
  *   **Flag for Evasion:** "It's about the interaction between the shock and the vulnerability." (A classic structuralist dodge.)

  **5. The 1944 Lag: Disease and Movement**
  *   **Question:** "Half the deaths occurred in 1944, after food was moving again and the harvest was in. People died of malaria and cholera, not just starvation. Does your framework explain why the entitlement to *health* didn't return when the entitlement to *food* did?"
  *   **Likely Answer:** She will explain that population displacement and weakened immunity created a disease environment that persisted after caloric intake improved. The entitlement to healthcare remained collapsed.
  *   **Follow-up:** "So the famine didn't end when the rice arrived. It ended when the state decided the health of the labour force was worth funding. Is the 'end of famine' actually just a policy decision?"
  *   **Flag for Evasion:** "Epidemiological lag is a well-documented phenomenon." (Stating the fact without addressing the political choice.)

  **6. The Household: Who Disappears First**
  *   **Question:** "Entitlement analysis often looks at aggregates—classes, occupations. But in a household, food is rationed internally. Does your model predict who eats last? Does it tell me whether the daughter or the grandmother disappears first?"
  *   **Likely Answer:** She will likely admit that economic models struggle with intra-household distribution, which is governed by social norms and patriarchy, not just market exchange.
  *   **Follow-up:** "If the model can't see inside the room where the food is divided, can it truly explain the death that happens there? Or does it only explain who gets brought to the room?"
  *   **Flag for Evasion:** "That requires micro-level data we simply don't have." (Deflecting the theoretical limitation as a data problem.)

  **7. The Democracy Counter-Example: Ireland**
  *   **Question:** "Sen argues democracy and a free press prevent famine. But Ireland had MPs at Westminster and a free British press during the Potato Famine, and people still starved. How does your framework survive the Irish case?"
  *   **Likely Answer:** She will reiterate her known position: the blight was a genuine availability shock that overwhelmed the entitlements, unlike Bengal. The political connection was insufficient to override the biological reality.
  *   **Follow-up:** "So the press didn't fail to report it; they reported it, and nothing happened. Is the safeguard the *vote*, or is it the *fear* that the dying might vote against you?"
  *   **Flag for Evasion:** "The contexts of colonial extraction are distinct." (True, but dodges the mechanism of the free press argument.)

  **8. Visibility vs. The Vote**
  *   **Question:** "Following that: China's Great Leap Forward had no press and no vote, and millions died. Bengal had a press but no vote for most victims. If Ireland had a press and vote and still starved, is the real crux visibility to people who can be punished, rather than democracy itself?"
  *   **Likely Answer:** She will agree that *political accountability* is the mechanism, which democracy usually ensures, but can fail if the victims are politically marginalized (as in colonial contexts).
  *   **Follow-up:** "So if I can make the victims invisible to the voters, the democracy doesn't matter. Is the famine actually a failure of *visibility* rather than a failure of *government*?"
  *   **Flag for Evasion:** "Visibility is a component of accountability." (Merging the two to avoid choosing.)

  **9. The Novelist's Question: Specific Rooms**
  *   **Question:** "I'm a novelist, and I need to put a person in a room. In 1943, can you name two or three specific decisions where a specific individual moved something that mattered? Not a policy, but a signature on a page, a phone call made."
  *   **Likely Answer:** She will struggle here. She might mention Churchill's "Why hasn't Gandhi died yet?" quote (which she dislikes as attribution) or perhaps a specific Viceroy directive. She will prefer to talk about "shipping tonnage allocations."
  *   **Follow-up:** "You mentioned shipping tonnage. That's a metric, not a person. Who decided the tonnage? What was their name?"
  *   **Flag for Evasion:** "Decisions were collective within the War Cabinet." (Erasing the individual.)

  **10. The "Tonnage" Cop-Out**
  *   **Question:** "If I write a scene where a man says, 'I was thinking about shipping tonnage, not starving villagers,' is that a usable psychological truth for a character, or is it a cop-out that absolves him of humanity?"
  *   **Likely Answer:** She will say it is historically accurate; bureaucrats compartmentalize. To understand the famine, we must understand how normal people do terrible things through administrative routine.
  *   **Follow-up:** "But if I write that, does the reader forgive him? Does 'administrative routine' work as a defence in a novel the way it might in a history book?"
  *   **Flag for Evasion:** "That's a question for the literary critic, not the historian." (Refusing to bridge the gap.)

  **11. Complicity: The Rice Dealer**
  *   **Question:** "My protagonist is a rice dealer's wife. Her husband is in Calcutta making money in the war economy while the village starves. In your account, is he a victim of the entitlement structure too, or is he a beneficiary? Where does complicity begin?"
  *   **Likely Answer:** She will likely frame him as an agent of the market who is responding to price signals. He is part of the structure, but punishing him doesn't fix the structure.
  *   **Follow-up:** "So if he hoards grain to protect his family's entitlement, he accelerates the famine. Is survival in a famine always a crime against someone else?"
  *   **Flag for Evasion:** "Moral choices are constrained by survival imperatives." (Valid, but avoids the moral weight.)

  **12. The Threshold: Crime vs. Structure**
  *   **Question:** "Finally: You say 'attribution is a genre, not a finding.' But what would you have to find in the record to concede this was a crime rather than a structure? Is there a document, an order, a memo that would cross that line for you?"
  *   **Likely Answer:** She will likely say that "crime" implies legal intent that is hard to prove historically, and that "structural violence" is a more accurate description of the outcome. She may refuse the binary.
  *   **Follow-up:** "If I can show you a memo where relief was denied *after* the harvest came in, solely to prioritize war stockpiles, does 'structural violence' stop being the right word? Or is the structure itself the crime?"
  *   **Flag for Evasion:** "We need to be careful with legalistic terminology applied to historical events." (This is the ultimate shield. If she says this, she has told you she will never call it a crime.)
