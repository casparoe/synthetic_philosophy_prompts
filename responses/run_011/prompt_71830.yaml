  Dear colleague, here is the design for the session, beginning with the source text you will need to distribute on a single slip of paper before the class begins. The poem is twelve lines long and reads as follows. The sun goes down and leaves us in the cold. The stories that we never quite got told. You ask me why I did not speak your name. When fire rose and turned to ash and flame. I said the walls were high and kept us in. Where silence grew and covered up our sin. We broke the things and left them on the floor. You walked away and shut the heavy door. So tell me now, my friend, what is the point. To dig the past and make the present faint. The clock ticks loud, my friend, inside the head. Where words are lost and better left for dead.

  For your eyes only, here is the facilitator analysis of the poem's load-bearing features so you can guide the audit without revealing the secrets too early. The first feature is a rhyme scheme of couplets that is obvious, but the rhyme pair in lines nine and ten relies on a slant rhyme between point and faint that forces a specific pronunciation. The second feature is the repeated address my friend in lines nine and eleven, which shifts from a conciliatory gesture in line nine to an accusatory intimacy in line eleven. The third feature is a garden-path enjambment between lines five and six, where kept us in could initially read as a prepositional phrase modifying walls, but the line break forces in to function as an adverb, changing the syntax. The fourth feature is a metrical substitution in line five, where I said creates a trochaic inversion at the start of the iambic line, marking the turn in the argument. The crucial design requirement you asked for is the fifth feature, which is effectively invisible on a first reading and only becomes visible when someone tries to rebuild the poem from a prose summary or during the audit. Every single line in the source poem ends with a monosyllabic word. This constraint is not obvious when reading for meaning, it is inevitably lost when writing a prose paraphrase because prose prioritizes clarity over sound, and it will be nearly impossible for students to reconstruct without knowing it was there, which proves that form carries information that paraphrase discards.

  You should begin the hundred minutes by handing out the poem and giving the students three minutes to read it silently, followed by seven minutes to write a one-sentence statement of what the poem says on a slip of paper that they must seal in an envelope and give to you immediately. This seals their initial interpretive stance before any discussion contaminates it. Next, move them into pairs and give them fifteen minutes to produce an unconstrained prose paraphrase of the poem that captures the meaning as accurately as possible without worrying about rhyme or lineation. Collect these paraphrases and then redistribute them so that each pair receives a paraphrase written by a different pair, ensuring no one has access to the original text during the reconstruction phase. Give them twenty minutes to rebuild a poem from the paraphrase they received, instructing them to make it feel like a poem again without seeing the source. This reconstruction gap will demonstrate that a paraphrase is not a lossless encoding because they will produce twelve different versions from the same prose, proving the indeterminacy of form.

  Once they have rebuilt their versions, you will introduce the constraint ladder, which consists of four tightening rungs distributed stage by stage over thirty minutes, allowing seven minutes per rung with brief transitions. The first rung requires that every line must end with a rhyme. The second rung requires that every line must contain exactly ten syllables. The third rung requires that the address my friend must appear exactly twice. The fourth rung is the critical twist where the only way to satisfy the constraint is to introduce material that is not in the source, specifically requiring that the final line must contain a word that does not appear in the paraphrase but resolves the ambiguity of the garden-path enjambment. You must score this introduction of new material as fidelity rather than license, forcing the group to ask whether their price system is tracking the right thing. To manage this, you will implement a token economy where each translator starts with three license tokens. A token buys permission to break one constraint on one line without penalty. Unspent tokens are worth five fidelity points each at the end of the session. The audit works by appointing two students as auditors who hold the feature list while the translators do not. The auditors check the final translations against the constraint ladder and the hidden feature of monosyllabic line endings. This asymmetry makes the auditors the sole arbiters of truth, simulating the way theoretical frameworks dictate what counts as valid data in interpretation. The winner is determined by the highest total of fidelity points plus unspent tokens, and the group must agree on one translation to serve as the poem for an outside reader who will never see the original. You will send this winning version to your parallel section and report back next week on what those readers took the poem to be about, which creates real stakes for the fidelity of the translation.

  To close the session, reopen the sealed one-sentence statements and compare them against the winning translation to see how the constraints shifted the meaning. The debrief should map particular moments onto the issue rather than restating it abstractly. You should highlight what the reconstruction gap shows about a paraphrase being a lossless encoding, specifically noting how many different poems emerged from the same prose. You should discuss what the token market reveals about the price of form, asking students if they spent tokens to save meaning or to save sound. You should ask what the audit reveals about who is entitled to say what a translation is faithful to, given that the auditors held the key to the hidden feature. This activity lands relative to Quine by illustrating a problem he never raised, because Quine assumed indeterminacy arises from the underdetermination of reference by behavior, whereas this seminar shows that indeterminacy arises from the underdetermination of meaning by form. Quine did not care about the meter, but this exercise proves that meter is part of the reference.

  You must be prepared for several things that will predictably go wrong the first time you run this. Timing overruns are likely during the constraint ladder, so you must enforce the seven-minute limit strictly using a visible timer. One strong writer may dominate a pair, so you should assign roles at the start of the paired round, designating one student as the scribe and the other as the speaker. Students may produce free verse and declare the constraints satisfied, but the auditors are empowered to reject these versions during the audit phase. Auditors may turn punitive, so you must instruct them beforehand that their role is to verify features, not to judge quality. Tokens may be hoarded or ignored, so remind them midway through the ladder that unspent tokens are only valuable if the final translation is accepted by the group. The sealed statements may come back too uniform to yield variance at the end, in which case you should ask them to rewrite the statements based on the winning translation and compare the two versions to see what changed. If a student translation turns out to be simply better than the source, you should acknowledge it as a superior poem but note that the game was fidelity to the source constraints, not improvement, which reinforces the tension between art and translation.

  Finally, I must offer an honest note on what the activity cannot reproduce and what you must therefore supply yourself. The activity cannot reproduce the absence of a second language and a real readership with expectations, because everyone here speaks English and knows the game is artificial. The fact that these constraints are imposed by a teacher rather than loved in a source text means the students lack the motivation of a real translator who cares about the original author. You must supply the gravity of the situation by treating the winning translation as a real document that will be read by strangers, and you must emphasize that the constraints are not arbitrary rules but structural elements that carry meaning. By the end of the hundred minutes, the students will have earned an understanding of how form constrains meaning and how fidelity is a negotiated economy, but they will not have earned the experience of the linguistic barrier that makes translation necessary. You will need to bridge that gap in your closing remarks by reminding them that in real translation, the constraints are not tokens to be spent but realities of the language that cannot be bought away. I hope this design serves your seminar well and provokes the kind of friction you are looking for.
