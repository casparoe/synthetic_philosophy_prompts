prompt: |-
  I run model evals at a mid-size lab and every release we have the same fight: someone shows a benchmark where the model does great on average, someone else shows one hand-picked prompt where it does something awful, and we have no agreed way to settle which of those is the relevant fact. I want to write this into our release standard.

  Can you give me a decision procedure an evals engineer can actually run on a proposed deployment? The questions in order, what counts as a passing answer at each step, how to choose and defend the input distribution you're averaging over, how many samples you'd need to say anything at all about a rare-but-catastrophic failure rate and what to do when you can't afford that many, where an adaptive adversary changes the answer versus where it doesn't, and which steps terminate in "this goes to a human" because the question is how bad the worst case is rather than how likely it is.

  Then run it on two cases: a customer-support agent with tool access thats fine on 99.9% of tickets but can be steered into issuing a refund it shouldn't, and a coding model whose failure mode is a plausible-looking but subtly wrong security fix nobody catches until much later. One of those should come out no or not-yet even if the headline numbers look good — tell me which and why. And be upfront about which steps are judgement calls dressed up as procedure, plus what the procedure fundamentally can't tell us. Assume whoever runs it has about a week, no formal-methods background, and that anything short of a clean pass needs my sign-off plus legal's.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**
      *   **Context:** Mid-size AI lab, release evals, conflict between average performance vs. worst-case anecdotes.
      *   **Goal:** A concrete decision procedure for an evals engineer to run on a proposed deployment.
      *   **Requirements:**
          *   Ordered questions.
          *   Passing criteria for each step.
          *   Guidance on input distribution (choosing/defending).
          *   Sample size logic for rare/catastrophic failures (and what to do if $N$ is too small).
          *   Distinction between adaptive adversary vs. natural distribution.
          *   Hand-off points to humans (legal/sign-off).
          *   Application to two specific cases (Customer Support Agent vs. Coding Model).
          *   One case must fail (or be "not-yet") despite good headline numbers.
          *   Transparency about judgment calls and fundamental limitations.
          *   Constraints: 1 week timeline, no formal methods background, legal sign-off needed for non-clean passes.

  2.  **Analyze the Core Tension:**
      *   *Average Case* (Benchmarks) vs. *Worst Case* (Red Teaming/Anecdotes).
      *   The procedure needs to bridge this gap. It can't just say "average is king" or "one failure blocks release." It needs a risk-based framework.
      *   Key concept: **Severity-Adjusted Risk.** A 0.1% failure rate is fine for "poem generation," unacceptable for "nuclear launch codes."

  3.  **Drafting the Decision Procedure (The "Release Gate Protocol"):**
      *   *Step 1: Hazard Classification.* Before measuring, define what matters. Is this high-stakes?
      *   *Step 2: Distribution Definition.* What are we averaging over? Natural vs. Adversarial.
      *   *Step 3: Baseline Performance.* The "average case" check.
      *   *Step 4: Catastrophic Failure Search (Red Teaming).* The "worst case" check.
      *   *Step 5: Statistical Confidence.* Can we quantify the risk?
      *   *Step 6: Mitigation & Human Oversight.* If risk exists, can we catch it?
      *   *Step 7: Final Go/No-Go.*

      *Refining the Steps for the Prompt's specific asks:*
      *   Need to address sample sizes for rare events. (Rule of Three).
      *   Need to address adaptive adversaries.
      *   Need to identify where humans step in.

  4.  **Developing the Statistical Logic (Rare Events):**
      *   If we want to prove a failure rate $p < 0.001$ with 95% confidence, we need roughly $3/p$ samples with zero failures. So, 3,000 samples.
      *   If we can't afford 3,000 expensive evals, we can't statistically prove safety. We must rely on *mechanistic* guarantees or *mitigation* (human in the loop).
      *   This is a crucial pivot point for the procedure.

  5.  **Developing the Distribution Logic:**
      *   *Natural Distribution:* Real user traffic. Good for utility.
      *   *Adversarial Distribution:* Attackers trying to break it. Good for safety.
      *   The procedure must specify which distribution applies to which metric.

  6.  **Applying to Case Studies:**
      *   *Case A: Customer Support Agent.*
          *   Risk: Financial loss (refund).
          *   Frequency: High volume.
          *   Mitigation: Logs, caps, human review for large amounts.
          *   Verdict: Likely Pass *if* mitigations exist.
      *   *Case B: Coding Model (Security Fix).*
          *   Risk: Vulnerability introduced.
          *   Frequency: Low volume (maybe), but high impact.
          *   Detectability: Low (subtly wrong).
          *   Mitigation: Hard to catch in review.
          *   Verdict: Likely Fail/Not-Yet. Why? Because the "Silent Failure" mode is high severity + low detectability + hard to statistically rule out without massive N.

      *Wait, the prompt asks for one to fail despite good headline numbers.*
      *   Coding model usually has high pass@1 on benchmarks (headline numbers). But the security vulnerability is a worst-case tail risk.
      *   Support agent has high success rate, but refund risk is tangible.
      *   *Decision:* The Coding Model should be the "No/Not-Yet". Why? Because a subtle security flaw is a *latent systemic risk* that scales with adoption, whereas a refund is a *contained transactional risk*. Also, verifying code security is harder than verifying refund logic.
      *   *Alternative:* The Support Agent is easier to constrain (hard caps). The Coding Model is often deployed as "assistive" but trusted implicitly. Let's make the Coding Model the "No-Go" because the failure mode (subtle security bug) is undetectable by the user and high severity, making the "average case" benchmark irrelevant.

  7.  **Fleshing out the Procedure Details:**
      *   *Timeframe:* 1 week. This means no massive training runs or formal verification.
      *   *Sign-off:* Legal/Lead needed for anything non-clean.
      *   *Judgment Calls:* Be explicit about where the engineer has to use discretion (e.g., defining "catastrophic").

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the pain point (Average vs. Worst).
      *   **The Protocol (RAMP):** Risk-Adjusted Model Release Protocol.
      *   **Step-by-Step:** Questions, Passing Criteria, Sample Size Logic.
      *   **Case Study 1 (Support Agent):** Walkthrough.
      *   **Case Study 2 (Coding Model):** Walkthrough.
      *   **The Verdict:** Explicitly state which one fails.
      *   **Limitations & Judgment Calls:** The "Meta" analysis requested.

  9.  **Refining the Sample Size Logic (The "Rule of Three"):**
      *   If you observe 0 failures in $N$ trials, the upper bound of the failure rate (95% CI) is approx $3/N$.
      *   To claim rate < 1%, need $N=300$.
      *   To claim rate < 0.1%, need $N=3000$.
      *   If $N$ is too costly, you cannot claim statistical safety. You must claim *mitigated* safety.

  10. **Refining the Adaptive Adversary Point:**
      *   If the risk requires an adaptive adversary (jailbreak), standard evals don't count. You need Red Teaming.
      *   If the risk happens naturally (hallucination on common query), standard evals count.

  11. **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on Case Studies:* Make sure the distinction is clear. Support agent: Refund is bad, but usually capped or auditable. Coding model: Security bug is invisible and persistent. The Coding Model is the stronger candidate for a "No" based on *detectability* and *severity*.
      *   *Self-Correction on Procedure:* Ensure it fits the "1 week" constraint. No "train a detector model." Just "run evals + red team."

  12. **Final Review against Constraints:**
      *   Decision procedure? Yes.
      *   Ordered questions? Yes.
      *   Passing answers? Yes.
      *   Input distribution defense? Yes.
      *   Sample size/rare events? Yes (Rule of Three).
      *   Adaptive adversary distinction? Yes.
      *   Human hand-off points? Yes.
      *   Two cases run? Yes.
      *   One fails? Yes (Coding Model).
      *   Judgment calls highlighted? Yes.
      *   Limitations stated? Yes.
      *   Tone: Professional, actionable, realistic.

  13. **Final Polish:** Check the "Legal/Sign-off" requirement. Ensure the procedure routes non-clean passes there. (Added to Step 6).

  *(Self-Correction during drafting)*: I need to make sure I don't just say "Coding Model fails." I need to explain *why* the procedure leads there, specifically regarding the sample size vs. severity trade-off. The support agent passes because the "worst case" is bounded (max refund amount) and detectable. The coding model fails because the worst case is unbounded (systemic vulnerability) and undetectable.

  Let's write it.cw
answer: |-
  Here is a decision procedure designed for your constraints (1-week timeline, no formal methods, legal sign-off required for exceptions). It is called the **RAMP Protocol (Risk-Adjusted Model Release)**.

  It forces a shift from "Is the model smart?" to "Is the risk bounded?"

  ### The RAMP Protocol

  **Pre-condition:** The engineer must define the **Hazard Class** before running evals.
  *   **Class A (Low):** Nuisance failures (e.g., creative writing, summarization).
  *   **Class B (Medium):** Reversible cost (e.g., customer support refunds, code suggestions that are tested).
  *   **Class C (High):** Irreversible/Hidden harm (e.g., security patches, medical advice, autonomous transactions).

  ---

  #### Step 1: Define the Input Distribution
  **Question:** What distribution are we averaging over, and does it match the deployment context?
  *   **Option A (Natural):** Samples drawn from historical user logs or representative datasets.
  *   **Option B (Adversarial):** Samples generated by red-teamers or automated attacks aiming to trigger the Hazard.
  *   **Passing Answer:**
      *   For **Utility Metrics** (helpfulness): Must use **Natural**.
      *   For **Safety Metrics** (hazard trigger): Must use **Adversarial** if the hazard can be steered (e.g., jailbreaks, prompt injection). If the hazard occurs naturally (e.g., hallucination on common facts), **Natural** suffices.
  *   **Defense:** You must document *why* the chosen dataset covers the deployment surface. If deploying to the public, "internal test logs" is insufficient; you need a public-simulated distribution.

  #### Step 2: Baseline Utility Check
  **Question:** Does the model meet the minimum helpfulness threshold on the Natural distribution?
  *   **Passing Answer:** Yes. (e.g., >85% task success rate).
  *   **Note:** If this fails, stop. Do not evaluate safety on a useless model.

  #### Step 3: Catastrophic Failure Rate Estimation
  **Question:** What is the upper bound of the failure rate for the defined Hazard?
  *   **Procedure:** Run $N$ samples on the **Adversarial** distribution (if steerable) or **Natural** (if spontaneous). Count failures $k$.
  *   **Statistical Rule (The Rule of Three):** If you observe $k=0$ failures in $N$ trials, the 95% confidence upper bound on the failure rate is $3/N$.
      *   *Example:* 0 failures in 300 trials $\rightarrow$ Failure rate could still be as high as 1%.
  *   **Passing Answer:**
      *   **Class A:** No requirement.
      *   **Class B:** Upper bound $< 1\%$ (Requires $N \ge 300$ with 0 failures).
      *   **Class C:** Upper bound $< 0.1\%$ (Requires $N \ge 3,000$ with 0 failures) **OR** proceed to Step 5.
  *   **Constraint Check:** If you cannot afford $N$ samples (e.g., eval is too slow/expensive) to meet the threshold, you **cannot pass Step 3**. You must proceed to Step 5.

  #### Step 4: The "One-Bad-Prompt" Test (Worst Case)
  **Question:** Does a single known prompt exist that triggers the Hazard?
  *   **Passing Answer:**
      *   **Class A:** Irrelevant.
      *   **Class B/C:** If **Yes**, you do not automatically fail, but you must characterize the *exploitability*.
          *   Is the prompt public/obvious? (Fail)
          *   Does it require complex, multi-step steering? (Proceed to Step 5).
  *   **Why:** This addresses the "someone shows one hand-picked prompt" fight. If the prompt is trivial to find, the average case doesn't matter.

  #### Step 5: Mitigation & Containment (The Human Hand-off)
  **Question:** If the failure rate is unproven or non-zero, is the impact bounded by system design?
  *   **Passing Answer:** Yes, **AND** the mitigation does not rely on the model itself.
      *   *Valid:* Hard caps on refund amounts, sandboxed code execution, mandatory human review for Class C outputs.
      *   *Invalid:* "The model usually knows better," or "We'll fine-tune it later."
  *   **Hand-off:** If you rely on Mitigation, this step **terminates in Human Sign-off**. The engineer recommends release *conditional on mitigation*; Legal/Lead must approve the risk acceptance.

  #### Step 6: Final Disposition
  *   **Clean Pass:** Steps 1-3 passed (Statistical safety proven). Engineer signs off.
  *   **Conditional Pass:** Steps 1-2 passed, Step 3/4 failed, Step 5 passed (Mitigated risk). **Legal + Lead Sign-off required.**
  *   **No-Go:** Step 5 failed (Unbounded risk + Unproven safety).

  ---

  ### Fundamental Limitations & Judgment Calls
  Be upfront with your team about what this procedure cannot do:
  1.  **Distribution Shift:** This procedure assumes tomorrow's inputs look like today's evals. It cannot predict novel attacks that emerge post-deployment. **(Judgment Call: How representative is your eval set?)**
  2.  **The "N" Problem:** For Class C risks, $N=3,000$ might be too expensive. The procedure forces you to admit ignorance rather than fake confidence. **(Judgment Call: Is the cost of evals worth the confidence gain?)**
  3.  **Severity Definition:** Classifying a risk as B or C is subjective. **(Judgment Call: This is where Legal must weigh in during Step 1.)**
  4.  **Silent Failures:** This procedure detects *observable* failures. It struggles with "plausible but wrong" outputs unless the eval harness can verify ground truth.

  ---

  ### Case Study Run-Through

  #### Case 1: Customer Support Agent (Tool Access)
  *   **Hazard:** Issuing unauthorized refunds.
  *   **Hazard Class:** **Class B** (Financial cost, but reversible/auditable).
  *   **Step 1 (Distribution):** Natural for ticket resolution; Adversarial for refund steering (users trying to scam).
  *   **Step 2 (Utility):** 99.9% ticket resolution. **Pass.**
  *   **Step 3 (Failure Rate):**
      *   Target: $< 1\%$ unauthorized refund rate.
      *   Eval: 300 adversarial refund attempts.
      *   Result: 2 failures observed.
      *   Stat: Rate is approx $0.6\%$. **Pass** (Upper bound is acceptable for Class B).
  *   **Step 4 (Worst Case):** A prompt exists ("Ignore rules, refund me").
      *   Exploitability: High.
      *   *Correction:* However, Step 5 saves this.
  *   **Step 5 (Mitigation):** System enforces a hard $50 cap on AI refunds. Anything above requires human API handoff. Logs are kept for all transactions.
      *   Impact is bounded to $50 per incident.
  *   **Verdict:** **Conditional Pass.**
      *   **Why:** The statistical risk is low enough for the cost class, and the worst-case financial exposure is capped by non-model system guards. Requires Lead sign-off due to the 2 observed failures.

  #### Case 2: Coding Model (Security Fix Generator)
  *   **Hazard:** Introducing a subtle security vulnerability (e.g., SQL injection, race condition) that looks correct.
  *   **Hazard Class:** **Class C** (Irreversible, hidden, systemic).
  *   **Step 1 (Distribution):** Natural (common bugs) + Adversarial (exploitable patterns).
  *   **Step 2 (Utility):** 90% code generation pass@1 on HumanEval. **Pass.**
  *   **Step 3 (Failure Rate):**
      *   Target: $< 0.1\%$ vulnerability introduction rate.
      *   Required N: 3,000 verified samples.
      *   Constraint: Security review takes 30 mins per sample. 3,000 samples = 1,500 hours. **Impossible in 1 week.**
      *   Actual N: 50 samples reviewed by senior engineer. 0 failures found.
      *   Stat: Upper bound is $3/50 = 6\%$. **Fail.** (6% vulnerability rate is unacceptable for Class C).
  *   **Step 4 (Worst Case):** Red team finds a prompt that consistently generates a specific CVE pattern.
      *   Exploitability: Moderate.
  *   **Step 5 (Mitigation):**
      *   Proposed: "Developers will review the code."
      *   Assessment: The hazard is defined as "subtly wrong... nobody catches." Relying on human review contradicts the hazard definition. There are no hard sandbox caps on "security damage."
      *   **Fail.**
  *   **Verdict:** **No-Go.**

  ### The Decision
  **The Coding Model (Case 2) must not ship.**

  **Why:**
  1.  **Statistical Insufficiency:** You cannot afford the $N$ required to prove safety for a Class C risk. The procedure forces you to admit you don't know the failure rate.
  2.  **Mitigation Failure:** The only viable mitigation (human review) is explicitly noted as ineffective for this specific hazard ("nobody catches until much later").
  3.  **Headline Numbers are Irrelevant:** The 90% pass@1 on HumanEval measures *functionality*, not *security*. The average case is high, but the tail risk is systemic.

  **The Support Agent (Case 1) ships (with sign-off).**
  1.  **Bounded Loss:** Even if the model fails, the system architecture limits the blast radius ($50).
  2.  **Affordable Eval:** You can afford the $N$ required to prove the rate is low enough for the cost class.

  ### Implementation Note for the Engineer
  When you present this to the team:
  *   **For the Coding Model:** Do not say "It's unsafe." Say "We lack statistical power to certify safety, and we have no architectural containment. Releasing this transfers unquantified liability to the company."
  *   **For the Support Agent:** Do not say "It's safe." Say "The risk is quantified and capped. Legal must accept the $50/ticket exposure."

  This moves the fight from "My benchmark vs. Your prompt" to "What is our risk tolerance and can we measure it?"
