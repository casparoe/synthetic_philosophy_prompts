      *Actually, looking at the "Marta" case:* The key feature is "unactionable." This points directly to Ought-Implies-Can. So Hypothesis 2 is very strong. But *why* do they disagree on Ought-Implies-Can? Because of how they represent the norm (Hypothesis 3).
