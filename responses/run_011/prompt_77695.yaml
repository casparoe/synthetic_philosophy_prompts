          *   *Wait, SSA says Alpha CAN steal.* The failure is when Alpha *won't* or *can't* because the strategy relies on Beta's specific values.
          *   *Revised Mechanism:*
              *   Shared board of "Plans" (Cards).
              *   Beta picks a Plan to execute.
