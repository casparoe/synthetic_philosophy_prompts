      *   **Core Concept:** SSA = A more capable agent can usually do whatever a less capable agent can do, so capability swamps values *unless* plans are value-indexed (i.e., depend on the specific agent's preferences/identity).
      *   **Requirements:**
          *   In-class game (teams, different payoff functions, capability asymmetry, copyable vs. non-copyable plans).
          *   Experience the difference through play, not lecture.
