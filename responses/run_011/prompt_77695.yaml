prompt: |-
  I'm a 4th-year philosophy PhD student and next week I'm running a 75-minute session for ~20 people, mixed crowd: half our departments students, half CS grad students, and basically none of them have read the AI-alignment literature. Topic is the strategy-stealing assumption — roughly, the idea that in a competitive race a more capable agent can implement whatever plan a less capable one could have implemented, so capability advantage swamps differences in terminal values, except insofar as some plans are indexed to the values of whoever executes them and stop paying off in other hands.

  Design an in-class game that gets them to feel when that's true and when it quietly isn't. I want two or more teams with genuinely different payoff functions over the same outcome space, an explicit capability asymmetry (more moves, more resources, better information, your call), and a plan space where some plans are freely copyable by the strong team and some aren't — they should hit that difference while playing, not from a slide. Points only, no real money, but make the scoring something they'll actually care about. They shouldn't hear the label until the debrief; I want them leaving with the sense that this is a contingent claim about a class of plans, not a law of nature.

  Then give me: the debrief mapping specific rounds onto the assumption and its failure conditions, a list of what will predictably break the first time I run it and how to patch it mid-session, and an honest note on what a tokens-and-cards game can't reproduce about the real claim. And if it can be squeezed into 50 minutes with 12 people, tell me exactly what to cut.
