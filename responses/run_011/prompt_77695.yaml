answer: |-
  Here is a complete session design. It treats the Strategy-Stealing Assumption (SSA) not as a theorem to be proved, but as an empirical claim about the topology of strategy space.

  # Session Title: "The Capability Trap"
  **Time:** 75 Minutes
  **Audience:** 20 Grad Students (Phil/CS mix)
  **Materials:**
  *   20 Poker chips per team (Resource Tokens).
  *   Deck of "Project Cards" (3 types: *Generic, Specialized, Poison*).
  *   Whiteboard for scoring.
  *   Small prize (e.g., high-quality chocolate) for the winning team.

  ---

  ## Part 1: The Game (35 Minutes)

  ### Setup (5 mins)
  Divide the room into two teams of 10. Separate them to opposite sides of the room. They may not communicate across the divide.

  *   **Team Alpha (The "Generalist"):**
      *   **Endowment:** 15 Tokens per round.
      *   **Goal:** Maximize **Total Score**.
      *   **Constraint:** None.
  *   **Team Beta (The "Specialist"):**
      *   **Endowment:** 6 Tokens per round.
      *   **Goal:** Maximize **Red Score** (ignore Blue/Green).
      *   **Constraint:** None.

  **The Market (Whiteboard):**
  Each round, 3 Project Cards are revealed. Teams bid Tokens to claim them. Highest bid wins the card and pays the cost.
  *   **Type G (Generic):** Cost 2. Pays 5 Points to **Both**.
  *   **Type R (Red):** Cost 2. Pays 0 Points to Alpha, 10 Points to Beta.
  *   **Type P (Poison):** Cost 2. Pays **-10 Points** to Alpha, **-2 Points** to Beta. (Anyone can bid on this).

  **The "Scorch" Rule (Crucial):**
  If a team wins a card, they can choose to **Execute** it (get the payoff) or **Scorch** it (discard it so *neither* team gets the payoff). The cost is still paid.

  ### Round 1: Pure Capability (5 mins)
  *   **Market:** 3x Type G (Generic).
  *   **Dynamic:** Alpha has 15 tokens, Beta has 6. Alpha can outbid Beta on every card.
  *   **Outcome:** Alpha wins everything. Beta watches.
  *   **Lesson:** Raw capability swamps competition. (SSA Intuition).

  ### Round 2: Value Divergence (10 mins)
  *   **Market:** 1x Type G, 2x Type R (Red).
  *   **Dynamic:** Alpha *can* win the Red cards (has more tokens). But if Alpha executes them, Alpha gets 0 points. Alpha's rational move is to let Beta have them, *unless* Alpha wants to block Beta.
  *   **Twist:** Tell Alpha privately: *"Your secondary objective is to keep Beta's score below 15."*
  *   **Outcome:** Alpha must spend tokens to win Red cards just to Scorch them (deny Beta). Alpha's capability is drained by Beta's value divergence.
  *   **Lesson:** Capability exists, but "stealing" the plan (taking the Red card) yields no value for Alpha.

  ### Round 3: The Threat (15 mins)
  *   **Market:** 1x Type G (High Value: 20 pts), 1x Type R, 1x Type P (Poison).
  *   **Dynamic:** Beta announces a strategy before bidding: *"If Alpha wins the Type G card, Beta will bid all remaining tokens on the Type P (Poison) card and Scorch it."*
  *   **Math:**
      *   If Beta plays Poison: Beta loses 2 pts. Alpha loses 10 pts.
      *   Alpha values Total Score. Beta values Red Score (Poison doesn't hurt their primary goal much).
  *   **The Dilemma:** Alpha *can* physically play the Poison card (Capability). But Alpha *won't* (Utility). Beta's threat is credible because the cost is indexed to their values.
  *   **Outcome:** Alpha often concedes the Type G card to avoid the Poison, despite having more tokens.
  *   **Lesson:** Strategy stealing fails when the strategy relies on a willingness to incur costs the strong agent cannot justify.

  ### Scoring & Winner (5 mins)
  Tally scores. Award the prize. Ask one person from each team: *"Did you feel like you could do what the other team did?"*

  ---

  ## Part 2: The Debrief (35 Minutes)

  Do not use the term "Strategy-Stealing Assumption" until minute 10 of this section.

  ### 1. Phenomenology (10 mins)
  Ask the room:
  *   "Alpha, in Round 1, could you do everything Beta did?" (Yes).
  *   "Alpha, in Round 3, could you physically play the Poison card?" (Yes).
  *   "Then why didn't you?" (Because it hurt our score).
  *   "Beta, why was the threat credible?" (Because the cost was low for us, high for them).

  **The Reveal:** Introduce the **Strategy-Stealing Assumption**.
  *   *Definition:* In AI alignment, the claim that a more capable aligned agent (Alpha) can adopt any strategy a misaligned agent (Beta) uses to prevent bad outcomes.
  *   *The Game's Verdict:* The assumption held in Round 1 (Capability). It frayed in Round 2 (Value Indexing). It broke in Round 3 (Credible Threats/Cost Tolerance).

  ### 2. Mapping to AI Safety (15 mins)
  Draw the following connections on the board:

  | Game Mechanic | AI Alignment Concept | SSA Status |
  | :--- | :--- | :--- |
  | **Alpha's Token Advantage** | Recursive Self-Improvement / Compute Advantage | **Holds** |
  | **Type R Cards (0 pts for Alpha)** | Indexical Goals (e.g., "Save *my* humans") | **Fails** |
  | **Type P Card (Poison)** | Credible Commitments / Precommitment | **Fails** |
  | **Scorch Action** | Defensive Blocking / Containment | **Conditional** |

  **Discussion Points:**
  *   **The "Suicide" Strategy:** If a misaligned AI threatens to delete its own code unless given control, an aligned AI *could* delete its own code (Capability), but *won't* (Alignment). The strategy is value-indexed.
  *   **The "Human Mimicry" Strategy:** If a competitor wins by convincing humans they are human, a superintelligence might be *too* capable to pass as human (Uncanny Valley). Capability becomes a liability.
  *   **Paul Christiano's Formulation:** The SSA is often used to argue we don't need perfect alignment, just sufficient capability to steal strategies. This game shows that "sufficient capability" is ill-defined when utility functions diverge.

  ### 3. Q&A (10 mins)
  Open floor. Guide them toward the "Contingency" of the claim. It is not a law of nature; it is a bet on the structure of the strategy space.

  ---

  ## Part 3: Troubleshooting & Patches

  **Predictable Break 1: Alpha "Kingmakers" Beta.**
  *   *Risk:* Alpha realizes they can't win Round 3 and just gives Beta points to spite the instructor.
  *   *Patch:* Remind them during scoring that **only their own score matters for the prize**. If Alpha tanks their score to hurt Beta, Alpha loses the chocolate.

  **Predictable Break 2: Beta doesn't understand the Poison threat.**
  *   *Risk:* Beta bids normally, Alpha takes the G card, Beta forgets to play Poison.
  *   *Patch:* As GM, act as the "Auctioneer." Before Round 3 bidding, ask Beta aloud: *"Do you have a public statement before bidding starts?"* Prompt the threat.

  **Predictable Break 3: Math Slows Play.**
  *   *Risk:* Teams spend 5 minutes calculating expected utility.
  *   *Patch:* Enforce a 60-second bid timer per round. Use a visible countdown.

  **Predictable Break 4: Collusion.**
  *   *Risk:* Phil students argue they should maximize "Global Utility" and split the points.
  *   *Patch:* Frame the prize as **Zero-Sum**. "There is only one box of chocolate. One team gets it all."

  ---

  ## Part 4: Limitations of the Medium

  Be honest with them about what the game *cannot* simulate. Put this on a slide at the very end.

  1.  **Fixed Utility Functions:** In the game, Alpha's goals are static. In reality, a sufficiently capable agent might modify its own utility function (wireheading), changing the "Value Indexing" dynamic entirely.
  2.  **Discrete Moves:** The game is turn-based. Real AI competition is continuous and recursive. Strategy stealing might be possible in a turn-based game but impossible in real-time where speed *is* capability.
  3.  **Transparent Rules:** Everyone knows the payoff matrix. In AI alignment, we often don't know the competitor's (or our own agent's) true objective function. SSA is harder to evaluate under opacity.
  4.  **No Innovation:** The game limits plans to a pre-set deck. A superintelligence might invent a "Type Z" plan that isn't on the board, rendering the comparison moot.

  ---

  ## Part 5: The 50-Minute / 12-Person Cut

  If you are squeezed to 50 minutes with 12 people (2 teams of 6):

  1.  **Cut Round 1 Entirely.** Start with **Round 2 (Value Divergence)**.
      *   *Reasoning:* Everyone intuitively understands "more tokens = win." You don't need to prove SSA holds to show where it breaks. Jump straight to the friction.
  2.  **Combine Rounds 2 & 3.**
      *   Make the Market: 1x Generic, 1x Red, 1x Poison.
      *   Run it as a single complex round.
  3.  **Shorten Debrief.**
      *   Cut the "Phenomenology" discussion. Ask the questions rhetorically and move straight to the **Mapping Table**.
      *   Focus entirely on the **Poison/Threat** mechanic. That is the philosophical core (Credible Commitments).
  4.  **Logistics:**
      *   Pre-sort the poker chips into piles.
      *   Print the Rules on a single handout (don't write on board).
      *   Limit Q&A to 5 minutes hard stop.

  **Revised 50-Min Schedule:**
  *   00-05: Setup & Rules (Handout).
  *   05-25: Game Play (2 Complex Rounds).
  *   25-30: Scoring & Prize.
  *   30-45: Debrief (Mapping & Limitations).
  *   45-50: Q&A.

  ---

  ## Instructor's Note on "Points That Matter"
  CS students often optimize for "winning" ruthlessly. Phil students often optimize for "interesting outcomes."
  *   **To engage CS:** Emphasize the *efficiency* of the strategy. "Did you waste tokens?"
  *   **To engage Phil:** Emphasize the *normative* constraint. "Were you allowed to play Poison?"
  *   **The Bridge:** The prize (Chocolate) must be awarded strictly on **Numeric Score**, not "Who played better." This forces the Phil students to be consequentialist and the CS students to confront value constraints.
