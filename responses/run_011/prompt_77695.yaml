          *   Debrief mapping rounds to SSA/failure conditions.
          *   Troubleshooting (what breaks & how to patch).
          *   Limitations of the medium (what the game *can't* show).
          *   Condensed version (50 mins, 12 people).
      *   **Constraint:** Do not reveal the label "Strategy-Stealing Assumption" until the debrief.

  2.  **Deconstruct the Strategy-Stealing Assumption (SSA):**
      *   *Premise:* Agent A (Aligned/Good) vs. Agent B (Misaligned/Bad). If B has a strategy $S$ to achieve outcome $O$, and A is more capable, A can usually execute $S$ to achieve $O$ (or something better).
      *   *Implication:* We don't need to worry as much about B's specific goals if A is sufficiently capable, because A can "steal" B's strategies to prevent bad outcomes.
      *   *Failure Condition:* Strategies that are *indexical* or *value-dependent*. E.g., "Sacrifice yourself." A capable agent who values self-preservation won't steal that strategy. Or "Convince humans you are human." A robot might not be able to do that as well as a human, regardless of IQ.
