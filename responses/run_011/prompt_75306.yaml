answer: |-
  ### Preamble: The Value of Information

  Good's theorem states that if you are trying to make a decision, obtaining free information before deciding is never worse than deciding immediately, and is often better. This result is not a universal law of rationality but a mathematical consequence of several specific assumptions holding true simultaneously. It requires that the information costs nothing, arrives instantly, and does not physically alter the outcome you are judging. It assumes you update your beliefs logically, your goals remain stable regardless of what you learn, and you care only about the final consequence, not the state of your own knowledge. Finally, it assumes you are the only agent involved, so your new knowledge does not change how others treat you.

  ***

  ### The Diagnostic Tree

  **Instructions:** Start at Question 1. Answer honestly based on how you would actually act in the scenario. Follow the arrow for your answer. If you reach a **LEAF**, stop and read the profile. If you reach the next Question, continue.

  **Q1. The Expiring Offer**
  You are offered a free, painless aptitude test that would help you choose a career path. However, the test takes three weeks to score, and the job offer you are deciding on expires in one week. Do you take the test?
  *   **No, I wait for the test:** Go to **Q2**.
  *   **No, I decline the test:** Go to **LEAF 1**.
  *   **Yes, I take the test (and miss the job):** Go to **Q2**.

  **Q2. The Nervous Performer**
  You are about to take a penalty kick. A coach offers to show you video evidence of your past success rate. You know that seeing a low success rate will make you nervous and physically reduce your chance of scoring. Do you look at the video?
  *   **No, I prefer not to know:** Go to **LEAF 2**.
  *   **Yes, I look anyway:** Go to **Q3**.

  **Q3. The Negotiator**
  You are buying a car. The seller offers to show you a mechanic's report on the engine for free. However, the seller will also see the report. If the report is good, the seller will raise the price; if bad, they will walk away. Do you look at the report?
  *   **No, I stay ignorant:** Go to **LEAF 3**.
  *   **Yes, I look anyway:** Go to **Q4**.

  **Q4. The Sibling**
  You are considering a genetic test for a hereditary condition. The test is free and private for you, but because of shared DNA, a positive result gives your sibling a 50% probability of having the condition. Your sibling has explicitly asked you not to find out. Do you take the test?
  *   **No, I respect their wish:** Go to **LEAF 4**.
  *   **Yes, I take the test:** Go to **Q5**.

  **Q5. The Two Urns**
  There are two urns. Urn A has 50 red and 50 black balls. Urn B has 100 balls, but the ratio is unknown. You win $100 if you pick a red ball. You can draw one free ball from Urn B to see its color before choosing which urn to bet on. Does seeing the draw make you less willing to bet on Urn B than you were before?
  *   **Yes, resolving the ambiguity feels risky:** Go to **LEAF 5**.
  *   **No, information is always useful:** Go to **Q6**.

  **Q6. The Probability Check**
  (In the Urn scenario above): Do you treat the unknown ratio in Urn B as a specific probability number (e.g., "It's 50/50 on average") that you update when you see a ball?
  *   **No, I refuse to assign a number:** Go to **LEAF 6**.
  *   **Yes, I use probabilities:** Go to **Q7**.

  **Q7. The Sailboat**
  You are navigating a boat at dusk. You see a shape that looks like a sailboat, but it's foggy. You cannot write down a precise proposition like "There is a boat," only a vague impression. Do you treat this impression as evidence to update your course?
  *   **No, it's not clean data:** Go to **LEAF 7**.
  *   **Yes, I update my belief:** Go to **Q8**.

  **Q8. The Updating Rule**
  (Regarding the Sailboat): If you later learn the fog was a trick of the light, do you fully revert your belief to exactly what it was before you saw the shape?
  *   **No, I remain somewhat influenced:** Go to **LEAF 8**.
  *   **Yes, I reverse the update:** Go to **Q9**.

  **Q9. The Career Test**
  You are offered a free test that tells you if you have a rare talent for music. If positive, you know you will reorganize your life to pursue music. If negative, you know you will lose all interest in music forever. Do you take the test?
  *   **No, I don't want my values to change:** Go to **LEAF 9**.
  *   **Yes, I take the test:** Go to **Q10**.

  **Q10. The Value Stability**
  (Regarding the Career Test): If you got a negative result, would you still value music as much as you do right now, even if you don't pursue it?
  *   **No, the result changes what I value:** Go to **LEAF 9**.
  *   **Yes, my values stay stable:** Go to **Q11**.

  **Q11. The Movie Spoiler**
  You are about to watch a mystery film. A friend offers to tell you the ending for free. You know that knowing the ending will ruin the enjoyment of watching, even if it doesn't change your decision to watch. Do you listen?
  *   **No, ignorance is part of the pleasure:** Go to **LEAF 10**.
  *   **Yes, I listen:** Go to **Q12**.

  **Q12. The Plan**
  You plan to take the Movie Spoiler test tomorrow. Tonight, you are offered the chance to lock yourself out of receiving the spoiler. Do you pay to lock yourself out?
  *   **Yes, I want to force my future self to remain ignorant:** Go to **LEAF 11**.
  *   **No, I trust my future self:** Go to **LEAF 12**.

  ***

  ### The Leaves

  **LEAF 1: The Costless Assumption Dropped**
  *   **Commitment:** You believe information has a cost, even if monetary price is zero (e.g., time, opportunity cost).
  *   **Awkward Consequence:** You must calculate the "price" of every thought or glance, implying that thinking too long about a cheap item is irrational.
  *   **Exit Status:** **Genuine.** The theorem explicitly requires costless information.

  **LEAF 2: The Causal Independence Assumption Dropped**
  *   **Commitment:** You believe the act of knowing can physically change the outcome (e.g., nervousness affects performance).
  *   **Awkward Consequence:** You are rationally required to avoid self-knowledge in high-stakes performance, effectively mandating self-deception.
  *   **Exit Status:** **Genuine.** The theorem assumes evidence does not causally affect the state of the world.

  **LEAF 3: The Single-Agent Assumption Dropped (Strategic)**
  *   **Commitment:** You believe your knowledge changes how other agents treat you (signaling/legibility).
  *   **Awkward Consequence:** You are rationally required to remain ignorant to maintain bargaining power, making "bluffing" a form of information management.
  *   **Exit Status:** **Genuine.** The theorem assumes a single decision-maker with no strategic opponents.

  **LEAF 4: The Single-Agent Assumption Dropped (Externalities)**
  *   **Commitment:** You believe your knowledge affects the welfare of others who are not part of the decision.
  *   **Awkward Consequence:** You are rationally required to ignore information that helps you if it harms others, turning epistemic rationality into a moral constraint.
  *   **Exit Status:** **Genuine.** The theorem assumes no externalities.

  **LEAF 5: The Expected-Utility Assumption Dropped (Ambiguity)**
  *   **Commitment:** You dislike uncertainty about probabilities (ambiguity) more than uncertainty about outcomes (risk).
  *   **Awkward Consequence:** You can be "money-pumped" by being forced to switch bets when information resolves ambiguity, violating dynamic consistency.
  *   **Exit Status:** **Genuine.** The theorem requires standard Expected Utility maximization.

  **LEAF 6: The Expected-Utility Assumption Dropped (Probability)**
  *   **Commitment:** You refuse to assign precise probabilities to unknown events.
  *   **Awkward Consequence:** You cannot make consistent trade-offs between risks, making long-term planning mathematically incoherent.
  *   **Exit Status:** **Genuine.** The theorem requires a single prior probability distribution.

  **LEAF 7: The Conditionalization Assumption Dropped (Input)**
  *   **Commitment:** You believe evidence that cannot be written as a logical proposition cannot be processed rationally.
  *   **Awkward Consequence:** You must ignore most sensory data (smells, vague shapes, feelings) during decision-making, relying only on explicit reports.
  *   **Exit Status:** **Genuine.** The theorem requires evidence to be a proposition suitable for Bayes' rule.

  **LEAF 8: The Conditionalization Assumption Dropped (Process)**
  *   **Commitment:** You believe beliefs should not fully revert when evidence is retracted (hysteresis).
  *   **Awkward Consequence:** Your beliefs depend on the order in which you learned things, making you vulnerable to manipulation by information sequencing.
  *   **Exit Status:** **Genuine.** The theorem requires strict Bayesian updating.

  **LEAF 9: The Fixed Utilities Assumption Dropped**
  *   **Commitment:** You believe learning evidence can change your utility function (what you want), not just your beliefs.
  *   **Awkward Consequence:** You might refuse information that would help you get what you *currently* want, because it will change what you want in the future.
  *   **Exit Status:** **Genuine.** The theorem assumes utilities are fixed prior to evidence.

  **LEAF 10: The Consequentialism Assumption Dropped**
  *   **Commitment:** You value the state of "not knowing" as a consumption good, independent of the decision outcome.
  *   **Awkward Consequence:** You treat ignorance as a resource to be hoarded, which conflicts with the view that beliefs should map reality.
  *   **Exit Status:** **Fake.** This can be modeled within the theorem if "state of mind" is included as a consequence. You haven't escaped the theorem; you've just expanded the utility function.

  **LEAF 11: The Dynamic Consistency Assumption Dropped**
  *   **Commitment:** You believe your future self will make worse choices than your current self, so you restrict their access to information.
  *   **Awkward Consequence:** You view your own future rationality as an enemy, requiring pre-commitment devices to stop yourself from learning.
  *   **Exit Status:** **Genuine.** The theorem assumes you maximize utility consistently over time.

  **LEAF 12: The Theorem Holds**
  *   **Commitment:** You accept all assumptions: costless, causal independence, single-agent, EU maximization, conditionalization, fixed utilities, consequentialism, dynamic consistency.
  *   **Awkward Consequence:** You must accept that there is no scenario where free, immediate, private information is harmful to your decision quality.
  *   **Exit Status:** **N/A.** You are the target agent of the theorem.

  ***

  ### Map of the Logical Space

  **Available Combinations**
  Most leaves represent genuine, coherent philosophical positions. You can consistently drop "Conditionalization" while keeping "Fixed Utilities," or drop "Single-Agent" while keeping "Expected-Utility." The space is largely populated by viable alternative decision theories (e.g., ambiguity aversion, causal decision theory, evidential decision theory).

  **Empty Cells**
  There is one theoretically empty cell: **Dropping Conditionalization while maintaining Dynamic Consistency.** If you do not update by conditionalization, you generally become dynamically inconsistent (your future self disagrees with your current plan). This cell is empty because it is mathematically incoherent; you cannot have non-Bayesian updating without inviting time-inconsistency unless you adopt a very specific, non-standard updating rule.

  **Indistinguishable Leaves**
  The instrument cannot reliably separate **LEAF 5 (Ambiguity/EU Violation)** from **LEAF 8 (Conditionalization Violation)**.
  *   **Why:** From the outside, an agent who refuses to resolve ambiguity (Leaf 5) looks identical to an agent who updates their beliefs conservatively or incorrectly (Leaf 8). Both will reject free information that a standard Bayesian EU maximizer would accept.
  *   **How to Split:** To distinguish them, you must ask a question about **known risks**. Present the agent with a *known* 50/50 coin flip.
      *   If they still reject information about the *outcome* of the flip before betting, they are violating **Conditionalization** (they aren't processing the data).
      *   If they accept information about the known coin but reject information about the *unknown* urn, they are violating **Expected-Utility** (they are ambiguity averse).
      *   *Note:* This requires a controlled experiment, not a self-report scenario, which is why the handout cannot separate them.
