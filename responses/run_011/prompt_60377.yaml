  **MEMORANDUM**

  **TO:** Conditional Markets Board
  **FROM:** Clerk's Office
  **SUBJECT:** Briefing on Docket Item 2025-A (Pediatric Asthma Market)
  **DATE:** October 24, 2025

  ### (a) Candidate Rules Consistent with the Record

  Based on the seven precedents, two procedural rules emerge that reproduce the recorded vote on all items. Both treat the Council's adoption of an end as a necessary precondition (ruling out Items 5 and 6), but they diverge on how they assess measurement integrity.

  **Rule 1: The Structural Independence Standard**
  *Procedure:* Approve a market if and only if (1) the Council has adopted a specific end, AND (2) the entity responsible for generating the raw data underlying the resolution metric has no budgetary or operational stake in the policy options.
  *Consistency:*
  *   **Approvals (1, 3, 4, 7):** In all cases, data generators (Regional Transit Authority, State Transport, County Assessor, State Comptroller, County ED) were operationally distinct from the policy options. Item 4 passed because the *data* (payroll/response time) came from the State, not the city employees trading.
  *   **Rejections (2, 5, 6):** Item 6 and 5 failed condition (1) (No end). Item 2 failed condition (2): The Housing Outreach Division generated the street count data and its budget was at stake.
  *   **Workhorse Precedent:** **Item 2 (2020 Shelter).** This is the critical case. A market can have an adopted end (unlike 5 and 6) and still be rejected if the measurer is financially implicated. This rule treats Item 4 (4-Day Week) as safe because the State Comptroller, not the city staff, generated the metric.

  **Rule 2: The Mitigable Conflict Standard**
  *Procedure:* Approve a market if and only if (1) the Council has adopted a specific end, AND (2) any party capable of manipulating the resolution data is either excluded from trading or subject to an external audit of their data generation.
  *Consistency:*
  *   **Approvals (1, 3, 4, 7):** Item 4 is the key here. It passed *only* because a trading exclusion was applied to those with insider access (employees/supervisors). This establishes that conflicts are not fatal if mitigated. Items 1, 3, and 7 had no conflicts to mitigate.
  *   **Rejections (2, 5, 6):** Item 6 and 5 failed condition (1). Item 2 failed condition (2): The Housing Outreach Division could manipulate the count and was not excluded from trading (as it was a city division implementing the policy) nor audited by a third party regarding the count's integrity. Item 5 failed because the City Manager retained the scorer (no external audit independence).
  *   **Workhorse Precedent:** **Item 4 (2021 Four-Day Week).** This is the critical case. It establishes that insider access to data or policy implementation does not automatically ban a market, provided trading restrictions are applied.

  **Confidence:** High. Both rules account for the vote tallies and the specific minutes recorded (e.g., Item 2's "metric would resolve; question would not" aligns with Rule 1's focus on data generation stakes; Item 4's conditional approval aligns with Rule 2's mitigation focus).

  ### (b) Application to the Asthma Market

  **Prediction under Rule 1 (Structural Independence):** **Reject.**
  *   *Strain:* The rule distinguishes between *compiling* a metric and *producing* the data. The County Health Department compiles the count, but Meridian Health *produces* the underlying data by setting admission thresholds and coding practices. Under Rule 1, Meridian is the data generator. Since Meridian is also a policy option (Option B), they have an operational stake. The fact that the County cannot revise figures retroactively does not cure the fact that Meridian controls the input flow.
  *   *Key Distinction:* This rule treats "who compiles" and "who produces" as **two different conditions**. Item 2 supports this: Housing Outreach compiled *and* produced the count. Here, they are split, but the producer has the stake.

  **Prediction under Rule 2 (Mitigable Conflict):** **Approve (with conditions).**
  *   *Strain:* Meridian controls the data generation (admission thresholds). However, they have offered a trading ban and an external audit. Rule 2 views these as sufficient mitigations, analogous to the trading ban in Item 4.
  *   *Key Distinction:* This rule treats the audit and ban as curing the conflict. The strain lies in whether an audit of "coding practices" is equivalent to the State Comptroller's audit in Item 4. In Item 4, the State *generated* the index. Here, the State *audits* Meridian's generation.

  **Confidence:** Medium. The application hinges on whether the Board views "data generation" (Rule 1) as distinct from "metric compilation." The text of Item 2 suggests the Board cares about who holds the pen on the count, which favors Rule 1's stricter reading.

  ### (c) Verdict Prediction and Recommendation

  **Predicted Verdict:** **Rejection.**
  **Margin:** **5–2 or 6–1.**
  **Majority Argument:** "Item 5 established that the resolution of the contract and the conduct of the office cannot sit in the same hands. Here, Meridian conducts the care (setting admission thresholds) and effectively resolves the contract (their records generate the count). An audit is post-hoc; it cannot prevent the strategic coding of admissions in real-time. Unlike Item 4, where we banned insiders from trading, we cannot ban Meridian from being Meridian. They are the service provider. To approve this is to allow a bidder to write the scorecard."

  **Recommendation (Fidelity to Record):** **Reject.**
  **Closest Analog:** **Item 5 (2022 City Manager Salary).**
  *   **Where Analogy Holds:** In Item 5, the City Manager (subject) paid the consultancy (scorer). In the Asthma case, Meridian (subject) generates the data (scorer). The minute in Item 5 ("Resolution of contract and conduct of office sit in the same hands") applies precisely: Meridian's clinical decisions resolve the market outcome.
  *   **Where Analogy Breaks:** In Item 5, no end was adopted (a fatal flaw not present here). Also, Item 5 involved a direct payment for the scoring service; here, the scoring is a byproduct of care records. However, the control over *coding practices* is functionally equivalent to scoping the consultancy.
  *   **Secondary Analog:** **Item 2 (2020 Shelter).** The Housing Outreach Division's budget depended on the count they produced. Meridian's revenue/reputation depends on the count they produce. The minute "the metric would resolve; the question would not" warns that if the provider controls the metric, the market prices the provider's accounting, not the policy's efficacy.

  **Confidence:** High on the recommendation (Item 5's principle is robust); Medium on the margin (the trading ban offer might peel off one vote from the rejection bloc).

  ### (d) Record Nuances: Tallies and Bans

  **1. The 2021 Trading Exclusion (Item 4):**
  The 4–3 vote on the four-day week indicates that "insider access" is a swing issue. The market was approved *only* because the Clerk's office likely proposed the exclusion condition during deliberation. This suggests the Board is willing to engineer solutions to save a market, but the narrow margin warns that without such conditions, similar items fail. In the Asthma case, Meridian has *offered* a ban. This mirrors Item 4's solution, but Item 4's ban was on *trading*, whereas the Asthma risk is *data manipulation*. A trading ban does not stop Meridian from coding an admission as "non-asthma" to improve their market position (if they could trade) or to secure future contracts (if they can't). The nuance here is that Item 4's condition solved the *incentive* to trade, not the *ability* to manipulate data.

  **2. Unanimity vs. Split Rejections (Items 2, 5, 6):**
  Item 5 (Salary) was rejected 7–0, while Items 2 (Shelter) and 6 (Plaza) were 6–1 and 5–2.
  *   **Significance:** Item 5 violated two bright lines: No End Adopted *and* Self-Scoring. The unanimity suggests that when the *charter requirements* (Ends) are ignored, the Board closes ranks. Items 2 and 6 had Ends (Item 6 did not, but the debate was on "pricing a name" vs. social value), making them debatable policy judgments.
  *   **Relevance to Asthma:** The Asthma item *has* an adopted end. Therefore, a unanimous rejection is unlikely. The vote will likely split along the lines of Item 2 (6–1), where the structural conflict is clear but the policy goal is valid. The unanimity of Item 5 warns us that if we approve Asthma, we are weakening the "Self-Scoring" bright line, potentially inviting future challenges on Council authority.

  **Confidence:** High. The distinction between charter violations (unanimous) and metric conflicts (split) is clear in the minutes.

  ### (e) Underdetermination and Principles

  The record underdetermines the Asthma case on two fronts: the **Data Generator vs. Compiler** distinction and the **Time Horizon**.

  **1. The Measurement Principle:**
  *   **If Approved:** The Board adopts the principle that **audits mitigate structural conflicts.** It commits the Board to allowing vertical integration of service and measurement, provided a third party checks the work later. Next time a provider is the data source, the Board must approve them if they offer an audit.
  *   **If Rejected:** The Board adopts the principle that **measurement must be structurally independent.** It commits the Board to requiring that the entity generating the raw data (not just compiling it) be distinct from the policy options. This raises the bar for future markets in health, education, or social services where providers naturally generate the outcome data.

  **2. The Horizon Principle:**
  *   **Context:** All prior approved markets resolved within the sitting Council's term (12–24 months). This item is 5 years.
  *   **If Approved:** The Board commits to the principle that **markets can bind future Councils.** This alters the futarchic charter from a tool for current Council decision-making to a tool for long-term statutory commitment.
  *   **If Rejected:** The Board reinforces the principle that **markets must be accountable to the enacting Council.** This preserves the Council's ability to repeal ends if political mandates change, preventing "dead hand" control via long-duration markets.

  **Least Sure Point:** I am least sure about the **Time Horizon**. There is *no* precedent for a 5-year market. Item 2's minute ("the question would not [resolve]") referred to metric validity, not time. However, the charter implies the Council adopts the ends; if the Council turns over, does the end survive? If the Board approves, they are making a constitutional judgment on Council succession that the record does not support. **What would change my mind:** If the Clerk's office found a memo indicating the Council's charter explicitly allows ends to persist across terms. Without that, the horizon is a hidden veto point.

  **Confidence:** Low on Horizon implications (speculative); Medium on Measurement Principle (inferred from Item 2 and 5).

  ### (f) Discriminating Future Docket Item

  To discriminate between Rule 1 (Structural Independence of Data Generator) and Rule 2 (Mitigable Conflict via Audit/Ban), the Board needs a case where the Compiler is Neutral, but the Data Generator is a Trader offering mitigation.

  **Proposed Docket Item:**
  *   **Question:** Whether to outsource the city's waste collection to **GreenWaste Corp**.
  *   **Options:** (a) City Public Works Department, (b) GreenWaste Corp contract.
  *   **Adopted End:** Tonnage of material recycled per household.
  *   **Resolution Metric:** Annual recycling tonnage per address.
  *   **Who Compiles:** State Department of Environmental Protection (Neutral, no stake).
  *   **Who Produces Data:** GreenWaste's trucks are equipped with proprietary sensors that weigh and classify waste before dumping; these logs are submitted to the State.
  *   **Horizon:** 24 months.
  *   **Who May Trade:** GreenWaste offers a trading ban on itself and affiliates, and will fund a State audit of its sensor calibration.

  **Predictions:**
  *   **Rule 1 (Structural Independence):** **Reject.** GreenWaste produces the raw data (sensor logs) and is a policy option. The State compiles the metric, but the input is controlled by the trader. The stake in the data generation violates structural independence (analogous to Item 2).
  *   **Rule 2 (Mitigable Conflict):** **Approve.** The State compiles the metric (Neutral). The conflict (GreenWaste sensors) is mitigated by the trading ban and the external audit of calibration (analogous to Item 4's trading ban and Item 7's audits).

  **Confidence:** High. This case isolates the "Compiler vs. Producer" tension identified in the Asthma brief.
