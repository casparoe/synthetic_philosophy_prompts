prompt: |-
  I'm prepping a seminar paper on whether rational choice really requires a complete preference ordering, and I need a clean Buridan case to argue with — one where the symmetry doesn't get quietly broken somewhere along the way. Specs: one paragraph, ordinary life (no coins, no sci-fi, no exotic payoffs), but with real stakes so that "just shrug and pick one" isn't obviously fine. The agent's ordering has to be complete and transitive with the two options genuinely tied — not incomparable, not some fourth relation like parity, just flat-out equal — and no further evidence he could get would break the tie. He still ends up acting, and acting defensibly.

  Then walk me through what three replies say about the case: deliberate randomization, a Frankfurt-style second-order endorsement of whichever desire happens to surface, and the voluntarist line that you can simply choose with no preference behind it at all. Tell me which the case supports and which it kills, and be explicit about which feature is doing the work — my suspicion is that any randomizing device smuggles in an intention to go along with its output, so the tie gets dissolved rather than broken. Say whether that's right. Finish with what changes if I let the agent learn one new fact, and how someone who denies that indifference is even possible would attack the case.
