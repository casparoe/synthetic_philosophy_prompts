answer: |-
  Your read from the truck is sharper than most grad seminars I've sat through. You've correctly identified that the 2010 dust-up was largely a fight over explanatory bookkeeping rather than observable reality, but you're giving the combatants a bit too much credit on the "no empirical difference" front. There *was* a substantive claim made that turned out to be empirically false, even if the mathematical frameworks are interchangeable.

  Here is the breakdown using the machinery you asked for, followed by a verdict on your theory.

  ### 1. The Machinery: Williams, Dawkins, and the Price Equation

  To map this, we need three tools.

  **George Williams (1966) & Parsimony:**
  Williams argued that group selection is a hypothesis of last resort. If a trait (like worker sterility) lowers individual fitness but raises group fitness, you must prove that individual-level selection *cannot* explain it before invoking group selection. Usually, "individual selection" here actually means "gene selection." Williams set the burden of proof high: group selection requires low migration, high variance between groups, and rapid group extinction. For decades, this made group selection toxic. If you proposed it, you were assumed to be mathematically illiterate.

  **Dawkins (Replicator vs. Vehicle):**
  This distinguishes *who* is copied (replicator: the gene) from *what* does the surviving (vehicle: the body, or the colony). Inclusive Fitness Theory (IFT) is firmly replicator-centric. It asks: "How does a gene for sterility get copied if the body holding it doesn't reproduce?" Answer: By helping copies of itself in the queen.
  Multilevel Selection (MLS) is vehicle-centric. It asks: "Do colonies with sterile workers out-compete colonies without them?"
  If you treat the colony as a "super-organism" (vehicle), MLS feels natural. If you treat the colony as a bag of competing genes, IFT feels natural.

  **The Price Equation (The Rosetta Stone):**
  This is the math that should have ended the fight. The Price Equation partitions evolutionary change into two terms:
  1.  **Covariance between trait and fitness within groups** (Individual selection).
  2.  **Covariance between group mean trait and group fitness** (Group selection).

  Mathematically, the Price Equation is an identity. It is always true. You can algebraically rearrange the terms of the Price Equation to look exactly like Hamilton's Rule ($rB > C$). This means **IFT and MLS are mathematically isomorphic.** They are the same equation wearing different hats. You can translate any IFT model into an MLS model and vice versa without losing information.

  ### 2. Mapping the 2010 Claims: Substantive vs. Notational

  Nowak, Tarnita, and Wilson (NTW) made two types of claims. One was notational; one was substantive.

  **The Notational Claim (The "Framework" Fight):**
  NTW argued that IFT is a "special case" of standard natural selection and is too restrictive. They argued that MLS (which they framed as standard natural selection on structured populations) is the general theory.
  *   **Verdict:** This is the "philosophy wearing a biology costume" part you identified. Since the Price Equation shows they are translatable, claiming one is "general" and the other "special" is mostly about which variables you choose to hold constant. The 137 signatories were right to call this out: IFT is not mathematically limited in the way NTW claimed. Modern IFT handles strong selection and complex demographics just fine.
  *   **Why it matters:** It's about *causation visibility*. IFT forces you to measure relatedness ($r$). MLS forces you to measure group variance. If you care about *why* the ants are cooperating (genetics), IFT makes the cause visible. If you care about *ecological success* (colony output), MLS makes the cause visible.

  **The Substantive Claim (The "Biology" Fight):**
  NTW didn't just argue math; they argued biology. They claimed that high relatedness is not a prerequisite for eusociality. They proposed a "stepwise" ecological model: first build a nest, then defend it, then divide labor. Relatedness, they argued, is a consequence, not a cause.
  *   **Verdict:** This was empirically testable, and the data hammered it.
  *   **The Experiment:** Phylogenetic reconstruction of eusocial lineages (ants, bees, wasps, termites).
  *   **The Result:** Almost every origin of eusociality is preceded by a bottleneck of **lifetime monogamy**. If a queen mates with one male for life, siblings are related by $r=0.5$ (same as parent-offspring). If she mates with multiple males, relatedness drops. The data shows eusociality essentially *only* evolves in lineages where ancestral states were monogamous.
  *   **Implication:** This supports the IFT prediction that high $r$ is the enabling condition. NTW's biological hypothesis was wrong, even if their mathematical preference for MLS was permissible.

  ### 3. Attacking Your Theory

  **Your Theory:** *The fight was about who gets counted and who does the driving. If formalisms spit out the same numbers, it's a philosophy-of-explanation question. No amount of ant data could settle it.*

  **Where you are right:**
  You are correct that the *mathematical framework* debate is undecidable by data because the models are isomorphic. If I write a model in IFT and you write the same model in MLS, we predict the same ant behavior. Choosing between them is a pragmatic choice about which parameters are easier to measure or which story is more intuitive. In that sense, it is philosophy. The 137 signatures were defending a heuristic tool (IFT) that they felt was being unfairly discarded for a synonym (MLS).

  **Where you are naive:**
  You claimed "no amount of ant data could settle it." That's wrong because NTW didn't just propose a new math; they proposed a new *mechanism*.
  *   **IFT Mechanism:** Genes for sterility spread because they help copies of themselves in relatives. (Driver: Relatedness).
  *   **NTW Mechanism:** Colonies with division of labor out-reproduce others regardless of relatedness. (Driver: Ecological efficiency).

  These *do* make different predictions about the history of the lineage. If NTW were right, we should see eusociality popping up in lineages with low relatedness (polyandrous queens) whenever ecological conditions were right. We don't. We see it constrained tightly by high relatedness.
  So, data *did* settle the biological hypothesis, even if it couldn't settle the mathematical framework. The "cause" isn't just in the eye of the beholder; the parameter $r$ turned out to be the switch that actually gets flipped in nature.

  **Implication for Levels-of-Selection:**
  Your insight implies that the "Levels of Selection" debate is often a category error. We treat "Gene," "Individual," and "Group" as competing causes, like three people fighting over who pushed a car. But if the car is a system, the push is distributed.
  *   **Implication:** We should stop asking "Which level is *really* selected?" and start asking "At which level does the variation in fitness correlate most strongly with the trait?"
  *   Sometimes it's the gene (meiotic drive).
  *   Sometimes it's the individual (sexual selection).
  *   Sometimes it's the group (eusociality).
  The "fight" persists because biologists confuse *modeling convenience* with *ontological truth*. They want to say "Selection *really* acts on genes," but that's a metaphysical stance, not a biological finding.

  ### 4. Why the Fight Never Ends (Theory Diagnosis)

  You asked if the theory's framing predicts endless fights. **Yes.**

  Evolutionary theory is a historical science trying to use universal laws. The "Levels of Selection" problem is structurally identical to the "Nature vs. Nurture" debate.
  *   **Nature vs. Nurture:** You can't partition a specific trait into % gene and % environment in a single individual. It's an interaction. But we keep fighting because we want to assign *credit*.
  *   **Levels of Selection:** You can't partition selection into % gene and % group in a single evolutionary event without making arbitrary modeling choices (like how you define a "group boundary").

  The debate generates mass-signed letters because it touches on **reductionism**.
  *   **Side A (IFT/Selfish Gene):** Believes explanation must bottom out at the lowest replicator. Anything else is mysticism.
  *   **Side B (MLS/Systems):** Believes higher-level patterns are emergent and cannot be reduced without losing the phenomenon.

  This is not a biological question; it is a worldview. As long as biology attracts both reductionists and holists, this fight will recur every 20 years with new names. Wilson burning down his own house wasn't an outlier; it was the inevitable result of a famous figure switching tribes. He moved from the Reductionist camp (1970s) to the Holist camp (2010s). The field attacked him not because he was wrong about everything, but because he attacked the dominant heuristic (IFT) that had generated 40 years of successful research, replacing it with a mathematically equivalent one that hadn't yet proven its worth.

  ### Summary Verdict

  1.  **Math:** You are right. IFT and MLS are translatable. The fight over which is "correct" math is nonsense.
  2.  **Biology:** You are wrong. NTW made specific biological claims (relatedness doesn't matter) that were falsified by phylogenetic data.
  3.  **Causation:** You are right. "Who does the driving" is a modeling choice. But in the case of ants, the "Relatedness" driver is the one that matches the historical data.
  4.  **Future:** The debate will never die because it is a proxy war between Reductionism and Emergence.

  You don't need a reading list. You just need to know that when biologists argue about levels, check if they are arguing about **math** (usually a draw), **mechanism** (testable), or **philosophy** (never ends). In 2010, it was all three, which is why it got so messy.
