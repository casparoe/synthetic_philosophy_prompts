  ### The Grandchildren Problem

  The math compounds the hidden seed,
  And technique serves the pressing need.
  In hundred years the burden lifts,
  And labor shrinks to idle shifts.

  Not the outcome, but the feeling itself
  love, beauty, a moment of apprehension
  without a rule to justify it
  just the state of mind, enough.

  Some needs are absolute and cease,
  But relative ones grant no release.
  For if the neighbor gains a height,
  We require still a greater light.

  We refused the general rule
  saying the consequence was not the thing
  only the immediate appreciation mattered
  and we had no map for what comes after.

  We trained the heart to strive ahead,
  To push the living to the dead.
  But when the struggle falls away,
  The purpose rots in broad daylight.

  It was a thin philosophy
  good for the moment, for the circle of friends
  but when the world demanded duty
  we had nothing to hold onto.

  We have the hours but not the use
  Counting ends, and now we face the day
  The purposive habit holds us tight but there is no
  reason left.

