  ### Prose Note on Liberties and Confidence

  **Liberties and Contested Readings**
  The primary liberty taken here is treating the 1938 Memoir Club paper ("My Early Beliefs") as a direct counterweight to the 1930 essay ("Economic Possibilities for our Grandchildren"). While both texts are Keynes's, scholars disagree on whether the later memoir undercuts the earlier optimism or simply addresses a different domain (ethics vs. economics). I have leaned into the reading that the Memoir admits a failure of the Bloomsbury ethic to handle "obligation" and "the future," which parallels the 1930 essay's worry that we won't know how to handle the future once scarcity ends. This creates the internal tension you requested, though some biographers argue Keynes remained more consistent across both texts than this poem suggests.

  **Confidence in Attributions**
  *   **1930 Voice (Stanzas 1, 3, 5):** High confidence. The claims about compound growth, the distinction between absolute/relative needs, and the psychological danger of "purposiveness" are all explicitly central to the 1930 essay. The strict iambic tetrameter is intended to mimic the mechanical certainty Keynes attributes to the economic arithmetic.
  *   **1938 Voice (Stanzas 2, 4, 6):** Moderate-High confidence. The emphasis on "states of mind" and the rejection of "general rules" is definitively Moorean Keynes. The admission of "thinness" regarding duty is a core theme of his 1938 reflection. The free verse is intended to mimic the fluid, immediate nature of the aesthetic ethic he describes.
  *   **Stanza 7 (Collapse):** This is a formal construct to meet your constraint, not a textual claim.

  **Least Sure Point**
  I am least sure about the specific phrasing of the "admission of thinness" in Stanza 6. While Keynes definitely critiques his early group for being unprepared for the real world's demands (war, obligation), whether he explicitly frames it as having "nothing to hold onto" regarding *duty* specifically is a reconstruction from memory of the text's tone rather than a direct paraphrase of a single sentence. To settle this, one would need to check the specific typescript of the 1938 Memoir Club reading against the post-war published version of "My Early Beliefs," as edits may have sharpened or softened that self-critique. I am reconstructing the sentiment from memory rather than checking the page numbers, so treat the specific wording of the ethical admission as interpretive.
