      *   **Role:** Senior philosopher specializing in ethics of reproduction and philosophy of clinical practice.
      *   **Task:** Conceptual reconstruction of a described practice (prenatal screening + nondirective counseling + directional program metrics + commercial selection trends).
      *   **Tone:** Serious, analytical, American English, no bibliography/citations/quotes.
      *   **Structure:**
          1.  Brainstorming section (candidate theories of value, obligation, institutional agency; include one unpromising but plausible theory).
          2.  Full analysis under four headings: (a) Theory of Value, (b) Internal Consistency, (c) Underdetermination & Discriminating Features, (d) Counterfactual Changes (Welfarist vs. Least Pressured).
      *   **Constraints:** No citations, no invented quotes, define terms of art, accessible to careful non-specialists.

  2.  **Deconstruct the Practice:**
      *   *Micro-level (Clinician-Patient):* Nondirective counseling. Options presented equally. Clinician values bracketed. Justification: Patient autonomy/values.
      *   *Macro-level (Program/System):* Directional metrics (detection rates). Higher detection = better program. Funding/audit tied to this.
      *   *Commercial/Social Context:* Gamete selection for traits (height, IQ proxies). Selection *for* disability seen as misuse. Selection *against* disease seen as legitimate.
      *   *Tension:* Micro says "no right answer," Macro says "finding the condition is the goal," Market says "some traits are better than others."

  3.  **Brainstorming (Pre-Analysis):**
      *   *Theories of Value:*
          *   Subjectivism/Relativism (Value is purely individual).
          *   Objective List Theory (Some lives are objectively better, but clinicians shouldn't impose).
          *   Welfarism/Consequentialism (Maximize well-being, minimize suffering).
          *   Deontology/Kantian (Respect for autonomy as an end in itself).
          *   Expressivism (The act expresses a view about disability).
      *   *Theories of Obligation:*
          *   Procreative Beneficence (Select the best child).
          *   Reproductive Liberty (Right to decide without interference).
          *   Fiduciary Duty (Clinician serves patient's defined interests).
          *   Public Health Obligation (Reduce burden on society/healthcare).
      *   *Theories of Institutional Agency:*
          *   Institution as neutral platform.
          *   Institution as moral agent with distinct goals from individuals.
          *   Institution as risk manager.
      *   *Unpromising but Plausible Theory:* Paternalism disguised as autonomy (The system wants termination, but knows coercion backfires, so uses "choice" to achieve the same end). Or perhaps a "Clean Hands" theory (Clinicians keep hands clean, system gets dirty). Let's go with a "Systemic Paternalism" view: The nondirectiveness is a tool to increase compliance with the directional metric.

  4.  **Drafting the Analysis - Section by Section:**

      *   **Brainstorming Section:** Need to list candidate theories clearly.
          *   Value: Subjective vs. Objective vs. Procedural.
          *   Obligation: Autonomy-based vs. Consequentialist vs. Legalistic.
          *   Agency: Unified vs. Divided.
