      *   **(a) Theory of Value:**
          *   Distinguish the three claims: (1) No fact of the matter (Metaphysical/Value Pluralism), (2) Fact exists but clinicians ignorant (Epistemic Humility), (3) Procedural Right (Deontological).
          *   Analysis: Training usually commits to (2) and (3) mixed. It rarely commits to (1) because medicine presupposes health is good. Does it work under all three? (1) is too strong for medicine (implies disability isn't worse). (2) is stable. (3) is stable but clashes with metrics.
          *   Conclusion: The practice relies on Epistemic Humility + Procedural Right, but tacitly assumes Health is Good (Objective Value) for the metrics to make sense.

      *   **(b) Internal Consistency:**
          *   The Tension: Nondirective talk vs. Directional metrics.
          *   Is it consistent? Only if we distinguish *public health goals* from *individual care goals*.
          *   Covert Beneficence? Yes, likely. The metric tracks "prevention of condition" (often euphemism for termination).
          *   Whose interests? Society (cost), Parents (burden), Future Child (non-identity problem makes this tricky). The metric tracks *condition incidence*, not necessarily individual welfare directly, but assumes condition = welfare loss.
          *   Verdict: It is inconsistent unless viewed as a "Division of Moral Labor." But even then, it smells of Procreative Beneficence smuggled in.

      *   **(c) Underdetermination:**
          *   What fits multiple theories? The script itself (could be respect, could be legal defense).
          *   Rival Accounts:
              1.  Disability Rights (Expressivist objection: screening says disabled lives aren't worth living).
              2.  Welfarist (Reduce suffering).
              3.  Kantian (Autonomy).
              4.  Defensive/Legal (Liability avoidance).
          *   Discriminating Features:
              *   *Scripts:* Do they mention support resources equally with termination? (Disability rights vs. Welfarist).
              *   *Statistics:* Do they track "continuation rates"? (Welfarist/Public Health vs. Autonomy).
              *   *Clinician Talk:* Do they express relief when patients terminate? (Welfarist). Do they express frustration when patients continue? (Welfarist vs. Kantian).
