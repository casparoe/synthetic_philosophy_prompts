      *   **(d) Counterfactual Changes:**
          *   *Scenario 1: Explicit Welfarism.*
              *   Script: "Statistically, this condition involves significant suffering. Most parents choose termination."
              *   Stats: Termination rates, QALYs saved.
              *   Give up: Neutrality, claim of pure autonomy.
          *   *Scenario 2: Least Pressured Decision (Pure Autonomy/Process).*
              *   Script: "We offer this to ensure you aren't surprised. Detection rate is irrelevant to your choice."
              *   Stats: Patient satisfaction, understanding, feeling of pressure.
              *   Give up: Public health justification, detection rate targets, likely funding models.

  5.  **Refining and Polishing:**
