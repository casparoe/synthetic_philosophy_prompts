answer: |-
  This is a precise and unsettling observation. You are describing a specific failure mode of cultural transmission where the copy does not merely degrade the original, but *replaces* it, and then *instructs* the creator.

  Here are the nearest established concepts, the boundary where this phenomenon stops, and three candidate names for the loop itself.

  ### Nearest Established Concepts

  **1. The Precession of Simulacra (Jean Baudrillard)**
  *   **The Concept:** Baudrillard argued that in postmodern culture, the representation (the map) eventually becomes more real than the reality it represents (the territory). The "simulacrum" precedes the real.
  *   **The Separation:** Baudrillard is describing an ontological shift (what is *real*?), whereas you are describing a mechanical and textual one (what is *written*?). Simulacra suggests the original never existed or doesn't matter; your experience is that the original *did* exist, was superior, and was actively executed by a superior variant. You are watching the map eat the territory, but you are also holding the pen that draws the map.

  **2. Goodhart's Law (Charles Goodhart)**
  *   **The Concept:** "When a measure becomes a target, it ceases to be a good measure." Originally economic, it applies when people optimize for a metric (e.g., test scores) rather than the underlying value (e.g., education).
  *   **The Separation:** This captures your third phase (writing for the quote), but it misses the first two. Goodhart's Law assumes a static metric imposed from above. In your case, the metric (the mutant sentence) is generated *from* the work, circulates, and then returns to impose itself. It is a dynamic, recursive target, not a static one.

  ### The Boundary Case

  **Textual Corruption (Bibliography)**
  In textual scholarship, "corruption" occurs when scribes or printers introduce errors into a manuscript (e.g., the Quartos vs. the Folio in Shakespeare).
  *   **Why it looks like yours:** The text changes through circulation; variants emerge; the "wrong" version spreads.
  *   **Why it isn't yours:** The goal of bibliography is *restoration*. Scholars use the variants to reconstruct the author's original intent. In your phenomenon, the institution (publisher, editor, translator) accepts the corruption as the *correct* version. The boundary is crossed when the editor suggests "restoring" the line readers remember. That is the moment **Textual Corruption** becomes **Recursive Drift**.

  ### Candidate Names

  Here are three terms coined for this specific loop (Spread $\rightarrow$ Return $\rightarrow$ Adaptation), ranked by utility.

  **1. Recursive Drift**
  *   **Definition:** The process by which a simplified, high-circulation variant of a text re-enters the official source material and subsequently influences the author's future composition toward further simplification.
  *   **Tradeoffs:** "Drift" is a standard linguistic term (semantic drift), and "Recursive" implies the output feeding the input. It is clean and academic. However, it is slightly dry; it describes the mechanism but misses the emotional violence of the author surrendering to the mutant.
  *   **Usage:** *"The tenth-anniversary edition is a clear case of recursive drift; the blurb has rewritten the chapter."*

  **2. Proleptic Contamination**
  *   **Definition:** The degradation of an original text caused by the author anticipating its future mutation, composing work specifically to survive the circulation process rather than to serve the narrative.
  *   **Tradeoffs:** "Proleptic" (anticipating the future) captures your anxiety about drafting. "Contamination" captures the feeling of impurity. It is emotionally accurate but sounds more like a diagnosis than a phenomenon. It focuses heavily on the *author's* change rather than the *text's* return.
  *   **Usage:** *"I can feel the proleptic contamination in my second act; I'm writing lines that want to be tweets."*

  **3. The Osmotic Canon**
  *   **Definition:** A state of textual instability where the boundary between the official work and its public paraphrase dissolves, allowing the more durable variant to permeate the source.
  *   **Tradeoffs:** "Osmotic" suggests a natural, passive movement through a membrane, which fits the "gentle" way your editor suggested the change. "Canon" implies authority. It sounds literary and soft, but might obscure the active "rewriting" aspect. It implies the text is alive, which is comforting, but you are describing a loss of control.
  *   **Usage:** *"We are no longer editing the book; we are managing the osmotic canon."*

  ### The Bet

  I would bet on **Recursive Drift**.

  It is the only term tight enough to survive an essay without sounding like you invented it five minutes ago. It borrows credibility from "semantic drift" and "recursive functions," making it sound like a structural inevitability rather than a personal grievance. It allows you to describe the *system* (the loop) without getting bogged down in the *symptom* (the bad prose).

  **Definition for your essay:**
  > **Recursive Drift:** *A cycle of textual transmission in which a mutated, high-circulation variant of a passage re-enters the official record (via blurbs, translations, or new editions), eventually supplanting the original text and conditioning the author to compose future work optimized for mutation rather than context.*

  ### One Last Boundary Case (To Watch For)

  **The Mandela Effect**
  This looks like your phenomenon because the public memory contradicts the physical record. But in the Mandela Effect, the physical record *stays put* (Nelson Mandela died in prison, not the 80s). In **Recursive Drift**, the physical record *changes* to match the memory. If your publisher prints the mutant line in the next edition, it is no longer a memory error; it is **Recursive Drift**.
