prompt: |-
  Three years ago I retired from a comparative physiology lab — forty years of work on how fish kidneys handle salt, which is not a sentence that gets you invited to parties — and to keep my head from going soft I've started reading philosophy, pretty much at random. It turns out I also can't leave biology committees alone, so I'm now the "retired member" of the curation policy committee for a database consortium that annotates gene function in a group of fungi (fermentation strains plus their wild relatives). Eleven of us, mostly by video call, and we vote next Thursday on a case that has been eating the committee alive for two months. My daughter says this is a midlife crisis arriving about fifteen years late.

  Here's the case. A grad student characterized a paralog — call it locus 2714 — and in a clean in-vitro assay it turns over a substrate we'll call S about as fast as anything else in that family. In the living organism, though, S basically isn't there: it doesn't occur in the tissues where 2714 is expressed, and knockouts show no growth difference under anything anyone has managed to grow. What 2714 does measurably do in vivo is bind a divalent metal and buffer it, and that buffering makes a real difference to the cell's metal-handling capacity. The phylogenetics says the ancestral copy was doing the S reaction in relatives that still have the substrate, and that this lineage lost the substrate afterwards. So: annotate the S activity, annotate the metal buffering, annotate both, annotate neither? Half the commitee says a database describes mechanisms and not history, and anyway we have no evidence code for "was selected for," so the S activity has to go. The other half says if we start annotating whatever a protein happens to do inside a cell we'll drown in hundreds of incidental activities, and that the S chemistry is what makes 2714 a member of that family in the first place. There's a related headache: some wild isolates carry a 2714 with the catalytic site wrecked and the metal buffering intact, and one curator wants to flag those as loss-of-function, which only makes sense under one of the two readings. And a partner database on the other side of the Atlantic follows the opposite convention, while our interoperability agreement says our annotations should translate into theirs without loss — which may just not be possible here.

  I've been reading about how philosophers split "function" into the historical kind — what a trait was selected for — and the current-contribution kind — what it actually does now as part of a system's capacities — and it looks to me like our fight is that same fight wearing a lab coat, except nobody on the committee has heard of it and I'd rather not lecture them. So: draft the decision memo I'll circulate before Thursday. Give me a bottom line — a rule the committee can adopt, plus the specific ruling on 2714 and on those wrecked-catalytic-site isolates — and then the criteria a curator at the bench could actually apply to the next case without ringing me. Write it for people who are smart, tired, and allergic to jargon; if the philosophy is doing work, let it show up in the criteria rather than as named schools of thought. Take the losing half seriously enough that they'd recognize their own best argument in the memo and still be able to answer it. And at the end, tell me what would change your mind: which consideration, if it turned out true about this locus or about how the database gets used downstream, should flip your recommendation, and where you think your reasoning is most likely to break.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Persona:** Retired comparative physiologist (40 years on fish kidneys), now reading philosophy, serving on a fungal gene annotation committee. Smart, experienced, practical, slightly weary but engaged.
      *   **Audience:** The committee (11 people, mostly video call, smart, tired, allergic to jargon). Half favor "mechanism only" (current activity), half favor "evolutionary history/family definition" (selected function).
      *   **The Problem:** Locus 2714.
          *   *In vitro:* Turns over substrate S fast.
          *   *In vivo:* Substrate S absent. No growth defect in knockouts.
          *   *In vivo (actual):* Binds/buffers divalent metal (physiologically relevant).
          *   *Phylogeny:* Ancestor did S reaction; lineage lost substrate S later.
          *   *Variants:* Some wild isolates have wrecked catalytic sites but intact metal buffering.
      *   **Constraints/Goals:**
          *   Draft a decision memo for circulation before Thursday's vote.
          *   Provide a bottom line (rule + specific ruling on 2714 + ruling on wrecked isolates).
          *   Provide criteria for future cases (actionable for curators).
          *   Avoid philosophical jargon (no "etiological vs. systemic"), but use the *logic* of the philosophy.
          *   Acknowledge the losing side's best argument (steel-manning).
          *   Include a "What would change my mind" section (vulnerability analysis).
      *   **Tone:** Professional, collegial, decisive but humble, practical.

  2.  **Deconstruct the Scientific/Philosophical Conflict:**
      *   *Side A (Mechanism/Current):* Annotate what it *does* now. If S isn't there, don't annotate S. Otherwise, we annotate phantom activities.
      *   *Side B (History/Family):* Annotate what defines the family/evolutionary role. If we don't annotate S, we lose the link to the enzyme family. The metal buffering might be a "moonlighting" side effect.
      *   *The Philosophical Underpinning:* Selected Effect (History) vs. Causal Role (Current).
      *   *The Compromise:* Databases serve different users. Some want to know what happens in the cell *now* (metabolic modelers). Some want to know evolutionary relationships (phylogeneticists).
      *   *The Specific Case:* The metal buffering is the *physiological* function. The S reaction is the *biochemical* potential/evolutionary shadow.
      *   *The Variants:* If catalytic site is wrecked but buffering works, the "function" for the cell is buffering. The "history" is broken enzyme.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format. To, From, Date, Subject.
      *   **Opening:** Acknowledge the difficulty. Validate the effort. Set the stage without preaching.
      *   **The Core Question:** Restate the dilemma simply. Is a function what a protein *can* do chemically, or what it *does* biologically?
      *   **The Decision (Bottom Line):** Need a clear rule.
          *   *Proposal:* Distinguish between "Biochemical Activity" and "Biological Process."
          *   *Ruling on 2714:* Annotate Metal Buffering as the *Biological Process*. Annotate S-turnover as *Biochemical Activity* but with a specific qualifier (e.g., "In vitro only" or "Ancestral"). Actually, better: Use the standard Evidence Codes. If there's no evidence it happens in vivo, don't annotate it as a biological process. But keep the biochemical capability noted if it defines the family.
          *   *Refinement:* Let's look at GO (Gene Ontology) standards. They distinguish Molecular Function (what it does chemically) from Biological Process (why the cell cares).
          *   *Decision:* Annotate Metal Buffering as the primary Biological Process. Annotate S-turnover as Molecular Function *only if* qualified as "potential" or linked to the family definition, but preferably suppress it if it misleads users about the living cell.
          *   *Wait, the prompt asks for a rule the committee can adopt.* Let's make it about *Context*.
          *   *Rule:* "Physiological Relevance Trumps Biochemical Potential." If a substrate is absent in vivo, the reaction is not the biological function, even if it defines the family.
          *   *Ruling on 2714:* Annotate Metal Buffering. Do not annotate S-turnover as a biological function. Tag it as "Evolutionary Relic" or similar if the schema allows, otherwise omit to prevent noise.
          *   *Ruling on Variants:* If catalytic site is wrecked, they are *not* loss-of-function regarding the cell's health (since buffering works). They are loss-of-function regarding the *ancestral* chemistry. Label them "Functional Divergence."
      *   **The Criteria (For Curators):** How to apply this next time without calling the retired guy.
          1.  Presence of substrate/condition in vivo.
          2.  Phenotypic impact of knockout.
          3.  Conservation of the specific residue vs. overall structure.
      *   **Addressing the Losing Side:**
          *   *Side B (History):* They worry about losing evolutionary signal. Acknowledge this. The memo must say: "We preserve evolutionary signal in the phylogeny trees and family classification, not in the functional annotation of the living cell."
          *   *Side A (Mechanism):* They worry about noise. Acknowledge this. "We prevent noise by requiring in vivo evidence for biological process annotation."
      *   **Interoperability:** Address the Atlantic partner. We can't force them to change, but we can map our "Biological Process" to their "Family Activity" with a flag.
      *   **What Would Change My Mind:** This needs to be specific.
          *   If S is found in trace amounts that matter?
          *   If the metal buffering is actually just a chemical property of the fold and not selected for? (i.e., if the buffering is the "incidental" part and the S-reaction is the "real" function but S is just hard to detect).
          *   If downstream users (e.g., metabolic engineers) specifically need the "potential" activity regardless of current state.

  4.  **Refining the Tone:**
      *   Avoid "Etiological Function." Use "Evolutionary History."
      *   Avoid "Causal Role." Use "Current Contribution."
      *   Sound like a scientist talking to scientists. "Let's cut the Gordian knot."
      *   Show respect for the grad student's work (it's not wrong, just context-dependent).

  5.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on the Ruling:* If we don't annotate S activity, do we lose the family link? The prompt says "S chemistry is what makes 2714 a member of that family." Okay, so the *name* of the family stays, but the *annotation* of activity should reflect reality.
      *   *Revised Rule:* Distinguish "Capacity" vs. "Role."
      *   *Revised Variants:* If the catalytic site is wrecked, calling it "loss-of-function" implies the cell is broken. It isn't. So, "Loss of Ancestral Chemistry" not "Loss of Function."

  6.  **Final Polish:** Check against all constraints.
      *   Bottom line? Yes.
      *   Specific ruling? Yes.
      *   Criteria for curators? Yes.
      *   No jargon? Yes.
      *   Losing side acknowledged? Yes.
      *   "Change my mind" section? Yes.

  7.  **Final Review of the "Change My Mind" section:** This needs to be the most intellectually honest part. Where does the reasoning fail? It fails if the database is used for *engineering* (putting the gene somewhere else) rather than *understanding* the organism. If the goal is parts for synthetic biology, the *potential* activity matters more than the native context. I should highlight that.

  8.  *(Self-Correction during drafting)*: Make sure I don't sound like I'm lecturing on philosophy. The prompt says "if the philosophy is doing work, let it show up in the criteria." So, instead of saying "We are adopting a Causal Role perspective," I say "We prioritize observed physiological impact."

  9.  **Finalizing the Memo Structure:**
      *   Header.
      *   Context (The "Why we are here").
      *   The Decision (The Rule).
      *   Application to Case 2714.
      *   Guidelines for Future Curation.
      *   Interoperability Note.
      *   Vulnerability Analysis ("What would change my mind").

