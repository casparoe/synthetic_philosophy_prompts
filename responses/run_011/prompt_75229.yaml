answer: |-
  **MEMORANDUM**

  **TO:** Curation Policy Committee
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Decision Framework for Locus 2714 and Future Functional Annotations

  **Context**

  We have spent two months debating Locus 2714 because we are asking a single field in a database to answer two different questions. One half of this committee wants to record what a protein *is* (its biochemical identity and evolutionary history). The other half wants to record what a protein *does* (its contribution to the living cell right now).

  Both are valid scientific questions. But when we conflate them in a single annotation, we create noise for the metabolic modelers and confusion for the evolutionary biologists. The case of 2714 is not an anomaly; as we annotate more non-model organisms, we will find more proteins that have retained their chemical engine but lost their original fuel, or vice versa.

  We need a rule that allows us to capture the history without lying about the physiology.

  **The Decision**

  Effective immediately, this database will distinguish between **Biochemical Capacity** and **Physiological Role**.

  1.  **Biochemical Capacity** describes the chemical reactions a protein structure can catalyze or the molecules it can bind, regardless of whether the substrate is currently present in the organism. This tracks evolutionary family and potential utility.
  2.  **Physiological Role** describes the activity that contributes to the organism's fitness or phenotype in its native environment. This requires evidence that the substrate/condition exists *in vivo* and that the activity impacts the cell.

  **Ruling on Locus 2714**

  *   **Physiological Role:** Annotate as "Divlaent Metal Buffering." The evidence (in vivo binding, phenotypic impact of knockout) supports this as the current contribution to the cell.
  *   **Biochemical Capacity:** Annotate as "Substrate S Turnover" *only* if tagged with a qualifier indicating "In Vitro Only" or "Ancestral State." Do not link this to a Biological Process pathway. It defines the protein's family, but not the organism's metabolism.
  *   **Wild Isolates (Wrecked Catalytic Site):** These are **not** to be flagged as "Loss-of-Function." The cell functions normally regarding metal buffering. These isolates represent "Functional Divergence." The ancestral chemistry is lost, but the physiological role is retained. Flagging them as broken would mislead users into thinking these strains are compromised.

  **Criteria for Curators (The "Bench Test")**

  To avoid bringing every ambiguous case to the full committee, curators should apply the following three tests when biochemical data and physiological data conflict:

  1.  **The Substrate Test:** Is the substrate or condition detectable in the tissue/environment where the protein is expressed?
      *   *If No:* The activity is Biochemical Capacity only. Do not annotate as a Biological Process.
  2.  **The Knockout Test:** Does removing the gene change the organism's phenotype under relevant conditions?
      *   *If No (for the biochemical activity):* The activity is likely incidental or redundant. Prioritize the activity that shows a phenotype.
  3.  **The Conservation Test:** Is the specific residue required for the biochemical activity conserved across the population?
      *   *If No (e.g., the wrecked isolates):* The biochemical activity is not essential for the lineage's survival. The conserved trait (metal buffering) is the true Physiological Role.

  **Addressing the Concerns**

  I know this splits the difference, and I want to address the strongest arguments from both sides of our debate.

  To those who argued that **history matters**: You are right that removing the "Substrate S" annotation severs the link to the enzyme family. That is why we retain it as *Biochemical Capacity*. We preserve the evolutionary signal without claiming the organism currently uses that pathway. This keeps our phylogenetics intact without polluting our metabolic maps.

  To those who argued that **noise is the enemy**: You are right that annotating phantom activities makes the database useless for systems biology. If we annotate every reaction a protein *could* do in a test tube, we cannot model what the cell *actually* does. This rule prioritizes the living system over the test tube for physiological annotations.

  **Interoperability**

  Regarding our Atlantic partners: We cannot force their convention. However, we will map our "Biochemical Capacity (Ancestral)" to their standard "Function" field with a metadata flag indicating "Context-Dependent." This satisfies the agreement that annotations translate without loss, provided their users respect the flag.

  **Vulnerability Analysis: What Would Change My Mind**

  I am confident in this framework, but I am not infallible. My recommendation rests on two assumptions. If either proves false, this ruling should be revisited.

  1.  **The "Cryptic Substrate" Possibility:** If future metabolomics detect Substrate S in trace amounts that are biologically significant (e.g., a signaling molecule rather than a metabolic fuel), the "Substrate Test" fails. If S is present and relevant, the S-turnover becomes a Physiological Role again, and the metal buffering may be the incidental side effect.
  2.  **The "Engineering Use-Case"::** Our reasoning prioritizes understanding the *native* organism. However, if data shows that the primary downstream users of this database are synthetic biologists mining for parts to use in *other* organisms, the logic flips. For an engineer, the *Biochemical Capacity* is the valuable trait, regardless of what the fungus does with it. If user surveys indicate >50% of our queries are for heterologous expression rather than native pathway analysis, we should prioritize annotating the maximum chemical potential of every protein, even if it is dormant in the wild.

  **Next Steps**

  Please review this framework before Thursday's call. I propose we vote to adopt this distinction as policy, apply it to 2714, and close the ticket. We have work to do, and the fungi aren't getting any less complex.

  Regards,

  [Your Name]
