prompt: |-
  I run a small research team at a company that makes a workplace analytics app — the kind that sits on your phone and pops up a few times a day asking how you're doing. Sales has been promising customers "insight into how your people actually feel," and now product wants to add items about *why* people feel that way, so we can sell HR a causal story instead of just a mood graph. A friend of mine who does UX research elsewhere said every team eventually gets burned by this and I'd like to get burned on purpose, in a controlled way, so: before I sign off on the question set I want a triage procedure my team can run on any proposed self-report question. Literally a list of checks in order with pass/fail conditions, that tells us how much evidential weight an answer can carry and which questions we should refuse to field at all.

  Context for what you're working with. The app also passively collects calendar data, typing cadence and app-switching, so for a lot of items we could compare what people say against a behavioral trace — I want the procedure to say what a mismatch between the two means, because I don't buy the easy answer that the trace is ground truth and the report is the error. Sometimes the report is the thing we're actually trying to measure and the trace is a terrible proxy for it, and sometimes a person's self-ascription partly makes the state the state it is, so there's no independent fact for the trace to contradict. I also want it to seperate, as sharply as it can, the question forms that plausibly have real introspective access behind them (I'm thinking in-the-moment, about a vivid occurent experience, asked while it's happening) from the ones that are basically reconstruction after the fact (retrospective, dispositional, "how often in the last month," and above all "why did you do X"). Where the underlying philosophy is genuinely contested — I know there's a live fight about whether introspection is a detection faculty at all or a kind of self-interpretation that routinely confabulates — the procedure should state which side it's assuming, and say what breaks if the other side is right. No citations or reading lists, I have no way to check them and they aren't the deliverable. The deliverable is something a junior researcher can execute in fifteen minutes per question with a spreadsheet and a rubric.

  Then run it on four items we're arguing about right now: (1) "Right now, how absorbed are you in what you're doing?" fired at a random moment in the workday; (2) "Over the past two weeks, how often did you feel anxious at work?"; (3) "When you skipped the team retro on Thursday, what was the main reason?" asked the following Monday; and (4) the one our CEO is pushing hardest, "Do you feel more respected by your manager since we launched the new feedback policy?", benchmarked against a control of users at companies that launched nothing. I want concrete verdicts: field as-is, field with a specific rewrite (give me the rewrite), or refuse — plus what we tell the customer instead. At least one of the four should come out badly for us and I'd rather it be the CEO's. And please mark clearly where the procedure runs out and somebody has to make a judgment call, including the one I actually care about most: when someone says they felt X and nothing we can measure contradicts them, at what point does deferring to their report stop being respect for the subject and start being an abdication of the research?
reasoning: |-
  Here's a thinking process that leads to the suggested triage procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Research team lead at a workplace analytics company.
      *   **Product:** App collecting self-reports (mood/feelings) + passive behavioral data (calendar, typing, app-switching).
      *   **Goal:** Create a triage procedure (checklist/rubric) for evaluating proposed self-report questions *before* they are fielded.
      *   **Key Constraints/Requirements:**
          *   Must be executable by a junior researcher in ~15 mins/question.
          *   Must handle the tension between self-report and behavioral trace (neither is automatically "truth").
          *   Must distinguish between introspective access (in-the-moment) and reconstruction/confabulation (retrospective/"why").
          *   Must acknowledge philosophical contestation (introspection as detection vs. interpretation) and state assumptions.
          *   Must identify "judgment call" zones (specifically regarding when deferring to self-report becomes abdication of research rigor).
          *   No citations/reading lists.
          *   **Deliverable 1:** The Triage Procedure (Checklist/Rubric).
          *   **Deliverable 2:** Apply the procedure to 4 specific questions (Absorption, Anxiety Frequency, Skip Reason, Respect/Policy).
          *   **Specific Outcome:** At least one question (preferably the CEO's) must get a "Refuse" or severe warning verdict.
          *   **Tone:** Professional, pragmatic, epistemologically aware, actionable.

  2.  **Deconstruct the Epistemological Challenges:**
      *   *Self-Report vs. Behavioral Trace:* The prompt explicitly rejects "trace = truth." Sometimes trace is noise (e.g., typing fast doesn't mean focused). Sometimes report is the construct (e.g., feeling respected isn't visible in logs).
      *   *Introspection:* In-the-moment (phenomenological) vs. Retrospective (narrative reconstruction). The latter is prone to memory errors and causal confabulation.
      *   *Causality:* Self-reports cannot establish causality ("Why did you feel X?"). Only experiments or longitudinal modeling can hint at it, but even then, self-reported *reasons* are theories, not data.
      *   *Performativity:* Asking about respect might change the feeling of respect.

  3.  **Drafting the Triage Procedure (The "Evidential Weight Protocol"):**
      *   *Structure:* Needs to be a linear flow or a scored checklist. A linear "Gate" system works best for Pass/Fail/Conditional.
      *   *Step 1: Temporal Proximity.* Is it happening now or later? (High weight vs. Low weight).
      *   *Step 2: Construct Visibility.* Can behavior measure this? (If yes, check correlation. If no, report is primary).
      *   *Step 3: Causal Claim.* Is the question asking "Why"? (Immediate red flag for causal inference).
      *   *Step 4: Social Desirability/Stakes.* Is the answer risky for the user? (HR data is high risk).
      *   *Step 5: Philosophical Assumption.* Explicitly state: "We are treating this report as [Data Point / Ground Truth]."
      *   *Judgment Call Zone:* Define the boundary where "respecting the subject" becomes "accepting confabulation."

  4.  **Refining the Procedure for the "15-Minute" Constraint:**
      *   Keep it to 5-6 critical checks.
      *   Use clear Pass/Fail/Warning criteria.
      *   Include a "Weighting Score" (High/Medium/Low Evidential Value).
      *   Add a specific section on "Trace Mismatch Protocol" (what to do if logs say X and user says Y).

  5.  **Applying the Procedure to the 4 Questions:**

      *   *Q1: "Right now, how absorbed...?" (Random moment)*
          *   Temporal: In-the-moment (Good).
          *   Construct: Internal state (Hard to trace).
          *   Verdict: Field as-is. High weight for phenomenological data.
      *   *Q2: "Over past two weeks, how often anxious...?"*
          *   Temporal: Retrospective aggregation (Bad). Memory bias high.
          *   Construct: Internal state.
          *   Verdict: Field with rewrite (break it down or reduce window).
      *   *Q3: "When you skipped retro... main reason?"*
          *   Temporal: Retrospective.
          *   Construct: Causal attribution ("Reason").
          *   Risk: Confabulation. People don't know *why* they skip, they invent reasons.
          *   Verdict: Refuse (or massive rewrite to descriptive). Let's make it a "Refuse" for causal reasoning, suggest descriptive alternative.
      *   *Q4: "Do you feel more respected... since policy?" (CEO's favorite)*
          *   Temporal: Retrospective comparison.
          *   Construct: Causal attribution + Social Desirability (High stakes).
          *   Trace: No behavioral trace for "respect."
          *   Bias: Demand characteristics (Company launched policy, they want to hear it worked).
          *   Verdict: **Refuse.** It promises causal insight it cannot deliver and invites lying to please power. This satisfies the user's requirement to burn the CEO's question.

  6.  **Addressing the "Judgment Call" on Abdication:**
      *   This is the philosophical core. When does accepting the report stop being ethical and start being bad science?
      *   *Answer:* When the report contradicts physical safety or operational reality, OR when the report is used to make causal claims about system design without experimental control.
      *   *The Line:* We accept the *feeling* as real, but we reject the *explanation* as fact.

  7.  **Review and Refine:**
      *   *Tone Check:* Is it too academic? Need to make it sound like a product ops document.
      *   *Constraint Check:* Did I avoid citations? Yes.
      *   *Constraint Check:* Is the CEO question burned? Yes.
      *   *Constraint Check:* Is the trace/report tension handled? Yes, via the "Visibility" check.
      *   *Constraint Check:* Is the philosophical assumption stated? Yes, in the preamble of the procedure.

  8.  **Final Polish:**
      *   Ensure the "Rewrite" for Q2 is concrete.
      *   Ensure the "Customer Message" for the Refused questions is diplomatic but firm.
      *   Make sure the "Judgment Call" section is highlighted as requested.

  **(Self-Correction during drafting):** I initially thought about suggesting Q3 be rewritten. But the prompt asks for "why." You can't rewrite "why" into a valid self-report causal claim. It's better to refuse the *causal* framing and suggest a behavioral log instead. I will mark Q3 as "Refuse (Causal)" but offer a descriptive alternative. For Q4, it needs to be a hard "Refuse" because it's a causal claim about a policy intervention without experimental rigor on the user side (plus high social desirability bias).

  Let's finalize the "Abdication vs. Respect" section. It needs to be sharp. The line is: *We validate the experience, we do not validate the etiology.* If a user says "I am sad because of the software," we record "User is sad." We do not record "Software causes sadness" based solely on that.

  Okay, ready to write.
answer: |-
  # The Evidential Weight Protocol (EWP)
  **Version:** 1.0 (Internal Draft)
  **Owner:** Research Team
  **Execution Time:** ~15 Minutes per Question
  **Philosophical Stance:** *Critical Realism.* We treat self-reports as valid data points about the user's *current phenomenological state*, but invalid data points about *external causality* or *stable traits* unless corroborated. We assume introspection is a constructive process, not a perfect readout.

  ---

  ## Part 1: The Triage Checklist
  *Junior Researchers: Complete this spreadsheet row for every proposed survey item. If any "Refuse" triggers are met, the question cannot ship without VP approval.*

  ### 1. Temporal Proximity Check
  *   **Question:** Is the user reporting on an experience happening *now*, or reconstructing a memory?
  *   **Pass:** "Right now," "In this moment," "Currently." (High Evidential Weight)
  *   **Warning:** "Today," "This morning." (Medium Weight)
  *   **Fail:** "Last week," "Last month," "Since [Event]." (Low Weight — Memory reconstruction dominates).
  *   **Action:** If **Fail**, rewrite to shorten window or refuse if causal inference is required.

  ### 2. Construct Visibility Check
  *   **Question:** Can passive telemetry (calendar, typing, switching) plausibly proxy this state?
  *   **Pass (Invisible):** "Respect," "Belonging," "Absorption." (Telemetry is noise; Report is Ground Truth for the *feeling*).
  *   **Warning (Partial):** "Busy," "Distracted," "Working late." (Telemetry correlates but context matters).
  *   **Fail (Visible):** "How many hours did you work?" "Did you attend the meeting?" (Telemetry is Ground Truth; Report is prone to error/bias).
  *   **Action:** If **Fail**, do not ask. Use the trace. If Trace and Report mismatch, flag for qualitative follow-up, do not auto-correct the user.

  ### 3. Causal Attribution Check
  *   **Question:** Does the question ask the user to explain *why* they feel/acted this way?
  *   **Pass:** "How are you feeling?" "What is your mood?" (Descriptive).
  *   **Fail:** "Why are you feeling...?" "What caused...?" "Did [Policy X] make you feel...?" (Explanatory).
  *   **Rationale:** Users do not have introspective access to causal mechanisms. They generate post-hoc narratives.
  *   **Action:** If **Fail**, **REFUSE**. You are selling confabulation as data.

  ### 4. Social Desirability & Power Check
  *   **Question:** Is there a "correct" answer that benefits the user's standing with management?
  *   **Pass:** Anonymous, low-stakes, no clear "good" answer.
  *   **Fail:** Linked to performance, asks about management effectiveness, asks about policy success where "Yes" pleases leadership.
  *   **Action:** If **Fail**, requires anonymization aggregation (N > 20) or Refuse.

  ### 5. The Mismatch Protocol (Trace vs. Report)
  *   **Scenario:** User says "I am focused" but Trace shows "High App Switching."
  *   **Rule A (Invisible Constructs):** If the construct is internal (e.g., "Absorption"), **trust the Report.** The trace is a bad proxy for flow state.
  *   **Rule B (Visible Constructs):** If the construct is behavioral (e.g., "I worked through lunch"), **trust the Trace.** Mark the report as "Perception Variance."
  *   **Rule C (Causal):** If the user says "I am stressed *because* of the app," **do not validate the cause.** Record the stress, flag the attribution as unverified.

  ---

  ## Part 2: The Judgment Call Boundary
  **When does deferring to the subject become an abdication of research rigor?**

  There is a hard line between **validating experience** and **validating etiology**.
  1.  **Respect for Subject:** Accepting "I feel anxious" as true, even if telemetry shows low activity. The feeling is the reality we are measuring.
  2.  **Abdication of Research:** Accepting "I feel anxious *because of the new update*" as true based solely on that report.

  **The Rule:** We defer to the user on *what* they feel. We never defer to the user on *why* they feel it, unless it is a controlled A/B test where the "why" is inferred from the experimental condition, not the self-report. If a user's report contradicts physical safety or operational reality (e.g., "I am not logged in" when logs show activity), we investigate the error. If it contradicts a causal theory, we investigate the theory.

  ---

  ## Part 3: Triage Application (Current Backlog)

  ### Item 1: "Right now, how absorbed are you in what you're doing?"
  *   **Trigger:** Random moment in workday.
  *   **Check 1 (Temporal):** **Pass.** In-the-moment phenomenology.
  *   **Check 2 (Visibility):** **Pass (Invisible).** Typing cadence does not equal absorption. Report is primary.
  *   **Check 3 (Causal):** **Pass.** Descriptive only.
  *   **Check 4 (Social):** **Pass.** Low stakes.
  *   **Mismatch Protocol:** If high absorption reported during high app-switching, log as "Multitasking Flow." Do not invalidate report.
  *   **Verdict:** **FIELD AS-IS.**
  *   **Evidential Weight:** High (for mood/state), None (for productivity).
  *   **Customer Script:** "This measures real-time engagement states, not output volume. Use this to identify peak flow times, not to grade performance."

  ### Item 2: "Over the past two weeks, how often did you feel anxious at work?"
  *   **Check 1 (Temporal):** **Fail.** Two-week recall is subject to recency bias and peak-end rule.
  *   **Check 2 (Visibility):** **Pass (Invisible).** Anxiety is internal.
  *   **Check 3 (Causal):** **Pass.** Frequency, not cause.
  *   **Check 4 (Social):** **Warning.** "Anxious" is stigmatized.
  *   **Verdict:** **FIELD WITH REWRITE.**
  *   **Rewrite:** "Thinking about *yesterday*, how many times did you feel anxious?" (Reduce recall window). Or, trigger this question only after high-stress calendar events (e.g., post-meeting) to anchor memory.
  *   **Customer Script:** "Long-term recall of frequency is statistically noisy. We are shortening the window to improve accuracy. Do not use this for clinical assessment."

  ### Item 3: "When you skipped the team retro on Thursday, what was the main reason?"
  *   **Check 1 (Temporal):** **Fail.** Retrospective (Monday about Thursday).
  *   **Check 2 (Visibility):** **Pass (Visible).** Calendar trace confirms absence.
  *   **Check 3 (Causal):** **FAIL.** Asks for "Reason" (Causal Attribution).
  *   **Check 4 (Social):** **Fail.** Justifying absence to employer.
  *   **Rationale:** Users rarely know the true causal driver of avoidance. They will provide the socially acceptable reason (e.g., "Conflict") rather than the actual one (e.g., "Boredom" or "Fear"). This is confabulation data.
  *   **Verdict:** **REFUSE.**
  *   **Alternative:** Log the skip behavior via calendar API. If you must ask, change to: "Which of these conflicts prevented attendance? (Select all that apply)" — provide a closed list of logistical barriers, do not allow open-ended "Why."
  *   **Customer Script:** "Self-reported reasons for avoidance are highly biased toward social acceptability. We can track attendance patterns reliably; we cannot reliably track the *motivation* for absence via survey."

  ### Item 4: "Do you feel more respected by your manager since we launched the new feedback policy?"
  *   **Check 1 (Temporal):** **Fail.** Retrospective comparison ("Since...").
  *   **Check 2 (Visibility):** **Pass (Invisible).** Respect is not visible in logs.
  *   **Check 3 (Causal):** **FAIL.** Explicitly links feeling to policy intervention ("Since...").
  *   **Check 4 (Social):** **CRITICAL FAIL.** High power dynamic. The "correct" answer is "Yes."
  *   **Rationale:** This is a demand characteristic trap. Users will answer "Yes" to signal alignment with company initiative. It provides zero causal evidence of policy efficacy, only evidence of users' desire to please.
  *   **Verdict:** **REFUSE.**
  *   **Alternative:** Run a blinded A/B test where some teams get the policy and some don't, and measure *unsolicited* sentiment (e.g., Item 1 absorption or Item 2 anxiety) without mentioning the policy in the question.
  *   **Customer Script:** "This question measures compliance, not respect. Because the policy is visible, users will infer the desired answer. We cannot sell this as causal proof of policy success. It creates liability if we claim causality based on self-attribution."

  ---

  ## Part 4: Implementation Notes for the Team

  **On the CEO's Question (Item 4):**
  You asked for one to come out badly. Item 4 is the most dangerous. It violates Check 3 (Causal) and Check 4 (Social Desirability). If we field this, we are not measuring respect; we are measuring *perceived pressure to agree*.
  *   **The Burn:** If Sales sells "Causal insight into policy ROI" based on this question, we are liable for misleading data.
  *   **The Fix:** Tell the CEO we can measure *sentiment shift* in the treatment group vs. control group using *neutral* questions (like Item 1), but we cannot ask users to attribute that shift to the policy themselves.

  **On Trace vs. Report Mismatches:**
  When the logs say "Idle" and the user says "Working Hard":
  1.  Do not flag the user as lying.
  2.  Flag the *metric* as "Low Correlation."
  3.  In reports to HR, label the data stream clearly: "Self-Perceived Effort" vs. "Digital Activity." Never merge them into a single "Productivity Score."

  **Final Judgment Call:**
  If a user reports a state that contradicts the trace (e.g., "I am calm" vs. "Erratic typing"), and we are using this to trigger an intervention (e.g., sending a wellness resource), **always prioritize the Self-Report.**
  *   *Why?* Because the intervention targets the *experience*, not the behavior.
  *   *The Limit:* If the Self-Report contradicts *safety* (e.g., "I am at my desk" vs. GPS shows home), trust the Trace.
  *   *The Abdication Line:* We abdicate if we use the Self-Report to blame the system ("The app made them anxious") without experimental control. We respect the subject if we use the Self-Report to support the human ("They feel anxious, let's reduce load").

  **Sign-off:**
  *   [ ] Research Lead
  *   [ ] Product Lead
  *   [ ] Legal/Compliance (Required for Item 4 Refusal)
