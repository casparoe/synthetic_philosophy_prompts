  *(Self-Correction on "Stale")*: The "Tu Quoque" is the obvious one. But the specific application to *moral standing* (vs logical fallacy) is more modern (Bell, Fritz, etc.). I should note that the *concept* of standing is contested, not just the hypocrisy angle.

