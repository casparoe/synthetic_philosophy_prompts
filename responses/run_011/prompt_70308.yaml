answer: |-
  Dear Colleague,

  It is a pleasure to engage with this thought experiment, for it isolates the tension between chance and evidence more sharply than the standard undermining future cases. You have asked for my verdict on the five candidate norms within the specific ontology of your feedback world, where chance laws are endogenous to the history they govern. I will state my ranking immediately so you can locate it without hunting. My order of preference, from most to least satisfactory, is E, C, D, A, and finally B. I reach this conclusion by prioritizing coherence-safety over bite, for a norm that demands incoherence is broken, whereas a norm that is occasionally silent is merely incomplete.

  To see why this order holds, we must first look at how the feedback mechanism disrupts the standard machinery of chance deference. In your world, the chance law at time t is a function of the history up to t. This means that past outcomes are not independent of the chance hypothesis; they determine it. Consequently, the standard notion of admissibility, which relies on the chance hypothesis screening off the evidence from the outcome, collapses. If the chance hypothesis is determined by the evidence, the evidence cannot be admissible in the standard sense. This immediately imperils Candidate B, which relies on that distinction. Furthermore, the absence of a fixed chance hypothesis that holds true through the whole history creates an ontological mismatch for Candidate C, which requires conditionalization on such a hypothesis. Candidate A ignores these structural issues entirely, while D and E attempt to navigate them via pragmatism and expectation respectively.

  Let us begin with the bottom of the ranking. Candidate B, admissible-evidence alignment, scores poorly here because the feedback loop renders the admissibility clause vacuous. In your world, information about the past is precisely what fixes the current chance law. Therefore, the chance hypothesis does not render the past irrelevant; it entails it, or rather, is entailed by it. If admissible evidence is defined as evidence the chance hypothesis renders irrelevant to the proposition, then no evidence about the history is admissible. Since history is the only evidence available to the agent, the principle never bites. I give it a two out of ten for bite, as it effectively silences itself. It scores a six out of ten for coherence-safety only because it refuses to apply rather than demanding a contradiction, but this safety is purchased at the cost of utility. It is technically safe but practically useless in this environment.

  Candidate A, unrestricted alignment, is the most dangerous. It demands that whenever evidence entails the chance is x, credence must be x. In a feedback world, evidence about the past entails the current chance law. However, if that same evidence also entails something about the future outcome, perhaps through a deterministic link in the update rule or simply by including the outcome itself in the evidence set, the agent is forced into a contradiction. If the evidence entails the chance is 0.5 but also entails the outcome occurs, the norm demands credence 0.5 and credence 1 simultaneously. I score it a three out of ten for coherence-safety because it invites exactly the kind of undermining contradiction Lewis sought to avoid. It scores a nine out of ten for bite because it is extremely demanding, but a demanding norm that breaks the agent is no good.

  Candidate D, your thresholded invention, is a pragmatic retreat. It avoids the coherence crash of A by refusing to defer when uncertainty about the law is high. In the feedback world, where the law shifts continuously, an agent might never reach the threshold of confidence required to trigger the deference norm. If the law updates after every decay, the posterior weight might never concentrate enough on a single hypothesis to switch the requirement on. I score it a ten out of ten for coherence-safety, as it never forces a mismatch between credence and chance unless the agent is already nearly certain of the chance. However, it scores only a five out of ten for bite. In a world of continuous revision, the agent may spend their entire life ignoring chance information, relying solely on ordinary conditionalization. It saves the agent from error but fails to guide them toward the specific rationality that chance knowledge should provide.

  Candidate C, hypothesis-conditional alignment, is the standard repair for the Principal Principle, but it strains against the ontology of your world. You stipulated there is no prior chance hypothesis that stays true through the whole history. Lewis's reformulation requires conditionalizing on a complete theory of chance. If no such static theory exists, the norm has no object. One might try to salvage it by treating the dynamic update rule as the hypothesis, but strictly speaking, this changes the nature of the hypothesis from a static law to a process. If we allow that interpretation, it performs well, but under your strictures, it is often undefined. I score it an eight out of ten for coherence-safety, assuming the agent can find some hypothesis to conditionalize on, but a seven out of ten for bite because the lack of a fixed target weakens its grip. It is theoretically elegant but ontologically mismatched.

  This leaves Candidate E, expected-chance alignment, which I rank first. This norm treats the chance itself as a random variable subject to updating. It does not require a fixed hypothesis to be true; it requires only a prior distribution over possible chance trajectories. In your feedback world, the agent conditionalizes on the history, which updates their distribution over the possible current chance laws, and their credence in the future outcome becomes the expectation of the chance across those hypotheses. This handles the endogenous nature of the law perfectly. The constraint is shifted to the ur-prior, requiring that the prior be such that if the agent were certain of the chance, they would defer. This is a constraint on rationality that survives the feedback loop. I score it a ten out of ten for coherence-safety, as it is mathematically guaranteed to produce a coherent probability function. I score it a nine out of ten for bite. It is slightly less biting than A because it averages over uncertainty, but this is a feature, not a bug; it constrains the agent to respect the chance information proportionally to their confidence in it, which is the correct rational response in a shifting landscape.

  You asked me to weight the dimensions where they pull apart. In this case, coherence-safety is the dominant virtue. A norm of rationality cannot require an agent to hold inconsistent credences, so any candidate that scores poorly on coherence must be ranked lower regardless of its bite. Candidate A is highly biting but incoherent, so it falls below E and D. Candidate B is safe but vacuous, so it falls below D which at least works sometimes. Candidate C is strong but ontologically fragile in this specific world, placing it below E which is robust. Candidate E wins because it maintains high coherence without sacrificing significant bite; it simply relocates the bite from a direct imperative to a constraint on the initial state of the agent, which is where the commitment to objective chance truly resides.

  I should note one correction to your description of Candidate E. You describe it as deflationary, suggesting it treats chance information as no different from any other input. While it is true that it uses ordinary conditionalization, it is not deflationary about the norm itself. The requirement that the ur-prior must reproduce the chances upon conditionalization is a substantive constraint on rationality, not a trivial one. It is not that deference falls out of updating alone, but that deference falls out of updating given a prior that respects the chance-role. This distinction matters because it preserves the normativity of chance without requiring a magical link between credence and chance at every moment. My ranking assumes this corrected, robust interpretation of E. If E were merely ordinary conditionalization with no constraint on the prior, it would score zero on bite, but as you described the prior constraint, it remains a genuine norm of deference.

  In summary, the feedback world reveals that admissibility is too fragile and fixed hypotheses are too rigid. The only norm that bends without breaking is the one that treats chance as an object of expectation rather than a premise of inference. Your Candidate E captures this insight best, followed by the idealized C, the pragmatic D, the dangerous A, and the vacuous B. I hope this verdict assists in shaping your piece, for it seems to me that the future of probability philosophy lies in exactly this kind of dynamic modeling rather than in static principles.

  Yours sincerely,

  A Philosopher of Probability
