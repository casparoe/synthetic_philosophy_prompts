answer: |-
  There is no single established term for this exact configuration, though the core dynamic is best described by Ian Hacking's concept of "Looping Effects."

  Ian Hacking's "Looping Effects" (or "Interactive Kinds") is the philosophical parent of your observation: it describes how classifying people changes how they understand themselves, which changes how they behave, which forces the classification to change. This covers your "boring half" and the "rebuilt out of the people it changed" half perfectly. However, Hacking focuses on the *instability* of the knowledge produced (i.e., you can't compare statistics across time because the kind has changed), whereas your pattern highlights the *institutional effort to hide that instability* via retroactive re-scoring. Hacking identifies the moving target; you are identifying the camouflage painted over the moving target to make it look stationary.

  Your list of near-misses each captures a slice of the mechanism but misses the闭环 (closed loop) plus erasure:
  *   **Performativity:** Covers the idea that describing a thing brings it into being (or changes it), but lacks the specific feedback into measurement criteria and the historical revisionism.
  *   **Concept Creep / Diagnostic Inflation:** Captures the expansion of the category boundaries, but treats it as a one-way drift rather than a feedback loop where the subjects actively reshape the definition which then reshapes them.
  *   **Goodhart's Law:** Captures the measurement changing the behavior, but assumes the metric breaks, not that the metric is silently rewritten to pretend it hasn't broken.
  *   **Retrospective Recoding:** This is the technical term for the *method* used in your Asperger's example (re-coding old files to match new criteria), but it is usually treated as a neutral epidemiological tool rather than a systemic epistemic hazard that creates an illusion of continuity.

  Since the combination of the feedback loop and the erasure of the break lacks a canonical name, I propose calling this **"Self-Erasing Classification."**

  **Definition:** A Self-Erasing Classification occurs when a descriptive category alters the behavior of the classified group (looping), the category is updated to reflect this new behavior, and historical data is retroactively harmonized to the new standard, creating an illusion of continuous validity across the discontinuity.

  **Boundary Cases:**
  *   **Counts:** The DSM-IV to DSM-5 Autism spectrum consolidation where prior case files were re-interpreted under new criteria to maintain prevalence trends; the adoption of "microaggression" where the definition expanded based on reported experiences, and past events were re-evaluated through the new lens without marking the shift.
  *   **Doesn't Count:** Simple definition expansion (e.g., "planet" redefined to exclude Pluto) where the change is explicit and historical data is not re-scored to pretend Pluto was always/non-always a planet.
  *   **Looks Like It But Isn't:** **Goodhart's Law** in education (teaching to the test). The behavior changes to match the measure, but the test scores are not retroactively rewritten to hide the fact that the curriculum changed; the break is visible in the score inflation itself.
