prompt: |-
  I am revising a draft essay on deplatforming for a general-audience venue and would be grateful for comments. I am less interested in whether you share its conclusions than in whether its central distinction survives scrutiny, so I have set out specific questions after the draft. Please be direct; agreement is not useful to me here.

  ---

  **Against the Speech Frame**

  Nearly every argument about deplatforming is conducted in one of two registers. The first holds that deplatforming is censorship wearing a corporate uniform: a handful of firms now perform the coordinating function that public squares, printing presses, and broadcast licenses once performed, so the constitutional limits we accept on official suppression are being evaded rather than respected when the same work is done by a private terms-of-service decision. The second holds that these are private firms, that they may refuse service to anyone for any reason, and that anyone who thinks otherwise has never had to moderate a comments section at scale. The two positions are usually presented as opposed. They are not. They share a premise — that what deplatforming destroys is a channel — and disagree only about whether the loss of a channel is a harm that anyone else must remedy.

  I want to deny the shared premise. What is destroyed, in the cases that matter, is not a channel but a record. Call the set of systems through which a person becomes findable, attributable, and citable to others the legibility infrastructure of a society. Historically it was diffuse and unowned: city directories, library catalogs, professional registers, mastheads, the durable local knowledge of who you are and what you have said. Much of it is now concentrated in a small number of searchable, indexable commercial platforms, and an addressable account on one of them is often the load-bearing element of a person's public existence.

  This suggests a distinction that the current debate lacks. Call the first term reach and the second standing. Reach is the size of the audience a person actually commands; it varies enormously between accounts and is a function of luck, craft, and algorithmic favor. Standing is the bare fact of being locatable at all: that your profile resolves when someone searches your name, that your own words can be linked and read in context, that a journalist, an employer, or a future collaborator can confirm you exist and check a claim about you against what you actually wrote. Reach is scalar and largely earned. Standing is closer to binary and is conferred simply by a platform's willingness to host an addressable identity.

  Once the two are separated, several familiar arguments lose their grip. Suspending an account with forty followers may cost nothing in reach and everything in standing: the person loses no audience, but also loses the ability to be verified, and any third party who now searches their name finds only what others have said about them. Conversely, demonetizing or heavily downranking a large account may destroy most of its reach while leaving standing intact: the archive persists, the address still resolves, the person can still say, here is the passage, read it yourself. The two harms differ in kind, and because the debate conflates them, it manages to insist simultaneously that deplatforming is trivial (they can start a blog) and catastrophic (they have been silenced). Both claims are true of different cases and neither is true of the case the other has in mind.

  From this I want to derive two tests for when the destruction of standing is illegitimate. The first is the displacement test: an adequate alternative venue must preserve standing, not merely reach. It must be searchable, indexable, and treated by relevant third parties as a place where the person's own words authoritatively live. Welcoming a removed user onto a rival service that no employer, reporter, or citation manager ever consults is not displacement; it is relocation to somewhere one cannot be found. The second is the sentence test: the sanction must be bounded. Stated grounds, a declared duration, a reviewable decision, and a record that can eventually be expunged. Legal punishment, for all its other defects, is built around exactly these constraints. Removal decisions made under commercial pressure by trust-and-safety teams typically have none of them, with the result that a one-line permanent ban functions as a life sentence issued without any record of the charge.

  The implication is that the natural remedy is procedural rather than expressive. Not a free speech claim against a private firm, which runs into the state-action requirement and, more damagingly, into the sound intuition that nobody is entitled to a megaphone. Instead, something like the obligations we already accept from keepers of reputation records. The consumer credit regime requires that a person be able to see what is recorded about them, dispute entries they believe are wrong, and have erroneous or unverifiable material corrected or removed. Common carriage requires that a firm holding itself out to serve all comers not discriminate arbitrarily among them. A duty to give reasons, hear appeals, and permit restoration is far less demanding than a duty to host, and it is where the pressure belongs.

  The objection I take most seriously is that proceduralizing deplatforming entrenches the platforms. If a firm's obligation is to run a fair hearing rather than to keep out of your way, the firm becomes the permanent adjudicator of who counts, the incentive to build alternatives weakens, and every community — including the small ones legitimately defined by their exclusions — loses the ability to say *not you* without filing a brief in support. My response is that both tests are scale-sensitive. A venue owes reasons and appeals only where it is non-substitutable, that is, only where the displacement test cannot be satisfied elsewhere. A private group chat of three hundred members fails that condition; the default place where a name resolves does not.

  A second objection is that procedure favors whoever can staff it. Reason-giving and appeal generate paperwork, paperwork is cheap for institutions and expensive for individuals, and a well-represented bad actor will exploit hearing rights that an unrepresented good actor never manages to invoke. I concede part of this. But informality is not neutral either: under current practice, the well-connected have their suspensions reversed by emailing someone, and everyone else receives a form letter.

  Where I think the draft is weakest is the last point, and it is the one I most want comments on. The entire apparatus is addressed to institutions making decisions, and much of what goes by the name of cancel culture is not that at all. It is a distributed event — a screenshot, a wave of replies, an employer's inbox filling up — in which no single agent decides anything, no venue is identified, and there is consequently nothing to appeal to. On my account this phenomenon either falls outside the framework, or else swamps it, since almost everyone now has some non-substitutable addressable presence that a mob can attack without anyone having removed them. I cannot yet decide whether to present this as an acknowledged limitation or as a sign that the essay is about a narrower thing than its framing claims.

  ---

  My questions, in order of importance:

  1. Does the reach/standing distinction pick out something real, or is it a relabeling of a difference of degree — large accounts versus small ones — that everyone already grasps? If the latter, does anything in the two tests survive the collapse?
  2. Is the displacement test operational, or is it only ever evaluable in hindsight by the person invoking it? Please say what evidence a third party would need in order to apply it.
  3. Do I underweight the second objection? In particular, consider whether the credit-reporting analogy cuts against me, since dispute rights in that setting are commonly described as ineffective in practice. If the analogy fails, is there a better one that still supports a procedural rather than expressive remedy?
  4. What is the strongest counterexample available — a type of case in which both tests are clearly satisfied yet the removal is plainly legitimate, or in which both clearly fail yet the removal is plainly illegitimate?
  5. Please flag any place where I have overstated or misdescribed the legal background: the state-action requirement, common carriage, and consumer credit reporting. I have deliberately kept these general and have cited nothing, but I want to know whether the generalizations are safe as stated.
  6. Is the difficulty described in the penultimate paragraph fatal? If the framework reaches only institutional decisions, is there still an essay here, and what should its framing claim to cover?
reasoning: |-
  Here's a thinking process that leads to the suggested feedback:

  1.  **Analyze the Request:**
      *   **Task:** Revise/critique a draft essay on deplatforming.
      *   **Audience:** General-audience venue.
      *   **Goal:** Test the central distinction (Reach vs. Standing) and the derived tests (Displacement, Sentence).
      *   **Constraint:** Be direct. Agreement is not useful. Focus on scrutiny, not validation.
      *   **Specific Questions:** Six specific questions provided by the user, ranked by importance.

  2.  **Analyze the Draft:**
      *   **Core Argument:** Deplatforming debates focus on "channels" (censorship vs. private property). The author argues the real loss is "standing" (legibility/findability) vs. "reach" (audience size).
      *   **Proposed Solution:** Procedural remedies (due process, appeals, reasons) akin to credit reporting or common carriage, rather than free speech claims.
      *   **Tests:**
          1.  *Displacement Test:* Is there an alternative venue that preserves standing (searchable, indexable, authoritative)?
          2.  *Sentence Test:* Is the sanction bounded (duration, reviewable, expungable)?
      *   **Weakness Acknowledged:** The framework doesn't address distributed "cancel culture" (mobs, screenshots, employer emails) where no single institution makes the decision.

  3.  **Address Question 1: Reach vs. Standing (Real distinction or relabeling?)**
      *   *Critique:* It *feels* real, but is it just "influence vs. existence"? The draft argues small accounts lose standing, large accounts lose reach.
      *   *Scrutiny:* Is standing truly binary? If I'm banned from Twitter but have a website, do I lose standing? The draft says standing depends on the platform being the "load-bearing element."
      *   *Risk:* It might collapse into "Powerful vs. Powerless." Powerful people have standing elsewhere (PR teams, websites); powerless people rely on the platform.
      *   *Verdict:* It picks out something real (findability vs. volume), but the *binary* nature of standing is overstated. It's more of a spectrum of *dependency*. If the distinction collapses, the tests fail because they rely on "non-substitutable" status.
      *   *Advice:* Strengthen the definition of standing as *dependency on a specific index* rather than just "being findable."

  4.  **Address Question 2: Displacement Test (Operational?)**
      *   *Critique:* How do we know *ex ante* if Substack/Truth Social/Mastodon preserves standing?
      *   *Scrutiny:* It's inherently retrospective. You only know a venue doesn't count when journalists/employers stop citing it.
      *   *Evidence needed:* SEO metrics? Citation frequency by legacy media? Integration with background check services?
      *   *Verdict:* It's hard to operationalize objectively. It relies on social consensus about what counts as a "record."
      *   *Advice:* Acknowledge the lag. Suggest specific metrics (Google Indexing, API access for background checks).

  5.  **Address Question 3: Second Objection (Procedure favors the powerful/Credit Analogy)**
      *   *Critique:* The user worries procedure helps bad actors. The credit analogy is weak because credit dispute processes are notoriously broken (automated, ignored).
      *   *Scrutiny:* If the goal is fairness, credit reporting is a *bad* model. It's a model of *bureaucratic inertia*.
      *   *Alternative:* Occupational licensing boards? University tenure reviews? These have higher stakes and more robust (though slow) appeals.
      *   *Verdict:* The credit analogy undermines the argument because everyone hates credit bureaus.
      *   *Advice:* Pivot to "utility due process" or occupational licensing. Acknowledge the cost but argue informal discretion is *more* biased.

  6.  **Address Question 4: Strongest Counterexample**
      *   *Scenario A (Tests met, removal illegitimate):* A terrorist leader. They have standing (everyone knows them), removal is permanent (sentence test fails), but removal is legitimate for safety. *Wait, the tests are for when removal is illegitimate.*
      *   *Scenario B (Tests failed, removal legitimate):* Immediate incitement of violence. No time for a hearing (Sentence test fails). No alternative venue matters because the harm is immediate.
      *   *Scenario C (Tests met, removal legitimate):* A spam bot farm. They have no standing (not real people).
      *   *Refinement:* The strongest counterexample is *imminent harm*. If someone is coordinating a riot *now*, the "Sentence Test" (bounded sanction, reviewable decision) is impossible. The essay needs an emergency exception.
      *   *Refinement 2:* What about a private community? A niche forum for abuse survivors. They fail the displacement test (nowhere else to go for *that* specific support) but should absolutely be able to ban abusers. The "scale-sensitive" clause handles this, but it's a tension point.

  7.  **Address Question 5: Legal Background (State Action, Common Carriage, Credit)**
      *   *State Action:* Correct. Private companies generally aren't state actors unless entangled with gov.
      *   *Common Carriage:* Tricky. Historically for transport/telecom. Applying it to content platforms is legally contested (Miami Herald v. Tornillo). It's a policy argument, not current law.
      *   *Credit Reporting:* FCRA (Fair Credit Reporting Act). Yes, it allows disputes.
      *   *Verdict:* Generally safe for a general audience, but "Common Carriage" is a lightning rod legally. Clarify it's an *analogy* for regulation, not a claim that they *are* common carriers.

  8.  **Address Question 6: The "Cancel Culture" Weakness (Fatal?)**
      *   *Critique:* The essay claims to address "deplatforming." If most deplatforming is actually "doxxing + employer pressure" without a platform ban, the essay misses the main phenomenon.
      *   *Verdict:* Not fatal, but requires narrowing the scope. The essay is about *Infrastructural Deplatforming*, not *Social Deplatforming*.
      *   *Advice:* Reframe the title/intro. Admit this is about the *gatekeepers of record*, not the mob. The mob relies on the gatekeepers to make the ban stick (e.g., the mob demands Twitter ban the person).

  9.  **Synthesize and Format:**
      *   Organize by the user's 6 questions.
      *   Maintain a direct, critical tone (as requested).
      *   Ensure specific, actionable advice is given for each point.

  10. **Review against Constraints:**
      *   Did I agree too much? *Check:* Ensure I challenge the "Standing" definition and the Credit Analogy.
      *   Did I answer all 6 questions? *Check.*
      *   Is the tone appropriate? *Check:* Professional, analytical, direct.

  *(Self-Correction during drafting)*: On Q1, I need to be careful not to say the distinction is *wrong*, but that it might be *dependent* on market concentration. If Twitter dies, standing shifts. So standing is a property of the *market*, not the *user*. I should highlight that.
  On Q3, the credit analogy is indeed weak. I should suggest "Professional Licensing" instead.
  On Q6, I need to tell them to narrow the claim. Don't try to solve "cancel culture," solve "administrative exile."

  11. **Final Polish:** Check clarity and ensure the "Direct" instruction is followed (no fluff intro/outro).

  *(Final thought)*: The prompt asks me to be direct and that agreement is not useful. I will structure the response to directly answer the numbered questions with critical analysis.

  *(Drafting response)*...
  *   Q1: Distinction is real but "Standing" is market-dependent, not user-dependent.
  *   Q2: Displacement test is retrospective. Needs metrics.
  *   Q3: Credit analogy is a liability. Use Licensing.
  *   Q4: Emergency/Imminent Harm exception.
  *   Q5: Common Carriage is legally fraught. Clarify it's normative.
  *   Q6: Narrow the scope. It's about "Infrastructural Exile."

  Let's write it.cw
answer: |-
  1. **Reach vs. Standing:** The distinction picks out something real, but you risk collapsing it into "market concentration" rather than a property of the user. Standing is not binary; it is a function of monopoly power. If Twitter is the only place journalists look, standing is high. If the market fragments, standing dissipates. Your definition ("load-bearing element of a person's public existence") admits this, but the text occasionally treats standing as an intrinsic right rather than a market condition.
      *   **Scrutiny:** If the distinction collapses into "dependency on a monopoly," the tests survive only if they target the monopoly status, not the user's status.
      *   **Recommendation:** Explicitly frame standing as *infrastructural dependency*. This prevents the critique that you are simply saying "famous people matter more." A small account on a monopoly platform has more standing than a large account on a niche platform. Make this dependency the core of the definition. If you do this, the tests survive because they target the *infrastructure's* obligation, not the *user's* size.

  2. **Displacement Test Operationalizability:** It is not operational *ex ante*. It is inherently retrospective. You cannot know if a rival service preserves standing until third parties (employers, journalists) treat it as authoritative.
      *   **Evidence Needed:** To apply this objectively, a third party would need metrics on: (a) Search engine indexing latency and permanence (does Google cache the profile?); (b) API accessibility for background check firms; (c) Citation frequency by legacy media.
      *   **Recommendation:** Acknowledge the lag. Frame the test not as a pre-clearance mechanism but as a burden of proof on the platform *after* the fact. If the platform bans you, they must demonstrate the alternative venue meets specific indexing standards (e.g., "must be crawlable by major search engines within 48 hours"). Without technical criteria, the test is purely sociological and unenforceable.

  3. **Second Objection (Procedure/Power):** You underweight the failure of the credit-reporting analogy. The FCRA (Fair Credit Reporting Act) is widely regarded as broken; dispute processes are automated, investigations are superficial, and corrections are rare. Using this as your model invites the objection that you are proposing a bureaucratic sham.
      *   **Better Analogy:** Occupational Licensing or Tenure. When a medical board revokes a license, there is a hearing, representation, and appeal. It is expensive and slow, but it is not a sham. It protects a *livelihood*, which is what you argue standing protects.
      *   **Recommendation:** Drop the credit analogy. It weakens your case. Switch to "Professional Licensure." This aligns better with your argument that standing is about being "attributable and citable" (i.e., professional existence). It also better handles the "cost" objection: we accept high procedural costs for doctors because the stakes (livelihood/public trust) are high.

  4. **Strongest Counterexample:** Imminent Physical Harm.
      *   **Case:** A user is coordinating a violent riot in real-time.
      *   **Analysis:** Both tests fail. There is no time for a "Sentence Test" (bounded sanction, reviewable decision), and the "Displacement Test" is irrelevant because the harm is immediate. Yet the removal is plainly legitimate.
      *   **Recommendation:** You need an emergency exception clause. Your framework implies *all* removals need procedure. Acknowledge that immediate threats to physical safety permit ex-post review rather than ex-ante procedure. Without this, your framework looks naive about safety teams' actual constraints.

  5. **Legal Background:**
      *   **State Action:** Safe. Private platforms are not state actors absent significant government coercion (*Manhattan Community Access Corp. v. Halleck*).
      *   **Common Carriage:** Risky. This is a legal term of art with specific statutory meanings (telecom, transport). Applying it to content is legally contested (*Miami Herald v. Tornillo* suggests editorial discretion is protected).
      *   **Credit Reporting:** Safe as an analogy, but as noted above, practically weak.
      *   **Recommendation:** Clarify that "Common Carriage" is being used normatively (a policy proposal), not descriptively (current law). Use the phrase "common carrier *regulation*" rather than implying they *are* common carriers. This avoids inviting immediate legal rebuttal from readers familiar with Section 230 case law.

  6. **The "Cancel Culture" Weakness:** It is not fatal, but it requires narrowing your framing claim. Currently, your title ("Against the Speech Frame") and intro imply you are solving the broader deplatforming debate. You are not. You are solving *Infrastructural Exile*.
      *   **Recommendation:** Narrow the scope explicitly. State that this framework addresses *institutional* removal from *indexing* platforms. Acknowledge that "distributed deplatforming" (mobs, employer pressure) is a separate phenomenon that often *uses* institutional removal as a lever.
      *   **Framing:** Position the essay as addressing the *gatekeepers of record*, not the mob. The mob screams; the platform decides. Your essay regulates the decision, not the scream. This preserves the essay's utility without overclaiming. If you try to solve the mob problem with procedural rules for Twitter, the essay will fail. If you solve the Twitter problem, you solve the part of the mob problem that relies on Twitter.
