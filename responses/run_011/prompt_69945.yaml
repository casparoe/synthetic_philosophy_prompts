answer: |-
  This agenda prioritizes ontological clarity and dimensionality over measurement precision. You cannot measure what you have not defined, and you cannot aggregate what is multidimensional. The ranking below reflects upstream dependency: if the lower-ranked items are settled while the higher-ranked ones remain ambiguous, the work is wasted.

  ### Ranking and Justification

  **1. Q1 (Shared-feel vs. Shared-job)**
  *   **Criteria:** Maximum upstream-ness.
  *   **Rationale:** This is the bottleneck for the entire project. If pleasure is unified by a common feel, heterogeneity is a fatal empirical claim against hedonism. If it is unified by a functional role (disposition to want continuation), heterogeneity is irrelevant. Settling this determines whether the workshop is doing phenomenology or functional analysis.
  *   **Trade-off:** High conceptual difficulty, but highly tractable for a philosopher/psychologist pair using experience sampling methods (ESM) to correlate reported tone with desire-for-continuation.
  *   **Trigger for Movement:** If an ESM study shows a strong dissociation between "liked" moments and "wanted again" moments, Q1 drops and Q3 (Attitudinal) rises.

  **2. Q4 (Painful pleasures)**
  *   **Criteria:** Critical threat to the calculus.
  *   **Rationale:** Even if Q1 is settled (pleasure is one thing), Q4 asks if *valence* is one thing. If "hurt" and "pleasure" can co-occur as independent dimensions (e.g., high arousal, negative valence, positive evaluation), the single-scale utilitarian calculus collapses. This is the second-most upstream metaphysical constraint.
  *   **Trade-off:** High neglectedness in philosophy, high activity in affective science. Philosophical analysis is needed to interpret the science normatively.
  *   **Trigger for Movement:** If affective science consensus solidifies around a circumplex model that separates valence from arousal completely, Q4 becomes settled fact and drops; if the "mixed emotions" debate remains unresolved, it stays high.

  **3. Q6 (The Background problem)**
  *   **Criteria:** Ecological validity / Data integrity.
  *   **Rationale:** If well-being is determined by diffuse baseline affect rather than salient episodes, then theories built on introspecting discrete pleasures (Q1/Q4) are measuring the wrong variable. This is the most tractable empirical deliverable for the postdoc.
  *   **Trade-off:** High tractability (diary methods), moderate upstream-ness (depends on Q1's definition of pleasure).
  *   **Trigger for Movement:** If longitudinal data shows baseline affect predicts life satisfaction better than peak episodes, Q6 moves to #1 priority for policy implications.

  **4. Q3 (The attitudinal escape)**
  *   **Criteria:** Rival theory clearance.
  *   **Rationale:** This is the main competitor to feeling-based hedonism. It must be addressed to clear the field, but it risks being a verbal dispute ("change of subject"). It is downstream of Q1 because you must first establish whether a feeling-based account is viable before retreating to attitudes.
  *   **Trade-off:** Low tractability (conceptual stalemate risk), high impact if settled.
  *   **Trigger for Movement:** If the workshop consensus is that "being pleased that" lacks normative force without a phenomenological component, Q3 drops.

  **5. Q5 (The metric)**
  *   **Criteria:** Downstream implementation.
  *   **Rationale:** Cardinal ranking and interpersonal comparison are impossible to solve without first solving Q1 (what are we ranking?) and Q4 (is it one dimension?). Funding this now is premature.
  *   **Trade-off:** Low tractability in 2 years, high downstream value.
  *   **Trigger for Movement:** If Q1 and Q4 are resolved in favor of a unitary, measurable feel, Q5 moves to #1 for the second funding cycle.

  **6. Q7 (Neuroscience anchor)**
  *   **Criteria:** Evidential support.
  *   **Rationale:** Important for grounding, but without imaging access, your team is limited to meta-analysis and interpretation. Deference to animal models is a philosophical stance, not an empirical deliverable.
  *   **Trade-off:** Low tractability (no lab), moderate upstream-ness (informs Q1/Q4).
  *   **Trigger for Movement:** If the postdoc has access to existing large-scale neuroimaging datasets (open science), Q7 moves up.

  **7. Q2 (Felt location)**
  *   **Criteria:** Cut.
  *   **Rationale:** Least impact on the aggregation problem. Whether pleasure is spatially localizable like pain is a phenomenological detail that does not determine metaphysical unity or normative weight.
  *   **Trade-off:** Low neglectedness, low downstream impact.

  ### Funding Recommendations

  **Fund:** **Q1 and Q4.**
  These are the foundational constraints. The workshop should focus on Q1 to establish a working definition of pleasure (Feel vs. Job) and Q4 to determine if that definition admits of a single scale. The postdoc should be tasked with Q6 (Baseline), as it provides the empirical backbone to test the theories generated in the workshop regarding Q1 and Q4.

  **Cut:** **Q2.**
  Remove this from the workshop program entirely. It consumes airtime without advancing the core goal of establishing a calculus for well-being.

  ### Pseudo-Problem Identification

  **Q2 (Felt location)** is the pseudo-problem.
  **False Presupposition:** That the spatial phenomenology of an experience (where it feels like it is located) tracks the metaphysical unity required for welfare aggregation. The disanalogy between pain (localizable) and pleasure (diffuse) is likely a feature of representational content (bodily damage vs. global state) rather than hedonic tone. Treating it as a core heterogeneity problem confuses *intentional object* with *hedonic quality*.

  ### Sensitivity and Concrete Results

  **Room Composition Sensitivity:**
  *   **Heavy Neuroscience:** If you fill the room with affective neuroscientists, **Q7** moves to #3, potentially overshadowing Q6.
  *   **Heavy Economics:** If you include welfare economists, **Q5** moves to #2, as they will resist theoretical work that doesn't lead to modeling.

  **Concrete Results (18 Months):**
  *   **Q1 Up:** A published operational definition of pleasure that correlates >0.8 with "desire for continuation" in ESM data.
  *   **Q1 Down:** Failure to find any common phenomenological marker across diverse pleasures despite rigorous probing.
  *   **Q4 Up:** A validated psychometric model showing distinct factors for "liking" and "wanting" that predict different welfare outcomes.
  *   **Q4 Down:** Consensus that "painful pleasures" are merely high-arousal positive valence states, not mixed valence.
  *   **Q6 Up:** Data demonstrating that baseline affect accounts for >50% of variance in life satisfaction ratings, rendering episode-based theories obsolete.

  Verdict: Q1>Q4>Q6>Q3>Q5>Q7>Q2
