  **HOGG & DAUGHTER REMOVALS**
  **STAFF HANDBOOK EXTRACT: SECTION 4 (INVENTORY PROTOCOL)**

  **4.1 Ontological Status of Goods**
  All clerks must adhere to the composition principles outlined in *The Vital Circular*. An Item is defined strictly as a single unit of Life. Inanimate aggregates do not compose. Consequently, a wardrobe is not an Item; it is a plurality of wood-simples arranged wardrobewise. A cat is an Item. A cat carrier is not. The Customer is an organism and is never classified as Goods.

  **4.2 The Schedule of Goods**
  When completing the Schedule, count only unified Lives. Inanimate objects are recorded as "Bulk Matter" by volume, not by unit.
  *   **Correct:** 1 Fern. 0 Pots.
  *   **Correct:** 1 Dog. 1 Lead (leather simples). 0 Basket.
  *   **Incorrect:** 1 Table. 4 Chairs.

  **Sample Entry:**
  *   *Living Room Aggregate:* 2.5 cubic metres.
  *   *Kitchen Aggregate:* 1.8 cubic metres.
  *   *Live Units:* 1 Cat, 12 Houseplants.
  *   **Total Billable Items:** 13.

  **4.3 Biological Hazards and Counting Errors**
  Be advised that microbial life constitutes Life. A refrigerator containing live-culture yoghurt requires individual enumeration of each pot if seals are intact. This is classified as a Grade 4 Administrative Burden. Do not accept bookings involving bulk fermentation without Supervisor approval. The "Yoghurt Run" of '09 remains a cautionary tale regarding overtime claims.

  **4.4 Borderline Life and Escalation**
  Certain aggregates occupy the threshold of Life. Do not attempt to resolve these ontologically. File Form B-12 (Borderline Vitality) and await Compliance.
  *   **Reportable Cases:** Slime mould in bathroom grouting; dormant seeds in loose soil; ant farms; legacy sourdough starters.
  *   **Protocol:** Treat as Bulk Matter until cleared. Do not inform the Customer that their starter is currently classified as non-living.

  **4.5 Seasonal Compliance**
  During the winter period, distinguish carefully between Cut *Picea abies* (Bulk Matter) and Potted *Picea abies* (1 Item). A cut tree is dead simples. A potted tree is Life. Misclassification results in immediate disciplinary action. Do not argue with Customers regarding the vitality of needles; refer to the root system.

  **4.6 Damage Claims and Scripted Responses**
  In the event of Customer complaint regarding broken furniture (e.g., "You smashed my table"), do not admit liability. Inanimate aggregates cannot be smashed, only rearranged. Use the following script verbatim:

  *"Our records confirm the simples arranged tablewise were arranged tablewise at collection. Upon arrival, these simples were arranged otherwise. No Item was damaged, as no Item exists. We apologize for the distress caused by the rearrangement."*

  Note: This script reliably escalates disputes. Have the Complaints Form ready.

  **4.7 Competitor Awareness**
  Be aware of rival methodologies. OmniMove Ltd lists every plurality whatever, including aggregates composed of a Customer's left shoe and their depot roof truss. Their invoices are mathematically infinite. Conversely, VoidTransit lists nothing. They eventually noted they possessed no vans, no staff, and no Customers. Hogg & Daughter occupies the vital middle ground. We move what matters.

  **4.8 Small Print**
  *It has been alleged that the difference between Hogg & Daughter, OmniMove, and VoidTransit is merely verbal, relying on divergent definitions of "composition" rather than factual discrepancies in the world. This is false. We deal in Life. The others deal in words. Dismiss such accusations as category errors.*

  ***

  Verdict: nihilism
