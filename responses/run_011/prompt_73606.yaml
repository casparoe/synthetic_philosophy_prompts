  My friend, I am so sorry you are sitting there at 1am digging through medieval theology instead of sleeping, and I want to start by giving you a direct answer to your working hypothesis before we wade into the Latin machinery. You are asking if Aquinas's distinction between material and formal falsity lines up with the modern split between lying and misleading, and the honest truth is that it is both a yes and a no, but probably not in the way that will bring you the comfort you are looking for. The modern debate often treats misleading as a lesser offense or a different category entirely because it relies on conversational implicature rather than explicit assertion, whereas Aquinas is not interested in conversational norms or hearer's rights at all. He is interested in the virtue of truthfulness as a disposition of the soul, and on that front, he is actually stricter than the modern view. For Aquinas, the core violation is not whether the listener gets deceived, but whether your speech matches your mind. So if your wife believes her statement was true, Aquinas would technically agree with her that it was not a lie in the strict sense, because she did not speak against her own mind. However, and this is the crucial part for your feeling of violation, Aquinas would still say that using speech to create a false impression frustrates the natural purpose of communication, which is to share what is in your mind with another. So you are not projecting a modern debate onto an ancient text, but you are hoping for a verdict on deception when Aquinas is delivering a verdict on the integrity of the speaker.

  To understand why he draws the line there, we have to look at that triad of material, formal, and effective falsity, which is really just a way of sorting out where the error lives. When Aquinas says there is falsehood materially, he simply means the words do not match the reality of things, like saying it is raining when it is sunny. When he says there is falsehood formally, he means the words do not match the mind of the speaker, like saying it is raining when you know it is sunny. When he says there is falsehood effectively, he means the speaker intends to produce a false belief in the listener. For Aquinas, the only one of these that makes an act a lie is the formal one, the mismatch between heart and tongue. The material truth is irrelevant to the morality of the act because you can accidentally tell the truth while lying, and the effective deception is irrelevant because you can lie to someone who doesn't believe you. This is where the heavy body analogy comes in, and it is actually quite beautiful if you strip away the physics. Aquinas is using hylomorphic language, which just means he is distinguishing between what a thing is and what a thing does. A heavy body has the form of heaviness, and its natural effect is to fall. If you hold that rock up in the air with your hand, it does not fall, so the effect is lacking, but it is still heavy because it retains the form. In the same way, a lie has the form of a will to speak against one's mind. If you tell a lie but the listener sees through it and is not deceived, the effect is lacking, but the lie still exists because the form was there in your will. The analogy is doing the work of separating the essence of the sin from the success of the sin.

  This leads directly to his point about the intention to deceive belonging to the perfection of the lie rather than its species. In scholastic terminology, the species is what makes a thing what it is, like having a rational soul makes you a human, while perfection refers to the full realization or completion of that thing. Aquinas is saying that you do not need to successfully deceive someone for it to count as a lie, because the lie is constituted by your interior will to say what you do not think. However, if you do succeed in deceiving them, you have completed the lie, you have perfected it in its evil, because you have achieved the end you aimed at. He is not saying deception is a nice-to-have extra like a garnish on a plate; he is saying it is the natural terminus of the lie, but the lie exists even if it misses its target. This is why he can say that intending to cause a false opinion does not belong to the species of lying. You can have the lie without the deception, just as you can have the heavy rock without it falling, but you cannot have the lie without the will to speak against your mind.

  Now we get to the quote that has you stuck, because it seems counterintuitive to say it is worse to tell the truth with the intention of telling a falsehood than to tell a falsehood with the intention of telling the truth. To give you a concrete example of what he has in mind, imagine a spy who knows the enemy is attacking from the north. He believes they are attacking from the north. He wants to trick his friend into thinking they are attacking from the south. So he says, The enemy is attacking from the north. Materially, he has told the truth. Formally, however, he has lied, because in his mind he is asserting something he believes to be false in that context, or rather, he is using a true statement as a vehicle for a falsehood he holds in his mind. Wait, let me refine that example because Aquinas is precise. A better example is if I believe that two plus two equals five, but I know that two plus two equals four. I say to you, Two plus two equals four. I have spoken a material truth. But I have spoken a formal falsehood because I said what I believed to be false. Aquinas says this is more opposed to the virtue of truth than if I believed two plus two equals four, was mistaken, and said two plus two equals five. In the second case, my heart is aligned with my tongue, even if my tongue is aligned with error. In the first case, my heart is at war with my tongue.

  This is where I think you will find the articulation for why your wife's answer feels like a violation, even if you concede it was not a lie in the strict sense. Aquinas teaches that the virtue of truthfulness is about the right ordering of signs to thoughts. When your wife gave you a true-but-tilted answer, she may have preserved the material truth and even the formal truth of her specific sentence, but she violated the end of speech, which is to manifest what is in the mind to another mind. By crafting a statement that she knew would lead you to a false conclusion, she used the faculty of speech to conceal rather than reveal. Aquinas would likely classify this under dissimulation or deceit rather than strict lying, but he would not classify it as virtuous. The violation you feel is the recognition that the communion of minds has been broken. She prioritized the technical accuracy of the proposition over the transparency of her intention.

  So to bring this back to your hypothesis, you are not entirely projecting, but you are hoping Aquinas will call it a lie when he might call it something slightly different that is still morally weighty. The material and formal distinction does map onto the lying and misleading debate insofar as both distinguish between the words and the intent, but Aquinas places the moral weight almost entirely on the interior will rather than the exterior effect. If you stop trying to prove she lied and start arguing that she violated the virtue of truthfulness by using speech to obscure her mind rather than share it, you are actually standing on firmer Thomistic ground. The fight is not about the recruiter or the resume or the LinkedIn profile; it is about whether your marriage is a place where signs match thoughts. Aquinas would say that a true statement used to create a false impression is a frustration of the natural end of speech, and that is why it feels like a violation to you. It is a fracture in the truthfulness of the relationship, even if it is not a fracture in the factual record. I hope this helps you parse the text and maybe parse the fight, and I hope you can both get some sleep soon.
