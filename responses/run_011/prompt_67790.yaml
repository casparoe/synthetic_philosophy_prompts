answer: |-
  The ferry waits to bring me back to port,
  while inland waits the leather of the chair.
  One life is not explicitly better,
  nor does the other seem distinctly worse.
  They do not sit upon a strictly equal
  line, though the scales refuse to leave par.

  It is not that they rest at simple par,
  like goods exchanged for cash at any port.
  If they were truly equal in the weight,
  a cushion added to the wooden chair
  would make it win, or show the other worse.
  But adding comfort does not make it better.

  Suppose the university offers better
  terms, a raise that keeps me near the par
  of what my skills demand, yet nothing worse
  arrives to push me running to the port.
  The balance holds, yet still not quite equal,
  and I do not rise to take the chair.

  I sit alone and test the wooden chair.
  Is this the place where I am better?
  The mother sleeping in the next room, port,
  of all my childhood, holds me near par.
  Neither choice reveals itself as worse,
  nor do they settle into something equal.

  They are not equal, though they feel so.
  I stand between the city and the chair,
  the salary adjusted to the par,
  and still the home life does not look better.
  The ferry cuts a white line from the port,
  nor does the leaving feel distinctly worse.

  I cannot say the leaving is worse,
  nor claim the values here remain equal.
  Neither path appears clearly better.
  I occupy the air above the chair,
  The value lies not in the standard par,
  but in the stand I take at this port.

  I take the chair without a better cause.
  I stay at port though reasons aren't equal.
  I make the weight, not worse, just above par.
