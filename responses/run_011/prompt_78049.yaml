      *   *Unconsciousness:* Coma vs. Delusion/Impaired Insight.
      *   *Blood Draw:* Lab test vs. Clinical Interview/Observation.
      *   *Timescale:* Hours vs. Days/Weeks/Months.
      *   *Bystander:* Family/EMS vs. Police/Family.
      *   *Missing:* The objective "meter reading" is the big missing piece on the psych side. The "universal prior consent" is also missing.

  4.  **Address Deliverable 2: Mapping Breaks:**
      *   *Break 1: The Metric.* DKA has a number (40 mg/dL). Psychosis has behavior (talking to walls). Is the behavior the *symptom* or the *refusal*? This touches on circularity (Conclusion 1).
      *   *Break 2: Capacity/Consciousness.* Unconscious = No capacity. Psychotic = Contested capacity. You can argue while psychotic. You can't argue while comatose. This touches on Coercion (Conclusion 2).
