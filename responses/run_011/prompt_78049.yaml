      *   The DKA analogy hides the interpretive leap. In DKA, the meter says 40. In Psych, the doctor says "Your refusal proves you're sick." That is the Szaszian critique core. I need to highlight this in the "Mapping Breaks."

  12. **Refining the Verdict on (3) (Stigma):**
