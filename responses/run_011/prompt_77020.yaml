answer: |-
  ### 1. Exam Question

  **Philosophy of Medicine: Take-Home Final**
  **Time Allocation:** 2 Hours
  **Word Limit:** 1200 words (±10%)

  **Case: The Biomarker T Protocol**

  A national screening program measures a silent biomarker, *T*, in asymptomatic 40-year-olds. High *T* produces no symptoms. Currently, "high *T*" is defined statistically: values outside the middle 95% of a regional reference population are flagged. A committee proposes shifting the threshold to the level where a cheap intervention measurably reduces later cardiovascular events. This new threshold lies well inside the current statistical "normal" range, instantly reclassifying many healthy people as abnormal.

  Two objections have arisen. First, *T* distributions are lower in women due to diet and blood loss. A committee member argues that setting a separate female reference range would "launder" a widespread mild deficiency into normality, suggesting the female average is depressed by value-laden social factors rather than biological design. Second, a philosopher on the committee (let's call her Priya) argues that "is high *T* a disease?" is a settled metaphysical question regarding species-typical efficiency, independent of thresholds. She claims the threshold is merely a policy knob turned by cost-effectiveness. Her opponent argues that if disease status is metaphysical, it cannot change simply because a drug was invented, yet the flag obviously does change. Priya replies that this conflates the ontology of disease with the decision rule for treatment.

  **Prompt:**

  Evaluate the committee's proposed shift from a statistical to an intervention-based threshold. Do not simply summarize naturalist and normativist theories. Instead, argue for what the committee's decision *commits* them to regarding the nature of disease. Specifically: (1) Does the intervention-based threshold make the existence of disease dependent on the existence of treatments? (2) Is the objection regarding female reference ranges an objection to statistical methodology or to the value-laden selection of reference classes? (3) Is Priya's distinction between the metaphysics of disease and the policy of threshold-setting sustainable in this context? Your answer must take a defensible position on whether the committee is defining a disease or merely managing a risk.

  ***

  ### 2. Model Answer

  The committee's proposal to shift the threshold for Biomarker *T* from a statistical distribution to an intervention-based cutoff is not merely a administrative adjustment; it is a substantive philosophical commitment to a pragmatist or normativist account of disease, effectively abandoning strict naturalism. By making the "abnormal" label contingent on the availability of a cost-effective intervention, the committee commits to the view that disease status is not an ontological fact waiting to be discovered, but a functional category defined by our capacity and willingness to act.

  First, the shift inevitably makes disease status dependent on the existence of treatments. Under a strict biostatistical account (like Boorse's), a condition is a disease if it reduces functional efficiency below species-typical levels, regardless of whether we can fix it. If high *T* reduces efficiency, it is a disease today, even without a drug. If it does not, it is not a disease, even if a drug is invented tomorrow. However, the committee's new rule defines "high *T*" as the point where intervention works. This implies that prior to the invention of the cheap intervention, those individuals were not "diseased" in the relevant clinical sense, even if their biology was identical. This validates the opponent's worry: the ontology of the condition shifts with the pharmacopeia. While Priya attempts to salvage naturalism by distinguishing the metaphysics (is it a dysfunction?) from the policy (where do we draw the line?), this distinction collapses in practice. If the diagnostic label is only applied when the line is crossed, and the line is drawn based on treatability, then for all medical and social purposes, the "disease" comes into existence only when the treatment exists. Priya's metaphysical safety net buys her nothing if the operational definition overrides it.

  Second, the objection regarding female reference ranges reveals that statistical accounts are never truly value-free. The committee member arguing against separate female ranges claims that using the actual female average "launders" a deficiency into normality. This is a potent critique of how reference classes are constructed in naturalist accounts. Boorse requires reference classes to be "natural" (e.g., age, sex). However, if the female population is uniformly depressed by social factors (diet, blood loss norms), then the statistical average is not a biological baseline but a historical artifact of inequality. To use the current female average as the "normal" range is to normalize the effects of social deprivation. Therefore, the objection is not to statistical methodology per se, but to the assumption that existing populations represent healthy design. A strict naturalist must argue that the "depressed" average is still the species-typical functioning for females in that environment. A normativist would argue that we should not call it "normal" if it reflects an unjust deprivation. The committee's silence on this implies they are prioritizing statistical convenience over biological idealization, further undermining the claim that they are tracking mind-independent disease facts.

  Finally, Priya's distinction between metaphysics and policy is unsustainable in screening contexts. She argues that disease is about efficiency, while thresholds are about cost. But in asymptomatic screening, there is no "disease" other than the risk flag. Without symptoms, the only evidence of "harm" (to use Wakefield's term) is the statistical correlation with future events that we have chosen to prevent. If we choose not to treat below a certain level due to cost, we are effectively saying the dysfunction below that level is not "harmful" enough to count. Harm is not intrinsic to the biology; it is relational to our resources. To say "it is a dysfunction, but not a disease" is to create a category that has no traction in the very system designed to identify it.

  In conclusion, the committee is not defining a disease; they are managing a risk. By tying the abnormal flag to intervention efficacy, they have adopted a normativist framework where disease is a reason for action, not a state of being. This is coherent for public health policy, which is inherently pragmatic. However, they cannot simultaneously claim to be identifying mind-independent biological facts. They must admit that high *T* is not a disease in the Boorsean sense, but a "candidate for intervention." Priya is wrong to think she can keep the metaphysics pure while turning the policy knob; in medicine, turning the knob *makes* the disease.

  ***

  ### 3. Marking Scheme (25 Marks)

  **1. Analysis of the Intervention Threshold (5 Marks)**
  *   **Must Hit:** Explicitly identifies that moving to an intervention-based threshold makes disease status contingent on treatment availability (pragmatism/normativism vs. naturalism).
  *   **Common Fumble:** Describes the change in threshold without noting the ontological implication that disease now depends on drug invention.

  **2. Evaluation of "Metaphysics vs. Policy" (5 Marks)**
  *   **Must Hit:** Critiques Priya's distinction, arguing that in screening/asymptomatic cases, the policy decision *constitutes* the disease status, making the separation unstable.
  *   **Common Fumble:** Accepts Priya's distinction as valid or simply restates it without evaluating its sustainability in the specific case.

  **3. The Reference Class/Sex Objection (5 Marks)**
  *   **Must Hit:** Explains that the female range objection targets the *selection* of the reference class (value-laden) rather than statistics itself, noting that "typical" may reflect deprivation.
  *   **Common Fumble:** Treats the sex difference as a purely biological statistical problem without addressing the "laundering deficiency" normative critique.

  **4. Commitment to Risk vs. Disease (5 Marks)**
  *   **Must Hit:** Concludes whether the committee is identifying a pre-existing disease or constructing a risk category, linking this back to the chosen theoretical commitment.
  *   **Common Fumble:** Hedges by saying "it's a bit of both" without arguing for what the committee's specific decision prioritizes.

  **5. Argumentative Cohesion (5 Marks)**
  *   **Must Hit:** The essay maintains a consistent thesis throughout (e.g., "The committee is implicitly a normativist") rather than listing pros and cons.
  *   **Common Fumble:** Writes a "survey" paper (Boorse says X, Wakefield says Y) without using those theories to evaluate the committee's specific moves.

  ***

  ### 4. "C-Grade" Sketches (Recycled Summaries)

  **Sketch 1: The Theory Parade**
  *   **What it does:** Spends 400 words defining Boorse's BST, 400 words defining Wakefield's HD, and 400 words defining Nordenfelt. It mentions Biomarker *T* only in the intro and conclusion.
  *   **Why it fails:** It answers "What are the theories of disease?" rather than "What does this committee's decision commit them to?" It treats the case as decoration for a course summary.

  **Sketch 2: The Hybrid Cop-Out**
  *   **What it does:** Argues that Boorse is right about biology, but Normativists are right about values, so the committee should use a "hybrid view." It concludes that the threshold should be "balanced."
  *   **Why it fails:** It explicitly avoids the prompt's requirement to argue what the *current proposal* commits them to. It prescribes a solution rather than analyzing the implications of the proposed shift.

  **Sketch 3: The Clinical Pragmatist**
  *   **What it does:** Focuses entirely on cost-effectiveness and public health outcomes. It argues the new threshold is good because it saves money and reduces CV events. It dismisses the metaphysical questions as "semantics."
  *   **Why it fails:** It ignores the philosophy of medicine component. It fails to engage with the "Priya" argument about ontology vs. policy, which is central to the prompt.

  **Sketch 4: The Priya Takeover**
  *   **What it does:** Defends Priya's position uncritically. It argues that disease *is* dysfunction and thresholds *are* just policy, repeating Priya's points from the prompt without addressing the opponent's counter-argument about drug invention.
  *   **Why it fails:** It treats the prompt's scenario as a fact to be reported rather than a problem to be solved. It fails to critique the sustainability of the metaphysics/policy distinction as required by the marking scheme.
