          *   **The Timebase Sorites:** If I slow down the replacement parts by 0.0001% each step, eventually the brain runs at 1% speed. Is consciousness lost? If yes, where? If no, then timebase doesn't matter (collapses to Functionalism).
          *   **Block Universe/Relativity:** "Same clock" is relativistically nonsensical. Simultaneity is frame-dependent. Update order is frame-dependent. This makes the view physically ill-defined.

