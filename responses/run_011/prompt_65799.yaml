      *   **Specific Concerns:** Timebase drift (smooth clock change), fission/spare parts, collapse worry (does the constraint do any work?), neuroscience evidence (rhythm/synchrony), sorites (how slow is slow enough?), incoherence of "same trajectory" given matter replacement.
