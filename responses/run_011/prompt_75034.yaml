      *   *Problem 2: Branching Event vs. Robustness.* If a small event causes a huge shift (sensitivity), how can the outcome be robust (stable)? This is the tension between the "critical juncture" (fragile moment) and "lock-in" (stable moment). The resolution lies in the mechanism changing over time: increasing returns make the initial choice stable later. The small event is the cause of the *direction*, not necessarily the sole sustainer.

