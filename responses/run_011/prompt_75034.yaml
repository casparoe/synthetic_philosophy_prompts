answer: |-
  Dear Colleague, I share your frustration with the casual invocation of path dependence, for when the term is used merely as a synonym for persistence, it ceases to explain anything and instead obscures the causal machinery of history. To assert that an outcome was locked in by its own history is to make a specific claim about the relationship between time, sequence, and causality, and for that claim to be intelligible rather than metaphorical, the manuscript must deliver three non-negotiable conditions. First, it must establish contingency, meaning that the outcome was not predetermined by initial conditions or functional necessities but depended on the timing and order of events. Second, it must specify a mechanism of reproduction, explaining why the outcome became self-reinforcing over time rather than simply decaying or reverting. Third, it must demonstrate that alternative paths were possible at the outset but became closed off later. These are requirements of logic rather than taste because without contingency the account is deterministic, without a reproduction mechanism it is merely descriptive, and without closed alternatives the history is irrelevant to the outcome. Beyond these essentials, there are distinctions that authors often blur which bind only particular schools of explanation. For instance, the claim that path-dependent outcomes are necessarily inefficient is a staple of the increasing-returns school but is not required for the concept to hold; an outcome can be locked in and still be optimal, provided it remains stable due to historical sequence rather than current optimality. Similarly, the precise dating of a critical juncture is often debated, but the necessity of identifying a period of heightened contingency is not.

  You must also insist that authors distinguish path dependence from mere hysteresis, durability, and slow drift, for conflating these concepts renders the argument unfalsifiable. Hysteresis describes a temporary persistence where a system does not immediately return to equilibrium after a shock is removed, but path dependence implies a structural change where the equilibrium itself has shifted; the requirement here is that the effect must outlast the temporary conditions that spawned it, otherwise you are observing dynamics rather than history. Durability is distinct because institutions can endure simply because they are efficient or because suppression is costly, whereas lock-in requires that switching costs increase over time specifically due to prior adoption; the case for this distinction is that without it, any stable equilibrium is mistakenly labeled path-dependent, stripping the term of its power to explain why suboptimal or specific forms survive. Finally, a critical juncture must be distinguished from slow drift because drift implies continuous adjustment to external pressures, whereas a juncture implies a branching point where structural constraints were loose enough to allow divergence; this is required because if change is always gradual, then sequence matters less than the cumulative weight of external forces, and the specific claim of history locking in a trajectory collapses.

  Regarding the two problems you cannot settle, I offer the following positions based on the logical structure of causal inference in historical analysis. On the question of distinguishing genuine lock-in from the rival thesis of functional convergence, the evidence must show institutional specificity rather than functional equivalence. If multiple routes converge on a functionally equivalent outcome, then history is irrelevant to the final state, and the claim of path dependence fails. To defeat this rival thesis, an author must demonstrate that the specific institutional form matters for subsequent outcomes, or that alternative paths would have yielded structurally different results even if they solved the same immediate problem. This is not a matter of taste but of counterfactual validity; if the outcome is functionally determined, the historical path is epiphenomenal. On the second problem, the demand that a branching event be identified is entirely compatible with the demand that the outcome be robust once reached, provided the author recognizes that the causal mechanism changes over time. During the critical juncture, the system is highly sensitive to small events, but once the trajectory is selected, increasing returns or feedback loops generate robustness. The small event is properly called the cause of the direction, not the sustainer of the position, and conflating the fragility of the choice moment with the stability of the outcome moment is an error of temporal aggregation rather than a logical contradiction.

  In sum, while many requirements help sharpen the argument, the single requirement that does the most to eliminate candidate accounts is the rigorous specification of the counterfactual contingency at the critical juncture. Without a plausible account of how things could have been otherwise, any claim that history locked in the outcome is merely a post hoc narrative of inevitability.
