  ### 5. The Honest Conclusion

  If the honest conclusion is that no verdict is available without giving something up, here is what must go:

  **The Concession:**
  Your director must abandon the claim that **the Orwellian/Stalinesque distinction is a mutually exclusive partition of temporal illusions.**

  **Why:**
