      *   (2) *Critical Awareness:* Inherited language isn't innocent. Transmitting without comment reproduces power structures.
      *   (3) *Transcription:* Transcribe original titles/labels as is (including slurs), flag as transcribed. No bowdlerizing.
      *   (4) *Absence/Silence:* Register gaps/absence. Explain why people don't appear.
      *   (5) *Community Authority:* Identifiable existing communities have authority over terms used for them.
      *   (6) *Provenance/Original Order:* Do not re-sort files. Do not build synthetic collections.
      *   (7) *Stability/Infrastructure:* Persistent identifiers. Rarely change substantive claims. Version history for superseded wording.

  3.  **Identify Tensions (Brainstorming):**
