      *   *2 vs. 3:* Critical Awareness vs. Transcription. If language isn't innocent (2), does simply transcribing it (3) without *more* comment reproduce the viewpoint? Principle 3 says "flag it as transcribed," but is that enough commentary to satisfy 2?
      *   *3 vs. 5:* Transcription vs. Community Authority. If the record says "Colored" (transcribe per 3) but the community says "Black" or "African American" (authority per 5), which wins in the description?
      *   *4 vs. 6:* Absence vs. Provenance. To explain absence (4), do I need to rearrange or synthesize (violating 6)? Or does 6 prevent me from gathering evidence across fonds to explain the gap?
      *   *5 vs. 6:* Community Authority vs. Provenance. If a community wants materials from different fonds grouped (synthetic collection) to tell their story, 6 says no.
      *   *5 vs. 7:* Community Authority vs. Stability. If community terminology changes, do we update descriptions (violating 7's stability)?
      *   *1 vs. 5:* Neutrality vs. Community Authority. Adopting specific community terms might be seen as taking a political stance (violating 1's "researcher of any politics").
      *   *The Infirmary Case:* Numbered inmates, racial column, no names.
