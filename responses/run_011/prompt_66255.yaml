answer: |-
  ### Audit of Descriptive Principles

  Your intuition is correct: you have a list of commitments, not yet a position. Seven principles cannot all be sovereign; some must govern others. The infirmary registers will break this set if you do not resolve the hierarchy now. Below is the audit of tensions, ranked by severity, followed by the infirmary test, the single revision for coherence, and my own uncertainty.

  #### Tension 1: Neutrality (1) vs. Critical Awareness (2), Absence (4), and Community Authority (5)
  *   **Severity:** Critical.
  *   **The Conflict:** Principle (1) demands you describe "what a record is and what it says, not what it means," aiming for a tone any politics can rely on. Principles (2), (4), and (5) require you to interpret power dynamics, explain silences, and adopt specific community standpoints. You cannot explain *why* a gap exists (4) or acknowledge that language "was chosen by people who had standing to name others" (2) without making claims about what the record *means* in a social context.
  *   **What Has to Give:** Principle (1) must yield. You cannot maintain the fiction that description is devoid of interpretation while simultaneously committing to critical and community-based interventions.
  *   **The Cost:** You lose the shield of the "neutral arbiter." Researchers who believe archives should be politically inert will challenge your scope notes as "activist." You must accept that describing power structures is a substantive claim, not a neutral observation.
  *   **Infirmary Impact:** High. If (1) holds, the register is described as "Admission Register, 1868–1929" with a column transcribed as "Race." If (1) yields to (2) and (4), the description must note that the numbering system and racial column reflect an administrative erasure of identity. Without yielding (1), you cannot ethically describe the numbered inmates.
  *   **Confidence:** High. This is a structural contradiction, not a phrasing artifact. "What it says" and "who had standing to name" are different epistemological categories.

  #### Tension 2: Transcription (3) vs. Community Authority (5)
  *   **Severity:** High.
  *   **The Conflict:** Principle (3) requires transcribing original labels including slurs without bowdlerizing. Principle (5) grants existing communities authority over the terms used for them. If the infirmary register header is a racial slur, (3) says transcribe it; (5) says the community may forbid that term's use in your repository's voice.
  *   **What Has to Give:** Principle (3) must be limited to the *transcription field* only. Principle (5) must govern the *access points and summary description*.
  *   **The Cost:** Descriptive complexity. You will maintain two versions of the truth in one record: the creator's vocabulary (preserved for evidence) and the community's vocabulary (used for discovery). This requires more cataloging fields and clearer display logic to ensure users do not confuse the archivist's voice with the creator's.
  *   **Infirmary Impact:** Medium. The column header must be transcribed exactly (3), but the subject heading for the collection must use the term the descendant community prefers (5). If you conflate the two, you violate one principle.
  *   **Confidence:** High. This is a standard workflow conflict in modern archives, but your principles state them as absolute equals, which creates a deadlock.

  #### Tension 3: Provenance (6) vs. Absence (4)
  *   **Severity:** Medium.
  *   **The Conflict:** Principle (6) forbids building synthetic collections or re-sorting files to match present-day constituencies. Principle (4) requires you to "give the best available account of why [a gap] is there." Often, the explanation for a silence in one fonds (the infirmary) exists in another (the County Commissioners' minutes or Superintendent's reports). Strict adherence to (6) might prevent you from linking these records tightly enough to explain the silence.
  *   **What Has to Give:** Principle (6) must allow for *descriptive linkage* without *physical rearrangement*. You can keep the files separate but write the scope note for the infirmary records using evidence from the Commissioners' fonds.
  *   **The Cost:** Labor. It is faster to describe the infirmary in isolation. Explaining the absence requires cross-fonds research. If (6) is interpreted rigidly as "describe only what is in this box," (4) becomes impossible.
  *   **Infirmary Impact:** High. The "why" of the numbering system is likely not in the register itself but in the Superintendent's reports mentioned in your prompt. If (6) stops you from integrating that context into the infirmary description, you fail (4).
  *   **Confidence:** Medium. This may be a phrasing artifact. If "Arrangement" (6) is distinguished from "Description" (4), the tension dissolves. However, your draft says "Description... entries carry persistent identifiers," implying the description is bound to the arranged unit.

  ---

  ### The Infirmary Test
  **Can these principles deliver a description of the people who appear as numbers?**

  **No, not as currently written.**

  Principle (1) is the failure point. If you describe "what it says" (a number, a racial category) but not "what it means" (dehumanization, administrative erasure), you reproduce the register's logic. You will have described the *container* of the silence, but not the *silence* itself.

  To describe these people ethically, you must violate the strict neutrality of (1). You must write: *"These individuals are identified only by number; names were not recorded for those categorized in the 'Race' column."* That is a claim about meaning and absence, not just a transcription of content. It satisfies (2), (3), (4), and (5), but it contradicts the prohibition in (1) against describing "what it means."

  ---

  ### Single Revision for Coherence

  **Revision:** Rewrite Principle (1).
  **Current:** "The catalog entry should say what a record is and what it says, not what it means... neutral tone... interpretation left to the scholarship."
  **Proposed:** "The catalog entry must distinguish between the record's content and the context of its creation. We describe the physical and intellectual structure factually, but we acknowledge that creator language and archival silences carry historical meaning that requires explanation."

  **What You Gain:**
  This aligns (1) with (2) and (4). It allows you to describe the infirmary numbers as an *act of erasure* rather than just *data*. It turns your list into a position: **Archival description is an act of contextualization, not just transcription.** It resolves the "list vs. position" anxiety by making critical awareness the baseline, not an add-on.

  **What You Lose:**
  You lose the claim to universal neutrality. You cannot tell the board that "a researcher of any politics can rely on" the description to be free of perspective. The perspective is now explicitly *critical*. You must be prepared to defend why "explanation" is part of description. This may invite scrutiny from donors or board members who prefer the "neutral" model.

  ---

  ### Auditor's Uncertainty

  **Claim:** I am least sure that **Principle (6) (Provenance) necessarily conflicts with Principle (4) (Absence).**

  **Reasoning:** I have ranked this as a Medium tension, but it is possible that "Arrangement follows provenance" does not preclude "Description explains gaps using external evidence." Standard archival theory (DACS/RDA) allows for scope notes that reference related materials outside the fonds without violating original order. The conflict may exist only if your repository interprets "Description" as being strictly bound to the physical boundaries of the "Arrangement."

  **Consideration to Settle It:** Review your current finding aid templates. If the "Scope and Content" note allows citations to records outside the specific collection being described, the tension is a phrasing artifact and can be resolved by clarifying (6) to read "Physical arrangement follows provenance; descriptive context may cross fonds." If your system hard-links description to the specific accession number without allowing external references, the tension is real and requires a system change.
