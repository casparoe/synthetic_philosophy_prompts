          *   *Verdict:* This is a phrasing artifact in (1). "Neutral tone" doesn't mean "uncritical." It means "factual." But (1) says "not what it means." (2) says "language... chosen by people who had standing." Explaining *why* the language was chosen is interpreting "what it means."
