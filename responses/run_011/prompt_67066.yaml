          8.  Describe concrete changes needed to track chosen/unchosen disadvantage and identify limits.
          9.  **Constraint:** Be explicit about settled vs. contested issues in the literature. Do not provide a bibliography. Avoid strawmanning.

  2.  **Deconstruct the Scenario:**
      *   **Track 1 (Workers' Comp):** No-fault, employer-financed, causal link to employment required, ignores worker wealth/carelessness (mostly), excludes intoxication/self-harm.
      *   **Track 2 (General Disability/Welfare):** Means-tested, functional capacity focused, behavioral conditions (work search, drug tests), ignores *cause* of disability (mostly).
      *   **Friend's View:** Division of Moral Labour. Responsibility is asked *elsewhere* (tort, insurance, criminal law). Benefits agency ignores cause because it's already settled. Exceptions (drug tests) are where the division fails.
      *   **User's View:** Status/Participation View. Entitlement is about capacity to participate. Responsibility is downstream/administrative (caseload management), not theoretical.
      *   **Core Tension:** Does the system care about responsibility (fault/choice) or need/status? Why the split?

  3.  **Brainstorming Candidate Reconstructions (Requirement 1):**
      *   *Candidate 1: The Friend's "Division of Moral Labour."* (Responsibility is allocated institutionally).
      *   *Candidate 2: The User's "Status/Participation."* (Entitlement based on capacity to function, responsibility is administrative control).
      *   *Candidate 3: "Contractual Reciprocity vs. Social Solidarity."* Workers' Comp is deferred wage/insurance premium (contractual); Welfare is social safety net (solidarity). Different moral bases entirely.
      *   *Candidate 4: "Political Settlement/Path Dependence."* No unified theory. It's a historical accretion of labor power (Unions fought for WC) vs. Poor Law legacy (Welfare). The "theory" is just compromise.

  4.  **Selecting the Best Reconstruction (Requirement 2 & 6):**
      *   Need to weigh normative coherence against historical reality.
      *   The "Contractual vs. Solidarity" split (Candidate 3) seems to explain the *funding* and *eligibility* differences better than pure justice theories. WC is essentially delayed wages/price of labor. Welfare is citizenship-based need.
      *   However, the prompt asks for a theory of *distributive justice*.
      *   Let's refine Candidate 3 into a "Dual-Base Theory": One track is *Corrective/Insurance Justice* (WC), the other is *Sufficientarian/Social Justice* (Welfare).
      *   *Decision:* The "Dual-Base" theory (Contractual/Insurance vs. Sufficientarian) is the strongest fit for the *practice*, even if it lacks philosophical unity.

  5.  **Addressing Specific Questions:**

      *   **Implicit Theory (Requirement 1 & 2):**
          *   *Necessary:* The distinction between "economic risk of production" (WC) and "social risk of life" (Welfare).
          *   *Contingent:* The specific behavioral conditions (could be different).
          *   *Ruled Out:* Strict Luck Egalitarianism (which would demand a unified inquiry into option/brute luck across both tracks).
          *   *Justice vs. Risk:* It's a hybrid. WC is priced risk. Welfare is justice (of a sort).

      *   **Adjudication (Friend vs. User) (Requirement 3):**
          *   Friend: Too rationalistic. Assumes a coherent design where there might be none. But captures the *legal* separation well.
          *   User: More cynical/realist. Captures the *administrative* reality (conditionality as control).
          *   Third Option: "Historical Institutionalism." The system isn't designed; it grew. Unions won WC as a trade-off (no sue for guaranteed pay). Welfare grew from Poor Laws. The incoherence is historical, not philosophical.
          *   *Verdict:* The User is closer to the *administrative reality*, but the Friend is closer to the *legal formalism*. A synthesis is needed: It's a "Historical Compromise" that *functions* like a Division of Labour but *operates* like Status Management.

      *   **Internal Coherence (Requirement 4):**
          *   Can you ignore cause but police conduct? Yes, if the goal is *future capacity* not *past blame*. Conditionality is forward-looking (getting you back to work), not backward-looking (punishing you for being hurt).
          *   *Tension:* Drug testing implies backward-looking moral judgment. This creates incoherence.

      *   **Rebuilding for Choice/Chance (Requirement 5):**
          *   *Changes:* Unified intake. Deep investigation into *how* injury happened (not just where). Subjective inquiry into risk-taking.
          *   *Limits:* Epistemic (hard to prove choice), Administrative (expensive, slow), Moral (paternalistic, intrusive).

      *   **Settled vs. Contested (Constraint):**
          *   *Settled:* Luck egalitarianism struggles with administrative implementation.
          *   *Contested:* Whether WC is "justice" or "price." Whether conditionality is rehabilitative or punitive.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Philosophical, rigorous, empathetic to both sides, grounded in administrative reality.
      *   *Structure:* Follow the prompt's five main requests, ensuring the brainstorming happens first.
      *   *Check:* Did I include 3-4 reconstructions? Yes. Did I avoid bibliography? Yes. Did I address the "strawman" risk? Yes.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Luck Egalitarianism is ruled out." I need to explain *why* the current practice violates the brute/option luck distinction (e.g., WC pays for careless workers, Welfare denies careless workers).
      *(Refining the "Third Reconstruction")*: The "Historical/Political Settlement" view is crucial. It explains the *incoherence* better than a normative theory. I should present this as the "Realist" reconstruction.
      *(Refining the "Verdict")*: I shouldn't just pick one. I should argue that the *practice* is a palimpsest. But if forced to choose the *implicit normative logic* that sustains it, it's the "Dual-Base" (Insurance vs. Assistance).

      *(Addressing the "Settled vs. Contested" constraint)*: I need to explicitly flag where political philosophers agree (e.g., Luck Egalitarianism is hard to administer) vs. where they fight (e.g., Is WC a right or a price?).

      *(Final Polish)*: Ensure the distinction between "cannot do without" (structural necessity) and "fits comfortably" (contingent feature) is sharp.

  7.  **Final Review against constraints:**
      *   3-4 reconstructions? Yes.
      *   Select best? Yes.
      *   Necessary vs. Contingent? Yes.
      *   Rival views (Luck Egalitarianism)? Yes.
