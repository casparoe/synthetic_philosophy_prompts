          4.  Identify rival views ruled out (specifically brute-luck/option-luck distinction).
          5.  Determine if it's distributive justice or priced risk transfer.
          6.  Adjudicate between Friend's "Division of Moral Labour" vs. User's "Status/Participation" view (or propose a third).
