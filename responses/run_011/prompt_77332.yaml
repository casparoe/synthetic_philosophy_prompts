answer: |-
  ### Ontological Commitments and Rival Views

  The practice of exploratory factor analysis (EFA) in personality psychology strictly presupposes a **causal realist** ontology regarding latent factors. Although the mathematical model is compatible with multiple interpretations, the standard application treats factors as mind-independent common causes that generate the observed correlations among items. This is evident in the language of "discovery," the expectation that factors correspond to biological or developmental mechanisms, and the treatment of replication as evidence of existence rather than mere stability of a statistical procedure.

  By committing to the common cause model ($X = LF + E$), the practice quietly rules out rival ontologies that are mathematically compatible with the data but metaphysically distinct. Most notably, it excludes **network models**, where items mutually reinforce one another without a underlying latent cause (e.g., insomnia causes fatigue causes worry, rather than all three being caused by "neuroticism"). It also excludes **pure conventionalism** in its operational phase; while the rotation step is conventional, the subsequent validation and usage treat the rotated factors as fixed entities waiting to be found. The practice assumes that the "true" rotation is the one that aligns with the causal structure of the mind, not merely the one that is mathematically simplest.

  ### The Status of the Simplicity Criterion

  The simplicity criterion (e.g., Varimax rotation) functions within the practice as a **substantive claim about the modularity of psychological causes**, not merely as a methodological convenience. Practitioners invoke Thurstone's simple structure not just because it is computationally tractable, but because they assume nature is parsimonious—that psychological causes are relatively independent and modular. If the truth were that psychological causes overlap densely and interact complexly, the simplicity criterion would systematically distort the structure rather than reveal it.

  Therefore, the use of simplicity presupposes that the architecture of the mind mirrors the mathematical convenience of orthogonal or simple oblique axes. This is a realist wager: it assumes that the way we carve the statistical space corresponds to the way causal powers are distributed in the world. If this wager fails, the factors are not "real" traits but artifacts of a preference for diagonal matrices.

  ### Underdetermination and External Validation

  The practice is philosophically underdetermined at the stage of rotation. As your friend correctly notes, the correlation matrix alone cannot select a unique set of factors. However, your objection regarding external criteria is the decisive adjudication point. The practice resolves this underdetermination not by admitting convention, but by appealing to **nomological networks**. When a specific rotation predicts job performance, heritability, or developmental trajectories better than a rival rotation, practitioners treat this as empirical evidence that the chosen rotation is "truer."

  This move transforms the status of the factors from mathematically equivalent descriptions to empirically distinct hypotheses. By relying on external validation to fix the meaning of the factors, the practice rejects the Poincaréan analogy. In geometry, rival systems are empirically equivalent by definition; in EFA, rival rotations are *not* equivalent with respect to external criteria. Consequently, the practice presupposes that there is a fact of the matter about which rotation is correct, determined by its causal efficacy outside the questionnaire. This is a realist resolution to the underdetermination problem.

  ### The Ethical Stakes of Scoring

  The use of factor scores for high-stakes decision-making (hiring, clinical diagnosis) raises the presuppositional stakes above those of pure measurement. You cannot ethically disadvantage an individual based on a coordinate system chosen for convenience. If the factors were merely conventional bookkeeping devices, using them to deny employment would be akin to denying someone a job based on their position in a arbitrarily rotated coordinate system of physical space.

  To justify these decisions, the practice must presuppose that the score measures a **property of the person**, not a property of the model. This requires the factors to be mind-independent traits that exist prior to and independent of the measurement act. A conventionalist account cannot underwrite selection practice because conventions are agreements among researchers, not properties of applicants. Therefore, the decision-making utility of EFA forces the practice into a realist corner; it must claim to measure real differences to justify real consequences.

  ### Implications of Adopting Open Conventionalism

  If the field adopted your friend's conventionalism openly, the practice would undergo a radical transformation that would likely undermine its current applications.
  1.  **Reporting:** Scores would be described as "indices" or "coordinates" relative to a specific conventional model, not as estimates of a latent trait magnitude.
  2.  **Replication:** Replication would no longer count as evidence of discovery ("We found Extraversion again") but as evidence of stable convention ("Our community agrees on this rotation again").
  3.  **Decision-Making:** High-stakes individual decisions would become ethically untenable. One could not justify rejecting an applicant based on a "Conscientiousness score" if Conscientiousness is admitted to be a coordinate choice rather than a causal power. The field would be forced to retreat to aggregate prediction (e.g., "this model predicts group performance") rather than individual assessment.

  ### Conclusion

  The practice of EFA in personality psychology is mathematically compatible with conventionalism but operationally committed to realism. It relies on the assumption that simple structure tracks causal modularity, that external validation selects the true rotation, and that scores measure personal properties. While your friend is mathematically correct about indeterminacy, he is practically wrong about the ontology required to sustain the field's applications. Your objection regarding external criteria and decision-making stakes correctly identifies that the practice cannot function as it does without presupposing the reality of the factors.

  Verdict: REALIST
