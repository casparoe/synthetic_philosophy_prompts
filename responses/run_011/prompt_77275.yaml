  ### (a) Three Decision Rules

  To reconstruct the decision procedure, I have analysed the ledger for consistency. The splits (Entry 8), abstentions (Entry 10), and warnings (Entry 11) are the critical constraints. Below are three distinct rules that fit every recorded entry, including the dissenting opinions.

  **Rule 1: The Causal Hierarchy Rule**
  *   **Definition:** This rule classifies explanations based on the *ontological level* of the entities invoked relative to the phenomenon being explained.
  *   **Procedure:**
      1.  Identify the phenomenon to be explained (e.g., flight, grammar, arrow of time).
      2.  Identify the explanatory base (e.g., neurology, linguistic parameters, low-entropy state).
      3.  If the base belongs to a level of organization that is strictly *lower* or *prior* in the causal chain (e.g., physics explains biology, code explains behaviour), label **Crane**.
