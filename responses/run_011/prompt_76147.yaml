answer: |-
  Your hunch is correct. The slogan is a philosophical Swiss Army knife that your friend is using as a screwdriver. It conflates distinct problems to make a normative conclusion look like a metaphysical necessity.

  Here is the menu of distinct claims hidden in "you can't cause anything by doing nothing," evaluated for truth, interest, and utility for his argument.

  ### 1. The Menu of Claims

  **A. The Metaphysical Claim (The "Physics" Reading)**
  *   **The Claim:** Causation requires energy transfer or physical force. "Nothing" is the absence of a thing/event. Therefore, an absence cannot physically push, pull, or transfer energy to an effect.
  *   **Truth Value:** Plausible within a strict physicalist framework, but controversial in modern metaphysics (many accept counterfactual theories of causation where omissions count).
  *   **Interest:** High for physicists and metaphysicians; low for lawyers.
  *   **Does it get him the conclusion?** **No.** The law does not adopt a physics definition of causation. Legal causation is a normative tool for imputing responsibility, not a description of kinetic energy. If the law accepted this, a doctor who turns off a life-support machine (a positive act) would be liable, but a doctor who never turns it on (an omission) would not, even if the outcome is identical. The law often treats them similarly. This claim is too blunt for legal doctrine.

  **B. The Semantic Claim (The "Shorthand" Reading)**
  *   **The Claim:** Sentences like "His not watering caused the death" are not literal causal reports. They are shorthand for counterfactuals: "If he had watered, the plant would not have died."
  *   **Truth Value:** **True.** This is the standard philosophical analysis of omission causation.
  *   **Interest:** Moderate. It clarifies what we are talking about.
  *   **Does it get him the conclusion?** **No. It destroys his argument.** If omission claims are just counterfactuals, then the passerby *did* cause the death in the relevant sense. If the passerby had thrown the rope, the child would not have died. The counterfactual dependence holds. If legal causation relies on counterfactual dependence (the "but-for" test), the passerby is a cause. This reading admits the causal hook exists; it just redefines it.

  **C. The Normative Claim (The "Liberty" Reading)**
  *   **The Claim:** We should not treat omissions as grounds for liability because doing so infringes on individual liberty or imposes excessive burdens.
  *   **Truth Value:** Not truth-apt (it's a policy preference), but the *concern* is valid.
  *   **Interest:** **High.** This is the actual justification for the no-duty-to-rescue rule.
  *   **Does it get him the conclusion?** **Yes.** But notice: this claim doesn't need the word "cause" at all. It admits causation might exist but denies *liability*. By using the slogan, your friend is trying to dress this policy preference up as a metaphysical fact to make it seem unavoidable.

  **Verdict on your Hunch:**
  *   **Unobjectionable but Useless:** The Metaphysical Claim. Even if true (physics requires force), law doesn't care.
  *   **Exactly what he needs but doesn't hold up:** The idea that because it's not a *physical* cause, it can't be a *legal* cause. This is false. Law recognizes omissions as causal bases for liability constantly (e.g., parental neglect, medical malpractice by non-treatment).

  ---

  ### 2. The Plant Problem (Promiscuous Causation)

  Your friend's worry: If omissions are causes, then *everyone* who didn't water the plants caused them to die (you, the King, the neighbors). This makes causation "promiscuous" (too widespread to be useful).

  **How the slogan tries to fix it:**
  It tries to solve promiscuity by denying causation entirely. "Since the King didn't cause it and you didn't cause it (because nothing causes nothing), we don't have to worry about distinguishing you."

  **Why that fails:**
  The promiscuity problem is real, but the solution is not to deny causation; it is to distinguish **Causal Existence** from **Causal Selection**.
  *   **Causal Existence:** Did the absence of water contribute to the death? Yes. Both your omission and the King's omission are *causes* in the counterfactual sense.
  *   **Causal Selection:** Which cause do we pick out for blame? We pick yours because you had a **duty**.

  **The Verdict:**
  The slogan tries to block promiscuity at the metaphysical stage. It should be blocked at the normative stage.
  *   **Readings that survive the plant case:** The Semantic Claim. Yes, both you and the King are causes (counterfactually). That's fine. We don't sue the King because he had no duty, not because he wasn't a cause.
  *   **Readings that fail:** The Metaphysical Claim. If you say "I didn't cause it," you can't explain why you are liable for breach of contract. You *did* cause the loss in the eyes of the law, because you breached a duty to prevent it.

  **Takeaway for your friend:** Admit the King is a cause. It doesn't matter. Liability isn't about being the *only* cause; it's about being the *responsible* cause.

  ---

  ### 3. Absence vs. Omission & Double Prevention

  **Absence of Water vs. My Not Watering**
  *   **Distinction:** "Absence of water" is a state of the world. "My not watering" is an agent-relative description.
  *   **Does it matter?** Yes. The law cares about the agent-relative description.
  *   **Why:** If we say "The absence of water caused the death," we are describing a mechanism. If we say "My not watering caused the death," we are implicating an agent.
  *   **Slogan Check:** If your friend means "Absences can't cause things," he is talking about physics (water molecules were missing). If he means "Agents can't cause things by not acting," he is talking about agency.
  *   **Verdict:** He needs the agent-relative version to talk about liability. But the agent-relative version is vulnerable to the counterfactual analysis (if I had acted, it would be different). The "absence" version is safer for him metaphysically but irrelevant to law.

  **Double Prevention**
  *   **The Case:** A threat is underway (child drowning). Rescue prevents the threat. Not rescuing is "not preventing the threat." This is double prevention (I don't stop the process that stops the child).
  *   **Does the slogan cover it?** Yes. "Doing nothing" covers not intervening in an existing causal chain.
  *   **Should it?** This is the crux. In double prevention cases, the passerby is not *initiating* harm; they are *allowing* it.
  *   **The Trap:** Your friend wants to say "Allowing isn't Causing."
  *   **The Counter:** In law, allowing harm when you have the capacity and duty to stop it is often treated as causally equivalent to initiating it.
  *   **Verdict:** The slogan glosses over the double-prevention structure. If he admits it's double prevention, he admits there is a causal chain he could have interrupted. The "cause" of the death is the water entering the lungs; the passerby's omission is the failure to interrupt that cause. The slogan tries to deny the interruption counts. It doesn't hold.

  ---

  ### 4. Does he need the causal claim at all?

  **No.** And this is your strongest point for next week.

  The no-duty-to-rescue rule is not based on causation; it is based on **Liberty**.
  *   **The Argument:** We value individual autonomy. Compelling a stranger to act imposes a burden on their liberty. Therefore, unless there is a special relationship (parent/child, contract), we impose no duty.
  *   **The Role of the Slogan:** The slogan is a smokescreen. It tries to make the liberty argument look like a fact of nature. It suggests we *can't* hold the passerby liable because there is no causal hook.
  *   **The Reality:** We *could* hold them liable (many civil law jurisdictions do). The causal hook (counterfactual dependence) is there. We choose not to for policy reasons.

  **Summary for your Reading Group:**
  1.  **Metaphysically:** The slogan is dubious (omissions are causes in counterfactual theories).
  2.  **Semantically:** The slogan is true (it's counterfactual shorthand), but that makes the passerby a cause, undermining his argument.
  3.  **Normatively:** The slogan is unnecessary. The no-duty rule is about protecting liberty, not defining causation.
  4.  **Promiscuity:** Solved by Duty, not by denying Causation. The King caused it too; we just don't sue him.
  5.  **Double Prevention:** The passerby failed to interrupt a causal chain. That is a form of causal involvement the law *can* recognize if it chooses.

  **The Kill Shot:**
  Tell him: "If 'doing nothing' can't cause anything, then a doctor who unplugs a ventilator (act) is liable, but a doctor who refuses to plug it in initially (omission) is not, even if the patient dies in both cases. Since the law sometimes treats these the same, your slogan isn't a limit on causation; it's a policy preference for liberty disguised as metaphysics. Just argue for liberty; don't hide behind physics."
