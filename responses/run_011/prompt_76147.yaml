      *   *Analysis:* Causation is one thing; *Responsibility* is another. The "promiscuity" shows that causation is widespread (both are but-for causes), but duty limits liability.
      *   *Slogan's Role:* The slogan tries to solve this by denying causation. But the better solution is admitting causation but denying duty.
