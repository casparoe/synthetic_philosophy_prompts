answer: |-
  Your seminar mate is wrong. Aquinas did not endorse tyrannicide "full stop." He tolerated it as a last resort under very specific conditions, but he generally warned against it because removing a tyrant often leads to greater instability or a worse tyrant. He prioritizes the *common good* and *order* over the removal of a bad actor if the removal itself destroys order.

  Here is how Aquinas would analyze your specific case using his categories, followed by where his framework breaks down.

  ### 1. Is this Tyranny? (Title vs. Exercise)
  Aquinas distinguishes between a **tyrant by usurpation** (no legitimate title, seized power) and a **tyrant by exercise** (legitimate title, rules for private gain rather than common good).

  In your case, the target was properly elected. He is a **tyrant by exercise**. This distinction is not a dead end; it is decisive for Aquinas.
  *   **Usurper:** Because they have no title, they are essentially an aggressor. Aquinas suggests that repelling a usurper is legitimate, even by private individuals, because the usurper has no authority to command.
  *   **Legitimate-turned-Bad:** This ruler still holds the office. To kill him is to strike at the *office* itself, not just the man. Aquinas argues that because the authority comes from God (via the community), removing him requires a higher public authority, not private initiative.

  So, yes, Aquinas would call him a tyrant. But the fact that he was elected makes him much harder to remove licitly than a coup leader.

  ### 2. Who has Standing? (The Jurisdiction Problem)
  This is where the foreign democracy fails Aquinas's test.

  For Aquinas, legitimate coercion requires **jurisdiction**. You can only execute judgment over those subject to your authority.
  *   **The Local Community:** They put him in power. Ideally, they should remove him through public mechanisms. You say those mechanisms are broken. Aquinas acknowledges this dilemma. In *De Regno*, he argues that if there is no human recourse (no higher superior to appeal to), the community must have recourse to God. He explicitly warns against private assassination because it sets a precedent that undermines all authority. He would likely argue that enduring a tyranny is preferable to the civil war and anarchy that often follows a assassination, unless the tyranny is so severe it destroys the very possibility of social life.
  *   **The Foreign Democracy:** They have **no standing**. In Aquinas's political ontology, a king (or state) is responsible for the common good of *his* community, not the world. Unless the tyrant has injured the foreign democracy (e.g., invaded them, violated treaties), the foreign democracy has no jurisdiction to judge or execute him. Internal tyranny is a domestic sin, not an international crime in Aquinas's framework.

  For a foreign power to strike him is not "policing"; it is an act of aggression against a sovereign. Aquinas values the peace between nations. Unilateral intervention based on moral judgment of another sovereign's internal rule violates the order of peace between kingdoms.

  ### 3. Classification: Sedition, War, or Homicide?
  *   **Sedition:** No. Sedition is an internal disturbance against the unity of one's *own* people. This is an external actor.
  *   **War:** Yes. Since it is one political community using force against another, it is an act of war.
  *   **Just War?** Aquinas requires three things for a just war: sovereign authority, just cause, and right intention.
      *   *Authority:* The foreign democracy has sovereign authority over its own forces.
      *   *Cause:* This is the failure point. A just cause requires that the target *deserves* it because of some fault (injury) committed against the attacker. Internal oppression of their own citizens is not an injury to the foreign democracy. Therefore, the war is unjust.
  *   **Homicide:** Because the war is unjust (lack of just cause/jurisdiction), the killing is not an act of public justice. It collapses into homicide. It is the killing of a human being without legitimate public authority over him.

  ### 4. The Drone Operator
  Aquinas deals with soldiers in the context of just war. He views soldiers as **instruments of public authority**.
  *   **If the war is just:** The soldier bears no sin for killing, because he is the sword of the state, not a private killer.
  *   **If the war is unjust:** The sin lies primarily with the authority who commanded it. However, the soldier is not automatically absolved. If the injustice is manifest (obvious), the soldier sins by obeying.

  In your case, the drone operator is physically distant, which Aquinas couldn't conceive, but the moral category is "ministerial action."
  *   **The Verdict:** Since the foreign democracy lacks jurisdiction and just cause, the order is illicit. The operator is materially cooperating in homicide. Aquinas would say the operator is morally compromised unless they are invincibly ignorant (i.e., they genuinely believe the cause is just based on the information given). However, because targeted killing is specific and deliberate, it looks less like "fog of war" and more like execution without trial. The operator becomes an executioner without a court.

  ### 5. Where the Framework Runs Out of Road (The Gaps)
  You asked for honesty about extrapolation. Here is where Aquinas stops and you are left holding the bag:

  1.  **International Sovereignty:** Aquinas lives in a world of Christendom with a theoretical hierarchy (King < Emperor < Pope). He assumes a higher authority can judge a tyrant. In your scenario, there is no Pope or Emperor. Aquinas has no robust theory for a system of *equal* sovereign states. He doesn't know what to do when the "higher superior" is missing. He defaults to "pray and endure" rather than "international intervention," which feels unsatisfactory to modern liberals.
  2.  **Human Rights vs. Common Good:** Aquinas cares about the *common good of the polity*, not the *rights of individuals* across borders. He does not have a concept of "crimes against humanity" that grant universal jurisdiction. To him, the citizens of that tyranny are subjects of that king, not members of a global community protected by other kings.
  3.  **Democracy:** Aquinas prefers a "mixed constitution" but is skeptical of pure democracy. He doesn't have a theory for one democracy intervening in another. He might view the foreign democracy as presumptuous for assuming it can judge another regime's legitimacy.
  4.  **Remote Killing:** Aquinas's theory of self-defense and war assumes risk. The soldier puts his life at hazard. A drone operator does not. This changes the moral psychology of killing. Aquinas assumes the hazard of war acts as a check on violence. Remote killing removes that check. He has no category for "safe slaughter," so he cannot fully adjudicate the moral weight of the operator's detachment.

  ### Summary Verdict
  Aquinas would say the seminar mate is wrong. He would condemn the drone strike.
  1.  **The Target:** Is a tyrant by exercise, not usurpation.
  2.  **The Agent:** The foreign democracy lacks jurisdiction. They are not the tyrant's superior.
  3.  **The Act:** Is an unjust war, collapsing into homicide.
  4.  **The Operator:** Is an instrument of an unjust command, morally culpable if the injustice is known.
  5.  **The Remedy:** Aquinas would likely say the suffering community must seek internal restoration or endure, because introducing foreign violence to solve domestic tyranny usually creates a greater disorder (war) than the tyranny itself.

  The gap is clear: Aquinas cannot solve the problem of a tyrant protected by sovereignty in a world without a higher judge. He prioritizes order over justice in that specific impasse. If you want to justify the strike, you need modern human rights theory, not Thomism.
