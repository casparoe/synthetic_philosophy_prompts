          *   *Verdict:* Ad hoc rescue. Weak distinction.

  4.  **Synthesize the Central Question:**
      *   Does the Fund case give a DA-based reason to lower confidence?
      *   *Answer:* No, not if one accepts SIA or proper Bayesian updating (Idris's Move 4). If one accepts SSA *and* treats the Fund hypothesis as new information requiring a likelihood update on old evidence (Vera's Move 1 & 5), then Yes.
      *   *Decisive Premise:* The treatment of "old evidence" (Move 4) and the validity of SIA (Move 2). The strongest philosophical consensus leans towards Idris on the "old evidence" point (you can't update twice on the same indexical fact).

