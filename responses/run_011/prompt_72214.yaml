answer: |-
  Here is the menu of claims hidden inside the slogan, followed by an audit of Dave's logic and a diagnosis of the rhetoric.

  ### The Menu of Claims

  **1. The Literal Ecological Claim (Trophic Position)**
  *   **The Claim:** You should eat organisms closer to primary producers (plants/phytoplankton) to reduce energy loss through trophic levels.
  *   **Status:** **Substantive (but often misapplied).** Ecologically, energy transfer is ~10% efficient per level. Eating plankton-eaters is more efficient than eating fish-eaters. However, for land animals, cows and chickens are both primarily primary consumers (Level 2). Calling chicken "lower" than beef is ecologically dubious; they occupy nearly the same trophic niche.
  *   **What Unthinking Users Mean:** "It feels more basic/fundamental." They conflate *size* with *trophic level*.

  **2. The Feed Conversion Claim (Resource Efficiency)**
  *   **The Claim:** It takes less plant biomass to produce a kilogram of this meat than that meat.
  *   **Status:** **Substantive/Defensible.** Chickens convert grain to meat much faster than cows. Sardines require no human-supplied feed (they forage wild), whereas tuna require massive amounts of wild forage fish to grow.
  *   **What Unthinking Users Mean:** "This is cheaper to make/less wasteful." This is usually the actual engine of the argument when land animals are discussed.

  **3. The Body Count Claim (Individual Minimisation)**
  *   **The Claim:** Eating this source results in fewer individual deaths per calorie consumed.
  *   **Status:** **Substantive/Defensible.** One steer yields ~400kg of meat; one broiler yields ~2kg. To get the same meat, you kill ~200 chickens per cow. Conversely, one tuna yields ~200kg; one sardine yields ~0.05kg. To get the same meat, you kill ~4,000 sardines per tuna.
  *   **What Unthinking Users Mean:** **Almost never.** If they counted bodies, they wouldn't eat small fish or chicken. They ignore this metric entirely.

  **4. The Suffering-Weighted Claim (Capacity for Harm)**
  *   **The Claim:** The organisms higher on the chain have greater cognitive capacity for suffering, or the systems required to raise them inflict more intense suffering.
  *   **Status:** **Debatable/Speculative.** Cows may have higher individual cognitive capacity than chickens, but chickens are kept in vastly worse conditions and slaughtered younger. Fish suffering is scientifically contested but increasingly acknowledged.
  *   **What Unthinking Users Mean:** "Bigger animals feel more pain." This is a heuristic, not a calculated metric.

  **5. The Land Use & Collateral Damage Claim**
  *   **The Claim:** This choice requires less land, thereby reducing the death of field animals (mice, birds, insects) during crop harvest.
  *   **Status:** **Substantive/Defensible.** Beef requires the most land (grazing + feed crops). Chicken requires less. Plants require the least. Eating wild sardines requires almost no land.
  *   **What Unthinking Users Mean:** "It's better for the environment." They often conflate animal ethics with environmentalism.

  ***

  ### The Dave Audit

  **Move 1: Tuna $\to$ Sardines**
  *   **Does the slogan work?** **Yes.**
  *   **Which reading earns the sardines?**
      *   *Trophic Position:* Sardines eat plankton (Level 2); Tuna eat fish (Level 3+). **Valid.**
      *   *Feed Conversion:* Sardines are wild forage; Tuna are apex predators requiring massive biomass input. **Valid.**
      *   *Land Use:* Both are wild, but sardine fisheries are generally less destructive. **Valid.**
  *   **Which reading loses?**
      *   *Body Count:* Switching to sardines drastically *increases* the number of individuals killed per kilo. Dave ignores this.

  **Move 2: Beef $\to$ Chicken**
  *   **Does the slogan work?** **Only if you switch metrics.**
  *   **Which reading earns the chicken?**
      *   *Feed Conversion:* Chicken is far more efficient than beef. **Valid.**
      *   *Land Use:* Chicken requires less land than beef. **Valid.**
  *   **Which reading loses?**
      *   *Trophic Position:* Both are herbivore/omnivore livestock. Ecologically, they are at the same "height." **Invalid.**
      *   *Body Count:* Switching to chicken *increases* the number of individuals killed by roughly two orders of magnitude. **Invalid.**

  **Verdict:** Dave is not using a consistent ethical framework. He is using **Efficiency** to justify the chicken and **Ecology** to justify the sardines, while actively suppressing the **Body Count** metric in both cases because it contradicts his desired conclusion.

  ***

  ### Rhetorical Autopsy

  When one sentence gets recruited for two contradictory jobs, it is functioning as a **Motte-and-Bailey Heuristic**.

  1.  **The Motte (The Defensible Position):** "We should reduce resource waste and environmental impact." (This supports both sardines and chicken).
  2.  **The Bailey (The Ethical Claim):** "This choice causes less harm to sentient beings." (This is where the contradiction lies).

  The slogan works rhetorically because it borrows the objective authority of ecology ("food chains" are science) to settle a normative ethical question ("harm" is philosophy).

  *   **Why it stops the fight:** It creates a **pseudo-directionality**. "Lower" implies a downward vector of moral progress. It turns a complex multi-variable optimization problem (suffering, death count, environment, health) into a single-axis slider.
  *   **Why it survives contradiction:** Because the metric is never defined *ex ante*. If challenged on body count, Dave retreats to efficiency. If challenged on efficiency (e.g., wild vs. farmed), he retreats to trophic levels. The slogan is not an argument; it is a **conversation-closing ritual**. It signals "I have considered the science" without requiring the speaker to specify *which* science or *which* ethical weightings they are using.

  Dave isn't arguing ethics; he's optimizing for cognitive dissonance reduction. The slogan is the tool that lets him claim consistency while shifting the goalposts.
