      *(Final Analogy Choice)*: **The Scoreboard.** It tracks the game but doesn't play it. But who keeps score? Or **The Language.** I think **Language** is the strongest for "substrate doesn't matter, meaning does." But **Ticket** is what the user asked about. Let's fix the Ticket analogy. **A Ticket to a Show that hasn't started yet.** It mobilizes the actors.

      *Decision:* I will offer the **"Claim Check on Future Labor"** as the refined token analogy, and contrast the Casino with the **Public Utility**.

