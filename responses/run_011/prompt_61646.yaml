      *   Break points? Yes.
      *   Berkeley's view? Yes.
      *   Better analogy? Yes.

      *(Self-Correction during drafting)*: Make sure to emphasize that Berkeley was arguing *for* paper money in a cash-starved economy, whereas modern CBDC discussions are often about control or efficiency in a saturated economy. The direction of the pressure is different.

