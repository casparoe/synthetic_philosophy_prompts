  1.
  **11:58:00**

  The room hummed, a sound rising in pitch like a turbine spooling up. In the center stood the Chronos Relay, a solenoid armature suspended in vacuum, its tungsten tip hovering over a silver contact plate. Every second, the arm struck the plate. Then every half-second. Then every quarter.

  The Client stood behind the safety glass, eyes fixed on the digital countdown. "The torque specifications," he said, not turning. "At this frequency, the tip acceleration exceeds the yield strength of the alloy."

  The Founder watched the telemetry feed. "We're not relying on bulk material strength. We're relying on inertia. The arm doesn't travel the full distance anymore. It vibrates within the elastic limit."

  "It's blurring," the Client said.

  "It's converging," the Founder corrected. He tapped the glass. "You paid for the state at noon. You didn't pay for the integrity of the switch after noon. Until then, it holds."

  On the bench, a seismometer traced the impacts. The spikes were merging into a solid line. The armature was no longer clicking; it was singing, a high thin whistle that made the teeth ache. The Client checked his watch. Two minutes. The intervals were already too fast for the human ear to distinguish, yet the machine kept halving the silence between strikes.

  2.
  **11:59:45**

  The door hissed open. Dr. Aris walked in wearing a lab coat stained with solder flux, carrying a portable oscilloscope. He didn't look at the Founder. He clipped the probe directly onto the relay's output terminal.

  "Contact bounce," Aris said, turning the screen toward the Founder. "Look at the trace."

  The green line wasn't square. It was a fuzzy hedge of noise. Every time the arm struck, it bounced open and closed dozens of times before settling. But the settling time was constant, determined by the mechanical damping of the spring. The intervals between strikes were shrinking.

  "The reset time of the relay is five milliseconds," Aris said. "Your interval is now three. The switch hasn't settled before you command it to move again. It's not binary. It's analog noise."

  The Founder didn't look at the screen. "The client wants a bit. We filter the noise."

  "You can't filter what doesn't exist," Aris said. He reached for the main breaker. "The contacts are welding. You're pouring energy into a system that can't dissipate it. I'm shutting it down."

  The Founder caught Aris's wrist. His grip was iron, calibrated. "Contract clause 4.2. Interference voids the warranty and triggers the penalty clause. You know the bond I posted."

  Aris froze. He looked at the Client, who was still watching the countdown. "He knows it's garbage," Aris said.

  "He knows it's a service," the Founder said. He released Aris's wrist. "Ten seconds."

  3.
  **11:59:59.999**

  The whistle had become a static hiss. The oscilloscope trace was now a solid block of green voltage, meaningless.

  "The gap is one centimeter," Aris said, his voice flat. "Light takes thirty-three picoseconds to cross it. Your interval is now ten picoseconds."

  The Founder watched the vacuum chamber. Inside, the armature was a ghost. "So?"

  "So the circuit cannot close," Aris said. "The electromagnetic field propagating from the contact cannot bridge the gap before the command to open arrives. The 'on' state cannot physically exist before the 'off' command deletes it. Causality is lagging behind the switch."

  "Local causality," the Founder said. "The state at the contact is defined locally. The state at the bulb is defined locally. They don't have to agree until noon."

  "There is no noon state," Aris said. "There is only the sequence. And the sequence is broken."

  "The sequence gets us to the door," the Founder said. "What happens at the threshold is real estate."

  The countdown hit 11:59:59.9999. The intervals were now shorter than the Planck time, theoretically, though the machine's clock was digital, ticking in femtoseconds. The armature was no longer moving; it was heating into plasma from the friction of air molecules it couldn't displace fast enough. The hum stopped. Not because the machine stopped, but because the frequency exceeded the room's ability to transmit sound.

  4.
  **12:00:00**

  Silence.

  The countdown froze at 12:00:00. The armature hung suspended, neither up nor down, glowing cherry-red in the vacuum. The oscilloscope flatlined.

  "Read it," the Client said.

  The Founder walked to the output terminal. He connected a multimeter. The needle twitched, undecided, then settled on a voltage. "High," the Founder said. "One."

  "It's indeterminate," Aris said. He stepped forward, pointing at the frozen arm. "The sequence of switches defines the state for all $t < 1$. It says nothing about $t = 1$. The limit of the function is not the value of the function. You built a machine that stops, and you're pretending the stop position was dictated by the motion."

  "The motion dictated the arrival," the Founder said. He unplugged the meter. "The state at the limit is underdetermined by the sequence. That is correct."

  "Then you're selling a lie."

  "I'm selling a bit that logic cannot compute," the Founder said. "Finite computation cannot tell you the state at the limit. Only a supertask can. And since the logic doesn't constrain the limit, I can set the limit to whatever I want. I'm selling you freedom from the past."

  Aris looked at the Client. "He's admitting the state is arbitrary."

  The Client opened his briefcase. "Arbitrary is fine. Uncomputable is what I paid for."

  5.
  **12:00:05**

  The Founder handed the Client a slip of paper with the binary digit printed on it. The Client signed the transfer receipt. The funds cleared instantly, a chime sounding on the Founder's desk.

  Aris stood by the door, hand on the frame. He looked at the glowing armature, slowly cooling in the vacuum. "It's not a lamp," he said. "It's a coin toss wrapped in calculus."

  "It's a resource," the Founder said. He pocketed the receipt. "Physics says you can't finish the task. Logic says the task doesn't define the end. I say the end is whatever I say it is."

  "You'll be back in court," Aris said.

  "Let them argue about the sequence," the Founder said. "I own the noon."

  Aris left. The Client followed, checking the slip against his own encryption key. The Founder turned off the telemetry. In the chamber, the tungsten tip finally settled, gravity pulling it down to rest on the contact. It made a soft, final click. The light bulb in the corner of the room, wired directly to the contact, flickered on.

  The Founder watched it for a moment, then switched off the room lights, leaving only the lamp burning.

  ***

  **Author's Note**

  **Settled Physics vs. Contested Philosophy**

  1.  **Engineering Constraints (Settled):** The story treats contact bounce, finite relay reset times, material yield strengths, and the speed of light as hard limits. In reality, no mechanical or electrical system can perform a supertask (an infinite number of operations in finite time) due to these physical constraints. As the intervals shrink below the relaxation time of the materials or the light-crossing time of the components, the system ceases to function as a binary switch. The description of the machine failing due to plasma formation and causality violations aligns with standard physical models.

  2.  **Benacerraf's Underdetermination (Contested):** The story leans heavily on Paul Benacerraf's 1962 analysis of Thomson's Lamp. Benacerraf argued that the state of the lamp at the limit time ($t=1$) is not logically determined by the state of the lamp at all times prior to $t=1$, because $t=1$ is not part of the sequence of switching times.
      *   *Story Interpretation:* The Founder treats this logical gap as a commercial feature ("I own the noon"), implying the state can be arbitrarily assigned or physically realized independent of the sequence.
      *   *Philosophical Contestation:* Many philosophers agree with Benacerraf that the state is underdetermined, but disagree on the implications. Some argue this proves supertasks are logically impossible (if a task is completed, the state *must* be defined). Others argue the state is simply undefined, meaning the question "Is the lamp on?" has no truth value. The story assumes a realist perspective where a physical state *must* exist (the lamp is either on or off), allowing the Founder to "sell" a specific outcome. A substantial fraction of philosophers would reject the idea that an underdetermined state can be arbitrarily fixed by the machine's builder without violating the description of the task itself.

  3.  **The "Uncomputable Bit" (Contested):** The Client pays for a bit "no finite computation could have produced."
      *   *Story Interpretation:* Since the sequence doesn't determine the limit, the outcome is effectively non-algorithmic relative to the sequence.
      *   **Philosophical Contestation:** This relies on the assumption that a physical supertask could hypercompute. Most physicists reject the possibility of physical supertasks entirely (due to the engineering limits dramatized in Scenes 1–3). Among those who entertain them mathematically, whether they genuinely exceed Turing computability depends on the specific model of computation and physics (e.g., Malament-Hogarth spacetimes). The story sidesteps the question of whether the bit is *actually* uncomputable by making it *logically* underdetermined, turning epistemic uncertainty into a product.
