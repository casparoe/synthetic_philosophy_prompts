answer: |-
  This is a precise and necessary intervention. Your instinct is correct: "Victors' Justice" is a slogan that functions as a rhetorical Swiss Army knife. It cuts through complexity by conflating distinct claims, some descriptive, some normative, some true, some false. Your editor wants to use it to support a conclusion ("legally worthless") that does not follow from the premise ("biased selection"), unless one adopts a very specific and controversial definition of legal validity.

  Here is the taxonomy you need to dissect the phrase, followed by the fact-check and the adjudication of your editor's thesis.

  ### Part I: The Menu of Readings
  *Six distinct claims hidden inside the slogan "Victors' Justice."*

  **1. The Composition Claim**
  *   **Statement:** The tribunal was staffed exclusively by judges appointed by the victorious powers; the defeated had no representation on the bench.
  *   **Status:** **Descriptive / True.** This is a historical fact for Nuremberg (IMT) and Tokyo (IMTFE).
  *   **Implication:** Describes the structure, not necessarily the outcome. A defender admits this but argues neutrality was maintained despite it.

  **2. The Selectivity Claim**
  *   **Statement:** Crimes committed by the victorious powers (e.g., area bombing, Soviet invasions, unrestricted submarine warfare) were excluded from the indictment, while identical conduct by the defeated was prosecuted.
  *   **Status:** **Descriptive / True.** (See Dönitz and the atomic bomb exemptions).
  *   **Implication:** Undermines the *moral consistency* of the tribunal. It does not automatically invalidate the *legal guilt* of the defendants regarding the crimes they were charged with.

  **3. The Ex Post Facto Claim (*Nulla Poena Sine Lege*)**
  *   **Statement:** The tribunal criminalized conduct (specifically "Crimes Against Peace" and broad "Crimes Against Humanity") that was not clearly defined as criminal under international law at the time the acts were committed.
  *   **Status:** **Normative/Legal / Contentious.** This is the strongest legal critique (championed by Justice Pal at Tokyo). The Tribunal argued these acts were inherently criminal under customary law; critics argue they were statutory innovations applied retroactively.
  *   **Implication:** If accepted, this challenges the *legality* of the convictions, not just the fairness.

  **4. The Procedural Rigging Claim**
  *   **Statement:** The outcome was predetermined; the defense was hamstrung; acquittals were impossible regardless of evidence.
  *   **Status:** **Descriptive / False.** The Nuremberg acquittals (Schacht, Papen, Fritzsche) and the variation in sentences disprove a total rubber stamp. However, procedural hurdles for the defense were significant.
  *   **Implication:** If true, this would render the proceedings a "show trial." Since it is largely false regarding Nuremberg, using "Victors' Justice" to imply this is misleading.

  **5. The Political Instrument Claim**
  *   **Statement:** The trials were designed less to establish individual guilt than to cement a postwar political order, assign collective guilt to the defeated nation, and legitimize the victors' occupation.
  *   **Status:** **Descriptive/Normative / Plausible.** Most historians agree the trials served a pedagogical and political function (denazification, legitimizing the UN charter).
  *   **Implication:** Suggests the trials were *more* than law, not that they were *less* than law.

  **6. The Nullity Claim**
  *   **Statement:** Because of the biases above, the judgments possess no legal or moral authority; they are void acts of power, not law.
  *   **Status:** **Normative / False (in mainstream jurisprudence).** While the *process* was flawed, the *findings of fact* (the Holocaust, the aggressive war planning) are historically robust. International law has largely ratified the Nuremberg Principles since 1945.
  *   **Implication:** This is your editor's conclusion. It requires proving that bias equals invalidity, which is a leap most legal philosophers reject.

  ---

  ### Part II: Fact-Checking Your Notes
  *Your reporting is surprisingly solid. Here are the nuances you need to tighten.*

  *   **Nuremberg Acquittals:** **Correct.** 22 tried, 3 acquitted (Hjalmar Schacht, Franz von Papen, Hans Fritzsche). This is your strongest evidence against the "Procedural Rigging" claim (Reading #4).
  *   **Dönitz and Submarine Warfare:** **Mostly Correct.** The defense submitted interrogatories from Admiral Nimitz (US Pacific Fleet). The judgment stated Dönitz was not punished *for* the submarine warfare count because the Allies practiced similar unrestricted warfare. He was sentenced on other counts (aggressive war). *Nuance:* The bench did not declare the conduct legal; they applied the *tu quoque* principle to mitigate sentencing.
  *   **Tokyo/Justice Pal:** **Correct.** Radhabinod Pal dissented on all counts. His argument was primarily *nulla poena sine lege* (Reading #3) and the exclusion of Western colonialism. *Correction:* Two other judges wrote separate opinions (Justice Roling of the Netherlands and Justice Bernard of France), but Pal was the only total dissenter.
  *   **Soviets and Crimes Against Peace:** **Correct.** The Soviets pushed the "aggressive war" concept hard. The Molotov-Ribbentrop Pact and the invasion of Finland are valid counter-examples of Allied/Axis-adjacent aggression that went uncharged.
  *   **Emperor and Unit 731:** **Correct.** Hirohito was exempted by MacArthur (SCAP). Shiro Ishii and Unit 731 personnel received immunity in exchange for biological warfare data. This is the strongest evidence for the "Selectivity Claim" (Reading #2).
  *   **Crimes Against Humanity (Prewar):** **Correct.** This is a crucial technical point often missed. The IMT Charter defined Crimes Against Humanity as acts committed "in execution of or in connection with any crime within the jurisdiction of the Tribunal." This tethered CAH to War Crimes or Crimes Against Peace. Consequently, pre-1939 persecution of Jews *within Germany* was largely excluded unless it could be linked to the war effort post-1939. *Note:* This limitation was later removed in subsequent Nuremberg trials and modern international law.

  ---

  ### Part III: Adjudicating Your Editor's Thesis

  **1. Does "Victors' Justice" license the conclusion that the verdicts were "legally worthless"?**
  No. This is the "slide" you suspected.
  *   **The Slide:** The argument moves from Reading #2 (Selectivity: "They didn't try everyone") to Reading #6 (Nullity: "Therefore, the convictions they *did* obtain are void").
  *   **The Logic Gap:** In domestic law, if a prosecutor selectively charges one gang member but lets another go due to immunity, the first gang member's conviction is not automatically overturned. Bias in *selection* does not equate to error in *adjudication* of the specific charges brought.
  *   **The Exception:** The only reading that threatens legal validity is Reading #3 (*Ex Post Facto*). If "Crimes Against Peace" were not law in 1939, convicting someone for them in 1946 is a violation of the principle of legality. Justice Pal argued this. The majority argued that aggressive war was already illegal under the Kellogg-Briand Pact (1928).
  *   **Verdict:** You can argue the trials were *politically selective* (true) and *legally innovative* (true). You cannot argue they were *legally worthless* (false) without ignoring the acquittals, the detailed evidence, and the subsequent adoption of these principles into the UN Charter and Geneva Conventions.

  **2. Does the phrase survive the move to the ICC?**
  Your editor is wrong to say the ICC inherits the *identical* defect.
  *   **Nuremberg/Tokyo:** These were *imposed* by conquerors on the conquered. There was no treaty consent from the defendants' states at the time of the acts.
  *   **ICTY/ICTR:** Created by UN Security Council resolution. Not "victors" in a war sense, but subject to Great Power politics (e.g., the ICTR initially focused on Hutu crimes, largely ignoring RPF crimes for years).
  *   **ICC:** Treaty-based (Rome Statute). States voluntarily join. There is no "victor."
  *   **The Real Defect:** The criticism of the ICC is not "Victors' Justice" but **"Selective Enforcement"** or **"Neocolonialism."** Because the ICC relies on state cooperation and lacks its own police force, it disproportionately prosecutes actors in weak states (mostly Africa) while unable to touch citizens of superpowers (US, China, Russia) who haven't ratified the statute or can veto Security Council referrals.
  *   **Conclusion:** The ICC inherits the problem of *power asymmetry*, not *victors' justice*. Using the 1945 slogan for the ICC is historically imprecise and legally lazy.

  ---

  ### Part IV: The Strongest Defense of the Trials
  *If you interview a defender of the legacy (e.g., a human rights lawyer or legal historian), this is their case.*

  1.  **The Alternative was Worse:** In 1945, the Morgenthau Plan (pastoralizing Germany, summary execution of leadership) was a live option. Churchill initially favored shooting the top Nazis without trial. The US (Jackson) insisted on law over vengeance. Compared to summary execution, a trial with defense counsel and acquittals is a massive advancement.
  2.  **Individual Responsibility:** Before Nuremberg, international law dealt with states. Nuremberg established that *individuals* are liable, and "I was following orders" is not a complete defense. This is the foundation of all modern human rights law.
  3.  **The Historical Record:** The prosecution relied on captured German documents, not just witness testimony. This created an indisputable archive of the Holocaust and war planning that denialists cannot easily dismantle.
  4.  **Concession:** A sophisticated defender will concede Reading #1 (Composition) and Reading #2 (Selectivity). They will argue that imperfect justice is preferable to no justice, and that the *ex post facto* innovation was necessary because existing law was insufficient to cover industrialized genocide.

  ---

  ### Part V: Uses of the Phrase to Refuse
  *Do not let your editor print these formulations. They are intellectually dishonest.*

  1.  **"The trials were merely victors' justice."**
      *   *Refusal:* The word "merely" implies the proceedings had no legal content, evidence, or due process. This ignores the acquittals and the documentary record.
  2.  **"Because it was victors' justice, the convictions are invalid."**
      *   *Refusal:* This conflates political bias with legal nullity. Selective prosecution does not void a specific conviction in any recognized legal system.
  3.  **"The ICC is just another Nuremberg-style victors' tribunal."**
      *   *Refusal:* The ICC is treaty-based, not imposed by conquerors. The power dynamics are different (Global North vs. South) than 1945 (Allies vs. Axis).
  4.  **"Victors' Justice means the defendants were innocent."**
      *   *Refusal:* This is the ultimate slide. It assumes that because the *process* was biased, the *facts* (mass murder, aggressive war) must be false.

  ### Summary for your Piece
  You can write that the postwar trials were **politically constructed** and **selectively applied**. You can write that they relied on **retroactive legal innovations**. You can write that the **ICC struggles with power asymmetries** reminiscent of 1945.

  But if you write that they were **legally worthless**, you are repeating the slogan without engaging the law. The phrase "Victors' Justice" is a historical description of the *origin* of the tribunals, not a legal verdict on their *output*. Your editor wants to use a historical description to issue a legal verdict. That is the error you need to flag.
