  *(Self-Correction on Move 5)*: Ana cites China. The "China Paradox" is real but recent data suggests happiness *has* risen in China since 2000s. Ana's data might be slightly dated depending on the article, but the theoretical point (GDP growth $\neq$ Happiness growth) holds. I should note the nuance.

