answer: |-
  **Transcript of Advisory Session: National Insurer Board**
  **Subject:** Coverage Proposal for Vigilan (Night-Shift Indication)
  **Advisers:** Dr. Elena Rostova (Bioethics), Dr. Marcus Thorne (Health Economics & Policy)

  **Elena:** The board wants a recommendation by noon, Marcus. We can't just send them a matrix of costs. They need to know if covering Vigilans for air traffic controllers at 4 AM is *medicine* or *subsidy*.

  **Marcus:** And I'm telling you, that question is a distraction. The board's mandate is to maximize the health and economic security of the insured. If Vigilan prevents crashes and keeps drivers employed, it expands their capabilities. It keeps them in the game. Whether we call it therapy or enhancement is taxonomy, not ethics.

  **Elena:** It's not taxonomy if the distinction marks the boundary of social obligation. Insurance is for misfortune, not optimization. If we cover this, we're saying the insurer is responsible for bridging the gap between human biology and the demands of a 24-hour economy. That's not treating pathology; that's modifying the worker to fit the shift.

  **Marcus:** But "pathology" is the sticky wicket, isn't it? You're relying on Boorse. Statistically normal function at 4 AM is reduced attention. That's species-typical. So, by your book, this is enhancement. But if I label it "Shift-Work Sleep Disorder," suddenly it's therapy. Isn't that just laundering? We're medicalizing a scheduling conflict.

  **Elena:** I'll concede the diagnosis is shaky. Calling it "Shift-Work Sleep Disorder" to trigger coverage is indeed enhancement laundering. I can't defend a baseline that relies on a diagnosis invented to fit the job description. But that doesn't mean the distinction collapses. It means the baseline isn't statistical; it's normative. The baseline is: *What level of function does a person have a right to expect without pharmacological aid, given their social role?*

  **Marcus:** A right to expect? That's subjective. If the job requires vigilance, and the drug provides vigilance, why does the mechanism matter?

  **Elena:** Because of the rat race. If we cover this for controllers, do we cover it for the nurse on double shifts? The parent working two jobs? If we treat this as therapy, we implicitly endorse the idea that the body must be drugged to meet market demands. If we treat it as enhancement, we acknowledge the demand is excessive, and the cost should fall on the employer or the individual, not the health pool.

  **Marcus:** That's a labor law argument, not a bioethics one. Look, let's talk about the "all-in good." You're worried about coercion. I'm worried about opportunity. If a driver can take Vigilan, keep their shift, and earn a living wage, their opportunity set expands. If they don't take it, they might lose the shift to someone who does. Coverage levels the playing field. It prevents a black market where only the rich stay employed.

  **Elena:** Unless the drug costs them something else. We're skipping the memory data.

  **Marcus:** The consolidation issue. Yes. They remember less of the shift.

  **Elena:** "Less" is an understatement. They lose the narrative of that time. They are safer workers, but they are fragmented people. They spend eight hours of their life as a biological instrument, and the drug ensures they don't even retain the memory of it. How is that expanding their "good"?

  **Marcus:** It preserves their income. Income buys autonomy outside the shift. I can trade four hours of memory for financial security. That's a rational preference.

  **Elena:** Is it adapted preference? They're choosing to forget because the alternative is poverty. That's not autonomy; that's duress. But here's the deeper point: If insurance covers this, we are sanctioning the erasure of the worker's experience as a cost of doing business. Therapy restores the agent. This drug optimizes the tool.

  **Marcus:** *[Pauses]* You're hitting the baseline problem again. If the "agent" is defined by their continuous consciousness, then yes, this breaks the agent. But if the "agent" is defined by their life prospects...

  **Elena:** If you define the agent solely by prospects, you can justify lobotomies that make people happier. The therapy/enhancement distinction exists to protect the integrity of the person, not just their output. Therapy aims to return you to *your* life. Enhancement aims to make you useful for *someone else's* purpose.

  **Marcus:** That's a strong claim, Elena. But look at the safety data. Public safety is a collective good. If a controller nods off, hundreds die. If they take Vigilan and forget the shift, everyone lives. Isn't the collective good normatively load-bearing here?

  **Elena:** It is. But health insurance isn't a public safety fund. It's a health fund. If the primary beneficiary is the public, and the primary cost is the worker's memory, the insurer shouldn't be the vehicle. That's the distinction doing work. It tells us *which pot of money* and *which ethical framework* applies.

  **Marcus:** Okay. I see the trap. If I argue for coverage based on "opportunity," I have to account for the quality of that opportunity. If the cost of the opportunity is the loss of autobiographical continuity, then the "opportunity" is hollow. I'm measuring expansion of function, but I haven't weighed the contraction of the self.

  **Elena:** Exactly. And that's why the distinction matters. It flags when we are moving from restoring a person to repurposing them.

  **Marcus:** So, if I recommend against coverage, I'm not just saying it's too expensive. I'm saying it fails the "all-in good" test because it degrades the very agency required to seize opportunities.

  **Elena:** Yes.

  **Marcus:** *[Sighs]* Alright. I can't defend "opportunity" if the intervention eats the past required to navigate it. But Elena, you have to meet me halfway. You can't hide behind "species-typical function." You admitted the diagnosis is laundering.

  **Elena:** I did. "Normal species function" is useless here. The baseline has to be *normative expectation*, not statistical average. I concede that. If I stick to Boorse, I lose the argument because the 4 AM slump is statistically normal. I have to argue that it's *unjust* to expect unassisted vigilance at 4 AM, not that it's *abnormal*.

  **Marcus:** Okay. Then we agree on the recommendation: No coverage. But for different reasons. You think it's enhancement masquerading as therapy. I think it's a net loss to the person's good, regardless of the label.

  **Elena:** Not quite. I think it's a net loss *because* it's enhancement masquerading as therapy. The label tells us the intent.

  **Marcus:** *[Stands up]* Fine. Here is my concession: I argued the therapy/enhancement line was just a budgeting device. I was wrong. In this case, the line tracks the difference between restoring agency and commodifying it. Without that distinction, I couldn't see why the memory loss was a structural ethical failure rather than just a side effect to be weighed. I concede the distinction is normatively load-bearing. It stopped me from approving a deal that trades memory for safety.

  **Elena:** And I concede that "species normal function" is the wrong baseline. We're arguing about justice, not biology.

  **Marcus:** Then we write "Do Not Cover." Not because it's not medicine, but because it makes the medicine a tool of erasure.

  **Elena:** Agreed.

  ***

  **Verdict**
  Elena won the philosophical exchange. While Marcus arrived at the same practical recommendation, he explicitly conceded that his core theoretical premise—that the therapy/enhancement distinction is merely a budgeting heuristic—was false. Elena successfully demonstrated that the distinction serves a critical ethical function in protecting agent integrity, forcing Marcus to abandon his reductionist view even though he initially resisted it.
