answer: |-
  ### Brainstorming Mechanisms

  1.  **The Queue Mechanism:** You are next in line; behind you is either a specific person (A) or a crowd (B). *Risk:* Too similar to standard "replacement" cases; might conflate "someone else will do it" with "this specific person will do it."
  2.  **The Trigger Mechanism:** Your refusal activates a specific alert for Dave (A) vs. a general broadcast (B). *Risk:* Implies your act *causes* the replacement in A but not B, violating the "held fixed" causal structure.
  3.  **The Specific Partner:** You join a team where the other member is named and waiting (A) vs. unnamed and drawn from a pool (B). *Selection:* This isolates the *relational* aspect of complicity without altering the causal outcome. It tests whether moral weight attaches to *who* you act alongside, not just *what* gets done.
  4.  **The Contractual Guarantee:** The agency guarantees a specific contractor (A) vs. guarantees coverage generally (B). *Risk:* Might feel like a legal distinction rather than a moral one.

  **Selection:** I am choosing **The Specific Partner** (refined with Contractual Guarantee elements). It best isolates the variable of *identifiability* while keeping the causal chain (shift filled → strike fails) identical. It forces the audience to confront whether morality cares about the specificity of cooperation when outcomes are fixed.

  ***

  ### Case A: The Named Substitute

  You are a temp worker offered a shift at the plant during the strike. Refusing costs you nothing; you stay home with pay guaranteed by your union. The staffing agency calls you. They explain that if you decline, they will immediately call Dave Miller. Dave is on standby, has already confirmed availability, and needs the hours regardless of your choice. The plant requires exactly one more operator to run the line at full capacity. If the line runs, the strike fails and the pension clause is lost. If you take the shift, the line runs. If you decline, Dave takes the shift, and the line runs. The outcome for the strikers is identical. You know Dave personally; he is a specific colleague on the agency roster.

  ### Case B: The Diffuse Substitute

  You are a temp worker offered a shift at the plant during the strike. Refusing costs you nothing; you stay home with pay guaranteed by your union. The staffing agency calls you. They explain that if you decline, they will fill the slot from their deep bench of available contractors. No specific individual is currently assigned or waiting; the agency simply guarantees coverage based on past success rates. The plant requires exactly one more operator to run the line at full capacity. If the line runs, the strike fails and the pension clause is lost. If you take the shift, the line runs. If you decline, someone else takes the shift, and the line runs. The outcome for the strikers is identical. The replacement is an anonymous statistic from the pool.

  ***

  ### Audit

  #### 1. Theoretical Verdicts

  | Theory | Case A (Named) | Case B (Diffuse) | One-Line Reason |
  | :--- | :--- | :--- | :--- |
  | **(i) Act Consequentialism** | Permissible | Permissible | Marginal expected harm is zero in both; the outcome is fixed regardless of your choice. |
  | **(ii) Participation/Complicity** | Wrong | Permissible (or less wrong) | In A, you enter a specific joint agency with Dave; in B, you interact with an impersonal system. |
  | **(iii) Fairness/Free-rider** | Wrong | Wrong | You benefit from the strike-breaking (pay) while others sacrifice, regardless of who fills the slot. |

  #### 2. Reasoning Check: Marginal Expected Harm

  For Act Consequentialism, the verdict hinges on whether your act changes the expected outcome.
  *   **Case A:** Probability(Line Runs | You Take) = 1.0. Probability(Line Runs | You Refuse) = 1.0 (because Dave is confirmed). Marginal Harm = 0.
  *   **Case B:** Probability(Line Runs | You Take) = 1.0. Probability(Line Runs | You Refuse) = 1.0 (because the agency contractually guarantees coverage and *always* has). Marginal Harm = 0.

  To satisfy your constraint, I ensured Case B's certainty rests on "boring ordinary facts" (contractual obligation + track record) rather than magic. If the agency *always* fills the slot, your refusal changes nothing physically. If you argue B isn't truly 100% certain (e.g., the agency *might* fail), then A isn't either (Dave *might* get a flat tire). To isolate the variable, we must treat the ordinary certainty of "Dave said yes" and "Agency always fills" as equivalent levels of practical certainty. If we do that, marginal harm is zero in both.

  #### 3. Intuition Analysis: What is Doing the Work?

  You guessed it is the **identifiability of the doer**, not the causal structure. You are right.

  The causal structure is identical: Shift Filled → Strike Fails. If intuitions differ between A and B, it cannot be because of the outcome. It must be because of the *relational property* of the act. In Case A, you are not just causing harm; you are *cooperating with Dave*. You know his name. You know he is waiting for your refusal to step in. This creates a specific moral partnership. In Case B, you are cooperating with a "system."

  This bites because human moral psychology is tuned for face-to-face interaction. We track specific agents. Complicity views argue that wrongdoing isn't just about outcomes; it's about what you *join*. Joining Dave's specific strike-breaking feels like shaking a dirty hand. Joining a "pool" feels like walking on a dirty floor. The variable isolates whether we care about the *hand* or the *floor*.

  **Dialing the Variable:**
  *   **85% Likelihood:** If Dave (or the pool) is only 85% likely to fill the shift if you refuse, Consequentialism shifts to "Wrong" for both (Expected Harm > 0). Complicity views might still distinguish A and B, but the pressure increases for B.
  *   **Named but Not Called:** If Dave is named but hasn't been called yet, Case A collapses toward Case B. The specificity exists, but the *readiness* does not. This suggests the intuition relies on the *immediacy* of the specific replacement, not just the name.
  *   **Worst-Off Theory:** **Act Consequentialism.** It is forced to say A and B are morally identical. If your audience feels A is worse (due to the specific partnership), Consequentialism cannot explain why. It lacks the vocabulary for "specific cooperation" independent of outcomes.

  #### 4. The Best Attack on the Pair

  **The Attack:** "The Epistemic Uncertainty Objection."
  A defender of Consequentialism will argue: "You haven't actually held the causal structure fixed. In the real world, you can never be 100% certain the agency will fill the slot in Case B. You *can* be nearly 100% certain about Dave in Case A because he verbally confirmed. Therefore, the expected harm in B is actually higher than in A (e.g., 0.05 vs 0.01). Your case pair rigs the intuition by pretending uncertainty is equal when it isn't."

  **Does it Succeed?**
  No, not if you enforce the stipulations. The case states the agency is "contractually obliged... and always has." In a workshop setting, you must insist participants accept the stipulated facts as true within the thought experiment. If they reject the certainty in B, they must also reject the certainty in A (Dave could have a heart attack before the shift). If we normalize the uncertainty (both are 99% likely), the Consequentialist verdict remains "Permissible" for both (assuming the threshold for wrongness is higher than that marginal risk), but the intuition gap remains. The attack fails because it tries to smuggle causal differences back into a pair designed to isolate relational differences.

  #### 5. Honesty Check: Is the Variable Inert?

  If you believe morality is *only* about outcomes, this variable is inert. A and B are the same case described differently. However, if you believe morality includes *relational duties* (who you act with, not just what happens), the variable is active.

  I do not believe it is inert. We routinely distinguish between shooting a specific person and firing into a crowd where someone will die, even if the death count is identical. The specificity of the victim matters. By symmetry, the specificity of the *co-agent* should matter. If you reject this, you are committed to a purely outcome-based morality, in which case this case pair won't move you—but it will successfully expose that commitment to your audience.

  If the strike setting genuinely couldn't satisfy the constraints (e.g., if strikes inherently rely on uncertainty), I would propose shifting to a **medical triage setting**: allocating a single ventilator where refusing means a specific named patient gets it (A) vs. a patient from a waiting list (B). But the strike setting works provided the "agency guarantee" is stipulated as firmly as "Dave's confirmation."
