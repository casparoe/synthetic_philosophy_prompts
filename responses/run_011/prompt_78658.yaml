answer: |-
  An AI researcher and a philosopher of mind are comparing notes on the Frame Problem.

  The researcher says, "I solved it. My system assumes nothing changes unless I specify an action."
  The philosopher says, "But how does it know what *could* change?"
  The researcher says, "It doesn't need to. That's the beauty of default logic."
  The philosopher says, "So you solved the bookkeeping. I'm talking about relevance."
  The researcher insists, "But they're nominally the same problem."
  The philosopher smiles. "Yes. The Frame Problem."
  She pauses.
  "And after forty years of debate... it's the only thing that hasn't changed."
