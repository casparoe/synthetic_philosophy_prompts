answer: |-
  **The Tag:** Right.

  **The Rule She Is Running:**
  The Senior Editor is not tagging based on the *size of the state*, the *presence of welfare*, or *universalism*. She is tagging based on the **moral status of inequality and hierarchy.**

  *   **Left:** Inequality and hierarchy are viewed as **structural injustices** or artificial constructs that must be dismantled or corrected to achieve justice. (Bolsheviks: radical leveling; Diggers: enclosures are theft; Syndicalists: wage labor is exploitation; National-Liberation: Imperialism is oppression).
  *   **Right:** Inequality and hierarchy are viewed as **natural, organic, or the legitimate price of liberty/property.** State intervention is permissible only to sustain the organic order or provide charity, not to engineer equality. (Manchester: market inequality "wasn't a wrong"; Ancaps: property is natural right; Christian Dems: "natural differences of station"; Thatcher: market outcomes are legitimate).
  *   **Syncretic:** A movement that asserts **both** logics as foundational truths simultaneously. (Peronism: Wealth must be redistributed because inequality is unjust [Left], *AND* society must be organized under One Man/Nation because hierarchy is organic/natural [Right]).

  **Candidate Rules That Are Dead on Arrival:**

  1.  **State vs. Market (Size of Government):**
      *   *Why it fails:* If this were the rule, Anarcho-syndicalists (No State) would be Right, and Christian Democrats (Generous Welfare State) would be Left. The Editor tags Syndicalists Left and Christian Dems Right. The state is merely a tool; the *purpose* of its use determines the tag.
  2.  **Universalism vs. Particularism:**
      *   *Why it fails:* If Left meant "Cosmopolitan/Universal," the Marxist National-Liberation entry (Vietnam/Algeria) would have to be Right or Syncretic. The Editor explicitly tags them Left despite their "impatience with universalist, cosmopolitan talk." Leftism can be nationalist if the goal is dismantling a hierarchy (imperialism).
  3.  **Poverty Alleviation (Who Helps the Poor):**
      *   *Why it fails:* Both Manchester Free Traders and School Choice proponents argue their policies help the poor most ("lifts every nation," "poor kid trapped"). If helping the poor made you Left, Manchester would be Left. It's not about *who* you help, but *why* you think they are poor and *what* you accept as the remedy.

  **Closest Analog for Defense:**
  **The Manchester Free Traders.**

  *   **The Parallel:** Both movements argue that a specific barrier (Tariffs vs. School Zoning) traps the poor. Both propose removing the barrier to allow free exchange (Goods vs. Education) as the solution. Crucially, both accept that the resulting landscape will be unequal. The Manchester tag note explicitly says they held that "whatever inequality a free market threw up wasn't a wrong to be corrected." School Choice proponents similarly argue that while the *access* must be equalized (via the voucher), the *outcome* (different schools, religious vs. secular, high-performing vs. niche) is a feature of liberty, not a bug to be leveled.
  *   **The Defense:** "Like the Free Traders, the School Choice movement identifies a structural barrier hurting the poor, but proposes a market-liberty solution that accepts institutional differentiation as legitimate. Unlike the Diggers or Bolsheviks, they do not seek to make all schools 'common' or equal in structure, but to allow exit from the common system."

  **The Implicit Theory of the Volume:**
  The volume commits to a **Philosophical Anthropology** distinction rather than a Policy or Coalition distinction.

  *   **Is "Left" a single property?** No. Anarcho-syndicalists and Bolsheviks share almost no policy DNA (State vs. No State).
  *   **Is it a coalition label?** No. If it were just "who is fighting whom," National-Liberation movements (fighting Imperialists) and Bolsheviks (fighting Bourgeoisie) might be categorized differently depending on the enemy. They are grouped together because they share a *diagnosis*: the current hierarchy is illegitimate.
  *   **The Verdict:** It is a **Cluster Concept** held together by the **moral evaluation of inequality.** The "family resemblance" between the Left entries is the conviction that human hierarchy is a *grievance*. The "family resemblance" between the Right entries is the conviction that human hierarchy is a *fact* (natural or the cost of freedom).

  **The Test Case (Ends vs. Means):**
  To test whether she tracks *Ends* (Equality) or *Means/Logic* (Natural Order), propose the movement: **Distributism (e.g., Chesterton/Belloc).**

  *   **The Fork:** Distributism seeks widespread property ownership and economic independence for the working class (a Left *End* of equality/anti-proletariat). However, it seeks this through tradition, guilds, family structures, and a rejection of industrial modernity (a Right *Logic* of organic order/natural station).
  *   **The Signal:**
      *   If she tags it **Left**, she is tracking the *End* (distribution of wealth).
      *   If she tags it **Right**, she is tracking the *Logic* (organic hierarchy/tradition).
      *   Given her ruling on Christian Democrats (Welfare + Organic Order = Right), she will likely tag Distributism **Right**. This confirms she prioritizes the *moral logic of hierarchy* over the *material outcome*.

  **Why School Choice Is Not Syncretic (Unlike Peronism):**
  Peronism is Syncretic because it holds two contradictory *foundational truths* in tension: that the working class must be economically empowered against capital (Left Truth) **AND** that the nation must be subordinated to an authoritarian Leader who embodies the organic will of the people (Right Truth). It is a philosophical hybrid.

  School Choice is not Syncretic because it does not assert a contradictory foundational truth. It asserts that *access* should be equalized (which sounds Left), but it defines that equalization through *consumer sovereignty and market differentiation* (which is Right). This is not a contradiction; it is a **Right-wing method of addressing a social problem.** Christian Democrats addressed poverty with welfare but remained Right because the welfare supported the organic order. School Choicers address inequality with vouchers but remain Right because the vouchers support the market order. It is a consistent Right logic, not a fusion of opposing logics.
