answer: |-
  This is a profound puzzle that sits at the intersection of jurisprudence, moral philosophy, and clinical psychiatry. You have correctly identified that the Ulysses clause inverts the standard temporal hierarchy of consent. To make sense of it, we must reconstruct the specific metaphysics of the self and the specific theory of liberty that the practice requires.

  Here is an analysis of the theoretical machinery required to make a Ulysses clause coherent, the status of the 'revoke-proof' variant, and what would happen if the Principle of Alternative Possibilities were enforced.

  ### 1. The Theory of Autonomy: Diachronic Sovereignty

  The standard medical-legal default relies on **synchronic autonomy**. At time $t$, is the patient competent? If yes, their will at $t$ is sovereign. This presupposes that the self is a series of distinct temporal stages, and the current stage holds the veto.

  The Ulysses clause presupposes **diachronic autonomy**. It posits that the 'self' is a narrative entity extended over time, and that sovereignty belongs to the *author* of the narrative, not necessarily the *character* in the current chapter. For this to add up, three theoretical commitments must be true:

  1.  **The Hierarchy of Selves:** There is an asymmetry between the 'well' self (Time 1) and the 'ill' self (Time 2). The well self is deemed the 'authentic' agent, capable of reasoning about values and long-term interests. The ill self is deemed a compromised agent, whose preferences are distortions (symptoms) rather than authentic volitions.
  2.  **Precommitment as Liberty:** Restriction of future choice is not a subtraction from freedom, but an *exercise* of freedom. This aligns with a **Compatibilist** theory of free action, specifically a **Hierarchical Model** (akin to Harry Frankfurt). On this view, you are free not when you can do otherwise, but when your actions align with your higher-order volitions. The Ulysses clause ensures that the patient's action at Time 2 (being medicated) aligns with their higher-order volition established at Time 1, even if their first-order desire at Time 2 is to refuse.
  3.  **Critical vs. Experiential Interests:** Drawing on Ronald Dworkin's distinction, the practice assumes that 'critical interests' (what makes a life good overall, judged by the well self) trump 'experiential interests' (what feels good or bad in the moment, judged by the ill self).

  **Your Hunch:** You suggested the axis is "could have done otherwise" (Principle of Alternative Possibilities, or PAP) versus "reasons-tracking machinery".
  *   **Verdict:** You are largely correct, but with a refinement. The practice does not merely require that the action issues from reasons-tracking machinery; it requires that the *definition* of what counts as a valid reason is fixed by the past self. At Time 2, the patient's shout of "No" is not processed as a reason to stop, but as data confirming the need to continue.
  *   **Necessary Bits:** The practice cannot survive without the **Hierarchy of Selves**. If the law viewed the Time 2 self as equally authoritative, the clause would be void. It also cannot survive without **Compatibilism**. If liberty required the ability to do otherwise at the moment of action (Libertarian Free Will), the clause would be coercive by definition.
  *   **Underdetermined Bits:** The theory is underdetermined regarding the *threshold* of incapacity. Does the clause activate only when the patient is legally incapacitated, or merely when they are manic? Some frameworks allow the clause to hold even if the patient retains some capacity, provided their decision contradicts the advance directive. This is a grey area where different jurisdictions licence the same form on different theoretical grounds.

  ### 2. The Revoke-Proof Clause: Binding the Interpreter

  The variant you describe—where attempting to revoke the directive is itself evidence of incompetence—is a radicalisation of the standard Ulysses logic.

  **Does it belong to the same theory?**
  Yes, but it shifts the locus of control. The standard Ulysses clause binds the *patient's body* (you cannot leave the ward). The revoke-proof clause binds the *epistemic authority of the clinicians* (you cannot accept the patient's refusal as valid).

  It presupposes that the 'well' self has not only the right to dictate treatment but the right to define the **criteria for competence** at Time 2. It creates a closed loop:
  1.  Directive says: "If I try to cancel this, I am ill."
  2.  Patient tries to cancel.
  3.  Clinician observes (1) and (2).
  4.  Clinician concludes: "Patient is ill."
  5.  Treatment proceeds.

  This is theoretically consistent with Diachronic Sovereignty, but it introduces a risk of **epistemic tyranny**. It treats the *act of changing one's mind* as a symptom. In almost every other area of law, the ability to change one's mind is the hallmark of a free agent. Here, it is pathologised.

  **Does it change the subject?**
  Quietly, yes. The standard clause binds the future self. The revoke-proof clause binds the *judgement of everyone who later meets them*. It attempts to remove the clinician's discretion to assess capacity in the moment. It transforms the advance directive from a statement of preference into a **self-fulfilling diagnostic criterion**. It works only if we accept that the Time 1 self has superior epistemic access to the Time 2 self's mental state than the Time 2 self does themselves.

  ### 3. If "Ability to Do Otherwise" Were Necessary

  If a court decided that for treatment to count as the patient's 'own doing', the patient must retain the **Principle of Alternative Possibilities (PAP)** at the moment of treatment (Time 2), the entire architecture of the Ulysses clause would collapse. You cannot have a binding precommitment that removes the option to withdraw.

  **Changes to the Wording:**
  The form would need to change from a *command* to a *presumption*.
  *   *Current:* "If I become manic, I am to be detained and medicated. I waive my right to refuse."
  *   *Required:* "If I become manic, I am *presumed* to require detention and medication. However, this presumption may be overturned if I can demonstrate to an independent tribunal, at the time of treatment, that my refusal is competent."

  **Changes on the Ward:**
  1.  **The 'Cooling-Off' Branch:** There must be a live branch where the patient says "No" and the system pauses. Currently, the 'No' triggers the medication. Under a PAP regime, the 'No' would trigger a **review**.
  2.  **Procedural Liberty:** Freedom would no longer be located in the *outcome* (getting the treatment you wanted when well) but in the *process* (having a genuine opportunity to resist).
  3.  **Burden of Proof:** Currently, the burden is on the patient to prove they are well enough to refuse (which the revoke-proof clause makes impossible). Under a PAP regime, the burden might shift to the clinicians to prove that the current refusal is *not* a valid exercise of agency, despite the past directive.

  ### Summary

  The Ulysses clause practice presupposes a **Compatibilist, Diachronic Theory of Autonomy**. It posits that you are most free when your actions align with your deep, enduring values (Time 1), even if that requires constraining your superficial, immediate desires (Time 2). It rejects the idea that freedom requires the ability to do otherwise at the moment of action.

  The revoke-proof clause fits this theory but tightens the screws until they strip the threads; it attempts to make the 'well' self's definition of reality unassailable. If the law were to demand the 'ability to do otherwise', the Ulysses clause would cease to be a binding contract and would become merely strong evidence of prior intent, always defeasible by a competent present refusal. The 'mast' to which Odysseus tied himself would have to be fitted with a quick-release mechanism that he could operate even while singing to the Sirens.

  In British legal terms, the current practice privileges the **sanctity of the prior autonomous will** over the **liberty of the present physical person**. To shift that balance would require us to view the manic patient not as a ship that has lost its captain, but as a captain who has changed course, and who retains the right to steer even into the storm.
