answer: |-
  1. **Dependency-Ordered Sequence (50 Minutes)**

      *   **00:00–05:00 | Setup & Constraints**
          *   *Prerequisites:* None.
          *   *Action:* State the goal: Determine if Special Relativity forces Eternalism (Block Universe). Define terms: "Presentism" (only now exists) vs. "Eternalism" (past, present, future equally real).
          *   *Licenses:* Establishes the metaphysical stakes without physics yet.
          *   *Refusal:* Announce here (see Section 6).

      *   **05:00–15:00 | The Scenario (Physics Phase)**
          *   *Prerequisites:* Acceptance of Special Relativity's postulates (constant $c$).
          *   *Action:* Introduce the Example (see Section 2). Draw the sketch: Two stick figures passing at a point, one distant star. Ask the class: "Do they agree on what is happening at the star *now*?"
          *   *Licenses:* Establishes Relativity of Simultaneity (RoS) intuitively.
          *   *Note:* Do not mention "existence" yet. Stick to "what time is it there?"

      *   **15:00–25:00 | The Consequence (Physics Phase)**
          *   *Prerequisites:* Acceptance of RoS from previous step.
          *   *Action:* Reveal the numerical result (days/weeks difference). Explain the numbers (see Section 2). Ask: "If Observer A says the event is future, and Observer B says it is past, can both be right about the *time*?"
          *   *Licenses:* Forces the realization that "now" is not a universal slice.
          *   *Boundary:* **Stop Physics Here.** Do not proceed until students agree that simultaneity is frame-dependent.

      *   **25:00–30:00 | The Pivot (Metaphysics Begins)**
          *   *Prerequisites:* Agreement that simultaneity is frame-dependent.
          *   *Action:* Introduce the bridge premise: "If an event is simultaneous with 'here-now' for *any* inertial observer, it is real."
          *   *Licenses:* Moves from "different clocks" to "different ontologies."
          *   *Skepticism Flag:* Do not say "This proves existence." Say "The argument requires us to accept..."

      *   **30:00–40:00 | The Argument & The Coordinate Objection**
          *   *Prerequisites:* The Bridge Premise.
          *   *Action:* Derive Eternalism. Invite the "Just Coordinates" objection (Physics students). Address it using the line in Section 3.
          *   *Licenses:* Tests the robustness of the metaphysical claim against physical conventionalism.
          *   *Skepticism Flag:* When addressing the coordinate objection, do not say "Physics is wrong." Say "Physics describes coordinates; metaphysics asks what coordinates represent."

      *   **40:00–45:00 | The Strongest Objection**
          *   *Prerequisites:* Full statement of the Rietdijk–Putnam argument.
          *   *Action:* Present the "Relativized Existence" objection (see Section 4).
          *   *Licenses:* Shows the argument is not a deductive slam-dunk but a choice of premises.

      *   **45:00–50:00 | Closing Question**
          *   *Prerequisites:* Exposure to both the argument and the objection.
          *   *Action:* Pose the Closing Question (see Section 5). Collect answers.
          *   *Licenses:* Ends on critical evaluation rather than doctrine.

  2.  **The Single Example**

      *   **The Scenario:** Two pedestrians, Alice and Bob, pass each other on Earth. Alice is stationary relative to the ground; Bob walks at 1.5 meters per second towards a distant galaxy (1 million light-years away). A supernova occurs in that galaxy.
      *   **The Sketch:** On the whiteboard, draw a dot for Earth. Draw two short arrows crossing at the dot (Alice and Bob's paths). Draw a distant dot for the Galaxy. Label the distance $D$ and velocity $v$.
      *   **The Question:** "Alice and Bob synchronize watches at the moment they pass. According to Alice, the supernova happens 'now'. According to Bob's definition of 'now', has the supernova already happened, or is it still in the future?"
      *   **The Result:** Bob thinks the supernova happened roughly one week earlier than Alice does.
      *   **Why the Numbers Work (One Sentence):** "Because the simultaneity shift equals velocity times distance divided by light-speed squared, a walking pace across a million light-years sweeps out a week."
      *   **Constraints Check:**
          *   Not Andromeda Aliens: Uses a supernova in a generic distant galaxy.
          *   Prose + Sketch: Simple crossing arrows and two dots.
          *   Poseable: Students can guess "same time" (wrong) or "different" (right).
          *   Mundane Speed: Walking pace.
          *   Macroscopic Time: One week.

  3.  **Misconception Map**

      | Misconception | Where in Sequence to Head Off | The Line I Say There |
      | :--- | :--- | :--- |
      | **Block Universe = Fatalism/Determinism** | 00:00–05:00 (Setup) | "Eternalism means all times *exist*, not that events are *caused* by the future; a block universe can still contain random quantum events." |
      | **Involvement of Minds/Consciousness** | 05:00–15:00 (The Scenario) | "We are talking about coordinate frames, not human perception; a robot or a rock has a frame of reference just as much as a person." |
      | **Conflation with Light-Travel Delay** | 15:00–25:00 (The Consequence) | "This is not about when we *see* the light; this is about where we draw the line of 'now' after correcting for light travel time." |
      | **Time Dilation is Doing the Work** | 15:00–25:00 (The Consequence) | "Time dilation changes clock *rates*; relativity of simultaneity changes clock *settings*; we are only using the latter here." |
      | **"Just Coordinates" (Physics Module)** | 30:00–40:00 (The Argument) | "Your physics lecturer is correct that synchronization is a convention, but this argument asks whether *existence itself* should depend on that convention." |

  4.  **Strongest Objection (5 Minutes)**

      *   **Which One:** The "Relativized Existence" objection (Presentism compatible with Relativity).
      *   **Why:** It accepts the physics but rejects the metaphysical bridge premise. It is stronger than "Free Will" objections because it doesn't require denying Special Relativity, only denying that existence must be absolute.
      *   **How to State It:** "Why must existence be absolute? Perhaps 'what exists' is just like 'what is simultaneous'—relative to a frame. Alice's present exists for Alice; Bob's present exists for Bob. There is no single 'Block,' only overlapping frames of existence."
      *   **Instructor Skepticism Flags:**
          1.  *Location:* Introducing the Bridge Premise (25:00–30:00).
              *   *Risk:* I might say "Surely existence can't be relative."
              *   *Neutral Wording:* "The argument assumes that existence cannot be relative. If you reject this assumption, the argument fails."
          2.  *Location:* Addressing the Coordinate Objection (30:00–40:00).
              *   *Risk:* I might sound too sympathetic to the physicists saying "It's just math."
              *   *Neutral Wording:* "The physicist says coordinates are arbitrary. The metaphysician asks: if coordinates are arbitrary, is what they measure also arbitrary?"

  5.  **Closing Question**

      *   **The Question:** "Which is the smaller cost to your worldview: accepting that the future already exists, or accepting that what exists depends on how you are moving?"
      *   **Competent Answer:** "I would rather accept the Block Universe because relative existence makes causality impossible to define across frames." (Identifies the trade-off).
      *   **Slogan-Only Answer:** "Time is an illusion." (Recites a phrase without engaging the premises).
      *   **Diagnostic Failure:** "If the future exists, I can't change it, so I won't study." (Confuses Eternalism with Fatalism, which was explicitly ruled out in the Setup).

  6.  **Refusals**

      *   **What to Refuse:** General Relativity (gravity/curvature) and Quantum Mechanics (non-locality). Also refuse deep dives into Free Will.
      *   **The Sentence:** "We are bracketing gravity and quantum mechanics to see if Special Relativity *alone* forces this conclusion; adding complexity later won't fix the foundational logic we are testing today."

  KEY MISCONCEPTION: Conflating coordinate dependence with ontological unreality.
