answer: |-
  It is a pleasure to correspond with someone who listens to a programming meeting with such care. Your intuition is quite correct: that single sentence is doing a great deal of heavy lifting, and your artistic director (AD) has leveraged its ambiguity to bypass several difficult arguments.

  You are also right about Du Bois. While the 1926 lecture *Criteria of Negro Art* is indeed where the famous line appears, Du Bois spent much of his life wrestling with the tension between art as a vehicle for truth and art as a vehicle for messaging. In various essays for *The Crisis* (the magazine you recall), he argued that while art *should* serve the cause of racial justice, it ceases to be effective art if it sacrifices beauty for messaging. He wanted propaganda *by* artists, not merely propaganda *as* art. Your AD has separated the message from the medium in a way Du Bois likely would have rejected.

  Per your request, I have laid out the distinct claims hidden within that sentence. I have separated them into the four levels you identified: what art *is* (Ontology), what artists *do* (Intention), what happens to the work (Reception), and how we *judge* it (Evaluation).

  ### 1. The Four Distinct Claims

  **Claim A (Ontological): "All art constitutes propaganda by its very nature."**
  *   **Meaning:** The definition of art and the definition of propaganda are identical. There is no such thing as a non-political object.
  *   **Verdict:** **Trivially True or Simply False**, depending on definition.
      *   If "propaganda" is defined so broadly that it means "any communication that affects a viewer," then it is trivially true but useless (like saying "all food is chemistry").
      *   If "propaganda" means "systematic persuasion towards a specific ideological end," the claim is simply false. A watercolour of a bowl of fruit is not inherently an argument for monarchy or capitalism.

  **Claim B (Intentional): "All artists intend their work to propagate a view."**
  *   **Meaning:** Every creator, consciously or unconsciously, aims to persuade the audience of something.
  *   **Verdict:** **Simply False.**
      *   Many artists intend to explore, to question, or to express confusion rather than to persuade. To claim they are *all* propagandists ignores the phenomenology of making art. It attributes a secret agenda where none exists.

  **Claim C (Reception/Functional): "All art functions as propaganda in the world, regardless of intent."**
  *   **Meaning:** Once a work is released, society will use it to support or undermine the status quo. Silence is interpreted as consent.
  *   **Verdict:** **Substantive and Defensible.**
      *   This is the strongest reading. In a unequal society, a play that ignores inequality may inadvertently comfort the privileged. This is not about what the play *is*, but what work it *does* in a specific context. This is likely what Du Bois meant in 1926: in a racist society, ignoring race is a political act.

  **Claim D (Normative/Evaluative): "All art *ought* to be propaganda, and should be judged on that basis."**
  *   **Meaning:** Artists have a moral duty to take a side, and aesthetic quality is secondary to political utility.
  *   **Verdict:** **Substantive but Contested.**
      *   This is a moral demand, not a fact. It is defensible as a political stance (especially for a marginalised group fighting for visibility), but it is not an objective truth about art.

  ### 2. The Word "Must": Fact or Demand?

  You asked particularly about the word "must". In the sentence *"all art is propaganda and ever must be,"* the word oscillates between prediction and command.

  *   **As Prediction (Fact):** It suggests it is *unavoidable* that art will be used politically. If this is true, it is a claim about the world (Claim C above).
  *   **As Command (Demand):** It suggests artists *should not resist* this fate. It is a call to arms (Claim D above).

  The danger lies in sliding from one to the other. Your AD is using the **Prediction** ("You can't help it, silence is political") to enforce the **Command** ("Therefore you must be explicitly political").

  However, if it is truly an unavoidable fact (Claim A or C), then arguing for it is redundant. If art *must* be propaganda no matter what, why refuse the play about the garden? It is already propaganda for the status quo, so staging it would prove the director's point. By refusing it, he implies the artists *could* have made it different. This reveals that he treats the "must" as a demand on intention (Claim D), not an unavoidable fact of reception.

  ### 3. The Problem of Self-Reference

  You asked whether a claim about "all persuasion" can be evidence for itself. This is a classic philosophical trap.

  If the statement *"All art is propaganda"* is itself a piece of discourse, is it propaganda?
  *   **If Yes:** Then the statement is merely a tool to persuade you to adopt the director's ideology. It is not an objective truth; it is a weapon. You are not obliged to accept a weapon's assessment of itself.
  *   **If No:** Then the statement is false, because here is at least one piece of speech (the director's quote) that is attempting to state a neutral fact, not propagate a view.

  By quoting Du Bois as a "settled" fact, the director is trying to stand outside the system he describes. He claims to see the truth of art, while simultaneously claiming no one can see art truthfully (because it's all propaganda). This is inconsistent.

  ### 4. Licensing the Director's Conclusions

  Let us look at your director's two conclusions and see which claim licenses them.

  **Conclusion 1: "A play which declines to take a side is propaganda for things as they are."**
  *   **License:** This relies on **Claim C (Reception)**.
  *   **Validity:** This is defensible. A quiet play about a garden, performed in a time of housing crisis, *can* be read as an assertion that private leisure is more important than public struggle.
  *   **Caveat:** This depends on context. If your theatre's mission is to provide respite for a burnt-out community, the "propaganda" might be "rest is necessary," which is also political. The director assumes only one kind of politics counts.

  **Conclusion 2: "Questions of craft and beauty are beside the point once that fact is recognised."**
  *   **License:** This relies on a distortion of **Claim D (Evaluation)**.
  *   **Validity:** **Simply False.**
      *   This is where your director betrays Du Bois. Du Bois argued that for propaganda to work, it *must* be beautiful. Bad art is ignored; bad propaganda is laughed at. If craft is "beside the point," the propaganda fails to reach anyone.
      *   The director is using the "propaganda" label to lower the bar for programming. He is saying, "Because this is political, we don't need to worry if it's good." Du Bois would have called this negligent.

  ### 5. The "Play He Loves" Test

  Finally, you asked whether he would accept this reading if applied to a play he loves. This is the most effective way to test his consistency in the room.

  Suppose your director loves *The Cherry Orchard* or *Much Ado About Nothing*. Neither is explicitly political on the surface.
  *   **Apply Claim C:** *The Cherry Orchard* depicts the fall of the aristocracy. Is it propaganda for communism? Or for nostalgia? If "all art is propaganda," he must be able to name the specific political side these plays take.
  *   **Apply Claim D:** If he argues that *Much Ado* is valuable *despite* its lack of modern political engagement, he admits that craft and beauty *do* matter independently of propaganda.
  *   **The Trap:** If he says, "Shakespeare is propaganda for Humanism," he has stretched the word "propaganda" until it means nothing (Claim A). If he admits some plays are just "beautiful," he has contradicted his own rule.

  ### Summary for Your Meeting

  You do not need academic training to spot that a single sentence is being used to close down discussion rather than open it. Here is how you might articulate your trouble to the team:

  1.  **On Du Bois:** "Du Bois argued that art *should* serve the cause of justice, but he also insisted it must remain *art*. He did not say craft was beside the point. In fact, he argued that without beauty, the propaganda fails."
  2.  **On Neutrality:** "I agree that silence can be political (Claim C). But refusing a well-made play about a garden because it isn't *explicitly* political assumes we know exactly how the audience will receive it. Are we programming for the audience, or for our own theory of the audience?"
  3.  **On Consistency:** "If all art is propaganda, then we must be able to name the propaganda in the classics we love. If we can't, then 'propaganda' is just a word we use to reject new work we don't understand."

  Your director has taken a nuanced argument about racial representation in 1920s America and turned it into a blunt instrument for programming in the North of England. It is perfectly reasonable to ask that the tool be handled with more care.
