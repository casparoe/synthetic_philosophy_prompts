answer: |-
  **Marta:** The repetition is the hinge. You're fixated on the fact that most marks are unique, but twelve of them appear twice. In a set of sixty-one, that's statistically distinct from random scratching. If these were just votive offerings, why encode them? Why incise?

  **Dev:** Because encoding doesn't equal accounting. You're leaping from "marked" to "counting" because that's where the literature goes when clay tokens show up. But look at the context. They're under a floor, packed with a broken jar and a sheep scapula. That's a foundation deposit. The marks might signify ownership, or lineage, or a name invoked for protection. The moment you call it a counting system, you're importing bureaucracy into a house pit.

  **Marta:** I'm not importing bureaucracy; I'm inferring management. The house wasn't abandoned. They laid a new floor directly on top and lived there for two more generations. This wasn't a burial or a shrine sealed off. It was operational data stored where the household head could access it, then deprecated when the inventory changed. The refittable jar suggests a single event—emptying a container into the pit. Maybe a seasonal tally reset.

  **Dev:** Or the breaking of the jar *was* the event. You're treating the ash lens and the cut marks on the scapula as incidental debris. They're the primary signal. It's a consecration. And you haven't dealt with the regional gap. Nothing comparable within 200 kilometers. If this is a counting system, where are the counterparts? Trade networks don't stop at site boundaries.

  **Marta:** Innovation isn't uniform. Maybe this is a local experiment in resource tracking. That's why the marks on the storage jars matter. We found crude versions of these incisions on rims and handles in the domestic rubbish. If the clay cones are the ledger, the jars are the invoices. It ties the deposit to daily economic flow.

  **Dev:** Or the jar marks are maker's marks, and the cones are something else entirely. You're braiding two different datasets because they look similar, not because they function together. And frankly, calling it a "ledger" assumes a level of abstraction that the rest of the assemblage contradicts. Look at the other houses. House B had four stone beads under the floor. House C had seven bone points. No ash, no jars. If House A is an archive, what are B and C?

  **Marta:** That's actually where my argument tightens. It's not one strong analogy hanging by a thread; it's several weak lines braided together. House A is the administrative center—hence the clay and ash. Houses B and C are subordinate units using different media—beads for livestock, points for tools. The heterogeneity suggests a system flexible enough to use different counters for different commodities.

  **Dev:** That's a convenient save, but it's unfalsifiable. You're saying the difference in material proves the same function. I'd say the difference in material proves different functions. Beads aren't clay tokens. Bone points aren't accounting records. By stretching the definition of "token" to include anything buried under a floor, you drain the word of meaning. And if the meaning is that specific to this site, are we really doing archaeology, or just writing fiction about this specific pit?

  **Marta:** It's not fiction if it predicts patterns. If I'm right, we should find wear patterns on the cones consistent with handling, not just burial. But let's step back. I'm willing to consider mundane alternatives. What if they're gaming pieces? A board game set stored in a jar?

  **Dev:** I've thought about that. But gaming pieces usually come in sets of matching types. These are mostly unique. I'm more inclined to think they're a craft tally—maybe a weaver's kit for pattern counting. But even that assumes a level of standardization I don't see. My point isn't that we can't know anything. It's that "ritual deposit" is the better category because it accounts for the ash, the scapula, and the breaking of the jar without requiring a specific semantic decode.

  **Marta:** But isn't "ritual" just a bucket for "we don't know"? You said earlier that the meaning is unrecoverable. If you admit the content is inaccessible, is "foundation deposit" actually an explanation, or just a label for the context?

  **Dev:** It's an explanation of action, not intent. I can infer they performed a consecration without knowing the prayer. You're trying to recover the prayer. The category "ritual" has content: it predicts segregation from domestic trash, association with structural transitions like floor laying, and the inclusion of organic remains like the scapula. Your "accounting" category predicts standardization and reuse. These were buried once.

  **Marta:** They were buried once because the record was obsolete. That's why the house stayed in use. But here's the methodological knot. You're saying reliable inference requires braiding weak lines. I tried that with the jars and the other houses. You said the braid snaps because the materials differ. So where does that leave us? Does that principle help me trap you, or does it trap us both?

  **Dev:** It relocates the dispute. The braiding works for me because the ash, the bone, and the placement all point to a single type of event: a deposition ceremony. For you, the lines point in different directions. The jars suggest use; the burial suggests discard. The uniqueness suggests identity; the repetition suggests quantity. You're asking us to hold contradictory signals as one signal.

  **Marta:** Or I'm asking us to accept that economic practice is messy. But fine. Let's talk falsification. What finding settles this against you?

  **Dev:** If we find a temple complex nearby with identical deposits, but clearly votive, that undermines the household-specific reading. Or if microwear shows the cones were never handled after firing—made specifically for the pit. That kills the "tool" argument. What about you?

  **Marta:** If we find a workshop context where these were being mass-produced without regard for the marks, that kills the "unique record" idea. Or if the zooarchaeologist finds the scapula was cooked and eaten immediately before burial, rather than selected for symbolic value. Actually, wait—if the scapula shows signs of butchery consistent with standard food waste, not ritual selection, that weakens your "consecration" claim. It becomes just a dinner scrap tossed in.

  **Dev:** Agreed. So where do we direct the lab work? I'd want the conservator looking at the breakage patterns on the jar. Was it broken before burial, or smashed into the pit?

  **Marta:** I want the soil chemists sampling the ash lens. Is it hearth sweepings? Or burned offering residue? And I'd re-excavate the interface between the deposit and the floor. Was there a container holding the cones, or were they loose?

  **Dev:** If they were loose, it favors my reading. Deliberate scattering. If they were bagged or boxed, it favors yours.

  **Marta:** Exactly. So we're not done. We just disagree on what the box would mean.

  **Dev:** We disagree on whether we should be looking for a box, or looking for the fire that made the ash. You're chasing the system. I'm chasing the event.

  **Marta:** Then let's hope the lab doesn't decide we're both chasing ghosts.
