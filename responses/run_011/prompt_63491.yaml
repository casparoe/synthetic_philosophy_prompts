  **PRIVATE BRAINSTORMING: AREAS OF DIVERGENCE AND OVERLAP**

  Before drafting the joint statement, I must isolate where the camps are talking past one another versus where they fundamentally differ.

  1.  **Verbal Disagreement (The Label):** Camp A uses "conspiracy theory" to denote a specific *kind* of faulty reasoning (unfalsifiable, monolithic). Camp B uses it descriptively for *any* hypothesis of covert coordination. Much of the heat comes from Camp B hearing "falsehood" when Camp A says "conspiracy theory," while Camp A hears "normalcy" when Camp B says "conspiracy."
  2.  **Burden of Proof:** Camp A places the burden on the claimant to produce documentation (leaks, records) to overcome the institutional presumption. Camp B views the allegation itself as a demand for transparency, arguing that requiring documents beforehand guarantees secrecy succeeds. This is a procedural disagreement about who must move first.
  3.  **Sample Bias:** Both agree exposed conspiracies (COINTELPRO, Tuskegee) exist. Camp A sees them as rare outliers proving the rule of institutional reliability. Camp B sees them as proof that the *structure* of the allegation was valid ex-ante, even without documents. They disagree on whether the existence of true conspiracies validates the *method* of arriving at them without evidence.
  4.  **Psychological Correlates:** Camp A argues that belonging to certain social epistemic bubbles lowers credibility. Camp B argues this is an ad hominem fallacy; a broken clock is right twice a day. They agree psychology describes the believer, but disagree on whether it epistemically tarnishes the belief.
  5.  **Substantive Disagreement (Priors):** Ultimately, Camp A assigns a low prior probability to large-scale covert coordination due to structural fragility. Camp B assigns a higher prior based on historical incentive structures. This is not verbal; it is a genuine clash of Bayesian priors.

  *Decision for Draft:* I will frame the Shared Commitments to acknowledge the psychological/structural distinction without resolving the prior probability dispute. In Section I, where wording cannot be identical, I will use the "contested wording" constraint.

  ***

  **JOINT STATEMENT ON THE EPISTEMOLOGY OF COVERT COORDINATION**

  **I. Shared Commitments**

  The undersigned parties, representing structural skepticism and particularist inquiry respectively, affirm the following substantive claims regarding the epistemology of allegations involving covert coordination.

  1.  **Historical Reality:** Covert coordination by powerful actors to deceive the public or manipulate outcomes is a historical fact. Documented instances including the FBI's COINTELPRO, the CIA's MKUltra, the Tuskegee syphilis study, Iran–Contra, and the tobacco industry's manufacture of doubt establish that institutions sometimes conspire. Denying the possibility of such events is historically indefensible.
  2.  **Statistical Rarity:** While covert coordination occurs, the vast majority of specific allegations claiming large-scale, long-term secret cooperation are false. The historical record contains far more failed allegations than confirmed conspiracies. Both camps agree that believing every allegation would result in a highly inaccurate worldview.
  3.  **Psychological Limits:** Correlations between conspiracy belief and specific psychological traits or social isolation describe the population of believers but do not determine the truth value of individual claims. The genetic fallacy applies: the origin of a belief does not logically entail its falsity, though it may inform风险评估 (risk assessment) regarding the reliability of the source.
  4.  **Secrecy Constraints:** Secrecy is subject to logistical constraints. As modeled in actuarial leak studies (e.g., Grimes 2016), the probability of a secret being maintained decreases as the number of conspirators increases and the duration of the secrecy extends. Both camps accept that mathematical modeling of leak probabilities is relevant to assessing the plausibility of specific claims.
  5.  **Error Costs:** Each camp's favored policy of belief produces characteristic errors. A policy of high skepticism (Camp A) risks false negatives, allowing actual abuses to persist by dismissing early allegations as noise. A policy of low skepticism (Camp B) risks false positives, allocating investigative resources to phantom threats and eroding trust in functional institutions. Both camps acknowledge that their preferred heuristic carries a cost.
  6.  **Contested Wording on Definition:**
      *   *Camp A Wording:* The term "conspiracy theory" properly refers to hypotheses that exhibit structural defects such as unfalsifiability and the assumption of monolithic agency, distinguishing them from warranted suspicions of misconduct.
      *   *Camp B Wording:* The term "conspiracy theory" properly refers to any hypothesis positing covert coordination, regardless of eventual truth value, and should not be reserved solely for false claims.

  **II. Residual Disagreements**

  The following table outlines the remaining substantive and verbal disagreements that prevent full consensus on epistemic policy.

  | Neutral Label | Camp A Formulation (Structural Skeptic) | Camp B Formulation (Particularist) | Drafter's Judgment |
  | :--- | :--- | :--- | :--- |
  | **Default Presumption** | Institutional accounts deserve a defeasible presumption of truth due to internal auditability and competitive scrutiny, defeated only by documentation. | Institutional accounts deserve no special presumption given the incentive and capacity to conceal, requiring neutrality until investigation. | Substantive. Disagreement on the baseline prior probability of institutional honesty. |
  | **Diagnostic Markers** | Markers like unfalsifiability and monolithic agency are reliable ex-ante indicators of falsehood that justify dismissal without full investigation. | These markers are often present in true conspiracies before exposure and thus cannot justify dismissal without evidence. | Substantive. Disagreement on the predictive validity of structural features. |
  | **Function of Label** | The label "conspiracy theory" serves a necessary epistemic function by categorizing a distinct type of low-quality reasoning. | The label functions primarily as a conversational stop sign that protects power by stigmatizing inquiry. | Mixed. Partly verbal (definition), partly substantive (social effect). |
  | **Evidence Threshold** | An allegation is not warranted until supported by primary records or leaked documentation that survives audit. | An allegation is warranted by motive and opportunity, serving as the trigger for the investigation that produces documents. | Substantive. Disagreement on the burden of proof required to initiate serious inquiry. |
  | **Sample Interpretation** | Exposed conspiracies are rare exceptions that prove the rule of institutional reliability; their rarity justifies high skepticism. | Exposed conspiracies are the visible tip of an iceberg; their existence proves the mechanism is ordinary and viable. | Substantive. Disagreement on base rate inference from biased samples. |

  **III. Cruxes**

  To move beyond stalemate, both camps agree that the following sub-questions must be addressed. We specify the tests that would bear on them and record our divergent predictions.

  **1. The Concealment–Sample Problem**
  *   **Sub-question:** What, if anything, follows about base rates from a sample of conspiracies selected entirely on their exposure?
  *   **Test:** Comparative actuarial modeling that calibrates leak probabilities on exposed cases but adjusts for the selection bias of exposure, attempting to estimate the ratio of hidden-to-exposed conspiracies.
  *   **Predictions:** Camp A predicts the model will show that large-scale secrets are mathematically unsustainable, implying the hidden sample is negligible. Camp B predicts the model will show that moderate-scale secrets are sustainable for long periods, implying a significant hidden sample.
  *   **Mind-Change:** Camp A would lower their skepticism if the model demonstrated that secrets involving hundreds of actors could reliably remain hidden for decades. Camp B would increase skepticism if the model demonstrated that such secrets inevitably leak within short timeframes. Both acknowledge that no model can perfectly account for the unobserved, but significant deviation from current estimates would shift priors.

  **2. Ex-Ante Diagnostic Markers**
  *   **Sub-question:** Can the structural markers Camp A treats as diagnostic (unfalsifiability, monolithic agency) separate warranted from unwarranted conspiracy beliefs when applied *ex ante* to cases whose outcomes are unknown?
  *   **Test:** A blind historical audit where both camps apply their diagnostic criteria to a dataset of allegations from the past fifty years, excluding known outcomes, to see which criteria predict eventual confirmation or debunking.
  *   **Predictions:** Camp A predicts their structural markers will correlate highly with falsehood. Camp B predicts the markers will fail to distinguish true cases (like Tuskegee) from false ones prior to exposure.
  *   **Mind-Change:** Camp A would abandon their structural presumption if the audit showed their markers flagged confirmed conspiracies as false at a high rate. Camp B would accept structural heuristics if the audit showed that allegations lacking documentation but possessing these markers were overwhelmingly false.

  **3. Institutional Presumption**
  *   **Sub-question:** Whether testimony from institutions deserves a defeasible presumption, and whether that presumption is uniform across kinds of institution or varies with the institution's exposure to rival scrutiny.
  *   **Test:** Comparative analysis of error rates in institutional accounts across sectors with varying levels of external competition (e.g., intelligence agencies vs. competitive corporate markets).
  *   **Predictions:** Camp A predicts institutions with high external scrutiny will have near-perfect accuracy, justifying a strong presumption. Camp B predicts that even scrutinized institutions retain the capacity for coordinated deception in specific domains, justifying only weak presumption.
  *   **Mind-Change:** Camp A would reduce their presumption if data showed high-scrutiny institutions frequently coordinate falsehoods successfully. Camp B would increase their presumption if data showed that competitive scrutiny makes coordinated deception statistically negligible.

  **4. Definitional Stipulation**
  *   **Sub-question:** Whether a definition of the target term can be given that is neither self-sealing (builds in falsity) nor so broad that it covers every claim about covert coordination, and how much of the decade-long dispute would evaporate if it could.
  *   **Test:** A conceptual analysis workshop to draft a neutral terminology (e.g., "covert coordination hypothesis" vs. "epistemically defective conspiracy theory") and measure whether disagreement persists under the new terms.
  *   **Predictions:** Camp A predicts disagreement will persist because the defect lies in the reasoning, not the label. Camp B predicts disagreement will diminish because the stigma currently drives the epistemic penalty.
  *   **Mind-Change:** Camp A admits no outcome would fully change their view, as they believe the reasoning defect is real regardless of naming. Camp B would accept a differentiated terminology if it ceased to be used as a rhetorical shield against investigation.

  **IV. Drafter's Note**

  In my assessment as the neutral drafter, the most productive disagreement lies in the **Ex-Ante Diagnostic Markers** crux. The dispute over definitions (Crux 4) is largely verbal, and the dispute over base rates (Crux 1) is mathematically constrained by the inability to observe the unobserved. However, the utility of structural markers is empirically testable via historical audit.

  For Camp A to be substantially right, it must be true that the structural features they identify (such as immunization against counter-evidence) are genuinely more prevalent in false allegations than in true ones *before* the truth is known. If true conspiracies inherently look like "conspiracy theories" during their operation, then Camp A's heuristic is not a truth-tracking tool but a bias-maintenance tool. Conversely, for Camp B to be substantially right, it must be shown that investigating allegations lacking documentary evidence yields a sufficient rate of confirmation to justify the resource expenditure. If the yield is negligible, Camp B's policy becomes epistemically reckless. The collaboration succeeds not if we agree on the prior, but if we agree on the test that validates the heuristic.
