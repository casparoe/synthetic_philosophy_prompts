  **Advice on the Formal Model**
  Do not build the model. It is a trap. In twelve months, a philosopher constructing a formal model of belief formation will likely produce something economists find naive and philosophers find opaque. Conceptual sharpening yields more credit with this committee than a rudimentary formalization that consumes the year.

  ***

  **Proposal**

  **Research Question**
  Does Popper's growth-of-knowledge argument refute the existence of feedback-opaque mechanism laws, or merely their knowability by situated agents? This question admits a determinate answer: either the argument establishes a metaphysical impossibility for such laws, or it establishes only an epistemic limitation for inquirers embedded within the system.

  **The Argument and Standard Readings**
  Popper's central argument against historicism runs as follows: the course of history is strongly influenced by the growth of human knowledge; we cannot predict the future growth of our own knowledge by rational or scientific methods; therefore, we cannot predict the future course of history. Standard readings leave my question open because they treat Popper's target as monolithic. Some interpreters claim Popper denies the existence of all social laws; others claim he denies only long-term prophecy. Both miss the structural ambiguity of the phrase "law of history." They fail to distinguish mechanism laws (invariant causal processes) from developmental laws (stage ordering). Consequently, they cannot explain why Popper accepts piecemeal engineering, which assumes some stability, while rejecting historicism. The feedback distinction resolves this: piecemeal science uses feedback-transparent laws; historicism claims feedback-opaque ones. My project determines whether Popper's argument destroys opaque mechanism laws or merely shields them from internal prediction.

  **Method**
  *   **Months 1–3:** Conceptual reconstruction. I will define feedback opacity rigorously using philosophical logic rather than formal modeling. I will establish the metaphysical versus epistemic distinction.
  *   **Months 4–6:** Textual analysis. I will map Popper's examples against the three law types (sequential, mechanism, developmental). I will determine if his arguments target existence or knowability.
  *   **Months 7–9:** Comparative analysis. I will test the distinction against Hayek and Marx to ensure it captures the historicist debate accurately without anachronism.
  *   **Months 10–12:** Synthesis. I will draft the monograph chapter and article, refining the metaphysical versus epistemic distinction based on prior findings.

  **Rejected Alternatives**
  I reject pure exegesis because it ignores systematic validity, treating Popper's texts as artifacts rather than arguments. I reject the contemporary social-ontology debate about mechanisms because it is too detached from Popper's specific epistemic constraints. I reject the literature on self-fulfilling social predictions because it focuses on semantics rather than the causal structure of knowledge growth. This approach isolates the causal mechanism of knowledge growth itself, offering a structural explanation for the limits of prediction that applies beyond Popper's specific texts.

  **Deliverable**
  A successful result will be one journal article submitting the feedback-opacity distinction to the philosophy of social science literature, and one book chapter reconciling Popper's piecemeal engineering with his anti-historicism. These will demonstrate that the growth-of-knowledge argument is compatible with invariant social mechanisms, provided those mechanisms are feedback-transparent.

  **Failure Conditions**
  *   If feedback opacity collapses into the distinction between open and closed societies, the framework adds no value.
  *   If Popper's texts show he considered mechanism laws metaphysically impossible, the epistemic reading fails.
  *   If the economist on the committee demonstrates that feedback-opaque laws are routinely modeled in econometrics, the philosophical distinction lacks traction.

  **Where this is most likely to go wrong**
  The weakest step is assuming feedback-opacity is binary. If opacity is a matter of degree, the metaphysical and epistemic split blurs. If agents can partially anticipate knowledge growth, the argument loses force. I would abandon the hunch if historical cases show agents successfully predicting knowledge-driven shifts despite opacity. The nearby question: How do institutions stabilize feedback-opaque processes enough for partial prediction? This would shift the project from metaphysics to institutional design.
