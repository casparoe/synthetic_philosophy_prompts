      *   *Refining the Dementia Analysis:* It's the pivot. Dev treats it as a post-crime condition (irrelevant to guilt). Marisol treats it as a pre-punishment condition (relevant to sanction). Both are partially right. The tension is between *Guilt* (past) and *Sanction* (present).
      *   *Refining the Contract Argument:* Dev is stronger here. Marisol's "agent has changed" is vague. The legal system *does* seize assets from demented people for past torts. Why not criminal sanctions? Because criminal sanctions require *mens rea* at the time (which he had) AND often capacity at trial (which he might lack). Marisol conflates trial capacity with sentencing capacity.
      *   *The Missed Move:* The **Statute of Limitations** argument. It's the societal compromise between Dev's "always owed" and Marisol's "utility decays." It acknowledges the debt but admits enforcement becomes unjust over time.

  5.  **Review against Constraints:**
