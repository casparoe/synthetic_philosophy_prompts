answer: |-
  You have identified the central philosophical fault line in modern applied statistics, often termed the "Fundamental Confidence Fallacy." Your intuition is correct: the standard reporting practice is a hybrid that relies on frequentist calculations to justify Bayesian-sounding conclusions, while reciting frequentist doctrine to ward off philosophical criticism.

  The "long-run story" is largely vestigial in the discussion section. When an author writes, "the true effect is likely between X and Y," they are making a claim about the *parameter*, not the *procedure*. The frequentist justification (that 95% of such intervals in hypothetical replications would contain the truth) does not license this specific claim about this specific interval. In strict frequentist theory, once the interval is calculated, the probability is either 0 or 1. The long-run story does live work during the *design* phase (power analysis) and the *review* phase (checking error rates), but it is functionally abandoned during the *interpretation* phase.

  The argument you half-heard about "ruling out" values is rooted in error-statistical philosophy (associated with Deborah Mayo). It suggests that while you cannot assign a probability to the parameter being in the interval, you can claim that values *outside* the interval have been "severely tested" and found wanting. If a null value lies outside the 95% CI, the data are inconsistent with that null (at $p < .05$). This allows a claim about *inconsistency* rather than *plausibility*. It rescues the practice from being pure nonsense, but it does not justify the common language of "likely" or "plausible" ranges. It justifies saying, "We have ruled out values outside this range," which is a weaker claim than "The value is probably inside this range."

  In reality, the reporting practice presupposes a Likelihood or Bayesian view of evidence. It treats the interval as a region of high posterior density (assuming a flat prior) without doing the work of specifying a prior or checking the calibration. The field is effectively behaving as "subjective Bayesians" who use "objective Frequentist" tools because they are computationally cheaper and historically mandated.

  If the field adopted the interpretation it already uses (treating CIs as credible intervals), reporting would need to change to acknowledge uncertainty about the model and priors. We would stop talking about "significance" and start talking about "degrees of belief" or "evidence ratios." However, the replication-reform machinery (preregistration, registered reports) would largely survive, though its justification would shift.
  *   **Frequentist Justification:** Preregistration prevents "p-hacking" and optional stopping, which inflate Type I error rates and break the long-run guarantees of the p-value and CI.
  *   **Bayesian/Likelihood Justification:** While the Likelihood Principle suggests stopping rules are irrelevant to the evidence *in the data*, optional stopping and selective reporting introduce *publication bias* and distort the *literature*. Reforms are still necessary to ensure the data generation process is transparent, even if the specific statistic used is robust to stopping rules. The reforms protect the integrity of the scientific record, not just the error rate of the test.

  So, the reforms are robust to the switch, but the *reason* we need them changes from "controlling false positives" to "preventing biased inference."

  Verdict: coherent-only-on-a-reading-nobody-states
