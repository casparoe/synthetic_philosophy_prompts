answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, Regional Water Utility
  **FROM:** [Your Name], Board Member
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Rule for Spillway Design Under Deep Uncertainty

  **1. Purpose**

  Next month, we must vote on the design standard for the new reservoir spillway. We have three proposals on the table: (1) a cost-benefit analysis based on the midpoint of the hydrologic range; (2) construction to the worst-case upper bound regardless of cost; and (3) the assignment of a subjective probability distribution to integrate over the range.

  This memo argues that all three proposals conflate **risk** with **ambiguity**. By adopting one of them, we would be establishing a precedent that forces us to pretend we know more than we do, or to spend ratepayer money without a defensible metric.

  I propose we adopt a fourth option: a **Minimax Regret Rule with a Fiscal Constraint.** This memo outlines the reasoning, distinguishes the types of uncertainty we face, and offers a repeatable policy for future infrastructure decisions where climate data is contested.

  **2. Risk vs. Ambiguity: The Core Distinction**

  To justify our decision to the public, we must be precise about what the hydrologists are telling us.
  *   **Risk** exists when we know the odds (e.g., a 1% chance of a flood). We can price this using insurance markets or standard cost-benefit analysis.
  *   **Ambiguity (Knightian Uncertainty)** exists when we do not know the odds (e.g., the chance is somewhere between 0.1% and 5%, and the models disagree on why).

  Our hydrologists have handed us ambiguity. The gauge record is too short, and climate projections diverge. The range of 900 to 1,700 m³/s is not a confidence interval around a mean; it is a boundary of plausibility.

  The board is currently treating this ambiguity as if it were high risk. That is a category error.
  *   **Risk Aversion** is unwillingness to accept a gamble with known odds.
  *   **Ambiguity Aversion** is unwillingness to accept a gamble where the odds themselves are unknown.

  It is rational to be ambiguity-averse. However, we cannot price ambiguity using standard tools designed for risk. If we pretend the uncertainty is merely risk (by picking a midpoint or assigning subjective probabilities), we are engaging in false precision. If we ignore cost entirely (by picking the worst case), we are engaging in fiscal negligence.

  **3. Critique of Current Proposals**

  *   **The Midpoint (Option 1):** This treats the range as a probability distribution with a known mean. It is mathematically unsound. If the true 100-year flow is 1,700 m³/s, the "savings" from building to the midpoint will be wiped out instantly by dam failure. This approach hides ambiguity rather than managing it.
  *   **The Worst-Case (Option 2):** This eliminates technical risk but creates financial risk. Doubling the capital cost based on a plausible but unverified upper bound is difficult to justify to ratepayers. It assumes the upper bound is certain, which the hydrologists explicitly deny.
  *   **The Subjective Distribution (Option 3):** While sophisticated, this requires us to invent probabilities where none exist. It allows our personal biases to masquerade as data. Two different boards could assign two different distributions to the same data and reach opposite conclusions. This is not a repeatable rule.

  **4. Proposed Rule: Minimax Regret with a Fiscal Constraint**

  I propose we adopt a decision rule based on **Minimax Regret**.

  In decision theory, "regret" is the difference between the outcome of the decision we made and the outcome we *would* have made if we had known the truth in advance.
  *   If we build small and the flood is large, our regret is the cost of the damage.
  *   If we build large and the flood is small, our regret is the wasted capital (the "overbuild" cost).

  **The Rule:** *When facing deep ambiguity with convex costs, the Board shall select the design standard that minimizes the maximum potential regret across the plausible range, subject to a cap on rate impact.*

  **Application to this Vote:**
  We calculate the "regret" at various design points between 900 and 1,700 m³/s.
  1.  **Under-building Regret:** Cost of dam failure + retrofit vs. cost of building higher.
  2.  **Over-building Regret:** Excess construction cost vs. cost of building lower.

  We find the point where the worst-case regret is lowest. Given the convex cost curve (costs double at the top), the Minimax Regret point will likely be higher than the midpoint but lower than the worst case. It finds the "sweet spot" where we are least exposed to looking foolish in hindsight, whether the flood is small or large.

  **The Fiscal Constraint:** To protect ratepayers, we apply a cap. If the Minimax Regret solution requires a rate increase exceeding X%, we revert to the highest design point within that budget. This forces us to acknowledge that ambiguity buffering has a price limit.

  **5. Public Accountability**

  This approach allows us to answer the ratepayer's question: *"Why is my bill going up?"*

  *   **Wrong Answer:** "Because there is a 5% chance of a massive flood." (We don't know that chance.)
  *   **Wrong Answer:** "Because we want to be perfectly safe." (Safety is infinite; money is not.)
  *   **Right Answer:** "Because the scientific data is unclear. We are paying an 'Ambiguity Premium' to ensure that whether the hydrologists are optimistic or pessimistic, this utility remains solvent and the dam remains safe. We are minimizing our exposure to being wrong."

  This is honest. It admits we do not know the future, but asserts we have a rigorous method for not betting the farm on a guess.

  **6. Invitation for Dissent**

  I invite my colleagues to challenge this on two grounds:
  1.  **Is Regret the right metric?** The "Worst-Case" proponent may argue that dam failure is unacceptable regardless of regret. If so, we must declare safety an absolute constraint, not a variable, and admit we are prioritizing safety over economic efficiency explicitly.
  2.  **Is Ambiguity distinct from Risk?** The "Actuary" may argue that all decisions require priors, and refusing to assign probabilities paralyzes action. If so, we must defend *which* priors we are using and why they are public policy rather than private belief.

  **7. Recommendation**

  I move that we adopt the **Minimax Regret with Fiscal Constraint** rule as our standard for infrastructure design under deep uncertainty. For this specific vote, I request staff model the regret curve across the 900–1,700 m³/s band so we can identify the specific design flow that minimizes our maximum exposure.

  This rule does not remove the discomfort of uncertainty. It simply ensures we are not hiding from it behind false numbers.

  Respectfully,

  [Your Name]
  Board Member, Regional Water Utility
