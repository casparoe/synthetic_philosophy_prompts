answer: |-
  The file on Elias's desk was physically light. That was the first thing he noticed, the second he lifted it from the morning pile. It lacked the drag of a proper hazard. A warehouse in Leeds, full of textile machinery, came with three inches of fire suppression logs, ten years of loss runs, and a surveyor's report that smelled of damp concrete. This file contained four sheets of paper, a glossy brochure for the *Kite-IV*, and a photocopy of a hand-drawn schematic from 1792.

  The *Kite-IV* was to be moored in the Pentland Firth, a submerged turbine tethered to the seabed like a balloon. It had never generated a watt of commercial power. There was no history of failure because there was no history of operation. The 1792 schematic was a tide mill from Brittany, wood and stone, destroyed by a storm in its third winter. The manufacturer's projections were printed on high-gloss stock, promising efficiency curves that climbed like ski jumps. The opinions of Dr. Aris and Mr. Vance were typed on letterhead, both men stating that the physics held, provided the materials held, provided the sea behaved within the modeled parameters.

  Elias rubbed his thumb over the corner of the brochure. The paper was smooth, expensive. It felt like money. The rest of the file felt like air.

  It was Tuesday. The slip needed to be signed by Thursday close of business.

  The room hummed with the low-frequency noise of the market. Phones murmured in their cradles; the occasional shout drifted from the box where the brokers stood. Elias watched the dust motes dancing in the light from the high windows. He picked up his pen, tapped it against the blotter, and set it down. He was not calculating the rate. The rate was already circled in red ink on the top sheet. Fifteen percent.

  Julian appeared at the edge of the desk. He didn't sit. He leaned against the partition, holding a cup of tea that stained the rim brown.

  " Fifteen is the number," Julian said. He wasn't asking.

  "It's the number," Elias said.

  "Marshalls is taking a line. So is Sterling. If we pass, we're out of the syndicate for the next round. You know how that looks."

  Elias nodded. He knew. It looked like weakness. It looked like you didn't have the capital, or the nerve.

  "The rate is adequate," Elias said. "For the probability."

  Julian took a sip of tea. "Then what's the hesitation? The maths works. I ran the scenarios. Even if the tether snaps, the salvage value covers the deductible. If the blades shear, the manufacturer warrants the replacement. We're writing the gap, not the whole thing."

  "The maths works," Elias repeated. He looked at the 1792 schematic. The ink was faded, the lines shaky. A mill wheel turning in the surf. A turbine spinning in the current. The logical relation between the evidence and the outcome was identical in both cases. The chance of destruction was a function of force versus resistance. You could draw a line between the two points.

  But the line was suspended over a void.

  "It's the thickness," Elias said.

  Julian frowned. "The steel? It's high-tensile. Vance signed off on it."

  "Not the steel. The file." Elias tapped the four sheets. "When I write a line on the Leeds warehouse, I'm writing on top of a mountain. There's so much stuff underneath the number that the number feels heavy. It stays where I put it. Here..." He lifted the file again, letting it flutter slightly in the draft from the vent. "There's nothing underneath. The number floats. I write it, and it might drift away."

  Julian straightened up, setting his tea on the partition ledge. "Everyone is writing it, Elias. The market has settled. The consensus is the ground. You don't need the mountain if everyone is standing on the same patch of grass."

  "Consensus isn't ground," Elias said, but he kept his voice flat. He wasn't arguing. He was describing the texture of the paper.

  "If you wait for perfect information, you'd never write a ship. You'd never write a crop. We're in the business of the gap."

  "I know what business we're in."

  "Then initial the slip. Thursday is two days away. Don't let the perfect be the enemy of the profitable." Julian pushed off the partition and walked back toward the boxes, merging into the flow of suits and voices.

  Elias looked at the slip. It was a standard form, green paper, pre-printed clauses. He picked up the pen again. He thought about the 1792 mill. The storm that destroyed it hadn't been in the models of the time. There were no models. There was only the sea and the wood. The manufacturer of the *Kite-IV* had models. They had simulations of currents that ran for decades in a server farm in Oslo. But the server farm was not the Firth. The simulation was a map. The sea was the territory.

  He thought about the two experts. Aris and Vance. They had never seen the *Kite-IV* underwater. They had seen the CAD drawings. They had seen the tank tests. They were assigning a logical relation to a hypothesis based on evidence that did not touch the thing itself. It was like judging the strength of a bridge by looking at the blueprint and ignoring the river.

  Yet, the rate was fifteen percent. If he asked another underwriter, any of the ten men currently smoking on the terrace, they would say fifteen percent. If he asked a computer, it would output fifteen percent based on the inputs provided. The number was stable. It was objective, in the sense that everyone agreed upon it.

  But agreement was not substance.

  Elias stood up and walked to the window. The rain was streaking the glass, blurring the city outside. Below, the traffic moved in a steady stream, headlights reflecting on the wet asphalt. People were making decisions everywhere. Crossing the street. Changing lanes. Signing contracts. None of them had complete information. None of them knew the weight of the evidence beneath their feet. They moved because they had to move. Stopping was not an option.

  He returned to the desk. He opened the drawer and took out a fresh nib. He fitted it into the holder. The action was precise, mechanical. It grounded him. He dipped the pen into the inkwell. The black liquid caught the light.

  He looked at the slip. The line for his signature was blank. Above it, the terms were listed. *Total Insured Value: £4.5 million. Period: 12 months. Warranty: Maintenance logs submitted monthly.*

  If he signed, he was not saying the turbine would survive. He was not saying the probability of loss was low. He was saying that fifteen percent was the price of standing in the room. Julian was right about that much. To refuse was to leave. To stay was to play.

  But the feeling in his chest was not the thrill of the gamble. It was the quiet recognition of the void. He was not measuring the risk. He was acknowledging that measurement was impossible, and yet the pen must move.

  He placed the nib on the paper. The ink bloomed into the fiber, a small dark flower. He wrote his initials. They looked like anyone's initials. They did not carry the weight of the Leeds warehouse. They did not carry the weight of the 1792 mill. They were just marks.

  He blew on the ink to dry it. He stacked the four sheets back into the file. He placed the file in the out-tray.

  Julian glanced over from the next desk, saw the file in the tray, and gave a single nod. A transaction completed. The market continued.

  Elias leaned back in his chair. He listened to the hum of the room. He thought about the turbine spinning in the dark water, miles away, untouched by human hands. He thought about the storm that might come in November, the one not in the simulation. He thought about the quiet winter where nothing happened, and the premium was earned without a claim.

  There was no way to know which future was true. There was no way to know if his initials were a signature of wisdom or a signature of folly. The ink was dry. The file was light. The Thursday deadline was still two days away, but the decision was done. He picked up the next file from the pile. It was heavy, thick with logs and history. He opened it, but the words swam before his eyes. He could feel the weight of the paper, the solidity of the past, but it felt like a different kind of fiction.

  He reached for his tea. It was cold. He drank it anyway. The market noise rose and fell like a tide, indifferent to the numbers written on the green slips, indifferent to the weight of the evidence, indifferent to the void beneath the ink. He picked up his pen again. There was more work to do. There was always more work to do. The hand moved because the hand must move. The number was written because the number was required. Beyond that, there was only the rain against the glass, and the waiting.
