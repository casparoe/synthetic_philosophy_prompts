          *   Many relations are not numerically measurable.
          *   Some hypotheses are incomparable.
          *   **Weight** = amount of relevant evidence behind the probability.
          *   Two people can have the same probability assessment but different weights (epistemic positions).
          *   Novel contingencies lack calculable basis; decisions are taken by something other than weighted averages.
      *   **Situation:** A specialist underwriter in a small reinsurance market must decide by Thursday on insuring the first operating season of a unique technology (single physical installation, specific place). No loss history. Evidence: one imperfect analogue from another century, manufacturer's projections, opinions of two experts who haven't seen it run.
