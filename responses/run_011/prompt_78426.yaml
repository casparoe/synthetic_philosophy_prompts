prompt: |-
  I'm a third-year PhD student applying for a four-month summer stipend that wants a short proposal plus one finished paper at the end, and I need help turning a half-formed hunch into that proposal. The hunch: everyone treats the paradox of phenomenal judgment as a single argument, but I think it's actually two arguments sharing a premise. The causal one says that if the quale does no work, my report is fully explained by the physics, so its being true is either a miracle or a brute nomological coincidence. The content one says that even if the tracking is law-governed and so not coincidental, it's still unclear why the physical state causing the report is *about* the phenomenal property rather than about its physical correlate — so the judgment could be perfectly reliable and still not have the content it claims. My suspicion is that the stock epiphenomenalist replies (acquaintance, or the psychophysical laws guaranteeing the correlation) only answer the causal version, and that the content version is the real problem — and that it might not be restricted to epiphenomenalism at all, since what it needs is explanatory idleness rather than strict causal inertness, which arguably also covers some non-reductive physicalisms and maybe Russellian monism.

  So: state the question precisely enough that it has a determinate answer, explain why the existing positions leave it open, lay out what I'd actually do week by week over the four months and why that method rather than just re-running the standard objection, describe what success looks like (I'm imagining an explicit criterion for when a view escapes the problem, applied to a handful of views), and be blunt about what would make the project fail or quietly degenerate into a survey. Push back on the hunch where it's shaky. No citations, I'll add those myself.
