      *   **Context:** 75-minute seminar, next Monday. They know Arrow's Theorem (2 weeks of lectures), haven't seen a proof, think they're "above strategic voting".
      *   **Goal:** In-class activity to demonstrate Gibbard-Satterthwaite (GS) without naming it until the debrief. Let them discover manipulation themselves.
      *   **Key Constraints:**
          *   No mention of "theorem" or "manipulation" until debrief.
          *   Phase 1: Let them vote on 3 options (stakes involved, e.g., budget/reading). Points-based payoffs. Multiple rounds to learn/trust.
          *   Phase 2: Design a voting rule that nobody can exploit. Force onto-ness (surjectivity) to prevent trivial solutions (like "always pick B"). Expect them to fail or reinvent dictatorship.
          *   Phase 3: Single-peaked preferences (options on a line). Show lying stops paying off (median voter theorem intuition). Facilitation moves for groups who don't notice.
          *   Blunt "What Will Go Wrong" section (abstract points, liars in Phase 3, apathetic students).
          *   Honest Limits section (n=3, small n, computational complexity vs. existence).
          *   Format: Materials List, Minute-by-Minute Timeline, Debrief Questions, Limits Section.
          *   Ending: Single line "Verdict: [sentence]".

  2.  **Evaluate the User's Rough Idea:**
      *   *Idea:* 3 options (budget/reading), points payoffs, multiple rounds, design-a-rule phase, single-peaked phase.
      *   *Assessment:* This is actually a very strong structure. It mirrors the logical flow of social choice theory (General domain -> Impossibility -> Restricted domain -> Possibility).
      *   *Refinement Needed:*
          *   *Stakes:* "Budget for social" is good, but needs to be concrete enough to generate preferences but low stakes enough not to cause actual conflict. "Which reading gets dropped" is often more salient for students. Let's suggest "Which reading gets dropped" or "Format of the seminar next week" to keep it academic but stakes-real. Actually, "Budget allocation" (Option A: Pizza, Option B: Drinks, Option C: Save for next year) is classic. Let's stick with the user's "Budget/Social" idea but make it concrete (3 venues/types).
          *   *Points:* Needs to be private information. If everyone knows everyone's preferences, it's a game of perfect information. GS is about private preferences. Need secret ballots + private payoff sheets.
          *   *Phase 2 (Design a Rule):* This is tricky in 75 mins with 16 people. Getting 16 people to agree on a rule is hard. Better to split into small groups (4 groups of 4) to design rules, then test them? Or one rule chosen by the class? The prompt asks for "a middle phase where *they're* turned loose designing a voting rule". With 16 people, this could eat time. I need to structure this tightly. Maybe 4 groups propose rules, class votes on which rule to use, then test *that* rule for manipulability.
          *   *Phase 3 (Single-Peaked):* Need to ensure the options are *actually* single-peaked for everyone. If I assign preferences, I control this. If they generate preferences, I risk non-single-peakedness. For the lesson to work, I should probably *assign* preferences in Phase 3 to guarantee the structure, or guide them heavily. The prompt says "options get quietly laid out along a line... so that preferences are single-peaked". I need to ensure the payoff structure reflects this.
          *   *Constraints:* "Force onto-ness". I need to make sure they can't say "We always pick Option B". The rule must depend on votes.
          *   *Limits:* Need to be precise about $n=3$ alternatives (GS requires $\ge 3$) and finite voters.

  3.  **Drafting the Plan:**

      *   **Materials:** Payoff sheets, ballots, rule design worksheets, whiteboard.
      *   **Timeline:**
          *   Intro (5 mins)
          *   Phase 1: General Domain Voting (20 mins) - Let them lie.
          *   Phase 2: Constitutional Convention (20 mins) - Design a rule.
          *   Phase 3: Single-Peaked Restriction (20 mins) - Median voter intuition.
          *   Debrief (10 mins) - Reveal GS.
          *   *Correction:* 75 mins total. The above sums to 75. Need to be tight.
          *   Phase 1: 15 mins.
          *   Phase 2: 20 mins.
          *   Phase 3: 15 mins.
          *   Debrief + Limits: 15 mins.
          *   Total: 65 + 10 buffer? No, 75 hard stop.
          *   Revised: Intro (5), P1 (20), P2 (20), P3 (15), Debrief (15). Total 75.

      *   **Phase 1 (The Trap):**
          *   3 Options (A, B, C).
          *   Private payoff sheets (randomly distributed types).
          *   Rule: Plurality or Borda? Plurality is easier to manipulate strategically (compromise voting). Borda is also manipulable. Let's use Plurality for simplicity, or Instant Runoff. Actually, to show GS, *any* non-dictatorial rule works. Plurality is easiest to understand.
          *   Run 3 rounds. Allow discussion between rounds. They will likely discover strategic voting by round 2.

      *   **Phase 2 (The Impossible Task):**
          *   Task: Design a rule that maps votes to outcomes.
          *   Constraints: Must be onto (all 3 options possible), non-dictatorial (no single person decides), deterministic.
          *   Groups of 4 design a rule.
          *   Test: Instructor acts as "adversary" knowing their rule and preferences, tries to find a lie. Or swap groups to test each other. Swapping is better for engagement.
          *   Goal: They realize any rule they make has a loophole.

      *   **Phase 3 (The Escape Hatch):**
          *   Options are now spatial (Left, Center, Right).
          *   Assign preferences that are single-peaked (e.g., Type 1: L>C>R, Type 2: C>L>R, Type 3: C>R>L, Type 4: R>C>L). No "C is worst" for anyone.
          *   Rule: Median voting (or just Plurality on a line).
          *   Show that truth-telling is dominant (or at least, lying doesn't help).
          *   Facilitation: If someone lies and wins, check if preferences were actually single-peaked.

      *   **What Will Go Wrong:**
          *   Points abstract: Use concrete rewards (e.g., "Winner gets to choose the music" or actual candy). Let's stick to the prompt's "points-based payoffs" but make them translate to something tangible (e.g., highest score gets a chocolate bar).
          *   Liar in Phase 3: If preferences aren't strictly single-peaked, lying might work. I need to enforce the preference types.
          *   Apathy: Some won't care. Need to gamify it.

      *   **Limits:**
          *   $m=3$ alternatives is the minimum for GS.
          *   Finite $n$.
          *   Existence vs. Frequency (GS says *exists*, not *always*).
          *   Computational complexity (finding the lie might be hard).

  4.  **Refining the "Design a Rule" Phase:**
      *   This is the hardest part to run smoothly. 16 students designing a rule in 20 mins is chaotic.
      *   Better: Split into 4 groups. Each group proposes a rule. The class votes on which rule to adopt for a "test round". Then the Instructor (or opposing groups) tries to break it.
      *   Constraint Check: "Force onto-ness". I need to explicitly state: "Your rule must be capable of producing A, B, or C depending on votes. You cannot say 'Always B'."
      *   Constraint Check: "Non-dictatorial". "No single student's ballot decides the outcome regardless of others."

  5.  **Refining Phase 3 (Single-Peaked):**
      *   To ensure single-peakedness, I should *assign* preference orders based on seating or cards, rather than letting them choose. If they choose, someone will inevitably have non-single-peaked preferences (e.g., extreme preferences for cheap and lavish but hate medium).
      *   Instruction: "For this round, your preferences are determined by your seat number."
      *   Options: Cheap (£10), Medium (£20), Lavish (£30).
      *   Preference Types:
          *   Rows 1-4: Prefer Cheap > Medium > Lavish.
          *   Rows 5-8: Prefer Medium > Cheap > Lavish.
          *   Rows 9-12: Prefer Medium > Lavish > Cheap.
          *   Rows 13-16: Prefer Lavish > Medium > Cheap.
      *   This guarantees single-peakedness on the spectrum Cheap-Medium-Lavish.
      *   Rule: Plurality.
      *   Outcome: Medium should win (Median Voter). Lying (voting Cheap when you prefer Medium) risks Lavish winning.

  6.  **Debrief Questions:**
      *   Need to lead them from "I lied" to "The system forced me" to "Is there any system that doesn't?" to "Unless we restrict preferences."

  7.  **Limits Section:**
      *   Need to mention that GS is about *possibility* of manipulation, not *probability*.
      *   Mention computational complexity (Bartholdi et al.).
      *   Mention infinite alternatives vs 3.

  8.  **Formatting:**
      *   Materials List.
      *   Minute-by-Minute.
      *   Debrief Questions.
      *   What Will Go Wrong.
      *   Honest Limits.
      *   Verdict line.

