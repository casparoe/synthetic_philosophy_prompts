answer: |-
  # Seminar Plan: The Impossibility of Honest Voting

  ## Materials List
  *   **Preference Cards (32 total):** Two sets.
      *   *Set A (Phase 1):* 16 cards with random strict rankings of Options X, Y, Z (ensure a mix, e.g., 5 XYZ, 5 YZX, 6 ZXY).
      *   *Set B (Phase 3):* 16 cards assigned by seat row. Rows 1-4: Cheap>Medium>Lavish. Rows 5-12: Medium>Cheap>Lavish OR Medium>Lavish>Cheap. Rows 13-16: Lavish>Medium>Cheap. (Ensures single-peakedness).
  *   **Ballot Slips:** Small scraps of paper, plenty of spares.
  *   **Payoff Sheet:** Projected on screen. 1st choice = 3 points, 2nd = 1 point, 3rd = 0 points. Top 3 scorers in the room get a chocolate bar each (or equivalent tangible stake).
  *   **Whiteboard & Markers:** For tallying and rule drafting.
  *   **"Veto" Stamp (Optional):** A physical prop to reject rules in Phase 2.

  ---

  ## Minute-by-Minute Timeline

  ### 00:00 – 00:05 | Introduction & Stakes
  *   **Script:** "Today is about decision-making. We have three options for the end-of-term social: **X (Pub)**, **Y (Club)**, **Z (Park Picnic)**. Your goal is to maximize your personal points based on your private preference card. Do not show your card to anyone. Top 3 point-scorers across all rounds get chocolate. We will vote several times. You may change your vote between rounds. You may talk between rounds."
  *   **Action:** Distribute **Set A** cards. Explain payoff sheet.
  *   **Constraint:** Do not use words like "strategy," "manipulation," "truth," or "theorem."

  ### 00:05 – 00:25 | Phase 1: The General Domain (Plurality)
  *   **Rule:** Plurality (Most votes wins. Ties broken by coin flip).
  *   **Round 1 (5 mins):** Collect ballots. Tally publicly. Announce winner. Students calculate points.
  *   **Discussion (5 mins):** Allow open discussion. "Why did you vote for that?" "Who is unhappy?"
  *   **Round 2 (5 mins):** Collect ballots. (Expect shift in votes as blocs form).
  *   **Round 3 (5 mins):** Collect ballots. (Expect strategic consolidation).
  *   **Facilitation:** If everyone votes honestly and loses, ask: "Did anyone get a result they liked less than another possible outcome?" If someone admits to voting for their 2nd choice to stop their 3rd choice, highlight it neutrally: "Interesting choice. Note that down."
  *   **Goal:** Students realize honest voting leads to worse payoffs than coordinating a lie.

  ### 00:25 – 00:45 | Phase 2: The Constitutional Convention
  *   **Task:** Split into 4 groups of 4. "Design a voting rule for this class that prevents anyone from getting a better outcome by lying about their preferences."
  *   **Constraints (Write on Board):**
      1.  **Onto:** The rule must be able to produce X, Y, or Z depending on votes. (No "Always pick Y").
      2.  **Non-Dictatorial:** No single student's card decides the outcome automatically.
      3.  **Deterministic:** Same votes = same outcome.
  *   **Activity (15 mins):** Groups draft rules. You circulate.
      *   *Intervention:* If a group proposes "Always pick the medium option," veto it using Constraint 1. "This rule cannot produce X or Z. Reject."
      *   *Intervention:* If they propose "Student 1 decides," veto using Constraint 2.
  *   **Testing (5 mins):** Swap rules between groups. Group A tries to find a scenario where Group B's rule allows a voter to lie and gain points.
  *   **Goal:** They will either fail to find a rule or realize every rule has a loophole. Most will converge on "It's impossible" or propose a dictatorship disguised as a rule.

  ### 00:45 – 01:00 | Phase 3: The Restricted Domain (Single-Peaked)
  *   **Setup:** "New scenario. Options are now **Cheap (£10)**, **Medium (£20)**, **Lavish (£30)**. These lie on a line."
  *   **Action:** Collect Set A cards. Distribute **Set B cards** (assigned by seat to guarantee single-peakedness).
  *   **Rule:** **Median Voting.** "We will arrange all votes on the line. The option closest to the middle vote wins."
  *   **Round 1 (5 mins):** Vote. Tally.
  *   **Discussion (5 mins):** "Did anyone benefit from lying?"
      *   *Facilitation Move (If someone claims they benefited):* Check their card. If they preferred Medium but voted Cheap, and Cheap won, ask: "Would Medium have won if you voted truthfully?" (Usually yes, because Median is robust). If they say yes, point out the lie was unnecessary. If they say no, check if their preferences were actually single-peaked (e.g., did they prefer Cheap > Lavish > Medium? If so, they broke the phase constraint).
  *   **Round 2 (5 mins):** Allow discussion. Vote again.
  *   **Goal:** Students notice lying doesn't change the median, or risks pushing the outcome further away. Truth-telling becomes stable.

  ### 01:00 – 01:15 | Debrief & Limits
  *   **Reveal:** "Phase 1 and 2 demonstrated the **Gibbard–Satterthwaite Theorem**. Phase 3 demonstrated **Single-Peaked Preferences**."
  *   **Questions (Ask in order):**
      1.  "In Phase 1, at what point did you feel forced to vote for something other than your favorite? What triggered that?"
      2.  "In Phase 2, why was 'Always pick Medium' forbidden? What would happen to the group's welfare if we allowed that rule?" (Answer: Ignores intensity/unanimity).
      3.  "In Phase 2, did any group successfully design a rule that wasn't a dictatorship? If not, what does that imply about collective decision-making?"
      4.  "In Phase 3, what changed? Why did lying stop paying off? Was it the rule or the preferences?"
      5.  "If we added a fourth option 'Luxury Coach (£40)', would Phase 3 still work? Why?"
  *   **Honest Limits (Verbal Script - 5 mins):**
      *   "GS proves a *possibility* of manipulation, not that *everyone* always lies. In real life, lying might be hard to calculate."
      *   "We used 3 options. GS requires at least 3. With 2 options, majority rule is strategy-proof."
      *   "We assumed you knew everyone's preferences in Phase 2. In reality, incomplete information makes lying riskier."
      *   "Computational Complexity: Finding the beneficial lie might be too hard for a computer, let alone a human (Bartholdi et al.). So 'theoretically manipulable' doesn't always mean 'practically broken'."

  ---

  ## What Will Go Wrong (And How to Fix It)
  1.  **Abstract Points:** Students won't care about "3 points."
      *   *Fix:* Put the chocolate bars on the desk at the start. Remind them every 10 minutes: "Top 3 scores get these."
  2.  **The Apathetic Pair:** Two students refuse to engage or say "I like all options equally."
      *   *Fix:* Assign them a specific role card privately. "For this exercise, I need you to hold this specific preference order to make the math work. Please play the role."
  3.  **The Phase 3 Liar:** A student lies in the Median phase and claims it worked.
      *   *Fix:* This usually means their preferences weren't single-peaked (e.g., they hate the Medium option). Check their card. If they hold Cheap > Lavish > Medium, pull them aside: "Your preferences aren't single-peaked on this line. You broke the experimental condition. Your result doesn't count."
  4.  **Phase 2 Gridlock:** Groups spend 15 mins arguing about fairness rather than rule mechanics.
      *   *Fix:* Interrupt at minute 10. "Stop debating ethics. Write down the algorithm. Input: Votes. Output: Winner. How do you stop a lie?"

  ---

  ## Honest Limits (Instructor Notes)
  *   **Universal Domain:** This seminar uses $n=16$ voters and $m=3$ alternatives. GS holds for any $n$ and $m \ge 3$, but students might think this only applies to small classes. You must verbally generalize: "This holds for millions of voters too."
  *   **Existence vs. Frequency:** GS says *there exists* a profile where lying helps. It does not say lying helps *often*. In Phase 1, you might need to engineer the preference distribution so manipulation is obvious. If honest voting wins by luck, the lesson fails. (Ensure the preference distribution in Phase 1 creates a Condorcet Cycle or strong spoiler effect).
  *   **Computational Complexity:** Students will conclude "Voting is broken." You must clarify: "Voting is theoretically vulnerable, but finding the exploit might be computationally infeasible. Democracy survives because lying is hard to coordinate, not because it's impossible."
  *   **Time:** This schedule is tight. If Phase 1 runs long, cut Phase 2 discussion time, not Phase 3. Phase 3 is the crucial contrast.

  ---

  ## Debrief Questions (Printable Order)
  1.  "In Phase 1, who voted for their true favorite in Round 1 but changed in Round 3? What changed?"
  2.  "In Phase 2, why did I veto the rule 'Always pick Option Y'?"
  3.  "Did any group in Phase 2 produce a rule that wasn't a dictatorship and wasn't vetoed? What was the loophole?"
  4.  "In Phase 3, why did the 'Median Rule' succeed where Plurality failed?"
  5.  "Does Phase 3 prove Gibbard–Satterthwaite wrong? Why or why not?"

  Verdict: Phase 2 is most likely to collapse because designing a formal voting rule from scratch is cognitively demanding for undergraduates within 20 minutes, often resulting in silence or trivial solutions you have to veto repeatedly.
