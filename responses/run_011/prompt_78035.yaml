      *   *Phase 2:* Designing a rule is hard. I will simplify: Provide 3 candidate rules (Borda, Plurality, Runoff) and ask them to find the exploit in each, then ask them to propose a fix. Wait, the prompt says "designing a voting rule". I'll stick to the prompt but constrain it: "Modify Plurality to stop lying." They will fail.
