      *   *Stakes:* "Points" are abstract. I'll suggest converting points to a tangible reward (e.g., highest aggregate score across class gets a box of chocolates shared, or individual high scorers get candy). Let's suggest individual candy for top 3 scorers to incentivize manipulation.
      *   *Constraint:* "Nobody hears the name of the theorem... until debrief." I must ensure the script doesn't slip.
      *   *Constraint:* "Force onto-ness". I will add a rule to the design phase: "Your constitution must allow A, B, and C to win under some configuration of votes."

  10. **Final Polish:**
