  *Group A:* "This is a natural photo of a Tomato." (Implies veridical color).
  *Group B:* "This is a stylized graphic of a Clay Pot." (Same shape, different label).
  *Wait, if shape is Tomato, calling it a Clay Pot is confusing.*
  *Okay, let's go back to Neutral Shape (Circle).* It's cleaner for "Cognitive" penetration (Label -> Color) vs "Structural" penetration (Shape -> Color).
  *Instruction:* Use a Circle. Hex #E68A5C (Salmon/Terracotta). It sits right on the Orange/Red/Pink boundary.
  *Prime:* Card says "Object: Ripe Tomato" vs "Object: Terracotta Tile".
  *This is robust.*

  *(Final check on Arms)*:
  1. Verbal (0-10 Redness).
  2. Match (Pick from 5 chips).
  3. Speeded (Red/Orange button press... wait, no buttons. Point to word "RED" or "ORANGE" on sheet).
