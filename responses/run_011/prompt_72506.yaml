answer: |-
  This is a fantastic pedagogical instinct. You are correctly identifying that the "Cognitive Penetrability" (CPP) debate is less about whether cognition *can* touch perception (it obviously does, via attention) and more about whether we have the **methodological resolution** to distinguish a shift in *experience* from a shift in *judgment*.

  Your worry is spot-on: **A classroom demo cannot solve the Hard Problem.** It cannot prove perception was penetrated. However, it *can* prove that our measurement tools are hopelessly confounded. If you frame the success condition as "Students realize we can't measure this," the activity succeeds even if the data is noise.

  Here is the design. It leans into the messiness.

  ### 1. The Stimuli (Prep Instructions)

  Your tomato silhouette idea is risky because shape recognition itself triggers memory color. If the shape *is* a tomato, the color shift might be automatic/associative rather than "cognitive penetration" in the philosophical sense (belief/desire affecting early vision).

  **Better Stimulus:** A neutral shape with an ambiguous color. This isolates the *label* (cognition) as the penetrator.

  *   **The Patch:** A perfect circle, 2-inch diameter.
  *   **The Color:** Hex **#E68A5C** (Salmon/Terracotta). This is the critical variable. It must sit on the boundary of "Red" and "Orange" and "Pink."
      *   *Printer Warning:* Laser printers vary wildly. **Print a test page.** If it looks clearly red, add yellow. If clearly orange, add magenta. It needs to look "muddy" or "ambiguous" under your classroom lights.
  *   **The Prime (Index Cards):** Prepare 16 envelopes.
      *   **8 Envelopes (Tomato Condition):** Inside, a card reading: *"You are viewing a digital rendering of a **Ripe Tomato** under neutral lighting."*
      *   **8 Envelopes (Tile Condition):** Inside, a card reading: *"You are viewing a digital rendering of a **Terracotta Tile** under neutral lighting."*
  *   **The Response Sheets:** One per student (see Section 3).

  ### 2. The Protocol (90 Minutes)

  **Roles:**
  *   **You (TA):** Timekeeper, Script Reader, Board Scribe.
  *   **Students:** Subjects / Data Analysts.

  **Minute 0–5: Setup & Distribution**
  *   **Action:** As students enter, hand them an envelope. **Do not let them open it yet.** Seat them so Tomato and Tile conditions are intermixed (e.g., alternate envelopes).
  *   **Script:** "Welcome. Today we are running a calibration study on digital rendering perception. Inside your envelope is a description of the object you are about to see. Do not open it until I say. Do not discuss the contents with your neighbors. If you talk, you ruin the calibration for everyone."

  **Minute 5–10: The Reveal & Fixation**
  *   **Action:** Hand out the Stimulus Sheet (the ambiguous circle printed in the center of a page).
  *   **Script:** "Open your envelopes. Read the card silently. Keep it face up on your desk. Look at the circle on your sheet. You have 30 seconds to observe it. Do not mark anything yet. Just look."
  *   *(Wait 30 seconds)*. "Keep that object label in mind. 'Tomato' or 'Tile'. This defines what the color *should* be."

  **Minute 10–40: The Four Arms (10 mins each)**
  *   *Note: We are doing a within-subjects design on the Measurement Arm to save N, but between-subjects on the Prime. This maximizes the chance of seeing *some* effect in Arm 1, which we will then dismantle in Arms 2–4.*
  *   **Script for Handoffs (Critical):** "Turn the page. Follow the instructions for Task 1 exactly. You have 3 minutes. Go." (Repeat for each task).

      *   **Arm 1: Verbal Estimate (The Standard)**
          *   *Task:* "On a scale of 1 to 10, where 1 is Pure Yellow and 10 is Pure Red, rate the color of the circle. Write the number."
          *   *Goal:* Replicate standard CPP findings (Tomato > Tile).

      *   **Arm 2: Non-Verbal Match (The "Perceptual" Control)**
          *   *Task:* Show a strip of 5 color swatches at the bottom of the page (ranging from Yellow-Orange to Deep Red). "Circle the swatch that physically matches the ink on the page. Ignore the object label. Match the ink."
          *   *Goal:* Remove verbal criteria. If effect persists, it's not just naming.

      *   **Arm 3: Speeded Forced Choice (The "No Reasoning" Control)**
          *   *Task:* "I will say 'Go'. You have 2 seconds. Circle either the word **RED** or **ORANGE** printed below the shape. Do not think. Gut reaction. Ready... Go."
          *   *Goal:* Reduce time for post-perceptual reasoning/criterion shifting.

      *   **Arm 4: Hypothesis Guess (The Demand Check)**
          *   *Task:* "Turn over the sheet. Write one sentence: What do you think this experiment is trying to prove? Why did they tell you it was a Tomato/Tile?"
          *   *Goal:* Quantify demand characteristics.

  **Minute 40–50: The Tally (Public Data)**
  *   **Action:** Draw a 4x2 grid on the board (Rows: Arms 1-4; Cols: Tomato vs. Tile).
  *   **Script:** "I need raw numbers. I'm going to call on you. Tell me your Arm 1 score. I'm writing it up. No commentary."
  *   **Tallying Logic:**
      *   Arm 1: Average the 1-10 scores for Tomato vs. Tile.
      *   Arm 2: Count % choosing "Red" swatches (4 & 5) vs "Orange" swatches (1 & 2).
      *   Arm 3: Count % circling "RED".
      *   Arm 4: Read 3-4 answers aloud. Categorize as "Guessed Hypothesis" vs "Did Not Guess".
  *   **Time Limit:** Hard stop at 50 mins. If data is messy, leave it messy.

  **Minute 50–90: The Debrief (The Actual Lecture)**
  *   See Section 4.

  ### 3. The Response Sheet (Content)

  **Header:** `ID: ___ | Condition: [Tomato / Tile]`

  **Task 1:** "Rate the redness of the circle (1 = Yellow, 10 = Red)."
  `[ _______ ]`

  **Task 2:** "Circle the swatch below that matches the ink physically."
  `[Swatch 1: Orange] [Swatch 2: Yellow-Red] [Swatch 3: Red-Orange] [Swatch 4: Red] [Swatch 5: Deep Red]`
  *(Note: Print these swatches carefully. They should step clearly from Orange to Red.)*

  **Task 3:** "Speeded Decision. Circle one word immediately."
  `[   RED   ]   [   ORANGE   ]`

  **Task 4:** "What do you think this study is testing?"
  `___________________________________________________________________`

  ### 4. The Debrief Script (Mapping the Wall)

  Do not start by explaining CPP. Start by asking them to interpret the board.

  **Step 1: The "Effect" (5 mins)**
  *   **Ask:** "Look at Arm 1 (Verbal). Did the Tomato group see more red than the Tile group?"
  *   **Likely Outcome:** Yes, or trend in that direction.
  *   **Point:** "This replicates the literature. 'Memory Color' or 'Label' shifts the report."

  **Step 2: The Dissociation (10 mins)**
  *   **Ask:** "Look at Arm 3 (Speeded). Did the effect hold when you had 2 seconds?"
  *   **Likely Outcome:** The effect size should shrink or vanish.
  *   **Point:** "If the percept was truly penetrated, the speeded response should show the same shift. If the effect disappears when you remove reasoning time, the 'penetration' was likely a **response criterion shift**, not a perceptual shift. You had time to think 'Well, it's a tomato, so I'll say it's redder' in Arm 1. You didn't in Arm 3."

  **Step 3: The Demand Explosion (10 mins)**
  *   **Ask:** "Read the Arm 4 guesses." (Read aloud: "You wanted to see if we'd call the tomato redder").
  *   **Point:** "If 50% of you guessed the hypothesis, **Arm 1 is invalid.** You weren't reporting experience; you were being good subjects. This is the *Demand Characteristic* critique (Orne)."

  **Step 4: The Epistemological Wall (15 mins)**
  *   **Script:** "Here is the problem. Arm 1 showed an effect. Arm 3 didn't. Arm 4 says you were guessing.
      *   If I trust Arm 1: Cognition penetrates perception.
      *   If I trust Arm 3: Cognition only affects judgment.
      *   If I trust Arm 4: The whole thing is social compliance.
      *   **Which arm measures 'Experience'?**"
  *   **The Kicker:** "None of them. Arm 1 is verbal. Arm 2 is motor/verbal. Arm 3 is motor/verbal. We have no 'Experience-o-meter'. We are inferring a private state (qualia) from public behavior. Every measure is a **behavioral proxy**. The debate isn't about perception; it's about whether we can trust the proxy."

  ### 5. Honest List of What Will Go Wrong

  1.  **The Null Result:** The printer might make the circle too orange. The Tomato group might rate it 4/10 and the Tile group 4/10.
      *   *Fix:* **Embrace the null.** "Great. Even with a strong prime, we couldn't move the needle. This suggests the percept is *encapsulated* (Firewall view). Or it suggests our measure was too noisy. Which is it? We don't know."
  2.  **The "Smart" Students:** The 3 students who read Firestone & Scholl (2016) will whisper "It's demand characteristics" during the tally.
      *   *Fix:* Pre-empt them. "If you know the literature, I need you to sit on your hands. If you spoil the Arm 4 guess, you ruin the data for the people who don't know it."
  3.  **The "I Knew" Contamination:** One student says "I knew you wanted me to say red" out loud.
      *   *Fix:* This actually *helps* the debrief. It validates Arm 4. Use it. "Exactly. Subject 4 just invalidated their own Arm 1 data. How many of you feel the same?"
  4.  **N=8 is Noise:** The averages on the board will look jagged.
      *   *Fix:* Don't calculate p-values. Look at **Effect Direction**. "Did the mean go up? Okay. Is it reliable? Who knows. But the *pattern* across arms is the lesson."

  ### 6. The Ceiling: What This Cannot Do

  You asked to be straight. Here is the limitation:

  **This activity demonstrates the *Problem of Criteria*, not the *Fact of Penetration*.**

  *   **The Gap:** You cannot reproduce the **Neural/Physiological** argument. The real debate (e.g., Lupyan's work vs. Firestone's) often hinges on fMRI or ERP data (e.g., does the label change V1 activity?). You cannot do that with paper.
  *   **The Risk:** Students might leave thinking "CPP is just about people lying on surveys."
  *   **The Verbal Patch:** You must explicitly say this in the debrief:
      > "Today we used behavioral proxies. In the real literature, they use reaction time, fMRI, and adaptation after-effects to try to bypass the 'report' problem. But even those have confounds. The point of today wasn't to solve CPP. It was to feel why CPP is a *methodological nightmare*. If you leave here thinking 'We can't measure experience directly,' you learned the most important thing."

  **Should you accept it's about Epistemology?**
  **Yes.** Lean into it. The philosophy of perception *is* the epistemology of measurement. If you frame the session as "Let's test if perception is penetrable," you might fail. If you frame it as "Let's test if we can *measure* penetrability," you will succeed.

  **Final Advice on the Stimulus:**
  Spend 20 minutes before class tuning that color. Print 10 versions. Pick the one that makes *you* hesitate. If you don't hesitate, they won't either. The hesitation is the data.
