      *   *1995:*
          *   Immiseration: Real wages still flat, but crime falling, economy recovering from early 90s recession.
          *   Elite Overproduction: Tech boom absorbing talent.
          *   State Fiscal: Deficit reduction era (Clinton surplus looming).
          *   *Verdict:* SDT should be *quiet* here. If it lights up, the theory is too sensitive. Oklahoma City bombing (1995) is a blip of instability, but not systemic collapse.
      *   *Time Constants Critique:* Immiseration (fast), Elite Overproduction (slow, 20-year lag from birth to grad school), State Fiscal (medium). If you average them, you get a smooth curve that predicts instability almost always in a complex society. This is the "always raining somewhere" problem.
      *   *2020 Shock:* Pandemic + George Floyd. SDT predicts *potential* for violence, not the *trigger*. A dry forest (SDT) needs a spark (pandemic/policing). SDT explains the fuel, not the spark.

  4.  **Synthesize the Verdict:**
