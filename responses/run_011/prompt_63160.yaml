      *   **Task:**
          1.  **Forward Analysis (2010):** Map the three drivers (Immiseration, Elite Overproduction, State Fiscal Crisis) to observable data available *in 2010*. Identify loose fits. Evaluate what SDT explains about 2016-2021 vs. what it misses (partisan/racial vs. class, credentialized angry elites, deficit shrinking).
          2.  **Backward Analysis (1968 & 1995):** Apply the same variables to these years. Do they discriminate between 2010 and the past, or do they light up for all three? Address the "separate time constants" critique (speed of variables). Address the 2020 exogenous shock (pandemic/George Floyd).
          3.  **Verdict:** Was 2016-2021 a confirmation, anomaly, or unanticipated case?
          4.  **Falsification:** Propose a specific, falsifiable restatement (outcome + window) that would have been testable in 2015.
      *   **Constraints:** No citations (user will chase them). Be disciplined, honest about loose fits, steelman then attack the critique.

  2.  **Deconstruct the Forward Analysis (2010 Baseline):**
