      *   *Elite Overproduction:* 2010 saw high unemployment among college grads. Law school scam movement (Tammi Tyrell) was active. PhD adjunctification. *Loose fit:* SDT assumes counter-elites mobilize the masses. In 2016, many "counter-elites" were the angry voters themselves (e.g., wealthy Trump voters), or the mobilizers were media figures, not necessarily failed elites in the traditional sense.
      *   *State Fiscal Capacity:* 2008 bailout, 2010 Eurozone crisis (spillover), US debt ceiling fights (2011). *Loose fit:* US debt was high but borrowing costs were low. The "crisis" was political (shutdowns), not necessarily solvency-based.
      *   *What it explains:* General vibe of unrest, distrust in institutions.
      *   *What it misses:* The *direction* of instability (right-wing populism vs. left-wing revolution), the role of culture war vs. economic class, the fact that deficits shrank post-2013 (austerity), yet instability grew.

  3.  **Deconstruct the Backward Analysis (1968 & 1995):**
      *   *1968:*
          *   Immiseration: Actually, late 60s were high growth, low inequality. But relative deprivation existed (civil rights).
