answer: |-
  You are correct: this is a conceptual problem, not a craft problem. You have identified a specific mechanism of power that existing terminology slices around but does not cut through.

  The phenomenon you describe is distinct because the self-deception is not a side effect of the authority; it is the *engine* of the authority. In most literature on power, ignorance is a vulnerability. In your configuration, ignorance is a competency.

  Here is the carving of the concept, the evaluation of its neighbors, and the boundaries you requested.

  ### I. The Near Neighbors (and Why They Fail)

  You have already correctly dismissed the **Grand Inquisitor** and the **Noble Lie**. Both rely on a lucid elite managing a deluded populace. Your figure is part of the delusion he manages.

  **1. Sartrean Bad Faith (*Mauvaise Foi*)**
  *   **The Fit:** This is the closest philosophical neighbor. Bad faith is the act of lying to oneself to escape the anguish of freedom/responsibility. Your character is certainly in bad faith regarding his need to be needed.
  *   **The Failure:** Sartre treats bad faith as an individual ontological failure. It does not account for the *social utility* of the deception. In your novel, the bad faith is not a weakness of the character; it is a strength of the administration. If Sartre's waiter realizes he is acting, he becomes authentic but ceases to be a "waiter" in the symbolic sense. Your character, if he becomes authentic (lucid), ceases to be an *effective* authority. The social function of the self-deception is missing from Sartre.

  **2. Triversian Self-Deception (Evolutionary Psychology)**
  *   **The Fit:** Robert Trivers argues that we deceive ourselves to better deceive others, as a believer leaks fewer cues than a liar. This matches your "hesitation shows" mechanic perfectly.
  *   **The Failure:** Trivers' model is adversarial (predator/prey, mate competition). It assumes a zero-sum game. Your context is paternalistic/merciful. The deception is not to exploit the governed, but to stabilize them. The *teleology* is wrong. Trivers explains why a liar believes his lie; he does not explain why a *benefactor* must believe his benevolence to successfully benefit.

  **3. Ideological Interpellation (Althusser/Žižek)**
  *   **The Fit:** Ideology often requires the subject to believe in the ritual for the ritual to work.
  *   **The Failure:** Modern ideology critique (especially Žižek) often posits the opposite: "They know that what they are doing is false, but still they do it." (Cynical reason). Your character is pre-cynical. He is not sustaining a system he doubts; he is sustaining a system *because* he doubts nothing. Furthermore, ideology usually focuses on the *subject* (the governed) believing. You are focusing on the *agent* (the governor) believing.

  ### II. The Carving: **Constitutive Sincerity**

  Since no existing term captures the *functional necessity of non-lucidity in a benevolent authority*, I propose the concept of **Constitutive Sincerity**.

  It is not merely that the man is sincere; it is that his sincerity is *constitutive* of the power's efficacy. The power does not exist prior to the belief; the belief generates the power.

  **The Conditions of Constitutive Sincerity:**
  1.  **Asymmetry of Motive:** The actor perceives the motive as *M* (Mercy), while the structural reality is *M + P* (Mercy + Power/Need).
  2.  **Opacity as Infrastructure:** Access to *P* (the hidden motive) would degrade the performance of *M*. The "strain" of knowing *P* would signal uncertainty to the governed.
  3.  **Beneficent Teleology:** The action is objectively or subjectively aimed at the welfare of the governed, distinguishing it from predation.
  4.  **Non-Transferability:** The deception cannot be outsourced. A lieutenant cannot know the truth on the general's behalf. The specific authority figure must hold the delusion personally.

  ### III. The Four Boundaries

  You asked for the edges of this concept. Here is where the phenomenon holds and where it dissolves.

  **1. Must the benefit be real?**
  *   **Boundary:** The phenomenon survives the *discovery* that the benefit was illusory, provided the *actor* still believes it was real.
  *   **Distinction:** If the benefit is objectively false, the figure moves from **Constitutive Sincerity** to **Tragic Delusion**. The *mechanism* of authority remains (the governed still obey because he is confident), but the moral valence collapses. However, if the *actor* discovers the benefit is false and continues, it becomes **Villainy**.
  *   **Verdict:** The benefit need not be real, but the *belief in the benefit* must be absolute. The configuration relies on the actor's conviction, not the outcome.

  **2. Does it survive partial awareness?**
  *   **Boundary:** No. This is the sharpest edge.
  *   **Distinction:** A man who suspects and declines to look is practicing **Willful Blindness**. Willful blindness creates "leakage" (micro-expressions, hesitation, over-compensation). Constitutive Sincerity requires successful repression. The moment the actor acknowledges the suspicion, even internally, the "smoothness" fractures.
  *   **Verdict:** It does not survive partial awareness. It requires a closed loop. The moment the loop is breached, the authority becomes "humanized," and in your specific framework, humanized authority is ineffective authority.

  **3. Can an office possess it?**
  *   **Boundary:** Yes, but structurally, not individually.
  *   **Distinction:** An institution can select for **Constitutive Sincerity**. It promotes those who believe and filters out those who become lucid. In this case, the *office* possesses the delusion as a procedural requirement. The incumbent is merely the vessel. If the incumbent becomes lucid, the institution discards him to find a new vessel.
  *   **Verdict:** The institution can sustain the phenomenon longer than the individual, but it requires a constant supply of sincere incumbents. If the institution itself becomes self-aware (e.g., writes it into its bylaws), it becomes a **Noble Lie** and loses the specific mercy of the original configuration.

  **4. Motive vs. Fact?**
  *   **Boundary:** It must be self-deception about *motives*, not *facts*.
  *   **Distinction:** Self-deception about facts (e.g., "The prisoners are not suffering") is **Delusion**. Self-deception about motives (e.g., "I am doing this for them, not for me") is **Rationalization**.
  *   **Verdict:** Your phenomenon is strictly about **Rationalization**. If the man deceives himself about the facts (that the people are actually capable), he is incompetent. He must know the facts (they cannot decide) to be useful. He must only deceive himself about *why he is the one deciding*. The lucidity about the *situation* is required for competence; the opacity about the *self* is required for authority.

  ### Summary for the Draft

  You are writing about a figure who wields **Constitutive Sincerity**.

  *   **The Inquisitor** fails because he knows he is a tyrant.
  *   **The Politician** fails because he knows he is compromised.
  *   **Your Man** succeeds because he knows he is a savior.

  The tragedy (or the horror) of your novel is not that he is lying. It is that if he stops lying to himself, he stops saving them. The mercy is real, but it is funded by a debt he refuses to acknowledge. If he acknowledges the debt, the currency collapses.

  This is not a character flaw; it is a structural requirement of the specific mercy he offers. That is the concept you were circling.
