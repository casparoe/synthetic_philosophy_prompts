answer: |-
  It is entirely understandable that your debate ended in confusion, because the Pusey Barrett Rudolph theorem is frequently misrepresented in popular discussions and even in some technical literature, often conflating the precise definitions of the ontological models framework with broader metaphysical claims. To adjudicate this, we must first fix the definitions of the two camps you mentioned, as formulated by Harrigan and Spekkens. In their framework, we assume that every physical system has a real physical state, denoted by lambda, which exists independently of observation. When we prepare a quantum state psi, we are actually preparing a probability distribution over these underlying lambda states. The distinction between the camps rests entirely on whether these distributions overlap. A model is psi epistemic if distinct quantum states can correspond to overlapping distributions over lambda, meaning that a single underlying physical state could be consistent with multiple different quantum states, much like a probability distribution in classical statistical mechanics represents ignorance about a precise microstate. A model is psi ontic if distinct quantum states correspond to disjoint distributions, meaning that the underlying physical state lambda uniquely determines the quantum state psi.

  Your primary error, and the source of much of your disagreement, lies in equating the technical definition of psi ontic with the claim that the wavefunction is a physical object or field. The framework defines psi ontic merely as the condition that the quantum state is uniquely fixed by the underlying reality, not that the quantum state is itself a material constituent of that reality. Your friend was correct on this first point. For instance, in Bohmian mechanics, which is classified as psi ontic under this framework, the wavefunction is often interpreted nomologically, meaning it acts more like a law of motion guiding the particles rather than a physical field existing in space alongside them. If you insist that psi ontic implies the wavefunction is a concrete physical thing, you are adding a metaphysical layer that the theorem does not support. Your instinct that if the quantum state is not information it must be a physical thing is a false dichotomy that has led you astray. There are other categories available, such as the nomological view mentioned above, or dispositional views where the state represents a propensity rather than a thing or a knowledge state. The theorem forces you to accept that the state is fixed by the underlying reality, but it remains silent on the metaphysical category of that fixation.

  Regarding your claim that the theorem assumes only that systems prepared independently have independent physical states, your use of the word only is defensible insofar as the Preparation Independence Postulate is the crucial additional assumption beyond the framework itself, but you must recognize how heavy a lift that assumption is. The argument assumes the ontological models framework is valid, which already presupposes a form of realism about underlying states, and it assumes that if you prepare two systems separately, their underlying physical states are uncorrelated. This independence assumption is doing almost all the work in the proof. If you deny this premise, for example by positing that preparation devices share hidden variables or that there are holistic constraints on the universe that prevent true independence, you can maintain a psi epistemic model. Your friend's third reply, comparing PBR to Bell's theorem, is defensible in the weak sense that both are no go theorems deriving a contradiction between quantum predictions and a class of realist models supplemented by a specific independence assumption. However, he is wrong if he intends to suggest that no interpretive news has been delivered. Bell's theorem constrains locality, while PBR constrains the overlap of states under preparation independence. It does deliver news by narrowing the viable options for realist interpretations, even if it does not settle the metaphysics entirely.

  Your friend's second reply regarding QBism is a legitimate point and not a retreat into immunity, despite your accusation of moving the goalposts. The ontological models framework assumes that there is an observer independent underlying state lambda about which probabilities are defined. QBism explicitly rejects this premise, treating the quantum state as an agent's personal degrees of belief without positing an underlying lambda state at all. A theorem derived within a framework cannot refute a view that rejects the framework's foundational assumptions. To say QBism is untouched is not to grant it special immunity but to acknowledge that the theorem's scope is limited to realist models that accept the Harrigan Spekkens definitions. If you wish to argue against QBism, you must challenge its anti realism directly rather than invoking a theorem that presupposes realism. Your friend was right to point out that the theorem is silent on the reality of the wavefunction for those who do not accept the existence of the underlying ontic state in the first place.

  In summary, the theorem licenses you to say that any realist model satisfying the preparation independence postulate must treat distinct quantum states as corresponding to disjoint underlying physical states. It does not license you to say that the wavefunction is a material object, nor does it refute interpretations that reject the existence of an underlying observer independent reality.
