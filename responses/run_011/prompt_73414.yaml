answer: |-
  The procedure hinges on distinguishing whether a sentence claims to describe recorded facts or to speculate on unobserved outcomes.

  ### Conditional Triage Procedure (15-Minute Run)

  1.  **Isolate the Claim:** Underline the "if" clause (the condition) and the "then" clause (the outcome).
  2.  **Verify the Condition:** Check the medical record. Did the "if" part actually happen?
      *   **No:** The sentence is a counterfactual. You must use "had been" and "would have." If the draft uses "was" or "were," **strike and rewrite**.
      *   **Yes:** The sentence is indicative. Ensure the outcome is also recorded fact. If the outcome is unknown, **recast as a statement about records** (e.g., "The record does not show...").
  3.  **Assess Certainty:** [Judgment Call] Look at the evidence linking the condition to the outcome. Is it a physical law (e.g., gravity) or a human/system process?
      *   **Human/System Process:** You cannot prove certainty. Downgrade "would" to "**might**" or "could."
      *   **Physical Law:** "Would" is permissible only if the condition is verified.
  4.  **Block Logical Reversals:** Check the executive summary. Does it infer the condition from the outcome (e.g., "Outcome didn't happen, so Condition didn't happen")?
      *   **Blocked Move:** **Speculative Modus Tollens**. If the conditional is speculative ("might"), you cannot use the outcome to prove the condition false. **Strike the inference.**
      *   **Blocked Move:** **Denying the Antecedent**. Do not write "If the condition had not happened, the outcome would not have occurred." **Strike.**
  5.  **Check Background Stability:** [Judgment Call] Does the sentence assume everything else stayed the same (e.g., staffing, alertness, equipment status)?
      *   **Disagreement:** If experts disagree on what else would have changed, **flag for human review**. Do not draft a conclusion.
  6.  **Final Compliance Scan:** Ensure no sentence implies a causal link stronger than the evidence supports. If the link is probabilistic, use "associated with" instead of "caused."

  ***

  ### Application to Live Drafts

  **1. "If the second nurse had been present at handover, the wrong-site mark would have been noticed."**
  *   **Step 2 (Verify):** Condition is false (nurse was not present). Mood is correct ("had been"/"would have").
  *   **Step 3 (Certainty):** Evidence is statistical (8/11 shifts), not causal law. Human attention is not deterministic.
  *   **Action:** **Downgrade.** Rewrite as: "If the second nurse had been present, the wrong-site mark *might* have been noticed."
  *   **Reasoning:** The evidence supports probability, not certainty.

  **2. "If the unit had been staffed to establishment that night, the error would not have reached the patient."**
  *   **Step 2 (Verify):** Condition is false (unit was not staffed). Mood is correct.
  *   **Step 3 (Certainty):** Staffing levels correlate with safety but do not guarantee specific error interception. This is a capital request line, inviting scrutiny.
  *   **Step 5 (Background):** [Judgment Call] Assumes the extra staff member would have been the one to intercept *this* specific error.
  *   **Action:** **Downgrade and Recast.** Rewrite as: "Adequate staffing *might* have prevented the error from reaching the patient," or "Staffing levels were below establishment."
  *   **Reasoning:** Cannot claim certainty for a capital request based on speculative causality.

  **3. Pair: "If the interlock had been defeated, the press would have cycled" / "If the interlock had been defeated with the guard in place, it would not have."**
  *   **Step 2 (Verify):** Both are counterfactuals.
  *   **Step 5 (Background):** [Judgment Call] The two sentences fix different background conditions (guard status). They contradict unless the guard status is clarified in the record.
  *   **Action:** **Flag for Human Review.**
  *   **Reasoning:** This is a disagreement about how much of the background we hold fixed. The facilitator cannot resolve the mechanical contradiction without engineering input.

  ***

  ### What This Procedure Cannot settle
  This triage cannot determine actual causation or liability. It ensures linguistic precision and logical consistency, but it cannot resolve disputes about complex system mechanics, the ultimate truth of counterfactual claims, or legal responsibility for the outcome. Those determinations require expert testimony and legal review, not drafting protocol.
