prompt: |-
  Ok so I'm in a book group and there's this one guy who drops Wittgenstein's "The limits of my language mean the limits of my world" constantly, always as a conversation-ender, and always as though it settles the Sapir-Whorf thing in the strong direction. Last week he used it for two different arguments inside ten minutes: first, that because English has no word for a certain Portuguese feeling (saudade, I think) English speakers literally can't have that feeling, and second, that you can't really translate poetry because the target language's limits are different limits.

  I want to push back without just saying "that's not what he meant" (also, no idea what he meant). Can you lay out the distinct precise claims that one sentence could be making — from the ones that are trivially true all the way to the wildly strong ones — and give a verdict on each: plausible, false, or too vague to assess? For each reading, say which of his two arguments it would actually licence, if either, and then tell me which reading you think is in his head in each case, since they're obviously not the same. And separately: does the line even concern the differences between one natural language and another where Wittgenstein puts it, or is the borrowing already suspect before we get to any of that? Bullet list please, I want to be able to read it straight off at the next meeting.
