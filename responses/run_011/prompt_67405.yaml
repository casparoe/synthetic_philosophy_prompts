          *   Option A: $M$ is identical to $P$ (Reductionism/Physicalism).
          *   Option B: $M$ is distinct from $P$. If distinct, and $P$ already causes $P^*$, then $M$ is causally redundant. If $M$ also causes $P^*$, we have systematic overdetermination (two sufficient causes for every effect). Kim says this is untenable.
