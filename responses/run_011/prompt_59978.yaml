  **UNIVERSITY OF CAUSAL INTEGRITY**
  **Sleep & Decision Sciences Laboratory**
  **Participant Information Sheet: Protocol 882-U**

  **Principal Investigator:** Dr. Elara Vance
  **Ethics Review:** Board of Pre-Commitment Standards
  **Funding:** The Counterfactual Grant Initiative

  **1. What you will be told**
  You will be told everything that will happen to you. To ensure ethical compliance under Updateless Decision Theory, this document describes the policy you are adopting before you observe any specific outcomes. Your prior probability distribution is hereby defined as: a fair coin toss (50% Heads, 50% Tails). You must maintain this prior regardless of subsequent sensory input. Updating on new evidence is prohibited during the study period. The study will take place at a time during which you are present. Consent is valid only if given before the coin flip occurs, binding all subsequent instantiations of your decision algorithm.

  **2. Study Procedures**
  You will be assigned to one of three arms. All arms involve a coin flip occurring after you enter the facility but before you select your policy. The procedure is well-defined only once the prior is nailed down.

  *Arm A (Sleeping Beauty):* If Heads, you will be awakened once. If Tails, you will be awakened twice with memory wiped between awakenings. You will be asked to credence the coin state. You are reminded that your current awakening provides no evidence regarding the coin, as your policy was selected before the flip. Your answer must reflect the prior probability, not the frequency of awakening.

  *Arm B (Counterfactual Compensation):* A coin is flipped. In this branch, we request $100 from you. The justification for this request is that had the coin landed differently, your counterpart in that branch would have received $10,000 contingent on your compliance here. The $10,000 exists in a branch you are not standing in. You are being asked to pay based on the utility of the global policy, not the local outcome. Refusal here nullifies the reward there.

  *Arm C (Duplication):* A copy of you will be made. Both versions will complete identical paperwork. It is not relevant which version signs this form. The signature binds the algorithm that produced you, not the physical instance holding the pen. Both copies are equally responsible for the consent given.

  **3. Risks and Discomforts**
  You may experience distress stemming from indexical uncertainty. You will know the protocol, but you will not know which instance of the protocol you are currently experiencing. This is a feature of the design. You may feel that you have lost money in Arm B without receiving the counterpart reward. This feeling is an error in conditioning. You may feel confused about whether you are the original or the copy in Arm C. This confusion is necessary for the study validity. No psychological support is available for errors arising from correct decision theory.

  **4. Who is consenting?**
  Section 4 explains who is signing and why the lab doesn't consider that a question it can answer. You are signing as the source code responsible for all outputs across all branches. Whether you are the original or the copy is information you do not need to execute the policy. Identity is treated as a constant across the multiverse of this study. The lab does not track individual continuity because continuity is not required for policy binding. You are consenting on behalf of every version of you that exists in the probability tree.

  **5. Questions participants often ask**
  *Q: Am I the first awakening or the second?*
  A: That would be indexical information and we're not allowed to give it to you.

  *Q: Did the coin land Heads or Tails?*
  A: That would be indexical information and we're not allowed to give it to you.

  *Q: Am I the original or the copy?*
  A: That would be indexical information and we're not allowed to give it to you.

  *Q: When will I know the results?*
  A: That would be indexical information and we're not allowed to give it to you.

  **6. Contact Information**
  If you have questions about your rights as a policy, contact Dr. Vance. Do not contact us to inquire about your location in the probability tree. We cannot answer questions that require conditioning on your current state. All complaints will be processed according to the policy selected at the start of the study.

  **Participant Signature**
  By signing below, I agree to bind all future instances of myself to this policy. I acknowledge that my current observations do not update my prior. I understand that refusal in this branch may result in negative outcomes for my counterparts in other branches. I waive the right to condition my consent on my specific awakening or branch. I accept that the money justifying my payment sits in a branch I am not standing in.

  ___________________________
  **Signature of Policy-Selector**

  ___________________________
  **Date (Prior to Observation)**

