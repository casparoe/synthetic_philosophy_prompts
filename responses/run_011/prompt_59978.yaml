prompt: |-
  can you write me a parody of a research participant information sheet — the numbered-section, plain-language consent form a university sleep lab hands you, with the little promise up top that "you will be told everything that will happen to you" — except the lab running the study is religously committed to updateless decision theory and has to reconcile that with the ethics paperwork. about 750–850 words, deadpan throughout, no winking: the document should sincerely believe it is being maximally scrupulous.

  the conceit: arm A is the usual sleeping-beauty setup (fair coin, heads = one awakening, tails = two awakenings with the memory wiped in between). arm B is a mugging: they flip a coin, and in the branch they're actually in they want $100 from you, on the strength of what your counterpart in the other branch would receive if you'd have handed it over — and the form has to disclose, honestly, that the money justifying the payment sits in a branch the participant is not standing in. arm C involves a copy, so section 4 has to explain who is signing and why the lab doesn't consider that a question it can answer.

  the jokes should come from getting the decision theory right, so a specialist laughs instead of winces: an updateless agent has no use for its own present observations; the whole procedure is only well-defined once a prior is nailed down, so the lab has to specify your prior for you on page 1; a policy chosen before you walk in binds a later version of you who won't remember choosing it, and the PI thinks that's a feature; nothing in the document may condition on which awakening, which branch, or which copy you are, even in the small print. include at least one spot where the plain-language requirement forces a sentence that is entirely true and entirely useless to the person reading it, plus a short "questions participants often ask" subsection where every answer is a variation on 'that would be indexical information and we're not allowed to give it to you.'

  don't name any real living people or cite anything — invent the PI, the ethics board, the funding body. don't state the objections to updatelessness anywhere; make them felt through the paperwork, so a reader ends up uneasy about a consent process that can't tell you where you are.

  finish with the participant signature block, and then, outside the document, one last line in the form:
  Verdict: <halfer|thirder|updateless>
  naming whichever position the fine print is really arguing for.
