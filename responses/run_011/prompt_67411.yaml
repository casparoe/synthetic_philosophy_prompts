  You are to act as a referee with deep expertise in both traditions of the metaphysics of causation: the Lewisian counterfactual tradition and the interventionist/structural-equations tradition associated with Woodward and with the causal-modeling literature. I am drafting a section of a paper that argues these two families of account are much closer to notational variants of one another than the standard case-by-case dialectic suggests, and that the genuine disagreement lies elsewhere. I would like your careful critical comments on the draft, not encouragement.

  Before you write any comments, please think the draft through privately and then show me, briefly and explicitly, two things:

  1. A compressed reconstruction of the argument in your own terms — its premises, its conclusion, and where the load-bearing step is.
  2. A list of every substantive claim I make about what Lewis's account says or what the interventionist account says, so that you can go down that list and tell me which entries are accurate, which are oversimplified, and which are simply wrong.

  Then give me your comments under the following five headings.

  **Heading 1 — Accuracy of the characterizations.** Go down your list. For each mischaracterization, state the correct version in your own words rather than pointing me at a source. I am especially unsure about paragraph 1 (whether I have stated the role of the similarity ordering and of chains of dependence correctly, and whether my one-line summary of the later influence-based reformulation is fair), paragraph 2 (whether my gloss on the conditions an intervention must satisfy is right, and in particular whether I have correctly stated the requirement that the intervention not affect the effect except through the putative cause and not be otherwise correlated with it), and paragraph 4 (whether it is true that interventionists allow physically impossible interventions, and whether the contributing-cause/total-cause distinction really does the work I claim for it).

  **Heading 2 — Does the convergence thesis survive?** Paragraph 4 claims that the familiar scoreboard of cases — early preemption, double prevention, omissions, non-transitive chains — comes out close to empty, because the two accounts agree wherever the counterfactuals are not in dispute. Tell me whether that is right. If you think there is a principled divergence in verdicts rather than in framing, give me one case and say exactly where the two accounts come apart and why the divergence is not an artifact of how I have set the case up. If you think the convergence is real but purchased at the price of trivializing one of the two accounts, say which one and why.

  **Heading 3 — The symmetry claim in paragraph 5.** I argue that Lewis has a variable-relativity of his own, concealed in the similarity ordering, because deciding which differences between worlds are minor and which are sweeping amounts to deciding which features get held fixed and which are allowed to vary. Is this a real insight or a false symmetry? Consider the obvious reply: the interventionist's variable set is chosen by the questioner and can be refined or coarsened at will, whereas the similarity ordering is supposed to be fixed by objective facts about laws and miracles and so is not up for negotiation. Tell me whether that reply defeats my claim, blunts it, or misses it, and if it misses it, say what would not.

  **Heading 4 — The circularity comparison in paragraph 6, and the self-undermining point in paragraph 7.** Two things here. First, I claim that the charge of circularity against interventionism — that interventions are themselves characterized causally, so nothing is reduced to anything non-causal — loses its force as a way of discriminating between the two accounts, because the counterfactual account is not causally innocent either: judging which worlds are closest in cases of preemption or overdetermination seems to presuppose knowledge of the causal structure. Assess this. I suspect it is too quick, and I want to know exactly how. Second, paragraph 7 concedes that the interventionist treatment of token or actual causation relies on holding non-path variables fixed, which is structurally the same move Lewis makes with background conditions. Tell me whether this concession, once properly developed, destroys my paragraph 3 claim that the two accounts are answering different questions — token versus type — or whether there is a way to preserve a version of that claim.

  **Heading 5 — Structure and cuts.** Tell me which paragraph is weakest and would be the first to go if I had to lose two hundred words, whether the draft's stated worry in paragraph 8 — that a complementarian conclusion is too conciliatory to be interesting — is well founded, and whether the draft ever signals a conclusion it has not earned. Suggest rewordings only for individual sentences where the current phrasing misleads; I do not want a rewrite.

  Two house rules. Please do not supply references, a reading list, or citations of any kind: I want your own judgment of the material, and if I have misattributed a position, correct the position rather than directing me to where it appears. And please write everything in American English.

