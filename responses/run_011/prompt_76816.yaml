answer: |-
  This is a classic move in philosophy of biology, often called the "Popperian Objection," and your intuition is correct: it relies on equivocation. The phrase "Survival of the fittest" is doing too much work in that sentence.

  Here is the menu you can bring to the reading group. It disentangles the five distinct claims usually bundled into "It's a tautology," evaluates them, and identifies which one is required to kill the jealousy hypothesis.

  ### The Menu: Five Meanings of "It's a Tautology"

  **1. The Definitional Claim**
  *   **The Claim:** "Fitness" is *defined* as "reproductive success." Therefore, the statement "Those who reproduce most are those who reproduce most" is true by definition.
  *   **Verdict:** **False (in modern biology).**
  *   **Why:** In contemporary evolutionary theory, fitness is not defined as *actual* reproductive success (which is retrospective); it is defined as a *propensity* or probability to survive and reproduce given a specific environment and phenotype. If a very fit individual gets struck by lightning, they have high fitness (propensity) but low success (actuals). The statement becomes a probabilistic empirical claim, not a definition.
  *   **Usage:** This is **Party Talk**. It's the most common version because it requires the least knowledge of biology.

  **2. The Framework Claim**
  *   **The Claim:** Natural selection is not an empirical law like gravity, but a necessary conceptual framework (a "research programme") that organizes biological data. It is "true" in the way a definition is, but useful.
  *   **Verdict:** **Substantive and Defensible.**
  *   **Why:** This is roughly Popper's later position. It suggests evolution is the *logic* of biology, not a specific prediction within it. It doesn't make the theory useless; it makes it foundational.
  *   **Usage:** This is **Philosopher Talk**. It's sophisticated, but it doesn't invalidate the theory; it reclassifies it.

  **3. The Unfalsifiability Claim**
  *   **The Claim:** No possible observation could count against the theory. If a trait persists, it was fit; if it vanishes, it was unfit. There is no condition under which the theory says "This should not happen."
  *   **Verdict:** **False.**
  *   **Why:** Evolutionary theory makes many falsifiable claims (e.g., about the fossil record, genetic relatedness, or the impossibility of certain complex traits arising without intermediate steps). If we found rabbit fossils in the Precambrian, the theory would be in deep trouble.
  *   **Usage:** This is **Argument Talk**, but it is factually incorrect regarding modern synthesis evolutionary biology.

  **4. The Post Hoc Claim**
  *   **The Claim:** We only assign "fitness" values *after* seeing who survived. Therefore, we cannot predict outcomes in advance, only explain them after the fact.
  *   **Verdict:** **Substantive Critique of *Bad* Adaptationism.**
  *   **Why:** This is the strongest version of the objection. It argues that while the *mechanism* might be real, specific adaptationist *stories* (like the jealousy story) are often constructed to fit the data rather than predict it.
  *   **Usage:** This is the **Argument Killer** (if it applies). This is the only version that threatens specific hypotheses.

  **5. The Explanatory Vacuity Claim**
  *   **The Claim:** Even if the statement is true, it explains nothing. Saying "Jealousy exists because it was fit" adds no information.
  *   **Verdict:** **False.**
  *   **Why:** It explains the *persistence* of the trait relative to alternatives. It identifies the causal mechanism (differential reproduction) responsible for the trait's frequency.
  *   **Usage:** This is **Party Talk**. It confuses "explains the origin of the variation" (which selection doesn't do) with "explains the frequency of the trait" (which it does).

  ---

  ### Which One Kills the Jealousy Story?

  To dismiss the specific hypothesis about human jealousy, your colleague needed **Claim 4 (The Post Hoc Claim)**.

  *   **Claim 1 (Definition)** fails because even if the general principle is definitional, the *application* to human jealousy is empirical. (See below).
  *   **Claim 2 (Framework)** actually saves the theory, it doesn't kill it.
  *   **Claim 4** is the only one that suggests the *specific story* is untestable. If the only evidence for the jealousy adaptation is that jealousy exists, then the argument is indeed circular: "Why do we have jealousy? Because it was fit. How do we know it was fit? Because we have it."

  **However,** pointing out that "Survival of the fittest" is tautological does not prove that the *jealousy hypothesis* is post hoc. The jealousy hypothesis stands or falls on whether it generates independent testable predictions (e.g., about sex differences in jealousy, physiological responses, or cross-cultural universals), not on the status of the general principle of selection.

  ### Does the Tautology Charge License Dismissing Specific Hypotheses?

  **No.** Your suspicion is correct. This is a **Scope Error** (specifically, a confusion between a *schema* and a *model*).

  *   **The Gap:** The general principle of natural selection is a schema: *If* there is variation, heritability, and differential reproduction, *then* traits associated with reproduction will increase in frequency.
  *   **The Application:** The jealousy hypothesis is a model: "In the Environment of Evolutionary Adaptedness (EEA), variation in jealousy existed, it was heritable, and it led to differential reproduction."
  *   **The Logic:** Even if the *schema* is analytic (true by definition of the terms), the *model* is synthetic (empirical). You are claiming the *conditions* of the schema were met in a specific historical case.
      *   *Analogy:* $F=ma$ might be considered a definitional framework for classical mechanics. But the claim "A force of 5N was applied to this specific block" is an empirical claim. You cannot dismiss the measurement of the block by arguing that $F=ma$ is a definition.

  Your colleague committed a **Fallacy of Division**: assuming that because the general principle has a certain property (analyticity/tautology), the specific instance (the jealousy story) must share that property (unfalsifiability). It does not. The jealousy story is falsifiable if it makes predictions about the *structure* of the jealousy mechanism that could have been otherwise.

  ### The Friend's Beetle Test

  > *"If it's really tautological, you shouldn't be able to predict in advance which of two beetle strains will leave more offspring... and if you can predict it, it's not tautological."*

  **Verdict:** This test **confuses the status of a principle with the status of its instances.**

  1.  **It doesn't settle the tautology question:** You can derive predictions from tautologies if you combine them with empirical premises.
      *   *Premise 1 (Tautology/Definition):* The strain with the higher propensity to reproduce will (probabilistically) leave more offspring.
      *   *Premise 2 (Empirical):* Strain A has a higher propensity to reproduce in this environment (based on measured metabolic efficiency, camouflage, etc.).
      *   *Prediction:* Strain A will leave more offspring.
      *   The prediction works, but Premise 1 can still be definitional. The predictive power comes from Premise 2, not Premise 1.

  2.  **What it actually shows:** The test successfully demonstrates that **Evolutionary Biology is an empirical science.** It shows that we can measure fitness *independently* of survival (e.g., by measuring physiological efficiency). This defeats **Claim 1 (The Definitional Claim)** from the menu above.

  3.  **Why it fails as a total settlement:** It shows that *fitness* is not just a label we slap on survivors. It does not prove that every *adaptationist story* (like the jealousy one) is testable. You can have a science that is empirical overall (beetle strains) while containing specific untestable hypotheses (just-so stories about Pleistocene psychology).

  ### Summary for the Meeting

  1.  **Acknowledge the grain of truth:** The phrase "Survival of the fittest" is sloppy. Biologists prefer "Natural Selection," and fitness is a propensity, not a body count.
  2.  **Isolate the target:** The tautology charge against the *general principle* (even if true) does not invalidate *specific hypotheses*.
  3.  **Shift the burden:** The question isn't "Is Darwinism a tautology?" The question is "Does the jealousy hypothesis make predictions independent of the fact that jealousy exists?"
  4.  **The Popper Point:** Popper eventually recanted the idea that Darwinism is *merely* a tautology. He recognized it as a metaphysical research programme that generates testable scientific theories. Your colleague is using a 1970s Popper quote to kill a 2020s biological discussion.

  If you want to move the group forward, suggest that you treat the "tautology" objection as resolved (it's a known philosophical puzzle with standard solutions) and return to the actual evidence for the jealousy hypothesis. The tautology argument is a conversation stopper, not a truth-maker.
