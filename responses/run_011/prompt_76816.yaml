      *   *Claim 1: Definitional Tautology.* Fitness = Reproductive Success. Therefore, "Those who reproduce most, reproduce most."
      *   *Claim 2: Necessary Truth / Framework.* Like $F=ma$. It organizes research but isn't an empirical law itself. (Popper's later view).
      *   *Claim 3: Unfalsifiable in Principle.* No observation could count against it.
      *   *Claim 4: Post Hoc Explanation.* We assign fitness values only after seeing who survived.
      *   *Claim 5: Explanatory Vacuity.* It's true but explains nothing.

  3.  **Evaluate Each Claim (Platitude, Substantive, False):**
      *   *Claim 1 (Definition):* Substantive/True in a narrow sense, but often overstated. Fitness isn't *just* actual offspring; it's propensity.
      *   *Claim 2 (Framework):* Substantive/Defensible. This is the "research programme" view (Lakatos/Popper).
      *   *Claim 3 (Unfalsifiable):* False regarding modern evolutionary theory (which includes genetics, drift, etc.), but maybe true of the *phrase* in isolation.
      *   *Claim 4 (Post Hoc):* Substantive critique of *bad* adaptationism, but false of good evolutionary biology (which predicts based on traits).
      *   *Claim 5 (Vacuity):* False. It explains *why* traits persist, given variation and heritability.

  4.  **Identify "Party Talk" vs. "Argument Killer":**
      *   *Party Talk:* Usually Claim 1 or 5 ("It explains nothing").
      *   *Argument Killer:* To dismiss the jealousy story, he needs Claim 4 (Post Hoc/Unfalsifiable specific hypothesis). Merely saying the *general principle* is a tautology doesn't kill a *specific* model unless that model relies solely on circular reasoning.

  5.  **Address the "Specific Adaptationist Hypothesis" Question:**
      *   Does the tautology charge kill the jealousy hypothesis?
      *   *Answer:* No. This is the scope error. The general principle (natural selection) provides the *mechanism*. The specific hypothesis (jealousy increased fitness in EEA) makes empirical claims about psychology, environment, and reproductive outcomes.
      *   *The Gap:* Confusing the *principle of selection* with a *specific selectionist explanation*. Even if the principle is analytic, the application is synthetic.

