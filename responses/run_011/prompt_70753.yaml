answer: |-
  This is a precise and significant observation. You have identified a friction point between the sociology of scientific practice and formal epistemology that is often felt in the laboratory but rarely named in the literature. The phenomenon is real, but the specific *temporal* aspect you highlight—the backward travel of the threshold—is not the primary focus of the standard debates.

  Here are the answers to your three questions, structured to match the precision of your inquiry.

  ### 1. Is there an established concept for the backward-looking part?

  There is no single established term that captures the *retroactive* reclassification driven specifically by *stakes* without *new evidence*. However, there are two adjacent concepts in the literature that approximate it. You should understand how your phenomenon differs from them to ensure you are not merely rediscovering them.

  **A. Pragmatic Encroachment**
  *   **The Concept:** Primarily associated with Jeremy Fantl, Matthew McGrath, and Jason Stanley. This is the view that whether a subject *knows* a proposition depends not only on truth, belief, and justification, but also on the practical stakes of being wrong. (e.g., You might "know" the bank is open on Saturday for a casual deposit, but not "know" it if a check will bounce otherwise).
  *   **The Difference:** Standard Pragmatic Encroachment is **synchronous**. It explains why *you* might not claim knowledge *now* that *I* claim *now*, given our different stakes. It does not typically license the claim that *I* did not know it *then*, unless the stakes *then* were also high. Your observation is **diachronic**: the stakes *now* are rewriting the epistemic status of the *past*.

  **B. Epistemic Contextualism**
  *   **The Concept:** Associated with Keith DeRose and David Lewis. This holds that the word "knows" changes its semantic content depending on the context of the *attributor*. In a "low standards" context, "I know" is easy to satisfy; in a "high standards" context (e.g., a courtroom), it is hard.
  *   **The Difference:** Contextualism is usually **protective of the past**. A Contextualist would say: "In the 1970s context, the standards were lower, so they *did* know it then. In our 2006 context, the standards are higher, so we *do not* know it now." Your colleagues are making a stronger claim: "We *never* knew it." This rejects the Contextualist protection of the past verdict.

  **C. Whiggish History (History of Science)**
  *   **The Concept:** Interpreting past science in terms of present-day knowledge and standards.
  *   **The Difference:** Whiggish history usually judges the past by present *methodological* or *theoretical* standards (e.g., "They didn't know it because they lacked mass spectrometry"). Your phenomenon judges the past by present *consequential* standards (e.g., "They didn't know it because we now regulate this, so the bar for 'knowing' was always higher than they realized").

  **Conclusion for Q1:** The nearest concept is **Pragmatic Encroachment**, but your observation identifies a specific temporal variant that the literature has largely neglected. The literature discusses how stakes affect *current* attribution; you are describing how stakes affect *historical* attribution.

  ### 2. Which commitment does the practice carry?

  When your collaborator says, "We never knew it," he is making a metaphysical commitment about the nature of knowledge and stakes. He is not merely saying, "We would not assert it today."

  **The Commitment: Stakes Invariantism**
  By claiming "we *never* knew," your collaborator is acting as an **Invariantist** regarding the threshold of knowledge. He is committed to the view that the relevant stakes are not properties of the *knower's situation* (which change over time), but properties of the *proposition's subject matter* (which are timeless).

  *   **Reading A (The Standard Moved):** "The 1979 verdict was correct by 1979 standards." This is **Contextualism**. If your collaborator held this, he would say, "It was sufficient for then, but not for now." He does not say this.
  *   **Reading B (Knowledge is Fixed):** "The stakes inherent to this toxicological claim are high. They were high in 1979, even if we ignored them. Therefore, the evidence in 1979 was insufficient *even then*." This is **Invariantism**.

  **Does the position on Instance 3 constrain Instance 1 & 2?**
  Yes.
  *   In **Instance 3** (Researcher vs. Engineer), if you accept that both are reasoning properly, you are accepting **Contextualism** (the word "solid" shifts meaning based on the decision context).
  *   In **Instance 1 & 2**, if you accept the collaborator's claim ("We *never* knew"), you are accepting **Invariantism** (the threshold is fixed by the maximum possible stakes, regardless of the era).

  You cannot consistently hold that the Engineer is right to call the data "suggestive" *while* the Researcher is right to call it "solid" (Contextualism), *and* that the 1970s scientists were wrong to call it "known" because the stakes are actually high (Invariantism).
  *   If you side with the **Engineer** (High Stakes define the truth of "solid"), you must side with the **Collaborator** (High Stakes always defined the truth of "known").
  *   If you side with the **Researcher** (Low Stakes allow "solid"), you must defend the **1970s Scientists** (Low Stakes allowed "known").

  The practice of saying "We never knew" carries the commitment that **practical consequences constitute the truth-conditions of knowledge claims, and those consequences are timeless properties of the world, not temporary properties of our regulatory environment.**

  ### 3. A Coined Term, Definition, and Boundary Conditions

  Since the existing literature treats the stakes as synchronous with the knower, and you have identified a diachronic reclassification, I propose the following term.

  **Term:** **Retroactive Epistemic Tightening (RET)**

  **Definition:**
  Retroactive Epistemic Tightening is the reclassification of a past scientific verdict from "established" to "insufficient" (or "unknown"), driven exclusively by an increase in the practical stakes associated with the proposition's truth, occurring without the introduction of new empirical data, the discovery of procedural error, or a change in general methodological capability.

  **Boundary Conditions (The "Edge" of the Phenomenon):**
  To determine if a case in your career counts as RET or something else, apply these four tests. If any fail, it is not RET.

  1.  **The Stability of Evidence Condition:**
      *   *RET:* The raw data, calibration records, and statistical treatment from the original study remain valid and unchallenged *for the original purpose*.
      *   *Not RET:* New instruments show the old data were inaccurate; a confounder is discovered; a calculation error is found. (This is ordinary error correction).

  2.  **The Volatility of Stakes Condition:**
      *   *RET:* The change in verdict correlates directly with a change in consequence (e.g., the transition from "academic curiosity" to "regulatory limit," or "research hypothesis" to "production halt").
      *   *Not RET:* The field simply decides it prefers Bayesian methods over Frequentist ones, or prefers different confidence intervals as a matter of stylistic taste. (This is methodological progress).

  3.  **The Temporal Reversal Condition:**
      *   *RET:* The language used denies the past status ("It was *not* known") rather than qualifying the present status ("We *no longer* accept it"). The threshold is treated as having *always* been at the current high level.
      *   *Not RET:* Acknowledging that "Standards have risen since then." (This is historical contextualization).

  4.  **The Specificity Condition:**
      *   *RET:* The tightening applies only to claims that have acquired high stakes. Other claims from the same era, using the same methods, but lacking high stakes, retain their "known" status.
      *   *Not RET:* A general declaration that "Science in the 1970s was sloppy." (This is generational bias).

  **Application to Your Instances:**
  *   **Instance 1:** Passes all four. Data stable; Stakes rose (regulation); Language is retroactive ("not known at the time"); Specific to the regulated element. **Verdict: RET.**
  *   **Instance 2:** Passes all four. Data stable; Stakes rose (liability/consensus); Language is retroactive ("never known"); Specific to that class of compounds. **Verdict: RET.**
  *   **Instance 3:** This is the **synchronous precursor** to RET. It is not RET itself because it is not looking backward. It is **Pragmatic Encroachment**. However, if the Engineer's view becomes the dominant standard, and five years later they say the Researcher "never had solid data," that future statement would be RET.

  **Why this distinction matters:**
  Identifying RET allows you to distinguish between **scientific progress** (we know more now) and **risk management** (we can afford less error now). In your first two instances, science did not advance; the *cost of being wrong* increased. Recognizing RET prevents the unfair calumny of past practitioners who met the standards of their risk environment, while validating the necessity of the stricter standards in the new risk environment. It allows you to say: "They were not wrong; the world changed around the data."
